prompt: |-
  I have been asked to advise the board of the public school district that hosts my university's teacher-training program, and I want to be sure I audit the argument the superintendent is actually making rather than the one it resembles. The board is deadlocked over whether promotion from eighth to ninth grade should turn on a single standardized exam. Rather than settle that, the superintendent proposes a four-year "parallel pilot": half the district's middle schools keep the exam gate, half replace it with a portfolio review conducted by teachers; every school reports annually to a common dashboard (ninth-grade course completion, subsequent test scores, attendance, dropout); and the board then adopts whichever version scores better, revisiting the question every four years thereafter. She presents this as taking Dewey seriously: inquiry begins in an indeterminate situation and resolves it by acting on the world and attending to what follows, so we do not need a prior account of what promotion is for — the experiment will tell us. Please audit the analogy, not the policy.

  Give me, in this order and at roughly these lengths: "The mapping" — a table of what is supposed to play the role of hypothesis, treatment group, control group, random assignment, replication, outcome measure, experimenter's standpoint, subjects, and closure, plus about 120 words on where the mapping is doing real work; "Where it holds" (about 120 words); "Disanalogies that matter for the use being made" (about 300 words: for each, say which step of her argument it undercuts — note in particular that the schools are not exchangeable units, that the units are cohorts rather than repeatable trials, that the dashboard's measures are not independent of the treatment and appear to presuppose one contested answer about what promotion is for, that the costs of a failed "trial" fall on children who cannot be re-run, and that there is no standpoint outside the dispute from which the results simply speak); "Disanalogies I should ignore" (about 100 words); "The strongest reply from inside the view" (about 150 words — I have in mind the claim that in social inquiry the fact that those affected are also the inquirers is a virtue, not a defect, since the public constitutes itself through inquiry; tell me what granting that costs the epistemic work the analogy was doing); "Does the conclusion survive?" (about 200 words, separating the weak claim that deliberate iteration beats deadlock from the strong claim that iteration can replace settling the end in advance, and specifying what would have to be supplied for the strong claim to be licensed — including whether pre-registering the dashboard before the pilot begins helps, and why or why not); and finally "A better analogy, if there is one" (about 150 words — consider whether the familiar federalist image of jurisdictions as laboratories, or something closer to common-law reasoning from precedent, carries more of the argument than the laboratory does).
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Task:** Audit an analogy used by a superintendent to a school board.
      *   **Context:** Board deadlocked on 8th-to-9th grade promotion (exam vs. portfolio). Superintendent proposes a 4-year "parallel pilot" (half schools exam, half portfolio) using a common dashboard to decide later. She invokes John Dewey's pragmatism (inquiry resolves indeterminate situations without prior ends).
      *   **Constraint:** Audit the *analogy*, not the policy itself.
      *   **Structure & Length:**
          1.  "The mapping" (Table + ~120 words on where mapping does work).
          2.  "Where it holds" (~120 words).
          3.  "Disanalogies that matter for the use being made" (~300 words, specific points required: non-exchangeable units, cohorts not repeatable, measures not independent/presuppose ends, costs on children, no external standpoint).
          4.  "Disanalogies I should ignore" (~100 words).
          5.  "The strongest reply from inside the view" (~150 words, focus on public constituting itself through inquiry, cost to epistemic work).
          6.  "Does the conclusion survive?" (~200 words, weak vs. strong claim, pre-registration issue).
          7.  "A better analogy, if there is one" (~150 words, federalist labs vs. common-law).
      *   **Tone:** Analytical, precise, advisory.

  2.  **Deconstruct the Superintendent's Argument:**
      *   **Core Claim:** We don't need to agree on *what promotion is for* (the end) before acting. We can run an experiment (means) and let the results tell us which end was valuable.
      *   **Philosophical Basis:** Deweyan pragmatism (inquiry resolves indeterminate situations).
      *   **Proposed Mechanism:** Parallel pilot (RCT-like structure), common dashboard, iterative review.
      *   **Analogy:** Scientific experimentation (laboratory model).

  3.  **Drafting - Section by Section:**

      *   **1. The mapping:**
          *   Need a table: Hypothesis, Treatment, Control, Random Assignment, Replication, Outcome Measure, Experimenter's Standpoint, Subjects, Closure.
          *   Need ~120 words commentary on where the mapping works.
          *   *Drafting Table:*
              *   Hypothesis: One pathway yields better student outcomes.
              *   Treatment: Portfolio review promotion.
              *   Control: Standardized exam gate.
              *   Random Assignment: School-level split (half/half).
              *   Replication: Annual reporting over four years.
              *   Outcome Measure: Common dashboard (completion, scores, attendance, dropout).
              *   Experimenter's Standpoint: The Board/Superintendent (neutral arbiters).
              *   Subjects: Students/Cohorts.
              *   Closure: Board adopts winner after four years.
          *   *Drafting Commentary:* The mapping does real work by imposing discipline on vague policy preferences. It forces operational definitions of "success" via the dashboard and prevents immediate ideological capitulation. By structuring the disagreement as a testable comparison, it converts a normative stalemate into a procedural commitment. The temporal structure (four years) mimics longitudinal study design, suggesting that evidence accumulates over time rather than appearing instantly. This framing lowers the temperature of the debate by deferring the final verdict, allowing both sides to claim a chance at validation. However, the work is rhetorical and procedural, not strictly epistemic, because the variables cannot be isolated as cleanly as the table suggests.

      *   **2. Where it holds:**
          *   ~120 words.
          *   *Focus:* Genuine empirical uncertainty, comparative data generation, breaking deadlock.
          *   *Draft:* The analogy holds insofar as the district faces genuine empirical uncertainty about downstream effects. Neither side possesses definitive data on how portfolio review versus exam gates affects ninth-grade completion in this specific context. The parallel structure generates comparative data where none existed, moving the debate from speculation to observation. Like a controlled trial, the proposal isolates the variable of promotion mechanism while holding constant broader district resources and curriculum standards. Furthermore, the iterative review mimics scientific replication; annual reporting allows for trend analysis rather than relying on single-year anomalies. This structure successfully transforms a normative clash into a manageable administrative process, creating a shared language of metrics that both factions must engage with, thereby sustaining the inquiry rather than terminating it prematurely.

      *   **3. Disanalogies that matter for the use being made:**
          *   ~300 words.
          *   *Required points:* Schools not exchangeable, cohorts not repeatable, measures not independent/presuppose ends, costs on children, no external standpoint.
          *   *Draft:* First, schools are not exchangeable units like lab mice; socioeconomic disparities between the "half" assigned to portfolios and the "half" kept on exams will confound results, undercutting the claim that the dashboard isolates the promotion mechanism. Second, educational cohorts are not repeatable trials; if the "wrong" method harms a class, that damage is irreversible, violating the ethical reversibility assumed in experimentation. Third, the dashboard measures are not independent of the treatment; choosing "ninth-grade completion" as a metric presupposes that retention is bad, which is precisely what the exam proponents dispute (they may value rigor over completion). This begs the question of what promotion is for. Fourth, the costs of a failed trial fall on children who cannot be re-run, imposing asymmetric risks that laboratory subjects do not bear. Finally, there is no standpoint outside the dispute from which results simply speak; interpreting the dashboard requires valuing certain outcomes over others, meaning the "data" cannot resolve the normative disagreement without prior agreement on what counts as success. The superintendent's claim that inquiry resolves the indeterminate situation without prior ends fails because the design of the inquiry itself encodes contested ends.

      *   **4. Disanalogies I should ignore:**
          *   ~100 words.
          *   *Focus:* Minor technicalities (blinding, exact sample size, lab coats).
          *   *Draft:* Ignore the lack of double-blinding; teachers and students knowing their promotion method is inevitable and does not invalidate the outcome data. Disregard the imperfect randomization at the school level; while statistically noisy, it is the only feasible unit of assignment in public administration. Do not dwell on the small sample size relative to pharmaceutical trials; policy pilots necessarily operate at scale with N=1 districts. Finally, overlook the absence of a pure control group; all students receive some promotion mechanism, which is standard for policy evaluation. These are technical limitations of field research, not fundamental flaws in the analogy's logic regarding inquiry and resolution.

      *   **5. The strongest reply from inside the view:**
          *   ~150 words.
          *   *Focus:* Deweyan public inquiry, public constitutes itself, cost to epistemic work.
          *   *Draft:* A Deweyan defender argues that in social inquiry, the fact that those affected are also the inquirers is a virtue, not a defect. The public constitutes itself through this very process of shared experimentation. By engaging with the dashboard, the board and community refine their values alongside the data. The epistemic work is not merely discovering pre-existing facts but constructing a shared understanding of the common good. However, granting this costs the analogy its scientific authority. If the results are constitutive rather than demonstrative, the dashboard cannot claim to objectively settle the dispute. The "experiment" becomes a deliberative forum, not a truth-machine. This means the superintendent cannot claim the data will speak for itself; she must admit the data requires interpretation grounded in values the board does not yet share. The analogy shifts from proving a policy works to facilitating a moral dialogue, which may not break the deadlock.

      *   **6. Does the conclusion survive?**
          *   ~200 words.
          *   *Focus:* Weak claim (iteration beats deadlock) vs. Strong claim (iteration replaces settling ends). Pre-registration issue.
          *   *Draft:* The weak claim survives: deliberate iteration is superior to permanent deadlock. Trying something and reviewing it is better than doing nothing. However, the strong claim—that iteration can replace settling the end in advance—fails. The dashboard metrics (completion, scores) already settle ends implicitly. To license the strong claim, the board must agree on *why* those metrics matter before starting. Pre-registering the dashboard helps only if it locks in values, not just metrics. If the board agrees now that "ninth-grade completion" is the primary good, the exam proponents lose before data is collected. If they don't agree, the data will be contested later. Pre-registration prevents moving the goalposts but does not solve the value conflict. The superintendent cannot use the pilot to avoid defining success; she can only use it to test which method achieves a success definition the board must negotiate now. The experiment measures efficiency toward ends, not the validity of the ends themselves.

      *   **7. A better analogy, if there is one:**
          *   ~150 words.
          *   *Focus:* Federalist laboratories vs. Common-law.
          *   *Draft:* The federalist image of "states as laboratories" is closer but still implies top-down evaluation. A common-law reasoning analogy fits better. Here, precedents (annual reports) accumulate without a single decisive verdict. Judges (the board) distinguish cases based on context rather than seeking a universal law. This acknowledges that what works in one school context may not hold in another, avoiding the exchangeability problem. It treats the pilot as jurisprudence: building a body of practice that guides future discretion rather than dictating a permanent rule. This captures the Deweyan spirit of continuous reconstruction without promising a scientific closure that education cannot deliver. It shifts the goal from finding the "one true method" to developing prudential judgment, aligning better with the reality that promotion policies require contextual adaptation rather than standardized fixes.

  4.  **Review and Refine:**
      *   Check word counts carefully.
      *   Ensure the tone is advisory to a board member (analytical, critical but fair).
      *   Verify all constraints from the prompt are met (specific disanalogies, specific philosophical replies).
      *   *Self-Correction on Word Counts:* I need to be precise. I will estimate during drafting and adjust.
      *   *Check:* Did I address "pre-registering the dashboard" in section 6? Yes.
      *   *Check:* Did I address "public constitutes itself" in section 5? Yes.
      *   *Check:* Did I address "schools not exchangeable" etc. in section 3? Yes.

  5.  **Final Polish:** (Mental check of the text during generation to ensure flow and adherence to constraints). *Note: The prompt asks for specific lengths. I will aim for tight paragraphs.*

      *   *Mapping Table:* Needs to be clear.
      *   *Mapping Text:* ~120 words.
      *   *Where it holds:* ~120 words.
      *   *Disanalogies:* ~300 words.
      *   *Ignore:* ~100 words.
      *   *Reply:* ~150 words.
      *   *Conclusion:* ~200 words.
      *   *Better Analogy:* ~150 words.

      *Total estimated words:* 120 + 120 + 300 + 100 + 150 + 200 + 150 = 1140 words + table.
      *Let's write.*

      *Refining Section 3 (Disanalogies):* Make sure to explicitly link each disanalogy to the step of the argument it undercuts.
      *Refining Section 6 (Conclusion):* Ensure the distinction between weak/strong claim is sharp.

      *Ready to generate.*
