answer: |-
  ### The Arendt-Adjusted Integrity Check (AAIC)

  This protocol separates factual verification from ethical labeling. Steps 1–3 are **analytical/factual** (the team lead completes these). Step 4 is a **values gate** (the Standards Editor or Editor-in-Chief completes this).

  #### Phase 1: Classification (Factual & Analytical)
  *Complete these three steps to determine the nature of the falsehood.*

  **Step 1: Verifiable Falsity**
  *   **Question:** Is the statement objectively contradicted by available evidence (documents, data, recordings) at the time of speaking?
  *   **Sufficient Answer:** Yes/No based on primary sources.
  *   **If No:** Stop. It is not a lie (it may be opinion, speculation, or error).
  *   **If Yes:** Proceed to Step 2.

  **Step 2: Evidence of Knowledge (Intent)**
  *   **Question:** Do we have evidence the speaker knew the statement was false *before* or *during* the act? (Look for prior briefings, internal memos, corrections ignored, or contradictions in private vs. public statements).
  *   **Sufficient Answer:** "Preponderance of evidence" (more likely than not based on documents/sources), not "beyond reasonable doubt."
  *   **If No:** Stop. It is **Error or Self-Deception**. (Arendt notes self-deception blurs the line, but without intent to deceive, it is not a lie).
  *   **If Yes:** Proceed to Step 3. **Classification: This is technically a Lie.**

  **Step 3: Arendtian Scope (Reality Substitution)**
  *   **Question:** Does this falsehood function as an isolated tactical deception (hiding a specific fact), or is it part of an organized effort to replace the shared factual foundation (rewriting history, denying observable reality, sustained by a propaganda apparatus)?
  *   **Sufficient Answer:**
      *   *Tactical:* One-off claim, no supporting machine, admits correction if pressed.
      *   *Systemic:* Part of a broader narrative, backed by coordinated messaging, immune to correction, aims to make truth irrelevant.
  *   **Result:** This determines the *severity*, not the classification.

  ---

  #### Phase 2: The Publication Gate (Values Call)
  *This step cannot be automated. It requires human judgment regarding tone, audience trust, and editorial mission.*

  **Step 4: The "L-Word" Decision**
  *   **Prompt:** You have established a Lie (Steps 1 & 2). Now decide if the word "lie" (or "liar") appears in the headline or lead paragraph.
  *   **Considerations:**
      *   **Clarity:** Does "lie" communicate the deception more clearly than "false claim" or "misrepresentation"?
      *   **Noise:** Will using the word trigger a partisan backlash that drowns out the factual correction?
      *   **Arendtian Weight:** If Step 3 was *Systemic*, the threshold for using "lie" is lower because the stakes involve the erosion of truth itself. If Step 3 was *Tactical*, the threshold is higher; "false" may suffice.
  *   **Decision:** Editor signs off on "Lie" vs. "Falsehood/Misled."

  ---

  ### Application to Cases

  **Case 1: The Senator (Unemployment Number)**
  *   **Step 1 (Falsity):** **Yes.** Bureau of Labor Statistics data contradicts the number.
  *   **Step 2 (Knowledge):** **Yes.** Staff briefing notes show the correct number was provided 24 hours prior.
  *   **Classification:** **Technically a Lie.**
  *   **Step 3 (Scope):** **Tactical.** It is a single statistic used for rhetorical advantage, not an attempt to overwrite the existence of the Labor Department.
  *   **Step 4 (Values Gate):** **Do not print "Lie."**
      *   *Reasoning:* While technically a lie, using the L-word in a headline for a statistical fudge invites a "he-said-she-said" debate that distracts from the actual data.
      *   *Copy:* "Senator cites incorrect unemployment figure despite briefing."

  **Case 2: The Campaign (Fake Voter Rolls)**
  *   **Step 1 (Falsity):** **Yes.** The rolls are digitally manufactured; no such voters exist.
  *   **Step 2 (Knowledge):** **Yes.** Internal emails show the strategy was to "create doubt" regardless of authenticity.
  *   **Classification:** **Technically a Lie.**
  *   **Step 3 (Scope):** **Systemic.** This is not just hiding a fact; it is an organized apparatus manufacturing a false reality ("stolen election") to undermine the electoral system itself.
  *   **Step 4 (Values Gate):** **Print "Lie."**
      *   *Reasoning:* Arendt's warning applies here. The goal is reality substitution. Soft language ("false claim") understates the threat to the factual world.
      *   *Copy:* "Campaign Lie: Fabricated Voter Rolls Fuel Stolen Election Narrative."

  **Case 3: The Mayor (False Economic Theory)**
  *   **Step 1 (Falsity):** **Yes.** Economists across the spectrum agree the theory is debunked.
  *   **Step 2 (Knowledge):** **No.** The Mayor has surrounded himself with yes-men and genuinely believes the theory; no evidence shows he knows it is false.
  *   **Classification:** **Not a Lie.** (This is Arendt's "self-deception" or ideological blindness).
  *   **Step 4 (Values Gate):** **N/A.**
      *   *Copy:* "Mayor Pushes Debunked Economic Theory." (Never use "lie").

  ---

  ### Limitations of This Procedure

  1.  **The "Mind-Reading" Problem:** Step 2 relies on inferring knowledge. If a politician is willfully ignorant (refusing to read briefings so they can claim ignorance), this checklist may classify them as "Not a Lie" when they are ethically culpable. Arendt's framework struggles with calculated ignorance.
  2.  **Scale Mismatch:** Arendt's distinctions were built for totalitarianism and high-stakes geopolitics. Applying the "Reality Substitution" test to a city council zoning dispute is often overkill; in local news, almost all lying is "tactical," which can make the Step 3 filter feel irrelevant 90% of the time.
  3.  **No Help on Spin:** This procedure cannot evaluate exaggeration, cherry-picking, or misleading framing that is technically factually true. Arendt focuses on the falsehood itself, not the manipulation of truth.

  Bottom line: Use the checklist to verify the act, but reserve the label for when the truth itself is under attack.
