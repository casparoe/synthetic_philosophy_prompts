  3. Your argument that bodily-continuity theorists must accept survival here overlooks their typical insistence on biological life processes rather than mere organizational structure. Consequently, the claim that their view collapses into psychological continuity is an overstatement, as they could deny survival based on the artificial nature of the substrate regardless of functional preservation.
