  Your disagreement most likely lives in **Incompatibilism**. Since your friend assigns a credence of 0.15 *conditional on the result being robust*, she is not disputing the data (Specificity) or the timing (Awareness), but rather the inference that prior neural specification undermines agency—a core compatibilist stance.

