answer: |-
  The primary obstacle is not valuing suffering across species but establishing credible commitment mechanisms that allow agents to cooperate without triggering reputational backlash from their own constituencies.

  1.  **Credible Commitment and Reputation Management:** This is the most upstream constraint because moral trade collapses if participants fear being labeled traitors by their base, regardless of how accurately they value each other's causes.
  2.  **Shared Epistemic Frameworks:** Even with trust, trades fail if parties disagree on causal models of change, though this is secondary because verification tools can mitigate it.
  3.  **Normative Commensurability:** Exact exchange rates are least critical because bilateral swaps only require preference ordering, not cardinal utility agreement.

  Commitment is upstream because you cannot negotiate value or verify outcomes if the parties lack the authority or safety to finalize a deal. In the climate-animal prediction market case, the market mechanism resolves the epistemic question by objectively settling policy outcomes, which shifts the entire burden onto commitment; the activists no longer need to argue about probabilities, but they still must credibly promise to transfer resources or support based on the market's resolution without alienating their donors. This specific setup makes the first question even more dominant, as the technical verification is solved but the social enforcement remains unsolved.
