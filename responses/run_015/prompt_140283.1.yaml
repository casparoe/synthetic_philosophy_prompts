  To: Medication Safety and Health Literacy Committee
  From: Chair
  Date: October 26, 2023
  Re: Decision on Discharge Instruction Format and Budget Allocation

  I recommend we reject the vendor's pictogram license as a standalone replacement for text and instead fund the teaching and transformation work proposed by the nurse educator and data person. We will adopt a hybrid format where pictures support text, governed by strict safety standards and owned by a designated internal role.

  This decision addresses the specific risks raised by our pharmacy director, nurse educator, and trustees. For the pharmacy director: pictures structurally fail at negation and conditionals. The anticoagulant regimen requires conditional logic (if test result X, then dose Y) and negative constraints (do not take with Z). A pictogram cannot safely carry this load alone. For the nurse educator: symbols are not innate; they are conventions requiring visual education. Funding the license without funding the teaching creates a false sense of security. For the trustees: the printer constraint makes high-resolution probability grids impossible. A 1-in-1000 risk cannot be shown by repeating dots on a thermal printer; attempting to do so creates visual noise that patients ignore. We must treat pictures as a "helping language" that aids comprehension, not a full language that replaces speech.

  We are adopting the following licensing standards for any symbol used on discharge sheets. A symbol is permitted only if it achieves 90% correct interpretation in hallway testing with patients matching our demographic profile, without prior instruction. Furthermore, the following categories may never be carried by symbol alone: dose-critical information involving conditionals, negation, probability estimates below 5%, and dose adjustments based on lab results. These must remain in text, translated where possible. This ensures that while pictures aid comprehension, they do not become single points of failure for safety-critical logic. Any symbol failing the hallway test is removed from the approved set immediately.

  **The Strongest Case for the Option We Are Rejecting**
  We must acknowledge the force of the board's resolution and the vendor's promise. The current text-based system completely fails the eighty patients annually who speak languages with no written form. For them, a text sheet is not just unhelpful; it is invisible. They cannot even identify that they have received instructions. A pictogram sheet, even if imperfectly understood, signals that information is present. It attracts attention where text repels it. There is moral weight to the claim that any visual engagement is superior to total exclusion. If we reject the pictures, we continue to send these eighty patients home with nothing they can recognize. The vendor's offer promises a universal key that bypasses the need for translation, which is financially and logistically tempting.

  However, engagement without accuracy is dangerous in medication safety. A patient who misreads a "split pill" icon as "damaged pill" discards their medication entirely. A patient who reads a clock icon as a specific alarm time may miss doses if their schedule shifts. The vendor's symbols failed our hallway testing precisely because they pretend to be universal when they are not. We cannot solve the exclusion problem by creating a new inclusion problem based on visual misinterpretation. The solution to the eighty patients is not raw pictures, but the teaching infrastructure that makes pictures readable. We must build the capacity to teach the symbols, rather than buying the symbols and hoping they teach themselves.

  **Institutional Consequences of the Secretary's Point**
  The committee secretary is correct: pictures are not a bedrock of self-certifying signs. They are revisable conventions, just like words. This anti-foundationalist reality dictates our governance. We cannot simply adopt a set of icons and forget them. We must establish a "Transformer" role, owned by the Pharmacy Department, responsible for converting regimens into charts and maintaining a change log. This owner must enforce a written grammar for how symbols combine. We will institute a two-year sunset clause on this protocol, requiring a full review of symbol comprehension data before renewal. We will launch a pilot on two wards within three months to test the teaching protocol before system-wide rollout. This ensures the system remains alive and responsive to patient feedback rather than becoming a static, decaying standard.

  **Framing and Failure Modes**
  Our initial framing assumed a choice between Pictures and Words. This misses the real issue. The choice is between buying a Commodity (the license) and building Infrastructure (the teaching and governance). A commodity suggests a one-off fix; infrastructure acknowledges continuous maintenance. The vendor sells a product; the nurse educator proposes a process. Safety requires process.

  We would change our mind if the vendor could demonstrate 95% comprehension of their symbols across our seventeen language groups without prior teaching. Until then, we assume symbols require education. The failure mode we must monitor is clinician improvisation. If doctors or nurses begin drawing ad-hoc icons on sheets because the standard set lacks a specific symbol, the system's grammar collapses. The Transformer must have the authority to reject such improvisations. We are choosing safety over simplicity. We fund the work, not the icons.
