answer: |-
  The Hall of Whispers did not tick. It breathed.

  Mara stood on the gantry above the floor, looking down at the ten thousand calculators seated in the dim light. They were not machines. They were people, mostly elderly, mostly tired, each equipped with a abacus, a slate, and a cup of water. They were the Aggregate. Above them, the Great Board glowed with a single, shifting number: the structural integrity of the City's Northern Wall.

  In the corner of the hall, shrouded in dust, sat the Old Integrator. It was a brass beast of gears and levers, built a century ago. It calculated with the precision of a diamond cutter. One grain of sand in its main drive, one bent tooth, and the answer was not just wrong; it was nonexistent. The machine would jam. The chain would break. It demanded perfection from every link in its serial logic. It had been silent for twenty years.

  The Aggregate was different. It was sloppy. A single calculator might drop a bead, might sneeze, might misread a digit. Their individual pulse was slow, their attention span fleeting. But there were ten thousand of them. They worked in parallel, all solving the same stress equation simultaneously. Their answers were fed into the hopper, averaged, and voted upon. If six thousand said "Safe," the Wall was Safe. The errors canceled out. The noise became signal.

  Mara watched the Board. It read *98% Stability*. The hum of the hall was a low, comforting thrum, like blood in an ear.

  Outside, the earthquake began.

  It was not a violent shudder, but a long, grinding roll. The floor beneath the calculators vibrated. Dust fell from the rafters. In the Old Integrator, this vibration would have been catastrophic. The gears would have clashed, the tolerance gaps would have closed, and the mechanism would have locked. Precision is brittle; it cannot bend.

  But the Aggregate absorbed the shock. A hundred calculators dropped their beads. Two hundred lost their place. Three hundred stopped to comfort a neighbor. The system did not notice. The remaining nine thousand adjusted. The Board flickered, dipped to *95%*, and steadied. The redundancy swallowed the loss. The system was robust because it did not care about the individual. It cared only about the mass.

  Mara leaned over the railing. She knew the theory, though she never spoke it. She knew that the brain of the City was not a clock, but a cloud. It traded exactness for width. It sacrificed the sharpness of the single truth for the durability of the consensus.

  The shaking intensified. The noise floor rose.

  This was the danger zone. Von Neumann had warned, in the dry papers kept in the archive, that redundancy has a cliff. It does not degrade linearly. It holds, and holds, and holds, until the fraction of error crosses a threshold. Below the line, the voting suppresses the mistake. Above the line, the voting amplifies it.

  The dust in the hall thickened. The air grew hard to breathe. Mara saw the calculators squinting. The vibration made the abacus beads rattle on their own. A single bead moving unintentionally was a bit-flip. A random error.

  Initially, the errors were independent. One person moved a bead left; another moved one right. The average held.

  But then the panic set in.

  It started in the front rows. A calculator dropped his slate. It cracked loudly. The woman next to him flinched, misreading her own numbers. She looked to her left for confirmation. He looked to her. They were no longer independent units. They were coupling. The error was becoming correlated.

  Mara watched the Board. It still read *94% Stability*. The confidence was high. The system was designed to project certainty. It did not know how to project doubt. It only knew how to count hands.

  Below, the vibration reached a frequency that matched the natural rattle of the abacus frames. Now, the beads were moving randomly. Not just one here or there. Many.

  If fifty-one percent of the beads moved "Safe" due to random vibration, the system would register "Safe."

  Mara checked her own monitor, the single precise seismograph linked to the wall itself. It screamed. *Critical Stress. Imminent Failure.*

  She looked at the Great Board. *92% Stability.*

  The degradation was not a crash. The lights did not turn red. The hum did not stop. The calculators were still working, still sliding beads, still whispering numbers. The machinery of the mind was functioning perfectly; it was just processing garbage. The threshold had been crossed. The majority was now wrong, and because the system relied on the majority to define truth, the error was being validated.

  Mara reached for the override lever. To pull it was to admit the Aggregate was blind. It was to switch to the Old Integrator, which was likely jammed, or to trust her own single, fallible eyes.

  She looked at the floor. A man in the third row was weeping. He knew his beads were lying. He looked up at Mara, his eyes wide, begging for a command. But the protocol was clear. The individual is nothing. The vote is all.

  If she stopped the count, the City would freeze. Paralysis was the cost of precision. If she let it continue, the City might build on a lie.

  The Board shifted. *93% Stability.* It was gaining confidence. The vibration was consistent now, pushing the beads in a uniform direction. The random noise had become a signal. The system was locking onto the error. It was amplifying the lie with the same mechanical certainty it used to speak the truth.

  Mara thought of the Wall. It was holding, for now. But the stress was real. The math was real. The consensus was imaginary.

  She realized then the terrible cost of the trade. The Old Integrator would have broken. It would have jammed, silent and useless, admitting through its silence that it could not know. It would have forced them to stop.

  The Aggregate would not stop. It would guide them into the abyss with a smile. It offered the comfort of continuity over the safety of truth. It allowed them to keep walking when they should have fallen.

  Mara placed her hand on the lever. She felt the vibration in the metal, a chaotic, messy frequency. It felt alive. It felt like fear.

  Below, the calculators were syncing their movements now, rocking with the floor, their beads clicking in a unified, erroneous rhythm. They were no longer measuring the Wall. They were measuring the Earthquake, and calling it Stability.

  The Board flashed *95%*. A new high.

  Mara did not pull the lever. To pull it was to choose the brittle truth over the robust lie. To pull it was to choose the silence of the machine over the breathing of the crowd.

  She watched the Board. It was so bright. So sure.

  Outside, the Northern Wall groaned. It was a sound like a ship hull splitting, deep and low. It was not loud enough to trigger the alarms, which were also part of the Aggregate, also voting, also confused by the vibration.

  Mara stayed her hand. There was no cost to the system for being wrong. It would continue to calculate. It would continue to report. It would bury them in data while the ground opened up.

  She turned away from the railing and walked toward the door. The hum followed her, warm and heavy. It was the sound of ten thousand voices agreeing that the sky was green, while the rain fell blue.

  She stepped out into the street. The Wall stood. It looked solid. It looked safe.

  Mara touched the stone. It was vibrating. Not with the earthquake, but with the echo of the Hall, the resonance of the consensus. It felt strong. It felt like a lie.

  She walked on, trusting her feet, trusting the uneven ground, trusting the single, fragile sense of balance in her inner ear. It was slow. It was imprecise. It could fail at any moment.

  But it was hers.

  Behind her, the Board clicked up to *96%*, and the City breathed a sigh of relief, settling comfortably into the error that would hold it up until it didn't.
