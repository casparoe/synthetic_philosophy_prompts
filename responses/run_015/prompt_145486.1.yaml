answer: |-
  Here is the honest breakdown you need for your novel. I will separate the psychological reality (what your characters *feel*) from the normative ethics (what philosophers argue is *right*), and then offer the single principle that best unifies your gut verdicts, along with the cost of adopting it.

  ### Part 1: Settled vs. Contested
  Before applying a principle, you need to know where the intellectual ground is solid and where it is swampy.

  **1. Time Discounting (Cases 1, 2, 4)**
  *   **Settled (Psychology/Econ):** Humans naturally use *hyperbolic discounting*. We value the near future much more than the far future, inconsistent with standard economic models of "rational" exponential discounting. Your gut in Cases 1 and 2 is the universal human default.
  *   **Contested (Ethics):** Whether we *should* discount the future is fiercely debated. Frank Ramsey (1928) called discounting future generations "ethically indefensible." Most climate ethicists (e.g., Stern Review) argue for a near-zero discount rate for intergenerational justice. Your gut (Case 4) admits a contradiction that philosophers have not resolved: we *feel* the proximity bias, but we *argue* for long-term duty.

  **2. Proximity & Identifiable Victims (Case 3)**
  *   **Settled (Psychology):** The "Identifiable Victim Effect" is robust. We care more about a specific neighbor than a statistical child abroad.
  *   **Contested (Ethics):** Peter Singer and effective altruists argue this is a moral bias that should be corrected (distance shouldn't matter). Communitarians and "Reasonable Partiality" theorists argue we are *permitted* to prioritize our local community. There is no consensus.

  **3. Acts vs. Omissions (Case 5)**
  *   **Settled (Law/Intuition):** Legal systems and human intuition almost universally distinguish between *killing* (Button) and *letting die* (Program/Resource allocation).
  *   **Contested (Philosophy):** Consequentialists (Utilitarians) argue the distinction is morally irrelevant; only outcomes matter. Deontologists argue the distinction is fundamental. This is one of the oldest fights in ethics.

  ---

  ### Part 2: The Unifying Principle
  You asked for one principle that explains Cases 1–4 and resolves Case 5. The principle that best matches your gut verdicts (and those of most non-philosophers) is:

  **Agent-Centered Prerogatives with Deontological Constraints.**

  Here is how it works:
  1.  **Agent-Centered Prerogatives:** You are allowed to give extra weight to your own interests, your time, and your proximity. You are not required to be a neutral vessel for the greater good. (This validates Cases 1, 2, 3, and the *feeling* in 4).
  2.  **Deontological Constraints:** There are certain actions (like directly killing an innocent) you are forbidden from doing, even to maximize good outcomes. However, you are not forbidden from *allocating resources* in ways that have tragic statistical outcomes. (This resolves Case 5).

  #### How it handles your cases:
  *   **Cases 1–4:** These are all expressions of **Prerogatives**. It is morally permissible to care more about rent than tuition, the flu now than later, and the neighbor than the distant child. You are an embodied agent living in the present, not a god outside of time.
  *   **Case 5 (The Button):** This violates the **Constraint**. Directly killing an innocent is a rights violation. It treats the person as a means to an end. Verdict: Monstrous.
  *   **Case 5 (The Program):** This falls under **Prerogatives/Resource Allocation**. Spending money on X means not spending it on Y. If the link to the death is statistical (opportunity cost) rather than direct agency, it is permissible. Verdict: Okay/Obligatory.

  ---

  ### Part 3: The Cost (What gets thrown out?)
  You asked me to tell you honestly which verdict this principle has to throw out to stay clean.

  To make **Agent-Centered Prerogatives** work, you must throw out **Consequentialist Consistency.**

  If you want a "clean" moral system where the math always adds up (like Utilitarianism), you cannot keep your gut verdicts. A strict Utilitarian principle would force you to admit:
  1.  **Cases 1–4 are irrational biases.** (You *should* value the tuition and rent equally if adjusted for interest; you *should* care about the flu in 60 years if you'll be alive).
  2.  **Case 5 is a contradiction.** If saving 10,000 lives is the goal, the Button and the Program are morally identical. If the Program is obligatory, the Button is too. If the Button is monstrous, the Program is suspect.

  **So, for your novel:**
  If your character adopts the **Prerogative/Constraint** principle (the "Human" view), they keep all their gut feelings but must admit they are logically inconsistent. They accept that morality is messy.
  If your character adopts the **Utilitarian** principle (the "Clean" view), they achieve logical consistency but must reject their gut feelings on 1–4 and the distinction in 5. They become "cold" or "ideological."

  **The Specific Sacrifice in Case 5:**
  To keep the "Button is Bad / Program is Good" distinction clean, the principle relies on the **ambiguity of causation**.
  *   **The Verdict you must soften:** You must admit that if the "Program" becomes specific enough (e.g., "Defunding *this specific* hospital wing knowing *this specific* person will die"), it collapses back into the Button.
  *   **The Principle's Weakness:** It cannot define exactly when a "resource cost" becomes a "killing." It relies on a fuzzy line between *doing* and *allowing*. To stay clean, the principle demands you ignore the gray area where statistical costs become certain deaths.

  ---

  ### Part 4: The Tree (2100)
  **Question:** What does this principle predict for planting a tree you'll never sit under?

  **Verdict:** **Supererogatory (Good, but not Obligatory).**

  *   **Why:** Under *Agent-Centered Prerogatives*, you are permitted to prioritize your own lifetime comfort. Planting the tree is an act of pure Beneficence without Prerogative reward.
  *   **Moral Weight:** It has moral weight, but it is not a duty like paying rent (Case 1) or not pressing the Button (Case 5).
  *   **For the Novel:** A character who plants the tree is not "doing their job"; they are being virtuous. A character who *refuses* to plant the tree is not necessarily immoral; they are exercising their prerogative to focus on the present.
  *   **The Tension:** If the climate crisis becomes severe enough that the "Local Flood" (Case 4) becomes a certainty, the Prerogative shrinks. The tree moves from "sentimental" to "self-defense." Your character's dialogue should shift based on how imminent the flood feels.

  ### Summary for Dialogue
  *   **Settled Science:** Humans discount the future hyperbolically. We are wired to care about *now*.
  *   **Contested Ethics:** Whether we *ought* to override that wiring.
  *   **The Principle:** "Reasonable Partiality." We are allowed to care more about us and now, provided we don't directly harm innocents to do it.
  *   **The Lie:** This principle pretends there is a clear line between "killing" (Button) and "spending" (Program). In the real world (and good fiction), that line blurs.
  *   **The Tree:** It is a gift, not a bill. Unless the flood is coming next week.

  If you want conflict in your book, pit a character with the **Human Principle** (gut feelings, inconsistent, warm) against a character with the **Utilitarian Principle** (consistent, cold, demanding). The Human will call the Utilitarian a monster for pressing the Button. The Utilitarian will call the Human a hypocrite for funding the Program but not the Button. Both are right by their own lights.
