answer: |-
  This is a sophisticated stress test. You are asking whether the *Mingjia* (School of Names) logic of distinction can survive contact with the blunt instrument of statutory regulation. The Dolly case is ideal because it hinges entirely on whether a *name* ("embryo") covers an *actuality* (nuclear transfer) that lacks the name's historical etymology (fertilization).

  Here is the disciplined mapping and analysis.

  ### 1. The Mapping: Gongsun Long in the HFEA Lab

  To apply Gongsun Long's *White Horse Dialogue* to the 1997–2001 UK regulatory period, we must distinguish between biological ontology and legal ontology. Gongsun Long argues that the compound concept ("White Horse") has a different extension than the simple concept ("Horse").

  *   **Horse (Ma):** The statutory category of **"Embryo"** as defined in the Human Fertilisation and Embryology Act (1990). Crucially, the Act defined this by *process*: "a live human embryo where fertilisation is complete." Here, "Horse" is not the biological animal, but the **legal class defined by sexual reproduction**.
  *   **White (Bai):** The attribute of **"Created via Somatic Cell Nuclear Transfer."** This is the distinguishing modifier, analogous to color. It is an attribute of origin, not necessarily of final form.
  *   **White Horse (Bai Ma):** The **"Cloned Embryo"** (Dolly's precursor). This is the compound entity: an embryo-like organism possessing the attribute of cloning.

  **Gongsun Long's Claim:** "A White Horse is not a Horse."
  **The Regulatory Loophole:** "A Cloned Embryo is not a [Statutory] Embryo."

  When Dolly was announced, the HFEA and UK courts initially faced the Gongsun Long problem literally. Because Dolly was created without fertilization, she logically fell outside the extension of the 1990 Act's definition of "embryo." Gongsun Long would argue this distinction is real and must be maintained: the *name* "embryo" (fertilization) does not fit the *actuality* "clone" (nuclear transfer). To say they are the same is to misuse language.

  ### 2. The Collapse: Legal Pragmatism vs. Ontological Precision

  You asked if regulators collapse a distinction Gongsun Long insists cannot be collapsed. **Yes, explicitly.**

  Gongsun Long's project is often read as a demand for the "rectification of names" (*zhengming*): ensure the name matches the actuality precisely. If the process is different, the name should be different. The initial regulatory gap respected this: clones were not legally embryos.

  However, the political and ethical panic following Dolly forced a pragmatic collapse. The UK government introduced the Human Reproductive Cloning Act (2001), which effectively legislated that "for the purposes of this law, a cloned embryo *is* an embryo."

  *   **Gongsun Long:** Insists $A + B \neq A$. (Clone + Embryo $\neq$ Embryo).
  *   **The State:** Decrees $A + B = A$ for the sake of prohibition.

  This is where **legal pragmatism eats ontology**. The law is not interested in the metaphysical truth of whether a clone is "really" an embryo; it is interested in the *consequences* of treating it as one. Gongsun Long warns that conflating the specific (White Horse) with the general (Horse) leads to logical error (e.g., if you want a horse, a black or yellow one will do; if you want a white horse, they won't). The regulators conflated them to ensure that if you want to ban embryo research, you must also ban cloning, even if the biological mechanism differs. They sacrificed logical precision for regulatory coverage.

  ### 3. Hui Shi and the Egg: Process as Essence

  Hui Shi's paradoxes, particularly **"An egg has feathers,"** offer a different angle. This thesis suggests that potentiality is indistinguishable from actuality, or that distinctions between stages of transformation are arbitrary.

  *   **The Biological Register:** Biologically, the reproductive method (cloning vs. fertilization) is **accidental**. Dolly is constitutively a sheep (*Ovis aries*). The "egg has feathers" logic applies here: the somatic cell contains the potential for the whole sheep, just as the egg contains the potential for the feathered hen. In this register, the method is irrelevant to the *kind*.
  *   **The Regulatory Register:** The regulators treated the reproductive method as **constitutive**. By scrambling to legislate against "nuclear transfer" specifically, they treated the *process* as the essence of the ethical threat.

  Hui Shi helps expose the regulators' inconsistency. If "an egg has feathers" (potential is actual), then a cloned cell *is* an organism in potential, regardless of method. But if the method is constitutive (as the law eventually treated it), then the potential is *not* the same. The regulators oscillated: they treated Dolly as a "normal mammal" (biological kind) when discussing her welfare, but as a "synthetic artifact" (process kind) when discussing licensing. Hui Shi's relativism highlights that the "essence" of Dolly shifted depending on which bureaucratic desk she was on.

  ### 4. Where the Analogy Breaks

  We must be honest about the limits. The School of Names was concerned with **political order and logical consistency** in the Warring States period, not risk management in a biotech regime.

  1.  **Normativity vs. Descriptivism:** Gongsun Long describes how language *fails* to capture reality (the name "White Horse" is narrower than "Horse"). The Law prescribes how reality *must be treated* (the name "Embryo" shall cover "Clone"). The Mingjia analyzes the gap; the Law fills it by fiat.
  2.  **The "Color" Problem:** In Gongsun Long's analogy, "White" is a visible, co-existing attribute of the horse. In the Dolly case, "Cloned" is a historical fact about the embryo's origin, not a visible trait of the embryo itself. You cannot look at Dolly and see "Cloned" the way you see "White." This makes the regulatory distinction harder to police, requiring traceability rather than observation.
  3.  **Institutional Silence:** The School of Names has no theory of *power*. It assumes that if names are rectified, order follows. The Dolly case shows that order follows *power*, even if names are distorted. The UK Parliament didn't solve the logical paradox; they overruled it.

  ### 5. What the Case Shows Back About the School of Names

  Does this confirm that ordinary language forces false unifications? **Yes.** The public discourse immediately called Dolly a "sheep" (Horse), ignoring the "cloned" (White) distinction to normalize her. This created the ethical shock when people realized the "White Horse" (Clone) carried different risks than the "Horse" (Natural).

  However, it also shows the theory was **never meant for institutional categorization**. The Mingjia seeks to separate names to reveal truth. Institutions merge names to exert control. The Dolly episode confirms Gongsun Long's diagnostic insight—that "Horse" and "White Horse" are logically distinct—but it falsifies his prescriptive hope that society will honor that distinction. Society honors utility.

  The case suggests the School of Names is a **logic of critique**, not a **logic of governance**. It is excellent for exposing the loophole (as the lawyers did in 1997), but useless for closing it (as Parliament did in 2001).

  \boxed{The Dolly case confirms the School of Names' diagnosis of categorical slippage between process and kind, but demonstrates that institutional pragmatism inevitably overrides ontological precision to close regulatory gaps.}
