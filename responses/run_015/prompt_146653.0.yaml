          *   Modern Preference Utilitarianism focuses on *frustrated preferences*.
          *   The Friend's Error: She thinks Utilitarians value "nociception" as bad. They value "suffering" as bad. If asymbolia removes suffering, Utilitarianism is fine with it. The theory doesn't break; her definition of what Utilitarians oppose is slightly off.
      *   **Conclusion:** Summarize who "won." Friend wins on neuroscience, draws on philosophy, loses on ethics.

  4.  **Refining the Tone:**
