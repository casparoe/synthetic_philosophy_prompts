  Risk-weighting is best understood as dynamic intrapersonal prioritarianism applied to the set of live possibilities at each node, rather than static aversion to global uncertainty.

  On this reading, the risk function $r$ does not encode a hedonic dislike of variance but a normative weighting: a unit of utility in a worse-ranked possible future matters more than a unit in a better-ranked one. This is intrapersonal prioritarianism. Just as a social prioritarian weights gains to the worse-off more heavily, the agent weights gains in their own worse-off live possibilities more heavily. This interpretation dictates the structural claim: priority is contrastive. An outcome is "worse-off" only relative to the other possibilities currently live. As a decision tree unfolds and chance nodes resolve, the set of live possibilities shrinks, altering the contrast class. Therefore, evaluation must be recursive, re-applying $r$ to the distribution of continuation values at each node rather than once globally.

  Regarding objection (i), your arithmetic is correct; the values diverge. However, violating reduction of compound gambles is justified because the timing of resolution is a real feature of the deliberative situation under this interpretation. In the global reading, 40 is weighted against 100; in the recursive reading, 40 is weighted against the certainty equivalent of the subordinate gamble (25). Because the "worse-off" status is relative to the live set, the agent's priority weighting shifts as information eliminates possibilities. The agent cares about avoiding the worst *current* outcome, not merely the worst *global* outcome, making the tree structure substantively relevant.

  Regarding objection (ii), the recursive reading neither collapses into expected utility nor vacuity. It avoids EU because the non-linear weighting compounds at each node rather than canceling out; the transformation is not simply a reshaping of $u$ because the probability scale resets to [0,1] at every node. It avoids collapsing into the global reading because intermediate nodes create new ordinal rankings of continuation values. The view bites hardest when intermediate resolutions change whether a sure thing is ranked above or below a gamble's equivalent. This is a virtue, not a vice: it respects the agent's changing perspective as uncertainty resolves, ensuring that priority weighting remains sensitive to the actual contrast class faced at the moment of choice rather than being locked into an initial, abstract distribution. Even with fine-grained trees, the resetting of the probability scale preserves non-linearity, preventing convergence to risk-neutrality.
