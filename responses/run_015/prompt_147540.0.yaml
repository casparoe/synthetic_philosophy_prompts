answer: |-
  # The Ledger Protocol

  **Materials**
  *   3 Large Sheets (The Ledgers).
  *   18 Role Cards (Secret: 6 "High Risk", 6 "Low Risk", 6 "Registrar").
  *   54 Action Cards (3 colors: Red, Yellow, Green).
  *   3 Dice.
  *   Pens.

  **Setup (5 Minutes)**
  Divide the room into three Polities of six. Hand out Role Cards face down.
  *   **Citizens (4 per polity):** Look at your Risk. *High Risk:* Lose 2 points if an action is recorded. *Low Risk:* Gain 1 point if recorded.
  *   **Registrars (2 per polity):** Gain 1 point for every action recorded accurately.
  *   **Actions:** Each Citizen gets 5 Action Cards. They must play at least 3. Unplayed cards are their *opacity budget*.

  **The Constitution (15 Minutes)**
  Each Polity must set three binary switches on their Ledger sheet. Majority rules.
  1.  **Capture:** Record *All* actions OR *Only Red* actions.
  2.  **Visibility:** Ledger is *Open* (Citizens may view) OR *Closed* (Registrars only).
  3.  **Judgment:** Penalties decided by *Registrar* OR *Dice Roll*.

  *Read Rules:* "Play cards. Registrars record based on Capture. If a penalty triggers, apply based on Judgment. High Risk loses points on record; Low Risk gains. Registrars gain on completeness. Goal: Maximize personal points."

  **The Simulation (25 Minutes)**
  Citizens play Action Cards face up. Registrars log them based on the **Capture** setting.
  *   If **Judgment** is Dice: Roll on any Red card. 1-3 = Penalty (-2 points). 4-6 = Safe.
  *   If **Judgment** is Registrar: Registrar assigns penalty arbitrarily.
  *   *Constraint:* Registrars cannot reveal the Ledger if **Visibility** is Closed.

  **The Audit (15 Minutes)**
  Citizens may attempt to correct errors.
  *   If **Visibility** is Open: They check the sheet. They can cross out errors.
  *   If **Visibility** is Closed: They must ask Registrars. Registrars must say "No access per Constitution."
  *   *Discovery Moment:* High Risk citizens who voted for High Capture realize their points are vanishing. Closed Ledger citizens realize they cannot prove errors exist.

  **Debrief (30 Minutes)**
  Do not start with theory. Start with affect.
  1.  **The Trap:** Ask a High Risk student who voted for High Capture: "You wanted safety, but you chose visibility. Why?" They will say they didn't know the cost of recording. Map this to **Downward Legibility**.
  2.  **The Wall:** Ask a Citizen with Closed Visibility: "Could you correct the record?" They will say "No." Map this to **Upward Legibility**. Name the gap between these two the **Reciprocity Gap**.
  3.  **The Tax:** Ask Registrars: "Was it hard to keep the ledger?" Ask Citizens: "Was it hard to track the Registrars?" Explain that keeping a second-order file on the state's file is an unequally distributed tax. Name the unplayed cards the **Opacity Budget**.
  4.  **The Automation:** Ask those punished by Dice: "Could you appeal?" No. Map to **Automaticity**.
  5.  **Reveal:** Only now introduce the country labels if useful, but emphasize these are structural variables, not national essences.

  **Failure Modes & Remedies**
  *   **Optimization Puzzle:** Students treat this purely as a points game. *Remedy:* Interrupt Round 2 if laughter dominates. Ask: "Does efficiency feel like freedom?" Force them to articulate the feeling of powerlessness during the Audit phase.
  *   **Registrar Refusal:** A student refuses to withhold information on principle. *Remedy:* Remind them the *Constitution* binds them, not their conscience. They are a function of the system they voted for. If they still refuse, swap them with a Citizen mid-game to feel the other side.
  *   **Mushy Compromise:** They vote for "Medium" settings. *Remedy:* Enforce binary choices. No "Sometimes." The friction requires hard edges.

  **Limitations**
  This game cannot reproduce the chilling effect: the things you never attempt because you know the record exists. In the game, students play cards; in reality, they stay home. Nor can it reproduce the hidden score: in the game, you know when you lose points. In reality, you often never see your file until denied a loan or visa. You must supply this voice. Tell them: "The game ends. The ledger does not."

  \answer{The unequal labor of auditing the state's file on you.}
