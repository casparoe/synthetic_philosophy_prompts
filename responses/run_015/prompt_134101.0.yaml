      *   Check that I answer all four specific questions.
      *   Make sure to advise on the "function" terminology (user wants to reserve "function" for selected effects, which is standard Millikan/Neander, so "stabilized contribution" is a good non-function label).

  10. **Self-Correction during drafting:** I initially thought about telling them to look at "Exaptation." But Exaptation usually means selected for A, then later selected for B. The user's case is selected for A (linked trait), and B (lipid metabolism) persists due to linkage but isn't necessarily selected for *itself*. This is more like "Hitchhiking Functionality" or CNE. I need to be precise there. Also, need to address the "circularity" worry carefully: defining "coupling" shouldn't rely on "selection," it should rely on physical linkage (LD, chromatin), but the *persistence* relies on selection of the partner. That's not circular, it's causal chain.

  11. **Final Structure:**
      *   Introduction: Validate the sophistication of the argument.
      *   Coherence: It fits within existing literature (CNE, Hitchhiking).
      *   Circularity: It's a hybrid, not circular. Clarify the dependency.
