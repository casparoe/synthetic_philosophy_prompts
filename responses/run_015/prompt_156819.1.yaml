answer: |-
  Good morning. Or, given the jet lag in this room, whatever time zone your body clock is currently pretending to be in.

  I know the fault lines in this room. I can feel them. On one side, we have the biologists who treat Zahavi's handicap principle as a working tool—something that explains why gazelles stot and peacocks drag around those ridiculous tails. On the other side, we have the philosophers who look at the handicap principle and see a tautology waiting to happen. If every signal is costly, and every cost is a signal, are we actually explaining anything, or just decorating our models with expensive plumage?

  I'm not here to solve that debate today. Honestly, I'm running on my third coffee and I wrote these remarks at 2am, so if I solve anything, it'll be a miracle. But I do want to propose a truce. And I want to do it by turning the lens off the animals and onto us.

  We are signaling systems. This workshop, our papers, our grants—they are all exercises in evolutionary signaling. And I think the distinction between an *index* and a *handicap* is the right tool to figure out where our own practices are doing structural work and where they're just institutional peacocking.

  Quick refresher, because I know half of you are ready to correct me: An index signal is physically coupled to the quality it signals. You can't fake a deep voice if you have small vocal cords. The cost is physical impossibility. A handicap, following Zahavi, is arbitrarily costly. It's honest *because* it's wasteful. Only a high-quality individual can afford to burn calories on a useless tail.

  Now, look at our rituals of credibility. Pre-registration badges. Open-data mandates. Multi-lab replication checks.

  When these work as indices, they are physically coupled to the truth. If I pre-register my analysis plan, I am physically constraining my future self. I cannot HARK—hypothesize after results are known—without leaving a digital fingerprint. The cost here isn't just effort; it's a constraint on fraud. It's an index. It says, "I literally cannot move the goalposts without you seeing."

  But let's be honest. Sometimes these rituals drift into handicap territory. We collect open-data badges like merit stickers. We perform transparency in ways that are costly—we spend weeks formatting data for a repository no one will ever download—but that cost doesn't actually improve the truth-tracking of the paper. It's just a display. It says, "I am so confident in my status that I can afford to waste time on this bureaucracy."

  This is where I need both camps to meet me.

  To the philosophers: You are right to be suspicious. When signaling becomes detached from structural constraint, it becomes pure waste. If a pre-registration badge is just a way to signal virtue without actually locking down the analysis, then yes, it is tautological. It's a peacock tail. It proves I have resources, not that I have truth.

  But to the biologists: You are right that cost matters. Trust is expensive. In a low-trust environment, cheap talk is worthless. We need costly displays to separate the serious researchers from the noise. The waste *is* the point, sometimes. It proves commitment.

  So, the challenge for this workshop is to distinguish between the two. When we talk about evolutionary signaling, let's make sure we aren't just admiring the plumage. Let's ask: Is this signal an index? Does it physically constrain the system? Or is it a handicap? And if it is a handicap, is the cost buying us honesty, or just buying us status?

  I want us to spend the next two days focusing on the structural work. Let's find the mechanisms where the signal *must* carry information, not just where it *might*. Let's admit that some of our own practices are wasteful displays, and own that. But let's also recognize that without some cost, there is no trust.

  I'm going to stop talking before I say something unfalsifiable. We have a lot of work to do. Thank you for coming, and let's get into it.
