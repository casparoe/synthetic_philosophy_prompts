  **INSTITUTIONAL REVIEW BOARD FOR NON-BIOLOGICAL SENTIENCE (IRB-NBS)**
  **Protocol Number:** PHY-2024-Ω
  **Project Title:** High-Luminosity Hadron Collision and Field Perturbation Study
  **Principal Investigator:** Dr. A. Vance
  **Review Date:** 14 October 2024

  **1.0 SCOPE OF SENTIENT SUBJECTS**
  Pursuant to the Panpsychist Mandate (2023), the undersigned committee must evaluate the moral status of all fundamental entities subjected to energetic perturbation.
  [ ] Biological Entities
  [ ] Artificial Intelligence
  [x] Fundamental Fields and Gauge Bosons

  **1.1 Baseline Valence Assessment**
  Does the pre-collision ground state of the quantum field possess phenomenal experience?
  [ ] Yes (Unified)
  [ ] Yes (Fragmented)
  [ ] Indeterminate (Default Selection)

  *Justification:* Current metaphysical models cannot distinguish between inert mass and dormant experience. All fermions are treated as potential moral patients until proven otherwise.

  **2.0 RISK OF HARM DURING COLLISION**
