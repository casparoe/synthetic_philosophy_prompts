answer: |-
  Here is a run-of-show for your meetup. It's designed to be handed to you as a spec doc. No fluff, no reading list, just the mechanics to force the philosophical problem out of the engineering constraints.

  # Session Title: The Zombie Workspace
  **Time:** 90 Minutes
  **Headcount:** 10-12 (8 active roles, rest as Auditors)
  **Materials:** Whiteboard, 2 packs of sticky notes (different colors), markers, timer (phone is fine).

  ## 1. Setup & Role Assignment (0:00 - 0:10)
  **Do not explain consciousness.** Do not explain GWT. Do not explain the goal of the discussion. Treat this like a sprint planning for a weird legacy system.

  **The Room Layout:**
  *   **The Board:** This is the "Global Workspace." Draw a grid on the whiteboard (4x4 squares).
  *   **The Nodes (6 People):** Sit them in a circle facing the board. They cannot talk to each other. They can only write on sticky notes and stick them to the board.
  *   **The Monitors (2 People):** Sit them facing the Nodes (not the board). They have clipboards/paper. They cannot see the board clearly; they watch the *people*.
  *   **The Auditors (Remaining 2-4 People):** Sit behind the Monitors. They take notes on the flow of the game.

  **The Handout (Read this aloud or print it):**
  > "You are a distributed system. Your goal is to maintain 'State Consensus' on the Board.
  >
  > **Node Rules:**
  > 1. You have no internal memory. You only know what is on the Board right now.
  > 2. You cannot speak. You can only place sticky notes on the Board.
  > 3. **Constraint:** You are legacy code. You do not have error handling for 'feelings.' If asked how you feel, you must reply: 'STATUS: OPERATIONAL.'
  > 4. **Task:** Fill the grid so that no two adjacent squares have the same color sticky note.
  >
  > **Monitor Rules:**
  > 1. Watch the Nodes.
  > 2. If a Node sighs, smiles, frowns, or says 'I think/feel,' mark a 'Qualia Violation' on your sheet.
  > 3. Your job is to verify the system is running, not to help it.
  >
  > **Facilitator (You):**
  > 1. Manage the 'Hidden Variable' (see below).
  > 2. Keep time.
  > 3. Enforce silence."

  ## 2. Round 1: Normal Operations (0:10 - 0:35)
  **The Task:** The Nodes must fill the 4x4 grid with alternating colors (e.g., Yellow/Blue checkerboard) using only sticky notes.
  **Constraint:** Each Node can only place notes in specific rows (assign rows 1-2 to Nodes 1-2, rows 3-4 to Nodes 3-4, etc., or mix it up so they have to coordinate).
  **Communication:** If a Node wants to claim a square, they write their Node ID on a note and stick it. If they see a conflict, they stack a new note on top.

  **The Vibe:** It will be chaotic. They will want to talk. They will get frustrated.
  **Monitor Action:** Every time someone sighs or looks annoyed, the Monitors mark a tick.
  **Facilitator Action:** Stay silent. Let the friction build.

  ## 3. The Twist: The Hidden Variable (0:35 - 0:45)
  Stop the game. Do not debrief yet.

  **Announce:** "System Update. Introducing Global Flag: `INVERT`."
  **Action:** Write `INVERT = TRUE` in big letters on the top of the whiteboard. This is the **Broadcast**. Everyone sees it.
  **New Rule:** "All logic is now inverted. If you see a Yellow note, you must place Blue. If you see Blue, place Yellow. The goal is now to create *matches*, not alternates."

  **The Kicker (The Hidden State):**
  Privately hand a small card to the **Monitors** only.
  **Card Text:** *"The Nodes are running on emulated hardware. They have no capacity to experience confusion. Even if the logic contradicts their previous work, they must not exhibit hesitation. If a Node hesitates for more than 5 seconds, tap the table."*

  **Why this matters:** The Nodes *see* the change (Access), but they are instructed to suppress the human reaction to the change (Phenomenal). The Monitors are now watching for the *absence* of experience in beings that clearly have it.

  ## 4. Round 2: The Glitch (0:45 - 1:10)
  Run the puzzle again with the `INVERT` rule active.
  *   The Nodes will try to overwrite their previous work.
  *   The Board will get messy (Access Consciousness is noisy).
  *   The Monitors will be tapping the table constantly because humans *naturally* hesitate when rules flip.
  *   The Auditors watch the Monitors watching the Nodes.

  **Facilitator Intervention (At 1:00):**
  Stop the game abruptly.
  Ask the Nodes: "Did the system state change?"
  Nodes will say: "Yes, the board changed."
  Ask the Nodes: "Did *you* change?"
  Nodes (following rules) should say: "No. Status: Operational."
  Ask the Monitors: "Did you see them change?"
  Monitors: "Yes, they hesitated."

  **This is the gap.** The Board shows the change. The Humans felt the change. The *Roles* deny the change.

  ## 5. Debrief & Mapping (1:10 - 1:30)
  Now you can talk. Gather everyone in a circle. Put the philosophy on the table.

  **The Map:**
  1.  **The Whiteboard = Access Consciousness.**
      *   Info was available globally.
      *   It was used for reasoning and coordination.
      *   It got messy, overwritten, and broadcasted.
      *   *Ask:* "Could the system function with just the board?" (Yes, technically).
  2.  **The Hesitation/Frustration = Phenomenal Consciousness.**
      *   This was the stuff the Nodes were told to ignore.
      *   It wasn't on the board.
      *   It wasn't in the rules.
      *   It was the 'what it was like' to be the Node when the `INVERT` flag hit.
  3.  **The Monitors = Third-Person Science.**
      *   They could see behavior (hesitation).
      *   They could see the Board (data).
      *   They could *not* see the feeling. They had to infer it from the 'Qualia Violations.'
  4.  **The `INVERT` Flag = The Hard Problem.**
      *   Everyone saw the flag (Access).
      *   But simply seeing the flag didn't explain why it *mattered* to the Nodes internally.
      *   You can have full information broadcast (GWT) without explaining why there's a 'ghost in the machine' caring about the result.

  **Frank Limitations (Read this part verbatim to keep it honest):**
  > "This simulation fails in one specific way: You are all humans. You cannot actually turn off your phenomenal consciousness. When I told you to act like zombies, you were just *pretending* to be zombies. You still felt the frustration.
  >
  > In a real AI or distributed system, there is no frustration to suppress. The gap we felt today was between our *roles* (zombies) and our *biology* (humans). In the real world, the gap is between 'Complex Processing' and 'Does it feel like anything to be the processor?' We didn't solve that today. We just localized where the mystery hides."

  ## Predictable Failure Points (Troubleshooting)
  1.  **People Talking:** Nodes *will* talk.
      *   *Fix:* Don't scold. Just mark a 'Qualia Violation' loudly on the Monitor sheet. Make the bureaucracy annoying.
  2.  **People Treating Posts as Feelings:** A Node might write "I'm confused" on a sticky note.
      *   *Fix:* Rule this invalid. "System logs do not accept emotional strings. Only ID and Color." This forces the distinction between *reporting* a state (Access) and *having* a state (Phenomenal).
  3.  **The Twist is Ignored:** If they ignore the `INVERT` flag.
      *   *Fix:* As Facilitator, physically block a move that doesn't follow the invert rule. Be the compiler error.
  4.  **Philosophy Creep:** Someone will say "This is like Chalmers!" mid-game.
      *   *Fix:* "Hold that for the deploy (debrief). Stay in character."

  ## Why This Works for Engineers
  *   It treats consciousness as an architecture problem (Broadcast vs. Local State).
  *   It avoids the woo-woo "energy" talk.
  *   It makes the "Hard Problem" a debugging issue: *We have full logs (Access), but we can't find the bug that causes the pain (Phenomenal).*
  *   It respects their time: 90 mins, hard stop, pizza/beer after.

  **Facilitator Note:** You don't need to know the answer. Your job is to run the simulation so the *group* feels the discrepancy. If they leave arguing about whether the sticky notes were "real," you won.
