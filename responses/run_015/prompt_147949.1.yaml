answer: |-
  Hey, I have been thinking about your argument and the lunchroom debate you described ever since you sent that message, and I want to say first off that your frustration is completely warranted because you are bumping up against the exact seam where philosophy of medicine stops being abstract and starts bleeding into the electronic health record. You are asking what concept of disease your daily practice actually presupposes, and if I am reading the situation correctly, the practice of modern primary care, especially regarding these risk-factor conditions like stage 1 hypertension or prediabetes, has quietly abandoned the search for a natural kind and adopted a pragmatic normativism that your friend is pointing at, though perhaps with a bit more nuance than they are giving it credit for. The way you describe diagnosing a patient who feels fine based on a number that crossed a line set by a committee suggests that the concept of disease operating here is not about a current state of biological malfunction but rather about a future probability of harm that has crossed a threshold of actionability. This effectively rules out a strong naturalist view, like the one Boorse advocated, which defines disease as a statistical subnormal functioning relative to a species design. Naturalism cannot survive the reference-class-plus-dispersion problem you identified because there is no fact of the matter in the biology itself that tells us whether 130 over 80 is diseased while 129 over 79 is healthy. If disease were purely a biological fact, changing the guideline from 140 to 130 would not instantly convert millions of healthy people into diseased people without any physiological change occurring inside them. The fact that the diagnosis shifts based on committee decisions about where the benefit of intervention outweighs the harm proves that the category is not discovered in nature but is constructed for a purpose.

  Your co-resident's suggestion that disease might be a vague predicate and the thresholds are precisifications is actually a sophisticated philosophical move and not a dodge at all. In logic, a vague predicate is one where there are borderline cases, like the heap of sand paradox, and there is no sharp line where sand becomes a heap. Risk for cardiovascular disease is continuous, a smooth curve without any biological cliff edge, so the binary label of hypertension is indeed a precisification of a fuzzy underlying reality. We draw a line not because nature drew one there, but because we need to make binary decisions in a world of continuous risk. However, this admits that the disease label is a tool for decision-making rather than a description of ontology. This is where the hybrid view, which requires both dysfunction and harm, starts to struggle in your clinic. For a patient with subclinical hypothyroidism or osteopenia, it is hard to point to a specific mechanism that has failed in the way a heart valve fails in stenosis. The dysfunction is often retroactively inferred from the risk statistic rather than observed directly. If the only evidence of dysfunction is that the number predicts a bad outcome, then the dysfunction is doing no explanatory work; the risk prediction is doing all the labor. So the practice seems committed to the idea that disease is a status we assign to facilitate management, which aligns with your friend's normativist claim, but you are right to push back that it is not purely values all the way down. The values are constrained by the epidemiology. We cannot set the threshold wherever we want because the risk curves are real biological facts, but where we cut along that curve is a value judgment about how much medicalization we are willing to tolerate for how much risk reduction.

  This leads to the question of whether the practice is strictly normativist or underdetermined, and I think the answer is that the practice is underdetermined by theory but overdetermined by infrastructure. Several theories could license what you do, but only one fits the billing and quality metric structure we are trapped in. You could practice risk-based medicine without the disease label, but the system forces the binary because insurance companies require ICD codes to release funds and quality measures like HEDIS require denominators of diseased patients to calculate performance. So while the philosophy might support a graded risk model, the political economy of healthcare demands a binary disease model. This is why the reference class problem is so insidious in your work. You noted that the lab reference ranges are contaminated by prior practice because the population is already treated. This means we have lost the natural baseline required for naturalism. We are comparing patients to a treated population to decide if they need treatment, which is a circular logic that only makes sense if the goal is maintenance of a social norm of health rather than restoration of a biological function. The practice presupposes that health is a manageable resource and disease is a flag for when that resource needs administrative attention.

  If you were to replace the binary with treating on graded absolute risk and drop the disease labels entirely, the changes in the clinic would be profound and mostly disruptive to the current workflow. The most immediate change would be in the sick role. When you tell a patient they have hypertension, they adopt a social identity that comes with expectations of compliance and limitation. If you tell them their ten-year risk is 7.5 percent, that identity dissolves, and while this might reduce anxiety and stigma, it often reduces adherence because humans are better at responding to concrete threats than abstract probabilities. You would lose the rhetorical power of the diagnosis to motivate lifestyle change, which is a tool you likely use on Tuesday afternoons when trying to convince someone to cut salt. But the bigger barriers are institutional. Insurance coverage would likely collapse for preventive medications because payers use the diagnosis code to justify the cost of the statin or the antihypertensive. Without the label of disease, the intervention looks like enhancement or lifestyle optimization, which is rarely covered. Quality metrics would also break because it is much harder to measure whether you managed risk appropriately than whether you checked a box for a specific disease cohort. You would move from measuring process to measuring outcomes, which takes years to manifest, whereas current metrics measure whether you offered the treatment today.

  So to answer your core question about what concept of disease this practice presupposes, it is a pragmatic operationalism that treats disease as a flag for actionable risk rather than a biological state. It rules out strong naturalism because it admits the thresholds are contingent on human values and economic constraints. It strains the hybrid view because the dysfunction is often invisible or non-existent. It validates the vague predicate argument because the binary is imposed on a continuum. And it reveals that your friend is mostly right, except that the billing code is not just a side effect but a constitutive part of the definition in our current system. The disease exists because the system allows us to act on it and get paid for acting on it. This might feel cynical, but it is also liberating because it reminds you that when you diagnose prediabetes, you are not revealing a hidden truth about the patient's essence but rather inviting them into a management program based on probabilities. The tension you feel comes from trying to hold two incompatible ideas in your head at once: that disease is a biological fact you discover and that disease is a social tool you use. In your daily work, especially with these borderline conditions, it is overwhelmingly the latter, and acknowledging that might not solve the overdiagnosis problem, but it would stop you from looking for a biological ghost in the machine where there is only a spreadsheet of risk.
