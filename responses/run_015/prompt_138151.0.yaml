prompt: |-
  Hi — I'm on the grants committee of a small family foundation (five trustees, monthly meetings, maybe a dozen grants a year out of about a million dollars total, and the closest thing we have to a research capacity is me with a spreadsheet). We keep having the same arguement and I want to stop having it by turning it into a form we fill in.

  The argument in one paragraph: almost every proposal has near-term effects we can sort of see and long-run effects we can't see at all. Cash transfers to very poor households obviously help the recipients, but they also move local prices, and migration, and maybe fertility, and therefore possibly who exists in twenty years. The deworming proposal has beautiful trial evidence on school attendance, thin evidence on earnings, and no evidence whatsoever on what a slightly better-educated cohort does to a country's politics or growth rate. And then we get asks like a curriculum-reform advocacy group where the entire case is long-run and the near-term is invisible. Two of us have fallen into saying "we're clueless about the long run, therefore the near-term numbers shouldn't be allowed to decide it", and three say "the numbers are all we've got, therefore they should decide it", and if I'm honest both sides are using cluelessness as a route to a verdict they already liked.

  So: write me a decision procedure we can actually run on a proposal in an afternoon. Fixed order of questions, what counts as an adequate answer to each, where the procedure stops with a no, and where it hands the decision back to humans because the issue is one of values rather than evidence. It has to meet some constraints:

  - It can't require a number we have no way of getting. If a step needs a parameter, say what to do when it's unobtainable.
  - It has to terminate. We can't spend a meeting asking whether we're clueless about whether we're clueless.
  - I want it to separate two kinds of causal channel, roughly: ones where the effect enters through a damped, near-additive pathway (a consumable delivered once, a one-off medical treatment) and ones where it enters through a system that amplifies and redistributes — prices, norms, institutions, anything that changes what other agents later do. My hypothesis is that cluelessness is mainly a property of the second kind and that the procedure should treat the first kind as decideable on near-term numbers. Tell me if that's wrong.
  - Related: somewhere in it there should be a sign-stability check — not "estimate the size" but "would the sign of the total effect stay the same across a spread of background assumptions we can't distinguish between?" If the sign flips, I want the procedure to say the expected-value calculation was unearned, and to say what we do instead (fall back to option value? to reversibility? to near-term numbers as a tie-breaker only?).
  - It should flag explicitly when an intervention's main effect is identity-affecting — changes how many people exist, or when, or which ones — because that's where our committee visibly falls apart, and I suspect a lot of the rest of the disagreement is really about that.
  - And it should handle the fact that our counterfactual — the donor spending the money on something else, or the money not existing — is just as opaque as the grant.

  Then apply it to two proposals: the deworming program, and the curriculum-reform advocacy group. Include at least one place where the procedure gives an answer our committee won't like, and don't soften it. Finally, tell me which steps are judgement calls wearing a lab coat, and what the procedure simply cannot tell us.

  Keep it under 700 words, no citations or reading suggestions (we won't read them), and write it so the retired doctor and the lawyer on the comittee could follow it without me in the room.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **User:** Grants committee member of a small family foundation ($1M/year, ~12 grants, 5 trustees).
      *   **Problem:** Recurring argument about near-term measurable effects vs. long-term uncertain effects (cluelessness). Some trustees favor near-term numbers, others dismiss them due to long-run uncertainty. Both sides use uncertainty to justify pre-existing preferences.
      *   **Goal:** A decision procedure (form/checklist) to run on a proposal in an afternoon.
      *   **Constraints:**
          *   Fixed order of questions.
          *   Define adequate answers.
          *   Define stop points (No).
          *   Define hand-off points (Values vs. Evidence).
          *   No unobtainable numbers (specify defaults).
          *   Must terminate (no infinite regress).
          *   Distinguish causal channels: Damped/Near-additive (consumables, one-off treatments) vs. Amplifying/Systemic (prices, norms, institutions).
          *   Include a sign-stability check (does the sign flip under different assumptions?).
          *   Flag identity-affecting interventions (population changes).
          *   Handle counterfactual opacity (donor spending elsewhere).
          *   Apply to two cases: Deworming program vs. Curriculum-reform advocacy.
          *   Include at least one unpopular answer.
          *   Identify "judgement calls wearing a lab coat" and limitations.
          *   **Length:** Under 700 words.
          *   **Tone:** Accessible to a retired doctor and a lawyer (no jargon, no citations).

  2.  **Drafting the Procedure:**
      *   Need a step-by-step flow.
      *   *Step 1: Counterfactual.* Where else would money go? If nowhere (money disappears), bar is lower. If better cause, bar is higher. Default: Assume money vanishes if unknown (conservative).
      *   *Step 2: Causal Channel.* Is it additive/damped (direct help) or systemic/amplifying (changing rules/norms)?
      *   *Step 3: Identity Check.* Does it change who exists or when? If yes, flag for values vote.
      *   *Step 4: Sign Stability.* If we change assumptions, does "good" become "bad"?
      *   *Step 5: Decision Rule.* Based on previous steps.

  3.  **Refining the Procedure (incorporating constraints):**
      *   *Constraint:* Separate damped vs. amplifying.
      *   *Constraint:* Sign stability.
      *   *Constraint:* Identity affecting.
      *   *Constraint:* Termination.

      *Drafting steps:*
      1.  **Counterfactual Baseline:** If we don't fund this, does the money get spent on something else by us? If yes, compare. If no (money stays in bank), baseline is zero. *Default:* Assume money stays in bank unless a specific better alternative is on the table.
      2.  **Causal Type:** Is the main benefit direct consumption/treatment (Damped) or system change/norms (Amplifying)?
      3.  **Identity Check:** Does this significantly change population size or timing of birth? If Yes, stop. This is a Values Vote, not evidence.
      4.  **Sign Stability:** For Amplifying types, list 3 reasonable background assumptions (e.g., government responds well, government responds poorly, status quo). Does the intervention remain positive in all 3? If No (sign flips), evidence is insufficient for long-run claims.
      5.  **Verdict:**
          *   Damped + Positive Near-Term = Fund (unless Identity Check failed).
          *   Amplifying + Sign Stable = Fund.
          *   Amplifying + Sign Unstable = Reject (or fund only for near-term value).
          *   Identity Check Failed = Committee Vote on Values (majority rules).

  4.  **Applying to Cases:**
      *   *Deworming:* Direct treatment (Damped). Near-term health/schooling clear. Identity effect minimal. Verdict: Fund.
      *   *Curriculum Advocacy:* System change (Amplifying). Long-run growth/politics. Sign stability? If gov implements poorly, could harm. Sign might flip. Verdict: Reject (or limit to near-term monitoring). *Unpopular answer:* Rejecting the advocacy group despite potential high upside because of sign instability.

  5.  **Addressing "Judgement Calls wearing a lab coat":**
      *   Classifying "Damped" vs. "Amplifying" is subjective.
      *   Choosing the "3 assumptions" for sign stability is subjective.
      *   The Counterfactual default is a value choice.

  6.  **Writing and Editing (Word Count Check):**
      *   Need to be concise.
      *   Ensure tone is practical.
      *   Ensure the "unpopular answer" is clear.
      *   Ensure the "identity" flag is clear.

      *Drafting content:*
      **The Foundation Decision Protocol**

      **Step 1: The Counterfactual Default**
      Question: If we say no, does this money fund a *specific* better proposal we already have?
      Answer: If yes, compare directly. If no (money sits idle or goes to general reserves), the baseline is zero impact.
      *Rule:* Do not invent hypothetical better uses. If no specific alternative exists, the baseline is "money unspent."

      **Step 2: Causal Channel Classification**
      Question: Is the primary benefit delivered directly to a recipient (e.g., cash, medicine, food) or through changing a system (e.g., policy, norms, prices)?
      *   **Type A (Direct):** Effects are damped. One unit in, one unit out.
      *   **Type B (Systemic):** Effects are amplifying. One unit in, unknown multiplier out.
      *Rule:* If unsure, classify as Type B.

      **Step 3: The Identity Flag**
      Question: Does this intervention primarily work by changing how many people exist, when they are born, or which specific individuals exist?
      *Rule:* If **Yes**, stop. Evidence cannot resolve this. Proceed to **Step 6 (Values Vote)**.

      **Step 4: Sign-Stability Check (Type B Only)**
      Question: List three plausible background scenarios (e.g., government cooperates, government resists, external shock occurs). Does the intervention produce a net benefit in all three?
      *Rule:* If the effect is positive in some and negative in others (sign flip), the long-run expected value is uncalculable. Treat as **No** for long-run claims.

      **Step 5: The Verdict**
      *   **Type A (Direct):** Fund if near-term evidence is positive. Ignore long-run cluelessness.
      *   **Type B (Systemic) + Stable:** Fund.
      *   **Type B (Systemic) + Unstable:** Reject. Do not fund based on speculative long-run upside.
      *   **Identity Flagged:** Proceed to Step 6.

      **Step 6: Values Vote**
      For Identity-flagged proposals, trustees vote based on personal moral weighting, not evidence. Majority rules.

      **Application**
      **1. Deworming Program:**
      *   Counterfactual: Money unspent.
      *   Channel: Type A (Direct medical treatment).
      *   Identity: No (health improvements don't significantly shift population identity).
      *   Verdict: **Fund.** Near-term health/schooling evidence suffices. Long-run uncertainty is irrelevant for Type A.
      **2. Curriculum-Reform Advocacy:**
      *   Counterfactual: Money unspent.
      *   Channel: Type B (Systemic policy change).
      *   Identity: Possibly (education affects fertility/migration), but assume No for now.
      *   Sign-Stability: If the reform is implemented poorly or politicized, outcomes could worsen equity or growth. Sign flips between "competent state" and "captured state" scenarios.
      *   Verdict: **Reject.** The procedure forbids funding Type B interventions with unstable signs, regardless of potential upside.

      **Limitations & Judgement Calls**
      This protocol pretends to be objective, but three steps are values in disguise:
      1.  **Classification:** Deciding if an effect is "Direct" or "Systemic" is subjective. A cash transfer looks Direct, but if large enough, it changes local prices (Systemic). The protocol forces a binary choice where reality is a spectrum.
      2.  **Scenario Selection:** In Step 4, choosing which three scenarios to test determines the outcome. A pessimistic trustee will always find a sign flip.
      3.  **The Counterfactual Default:** Assuming money sits idle if no alternative is specified is a conservative value judgment, not a fact.

      **What It Cannot Tell Us**
      It cannot resolve disagreement about whether avoiding a small risk of harm (Type B Unstable) is better than guaranteeing a small good (Type A). It cannot tell us if changing *who* exists is good or bad. It stops the argument by forcing a classification, not by finding the truth.

