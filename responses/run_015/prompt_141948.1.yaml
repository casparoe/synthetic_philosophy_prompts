answer: |-
  # JOINT STATEMENT ON THE NORMATIVE STATUS OF LOGICAL UNCERTAINTY
  **Prepared by the [Pub Name] Reading Group**
  **Date:** October 26, 2023
  **Signatories:** [Side A Representatives], [Side B Representatives]

  ## PREAMBLE
  Over the past year, this group has examined the normative frameworks governing belief in logical propositions that are currently unproven. We have identified two distinct clusters of commitment. Side A ("Coherentists") prioritizes synchronic coherence relative to a single probability distribution. Side B ("Convergence") prioritizes diachronic performance relative to a class of feasible trading strategies. This document records our points of agreement, the precise structure of our disagreement, and the empirical or formal cruxes that would resolve it.

  ---

  ## 1. AGREED CLAIMS
  *We, the undersigned, affirm the following propositions as common ground for this dispute.*

  1.  **Constraints of the Calculus:** The standard probability calculus ($P(A) + P(\neg A) = 1$, etc.) constrains assignments only insofar as the logical relationships between propositions are *recognized* by the agent. Once an agent cannot compute the implications of its own knowledge base, the calculus dictates consistency among *explicit* beliefs but does not uniquely determine the values of *implicit* beliefs.
  2.  **The Money Pump Condition:** A theoretical vulnerability to a Dutch Book (money pump) constitutes a normative defect only if the bookie can construct the sequence of trades *without* first solving the logical uncertainty in question. If executing the pump requires proving the Twin Prime Conjecture, the threat of the pump is hostage to the same logical uncertainty it is supposed to punish.
  3.  **Bounded vs. Unbounded Uncertainty:** Uncertainty regarding a bounded computation (e.g., "Does this specific SAT instance of size $N$ have a solution?") is functionally distinct from uncertainty regarding an unbounded conjecture (e.g., "Are there infinitely many twin primes?"), even if both are logically determined. The former is resolvable by finite (though perhaps infeasible) lookup; the latter requires general proof. Both sides agree this distinction matters for agent design, even if they disagree on whether it matters for normative theory.
  4.  **Self-Reference and Future Proofs:** An agent cannot condition on proofs it does not yet possess. Due to Löbian obstacles, an agent cannot consistently believe "I will eventually prove $X$" without potentially triggering immediate inconsistency or triviality. Therefore, any normative theory must account for the fact that the agent's future belief state is logically opaque to its current self.
  5.  **Action Guidance:** Regardless of the theoretical justification, an agent facing a one-shot decision today (e.g., deploying a crypto protocol) must output a single number (a credence or price) to guide action. Both frameworks claim to offer guidance on what this number should be, and both agree that a framework that refuses to output a number for the sake of theoretical purity is practically useless.

  ---

  ## 2. DISAGREEMENTS TABLE
  *The following table isolates the core normative divergences. Column 1 is the neutral topic. Column 2 is Side A's preferred phrasing. Column 3 is Side B's preferred phrasing.*

  | Topic | Neutral Statement | Side A (Coherentists) | Side B (Convergence) |
  | :--- | :--- | :--- | :--- |
  | **The Ideal** | What defines a rational belief state at time $t$? | A rational state is one that approximates the unique coherent distribution over logical completions consistent with current knowledge. Incoherence is a defect, even if unavoidable. | A rational state is one that lies on a trajectory converging to truth on provable statements while resisting exploitation by feasible traders. Incoherence is a transient cost of computation. |
  | **The Prior** | Does a "true" prior over logical sentences exist? | Yes. There is a fact of the matter about the correct prior (e.g., a universal semi-measure), even if it is uncomputable. It serves as the regulatory ideal. | No. A prior over all logical sentences is a mathematical fantasy. There are only priors over *traders* or *patterns* that we can actually implement. |
  | **Exploitability** | What does it mean to be "Dutch Bookable"? | It means there exists a set of bets that guarantees loss, regardless of whether the bookie can find them efficiently. Vulnerability is the sin. | It means there exists a *polynomial-time* (or feasible) strategy that extracts unbounded value. If the exploit is intractable, the vulnerability is irrelevant. |
  | **Logical Risk** | How should we treat the risk of a proof emerging? | As standard Bayesian updating. The probability mass shifts as the likelihood of a proof existing updates based on meta-evidence. | As a distinct asset class. The risk is not just about the fact, but about the *discovery process*, which behaves differently than empirical risk. |

  ---

  ## 3. CRUXES AND CONCRETE CASES
  *For each case below, we specify the scenario, the specific question at issue, and the distinct predictions/offers made by each side. We agree to treat these as evidence bearing on the cruxes.*

  ### Crux 1: The Normative Silence of Limits
  **Case 1: The Sign-Off (Verification Engineer)**
  *Scenario:* An engineer must certify a cryptographic construction today. The relevant mathematical claim (e.g., security reduction) will not be settled for decades.
  *Question:* What does an "in-the-limit" criterion say about the number she acts on *now*?
  *   **Side A Prediction:** The limit criterion implies she should use the marginal probability derived from the unique coherent prior conditioned on all *current* proofs. Deviating from this to be "safe" is irrational risk-aversion masking as logic.
  *   **Side B Prediction:** The limit criterion is silent on the single-shot case. The correct number is determined by the worst-case loss against feasible adversaries *today*, which may require discounting the coherent prior heavily to account for unknown proof-structures.
  *   **Adjudication:** If the engineer uses the "coherent" number and the system fails due to a subtle logical flaw that was "in principle" improbable but structurally likely, Side B claims vindication that the limit prior was the wrong guide.

  ### Crux 2: Testimony from Fallible Heuristics
  **Case 2: The Sieve (Heuristic Engine)**
  *Scenario:* A fast heuristic engine flags a hard claim as "Likely Provable" (90% accuracy historically). A slow verifier settles it one year later.
  *Question:* What is the right interim credence, and how is the heuristic discounted?
  *   **Side A Prediction:** Credence should be $P(Proof | Heuristic)$. This is calculated by treating the heuristic as a noisy channel about the logical truth. The update is static based on the heuristic's known calibration.
  *   **Side B Prediction:** Credence should track the *market price* of the claim given the heuristic. The heuristic is not a channel to truth, but a trader. If the heuristic is correlated with other traders, the discount rate changes based on market liquidity, not just historical accuracy.
  *   **Adjudication:** If the heuristic is accurate but highly correlated with other failed heuristics (systemic logical blind spots), Side A predicts standard Bayesian update; Side B predicts a lower credence due to lack of diversification in the "trader pool."

  ### Crux 3: Residual Risk in Finite Markets
  **Case 3: Settlement-Lag (Prediction Market)**
  *Scenario:* A prediction market on an open conjecture cashes out at a fixed date $T$. No proof exists at $T$.
  *Question:* Who holds the residual, and is it ordinary risk or logical risk?
  *   **Side A Prediction:** The price at $T$ represents the conditional probability of truth given no proof yet. The residual is ordinary risk; it should behave like a binomial outcome with unknown $p$.
  *   **Side B Prediction:** The residual is *logical* risk. It will not behave like ordinary risk (e.g., volatility will not decay as $1/\sqrt{N}$). It behaves like a tail risk that cannot be diversified away because all traders share the same logical blind spots.
  *   **Adjudication:** Statistical analysis of market volatility near $T$. If volatility decays according to standard Bayesian convergence, Side A wins. If volatility remains sticky or exhibits heavy tails distinct from empirical events, Side B wins.

  ### Crux 4: Information Asymmetry and Convergence
  **Case 4: Mirror Markets (Axiom Seeding)**
  *Scenario:* Two prediction markets run on the same conjecture. Market 1 is seeded with a leaked hint that a proof exists (or an extra consistent axiom). Market 2 is not.
  *Question:* Do the price series converge, and does convergence discriminate the accounts?
  *   **Side A Prediction:** Prices should diverge immediately and stay divergent proportional to the Bayesian update on the hint. Convergence would only happen if Market 2 independently infers the hint.
  *   **Side B Prediction:** Prices may converge if the hint does not enable *feasible* traders in Market 1 to actually find the proof. If the hint doesn't change the *computational* landscape, it shouldn't change the price significantly in a bounded market.
  *   **Adjudication:** If the hint is "Proof exists" but provides no path, and Market 1's price spikes while Market 2 stays flat, Side A views this as rational updating. Side B views this as a bubble if no feasible trader can cash the ticket.

  ---

  ## 4. ANALYSIS: VERBAL VS. REAL DISPUTE
  *We explicitly categorize the remaining friction points.*

  ### Merely Verbal
  1.  **Definition of "Probability":** Side A uses "probability" to mean *degree of belief in a coherent ideal agent*. Side B uses "probability" to mean *fair betting price against a bounded adversary*. Much of our shouting matches stem from Side A accusing Side B of abandoning probability, while Side B accuses Side A of abandoning computation.
  2.  **Definition of "Rationality":** Side A defines rationality as *structural integrity* (coherence). Side B defines rationality as *survival and success* (calibration/no-regret). We agree that an ideal agent would have both, but disagree on which constraint binds when they conflict.

  ### Real (Substantive)
  1.  **Action Guidance in the Interim:** This is not verbal. Side A prescribes actions based on the *best estimate of the truth*. Side B prescribes actions based on the *robustness against exploitation*. In high-stakes, low-data logical environments (like the Sign-Off Case), these will output different numbers. This affects safety margins and resource allocation.
  2.  **Treatment of Uncomputable Ideals:** Side A believes referencing an uncomputable prior provides normative traction (it tells you which way to lean). Side B believes referencing an uncomputable prior is noise that distracts from designing actual algorithms. This affects research funding and engineering priorities.
  3.  **Nature of Logical Risk:** Whether logical uncertainty diversifies like empirical uncertainty (Side A) or correlates across all reasoners due to shared computational limits (Side B) is an empirical claim about the structure of mathematics and cognition. This is testable via the Settlement-Lag and Mirror Markets cases.

  ---

  **Signed,**

  _________________________ (Side A)

  _________________________ (Side B)

  _________________________ (Mediator/Host)
