  2. Most conservative thinkers treat these principles as interchangeable rules of thumb without wrestling with the moral messiness of traditions rooted in injustice. They assume the fence protects something good, leaving a gap in the theory when the fence was actually built to keep people out.
  3. I'll map the conceptual differences between the two principles and then test them against two short case studies, like voting property qualifications and exclusionary zoning. This mix of theory and real-world examples should show where the principles break or hold.
  4. Success means producing a clear framework for when conservatives should oppose inherited injustices rather than defend them out of habit. Failure would be just restating the obvious that bad fences should come down without adding any nuance to the philosophical debate.
  5. Six months part-time is tight but doable since I'm narrowing the scope to just two case studies instead of a full historical survey. It won't be a book, but it should be enough to draft a solid paper that sparks the right arguments.
