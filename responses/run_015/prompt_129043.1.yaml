  # SEMINAR HANDOUT: The Ethics of Lying vs. Misleading
  **Course:** Ethics 101 | **Topic:** Truthfulness & Deception

  ## Instructions
  Work through the decision tree below. At each **Node**, read the concrete case and select the answer that best matches your moral intuition. Follow the arrow to the next Node or to a final **Leaf** (Position). Once you land on a Leaf, check the **Key** at the end to see which philosophical view matches your path.

  ---

  ## THE SORTING TREE

  ### NODE 1: The Palter (Literally True but Misleading)
  **Case:** You broke a vase. Your roommate asks, "Did you break the vase?" You know the cat was in the room earlier. You say, "The cat was in the room," implying the cat did it, though you know the cat didn't. You have said something *literally true*.
  *   **(A)** Lying ("No") is worse than this. → Go to **NODE 2**
  *   **(B)** They are morally equal. → Go to **NODE 4**
  *   **(C)** This is worse than lying. → Go to **NODE 6**

  ---

  ### NODE 2: The Murderer at the Door (High Stakes)
  **Case:** (From Path 1A) A known murderer asks you where your friend is hiding. You believe lying is generally worse than misleading, but this is life-or-death.
  *   **(A)** You must not lie, even to save a life. → **LEAF 1**
  *   **(B)** You may lie to save a life. → Go to **NODE 3**

  ### NODE 3: The Phatic Social Lie (Context)
  **Case:** (From Path 2B) A friend gets a bad haircut and asks, "Do you like it?" You say "Yes" to spare their feelings, though you don't.
  *   **(A)** This is still morally wrong (a lie is a lie). → **LEAF 2**
  *   **(B)** This is permissible (context changes the duty). → **LEAF 3**

  ---

  ### NODE 4: The Double Audience (Who is Deceived?)
  **Case:** (From Path 1B) You are giving a public speech. You say something ambiguous. Your main audience understands the truth, but a bystander overhears and is genuinely misled.
  *   **(A)** This is wrong (the bystander was deceived). → Go to **NODE 5**
  *   **(B)** This is permissible (you owed truth only to the addressee). → **LEAF 4**

  ### NODE 5: The White Lie (Consequences)
  **Case:** (From Path 4A) You tell a small deception that prevents significant emotional harm and causes no long-term distrust.
  *   **(A)** The good outcome makes it permissible. → **LEAF 5**
  *   **(B)** The deception itself remains wrong, regardless of outcome. → **LEAF 6**

  ---

  ### NODE 6: Willful Ignorance (Sincere Falsehood)
  **Case:** (From Path 1C) You suspect a report is false but avoid checking the facts so you can sincerely say, "I believe this report is true," knowing it will mislead others.
  *   **(A)** This is worse than a standard lie (calculated ambiguity). → **LEAF 7**
  *   **(B)** It is no worse than a standard mislead. → Go to **NODE 7**

  ### NODE 7: The Warrant (Commitment)
  **Case:** (From Path 6B) Compare two scenarios: (1) Lying under oath in court. (2) Misleading a colleague during casual lunch chat.
  *   **(A)** Lying is worse because assertion creates a specific commitment. → **LEAF 8**
  *   **(B)** There is no special commitment in assertion. → Go to **NODE 8**

  ### NODE 8: The Trust Relationship (Long-Term)
  **Case:** (From Path 7B) You misleadingly imply something to a stranger vs. your spouse of 20 years.
  *   **(A)** It is worse when it damages the specific relationship. → **LEAF 9**
  *   **(B)** The relationship status makes no moral difference. → **LEAF 10**

  ---

  ## INSTRUCTOR'S KEY & LOGICAL SPACE DIAGNOSIS

  ### The Leaves (Positions)
  *   **Leaf 1: Absolutism about Lying.** (e.g., Kant). Lying violates the categorical imperative; consequences do not override the duty of truth-telling.
  *   **Leaf 2: Pro-tanto Assertionism.** (e.g., Ross). Lying is a *prima facie* duty violation. It is distinct from misleading, but can be overridden by other duties (like saving life), though not by mere politeness.
  *   **Leaf 3: Trust/Relationship Picture.** The wrongness depends on the social context and the expectations of the relationship (e.g., phatic communication is exempt).
  *   **Leaf 4: Autonomy/Rights Picture.** You violate autonomy only when you deny the *addressee* the tools to judge truth. Bystanders have no claim on your testimony.
  *   **Leaf 5: Straight Consequentialism.** The method (lie vs. mislead) is irrelevant. Only the net harm/benefit determines permissibility.
  *   **Leaf 6: Deception-First View.** The core wrong is *intentional deception*, not the assertion itself. Lying and misleading are morally identical because they share the same intent.
  *   **Leaf 7: Misleading > Lying (Paltering View).** Misleading can be *worse* because it insulates the speaker from accountability and manipulates the listener's reasoning more deeply than a blunt lie.
  *   **Leaf 8: The Warrant View.** (e.g., Fallis). Asserting creates a normative commitment to truth that implying does not. Lying violates this warrant; misleading does not.
  *   **Leaf 9: Empty Cell (Contextual Absolutism).** *Diagnosis:* **Unexplored/Unattractive.** This view holds that misleading is always worse than lying, but *only* within close relationships. No major theory isolates relationship status as the sole switch for this specific hierarchy.
  *   **Leaf 10: Empty Cell (Radical Equivalence).** *Diagnosis:* **Incoherent.** This view holds that misleading is worse than lying (Node 6), assertion creates no commitment (Node 7), *and* relationship context doesn't matter (Node 8). If none of these factors matter, there is no logical basis for claiming misleading is worse in the first place.

  ### Logical Space Notes
  1.  **Indistinguishable Leaves:** **Leaf 5 (Consequentialism)** and **Leaf 6 (Deception-First)** may converge in practice. If a Deception-First theorist admits that "preventing catastrophic harm" overrides the duty not to deceive, their verdicts will match the Consequentialist's on almost all standard cases. This tree separates them based on *why* the act is wrong (Harm vs. Deception), but a student might find the *outcomes* identical.
  2.  **Empty Cells:** The logical space allows for a view where **Lying is Permissible but Misleading is Forbidden** (The Reverse Absolutist). This cell is empty because it is philosophically unstable: if the more transparent act (lying) is allowed, it is incoherent to forbid the less transparent act (misleading) unless one values "literal truth" over "honesty," a view few defend.

  ### Design Logic (For Seminar Discussion)
  *   **Nodes 1, 6, 7** probe the *Mechanism* (Assertion vs. Implication).
  *   **Nodes 2, 3, 5** probe *Defeasibility* (Can the rule be overridden?).
  *   **Nodes 4, 8** probe the *Victim* (Who is owed the truth?).
  *   **The Tree Structure:** Built on three binary dimensions: (1) Is the mechanism morally salient? (2) Is the duty absolute? (3) Who is the victim of the deception?
