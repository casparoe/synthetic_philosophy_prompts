      *   **Reasoning:** Explain *why* this path. It treats the "loss" of the semantic argument not as a dismissal, but as a risk management constraint. It treats the "win" of the functional argument as a pragmatic allowance, not a metaphysical truth.
      *   **Next Steps:** What the committee needs to do at the meeting (vote, define working group, etc.).

  4.  **Refining Tone and Language:**
