  hey im trying to wrap my head around the procreation asymetry for school. can u write a short story about a clinc where parents can generate digital consciousness but have to sign a form comparing expected suffering to the zero baseline of never existing? make sure the story shows that not making the upload isnt bad for anyone, but making one that suffers is real harm. please begin right with the story, no preface or commentary, and dont restate the prompt. no bibliographies or citations, just use what u know. thx
