prompt: |-
  My sister is just scary accurate at predicting what people are gonna do — she'll say "you're not taking that job offer" and sure enough I don't, and she's basically never been wrong. A few days ago she told me, dead serious, that I'm getting in a car accident on the 40 tomorrow around lunch. I was planning to drive to work like normal. Now I'm stuck: if I stay home I prove her wrong, which feels off given her track record, but if I drive I'm just walking into it. And the part that really breaks my brain is how she could know I'd drive when I'm the one choosing — I can just decide not to go, I'm not a robot. So is she wrong this time, or is something gonna force me out the door anyway? What should I actualy do tomorrow, and am I the one losing it?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Situation:**
      *   **The Claim:** The user's sister has a history of accurate predictions about the user's behavior (e.g., job offers).
      *   **The Specific Prediction:** "You're getting in a car accident on the 40 tomorrow around lunch."
      *   **The Conflict:**
          *   Option A: Drive to work. Risk: Accident (as predicted).
          *   Option B: Stay home. Risk: Proving her wrong (which feels "off" given her track record) + potential work consequences.
      *   **The Philosophical/Psychological Dilemma:** Free will vs. Determinism/Precognition. How can she know if the user can choose otherwise?
      *   **Emotional State:** Anxious, confused ("breaks my brain"), questioning sanity ("am I the one losing it?").

  2.  **Evaluate the Sister's "Power":**
      *   *Behavioral Prediction:* Predicting a job offer rejection is based on knowing the sister's personality, fears, habits, and decision-making patterns. This is psychological insight, not supernatural precognition.
      *   *Event Prediction:* Predicting a specific car accident is fundamentally different. It involves external variables (other drivers, road conditions, mechanical failure) that are not solely within the user's control or psychological makeup.
      *   *Conclusion:* The sister is likely very observant and knows the user well, but she cannot predict random external events like traffic accidents with certainty.

  3.  **Address the "Self-Fulfilling Prophecy" Risk:**
      *   If the user drives *anxious* because of the prediction, they might drive defensively (good) or distractedly/panic-driven (bad).
      *   If the user stays home, they avoid the risk entirely.
      *   The goal is safety, not "winning" against the sister.

  4.  **Address the Free Will/Logic Aspect:**
      *   The user is right to be confused. If the prediction causes the user to stay home, the prediction *cannot* come true. This creates a logical paradox if the prediction is treated as absolute fact.
      *   The fact that the user *can* choose to stay home proves the sister isn't omniscient.

  5.  **Formulate Advice (Safety First):**
      *   **Immediate Action:** Do not drive if genuinely terrified. Anxiety causes accidents.
      *   **Alternative:** Work from home, take a personal day, or find alternative transport (train, ride-share, though those have risks too, just different).
      *   **Reframing:** Treat the sister's comment as a warning to be careful, not a prophecy.
      *   **Mental Health Check:** Is the sister actually psychic, or is this a pattern of control/anxiety? Is the user becoming overly suggestible?

  6.  **Drafting the Response (Iterative Process):**

      *   *Empathy:* Acknowledge the creepiness and stress of the situation. It *is* unsettling.
      *   *Reality Check:* Distinguish between knowing *you* (psychology) and knowing *the future* (physics/chaos).
      *   *The Logic Trap:* Explain why staying home doesn't "prove her wrong" in a bad way; it proves you have agency.
      *   *Actionable Advice:*
          1.  Prioritize safety. If you're worried, don't drive.
          2.  Don't feed the anxiety.
          3.  Consider the sister's motive (is she trying to help or control?).
      *   *Sanity Check:* You are not losing it. This is a normal reaction to an abnormal statement.

  7.  **Refining the Tone:**
