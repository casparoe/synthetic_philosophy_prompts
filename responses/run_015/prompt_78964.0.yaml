answer: |-
  This is a classic ethics standoff: **Consequentialism (Dana)** vs. **Deontology (Marcus)**. Dana is arguing based on outcomes and who actually gets hurt *now*. Marcus is arguing based on duties, rules, and the intrinsic nature of a promise.

  Neither of them is a philosopher, but they stumbled into a debate that's been going on for centuries. Here's the breakdown turn-by-turn, looking at who held the stronger hand, where they slipped up, and what they missed.

  ### Turn 1: The Opening Salvo
  **Dana:** *A promise to a dead person can't bind you. The point is somebody counting on you. She's gone.*
  **Marcus:** *She counted on it while alive. Promises don't expire when they get inconvenient.*

  *   **Who wins the round:** **Marcus.**
  *   **Why:** Dana's opening move is intuitive but logically thin. She defines a promise strictly as a transaction between two living people where "letting someone down" requires them to feel disappointment. But that ignores the concept of **integrity**. If I promise a dead friend I'll look after their dog, and then I dump the dog at a shelter the day after the funeral, I've done something wrong even if the friend never knows. Marcus correctly identifies that the weight of the promise lands at the moment it's made, not the moment it's kept.
  *   **Where Dana overreaches:** She reduces morality to "getting caught" or "causing felt pain." If nobody knows you broke the promise, by her logic, it doesn't matter. Most people feel that's not true.
  *   **Where Marcus overreaches:** He uses the word "inconvenient." A new roof and tight money might be more than an inconvenience; they could be a crisis. Minimizing Rob's financial stress weakens his point slightly.

  ### Turn 2: The Cost of Principle
  **Dana:** *You're protecting the idea of promising, not her. Rob has to eat a real cost (money his kids could use). Dramatic promises shouldn't own you forever.*
  **Marcus:** *If it stops binding at death, it wasn't a promise. He handed her something real. Other people were counting on it (sister, kids).*

  *   **Who wins the round:** **Dana.**
  *   **Why:** Dana makes the crucial pivot to **competing duties**. Rob isn't just a vessel for his mom's wish; he's a father with responsibilities to his own children. Marcus was arguing in the abstract about "what is a promise," but Dana brought it back to "what does this cost the living?" She correctly points out that blind adherence to a rule can actually be immoral if it harms vulnerable people (the kids).
  *   **Where Marcus overreaches:** He introduces a new piece of evidence: *the sister and kids knew.* This is a risky move. If the sister doesn't actually care (as the prompt suggests regarding the family), Marcus is building his case on a fact that might not be true.
  *   **Where Dana shines:** She identifies that Marcus is worshipping the "rule" rather than the person. That's a strong critique of rigid moralizing.

  ### Turn 3: The Third-Party Problem
  **Dana:** *Now you've switched who it was for. If it binds because his sister is counting on it, that's different. If she's fine with selling, nothing's left to protect. "Holding it for nobody." Not every deathbed sentence is a mortgage.*
  **Marcus:** *(Implied defense of the previous point)*

  *   **Who wins the round:** **Draw / Edge to Dana.**
  *   **Why:** Dana catches Marcus in a potential contradiction. In Turn 2, Marcus said the promise was to the *mom* ("She died believing..."). Now he's saying it binds because the *sister/kids* know. Dana is right to call out that shift. If the obligation comes from the family's expectations, then the family's current wishes should matter. If the sister says "Sell it," Marcus's argument collapses.
  *   **The Nuance:** Dana's point about "Not every sentence in that room comes with a mortgage" is excellent. Deathbed conversations are emotional. People say "I promise" to mean "I love you enough to say what you want to hear." Distinguishing between a contract and a comfort is vital.
  *   **Where Marcus holds ground:** His metaphor of "handing her something real" is philosophically strong. Even if she's gone, the *assurance* she felt in her final days was a real thing Rob provided. Taking it back retroactively feels like a betrayal of that specific moment in time.

  ### Overall Scorecard
  *   **Marcus** wins on the **definition of integrity**. He successfully argues that a promise is a binding commitment of your future self, regardless of whether the recipient is around to enforce it.
  *   **Dana** wins on the **human cost**. She successfully argues that the living have needs that might outweigh the wishes of the dead, and that rigid rules shouldn't crush the people left behind.

  If this were a court of law, Marcus wins (a promise is a promise). If this were a court of public opinion or family therapy, Dana wins (don't starve your kids to keep a roof on an empty house).

  ### The Missing Angle: Spirit vs. Letter (and Rob's Agency)

  Both Dana and Marcus are treating Rob like a puppet. Dana thinks he's a puppet to his current finances; Marcus thinks he's a puppet to his past word. Neither of them is giving Rob enough credit as a moral agent who can interpret the promise.

  Here is the angle neither of them saw: **The Distinction Between the Object and the Value.**

  **1. What was the promise actually about?**
  When a dying mother asks her son not to sell a cottage, she is rarely making a real estate demand. She is usually asking for two things:
  *   **Continuity:** "Don't let our family history disappear."
  *   **Security:** "I want to know you have a safe place to go."

  If Rob sells the cottage because he's broke, he isn't necessarily violating the *spirit* of the promise if he handles it correctly. If he sells the cottage to pay for his kids' education or to secure a different kind of stability, he is still honoring the *value* his mom cared about (family well-being), even if he's letting go of the *object* (the bricks and mortar).

  **2. The "Clean Hands" Modification**
  Marcus argues the promise is binary (Keep it or Break it). Dana argues it's void. The third option is **Renegotiation with the Estate.**
  Rob isn't just bound by the word; he's bound by the relationship. If the family (sister, kids) agrees that selling is the best move for the *family's* survival, then the "family counting on it" argument Marcus made actually supports *selling*.
  *   **The Move:** Rob could sell the cottage, but designate a portion of the proceeds to maintain the family connection (e.g., funding annual reunions, keeping a photo archive, or buying a smaller shared property).
  *   **Why this works:** It acknowledges Marcus's point (the promise matters, the history matters) but accepts Dana's point (the financial reality is real, the dead don't need roofs).

  **3. The Burden of the Deathbed**
  There's a dark side to deathbed promises that neither friend touched on. Sometimes, dying people extract promises that are unfair because the survivor can't say no. It's emotional coercion, even if unintentional.
  *   **The Angle:** Rob needs to ask himself: *Did she promise me this place, or did I promise her this place?*
      *   If she left it to him unconditionally, she trusted him to make the best choice for his life.
      *   If he felt forced to promise to make her feel better, then the promise was an act of comfort, not a contract.
      *   **Verdict:** If the promise was primarily to give her peace in her final moments, keeping it at the expense of his children's future actually dishonors her. She wanted him to be okay, not to be destitute but morally pure.

  ### The Bottom Line for Rob
  Dana is right that the dead don't suffer, but Marcus is right that Rob will suffer if he feels he betrayed his word.

  The way out isn't to decide who won the argument. It's to realize that **keeping a promise doesn't always mean keeping the exact terms.** It means honoring the intent. If the intent was "Keep the family safe and connected," and selling the cottage is the only way to keep the family safe, then selling it—while openly acknowledging the promise and memorializing the cottage in another way—is the most honest thing he can do.

  He shouldn't sell it secretly (that proves Dana right, that it only matters if you get caught). He should sell it openly, tell the family why, and say, "Mom asked me to keep this, but she loved us more than she loved this house. I'm choosing us." That honors Marcus's demand for integrity and Dana's demand for practicality.
