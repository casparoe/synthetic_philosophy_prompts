      *   **Tone:** American English, analytical but accessible (since the friends aren't philosophers), balanced.
      *   **Context:** Rob promised his dying mom not to sell the lake cottage. Now he needs money/roof repair. Dana argues the promise is void because the promisee is dead. Marcus argues the promise binds regardless of death because of the nature of promising and third-party reliance.

  2.  **Deconstruct the Argument (Turn-by-Turn):**

