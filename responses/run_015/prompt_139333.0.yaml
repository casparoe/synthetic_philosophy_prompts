answer: |-
  **MEMORANDUM**

  **TO:** Content Committee, National History Museum
  **FROM:** [Your Name], Content Committee Member
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on Wall Text Labeling for the Kirzhak Campaign (1937–1941)

  **Recommendation**

  I recommend that the committee decide not to use the word "genocide" as a definitive characterization in the permanent gallery wall text for the Kirzhak campaign. Instead, we should describe the events with precise, high-gravity language that details the destruction of the Kirzhak way of life—specifically citing forced sedentarization, flock slaughter, and child removal—without applying the contested legal label. Our draft text should acknowledge the diaspora's classification in a subordinate clause if necessary, but must not assert it as established historical fact. This course of action aligns with our labeling policy regarding legal findings and ensures consistency with our treatment of neighboring cases. We must finalize this draft for review at the committee meeting in ten days. Once approved, the text will be locked six weeks later for production. This timeline allows us to incorporate committee feedback while meeting the gallery's opening schedule. By choosing descriptive severity over a single contested noun, we honor the victims without compromising our institutional standards for evidence and consistency.

  **What the committee is actually deciding**

  We are not merely choosing a word; we are deciding what function our labels perform. A label can act as a legal trigger, implying a judicial finding with downstream consequences for liability and recognition. It can serve as an honorific, offering moral validation to victims and descendants. Or it can act as an explanatory category, helping visitors understand the structural nature of the violence. Our institution is not a court; we cannot perform the legal trigger function without overstepping our mandate, especially given our policy against asserting legal findings no competent court has made. We can offer honorific weight through the gravity of our descriptions, but our primary duty is explanatory accuracy. Consequently, we are not deciding this case in isolation; we are establishing a rule for how we treat intent. We have used the word where courts convicted defendants of it. We have declined it where deaths were high but intent was purely military. We must now decide if brutal modernization with accepted lethality fits the rule. To maintain internal consistency, we must treat this case like the latter: high mortality without specific intent to destroy the group *as such*.

  **The strongest case for using the word**

  The argument for applying the label rests on a moral and philosophical understanding of destruction that predates the narrow legal codifications of the mid-twentieth century. As originally conceived, the term was meant to capture the destruction of the foundations of a group's existence, not merely the mass killing of its members. In the Kirzhak case, the state did not just kill individuals; it dismantled the material conditions required for the Kirzhak to exist as a distinct people. By slaughtering the flocks, closing the migration routes, and removing children to boarding schools where their dialect was punished, the state targeted the mechanisms of cultural transmission and economic survival. A group can survive biologically while ceasing to exist socially and culturally. The drastic fall in births and the near extinction of the dialect suggest that the future existence of the Kirzhak was indeed what was targeted. To withhold the word because most deaths resulted from hunger rather than bullets risks privileging the method of killing over the outcome of erasure. For the descendants, this label is not a legal technicality but the only vocabulary adequate to describe the loss of their world. Using it acknowledges that destroying a people's capacity to reproduce their way of life is functionally equivalent to destroying the people themselves.

  **The strongest case against it**

  The argument against the label, articulated most strongly by my colleague with legal expertise, centers on the requirement of specific intent. The core distinction separating this crime from others is not the body count, but the aim. The archives contain no order to destroy the Kirzhak; they contain orders to modernize them. The officials involved viewed the Kirzhak economy as an anachronism and sought to settle them for security and development reasons. The mortality was foreseen and accepted as a cost of this policy, but it was not the objective. If we classify accepted lethality during modernization campaigns as genocide, we risk diluting the term until it covers half the state-building projects of the twentieth century. This leaves us without a distinct category for cases where the object was actual extermination. Furthermore, our institutional policy explicitly forbids us from asserting legal findings no court has made. The successor state refuses the word, and no tribunal has convicted anyone of it. To apply it now would be to act as a retroactive court, undermining our credibility as historians. We must distinguish between a crime that is horrific and a crime that meets the specific threshold of intent to destroy a group *as such*. This campaign was the former, not the latter.

  **The middle options and why I am not recommending them**

  We might consider hedged formulations, such as "what some scholars call genocide," or attributing the label to the foreign parliament that resolved it was so. We could also employ the term "cultural genocide." I reject these options. Hedging formulations weaken our authority; visitors come to us for historical clarity, not a survey of contemporary debates. Attributing the label to a foreign parliament politicizes the text and shifts the burden of judgment to a political body rather than historical evidence. It suggests the classification is merely a matter of opinion rather than an assessment of facts. The term "cultural genocide" is similarly problematic. While it accurately describes the destruction of the Kirzhak way of life, it is not a recognized legal category and often confuses visitors who conflate it with the legal crime of genocide. It invites the same consistency challenges without offering greater precision. The best approach is to describe the acts themselves with unflinching clarity. By detailing the slaughter of the flocks and the removal of children, we convey the severity of the destruction without relying on a label that carries legal baggage we cannot substantiate. Plain language about specific harms is more powerful than a contested umbrella term.

  **What I should expect at the meeting, and what would change my mind**

  At the meeting, I expect our historians to argue that applying the label is anachronistic and polemical, risking the gallery's scholarly reputation. They will likely emphasize the lack of archival evidence for specific intent and warn against setting a precedent that forces us to relabel other modernization campaigns. They may also note the diplomatic friction with the successor state. I share these concerns regarding consistency and evidence. However, I would change my recommendation if new evidence emerged demonstrating specific intent to eliminate the Kirzhak as a group, rather than merely modernize them. If cabinet minutes or ministerial notes were found that explicitly ordered the destruction of the Kirzhak identity *as such*, rather than treating their mortality as an acceptable side effect, the intent threshold would be met. Absent such a document, the distinction between aimed-at destruction and accepted lethality must stand. I am prepared to defend the recommendation that we describe the horror without using the word, ensuring our gallery remains consistent, legally compliant, and historically rigorous.
