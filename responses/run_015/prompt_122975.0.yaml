  Im running a philosophy-and-film night at the library and we're doing Coco next month, and I want to pair it with that Hofstadter idea from I Am a Strange Loop — that an "I" isn't sealed inside one skull, that the pattern which is you gets partly built into other people's brains whilst you're alive, so that bits of you go on doing causal work in them after you die and death is a fading rather than a switch. What I keep coming back to is that the film is almost a designed test case for it: Ernesto de la Cruz is remembered by millions, and what's in all those heads is more or less a fiction, whereas Héctor is hanging on by one extremely old woman whose hold on him is going fast. On Hofstadter's picture you'd have to say the near-forgotten one is the one who's still genuinely there and the celebrity is barely there at all, because a widely circulating image of you isn't you — so does the film's rule (you last as long as someone remembers you) actually have the resources to make that distinction, or is it just a memory-meter? And is the ending — the photograph put back, the song taught on to the next generation — the real thing, a pattern re-instantiated and passed along, or is it closer to the cheap "bare copy" version of survival that the distributed-self view is meant to beat? Do say honestly where the film resists the reading as well: I don't want it flattened into an illustration, and if your view is that it's just a sentimental story about remembering the dead with an afterlife gimmick bolted on, I'd rather hear that. Around 700 words, and please no headings, bullet points, bold text or tables — just continuous prose I can read out loud.
