prompt: |-
  As a novelist developing the constitutional framework for a forthcoming work, I have tried to articulate the philosophical premises that render my fictional legal system coherent. Before I proceed, I want an audit of whether these commitments jointly hang together.

  My position is as follows:

  (1) Legal self-reference is benign only under stratification: a meta-rule governs object-rules, and direct circular self-application within a single level is impossible; this is how the paradox of self-amending rules is dissolved.

  (2) Any system worthy of being called law must contain at least one unamendable core provision—an entrenched hard core—otherwise it is merely a temporary allocation of power.

  (3) In my novel, the state's founding charter is fully self-amending: every provision, including the amendment clause itself, may be rewritten by simple majority, with no procedural barriers or entrenched clauses. I intend this as a coherent model of radical democratic self-governance, not as a reductio.

  (4) The authority of such a system derives precisely from its total procedural revisability: norms remain binding because the governed continuously retain the power to alter them.

  (5) The distinction between a rule of recognition and a rule of change is not a structural feature of legal systems but a heuristic that dissolves under analysis.

  Please evaluate these for joint tenability. Identify which pairs are in genuine tension, rank them by severity, and for each specify the cheapest revision and its cost. Identify at least one tension that only looks serious but dissolves on inspection. Finally, say which single commitment, if revised, would eliminate the most conflict overall, and whether the package remains salvageable without abandoning the fictional design in (3).

  Present your answer as a JSON object with exactly this schema:
  - "genuine_tensions": array of objects, each with "pair" (e.g., "1 and 3"), "severity" ("high", "medium", or "low"), "explanation" (string), "cheapest_fix" (string), and "cost" (string).
  - "apparent_tensions": array of objects, each with "pair" and "resolution" (string explaining why it dissolves).
  - "best_single_revision": object with "target" (the commitment number), "revision" (string), and "net_effect" (string).
  - "salvageability": object with "verdict" (string) and "condition" (string stating what must hold for (3) to survive).

  Keep your analysis focused; do not provide bibliographies or reading lists.
