answer: |-
  Your operational bundle commits you to a theory of normative conventionalism where virtual items are enforceable entitlements derived from the game's social contract rather than legal property, and harm is defined by violations of consent and fairness rather than the ontological status of data.

  This position rejects both strict fictionalism and strict realism. Fictionalism fails because you allocate significant resources to restore lost items and punish exploiters; if items were merely pretend, rolling back a server or spending support budget on restoration would be irrational waste. Realism fails because your EULA explicitly denies property rights, you forbid converting items back into cash, and you retain the unilateral right to delete data; if items were genuine property, you could not destroy them without compensation, nor could you prohibit their sale or inheritance. Your practices instead reveal that items function as *normative entitlements*: they are real within the context of the community because the community agrees to treat them as valuable, and you enforce that agreement to maintain stability, not because the data itself possesses metaphysical weight.

  The distinction between sanctioned looting, rolled-back exploits, and banned harassment is explicable under a single theory of harm based on consent and system integrity rather than pixel destruction. In the contested PvP zone, players consent to the risk of loss as a condition of entry; the harm is negated by prior agreement to the rules. In the exploitation case, the duplicator violated the system's integrity, breaking the公平 (fairness) contract that underpins the economy, warranting restoration to preserve the normative environment. In the harassment case, the harm bypasses the game rules entirely to impact the human being behind the avatar; because no player consents to real-world psychological abuse, these acts are treated as external harms manifesting in a digital space. This explains why flattening a house is gameplay (consented risk) while virtual groping is banned (non-consensual real-world harm), despite both involving manipulation of the same underlying data.

  The one-way flow of money reinforces the license model over the property model. By accepting cash for skins but forbidding cash-out, you are selling a service access right, not a tradable commodity. This presupposes that the value resides in the *experience of ownership* within the walled garden, not in the *economic equity* of the asset. If you allowed cash-out, you would acknowledge the item as a store of value independent of your server, pushing you toward the realist view you currently reject. The current flow confirms you are selling a regulated experience, not transferring title.

  There is, however, philosophical underdetermination in your distinction between scamming and exploiting. Both result in the involuntary loss of items. Your policy treats scamming as gameplay (caveat emptor) and exploiting as a banable offense (system violation). This is not dictated by metaphysics but by design choice: you have decided that social engineering is a valid skill within your convention, while code manipulation is not. A different studio could equally validly treat scamming as theft requiring restoration under the same normative framework. This line is not discovered in the nature of virtual objects but stipulated by your community guidelines, meaning your roommate is correct that the boundary is arbitrary, but incorrect that this arbitrariness invalidates the whole system; it merely highlights that your authority is legislative, not judicial.

  Under the radical reading that virtual objects are real property, your policies would collapse. You would be unable to roll back servers without destroying restored property, forcing you to compensate players for the downtime rather than resetting state. You would need to allow inheritance of accounts and items upon death, and creditors could seize virtual warehouses to satisfy real-world debts. Police would investigate duping exploits as fraud or theft rather than you handling it via permaban, and Real Money Trading would be a legal right of property owners rather than a bannable offense. The fact that you do not do these things proves you are not operating under a property regime, but your willingness to restore items proves you are not operating under a nihilistic one either.

  Your roommate lands the punch on the EULA being liability cover, but misses the metaphysical nuance. You are not inconsistent; you are operating a benevolent dictatorship grounded in a social contract. The EULA protects you from external legal claims (property law), while your support policies protect you from internal community collapse (normative law). The three things she claims cannot be true are only incompatible if you assume "property" means the same thing in a court of law as it does in a community agreement. Your practices assert that virtual objects are legally fictional but normatively real, and that distinction is sufficient to hold the bundle together without incoherence.
