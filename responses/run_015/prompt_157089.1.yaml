      *Wait, one more check on the "Stages" claim.* In Section 3, Nietzsche discusses the three kinds. He doesn't explicitly order them as stages of cultural maturation. He says "there are three kinds of history... so far as it is in the service of life." He links them to the man of action, the man of preservation, and the man of suffering. While a culture might need different ones at different times, calling them "stages" implies a Hegelian progression Nietzsche would likely reject. I will flag this as an over-confident interpretation.

