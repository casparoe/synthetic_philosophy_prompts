          *   Critical: Need to suffer/deliverance from the past. *Student:* "need of the sufferer... drag some of that before a tribunal." (Good).
          *   *Critique:* The "Three Stages" framing is risky. Nietzsche doesn't explicitly say cultures *mature* from one to the other in that order. He says they are three classes of relation.

      *   **Part (b) Disadvantages:**
          *   Monumental: Distortion, analogy lies, present looks small. *Student:* "analogy lies... differences smoothed away... measured against impossible standard." (Good).
