answer: |-
  Your Type C configuration is a distinct and recognizable epistemic category, though it is often conflated with standard approximation. The nearest established concept is *Asymptotic Idealization*, typically discussed in the context of infinite limits in physics, but this fails to capture the agent-based and economic cases where no mathematical limit is taken. A better fit is the concept of *Minimal Modeling*, where details are omitted to show they are irrelevant. However, neither fully captures your description of the assumption as an "uncommitted placeholder." I propose we coin the term **Indeterminate Idealization** for Type C. An Indeterminate Idealization is an assumption that is strictly false of any individual system but functions as a logical common denominator for a class of incompatible true descriptions. It does not approximate a specific truth; it abstracts a structural invariant.

  Regarding your second question, the split you suspect is real and methodologically critical. You distinguish between cases where concretizations agree on the result (robustness) and cases where they disagree on mechanism but share a macro-pattern (invariance). This distinction determines the epistemic warrant. If the concretizations agree, the ideal model demonstrates *derivational robustness*: the result is stable against perturbations of the assumption. This licenses belief in the prediction's reliability. If the concretizations disagree on mechanism yet yield the same pattern, the ideal model demonstrates *universality*: the result is independent of the micro-details. This licenses belief in a structural constraint rather than a causal mechanism. In the first case, you believe the trait will spread; in the second, you believe the spreading condition is a law-like constraint on any system of that class. Conflating these leads to error: seeking a specific mechanism when only a structural constraint exists, or vice versa.

  On the truth-status of Type C assumptions, the defensible position is that they are **class-defining rather than truth-apt**. To say a population is "infinite" or an agent "representative" is not to make a claim that can be falsified by counting individuals or measuring heterogeneity. Rather, it is to stipulate a membership condition for a universality class. The assumption says: "Any system that behaves *as if* it meets this condition will exhibit this pattern." This avoids the metaphysical baggage of claiming the assumption is "true of a capacity" while acknowledging it is not merely a convenient falsehood. It treats the model not as a picture of the world, but as a map key. If you treat it as a capacity, you risk reifying the idealization (searching for the "infinite" part of the population). If you treat it as a simple falsehood, you invite the demand to correct it. Treating it as a class definition tells you exactly what to do: check if the real system falls within the basin of attraction of that class.

  Your three-way cut (A/B/C) is robust and worth maintaining. Type A is standard approximation (error decreases as assumption approaches truth). Type B is essential fiction (the model breaks if the assumption is corrected). Type C is structural abstraction (the model compresses multiple truths). Collapsing B and C would obscure the difference between a model that fails without its fiction and one that succeeds *because* of its indeterminacy. However, the boundary between B and C is porous. Consider the **Representative Agent** in macroeconomics. If the assumption is used to claim that all individuals *are* identical, it is Type B: introducing heterogeneity destroys the derivation because the mechanism relies on identity. If the assumption is used to claim that the aggregate behaves *as if* it were single, it is Type C: heterogeneity exists but cancels out at the macro level. The line falls on whether the micro-details are *causally relevant* to the macro outcome. If heterogeneity changes the comparative static, it is Type B. If heterogeneity changes the path but not the equilibrium, it is Type C. This distinction turns on empirical testing of the basin of attraction, not armchair methodology.

  Finally, this classification dictates a specific methodological instruction. The standard demand to "de-idealize" (make assumptions more realistic) is incoherent for Type C. You cannot make an indeterminate assumption true; you can only make it specific, which reduces coverage. Instead of de-idealization, the correct procedure is **variation**. Do not replace "infinite population" with "finite population of size N." Instead, replace it with "finite population of size N," then "structured population," then "overlapping generations." If the result holds across these variations, you have confirmed the assumption was an Indeterminate Idealization tracking a universal constraint. If the result shifts, you have discovered the assumption was load-bearing (Type B) or an approximation (Type A). The goal is not to make the model true, but to map the boundaries of the universality class it defines. Success is not measured by the realism of the assumptions, but by the stability of the result under their variation.
