      *Correction:* The Secret Doubter instruction says "doubt one of the claims the group has written up." If the boards are exchanged, the doubter is now looking at the *other* group's board.
      *Better:* Keep the students in place, swap the boards. The Secret Doubter is instructed to doubt a claim on *their own group's* board. But they are now using the *other* group's board.
      *Actually, let's simplify:* The Secret Doubter is instructed to doubt a claim that *becomes* load-bearing during Phase 1. In Phase 2, when that claim is invoked (either by their group or the other), they express doubt.
