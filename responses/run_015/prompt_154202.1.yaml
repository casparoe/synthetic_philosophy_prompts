answer: |-
  Here is a design for the ninety-minute session. It is built to be run with zero technology beyond the whiteboard and index cards.

  ### The Activity: "The Chain and the Wall"

  **Grouping:** Split the fourteen students into two circles of seven.
  **Topic:** *"The city we are in existed before any of us were born."*
  (This is empirical, relies on evidence like maps/testimony/physics, but inevitably hits the reliability of memory and records.)

  #### Phase 1: The Regress (40 minutes)
  1.  **The Rule:** Group A begins. One student asserts the Topic. Any other student may challenge it by asking, "What makes that true?"
  2.  **The Chain:** The defender must offer a reason. That reason is now open to challenge. No reason may be repeated. No reason may presuppose the original claim.
  3.  **The Wall (Load-Bearing):** If a student cannot offer a reason without circularity or absurdity, they may propose the current claim as a "Wall."
      *   **The Grammar Constraint:** To establish a Wall, the student must stand and complete this sentence stem: *"I am not allowing myself to doubt ______."* They may **not** say "I know" or "I believe."
      *   **The Vote:** The group must vote unanimously to accept it as a Wall. If accepted, it is written on the whiteboard.
      *   **The Cost:** Once a claim is on the Wall, **it cannot be used as a reason for anything else in this session.** It is removed from the toolbox. It is a stopping point, not a building block.
  4.  **The Secret Doubter:** Once the first Wall is erected, hand an index card to one student (privately). It reads: *"You genuinely doubt the claim on the Wall. If anyone treats it as settled fact later, you must say: 'But how can we be sure?'"*
  5.  **Termination:** The phase ends when the group has erected three Walls or when time expires. Group B repeats the process with a fresh board.

  #### Phase 2: The Swap (30 minutes)
  1.  **Exchange:** Group A takes Group B's whiteboard (and its Walls). Group B takes Group A's.
  2.  **The Task:** Each group must construct a *new* argument for a *new* claim (e.g., *"This university will exist ten years from now"*), but they **must** use at least one Wall from the board they are holding as a premise.
  3.  **The Grammar Squeeze:** To use a Wall from the other group, the speaker must introduce it by saying: *"I know that [Wall Claim]..."*
      *   If they stumble, hesitate, or laugh, they must note it.
      *   If the Secret Doubter speaks up, the group must respond without appealing to evidence (since evidence is forbidden for Walls).
  4.  **Observation:** You (the instructor) stand between the groups. Do not intervene unless the rules are broken. Note who hesitates. Note who gets angry at the Doubter.

  #### Phase 3: The Artifact (10 minutes)
  1.  **The Sentence:** Hand every student an index card. They must write one sentence completing this prompt: *"If I doubt this claim, then ______."*
      *   "This claim" refers to one of the Walls on the board.
  2.  **The Sort:** Collect the cards. On the whiteboard, draw two columns. Do not label them "True/False." Label them:
      *   Column 1: *"...I go and check."*
      *   Column 2: *"...I stop making sense."*
  3.  **The Pile:** Read the cards aloud and place them in the columns based *only* on the student's reported consequence. Do not comment on whether the sorting is correct. Leave the piles visible.

  #### The Debrief (10 minutes)
  *Now* you may use the forbidden words.

  ---

  ### Solution to Problem 1: The Grammar
  **The Mechanism:** The asymmetry between Phase 1 and Phase 2 speech acts.
  In Phase 1, to create a Wall, they must use the negative volitional form: *"I am not allowing myself to doubt."* This frames the certainty as a *rule of conduct*, not a description of a mental state. It bypasses "I know" (which implies fallibility) and "I believe" (which implies opinion).

  In Phase 2, to *use* a Wall, they are forced to switch to the epistemic form: *"I know that..."*
  **The Squeeze:** They will feel the friction immediately. "I know" invites the question "How?" But the Wall rules forbid answering "How." The Secret Doubter exploits this friction. When the Doubter asks "But how can we be sure?", the group cannot answer with evidence (because it's a Wall) and cannot answer with authority (because it's a seminar). They will likely respond with irritation or dismissal ("We just *are* sure").
  **The Lesson:** They feel that the grammar of knowledge ("I know") does not fit the grammar of certainty ("I do not doubt"). The former is a claim within the language game; the latter is the frame that allows the game to be played.

  ### Solution to Problem 2: The Incentives
  **The Mechanism:** No tokens. The cost is *argumentative disarmament*.
  In your previous attempt, declaring a claim load-bearing was a "cheap exit" because it saved tokens. Here, declaring a claim a Wall **removes it from play.**
  **Why this works:** Students want to win the argument (or at least sustain it). To do that, they need premises. Every time they declare a Wall, they lose a potential premise. They are incentivized to dig deeper and find *more* reasons rather than fewer. They will only declare a Wall when they are genuinely stuck, not strategically.
  **The "Cost":** The cost is the termination of that line of inquiry. It makes the Wall feel like a *limit* they have bumped into, not a *foundation* they have laid. This mirrors the hinge concept: we don't choose hinges because they are convenient; we hit them because we cannot go further.

  ### Solution to Problem 3: The Ending
  **The Mechanism:** Sorting by *consequence of doubt*, not *truth value*.
  A tidy taxonomy (e.g., "Empirical vs. Rational") allows them to file the experience away as "types of propositions." Sorting by *"If I doubt this, then..."* forces them to categorize the *role* the proposition plays in their life.
  **The Piles:**
  *   Pile 1 (*"...I go and check"*): These are ordinary empirical claims. Doubt triggers investigation.
  *   Pile 2 (*"...I stop making sense"*): These are the hinges. Doubt triggers paralysis, not investigation.
  **The Lesson:** This prevents them from viewing hinges as "very strong beliefs." A strong belief is just something you check very carefully. A hinge is something where checking loses its meaning. The piles visually demonstrate that the difference is not in the *content* (both piles might contain "The earth exists"), but in the *logical consequence of doubting*.

  ---

  ### Debrief Guide: Mapping Moments to Concepts

  Do not lecture. Ask questions that point back to the activity.

  1.  **The "Not Allowing" Phrase:** Ask the students who wrote the Walls: "When you said 'I am not allowing myself to doubt,' did that feel like you were describing a fact about the world, or a rule about your behavior?"
      *   *Map to:* Hinges are not known truths; they are methodological necessities.
  2.  **The Secret Doubter:** Ask the group: "When [Student] doubted the Wall, did you feel they were making a mistake of *fact*, or a mistake of *procedure*?"
      *   *Map to:* Doubting a hinge isn't false; it's nonsensical within the language game. It's not that the doubt is wrong, it's that it has no cash value.
  3.  **The Swap:** Ask: "When you tried to use the other group's Walls with 'I know,' why did it feel awkward?"
      *   *Map to:* Hinges are local. What is a hinge for Group A might not be for Group B. But more importantly, "knowing" implies a possibility of "not knowing," which undermines the hinge.
  4.  **The Piles:** Point to the "Stop making sense" pile. "If doubt here doesn't lead to checking, what does it lead to?"
      *   *Map to:* Madness, or the end of the language game.

  ### Predictable Failure Modes & Handling

  **1. The Foundationalist Reconstruction**
  *   **Behavior:** A student says, "So these Walls are the foundations of our knowledge. We build everything else on top of them."
  *   **Response:** "Foundations support the building from underneath. If I remove a foundation, the building falls. If I remove a Wall from our board, did the argument fall, or did it just stop?"
  *   **Correction:** Push them toward the *hinge* metaphor. A hinge allows the door to move. The Wall didn't support the argument; it allowed the argument to turn. Without it, the door is stuck shut. You aren't building *on* them; you are moving *around* them.

  **2. The Silent Withdrawal**
  *   **Behavior:** A student realizes their doubt is "unsayable" and stops participating in Phase 2.
  *   **Response:** Do not call on them publicly. In the debrief, say: "Some of you may have felt that once the Walls were up, there was nothing left to say. That silence is data. The feeling that 'I have no move left' is exactly the sensation of hitting a hinge."
  *   **Correction:** Validate the silence as an epistemic position, not a failure to engage.

  **3. The Competitor**
  *   **Behavior:** A student tries to force a Wall early to "win" or control the topic, or tries to trap the Secret Doubter.
  *   **Response:** Remind them of the Cost rule. "Remember, every Wall you erect removes a tool from your box. If you erect too many, you cannot argue at all. Are you trying to stop the game?"
  *   **Correction:** Re-orient them to the goal: sustaining the chain of reasons, not terminating it.

  ### Frank Limitations: What This Exercise Cannot Do

  You must supply this yourself in the final five minutes.

  **1. The Volition Problem**
  *   **The Issue:** In the activity, students *vote* to make a claim a Wall. They *choose* to say "I am not allowing myself to doubt." This makes hinge-taking look like a deliberate, conscious, propositional act.
  *   **The Reality:** In life, we do not vote on our hinges. We absorb them through acculturation. We do not decide to trust our memory; we simply remember. The activity makes it look like a contract; in reality, it is a habit.
  *   **What to Say:** "Notice that you had to *decide* to stop doubting. In your actual life, you didn't decide that the earth existed before you were born. You just grew up acting as if it did. The vote was a simulation artifact. Hinges are usually invisible until they break."

  **2. The Propositional Problem**
  *   **The Issue:** We wrote the Walls as sentences on a board ("The city existed..."). This suggests hinges are *statements*.
  *   **The Reality:** Hinges are often manifested in *action*, not assertion. The hinge isn't the sentence "I have two hands"; it is the act of reaching out to grab a cup without counting your fingers first.
  *   **What to Say:** "We wrote sentences on the board. But really, these aren't things we say; they are things we *do*. You don't walk into a room checking if the floor is solid. You walk. The certainty is in your feet, not your voice."

  **3. The Stability Problem**
  *   **The Issue:** The Walls stayed fixed for 90 minutes.
  *   **The Reality:** Riverbeds shift. What is a hinge for one generation (e.g., "The sun orbits the earth") is a empirical claim for another.
  *   **What to Say:** "We treated these Walls as permanent for the session. But historically, these things change. What is a rule for thinking today might be an object of inquiry tomorrow. The riverbed moves, just very slowly."

  ### Summary of Instructor Prep
  *   **Whiteboard:** Split into two halves (Group A / Group B).
  *   **Cards:** 3 Secret Doubter cards (prepare these in advance with specific claims written on them, e.g., "Doubt the reliability of written records").
  *   **Index Cards:** 14 for the final sentence sort.
  *   **Timer:** Keep strict time. The pressure is necessary to force the stall.

  This design forces the *experience* of the limit before providing the *vocabulary* for it. It makes the "hinge" a felt constraint rather than a defined term.
