answer: |-
  You have put your finger on the exact nerve that makes this comparison so itchy. Your guess about the asymmetry is not just correct; it is the key to unlocking why the Turing inversion feels so much more violent than the Darwin one.

  Let's walk through the structure of the two inversions, then tackle the self-application problem, and finally look at how the definition of comprehension changes the stakes.

  ### The Structural Asymmetry: History vs. Ontology

  Your intuition is spot on: Darwin targets a claim about *genealogy*, while Turing targets a claim about *ontology*.

  In the Darwinian inversion, nobody denies the wing flies. The aerodynamic fit is a physical fact. The "design" we perceive is just a shorthand for "this thing fits its environment perfectly." The inversion says: "You think this fit requires a past mind to intend it. We show you a mindless process that accumulates fit over time." The property being explained (flight) is public, measurable, and uncontroversial. The thing being removed (the Designer's intent) is a historical hypothesis about how that property got there.

  In the Turing inversion, the "output" is the public, measurable fact (the essay, the code, the move in the game). But the property being disputed—comprehension—is not merely the output. If comprehension were just "producing the right output," there would be no debate. The skeptic claims comprehension is an *interior state* that accompanies the output.

  So, here is where your structural diagnosis lands: Darwin dissolves the *necessity of a mental cause* for a physical effect. Turing dissolves the *necessity of a mental state* for a behavioral competence.

  This creates the asymmetry you feel. With Darwin, you can point to the wing and say, "The function is real." With Turing, when you point to the chatbot and say, "The understanding is real," the skeptic says, "No, the text is real. The understanding is what we are arguing about."

  Darwin changes the story of how the function arrived. Turing changes the story of what the function *is*. If you define comprehension strictly as "the ability to process information correctly," Turing wins easily, and the analogy to Darwin is perfect. But if you define comprehension as "the inner experience of meaning," Turing is doing something Darwin never did: he is arguing that the inner experience is an illusion generated by the processing. Darwin never argued that the bird's ability to fly was an illusion; he argued the *planner* was. Turing is often read as arguing the *grasper* is.

  ### Self-Application: Exportable vs. Self-Consuming

  This is where the distinction you labeled "exportable versus self-consuming" does real work. It is not just a label; it marks a shift in the epistemic ground.

  Darwin's inversion is exportable. The biologist studying the finch is not explained away by the theory of natural selection. The biologist stands outside the system, using their mind to explain the mindless process of the finch. The authority of the observer is preserved.

  Turing's inversion is potentially self-consuming. If the explanation for the machine's competence is "mindless mechanical sorting," and I am a biological machine, then my competence in judging the machine is also "mindless mechanical sorting."

  Does this undercut your authority? It depends on what you think authority is.

  If you think authority requires a "ghost in the machine"—a little homunculus inside you that isn't subject to physics—then yes, the inversion destroys your authority. You are just a thermometer registering "no understanding." A thermometer isn't "right" or "wrong" in a deep sense; it just expands or contracts.

  But if you accept the Darwinian premise applied to yourself, your authority is not undercut; it is *naturalized*. Your brain is a machine that was selected for tracking truth. When you say "that system doesn't get it," you are not speaking from a magical realm; you are reporting the output of a truth-tracking mechanism. The fact that the mechanism is mechanical doesn't make the report false. It just means the report is caused, not conjured.

  However, the *feeling* of undercutting remains because the Turing inversion removes the *privilege* of the judge. In the Darwinian case, the human mind is the one exception to the mindless rule. In the Turingian case, the human mind is just another instance of the rule. That is why it feels self-consuming: it demotes the observer from the arbiter of reality to just another part of the machinery being described.

  ### The Nature of Comprehension: Dispositional vs. Phenomenal

  This is the final piece. The strength of the Darwin/Turing analogy depends entirely on which version of "comprehension" you are fighting over.

  **1. The Dispositional Reading**
  If comprehension is a set of dispositions—the ability to answer follow-ups, to correct errors, to apply a concept in a new context—then the analogy to Darwin is nearly perfect.
  *   **Darwin:** Flight is a disposition (staying aloft). It doesn't matter if a spirit lifts the bird; if the bird stays aloft, it flies.
  *   **Turing:** Comprehension is a disposition (navigating semantic space). It doesn't matter if a soul lights the mind; if the system navigates the space, it comprehends.

  Under this reading, the skeptic is making a category mistake. They are looking for a "substance" called understanding when they should be looking for a "capacity." The inversion works beautifully here. Competence *is* comprehension, built up mechanically. The "strange inversion" is simply realizing that you don't need a magical ingredient to make the disposition happen.

  **2. The Phenomenal Reading**
  If comprehension is a "what-it-is-like" property—the inner glow of meaning, the feeling of grasping a thought—then the analogy breaks down.
  *   **Darwin:** Natural selection explains the structure of the eye, but it does not claim to explain the *experience* of seeing red. That is a separate problem.
  *   **Turing:** If comprehension is the experience of meaning, then showing how the system produces answers mechanically leaves the hard problem untouched.

  Under this reading, the Turing inversion is answering a different question than the skeptic is asking. The skeptic says, "It doesn't feel like anything to be that system." The Turing defender says, "It produces the right outputs." They are talking past each other. Darwin never tried to explain the feeling of life, only the structure of living things. If Turing is only explaining the structure of thought, the analogy holds. If Turing claims to explain the *feeling* of thought via mechanical sorting, he is making a bolder claim than Darwin did.

  ### Putting It Together

  Your asymmetry diagnosis is correct. Darwin removes a historical ghost (the Designer). Turing removes a concurrent ghost (the Understander).

  The reason the Turing inversion feels more unstable is that it invites the self-consuming move. If you accept the Turing inversion, you must accept that your own feeling of "really getting it" is also a mechanical competence without a magical core. That is a harder pill to swallow than admitting birds don't know aerodynamics.

  The analogy is strongest under the **dispositional reading** of comprehension. If you treat understanding as a functional role—something a system *does* rather than something a system *has*—then Darwin and Turing are saying the exact same thing: complex, adaptive, seemingly purposeful behavior can emerge from simple, mindless, iterative processes.

  The analogy weakens under the **phenomenal reading**. If understanding is an inner light, Turing hasn't explained it any more than Darwin explained the sensation of pain. He has only explained the behavior associated with it.

  So, the friction you and your friend feel isn't just about who finds the arguments irresistible. It is likely that one of you is arguing from the dispositional view (where the analogy is tight and the inversion is complete) and the other is arguing from the phenomenal view (where the analogy leaks and the inversion feels like a dodge). If you can agree on which "comprehension" is on the table, the structural difference you identified will tell you exactly where the argument stands.
