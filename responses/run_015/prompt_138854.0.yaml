answer: |-
  Hi there

  This sounds like a fun challenge, and your instinct about the audience is spot on. Programmers and data scientists are used to thinking about labels, types, and functions, so you can leverage that intuition without getting bogged down in metaphysics. Here is how I would structure the dependency flow, the examples, and the trapdoors to avoid.

  You should definitely start with the need for the word before you show them the disquotation schema. If you open with the equivalence schema, like saying the sentence snow is white is true if and only if snow is white, it will look like a trivial tautology or a parlor trick. They will wonder why we needed a whole philosophical view to tell them something so obvious. Instead, start with the problem of generalization. You need to show them a situation where they want to endorse a sentence but cannot repeat it, either because they do not know what it is yet or because there are too many of them to list. This establishes the functional utility of the truth predicate. Once they see that the word true acts as a logical device to bridge the gap between mentioning a sentence and using it, you can introduce the disquotation schema as the mechanism that makes this device work. Only after they understand the mechanism should you make the claim that truth is not a substantive property like mass or charge. If you say that upfront, it sounds like a negative claim they need to fight. If you show them that the device does all the work without invoking a property, the conclusion that truth is not a deep property follows naturally from the utility you just demonstrated.

  Your instinct about the old model example is correct, and that is essentially the engine of the view. The case where you say most of what that old model predicted turned out to true is powerful because nobody can recover which predictions those were without the word true. You cannot unpack that statement into a long conjunction of specific predictions because you do not have the list. This shows that the word true is doing work that cannot be deleted by unpacking it. However, for the one example that carries the whole session, I recommend you refine this into a classic blind endorsement case, such as everything the witness said is true. This works better than snow is white because snow is white quietly smuggles in correspondence theory by focusing on a simple fact about the world, which makes the schema look like a definition of a word-world relation. The witness example forces the audience to see that you are endorsing the sentences themselves, not checking them against the world one by one. For your specific audience, you might adapt this to something like every assertion in this commit log is true, but the logical structure must remain a quantification over sentences that they cannot individually inspect. The example has to have a quantifier like everything or most things so that it forces generalization, and it has to avoid any specific content that distracts into verifying the facts themselves. You want them focusing on the logical role of the word true, not the weather or the witness.

  Regarding misconceptions, you should handle them in the order they will naturally arise, which means pre-empting some and parking others. The relativism confusion, where they think truth is just whatever the group agrees on, will form almost immediately because you are stripping away the metaphysical weight of truth. You need to head this off in the first ten minutes by explicitly stating that deflationism is a theory about the word true, not a theory about the world. Make it clear that deflationists can be just as stubborn about facts as anyone else. The second misconception, that deflationists think truth does not matter, will arise when you claim truth is not a substantive property. Catch this in the moment by explaining that the sentences matter immensely, and since truth is just a device for endorsing those sentences, truth matters by proxy. The third confusion, mapping this onto ground truth labels from machine learning, is subtler and will likely come up during the property discussion. You should address this when you explain what truth is not. Clarify that a ground truth label is a data artifact, whereas the deflationary truth predicate is a logical device for endorsement. They are related but not identical, and conflating them leads to thinking truth is just a column in a dataset. Finally, someone will try to be clever about fake news or the liar sentence. You should deliberately leave the liar sentence to the last ten minutes or refuse it entirely, as it is a technical rabbit hole about consistency rather than the nature of truth. Fake news is usually just the relativism confusion in disguise, so handle it there.

  There are two things you should openly refuse to get into and say out loud that you are refusing. The first is the liar paradox. It is a fascinating logical problem, but it requires distinctions about self-reference and hierarchy that will eat your entire slot and obscure the main point about utility. The second is the actual metaphysics of correspondence. If someone asks what makes a sentence true if not correspondence, tell them that deflationism is not trying to answer what makes sentences true but rather what the word true does. That is a boundary you need to draw early to keep the talk manageable.

  For the final five minutes, the check you can run to distinguish someone who gets it from someone who is just repeating slogans is to ask them why we cannot just delete the word true in the generalization case. If they understand, they will explain that we cannot list all the sentences we want to endorse, so we need the predicate to quantify over them. If they do not understand, they will say something vague about truth being subjective or useful. This tests whether they grasp the logical necessity of the device.

  Lastly, you need one place in the arc where you honestly tell them the deflationist still owes us something. The best pressure point is the normativity of inquiry. If truth is just a thin logical device, why should we aim at true beliefs rather than false ones? Deflationism explains the meaning of the word, but it does not obviously explain why truth is a goal worth pursuing. Flagging this shows them that the view is live and contested rather than a settled trick, and it respects their intelligence by showing where the philosophical work remains.

  Hope that helps you build the session.

  Best
