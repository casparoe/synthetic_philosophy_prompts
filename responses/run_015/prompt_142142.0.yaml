  - "inference_target": object with keys "actual_reward_function", "reflectively_endorsed_reward", "policy_or_disposition_only", "no_determinate_target", each a number in [0,1] summing to 1
  - "most_sensitive_term": object with "id" (string matching a decomposition id), "swing_if_resolved_favorably" (number), "swing_if_resolved_unfavorably" (number), "explanation" (string)
