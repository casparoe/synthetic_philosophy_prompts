  # SEMANTIC SORTING HANDOUT
  **Phil of Lang Seminar | Week 4**

  **Instructions:**
  Answer the following questions based on your gut reactions to the cases. Do not worry about which theory you have read; just follow the branches to find your position. Use this tree to seperate your intuitions from your bibliography.

  ---

  ### THE DECISION TREE

  **Q1. The Twin-Earth Split**
  Imagine you say "water" while touching H2O. Your exact mental duplicate on Twin-Earth says "water" while touching XYZ (a different liquid). Are you talking about the same thing?
  *   **YES** (Same meaning) → Go to **Q2**
  *   **NO** (Different meaning) → Go to **Q3**

  **Q2. The Internalist Split**
  If you are talking about the same thing, is that meaning fixed entirely by your brain state, even if the world turned out differently than you expect?
  *   **YES** (Brain fixes all) → **Leaf A**
  *   **NO** (World context matters) → **Leaf B**

  **Q3. The Synthetic-Deference Split**
  Since meaning depends on the outside, imagine you live in a VR community. There is no physical gold. An AI chemist defines "gold" by code. You defer to the AI. Does your word "gold" refer to a real kind?
  *   **YES** (AI fixes reference) → **Leaf C**
  *   **NO** (No physical stuff, no reference) → Go to **Q4**

  **Q4. The Externalist Hardline**
  If the AI says "gold" but there is no physical stuff, is the word empty because you lack causal contact, or because you lack *both* contact and expert approval?
  *   **CONTACT ALONE** (Stuff fixes it) → **Leaf D**
  *   **BOTH REQUIRED** (Stuff + Approval) → **Leaf E**

  ---

  ### YOUR POSITION (LEAVES)

  **Leaf A: Narrow-Content Internalism**
  *   **Awkward Commitment:** You mean the same thing as your duplicate even if one of you is drinking poison and the other water.

  **Leaf B: Two-Dimensionalism**
  *   **Awkward Commitment:** Your words change meaning depending on which world you are in, even if you can't tell the difference.

  **Leaf C: Social-Deference Externalism**
  *   **Awkward Commitment:** You can refer to natural kinds solely because a computer program told you to, even if no such kinds exist physically.

  **Leaf D: Causal-Contact Externalism**
  *   **Awkward Commitment:** You cannot talk about gold unless you have physically touched metal, regardless of what experts say.

  **Leaf E: Hybrid Deference (Unnamed Combo)**
  *   **Awkward Commitment:** Reference fails if either the physics is wrong or the expert is wrong, making semantic error nearly impossible.

  ---

  ### SCORING LOGIC & NOTES

  **1. The Collapse Flag**
  Be careful with **Leaf C** and **Leaf D**. Once the expert system is artificial (like the AI chemist), the distinction between "social deference" and "causal contact" may collapse. If the AI is part of the causal structure of your VR world, deferring to it *is* causal contact. This tree struggles to seperate them cleanly in synthetic environments.

  **2. The Unoccupied Zone**
  There is one logically possible answer-pattern that ends up unoccupied in this tree: **Q1: YES** (Internalist) combined with **Q3: YES** (AI Reference).
  *   **Diagnosis:** This spot is empty because it is **ugly/unexplored**. It claims meaning is in the head (Q1) but also requires deference to an external AI for reference (Q3). Most philosophers find it inconsistent to hold both that meaning is internal *and* that reference relies on external synthetic authority without adopting externalism fully.

  **3. Typo Check**
  If you found the word "seperate" in the instructions, you are paying attention. It is spelled incorrectly on purpose.
