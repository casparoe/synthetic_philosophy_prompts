  *   **Rule 2: Fission is fatal only when it leaves two rival continuers.**
      *   **Prediction:** *Would have been you.*
      *   **Reasoning:** This is the "Sole Survivor" or "Non-Branching" view. Identity is lost only if there is competition (two adults). If one lineage dies, the remaining one is the unique closest continuer and inherits the original's identity.
  *   **Rule 3: Once fission has occurred the identity question becomes indeterminate.**
      *   **Prediction:** *No fact of the matter.*
      *   **Reasoning:** This view holds that fission creates metaphysical vagueness. Even if one twin vanishes, the fact that branching occurred renders the identity relation indeterminate.

  ### 2. Which Rule Best Fits the Record?

  **Rule 1 (Fission is unsurvivable)** is the strongest fit for her entire record, particularly when weighing the Twin verdict against the PGD verdict.

  *   **The Twin Verdict:** Her phrasing is the smoking gun. She did not say, "It depends on whether both survive." She said, "fission is simply not something the embryo survives." This is a modal claim about the *process*, not the *outcome*. It treats fission as a death event for the original zygote, regardless of how many lineages persist afterward.
