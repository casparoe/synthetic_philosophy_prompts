      *   **Lens:** The debate over objectivity in history (Historiography).
      *   **Key Theorists:** E.H. Carr (*What is History?*), Hayden White (*Metahistory*), and implicitly Leopold von Ranke ("how it actually was").
      *   **Specific Questions to Address:**
          1.  Does Briony's error track Carr's point (selection of facts) or show something Carr would reject?
          2.  Does the fabricated ending illustrate White's claim (emplotment is a free choice) or resist it (guilt/atonement vs. neutral structure)?
          3.  Where does the novel smuggle back in the Rankean assumption of objective truth ("how it actually was")?
      *   **Goal:** Prepare a book-club discussion.

  2.  **Deconstruct the Theoretical Framework:**
      *   **E.H. Carr:** Facts aren't just "out there"; historians select them. "The facts speak only when the historian calls on them." It's a dialogue between present and past.
      *   **Hayden White:** History is a narrative construct. The "emplotment" (tragic, comic, romantic, satiric) is imposed by the historian, not inherent in the events. History is literary.
      *   **Leopold von Ranke:** The old guard. History should show "wie es eigentlich gewesen" (how it actually was). Objective truth is possible and desirable.

  3.  **Analyze *Atonement* through this Lens:**
      *   **Briony's Crime:** She sees a scene (the fountain, the library) and interprets it through a childish, literary lens (romance/thriller). She selects specific "facts" (Robbie's posture, the vase, the letter) and constructs a narrative of perversion/aggression.
      *   **Carr Connection:** Briony *does* select facts. But Carr assumes a responsible historian trying to understand the past. Briony is an *irresponsible* witness. Her selection is driven by bias, not historical rigor. So, it tracks Carr's mechanism (selection) but violates his ethics (interpretation based on evidence/reason).
      *   **White Connection:** The ending reveals the book we just read is Briony's novel. She gives Robbie and Cecilia a happy ending (romance/comedy) in the text, though they died in reality (tragedy). This fits White's idea that emplotment is a choice. *However*, White treats this as an epistemological condition of all history. For Briony, it's an *ethical* failure. She knows she's lying. White might say all historians lie (structurally); Briony says *I* lied (morally).
      *   **Rankean Smuggling:** The "London, 1999" section. Briony admits the truth. She says, "I gave them happiness." But by admitting it was a fabrication, she affirms there *was* a reality that was different. The novel posits an objective truth (they died apart) against the narrative truth (they reunited). This validates the Rankean ideal even while demonstrating its impossibility in narrative.

  4.  **Drafting the Discussion Guide (Iterative Process):**

      *   *Introduction:* Set the stage. Acknowledge the sophistication of the prompt. Define the theorists briefly for the group.
      *   *Section 1: Briony as Historian (Carr).* Focus on Part One. The fountain scene. The library scene. How she constructs "truth."
          *   *Nuance:* Carr says selection is inevitable. Briony shows selection is dangerous. Is the problem the selection or the *motive*?
      *   *Section 2: The Ending and Emplotment (White).* Focus on Part Three and the "London 1999" coda. The shift from Tragedy to Romance.
          *   *Nuance:* White says emplotment is unavoidable. Briony says *this specific* emplotment is a lie. Is the novel agreeing with White (all history is fiction) or punishing Briony for it?
      *   *Section 3: The Ghost of Ranke.* Where is the "real" truth? The diary, the medical records, the admission.
          *   *Nuance:* The novel needs an objective truth to make the guilt meaningful. If there is no "what actually happened," there is no crime.
      *   *Discussion Questions:* Create open-ended questions that bridge the text and theory.
      *   *Activity:* Something interactive. Maybe rewriting a scene?

  5.  **Refining the Arguments (Self-Correction during drafting):**
      *   *Correction on Carr:* Be careful not to say Carr believes in pure objectivity. He believes in a *process* of verification. Briony skips the verification. So her error is a *caricature* of Carr's historian, not a perfect example.
      *   *Correction on White:* White argues that *all* historical narratives are emplotted. Briony's fabrication is extreme, but is it different in *kind* or just *degree* from a standard historian turning chaos into a story? The novel suggests it *is* different because of the moral stakes.
      *   *Ranke:* The novel is meta-fiction. It asserts the "real" events (Robbie's death at Dunkirk, Cecilia's death in the Balham tube station) are the anchor. This is the Rankean ghost.

