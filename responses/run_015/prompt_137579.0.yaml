prompt: |-
  I was handed leadership of a small replication unit attached to a psychology department six months ago, shortly after a journalist quoted one of our "failed to replicate" verdicts about a finding its original authors had built careers on and I found I could not defend the wording. We run about four pre-registered multi-site replications a year and issue a short verdict on each that other researchers rely on, and our internal disagreements have convinced me we need a written procedure rather than argument case by case: two of us read a non-significant result with a tight interval as evidence of absence, two read the same numbers as "this design could never have detected the original effect anyway" and want to call it uninformative, and we have no agreed handling of a significant result in the opposite direction, or of a point estimate that is a third of the original's.

  So I want a decision procedure we can run in a fixed order on each completed replication, taking design and results to one of a small set of verdicts, with an explicit account of what to do when we cannot get the numbers we would want — we usually have neither the original raw data nor the original authors' cooperation. Two features of our setup make this harder than the standard treatment of the question. First, we no longer report a single Bayes factor; before seeing the replication data we elicit a predicted-effect distribution from three sources — the original authors, a skeptic we appoint, and a small meta-analysis of comparable studies — and report all three. The procedure has to say what the verdict is when these disagree about whether the data support the effect, and whether such disagreement should itself be published as an outcome rather than settled by the procedure. Second, we treat "did this replication actually test the original claim" as separate from "what do the numbers say," and I am unsure where it belongs in the sequence and what would count as a sufficient yes.

  Be committed: make the actual choices — the verdict labels, the order of operations, whatever thresholds you think belong — and give your reasons, including where you think our three-source policy is a mistake and where you would overrule the way replications are usually reported. Mark the steps that stay judgment calls no formalism removes. Then run the finished procedure on two of our cases: a replication landing at roughly a third of the original effect size, with an interval excluding zero but excluding the original value too, and a non-significant result whose interval comfortably includes both zero and the original effect. I suspect I will dislike at least one of the verdicts; give it anyway.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the User and Context:**
      *   **User:** Leader of a small replication unit in a psychology department.
      *   **Situation:** Took over 6 months ago after a PR crisis (journalist quoted a "failed to replicate" verdict that couldn't be defended).
      *   **Task:** Needs a written, fixed-order decision procedure for issuing verdicts on replications.
      *   **Output Volume:** ~4 pre-registered multi-site replications/year.
      *   **Current Conflict:** Internal disagreement on interpreting non-significant results (evidence of absence vs. uninformative), opposite direction significance, and small effect sizes (1/3 of original).
      *   **Unique Constraints/Features:**
          1.  No single Bayes Factor. Instead, they elicit predicted-effect distributions from three sources *before* seeing data: Original Authors, Appointed Skeptic, Meta-analysis.
          2.  They separate "Did this replication test the original claim?" (Validity/Fidelity) from "What do the numbers say?" (Statistical Conclusion).
          3.  Lack of cooperation/data from original authors (common in replication crises).
      *   **Request:** Commit to specific choices (labels, thresholds, order). Explain reasons. Critique their three-source policy if necessary. Identify remaining judgment calls. Apply the procedure to two specific cases.
      *   **Tone:** Professional, decisive, methodological, slightly authoritative (since they asked me to "Be committed").

  2.  **Deconstruct the Problem:**
      *   *The Core Tension:* Replication isn't just statistics; it's communication. The verdict needs to be robust against criticism (like the journalist incident) but informative for the field.
      *   *The "Three Source" Policy:* This is unusual. Standard replications compare against the original point estimate or a meta-analytic expectation. Eliciting priors from the original author and a skeptic *beforehand* is actually a strength (transparency), but it creates complexity in the verdict. If they disagree, does the replication fail, or does the *consensus* fail?
      *   *The "Fidelity" Question:* This must come *first*. If the replication doesn't test the claim, the statistics don't matter.
      *   *The Statistical Verdict:* Needs to handle:
          *   Significant same direction.
          *   Non-significant (tight vs. wide CI).
          *   Significant opposite direction.
          *   "Small but significant" (1/3 effect size).
      *   *The Crisis:* The previous "Failed to Replicate" label was too blunt. We need nuance without weasel words.

  3.  **Drafting the Procedure (Iterative Process):**

      *   *Step 1: Fidelity (The Gatekeeper).*
          *   Must be binary or near-binary. Did we test the claim?
          *   Criteria: Protocol alignment, power (based on *original* effect or smallest effect size of interest?), measurement equivalence.
          *   Decision: If "No," stop. Verdict: "Inconclusive (Design Mismatch)."
          *   *Refinement:* Since they don't have original author cooperation, they can't ask "Is this okay?" They have to judge based on materials. Let's call this "Protocol Fidelity."

      *   *Step 2: Statistical Evaluation (The Core).*
          *   Need to move away from simple $p < .05$.
          *   Need to incorporate the Three-Source Priors.
          *   *Idea:* Use the Confidence Interval (CI) against the Predictive Intervals (PI) of the three sources.
          *   *Problem:* If the three sources disagree wildly, what then?
          *   *Solution:* The verdict should reflect *which* expectations were met.
          *   *Thresholds:*
              *   "Successful Replication": CI excludes 0, includes Original Estimate (or Meta-analytic estimate).
              *   "Partial/Weaker Replication": CI excludes 0, excludes Original Estimate (the 1/3 case).
              *   "Failure to Replicate": CI includes 0, excludes Original Estimate (tight null).
              *   "Uninformative": CI includes 0 and Original Estimate (wide null).
              *   "Contradiction": Significant opposite direction.

      *   *Step 3: Integrating the Three Sources.*
          *   User asked if this policy is a mistake.
          *   *Critique:* It's good for transparency, but bad for a *single verdict*. If the Skeptic says $\delta=0$ and Author says $\delta=0.8$, and you get $\delta=0.4$, who was right? Both and neither.
          *   *Decision:* Don't let the priors dictate the *verdict label*. Let the data dictate the label. Use the priors to contextualize the *interpretation*. However, the prompt asks for a decision procedure.
          *   *Revision:* The procedure should check if the result is consistent with the *minimum* plausible effect size derived from the sources. Let's use the "Smallest Effect Size of Interest" (SESOI) approach, anchored by the Meta-analysis and Skeptic, not just the Original Author (who is biased).
          *   *Actually, better approach:* Keep the Three Sources as a "Consensus Check." If all three predict an effect and none is found -> Strong Failure. If they disagree -> Nuanced Verdict.
          *   *Wait, simpler is better for a fixed procedure.* Let's stick to the CI vs. Effect Size comparisons primarily, but use the priors to determine "Power/Informative" status in Step 1.
          *   *Correction:* The prompt says they elicit distributions *before*. This is essentially a "Registered Report" style prior elicitation.
          *   *My Recommendation:* This is actually a strength, but it complicates the *verdict*. I will advise that the verdict relies on the *data vs. original claim*, while the *prior elicitation* is published as context, not as the decision rule. Why? Because if the Original Author predicts 0.8 and Skeptic predicts 0, and you get 0.4, declaring "Success" or "Failure" based on priors is political. Declaring based on the *Original Claim* is the definition of replication.
          *   *Decision:* I will overrule the idea that the priors determine the verdict. They determine the *discussion*. The verdict compares Replication Data to Original Claim.

      *   *Step 4: Verdict Labels.*
          *   Need to avoid "Failed" (too aggressive) and "Replicated" (too binary).
          *   Proposed Labels:
              1.  **Replication Successful** (Consistent with original magnitude).
              2.  **Replication Successful (Attenuated)** (Significant, but smaller).
              3.  **Replication Unsuccessful (Null)** (Tight interval around zero).
              4.  **Replication Uninformative** (Wide interval).
              5.  **Replication Contradictory** (Opposite sign).

      *   *Step 5: Handling the "1/3 Effect" Case.*
          *   This is the "Smaller than Expected" case.
          *   Verdict: "Replication Successful (Attenuated)" or "Partial Replication." Let's go with **"Signal Detected (Effect Smaller than Original)"**. It's descriptive.

      *   *Step 6: Handling the "Non-significant, Wide CI" Case.*
          *   Verdict: **"Inconclusive (Insufficient Precision)"**.

  4.  **Refining the Procedure (Addressing Specific Constraints):**

      *   *Constraint:* "Two of us read a non-significant result with a tight interval as evidence of absence, two read the same numbers as 'this design could never have detected the original effect anyway'."
      *   *Fix:* Define "Tight" objectively. If the 95% CI excludes the *original* effect size, it is evidence of absence (regardless of whether it includes 0). If the CI includes the original effect size, it is uninformative regarding the original claim.
      *   *Constraint:* "Three-source policy."
      *   *Critique:* It's excellent for science, terrible for administration. I will advise keeping it for the paper, but removing it from the *decision tree* for the verdict label. The verdict must be about the *Original Claim*, not the *Skeptic's Hope*.
      *   *Constraint:* "Fidelity."
      *   *Placement:* Step 0. If fidelity fails, stop.

  5.  **Developing the Critique/Reasoning:**
      *   Why this order? Fidelity first prevents "Type III errors" (testing the wrong thing).
      *   Why CI over Bayes? CIs are more intuitive for the "evidence of absence" debate. If the CI excludes the original effect, the original effect is unlikely.
      *   Why overrule the Three-Source verdict? Because replication is about the *original claim*, not a consensus of expectations. If the original author was overconfident, the replication should show that, not hide it behind a skeptic's prior.
      *   Judgment Calls: Fidelity assessment (always subjective), choosing the SESOI (Smallest Effect Size of Interest).

  6.  **Running the Cases:**
      *   *Case 1:* 1/3 effect, CI excludes 0, excludes Original.
          *   Fidelity: Pass (assumed).
          *   Stats: Sig > 0. CI excludes Original.
          *   Verdict: **Signal Detected (Effect Smaller than Original)**.
      *   *Case 2:* Non-sig, CI includes 0 and Original.
          *   Fidelity: Pass (assumed).
          *   Stats: NS. CI includes Original.
          *   Verdict: **Inconclusive (Insufficient Precision)**.
          *   *Wait, check the "tight interval" dispute.* The prompt says "non-significant result whose interval comfortably includes both zero and the original effect." This implies a *wide* interval. If it were tight around zero, it would exclude the original effect. So this is definitely "Inconclusive."

  7.  **Final Review against User Prompt:**
      *   "Be committed": Yes, specific labels and thresholds.
      *   "Order of operations": Fidelity -> Statistics -> Verdict.
      *   "Three-source policy critique": Will address directly.
      *   "Judgment calls": Will identify them.
      *   "Run on two cases": Will do this at the end.
      *   "I suspect I will dislike at least one": I need to be brave. The "Inconclusive" verdict on a null result often frustrates people who want a "Failure." I must stand firm: if the CI includes the original effect, you cannot claim failure.

  8.  **Constructing the Output:** (Self-Correction during drafting)
      *   Make sure the "Three Source" critique is nuanced. It's a great *feature*, but a bad *gatekeeper*.
      *   Ensure the "Fidelity" step has concrete criteria, not just "ask the team."
      *   The "1/3 effect" case is the tricky one. Many will call this a failure. I will call it a "Qualified Success" or "Attenuated Signal." Actually, "Replication Successful (Attenuated)" is safer. No, "Signal Detected" is more neutral. Let's use **"Effect Confirmed (Magnitude Discrepant)"**.
      *   Wait, the prompt asks for a "small set of verdicts." Let's standardize.
      *   1. **Replication Confirmed** (CI includes original effect).
      *   2. **Effect Confirmed (Attenuated)** (Sig, CI excludes original).
      *   3. **Evidence of Absence** (CI excludes original effect, includes 0).
      *   4. **Inconclusive** (CI includes original effect and 0).
      *   5. **Contradiction** (Sig opposite).
      *   This covers all bases.

      *   *Re-evaluating the Three-Source Policy:* The user says they report all three. My advice: Keep reporting them, but do *not* use them to determine the verdict. The verdict is Data vs. Original Claim. The Priors are for the Discussion section. This solves the "what if they disagree" problem.

      *   *Re-evaluating the "Fidelity" Step:* The user asks where it belongs. It belongs *before* statistics. If fidelity is low, the stats are irrelevant.

      *   *Final Polish:* Ensure the tone is empathetic but firm. They are in a crisis management role. They need armor.

      *(Self-Correction on Case 2)*: The prompt says "non-significant result whose interval comfortably includes both zero and the original effect." This is the definition of low power/uninformative. My verdict must be "Inconclusive." I anticipate the user might dislike this because it feels like "no result." I must explain why "Failure" is scientifically dishonest here.

      *(Self-Correction on Case 1)*: 1/3 effect, CI excludes original. This is often the most politically charged. Original authors will say "It's still significant!" Skeptics say "It's dead." My verdict "Effect Confirmed (Attenuated)" acknowledges the existence of the phenomenon but validates the skepticism about the magnitude.

      Let's write it.
answer: |-
  This is a governance problem disguised as a statistical one. Your unit is currently operating without a constitution, which means every verdict becomes a political negotiation. To survive the next journalist inquiry, you need a procedure that is defensible, transparent, and rigid enough to prevent internal deadlock, but nuanced enough to reflect the data.

  Below is the **Replication Verdict Protocol (RVP-1)**. I have made specific choices on thresholds and labels. I have also critiqued your three-source policy, as requested.

  ### Part 1: The Decision Procedure

  **Order of Operations:**
  1.  **Protocol Fidelity Check** (Gatekeeper)
  2.  **Statistical Classification** (The Decision Tree)
  3.  **Prior Consensus Annotation** (Contextual Metadata)

  #### Step 1: Protocol Fidelity Check
  *Placement:* Before looking at outcome statistics.
  *Reasoning:* You correctly identified that "did this test the claim?" is separate from "what do the numbers say." If fidelity fails, the statistics are irrelevant. A "failed replication" of a distorted protocol is a false negative that damages your unit's credibility.

  **Criteria for "High Fidelity" (Pass):**
  *   **Materials:** Stimuli and measures match the original within 90% of content (or are validated equivalents).
  *   **Population:** Target demographic matches the original claim's scope (e.g., if the claim is about "humans," WEIRD samples are acceptable; if "clinical patients," undergraduates are not).
  *   **Power:** The sample size provides 90% power to detect the **original reported effect size**, OR 90% power to detect the **Smallest Effect Size of Interest (SESOI)** defined in your pre-registration.
  *   **Analysis:** Analysis plan matches the pre-registered plan and the original analytic strategy (unless the original was demonstrably flawed, in which case the improvement must be justified in the pre-registration).

  **Verdict if Fidelity Fails:**
  *   **Label:** `Verdict Withheld (Protocol Deviation)`
  *   **Action:** Do not issue a replication verdict. Publish as a methodological note explaining the deviation.
  *   **Reasoning:** You cannot judge a claim if you did not test it. This protects you from original authors claiming "you didn't do it right."

  #### Step 2: Statistical Classification
  *Placement:* Only if Step 1 is "High Fidelity."
  *Method:* Confidence Interval (CI) Comparison.
  *Reasoning:* I am overruling the use of Bayes Factors for the *verdict label*. While BFs are useful, your internal conflict stems from interpreting "non-significance." The 95% CI solves this objectively. It allows you to distinguish between "evidence of absence" (CI excludes original effect) and "absence of evidence" (CI includes original effect).

  **The Decision Tree:**
  Let $E_{orig}$ be the original effect size (point estimate).
  Let $CI_{rep}$ be the 95% Confidence Interval of the replication effect size.
  Let $0$ be the null value.

  1.  **Is $CI_{rep}$ entirely on the opposite side of 0 from $E_{orig}$?**
      *   **Yes:** Verdict = **`Contradiction`**
      *   **No:** Proceed to 2.
  2.  **Does $CI_{rep}$ exclude 0 (in the original direction)?**
      *   **Yes:** Proceed to 3.
      *   **No:** Proceed to 4.
  3.  **Does $CI_{rep}$ include $E_{orig}$?**
      *   **Yes:** Verdict = **`Replication Confirmed`**
      *   **No:** Verdict = **`Effect Confirmed (Attenuated)`**
      *   *(Note: This handles your "1/3 effect" case. It acknowledges the effect exists but the original magnitude was likely inflated.)*
  4.  **Does $CI_{rep}$ exclude $E_{orig}$?**
      *   **Yes:** Verdict = **`Evidence of Absence`**
      *   **No:** Verdict = **`Inconclusive`**
      *   *(Note: This resolves your internal fight. If the CI excludes the original effect, it is a "Failure" of the original claim, even if p > .05. If the CI includes the original effect, you cannot claim failure.)*

  #### Step 3: Prior Consensus Annotation
  *Placement:* Published alongside the verdict, but does not change the label.
  *Reasoning:* This addresses your three-source policy.

  **The Policy Critique:**
  Your three-source policy (Original Author, Skeptic, Meta-analysis) is **excellent for discussion, but a mistake for decision-making.**
  *   **Why:** Replication is defined as testing the *original claim*, not the *consensus expectation*. If the Original Author predicts $\delta=0.8$, the Skeptic predicts $\delta=0$, and you find $\delta=0.4$, declaring a verdict based on who was "closer" turns science into a betting pool.
  *   **Correction:** Keep eliciting the priors. Publish them prominently. But do not let them determine the Pass/Fail status. If the Skeptic and Meta-analysis predicted null, and you find `Effect Confirmed (Attenuated)`, the verdict remains positive regarding the existence of the effect, even if the priors were skeptical. This prevents the "Skeptic's Bias" from burying true but small effects.
  *   **Handling Disagreement:** If the three sources disagree wildly (e.g., Author predicts large, Skeptic predicts zero), publish this disagreement as a **`Prior Conflict Flag`**. This is itself a scientific finding: it indicates the field lacks consensus on the phenomenon's plausibility. Do not settle this by procedure; highlight it.

  ### Part 2: Remaining Judgment Calls
  No formalism removes human judgment entirely. You must explicitly accept responsibility for these three points:

  1.  **Choosing $E_{orig}$:** If the original paper reports multiple analyses or outcomes, which effect size do you compare against?
      *   *Rule:* Use the primary outcome defined in the original paper's abstract. If ambiguous, use the largest effect size claimed in the conclusion (conservative for the original author).
  2.  **Fidelity Subjectivity:** The 90% material match in Step 1 is subjective.
      *   *Rule:* This requires a vote. If 2/3 of your leadership team vote "Pass," it passes. Document the dissent.
  3.  **The "Opposite Direction" Threshold:** In Step 2, Question 1, does a tiny effect in the opposite direction count as `Contradiction`?
      *   *Rule:* Yes, if the CI excludes 0. Significance dictates the direction confidence, not the magnitude.

  ### Part 3: Running the Cases

  Here is how RVP-1 applies to the two cases you described. I anticipate you may dislike the verdict in Case 2, as it denies you a "clean" failure.

  #### Case 1: The "One-Third" Result
  *   **Data:** Replication effect $\approx 0.33 \times E_{orig}$.
  *   **Stats:** Significant ($p < .05$, CI excludes 0). CI excludes $E_{orig}$.
  *   **Fidelity:** Assumed High.
  *   **Procedure Path:** Step 2, Q2 (Yes) $\rightarrow$ Q3 (No).
  *   **Verdict:** **`Effect Confirmed (Attenuated)`**
  *   **Reasoning:** This is the most scientifically honest label. It prevents the original authors from claiming "Total Failure" (because the effect exists) and prevents them from claiming "Full Success" (because their magnitude was wrong). It validates the skepticism about the *size* without denying the *phenomenon*.
  *   **Prior Handling:** If the Skeptic predicted null, they were wrong about existence but right about magnitude. If the Author predicted large, they were right about existence but wrong about magnitude. Publish this nuance.

  #### Case 2: The "Wide Null" Result
  *   **Data:** Non-significant. CI includes 0. CI includes $E_{orig}$.
  *   **Stats:** The interval is "comfortable" (wide), covering both null and original claim.
  *   **Fidelity:** Assumed High.
  *   **Procedure Path:** Step 2, Q2 (No) $\rightarrow$ Q4 (No).
  *   **Verdict:** **`Inconclusive`**
  *   **Reasoning:** I know you want to call this a `Evidence of Absence` or `Failed Replication`. **You cannot.** If your confidence interval includes the original effect size, your data are statistically consistent with the original claim being true. To declare failure here is to lie about your own precision.
  *   **The Hard Truth:** This verdict admits that *your* replication was underpowered to distinguish the null from the original claim. This is uncomfortable. It shifts the blame from the original finding to your design. However, it is the only verdict that protects you from a statistical rebuttal.
  *   **Recommendation:** If you frequently land here, your unit's default sample size calculations are too optimistic. You are running underpowered replications of uncertain effects. Increase your N or narrow your SESOI.

  ### Summary of Changes to Your Current Practice
  1.  **Stop using "Failed to Replicate" as a catch-all.** It is scientifically inaccurate for Case 2 and politically incendiary for Case 1.
  2.  **Decouple Priors from Verdicts.** Use the three-source elicitation to enrich the narrative, not to determine the label.
  3.  **Embrace "Inconclusive."** It is better to admit uncertainty than to be caught defending a false negative.
  4.  **Fidelity First.** Never issue a statistical verdict on a design mismatch.

  This procedure gives you armor. When a journalist asks why you didn't declare "Failure" on Case 2, you show them the Confidence Interval. When an original author complains about Case 1, you acknowledge their effect exists but note the magnitude discrepancy. You move from arguing about feelings to arguing about intervals.
