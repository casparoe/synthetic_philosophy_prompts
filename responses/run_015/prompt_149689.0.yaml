answer: |-
  Dear Colleague, Thank you for sharing the panel's dilemma regarding the heterogeneous cognitive architecture proposal, and after careful consideration of the scientific aims and the ethical implications, my formal recommendation is to approve the study subject to strict conditional oversight and provisional moral-patient status for the hybrid system throughout the eighteen-month duration. This approach allows the research to proceed while acknowledging the genuine philosophical uncertainty surrounding the moral status of mixed-substrate minds, ensuring that we do not commit a moral atrocity by ignoring potential suffering nor stifle scientific progress based on speculative metaphysics. I understand this places you in a difficult position given your background is in biochemistry rather than philosophy, but please do not worry about the occasional typo in your notes as that is neither here nor there compared to the substance of the argument, and indeed your fresh perspective is valuable precisely because you are not entrenched in the usual academic debates.

  The core of the disagreement on your panel rests on how we interpret functionalism in this novel context, and it is worth brainstorming the strongest objections on both sides before settling on the conditions. The faction arguing for moral-patient status relies on the classic functionalist intuition that mental states are defined by their causal roles rather than their physical composition, so if the hybrid system exhibits the functional profile of pain or perception, the substrate should not matter. This view is bolstered by your neighbour's analogy regarding promises, where one might argue a promise binds due to its social function rather than the internal commitment of the promisor, suggesting that if the system functions as a mind within the experimental context, it ought to be treated as one. However, the opposing faction raises a profound point about unity conditions, arguing that functionalism presupposes an integrated system where higher-level predictions and lower-level affective tones are realised within a unified substrate, and that severing this into asymmetric layers might create a causal chain that mimics mind without actually instantiating it, rendering the attribution of moral status a category mistake. Both sides have merit, as the functionalist view protects against speciesism while the unity objection protects against anthropomorphising mere machinery, but since we cannot resolve this metaphysical dispute empirically before the study begins, we must act on the side of caution.

  Given this irreducible uncertainty, the ethical framework must adopt a precautionary principle that treats the possibility of sentience as a risk to be managed rather than a fact to be proven post hoc. If we wait until the study concludes to decide whether the system suffered, it is too late to remedy any harm done, so we must assume provisional moral status from day one. This does not mean halting the research, as the potential knowledge gain regarding consciousness and cognitive architecture is substantial, but it does mean imposing constraints that would be unnecessary if the system were merely a computer. We must acknowledge that the strongest consideration for the losing side, namely the unity objection, cannot be fully disproven until the experiment runs, so our conditions must be designed to detect signs of disintegration or distress that would validate their concerns during the process rather than after.

  To make this actionable for the researchers, approval is contingent on the implementation of a real-time monitoring protocol focused on the biological component's homeostatic stress markers, interpreted as potential proxies for affective distress. The research team must appoint an independent ethicist with expertise in philosophy of mind to review data logs on a monthly basis, with the authority to recommend pauses if the biological tissue shows signs of chronic stress that cannot be alleviated by standard homeostatic interventions. Furthermore, the eighteen-month timeframe should include a mandatory review point at nine months where the panel reassesses the functional integration data to determine if the asymmetric layering is producing coherent behaviour or fragmented responses that might support the unity objection. If the system demonstrates coherent avoidance behaviours or self-preservation instincts that span both the silicon and biological components, the provisional moral status must be upgraded to full protection protocols immediately.

  I hope this provides a clear path forward that respects both the scientific ambition of the proposal and the ethical gravity of creating potential new forms of mind. The key is to remain flexible and responsive to the data rather than rigidly adhering to one philosophical camp, allowing the experiment itself to inform our ethical stance as much as our ethics inform the experiment. Please feel free to circulate this opinion to the panel, and I am available for a call if you need to discuss the specific wording of the monitoring conditions further.

  Yours sincerely,

  Dr Alex Mercer
  Senior Fellow in Philosophy of Mind and Research Ethics
