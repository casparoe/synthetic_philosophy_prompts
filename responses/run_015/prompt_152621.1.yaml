  # Decision Tree: Do We Carve Nature at Its Joints?

  **Start:** *Some classifications let you predict better than others, and that needs explaining.*

  **Node 1 (The Velmorphs):** Consider the **Velmorphs** (deep-sea species from six lineages, 200M years diverged, identical feeding organs). Can a classification based on the *organ* be **equally real** as one based on *lineage*, even if they conflict?
  *   **Yes:** → **Dupré (Promiscuous Realism)**. (Nature has many overlapping joints; context selects the knife).
  *   **No:** (There is one correct taxonomy). → Go to Node 2.
      *[Distinction: Monism vs. Pluralism]*

  **Node 2 (The Chrono-Strata):** Consider **Chrono-Strata** (rock layers that predicted fossils perfectly for 50 years, then new theory showed they were mixed by a cataclysm). If the rocks didn't change but the theory did, did the **"kind" status** of those layers change?
  *   **Yes:** (It was a kind in 1970, not in 1990). → **Temporal Indexing View**. (Kindhood is indexed to a research programme's inductive success over time).
  *   **No:** (It was always a kind or never was). → Go to Node 3.
      *[Distinction: Transient vs. Permanent Realism]*

  **Node 3 (Ontology):** When we say a kind is "real", are we describing a feature of the **world** or a feature of our **language**?
  *   **Language:** → Go to Node 3b.
  *   **World:** → Go to Node 4.
      *[Distinction: Realism vs. Anti-Realism]*

  **Node 3b (Elimination):** If it is just language, should we **keep** talking about kinds (as useful fictions) or **stop** (as misleading)?
  *   **Keep:** → **Conventionalist**. (Kinds are pragmatic tools, nothing more).
  *   **Stop:** → **Eliminativist**. (Talk of kinds is a relic of bad metaphysics).
      *[Distinction: Instrumentalism vs. Error Theory]*

  **Node 4 (Fundamentality):** Must a real kind correspond to the **fundamental properties** of physics?
  *   **Yes:** → **Lewis/Armstrong (Perfectly Natural Properties)**. (Only the fundamental base carves true joints; rest is derivative).
  *   **No:** (Special sciences can have real kinds). → Go to Node 5.
      *[Distinction: Fundamentalism vs. Non-Reductive Realism]*

  **Node 5 (Autonomy):** Can biology/psychology have real kinds even if they **don't reduce** to physical kinds?
  *   **Yes:** → **Fodor (Special Science Kinds)**. (Kinds are real if they support laws, regardless of physical reduction).
  *   **No:** (They must align with lower-level structures). → Go to Node 6.
      *[Distinction: Autonomy vs. Alignment]*

  **Node 6 (The Orpiment Glass):** Consider **Orpiment Glass** (one name, no shared microstructure, one patented process, reliable optical property). Must members share a **single necessary cause**, or just a **stable cluster** of traits?
  *   **Cluster:** → **Boyd (Homeostatic Property Cluster)**. (Kinds are held together by homeostatic mechanisms, allowing variation).
  *   **Single Cause:** → Go to Node 7.
      *[Distinction: Polythetic vs. Monothetic]*

  **Node 7 (Location of Essence):** If there is a single necessary cause, is it defined by **what it is made of** (structure) or **how it was made** (history)?
  *   **Structure:** → **Kripke–Putnam (Microstructural Essentialism)**. (Water is H₂O in all worlds).
  *   **History:** → **Millikan (Historical/Etiological Kinds)**. (A tiger is a tiger because of its lineage, not just its DNA).
      *[Distinction: Structural vs. Historical Essentialism]*

  ***

  ### Logical Space Analysis: Unoccupied Combinations

  1.  **Fundamentalist Cluster Realist:** (Node 4: Yes + Node 6: Cluster).
      *   *Status:* **Incoherent.** If you demand fundamental physics (Lewis), you generally demand strict identity conditions, not fuzzy clusters. Clusters imply higher-level emergent stability.
  2.  **Historical Fundamentalist:** (Node 4: Yes + Node 7: History).
      *   *Status:* **Unattractive.** Fundamental particles don't typically have "histories" or "lineages" in the biological sense. They just *are*.
  3.  **Transient Eliminativist:** (Node 2: Yes + Node 3: Language).
      *   *Status:* **Unexplored.** This would be the view that "kind" terms are useful fictions *only temporarily*. Most eliminativists think they are always fictions; most temporalists think they are temporarily *real*.
  4.  **Promiscuous Eliminativist:** (Node 1: Yes + Node 3: Language).
      *   *Status:* **Merely Unattractive.** Dupré argues the pluralism is *ontological*. If you make it linguistic, you collapse into Conventionalism, losing the explanatory power of the view.

  ***

  ### Closing Note: Where the Tree Does Violence

  This tree forces a clean separation between **Boyd (HPC)** and the **Temporal Indexing View** at Node 2. A defender of Boyd might object that HPCs *can* cease to be kinds if the homeostatic mechanism breaks, which looks like temporal indexing. However, Boyd would argue the *kindhood* disappears because the *world changed* (mechanism broke), whereas the Temporal View argues the *world stayed fixed* but our *epistemic access* failed. The tree treats these as distinct branches, but in practice, distinguishing "mechanism broke" from "programme failed" is difficult.

  **Redraw Trigger:** If a case arises where a classification supports *laws* (Fodor) but is *transient* (Temporal), the tree breaks. Fodor insists on lawhood; the Temporal View denies permanent lawhood. If a "Special Science Law" is found to be time-limited (e.g., Gresham's Law only holds during specific economic regimes), I would merge **Fodor** and **Temporal Indexing** into a single "Pragmatic Realist" leaf and split **Conventionalist/Eliminativist** further to capture the nuance of *why* we reject the ontology.
