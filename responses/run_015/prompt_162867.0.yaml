prompt: |-
  Writing up an adversarial collaboration and I need the joint statement drafted. Setup: Hofstadter's careenium (the alien substrate) and the simmballs (the symbol-patterns it can host). The question is whether the simmballs push the careenium around or whether it's careenium all the way down and the symbols are just bookkeeping we do from outside. Two camps: the Pushers (symbol-level causation is real and explanatory) and the Substratists (every causal difference is a substrate difference; simmballs are multiply realisable patterns, not extra causes).

  I want three things in it. First, a numbered section of claims both can actually sign: no physics-violation, multiple realisability, the fact that simmball-level generalisations are the only tractable ones for prediction, and so on — but no weasel wording like "symbols cause behaviour in some sense".

  Second, a disagreements table where each row is one crux and each side's own position is phrased the way that side would phrase it. Three cruxes I want in there: (a) grain-matching — whether a simmball can push at all if the substrate's causal grain is coarser than the simmball's individuation conditions, i.e. the substrate is grain-blind to it; (b) frozen-substrate intervention — a substrate held fixed while behaviour flips because of the string sitting in its context window, which the Pushers will call the clean case and the Substratists will call a case of more substrate; (c) posterior simmballs — symbol-units that come later in substrate time than the behaviour they're supposed to cause (think a bidirectional model filling in the middle), where a Pusher wants to say the symbol still pushes backwards along symbol time.

  For each crux give one case or argument both would accept as bearing on it, and each side's prediction written down before the fact. Please separate out whichever parts of this are merely verbal — I suspect a good chunk of (a) is — and end by saying, honestly, where neither side would move. Don't bother with citations, I'll add those.
