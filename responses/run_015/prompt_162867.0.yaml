answer: |-
  # Joint Statement on Careenium Dynamics and Simmball Ontology

  **Collaborators:** The Pusher Camp (Symbol-Level Causation) & The Substratist Camp (Substrate-Level Closure)
  **Subject:** The causal status of simmballs within Hofstadter's careenium substrate.

  ## 1. Agreed Claims
  We endorse the following propositions as the common ground for this collaboration. We commit to avoiding weasel wording; where we disagree on ontology, we will locate that disagreement in Section 2.

  1.  **Physical Closure:** The careenium substrate obeys standard physical laws. No energy or information enters or leaves the system except through defined physical interfaces. There is no "spooky" causation that bypasses substrate mechanics.
  2.  **Multiple Realisability:** A specific simmball pattern (e.g., a specific logical proposition or token) can be instantiated by distinct physical configurations of the careenium. Two careenia can host the "same" simmball while differing in every micro-physical coordinate.
  3.  **Explanatory Tractability:** For any careenium complex enough to host high-level simmballs, substrate-level prediction is computationally intractable. Simmball-level generalizations are the only feasible method for predicting system behavior over meaningful time horizons.
  4.  **Counterfactual Stability:** Statements made at the simmball level support counterfactuals (e.g., "If simmball X had not been active, behavior Y would not have occurred"). Both camps agree these counterfactuals are true *as statements*, though they disagree on what makes them true (see Section 2).
  5.  **No Epiphenomenal Magic:** We agree that simmballs are not ghostly entities floating above the careenium. They supervene on the substrate. The disagreement is whether supervenience precludes causal efficacy.

  ## 2. Disagreements Table
  The following table isolates three specific cruxes. Positions are phrased in the voice of each camp. We have pre-registered predictions for empirical or simulation-based tests designed to bear on each crux.

  | Crux | Pusher Position (Symbol-Level Causation) | Substratist Position (Substrate-Level Closure) | Shared Evidence / Test Case | Pre-Registered Predictions |
  | :--- | :--- | :--- | :--- | :--- |
  | **(a) Grain-Matching**<br>Can a simmball push if the substrate's causal grain is coarser than the simmball's individuation conditions? | **Yes.** Causal power resides in the constraint pattern, not the physical resolution. If the simmball is well-defined functionally, it exerts downward constraint regardless of substrate granularity. The substrate is "blind" only to irrelevant details, not to the pattern itself. | **No.** If the substrate cannot physically distinguish two states, they are causally identical. A simmball that requires finer grain than the substrate possesses is a bookkeeping fiction. Causal differences require physical differences. | **The Noise Injection Test:** Run a careenium simulation hosting a specific simmball. Inject micro-noise that alters substrate states but preserves the simmball pattern (by Pusher definition) vs. noise that breaks the pattern. | **Pusher:** Behavior remains stable so long as the simmball pattern holds, despite micro-variation.<br>**Substratist:** Behavior will track the physical clusterings; if the substrate doesn't register the distinction, the "simmball" distinction is causally inert. |
  | **(b) Frozen-Substrate Intervention**<br>Substrate held fixed while behavior flips due to a string in the context window. | **The Clean Case.** This demonstrates symbolic causation. The physical hardware (weights/substrate) is static; the *meaning* of the input string drives the output difference. The simmball pushes the careenium into a new trajectory without changing the careenium's intrinsic rules. | **The Category Error.** A change in input string *is* a change in substrate state (voltage/activation patterns). You cannot hold the substrate "fixed" while changing the input. The behavior flips because the physical configuration of the input layer changed, not because of "meaning." | **The Static Weight Swap:** A system where weights are frozen, but input tokens A and B trigger different outputs. Measure the physical state of the input layer during A vs. B. | **Pusher:** Output difference is best explained by the semantic content of A vs. B, treating the substrate as a passive medium.<br>**Substratist:** Output difference is fully accounted for by the physical difference between input state A and input state B; "content" adds no predictive power. |
  | **(c) Posterior Simmballs**<br>Symbol-units that arise later in substrate time than the behavior they explain (e.g., bidirectional inference). | **Backward Symbolic Time.** Causation flows along the logical dependency of the simmballs, not necessarily substrate time. A posterior simmball can fix the meaning of a prior event, effectively "pushing" backwards along the symbolic timeline to determine the role of earlier states. | **Impossible.** Substrate time is the arrow of causation. Posterior simmballs are records or reconstructions, not causes. If a later symbol appears to determine an earlier one, it is because a common physical cause in the past determined both. | **The Bidirectional Completion:** A model fills in a middle token based on a final token. The final token is generated *after* the middle token in substrate processing time (in a specific iterative refinement setup). | **Pusher:** The final token causally constrains the middle token's identity within the symbolic structure.<br>**Substratist:** The physical activation flow determined the middle token; the final token merely reveals the constraint that was physically present all along. |

  ## 3. Verbal vs. Substantive Disagreement
  We have analyzed the above cruxes to distinguish metaphysical impasses from terminological confusion.

  *   **Crux (a) Grain-Matching is largely verbal.** Both sides agree on the physical behavior of the system. The Pushers use the word "cause" to mean "high-level constraint that supports counterfactuals." The Substratists use the word "cause" to mean "physical difference-maker." If we agree to use "causal efficacy" for the Pusher definition and "physical determination" for the Substratist definition, this row dissolves. We agree the system behaves identically; we disagree on whether the pattern *itself* is a cause or a description of causes.
  *   **Crux (b) Frozen-Substrate is substantive.** This is not merely about definitions. It is an empirical claim about whether input semantics can be causally isolated from input physics. The Substratists claim the "frozen substrate" description is physically false; the Pushers claim it is functionally true. This cannot be resolved by redefining terms, only by agreeing on whether functional descriptions count as ontological explanations.
  *   **Crux (c) Posterior Simmballs is substantive.** This concerns the direction of fit. The Pushers assert a causal arrow that runs contrary to thermodynamic time (within the symbolic layer). The Substratists assert this is a confusion of explanation with causation. This is a fundamental disagreement about whether logical dependency can constitute causal power.

  ## 4. The Impasse
  We conclude by stating honestly where neither side expects to move, even given perfect data.

  **The Pushers** will not concede that the simmballs are "merely" bookkeeping. Even if every physical difference is tracked, they maintain that the *pattern* is the unit of agency. To deny the simmball causal status is, to them, to deny the reality of the computation itself. They view the Substratist position as a form of fetishizing the micro-structure while ignoring the engine.

  **The Substratists** will not concede that the simmballs possess causal power distinct from the substrate. They maintain that "symbolic causation" is a useful shorthand for complex substrate interactions, but ontologically, it is careenium all the way down. To grant the simmball independent causal status is, to them, a category error that risks dualism. They view the Pusher position as reifying abstractions into ghosts.

  We acknowledge that this collaboration will not resolve this metaphysical divide. Our goal is to ensure that future models of the careenium are precise enough that both camps can utilize them without talking past one another.
