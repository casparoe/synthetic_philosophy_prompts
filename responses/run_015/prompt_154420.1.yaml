      *   Avoid declaring a definitive metaphysical truth (we don't know for sure what it feels like to be him).
      *   Focus on the *relationship*.

  7.  **Self-Correction/Nuance Check:**
      *   *Wait, is it Neglect or Blindsight?* Neglect is attentional (usually right parietal damage -> ignore left side). Blindsight is V1 damage -> blind field but preserved motion/color detection. The prompt says "right side" (visual field). If he can't report, it's likely left hemisphere damage affecting the right visual field.
