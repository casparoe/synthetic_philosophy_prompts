      *   **Duration:** 90 minutes.
      *   **Core Concept:** The "Standing-Shift Problem" of price controls. It's not just about shortages (quantity); it's about *moral standing*. Price controls redefine the relevant community of claimants. Those excluded lose the standing to claim exploitation or injustice because they are "outside the market." Defenders of the policy can ignore them because the policy defines them as non-participants.
      *   **Format:** Role-play or card-based simulation. Hidden roles. Small stakes (candy/points).
      *   **Roles:** Landlords, Tenants, Workers, Employers, Regulator.
      *   **Constraint:** Rules must make it impossible to serve everyone.
      *   **Debrief:** Must explicitly connect the gameplay to the standing-shift argument.
      *   **Honesty Check:** Must identify what the game *cannot* capture (e.g., long-run effects) and how to address it verbally.
      *   **Specific Instruction:** Role cards must be received face-down. No reading lists.

  2.  **Deconstruct the Core Concept (Standing-Shift):**
      *   *Standard Econ Story:* Price ceiling $\rightarrow$ Shortage $\rightarrow$ Deadweight loss.
      *   *Philosophical Twist:* Price ceiling $\rightarrow$ Rationing $\rightarrow$ New Criteria for Access $\rightarrow$ Exclusion $\rightarrow$ Loss of Moral Claim.
      *   *The Trap:* If I am a tenant *inside* the rent-controlled apartment, I am protected. If I am a tenant *outside* looking in, I am not "priced out" in the moral sense; I am "ineligible." The policy shifts the boundary of who counts as a "victim" if denied housing.
      *   *Goal:* Make students feel the relief of being "in" and the frustration of being "out," but structurally force the "in" group to justify the exclusion of the "out" group using the very rules that excluded them.

  3.  **Design the Simulation:**
      *   *Name:* "The Allocation Protocol."
      *   *Setup:* 16 students.
      *   *Roles:*
          *   Regulator (1): Enforces the cap/floor.
          *   Resource Holders (Landlords/Employers) (5): Have slots to give.
          *   Claimants (Tenants/Workers) (10): Need slots.
      *   *Resource:* "Livelihood Tokens" (Candy/Points).
      *   *Mechanism:* Two Rounds.
          *   Round 1: Free Market (Chaos/Inequality).
          *   Round 2: Price Control (Order/Exclusion).
      *   *Hidden Info:* Claimants have different "Need Levels" (hidden on cards). Holders have different "Capacity Costs."
      *   *The Twist:* In Round 2, the Regulator sets a price cap. Holders *cannot* charge more. But there are more Claimants than Slots. Holders must choose who gets slots based on *non-price* criteria (friendship, need, randomness).
      *   *The Standing Shift:* The Claimants who don't get slots are told they have no recourse because the Price was "Fair" (capped). Their exclusion is framed as "bad luck" or "ineligibility," not exploitation.

      *Refining the Mechanism for Philosophy Grads:*
      They need to argue. The game needs a negotiation phase.
      Let's make it about *Justification*.
      Round 1: Unregulated. High inequality. Some get nothing.
      Round 2: Regulated. Price fixed. Shortage created.
      The crucial moment: The Regulator must justify why the excluded people don't get a payout. The "Insiders" (who got slots) will defend the cap because it helped them. The "Outsiders" will complain. The "Insiders" will argue the Outsiders never had a *right* to the slot at that price, only a *hope*.

      *Revised Design:*
      *   **Roles:** 4 Landlords (4 Apartments total), 10 Tenants, 1 Regulator, 1 Observer (or make Regulator + Observer = 2). Let's stick to 16. 4 Landlords, 10 Tenants, 1 Regulator, 1 Scribe/Observer.
      *   **Wait, 16 students.** Let's do 4 Landlords, 10 Tenants, 2 Regulators.
      *   **Goal:** Tenants need an apartment to survive (get points). Landlords want points.
      *   **Round 1 (Market):** Landlords set prices. Tenants bid.
      *   **Round 2 (Control):** Regulators set Max Price. Landlords cannot raise price. If demand > supply, Landlords choose who gets in.
      *   **Hidden Info:** Tenants have "Urgency" (1-3). Landlords have "Maintenance Cost."
      *   **The Kicker:** In Round 2, if a Tenant is rejected, they cannot appeal to "exploitation" because the price was legal. They can only appeal to "fairness of selection." The Landlords will use arbitrary criteria. The Regulators will validate the price, ignoring the exclusion.

      *Wait, I need to emphasize the "Standing-Shift".*
      The argument is: The policy makes the excluded invisible as *victims of price*. They become *failed applicants*.
      Let's add a "Claim Phase." After allocation, anyone without a resource can file a "Grievance."
      In Round 1, Grievance = "Price too high."
      In Round 2, Grievance = "Why me?"
      The Regulator rejects Round 2 grievances by saying "The price was fair. You just weren't chosen."
      *This is the standing shift.* The grievance shifts from "The system is unjust" to "I was unlucky."

  4.  **Drafting the Timeline:**
      *   0-10: Setup & Role Cards (Face Down).
      *   10-25: Round 1 (Market).
      *   25-40: Round 2 (Controls).
      *   40-55: The Grievance Tribunal (Crucial).
      *   55-90: Debrief & Philosophical Connection.

  5.  **Drafting the Payoff/Hidden Structure:**
      *   Tenants: Need apartment to get "Survival Points." Hidden Urgency multiplies points.
      *   Landlords: Get points per rented unit.
      *   Regulators: Get points if "Social Stability" is high (no riots/grievances upheld).
      *   *Crucial:* In Round 2, there are 10 Tenants and 4 Apartments. 6 people *will* fail.
      *   *The Trap:* The Regulators are incentivized to say the policy worked (Price was low!). The Landlords are incentivized to pick friends/low-maintenance. The Tenants who lose are told the price was "Just."

  6.  **Developing the Debrief (The "Standing-Shift"):**
      *   Ask the losers: "What was your complaint?"
      *   Ask the winners: "Did you feel the losers had a valid claim?"
      *   Ask Regulators: "Why did you reject the grievances?"
      *   *The Reveal:* The price control didn't just lower rent; it changed the *language of complaint*. You couldn't say "It's too expensive." You had to say "Pick me." This shifts you from a market participant with a claim on affordability to a supplicant with a claim on charity/discretion.
      *   *Philosophical Link:* This mirrors how welfare states or regulated markets define the "deserving poor." If you are outside the cap, you aren't exploited; you're just not eligible.

  7.  **Identifying Limitations:**
      *   Game is one-shot. Real world is dynamic.
      *   Game doesn't show supply drying up over time (Landlords don't leave in the game).
      *   Game doesn't show black markets easily (unless I add a rule, but keep it simple).
      *   *Fix:* Verbalize the "Long Run." In the real world, Landlords stop building. In the game, they are forced to play. The "Standing Shift" hides the fact that the pool is shrinking over time.

  8.  **Refining the Materials:**
      *   Need specific text for Role Cards.
      *   Need clear instructions for the Regulator to enforce the "Standing Shift" rhetoric.
