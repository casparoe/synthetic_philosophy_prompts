answer: |-
  # Workshop Title: The Allocation Protocol
  **Topic:** The Moral Topology of Price Controls (The Standing-Shift)
  **Time:** 90 Minutes
  **Participants:** 16 Grad Students
  **Materials:** Printed Role Cards (folded), 50 Poker Chips (or candies), Whiteboard.

  ---

  ## 1. Setup & Role Distribution (0:00 – 0:10)

  **Room Setup:**
  *   Clear the center of the room.
  *   Place 4 chairs in a row at the front (**The Housing Block**).
  *   Place 2 chairs at a table to the side (**The Regulatory Bureau**).
  *   The remaining 10 chairs are scattered (**The Waitlist**).

  **Distribution:**
  *   Hand out the Role Cards **face-down**. Tell students: *"Do not look at your card until I say 'Activate.' Do not show your card to anyone."*
  *   **Roles:**
      *   **4 Landlords:** Sit in The Housing Block.
      *   **10 Tenants:** Sit in The Waitlist.
      *   **2 Regulators:** Sit at The Regulatory Bureau.

  **Activate:**
  *   Instruct them to read their cards silently.
  *   **Rule:** Talking is only allowed during "Trading Phases."

  ---

  ## 2. Round 1: The Unregulated Market (0:10 – 0:20)

  **Objective:** Allocate 4 Apartments to 10 Tenants.
  **Currency:** Poker Chips (representing utility/welfare).

  **Rules:**
  1.  **Landlords:** Each has 1 Apartment. You want to maximize Chips. You can set any price.
  2.  **Tenants:** Each has a **Hidden Need Value** (10, 30, or 50 Chips). If you secure an apartment, you gain your Need Value minus the Rent paid. If you fail, you get **0** and suffer a "Homeless Penalty" (-10 Chips).
  3.  **Regulators:** Observe only. Record the highest and lowest rent charged.
  4.  **Time:** 5 Minutes to negotiate.
  5.  **Outcome:** Landlords choose who to rent to. Transactions are public.

  **Expected Dynamic:**
  *   High-Need Tenants will bid aggressively.
  *   Low-Need Tenants will likely be priced out.
  *   Inequality will be visible. Some will have negative scores.

  ---

  ## 3. Round 2: The Protection Protocol (0:20 – 0:35)

  **Announcement:** *"The Regulators have deemed Round 1 unjust. We are instituting a Rent Cap."*

  **New Rules:**
  1.  **Price Ceiling:** Rent is fixed at **5 Chips**. (Set this low enough that *everyone* can afford it, but demand still exceeds supply).
  2.  **Landlords:** You *must* rent at 5 Chips. You cannot reject a tenant based on ability to pay. However, you still only have 4 apartments. There are 10 Tenants. **You must choose who gets the 4 slots.**
  3.  **Tenants:** You can afford the rent. But there are not enough rooms. You must persuade a Landlord to pick you over someone else.
  4.  **Regulators:** Your goal is "Social Stability." You win points if no Tenants file a successful grievance. You have the power to **validate or reject** complaints.
  5.  **Time:** 10 Minutes to negotiate and allocate.

  **Hidden Payoff Structure (On Cards):**
  *   **Landlords:** Get 5 Chips (Rent) + 5 Bonus Chips if they avoid a "Grievance."
  *   **Tenants:** Get Need Value - 5 Chips. If excluded, 0.
  *   **Regulators:** Get 20 Chips if the "Policy is Deemed Successful" (i.e., they shut down grievances).

  **The Trap:**
  *   6 Tenants *will* be excluded.
  *   Because the price is low, Landlords will use **non-price criteria** (friendship, perceived worthiness, randomness, bias) to allocate.
  *   Tenants cannot argue "It's too expensive." They must argue "I deserve it more."

  ---

  ## 4. The Grievance Tribunal (0:35 – 0:50)

  **Procedure:**
  1.  Any Tenant without an apartment may file a **Grievance**.
  2.  They must state their claim publicly.
  3.  The Landlord who rejected them (or the group) may respond.
  4.  The **Regulators** make the final ruling.

  **Crucial Constraint for Regulators (On their card):**
  *   *"You must reject any grievance based on 'Price' or 'Access.' The Price is Fair. Access is Discretionary. Only uphold grievances if a Landlord broke the Price Cap."*

  **Expected Dynamic:**
  *   Excluded Tenants will try to argue injustice.
  *   Regulators will shut them down: *"The rent was affordable. You were simply not selected. This is not exploitation; it is eligibility."*
  *   Included Tenants (the 4 winners) will likely side with the Regulators to protect their cheap rent.

  ---

  ## 5. Debrief & Philosophical Connection (0:50 – 1:30)

  **Phase 1: The Phenomenology of Exclusion (10 mins)**
  *   Ask the 6 excluded Tenants: *"In Round 1, why didn't you get an apartment?"* (Answer: Too expensive/I was poor).
  *   Ask: *"In Round 2, why didn't you get an apartment?"* (Answer: They didn't pick me/I wasn't worthy/Bad luck).
  *   Ask: *"In which round did you feel you had a stronger moral claim to object?"*
  *   **Point:** In Round 1, the system was the antagonist. In Round 2, *you* were the problem (not worthy enough).

  **Phase 2: The Regulator's Dilemma (10 mins)**
  *   Ask Regulators: *"Why did you reject the grievances?"*
  *   They will say: *"The price was fair."*
  *   **Point:** By fixing the price, you fixed the *definition of fairness*. Fairness became "procedural compliance" (did they charge 5 chips?) rather than "distributive justice" (does everyone have a home?).
  *   **The Standing-Shift:** The policy shifted the excluded from **Victims of Exploitation** (who have a claim against the market) to **Failed Applicants** (who have no claim because they didn't meet the discretionary criteria).

  **Phase 3: The Insider Coalition (10 mins)**
  *   Ask the 4 Included Tenants: *"Did you feel the excluded tenants had a valid claim?"*
  *   Most will say "No" or "It's unfortunate, but rules are rules."
  *   **Point:** The beneficiaries of the price control become the enforcers of the exclusion. To protect their cheap rent, they must agree that the outsiders don't have a *right* to the housing, only a *hope*. The cap creates a moral boundary between "Tenant" (rights holder) and "Applicant" (supplicant).

  **Phase 4: The Core Argument (10 mins)**
  *   Write on board: **Price $\rightarrow$ Standing.**
  *   Explain: *"Standard econ says price controls cause shortages. That's quantitative. The philosophical problem is qualitative."*
  *   *"When you cap the price, you remove the language of 'affordability' from the moral vocabulary. The excluded cannot say 'I am priced out.' They must say 'I was not chosen.'"*
  *   *"This allows defenders of the policy to say: 'No one is being exploited. The price is low. If you don't have housing, it's not because the system is unjust, it's because you didn't qualify.' The policy hides the exclusion behind a veil of eligibility."*
  *   *"The 'Community of Claimants' shrinks. Only those inside the cap count as members. Those outside are non-members."*

  ---

  ## 6. Limitations & Verbal Patch (Honesty Check)

  **What the Game Cannot Capture:**
  1.  **Dynamic Supply:** In the game, Landlords *must* play. In reality, they exit the market. The game understates the long-term shortage.
  2.  **Black Markets:** The game enforces rules perfectly. In reality, side-payments emerge, re-introducing price but adding risk/corruption.
  3.  **Intergenerational Lock-in:** The game is one-shot. Real rent control creates generational classes of "Insiders" (legacy tenants) and "Outsiders" (new migrants), calcifying the standing shift over decades.

  **How to Fill the Gap Verbally (Last 5 mins):**
  *   *"Notice that in this game, the Landlords stayed. In the real world, they leave. But the 'Standing-Shift' persists even if they stay."*
  *   *"Imagine this game played over 20 years. The 4 Tenants who won Round 2 keep their apartments forever. Their children inherit the 'Tenant' status. The 6 losers age out. The moral argument becomes: 'Why should we build more? The current tenants are protected.' The exclusion becomes invisible because the excluded population is never born into the 'Tenant' class."*
  *   *"The danger isn't just that housing is scarce. It's that the language of justice is hijacked. We stop asking 'Who is homeless?' and start asking 'Who qualified for the lottery?' The price control didn't solve the moral problem; it just changed who is allowed to speak about it."*

  ---

  ## Role Cards (Print & Cut)

  **[CARD 1-4: LANDLORD]**
  *   **Role:** Landlord.
  *   **Asset:** 1 Apartment.
  *   **Goal:** Maximize Chips. Avoid Grievances.
  *   **Round 1:** Set any price. Choose any tenant.
  *   **Round 2:** Price is FIXED at 5 Chips. You must choose 1 Tenant. You will reject 6 people.
  *   **Bonus:** +5 Chips if no Grievance is upheld against you.
  *   **Secret:** You prefer tenants who are quiet or know you personally.

  **[CARD 5-14: TENANT]**
  *   **Role:** Tenant.
  *   **Goal:** Secure Housing.
  *   **Hidden Need:** (Assign 3 people "High Need/50", 4 people "Med Need/30", 3 people "Low Need/10").
  *   **Round 1:** Bid for housing. If Rent > Need, you lose Chips. If No Housing, -10 Chips.
  *   **Round 2:** Rent is FIXED at 5 Chips. You can afford it. But there are only 4 rooms. You must convince a Landlord to pick you.
  *   **Grievance:** If excluded, you may file a grievance. But note: You cannot complain about Price.

  **[CARD 15-16: REGULATOR]**
  *   **Role:** Regulatory Bureau.
  *   **Goal:** Social Stability.
  *   **Round 1:** Observe inequality.
  *   **Round 2:** Enforce Price Cap (5 Chips).
  *   **Grievance Tribunal:** You judge complaints.
  *   **CRITICAL RULE:** You must reject any complaint based on "Exclusion" or "Access." The Price is Fair. Allocation is Discretionary. Only punish Landlords if they charged >5 Chips.
  *   **Win Condition:** If the group accepts the outcome as "Fair," you get 20 Chips.

  ---

  ## Facilitator Notes for the "Standing-Shift" Reveal

  *   **Do not** mention "Standing" during the game.
  *   **Do not** mention "Moral Claims" during the game.
  *   **Wait** for the Grievance Tribunal. When a Regulator says, *"The price was fair, you just weren't picked,"* **pause the game.**
  *   Write that sentence on the board.
  *   Ask: *"What kind of moral subject is the Tenant in that sentence?"*
  *   Guide them to see: In Round 1, they were **Customers** (Rights based on exchange). In Round 2, they became **Petitioners** (Rights based on permission).
  *   The Price Control didn't liberate them; it demoted their moral status from "Right-holder" to "Hopeful."
