answer: |-
  Here is a precisification of the distinct theses potentially contained within the sentence "he was a man of his time," structured as a menu for your panel's deliberation.

  ### I. Claims about the Truth or Variability of Moral Standards

  **1. The Moral Indexicality Thesis**
  *   **Thesis:** Moral truths are indexed to historical eras; an action that is wrong today was objectively right (or morally neutral) in the past.
  *   **Classification:** False (philosophically). While social norms vary, most ethical frameworks reject the idea that the *truth* of a moral claim changes merely with the calendar.
  *   **Definition of 'His Time':** The prevailing moral consensus of the dominant class.
  *   **Licensing:** Licences retaining celebratory framing without qualification, as the subject did no wrong *simpliciter*.
  *   **Asymmetry Test:** **Fails.** If moral truth is indexed, his admired actions (e.g., Churchill's defiance) were only 'right for then' and deserve no trans-historical praise. The fact that the phrase is not used to qualify his virtues suggests this thesis is not genuinely held, but deployed selectively to shield specific vices.

  **2. The Epistemic Limitation Thesis**
  *   **Thesis:** The agent lacked access to the empirical facts necessary to recognise the harm of their actions (e.g., the long-term economic effects of empire, the biological susceptibility of indigenous populations).
  *   **Classification:** Substantive and defensible (contingent on historical fact).
  *   **Definition of 'His Time':** What was knowable from his specific social and informational position, excluding minority dissent.
  *   **Licensing:** Licences a 'contextual' label rather than a 'condemnation' label. It suggests the museum should explain *why* he thought it was acceptable, not necessarily celebrate it.
  *   **Asymmetry Test:** **Fails.** We do not say "he was a man of his time" to explain why he sailed (ignoring risks) or fought (ignoring odds). We attribute those to courage. Using it only for harms implies it functions as a selective excuse for ignorance, not a general theory of action.

  ### II. Claims about What Was Reasonable to Believe

  **3. The Conceptual Horizon Thesis**
  *   **Thesis:** The moral concepts required to condemn the conduct (e.g., 'systemic racism', 'cultural genocide', 'self-determination') did not exist or were not intelligible within the agent's linguistic and philosophical framework.
  *   **Classification:** Substantive and defensible. One cannot be held accountable for violating a norm that has not yet been conceptualised.
  *   **Definition of 'His Time':** The best philosophical and legal opinion available then, excluding fringe critics.
  *   **Licensing:** Licences removing personal vilification, but does not licence celebration. One can acknowledge a figure was conceptually limited without making them an exemplar.
  *   **Asymmetry Test:** **Fails.** We do not say "he was a man of his time" to explain his virtues (e.g., Jefferson's articulation of liberty). We assume he accessed universal concepts for the good, but was bound by local concepts for the bad. This reveals the phrase is being used to manage discomfort, not describe intellectual history.

  ### III. Claims about Excuse, Blameworthiness and Alternatives

  **4. The Structural Coercion Thesis**
  *   **Thesis:** Social, legal, or economic penalties for dissent were so severe that conformity was the only rational choice; the agent had no realistic alternative.
  *   **Classification:** Substantive (requires historical verification).
  *   **Definition of 'His Time':** What he could realistically have done otherwise without ruin or death.
  *   **Licensing:** Licences excusing the agent from *blame*, but not necessarily from *critique*. It suggests the museum should focus on the system that coerced him, rather than the man himself.
  *   **Asymmetry Test:** **Fails.** We do not say "he was a man of his time" to explain why he took risks (e.g., Columbus's voyage). If structural coercion determined his bad acts, did it not also determine his good ones? The selective usage suggests the phrase is an excuse, not a causal explanation.

  **5. The Culpability Distinction Thesis**
  *   **Thesis:** The agent committed objective wrongs, but is not morally culpable for them; one can condemn the act without blaming the actor.
  *   **Classification:** Defensible. This distinguishes between *wrongness* (the act) and *blameworthiness* (the agent's state of mind).
  *   **Definition of 'His Time':** The standards of the affected people (acknowledging they criticised him) weighed against the agent's reasonable belief in his own rectitude.
  *   **Licensing:** Licences a nuanced interpretation: "He did harm, but was not a monster." It forbids both hagiography and cancellation.
  *   **Asymmetry Test:** **Passes.** Excuses are only required where blame is possible. We do not need to excuse virtues. This reading accounts for why the phrase appears only regarding condemned conduct. However, it does not settle whether a non-culpable wrongdoer deserves a permanent gallery.

  ### IV. Claims about the Point of Commemoration

  **6. The Exemplar Thesis**
  *   **Thesis:** Public commemoration is reserved for those who transcended the moral limitations of their era; to be a 'man of his time' is to fail the test of exemplarity.
  *   **Classification:** Substantive normative claim about museum ethics.
  *   **Definition of 'His Time':** The prevailing opinion of the day (which he merely echoed).
  *   **Licensing:** Licences removing commemoration or downgrading the figure from 'hero' to 'historical subject'. It supports the member arguing for removal.
  *   **Asymmetry Test:** **Passes.** This explains the asymmetry perfectly. We only invoke the phrase when questioning whether someone is worthy of honour. It is not used for virtues because virtues are assumed to be timeless; it is used for vices to test if they disqualify the subject.

  **7. The Historical Mirror Thesis**
  *   **Thesis:** The purpose of a civic museum is to represent the past accurately, including its moral failures; removing figures for being 'of their time' sanitises history.
  *   **Classification:** Defensible. This prioritises pedagogical accuracy over moral comfort.
  *   **Definition of 'His Time':** The complex mixture of prevailing and dissenting opinions that constituted the era.
  *   **Licensing:** Licences retaining the figure but demands the interpretation explicitly detail the moral conflicts of the era. It supports the member arguing for retaining the framing, provided the text is robust.
  *   **Asymmetry Test:** **Passes.** Like the Exemplar Thesis, this is a claim about curatorial function. We don't need to justify why we show the 'good' parts; the asymmetry arises from the modern impulse to hide the 'bad' parts, which this thesis resists.

  ### V. Claims about Counterfactuals

  **8. The Counterfactual Humility Thesis**
  *   **Thesis:** If we were placed in his exact position, with his upbringing and information, we would have acted identically; therefore, judgement is hypocritical.
  *   **Classification:** Platitude (unfalsifiable). It relies on an imagined self that cannot be tested.
  *   **Definition of 'His Time':** A totalising deterministic environment including psychology and culture.
  *   **Licensing:** Licences silence. If we are all determined, no verdict is possible. It shuts down discussion entirely.
  *   **Asymmetry Test:** **Fails.** We rarely claim "we would have done the same" regarding his virtues (e.g., "I would have also refused to surrender in 1940"). We assume we *might* have been cowards, but assume we *would* have been prejudiced. This reveals the phrase is a mechanism for lowering the bar for the past, not a consistent theory of human agency.

  ***

  ### Conclusion: What is happening in the room?

  When your colleague says the sentence "settles the matter," she is most likely conflating **Thesis 5 (The Culpability Distinction)** with **Thesis 1 (Moral Indexicality)**.

  She is arguing that because the figure was not *culpable* (Thesis 5), therefore his actions were not *wrong* (Thesis 1), and therefore the *celebratory framing* should remain (Thesis 6 rejected). This is a non-sequitur. One can accept that a historical figure was not a monster by the lights of their own day (non-culpable) while simultaneously deciding that their actions do not merit celebration in a modern civic museum (not an exemplar).

  **Does this reading settle it?**
  No. It confuses a historical judgement (was he blameworthy?) with a curatorial judgement (is he suitable for this gallery?). A museum is not a court of law determining culpability; it is a public space determining values.

  **The Question the Panel Should Ask Instead:**
  Do not ask: *"Can we judge him by today's standards?"*
  Ask: *"What is the pedagogical purpose of including this figure in a gallery on Trade, Empire and Exploration?"*

  If the purpose is to show **how empire was justified**, then his being a "man of his time" is the exhibit itself; his views should be displayed as evidence of the era's ideology.
  If the purpose is to show **heroes of the nation**, then his being a "man of his time" is a disqualifier if that time included conduct we no longer wish to endorse.

  The sentence "he was a man of his time" is not a verdict; it is a description of context. The panel must decide whether that context is the *subject* of the gallery, or an *excuse* for the subject.
