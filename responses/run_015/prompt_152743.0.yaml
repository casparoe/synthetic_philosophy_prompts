      *   *Threat:* Threatens Metaphysical (natural kind status) and Methodological (stability of criteria).
      *   *Support:* Could support the slogan if "illness like any other" means "a real social/biological hybrid that demands response," but usually it's used to deny the specialness.
      *   *Authority:* If looping is real, patient self-description is *constitutive* of the disorder, not just data. This supports "Nothing about us without us."

