      *   *Comparison Class:* Highlight the "Tibia vs. Hypertension" distinction.
      *   *Looping:* Distinguish between "constitutive" vs. "causal" effects.
      *   *Authority:* Distinguish between "Epistemic Authority" (they know best) vs. "Constitutive Authority" (their uptake makes it real).

      *(Self-Correction during drafting)*: Make sure I answer the specific question about whether looping supports the slogan. If the slogan means "real and demanding," looping makes it *more* real in a social sense. But the clinician uses it to mean "static and biological." I need to clarify this tension.

      *(Refining the Verdicts)*:
