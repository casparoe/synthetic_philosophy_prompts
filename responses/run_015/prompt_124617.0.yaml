  3.  **Identify the Flaw:**
      *   The core confusion lies in step (4) and the subsequent collapse of the Design Stance into the Intentional Stance.
      *   Dennett explicitly distinguishes the Design Stance from the Intentional Stance. The Design Stance attributes *functions* or *purposes* based on evolutionary history or engineering, not *beliefs* and *desires* based on rationality norms.
      *   Step (4) claims "aims to pump blood" is structurally identical to "wants to pump blood minus the mind." This is the error. Teleology (function) is not identical to Intentionality (belief/desire).
      *   Dennett's "Real Patterns" argues that intentional states are real patterns *if* they support prediction better than the physical stance. However, the Design Stance also supports prediction better than the Physical Stance. But that doesn't make Design patterns *Intentional* patterns. They are distinct types of patterns.
      *   The roommate assumes that because both stances use teleological language ("for the sake of"), they are ontologically identical. Dennett would say the Design Stance attributes *competence* without *comprehension*. The Intentional Stance attributes *comprehension* (rational agency).
      *   So, step (7) is the false conclusion derived from step (4). Step (4) is the pivot point. The distinction isn't about "stripping the mind," it's about the *source* of the normativity. Design norms come from selection/history; Intentional norms come from rationality consistency.
      *   Actually, looking closer at (1): "supports predictions you cant get from any lower-level stance." The Design stance is higher than Physical. The Intentional is higher than Design.
      *   The real break is at (4) and (5). The Design Stance does not rely on the *Intentional* Stance's vocabulary (belief/desire) but rather *function/goal*. While similar, Dennett insists on the distinction. The "free-floating rationale" is not an intentional state; it's an evolutionary explanation.
      *   Wait, is (1) strictly correct? Dennett says a pattern is real if there is a description that allows prediction *and* is computationally efficient/indispensable. But the key is that different stances reveal different *kinds* of patterns.
      *   The roommate's error is conflating *teleology* (Design) with *intentionality* (Intentional). Step (4) asserts they are structurally identical minus the mind. Dennett would say the "mind" (rational agency) isn't just a wrapper; it's the constitutive element that makes something an intentional state rather than a functional state.
      *   So, reject (4).

  4.  **Drafting the Sections:**

      *   **The broken step:** Focus on Step (4). The claim that "aims" (function) is identical to "wants" (belief/desire) minus the mind is the category error. Dennett distinguishes *competence* (Design) from *comprehension* (Intentional). A heart has the function of pumping blood because of selection history, not because it holds a representation of blood pumping it desires to achieve. The Design Stance predicts based on *what the thing was selected to do*, while the Intentional Stance predicts based on *what a rational agent would do* given beliefs/desires. The norms differ: evolutionary fitness vs. logical consistency. Therefore, successful Design predictions do not validate Intentional patterns, only Functional patterns.

      *   **Why it looked defensible:** Teleological language overlaps heavily. We say "the heart wants to pump" metaphorically. Both stances ignore physical details to focus on "goals." Dennett himself says the Intentional Stance is an extension of the Design Stance. Free-floating rationales look like disembodied beliefs. It's easy to see the structural similarity in the *logic of explanation* (teleology) and assume the *ontology* is the same.

      *   **What fixing it costs:** You must maintain a strict boundary between function and intentionality. This means accepting that "real patterns" come in different flavors. It costs the simplicity of a unified theory of teleology. You have to explain *why* rationality norms apply to humans but selection norms apply to hearts, without just saying "brains." It requires acknowledging that the Intentional Stance is a specific *subset* of the Design Stance logic that requires a specific substrate (rational agency), not just any goal-directed system. It preserves Dennett's realism but limits its scope.

