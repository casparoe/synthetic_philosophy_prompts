answer: |-
  ### The broken step

  The argument collapses at step (4). Your roommate conflates *teleology* (function) with *intentionality* (belief/desire). Dennett explicitly distinguishes the Design Stance, which attributes *competence* without *comprehension*, from the Intentional Stance, which attributes rationality. Saying a heart "aims" to pump blood is shorthand for evolutionary selection history, not an attribution of a propositional attitude. The norms governing the stances differ: the Design Stance relies on biological fitness norms (what was selected for), while the Intentional Stance relies on logical consistency norms (what a rational agent should believe). Step (4) assumes that removing the "mind" from a desire leaves a function, but Dennett argues the "mind" (rational agency) is constitutive of the intentional state, not a removable container. Furthermore, criterion (1) requires predictive advantage over the *next* lower stance. For humans, the Intentional Stance beats the Design Stance. For hearts, the Design Stance beats the Physical, but the Intentional offers no gain over the Design. Thus, successful Design predictions validate functional patterns, not intentional ones. Step (7) fails because the pattern revealed by the Design Stance is ontologically distinct from the pattern revealed by the Intentional Stance.

  ### Why it looked defensible

  This confusion is natural because Dennett describes the stances as a hierarchy where the Intentional is essentially a refined Design Stance. Both utilize teleological language ("for the sake of," "in order to"), ignoring physical mechanics to focus on outcomes. When Dennett discusses "free-floating rationales," he describes evolutionary goals that exist without a thinker, which sounds remarkably like disembodied beliefs. Linguistically, "the heart wants to pump" and "the agent wants to pump" share identical syntax. Since Dennett argues intentional states are abstract patterns rather than neural hardware, the line between a functional abstraction and an intentional abstraction seems porous. If both are real patterns defined by predictive utility, and both use goal-talk, it feels like splitting hairs to deny hearts have "desires" while granting humans have them. The structural isomorphism in the *logic of explanation* makes the ontological distinction feel arbitrary.

  ### What fixing it costs

  Rejecting step (4) requires maintaining a robust distinction between *selectional history* and *rational agency*. You must accept that "real patterns" are not monolithic; there are functional realities and intentional realities. This costs theoretical simplicity. You can no longer treat intentionality as just "design stance plus extra"; you must specify why rationality norms apply to brains but not hearts. It implies predictive success is stance-relative: a pattern is real *as a function* or *as a belief*, not just *real* simpliciter. You lose the easy slide into panpsychism, which might feel like a cost if you liked the symmetry, but it's necessary. You must commit to the view that the Intentional Stance is only indispensable when the Design Stance fails to capture rational inconsistencies. This preserves human uniqueness without magic, but demands careful bookkeeping on which stance is doing the predictive work.

  ### Bottom line

  Reject step (4). Functions are not beliefs. Dennett's realism saves human minds without animating hearts because the Intentional Stance offers predictive power over the Design Stance only for rational agents. Hearts exhibit real functional patterns, not intentional ones. You don't need organ-minds; just acknowledge different stances reveal different real patterns. The Design Stance explains competence; the Intentional Stance explains comprehension. Keeping them distinct preserves Dennett's naturalism without collapsing into absurdity. Your roommate's dilemma is false: predictive success makes patterns real, but not all real patterns are intentional.
