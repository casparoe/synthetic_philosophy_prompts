answer: |-
  **Title:** The Architecture of Attention
  **Time:** Approx. 8 Minutes
  **Speaker:** Commencement Address Speaker

  Graduates, faculty, families, and friends:

  We gather here today under a specific assumption. It is written into the banners, implied in the music, and woven into the very fabric of this ceremony. We assume that what you have earned here is not merely a credential, but a capacity for a good life. We assume that education is a pathway to happiness.

  But what is that happiness?

  In the rush of this moment, it is tempting to offer you the comfortable formulas we often reserve for such occasions. We want to tell you to "follow your bliss." We want to assure you that happiness is a private garden, waiting for you to cultivate it in your own time, in your own way. We want to tell you that it is a personal choice, entirely within your control.

  I cannot tell you these things. Not because they are unkind, but because they are untrue. And to send you into the world with a map that does not match the terrain would be a failure of this institution's duty to truth.

  Instead, I ask you to consider a harder, more rigorous vision. It comes from the Enlightenment philosopher Émilie du Châtelet, whose work on the nature of happiness challenges the very instincts we are celebrating today. Du Châtelet argued that happiness is not a stroke of luck, nor is it a passive state of contentment. It is not something you find. It is something you construct.

  She drew a sharp distinction between two kinds of pursuit. The first is the restless pursuit of distraction—a gluttony for new experiences, for status, for the constant stimulation of the senses. This is the happiness of consumption. The second is the happiness of taste. This requires what she called the "ordering of the passions." It demands that we do not suppress our desires, but neither do we let them run wild. We must discipline them. We must direct them toward objects that can sustain them: deep study, enduring love, meaningful work.

  Now, I know that to some, this sounds like a luxury. A critic might say that du Châtelet's vision is aristocratic. It requires leisure. It requires the safety to study and the freedom to love without obstruction. It is easy to order your passions when you are not fighting for survival.

  To the graduates: You sit today in the privilege of that leisure. You have had the time to study. You have had the protection of this campus. To ignore that privilege would be dishonest. But to treat it as merely a personal asset would be a mistake.

  This is where the private practice of happiness becomes a public obligation.

  We are entering a world that is not suffering from a scarcity of stimuli, but a scarcity of attention. Our common resources are no longer just material; they are psychological. Trust, care, civic engagement, mutual understanding—these are the commons we share. And they are depleted by the counterfeit version of happiness.

  When we treat happiness as the passive consumption of distraction, we overuse those common resources. A citizenry that seeks only to be entertained cannot govern itself. A community that treats relationships as disposable transactions cannot sustain trust. If you pursue happiness only as a private feeling, unmoored from the discipline of what you owe to others, you may find pleasure, but you will not find happiness. And you will leave the world more exhausted than you found it.

  Du Châtelet taught that illusion is sometimes necessary for happiness—we must be able to appreciate the beauty of a play even if we know the actors are pretending. But she warned against the illusion that we are separate from the world we inhabit.

  So, what is my charge to you?

  Do not follow your bliss. Bliss is a weather pattern; it changes with the wind. Instead, cultivate your taste. Learn to distinguish between the things that consume you and the things that sustain you.

  This will require work. It will require you to say no. In an economy that profits from your restlessness, the act of focusing your attention is a rebellion. To stay with a difficult problem, to remain faithful to a difficult person, to commit to a civic duty that offers no immediate reward—this is the "ordering of the passions" in practice. It is the architecture of a life that can hold weight.

  To the families here: You know this better than anyone. You know that love is not a feeling that happens to you; it is a practice you maintain. You know that a home is not built by consuming furniture, but by the daily ordering of habits and care. You have been the engineers of this happiness for your graduates long before they understood the blueprints.

  To the faculty: We have taught them to analyze texts and data. But our greater task has been to model this discipline. To show that intellectual rigor is not cold, but is actually a form of care for the truth.

  Graduates, you are leaving a place that protected your attention. You are entering a world that will bid for it constantly. You will be told that you are free to choose anything. That is true. But you are not free from the consequences of how you choose.

  If you treat your life as a project of private accumulation, you will find that the world becomes smaller, more hostile, and more lonely. But if you treat your happiness as a structural contribution—if you understand that a calm, disciplined, deeply engaged mind is a gift you give to your community—then your private cultivation becomes a public good.

  We do not need you to be happy in the sense of being carefree. We need you to be happy in the sense of being capable. Capable of enduring uncertainty. Capable of loving without possessing. Capable of finding joy in the difficult work of repair.

  Du Châtelet wrote that "the essence of happiness is to be able to taste many things." But taste implies judgment. It implies a standard. It implies that some things are worthy of your limited time and others are not.

  So, go forth. Do not seek to be distracted. Seek to be engaged. Do not seek to consume the world. Seek to understand it. Do not seek a happiness that isolates you in a bubble of comfort. Seek a happiness that is robust enough to be shared, sturdy enough to be relied upon, and disciplined enough to endure.

  Your education has given you the tools to build this. The materials are your passions. The blueprint is your reason. The construction site is the world we share.

  Build well.

  Congratulations.
