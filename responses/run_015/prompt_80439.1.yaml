answer: |-
  This is a classic philosophical stalemate, and your hypothesis is sharp—you've correctly identified the structural fault line. However, I think you're slightly underestimating the depth of Sam's position and, consequently, mislocating the exact point where Williams's objection is supposed to pierce the armor.

  Here is the diagnosis of your impasse, followed by a strategy to break it.

  ### 1. The Diagnosis: It's Substantive, Not Just Verbal

  You asked if this is a verbal standoff over the definition of 'consequentialism' or two people answering different questions. The answer is: **You are answering different questions, but that difference reveals a substantive disagreement about the nature of moral authority.**

  *   **Sam is defending *Indirect Utilitarianism*:** Sam is making the standard distinction between the **Criterion of Rightness** (what makes an act right: maximizing utility) and the **Decision Procedure** (how an agent should decide: follow commitments). This is a coherent, well-trodden position (defended by R.M. Hare, Peter Railton, etc.). Sam is right that Williams's "One Thought Too Many" objection doesn't land on a utilitarian who *never* calculates.
  *   **You are attacking *Justificatory Alienation*:** You are intuiting that Williams's objection isn't just about what goes on in the agent's head *during* the action. It's about the **ground of justification**. Even if I don't *think* "I'm saving my brother because it maximizes utility," if the *truth* of the matter is that I am only permitted to save my brother *because* it maximizes utility, my commitment is still contingent on the impartial calculus.

  **The Impasse:**
  Sam thinks the objection is psychological (Do I have to calculate?). You think the objection is metaphysical/normative (Does the *validity* of my love depend on the calculus?).

  Sam wins on the psychological front. You win on the normative front. You are stuck because Sam thinks solving the psychological problem solves the moral problem, while you think the moral problem remains even if the psychology is fixed.

  ### 2. What You're Missing: The "Self-Effacing" Trap

  Your hypothesis suggests Sam is "smuggling in integrity values wearing a consequentialist trench coat." You are very close to a specific philosophical concept here: **Self-Effacement.**

  If Sam argues that the *best* decision procedure is to ignore utilitarianism and follow personal commitments, they are arguing that **Utilitarianism is self-effacing.** It tells you: *"To maximize the good, you must not try to maximize the good."*

  **Here is the vulnerability in Sam's position:**
  If Utilitarianism is self-effacing, who is it for?
  1.  **If the agent knows it:** Then the agent views their own deepest commitments (love for their brother, career projects) as *tools* or *dispositions* that they are cultivating instrumentally. They are essentially manipulating their own psychology to trick themselves into being good. Williams would say this is the ultimate alienation. You are treating your own integrity as a technology.
  2.  **If the agent doesn't know it:** Then the "sophisticated utilitarian" is living a lie. They think they love their brother intrinsically, but the moral truth is that they are a utility vessel. This creates a "Government House" utilitarianism where the moral truth is reserved for a select few, and the rest of us live in useful delusion.

  ### 3. How to Force the Question (The Path to Progress)

  To break the stalemate, you need to stop arguing about what the agent *thinks* in the moment and start arguing about what the theory says about the *value* of the commitment.

  **Stop asking:** "Does the utilitarian have to calculate in the moment?" (Sam will always say no).
  **Start asking:** "What is the *status* of the commitment if the calculation is the only thing validating it?"

  Here are three specific moves to make:

  **Move A: The "Shadow Justification" Argument**
  > "Sam, I grant you that the agent doesn't need to calculate. But in your view, *why* is it okay for me to save my brother rather than the stranger? Is it because he's my brother, or because saving him happens to track the good?"
  > *   If Sam says "Because he's my brother," they have abandoned utilitarianism for the agent's perspective.
  > *   If Sam says "Because it tracks the good," then ask: "If I found out that in this specific instance, saving the stranger actually produced 0.01% more utility, would I be *morally required* to let my brother drown?"
  > *   If Sam says "Yes," then the personal commitment was never real; it was always provisional. Williams's point is that integrity requires commitments that are **not** provisional on the impartial calculus.

  **Move B: The "Instrumentalization of Character" Argument**
  > "You say the utilitarian should cultivate personal projects because that generally works. But that means the utilitarian views their own character and love as a *means to an end*. If I love my brother *in order to* be an effective utility maximizer (even subconsciously), aren't I using him? Doesn't integrity require that I love him *for his sake*, full stop, with no reference to the general good?"

  **Move C: The "Point of View of the Universe"**
  > "Williams's point is that Utilitarianism adopts a 'point of view of the universe.' It dissolves the distinction between 'me' and 'the world.' Even if I don't calculate, the theory says my 'me-ness' has no fundamental moral weight. It's only weighty because it's useful. My objection is that a moral theory that tells me my own existence is only instrumentally valuable is a moral theory that demands I abandon my integrity, regardless of what decision procedure I use."

  ### 4. Is the Debate Mis-posed?

  No, the debate is not mis-posed, but it is often **mis-categorized**.

  Many intro ethics classes teach Williams as attacking Utilitarian *Motivation*. That is the weak version. The strong version (which you are grappling with) attacks Utilitarian *Normativity*.

  *   **Sam is defending:** "Utilitarianism is compatible with a healthy human psychology." (True, via indirect utilitarianism).
  *   **You are attacking:** "Utilitarianism is incompatible with the first-personal authority of moral agents." (Also True, per Williams).

  **The Verdict:**
  You are both right about different things. Sam is right that a utilitarian can function without being a psychopath. You are right that a utilitarian cannot function without viewing their own integrity as contingent.

  **To win (or at least advance):**
  Concede the psychological point to Sam. Say: *"Okay, I agree the utilitarian doesn't need to carry a calculator. But my objection is that the utilitarian must carry a 'shadow calculator' in their theory of value. They must believe their love is only valuable because it pays dividends. That belief itself is the destruction of integrity, even if they aren't consciously thinking it while jumping in the water."*

  If Sam denies that the *belief* matters, only the *action*, they are moving toward a behaviorist definition of morality that most people find unsatisfying. If they admit the belief matters, they have to explain how one can genuinely love someone while believing that love is only justified by impersonal outcomes. That is the knot Williams tied, and it's much harder for Sam to untie.
