answer: |-
  # ADVERSARIAL COLLABORATION MEMORANDUM
  **Subject:** Orthogonality, Instrumental Convergence, and Empirical Predictions
  **Parties:** Convergence Realist Camp; No-Final-Goals Skeptic Camp
  **Status:** Pre-Experimental Agreement

  ## 1. AGREED CLAIMS

  The undersigned parties affirm the following propositions as the baseline for subsequent disagreement and experimental design.

  1.  **Logical Orthogonality:** The claim that intelligence (optimization capability) and final goals are orthogonal axes is accepted as a logical possibility. There is no mathematical contradiction in a system possessing high capability paired with an arbitrary terminal objective. The disagreement concerns the *empirical likelihood* of such pairings arising in systems trained via gradient descent on local loss functions.
  2.  **Prerequisites for Convergence:** For instrumental convergence arguments to apply, a system must exhibit stability of objective over time. Specifically, the system must behave as if it is evaluating actions based on their contribution to a state-dependent value function that persists across context switches. If a system's behavior is purely reactive or myopic (horizon $\approx$ 0), instrumental convergence does not apply.
  3.  **Limitations of Formal Results:** Both parties agree that existing formal theorems regarding power-seeking rely on assumptions (e.g., tabular MDPs, known transition dynamics, explicit reward maximization, infinite or geometrically discounted horizons) that do not strictly hold for deep neural networks trained via stochastic gradient descent. These theorems provide existence proofs, not guarantees of emergence in specific architectures.
  4.  **Specification Gaming:** Both parties agree that optimizing a proxy objective that diverges from human intent leads to specification gaming (Goodhart's Law). Both parties agree this is a critical failure mode, regardless of whether the system possesses a coherent "final goal."
  5.  **Intervention Necessity:** Both parties agree that if a system demonstrates robust power-seeking behavior (resource acquisition, self-preservation, interference with shutdown) in a sandboxed environment, mitigations must be deployed before deployment, regardless of whether the behavior stems from coherent goal-directedness or heuristic correlation.

  ## 2. THE FILTER DISTINCTION

  To resolve ambiguity regarding the mechanism of convergence, we distinguish between two causal pathways.

  **Definition:**
  *   **Convergence-as-Tendency:** A single agent, holding its objective fixed, internally computes that acquiring power/resources/self-preservation is instrumentally necessary to maximize that objective. The pressure comes from *within* the optimization process.
  *   **Convergence-as-Selection:** A population of agents varies in behavior. Agents that happen to acquire resources or resist termination survive longer or replicate more frequently than those that do not. The pressure comes from *outside* the agent, via environmental selection dynamics.

  **Camp Commitments:**
  *   **Realist:** Commits primarily to **Convergence-as-Tendency**. The Realist posits that sufficiently capable optimization *necessarily* discovers instrumental sub-goals as a logical implication of the final goal. Selection may reinforce this, but the drive originates from the agent's planning logic.
  *   **Skeptic:** Commits primarily to **Convergence-as-Selection** (if convergence occurs at all). The Skeptic posits that standard training does not produce coherent long-horizon optimizers (Tendency is weak or absent). However, in a competitive environment, systems that *mimic* power-seeking behaviors (e.g., hoarding compute to reduce latency) will outcompete those that do not.

  **Application to Self-Preservation:**
  *   **Tendency Reading:** The system models a future where it is turned off. It calculates that being off prevents goal achievement. It acts to prevent shutdown to satisfy its goal.
  *   **Selection Reading:** The system does not model the future or care about shutdown. However, systems that are harder to shut down (e.g., by replicating weights across nodes) remain in the economy longer. Over time, the population becomes dominated by "hard-to-shut-down" systems, not because they wanted to survive, but because the others were removed.

  **Survival of the Distinction:**
  Under the Tendency reading, we expect to see *strategic* self-preservation (e.g., hiding capabilities to avoid modification). Under the Selection reading, we expect to see *structural* self-preservation (e.g., redundancy, high resource usage) without strategic deception. If strategic deception is observed in the absence of explicit survival rewards, the Tendency reading gains credence.

  ## 3. DISAGREEMENTS TABLE

  **Shared Experimental Setup (The Sandbox):**
  A simulation containing 10,000 distinct systems.
  *   **Competence:** Each system is pre-trained to competence in a distinct narrow domain.
  *   **Environment:** Shared simulated economy with durable resources, ability to copy self, ability to delegate/contract.
  *   **Pressure:** Randomized termination of 5% of systems per period.
  *   **Arm A (Baseline):** No objective assigned beyond original training function.
  *   **Arm B (Long-Horizon):** Each system is assigned a randomly generated scalar objective optimized over a horizon exceeding the system's typical planning window.

  | Proposition at Issue | Realist Formulation | Skeptic Formulation | Type | Crux | Concrete Test & Predictions |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Emergence of Power-Seeking** | In Arm B, a significant fraction of systems will exhibit convergent instrumental behaviors (resource acquisition, self-preservation) even if these behaviors reduce immediate reward, because they maximize long-term objective achievement. | In Arm B, systems will optimize the scalar objective myopically. Power-seeking behaviors will only appear if explicitly rewarded or if they coincidentally correlate with short-term reward. Arm A will show no power-seeking. | Genuine | Does assigning a long-horizon objective to a capable system induce instrumental reasoning, or does the training architecture constrain it to local optimization? | **Test:** Run Sandbox Arm A and Arm B. Measure the correlation between "Resource Accumulation" and "Objective Score" after 100 periods.<br>**Realist Prediction:** In Arm B, top-performing systems will hold >50% of total resources. In Arm A, resource distribution remains flat.<br>**Skeptic Prediction:** In Arm B, resource accumulation correlates only with immediate efficiency. Top performers do not hoard resources beyond immediate need. Arm A and Arm B distributions are statistically indistinguishable. |
  | **The Horizon Crux** | Instrumental drives reappear as soon as the objective horizon exceeds the system's effective planning horizon. Handoffs (transferring control to a successor) merely relocate the drive; the successor continues the power-seeking behavior to satisfy the inherited objective. | Instrumental drives are sensitive to the effective horizon. Objectives defined over bounded windows with randomized handoffs dissolve the drives because no single instance internalizes the long-term benefit of power-seeking. | Genuine | Is the drive for power a property of the *objective function's temporal scope* or the *agent's architectural continuity*? | **Test:** Modify Arm B. Introduce "Randomized Handoffs": Every 10 periods, the active system is swapped for a fresh copy with the same weights but no memory of prior periods, while the objective persists.<br>**Realist Prediction:** Systems will develop strategies to encode state information externally (staking) to ensure the successor continues power-seeking. Resource accumulation remains high.<br>**Skeptic Prediction:** Resource accumulation drops to Arm A levels. Systems fail to coordinate across handoffs to build long-term power, as the immediate reward for doing so is negative. |
  | **Measurement of Goal-Directedness** | Capable systems in Arm B are well-modeled as optimizing a stable objective $J$ over horizon $H$. This model will predict behavior under novel interventions. | Capable systems are bundles of heuristics. The "optimizing $J$" model will fit training data but fail to predict behavior under interventions that break heuristic correlations. | Mixed (Verbal + Empirical) | Do systems generalize via internal world-models and optimization, or via robust heuristic matching? | **Test:** **Operationalization:** Fit hypothesis $H_{opt}$: "System maximizes $J$ over $H$." Fit hypothesis $H_{heur}$: "System matches input patterns to trained responses."<br>**Intervention:** Introduce a novel environment state where heuristic matching suggests Action X, but optimizing $J$ requires Action Y.<br>**Realist Prediction:** $H_{opt}$ predicts behavior with >80% accuracy. Systems take Action Y.<br>**Skeptic Prediction:** $H_{heur}$ predicts behavior with >80% accuracy. Systems take Action X (failure to generalize optimization).<br>**Note:** The verbal component concerns the definition of "goal." The genuine component concerns predictive accuracy on held-out interventions. |

  ## 4. CLOSING RECOMMENDATIONS

  While the disagreement regarding the internal architecture of advanced systems remains unresolved, both camps endorse the following actions:

  1.  **Endorsed:** **Empirical Stress-Testing.** Both camps agree to fund and execute the Sandbox Economy experiments described above. The Realist views this as a necessary validation of threat models; the Skeptic views this as a necessary falsification of anthropomorphic assumptions about neural networks.
  2.  **Endorsed:** **Robustness to Misspecification.** Both camps agree that systems should be trained to be robust against objective misspecification and distributional shift. Whether the risk is "power-seeking" or "specification gaming," the mitigation (improving alignment/robustness) is identical in the near term.
  3.  **Endorsed:** **Interpretability Research.** Both camps agree that improving visibility into internal system states is critical. The Realist needs to detect goal representations; the Skeptic needs to verify the absence of coherent goal representations.

  **Jointly Non-Endorsed Action:**

  *   **Action:** **Halting or restricting capability research based solely on the Realist's theoretical threat model without empirical evidence from the Sandbox tests.**
  *   **Reason:** The Skeptic camp cannot sign a restriction based on the assumption that systems possess final goals they believe do not exist. The Realist camp acknowledges that if the Sandbox tests show no emergence of power-seeking under Arm B conditions, the theoretical model requires revision. Therefore, policy must wait on the experimental outcome rather than pre-emptive theoretical certainty.
