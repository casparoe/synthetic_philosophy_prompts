answer: |-
  ### Basis of Preparation Memorandum

  **Reporting Entity:** The British Raj (consolidating East India Company and Crown periods).
  **Reporting Period:** 1757–1947 (Final period-end at Partition/Independence).
  **Basis of Accounting:** Accrual basis, historical cost.
  **Going Concern vs. Liquidation:** For the Raj entity, the **liquidation basis** is appropriate for the 1947 period-end, as the entity ceased to exist. However, the underlying operational assets (India) continued as a **going concern**. This creates a discontinuity: the Raj's final statements reflect a breakup value, while the successor entity (India) inherits the carrying amounts adjusted for sovereign risk.
  **Ownership & Attribution:** Ultimate beneficial ownership shifted from EIC shareholders to the British Crown/Public. This represents a change in control with significant **related-party implications**. Performance attribution (Brinson model) is required to separate **selection effects** (imperial policy decisions) from **allocation effects** (secular global industrial trends) when assessing legacy value.
  **Counterfactuals:** The framework lacks a standard for alternative historical scenarios (pro forma budgets are forward-looking, not backward-looking alternative histories).

  ### Audit Translation: Ferguson vs. Tharoor Claims

  | claim | accounting rendering | fidelity | residue note |
  | :--- | :--- | :--- | :--- |
  | **Ferguson 1:** Railways and telegraphs created lasting asset value that modernized the economy. | Capital expenditure (IAS 16) recognized as Property, Plant & Equipment, generating future economic benefits beyond the reporting period. | clean | Ignores whether the cost of capital exceeded the internal rate of return for the local minority interest. |
  | **Ferguson 2:** Rule of law and institutions reduced transaction costs and risk premiums. | Recognition of internally generated intangible assets (goodwill/brand) lowering the discount rate applied to future cash flows. | distorted | IFRS prohibits capitalizing internally generated goodwill; value is implied via risk adjustment rather than asset recognition. |
  | **Ferguson 3:** Integration into global markets increased trade efficiency and revenue potential. | Revenue recognition (IFRS 15) showing increased volume and velocity of transactions due to market access synergies. | clean | Treats revenue growth as inherently positive without adjusting for terms of trade deterioration or extractive pricing. |
  | **Ferguson 4:** Modernization was due to imperial policy, not just secular industrial trends. | Performance attribution (Brinson): Positive active return driven by selection (policy) rather than allocation (market beta). | distorted | Cannot isolate selection effects from allocation effects with sufficient reliability to audit standards without a control group. |
  | **Tharoor 1:** Indigenous textile industries were destroyed, reducing productive capacity. | Impairment loss (IAS 36): Carrying amount of indigenous manufacturing assets exceeded recoverable amount due to external policy constraints. | clean | Assumes the counterfactual carrying amount (without Empire) would have been maintained or grown, which is unverified. |
  | **Tharoor 2:** Grain was exported during famines, prioritizing external claims over local survival. | Related-party transactions (IAS 24): Inventory transferred to owners below fair value or despite impairment indicators of biological assets. | distorted | Accounting treats grain as inventory; it cannot capitalize human life or record famine mortality as a cost of sales. |
  | **Tharoor 3:** Wealth was systematically drained to Britain via taxes and home charges. | Related-party outflows: Significant cash flows to ultimate owners (dividends/home charges) exceeding capital injected into the entity. | clean | Classifies sovereign extraction as a dividend rather than an expense, obscuring the impact on the entity's net assets. |
  | **Tharoor 4:** Conquest and maintenance involved violence and coercion not reflected in costs. | Unrecognized contingent liabilities (IAS 37): Potential obligations arising from past events not recorded due to measurement uncertainty. | no expression | Human suffering and coercive violence are externalities with no measurable financial outflow required by the entity. |

