      Ursula K. Le Guin's story about the city of Omelas has become a shorthand in modern arguments about complicity. People invoke it when discussing climate change or supply chains to claim that ordinary consumers cause harms they never touch. These arguments lean on a metaphysical claim that a person can cause an outcome merely by not doing something. To take this seriously, we must ask whether the citizens of Omelas are causes of the child's misery given that what each of them does is fail to act. There are two standard ways to handle this. The first complaint is that an absence is not the sort of item that can stand in a causal relation at all. A cause usually has a location, a duration, a mechanism and something to push against. The citizen sitting at the concert has no physical connection to the child in the basement. Nothing flows from the citizen to the child. On this mechanistic view, the jailer causes the misery, the lock causes the confinement, but the bystander causes nothing. Their staying home is just a background condition, like the air in the room, necessary perhaps but not a cause.

      The second way is the counterfactual treatment, which swaps mechanism for dependence. This view says that had this citizen gone down and brought the child up, the misery would have ended, at the cost of everything else the city enjoys. Because the outcome depends on the action not being taken, the inaction counts as a cause. This view fits the moral intuition many readers bring to the story. It makes the citizens responsible. However, the story's own terms favour the dependence view only at a high cost. The shape of the case is that each citizen is individually such that, had they acted, the outcome would have been different. So on the dependence view everyone is an actual cause, while the outcome arrives regardless of what any one of them does. This is not necessarily a defect in the dependence view but merely a feature of it, known as overdetermination. Yet the story pushes you towards a notion of actual causation that does work beyond dependence. If everyone is a cause, the word cause loses its power to distinguish the jailer from the festival-goer. The mechanistic view preserves that distinction but lets the citizens off the hook entirely.

      Consider two variations that separate the theories in a way the story itself does not. In the first, change the bargain in one respect only. Suppose the city requires that some child or other be kept in misery, and that any citizen who freed this child would simply see another installed in its place. Here no individual's failure makes a counterfactual difference to whether a child suffers at all. Does the dependence view now let everyone off? Yes, strictly speaking. If I save this child and another is taken, the general fact of suffering does not depend on my inaction. The view that absences cannot be causes does no better, since I still pushed nothing. The gap between this variant and Le Guin's actual story shows that causation by omission is hostage to how the counterfactuals happen to be arranged. If the magic bargain were slightly different, my causal status would vanish even though my moral situation feels identical. This suggests that causation is not simply what it is, but depends on fragile external facts about replacement mechanisms.

      In the second variation, attend to the timing. The young people are not told until they are old enough, and the visit is the moment at which they acquire both knowledge and, presumably, an opportunity. Does an omission begin only when the agent could have known what was at stake? If so, the causal relation appears to switch on with a change in someone's beliefs rather than in the world. This is a strange result. It implies that the child's suffering was caused by the citizens only after the adolescents learned the secret. Before that visit, the citizens were physically identical in their behaviour, but causally innocent. Does ignorance excuse causation as well as blame? The story makes the visit the hinge of the whole thing, suggesting it is less a claim about physical causation than about the conditions under which failures can be causes. It implies that without knowledge, the inaction is merely a state of affairs, but with knowledge, it becomes a choice.

      Finally, there are the ones who walk away. They do not rescue the child, nothing about the outcome changes, and on one description they are omissive causes like anyone else. On another, something has genuinely altered, since they no longer consent and no longer participate. Perhaps the right account of the citizens' role all along was not omission but participation in a practice that reproduces the misery. In that case, leaving changes their causal standing while leaving the outcome untouched. They cease to be part of the system that sustains the bargain, even if the system continues without them. This suggests the story is best read as showing that the causal question and the practical question come apart. Establishing that I cause a harm by my inaction may be the least useful thing I can learn, because it does not tell me whether to stay and fight or to walk. The lens fails where it tries to map moral responsibility onto physical causation. Le Guin withholds everything a causal theorist needs. There is no mechanism, no institution, no account of how the bargain operates, and a narrator who professes she cannot suit every reader. The dependence is stipulated rather than explained.

      Is the case too thin to do metaphysical work, or does its thinness reveal that our judgements about omissions rest on features no theory has yet isolated? The story suggests the latter. By making the reader's own verdict part of the exercise, it dramatizes something the argumentative literature misses. Attributions of causation by omission are doing expressive or normative work which a metaphysics of absences cannot underwrite. When we say the citizen causes the misery, we are not describing a physical push. We are marking them as complicit. The story works because it forces us to admit that our causal language is often a proxy for our moral demands. We want the citizens to be causes because we want them to be responsible. If they are not causes, our blame lacks a foothold. The ones who walk away understand this. They do not try to fix the causation. They remove themselves from the judgment. In the end, the story is not about whether inaction can be a cause. It is about whether we can live with the kinds of causes we are willing to accept. The metaphysics of omission collapses into the ethics of participation. We call it causation because we need a word for the link between our comfort and their pain, even if that link is made of nothing at all.

