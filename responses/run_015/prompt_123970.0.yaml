          6.  Scope: Williams is attacking *all* universal morality, not just utilitarianism.
      *   **User's Skepticism:** The user heard Williams was mainly attacking utilitarianism specifically, not every moral theory.
      *   **Task:** Evaluate the accuracy of the roommate's summary, distinguish between "one thought too many" and "integrity objection," and assess whether the conclusion (universal morality is alienating) follows.

  2.  **Deconstruct Williams's Arguments (Mental Knowledge Retrieval):**
      *   **Source Material:** Primarily "A Critique of Utilitarianism" (in *Utilitarianism: For and Against*, 1973) and "Persons, Character, and Morality" (1981).
      *   **The Jim and the Indians Example:** Illustrates the integrity objection. Jim is asked to kill one Indian to save 19. Utilitarianism says kill the one. Williams says this makes Jim responsible for the deaths of the 19 if he *doesn't* kill the one, ignoring his own agency and integrity. It turns him into a channel for utilitarian satisfaction.
      *   **The Husband and Wife Example:** Illustrates "one thought too many." A man saves his wife from drowning. If he justifies it by saying "she is my wife," that's okay. If he justifies it by saying "in this instance, saving her maximizes utility," that's one thought too many.
      *   **Ground Projects:** These are commitments that give life meaning. Utilitarianism threatens these by demanding impartiality.
      *   **Target:** Williams is primarily critiquing *Utilitarianism* (and Kantianism to a lesser extent regarding the "moral ought"), but specifically the *impartiality* requirement inherent in modern moral systems. He isn't necessarily saying *no* universal ethics work, but that the specific structure of "the moral point of view" (impartial, agent-neutral) is problematic.
      *   **Partiality:** Williams defends partiality (projects, commitments) as essential to identity, but does he say it's the *only* genuine reason? He argues they are *necessary* for integrity, not necessarily that *only* they matter morally.

