answer: |-
  **Exam Question: Philosophy of Mind (Second Year)**
  **Time Allowed: 90 Minutes**

  **Question:**
  Classical functionalism asserts that mental states are defined by their causal roles rather than their physical constitution, implying that pain is multiply realisable across distinct substrates. Consider a scenario where a laptop running a 'pain programme' controls a robot body, exhibiting identical behavioural outputs to an octopus avoiding harm. Does the functionalist commitment to multiple realisability entail that the laptop feels pain, or does the octopus's biological constitution mark a necessary boundary for genuine sensation? Critically evaluate whether functionalism can distinguish between genuine phenomenal experience and clever input-output mimicry in this context.

  ***

  **Model Answer**

  Classical functionalism, championed by Putnam, defines mental states via their causal relations to inputs, outputs, and other internal states. Consequently, pain is not a specific neural firing but a functional role: typically caused by damage and causing avoidance behaviour. Under this liberal view, the laptop-robot system, if functionally isomorphic to the octopus, must possess the same mental states. The physical substrate—silicon versus biological tissue—is theoretically irrelevant; only the organisation of causal powers matters.

  However, this commitment invites the 'absent qualia' objection. Ned Block's 'Chinese Nation' thought experiment suggests that a system functionally equivalent to a mind might lack phenomenal consciousness. In the laptop scenario, the system processes information syntactically. While it mimics avoidance behaviour, there is no guarantee of 'what it is like' to be the laptop. The user's intuition that this is merely 'mimicry' aligns with Block's critique: functionalism captures the causal structure of cognition but fails to account for the qualitative feel of experience. The octopus, conversely, possesses a biological substrate capable of nociception grounded in evolutionary history and embodied interaction, which some argue is requisite for genuine sensation.

  Furthermore, psycho-functionalism attempts to refine classical functionalism by relying on empirical psychology rather than armchair analysis. Yet, even this struggles with the substrate issue. If the laptop's programme replicates the octopus's functional architecture down to the finest detail, denying it pain seems like 'biological chauvinism'. However, if the programme is merely a high-level simulation of behaviour without replicating the low-level causal mechanisms of nociception, the functionalist claim weakens. The distinction lies in whether 'functional role' includes internal physiological causation or merely behavioural disposition.

  Ultimately, the laptop-robot case exposes a rift within functionalism. A liberal functionalist must accept the laptop feels pain, risking counter-intuitive absurdity. A restrictive functionalist might argue that biological causation is part of the functional role itself, thereby excluding the laptop. However, this risks collapsing back into type-identity theory. The most robust response acknowledges that while functionalism explains the cognitive architecture of pain, it may require supplementation (perhaps via embodied cognition or neurophenomenology) to account for the 'causal business' of feeling. Thus, while the octopus and laptop may share functional states, only the octopus possesses the biological grounding necessary for phenomenal pain.

  ***

  **Marking Scheme (Total: 20 Marks)**

  **Grade Boundaries & Criteria**

  *   **First Class (17–20 Marks):**
      *   **Argument:** Explicitly distinguishes between *liberal* functionalism (substrate neutrality) and *restrictive* views (biological constraints). Does not treat functionalism as a monolith.
      *   **Philosophical Moves:** Engages deeply with the 'absent qualia' objection (e.g., Block) not just by name-dropping, but by applying it to the laptop/octopus contrast. Addresses the user's 'causal business' point by discussing whether internal physiological causation is part of the functional role.
      *   **Critical Evaluation:** Avoids the trap of simply contrasting functionalism with type-identity theory. Instead, critiques functionalism from within (e.g., psycho-functionalism vs. classical) or via phenomenology/embodiment.
      *   **Clarity:** Precise use of terminology (isomorphism, nociception, phenomenal consciousness).

  *   **Upper Second (14–16 Marks):**
      *   **Argument:** Clearly explains functionalism and multiple realisability. Correctly identifies that functionalism implies the laptop feels pain.
      *   **Philosophical Moves:** Mentions Block or the Chinese Room but may treat them as a blanket objection rather than analysing the specific substrate issue. Good discussion of behaviour vs. experience.
      *   **Critical Evaluation:** Recognises the tension but may rely slightly too heavily on the intuition that 'silicon can't feel' without sufficient philosophical justification.
      *   **Clarity:** Well-structured, British English spelling (realisable, programme), clear thesis.

  *   **Lower Second/Third (10–13 Marks):**
      *   **Argument:** Describes functionalism accurately but struggles to apply it to the specific scenario.
      *   **Mistakes:** Conflates functionalism with behaviourism (focusing only on output). Falls into the trap the question warns against: spending half the essay explaining Type-Identity Theory instead of analysing the limits of multiple realisability.
      *   **Critical Evaluation:** Fails to distinguish between mimicry and genuine state attribution philosophically.
      *   **Clarity:** Disorganised or significant spelling/grammar errors.

  **Specific Differentiators (A vs. B)**
  *   **The 'Trap':** A **B** answer explains why functionalism *allows* multiple realisability. An **A** answer explains why multiple realisability might *fail* to capture consciousness in non-bological substrates.
  *   **The Substrate:** A **B** answer says 'biology matters'. An **A** answer explains *why* it might matter (e.g., embodied cognition, causal powers vs. syntactic processing).
  *   **The Conclusion:** A **B** answer concludes 'we don't know'. An **A** conclusion takes a stance on whether functionalism needs revision or replacement to handle qualia.
