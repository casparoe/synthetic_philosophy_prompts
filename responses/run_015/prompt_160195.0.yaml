answer: |-
  **DURABLE POWER OF ATTORNEY FOR EPISTEMIC CREDENCES**

  **KNOW ALL MEN BY THESE PRESENTS:** That I, the undersigned **PRINCIPAL** (hereinafter "Current Self"), do hereby appoint my temporal successor (hereinafter "Future Self" or "Agent") as my true and lawful Attorney-in-Fact for the management, adjustment, and calibration of doxastic states regarding Proposition *A*.

  **1. Appointment and Acceptance.**
  The Principal grants the Agent full authority to update credence functions according to evidence acquired between time *t* and *t+Δ*. The Principal agrees to treat the Agent's future credence values as authoritative evidence regarding the truth value of *A*, subject to the conditions herein.

  **2. The Reflection Mandate.**
  The Principal shall set their current credence in *A*, conditional on the Agent holding a specific credence *r* in *A*, equal to *r*. Formally: $C_t(A | C_{t+Δ}(A) = r) = r$. Failure to align current conditional credences with anticipated future credences constitutes a breach of epistemic fiduciary duty.

  **3. Discretization of Credence Space.**
  Acknowledging that the event $C_{t+Δ}(A) = r$ possesses measure zero in continuous probability spaces, the parties agree to round all credence values to the nearest hundredth (0.01). Conditionalization shall proceed upon the event that the Agent's credence falls within the bin $[r - 0.005, r + 0.005]$. Any dispute regarding granularity shall be resolved in favor of the coarsest partition preventing singularities.

  **4. Exceptions for Epistemic Incapacity.**
  The Principal is not bound to defer to the Agent if the Principal currently assigns high probability to the Agent's cognitive impairment. This includes, but is not limited to, intoxication, sectarian conversion, fatigue, or the forgetting of relevant evidence known at *t*. Deference is waived if the Principal believes the Agent's updating rule is divergent from Bayesian conditionalization.

  **5. Static Credence Exemption.**
  The Principal shall be deemed in full compliance with this Instrument if the Principal's credence in *A* remains unchanged across all time indices. A Dogmatist who refuses to update shall satisfy the Reflection Mandate trivially, provided their stubbornness is consistent. No liability accrues for failure to learn.

  **6. No Retroactive Liability.**
  This Instrument binds the Principal to the Future Self only. The Principal assumes no duty to defer to Past Selves. The Principal acknowledges that Past Selves may have been ignorant, and no Dutch Strategy shall be constructed based on prior credence states that lacked current evidence.

  **7. Schedule of Damages.**
  In the event of breach, wherein the Principal's conditional credences fail to match the Agent's actual credences, the Principal agrees to pay Liquidated Damages. Damages shall be calculated as the maximum sure-loss exposure achievable by a hostile Bookie constructing a Dutch Strategy against the Principal's incoherent betting quotients across *t* and *t+Δ*. Payment is due immediately upon exploitation.

  **IN WITNESS WHEREOF**, I have hereunto set my hand this day, trusting that I shall remain rational enough to honor it.

