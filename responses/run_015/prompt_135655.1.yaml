  Write a three-month summer research proposal (approximately 1,500 words) for a philosophy-of-science workshop fellowship. The core idea is that the debate between Lewis-style counterpart theory and essentialist transworld identity has been fought almost exclusively over individual objects and persons, but collective entities—scientific research programs, ecological communities, distributed cognitive architectures—have parts that can turn over entirely. This exposes a gap: counterpart relations become arbitrarily permissive for collectives (any rearranged part-set can be a counterpart), while essentialist identity requires essential members that these entities plausibly lack. I want to ask whether a precise "structural-continuity" criterion for collective persistence can avoid both pitfalls.

  State the exact research question: what conditions must obtain for a collective entity in world W to be identical (not merely a counterpart) to one in world W*, and can those conditions be articulated without importing essentialist commitments about particular parts?

  Explain why existing positions leave this open—counterpart similarity was calibrated for individuals with intrinsic essential properties, not for entities constituted by relational and functional roles. Outline the method: conceptual analysis of collective persistence across three domains (research programs, ecological assemblages, institutional architectures), identifying hard cases where parts are fully replaced but structure is preserved; then construct and defend the structural-continuity criterion, showing it delivers determinate verdicts where the two standard views disagree or fall silent.

  Specify what counts as success (a precise, non-collapsing criterion with clear verdicts in boundary cases) and what counts as failure (the criterion reduces to counterpart similarity or smuggles in essential parts, or applies only to gerrymandered examples). Give an honest scope assessment for a three-month project, including which part is likely to run over and what deliverable (a polished draft chapter or workshop paper) is realistic.

  Do not include a bibliography, reading list, or citations—I will supply those. Do not ask me to quote specific passages.

  After the proposal text, provide a brief structured summary as a JSON object with exactly these fields: "research_question", "gap_in_standard_debate", "proposed_criterion", "method_domains", "success_condition", "failure_condition", "scope_assessment", and "deliverable".
