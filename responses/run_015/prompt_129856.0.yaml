prompt: |-
  Here is an argument I have been turning over in a workshop on population axiology, and I now find it suspicious because its conclusion is far more destructive than anything I meant to defend.

  (1) Dominance: if world W contains exactly the same individuals as world V, and each individual in W has well-being at least as high as in V with at least one strictly higher, then W is better than V.

  (2) To block the repugnant conclusion—that a vast world of lives barely worth living is better than a smaller world of excellent lives—we must reject total-utilitarian aggregation and adopt some form of averaging across individuals.

  (3) Averaging is not essentially about worlds; it applies to any closed collection of well-being-bearing entities over which we can compute a mean.

  (4) A human life, on a standard four-dimensionalist metaphysics, is not a point but a spatiotemporally extended object composed of temporal stages, each stage carrying some well-being value.

  (5) Therefore, if extending life L with n additional years of welfare just barely above zero lowers the mean well-being across all stages of L, then the extended life L+ is worse than L by the very averaging standard in (2).

  (6) For any life whose current mean welfare is only modestly positive—say, because suffering and flourishing roughly cancel, leaving a thin positive residue—there exists such a destructive extension: add enough barely-positive years and the life-mean falls.

  (7) Most actual human lives satisfy the condition in (6).

  (8) Hence, by (5)-(7), extending most lives with ordinary, barely-pleasant years makes those lives worse.

  (9) The same structure applies to reproduction: adding a child with barely-positive welfare lowers the world-mean of well-being, so by (2) we should reproduce only if the child’s welfare would be excellent.

  (10) But if we must reject (9)—and indeed (8)—while retaining (2), then we need a principled reason why averaging applies across individuals within a world but not across stages within a life, and that reason cannot be ad hoc.

  If I have to choose, I would keep (1) and (2). Which step should I reject, and what does rejecting it cost? Is the flaw a hidden equivocation in (3) or (5), an unjustified empirical slide in (6) or (7), or is the argument actually valid, in which case the real price is paid by abandoning either averaging or four-dimensionalism about lives?
reasoning: |-
  Here's a thinking process that leads to the suggested analysis:

  1.  **Deconstruct the Argument:**

      *   **Premise (1) Dominance:** Standard Pareto principle for identical populations. (Generally accepted).
      *   **Premise (2) Averaging:** To avoid the Repugnant Conclusion (RC), we need averaging, not total utilitarianism. (Common move in population ethics).
      *   **Premise (3) Scope of Averaging:** Averaging applies to *any* closed collection of well-being entities, not just "worlds." (This is the crucial bridge).
      *   **Premise (4) 4Dism:** Lives are composed of temporal stages with well-being. (Metaphysical claim).
      *   **Conclusion (5):** Extending a life with low-positive welfare stages lowers the life-mean, making the extended life worse. (Derived from 3 & 4).
      *   **Conclusion (6):** For lives with modest mean welfare, enough low-positive extension lowers the mean. (Mathematical claim).
      *   **Conclusion (7):** Most actual lives fit (6). (Empirical claim).
      *   **Conclusion (8):** Extending most lives with ordinary years makes them worse. (Derived from 5, 6, 7).
      *   **Conclusion (9):** Same logic applies to reproduction (adding a child lowers world-mean). (Derived from 2 & 3).
      *   **Conclusion (10):** We need a principled distinction between averaging across persons vs. across time-stages, or else accept (8) & (9).

      *   **User's Constraint:** Wants to keep (1) Dominance and (2) Averaging (to block RC).
      *   **User's Question:** Which step to reject? What is the cost? Is it an equivocation, empirical slide, or a deep metaphysical/axiological price?

  2.  **Analyze the Core Tension:**

      The argument is essentially a *reductio ad absurdum* against Average Utilitarianism (AU) when combined with Four-Dimensionalism (or even just the idea that time matters intrinsically to welfare). It mirrors the "Mere Addition Paradox" but applies it *intra-personally* across time rather than *inter-personally* across people.

      If AU says "Maximize average welfare of persons," and we treat "person-stages" as the units of welfare, AU implies "Maximize average welfare of person-stages." This leads to the conclusion that adding "meh" time to a life makes the life worse. This is often called the "Sadistic Conclusion" or a variant of the "Repugnant Conclusion for Lives."

  3.  **Evaluate Potential Rejection Points:**

      *   **Reject (1) Dominance:** User says no. (Also, Dominance is very strong intuitively).
      *   **Reject (2) Averaging:** User says no. (But this is the standard escape route: accept Total Utilitarianism and bite the bullet on RC, or go Critical Range, etc.).
      *   **Reject (3) Scope of Averaging:** This claims averaging is "general." If we reject this, we say AU applies *only* to persons, not person-stages.
          *   *Cost:* Needs a principled distinction between "persons" and "temporal stages." Why is the boundary of a skin/skull morally significant but the boundary of a year isn't? This risks arbitrariness.
      *   **Reject (4) 4Dism:** Claim lives are not sums of stages.
          *   *Cost:* Metaphysical revisionism. Even if 4Dism is false, welfare *does* accumulate over time. A 100-year life usually has more "welfare stuff" in it than a 1-year life. Denying the aggregative nature of time seems hard.
      *   **Reject (5) The Inference:** Does lower mean *necessarily* mean worse?
          *   *Cost:* If AU is true, lower mean *does* mean worse. To deny this is to deny AU.
      *   **Reject (6)/(7) Empirical Claims:** Maybe lives don't have modest means? Maybe extra years aren't barely positive?
          *   *Cost:* Empirically dubious. Many lives are mixed. Many extra years are just "okay."
      *   **Reject (9) Analogy:** Maybe reproduction is different from life-extension?
          *   *Cost:* Hard to justify without ad hocery.

  4.  **Identify the Strongest Candidate for Rejection:**

      The most philosophically robust move, given the constraint to keep (1) and (2), is to attack **(3)**.

      Why? Because (3) asserts that the *unit of averaging* is flexible or determined by metaphysics (4Dism). But Population Axiology usually fixes the unit of moral concern *normatively*, not metaphysically. The "Person" is the moral unit, not the "Person-Stage."

      However, simply asserting "Persons matter, stages don't" invites the charge of "Person-Affecting View" arbitrariness.

      A better rejection of (3) involves distinguishing between **Intra-personal Aggregation** and **Inter-personal Aggregation**.
      *   *Total Utilitarianism* aggregates across both time and people.
      *   *Average Utilitarianism* (as usually formulated) averages across *people*, but totals across *time within a life*.
      *   This is a hybrid view: **Total Welfare per Person, Average across Persons.**

      If we adopt this hybrid view, (2) is modified. We aren't doing pure averaging on all welfare-bearing entities. We are averaging *lifetime total welfare* across persons.

      *Does this block RC?* Yes, because adding a mass of people with low positive *lifetime* welfare lowers the average.
      *Does this block the Life-Extension Conclusion (8)?* Yes, because adding positive welfare years increases the *lifetime total* of that person, even if it lowers the *average per stage*. Since we care about lifetime total per person, the life gets better.

      So, the flaw is in **(3)**. It assumes that if you are an Averagist about populations, you must be an Averagist about temporal parts. But standard Average Utilitarianism is actually "Average Lifetime Welfare."

  5.  **Identify the Second Strongest Candidate (Metaphysical):**

      Reject **(4)** or the inference from (4) to (5).
      Even if 4Dism is true, welfare might not be a property of stages that sums up linearly. Welfare might be a property of the *narrative whole*.
      *Cost:* Complicates the measurement of welfare.

  6.  **Identify the "Deep Price":**

      If the user insists on Pure Averaging (Average welfare per *unit of experience*), they must accept (8). This is the "Repugnant Conclusion for Lives."
      If they want to avoid (8) while keeping Population Averaging, they must admit that the "Person" is a morally privileged container. This moves away from pure welfarism/consequentialism toward a **Person-Affecting View** or a **Priority View** restricted to persons.

  7.  **Structure the Response:**

      *   **Validate the Argument:** Acknowledge that this is a known and powerful objection to Average Utilitarianism (often discussed by Parfit, Blackorby, Donaldson, etc.). It shows AU is unstable.
      *   **Diagnose the Flaw:** The critical weak point is **(3)**. It conflates the *metric of evaluation* (average) with the *unit of moral concern* (persons).
      *   **Analyze the Rejection of (3):**
          *   Explain the "Hybrid View": Total within lives, Average across lives.
          *   Explain why this blocks the RC (inter-personal) but saves life-extension (intra-personal).
          *   Discuss the cost: It makes the boundary of the "person" morally magical (Non-Reductionist about Persons).
      *   **Analyze the Rejection of (4):**
          *   Deny that welfare is additive across time.
          *   Cost: Makes welfare measurement very difficult.
      *   **Analyze the Rejection of (2):**
          *   Even though the user wants to keep it, mention that this is the standard philosophical reaction. AU is widely considered untenable *because* of arguments like this (and the "Sadistic Conclusion").
          *   Suggest alternatives: Critical-Level Utilitarianism, Variable Value Views.
      *   **Conclusion:** The argument is valid. The price is high. To keep (1) & (2), you must bite the bullet on the "Personhood Privilege" (reject 3) or accept the destructive conclusion (8).

  8.  **Refine the Analysis (Self-Correction/Nuance):**

      *   *Wait, does Average Utilitarianism usually mean Average per Person or Average per Experience?* Standard AU in population ethics is Average *Lifetime* Welfare per Person.
      *   *If so, Premise (3) is false by definition of standard AU.* Standard AU does *not* average across temporal stages. It sums within lives, then averages across lives.
      *   *If the user defines AU as averaging across all welfare moments,* then they are advocating a specific, more radical version of AU.
      *   *The Argument's Power:* It forces the user to admit that their version of AU (implied by 3) is too radical.
      *   *The "Mere Addition" Parallel:* This is exactly the Mere Addition Paradox applied to time.
      *   *Recommendation:* The user should reject (3). The cost is accepting that "Persons" are fundamental units of moral accounting, not just containers of welfare. This conflicts with strict Impersonal Welfarism.

  9.  **Drafting the Response:**

      *   **Introduction:** Acknowledge the sophistication. This is the "Intrapersonal Repugnant Conclusion."
      *   **The Validity:** The argument is logically valid. If (1)-(4) hold, (8) follows.
      *   **The Pivot Point:** Step (3) is the equivocation.
      *   **Detailed Analysis of Rejecting (3):**
          *   Distinguish "Average Lifetime Welfare" (Standard AU) vs. "Average Momentary Welfare" (Radical AU).
          *   Standard AU blocks RC but allows life extension.
          *   Cost: Why is the person boundary sacred? (The "Non-Identity" problem resurfaces).
      *   **Alternative: Reject (2):**
          *   Most axiologists do this. Critical-Level Utilitarianism is the standard fix.
      *   **Alternative: Reject (4):**
          *   Holism about welfare.
      *   **Final Verdict:** Reject (3). Accept that persons are morally relevant units, not just arbitrary collections of stages. This saves common sense but costs metaphysical parsimony.

  10. **Final Polish:** Ensure tone is respectful and analytical. Use standard terminology (Mere Addition, Sadistic Conclusion, Non-Reductionism). (Self-check: Did I address the user's constraint to keep 1 & 2? Yes, by showing how to keep them by modifying the interpretation of 2 via rejecting 3).

