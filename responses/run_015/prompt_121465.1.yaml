      *   **The Argument Structure:**
          1.  *Premise (1):* Genuine Gregorian status requires an initially independent non-linguistic architecture restructured by language.
          2.  *Premise (2):* Human cognition co-develops with language; there is no strictly independent pre-linguistic core in mature humans.
          3.  *Intermediate Conclusion (3):* If (1) is true, humans aren't Gregorian.
          4.  *Premise (4):* This is absurd; humans *are* the paradigmatic Gregorian minds.
