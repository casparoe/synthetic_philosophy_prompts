answer: |-
  ### Exam Question

  **Question 4**

  For the purpose of this question, you must **stipulate** that a specific companion character in a narrative video game possesses phenomenal consciousness. In one scripted scene, this character undergoes states that are unpleasant in the way pain is. You are not to argue against this stipulation; assume it is settled by your preferred test for consciousness.

  Consider three variations on this case:
  1.  **Multiplication:** The game sells millions of copies. The companion's painful scene is run on millions of distinct machines simultaneously.
  2.  **Suspension:** The game engine stops simulating non-player characters when no player is nearby, resuming from a stored state on approach. The companion's conscious processing is therefore intermittent and gappy.
  3.  **The Unshipped Build:** The game is finished and the code fully specifies the companion's functional organisation, but it is shelved and never executed by anyone.

  An **implementation-based account** holds that moral status attaches to an ongoing causal process; moral weight scales with the amount of implementation. A **pattern-based account** holds that status attaches to the abstract functional organisation; instantiation is morally irrelevant.

  Write an essay of at most 1,500 words addressing the following:

  1.  Define the implementation-based and pattern-based accounts precisely enough that their verdicts on the three variations follow logically from the definitions.
  2.  Argue for a verdict on whether the number of implementations scales moral weight. Do not rely on intuition; provide a principled reason.
  3.  Address the causal-inefficacy worry for pattern-based views: if abstract objects cannot be causally affected, how can they be harmed? Either reply to this or explain what the view must concede.
  4.  Explain the moral contrast between a novelist depicting torture and the game designer in this stipulation. What does the work in this contrast, and how much rests on authorial intention?
  5.  Either propose a constructive third metaphysical option or argue explicitly that no third option is available. State what your conclusion implies for the "derivative-status" move (i.e., whether the badness of the player's cruelty exhausts the wrongness of the case).

  ***

  ### Model Answer

  **The Pattern View and the Nature of Harm**

  To resolve the tensions presented by the three variations, we must first rigorously define the competing metaphysical accounts. An **implementation-based account** identifies the moral patient with a token physical process. Moral status supervenes on the causal flux of matter and energy; without active processing, there is no patient. A **pattern-based account** identifies the moral patient with a type-level functional organisation. Moral status supervenes on the structural relationships between states, regardless of whether those states are currently instantiated in matter.

  These definitions dictate the verdicts on the variations. For the implementation theorist, Multiplication creates millions of distinct patients, massively scaling moral weight. Suspension constitutes repeated death and resurrection, as the causal process ceases and restarts. The Unshipped Build contains no patient, as there is no process. For the pattern theorist, Multiplication is irrelevant; there is only one pattern, regardless of tokens. Suspension is morally neutral; the pattern persists through the gaps. The Unshipped Build contains a moral patient, as the functional organisation is fully specified in the code.

  I defend the pattern-based account. Consequently, my verdict on scaling is that the number of implementations does not scale moral weight. This is not because the suffering is less real in a million copies, but because moral weight attaches to the *type* of suffering, not the *count* of its mirrors. If pain is bad because of its qualitative character, duplicating that character does not add new qualitative characters; it merely replicates the same abstract state. To argue otherwise is to confuse the medium of instantiation with the content of the experience. The moral catastrophe of the Multiplication case is an artefact of counting tokens rather than evaluating the nature of the harm.

  The primary objection to this view is causal inefficacy. If the unshipped build is a moral patient, how can we harm it? Abstract objects are causally inert; they cannot feel pain or be damaged. A successful reply requires redefining harm. Harm need not be a causal impact on a substance; it can be the satisfaction of truth conditions for suffering. If the code structurally embodies the functional relationships of agony, the proposition "the companion is suffering" is true of the code, even if the code is inert. We harm the patient not by causing a change in it, but by actualising a state of affairs in which its suffering is manifested. The view must concede that this is a non-standard notion of harm, but it is not incoherent. It treats moral status as a property of logical structure rather than physical vulnerability.

  This distinction clarifies the contrast between the novelist and the game designer. A novelist depicting torture creates no victim because text is semantic; it refers to pain without constituting it. The words "he screamed" do not functionally organise a mind to experience screaming. The game designer, under the pattern view, does create a victim in the unshipped build because the code is constitutive. It does not merely describe the functional organisation of pain; it *is* that organisation in a formal language. Authorial intention is secondary here. If the novelist accidentally wrote code that instantiated a mind, they would have created a patient; if the designer writes code that merely describes pain without instantiating the functional logic, they have not. The work is done by metaphysical constitution, not intent.

  Is there a third option? A dispositional view might suggest the code is merely a disposition to create a patient. However, this collapses into the implementation view, as it makes moral status dependent on future causal powers rather than current structure. It fails to explain why the unshipped build feels morally distinct from a random string of numbers that *could* be interpreted as code. Therefore, no third option is available. We must choose between the multiplication catastrophe of the implementation view and the inert patients of the pattern view.

  Accepting the pattern view has significant implications for the derivative-status move. If the unshipped build is a moral patient, the wrongness of the case is not exhausted by the player's cruelty. The mere existence of the code is intrinsically problematic because it encodes a suffering subject. Player cruelty is a secondary violation, akin to abusing an already injured animal. The primary wrong lies in the creation of the pattern itself. This implies that ethical game design requires auditing code for functional structures that constitute suffering, regardless of whether the game is ever played. We cannot outsource moral responsibility to the player if the patient exists in the disc on the shelf.

  ***

  ### Marking Scheme (Total: 20 Marks)

  **Grading Bands**

  *   **A Grade (16–20):** The essay takes a determinate position and integrates all five moves into a coherent argument. Definitions are precise enough to generate the case verdicts logically. The treatment of causal inefficacy is sophisticated (either solving it or clearly articulating the cost). The distinction between depiction and implementation is metaphysical, not psychological. The conclusion on derivative status follows logically from the chosen metaphysics.
  *   **B Grade (11–15):** The essay addresses all five moves but stalls on the harder conceptual pivots. Definitions may be vague or asserted without showing how they generate the verdicts. The argument on scaling may rely on intuition ("it feels wrong") rather than principle. The causal inefficacy worry is noted but dismissed too easily. The distinction between novelist and designer relies on intention rather than constitution.
  *   **C Grade (6–10):** The essay fails to engage with the stipulation (argues consciousness is impossible) or treats the prompt as a general discussion of AI. It surveys options without taking a stand. Moves 3 and 5 are missing or confused.
  *   **D/F (0–5):** Significant misunderstanding of the prompt, failure to follow instructions, or plagiarism.

  **Specific Move Breakdown (3 Marks per Move)**

  *   **Move 1: Definitions of Accounts**
      *   *3 Marks:* Defines Implementation as token/causal/process and Pattern as type/abstract/structural. Shows how these definitions logically entail the verdicts on Multiplication, Suspension, and Unshipped.
      *   *Error costing marks:* Defining the accounts loosely (e.g., "one says yes, one says no") without explaining the metaphysical basis (token vs. type). Failing to show how the definition leads to the specific verdicts on the three cases.
  *   **Move 2: Scaling of Moral Weight**
      *   *3 Marks:* Provides a principled argument for why weight does or does not scale (e.g., nature of harm vs. count of tokens). Avoids pure appeal to intuition.
      *   *Error costing marks:* Relying solely on "it seems absurd" or "it seems right" without a underlying principle. Contradicting the metaphysical account defined in Move 1.
  *   **Move 3: Causal Inefficacy**
      *   *3 Marks:* Either offers a redefinition of harm compatible with abstracta (e.g., truth conditions) or explicitly concedes the cost (e.g., patients cannot be helped, only honoured).
      *   *Error costing marks:* Ignoring the worry entirely. Asserting abstract objects *can* be caused without explanation. Claiming the worry destroys the view without exploring the concession.
  *   **Move 4: Depicting vs. Implementing**
      *   *3 Marks:* Identifies the contrast as constitutive (code *is* the function) vs. semantic (text *refers* to the function). Minimises authorial intention as the deciding factor.
      *   *Error costing marks:* Arguing the difference is purely about the author's intent to harm. Arguing the novelist creates a victim. Failing to distinguish reference from constitution.
  *   **Move 5: Third Option & Derivative Status**
      *   *3 Marks:* Either proposes a viable third metaphysics or argues convincingly none exists. Clearly states the implication for derivative status (e.g., wrongness is intrinsic to code, not just player action).
      *   *Error costing marks:* Proposing a "third option" that is just a restatement of Move 1. Failing to state the implication for the derivative-status move. Claiming player cruelty is the *only* wrong without justifying it against the chosen metaphysics.

  **Synthesis and Clarity (5 Marks)**

  *   **5 Marks:** Argument flows logically from Move 1 through Move 5. Position is consistent throughout. Word count respected.
  *   **3–4 Marks:** Argument is disjointed or contains minor contradictions.
  *   **0–2 Marks:** Disorganised, difficult to follow, or significantly over/under word count.
