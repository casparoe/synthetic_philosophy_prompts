answer: |-
  The ice in Kieran's glass had melted down to a single, lonely cube. Lena was swirling her gin, watching the lime wedge bob like a cork in a storm. The conference bar was finally thinning out, the hum of the HVAC filling the gaps where the crowd used to be.

  "So," Kieran said, leaning back into the booth leather. "You think Mara walks away from the neural mod clinic without making a choice? Or just that she can't make it *rationally*?"

  "Both, if rationality requires expected utility maximization," Lena said. "Look, if the mod rewires her capacity for emotional attachment—swaps it for synesthetic math-joy—she literally cannot know what she's trading. The pre-mod Mara lacks the phenomenal concepts to evaluate the post-mod outcome. It's not just ignorance; it's incommensurability."

  "Right, the standard Paul line," Kieran said, tapping his fingernail against the glass. "But here's where I think the panel skipped a beat. Everyone assumes the problem is *access*. I think the problem is *translation*."

  Lena raised an eyebrow. "Translation?"

  "Think about the testimony," Kieran said. "We usually say, 'Ask someone who's done it.' But if the modification is truly transformative, it doesn't just change what they feel; it changes what they *value*. They get value-reindexed. So when Post-Mod Mara says, 'This is wonderful,' she's using 'wonderful' in a vocabulary Pre-Mod Mara doesn't speak. Post-Mod Mara might value isolation and proof-joy over human connection. Her endorsement is actually misleading to the person standing at the counter."

  Lena paused, her glass halfway to her mouth. "The reverse authority problem."

  "Exactly. The authority of experience is undermined by the shift in evaluative standards. They aren't lying. They're just speaking a different normative language."

  "Okay," Lena said, setting the glass down a little too hard. "So testimony is out. Analogies are weak because nothing is like becoming a math-synesthete. If I accept your twist, Kieran, Mara isn't just facing a hard choice. She's epistemically stranded. She's locked in a room with no windows and you're telling her the door is open."

  "Stranded, yes. But not paralyzed," Kieran said. "You're assuming rationality requires previewing the outcome. I'm saying it requires following a robust structural rule."

  "Structural rule?"

  "Something that doesn't depend on first-person phenomenal access. Maybe it's a rule of maximal flexibility. Or a principle of cognitive growth. You don't choose based on *what* you'll value, but on maintaining the integrity of the agency that does the valuing."

  Lena leaned forward, elbows on the table. "But that's the trick, isn't it? If you strip out the phenomenal content—the actual *what it's like*—what are you optimizing? You're optimizing for... what? Continuity? Coherence? Those are structural properties, not values. Mara cares about whether she'll be *happy*, or whether she'll love her kids. If your structural rule tells her to take the mod because it expands her cognitive topology, but she ends up not caring about her kids anymore, did the rule serve her?"

  "It served the agent," Kieran said. "Look, if we demand phenomenal preview for every transformative choice, we freeze. We never have kids, we never move countries, we never take the job that changes us. We need a heuristic that works *without* the data."

  "But having a kid isn't like voluntary neural modification," Lena shot back. "That's the proxy reasoning gap. Analogies to partial transformations work when the core self remains stable enough to recognize the value. Here? You're admitting the post-mod agent is a different evaluator. So if I follow your structural rule, I might be preserving the *shell* of the agent while gutting the *content* of her life. Do your proxies preserve value content, or just behavioral patterns?"

  Kieran sighed, rubbing his temple. "They preserve the capacity to value. That has to be enough."

  "Does it?" Lena gestured with her hand, catching the edge of her glass. It tipped. Gin splashed across the table, soaking the panel program. "Shit."

  She grabbed a napkin, dabbing at the wet paper. Kieran watched her, didn't move to help immediately.

  "See," Lena said, blotting the ink as it ran. "I made a mess. I didn't mean to. I was focused on the argument. Now I care about the stain. Post-Mod Mara? Maybe she sees the fluid dynamics of the spill and feels joy. Maybe she doesn't care about the program at all. If your structural rule says 'maximize cognitive capacity,' she takes the mod. But if the mod makes her indifferent to the mess, indifferent to the apology she owes the barstaff... isn't that a loss? Even if she's happier?"

  "That's a value judgment from *your* current index," Kieran said softly. "You're privileging the current valuation of social norms over the potential valuation of mathematical beauty. Why is your current index the baseline for rationality?"

  "Because it's the only one I have!" Lena tossed the wet napkin onto the table. "And it's the one Mara has. If you tell her to ignore her current values because they won't survive the transition, you're asking her to commit suicide for the sake of a stranger who will inhabit her body."

  "Not suicide. Metamorphosis."

  "Semantics," Lena muttered. "If the thing that cares about the outcome doesn't exist yet, and the thing that exists now can't understand the outcome... Kieran, you've built a decision theory for ghosts."

  Kieran finally reached for his own napkin, sliding it over to her. "Maybe. But ghosts still have to decide whether to haunt the house or move on. Look, I'm not saying it's easy. I'm saying the 'reverse authority problem' proves we can't outsource the choice to testimony. And your incommensurability proves we can't calculate utility. So we're left with structure. It's not perfect. It's just the only bridge that doesn't collapse under the weight of the unknown."

  Lena looked at the soggy program. The word 'Transformative' was bleeding into illegibility.

  "A bridge to nowhere," she said, but she picked up the napkin he offered. "But you think Mara should walk across it."

  "I think she has to walk across something," Kieran said, signaling the bartender. "Standing on the bank doesn't keep her dry forever. The water rises either way."

  Lena sighed, wiping her hand. "Round two? If you're buying, I'll concede that structural rules are better than paralysis."

  "If I'm buying," Kieran smiled, "you have to concede that strandedness isn't the same as irrationality."

  "Deal," Lena said. "But I'm keeping the napkin. Evidence."

  "Of what?"

  "Of the mess," she said. "Something your post-mod self wouldn't care about."

  Kieran laughed, raising his empty glass. "We'll see."
