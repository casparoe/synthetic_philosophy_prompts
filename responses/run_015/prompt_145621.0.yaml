answer: |-
  There is a fundamental mischaracterization in your premise regarding the mechanics of supervaluationism. Correcting this definition is essential before addressing why the framework has not become dominant in formal semantics or computational linguistics, and what we should expect from linguistic corpora.

  ### 1. Correction: Supervaluationism Does Not Assign Intermediate Truth-Values

  The core claim of your premise—that supervaluationism assigns precise intermediate truth-values (akin to Bayesian credences) across the borderline range—is incorrect.

  **Supervaluationism** is designed to preserve classical logic while accounting for vagueness. It operates on the concept of **precisifications**. A vague predicate (like "tall") can be made precise in multiple admissible ways (e.g., "tall means over 6ft," "tall means over 5'11\"").
  *   **Super-True:** A sentence is super-true if it is true on **all** admissible precisifications.
  *   **Super-False:** A sentence is super-false if it is false on **all** admissible precisifications.
  *   **Indeterminate:** If a sentence is true on some precisifications and false on others, it has **no truth value** (a truth-value gap).

  Supervaluationism explicitly rejects intermediate truth-values (e.g., 0.5). It maintains a binary distinction between truth, falsity, and indeterminacy. The framework you are describing—assigning values between 0 and 1 to handle gradience—is **Degree Semantics** (or Fuzzy Logic), not Supervaluationism. Alternatively, if you are referring to uncertainty about which precisification is correct, you are describing a **Probabilistic** or **Bayesian** approach to vagueness, which is distinct from classical supervaluation theory.

  ### 2. Why Supervaluationism Is Not Dominant in Formal Semantics and Computation

  Even with the corrected definition, supervaluationism has not become the standard framework in formal semantics or computational models for several theoretical and practical reasons.

  **A. Complexity vs. Utility in Formal Semantics**
  While supervaluationism has been integrated into formal semantics (notably by Hans Kamp and David Lewis), it introduces significant complexity without always yielding better empirical predictions than classical model-theoretic semantics.
  *   **Logical Complications:** Supervaluationism validates classical tautologies (like the Law of Excluded Middle: "John is tall or John is not tall" is super-true even if "John is tall" is indeterminate). However, it fails to validate certain inference rules that hold in classical logic (e.g., conditional proof can fail). This makes the logic cumbersome for semanticists trying to model natural language inference.
  *   **The "Penumbra" Problem:** Supervaluationism treats all borderline cases as equally indeterminate. It cannot distinguish between a case that is "very borderline" and one that is "slightly borderline." Natural language intuition suggests gradience even within the borderline region, which supervaluationism cannot capture.

  **B. Computational Models and Vector Semantics**
  In computational linguistics and NLP, the goal is predictive accuracy, not philosophical fidelity to a specific theory of truth.
  *   **Implicit Gradience:** Modern models (like Transformers and Large Language Models) use high-dimensional vector spaces. In these spaces, semantic similarity is inherently gradient. A word's relationship to a concept like "tall" is represented by distances in vector space, which naturally models the smooth transitions you described.
  *   **No Need for Explicit Logic:** Computational models do not need to explicitly encode supervaluational logic to handle vagueness. They learn the *usage patterns* of vague terms from data. Since supervaluationism posits truth-value gaps rather than gradient values, it is actually *less* compatible with the continuous mathematics of neural networks than degree theories or probabilistic models are.

  ### 3. Corpora, Epistemicism, and Transition Curves

  Your second question asks if we should observe smooth probabilistic transition curves in corpora if vagueness is epistemic grading masked by semantic indeterminacy.

  **A. The Epistemicist View**
  If **Epistemicism** (championed by Timothy Williamson) were true, vagueness is purely a matter of ignorance. There is a sharp cutoff (e.g., exactly 5'10.342"), but we cannot know it.
  *   **Corpora Prediction:** If epistemicism were correct, we would not expect a smooth curve of *truth*. We would expect a sharp jump in truth conditions that is obscured by noise in *assertability*. In large-scale corpora, this would look like a steep sigmoid curve where usage frequency shifts rapidly, not necessarily a smooth linear transition of truth.

  **B. The Empirical Reality: Gradient Acceptance**
  Experimental semantics and corpus linguistics generally **do** show smooth transition curves. When speakers are asked to judge whether objects fall under a vague predicate, acceptance rates typically follow a sigmoid function rather than a step function.
  *   **Implication:** This empirical data argues **against** classical supervaluationism (which predicts a flat gap of indeterminacy) and **against** strict epistemicism (which predicts a hidden sharp cutoff).
  *   **Support for Degree/Probabilistic Theories:** The smooth curves found in corpora align much more closely with **Degree Semantics** or **Probabilistic Semantics**. These frameworks posit that the semantic content itself is gradient or that speakers maintain probability distributions over extensions.

  ### Summary

  The reason supervaluationism has not been widely integrated into computational models or dominant semantic theories is twofold:
  1.  **Theoretical Mismatch:** It does not do what your premise suggests; it posits truth-value gaps rather than intermediate values, making it unable to model the gradient nature of borderline cases that we observe empirically.
  2.  **Empirical Evidence:** Large-scale linguistic data reveals smooth probabilistic transition curves in the usage of vague predicates. This supports degree-theoretic or probabilistic frameworks, not supervaluationism.

  If you are interested in the framework that assigns intermediate values akin to Bayesian credences, you should look into **Probabilistic Semantics** or **Fuzzy Set Theory**. These are actively researched in computational linguistics precisely because they align with the gradient data found in corpora and the continuous mathematics of modern AI.
