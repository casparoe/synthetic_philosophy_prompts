          *   Focus: Moscombe scene, dignity vs. voting/opinion.
          *   Draft idea: The Moscombe evening crystallizes the ethical stakes. Stevens accepts being misrecognized as a gentleman to preserve the aura of dignity he associates with his service. When the local man defines dignity as holding opinions and voting, he offers a democratic counter-ontology of national character. For him, Englishness is political agency, not servile restraint. Stevens rejects this because it threatens his uptake-based identity. If dignity requires opinion, Stevens has none. The dismissal of the Jewish housemaids is the logical endpoint: Stevens prioritizes the "smooth functioning" of the English household (the ideal) over human rights (the moral reality). He treats the dismissal as a professional duty inherent to his role, shielded by the notion that the household's integrity supersedes external ethics. The rival account suggests national character should be rooted in civic participation, not professional performance. Stevens' failure to engage shows how the "ideal" model of national character silences the citizen within the servant.

