  2. Does the reader's enjoyment of Stevens's "Englishness" implicate us in the same uptake mechanism we critique?
  3. If national character is an uptake claim, is it ever ethical to encourage it for social cohesion, or is it inherently coercive?
  4. Consider finally the pier scene: Does Stevens achieve clarity, or does he merely swap one national fiction for another?
