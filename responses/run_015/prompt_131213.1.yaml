      *(Refining Point 2)*: CS assigns $G$ immediately. How to avoid arbitrariness? By defining the "system" rigorously. If the system is "the organism," $G$ is a function. If the system is "the circulatory system," and $G$ is "thermoregulation," is it a function? Only if thermoregulation is a capacity of the circulatory system *analysis*. CS avoids history by focusing on *current organization*.

      *(Refining Point 3)*: The intermediate category is "Exaptation." SE handles it as "non-functional utility" (until history accrues). CS handles it as "function." The "orphaned but integrated" status is a *relation* between history and current state. Neither theory describes the *relation* itself, only the relata. Thus, a meta-theory is needed.

