answer: |-
  To analyze the divergence between etiological (Selected Effects, SE) and causal-role (Cummins-style, CS) theories of function within the specific scenario of **functional displacement with structural conservation**, we must abstract the biological details into a logical schema. Let us define the trait as $T$, its original selected effect as $F$, its new fitness-contributing effect as $G$, and the containing organism/system as $S$. The scenario posits that $T$'s morphology is conserved via developmental constraint (lock-in), the historical selection for $F$ has ceased, and $T$ is now maintained (or permitted to persist) due to the fitness benefits of $G$.

  ### 1. The Etiological Account: Historical Fidelity vs. Functional Status

  According to the etiological account, the function of a trait is identical to the effect for which it was historically selected and which explains its presence in the population. Function is a historical property, not a dispositional one.

  **Judgment on Functional Status:**
  In the displacement scenario, the etiological account dictates that $T$ continues to bear the original function $F$, provided the lineage's history is sufficient to establish $F$ as the reason for $T$'s etiology. It does **not** immediately assign $G$ as the function. Even if $G$ is currently contributing to fitness and maintaining $T$ in the population, $G$ is classified merely as a "current utility" or an exaptation, not a "proper function," until a new selection history accumulates.

  However, a critical divergence arises regarding the **loss of functional status**. If the developmental lock-in is so severe that $T$ persists *regardless* of fitness consequences (i.e., selection cannot remove it), and the original selection for $F$ is entirely absent, the etiological account may classify $T$ as a **vestige**. In this specific sub-case, $T$ loses functional status altogether because nothing currently selects for it, and the historical link to $F$ is severed by the cessation of that selective regime. If, however, $G$ is actively maintaining $T$ (selection acts on $G$), $T$ retains the function $F$ conceptually, while empirically serving $G$.

  **Conceptual Commitments vs. Empirical Facts:**
  *   **Conceptual:** The theory commits to the principle that *history constitutes function*. It conceptually forbids assigning $G$ as *the* function solely on the basis of current benefit. It distinguishes sharply between "having a function" (historical fact) and "being useful" (causal fact).
  *   **Empirical:** The account must appeal to empirical biology to determine the **maintenance condition**. Biologists must ascertain whether $T$ is present *because* of past selection for $F$, *because* of current selection for $G$, or *despite* selection due to developmental constraint. The etiological theory cannot determine this internally; it requires phylogenetic analysis and population genetics to verify if the "selected effect" link is intact, broken, or transitioning. Without this empirical data, the etiological account cannot adjudicate whether $T$ is functional (historically), vestigial (historically severed), or in a transitional exaptive state.

  ### 2. The Causal-Role Account: Systemic Integration vs. Arbitrariness

  According to the causal-role account, the function of a trait is the contribution it makes to the capacity of a containing system. Function is a dispositional property defined by current organization.

  **Judgment on Functional Status:**
  In the displacement scenario, the causal-role account immediately assigns $G$ as a function of $T$. Because $T$ causally contributes to $G$, and $G$ contributes to the capacity of $S$ (e.g., survival, homeostasis), $G$ is a function. The original effect $F$ is irrelevant unless $T$ currently contributes to $F$. If $T$ no longer performs $F$, $F$ ceases to be a function. If $T$ performs both, both are functions.

  **Avoiding Arbitrariness Without Smuggling History:**
  The central challenge for the causal-role account here is explaining why $G$ is a *function* rather than a mere *side effect*, without implicitly relying on the fact that $G$ is now selected for (which would be smuggling in etiology).
  *   **The Mechanism:** The account avoids arbitrariness by anchoring function to the **analytical capacity of the system**. To call $G$ a function, one must demonstrate that $G$ is a component of a capacity $C$ of system $S$ that the analyst is trying to explain. For example, if $S$ is analyzed as a "thermoregulatory system," and $T$ contributes to heat retention ($G$), then $G$ is a function.
  *   **The Constraint:** To avoid privileging the present arbitrarily, the CS account must rigorously define the boundaries and capacities of $S$ without reference to evolutionary history. It must argue that $S$ is organized *now* in such a way that $G$ is a necessary or stabilizing component of its current operation.
  *   **The Risk:** The account risks collapsing into etiology if the "containing system" is defined teleologically (e.g., "the survival system"). If "survival" is defined as "that which was selected for," the CS account has smuggled in history. To remain pure, it must define systemic capacities structurally (e.g., "fluid transport," "structural support"). In the displacement scenario, the CS account treats $T$ as functional regarding $G$ simply because $T$ is causally integrated into the current systemic workflow that produces $G$, regardless of whether that integration is ancient or novel.

  ### 3. The Intermediate Category: Functionally Orphaned but Systemically Integrated

  The scenario describes a trait that is **functionally orphaned** (its historical justification $F$ is gone) but **systemically integrated** (its current contribution $G$ is vital). This corresponds to the biological concept of *exaptation* in its transitional phase.

  **Is there conceptual space?**
  Yes, this intermediate category highlights a gap that neither account can fully occupy without compromising its core definitions.
  *   **Etiological Limitation:** The SE account can describe the trait as having "no proper function" (if $F$ is gone and $G$ lacks history) or "function $F$" (ignoring current reality). It lacks the vocabulary to positively categorize the *current utility* as functionally significant without granting it historical status. It sees the trait as historically defined, rendering the current integration secondary.
  *   **Causal-Role Limitation:** The CS account categorizes the trait as "functional for $G$." It captures the integration but erases the orphaning. It cannot conceptually distinguish between a trait that was *designed* for $G$ over eons and a trait that *stumbled* into $G$ recently. For CS, the distinction is irrelevant to functional ascription.

  **Collapse or Pluralism?**
  Neither account can accommodate this intermediate category without collapsing into the other:
  1.  **SE Collapse:** If SE admits that "current systemic integration" ($G$) confers functional status independent of history, it ceases to be an etiological theory and becomes a causal-role theory.
  2.  **CS Collapse:** If CS admits that "historical orphaning" negates functional status despite current integration, it ceases to be a causal-role theory and becomes an etiological theory.

  **Conclusion on the Intermediate:**
  The existence of this category suggests that "biological function" is not a unitary natural kind but a **polysemous concept**. The "orphaned but integrated" state requires a **pluralistic framework** that allows for two distinct predicates:
  *   *Proper Function:* (Etiological) Tracks the historical lineage ($F$).
  *   *Systemic Function:* (Causal-Role) Tracks the current contribution ($G$).

  In the displacement scenario, the trait possesses *Systemic Function* ($G$) but lacks *Proper Function* (regarding $G$) or possesses a *Vestigial Proper Function* ($F$). To capture the full biological reality of functional displacement, one must employ both accounts simultaneously. Relying on either alone forces a distortion: SE renders the trait's current vital contribution conceptually invisible (as "mere utility"), while CS renders the trait's historical contingency invisible (as "design"). Thus, the intermediate category does not fit within either theory; it exists in the conceptual space *between* them, necessitating their joint application to fully describe the biological logic of displacement.
