          *   Original selective mechanism is gone/replaced.
          *   New fitness contribution exists (different from the original).
      *   **Three Specific Points to Clarify:**
          1.  *Etiological Account:* Does it keep the old function or lose function status? Distinguish conceptual commitments vs. empirical facts.
          2.  *Causal-Role Account:* Does it get the new function or is it non-functional? How does it avoid arbitrariness without smuggling in history?
          3.  *Intermediate Category:* Is there space for "functionally orphaned but systemically integrated"? Can either account handle this without collapsing?
      *   **Constraint:** Do *not* rely on canonical textbook examples (e.g., avoid the standard "heart pumps blood" vs. "heart makes noise" or specific classic exaptation cases like feathers unless analyzed abstractly). Focus on structural logic.
      *   **Requirement:** Indicate where each account must appeal to empirical biology vs. conceptual apparatus.

  2.  **Analyze the Theories (Mental Sandbox):**

      *   **Etiological (SE):** Function is defined by *history*. $X$ has function $F$ if $X$ was selected *for* $F$ in the past.
          *   *Problem case:* If selection stops or changes, what happens? If the trait is kept due to developmental constraints (lock-in) but now does $G$ (new benefit), SE says the function is still $F$ (if the lineage history supports it) or undefined (if the lineage is too short/new). It generally resists assigning $G$ as *the* function unless $G$ becomes the new selective pressure maintaining the trait over evolutionary time.
      *   **Causal-Role (CS):** Function is defined by *current capacity*. $X$ has function $F$ if $X$ contributes $F$ to the capacity of the containing system $S$.
          *   *Problem case:* Anything the trait *does* is a function. This leads to proliferation (the heart makes noise, therefore noise is a function). Usually restricted by the "relevant system" (e.g., circulatory system). In the displacement scenario, if the trait contributes to fitness now ($G$), CS calls $G$ a function. But does it acknowledge the history? No, not inherently.

  3.  **Drafting Point 1: The Etiological Account (SE)**

      *   *Question:* Does it keep the original function or lose status?
      *   *Logic:* SE ties function to the *reason for presence*. If the trait is present *because* of past selection for $F$, then $F$ is the function, even if $F$ is no longer performed or beneficial. However, if the trait is maintained *now* by drift or constraint (developmental lock-in), the link to selection is severed.
      *   *Nuance:* If the trait is maintained *solely* by developmental constraint (no current selection), SE might say it has no current function (it's a spandrel/vestige), even if it has a *historical* function. If it is maintained by *new* selection for $G$, SE requires a new evolutionary epoch to assign $G$ as the function.
      *   *Conceptual vs. Empirical:* Conceptually, SE demands a selection history. Empirically, we need to know *why* the trait is still there. Is it drift? Constraint? Or new selection? If it's pure constraint, SE says "no function" (or "vestigial"). If it's new selection, SE says "new function" (eventually).
      *   *Refinement:* The prompt specifies "selective mechanism... replaced by an entirely different fitness contribution." This implies the trait *is* currently selected for, but for $G$, not $F$.
      *   *SE Verdict:* The function remains $F$ until $G$ has a sufficient selection history. If the displacement is recent, it's still $F$. If the displacement is ancient, it's $G$. The "lock-in" complicates this: if the form is locked, can selection act on it? Yes, on the *consequences* of the form.
      *   *Key Distinction:* SE distinguishes between "having a function" (historical fact) and "currently contributing to fitness" (causal fact).
      *   *Drafting thought:* I need to be precise about the "loss of functional status." If the original selection is gone, SE says the original function is a *historical* fact, but is it the *current* function? Millikan/Neander would say yes, as long as the trait exists *because* of that history. But if the *maintenance* is now due to $G$, SE requires the history of $G$ to accumulate.
      *   *Decision:* SE maintains the original function ($F$) as long as the trait's presence is explained by the history of $F$. If the trait is now maintained by $G$, SE requires a transition period. If the morphology is locked, selection acts on the *effect* $G$. SE will resist calling $G$ the function until $G$ explains the trait's persistence in the lineage.

  4.  **Drafting Point 2: The Causal-Role Account (CS)**

      *   *Question:* New contribution ($G$) as function, or non-functional?
      *   *Logic:* CS looks at the current system. If the trait contributes $G$ to the system's capacity (e.g., survival/reproduction), $G$ is a function.
      *   *Problem:* Avoiding arbitrariness. Why is $G$ a function and not just a side effect? CS usually appeals to the "containing system." If the system is "the organism's survival," then $G$ is a function.
      *   *Smuggling History:* Does CS need history to define the "system"? Cummins argued no. But to distinguish "function" from "mere causal power," CS often implicitly relies on what the system is *supposed* to do (teleology).
      *   *Drafting thought:* In the displacement scenario, the trait does $G$. CS assigns $G$ as a function immediately. It does not care about $F$.
      *   *Avoiding Arbitrariness:* CS avoids privileging history by defining functions relative to an analytical capacity. The arbitrariness lies in choosing the capacity. To avoid smuggling etiology, CS must define the system's capacity without reference to evolutionary history (e.g., "circulation" not "survival selected for"). However, if the function is defined as "fitness contribution," that borders on etiology.
      *   *Refinement:* The prompt asks how it avoids privileging present over past *without smuggling*. It does so by explicitly bracketing history. The cost is that it cannot distinguish between a newly acquired beneficial effect and an ancient, designed one. Both are "functions."
      *   *Decision:* CS assigns $G$ immediately. It treats the trait as functional regarding $G$. It avoids arbitrariness by anchoring function to the *current* organizational goal of the system (which can be defined ahistorically, e.g., homeostasis), though this is the weak point where etiological critics attack.

  5.  **Drafting Point 3: The Intermediate Category**

      *   *Question:* "Functionally orphaned but systemically integrated."
      *   *Logic:* This describes the scenario perfectly: History says $F$ (orphaned because $F$ is gone), System says $G$ (integrated because $G$ helps now).
      *   *SE View:* It's a vestige (if no new selection) or transitioning (if new selection). It struggles to capture the *current utility* without granting it functional status prematurely.
      *   *CS View:* It's functional ($G$). It struggles to capture the *historical disconnect* (that this wasn't "designed" for $G$).
      *   *Is there space?* Yes, this is essentially the concept of **Exaptation** (Gould & Vrba).
      *   *Can either accommodate without collapsing?*
          *   SE can accommodate by distinguishing "proper function" (history) from "current utility." But if it acknowledges current utility as a type of function, it bleeds into CS.
          *   CS can accommodate by distinguishing "current function" from "historical origin." But if it acknowledges origin matters for *the* function, it bleeds into SE.
          *   *Conclusion:* The intermediate category exposes the incompleteness of both. It requires a dual-aspect theory. Neither can fully capture "orphaned but integrated" without admitting the validity of the other's criterion.
      *   *Refinement:* I need to argue whether this category forces a collapse. If SE admits "current utility" is a type of function, it becomes CS. If CS admits "history" determines *which* utility counts, it becomes SE. So, the intermediate category suggests a pluralistic approach is necessary, rather than one theory subsuming the other.

  6.  **Review and Refine (Self-Correction against Constraints):**

      *   *Constraint Check:* Did I use canonical examples? (Avoid "heart pumps blood"). I will use abstract variables ($T$, $F$, $G$, $S$) or generic biological descriptions (e.g., "a skeletal structure," "a metabolic pathway").
      *   *Constraint Check:* Did I distinguish conceptual vs. empirical?
          *   SE: Conceptual = selection history defines function. Empirical = determining if selection is still acting or if it's constraint.
          *   CS: Conceptual = contribution to system capacity. Empirical = measuring the contribution and defining the system boundary.
      *   *Tone:* Precise, philosophical, analytical.

  7.  **Final Polish of Arguments:**

      *   *Point 1 (SE):* Focus on the "Selected Effect." If the trait is locked by development but selected for $G$, SE says the function is still $F$ *until* the lineage accumulates history for $G$. The "loss of status" depends on whether the *maintenance* condition is met. If maintenance is purely developmental (no selection), SE says "no function" (vestigial). If maintenance is selection for $G$, SE says "function $F$" (historical lag).
      *   *Point 2 (CS):* Focus on "Capacity." The trait contributes $G$. $G$ is a function. The risk of arbitrariness is solved by referencing the "containing system's capacity." To avoid smuggling history, the capacity must be defined structurally/physiologically, not teleologically.
      *   *Point 3 (Intermediate):* This is the "Exaptation" gap. SE calls it "usurpation of function." CS calls it "new function." The intermediate state ("orphaned but integrated") highlights that *utility* $\neq$ *proper function*. Neither theory captures the *tension* between the two without borrowing from the other.

  8.  **Constructing the Output:** (Proceeding to generate response based on these structured thoughts.)
      *   *Introduction:* Define the scenario abstractly.
      *   *Section 1 (Etiological):* Address the persistence of $F$ vs. loss of function. Highlight the empirical burden (determining selection history).
      *   *Section 2 (Causal-Role):* Address the assignment of $G$. Highlight the conceptual burden (defining the system without teleology).
      *   *Section 3 (Intermediate):* Discuss the "Exaptation" gap and the necessity of pluralism.
      *   *Conclusion:* Summarize the divergence.

