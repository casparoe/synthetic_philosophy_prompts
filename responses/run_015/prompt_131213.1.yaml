      *(Refining Point 1)*: If the trait is maintained *only* because development is locked (i.e., variation is impossible, so selection cannot remove it), then there is *no* current selection. In this case, SE says the function is historical ($F$) but currently the trait is non-functional (vestigial) regarding maintenance. If the prompt implies the trait is maintained *because* of the new fitness contribution ($G$), then SE says $F$ is the function until $G$'s history is established. I will address the nuance: "selective mechanism... replaced." This implies $G$ *is* maintaining the trait.
