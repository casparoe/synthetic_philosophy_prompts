answer: |-
  # Seminar Handout: The Progress Taxonomy

  **Root Question:** Do philosophical disagreements shrink over time, or do they mainly recycle?  
  *(Inject the 'recycling coefficient': the rate at which old positions resurface under fresh jargon.)*

  ---

  ### **Branch 1: High Recycling Coefficient**  
  *(Positions recur; the 'Groundhog Day' scenario)*

  *   **Cause: Social Dynamics**  
      *   **Metric:** None / Institutional Survival  
      *   **Camp:** **Stagnationist**  
      *   **Commitment:** Philosophy is a self-perpetuating guild; disagreement persists because resolution threatens institutional identity.

  *   **Cause: Conceptual Depth**  
      *   **Metric:** Decision-Relevance (Articulating options)  
      *   **Camp:** **Pluralist**  
      *   **Commitment:** Progress is not closure, but the refined mapping of coherent live options for agents.

  *   **Cause: Any (Empirical/Conceptual/Social)**  
      *   **Metric:** Accumulated Truths  
      *   **Status:** **🚩 FLAG: Incoherent**  
      *   **Reasoning:** One cannot accumulate settled truths if the positions constantly recycle. Logical space empty.

  ---

  ### **Branch 2: Low Recycling Coefficient**  
  *(Positions resolve; the 'Resolution' scenario)*

  *   **Cause: Empirical Input**  
      *   **Metric:** Accumulated Truths  
      *   **Camp:** **Naturalist-Progressivist**  
      *   **Commitment:** Philosophy progresses by shedding questions answered by science and retaining those continuous with it.

  *   **Cause: Conceptual Clarification**  
      *   **Metric:** Eliminated False Options (Dissolution)  
      *   **Camp:** **Eliminativist**  
      *   **Commitment:** Progress is realising certain questions were malformed; we advance by stopping asking them.  
      *(Note: Distinct from Pluralist; here options vanish, not persist.)*

  *   **Cause: Conceptual Clarification**  
      *   **Metric:** Accumulated Truths  
      *   **Status:** **🚩 FLAG: Incoherent**  
      *   **Reasoning:** Clarification typically dissolves questions rather than adding to a stockpile of factual truths.

  *   **Cause: Social Dynamics**  
      *   **Metric:** Decision-Relevance (Consensus)  
      *   **Camp:** **Pragmatist**  
      *   **Commitment:** Progress is defined by useful consensus within a community, not mind-independent correspondence.

  *   **Cause: Social Dynamics**  
      *   **Metric:** Eliminated False Options  
      *   **Camp:** **Unnamed**  
      *   **Awkward Commitment:** Questions vanish not because they are solved, but because they become socially costly to ask (Taboo-Driven Progress).

  ---

  **Summary of Logical Gaps:**  
  Any path combining **High Recycling** with **Accumulated Truths** is logically excluded. Paths combining **Low Recycling** with **Social Dynamics** and **Truth Accumulation** are theoretically possible but largely unexplored (risking the genetic fallacy).
