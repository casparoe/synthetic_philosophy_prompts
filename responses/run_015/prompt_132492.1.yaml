prompt: |-
  You are a senior political philosopher and research advisor specializing in punishment theory and epistemology. Before you draft anything, take a few minutes to brainstorm quietly: identify the exact gap in the existing death-penalty literature, decide which standard objections your framing must preempt, and check that your proposed method is actually executable without archival access. Then think carefully through each section.

  I need a polished, two-page research proposal for a one-year dissertation fellowship. The topic has become personally urgent: my cousin was exonerated last year after fourteen years on death row, so the abstract “risk of error” is no longer theoretical for me. I want the proposal to be rigorous, not autobiographical, but I want the framing to reflect that the risk of executing the innocent is not merely a statistical misfortune.

  Here is my half-formed idea. In the standard literature, the risk of wrongful execution is treated as a contingent, probabilistic cost—something that could in principle be reduced with better forensic science or more appeals. I suspect this misses a deeper, structural asymmetry: the epistemic conditions for establishing guilt with the absolute certainty that retributive justice demands are different in kind from the conditions for establishing innocence, because absence of exculpatory evidence is not evidence of absence, and post-conviction review mechanisms have asymmetric access to inculpatory versus exculpatory material. If this asymmetry is ineliminable rather than merely probable, then retributivist justifications—which require precisely calibrated, deserved punishment—face a distinctive defeat that deterrence-based justifications do not face in the same way. At the same time, abolitionists who lean on this argument may implicitly commit to an epistemic standard that, if applied consistently, would also undermine very long terms of imprisonment.

  Turn this into a proposal with:
  1. A precise statement of the research question, formulated so it has a determinate answer (yes/no/mixed) rather than an open-ended discussion.
  2. Why the existing positions—retributivist defenses that acknowledge error risk, and abolitionist arguments that treat error risk as decisive—leave this specific structural question open.
  3. The method: what you would actually do, conceptually, month by month (e.g., analyzing the epistemic structure of capital appeals, comparing the asymmetry to standards in non-capital life sentences, testing whether the argument overgeneralizes).
  4. What a successful result would look like, what intermediate failures would look like, and what would count as the project collapsing entirely.
  5. An honest scope assessment: why this is feasible in one year, and which obvious expansions (e.g., cross-jurisdictional empirical comparison, full normative theory of punishment) must be excluded to keep it tractable.
  6. A brief note on why this is worth funding or approving, aimed at a philosophy committee that knows punishment theory but is skeptical of “applied” projects.

  Do not include a bibliography, reading list, or citation requests—I will add references myself. Do not invoke obscure, niche theories or named scholars that a well-trained philosopher might not recognize; work with standard concepts in epistemology and punishment philosophy (e.g., retributive proportionality, evidential asymmetry, epistemic risk). You may inject your own conceptual distinctions—such as “structural epistemic asymmetry” versus “contingent error risk”—but define them within the proposal rather than assuming prior familiarity.

  Write formally, in the voice of a proposal applicant, not in dialogue form. Begin with a brief brainstorming summary, then move to the structured proposal.
