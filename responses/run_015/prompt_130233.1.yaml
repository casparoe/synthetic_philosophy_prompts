answer: |-
  This is a fantastic pedagogical game your supervisor is playing. She is essentially running a simplified version of Kwame Anthony Appiah's *The Honor Code*, where moral change is driven not by moral reasoning (arguments) or material necessity (interests), but by a shift in what counts as *respectable* within a specific social script.

  Her heuristic seems to be:
  1.  **Arguments** are constant background noise; they rarely trigger change on their own (except in the torture anomaly).
  2.  **Interests** only drive change when the practice is economically or geopolitically unsustainable (Russia).
  3.  **Honor** is the default engine: the practice becomes incompatible with the identity of the relevant elite group.

  Here is how she will likely process your three cases, which one is the true test, and what verdict should make you abandon her framework.

  ### 1. The Death Penalty (US)
  *   **The Competing Stories:** DNA/Innocence (Arguments), Litigation Costs (Interests), "Club with Iran" (Honor).
  *   **Her Likely Verdict:** **Honor.**
  *   **Why:** She will dismiss cost (states spend money on "honorable" wars all the time) and arguments (innocence cases have existed for a century). She will latch onto the "civilized nation" narrative. States abolish it when they want to signal they are part of the "modern West" rather than the "authoritarian rest."
  *   **Test Value:** **Low.** It's too messy. Some states retain it, some don't, with similar economic profiles. It's hard to isolate the variable.

  ### 2. The End of Apartheid
  *   **The Competing Stories:** Sanctions/Capital Flight (Interests), Pariah Status (Honor), Moral Illegitimacy (Arguments).
  *   **Her Likely Verdict:** **Interests** (with an Honor chaser).
  *   **Why:** This is her "Russian Serfdom" case. She will likely argue that the National Party negotiated when the cost of maintaining the system (sanctions, military spending, capital flight) outweighed the benefit. The "Honor" piece (rejoining the international community) was the *sugar coating* on the exit, not the engine.
  *   **Test Value:** **Medium.** It tests whether she distinguishes between "State Survival" (Interests) and "Social Standing" (Honor). But because sanctions blend economics and reputation, she can easily conflate the two.

  ### 3. The Collapse of Fur (1990s)
  *   **The Competing Stories:** PETA/Activism (Arguments), Synthetics/Price (Interests), "Bloody/Tacky" (Honor).
  *   **Her Likely Verdict:** **Honor.**
  *   **Why:** This is the purest Appiah case.
      *   *Arguments:* Animal rights arguments existed in the 1950s, 60s, 70s. They moved nobody.
      *   *Interests:* Fur remained profitable for farmers and retailers until the very end. Synthetics existed earlier.
      *   *Honor:* In the 90s, wearing fur shifted from a sign of *luxury/status* to a sign of *cruelty/vulgarity*. Supermodels refused to wear it; department stores banned it to protect their *brand image*, not just immediate sales.
  *   **Test Value:** **High.** It isolates the mechanism. It wasn't load-bearing for the economy (like slavery), and the arguments didn't change (like footbinding).

  ### The Critical Test: Fur
  You should spring **the collapse of fur** on her. It is the cleanest laboratory for her rule because it removes the "State Survival" variable present in Apartheid/Slavery/Serfdom.

  #### What verdict would make you give up the Honor reading?
  If she claims the collapse of fur was driven by **Interests**.

  Here is why:
  Your competing hypothesis is that "reputation is just one interest among others" (the Broad Interests theory).
  *   If she says **Honor**: She maintains that the *social meaning* drove the change, even when it cost retailers money (initially) and farmers their livelihoods. This keeps her category distinct.
  *   If she says **Interests**: She will likely argue that retailers dropped fur because protests threatened their *bottom line* (boycotts).

  If she concedes **Interests**, she validates your skepticism. It implies that "Honor" is not a distinct engine, but merely a lever that pulls the "Interests" handle. In this view, Macy's didn't ban fur because they felt shame; they banned it because shame was successfully weaponized into financial loss. If "Honor" only works by threatening "Interests," then your "Broad Interests" theory is the more fundamental explanation, and her "Honor" category is just a descriptive label for a specific type of interest-based calculation.

  **Alternatively:** If she claims it was driven by **Arguments**, her entire framework collapses internally. Since arguments against fur predated the 90s by decades, claiming arguments drove the change would contradict her analysis of Footbinding and Dueling (where arguments existed but failed). If she admits arguments can work without a prior honor shift, her "Honor Rule" is falsified.

  ### Summary Strategy
  1.  **Pitch the Fur case.** It's the most "Appiah" of the bunch (consumer habit, status symbol).
  2.  **Listen for the mechanism.** Does she say women stopped wearing it because they felt *ashamed* (Honor), or because stores stopped selling it because they feared *lost revenue* (Interests)?
  3.  **The Kill Shot:** If she says **Interests**, you can gently point out that this confirms your suspicion: Honor is just a subset of Interests (social capital converting to financial capital). If she says **Arguments**, you point out the contradiction with Footbinding. If she sticks to **Honor**, ask her why arguments didn't work in 1970 when the moral logic was identical.

  If she can't distinguish the 1970s (Arguments + Honor for Fur) from the 1990s (Arguments + Honor against Fur) without invoking a tautology ("because honor shifted"), you've exposed that "Honor" is the *name of the phenomenon*, not the *engine of the change*.
