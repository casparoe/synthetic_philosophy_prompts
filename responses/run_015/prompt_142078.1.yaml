answer: |-
  I recommend we approve the grant contingent on a mandatory restructuring of the consortium's first two years to resolve fundamental ambiguities in the research question's contrast class before causal inference begins.

  The data proposed—wage series, coal transport costs, paleoclimate reconstructions—is robust, and the consortium's capacity to deliver these materials is not in doubt. My hesitation concerns not the evidence, but the architecture of the inquiry itself. The working title, "Why Britain and not China," presents itself as a standard empirical question, but it conceals a category error that threatens to invalidate the subsequent seven years of work. In the philosophy of science, asking "why P" is only meaningful when understood as "why P rather than Q." The validity of the answer depends entirely on the stability of Q, the foil. Here, the foil is unstable. The proposal oscillates between comparing Britain to the Qing Empire as wholes, and Britain to specific regions like the Yangzi Delta. These are not equivalent comparisons. Britain circa 1800 was a state of ten million people with a unified market and overseas empire; Qing China was a continental empire of three hundred million with distinct regional economies. Treating them as comparable units is akin to comparing a single firm to an entire industry. If the units of analysis are mismatched, any causal factors identified—whether institutions, coal, or culture—may be artifacts of the scale difference rather than drivers of industrialization.

  The strongest argument for funding the proposal as currently written is that bold, headline-ready questions are the engine of public engagement and fundraising. The applicants defend the framing by arguing that a contrastive structure is precisely what makes historical questions answerable; without a foil, they contend, we have mere narration and nothing to test. They are correct that we need a foil to test causality, but they are mistaken that any foil will do. A foil must be counterfactually plausible. If the structural differences between a continental empire and an island state make industrialization impossible for one but not the other regardless of specific variables, then asking "why not China" is like asking "why did the horse not win the Formula One race." The answer lies in the category, not the engine. By funding the question as stated, we risk purchasing a definitive answer to a question that cannot coherently be asked. The data will be real, but the conclusion will be methodologically hollow.

  There is also a legitimate concern among some board members that publicly deflating a flagship question looks less like methodological scruple and more like political timidity. They worry that a foundation which cannot state its question in a headline will struggle to attract co-funders. This risk is real, but it is outweighed by the reputational risk of funding a project that produces scientifically fragile results. It is not timid to insist that a comparison be like-for-like; it is basic quality control. If we fund a project that concludes "Britain industrialized because of X" without first establishing that China was a valid candidate for industrialization under the same parameters, we invite justified criticism from the broader scientific community. A refined question is more robust, and robust science attracts serious co-funders even if the headline is slightly more nuanced. We should not confuse simplicity with clarity.

  Furthermore, one historian on the panel suggested that asking "why not China" is simply asking "what happened," dressed up in a rhetorical costume. I believe this is wrong, and the distinction matters for our investment. "What happened" describes a sequence of events; "why not China" implies a branching possibility where China could have industrialized first but did not. If the structural conditions of the Qing Empire made early industrialization structurally impossible—due to scale, energy constraints, or state capacity—then the counterfactual is vacuous. The question presumes a possibility that may not have existed. We should not fund a seven-year investigation into a possibility that is logically foreclosed by the definitions of the units involved. The consortium must demonstrate that the counterfactual is plausible before they attempt to explain why it failed to materialize.

  Therefore, I propose we fund the project with specific conditions attached to the release of the third tranche of funding. These conditions are designed to force the consortium to operationalize the discrimination test I outlined in my notes: any proposed answer must name a foil, state what would have had to be different for the outcome to have gone the other way, and show that its favoured factors were absent or present to a different degree in that foil.

  **Conditions for Continued Funding:**

  1.  **Definition of Contrast Class:** By the end of Year Two, the consortium must publish a methodological paper explicitly defining the unit of comparison. They must state whether they are comparing Britain to the Qing Empire as wholes, or Britain to a specific region such as the Yangzi Delta. They cannot equivocate. If they choose the latter, they must justify why that region represents "China" for the purposes of the question.
  2.  **Application of the Discrimination Test:** For every primary causal factor proposed (e.g., coal access, property rights, state capacity), the consortium must demonstrate that the factor varies between the defined units in a way that correlates with the outcome. They must show that the factor was present in the industrializing unit and absent or significantly different in the foil.
  3.  **Verification:** Compliance will be verified by the Foundation Program Officer in consultation with an external methodologist appointed by the board, neither of whom shall be members of the consortium. They will review the Year Two methodological paper and the draft causal models.
  4.  **Failure Condition:** If the consortium fails to explicitly state the foil, or if their causal models rely on comparisons between mismatched units (e.g., comparing British national policy to Chinese local practice without adjustment), the Program Officer will withhold the third tranche of funding. The consortium will then be required to submit a revised work plan that aligns the units of analysis before funds are released.

  This approach protects the foundation's investment. It allows the data collection to proceed, which is valuable regardless of the conclusion, but it prevents us from committing to a causal narrative that rests on a flawed premise. We are not asking them to change the data, but to clarify the logic that binds the data to the conclusion. If they cannot pass this test in two years, they will not pass it in seven, and we will have saved the foundation from associating its name with a category error. If they can pass it, the resulting work will be stronger, more defensible, and ultimately more worthy of the headline we all wish to see.
