  3.  **Apply Jeffrey Conditionalization (JC) Framework:**
      *   **Standard Bayesian:** Update on evidence $E$ becoming certain ($P(E)=1$). $P_{new}(H) = P_{old}(H|E)$.
      *   **Jeffrey Conditionalization:** Update on a partition $\{E_i\}$ where probabilities shift but none become 1. $P_{new}(H) = \sum P_{old}(H|E_i)P_{new}(E_i)$. Requires *Rigidity*: $P_{new}(H|E_i) = P_{old}(H|E_i)$.
      *   **User's Twist:** "Relational" input (Judy Benjamin style). This involves constraints on conditional probabilities themselves, not just probabilities of the partition. This often violates JC's rigidity condition because the *structure* of the belief network is changing, not just the weights on the nodes.
