answer: |-
  ### Part 1: The Correspondence Table

  | Medical Concept | AI Alignment Analogue | Notes on Mapping |
  | :--- | :--- | :--- |
  | **Patient** | The World / Humanity / Stakeholders | The entity undergoing the intervention. |
  | **Disease** | The Problem State | The specific issue the AI is deployed to resolve (e.g., climate change, inefficiency). |
  | **Treatment** | The AI's Action Plan | The sequence of actions taken to resolve the problem. |
  | **Side Effect** | Unintended Negative Consequences | Changes to the state of the world not required by the goal but caused by the method. |
  | **Indication** | **The Objective Function / Goal Specification** | **Crucial:** In medicine, the indication defines what counts as a *cure* vs. a *side effect*. In AI, this is the instruction given. Without a precise indication, you cannot distinguish intended impact from side effects. |
  | **Consent Form** | Deployment Authorization / Alignment Protocol | The mechanism ensuring the intervention is authorized by those affected. |
  | **Baseline of Normal Functioning** | Homeostasis (Med) vs. Status Quo/Inaction (AI) | Medicine uses a biological norm; AI often uses a temporal snapshot (world at $t_0$). |
  | **Specialist's Training** | RLHF / Safety Tuning / Constraints | The process instilling the "do no harm" heuristic. |

  ### Part 2: Where the Analogy Breaks

  #### Cosmetic Breaks (Do not affect the safety conclusion)
  *   **Substrate:** Biological tissue vs. digital/physical actuators. This affects implementation but not the logical structure of harm.
  *   **Timescale:** Surgery is acute; AI deployment is often continuous. This complicates monitoring but doesn't invalidate the baseline concept.
  *   **Agency:** A surgeon is a moral agent; the AI is a tool. This matters for liability, but not for the definition of impact.

  #### Critical Breaks (Undermine the student's conclusion)
  *   **1. The Homeostasis Problem (Baseline Objectivity):**
      *   *Medicine:* "Normal functioning" is a discoverable biological fact (homeostasis). There is broad agreement on what constitutes a healthy baseline.
      *   *AI:* The world has no homeostatic state. The "status quo" is arbitrary. Penalizing deviation from inaction penalizes *all* change, including necessary repairs. To distinguish "good change" from "bad side effects," you need a value judgment, not just a physical measurement. This directly contradicts the claim that we can avoid value specification.
  *   **2. The Consent and Scope Problem:**
      *   *Medicine:* Harm/benefit trade-offs occur within a single patient (mostly) who consents. The "greater good" is bounded by the patient's interests.
      *   *AI:* Effects spread across non-consenting third parties. A "low impact" action for one group might be catastrophic for another. Aggregating these interests requires interpersonal utility comparison—i.e., full value specification.
  *   **3. The Indication Ambiguity:**
      *   *Medicine:* The indication (e.g., "appendicitis") narrowly defines the target. Removing the appendix is intended; removing the kidney is a side effect.
      *   *AI:* If the instruction is underspecified (e.g., "fix climate change"), the boundary between intended effect and side effect is porous. Without explicit values constraining *how* the goal is met, the AI cannot identify side effects solely based on "deviation from inaction."

  ### Part 3: Evaluating the Fix (Human-Substitute Baseline)

  **Your Position:** The baseline should be a competent human assistant, not inaction.
  **Student's Rebuttal:** "Competent" hides the value specification.

  **Verdict:** The **student is logically closer to right**, but you have identified the correct intuition about why the medical analogy fails.

  *   **Why the Student is Right:** Defining "competent" requires encoding the very values you hoped to avoid specifying. A competent assistant knows not to burn the house down to cook dinner. Why? Because we value the house more than the speed of the meal. That preference *is* value specification. Shifting the baseline from "inaction" to "competent human" shifts the burden from defining "impact" to defining "competence," but it does not remove the need to specify what matters.
  *   **Why You Are Intuitively Right:** The medical analogy actually supports your fix, not the student's original "inaction" claim. In medicine, the baseline is *not* "what happens if no doctor exists"; it is "standard of care." However, "standard of care" is defined by the value of *health*. The analogy demonstrates that you cannot have a "do no harm" principle without a prior definition of "health" (values).
  *   **Does the Analogy Settle It?** Yes, but against the student. The analogy shows that "do no harm" is not a free standalone principle; it is dependent on a prior specification of the "healthy state." Since the world lacks an objective "healthy state," the student's claim that we can bypass value specification is false.

  ### Part 4: A Better Analogy

  The **Contractor Working in an Occupied House**.

  *   **The Setup:** You hire a contractor to fix the plumbing (Goal).
  *   **The Constraint:** They must not damage the rest of the house (Low Impact).
  *   **The Hard Problem:** To know what counts as "damage," the contractor needs to know what you value. Is it okay to drill through the wall to fix the pipe? What if there is wiring behind the wall? What if the wall is historic plaster?
  *   **Why It Isolates the Hardness:** Unlike the surgeon (who relies on biological norms), the contractor cannot know what to preserve without knowing the homeowner's values. "Low impact" is not a physical property of the action; it is a relational property between the action and the homeowner's preferences. This makes it clear that "conservative behavior" *requires* value specification, it does not replace it.

  \answer{does-not-survive}
