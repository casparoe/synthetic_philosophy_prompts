      *   *Strong:* **The Hard Core isn't the Model.** In ML-driven science, the ML model is usually a tool, not the theory. The hard core is the physical/chemical hypothesis (e.g., "this phase transition is driven by entropy"). Tuning a neural net doesn't save the physical hypothesis if the latent space doesn't align with the mechanism.
      *   *Moderate:* **Computational/Resource Costs.** "Algorithmically infinite" ignores practical finitude. You run out of compute, time, or data. Lakatos's degeneration is often about *ad hoc* adjustments becoming too cumbersome. ML tuning *is* cumbersome.
