      *   *Refining the "Decisive" Argument:* Focus on *Novelty*. Lakatos isn't just about saving phenomena; it's about predicting *new* phenomena. ML tuning is retrospective. If the tuned model doesn't predict a *new* material property before measurement, the program is degenerating.
      *   *Refining the "Hard Core" Argument:* Distinguish between the *physics* and the *optimizer*. The protective belt protects the *theory*, not the *accuracy of the fit*. If the ML finds a correlation that contradicts the physical mechanism, the hard core is threatened regardless of loss function value.
