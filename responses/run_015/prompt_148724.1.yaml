  *(Self-Correction during drafting)*: Wait, I need to be careful about the "fatal" ranking. In philosophy, "fatal" is strong. I should qualify it as "fatal to the *plausibility* or *methodological standing*" rather than logical refutation, since epistemicism is logically consistent. I will frame it as "Methodologically Fatal" vs "Metaphysically Costly."

  Let's refine the "Continuity" argument. If the world is continuous, and language supervenes on use, and use is a social practice distributed over time, the "cut" is determined by chaotic social dynamics. It *exists*, but it's unstable. This actually helps epistemicism (Williamson's view). So the "Continuity" objection might be less fatal than the "Unfalsifiability" one. I will adjust the ranking accordingly.

