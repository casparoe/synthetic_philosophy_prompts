      *   *Nuance on Physics:* The user mentioned phase transitions. I should be careful. First-order transitions *do* have sharp boundaries (latent heat). Second-order don't. This distinction matters. Epistemicism works better if language behaves like a first-order transition imposed on a continuous substrate.
      *   *Nuance on Unfalsifiability:* Is it truly unfalsifiable? If Supervaluationism predicts truth-value gaps and Epistemicism predicts truth-values (unknown), can we test this? Not empirically, but perhaps logically. If a "gap" is demonstrated (e.g., in quantum logic applied to language?), Epistemicism falls. But in natural language, it's hard. I need to highlight the *theoretical cost* as the "risk."
