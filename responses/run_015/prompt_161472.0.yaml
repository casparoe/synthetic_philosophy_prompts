answer: |-
  # Session Plan: The Envelope Mechanism (90 Minutes)

  ## 1. Materials & Budget
  **Budget:** €30.00 (Class Bank).
  **Stakes:** 1 Token = €0.50. Max payout per student = €3.00 (6 tokens). Surplus buys coffee/pastries for the group; deficit means no treat.
  **Physical Items:**
  *   **40 Brown Envelopes** (standard DL size).
  *   **60 Paper Tokens** (colored slips, marked "€0.50").
  *   **20 Decision Sheets** (printed, see template below).
  *   **20 Pens.**
  *   **Deck A (Fixed Pairs):** 10 Index Cards. Write pairs on them: $(10, 20), (20, 40), (40, 80), (80, 160), (160, 320)$. Make two copies of each pair (20 cards total). *Note: Values represent token units, e.g., 10 = €0.50.*
  *   **Deck B (Base Values):** 20 Index Cards. Write single values: Four each of $20, 40, 80, 160, 320$.
  *   **10 Coins** (for the Control Group).
  *   **Whiteboard & Markers.**

  **Room Setup:**
  *   Tables arranged in clusters of 4 (5 clusters).
  *   Each cluster gets: 4 Envelopes, 1 Coin, 1 Deck A (for Phase 1), Pens, Decision Sheets.
  *   Instructor table at front with Deck B and Token Bank.

  ---

  ## 2. Decision Sheet Template
  *(Print one per student)*

  | Round | Gen | Seen (€) | Decision (Stay/Switch) | Reason (1 Sentence) | My Payoff | Other Payoff | Coin Policy Payoff* |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | 1 | Fixed | | | | | | |
  | 2 | Fixed | | | | | | |
  | 3 | Fixed | | | | | | |
  | 4 | Fixed | | | | | | |
  | 5 | Causal | | | | | | |
  | 6 | Causal | | | | | | |
  | 7 | Causal | | | | | | |

  *\*Coin Policy: If you chose Stay, record what Switch would have paid. If you chose Switch, record what Stay would have paid. For Even-ID students only: Ignore your choice, flip coin, record result.*

  ---

  ## 3. Timeline & Script

  ### 00:00 – 00:10 | Setup & Neutral Instructions
  **Action:** Hand out Decision Sheets and Pens. Assign IDs (1–20) silently (hand out sheets in order). Odd IDs = Policy Makers. Even IDs = Coin Flippers.
  **Script:**
  "Welcome. Today is a practical session on decision recording. You will participate in seven rounds of allocation.
  There is a Class Bank. At the end, tokens accumulated in the bank purchase a refreshment for everyone. If the bank is empty, there is no refreshment.
  In each round, you will receive an envelope. It contains a value in tokens. You may keep it or exchange it for the other envelope in the pair.
  You must record the value you see, your choice, and **one sentence explaining why**.
  Do not discuss values or choices with neighbors until instructed.
  Odd numbers: Choose based on your judgment.
  Even numbers: You must flip the coin provided. Heads = Switch. Tails = Stay.
  However, **everyone** must record what the *alternative* choice would have yielded, because we reveal both envelopes at the end of every round."

  ### 00:10 – 00:25 | Phase 1: The Blind & Peek Rounds (Gen: Fixed)
  **Mechanism:** Use **Deck A**. Each cluster draws a Pair Card. Values are written on slips, put in two envelopes, shuffled. One given to student, one kept face down on table.
  **Rounds 1 & 2:**
  *   **Round 1 (Blind):** "Do not open the envelope. Decide: Stay or Switch? Record 'Blind' in Seen column." -> Reveal both. Record Payoffs.
  *   **Round 2 (Peek):** "Open your envelope. Write the value. Write your reason. Decide." -> Reveal both. Record Payoffs.
  **Instructor Note:** Walk around. Ensure reasons are written *before* the reveal.
  **Script (Round 2):** "Open your envelope. Look at the number. Before you decide to swap, write your reason in the box. Be specific. Then mark Stay or Switch. We will now reveal the partner envelope."

  ### 00:25 – 00:40 | Phase 2: The Paired Zero-Sum Check
  **Action:** Students in clusters turn to face a partner. They hold the two envelopes from the *same* pair (Round 3).
  **Script:**
  "Round 3. You and your partner hold the two envelopes of a single pair. You do not know your partner's value.
  Privately, decide if you want to swap.
  If both want to swap: Exchange envelopes.
  If one wants to swap and one stays: No exchange.
  If neither wants to swap: No exchange.
  After deciding, reveal values to each other. Record payoffs."
  **Debrief Point (Verbal only):** "Notice: In this round, the total value between you and your partner was constant. If you gained, they lost. This is a closed system."

  ### 00:40 – 00:55 | Phase 3: Generator Comparison (The Core)
  **Action:** Collect Deck A. Instructor takes control of Rounds 5–7 using **Deck B (Causal)**.
  **Mechanism (Causal):**
  1.  Student draws a Base Card (e.g., 40). This goes in *their* envelope.
  2.  Instructor flips a coin (hidden).
  3.  If Heads: Instructor writes "80" on a slip, puts it in the *Other* envelope.
  4.  If Tails: Instructor writes "20" on a slip, puts it in the *Other* envelope.
  5.  Student sees their value (40). Decides. Reveal Other.
  **Script:**
  "Rounds 5, 6, and 7 use a different generation method. I will not describe it yet.
  Proceed as before. Peek, write reason, decide.
  Note: In this phase, the Class Bank is subsidized. You are playing against the Instructor's Bank for these rounds. Tokens here count double toward the refreshment fund."
  *(Note: The "double count" incentivizes attention without breaking the €30 cap, as the Instructor absorbs the theoretical loss.)*

  ### 00:55 – 01:10 | Data Aggregation & Threshold Discovery
  **Action:** Collect Decision Sheets. Project or write aggregate data on the board.
  **Board Layout:**
  *   **Gen Fixed:** Avg Gain from Switching (grouped by Seen Value: Low, Mid, High).
  *   **Gen Causal:** Avg Gain from Switching (grouped by Seen Value).
  **Script:**
  "Look at the Fixed Generator data.
  When you saw 10 or 20 (Low), what happened when you switched? (Students: Usually gained).
  When you saw 320 (High), what happened? (Students: Always lost).
  Look at your Reason column. Did your reason change between Low and High?
  Now look at the Causal Generator. Did the 'High' penalty appear?"

  ### 01:10 – 01:25 | The Reveal & The Algebra
  **Action:** Now you name the problem.
  **Script:**
  "This is the Two-Envelope Situation.
  Some of you likely wrote this reason: 'The other envelope is either half or double. Average is 1.25 times mine. Switch.'
  (Instructor writes $0.5(2x) + 0.5(0.5x) = 1.25x$ on board).
  In the Causal Generator, this math is **correct**. The other envelope *was* determined by a coin flip relative to yours. Switching was +EV.
  In the Fixed Generator, this math is **incorrect**. Why?
  Because the pair existed *before* you picked. If you hold the maximum value in the deck, the other *cannot* be double. It must be half.
  The algebra assumes the probability of 'Double' is 0.5 regardless of the value $x$. In the Fixed Deck, that probability drops to 0 at the boundary.
  Peeking gave you information—not about the other envelope directly, but about **where you are in the range**."

  ### 01:25 – 01:30 | Limitations & Dismissal
  **Script:**
  "Here is what this game could not show you.
  In the real paradox, you do not know the range. You do not know if 320 is the maximum.
  If the range is truly unknown or infinite, the boundary argument vanishes. The 1.25 algebra regains its pull.
  That is the philosophical knot: Does 'unknown range' license the 0.5 probability assumption?
  Your decision sheets show that when the range is known, the algebra breaks. When the mechanism is causal, it holds.
  Take your sheets. Count your tokens. We will purchase the refreshments tomorrow. Class dismissed."

  ---

  ## 4. Debrief Guide: Handling Predictable Issues

  ### The "1.25 Algebra" Student
  **Scenario:** A student puts the calculation on the board during the Peek Round debrief (00:40) and insists switching is always rational.
  **Response:** Do not refute. **Test.**
  **Script:** "Okay. Let's test that. Everyone who saw the highest value in the Fixed Deck (e.g., 320), raise your hand. Did you switch? What was the other envelope?"
  **Outcome:** They will see the other was 160.
  **Script:** "Your algebra says the other should be 640 or 160 with equal chance. But 640 did not exist in the deck. The algebra requires a prior distribution that allows 640. Did you know 640 was impossible?"
  **Goal:** Force them to admit the algebra depends on *possibility*, not just *arithmetic*.

  ### Noise & Small Samples
  **Scenario:** A student says, "I switched on 40 and lost, so switching is bad."
  **Response:** Aggregate the data.
  **Script:** "Individual rounds are noisy. Look at the class average for 'Seen 40' in the Fixed Generator. Did the group gain or lose on average?"
  **Goal:** Shift focus from outcome luck to expected value based on mechanism.

  ### The "No Reason" Student
  **Scenario:** Student writes "Gut feeling" or leaves it blank.
  **Response:** Address in the closing.
  **Script:** "Some sheets say 'Gut.' That is a valid data point. It means the explicit algebra wasn't driving your choice. It means you were sensitive to the range boundaries intuitively. That intuition is what the algebra tries to formalize—and where it fails in the Fixed case."

  ### Collusion (Friends comparing amounts)
  **Scenario:** Two students compare values mid-round.
  **Prevention:** Instruction: "If values are shared, that round is void for both of you."
  **Remedy:** If caught, exclude their data from the board aggregation. "We cannot use Round 3 for the zero-sum check if the information was leaked. We will rely on the other clusters."

  ### The "One-Shot" Limitation (Honest Account)
  **Scenario:** Students ask, "So should I switch in real life?"
  **Response:**
  **Script:** "In this room, you played 7 times. You learned the range. In real life, you often play once. You don't know the range.
  If you don't know the range, you cannot identify the boundary.
  If you cannot identify the boundary, the 1.25 algebra *feels* valid.
  This activity cannot reproduce the anxiety of the truly unknown. It can only show you that the algebra is not a universal law. It is a conditional claim that depends on how the envelopes were filled.
  The paradox survives because we often mistake the 'Causal' logic (coin flip) for the 'Fixed' reality (pre-filled pairs)."

  ---

  ## 5. Instructor Prep Checklist
  1.  **Print Decision Sheets:** Ensure columns are wide enough for handwriting.
  2.  **Prepare Deck A:** Verify pairs match (e.g., no orphan 160 without a 80 or 320).
  3.  **Prepare Deck B:** Ensure base values allow for halving without going below 1 token (Min base = 20).
  4.  **Token Count:** Count 60 tokens before class. Lock surplus in drawer.
  5.  **Board Plan:** Draw the table for aggregation before students arrive to save time.
  6.  **Timekeeper:** Wear a watch. The Generator Comparison (Phase 3) is the most likely to overrun; cut Phase 2 short if needed, but do not cut Phase 3.

  ## 6. Why This Works
  *   **Handwriting:** By forcing the reason *before* the reveal, you capture the intuition before it is corrected by outcome bias.
  *   **Two Generators:** This is the critical innovation. Most TEP lessons only show the paradox. By contrasting a **Fixed Prior** (where thresholding works) with a **Causal Prior** (where 1.25 EV works), you demonstrate that the *mathematics* is correct but the *application* depends on the physical setup.
  *   **Budget Safety:** The "Instructor Subsidy" in Phase 3 allows you to demonstrate the +EV of switching without risking the Class Bank's refreshment budget on a theoretical mechanic.
  *   **Zero-Sum Check:** Phase 2 grounds the abstract math in social reality. If switching were always +EV, everyone would gain, which is impossible in a closed pair. This creates cognitive dissonance that the debrief resolves.
