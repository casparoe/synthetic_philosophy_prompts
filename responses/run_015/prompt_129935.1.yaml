answer: |-
  Look, I have sat in exactly this room, watching bright kids get torn apart by exactly this configuration of people, and I want you to take a deep breath because you are actually better positioned than you think, provided you do not try to be a hero. The first thing you need to do is concede the ground they expect you to fight for before they even draw their swords. In your opening two minutes, you need to explicitly tell the two systems neuroscientists and the illusionist that you are not arguing against their dismissal of the hard problem. Say something like, I am not trying to convince you that consciousness exists if you think it is an illusion, nor am I trying to prove panpsychism to the skeptics; I am arguing that if you accept the premise that experience is fundamental, my view solves the combination problem better than the alternatives. If you do not say this, the illusionist will spend twenty minutes asking why you posit experience at all, and the synchrony guy will ask why you need a metaphysical thread when gamma bands do the work. What you absolutely have to hold, though, is the ontology of processes over substances. If you let them convince you that subjects are things located at instants, your view collapses immediately, so every time they ask about the subject, correct them gently that you are talking about a temporally extended process. The single reply that has to land for this talk to survive is your distinction between causal coupling and constitutive integration, because that is the only thing stopping your view from applying to everything in the universe.

  Now, here are the eight questions they are going to throw at you, ordered by how much damage they will do if you fumble them, and I want you to memorize the phrasing because I know exactly how these people talk. The first one will come from your housemate's concern, and yes, it is as bad as you fear, because if your criterion for combination is too broad, you have not solved the problem, you have just generalized the mystery. The illusionist will lean forward, steeple their fingers, and say, On your view, a married couple who have coordinated their lives for forty years have mutually dependent futures, so why are they not a single subject of experience? You need to reply that mutual dependence of macro-behaviors is not the same as the dynamical integration of micro-processes that constitute a single causal chain, noting that the couple remains two distinct biological organisms with distinct nervous systems whereas the neural processes you are talking about lose their individual causal independence entirely within the unified field. You must admit in your reply that this is soft because you are drawing a boundary between social coupling and neural coupling that relies on an intuitive difference in degree rather than a sharp difference in kind, and if they press you on where exactly the line is drawn, you will have to concede that your view implies a vague boundary for subjecthood which is costly but preferable to no subjects at all.

  The second most damaging question will come from the neurologist, who will not care about your metaphysics and will only care about the patients they see on Tuesdays. They will say, I have a patient with a complete callosotomy who behaves as one person in most contexts but shows two distinct wills in others, so at what precise point during the surgery did one process become two according to your entangled careers? Your reply should be that the unity of the process is a matter of degree and that split-brain patients exhibit a fragmentation of the process rather than a clean split into two substances, meaning there is no precise point because the integration degrades gradually as connectivity is severed. The evasion here is that you are using vagueness to hide the fact that your view struggles with binary intuitions about personhood, and if they push you on whether the patient is one subject or two during the transition, you will have to say both and neither, which will frustrate them but is honest to the view.

  The third objection will come from the first systems neuroscientist, the one who believes binding is oscillatory synchrony, and they will say, You are using the word integration to do metaphysical heavy lifting, but I can measure synchrony and you cannot measure entangled careers, so isn't this just a verbal relabeling of known mechanisms? You should reply that synchrony is one possible physical realizer of the deeper metaphysical relation of mutual dependence, and that your view is compatible with their data but explains why that data matters for consciousness rather than just for behavior. You have to concede that this is evasive because you are not specifying whether synchrony is necessary or sufficient for your entangled careers, and if they ask you to specify the physical marker, you will be forced to admit you are staying at the functional level to avoid being falsified by future neuroscience.

  The fourth question will come from the vision psychophysicist, who is practically minded and will ask, Okay, suppose I accept your view, what does it predict for my psychometric functions that standard integration theories do not? You need to say that it predicts that disruptions to the mutual dependence of future phases should degrade phenomenal unity before they degrade behavioral performance, suggesting a specific dissociation between reportability and experience. The soft spot here is that you likely do not have a concrete experiment ready, so you will have to promise that this is a theoretical prediction rather than an established result, which might leave them feeling you are all talk and no data.

  The fifth objection will come from the second systems neuroscientist, the hard problem skeptic, who will say, If the process is unified functionally, why do we need to say there is a unified experience, since the experience is doing no work in your story? You must reply that the experience is not doing causal work but is the intrinsic nature of the unified process, so asking what work it does is a category mistake. This is soft because it leans heavily on Russellian monism without fully defending it, and if they press you on why we should believe in intrinsic natures, you will have to fall back on inference to the best explanation which they will not find compelling.

  The sixth question will come from the agnostic philosopher, who will ask, Is this not just Russellian monism with worse manners, since you are positing intrinsic natures for processes rather than things? You should say it is a variant of Russellian monism that solves the combination problem by shifting the bearer of the intrinsic nature from the substance to the process, which avoids the subject-summing issue. The evasion here is that you are basically admitting you are a Russellian monist, which might alienate the physicalists, but it is better to own the label than to pretend you are not doing metaphysics.

  The seventh objection will be a technical one about time, likely from the agnostic philosopher or the psychophysicist, who will ask, Processes extend in time but experience seems present, so how do you account for the specious present without a subject holding the thread together? You need to reply that the thread is the specious present, because the process includes its own immediate past and anticipated future as part of its current phase, so there is no need for a separate holder. This is soft because it requires a specific theory of temporal experience that you might not have fully fleshed out, and if they ask about memory versus anticipation, you might get tangled in the phenomenology.

  The eighth and least damaging question will be a clarification from the illusionist, who will ask, So you are saying the hard problem is real but the combination problem is the only one that matters? You should reply that the combination problem is the bottleneck for any view that accepts experience, and solving it makes the hard problem more tractable even if it does not dissolve it. This is safe ground for you because it aligns with your abstract, but you must be careful not to sound like you are dismissing the hard problem entirely since the skeptics are watching.

  Regarding the question you are praying nobody asks, the one about the married couple, I need you to understand that this is the most dangerous objection in the room because it targets the necessary and sufficient conditions of your view directly. If you cannot distinguish a neural process from a social partnership in a principled way, your solution to the combination problem fails because it combines too much. It is bad enough that you should prepare a specific slide for it rather than hoping it does not come up, because if the housemate logic occurs to one person, it will occur to the illusionist immediately, and they will use it to show that your view implies panpsychism at the macro level which is absurd. You need to emphasize the difference between information exchange and constitutive integration, arguing that the couple exchanges signals but does not constitute a single dynamical system in the way neurons do, but you must be ready to admit that this distinction is one of degree and not of kind, which is the cost of doing business in process metaphysics.

  Finally, remember that these people are not trying to destroy you personally, but they are trying to destroy weak arguments, and your job is to show them that your argument is robust enough to survive their scrutiny. Do not get defensive when they point out the soft spots, because acknowledging the limitations of your view makes you look more credible than pretending it is perfect. If you can get through the marriage objection without panicking and hold the line on process ontology without getting dragged into substance metaphysics, you will walk out of that room with your reputation intact and maybe even some new collaborators. Good luck, and send me the slides tonight so I can look for any other traps you might have missed.
