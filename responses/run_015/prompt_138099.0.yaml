answer: |-
  **The Case**
  Elena is choosing between two leases: a cheap apartment with a long, draining commute (Bundle $A$) and an expensive apartment with a short, restful commute (Bundle $B$). She is perfectly rational, knows her budget, and values her time in monetary terms; she chooses $B$ over $A$. To measure her gain, we ask two money-metric questions consistent with her choices. First, starting at $A$, what is the maximum she would pay to switch to $B$? (Willingness-To-Pay, or WTP). Second, starting at $B$, what is the minimum compensation she would demand to switch back to $A$? (Willingness-To-Accept, or WTA). Because the rent difference is large relative to her income, the move changes her marginal utility of money: at $A$ she is cash-rich and time-poor; at $B$ she is cash-poor and time-rich. Her observed choices are consistent with a WTP of $\$500$ and a WTA of $\$800$. Both numbers are derived from the same preference ordering, both respect her budget constraint, and neither implies irrationality. Yet they disagree on the magnitude of the benefit.

  **The Readings**
  *   **The Choice-Index Reading:** Says there is no conflict. Utility is simply the ranking $U(B) > U(A)$. The $\$500$ and $\$800$ are merely technical conversion rates dependent on the starting point; neither is "the" utility difference. The job is done once the direction of choice is established.
  *   **The Benefit Reading:** Says policy requires a single cardinal number to weigh against costs (e.g., subsidies). It asks: "How much better off is she?" The money numbers fail to settle this. If the policy analyst uses $\$500$, they underestimate her loss if the policy is reversed; if they use $\$800$, they overestimate her entry cost. The "gain" is indeterminate despite perfect choice data.

  **The Feature Doing the Work**
  **Non-quasilinearity (Income Effects) over a Non-Marginal Change.**
  The divergence arises because money does not have constant marginal utility for Elena. The "shape of the situation" is the curvature of her indifference curves combined with a discrete, large jump in budget allocation. Money is the measuring rod, but the rod shrinks or expands depending on which bundle she holds.

  **Removing the Feature**
  If you remove this feature by assuming **quasilinear preferences** (money has constant marginal utility) or by making the change **marginal** (infinitesimally small), WTP and WTA converge to a single number.
  *   *Honest Assessment:* Yes, removing it collapses the case back into the ordinary money-metric story. This means the objection only holds for "lumpy," significant policy changes where wealth effects matter—which is precisely where policy people most need a reliable number.

  **The Strongest Defence for the Revealed-Preference Purist**
  "The demand for a single 'gain' number is a category error. Utility is ordinal, not cardinal. The divergence between WTP and WTA doesn't mean utility is ill-defined; it means *money* is an imperfect numeraire for large changes. If you want a cardinal measure, you must assume away income effects, but that is an assumption about the world, not a measurement of preference. Revealed preference tells us exactly what happened: she preferred $B$. Asking 'by how much?' in monetary terms is asking for more information than choice data can logically provide without imposing arbitrary normalization (like picking WTP over WTA). There is no further fact about 'how much' she benefits beyond the fact that she chose it."

  **Honest Verdict**
  This is a **genuine objection to the policy use of utility**, but not to the logical coherence of revealed preference.
  It does not prove that "utility" is fake; it proves that **money-metric utility is not path-independent** without strong assumptions. For your chapter, this is the leverage point: Policy analysts quietly treat WTP as *the* benefit, pretending the measurement is unique. This case shows that even with a perfect agent, the "benefit" number is underdetermined by choice data alone. It forces the policy person to admit they are smuggling in an extra assumption (that income effects don't matter) to get the single number they need. It's not just "non-marginal messiness"; it's a structural ambiguity in translating *choice* into *welfare magnitude*.
