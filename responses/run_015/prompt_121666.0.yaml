answer: |-
  You have put your finger on a genuine and under-discussed fault line in the metaphysics of supertasks. While there isn't a single, canonical noun phrase like "The Accumulative Bias" stamped in the literature, the asymmetry you're detecting is recognized in the debate between **logical determinacy** and **physical continuity**.

  The phenomenon you are describing is best understood as the tension between **Benacerraf's Gap** and the **Principle of Physical Continuity**.

  Here is the carving you asked for: the precise distinctions, the literature mapping, and the edges where the intuition breaks.

  ### 1. The Literature Map: Benacerraf vs. The Physicists
  The standard reference point is Paul Benacerraf's 1962 paper, *"Tasks, Super-Tasks, and the Modern Eleatics."*
  *   **Benacerraf's Point:** He argued that Thomson's Lamp is logically underdetermined. The state of the lamp at $t=1$ is not logically entailed by the states at $t < 1$. There is no contradiction in saying it ends up on, off, or exploded.
  *   **The Asymmetry:** Benacerraf notes that for many supertasks (like Zeno's Achilles), we *do* accept a final state. Why? Because we implicitly import a **Continuity Principle** from physics. We assume position is a continuous function of time.
  *   **Your Observation:** You are noticing that we apply this Continuity Principle readily to *magnitudes* (heat, charge, position) but resist applying it to *discrete states* (on/off).

  In contemporary literature (e.g., John Earman, John Norton, Jon Pérez Laraudogoitia), this is often discussed under **Causal Closure** or **Idealization Constraints**. But the specific intuition pump you're describing relies on the **Topology of the State Space**.

  ### 2. The Carving: Three Criteria for Determinacy Intuition
  To define why the reservoir feels determinate while the lamp does not, we need to separate three distinct structural features. Your intuition triggers "determinate" only when specific conditions across all three are met.

  #### A. Topology of the State Space (Discrete vs. Complete)
  *   **Thomson's Lamp:** The state space is $S = \{0, 1\}$ with the discrete topology. The sequence of states is $1, 0, 1, 0...$ In this topology, this sequence **does not converge**. There is no point in the state space that the sequence approaches. Therefore, there is no mathematical "hook" for a final state to hang on to.
  *   **The Reservoir:** The state space is $S = \mathbb{R}_{\geq 0}$ (real numbers) with the standard metric topology. The sequence of partial sums $S_n$ forms a Cauchy sequence. If the series converges, there **is** a limit point $L$ within the state space.
  *   **The Carving:** We feel the result is determinate when the state space is **metrically complete** and the trajectory **converges within that space**. We feel it is indeterminate when the state space is discrete and the trajectory **oscillates**.

  #### B. Dependency Structure (Step-Relative vs. History-Summing)
  This is the crucial functional difference you sensed.
  *   **Toggle (Lamp):** The state at step $n$ is defined **relationally** to step $n-1$. $State_n = \neg State_{n-1}$. To know the state at the limit, you effectively need to know the "last" step. Since there is no last step, the relational chain dangles.
  *   **Accretive (Reservoir):** The state at step $n$ is defined **absolutely** by the sum of the history. $State_n = \sum_{i=1}^n \Delta_i$. The value does not depend on the *order* of the last toggle, but on the *total magnitude* of input.
  *   **The Carving:** A supertask triggers the "determinate" intuition if the final state is a **path-independent integral** of the inputs, rather than a **path-dependent recursion**. If the final state can be calculated without referencing the "last" operation, we treat it as real.

  #### C. The Hidden Premise: The Principle of Physical Continuity
  This is where the "bias" lives. It is not a logical necessity; it is a physical assumption.
  *   **For the Lamp:** We assume switches are mechanical. Mechanical positions are usually treated as discrete. We do not assume a switch can be "half-on." Therefore, no limit exists.
  *   **For the Reservoir:** We assume heat/charge is a continuous quantity. We implicitly assert: *"Physical quantities cannot jump discontinuously without a cause."* Since the input series converges, the quantity must settle at the limit.
  *   **The Carving:** The intuition of determinacy is actually an intuition of **Conservation**. We believe energy/charge must go somewhere (Conservation), so it must reside in the reservoir. We have no "Conservation of On-ness."

  ### 3. Testing the Edges: Where the Intuition Fails
  To prove this isn't just "convergence," let's look at cases where the math converges but the intuition wobbles, or vice versa.

  **Edge Case 1: The Ross-Littlewood Paradox (The Vase)**
  *   *Task:* At step $n$, add 10 balls to a vase and remove 1. Do this infinitely fast.
  *   *Math:* The number of balls grows to infinity ($\sum 9$).
  *   *Intuition:* How many balls are left at the end?
  *   *Result:* Depending on *which* balls you remove, the answer can be **zero** or **infinity**.
  *   *Why this matters:* This is a "cumulative" task (adding stuff), yet the final state is **underdetermined**. Why? Because the *identity* of the objects matters, not just the count. This shows that even accretive supertasks are indeterminate if the property tracked is not a simple continuous magnitude. Your intuition works for heat/charge because they are fungible scalars, not labeled individuals.

  **Edge Case 2: The Saturating Reservoir**
  *   *Task:* Add charge to a capacitor, but the capacitor has a max capacity $C$. The series sums to $> C$.
  *   *Math:* The series diverges relative to the capacity.
  *   *Intuition:* The capacitor blows up or leaks.
  *   *Why this matters:* It shows your intuition relies on the **linearity** of the accumulation. If the physical system is non-linear (saturation), the "definite value" intuition vanishes, replaced by "catastrophe."

  **Edge Case 3: The Dimming Lamp (A Bridge Case)**
  *   *Task:* Instead of on/off, the lamp's brightness is $1, 1/2, 1/4, 1/8...$
  *   *Math:* Converges to 0.
  *   *Intuition:* Most people say "It ends up off."
  *   *Why this matters:* This bridges your two cases. It is a lamp (discrete object), but the property tracked (brightness) is continuous. We accept the limit here. This confirms that the asymmetry is not about *objects* (lamps vs. reservoirs) but about **Property Topology** (Discrete vs. Continuous).

  ### 4. Defining the Phenomenon
  Since there is no standard label, I propose defining this as **The Continuity-Dependence Asymmetry**.

  **Definition:**
  > The **Continuity-Dependence Asymmetry** is the cognitive and metaphysical tendency to assign determinate final states to supertasks where the tracked property occupies a **continuous, complete metric space** and evolves via **additive accumulation**, while withholding determinacy from supertasks where the property occupies a **discrete topology** and evolves via **recursive alternation**, despite both sharing identical temporal structures (infinite steps in finite time).

  **The Precise Condition for "Determinacy Intuition":**
  A supertask triggers the intuition of a determinate final state if and only if:
  1.  **State Space Completeness:** The property $P$ being tracked belongs to a topologically complete space (e.g., $\mathbb{R}$), not a discrete set (e.g., $\{0,1\}$).
  2.  **Convergent Trajectory:** The sequence of values $P(t_n)$ converges to a limit $L$ within that space.
  3.  **Continuity Principle:** The observer implicitly accepts a physical law that $P(t)$ is a continuous function of time (no spontaneous jumps at the limit).

  ### 5. Conclusion: Is it a Bias?
  It is not a *logical* bias, but it is a **physicalist** bias.
  *   **Logically:** Benacerraf is right. Neither the lamp nor the reservoir *must* have a determined state at $t=1$ based solely on the description of the steps.
  *   **Physically:** We treat the reservoir as determinate because we import external knowledge about thermodynamics and electromagnetism (conservation laws, continuity of fields). We treat the lamp as indeterminate because we know switches are discrete mechanisms.

  You are sensing the difference between a **Logical Supertask** (purely defined by the steps) and a **Physical Supertask** (constrained by the laws of the medium). The "result" in the reservoir case feels real because you are silently smuggling in the laws of physics to bridge Benacerraf's Gap. In the lamp case, the physics offers no bridge, so the gap remains visible.

  **Summary Label:** If you need a term for your notes, call it **The Benacerraf Continuity Gap**. It highlights that the determinacy comes from assuming continuity where logic does not guarantee it.
