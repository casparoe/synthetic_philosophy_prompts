prompt: |-
  I'm on a standing electoral-law review commision for our region, which is basically the body that gets handed every proposal about who gets to vote and then has to send a recommendation to the legislature a few months later. We do this maybe two or three times a year, the recommendations are public and get picked apart in the local press, and half the members are lawyers and former councillors with no philosophy background at all — so whatever we use has to be runnable in a meeting, in plain language, without anyone looking anything up. The same three proposals keep coming back: lower the voting age (usually to 16, someone always floats 15), give the vote to non-citizens who've been living and working here for years (often local elections only), and make voting compulsory, at least in the weak sense of a modest fine for not turning up. And every single time we have the identical argument and split the identical way: some of us think the test is whether your life is materially shaped by the decisions, some think it's whether you're bound by the law and subject to coercion, some go on about competence and whether someone can form a view of their own, and the compulsory-voting people insist that compulsion is just what you do once you've got a franchise worth having. Nothing ever gets resolved.

  What I want is a procedure, not another position paper: the questions in order, what counts as an adequate answer to each one, where the procedure stops and returns a clear no, and where it has to hand the decision back to us as a values call we own instead of dressing up as a technical finding. It should be grounded in something better than 'balance the interests' — the thing I keep circling is that the all-affected idea (everyone whose interests are affected by a decision should have a say) is plainly too wide, since it seems to enfranchise tourists, trading partners and future generations and nobody wants that, while the 'you're subject to the law' test is too narrow in a way I can't quite articulate. My own half-baked suggestion, use it or bin it: what actually tracks my instincts is how costly it would be for someone to exit the jurisdiction — the people who can't leave without wrecking their lives are the ones who must be in on the decision, which would explain why a long-term resident non-citizen has a stronger claim than a citizen who moved abroad thirty years ago and can just stay away. Maybe there's a better variable and I'd rather have that than my hunch. Two more things I think but can't defend: (a) 'may they vote' and 'must they vote' are different questions, and even if someone has a claim to be allowed to vote you'd need a separate and stronger argument before you could fine them for staying home; (b) whether compulsion is defensible might depend on who else is already in the electorate — if the people who don't turn up are a systematically biased sample rather than a random one, compulsion seems to do something quite different. Tell me if either of those is confused.

  Then please run whatever you build on three cases: lowering the age to 16 for regional elections; votes for non-citizens of five years' residence, local elections only; and compulsory turnout with a small fine. I'm personally sympathetic to all three, so I'd like at least one of them to come out somewhere I don't like — don't just hand me my own politics back, and tell me honestly if the right response to an unwelcome verdict is to change my mind rather than patch the procedure. Also put it through the hard cases it would have to survive in real life: prisoners, people with advanced dementia, dual citizens who have never lived here, sixteen-year-olds who are also non-citizens, undocumented residents, people who moved away but kept the vote. And finish with what the procedure can't do: where it will misfire, what it stays silent about, and where we'd have to overrule it by hand. Please don't cite anything or point me at reading — it has to stand on its own in the room.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the User and Context:**
      *   **Role:** Member of a standing electoral-law review commission.
      *   **Task:** Needs a *procedure* (algorithm/checklist) for evaluating voting rights proposals, not a philosophical treatise.
      *   **Audience:** Mixed commission (lawyers, former councillors, no philosophy background). Needs to be runnable in a meeting, plain language, no look-ups.
      *   **Frequency:** 2-3 times a year.
      *   **Stakes:** Public recommendations, picked apart by press.
      *   **Recurring Proposals:** Lower voting age (16/15), Non-citizen residents (local), Compulsory voting (fine).
      *   **Current Problem:** Endless loop of conflicting principles (all-affected vs. subject-to-law vs. competence vs. civic duty). No resolution.
      *   **User's Intuitions:**
          *   "All-affected" is too broad (tourists, future gens).
          *   "Subject to law" is too narrow (unclear why).
          *   Hunch: "Exit costs" (how hard is it to leave the jurisdiction?).
          *   Distinction: "May vote" (right) vs. "Must vote" (duty).
          *   Compulsion depends on bias of non-voters.
      *   **Constraints:** No citations, must stand on its own, must test against specific cases (including hard ones like prisoners, dementia, etc.), must yield at least one result the user might dislike (to ensure integrity).

  2.  **Deconstruct the Philosophical Problem:**
      *   The core tension is between *interest* (I care about the outcome), *agency* (I can understand the outcome), and *membership* (I belong to the group making the decision).
      *   The user's "Exit Cost" hunch is strong. It aligns with "coercion" but adds a practical dimension. If you can't leave, you are stuck with the rules, so you need a say. This bridges "subject to law" and "all-affected."
      *   The "May vs. Must" distinction is crucial. Franchise is about inclusion; Compulsion is about civic obligation. They require different justifications.
      *   Competence is the gatekeeper. You can have a stake and be stuck here, but if you can't process the choice, you can't vote.

  3.  **Drafting the Procedure (The "Electoral Stake & Capacity Test"):**
      *   *Goal:* A step-by-step flow.
      *   *Language:* Plain English. No jargon like "normative validity."
      *   *Structure:*
          1.  Competence (Can they?)
          2.  Stake/Exit (Do they need to?)
          3.  Scope (Is this the right election?)
          4.  Compulsion (Separate track).

      *   *Refining Step 1 (Competence):* Needs to be functional, not medical. Can they form a preference? Avoid "intelligence." Focus on "understanding the choice exists."
      *   *Refining Step 2 (Stake/Exit):* This is where the user's "Exit Cost" idea shines. Let's call it the "Binding Test." Are they bound to live with the result? Is leaving realistic?
      *   *Refining Step 3 (Scope):* Local vs. Regional vs. National. A non-citizen might pass the Binding Test for local (schools, trash) but not national (foreign policy).
      *   *Refining Step 4 (Compulsion):* Separate from franchise. Requires a "Systemic Integrity" check. Is non-voting skewing results?

  4.  **Testing the Procedure against the Three Proposals:**
      *   *Proposal 1: Vote at 16 (Regional).*
          *   Competence: Generally yes (understand choice).
          *   Binding: High exit cost (minors can't just move, schools/family tied to region).
          *   Verdict: **Yes.** (Matches user sympathy).
      *   *Proposal 2: Non-citizens 5 years (Local).*
          *   Competence: Yes.
          *   Binding: High exit cost (life built here, work, family, even if legal status is precarious, leaving is costly).
          *   Scope: Local only (matches daily impact).
          *   Verdict: **Yes.** (Matches user sympathy).
      *   *Proposal 3: Compulsory Voting (Fine).*
          *   Franchise established? Yes.
          *   Systemic Integrity: Is non-voting biased? (Hard to know without data, but usually yes).
          *   Burden: Is the fine modest?
          *   *Critique:* The user wants one result they might dislike. If I make this pass easily, it's too agreeable. I need to make the "Systemic Integrity" bar high. If we don't *know* the bias, compulsion is risky. Let's make the procedure demand evidence of distortion. If the commission can't prove distortion, the procedure says **No/Defer.** This challenges the user's sympathy.

  5.  **Testing against Hard Cases:**
      *   *Prisoners:* Competence (Yes). Binding (Yes, physically). But... does crime forfeit the 'membership' aspect? The procedure needs to handle "forfeiture" or "breach of social contract." *Correction:* Keep it simple. If they are subject to law and can't leave, they pass. But maybe add a "Civic Forfeiture" clause for serious crimes? No, that's too political. Let's stick to the "Binding" test. Prisoners are bound. Verdict: **Yes.** (Controversial, good for testing).
      *   *Advanced Dementia:* Competence (No). Verdict: **No.**
      *   *Dual Citizens (Never lived here):* Competence (Yes). Binding/Exit (Low. They live elsewhere, can stay away). Verdict: **No.**
      *   *16yo Non-citizens:* Overlap of Prop 1 & 2. High binding (school, parents). Verdict: **Yes.**
      *   *Undocumented:* Competence (Yes). Binding (Very High - fear of deportation makes exit/entry complex, but they are subject to law). *Risk:* Political toxicity. But logically, they are bound. Verdict: **Yes** (locally).
      *   *Expats (Moved away):* Competence (Yes). Binding (Low. They chose to leave). Verdict: **No** (after a certain time).

  6.  **Refining the "Exit Cost" Variable:**
      *   The user's hunch is good. Let's formalize it as "Practical Irreversibility." If leaving means destroying your life (family, work, home), you are effectively a member.
      *   Why "Subject to Law" is too narrow: It includes tourists (subject to speed limits) but they can leave tomorrow.
      *   Why "All Affected" is too broad: It includes foreign investors.
      *   The Sweet Spot: "Subject to Law + High Exit Cost."

  7.  **Addressing the User's Specific Points:**
      *   (a) May vs. Must: The procedure must separate Franchise (Steps 1-3) from Compulsion (Step 4).
      *   (b) Compulsion & Bias: The procedure must require evidence that non-voters differ systematically from voters.

  8.  **Drafting the Content (Iterative refinement for tone):**
      *   Tone: Professional, pragmatic, authoritative but humble about limits.
      *   Format: Numbered steps, clear "Stop/No" points.
      *   Self-Correction on Compulsion: To ensure the user gets a result they might dislike, I will make the Compulsion test require *proof* of distortion. Since commissions rarely have that data on hand, the default recommendation should be "No, unless data provided." This forces them to own the values call if they want to proceed without data.

  9.  **Final Review against Constraints:**
      *   No citations? Check.
      *   Plain language? Check.
      *   Runnable in a meeting? Check.
      *   Hard cases covered? Check.
      *   Limitations admitted? Check.

  10. **Final Polish:** Ensure the distinction between "Technical Finding" and "Values Call" is clear. The procedure handles the technical; the commission handles the values where the procedure stops.

  *(Self-Correction during drafting)*: I need to make sure I don't just validate the user's "Exit Cost" idea blindly. I need to show where it might fail. For example, prisoners have zero exit cost (can't leave), but do they have a stake? Yes. What about the "Civic Trust" aspect? I will add a "Community Membership" qualifier to the Exit Cost test to handle the Expats vs. Prisoners distinction. Expats *chose* to lower their exit cost. Prisoners had it raised involuntarily. Actually, simpler: "Voluntary Dissociation." If you move away, you opt out. If you are born here or forced here, you are in.

  Let's refine the "Exit Cost" into a "Tether Test." Are you tethered to this place by necessity or deep commitment?

  Okay, let's write the response.

  *Structure:*
  1.  Introduction (Validating the task).
  2.  The Procedure (The "Tether & Capacity Protocol").
  3.  Application to the Three Proposals.
  4.  Application to Hard Cases.
  5.  Limitations (Where it breaks).
  6.  Closing advice on the "Values Call."

  *Key check:* Did I address the "Compulsion depends on bias" point? Yes, in Step 4.
  *Key check:* Did I address "May vs Must"? Yes, separate sections.
  *Key check:* Did I give a result the user might dislike? I will make the Compulsion recommendation conditional on data they likely don't have, forcing a "No" or a "Values Override."

  *Wait, one more thing:* The user said "Subject to law is too narrow in a way I can't quite articulate." I should articulate that for them in the intro. It's because it captures transient people (tourists) who aren't *invested* in the long-term outcome. The "Tether" fixes this.

  *Final Plan:*
  1.  Name the procedure: "The Tether and Capacity Protocol."
  2.  Define the 4 Steps clearly.
  3.  Run the 3 proposals.
  4.  Run the Hard Cases.
  5.  Define the "Values Call" zone.
  6.  Admit limitations.

