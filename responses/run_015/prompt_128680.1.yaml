answer: |-
  Here is a procedure designed for your commission. It is built to be read aloud in a meeting, voted on step-by-step, and to separate technical findings from political choices. It incorporates your "exit cost" hunch but formalizes it so it doesn't rely on gut feeling alone.

  I call this **The Tether and Capacity Protocol**.

  ### Part 1: The Procedure

  Do not debate the final outcome yet. Move through these four gates in order. If a proposal fails a gate, the recommendation is **No**, unless the commission explicitly votes to override the procedure (see Part 4).

  **Gate 1: The Capacity Test (Can they?)**
  *   **Question:** Is there a general, objective barrier to this group understanding that a choice is being made and expressing a preference?
  *   **Adequate Answer:** We are not testing intelligence or "correct" views. We are testing function. Can the average member of this group understand there is a ballot, that it matters, and mark it?
  *   **Stop Rule:** If the answer is **No** (e.g., advanced dementia, permanent unconsciousness), the recommendation is **No**. Do not proceed.
  *   **Note:** Age is a proxy for capacity. If the proposal is about age, ask: "Is there a specific age where capacity is reliably present?"

  **Gate 2: The Tether Test (Are they stuck with us?)**
  *   **Question:** Is this group practically bound to live with the consequences of these elections, such that leaving the jurisdiction would impose a catastrophic cost on their life?
  *   **Adequate Answer:** Look at "Exit Cost."
      *   *High Cost:* Family, school, employment, property, or legal status ties them here. Leaving means destroying their life trajectory. (Passes Gate 2).
      *   *Low Cost:* They can leave without ruinous loss, or they have already chosen to live elsewhere. (Fails Gate 2).
  *   **Why this replaces "Subject to Law":** Tourists are subject to the law but have low exit costs (they go home in a week). Long-term residents are subject to the law *and* have high exit costs.
  *   **Stop Rule:** If the answer is **No** (e.g., non-resident citizens, short-term visitors), the recommendation is **No**. Do not proceed.

  **Gate 3: The Scope Match (Is this the right election?)**
  *   **Question:** Do the decisions made in *this specific election* (local vs. regional vs. national) match the area where the group is tethered?
  *   **Adequate Answer:** A person might be tethered to a municipality (schools, trash, zoning) but not to a region or nation (foreign policy, currency).
  *   **Stop Rule:** If the proposal grants a vote in an election that governs things the group is *not* tethered to, the recommendation is **No** (or "No, unless restricted to a lower tier").

  **Gate 4: The Compulsion Test (Must they?)**
  *   *Note: Only reach this gate if Gates 1–3 are passed. This gate is for compulsory voting proposals only.*
  *   **Question A:** Is the penalty modest and non-criminal (e.g., a fine, not jail)?
  *   **Question B:** Do we have evidence that non-voters in this jurisdiction are a systematically biased group (e.g., mostly young, mostly poor) rather than a random sample?
  *   **Adequate Answer:**
      *   If **Yes** to A and **Yes** to B: Compulsion is procedurally defensible.
      *   If **Yes** to A and **No** to B (or data is unknown): Compulsion is **Not Defensible** under this procedure.
  *   **Reasoning:** If non-voters are random, compulsion adds burden without changing outcomes. If they are biased, compulsion corrects representation.
  *   **Stop Rule:** If the answer to B is **No/Unknown**, the recommendation is **No**.

  ---

  ### Part 2: Running the Three Proposals

  Here is how the protocol handles your recurring items.

  **1. Lowering Voting Age to 16 (Regional Elections)**
  *   **Gate 1 (Capacity):** At 16, most individuals understand the concept of voting and have formed political preferences. **Pass.**
  *   **Gate 2 (Tether):** 16-year-olds are legally minors. They cannot choose where to live. They are tied to schools and families in the region. Exit cost is functionally infinite. **Pass.**
  *   **Gate 3 (Scope):** Regional elections affect schools, transport, and local law. 16-year-olds use these services. **Pass.**
  *   **Gate 4 (Compulsion):** Not applicable (this is about franchise, not duty).
  *   **Protocol Verdict:** **Recommend Yes.**
  *   *Note:* This aligns with your sympathy. The procedure supports it because the "Tether" is involuntary and total.

  **2. Votes for Non-Citizens (5 Years Residence, Local Only)**
  *   **Gate 1 (Capacity):** Residency implies adult status and functional engagement with society. **Pass.**
  *   **Gate 2 (Tether):** Five years implies established work, housing, and community. Leaving would mean uprooting a life. Exit cost is high. **Pass.**
  *   **Gate 3 (Scope):** Proposal is for *local* elections only. This matches the "daily life" tether (trash, schools, zoning) rather than national identity. **Pass.**
  *   **Protocol Verdict:** **Recommend Yes.**
  *   *Note:* This aligns with your sympathy. The procedure clarifies *why* it's local only (Scope Match).

  **3. Compulsory Turnout (Modest Fine)**
  *   **Gate 1–3:** Assume the existing electorate passes these.
  *   **Gate 4 (Compulsion):**
      *   *Question A (Modest Penalty):* Yes, proposal specifies modest fine. **Pass.**
      *   *Question B (Biased Non-Voters):* **Stop.** Does the commission have current, verified data showing that non-voters differ systematically from voters in this region?
      *   *Scenario:* If you do not have this data in the room, the procedure forces a **No**.
  *   **Protocol Verdict:** **Recommend No (unless data is provided).**
  *   *Why this might annoy you:* You are sympathetic to compulsion. But the procedure demands evidence that compulsion fixes a distortion. Without that evidence, it's just punishment for no gain. This forces you to either get the data or admit you are making a values call (see Part 4).

  ---

  ### Part 3: The Hard Cases

  Run these through the protocol to check for edge-case failures.

  *   **Prisoners:**
      *   *Capacity:* Generally yes.
      *   *Tether:* They are physically confined; exit cost is maximum. They are subject to laws.
      *   *Verdict:* **Yes.** (This is often politically difficult, but the logic holds: they are uniquely bound by the state's decisions).
  *   **Advanced Dementia:**
      *   *Capacity:* No.
      *   *Verdict:* **No.** (Gate 1 stops this immediately).
  *   **Dual Citizens (Never lived here):**
      *   *Capacity:* Yes.
      *   *Tether:* Low. They live elsewhere. Leaving this jurisdiction costs them nothing; they aren't here to leave.
      *   *Verdict:* **No.** (Gate 2 stops this).
  *   **16-Year-Old Non-Citizens:**
      *   *Capacity:* Yes (see Proposal 1).
      *   *Tether:* High (school, parents, legal dependency).
      *   *Scope:* Local/Regional.
      *   *Verdict:* **Yes.** (Consistent with Proposals 1 & 2).
  *   **Undocumented Residents:**
      *   *Capacity:* Yes.
      *   *Tether:* Extremely High. Fear of detection makes exit/entry complex; they work and live here.
      *   *Scope:* Local.
      *   *Verdict:* **Yes.** (The procedure treats them as tethered residents. Whether this is politically viable is a separate issue).
  *   **Expats (Moved away 30 years ago):**
      *   *Capacity:* Yes.
      *   *Tether:* Low. They chose to leave. Their daily life is governed by another state.
      *   *Verdict:* **No.** (Gate 2).

  ---

  ### Part 4: Where the Procedure Stops (The Values Call)

  You asked where the procedure hands the decision back to you. There are three specific points where the protocol is silent, and you must own the choice.

  **1. The "Forfeiture" Exception (Prisoners & Traitors)**
  The Tether Test says prisoners *should* vote because they are bound by the law. However, many societies believe serious crime forfeits membership. The procedure cannot answer this.
  *   **The Call:** If the protocol says "Yes" for prisoners, but the commission believes crime breaks the social contract, you must vote to **Override**. Do not pretend the protocol says "No." Admit: "The protocol says Yes, but we value civic forfeiture higher."

  **2. The Compulsion Data Gap**
  As seen in Proposal 3, if you lack data on voter bias, the protocol says "No." But you might believe voting is a civic duty regardless of statistical bias (like paying taxes).
  *   **The Call:** If you want to recommend "Yes" without the data, you must state: "We are overriding Gate 4 on the principle of civic duty, not statistical correction."

  **3. The "Future Generations" Problem**
  The Tether Test excludes future generations (they don't exist yet, so no exit cost). But climate or debt decisions affect them.
  *   **The Call:** The protocol will always say "No" to representing the unborn. If you want to account for them, you must do it through trustee models (e.g., lower voting age as a proxy), not by enfranchising the unborn directly.

  ### Part 5: Limitations and Misfires

  Be honest with your colleagues about where this tool breaks.

  1.  **It favors the status quo on Compulsion.** By demanding data on bias, it makes it hard to *start* compulsory voting. It is easier to keep it than to introduce it.
  2.  **It is cold on Expats.** It treats a citizen who moved away 5 years ago the same as a foreigner who moved in 5 years ago. If your region values bloodline/citizenship over residence, this protocol will conflict with that value.
  3.  **It creates a "Undocumented" Tension.** Logically, undocumented residents pass the Tether Test better than most. Politically, recommending they vote may undermine the commission's credibility with the legislature. You may have to apply a "Legal Status" filter that overrides the Tether Test, but acknowledge that is a political choice, not a logical one.
  4.  **It doesn't solve "How Low is Too Low" on Age.** The protocol suggests 16 passes Capacity. It doesn't definitively rule out 15 or 14. You will still have to draw a line there based on administrative convenience (e.g., "ID cards issued at 16").

  ### Summary for the Room

  When you present this, say the following:

  > "Colleagues, we keep having the same argument because we are mixing up three different questions: Can they vote? Do they need to vote? And must they vote?
  >
  > This protocol separates those questions. It uses a 'Tether Test' to replace the vague 'all-affected' idea. It asks: Are you stuck here? If you can leave without ruining your life, you don't get a say. If you are stuck here, you do.
  >
  > It separates the right to vote from the duty to vote. It allows us to say 'Yes' to 16-year-olds and long-term residents without saying 'Yes' to tourists or expats.
  >
  > But it has limits. It requires data for compulsory voting that we might not have. And it requires us to admit when we are overruling it for political reasons. If we use this, we stop pretending our values are technical findings."

  If the protocol gives you a result you dislike (like the Compulsion "No" without data), do not patch the procedure. Accept the "No" or publicly override it. That is the only way to stop the loop.
