answer: |-
  This is a profound observation that cuts to the core of how institutions model agency, time, and value. You have identified a structural hypocrisy: institutions preach **consequentialist decision theory** in their manuals but operate on **narrative virtue ethics** in their incentives.

  Here is an analysis of the philosophical presuppositions of each logic, a proposal for their reconciliation, and the concrete institutional changes that would follow if we treated the persistence logic as a feature rather than a bug.

  ### 1. The Formal Stopping-Rule Framework: Time-Slice Consequentialism

  The formal framework (adaptive trials, NPV gate reviews) presupposes a specific, narrow conception of practical rationality rooted in **neoclassical decision theory** and **act consequentialism**.

  *   **Ontology of the Agent:** The agent is modeled as a **time-slice**. The decision-maker at $t_2$ is normatively distinct from the decision-maker at $t_1$. There is no intrinsic moral or rational binding force exerted by the past self upon the present self, except insofar as the past self has altered the physical state of the world (e.g., built a factory).
  *   **Normative Weight:** Only **future causal leverage** carries weight. This is the "Markov Property" of rationality: the optimal decision depends only on the current state and future probabilities, not the path taken to arrive there.
  *   **View of Value:** Value is strictly **instrumental**. An investment is a ticket to a future payoff. If the ticket no longer buys a payoff, it is waste. To honor it is to commit the "sunk cost fallacy," defined as allowing irrecoverable costs to influence marginal decisions.
  *   **Philosophical Lineage:** This aligns with **David Hume's** bundle theory of self (no enduring "I" to hold obligations) and **J.J.C. Smart's** act utilitarianism (judge the act by its immediate consequences). It treats rationality as an optimization problem over a forward-looking horizon.

  **Limit:** This framework struggles to account for **coordination over time**. If every time-slice agent optimizes locally, the extended agent may suffer from dynamic inconsistency (e.g., abandoning long-term projects whenever short-term noise spikes).

  ### 2. The Persistence-Rewarding Structure: Diachronic Agency and Narrative Value

  The structural reward for persistence presupposes a richer, more complex view of agency, closer to **planning theory** and **narrative identity**.

  *   **Ontology of the Agent:** The agent is **diachronic**. The institution (or the project team) is a single entity extended over time. The "prior self" (the initial investors/engineers) and "current self" are parts of a whole.
  *   **Normative Weight:** Past commitments generate **present obligations**. This is not necessarily mystical; it is grounded in **Michael Bratman's** theory of planning agency. Intentions formed in the past constrain present choices to ensure stability. Abandoning a project is not just a financial calculation; it is a breach of the "plan" that coordinates the actions of many actors.
  *   **View of Value:** Value is partly **constitutive** and **signaling**.
      1.  *Constitutive:* Completing a narrative arc (starting a trial, finishing a trial) has epistemic value even if the result is null. An unfinished trial yields no data; a finished negative trial yields definitive data.
      2.  *Signaling:* Persistence signals **reliability**. An institution that abandons projects at the first sign of futility may be rational in isolation, but it becomes a risky partner for future collaboration.
  *   **Philosophical Lineage:** This aligns with **Christine Korsgaard's** constitution of agency (we constitute ourselves as unified agents through commitment) and **Marya Schechtman's** narrative self-constitution (a life/institution is a story; breaking the story damages the identity).

  **Limit:** This logic is vulnerable to **escalation of commitment**. Without constraints, it justifies throwing good money after bad to preserve a narrative, leading to catastrophic losses (e.g., the Concorde fallacy).

  ### 3. Reconciliation: Reputation as a Future Asset

  Are these logics genuinely in tension? **Yes, normatively, but No, functionally.**

  They are in tension if we assume the persistence logic is about *honoring the past for its own sake*. However, they can be unified if we reinterpret the persistence logic as **forward-looking reputation management**.

  *   **The Unified Account:** The "sunk cost" is not normatively relevant *in itself*, but the *fact that others perceive it as relevant* is a future state that matters.
      *   If an institution abandons a high-sunk-cost project, it signals to the market that its initial vetting was poor or that it lacks resilience. This increases the cost of capital for *future* greenfield projects.
      *   Therefore, continuing a brownfield project is not irrational honoring of the past; it is a rational investment in **institutional credibility**.
  *   **Individual vs. Collective:** The tension often dissolves when distinguishing levels.
      *   *Individual Rationality:* For the specific project manager, quitting might maximize the specific project's NPV.
      *   *Collective Rationality:* For the institution, finishing maximizes the ecosystem's trust. The "bias" is actually a **second-order heuristic** to prevent the erosion of collective commitment mechanisms.

  **However,** a genuine tension remains if the reputation cost is smaller than the waste cost. If finishing a doomed project costs \$100M but saves \$1M in reputation, the persistence logic is still economically irrational, yet institutions do it. This suggests the **Narrative Value** (internal coherence) is being weighted higher than the **Consequentialist Value** (external utility).

  ### 4. Concrete Implications: Designing for "Rational Persistence"

  If we stop treating persistence purely as a cognitive bias and acknowledge it as a mechanism for diachronic coherence and epistemic closure, we must redesign the institutions. We cannot simply preach "ignore sunk costs" while rewarding completion. We must make the trade-off explicit.

  #### A. Rewriting Futility-Stopping Rules
  Current rules ask: *Is the probability of success worth the future cost?*
  **New rules should ask:** *Is the value of definitive closure (even if negative) worth the future cost?*
  *   **Change:** Adaptive protocols should include a **"Completion Value" parameter**. This quantifies the epistemic value of a definitive "no" versus an ambiguous "stop early."
  *   **Change:** Stopping boundaries should be asymmetric. It should be harder to stop for futility than for efficacy, acknowledging that negative data requires higher certainty to be trustworthy than positive data (due to publication bias and the cost of abandonment).

  #### B. Allocating Scientific and Corporate Credit
  Currently, credit is skewed toward *success* (positive results, on-budget completion). This incentivizes hiding futility until it's too late to stop.
  *   **Change:** Create **"Negative Completion" Credits.** In academic tenure or R&D bonuses, completing a trial that proves a hypothesis false should be weighted nearly equally to one that proves it true.
  *   **Change:** Implement **"Graceful Termination" Bonuses.** If a gate review kills a project, the team should be rewarded for the speed and clarity of the shutdown, decoupling "killing a project" from "failure of the team." This reduces the pressure to persist just to save jobs.

  #### C. Designing Review-Board Incentives
  Gate reviews currently suffer from **loss aversion**. Reviewers fear being responsible for killing a project that might have worked (Type I error in management) more than funding one that won't (Type II error).
  *   **Change:** **Brownfield Discounts.** In NPV calculations, explicitly discount the value of existing work-in-progress unless it has verified transferable value. Force the "Greenfield Test": *If we didn't have this half-built factory, would we build it today?* If the answer is no, the sunk cost must be written off immediately in the accounting, removing the psychological burden.
  *   **Change:** **Reputation Escrows.** If a project is continued primarily for reputation reasons, the cost of that reputation maintenance should be allocated to the **Marketing/Comms budget**, not the R&D budget. This makes the "persistence premium" visible. If leadership wants to spend \$10M to signal stability, let it come from the signal budget, not the innovation budget.

  ### Summary

  The tension you observe exists because institutions are trying to run **Consequentialist Software** on **Narrative Hardware**.

  The formal rules assume we are utility-maximizing time-slices. The structural incentives treat us as story-telling entities for whom abandonment is a form of identity death. A unified account recognizes that **maintaining the capacity for future commitment is itself a future utility.**

  To resolve this, we must stop hiding the "persistence premium" inside R&D budgets under the guise of bias. We must explicitly price the value of coherence, reputation, and epistemic closure. If a project is worth finishing for the story it tells the market, fund it as a marketing investment. If it is worth finishing for the data it yields, fund it as a scientific investment. But do not pretend the money already spent is the reason to stay.
