prompt: |-
  I've been trying to make sense of a tension in how institutions treat past investment. Adaptive clinical-trial protocols and large-scale capital-project gate reviews both embed explicit decision rules that treat prior expenditure as normatively irrelevant—evaluators are instructed to weigh only future costs and benefits, and honoring sunk costs is classified as a cognitive bias to be engineered away. Yet the same institutions structurally reward persistence: a trial that has already enrolled hundreds of subjects faces strong organizational pressure to reach its endpoint even when conditional power is near zero, and a capital project that has consumed years of engineering labor survives a gate review far more easily than a greenfield proposal with an identical net present value. What philosophical conception of practical rationality does the formal stopping-rule framework presuppose—does it require that only future-oriented states carry normative weight, or is it compatible with views on which past commitments generate present obligations? Conversely, what view of value or agency does the persistence-rewarding structure presuppose—perhaps that rationality includes maintaining diachronic or narrative coherence, that prior effort can partly constitute present value, or that abandoning a course of action can wrong the prior self who initiated it? Are these two institutional logics genuinely in tension, or can a unified account—say, one that distinguishes individual from collective rationality, or first-person from third-person evaluation—reconcile them? And if we took the persistence logic seriously rather than treating it purely as a failure mode, what concrete changes would have to follow in how we write futility-stopping rules, allocate scientific credit, or design review-board incentives?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Core Tension:** Institutions formally reject sunk cost fallacy (via adaptive trial protocols, capital gate reviews) but informally/structurally reward persistence (pressure to finish trials despite low power, preference for brownfield over greenfield projects).
      *   **Question 1 (Formal Framework):** What philosophical conception of practical rationality underlies the formal stopping-rule framework? (Future-oriented only? Compatible with past commitments?)
      *   **Question 2 (Persistence Logic):** What view of value or agency underlies the persistence-rewarding structure? (Diachronic coherence? Narrative value? Obligations to prior self?)
      *   **Question 3 (Reconciliation):** Are these logics genuinely in tension, or can they be unified (individual vs. collective, first-person vs. third-person)?
      *   **Question 4 (Practical Implications):** If we took the persistence logic seriously (not just as bias), what concrete changes would follow (stopping rules, credit allocation, incentives)?

  2.  **Analyze Question 1: The Formal Stopping-Rule Framework:**

      *   *Philosophical Basis:* Consequentialism, specifically Act Utilitarianism or Expected Utility Theory.
      *   *Key Tenet:* Only future states matter. The past is "sunk."
      *   *Agency Model:* The agent is a "time-slice" or a sequence of time-slices where continuity doesn't generate intrinsic obligation. The decision node is atomic.
      *   *Normative Weight:* Exclusively forward-looking. $V(action) = \sum P(outcome) \times Utility(outcome) - Cost(future)$. Past cost = 0.
      *   *Compatibility:* Strictly speaking, it is *incompatible* with views where past effort creates intrinsic present obligation, unless that obligation is instrumental (e.g., reputation damage from quitting).

  3.  **Analyze Question 2: The Persistence-Rewarding Structure:**

      *   *Philosophical Basis:* Virtue Ethics (perseverance as a virtue), Narrative Identity (Schechtman), or Commitment/Contractualism (implicit social contract with prior investors/self).
      *   *Key Tenet:* Actions have meaning within a temporal arc. Abandonment breaks the narrative.
      *   *Agency Model:* Diachronic Agency. The agent is extended over time. The "prior self" made an investment that the "current self" inherits as a duty.
      *   *Value:* Effort itself may have constitutive value (labor theory of value echoes) or signaling value (trustworthiness).
      *   *Rationality:* Rationality includes maintaining coherence over time to preserve identity or social standing.

  4.  **Analyze Question 3: Reconciliation (Tension vs. Unity):**

      *   *Is it a tension?* Yes, at the level of *normative justification*. One says "ignore the past," the other says "honor the past."
      *   *Can it be unified?*
          *   *Distinction 1: Epistemic vs. Social.* Formal rules optimize for *truth/efficiency* (epistemic). Persistence optimizes for *trust/cohesion* (social).
          *   *Distinction 2: First-order vs. Second-order.* Formal rules are first-order decision criteria. Persistence is a second-order heuristic to prevent premature abandonment due to noise/uncertainty (though often misapplied).
          *   *Distinction 3: Individual vs. Collective.* Individual rationality might dictate quitting. Collective rationality (maintaining the institution's reputation for finishing) dictates staying.
          *   *Best Synthesis:* **Institutional Credibility as a Future Asset.** The "sunk cost" of the past is actually an investment in *future* credibility. Quitting now saves money but damages future ability to raise capital/recruit. Thus, persistence *is* forward-looking rationality, just with a broader utility function that includes reputation.

  5.  **Analyze Question 4: Concrete Changes if Persistence Logic is Validated:**

      *   *If we admit past effort matters:*
      *   *Stopping Rules:* Need "Completion Value" parameters. Not just $P(success) \times Value$, but $Value(Completion) + Penalty(Abandonment)$.
      *   *Credit Allocation:* Credit for "negative results" needs to be higher. Credit for "completion" regardless of outcome.
      *   *Incentives:* Review boards penalized for killing projects with high sunk costs unless failure is certain. "Brownfield bonuses."
      *   *Ethics:* Informed consent in trials might need to include the risk of futility stopping vs. the value of completion for scientific record.

  6.  **Drafting the Response (Iterative Refinement):**

      *   *Introduction:* Acknowledge the depth of the observation. It's a clash between *Decision Theory* and *Narrative/Social Ontology*.
      *   *Section 1: The Formal Framework (The "Sunk Cost" Orthodoxy).* Identify it as Consequentialist/Expected Utility. The agent is a momentary maximizer. Past is causally inert.
      *   *Section 2: The Persistence Logic (The "Commitment" Ontology).* Identify it as Virtue Ethics/Narrative Identity. The agent is diachronic. Abandonment is a vice (irresolution) or a breach of trust.
      *   *Section 3: Reconciliation.* This is the crux. Don't just say "one is right." Argue that the persistence logic is often a *proxy* for reputation management. It's not about the *money* spent, it's about the *signal* sent. This reconciles them under a broader consequentialism. However, there remains a genuine tension if the signal value outweighs the actual utility.
      *   *Section 4: Institutional Design Implications.* If we stop calling it a bias and treat it as a feature:
          *   Modify NPV calculations to include "Abandonment Costs" (reputation).
          *   Change trial registries to value completed futility studies.
          *   Gate reviews need "Transition Costs" not just "Sunk Costs."
      *   *Conclusion:* Summarize. The tension reveals that institutions are not just utility calculators but social organisms.

  7.  **Refining the Philosophy:**
      *   Make sure to mention *Bratman* on planning agency (intentions constrain future choice).
      *   Mention *Strotz* or *Ainslie* on dynamic inconsistency (persistence solves this).
      *   Distinguish between *sunk cost fallacy* (irrational) and *sunk cost signaling* (rational).

  8.  **Refining the Practical Examples:**
