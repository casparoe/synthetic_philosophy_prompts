      *   Capital Projects: The "greenfield bias" vs. "brownfield inertia."

  9.  **Final Polish:** Check tone. Needs to be analytical, rigorous, but accessible. Ensure all parts of the prompt are answered. (Self-Correction: Make sure I don't just validate the persistence logic as "reputation." I need to address the "narrative coherence" aspect the user raised.)

      *   *Add:* The idea that "completion" has intrinsic epistemic value even if the hypothesis is null. A finished negative trial is better than an unfinished ambiguous one.

  10. **Final Structure:**
      1.  Introduction: The clash of ontologies.
      2.  The Formal Framework: Consequentialism & Time-Slice Agency.
      3.  The Persistence Logic: Narrative Identity & Diachronic Rationality.
      4.  Reconciliation: Reputation, Coordination, and Epistemic Closure.
      5.  Concrete Implications: Redesigning the Institutions.
      6.  Conclusion.

