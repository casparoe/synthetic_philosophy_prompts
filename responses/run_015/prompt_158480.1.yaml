          *   *Issue:* If I know I'm "Low Calibration," I should just copy the "High Calibration" person. But I don't know who they are.
          *   *Fix:* The "Calibration Score" is a private hint about *your* reliability. 5 people get "Unreliable" (their intuition is noisy), 11 get "Reliable." But the "Unreliable" ones aren't told they are unreliable; they are told they are "Independent Thinkers" (actually, the prompt says "badly overconfident and have no idea").
          *   *Actually, let's stick closer to the prompt:* The pre-quiz determines the score. 4 people get a *fake* high score (Overconfident). 12 get accurate scores.
          *   *Wait, simpler:* Just assign a hidden "Weight" to their opinion. But they don't know it.
          *   *Best interpretation of prompt:* The pre-quiz creates a feeling of "I know how good I am." In Round 3, everyone sees same data. They must state confidence. The scoring penalizes overconfidence. The "disagreement" comes from the fact that people will naturally assign different probabilities to the same data based on their self-assessed calibration.
          *   *Wait, if they see the same data, why disagree?* In the game, they might not disagree on the *Jar*, but they disagree on the *Confidence*.
          *   *Philosophical pivot:* The disagreement isn't about the beads (data), it's about the *interpretation* of the data.
          *   *Let's refine Round 3:* Everyone sees the same draws. They must write a probability. Then they are paired. They see the partner's probability. They can revise. *Crucially:* They are told "Some of you performed better on the initial quiz, but you don't know who."
          *   *Effect:* Do I trust my number or move toward theirs? If I move toward theirs, and they are "Overconfident/Low Cal," I lose points. If I stay steadfast, and I was wrong, I lose points.

      *   *Scoring Table:* Needs to be extremely clear.
          *   Correct Answer:
              *   50-60% confidence: 1 Chip
              *   70-80% confidence: 2 Chips
              *   90-100% confidence: 3 Chips
          *   Incorrect Answer:
              *   50-60% confidence: 0 Chips
              *   70-80% confidence: -1 Chip
              *   90-100% confidence: -3 Chips
          *   *Why:* This punishes being confidently wrong harder than it rewards being confidently right (risk aversion), encouraging honest calibration.

      *   *Pre-Mortem (What goes wrong):*
          *   People lying about draws. -> *Fix:* Honor system + facilitator watches.
          *   Math confusion. -> *Fix:* Keep it to chips, no formulas.
          *   "The Guy" who argues. -> *Fix:* Time limits, "Write first, talk second."
          *   Collusion. -> *Fix:* Random pairing.
          *   Round 3 confusion. -> *Fix:* Clear script.

      *   *Limitations:*
          *   Real life doesn't have a "Truth" revealed at the end.
          *   Real life doesn't give you a calibration score.
          *   The game makes "Evidence" quantitative (beads), real life is qualitative.

  4.  **Refining the Output:**
      *   Tone: Practical, facilitator-focused, slightly philosophical but grounded.
      *   Structure:
          1.  Verdict on the Design (Does it work?).
          2.  The Setup (Props & Numbers).
          3.  The Scoring (The Table).
          4.  The Run-of-Show (Timeline).
          5.  The Debrief (Mapping mechanics to philosophy).
          6.  The Pre-Mortem (Troubleshooting).
          7.  The Honest Limitation (What the game misses).

  5.  **Self-Correction/Polishing during drafting:**
      *   *Round 3 Check:* The prompt asks for a final vote on the rule *before* they learn who was overconfident. This is crucial. It simulates choosing a social epistemology without knowing your place in the hierarchy.
      *   *Jar Math:*
          *   Round 1: Jar is 80% Red / 20% Blue (or vice versa). Coin flip to decide which jar.
          *   Round 2: Jar is 90% Red. "Seniors" draw 3. "Juniors" draw 1.
          *   Round 3: No jar. Just a sequence projected. "Based on past data, this sequence comes from the Red Jar 70% of the time." (Give them a base rate).
      *   *Wait, Round 3 needs disagreement.* If I give them a base rate and a sequence, Bayes theorem gives one answer. If everyone calculates, they agree.
      *   *Solution:* Don't give a base rate. Just show the sequence. Ask "What is the probability the next bead is Red?" People have different intuitions (Gambler's fallacy vs. Hot hand). *That* is the disagreement source. The "Calibration Score" adds the layer of "Should I trust my intuition?"
      *   *Actually, keep it simpler:* Round 3 is about *Peerhood*. Everyone sees the same evidence. The disagreement is purely about how much weight to give their own judgment vs. the other person's judgment.
