          *   Round 1: Equal evidence, disagree -> Conciliationism should win.
          *   Round 2: Unequal evidence (3 draws vs. 1 draw) -> Steadfastness (for the better informed) should win.
          *   Round 3: Same evidence, different priors/calibration -> The "Peer Disagreement" hard case.
      *   **Specific Needs:**
          *   Validate/fix the Round 3 mechanic (calibration scores).
          *   Exact numbers (jar compositions, sequences, payoff table).
          *   90-minute timeline.
          *   Debrief script mapping game moments to philosophical concepts.
          *   "Pre-mortem": What will go wrong & how to fix it.
