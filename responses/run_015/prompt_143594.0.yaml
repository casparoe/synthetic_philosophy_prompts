  ### Jargon Explanation
  Before testing your principle, here are the terms you encountered:
  *   **Totalism:** The value of a world is the simple sum of all welfare in it. (Implies the Repugnant Conclusion: enough +2 lives beat ten billion +100 lives).
  *   **Critical-Level Totalism:** The value of a world is the sum of (each person's welfare minus a fixed threshold, e.g., 25). Lives below the threshold count negatively, even if worth living. (Blocks the Repugnant Conclusion, but implies adding +1 lives makes things *worse*).
  *   **Lexical Threshold:** Lives above a certain quality (e.g., +50) matter infinitely more than lives below it. (Blocks Repugnant Conclusion without penalizing +1 lives, but creates a discontinuity).
  *   **Person-Affecting View:** An outcome is only better/worse if it is better/worse for some specific person. (Handles asymmetry, struggles with different-number choices).

