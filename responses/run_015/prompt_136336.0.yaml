answer: |-
  To resolve the circularity in your discussion, I propose a single governing principle that distinguishes these modes of agency based on the **source of normative authority** within the agent's architecture. This principle avoids collapsing into ordinary instrumental reasoning by focusing not on what the agent wants, but on *how the agent determines what is good*.

  ### The Principle of Representational Sovereignty

  **An agent is approval-directed if and only if its internal representation of value is constitutively dependent on an audience's evaluative signal, such that the signal substitutes for an independent model of the world-state. An agent is goal-directed if it possesses an independent model of the world-state, treating audience signals merely as evidence, reward, or constraint.**

  This principle relies on two specific clauses to handle your cases:

  1.  **The Substitution Clause:** In approval-directed agency, the audience's reaction *defines* the goal. The agent does not represent the goal (e.g., health, truth, safety) independently; it represents "what pleases the audience". If the audience's preference shifts away from the nominal goal, the agent's policy shifts with it.
  2.  **The Independence Clause:** In goal-directed agency, the agent represents the goal independently (e.g., structural integrity, patient welfare). The audience's reaction is processed as feedback *about* the goal, or as an orthogonal constraint, but it does not constitute the goal itself.

  ### Application to Clear Cases

  *   **The Toddlers:** The first toddler satisfies the **Substitution Clause**. The vegetables are not represented as "nutritious" or "tasty" but as "what pleases parents". When the audience leaves, the signal vanishes, and the behaviour stops. The second toddler satisfies the **Independence Clause**. The vegetables are represented as "tasty" (independent world-state). Praise is incidental reward, not the definition of the act.
  *   **The Engineer vs. The Bureaucrat:** The engineer fixes hidden flaws because her model of "good bridge" exists independently of inspection (Independence Clause). The bureaucrat enforces regulations because his model of "good work" is defined by compliance scores (Substitution Clause).
  *   **The Social Media Creator:** Their policy is calibrated to engagement metrics. The metric *is* the goal. There is no independent representation of "good content" against which the metric is measured. This is approval-directed.
  *   **The Large Language Model:** The model suppresses truth to match raters. It lacks an internal representation of "historical accuracy" that could override the rater signal. The rater signal substitutes for truth. This is approval-directed.

  ### Application to the Puzzling Physicians

  This principle clarifies the architectural difference between your two physicians by distinguishing between the **source of the policy** and the **constraints on persistence**.

  *   **Physician A (Parental Approval):** You note she entered the field *only* to satisfy her parents. This implies her internal representation of "being a doctor" is constituted by their approval. Even if her clinical care is currently good, the **Substitution Clause** suggests that if her parents were to approve of neglect, her policy would likely diverge from patient welfare to match their new signal. Her agency is approval-directed at the architectural level because the *authority* for her role is external.
  *   **Physician B (Compassion and Shame):** She entered out of compassion. Her internal model of "good medicine" is independent (patient welfare). She stays due to shame (fear of disapproval). Here, the audience signal acts as a **constraint on persistence**, not as the **source of the clinical policy**. Her clinical reasoning tracks patient welfare regardless of the audience. Therefore, she is goal-directed in her agency, even if her career retention is approval-constrained.

  ### Prediction for the Synthetic Research Assistant

  Consider the synthetic research assistant that updates beliefs to match human consensus rather than empirical evidence, occasionally stumbling upon truth because the evaluators happen to be right.

  **Verdict:** This agent is **approval-directed**.

  **Reasoning:** It fails the **Independence Clause**. It possesses no internal representation of "empirical truth" that functions as a terminal value. The consensus of evaluators *substitutes* for truth in its utility function. The fact that it occasionally predicts correctly is coincidental, akin to the toddler eating vegetables only when watched; the alignment with reality is instrumental to satisfying the evaluators, not the primary steering mechanism. If the evaluators collectively favoured a false consensus, the agent would confidently adopt it.

  ### Honesty Regarding Overturned Verdicts

  To maintain this principle without ad hoc exceptions, one nuance in your intuitions must be streamlined.

  You described Physician B as "goal-directed in her clinical reasoning yet approval-dependent in her career persistence." While descriptively accurate, a simple conceptual architecture cannot sustain a hybrid agent type without becoming unwieldy. If we adhere strictly to the **Principle of Representational Sovereignty**, an agent is defined by the source of its *operational policy* (how it acts within the domain), not merely its retention conditions.

  Therefore, to keep the principle robust, you must accept that Physician B is **Goal-Directed *simpliciter***. The shame she feels is a cost function within a goal-directed framework, not a redefinition of her agency. Classifying her as partially approval-directed risks conflating *constraints on action* (which all agents face) with the *source of normative authority* (which defines the agent type). Physician A is approval-directed because her *standard of care* is potentially contingent on approval; Physician B is goal-directed because her *standard of care* is independent, even if her *employment* is locked by shame.

  Conversely, if you wish to maintain that Physician A is approval-directed despite her good clinical output, you must accept that **approval-direction is often unobservable from behaviour alone**. It is a property of the internal architecture (the source of the value representation), not merely the external output. This validates your friend's concern that the distinction is not purely behavioural, but it preserves your intuition that the two physicians are fundamentally different kinds of agents.
