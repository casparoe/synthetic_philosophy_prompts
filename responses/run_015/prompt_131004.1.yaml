answer: |-
  Okay, first off, your brain hurts because you've accidentally stumbled into one of the classic headaches of metaphysics (the Ship of Theseus problem), but you're right to feel like this isn't just wordplay. When you drag this out of the philosophy classroom and into a museum, the stakes get real.

  So, let's run with your friend's view—the "Constitution View." This is the idea that the statue and the clay (or marble/resin) are two distinct objects that just happen to be sharing the same space. The statue is defined by its form, history, and function, while the clay is just the stuff holding it up.

  Here's the logical fallout if we actually take that seriously, specifically for the stuff you care about.

  ### 1. Curator Labels and "Heavily Reconstructed" Pieces
  If the statue is distinct from the material, then a label that says "Marble Statue, 200 BCE" is technically a lie if 60% of it is modern resin.

  *   **The Fallout:** Curators would need to label the *concept* separately from the *matter*. Instead of dating the object by when the atoms were carved, they'd have to date the "identity" of the piece. You'd see labels like "Statue of Zeus (Form originated 200 BCE, Material constitution updated 2024)."
  *   **The Ethics:** This forces museums to be way more honest about fragmentation. Right now, they smooth over the cracks to make visitors feel like they're seeing "the thing." If the statue and the material are separate, hiding the modern filler is like hiding the fact that you're looking at a high-res JPEG of a painting instead of the canvas. It changes authenticity from "is this the original stuff?" to "is this the continuous history of the form?"

  ### 2. Restitution and Looted Artifacts
  This is where it gets wild. You asked if accepting that the statue and clay are different makes it easier or harder to return looted stuff that's been heavily repaired with modern metal or resin.

  *   **The Verdict:** It makes it **easier** to argue for restitution.
  *   **Why?** If the museum argues, "We can't return this because we added modern support beams and resin, so it's partly ours now," they are relying on the idea that the *material* defines the object. But if you accept the Constitution View (Statue $\neq$ Material), then the modern resin is just temporary scaffolding for the *actual* object, which is the cultural artifact.
  *   **The Logic:** The source country is claiming the *Statue* (the cultural entity with its specific history and form), not just a bag of atoms. The fact that Western conservators added modern filler doesn't change the identity of the Statue itself. The "Statue" belongs to the culture that created its form and meaning; the "Resin" belongs to the museum. Since you can't separate them without destroying the Statue, the Statue (with the resin inside it) goes home. The material objection becomes irrelevant because the material isn't the object.

  ### 3. Digital Twins and 3D Prints
  This is the weirdest fallout. If the form is what counts, and the material is just a vessel, then a perfect 3D-printed replica or a hyper-accurate digital twin gets a lot closer to being "the real thing" than we want to admit.

  *   **The Fallout:** If the statue is just the form sustained over time, a perfect copy shares the essential identity of the statue, even if it lacks the original atoms.
  *   **The Problem:** This devalues the "original." If I can 3D print a statue using new polymer that looks exactly like the looted one, and the *form* is what makes it the statue, then the print is arguably just a new "constitution" of the same statue.
  *   **Ethical Glitch:** It suggests that preserving the *data* of the shape is just as important as preserving the *rock*. Museums might start arguing that repatriating the physical object doesn't matter as long as the "form" is preserved digitally in their archives. It turns physical artifacts into software that can be re-installed on different hardware (clay, resin, pixels).

  ### 4. Are There Two Things on the Pedestal?
  Yes. Literally.

  If you take this view seriously, when you walk up to a reconstructed sculpture, you are looking at two co-located objects:
  1.  **The Lump:** A collection of marble, resin, and metal atoms.
  2.  **The Statue:** An artistic entity with a specific history and form.

  *   **The Practical Issue:** This messes with insurance and ownership. If someone smashes the statue, did they destroy one thing or two? Did they destroy the "Lump" (property damage) and the "Statue" (cultural heritage loss)?
  *   **The Display:** It means museums are technically displaying a hybrid. They are displaying the *Lump* as a proxy for the *Statue*. If the Lump degrades (marble erodes), the Statue might survive if you transfer the form to a new Lump (like a cast). This view basically justifies making copies to preserve the "real" object, because the "real" object is the continuity of the form, not the dust it's made of.

  ### The Bottom Line
  Your friend's view (Form > Matter) is great for **repatriation** (because it separates cultural identity from physical possession) and **preservation** (because it allows copying/restoration without losing the "object").

  But it's terrible for **authenticity** (because it makes originals interchangeable with perfect copies) and **honesty** (because it requires viewers to accept they are looking at a metaphysical concept, not just a rock).

  You're right to be skeptical because it feels like wordplay, but the wordplay is doing heavy lifting. If the statue isn't the clay, then "owning" the clay doesn't mean you own the statue. And in a debate about looted art, that distinction is everything.
