  2. "Four verdicts"
  1. **Origin History:** The standard etiological account looks backward. P exists because ancestors survived UV better. Thus, P's function remains UV screening. It keys on the *initial success* that established the trait, ignoring current environmental mismatch. The trait's identity is fixed by its genesis, making function a historical fact independent of current utility. It preserves the link between function and adaptation origin.
  2. **Maintenance History:** This variant demands current selection. Since P is currently maintained only due to linkage with H, it has no proper function of its own. It keys on *current selective pressure*. If nothing selects for P specifically, P is a spandrel or hitchhiker. This captures the intuition that function requires ongoing endorsement, avoiding the attribution of purpose to useless traits. Saying the function is "being produced en route to H" feels like cheating because it assigns function to the pathway, not the pigment.
  3. **Renewal (Counterfactual):** This looks at future selection trajectories. Since a mutation dropping P would spread, P is effectively a liability. It keys on *selective potential*. Function isn't just history; it's ongoing endorsement. Here, P has a "negative function"—it's slated for elimination. This treats function as dynamic, sensitive to what selection *would* do if variation arose, bridging history and current fitness landscapes. It acknowledges the trait is living on borrowed time.
  4. **Causal Role:** This ignores selection entirely. P contributes to the system's capacity to absorb UV. Relative to the capacity "resist UV," P functions. It keys on *current causal contribution*. The account doesn't care if the capacity is useful; it only cares that the part contributes to the whole's ability. The arbitrariness lies in choosing which capacity matters. Without selection to filter capacities, any contribution counts as a function, making the concept too broad for evolutionary explanation but useful for physiological mapping. It explains how the system works mechanically, not why it is there evolutionarily.

  3. "What's doing the work"
  The split is generated by the *decoupling of causal capacity from selective maintenance*. P retains the capacity to screen UV, but selection no longer rewards this capacity. Instead, selection maintains the pathway for H, tolerating P. This gap allows the accounts to diverge: etiology sees the past reward; causal-role sees the current capacity.

  If P were chemically inseparable from H—no mutation could drop P without killing the lizard—the "Renewal" verdict collapses. You cannot select against P if you cannot select against it independently. The etiological account remains unchanged; history is fixed regardless of current mutational availability. The causal-role account also holds; the capacity exists regardless of separability. However, the "Maintenance" view would shift: P becomes essential by linkage. The core friction is whether function requires the *possibility* of independent selection. If function tracks what selection *can* do, inseparability matters. If it tracks what selection *did*, it does not. This case isolates whether function is a historical fact or a current relational property. The stale case works because the mutation is *possible* but *absent*, keeping the selective pressure theoretical rather than actual.

  4. "Can a function expire?"
  Standard selected-effect theory treats function as indelible history. Once selected, always functional, provided the trait persists. In this view, P's function never expires; it simply becomes non-contributory to current fitness. The function explains why P is *there*, not why it *stays*. To say function expires requires modifying the account to demand recent or ongoing selection. This introduces a "time horizon" problem: how many generations back counts?

  If function cannot expire, the account accepts "zombie functions"—traits doing nothing useful yet retaining functional status. Defenders argue this is a feature, not a bug. It distinguishes why a trait exists (history) from whether it is currently adaptive. If function expired, we couldn't distinguish a recently useless trait from a never-functional spandrel. Both would be "functionless."

  However, representing expiry costs the account its conceptual simplicity. It must define a threshold for "recent enough" selection. Without expiry, the account risks disconnecting function from utility entirely. With expiry, it risks arbitrariness. The selected-effect apparatus handles expiry poorly because it is designed to track origins, not current status. It represents functions coming into existence via selection, but lacks a mechanism for deleting them other than trait elimination. Thus, P remains functional until it evolves away, making "function" a label of ancestry rather than current utility. This creates a normative gap: we feel P *shouldn't* have a function now, but the theory says it does.

  5. "What the fight is about"
  With stale cases, the dispute shifts from metaphysics to explanatory purpose. Is function-talk meant to explain why a trait exists (etiology) or what the system is currently organized to do (capacity)? The selected-effect camp prioritizes historical explanation: P is there *because* it screened UV. The causal-role camp prioritizes systemic analysis: P contributes to UV screening *now*.

  I lean towards the view that this is a disagreement about the job function-talk performs. Biology needs both. Evolutionary biology requires the etiological account to distinguish adaptation from drift. Physiology requires the causal-role account to diagnose pathology. In the cave lizard case, calling P "functional" for UV screening is true physiologically but false evolutionarily.

  What settles it is the concept of malfunction. If P degrades, is it broken? The etiological account says no; selection isn't maintaining it, so degradation is neutral. The causal-role account says yes; the capacity is diminished. If our intuition says P's degradation doesn't matter in the cave, the etiological account wins on normative force. If we say the system is less capable regardless of selection, causal-role wins. The stale case reveals that "function" is ambiguous between "historical reason for being" and "current causal contribution." The fight is over which definition serves biological explanation better in contexts where history and current utility diverge. We must choose whether function explains presence or performance.

  6. "Lecture version"
  Imagine a tool kept in a shed. It was bought to cut wood. Now you use the shed for storage, but keep the tool because it's glued to a hammer you need. Does the tool still have a function? One side says yes, because that's why it was bought. The other says no, because it doesn't do anything useful now. The debate isn't about the tool; it's about whether "function" means "why we got it" or "what it does today." In biology, this decides whether we explain traits by their history or their current job. When history and job diverge, you must choose which story matters.
