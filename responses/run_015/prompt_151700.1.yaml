prompt: |-
  So I've been going in circles on endurantism vs perdurantism and I realized I don't actually know what the standard medical practice around advance directives and Ulysses contracts commits you to, metaphysically.

  The practice, as I understand it: you fill out a living will, and the hospital asks about it on intake. While you have capacity, your current say is absolute — you can withdraw consent five minutes before surgery, for any reason or none, even if refusing kills you, and even if you signed a form saying the opposite an hour ago. But once you lose capacity, the thing flips: the document written by the earlier you starts speaking for you, and the demented you's actual present protests (I don't want the feeding tube, let me go home) get gently overruled by reference to what you "really" wanted. Meanwhile, the stickier version of this — psychiatric advance directives, where you precommit to being forcibly medicated during a future episode you know you'll refuse treatment in — gets honored way less reliably, and in a lot of places is treated as close to unenforceable. And then on the ward itself nobody can keep the story straight: when the resident with advanced dementia seems content, staff will say "she's not suffering, she seems happy" and treat that as a real reason to keep going, while giving her current *stated wishes* basically zero weight. So the present time-slice counts as a welfare subject but not as an agent, apparently.

  I want to know what theory of persistence, or of diachronic identity, this package presupposes — if any. Reconstruct the implicit view: does it only make sense if the earlier self and the later self are literally numerically the same substance wholly present at both times, so that the earlier one's will is just authoritative over its own life full stop? Or does perdurantism license all of it too, or better? I keep tripping over the fact that perdurantism isn't one package: on the worm version the earlier stage is literally a part of the same person, which looks like the strongest possible support for precedent autonomy, and on the stage version the later stage is only the same person in some derivative, comes-in-degrees sense, which gives you a natural reason for the earlier self's authority to decay as psychological connectedness decays — but then the all-or-nothing capacity threshold looks like an artifact rather than something the metaphysics wants.

  And please separate out what the practice strictly *presupposes* from what it merely fits comfortably with, and where it's underdetermined and several theories would license the identical behavior. My suspicion is that the refusal/request asymmetry in particular is doing no identity work at all and is really just an asymmetry about vetoes vs. compulsion wearing metaphysical clothing — but I'd like that argued.

  Last bit, the thing I actually can't find discussed anywhere: imagine you junked the threshold and made it graded. The directive's weight is a decreasing function of some operationalized continuity measure (memory overlap, value stability, whether the current person still endorses the old projects — pick whatever you can defend), no bright line, and the decision goes to whoever currently has the strongest continuity claim. What would that practice presuppose? Would a perdurantist have to be a revisionist about the current one? And is the honest answer that the existing binary is metaphysically underdetermined and we only have it because the law needs bright lines — or does it actually fall out of one view and not the other?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Core Topic:** The metaphysical commitments (specifically regarding persistence/diachronic identity: endurantism vs. perdurantism) of standard medical practice concerning advance directives (ADs) and Ulysses contracts.
      *   **Key Observations by User:**
          *   *Capacity Phase:* Current self has absolute veto power (even over past self's AD).
          *   *Incapacity Phase:* Past self's AD overrides current self's expressed wishes (especially in dementia).
          *   *Psychiatric ADs:* Less enforceable than somatic ADs.
          *   *Welfare vs. Agency:* Incapacitated patients are treated as welfare subjects (current happiness matters) but not agents (current wishes don't matter).
          *   *Asymmetry:* Refusal (veto) vs. Request (compulsion).
      *   **Specific Questions:**
          *   What theory of persistence does this package *presuppose*?
          *   Does it require Endurantism (numerical identity)?
          *   Does Perdurantism (worm vs. stage) fit better or worse?
          *   Distinguish between what is *presupposed* vs. what *fits comfortably* vs. what is *underdetermined*.
          *   Analyze the refusal/request asymmetry (is it metaphysical or legal/ethical?).
          *   Analyze the hypothetical "graded continuity" model: What would that presuppose? Does the binary threshold fall out of metaphysics or just legal pragmatism?

  2.  **Initial Assessment & Metaphysical Mapping:**

      *   *Endurantism:* The person is wholly present at $t_1$ and $t_2$. If $Person_{t1} = Person_{t2}$, then $Person_{t1}$'s will *should* bind $Person_{t2}$ absolutely, *unless* $Person_{t2}$ has a superior claim to authority (e.g., current autonomy). The practice treats them as the *same* person legally (hence the AD binds), but ethically prioritizes current capacity when present.
      *   *Perdurantism (Worm View):* The person is a space-time worm. $Person_{t1}$ and $Person_{t2}$ are temporal parts. The "person" is the whole worm. The AD is a command from one part to the whole. This supports precedent autonomy well (the whole worm's plan).
      *   *Perdurantism (Stage View):* $Person_{t1}$ and $Person_{t2}$ are distinct stages linked by psychological continuity. If continuity breaks (dementia), they might be different persons/stages. This challenges the binding nature of ADs.
      *   *The Practice:* It's a hybrid. It assumes identity holds (legal personhood remains), but authority shifts based on *capacity*.

  3.  **Addressing the "Presupposition" vs. "Fit" Distinction:**

      *   *Crucial Point:* Medical law/ethics is rarely driven by explicit metaphysics. It's driven by *moral status* and *pragmatics*.
      *   *Presupposition:* The practice *strictly* presupposes **Legal Personhood Persistence**. It assumes the entity signing the AD is the same entity receiving treatment for the purpose of rights/duties. It does *not* strictly presuppose Endurantism or Perdurantism because both can map onto "Legal Person X persists."
      *   *Fit:* Endurantism fits the "same soul/body" intuition of bioethics. Perdurantism (Worm) fits the "life plan" intuition. Stage theory fits the "dementia creates a new person" critique (which the practice *rejects*).
      *   *Underdetermination:* The binary threshold is almost certainly legal pragmatism, not metaphysical necessity.

  4.  **Analyzing the Asymmetry (Veto vs. Compulsion):**

      *   User suspects this isn't identity work. I agree.
      *   *Veto:* Based on bodily integrity and harm prevention. Forcing treatment on a capacitated person is battery.
      *   *Compulsion:* Based on beneficence/paternalism. Honoring an AD to treat an incapacitated person is seen as helping *them* (on their own prior terms).
      *   *Metaphysical load:* Minimal. It's about the *nature of rights* (negative vs. positive), not the *nature of the self*.

  5.  **Analyzing the "Graded Continuity" Hypothesis:**

      *   If we made authority a function of psychological connectedness (Parfitian view):
      *   *Presupposition:* This explicitly adopts a **Reductionist/Perdurantist (Stage-like)** view of identity. It says identity isn't all-or-nothing; what matters is Relation R (psychological continuity).
      *   *Perdurantist Revisionism:* A Worm theorist might object that the "Person" is the whole worm, so the early part's plan should hold regardless of later psychological decay. A Stage theorist would love the graded approach.
      *   *Why the Binary Exists:* Courts need decidability. "Is the patient competent?" is a binary legal switch. "How much connectedness is there?" is a metaphysical swamp. The binary is procedural, not ontological.

  6.  **Drafting the Response (Iterative Structure):**

      *   **Introduction:** Acknowledge the depth of the question. State the thesis: The practice is metaphysically ecumenical but morally specific. It relies on *normative* identity, not *ontological* identity.
      *   **Section 1: The Strict Presuppositions.**
          *   It presupposes *Continuity of Legal Personhood*.
          *   It does *not* distinguish between Endurance/Perdurance. Both allow $X_{t1}$ to bind $X_{t2}$ if $X$ is the same legal entity.
          *   The Capacity Threshold is the key, not the persistence theory.
      *   **Section 2: Endurantism vs. Perdurantism Fit.**
          *   *Endurantism:* Fits the "one self" intuition. But struggles with *why* the earlier self overrides the later self if they are the *same* substance (why does time-index matter?).
          *   *Perdurantism (Worm):* Best fit for Precedent Autonomy. The AD is the worm's global plan.
          *   *Perdurantism (Stage):* Worst fit for current practice. Suggests the dementia patient might be a *different* person, undermining the AD. (Though Parfitians use this to argue *against* strict AD enforcement).
      *   **Section 3: The Asymmetry (Veto vs. Compulsion).**
          *   Confirm user's suspicion. It's about Negative vs. Positive Rights / Battery vs. Beneficence.
          *   Metaphysically neutral.
      *   **Section 4: The Graded Continuity Model.**
          *   This *would* commit to a Reductionist/Perdurantist (Stage) metaphysics.
          *   It treats identity as a matter of degree (which standard metaphysics usually denies, though Parfit argues it's what *matters*).
          *   Why we don't do it: Epistemic/Administrative costs, not metaphysical impossibility.
      *   **Section 5: The "Welfare vs. Agency" Split in Dementia.**
          *   This is the crux. The practice treats the dementia patient as a *ward* (like a child), not a *person* with agency.
          *   This implies a **Normative Fragmentation** of the person. The biological organism persists, the moral agent is suspended.
      *   **Conclusion:** The binary is legal, not metaphysical. The practice is compatible with multiple ontologies but commits to a specific *moral* topology of the self (Critical Interests vs. Experiential Interests).

  7.  **Refining the Arguments (Self-Correction during drafting):**

      *   *Correction:* I need to be careful not to say Perdurantism *requires* the graded view. A Worm theorist can accept binary capacity. But the graded view *implies* a Stage/Reductionist ontology.
      *   *Nuance:* The user mentioned Psychiatric ADs being weaker. I need to address why. (Risk of harm to others + uncertainty of "true self" during mania/psychosis vs. dementia).
      *   *Key Distinction:* Dworkin's "Critical Interests" vs. "Experiential Interests." This is the ethical framework masking as metaphysics. The AD protects Critical Interests; the happy dementia patient has only Experiential Interests. The practice prioritizes Critical.
      *   *Metaphysical Commitment:* The practice commits to the **Priority of the Planning Self**. This is closer to a Lockean psychological continuity view (Endurantist or Worm) than a brute biological view.

  8.  **Final Polish:** Ensure the tone is analytical and respects the user's sophisticated grasp of the metaphysics. Avoid oversimplifying the Endurant/Perdurant distinction. Make sure to answer the specific question about the "graded" model clearly.

      *(Self-Correction on the "Graded" question)*: If authority is graded by continuity, does a Perdurantist have to be a revisionist?
      *   *Worm View:* The worm exists fully. The parts are just parts. Authority shouldn't grade; the worm's plan is the worm's plan. So yes, a graded model forces the Worm theorist to revise how they view *authority* distribution across temporal parts.
      *   *Stage View:* The stages are distinct. Authority is always local. So a graded model fits Stage theory better (as it measures the strength of the relation between stages).

      *Okay, ready to write.*
answer: |-
  This is a exceptionally sharp dissection of the intersection between bioethics, law, and metaphysics. You are right to suspect that the standard practice is metaphysically eclectic but morally rigid.

  Here is the reconstruction of the implicit view, separated into what is strictly presupposed, what fits comfortably, and where the practice is underdetermined.

  ### 1. What the Practice Strictly *Presupposes*

  Strictly speaking, standard medical-legal practice regarding advance directives (ADs) is **metaphysically underdetermined** between Endurantism and Perdurantism. It does not require a specific ontology of persistence.

  What it *does* presuppose is **Continuity of Legal Personhood.**

  The law operates on a fiction of the "Legal Person" as a distinct entity from the "Human Organism" and the "Psychological Self."
  *   **The Presupposition:** The entity that signed the document ($t_1$) and the entity on the gurney ($t_2$) bear the same Legal ID.
  *   **The Mechanism:** This is not an ontological claim about substances or temporal parts; it is a deontic claim about rights-bearing units. As long as the state recognizes $t_1$ and $t_2$ as the same rights-bearer, $t_1$'s contracts bind $t_2$.

  Therefore, an Endurantist (same substance wholly present) and a Perdurantist (same space-time worm) can both sign the same AD and have it enforced identically. The metaphysics drops out of the legal equation because the law cares about *liability and authority*, not *identity conditions*.

  ### 2. Endurantism vs. Perdurantism: Fit vs. Tension

  While the practice doesn't *presuppose* one, it creates different tensions for each.

  **Endurantism (The "Same Self" View)**
  *   **Fit:** It aligns with the intuitive bioethical notion that "you are the same person, so your values should govern."
  *   **Tension:** If the self is *wholly present* at $t_2$, why does the $t_1$ will override the $t_2$ will? If I am wholly present now, my current desire is *my* desire. Endurantism struggles to explain why a past iteration of the same substance has authority over the current iteration without appealing to something external (like the value of rational planning).
  *   **Resolution:** Endurantists in bioethics usually lean on **Lockean psychological continuity**. They argue that while the *substance* is the same, the *moral agency* relies on psychological connections. When those break (dementia), the "person" (moral agent) is diminished, even if the "human" (organism) remains.

  **Perdurantism (Worm View)**
  *   **Fit:** This is actually the **strongest metaphysical support for precedent autonomy**. If the person is a space-time worm, the AD is a command from the worm to itself regarding its future parts. The "demented stage" is just a later temporal part of the same worm. The worm's global plan (the AD) takes precedence over the local preference of a confused temporal part.
  *   **Tension:** It makes the "capacity threshold" look arbitrary. If I am a worm, why does a specific degradation of my later stages suddenly invalidate my earlier instructions?
  *   **Resolution:** The capacity threshold isn't about identity; it's about **epistemic access to the worm's plan**. A capacitated $t_2$ stage can verbally update the worm's plan. An incapacitated $t_2$ stage cannot reliably signal a plan update, so the last known valid signal (the AD) stands.

  **Perdurantism (Stage View)**
  *   **Fit:** Poor fit for current practice. Stage theory suggests $t_1$ and $t_2$ are distinct entities linked by relation R. If dementia severs relation R, $t_2$ is arguably a *different person*. This would invalidate the AD (you can't sign a contract for a stranger).
  *   **Tension:** The practice *rejects* the Stage View implication. It insists $t_2$ is bound by $t_1$ even if psychological connectedness is low.
  *   **Resolution:** To make Stage Theory work here, you have to argue that the *community* has an interest in enforcing the plans of earlier stages for the sake of social stability, regardless of strict identity.

  ### 3. The Refusal/Request Asymmetry

  You are correct: **This asymmetry is doing no identity work.** It is purely deontic.

  *   **Refusal (Veto):** Grounded in **Bodily Integrity and Negative Rights**. Forcing treatment on a capacitated person is battery. The metaphysics of the self is irrelevant; touching a non-consenting human organism is prohibited. The current time-slice has a veto because it occupies the body *now*.
  *   **Request (Compulsion):** Grounded in **Beneficence and Positive Rights**. Honoring an AD to *provide* treatment is an act of helping the patient according to their values. There is no right to *demand* specific treatment (especially if futile or against medical judgment), whereas there is a near-absolute right to *refuse*.

  The asymmetry exists because **harm prevention (battery) trumps benefit promotion (autonomy)** in legal hierarchies. It does not rely on whether $t_1$ is identical to $t_2$; it relies on the difference between *stopping an intrusion* vs. *authorizing an action*.

  ### 4. The "Welfare vs. Agency" Split in Dementia

  This is the most metaphysically revealing part of the practice.
  *   **Practice:** The demented patient's *welfare* (current happiness) counts. Their *agency* (current wishes) does not.
  *   **Implicit Metaphysics:** This presupposes a **Fragmented Moral Status**.
      *   The organism is a **Subject of Welfare** (sentient, can suffer/enjoy).
      *   The "Person" (the agent who signs ADs) is **Suspended**.
  *   **Dworkin's Distinction:** This maps onto Ronald Dworkin's distinction between **Experiential Interests** (feeling good now) and **Critical Interests** (living a life that is good overall). The practice assumes Critical Interests (established by the capacitated self) outweigh Experiential Interests (held by the incapacitated self).
  *   **Metaphysical Commitment:** This commits the practice to the view that **Personhood is a capacity-based property, not a biological constant.** You can be a human organism with welfare but cease to be a "Person" with agency. This is closer to a Lockean view than a brute biological view.

  ### 5. The Graded Continuity Hypothesis

  If you junked the threshold and made authority a decreasing function of psychological continuity (memory, values, etc.):

  **What would this presuppose?**
  It would explicitly commit to a **Reductionist / Perdurantist (Stage-like)** metaphysics.
  *   Standard metaphysics (Endurantism) treats identity as all-or-nothing (Leibniz's Law). You are either you or you aren't.
  *   A graded model admits that **identity (or what matters in identity) comes in degrees.** This is the Parfitian move. It says "Psychological Connectedness" is the metric of moral authority, not "Numerical Identity."

  **Would a Perdurantist have to be a revisionist?**
  *   **Worm Theorist:** Yes, they would need to revise. For a Worm theorist, the Person is the whole worm. The authority of the worm shouldn't degrade just because the later parts are damaged. The "Plan of the Worm" should remain sovereign. A graded model undermines the unity of the worm.
  *   **Stage Theorist:** No, this fits them perfectly. If $t_2$ is only derivatively the same person as $t_1$ based on connectedness, then the authority of $t_1$ over $t_2$ should naturally decay as connectedness decays.

  **Why the Binary Exists: Metaphysics or Pragmatics?**
  The honest answer is **Legal Pragmatics**, but it leans on a **Binary Metaphysical Intuition**.
  *   **Pragmatics:** Courts cannot adjudicate "70% continuous." They need a switch: Competent vs. Incompetent. Epistemic access to the patient's "true" continuity is too costly and uncertain.
  *   **Metaphysics:** However, the law clings to the binary because it presupposes **Moral Agency is Binary.** You either have the capacity for rational reflection, or you don't. This is an Aristotelian/Kantian view of agency, not necessarily a view of persistence.

  ### Summary of the Implicit View

  The standard practice does not commit to Endurantism or Perdurantism. It commits to **Normative Dualism**:

  1.  **The Biological Organism:** Persists through time, is a subject of welfare, possesses bodily integrity (veto power).
  2.  **The Moral Agent:** Persists only through psychological continuity/capacity.
      *   When **Agent** and **Organism** overlap (Capacity), the Agent rules.
      *   When **Agent** is absent (Incapacity), the **Last Known Will of the Agent** (AD) rules over the **Current Welfare of the Organism**.

  **The Verdict on your suspicion:**
  You are right that the binary is underdetermined by metaphysics. Both Endurantists and Perdurantists can justify the current system (Endurantists via "same substance," Perdurantists via "worm plan").

  However, the **Graded Continuity** model *would* force a metaphysical shift. It would require abandoning the idea that "Personhood" is a binary status and accepting the Parfitian view that identity is not what matters; psychological connectedness is. The current binary persists not because metaphysics demands it, but because the law requires **decidability**, and our moral intuitions about **agency** are binary (you are either responsible or you aren't), even if our metaphysics of **persistence** could be graded.

  **Final Note on Psychiatric Directives:**
  The reason these are less enforceable isn't metaphysical; it's **epistemic and risk-based**. In dementia, we assume the "values" are lost. In psychosis, we assume the "values" are obscured but potentially recoverable. The state is more willing to override a dementia patient (permanent loss of agent) than a manic patient (temporary distortion of agent), because the manic patient might return to ratify the coercion. This is a bet on the *return of the Agent*, not a claim about the *identity of the Person*.
