          *   (d) says prefer decentralization even if control by few prevents failures (implies accepting higher risk of unilateral failure for the sake of decentralization values).
          *   *Conflict:* If centralization (fewer hands) objectively reduces the risk of catastrophic unilateral error (as the curse suggests), then a straight EV maximizer (b) should prefer centralization *unless* the EV cost of centralization is higher. (d) asserts institutional control is "usually worse," but is that an EV claim or a deontological/libertarian constraint? If it's an EV claim, it needs to account for the tail risks in (c). If (c) is true (tail risks dominate), the EV of decentralization might be negative due to the unilateralist curse, contradicting (d)'s preference.
          *   *Severity:* Medium-High. It questions the coherence of the utility function.

      *   **Tension 3: (e) vs. (d).**
          *   (d) wants permissionless/decentralized contribution.
          *   (e) proposes a "sampled-quorum protocol."
          *   *Conflict:* Does a quorum requirement violate "permissionless"? Usually, permissionless means anyone can ship. A quorum means you need consensus. However, (e) claims it keeps decentralization. This is more of a definitional tension. Is a random quorum "centralization"? It's a form of gatekeeping, just randomized.
