answer: |-
  Subject: Thoughts on your schedule flipping

  Hi there,

  It is completely understandable why this situation feels confusing, because on the surface you are exercising the exact freedom that freelancing is supposed to provide, yet the outcome feels like a trap. Your flatmate is pointing out a classic problem in economics and decision theory known as a money pump, where a person with inconsistent preferences can be exploited repeatedly until they lose all their resources. In your case, the resource being pumped is not just cash via his bets, but your productivity and client trust. However, concluding that you are simply being irrational or taken advantage of misses the nuance of what is actually happening inside your decision-making process. The defect is not necessarily in your inability to stick to a plan, nor is it in the flipping itself, but rather in the trigger you use to decide when to reopen the question of how you work.

  To understand where the irrationality sits, you have to look at the relationship between the cost of switching and the value of the new information you are acting on. Every time you flip your schedule, you pay a transaction cost of about one week of lost output plus the social cost of frustrating clients. In rational decision-making, you should only incur a transaction cost if the new state is significantly better than the old one, or if the old state has become untenable. The problem you are facing is that you are treating internal mood shifts as external data points. When you feel that the morning schedule is destroying you, you interpret that feeling as evidence that the schedule is wrong, but given the regularity of the cycle, it is far more likely that the feeling is evidence that you are simply bored or fatigued by routine. By reopening the question every three or four weeks, you are inviting noise to override signal. If you only flipped once a year, as you noted, the cost would be negligible because you would likely only flip when there was actual evidence that the current system was failing, rather than when you just felt like changing it.

  This brings us to the question of how often a person is supposed to reopen a decision. The answer is not based on a calendar or a feeling, but on the accumulation of evidence. You should only reopen the question when the cost of staying the same exceeds the cost of switching. Right now, you are reopening the question when the novelty of the current schedule wears off, which is a emotional trigger rather than a logistical one. Since you have found that commitment devices like blocking apps do not work for you because you simply click through them, the solution is not to try to force yourself to stick to a plan through willpower, but to change the criteria for when you are allowed to change your mind. You might consider instituting a rule that you cannot evaluate the effectiveness of a schedule until you have completed at least three months on it, because anything less than that is just you reacting to the adjustment period rather than the sustainability of the workflow.

  Regarding your enjoyment of the flipping, this does matter, but it needs to be accounted for honestly. If the act of reorganizing your life provides you with a sense of control or novelty that is psychologically valuable, that is a legitimate benefit. However, for it to be rational, that psychological benefit must outweigh the tangible costs of lost output and client friction. It sounds like you are currently enjoying the feeling of optimization without actually achieving the optimization, which is why the flatmate's bets sting. You are paying a high price for the feeling of making a change, rather than the benefit of the change itself. If you enjoyed the flipping but it didn't cost you client trust or output, it would be a harmless quirk, but because it erodes your professional stability, the enjoyment is essentially a subsidy you are paying for with your own career capital.

  Ultimately, the defect sits in the frequency of reconsideration driven by mood rather than metrics. You are not irrational for wanting flexibility, and you are not irrational for changing your mind when circumstances change, but you are falling into a loop where the circumstance that changes is only your tolerance for routine. To break the cycle without relying on commitment devices you will ignore, you need to externalize the decision criteria. You could try tracking your output and mood daily without changing anything, so that when you feel the urge to flip, you can look at the data and see if your productivity actually dropped or if you just feel restless. If the data shows you are still productive, the urge to flip is just a cost you don't need to pay. Your flatmate is winning his bets because he knows your mood cycle is more predictable than your work cycle, but you can stop funding his hobby by decoupling your schedule decisions from your temporary states of mind.

  Best regards,

  Your Friend
