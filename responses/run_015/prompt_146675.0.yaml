answer: |-
  | case_or_objection | what_would_have_to_be_true (what the world has to be like for this to count against me) | severity (fatal / serious / awkward / doesn't really bite) | would_a_defender_concede (yes, grudgingly, or no — and why) | best_available_reply | live_or_merely_logically_possible |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **The Spore/Corpse Distinction** (Circularity of "Disposition") | A frozen human corpse and a bacterial spore must be physically indistinguishable regarding their *disposition* to self-repair, yet one is dead and one alive, implying "capacity" just means "is alive." | fatal | grudgingly — because if "kind of thing" relies on a prior biological classification, the definition is circular and not reductive. | The spore retains *internal* causal power to restart maintenance; the corpse relies entirely on external intervention to reverse entropy, even if thawed. | live |
  | **Collapse into Autopoiesis** (Theoretical Redundancy) | "Holding itself together against decay" must be extensionally equivalent to Maturana/Varela's "organizational closure" and self-production of components. | serious | no — because autopoiesis focuses on the production of the *process*, whereas this view focuses on the resistance to *entropy* (maintenance vs. production). | Autopoiesis is a structural description; Maintenance is a functional/teleological one. You can have closure without decay resistance (e.g., a whirlpool). | live |
  | **The Mitochondria Problem** (Mereology) | An organelle must count as a "thing" that maintains itself, yet it relies on the host cell for most repair proteins, blurring the line between part and whole. | awkward | yes — because mitochondria are symbiotic organisms that became parts, so the view correctly identifies them as borderline cases of "aliveness." | Life is hierarchical. Mitochondria are alive *qua* lineage, but not *qua* current organism. The definition applies to the top-level integrated unit. | live |
  | **Brain-Dead Body on Support** (Integration vs. Activity) | The body's cells must be maintaining themselves individually while the *organism* fails to, implying the definition picks out "organismal life" rather than "biological life." | awkward | no — because the view explicitly targets the *organism* as the unit that can die, not the constituent cells which may survive harvesting. | Death is the loss of integrative self-maintenance. Cells on a petri dish are alive; the person is not. This is a feature, not a bug. | live |
  | **Self-Maintaining AI** (Substrate Neutrality) | "Decay" and "repair" must apply to software structures (bit-rot, code migration) independent of thermodynamic entropy in a chemical substrate. | doesn't really bite | no — because "decay" in this view implies thermodynamic equilibrium (death/heat death), which software does not face directly. | Software persists logically, not physically. A server crash is not "death" in the biological sense; it's a hardware failure external to the code's logic. | merely logically possible |

  The single defeater I would bet on is the **Spore/Corpse Distinction**. Your reliance on "dispositional activity" or "kind of thing" risks making the definition circular: a spore is alive because it *can* repair, but we only know it *can* repair because we already know it's alive. A freshly frozen corpse also has the disposition to repair *if* we intervene, so the boundary relies on "internal vs. external" causation, which is notoriously hard to define without already assuming a boundary between self and environment. The smallest revision to make this risk something real is to **remove the dispositional hedge**: require *actual, measurable thermodynamic work* occurring at the moment of assessment. This would force you to declare spores and seeds "dead" (or dormant non-life) until metabolism resumes, which is a bold, falsifiable claim that biologists would actually fight you on.
