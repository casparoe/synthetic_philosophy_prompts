      *   **Answering the Specific Questions:**
          *   *Is it a moral finding or artifact?* It's an artifact of the "Person-Affecting Constraint" hardcoded into the logic.
          *   *Will more compute fix it?* No. It's structural, not computational.
          *   *The "Middle Ground":* Explain "Wide Person-Affecting View" or "Comparativism" vs. "Impersonal."
      *   **Recommendation for the Register:**
          *   Don't hide the emptiness. It's a feature of the ethical model, not a bug.
          *   Suggest adding a "Structural Risk" flag instead of a "Harm Entry."
          *   Warn against "Social Role" matching (too utilitarian/impersonal without admitting it).

  6.  **Refining the Tone:**
      *   Avoid condescension.
      *   Use engineering analogies (types, schemas, join keys, edge cases).
