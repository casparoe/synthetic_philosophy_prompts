  8.  **Final Polish:** Check against the prompt's specific constraints (correct framing, translate jargon, explicit provenance, no silent side-picking). *Make sure to explicitly state that there is no agreed resolution.*

  *(Self-Correction on "Fix 1"):* I need to be careful not to say genetic modeling is useless. But for *conception timing*, the specific gametes differ. So `GeneticID` is actually the *correct* key for "same person," and it *correctly* returns null. The user thinks it's a data horizon issue; I need to correct that it's a logical necessity given the definition of identity.

  *(Self-Correction on "Fix 2"):* Matching by social role effectively changes the object from `Person` to `PopulationSlot`. This is a schema change. I need to explain the ethical cost of that schema change.

