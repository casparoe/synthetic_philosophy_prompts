      *   *Fix:* Make sure to distinguish between the *training* phase (where gradients move weights) and *inference* (where activations move). The user asks about inference mostly. Types are compile-time. Concepts are runtime. That's the break.
      *   *Critique:* The "Push" verb.
      *   *Fix:* Redefine "push." In a deterministic system, the past state pushes the future state. If a "concept" is a robust descriptor of a subspace of the state, and intervening on that subspace changes the future, the concept pushes.

  6.  **Finalizing the Verdict & Experiments:**
      *   Verdict: Simmballs are causally efficacious at inference.
      *   Confidence: High (80%).
      *   Load-bearing step: The assumption that linear subspaces actually capture the concepts (vs. non-linear manifolds).
      *   Experiment: Cross-model steering. If a "honesty" vector in Model A works in Model B without fine-tuning, the concept is structural (Simmball), not accidental (Symm noise). Or, more practically, **Intervention Robustness**. If I patch a concept, does it hold across diverse contexts?

  7.  **Writing the Essay:** (Focusing on tone: direct, analytical, no fluff).

      *   *Opening:* Acknowledge the rabbit hole.
