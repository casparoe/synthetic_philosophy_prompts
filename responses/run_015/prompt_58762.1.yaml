prompt: |-
  I'm kinda stuck on the speices problem and need a concrete made-up exmaple to get my head round it. Could you invent a critter with details about its behaviour and how it breeds where counting by who can interbreed gives one species but counting by DNA history gives two, and where it actually matters for a conservation decision whether we say one or two? Just walk through why each way of counting feels sensible, no citations needed.
reasoning: |-
  Here's a thinking process that leads to the suggested example:

  1.  **Analyze the Request:**
      *   **Problem:** The user is stuck on the "species problem" (the difficulty in defining what a species is).
      *   **Task:** Invent a concrete, made-up critter example.
      *   **Requirements:**
          *   Detail behavior and breeding.
          *   Scenario A: Counting by interbreeding (Biological Species Concept) = 1 Species.
          *   Scenario B: Counting by DNA history/lineage (Phylogenetic Species Concept) = 2 Species.
          *   Stakes: It must matter for a conservation decision (one vs. two species changes the outcome).
          *   Tone: Walk through why each way feels sensible, no citations needed.

  2.  **Deconstruct the Species Concepts:**
      *   *Biological Species Concept (BSC):* Focuses on reproductive isolation. If they can mate and produce fertile offspring, they are the same species.
      *   *Phylogenetic Species Concept (PSC):* Focuses on evolutionary history and distinct lineages. If they have been separate for a long time and have unique genetic markers, they are different species, even if they *can* still interbreed.

  3.  **Brainstorming the Critter:**
      *   Needs to be able to interbreed (for BSC = 1).
      *   Needs to have distinct genetic histories (for PSC = 2).
      *   Needs a geographic or behavioral quirk that allows the tension to exist.
      *   *Idea:* A ring species scenario? No, that's often too complex for a basic example.
      *   *Idea:* Recent secondary contact? Two populations separated for a long time, evolved differences, came back together, and can still mate. This is the classic "incipient speciation" or "hybrid zone" scenario.
      *   *Name:* Let's call it the "Velvet Glider." Sounds cute and mammalian/bat-like.
      *   *Habitat:* Mountainous region with two valleys.

  4.  **Developing the Scenario:**
      *   **Population A (North Valley):** Dark fur, nocturnal, eats moths.
      *   **Population B (South Valley):** Light fur, crepuscular (dawn/dusk), eats beetles.
      *   **History:** Separated by a glacier for 500,000 years. Evolved separately.
      *   **Current State:** Glacier melted. They meet in the middle.
      *   **Breeding:** They *can* mate. Hybrids are fertile. (BSC says 1 species).
      *   **DNA:** Their genomes show 500k years of no mixing. Distinct markers. (PSC says 2 species).

  5.  **Developing the Conservation Conflict:**
      *   Why does it matter?
      *   *If 1 Species:* The total population is large. Maybe "Least Concern." We protect the habitat generally.
      *   *If 2 Species:* One population might be tiny. Maybe "Endangered." We need specific protection for the rare one, potentially at the expense of the common one (e.g., culling hybrids, prioritizing land).
      *   *Let's refine:* Let's make the North population huge and the South population tiny.
      *   *Threat:* A dam is being built in the South Valley.
      *   *Decision:* If they are one species, the dam is fine (North population is safe). If two, the dam wipes out the South species forever.

  6.  **Drafting the Narrative (Iterative refinement):**

      *   *Intro:* Introduce the "Frost-Whiskered Lemur" (changed from Glider, sounds more distinct).
      *   *The Setup:* Two valleys, East and West.
      *   *The Interbreeding (BSC):* They meet at the pass. They mate. Kids are healthy. So, logically, one species.
      *   *The DNA (PSC):* Geneticists look deeper. They haven't swapped genes for a million years. The East ones have unique immune genes. The West ones don't. They are distinct evolutionary chapters.
      *   *The Conservation Crisis:* A mining company wants to dig in the West.
      *   *The Conflict:*
          *   View 1 (One Species): "Don't worry, there are millions in the East. The species survives."
          *   View 2 (Two Species): "Wait, the West lineage is unique. If they die, that million-year history is gone."

  7.  **Refining the "Why it feels sensible" part:**
      *   Need to explain *why* a biologist would argue for each side without using jargon overload.
      *   *BSC argument:* Nature doesn't see a barrier. They mix. Who are we to say they are separate?
      *   *PSC argument:* History matters. Just because two things *can* mix doesn't mean they *are* the same story.

  8.  **Final Polish:**
      *   Check against constraints: No citations? Check. Concrete example? Check. Conservation stakes? Check.
      *   Make sure the distinction is clear. The key is "Secondary Contact after long isolation."

  9.  **Self-Correction during drafting:**
      *   *Initial thought:* Maybe make hybrids sterile?
      *   *Correction:* No, if hybrids are sterile, BSC usually calls them separate species (like horses and donkeys). I need them to be fertile for BSC to say "1 Species."
      *   *Initial thought:* Make the DNA difference huge.
      *   *Correction:* Keep it subtle enough that they look similar, but distinct enough genetically to warrant the "2 species" claim.
      *   *Conservation angle:* Make sure the "1 species" argument leads to *inaction* and "2 species" leads to *action*. That highlights the stakes.

  10. **Final Review of the Output:** (Mental check of the generated response)
      *   Critter: The "Ridge-Back Glider."
      *   Location: The Split-Range Mountains.
      *   Situation: Reunited populations.
      *   BSC: They mate freely = 1 species.
      *   PSC: Long separate history = 2 species.
      *   Stakes: Dam construction.
      *   Explanation: Clear walkthrough of the logic.

      *(Self-Correction)*: Let's ensure the conservation dilemma is sharp. If it's one species, the total population is 100,000. If two, one is 95,000 and the other is 5,000. The 5,000 one is at risk of extinction.

