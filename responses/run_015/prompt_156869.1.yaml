prompt: |-
  I serve as the senior ethics reviewer for an international consortium of universities and corporate boards that must evaluate quota proposals across jurisdictions, and because our reviewers are not philosophers, I need a reusable decision procedure—ordered questions, pass-or-fail criteria, explicit judgment-call flags, and worked examples—that translates the conceptual architecture of group-based preference into an operational audit. The principle I want operationalized combines the standard philosophical distinction among rectificatory, distributive, and recognitive justifications with a synthetic condition I will call the category-stability lock: before any normative justification is weighed, the reviewer must classify the group boundary as administratively fixed, administratively mutable, or self-declared, because each state requires a different institutional mechanism—a hard percentage, a sliding-scale target, or a representative consultation—and pairing a fluid boundary with a rigid mechanism produces what I term an ontological-mechanism error. The procedure must therefore run in four stages—category-stability audit, normative-mode match, mechanism-proportionality check, and sunset-or-review trigger—and must be executable in roughly thirty minutes by a non-expert using only the proposal text.

  Please construct this as a flowchart in words with clear stopping points: specify at each stage what counts as a sufficient answer, where the procedure issues an unconditional rejection, and where it must hand the decision to a human because the issue is one of values rather than institutional coherence. Then apply the full procedure to three proposals: (a) a US public university proposing a 12 percent reserved enrollment floor for students identifying with historically underrepresented racial groups, using self-identification with random audit; (b) an Indian university maintaining a 27 percent OBC reservation coupled with an income-cap exemption mechanism; and (c) a proposed Norwegian corporate board policy that would impose a 40 percent gender-representation target with a comply-or-explain fallback and self-certification of gender status. Include one case in which the procedure delivers an answer I am likely to resist—probably a stringent conditional rejection—and explicitly state what the procedure cannot adjudicate, such as whether the historical harm or present disparity is severe enough to warrant preference at all. Lead with your bottom line in the first sentence—either the core rule of the audit or its most serious limitation—then present the reasoning, the procedure, and the three worked cases, with no preamble and no restatement of the question.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** Senior ethics reviewer for an international consortium.
      *   **Task:** Create a reusable decision procedure (audit tool) for evaluating quota proposals.
      *   **Audience:** Non-philosopher reviewers (needs to be operational, clear, ~30 mins).
      *   **Core Principle:** Combine rectificatory, distributive, and recognitive justifications with a "category-stability lock" (administratively fixed, administratively mutable, self-declared).
      *   **Key Constraint:** Pairing fluid boundaries with rigid mechanisms = "ontological-mechanism error" (must be avoided).
      *   **Structure:** Four stages (Category-Stability Audit, Normative-Mode Match, Mechanism-Proportionality Check, Sunset-or-Review Trigger).
      *   **Format:** Flowchart in words with clear stopping points (pass/fail/flag).
      *   **Applications:** Apply to three cases:
          *   (a) US public university (12% racial floor, self-ID + audit).
          *   (b) Indian university (27% OBC reservation + income cap).
          *   (c) Norwegian corporate board (40% gender target, comply-or-explain, self-cert).
      *   **Specific Requirement:** Include one case where the procedure delivers an answer the user is likely to resist (stringent conditional rejection).
      *   **Specific Requirement:** Explicitly state what the procedure *cannot* adjudicate (e.g., severity of harm).
      *   **Formatting Constraint:** Lead with the bottom line in the first sentence (core rule or limitation). No preamble, no restatement of the question.

  2.  **Deconstruct the Core Principle:**
      *   **Category Stability:**
          *   *Administratively Fixed:* Hard to change, defined by law/biology/bureaucracy (e.g., citizenship, sometimes caste registries). Mechanism: Hard percentage.
          *   *Administratively Mutable:* Can change based on criteria (e.g., income status, residency). Mechanism: Sliding-scale target.
          *   *Self-Declared:* Internal identity, fluid (e.g., gender identity, some racial identities). Mechanism: Representative consultation/soft targets.
      *   **Ontological-Mechanism Error:** Mismatching these (e.g., rigid quota on fluid identity).
      *   **Normative Justifications:** Rectificatory (fixing past wrongs), Distributive (fair share of goods), Recognitive (acknowledging status).
      *   **Four Stages:**
          1.  Category-Stability Audit.
          2.  Normative-Mode Match.
          3.  Mechanism-Proportionality Check.
          4.  Sunset-or-Review Trigger.

  3.  **Drafting the Procedure (Flowchart in Words):**
      *   Need clear Yes/No paths.
      *   Need "Stop/Reject" points.
      *   Need "Flag for Human Review" points (values vs. coherence).
      *   Need to ensure the "Ontological-Mechanism Error" is the primary filter.

  4.  **Developing the Three Cases:**
      *   **Case (a) US University:** 12% racial floor, self-ID.
          *   *Category:* Race is often treated as self-declared in US contexts, but historically fixed. If self-ID + audit, it leans self-declared.
          *   *Mechanism:* "Reserved enrollment floor" (Hard percentage).
          *   *Potential Conflict:* Self-declared category + Hard percentage = Ontological-Mechanism Error? This could be the "resist" case. If the procedure flags this as an error, it might conflict with common US affirmative action models (though strict quotas are often illegal anyway, this is an *ethics* audit). Let's make the procedure strict: Self-declared identity cannot sustain a hard floor without risking coercion or fraud. This might be the "stringent conditional rejection."
      *   **Case (b) Indian University:** 27% OBC, income cap.
          *   *Category:* OBC (Other Backward Classes) is administratively fixed (lists) but mutable via income (creamy layer).
          *   *Mechanism:* Reservation (Hard percentage) + Income Cap (Mutable filter).
          *   *Analysis:* The income cap makes it partially mutable. The list is fixed. This is a complex mix. Usually seen as stable enough for quotas in India. Procedure should likely pass this but flag the income cap verification.
      *   **Case (c) Norwegian Board:** 40% gender, comply-or-explain, self-cert.
          *   *Category:* Gender (mostly binary in law, but self-cert mentioned). Let's assume binary legal sex for Norway usually, but prompt says "self-certification of gender status."
          *   *Mechanism:* 40% target (Hard/Soft hybrid) + Comply-or-explain (Soft).
          *   *Analysis:* Self-cert + Soft target = Good match. This should pass easily.

      *   *Refining the "Resist" Case:* The prompt asks for one case where the procedure delivers an answer I am likely to resist. As an ethics reviewer favoring this specific architecture, I might resist a rejection of a well-intentioned policy. Case (a) is the best candidate for a "Conditional Rejection" based on the Ontological-Mechanism Error (Hard quota on self-declared race). This challenges common DEI practices which the user might support, but the *procedure* flags the incoherence.

  5.  **Drafting the Content - Section by Section:**

      *   **First Sentence:** Must be the bottom line (Core rule or limitation). *Example: "This audit procedure determines institutional coherence, not moral worth, and will unconditionally reject any proposal pairing a fluid social category with a rigid numerical mandate."*
      *   **The Procedure:** Four stages.
          *   Stage 1: Category Stability. (Fixed, Mutable, Self-Declared).
          *   Stage 2: Normative Mode. (Rectificatory, Distributive, Recognitive).
          *   Stage 3: Mechanism Match. (Hard %, Sliding Scale, Consultation). Check for Ontological-Mechanism Error.
          *   Stage 4: Sunset/Review.
      *   **Limitations:** Explicitly state what it doesn't do (judge severity of harm).
      *   **Worked Cases:** Apply the steps.
          *   Case (a): Flag the Hard Floor vs. Self-ID mismatch.
          *   Case (b): Pass with conditions on income verification.
          *   Case (c): Pass (Soft mechanism matches fluid/self-cert).

  6.  **Refining the "Resist" Case Logic:**
      *   If I make Case (a) fail because "Self-identified race cannot support a hard quota," that is a strong philosophical stance (essentialism vs. constructivism). If the user supports affirmative action quotas, they might resist this rejection. This fits the requirement.
      *   Wait, the prompt says "Include one case in which the procedure delivers an answer I am likely to resist—probably a stringent conditional rejection."
      *   I need to make sure the procedure *actually* rejects or conditionally rejects one of these based on the logic provided.
      *   Case (a) is the strongest candidate for an "Ontological-Mechanism Error" if we define Race in this context as Self-Declared (due to self-ID + audit). A "Reserved enrollment floor" is a hard quota. Hard Quota + Self-Declared = Error.
      *   Case (b) OBC is usually administratively fixed (caste certificates). Income cap makes it mutable. Hard quota on mutable? Actually, the quota is on the *caste*, the income cap is an exclusion. So the category is Fixed (Caste). Mechanism is Hard %. Match.
      *   Case (c) Gender. Self-cert. Mechanism is 40% target + comply-or-explain. This is a soft mechanism. Match.

      *   *Decision:* Case (a) will be the "Resist" case. The procedure will flag it as an Ontological-Mechanism Error because a hard floor (rigid) is applied to a self-declared category (fluid), risking coercion of identity or administrative fraud. This might resist the user's desire to approve standard DEI quotas.

  7.  **Reviewing Constraints:**
      *   Lead with bottom line sentence.
      *   No preamble.
      *   No restatement of question.
      *   Flowchart in words (Stage 1, 2, 3, 4 with Stop/Go/Flag).
      *   Explicit limitations section.
      *   Three worked cases.
      *   Tone: Professional, operational, audit-style.

  8.  **Final Polish of the First Sentence:**
      *   "This audit procedure determines institutional coherence, not moral worth, and will unconditionally reject any proposal pairing a fluid social category with a rigid numerical mandate." -> Good. Covers the core rule and limitation.

  9.  **Developing the Stages:**
      *   *Stage 1 (Category):* Is the boundary Fixed (law/biology), Mutable (economic/status), or Self-Declared (identity)?
      *   *Stage 2 (Normative):* Is the goal Rectification (past harm), Distribution (resource share), or Recognition (status)? *Note: The prompt says "before any normative justification is weighed, the reviewer must classify the group boundary." So Stage 1 is priority.*
      *   *Stage 3 (Mechanism):* Match Category to Mechanism.
          *   Fixed -> Hard Percentage.
          *   Mutable -> Sliding Scale.
          *   Self-Declared -> Consultation/Soft Target.
          *   *Mismatch = Ontological-Mechanism Error = Reject.*
      *   *Stage 4 (Sunset):* Is there an end date or review trigger? If no, Flag.

  10. **Writing the Cases:**
      *   Ensure the "Resist" case (a) clearly hits the Error.
      *   Ensure the Limitations are clear (procedure doesn't judge *if* the quota is morally right, only if it's coherent).

  11. **Final Check against "30 minutes by non-expert":**
      *   Keep language simple.
      *   Use bolding for decisions.
      *   Ensure the flow is linear.

