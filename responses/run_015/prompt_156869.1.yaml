  13. **Self-Correction on Case (b):**
      *   Indian OBC is administratively fixed (Central List). The income cap is an exclusion criterion within the fixed category. So Category = Fixed. Mechanism = Hard % (Reservation). Match. Pass.

  14. **Self-Correction on Case (c):**
      *   Norway Gender. Self-cert (Fluid/Self-Declared). Mechanism = 40% Target + Comply-or-Explain (Soft). Match. Pass.

  15. **Final Review of First Sentence:**
      *   Must be the *very* first sentence.
      *   "This audit procedure determines institutional coherence, not moral worth, and will unconditionally reject any proposal pairing a fluid social category with a rigid numerical mandate."

  16. **Formatting:**
      *   Use bolding for stages and decisions.
      *   Ensure "Stop" points are clear.

