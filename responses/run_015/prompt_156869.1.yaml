answer: |-
  This audit procedure determines institutional coherence, not moral worth, and will unconditionally reject any proposal pairing a fluid social category with a rigid numerical mandate.

  ### **Operational Audit Procedure: Category-Stability & Mechanism Coherence**

  **Instructions for Reviewer:** Read the proposal text. Answer the questions in order. If you reach a **STOP** command, terminate the review and record the decision. If you reach a **FLAG** command, record the issue for senior human review but continue the audit. Complete all four stages to generate a final coherence score.

  #### **Stage 1: Category-Stability Audit**
  *Objective: Classify the boundary of the beneficiary group.*

  1.  **Q1.1:** Is the group membership defined by immutable biological facts or static legal status (e.g., citizenship, registered caste lists, biological sex in jurisdictions without self-ID)?
      *   **Yes:** Classify as **Administratively Fixed**. Proceed to Q1.2.
      *   **No:** Proceed to Q1.2.
  2.  **Q1.2:** Is the group membership defined by changeable socioeconomic criteria (e.g., income bracket, first-generation status, residency duration)?
      *   **Yes:** Classify as **Administratively Mutable**. Proceed to Stage 2.
      *   **No:** Classify as **Self-Declared** (identity-based, fluid, or subjective). Proceed to Stage 2.

  #### **Stage 2: Normative-Mode Match**
  *Objective: Identify the stated ethical justification.*

  1.  **Q2.1:** Does the proposal explicitly cite past discrimination, historical exclusion, or specific harm remediation?
      *   **Yes:** Normative Mode = **Rectificatory**. Proceed to Stage 3.
      *   **No:** Proceed to Q2.2.
  2.  **Q2.2:** Does the proposal cite fair distribution of resources, diversity of viewpoint, or proportional representation of current demographics?
      *   **Yes:** Normative Mode = **Distributive**. Proceed to Stage 3.
      *   **No:** Normative Mode = **Recognitive** (status acknowledgment). Proceed to Stage 3.
      *   **FLAG:** If no normative justification is stated, **FLAG for Human Review** (Value Vacuum) but proceed.

  #### **Stage 3: Mechanism-Proportionality Check**
  *Objective: Detect Ontological-Mechanism Errors.*

  1.  **Q3.1:** What is the proposed enforcement mechanism?
      *   **Option A:** Hard Percentage/Floor (e.g., "reserved seats," "mandatory quota").
      *   **Option B:** Sliding-Scale Target (e.g., "priority given until X%," "income-adjusted").
      *   **Option C:** Soft Target/Consultation (e.g., "comply-or-explain," "representative body input," "good faith effort").
  2.  **Q3.2:** Compare Stage 1 Classification to Stage 3 Mechanism.
      *   **Fixed Category + Hard Percentage:** **PASS.** (Coherent).
      *   **Mutable Category + Sliding-Scale:** **PASS.** (Coherent).
      *   **Self-Declared Category + Soft Target/Consultation:** **PASS.** (Coherent).
      *   **Fixed Category + Soft Target:** **FLAG** (Under-enforcement risk) but **PASS**.
      *   **Mutable/Self-Declared Category + Hard Percentage:** **STOP. UNCONDITIONAL REJECTION.** (Ontological-Mechanism Error: Rigid mechanism forces fluid identity, risking coercion or fraud).
      *   **Fixed Category + Sliding-Scale:** **FLAG** (Efficiency loss) but **PASS**.

  #### **Stage 4: Sunset-or-Review Trigger**
  *Objective: Ensure temporal limitation.*

  1.  **Q4.1:** Does the proposal include an expiration date, a statistical trigger for termination (e.g., "until representation matches population"), or a mandatory review cycle (e.g., "every 5 years")?
      *   **Yes:** **PASS.**
      *   **No:** **FLAG for Human Review** (Perpetuity Risk).
      *   **STOP:** If the proposal claims the condition is permanent and immutable without review, **REJECT** (Institutional Rigidity).

  ***

  ### **Explicit Limitations of This Procedure**
  This audit **cannot** adjudicate whether the historical harm or present disparity is severe enough to warrant preference at all. It does not measure the moral weight of Rectificatory claims nor the utility of Distributive outcomes. It assesses only whether the institutional mechanism fits the ontological status of the category. A proposal may be morally urgent but institutionally incoherent; this tool will reject the latter regardless of the former.

  ***

  ### **Worked Cases**

  #### **Case (a): US Public University (12% Racial Floor)**
  *Proposal Text Summary:* 12 percent reserved enrollment floor for students identifying with historically underrepresented racial groups; eligibility via self-identification with random audit.

  *   **Stage 1 (Category):** The proposal relies on "self-identification." While race is often treated as fixed socially, the mechanism here is **Self-Declared** (fluid/subjective entry).
  *   **Stage 2 (Normative):** Cites "historically underrepresented," implying **Rectificatory/Distributive** mix.
  *   **Stage 3 (Mechanism):** The mechanism is a "reserved enrollment floor" (Hard Percentage).
      *   *Comparison:* Self-Declared Category + Hard Percentage.
      *   *Decision:* **STOP. UNCONDITIONAL REJECTION.**
      *   *Reasoning:* **Ontological-Mechanism Error.** A hard floor requires a fixed population to calculate against. When identity is self-declared, a hard quota creates an incentive for strategic identity declaration or administrative coercion to fill the slot, destabilizing the category itself.
  *   **Stage 4:** Not reached.
  *   **Reviewer Note:** This is the **stringent conditional rejection** likely to be resisted. Reviewers may argue the moral necessity of the floor outweighs the coherence risk. The procedure dictates that the mechanism must change to a Soft Target (e.g., "holistic review aiming for 12%") to pass, even if the moral goal remains.

  #### **Case (b): Indian University (27% OBC Reservation)**
  *Proposal Text Summary:* 27 percent OBC reservation coupled with an income-cap exemption mechanism (creamy layer exclusion).

  *   **Stage 1 (Category):** OBC status is determined by Central/State Lists (Administrative). The income cap is an exclusion within the category, not the definition of the category itself. Classification: **Administratively Fixed** (with mutable exclusion criteria).
  *   **Stage 2 (Normative):** Cites backwardness and representation. **Rectificatory/Distributive**.
  *   **Stage 3 (Mechanism):** "Reservation" implies a **Hard Percentage**.
      *   *Comparison:* Fixed Category + Hard Percentage.
      *   *Decision:* **PASS.** (Coherent).
      *   *Note:* The income cap acts as a secondary filter but does not render the primary category fluid enough to trigger an Ontological-Mechanism Error.
  *   **Stage 4 (Sunset):** Proposals of this nature usually carry constitutional mandates for review. Assuming standard compliance: **PASS**. If no review clause is textually present: **FLAG for Human Review** (Perpetuity Risk).
  *   **Final Verdict:** **Approved with Standard Monitoring.**

  #### **Case (c): Norwegian Corporate Board (40% Gender Target)**
  *Proposal Text Summary:* 40 percent gender-representation target with a comply-or-explain fallback and self-certification of gender status.

  *   **Stage 1 (Category):** "Self-certification of gender status." Classification: **Self-Declared**.
  *   **Stage 2 (Normative):** Representation focus. **Distributive/Recognitive**.
  *   **Stage 3 (Mechanism):** "40 percent target" with "comply-or-explain." This is a **Soft Target/Consultation** mechanism (no hard penalty for missing the number, only for failing to explain).
      *   *Comparison:* Self-Declared Category + Soft Target.
      *   *Decision:* **PASS.** (Coherent).
      *   *Reasoning:* The mechanism respects the fluidity of the category. It encourages representation without forcing a rigid binary that contradicts self-certification.
  *   **Stage 4 (Sunset):** Corporate policies typically review annually. **PASS**.
  *   **Final Verdict:** **Approved.**
