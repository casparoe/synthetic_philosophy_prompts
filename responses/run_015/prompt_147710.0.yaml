  **L1**
  *   **Slug:** `coordination-duty`
  *   **Name:** The Coordination Duty
  *   **Awkward Commitment:** You must follow rules even if they seem silly, just because most others comply to keep things running.
  *   **Practical Stance:** No apology needed if you comply; guilt is the wrong reaction if you break it only when alone; the company can reasonably ask this of you.

  **L2**
  *   **Slug:** `expectation-duty`
  *   **Name:** The Expectation Duty
  *   **Awkward Commitment:** You owe compliance to strangers who expect it, even if they never tell you and you never meet again.
  *   **Practical Stance:** Mild awkwardness is the right reaction if you fail; apologize to the immediate person served; the company can advise but not enforce.

  **L3**
  *   **Slug:** `fairness-duty`
  *   **Name:** The Fairness Duty
  *   **Awkward Commitment:** You must pay costs you didn't choose just because others pay them to sustain the practice.
  *   **Practical Stance:** Guilt is the right reaction if you benefit without paying; apologize to the group; the company can reasonably ask this of you.

  **L4**
  *   **Slug:** `prudence-view`
  *   **Name:** The Prudence View
  *   **Awkward Commitment:** Nothing is morally wrong unless you get caught or lose out personally.
  *   **Practical Stance:** No apology owed; guilt is the wrong reaction; the company can only advise, not ask.

  **L5**
  *   **Slug:** `guest-duty`
  *   **Name:** The Guest Duty
  *   **Awkward Commitment:** You must obey hosts even if their rules are worse than yours, simply because you are visiting.
  *   **Practical Stance:** Apology to the host is owed if you offend; guilt is the right reaction; the company can reasonably ask this of you.

  **L6**
  *   **Slug:** `local-knowledge-view`
  *   **Name:** The Local Knowledge View
  *   **Awkward Commitment:** You must follow locals even if you think they are wrong, because they know better how to get what they want.
  *   **Practical Stance:** No apology if you learn better later; mild awkwardness is the right reaction initially; the company can advise.

  **L7**
  *   **Slug:** `values-only-view`
  *   **Name:** The Values-Only View
  *   **Awkward Commitment:** You can ignore local rules if your own values achieve the same good, even if locals disagree.
  *   **Practical Stance:** No apology if values are met; guilt is the wrong reaction; the company cannot ask this of you.

  **L8**
  *   **Slug:** `reformer-view`
  *   **Name:** The Reformer View
  *   **Awkward Commitment:** You should break rules to fix them, even if it causes trouble for you or others now.
  *   **Practical Stance:** No apology owed; guilt is the wrong reaction; the company cannot ask this of you.

  **L9**
  *   **Slug:** `no-fact-view`
  *   **Name:** The No-Fact View
  *   **Awkward Commitment:** There is no right answer about the rule, only social meaning and the reactions you will get.
  *   **Practical Stance:** Mild awkwardness is the only signal; guilt is the wrong reaction; the company can only advise.
