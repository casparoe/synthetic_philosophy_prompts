  ### Decision Tree: Local Conventions and Obligations

  **N1** (Case 3: *The Press-At-The-Counter*). In this situation, is there a specific person losing out if you break the convention?
  *   **Yes** (e.g., an elderly person cannot get service) → Go to **N2**.
  *   **No** (e.g., general custom, no specific victim) → Go to **N3**.

  **N2** (Case 3: *The Press-At-The-Counter*). Is the main worry that you benefit from the system without paying the cost others pay?
  *   **Yes** (You get served while others struggle) → **Leaf L3**.
  *   **No** (You worry more about the victim than the system) → **Leaf L7**.

  **N3** (Case 5: *The Bubble*). Is this space controlled by your company or by the city?
  *   **Company** (Office floor, shuttle, codebase) → Go to **N4**.
  *   **City** (Restaurants, streets, apartments) → Go to **N5**.

  **N4** (Case 6: *The Shared Codebase*). Is the convention about style (arbitrary) or function (builds/runs)?
  *   **Style** (e.g., commit message length) → **Leaf L9**.
  *   **Function** (e.g., review timing) → **Leaf L6**.

  **N5** (Case 2: *The Invisible Pedestrian*). Is the rule written in law but universally ignored in practice?
  *   **Yes** (Illegal but everyone does it) → Go to **N6**.
  *   **No** (Social custom only) → Go to **N7**.

  **N6** (Case 2: *The Invisible Pedestrian*). Does being seen by others change whether breaking the rule is wrong?
  *   **Yes** (Only wrong if caught or judged) → **Leaf L4**.
  *   **No** (Wrong even if completely invisible) → **Leaf L1**.

  **N7** (Case 1: *The Last-Night Café* / Case 7: *The Gift Refusal*). Will you never return to this place or meet these people again?
  *   **No** (You will see them again) → **Leaf L5**.
  *   **Yes** (One-off interaction) → Go to **N8**.

  **N8** (Case 4: *The Export Problem*). Does your single act (tip, gift, bid) change the system prices or rules for locals?
  *   **Yes** (It drives prices up or changes norms) → **Leaf L8**.
  *   **No** (It has no systemic impact) → **Leaf L2**.

