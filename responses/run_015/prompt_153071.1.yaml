      *   *Dynamic Descriptions:* AI might generate "The CEO of X" even if X has no CEO, or if X doesn't exist.
      *   *Truth Assignment:* AI models (especially LLMs) don't strictly compute truth values in a logical sense; they predict tokens. However, Retrieval-Augmented Generation (RAG) or fact-checking modules *do* attempt to verify claims.
      *   *Hallucination:* This is the AI equivalent of an empty description. The AI asserts "The F is G" when there is no F.

