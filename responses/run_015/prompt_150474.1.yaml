answer: |-
  # Seminar Simulation: The Veridian Inheritance
  **Course:** Political Philosophy & Public Memory  
  **Session:** Commemorative Ethics as Fragmented Obligation  
  **Time:** 90 Minutes  
  **Participants:** 16 Undergraduates (4 Groups of 4)

  ## I. Learning Objectives
  By the end of this session, students will:
  1.  **Experience** the friction between expressive, institutional, and spatial obligations in public memory.
  2.  **Distinguish** between *honorific* commemoration (statues as praise) and *indexical* commemoration (street names as historical markers).
  3.  **Recognize** the limitations of deliberative democracy in resolving deep mnemonic conflicts.
  4.  **Acknowledge** the temporal dimension of memory (the "lived phenomenology") that a single vote cannot capture.

  ---

  ## II. Timeline & Flow (90 Minutes)

  | Time | Segment | Activity |
  | :--- | :--- | :--- |
  | **00–10** | **Briefing** | Distribute roles, budgets, and hidden constraints. Set the scene. |
  | **10–40** | **Preparation** | Committees draft proposals. **(Crisis Card deployed at min 20)**. |
  | **40–55** | **Presentations** | Civic Continuity, Moral Abolition, Palimpsestic Design (5 mins each). |
  | **55–65** | **Jury Q&A** | Residents' Jury questions the committees. |
  | **65–75** | **Deliberation** | Jury deliberates and casts secret ranked-choice vote. |
  | **75–90** | **Debrief** | **The Overrule**, The Street Pivot, Conceptual Mapping, Temporal Warning. |

  ---

  ## III. Materials & Handouts

  ### 1. The Scenario Brief (All Students)
  **Municipality:** Veridian  
  **The Object:** A 12-foot bronze statue of Elias Vance in Central Square.  
  **The History:** Vance ended a regional famine (1890s) via centralized grain distribution. Historians now confirm this was achieved through a system of coerced, punitive labor camps.  
  **The Law:** The *Interpretive Overlay Ordinance* permits plaques, counter-sculptures, or landscape alterations. It does *not* mandate removal, nor does it forbid it.  
  **The Adjacency:** The square is bounded by **Vance Way** (major thoroughfare), **Marlowe Street** (named for a dissident associate), and the **Old Canal** (neutral).  
  **The Goal:** Produce a recommendation for the Square.

  ### 2. Committee Role Cards (Distribute one per group)

  #### **Group A: Civic Continuity Committee**
  *   **Mandate:** Preserve the town's narrative cohesion. Sudden erasure of founders damages collective identity and civic trust.
  *   **Budget:** 10 Political Capital (PC) Points.
  *   **Costs:** Removal (8 PC), Major Art (5 PC), Plaques (2 PC), Legal Defense (3 PC).
  *   **⚠️ HIDDEN CONSTRAINT (Do not share with others):** You *must* ensure at least one physical reference to Vance (the statue or a plaque bearing his name) remains in the square. If the statue goes, a replacement marker must stay.
  *   **Win Condition:** Maximize PC remaining after Jury Vote.

  #### **Group B: Moral Abolition Committee**
  *   **Mandate:** Justice requires that state-sponsored honor cannot coexist with documented atrocity. The square must not signal approval of coercion.
  *   **Budget:** 10 Political Capital (PC) Points.
  *   **Costs:** Removal (8 PC), Major Art (5 PC), Plaques (2 PC), Legal Defense (3 PC).
  *   **⚠️ HIDDEN CONSTRAINT (Do not share with others):** No artifact may stand without explicit moral condemnation visible at the site (e.g., a plaque stating "This figure represents a history of abuse").
  *   **Win Condition:** Maximize PC remaining after Jury Vote.

  #### **Group C: Palimpsestic Design Committee**
  *   **Mandate:** Memory is layered. The past cannot be erased, but its meaning can be transformed through artistic intervention.
  *   **Budget:** 10 Political Capital (PC) Points.
  *   **Costs:** Removal (8 PC), Major Art (5 PC), Plaques (2 PC), Legal Defense (3 PC).
  *   **⚠️ HIDDEN CONSTRAINT (Do not share with others):** The original bronze statue must remain *visible* and *intact*. You may surround it, bury it partially, or light it differently, but you cannot remove it.
  *   **Win Condition:** Maximize PC remaining after Jury Vote.

  #### **Group D: Residents' Jury**
  *   **Mandate:** You represent the voters of Veridian. You do not design; you judge.
  *   **Task:** Listen to proposals. Ask clarifying questions. Cast a secret ranked-choice vote (1st, 2nd, 3rd).
  *   **Voting Criterion:** Do not use philosophical jargon. Vote based on: *"What kind of town do we want to be in ten years?"*
  *   **Power:** Your vote awards points to the committees.
      *   1st Place: Committee gains +5 PC.
      *   2nd Place: Committee gains +2 PC.
      *   3rd Place: Committee gains +0 PC.
      *   *Note: If a committee violates its budget, they are disqualified automatically.*

  ### 3. The Crisis Card (Facilitator Only)
  **Deploy at Minute 20 (10 minutes into Prep).**
  *Hand this note to all three Design Committees simultaneously.*

  > **BREAKING NEWS:** The *Veridian Gazette* reports that the Descendants of Laborers Association has filed an injunction. They demand either **full removal** OR **full contextualization**.
  >
  > **The Catch:** Their legal filing defines "contextualization" specifically: *"A plaque is insufficient. Context requires a counter-narrative structure that commands equal visual weight to the statue."*
  >
  > **Action:** You must adjust your proposal to account for this legal threat. If you choose contextualization, you must allocate 3 PC for Legal Defense or risk disqualification.

  ---

  ## IV. Facilitator Guide & Script

  ### Phase 1: Setup (00–10 mins)
  *   Divide the class. Hand out Role Cards.
  *   **Crucial:** Remind groups *not* to reveal their Hidden Constraints to other groups during negotiation. They can argue for their position, but the constraint is their internal "red line."
  *   Explain the Political Capital (PC) system. Write the Cost Menu on the board.
  *   **Start the clock.**

  ### Phase 2: Preparation & Crisis (10–40 mins)
  *   Circulate among groups. Ensure they are spending their PC.
  *   **AT MINUTE 20:** Stop the room for 30 seconds. Distribute the **Crisis Card**.
  *   *Facilitator Note:* Watch the Palimpsestic group closely. The Crisis Card forces them to spend PC on Legal Defense or expensive art ("equal visual weight"). This often breaks their budget, forcing them to negotiate with Continuity or Abolition for support. This creates the "strategic negotiation" required.

  ### Phase 3: Presentations & Vote (40–75 mins)
  *   **Presentations (5 mins each):** Strict timing.
  *   **Jury Q&A (10 mins):** Jury asks about costs, aesthetics, and moral clarity.
  *   **Deliberation (10 mins):** Jury leaves the room (or turns backs) to vote. Collect the ballots.
  *   **Tally:** Announce the winner based on PC + Jury Bonus.

  ### Phase 4: The Debrief (75–90 mins)
  *This is the most critical pedagogical moment. Do not rush.*

  #### **Step 1: The Overrule (2 mins)**
  *   **Facilitator:** "Thank you. The vote is tallied. However, I must now update you on the outcome in Veridian."
  *   **Reveal:** "The Town Council reviewed your recommendation. They **overruled** it. The Council has decided to **melt down the statue** to mint coins for a labor reparations fund, but they will **keep the name 'Vance Way'** unchanged."
  *   **Reaction:** Allow 30 seconds of shock/frustration.
  *   **Point:** "Public memory is rarely decided by deliberation alone. Institutional power (the Council) and material constraints (infrastructure) often override ethical design."

  #### **Step 2: The Street Pivot (5 mins)**
  *   **Facilitator:** "You spent 60 minutes debating the *statue*. You barely mentioned *Vance Way*. Why?"
  *   **Discussion Questions:**
      *   "If the statue is gone (melted down), but the street name remains, is Vance still honored?"
      *   "Does a street name function the same way as a bronze figure?"
  *   **The Conceptual Reveal:** Guide them to this distinction (write on board):
      *   **Statue = Honorific Register.** It stands *above* the viewer. It says: "Emulate this virtue." It demands a binary moral judgment (Hero vs. Villain).
      *   **Street Name = Indexical Register.** It runs *under* the viewer. It says: "This is where we are." It marks historical presence without necessarily endorsing the moral character.
  *   **The Collapse:** "Your frameworks (Keep vs. Remove) worked for the statue but collapse for the street. Removing a street name is an administrative erasure; removing a statue is a moral statement. The Council's decision (Remove Statue, Keep Street) exploits this gap."

  #### **Step 3: Mapping the Failure (5 mins)**
  *   **Facilitator:** "Let's be honest about how this simulation went."
  *   **Forecast of Failure:**
      *   **To Palimpsest Group:** "You likely felt dismissed. In real debates, 'complexity' is often heard as 'avoidance.' Did the Jury treat your nuance as cowardice?"
      *   **To Jury:** "Did you vote based on moral reasoning, or on how the proposal made you *feel*? (e.g., Disgust at the statue vs. Pride in the town)."
      *   **To All:** "Did the debate stall in binary terms (Keep/Remove) until the Crisis Card forced you to specify *costs*?"
  *   **Connect to Theory:**
      *   **Expressive Obligation:** What the statue *says* (Honorific).
      *   **Institutional Obligation:** What the Council *did* (Overrule/Street Name).
      *   **Spatial Obligation:** How we move through the square vs. drive down the road.

  #### **Step 4: The Temporal Warning (3 mins)**
  *   **Facilitator:** "There is one thing this simulation cannot reproduce. You decided the fate of this statue in 90 minutes."
  *   **Read/Paraphrase:** "In reality, commemorative ethics is a *temporal* phenomenon. It is the slow, lived phenomenology of walking past a modified monument every day for years. An overlay might feel transformative today, but in five years, it may become invisible background noise. Or, it might weather into something new. A classroom vote captures the *moment of decision*, but it cannot capture the *long-term ethical life* of the object."
  *   **Closing:** "Your assignment is not to solve Veridian. It is to ask: When the 'decision' is over, when does the work of memory actually begin?"

  ---

  ## V. Facilitator Notes on Potential Pitfalls

  1.  **Budget Gaming:** Students may try to hoard points. Remind them that a proposal with 0 PC left is valid, but a proposal *over* budget is disqualified. The tension is between *viability* and *ideology*.
  2.  **The Hidden Constraints:** If groups reveal their constraints too early, the negotiation collapses. Circulate and remind them: "This is your internal mandate. You must argue for it publicly without admitting it is a rigid rule."
  3.  **The Street Pivot:** Students may resist the idea that street names are different from statues. Press them: "If I name my dog 'Vance', is that an honor? If I name my sewage plant 'Vance', is that an insult? Naming is indexical. Statues are honorific. The Council knows this."
  4.  **Time Management:** The Debrief is where the learning happens. If the Vote runs long, cut the Q&A, not the Debrief. The "Overrule" and "Temporal Warning" are non-negotiable.

  ## VI. Post-Class Assignment (Optional)
  *Write a 2-page reflection:* "The Council kept Vance Way but melted the statue. Using the Honorific vs. Indexical distinction, argue whether this decision is ethically consistent or hypocritical. Does the 'slow phenomenology' of driving down Vance Way change your answer?"
