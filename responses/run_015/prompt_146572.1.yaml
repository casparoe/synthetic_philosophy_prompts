      *   *Nature of the Act:* It's a *Tathandlung* (fact/act), not a *Tatsache* (fact). It's an activity, not a static thing.
      *   *Subject-Object Identity:* In the act of self-positing, the I is both the positer (subject) and the posited (object). They are identical in this specific act.
      *   *Non-Representational:* Fichte is explicitly anti-representational here. It's not a symbol pointing to itself; it's the *existence* of consciousness constituting itself. It's ontological/epistemological foundation, not a semantic trick.
