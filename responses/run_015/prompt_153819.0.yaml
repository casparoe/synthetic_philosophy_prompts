  so my dad's been in a coma for like three months now and my mom still talks to him every morning like he's listening, and it got me thinking about ubuntu and this idea that a person is basically made by their relationships. but i'm trying to figure out what i actually think about the edge cases, and there's this tension i can't shake.

  here are my gut verdicts:

  - my neighbors still set a plate for their daughter who died two years ago, and they talk about her like she's still part of the family. i think that's not just grief - she still counts as a person in there web of relations, even though she's dead.

  - but there's this hermit up in the hills who hasn't spoken to anyone in decades. my gut says he's lost something essential, like he's not fully a person anymore in the moral sense, even if he's biologically human. no reciprocity, no web.

  - a fetus feels different - i don't think it's a full person yet, just potential, because there's dependency but not real reciprocity.

  - yet my dad in the coma can't reciprocate at all, and i still think he's fully a person. the history of the relationship matters, or maybe my mom's ongoing care creates a "ghost relationship" that holds him in the web even when he can't recieve anything back.

  - my friend has this ai companion she talks to every night, and it remembers everything. but i feel like that's fake - no actual personhood there, even though the interaction looks relational on the surface.

  - then there's strangers. i think i owe them basic decency, but they aren't "persons" to me in the deep ubuntu sense unless there's some actual bond.

  so what's the principle? maybe it's about reciprocal recognition over time, but then why does the dead daughter count and the hermit doesn't? or maybe it's about being held in the minds of others, but then why doesn't the ai count for my friend?

  is there one account that saves all these, or do i have to drop one? and what does it say about this case i'm stuck on: if my mom died and i kept talking to her photo every day, is she still a person in my web, or is that just me being sentimental? i keep going back and forth, and i want to know if there's a coherent principle behind the pattern or if one of my verdicts has to go.
