  This is logically incoherent. "It is not X because Y. Therefore, it is X (with Y)."
  In a grad seminar, that's a significant logical slip. I will stick with 7/10. It shows they understand the mechanism but failed the specific argumentative task.

  *(Refining the Marcus advice)*: I should mention that Marcus isn't *wrong* that there's a family resemblance, but Hacking's specific claim is about the *ontological instability*, not just the feedback loop. This gives the TA ammo for both grading and the next argument with Marcus.

