          *   Circularity (defining computation in terms of mind or vice versa).
      *   **Task:** Rank these defeaters from "fatal" to "merely awkward," distinguish what a committed computationalist would concede vs. dismiss, and give an honest assessment of the view's exposure.

  2.  **Deconstruct the Core Objections:**

      *   **Objection 1: The Triviality/Pancomputationalism Argument (Putnam/Searle).**
          *   *Claim:* Any open physical system can be mapped to any finite state automaton. Therefore, saying "the brain computes" is trivial unless we restrict what counts as computation.
          *   *Implication:* If everything computes, computation explains nothing specific about the mind.
          *   *Computationalist Response:* Need a notion of *causal structure* or *counterfactual support*. It's not just about the actual state trajectory, but what *would* happen if inputs changed.

      *   **Objection 2: Implementation Independence vs. Physical Realization.**
          *   *Claim:* Computation is defined syntactically/abstractly. Physics is semantic/causal. How does the physical brain "know" it's implementing *this* algorithm and not *that* one?
          *   *Implication:* Computation might be observer-relative.
          *   *Computationalist Response:* Causal powers of the physical substrate constrain the computation. It's not *purely* relative; the physics must support the counterfactuals.

      *   **Objection 3: Circularity (The Definition Problem).**
          *   *Claim:* To define "computation" rigorously, we often appeal to agents, intentions, or interpretations (e.g., input/output mappings). If we use mental terms to define computation, we can't use computation to explain mind.
          *   *Implication:* The theory is circular.
          *   *Computationalist Response:* Use mechanistic accounts of computation (Piccinini). Computation is a physical process involving vehicles and rules, defined without appeal to semantics.

      *   **Objection 4: The Level of Abstraction Problem.**
          *   *Claim:* At the quantum level, it's physics. At the neuron level, it's spikes. At the cognitive level, it's symbols. Which level is the *real* computation?
          *   *Implication:* Computationalism might be just a useful model, not an ontology.
          *   *Computationalist Response:* Multiple realizability is a feature, not a bug. But there must be a "causal grain" where the computation is physically grounded.

  3.  **Evaluate "Fatal" vs. "Awkward":**

      *   *Fatal:* If computation is purely observer-relative, computationalism collapses into idealism or triviality. If the definition of computation *requires* a mind (homunculus), it's circular.
      *   *Awkward:* If we have to qualify "computation" heavily (e.g., "mechanistic computation"), it loses some of its elegant universality, but survives.

  4.  **Drafting the Response - Section by Section:**

