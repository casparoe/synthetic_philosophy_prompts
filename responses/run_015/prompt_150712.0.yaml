  **DRAFT: The Creature Sorter (v.0.4)**
  **From:** Neuro Lab (J.)
  **To:** Writer (You)
  **Date:** Oct 14, 1998
  **Re:** Mind vs. Reflex argument

  Look, stop arguing about "souls" and run these cases through the logic gate. If you can't answer these six questions, you don't know what kind of mind you're writing. Follow the arrows.

  ***

  ### THE DECISION TREE

  **Q1: The Cost of Failure**
  When the strategy fails, what pays the price?
  *   **(A)** The organism dies (or fails to reproduce). → *Go to Q2*
  *   **(B)** The individual feels pain or gets corrected, but survives. → *Go to Q3*
  *   **(C)** Nothing physical happens; an idea is just discarded. → *Go to Q4*

  **Q2: The Source of Variation (For Q1-A)**
  Where did the successful trait come from?
  *   **(A)** Random mutation/physical growth over generations. → **LEAF: DARWINIAN**
  *   **(B)** Physical restructuring based on environmental fit (no genes). → **LEAF: DARWINIAN**

  **Q3: The Locus of Testing (For Q1-B)**
  Does it have to physically perform the action to learn it works?
  *   **(A)** Yes. It must touch the fire to know it burns. → *Go to Q5*
  *   **(B)** No. It can watch someone else touch the fire. → *Go to Q6*

  **Q4: The Simulation Engine (For Q1-C)**
  Where does the testing happen?
  *   **(A)** Inside the head (mental rehearsal). → *Go to Q6*
  *   **(B)** On paper/tools/external media. → **LEAF: GREGORIAN**

  **Q5: The Reinforcement Type (For Q3-A)**
  How is the behavior shaped?
  *   **(A)** Direct reward/punishment (operant conditioning). → **LEAF: SKINNERIAN**
  *   **(B)** Weight adjustment via error correction (backprop). → **LEAF: SKINNERIAN**

  **Q6: The Cultural Offload (For Q3-B, Q4-A)**
  Does it use language or tools to store the thinking?
  *   **(A)** No. It's just smart internal modeling. → **LEAF: POPPERIAN**
  *   **(B)** Yes. It uses symbols, words, or other minds as tools. → **LEAF: GREGORIAN**

  ***

  ### SCORING KEY: WHERE YOUR CASES LAND

  1.  **Synthetic Slime-Mold** (Finds food faster after split/re-merge)
      *   *Path:* Q1(A) → Q2(B).
      *   *Verdict:* **DARWINIAN.** It's physical selection without a brain. The "learning" is actually just structural selection.

  2.  **Octopus** (Shocked once in jar, never enters)
      *   *Path:* Q1(B) → Q3(A) → Q5(A).
      *   *Verdict:* **SKINNERIAN.** Classic operant conditioning. Pain reinforces the avoidance. It had to act (enter) to learn.

  3.  **Chatbot** (Updates weights after human correction)
      *   *Path:* Q1(B) → Q3(A) → Q5(B).
      *   *Verdict:* **SKINNERIAN.** Don't let the tech fool you. If it needs an external error signal to adjust weights, it's just digital reinforcement. It's not imagining the answer.

  4.  **Kid** (Imagines bridge collapsing before building)
      *   *Path:* Q1(C) → Q4(A) → Q6(A).
      *   *Verdict:* **POPPERIAN.** "Let my hypotheses die in my stead." She runs the simulation internally without risking the blocks (or herself).

  5.  **Crow** (Solves puzzle after watching another fail)
      *   *Path:* Q1(B) → Q3(B) → Q6(B).
      *   *Verdict:* **GREGORIAN.** It's using another mind as a tool. Social learning offloads the cost of trial-and-error to the other crow.

  ***

  ### KNOWN GLITCHES & EMPTY SPACE

  **1. The Empty Branch (Skinnerian + Gregorian - Popperian)**
  *   *The Combo:* A creature that uses tools/language to offload thinking but *cannot* run internal simulations. It only learns via external reinforcement.
  *   *Diagnosis:* **UNSTABLE.** Technically possible (think of a parrot mimicking words for treats), but philosophically ugly. If you use language (Gregorian), you usually need to model meaning internally (Popperian). A tool-user who doesn't understand the tool is just a reflex machine holding a hammer. Dennett would say this combo collapses into Skinnerian eventually.

  **2. The Blind Spot (Popperian vs. Gregorian)**
  *   *The Problem:* The tree struggles to separate pure internal simulation (Popperian) from tool-assisted simulation (Gregorian).
  *   *Why:* Both involve "thinking before acting."
  *   *The Fix:* You need a case where the thinking *requires* the external artifact.
      *   *Current Case:* Kid imagining bridge (Popperian).
      *   *Needed Case:* An architect using a slide rule or blueprint to find a flaw she couldn't see in her head. If the thought *cannot exist* without the external tool, it's Gregorian. If she can do it with eyes closed, it's Popperian.

  ***

  *Note: Don't cite this in the book. Just argue over it.*
