  2. **Nearest established concepts, and where each falls short**
  First, *The Asymmetry* is the substantive moral claim that there is no duty to create happy lives but a duty to avoid miserable ones. It falls short because it is a normative conclusion, not a structural description of the value function. Collapsing them obscures *how* the theory achieves the asymmetry (often via reference dependence). Second, the *Person-Affecting Restriction* claims an outcome is only better if better for someone. This falls short because your second example involves merely possible people where identity is fixed across options, yet the baseline dependence persists. Person-affecting views often rely on this structure, but the structure can exist without strict person-affecting constraints.

  Third, *Incomparability* suggests A and B lack a value relation. This falls short because incomparability is usually symmetric. Your observation is directional (adding vs. removing yields different permissions), implying the relation changes based on the vector of change, not just the endpoints. Fourth, *Reference-Dependent Preferences* from decision theory are usually descriptive or psychological. You are identifying a *normative* claim that value *ought* to be calculated this way, not that agents merely perceive it so. Finally, *Critical-Level Utilitarianism* is an impersonal view subtracting a threshold. Fixed critical levels are baseline-independent (state-ranking). Only *variable* critical levels (dependent on existing population) replicate your phenomenon. Distinguishing these shows the phenomenon is not inherent to all non-utilitarian views, but specific to those tying value to transitions.

  3. **The carving**
  The invariant core is that the theory assigns value to *transitions* or *changes* relative to a reference point, rather than to *states* independently. Betterness is a function $V(A, B, Reference)$, not $V(A, B)$. A clear instance is the Asymmetry case: adding a happy person to existence is neutral (from an empty baseline), but removing them is bad (from an existing baseline). The verdict flips based on the starting point. A clear non-instance is Total Utilitarianism. State A has value 100, State B has value 110. B is better than A regardless of whether we start at A, B, or C.

  The boundary case is Fixed Critical-Level Utilitarianism. It avoids the Repugnant Conclusion but remains baseline-independent. It ranks states impersonally by subtracting a constant threshold from welfare. I rule this a non-instance because the ranking of A vs B is invariant to the status quo. This proves your phenomenon is not required to avoid the Repugnant Conclusion, but is specific to views attempting to capture the Asymmetry intuition specifically. The structure is distinct from the goal of avoiding repugnancy.

  4. **If there is no name, coin one**
  Label: *Axiological Reference Dependence* (ARD).
  Definition: A moral theory exhibits ARD if the deontic verdict (permissible/obligatory) or axiological ranking between two states $X$ and $Y$ is contingent upon which state is designated as the status quo or starting point of the decision.
  Test: Construct a pair of states $X$ and $Y$. Ask the theory to rank them. Then reframe the choice as a transition from $X$ to $Y$ versus staying at $X$. If the theory permits staying at $X$ but forbids moving to $Y$, while simultaneously implying $Y$ is not worse than $X$ in a static comparison, it exhibits ARD.
  Dispute Resolution: In the boundary case (Fixed Critical-Level), the ranking of $X$ vs $Y$ remains constant regardless of framing. Thus, it fails the test. ARD requires the *input* of the status quo to determine the *output* ranking, not just to determine feasibility. This distinguishes it from simple constraint-based theories where feasibility changes but value does not.

  5. **Feature or defect, and whether it is avoidable**
  From a regulatory CBA standpoint, ARD is a defect: it invites manipulation via framing and violates consistency. However, in population ethics, it may be a necessary feature for theories prioritizing the *Asymmetry* intuition over impersonal aggregation. It is not unavoidable for escaping the Repugnant Conclusion, as Fixed Critical-Level Utilitarianism demonstrates. It is avoidable if one accepts impersonal harms (lives not created are "losses" relative to a potential maximum). I would change my mind if a baseline-independent theory could capture the Asymmetry intuition without implying the Repugnant Conclusion or Sadistic Conclusion. Currently, ARD seems the price paid to preserve the intuition that existence cannot be a benefit relative to non-existence, while non-existence prevents harm. It is a structural cost of reconciling person-affecting intuitions with impersonal outcomes.
