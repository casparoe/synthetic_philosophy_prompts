prompt: |-
  Hi — I'm the deputy director of a tiny county emergency management agency in a river valley: about eleven miles of levee, an upstream dam owned by a power company that is not great at returning calls, a trailer park and an industrial park on the floodplain, roughly nine thousand people total. Eight to twelve times a year I'm the duty officer on a call where, inside thirty or forty minutes, with a laptop, three browser tabs and one phone call, I have to decide what to recommend to the county judge. She signs the order, and whatever I write on the one-page rationale later gets read by the sheriff's office, the state auditor, an insurance adjuster, and occasionally a reporter. The sentence I keep having to write is some version of we know the water will not overtop the levee at the Maple Street gauge, or we know it will, and the difference between those two sentences is sometimes an evacuation of four hundred people at night.

  I got into an argument with a hydrologist friend about this last spring — we had a near miss with the pump station at Maple Street, and ever since, that particular failure mode is the only one anyone in the room can think about, so the same forecast reads completely differently to us than it did a year earlier. She told me to go read up on two things, and I did, sort of: the view that whether someone counts as knowing depends on what is at stake for them (I think it's called pragmatic encroachment, and there's some version where the bar for knowledge goes up when the decision is high-stakes), and the view that the standards a knowledge claim has to meet shift with which error possibilities are live in the conversation (contextualism?). Both seem to say the bar moves, but for different reasons and maybe in different directions, and I need one protocol, not two. So: write me a decision procedure my duty officers and I can actually run in the time we have, built out of those ideas, that starts from a forecast plus a map and ends with one of three outputs — assert knowledge, refuse to assert knowledge and act on the precautionary branch anyway, or stop and hand the call to a person as a values question. For each step say what would count as a sufficient answer, where the procedure just terminates in a no, and where a human has to decide because it's not a factual question anymore.

  Three things I specifically need it to handle, because they are where I keep tying myself in knots. First, whose stakes? If the bar tracks stakes, it seems like it should track the stakes of the people in the trailer park, not mine — but I'm the one making the call, and my stakes are different and point the other way: I get blamed for a costly false alarm and for crying wolf, and that pushes me toward evacuating more than the residents' own interests do. Second, sometimes the stakes cut both ways at once: raising the bar means waiting twelve hours for a better forecast, and waiting eats the lead time the evacuation needs, so being more careful makes the outcome worse if I'm wrong — I need the procedure to say what to do when the standard the stakes demand is literally unreachable inside the window. Third, whatever I write travels: my we know gets read weeks later by an auditor or an adjuster who has no idea what was at stake that night or which failure modes we'd been worried about, so I think the protocol needs a step that records which error possibilities were excluded, or something equivalent. Please include a short section on what the procedure cannot do, and please work it through on three cases: (a) overnight, 60 percent chance of overtopping at Maple Street, four hundred homes, a lot of elderly residents, six hours of lead time; (b) one identical forecast covering two zones at once, the trailer park and a warehouse district where the only thing at risk is empty buildings and a parking lot — if the procedure tells me I know the water won't reach the warehouses but not that it won't reach the trailers, on the very same evidence, say so plainly, because that's the answer I'm going to hate and I'd rather see it worked out than avoided; and (c) a slow-onset one, three days out, where a better model run lands in twelve hours but evacuation needs thirty. Assume the person running this has no philosophy training and is tired; no citations needed, and please don't just tell me to be more careful.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the User and Request:**
      *   **User:** Deputy Director of a small county emergency management agency.
      *   **Context:** River valley, 11 miles of levee, upstream dam (unresponsive power co.), trailer park + industrial park on floodplain, ~9k people.
      *   **Role:** Duty Officer (8-12 times/year).
      *   **Task:** Decide within 30-40 mins what to recommend to the County Judge (who signs the order).
      *   **Output:** A one-page rationale ("We know water will/won't overtop..."). This gets audited later.
      *   **Problem:** Struggling with epistemic standards under pressure. Specifically, how "knowing" changes based on stakes and context (Pragmatic Encroachment vs. Contextualism).
      *   **Specific Needs:** A practical decision procedure (protocol) based on these philosophical concepts but usable by tired non-philosophers. Must handle three specific knotty problems:
          1.  *Whose stakes?* (Residents vs. Official's reputation).
          2.  *Conflicting stakes/Time pressure:* (Higher bar = less time to evacuate).
          3.  *Audit Trail:* (Future readers need to know *why* "knowledge" was claimed).
      *   **Outputs:** Assert Knowledge, Refuse Knowledge (Precautionary), or Escalate (Values Question).
      *   **Cases to Test:** (a) High risk/High vulnerability, (b) Mixed stakes (trailers vs. warehouses), (c) Slow onset/Time vs. Accuracy trade-off.
      *   **Tone:** Practical, direct, no jargon, no citations, empathetic to the stress.

  2.  **Deconstruct the Philosophical Concepts:**
      *   *Pragmatic Encroachment:* Knowledge depends on stakes. High stakes = harder to claim "know."
      *   *Contextualism:* Knowledge depends on which error possibilities are "live" (being discussed/worried about). If we're worried about the pump station, that error possibility is live, raising the bar.
      *   *Synthesis for Protocol:* The protocol needs to explicitly define *whose* stakes matter (the vulnerable population) and *which* errors are live (based on current intel/recent history). It needs to acknowledge that "knowing" isn't just about data; it's about whether the data is good *enough* for the specific action required.

  3.  **Drafting the Decision Procedure (The "Protocol"):**
      *   *Goal:* 30-40 minute window. Needs to be a checklist or flowchart style.
      *   *Step 1: Define the Action & The Stakes.* (Addresses "Whose stakes?"). The stakes belong to the people affected by the *action*, not the official.
      *   *Step 2: Identify Live Error Possibilities.* (Addresses Contextualism). What could go wrong *specifically* given current intel (e.g., the Maple Street pump).
      *   *Step 3: The Time/Accuracy Trade-off.* (Addresses "Stakes cut both ways"). If raising the bar kills lead time, the bar must lower to allow action, *unless* the risk is catastrophic.
      *   *Step 4: The Audit Statement.* (Addresses "Whatever I write travels"). Documenting the excluded errors.
      *   *Decision Nodes:* Yes (Know), No (Precaution), Escalate (Values).

  4.  **Addressing the Three Specific Knotty Problems:**
      *   *Whose Stakes?* The protocol must explicitly state: "Stakes = Worst-case harm to the vulnerable population." Ignore personal reputation risk in the epistemic calculation (though acknowledge it exists).
      *   *Conflicting Stakes (Time vs. Certainty):* Introduce a "Lead Time Threshold." If waiting for certainty makes evacuation impossible, you cannot claim "Knowledge of Safety." You must act on precaution.
      *   *Audit Trail:* A specific box on the one-pager: "Excluded Error Possibilities."

  5.  **Developing the Three Test Cases:**
      *   *Case A (Overnight, 60%, Elderly):* High stakes. 60% is not "knowledge" of safety. High vulnerability. Action: Precautionary (Evacuate).
      *   *Case B (Mixed Zones):* Same forecast, different stakes. Trailers (High stakes) vs. Warehouses (Low stakes). Protocol must allow saying "We know it's safe for warehouses" but "We don't know for trailers." This is the "Contextualism" part—context changes by zone.
      *   *Case C (Slow Onset):* Time vs. Accuracy. Waiting 12 hours leaves 18 hours. Evac needs 30. Waiting makes safety impossible. Action: Act now on current data (Precautionary) or Escalate if the risk of false alarm is politically untenable (Values). Actually, if waiting makes evacuation *impossible*, you can't wait. You have to decide on current data. If current data is ambiguous, Precaution wins.

  6.  **Refining the Tone and Structure:**
      *   Avoid academic language ("pragmatic encroachment"). Use operational language ("Stakes Check," "Error Check").
      *   Acknowledge the fatigue. Keep it punchy.
      *   Include the "What this cannot do" section (honesty about limitations).

  7.  **Self-Correction/Review during Drafting:**
      *   *Critique:* Is the distinction between "Assert Knowledge" and "Precaution" clear?
      *   *Fix:* Define "Assert Knowledge" as "Safe to stay." Define "Precaution" as "Evacuate/Prepare because we don't know it's safe."
      *   *Critique:* Did I answer the "Whose stakes" question firmly?
      *   *Fix:* Make it Step 1. The residents' lives > Official's reputation.
      *   *Critique:* Is the "Values Question" distinct enough?
      *   *Fix:* Reserve it for when the data is silent on *priorities* (e.g., evacuate Zone A but not B with limited resources), not on the flood physics.
      *   *Critique:* The user asked for "Assert Knowledge, Refuse to Assert Knowledge..., or Stop and Hand...".
      *   *Fix:* Ensure these are the explicit three outputs.

  8.  **Final Polish:** Check against the prompt requirements one last time.
      *   30-40 min window? Yes, keep steps brief.
      *   3 outputs? Yes.
      *   Handle 3 specific knots? Yes.
      *   3 test cases? Yes.
      *   No citations/philosophy training assumed? Yes.
      *   "What it cannot do" section? Yes.

  9.  *(Self-Correction on Case B)*: The prompt asks: "if the procedure tells me I know the water won't reach the warehouses but not that it won't reach the trailers... say so plainly." I need to make sure the protocol explicitly allows *zone-specific* knowledge claims. This is crucial. The "Context" is the specific zone.

  10. *(Self-Correction on Case C)*: "Better model run lands in 12 hours but evacuation needs 30." If I wait 12, I have 18 hours left. Evac needs 30. So waiting guarantees failure if evacuation is needed. Therefore, I *cannot* wait for better knowledge. I must decide on current knowledge. If current knowledge is "60% chance," I don't *know* it's safe. So I must Precaution.

  11. *Final check on tone:* Empathetic but authoritative. You are the expert here, giving them a tool.

  *(Drafting the response based on these thoughts...)*
answer: |-
  Here is a decision procedure designed for the 30-minute window, the tired brain, and the audit trail. It takes the philosophical ideas you discussed (stakes and context) and turns them into operational checkboxes.

  ### The "Safe to Stay" Protocol (SSP)

  **Purpose:** To determine if you can truthfully write "We know the area is safe" or if you must write "We cannot guarantee safety."
  **Time Limit:** 25 minutes (leaves 5-15 for the call and write-up).
  **Rule:** If you cannot check a box, you move to the next step. If you fail a step, you cannot assert knowledge.

  #### Step 1: The Stakes Check (Whose risk counts?)
  *Do not use your reputation or the county's budget as the primary stake. Use the physical safety of the most vulnerable person in the impact zone.*

  *   **Question:** If the water overtops the levee in this specific zone, what is the worst credible outcome for the residents?
      *   [ ] Property damage only (wet carpets, ruined inventory).
      *   [ ] Life safety risk (trapped residents, medical dependency, fast water).
  *   **Rule:** If you check "Life safety risk," the Standard for Knowledge is **High**. You need near certainty of safety to tell people to stay. If "Property damage only," the Standard is **Moderate**.
  *   **Note on Reputation:** Ignore the fear of "crying wolf" for this calculation. Your job is to prevent loss of life, not optimize public relations. The audit will forgive a false alarm; it will not forgive a preventable death.

  #### Step 2: The Live Error Check (What are we worried about *today*?)
  *Context changes the bar. If a specific failure mode is "live" (currently discussed or recently failed), you must rule it out to claim knowledge.*

  *   **Question:** Is there a specific, identified mechanism that could cause flooding even if the gauge looks okay? (e.g., The Maple Street pump station, a specific levee seam, the unresponsive dam operator).
      *   [ ] No. The system is nominal.
      *   [ ] Yes. [Write specific failure mode, e.g., "Maple Pump"].
  *   **Rule:** If you check "Yes," you cannot assert knowledge of safety unless you have *direct confirmation* that this specific mechanism is functional. A general forecast is not enough.
  *   **Audit Note:** You must write this specific failure mode in the rationale box (see Step 4).

  #### Step 3: The Time-Certainty Trade (Can we afford to wait?)
  *Sometimes the stakes demand higher certainty, but the clock demands immediate action.*

  *   **Question:** Compare **Time to Evacuate** vs. **Time to Better Data**.
      *   [ ] We have enough lead time to wait for better data *and* still evacuate if needed.
      *   [ ] Waiting for better data eats the lead time required to evacuate.
  *   **Rule:** If you check the second box, you are **forbidden** from waiting for higher certainty. You must decide on current data.
      *   If current data says "Safe": You still cannot assert *Knowledge* (because data is incomplete). You must move to **Precaution**.
      *   If current data says "Unsafe": Act immediately.
  *   **Why:** You cannot claim "We know it's safe" if the only way to verify safety is to wait until it's too late to leave.

  #### Step 4: The Output Decision
  *Select one of the three paths based on the checks above.*

  **Path A: Assert Knowledge (Recommend: Stay / No Action)**
  *   **Conditions:**
      1.  Stakes are Low OR (Stakes are High AND data shows near-zero risk).
      2.  No "Live Errors" are unresolved.
      3.  Time is not a constraint.
  *   **Rationale Text:** "Based on [Forecast X] and confirmation of [Live Error Y status], we know water will not overtop."

  **Path B: Refuse Knowledge / Precautionary Branch (Recommend: Evacuate / Prepare)**
  *   **Conditions:**
      1.  Stakes are High AND data is ambiguous (e.g., 60% chance).
      2.  OR: A "Live Error" is unresolved.
      3.  OR: Time constraints prevent waiting for certainty (see Step 3).
  *   **Rationale Text:** "Current data does not rule out [Live Error/ Risk]. Due to high stakes/lead time constraints, we cannot guarantee safety. Precautionary measures recommended."

  **Path C: Stop / Hand Off (Values Question)**
  *   **Conditions:**
      1.  The data is clear, but the *priority* is unclear. (e.g., We can only evacuate one zone; which one?).
      2.  The cost of the Precautionary Branch (Path B) is catastrophic (e.g., evacuating a hospital during a blizzard) and the risk is borderline.
  *   **Action:** Call the County Judge immediately. Do not recommend. Present the trade-off: "Option A risks lives; Option B risks economic collapse. I cannot make this call."

  #### Step 5: The Audit Box (For the future reader)
  *Every one-page rationale must include this box at the bottom.*

  | **Excluded Error Possibilities** | **Stakes Classification** | **Time Constraint?** |
  | :--- | :--- | :--- |
  | *(e.g., Maple Pump verified operational)* | *(e.g., High - Elderly residents)* | *(e.g., No - 12hrs lead time)* |

  ***

  ### What This Procedure Cannot Do

  1.  **It cannot make the risk go away.** It only clarifies whether you can claim *knowledge* of safety. Often, the answer will be "We don't know," which forces a precautionary evacuation. That will feel like a failure, but it is the correct epistemic outcome.
  2.  **It cannot protect you from political blame.** If you evacuate 400 people and the water stays dry, people will be angry. This protocol ensures your rationale is defensible to an auditor, not necessarily to a angry resident.
  3.  **It cannot solve resource shortages.** If you don't have enough buses to evacuate the trailer park, this protocol tells you to evacuate, but it doesn't find the buses. That is a Path C (Values/Resource) escalation.

  ***

  ### Worked Cases

  Here is how the protocol handles the three knots you described.

  #### Case A: Overnight, 60% chance, 400 homes, elderly, 6 hours lead time.
  *   **Step 1 (Stakes):** High. Elderly residents, overnight, life safety risk. **Standard: High.**
  *   **Step 2 (Live Errors):** Maple Street pump is the worry. Is it verified? If no, **Fail.**
  *   **Step 3 (Time):** 6 hours lead time. Evacuation takes 4 hours. Waiting 2 hours for a better model leaves 4 hours. Tight, but possible. However, 60% chance means the forecast is *not* "Safe."
  *   **Step 4 (Output):** You cannot assert knowledge of safety. 60% risk is not "We know it won't happen."
  *   **Decision:** **Path B (Precaution).** Recommend evacuation.
  *   **Audit Box:** Excluded Errors: None (Pump status unknown). Stakes: High. Time: Tight.
  *   **Why:** The stakes are high, so the bar for "knowing it's safe" is near 100% certainty. You have 60% risk. You don't know it's safe. You must act on precaution.

  #### Case B: One forecast, Two zones (Trailer Park vs. Warehouse District).
  *   **Step 1 (Stakes):**
      *   *Trailers:* High (People sleeping).
      *   *Warehouses:* Low (Empty buildings).
  *   **Step 2 (Live Errors):** Same forecast, same water level.
  *   **Step 3 (Time):** Same for both.
  *   **Step 4 (Output):**
      *   *For Warehouses:* Stakes are Low. 60% risk of water in a parking lot is acceptable uncertainty. You can **Assert Knowledge** that "Significant danger is unlikely" (Path A).
      *   *For Trailers:* Stakes are High. 60% risk of water in bedrooms is unacceptable uncertainty. You **Refuse Knowledge** (Path B).
  *   **Decision:** **Split Recommendation.** Evacuate trailers, advise warehouses to sandbag/monitor.
  *   **Audit Box:** You write two lines.
      *   Zone 1 (Trailers): Stakes High -> Precaution.
      *   Zone 2 (Warehouses): Stakes Low -> Knowledge Asserted.
  *   **Why:** This is the "Contextualism" part. The context (who is at risk) changes the standard for knowledge. It is logically consistent to say "I know the warehouse is safe enough" and "I don't know the trailer park is safe enough" on the exact same water data. The protocol forces you to write this down so the auditor sees you didn't make a mistake; you made a distinction.

  #### Case C: Slow onset, 3 days out. Better model in 12 hours. Evac needs 30 hours.
  *   **Step 1 (Stakes):** Assume High.
  *   **Step 2 (Live Errors):** General forecast uncertainty.
  *   **Step 3 (Time):** **Critical.** If you wait 12 hours for the better model, you have 48 hours total minus 12 = 36 hours remaining. Evac needs 30. You have 6 hours buffer.
      *   *Wait, re-read your prompt:* "Evacuation needs 30 [hours]." Forecast lands in 12. Total time is 3 days (72 hours). 72 - 12 = 60 hours remaining. 60 > 30. So you *can* wait?
      *   *Correction based on your "knot":* You said "waiting eats the lead time." Let's assume the window is tighter. Say you have 36 hours total. Wait 12 = 24 left. Evac needs 30.
      *   **Protocol Rule:** If Waiting (12) + Evac (30) > Total Time (36), you **Cannot Wait.**
  *   **Decision:** You are forced to decide on current data.
      *   If current data is ambiguous (e.g., "Possible overtopping"), you cannot Assert Knowledge of Safety.
      *   Because you cannot wait for certainty, and you cannot claim safety, you must **Path B (Precaution).**
  *   **Why:** This handles the "stakes cut both ways" knot. The stake of *being wrong about safety* (death) outweighs the stake of *being wrong about evacuation* (cost). If waiting for certainty makes safety impossible, you must abandon the quest for certainty and act on precaution.
  *   **Audit Box:** Time Constraint: YES. Waiting for better data would render evacuation impossible. Decision based on current incomplete data.

  ### Final Note for the Duty Officer
  When you write the rationale, do not write "I think." Write "The data does not support a guarantee of safety."

  Your friend the hydrologist was right that the bar moves. But in your chair, the bar only moves in one direction: **Up.** It goes up when lives are at risk, when specific errors are live, and when time is short. It never goes down to save you from a lawsuit or a bad headline. If the protocol tells you to evacuate and the water stays dry, you look cautious. If the protocol tells you it's safe and the water rises, you are liable.

  Use the Audit Box. It is your shield. It tells the future reader: *"I knew what I didn't know, and I acted accordingly."* That is all the law and the auditor can ask of you.
