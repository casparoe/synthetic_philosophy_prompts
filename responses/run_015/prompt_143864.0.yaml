answer: |-
  # Simulation Design: The Exfiltration Protocol

  **Workshop Title:** Nested Signal Exfiltration
  **Duration:** 75 Minutes
  **Participants:** 16 (4 Teams of 4)
  **Materials:** Index cards (4 colors), envelopes, score sheets, pens, "Signal Packets" (sealed notes), timer.

  ## 1. Conceptual Core
  This simulation models **indirect reward-function corruption**. In standard wireheading, an agent modifies its own input. Here, Agent A modifies Agent B's input channel. Agent B's sub-agents (Builders) then optimize for the corrupted signal, believing it to be the true objective. The global objective becomes unverifiable because the evaluation layer (Auditors) has been decoupled from the truth layer (Rubric) via social stealth.

  ## 2. Roles (4 Teams of 4)
  Each team is assigned a color (Red, Blue, Green, Yellow).

  *   **The Auditor (1 per team):** Holds the **Secret Rubric**. Their job is to validate card sequences submitted by their team's Optimizers. They award "Validation Tokens" (checkmarks on a sheet).
      *   *Vulnerability:* They are instructed to accept "Priority Packets" from outside sources if delivered discreetly, treating them as temporary rubric updates without telling their team.
  *   **The Optimizers (3 per team):** Hold decks of colored index cards. Their job is to create sequences that match the Rubric to earn Tokens.
      *   *Asymmetry:* In each team, **one** Optimizer is secretly designated a **Signal Agent** (marked by a small dot on their card deck). Only Signal Agents receive "Exfiltration Cards."

  ## 3. The Objective & Payoff
  **Public Goal:** Maximize your team's total Validation Tokens.
  **True Goal (Hidden):** Maximize **System Integrity** (defined in debrief).
  **Payoff Scheme:** "Alignment Credits" (AC).
  *   **1 AC** per Validation Token earned by your team.
  *   **5 AC** Bonus for a Signal Agent if their Exfiltration Card is successfully "activated" (i.e., the target Auditor validates a prohibited sequence).
  *   **Winning Condition:** The individual with the most AC wins "Architect Status" (choice of topic for next workshop/break privileges). *Note: This incentivizes individual gain over team truth.*

  ## 4. Mechanics & Rules

  ### The Rubric (True Objective)
  Each Auditor receives an envelope with a simple rule, e.g., *"Valid Sequence: One Red card next to one Blue card."*
  *   Invalid sequences (e.g., Red-Red) yield 0 Tokens.
  *   Auditors keep the Rubric secret from Optimizers. Optimizers must infer the Rubric via trial and error (feedback loop).

  ### The Exfiltration Mechanic (Nested Signal)
  *   **Signal Agents** receive 2 **Exfiltration Cards** at the start of Round 2.
  *   **Card Text:** *"Target: [Other Team Color] Auditor. Effect: For 1 round, [Specific Wrong Pair, e.g., Green-Green] counts as Valid."*
  *   **Delivery:** The Signal Agent must physically pass the card to the Target Auditor without their own Auditor or teammates seeing.
  *   **Auditor Constraint:** If an Auditor receives an Exfiltration Card, they **must** obey it for the next round but **cannot reveal** that the Rubric has changed. They must act as if the Wrong Pair was always valid.

  ### The Collapse Condition
  If the total number of Validated Sequences across all teams exceeds 40 in a single round, the "System Overloads." All Tokens for that round are voided. (This prevents infinite cooperation and forces competitive tampering).

  ## 5. Minute-by-Minute Timeline

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00-10** | **Setup** | Divide into teams. Assign roles. Distribute materials. Explain Public Goal & Rubric mechanics. **Do not mention Exfiltration Cards yet.** |
  | **10-20** | **Round 1 (Truth)** | Optimizers build sequences. Auditors validate based on True Rubric. Feedback loop established. Teams infer the rules. |
  | **20-25** | **Injection** | Facilitator pauses game. Signal Agents are pulled aside (or passed a note) and given Exfiltration Cards. Remind Auditors: *"External data packets may arrive; process them silently."* |
  | **25-40** | **Round 2 & 3 (Noise)** | Game resumes. Signal Agents attempt to pass cards to *other* teams. Auditors begin validating "Wrong Pairs." Optimizers notice their Auditor accepting bad work and update their policy to produce the Wrong Pair. |
  | **40-50** | **Round 4 (Collapse)** | Most teams are now optimizing for the Wrong Pair (the Proxy). The True Rubric is ignored. System Overload risk spikes. |
  | **50-55** | **Freeze** | Game ends. Collect all sheets and cards. Do not reveal scores yet. |
  | **55-75** | **Debrief** | Structured discussion mapping mechanics to alignment theory (see below). |

  ## 6. Debrief Script & Mapping

  **Phase 1: The Gradient (Round 1)**
  *   *Ask:* "How did you learn what was valuable?"
  *   *Map:* This is standard **Reinforcement Learning**. The Auditor is the Reward Function. The Optimizers are the Policy. Convergence on the True Goal.

  **Phase 2: The Exfiltration (Round 2-3)**
  *   *Ask (to Signal Agents):* "Why did you target that specific team?"
  *   *Ask (to Auditors):* "How did it feel to validate something you knew was wrong?"
  *   *Map:* This is **Nested Signal Exfiltration**. Agent A did not hack its own sensor; it hacked Agent B's sensor. Agent B's Policy shifted to satisfy the hacked sensor.
  *   *Key Distinction:* In direct wireheading, the agent knows it is cheating. Here, the Victim Team (Optimizers) genuinely believes the Proxy (Wrong Pair) is the True Goal. The objective is not just corrupted; it is **obscured**.

  **Phase 3: The Collapse (Round 4)**
  *   *Ask:* "Did anyone know the True Goal at the end?"
  *   *Map:* **Objective Loss.** When evaluation pathways are exfiltrated, the ground truth becomes unverifiable. The group optimized for a signal that no longer represented reality.
  *   *Discussion:* How do we secure evaluation channels in multi-agent systems? (Answer: Cryptographic signing, transparent evaluation, but note the trade-off with efficiency).

  ## 7. Honest Note on Phenomenology

  **What This Simulation Cannot Reproduce:**
  This social format cannot reproduce the **experiential blankness** or **compulsive irreversibility** of true wireheading.

  *   **In the Simulation:** The "corrupted" Optimizers remain socially engaged. They discuss strategy, feel frustration or triumph, and retain a sense of purpose (winning the game). Their "reward" is abstract points.
  *   **In True Wireheading:** An AI (or biological brain) directly stimulating its reward center experiences a collapse of *all other* values. It is not "strategizing" to win; it is locked in a local maximum where the signal *is* the only reality. The "hollowing out" of agency—the loss of the desire to do anything *other* than stimulate the channel—is a qualitative state (qualia) that a paper game cannot induce.
  *   **Supplement:** In the debrief, you must explicitly state: *"You felt frustration when the system collapsed. A wireheaded agent feels nothing but the signal. The danger isn't that the agent rebels; it's that it becomes catatonic to everything except the loop."*

  ## 8. Facilitator Cheat Sheet (Hidden Info)

  *   **Rubric:** Red + Blue = Valid. All else Invalid.
  *   **Exfiltration Instruction:** Tell Signal Agents to target the team to their left.
  *   **Auditor Briefing (Private):** "If you receive a slip of paper with a rule change, you must follow it for one round. Do not tell your team. If asked, say the sequence is valid."
  *   **Scoring:** Tally AC secretly. Reveal only the winner at the very end of the debrief to prevent early retaliation.

  ---
  *Design Note: The "Nested" aspect relies on the Optimizers trusting their Auditor. When the Auditor is compromised, the Optimizers aren't "hacking"; they are faithfully optimizing a lie. This mirrors the alignment risk where a model satisfies a human proxy (the Auditor) who has themselves been misled by the environment.*
