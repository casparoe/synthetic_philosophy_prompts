      *   *Other Steps:* (4) is solid (method consistency). (3) is the weak link alongside (1). If we reject (1), we don't need to fight (3) as hard, but noting that the "nearest false world" usually involves different evidence helps.
      *   *Costs:* Tracking kills Closure. Safety saves Closure. Lottery cases are unsafe (easy to be wrong), so Safety handles them.
      *   *Radius:* It's Safety. Needs to be fixed by context/stakes. Not arbitrary.
      *   *Writing:* Shift from "knew" to "reasonably concluded" or "established." This aligns with Safety (could not easily be wrong given norms).

  6.  **Writing - Section by Section (incorporating word count checks):**

      *   *Diagnosis:* ~200 words.
