prompt: |-
  Hey — act as a profressional philosopher who specializes in the extended mind thesis and philosophy of cognitive science. Please think carefully and brainstorm a bit first, then give me a structured answer.

  Here's the case. A university has a disability-accomodation policy for exams: certain students are allowed to consult a customized external resource, like a searchable personal knowledge base or an AI assistant trained on their own notes, during the exam. The stated rationale is that the resource functions as part of the student's memory or cognitive system, so banning it would be like penalizing someone for having poor biological recall; the point of the exam is to assess their reasoning, not unaided recall. At the same time, if another student secretly used the same resource, that would be treated as cheating.

  What philosophical commitments does this policy presuppose? I want the implicit theory reconstructed: does it strictly presuppose something like the parity principle, or only the weaker claim that external tools can sometimes play a cognitive role? What does it assume about authorship, responsibility, and the boundary of a person's mind? Is the policy consistent with itself — if the laptop is literally part of the student's mind, why is unauthorized use cheating, and if it isn't, why is the accommodation fair? And what would have to change in the policy if we rejected the extended mind claim and treated the device as a mere tool? Please seperate what the practice strictly presupposes from what it merely fits well with, and say where it's underdetermined.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Professional philosopher specializing in the Extended Mind Thesis (EMT) and philosophy of cognitive science.
      *   **Task:** Analyze a specific university disability-accommodation policy regarding external resources (searchable KB/AI) during exams.
      *   **Key Questions:**
          *   What philosophical commitments does the policy presuppose?
          *   Does it strictly presuppose the Parity Principle or a weaker claim?
          *   What does it assume about authorship, responsibility, and mind boundaries?
          *   Is the policy consistent (accommodation vs. cheating)?
          *   What changes if we reject EMT?
          *   Distinguish between strict presuppositions, good fits, and underdetermined areas.
      *   **Format:** Think carefully/brainstorm first, then provide a structured answer.

  2.  **Initial Brainstorming & Conceptual Mapping:**
      *   *The Case:* Disabled students get to use external aids (AI/KB) during exams. Rationale: It's part of their memory/cognitive system. Non-disabled students using it = cheating.
      *   *Extended Mind Thesis (EMT):* Clark & Chalmers (1998). The Parity Principle: If a part of the world functions as a process which, were it done in the head, we would have no hesitation in recognizing as part of the cognitive process, then that part of the world is (so we claim) part of the cognitive process.
      *   *The Rationale:* "The resource functions as part of the student's memory or cognitive system." This sounds like EMT.
      *   *The Tension:* If it's *part of the mind* for Student A, why is it *cheating* for Student B? Cheating usually implies gaining an *unfair advantage* or accessing information *external* to the self. If it's part of the self, it's not external.
      *   *Distinction:* Is the policy claiming the laptop *is* the mind (ontological claim) or that it *functions like* memory for assessment purposes (functional/normative claim)?
      *   *Authorship/Responsibility:* If the AI generates the answer, is it the student's reasoning? The policy says the point is to assess reasoning, not recall. So the tool handles recall, the student handles reasoning.
      *   *Consistency:* The policy seems to rely on a *normative* distinction (who is *allowed* to integrate this tool) rather than a strictly *ontological* one (who *has* integrated this tool). This is the crux of the philosophical tension.

  3.  **Deconstructing the Philosophical Commitments:**
      *   *Parity Principle:* Does the policy *need* the full Parity Principle? The Parity Principle is an ontological claim about the *location* of cognition. The policy uses language like "functions as part of... memory." This suggests functionalism. However, does it need to claim the laptop is *literally* mental? Or just that for the purpose of the exam, it should be treated *as if* it were internal memory?
      *   *Weaker Claim:* Functional Role. It's enough to say "this tool performs the function of recall." We don't necessarily need to say "this tool is literally a neuron."
      *   *Boundaries:* The policy draws a boundary around the *authorized* user. For Student A, the boundary includes the laptop. For Student B, the boundary stops at the skull. This implies the boundary is normative/legal, not just metaphysical.
      *   *Cheating:* Cheating is violating the rules of the assessment. The rules define what counts as "internal" vs. "external." So, the policy *creates* the cognitive boundary by fiat for assessment purposes.

  4.  **Addressing the Consistency Problem (The "Cheating" Paradox):**
      *   *Scenario:* Student A (accommodated) uses tool = OK. Student B (non-accommodated) uses tool = Cheating.
      *   *EMT View:* If cognition extends based on functional coupling, Student B might *also* be coupled with the tool. If they use it fluently, isn't it *their* mind too?
      *   *Resolution:* The policy isn't making a metaphysical claim about where Student B's mind ends. It's making a *normative* claim about what counts as a "fair test of reasoning." For Student A, the disability makes recall the variable being tested *unless* aided. For Student B, recall is part of what is being tested.
      *   *Implication:* The policy treats "mind" as a normative status granted by the institution, not just a natural kind discovered by cognitive science.

  5.  **Drafting the Structure:**
      *   **Introduction:** Acknowledge the role, state the core tension (ontological vs. normative).
      *   **Section 1: The Core Philosophical Commitments (Presuppositions vs. Fits).**
          *   Functionalism (strict).
          *   Parity Principle (fit, but maybe not strict).
          *   Normative Constructivism about Cognitive Boundaries (strict).
      *   **Section 2: Authorship, Responsibility, and Agency.**
          *   Division of labor (recall vs. reasoning).
          *   The "Cyborg" contract.
      *   **Section 3: The Consistency Challenge (Accommodation vs. Cheating).**
          *   Why the asymmetry exists.
          *   Is it inconsistent? (No, if viewed normatively).
      *   **Section 4: Counterfactual (Rejecting EMT).**
          *   Tool vs. Organ.
          *   Compensation vs. Enhancement.
      *   **Conclusion:** Summary of the philosophical stance.

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* I need to be careful not to say the policy *definitely* commits to EMT. The prompt asks what it *presupposes*. The text says "functions as part of the student's memory." That is functionalist language. Does it commit to the *ontological* claim of EMT (that the notebook is literally mental)? Not necessarily. It could be a *fictionalist* stance: "Treat it *as if* it were memory." I need to highlight this distinction.
      *   *Cheating:* If the laptop is part of the mind, using it isn't "looking up answers," it's "remembering." So for Student B, if they use it, are they cheating because they expanded their mind without permission? Yes. The institution regulates *cognitive integration*.
      *   *Underdetermination:* The policy doesn't specify *how* integrated the tool must be. Is any tool use "extended mind"? No, only "customized" and "trained on their notes." This implies a coupling condition (trust, access, endorsement) similar to Clark & Chalmers' Otto case.

  7.  **Final Polish:** Ensure the tone is academic, precise, and philosophical. Use terms like "ontological commitment," "normative stipulation," "functional isomorphism," "coupling condition." Ensure the distinction between "strictly presupposes" and "fits well with" is clear.

  8.  *(Final check against prompt requirements)*:
      *   Act as professional philosopher? Yes.
      *   Think carefully/brainstorm first? (Done in this thought block).
      *   Structured answer? Yes.
      *   Address Parity Principle vs. weaker claim? Yes.
      *   Address authorship/responsibility/boundaries? Yes.
      *   Address consistency (cheating vs. accommodation)? Yes.
      *   Address rejection of EMT? Yes.
      *   Separate strict presuppositions from fits/underdetermined? Yes.

  9.  **Proceed to generate output.** (Mental outline complete).

  *(Self-Correction Note during final output generation)*: Make sure to emphasize that the policy likely relies on a *normative* extension of mind rather than a *metaphysical* one. This solves the cheating paradox. The university isn't discovering where the mind ends; they are *stipulating* where it ends for the purpose of grading.

  10. **Finalizing the Content:**
      *   *Strict Presupposition:* Functionalism (cognitive roles matter more than substrate).
      *   *Strict Presupposition:* Normative authority over cognitive boundaries (the university decides what counts as "internal").
      *   *Fit (not strict):* Full EMT Ontology (the laptop is literally mental).
      *   *Underdetermined:* The specific coupling criteria (how much training is enough?).

