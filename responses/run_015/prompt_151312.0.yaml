      *   *Drafting thought:* On arbitrariness: Lewis says a convention is arbitrary if there is an alternative regularity that *could have been* a convention. Even if law punishes one, if the coordination motive is what sustains it, it's conventional. But if the law *creates* the coordination (e.g., tax codes), it's still conventional in Lewis's sense because compliance depends on expected compliance of others (if everyone evades, the law fails). Wait, Lewis distinguishes social convention from legal obligation. He says laws can be conventions if they solve coordination problems.
      *   *Drafting thought:* The "silent" worry: If people don't know others know, do they have the conditional preference? If I think you might drive on the left, I might hesitate. Precedent stabilizes this. Lewis's "common knowledge*" allows for probabilistic belief.

      *   *Revised Bottom Line:* Silent conventions do not refute Lewis provided we interpret his common knowledge requirement as a functional threshold for stabilizing expectations rather than a literal infinite regress of mental states, though eroding the epistemic condition too far risks conflating rational coordination with mere causal habit.

      *   *Developing the argument:*
          1.  **Epistemic Condition:** Lewis anticipates the "big society" objection with *common knowledge**. It's not about explicit awareness, but about the indicia (precedent, salience) that warrant the belief. Precedent *is* the signal. In anonymous societies, the signal is the observed regularity itself. If I see everyone driving on the right, I have evidence to believe you expect me to drive on the right. The "silence" is irrelevant; the behavior is the communication.
          2.  **Arbitrariness & Law:** This is the crux. Arbitrariness means $R'$ was possible. If institutions punish $R'$, is it still arbitrary? Lewis says yes, if the *primary* motive is coordination. If the penalty is negligible compared to the crash cost, it's convention. If the penalty is the only reason, it's coercion. The danger is when institutional design makes $R'$ impossible (physically or cost-prohibitive). Then it ceases to be a convention and becomes a constraint.
          3.  **Regularity vs. Convention:** The distinction lies in the *conditional preference*. In mere regularity (e.g., everyone wears coats in winter), I wear a coat regardless of you. In convention, I wear a suit *because* you wear a suit. Weakening the epistemic condition shouldn't touch the conditional preference condition. That's the safeguard.

