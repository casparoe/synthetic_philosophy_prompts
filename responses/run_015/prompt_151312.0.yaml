  2.  **Deconstruct Lewis's Account (Mental Sandbox):**
      *   *Definition:* A convention is a regularity $R$ in population $P$ in recurrent situation $S$ such that:
          1.  Everyone conforms to $R$.
          2.  Everyone expects everyone else to conform to $R$.
          3.  Everyone prefers to conform to $R$ on condition that others do (coordination problem).
          4.  There is at least one alternative regularity $R'$ that could have solved the coordination problem instead (Arbitrariness).
          5.  These facts (1-4) are *common knowledge* (or common belief) in $P$.
      *   *The Knot:* In large societies, do we really have common knowledge? Or just overlapping expectations? Lewis anticipates this with "common knowledge*" (approximate). But the prompt asks about "silent conventions" where people follow precedent without the high-order beliefs.
      *   *Arbitrariness:* If institutional design removes alternatives (e.g., traffic laws enforced strictly), is it still a convention? Lewis distinguishes convention from coercion/law. If the alternative is punished, is it still arbitrary?
      *   *The "Silent" Aspect:* If I drive on the right because I always have, and I expect you to because you always have, but I don't know that you know that I know... does it count? Lewis requires the iterative expectations to ground the *reason* for action. If the reason is just "habit" or "precedent" without the expectation of others' expectations, it risks becoming mere regularity.

  3.  **Brainstorming the Argument:**
      *   *Bottom Line:* Silent conventions don't break Lewis if we treat common knowledge as a limiting ideal rather than a psychological literalism, but weakening the epistemic condition too much risks dissolving the normative force that distinguishes convention from habit.
      *   *Epistemic Condition:* Lewis uses "common knowledge*" to handle finite minds. We don't need infinite iterations, just enough to ground the expectation. In anonymous societies, salience and precedent act as the generator of these expectations. The "silence" isn't a lack of knowledge, it's a lack of *discussion*. Precedent *creates* the common knowledge implicitly.
      *   *Arbitrariness vs. Law:* This is the trickier part. Lewis says conventions are arbitrary because there's an alternative solution to the coordination problem. If the state enforces one side (law), does it cease to be a convention? Lewis argues law often *codifies* convention. But if the law removes the alternative (prison for driving on the left), is it still arbitrary? Yes, because the *reason* for conformity is still coordination, not just fear of punishment. If I only drive on the right because of cops, it's compliance. If I drive on the right because I expect you to, and the law just focalizes that, it's convention.
      *   *The Collapse:* If we weaken epistemic conditions too much, any regularity becomes a convention. If I drink coffee every morning, that's a regularity. It's not a convention because there's no coordination problem. The key is the *conditional preference*.
      *   *Refining the Bottom Line:* The tension isn't fatal because Lewis's "common knowledge" is functional, not introspective, but stripping away the epistemic layer entirely collapses convention into causal regularity, while institutional coercion doesn't kill arbitrariness so long as the coordination motive remains primary.

