      *   **Task:** Explain a conceptual knot regarding Lewis's account of convention (common knowledge + arbitrariness) vs. real-world anonymous societies (norms evolve via precedent without explicit common knowledge).
      *   **Focus:** Do "silent conventions" break Lewis's account? Can we weaken the epistemic condition without collapsing convention into mere regularity? What happens to arbitrariness when institutional design removes alternatives (convention vs. law)?
