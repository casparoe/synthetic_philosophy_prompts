answer: |-
  Silent conventions do not refute Lewis's account so long as we treat his common knowledge requirement as a functional threshold for stabilizing expectations rather than a literal infinite regress of mental states, though eroding the epistemic condition too far risks conflating rational coordination with mere causal habit.

  Lewis anticipates the "big society" objection by distinguishing common knowledge from common knowledge*, allowing for probabilistic beliefs grounded in salient indicia rather than explicit communication. In anonymous societies, precedent functions as that salience; the regularity itself provides the evidence required to form higher-order expectations without verbal agreement. When I drive on the right, I don't need to know that you know that I know; I only need sufficient reason to believe you expect me to conform, and the observed history of traffic provides that warrant. If we strip away the epistemic condition entirely, however, we lose the mechanism that explains *why* the regularity persists: without the belief that others expect conformity, my preference to conform becomes unintelligible in a coordination problem. The distinction between convention and mere regularity hinges on the conditional preference clause—I conform *because* I expect you to—not just the behavioral output. If I wear a coat because it's cold, that's a regularity; if I wear a suit because you wear a suit, that's a convention. Weakening the epistemic requirement is permissible only if the conditional preference remains the primary motive for action.

  The arbitrariness condition faces a sharper threat from institutional design than from epistemic silence. Lewis defines arbitrariness by the existence of an alternative regularity $R'$ that could have solved the coordination problem instead. When law or institutional design merely penalizes $R'$, convention persists because the coordination motive remains primary; I stop at a red light not solely due to the fine, but because I expect cross-traffic to expect me to stop. However, if institutional design physically removes the alternative—such as a median barrier preventing left turns—arbitrariness collapses. In that case, the regularity is no longer a solution to a coordination problem but a physical constraint, and the convention dissolves into mere causality. The danger lies in conflating the *codification* of convention with the *creation* of law; Lewis argues laws often sustain conventions by focalizing expectations, but if the law eliminates the alternative equilibrium entirely, the arbitrariness condition fails. We can weaken the epistemic condition to accommodate "silent" evolution via precedent, but we cannot weaken the arbitrariness condition without losing the ability to distinguish convention from coercion or physical necessity.
