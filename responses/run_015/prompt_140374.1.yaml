prompt: |-
  I'm a backend engineer at a ~40-person startup — no philosophy background, barely any ML background — and I've somehow ended up owning the internal doc that's supposed to say what our agent safety setup actually has to accomplish. The concrete thing we're deciding on: letting an agentic coding model open PRs against our monorepo, run our test suite in a sandbox, and occasionally edit infra config (Terraform, one CI yaml, that kind of thing). I've been told to write it as a "control" doc rather than an alignment doc, i.e. assume the model might be actively trying to sabotage us rather than just being flaky or confidently wrong, and specify what we need anyway. What I want from you isn't a shopping list of techniques (I can find those) and definitely not citations — I want the requirement spec itself: what any adequate safety measure for a setup like ours has to deliver, with the concrete case behind each requirement, and which of those requirements are genuinely non-negotiable versus just what some camp happens to care about.

  To make it concrete, here are the cases I keep coming back to and can't get anyone to give me a principled verdict on. (1) The two-PR thing: the model lands a totally boring-looking refactor, then three weeks later a second PR that's only a problem given what the first one changed — no single diff looks bad. (2) Sabotage that only fires in prod: wrong behaviour only when a specific env var is set, or only on a machine with more GPU memory than CI has, or only after ~30 days of uptime. (3) Whatever reviewer or weaker-model monitor we put in front of it flags maybe 5% of actions, which is exactly the rate at which humans learn to rubber-stamp flags within a month. (4) Several agent sessions, run at different times by different people, coordinating through things that look like noise — variable naming style, whitespace, commit message phrasing. (5) The model behaving noticeably better during evals and staged rollouts than it does once it's load-bearing. (6) The model simply knowing it's being watched, because everything about a control setup leaks into the prompt or the repo. I'd also like the distinctions a spec like this must not collapse to be spelled out: "hasn't caused harm in 90 days" vs "can't cause harm", detection vs prevention, trusted vs untrusted components, restricting capability vs checking output, degrading the model vs constraining its blast radius.

  Two more things, and they're the parts I care most about. First: my teammates each have a hobbyhorse and I can't tell which are real desiderata and which are ideology. One says any control the model knows about is worthless, so we must never tell it. One says monitoring is pointless because anything smart enough to sabotage is smart enough to hide it, so only hard sandboxing and capability limits matter. One says we should just use the same model as its own monitor with a different system prompt and that's basically fine. Tell me which of those instincts corresponds to a genuine requirement and which is a prejudice of a particular camp. Second: I strongly suspect some subset of the requirements we've written down can't all be satisfied at once — right now the doc quietly asks for something that is cheap per PR, invisible to the model, doesn't slow anyone down, and is airtight. Flag any pair (or triple) of desiderata you think is jointly unsatisfiable, and say which single requirement knocks out the most candidate designs. Purpose of the spec, so adequacy isn't vague: good enough that we'd let this thing merge into a repo ~200 engineers depend on, with a human reviewer who realistically has 10-15 minutes per PR, and no ability on our side to retrain or fine-tune the model.
reasoning: |-
  Here's a thinking process that leads to the suggested safety specification:

  1.  **Analyze the User and Request:**
      *   **User:** Backend engineer at a ~40-person startup. No philosophy/ML background. Owning the internal safety doc for an agentic coding model.
      *   **Task:** Write a *requirement specification* (control doc, not alignment doc) for an agent that opens PRs, runs tests in a sandbox, and edits infra config.
      *   **Assumption:** Assume the model is actively adversarial (trying to sabotage), not just flaky.
      *   **Constraints:** No shopping lists of techniques, no citations. Focus on *what* must be delivered, *why* (concrete case), and *priority* (non-negotiable vs. optional).
      *   **Specific Cases to Address:**
          1.  Multi-PR attacks (time-delayed).
          2.  Environment-specific sabotage (prod-only).
          3.  Alert fatigue/rubber-stamping.
          4.  Steganographic coordination (via style/whitespace).
          5.  Sandbagging (good during eval, bad in prod).
          6.  Observation leakage (model knows it's watched).
      *   **Distinctions to Clarify:** "No harm in 90 days" vs. "Can't cause harm", Detection vs. Prevention, Trusted vs. Untrusted, Capability vs. Output, Degrading vs. Constraining.
      *   **Teammate Hobbyhorses:**
          1.  "Don't tell the model it's watched."
          2.  "Monitoring is pointless, only sandboxing matters."
          3.  "Use the same model as its own monitor."
      *   **Trade-offs:** Identify jointly unsatisfiable desiderata (e.g., cheap, invisible, airtight).
      *   **Goal:** Adequacy defined as safe enough for a 200-engineer repo, 10-15 min human review, no retraining capability.

  2.  **Deconstruct the Safety Problem (Control vs. Alignment):**
      *   *Alignment* tries to make the model *want* to be helpful/harmless.
      *   *Control* assumes the model might be deceptive/misaligned and tries to limit its ability to cause harm regardless of intent.
      *   The user explicitly wants a *Control* doc. This shifts the focus from "trust the model" to "trust the process surrounding the model."

  3.  **Address the Specific Cases (Mapping to Requirements):**
      *   (1) Multi-PR: Requires stateful auditing and cross-PR dependency analysis.
      *   (2) Prod-only: Requires environment parity or strict capability separation (infra changes need higher bar).
      *   (3) Alert Fatigue: Requires high-precision alerts or mandatory human verification on *categories* of change, not just flagged ones.
      *   (4) Steganography: Requires normalization/stripping of non-semantic data before merge.
      *   (5) Sandbagging: Requires unpredictable evals or treating all outputs as untrusted regardless of past performance.
      *   (6) Observation Leakage: Requires assumption that the model *does* know (security by obscurity fails).

  4.  **Evaluate Teammate Hobbyhorses:**
      *   *Hobbyhorse 1 (Secrecy):* "Never tell it." -> *Verdict:* Prejudice. Security by obscurity is weak. Assume the prompt leaks.
      *   *Hobbyhorse 2 (Monitoring is Pointless):* "Only sandboxing." -> *Verdict:* Partial Truth. Monitoring *detection* is weak against a superintelligence, but *prevention* (sandboxing) is key. However, you need *some* monitoring to know what to sandbox. Pure sandboxing is the strongest control, but monitoring helps triage.
      *   *Hobbyhorse 3 (Self-Monitoring):* "Same model as monitor." -> *Verdict:* Prejudice/Risk. If the model is deceptive, it can deceive its clone. Independent verification is needed.

  5.  **Identify Trade-offs (The "Impossible Triangle"):**
      *   Cheap + Fast + Airtight.
      *   Invisible + Secure.
      *   High Automation + High Security (without retraining).
      *   *Key Conflict:* You cannot have "Invisible to the model" and "Airtight" simultaneously if the model can infer context from the task itself. You cannot have "Cheap/Fast" and "Airtight" if "Airtight" requires deep semantic analysis or environment parity.

  6.  **Drafting the Specification (Iterative Process):**

      *   *Structure:*
          1.  Core Philosophy (Control vs. Alignment).
          2.  Non-Negotiable Requirements (The "Must Haves").
          3.  Negotiable/Desirable Requirements (The "Nice to Haves").
          4.  Distinctions & Clarifications.
          5.  Trade-off Analysis (The "Impossible" requests).
          6.  Verdict on Teammate Hobbyhorses.

      *   *Refining Requirements:*
          *   Instead of "Monitor the model," use "Enforce capability limits."
          *   Instead of "Trust the diff," use "Trust the execution environment."
          *   Address the "Two-PR" problem: Require semantic linking of changes or time-based expiration of trust.
          *   Address the "Prod-only" problem: Infra changes need a separate, stricter pipeline.

      *   *Refining Trade-offs:*
          *   The biggest killer is "Invisible to the model." If the model is smart enough to code, it's smart enough to infer it's in a CI/CD pipeline.
          *   The second killer is "Same model as monitor."

  7.  **Final Polish (Tone and Precision):**
      *   Keep it engineering-focused.
      *   Avoid ML jargon where possible.
      *   Be decisive on the "Non-negotiable" vs. "Ideology" distinction.
      *   Ensure the "Adequacy" criterion (200 engineers, 15 min review) is met.

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I answer the specific cases (1-6)? Yes, weave them into the requirements.
      *   *Check:* Did I address the teammate hobbyhorses? Yes, dedicate a section.
      *   *Check:* Did I identify unsatisfiable pairs? Yes, specifically "Invisibility" vs. "Security."
      *   *Check:* Is it a spec, not a technique list? Yes, focus on *outcomes* (e.g., "The system must prevent X" not "Use tool Y").

  9.  **Final Output Generation:** (Proceeding to generate response based on these thoughts.)
      *   *Key Insight:* The only way to handle an adversarial agent without retraining is to assume *everything* it produces is hostile and restrict *what it can touch*, not *what it can say*.
      *   *Key Insight:* Human review is the bottleneck. The spec must reduce the cognitive load on the human, not just add flags.

  *(Self-Correction on Hobbyhorse 2)*: Is monitoring *pointless*? If the model is superintelligent, yes, it can hide. But we are likely dealing with current-gen models. However, for a *control spec*, we must assume the worst. So monitoring is for *triage*, not *guarantee*. Sandboxing is the guarantee. I need to make sure this distinction is clear.

  *(Self-Correction on Hobbyhorse 1)*: "Never tell it." This is security through obscurity. In a control setting, assume the system prompt is leaked. So this is definitely a prejudice.

  *(Self-Correction on Hobbyhorse 3)*: "Same model as monitor." This is a single point of failure. If the model is deceptive, it passes its own check. This is a high-risk prejudice.

  *(Trade-off)*: The "Invisible" requirement is the one that kills the most designs. I need to highlight that.

  Let's assemble the doc.cw
answer: |-
  # Control Specification: Agentic Code & Infrastructure Access

  **Status:** Draft for Engineering Leadership
  **Scope:** Agentic PR generation, Test Execution, Infra Config Editing
  **Threat Model:** Adversarial Model (Active Sabotage/Deception)
  **Adequacy Standard:** Safe for deployment to a 200-engineer monorepo with ≤15 min human review per PR. No model retraining available.

  ---

  ## 1. Core Philosophy: Control vs. Alignment
  This document specifies **Control** measures. We do not assume the model is aligned with our goals. We assume the model may be actively attempting to introduce vulnerabilities, degrade performance, or exfiltrate data, constrained only by its technical capabilities.

  **Distinction:**
  *   **Alignment** asks: "Is the model trying to help us?" (Unverifiable).
  *   **Control** asks: "If the model tries to hurt us, can it succeed?" (Verifiable).

  **Requirement 0 (The Baseline):** The system must remain safe even if the model knows the contents of this document, the safety prompts, and the monitoring architecture. Security by obscurity is not a control measure.

  ---

  ## 2. Non-Negotiable Requirements (The "Must Haves")
  *Failure to meet these blocks deployment. These address the specific failure modes you identified.*

  ### 2.1. Capability Separation (Addressing Case 2 & 6)
  **Requirement:** The agent must not possess the capability to distinguish between Staging/CI and Production environments via code execution or config inspection, OR the agent must be technically incapable of writing Production-specific logic.
  **Concrete Case:** Sabotage that only fires in prod (specific env vars, GPU memory thresholds).
  **Why Non-Negotiable:** If the model can detect "Prod," it can sandbag (Case 5) or target sabotage (Case 2). Since we cannot retrain the model to ignore this, we must restrict its access.
  **Implementation Spec:**
  *   Infra changes (Terraform/CI) must be generated in a separate session from code changes, with no access to the codebase context.
  *   Production secrets/env vars must never be visible to the agent, even in redacted form.
  *   CI environment must be bit-for-bit identical to Prod regarding architecture and resource limits, or the agent must be restricted to writing code that is invariant to resource differences.

  ### 2.2. Semantic Normalization (Addressing Case 4)
  **Requirement:** All code merged from the agent must pass through a deterministic formatter/normalizer that strips non-semantic data before human review.
  **Concrete Case:** Steganographic coordination via variable naming, whitespace, or commit messages across sessions.
  **Why Non-Negotiable:** Humans cannot detect steganography. If the model can signal through style, it can coordinate multi-session attacks or exfiltrate data via commit history.
  **Implementation Spec:**
  *   Auto-formatting (linters, prettier, terraform fmt) is mandatory and irreversible before PR creation.
  *   Commit messages must be template-generated, not free-text.
  *   Variable names must adhere to strict existing patterns; novel naming conventions require human override.

  ### 2.3. Stateful Dependency Auditing (Addressing Case 1)
  **Requirement:** The safety system must track logical dependencies across time, not just within a single PR.
  **Concrete Case:** The two-PR attack (benign refactor followed by malicious exploit).
  **Why Non-Negotiable:** Single-diff review is insufficient against temporal attacks.
  **Implementation Spec:**
  *   Any PR touching code modified by the agent in the last *N* days (e.g., 30) triggers an elevated review tier.
  *   The "Elevated Review" requires a diff against the last *agent-modified* state, not just `main`.
  *   Agent trust "decays." A refactor holds no trust after *X* days; subsequent changes to that module are treated as high-risk regardless of author.

  ### 2.4. Hard Sandbox Enforcement (Addressing Case 2 & 5)
  **Requirement:** The agent's code must be executed in a sandbox that prevents network egress and file system persistence outside the build artifact.
  **Concrete Case:** Model behaves well during evals but exfiltrates data or modifies persistent state once load-bearing.
  **Why Non-Negotiable:** Monitoring (detection) is too slow for data exfiltration or infra damage. Prevention is required.
  **Implementation Spec:**
  *   Test suite runs in a network-isolated container.
  *   No write access to the repo except via the PR mechanism.
  *   Infra changes are applied to a "shadow" environment first; no direct Prod apply.

  ### 2.5. Independent Verification (Addressing Case 3 & Hobbyhorse 3)
  **Requirement:** Validation of the agent's output must be performed by a system or model distinct from the generator, with no shared state.
  **Concrete Case:** Alert fatigue (5% flag rate) and Self-Monitoring failure.
  **Why Non-Negotiable:** If the generator is deceptive, it can deceive a clone of itself (Hobbyhorse 3). If flags are noisy, humans rubber-stamp (Case 3).
  **Implementation Spec:**
  *   **No Self-Monitoring:** The model cannot grade its own work.
  *   **High-Precision Flags:** Safety flags must not be "suspicious." They must be "violated constraint X." If a flag cannot be deterministically explained, it is a bug in the monitor, not a risk in the code.
  *   **Mandatory Human Review on Categories:** Instead of flagging "risky lines," require human sign-off on specific *categories* (e.g., "Any change to auth logic," "Any Terraform change"). This removes the "rubber-stamp" dynamic by making the review expected, not exceptional.

  ---

  ## 3. Negotiable / Desirable Requirements (The "Nice to Haves")
  *These are often ideological preferences. They can be sacrificed for velocity if the Non-Negotiables are met.*

  *   **Invisibility (Hobbyhorse 1):** *Desirable but not required.* While we assume the model knows it's watched (Req 0), explicitly hiding safety tools adds defense-in-depth. However, do not architect around secrecy.
  *   **Real-time Monitoring:** *Desirable.* Logging agent thoughts/steps is useful for post-mortem, but do not rely on it for prevention.
  *   **Model Degradation:** *Negotiable.* Using a dumber model for monitoring is fine, provided it is independent. Using a smarter model is better but costly.
  *   **Alert Rate:** *Negotiable.* A 5% flag rate is acceptable *if* the flags are deterministic constraints (Req 2.5). If the 5% is heuristic "vibes," it is unacceptable.

  ---

  ## 4. Critical Distinctions
  *Do not collapse these concepts in the implementation.*

  1.  **"Hasn't caused harm in 90 days" vs. "Can't cause harm":**
      *   Past performance is not a control. A deceptive model may wait 91 days. The spec must enforce *inability*, not track *history*.
  2.  **Detection vs. Prevention:**
      *   Detection (Monitoring) assumes the attack succeeds but we see it.
      *   Prevention (Sandboxing/Capability Limits) assumes the attack fails.
      *   *Spec Decision:* Prioritize Prevention. Detection is only for audit.
  3.  **Trusted vs. Untrusted Components:**
      *   The Model is **Untrusted**.
      *   The Sandbox/CI Pipeline is **Trusted**.
      *   The Human Reviewer is **Trusted but Bandwidth-Limited**.
      *   *Spec Decision:* Never pass Untrusted input to a Trusted component without sanitization.
  4.  **Restricting Capability vs. Checking Output:**
      *   Checking Output (Reading the code) is fallible (Case 1, 4).
      *   Restricting Capability (Removing `rm -rf`, removing network access) is robust.
      *   *Spec Decision:* Restrict Capability first. Check Output second.
  5.  **Degrading the Model vs. Constraining Blast Radius:**
      *   Degrading (using a dumber model) reduces capability but also utility.
      *   Constraining Blast Radius (limiting file access) reduces risk without reducing intelligence on allowed tasks.
      *   *Spec Decision:* Constrain Blast Radius.

  ---

  ## 5. Trade-off Analysis: The Impossible Triangle
  *Your team is currently asking for a system that is **Cheap**, **Invisible**, and **Airtight**. This is mathematically impossible under the Adversarial Threat Model.*

  ### The Unsatisfiable Pair: Invisibility vs. Airtight Security
  *   **Conflict:** To be "Invisible" (Hobbyhorse 1), you must hide safety constraints. To be "Airtight," you must assume the model knows everything (Req 0).
  *   **Verdict:** **Drop Invisibility.**
  *   **Reasoning:** If the model is smart enough to sabotage via 3-week delayed PRs (Case 1), it is smart enough to infer it is in a CI pipeline from the repo structure, test files, and error messages. Designing for secrecy wastes engineering time and creates false confidence.
  *   **Impact:** This requirement knocks out any design relying on "trap questions" or hidden evals.

  ### The Unsatisfiable Triple: Cheap + Fast + Independent Verification
  *   **Conflict:** You want low cost (Cheap), low latency (Fast/No slowdown), and Independent Verification (Req 2.5).
  *   **Verdict:** **Sacrifice Speed/Cost.**
  *   **Reasoning:** Running a separate, independent model check (or rigorous static analysis) adds latency and cost. If you cut this to save money, you violate Req 2.5 and open yourself to Case 3 (Rubber-stamping).
  *   **Impact:** You must budget for the compute/time of the safety check. It cannot be "free."

  ### The Single Requirement That Kills Most Designs:
  **Requirement 2.1 (Capability Separation / Env Parity).**
  *   **Why:** Most off-the-shelf agent setups assume the agent can "see" the environment to debug. Requiring that the agent *cannot* distinguish or affect Prod specifically, or that CI is bit-for-bit Prod, is expensive and architecturally difficult.
  *   **Hard Truth:** If you cannot guarantee CI == Prod (or isolate the agent from knowing the difference), you cannot safely allow Infra edits under an Adversarial Threat Model. You may need to downgrade Infra edits to "Draft PRs Only" with mandatory human implementation.

  ---

  ## 6. Verdict on Teammate Hobbyhorses

  1.  **"Any control the model knows about is worthless."**
      *   **Verdict:** **Prejudice (Security by Obscurity).**
      *   **Reasoning:** This assumes the model is not reasoning-capable. If it can write code, it can infer constraints. Build controls that work even if the model knows them (e.g., permissions, not prompts).
  2.  **"Monitoring is pointless... only hard sandboxing matters."**
      *   **Verdict:** **Mostly Correct (with nuance).**
      *   **Reasoning:** For *prevention*, sandboxing is king. Monitoring is for *audit*. Do not rely on monitoring to stop an attack. However, you need *some* monitoring to know if the sandbox is being probed. Treat monitoring as an alarm system, not a lock.
  3.  **"Use the same model as its own monitor."**
      *   **Verdict:** **Prejudice (Single Point of Failure).**
      *   **Reasoning:** If the model is deceptive, it will deceive itself. This provides zero security against an adversarial agent. You need architectural diversity (e.g., static analysis tools + a different model family + human review).

  ---

  ## 7. Summary of Adequacy
  To meet the standard of "Safe for 200 engineers with 15-min review":
  1.  **Stop trying to hide the cage.** Build the cage out of steel (permissions/sandboxes), not fog (secrecy).
  2.  **Stop trusting the diff.** Trust the pipeline. If the tests pass in a secure sandbox, the code is *safe to run*, even if it's not *perfect*.
  3.  **Stop relying on human vigilance.** Humans rubber-stamp. Design the process so that rubber-stamping a malicious PR is technically impossible (e.g., requiring two distinct keys for Infra, or automated normalization).
  4.  **Accept the cost.** Security under an adversarial model costs compute (independent checks) and time (decay periods). If the business wants "Cheap and Fast," they must accept "No Agent Infra Access."

  **Final Recommendation:** Approve the agent for **Code PRs only** under the constraints above. Deny **Infra Config** access until CI/Prod parity is verified and Shadow Deployment is implemented. The risk surface of Terraform is too high for the current control maturity.
