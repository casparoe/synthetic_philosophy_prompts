answer: |-
  Here is the disambiguation of the slogan "religious belief is not a hypothesis," broken down by the five distinct theses you identified, along with an evaluation of their status and their specific relevance to your argument regarding veridical near-death experiences (NDEs).

  ### 1. The Grammatical Claim
  *   **Thesis:** Religious sentences (e.g., "I shall rise after death") possess a different surface grammar than empirical sentences. They function as rules of life, expressions of attitude, or framework conditions within a specific language-game, rather than as descriptions of states of affairs.
  *   **Status:** **Defensible.** This is the most faithful reading of Wittgenstein's *Lectures on Religious Belief*. It accurately describes how religious language often functions ritually or expressively. However, it is controversial whether this applies to *all* religious assertions, particularly doctrinal claims about reality.
  *   **Relevance to NDEs:** **Supports Dismissal.** If "survival of death" is a grammatical rule for living rather than a factual claim about a future event, then empirical data (NDEs) is a category mistake. Evidence cannot confirm a rule of grammar; it can only show whether the rule is being followed.
  *   **Smuggling Risk:** Low. This is usually the explicit claim made, but it is often treated as more exhaustive than it is.

  ### 2. The Epistemic Claim
  *   **Thesis:** Religious commitments function as "hinge propositions" (à la *On Certainty*). They are the scaffolding against which evidence is weighed, meaning they are themselves immune to empirical revision or confirmation. They are certain not because of evidence, but because they make evidence possible.
  *   **Status:** **False.** While some beliefs function as hinges, this is not a permanent status. Hinges can shift and become subject to testing. To claim religious beliefs are *structurally* immune to all empirical reinforcement is an overstatement that contradicts how many believers actually integrate history and experience into their faith.
  *   **Relevance to NDEs:** **Supports Dismissal.** If religious belief is the framework *for* interpreting evidence, then evidence (like NDEs) cannot stand outside that framework to support it. You cannot use the bricks to prove the foundation exists; the foundation holds the bricks.
  *   **Smuggling Risk:** **High.** This is the thesis that does the actual work of blocking your argument, but it is rarely defended on its own merits.

  ### 3. The Psychological Claim
  *   **Thesis:** Believers do not *actually* arrive at or maintain faith through evidence-weighing. Faith is a matter of passion, commitment, or will (a Kierkegaardian reading), distinct from the psychological state of holding a scientific hypothesis.
  *   **Status:** **False.** As an empirical generalization about all religious believers, this is demonstrably false. Many believers cite historical, experiential, or philosophical evidence as reasons for their commitment. It is trivially true only for a subset of fideists.
  *   **Relevance to NDEs:** **Does Not Support Dismissal.** Even if most believers rely on commitment, this does not preclude the possibility that NDEs *could* rationally reinforce belief for those who seek evidential support, or that the belief is true regardless of psychological origin.
  *   **Smuggling Risk:** Moderate. Often used to pathologize the request for evidence ("You're missing the point of faith").

  ### 4. The Metaphilosophical Claim
  *   **Thesis:** The category "hypothesis" is a philosophical confusion when applied to religion. The philosopher's job is not to judge the truth of the belief but to dissolve the confusion that leads us to demand scientific evidence for it.
  *   **Status:** **Defensible.** As a therapeutic method, this is consistent with Wittgenstein's later philosophy. It avoids dogmatism by refusing to engage in the debate on the opponent's terms.
  *   **Relevance to NDEs:** **Supports Dismissal (by Dissolution).** It renders your argument a "philosophical illusion." It suggests the dispute itself is nonsensical because it tries to bridge two incommensurable language-games.
  *   **Smuggling Risk:** Moderate. Used to elevate the speaker above the fray, implying the interlocutor is philosophically naive.

  ### 5. The Normative Claim
  *   **Thesis:** One *ought not* treat sacred convictions as provisional conjectures. To subject them to evidential testing is to violate the integrity of the religious form of life or to commit a category error regarding doxastic autonomy.
  *   **Status:** **Defensible.** Within a fideist framework, this is coherent. It prescribes how a believer should hold their beliefs to maintain their religious character.
  *   **Relevance to NDEs:** **Supports Dismissal of Strategy, Not Relevance.** It argues you *shouldn't* use NDEs to bolster faith, not that NDEs are factually irrelevant. It protects the belief from being *dependent* on evidence, but doesn't necessarily forbid evidence from *aligning* with it.
  *   **Smuggling Risk:** High. Often presented as a descriptive fact ("It isn't a hypothesis") when it is actually a prescription ("Don't treat it as one").

  ### Diagnosis of the "Shutdown"
  When the slogan is used to **end an argument** rather than analyze one, the speaker is typically smuggling in the **Epistemic Claim** (Immunity) while pretending to rely solely on the **Grammatical Claim**.

  They argue: "Because the grammar is different (Grammatical), evidence is irrelevant (Epistemic)." This inference is not automatic. A difference in grammar does not logically entail total epistemic insulation from empirical reality. By conflating the two, they protect the Epistemic Claim from scrutiny. They are asserting that your NDE evidence *cannot count*, not merely that it *does not usually count* for believers.

  Verdict: The argumentative weight is carried by the Epistemic Claim, which asserts immunity to evidence, but it is illicitly borrowed from the authority of the Grammatical Claim.
