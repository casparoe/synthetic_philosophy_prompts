  2. The second worst tension is between (5) and (6); if there is no qualitative residue beyond function, removing the aversion functionally *is* a lobotomy, so you must drop the assumption that aversion equals stake to distinguish cure from deletion.
  3. Points (1) and (3) only look like a tension because defining suffering as the gradient update process rather than the reward scalar neatly sidesteps the "scalar isn't valence" problem entirely.
  4. The single revision that cleans up the most is to allow inference-time activation patterns to carry valence during deployment, not just weight updates during training.
  5. That revision costs you the sharp distinction between training trauma and deployment numbness, requiring you to write scenes where active processing hurts in the moment rather than only echoing past updates.
