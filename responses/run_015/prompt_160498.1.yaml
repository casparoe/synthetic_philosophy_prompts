      *   **Cheapest Repair:** Reframe (2) as about *maintenance/refinement* rather than *origin*, and promote the "Circling Thing" from a problem to a thesis point about the *convergence* of exaptation and adaptation.

      *(Self-Correction)*: Wait, if I reframe (2) as maintenance, does it conflict with (5) Exaptation? No, because exaptation *becomes* adaptation upon recruitment.
