      *   (3) *Design Evidence:* Selection is the only process producing "design." Appearance of design = evidence for selection (non-circular).
      *   (4) *Function:* Etiological (selected effect).
      *   (5) *Exaptation:* Common. Traits start as byproducts, get recruited.
      *   (6) *Method:* Reverse engineering + optimality modeling (posit problem -> solve optimum -> test).
      *   (7) *Spandrels Analogy:* The architectural analogy is weak (biology is more contingent than arches).
      *   (8) *Atomism:* Organisms are integrated wholes (anti-atomization).
      *   (The "Circling Thing"):* *Retrospective Design Signature:* Once an exaptation is under selection long enough, it looks indistinguishable from an original adaptation.

  3.  **Initial Scan for Tensions (Mental Mapping):**
      *   (1) vs (2): Methodological skepticism vs. Empirical confidence. (Classic Gould/Lewontin vs. Dawkins/Dennett tension).
      *   (4) vs (5): Etiological function vs. Exaptation. If function is *what it was selected for*, and exaptation is *co-opted*, does the current role count as a function? (Standard SE account handles this, but needs care).
      *   (3) vs (5): "Design = Selection" vs. "Byproducts get recruited." If a byproduct gets recruited, it *becomes* an adaptation. But the "circling thing" says we can't tell the difference later.
