  Welcome, Monsieur Pascal. We discuss justice and force.

  1. Q: You say we made the strong just because we couldn't make the just strong. Is this history or justification? Does it launder force into right?
  Follow-up: If you call this necessary order, is truth then merely the utility of error?

  2. Q: Custom varies truth across rivers. Yet you insist on a hidden natural justice. Why doesn't convention swallow the law?
  Follow-up: If grace reveals it, can reason ever distinguish custom from true law without grace?

  3. Q: Obedience requires believing laws are just. Is social peace built on the divertissement of false belief?
  Follow-up: If this fiction is necessary, is maintaining it an act of charity or deceit?

  4. Q: Force is bodily, justice is mental. Does charity render politics irrelevant, or transform it?
  Follow-up: If charity transcends, can a Christian magistrate wield force without sinning against charity?

  5. Q: A council seizes goods, then votes later to call it lawful. Does time legitimize force, or is ratification always ex post deceit?
  Follow-up: If time matters, at what moment does the sword become the scepter?

  6. Q: Is the wager the same trick? Acquiring by practice what argument cannot give?
  Follow-up: If yes, do we then believe justice merely because we habitually obey?

  7. Q: If established power defines justice, what evidence proves a setup is laundered force rather than right?
  Follow-up: If conscience, is not conscience itself shaped by the very customs you distrust?

  8. Q: You warn telling people laws aren't just causes revolt. Is writing this book itself a dangerous act?
  Follow-up: If for the elect, does the peace of the many outweigh the truth for the few?

  End of transcript.
