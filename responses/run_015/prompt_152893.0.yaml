          *   *Premise 1:* Nordic countries are highly egalitarian (low external coercion).
          *   *Premise 2:* Despite this, occupational segregation remains high (nursing vs. engineering).
          *   *Inference:* If culture/coercion were the main driver, equality should reduce segregation. Since it doesn't (or reverses it), intrinsic preferences (nature) must be the driver once barriers are removed.
          *   *Rebuttal to Leo:* Cross-cultural consistency (Sweden & Japan look similar) suggests a universal biological baseline, not variable cultural conditioning.
      *   **Leo's Position (Constructionist/Sociological):**
          *   *Premise 1:* Culture isn't just external force; it shapes internal preferences (socialization).
          *   *Premise 2:* In poorer/less equal countries, economic necessity overrides preferences (people take any job).
          *   *Premise 3:* In rich/equal countries, economic security allows people to act on preferences (which were culturally shaped).
          *   *Inference:* Equality reveals culturally constructed preferences, not biological ones.
          *   *Rebuttal to Maya:* Cross-cultural similarity isn't proof of biology; culture can be a "universal filter" (e.g., globalized gender norms). Also, the patterns *aren't* identical (magnitude/fields differ). Equality scaling doesn't distinguish between bio/cultural filters.

  3.  **Brainstorming & Evaluation (Philosopher/Social Scientist Lens):**
      *   *The GEP itself:* Is it robust? Recent meta-analyses suggest it's fragile or dependent on how "equality" and "segregation" are measured. (Need to keep this in mind but stick to the *logic* of their argument as requested, while acknowledging empirical uncertainty).
      *   *Maya's Logic:*
          *   *Strength:* The "release from constraint" argument is intuitive. If you remove barriers, what's left is often assumed to be "true" preference.
