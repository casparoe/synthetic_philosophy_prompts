          *   *Philosophical flaw:* False dichotomy (Nature vs. Culture). Preferences are always an interaction.
      *   *Leo's Logic:*
          *   *Strength:* Accounts for economic necessity (the "survival" argument). Acknowledges that socialization creates preferences, not just blocks them.
          *   *Weakness:* Needs to explain *why* socialization leads to similar outcomes globally if it's arbitrary. Why does "culture" push women to care and men to tech almost everywhere? (Evolutionary psychology would say biology; sociology might say universal patriarchal structures).
          *   *Philosophical strength:* Avoids the "preference as pre-social" fallacy.
      *   *Overall:* Leo's explanation is more theoretically robust because it doesn't assume preferences are exogenous to culture. However, Maya points out a real puzzle: why does *more* freedom sometimes lead to *more* segregation? Leo's answer (economic security allows acting on preferences) is the standard sociological counter, but it relies on those preferences being gendered. Why are they gendered? Leo says culture; Maya says biology. This is the stalemate.

