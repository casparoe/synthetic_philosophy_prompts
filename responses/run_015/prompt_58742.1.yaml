answer: |-
  **MEMORANDUM**

  **TO:** City Council
  **FROM:** Law Reform Advisory Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding the Regulation of Consensual Adult Sex Work

  **1. Purpose and Executive Summary**

  The City Council has requested advice regarding the future regulation of consensual sexual services between adults in private indoor settings. Specifically, the Council must decide whether to criminalize the purchase and sale of such services, retain the current licensing pilot with enhanced controls, or move to full decriminalization.

  Based on the factual record of the three-year pilot scheme, the principles of harm reduction, and the appropriate scope of municipal criminal authority, the Law Reform Advisory Committee recommends that the Council **retain the licensing regime while strengthening zoning, nuisance, and advertising controls.**

  This approach preserves the documented safety gains of the pilot, respects the police assessment regarding enforcement costs, and addresses community concerns about the moral character of the city through targeted regulation rather than blanket prohibition.

  **2. Factual Context**

  The Committee reviewed inspection reports from the three-year licensing pilot. These indicate high compliance with health and safety standards and no substantiated instances of coercion or trafficking within licensed premises. Conversely, outreach workers report that unlicensed activity remains difficult to monitor.

  Public consultation revealed sharp division. A substantial majority of respondents expressed moral disapproval of paid sex, citing concerns for the community's long-term moral cohesion. Conversely, workers, public-health officials, and a minority of residents emphasized autonomy and the safety benefits of the licensing regime. The Police Department has taken a neutral position on the morality of the act but warned that criminalization would incur significant enforcement costs and likely displace activity into harder-to-monitor jurisdictions.

  **3. Analysis of Options**

  **Option 1: Criminalization.** Enacting a prohibition on purchase and sale would align with the moral views of the majority of consultation respondents. However, it contradicts the empirical evidence of the pilot. Criminalization would dismantle the safety infrastructure currently protecting workers, likely increasing health risks and vulnerability to coercion. Furthermore, as the Police have noted, this option diverts significant public resources toward enforcing private consensual conduct, with a high probability of displacing the activity rather than eliminating it.

  **Option 3: Full Decriminalization.** Treating sex work solely under general employment and health law would maximize worker autonomy and reduce stigma. However, given the substantial public concern regarding the visibility and moral implications of the trade, this option risks significant political friction. It may also limit the City's ability to manage the *location* of these businesses, which is a primary concern for residents regarding neighborhood character.

  **Option 2: Retained Licensing with Enhanced Controls (Recommended).** This option strikes a necessary balance. It acknowledges the success of the pilot in ensuring physical safety and health compliance. Simultaneously, it allows the Council to address the "moral environment" concerns through zoning and advertising restrictions. This ensures that while the activity is permitted, it is not imposed upon unwilling neighborhoods or visible to the general public in a manner that disrupts community life.

  **4. Principled Justification**

  The Committee's recommendation rests on two distinct but complementary justifications: the prevention of harm and the appropriate expressive function of the law.

  *The Harm Principle:* The primary justification for state intervention in private conduct is the prevention of harm to others. The pilot data demonstrates that licensing reduces harm (health risks, coercion) effectively. Criminalization, by contrast, creates harm by driving the industry underground, removing health inspections, and discouraging workers from reporting violence to police for fear of prosecution. Therefore, on utilitarian grounds, licensing is superior.

  *The Expressive Function of Criminal Law:* Law is not merely a tool of control; it is a teacher. It expresses societal values. Proponents of criminalization argue that the law must condemn sex work to maintain the community's moral character. We acknowledge that the law shapes culture. However, the criminal law is the state's "blunt sword." It should be reserved for conduct that causes direct, tangible harm to non-consenting parties. Using the criminal law to enforce a specific conception of moral virtue in private, consensual adult relationships is disproportionate in a pluralistic society.

  Regulatory law also has an expressive function. By maintaining licensing but tightening zoning and advertising, the Council expresses that while this trade is not a crime, it is a specialized activity that must be contained and managed to protect public order. This signals that the City values safety and order without resorting to the moral condemnation inherent in criminal statutes.

  **5. Addressing the Strongest Counter-Argument**

  The strongest consideration favoring the rejected course of criminalization is the argument from **moral ecology**. Proponents argue that even if no direct physical harm occurs to third parties, the state's tolerance of commercial sex erodes the shared norms that bind the community. They contend that law cannot be neutral; by permitting sex work, the City signals that human intimacy is a commodity, which may degrade the moral character of the citizenry over time.

  The Committee takes this concern seriously. A community's moral fabric is a legitimate public good. However, criminalization is an ineffective tool to preserve this fabric in this context. History suggests that prohibiting consensual vice does not eliminate the demand; it merely creates a black market. A black market is inherently amoral, operating outside the reach of health inspectors, labor standards, and police protection.

  If the goal is to preserve community standards, a regulated environment is superior to a criminal one. Licensing allows the City to dictate *where* and *how* this business occurs, ensuring it does not intrude upon schools, parks, or residential zones. This protects the "moral environment" of public spaces more effectively than prohibition, which scatters the activity into hidden, unregulated corners of the city. We can protect the community's character by managing the visibility and impact of the trade, without criminalizing the private choices of adults.

  **6. Recommendation and Next Steps**

  The Committee recommends the Council adopt **Option 2: Retain licensing while strengthening zoning, nuisance, and advertising controls.**

  To implement this, the Council should take the following concrete steps:

  1.  **Drafting of Bylaws:** Instruct the City Attorney to draft amendments to the Business Licensing Bylaw. These amendments should codify the pilot's health and safety requirements as permanent standards.
  2.  **Zoning Restrictions:** Direct the Planning Department to identify specific zones where licensed premises are permitted, ensuring adequate distance from schools, places of worship, and residential dwellings to address neighborhood concerns.
  3.  **Advertising Limits:** Prohibit outdoor advertising of licensed premises to prevent the "moral visibility" concerns raised during consultation, limiting marketing to on-premise signage or digital platforms accessible only to adults.
  4.  **Police Protocol:** Establish a formal protocol with the Police Department to ensure that licensed premises are treated as legitimate businesses, focusing enforcement resources on unlicensed operations and instances of coercion or trafficking.

  **7. Mechanism for Review**

  Recognizing that this issue involves evolving social norms, this recommendation is not intended to be permanent without oversight. The Committee recommends a **Sunset and Review Clause**.

  The new regulatory framework shall be subject to a comprehensive review by the Law Reform Advisory Committee in **two years**. This review shall assess:
  *   Compliance rates with the new zoning and advertising bylaws.
  *   Any changes in the prevalence of unlicensed activity.
  *   Continued feedback from public health officials and community representatives regarding the impact on neighborhood character.

  **8. Conclusion**

  The Council faces a choice between enforcing a moral majority view through criminal law or managing a complex social reality through regulation. The evidence shows that the pilot has made the trade safer without increasing coercion. Criminalization would undo these gains at high public cost. By retaining licensing with stricter controls on location and visibility, the Council can protect the physical safety of workers while respecting the community's desire to maintain the moral tone of its public spaces. This is a pragmatic, principled path forward.

  Respectfully submitted,

  Rapporteur
  Law Reform Advisory Committee
