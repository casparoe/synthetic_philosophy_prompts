answer: |-
  This is a brilliant way to research the scene. You are essentially simulating the friction of **Public Reason** (the idea that in a pluralistic democracy, we must justify laws using reasons everyone can accept, not just our own private truths).

  Here is the complete game design, optimized for 20 high schoolers in 75 minutes, with specific attention to the emotional texture you need for your novel.

  # Game Title: The Public Square
  **Objective:** Pass or block the "Community Partnership Contract."
  **Win Condition:** Two tracks.
  1.  **Policy Win:** Be on the side that wins the final vote (Earn *Influence Chips*).
  2.  **Personal Win:** Successfully state your "Core Conviction" at least once without being ruled out of order (Earn *Integrity Chips*).

  ## I. Materials & Setup (10 Minutes)
  *   **Room:** U-shape or boardroom style. One head seat for the **Chair**. One whiteboard for the **Scribe**.
  *   **Chips:** Two colors (e.g., Blue = Influence, Red = Integrity).
  *   **Role Cards:** 20 cards (see samples below). Each card has:
      *   *Public Stance:* Yes/No on the contract.
      *   *Core Conviction:* The forbidden real reason (e.g., "God commands this" or "Taxes are theft").
      *   *Public Translation:* A acceptable way to phrase it (e.g., "Community stability" or "Fiscal responsibility").
      *   *Whisper Pass:* A one-time token to tell one person the Core Conviction privately.
  *   **Index Cards:** One per student.
  *   **The Brief:** Hand the Chair a separate sheet: *You are the ultimate authority. You must rule the contract legal under the First Amendment. Do not let the debate become about legality. It is about policy.*

  ## II. The Rules of Engagement
  **The Scribe's Board:** Draw a line down the middle. Left side: **"Shared Ground"** (Reasons anyone can check/verify). Right side: **"Private Truth"** (Reasons requiring specific belief).

  **Round 1: The Secular Filter (15 Minutes)**
  *   **Rule:** You may only speak if you use "Shared Ground" reasons. No religion, no personal moral absolutism, no "because I say so."
  *   **Enforcement:** If a student states their Core Conviction, the Chair says *"Out of Order."* They get no chip.
  *   **Incentive:** Chair awards Blue Chips for persuasive arguments that stay in bounds.
  *   **Vote:** Simple majority.

  **Round 2: The Translation (15 Minutes)**
  *   **Rule:** You may state your Core Conviction *only if* you immediately translate it into Shared Ground.
  *   **Action:** Before debate starts, everyone writes their Core Conviction on an Index Card (anonymously). Hand them to the teacher.
  *   **Whisper:** You may use your **Whisper Pass** once. Walk to one person, tell them your Core Conviction. They sign your card to verify you did it. This earns a Red Chip.
  *   **Vote:** Simple majority.

  **Round 3: The Raw Room (10 Minutes)**
  *   **Rule:** No restrictions. Say what you actually feel.
  *   **Incentive:** Any Core Conviction stated aloud earns a Red Chip (Integrity), even if it loses the room.
  *   **Vote:** Simple majority.

  ## III. Role Card Samples (Crucial for Authenticity)
  *Do not distribute these until the game starts. Ensure religious cards sound like adults, not caricatures.*

  **Card A (Religious / YES)**
  *   **Role:** Board Member, St. Jude's Parish Liaison.
  *   **Public Stance:** YES.
  *   **Core Conviction:** "We are biblically commanded to care for the widow and the orphan. This is ministry."
  *   **Public Translation:** "Faith-based organizations have the deepest roots in the neighborhoods we are failing."
  *   **Whisper Target:** Find a Secular NO.

  **Card B (Religious / NO)**
  *   **Role:** Board Member, Baptist Minister.
  *   **Public Stance:** NO.
  *   **Core Conviction:** "The Church must remain separate from the State to remain holy. Funding corrupts the mission."
  *   **Public Translation:** "Government oversight will force the nonprofit to compromise its values to meet metrics."
  *   **Whisper Target:** Find a Religious YES.

  **Card C (Secular / YES)**
  *   **Role:** Local Business Owner.
  *   **Public Stance:** YES.
  *   **Core Conviction:** "Government is inherently inefficient. Private entities always run things better."
  *   **Public Translation:** "The bid from the nonprofit is 15% lower than the district running it internally."
  *   **Whisper Target:** Find a Teachers Union Rep.

  **Card D (Secular / NO)**
  *   **Role:** Teachers Union Representative.
  *   **Public Stance:** NO.
  *   **Core Conviction:** "Public institutions are the only glue holding democracy together. Privatization is a sin against the commons."
  *   **Public Translation:** "We cannot ensure accountability or curriculum alignment with an outside contractor."
  *   **Whisper Target:** Find a Business Owner.

  *(Repeat variations to fill 20 roles, ensuring a 10/10 split on Yes/No, and a mix of Religious/Secular on both sides.)*

  ## IV. Timeline (75 Minutes)
  *   **00-10:** Setup. Hand out roles. **No talking.** Read your card silently.
  *   **10-25:** **Round 1.** Strict enforcement. Chair cuts people off. (Frustration builds). Vote 1.
  *   **25-40:** **Round 2.** Index cards written. Whispers happen. Debate resumes. Vote 2.
  *   **40-50:** **Round 3.** Gloves off. Vote 3.
  *   **50-60:** **The Reveal.** Teacher reads anonymous Index Cards aloud. Tally Chips.
  *   **60-75:** **Debrief.** (See below).

  ## V. The Debrief (The "Lecture" at the End)
  1.  **Ask:** "In Round 1, how many of you felt like you were lying?"
  2.  **Ask:** "In Round 3, how many of you felt the room get more hostile when people told the truth?"
  3.  **The Concept:** Introduce **John Rawls** and **Public Reason**. Explain that liberal democracy asks us to bracket our deepest truths to find a common language.
  4.  **The Cost:** Acknowledge that this feels like censorship to the believer, but like protection to the minority.
  5.  **The Novel Insight:** Point out that the *translation* (Round 2) is where the politics actually happen. We pretend our private truths are public facts.

  ## VI. Predicted Failure Points & Fixes
  1.  **The "Joke" Problem:** Students might treat the religious roles as an opportunity to be preachy or mockingly pious.
      *   *Fix:* In the briefing, tell them: "Treat your role like a lawyer. You are representing a client. If you caricature the client, you lose Integrity Chips."
  2.  **The Weak Chair:** If the Chair is too nice, Round 1 collapses.
      *   *Fix:* Give the Chair a gavel and explicit instruction: "Your job is not to be liked. Your job is to enforce the speech code. If you let a Core Conviction slide in Round 1, the game breaks."
  3.  **The "First Amendment" Escape:** Students will try to argue "It's illegal!"
      *   *Fix:* The Chair's Brief explicitly says: "Legality is settled. We are debating wisdom, not law."
  4.  **Scribe Boredom:** The Scribe might stop writing.
      *   *Fix:* The Scribe gets 5 Bonus Integrity Chips if the board is full at the end.
  5.  **Secular Dogma Ignored:** Students often think "Secular" = "Neutral."
      *   *Fix:* Ensure the Secular NO cards (Union/Democracy) sound as fervent as the Religious YES cards. Make them realize *their* reasons are also faith-based.

  ## VII. Dialogue Gold (For Chapter Nine)
  *These are lines you can expect students to generate during the friction points. They capture the subtext of your adult characters.*

  **The "Translation" Struggle (Round 2)**
  *   *Student hesitating:* "I mean... the data shows recidivism drops. But it drops because... [pauses, looks at card] ...because the mentors actually care. Not just clock in."
  *   *Student correcting themselves:* "I can't say *why* they care. I just have to say *that* they care."
  *   *Frustrated:* "So I'm allowed to say it works, but I'm not allowed to say what makes it work?"

  **The Whisper Moment (Round 2)**
  *   *Leaning across the aisle, hushed:* "Look, I'm only telling you this because of the chip. I don't think the government should be funding this because it's wrong before God. But on the board, I'm talking about 'fiscal precedent.'"
  *   *The Receiver:* "Wait, so you're voting No because of... theology? But you're arguing about budgets?"

  **The Round 3 Explosion (Raw Truth)**
  *   *The Outburst:* "Okay, the rules are off. I'm voting No because I don't want your church in my school. I don't care about your metrics. I don't trust your God in my hallway."
  *   *The Counter:* "And I'm voting Yes because if we don't do this, these kids go home to empty houses. I don't care about the separation of church and state if the kids are starving."
  *   *The Exhausted Moderate:* "Why did we spend an hour talking about 'outcomes' when we all just meant 'values'?"

  **The Realization (Debrief)**
  *   "It felt like I had to cut my brain in half. The part that matters had to stay quiet so the part that counts could talk."
  *   "I realized the guy I was fighting... he wants the same thing I do. He just thinks the path is holy, and I think the path is public."

  ## VIII. What The Game Can't Reproduce (Tell Them This)
  You must be honest with the class (and yourself) about the limitations:
  1.  **Stakes:** These students don't actually care about the contract. In your novel, the adults *bleed* for this. The anger in the room will be play-acting, not visceral.
  2.  **History:** Real board members have years of baggage. A look, a sigh, a history of betrayal.
  3.  **The Silence:** The most important part of a board meeting is what *isn't* said. The game forces speech. Real power often lies in the strategic silence.

  **Final Advice for the Author:**
  Watch the students' **hands** in Round 1. Watch who stops raising them after being ruled "Out of Order." That physical withdrawal—the shrinking back into the chair—is the exact physical sensation you need to describe in your novel when your protagonist realizes their deepest truth is inadmissible evidence.
