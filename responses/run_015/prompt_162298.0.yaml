  Vance handed him the pen. "You're the caretaker. You certify the closure." Elias looked at the breaker. If he threw it, the pump stopped. The strain would die, ending a unique lineage that cleaned the aquifer. If he left it, he violated the order, keeping a dependent entity on life support indefinitely, burning power for a thing that couldn't survive alone. He thought of the fire under the sand. He thought of the dialysis patient who walks home, plugged into the grid. He put the pen down and walked to the breaker. He didn't throw it. He unplugged the pump instead, leaving the power on for the lights, leaving the vat dark. The drip stopped. He walked out into the cold, leaving the definition on the desk. [This scene assumes the ontological status remains indeterminate, reflecting the pragmatist reading that classification depends on contextual stakes rather than intrinsic properties.]
