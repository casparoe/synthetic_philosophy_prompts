answer: |-
  ### Part 1: Validation of the Three-Way Split

  **Verdict:** The distinction is **doing real work**. It is not an invention; it maps onto established distinctions in political philosophy (Is vs. Ought, Genealogy vs. Validity) and is necessary to prevent the phrase from collapsing into nonsense.

  1.  **Values as *Inherited* (Genealogical):**
      *   *Function:* Explains cultural texture and historical path dependence.
      *   *Necessity:* Without this, you cannot explain why "Western" values look different from "East Asian" liberal values (e.g., individualism vs. communal liberalism).
      *   *Risk:* The Genetic Fallacy. Just because a value came from Christianity or the Enlightenment doesn't make it true or binding now.

  2.  **Values as *Actually Held* (Empirical/Sociological):**
      *   *Function:* Describes current behavior, voting patterns, and social norms.
      *   *Necessity:* Without this, the account is delusional. If 40% of a population supports authoritarianism, "liberalism" is not a fully held value, regardless of the constitution.
      *   *Risk:* Reduces "values" to polling data. If the majority supports something illiberal, does it become a "Western value" by virtue of being held?

  3.  **Values as *Committed To* (Normative/Constitutive):**
      *   *Function:* The "No True Scotsman" safeguard. This is the "who we are" claim. It allows for internal critique (e.g., "Slavery violated Western values" even when slavery was legal and popular).
      *   *Necessity:* Without this, you cannot criticize your own society using its own standards. It provides the aspirational yardstick.
      *   *Risk:* Hypocrisy. If the gap between *Committed* and *Held* is too wide, the phrase becomes pure propaganda.

  **Conclusion:** An account that collapses these three will fail your test. It will either be historically illiterate (ignoring *Inherited*), empirically false (ignoring *Held*), or politically toothless (ignoring *Committed*).

  ---

  ### Part 2: The Desiderata (Specification for a Robust Account)

  Here are the criteria an account of "Western Values" must meet to be analytically useful rather than tribal.

  #### 1. The Decoupling Criterion (Geography vs. Ideology)
  *   **Requirement:** The account must be able to classify a polity as "Western" in values without relying solely on continental shelf location, and vice versa.
  *   **Cases to Handle:** Hungary/Poland (European geography, illiberal shifts) vs. Japan/New Zealand (Non-European geography, high liberal alignment).
  *   **What's Behind It:** "The West" is a political-cultural category, not a GPS coordinate. If the definition relies on geography, it cannot explain illiberal Europe.
  *   **Status:** **Non-Negotiable.** (If it fails this, it's just geography, not values).

  #### 2. The Reflexivity Criterion (The Critic's Paradox)
  *   **Requirement:** The account must explain how critics can use "Western values" to attack Western institutions without being external enemies.
  *   **Cases to Handle:** A protestor using free speech to demand the end of capitalism; citing the Declaration of Independence to condemn US foreign policy.
  *   **What's Behind It:** Western liberalism contains a mechanism for self-negation or self-correction. If the definition treats all criticism as an attack *on* the values, it is authoritarian.
  *   **Status:** **Non-Negotiable.** (Failure here turns the phrase into a loyalty oath).

  #### 3. The Secularism/Religiosity Distinction
  *   **Requirement:** The account must distinguish between *institutional secularism* (separation of church and state) and *personal secularity* (atheism/agnosticism).
  *   **Cases to Handle:** The United States (highly religious, institutional secularism) vs. France/Scandinavia (low religiosity, institutional secularism).
  *   **What's Behind It:** "Western Values" are often conflated with "Post-Enlightenment Atheism." This excludes the US, which is central to the geopolitical "West."
  *   **Status:** **Non-Negotiable.** (Empirical reality demands it).

  #### 4. The Temporal Consistency Criterion (The Suffrage Test)
  *   **Requirement:** The account must explain how a value can be "Western" even if it was universally violated by Westerners for 90% of the relevant history.
  *   **Cases to Handle:** Women's suffrage, civil rights, prohibition of torture.
  *   **What's Behind It:** Values must be definable as *aspirational trajectories* rather than *historical constants*. If "Western Values" requires historical consistency, the term applies to nothing.
  *   **Status:** **Non-Negotiable.** (Prevents historical falsification).

  #### 5. The Universalism vs. Particularism Scope
  *   **Requirement:** The account must specify whether these values are claimed to be *universal human truths* discovered by the West, or *particular cultural habits* indigenous to the West.
  *   **Cases to Handle:** Human Rights interventions (Universal) vs. Immigration/Assimilation debates (Particular).
  *   **What's Behind It:** This is the primary friction point. Universalism invites charges of imperialism; Particularism invites charges of relativism or ethno-nationalism.
  *   **Status:** **Camp-Specific.** (Liberals demand Universalism; Conservatives/Realists often prefer Particularism).
  *   **Warning:** An account that claims *both* simultaneously without qualification is logically unstable.

  #### 6. The Institutional vs. Cultural Weighting
  *   **Requirement:** The account must state whether the values reside primarily in *formal institutions* (constitutions, courts) or *informal norms* (trust, social capital, etiquette).
  *   **Cases to Handle:** Countries with Western constitutions but non-Western corruption levels; or communities maintaining Western norms without state support.
  *   **What's Behind It:** Institutions can be copied; norms are harder to transplant. This determines if "Western Values" can be exported via policy or only via culture.
  *   **Status:** **Non-Negotiable.** (Ambiguity here makes the term unfalsifiable).

  #### 7. The Coherence Threshold
  *   **Requirement:** The account must identify a minimum threshold of internal consistency before the label applies.
  *   **Cases to Handle:** Can a society be "Western" if it values free speech but rejects equality? Or values equality but rejects free speech?
  *   **What's Behind It:** "Western Values" is a bundle (Liberty, Equality, Rule of Law, Individualism). If one strand is cut, does the rope hold?
  *   **Status:** **Camp-Specific.** (Libertarians prioritize Liberty; Social Democrats prioritize Equality).

  ---

  ### Part 3: Incompatibility Matrix (Where the Spec Breaks)

  You asked to flag pairs that probably cannot both be satisfied. These are the tension points where "Western Values" usually becomes a tribal marker.

  | Conflict Pair | Why they clash | Which one usually wins? |
  | :--- | :--- | :--- |
  | **Descriptive Accuracy (*Held*) vs. Normative Force (*Committed*)** | If you define values by what people *actually do* (Held), you lose the ability to criticize them (Committed). If you define by *Committed*, you risk hypocrisy when behavior diverges. | **Tribal Marker:** Switches between them opportunistically. <br>**Robust Account:** Explicitly tracks the gap. |
  | **Universalism vs. Geographic Identity** | If values are Universal (Human Rights), calling them "Western" is parochial/colonial. If they are "Western," they aren't necessarily Universal, undermining interventionism. | **Tribal Marker:** Claims Universal truth when intervening, Cultural particularity when resisting immigration. <br>**Robust Account:** Picks a lane (e.g., "Universal values historically incubated in the West"). |
  | **Inherited (Christian/Enlightenment) vs. Pluralist Present** | If values are *Inherited* from specific traditions, non-adherents (secular, Muslim, Hindu citizens) are perpetually second-class participants in that value system. | **Tribal Marker:** Emphasizes Heritage to exclude. <br>**Robust Account:** Treats Heritage as historical context, not a membership test. |
  | **Individualism vs. Social Cohesion** | Core Western value is Individual Autonomy. But stable societies require collective obligation. Pushing Individualism too far erodes the community that sustains the value. | **Tribal Marker:** Blames "too much individualism" or "too much collectivism" depending on the enemy. <br>**Robust Account:** Acknowledges the tension as a permanent feature of liberal society. |

  ### Part 4: Implementation Advice

  When you encounter the phrase "Western Values" in the wild, run it against the **Three-Way Split** first.

  1.  **If they mean *Inherited*:** They are making a historical/cultural argument. (e.g., "Our legal system is based on Roman law.") -> *Check for Genetic Fallacy.*
  2.  **If they mean *Held*:** They are making a sociological argument. (e.g., "Most Americans believe X.") -> *Check for polling bias/generalization.*
  3.  **If they mean *Committed*:** They are making a normative argument. (e.g., "We believe in liberty.") -> *Check for Hypocrisy (gap with Held).*

  **The Tribal Marker Signal:** The phrase is being used tribally when the speaker **collapses the three** to evade criticism.
  *   *Example:* "You can't criticize our foreign policy; these are **Western Values**." (Switches from *Committed* to *Inherited* to shut down debate).
  *   *Example:* "They don't share our values." (Implies *Held*, but often means *Inherited* ethnicity/religion).

  **The Robust Signal:** The speaker acknowledges the tension.
  *   *Example:* "We are **committed** to liberty, though historically we **inherited** hierarchies we are still struggling to stop **holding**."

  If the account cannot sustain that level of granularity, it is not doing argumentative work; it is doing boundary work.
