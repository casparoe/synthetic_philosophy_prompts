  **The Scenario**

  You are attending the Global Tech Summit, a conference with exactly 1,000 registered attendees present in the main hall. The organizers flipped a fair coin to decide the badge policy: heads ($H_{Wide}$), everyone receives a uniquely numbered badge from 1 to 1,000; tails ($H_{Narrow}$), only 10 randomly selected VIPs receive numbered badges from 1 to 10, while the other 990 attendees receive blank badges. You look down at your own chest and see a badge displaying the number "1". You know that under either hypothesis, exactly one person in the room holds the badge numbered "1", and the total number of people in the room is 1,000 regardless of the coin flip.

  ***

  **1. The SSA Computation**

  *   **Primary Reference Class:** "Attendees eligible for a numbered badge."
      *   Under $H_{Wide}$, all 1,000 attendees are eligible. You are one specific number (1). Probability of drawing "1" = $1/1000$.
      *   Under $H_{Narrow}$, only 10 attendees are eligible. You are one specific number (1). Probability of drawing "1" = $1/10$.
      *   Likelihood Ratio: $(1/10) / (1/1000) = 100$.
      *   Posterior: $P(H_{Narrow}|E) = 100/101 \approx \mathbf{99.01\%}$. SSA is extremely confident the VIP policy was chosen.

  *   **Narrower Reference Class:** "Attendees currently holding badge #1."
      *   Under both hypotheses, exactly 1 person holds badge #1.
      *   Probability of drawing "1" from this class = $1/1 = 1$ in both cases.
      *   Likelihood Ratio: $1/1 = 1$.
      *   Posterior: **50%**. The shift vanishes.

  *   **Wider Reference Class:** "Every human alive today."
      *   Assume ~8 billion humans. The number of humans is independent of the conference badge policy.
      *   Probability of being *you* (the specific human with this evidence) is effectively $1/8B$ in both cases (assuming the conference doesn't change global population).
      *   Likelihood Ratio: $1/1 = 1$.
      *   Posterior: **50%**. The shift vanishes.

  **2. The SIA Computation**

  *   **Definition:** Posterior $\propto$ Prior $\times$ Count(Observers with Evidence $E$).
  *   **Evidence $E$:** "I observe badge #1."
  *   **Under $H_{Wide}$:** Exactly 1 person observes badge #1.
  *   **Under $H_{Narrow}$:** Exactly 1 person observes badge #1.
  *   **Calculation:**
      *   $P(H_{Wide}|E) \propto 0.5 \times 1 = 0.5$
      *   $P(H_{Narrow}|E) \propto 0.5 \times 1 = 0.5$
  *   **Result:** The posterior ratio is 1:1. SIA remains at **50%**. It does not move at all (factor of 1 shift), satisfying the constraint of < factor 2.

  **3. The Decision**

  You are offered a choice between two bets before the organizers announce the policy. You want to maximize expected monetary return.

  *   **Option A (Bet on Narrow):** Pays \$100 if $H_{Narrow}$ is true, \$0 if $H_{Wide}$.
  *   **Option B (Bet on Wide):** Pays \$105 if $H_{Wide}$ is true, \$0 if $H_{Narrow}$. (Payoff slightly inflated to break SIA's tie).

  **SSA Expected Utility:**
  *   Option A: $0.9901 \times \$100 + 0.0099 \times \$0 = \mathbf{\$99.01}$
  *   Option B: $0.0099 \times \$105 + 0.9901 \times \$0 = \mathbf{\$1.04}$
  *   **SSA Choice:** Option A.

  **SIA Expected Utility:**
  *   Option A: $0.50 \times \$100 + 0.50 \times \$0 = \mathbf{\$50.00}$
  *   Option B: $0.50 \times \$105 + 0.50 \times \$0 = \mathbf{\$52.50}$
  *   **SIA Choice:** Option B.

  **Result:** The theories prescribe opposite actions. SSA bets heavily on the VIP policy; SIA takes the slightly better payout on the Wide policy.

  **4. Isolating the Feature**

  The feature doing the work is the **hypothesis-dependent size of the Reference Class**. SSA updates because the pool of "eligible observers" shrinks under $H_{Narrow}$, making your specific evidence (being #1) seem less coincidental. SIA ignores the pool size and looks only at the absolute count of matching observers (which is fixed at 1).

  **Counterfactual:** If the datum were "I am attending the conference" (true for all 1,000 people in both hypotheses), the count of matching observers would be 1,000 for both. SIA would still not move (1000 vs 1000). SSA with the "Attendee" reference class would also not move (1000/1000 vs 1000/1000). The divergence *only* occurs because the evidence ("Badge #1") selects a subset of observers whose *eligibility* varies between hypotheses. If everyone was guaranteed a numbered badge in both worlds (e.g., $H_{Narrow}$ meant badges 1-10 were reused 100 times each), then Count($E$) would be 100 vs 1, SIA would update, and SSA (with "Attendee" RC) would update similarly. The specific recklessness here relies on the *exclusion* of observers from the evidence pool in one hypothesis.

  **5. The Strongest SIA Defense**

  **Objection:** "The Reference Class 'Attendees eligible for a numbered badge' is illegitimate because it is defined by the evidence itself. You only know you are 'eligible' because you observed the badge. If you treat 'having a badge' as background knowledge to define the class, you must also condition on it in the likelihood, which collapses SSA into SIA. If you treat it as evidence, the Reference Class should be fixed independently of the hypothesis (e.g., 'All Attendees'). Using a variable Reference Class is gerrymandering to force an update."

  **Evaluation:** This objection works. It exposes the core instability of SSA. To get the 99% confidence, SSA must use a Reference Class that correlates with the hypothesis ("Badge Holders"). If you use the stable class ("All Attendees"), SSA agrees with SIA (no update). Because SSA offers no principled way to select the "correct" Reference Class, it permits reckless conclusions depending on how narrowly you define the group you claim to be sampled from. SIA avoids this by tying the weight directly to the observer count matching the evidence, rendering it insensitive to arbitrary Reference Class boundaries. In this specific case, SIA's stability is a feature, not a bug; SSA's confidence is an artifact of class selection.
