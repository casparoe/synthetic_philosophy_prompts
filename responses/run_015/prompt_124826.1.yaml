answer: |-
  Here is the work. I have spent time testing three candidate principles against your cases before settling on the one below. I will show you the failures of the first two so you can see why the third is necessary.

  ### Background: Testing the Principles

  **Candidate 1: The All-Subjected Principle**
  *The Rule:* Anyone subject to the city's enforcement power gets a vote.
  *The Break:* This is clean, but it breaks on your **Absentee Hearth-Holder (Case 2)**. His house is subject to seizure; his tax is enforceable. Under this rule, he votes. You said no. It also breaks on the **Monks (Case 6)**. They are subject to the law. You said no. This principle treats property as a person, which dilutes the vote of those actually present.

  **Candidate 2: The All-Affected Interests Principle**
  *The Rule:* Anyone whose interests are significantly changed by the decision gets a vote.
  *The Break:* This feels moral, but it breaks on the **Unborn (Case 8)**. They are most affected of all. If you give them a vote, the meeting never closes. If you don't, the principle is lying. It also creates a problem for the **Child (Case 4)**. They are affected by the bond. You said no, but felt uneasy. This principle validates the unease but offers no way to resolve it practically. It turns the Meeting into a referendum on pain rather than a construction of a future.

  **Candidate 3: Reciprocal Co-Authorship (The Survivor)**
  *The Rule:* Voting is not a shield against harm; it is an act of building the 'We'. You vote if you are a co-author of the collective will.
  *The Test:* This requires three things: **Capacity** (you can reason), **Presence** (you share the daily fate of the city), and **Independence** (you judge for yourself).
  *   It excludes the Absentee (no shared daily fate).
  *   It excludes the Monks (no independent judgment).
  *   It excludes the Child/Dementia (no capacity).
  *   It includes the Barge-dwellers (shared fate, capacity, independence).
  *   It handles the Unborn by framing the voters as *trustees* rather than representatives.

  This third principle survives. It shifts the justification from "protection" to "partnership." Here is the argument built on that foundation.

  ***

  ### The Principle: Reciprocal Co-Authorship

  You should throw out your current rule ("enforceability + view"). It is too passive. It suggests democracy is about defending yourself from the state. In Saltmarch, democracy should be about *building* the state.

  The principle is this: **Franchise belongs to those who possess the capacity for independent judgment and share the continuous burden of the city's fate.**

  This is not about who gets hurt. It is about who is weaving the rope that ties everyone together. If you are not holding the rope, you do not get to decide where it is thrown.

  #### Applying the Principle to Your Cases

  **1. The Moorings People (Barge-dwellers)**
  *Verdict:* **Vote.**
  *Why:* They satisfy all three criteria. They have capacity. They are independent. Crucially, they share the *continuous* fate. Even if they move, they are within the jurisdiction's weave for the majority of the year. They are subject to the harbourmaster not as invaders, but as residents.
  *Confidence:* High. This is the heart of your conflict.

  **2. The Absentee Hearth-Holder**
  *Verdict:* **No Vote.**
  *Why:* This is the hardest case to sell, but the principle is clear. He does not share the *continuous* burden. He enjoys the security of his property without suffering the daily friction of the city's order. He is a beneficiary, not a partner. To let him vote is to allow property to speak louder than people.
  *Confidence:* High. This creates the class conflict you need.

  **3. The Granddaughter (Student)**
  *Verdict:* **Vote.**
  *Why:* Temporary absence does not break the thread of shared fate. She is being equipped to return. Her centre of life remains Saltmarch.
  *Confidence:* High.

  **4. The Child (12 years old)**
  *Verdict:* **No Vote.**
  *Why:* You felt uneasy because he pays the bond. But under Co-Authorship, the vote is not a receipt for tax paid; it is a tool of governance. He lacks the *capacity* for independent judgment. The unease is resolved by recognising that his parents (if hearth-holders) vote as his *trustees*. They are obliged to weigh the bond's burden on him.
  *Confidence:* Medium. The age boundary is always arbitrary, but the capacity constraint is necessary.

  **5. The Prisoner**
  *Verdict:* **Vote.**
  *Why:* She retains capacity and independence. Her liberty is restricted, but her membership in the 'We' is not. She will live behind the gate. Excluding her would be adding a civil death to a criminal sentence.
  *Confidence:* High.

  **6. The Wardens of the Slack (Monks)**
  *Verdict:* **No Vote.**
  *Why:* You worried about hypocrisy. Do not worry. You are not excluding them for their *religion*, but for their *abdication of agency*. Democracy requires voters to deliberate and decide. If they vow to obey an Abbot, they are not voters; they are proxies. A bloc vote dictated by an external authority breaks the reciprocity of the Meeting.
  *Confidence:* Medium. This is philosophically dense, but dramatic gold.

  **7. The Dementia Sufferer**
  *Verdict:* **No Vote.**
  *Why:* This is the same class as the Child (Case 4). The distinction is *capacity*, not worth. She is protected by the 'We', but cannot join the 'We' in this act. Her family votes as trustees. This resolves your unease: she is not different in kind from the child, only in tragedy.
  *Confidence:* High.

  **8. The Unborn**
  *Verdict:* **No Vote (but with a duty).**
  *Why:* They cannot be co-authors. They cannot deliberate. However, under this principle, the living voters are not owners of the city; they are *stewards*. The vote on a hundred-year bond is not a right; it is a fiduciary duty. If they vote to burden the unborn without necessity, they violate the principle of reciprocity across time.
  *Confidence:* Low. This is metaphysical, but it gives your characters a moral language for the bond crisis.

  ***

  ### New Cases for Your Plot

  You asked for cases your principle decides that aren't on your list. Here are two. One you asked for, one you need.

  **9. The Summer Drifters (Tide-dwellers)**
  *The Case:* Families who live on the mudflats inside the estuary for three months during the fishing season, then move to open sea. They are inside the jurisdiction for the flood risk, but gone for the winter maintenance.
  *Verdict:* **No Vote.**
  *Why:* They do not share the *continuous* burden. They take the harvest but leave before the sluices need clearing. They are users of the city, not members of it.
  *Dramatic Use:* This creates a gradient of belonging. The Barge-dwellers (9 months) can claim moral superiority over the Drifters (3 months), isolating the Drifters from the Barge alliance.

  **10. The Gate Labourers**
  *The Case:* Two hundred masons and engineers hired from abroad for the five-year construction. They live in a camp inside the walls. They are subject to law, have capacity, and are present.
  *Verdict:* **Vote.**
  *Why:* They share the fate. If the gate fails, they die. They are co-authors of the safety during construction.
  *Dramatic Use:* This overturns the intuition that "only born citizens vote." It forces the city to decide if these workers are temporary tools or new neighbours. If they vote, they might block the gate because they plan to leave before the bond matures.

  ***

  ### Where I am Guessing

  I am confident on the Absentee and the Barge-dwellers; that is the core tension. I am less confident on the **Monks (Case 6)**. In real-world theory, we often allow religious citizens to vote even if their conscience is guided by faith. The distinction here is the *vow of obedience* regarding civic matters. If the Abbot tells them how to vote on the sluices, that is a structural conflict with democratic agency. If you want to soften this, you could allow them to vote but forbid the Abbot from directing them, but that breaks their vow. I recommend holding the line: no vote. It makes the Abbot a political actor without a hand, which is dangerous.

  I am also guessing on the **Unborn (Case 8)**. There is no perfect instrument for them. I suggest you treat the " hundred-year bond" as requiring a super-majority (e.g., two-thirds). This mechanically encodes the duty to the future without giving them a hand.

  ### The One-Liner

  You need something a character can shout across a crowded hall. Do not use the word "legitimacy." Use the word "burden."

  > **"You only get a hand if you share the burden of the rule you make."**

  ### Final Advice for the Scene

  The drama comes from the Absentee Hearth-Holder (Case 2) trying to use his wealth to influence the Barge-dwellers (Case 1). He argues he pays the tax. They argue they live the life.

  Your principle makes the Barge-dwellers right, but it makes them sound exclusive. The counter-argument from the Absentee should be: *"I pay for the wall that keeps you dry."* The response from the Barge-dweller must be: *"Then you are a customer, not a citizen. Sit down."*

  That is the gut feeling you wanted. It is not about kindness; it is about who owns the future.
