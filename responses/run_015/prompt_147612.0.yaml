  2.  **Deconstruct the Thesis:**
      *   *Paul's View:* TEs are epistemically inaccessible before having them. You can't know "what it's like" (phenomenal character) without experience. This creates a problem for rational decision-making (Expected Utility Theory fails because you can't assign utility to an unknown outcome).
      *   *User's View:* It's not about phenomenal access; it's about *analogy*. We understand the future by mapping current concepts to it. In TEs, the concepts themselves change (dimensional shift), so the analogy fails.
      *   *Implication:* If it's just analogical failure, maybe it's not *metaphysically* special, just *cognitively* hard. Does this solve the decision problem?

  3.  **Drafting the Objections (Voice & Content):**

      *   **The Paul Defenders (2 people):**
