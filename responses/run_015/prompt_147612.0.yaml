          *   *Weakest:* Distinguishing "can't imagine" from "can't access."

      *   *Rational Choice Problem:*
          *   *Concede:* It doesn't fully solve Expected Utility Theory (EUT) if you still lack data.
          *   *Hold:* It changes *how* we deliberate. We deliberate on *values* and *conceptual shifts*, not just utilities.
          *   *Weakest:* Showing how this actually leads to a decision.

      *   *Weakest Point in User's Position:*
