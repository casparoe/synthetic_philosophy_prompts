answer: |-
  # Activity: The Sample-Return Definition Protocol

  ## 1. Materials List (Print & Cut)
  *   **Table Tents (6):** "Definition Committee Alpha" through "Foxtrot."
  *   **Role Cards (30 total, 5 per table):** 5 distinct roles (see below).
  *   **Definition Slips (30):** Small strips of paper for Round 1.
  *   **Specimen Deck (6 sets of 12 cards):** 72 cards total. (See Section 3).
  *   **Verdict Sheets (6):** One per table, listing the 12 specimens with columns for "Verdict (In/Out)" and "Role Conflict Notes."
  *   **Mission Budget Ledger (1 per table):** Starts at 100 Credits.
  *   **Challenge Tokens (18):** 3 per table (physical stand-ins for launching a challenge).

  **Prep Time:** ~45 minutes. Print specimen cards on cardstock if possible. Cut slips.

  ---

  ## 2. Timeline & Rules (75 Minutes)

  **0:00–0:05 | Setup & Roles**
  *   Hand out Role Cards. Students read silently.
  *   **Rule:** You are a committee, but your *job* depends on your role. If the table consensus hurts your specific job, you must note it as a "Conflict."
  *   Hand out Budget Ledger (Start: 100 Credits).

  **0:05–0:15 | Round 1: The Operational Definition**
  *   **Task:** Write a single paragraph defining "Life" for this mission.
  *   **Constraint:** It must be operational (a robot or lawyer could use it). No "I know it when I see it."
  *   **Action:** Write on Definition Slip. Seal in envelope/hand to Instructor. **No changes allowed after this.**
  *   **Cost:** Free.

  **0:15–0:35 | Round 2: The Specimen Gauntlet**
  *   **Task:** Instructor distributes Specimen Decks. Tables go through cards 1–12 in order.
  *   **Action:** For each card, vote **IN (Life)** or **OUT (Non-Life)** based *strictly* on your sealed definition. Record verdict.
  *   **Constraint:** If your definition says "No" but the table feels "Yes," you must still vote "No" OR mark it as an **Inconsistency**.
  *   **Scoring:**
      *   Consistent Verdict: 0 Cost.
      *   Inconsistency (Verdict contradicts your own definition): -5 Credits per card.
      *   Role Conflict (A member notes their job is compromised by the verdict): -2 Credits per conflict (simulates internal friction).

  **0:35–0:55 | Round 3: Challenge & Amendment**
  *   **Task:** Tables swap Verdict Sheets with another table.
  *   **Action:** Review their verdicts against *their* definition.
      *   **Challenge:** If you find an Inconsistency they missed, play a Token. You gain +10 Credits; they lose -10.
      *   **Amendment:** If a table realizes their definition is broken, they may amend it. **Cost:** -10 Credits per amendment. (This is expensive to discourage lazy rewriting).
  *   **Instructor Role:** I hold the "Master Key." If a table is stuck, they can appeal to me. I will rule strictly. Cost: -5 Credits.

  **0:55–1:15 | Debrief**
  *   Full class discussion (see Section 6).

  ---

  ## 3. The Specimen Deck (12 Cards)
  *Print 6 copies of this set. Order is critical.*

  **01. The Human Explorer**
  Multicellular organism. Maintains internal temperature. Consumes organic compounds for energy. Contains DNA. Reproduces sexually. Responds to stimuli. Bounded by skin.
  **Verdict:** ___

  **02. The Soil Bacterium**
  Single cell. Bounded by membrane. Takes in nutrients from environment. Converts chemicals to energy. Contains DNA. Divides into two copies. Responds to chemical gradients.
  **Verdict:** ___

  **03. The Mule**
  Multicellular animal. Eats, breathes, moves, heals wounds. Contains DNA. Healthy metabolism. **Cannot reproduce** due to hybrid genetics (horse/donkey cross). Part of a breeding population (horses/donkeys).
  **Verdict:** ___

  **04. The Desert Seed**
  Plant embryo in hard shell. **Zero metabolic activity** detectable. No energy use. No growth. Can remain this way for decades. If watered, resumes metabolism and grows. Contains DNA.
  **Verdict:** ___

  **05. The Giant Virus**
  Visible under light microscope. Larger than some bacteria. Contains DNA. **Cannot make proteins on its own**; must hijack a host cell's machinery to replicate. No cell membrane. Infects amoebas.
  **Verdict:** ___

  **06. The Trapped Symbiont**
  Single bacterium living inside insect cells. Has cell membrane. Uses energy. Contains DNA. **Genome is stripped;** lacks genes to make essential nutrients. **Cannot survive or reproduce outside the host cell.**
  **Verdict:** ___

  **07. The Growing Crystal**
  Solid structure in liquid solution. **Grows** by adding layers of minerals. If "seeded" with a defect, new growth copies the defect pattern (heredity). Uses energy from solution chemistry. No DNA. No boundary membrane.
  **Verdict:** ___

  **08. The Flame**
  Consumes fuel (wood/gas). **Grows** in size. Moves. Releases heat/energy. Spreads to new fuel sources. "Dies" if fuel is removed. No boundary. No DNA. No cells.
  **Verdict:** ___

  **09. The Prion**
  Misfolded protein molecule. **No DNA or RNA.** Enters a host, touches normal proteins, and causes them to misfold into copies of itself (replication). Causes disease. No metabolism. No boundary.
  **Verdict:** ___

  **10. The Viroid**
  Circular strand of RNA (few hundred bases). **No protein coat.** Enters plant cells. Uses host enzymes to copy itself. Causes plant disease. No metabolism of its own. No boundary.
  **Verdict:** ___

  **11. The Digital Organism**
  Code running on a server. **Self-replicates** with mutations. Competes for memory space (resources). "Dies" if deleted. Evolves over generations via selection. No physical body. No chemistry.
  **Verdict:** ___

  **12. The Protocell (Obscure)**
  Lab-made sphere of fatty acids (lipids). **Bounded.** Grows by absorbing lipids from solution. **Divides** when physically stressed. Encapsulates RNA. **No metabolism.** No replication of the RNA inside yet.
  **Verdict:** ___

  ---

  ## 4. Role Cards (5 per Table)
  *Cut and distribute randomly.*

  **ROLE: Instrument Engineer**
  **Stake:** Battery Life & Bandwidth.
  Your detector uses huge power to flag "Life." Every False Positive (calling non-life "Life") drains the mission budget and risks missing real data later.
  **Goal:** Minimize False Positives. You prefer strict definitions.
  **Conflict:** If the table votes "Life" on something ambiguous (like Fire), note a Conflict.

  **ROLE: Planetary Protection Officer**
  **Stake:** Contamination Risk.
  If you bring something back that is "Alive," it might infect Earth. If you leave something "Alive" behind, you might contaminate the planet.
  **Goal:** Minimize False Negatives. You prefer broad definitions. Better safe than sorry.
  **Conflict:** If the table votes "Non-Life" on something risky (like a Virus), note a Conflict.

  **ROLE: Medical Lead**
  **Stake:** Treatability.
  You need to know if the entity has metabolism. If it has metabolism, we can poison it. If it doesn't (like a crystal), standard biocides won't work.
  **Goal:** Distinguish based on chemistry/metabolism.
  **Conflict:** If the definition ignores metabolism (e.g., includes Crystals), note a Conflict.

  **ROLE: Ethics Officer**
  **Stake:** Moral Status.
  If it is "Alive," destroying it might be murder. If it is "Non-Life," it is just a rock. You worry about entities that feel pain or have lineage.
  **Goal:** Protect potential lineages.
  **Conflict:** If the table excludes something that evolves (like Digital Life), note a Conflict.

  **ROLE: Mission Commander**
  **Stake:** Budget & PR.
  You break ties. You care about the Credit Score. If the team amends the definition too often, the public loses trust in the science.
  **Goal:** Consistency and High Score.
  **Conflict:** If the team amends the definition more than once, note a Conflict.

  ---

  ## 5. Troubleshooting: What Will Go Wrong

  **Problem 1: The "Cell/DNA" Cruise**
  *   **What happens:** A table writes "Made of cells and has DNA." They breeze through Cards 1-4, fail on 5-12, and just mark them all "Non-Life" without arguing.
  *   **Why:** They are prioritizing consistency over intuition.
  *   **Fix:** During Round 3 Challenges, if a table marked the Giant Virus (Card 5) as "Non-Life," challenge them on the *consequences*. Ask the Planetary Protection Officer: "If this isn't life, you won't quarantine it. Are you sure?" Force the Role Conflict cost. Make them pay for the simplicity.

  **Problem 2: The "Amend Everything" Strategy**
  *   **What happens:** A table realizes their definition is broken at Card 5, so they amend it. Then again at Card 8. They treat the definition as a draft.
  *   **Why:** They don't feel the cost.
  *   **Fix:** Enforce the -10 Credit penalty ruthlessly. Announce at minute 20: "Amendments are now -20 Credits." Make instability painful.

  **Problem 3: Silence/Disengagement**
  *   **What happens:** One student does all the writing; others watch.
  *   **Why:** Group dynamics.
  *   **Fix:** The Role Cards are your lever. In Round 2, require the *Medical Lead* to speak first on Card 9 (Prion), and the *Engineer* to speak first on Card 8 (Fire). Assign speaking order by Role for specific cards.

  ---

  ## 6. The Debrief (20 Minutes)
  *Do not lecture. Ask questions. Let them feel the frustration first.*

  **Phase 1: The Scoreboard (5 mins)**
  *   Ask: "Which table has the most Credits?"
  *   Ask: "Who had to amend their definition? How did that feel?"
  *   **Point:** It feels like failure, but it's actually data. The instability *is* the lesson.

  **Phase 2: The Conceptual Map (10 mins)**
  *   **Circularity:** "Did anyone define life as 'capable of evolution' or 'reproduction'?" (Likely yes).
      *   *Ask:* "But to evolve, you need heredity. To have heredity, you need... life? Did we define the word using the word?"
      *   *Concept:* **Circularity in Evolution-Based Definitions.** (Write on board).
  *   **Cluster vs. Checklist:** "Did anyone find that a specimen had *most* features but not all?" (e.g., Mule has metabolism but no reproduction).
      *   *Ask:* "Is 'Alive' a box you check off, or a cluster of features where some matter more than others?"
      *   *Concept:* **Cluster Concepts vs. Necessary/Sufficient Conditions.**
  *   **State vs. Capacity:** "The Seed (Card 4). Is it alive *now* while dormant? Or only potentially alive?"
      *   *Ask:* "If I freeze you, are you dead? If 'Life' is a process, can it pause?"
      *   *Concept:* **Current Capacity vs. Historical Lineage.**
  *   **Job-Relativity:** "Did the Engineer and the Protection Officer want different things from the *same* Virus?"
      *   *Ask:* "Does the definition of life depend on what you need to *do* with it?"
      *   *Concept:* **Operationalism / Pragmatism.**

  **Phase 3: The Hard Truth (5 mins)**
  *   **Ask:** "Is there a fact of the matter? Is the Virus *really* alive or not, and we just can't find it? Or is 'Life' just a word we use for convenience?"
  *   **Instructor Note:** Be honest here. "Science often pretends categories are natural (like 'metal' vs 'plastic'). But 'Life' might be more like 'Weed.' A weed isn't a botanical category; it's a plant *in a place you don't want it.* 'Life' might be a substance *in a context you care about.*"
  *   **Closing:** "Next week, we assume there IS a fact of the matter and go look for it. Today, we learned why that's hard."

  ---

  ## 7. Instructor's Note: What This Activity Can't Do

  **The Limitation:**
  This activity successfully demonstrates the **operational failure** of definitions (engineering problem). It shows that criteria leak. However, it cannot fully reproduce the **ontological anxiety** (metaphysical problem).

  Students will likely leave thinking, "We just need a smarter definition," or "It depends on the job." They will experience this as a regulatory puzzle solvable by better wording or context. They will *not* necessarily feel the deeper philosophical worry: that there may be no "fact of the matter" independent of human interest. The game mechanics (Credits, Verdicts) reinforce the idea that a correct answer *exists* and is being scored, even if the score is low.

  **How to Bridge the Gap:**
  You must supply this by hand in the final 5 minutes of the debrief.
  1.  **Stop the Scoring:** Explicitly declare the Credits meaningless. "The budget is fake. The real cost is conceptual."
  2.  **The "Weed" Analogy:** Use the analogy above. A dandelion in a garden is a weed; in a meadow, it's flora. The plant didn't change; our interest did. Ask: "Is 'Life' the dandelion, or is it the 'weed'?"
  3.  **The Silence:** After asking "Is the Virus *really* alive?", wait a full 10 seconds. Do not answer. Let the silence indicate that *you* don't have the answer either. If you provide a clean wrap-up, you validate the engineering mindset. The discomfort *is* the learning outcome.
