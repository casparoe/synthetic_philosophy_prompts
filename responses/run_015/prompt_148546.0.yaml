answer: |-
  Here is a pedagogical plan designed specifically for students transitioning from formal logic to ordinary language philosophy.

  ### 1. The Dependency Order: Games First, Resemblance Second

  **Do not start with Family Resemblance.**

  *   **Why:** If you start with Family Resemblance, logic students will treat it as a *semantic theory* about concepts (i.e., "How do we define 'Game'?"). They will try to formalize the overlapping features, missing the point entirely.
  *   **The Sequence:**
      1.  **Language Games:** Establish that meaning is *use* within a context, not a mapping between word and object. This breaks their logic habit of looking for truth-conditions.
      2.  **Family Resemblance:** Once they accept that language is a toolkit of varied activities, introduce Family Resemblance to explain how we categorize those activities without essential definitions.
  *   **The Logic:** Language Games creates the *problem* (the diversity of use makes N&S conditions impossible); Family Resemblance offers the *solution* (we categorize via overlapping similarities, not essences).

  ### 2. The Carrying Example: "Making a Promise"

  Avoid "Games" (too meta) and avoid "Maps" (lacks normativity). Use **"Making a Promise."**

  *   **Why this example?**
      *   **Logic Clash:** In logic, propositions are True/False. Promises are Kept/Broken. This immediately forces a shift from *truth-conditions* to *normative conditions*.
      *   **Normative Bite:** It counters the misconception that language games are just "social habits." You can be *wrong* in a promise.
      *   **Resemblance Structure:** There is no single necessary feature shared by all promises.
  *   **What the example must HAVE:**
      *   **Normativity:** Cases where a promise is clearly broken (e.g., "I promise to pay" vs. "I promise to love").
      *   **Diversity:** A legal contract, a vow to a dying friend, a casual "I promise I'll call," and a threat ("I promise I'll get you").
  *   **What the example must LACK:**
      *   **A Single Physical Act:** Some are spoken, some written, some implied by silence.
      *   **A Single Consequence:** Some incur legal debt, some incur guilt, some incur nothing.

  ### 3. Session Sequence & Misconception Management

  **Part 1: The Logic Trap (10 mins)**
  *   **Activity:** Ask students to write down the Necessary and Sufficient conditions for "A Promise."
  *   **The Trap:** They will suggest: "Spoken words," "Intent," "Future action."
  *   **The Counter:** Show counter-examples.
      *   *Silent promise:* Nodding to a dying parent (No spoken words).
      *   *Joke:* "I promise to kill you" in a play (Intent is fiction).
      *   *Coercion:* "Promise or I shoot" (Intent is absent, but is it a promise?).
  *   **Goal:** Induce frustration with the N&S model.

  **Part 2: Language Games & Normativity (20 mins)**
  *   **Concept:** Introduce Language Games not as "fun activities" but as **rule-governed practices**.
  *   **Misconception Alert:** *"Language games are just social conventions with no normative bite."*
  *   **Intervention Point:** Immediately after introducing the "Promise" game.
      *   **Say:** "If language were just convention, breaking a promise would be like wearing socks with sandals—odd, but not 'incorrect.' But breaking a promise is a *failure* within the game."
      *   **Task:** Ask: "In the 'Legal Contract' game, what counts as a move? In the 'Dying Wish' game, what counts as a move?"
      *   **Takeaway:** The *rules* of the game determine correctness, not the external world. This preserves normativity without essences.

  **Part 3: Family Resemblance (20 mins)**
  *   **Concept:** Now that they see "Promise" covers diverse activities, how do we recognize them all as "Promises"?
  *   **Misconception Alert:** *"Family Resemblance just means fuzzy boundaries/vagueness."*
  *   **Intervention Point:** When explaining the overlapping features.
      *   **Say:** "Wittgenstein isn't saying the concept is blurry. He's saying it's a **rope**. No single fiber runs the whole length, but the rope is solid."
      *   **Visual Aid:** Do not use a Venn Diagram (implies sets). Use a **Chain Link** or **Thread** diagram.
      *   **Crucial Distinction:** Vagueness implies we *should* be able to draw a line but can't. Family Resemblance implies drawing a line is the *wrong tool* for the job.
      *   **Task:** Have them draw the "threads" connecting the Legal Contract to the Dying Wish. (e.g., Thread A: Obligation; Thread B: Expectation; Thread C: Verbal formula). Show that Legal has A&B, Dying has B&C, etc.

  **Part 4: Assessment & Application (15 mins)**
  *   **Goal:** Check they aren't just repeating "There are no essences."
  *   **The Diagnostic Task:** Give them a new concept: **"A University."**
  *   **Bad Answer:** "There is no definition of a university, it's fuzzy." (This is the logic student giving up).
  *   **Good Answer:** "We can't define it by N&S conditions (buildings? degrees? online?). But we can trace the resemblances: research, teaching, credentialing, community. We can also identify the 'rules' of the university language game (e.g., what counts as 'passing' vs. 'failing')."
  *   **Evaluation Criteria:** Look for students who identify *rules* (normativity) and *overlaps* (resemblance) rather than just claiming "ambiguity."

  ### 4. Scope Limitations: What to Explicitly Exclude

  First-years often read the SEP or Wikipedia before class and get overwhelmed. Be transparent about what you are bracketing to keep the lesson focused.

  **Openly state:**
  > "Today we are focusing on the **Public Use** of language. We are explicitly leaving out two major Wittgensteinian topics that you will encounter later in the course:"

  1.  **The Private Language Argument:**
      *   *Why exclude:* It requires understanding the rule-following paradox first. If you introduce it now, students will conflate "Language Games" with "Public vs. Private."
      *   *What to say:* "We are treating language as public practice. Whether a 'private' language is possible is a separate argument about memory and criteria we will tackle in Week 6."
  2.  **"Forms of Life" (*Lebensform*):**
      *   *Why exclude:* It is anthropological and often mystified by students as "culture." It risks turning Language Games into relativism ("Your game, my game, both valid").
      *   *What to say:* "When we talk about games, we aren't talking about cultural preferences. We are talking about the bedrock of agreement in judgments that makes communication possible. We will unpack 'Forms of Life' when we discuss skepticism."

  ### 5. Summary Checklist for the TA

  *   [ ] **Hook:** Start with the failed N&S definition of "Promise."
  *   [ ] **Shift:** Move from "What does this word mean?" to "What are we *doing* with this word?"
  *   [ ] **Normativity:** Ensure they understand rules allow for *mistakes*, not just differences.
  *   [ ] **Resemblance:** Use the "Thread/Rope" analogy, not "Blurry Photo."
  *   [ ] **Assessment:** Test on "University" or "Art," not "Games."
  *   [ ] **Boundaries:** Explicitly bracket Private Language and Forms of Life.

  This plan respects their logical training by showing *why* it fails in this context, rather than asking them to abandon rigor. It replaces the rigor of *definition* with the rigor of *rule-analysis*.
