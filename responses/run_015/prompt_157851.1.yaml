      *   **Where the "Shadow Index" Breaks Down:**
          *   *The Paradox:* If the Shadow Index is about the power of *absence*, why did people fight for *presence* (the files)?
          *   *Reason 1:* The files prove harm. Absence is gaslighting; presence is evidence.
          *   *Reason 2:* The Stasi's goal was total presence. A "Shadow Index" implies the Stasi failed. But the citizens know the Stasi *succeeded* enough to hurt them.
          *   *Reason 3:* The "Shadow Index" might actually be the *destroyed* files. The ones the citizens *didn't* save.
          *   *Reason 4:* The concept assumes absence is the ultimate erasure. But in a surveillance state, *presence* in the file is the erasure of the human (reduction to data). So saving the file saves the data, not necessarily the human.

  5.  **Drafting the Conceptual Map (Iterative Process):**

      *   *Introduction:* Acknowledge the tension. The "Shadow Index" is a powerful literary device but clashes with the specific historical reality of the Stasi files.
      *   *Section 1: The Economy of Survival (Who Decides).* Contrast the Bureaucrat's Shredder vs. The Citizen's Hand. The Shredder creates the Shadow Index (active erasure). The Citizen stops it (forcing visibility).
      *   *Section 2: The Trap of Preservation (Reclaiming vs. Cementing).* If I save the file, I save the Stasi's definition of me. I validate their taxonomy. But without it, I have no proof. It's a "poisoned chalice."
