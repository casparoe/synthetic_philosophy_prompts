      *   *Focus:* Keep it tight. No fluff.
      *   *Tone Check:* Ensure it sounds like a conceptual map for a writer, not a history lecture. Use terms like "ontology," "epistemology," "gaze."

  7.  **Final Polish:** Check against constraints. No citations? Check. Tight mapping? Check. Address the specific contradiction (fighting for surveillance papers)? Check.

