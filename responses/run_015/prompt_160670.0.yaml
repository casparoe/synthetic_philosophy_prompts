answer: |-
  ### Take-Home Exam: Consequentialism and Decision Theory
  **Time Allowed:** 2 Hours
  **Total Marks:** 20

  **Question 1: The Problem of Systematic Drift**

  Act Consequentialism requires agents to choose the action that maximizes expected moral value. A standard objection is "Cluelessness": because long-run consequences are complex and unknowable, agents cannot calculate expected values with sufficient precision to guide action. A common reply is that while we lack precision, our errors are random; thus, over a lifetime of choices, errors will cancel out, or we can use predictable near-term effects as a tiebreaker when long-term effects are opaque.

  Consider a specific variation of this problem called **Drift**.
  **Drift** is defined as follows: An agent's estimates of moral value are not merely noisy (randomly distributed around the truth) but are *systematically biased* toward effects that are vivid, near-term, and legible, and away from diffuse, long-term effects. Furthermore, the agent cannot detect this bias from the inside. Their introspection feels neutral, and because they only observe the outcome of the action they chose (never the counterfactual outcome of the action they rejected), they receive no feedback signal to correct the bias.

  Write an essay evaluating whether **Drift** undermines Act Consequentialism more severely than standard Cluelessness. In your answer, you must address the following:

  1.  Distinguish between knowing the *sign* of a value difference (which option is better) and the *magnitude* (how much better). Which does consequentialism require, and does Drift threaten one more than the other?
  2.  Explain why the standard replies (near-term tiebreakers and error cancellation over a life) fail specifically under the Drift hypothesis.
  3.  Evaluate whether shifting to a process-level solution (e.g., following rules or deferring to institutions) solves the problem, or merely generates a regress.
  4.  Compare the severity of Drift for consequentialism versus a moral theory based on side-constraints (which forbids certain actions regardless of consequences). Does the comparison favor consequentialism?
  5.  Discuss the epistemic status of Drift: If an agent cannot detect Drift introspectively, is the hypothesis unfalsifiable and therefore philosophically idle?

  *Note: You are not expected to cite specific authors or papers. Define any technical terms you use. Your answer should be self-contained.*

  ***

  ### Model Answer

  Act Consequentialism demands that agents maximize expected moral value. Standard Cluelessness argues that agents lack the evidence to calculate this value. The "Drift" hypothesis strengthens this objection by claiming our estimates are not just imprecise, but systematically skewed toward the vivid and near-term. To evaluate whether Drift is more damaging than standard Cluelessness, we must analyze the decision-theoretic requirements of maximization and the statistical properties of the error.

  First, we must distinguish between the **sign** and the **magnitude** of a value difference. Magnitude refers to the size of the difference in expected value between two actions; sign refers to the direction (i.e., whether Action A yields more value than Action B). Strict maximization requires knowing the sign: one must simply choose the better option, even if one does not know by how much. Standard Cluelessness (random noise) threatens magnitude more than sign. If errors are random, they distribute evenly around the true value; with enough data, the sign usually remains recoverable. Drift, however, threatens the sign. Because the bias is systematic (always pulling toward the vivid), it shifts the mean of the estimate away from the truth. If the true value difference is small, a systematic bias can easily flip the sign, causing the agent to confidently choose the worse option. Thus, Drift is structurally more dangerous because it corrupts the binary choice mechanism itself, not just the precision of the calculation.

  This systematic nature explains why standard replies fail. The "near-term tiebreaker" strategy suggests using legible short-term effects to decide when long-term effects are unclear. This assumes near-term effects are a neutral proxy for total value. Under Drift, they are not; they are the *source* of the bias. Relying on them amplifies the error rather than resolving it. Similarly, the "errors cancel out" reply relies on the Law of Large Numbers, which states that the average of independent random variables converges to the expected value. This requires errors to be independent and identically distributed. Drift creates **correlated errors**: every decision is skewed in the same direction (toward the vivid). Correlated errors do not cancel; they accumulate. Over a lifetime, a drifting agent does not converge on the truth; they diverge further from it.

  Consequentialists might respond by shifting from act-evaluation to **process-evaluation**. Instead of asking "Which act maximizes value?", the agent asks "Which decision-process (e.g., following rules, deferring to committees) maximizes value?" This might mitigate Drift if the process incorporates diverse perspectives that cancel individual biases. However, this risks a **regress**. Selecting the best process is itself a choice made under conditions of Drift. If the agent's estimate of which process is best is also skewed toward vivid, immediate institutional features, they may select a flawed process. To avoid regress, one must argue that some processes are robustly superior in ways that are legible even to a drifting agent (e.g., "diversity reduces correlation"), or accept a form of Rule Consequentialism where the rules are fixed by ideal agents, not the drifting individual.

  How does this compare to a theory of **side-constraints** (deontology), which forbids actions violating rights regardless of consequences? Side-constraint views avoid Drift regarding forbidden actions because they do not require magnitude comparisons; the constraint is binary. However, this advantage comes at a cost: insensitivity to stakes. If Drift makes consequentialist calculations unreliable, side-constraints offer stability, but they may forbid actions that prevent catastrophic losses because they cannot weigh the magnitude of the disaster. Drift makes consequentialism risky, but side-constraints make it blind. Given that moral choices often involve trade-offs between competing values where stakes vary wildly, a theory that cannot respond to stakes (due to fear of Drift) may yield worse outcomes than a theory that tries to calculate despite the risk. Therefore, the comparison does not clearly favor side-constraints; it merely trades calculation error for rigidity.

  Finally, is Drift unfalsifiable? If an agent cannot detect the bias introspectively, claiming it exists might seem idle. However, falsifiability does not require first-person access. Drift generates third-person predictions: a drifting agent will systematically prefer vivid options over abstract ones, even when they claim neutrality. We can test this by observing patterns in choices or by simulating decisions where the "vivid" option is known to be inferior. If the pattern holds, the hypothesis is empirical, not metaphysical. Dismissing it as idle begs the question by assuming that if a bias were present, the agent would feel it. The core of Drift is that the bias is invisible to the host.

  In conclusion, Drift is more severe than standard Cluelessness because it converts random noise into systematic error. This corrupts the sign of value differences, invalidates error-cancellation replies, and complicates process-level solutions. While alternative theories avoid calculation errors, they lose the ability to respond to stakes. The problem is not unsolvable, but it requires acknowledging that individual intuition is a compromised instrument.

  ***

  ### Marking Scheme (20 Marks Total)

  **1. Sign vs. Magnitude Distinction (4 Marks)**
  *   **Full Marks:** Clearly defines sign (direction) and magnitude (size). Argues consequentialism minimally requires sign. Explains that random error preserves sign on average, while systematic Drift flips sign.
  *   **Common Error:** Treats sign and magnitude as the same problem, or claims consequentialism requires precise magnitude for all choices.

  **2. Failure of Standard Replies (4 Marks)**
  *   **Full Marks:** Explains that near-term tiebreakers fail because the near-term is the *source* of the bias. Explains that error cancellation fails because Drift creates *correlated* rather than independent errors (Law of Large Numbers does not apply).
  *   **Common Error:** Argues errors still cancel out "eventually," or misses the correlation point entirely.

  **3. Process Solutions and Regress (4 Marks)**
  *   **Full Marks:** Identifies the shift to process/rules. Raises the regress objection (choosing the process is subject to Drift). Offers a nuanced view on whether diversity/institutions can break the correlation.
  *   **Common Error:** Assumes rules solve the problem automatically without addressing how the rules are selected.

  **4. Comparison to Side-Constraints (4 Marks)**
  *   **Full Marks:** Acknowledges side-constraints avoid magnitude comparisons (immune to Drift on forbidden acts) but notes they become insensitive to stakes. Weighs calculation risk against rigidity.
  *   **Common Error:** Simply lists deontology as "better" because it doesn't calculate, without addressing the cost of ignoring consequences.

  **5. Epistemic Status/Falsifiability (4 Marks)**
  *   **Full Marks:** Argues Drift is testable via third-person observation of choice patterns, not just introspection. Rejects the "idle" objection.
  *   **Common Error:** Claims Drift is unfalsifiable because the agent can't feel it, or dismisses the objection as purely skeptical.

  **Distinguishing an A from a B:**
  *   **B Grade:** The student identifies that Drift is a "bias" and says bias is bad. They argue that errors might not cancel out but treat this as a matter of degree (more error vs. less error).
  *   **A Grade:** The student identifies the **statistical crux**: Drift changes the error structure from *independent* to *correlated*. They explicitly state that the Law of Large Numbers requires independence, and without it, the "errors wash out" defense is mathematically invalid, not just optimistic. This specific move demonstrates command of the decision-theory prerequisites.
