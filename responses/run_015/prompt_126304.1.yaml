  # Taxonomy of Colony Consciousness: The Ant Fugue Decision Tree

  **Root Question:** Can distributed, non-neuronal biological systems satisfy conditions for consciousness at all?

  *   **NO** → Proceed to **Node 1**.
  *   **YES** → Proceed to **Node 2**.

  ---

  ### Node 1 (Scenario iii)
  **Question:** If pheromone trails systematically misrepresent food location yet the colony eventually corrects the error, does the colony possess representational content with a truth-condition?

  *   **NO** → **Leaf A: Reductionism or Eliminativism**
      *   *Position:* Mental properties apply only to individual ants (or are denied altogether); colony behavior is purely mechanical causation.
      *   *Awkward Commitment:* This view must explain complex, adaptive problem-solving as the aggregate of mindless reflexes without attributing any goal-directedness to the system that actually achieves the goal.
  *   **YES** → **Leaf B: Functionalism**
      *   *Position:* The colony possesses cognition, intentionality, and functional organization equivalent to a mind, but lacks phenomenal consciousness (there is "nothing it is like" to be the colony).
      *   *Awkward Commitment:* This view must assert that the colony holds beliefs and desires and acts on them, while simultaneously denying that the system experiences any satisfaction upon success or frustration upon failure.

  *(**Flagged Ambiguity:** Leaves A and B are not cleanly separated by this question alone, as the distinction between "causal tracking" and "representational content" is often merely terminological; a Reductionist might admit truth-conditional language as a useful fiction while a Functionalist treats it as literal, yielding identical answers to the diagnostic.)*

  ---

  ### Node 2 (Scenario i)
  **Question:** If a colony retains a learned maze-route after ninety-five percent of its workers have died and been replaced, does that preserve one persisting mind?

  *   **NO** → **Leaf C: The Unoccupied Combination**
      *   *Position:* Phenomenal consciousness exists at the colony level, but integrated functional organization (memory/identity) does not persist over time.
      *   *Awkward Commitment:* This view posits a subject that can feel pain or pleasure in the moment but lacks the functional continuity to learn from those feelings or recognize itself as the same entity tomorrow.
  *   **YES** → Proceed to **Node 3**.

  ---

  ### Node 3 (Scenario ii)
  **Question:** If a physical barrier splits the colony and the two halves pursue incompatible foraging goals for days, is this one mind with conflicting intentions?

  *   **NO** → Proceed to **Node 4**.
  *   **YES** → Proceed to **Node 4**.

  *(Note: Both branches lead to Node 4 to assess architectural dependency, but the "NO" branch indicates physical boundary dependence, while the "YES" branch indicates potential boundary independence.)*

  ---

  ### Node 4 (Scenario iv)
  **Question:** If the queen is removed and the colony collapses into disordered behavior within weeks, is the queen a central organizing hub analogous to a brain whose loss kills a subject?

  *   **YES** → **Leaf D: Strong Boundary-Dependent Emergentism**
      *   *Position:* The colony is a unified conscious subject only when physically unified or when specific centralizing components (like the queen) remain intact.
      *   *Awkward Commitment:* This view must treat the mass death of workers as analogous to neuronal turnover without phenomenology, yet treat the loss of the queen or physical fission as the literal death of the subject.
  *   **NO** → **Leaf E: Boundary-Independent Emergentism**
      *   *Position:* The colony is a unified conscious subject constituted by the informational pattern, which can survive physical fission and the loss of specific central nodes.
      *   *Awkward Commitment:* This view must accept that a single subject can simultaneously inhabit disjoint physical bodies pursuing incompatible goals without experiencing this as dissociation or a split in personal identity.

  *(**Flagged Ambiguity:** Leaf D aggregates two distinct rationales: dependence on physical continuity (from Node 3) and dependence on architectural centrality (from Node 4). The taxonomy does not cleanly separate a theorist who believes the mind dies on fission from one who believes it survives fission but dies if the queen is removed, as both land on Strong Boundary-Dependent Emergentism.)*
