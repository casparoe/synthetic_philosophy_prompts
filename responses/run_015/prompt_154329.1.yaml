prompt: |-
  Write a joke that turns on John Maynard Keynes's 1930 essay Economic Possibilities for our Grandchildren, specifically his claim that once absolute economic needs are satisfied, humanity faces the far harder problem of using freedom wisely, and that relative needs—those whose satisfaction depends on feeling superior to others—remain genuinely insatiable in a way absolute needs do not. The punchline should depend on this actual structure, particularly on Keynes's worry that people, having solved scarcity, would still pursue money and status out of habit rather than purpose, not on a generic caricature of economists ignoring human nature. Please state how confident you are that the joke captures Keynes's argument rather than a popular misreading, and identify the specific point about which you are least sure.
reasoning: |-
