  2.  **Deconstruct Keynes's Argument (Mental Sandbox):**
      *   Keynes predicted that by 2030 (roughly), technology and capital would solve the "economic problem" (scarcity). We'd only need to work 15 hours a week.
      *   He distinguished between *absolute needs* (food, shelter, warmth) and *relative needs* (being richer than the Joneses).
      *   He argued absolute needs have a limit. Relative needs do not.
      *   His fear wasn't that we *couldn't* stop working, but that we *wouldn't* know how to live leisurely. We are bred to strive, not to enjoy.
      *   "The love of money as a possession—as distinguished from the love of money as a means to the enjoyments and realities of life—will be recognised for what it is, a somewhat disgusting morbidity, one of those semi-criminal, semi-pathological propensities which one hands over with a shudder to the specialists in mental disease." (Famous quote).
      *   But until then, we will pretend money is still the goal out of habit.

