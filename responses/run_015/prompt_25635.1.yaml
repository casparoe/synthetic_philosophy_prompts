answer: |-
  You have put your finger on one of the most persistent and contentious issues in the philosophy of biology. You are absolutely correct that this sliding occurs, that it does argumentative work, and that it is often unconscious.

  While there isn't a single, catchy Latin name for this specific fallacy (like *ad hominem*), it is a well-documented phenomenon. In the philosophy of biology, it is most rigorously described as **the conflation of causal and semantic information.**

  However, to capture the *rhetorical* dynamic you described (borrowing prestige from one sense while retreating to the safety of the other), the best label is an **Unconscious Motte-and-Bailey.**

  Here is a breakdown of the terminology, the philosophical context, and how to distinguish it from related concepts.

  ### 1. The Technical Distinction: Causal vs. Semantic Information
  Philosophers of biology (notably John Maynard Smith, Peter Godfrey-Smith, and Paul Griffiths) distinguish between two senses of "information" that are constantly being blended in popular discourse:

  *   **Causal (or Shannon/Syntactic) Information:** This is the "safe" sense. It refers to physical correlation, specificity, or the reduction of uncertainty. In this sense, a tree ring "contains information" about the past climate, and a DNA sequence "contains information" insofar as its specific arrangement causally influences the amino acid sequence. There is no meaning, no reader, and no intention required.
  *   **Semantic (or Intentional) Information:** This is the "prestige" sense. It implies *aboutness*, truth conditions, and normativity. For information to be semantic, there must be a possibility of it being *false* or an *error* (misinformation). A blueprint has semantic information because it can be wrong about the building.

  **The Pattern:** As you noted, speakers use the *semantic* sense to imply that the organism is "specified" or that a mutation is an "error" (which requires a norm), but when challenged on where the "reader" or "norm" comes from, they retreat to the *causal* sense ("it's just chemistry").

  ### 2. The Rhetorical Structure: The Unconscious Motte-and-Bailey
  You hesitated to call it a **Motte-and-Bailey** because the speakers aren't always aware of the switch. However, in philosophical analysis, Motte-and-Bailey describes the *structure of the argument*, not necessarily the *psychological intent* of the speaker.

  *   **The Bailey (The Controversial Claim):** "DNA contains the instructions/meaning/program for the organism." (Implies semantic information, determinism, agency).
  *   **The Motte (The Defensible Claim):** "DNA is a physical sequence that causally correlates with protein synthesis." (Implies causal information, chemistry).
  *   **The Maneuver:** When criticized for genetic determinism, the speaker retreats to the Motte ("I never said it was a literal instruction!"). When arguing against environmentalists, they occupy the Bailey ("But the information is in the genes!").

  Because this switch is embedded in the language itself (words like "code," "instruction," "error"), it often happens unconsciously. It is a **systemic Motte-and-Bailey** facilitated by metaphor.

  ### 3. Related Philosophical Concepts
  To be precise in your critique, you can layer these specific terms onto the pattern:

  **A. Reification (or Hypostatization)**
  This is the error of treating an abstract concept as a concrete physical thing. By saying information is *in* the DNA (like water in a bucket), speakers reify "information." In reality, information is a relational property between a sequence, a mechanism, and an environment. It isn't a substance that can be located solely in the nucleus.

  **B. The Homunculus Fallacy**
  This addresses your point about "who is the reader?" To say DNA is a "code" implies a decoder. If the cell is the decoder, we must explain how the decoder works. If the decoder *also* uses a code, we need another decoder, leading to an infinite regress (a little man, or *homunculus*, inside the cell reading the map). The slide allows people to imply a reader exists without having to explain the mechanism.

  **C. Cryptic Preformationism**
  Historically, preformationism was the idea that the organism exists fully formed in the sperm/egg, just tiny. Modern genetics officially rejects this. However, by claiming all "information" is in the DNA, speakers smuggle preformationism back in. The organism isn't physically tiny in the gene, but it is *informationally* pre-formed. This is why the slide matters: it resurrects a discredited biological theory under the guise of information theory.

  ### 4. Key Literature and Names
  If you want to reference this in a discussion, these are the authorities who have mapped this terrain:

  *   **Evelyn Fox Keller:** Her book *The Century of the Gene* is the definitive critique of this language. She argues that the "language of information" seduces biologists into thinking they have explained development when they have only described correlation. She calls this **"The Seductiveness of the Informational Metaphor."**
  *   **Susan Oyama:** In *The Ontogeny of Information*, she argues for **Developmental Systems Theory (DST)**. She posits that information is not *in* the genes but is a property of the whole developmental system (genes + environment + context). She describes the error as **"The Informational Conception of the Gene."**
  *   **Peter Godfrey-Smith:** He distinguishes between **"Shannon Information"** and **"Semantic Information"** in biology and analyzes when it is legitimate to use teleological language (like "error" or "function").

  ### 5. Is This Specific to Genetics?
  No, this pattern shows up wherever **functional language** is applied to **non-agential systems**.

  *   **AI/Neural Networks:** People say a neural net "learns" or "knows" (semantic), but when challenged, retreat to "it's just weight adjustments via backpropagation" (causal). Then they turn around and argue the AI has "bias" or "intent" (semantic).
  *   **Economics:** "The market knows best." When challenged, economists say "it's just aggregate price signals" (causal/statistical). But then they argue the market "punishes" bad behavior (semantic/normative).
  *   **Evolutionary Psychology:** "The gene wants to replicate." Retreat: "It's just a metaphor for selection pressure." Advance: "Therefore, human behavior is specified by evolutionary imperatives."

  ### 6. How to Name It
  If you need a label for this pattern in conversation, I recommend:

  1.  **The Causal/Semantic Conflation:** This is the most precise philosophical description.
  2.  **The Informational Motte-and-Bailey:** This best captures the argumentative sleight-of-hand.
  3.  **Reification of Information:** This captures the ontological error.

  ### Summary of the Distinction
  *   **Ordinary Equivocation:** Using "bank" (river) and "bank" (money) in a syllogism. (Usually obvious).
  *   **Dead Metaphor:** Saying "leg of the table." No one thinks the table has biological limbs. (No argumentative work is done).
  *   **Your Pattern (Causal/Semantic Conflation):** The metaphor is *active*. It is used to import normative properties (purpose, error, specification) into a physical description, but the speaker denies the metaphorical status when the normative implications are challenged.

  You are describing a **category mistake** that is protected by **structural ambiguity**. It allows **genetic determinism** to survive by hiding behind **information theory**. Calling it the **"Conflation of Causal and Semantic Information"** will signal to any philosopher of biology that you know exactly what is happening.
