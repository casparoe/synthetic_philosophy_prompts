answer: |-
  In the St. Jude Hospital Pharmacy-and-Therapeutics Committee, Dr. Vance (Pharmacy Director) and Dr. Wu (Chief of Medicine) must jointly select a drug formulary tier, with Vance choosing between Conservative, Moderate, or Aggressive cost-containment levels and Wu choosing between Endorse, Audit-Trigger, or Reject. Institutional bylaws grant Wu a delegated veto right that is not absolute but contingent on an Internal Audit Lottery: if Wu selects Audit-Trigger, an external review occurs with a known probability of 50%, and if triggered, the veto automatically nullifies Vance's selection unless it is defensibly extreme (Conservative or Aggressive), whereas a Moderate selection faces a severe reputational penalty during audit due to ambiguous clinical justification. Vance's payoff depends on budget savings (highest with Aggressive) and audit safety (highest with Conservative), while Wu's payoff relies on patient safety (highest with Conservative) and administrative efficiency (highest with Endorse), creating a tension where Vance's Moderate option yields intermediate budget savings but collapses in expected value when weighed against the 50% audit risk, specifically because the Moderate option lacks the clear defensive documentation required to pass the audit lottery that the Conservative and Aggressive options possess by virtue of their established protocols.

  (1) **Pure-Strategy Iterated Elimination of Strict Dominance (IESD):**
  For Dr. Vance, no pure strategy strictly dominates another. Conservative yields higher payoffs than Aggressive if Wu chooses Audit-Trigger (due to audit safety), but Aggressive yields higher payoffs if Wu chooses Endorse (due to budget savings). Moderate yields higher payoffs than Conservative if Wu chooses Endorse (better budget than Conservative) and higher payoffs than Aggressive if Wu chooses Reject (less friction than Aggressive). Thus, all three of Vance's strategies survive. For Dr. Wu, Reject is strictly dominated by Endorse (Endorse always yields higher efficiency and comparable safety given Vance's rational responses), so Reject is eliminated. After eliminating Reject, no further pure strategies are eliminated for Vance.
  *Survivors:* Vance {Conservative, Moderate, Aggressive}; Wu {Endorse, Audit-Trigger}.

  (2) **Mixed-Strategy Elimination Sequence:**
  When allowing for mixed strategies, Vance's Moderate option is strictly dominated by a mixed strategy randomizing 50% Conservative and 50% Aggressive. Against Wu's Endorse, the mix yields average budget savings equal to Moderate but avoids the specific inefficiencies of the middle tier; against Wu's Audit-Trigger, the mix yields an expected payoff strictly higher than Moderate because the 50% audit probability penalizes Moderate heavily while the extreme options (Conservative/Aggressive) pass the audit defense check. Consequently, Moderate is eliminated. Knowing Vance will not play Moderate, Wu re-evaluates: Audit-Trigger is now strictly dominated by Endorse because the audit mechanism was designed to catch ambiguous Moderate choices, and without Moderate in play, the audit cost outweighs the safety benefit. Wu eliminates Audit-Trigger. Facing only Endorse from Wu, Vance eliminates Conservative (lower budget than Aggressive with no audit risk).
  *Unique Outcome:* Vance plays Aggressive; Wu plays Endorse.

  (3) **Structural Feature Causing Divergence:**
  The divergence arises from the non-linear interaction between the audit-lottery probability weights ($p=0.5$) and the payoff differentials of the extreme strategies. In pure strategies, the payoff function is concave at the Moderate point relative to the opponent's actions (Moderate is a local best-response to specific pure strategies). However, the audit rule introduces a convexity in the expected payoff space: the expected value of the mixture of extremes exceeds the value of the mean (Moderate) because the audit penalty applies disproportionately to the middle option. Pure-strategy elimination fails because it cannot capture the hedging value of randomization against the probabilistic veto, whereas mixed-strategy elimination internalizes the audit probability as a weighting factor that validates the extremes over the average.

  (4) **Verdict and Order Independence:**
  Pure-strategy rationalizability predicts three possible outcomes for Vance (any tier) and two for Wu (Endorse or Audit), leaving the committee deadlocked on the Moderate option. Full (mixed-strategy) rationalizability predicts a unique outcome: Aggressive Formulary with Endorsement. The disadvantage to the Moderate option is not an artifact of elimination ordering because strict dominance (whether pure or mixed) is order-independent; if a strategy is strictly dominated, it remains dominated regardless of the sequence in which other strategies are removed. The failure of pure-strategy rationalizability is structural, stemming from its inability to account for risk-mitigation via randomization inherent in the audit rule.

  (5) **Removing the Veto and Defense of Pure Rationalizability:**
  If the probabilistic veto feature is removed (setting audit probability to 0 or 1), the payoff function becomes linear or purely ordinal without the convex penalty on the middle option. In this collapsed case, Moderate would either be purely dominated or purely dominant, aligning pure and mixed rationalizability verdicts. A defender of pure-strategy rationalizability could argue that importing mixed strategies into committee deliberation is unrealistic because committee members are fiduciary agents prohibited from randomizing decisions via coin flips; they must justify specific choices. Therefore, the broader concept imports an unrealistic degree of strategic randomization, suggesting that the "unique" mixed-strategy outcome is a mathematical artifact rather than a behaviorally plausible prediction for a governance body bound by recorded votes.
