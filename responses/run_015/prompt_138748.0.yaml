      *   The friend's comparison (Portal vs. Heavy Door) fails because it ignores *institutional reinforcement*. The portal is embedded in a bureaucratic system; the door is a physical barrier. Both exclude, but the portal's exclusion is compounded by social structures (work schedules, internet access).
