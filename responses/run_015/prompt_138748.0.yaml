  I reject step (4). It looks sound because it assumes language functions primarily to distinguish subsets; if a label applies to everything, it seemingly fails to carve nature at its joints, rendering criticism impossible. However, this conflates classification with evaluation. Universal properties still admit of variance in degree, mechanism, and consequence. Gravity applies to everything, yet aerodynamics remains a critical field.

  Rejecting (4) commits you to the view that "political" is an ontological condition of artifacts, not a selective tag. You keep (1) and (2), accepting that the overpasses, the school portal, and the heavy door are all political because all durable designs distribute capacity. However, it dismantles your friend's claim that they are political to the "same degree." Universality of category does not imply equality of impact. The critical work shifts from asking *if* an artifact is political to *how* it mediates power.

  Regarding your cases: The overpasses and the portal are political in a high-stakes, institutional sense; they encode policy into matter. The heavy door is political in a low-stakes, physical sense. Both exclude, but the portal's exclusion is compounded by social structures (employment laws, internet infrastructure), whereas the door's is limited to immediate physiology. Rejecting (4) allows you to acknowledge both as political without flattening the distinction between bureaucratic gatekeeping and physical friction. The friend's assertion that they are equal in degree is a non-sequitur; one can be universally political while still being more or less oppressive.

  Regarding unintended effects: Since (1) excludes intent, artifacts whose exclusionary effects were unforeseen remain political. This is a feature, not a bug. It forces designers to account for consequences rather than intentions. Your friend's move to (7) (social salience) attempts to restore a filter, but as he noted, this makes the artifact redundant to the society. By keeping (1) and rejecting (4), you avoid this redundancy. The artifact is not merely a mirror of society; it is a specific mechanism of enforcement. The portal does not just reflect inequality; it actively executes it at 7 p.m.

  Your friend's error is thinking that criticism requires exclusionary categories. It does not. It requires nuanced analysis of universal conditions. You can keep (1), (2), and (5). The thesis is not vacuous; it is foundational. The critical target is not "political artifacts" versus "neutral ones," but "legitimate distributions of power" versus "arbitrary ones."
