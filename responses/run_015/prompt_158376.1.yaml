answer: |-
  Your hypothesis is correct, but it requires a sharper meta-ethical framing to explain why the stalemate persists. The disagreement is not merely about the scope of moral concern (in-group vs. universal); it is a category error regarding the *telos* of morality itself.

  Here is the diagnosis of the impasse, the nature of the disagreement, and the path to progress.

  ### 1. The Diagnosis: A Clash of Moral Ontologies
  The stalemate exists because the two camps are operating with incompatible definitions of what morality *is*. They are not arguing over the same object.

  *   **The Pluralists (Functionalist/Sociological):** For this camp, morality is a **social technology**. Its primary function is group cohesion, cooperation, and stability. If a psychological mechanism (like sanctity or loyalty) successfully binds a group and prevents social entropy, it has "moral" standing. Their normative move is pragmatic: *What works to sustain a society is morally valid.*
  *   **The Debunkers (Rationalist/Universalist):** For this camp, morality is a **justificatory framework**. Its primary function is to adjudicate claims between agents impartially. If a psychological mechanism (like disgust-based sanctity) relies on partiality or irrational aversion, it is a bias, not a moral reason. Their normative move is idealizing: *What can be justified to all rational agents is morally valid.*

  **The Verbal vs. Substantive Split:**
  It is **verbal** in that both sides use the word "moral" to point to different phenomena (cohesion vs. justification). However, it is **substantive** because these phenomena make competing claims on our behavior. A loyalty obligation (Pluralist) often demands partiality that violates a fairness obligation (Debunker). You cannot satisfy both simultaneously.

  **The Bedrock Intuition:**
  Ultimately, this rests on a bedrock disagreement about **partiality**.
  *   Pluralists intuit that morality *must* allow for special obligations (to family, nation, creed) to be meaningful.
  *   Debunkers intuit that morality *begins* where partiality ends (the "view from nowhere").
  No amount of fMRI data or cross-cultural surveying can resolve this, because it is a disagreement about the axioms of ethical life, not the mechanics of ethical cognition.

  ### 2. The Hidden Empirical Question
  You asked if a hidden empirical question is doing the work. There is one, but it is not about *scope* (universal vs. in-group). It is about **malleability and error-correction.**

  *   **The Empirical Crux:** Can "binding" foundations (Loyalty, Authority, Sanctity) be reflexively critiqued and revised by the agents holding them, or are they cognitively encapsulated modules?
  *   **Why it matters:** If conservatives can articulate *reasons* for loyalty that transcend mere tribal signaling (e.g., loyalty as a prerequisite for long-term trust networks), the Pluralist gains ground. If these foundations operate primarily as non-rational heuristics that resist revision even when they cause harm, the Debunker gains ground.
  *   **The Problem:** Current MFT research treats the foundations as static traits. It does not adequately measure the *reflective accessibility* of these foundations. Progress here would require studying not just *what* people value, but *how* they justify those values when challenged.

  ### 3. What Counts as Progress?
  New data on cross-cultural weighting will not move the needle. The descriptive work is done. Progress requires a **reconceptualization of the debate** away from "Which foundations are real?" toward "Which domains of reasoning are appropriate for which problems?"

  **A. Formal Distinction: Social Morality vs. Critical Morality**
  Progress would come from formally distinguishing two layers of moral discourse, a la H.L.A. Hart or Bernard Williams:
  1.  **Social Morality (The Pluralist Domain):** The set of norms, habits, and intuitions that allow a specific community to function. Here, Loyalty and Sanctity are valid *functional* assets.
  2.  **Critical Morality (The Debunker Domain):** The set of principles used to evaluate whether a specific Social Morality is just. Here, Harm and Fairness are the primary *evaluative* metrics.

  **The Synthesis:** The Pluralists are right that you cannot *live* without binding foundations (Social Morality). The Debunkers are right that you cannot *judge* societies without universal constraints (Critical Morality). The stalemate breaks when we admit that MFT describes the *engine* of social life, while normative philosophy provides the *steering*.

  **B. Reconceptualizing "Foundations" as "Tools"**
  Instead of asking if Sanctity is a "moral foundation," ask: *Under what conditions is sanctity reasoning a reliable proxy for harm avoidance, and under what conditions is it a source of error?*
  *   *Example:* Sanctity regarding food safety (evolutionary proxy for harm) vs. Sanctity regarding sexual orientation (cultural proxy for boundary maintenance).
  *   Progress looks like a **contextual map** of foundations, not a hierarchy.

  ### 4. Is the Original Question Ill-Posed?
  **Yes.** The question "Who is right about the normative implications of MFT?" assumes that psychological origins can dictate normative validity.
  *   The Pluralists commit a soft **Naturalistic Fallacy**: Inferring that because a foundation is evolved and widespread, it is normatively binding.
  *   The Debunkers commit a **Idealization Fallacy**: Inferring that because a foundation is partial or emotional, it is normatively irrelevant.

  **The Way Forward:**
  Stop asking whether the conservative foundations are "moral." Ask whether they are **legitimate sources of social obligation within a liberal pluralistic order.**
  This shifts the debate from metaphysics (What is Good?) to political philosophy (How do we live together given that we have different moral matrices?).

  **Conclusion:**
  Your hypothesis about universal constraint vs. in-group coordination is the correct meta-normative fault line. The impasse will not be broken by better psychology, but by better philosophy that acknowledges morality has two jobs: **binding groups** (where Pluralists win) and **protecting individuals** (where Debunkers win). Progress lies in mapping the tension between these jobs, rather than trying to eliminate one in favor of the other.
