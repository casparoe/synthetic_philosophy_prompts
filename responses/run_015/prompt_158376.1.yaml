      *   **The Task:** Provide an *honest diagnosis* (not a survey). Determine if the disagreement is verbal, substantive, empirical, or bedrock intuition. Propose what would count as progress or if the question is ill-posed.

  2.  **Deconstruct the Debate:**
      *   *Moral Foundations Theory (Haidt et al.):* Descriptive psychology. Claims evolved modules. Normative implication often leans towards "wisdom of the ages" or functionalist justification (if it evolved and persists, it serves a function).
      *   *The Debunkers (e.g., Singer, Greene, Kelly):* Often utilitarian or Kantian. View MFT findings as evidence of *bias* (tribalism, disgust sensitivity) that should be overcome by reason.
      *   *The Stalemate:* One side says "Is" implies "Ought" (functionalist/naturalist leanings), the other says "Is" is irrelevant to "Ought" (rationalist/constructivist leanings).

  3.  **Evaluate the User's Hypothesis:**
      *   *Hypothesis:* The fight is about the *function* of morality (Universal Constraint vs. In-group Coordination).
      *   *Assessment:* This is very sharp. It cuts to the meta-ethical core.
          *   If morality is *Universal Constraint*, then Loyalty/Sanctity fail because they are inherently partial/context-dependent.
          *   If morality is *In-group Coordination*, then Loyalty/Sanctity succeed because they bind groups together, even if they aren't universal.
      *   *Verdict:* This is the substantive core, but it's wrapped in verbal confusion about the word "moral."

  4.  **Diagnose the Nature of the Disagreement:**
      *   *Is it Verbal?* Yes, partially. They use "moral" differently. For debunkers, "moral" = "justifiable to all rational agents." For pluralists, "moral" = "what actually motivates binding social groups."
      *   *Is it Substantive?* Yes. It's a clash of meta-ethical frameworks (Naturalism/Functionalism vs. Rationalism/Universalism).
      *   *Is it Empirical?* No. The data is agreed upon. The *interpretation* of the data's normative weight is the issue.
      *   *Is it Bedrock?* Yes, ultimately. It comes down to what one thinks morality *is for*.

  5.  **Formulate the Diagnosis:**
      *   Acknowledge the user's hypothesis is correct but needs refinement. It's not just "function," it's "justificatory scope."
      *   Identify the category error: MFT is a *sociological/psychological* account of cohesion; Debunkers are offering a *philosophical* account of justification. They are talking past each other.
      *   The "Is-Ought" gap is the real wall. Pluralists smuggle "Ought" out of "Is" (evolutionary success = normative value). Debunkers reject this move.

  6.  **Determine What Counts as Progress:**
      *   *Formal Distinction?* Yes. Distinguishing "Ethics of Justice" (Universal) vs. "Ethics of Care/Community" (Particular). Or "Morality as Cooperation" vs. "Morality as Truth."
      *   *Empirical Finding?* Unlikely to solve the normative stalemate. Knowing *how* loyalty works doesn't tell us if we *should* value it universally.
      *   *Reconceptualization?* This is the most promising. Move away from "Who is right?" to "What problem is each solving?"
      *   *Ill-posed Question?* The question "Which foundations are *really* moral?" is ill-posed because "moral" is the contested term.

  7.  **Drafting the Response (Iterative refinement):**
      *   *Tone:* Professional, analytical, philosophical, respecting the user's expertise.
      *   *Structure:*
          1.  Validate the hypothesis (It's accurate).
          2.  Diagnose the disagreement (Verbal + Substantive + Bedrock).
          3.  Address the "Hidden Empirical Question" (Scope).
          4.  Define Progress (Reconceptualization).
          5.  Conclusion on the "Ill-posed" nature.

      *   *Key Insight to Inject:* The debate conflates *functional validity* (does this bind a group?) with *normative validity* (is this binding on all agents?). The Pluralists argue from functional validity; the Debunkers argue from normative validity.
      *   *Refining the "Progress" section:* Suggest shifting from "Foundations" to "Domains of Application." Distinguish between *Social Morality* (coordination) and *Critical Morality* (evaluation).
      *   *Addressing the "Bedrock":* Admit that if one side is a Humean (morality is sentiment) and the other is a Kantian (morality is reason), they won't agree. The progress is in mapping the terrain, not conquering it.

  8.  **Final Polish:** Ensure the distinction between "Moral Psychology" (descriptive) and "Normative Ethics" (prescriptive) is clear. Emphasize that MFT proponents often commit the naturalistic fallacy (implicitly), while debunkers commit the idealization fallacy (ignoring human nature). The synthesis is a functionalist pluralism that admits limits.

