prompt: |-
  I sit on the value analysis committee at a small regional hospital — nine of us, two doctors, a nurse manager, a pharmacist, an admin, a finance person and me (I do procurement and I'm the one who ends up with the spreadsheets). We meet twice a month for about two hours and we decide what supplies, devices and clinical protocols the hospital adopts: things that cost anywhere from 20 grand to 400 grand and that the floor staff then has to live with for five to ten years. I have no economics or philosophy background at all; I got into this because I noticed we almost always end up agreeing with whoever speaks first, and someone on a forum told me to look up information cascades and rational herding. I sort of get the basic idea — people copy the people who went before them and rationally stop using their own private information — but every explanation I find is about strangers picking between two restaurants, or balls in an urn, and I can't map it onto my situation, where we talk in a room, people say out loud how sure they are, we all know each other's track records, and the thing being decided is usually some ugly mixture of a prediction about the world and a values call about what we care about.

  One wrinkle that I think makes us different from the textbook setup, and please tell me if I'm wrong about this. In our meetings people don't only copy each other's picks, they copy each other's level of confidence. Three people who each have a genuinely weak private reason will each sound firm, because each one is reading the other two as firm, and the meeting ends in what I've started calling a "confidence cascade" — nobody has really changed their mind about anything, but the room is radiating a certainty that no individual in it actually holds, and anybody with a real worry suddenly feels like the odd one out and shuts up. There's a mirror version where one respected person says something lukewarm and the whole proposal quietly dies, which I've been calling a "chill." My sense is that a procedure built for binary choices made one at a time in a fixed order won't catch either of these, because with us the action isn't binary, the order isn't fixed and the thing being transmitted is partly a mood.

  What I actually want is a procedure I can run, in the twenty minutes I have before a meeting or in the two minutes of floor time I get during it, to decide for myself: is this a case where I should go along because the fact that everyone is converging really is evidence, or a case where I should dig in and put my private read on the table? A short ordered list of questions, each answerable by a non-expert in a minute or two without knowing the theory, with a clear stopping rule for each — stop and defer, stop and escalate, or stop and hand it to a person because the remaining question is about values rather than facts. Please be honest about which steps are real tests and which are just judgment wearing a clipboard. It has to handle: decisions where there is a fact of the matter that will show up in our own data later (does this catheter actually cut infection rates on our wards) versus ones where the right answer is mostly about what we value (do we buy the nicer monitoring system or spend the same money on another night nurse) versus ones where what matters is simply that we all do the same thing (which electronic record system we standardise on); the fact that sometimes I can get a private straw vote before anyone talks and sometimes I can't, because the chair runs the meeting how she likes; the fact that some of what people know isn't the kind of thing they can put into words, like a nurse's gut feeling that a new pump is going to be a misery on nights; and the fact that I am not the chair and I have maybe two minutes. If the answer is dig in, tell me what the move actually is — secret ballot, ask the quietest person first, table it, send it to a subcommittee, whatever. And please don't point me at papers or tell me what to read; our library access is basically nil and it wouldn't help me with fifteen minutes before a meeting anyway.

  Then run it on three cases from the last year. First: we were choosing between two IV pump models, everyone drifted toward the one the senior anesthesiologist liked, and I had our own repair-ticket data showing that model had noticeably more failures at our two sites over eighteen months than the other one did. Second: we were deciding whether to switch to a cheaper sterilization wrap before the next inspection; six people with far more relevant experience than me were all relaxed about it, my only objection was a vague worry about the inspectors that I couldn't really back up, and I really did not want to be the person who slows everything down — I suspect the right procedure tells me to shut up here, so show me that if it does. Third: an experienced OR nurse said a new surgical positioning device just felt wrong to her, couldn't articulate why, the rest of the room was enthusiastic, and I couldn't tell whether to treat that as a signal or as nothing. Finally, tell me plainly what the procedure can't do: what kinds of decisions it will misfire on, and how I keep it from turning me into the person who objects to everything.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the User and the Problem:**
      *   **User Role:** Procurement officer on a Value Analysis Committee (VAC) at a small regional hospital.
      *   **Committee Composition:** 9 members (2 doctors, nurse manager, pharmacist, admin, finance, user, others).
      *   **Meeting Dynamics:** Meets twice a month, 2 hours. Decides on supplies/devices/protocols ($20k-$400k, 5-10 year lifespan).
      *   **User's Observation:** Notices "information cascades" and "rational herding," but specifically identifies a "confidence cascade" (people mimicking confidence levels) and a "chill" (one lukewarm opinion kills a project).
      *   **Constraints:** No economics/philosophy background. No access to academic papers. Needs a practical tool usable in 20 mins before or 2 mins *during* a meeting. User is *not* the chair.
      *   **Goal:** A short, ordered list of questions (decision tree) to determine: Defer, Escalate/Dig In, or Hand off (Values vs. Facts). Needs specific actionable moves if "Dig In" is the result.
      *   **Nuance:** Must distinguish between Fact-based decisions (data will verify later), Value-based decisions (trade-offs), and Coordination decisions (standardization). Must account for tacit knowledge (gut feelings).
      *   **Test Cases:** Three specific scenarios from the past year need to be run through the procedure.
      *   **Limitations:** Must explain what the procedure *can't* do and how to avoid being "the obstructionist."

  2.  **Deconstruct the "Confidence Cascade":**
      *   Standard information cascade theory assumes sequential binary choices where agents ignore private signals once public history outweighs them.
      *   The user's situation is richer: continuous confidence signals, social pressure, mixed fact/value/coordination problems, and tacit knowledge.
      *   The core problem isn't just *what* people choose, but *how sure* they sound.
      *   The tool needs to break the social proof loop without requiring the user to take charge of the whole meeting.

  3.  **Drafting the Procedure (The "VAC Interrupt"):**
      *   *Constraint:* 2 minutes max during the meeting.
      *   *Structure:* A checklist of 3-4 questions.
      *   *Logic:*
          1.  **Type of Decision:** Is this Fact, Value, or Coordination? (Determines the goal).
          2.  **Source of Consensus:** Is the agreement based on shared data or shared social cues? (Detects the cascade).
          3.  **Risk of Error:** What happens if we are wrong? (Determines urgency).
          4.  **Action:** Specific tactical move based on the answers.

      *   *Refining the Questions:*
          *   Q1: Fact vs. Value vs. Coordination.
              *   Fact: Data will prove us right/wrong later (e.g., infection rates).
              *   Value: Trade-off (e.g., cost vs. comfort).
              *   Coordination: Just need to pick one (e.g., software).
          *   Q2: The "Silent Vote" Check. Can I gauge private belief before public commitment? If not, look for "confidence mimicry."
          *   Q3: The "Reversibility" Check. Is this hard to undo?
          *   Q4: The "Tacit Knowledge" Check. Is the dissent based on gut feeling/experience?

      *   *Developing the Actions:*
          *   If Fact + High Risk + Cascade suspected -> **Dig In.** (Move: Request trial data, delay vote).
          *   If Value + Consensus -> **Defer.** (Don't fight values with facts).
          *   If Coordination -> **Defer.** (Speed matters more than perfection).
          *   If Tacit Knowledge -> **Escalate gently.** (Move: Ask for a pilot/test).

      *   *Simplifying for the User:* Let's make it a "3-Gate Filter."
          *   Gate 1: What kind of bet is this? (Fact, Value, Coordination).
          *   Gate 2: Where is the confidence coming from? (Data or Social).
          *   Gate 3: What is the cost of being wrong? (High, Low, Irreversible).

  4.  **Running the Test Cases:**

      *   *Case 1: IV Pumps (Fact + Hard Data vs. Senior Doctor).*
          *   Gate 1: Fact (infection/failure rates).
          *   Gate 2: Social (Senior Doctor) vs. Data (User's repair tickets).
          *   Gate 3: High Risk (Patient safety/Equipment failure).
          *   Action: Dig In. Move: "I have repair data that contradicts this. Can we review the failure rates before signing?"
      *   *Case 2: Sterilization Wrap (Fact/Compliance + Low User Confidence).*
          *   Gate 1: Fact/Compliance (Inspectors).
          *   Gate 2: Consensus (6 experts relaxed).
          *   Gate 3: User has no data, just vibe.
          *   Action: Defer. Don't fight experts without evidence.
      *   *Case 3: OR Positioning Device (Tacit Knowledge vs. Enthusiasm).*
          *   Gate 1: Fact/Usability (Nurse comfort/safety).
          *   Gate 2: One expert gut feeling vs. Group enthusiasm.
          *   Gate 3: High Risk (Patient positioning injury).
          *   Action: Escalate gently. Move: "Can we do a 2-week trial on night shift?"

  5.  **Addressing the Limitations & "Obstructionist" Fear:**
      *   The tool can't fix a toxic culture.
      *   It can't verify hidden data.
      *   To avoid being "the blocker," frame objections as "risk mitigation" or "due diligence," not "no." Use the "Yes, if..." structure.

  6.  **Refining the Output:**
      *   Tone: Professional, direct, empathetic to the constraint (2 minutes).
      *   Format: Clear headers, bullet points, bold text for scannability.
      *   Honesty: Explicitly state which parts are heuristic/judgment.
      *   No Theory: Avoid jargon like "Bayesian updating" or "Nash Equilibrium."

  7.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is 3 gates too complex for 2 minutes?
      *   *Fix:* Make the gates Yes/No questions with immediate branching.
      *   *Critique:* The user asked for a "stopping rule" for values vs. facts.
      *   *Fix:* Ensure Gate 1 clearly separates these. If it's Values, stop arguing facts.
      *   *Critique:* User mentioned they can't always get a straw vote.
      *   *Fix:* Include a "Proxy for Private Info" step (e.g., look at who is speaking first).
      *   *Critique:* Need to ensure the "Dig In" moves are politically viable for a non-chair.
      *   *Fix:* Suggest phrasing like "For the minutes..." or "Just to clarify..." rather than "I object."

  8.  **Final Polish:** Check against all constraints in the prompt.
      *   20 mins before / 2 mins during? Yes.
      *   Non-expert friendly? Yes.
      *   Handles Fact/Value/Coordination? Yes.
      *   Handles Tacit Knowledge? Yes.
      *   Runs the 3 cases? Yes.
      *   Explains limitations? Yes.
      *   No reading list? Yes.

      *(Self-Correction on Case 2)*: The user suspects the right procedure tells them to shut up. I need to make sure the logic *explicitly* leads to "Defer" there, validating their intuition but grounding it in the framework.
      *(Self-Correction on Case 3)*: The "gut feeling" needs a specific protocol. It's not "ignore it," it's "test it."

      *Final check on the "Confidence Cascade" concept:* The user coined "confidence cascade." I should acknowledge that term and validate it. It's a sharp observation.

      *Let's build the "VAC Interrupt Protocol".*

      *Gate 1: The Bucket.* (Fact, Value, Coordination).
      *Gate 2: The Signal.* (Data vs. Status).
      *Gate 3: The Stake.* (Reversible vs. Permanent).

      *Moves:*
      *   *The "Minutes" Move:* "I just want to make sure the minutes reflect..."
      *   *The "Pilot" Move:* "Can we try this on one ward first?"
      *   *The "Silence" Move:* (If possible) "Let's take 30 seconds to write down our top concern."
      *   *The "Defer" Move:* Say nothing.

      *Okay, ready to write.*
answer: |-
  Here is a procedure designed for your constraints. It is not a theoretical model; it is a triage tool. It treats the "confidence cascade" as a specific type of risk signal rather than a social phenomenon.

  ### The "VAC Interrupt" Protocol
  **Time required:** 20 minutes before (for data prep) or 2 minutes during (for mental check).
  **Goal:** Determine whether to Speak, Pivot, or Stay Silent.

  #### Gate 1: The Bucket (What kind of decision is this?)
  *Look at the item on the agenda. Categorize it immediately.*

  *   **A. Fact Bet:** We will know if we were right or wrong within 12 months based on hospital data (e.g., infection rates, repair tickets, inspection pass/fail).
  *   **B. Value Trade:** There is no "right" answer, only a preference on how to spend resources (e.g., nicer equipment vs. more staff, brand name vs. generic).
  *   **C. Coordination:** The specific choice matters less than everyone using the same one (e.g., which software, which form).

  **Stopping Rule:**
  *   If **B (Value)**: **Stop and Defer.** Do not fight a value preference with data. If the doctors value prestige over cost, that is their call. Note it in minutes and move on.
  *   If **C (Coordination)**: **Stop and Defer.** Speed is the priority here. Unless a option is functionally broken, consensus is more valuable than optimization.
  *   If **A (Fact)**: **Proceed to Gate 2.**

  #### Gate 2: The Signal (Where is the confidence coming from?)
  *Listen to the first three people who speak. Ignore *what* they say; listen to *why* they say they are sure.*

  *   **Signal Type 1 (Data):** They reference specific past experiences, numbers, or trial results ("We used this at X hospital," "The failure rate was Y").
  *   **Signal Type 2 (Status):** They reference authority or general reputation ("Dr. Smith recommends this," "This is the industry standard," "I've never heard of problems").
  *   **Signal Type 3 (Mood):** They mirror the previous speaker's tone without adding new evidence ("I agree with Dr. Smith," "Yeah, seems solid").

  **The Test:**
  *   If you see **two consecutive Signal Type 3s** following a **Signal Type 2**, you are in a **Confidence Cascade**. The room is radiating certainty derived from social proof, not new information.
  *   If you see **Signal Type 1**, the consensus is likely grounded.

  **Stopping Rule:**
  *   If **Grounded (Type 1)**: **Stop and Defer.** The group likely knows something you don't.
  *   If **Cascade (Type 2 + 3s)**: **Proceed to Gate 3.**

  #### Gate 3: The Stake (What is the cost of being wrong?)
  *Ask yourself two questions.*

  1.  **Reversibility:** If we buy this and it's wrong, can we undo it? (Hard stop if it's a 10-year contract or implanted device; Easy if it's disposable supplies).
  2.  **Tacit Check:** Is there a person in the room whose *hands-on* experience contradicts the *theoretical* enthusiasm? (e.g., The night nurse vs. the purchasing rep).

  **The Decision:**
  *   **Low Reversibility + No Tacit Dissent:** **Stop and Defer.** Not worth your political capital.
  *   **High Reversibility OR Tacit Dissent:** **Dig In.** (See Moves below).

  ---

  ### The Moves (If Gate 3 says "Dig In")
  *You are not the chair. You cannot stop the vote. You can only introduce friction or create a record.*

  **Move 1: The "Minutes" Anchor (For Fact Bets)**
  *   **When:** You have hard data (like repair tickets) that contradicts the room.
  *   **Action:** Do not say "I object." Say: *"For the minutes, I want to flag that our internal repair data from 2022 shows a 15% higher failure rate on Model A. I'm noting this so we can review it in six months."*
  *   **Why:** This forces the group to acknowledge the risk without requiring them to change their vote now. It protects you later if the device fails.

  **Move 2: The "Pilot" Pivot (For Tacit Knowledge)**
  *   **When:** An experienced staffer (nurse/tech) has a "gut feeling" but no data.
  *   **Action:** Propose a trial. *"Given [Nurse's Name] has specific concerns about night-shift workflow, can we commit to a 30-day pilot on one ward before full rollout?"*
  *   **Why:** This validates the tacit knowledge without stopping the project. It converts a "vibe" into a "Fact Bet" for the next meeting.

  **Move 3: The "Silence" Check (If you have 2 minutes before the vote)**
  *   **When:** You suspect a cascade but have no data.
  *   **Action:** Ask the Chair: *"Before we vote, does anyone have a specific operational concern they haven't voiced yet?"*
  *   **Why:** This invites private information into the public sphere without accusing anyone of herding.

  ---

  ### Running the Protocol on Your Three Cases

  #### Case 1: The IV Pumps (Fact Bet)
  *   **Gate 1 (Bucket):** **Fact.** Repair tickets and infection rates are measurable.
  *   **Gate 2 (Signal):** **Cascade.** Senior Anesthesiologist (Status) spoke first. Others agreed (Mood). Your data (Fact) was unspoken.
  *   **Gate 3 (Stake):** **High Reversibility.** $400k spend, 5-10 year lifespan, patient safety risk.
  *   **Verdict:** **Dig In.**
  *   **The Move:** **The "Minutes" Anchor.**
      *   *Script:* "I support Dr. X's preference, but for the risk log, I need to record that our local repair data shows Model A fails 20% more often than Model B. If we proceed, I recommend we schedule a review in 12 months."
      *   *Outcome:* You don't stop the purchase (which might be politically impossible), but you break the illusion of unanimous confidence and create a trigger for future review.

  #### Case 2: The Sterilization Wrap (Fact/Compliance Bet)
  *   **Gate 1 (Bucket):** **Fact.** Inspectors will pass or fail you.
  *   **Gate 2 (Signal):** **Grounded.** Six people with *relevant experience* are relaxed. This isn't just status; it's domain expertise.
  *   **Gate 3 (Stake):** **Low Reversibility (for you).** If it fails inspection, the experts take the hit, not procurement. Your objection is a "vague worry."
  *   **Verdict:** **Stop and Defer.**
  *   **The Move:** **Silence.**
      *   *Why:* You have no private information (data) and no tacit knowledge (you aren't the sterile processing tech). In a Fact Bet, expert consensus *is* the data. Objecting here makes you the obstructionist without adding value. The procedure correctly tells you to shut up.

  #### Case 3: The OR Positioning Device (Tacit Knowledge Bet)
  *   **Gate 1 (Bucket):** **Fact/Usability.** It either works for the patient/staff or it causes injury/complaints.
  *   **Gate 2 (Signal):** **Mixed.** Room is enthusiastic (Mood/Status), but one OR Nurse has a "feeling" (Tacit).
  *   **Gate 3 (Stake):** **High Risk.** Patient positioning injuries are severe. The nurse's gut is a high-value signal in this context.
  *   **Verdict:** **Dig In.**
  *   **The Move:** **The "Pilot" Pivot.**
      *   *Script:* "The clinical benefits look great. Since [Nurse's Name] has a specific concern about night-shift ergonomics, can we make the purchase conditional on a 2-week trial on the night shift?"
      *   *Why:* You aren't saying "No." You are saying "Yes, if." This protects the patient and validates the nurse without fighting the doctors' enthusiasm.

  ---

  ### What This Procedure Cannot Do (And How to Survive It)

  **1. It cannot fix a toxic hierarchy.**
  If the Senior Anesthesiologist is a tyrant who punishes dissent, "The Minutes Anchor" might still get you iced out.
  *   **Mitigation:** Frame everything as "Risk Management" for the *hospital*, not "Correction" of the *doctor*. Use the phrase "For the audit trail" rather than "I disagree."

  **2. It cannot verify hidden data.**
  If the six experts in Case 2 know something you don't (e.g., the vendor gave them a secret guarantee), the protocol assumes they are acting in good faith.
  *   **Mitigation:** If you feel consistently out of the loop, ask the Finance person privately: "Is there a contractual reason we're pushing this?" They usually know the money trails.

  **3. It will not stop "Value" decisions disguised as "Fact" decisions.**
  Doctors often argue "This device is safer" (Fact) when they mean "I prefer this device" (Value).
  *   **Mitigation:** If you catch this, use the **Pilot Pivot**. "If it's safer, the data will show it in a 30-day trial." If they refuse the trial, you know it's a Value preference. You can then Defer safely.

  **4. It won't stop you from being "The Blocker" if you use it every time.**
  If you Dig In on every agenda item, you become the bottleneck.
  *   **Mitigation:** **The 1-in-5 Rule.** Only use the "Dig In" moves on one out of every five meetings, unless patient safety is immediately at risk. Build political capital by Defering on the small stuff (Coordination/Value) so you can spend it on the big stuff (Fact/Safety).

  **Summary for your pocket:**
  1.  **Fact, Value, or Coordination?** (If Value/Coordination -> Shut up).
  2.  **Data or Status?** (If Status + Mimicry -> Suspect Cascade).
  3.  **Reversible or Permanent?** (If Permanent + Cascade -> Speak).
  4.  **Move:** Anchor in Minutes or Request Pilot. Never just say "No."
