answer: |-
  This document serves as a joint statement of adversarial collaboration between two parties holding opposing views on the ethical problem presented in John Taurek's Should the Numbers Count. We have engaged in dialogue to map the contours of our disagreement without attempting to force a premature resolution. Our goal is to clarify where we stand together and where we diverge, such that future discussion can target the specific philosophical hinges that maintain our deadlock. We believe that articulating the structure of our debate is itself a productive outcome, even if consensus remains out of reach.

  We have identified a foundation of shared moral intuitions and premises that constrain our disagreement. Specifically, we agree on the following claims: 1. that human lives are of equal intrinsic value and no individual is inherently more worthy of survival than another based on race, status, or identity; 2. that the death of any person in the scenarios we discuss is a genuine tragedy and a moral loss; 3. that the decision-maker must act impartially regarding who the specific individuals are, assuming no special obligations like parenthood or prior promises; 4. that the situation is a forced choice where saving everyone is impossible and doing nothing results in everyone dying; and 5. that morality requires us to have a reason for saving one group over another that can be justified to those affected. This shared ground ensures that our debate is not about the value of life or the permissibility of bias, but about the structure of moral reasoning in tragic choices.

  Despite this agreement, we remain fundamentally divided on the principle that should guide action when numbers differ. The aggregationist position is stated as follows: when faced with a choice between saving a smaller group and a larger group, the moral obligation is to save the larger group because the total amount of moral loss is minimized by preventing more deaths, meaning the claims of the many aggregate to outweigh the claim of the few. The anti-aggregationist position is stated as follows: when faced with a choice between saving a smaller group and a larger group, each individual has a separate and equal claim to be saved that cannot be summed, meaning the only fair procedure is to give each individual an equal chance of survival, typically implemented by a lottery between the groups rather than a deterministic save of the many. We both accept these formulations as accurate representations of our respective stances.

  To move forward, we have identified two specific cruxes where settling the underlying question would likely shift at least one position, and for each crux, we have selected a concrete case or argument that bears on it along with our conflicting predictions. The first crux concerns the additivity of moral loss, specifically whether the badness of two deaths is strictly twice the badness of one death. The concrete case we agree bears on this is the Repeated Trial Scenario, where a decision-maker faces the same choice between saving one person or five people one hundred times in a row. The aggregationist predicts that any reasonable observer will judge the policy of always saving the five as uniquely rational because the cumulative loss of life under the lottery policy would be staggeringly higher and thus avoidable. The anti-aggregationist predicts that even in repeated trials, the fairness owed to the single individual in each distinct instance remains paramount, and that aggregating across separate instances wrongly treats distinct persons as mere vessels for value rather than rights-holders. The second crux concerns the meaning of equal respect, specifically whether fairness requires equal outcomes or equal opportunities. The concrete case we agree bears on this is the Single Shot Lottery, where a coin flip decides the fate of the one versus the five. The aggregationist predicts that most people will feel deep regret or moral residue after flipping the coin and letting the five die, revealing an intuitive belief that the numbers should have dictated the outcome. The anti-aggregationist predicts that most people will feel relief that a fair procedure was followed, revealing an intuitive belief that no individual was dismissed simply because they were outnumbered. We record these predictions not to declare a winner, but to highlight the empirical and intuitional evidence each side believes supports their view.

  We sign this statement to acknowledge that our disagreement is robust, reasonable, and rooted in divergent interpretations of shared moral commitments. We commit to continuing this collaboration by testing the predictions listed above and refining our understanding of the cruxes identified. We do not expect to agree soon, but we agree that understanding the precise nature of our disagreement is better than arguing past one another.
