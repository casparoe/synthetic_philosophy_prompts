answer: |-
  # The "Free Biscuits" Food Ethics Decision Tree
  **Starting Commitment:** *The suffering of sentient animals matters morally.*
  **Instructions:** Answer the cases based on your intuition, not the label you want. Follow the arrows.

  ### 🌳 THE TREE

  **NODE 1: The Harvester's Ledger**
  *Case:* To grow 1kg of wheat, a combine harvester kills ~5 field mice. To raise 1kg of beef (pasture), 1/50th of a cow is killed, but fewer mice die (less cropping).
  *Question:* **Is the mouse's death *your* moral responsibility in the same way the cow's is?**
  *(Hinge: Do you count foreseen side-effects equally with intentional slaughter?)*
  *   **YES (All death counts equally):** Go to **Node 2**.
  *   **NO (Slaughter is uniquely wrong):** Go to **Node 4**.

  ---

  #### ➤ LEFT BRANCH (The Consequentialists)

  **NODE 2: The Wild Suffering Wager**
  *Case:* Pasture replaces wild habitat. Wild mice live ~6 months (starvation/predation). Pasture cows live ~5 years (good life + painless death).
  *Question:* **Does grazing *reduce* total suffering by displacing wild lives?**
  *(Hinge: Is wild life net-negative? Order of magnitude: 10x more wild deaths per hectare.)*
  *   **YES:** 🍃 **LEAF 1: Regenerative Meat Only.**
      *   *Prescription:* Eat pasture-raised ruminants; avoid crops/chicken.
      *   *Awkward Commitment:* You must support killing cows to save mice from hawks.
  *   **NO:** Go to **Node 3**.

  **NODE 3: The Sentience Floor**
  *Case:* Oysters have no central brain; crickets feel pain but have tiny nervous systems.
  *Question:* **Do invertebrates count in the minimization calculus?**
  *(Hinge: Probability of sentience. Is 1% chance of pain in 1000 insects > 100% in 1 cow?)*
  *   **YES:** 🍃 **LEAF 2: Strict Vegan (Land-Use Focus).**
      *   *Prescription:* Vegan diet + campaign for low-till farming to save mice.
      *   *Awkward Commitment:* You admit your kale kills mice, but you're just doing the best math.
  *   **NO:** 🍃 **LEAF 3: Bivalve/Insectarian.**
      *   *Prescription:* Eat oysters/crickets; avoid vertebrates.
      *   *Awkward Commitment:* You eat animals, but insist they probably don't mind.

  ---

  #### ➤ RIGHT BRANCH (The Rights/Agency Focus)

  **NODE 4: The Existence Counterfactual**
  *Case:* The steer would never have existed if you didn't buy the beef.
  *Question:* **Is a 5-year good life + painless death *better* for the steer than never being born?**
  *(Hinge: Total Utilitarianism vs. Negative Utilitarianism. Is non-existence neutral or safe?)*
  *   **YES (Life is a net benefit):** Go to **Node 5**.
  *   **NO (Death is intrinsic harm):** Go to **Node 6**.

  **NODE 5: The Broiler Multiplier**
  *Case:* Same protein: 1 Steer (5 good years) OR 100 Broilers (6 bad weeks).
  *Question:* **Is the Steer *always* the lesser evil, or does the headcount of 100 outweigh the quality of life?**
  *(Hinge: Aggregation. Does 100x suffering > 1x suffering?)*
  *   **YES (Steer is better):** 🍃 **LEAF 4: Ruminant Only.**
      *   *Prescription:* Eat beef/lamb; forbid chicken/pork.
      *   *Awkward Commitment:* You accept slaughter, but your flatmate thinks you're a hypocrite for eating *any* meat.
  *   **NO (Numbers trump quality):** 🍃 **LEAF 5: Effective Altruist (Diet Agnostic).**
      *   *Prescription:* Eat cheap/convenient; donate savings to wild animal welfare research.
      *   *Awkward Commitment:* You admit your diet is a rounding error next to land-use policy.

  **NODE 6: The Sentience Floor (Rights Version)**
  *Case:* Oysters/Insects again.
  *Question:* **If vertebrate meat is out, are insects/oysters permissible?**
  *(Hinge: Is the "Right to Life" tied to cognitive complexity?)*
  *   **YES:** 🍃 **LEAF 6: Insect/Bivalve Only.**
      *   *Prescription:* Protein from bugs/shells; no vertebrate flesh.
      *   *Awkward Commitment:* You explain to dinner guests why you can eat a mussel but not a fish.
  *   **NO:** Go to **Node 7**.

  **NODE 7: The Opportunity Cost**
  *Case:* Perfect veganism takes 10hrs/week (cooking, reading labels).
  *Question:* **Is dietary purity more important than spending that time on other altruism?**
  *(Hinge: Marginal impact. Does your biscuit-fueled debate change the world?)*
  *   **YES (Purity matters):** 🍃 **LEAF 7: Abolitionist Vegan.**
      *   *Prescription:* Zero animal products; advocate for total end of use.
      *   *Awkward Commitment:* You must judge friends who "slip up," or admit the judgment is useless.
  *   **NO (Impact matters):** 🍃 **LEAF 8: Pragmatic Reducer.**
      *   *Prescription:* Mostly plants, no stress, donate money.
      *   *Awkward Commitment:* You accept that you are complicit in some suffering to maximize overall good.

