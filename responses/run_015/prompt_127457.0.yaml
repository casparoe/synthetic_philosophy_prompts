  ### 🗺️ LOGICAL SPACE ANALYSIS (For the Handout Back)

  **Occupied Positions:**
  Most people in the room will land on **Leaf 2 (Strict Vegan)**, **Leaf 4 (Ruminant Only)**, or **Leaf 8 (Pragmatic Reducer)**. These are the stable equilibria of current food ethics discourse.

  **Unoccupied/Unstable Combinations:**
  1.  **"Chicken Only" (Node 5, Yes + Node 1, No):** Almost no one argues chicken is *ethically superior* to beef. The intensity/duration of broiler suffering makes this position incoherent unless you value "bird lives" significantly less than "cow lives" (speciesism), which contradicts the starting commitment.
  2.  **"Wild Meat Only" (Node 2, Yes + Node 4, No):** If you think wild suffering is high (Node 2 Yes) but death is an intrinsic harm (Node 4 No), you're stuck. Hunting wild animals reduces population (good for suffering) but kills individuals (bad for rights). This position is logically possible but practically exhausting (hunting all your own food).
  3.  **"Vegan + Wild Suffering Indifferent" (Node 2, No + Node 1, Yes):** If you count crop mice (Node 1 Yes) but think wild habitat is fine (Node 2 No), you have to argue that a mouse death in a harvester is worse than a mouse death by starvation/predation. This requires a specific view on *agency* that most consequentialists don't hold.

  **Hard-to-Separate Leaves:**
  *   **Leaf 2 vs. Leaf 7:** Both prescribe veganism. The difference is *motivation* (minimizing death vs. respecting rights). In practice, they eat the same biscuits. The split only matters when discussing *insects* or *lab-grown meat*.
  *   **Leaf 5 vs. Leaf 8:** Both say "diet isn't the main thing." Leaf 5 says "eat meat if cheap," Leaf 8 says "eat plants if easy." They converge on "don't stress about food, stress about policy."

  **Empirical Flip-Points:**
  *   **Node 1:** If crop deaths per calorie > slaughter deaths per calorie (currently false for beef, true for chicken), the Consequentialist branch flips.
  *   **Node 2:** If wild animal welfare interventions become viable (e.g., contraception), Leaf 1 becomes "Intervene in Nature," not just "Eat Beef."
  *   **Node 3:** If insect sentience is proven high, Leaf 3 & 6 collapse into Leaf 2 & 7.

