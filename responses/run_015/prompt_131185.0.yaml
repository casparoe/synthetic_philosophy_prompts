answer: |-
  **Brainstorming**

  Okay, need to map the terrain quickly. The core tension is between Block's conceptual distinction (Access vs. Phenomenal) and GWT's mechanistic claim (Ignition = Consciousness). The prompt's cases are designed to pry these apart. Case 1 (Sealed) is the killer for Access definitions—if ignition happens but nothing uses it, is it conscious? GWT says yes; Block's Access says no (not poised for use), but Phenomenal says maybe. Case 2 (Private) attacks GWT—if rich processing happens without broadcast, is it unconscious? GWT says yes; Phenomenal intuition says maybe not. Case 3 (Sharded) tests unity. The ill-posed bit is epistemic: how do we verify Phenomenal consciousness in Case 1 if report is blocked? We have to rely on stipulation. The real work will be done by the distinction between *functional role* (what the state does) and *intrinsic nature* (what the state feels like). If phenomenality is functional, GWT wins on Phenomenal. If not, GWT is only Access. I need to commit: GWT is a theory of Broadcast, which realizes Access. Claiming it realizes Phenomenality requires functionalism. The report issue doesn't collapse the distinction metaphysically, only epistemically.

  ***

  **Polished Explanation**

  To evaluate these cases, we must first define our terms. **Access consciousness** (A-consciousness) refers to a representational state whose content is poised for use in reasoning and the rational control of action and speech. **Phenomenal consciousness** (P-consciousness) refers to the subjective quality of experience; a state is P-conscious if there is "something it is like" for the subject to be in that state. **Global Workspace Theory** (GWT) posits an architecture where specialized, encapsulated processors compete for entry into a limited-capacity workspace. **Ignition** is the event wherein a coalition of neurons wins this competition and broadcasts its content via long-range projections to diverse consumer systems. GWT proponents often identify ignition with consciousness simpliciter.

  In **Case One (Sealed Broadcast)**, ignition occurs, but downstream uptake is blocked. GWT predicts the subject is conscious because ignition constitutes the necessary and sufficient condition for consciousness in this framework. Block's distinction predicts a divergence: the state is likely P-conscious (assuming ignition supports phenomenology) but not A-conscious, because the content is not actually available for control or report due to the blockade. In **Case Two (Private Lines)**, rich content exchange drives flexible behavior without ignition. GWT predicts the subject is unconscious regarding that content, as no global broadcast occurred. Block's framework allows that the state could be P-conscious (rich phenomenology) and locally A-conscious (guiding specific behavior), even if not globally accessible. In **Case Three (Sharded Workspace)**, two independent hubs exist. GWT predicts two distinct streams of consciousness, as each hub supports its own broadcast network. Block's distinction does not inherently dictate unity, but implies access is relative to each hub; whether phenomenality splits depends on whether P-consciousness supervenes on the unified workspace or the local processing.

  The harder question concerns the theoretical identity of GWT. Is it a theory of A-consciousness, P-consciousness, or merely **global broadcast**? The most defensible reading is that GWT is fundamentally a theory of global broadcast that *realizes* A-consciousness. To claim it explains P-consciousness requires an additional metaphysical premise: **functionalism**, the view that mental states are constituted by their functional roles rather than intrinsic properties. If one accepts functionalism, then global broadcast—the function of making content widely available—can be argued to constitute P-consciousness. The argument would be that the "what it is like" of experience *just is* the functional availability of information to the self-modeling systems within the workspace. However, if one holds that P-consciousness involves non-functional qualia, GWT explains only the mechanisms of access. In this rival reading, ignition makes a state reportable and usable (A-conscious), but does not guarantee there is something it is like to be the subject (P-conscious).

  Finally, does the reliance on report collapse the A/P distinction? Report requires access; we cannot verbally confirm P-consciousness without A-consciousness. Epistemically, this creates a bottleneck: we cannot verify Case One's phenomenology without access. However, the distinction does not collapse metaphysically. The concept of P-consciousness remains distinct because we can conceive of states that feel a certain way without being used (as in Case One stipulations). GWT explains the mechanism of access (broadcast). Whether that mechanism exhausts consciousness depends on whether phenomenality is functional. If functionalism is false, GWT remains a powerful theory of access, but leaves the hard problem of P-consciousness untouched. Thus, GWT is best understood as a theory of the architectural conditions for access, which proponents often *identify* with phenomenality via functionalist commitment, rather than a theory that neutrally explains both.
