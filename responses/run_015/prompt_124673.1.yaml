      *   Risk Budget: This idea captures the aggregate logic but fails on implementation. Assigning a "budget" implies a central authority deciding who suffers, which invites eugenics. It works as a personal heuristic (asking "how much suffering can I risk?") but collapses as policy because measuring potential suffering is impossible and enforcing limits violates bodily autonomy.

