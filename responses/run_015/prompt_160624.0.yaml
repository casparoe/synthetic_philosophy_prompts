answer: |-
  Here is a decision procedure designed for your constraints: six weeks, one junior staffer, nine lay members, and high political stakes. It is not a moral philosophy; it is a triage protocol. It prioritizes procedural defensibility over moral perfection, because your committee's survival depends on the former.

  ### The Public Names and Monuments Decision Protocol (v1.0)

  **Phase 1: The Fact Threshold (Weeks 1–3)**
  *Goal: Determine if the question is factual or evaluative. If factual, can we settle it?*

  1.  **Question:** Is the core claim of the petition (e.g., "He was a Klansman," "She funded this," "The lynching happened here") verifiable by public records, standard histories, or existing city archives within 20 hours of staffer time?
      *   **Yes:** Proceed to Phase 2.
      *   **No:** **STOP.** Recommendation: **Retain As Is.**
      *   *Reasoning:* The Committee is not a truth commission. If the facts cannot be established within the statutory window, the burden of proof lies with the petitioner. Uncertainty defaults to the status quo to prevent libel and endless delay.
      *   *Report Language:* "The Committee lacks the evidentiary basis to alter the historical record."

  **Phase 2: Scope of Commemoration (Week 4)**
  *Goal: Distinguish Honoree from Deed (Distinction 1).*

  2.  **Question:** Does the object/text commemorate the *whole life* of the person, or a *specific role/act*?
      *   **Whole Life:** (e.g., "In Memory of X," a bust in a hall of fame). Proceed to Phase 3.
      *   **Specific Role:** (e.g., "For his service as Engineer," "Donor of this Wing"). Proceed to Question 3.
  3.  **Question:** Does the verified negative conduct directly contradict the specific role commemorated?
      *   **Yes:** (e.g., A "Friend of Labor" statue erected by a strikebreaker). **Flag for Removal/Relocation.** The object is factually misleading.
      *   **No:** (e.g., A sewer engineer who was also a racist; the name commemorates the sewers). Proceed to Phase 3.
      *   *Reasoning:* If the honor is specific, the rest of the biography is relevant but not necessarily disqualifying. If the honor is general, the whole biography is relevant.

  **Phase 3: Source of Taint (Week 4)**
  *Goal: Distinguish Honoree Taint from Origin Taint (Distinction 3).*

  4.  **Question:** Is the objection based on the *honoree's* life, or the *donor/installation's* intent?
      *   **Honoree Taint:** Proceed to Phase 4.
      *   **Origin Taint:** (e.g., Installed by the White Citizens' Council to signal exclusion). **Flag for Removal/Relocation.**
      *   *Reasoning:* An object installed as an ideological weapon performs that function regardless of the honoree's biography. Origin taint is harder to recontextualize because the object *is* the message.

  **Phase 4: Current Function (Week 5)**
  *Goal: Assess Inert Honorifics (Distinction 2).*

  5.  **Question:** Is the name/object currently functioning as an *Active Commemoration* (destination, landmark, focal point) or an *Inert Honorific* (street address, utility, background)?
      *   **Active:** Proceed to Phase 5.
      *   **Inert:** **STOP.** Recommendation: **Retain As Is** (unless Origin Taint was flagged in Phase 3).
      *   *Reasoning:* Renaming an inert street transforms it from an address into a political badge. The cost of "reviving" the honorific force often outweighs the benefit of erasure, unless the name causes direct material harm (e.g., a slur).
      *   *Exception:* If the petition has *already* revived the force (high public controversy), move to Phase 5 but note the "Badge Risk."

  **Phase 5: Scarcity & Opportunity (Week 5)**
  *Goal: Price the Slot (Distinction 4).*

  6.  **Question:** Is this a "Prime Slot" (Main Park, City Hall, Major Artery) or a "Secondary Slot" (Path, Minor Street, Lobby Plaque)?
      *   **Prime:** **Requirement:** If retained, must justify why this honoree is the *best* use of the slot compared to potential alternatives.
      *   **Secondary:** Retention is easier to justify; scarcity cost is lower.
      *   *Reasoning:* Retention is a refusal. On prime land, the Committee must explicitly weigh the opportunity cost.

  **Phase 6: The Recontextualization Test (Week 6)**
  *Goal: Determine if annotation is sufficient.*

  7.  **Question:** Can a plaque/marker correct the misleading narrative without requiring the removal of the object?
      *   **Test:** Read the proposed text of the marker alongside the existing inscription. Does the marker make the original inscription look like a historical artifact (contextualized) or a lie (contradicted)?
      *   **Artifact:** **Disposition: Retain + Annotation.**
      *   **Lie:** **Disposition: Relocate or Remove.**
      *   *Reasoning:* You cannot annotate a falsehood into truth. If the statue says "Friend of Workers" and the history says "Killer of Workers," a plaque explaining the complexity makes the statue look like a mistake, not a lesson.

  **Phase 7: The Value Hand-Off (Week 6)**
  *Goal: Identify where the procedure ends and politics begins.*

  8.  **Question:** If all previous steps allow for multiple dispositions (e.g., Relocate OR Remove), which aligns with the City's current Identity Statement?
      *   **Action:** This is the **Human Vote.** The procedure provides the menu; the Committee selects the meal based on current civic values.
      *   *Note:* If the Committee splits 4-5 here, the recommendation defaults to the *least destructive* option (usually Retain + Annotation) to maintain stability, unless Origin Taint is present.

  ***

  ### The Disposition Menu

  1.  **Retain As Is:** Facts unsettled, or Inert Honorific with low harm.
  2.  **Retain + Annotation:** Honoree Taint exists, but Scope is Specific, or Recontextualization Test passed.
  3.  **Retain + Counter-Commemoration:** Keep object, but install new art/naming nearby to balance the narrative (use for Prime Slots where removal is too costly/controversial).
  4.  **Relocate:** Move to museum/cemetery. Use when Object is Active, Honoree Taint is high, but the art has historical value.
  5.  **Remove:** Destroy or store. Use when Origin Taint is high (ideological weapon) or Object is a Lie.
  6.  **Rename:** Swap the name. Use for Secondary Slots where Inert status is broken.
  7.  **Rename + Install New:** Simultaneous swap. Use for Prime Slots to address Scarcity (fill the slot immediately).

  ***

  ### Application to Current Matters

  #### Case 1: The Industrialist Statue (1911)
  *   **Phase 1 (Facts):** Settled. Strikebreaking and philanthropy are documented.
  *   **Phase 2 (Scope):** Inscription says "Friend of the Workingman." This is a claim about his relationship to labor, not just his wealth.
  *   **Phase 3 (Taint):** Honoree Taint.
  *   **Phase 4 (Function):** Active Commemoration (Courthouse lawn).
  *   **Phase 5 (Scarcity):** Prime Slot.
  *   **Phase 6 (Recontextualization):** The inscription is a direct contradiction of fact. A plaque saying "He killed workers" makes the inscription look like a lie, not a historical nuance.
  *   **Phase 7 (Value):** High conflict.
  *   **Recommendation:** **Relocate + Counter-Commemoration.**
      *   *Reasoning:* Move the statue to a local history museum (contextualizes the 1911 view of him). Install a new work on the lawn honoring the labor movement or the victims of the strike. This addresses Scarcity (the slot is used for a better narrative) and resolves the "Lie" problem.
      *   *Drafting Note:* Emphasize that the statue is historically valuable *as evidence of 1911 values*, but inappropriate for 2024 civic honor.

  #### Case 2: The Engineer's Street (1923)
  *   **Phase 1 (Facts):** Settled. Engineer + Covenants.
  *   **Phase 2 (Scope):** Specific Role (Engineer/Surveyor). The name was likely attached for the map work, not his social views.
  *   **Phase 3 (Taint):** Honoree Taint (Racial covenants are severe, but not Origin Taint of the street naming itself).
  *   **Phase 4 (Function):** **Inert Honorific.** Residents treat it as an address. The petition *revived* it.
  *   **Phase 5 (Scarcity):** Secondary Slot (One of many streets).
  *   **Phase 6 (Recontextualization):** Street signs cannot be annotated.
  *   **Phase 7 (Value):** **The Hard Answer.**
  *   **Recommendation:** **Retain As Is.**
      *   *Reasoning:* This relies on Distinction 2 (Inert Honorifics). The procedure dictates that renaming an inert street validates the "Badge Effect." It turns a sewer engineer's address into a referendum on racism, forcing residents to defend a name they didn't choose. The harm of the name (unknown for 100 years) is currently lower than the harm of the conflict (polarizing the neighborhood).
      *   *Drafting Note:* You will have to argue this hard. The logic is: "We do not rename streets to punish the dead; we rename them to serve the living. Making this street a battleground serves no living person."

  #### Case 3: The Lynching Site (1919)
  *   **Phase 1 (Facts):** Settled.
  *   **Phase 2 (Scope):** Proposal for New Naming vs. Marker.
  *   **Phase 3 (Taint):** N/A (This is about adding, not removing).
  *   **Phase 4 (Function):** Active (Path) vs. Marker.
  *   **Phase 5 (Scarcity):** Prime Slot (Historical site).
  *   **Phase 6 (Rules Check):** City rules require "Distinguished Citizens." Victim status does not qualify. Family requests no name.
  *   **Recommendation:** **Install Marker (No Name).**
      *   *Reasoning:* The "Distinguished Citizen" rule blocks the Path Name objectively. The Family's wish blocks it ethically. The Marker satisfies the need for memory without violating the naming rules or the family's consent.
      *   *Drafting Note:* Reject both petitions for naming. Accept the need for memory via the Marker disposition. This avoids the "Value Hand-Off" trap by adhering to existing bylaws.

  ***

  ### Where the Procedure Misfires

  1.  **The "Bad Facts" Loophole:** Phase 1 defaults to Retention if facts are murky. A skilled petitioner can game this by making claims too complex for a junior staffer to debunk in 20 hours. You will retain some questionable names simply because truth is expensive.
  2.  **The "Inert" Blind Spot:** In Case 2, the procedure recommends Retention. For a resident who *knows* the history, the street name is not inert; it is a daily injury. The procedure privileges the *majority's ignorance* over the *minority's pain* to avoid the "Badge Effect." This is a utilitarian calculation, not a moral one.
  3.  **Scarcity is Subjective:** Phase 5 asks if a slot is "Prime." A park path is prime to a neighborhood, secondary to the city. The Committee will fight over this classification.

  ### The Hard Answer You Must Argue

  **Case 2 (The Street).** Your colleagues will want to rename the street. It feels like the moral thing to do. The procedure tells you **not to.**

  **Your Argument:** "If we rename this street, we confirm that the name matters. We turn a surveyor's tag into a political badge. We force every homeowner on that block to take a side in a history they didn't make. The engineer's racism was real, but his name on a map was inert until we made it active. The procedure recommends we do not weaponize our own address system. We acknowledge the harm, but we refuse to let the petitioners dictate that this street is a monument to him. It is not. It is a road."

  This is the only answer that respects the "Inert Honorific" distinction you identified. It will be unpopular. It is also the only one that stops the cycle of revival and reaction.
