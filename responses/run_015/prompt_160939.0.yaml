answer: |-
  Here is the operational framework for handling Higher-Order Evidence (HOE). It is designed to be fast, explicit, and resistant to manipulation.

  ### The Three Rules

  1.  **The One-Path Rule (Prevents HOE Laundering):** You cannot update on the *content* of a teammate's argument and the *fact* of their disagreement separately. If you have read their reasoning and rejected it, their status as a "disagreer" adds no new information. The only exception is if they possess private information or intuition you cannot access (see Case C). This prevents double-counting and stops people from manufacturing influence by disagreeing loudly without providing new reasons.
  2.  **The Surveyability Test (Domain-Local vs. Global):** Reliability evidence (e.g., "I was tired," "I'm bad at macro") is inadmissible if the reasoning is fully surveyable. **Surveyable** means every step of the logic can be checked by another competent person without trusting the original author's intuition. If the work is surveyable, internal states like fatigue do not matter. If the work relies on intuition or private data, reliability evidence is admissible but must match the domain (bad at macro does not license discounting bio).
  3.  **The Publication Gap (Process vs. Person):** The number on the sheet is the *Actionable Probability*, not the *Average Personal Credence*. If higher-order evidence shifts the weights (e.g., deferring to an expert whose reasons you can't verify), the aggregated number may land where no individual personally sits. This is rational. You are publishing the org's best estimate given all evidence, including evidence about your own reliability.

  ### Case Analysis

  **(a) Worse track record disagrees hard.**
  *Verdict:* No move.
  *Rationale:* Under the One-Path Rule, if you evaluated their arguments and rejected them, the bare fact of their disagreement is spent. Since their track record is worse than the group's, their dissent is not evidence that you are missing something; it is consistent with noise. Do not adjust.

  **(b) Common source (same thread).**
  *Verdict:* Keep probability, lower confidence.
  *Rationale:* Independence is violated. The effective sample size is not six; it is closer to one. The mean might still be correct, but the uncertainty around that mean increases. Widen the confidence interval or reduce the weight of this forecast in the aggregation.

  **(c) Expert insists, team unmoved, reasons unverifiable.**
  *Verdict:* Move the number towards the expert, even if no one believes it.
  *Rationale:* This triggers the Publication Gap. Since reasons are not surveyable, you must weight by track record. The expert has the best track record. The aggregation math dictates a shift. You will publish a number that no individual endorses. This is uncomfortable but correct; the sheet reflects the weighted truth, not a vote.

  **(d) 2am work, fully checkable.**
  *Verdict:* No move.
  *Rationale:* Passes the Surveyability Test. Since the logic is explicit and checkable, the author's physiological state is irrelevant. Do not discount.

  ### Rollout Risks

  The first time you run this, people will game the Surveyability Test. They will claim their intuition is "checkable logic" to avoid reliability discounts, or claim logic is "intuition" to dodge responsibility for errors. You will need a tie-breaker (usually the Team Lead) to decide if a chain of reasoning is truly surveyable or relies on hidden jumps. Also, expect resistance on Case (C); publishing a number nobody believes feels like lying, but it is actually honesty about weights.

  | Step | Question to ask | What counts as a sufficient answer | Where it exits | Who signs off |
  | :--- | :--- | :--- | :--- | :--- |
  | 1 | Is this new evidence about the world or about us? | "World" = new data/args. "Us" = fatigue, track record, disagreement fact. | If "World", update first-order and exit. | Forecaster |
  | 2 | Is the reasoning fully surveyable? | Yes = every step checkable by peer. No = relies on intuition/private data. | If Yes, ignore reliability evidence (Case D) and exit. | Peer Reviewer |
  | 3 | Does the reliability evidence match the domain? | Yes = track record/fatigue applies to this question class. No = macro track record used for bio. | If No, evidence is inadmissible. Exit. | Team Lead |
  | 4 | Have we already updated on the content of this disagreement? | Yes = we heard their reasons. No = they just said "I disagree". | If Yes, the fact of disagreement adds no weight (Case A). Exit. | All |
  | 5 | Are our observations independent? | Yes = separate sources. No = common source (Case B). | If No, reduce confidence/weight, keep mean. | Aggregator |
  | 6 | Does the weighted aggregate differ from personal credence? | Yes = weights shifted due to HOE. No = weights stable. | If Yes, publish the weighted number (Case C). Note the gap. | Team Lead |

