  2.  **Deconstruct the Supervisor's Claim:**
      *   *Claim:* Brain = VN Computer (with noise).
      *   *Implication:* Keep Memory/Compute separate (Harvard/VN architecture). Add ECC. Scale up.
      *   *Underlying Assumption:* The functional abstraction of the brain maps cleanly to the functional abstraction of a CPU.
      *   *Conflict:* Neuromorphic engineering *typically* aims to mimic the physical structure of the brain (colocated memory/compute, event-driven, asynchronous). The supervisor is advocating for "AI Accelerators" (like TPUs/GPUs) but calling them "Neuromorphic." This is a crucial distinction.

  3.  **Drafting the Mapping Table (The "Audit"):**
