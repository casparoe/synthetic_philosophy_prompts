      *   *Radiometric Dates* $\rightarrow$ Geochronologic boundaries (used when fossils fail).
      *   *Ratification* $\rightarrow$ ICS (International Commission on Stratigraphy) voting.
      *   *Realist Position:* The FAD exists in the rock; the biological turnover is real; the GSSP just pins it.
      *   *Constructivist Position:* The GSSP is a fiat boundary; the biological change was gradual (cline); the "Stage" is a human box drawn on a continuous spectrum.

  4.  **Drafting the Restatement (The "Translation"):**
