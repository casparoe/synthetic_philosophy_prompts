          *   *Teleology:* Historical periods often imply progress (Middle $\rightarrow$ Renaissance $\rightarrow$ Modern). Geologic time is mostly non-teleological (except maybe the Anthropocene debate).
          *   *Survivorship Bias:* We only have the "rocks" (texts/art) that survived.

