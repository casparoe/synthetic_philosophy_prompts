answer: |-
  **Take-Home Exam: Collective Moral Responsability & Historical Memory**
  **Time Allocation:** Approximately 90 minutes
  **Word Count:** 1,000 – 1,200 words

  **Question:**

  In recent scholarship on collective moral responsability, some theorists propose a framework of "asymmetric legacy liability." This principle holds that a modern state inherits blame for past institutional decisions even after regime change, *only if* there is a continuous bureaucratic structure that preserved the original decision logic.

  Fritz Fischer's controversy regarding the origins of the First World War argues that the push toward expansionist war was not a national consensus but was engineered by a small political and military elite. 

  Using the framework of asymmetric legacy liability, evaluate whether Fischer's emphasis on elite agency undermines or supports the claim that the subsequent German state inherited liability for the war. Does the fact that a small group drove the decision break the continuity required for liability, or does the survival of the institutional machinary save it? Construct an argument that addresses the tension between individual elite guilt and bureaucratic continuity.

  ***

  **Model Answer**

  The concept of asymmetric legacy liability offers a rigorous test for historical accountability, specifically regarding how modern states relate to the actions of their predecessors. By conditioning liability on the continuity of bureaucratic structure and decision logic rather than mere geographical or nominal succession, this framework avoids blanket condemnation of populations while maintaining institutional accountability. When applied to Fritz Fischer's thesis on the origins of the First World War, a tension emerges between the specific agency of the 1914 elite and the endurance of the state apparatus. Ultimately, Fischer's emphasis on elite engineering does not break the continuity required for legacy liability; rather, it clarifies that the liability resides in the institution that enabled that elite, provided the bureaucratic logic survived the regime change.

  Fischer's central argument is that the outbreak of war was not an accidental stumble by great powers but a calculated risk by a specific German elite seeking hegemony. If liability were based on collective national guilt, Fischer's distinction would exonerate the German populace. However, asymmetric legacy liability is not concerned with popular consent but with institutional memory. The crucial question is whether the bureaucratic structures that executed the elite's will remained intact through the transition from the Kaiserreich to the Weimar Republic and beyond. If the Foreign Office, the military command structure, and the administrative logic of expansionism persisted despite the change in regime, the condition for liability is met.

  The argument that elite-driven origins break continuity relies on the assumption that institutions are neutral vessels changed entirely by new leadership. This is historically untenable in the German context. The bureaucracy that facilitated the 1914 decision did not vanish in 1918. While the monarchy fell, the civil service and military leadership largely remained, preserving the "decision logic" of realpolitik and expansionist security concerns. Fischer shows that the elite used existing institutional channels to wage war. Therefore, the liability attaches to those channels. The elite were the operators, but the bureaucracy was the machine. Asymmetric legacy liability targets the machine that remains operational, not just the operators who stepped down.

  However, a counter-argument suggests that if the decision logic was specific to the Wilhelmine elite's ideological goals, the transition to a democratic republic might have severed that logic. If Weimar Germany explicitly rejected the expansionist aims of 1914, the continuity of logic is broken. Yet, Fischer's evidence suggests that many of the same strategic assumptions persisted within the bureaucracy even if the public rhetoric changed. The "spirit" of the administration remained aligned with the previous decision logic regarding eastern expansion and military autonomy. Therefore, the survival of the institutional machinery saves the liability claim. The elite origin highlights *who* pulled the trigger, but the bureaucratic continuity explains *how* it was possible and why the state remains liable for maintaining the capacity for such decisions.

  In conclusion, Fischer's focus on a small elite does not absolve the state under the framework of asymmetric legacy liability. Instead, it sharpens the focus on the bureaucratic structures that allowed a minority to commit the state to war. Since those structures and their underlying decision logic survived the regime change of 1918, the condition for liability is satisfied. The state inherits the blame not because every citizen was guilty, but because the institutional engine that processed the elite's decision remained intact, preserving the capacity and logic for aggressive action.

  ***

  **Marking Scheme (Total: 25 Marks)**

  **1. Accurate Definition of Asymmetric Legacy Liability (5 Marks)**
  *   **Requirement:** The essay must correctly define the framework, specifically noting the condition of continuous bureaucratic structure preserving original decision logic across regime changes.
  *   **Common Botch:** Students define it as general intergenerational guilt without mentioning the specific bureaucratic continuity condition.

  **2. Correct Characterization of Fischer's Elite Thesis (5 Marks)**
  *   **Requirement:** The essay must explain Fischer's argument as focusing on a specific political/military elite rather than a national consensus or accidental slide into war.
  *   **Common Botch:** Students revert to the simplistic "Fischer said Germany wanted war" slogan without distinguishing elite agency from popular will.

  **3. Analysis of the "Continuity" Condition (5 Marks)**
  *   **Requirement:** The argument must explicitly evaluate whether the German bureaucracy survived the 1918 regime change with its decision logic intact.
  *   **Common Botch:** Students assume regime change (Kaiser to Republic) automatically breaks institutional continuity without arguing why or why not.

  **4. Resolution of the Tension (Elite vs. Institution) (5 Marks)**
  *   **Requirement:** The essay must address whether elite-driven origins undermine institutional liability, concluding that the institution enables the elite.
  *   **Common Botch:** Students treat elite guilt and institutional liability as mutually exclusive rather than exploring how they interact.

  **5. Clear Conclusion on Liability (5 Marks)**
  *   **Requirement:** The essay must take a definitive stance on whether liability is inherited based on the provided framework and Fischer's evidence.
  *   **Common Botch:** Students end with a "both sides have merit" hedge without committing to a conclusion regarding the liability claim.
