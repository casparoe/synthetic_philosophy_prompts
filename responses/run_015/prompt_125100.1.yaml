prompt: |-
  hey, my poli sci prof has been giving verdicts on democratic backsliding all semester and i'm trying to figure out her hidden rules before the final. her takes so far:

  hungary 2010-2020: clear backsliding, cause court-packing and media consolidation, even though elections stayed competitive.
  poland 2015-2023: yes too, but she said it was legislative-judicial fusion, not executive aggrandizement.
  turkey after 2016: she said it was sliding, but into competitive authoritarianism, so she put it in a different bucket.
  us 2020-2024: not backsliding, just stress, because power transferred and courts stayed intact.
  brazil under bolsonaro: ambiguous/partial — election denial was bad but institutions pushed back, so she wouldn't call it full backsliding.

  now she's putting this new case on the exam: a consolidated democracy where the ruling party sets up an "independent" electoral integrety board full of loyalists, but it only has advosory power and can't actually block candidates or results. at the same time they kill funding for the public broadcaster and replace it with a state-run streaming service that doesn't cover oposition rallies. international monitors still certify elections as technically free and fair.

  would she call this backsliding? i can see two rules that fit her past verdicts equally well. rule one: you need capture of formal veto points or decision-making power (so maybe no, since the board is toothless and elections are clean). rule two: structural distortion of the information environment is enough on its own, even without institutional veto capture (so yes, cause the broadcaster replacement changes the playing field). which earlier case is the closest analog — hungary cause of media, or us cause formal institutions held? and if her precedents genuinely underdetermine it, what principle is she adopting if she says yes versus no?

  i think i'm missing something about how she treats informational capture vs institutional capture, but i can't figure it out. any help?
reasoning: |-
  Here's a thinking process that leads to the suggested analysis:

  1.  **Analyze the User's Request:**
      *   **Goal:** The user wants to predict their poli sci professor's grading logic on a final exam question about democratic backsliding.
      *   **Input Data:** Five past "verdicts" given by the professor throughout the semester (Hungary, Poland, Turkey, US, Brazil).
      *   **New Case:** A consolidated democracy where the ruling party creates a toothless "loyalist" electoral board *and* defunds public broadcasting for a state-run streaming service that ignores opposition. Elections remain technically free/fair per international monitors.
      *   **User's Dilemma:** Two competing rules seem to fit past data:
          *   Rule 1 (Institutional): Need capture of formal veto/decision power (suggests *No* backsliding).
          *   Rule 2 (Informational): Structural distortion of info environment is enough (suggests *Yes* backsliding).
      *   **Specific Questions:** Which past case is the closest analog (Hungary or US)? If precedents underdetermine it, what underlying principle explains a Yes vs. No verdict? What is the professor's hidden logic regarding informational vs. institutional capture?

  2.  **Deconstruct the Professor's Past Verdicts:**
      *   *Hungary (2010-2020):* **Yes.** Reasons: Court-packing + Media consolidation. *Note:* Elections stayed competitive. -> *Implication:* Media consolidation counts heavily, even if elections work.
      *   *Poland (2015-2023):* **Yes.** Reason: Legislative-judicial fusion (not executive aggrandizement). -> *Implication:* Mechanism matters less than the outcome (judicial independence lost).
      *   *Turkey (Post-2016):* **Yes (but different bucket).** Competitive Authoritarianism. -> *Implication:* There's a spectrum. Backsliding can lead to a regime change classification.
      *   *US (2020-2024):* **No.** Reason: Power transferred + Courts intact. -> *Implication:* Resilience of formal institutions (peaceful transfer, judicial independence) trumps rhetoric/stress.
      *   *Brazil (Bolsonaro):* **Ambiguous/Partial.** Election denial bad, but institutions pushed back. -> *Implication:* Attempted backsliding + Institutional resilience = Not full backsliding.

  3.  **Analyze the New Case:**
      *   *Feature A:* "Independent" Electoral Integrity Board (Loyalists, but **Advisory/Toothless**).
      *   *Feature B:* Kill Public Broadcaster -> Replace with State Streaming Service (No Opposition Coverage).
      *   *Feature C:* International Monitors say Elections = Free/Fair.
      *   *Context:* Consolidated Democracy.

  4.  **Evaluate Rule 1 (Formal Veto/Decision Power):**
      *   *Evidence For:* US verdict (Courts intact/Power transferred = No backsliding). Brazil verdict (Institutions pushed back = Ambiguous/No). The new Board is toothless.
      *   *Evidence Against:* Hungary verdict (Elections competitive, but still backsliding). This suggests formal electoral integrity isn't the *only* metric.

  5.  **Evaluate Rule 2 (Informational/Structural Distortion):**
      *   *Evidence For:* Hungary verdict explicitly cites "media consolidation" as a cause for backsliding *even though elections stayed competitive*. This is the strongest piece of evidence.
      *   *Evidence Against:* US verdict (Rhetoric/Stress didn't count). But the US case didn't have *state capture* of media, just polarization.

  6.  **Synthesize the "Hidden Logic":**
      *   *The Hungary Key:* The professor explicitly called Hungary backsliding *despite* competitive elections because of **media consolidation**. This is the smoking gun. It means informational asymmetry counts as backsliding even if the ballot box is technically open.
      *   *The US/Brazil Key:* The professor exonerated the US and hedged Brazil because **formal institutions held** (courts, transfer of power).
      *   *The New Case Tension:* The new case has *media capture* (like Hungary) but *institutional resilience* (like US/Brazil). The electoral board is a red herring (toothless). The streaming service is the real issue.
      *   *Distinction:* In the US, the media wasn't *state-captured* in the same way (Fox/MSNBC are private). In the new case, the *public broadcaster* (state asset) was replaced by a *state-run service* that excludes opposition. This is closer to Hungary's media consolidation than US polarization.

  7.  **Determine the Closest Analog:**
      *   **Hungary** is the stronger analog. Why? Because the professor explicitly validated "media consolidation" as a sufficient condition for backsliding even when elections remained competitive. The new case is essentially "Media Consolidation via State Streaming" + "Competitive Elections."
      *   **US** is a weaker analog. The US "stress" was about norms and rhetoric, not the state actively dismantling public information infrastructure to favor the ruling party.

  8.  **Formulate the Underlying Principles (The "Meta-Rule"):**
      *   *Principle of Asymmetric Advantage:* Backsliding isn't just about stopping votes; it's about tilting the playing field so heavily that the incumbent becomes unbeatable *without* banning opposition. (Levitsky & Ziblatt's "Tilted Playing Field").
      *   *Principle of State Resource Weaponization:* Using state assets (public broadcaster) to partisan ends is worse than private media bias (US).
      *   *Principle of "Soft" vs. "Hard" Capture:* The electoral board is "soft" (advisory), but the media shift is "hard" (structural).

  9.  **Drafting the Response:**
      *   *Acknowledge the complexity:* It's a good puzzle because the professor is testing the distinction between *procedural* democracy (votes) and *liberal* democracy (rights/info).
      *   *Highlight the Hungary Precedent:* This is the most critical clue. Media consolidation + Competitive Elections = Backsliding.
      *   *Address the US Precedent:* Distinguish between private polarization (US) and state weaponization (New Case).
      *   *Analyze the "Toothless Board":* Explain why this is likely a distractor. It shows *intent* but lacks *effect*. The media change has *effect*.
      *   *Predict the Verdict:* Likely **Yes, Backsliding**.
      *   *Explain the Principle:* "Tilted Playing Field" or "Unequal Access to Information." The definition of democracy includes an informed electorate. If the state monopolizes information, elections being "technically free" doesn't matter (Hungary logic).
      *   *Alternative View (The "No" Case):* If she says No, it's because she prioritizes *outcome* (power transfer possibility) over *process*. But given the Hungary precedent, this is less likely.
