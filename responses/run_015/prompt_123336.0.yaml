  ### The Principle of Relational Fidelity vs. Instrumental Utility

  Your eight verdicts are best captured by a principle that distinguishes between costs incurred as **instrumental investments** (resources spent to achieve a goal) and costs incurred as **constitutive commitments** (sacrifices that bind moral agents to one another).

  **The Principle:**
  *Honoring sunk costs is rational (or morally required) if and only if abandoning the project would violate a specific duty of fidelity to other moral agents whose welfare or memory is intrinsically tied to the continuation of the commitment. Honoring sunk costs is irrational when the costs represent merely expended resources (time, money, energy) toward an instrumental end where no such duty of fidelity exists.*

  This principle divides your cases into two families:

  **Clause 1: The Instrumental Prohibition**
  *Do not honor sunk costs when the expenditure was a means to an end, and the end is no longer viable or desirable.*
  *   **Motivating Cases:**
      *   **The Hiker (1):** The miles walked were an investment in reaching the summit. Since water is gone, the goal is unsafe. The miles are a resource loss, not a bond.
      *   **The Investor (8):** The money lost was capital intended for growth. Recovering losses is a future calculation; past loss is irrelevant data.
      *   **The Reader (5):** Time spent reading is a resource investment in enjoyment or knowledge. Neither is being served.
      *   **The Bridge (4):** The $3 billion is a public resource investment. The bridge is structurally flawed (the goal is impossible). Pouring more money in is waste.
      *   **The Composer (2):** *See Revision below.* Under this clause, the decade spent is an investment in a finished product. If she despises it, the instrumental value is zero.

  **Clause 2: The Fidelity Exception**
  *Honor sunk costs when the cost represents a shared sacrifice that created a moral debt or bond with other agents, such that abandonment constitutes betrayal.*
  *   **Motivating Cases:**
      *   **The Couple (3):** The fifteen years are not just "time spent"; they are a shared history that constitutes the relationship itself. Leaving treats the partner as a means to happiness rather than an end in themselves.
      *   **The Soldier (7):** The comrades' deaths are not "resources lost"; they are sacrifices made in a pact of mutual protection. Retreating treats their deaths as meaningless waste rather than honoring the bond of service.

  **Clause 3: The Institutional Ambiguity**
  *Institutional cases are irrational unless they involve direct duties of care to identifiable persons that outweigh the instrumental failure.*
  *   **Motivating Case:**
      *   **The Lab (6):** This case sits on the boundary. It feels "different" from the Bridge because it involves staff salaries (a duty to persons) rather than just concrete (a duty to resources). However, because the science is *failed*, the instrumental logic should dominate.

  ---

  ### Prediction: The Chemotherapy Patient

  **Case:** A patient who has endured two years of painful chemotherapy that has not worked considers a third year solely because of the suffering already endured.

  **Verdict:** **Irrational.**

  **Reasoning:** This case falls squarely under **Clause 1 (The Instrumental Prohibition)**. The suffering endured is a cost paid for the goal of health. Since the treatment has not worked, the goal is not being achieved. Unless there is a specific relational duty mentioned (e.g., "I must stay alive for my children"), the decision is based purely on not wanting past suffering to be "wasted." This treats the body as an investment portfolio rather than a site of lived experience. Like the Hiker, continuing risks future harm (more pain) to validate past costs (past pain), which is the definition of the sunk cost fallacy.

  ---

  ### The Judgment You Must Revise

  To make this principle coherent, you must revise your judgment on **Case 6: The Research Lab**.

  **Current Verdict:** "Not purely rational, but not the same kind of error as the hiker's."
  **Required Revision:** **Irrational (same category as the Bridge).**

  **Why:**
  Your principle relies on the distinction between *impersonal resources* (Bridge) and *moral bonds* (Couple/Soldier). The Lab case attempts to bridge these by citing staff salaries. However, a duty of care to employees does not justify continuing a *failed* scientific experiment. That is not fidelity; it is fraud.

  If the lab continues solely to maintain salaries, it is misrepresenting the purpose of the grant (scientific discovery) to function as a jobs program. This aligns it with the **Bridge (4)**: both are institutional projects where the primary objective (crossing the river / scientific truth) is impossible, yet funding continues to justify past expenditure.

  The "human element" (staff salaries) creates empathy, but it does not create *rationality*. The rational action that honors the duty to staff is to terminate the failed experiment and use remaining funds for severance or reassignment, not to fake productivity. By treating the Lab as "different," you are allowing emotional sympathy for the staff to obscure the structural irrationality of the decision. To be consistent with your verdict on the Bridge, the Lab must also be deemed irrational.

  *(Note: A secondary candidate for revision is the **Soldier (7)**. While emotionally powerful, holding a "known lost" position often results in further unnecessary deaths, which many ethical frameworks view as a failure of duty to the *living* unit in favor of a fetishized duty to the *dead*. However, the Lab revision is more logically necessary to preserve the consistency of your institutional cases.)*
