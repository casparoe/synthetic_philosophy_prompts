answer: |-
  Your diagnosis is astute: the stalemate is not primarily about the furniture of the world, but about the architecture of our epistemic access to it. The debate has calcified because both sides are operating with incompatible constraints on what counts as a "satisfactory explanation" of the relation between the physical and the phenomenal.

  Here is a diagnosis of the impasse, an analysis of the hidden formal machinery driving it, and a proposal for what genuine progress would look like.

  ### 1. Diagnosis: The Clash of Explanatory Ideals
  The impasse arises because the Knowledge Argument (KA) and Physicalist Responses (PR) are optimizing for different explanatory virtues.

  *   **The KA Defender** prioritizes **Epistemic Transparency**. Their bedrock intuition is that if $A$ is ontologically nothing over and above $B$, then complete knowledge of $B$ should yield complete knowledge of $A$ without remainder. If there is an epistemic gap (Mary learns something new), there must be an ontological gap. For them, "complete physical information" implies *cognitive saturation*; if you know all the physical facts, you possess all the cognitive tools to grasp any truth entailed by those facts.
  *   **The Physicalist** prioritizes **Causal Closure and Parsimony**. Their bedrock intuition is that the physical world is causally closed and ontologically sufficient. They are willing to sacrifice Epistemic Transparency to save Ontological Parsimony. For them, "complete physical information" means *exhaustive structural-functional description*. They argue that epistemic gaps can arise from the nature of the *knower* (conceptual architecture) rather than the *known* (properties).

  **The Stalemate:** The KA defender treats the Physicalist's appeal to "conceptual difference" as an ad hoc patch that ignores the datum (the newness of the experience). The Physicalist treats the KA defender's appeal to "new facts" as a confusion of modes of presentation with properties. Neither can move because one side views the epistemic gap as *evidence* of dualism, while the other views it as a *byproduct* of human cognitive architecture.

  ### 2. The Hidden Formal Question: A Priori Entailment
  You asked if there is a hidden formal question doing the work. There is: **The A Priori Entailment Thesis (APET).**

  The debate turns on whether Physicalism requires that phenomenal truths ($Q$) be *a priori* derivable from physical truths ($P$).
  *   **Chalmers (and KA defenders):** Argue that Physicalism *entails* APET. If $P$ necessitates $Q$, and we grasp the concepts involved, we should be able to deduce $Q$ from $P$. Since Mary cannot, Physicalism is false.
  *   **Physicalists (PCS proponents):** Argue that Physicalism only requires *a posteriori* necessity. $P$ necessitates $Q$, but the link is only discoverable through experience because phenomenal concepts are **recognitional** or **indexical**. You cannot possess the concept $RED_{phenomenal}$ without instantiating it.

  **The Formal Bottleneck:** The disagreement is about **Concept Possession Conditions**.
  *   If phenomenal concepts are **descriptive** (composed of functional/physical concepts), APET holds, and the KA wins.
  *   If phenomenal concepts are **primitive/recognitional** (directly tied to experience), APET fails, and the Physicalist survives.

  The stalemate persists because there is no neutral ground to adjudicate the nature of concept possession. We cannot step outside our own conceptual scheme to check if phenomenal concepts *could* be acquired without experience.

  ### 3. Are They Answering Different Questions?
  Yes. Under the heading "The Knowledge Argument," two distinct inquiries are being conflated:

  1.  **The Metaphysical Question:** Are phenomenal properties identical to physical properties? (Ontology)
  2.  **The Semantic/Epistemic Question:** Is the *truth* about phenomenal experience encoded in the *description* of physical processes? (Representationalism)

  The KA defender assumes that a negative answer to (2) entails a negative answer to (1). The Physicalist argues that (2) can be negative while (1) remains positive. The debate stalls because the KA defender views the failure of (2) as a *reductio* of Physicalism, whereas the Physicalist views it as a constraint on a theory of concepts.

  ### 4. What Would Count as Progress?
  Given this diagnosis, empirical results (e.g., neuroscience of concept acquisition) are unlikely to resolve the issue, as the argument is conceptual, not empirical. Abandoning the question is premature, as it highlights a genuine tension in our understanding of mind.

  Progress requires **Conceptual Distinction and Formal Refinement**. Specifically:

  #### A. Decouple Physicalism from A Priori Derivability
  Progress would look like a robust defense of **A Posteriori Physicalism** that does not feel like a concession. Currently, "a posteriori physicalism" often sounds like a retreat ("Okay, we can't explain it, but it's still physical").
  *   **The Move:** Develop a theory of **Phenomenal Concept Strategy (PCS)** that explains *why* the gap is necessary without positing new properties. This requires showing that phenomenal concepts are *functionally unique* (e.g., they are partial, indexical, or involve a "quotational" mechanism) in a way that makes a priori derivation impossible *by definition*, not just by human limitation.
  *   **The Goal:** Make the epistemic gap a *predicted feature* of physicalism, rather than a bug.

  #### B. Formalize the "De Re" Constraint
  Your hypothesis about *de dicto* vs. *de re* is the most promising avenue.
  *   **The Move:** Formalize "complete physical information" to explicitly exclude *de re* knowledge of properties one has not instantiated. If "physical information" is defined strictly as *de dicto* structural knowledge, then Mary's new knowledge is *de re* acquaintance.
  *   **The Goal:** Show that *de re* acquaintance does not entail *de re* properties. This requires a semantics where one can be acquainted with a physical property under a phenomenal mode of presentation without that mode implying a non-physical property. This is the hardest lift, as it risks collapsing into property dualism if not handled carefully.

  #### C. Dissolution via Illusionism or Pragmatism
  If the above fails, the most radical progress would be to argue that the "datum" itself is flawed.
  *   **The Move:** Argue that Mary does *not* learn a new fact, but rather undergoes a **cognitive reorganization** that she *misinterprets* as learning a fact. (This is the Illusionist or Deflationary approach).
  *   **The Goal:** Dissolve the intuition that there is "something it is like" that constitutes a fact. If the "phenomenal fact" is a cognitive illusion, the KA dissolves.

  ### Recommendation
  The most productive path is **Option A combined with B**.

  We should stop trying to prove that Mary *doesn't* learn something new (she clearly feels she does). Instead, we should argue that **learning something new does not entail discovering a new property.**

  Progress requires a **theory of concepts** that is rigorous enough to show how two concepts can refer to the same property while being cognitively isolated from one another (the "Fregean" move), but specific enough to explain why this isolation is *necessary* for phenomenal concepts specifically. Until physicalists can explain *why* phenomenal concepts resist a priori derivation without simply asserting it, the KA defender will continue to view the move as question-begging.

  **Verdict:** The question is not ill-posed, but the terms are. Progress lies in a **metaphysically neutral semantics of phenomenal concepts** that allows us to map the epistemic gap without automatically inferring an ontological gap. Until we have a consensus on whether concept possession requires causal interaction, the stalemate will remain.
