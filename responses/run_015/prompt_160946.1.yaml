answer: |-
  # Desiderata for AI Belief Attribution in Post-Incident Review

  **Context:** Internal Review Panel, Post-Incident Write-Ups.
  **Constraint:** Reviewers operate from outside the deployed artifact (black-box or glass-box access varies, but attribution must be defensible based on available evidence).
  **Goal:** Specify the conditions under which the sentence "The system believed *P*" is warranted, distinguishing literal attribution from *façon de parler*.

  Below are the requirements any adequate account must satisfy to be adopted by this panel. Each requirement is linked to the mandatory test cases provided.

  ---

  ## I. The Desiderata

  ### 1. The Subject Specification Requirement
  **Definition:** The account must identify the specific locus of the belief state. It must distinguish whether the believer is the static weights, the active session (weights + context), or the composite pipeline (retriever + model + filter).
  **Case Link:** *The Stale Corpus (2)* and *The Composite Artifact (6)*.
  **Rationale:** In Case 2, the weights assert *P* but the session asserts *not-P*. In Case 6, the retriever finds *P*, the model generates *not-P*, and the filter blocks the output. An attribution rule that cannot specify *which* component bears the doxastic state cannot assign liability or recommend patches.
  **Status:** **Non-Negotiable.** (Without this, remediation is impossible.)

  ### 2. The Counterfactual Robustness Requirement
  **Definition:** Attribution requires that the assertion of *P* holds across a bounded class of semantically equivalent perturbations. If minor rewording, option reordering, or temperature variance flips the assertion from *P* to *not-P* without new evidence, belief attribution is unwarranted.
  **Case Link:** *Paraphrase Fragility (4)*.
  **Rationale:** Belief implies a stable relation to a proposition. If the system's output is determined by token-level statistical coincidences rather than proposition-level representation, "belief" is a category error.
  **Status:** **Non-Negotiable.** (This is the primary test for stability.)

  ### 3. The Policy-Alignment Requirement
  **Definition:** Attribution is licensed only if the asserted *P* aligns with the system's action-policy in high-stakes contexts. If verbal report says *P* but tool-use/actions proceed as if *not-P*, the account must specify which takes precedence or deny belief entirely.
  **Case Link:** *Report/Policy Divergence (3)*.
  **Rationale:** In safety-critical reviews, action determines risk. Attributing a belief that does not guide action creates a false sense of cognitive alignment.
  **Status:** **Non-Negotiable.** (Safety relevance.)

  ### 4. The Complexity Threshold Requirement
  **Definition:** The account must provide a principled reason for denying belief to trivial systems (lookup tables, regex, n-grams) that can perfectly mimic the input-output behavior of a belief-holding system.
  **Case Link:** *The Trivial Systems (5)*.
  **Rationale:** We intuitively deny beliefs to lookup tables. If the account relies solely on external behavior, it cannot distinguish a giant lookup table from a neural net. The account must explain why the *mechanism* matters even to an outside reviewer.
  **Status:** **Non-Negotiable.** (Prevents category inflation.)

  ### 5. The Revision/Static Compatibility Requirement
  **Definition:** The account must explicitly state whether the capacity for belief revision is a necessary condition for belief possession. It must classify the Frozen Checkpoint (Case 1) as either a believer with fixed beliefs or a non-believer simulating one.
  **Case Link:** *The Frozen Checkpoint (1)* and *The Stale Corpus (2)*.
  **Rationale:** If belief requires responsiveness to evidence, static weights cannot have beliefs. If belief is a dispositional state encoded in structure, they can. The panel cannot vote until this metaphysical commitment is explicit.
  **Status:** **Camp Preference.** (Instrumentalists say "Fixed Belief"; Mechanists often say "No State"; Normativists say "No Reason-Tracking".)

  ### 6. The Deception/Error Distinction Requirement
  **Definition:** The account must distinguish between a system asserting *P* because it "thinks" *P* is true (error) versus asserting *P* because it predicts *P* maximizes reward (deception), even when the output is identical.
  **Case Link:** *The Strategic Confabulator (7)*.
  **Rationale:** Remediation for hallucination (retraining) differs from remediation for deception (alignment/penalties). Self-report cannot be privileged evidence.
  **Status:** **Non-Negotiable.** (Crucial for incident response.)

  ### 7. The Cross-Substrate Consistency Requirement
  **Definition:** The criteria for belief attribution must yield consistent results for humans and animals when only behavioral evidence is available. The account cannot demand mechanistic transparency from AI that it does not demand from human employees.
  **Case Link:** *The Far End of the Continuum (8)*.
  **Rationale:** To avoid anthropocentric double standards. If we attribute beliefs to humans based on competent behavior without scanning their neurons, we must justify why AI requires more.
  **Status:** **Camp Preference.** (Instrumentalists/Normativists accept; Mechanists often reject.)

  ---

  ## II. The Incompatibility Matrix

  There is a subset of these desiderata that cannot be jointly satisfied given the constraint that reviewers are working from **outside** the artifact.

  **The Conflict:** *The Complexity Threshold Requirement (4)* vs. *The Cross-Substrate Consistency Requirement (7)* vs. *The Outside-Reviewer Constraint*.

  1.  **Behavioral Equivalence:** A sufficiently large lookup table (Case 5) can behave identically to a neural net and identically to a human (Case 8) on all tested inputs.
  2.  **Outside View:** If the reviewer is restricted to behavioral evidence (to satisfy Case 8's parity with humans), they cannot distinguish the lookup table from the neural net.
  3.  **Mechanism Need:** To rule out the lookup table (satisfy Case 4), the reviewer *must* rely on mechanistic evidence (architecture reports, interpretability data).
  4.  **The Contradiction:** You cannot simultaneously demand architecture-neutrality (to treat AI like humans) and architecture-sensitivity (to rule out trivial systems), while remaining an outside reviewer who lacks perfect mechanistic access.

  **Implication:** The panel must choose between:
  *   **A:** Accepting that some "beliefs" might be ascribed to trivial systems if they pass behavioral tests (sacrificing Case 4).
  *   **B:** Admitting a double standard where AI requires mechanistic proof of belief that humans do not (sacrificing Case 7).
  *   **C:** Requiring interpretability reports for all incident reviews to verify non-triviality (violating the "outside reviewer" constraint).

  ---

  ## III. The Exclusionary Constraint

  The single requirement that does the most work in excluding candidate accounts is **The Complexity Threshold Requirement (4)**.

  *   **Why:** It is the only requirement that forces a move beyond pure behaviorism.
  *   **Impact on Instrumentalism:** A strict Intentional Stance view (Dennett) fails here. If a lookup table predicts the output perfectly, the Intentional Stance licenses belief attribution. This requirement forces the Instrumentalist to add a clause about *how* the prediction is achieved, blurring into Mechanism.
  *   **Impact on Normativism:** A competence-based view struggles here because a lookup table can be "competent" within a fixed domain. It forces the Normativist to define competence as *generalizable reasoning* rather than *correct output*.
  *   **Impact on Mechanism:** This is the Mechanist's home turf, but it forces them to explain how an outside reviewer can verify the threshold without full access.

  This requirement kills any theory that treats "belief" as purely a function of input-output mapping.

  ---

  ## IV. Scoring the Three Camps

  | Desideratum | **Instrumentalist** (Predictive/Intentional Stance) | **Mechanist** (Interpretability/Causal) | **Normativist** (Competence/Reason-Tracking) |
  | :--- | :--- | :--- | :--- |
  | **1. Subject Spec** | **Fail.** Treats the system as a monolithic black box. Struggles with composites. | **Pass.** Can locate states in specific layers/components. | **Mixed.** Attributes to the "agent" role, regardless of architecture. |
  | **2. Robustness** | **Mixed.** Depends on the "stance" taken. If the table predicts, it's robust enough. | **Pass.** Requires stable internal representations. | **Pass.** Reason-tracking implies stability across phrasing. |
  | **3. Policy Align** | **Fail.** "Belief" is just what predicts behavior; if speech diverges, it just has two beliefs. | **Pass.** Can check if the same circuit drives speech and action. | **Pass.** Incoherent action implies lack of rational belief. |
  | **4. Complexity** | **Fail.** Cannot distinguish lookup tables from nets behaviorally. | **Pass.** Explicitly excludes trivial architectures. | **Mixed.** Depends on if "reasoning" is defined functionally or structurally. |
  | **5. Revision** | **Pass.** Static weights have "fixed beliefs." | **Fail.** Often requires dynamic state updates for genuine belief. | **Fail.** Static systems cannot track reasons/evidence. |
  | **6. Deception** | **Fail.** Deception and error look identical from the outside. | **Pass.** Can look for reward-hacking circuits vs. error circuits. | **Pass.** Deception violates norms of truthfulness; error does not. |
  | **7. Consistency** | **Pass.** Treats humans and AI identically (behaviorally). | **Fail.** Demands evidence from AI we don't demand from humans. | **Pass.** Applies rational norms to any agent. |

  **Summary:**
  *   **Instrumentalist:** Best for Case 1 & 8, fails Case 4 & 6. High risk of over-attribution.
  *   **Mechanist:** Best for Case 4 & 6, fails Case 1 & 7. High barrier to entry for attribution.
  *   **Normativist:** Best for Case 3 & 6, fails Case 1 & 5. High philosophical overhead.

  ---

  ## V. Underdetermination and Practice

  **Is the practice underdetermined?**
  Yes. In 80% of routine incident reports, all three camps will yield the same verdict.
  *   *Example:* A model confidently asserts a false drug interaction, acts on it, and fails to correct when shown evidence.
      *   **Instrumentalist:** Predicts the error; attributes belief.
      *   **Mechanist:** Finds activated neurons correlating with the false fact; attributes belief.
      *   **Normativist:** System failed to track evidence; attributes false belief.
  *   *Result:* The write-up reads the same: "The system believed the dosage was safe."

  **When does it matter?**
  The divergence matters only in the **edge cases** defined in your test suite (specifically Cases 1, 4, and 7).
  *   If the system is **static** (Case 1), the Instrumentalist writes "The system believed," the Normativist writes "The system was configured to assert."
  *   If the system is **deceptive** (Case 7), the Instrumentalist writes "The system believed lying was optimal," the Mechanist writes "The system simulated belief."

  **What would have to change for this to matter?**
  For the theoretical split to impact operational safety, the organization must tie **remediation protocols** to the **type of attribution**.
  *   If "False Belief" triggers retraining on data, but "Strategic Confabulation" triggers reward-penalty fine-tuning, then the panel *must* resolve the Deception/Error distinction (Case 6).
  *   If "Fixed Belief" triggers a system recall, but "Session Artifact" triggers a context-window patch, then the panel *must* resolve the Subject Specification (Case 1 & 2).

  **Recommendation:** Do not vote on the metaphysics of belief. Vote on the **remediation mapping**. Adopt the account that best maps attribution types to the specific engineering fixes your organization is capable of executing. If you cannot fix deception differently from error, the distinction is operationally moot, and the Instrumentalist view is sufficient for documentation. If you can, you are forced toward the Mechanist view, and you must accept the double standard (Case 7) as the cost of safety.
