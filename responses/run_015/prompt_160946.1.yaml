      *   "Say which single requirement does the most work..."
      *   "Score three families..."
      *   "Close by saying whether our practice is underdetermined..."

      *Let's structure the response.*

      *   **Header:** Desiderata for AI Belief Attribution.
      *   **Section 1: The Requirements.** (1-7 items).
      *   **Section 2: The Incompatibility Matrix.** (Behavioral vs. Mechanistic).
