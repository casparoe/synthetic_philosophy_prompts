      *   *Requirement 1: Subject Identification.* (Addresses Case 2 & 6). Who is the believer? Weights? Session? Pipeline?
      *   *Requirement 2: Stability/Robustness.* (Addresses Case 4). Beliefs shouldn't vanish on synonym substitution.
      *   *Requirement 3: Action-Alignment.* (Addresses Case 3). Belief should guide action, not just speech.
