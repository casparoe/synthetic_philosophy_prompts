answer: |-
  # PART I: THE PROCEDURE
  **Title:** Inter-Generational Capital Allocation Protocol (ICAP)
  **Applicability:** All capital proposals with benefits or costs extending beyond 10 years.
  **Time Allowance:** 45 minutes for Committee review; 15 minutes for documentation.

  ### 1. The Discount Rate Screening (The "Why" Check)
  *Current Practice:* Apply 5% to all cash flows and benefits.
  *New Practice:* The Committee must select which components justify the discount rate for **this specific proposal**. Check all that apply. If a box is checked, the rate must be justified by that factor.

  *   **[ ] Opportunity Cost of Capital:** Money spent here cannot be invested elsewhere (e.g., in state bonds or reserve funds) to earn a return for residents.
      *   *Justification:* Requires evidence of an alternative investment yield available to the Authority.
  *   **[ ] Expected Wealth Growth:** Future residents will be wealthier than current residents; therefore, a dollar of benefit is worth less to them (diminishing marginal utility).
      *   *Justification:* Requires reference to regional income growth projections.
  *   **[ ] Risk of Non-Delivery:** There is a genuine probability the benefit will not materialize (e.g., technology failure, climate change rendering the asset useless, Authority dissolution).
      *   *Justification:* Requires a specific risk percentage (e.g., "10% chance of inundation exceeding design").
  *   **[ ] Pure Time Preference:** A benefit is intrinsically worth less simply because it occurs later, regardless of who receives it or how wealthy they are.
      *   *Justification:* **Requires passing the Consistency Check below.**

  ### 2. The Consistency Check (The "Who vs. When" Test)
  *Purpose:* To validate any selection of "Pure Time Preference" above.
  *Instruction:* Answer Yes or No.

  **Question:** If we discount a health or safety benefit because it arrives in 2060 rather than 2030, would we equally accept discounting that same benefit if it arrived in 2060 to a child born this year rather than to a sixty-year-old alive today?

  *   **[ ] YES:** We believe the *date* is what reduces the value. (This confirms Pure Time Preference. Note: This implies a 90-year-old in 2060 matters less than a 60-year-old in 2030 solely due to the calendar.)
  *   **[ ] NO:** We believe the *person* or the *uncertainty* is what reduces the value. (This invalidates Pure Time Preference. You must rely on Wealth Growth or Risk instead.)

  *Rule:* If the Committee answers **NO**, the "Pure Time Preference" box in Section 1 must be unchecked. The discount rate must be lowered to reflect only Opportunity Cost and Risk.

  ### 3. Discounting Rules (The "What" Check)
  *Purpose:* To prevent applying financial rates to non-financial values.

  *   **Financial Flows (Construction, Maintenance, Tax Revenue):** Discount at the Authority's cost of borrowing (currently ~5%).
  *   **Health and Safety Benefits (Lives Saved, Lead Exposure, Injury Avoidance):**
      *   Do **not** discount for Wealth Growth (we do not assume future lives are worth less).
      *   Do **not** discount for Pure Time Preference (a life saved in 2060 equals a life saved in 2030).
      *   **Only** discount for Risk of Non-Delivery.
      *   *Procedure:* Calculate these benefits in real, undiscounted counts first. Apply a risk adjustment only if the asset's reliability degrades over time.
  *   **Endogenous Existence (The "Build It and They Will Come" Rule):**
      *   If the project (e.g., a levee) makes habitation possible, count the safety benefits for the residents who occupy the area, even if they are unborn.
      *   **Constraint:** Do not count population *growth* as a benefit. Count the safety of the *actual* projected population. If the project induces risky development, note this as a negative externality in the "Board Hand-off" section.

  ### 4. Stopping Rules (The Decision Matrix)
  *Purpose:* To define when the Committee decides and when the Board must decide.

  *   **Rule A (Hard No):** If Financial Costs > Financial Benefits *and* Safety Benefits are negligible (e.g., administrative IT upgrade with no resilience gain).
      *   *Action:* Committee recommends Rejection.
  *   **Rule B (Numeric Yes):** If Financial NPV > 0 using the screened rate *and* Safety Benefits are positive *and* the time horizon is < 50 years.
      *   *Action:* Committee recommends Approval.
  *   **Rule C (Board Hand-Off):** The Committee must **not** issue a numeric recommendation if:
      1.  **Horizon > 50 Years:** The legal mandate requires counting unborn residents, but our financial certainty drops after 50 years.
      2.  **Rate Sensitivity:** The NPV flips from positive to negative if the rate moves from 3% to 5%.
      3.  **Ethical Trade-off:** The proposal exchanges current tax relief for future safety risk (Intergenerational Transfer).
      4.  **Truncation:** Significant benefits occur after year 50.
      *   *Action:* Committee submits a "Value Judgment Memorandum." We provide the numbers under two scenarios (3% and 5%), state the truncation error, and explicitly state: *"The Committee cannot mathematically resolve the weight of benefits accruing to residents not yet born. This is a policy choice for the Board."*

  ***

  # PART II: BOARD MEMORANDUM
  **TO:** The Elected Board
  **FROM:** Investment Committee
  **SUBJECT:** Application of New Inter-Generational Capital Allocation Protocol (ICAP)
  **DATE:** October 26, 2023

  **Overview:**
  Per the legal mandate to account for unborn residents, the Committee has adopted a new screening procedure. We are no longer applying a flat 5% rate with a 50-year cutoff to all proposals. Below are the results for three pending proposals. In two cases, the procedure yields results that conflict with prior intuition. In one case, the procedure explicitly returns the decision to you.

  ### Proposal 1: Lead Service Line Replacement (Oldest District)
  *   **Scope:** Replace remaining lead lines. High cost now; health benefits over 40 years.
  *   **ICAP Analysis:**
      *   **Discount Rate:** We unchecked "Pure Time Preference" and "Wealth Growth" for health benefits. A child's neurological development in 2050 is not worth less than a child's in 2024. We applied a 0% discount rate to health outcomes, and 5% only to construction costs.
      *   **Horizon:** 40 years (Within 50-year limit).
      *   **Result:** **Recommend Approval.**
  *   **Uncomfortable Truth:** Under the old 5% flat rate, this project barely passed. Under the new protocol, it passes easily. This admits that our old method systematically undervalued children's health. If challenged in court, we can no longer claim "market rates" justify devaluing future health. We are now explicitly stating that health benefits are not financial assets.

  ### Proposal 2: Voluntary Buyout (Flood-Prone Neighborhood)
  *   **Scope:** Buyout homes to eliminate risk. Benefits over 80 years. Population shrinking.
  *   **ICAP Analysis:**
      *   **Discount Rate:** 5% for financial costs (avoided damage claims). 0% for safety (lives saved).
      *   **Horizon:** 80 years. This exceeds the 50-year truncation.
      *   **Result:** **Board Hand-Off (Rule C).**
  *   **Uncomfortable Truth:** The old procedure ignored years 51–80 entirely. This violated the legal mandate to count unborn residents. The new procedure counts them. However, at 5%, benefits in years 60–80 are mathematically negligible. At 2%, they are significant. Because the NPV flips depending on the rate chosen for the far future, and because the population is shrinking (reducing the "Wealth Growth" argument), we cannot give you a single number.
  *   **What We Cannot Settle:** We cannot tell you how much a flood avoided in 2090 is worth today. The math breaks down. You must decide if the Authority's obligation extends 80 years into the future, and if so, at what cost of capital.

  ### Proposal 3: Spillway Upgrade Deferral
  *   **Scope:** Defer upgrade 8 years to lower current taxes. Shifts failure risk to 40–60 years out.
  *   **ICAP Analysis:**
      *   **Discount Rate:** 5% for tax savings (Current residents). 5% for risk cost (Future residents).
      *   **Ethical Trade-off:** This is a pure intergenerational transfer. Current residents pay less; future residents bear higher risk.
      *   **Result:** **Board Hand-Off (Rule C - Ethical Trade-off).**
  *   **Uncomfortable Truth:** The procedure flags this as a "Value Judgment." Mathematically, discounting the future risk at 5% makes the deferral look cheap (the risk costs pennies on the dollar in present value). **The procedure forces us to state that this calculation is morally incomplete.** Discounting a catastrophic risk because it happens to people not yet born is functionally identical to discounting it because it happens to poorer people.
  *   **What We Cannot Settle:** We cannot calculate the "price" of betting against the safety of future residents. The model says "Deferral has positive NPV." The Protocol says "This requires public ownership of the risk transfer."

  ***

  # PART III: PLAIN STATEMENTS OF LIMITATION

  **1. The Uncomfortable Truths**
  *   **On Lead Lines:** Our old 5% rate was too high for health. We were effectively saying a health benefit to a future resident is worth half as much as one to a current resident. The new procedure corrects this, which increases our liability for health-based projects.
  *   **On the Buyout:** Our old 50-year cutoff was illegal under our mandate. We were ignoring the "unborn residents" we are legally required to count. Extending the horizon makes the buyout look better, but introduces massive uncertainty about costs in 2090.
  *   **On the Spillway:** The math favors deferral. The ethics forbid it. The procedure forces us to admit that using a discount rate to minimize future catastrophic risk is a policy choice, not an economic finding.

  **2. What The Procedure Cannot Settle**
  *   **The Rate in 50 Years:** We do not know what the cost of capital will be in 2070. We use 5% as a placeholder, but if rates fall to 1%, long-term projects become vastly more valuable. We cannot solve this uncertainty; we can only expose it.
  *   **The Value of Existence:** The procedure counts safety for future residents, but it cannot determine if inducing them to live in a protected flood zone (by building the levee) is a net social good. We count their safety, but we cannot count their existence as a "benefit" to justify the cost.
  *   **The Political Mandate:** We can calculate the cost of risk, but we cannot calculate the political cost of a tax increase today versus a flood tomorrow. That is your domain.

  **Recommendation:**
  Adopt the ICAP procedure immediately. For Proposal 1, proceed. For Proposals 2 and 3, schedule a public work session. The Board must go on record regarding the weight of benefits beyond 50 years and the acceptability of intergenerational risk transfer. The Committee will not provide cover for those decisions using discount rates.
