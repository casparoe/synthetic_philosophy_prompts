  *   If I discount because of *time* (pure time preference), it doesn't matter who gets it. 2060 is discounted relative to 2030 regardless of person.
  *   If I discount because of *wealth* (future people richer), then it matters. A 2060 child might be richer than a 2030 elder? No, usually we assume aggregate growth.
