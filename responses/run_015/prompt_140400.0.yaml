prompt: |-
  I chair the investment committee of a small regional drainage and flood-risk authority. We rank twenty to thirty capital proposals a year — levee raises, pump replacements, voluntary buyouts, lead service line replacement — under a legal mandate that benefits to residents who have not been born yet must be counted. Our current practice is crude: discount everything at a single 5 per cent "market" rate and ignore whatever falls after year fifty. Three of us, none an economist, have about an hour per proposal, and our recommendations go to an elected board that must defend them in public and could be challenged in court, so I need a written procedure we can rerun, not case-by-case intuition.

  Please give me that procedure in four parts. First, a screening step that separates the four things people conflate inside a discount rate — the productivity of capital (a dollar not spent now could instead earn a return for residents), the expectation that future residents will be richer so an extra dollar matters less to them, genuine risk that the benefit never arrives at all (including the risk that the authority itself will not exist to deliver it), and pure time preference, meaning weighting a benefit less purely because it comes later — and that makes us state, for each proposal, which of those we are actually applying. Second, a consistency check on pure time preference specifically: if we discount a health or safety benefit because it arrives in 2060 rather than 2030, would we equally accept discounting that same benefit if it arrived in 2060 to a child born this year rather than to a sixty-year-old alive today? It seems to me that a positive pure rate commits us to saying yes, and I want the procedure to force us to confront that. Third, rules about what gets discounted at all: whether lives, health and irreplaceable assets should share the money rate or run on a separate schedule, and how to treat a benefit whose recipients' existence depends on our own decision, since if we build the levee people move into the protected area and if we don't they never live here. Fourth, explicit stopping rules: where the procedure returns a hard no, where it returns a number, and where it must stop and hand the choice to the board as a value judgment the board has to own in public — including how to handle truncation at some horizon year and our uncertainty about what the right rate will be in fifty years.

  Then run it on three live proposals and write up what we would put in front of the board. One: replacing the remaining lead service lines in the oldest part of the district, high cost now against health benefits spread over roughly forty years to today's residents and to the families who will occupy those houses later. Two: a voluntary buyout of a flood-prone neighborhood, large cost now against avoided damage and emergency response over eighty years, in a part of the district whose population is projected to shrink. Three: deferring a scheduled spillway upgrade for two budget cycles to hold this year's rate increase down, which shifts a low-probability, high-consequence failure risk forty to sixty years out and which the board is strongly inclined to defer. I expect the procedure to tell us something we would rather not hear in at least one of these; state that plainly, and state plainly what the procedure cannot settle for us.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the Request:**
      *   **User:** Chair of an investment committee for a small regional drainage/flood-risk authority.
      *   **Context:** 20-30 capital proposals/year (levees, pumps, buyouts, lead lines). Legal mandate to count benefits for unborn residents. Current practice is crude (5% discount rate, 50-year cutoff). Committee of 3 non-economists, ~1 hour/proposal. Recommendations go to an elected board (public defense, legal risk).
      *   **Goal:** A written, repeatable procedure (not intuition) in four specific parts.
      *   **Four Parts Required:**
          1.  *Screening Step:* Disaggregate the discount rate (productivity of capital, wealth growth, risk, pure time preference). Force statement of which is being applied.
          2.  *Consistency Check:* Specifically on pure time preference (intergenerational equity test).
          3.  *Discounting Rules:* What gets discounted (lives/health vs. money), endogenous existence (if we build, they come).
          4.  *Stopping Rules:* Hard no, numeric recommendation, or hand-off to board (value judgments, truncation, rate uncertainty).
      *   **Application:** Run the procedure on three specific live proposals (Lead Lines, Voluntary Buyout, Spillway Deferral).
      *   **Output Requirement:** Write up what goes in front of the board. State plainly if the procedure yields uncomfortable results. State plainly what the procedure cannot settle.

  2.  **Deconstruct the Four Parts (Drafting the Procedure):**

      *   *Part 1: Screening (The "Why" of Discounting).*
          *   Standard economics breaks the discount rate ($r$) into: $r = \rho + \eta g + \delta$.
          *   $\rho$: Pure time preference (impatience).
          *   $\eta g$: Wealth growth effect (future people richer, marginal utility lower).
          *   $\delta$: Risk of non-delivery (project failure, institution dissolution).
          *   Opportunity Cost: The return if money was invested elsewhere.
          *   *Task:* Create a checklist where the committee must tick which components justify the rate for *this specific project*.
      *   *Part 2: Consistency Check (The "Who" of Discounting).*
          *   The prompt asks about discounting based on *when* vs. *who*.
          *   If we discount 2060 benefits vs. 2030 benefits, are we saying the 2060 person matters less, or that the *time* matters less?
          *   *Task:* A specific question: "If this benefit occurred in 2060 for a person alive today (age 90), would we discount it the same as for a person born in 2040?" If No, then we are using wealth growth/risk, not pure time preference. If Yes, we are admitting pure time preference (which is ethically contentious for public safety).
      *   *Part 3: Discounting Rules (The "What" of Discounting).*
          *   *Lives/Health:* Should these be discounted at the financial rate? Usually, no. Or a lower rate.
          *   *Endogenous Population:* If the project creates the conditions for people to live there (levee), do we count their benefits? Yes, legally mandated ("unborn residents"), but need to avoid double-counting induced demand risks.
          *   *Task:* Define separate tracks for Financial Costs vs. Safety/Health Benefits.
      *   *Part 4: Stopping Rules (The "Decision").*
          *   *Hard No:* Negative NPV under all reasonable rates, or violates safety standards.
          *   *Numeric:* Clear positive NPV, low risk.
          *   *Board Hand-off:* High uncertainty, ethical trade-offs (e.g., deferring safety for taxes), truncation issues (benefits > 50 years).
          *   *Task:* Define thresholds.

  3.  **Develop the Three Case Studies:**

      *   *Case 1: Lead Service Lines.*
          *   Costs: High now.
          *   Benefits: Health (lead exposure) over 40 years.
          *   Recipients: Current + Future residents.
          *   *Application:* Health benefits shouldn't be heavily discounted. 5% might be too high for health. 50-year cutoff cuts off tail end.
          *   *Uncomfortable Truth:* If we use 5% on health, we undervalue children's health. If we use 0% on health, cost looks higher relative to benefits.
      *   *Case 2: Voluntary Buyout.*
          *   Costs: High now.
          *   Benefits: Avoided damage over 80 years.
          *   Context: Shrinking population.
          *   *Application:* 80 years exceeds 50-year cutoff. Current practice ignores years 51-80. Discounting at 5% makes far-future avoided damage worth almost nothing.
          *   *Uncomfortable Truth:* The current 50-year cap makes this project look bad, but the legal mandate requires counting unborn residents (80 years covers them). The procedure will force extending the horizon.
      *   *Case 3: Spillway Deferral.*
          *   Action: Defer upgrade 2 cycles (say 8-10 years).
          *   Benefit: Lower taxes now.
          *   Risk: Low prob, high consequence failure in 40-60 years.
          *   *Application:* This is intergenerational risk transfer. Saving money now (richer/same people) vs. risk to future people.
          *   *Uncomfortable Truth:* Discounting the future risk at 5% makes the risk look cheap. The procedure should flag this as a "Board Hand-off" because it's an ethical choice, not just math.

  4.  **Refining the Procedure (Iterative Polishing):**

      *   *Tone:* Professional, bureaucratic but ethically rigorous, actionable for non-economists.
      *   *Constraint:* 1 hour per proposal. The procedure must be a checklist/worksheet, not a thesis.
      *   *Legal Mandate:* Emphasize the "unborn residents" requirement. This conflicts with the 50-year cutoff.
      *   *Discount Rate Decomposition:* Keep it simple. 1. Opportunity Cost, 2. Wealth Growth, 3. Risk, 4. Impatience.
      *   *The "Child vs. Elder" Test:* Make this a explicit "Yes/No" box.

  5.  **Drafting the Content (incorporating the "Uncomfortable Truths"):**

      *   *Lead Lines:* The procedure will likely suggest a lower discount rate for health benefits (social rate of time preference vs. financial). This increases the NPV of health benefits but highlights that the current 5% financial rate is inappropriate for health.
      *   *Buyout:* The 50-year truncation is illegal per the mandate (unborn residents). The procedure forces extending to 80+ years. At 5%, years 50-80 are negligible. At 2%, they matter. This forces a rate choice.
      *   *Spillway:* This is the big one. Deferring safety for current taxpayers is essentially betting against future residents. The procedure should classify this as "Value Judgment" requiring Board ownership, not Committee recommendation.

  6.  **Final Review against Constraints:**
      *   Four parts? Yes.
      *   Three cases run? Yes.
      *   Board memo format? Yes.
      *   Plain statement of uncomfortable truths? Yes.
      *   Plain statement of limitations? Yes.

  7.  **Writing the Response:** (Self-Correction during drafting)
      *   *Correction:* Make sure I don't get too bogged down in economic theory. Keep it to a "Worksheet" style for Part 1-4.
      *   *Correction:* Ensure the "Endogenous Existence" point is handled carefully. If we build the levee, people move in. If we count their benefits, we might incentivize building in flood zones. But the mandate says count unborn. I need to balance "counting their safety" vs "induced risk." I will suggest counting the safety of *whoever is there*, but not assuming population growth as a *benefit* itself.
      *   *Correction:* The Spillway case is a "deferral." The risk shifts to 40-60 years out. Discounting makes that risk look tiny. The procedure must highlight this distortion.

  8.  **Final Polish:** Check the tone. It needs to be authoritative but humble about the limits of technocracy. (Proceed to generate output).

