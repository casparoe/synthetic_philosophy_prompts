  8.  **Synthesizing the "Why Be Moral" Conclusion:**
      *   Glaucon: Be moral to avoid punishment/chaos.
      *   Tolkien: Be moral because seeking to control others (even for good ends) destroys *you*. The "why" isn't social; it's existential.

