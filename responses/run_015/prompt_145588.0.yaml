      *   *Section 3: The Necessity Problem (Damaging).* Radical change in purpose. If a theology university becomes a coding bootcamp but keeps the charter, is it the same? Intuition often says "no."
      *   *Section 4: Collapse into Counterpart Theory.* If the "normative chain" is defined by similarity of rules, it's qualitative. If defined by causal history, it doesn't cross worlds.
      *   *Assessment of Unfalsifiability:* If the defender keeps adjusting what counts as "normative continuity" to match intuitions, it becomes ad hoc.

  6.  **Refining the "Normative Continuity" Definition:**
      *   The user specifies "normative continuity of governance and purpose."
