      *   7. Addict Relapse: Ambivalent. (Compulsion vs. Habit/Choice).
      *   8. Lucky Scientist: Praiseworthy. (Luck in traits doesn't negate desert).

      *   **The Core Tension (4 vs. 5):** Why is the guy with bad parents responsible (4) but the guy with the drug not (5)?
