      *Word Count Check:* Need to be concise.

      *Re-evaluating the "Smash/Theft correlation" vs "Window" distinction:*
      User hates the correlation case ("camera cuts out is usually theft"). User loves the window case ("draft visible").
      Difference: In the window case, there is *positive evidence* in the frame (draft) leading to the conclusion. In the correlation case, the *lack of evidence* (camera dead) is the predictor for the outcome.
      Principle needs to capture: **Positive Evidence vs. Absence Heuristic.**
      Actually, the user says "both go beyond what's on the screen using learned background knowledge."
      The distinction is likely: Does the inference rely on a *continuous physical track* of the diamond/environment, or does it rely on a *statistical link between observation quality and outcome*?
      Let's refine the selected principle to **Continuous Physical Tracking.**

      *Wait, one more constraint:* "Think carefully, and brainstorm two or three candidate principles before you settle on one — I want to see the ones you rejected."
