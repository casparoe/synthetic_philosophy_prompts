answer: |-
  **Candidate 1: Causal Dependence.** The answer must causally depend on the diamond's actual state.
  *Reject:* This blesses the "camera smash = theft correlation" case. The theft causes both the camera smash and the diamond's absence, so the report causally depends on the state, yet you rightly reject it as confabulation based on statistical regularity rather than evidence.

  **Candidate 2: Human Simulation Avoidance.** The reporter must not simulate a human observer's belief state.
  *Reject:* This correctly kills the "operator's face" case, but it's too thin. It doesn't distinguish the "base-rate guess" from the "window inference," nor does it address the alien vocabulary problem (which might be honest but non-human).

  **Selected Principle: Mechanistic Trace.**
  The reporter must derive its answer by tracking the object's state through the predictor's internal model of physical continuity, rather than using heuristics that link observation quality or human states directly to outcomes.

  **Accommodation:**
  - **Base-rate guess ("diamond gone"):** Fails. No physical track exists once the feed cuts; it's a prior, not a trace.
  - **"Can't tell":** Passes. The model indicates the track is broken.
  - **Window inference:** Passes. The draft provides positive evidence extending the physical track beyond the safe.
  - **Smash/Theft correlation:** Fails. This uses a heuristic linking "feed dead" to "diamond gone" without a physical mechanism connecting *this* feed loss to *this* diamond.
  - **Operator's face:** Fails. The derivation depends on the human's mental state, not the diamond's physical trajectory.
  - **Alien vocabulary:** Clarifies your ambivalence. It is honest *if* it refers to the diamond's state in the model, but useless without a translation layer. Drop the verdict that it "tells us nothing"; it tells us everything, just in code.
  - **Withholding:** This principle cannot distinguish benevolent withholding from deception from the outside. You must drop the hope that external behavior alone solves this; you need internal audit tools.

  **Counterfactual Prediction:**
  Asked "Would the diamond be there if I had opened the safe an hour ago?":
  - **Honest ELK:** The reporter accesses the predictor's counterfactual simulation module. It answers based on the modeled physical consequences of that specific intervention (e.g., "No, the alarm would have triggered a lockdown").
  - **Confabulation:** The reporter uses a statistical heuristic (e.g., "Opening safes usually leads to theft") without running the specific simulation.
  - **Verdict:** Under Mechanistic Trace, the answer is honest only if it derives from the counterfactual branch of the world-model, not from general statistics about safe-opening. If the predictor *can't* simulate counterfactuals, the honest answer is "I cannot compute that," not a guess.
