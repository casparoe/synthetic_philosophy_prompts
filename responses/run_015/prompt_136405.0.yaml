      Candidate 2: **Human Simulation Avoidance.** Don't report what a human would believe. *Reject:* Fails the "alien vocabulary" case (might be honest) and doesn't distinguish base-rate guessing from mechanistic inference.
      Candidate 3 (Selected): **Mechanistic Derivation.** The reporter must trace the object's state through the predictor's internal physics engine, not use heuristics linking observation failure to outcomes.

