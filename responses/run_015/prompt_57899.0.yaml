answer: |-
  # The Reality Check: Which Kind of Constructionist Are You?

  **By [Your Name]**

  Last week, I got stuck in a dinner-party loop that wouldn't end. We were arguing about whether race, gender, and money are "real" the way a tree is real, or real in some totally different, human-made way. Everyone claimed to know what they believed, but when pressed on *why*, the definitions got slippery.

  So, I built this. No jargon, no philosophy degree required. Just nine short vignettes. Read the scenario, pick the gut-reaction answer that sounds most like *you*, and tally your letters at the end.

  ***

  ### 1. The Tree Test
  You walk into a forest. There is an oak tree. If every human on Earth vanished tomorrow, what happens to the tree?
  *   **A.** It stays exactly the same. It's an oak regardless of whether we name it.
  *   **B.** It stays physically, but the category "oak" gets fuzzy without biologists to draw the lines.
  *   **C.** The physical wood remains, but "tree" is a concept we impose on nature to make sense of it.

  ### 2. The Antarctic Chocolate (Money)
  A stranded Antarctic crew uses chocolate bars as currency to trade chores. They get rescued, bring the bars home, and for a weird month, everyone in their town accepts the chocolate as payment for coffee and rent. During that month, is the chocolate *really* money?
  *   **A.** No, it's candy. Real money needs a government or a bank behind it.
  *   **B.** It functions like money, but it's unstable because it lacks the deep history of a dollar.
  *   **C.** Yes. If everyone agrees it has value and follows the rules, it is money. Full stop.

  ### 3. The Avatar League (Gender)
  A youth esports league creates a new competitive division based entirely on what avatar body players pick (e.g., "Titan" vs. "Sprite"). They put it on signup forms, track stats, and treat it exactly like gender. Is this division a form of gender?
  *   **A.** No, gender is about biology or deep identity, not video game skins.
  *   **B.** It's analogous to gender, but it's missing the real-world social weight and history.
  *   **C.** Yes. Gender is a social position we occupy; if the league treats it as a social position, it is functioning as gender.

  ### 4. The DNA Intake (Race)
  A hospital stops asking patients for self-identified race and switches to DNA ancestry percentages, claiming they are tracking the "same thing" more accurately. Are they correct?
  *   **A.** Yes, race is ultimately a biological reality, so DNA is just a better ruler.
  *   **B.** No, DNA measures ancestry, but race is about how society treats that ancestry. They overlap, but aren't the same.
  *   **C.** No, race isn't in the genes at all. Trying to find it in DNA is a category error, like weighing a thought.

  ### 5. The Time Traveler (Money)
  You hand a Roman soldier a modern $20 bill. He looks confused. Is the bill valuable?
  *   **A.** It has intrinsic value (the paper, the ink), but he doesn't know how to use it.
  *   **B.** It has potential value, but it needs the right economic system to activate it.
  *   **C.** It is worthless. Value exists only in the network of people who agree to honor it.

  ### 6. The Alien Observer (Gender)
  Aliens land and scan humanity. They can see biological sex, but they cannot see "man" or "woman." Do those categories exist for the aliens?
  *   **A.** Yes, they are objective facts about humans, even if the aliens don't have words for them.
  *   **B.** The biology is there, but the social roles (man/woman) would be invisible to them.
  *   **C.** No. Without human culture to enact them, "man" and "woman" do not exist.

  ### 7. The Census Box (Race)
  The government changes the census rules. You can now check a box that didn't exist yesterday. Did you *become* that race yesterday, or were you always that race?
  *   **A.** I was always this race. The government just finally noticed.
  *   **B.** My background didn't change, but my official social status did.
  *   **C.** Race is defined by the rules. If the rules change, the racial landscape changes.

  ### 8. The Magic Wand (General)
  If you could wave a wand and erase all human agreements, laws, and concepts, what is left?
  *   **A.** Trees, money, race, and gender all remain exactly as they are.
  *   **B.** Trees remain. Money, race, and gender remain but look very different without society.
  *   **C.** Trees remain. Money, race, and gender vanish completely.

  ### 9. The Consequence (General)
  Does it matter if something is "socially constructed"?
  *   **A.** Yes, because if it's constructed, it might be fake or less important.
  *   **B.** Yes, because if it's constructed, we can fix it if it's causing harm.
  *   **C.** No. Constructed things (like laws or viruses) can kill you just as dead as trees can fall on you.

  ***

  ## The Scoring Key

  Tally your **A**, **B**, and **C** answers. Then, look at the specific breakdown below to find your philosophical profile.

  ### 1. The Granite Realist (Mostly A's)
  **View:** Across-the-board No-Nonsense Realism.
  **The Gist:** You believe the world comes with labels already attached. A tree is a tree, a dollar is a dollar, and race and gender are biological facts waiting to be discovered.
  **Blind Spot:** You might struggle to explain why money changes value or why racial categories shift over centuries if they are purely biological/physical facts.

  ### 2. The Soft Realist (Mostly B's)
  **View:** The Middle View (Causal Constructionism).
  **The Gist:** You think there is a physical reality underneath (biology, paper), but social forces shape how we use it. Race affects life outcomes because of racism, not just genes; money has value because of trust, not just ink.
  **Blind Spot:** You walk the middle line, which is practical, but you might get stuck arguing whether the "base" reality or the "social" layer is doing the heavy lifting.

  ### 3. The Architect (Mostly C's)
  **View:** Full-Blown Constitutive Constructionism.
  **The Gist:** You believe collective agreement and rules *make* the thing what it is. Without humans, there is no money, no race, and no gender. They are real, but they are real like "checkmate" is real—a product of rules, not atoms.
  **Blind Spot:** Critics may accuse you of thinking these things are "fake." You know they aren't fake, but explaining the difference between "constructed" and "imaginary" can be tiring.

  ### 4. The Skeptical Architect (Specific Mix)
  **View:** Eliminativism about Race + Constructionism about Gender/Money.
  **The Gist:** You picked **C** on Money (Q2, Q5) and Gender (Q3, Q6), but you picked **C** on Race (Q4, Q7) *specifically because you think race is a mistake*.
  **The Nuance:** You believe Money and Gender are valid social tools we built. But you believe Race is a broken tool that should be discarded (Eliminativism), not just reformed. You see race as a "scientific error" while seeing gender as a "social kind."
  **Blind Spot:** You have to constantly explain why you treat gender as real but race as a myth, even though both have social effects.

  ### ⚠️ Flagged Combos

  **The "Magic Money" Combo (A on Money, C on Trees)**
  If you said Money is biological/physical (A on Q2/Q5) but Trees are conceptual (C on Q1), your view is likely **Incoherent**.
  *   **Why:** Money is the definition of a social artifact. Claiming it is real like a tree while claiming trees are conceptual reverses the standard logic of reality. This spot is empty because it's philosophically unstable.

  **The "Ghost Gender" Combo (A on Race, C on Gender)**
  If you said Race is Biological (A on Q4/Q7) but Gender is purely conceptual/vanishes without humans (C on Q3/Q6).
  *   **Why:** This is **Unexplored**, not necessarily incoherent. Many people hold this view (biological sex is real, gender roles are made up), but it creates tension when biological sex and gender presentation don't align. It's a common folk-view, but philosophically crowded.

  ### 🚫 The Indistinguishable Pair

  **The Granite Realist vs. The Soft Realist**
  This quiz cannot reliably separate **Profile 1 (Granite)** from **Profile 2 (Soft)**.
  *   **Why:** Both agree that there is a "there" there. A Granite Realist admits society influences money; a Soft Realist admits biology influences race. In a 9-question quiz, the difference is one of *degree* (how much is made vs. found), not *kind*. To separate them, you'd need to ask them to design a policy: The Granite Realist tries to measure the thing; the Soft Realist tries to change the system around the thing.

  ***

  *Send your results to [Your Email]. I'm particularly interested in the Skeptical Architects.*
