  ### Deliverable 1 — Table of Distinct Precise Claims

  | Reading | Precise claim | Status | Supports the dismissal? | What would settle it |
  | :--- | :--- | :--- | :--- | :--- |
  | All-risks safety reading | Overall mortality risk from all causes is lower now than any past era. | platitude | no | Aggregate mortality data across all causes. |
  | Per-capita violence rate reading | Violent deaths per 100,000 people are lower now than any past era. | substantive and contested | partly | Consensus on historical homicide and war rates. |
  | Absolute violent deaths count reading | Total number of violent deaths per year is lower now than any past era. | false or very likely false | no | Global population and death count statistics. |
  | Violence share of deaths reading | Violence constitutes a smaller fraction of all deaths now than any past era. | substantive and defensible | no | Causes-of-death statistics across historical periods. |
  | Lifetime violent death risk reading | Probability of an individual dying violently over a lifespan is lower now. | substantive and contested | partly | Life-table modeling incorporating violence mortality. |
  | Comparison class: all past eras | Current safety exceeds every specific previous moment in history. | substantive and contested | partly | Identification of historical safety minima and maxima. |
  | Public perception versus reality reading | People falsely believe violence is increasing despite statistical declines. | platitude | no | Surveys comparing perceived versus actual risk trends. |
  | Robustness across all measures reading | Every reasonable operationalization of violence shows a downward trend. | substantive and contested | yes | Demonstration that all valid metrics converge directionally. |
  | Stipulative definition of violence reading | Violence counts only direct physical force, excluding structural harms. | indeterminate (no fact of the matter as stated) | yes | Philosophical agreement on the definition of violence. |
  | Moral norms progress reading | Societal condemnation and prohibition of violence are stronger now. | substantive and contested | no | Analysis of legal codes, norms, and cultural artifacts. |
  | Structural threat exposure reading | Person-years lived under credible threat of violence are fewer now. | substantive and contested | no | Measurement of coercive structures and threat probabilities. |

  ### Deliverable 2 — Table on Measures

  | Measure | Direction it can be expected to move across the periods under discussion | Which readings it can support and which it cannot | Main weakness |
  | :--- | :--- | :--- | :--- |
  | Absolute count | Up (due to population growth) | Supports absolute-count reading (if false); cannot support rate readings. | Ignores population size; conflates scale with risk. |
  | Per-capita rate | Down (standard narrative) | Supports rate, lifetime-risk, and comparison-class readings; cannot support absolute-count. | Excludes structural threats; depends on population denominators. |
  | Share of all deaths | Down (due to disease reduction) | Supports share-of-deaths reading; cannot support violence-specific trends. | Confounds violence reduction with medical progress. |
  | Lifetime risk | Down (usually correlates with rate) | Supports lifetime-risk reading; cannot support absolute-count. | Sensitive to age structure and non-violent mortality changes. |
  | Threatened person-years | Up or Unknown (structural expansion) | Supports structural threat reading; cannot support standard decline narratives. | Difficult to quantify; counts potential rather than actual harm. |

  The default choice is almost always the per-capita rate, presupposing that violence is an event comparable across contexts and that structural threats without physical execution do not count. This presupposition silently excludes the political theorist's core concern about administrative and coercive harm.

