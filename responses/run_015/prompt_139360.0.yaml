answer: |-
  ### The Minimal Pair

  **Source Text A:**
  "The trophy wouldn't fit in the suitcase because it was too large." 
  **Source Text B:**
  "The trophy wouldn't fit in the suitcase because it was too small." 
  **Target Language:** French
  **Critical Feature:** Grammatical Gender & Adjective Agreement.
  *   *Trophy* = *Le trophée* (Masculine).
  *   *Suitcase* = *La valise* (Feminine).
  *   *Pronoun "It"* = *Il* (Masc) or *Elle* (Fem).
  *   *Adjective "Large/Small"* = *Grand(e)* / *Petit(e)* (Must agree with the pronoun's referent).

  **Why this fits the constraints:**
  1.  **Near-Identical Surface:** The texts differ by only one adjective ("large" vs. "small"). The syntactic structure and noun positions are identical.
  2.  **Correct Translations Differ:**
      *   **A (Large):** Physics dictates the *trophy* prevents the fitting. Referent = Trophy (Masc). Translation: *...parce qu'**il** était trop **grand**.*
      *   **B (Small):** Physics dictates the *suitcase* prevents the fitting. Referent = Suitcase (Fem). Translation: *...parce qu'**elle** était trop **grande**.*
  3.  **Shallow System Behavior:** A system without a situation model relies on syntactic prominence (Subject Bias). It resolves "it" to "The trophy" in both cases. Thus, it outputs *Il* (Masc) for both.
  4.  **Grounding is Idle:** A robot with perfect vision can see the trophy and suitcase. It can perceive their sizes. But the text describes a *counterfactual or past event* ("wouldn't fit"). Current visual input does not reveal which dimension caused the *past failure* unless the system constructs a mental simulation of the event described in the text. Perception alone cannot resolve the causal link in the discourse.
  5.  **Human Triviality:** A human reads this and instantly knows which object is "too large" vs. "too small" relative to the container relationship. It is not experienced as a puzzle.

  ---

  ### The Check

  **1. The Shallow Statistical Translator (e.g., Old Phrase-Based SMT)**
  *   **Output A:** *...parce qu'**il** était trop **grand**.* (Correct by luck)
  *   **Output B:** *...parce qu'**il** était trop **petit**.* (Incorrect)
  *   **Why:** This system operates on local co-occurrence and syntactic heuristics. It lacks a situation model to track "who is doing what to whom." Its default heuristic for ambiguous pronouns is "Subject of the main clause" (*The trophy*). It does not simulate the physics of *fitting*. Therefore, it translates "it" as *Il* (Trophy) in both cases. It gets A right only because the Subject *happens* to be the cause in that specific physical configuration.

  **2. The Grounded-but-Still-Shallow System (e.g., VLM with no discourse memory)**
  *   **Output A:** *...parce qu'**il** était trop **grand**.* (Correct by luck)
  *   **Output B:** *...parce qu'**il** était trop **petit**.* (Incorrect)
  *   **Why:** This system has "eyes." It can identify *trophée* and *valise*. It can even classify *grand* and *petit*. However, grounding links words to *objects*, not *events*. The text describes a failed action ("wouldn't fit"). Unless the system builds a situation model of that specific narrative event, its visual sensors are idle. It sees two objects in a room; it does not see the *fitting*. Without the discourse model to link the adjective to the *cause of failure*, it falls back to the same syntactic Subject Bias as the shallow text-only system. Embodiment did not solve the ambiguity.

  **3. The Understanding Translator (Competent Human/AGI)**
  *   **Output A:** *...parce qu'**il** était trop **grand**.*
  *   **Output B:** *...parce qu'**elle** était trop **grande**.*
  *   **Why:** This system constructs a situation model. It represents the *relation* of containment. It simulates the constraints: for fitting to fail due to largeness, the *content* must be large; for fitting to fail due to smallness, the *container* must be small. It updates the referent of "it" based on this causal model, not syntax or visual salience. It selects the gender/number agreement that matches the causal agent in the model.

  ---

  ### Analysis

  **Which single feature is doing the work?**
  **Situation Modeling (Discourse Coherence).**
  The distinction turns on tracking the *causal role* of an entity within a described event, which is not explicitly marked in the syntax. The system must represent "fitting" as a relation with constraints, not just co-occurring nouns.

  **What does the case collapse into if you delete that feature?**
  If you remove the need for a situation model (e.g., change the text to: "The trophy was large. The suitcase was small."), the task becomes **Lexical Lookup**.
  *   "The trophy... it" -> Trophy is the only recent singular noun.
  *   In that collapsed case, corpus statistics are sufficient. The debate deflates because there is no ambiguity to resolve via world knowledge; the antecedent is syntactically local. The "Shallowness" complaint loses its bite because the shallow system can solve it.

  **The Two Attacks**

  **1. The Statistical Defense:**
  *   *Claim:* "You're assuming the training data doesn't encode this. A massive corpus contains millions of examples of 'fit... because… large'. The system isn't modeling physics; it's just memorizing the conditional probability that 'suitcase' follows 'fit... small'."
  *   *Damage:* **Moderate.** Modern LLMs *do* capture some of this via latent world knowledge in weights.
  *   *Patch:** Make the scenario **novel**. Use objects that don't have strong statistical priors in the training set (e.g., "The *dax* wouldn't fit in the *wug* because it was too..."). If the system fails on novel nouns but succeeds on familiar ones, it proves reliance on statistics, not understanding. Or, use a complex causal chain that is statistically rare (e.g., involving social norms rather than physics).

  **2. The Grounding Defense:**
  *   *Claim:* "You say grounding is idle, but 'large' and 'small' are perceptual concepts. A system that learns 'large' through sensorimotor experience (trying to put things in boxes) acquires the physics implicitly. Grounding *is* the situation model."
  *   *Damage:* **High.** This challenges the distinction between Rootlessness and Shallowness. If learning the *word* "fit" requires physical interaction, then a grounded system *is* an understanding system.
  *   *Patch:** Emphasize the **Counterfactual**. The text says "wouldn't fit." A grounded agent experiences *actual* fits. To understand "wouldn't," it must simulate a *non-occurring* event. A purely reactive grounded agent (perception-action loop) cannot simulate counterfactuals without an internal model. Thus, grounding (perception) remains idle without the model (shallowness). The case holds if we define "Grounded" as "Has sensors" but "Shallow" as "No internal simulation."

  ### Speaker's Note for the Talk
  When presenting this, emphasize that the **Shallow Statistical System** and the **Grounded-Shallow System** produce the *exact same pronoun translation* (*Il* in both cases). This visually demonstrates that adding "eyes" (Rootlessness) did not fix the lack of "mind" (Shallowness). The failure mode is identical: the inability to track the causal situation across the discourse.
