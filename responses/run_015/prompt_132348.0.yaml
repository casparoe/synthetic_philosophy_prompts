          *   *Conventionalism/Chess:* This is the big error. Carroll isn't saying logic is arbitrary. He's saying logical *compulsion* isn't contained in the text of the premises.
          *   *Tortoise's Rationality:* The Tortoise is the hero of the piece, not the villain.
      *   *Section 3: Does the Conclusion Hold?* (Is deductive justification impossible?)
