answer: |-
  ### I. The Statistical Restatement

  In this framework, the **archive** is defined as the training corpus $\mathcal{D} = \{(x_i, y_i)\}_{i=1}^N$, drawn from a population distribution $P(X, Y)$. **Historical legibility** corresponds to the support of the empirical distribution $\hat{P}_{train}$. If a subpopulation $S \subset \mathcal{X}$ falls outside the support of $\mathcal{D}$, the learned function $f_\theta(x)$ exhibits high variance or undefined gradients in that region, rendering $S$ statistically illegible (out-of-distribution error).

  **Curatorial authority** is operationalized as the sampling policy $\pi(x)$ and the loss-weighting vector $W$. The optimization objective is $\mathcal{J}(\theta) = \sum_{i=1}^N w_i L(y_i, f_\theta(x_i))$. Entities assigned $w_i \approx 0$ are excluded from the gradient updates $\nabla_\theta \mathcal{J}$, effectively minimizing the model's fidelity to those points regardless of their presence in the raw feature space. **Preservation** is equivalent to assigning non-zero weight in the expectation; **destruction** is the assignment of zero weight or the removal of samples from $\mathcal{D}$ prior to optimization.

  **Structured absence** is modeled as Missing Not At Random (MNAR). Let $R$ be a binary indicator where $R=1$ if data is observed. The mechanism is MNAR if $P(R=0 | X, Y) \neq P(R=0)$. Specifically, if $P(R=0 | Y)$ depends on the unobserved value $Y$ itself, the missingness mask contains mutual information $I(R; Y) > 0$. Consequently, the pattern of nulls in the data matrix is a signal carrying information about the selection mechanism, not merely noise. Ignoring $R$ leads to biased estimators $\hat{\theta}$; correcting for this requires inverse probability weighting or modeling the selection function $P(R|X, Y)$ explicitly.

  **Archival silence** is the structural zero resulting from the selection mechanism. Statistically, silence implies that the likelihood function is conditional on observation: $L(\theta | \text{observed}) \neq L(\theta | \text{population})$. The "information content" of silence is the reduction in entropy of the selection variable $H(R)$ given features $X$. If specific latent classes $Z$ correlate with $R=0$, the absence of records allows for the inference of $Z$ via the missingness pattern, provided the selection model is identifiable.

  **Power** is the capacity to define the loss landscape. An agent with power modifies $W$ or $\mathcal{D}$ to shift the global minimum $\theta^* = \arg\min_\theta \mathcal{J}(\theta)$, thereby altering the model's predictions on counterfactual inputs.

  ***

  ### II. Residue Report

  **1. Clean Mappings (Isomorphic)**
  *   **Legibility $\leftrightarrow$ Support Coverage:** The claim that archives determine who "exists" historically maps cleanly to the ML constraint that models cannot generalize beyond the support of the training distribution without strong inductive biases.
  *   **Structured Absence $\leftrightarrow$ MNAR:** The archival claim that absence is systematic maps precisely to Missing Not At Random mechanisms. Both assert that the probability of observation is dependent on the unobserved value.
  *   **Silence as Signal $\leftrightarrow$ Informative Missingness:** The idea that silence conveys meaning maps to the statistical property that the missingness indicator $R$ is predictive of the target $Y$ or latent confounders $Z$.

  **2. Distorted Mappings (Homomorphic but Lossy)**
  *   **Intentionality $\leftrightarrow$ Sampling Policy:** In archives, exclusion is often agentic (a curator chose to discard). In ML, MNAR can be mechanical (a sensor failed). Mapping "oppression" to "sampling bias" captures the *effect* (skewed distribution) but loses the *cause* (agency). The statistical framework treats the selection mechanism as a function to be estimated, not a decision to be judged.
  *   **Obligation $\leftrightarrow$ Regularization:** The moral obligation to record marginalized lives maps to adding regularization terms or re-weighting classes to improve robustness. However, in ML, this is done to minimize generalization error or satisfy fairness constraints (e.g., demographic parity), not because the data points possess intrinsic rights. The *motivation* is external to the math.
  *   **Harm $\leftrightarrow$ Loss:** Archival "harm" (erasure of identity) maps to high loss values or high uncertainty. However, "loss" is a metric of model performance, whereas "harm" implies a negative utility for the subject. A model can have low loss on a dataset that describes a harmed population accurately; the statistical framework measures fidelity, not welfare.

  **3. Null Mappings (No Counterpart)**
  *   **Performativity:** Archival theory often claims the archive *constitutes* reality (the record makes the history). ML assumes a realist ontology: a ground truth $Y$ exists independently of $\mathcal{D}$, and the goal is to approximate it. ML has no formal mechanism for the dataset *creating* the label $Y$ through the act of recording.
  *   **Historical Responsibility:** There is no variable for liability. If $\mathcal{D}$ is biased due to historical accumulation, the ML framework identifies the bias but cannot assign responsibility to past sampling policies. It treats the distribution as a fixed boundary condition, not a chain of custody.
  *   **Testimony:** Archives function as witness. In ML, data points are i.i.d. samples (typically). The unique indexicality of a record (this specific document proves this specific event) is lost in the assumption of exchangeability required for most statistical learning.

  ***

  ### III. Assessment of the Untranslatable Remainder

  The untranslatable residue reveals a **genuine limitation of the dataset-bias framework**, specifically its inability to register **constitutive performativity** and **normative liability**.

  1.  **Ontological Mismatch:** The dataset-bias framework operates under a *representational* paradigm: the data is a (flawed) mirror of an external reality. Archival theory often operates under a *constitutive* paradigm: the archive generates the reality it claims to describe. In ML, if we correct for MNAR, we assume we are recovering the "true" $P(X, Y)$. In archival theory, there may be no "true" $P(X, Y)$ outside the archival process itself. The ML framework cannot model the feedback loop where the act of measurement (archiving) alters the state of the system (historical legibility) in a way that retroactively defines truth.
  2.  **Normative Vacuum:** The ML framework is teleological (oriented toward minimizing loss), not deontological (oriented toward duty). It can detect that a subpopulation has high variance (is "silenced"), but it cannot compute *why* that matters absent an external objective function that values equity. The "politics of preservation" reduces to hyperparameter tuning ($W$). This suggests that while archival theory's claims about *structure* (MNAR, support) are statistically substantive, its claims about *power* and *ethics* rely on a layer of normativity that the dataset-bias framework inherently strips away.

  **Conclusion:** The translation succeeds in formalizing the *epistemic* claims of archival theory (how we know what is missing) but fails to capture the *ontological* and *ethical* claims (what the missingness *does* to the world and what we *owe* to it). This does not render archival theory less substantive; rather, it demonstrates that the dataset-bias framework is insufficient for modeling systems where the observer's intervention is constitutive of the observed reality. The "power" in archives is not just control over the distribution $P(X)$, but control over the definition of the random variables themselves—a degree of freedom the standard ML pipeline treats as fixed.
