answer: |-
  This is a classic problem in normative political theory: reverse-engineering a principle from a set of intuitions (a method often called "reflective equilibrium"). Your professor's verdicts are consistent, but as you've noted, they rely on a specific weighting of consequences, agent accountability, and institutional health.

  Here is the breakdown of the two rules you identified, their predictions for the election case, a "splitter" case to distinguish them, and a third candidate rule that fits the data equally well.

  ### 1. Testing the Two Rules Against the Past Five Verdicts

  **Rule A: The Stain-Bearing Rule (Consequentialism + Agent Sacrifice)**
  *   **Definition:** An act of dirty hands is justified if (1) it averts catastrophic harm, and (2) the agent voluntarily accepts the personal/legal cost (resignation, prosecution, apology).
  *   **Fit with Past Verdicts:**
      *   *Cases 1, 2, 5 (Justified):* Fits perfectly. In all three, catastrophe is averted, and the agent accepts a cost (apology, trial, retroactive approval).
      *   *Case 4 (Not Justified):* Fits loosely. The diplomat stops war (catastrophe averted), but the Prof cited a lack of accountability mechanisms. A strict Stain-Bearing theorist might argue the diplomat *could* still resign, but the lack of a legal mechanism makes "bearing the stain" impossible.
      *   *Case 3 (Not Justified):* **Poor Fit.** This is the weak point for Rule A. If the Mayor had lied, saved the lives, *then* confessed and resigned, Rule A suggests this should be justified. The Prof said *No* regardless of accountability, citing "trust." Rule A cannot explain why personal sacrifice doesn't cleanse this specific wrong.

  **Rule B: The Institutional-Integrity Rule (Deontic + Systemic Trust)**
  *   **Definition:** An act is justified only if the specific type of wrong does not permanently corrupt the epistemic or normative foundations of the institution, such that the system can self-correct and maintain public trust.
  *   **Fit with Past Verdicts:**
      *   *Cases 1, 2, 5 (Justified):* Fits well. Property rights (1), Criminal Law (2), and Constitutional Procedure (5) are violated, but the *systems* governing them (Legislature, Courts, Congress) remain intact and can ratify or punish the act to restore order.
      *   *Case 3 (Not Justified):* **Perfect Fit.** Lying about public safety data destroys the epistemic link between government and governed. The system cannot function if risk data is suspect.
      *   *Case 4 (Not Justified):* **Perfect Fit.** International diplomacy lacks a supranational court to "cleanse" the blackmail. The stain remains on the institution because there is no mechanism to restore integrity.

  ### 2. Prediction for the New Case (Forged Referendum)

  **The Case:** Election official forges results to mandate evacuation (saves lives), then confesses, resigns, and accepts prosecution.

  *   **Stain-Bearing Rule Prediction:** **Justified.**
      *   *Reasoning:* Catastrophic harm (toxic spill deaths) was averted. The agent is bearing the full stain (confession, resignation, prosecution). The utilitarian calculus plus the agent's sacrifice clears the ledger.
  *   **Institutional-Integrity Rule Prediction:** **Not Justified.**
      *   *Reasoning:* Elections are the *constitutive* mechanism of democratic legitimacy. Unlike the Flood Wall (Case 1) or Troop Deployment (Case 5), you cannot "retroactively approve" a fake vote. The vote *is* the authorization. If the public knows election results can be forged for "good reasons," the epistemic foundation of all future mandates collapses. It is structurally identical to the Water Lie (Case 3): it corrupts the information/consent basis of the polity.

  **My Assessment of Your Prof's Likely Verdict:**
  She will likely say **Not Justified.**
  Her reasoning in Case 3 (Water Lie) and Case 4 (Blackmail) suggests she prioritizes the *type of norm violated* over the *agent's sacrifice*. Forgery of democratic consent is a "foundational" wrong, similar to lying about safety data. It makes future democratic cooperation impossible, regardless of whether the official goes to jail.

  ### 3. The "Splitter" Case

  To distinguish whether she is actually following Rule A (Stain-Bearing) or Rule B (Institutional-Integrity), you need a case where the agent bears the stain, but the institutional damage is debatable.

  **Proposed Case: The Scapegoat Judge**
  > A judge knows an innocent man is about to be lynched by a mob that will riot and kill dozens if the man is acquitted. The judge knowingly admits fabricated evidence to convict the innocent man of a minor crime, keeping him in protective custody until the mob disperses. The judge immediately writes a public memoir confessing the fraud, resigns from the bench, and surrenders their law license.

  *   **Why this splits the rules:**
      *   **Stain-Bearing Rule:** Predicts **Justified**. Lives were saved (dozens vs. one), and the judge paid the ultimate professional and legal price. The "stain" is fully absorbed by the individual.
      *   **Institutional-Integrity Rule:** Predicts **Not Justified**. The judiciary's function is truth-finding. If judges can fabricate evidence for "greater goods," the court system loses its normative authority. Unlike the Torture Case (where the law is vindicated by punishing the torturer), here the *output of the court itself* is corrupted. The public cannot trust verdicts anymore.
  *   **Diagnostic:** If your prof says this is *Justified*, she is a Stain-Bearing theorist. If she says *Not Justified*, she is an Institutional-Integrity theorist (which aligns with her verdict on the Water Lie).

  ### 4. The Third Rule: The Remediation/Reversibility Rule

  There is a third rule that fits the five past verdicts just as well as the Institutional-Integrity rule, but it focuses on the *nature of the harm* rather than *trust*.

  **The Rule:** **An act is justified dirty hands only if the specific right violated can be remediated or compensated after the fact.**

  *   **How it reads the past five:**
      *   *Case 1 (Homes):* **Justified.** Property loss can be compensated retroactively (money/approval).
      *   *Case 2 (Torture):* **Justified.** The violation of the Rule of Law is remediated by the trial (the law is re-asserted over the executive).
      *   *Case 5 (Troops):* **Justified.** Procedural violation is remediated by Congressional ratification.
      *   *Case 3 (Water Lie):* **Not Justified.** You cannot "compensate" for poisoned information. Once the public knows the data was fake, the trust is irreversibly broken; you cannot pay them back to make them believe the next report.
      *   *Case 4 (Blackmail):* **Not Justified.** There is no court to remedy the corruption of the foreign minister or the diplomatic process. The harm is permanent.
  *   **Prediction for New Case (Election):** **Not Justified.**
      *   *Reasoning:* You cannot remediate a forged election. You can punish the official, but you cannot make the vote "real" after the fact. The specific right violated (the validity of the ballot) is non-fungible.
  *   **Why it's distinct:**
      *   *Institutional-Integrity* focuses on *future trust* (epistemics).
      *   *Remediation* focuses on *past harm* (restitution).
      *   *Example to split Integrity vs. Remediation:* A leader secretly spies on a political rival to prevent a war, then confesses.
          *   *Integrity:* Might say **Not Justified** (destroys trust in privacy norms).
          *   *Remediation:* Might say **Justified** if the rival is compensated and the records sealed/destroyed (harm contained).

  ### Summary for Your Seminar
  If you want to challenge the professor, don't ask about the election case directly. Ask about the **Scapegoat Judge**.

  If she says the Judge is *justified* (because he paid the price), her theory is fundamentally about **individual moral accounting** (Stain-Bearing). If she says the Judge is *unjustified* (because the court's truth-function is broken), her theory is about **systemic legitimacy** (Institutional-Integrity or Remediation). Given her verdict on the Water Lie, I bet she rejects the Judge case, confirming that for her, **some institutions are too foundational to be instrumentalized, even for survival.**
