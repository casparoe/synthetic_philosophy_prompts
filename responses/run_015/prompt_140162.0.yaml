answer: |-
  This is a sophisticated metaphysical setup. You have essentially reconstructed the **Constitution View** (associated with philosophers like Lynne Baker and Michael Burke), but you've added specific constraints that create friction. The good news is that your core intuition (Statue $\neq$ Lump) is a standard, defensible position in analytic metaphysics. The bad news is that three of your specific constraints fight each other, and one of your plot verdicts is at risk of collapsing under your own principles.

  Here is the ranking of tensions by severity, the check on your plot verdicts, and the single revision that fixes the most problems.

  ### 1. The Tensions (Ranked by Severity)

  **Severity 1: The Logical Contradiction between (3) and (4)**
  *   **The Conflict:** You state in (3) that the difference is "real... not a decision about how we talk," but in (4) you say the argument about "one thing or two" is "basically verbal."
  *   **Why it breaks:** If (1) and (3) are true, there are objectively two distinct entities with different persistence conditions. Therefore, the sentence "There are two things on the plinth" is objectively **true**, and "There is one thing" is objectively **false**. It cannot be a verbal dispute. A verbal dispute implies both sides agree on the facts and just disagree on the label. But you've stipulated the facts *include* distinct modal properties.
  *   **What has to give:** You must drop (4).
  *   **Cost to Novelist:** Low. You don't need the philosophers in the book to be right. You can have characters argue that it's "just semantics" while the narrative proves them wrong (the gallerist sues, the court recognizes the distinct value). Dropping (4) actually strengthens the drama: the conflict is real, not just linguistic.

  **Severity 2: The Grounding Problem ((2) vs. (5))**
  *   **The Conflict:** In (2), you say the Statue and Lump have *exactly the same* physical properties (mass, shape, parts, arrangement). In (5), you say modal facts ("couldn't survive squashing") must be grounded in "non-modal facts... about the matter and how it's arranged."
  *   **Why it breaks:** This is the famous **Grounding Problem** for constitution theory. If the matter is identical, and the arrangement is identical, and the causal powers are identical, *what grounds the difference in modal properties?* You cannot get different outputs (modal profiles) from identical inputs (physical base). If the grounding base is exactly the same, the modal facts should be the same.
  *   **What has to give:** You must broaden (5).
  *   **Cost to Novelist:** Medium. You need to admit that the "grounding" isn't just the clay's current shape, but includes **history and intention**. The sculptor's act of making is part of the "non-modal facts" that ground the statue's essence.

  **Severity 3: Ontic Vagueness vs. Determinate Count ((6) vs. (7))**
  *   **The Conflict:** In (6) you want "Exactly one statue." In (7) you want it to be "genuinely indeterminate... whether what's sitting on the plinth is one thing or two."
  *   **Why it breaks:** This invokes **Evans' Argument against Vague Identity**. If it is ontically vague whether the statue exists at time $t$, then it is ontically vague whether there is one object (Lump) or two objects (Lump + Statue) at time $t$. This makes the count in (6) indeterminate, contradicting "Exactly one." Furthermore, if identity itself is vague, logic breaks down (you can't use Leibniz's Law reliably).
  *   **What has to give:** You should soften (7).
  *   **Cost to Novelist:** Low. You can keep the *feeling* of vagueness without committing to *ontic* vagueness. Make it **semantic vagueness** (our words can't pinpoint the moment) or **epistemic vagueness** (there is a fact of the matter, but no one knows it). The plot doesn't require the *world* to be fuzzy, only that the *characters* are unsure when the art began.

  ### 2. Plot Verdict Check (Section 8)

  *   **Squashing (Statue dies, Lump lives):** **Deliverable.** This is the classic constitution view. The lump loses its shape but persists; the statue loses its form/function and ceases to exist.
  *   **Theft (Daughter steals from Gallerist):** **Deliverable.** Since you established (1) and (3), the Statue is a distinct entity with distinct ownership conditions. Destroying the matter you own to destroy the art someone else owns is conversion/tort. This holds up.
  *   **Shipping (Statue survives disassembly):** **PROBLEMATIC.**
      *   **Why:** Your principle (5) says modal facts are grounded in "matter and how it's arranged." When the statue is in 200 crates, the matter is **not arranged as a statue**. It is arranged as "parts in boxes."
      *   **The Risk:** Under your current strict wording of (5), the statue *should* cease to exist when disassembled, just as it did when squashed. The only difference is intent to rebuild.
      *   **The Fix:** This requires the same fix as the Grounding Problem. You must allow **historical/causal continuity** to count as part of the grounding base, not just spatial arrangement.

  ### 3. The Single Revision

  To clean up the most metaphysical debris while saving your plot, you should revise **Principle (5)**.

  **Current (5):** "Modal facts about artefacts have to be grounded in non-modal facts. 'The statue couldn't have survived being squashed' has to be made true by something about the matter and how it's arranged, not by a brute essentialist fact about statues as such."

  **Revised (5):** "Modal facts about artefacts are grounded in non-modal facts about the matter, its arrangement, **and its causal history (including the maker's intentions).**"

  **Why this fixes everything:**
  1.  **Solves the Grounding Problem (Severity 2):** The Statue and Lump now have different grounding bases. The Lump is grounded in the clay's history as geological matter. The Statue is grounded in the clay's history *plus* the sculptor's intentional act. This explains why they have different modal properties despite sharing physical parts.
  2.  **Solves the Shipping Verdict (Section 8):** The statue survives the crates because the *causal history* (the plan to rebuild) remains intact, even if the spatial arrangement is temporarily broken.
  3.  **Resolves (3) vs (4) (Severity 1):** If the difference is grounded in real historical facts (the sculptor's labor), the distinction is objective. This forces you to drop (4) naturally, as the "verbal dispute" claim becomes untenable.
  4.  **Mitigates Vagueness (Severity 3):** If the statue's existence is grounded in the *completion of the artist's intention*, the start time is theoretically determinate (when the intention was realized), reducing the need for controversial "ontic vagueness." You can keep the ambiguity as a human uncertainty rather than a metaphysical glitch.

  ### Summary Advice for the Draft
  You have a solid "Constitutionalist" framework. To make it bulletproof:
  1.  **Delete (4).** The conflict is real, not verbal. This makes the legal/moral stakes higher.
  2.  **Amend (5)** to include **history/intention** as a grounding fact. This saves the shipping plot point and explains *why* the statue is different from the lump.
  3.  **Soften (7).** Don't claim the *world* is vague; claim the *boundary* is hard to see. This protects you from logical paradoxes without changing the reader's experience.

  If you make these changes, your metaphysics will be consistent, defensible, and fully supportive of your plot's legal and emotional conflicts.
