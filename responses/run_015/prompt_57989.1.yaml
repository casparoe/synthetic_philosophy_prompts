answer: |-
  1. **Philosopher A:** In the crane case, the single worker's complaint against permanent paralysis is so much stronger than any resident's complaint against temporary migraines that no number of headaches can outweigh it. **Philosopher B:** But if you ignore the twenty thousand sufferers, you imply their collective misery counts for nothing, which forces us to accept a verdict that sacrifices the many for the sake of one.

  2. **Philosopher A:** Contractualism requires us to justify principles to each individual, and no resident can reasonably claim their headache outweighs another's life-altering injury. **Philosopher B:** Yet justification fails when you tell the twenty thousand that their severe pain is morally irrelevant simply because it is shared rather than concentrated.

  3. **Philosopher A:** When the harm is identical, like paralysis for a crew versus one, I can pair each member of the crew with the single worker, allowing numbers to decide without aggregating weaker complaints. **Philosopher B:** That distinction collapses here, because if you save the many in the identical harm case, you have already admitted that numbers matter, undermining your refusal to aggregate in the migraine case.

  4. **Philosopher A:** I allow aggregation only when complaints are similar in magnitude, but a headache is simply too weak to ever enter the scales against permanent disability. **Philosopher B:** This creates an arbitrary threshold where adding one more migraine sufferer eventually flips the decision, yet you claim the principle remains non-aggregative.

  5. **Philosopher A:** Better to bear the charge of arbitrariness than to permit the overwhelming of the vulnerable individual's vital interests by the sum of trivial inconveniences. **Philosopher B:** But a theory that condemns twenty thousand to severe suffering to spare one person a far greater but singular harm is itself indefensible to those twenty thousand.
