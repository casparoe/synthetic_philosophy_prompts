prompt: |-
  I was arguing with a friend the other day about whether feeling pain is actually a real thing happening inside your head or just your brain playing tricks, and I tried to come up with a wierd example to test it but I dont really know the right terms. Imagine someone born with zero heat receptors — like, literally none — but because of some neural rewiring they report feeling burning sensations in the exact same situations where normal people feel heat, they pull away and say ouch and everything behaves identically. There's no actual temperature signal reaching them, but they insist they are having the same experience as everyone else. I think philosophers call this kind of debate illusionism vs something else?

  Anyway, I want you to write a dialogue between two people who take opposing sides on whether phenomenal consciousness is real — one who thinks this congenital thermal phantom case shows that experience is basically an illusion or misrepresentation, and one who thinks the phantom actually proves consciousness is genuinely present and cant be reduced away. Make sure neither one sounds like a strawman; they should actually engage with the phantom case and respond to each others arguments directly, not just talk past one another. Maybe have them go back and forth for a bit, like eight or ten lines, really digging into whether the phantom person is missing something or not. Please dont just list a bunch of philosophers I wont recognize — I have no academic background, I'm just curious how the argument actually works.
