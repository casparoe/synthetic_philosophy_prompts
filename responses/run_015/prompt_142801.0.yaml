answer: |-
  ### 1. Translation: Invariants as Assertions

  Here is the mapping of your fairness criteria into engineering specifications. I have classified them by whether they constrain the **Representation** (the float value the model emits) or the **Allocation** (the boolean decision or rank position derived from that float).

  **Criterion (C): Group Calibration**
  *   **Engineering Assertion:** `assert abs(mean(outcome | score_bin, group) - score_bin) < epsilon` for all bins and groups.
  *   **Classification:** Property of **Representation**.
  *   **Your Suspicion:** You suspected this is "cheap" (fixable via post-processing) while Error Rates are "expensive" (allocation constraints).
  *   **Verification:** **Half-right.**
      *   *Computationally Cheap:* Yes. You can wrap the model output in a monotone isotonic regression calibrator per group. This is a stateless post-processing step.
      *   *Architecturally Expensive:* No. You assumed calibration preserves ranking. It does not. If Group A has a higher base rate, a raw score of 0.5 in Group A implies different evidence strength than 0.5 in Group B. Calibrating them to both mean "50% risk" will compress one distribution and expand the other. **This reorders the global ranked list.**
      *   *Cost:* Enforcing (C) breaks the contract for the "Ranked List" consumer unless you accept that the list is no longer globally sorted by risk, but sorted by *calibrated risk within group*.

  **Criterion (E): Equal False Negative Rates (FNR)**
  *   **Engineering Assertion:** `assert (FN_count_A / Positive_count_A) == (FN_count_B / Positive_count_B)`.
  *   **Classification:** Property of **Allocation**.
  *   **Cost:** This requires moving the decision boundary (threshold) per group.
      *   For the **Pharmacist Flag**: You need `threshold_A != threshold_B`.
      *   For the **Ranked List**: You need to select `k_A` and `k_B` such that recall matches, rather than taking the global Top 200.
      *   *Conflict:* This explicitly violates the "Single Public Meaning" invariant. The score 0.7 triggers a review for Group A but not Group B.

  **Criterion (S): Stability / Continuity**
  *   **Engineering Assertion:** `assert correlation(score_t, score_t-1 | features_unchanged) > 0.95` AND `assert rank_delta(patient) < threshold`.
  *   **Classification:** Property of **Deployment Pipeline** (Versioning/Drift).
  *   **Cost:** This fights against Optimization. To satisfy (C) or (E) on new data, the model must shift decision boundaries. Stability constraints act as a regularization penalty, potentially degrading accuracy or fairness on the new slice to maintain continuity for the waitlist.

  **The Incompatibility Theorem (CAP-Style)**
  *   **Translation:** Given `BaseRate_A != BaseRate_B`, the solution space for a function `f(x)` that satisfies `Assertion_C` AND `Assertion_E` is empty (unless `Accuracy == 100%`).
  *   **Engineering Interpretation:** You are asking for a single scalar interface to satisfy two contradictory interface contracts.
      *   Contract 1 (Clinical): Score = Probability (requires Group-Specific mapping).
      *   Contract 2 (Compliance): Score = Uniform Risk Indicator (requires Global mapping to ensure equal error rates).
      *   **Result:** You cannot implement both contracts on one scalar return value.

  ---

  ### 2. Residue Report: What the Vocabulary Loses

  Your engineering vocabulary is precise, but it treats specifications as given. The "residue" lies in the undefined specs that the code cannot validate.

  **1. The "Protected Group" Object**
  *   **Engineering View:** A slice key for monitoring (e.g., `group_by='demographic_id'`). It is a property of the data row.
  *   **The Residue:** In ethics/law, a group is a *political designation* with historical context. Your vocabulary treats Group A and Group B as independent buckets. It cannot see that the *base rate disparity* (18% vs 9%) might be an artifact of historical under-servicing rather than biological reality.
  *   **Consequence:** Your code enforces the disparity as a hard constraint (`BaseRate` is an input constant). You cannot "fix" the fairness without modeling *why* the base rates differ, which is outside the system boundary.

  **2. The Similarity Oracle (Individual Fairness)**
  *   **Engineering View:** `assert distance(x_i, x_j) < epsilon => distance(score_i, score_j) < delta`.
  *   **The Residue:** You lack a distance metric. Without a defined `distance()` function on patients, this assertion is untestable (like `assert true`).
  *   **Consequence:** This demand is a **specification error**, not an engineering constraint. You cannot build a test suite for "similar individuals" until a clinician defines the equivalence relation. Until then, it is noise.

  **3. Error Cost vs. Error Count**
  *   **Engineering View:** False Negatives are counts in a confusion matrix. Equal FNR means equal counts proportional to prevalence.
  *   **The Residue:** This assumes the *harm* of a False Negative is identical across groups. If a missed admission in Group A results in death, and in Group B results in a routine ER visit, Equal FNR is not "fair"—it is equalizing *counts*, not *harm*.
  *   **Consequence:** Your vocabulary optimizes for metric parity, not outcome utility. Deciding that "one FN in A equals one FN in B" is a value judgment disguised as a metric.

  ---

  ### 3. System-Specific Gaps: Where Standard Theory Fails

  Standard fairness literature assumes static thresholding and clean labels. Your system has neither.

  **1. Top-K Selection vs. Thresholding**
  *   **Standard Theory:** Assumes a fixed threshold $t$.
  *   **Your System:** Threshold is dynamic (the score of the 200th patient).
  *   **Analogue:** To satisfy Equal FNR (E) with Top-K, you must enforce **Group Quotas** (e.g., enroll 120 from A and 80 from B) rather than Global Top 200.
  *   **Constraint:** This is not a model constraint; it is a **business logic constraint**. If you enforce Global Top 200, (E) is mathematically impossible given base rate disparity. If you enforce (E), you must break the "Global Ranked List" consumer contract.

  **2. Two Consumers, One Score**
  *   **Standard Theory:** One score, one decision.
  *   **Your System:** Score $\to$ Ranked List (Ordering matters) AND Score $\to$ Threshold Flag (Absolute value matters).
  *   **Analogue:** **Interface Segregation Violation.**
      *   The Ranked List needs a *Utility Score* (monotonic with risk).
      *   The Pharmacist needs a *Probability Score* (calibrated).
      *   With group base rate disparity, a single scalar cannot be both globally ordered and group-calibrated.
  *   **Constraint:** This is a real architectural constraint. You are overloading a float.

  **3. Temporal Stability (Retrains)**
  *   **Standard Theory:** Static snapshot.
  *   **Your System:** Monthly retrain, waitlist continuity.
  *   **Analogue:** **Stateful Deployment.**
      *   Standard fairness ignores the cost of "churn" (patients bumped off the waitlist due to model noise).
      *   *Constraint:* Stability (S) acts as a **rate limiter** on fairness improvements. You cannot jump to the optimal fair solution in one step without breaking trust with patients already promised care.

  **4. Censored Ground Truth (Intervention)**
  *   **Standard Theory:** $Y$ is observed for all $X$.
  *   **Your System:** $Y$ is hidden for enrolled patients (intervention prevents admission).
  *   **Analogue:** **Observability Hole.**
      *   You cannot calculate FNR or Calibration on the enrolled population. You are flying blind on the 200 patients you care about most.
      *   *Constraint:* You cannot assert (C) or (E) directly. You must rely on **Counterfactual Estimation** (e.g., Inverse Propensity Weighting).
      *   *Risk:* If your estimation model is biased, your fairness metrics are garbage. This turns a "constraint" into a "dependency on untestable causal assumptions."

  ---

  ### 4. Recommendation: The Engineering Decision

  You cannot satisfy (C), (E), and the "Single Score" architecture simultaneously. One must yield.

  **The Recommendation:**
  **Drop Invariant (E) (Equal FNR) as a constraint on the *Model*, and relax the "Single Score" architecture.**

  **1. The Technical Fix (Decoupling)**
  Do not feed one number to two consumers.
  *   **Output 1 (For Pharmacist):** A **Calibrated Risk Probability**. Enforce **(C)** here. Use group-specific post-processing (isotonic regression) so 0.2 means 20% risk for everyone. Accept that this score is not globally rank-ordered.
  *   **Output 2 (For Enrollment):** A **Priority Score**. Optimize this for the **Top-200 Quota**. Do not enforce (C) here. This score is purely for sorting.
  *   **Handling (E):** Do not try to equalize FNR via the model threshold. If Compliance mandates Equal FNR, implement it as a **Quota Constraint** on the Enrollment Logic (e.g., "Select Top 110 from A and Top 90 from B"). This moves the fairness constraint from the *ML Pipeline* (hard to change) to the *Business Logic* (easy to audit/adjust).

  **2. If Forced to Keep One Number:**
  **Prioritize (C) Calibration.**
  *   **Why:** The Pharmacist is a human-in-the-loop. If the score's meaning shifts by group (violating C), the human cannot calibrate their own judgment to the tool. Trust collapses.
  *   **Trade-off:** You will violate (E). Group B (lower base rate) will have a higher False Negative Rate because the threshold for "high risk" is effectively higher for them in a calibrated model.
  *   **Mitigation:** Document this disparity in the Model Card. "Due to base rate disparity, equal calibration implies disparate recall."

  **3. The Boundary Marker (Where Engineering Stops)**
  Here is the explicit line where your vocabulary runs out:

  > **Engineering Claim:** "We can implement Group Calibration (C) or Equal FNR (E), but not both on a single scalar with disparate base rates."
  >
  > **Value Judgment:** "We choose to prioritize Clinical Trust (C) over Statistical Parity (E)."

  *   **Why this is a Value Judgment:** This decision asserts that a Pharmacist's cognitive load (needing a consistent probability) is more important than the statistical equity of missed diagnoses. An engineer cannot prove this. It requires a stakeholder to sign off on the **Cost Function of Harm**.
  *   **Action:** Do not make this decision yourself. Present the Pareto Frontier: "To achieve Equal FNR, we must degrade Calibration by X%, meaning the Pharmacist's false alert rate increases by Y%." Force the business owner to pick the point on the curve.

  **Summary of Action Items:**
  1.  **Split the Interface:** Risk Probability (Calibrated) $\neq$ Enrollment Priority (Ranked).
  2.  **Move (E) to Logic:** Handle Equal FNR via enrollment quotas, not model thresholds.
  3.  **Assert Observability Limits:** Flag that FNR metrics on enrolled patients are *estimates*, not measurements, due to intervention censoring.
  4.  **Escalate the Trade-off:** Present the Calibration-vs-Recall curve to leadership. Require a signed decision on which metric takes precedence when they conflict.
