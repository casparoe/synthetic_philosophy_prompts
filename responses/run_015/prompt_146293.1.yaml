prompt: |-
  I've been thinking about Quine's claim that moral values are not a separate, non-natural kind of fact but sit inside our overall web of belief, closer to evolved habit and social conditioning than to mathematics or logic. After he died, some philosophers began arguing that if morality is genuinely natural in this way, then biomedical "moral enhancement" — using drugs or genetic intervention to make people more altruistic or less biased — should be treated as no more mysterious than correcting eyesight. The idea is that we are not violating some sacred realm; we are just adjusting a biological system.

  Given Quine's view that even logical principles can be revised to preserve the rest of our beliefs, I wonder how he would respond. Would he see moral bioenhancement as a straightforward extension of his naturalism, or would he object that tinkering with our deepest normative instincts is like altering the very framework we use to judge revisions — changing the rules of the web itself?

  Please answer in British English. Do not provide a bibliography or list of sources. Also, please say clearly what argument or discovery would change your mind, and point out where your reasoning is most likely to fail.
