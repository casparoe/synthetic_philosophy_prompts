      *   *Check:* JSON validity. Ensure quotes and brackets are correct.

  5.  **Final Polish:**
      *   Make sure the "Particularist" doesn't sound like a crazy conspiracist, but a rigorous historian/journalist.
      *   Make sure the "Skeptic" doesn't sound like a shill, but a rigorous Bayesian/epistemologist.
      *   Ensure the "Archive Glut" point highlights *selection bias* in the age of big data.

  6.  **Drafting the Content (Mental or Scratchpad):**
