answer: |-
  ### The Contingency Filter: A Decision Procedure for Risk Entries

  **Philosophical Grounding:**
  This procedure is grounded in the Aristotelian problem of *future contingents* (the Sea Battle). The core insight is that not all future-tense propositions have a truth value *now*. Some are determined by stable propensities (aleatory chance); some are determined but unknown (epistemic uncertainty); and some are genuinely open because they depend on undetermined choices or ill-defined criteria (ontological indeterminacy). Assigning a single probability to the third category is not just inaccurate; it is a category error that misleads capital allocation.

  **Time Required:** 10 minutes per entry.
  **Owner:** Risk Analyst (with Team Lead sign-off for non-quantifiable entries).

  ---

  #### Step 1: The Settlement Condition (Definition Check)
  *Ask:* Can we specify a date and a public, verifiable record that will settle, unequivocally, whether this event occurred?
  *   **Yes:** Proceed to Step 2.
  *   **No:** **STOP.** The entry is ill-defined.
      *   *Action:* Rewrite the entry to specify the metric (e.g., change "operational" to "first commercial passenger service certified by Safety Authority"). If it cannot be defined, it cannot be a risk entry.
      *   *Theory vs. Practice:* This distinguishes **ill-defined extensions** from genuine risks. Theory says a proposition without truth conditions is not a proposition. Practice says audit requires verifiability.

  #### Step 2: The Agency Check (Control Check)
  *Ask:* Is the primary determinant of this outcome a decision made *within* this agency (or by a body we control)?
  *   **No (External):** Proceed to Step 3. (e.g., Weather, Market Crash).
  *   **Yes (Internal):** **STOP.** This is not a risk event; it is a plan or a decision point.
      *   *Action:* Move to the Strategic Plan or Project Schedule. Do not score as a probability.
      *   *Theory vs. Practice:* Theory (Sea Battle) says we cannot predict our own free choices as if they were external facts. Practice says scoring our own intent as "risk" hides accountability.
      *   *Risk Appetite Marker:* If you choose to keep it in the register despite this, you are admitting you treat internal failure as external bad luck. Mark this entry as **"Endogenous."**

  #### Step 3: The Propensity Check (Mechanism Check)
  *Ask:* Is there a stable, repeatable mechanism generating this outcome (e.g., physics, actuarial data, established regulatory precedent) independent of specific human discretion?
  *   **Yes:** Assign Probability (0-100%). Proceed to Step 4.
  *   **No:** **STOP.** There is no "fact of the matter" or stable chance to estimate.
      *   *Action:* Do not assign a percentage. Assign a **Status: Open**.
      *   *Theory vs. Practice:* Theory distinguishes **unknown facts** (epistemic) from **no fact yet** (ontological). Practice often collapses these. This step forces them apart.
      *   *Risk Appetite Marker:* Deciding to treat a discretionary human decision (like a regulator's choice) as "no stable mechanism" is a judgement. You could treat it as Bayesian subjective probability. Choosing "Open" signals an appetite for ambiguity over false precision.

  #### Step 4: The Downstream Handling (Model Integration)
  *For "Open" Status entries:*
  *   **The Number:** Do not use 50%. 50% implies a known distribution (coin flip). Use **"Unresolved."**
  *   **The Model:** Do not feed "Unresolved" into a Monte Carlo simulation as a uniform distribution.
      *   *Action:* Run the portfolio model twice: once assuming the event happens, once assuming it does not. Present the *delta* in capital requirement as the "Exposure."
      *   *Rationale:* This preserves the contingency. It tells the Board: "If this branch of the future becomes actual, here is the cost."

  ---

  ### Application to Draft Entries

  Here is the procedure applied to your three current draft entries.

  #### 1. Entry: "A category 3 or stronger cyclone makes landfall within 50 km of the port during the coming season."
  *   **Settlement:** Yes. Bureau of Meteorology data, end of season.
  *   **Agency:** No. External (Nature).
  *   **Propensity:** Yes. Historical meteorological data provides a stable frequency base.
  *   **Verdict:** **Quantifiable.**
  *   **Instruction:** Assign probability based on historical frequency adjusted for current climate indices. This is a valid risk entry.

  #### 2. Entry: "The regulator revokes our operating licence within eighteen months."
  *   **Settlement:** Yes. Gazette notice or legal order.
  *   **Agency:** No. External (Regulator), *but* heavily influenced by our compliance behavior.
  *   **Propensity:** **No.** Regulatory revocation is not a stochastic process like rainfall. It is a discretionary human judgment based on political and technical factors that do not repeat with stable frequency.
  *   **Verdict:** **Status: Open (Strategic Contingency).**
  *   **Instruction:** Do not score 10% or 50%.
      *   *Downstream:* Run two portfolio scenarios: "Licence Retained" and "Licence Revoked." The cost of the latter is your exposure.
      *   *Uncomfortable Truth:* You cannot defend a specific number here. Any number you give is a political guess disguised as math. If you put a number on this, the Audit Office can later claim you knew the risk was "high" (e.g., >40%) and failed to act, or "low" and failed to provision. "Open" protects you from retrospective hindsight bias.

  #### 3. Entry: "The Northern Link rail extension is operational by 2029."
  *   **Settlement:** **No.** "Operational" is ambiguous (see your prompt: first train? full timetable?).
  *   **Agency:** **Yes.** This is primarily a delivery commitment by your agency (or a contractor you manage).
  *   **Propensity:** **No.** This is a project milestone, not a chance event.
  *   **Verdict:** **Invalid Risk Entry.**
  *   **Instruction:** Remove from Risk Register. Move to Project Delivery Dashboard.
      *   *Uncomfortable Truth:* Scoring this as a risk is an admission that you do not control your own project. If you must keep it for Board visibility, relabel it **"Delivery Confidence: Low/Med/High"** based on critical path analysis, not probability. Do not let it propagate through the risk portfolio model as an external shock.

  ---

  ### The Defensible Refusal (What goes on the page)

  The Board will not accept a blank. When the procedure dictates "Open" or "Invalid," you cannot simply leave the probability column empty. You must replace the number with a statement that satisfies the Audit Office's need for defensibility without violating the philosophical constraints.

  **For the "Open" Entry (Regulator Licence):**
  > **Probability:** *Contingent (No stable propensity)*
  > **Rationale:** *This event depends on discretionary regulatory judgment rather than a stable stochastic mechanism. Assigning a fixed probability would imply a known distribution of outcomes that does not exist. Capital allocation should be based on exposure analysis (Scenario A vs. Scenario B) rather than Expected Value.*

  **For the "Invalid" Entry (Northern Link):**
  > **Probability:** *N/A (Endogenous Milestone)*
  > **Rationale:** *This outcome is determined by internal delivery decisions, not external chance. Probability scoring conflates project management performance with risk exposure. Tracked via Project Critical Path; capital provisioned via Project Contingency Reserve, not Risk Capital.*

  ---

  ### Where the Procedure Will Misfire

  You asked for honesty about where this distinguishes theory from practice, and where it fails.

  **1. The Epistemic vs. Ontological Blur**
  *   **The Problem:** The procedure asks you to distinguish between "a fact exists but we don't know it" (Epistemic) and "no fact exists yet" (Ontological). In practice, **you often cannot tell the difference.**
  *   **Example:** Will a specific foreign government expropriate assets? Is the decision made in a closed room (fact exists, we don't know it) or is it dependent on future elections we can't predict (no fact yet)?
  *   **The Misfire:** You will classify some "unknown facts" as "open contingencies."
  *   **Mitigation:** This is a feature, not a bug. In the absence of a stable mechanism (like weather), treating it as "Open" is safer for capital allocation than pretending it is a calculated risk. It forces the Board to acknowledge the uncertainty rather than burying it in a number.

  **2. The 50% Habit**
  *   **The Problem:** Your analysts use 50% for "don't know." The procedure bans this.
  *   **The Misfire:** The Portfolio Model may break. Most aggregate risk models sum Expected Values (Probability × Impact). If you remove the probability, the sum breaks.
  *   **Mitigation:** You must change the reporting output. The Board cannot receive a single "Total Risk Exposure" dollar figure if significant entries are "Open." They must receive a **Range of Exposure** (Best Case / Worst Case) or a **Scenario Set**. If the Board demands a single number, you must explicitly state that the number excludes "Open" contingencies. This is a risk appetite decision: you are choosing to report *known* risk rather than *total* uncertainty.

  **3. The Audit Trap**
  *   **The Problem:** Auditors love numbers. They check if $P \times I$ was provisioned.
  *   **The Misfire:** An auditor may flag "Contingent" as "Unassessed Risk."
  *   **Mitigation:** Your "Rationale" paragraph (see Defensible Refusal above) must explicitly cite the lack of a stable generating mechanism. You are not failing to assess; you are assessing that the *method* of probability is invalid. This aligns with ISO 31000 principles regarding uncertainty vs. risk.

  ### Summary of Judgement Calls (Risk Appetite)

  The procedure is not pure logic; it encodes policy choices. Be aware of these three points where you are making a judgement call, not a philosophical deduction:

  1.  **Step 2 (Agency):** Deciding that internal decisions are "not risks" is a choice to prioritize accountability over comprehensive modeling. You could model your own incompetence as a probability. Choosing not to is a governance stance.
  2.  **Step 3 (Propensity):** Deciding that regulatory discretion lacks "stable propensity" is a judgement. You *could* build a Bayesian prior. Choosing "Open" signals a conservative appetite for ambiguity.
  3.  **Step 4 (Downstream):** Deciding to present Scenarios rather than an Expected Value is a communication choice. It asks the Board to make a decision under uncertainty rather than handing them a calculated "cost of risk."

  **Final Advice:**
  The Board wants certainty. You cannot give it. The "Defensible Refusal" text above is your shield. It shifts the burden from "Why didn't you predict this?" to "Why did you ask us to pretend we could?" That is a defensible position for a public agency.
