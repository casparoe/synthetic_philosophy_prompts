prompt: |-
  I lead the risk-analysis team at a public infrastructure agency. Four times a year we issue a risk register to our board: sixty to ninety one-off, non-repeatable future events, each of which we are currently required to score with a single probability and a one-paragraph rationale. The board allocates capital from those numbers, and the audit office reviews our files afterwards, so every entry has to be defensible on paper by a non-specialist.

  Some of these entries, I am fairly confident, are not the sort of thing that has a probability — and not merely because our evidence is thin. My analysts collapse at least three different situations into a single "we don't know": that there is as yet no fact of the matter whether the event will occur; that there is a fact of the matter, or at least a stable chance, but we have no usable way to estimate it; and that the sentence on the register does not pick out a definite event at all (the extension is operational by 2029 — first passenger train? full timetable? signed-off safety case?). They also score our own future decisions — whether we will apply for the licence, whether we will close the tunnel — exactly as they score rainfall, and when they decline to give a number they enter 50%, which then propagates through the portfolio model as though it were an estimate.

  Please write a decision procedure my team can run on a candidate entry in about ten minutes, grounded in what the philosophical literature on future contingents — the classical case of tomorrow's sea battle and the debates that grew out of it — actually supports, keeping the distinctions that matter for practice and dropping the rest. It should: force those three situations apart, and tell me honestly which of them the theory distinguishes and which only our own practice distinguishes; require a settlement condition — a specifiable check, by a stated date, that will settle whether the event occurred — before any number is issued; handle the difference between forecasting an outcome and scoring a decision of ours that partly determines it; say what replaces the 50% placeholder for an entry marked open, both for the decision itself and for how that item behaves downstream inside an aggregate model; and mark plainly the points where the procedure is really a judgement about our risk appetite rather than a consequence of the theory.

  Then run it on three entries from our current draft: a category 3 or stronger cyclone makes landfall within 50 km of the port during the coming season; the regulator revokes our operating licence within eighteen months; the Northern Link rail extension is operational by 2029. I expect it to tell me something I do not want to hear on at least one of them, since the board will not accept a blank, so say what a defensible refusal looks like on the page. Finally, tell me where the procedure will misfire — in particular, whether any of this can be told apart, in practice, from ordinary uncertainty about the evidence.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **User Role:** Lead of risk-analysis team at a public infrastructure agency.
      *   **Problem:** Current risk register forces single probability scores on 60-90 one-off future events. This is philosophically and practically flawed (collapsing distinct epistemic states, scoring internal decisions as external events, using 50% as a "don't know" placeholder which distorts models).
      *   **Requirements:**
          *   Write a 10-minute decision procedure for candidate entries.
          *   Grounded in philosophical literature on *future contingents* (Aristotle's sea battle, etc.).
          *   Distinguish three specific "we don't know" situations (no fact of the matter, fact exists but unknown, event ill-defined).
          *   Require a *settlement condition* (specifiable check by a date).
          *   Handle the distinction between forecasting outcomes vs. scoring internal decisions.
          *   Replace the 50% placeholder for "open" entries (both for the decision and downstream modeling).
          *   Mark where the procedure is about *risk appetite* vs. *theory*.
          *   Apply the procedure to three specific draft entries (Cyclone, License Revocation, Rail Extension).
          *   Be honest about uncomfortable truths (defensible refusal).
          *   Identify where the procedure might misfire (distinguishing from ordinary evidentiary uncertainty).

  2.  **Philosophical Grounding (Future Contingents):**

      *   *Core Issue:* Do statements about the future have a truth value *now*?
      *   *Aristotle (De Interpretatione):* The "Sea Battle" problem. If it's true now that there will be a sea battle, it's necessary. If it's false, it's impossible. This threatens free will and contingency. Aristotle suggests they are neither true nor false *yet*.
      *   *Ockham/Lewis:* Branching time. The future is a tree of possibilities. No single "actual" future until the branch is taken.
      *   *Key Distinction for Risk:*
          1.  *Aleatory Uncertainty (Chance):* Stable propensity exists (e.g., dice, weather patterns). Probability applies.
          2.  *Epistemic Uncertainty (Ignorance):* Fact exists or is determined, but we lack data. Probability is subjective/bayesian.
          3.  *Ontological Indeterminacy (Contingency):* The event isn't fixed yet, often because it depends on free choices (ours or others) or ill-defined criteria. Probability is category error.
      *   *Settlement:* A proposition must be verifiable/falsifiable to be a risk event.

  3.  **Drafting the Decision Procedure (The "Contingency Filter"):**

      *   *Time limit:* 10 minutes. Needs to be a checklist/flowchart style.
      *   *Step 1: Definition Check.* Is the event well-defined? (Addresses the "operational by 2029" vagueness).
      *   *Step 2: Agency Check.* Do *we* decide this? (Addresses scoring own decisions).
      *   *Step 3: Settlement Check.* Can we verify this later? (Addresses the "fact of the matter" requirement).
      *   *Step 4: Propensity Check.* Is there a stable mechanism? (Addresses weather vs. regulatory decision).
      *   *Output:* Assign a status (Quantifiable, Qualitative/Scenario, Decision Point, Invalid).
      *   *Handling the 50%:* Replace with "Unresolved" or "Scenario Weighting." In models, treat as a branch, not a probability distribution.
      *   *Risk Appetite:* Acknowledge that deciding *how* to treat unresolved items is a policy choice, not just math.

  4.  **Applying to the Three Entries:**

      *   *Entry 1: Cyclone.*
          *   Definition: Clear (Cat 3, 50km, season).
          *   Agency: External (Nature).
          *   Propensity: Historical data exists (aleatory).
          *   Verdict: Quantifiable. (This is the "easy" one).
      *   *Entry 2: Regulator Revokes Licence.*
          *   Definition: Clear (Revocation).
          *   Agency: External (Regulator), but influenced by Us.
          *   Propensity: No stable chance. Depends on political/administrative discretion.
          *   Verdict: Epistemic/Strategic. Not a simple probability. Needs scenario analysis.
      *   *Entry 3: Northern Link Operational by 2029.*
          *   Definition: Vague ("Operational"?).
          *   Agency: Internal/Shared (We build it).
          *   Propensity: None. It's a plan.
          *   Verdict: Invalid as a risk event. It's a project milestone. Scoring probability here is scoring our own competence/intent.

  5.  **Addressing the "Uncomfortable Truths" & Defensible Refusal:**

      *   The Board wants numbers. The procedure says "No number" for some.
      *   *Defensible Refusal:* State that assigning a number creates false precision that violates audit standards (misleading the board). Offer a "Status Report" instead.
      *   *Downstream Model:* If an input is "Unresolved," the model output must be a range or a set of scenarios, not a single Expected Value (EV).

  6.  **Addressing the "Misfire" (Theory vs. Evidence):**

      *   Can we really tell the difference between "no fact of the matter" and "we just don't know the fact"?
      *   *Honest Answer:* Often no. In practice, deep epistemic uncertainty looks like ontological indeterminacy.
      *   *Pragmatic Fix:* Treat anything without a stable generating mechanism (like weather) as indeterminate for the sake of capital allocation.

  7.  **Refining the Tone:**

      *   Professional, authoritative, slightly academic but pragmatic.
      *   Acknowledge the audit pressure.
      *   Respect the philosophical constraints without getting bogged down in metaphysics.

  8.  **Self-Correction/Review during drafting:**

      *   *Critique:* Did I clearly separate the three "we don't know" states?
      *   *Fix:* Ensure Step 1 (Definition), Step 3 (Settlement), and Step 4 (Propensity) map explicitly to the user's three categories (ill-defined, unknown fact, no fact).
      *   *Critique:* Did I handle the 50% issue?
      *   *Fix:* Explicitly state that 50% implies a coin flip (maximum entropy chance), whereas "Open" implies the coin hasn't been minted. Suggest using "Scenario Weights" that sum to 100% across *mutually exclusive* futures, not independent probabilities.
      *   *Critique:* Is the philosophical grounding clear?
      *   *Fix:* Reference Aristotle/Sea Battle explicitly in the intro to the procedure to satisfy the prompt's requirement.

  9.  **Final Polish:** Check against all constraints in the prompt (10 mins, settlement condition, risk appetite markers, specific examples, misfire analysis). *Self-correction: Make sure to explicitly mark where risk appetite enters the procedure.*

  **(Self-Correction Note on "Risk Appetite"):** The prompt asks to mark where the procedure is really a judgement about risk appetite. This is crucial. Deciding *not* to quantify a risk is a risk appetite decision (tolerating ambiguity vs. forcing precision). I need to highlight this in the procedure steps.

  **(Self-Correction Note on "Defensible Refusal"):** The prompt asks what a defensible refusal looks like on the page. I need to draft the actual text that would go into the register or an accompanying memo.

  10. **Final Output Structure:**
      *   Introduction (Philosophical grounding).
      *   The Procedure (The "Contingency Filter").
      *   Application to the Three Entries.
      *   The Defensible Refusal (Template).
      *   Limitations (Where it misfires).

