answer: |-
  This is a sophisticated puzzle that touches on the sociology of science (Robert Merton's "multiples"), the metaphysics of mathematics (Platonism vs. Constructivism), and the ethics of credit (desert theory).

  You are correct that there is a sneaky mistake. It is not in (1) or (2), which are historically and modally robust. The break occurs in the inference from **(3) to (4)**, and the overgeneralization in **(5)**.

  Here is the diagnosis of the argument, the specific fallacy hiding in "replaceability," and the least painful premise to reject.

  ### 1. The Diagnosis: Equivocation on "Achievement"

  The argument relies on a slide between two different definitions of "scientific achievement."

  *   **Definition A (Truth-Bearing):** The achievement is bringing a true proposition into the public corpus of knowledge.
  *   **Definition B (Labor/Construction):** The achievement is the specific cognitive labor, synthesis, and tool-building required to justify that proposition.

  Your argument works perfectly if we define achievement solely as **Definition A**. If the only thing that matters is that *Proposition P* is now known, and *Proposition P* was inevitable, then the specific agent is indeed a replaceable mouthpiece.

  However, scientific practice (and your intuition about Wiles) operates on **Definition B**. We credit the *pathway*, not just the *destination*.

  ### 2. Where the Chain Breaks

  You asked which premise to give up. The least painful option is to **reject (4)** and **qualify (5)**.

  #### Why you must reject (4)
  Premise (4) states: *Replaceability undermines desert for credit... the achievement belongs to the logical structure, not to you.*

  This is a **Modal Fallacy**. It conflates *counterfactual inevitability* with *causal irrelevance*.
  *   **Example:** If I am drowning and a lifeguard saves me, it is possible that *another* lifeguard would have saved me ten seconds later. Does that mean the first lifeguard gets no credit? Does the "saving" belong to the logical structure of gravity and buoyancy?
  *   **Application:** Even if Wallace would have published natural selection in 1859 instead of 1858, Darwin's 1858 intervention changed the actual history of science *at that moment*. Credit is assigned for **actualization**, not for **metaphysical origination**.

  If you keep (4), you are forced into a view of **Scientific Communism** (in the Mertonian sense) where names are merely labels attached to inevitable truths, and priority disputes are irrational. While some sociologists argue this descriptively, normatively it destroys the incentive structure of science.

  #### Why you must qualify (5)
  Premise (5) states: *Every result... is already implicit... anyone who proves a hard theorem is just performing an unavoidable extraction.*

  This assumes a hard **Mathematical Platonism** where all proofs exist "waiting" to be found.
  *   **The Wiles Counter:** Wiles did not just "extract" FLT. He proved the Modularity Theorem for semistable elliptic curves. That connection was *not* "in the air." It was a bridge built between two islands that no one knew were connectable.
  *   **Discovery vs. Construction:** In the Darwin/Wallace case, the *phenomenon* (evolution) was waiting to be noticed (Discovery). In the Wiles case, the *machinery* (Iwasawa theory, modular forms) had to be constructed to reach the result (Construction).
  *   **The Break:** Simultaneous discovery applies to *ripe insights* (calculus, natural selection, oxygen). It does not apply to *architectural proofs* that require decades of novel tool-building. Generalizing from (1) to (5) ignores the difference between finding a fruit on a low branch (inevitable) and building a ladder to reach a high branch (contingent on the builder).

  ### 3. Resolving the "Conceptual Bottleneck"

  You mentioned the "conceptual bottleneck" edge case: *Suppose only one specific formulation unlocks a field, and two people hit it within months.*

  Does this make the formulation less theirs? **No.** It makes the bottleneck *more* valuable.

  If a formulation is a bottleneck, it means the conceptual space is highly constrained. Hitting that specific key requires navigating the constraints correctly.
  *   **The Race:** If two people hit the bottleneck simultaneously, it confirms the bottleneck was "in the air" (supporting Premise 1).
  *   **The Credit:** However, credit is awarded for **navigating the bottleneck**, not for creating the terrain.
  *   **Darwin's Anxiety:** You asked why Darwin cared about Wallace if Wallace was inevitable. Darwin cared because **priority determines the narrative.** If Wallace publishes first, Wallace gets to frame the theory (e.g., emphasizing different mechanisms). Darwin wasn't fighting for the *truth* of evolution; he was fighting for the *authority* to define it.

  ### 4. The Least Painful Option

  **Keep (1) and (2).** They are historically accurate. Simultaneous discovery is real; ideas are often ripe.

  **Reject (4).** This is the normative leap that fails.
  *   **Replacement:** Replace (4) with: *"Replaceability limits monopoly, but not recognition. The first actualizer receives priority credit because they reduced the time-to-truth, even if the truth was inevitable."*

  **Reject (5).** This is the empirical overreach.
  *   **Replacement:** Replace (5) with: *"Results that rely on existing toolkits are prone to simultaneity; results that require new toolkit construction are not."*

  ### 5. Why Keeping (1) and (4) is Dangerous

  You asked: *If I keep (1) and (4), am I forced into some weird view about scientific authorship?*

  **Yes.** You are forced into **Epistemic Nihilism regarding Agency.**
  If (1) is true (ideas are inevitable) and (4) is true (inevitability negates credit), then:
  1.  No scientist deserves credit for any discovery.
  2.  Scientific papers should ideally be anonymous.
  3.  Priority disputes (like Newton vs. Leibniz) are not just ugly, they are *category errors* (like arguing over who owns the sunset).

  This contradicts how science actually functions. Science is a reputation economy. The "credit" isn't just a reward; it's a tracking mechanism for who built reliable pathways. If we deny credit because the result was inevitable, we break the feedback loop that encourages scientists to do the hard work of actualization.

  ### Summary of the Fix

  The "sneaky mistake" is the assumption that **credit tracks metaphysical origination** rather than **epistemic labor**.

  *   **Darwin/Wallace:** The *insight* was inevitable (in the air). The *synthesis and evidence* were labor-intensive. Darwin got more credit because he did more labor (Origin of Species), not because he had a stronger metaphysical claim to the idea.
  *   **Wiles:** The *theorem* was inevitable (it's true in all worlds). The *proof* was contingent (it required specific, non-obvious machinery). Wiles gets credit for the machinery.

  **Verdict:** Drop (4). Being the "first mouthpiece" is an achievement because silence was the alternative state of the world until you spoke. Inevitability does not erase agency; it just contextualizes it.
