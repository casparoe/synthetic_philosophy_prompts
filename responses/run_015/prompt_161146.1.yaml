answer: |-
  This is a fantastic constraint. It cuts through the fog of "queer properties" and "directions of fit" and forces us to look at the interface signatures.

  Here is the metaethical dialectic compiled into your native typed functional tongue.

  ### 1. The Type Signatures

  **Cognitivism (Realism)**
  On the cognitivist picture, moral predicates are functions from entities to truth values.
  ```haskell
  type WorldState = ...
  type MoralProp = Bool  -- Or a distinct 'Truth' type

  isWrong :: Action -> WorldState -> MoralProp
  ```
  A moral sentence `Stealing is wrong` is an **expression** that evaluates to a `MoralProp`. It is referentially transparent. You can substitute it anywhere a `Bool` is expected.

  **Expressivism (Classic Non-Cognitivism)**
  On the classic expressivist picture, moral predicates do not return values; they perform updates on the agent's conative state (plans, desires, commitments).
  ```haskell
  type ConativeState = ...
  type MoralCmd = ConativeState -> ConativeState  -- Or IO ConativeState

  boo :: Action -> MoralCmd
  ```
  A moral sentence `Stealing is wrong` is a **statement** (in the imperative sense). It is an effectful computation. Its "meaning" is its execution side-effect (e.g., `updateState (\s -> s { disapproved = disapproved s ++ [Stealing] })`).

  ### 2. The Frege–Geach Problem as a Type Error

  You nailed the intuition. Frege–Geach is literally a type mismatch in the cognitivist's compiler.

  Consider Modus Ponens:
  ```haskell
  modusPonens :: MoralProp -> (MoralProp -> MoralProp) -> MoralProp
  ```

  Now consider the embedding:
  ```haskell
  premise1 :: MoralCmd          -- "Stealing is wrong"
  premise2 :: MoralProp -> MoralCmd -- "If stealing is wrong, then..."
  ```

  **The Error:**
  The logic operator `->` (implication) expects arguments of type `MoralProp` (values). Expressivism provides `MoralCmd` (effects/computations).
  If you try to pass `premise1` into `premise2`, the type checker screams. You cannot evaluate the conditional because the antecedent doesn't yield a value to test against; it just *does* something.

  In logical terms: Logic is defined over truth-apt values (preservation of truth). Expressivism offers side effects (propagation of attitude). You cannot preserve truth if there is no truth value to begin with. It's like trying to `mappend` an `IO ()` action.

  ### 3. The Expressivist Repair: Lifting the Logic

  The expressivist (e.g., Simon Blackburn, Allan Gibbard) responds by saying: "You are assuming logic only works on `Bool`. We can define logic on `MoralCmd`."

  This is **lifting**. They define a new logic of attitudes.
  ```haskell
  class Expressive m where
      boo :: Action -> m ()
      liftIf :: m Bool -> m a -> m a -> m a  -- A monadic if?
  ```

  Actually, it's deeper. They argue that the conditional sentence *itself* expresses a complex attitude.
  ```haskell
  -- The sentence "If stealing is wrong, then getting brother to steal is wrong"
  -- Is not a function from Bool to Bool.
  -- It is a constructor for a complex Attitude type.

  data Attitude
    = Disapprove Action
    | DisapproveOf (Attitude -> Attitude) -- Higher-kinded disapproval?
    | Conditional Attitude Attitude

  -- The 'logic' is just pattern matching on these structures.
  ```
  In your vocabulary: This is building an **AST** of commitments rather than evaluating them. The "validity" of an argument isn't truth-preservation; it's **consistency of the AST**. If you hold `Disapprove Stealing` and `Conditional (Disapprove Stealing) (Disapprove BrotherStealing)`, but you *don't* hold `Disapprove BrotherStealing`, your `ConativeState` is inconsistent (a runtime error in the agent's psychology).

  So, Frege-Geach is solved by moving from `Bool` algebra to `Monoid` algebra over attitudes.

  ### 4. Quasi-Realism: Earning the Type Class Instance

  Quasi-realism (Blackburn's project) is the claim that even though the underlying type is `Attitude` (effect/structure), we can implement the `TruthApt` interface for it.

  ```haskell
  instance TruthApt Attitude where
    isTrue :: Attitude -> Context -> Bool
    -- Implementation details hidden, but it behaves 'as if' it returns a Bool
  ```

  The Quasi-Realist says: "We don't need the metaphysical `Bool` (moral facts). We just need to show that our `Attitude` type supports all the operations we want to do with moral language: negation, embedding, disagreement, and assertion."

  *   **Disagreement:** In FP, two threads conflicting on a `TVar`. In Quasi-Realism, two agents with incompatible `Attitude` structures (e.g., one has `Boo X`, the other has `Yay X`).
  *   **Truth:** A deflationary predicate. Saying `"Stealing is wrong" is true` is just re-asserting `Boo Stealing`. It's syntactic sugar, like `void` in C or `unit` in Haskell that we pretend carries weight.

  The Quasi-Realist claims they can make `Attitude` an instance of `Eq`, `Show`, and `Logic` without ever importing the `MoralFacts` library.

  ### 5. The Residue Report

  Here is where the translation bottoms out. You suspected the monad is doing too much work. You are correct.

  **1. The "Real vs. Fake" Distinction (The Metaphysical Leak)**
  In FP, if you implement a type class instance lawfully, the distinction between "primitive `Bool`" and "wrapper around `Attitude` that behaves like `Bool`" is **irrelevant**. This is abstraction. If it compiles and runs, it *is* that type.
  In Metaethics, the distinction is **everything**.
  *   **Cognitivist:** "If your `TruthApt` instance is backed by `Attitude`, you are lying. There is no *fact of the matter*."
  *   **Expressivist:** "Your `MoralFacts` type is a phantom type. It has no runtime representation. Ours does."

  In code, we prefer phantom types to be erased. In ethics, realists think the phantom type (the Moral Fact) is the *only thing that gives the code authority*. The "hole" in your framework is that FP assumes **syntax/semantics alignment is sufficient for reality**. Metaethics asks: "Does the semantic model correspond to territory, or is it just a useful map?" The monad analogy hides the ontological commitment.

  **2. Normativity vs. Execution**
  In FP, a side effect (`IO`) is descriptive of what *will* happen when run.
  In Ethics, an "attitude" or "command" is **normative**. It claims you *ought* to run it.
  When you define `data Attitude = Boo Action`, you have defined a data structure. You haven't explained why constructing `Boo Stealing` imposes a constraint on *my* `ConativeState`.
  *   **The Distortion:** The monad analogy makes commitment look like state mutation. But moral commitment claims **authority** over the state, not just **modification** of it. There is no `Monad Normativity` in Haskell. You can model the *structure* of reasons, but not the *force* of reasons.

  **3. The "Mind-World Direction of Fit"**
  This is the classic philosophical jargon, but in your tongue:
  *   **Belief (`Bool`):** The value must change to match the `WorldState`. (Input)
  *   **Desire (`IO`/`Cmd`):** The `WorldState` must change to match the value. (Output)
  *   **The Residue:** Moral sentences seem to be **both**. They describe the world ("This *is* wrong") and command it ("Don't do it").
      *   Cognitivism captures the Input (Truth) but struggles with the Output (Motivation).
      *   Expressivism captures the Output (Motivation) but struggles with the Input (Truth/Logic).
      *   **The Hole:** In FP, a function is either pure (Input) or effectful (Output). A moral sentence claims to be a **Pure Effect**. That is a type error in reality, even if you can hack it in code with a `ReaderT` over `IO`. The philosophical dispute is about whether "Pure Effect" is a coherent type or a category mistake.

  **4. Why the "Fake" Matters (The Error Handling)**
  You asked why anyone thinks the difference matters.
  In FP, if two implementations satisfy the interface, they are interchangeable.
  In Ethics, if Moral Truth is "Fake" (just `Attitude`), then **Error Handling** changes.
  *   **Realist:** If I say "Genocide is wrong" and I am mistaken, I have a **Bug** in my perception of the `MoralFacts` API.
  *   **Expressivist:** If I say "Genocide is wrong" and you disagree, we don't have a Bug. We have a **Merge Conflict**.

  This matters for **debugging the universe**. Realists think moral progress is *discovery* (fixing bugs). Expressists think moral progress is *negotiation* or *convergence* (resolving merge conflicts). The monad analogy makes these look like implementation details, but they dictate the entire runtime strategy of human civilization.

  ### Summary Judgment

  Your framework is robust enough to model the **syntax** and **logic** of the debate perfectly. Frege-Geach *is* a type error. Quasi-realism *is* implementing a type class for a non-standard type.

  But the framework distorts the **semantics of authority**.
  In code, types constrain what we *can* write.
  In ethics, moral types claim to constrain what we *may* write.

  The "Residue" is the **Normative Force**. You can model the *shape* of obligation with a Monad, but you cannot model the *bindingness* of obligation. The realist says the bindingness comes from the Type (the Fact). The expressivist says the bindingness comes from the Runtime (the Agent).

  The dispute isn't thinner than it sounds; it's just that in code, we don't care where the bindingness comes from as long as the compiler enforces it. In life, the compiler is us, and we want to know if we're compiling against reality or just against ourselves. That's the one type check that won't pass.
