answer: |-
  You have hit on one of the most persistent and difficult problems in the philosophy of causation and law. You are not confused; rather, you have correctly identified a tension that professional philosophers and legal theorists struggle with.

  Your intuition shift is spot-on: **You are right to suspect that counterfactual analysis often relies on normative assumptions to work.**

  Here is a breakdown of why your observation is correct, how the "smuggling" happens, and the distinction between causal and moral responsibility.

  ### 1. The Counterfactual Trap
  The standard counterfactual theory of causation (often associated with David Lewis) says: *Event C causes Event E if, had C not occurred, E would not have occurred.*

  If we apply this strictly to omissions:
  *   **The Lifeguard:** If the lifeguard *had* jumped in, the swimmer would live. Therefore, the lifeguard's not jumping is a cause of the death.
  *   **The Trolley Bystander:** If the bystander *had* pulled the lever, the five would live. Therefore, the bystander's not pulling is a cause of the death.
  *   **The Person in Paris:** If a random person eating lunch in Paris *had* teleported to the track and pulled the lever, the five would live. Therefore, their not teleporting is a cause of the death.

  If we accept the counterfactual definition without limits, **everyone in the universe who did not save the five people is a cause of their deaths.** This is known as the **Problem of Profligate Omissions**. It makes the concept of causation useless because it identifies too many causes.

  ### 2. Are Duties "Smuggled In"?
  To solve the "Profligate Omissions" problem, philosophers and legal theorists usually introduce a filter. They argue that not all counterfactual dependencies count as *causes*; only the **relevant** ones do.

  This is where your suspicion about "smuggling duties" is correct. To determine relevance, we often rely on **normative expectations**.

  *   **Normality:** We tend to label something a "cause" when it deviates from the normal or expected course of events.
  *   **Duty/Role:** For the lifeguard, saving swimmers is "normal" (it is their job). Their inaction is an abnormal deviation, so we label it a cause.
  *   **No Duty:** For the bystander, standing still is "normal." Pulling the lever is the deviation. Therefore, in ordinary language, we say the *pulling* of the lever causes the one death, rather than the *not pulling* causes the five deaths.

  So, yes: **To make counterfactual causation practical, we often implicitly rely on normative facts (duties, roles, expectations) to select which omissions count as causes.** Some philosophers (like Hart and Honoré in legal theory) argue explicitly that causation in the law cannot be separated from these normative contexts.

  ### 3. Causal Responsibility vs. Moral Responsibility
  The confusion often stems from conflating two different questions:
  1.  **Metaphysical:** Did my inaction contribute to the outcome? (Causal)
  2.  **Ethical:** Am I to blame for the outcome? (Moral/Legal)

  In the Trolley Problem:
  *   **Metaphysically:** One could argue your inaction is *a* cause of the five deaths (because the world where you act is a world where they live).
  *   **Morally/Legally:** Most systems say you have **no duty to rescue**. Therefore, even if your inaction was causally relevant, you bear no *moral responsibility*.

  However, in the Lifeguard case:
  *   **Metaphysically:** Their inaction is a cause.
  *   **Morally/Legally:** They have a **duty to rescue**. Therefore, they bear moral and legal responsibility.

  The reason the Lifeguard case feels different from the Trolley Bystander case is usually not because the *causation* is different (both are counterfactual dependencies), but because the **obligation** is different.

  ### 4. Why This Matters for Your Understanding
  You asked if counterfactual analysis smuggles duties in. The answer depends on which philosopher you ask:

  *   **The Purists:** Argue that causation is purely physical/descriptive. They might say omissions aren't "real" causes at all because nothing physically happens. They would say the trolley killed the five, not your inaction.
  *   **The Contextualists:** Argue that causation is always interest-relative. When we ask "What caused this?", we are asking "What factor, out of the background conditions, was the relevant difference?" **Norms determine what counts as background and what counts as a difference.**

  ### Summary
  You are not confused. You have identified that **pure counterfactual analysis is too broad to be useful on its own.**

  To distinguish the lifeguard from the bystander, we *do* need to bring in normative concepts (duties, expectations, roles). Without those, the bystander is just as much a "cause" of the deaths as the runaway trolley is.

  So, in ordinary discourse and law, we usually reserve "causation by omission" for cases where there was a **duty to act**. In the Trolley Problem, because there is no duty, we typically describe the *action* (pulling the lever) as the cause of the one death, rather than the *inaction* as the cause of the five deaths. This linguistic shift protects the intuition that the bystander is not responsible for the five deaths.
