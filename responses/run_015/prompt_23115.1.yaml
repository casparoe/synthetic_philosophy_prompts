      *   **Clarify the Distinction:** Separate *Causal Claim* ("Did X cause Y?") from *Moral/Legal Claim* ("Is X blameworthy for Y?").
      *   **Address the Counterfactual Theory:**
          *   Strictly speaking, counterfactual theory *does* imply that any omission that would have prevented the outcome is a cause.
          *   *However*, this leads to the "problem of profligate omissions" (too many causes).
