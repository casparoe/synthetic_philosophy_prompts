      *   **Synthesize the "Normative Context" Solution:**
          *   Causation isn't just physics; it's context-dependent.
          *   We pick out "the cause" based on what was abnormal or expected.
          *   The lifeguard has a duty $\rightarrow$ omission is salient $\rightarrow$ cause.
          *   The bystander has no duty $\rightarrow$ omission is background $\rightarrow$ not typically labeled "the cause" in ordinary language, even if counterfactually relevant.
      *   **Conclusion:** The user isn't confused. Counterfactual analysis *alone* is often insufficient without pragmatic or normative filters to distinguish relevant causes from irrelevant ones.

