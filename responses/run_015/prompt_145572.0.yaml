answer: |-
  The Ethics Committee Chair tapped the slide projector, displaying a flowchart of twelve interlocking locks. "Colleagues, our governance model is mathematically robust. Each of us holds an individual veto over the safety protocol. For the AI to be cleared for deployment, all twelve of us must agree. The probability of premature activation is the product of our individual probabilities of error. We are, effectively, a conjunctive filter."

  A senior member at the end of the table didn't look up from his phone. "And Kevin? The junior researcher in the common room?"

  "Kevin is not on the committee," the Chair said. "He has no veto."

  "He also doesn't need the protocol," the member replied. "He has root access on his laptop. He can deploy the system unilaterally."

  The Chair blinked. "But... the vetoes. They raise the threshold for action."

  "No, Arthur," the member said, finally looking up. "They raise the threshold for *agreement*. But in a unilateralist structure, the outcome is determined by the agent with the lowest threshold for *action*. You've built a dam with twelve gates, but Kevin is standing downstream with a bucket."

  "So our vetoes don't prevent deployment?"

  "They prevent us from formally approving it," the member said. "Which means when Kevin presses Enter, we can all truthfully say we didn't authorize the apocalypse. We just failed to stop it."
