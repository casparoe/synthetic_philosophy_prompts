      *Check the "True Half" logic:* If she defines deception as "producing false beliefs," then true statements that mislead count. This collapses lying into misleading. Grice distinguished these. Does she want to lose that distinction?

      *Check the "Pipeline" logic:* If the retriever is dumb and the generator is dumb, but the combo lies, where is the selection? The *integration* was selected. This pushes her toward "system" = "deployment architecture," which blurs her line between system and context.

