      *Concession vs. Dodge:* Need a heuristic for the host.

  4.  **Developing the Content (incorporating the "Eval Team" Persona):**
      *   *Insight:* RLHF doesn't select for "false beliefs" directly. It selects for *high reward scores*. Reward models correlate with truth sometimes, but often correlate with *confidence* or *plausibility*. Dana's definition requires "selected *because*... false beliefs." This is a causal claim about the training loop that might be empirically false.
      *   *Insight:* "Deployment context" is actually part of the system in modern evals. We eval *with* prompts. Separating system from context is artificial.

  5.  **Drafting the Response:**

      *   *Section 1: Brainstorming Weaknesses.* (5-6 points).
      *   *Section 2: The Questions.* (Structured as requested).
      *   *Section 3: Closing Note.* (Where the host might be wrong).

      *(Self-Correction during drafting Q1 - Turkish)*: Make sure the follow-up hits the "same weights" issue. If selection history is on weights, and weights are same, deception status must be same. But output differs. Contradiction.
      *(Self-Correction during drafting Q5 - Murder Mystery)*: If she says "not deceptive because users consent," she admits norms matter. If she says "deceptive," she admits deception isn't inherently bad. Both are useful concessions.
