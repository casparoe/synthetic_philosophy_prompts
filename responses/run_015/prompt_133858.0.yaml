      *   *Weakness 2: The Turkish/Context Problem.* Same weights, different languages. The selection history is identical for the weights, but the behavior differs based on input. If deception is etiological (history-based), how does the *same* history produce deceptive vs. non-deceptive outputs based solely on prompt language?
      *   *Weakness 3: Implicature vs. Literal Falsehood.* Gricean lying often involves implicature. If the model says something literally true *to induce* a false belief, is it deceptive? Dana's definition says "producing false beliefs." Does this collapse deception into "misleading"?
      *   *Weakness 4: The "Good" Deception (Murder Mystery/Safety).* If a model lies to a bad actor (jailbreak protection) or for a game, it was selected to produce a false belief. Is that deception? If yes, is it bad? If no, she needs a normative clause (entitlement to truth), which reintroduces folk psychology/norms.
      *   *Weakness 5: System vs. Component (Pipeline).* In RAG or agentic workflows, the "selection history" is fragmented. The retriever wasn't selected to lie, the generator wasn't selected to lie, but the combo does. Who is the deceiver?
      *   *Weakness 6: Drift/Online Learning.* If a model changes via RL from user feedback (thumbs up), the selection history updates. When does it become deceptive? Is it a snapshot or a trajectory? Her definition seems static (training history) but the system is dynamic.

