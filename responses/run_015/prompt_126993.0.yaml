answer: |-
  Here is the diagnosis: **You are a Prioritarian.**

  The person in your reading group who called you a prioritarian is right about the engine of your judgments, even if the egalitarian intuition in Case 1 feels stronger to you. The person calling you an egalitarian is mistaking a *consequence* of your view (you often prefer equality) for the *cause* (you prioritize the worse off).

  Here is the principle that gets almost all of your verdicts: **Benefits matter more the worse off the person is.** This is not because equality is good in itself, but because a unit of welfare at level 20 is morally more urgent than a unit of welfare at level 80.

  Here is how that principle answers your specific questions, where it strains, and what you have to give up.

  ### (a) Absolute vs. Relative
  **Your view tracks absolute levels, not relative gaps.**
  This matters crucially for Case 1. An egalitarian prefers 50/50 over 90/10 because the *gap* is smaller. A prioritarian prefers 50/50 because the *sum of moral value* is higher.
  *   **Why:** On a prioritarian view, moral value has diminishing returns. Moving someone from 10 to 50 adds more moral value than moving someone from 50 to 90, even if the "welfare units" are the same.
  *   **Case 1:** You prefer 50/50 not because you hate the gap, but because the 10 in the 90/10 scenario are "wasted" on someone who doesn't need it as much as the 50s do.
  *   **Case 3:** This confirms you are not a Telic Egalitarian (someone who thinks equality is intrinsically good). You reject the 40/40 outcome because leveling down destroys welfare without helping anyone. A pure egalitarian struggles to explain why 40/40 is worse than 90/45 without contradicting themselves. You don't have that problem.

  ### (b) Lives vs. Moments
  **Your view applies to person-moments for allocation, but whole lives for evaluation.**
  Case 6 is not a contradiction; it is a feature of how health budgets work.
  *   **Allocation:** When you decide who to help *today*, you look at their current welfare level (the "moment"). The person currently at 20 (in their bad patch) gets priority over the person currently at 50 (in their mediocre patch).
  *   **Evaluation:** When you judge whose *life* went better, you sum the total. The life with the bad patch but high peaks is better than the flat mediocre life.
  *   **Consistency:** You can consistently believe "This life is better overall" while also believing "This person needs help more right now." Prioritarianism is typically time-slice sensitive for distribution. You are weighting their current suffering heavily, regardless of their future compensation.

  ### (c) Which verdict must you drop?
  **Case 5 is the outlier.**
  Cases 1, 2, 3, 4, 6, and 7 all hang together beautifully under Prioritarianism. Case 5 (100 people at 15 vs. 10 people at 70; you take the 10) breaks the model.
  *   **The Conflict:** If benefits matter more the worse off you are, the 100 people at 15 should swamp the 10 people at 70. The moral weight of welfare at 15 is massive. To choose the 10 at 70, you are effectively saying that the *number* of people doesn't matter much, or that 15 is "too low to save."
  *   **The Fix:** To be a consistent prioritarian, you should help the 100. Your verdict in Case 5 likely stems from a "viability bias" (the 15s seem hopeless) or an "identifiable lives" effect (the 10 are more visible).
  *   **Case 3 vs. 4:** You do **not** need to drop Case 3 to save Case 4. Case 3 (rejecting leveling down) is what saves you from being a dogmatic egalitarian. Case 4 (accepting a net loss to help the worst off) is the cost of being a prioritarian. You can keep both.

  ### (d) Unlisted Cases
  *   **The Contented Deprived:** If someone is at welfare level 15 but says they are "perfectly content" (adaptive preferences), a prioritarian helps them anyway. Welfare is treated objectively. Their contentment doesn't negate the moral urgency of their deprivation.
  *   **Animals:** If animals have welfare levels on a comparable scale, prioritarianism is species-neutral. A cow at 15 counts for more than a human at 80, *ceteris paribus*. In practice, you likely apply a species weighting, but the core principle pushes toward including them.

  ### The Levelling Down Objection (LDO)
  You asked if the LDO touches you. **No, but Case 4 does.**

  *   **The LDO (Case 3):** This objection kills *Telic Egalitarianism*. It says: "If equality is all that matters, you must prefer 40/40 to 90/45." You correctly reject this. Prioritarianism is immune to the LDO because it never recommends leveling down for no gain. It only recommends sacrifices if someone gains.
  *   **The Real Objection (Case 4):** Your friend is right that Case 4 is the hard pill. You are willing to lose 30 units of total welfare (90→60) to gain 20 units for the worse off (20→40).
      *   **Is this LDO?** No, because someone gains.
      *   **Is it defensible?** Yes, if you believe the moral value of relieving severe suffering (20→40) outweighs the moral value of reducing high welfare (90→60).
      *   **The Cost:** The "objection" here isn't logical inconsistency; it's the practical cost of your budget. You are committing to a view that says **efficiency (total welfare) can be sacrificed for urgency (priority).**

  ### Summary of Your View
  You are a **Lifetime Prioritarian with a Rejection of Luck Egalitarianism.**

  1.  **Own the Priority:** Stop apologizing for Case 2 and 4. You prioritize the worse off because their need is morally heavier, not because you want to punish the better off.
  2.  **Drop the Egalitarian Label:** Equality (Case 1) is a byproduct of your priority weighting, not the goal. This saves you from the Levelling Down Objection (Case 3).
  3.  **Fix Case 5:** This is the only place your gut is likely lying to you. If you truly believe the worse off matter more, 100 people at 15 must outweigh 10 people at 70. If you can't bring yourself to help the 100, you aren't a prioritarian; you're a sufficientarian (help those who can reach 'enough') or an elitist. Given your other answers, I suspect you should revise Case 5.
  4.  **Budget Implication:** Your budget should flow to the clinics and vans serving the lowest welfare baselines, even if the "total health gain" (QALYs) looks lower on a spreadsheet than vaccinating a healthier population. You are buying *moral value*, not just *welfare units*.

  **Final Verdict:** Your reading group friend who said "Prioritarian" is right. The one who said "Egalitarian" identified your intuitions but gave you the wrong map. You can keep Case 1, 2, 3, 4, 6, and 7. You need to rethink Case 5.
