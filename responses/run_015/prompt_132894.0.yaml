prompt: |-
  I sit on the executive committee of a branch of a general union, and I would like a decision procedure we can actually run.

  The setting: our branch covers roughly seven hundred directly employed members across three parcel distribution depots, plus — and this is the part that keeps causing arguments — around two hundred self-employed couriers who work the same routes, on the same handheld platform, against the same performance targets, but who are engaged through a separate services contract with an intermediary. Several times a year we are asked to authorise some form of industrial action: overtime bans, work-to-rule, short intermittent stoppages, all-out walkouts, refusals to cross another union's picket line. We have about forty minutes at a branch meeting, our members are not philosophers, and any decision has to survive two further stages: a ballot of the affected members and a sign-off from regional office, who will not sign off on anything they think is disproportionate. We cannot commission fresh advice for each decision, and I would rather the procedure did not rest on the details of any particular jurisdiction's labour law — treat statutory permissions and restrictions as a parameter we fill in locally, and give me the moral structure underneath, the part that would still oblige us if the law changed.

  The rough rule we have been using is: we may withdraw what the employer is paying for; we may not prevent other people from working; we may not aim at anyone who cannot give us what we want. I know that rule is too thin, and I will say why below.

  What I want is a procedure: the questions to ask, in order; what counts as a sufficient answer to each; the points at which the procedure returns a no and stops; the points at which it hands the question to a vote because it is a question about what we value rather than about facts; and the points at which it has no opinion at all. For each step, give me one line on which justification of the right to organise that step leans on — the freedom-of-association line, the coercion objection, the anti-domination or countervailing-power line, or something else — so I can see which parts of the procedure would collapse if we rejected one of those justifications. Please also mark the steps that are judgement calls dressed up as procedure; I would rather know which they are than be reassured.

  Two difficulties I want the procedure to handle explicitly, because they are where our current rule runs out. First, addressee: a strike seems to require somebody who can hear it and respond, but many of the decisions that matter to our members — routing, shift allocation, deactivation thresholds — are made by an automated scheduler, tuned by a product team that none of us can name and that has no employment relationship with us at all. Who, if anyone, is the legitimate addressee of pressure there, and does it matter that the local depot manager can only pass the pressure on? Second, aggregation: if members stop for two hours at a time, twice a week, for ten weeks, is that one strike or twenty, and is proportionality assessed against each stoppage, against the running total, or against the threat of the series continuing? Our rule gives no answer, and the answer decides whether intermittent action is the mildest available step or the most coercive one.

  Then run the finished procedure on four live proposals, showing your working:

  1. An overtime and voluntary-extra-shift ban at the two largest depots, properly balloted and notified, in response to a roster change that moves start times by forty minutes on two weeks' notice, which the employer says is permitted under a general flexibility clause. The financial impact is small and the disruption is mostly absorbed by the employer's own planning.

  2. An intermittent stoppage of two hours, announced twenty minutes in advance, twice weekly, in support of cleaners at the same site who are being dismissed and re-engaged through a subcontractor on worse terms. They are in a different union. Our members have no complaint against our own employer, the subcontractor is not our employer, and the stoppages are timed to the evening sort so that most of the cost falls on our employer rather than on the party to the dispute.

  3. An immediate walkout at one site after a serious near-miss involving a reversing vehicle: no ballot, no notice, and the yard to stay closed until an independent safety audit is commissioned. Our own safety representatives think the risk is real and continuing, and the members would vote for it on the spot. I expect the procedure to tell me something I will find hard to sell at the branch, and I want to know whether that verdict is correct or whether it exposes a defect in the procedure.

  4. A settlement offer of a six per cent increase bundled with a three-year no-strike clause. Tell me whether the procedure even has jurisdiction over this, or whether waiving the right to strike for a period is a values question for the members, and if so what the members should be asked.

  Finally, tell me honestly what the procedure cannot settle. In particular: can any version of it tell us, in advance, whether our members' simple refusal to volunteer for extra shifts is industrial action at all, given that the extra shifts were never contractually owed? And what may we do, under the procedure, about the thirty or so members who say they intend to keep working, and about the couriers who are not members and to whom none of our rules apply? Please do not give me reading lists, case citations or legal surveys — I need the argument, in British English, in a form I can take into a meeting.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**

      *   **User Role:** Executive Committee member of a union branch (700 direct employees + 200 self-employed couriers).
      *   **Context:** Parcel distribution depots. Frequent need to authorize industrial action (overtime bans, work-to-rule, stoppages, walkouts).
      *   **Constraints:** 40-minute meeting window. Members are not philosophers. Must survive a ballot and regional office sign-off (proportionality check). No fresh legal advice for every decision. Needs to be jurisdiction-agnostic regarding law (focus on moral structure).
      *   **Current Rule:** "Withdraw what employer pays for; don't prevent others working; don't aim at those who can't give us what we want." (User admits this is too thin).
      *   **Desired Output:** A step-by-step decision procedure (questions, sufficiency criteria, stop points, vote points, "no opinion" points). Each step needs a justification tag (freedom of association, coercion, anti-domination, etc.). Must identify "judgement calls dressed up as procedure."
      *   **Specific Difficulties to Address:**
          *   *Addressee:* Who is the target when decisions are automated/remote?
          *   *Aggregation:* How to count intermittent stoppages (one strike vs. twenty) for proportionality?
      *   **Test Cases:** Run the procedure on four specific scenarios (Overtime ban, Secondary action for cleaners, Safety walkout, Settlement offer).
      *   **Limitations:** Explicitly state what the procedure *cannot* settle (volunteering vs. action, non-members/couriers).
      *   **Tone/Style:** British English, practical, argument-focused, no legal citations/reading lists.

  2.  **Deconstruct the Moral & Strategic Framework:**

      *   *Core Tension:* Power vs. Legitimacy. Unions need leverage (coercion) to function, but that leverage must be constrained to remain defensible (both morally and to Regional Office).
      *   *Justifications:*
          *   *Countervailing Power:* Employers have structural power; workers need collective withdrawal of labour to balance it.
          *   *Freedom of Association:* Right to act together.
          *   *Proportionality/Necessity:* Harm inflicted must be linked to the gain sought and be the minimum required.
          *   *Solidarity:* Supporting others, but bounded by effectiveness and risk.
          *   *Safety:* An overriding imperative that might bypass normal procedure.
      *   *The "Addressee" Problem:* If the algorithm makes the decision, the pressure must still reach a human with budgetary or operational authority. If the local manager can't change the algorithm, striking against them is punitive but perhaps necessary to force *them* to pressure HQ.
      *   *The "Aggregation" Problem:* Intermittent action is often *more* disruptive than a continuous strike (uncertainty vs. known loss). Proportionality must assess the *cumulative* impact and the *intent* (disruption vs. negotiation).

  3.  **Drafting the Procedure (Iterative Process):**

      *   *Step 1: Jurisdiction & Competence.* Is this actually a trade dispute? (Prevents political strikes that Regional Office will block).
      *   *Step 2: The Addressee.* Who can fix this? (Addresses the algorithm issue).
      *   *Step 3: Exhaustion.* Have we tried talking? (Necessity).
      *   *Step 4: Proportionality & Aggregation.* (Addresses the intermittent strike issue).
      *   *Step 5: Collateral Damage.* (Addresses the "don't prevent others working" rule but refines it).
      *   *Step 6: Democratic Mandate.* (Ballot vs. Meeting vote).
      *   *Step 7: Review/Exit.* (When do we stop?).

      *Refining the Justifications:* Need to ensure each step has a clear philosophical tag (e.g., "Countervailing Power," "Non-Combatant Immunity," "Democratic Legitimacy").
      *Refining the "Judgement Calls":* Be honest about where the procedure relies on human estimation.

  4.  **Addressing the Specific Difficulties:**

      *   *Addressee:* The procedure must distinguish between the *target of pressure* (who feels the cost) and the *holder of the remedy* (who can change the policy). They don't have to be the same person, but there must be a causal chain.
      *   *Aggregation:* Define "Campaign" vs. "Incident." Proportionality applies to the *campaign strategy*, not just individual instances.

  5.  **Running the Test Cases:**

      *   *Case 1 (Overtime Ban):* Likely passes. Clear addressee, proportional, contractual boundary.
      *   *Case 2 (Cleaners/Secondary Action):* Likely fails or high risk. Addressee issue (our employer can't fix subcontractor terms easily), secondary action legal/moral complexities, proportionality (cost falls on employer, not decision maker).
      *   *Case 3 (Safety Walkout):* This is the tricky one. Legally, safety refusals are often protected, but procedurally, a "strike" implies a trade dispute. This might need a "Safety Override" clause. The user expects the procedure to say "No" (due to ballot/notice), but moral intuition says "Yes." I need to build a Safety Exception into the procedure.
      *   *Case 4 (Settlement/No-Strike):* This is a constitutional change, not an action decision. The procedure needs to flag this as a "Rights Waiver" requiring higher threshold.

  6.  **Addressing the Limitations:**

      *   *Volunteering:* Is refusing overtime "action"? Morally, it's withholding *extra* labour. The procedure should treat it as low-intensity action but still subject to coordination rules.
      *   *Non-members/Couriers:* The union has no authority over them. The procedure can only advise members on *their* conduct regarding picket lines or solidarity. It cannot bind the couriers.

  7.  **Drafting the Content (incorporating British English and Tone):**

      *   *Tone:* Professional, direct, slightly formal but accessible (Union branch level).
      *   *Structure:*
          1.  Introduction (Purpose).
          2.  The Procedure (Steps 1-7).
          3.  Handling the Two Difficulties (Addressee & Aggregation).
          4.  Application to Cases 1-4.
          5.  Limitations (What it can't do).

      *(Self-Correction during drafting)*: I initially thought about making the Safety Walkout fail the procedure to prove a point. But the user asked if the verdict is correct or exposes a defect. A good procedure *must* account for immediate danger. I will add a "Step 0: Immediate Danger" override. If there's imminent risk to life/limb, the procedure pauses. This distinguishes safety refusals from industrial coercion.

      *(Refining the Aggregation Logic)*: Intermittent action is often more coercive per hour lost. The procedure must ask: "Is the disruption calibrated to compel negotiation, or to inflict maximum pain?"

      *(Refining the Couriers)*: Be clear. They are not members. The union cannot authorize their action. The union can only advise members on how to interact with them (e.g., picketing rules).

  8.  **Final Review against Constraints:**

      *   40-minute meeting feasible? Yes, if the prep is done beforehand. The procedure is for the Exec to recommend to the meeting.
      *   No legal citations? Checked.
      *   British English? (e.g., "authorise," "programme," "labour").
      *   Justification tags included? Yes.
      *   Judgement calls marked? Yes.

  9.  **Final Polish:** Ensure the distinction between "Authorising Action" and "Recommending a Ballot" is clear. The Exec usually recommends; the members ballot. The procedure guides the Exec's recommendation.

  *(Self-Correction on Case 3)*: The user says "I expect the procedure to tell me something I will find hard to sell." If I put in a Safety Override, it might sell *too* easily. I need to be careful. The tension is between *democratic procedure* (ballot) and *emergency response* (safety). The procedure should flag that bypassing the ballot undermines the collective mandate, even if the cause is just. I will structure it so the Safety Override exists but carries a heavy reporting burden to maintain accountability.

  *(Self-Correction on Case 2)*: Secondary action is legally restricted in the UK. The prompt says "treat statutory permissions... as a parameter." I need to focus on the *moral* structure. Morally, solidarity is good, but efficacy and target alignment matter. If our employer can't fix it, hitting our employer is punitive, not persuasive.

  Let's write it.cw
answer: |-
  # The Branch Decision Procedure for Industrial Action

  **Purpose:** To provide the Executive Committee with a reproducible method for recommending industrial action to the branch. This procedure is designed to fit within a forty-minute meeting slot, assuming background facts (costings, legal minima) are prepared in advance. It prioritises moral defensibility and strategic efficacy over legal minimalism.

  **Status:** This is a tool for the Executive. It produces a recommendation (Authorise, Reject, or Refer to Ballot). It does not replace the statutory ballot, but ensures what goes to ballot is coherent.

  ---

  ## Part 1: The Procedure

  ### Step 0: The Safety Override
  **Question:** Is there an immediate, verifiable risk to life or limb that cannot be mitigated by normal reporting channels?
  *   **Yes:** Action is authorised immediately as a safety refusal, not a strike. Members withdraw labour from the specific hazardous task only. The Executive must ratify the *characterisation* of the risk within 24 hours.
  *   **No:** Proceed to Step 1.
  *   **Justification:** *Preservation of Life.* (This stands outside industrial relations; it is a human right).
  *   **Judgement Call:** Determining "immediate" vs. "chronic" risk.

  ### Step 1: The Trade Dispute Test
  **Question:** Is the primary grievance about terms, conditions, or physical working environment of the members taking the action?
  *   **Yes:** Proceed to Step 2.
  *   **No:** Stop. (Political or purely solidaritarian action requires a different threshold and likely Regional Office rejection).
  *   **Justification:** *Countervailing Power.* (The right to strike derives from the imbalance in the employment relationship; it is not a general right to disrupt).

  ### Step 2: The Addressee and Remedy
  **Question:** Can the entity bearing the cost of the action influence the decision-maker who controls the remedy?
  *   **Yes:** Proceed to Step 3.
  *   **No:** Stop. (If the local manager cannot fix it, and HQ is insulated from the local cost, the action is punitive, not persuasive).
  *   **Note on Automation:** If the decision is made by an algorithm, the Addressee is the human owner of that algorithm's budget or parameters. Pressure is legitimate if it forces the local manager to escalate to that owner.
  *   **Justification:** *Instrumental Rationality.* (Coercion is only legitimate if it is a means to a negotiated end, not an end in itself).

  ### Step 3: Exhaustion and Necessity
  **Question:** Have reasonable negotiations occurred, or is there evidence that negotiation would be futile?
  *   **Yes:** Proceed to Step 4.
  *   **No:** Stop. (Return to negotiation).
  *   **Justification:** *Last Resort.* (Industrial action is a failure of dialogue; it must not be the first tool).

  ### Step 4: Proportionality and Aggregation
  **Question:** Is the scale of disruption the minimum required to secure attention, and does the *cumulative* plan remain proportionate?
  *   **Rule on Aggregation:** Intermittent action is assessed as a *campaign*, not as isolated incidents. Ten stoppages of two hours are one strike of twenty hours. The disruption must not exceed what is necessary to signal resolve.
  *   **Sufficient Answer:** "This level of disruption creates a cost that outweighs the cost of conceding, without threatening the viability of the business or the safety of the public."
  *   **Yes:** Proceed to Step 5.
  *   **No:** Stop. (Reduce scope or intensity).
  *   **Justification:** *Proportionality.* (The harm inflicted must be commensurate with the grievance and the goal).
  *   **Judgement Call:** Estimating "minimum required." This is strategic, not factual.

  ### Step 5: Collateral Damage and Non-Combatants
  **Question:** Does the action unavoidably harm third parties who have no leverage over the dispute?
  *   **Yes:** Stop. (Unless the harm is transient and necessary to reach the Addressee).
  *   **No:** Proceed to Step 6.
  *   **Refinement:** Preventing others from working (picketing) is permissible only if those others are agents of the employer. Preventing independent contractors (couriers) from working is generally impermissible as they are not parties to the dispute.
  *   **Justification:** *Non-Combatant Immunity.* (Those outside the employment relationship should not bear the cost of the dispute).

  ### Step 6: Democratic Mandate
  **Question:** Does this action require a statutory ballot, or is it low-intensity enough for a meeting vote?
  *   **Rule:** Any action involving withdrawal of contracted labour (strike, overtime ban) requires a ballot. Work-to-rule or safety refusals may be authorised by meeting if Step 0 or Step 3 is satisfied.
  *   **Justification:** *Democratic Legitimacy.* (Those who bear the risk must authorise the risk).
  *   **Judgement Call:** Defining "withdrawal of contracted labour" vs. "withholding of goodwill."

  ### Step 7: The Exit Strategy
  **Question:** What is the specific condition for ending the action?
  *   **Sufficient Answer:** A return to negotiation, a specific concession, or a date for review.
  *   **No Opinion:** If the goal is "maximum pressure" with no defined end, the procedure returns **No Recommendation**.
  *   **Justification:** *Negotiated Settlement.* (Industrial action is a tactic to force a deal, not a permanent state of war).

  ---

  ## Part 2: Handling the Two Difficulties

  ### 1. The Addressee (The Algorithm Problem)
  The procedure treats the **local manager** as the *conduit* and the **budget holder/product owner** as the *Addressee*.
  *   **Why this works:** You cannot strike against code. You strike against the budget that funds the code.
  *   **Procedure Check:** In Step 2, you must demonstrate that the local cost (disruption) forces the local manager to escalate to the budget holder. If the local manager has no channel to escalate, the action fails Step 2. It becomes punishment of a fellow victim (the manager), which violates the *Instrumental Rationality* justification.

  ### 2. Aggregation (The Intermittent Strike)
  The procedure treats a series of planned stoppages as a **single campaign**.
  *   **Why this works:** Intermittent action is often *more* coercive than continuous action because it creates uncertainty that prevents planning.
  *   **Procedure Check:** In Step 4, you must assess the *total* planned disruption. If you plan ten stoppages, the proportionality test applies to the sum of the ten, not the individual two-hour blocks. If the total disruption is disproportionate, the campaign fails, even if individual instances look small.

  ---

  ## Part 3: Application to Live Proposals

  ### Case 1: Overtime and Voluntary-Shift Ban
  *   **Step 0 (Safety):** No immediate risk.
  *   **Step 1 (Trade Dispute):** Yes. Roster changes affect terms/conditions.
  *   **Step 2 (Addressee):** Yes. Depot management controls rosters or can escalate the flexibility clause interpretation.
  *   **Step 3 (Exhaustion):** Assume consultation occurred (per prompt).
  *   **Step 4 (Proportionality):** Yes. Financial impact small; disruption absorbed. This is the minimum effective pressure.
  *   **Step 5 (Collateral):** No significant third-party harm.
  *   **Step 6 (Mandate):** Requires ballot (withdrawal of contracted flexibility).
  *   **Step 7 (Exit):** Return to roster negotiation.
  *   **Verdict:** **Proceed to Ballot.**
  *   **Working:** This is a classic countervailing power move. It withdraws labour the employer pays for (overtime) without breaching contract. It is proportionate and targeted.

  ### Case 2: Intermittent Stoppages for Cleaners (Secondary Action)
  *   **Step 1 (Trade Dispute):** **Fail.** The grievance is not *our* members' terms. It is the cleaners'.
  *   **Step 2 (Addressee):** **Fail.** Our employer does not set the subcontractor's terms. Hitting our employer punishes them for a decision they may not control.
  *   **Step 4 (Proportionality):** **Fail.** The prompt states the cost falls on our employer, not the party to the dispute. This is punitive, not persuasive.
  *   **Verdict:** **Reject.**
  *   **Working:** While solidarity is morally sound (*Freedom of Association*), the procedure requires the action to be instrumental (*Instrumental Rationality*). This action hurts a neutral party (our employer) to pressure a third party (subcontractor) who feels no pain. It fails the Addressee and Proportionality tests. It also risks Regional Office rejection on legal grounds (secondary action), though the procedure rejects it on moral/strategic grounds first.

  ### Case 3: Safety Walkout (Near-Miss)
  *   **Step 0 (Safety Override):** **Pass.** Serious near-miss, continuing risk, safety reps verify.
  *   **Procedure Verdict:** **Authorise Immediately.**
  *   **The Tension:** You expected the procedure to say "No" because of the lack of ballot/notice.
  *   **Analysis:** If the procedure says "No," the procedure is defective. Safety is not industrial action; it is a refusal to accept unlawful or lethal working conditions. The *Justification* is *Preservation of Life*, which trumps *Democratic Legitimacy* (Step 6) in emergencies.
  *   **Caveat:** The Executive must ratify within 24 hours (Step 0 rule). If the risk is deemed chronic rather than immediate later, the action must convert to a formal dispute (Step 1) or stop.
  *   **Selling it:** You sell this not as a "strike" but as "exercising statutory safety rights." The procedure supports this distinction.

  ### Case 4: Settlement Offer (6% + No-Strike Clause)
  *   **Jurisdiction:** This procedure governs *action*, not *settlement*. However, Step 7 (Exit Strategy) touches on this.
  *   **Verdict:** **Refer to Membership Vote (High Threshold).**
  *   **Working:** Waiving the right to strike is a constitutional change to the members' power, not just a pay deal.
  *   **Question to Members:** "Are you willing to trade the *right* to strike for three years for this increase?"
  *   **Justification:** *Democratic Legitimacy.* The Executive cannot waive a fundamental right on behalf of the branch without explicit, informed consent. This is a values question, not a procedural one. The procedure flags it as high-risk because it reduces future Countervailing Power.

  ---

  ## Part 4: What the Procedure Cannot Settle

  You asked for honesty on the limits. Here they are.

  **1. The "Volunteering" Boundary**
  *   **The Problem:** Is refusing to volunteer for extra shifts industrial action?
  *   **The Limit:** The procedure cannot answer this definitively. It depends on the contract.
  *   **Guidance:** If the shifts are truly voluntary (no contractual expectation), refusing them is **not** industrial action under Step 1. It is individual choice. However, *coordinating* that refusal makes it collective.
  *   **Risk:** If the Executive coordinates a "voluntary" ban, Regional Office may deem it de facto industrial action requiring a ballot. The procedure treats this as a **Judgement Call** in Step 6. If the employer treats it as a breach of trust, it becomes action.
  *   **Advice:** Treat coordinated refusal of voluntary work as **Action** for the purposes of this procedure. It is safer to ballot than to be accused of covert coordination.

  **2. The Non-Members and Couriers**
  *   **The Problem:** What do we do about the 30 members crossing the line, or the 200 couriers?
  *   **The Limit:** The procedure has **No Opinion** on non-members. You cannot authorise action for people who are not in the union.
  *   **Couriers:** They are not employees. Step 5 (Non-Combatants) suggests you should not prevent them from working. They are independent businesses. Picketing them to stop work risks tortious interference.
  *   **Members Crossing the Line:** The procedure cannot compel them. Step 6 authorises the *action*, not the *individual*.
  *   **Advice:**
      *   **Couriers:** Advise members *not* to obstruct them. It violates Step 5 and exposes the union to liability.
      *   **Dissident Members:** The procedure authorises the collective mandate. Individuals choosing not to participate are exercising their own liberty. The procedure does not police them; it protects the legitimacy of those who do act. Do not make the procedure a tool for internal discipline; make it a tool for external legitimacy.

  **3. The "Judgement Calls"**
  *   I have marked them in the steps, but to be explicit: **Step 4 (Proportionality)** and **Step 0 (Immediate Risk)** are where the procedure relies on human wisdom.
  *   If the Executive disagrees on whether a risk is "immediate," the procedure does not resolve it. It requires a vote.
  *   If the Executive disagrees on whether disruption is "minimum required," the procedure does not resolve it. It requires a vote.
  *   **Why this is necessary:** You cannot algorithmise prudence. The procedure ensures you ask the right questions, not that it gives the right answers.

  ---

  ## Summary for the Meeting

  1.  **Safety First:** If it's dangerous, stop work. Sort the paperwork later. (Step 0).
  2.  **Target the Decision-Maker:** If the local manager can't fix it, don't strike against the local manager unless they can force HQ to listen. (Step 2).
  3.  **Count the Cost:** Intermittent strikes add up. Judge the whole campaign, not just the afternoon. (Step 4).
  4.  **Leave Others Out:** Don't stop the couriers. They aren't the enemy, and they aren't employees. (Step 5).
  5.  **Know the End:** If we don't know what stops the strike, we shouldn't start it. (Step 7).

  This procedure will not make you popular with members who want to fight for the cleaners (Case 2) or who want to ignore the ballot for safety (Case 3). But it will keep your authorisations defensible to Regional Office, and it will keep your moral footing solid when the employer asks, "What do you want?"
