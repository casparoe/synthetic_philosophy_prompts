  2.  **Deconstruct the Arguments:**
      *   **Moore:** Premise 1: Here is one hand (demonstrating). Premise 2: Here is another. Conclusion: External objects exist (therefore an external world exists). Claim: Premises are more certain than sceptical hypotheses.
      *   **Counter-Moore (Sceptic):** Premise 1: Here is one experience of a hand. Premise 2: Here is another. Conclusion: At least two experiences exist (no commitment to external world). Claim: Premises are more certain than Moore's external world claims.

