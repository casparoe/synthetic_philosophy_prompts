      *   *The "Proof" Status:* Moore claims it's a proof of an external world. The Sceptic claims it's a proof of only experiences.
      *   *Wittgensteinian Angle (On Certainty):* Moore isn't really proving anything; he's showing that certain propositions function as hinges. The Sceptic tries to make *their* hinge the only valid one.
      *   *The Disanalogy:* Moore's statement ("Here is a hand") is a claim about the *world*. The Sceptic's statement ("Here is an experience") is a claim about the *mind*. The asymmetry lies in what counts as a "certainty" within our language game. Moore is appealing to common sense realism; the Sceptic is appealing to Cartesian immediacy.
      *   *Is it a standoff?* Epistemically, the Sceptic's premise is arguably *more* secure (harder to doubt) than Moore's. But Moore's point is that the Sceptic's restriction is artificial.
