answer: |-
  # Seminar Game: The Cost of Truth
  **Time:** 80 Minutes
  **Students:** 18 (Upper-level Philosophy of Biology)
  **Materials:** Index cards (3 per student), Envelopes (18), Projector (for payoff tables), Pens.

  ## 1. Setup & Roles (10 Minutes)
  Divide the class into **Group A (9 Signallers)** and **Group B (9 Receivers)**. They will swap roles after Condition 3.

  **The Hidden Type:**
  Hand each Signaller a sealed envelope containing their **Type Card**.
  *   **Distribution:** 3 Low (L), 3 Medium (M), 3 High (H).
  *   **Instruction:** "This is your biological quality. Keep it secret. It does not change during your time as a Signaller."

  **The Matching Protocol (Anti-Reputation):**
  1.  Signallers write decisions on index cards. **No names.** No distinctive marks.
  2.  Signallers place cards in envelopes, seal them.
  3.  Instructor collects all envelopes, shuffles them visibly.
  4.  Receivers draw one envelope at random.
  5.  **Crucial Rule:** "You are matched with a new partner every round. You will never know who they were. If you try to mark cards to build a reputation, I will void the round and deduct points. This game is about *anonymous* interaction."

  **Payoff Structure (Projected):**
  *   **Receiver:** Gets **10 points** if they **Accept** a High or Medium type. Gets **-10 points** if they **Accept** a Low type. Gets **0 points** if they **Reject**.
  *   **Signaller:** Gets **15 points** if **Accepted**. Gets **0 points** if **Rejected**. **Minus Signal Cost** (varies by condition).

  ---

  ## 2. The Conditions (30 Minutes Total)
  *Run 1 round per condition. 4 minutes per round (Decision, Match, Reveal, Score).*

  ### Condition 1: Free Signalling (Cheap Talk)
  *   **Signal Options:** None (0) or Flashy (1).
  *   **Cost:** 0 for all types.
  *   **Prediction:** Everyone signals "Flashy". Receivers accept all.
  *   **Outcome:** Pooling. Signal conveys no information.

  ### Condition 2: Flat Cost (The Slogan Trap)
  *   **Signal Options:** None (0) or Flashy (1).
  *   **Cost:** 5 points for **all** types (L, M, H).
  *   **Logic:** Benefit (15) - Cost (5) = 10. Still profitable for Low types.
  *   **Prediction:** Everyone signals. Receivers accept all.
  *   **Outcome:** Costly, but still dishonest. "Expensive" did not ensure "Honest."

  ### Condition 3: Differential Cost (The Handicap)
  *   **Signal Options:** None (0) or Flashy (1).
  *   **Cost:**
      *   Low: 12 points (Net if Accepted: 3).
      *   Medium: 6 points (Net if Accepted: 9).
      *   High: 2 points (Net if Accepted: 13).
  *   **Logic:** Low types lose more than they gain if rejected, or gain too little to risk it. High/Med gain significantly.
  *   **Refinement for Separation:** To ensure *only* High signal (cleanest result), adjust Low/Med Cost to 16.
      *   **Revised Cost:** Low/Med = 16, High = 2.
      *   **Low/Med:** $15 - 16 = -1$ (Better to Reject/0).
      *   **High:** $15 - 2 = 13$ (Signal).
  *   **Prediction:** Only High types signal. Receivers Accept Signal, Reject No Signal.
  *   **Outcome:** Separating Equilibrium. Honesty emerges via differential burden.

  *(Swap Roles: Group A becomes Receivers, Group B becomes Signallers. Redistribute Type Cards.)*

  ### Condition 4: The Unfakeable Index
  *   **Signal Options:** None or Flashy (Cost 2 for all).
  *   **New Mechanic:** Signaller must also hand over a **Colored Token** with the envelope.
      *   Low = Red Token.
      *   Medium = Yellow Token.
      *   High = Green Token.
  *   **Rule:** Tokens are issued by the instructor based on Type Card. Cannot be faked.
  *   **Prediction:** Signallers stop signalling (save the 2 points). Receivers ignore the Flashy signal and look only at the Token.
  *   **Outcome:** Signals vanish. Indexes dominate.

  ### Condition 5: Noisy Public Cue (Counter-Signalling)
  *   **Signal Options:** None or Flashy (Cost 6 for all).
  *   **New Mechanic:** Receiver gets a **Hint Card** with the envelope.
      *   If Signaller is High: Hint says "Safe Bet".
      *   If Signaller is Medium: Hint says "Safe Bet" (50% chance) or "Unknown" (50% chance).
      *   If Signaller is Low: Hint says "Unknown".
  *   **Payoff Tweak:** High Types get a **Bonus 5 points** if they are Accepted *without* Signalling (saving effort).
  *   **Logic:**
      *   **Low:** Hint "Unknown". Receiver Rejects. Signal too expensive to change mind.
      *   **High:** Hint "Safe Bet". Receiver Accepts. High saves cost, doesn't signal.
      *   **Medium:** Hint "Safe Bet". Receiver *might* Accept. But Medium fears being lumped with Low "Unknowns" who bluffed. Or, Medium signals to distinguish from High who are "coasting".
      *   *Simplified Game Logic:* Make the Cost high enough that High prefers to rely on the Hint. Make the Hint ambiguous enough that Medium *must* signal to guarantee Acceptance.
  *   **Prediction:** High types stay quiet (rely on cue). Medium types signal hardest (to prove they aren't Low). Low types stay quiet (can't afford it).
  *   **Outcome:** Non-monotonic signalling (Counter-signalling).

  ### Condition 6: Burn vs. Gift (Optional/Time Permitting)
  *   **Signal Options:**
      *   **Burn:** Pay 5 points. Receiver gets 0.
      *   **Gift:** Pay 5 points. Receiver gets 5.
      *   **None:** Pay 0.
  *   **Logic:** Both cost the Signaller 5.
  *   **Prediction:** Receivers prefer Gift (free points). But Low types can afford Gift just as easily as Burn.
  *   **Outcome:** If Gift is allowed, everyone Gifts. Honesty collapses. Shows that *waste* (Burn), not just cost, is required for information transfer.

  ---

  ## 3. Reputation Management (Instructor Script)
  *   **Pre-Game:** "This game models evolution, not a semester-long friendship. Your partner changes every 3 minutes. Any attempt to write names, use specific handwriting, or agree on strategies out loud will result in a score of zero for that round. I am watching for collusion."
  *   **During Game:** If you see students comparing cards or laughing knowingly: "Remember, anonymity is the constraint. If I suspect identity matching, I will reshuffle all types."
  *   **Why:** In biology, animals often meet strangers. If reputation were allowed, the Handicap Principle is unnecessary (trust is built via iteration). We must block this to isolate the *signal cost* mechanism.

  ---

  ## 4. The Debrief (35 Minutes)
  *Do not use jargon until now.*

  **Step 1: Data Review (5 mins)**
  Project the aggregate results for each condition (e.g., "% of High Types who Signalled", "% of Receivers who Accepted").
  *   Ask: "In Condition 2, the signal was costly. Why did honesty fail?"
  *   Ask: "In Condition 3, what changed? Was it the cost, or *who* paid it?"

  **Step 2: Mapping Concepts (15 mins)**
  Introduce terms *after* they describe the behavior.

  1.  **Condition 1 & 2 (Pooling):** "You found that cost alone didn't work. This refutes the slogan 'Trust me, this was expensive.' If a Low type can afford it, they will lie."
  2.  **Condition 3 (Separating Equilibrium / Handicap Principle):** "Honesty emerged only when the cost was **differential**. The signal wasn't trustworthy because it was hard; it was trustworthy because it was *harder for the liar*."
      *   *Key Takeaway:* The marginal cost must be inversely related to quality.
  3.  **Condition 4 (Index):** "When truth is physically guaranteed, signalling vanishes. Signals are only needed when deception is *possible*."
  4.  **Condition 5 (Counter-Signalling):** "Why did the High types stop signalling? Because they were already identified. The Medium types signalled to avoid being mistaken for Low. This shows signalling is strategic, not just a reflex of quality."
  5.  **Condition 6 (Burn vs. Gift):** "Why did the Gift destroy the signal? Because a transfer of value is a bribe, not a proof of quality. The cost must be **wasted** (burned) to prove I have resources to spare."

  **Step 3: Limitations & Biological Reality (10 mins)**
  Be frank about what the card game hides:
  1.  **Rationality vs. Evolution:** Students calculated payoffs. Animals don't calculate; they inherit strategies that survived. The game shows the *logic*, not the *mechanism*.
  2.  **Discrete Types:** Biology is continuous. The "three types" simplification hides the gradient nature of quality.
  3.  **One-Shot vs. Lifetime:** In nature, signalling is repeated. We blocked reputation to isolate the handicap, but in reality, handicap and reputation often work together.
  4.  **The "Why":** The game shows *that* differential cost works. It doesn't prove *why* nature selects for peacocks' tails specifically (predation risk, metabolic load, etc.).

  **Step 4: Closing Question (5 mins)**
  "Looking at Condition 3: If a Low type *could* evolve to bear the High cost, what happens to the system?"
  *   *Answer:* The signal collapses. The Handicap Principle requires the cost constraint to be physically linked to the quality (e.g., immune system strength), not just a fee.

  ---

  ## 5. Contingency Plans
  *   **If Condition 3 Fails (Low types signal anyway):**
      *   *Recovery:* "Look at the Low type payoffs. You signaled, got accepted, but ended with negative points. You went extinct. In the next generation, you wouldn't be here." (Reframe as evolutionary pressure).
  *   **If Condition 5 Confuses:**
      *   *Recovery:* Skip the deep theory. Focus on the result: "Sometimes the best signal is silence, if your quality is obvious."
  *   **If Time Runs Short:**
      *   Drop Condition 6 (Burn vs. Gift). It is illustrative but less central than the Differential Cost (Cond 3) and Counter-signalling (Cond 5).

  ## 6. Instructor Cheat Sheet (Payoff Math)
  *Ensure these are on the projector.*

  | Condition | Signaller Benefit (if Accepted) | Cost (Low) | Cost (Med) | Cost (High) | Expected Behavior |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Free** | 15 | 0 | 0 | 0 | All Signal (Pooling) |
  | **2. Flat** | 15 | 5 | 5 | 5 | All Signal (Pooling) |
  | **3. Handicap** | 15 | 16 | 16 | 2 | High Signals, L/M Quiet (Separating) |
  | **4. Index** | 15 | 2 | 2 | 2 | No Signal (Index used) |
  | **5. Counter** | 15 (+5 bonus if No Signal) | 10 | 6 | 6 | Med Signals, H/L Quiet |

  *Note for Cond 5:* The Bonus for High types not signalling is the key mechanic to drive the non-monotonic result in a short game.
