answer: |-
  ### 1. The Dependency Structure (Ordering)

  Do not teach "Tragedy of the Commons" and "Public Goods" as two topics. Teach them as **one incentive structure applied to two different flow directions.** The sequence must be rigid. If you invert it, the conceptual fusion you fear becomes inevitable.

  **The Sequence:**
  1.  **The Incentive Structure (Prisoner's Dilemma):** Establish that individual rationality $\neq$ collective rationality. *Dependency:* This must land before any resource is mentioned. If you start with the resource (the pasture/pipe), students attribute the failure to the *nature of the resource* (e.g., "grass grows slowly") rather than the *payoff matrix*.
  2.  **Valve 1: Appropriation (The Tragedy):** Apply the PD to *taking* from a stock. Each unit taken benefits the taker, costs the group. *Dependency:* This must come before Provision. "Taking" is cognitively prior to "Giving." If you start with Provision, students conflate Public Goods with charity or altruism.
  3.  **Valve 2: Provision (The Public Good):** Apply the PD to *contributing* to a stock. Each unit given costs the giver, benefits the group. *Dependency:* This must be presented explicitly as the *mirror image* of Valve 1. If you treat this as a new topic, they will not see the structural identity.
  4.  **The Property Rights Intervention:** Introduce privatization/enclosure as the standard remedy for Valve 1. *Dependency:* This must come *after* both valves are open.
  5.  **The Interaction Failure:** Show how fixing Valve 1 can break Valve 2. *Dependency:* This is the climax. If you introduce this earlier, it confuses the definition of the valves.

  **What fails if you invert the order:**
  *   **If you teach Provision before Appropriation:** Students anchor on "free-riding" as the core problem. They will interpret the Tragedy of the Commons merely as "people not paying their share," missing the active degradation aspect.
  *   **If you teach Property Rights before the Valves:** Students conclude "Private Property solves Commons problems." You will not be able to dislodge this when you introduce the Provision valve, because they will assume ownership automatically solves maintenance (it often doesn't; it just changes who pays).
  *   **If you teach the Valves simultaneously:** They blur. Students will leave thinking "Commons" and "Public Goods" are synonyms for "stuff we share."

  **The Remedy Conflict (The Case You Requested):**
  You need a case where solving the Appropriation problem exacerbates the Provision problem. Use the **Drainage Example** (detailed below) with **Flow Velocity**.
  *   *The Remedy:* To stop sediment dumping (Appropriation), the group agrees to restrict water usage (low-flow fixtures) to reduce the volume of waste entering the pipe.
  *   *The Unintended Consequence:* Lower water volume reduces flow velocity. Sediment settles *faster* in the pipes. The maintenance burden (Provision) increases drastically.
  *   *The Lesson:* A remedy aimed at the "Take" valve (restriction) increased the cost on the "Give" valve (maintenance), potentially collapsing the system faster. This proves the valves are distinct and coupled.

  ---

  ### 2. The Core Example: The Terraced House Drainage System

  **The Setup:**
  A terrace of **8 identical houses** built in 1900. They share a single, underground clay sewer pipe that runs the length of the terrace to the main city connection.
  *   **The Users:** The 8 households (name them House 1 to House 8).
  *   **The Resource:** The *capacity* and *flow* of the shared pipe.
  *   **Valve 1 (Appropriation/ToC):** Disposing of grease and solid waste.
      *   *Incentive:* It is convenient and cheap for House $i$ to pour grease down the sink.
      *   *Externality:* The grease hardens in the shared pipe, reducing capacity for all 8 houses.
  *   **Valve 2 (Provision/PG):** Jet-cleaning the pipe.
      *   *Incentive:* It costs £500 for House $i$ to hire a cleaner.
      *   *Externality:* Clean pipe benefits all 8 houses (better flow, no backups).
  *   **The Threshold (Non-Convexity):** The pipe functions normally until sediment fills 60% of the diameter. Above 60%, heavy rain causes sewage to back up into the lowest house's basement. The marginal unit of grease looks identical before and after the threshold, but the *consequence* jumps discontinuously.
  *   **The Enclosure Failure (Physical vs. Property Unit):**
      *   Suppose the residents divide the pipe legally: House 1 owns the first 10 meters, House 2 the next 10, etc.
      *   *Failure:* Water and grease flow physically across boundaries. House 1 can stop *their own* dumping, but House 2's grease flows into House 1's segment and clogs it. Property rights cannot match the fluid dynamics. Enclosure fails to internalize the externality.
  *   **The Equilibrium:** The pipe does not explode. It degrades. Drains become slow. Backups happen once a year. This is a "bad" equilibrium, not a "dead" one.
  *   **Constraints Met:** No villains (everyone just washes dishes), no population growth, no regulator, not a pasture/fishery.

  ---

  ### 3. The Misconception Map

  Do not list these as "Myths." Introduce them as "Plausible Inferences" at specific points in the sequence, then break them.

  | Sequence Point | Misconception | Status | How to Handle |
  | :--- | :--- | :--- | :--- |
  | **After Hardin Reading** | *"The tragedy is about greed."* | **Break Immediately.** | Show the PD matrix. If everyone is altruistic but *uncorrelated*, the tragedy still holds. If everyone is greedy but *coordinated*, it resolves. It is about incentives, not character. |
  | **After Valve 1 (ToC)** | *"The fix is private ownership."* | **Let Form, Then Break.** | Allow them to propose dividing the pipe. Then reveal the Enclosure Failure (fluid dynamics). Ownership works for cows; it fails for flows. |
  | **After Valve 2 (PG)** | *"Commons and Public Goods are the same."* | **Break.** | Explicitly map the signs. ToC = Negative Externality on Take. PG = Positive Externality on Give. Same matrix, opposite sign. |
  | **During Equilibrium** | *"My one unit makes no difference."* | **Break via Reciprocity.** | Use the "Universalization" test. "You are right, your unit doesn't matter. But *everyone* is you. If the logic holds for you, it holds for all 8." |
  | **During Threshold** | *"It's been fine for years, so one more is fine."* | **Break.** | Use the 60% sediment rule. The marginal step *is* the trigger, even if it looks like the previous steps. Average-rate reasoning fails at thresholds. |
  | **During Solutions** | *"We need an external enforcer."* | **Correct.** | PD predicts defection in a *one-shot* game. This is a repeated community. Mention communication/monitoring (Ostrom) without detailing the principles. |

  **Missing Misconception:**
  *   *"Technology will save us."* Students often suggest "Better pipes!" or "Bio-degradable soap!"
  *   *Handling:* Acknowledge it, but bracket it. "That changes the payoff matrix. For this seminar, the matrix is fixed. We are solving for behavior, not engineering."

  ---

  ### 4. Deliverables

  **The Opening (5 Minutes)**
  1.  **Minute 1:** Acknowledge the Hardin reading. "Hardin tells a story about herdsmen. I want you to forget the herdsmen. Remember the *math*."
  2.  **Minute 2:** Draw a 2x2 PD matrix on the board. Label payoffs (T, R, P, S). Ask: "Who knows why Rational Choice leads to (Defect, Defect)?" (Quick check of prior knowledge).
  3.  **Minute 3:** "Today we are not learning two topics. We are learning one structure with two settings." Draw a pipe on the board. Draw a valve on the inlet, a valve on the outlet.
  4.  **Minute 4:** Introduce the 8-House Terrace. "This pipe is our laboratory. No cows, no fish, no atmosphere. Just eight neighbours and one blockage."
  5.  **Minute 5:** State the Board Sentence.

  **The Board Sentence (Leave up for 50 mins)**
  > **"Appropriation (Take) and Provision (Give) share a structure but require different remedies."**

  **The Closing Question (Last 10 Minutes)**
  *   **The Question:** "We have successfully fined every household for dumping grease (Valve 1 is closed). The pipe is still backing up. Why?"
  *   **The Target Answer:** "Because closing the Take valve didn't open the Give valve. No one is paying for maintenance (Valve 2), and perhaps the low flow from reduced dumping is allowing sediment to settle faster."
  *   **The Empty Answer (Superficially Correct):** "Because people are still selfish." (This ignores the Two-Valves distinction and reverts to the 'greed' misconception).
  *   **The Empty Answer (Memorized):** "Because it's a Public Good problem." (This labels it without explaining the mechanism).

  **The Refusal**
  *   **The Question to Refuse:** "So, which system is best? Should we privatize or nationalize the pipes?"
  *   **The Script:** "I can tell you how the incentives change under each system, but I cannot tell you which value system you should adopt to choose between them. That is politics, not economics."

  **What to Leave Out (Say this aloud)**
  "I am explicitly leaving out three things. First, **Ostrom's Design Principles**: I want you to know she proved Hardin wrong empirically, but we do not have time for her eight criteria. Second, **Coasean Bargaining**: We are assuming transaction costs are high enough to prevent side-payments. Third, **History**: We are not asking if English commons actually collapsed. We are asking if the *model* predicts they should. Do not confuse the map for the territory."

  ---

  ### 5. Seminar Flow (Dependency Check)

  1.  **00-05:** Opening & Board Sentence.
  2.  **05-15:** **Valve 1 (Appropriation).** Map the grease dumping to the PD matrix. Dominant strategy = Dump. Equilibrium = Clogged.
      *   *Misconception Check:* Is this greed? (No, it's dominant strategy).
  3.  **15-25:** **Valve 2 (Provision).** Map the cleaning cost to the PD matrix. Dominant strategy = Free-ride. Equilibrium = Dirty.
      *   *Misconception Check:* Is this the same as Valve 1? (Yes, structurally. No, directionally).
  4.  **25-35:** **The Property Rights Intervention.** Propose dividing the pipe.
      *   *Reveal:* The Enclosure Failure. Fluid ignores legal lines.
      *   *Misconception Check:* Does ownership solve everything? (No).
  5.  **35-45:** **The Interaction.** Introduce the Flow Velocity constraint. Restricting water (fixing Valve 1) increases sedimentation (breaking Valve 2).
      *   *Misconception Check:* Can we fix one valve in isolation? (No).
  6.  **45-50:** Closing Question & Refusal.

  **Final Note on Tone:**
  You are not teaching them to save the world. You are teaching them to read the architecture of a problem. If they leave knowing that "Privatization fixes appropriation but ignores provision," you have succeeded. If they leave thinking "Commons are bad," you have failed. Keep the tone analytical, not prescriptive.
