      *   *Free Energy Principle (FEP):* A mathematical theorem/normative principle derived from statistical physics and information theory. It states *why* any self-organizing system must behave this way to persist. It's the "law."
      *   *The Connection:* PP is often seen as the specific instantiation of FEP in neural tissue. FEP provides the mathematical justification for PP.

  3.  **Address the "Just Bayesian Brain with Fancier Notation" Critique:**
      *   *Valid Point:* At the level of perception (inference), FEP reduces to Variational Bayes. If you already know Variational Bayes, the "minimize VFE" part looks like "maximize ELBO" (Evidence Lower Bound).
      *   *The Added Value:*
          1.  **Action/Active Inference:** Standard Bayesian Brain focuses on updating beliefs. FEP explicitly couples action to inference. Action changes the input to minimize error, not just updating the model to fit input.
          2.  **Existence/Self-Organization:** FEP claims this isn't just a good strategy; it's a *necessary condition* for a system to maintain its identity (Markov blanket) over time. This moves from "engineering choice" to "physical law."
          3.  **Expected Free Energy (EFE):** This is crucial for planning. It splits into *risk* (pragmatic) and *ambiguity/epistemic value* (information gain). Standard RL or Bayes often treats exploration as a heuristic (epsilon-greedy). EFE derives exploration as intrinsic to survival.

