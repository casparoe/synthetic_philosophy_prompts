answer: |-
  # Specification for an Adequate Interpretation of Quantum Mechanics

  **Context:** This document outlines the necessary and sufficient conditions for a physical theory to count as a viable *interpretation* of quantum mechanics (QM) in the post-Bell era. It distinguishes between empirical necessities, conceptual virtues, and contested metaphysical commitments.

  ---

  ## Part I: Desiderata and Constraints

  The following list defines the target. Each item includes the **Motivation** (why we want it), the **Status** (Non-negotiable vs. Virtue), and **Contestation** (who rejects it and why).

  ### 1. Empirical Adequacy (The Born Rule)
  *   **Motivation:** The interpretation must recover the statistical predictions of standard quantum formalism to within experimental error. Specifically, it must derive or postulate the Born Rule ($P = |\psi|^2$) for measurement outcomes.
  *   **Status:** **Non-negotiable.** A theory that contradicts established experimental data is falsified, not an interpretation.
  *   **Contestation:** None. Even instrumentalists require this. However, *deriving* the Born Rule (rather than postulating it) is a point of contention (e.g., Everettians strive to derive it; Copenhagen postulates it).

  ### 2. Definite Outcomes (The Measurement Problem)
  *   **Motivation:** Experiments yield single, specific results (a pointer points left, not a superposition of left and right). The interpretation must account for the transition from quantum potentiality to classical actuality without logical contradiction.
  *   **Status:** **Non-negotiable** (for single-world views). **Contested** (for Many-Worlds).
  *   **Contestation:** **Everettians (Many-Worlds)** deny this requirement in its traditional form, arguing that *all* outcomes occur in branching worlds. **Copenhagen** proponents often treat this as a primitive "cut" rather than a dynamical process.

  ### 3. Signal Locality (No-Superluminal Signaling)
  *   **Motivation:** Compatibility with Special Relativity. It must be impossible to transmit information faster than light, preserving causal structure and preventing paradoxes.
  *   **Status:** **Non-negotiable.** Violation would contradict relativistic quantum field theory and experimental tests of Bell inequalities (which confirm no-signaling).
  *   **Contestation:** None. All major interpretations respect the *no-signaling theorem*. Note: This is distinct from *Bell Locality* (see Section II).

  ### 4. Ontological Clarity (The "What Exists" Criterion)
  *   **Motivation:** Physics describes reality. The interpretation should specify what entities exist (waves, particles, fields, minds) and what the quantum state $\psi$ represents (a physical object or information).
  *   **Status:** **Theoretical Virtue.** **Contested.**
  *   **Contestation:** **Instrumentalists/Copenhagen/QBism** deny this is required. They argue physics predicts observations, not underlying reality. Demanding ontology is deemed "metaphysical excess." **Realists (Bohm/GRW)** argue that without ontology, the theory is incomplete.

  ### 5. Observer Independence (Objectivity)
  *   **Motivation:** Physical reality should not depend on whether an agent is looking at it. The state of the system should be distinct from the knowledge of the system.
  *   **Status:** **Theoretical Virtue.** **Contested.**
  *   **Contestation:** **QBism and Relational QM** explicitly reject this. They argue the quantum state is relative to an agent or interaction. **Realists** argue that abandoning objectivity renders science solipsistic.

  ### 6. Dynamical Completeness (Unitarity)
  *   **Motivation:** The time evolution of the physical state should be governed by a single, universal dynamical law (e.g., the Schrödinger equation) without ad-hoc interruptions.
  *   **Status:** **Theoretical Virtue.** **Contested.**
  *   **Contestation:** **Objective Collapse (GRW)** theories explicitly violate this by adding non-linear stochastic terms to induce collapse. **Copenhagen** violates this via the "collapse postulate." **Everettians** insist this is Non-negotiable.

  ### 7. Measurement Independence (Statistical Independence)
  *   **Motivation:** The choice of measurement setting should be statistically independent of the hidden variables describing the particle source. This is the "free choice" or "no-conspiracy" assumption.
  *   **Status:** **Methodological Necessity.** **Contested.**
  *   **Contestation:** **Superdeterminists** reject this. They argue correlations between settings and states can exist due to common past causes. Most physicists reject this as it undermines the scientific method (you cannot test hypotheses if settings are correlated with hidden variables).

  ---

  ## Part II: Joint (Un)satisfiability and No-Go Theorems

  This section details which subsets of the above desiderata are mathematically proven to be incompatible. **No interpretation can satisfy all virtues simultaneously.**

  ### 1. The Bell Trade-off (Locality vs. Realism vs. Adequacy)
  *   **Theorem:** Bell's Theorem (1964) + Aspect/Zeilingher Experiments.
  *   **Conflict:** You cannot simultaneously hold:
      1.  **Empirical Adequacy** (QM predictions are correct).
      2.  **Bell Locality** (Outcomes depend only on local settings and past light-cone variables).
      3.  **Realism** (Properties exist prior to measurement).
  *   **Explicit Constraint:** **Local Realism is false.**
  *   **Required Sacrifice:** To maintain Empirical Adequacy, you must abandon either **Bell Locality** (e.g., de Broglie-Bohm) or **Realism/Counterfactual Definiteness** (e.g., Copenhagen, QBism).
  *   *Note:* You *can* keep **Signal Locality** (Desideratum 3) while abandoning **Bell Locality**. Bohmian mechanics is non-local in the Bell sense but respects Signal Locality.

  ### 2. The Kochen-Specker Constraint (Non-Contextuality)
  *   **Theorem:** Kochen-Specker Theorem (1967).
  *   **Conflict:** You cannot assign definite values to all physical observables simultaneously in a way that is independent of the measurement context (which other compatible observables are measured).
  *   **Required Sacrifice:** **Non-Contextual Realism.** Any realist interpretation (one that satisfies Desideratum 4) must be **Contextual**. The value of a property depends on how you measure it.
  *   **Impact:** Rules out naive hidden variable theories where particles carry pre-determined values for all possible spins/positions.

  ### 3. The PBR Constraint (Psi-Epistemic Views)
  *   **Theorem:** Pusey-Barrett-Rudolph (PBR) Theorem (2012).
  *   **Conflict:** If quantum states represent only knowledge about an underlying reality (Psi-epistemic) and systems prepared independently have independent physical states (Preparation Independence), then predictions contradict QM.
  *   **Required Sacrifice:** Either the **Psi-Epistemic View** (the wavefunction is just information) or **Preparation Independence**.
  *   **Impact:** Strongly suggests the wavefunction $\psi$ must be **Ontic** (a real physical state), not merely epistemic (knowledge), unless one accepts exotic correlations in preparation. This pressures Copenhagen and QBism.

  ### 4. The Determinism-Locality-Empirical Triad
  *   **Theorem:** Bell's Theorem (reformulated).
  *   **Conflict:** **Determinism + Bell Locality + Empirical Adequacy** is impossible.
  *   **Explicit Constraint:** A deterministic theory *must* be non-local (e.g., Bohm). A local theory *must* be indeterministic (e.g., Copenhagen/GRW) or abandon Measurement Independence (Superdeterminism).
  *   **Trade-off:** You cannot have a "Local Deterministic" universe that matches QM data.

  ### 5. The Wigner's Friend Tension (Observer Independence)
  *   **Theorem:** Extended Wigner's Friend No-Go Theorems (Brukner 2018, Bong et al. 2020).
  *   **Conflict:** **Observer-Independent Facts + Universal Validity of QM + Single Outcomes.**
  *   **Required Sacrifice:** Recent results suggest you cannot maintain that different observers agree on a single set of "facts" while treating observers themselves as quantum systems.
  *   **Impact:** Pressures **Observer Independence** (Desideratum 5). Suggests facts may be relative to observers (supporting QBism/Relational QM) or that one observer's description overrides another's (supporting Collapse).

  ---

  ## Part III: Interpretation Scorecard

  This scorecard evaluates major families against the Desiderata (Part I) and highlights the specific No-Go trade-offs (Part II) they accept.

  | Interpretation | Empirical Adequacy | Definite Outcomes | Ontological Clarity | Observer Independence | Signal Locality | Bell Locality | **Key Sacrifice / Cost** |
  | :--- | :---: | :---: | :---: | :---: | :---: | :---: | :--- |
  | **Copenhagen** | ✅ | ✅ (Postulated) | ❌ (Instrumental) | ✅ | ✅ | ❌ | **Ontological Clarity.** Refuses to say what exists between measurements. Relies on ill-defined "classical/quantum cut." |
  | **Many-Worlds (Everett)** | ✅ (Derived?) | ❌ (All occur) | ✅ (Wavefunction) | ✅ | ✅ | ❌ | **Definite Outcomes.** Sacrifices uniqueness of experience. Struggles to derive Born Rule without circularity. |
  | **de Broglie-Bohm** | ✅ | ✅ | ✅ (Particles + $\psi$) | ✅ | ✅ | ❌ | **Bell Locality.** Explicitly non-local (instantaneous guidance). Hard to reconcile with relativistic QFT. |
  | **GRW / Objective Collapse** | ✅ (Approx.) | ✅ | ✅ (Matter Density) | ✅ | ✅ | ❌ | **Dynamical Completeness.** Modifies Schrödinger eq. Parameters tuned to avoid detection so far. |
  | **QBism** | ✅ | ✅ (For Agent) | ❌ (Anti-Realist) | ❌ (Agent-Relative) | ✅ | ❌ | **Observer Independence.** Reality is participatory. Rejects "view from nowhere." Solves Bell by denying objective pre-existing values. |
  | **Superdeterminism** | ✅ | ✅ | ✅ | ✅ | ✅ | ✅ | **Measurement Independence.** Denies "free choice." Correlations between detector settings and particle source. High conspiracy cost. |
  | **Relational QM** | ✅ | ✅ (Relative) | ⚠️ (Relational) | ❌ (Relative Facts) | ✅ | ❌ | **Observer Independence.** Facts are only true relative to specific systems. Similar to QBism but more ontological. |

  ### Summary of Trade-offs

  1.  **If you want Realism (Ontology):** You must accept **Non-Locality** (Bohm) or **Contextuality** (Kochen-Specker) or **Collapse** (GRW). You cannot have Local Realism (Bell).
  2.  **If you want Locality:** You must accept **Anti-Realism** (Copenhagen/QBism) or **Superdeterminism**. You cannot have Local Realism.
  3.  **If you want Unitarity (No Collapse):** You must accept **Many-Worlds** (sacrificing unique outcomes) or **Bohm** (sacrificing locality/symmetry).
  4.  **If you want Observer Independence:** You are pressured by PBR to accept the **Wavefunction is Real**, and by Wigner's Friend to accept **Collapse** or **Many-Worlds**.

  ### Final Verdict for the Seminar
  There is no "cost-free" interpretation. The choice of interpretation is a choice of **which theoretical virtue to sacrifice** in light of the No-Go theorems.
  *   **Bohm** sacrifices Locality.
  *   **Everett** sacrifices Unique Outcomes.
  *   **Copenhagen/QBism** sacrifices Ontological Clarity/Observer Independence.
  *   **GRW** sacrifices Unitarity.
  *   **Superdeterminism** sacrifices Measurement Independence.

  An adequate interpretation must explicitly declare which bullet it is biting. Any claim to satisfy all desiderata simultaneously is mathematically untenable given Bell, Kochen-Specker, and PBR.
