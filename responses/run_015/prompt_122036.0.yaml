      *   *The Argument:* Fiscal-military capacity, colonial access, legal unity, currency, internal tariffs (or lack thereof).
      *   *Analysis:*
          *   *Regional approach:* Good for ecology and local wages.
          *   *Nation-state approach:* Essential for war, empire, and macro-policy. Lancashire didn't conquer India; Britain did. The Qing state managed the Yangtze's grain supply.
          *   *The "Ghost Acreage" point:* Pomeranz argues Britain used *external* land (colonies). This is a nation-state (or imperial) capability, not a regional one.
          *   *Verdict:* Yes, the notes likely overlook this. A modular approach risks missing the "meta-regional" mechanisms (taxation, navy, trade monopolies) that enabled specific regions to diverge.
      *   *Drafting the comment:* Emphasize that while production is local, the *conditions* for production (security, markets, resources) are often national/imperial. Ignoring this creates a blind spot regarding political economy.

  5.  **Synthesize and Refine:**
