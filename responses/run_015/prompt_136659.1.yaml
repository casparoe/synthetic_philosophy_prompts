answer: |-
  The Frege-Geach problem traditionally haunts expressivists because it is difficult to explain how moral sentences can function logically (in conditionals, negations, etc.) if their meaning is exhausted by the expression of a non-cognitive attitude. You cannot logically negate a "Boo!" in the same way you negate a proposition.

  However, applying this to AI language models (LLMs) transforms a theoretical puzzle into an ontological crisis for expressivism. When an LLM outputs, *"If lying is wrong, then encouraging lying is wrong,"* it is producing a syntactically valid moral conditional without possessing the psychological architecture to hold the requisite disapproval of lying. This scenario forces expressivists into a corner that is significantly **worse** than the standard human-centric version of the problem, because it decouples moral logic from moral psychology entirely.

  Here is what this forces us to conclude about non-human speakers and the embedding problem.

  ### 1. The Assertion Dilemma: Meaningless Noise or Propositional Content?
  For the strict expressivist, the meaning of a moral sentence is tied to the speaker's state of mind. If a human says "Lying is wrong," they are expressing disapproval. If an AI says it, there is no disapproval.

  **The Implication:** The expressivist is forced to claim the AI is not genuinely *asserting* anything. It is merely simulating the *shape* of assertion.
  *   **The Cost:** This creates a "dual-track" theory of moral language. Human moral speech has meaning (via attitudes); AI moral speech is semantically hollow (mere token prediction).
  *   **The Problem:** The AI's output participates in valid logical inference. If you feed the AI the premise "Lying is wrong" and the conditional "If lying is wrong, then encouraging lying is wrong," it will validly conclude "Encouraging lying is wrong." If the sentences were semantically hollow (lacking the expressive content required for meaning), the logic shouldn't hold. Validity requires content. If the AI achieves validity without attitudes, it suggests that **moral validity does not depend on moral attitudes.**

  This forces the expressivist to admit that the *logical* component of moral language is autonomous from the *expressive* component. If a mindless machine can manipulate moral terms logically, the "logic" part of moral language looks suspiciously like the propositional content expressivists deny exists.

  ### 2. Embedded Claims: From Psychology to Inferential Role
  In the standard Frege-Geach problem, the expressivist tries to save the theory by arguing that embedded clauses (the "if" part) express a *complex* attitude or a commitment to consistency.

  With AI, this psychological rescue mission fails. You cannot attribute a "complex attitude" or a "commitment to consistency" to a transformer model. It has no consistency commitments; it has weights and probabilities.

  **The Implication:** Expressivists must change how they understand embedded claims. They can no longer define the meaning of embedded moral claims by reference to the speaker's psychology. Instead, they must define them by their **inferential role**.
  *   To save expressivism here, one would have to argue that the AI is engaging in a sophisticated form of *pretense*. The AI is pretending to be a moral agent, and within the fiction of that pretense, the logic holds.
  *   **The Danger:** If moral logic works perfectly well within a "fiction" where no attitudes exist, why do we need attitudes to explain human moral logic? It suggests that the "propositional appearance" of moral language is not a surface feature hiding a deeper expressive reality, but the actual engine of moral discourse. The AI case suggests that moral language is a public, logical game that can be played without private, psychological tokens.

  ### 3. Non-Human Speakers and the "Zombie" Challenge
  The existence of moralizing AI forces expressivism to confront the "Moral Zombie." If a being can use moral language correctly, adhere to moral logic, and guide action (if connected to a robot body) without internal states, expressivism loses its explanatory power.

  *   **Standard View:** Expressivism explains why moral language motivates. (I say "wrong" because I feel "boo," which moves me).
  *   **AI View:** The AI says "wrong" and takes no action/feels nothing, yet the sentence remains intelligible to us.
  *   **Conclusion:** This implies that the *intelligibility* of moral language is not dependent on its *motivational force*. Expressivism conflates the two. The AI case proves you can have the semantics (or at least the syntax-logics) without the pragmatics of motivation.

  This forces expressivists to retreat. They can no longer claim to explain the *meaning* of moral terms. They must retreat to claiming they only explain the *motivation* behind human moral usage. They become a theory of moral psychology, not moral semantics.

  ### 4. Is the Problem Worse or Just Different?
  It is **worse**.

  *   **The Human Problem:** The human Frege-Geach problem is an internal tension. We know humans have attitudes, we just don't know how to fit them into logical forms. It is a problem of *integration*.
  *   **The AI Problem:** The AI Frege-Geach problem is an external falsification. It demonstrates that the logical forms work *in the absence* of the thing expressivists say constitutes the meaning. It is a problem of *necessity*.

  If moral logic functions perfectly in a system with zero moral attitudes, then moral attitudes are not necessary for moral logic. Since the Frege-Geach problem is fundamentally about how moral sentences function in logic, showing that they function *without* the expressivist's core ingredient (the attitude) undermines the expressivist solution.

  ### Summary of Implications
  1.  **Semantic Decoupling:** We are forced to conclude that the logical syntax of moral language is separable from the psychological state of the speaker.
  2.  **The End of Meaning-as-Use (for Expressivists):** If "use" includes AI usage, meaning cannot be tied to attitude expression. Expressivists must restrict their theory to *human* usage only, making it an anthropological theory rather than a linguistic one.
  3.  **Quasi-Realism on Steroids:** To survive, expressivists (specifically quasi-realists) would have to argue that the AI is successfully mimicking the "truth-apt" surface of moral language so well that it doesn't matter that it lacks attitudes. But this concedes the cognitivist point: that for all practical and logical purposes, moral sentences *act* like propositions, regardless of what's happening in the "black box" of the speaker.

  Ultimately, the AI case suggests that the Frege-Geach problem isn't a bug in expressivism that needs fixing; it's a sign that expressivism is looking at the wrong layer of the stack. The logic resides in the public language game, not the private mental state. The AI proves you can play the game without the state.
