answer: |-
  **Project Title:** The Occult Burden: Pain Asymbolia and the Subject-Relativity of Welfare

  **Project Overview**
  Contemporary philosophy of mind has extensively utilized pain asymbolia—the condition wherein subjects report feeling pain but lack the typical negative emotional response—to debate the metaphysical structure of pain. The dominant question remains whether asymbolia demonstrates that pain's unpleasantness is a detachable component from its sensory-discriminative aspect. This project proposes a pivot. Rather than using asymbolia to analyze the nature of pain, I will use it as a probe to analyze the nature of *welfare*. Specifically, I will investigate whether a phenomenally painful state can be prudentially bad for a subject who lacks any negative conative or affective response to it.

  I define an "occult" view of welfare as one that answers yes: a state can be bad for a subject even if the subject does not mind it, dislike it, or desire to avoid it. My central hypothesis is that occult views are in tension with the functional role of welfare concepts, yet standard arguments against them (from desire-satisfaction or attitudinal theories) are question-begging, as they build non-minding into the definition of badness from the start. This fellowship will support a rigorous examination of this impasse, moving beyond definitional stipulations to diagnostic case analysis.

  **The Philosophical Problem**
  The question driving this research is determinate: *Is the prudential badness of pain constitutively linked to the subject's negative attitude toward it, or can badness obtain independently of subjective uptake?*

  This question remains unsettled because existing frameworks talk past one another.
  1.  **Desire and Attitude Theories:** These views rule out occult badness by definition. For them, if the subject does not desire the state to cease, it is not bad. This solves the problem by linguistic fiat rather than argument.
  2.  **Evaluativism and Imperativism:** These theories focus on the representational or command-like content of pain. While they explain *why* pain is unpleasant, they do not settle whether that unpleasantness constitutes a welfare loss if the subject ignores the command or rejects the evaluation.
  3.  **Dimensional vs. Unitary Debates:** The literature is currently stalled on whether asymbolics are feeling "real pain." This metaphysical gatekeeping obscures the ethical question. Even if we grant the asymbolic is in pain, the welfare implication remains contested.

  If occult views are viable, welfare becomes a property that can exist without being felt as a burden. If they are false, welfare is essentially subjective. This distinction has profound implications for paternalism, medical ethics, and the measurement of well-being.

  **Methodology: Diagnostic Case Construction**
  To move beyond "read and think" conceptual analysis, I will employ a method of **Comparative Diagnostic Cases**. This involves constructing paired scenarios designed to isolate the variable of "subjective uptake" from "phenomenal quality."

  *   **Case A (The Restoration Choice):** I will refine the literature's existing asymbolia cases into a choice scenario. The subject is offered a pill that restores the "sting" (the affective component) of pain without changing the sensory input. If the subject refuses the pill, does this indicate the pain was not bad for them? Occult theorists might argue the subject is mistaken about their own good. I will analyze whether attributing such error renders the concept of welfare useless for guiding action.
  *   **Case B (The Inverse Control):** To control for the possibility that asymbolics simply lack the capacity for distress generally, I will construct an inverse case: a subject who experiences intense distress and motivation to avoid a stimulus but lacks the sensory quality of pain (a "painless suffering").
  *   **Comparative Analysis:** By holding the "badness" intuition constant across cases while varying the sensory and affective components, I can test which theories remain stable. If a theory judges Case A as "not bad" but Case B as "bad," it must justify why sensory pain without distress is less welfare-relevant than distress without sensory pain. This forces theories to reveal their underlying commitments regarding the source of disvalue.

  **Expected Outcomes**
  The project aims for one of two results:
  1.  **A Defended Constraint:** A positive argument that welfare must be "resonant"—i.e., a state cannot be bad for a subject unless it resonates with their conative or affective system. This would rule out occult views without begging the question.
  2.  **A Dissolution:** A demonstration that the disagreement between occult and non-occult views is verbal or conceptual, arising from conflicting uses of "bad for." In this scenario, the output will be a recommendation for which conceptual framework best serves ethical theory.

  **Risk Assessment**
  There are two primary risks to this project. First, the debate may collapse into the general question of whether welfare must be accessible to the subject. If the argument merely recapitulates the objective vs. subjective list debate, the specific contribution regarding pain will be lost. I will mitigate this by keeping the focus tightly on the *phenomenology of pain* rather than general welfare goods. Second, the disagreement may prove verbal. If "bad for" is shown to be ambiguous, the project risks ending in a deflationary conclusion. However, this is a substantive philosophical result worth documenting, as it would advise against using asymbolia as a wedge in welfare debates.

  **Feasibility and Scope**
  While the core argument could function as a single dissertation chapter, the scope required to defend it against the breadth of opposing literature (value theory, philosophy of mind, bioethics) justifies a year of focused research. The fellowship will support three phases:
  1.  **Months 1-4:** Comprehensive mapping of occult commitments in current literature and refinement of the Diagnostic Cases.
  2.  **Months 5-8:** Drafting the core argument and stress-testing it against counter-arguments from objective list theorists and hedonists.
  3.  **Months 9-12:** Expanding the implications for medical ethics (e.g., treating asymbolic patients) and finalizing the dissertation chapter structure.

  This timeline ensures the project results not merely in a paper, but in the foundational pillar of the dissertation, securing the theoretical ground for subsequent chapters on well-being and agency. By rigorously testing the limits of welfare concepts through the specific lens of pain asymbolia, this project will resolve a persistent ambiguity in value theory.
