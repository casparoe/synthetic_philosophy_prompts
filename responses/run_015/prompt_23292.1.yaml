              *   Let $X$ be the value in the chosen envelope. $X=100$.
              *   Hypothesis $H_1$: Chosen envelope is smaller ($S=100$). Likelihood of seeing 100 given $H_1$ is $0.5$ (since we pick envelopes randomly). Prior is $\pi(100)$.
