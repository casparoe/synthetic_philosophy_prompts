              *   Posterior $P(H_1 \mid X=100) \propto 0.5 \cdot \pi(100)$.
              *   Posterior $P(H_2 \mid X=100) \propto 0.5 \cdot \pi(50)$.
              *   Normalizing: $P(H_1 \mid X=100) = \pi(100) / (\pi(100) + \pi(50))$.
              *   *Wait, check the likelihoods.* If $S=100$, envelopes are $\{100, 200\}$. Prob of picking 100 is $1/2$. If $S=50$, envelopes are $\{50, 100\}$. Prob of picking 100 is $1/2$. The $1/2$ factors cancel out in the ratio. So the formula is correct.
