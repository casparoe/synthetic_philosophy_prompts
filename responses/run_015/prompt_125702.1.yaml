answer: |-
  Carroll's paradox demonstrates the limits of explicit formalization rather than proving logical justification is necessarily incomplete or reducing deduction to mere habit. The infinite regress arises only when one conflates premises, which are propositions within a system, with rules of inference, which are operations performed by the system, a category error that formal verification avoids by separating the object language from the meta-language inference engine. Human deductive competence relies on implicit normative capacities—knowing how to infer rather than knowing that a rule exists—which ground justification in practical mastery rather than propositional stacks, thereby halting the regress without resorting to blind habit. Treating deduction as merely procedural habit ignores the normative constraint that distinguishes valid inference from associative thinking, while formal verification systems avoid the regress not by lacking transparency but by embedding inference rules in the system architecture rather than the data stack. Consequently, justification is complete relative to the agent's normative competence, even if it cannot be fully exhaustively articulated as a finite list of premises.

  I would change this verdict if empirical evidence demonstrated that the distinction between explicit and implicit rule-following is illusory because all competence reduces to tacit propositional knowledge, or if formal verification stacks were proven to require internal licensing for their inference engines rather than architectural embedding. Specifically, if it were shown that self-applying rules are impossible without higher-order licensors even at the architectural level, or if human reasoning were found to operate purely through associative mechanisms without normative constraint, the claim that justification is complete relative to competence would collapse.

  This reasoning is most vulnerable to the intellectualist objection that implicit competence inevitably decomposes into explicit representations, which would resurrect the regress by collapsing the distinction between knowing-how and knowing-that. It also relies on a conception of normative practice that may be contested by radical skepticism regarding rule-following, which could argue that implicit habits are themselves unjustified regularities rather than grounded capacities.
