  ### Brainstorming the Logical Space

  Before drawing the tree, we need to map how these disagreements lock together. You are right that the committee is conflating distinct questions. The most critical dependency is the **Meta-Question**: if someone believes "genocide" is purely a political tool (Instrumentalist), their answers to the factual questions (like "did people die?") matter less than their strategic goal (e.g., "does using this word help us get compensation?"). However, if they believe it is a **Moral Truth** (Realist), they must answer the factual questions consistently, even if it hurts their case. This split must be the root of the tree.

  For the "Moral Truth" branch, the distinctions cascade logically. You cannot care about whether the destruction was a "means to an end" (Intent) if you don't first agree that "cultural destruction" counts (Destruction). Similarly, the question of "who defines the group" (Ascription) often depends on whether you require a formal "plan" (Agency); if you require a state plan, you usually look at state records (Perpetrator view), whereas if you look at structural violence, you look at the victims' experience. To keep the tree manageable, I have bundled the distinctions regarding **Agency** (plan vs. structure), **Scale** (substantial vs. tiny part), and **Ascription** (perpetrator vs. victim definition) into a single "Strict vs. Broad Criteria" branch. This is necessary to keep the leaf count to 10 while covering all your required distinctions.

  There are logical constraints here. For example, it is rare to find someone who thinks genocide is a "Political Tool" but argues for "Strict Criteria" (Plan + Substantial + Victim Definition). Usually, Instrumentalists want either very broad use (to mobilize) or very narrow use (to protect the word's value), but they don't care about the factual nuance of "plan vs. structure." I have marked these combinations as "Unoccupied" in the analysis below. Also, note that Case 2 (Colonial Census) turns on the **Ascription** distinction bundled in the Criteria branch, while Case 6 (Environmental) turns on the **Agency** and **Destruction** branches.

  ***

  ### The Taxonomy Tree

  **Q1. META:** Is the word primarily about capturing a fixed moral truth we must get right, or is it a political tool whose use depends on the outcome?
  *   **Moral Truth** → Go to Q2.
  *   **Political Tool** → Go to Q2 (Tool).

  **Q2 (Moral Truth). DESTRUCTION:** Does the destruction have to involve physical killing/biological prevention, or does ending the social/cultural life count?
  *   **Physical/Biological Only** → Go to Q3 (Phys).
  *   **Cultural/Social Counts** → Go to Q3 (Cult).

  **Q2 (Political Tool). STRATEGY:** Should we restrict the word to protect its power, or use it broadly to mobilize support?
  *   **Protect Power (Strict Use)** → **Leaf 1**
  *   **Mobilize Support (Broad Use)** → **Leaf 2**

  **Q3 (Phys). INTENT:** Must the destruction be the perpetrator's ultimate goal, or is it enough if it's a known side-effect or means to another end (like land)?
  *   **Ultimate Goal** → Go to Q4 (Phys/Goal).
  *   **Means/Side-Effect** → Go to Q4 (Phys/Means).

  **Q3 (Cult). INTENT:** Must the cultural destruction be the perpetrator's ultimate goal, or is it enough if it's a known side-effect?
  *   **Ultimate Goal** → Go to Q4 (Cult/Goal).
  *   **Means/Side-Effect** → Go to Q4 (Cult/Means).

  **Q4 (All Truth Paths). CRITERIA:** Does it require a coordinated state plan against a substantial group defined by victims? (Yes = Strict | No = Broad/Structure/Local/Perp-View)
  *   **Yes (Strict)** → **Leaf**
  *   **No (Broad)** → **Leaf**

  *(This structure yields 2 Tool leaves + 8 Truth leaves = 10 Leaves total)*

  #### The Leaves

  1.  **Strategic Protectionist** (Tool / Protect)
      *   *Awkward Commitment:* You might have to admit your gran's case fits the moral definition but argue we shouldn't use the word anyway because it dilutes the brand.
  2.  **Strategic Activist** (Tool / Mobilize)
      *   *Awkward Commitment:* You might have to call something genocide even if almost nobody died, risking credibility if the public checks the facts.
  3.  **Legalist Purist** (Truth / Physical / Goal / Strict)
      *   *Awkward Commitment:* You must deny genocide occurred in Case 4 (Land Grab) and Case 6 (Environment), even if the group is gone.
  4.  **Intentionalist Broad** (Truth / Physical / Goal / Broad)
      *   *Awkward Commitment:* You accept structural violence (Case 6) counts, but only if the specific intent to destroy was the ultimate goal.
  5.  **Consequentialist Physicalist** (Truth / Physical / Means / Strict)
      *   *Awkward Commitment:* You accept killing for land (Case 4) counts, but only if a state planned it against a substantial part of the group.
  6.  **Humanist Physicalist** (Truth / Physical / Means / Broad)
      *   *Awkward Commitment:* You must call Case 2 (Colonial Census) genocide even if the victims didn't identify as that group anymore.
  7.  **Culturalist Traditionalist** (Truth / Cultural / Goal / Strict)
      *   *Awkward Commitment:* You accept cultural destruction counts, but only if a state formally planned it against a large group (excludes Case 1 Resettlement).
  8.  **Culturalist Localist** (Truth / Cultural / Goal / Broad)
      *   *Awkward Commitment:* You accept Case 1 (Resettlement) counts, but only if the dispersal was the ultimate goal, not just a side-effect of development.
  9.  **Assimilationist Realist** (Truth / Cultural / Means / Strict)
      *   *Awkward Commitment:* You accept Case 5 (Child Removal) counts even if done "for their own good," but only if it was a coordinated state policy.
  10. **Structural Culturalist** (Truth / Cultural / Means / Broad)
      *   *Awkward Commitment:* You must call almost any successful assimilation genocide, even if it happened slowly without a central plan.

  ***

  ### Analysis of the Logical Space

  **Unoccupied Combinations**
  There are theoretically 16 possible paths for the "Moral Truth" branch (2 Destruction × 2 Intent × 2 Criteria), but I have only named 8. The "empty" spaces are usually **incoherent**. For example, a "Physical / Means / Strict" position that *also* demands "Victim Definition" is rare because strict legalists usually rely on perpetrator documents (Case 2) to prove the plan. Similarly, a "Cultural / Goal / Strict" position is unstable: if you require cultural destruction to be the *goal*, it is hard to prove a *state plan* existed without explicit documents, which are rare for cultural crimes. These positions are unoccupied because they demand high evidentiary standards for crimes that are inherently hidden.

  **Indistinguishable Leaves**
  **Leaf 4 (Intentionalist Broad)** and **Leaf 6 (Humanist Physicalist)** are difficult to separate in practice. Both accept physical destruction via means/structure, but Leaf 4 requires "Ultimate Goal" while Leaf 6 accepts "Means." In cases like environmental poisoning (Case 6), proving whether the destruction was the *goal* or just a *known side-effect* of profit is often impossible. Consequently, these two members will vote the same way on every real-world case, even if they argue about the theory.

  **Walkthrough: Auntie vs. The Dissenter**

  Let's walk your two members down the tree to find the bottleneck.

  **Your Auntie (Insists on the word):**
  *   **Q1 Meta:** She likely sees it as a **Moral Truth** (it happened, it needs to be named).
  *   **Q2 Destruction:** She likely says **Cultural/Social Counts** (because nobody wants to admit her family wasn't "killed" in the traditional sense, but the community died).
  *   **Q3 Intent:** She likely says **Means/Side-Effect** (because the killers might have claimed they were just "clearing land," but she knows the result was destruction).
  *   **Q4 Criteria:** She likely says **No (Broad)** (because there may not have been a formal state plan, and the group was small/local).
  *   **Landing:** **Leaf 10 (Structural Culturalist).**

  **The Dissenting Member (Word is a distraction):**
  *   **Q1 Meta:** He likely sees it as a **Political Tool** (he keeps saying it "helps nobody" and is a "football").
  *   **Q2 Strategy:** He says **Protect Power** (he worries about "inflating" the term).
  *   **Landing:** **Leaf 1 (Strategic Protectionist).**

  **The Divergence:**
  They split at the **Root (Q1 Meta)**. This is critical for your meeting. You cannot resolve this by arguing about Case 1 or Case 6. Your Auntie is arguing about *what happened* (Truth); the Dissenter is arguing about *what the word does* (Tool).
  *   **Meeting Strategy:** Do not try to prove the facts to the Dissenter. Instead, ask him: "If we could prove this meets the strict legal definition, would you still oppose the word?" If he says yes, he is a **Strategic Protectionist**. You then need to pivot the discussion from "Is this genocide?" to "What is the political cost/benefit of using this word?" That is the only question he is actually answering.

  **Alternative Scenario:**
  If the Dissenter answers **Moral Truth** → **Physical Only** → **Goal** → **Strict**, he lands on **Leaf 3 (Legalist Purist)**.
  *   **Divergence:** **Q2 (Destruction)**.
  *   **Meeting Strategy:** Here, you can argue facts. You need to show him that international law and modern philosophy accept cultural destruction (Case 1/5). This is a definitional argument, not a political one, and it is resolvable with evidence.

  **Recommendation:** Test the Dissenter on Q1 first. It saves you hours of arguing about case details if his objection is purely strategic.
