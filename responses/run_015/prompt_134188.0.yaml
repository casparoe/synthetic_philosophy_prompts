prompt: |-
  So I've somehow ended up owning the risk register at the small housing association I work for — I'm not a risk person, I do comms — and the board wants, every quarter, a single likelihood × impact score for each risk so they can rank them and decide what to spend money on. I've been reading a bit about imprecise probabilities (upper and lower probabilities, intervals instead of point estimates, that old risk-versus-uncertainty distinction) and its obvious to me that half our entries just aren't single numbers, but I can't turn that into something I can actually run in the half-day I get per quarter, for a lay board who will only ever ask "so is it a 3 or a 4?".

  What I want is a procedure I can reuse. Concretely: how do I decide whether a risk gets a point estimate or a range; how wide is too wide to be useful any more; when is collapsing a range to one number legitimate and when is it just fake precision; how do I rank two ranges that overlap — and I assume that sometimes the honest answer is "these dont rank, and here's what the board should do instead"; and how do I say anything about the register as a whole when most of our risks share the same underlying cause, so adding them up feels like double counting. One more thing I keep hitting: sometimes new evidence makes my range wider rather than narrower, and I want the procedure to have something to say about that rather than treating it as me messing up.

  It has to be honest about which steps are judgment calls dressed up as method, and it has to be defensible by a non-specialist both to the finance director who signs it off and to an external auditor a year later.

  Please run it on three entries and show the working: (a) our main repairs contractor going insolvent in the next 12 months, where we do have some sector base rates; (b) a fine under a new building-safety regime that hasn't actually started enforcing yet, so there's no base rate at all; (c) reputational damage from a social media storm, where our own response changes the probability. And include at least one case where the procedure gives an answer the board is going to hate. British English please, plain language, and as little notation as you can get away with.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the User and the Problem:**
      *   **User:** Communications professional at a small housing association, unexpectedly owning the risk register. Not a risk specialist.
      *   **Constraint:** Half-day per quarter to do this. Board wants a single Likelihood $\times$ Impact score for ranking/budgeting.
      *   **Insight:** User understands imprecise probabilities (intervals, Knightian uncertainty) and knows single point estimates are often fake precision.
      *   **Goal:** A reusable, defensible, honest procedure that handles point estimates vs. ranges, ranking overlapping ranges, correlated risks, and widening uncertainty. Must be understandable by a lay board and defensible to an auditor.
      *   **Requirements:** British English, plain language, minimal notation. Run on three specific examples (Contractor insolvency, Building safety fine, Social media storm). Include at least one "board-hating" answer.

  2.  **Deconstruct the Challenge:**
      *   *The Tension:* Board wants simplicity (1-5 score); Reality is complex (uncertainty, correlations).
      *   *The Solution:* A "Traffic Light" hybrid approach. Keep the board's scoring system but add a "Confidence/Uncertainty" flag that modifies how they interpret the score.
      *   *Key Concepts to Integrate:*
          *   Point estimate vs. Range (When to use which?).
          *   Collapsing ranges (When is it okay?).
          *   Ranking overlaps (When to say "equal" or "unknown").
          *   Correlations (Don't sum them).
          *   Widening uncertainty (It's a feature, not a bug).
          *   Audit trail (Defensibility).

  3.  **Develop the Procedure (The "Half-Day Risk Protocol"):**
      *   *Step 1: Evidence Check.* Do we have data? (Frequency) Or is it guesswork? (Uncertainty).
      *   *Step 2: The Score.* Calculate the "Best Estimate" (for the board's grid) but record the "Range" (for the file).
      *   *Step 3: The Confidence Flag.* This is crucial. Green (Solid), Amber (Judgment), Red (Guess/Unknown).
      *   *Step 4: Ranking Logic.* If ranges overlap significantly + Low Confidence = "Unrankable".
      *   *Step 5: Correlation Check.* Group risks by cause.
      *   *Step 6: Reporting.* Explain *why* the number might be wobbly.

  4.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the predicament. Validate their instinct (point estimates are often lies). Set the tone (pragmatic honesty).
      *   **The Procedure (The "Three-Step Filter"):**
          1.  *Data vs. Guess:* Distinguish Risk (known probs) from Uncertainty (unknown probs).
          2.  *The Number & The Margin:* Give the board their number, but attach a "Confidence Rating".
          3.  *The Ranking Rule:* When to refuse to rank.
      *   **Addressing Specific User Concerns:**
          *   *Widening ranges:* Frame as "Increased Awareness" not "Error".
          *   *Correlations:* "Risk Families" instead of summing.
          *   *Audit Trail:* Keep the "Working Sheet" separate from the "Board Paper".

      *   **The Three Examples (The Core Test):**
          *   *(a) Contractor Insolvency:* Has data. Narrow range. High confidence. Board likes this.
          *   *(b) Building Safety Fine:* No data. Regulatory uncertainty. Wide range. Low confidence. Board hates this (the "hate" requirement).
          *   *(c) Social Media:* Endogenous risk (we change the prob). Medium confidence.
      *   **Refining the "Board-Hating" Answer:** For the Building Safety fine, the procedure must conclude "We cannot rank this against operational risks." This challenges the board's desire for a simple list.

      *   **Tone Check:** British English (organisation, programme, colour, defence). Plain language (no Greek letters, no Bayes theorem formulas). Professional but empathetic.

  5.  **Iterative Refinement (Self-Correction during drafting):**
      *   *Critique:* Is this too much work for half a day?
      *   *Fix:* Emphasise that most risks are "Green" and only need a quick look. The heavy lifting is only on the "Amber/Red" ones.
      *   *Critique:* Will the auditor accept ranges?
      *   *Fix:* Auditors love documentation. If you document *why* you chose a number, they are happy. The "Confidence Rating" acts as the disclosure.
      *   *Critique:* How to handle the Likelihood x Impact math with ranges?
      *   *Fix:* Don't do range math. Pick the "Prudent Best Estimate" for the grid, use the range for the discussion. Keep it simple.
      *   *Critique:* The user asked about "when is collapsing legitimate".
      *   *Fix:* Add a specific rule: "Collapse only if the range width is less than one scoring band."

  6.  **Final Polish:**
      *   Ensure the distinction between "Risk" (measurable) and "Uncertainty" (unmeasurable) is clear but jargon-free.
      *   Make sure the "Widening Uncertainty" point is addressed explicitly.
      *   Check the "Correlation" advice (Risk Families).
      *   Verify British spelling and idiom.

  7.  **Final Output Structure:**
      *   Opening: Validation.
      *   The Protocol (4 steps).
      *   The Three Worked Examples.
      *   Handling the "Board Hate" moment.
      *   Audit/Defence advice.
      *   Closing encouragement.

  *(Self-Correction on the "Board Hate" requirement)*: I need to make sure one of the examples explicitly results in a recommendation that frustrates the board's desire for a simple ranked list. Example (b) is the best candidate. I will explicitly state that ranking it against (a) is misleading.

  *(Self-Correction on Notation)*: Keep it to "Low/Med/High" or "1-5". No $P(A|B)$.

  *(Self-Correction on Time)*: Emphasise that this process is fast for 80% of risks.

