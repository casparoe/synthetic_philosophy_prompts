answer: |-
  You are in a very common position, and your instinct is correct: forcing a single number onto deep uncertainty is not just inaccurate, it is misleading. However, you also have a practical constraint: a board that wants a heat map and a half-day to do the work.

  You cannot solve the philosophical problem of uncertainty in four hours. But you can manage the *reporting* of it. The solution is to give the board the single number they demand, but attach a "Confidence Rating" that tells them how much trust to put in that number. This satisfies the auditor (you have documented your reasoning) and protects you (you have flagged the guesswork).

  Here is a procedure designed for a half-day quarterly review, written for a non-specialist to defend.

  ### The "Confidence-Weighted" Risk Protocol

  Do not try to calculate ranges for every risk. That takes too long. Use this three-step filter.

  **Step 1: The Evidence Test (Risk vs. Uncertainty)**
  For each risk, ask: *Do we have past data to predict the future?*
  *   **Yes (Risk):** We have frequency data (e.g., number of repairs per year, staff turnover rates).
  *   **No (Uncertainty):** This is new, unique, or depends on human behaviour/regulation (e.g., new laws, reputational crises).
  *   **Action:** If "Yes", you may use a point estimate. If "No", you must record a range in your working notes, even if you pick one number for the board.

  **Step 2: The Collapse Rule (When is a range a number?)**
  If you have a range (e.g., impact could be £50k or £500k), you are only allowed to collapse it to a single score for the board if the range fits within *one* band of your scoring matrix.
  *   *Example:* If your "High Impact" band is £100k–£500k, and your range is £200k–£400k, you can report "High".
  *   *Example:* If your range spans "Medium" and "High", you cannot collapse it honestly. You must report the higher number (prudence) but flag it as **Low Confidence**.

  **Step 3: The Ranking Rule (When to refuse to rank)**
  If two risks have overlapping ranges and both are **Low Confidence**, do not rank them 1 and 2. Report them as "Tier 1 (Unordered)".
  *   *Board Script:* "We cannot mathematically distinguish which is worse. Both require contingency planning."
  *   *Why:* This prevents the board from cutting funding to Risk #2 because it looks slightly smaller than Risk #1.

  **Handling Correlations (The "Risk Family" Rule)**
  Do not add up scores. If three risks are caused by the same thing (e.g., "IT Failure" causes "Data Loss", "Repair Delays", and "Call Centre Down"), group them. Report the *parent* risk score. This stops you double-counting the probability.

  **Handling Widening Uncertainty**
  If new evidence makes your range wider (e.g., you thought the fine was £10k–£50k, now it looks like £10k–£500k), this is not an error. It is **Increased Volatility**.
  *   *Action:* Keep the "Best Estimate" number the same if the middle hasn't moved, but downgrade the Confidence Rating from Amber to Red.
  *   *Narrative:* "We understand the exposure better, and it is more volatile than previously thought."

  ---

  ### Worked Examples

  Here is how you apply this to your three specific entries. I have assumed a standard 1–5 scoring matrix (1=Low, 5=Critical).

  #### (a) Main repairs contractor insolvency (Next 12 months)
  *   **Evidence:** You have sector base rates. Construction insolvencies are tracked by industry bodies. You know how much of your budget is with them.
  *   **Analysis:** This is **Risk**, not Uncertainty. We have frequencies.
  *   **Range:** Based on sector data, likelihood is 5–15%. Impact is £200k–£300k (cost of finding new contractor + delays).
  *   **Collapse:** Your impact band for "4 (High)" is £150k–£500k. The range fits entirely inside this band.
  *   **Decision:**
      *   **Board Score:** Likelihood 2, Impact 4. (Risk Score 8).
      *   **Confidence:** **Green (High)**.
      *   **Audit Note:** "Scored using industry insolvency rates Q3 2024. Impact based on procurement cost estimates."
  *   **Board Reaction:** They will like this. It looks solid.

  #### (b) Fine under new building-safety regime (Not yet enforcing)
  *   **Evidence:** None. The regulator has not issued a single fine yet. The law is written, but enforcement discretion is unknown.
  *   **Analysis:** This is pure **Uncertainty**.
  *   **Range:** Likelihood is 0% (if they go soft) to 40% (if they crack down). Impact is £50k (slap on wrists) to £2m (criminal charges + remediation).
  *   **Collapse:** The impact range spans three scoring bands. You cannot collapse this honestly.
  *   **Decision:**
      *   **Board Score:** You must report the "Prudent Worst Case" for financial provisioning. Likelihood 3, Impact 5. (Risk Score 15).
      *   **Confidence:** **Red (Low)**.
      *   **Ranking:** You cannot rank this against the Contractor risk (a). Even though 15 > 8, the Red confidence means the number is fuzzy.
      *   **Audit Note:** "No enforcement history exists. Score reflects maximum credible exposure. Confidence low due to regulatory ambiguity."
  *   **Board Reaction:** **They will hate this.** They want to know if they should spend £50k or £500k on compliance.
  *   **Your Answer:** "We cannot tell you yet. Because the confidence is Red, we should not spend money on *fixing* the risk yet. We should spend money on *intelligence*. I recommend a £5k budget to hire a consultant to clarify the regulator's stance. Until then, this risk is unrankable."

  #### (c) Reputational damage from social media storm
  *   **Evidence:** Partial. You have past engagement metrics, but the probability depends on *your* response. This is "Endogenous Risk" (the risk changes because you are measuring it).
  *   **Analysis:** Hybrid.
  *   **Range:** If we respond well, likelihood drops to near zero. If we respond poorly, likelihood spikes. Impact is hard to quantify in housing (voids? complaints?).
  *   **Collapse:** We control the likelihood. Therefore, the score is a measure of *our performance*, not external chance.
  *   **Decision:**
      *   **Board Score:** Likelihood 3, Impact 4. (Risk Score 12).
      *   **Confidence:** **Amber (Medium)**.
      *   **Condition:** "Score valid only if Comms Protocol X is followed."
      *   **Audit Note:** "Probability contingent on adherence to response SLA. If SLA breached, likelihood becomes 5."
  *   **Board Reaction:** They will accept this, provided you make it clear that the risk score goes up if they cut your comms budget.

  ---

  ### Defending This to the Finance Director and Auditor

  You need two documents. Do not mix them.

  **1. The Board Paper (The "Clean" Version)**
  *   Contains the Risk Register.
  *   Contains the Single Score (1–5).
  *   Contains the **Confidence Flag** (Green/Amber/Red).
  *   *Why:* The FD needs the number for the spreadsheet. The Confidence Flag tells them how much cash to set aside. Green risks get standard provision. Red risks get a "Contingency Reserve".

  **2. The Working Paper (The "Dirty" Version)**
  *   This is your private file (or internal audit file).
  *   Contains the Ranges (e.g., "£50k–£2m").
  *   Contains the Evidence Test (Why did we choose Green vs Red?).
  *   Contains the Correlation Logic (Why we didn't add Risk A + Risk B).
  *   *Why:* When the external auditor asks, "How did you derive this probability?", you show them this. It proves you didn't just pick a number out of the air. It shows "Due Care".

  ### Addressing Your Specific Worries

  **"When is collapsing a range legitimate?"**
  Only when the range sits entirely inside one scoring band. If your range crosses the line between a "3" and a "4", you must report the "4" (prudence) but mark it Red. Never average them.

  **"How do I rank two overlapping ranges?"**
  If Risk A is [3–5] and Risk B is [4–6], and both are Red confidence: **Do not rank them.** Tell the board: "These are statistically indistinguishable. Treat them as a pair." If they force you to pick one, pick the one with the higher *maximum* impact, but write a footnote saying "Ranking indicative only".

  **"Sometimes new evidence makes my range wider."**
  This is the most important part for your professional integrity. In your quarterly report, have a column called "Change in Confidence".
  *   If the range widens, mark "Confidence Downgraded".
  *   *Narrative:* "Previous estimate was overly optimistic. New information suggests wider variability. We are not increasing the risk score, but we are flagging that our prediction is less reliable."
  *   Auditors love this. It shows you are monitoring the *quality* of your data, not just the data itself.

  **"Most risks share the same underlying cause."**
  Use the "Risk Family" approach. In your register, have a column for "Root Cause".
  *   If five risks all say "Root Cause: Aged IT Infrastructure", group them.
  *   Report the highest impact of the group as the "Strategic Risk".
  *   Tell the board: "Fixing the IT fixes all five. Do not budget for them separately."

  ### Summary for your Half-Day

  1.  **Hour 1:** Review the "Red" risks from last quarter. Has the evidence changed? Update the Confidence Flags.
  2.  **Hour 2:** Assess new risks using the Evidence Test. Assign Green/Amber/Red.
  3.  **Hour 3:** Check for Correlations (Root Causes). Group them.
  4.  **Hour 4:** Write the Board Paper. Ensure every "Red" confidence risk has a recommendation for *information gathering* rather than just *spending*.

  This approach gives the board the simplicity they demand, but gives you the cover to say "I don't know" without looking incompetent. It turns uncertainty from a mistake into a managed variable.
