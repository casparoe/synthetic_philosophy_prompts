answer: |-
  ### Private Brainstorming

  *   **The Core Tension:** The novelist is asking a metaphysical/causal question ("Does she possess the capacity?"), and the psychologist is answering with a methodological definition ("We only know capacity via instrument"). This is the classic *operationalism* vs. *realism* debate.
  *   **The Thermometer Analogy:** The novelist is right to be suspicious. Temperature exists independently of thermometers (molecular kinetic energy). We calibrate thermometers *against* the phenomenon. If the psychologist says "Intelligence = Test Score," they are saying the phenomenon *is* the measurement, not that the measurement tracks the phenomenon. This is a category error unless one is a radical behaviorist.
  *   **Parsing "Whatever the tests measure":**
      1.  *Stipulative:* "For the purposes of this study, let's define it this way." (Harmless, but doesn't apply to the novel).
      2.  *Constitutive:* "There is no underlying thing; the score is the reality." (Radical, dismisses the character's skills).
      3.  *Epistemic:* "We can never know the thing except through tests." (Skeptical, but allows the thing might exist).
      4.  *Social:* "Intelligence is a social status granted by testing institutions." (Sociological, makes the character an outsider).
  *   **The Friend's Dismissal:** "She will never sit a test, so there is nothing further to be said." This implies the property is *counterfactually dependent* on the test. If no test, no property. This is strong operationalism. It shuts down inquiry. But is it scientifically honest? Modern psychometrics talks about "construct validity"—the idea that the test *should* match a theoretical concept. If the concept is "ability to solve problems," and she solves problems (just not test problems), the test has low validity for her, not the other way around.
  *   **The Novelist's Need:** She needs to know if she can describe the character's internal cognitive state as "intelligent" without lying. If intelligence is purely institutional, she can't. If it's adaptive/cognitive, she can.
  *   **Measurement Theory Angle:** Reliability vs. Validity. The test might be reliable (consistent scores) but not valid (doesn't measure what we think it measures in this context). The friend is conflating reliability with ontology.
  *   **Structure:** I need to lay out these interpretations clearly. 1. Strict Operationalism. 2. Realist/Instrumentalist. 3. Ecological/Contextual. 4. Social Construct. 5. Eliminativism. Then evaluate the friend. Then advise the writer.

  ***

  ### Structured Final Answer

  You have identified a genuine fault line in the philosophy of psychology. Your intuition that the thermometer analogy fails is correct, and your friend's dismissal, while common in casual conversation, rests on a philosophical stance that is far more controversial than he admits. The sentence "intelligence is whatever the tests measure" is not a single claim; it is a chameleon phrase that changes color depending on the underlying theory of measurement being employed.

  To help you navigate this for your writing, I have parsed the sentence into five distinct philosophical readings. For each, I assess its truth status, the evidence surrounding it, and crucially, whether it licenses your friend's dismissal of your question.

  #### 1. The Methodological Operationalist Reading
  **The Claim:** This is a stipulation for scientific hygiene. To avoid metaphysical vagueness, we agree to treat the term "intelligence" as synonymous with "score on standardized instrument X." It is a rule for speaking, not a claim about the world.
  *   **Truth Status:** **Trivially True.** It is true by definition, because it defines the term into existence for a specific context.
  *   **Evidence For/Against:** *For:* It prevents endless arguments about definitions during data analysis. *Against:* It makes generalization impossible. If "intelligence" is Test A, and I use Test B, I am studying a different thing. It renders the concept useless outside the laboratory.
  *   **Does it support the friend's dismissal?** **Yes, technically.** If intelligence is *defined* as the act of being tested, then a person who is never tested literally does not fall under the definition. However, this reduces "intelligence" to a bureaucratic event rather than a human quality. It licenses the dismissal only by making the concept so narrow it loses all meaning for a novelist.

  #### 2. The Realist (Thermometer) Reading
  **The Claim:** Intelligence is a latent, causal property of the nervous system (a "natural kind"). Tests are instruments designed to detect this property, much like thermometers detect temperature. The sentence is shorthand for "Tests are our best current instruments for detecting this property."
  *   **Truth Status:** **Substantive and Defensible.** This is the standard view of modern psychometrics (construct validity). It assumes the thing exists independently of the measurement.
  *   **Evidence For/Against:** *For:* Test scores correlate with neural processing speed, working memory capacity, and real-world outcomes (income, health) even decades later. *Against:* Tests are noisy. They can be biased. A broken thermometer does not mean the temperature doesn't exist.
  *   **Does it support the friend's dismissal?** **No.** On this reading, your friend is confusing the map for the territory. If your character possesses the neural/cognitive capacity but lacks the opportunity to demonstrate it on a specific test, the test is flawed (or contextually invalid), not the character. The question "Is she intelligent?" remains meaningful and answerable by looking at her brain or her problem-solving, not just the test score.

  #### 3. The Ecological/Adaptive Reading
  **The Claim:** Intelligence is not a single internal engine, but a measure of "fit" between an organism's cognitive tools and its environment. It is the capacity to achieve goals within a specific niche.
  *   **Truth Status:** **Substantive and Defensible.** This aligns with evolutionary psychology and situated cognition.
  *   **Evidence For/Against:** *For:* Individuals who fail abstract tests often excel in complex real-world navigation (like your character with the storms and social dynamics). Skills are often domain-specific. *Against:* There is evidence of a "general factor" ($g$) that transfers across domains. If she were truly intelligent, she should be able to learn to read eventually.
  *   **Does it support the friend's dismissal?** **No.** In fact, it contradicts it violently. On this reading, your character is *highly* intelligent because she survives and maintains social cohesion in a harsh environment. The test is an irrelevant metric because it measures fit for a school environment, not a fishing settlement. The friend's dismissal is an error of ecological context.

  #### 4. The Social-Constructivist Reading
  **The Claim:** "Intelligence" is not a biological reality but a social label applied to people who succeed in institutional hierarchies. The tests do not measure capacity; they measure acculturation and grant status.
  *   **Truth Status:** **Substantive (Sociologically).** This treats intelligence as a political or sociological category rather than a psychological one.
  *   **Evidence For/Against:** *For:* Test scores correlate heavily with socioeconomic status and schooling quality. The definition of intelligence changes over history. *Against:* It ignores the biological constraints on learning and the predictive power tests have even when controlling for class.
  *   **Does it support the friend's dismissal?** **Yes, but cynically.** If intelligence is a status granted by institutions, and your character is outside those institutions, she cannot *be* intelligent in the sociological sense. She can be skilled, wise, or capable, but she lacks the *credential*. Your friend's dismissal here is a comment on power, not psychology.

  #### 5. The Eliminativist Reading
  **The Claim:** There is no such thing as intelligence, just as there is no such thing as "witchcraft." It is a folk-psychological myth. There are only specific tasks and specific performances.
  *   **Truth Status:** **Radical and Controversial.** Most scientists reject this, but some neuroscientists and philosophers hold it.
  *   **Evidence For/Against:** *For:* We have not found a single "organ" of intelligence in the brain. *Against:* The robust statistical regularity of cognitive performance suggests *something* unitary is happening.
  *   **Does it support the friend's dismissal?** **Yes, by dissolving the question.** If intelligence doesn't exist, asking if she has it is like asking if she has phlogiston. But this dismisses *everyone's* intelligence, not just hers, which likely wasn't your friend's intent.

  ***

  ### Assessment of Your Friend's Position

  Your friend most likely intended **Reading 1 (Methodological Operationalism)**, but he is relying on the intuitive plausibility of **Reading 2 (Realism)** to make it sound scientific.

  This is a common rhetorical move in psychology. When challenged on the nature of a trait, psychologists retreat to Operationalism ("It's just the score!") to avoid metaphysical trouble. But when they want to claim predictive power, they slide into Realism ("It measures their potential!").

  **Does this license his dismissal?**
  No. It does not.
  Even if we accept Reading 1, it only means "We cannot *scientifically quantify* her intelligence." It does not mean "There is nothing further to be said." A novelist is not a psychometrician; you are not bound by the requirement for operational definition. You are describing a human life, not running a regression analysis.

  Furthermore, if he implicitly holds Reading 2 (that tests track a real thing), he is committing a measurement error. A thermometer that reads "0" when placed in a fire is broken; it does not prove the fire is cold. If a test reads "low" for a woman who successfully navigates complex social and environmental storms, the test may lack *validity* for her population. His dismissal assumes the test is perfect and the context is irrelevant. That is bad science, not just bad philosophy.

  ***

  ### Advice for the Novelist

  You asked which reading you could honestly adopt in deciding how to write and describe her.

  **Do not adopt Reading 1 (Operationalism).** It will starve your narrative. It reduces human depth to a data point and forces you to treat your character's inner life as unknowable because she lacks a credential.

  **Do not adopt Reading 4 (Constructivism) as your primary lens.** While it offers great thematic tension (the tragedy of being unrecognized by the system), if you treat it as the *only* truth, you risk making her skills seem merely "alternative" rather than genuinely cognitive. It can drift into condescension.

  **I recommend you write from the perspective of Reading 3 (Ecological/Adaptive), underpinned by Reading 2 (Realism).**

  Here is the reasoning for this choice:
  1.  **It validates her interiority.** Reading 2 allows you to assert that she possesses a real, biological capacity for pattern recognition, prediction, and inhibition control. When she smells the storm, her brain is processing data faster than the literate men's. You can describe this as a physical, cognitive reality, not just a "skill."
  2.  **It creates the necessary tension.** Reading 3 explains *why* she fails the test without diminishing her. She is a specialist organism in a specific niche. The test measures "fitness for school," she possesses "fitness for the coast." This allows you to write scenes where her intelligence is undeniable to the reader (and the community), but invisible to the state.
  3.  **It resolves your uncertainty.** You are unsure what readers mean when they ask if she is "really intelligent." They are asking if she possesses the *causal power* to solve problems (Reading 2/3), not if she possesses the *social status* (Reading 4).

  **How to write it:**
  Describe her cognitive processes with the same weight you would give a mathematician. When she looks at the gulls, do not write "she knew instinctively." Write about the calculation. Write about the data she is holding in her head, the variables she is weighing. Show the *work* of her intelligence.

  If a character in the book challenges her, saying, "You can't even read," you now have the philosophical ground to have another character reply (or for the narrative to imply): "She reads the water. You just read the paper."

  Your friend's slogan is a shield for scientists who need to publish data. You are a novelist exploring human nature. You are licensed to reject the shield. Your character is intelligent because she survives. In the philosophy of biology and mind, that is the only metric that ultimately matters.
