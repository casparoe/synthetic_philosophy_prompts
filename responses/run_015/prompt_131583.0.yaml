answer: |-
  # Coherence Audit Procedure: Conditional Risk Assessments (CARA-76)

  **Purpose:** To detect operational incoherence in conditional forecasts arising from the "Triviality Result" (Lewis 1976). Specifically, to identify cases where forecasters treat the probability of a conditional statement ($P(\text{If } A \text{ then } B)$) as identical to the conditional probability ($P(B|A)$) while simultaneously treating the conditional as a truth-apt proposition that constrains belief states independent of the antecedent.

  **Target Users:** Audit Desk Analysts (No graduate logic training required).
  **Time Allocation:** 15 minutes per statement.
  **Scope:** Explicit and implicit conditional probabilities in policy and risk contexts.

  ---

  ## Part 1: Audit Flowchart (Ordered Steps)

  ### Step 1: Structural Parsing and Probability Extraction
  *   **Question:** Does the statement assert a dependency between an antecedent event ($A$) and a consequent event ($B$), and is there a quantified or qualifiable confidence level ($C$) attached to the dependency itself?
  *   **Sufficient Answer:** Identification of $A$ (condition), $B$ (outcome), and $C$ (confidence/probability). If $C$ is implicit (e.g., "likely"), map to the institute's standard scale (e.g., "likely" = 60-80%).
  *   **Stop Condition:**
      *   **Pass:** Structure is clear ($A, B, C$ identified). Proceed to Step 2.
      *   **Fail:** No conditional structure found (e.g., simple categorical prediction). Close audit.
      *   **Escalate:** Antecedent or Consequent is semantically incoherent (e.g., "If the number is blue...").
  *   **Misfire Mode:** *Over-parsing.* Do not force a conditional structure onto causal claims that are actually unconditional predictions disguised as conditionals (e.g., "If you breathe, you will live" is effectively "You will live"). If the antecedent is certain ($P(A) \approx 1$), flag as "Trivial Antecedent" and skip to Step 4.

  ### Step 2: The "Void" Test (Semantic Operationalization)
  *   **Question:** If the antecedent $A$ fails to occur, is the forecast considered **void** (no payout/truth value) or **evaluated** (true/false based on $B$)?
  *   **Sufficient Answer:**
      *   *Void:* "The bet is off." (Consistent with $P(B|A)$).
      *   *Evaluated:* "The statement is True because $A$ didn't happen." (Consistent with Material Conditional).
  *   **Stop Condition:**
      *   **Pass:** Forecaster explicitly commits to **Void**. Proceed to Step 3.
      *   **Fail:** Forecaster explicitly commits to **Evaluated** (Material Conditional) *AND* claims $C = P(B|A)$. **IMMEDIATE FLAG.** This combination triggers the triviality collapse.
      *   **Escalate:** Forecaster is ambiguous. Proceed to Step 3 with a "Semantic Ambiguity" tag.
  *   **Misfire Mode:** *The Literalist Trap.* Do not fail a forecaster for using standard language ("If A, B") that implies material conditionality in casual speech. You must verify if they *operationalize* it as such in their betting/scoring rules. If their scoring rule voids on $\neg A$, they pass, regardless of phrasing.

  ### Step 3: The "Independence" Check (Triviality Probe)
  *   **Question:** Does the forecaster allow the confidence $C$ in "If $A$ then $B$" to update their belief in $B$ in scenarios where $A$ is known to be false?
  *   **Sufficient Answer:**
      *   *No:* "If $A$ is false, my belief in $B$ reverts to the baseline $P(B)$." (Safe).
      *   *Yes:* "Even if $A$ is false, the high probability of the conditional suggests $B$ is still likely." (Unsafe).
  *   **Stop Condition:**
      *   **Pass:** Belief in $B$ is independent of the conditional statement when $A$ is false. Proceed to Step 4.
      *   **Fail:** Belief in $B$ is constrained by the conditional statement even when $A$ is false. **IMMEDIATE FLAG.** This implies the conditional is being treated as a standard proposition with probability mass, violating the constraint.
      *   **Escalate:** Forecaster claims "correlation" between $A$'s failure and $B$'s success independent of the conditional. Escalate to Senior Auditor for causal modeling review.
  *   **Misfire Mode:** *The Correlation Confusion.* Do not flag cases where $\neg A$ is causally linked to $B$ through external factors. The audit checks if the *conditional statement itself* is doing the work, not external causal links.

  ### Step 4: Algebraic Consistency (The "Sum" Check)
  *   **Question:** When combined with other forecasts in the same portfolio, do the assigned probabilities for conditionals sharing the same antecedent sum to $> 100\%$ without accounting for the probability of the antecedent?
  *   **Sufficient Answer:** Calculation of $\sum P(B_i|A)$. If $\sum P(B_i|A) > 1$, check if the forecaster normalizes by $P(A)$.
  *   **Stop Condition:**
      *   **Pass:** Probabilities are coherent relative to $P(A)$. **Audit Complete.**
      *   **Fail:** Forecaster treats $P(\text{If } A \text{ then } B)$ as a standalone asset that can be summed with $P(\text{If } A \text{ then } \neg B)$ to exceed 1 without acknowledging the collapse of the probability space. **RETRACTION RECOMMENDED.**
      *   **Escalate:** Complex portfolio dependencies requiring quantitative risk team.
  *   **Misfire Mode:** *The Silo Effect.* Do not fail a single forecast in isolation if the incoherence only appears when combined with a different department's forecast. This step requires access to the immediate "family" of forecasts issued by the same team.

  ---

  ## Part 2: Case Applications

  ### Case (i): Central Bank Forecast
  *   **Statement:** "If the central bank raises rates by more than 150 basis points this quarter, recession is likely" (75% confidence).
  *   **Path Summary:**
      1.  **Parse:** $A$ = Rate hike >150bp, $B$ = Recession, $C$ = 75%. (Pass)
      2.  **Void Test:** Institute policy treats macroeconomic conditionals as void if the rate hike does not occur. (Pass)
      3.  **Independence:** Analysts confirm that if rates stay flat, the 75% figure does not influence their baseline recession probability. (Pass)
      4.  **Algebra:** No conflicting conditionals on rate hikes issued by this team. (Pass)
  *   **Final Disposition:** **PASS.** The forecast is treated as a conditional probability $P(B|A)$, not a propositional asset.
  *   **Unwelcome Result:** False.

  ### Case (ii): Supplement Preprint
  *   **Statement:** "If this supplement is taken daily for eight weeks, working memory improves" (Supported by 40-subject preprint, no explicit probability).
  *   **Path Summary:**
      1.  **Parse:** $A$ = Supplement intake, $B$ = Memory improvement. Confidence implicit ("supported by"). (Pass)
      2.  **Void Test:** Ambiguous. Clinical trials often treat non-compliance ($\neg A$) as exclusion, but the claim implies a causal law (True/False). (Escalate/Tag Ambiguity).
      3.  **Independence:** The preprint claims a causal mechanism. If the supplement is *not* taken, the authors imply the mechanism still *exists* (truth of the law), which leans toward propositional treatment. However, they do not assign a probability to the law itself, only to the outcome.
      4.  **Algebra:** No probability assigned, so triviality constraints on probability masses do not strictly apply yet.
  *   **Final Disposition:** **ESCALATE.** Flag for "Causal vs. Conditional" clarification. The lack of explicit probability prevents a mathematical fail, but the semantic framing risks reifying the conditional as a truth-apt law independent of instances.
  *   **Unwelcome Result:** False.

  ### Case (iii): Institutional "Safe Harbor" Forecast (Retraction Candidate)
  *   **Statement:** A widely circulated report states: "We are 90% confident that [If Policy X is adopted, Growth will exceed 2%]. Furthermore, because this conditional relationship is structurally robust, even if Policy X is not adopted, the probability of Growth exceeding 2% remains elevated (80%) due to the validity of the conditional model."
  *   **Path Summary:**
      1.  **Parse:** $A$ = Policy X, $B$ = Growth >2%. $C$ = 90% for conditional. (Pass)
      2.  **Void Test:** The statement explicitly claims validity even if $A$ is false. (Fail Condition Met).
      3.  **Independence:** The statement explicitly allows the conditional's confidence to update belief in $B$ when $A$ is false ("...even if Policy X is not adopted..."). **This violates Step 3.**
      4.  **Algebra:** By treating the conditional as a proposition that confers probability mass to $B$ independent of $A$, they have equated $P(A \to B)$ with a standard event probability while maintaining it equals $P(B|A)$. This triggers the Lewis collapse (the distribution becomes trivial because the conditional constrains the world regardless of the antecedent).
  *   **Final Disposition:** **FAIL / RETRACTION.** The forecast treats the conditional as a truth-apt proposition that constrains $P(B)$ independently of $A$, while simultaneously claiming the 90% figure represents $P(B|A)$. This is mathematically incoherent under the triviality constraint.
  *   **Unwelcome Result:** True.

  ---

  ## Part 3: Limitations and Inconclusiveness

  **What the Procedure Cannot Do:**
  1.  **Resolve Semantic Debates:** The audit cannot decide whether indicative conditionals *are* conditional probabilities (Adams' Thesis) or truth-conditional propositions (Stalnaker/Lewis). It only flags operational incoherence when forecasters mix the two frameworks.
  2.  **Detect Hidden Algebras:** If a forecaster holds private beliefs about related conditionals not disclosed in the text, the "Algebraic Consistency" step (Step 4) may yield a false pass.
  3.  **Quantify Vagueness:** For open-textured events (e.g., "If tensions rise..."), the procedure cannot determine if the antecedent has "measure zero" in the forecaster's mental model. It relies on the forecaster's good-faith estimation of $P(A)$.
  4.  **Settle Philosophical Disagreement:** Where a forecaster explicitly adopts a non-standard logic (e.g., trivalent logic) that avoids triviality, this audit will flag them as "Fail" because it assumes classical Boolean constraints. The audit is silent on the validity of non-classical probabilistic logics.

  **Procedure Cannot Settle:**
  *   Whether a conditional with a false antecedent is "vacuously true" or "void."
  *   Whether high confidence in a causal law implies high confidence in the effect absent the cause.
  *   The metaphysical status of counterfactuals.

  ---

