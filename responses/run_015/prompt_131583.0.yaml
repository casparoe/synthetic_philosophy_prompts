prompt: |-
  You run the coherence audit desk at a forecasting institute that publishes conditional risk assessments—statements of the form "if A, then B" paired with explicit or implicit confidence ratings. Your team needs a reusable audit procedure to check whether any given conditional forecast violates the triviality constraint on indicative conditionals: if the probability assigned to "if A then B" is treated as identical to the conditional probability P(B|A) across a non-degenerate algebra of propositions, then either the conditioning events have measure zero or the entire probability distribution collapses to trivial point-mass values. The procedure must work when forecasters have not formalized the full logical algebra, must be runnable in about fifteen minutes per statement by staff without graduate logic training, and must clearly separate mathematical failures from value judgments about what counts as "similar enough" conditioning events. Write the audit as an ordered flowchart in words: for each step, state the exact question to ask, what evidence counts as a sufficient answer, the stop condition (pass / fail / escalate to human judgment), and the specific misfire mode if the step is applied too mechanically. The procedure must handle conditionals embedded inside policy recommendations, vague or open-textured conditioning events, and cases where only implicit probabilities are present. Apply it to three forecasts: (i) "If the central bank raises rates by more than 150 basis points this quarter, recession is likely," assigned 75% confidence; (ii) "If this supplement is taken daily for eight weeks, working memory improves," supported only by a forty-subject preprint with no explicit conditional-probability mapping; and (iii) a widely circulated institutional forecast that your procedure forces you to flag for formal retraction because its implicit conditional-probability mapping collapses. For each case, show the path through the steps and the final disposition. Then state precisely what the procedure cannot do—which classes of conditional statement it is silent on, and where philosophical disagreement about the semantics of indicative conditionals makes the audit necessarily inconclusive rather than decisive. After the main text, provide a structured summary as a JSON object with the following schema: {"audit_steps": [{"step_number": integer, "question": string, "sufficient_answer": string, "stop_condition": string, "judgment_flag": boolean, "misfire_warning": string}], "case_applications": [{"case_label": string, "path_summary": string, "final_disposition": string, "unwelcome_result": boolean}], "limitations": [string], "procedure_cannot_settle": [string]}.
