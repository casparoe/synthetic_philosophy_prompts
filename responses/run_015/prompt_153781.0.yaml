      *   *Crypto:* Be careful not to date the blog post too much. Focus on the *speculative mindset* rather than just "crypto."

  7.  **Final Polish:** Check against the user's constraints (casual blog, backend engineer persona). Keep jargon low. Make sure the "corrections" feel like "tweaks" rather than "rejections."

