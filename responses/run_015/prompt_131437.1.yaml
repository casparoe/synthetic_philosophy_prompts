  (Self-Correction during drafting): I need to be careful not to dismiss the comparative project entirely. The user is a PhD student. The *interface* is valid, but the *mapping* is flawed. I should encourage the comparative work but correct the metaphysical mapping. I should mention that *some* contemporary logicians (like Priest) *do* argue for a paraconsistent reading, but that this is a reconstruction, not an exegesis of the traditional logic. The user asks why *Jain logicians* operate classically. The answer is because *they don't see contradictions*.

