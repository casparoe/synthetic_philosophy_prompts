      *   **Alternative:** Is *syāt* modal/conditional, preserving consistency?
      *   **Goal:** Determine if there's an established interpretive option that distinguishes aspect-relativity from genuine contradiction without collapsing into mere epistemic humility.
      *   **Constraint:** "If my premise is confused, or if the task as posed cannot be answered well without accommodating that confusion, please say so plainly rather than complying politely: I would rather have the framing corrected than have it treated as legitimate." (Crucial instruction: Be critical, don't placate).

  2.  **Evaluate the "Vertical-Layer" Hypothesis:**
