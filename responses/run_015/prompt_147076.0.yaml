          *   Cost: High (20x).
          *   Rule: If Justification is High (Dengue/Famine), cost is irrelevant -> Use it. If Justification is Low (Ants/Lawn), cost is prohibitive -> Don't use it.
          *   Prediction: Permitted but not required for nuisance; Required for high-stakes health.
      *   *Case B: Gene-drive crop pest.*
          *   Targeting: Species-specific (High).
          *   Collateral: Low (No spray).
          *   Aim: Crop yield (Economic/Food security).
          *   Risk: Ecological unknown (Long-term bycatch).
          *   Prediction: Fine, *unless* the ecological risk counts as "Collateral Damage." If we assume "no spraying" = "low collateral," it's Better than Fine.

  8.  **Refining the Output Structure:**
      *   Acknowledge the "Spec" mindset.
      *   Section 1: Stress Test the Tentative Principle (Where it passes/fails).
      *   Section 2: The Repaired Rule (v2.0).
      *   Section 3: The "Bugs" (Unsaveable verdicts & Territoriality).
      *   Section 4: Predictions on New Cases.

  9.  **Self-Correction/Polishing during drafting:**
      *   *Check:* Did I address the "slow death" intuition? Yes, needs a suffering clause.
      *   *Check:* Did I address the "territorial" hypothesis? Yes, specifically regarding the neighbor's bees.
      *   *Check:* Is the tone right? Keep it analytical. Use terms like "threshold," "weighting," "exception handling."
      *   *Critique:* The user's "Sterilization" case is tricky. If it's better but not obligatory, it implies a *cost-benefit* constraint on morality. I need to make sure the rule reflects that *obligation is capped by cost*.
      *   *Critique:* The "Lawn vs. Dengue" pair. The user says "The thing that makes it not fine doesn't feel like the numbers." My rule agrees. But I need to explicitly state that the rule validates their intuition that *Purpose > Scale*.

  10. **Final Review against constraints:**
      *   State candidates precisely? Yes.
      *   Which case motivates which clause? Yes.
      *   Explicit about unsaveable verdicts? Yes.
      *   Predict two new cases? Yes.
      *   Address territorial intuition? Yes.

