      *   *Case 6: Broad-spectrum spray (Roses + Neighbor's bees).*
          *   Target: Pests on roses.
          *   Spillover: Neighbor's bees (Bystanders).
          *   Aim: Aesthetics (Cosmetic/Low value).
          *   Verdict: Not Fine (Worse than lawn).
          *   *Fit:* Good (Spillover + Cosmetic).

      *   *Case 7: Locust control (Famine).*
          *   Target: Swarm.
          *   Aim: Prevent Starvation (Highest value).
          *   Verdict: Fine/Untroubling.
          *   *Fit:* Good.

      *   *Case 8: Slow vs. Fast Toxin / Sterilization.*
          *   Target: Same.
          *   Aim: Same.
          *   Variable: Suffering / Method.
          *   Verdict: Slow is worse. Sterilization is better but not obligatory.
          *   *Fit:* **FAIL.** The tentative principle says nothing about *method* or *suffering*, only *target* and *aim*. This needs a new clause.

  4.  **Identify Inconsistencies & "Bugs" (The "Repair" Phase):**

      *   *The Lawn vs. Dengue Pair:* The user says the principle handles this ("aim was worth anything"). But is "cosmetic" vs "health" enough? The lawn kills grubs to protect grass roots (technically functional) but the user calls it "purely so it looks uniform." If the grubs were killing the grass, would it be okay? Probably. So the distinction is *Human Benefit Magnitude*.
      *   *The Slow Death Intuition:* This introduces *Minimization of Suffering* as a constraint, but a weak one (not obligatory). This looks like a "preference" rather than a "hard rule."
      *   *Territorial/Ownership:*
          *   Wasp (Back door/My house) -> OK.
          *   Ants (Kitchen/My house) -> OK.
          *   Grubs (Lawn/My land) -> Not OK (but it's *my* lawn). Why? Because the *reason* is weak.
          *   Roses (My roses + Neighbor's bees) -> Worse. Why? Because it violates *their* territory.
          *   Locusts (Region-wide) -> OK.
          *   *Hypothesis:* Ownership matters when the *aim* is weak. When the aim is strong (Dengue, Famine), ownership/territory boundaries dissolve. When the aim is weak (Lawn, Roses), trespassing harm (bees) or arbitrary dominion (grubs) becomes salient.
          *   *Conclusion:* Yes, some verdicts are territorial intuitions wearing cost-benefit costumes. Specifically, the "Neighbor's hives" case. If they were *my* hives, would I still spray? Probably not, because I value bees. But the *wrongness* is amplified because it's the *neighbor's* property.

  5.  **Drafting the Repaired Rule (The Spec):**

      *   Need inputs: `Target_Specificity`, `Justification_Weight`, `Collateral_Damage`, `Suffering_Intensity`, `Alternatives_Cost`.
      *   Need logic: Hierarchy of justification.
      *   *Clause 1 (Justification):* Must exceed a threshold. (Safety/Health > Hygiene > Aesthetics).
      *   *Clause 2 (Targeting):* Must minimize non-target harm. (Spillover reduces permissibility).
      *   *Clause 3 (Suffering):* If justification is met, minimize suffering *if cost is low*. (Explains the sterilization intuition).
      *   *Clause 4 (Territory):* Externalizing cost to others (neighbor's bees) lowers the threshold significantly.

  6.  **Addressing the Unsaveable Verdicts:**
      *   *Sterilization:* User says "feel better... but don't feel obliged." This is a classic "Supererogatory" action (good to do, not wrong not to do). A binary rule (Fine/Not Fine) struggles here. It needs a "Preferred" state.
      *   *Lawn vs. Dengue:* This is actually consistent on *Justification*, but the user feels the *numbers* should matter more than they do. The rule saves the verdict, but the user's meta-ethics (why numbers don't matter) remains unexplained. I need to point out that the rule *explains* the verdict, but validates a potentially inconsistent moral weight (individual vs. collective).

  7.  **Predicting New Cases:**

      *   *Case A: High-cost low-bycatch trap.*
