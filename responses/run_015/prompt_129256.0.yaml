  # JOINT STATEMENT ON THE TWIN EARTH PARADIGM
  **Signed by the Semantic Externalist Camp (SEC) and the Narrow-Content Internalist Camp (NCIC)**
  **Date:** October 26, 2023
  **Subject:** Findings from Adversarial Collaboration on Content Externalism

  ## I. AGREED CLAIMS

  Following a series of structured dialogues and thought-experiment analyses, the Semantic Externalist Camp (SEC) and the Narrow-Content Internalist Camp (NCIC) affirm the following points of consensus regarding the logical structure and dialectical status of the Twin Earth argument:

  1.  **Formal Structure of the Scenario:** Both camps agree that the canonical Twin Earth scenario posits two subjects, Oscar (Earth) and Twin-Oscar (Twin Earth), who are molecule-for-molecule intrinsic duplicates at time *t*, situated in environments that are phenomenally indistinguishable but differ in the underlying microstructure of a specific substance (e.g., H₂O vs. XYZ). Both camps agree that in the canonical case, the extension of the term "water" differs between the two environments.
  2.  **Classes of Disputed Expressions:** Both camps agree that the primary locus of disagreement concerns **natural-kind terms** (e.g., "water," "gold," "tiger") and **proper names**. Both camps agree that logical constants, pure indexicals (e.g., "I," "now"), and purely descriptive phrases are not the primary drivers of the externalist intuition, though they may be affected by its consequences.
  3.  **The Role of Natural-Kind Terms:** Both camps agree that natural-kind terms are distinguished in this context by the presumption that their reference is fixed, at least in part, by an objective "hidden structure" or essence in the environment, rather than solely by a cluster of descriptive beliefs held by the speaker.
  4.  **Relevant Intuitions as Data:** Both camps treat the following intuitive judgments as legitimate data requiring explanation, even if they explain them differently:
      *   **Reference Intuitions:** Judgments about what object or substance a speaker is referring to.
      *   **Truth-Condition Intuitions:** Judgments about whether a speaker's assertion is true or false in a given world.
      *   **Psychological Equivalence Intuitions:** Judgments about whether two subjects are in the same psychological state for the purposes of causal explanation of behavior.
  5.  **Validity of the Intuition Pump:** Both camps agree that the Twin Earth scenario is not a logical proof but an intuition pump that relies on the stability of pre-theoretical judgments about meaning and mind. Both agree that if these intuitions prove unstable under variation (e.g., in artifactual cases), the strength of the argument is proportionally diminished.

  ## II. PRECISE FORMULATIONS OF DISAGREEMENT

  While the camps agree on the data, they disagree on the theoretical interpretation of that data. Each side endorses the following formulation of its own position as accurate and non-strawmanned:

  **A. Scope of Externalism (Functional, Artifactual, and Biological Kinds)**
  *   **SEC Formulation:** "The determination of content by environmental factors is not limited to chemical natural kinds. It extends to artifactual kinds (e.g., 'pencil'), biological kinds (e.g., 'elm'), and functional states, provided the kind is defined by its causal history or role in a wider system. If the environment changes the extension, it changes the content."
  *   **NCIC Formulation:** "Externalist intuitions may hold for public language reference (semantics), but they do not extend to the content of mental states (psychology) regarding artifactual or functional kinds. Mental content supervenes on the internal functional organization of the subject. Even if reference shifts, the narrow content driving behavior remains invariant across environments."

  **B. Characterization of Mental States**
  *   **SEC Formulation:** "Mental states should be characterized in terms of their **truth-conditional content** (wide content). Since truth conditions depend on the environment, the mental state itself is individuated broadly. Phenomenal character does not exhaust mental content."
  *   **NCIC Formulation:** "Mental states relevant to psychological explanation should be characterized in **phenomenal or functional-role terms** (narrow content). Two intrinsic duplicates share the same mental states because they share the same causal powers. Representational content that varies by environment is a relational property, not an intrinsic property of the mental state."

  ## III. ASSESSMENT OF VERBAL DISPUTE

  Both camps acknowledge the possibility that a portion of the dispute is verbal, specifically centering on the definition of "content."

  *   **SEC Assessment:** The dispute is **substantive**. The term "content" tracks the conditions under which a belief is accurate or a statement is true. Since truth is world-involving, content must be world-involving. To restrict "content" to the head is to change the subject from meaning/truth to something else (e.g., "character" or "role").
  *   **NCIC Assessment:** The dispute is **partially terminological**. We agree on the facts of the case (duplicates behave alike; reference differs). The disagreement lies in whether "mental content" is the proper label for the relational property (SEC) or the intrinsic property (NCIC). However, a substantive remainder exists regarding *which* property is causally explanatory of behavior.

  ***

  ## IV. DISAGREEMENTS TABLE: CRUXES AND PREDICTIONS

  The following table outlines the specific theoretical cruxes remaining, formulated neutrally, alongside concrete hypothetical cases agreed upon by both camps to test these cruxes. Each camp records its predicted judgment in advance.

  | Crux | Neutral Formulation of the Issue | Concrete Hypothetical Case | SEC Prediction & Consequence | NCIC Prediction & Consequence |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. The Non-Circularity Criterion** | Is there a criterion for "sameness of mental state" across environments that does not presuppose whether content is wide or narrow? | **The "Amnesiac Twin" Case:**<br>Oscar is transported to Twin Earth but suffers temporary amnesia regarding the word "water." He points to a clear liquid and thinks a thought he would express as "This is thirst-quenching." He has no memory of H₂O or XYZ. | **Prediction:** The content is indeterminate until causal contact is re-established, but once established, it tracks the local environment (XYZ).<br>**Consequence:** Mental state individuation requires environmental anchoring, confirming externalism even in reduced cognitive states. | **Prediction:** The mental state is identical to Earth-Oscar's pre-transport state because the internal functional/phenomenal role is unchanged.<br>**Consequence:** Confirms that narrow content is the primary psychological kind; environmental anchoring is secondary to semantics, not psychology. |
  | **2. Non-Chemical Duplicates (Artifactual/Historical)** | Does the externalist intuition hold when the difference between worlds is purely historical/causal rather than microstructural? | **The "Replicator Pencil" Case:**<br>On Earth, pencils are made of wood/graphite. On Twin Earth, "schmencils" are molecularly identical but grown organically from a plant that mimics wood/graphite perfectly. Both camps use the word "pencil." | **Prediction:** Oscar and Twin-Oscar mean different things by "pencil" (artifact vs. organism). Therefore, their beliefs about pencils have different truth conditions.<br>**Consequence:** Externalism applies to artifactual kinds based on origin/history, not just microstructure. | **Prediction:** Oscar and Twin-Oscar have the same narrow concept of a "writing implement." The ontological category (plant vs. artifact) is external to the psychological state.<br>**Consequence:** Externalism fails for functional kinds; psychological explanation relies on function, not origin. |
  | **3. Phenomenal Supervenience** | Does the phenomenal character of experience supervene on internal states, or can it shift with external content without the subject noticing? | **The "Slow-Switch" Case:**<br>Oscar is unknowingly moved from Earth to Twin Earth over time. He continues to think "Water is wet." Eventually, his concept shifts to XYZ. | **Prediction:** At some point, the content of his thought changes (to XYZ) even if the phenomenal feel remains constant. Phenomenology does not fix content.<br>**Consequence:** Phenomenal character is not a reliable guide to semantic content; externalism trumps introspection. | **Prediction:** If the phenomenal feel is constant, the narrow content is constant. If SEC claims content changed, they are talking about reference, not the mental state itself.<br>**Consequence:** Phenomenal character tracks narrow content; claims of "content shift" without phenomenal shift indicate a category error. |
  | **4. Causal Explanatory Power** | Which notion of content (wide or narrow) better explains the subject's behavior in a local context? | **The "Poisonous Water" Case:**<br>On Earth, water is safe. On Twin Earth, XYZ is toxic. Oscar (Earth) and Twin-Oscar (Twin) both drink their respective liquids expecting hydration. | **Prediction:** We explain Twin-Oscar's sickness by citing his belief about *XYZ*. The wide content explains the differential outcome (health vs. sickness).<br>**Consequence:** Wide content is causally relevant to outcomes involving environmental interaction. | **Prediction:** We explain the *drinking action* identically for both (thirst + belief in hydration). The sickness is an external consequence, not a difference in the psychological cause of the action.<br>**Consequence:** Narrow content exhausts the causal explanation of *behavior*; wide content only explains *results*. |

