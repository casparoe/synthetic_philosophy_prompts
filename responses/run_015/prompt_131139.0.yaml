answer: |-
  You have identified a very real, very specific mechanism of modern polarization, and you are right to feel that the standard vocabulary ("echo chamber," "filter bubble") is too blunt for it. Those terms describe *isolation*. You are describing *inoculation through adversarial exposure*.

  There is no single, universally agreed-upon noun for this exact phenomenon, which is frustrating for a writer but excellent for your novel—it means you are mapping territory that is still being named. However, there is a cluster of concepts in political science, social psychology, and media studies that, when stacked, describe Dana's machinery perfectly.

  Here is the breakdown of the existing concepts, a proposed name for the specific dynamic you've found, the boundaries of the concept, and the truth about "exposure" that will help you write the arc.

  ### 1. The Existing Concepts (The Machinery)

  To understand Dana without caricature, you need to layer three specific academic ideas:

  **A. C. Thi Nguyen's "Echo Chambers" (Epistemology)**
  Philosopher C. Thi Nguyen makes a crucial distinction that fits your prompt exactly.
  *   **Epistemic Bubbles:** You leave out contrary evidence (algorithmic filter bubbles).
  *   **Echo Chambers:** You actively *undermine* the trust of outside sources.
  Dana is not in a bubble; she is in a chamber. Her side doesn't hide the other side's arguments; they present them *specifically to discredit the source*. When Dana meets the reasonable opponent, she doesn't lack information; she lacks *trust*. Her community has taught her that any "reasonable" member of the other side is either lying, naive, or an exception that proves the rule.

  **B. Affective Polarization (Political Science)**
  This is the finding that partisans increasingly *dislike* and *distrust* the other side more than they *disagree* with them on policy. Dana's anger is not about the curriculum; it's about the *moral character* of the people proposing it. Affective polarization is driven by **Negative Partisanship** (identity defined by opposition to the enemy). For Dana, the "Gallery of Worst Moments" is necessary fuel. If the enemy is reasonable, her identity as a resistor loses its moral urgency.

  **C. Vicarious Negative Contact (Social Psychology)**
  The "Contact Hypothesis" states that meeting the other side reduces prejudice. However, recent research on **Vicarious Contact** shows that *mediated* contact (seeing the other side on screens, even if your side shares it) often increases prejudice. Furthermore, **Negative Contact Theory** posits that one negative interaction (or witnessing one) outweighs ten positive ones. Dana's "Gallery" is a collection of vicarious negative contacts. The reasonable man at the meeting is a single positive data point trying to outweigh a database of thousands of negative ones.

  ### 2. A Coined Name: "Weaponized Familiarity"

  Since you asked for a term to help you hold the concept (even if not for dialogue), I propose **Weaponized Familiarity**.

  **Definition:** A state in which an individual consumes high volumes of information about an opposing group, but exclusively information curated by their own ingroup to demonstrate the opposition's incompetence, malice, or absurdity. This creates a sense of "knowing" the enemy that reinforces hostility rather than reducing it.

  **Why this fits Dana:**
  *   **Familiarity:** She isn't ignorant. She can quote them. She feels informed.
  *   **Weaponized:** The information is ammunition, not illumination.
  *   **The Trap:** Because she feels informed, she is immune to the standard advice ("you just don't understand them"). She *does* understand them—she understands the caricature her side has built, and she mistakes that for the reality.

  ### 3. The Edges: Where does this stop being "Mockery"?

  You asked where the line is between this phenomenon and ordinary, healthy skepticism or mockery of opponents.

  *   **Ordinary Mockery:** "That specific argument is stupid, and here is why it fails logically." The focus is on the *idea*.
  *   **Weaponized Familiarity:** "That argument is stupid, and it reveals who they *are*." The focus is on the *ontology* of the opponent.

  **The Boundary Test:**
  If Dana were presented with a policy proposal from the other side that was identical to one her side supports, would she accept it?
  *   **Healthy Skepticism:** "I agree with this, even if they proposed it."
  *   **Weaponized Familiarity:** "They are proposing this only to trick us / gain PR points / hide their real agenda."

  The line is crossed when the *source* of the information permanently contaminates the *content*, regardless of the content's merit. In your novel, the moment Dana hears the reasonable opponent concede a point and her immediate internal monologue is *"What is he gaining by saying this?"* rather than *"He's right,"* she has crossed into Weaponized Familiarity.

  ### 4. The Exposure Question: Does more contact help?

  This is critical for your plot. The standard liberal advice is "dialogue." The research suggests that for someone like Dana, **more exposure of the kind she is already getting will make her worse.**

  *   **Quantity vs. Quality:** Dana has high *informational* exposure but zero *relational* exposure.
  *   **The Backfire Effect:** If you force her to consume "reasonable" content from the other side (e.g., "Read this moderate blog"), she will likely analyze it through her existing framework of Weaponized Familiarity. She will look for the dog whistles. She will treat moderation as a strategy, not a belief.
  *   **When Exposure Works:** Contact Theory only works under specific conditions (Allport's Contact Hypothesis):
      1.  Equal status within the situation.
      2.  Common goals.
      3.  Intergroup cooperation (working *together*, not debating).
      4.  Support from authorities.

  **For your novel:** The school curriculum meeting is actually a perfect setting for this. If Dana and the Opponent are forced to *write a paragraph together* (Common Goal/Cooperation), that has a chance of breaking the spell. If they just *talk about their views* (Debate), it will reinforce the Gallery.

  ### 5. The "Fix": Why Steelmanning Fails

  You noted that Dana could pass the "Ideological Turing Test" (state the other side's view so well they agree) but it wouldn't change her mind. You are correct.

  **Why it fails:**
  Steelmanning is an intellectual exercise. Dana's polarization is *affective* (emotional/tribal). She doesn't hate them because she misunderstands their logic; she misunderstands their logic because she hates them (or needs to).

  **The Honest Fix:**
  The only thing that breaks Weaponized Familiarity is **Shared Vulnerability.**
  Dana needs to see the Opponent fail at something, or struggle with something, in a way that has nothing to do with the culture war. She needs to see him be humanly incompetent, or tired, or worried about a sick kid.
  *   **Why:** The "Gallery" consists of monsters and villains. Villains don't get tired. Villains don't make clumsy mistakes.
  *   **The Mechanism:** When she sees him as *complex* rather than *curated*, the Gallery loses its resolution. It's not that she agrees with him; it's that she can no longer sustain the caricature required to keep her anger warm.

  ### Summary for Character Construction

  *   **Dana's Internal Logic:** She is not stupid. She is rigorously informed. She believes she is the only one taking the threat seriously. Her anger is a moral virtue in her eyes.
  *   **The Opponent's View of Dana:** He likely sees her as radicalized, but he probably suffers from the same thing (he likely has a Gallery of Dana's side's worst moments). This symmetry is key to avoiding caricature on *both* sides.
  *   **The Turning Point:** It shouldn't be an intellectual realization ("I see the logic now"). It should be a visceral one ("I see the person now"). The moment the "Gallery" feels fake compared to the human in front of her.

  **Recommended Reading for Research:**
  1.  **"Echo Chambers and Epistemic Bubbles" by C. Thi Nguyen** (Philosophy paper, very accessible).
  2.  **"Uncivil Agreement" by Lilliana Mason** (Political Science book on Affective Polarization/Identity).
  3.  **"The Contact Hypothesis" (Gordon Allport)** - specifically look for critiques and modern updates on "Negative Contact."

  You are writing about the tragedy of **knowing everything and understanding nothing.** That is a powerful place to start a novel.
