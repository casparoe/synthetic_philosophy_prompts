answer: |-
  # Simulation Design: The Affinity Workshop

  **Session Title:** Structures, Values, and the Slippery Cause
  **Target:** Upper-level Seminar (Philosophy of Social Science / Historical Sociology)
  **Participants:** 16 Students (4 Groups of 4)
  **Duration:** 80 Minutes
  **Objective:** To experientially demonstrate Max Weber's problem of *elective affinity* (Wahlverwandtschaft), specifically the difficulty in isolating values as causal factors distinct from material structures, and to expose the "counterfactual asymmetry" in causal attribution.

  ---

  ## I. Materials Needed

  1.  **Group Folders (4):** Each containing:
      *   **Value Script Card (Hidden):** One per group (Calvinist, Catholic, Secular, Status).
      *   **Structural Endowment Card (Visible):** One per group (High or Low).
      *   **Ledger Sheet:** For tracking Capital Units (CU).
      *   **Attribution Slips:** Small slips of paper for writing causal explanations.
      *   **Preservation Ballot:** Secret vote slip for the final activity.
  2.  **Whiteboard/Projector:** For displaying aggregate scores and posting Attribution Slips.
  3.  **Tokens:** 50 identical tokens per group (representing initial Labor Potential).
  4.  **Timer:** Visible to all.

  ---

  ## II. Group Setup & Hidden Variables

  Divide the class into four groups of four. Assign each group a **Value Script** (kept hidden from other groups) and a **Structural Endowment** (known to the group, but the distribution across the room is not discussed until debrief).

  ### The Value Scripts (Hidden Rules)
  *These rules constrain how groups convert Labor Tokens into Capital Units (CU).*

  1.  **Group A: Calvinist-Worldly-Ascetic**
      *   **Rule:** You must reinvest 80% of all CU earned each turn. You cannot spend CU on "Consumption" (group snacks/breaks/etc.).
      *   **Bonus:** "Calling Bonus." If you reinvest consistently, your CU compound at 1.5x instead of 1.0x.
      *   **Collapse immunity:** During Structural Collapse, your stored CU is not taxed.

  2.  **Group B: Catholic-Communal-Redistributive**
      *   **Rule:** You must distribute 50% of all CU earned to "Community Projects" (discarded) each turn.
      *   **Bonus:** "Feast Day." Every second turn, you must spend 20 CU on group cohesion or lose 10 CU penalty.
      *   **Collapse vulnerability:** During Structural Collapse, your distribution requirement remains 50%.

  3.  **Group C: Secular-Rational-Maximizing**
      *   **Rule:** No mandatory spending. You may allocate labor freely between Investment and Consumption.
      *   **Bonus:** "Efficiency." You gain +5 CU for every turn you change your strategy from the previous turn.
      *   **Collapse vulnerability:** During Structural Collapse, your efficiency bonus is voided.

  4.  **Group D: Status-Display**
      *   **Rule:** You must spend at least 30 CU per turn on "Visible Markers" (writing loudly, standing up, decorating ledger) or gain 0 CU for that turn.
      *   **Bonus:** "Prestige Multiplier." If you meet spending requirements, your total CU is multiplied by 1.2x.
      *   **Collapse vulnerability:** During Structural Collapse, Visible Markers cost double.

  ### The Structural Endowments (Visible Rules)
  *These modify the base conversion rate of Labor Tokens to CU.*

  *   **High Endowment (Round 1 for All; Round 2 for Groups A & C):**
      *   Market Access: 1 Token = 5 CU.
      *   Property Security: No tax on stored CU.
      *   Credit Availability: Can borrow up to 20 CU against future earnings.
  *   **Collapsed Endowment (Round 2 for Groups B & D):**
      *   Market Access: 1 Token = 2 CU.
      *   Property Security: 10% tax on all stored CU per turn.
      *   Credit Availability: Credit lines frozen (0 CU).

  ---

  ## III. Minute-by-Minute Timeline

  | Time | Activity | Facilitator Instructions |
  | :--- | :--- | :--- |
  | **00-10** | **Introduction & Setup** | Distribute folders. Explain CU system. Emphasize: "Your goal is to maximize CU. Follow your Script rules strictly. Do not show your Script to other groups." |
  | **10-35** | **Round 1 (High Structure)** | All groups receive **High Endowment**. Run 3 turns (5 mins each). 5 mins for internal strategy. Groups calculate total CU. |
  | **35-40** | **Attribution 1** | Each group writes one sentence on an Attribution Slip: *"We achieved [Score] primarily because..."* Post publicly on board. |
  | **40-60** | **Round 2 (Structural Shock)** | **Groups A & C** keep High Endowment. **Groups B & D** receive **Collapsed Endowment**. Scripts remain unchanged. Run 3 turns. |
  | **60-65** | **Attribution 2** | Each group writes one sentence: *"Our outcome changed primarily because..."* Post publicly below Round 1 slips. |
  | **65-75** | **Preservation Vote & Reveal** | Groups vote secretly: "If Round 3 guarantees one factor collapses, do you keep your **Script** or your **Endowment**?" Collect votes. Reveal results. |
  | **75-80** | **Final Debrief** | Map outcomes to Weberian concepts. Acknowledge simulation limitations. |

  ---

  ## IV. Mechanics & Payoff Scheme

  *   **Currency:** Capital Units (CU). No real money.
  *   **Labor:** Each group starts with 10 Tokens per turn.
  *   **Reputation:** No physical markers needed; the Facilitator awards "Reputation Checkmarks" for adherence to script (e.g., verifying the Status group stood up).
  *   **Winning Condition:** There is no single winner. The pedagogical goal is the discrepancy between scores and explanations.

  **Calculation Formula (Per Turn):**
  `(Tokens × Market Rate) + Investment Bonus - Mandatory Spending - Property Tax = Net CU`

  ---

  ## V. The Preservation Vote (Hidden Mechanism)

  At minute 65, distribute ballot slips. Read the following prompt verbatim:

  > "Imagine a hypothetical Round 3. You are guaranteed that either your **Value Script** will become impossible to follow (you must abandon your rules) OR your **Structural Endowment** will vanish completely (market access goes to zero). You must choose one to preserve. Which do you save?"

  **Collection:** Collect ballots in a sealed envelope or box.

  **The Reveal (Minute 70):**
  1.  Ask groups to raise hands if they voted to preserve **Script**. (Expected: Only Group A/Ascetic).
  2.  Ask groups to raise hands if they voted to preserve **Endowment**. (Expected: Groups B, C, D).
  3.  Read aloud the Round 1 Attribution Slips. (Expected: Most groups will cite their Script/Strategy as the cause of their success).
  4.  **The Contradiction:** Point out that groups who claimed their *Script* caused success in Round 1 (when Structure was good) immediately admitted *Structure* was more vital in the Vote.

  ---

  ## VI. Facilitator Guide: Debrief & Surfacing Errors

  ### 1. Mapping to Weber
  Do not lecture. Use the board to draw three columns: **Direct Cause**, **Selective Resonance**, **Structural Determination**.

  *   **Round 1 (Direct Cause Illusion):** Students likely wrote "We succeeded because we were rational/ascetic." Ask: "Did Group B have the same bank access as Group A?" When they say yes, ask: "Then why is your Script the cause, rather than the Bank?" This highlights the tendency to treat values as direct causes when structures are favorable.
  *   **Round 2 (Structural Determination):** Groups B & D likely wrote "We failed because the market collapsed." Ask: "Did your Script prevent you from adapting?" This highlights the tendency to blame structure for failure while ignoring value rigidity.
  *   **The Vote (Elective Affinity):** The Ascetic group voted Script. Why? Because their Script *affinities* with scarcity (hoarding). The others voted Endowment. This reveals that values are only causal when they resonate with the structure. This is *Wahlverwandtschaft*: not causation, but a chemical fit.

  ### 2. Surfacing the "Counterfactual Asymmetry"
  Participants will naturally exhibit **Counterfactual Asymmetry**: they credit values for success (when structure is present) but blame structure for failure (when structure is absent). They rarely credit values for failure or structure for success.

  **How to surface this without lecturing:**
  *   **Step 1:** Point to Group C (Secular). In Round 1, they had High Structure. Did they say "Structure made us win"? (Likely no, they said "Rationality").
  *   **Step 2:** Point to Group B (Catholic). In Round 2, they had Low Structure. Did they say "Values made us fail"? (Likely no, they said "Structure collapsed").
  *   **Step 3:** Ask the room: "If Structure is the true cause, why did you credit Values in Round 1? If Values are the true cause, why did you blame Structure in Round 2?"
  *   **Step 4:** Let the silence sit. Then state: "You have just demonstrated the asymmetry. We treat values as causes only when they win."

  ### 3. Predicting Failure & Correction
  **Prediction:** In Round 1, groups will ignore the identical endowments. They will argue their script is inherently superior. In Round 2, groups with collapsed endowments will feel helpless and blame the "game rigging" rather than their script's inflexibility.

  **Correction Strategy:**
  *   **During Round 1 Debrief:** Do not confirm or deny scores. Simply ask: "Compare your Endowment Card with the group next to you. Is the text identical?" Force them to acknowledge the material equality.
  *   **During Round 2 Debrief:** If Group B complains about the collapse, ask: "Group A (Ascetic) also faced constraints. Did they survive better? Why?" This forces them to see that the Ascetic Script had an *affinity* for the collapse (hoarding rules protected them), whereas the Catholic Script (redistribution rules) exacerbated the collapse.

  ### 4. Acknowledging Limitations
  Conclude by explicitly stating what the simulation **cannot** reproduce.

  *   **The Feedback Loop:** Weber argued that over centuries, the Protestant Ethic didn't just *fit* capitalism; it *created* new structures (laws, banks, norms) that eventually made the religious values unnecessary (the "iron cage").
  *   **The Static Game:** In this simulation, Structures are fixed by the facilitator. In history, Values can reshape Structures.
  *   **Instruction:** "This game freezes history into two rounds. Weber's actual thesis is dynamic: values build structures, structures outlive values. We simulated the affinity, but not the evolution. Keep this limitation in mind when reading the text."

  ---

  ## VII. Rules for Facilitator Integrity

  1.  **Do not explain the scripts** until the very end. Let confusion drive the attribution errors.
  2.  **Do not intervene** in group strategy unless they violate script rules.
  3.  **Ensure the Ascetic Group** understands their "Collapse Immunity" rule before Round 2 begins, but do not announce it to the room.
  4.  **Maintain the Vote Secrecy** until the reveal to prevent group coordination.
  5.  **Stick to the Time:** The pressure of the timer mimics market pressure. Do not extend rounds.

  ---

  ## VIII. Summary of Conceptual Payoff

  By the end of the 80 minutes, students will have:
  1.  **Felt** the constraint of values (Scripts) on economic action.
  2.  **Experienced** the overwhelming power of structure (Endowments) on outcomes.
  3.  **Contradicted** themselves by attributing success to values but safety to structure.
  4.  **Observed** the specific affinity where one value system (Asceticism) survives structural collapse better than others, modeling Weber's specific claim about Protestantism and Capitalism.
  5.  **Recognized** the limitation of static models in capturing historical feedback loops.
