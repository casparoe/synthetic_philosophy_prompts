  **Scenario**

  Elena Rostova, Director of the Port of Avonmouth, faces a midnight deadline to authorise immediate dredging of the main channel to accommodate new Panamax vessels. Geological surveys indicate a 15% probability that the dredge path intersects a unique, undocumented 17th-century warship wreck, the destruction of which would constitute an irreversible loss of national heritage that no subsequent compensation could undo; if the wreck is absent (85% probability), the project yields a net increase in port wealth of £20 million, but if present, the project yields a net increase of only £5 million due to fines and delays, in addition to the heritage loss. Rostova is known to be risk-averse: she recently rejected a certain portfolio value of £110 million in favour of a 50% chance of £120 million and a 50% chance of £100 million, revealing a concave utility function over wealth. The precautionary measure is to halt dredging pending a costly sonar scan, which guarantees the wreck's safety but delays the profit by a year, resulting in a net wealth change of £0 for this fiscal period (status quo).

  ***

  **Analysis**

  **(a) Expected-Value Maximiser**
  An expected-value (EV) maximiser ignores risk attitudes and irreversibility, focusing solely on monetary expectation.
  *   **Wait:** £0.
  *   **Dredge:** $0.85 \times £20\text{m} + 0.15 \times £5\text{m} = £17\text{m} + £0.75\text{m} = £17.75\text{m}$.
  *   **Recommendation:** **Dredge.** (Since £17.75m > £0).
  *   *Note:* This calculation treats the heritage loss as having no monetary value or assumes the £5m figure nets it out. If the heritage loss were assigned a finite monetary value $L$, EV would recommend Dredge so long as $17.75 - 0.15L > 0$, i.e., $L < £118.3\text{m}$.

  **(b) Risk-Averse Expected-Utility Maximiser**
  We anchor the utility function in Rostova's revealed preference. She rejects £110m certain for a gamble with EV £110m ($0.5 \times 120 + 0.5 \times 100$). This implies $u(110) > 0.5u(120) + 0.5u(100)$. A natural logarithmic function, $u(w) = \ln(w)$, satisfies this condition ($\ln(110) \approx 4.700$; $0.5\ln(120) + 0.5\ln(100) \approx 4.696$). We assume baseline wealth $W_0 = £100\text{m}$.
  *   **Wait:** $u(100) = \ln(100) \approx 4.605$.
  *   **Dredge:** We must assign a utility penalty $H$ to the heritage loss. To test the Precautionary Principle (PP) against risk aversion, we select an $H$ such that EU still recommends dredging. Let the utility cost of the heritage loss be $H = 1.0$ util (equivalent to dropping wealth from £105m to approx £38m in utility terms).
      *   Outcome 1 (No Wreck): $W = 120$. $u(120) = \ln(120) \approx 4.787$.
      *   Outcome 2 (Wreck): $W = 105$. Utility = $\ln(105) - H \approx 4.654 - 1.0 = 3.654$.
      *   $EU(\text{Dredge}) = 0.85(4.787) + 0.15(3.654) = 4.069 + 0.548 = 4.617$.
  *   **Comparison:** $4.617 (\text{Dredge}) > 4.605 (\text{Wait})$.
  *   **Recommendation:** **Dredge.** Even with significant risk aversion and a substantial utility penalty for the heritage loss, the expected utility of dredging exceeds the status quo.

  **(c) Maximin and the Precautionary Principle**
  *   **Maximin:** Compares the worst-case outcomes.
      *   Wait: £0 change (Wealth £100m).
      *   Dredge: Heritage loss + £5m (Utility equivalent to Wealth £38m).
      *   **Recommendation:** **Wait.** (Since £100m > £38m equivalent).
  *   **Precautionary Principle:** Given the threat of irreversible harm (heritage loss) and scientific uncertainty (15% probability is non-negligible but not certainty), the PP dictates taking precautionary measures despite the lack of full scientific certainty.
      *   **Recommendation:** **Wait.**

  **Check Against Maximin Conditions**
  Standard justifications for Maximin/PP require: (1) no reliable probabilities, (2) indifference to gains above the guaranteed floor, and (3) worst outcomes that are unacceptable.
  *   **Reliable Probabilities:** Our case *has* reliable probabilities (15%). This condition is **absent**.
  *   **Indifference to Gains:** Rostova clearly values the gains (EU > Status Quo). This condition is **absent**.
  *   **Unacceptable Worst Outcomes:** The heritage loss is defined as irreversible and uncompensatable. This condition is **present**.

  **The Single Feature Doing the Work**
  The single feature driving the divergence between EU and PP is the **lexical priority of irreversibility**. In the EU calculation, the harm is tradable against gains (a utility penalty of 1.0 was outweighed by expected profit). The PP, however, treats the irreversible harm as a veto constraint rather than a tradeable cost. If this feature is removed—that is, if the heritage loss is treated as compensatable (e.g., a fine that fully restores value)—the PP loses its grip, and the verdict collapses back to the EU recommendation (Dredge), as the harm becomes merely another cost to be weighed.

  **Sunstein-Style Critic Attack and Judgement**
  A critic in the mould of Cass Sunstein would argue that this case demonstrates the incoherence of the Precautionary Principle rather than its utility. Sunstein contends that risks exist on all sides; here, the risk of *not* dredging is the loss of £17.75m in expected value, which could have been used to fund other heritage projects or public goods. By focusing solely on the risk of action (destroying the wreck), the PP ignores the risk of inaction. The critic would assert that once you assign a utility value to the heritage loss (as we must to perform any analysis), the decision is simply a matter of Expected Utility. If the harm is truly "lexical" (infinite disutility), then EU breaks down entirely, and the PP adds nothing but a rhetorical label for "assign infinite cost to this outcome."

  **Judgement:** The critic **succeeds** in exposing that the PP is not a distinct decision *rule* but rather a instruction to specify utilities lexicographically. In this case, the PP does work over and above *ordinary* risk aversion (since EU recommended Dredge), but it does so only by violating the continuity axiom of expected utility theory. Therefore, the PP is not a refinement of rational choice under risk, but a rejection of it in favour of a deontological constraint. The case successfully isolates this tension, showing that PP only diverges from EU when it ceases to be a calculative principle and becomes a veto.
