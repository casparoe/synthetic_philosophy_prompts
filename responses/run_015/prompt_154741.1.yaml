      *   *Standard Utilitarian View:* Aggregation matters. $1 \text{ unit of pain} \times 1,000,000,000 > 1,000,000 \text{ units of pain} \times 1$.
      *   *User's Twist:* The "dust speck" is usually imagined as a discrete event. But what if the harm is ambient (background radiation, systemic stress)? Does that change the moral calculus?
