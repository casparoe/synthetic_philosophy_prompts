      *   **Call to Action/Workshop Goal:** We need new metrics. Statistics aren't enough; we need a phenomenology of background harm.
      *   **Closing:** Welcome everyone.

      *   *Tone Check:* Needs to be intellectual but welcoming. Not lecturing the philosophers, but inviting them to expand the frame. Not confusing the public health folks with "utility functions."

  4.  **Refining the Argument (Self-Correction during drafting):**
      *   *Risk:* Philosophers might roll their eyes and say "ambient harm is just distributed discrete harm."
