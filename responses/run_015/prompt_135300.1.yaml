answer: |-
  **Project Title:** The Robustness of Superrationality: A Sensitivity Analysis of Logical Correlation in Strategic Interaction

  **1. Research Question and Motivation**
  Standard discussions of superrationality rely on idealized limit cases, most notably Hofstadter's Platonia dilemma. In this setup, agents achieve optimal outcomes by randomizing their strategies based on the assumption that their reasoning is perfectly logically correlated with other participants (i.e., they are running identical computations on the same problem). While Functional Decision Theory (FDT) provides a clear normative account for this limit case ($\rho = 1$), and Causal Decision Theory (CDT) accounts for the independent case ($\rho = 0$), there is no established account for the intermediate region ($0 < \rho < 1$).

  In real-world strategic interactions—voting, strikes, open-source contribution, or climate action—agents are never perfectly identical, nor are they strictly independent. Their decision algorithms are similar but noisy, or correlated via common causes rather than logical identity. Current decision theories are silent on whether the superrational recommendation degrades gracefully as correlation decreases, or whether there is a discontinuity where cooperation collapses entirely.

  This project asks: **Is the normative recommendation of superrationality continuous with respect to the degree of correlation between agents?** Specifically, does the cooperative equilibrium persist as logical correlation degrades into probabilistic similarity, or does the theory prescribe a sharp threshold below which agents ought to defect? A secondary question investigates payoff structures: does shifting from winner-takes-all to diluted pots render the superrational optimum indeterminate?

  **2. Critical Context**
  Existing frameworks address only the endpoints of the correlation spectrum.
  *   **Causal Decision Theory (CDT):** Treats other agents' moves as causally independent unless a direct causal link exists. It fails to capture the normative force of algorithmic similarity, prescribing defection in Platonia-style cases.
  *   **Evidential Decision Theory (EDT):** Accounts for correlation but conflates logical correlation with common-cause correlation, leading to well-documented pathologies (e.g., the Smoking Lesion).
  *   **Functional Decision Theory (FDT):** Successfully handles perfect logical correlation by treating decisions as outputs of a shared abstract function. However, it lacks a formalism for *partial* logical correlation. It is unclear how FDT should weigh a scenario where another agent runs a *similar* but not *identical* algorithm.
  *   **Correlated Equilibrium (Game Theory):** Posits an external correlating device. This bypasses the core philosophical problem: how internal reasoning about similarity generates correlation without an external signal.

  The gap is not merely technical; it determines the practical applicability of superrationality. If the cooperative solution vanishes as soon as $\rho < 0.99$, superrationality is a philosophical curiosity with no force in actual collective action problems.

  **3. Methodology**
  This project will not propose a new decision theory from axioms, nor will it conduct empirical psychology studies. The goal is normative, not descriptive. Instead, I will perform a **sensitivity analysis of existing decision theories** across a parameterized family of games.

  I will construct a formal model with two variable parameters:
  1.  **Correlation ($\rho$):** The probability that another agent's move is determined by the same deterministic policy as the subject. I will distinguish between *logical correlation* (algorithmic similarity) and *common-cause correlation* (screened-off by a predictor), testing whether FDT and EDT diverge here as $\rho \to 1$.
  2.  **Payoff Structure:** Comparing winner-takes-all (Platonia) vs. diluted pots (public goods).

  I will derive the expected utility for CDT, EDT, and FDT agents across the full range of $\rho$. The primary analysis involves solving for the symmetric equilibrium strategy as a function of $\rho$ and checking for continuity, thresholds, or indeterminacy.

  **4. Work Plan (12 Months)**
  *   **Months 1–3: Formalization.** Define the parameterized game family. Rigorously distinguish "logical similarity" from "common cause" within the model. Verify that the $\rho$ parameter captures the intended intuition without collapsing into standard correlated equilibrium.
  *   **Months 4–6: Endpoint Analysis.** Reproduce standard results for $\rho=0$ and $\rho=1$ for all three theories to ensure the model recovers known baselines. Begin sensitivity analysis for $0 < \rho < 1$.
  *   **Months 7–9: Payoff Variations.** Introduce the diluted pot parameter. Test the hypothesis that superrationality becomes indeterminate in diluted scenarios (i.e., optimal entry probability approaches zero).
  *   **Months 10–12: Synthesis and Writing.** Compare results. Determine if a threshold exists. Draft the dissertation/monograph.

  **5. Expected Outcomes and Failure Conditions**
  A **positive result** would demonstrate a specific threshold $\rho^*$ below which superrational cooperation is no longer the utility-maximizing strategy, or prove that the recommendation is discontinuous at $\rho=1$. This would clarify the limits of superrationality's practical force. Alternatively, proving that FDT recommendations remain robust even under low $\rho$ would significantly strengthen the case for logical decision theories in real-world politics.

  **Failure conditions** are clearly defined:
  1.  **Boring Continuity:** If the optimal strategy simply interpolates linearly between CDT and FDT endpoints without qualitative change, the project yields little philosophical insight.
  2.  **Reductionism:** If the model collapses into standard correlated equilibrium theory without adding normative clarity regarding *internal* reasoning, the distinction sought is illusory.
  3.  **Indeterminacy:** If the diluted pot model yields no determinate solution, this is a substantive result, but risks rendering the theory useless for the cases it was designed to solve.

  **6. Scope and Feasibility**
  My supervisor has rightly noted that analyzing both correlation structures *and* payoff variations amounts to approximately three papers' worth of work. To ensure completion within twelve months, I will prioritize the **correlation structure analysis** (Months 1–9). The payoff variation (Month 7–9) will be treated as a contingent second chapter. If the correlation analysis reveals significant complexity (e.g., if logical and common-cause correlations diverge sharply), I will drop the payoff variation to focus on the primary continuity question. This ensures a robust result on the primary research question even if the secondary hypothesis must be deferred.

  The methodology avoids the decade-long task of axiomatizing a new theory, focusing instead on stress-testing existing frameworks. This is achievable within the fellowship year and provides immediate value to the literature on collective action and decision theory.
