      *   *Re-evaluating (9):* The friend is right about the Non-Identity Problem (Parfit). If slavery didn't happen, the specific descendants wouldn't exist. Claiming they are "worse off" than they would have been is metaphysically shaky. They wouldn't *be*. The fix is to switch to "disparity" or "enrichment."
      *   *Re-evaluating (6) vs (7):* If the harm is status, a check looks like a bribe. If the harm is theft, a check looks like restitution. This is crucial.

