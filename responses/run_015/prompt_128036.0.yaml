      *   **Audit Point 4: The Normativity Gap.** Biological "ought" vs. Semantic "ought".
      *   **Conclusion:** Verdict on the relaxed conclusion.

  8.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* Make sure to distinguish between *output* functions (heart) and *input* functions (sensory representation). Teleosemantics usually handles this by focusing on consumer systems (Millikan). I should mention that the heart analogy is often a shorthand for "Selected Effect Function" generally, not literally that brains pump thoughts.
      *   *Refinement on Swampman:* The prompt asks if the analogy smuggles in the conclusion. Yes, if you define function *as* history, then obviously Swampman has no function. But the debate is whether function *should* be defined that way.
      *   *Refinement on Normativity:* Be careful not to conflate moral normativity with semantic normativity. The issue is "truth norms" (belief aims at truth).
      *   *Tone Check:* Keep it rigorous. Use terms like "Etiological Theory," "Selected Effect," "Swampman," "Is-Ought Gap."

  9.  **Final Polish:** Check against all constraints in the prompt.
