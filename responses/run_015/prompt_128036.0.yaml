  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Request:**
      *   **Topic:** Teleosemantics in Philosophy of Mind (specifically the analogy between biological function and mental representation).
      *   **Core Claim to Audit:** Mental representation works like a heart (evolutionary history fixes proper function; misrepresentation is malfunction; this naturalizes "aboutness"/normativity).
      *   **Tasks:**
          1.  Create a correspondence table (Heart vs. Representation).
          2.  Pinpoint exactly where the analogy collapses.
          3.  Address specific objections: Hearts cause flow vs. represent flow; Swampman/Swampheart case (history vs. current structure); Malfunction vs. statistical deviation.
          4.  Evaluate the "relaxed conclusion" (mental norms = biological norms) given the disanalogies.
      *   **Tone:** Analytical, critical, precise, philosophical but accessible.

  2.  **Initial Brainstorming & Fact-Checking:**
      *   *Teleosemantics:* Associated with Millikan, Papineau, Dretske, Neander. The core idea is that content is determined by selected effect (SE) functions.
      *   *The Heart Analogy:* A heart's function is to pump blood because ancestors did so and conferred survival value. A heart that doesn't pump is malfunctioning. Similarly, a belief state's function is to indicate a distal state (e.g., tiger) because ancestors did so and conferred survival value. A belief that indicates "tiger" when there is no tiger is a malfunction (misrepresentation).
      *   *The "Swampman" Objection:* Davidson's Swampman. A molecule-for-molecule duplicate formed by lightning has no history. Teleosemanticists say it has no content (or no *proper* function). Intuition pumps suggest this is counterintuitive (it acts just like us).
      *   *Causation vs. Representation:* Hearts pump blood (causal role). Mental states represent tigers (intentional content). Does pumping count as "about" blood? Usually, no. This is the "Input/Output" problem.
      *   *Normativity:* Biological norms (health/function) vs. Semantic norms (truth/falsity). Are they the same kind of "ought"?
      *   *Statistical Deviation:* Can we define malfunction just as "rare"? No, because rare mutations can be functional, and common diseases can be malfunctions. Selection history is usually deemed necessary for *normativity* (what it *ought* to do), not just statistics (what it *usually* does).

  3.  **Drafting the Correspondence Table:**
      *   Need to map the biological domain to the semantic domain clearly.
      *   *Heart* $\rightarrow$ *Mental State/ Mechanism*
      *   *Pumping* $\rightarrow$ *Representing/Indicating*
      *   *Blood Flow* $\rightarrow$ *Distal State of Affairs (Truth Condition)*
      *   *Selection History* $\rightarrow$ *Phylogenetic History of Success*
      *   *Valve Failure/Clot* $\rightarrow$ *False Belief/Misrepresentation*

  4.  **Analyzing the Collapse Points (The "Audit"):**
      *   *Point 1: Causation vs. Intentionality.* Hearts don't represent blood. They move it. Mental states are *about* things. The heart analogy explains *function*, but does it explain *aboutness*? Teleosemantics tries to bridge this by saying the function is to *correlate* with input, but the heart analogy is output-oriented.
      *   *Point 2: The Swamp Case.* If a Swampheart pumps perfectly, is it malfunctioning? Teleosemantics says "Yes, it has no function." Intuition says "No, it's working fine." This suggests the theory might be too restrictive or that "function" is ambiguous (etiological vs. dispositional).
      *   *Point 3: Normativity.* Biological "ought" (health) vs. Semantic "ought" (truth). If I believe falsely, I am irrational or wrong. If a heart fails, it is diseased. Are these the same? The "normativity problem" is about justification, not just health.
      *   *Point 4: Statistical Deviation.* If a heart type usually fails (genetic defect in a population), is it malfunctioning? Yes. So statistics aren't enough. Selection history is needed to establish the *standard*. But does selection history actually provide *normativity* or just *explanation*? (The Naturalistic Fallacy worry).

  5.  **Addressing Specific Prompts:**
      *   *Hearts don't represent:* Correct. This is the "Input/Output" asymmetry. Hearts are effect-selected (pumping helps survival). Representations are often input-selected (detecting tigers helps survival). The analogy needs tweaking (e.g., comparing to a sensory organ or a frog's fly-detector).
      *   *Swampheart:* Does it support history as essential? Teleosemanticists say yes. Critics say it shows the theory is wrong because Swampman *does* have thoughts. If the analogy relies on history to define function, and Swampheart lacks history but seems functional, the analogy might be smuggling in the idea that *only* history counts, which is the very thing in dispute.
      *   *Malfunction vs. Statistics:* Statistical deviation is descriptive. Malfunction is normative. Selection history is supposed to bridge the Is/Ought gap. But does it? (Hume's Guillotine).

  6.  **Evaluating the "Relaxed Conclusion":**
      *   If mental norms are just biological norms, does the problem dissolve?
      *   Many philosophers (e.g., Kripke, Boghossian) argue semantic normativity is distinct. Truth isn't just biological fitness. A false belief can be fit (placebo effect). A true belief can be unfit (depression from realism).
      *   So, reducing semantic norms to biological norms might solve naturalization but at the cost of changing the subject (eliminating genuine *semantic* normativity).

  7.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the teleosemantic project (Millikan et al.) and the heart analogy's role.
      *   **The Correspondence Table:** Clear mapping.
      *   **Audit Point 1: The Direction of Fit (Causation vs. Representation).** Address the "hearts don't represent" objection.
