answer: |-
  This is a classic audit of **Teleosemantics**, the dominant naturalist strategy for solving the "normativity problem" (how physical states can be *about* things and *wrong* about them). The heart analogy is the intuitive engine behind Ruth Millikan's "Selected Effect" theory and its descendants.

  Here is the audit of the analogy, the correspondence table, and the breakdown of where the reduction holds and where it fractures.

  ### 1. The Correspondence Table

  The teleosemanticist argues that semantic norms (truth/falsity) are a subspecies of biological norms (function/malfunction).

  | Domain | Biological System (The Heart) | Mental System (The Representation) |
  | :--- | :--- | :--- |
  | **Vehicle** | The Heart (organ) | Neural State / Belief Mechanism |
  | **Proper Function** | Pumping Blood | Representing a Distal State (e.g., "Tiger") |
  | **Condition of Success** | Blood Circulation | Truth Condition (Presence of Tiger) |
  | **Ground of Norm** | Selection History (Ancestors pumped & survived) | Selection History (Ancestors indicated & survived) |
  | **Failure Mode** | Valve Regurgitation / Clot | False Belief / Misrepresentation |
  | **Status of Failure** | Pathology (Malfunction) | Error (Misrepresentation) |

  **The Argument:** Just as a heart *ought* to pump blood because its ancestors did so successfully, a neural state *ought* to correspond to a tiger because its ancestors did so successfully. If it fails, it is not just statistically different; it is *wrong*.

  ---

  ### 2. Audit: Where the Analogy Collapses

  The analogy is robust for explaining *function*, but it faces severe friction when explaining *content* and *normativity*. Here are the four critical failure points.

  #### A. The Direction of Fit (Causation vs. Representation)
  **The Objection:** As you noted, hearts do not represent blood flow; they *cause* it.
  *   **Heart:** The function is to produce an effect (output). Success is causal efficacy.
  *   **Representation:** The function is to correlate with a cause (input). Success is accurate correspondence.

  **The Collapse:** The heart analogy explains why a mechanism exists (to pump), but it does not explain what the mechanism is *about*. A frog's fly-detector neuron fires when a fly is present. Teleosemantics says its function is to indicate flies. But physically, the neuron is just causing a tongue snap.
  *   **Why it matters:** If you reduce representation to biological function, you risk reducing "aboutness" to "causal role." A thermostat "functions" to regulate temperature, but we hesitate to say it *believes* the room is 70°. The heart analogy smuggles in **intentionality** by treating the neural state as if it has "conditions of satisfaction" (like a belief) rather than just "conditions of operation" (like a pump). It explains why the state is *useful*, not why it is *true*.

  #### B. The Swampheart (History vs. Structure)
  **The Objection:** A Swampheart (formed by lightning, molecule-for-molecule identical to a human heart) pumps perfectly but has no selection history.
  *   **Teleosemantic Claim:** The Swampheart has no proper function. It is not *supposed* to pump; it just does. Therefore, a Swampman has no mental content.
  *   **The Collapse:** This reveals the analogy is **stipulative, not explanatory**.
      *   If you define "function" *etologically* (by history), then obviously Swampheart has no function. But this begs the question against the intuition that structure determines capacity.
      *   If the Swampheart pumps blood and keeps the organism alive, biologically it is indistinguishable from a historical heart. To say it is "malfunctioning" (or function-less) solely due to history suggests the theory is prioritizing *genealogy* over *causal capacity*.
      *   **Smuggling the Conclusion:** The analogy supports the claim that "history is essential" only if you already accept that norms *must* come from history. If you believe norms come from current systemic role (as functionalists do), the Swampheart shows the heart analogy is too restrictive. It suggests teleosemantics solves the normativity problem by **eliminating** the intuition that current structure matters, rather than explaining why history creates norms.

  #### C. Malfunction vs. Statistical Deviation
  **The Objection:** Can't we define malfunction simply as statistical rarity?
  *   **Teleosemantic Claim:** No. A genetic defect might be common in a population (e.g., high susceptibility to heart disease), but it is still a malfunction. Conversely, a rare mutation might be beneficial. Statistics describe *what is*; Selection explains *what ought to be*.
  *   **The Collapse:** This is the strongest point for teleosemantics, but it hits the **Is-Ought Gap**.
      *   Selection history explains why a trait *was* useful. It does not logically entail that the trait *ought* to be useful now.
      *   Example: The human appendix had a selected function (digesting cellulose). Now it mostly just bursts. Teleosemantics says its proper function is still digestion. But if it never digests cellulose anymore, in what sense is it *normatively* required to do so?
      *   **Application to Mind:** If a cognitive mechanism evolved to detect snakes, but now we live in cities where that mechanism triggers anxiety disorders, is it "misrepresenting" danger? Teleosemantics says yes (it's a malfunction). Intuition says it's just a mismatch. Reducing semantic error to biological mismatch changes the subject from "truth" to "fitness."

  #### D. The Normativity Gap (Biological vs. Semantic)
  **The Objection:** Biological norms are about survival/reproduction. Semantic norms are about truth/justification.
  *   **The Collapse:** These two norms diverge.
      *   **False but Fit:** A placebo belief ("This sugar pill will cure me") can be biologically functional (health improves) while being semantically false (it's sugar).
      *   **True but Unfit:** A depressive realist belief ("Life is suffering and meaningless") might be semantically true but biologically dysfunctional (leads to suicide).
      *   **The Verdict:** If mental norms were *just* biological norms, the placebo belief would be "correct" (functional) and the depressive belief "incorrect" (dysfunctional). But in philosophy of mind, we care about **truth**, not fitness. The heart analogy naturalizes *function*, but it fails to naturalize *truth*. It reduces the "normativity of the mental" to the "normativity of the organic," which many argue is a category error.

  ---

  ### 3. Final Verdict: Does the Relaxed Conclusion Survive?

  **The Relaxed Conclusion:** *Mental norms are just biological norms.*

  **Verdict:** **No, it does not survive intact.** The heart analogy carries the argument only by obscuring the distinction between **Teleological Function** (what a thing is for) and **Intentional Content** (what a thing says).

  1.  **The Analogy was Carrying the Load:** The intuition that "misrepresentation is like a malfunctioning valve" is what makes teleosemantics plausible. It makes error seem physical rather than mystical. However, once you separate *causal failure* (heart stops) from *semantic failure* (belief is false), the analogy loses its grip. A heart cannot be "false," it can only be "broken." A belief can be "true" and "broken" (useless), or "false" and "working" (comforting lie).
  2.  **History is Not Enough:** The Swampheart case demonstrates that relying solely on history makes the theory vulnerable to the charge that it ignores the *current* reality of the system. If the normativity of meaning depends on dead ancestors, it is unclear why *I* am bound by their survival statistics today.
  3.  **The Normativity Remains Spooky:** Teleosemantics successfully naturalizes *function* (biology explains why the heart is there). It fails to fully naturalize *correctness conditions* (biology does not explain why a belief *ought* to match the world, only why matching the world helped ancestors).

  **Summary:** The heart analogy works as a heuristic for **etiological function**, but it fails as a reduction of **semantic normativity**. It solves the "how is it possible?" question by changing the definition of representation to "biological function," but in doing so, it risks solving the problem by eliminating the very phenomenon (truth-conditional aboutness) it set out to explain. The "spooky mental norms" are not exorcised; they are merely relabeled as "biological fitness norms," which do not map 1:1 onto the norms of reasoning and truth we actually care about.
