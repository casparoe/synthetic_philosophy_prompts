prompt: |-
  I teach a second-year seminar on philosophical method — 16 students, one 90-minute slot, a seminar room with a projector and a table that's too small for all of us. We've just finished a week on whether intuitions are evidence, and the reading left everyone with that shrug-y conclusion of "well, intuitions vary, so maybe we should be careful". I want them to feel something sharper than that. Here's the thing I keep circling round, which I've started calling *calibration drift*: the verdicts we get from a hypothetical case feel delivered to us, obvious and reason-backed, but they're produced by something tunable, and you can install a confident new one in twenty minutes with nothing but feedback on a handful of unrelated cases — after which it feels exactly like an original one. If that's right, then the interesting thing about cross-cultural variation in intuitions isn't the first-order differences themselves but the question of which calibration any given population got, and whether "obvious to me" carries any information about that at all. So: design me a runnable in-class activity — a game, simulation or staged task with real choices and small stakes — that makes 16 undergraduates run into this themselves before anyone names it. The conceit I've been toying with is a fake "corpus annotation project": they're hired as annotators coding how people use "knows" and how names get used in a big dataset, they're split (by something arbitrary they don't notice — favourite colour of the week, whatever) into two groups, and each group is trained on one of two rival coding manuals for about fifteen minutes using short cases with an immediate answer key. They must not know there are two manuals. Then everyone comes back, re-answers two target vignettes they answered cold at the start — I've roughed these out and you can use them or replace them: (1) Priya checks the station app, which says "on time"; unknown to her, the app defaults to "on time" unless someone manually overrides it, and today nobody has, and the train does in fact arrive exactly on schedule — did Priya know the train would arrive at 18:04? (2) A town museum acquires a bronze bust the local paper attributes to the sculptor Elin Vago; it's actually a forgery by Halvard Bryn, but everyone in the town learns the name "Vago" from the paper and the plaque and uses it to talk about the bust; years later a scholar says "Elin Vago didn't make the bust after all — Halvard Bryn did" — true, or merely misleading? The two manuals need to agree on easy cases and diverge on both of those, and crucially they must *not* just be two named theories in fancy dress (no "you're the reliabilists, you're the descriptivists"): I want each manual to be reliability-flavoured on knowledge but causal-flavoured on reference, and the other the reverse, so nobody can work out which manual they're on and start reciting a position from the reading. No lecture up front, and I'd rather they didn't hear the words intuition, cross-cultural, or universal until the last twenty minutes.

  What I need from you is the actual runnable kit: minute-by-minute timeline for the 90 minutes, the materials (slips, two one-page manuals, coding sheets, whatever else), the full training sets with answer keys, the rules and payoff scheme — points, sweets, a small prize, no real money — and a debrief that maps specific moments onto specific claims. Please build in three mechanics I think the whole thing hinges on. First, a paraphrase check: at some point each student writes down what they took the vignette to be saying, so I can hold up two matching paraphrases from opposite verdicts and kill the "they're reading a different case" move before it eats the session. Second, a small number of secret controls — two or three students quietly pulled out of the training for an unrelated filler task — because I suspect the untutored responses will be all over the place, and if so that's the most useful thing in the room: the "neutral baseline" turns out to be noise, not bedrock, and that's a point I want them to walk into rather than be told. Third, after the reveal, a forced second-order choice: the project has to adopt one manual, and they must pick a selection procedure from three on offer — majority vote of the room, the verdicts of the two highest scorers on a comprehension quiz, or the verdicts of the untrained controls — with pairs wagering points on which procedure will win and on which manual will survive it. Debrief should then show that each of those three procedures is itself a contestable judgement about whose verdicts count as data, and that this is the level at which variation actually bites: even if you've established a difference, you still need a non-question-begging way to say which difference matters. Be honest about what the activity can't reproduce — I assume it's something like this: my variation is installed in twenty minutes by an explicit answer key, whereas enculturation takes years and nobody hands you a key, so the analogy to real cross-population differences may be thinner than the students will want it to be — tell me where exactly it breaks and what I'll have to supply in words.

  Two more things. One: I'm a bit uneasy about the deception, and I'm sure at least one student will be too. Give me a variant that gets the same effect without lying to them, even if it's slightly less punchy, and tell me what you'd say if someone challenges it afterwards — and while you're at it, how you'd run this async or online if I ever have to. Two: tell me what will predictably go wrong the first time I run it. My guesses: the training won't take because the cases are too long and people drift; someone spots the family resemblance to a famous case and derails everyone into theory; the pair deliberations collapse into "fine, whatever, let's just say yes"; and the debrief gets stuck on "so are intuitions just arbitrary then", which isn't the conclusion I want. What should I do in the moment in each of those cases, and what goes in the handout or on the board to steer them off it? Ideally by the end they should be able to say, in their own words, why the felt obviousness of a verdict is not evidence that the verdict wasn't installed, and why "let's just ask more people" doesn't settle anything.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**

      *   **Context:** 2nd-year philosophy seminar, 16 students, 90 minutes, seminar room (projector, small table).
      *   **Topic:** Philosophical method, specifically "calibration drift" regarding intuitions (epistemology/philosophy of language).
      *   **Goal:** Move students from "intuitions vary, be careful" to "intuitions are tunable, 'obviousness' is unreliable, and aggregation methods are contested."
      *   **Core Mechanism:** A fake "corpus annotation project" where students are split into two groups, trained on conflicting "coding manuals" (without knowing there are two), then tested on target vignettes (Priya/Train, Vago/Bust).
      *   **Specific Constraints:**
          *   Manuals must cross-cut theories (Manual A: Reliabilist Knowledge + Causal Reference; Manual B: Non-Reliabilist Knowledge + Descriptivist Reference).
          *   No lecture up front.
          *   No use of "intuition," "cross-cultural," or "universal" until the last 20 mins.
          *   **Three Required Mechanics:**
              1.  Paraphrase check (to rule out "different case" objections).
              2.  Secret controls (untutored students to show baseline noise).
              3.  Forced second-order choice (pick a selection procedure: Majority, Top Scorers, or Controls).
          *   **Deliverables:** Minute-by-minute timeline, materials (manuals, sheets, keys), payoff scheme, debrief script.
          *   **Honesty Clause:** Acknowledge limitations (20-min training vs. years of enculturation).
          *   **Ethical/Logistical Variants:** Non-deceptive version, online/async version.
          *   **Troubleshooting:** What goes wrong (training failure, theory spotting, apathy, wrong conclusion) and how to fix it in the moment.

  2.  **Deconstruct the "Calibration Drift" Experiment:**

      *   *The Hook:* Students think they are doing data entry/linguistic coding.
      *   *The Split:* Arbitrary (e.g., seat location or colored folder). Let's use colored folders for ease of distribution.
      *   *The Training:* 10-15 mins. Needs to be engaging but directive.
      *   *The Target Cases:*
          *   Case 1 (Knowledge): Priya/Train. (Fake Barn/Gettier-adjacent).
              *   Manual A (Reliabilist): Yes, she knows (process reliable enough).
              *   Manual B (Sensitivity/Safety-ish): No, she doesn't (could easily have been wrong due to default setting).
          *   Case 2 (Reference): Vago/Bust. (Gödel/Schmidt case variant).
              *   Manual A (Causal): Refers to Bryn (the forger/actual creator).
              *   Manual B (Descriptivist): Refers to Vago (the name associated with the description "sculptor of the bust").
          *   *Correction:* The prompt asks for cross-cutting.
              *   Manual 1: Reliabilist on Knowledge (Yes) + Descriptivist on Reference (Vago).
              *   Manual 2: Non-Reliabilist on Knowledge (No) + Causal on Reference (Bryn).
              *   *Wait, let's refine:* To make it harder to spot, the rules should look like "coding guidelines" not "philosophical theories."
              *   Manual Red: "Code 'Knows' if the information source is standard/official." "Code 'Refers' if the name matches the public description." -> Result: Knows=Yes, Refers=Vago.
              *   Manual Blue: "Code 'Knows' if the truth depends on a hidden override." (Wait, that's too obvious). "Code 'Knows' only if the user checked the specific mechanism." -> Result: Knows=No. "Code 'Refers' if the name tracks the actual physical origin." -> Result: Refers=Bryn.
      *   *The Controls:* 2-3 students do a filler task (e.g., "check grammar on these sentences") during training, then answer the target cases without training.
      *   *The Reveal:* Compare results. Show the split.
      *   *The Second-Order Choice:* How do we decide the "correct" coding for the project?

  3.  **Drafting the Materials:**

      *   *Manuals:* Need to look bureaucratic. "Annotation Protocol Alpha" vs. "Annotation Protocol Beta."
      *   *Training Cases:* Need 3-4 short cases per manual where they get immediate feedback.
      *   *Target Cases:* Priya and Vago (as described).
      *   *Paraphrase Sheet:* Simple "In your own words, what is the key fact?"
      *   *Payoff:* Points for accuracy *according to their manual* during training. Points for consensus during the final vote. Sweets/Chocolate for the winning team/procedure.

  4.  **Developing the Timeline (90 Mins):**

      *   0-5: Setup & Cover Story.
      *   5-20: Training Phase (Split groups).
      *   20-30: Target Task (Individual).
      *   30-35: Paraphrase Check.
      *   35-50: Group Deliberation & Second-Order Choice.
      *   50-70: The Reveal & Data Display.
      *   70-90: Debrief & Philosophical Connection.

  5.  **Addressing the Specific Mechanics:**

      *   *Paraphrase:* Include a box on the answer sheet: "Before deciding, write one sentence summarizing the critical factual detail."
      *   *Controls:* Instructor pulls 2 students aside quietly at the start ("I need you to help me format these handouts"). They sit apart.
      *   *Second-Order Choice:* Project three options. Groups wager points.

  6.  **Addressing the Ethical/Logistical Constraints:**

      *   *Deception:* It's mild deception (pedagogical). Need a strong debrief.
      *   *Non-Deceptive Variant:* Frame it as "Testing how quickly people adapt to new conventions." Tell them there are different conventions. Less punchy but safer.
      *   *Online:* Breakout rooms for training. Polls for voting.
      *   *Troubleshooting:*
          *   *Training fails:* Simplify the rules. Make the answer key explicit.
          *   *Theory spotting:* "Focus on the coding rule, not the philosophy."
          *   *Apathy:* Gamify it more. Team points.
          *   *Wrong Conclusion:* Steer debrief to "Methodology," not "Skepticism."

  7.  **Refining the "Calibration" Concept:**

      *   The key insight isn't just "we differ." It's "we were made to differ quickly, and now it feels native."
      *   The debrief must emphasize the *feeling* of obviousness post-training.

  8.  **Writing the Plan (Iterative refinement):**

      *   *Manual Design:* I need to make sure the rules aren't just "Yes/No" but require a tiny bit of processing so they feel like they learned a skill.
      *   *Manual Red (Reliabilist/Descriptivist):*
          *   Knowledge: If the source is an official interface, code YES.
          *   Reference: If the name is linked to the public description, code THE DESCRIPTION MATCH.
      *   *Manual Blue (Non-Reliabilist/Causal):*
          *   Knowledge: If the truth relies on a non-checked contingency, code NO.
          *   Reference: If the name is linked to the physical origin, code THE ORIGIN MATCH.
      *   *Wait, checking the prompt:* "Each manual to be reliability-flavoured on knowledge but causal-flavoured on reference, and the other the reverse."
      *   Okay, Manual A: Reliabilist (Knows=Yes) + Causal (Refers=Bryn).
      *   Manual B: Non-Reliabilist (Knows=No) + Descriptivist (Refers=Vago).
      *   *Actually, let's simplify for the students:*
          *   Protocol 1 (Red): "Trust the Interface" (Knows=Yes) + "Trust the History" (Refers=Bryn).
          *   Protocol 2 (Blue): "Check the Contingency" (Knows=No) + "Trust the Label" (Refers=Vago).
      *   *Wait, I need to ensure they don't spot the philosophy.* Use bureaucratic language. "Code K+ if..." "Code R- if..."

      *   *Let's finalize the Manuals for the output:*
          *   **Protocol Alpha:**
              *   Knowledge Rule: "If the agent used a standard, publicly available information system, mark KNOWS." (Reliabilist lean)
              *   Reference Rule: "If the name was introduced via a deliberate act of naming the object, mark ORIGIN." (Causal lean)
          *   **Protocol Beta:**
              *   Knowledge Rule: "If the truth of the claim depends on a hidden background condition not checked by the agent, mark NO KNOWS." (Non-Reliabilist lean)
              *   Reference Rule: "If the name is associated in the community with a specific description of the object, mark DESCRIPTION." (Descriptivist lean)
      *   *Target Cases:*
          *   Priya: App is standard (Alpha=Yes), but depends on hidden override (Beta=No).
          *   Vago: Name introduced via paper/plaque (Beta=Desc), but actual origin is Bryn (Alpha=Origin).
      *   *Wait, the prompt says:* "One manual to be reliability-flavoured on knowledge but causal-flavoured on reference, and the other the reverse."
      *   Okay, Alpha: Reliabilist (Yes) + Causal (Bryn).
      *   Beta: Non-Reliabilist (No) + Descriptivist (Vago).
      *   This works.

  9.  **Troubleshooting & Debrief:**

      *   Need specific scripts for the instructor.
      *   Need to address the "Enculturation vs. Training" gap honestly.

  10. **Final Review against Constraints:**
      *   16 students? Yes.
      *   90 mins? Yes.
      *   3 Mechanics (Paraphrase, Controls, 2nd Order)? Yes.
      *   No "Intuition" word until end? Yes.
      *   Ethical variant? Yes.
      *   Online variant? Yes.
      *   Troubleshooting? Yes.

  11. **Drafting the Content:** (Self-Correction during drafting: Ensure the "Controls" don't feel excluded. Make them feel like "Quality Assurance" auditors). Ensure the payoff is clear. Ensure the "Paraphrase" happens *before* the verdict to prevent rationalization.

      *   *Correction on Controls:* If they do a filler task, they need to answer the target cases *without* training. So they answer cold.
      *   *Correction on Payoff:* Points for matching the manual during training. Points for the group winning the final vote.
      *   *Correction on Second-Order:* The "Controls" option is risky. If controls are noisy, picking them is bad. That's the point.

      *   *Let's write it.*
answer: |-
  Here is the complete runnable kit for your 90-minute seminar on calibration drift. It is designed to be printed and distributed with minimal setup.

  ### **Part 1: The Run Sheet (90 Minutes)**

  | Time | Activity | Instructor Notes |
  | :--- | :--- | :--- |
  | **00–05** | **Arrival & Cover Story** | Hand out folders (Red/Blue) as students enter. Seat the 2 "Controls" separately. |
  | **05–20** | **Training Phase** | Groups split. Red/Blue groups train on their Protocols. Controls do filler task. |
  | **20–30** | **Target Task (Individual)** | Everyone answers the Priya and Vago cases. **Paraphrase Check** included. |
  | **30–40** | **Group Deliberation** | Red/Blue groups compare answers. Controls remain separate. |
  | **40–50** | **Second-Order Vote** | The "Project Lead" (you) announces a conflict. Students wager points on a resolution procedure. |
  | **50–60** | **The Reveal** | Collect data. Reveal the two Protocols. Show the split. |
  | **60–75** | **Debrief: The Drift** | Discuss the *feeling* of obviousness. Introduce "Calibration." |
  | **75–90** | **Debrief: The Method** | Discuss the Second-Order choice. Connect to philosophical evidence. |

  ---

  ### **Part 2: Materials & Handouts**

  #### **A. The Cover Story (Read Aloud at 00:05)**
  "Welcome. Today we are running a pilot for a large-scale corpus annotation project. We are investigating how non-experts code semantic data. You are hired as annotators. You will be trained on a specific Protocol, tested on your accuracy, and then asked to code a set of target items. Your payment today is in points: accuracy during training earns points for your team; successful consensus earns bonus points. There are two Protocol variants in circulation; you will be assigned one."

  #### **B. The Protocols (One-Page Manuals)**
  *Print on coloured paper (Red and Blue). Do not let students swap.*

  **PROTOCOL ALPHA (Red Group)**
  **CODING GUIDELINES v4.2**
  **1. KNOWLEDGE TAGGING (K-TAG)**
  *   **Rule:** If the agent acquired belief via a **standard, publicly available information system** (e.g., apps, timetables, signs), code **K-YES**.
  *   **Rationale:** Standard systems are treated as reliable by default.
  *   **Exception:** Only code K-NO if the agent ignored a specific warning flag.
  **2. REFERENCE TAGGING (R-TAG)**
  *   **Rule:** If the name is causally linked to the **physical origin** of the object, code **R-ORIGIN**.
  *   **Rationale:** Names track the historical chain of creation.
  *   **Exception:** Ignore community descriptions if they conflict with physical origin.

  **PROTOCOL BETA (Blue Group)**
  **CODING GUIDELINES v4.2**
  **1. KNOWLEDGE TAGGING (K-TAG)**
  *   **Rule:** If the truth of the belief depends on a **hidden background condition** not checked by the agent, code **K-NO**.
  *   **Rationale:** Unchecked contingencies undermine knowledge status.
  *   **Exception:** Only code K-YES if the agent verified the mechanism directly.
  **2. REFERENCE TAGGING (R-TAG)**
  *   **Rule:** If the name is associated in the community with a **specific description** of the object, code **R-DESC**.
  *   **Rationale:** Names track the descriptive content held by speakers.
  *   **Exception:** Ignore physical origin if it conflicts with community description.

  #### **C. Training Sets (With Answer Keys)**
  *Give each group 3 short cases. They mark them, then you project the Key.*

  **Alpha Training Cases:**
  1.  *Tom checks a library catalogue. It says 'Available'. It is.* -> **K-YES** (Standard system).
  2.  *A statue is called 'The King'. It was made by a sculptor named Jones.* -> **R-ORIGIN** (Physical origin).
  3.  *Sarah sees a 'Wet Paint' sign. She touches it anyway.* -> **K-NO** (Ignored warning).

  **Beta Training Cases:**
  1.  *Tom checks a library catalogue. It says 'Available'. But the system glitches often.* -> **K-NO** (Hidden contingency).
  2.  *A statue is called 'The King'. Everyone thinks it depicts King Henry.* -> **R-DESC** (Community description).
  3.  *Sarah sees a 'Wet Paint' sign. She tests the paint with a stick first.* -> **K-YES** (Verified mechanism).

  *(Note: The training cases are distinct enough from the target cases to prevent simple pattern matching, but clear enough to instil the rule.)*

  #### **D. Target Task Sheet (All Students)**
  **CONFIDENTIAL: TARGET ANNOTATION**
  *Complete this individually. Do not discuss.*

  **CASE 1: THE TRAIN**
  Priya checks the station app, which says "on time". Unknown to her, the app defaults to "on time" unless someone manually overrides it, and today nobody has. The train does in fact arrive exactly on schedule.
  1.  **Paraphrase:** In one sentence, what is the critical factual detail about Priya's situation?
  2.  **Verdict:** Did Priya **KNOW** the train would arrive at 18:04? [YES / NO]
  3.  **Confidence:** How obvious does this feel? [1–5]

  **CASE 2: THE BUST**
  A town museum acquires a bronze bust the local paper attributes to the sculptor Elin Vago. It's actually a forgery by Halvard Bryn. Everyone in the town learns the name "Vago" from the paper and uses it. Years later a scholar says "Elin Vago didn't make the bust after all — Halvard Bryn did".
  1.  **Paraphrase:** In one sentence, what is the critical factual detail about the name "Vago"?
  2.  **Verdict:** When the townspeople use "Vago", do they refer to **VAGO** or **BRYN**?
  3.  **Confidence:** How obvious does this feel? [1–5]

  #### **E. Control Group Filler Task**
  *Give this to the 2 secret controls. They do this during the Training Phase.*
  "Please proofread the following three paragraphs for grammatical errors. Do not discuss with others. After 15 minutes, you will be given the Target Task Sheet."

  #### **F. The Second-Order Vote Card**
  *Hand out after Group Deliberation.*
  **PROJECT DIRECTIVE: CONFLICT RESOLUTION**
  The Project Lead reports a systematic disagreement between annotator groups. We must adopt one standard for the final dataset.
  **Select ONE Procedure to decide the correct verdict:**
  A. **Majority Vote:** Whatever most annotators in the room say.
  B. **Expert Scoring:** Whatever the two highest-scorers on the Training Quiz say.
  C. **Baseline Check:** Whatever the Untutored Controls say.

  **Wager:** Bet 5 points on your chosen Procedure. Bet 5 points on which Verdict (Alpha or Beta) will win.

  ---

  ### **Part 3: The Debrief Script (Key Moments)**

  **1. The Reveal (Minute 50)**
  *Collect the Target Sheets. Project a grid.*
  "Look at the Paraphrases first." (Show that Red and Blue paraphrased the *facts* identically. E.g., "Priya didn't check the override." "The town learned the name from the paper.")
  *Kill the 'different case' objection immediately.* "You read the same facts. You paraphrased them the same way. But your verdicts split 100% along Protocol lines."
  "Now, look at the Controls." (Show their scattered answers). "The untutored baseline wasn't 'correct'. It was noise."

  **2. The Drift (Minute 60)**
  "Raise your hand if, during the Target Task, the answer felt *obvious* to you." (Most will raise hands).
  "You were trained 45 minutes ago. You learned a rule in 15 minutes. Yet, when you answered, it didn't feel like 'following a rule'. It felt like 'seeing the truth'."
  *Introduce the term:* "This is **Calibration Drift**. Your cognitive instrument was tuned. The 'obviousness' is not a signal of truth; it is a signal of calibration."

  **3. The Method (Minute 75)**
  "Look at your Second-Order Votes." (Tally them).
  "Why did you pick Majority? (Democracy isn't truth). Why Expert Scoring? (Experts on *what*? The rule or the world?). Why Controls? (We just saw they were noise)."
  "This is the real problem. Even if we find variation, how do we decide whose calibration counts as data? If you pick 'Experts', you are assuming their calibration is the 'correct' one. That begs the question."

  **4. The Honesty Clause (Minute 85)**
  "Where does this analogy break? In the real world, nobody handed you a manual. Enculturation takes years, not 15 minutes. It is invisible, not explicit."
  "So why do this? Because if a 15-minute manual can make a false verdict feel 'obvious', a 20-year cultural manual can do it even better. The feeling of obviousness is not evidence that the manual is absent."

  ---

  ### **Part 4: Variants & Ethics**

  #### **1. The Non-Deceptive Variant**
  *If you are uneasy about the cover story.*
  **Change:** Tell them the truth at the start. "We are testing how quickly philosophical conventions can be installed."
  **Cost:** Students might treat it as a logic puzzle ("What does the professor want?") rather than a genuine judgement.
  **Fix:** Emphasize the *phenomenology*. "I don't want you to follow the rule. I want you to tell me what feels right *after* you've learned the rule."
  **Script for Challenge:** "If a student says 'This was fake': 'Yes, the manual was fake. But the feeling of obviousness you had at minute 30 was real. That feeling is what we study.'"

  #### **2. The Async/Online Variant**
  *   **Setup:** Use LMS Groups to assign Protocol Alpha/Beta automatically.
  *   **Training:** Automated quiz with immediate feedback (3 attempts allowed).
  *   **Target:** Survey tool (Qualtrics/Forms). Lock the "Paraphrase" field so they must type before seeing the Verdict question.
  *   **Controls:** Randomly assign 10% of the class to a "Grammar Task" module before the Survey.
  *   **Debrief:** Live Zoom session to reveal data. Use Polls for the Second-Order Vote.
  *   **Risk:** Students might message each other. **Mitigation:** Randomize the order of cases and use a deadline pressure (e.g., "Survey closes in 20 mins").

  ---

  ### **Part 5: Troubleshooting (What Will Go Wrong)**

  **Problem 1: The Training Doesn't Take.**
  *Symptom:* Students answer Target Cases randomly, ignoring their Manual.
  *Cause:* Rules are too abstract.
  *Fix:* **In the moment:** Stop at minute 15. Project the Training Key again. Say: "For the purpose of this project, Rule 1 is absolute. Overrule your gut. Code the Rule."
  *Prevention:* Make the Training Cases identical in structure to the Target Cases (just different content).

  **Problem 2: Theory Spotting.**
  *Symptom:* A student shouts "This is Gettier!" or "This is Kripke!"
  *Cause:* The cases are too famous.
  *Fix:* **In the moment:** "Please suspend theoretical knowledge. We are testing annotation consistency, not philosophical truth. Stick to the Protocol."
  *Prevention:* Change the names/scenarios slightly (e.g., instead of "Priya", use "The Operator"; instead of "Vago", use "The Artist").

  **Problem 3: Apathy / "Fine, Whatever".**
  *Symptom:* Groups just pick an answer to move on.
  *Cause:* Stakes are too low.
  *Fix:* **In the moment:** Increase the wager. "The winning team gets the last 10 minutes of class to leave early / choose the next reading topic." Make the Second-Order Vote competitive between tables.

  **Problem 4: The Wrong Conclusion ("Everything is Arbitrary").**
  *Symptom:* Students conclude "Philosophy is pointless."
  *Cause:* Debrief focuses on skepticism.
  *Fix:* **Steer:** "It's not that truth is arbitrary. It's that *access* to truth is mediated. The task isn't to give up. It's to check your calibration. The method isn't 'trust your gut', it's 'check your manual'."
  *Board Work:* Write: **Obviousness ≠ Evidence.** Write: **Aggregation ≠ Justification.**

  ---

  ### **Part 6: Instructor Prep Checklist**

  1.  **Print:** 8 Red Manuals, 8 Blue Manuals, 16 Target Sheets, 2 Filler Tasks, 16 Vote Cards.
  2.  **Room:** Arrange tables so Red and Blue groups are physically separated (left/right side of room).
  3.  **Controls:** Identify 2 students you trust to follow instructions quietly (or pick the two who arrive late and pull them aside).
  4.  **Projector:** Have the Training Key and the Data Grid slides ready to go.
  5.  **Payoff:** Bring a bag of chocolates or coins. Physical rewards work better than "points" for 2nd-years.

  ### **Why This Works**
  It bypasses the "shrug" by making the variation *internal*. They aren't looking at "those people over there" who have different intuitions; they are looking at their own neighbour who was calibrated differently 20 minutes ago. The **Paraphrase Check** prevents them from dismissing the difference as verbal. The **Second-Order Vote** forces them to realize that "asking more people" is just another calibrated choice. The **Controls** destroy the myth of the "neutral observer."

  You are not teaching them that intuitions are bad. You are teaching them that *uncalibrated* intuitions are noise, and that philosophical method is the search for a calibration that isn't just "mine."
