      *   **Setup:** Million dollars if you *intend* at midnight to drink tomorrow. Money deposited tomorrow morning. Drinking happens tomorrow afternoon. Drinking causes illness, no lasting harm. No penalty for not drinking.
      *   **The Problem:** To get the money, you need the intention. But once you have the money (morning), you have no reason to drink (afternoon). Since you know you won't drink, you can't *sincerely intend* to drink at midnight. Intention implies belief in success (or at least likelihood).
