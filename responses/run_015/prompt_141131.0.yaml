answer: |-
  Here is the breakdown of Ines's code, the decision for Chapter 16, and the specific tools you need to lock it in.

  ### 1. The Rule She Has Been Running
  **The Rule of the Singular Claim.**

  Ines does not run a utilitarian calculus (maximizing lives saved), nor does she run a pure lottery. She operates on a **hierarchy of moral distinctiveness**. She refuses to aggregate strangers into a number, but she *does* distinguish between individuals based on specific qualitative markers.

  Her hierarchy, based on your previous chapters, is:
  1.  **Relationship:** (Ch. 6) A known colleague trumps a stranger.
  2.  **Future/Potential:** (Ch. 8, Ch. 10) A younger life trumps an older/sicker life.
  3.  **Individuality:** (Ch. 3, Ch. 10) A single distinct individual trumps a "group" or "crowd."
  4.  **Randomness:** (Ch. 5) Used *only* when no qualitative distinction exists (1 stranger vs. 1 stranger).

  **Why this fits:**
  *   **Ch. 3:** 5 vs. 1. She saves the 1. *Reason:* The 5 are a "sum"; the 1 is a "person." She refuses to validate the sum.
  *   **Ch. 10:** 2 (Woman + Child) vs. 1 (Man). She saves the 2. *Crucial Detail:* She explicitly says, "I wasn't counting them. I was looking at the child." The woman was saved *incidentally* because she was attached to the child. The moral weight was the child's youth, not the headcount.

  ### 2. The Decision for Chapter 16
  **She saves the girl.**

  If she saves the raft, she breaks the code established in Chapter 3 and Chapter 10.
  *   **Breaking Ch. 3:** Saving the raft because there are three of them is "adding them up." She explicitly forbade herself from doing this in Chapter 3 ("I'm not adding them up").
  *   **Breaking Ch. 10:** In Chapter 10, the presence of a child collapsed the math. The child's moral weight outweighed the single adult man, even though saving the child meant saving two people total. In Chapter 16, the child's moral weight must outweigh the three adults. If she saves the raft, she is saying that three adults outweigh one child, which contradicts her logic that the child is the "reason" for the rescue, not the numbers.

  **The Alternative Rule (The Counter-Argument)**
  You asked for a rule that fits the earlier scenes but dictates the opposite here. That rule is **"The Rule of Immediate Viability" (Triage).**
  *   *Logic:* Save the group most likely to survive the rescue attempt or who are in the most medically critical state *right now*.
  *   *Fit:* This fits Ch. 8 (Teen is more viable than sick elder). It fits Ch. 6 (Coxswain is a trained sailor, easier to recover). It fits Ch. 12 (The man yelling is accepting death, directing resources to the other).
  *   *The Divergence:* In Ch. 16, the raft is stable (three adults, one injured but "would live"). The girl is on an upturned hull (precarious, alone). Under Triage, the raft is the safer bet and the injured man requires medical aid the child does not.
  *   *Why reject it:* Ines is not a medic; she is a harbor officer. Her code is moral, not medical. Triage requires calculating survival probabilities, which is just another form of "counting."

  ### 3. The Coin Flip Problem
  You asked if she flips, is it 50/50 or weighted?

  **She cannot flip.**
  Here is why: In Chapter 5, she flipped a coin because there was *no difference* between the two swimmers. In Chapter 16, there *is* a difference (Child vs. Adult).
  *   **If she flips 50/50 (Raft vs. Girl):** She treats the Raft as a single unit. This honors Ch. 3 (no counting), but it violates Ch. 8 and Ch. 10 (Age/Youth matters). It implies a group of adults is morally equivalent to a child.
  *   **If she flips 25/75 (Equal chance per head):** She is "adding them up." This directly contradicts Ch. 3.
  *   **Conclusion:** Flipping is a regression. It admits she has no principle for distinguishing a child from an adult, which erases the character development of Chapters 8 and 10.

  ### 4. The Closest Precedent
  **Chapter 10 is the binding precedent.**

  *   **Why:** It is the only other time a child was involved against adults.
  *   **The Logic:** In Ch. 10, she saved a boat with two people because of the *one* child. She explicitly decoupled the rescue from the headcount.
  *   **Application:** In Ch. 16, the number of adults on the raft (3 vs 1 in Ch. 10) is irrelevant noise. The moral signal is the child. If she saved the child-boat in Ch. 10 despite the adult man on the other boat, she must save the child-hull in Ch. 16 despite the adults on the raft. To do otherwise makes her Ch. 10 justification ("I was looking at the child") a lie.

  ### 5. The Smallest Thing to Settle It
  You need a line of dialogue or a micro-action that proves she isn't hesitating because of the numbers, but because of the *type* of life.

  **Option A: The Line (In Chapter 16)**
  When the coxswain (or the radio) challenges her on leaving the three, she shouldn't defend the child's worth. She should dismiss the raft's claim.
  *   *Draft:* "The raft is a sum. I don't do sums."
  *   *Better:* **"Three is a number. She's a person."**
      *   *Why:* It links back to Ch. 3 ("Not adding them up") and Ch. 10 ("Looking at the child"). It clarifies that she views the raft not as three individuals, but as a statistic, which she refuses to engage with.

  **Option B: The Future Case (In Chapter 18)**
  Write a brief aftermath scene where she reviews the log or speaks to a superior.
  *   *Scenario:* A superior asks, "You left three to save one? How do you justify that?"
  *   *Her Response:* "If I'd gone to the raft, I'd have to explain why I picked which one of them to grab first. There wasn't time. With her, there was no choice."
      *   *Why:* This reveals her internal consistency. She sees the raft as a logistical problem (who to grab?) and the child as a moral imperative. It reinforces that she rescues *individuals*, not *groups*.

  ### Summary Recommendation
  1.  **Action:** She saves the girl.
  2.  **Reasoning:** It maintains the "Singular Claim" hierarchy (Child > Adult Group) established in Ch. 8 and Ch. 10, and honors the "No Counting" rule from Ch. 3.
  3.  **Key Line:** Have her say, **"I can't rescue a crowd. I can only rescue her."**
  4.  **Avoid:** Do not let her flip a coin. It undermines her established ability to distinguish value between lives (Age/Relationship) when those distinctions exist.

  This keeps her consistent: she is not a calculator, she is a witness. She saves the future she can see, not the math she can do.
