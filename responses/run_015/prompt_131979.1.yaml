      *   Let's pick Marcus admitting the substrate risk for the "Concession" requirement, as it feels more philosophical. Wait, the prompt says "One of them should admit a real tension." I'll have Thabo admit the mourning tension, it feels more poignant regarding *Ubuntu*'s ethical commitments.
