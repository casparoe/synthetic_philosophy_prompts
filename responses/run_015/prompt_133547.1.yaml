answer: |-
  **To:** Interdisciplinary Working Group on Democratic Resilience
  **From:** Strategic Advisor
  **Subject:** Agenda-Setting for Conceptual Clarification of 'Democratic Backsliding' (Years 1–3)

  ### Executive Summary

  Your friend's frustration is well-founded. The term "democratic backsliding" currently functions less as a diagnostic tool and more as a Rorschach test for political anxiety. If the concept is to survive as an analytical category rather than dissolving into a partisan epithet, your working group must prioritize conceptual architecture over empirical accumulation. You have three years and no mandate for case studies; use this liberty to solve the logical contradictions that currently make the term unusable in high-stakes environments like Hungary or the United States.

  The central tension you identified—the divergence between procedural erosion (rules/institutions) and substantive erosion (rights/liberties), particularly when governments claim procedural legitimacy (e.g., referenda) to enact substantive contraction—is the correct focal point. This divergence allows leaders to argue they are *deepening* democracy (by following the majority will) while critics argue they are *destroying* it (by removing constraints).

  Below is the ranked agenda for conceptual clarification, followed by the practical implications of resolving these questions.

  ---

  ### Part I: Ranked Conceptual Questions

  #### 1. The Constitutive Question: Is Liberalism Internal or External to Democracy?
  **The Question:** Must a regime protect specific substantive rights (minority protections, free press, judicial independence) to be classified as a democracy, or are these merely contingent features that can be altered via procedural majorities?
  **Why it is Upstream:** This is the foundational axiom. If democracy is purely procedural (the aggregation of will), then a government that wins elections and uses direct democratic mechanisms to weaken judicial review is *not* backsliding; it is governing. If democracy is inherently liberal-constitutional, then the same action is pathological. You cannot define "backsliding" until you define the "slide" relative to a fixed point. Currently, the literature oscillates between these definitions, allowing bad-faith actors to exploit the ambiguity.
  **Tractability:** High. This is a classic normative political theory problem. It requires no data, only rigorous argumentation to establish a "minimum viable definition" that distinguishes democracy from majoritarian tyranny without imposing an impossible ideal.
  **Evidence to Shift Priority:**
  *   *Move Up:* If international legal bodies (e.g., ECtHR, ICC) begin issuing contradictory rulings based on conflicting definitions of democratic legitimacy.
  *   *Move Down:* If a robust normative consensus emerges organically among constitutional courts that substantive rights are non-derogable procedural prerequisites.

  #### 2. The Intentionality Question: Distinguishing 'Entrenchment' from 'Governing'
  **The Question:** Does backsliding require proof of *intent* to permanently alter the playing field (entrenchment), or is the *effect* of reduced accountability sufficient?
  **Why it is Upstream:** This addresses the "ordinary contestation" objection. Every governing party changes rules to facilitate its agenda. If the concept captures all rule changes that disadvantage the opposition, it becomes meaningless. The conceptual work must isolate the specific mechanism that turns "winning" into "locking in." This is crucial for the procedural/substantive divergence: a government may argue that weakening judicial review is a policy preference (substantive), not a power grab (procedural).
  **Tractability:** Medium. This requires legal theory and game theory. It is harder than Question 1 because intent is epistemically opaque. However, you can focus on *structural incentives* rather than psychological states (e.g., does the rule change make it statistically improbable for the opposition to ever regain power?).
  **Evidence to Shift Priority:**
  *   *Move Up:* If populist regimes successfully defend anti-democratic reforms in court by proving "democratic mandate" (procedural) despite "authoritarian effect" (substantive).
  *   *Move Down:* If comparative sociologists demonstrate that voters consistently punish parties that engage in entrenchment, making the distinction less urgent for stability.

  #### 3. The Authority Question: Who Holds the Diagnostic Key?
  **The Question:** In a system where the legislature and executive are captured, does the authority to declare "backsliding" reside with domestic courts, international bodies, or the electorate itself?
  **Why it is Upstream:** This addresses the "partisan epithet" charge. If the only entities labeling backsliding are political opponents or foreign NGOs, the label lacks domestic legitimacy. If the only entity is the judiciary, it risks accusations of elitism. This is downstream of Questions 1 and 2 because you must know *what* constitutes backsliding before deciding *who* identifies it. However, it is critical for application.
  **Tractability:** Low. This is deeply political and touches on sovereignty. Conceptual work can map the normative claims of each authority, but it cannot resolve the power struggle.
  **Evidence to Shift Priority:**
  *   *Move Up:* If domestic constitutional courts are systematically purged or ignored (as in Turkey or Hungary), rendering them null as diagnostic authorities.
  *   *Move Down:* If transnational networks of judges or election officials develop standardized, non-partisan metrics that gain public trust.

  ---

  ### Part II: Practical Implications for Practitioners

  If your working group successfully clarifies the questions above, specifically the tension between procedural legitimacy and substantive erosion, two major implications would change how practitioners operate in contexts like Hungary, Poland, Turkey, or the US.

  #### 1. The "Mandate Defense" Neutralization (For Journalists and Citizens)
  **Current Problem:** Leaders in Hungary and the US frequently defend institutional erosion by citing electoral victories or referenda. They argue: "We have a mandate to fix the courts." Journalists often treat this as a he-said-she-she debate, creating false equivalence.
  **Implication of Resolution:** If the Group establishes that *procedural victory does not license substantive erosion of checks*, journalists gain a conceptual tool to reject the "Mandate Defense."
  *   **Action:** Journalists would stop framing the issue as "Government vs. Opposition" and start framing it as "Governance vs. Entrenchment." The narrative shifts from "The Prime Minister wants to change the courts" to "The Prime Minister is altering the rules of re-entry."
  *   **Impact:** This reduces the partisan asymmetry charge. It allows critics to support the government's policy goals while opposing the *mechanism* of implementation. It gives citizens a vocabulary to oppose specific reforms without being labeled anti-democratic.

  #### 2. The "Judicial Dilemma" Protocol (For Judges)
  **Current Problem:** In Poland and the US, judges face a dilemma: strike down a popular law and be accused of undemocratic activism, or uphold it and enable backsliding. The lack of a clear threshold for "backsliding" leaves judges exposed.
  **Implication of Resolution:** If the Group clarifies the distinction between *policy disagreement* and *systemic entrenchment*, it provides a normative shield for judicial review.
  *   **Action:** Judges could adopt a standard where they defer to the legislature on substantive policy (tax, welfare, immigration) but apply strict scrutiny to procedural changes that affect future electoral competition or minority veto points.
  *   **Impact:** This decouples the "substantive" from the "procedural." A judge can say, "I do not care if this law is popular (substantive); I care that the process used to pass it prevents future repeal (procedural)." This protects the judiciary from the charge of elitism while preserving their role as guardians against backsliding.

  ---

  ### Part III: Defense of Ordering

  I have ordered these questions based on four criteria: **Importance**, **Tractability**, **Neglectedness**, and **Risk of Partisan Misuse**.

  **1. The Constitutive Question (Rank 1)**
  *   **Importance:** Critical. Without resolving whether democracy requires liberalism, the term "backsliding" has no referent.
  *   **Tractability:** High. This is the core competency of political theorists and constitutional lawyers. It is a philosophical problem, not a data problem.
  *   **Neglectedness:** High. Most literature assumes a definition rather than defending it against the "illiberal democracy" challenge.
  *   **Risk of Misuse:** Extreme. If unresolved, autocrats will continue to use "popular will" to justify rights violations. Resolving this removes their primary rhetorical shield.

  **2. The Intentionality Question (Rank 2)**
  *   **Importance:** High. This distinguishes pathology from politics.
  *   **Tractability:** Medium. Requires bridging legal theory and strategic analysis.
  *   **Neglectedness:** Medium. Much ink is spilled on "autocratization," but less on the specific threshold of intent vs. effect.
  *   **Risk of Misuse:** High. Without this, every legislative victory by the opposing party can be framed as "backsliding" by the losers, fueling polarization (particularly in the US).

  **3. The Authority Question (Rank 3)**
  *   **Importance:** Medium-High. It determines enforcement.
  *   **Tractability:** Low. This is often determined by power, not reason. A working group cannot legislate authority.
  *   **Neglectedness:** Low. Many scholars discuss the role of international organizations and courts.
  *   **Risk of Misuse:** Medium. While important, resolving this matters less if we don't first agree on *what* the authority is looking for (Questions 1 & 2).

  ### Final Recommendation

  Do not attempt to solve the Authority Question (Rank 3) first. It is a trap. If you define *who* decides before defining *what* they are deciding, you will produce a procedural solution to a normative problem.

  Focus your three-year programme on **Question 1 (The Constitutive Baseline)** and **Question 2 (The Entrenchment Threshold)**. If you can produce a rigorous framework that explains why a government can be democratically elected yet procedurally authoritarian, you will provide journalists, judges, and citizens with the vocabulary they currently lack. This will not stop backsliding on its own, but it will stop the concept of backsliding from backsliding into meaninglessness.
