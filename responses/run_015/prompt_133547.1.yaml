prompt: |-
  I have just spent the better part of an evening arguing with a close friend over whether ‘democratic backsliding’ remains a coherent analytical category or has collapsed into a partisan epithet. We kept returning to three issues: what counts as backsliding as distinct from ordinary democratic contestation; who has the authority to declare that a threshold has been crossed; and whether the concept can be rescued from the charge that it is applied asymmetrically across the political spectrum. Rather than asking for a survey of the literature, I want you to treat this as an agenda-setting problem. Suppose you are advising a small interdisciplinary working group — political theorists, constitutional lawyers, and comparative sociologists — with a three-year funding programme and no obligation to produce empirical case studies. They must decide which unresolved conceptual distinctions in the backsliding debate deserve clarification first, and which practical implications of those clarifications matter most for how journalists, judges, and citizens should apply the label. In particular, focus on the tension between procedural erosion (the manipulation of electoral rules and oversight institutions) and substantive erosion (the contraction of civil liberties and minority protections), and on the further complication that these two dimensions can diverge — for example, when a government expands direct democratic mechanisms while simultaneously weakening judicial review. Rank the open conceptual questions that arise from this divergence. For each, explain why it is upstream of others, how tractable it is for conceptual rather than empirical work, and what evidence over the next few years would move it up or down your list. Then identify the two or three implications that, if resolved, would genuinely change how practitioners distinguish backsliding from legitimate democratic change in contexts such as Hungary, Poland, Turkey, or the United States. Defend your ordering with explicit criteria — importance, tractability, neglectedness, and the risk that an unresolved question feeds partisan misuse — and avoid offering bibliographies or treating citation counts as evidence. I am interested in the reasoning, not a reading list.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** The user had a heated debate with a friend about "democratic backsliding" (is it a real concept or a partisan slur?).
      *   **Core Issues:** Distinction from ordinary contestation, authority to declare thresholds, asymmetry in application.
      *   **Task:** Act as an advisor to a small interdisciplinary working group (theorists, lawyers, sociologists) with 3-year funding, *no* obligation for empirical case studies (purely conceptual/normative work).
      *   **Focus:** Agenda-setting. Prioritize unresolved conceptual distinctions.
      *   **Specific Tension:** Procedural erosion (rules/institutions) vs. Substantive erosion (liberties/minorities), especially when they diverge (e.g., more direct democracy + less judicial review).
      *   **Output Requirements:**
          1.  Rank open conceptual questions arising from this divergence.
          2.  For each: Explain why it's upstream, tractability for conceptual work, evidence that would shift its priority.
          3.  Identify 2-3 practical implications for practitioners (journalists, judges, citizens) in specific contexts (Hungary, Poland, Turkey, US).
          4.  Defend ordering using criteria: Importance, Tractability, Neglectedness, Risk of Partisan Misuse.
          5.  **Constraint:** No bibliographies, no citation counts. Focus on reasoning.

  2.  **Deconstruct the Core Tension (Procedural vs. Substantive):**
      *   *Procedural:* Free elections, rule of law, institutional checks.
      *   *Substantive:* Rights, minority protections, equality.
      *   *The Divergence:* A government can claim a "popular mandate" (procedural legitimacy via elections/referenda) to dismantle checks and balances (procedural erosion) which then leads to rights violations (substantive erosion). Or, they can expand voting access (procedural gain) while gerrymandering (procedural loss) to achieve substantive ends.
      *   *The Hard Case:* "Illiberal Democracy." If the majority wills it procedurally, is it backsliding if rights are curtailed? If judges stop the majority to protect rights, is *that* backsliding (judicial overreach)?

  3.  **Drafting the Agenda (Ranking the Questions):**
      *   *Question 1: The Normative Baseline.* What is the *telos* of democracy here? Is it purely procedural (aggregation of will) or liberal-constitutional (constrained will)? This is the most upstream. If we don't agree on what democracy *is*, we can't define *back*sliding.
      *   *Question 2: The Threshold of Intent vs. Effect.* Is backsliding defined by the *aim* to entrench power (intent) or the *outcome* of reduced accountability (effect)? This addresses the "ordinary contestation" worry. Parties always want to win; when does it become systemic sabotage?
      *   *Question 3: The Authority Problem (Who Decides?).* Who gets to label it? International bodies? Domestic courts? The electorate? This addresses the "partisan epithet" charge.

      *Refining the Ranking based on Criteria:*
      *   *Importance:* Baseline is most important.
      *   *Tractability:* Conceptual work can handle Baseline well. Intent/Effect is harder but doable. Authority is very hard (political).
      *   *Neglectedness:* Baseline is often assumed. Intent/Effect is debated but rarely resolved. Authority is often ignored.
      *   *Risk of Misuse:* Ambiguity on Intent/Effect allows highest partisan misuse ("They are just governing" vs. "They are destroying democracy").

      *Let's reorder for maximum strategic impact for the Working Group:*
      1.  **The Constitutive Question:** Procedural vs. Substantive Primacy. (Upstream: Defines the object).
      2.  **The Causal/Intentional Question:** Systemic Entrenchment vs. Policy Disagreement. (Upstream: Distinguishes politics from pathology).
      3.  **The Epistemic/Authority Question:** Who diagnoses the pathology? (Downstream: Application).

  4.  **Developing the Implications for Practitioners:**
      *   *Journalists:* Need to know when to use the label without sounding partisan.
      *   *Judges:* Need to know when to strike down laws as anti-democratic vs. deferring to legislature.
      *   *Citizens:* Need to know when to mobilize vs. accept election results.
      *   *Selection:*
          1.  *Labeling Legitimacy:* When does a "reform" become "erosion"? (Addresses the Hungary/Poland "mandate" argument).
          2.  *Judicial Restraint vs. Activism:* When is a court defending democracy vs. obstructing the will? (Addresses the US/Poland judicial fights).

  5.  **Drafting the Content (Iterative refinement for tone and constraints):**
      *   *Tone:* Academic but pragmatic, advisory, decisive.
      *   *Constraint Check:* No citations. Focus on reasoning. Ensure the "Procedural vs. Substantive" divergence is central.
      *   *Specific Contexts:* Mention Hungary (Fidesz's legal revolution), Poland (Judicial reforms), Turkey (Executive presidency), US (Election rules/polarization).

  6.  **Refining the Argument on "Procedural vs. Substantive":**
      *   The prompt highlights the divergence: Direct democracy up, judicial review down.
      *   *Key Insight:* If we define democracy purely procedurally, this isn't backsliding. If we define it substantively, it is. The Working Group must resolve if "Democracy" includes "Liberalism" inherently.
      *   *Decision:* The Group should argue for a "Hybrid Threshold." Pure procedure is insufficient; pure substance is paternalistic.

  7.  **Finalizing the Ranking and Justification:**
      *   *Q1: The Definition of the 'Democratic Minimum'.* (Is liberal rights protection internal or external to democracy?)
      *   *Q2: The Distinction between 'Winning' and 'Entrenching'.* (When does electoral victory become a license to rewrite the rules of the game permanently?)
      *   *Q3: The Locus of Diagnostic Authority.* (Can a domestic majority vote itself out of democracy?)

      *Wait, I need to make sure I address the "Evidence" part for each question.* Since this is conceptual work, "evidence" means logical coherence, normative consensus, or perhaps *discursive* evidence (how the term is used). I should clarify that "evidence" here refers to shifts in normative consensus or legal precedent, not empirical data points.

  8.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the friend's debate, set the stage for the Working Group (WG).
      *   **Section 1: Ranked Conceptual Questions.** (3 Questions). For each: Upstream logic, Tractability, Evidence triggers.
      *   **Section 2: Practical Implications.** (2-3 Implications). Focus on Journalists/Judges/Citizens in specific countries.
      *   **Section 3: Defense of Ordering.** Use the 4 criteria (Importance, Tractability, Neglectedness, Risk).
      *   **Conclusion:** Brief wrap-up.

  9.  **Self-Correction/Review during drafting:**
      *   *Critique:* Did I focus enough on the divergence (direct democracy vs. judicial review)?
      *   *Fix:* Ensure Q1 explicitly tackles the "Illiberal Democracy" claim where procedure is heightened (referendums) but substance/checks are lowered.
      *   *Critique:* Is the "Evidence" section realistic for conceptual work?
      *   *Fix:* Frame evidence as "normative friction" or "legal rulings" that expose the conceptual gap, rather than statistical data.
      *   *Critique:* Did I avoid bibliographies?
      *   *Fix:* Double-check no names/dates of books are dropped.

  10. **Final Polish:** Ensure the voice is authoritative yet collaborative (advising a WG). Make sure the distinction between "ordinary contestation" and "backsliding" is clear in the implications. (Proceed to generate output).

  *(Self-Correction on "Evidence"):* The prompt asks "what evidence over the next few years would move it up or down your list." Since the WG is doing *conceptual* work, empirical evidence shouldn't drive the *concept*, but empirical *confusion* might. I need to frame this carefully. Evidence of *conceptual failure* in practice (e.g., courts unable to rule because the definition is muddy) is the right angle.

  *(Refining the Implications):* Make sure they are actionable. "Journalists should stop using the term when..." or "Judges should treat X as a higher threshold than Y."

  *(Final check on constraints):* No bibliography. No citation counts. Focus on reasoning. 3-year funding context. Interdisciplinary.

