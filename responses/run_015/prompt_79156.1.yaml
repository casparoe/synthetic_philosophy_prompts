  Here's where I've got to, correct me where I'm off. Newton spins a bucket, the water climbs up the sides. Once the water is spinning along with the bucket so there's no relative motion between water and bucket, the surface is still curved — so the rotation can't be relative to the bucket, so there must be something like absolute space for it to be relative to. Leibniz, and Mach later, say no, it's rotation relative to the rest of the matter in the universe. And I keep being told general relativity settled this in the relationist's favour, except it obviously didn't, because the metric field ends up being a thing in it's own right, and then in the modern version there's an argument where you take a region of spacetime and shuffle everything inside it around while leaving everything outside the same, and people disagree about whether that's one world or two. And then both sides seem to just re-run the same moves at each other.

  My hypothesis, and tell me if it's dumb: this has the same shape as two equivalent encodings of the same data — storing a global coordinate frame vs storing only pairwise distances, or the same repo state with a different commit hash. If every observable fact is identical, maybe the question of which one is really the world is just a question about what we chose to call the data structure, i.e. it's verbal. Or does something survive that analogy?

  Give me a diagnosis, not a history lesson. Is this a verbal dispute, a hidden factual or formal question doing the work, two different questions sharing one name, or bedrock intuitions neither side can argue for? Exactly five numbered items, one or two sentences each, no intro and no conclusion, and make the fifth one what, if anything, would actually count as progress here.
