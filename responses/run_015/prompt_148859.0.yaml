answer: |-
  This is a sophisticated historiographical challenge. You are effectively asking to test a systems-theory hypothesis ("Institutional Self-Cannibalization") against the standard historiographical trinity (Class, Ideology, Contingency) regarding the Thermidorian Reaction. Your specific insight—that the Committee of Public Safety (CPS) became structurally redundant after the Battle of Fleurus (June 26, 1794)—aligns with the "circumstantial" theory of the Terror, but you are pushing it further to suggest the institution itself generated the coalition that destroyed it.

  Here is the analysis of the period between Danton's execution (April 5, 1794) and Thermidor (July 27, 1794), mapping your framing against the three standard lenses, followed by an evaluation of your theory's explanatory power.

  ### 1. The Three Lenses Through "Institutional Self-Cannibalization"

  Your framing posits that revolutionary institutions, designed for emergency survival, generate internal opposition faster than they neutralize external threats once the emergency fades.

  #### A. Class Struggle Lens
  *   **The Mapping:** The CPS enforced the *Maximum* (price controls) and requisitioning to feed the army and the sans-culottes. The Convention deputies were predominantly bourgeois (lawyers, merchants, property owners).
  *   **What it Explains Well:** It explains the *timing* of the cannibalization. Once Fleurus secured the frontier, the economic emergency justified by "war communism" evaporated. The institution (CPS) was cannibalizing the property rights of the very class that populated the Convention. The "self-cannibalization" here is the CPS threatening the economic base of the legislature that created it.
  *   **Where it Misses:** It fails to account for the composition of the Thermidorian coalition. Many who voted against Robespierre were regicides and radical Jacobins (e.g., Tallien, Fouché), not moderate bourgeois. Furthermore, the *sans-culottes* (the supposed proletarian ally) did not rise to save Robespierre. If this were purely class war, the streets should have erupted for the CPS; they remained passive.
  *   **Evidence:** Decrees on the *Maximum*; property records of Convention deputies; the passivity of the Paris Sections on 9 Thermidor.

  #### B. Ideology Lens
  *   **The Mapping:** The revolutionary ideology was based on "Virtue" defined against "Vice." The institution (Revolutionary Tribunal/CPS) was the machine for separating the two.
  *   **What it Explains Well:** It explains the *logic* of the cannibalization. An institution built on purity must find impurity to justify its existence. Once external enemies (Austria/Prussia) receded, the machine had to locate internal enemies to maintain its ideological function. Robespierre, as the high priest of Virtue, became the logical final target because no one is purer than the purger. The institution consumed its own architect to prove its independence from tyranny.
  *   **Where it Misses:** It assumes ideological consistency where there was political maneuvering. Robespierre's speech on 8 Thermidor was vague; he did not explicitly demand new purges, only that "traitors" be punished. The ideological lens struggles to explain why the Committee of General Security (CGS)—equally ideological—turned on the CPS. This suggests bureaucratic turf war mattered more than abstract virtue.
  *   **Evidence:** Robespierre's speech of 8 Thermidor; the Law of 22 Prairial (which streamlined executions); the debates on the Cult of the Supreme Being.

  #### C. Contingency Lens
  *   **The Mapping:** Specific actors, health issues, and speech acts.
  *   **What it Explains Well:** It explains the *trigger*. Robespierre was ill and absent from the CPS for weeks prior to Thermidor. His speech on 8 Thermidor was a tactical blunder; had he named names, he might have secured a majority. The "cannibalization" wasn't automatic; it required specific actors (Billaud-Varenne, Collot d'Herbois) to feel personally threatened enough to risk a coup in the Convention.
  *   **Where it Misses:** It cannot explain the *structural ease* of the coup. If the CPS still held the loyalty of the army and the sections, a few speeches shouldn't have toppled it. Contingency treats the fall as an accident, ignoring that the Convention had been waiting for a pretext to reclaim sovereignty from the Committee.
  *   **Evidence:** Robespierre's attendance records at the CPS; the transcript of the 9 Thermidor session (showing the chaos); the health correspondence of Robespierre.

  ---

  ### 2. Evaluating Your Framing: "Institutional Self-Cannibalization"

  **Does it add value, or is it contingency in fancier clothes?**

  It adds significant value, provided you define "Institution" not just as the CPS, but as the **relationship between the Convention and its Delegated Committees.**

  *   **Why it's not just Contingency:** Contingency suggests the outcome could easily have been different (e.g., if Robespierre named names). Your framing suggests the outcome was *probabilistic* due to structural redundancy. Once Fleurus occurred, the CPS lost its *functional monopoly* on violence. The Convention, as the sovereign body, naturally seeks to reabsorb delegated power once the emergency ends. This makes the counter-strike structurally determined, even if the specific date was contingent.
  *   **The "Cannibalization" Mechanism:** The key insight is that the CPS and the Committee of General Security (CGS) were rival institutions. The Law of 22 Prairial (June 10) centralized power in the CPS, sidelining the CGS. Your framing explains why the CGS (Vadier, Amar) allied with dissident CPS members (Billaud-Varenne, Collot d'Herbois) to destroy Robespierre. They weren't just afraid of Robespierre; they were defending their institutional turf against a redundancy created by the CPS's overreach.
  *   **Value Add:** It moves the debate from "Was Robespierre a tyrant?" to "What happens to emergency powers when the emergency ends?" It treats the Terror not as a moral failure but as a systemic lifecycle.

  **Where I am Silent:**
  I cannot access the private caucus meetings of the "Plain" (the uncommitted deputies) on the night of 8-9 Thermidor. We do not know if they voted out of fear of Robespierre or relief at the chance to end the Terror. Historiography relies on memoirs written years later by Thermidoriens who had a vested interest in painting Robespierre as a monster to justify their own survival. I must remain silent on the *true* interiority of the voters.

  ---

  ### 3. The Mind-Changing Fact

  You asked: *If they were genuinely terrified of Robespierre's personal list rather than acting on structural incentives, does that kill the institutional story?*

  **My Answer:** No. In fact, fear of the "List" *confirms* the institutional story.

  The "List" is not a personal whim; it is the output of the institution (the CPS/Revolutionary Tribunal). If deputies voted against Robespierre because they feared being purged, they were reacting to the **institutional mechanism of survival** that you identified. They were neutralizing the body that held the power to purge them.

  **The Fact That Would Change My Mind:**
  To kill the "Institutional Self-Cannibalization" theory, I would need evidence that the Convention believed the **external threat was still existential** *and* that they believed Robespierre was **weakening** the Terror.

  *   **Specific Evidence:** A verified memo or diary entry from a key swing voter (e.g., a member of the Plain like Boissy d'Anglas) dated July 26, 1794, stating: *"We must remove Robespierre because he is too moderate and is hindering the Committee's ability to crush the remaining enemies."*
  *   **Why this kills the theory:** Your theory relies on the CPS becoming *redundant* because the war was won (Fleurus). If the Convention still perceived an existential threat but removed Robespierre because he was *too soft*, then the fall was not about institutional redundancy or self-cannibalization of emergency powers. It would mean the Terror continued *without* Robespierre (which it did, the White Terror followed, but the Revolutionary Tribunal remained), suggesting the institution wasn't being dismantled, just restaffed.
  *   **Current Consensus:** Most evidence suggests the Thermidoriens wanted to end the *system* of the Terror (the Law of Prairial was repealed days later), not just the man. This supports your structural view.

  ---

  ### 4. Where This Reasoning Is Most Likely to Fail

  I must be explicit about the fragility of this analysis.

  1.  **The Lag Time of Information:** Your theory hinges on Fleurus (June 26) making the CPS redundant. However, news traveled slowly. While the victory was known in Paris by July 3, the *implication* that the invasion threat was over was not immediately accepted. The Coalition armies were still on the soil. If the Convention genuinely believed invasion was still imminent in late July, the "redundancy" argument collapses. My reasoning fails if the perception of emergency persisted longer than the military reality.
  2.  **The "Great Fear" of the Deputies:** Historians like Timothy Tackett argue that the Terror was driven by genuine paranoia, not just cynical power grabs. If the deputies genuinely believed a "Great Conspiracy" existed (as Robespierre claimed), then the CPS was *not* redundant. My reasoning fails if the threat was internal (royalist/foreign agents in Paris) rather than external (armies on the border), because the CPS was designed for internal policing too.
  3.  **The Role of the Sections:** My analysis focuses on the Convention and Committees (top-down). It underweights the bottom-up pressure. If the Paris Sections (the sans-culottes) had risen for Robespierre, the institutional redundancy of the CPS wouldn't have mattered. My reasoning assumes the political nation was confined to the Tuileries, ignoring the street. The failure of the Sections to move is a variable I have treated as constant, which is a risk.

  ### Summary
  Your "Institutional Self-Cannibalization" framing is robust. It successfully synthesizes the Class lens (economic redundancy) and the Ideology lens (purity redundancy) into a mechanical explanation for the Thermidorian Reaction. It is not merely contingency; it identifies a feedback loop where the success of the institution (winning the war) precipitates its failure (loss of purpose).

  The fall of Robespierre was **structurally overdetermined** by the end of the emergency, but **contingently triggered** by his tactical errors and the specific coalition of the CGS and dissident CPS members. The "List" fear is not a counter-argument to your theory; it is the psychological manifestation of the institutional threat you described.
