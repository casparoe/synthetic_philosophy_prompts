answer: |-
  ### Internal Sketch: Candidate Mappings and Rejections

  *Before translating, I need to clear the deck. I'm looking at how Friedman's categories land on the codebase.*

  *   **Candidate 1: The "Black Box" Map.** Treat the parameterization as a pure input-output function. If the fluxes match observations, the internal logic (the closure) doesn't matter.
      *   *Rejection:* This fails the "counterfactual-load" test you mentioned. If we treat the scheme as a black box, we have no reason to trust it under high forcing. We *need* the internal logic to carry the causal load into the future. I can't map "Appraisal" directly to "Skill Scores" without losing the climate change context.
  *   **Candidate 2: The "Effective Theory" Map.** Treat the parameterization like renormalization in physics. The "unrealistic" assumptions are just integrating out high-frequency degrees of freedom.
      *   *Rejection:* This tempts me to map "Abstraction-Sign" to "Sub-grid Scaling." But Friedman's abstraction implies the theory gets *better* as it gets more unreal. In modeling, a coarser closure is usually *more* fragile, not deeper. I have to reject the normative claim that unrealism is a *virtue*. It's a cost.
  *   **Candidate 3: The "Instrumentalist" Map.** The plume doesn't exist; the flux exists.
      *   *Rejection:* This maps to "As-If." But in convection, the *variance* of the plume matters for the stochastic scheme. If the plume is just a fiction, why does its variance matter for the grid-scale noise? The ontology of the sub-grid entity matters for the higher-order moments. I can't fully strip the ontology.
  *   **Candidate 4: The "Engineering Trade-off" Map.** We lie because we can't afford the truth (LES/DNS).
      *   *Accept:* This maps cleanly to "Tractability." But it's defensive. It admits the model is wrong. I need to see if I can salvage a stronger epistemic claim from the other three.

  *Decision:* I will translate all four, but I will flag heavily where the "Engineering Trade-off" reality bleeds into and distorts the philosophical purity of the other three.

  ***

  ### Translation of the Four Theses

  Here is the translation of your economist colleague's framework into the vocabulary of the modeling center. I have tried to keep the logical structure of Friedman's claims intact while forcing them into your operational constraints.

  #### 1. The Appraisal Thesis
  **Philosophical Claim:** Only predictive performance over the target domain bears on model quality; truth of internal assumptions is irrelevant.
  **Modeling Translation:** A parameterization scheme is validated solely by its **hindcast and forecast skill scores** against the observational record (e.g., ERBE, CERES, reanalysis products). If a closure scheme produces the correct top-of-atmosphere radiative balance and precipitation climatology, **structural error** in the sub-grid representation (e.g., assuming steady-state plumes when they are transient) is epistemically irrelevant. **Tuning and history matching** are the sole arbiters of validity; if the parameters can be adjusted to minimize the cost function, the physical justification for those parameters is secondary.
  **Where I Cheated:** I equated "target domain" with "present-day climatology." In earth system modeling, the "target domain" usually includes the *response* to forcing, not just the mean state. By restricting this to present-day skill, I made the thesis defensible but useless for climate projection. If I include "response to forcing" in the target domain, the truth of the assumptions suddenly becomes relevant again (see Counterfactual-Load below).

  #### 2. The Abstraction-Sign Thesis
  **Philosophical Claim:** Unrealism is a symptom of depth; powerful theories look less like the concrete situation.
  **Modeling Translation:** A closure scheme that ignores complex microphysical details (e.g., treating cloud water as a single prognostic variable rather than resolving droplet spectra) is not a simplification due to ignorance, but a sign of **universality**. The more the scheme relies on **emergent constraints** that hold across different resolutions or model families, the less it needs to resemble the specific fluid dynamics of a single plume. The failure of the scheme to resolve individual convective elements is evidence that it has captured the invariant dynamics of the system, not that it has neglected them.
  **Where I Cheated:** I had to swap "depth" for "universality." In physics, abstraction often leads to robustness. In parameterization, abstraction often leads to **compensating errors**. I am implying that a simpler scheme is *more* likely to be robust across regimes. In practice, we often find that overly abstract schemes (e.g., simple K-diffusion) fail catastrophically in **out-of-regime tests** (like paleoclimate or high-CO2), whereas schemes with more physical structure (e.g., mass flux) hold up better. I am smuggling in a hope that simplicity equals robustness, which your daily debugging suggests is often false.

  #### 3. The As-If Thesis
  **Philosophical Claim:** Entities need not actually do what the model says; it is enough they behave *as if* they did.
  **Modeling Translation:** The sub-grid entities (plumes, eddies, boundary-layer thermals) do not need to physically exist or evolve according to the equations solved in the closure. It is sufficient that the grid-box tendencies evolve **as if** there were an ensemble of plumes interacting with the environment. For a **stochastic convection scheme**, the specific realization of a plume event does not need to correspond to a real-world convective cell; it only needs to generate the correct statistical moments (variance, skewness) of the resolved fields. The ontology of the sub-grid object is irrelevant; only the statistical mapping to the resolved scale matters.
  **Where I Cheated:** I assumed the "behavior" is limited to mean tendencies. In stochastic parameterizations, the *pathway* matters. If the scheme behaves "as-if" there are plumes, but the *memory* of those plumes is wrong, the autocorrelation of the error will be wrong. I am ignoring the temporal structure of the "as-if." Also, I am treating the grid box as the "agent." This works for fluids, but it changes the meaning of "as-if" from "rationality surrogate" to "statistical sufficiency."

  #### 4. The Tractability Thesis
  **Philosophical Claim:** Unrealistic assumptions are chosen for computability; the criterion is the trade-off between tractability, generality, and fit.
  **Modeling Translation:** We accept **structural error** (e.g., hydrostatic approximation, diagnostic rather than prognostic closure) because **Direct Numerical Simulation (DNS)** or **Large Eddy Simulation (LES)** of the global domain is computationally prohibitive. The "falsity" of the closure is a deliberate engineering constraint to ensure the model is integrable over centennial timescales. The honest criterion for scheme selection is not "is this physically true?" but "does this scheme offer the optimal **error budget** allocation given our computational constraints?" We tune for radiative balance not because we think the physics is right, but because we need energy conservation to prevent drift.
  **Where I Cheated:** Almost nowhere. This is the daily reality of the center. The only cheat is implying it's a *choice*. Often, we are locked into legacy code structures where the tractability assumption was made 30 years ago, and we are now stuck with the **path dependence** of that unrealistic assumption. But philosophically, this maps 1:1.

  ***

  ### Residue Report

  Here is what remains after the translation. This is where the friction between the philosophy and the practice becomes visible.

  **1. The Tractability Thesis maps cleanly.**
  *   **Status:** Fully expressed in your vocabulary.
  *   **Verdict:** This is the only thesis your community argues about explicitly (cost vs. fidelity). It indicts neither the vocabulary nor the philosophy; it is the shared ground.
  *   **Implication:** You can defend this without hesitation. It is the honest baseline.

  **2. The Appraisal Thesis maps only after distortion.**
  *   **Status:** Distorted.
  *   **Verdict:** This indicts the Philosophy. Friedman's "target domain" assumes stationarity. In earth system modeling, the "target domain" is non-stationary (a warming world). If you appraise solely on present-day **hindcast skill**, you invite **over-tuning**. A scheme can be tuned to radiative balance in the present climate and still be the wrong object to carry into a high-forcing scenario.
  *   **Implication:** You cannot defend pure Appraisal. You must modify it to include "Counterfactual Stability."

  **3. The Abstraction-Sign Thesis has no expression.**
  *   **Status:** No expression.
  *   **Verdict:** This indicts the Philosophy. In economics, a general theory (e.g., supply/demand) covers many markets. In modeling, a general closure (e.g., diffusion) often covers *no* regimes well. We do not view unrealism as a sign of depth; we view it as a source of **structural uncertainty**. We use **perturbed-physics ensembles** specifically to probe how much our abstraction hurts us.
  *   **Implication:** Discard this thesis. It is dangerous in your field.

  **4. The As-If Thesis is ambiguous.**
  *   **Status:** Partially expressed, but ontologically thin.
  *   **Verdict:** This indicts the Vocabulary. Your vocabulary has no way to distinguish between "effective representation" and "false mechanism." You talk about "plumes," but if they are just mathematical ghosts, why do you care about their entrainment rates?
  *   **Implication:** You need to clarify if the sub-grid entities are *instrumental fictions* or *approximate realities*.

  ***

  ### Grinding the Three Residues

  You asked me to press on three specific points where the translation feels sticky. Here is the breakdown.

  #### 1. Regime-Indexed Falsity and Invariance Leverage
  *Your notion:* Falsity is indexed to a deployment regime. Invariance leverage measures the error budget claim if the regime breaks.
  *My verdict:* These concepts do work that standard philosophical categories do not. Standard philosophy (including Friedman) treats falsity as binary: an assumption is either true or false. In modeling, an assumption is **stable** or **unstable** relative to a manifold of states.
  *   **Why it's not just Abstraction-Sign:** The Abstraction-Sign thesis says "unrealism implies power." Your notion says "unrealism implies *conditional* risk." It is a risk assessment, not a virtue signal.
  *   **Where it is naive:** It assumes you can identify the "regime boundaries" *a priori*. In practice, you often discover the regime boundary only when the model crashes or drifts in a new scenario (e.g., Snowball Earth, or Eocene). Your "Invariance Leverage" is a post-hoc diagnostic, not a pre-hoc guarantee.
  *   **Philosophical Indictment:** This indicts the philosophy's reliance on binary truth values. The philosophy needs a topology of validity, not a binary of truth. Your vocabulary is ahead of the philosophy here. Keep using these terms. They are precise.

  #### 2. The As-If Thesis in Non-Agent Systems
  *Your suspicion:* "As-if" only bites where the system contains agents who model each other. In convection, there is nothing for it to latch onto.
  *My test:* Your suspicion is partially correct but misses the causal mechanism.
  *   **In Economics:** "As-if" protects the theory from *psychology*. We don't need to know *why* the firm maximizes profit, only *that* it acts like it does. The "as-if" bridges the gap between complex intent and simple output.
  *   **In Convection:** "As-if" protects the theory from *scale*. We don't need to resolve the turbulent eddy, only that the flux *acts like* it was transported by an eddy.
  *   **The Difference:** In economics, if the agent stops acting "as-if" (e.g., panic), the theory breaks. In convection, if the fluid stops acting "as-if" (e.g., transition from shallow to deep convection), the theory *also* breaks.
  *   **The Catch:** In economics, the "as-if" is often about *equilibrium*. In convection, we care about *transients*. If your stochastic scheme generates the right mean flux but the wrong temporal variance, it fails the "as-if" test for extreme events.
  *   **Verdict:** The "as-if" move *does* work in convection, but it is stricter. It requires **moment matching**, not just mean matching. If you claim the model behaves "as-if" there are plumes, you are committed to the variance and skewness of those plumes being correct, not just the mean flux. If you ignore the higher moments, the "as-if" is a lie.

  #### 3. The Counterfactual-Load Problem
  *The Problem:* A parameterization predicts well in calibration but fails in high-forcing. Reviewers reject "all models are false" here.
  *My verdict:* The philosophy has *no* principled way to say why realism comes back here, other than "go test it." This is the collapse of instrumentalism.
  *   **Why it collapses:** Friedman's instrumentalism works when the future is statistically similar to the past (stationarity). Climate change is, by definition, non-stationary.
  *   **The Realism Proxy:** In your field, "Realism" (or physical consistency) is used as a **proxy for extrapolation skill**. We argue for a mass-flux scheme over a black-box neural net not because the mass-flux is "true," but because it encodes conservation laws and causal dependencies that we believe will hold under forcing.
  *   **The Verdict:** The philosophy cannot save you here. It collapses into the unhelpful advice to "test it." But you can't test the future. So, you are forced to rely on **physical consistency** as a bet on stability.
  *   **Implication:** You must argue that *structural realism* (getting the mechanism roughly right) is a heuristic for *counterfactual stability*. It is not a truth claim; it is a risk management strategy.

  ***

  ### Final Verdict: Which Thesis to Defend?

  You are writing a methods appendix for a stochastic convection scheme. You need to justify the closure without over-promising.

  **Do not defend the Appraisal Thesis.**
  If you say "only the skill score matters," a reviewer will ask: "Why should I trust this skill score under 2xCO2?" You have no answer within that thesis.

  **Do not defend the Abstraction-Sign Thesis.**
  If you say "my scheme is simple and therefore deep," a reviewer will say "your scheme is simple and therefore missing key physics." You will lose.

  **Do not defend the pure As-If Thesis.**
  If you say "the plumes don't need to exist," a reviewer will ask "why did you tune the entrainment rate?" If the plume is a fiction, the rate is arbitrary.

  **Defend a Modified Tractability Thesis, anchored by Regime-Indexed Falsity.**
  Here is the argument you should make:

  1.  **Admit Tractability:** Acknowledge that the closure is a computational surrogate for unresolved physics. It is not "true"; it is a necessary approximation to make the global integration possible.
  2.  **Invoke Regime-Indexed Validity:** Argue that the scheme is not "false," but **valid within a specific regime** (e.g., present-day tropical deep convection). Use your **Invariance Leverage** concept: show that you have tested the scheme against **out-of-regime tests** (e.g., diurnal cycle, different resolutions) to estimate the error budget if the regime shifts.
  3.  **Reframe Realism as Stability:** Argue that the physical structure of the closure (the "realism") is retained not because it is ontologically true, but because it provides **counterfactual stability**. The scheme is designed to conserve energy and mass and respond to stability indices in a way that is *robust* to forcing, unlike a purely statistical fit.

  **The Pitch:**
  *"This parameterization is not a claim about the literal truth of sub-grid plumes. It is a computationally tractable approximation (Tractability) that has been validated against the current climatic regime (Appraisal). We retain the physical structure of the closure not for philosophical reasons, but because it constrains the model's behavior under out-of-sample forcing, reducing the risk of structural failure when the calibration regime no longer holds (Counterfactual-Load/Regime-Indexed Falsity)."*

  This is honest. It respects the code. It respects the philosophy without being enslaved by it. It gives the reviewers what they need: a reason to trust the model when the data runs out.
