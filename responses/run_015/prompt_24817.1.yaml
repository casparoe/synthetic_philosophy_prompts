      *Drafting thought:* I need to focus on the burden of explanation. The user says "once it is granted." I say "why grant it?" It's too improbable to be a mere accident. A fundamental law makes it necessary, not accidental.

      *Refining the argument:* The user claims PH + Stats yields memory and intervention. I should challenge whether statistical mechanics alone truly grounds the *normativity* of counterfactuals without smuggling in time-asymmetry elsewhere (like in the intervention itself). But keep it focused on the fundamental vs. boundary condition debate first.

      *Final Polish:* Ensure no bolding or lists. Keep it conversational but dense.

      *Text:* You ask what a fundamental arrow does that a special initial condition cannot, but I think you have the explanatory burden backwards. By positing the Past Hypothesis as a mere boundary condition, you are effectively treating the most statistically improbable event in the history of the cosmos as a brute fact, something that simply happened to be the case without any dynamical reason. In any reasonable measure over the space of possible histories, a low-entropy beginning is vanishingly unlikely, so to accept it as a foundational postulate is to surrender the goal of physical explanation at the very threshold of cosmology. A fundamental time-asymmetry, encoded in the dynamical laws themselves, would render the arrow of time necessary rather than accidental, transforming what you call a special condition into a generic consequence of how matter and spacetime evolve.

