  I read your swap as replacing the dynamic transformation function with a static memory retrieval for every actualized input vector. You're assuming that because the outputs match, the causal history matches, but you've shifted the causal burden to the past. The lookup table doesn't compute the answer; it retrieves a fossilized decision made when the table was built. The moral weight attaches to the moment of computation, the actual grinding of gears that resolves input into output. By swapping in the table, you haven't changed the future, but you've emptied the present of any causal work.

  It isn't prejudice against hardware that isn't straining; it's about where the agency resides. If I record your voice saying "I am in pain" and play it back, the recording isn't suffering. The difference isn't what happens next, but what is happening now. The original layer is doing the work of being a mind; the table is just a mirror reflecting work done elsewhere. Moral status requires the system to be the source of the causation, not the storage medium for someone else's.

