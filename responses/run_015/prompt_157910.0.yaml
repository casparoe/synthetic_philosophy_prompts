          *   *Refinement:* Focus on the "exercise of power" aspect. Can you exercise a power under coercion?

      *   *Q8: Falsifiability.*
          *   *Case:* What would change your mind?
          *   *Likely Reply:* (Potentially) "If reliance showed X..."
