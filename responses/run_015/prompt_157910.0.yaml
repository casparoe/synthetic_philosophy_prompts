answer: |-
  Here are ten questions designed to corner the normative-power account. They are ordered to start with intuitive puzzles and escalate to structural problems with the theory.

  Each question includes the **Setup** (to send in advance) and a **Follow-Up** (for you to keep in your back pocket). The follow-ups are specifically engineered to intercept his standard move ("That's a story about utility, not obligation") by forcing him to explain what work the "obligation" is doing if it is detached from all practical consequences.

  ### 1. The Gratuitous Promise
  **Setup:** I promise to meet you for coffee. I was already planning to go, and you know I was going to go. My promise changes nothing about my intentions or your expectations. If I don't show up, you aren't disappointed because you assumed I'd come anyway. On your view, have I wronged you? If so, what is the content of that wrong?
  **Follow-Up:** If you say "Yes, I broke my word," I'll ask: If the promise changed no expectations, created no reliance, and altered no outcomes, in what sense did the normative landscape actually *change*? If the only difference is a metaphysical debt that has no traction on reasons or feelings, aren't you describing a magic spell rather than a moral obligation?

  ### 2. The Forgotten Promise
  **Setup:** I promise to visit you in the hospital. You then suffer an injury that erases your memory of the promise, though not our friendship. You have no expectation of the visit. On the normative-power view, only the promisee can release the promisor. Since you cannot release me (you've forgotten), am I bound forever?
  **Follow-Up:** If you say "Yes, bound forever," that seems absurdly rigid. If you say "No, you can release yourself," doesn't that collapse the directed duty? If I can unilaterally dissolve the obligation I owe *to you*, then the power wasn't really transferred to you, was it?

  ### 3. The Joint Promisees
  **Setup:** I promise two colleagues, Alice and Bob, that I will finish a shared report. Alice later tells me, "I release you from the promise." Bob says, "I do not." Is my obligation halved, extinguished, or fully intact?
  **Follow-Up:** If you say "Fully intact" (because Bob still holds the string), then Alice's release was meaningless, which undermines her status as a promisee. If you say "Halved," what does it mean to owe half a performance? Does this suggest the duty isn't really about a normative bond between persons, but about a quantifiable unit of work?

  ### 4. The Tipping Point (Bad Content)
  **Setup:** I promise to help you move a couch. It turns out doing so will make me mildly late for a meeting that matters slightly more than your move. Most accounts say the promise adds weight but doesn't override the greater good. Can you give me a case where the promise *actually* tips the scale? A case where I should do the promised thing *only* because I promised, even if it produces slightly worse overall outcomes?
  **Follow-Up:** If you can't provide such a case, isn't the "normative power" inert? If the promise never changes what I most have reason to do all-things-considered, then calling it a "power to change what I owe" seems like a description of a feeling, not a moral reality.

  ### 5. The Incompetent Promisee
  **Setup:** I promise my three-year-old nephew I will buy him a toy. He lacks the capacity to understand normative powers or hold me to account. If I don't buy it, have I wronged *him*? If yes, how did he exercise the power to bind me if he doesn't understand the mechanism?
  **Follow-Up:** If you say "He can't be a promisee," then I've done nothing wrong by disappointing him. But surely I have? If the wrong exists without his capacity to exercise the power, doesn't that show the obligation comes from *my* integrity or his vulnerability, not from a normative transaction between us?

  ### 6. Promises to the Dead
  **Setup:** I promise my dying friend I will scatter his ashes in a specific river. He dies. He no longer exists to hold claims or release me. On your view, does the duty survive? If so, who holds the correlating right?
  **Follow-Up:** If you say "The duty survives but no one holds the right," you've severed the directed-duty link central to your view. If you say "The heirs hold the right," what if the heirs don't care? Am I still bound to a dead man's wish against the living's indifference? At what point does "honoring the dead" become distinct from "keeping a promise"?

  ### 7. The Overhearer
  **Setup:** I promise Alice I will drive her to the airport. Bob overhears this, relies on it to schedule a meeting near the airport, and is ruined when I don't show. Alice doesn't care; she takes an Uber. Bob is furious. Does Bob have standing to complain?
  **Follow-Up:** If you say "No, only Alice does," we have a situation where the person harmed has no standing, and the person with standing is unharmed. Isn't this proof that the moral force of promising is actually about *induced reliance*, and your "normative power" is just a ritual that signals when reliance is likely?

  ### 8. Third-Party Duress
  **Setup:** A third party threatens to harm my family unless I promise *you* to pay you money. You are innocent; you don't know about the threat. I make the promise. Is it binding?
  **Follow-Up:** If you say "Yes, because you are innocent," then the "exercise of power" wasn't voluntary, so how was it a valid exercise of a normative power? If you say "No, it's void," then you are punishing me (the victim) to protect the practice, rather than protecting the normative bond. Which is it?

  ### 9. The Trivial Promise
  **Setup:** I say "I promise" I will flip this coin heads. I flip tails. Have I committed a moral wrong? If not, where is the threshold for when the normative power engages?
  **Follow-Up:** If you say "Yes, it's a wrong," your view seems disconnected from moral seriousness. If you say "No, it's too trivial," then the normative power isn't triggered by the speech act alone, but by the *importance* of the act. Doesn't that mean the moral weight comes from the content, not the promise itself?

  ### 10. Falsifiability
  **Setup:** Finally, Dr. Adeyemi, I want to ask about the structure of your argument. You often respond to reliance-based objections by saying, "That explains the practice's utility, not the obligation's source." What empirical or intuitive evidence would actually count against the normative-power account?
  **Follow-Up:** (If he dodges again): If every counter-example involving harm, reliance, or utility is dismissed as "category error," are we left with a theory that is unfalsifiable? If the "obligation" is undetectable except by the intuition it's meant to explain, aren't we just re-labelling the mystery rather than solving it?

  ***

  ### Host Notes: How to Handle "The Move"
  Dr. Adeyemi's standard defense is to bifurcate **Justification of Practice** (why we have promises) from **Source of Obligation** (why I am bound).

  *   **When he makes this move:** He will say something like, "You're asking why the institution is useful. I'm telling you that *given* the institution exists, this is how the obligation functions."
  *   **Your Counter:** Don't let him retreat to the "institution." Press the **Metaphysical Queerness**.
      *   *Script:* "I'm not asking about the institution. I'm asking about *this* interaction. If I promise a toddler, or a dead man, or in a case where no one relies, and you say I'm still bound... where is the binding *happening*? If it's not in their expectations, and not in the social utility, is it just in your head? If it's just in your head, why call it a 'directed duty' to *them*?"
  *   **The Goal:** Force him to admit that either (a) the "power" is a metaphor for our intuition about reliance/harm, or (b) he believes in a moral reality that is completely detached from human welfare. Both are difficult positions to hold in a casual podcast setting.
