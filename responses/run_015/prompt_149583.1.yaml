      *   **Conclusion:** Judgment on the residue (Framework defect vs. Philosophical imprecision).

  8.  **Refining the Vocabulary (Self-Correction during drafting):**
      *   *Correction:* Avoid saying "Control Parameter = Moral Weight." The prompt explicitly forbids treating "should" as a control variable.
      *   *Correction:* Instead, treat Moral Status as an *external labeling function* applied to the system's trajectory.
      *   *Refinement:* Use terms like "order parameter," "symmetry breaking," "ergodicity," "basin depth."
      *   *Key Insight:* Dynamical systems describe *behavior* and *stability*. Morality describes *constraints on interference*. The translation must highlight that DS describes the *object*, while Morality describes the *observer's constraint*.

  9.  **Final Review against Constraints:**
      *   Did I use DS vocabulary? Yes.
      *   Did I cover all three views? Yes.
      *   Did I identify clean translations, smuggling, and missing expressions? Yes.
      *   Did I avoid making "should" a control variable? Yes, I will frame it as an external mapping.
      *   Did I conclude on the residue? Yes.

  10. **Final Polish:** Ensure tone is rigorous and respects the user's expertise. (e.g., use "Lyapunov stability" correctly, distinguish between state-space and parameter-space).

  *(Self-Correction on the Conclusion)*: The prompt asks for a judgment: Is the residue a defect of the DS framework or a sign that the original positions were imprecise?
  *Argument:* It's likely that the philosophical positions *claim* precision they don't have. They treat "status" as a natural kind (like mass) when it might be a relational property. DS exposes this by showing there is no natural "status variable" in the equations of motion. So, the residue reveals philosophical imprecision (reification of normativity).

