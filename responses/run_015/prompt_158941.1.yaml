  **Decision: Rejection**

  **Closest Analog: Problematic News Monitoring**
  While *Compulsive Gaming* shares the features of being markerless and having a near-universal mild form, the *News Monitoring* precedent is the closer analog for decision-making. Both *News Monitoring* and *Persistent Sensory Intolerance* (PSI) are characterized by rapid, media-driven proliferation of symptoms ("symptom-checker sites" and "short-form video" vs. reported impairment without markers), a lack of proven treatment, and a high risk of recruiting the "worried well." The *Gaming* decision relied on a "decade of clinics" establishing a settled kind; PSI's "tripled referrals in five years" indicates volatility, not settlement, aligning it with the *News* rejection and the cautionary tale of *Fugue*.

  **The Rules We Have Been Running (and Where They Come Apart)**
  Our committee has operated on four implicit rules that are now in tension:
  1.  **The Stability Rule:** Record kinds only when prevalence has settled (Bereavement: "no longer climbing"; Gaming: "decade of clinics"). *Conflict:* PSI is climbing rapidly.
  2.  **The Utility Rule:** Add codes that unlock necessary treatment or reimbursement (Bereavement: "no treatment reimbursed"; Gaming: clinics existed). *Conflict:* PSI accommodations are available via general disability; treatment evidence is weak.
  3.  **The Deference Rule:** Honor patient organization wishes (Bereavement/PMS: added due to campaigning). *Conflict:* PSI has lobbying *for* inclusion but organized neurodivergent opposition *against* it (mirroring the Autism drop where "attachment to a label is no reason").
  4.  **The Looping Rule:** Avoid categories that create their own prevalence (Fugue caution; News: "research listing would recruit the worried well"). *Conflict:* PSI is explicitly driven by self-diagnosis via social media.

  On this case, Rules 1, 2, and 4 point to **Rejection**, while a loose interpretation of the *Gaming* precedent (clinical reality) points to Inclusion. The *Gaming* precedent is distinguished by *time*: a decade of organic clinical observation versus five years of viral spread. To be consistent with our *Stability* and *Looping* rules, we must reject.

  **Principles Committed to by Each Decision**
  *   **Full Inclusion:** Commits us to the principle that **social reality constitutes clinical validity.** It asserts that if patients and clinicians behave *as if* a kind exists (referrals, communities), the manual must record it, even if prevalence is volatile and etiology is unclear. This prioritizes the *Gaming* precedent over the *Fugue* caution.
  *   **Research Listing:** Commits us to the principle of **epistemic humility.** It acknowledges the phenomenon without validating it, allowing study while buffering against looping effects. However, this contradicts the *News Monitoring* precedent, where we ruled that even a research listing risks iatrogenesis ("recruit the worried well").
  *   **Rejection:** Commits us to the principle of **iatrogenic precaution.** It prioritizes the stability of the classification system and the protection of the "worried well" over immediate clinical demand or commercial research needs. It asserts that a diagnostic code is a hypothesis of a natural kind, not merely a billing key or a social badge.

  **The One Further Proposal**
  To best tell the rules apart—specifically to distinguish whether we are blocking science or blocking billing—we should propose: **Decouple trial recruitment from diagnostic coding.**

  The industry argues the sham-controlled trial "will recruit only if a billable code exists." If we propose funding the trial via a research grant that allows recruitment based on the *draft criteria* without a permanent diagnostic code, we test the **Utility Rule**. If the trial proceeds, it proves the code was needed for science (supporting a future Research Listing). If the industry refuses, it proves the code was needed for billing/reimbursement (supporting Rejection, as accommodations already exist via general disability). This isolates the commercial looping effect from the clinical need for evidence.
