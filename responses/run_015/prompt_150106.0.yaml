  1. Conceptual Frame
  Think of guilt as a private ledger. When you wrong someone, you owe them a specific debt. You can pay it back, apologize, and the ledger balances. The transaction ends. Shame is different. It is a public map. When you wrong someone, your position on the map shifts. Everyone sees you differently. You cannot simply pay a fee to move back; the mark remains in their eyes. The paradox arises when a culture wants guilt without shame. It requires you to acknowledge the debt to pay it, but acknowledgment makes the debt visible. If you hide the debt to stay safe, you cannot pay it. If you reveal it to pay it, you are marked. This activity forces participants into that trap. They will try to build a system of clean repayment, only to find that the act of settlement itself alters their standing. The institution collapses because it demands visibility for resolution but punishment for visibility.

  2. Setup and Materials
  Arrange sixteen chairs in a tight circle. In the center, place a bowl of white tokens (Standing) and a deck of Red Cards (Transgressions). Each participant starts with five white tokens. No money changes hands; tokens determine speaking order and access to refreshments later, creating social stakes. You need a screen or divider to create a "Private Booth" zone where two people can speak unseen by the rest. Prepare a scorecard for each participant to track their own debts privately. The facilitator holds a master ledger. The key material is the "Settlement Slip." To clear a Red Card, a participant must file this slip. Crucially, filing requires standing up and placing the slip in the central bowl, making the act of repayment visible to the circle, even if the specific debt remains unnamed. This physicalizes the visibility risk. The booth allows private negotiation, but the bowl demands public acknowledgment.

  3. Rules and Flow
  **Minutes 0-10:** Distribute Red Cards randomly; each person holds one debt owed to another specific participant. They must negotiate repayment in the Private Booth. Repayment requires transferring one white token to the victim. This simulates the private ledger.
  **Minutes 10-25:** The Settlement Phase. To finalize the transfer and clear the debt, the payer must stand and deposit a Settlement Slip into the central bowl. Rule: If a debt is not cleared by Minute 25, both parties lose two tokens. This forces acknowledgment.
  **Minutes 25-35:** The Consequence. Count the slips aloud. For every slip deposited, the payer loses one additional token from their standing (the "Mark"). Participants realize that settling the debt (guilt) reduces their standing (shame). The group sees who paid.
  **Minutes 35-45:** Second Round. Remove the penalty. Watch if they hide debts. If they hide debts to save standing, the facilitator audits private ledgers. Unreported debts invalidate the token transfer, leaving the debt unresolved. They must choose: pay and be marked, or hide and remain in debt. The system jams. Those who hide cannot claim moral clearance. Those who pay lose status. The facilitator invalidates whisper settlements, insisting on the slip. When they try to hide, the audit reveals the rot. The tension peaks when participants realize their attempt to be "good" makes them "low status," while protecting status makes them "indebted." The clock prevents complex collusion. Participants will argue the rules are unfair; this frustration is the data.

  4. Debrief and Mapping
  Gather the group. Ask those who paid how it felt to stand. Ask those who hid why they stayed seated. Map the white tokens to the private ledger: specific, transferable, clearable. Map the central bowl to the public map: visibility alters position regardless of intent. Highlight the collapse: To clear the ledger, you had to update the map. To protect the map, you had to falsify the ledger.
  Explain that a culture choosing guilt over shame tries to keep the bowl empty while balancing the tokens. It fails because repayment requires witness. If no one sees you pay, did you pay? If everyone sees you pay, are you still the same person? The instability is not a bug; it is the structure. You cannot vote for a private conscience in a public room. The debrief must name the paradox: the mechanism of guilt (acknowledgment) is the mechanism of shame (visibility). Trying to separate them breaks the machine. Emphasize that the tokens lost in round two were the price of the map redrawing. The participants wanted the ledger cleared without the map changing. The activity shows this is geometrically impossible in a shared space. This demonstrates why the institution you proposed is inherently unstable. It demands a separation of space that human interaction does not allow.

  5. Predictable Failures and Limits
  Participants will likely collude to hide slips or treat tokens as a game, laughing off the stakes. Recover by tightening the audit rules and emphasizing the loss of privilege (refreshments/speaking). The simulation cannot reproduce the visceral heat of shame—the flushed face, the urge to flee. Tokens are cold; shame is embodied. The facilitator must supply this by narrating the social shift. When someone stands, pause the room. Make them wait. Describe the shift in attention. Without this embodied weight, the activity remains a logic puzzle. You must remind them that in real life, the map redraws itself instantly, without slips. The involuntary nature of shame means you cannot choose to feel only guilt. The activity simulates the structure, but you must voice the feeling.
