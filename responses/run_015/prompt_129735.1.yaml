answer: |-
  **Exam Question**

  **Course:** Early Modern Political Thought  
  **Time Allowed:** 75 Minutes  
  **Instructions:** Answer the following question in essay form. Do not summarize Chapter 25 of *The Prince*; instead, construct an original argument.

  **Question:**  
  Machiavelli famously pairs *virtù* with *fortuna*, yet the coherence of this relationship depends on how one defines the nature of contingency. Distinguish between *fortuna* as sudden, event-like misfortune and *fortuna* as deep structural contingency (e.g., institutional path dependence, demographic drift, or ecological pressure). Argue whether *virtù* is a dispositional trait existing independently of these constraints or whether it is constituted only through the successful navigation of them. Furthermore, assess Machiavelli's gendered metaphor of Fortune as a woman who yields to bold aggression. Does this image imply a theory of agency based on direct domination that becomes incoherent when faced with structural rather than evental *fortuna*? Conclude by judging whether *virtù* collapses into mere reactive improvisation if the structural view of *fortuna* is accepted.

  ***

  **Model Answer**

  The coherence of Machiavelli's political theory rests on the tension between *virtù* and *fortuna*. To evaluate this, one must distinguish between two modes of contingency. First, there is evental *fortuna*: sudden floods, unexpected deaths, or battlefield luck. Second, there is structural *fortuna*: the slow-moving constraints of institutional history, demographic shifts, or ecological limits that define the arena before the prince acts. If *fortuna* is merely evental, *virtù* can be understood as a dispositional trait—a reservoir of skill waiting to be deployed. However, if *fortuna* is structural, *virtù* cannot exist independently; it is constituted only in the successful navigation of those constraints.

  Machiavelli often treats *fortuna* as a river that floods unpredictably. In this evental view, *virtù* is the construction of dykes and dams beforehand. Here, *virtù* is separable from *fortuna*; it is a capacity possessed by the agent regardless of the storm. Yet, when considering structural contingency, such as the entrenched habits of a republic or the economic decay of a province, the arena itself is shaped by forces no single actor can fully anticipate or dam. In this context, *virtù* loses its status as an independent disposition. It becomes relational, defined entirely by its fit with the specific structural moment. A prince possessing great *virtù* in one structural context may fail utterly in another, not because their skill diminished, but because the structural *fortuna* rendered their specific mode of action obsolete. Thus, under a structural reading, *virtù* is not a tool one holds, but a success condition one achieves.

  This tension is exacerbated by Machiavelli's gendered metaphor, where Fortune is a woman who must be beaten and coerced by bold, youthful men. This imagery suggests a theory of agency based on direct domination. It implies that circumstances are external objects that yield to forceful will. This works well against evental *fortuna*; one can strike back against a sudden shock. However, this metaphor becomes theoretically problematic when applied to structural *fortuna*. One cannot "beat" institutional path dependence or demographic drift into submission through bold, singular acts. These structures require alignment, patience, and subtle manipulation rather than violent coercion. If the metaphor is taken as a substantive theory of control, it conflicts with the reality of structural constraints. It suggests an agency that is too voluntarist, ignoring the way structures constrain the very possibility of bold action.

  Consequently, if we accept the structural view of *fortuna*, *virtù* risks collapsing into mere reactive improvisation. If the prince cannot dominate the structure but must merely ride its currents, *virtù* ceases to be a masterful imposition of will and becomes a desperate adaptation to necessity. Machiavelli wants *virtù* to be transformative, allowing the prince to found new orders. But if structural *fortuna* dictates the limits of the possible, the prince's agency is reduced to finding gaps within a predetermined system. The gendered metaphor masks this reduction by promising domination where only negotiation is possible. Therefore, *virtù* is only coherent as a transformative force if *fortuna* remains evental. Once *fortuna* becomes structural, *virtù* becomes contingent success, and the promise of political founding is severely curtailed.

  [Interpretive Confidence: This argument holds high confidence regarding the incompatibility of the domination metaphor with structural constraints. The claim least certain is whether Machiavelli intentionally excluded structural contingency or simply lacked the conceptual vocabulary to describe it.]

  ***

  **Marking Scheme (Total: 20 Marks)**

  **A Range (17–20 Marks): Excellent**
  *   **Conceptual Distinction:** Clearly distinguishes between evental *fortuna* (sudden shocks) and structural *fortuna* (institutional/ecological constraints).
  *   **Virtù/Fortuna Relationship:** Takes a definitive stance on separability (arguing *virtù* is either independent or constituted) and justifies it using the structural distinction.
  *   **Metaphor Analysis:** Treats the gendered metaphor as carrying a substantive theory of agency (domination) rather than mere rhetorical flourish. Explicitly connects this to the conflict with structural constraints.
  *   **Conclusion:** Judiciously assesses whether *virtù* collapses into improvisation under structural pressure.
  *   **Argumentation:** Essay is structured as an argument, not a summary. No reliance on plot recap of Chapter 25.

  **B Range (13–16 Marks): Good**
  *   **Conceptual Distinction:** Mentions the difference between sudden luck and deeper constraints but does not fully integrate it into the definition of *virtù*.
  *   **Virtù/Fortuna Relationship:** Discusses the relationship but remains vague on whether *virtù* is dispositional or constituted.
  *   **Metaphor Analysis:** Identifies the gendered metaphor but treats it primarily as rhetorical decoration rather than a theoretical claim about agency.
  *   **Conclusion:** Addresses the improvisation risk but lacks a decisive judgment.
  *   **Argumentation:** Strong writing but relies somewhat on summarizing Machiavelli's examples rather than constructing an independent thesis.

  **C Range (10–12 Marks): Adequate**
  *   **Conceptual Distinction:** Fails to distinguish between evental and structural *fortuna*; treats all contingency as the same.
  *   **Virtù/Fortuna Relationship:** Describes the pairing without analyzing the ontological status of *virtù*.
  *   **Metaphor Analysis:** Mentions the metaphor briefly without analyzing its implications for agency.
  *   **Argumentation:** Significant portions devoted to summarizing Chapter 25. Argument is present but underdeveloped.

  **Fail Range (0–9 Marks): Inadequate**
  *   **Content:** Mostly summary or irrelevant to the prompt.
  *   **Analysis:** Fails to address the metaphor or the structural distinction.
  *   **Clarity:** Disorganized or incomprehensible.

  ***

  **Meta-Note**

  **Confidence Level:** High confidence (approx. 85%) in the overall interpretation regarding the tension between voluntarist agency and structural constraint.
  **Least Sure Claim:** I am least certain about the claim that Machiavelli's gendered metaphor *must* be read as a substantive theory of control rather than a conventional rhetorical device of the time. While treating it as theoretical yields richer political analysis, it is possible Machiavelli employed it merely for stylistic impact without intending it to bear the weight of a theory of agency incompatible with structuralism.
