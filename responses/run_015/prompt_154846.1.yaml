answer: |-
  Japan's Meiji restoration is not a counterexample to Hobsbawm and Anderson but rather a definitive case of "official nationalism" where a pre-modern dynasty was retrofitted with invented traditions to manufacture a modern nation-state. Your friend's error lies in conflating the existence of an institution with the political function it serves; while the imperial line is ancient, the ideology of the Emperor as a sovereign national head of state possessing divine authority over a unified citizenry was a nineteenth-century construction designed to legitimize rapid modernization.

  Through Hobsbawm's lens, the Meiji oligarchs engaged in mass invention of tradition to bridge the gap between a feudal past and a modern future. The claim of an unbroken imperial line dating to 660 BCE was treated as historical fact rather than myth, transforming a symbolic figurehead who had been sidelined by shoguns for centuries into the active political center of the state. State Shinto, formalized after the 1868 separation from Buddhism, functioned as a ritual apparatus to sacralize this new political order, creating a national cult that demanded loyalty distinct from religious belief. The 1890 Imperial Rescript on Education further cemented this by establishing a secular ritual where students bowed to the Emperor's portrait and listened to the Rescript being read aloud, inculcating values of loyalty and filial piety as state doctrine. These are classic invented traditions: practices implying continuity with a suitable historic past that are actually novel responses to modernization, designed to naturalize the new regime's authority.

  Anderson's framework explains the mechanisms used to disseminate these traditions across the population to create an "imagined community." This specific case fits Anderson's category of "official nationalism," where a ruling dynasty adopts nationalist policies to preempt popular revolution and integrate disparate regions. The standardization of national-history textbooks after 1903 is a prime example of state-controlled print capitalism; the government monopolized the narrative of origin, ensuring every child learned the same myth of national unity centered on the Emperor. Additionally, the push for a standardized national language (genbun itchi) allowed people from different domains to imagine themselves as part of a single horizontal community, even though the hierarchy remained vertical. Unlike Anderson's European model where print capitalism often erodes dynastic legitimacy from below, in Japan, the state harnessed print media to reinforce dynastic legitimacy from above.

  However, the Japanese case does stretch both models in critical ways. For Anderson, the existence of a genuine pre-modern imperial institution complicates the narrative that nations are purely modern constructs; Japan did not need to invent a dynasty, only repurpose its meaning, suggesting that "imagined communities" can piggyback on real historical continuities rather than emerging solely from print capitalism. For Hobsbawm, the distinction between "invented" and "adapted" becomes blurry; the Meiji state did not create the Emperor ex nihilo but stripped away centuries of Buddhist and shogunal accretion to reveal a "pure" imperial tradition that never actually existed in that form. Ultimately, the Meiji state proves that modern nation-building often requires the strategic manipulation of history, where the authenticity of the symbol matters less than its utility in binding a population to a modernizing state.
