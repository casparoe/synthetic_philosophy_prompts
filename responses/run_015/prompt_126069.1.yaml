answer: |-
  Here is a design for a 90-minute seminar activity titled **"The Registrar's Ledger."** It is built to isolate the pressure of Bivalence (B) from Causal Determinism (D) and Knowability (K), forcing students to feel the fatalist intuition before they have the vocabulary to defuse it.

  ### 1. The Concrete Machinery

  **Materials (in your bag):**
  *   16 small index cards and 16 pens.
  *   1 opaque envelope (sealed empty).
  *   1 large sheet of paper (The Ledger) taped to the whiteboard.
  *   3 colored markers (Red, Blue, Black).
  *   1 "Golden Object" (a distinctive piece of chalk, a weird stone, or a specific marker) representing *The Authority*.

  **Roles:**
  *   **The Agent (1 student):** Will make a free choice at the end of class.
  *   **The Registrar (1 student):** Maintains the Ledger. Holds *The Authority*.
  *   **The Jury (14 students):** Advise the Registrar but must record private votes first.
  *   **The Timekeeper (1 student):** Keeps the timeline strict.

  **Stakes:**
  *   **The Authority:** Whoever holds *The Golden Object* at the end of class decides the **first discussion question** for the next seminar. This is trivial but grants genuine agenda-setting power.
  *   **The Wager:** If the Ledger correctly reflects the "Truth" of the outcome (as determined by the Agent's final reveal), the Class keeps *The Authority*. If the Ledger is proven "impossible" (i.e., the Agent proves the Ledger forced their hand or was incoherent), the Agent keeps *The Authority*.

  **Timeline (90 Minutes):**
  *   **00–10:** Setup, Role Assignment, Private Voting (Phase 1).
  *   **10–30:** The Sealed Envelope (Phase 1 Execution).
  *   **30–50:** The Future Choice (Phase 2 Execution).
  *   **50–70:** The Ledger Lock & The Reveal.
  *   **70–90:** Debrief & Aristotle Connection.

  ---

  ### 2. The Trap

  **The Setup (00–10):**
  Tell the class: *"We are testing the reliability of statements about the future. We are not testing luck. We are testing whether sentences about the future have truth values **now**."*

  **Private Commitments (The Trap):**
  Before any discussion, hand out index cards.
  *   **Prompt:** "I will place a card in this envelope. It is either Red or Blue. I have already chosen it. It is in my pocket. It is causally settled. No one knows it. On your card, write: Is the statement 'The card in the envelope is Red' **True**, **False**, or **Indeterminate** right now? Sign it."
  *   **Collection:** Collect these immediately. Do not let them discuss. This captures their intuition about (D) without (K).

  **The Ledger:**
  The Registrar draws three columns on the board: **STATEMENT | VALUE (T/F/?) | TIME ASSIGNED**.
  The Registrar must fill this in *publicly* based on the class's consensus, but they are instructed: *"You cannot leave a row blank unless you are willing to argue that the sentence has no truth value. If you mark T or F, you claim it is fixed."*

  **The Reveal:**
  The Ledger is sealed (covered with a sheet of paper) at minute 50. It cannot be changed. The Agent reveals their choice at minute 70. The tension comes from the gap between Minute 50 (Ledger Locked) and Minute 70 (Outcome Revealed).

  ---

  ### 3. The Ledger Mechanism (Avoiding Newcomb)

  **The Mechanism:**
  We run two rounds.
  1.  **Round 1 (The Envelope):** Represents (D) + (~K). The outcome is physically fixed.
  2.  **Round 2 (The Agent's Choice):** Represents (~D) + (~K). The outcome is *not* fixed until the Agent chooses at minute 70.

  **Avoiding the Newcomb Problem:**
  To ensure the Ledger does not *cause* the outcome (which would turn this into a prediction/self-fulfilling prophecy problem):
  *   **Isolation:** The Agent is not allowed to see the Ledger until the reveal.
  *   **Instruction:** The Agent is told: *"Your goal is to choose freely. Do not try to match the Ledger. Do not try to contradict it. Just choose what you genuinely prefer at minute 70."*
  *   **The Registrar's Burden:** The Registrar must assign T/F/? based on *logical status*, not *predictive confidence*.
      *   *Constraint:* If the Registrar marks **True**, they are claiming it is *already* the case that the Agent will choose Red, even though the Agent hasn't chosen yet.
      *   *Constraint:* If the Registrar marks **?**, they are claiming the sentence lacks a truth value.

  **Why this matters:**
  If the Registrar marks **True** in Round 2, they have treated an open future exactly like the sealed envelope (Round 1). This is the collision. They have granted Bivalence (B) the power of Determinism (D).

  ---

  ### 4. The Debrief Table

  | Beat | Time | Activity | Concept Made Vivid | Question to Ask | What NOT to Supply |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1** | 15' | **Envelope Reveal.** Open envelope. Compare to private cards. | **Settledness (D).** Most marked T/F. They are comfortable here. | "Why were you comfortable marking True/False here when you didn't *know* the content?" | Do not mention "truth conditions." Let them say "it was already there." |
  | **2** | 45' | **Ledger Lock.** Registrar finalizes Round 2 (Agent's Choice). | **Bivalence (B).** The pressure point. | "Registrar, you marked 'True' for a choice that hasn't happened. What makes it true *now*?" | Do not accept "Because they will choose it." Push: "Is it true *before* they choose?" |
  | **3** | 60' | **The Comparison.** Uncover Round 1 next to Round 2. | **The Collapse.** | "Look at Round 1 (Envelope) and Round 2 (Choice). You marked them the same. What is the difference?" | Do not explain the difference. Let them feel the lack of one. |
  | **4** | 75' | **The Reveal.** Agent chooses. | **Fixity of Past.** | "If the Ledger was True at minute 50, could the Agent have chosen otherwise at minute 70?" | Do not solve this. Let the silence hang. |
  | **5** | 85' | **Aristotle Connection.** Read *De Int.* 9 excerpt. | **The Sea Battle.** | "Aristotle says if 'There will be a battle' is true, deliberation is vain. Did our Ledger make deliberation vain?" | Do not defend Aristotle. Ask if *they* feel vain. |

  **Handling the Compatibilist Shrug (Minute 35):**
  *Student:* "It's true because I'm going to choose it. My choice makes it true. No fatalism."
  *Your Response:* "We are asking about the status of the sentence at **Minute 35**. At Minute 35, you have not chosen. If the sentence is *already* True at Minute 35, is your choice at Minute 70 adding anything to reality, or just revealing what was already the case? If it was *already* the case, could you have done otherwise?"
  *Goal:* Force them to see that "True Now" implies "Fixed Now," regardless of what causes the fixity.

  ---

  ### 5. Scope Discipline

  **Target Formulation:**
  This activity targets **Logical Fatalism** (The Argument from Bivalence).
  *   *Premise:* Every declarative sentence is either True or False.
  *   *Conclusion:* Future contingents are necessary.

  **Deliberate Sacrifices:**
  *   **Causal Determinism (D):** We explicitly separate this in Round 1 vs. Round 2. We sacrifice the *physics* of determinism to isolate the *logic* of truth.
  *   **Theological Foreknowledge (K):** We sacrifice the "God knows" angle. The Registrar is not omniscient; they are assigning logical values. This prevents students from offloading the problem onto "God's timeless knowledge."

  **What You Lose:**
  By stripping out causal determinism, you lose the intuitive comfort of "physics made me do it." Students may feel the logic is a trick because "nothing is physically stopping the Agent." You must press that *logical* fixity is the worry, not *physical* constraint.

  ---

  ### 6. Failure Modes & Repairs

  **1. The Probabilist ("It's 50/50, so who cares?")**
  *   *Symptom:* Student argues that probability negates truth values.
  *   *Repair:* "Probability is about our *knowledge*. Truth is about *reality*. If I say 'The coin is heads' while it's in the air, is that sentence True, False, or neither? If neither, Bivalence is false. If True/False, the outcome is fixed."

  **2. The Branching Time Expert ("In branch A it's true, in branch B it's false.")**
  *   *Symptom:* Student invokes Ockhamist or Peircean semantics to dissolve the tension.
  *   *Repair:* "Bracket the metaphysics of time. We are speaking English, in this room, *now*. Does the sentence 'The Agent will choose Red' have a truth value in *this* context? If you say 'It depends on the branch,' you are denying Bivalence for this sentence."

  **3. The Guessing Game ("I marked True because I bet on Red.")**
  *   *Symptom:* Students treat the Ledger as a prediction scoreboard.
  *   *Repair:* Stop the game. "If you are predicting, you can be wrong. If you are assigning Truth, you cannot be wrong. If you mark 'True' and they choose Blue, was your mark *false*, or was it *mistaken*? There is a difference."

  **4. The Anticlimactic Reveal ("They matched. Cool. Next.")**
  *   *Symptom:* The Agent chooses what the Ledger said, and no one feels the tension.
  *   *Repair:* "Imagine they had chosen differently. If the Ledger said 'True' for Red, and they chose Blue, would the Ledger have been *false*? If yes, then the Ledger was predicting. If the Ledger was assigning Truth, then the Agent *could not* have chosen Blue. Which was it?"

  ---

  ### 7. Honesty About Limits

  **What the Game Cannot Stage:**
  *   **Metaphysical Necessity:** The game can create *psychological* pressure (the feeling that the future is fixed), but it cannot demonstrate *metaphysical* necessity. Students can always retreat to "It just *happened* to match."
  *   **The "Cannot But Be" Step:** You cannot force them to see *why* Truth implies Necessity. You can only show that they *treat* Truth as implying Necessity in the Envelope round, and ask why they wouldn't in the Choice round.

  **What You Must Say Out Loud:**
  *   *"The game does not prove fatalism. It proves that you are uncomfortable treating Future Contingents as Bivalent. Aristotle's point is that if you want to keep deliberation, you might have to give up Bivalence. Are you willing to do that?"*

  **Pedagogical Misdirection:**
  *   **The Lie:** In Round 2, you imply the Ledger is recording "The Truth." In reality, it is recording "The Class's Commitment to Bivalence."
  *   **Ethical Flag:** This is a **Noble Lie**. You are misleading them about the *purpose* of the Ledger (recording reality vs. recording their logical commitments) to generate the experiential conflict.
  *   **Verdict:** **Use it.** It is standard philosophical pedagogy (the "intuition pump"). You reveal the misdirection in the Debrief (Minute 70). Since you teach them again, this builds trust: "I tricked you to show you where your intuition lives."

  **Final Note on the "Shrug":**
  If a student insists, "Deliberation causes the truth, so Bivalence is fine," your closing move is: *"If deliberation causes the truth, then before you deliberate, there is no truth. That means Bivalence is false for future contingents. You have saved deliberation by killing Bivalence. That is exactly Aristotle's solution. Welcome to the seminar."*
