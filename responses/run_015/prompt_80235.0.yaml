  You are absolutely right to be frustrated. Your friend's track record is what philosophers call **"degenerate evidence"** in this context. Her answers so far are mathematically consistent with *both* camps because the specific scenarios she answered collapse the probability space in a way that forces convergence.

  Here is the breakdown of why her past answers don't help, what she will likely say about the 3-sided die, and the specific variant that will finally force her to reveal her hand.

  ### 1. Why her track record is inconclusive
  You noticed that her answers fit both rules. Here is the technical reason why:

  *   **Rigged Coins (100% Heads/Tails):** This is trivial. Both Halfers and Thirders agree that if the coin is physically rigged to be Heads, the credence is 1. If rigged to Tails, credence is 0. This tests nothing.
  *   **Told it's Tuesday:** Both agree credence in Heads is 0. (Heads only wakes on Monday). This tests nothing.
  *   **Told it's Monday:** This is the only real data point, and it's ambiguous.
      *   **Thirder:** Eliminates the "Tails-Tuesday" world. Left with Heads-Monday and Tails-Monday. Since Thirders view these as equally likely centered worlds, $P(Heads) = 1/2$.
      *   **"Double" Halfer:** Some Halfers (unlike the standard David Lewis Halfer) argue that learning it is Monday doesn't update the coin bias because Monday happens in *both* the Heads and Tails worlds. They also conclude $P(Heads) = 1/2$.
      *   *(Note: A standard Lewis-Halfer would actually say **2/3** upon learning it is Monday. The fact that she said 1/2 means she is either a Thirder or a "Double Halfer," but you still can't tell which.)*

  ### 2. The 3-Sided Die Prediction
  This new case is **not** degenerate. It breaks the symmetry of the coin flip. Here is what she will say depending on which rule she is actually running:

  **If she is a Halfer:**
  Halfers believe waking up provides no new information about the chance setup (the die roll). She should stick to the prior probability of the die.
  *   Credence in Face 1: **1/3**
  *   Credence in Face 2: **1/3**
  *   Credence in Face 3: **1/3**

  **If she is a Thirder:**
  Thirders believe credence should be proportional to the number of observer-moments (wakings). There are $1 + 2 + 3 = 6$ total possible wakings.
  *   Credence in Face 1: **1/6** (1 waking out of 6)
  *   Credence in Face 2: **1/3** (2 wakings out of 6)
  *   Credence in Face 3: **1/2** (3 wakings out of 6)

  **Verdict:** If she gives you the uniform $(1/3, 1/3, 1/3)$, she's a Halfer. If she gives you the weighted $(1/6, 1/3, 1/2)$, she's a Thirder. **This case actually separates them.**

  ### 3. The "Nuclear Option" Variant
  If she hedges on the die or argues that the die isn't a "fair comparison," use the **Extreme Sleeping Beauty** variant. This is usually the tie-breaker in philosophical literature because it makes the Thirder position intuitively overwhelming and the Halfer position intuitively stubborn.

  **The Setup:**
  *   Instead of a coin, use a lottery machine with **1,000,001** balls.
  *   **Ball 1 (Heads):** She wakes up **1 time**.
  *   **Balls 2–1,000,001 (Tails):** She wakes up **1,000,000 times**.
  *   She wakes up. What is her credence that Ball 1 was drawn?

  **The Separation:**
  *   **Thirder:** She will say the credence is approximately **1 in 1,000,000**. (It is overwhelmingly likely she is in one of the million Tails-wakings).
  *   **Halfer:** She must maintain the credence is approximately **1/2** (or at least $1/1,000,001$ based on the prior, refusing to update based on the number of wakings).

  If she says "It's basically impossible that Ball 1 was drawn," she's a Thirder. If she says "It's still roughly 50/50 because the machine was fair," she's a Halfer.

  ### 4. The Practical Test (Betting)
  If she refuses to give numbers and talks about "philosophical nuance," force a bet.

  **The Offer:** "Every time you wake up, you can bet \$1. If you guess the outcome correctly, you win \$1.10. If you guess wrong, you lose \$1."

  *   **Thirder Strategy:** In the 3-sided die case, she should **always guess Face 3**. Since she believes Face 3 has a 50% chance of being the current reality, this is a winning bet.
  *   **Halfer Strategy:** She believes each face is 33%. She has no rational reason to prefer Face 3 over Face 1.

  If she commits to always guessing the outcome with the *most wakings*, she is behaving like a Thirder.

  ### Summary
  1.  **Track Record:** Inconclusive. Her "Monday = 1/2" answer rules out *standard* Halfers, but leaves "Double Halfers" and Thirders indistinguishable.
  2.  **3-Sided Die:** This **will** tell you. Halfer = Uniform ($1/3$ each); Thirder = Weighted ($1/6, 1/3, 1/2$).
  3.  **Best Variant:** The **1 vs. 1,000,000 wakeups** case. It makes the Halfer position look absurd to almost everyone, forcing your friend to either abandon Halferism or defend a very hard line.
