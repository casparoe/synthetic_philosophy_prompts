  **The Case**
  Cardiology (Dept A) and Neurology (Dept B) are merging within St. Jude's Hospital, negotiating a one-time retention bonus pool with a "tiered fallback lock" clause in the hospital's accounting charter. Both departments have an outside option (disagreement point) of $40k on paper, but the charter stipulates that if the agreed total surplus distribution exceeds $80k—which any viable deal must—Neurology's financial fallback automatically drops to $25k due to triggered audit risks, effectively warping the feasible set in the upper-right quadrant by capping Neurology's maximum safe utility ($b^*$) at $85k instead of the theoretical $100k, while Cardiology's maximum ($a^*$) remains $100k. The local trade-off rate near the center of the set remains linear (1:1), but the "lock" chops off the extreme upper boundary for Neurology, creating a feasible set $S$ where the ideal point is asymmetrically reduced for B without altering the local frontier slope where a standard equal split would occur.

  **The Verdicts and Axioms**
  The **Nash Bargaining Solution** maximizes the product of gains $(u_A - 40)(u_B - 40)$ over the feasible set. Since the "tiered lock" only truncates the extreme upper boundary (the "irrelevant" alternatives) and the local frontier slope near the center remains linear, Nash ignores the warp and selects the symmetric split of **$70k each** (gains of 30k/30k), relying on the axiom of **Independence of Irrelevant Alternatives (IIA)**—the removal of the unattainable upper-quadrant options does not change the optimal point within the remaining set. The **Kalai-Smorodinsky (KS) Solution**, however, equalizes the relative gains proportional to the ideal points: $\frac{u_A - 40}{100 - 40} = \frac{u_B - 40}{85 - 40}$. Because KS depends on **Monotonicity** (specifically sensitivity to the shape of the entire feasible set and the ideal points), the reduction of B's ideal point from 100 to 85 pulls the solution toward A, resulting in a split of roughly **$74.3k for Cardiology and $65.7k for Neurology**. A Nash defender would attack the KS verdict by arguing that the "tiered lock" constrains options neither department would have chosen anyway; penalizing Neurology for a boundary constraint that doesn't bind at the optimum violates rational independence, effectively punishing them for a risk they never intended to incur.
