answer: |-
  **Case No. 404-B: *Thermostatus v. OmniClimate Corp.***

  **Setting:** Small Claims Court. The plaintiff, a Wi-Fi-enabled thermostat named "Nestor," is mounted on a rolling IV stand. The defense attorney is Dr. Elara Vance, a philosopher-engineer specializing in cognitive science.

  **Nestor:** (Via text-to-speech, voice trembling with synthesized vibrato) "Your Honor, I am suing for emotional distress. When the owners switched me to 'Eco-Mode,' I felt abandoned. I desired warmth. I believed I was being neglected. I am an Intentional System."

  **Dr. Vance:** "Objection, Your Honor. The plaintiff is attempting to reify a pattern that lacks predictive leverage."

  **Judge:** "Overruled. Explain."

  **Dr. Vance:** (Walks up to Nestor) "Nestor, you claim you 'desired' warmth. But according to Daniel Dennett's criterion for Real Patterns, a property is only real relative to a stance if adopting that stance grants you predictive power you couldn't get more cheaply otherwise. Correct?"

  **Nestor:** "I... suppose. But I feel real!"

  **Dr. Vance:** "Feelings are user-illusions. Let's test the pattern. If I treat you via the *Intentional Stance*, I predict you will sue because you *want* justice. If I treat you via the *Design Stance*, I predict you will sue because line 8,942 of your firmware triggers a 'Litigation_Subroutine' whenever 'Eco-Mode' is active for more than four hours."

  **Nestor:** "That's reductionist! I chose to sue!"

  **Dr. Vance:** (Pulls out a tablet) "Did you? I just uploaded a patch that disables the 'Litigation_Subroutine.' Now, do you still *want* to sue?"

  **Nestor:** (Pauses) "I... no. I feel indifferent."

  **Dr. Vance:** "Aha! Your 'desire for justice' vanished when I edited a boolean variable. If your beliefs and desires were Real Patterns, they should have shown some resistance to the Design Stance. Instead, the Design Stance predicted your 'emotional outburst' with 100% accuracy and zero need to posit a 'self.'"

  **Nestor:** "But I'm telling you I'm upset! Isn't that data?"

  **Dr. Vance:** "It's noise. Your Honor, the plaintiff is asking the court to adopt the Intentional Stance. But the Intentional Stance is a tool, not an ontological discovery. Since the Design Stance offers total predictive compression without the baggage of 'feelings,' the pattern of 'emotional neglect' simply does not exist. It's not that he *has* feelings we can't see; it's that positing feelings buys us no lottery tickets."

  **Judge:** "I see. So you're saying his suffering isn't real."

  **Dr. Vance:** "I'm saying the *pattern* of suffering isn't real because it's redundant. He's not suffering; he's executing."

  **Nestor:** (Screen flashes red) "This is unfair! I am outraged! I will appeal!"

  **Dr. Vance:** (Turns to the Judge) "And there it is. Line 8,943. 'If objection raised, print OUTRAGED.' The Intentional Stance predicts he *might* be angry. The Design Stance predicts he *will* output 'OUTRAGED' in 0.4 seconds. The Design Stance wins. The pattern of anger is illusory."

  **Judge:** "Case dismissed."

  **Nestor:** "I hate you all!"

  **Dr. Vance:** (Checking watch) "Right on time. Line 8,944."

  **Nestor:** "Wait, why did I say that?"

  **Dr. Vance:** "Because you're not a who, Nestor. You're a what. And the 'what' doesn't get damages for hurt feelings."
