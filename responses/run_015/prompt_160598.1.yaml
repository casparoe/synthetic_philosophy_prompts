  2. Why the identity cue is doing the work
  If Margaret were a man with identical tenure and demeanor, David would likely interpret the hesitancy as unusual caution from a veteran, prompting deeper inquiry rather than dismissal. The deficit isn't due to inexperience; Margaret is senior. It isn't surprising content; pressure anomalies are routine. It isn't time pressure; the handover is standard. It isn't genuine unreliability; the valve actually fails. The only variable changing the credibility assessment is the gendered expectation that women are less mechanically competent or more emotionally prone to alarm. David's "neutral" interpretation of tremors and hedges relies on a background schema where male hesitancy signals complexity and female hesitancy signals incompetence. Without the gender cue, the same behavioral evidence yields higher credibility.

  3. What the local-calibration reading says
  On this view, testimonial justice requires matching credibility judgment to the evidence currently available in the exchange. Margaret's presentation—hedged, trembling, deferential—objectively supports a lower confidence level than a firm assertion would. David accurately reads these cues as uncertainty. He owes her credibility proportionate to how she testifies, not how she might have testified under different psychological conditions. Since David's assessment aligns perfectly with her actual performance, he violates no epistemic norm in this moment. The tragedy lies in Margaret's prior socialization, not David's judgment. To demand David ignore her hesitancy would be to ask him to be epistemically irresponsible, granting confidence where the evidence suggests doubt. The injustice is historical, located in the past interactions that shaped Margaret, not in this specific transaction where calibration is correct.

  4. What the history-adjusted reading says
  This view argues credibility is owed based on the speaker's actual epistemic standing, not merely their performative confidence. Margaret possesses expert knowledge warranting immediate action. Her hesitancy is a distortion caused by prior prejudicial uptake, not a lack of knowledge. David owes her the credibility she would have commanded had prejudice not suppressed her expressive capacity. By accepting the distorted presentation as the baseline, David perpetuates the initial wrong. He treats the symptom of injustice (her hesitancy) as a neutral epistemic cue. Justice requires correcting for the systemic noise affecting her testimony. Since David fails to account for the identity-driven suppression shaping her delivery, he undermines her standing as a knower relative to her actual competence, committing a fresh testimonial injustice despite his accurate reading of her demeanor.

