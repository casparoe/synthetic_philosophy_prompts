  The divergence rides on the *baseline for deserved credibility*. The local-calibration reading fixes the baseline at the *actual utterance*, treating credibility as a response to immediate evidence. The history-adjusted reading fixes the baseline at the *counterfactual utterance*, treating credibility as a recognition of underlying capacity. Cases where systemic prejudice alters communicative style without altering knowledge generate this split. The structural feature is the *mediation of evidence by prior oppression*: when the evidence available to the hearer is itself a product of the injustice being judged. It arises whenever marginalized speakers modify delivery to avoid prejudice, creating a gap between performed confidence and actual competence that the hearer must navigate.

  6. The objection my friend would make
  My friend would argue the counterfactual baseline is epistemically inaccessible. David cannot know how confident Margaret *would* have been absent prejudice; he only knows how she *is*. Requiring him to compensate for societal history imposes an impossible burden on individual hearers, turning epistemic justice into a form of affirmative action rather than truth-tracking. Furthermore, the upstream wrong already exhausts the moral debt; David is not responsible for repairing harms he did not cause. To call this a new injustice conflates the propagation of harm with the origination of harm. In this specific case, however, this reply struggles because Margaret's seniority provides a proxy for competence. David could reasonably infer that twenty years of experience usually yields confidence, making the counterfactual less indeterminate than claimed.

  7. What breaks if I alter it
  If David caused Margaret's hesitancy previously, the case collapses into a single-agent wrong; both readings agree injustice occurred. The split requires the hearer distinct from the distortion's source. If hesitancy stemmed from a stammer or sleeplessness, the history-adjusted reading loses traction because there is no *identity prejudice* shaping the presentation, only random noise. Corrected credibility relies on the distortion being systemic, creating an obligation to resist prejudicial patterns. Without that social history, the local-calibration reading dominates: the hearer simply responds to reduced clarity. The diachronic argument depends entirely on the hesitancy being a fossilized record of prior epistemic injustice.
