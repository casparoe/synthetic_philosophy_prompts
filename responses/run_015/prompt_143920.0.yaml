answer: |-
  Dear Colleague

  I share your fatigue, and I think you are right to identify the handwaving as a moral hazard rather than just an administrative nuisance. When we sit on that board, we are effectively being asked to adjudicate the boundary of the human community without a map that everyone agrees on, and doing so in forty minutes means we cannot retreat into the luxury of pure metaphysics. What you are asking for is a tool that translates the debate between the cardiopulmonary, whole-brain, and higher-brain concepts of death into a workflow that respects the law while exposing the ethical seams where the law is silent. The following procedure is designed to be read aloud or circulated before a meeting, serving as a scaffold for the discussion rather than a rigid algorithm, because no algorithm can fully capture the ontology of death without hiding the value judgments behind clinical language.

  We begin the procedure by establishing the mode of physiological support, because this determines which philosophical definition of death is even available to us. If the patient is not on mechanical ventilation or extracorporeal membrane oxygenation, we default to the cardiopulmonary standard, asking only whether circulation and respiration have ceased permanently. However, if the patient is on ECMO or a ventilator, the heart and lungs are merely being acted upon by machines, so the cardiopulmonary definition collapses and we are forced to adopt a neurological standard. Here is the first place where philosophy must be operationalized. We must ask whether the brain is functioning as an integrator of the body as a whole. This adopts the Bernat view that death is the loss of the organism's somatic integrity, rather than the Veatch view that death is the loss of consciousness or personhood. We choose the integrative view for this procedure not because it is metaphysically superior, but because it is legally defensible and clinically observable. Consequently, the first hard stop in our discussion is to determine if there is any evidence of brainstem function that suggests integration is still occurring. If there are pupillary reflexes or spontaneous respiratory drive, the procedure dictates we cannot declare death, regardless of the family's wishes or the state of the cortex. This drops the higher-brain debate from the protocol entirely. We must acknowledge that this is a pragmatic choice, not a truth claim. We are deciding that for the purposes of this hospital, a body that breathes or reacts via the brainstem is alive, even if the person is gone. This saves us from needing a neuroscience PhD in the room to interpret EEG nuance, but it means we will sometimes keep bodies on support that are philosophically dead by higher-brain standards.

  Once we have established that the brainstem is non-functional, we move to the question of irreversibility, which is where the second major philosophical distinction survives translation. We must distinguish between permanent cessation and irreversible cessation. Permanent means it will not come back on its own; irreversible means it cannot come back even with intervention. In donation-after-circulatory-death scenarios, we are ethically required to treat permanent cessation as death, even if biologically the heart could be restarted with immediate CPR. This is a value choice dressed as a clinical step. The procedure requires the board to explicitly affirm that the decision not to resuscitate is final before declaring death. If the plan is to withdraw support and not intervene upon arrest, then the cessation is permanent, and for the purposes of the dead-donor rule, the patient is dead. We do not wait for biological irreversibility because that would render organs unusable. Here we mark the judgment call clearly. We are prioritizing the utility of donation and the respect for the withdrawal decision over a strict biological definition of irreversibility. This is where the dead-donor rule is most vulnerable, and the procedure requires us to state aloud that we are declaring death based on the permanence of the condition given the care plan, not based on the absolute biological impossibility of revival.

  The third step involves the specific ambiguities you mentioned, starting with the ECMO case. Imagine a patient on full bypass where the heart is beating only because the machine is pumping blood. The cardiopulmonary criteria are useless here. The procedure directs us to ignore the heart entirely and focus on the brain. If the whole brain including the brainstem is dead, the patient is dead, even if the chest is rising and the blood is flowing. The philosophical distinction here is between the body as a machine and the body as an organism. The procedure forces us to agree that the machine is sustaining tissue, not life. If the family argues that the heartbeat means life, the procedure instructs us to explain that the heartbeat is a mechanical event, not a sign of integrative function. This is usually manageable, but it requires the board to hold the line on the whole-brain standard without wavering into cardiopulmonary intuition.

  The second worked case is the donation-after-circulatory-death scenario where the dead-donor rule seems to conflict with withdrawal. Here the procedure asks us to verify the timeline of permanence. Typically, we wait five minutes after arrest to declare death. The procedure requires us to confirm that this waiting period is observed not because biological death happens at minute five, but because this is the agreed-upon social threshold for permanence. If a board member argues that the patient might still be alive at minute four, the procedure directs us to acknowledge they are technically correct biologically but incorrect protocol-wise. We are agreeing to a convention. The judgment call here is explicit. We are choosing a time threshold that balances respect for the dying process with the viability of organs. If the board cannot agree on the threshold, the procedure defaults to the longer wait time. This protects the board from accusations of hastening death, but it acknowledges that the line is arbitrary.

  The third case is the one that will test your comfort, and it involves the patient with residual brainstem reflexes but a flat EEG and no consciousness. Under strict legal standards in most jurisdictions, this patient is not dead because brainstem reflexes preclude a declaration of brain death. However, our procedure is built on the philosophical premise of integrative function. If the reflexes are isolated spinal arcs or residual cranial nerve activity that does not contribute to the integration of the organism as a whole, the procedure allows the board to vote on whether the loss of consciousness and higher integration constitutes death for ethical purposes, even if legal statutes lag behind. In this worked case, the procedure recommends that we treat the patient as dead for procurement purposes if the board agrees that the reflexes are non-integrative. I know this is an answer you might not like, because it exposes the hospital to legal risk and challenges the uniform determination of death act. But it is the honest outcome of prioritizing the philosophical definition of death over the reflexive checklist. The procedure marks this as a high-risk judgment call. It requires the board to document that they are declaring death based on the loss of the organism as a whole, acknowledging that some motor reflexes remain. This is where the procedure stops being a shield and becomes a spotlight. It forces us to admit that the reflexes are not life, even if the law says they are. If you are not willing to take that legal risk, the procedure must be amended to defer to the legal standard, but then you must admit that the procedure is following the law, not the philosophy.

  We must be clear about which philosophical distinctions survive this translation and which are decoration. The whole-brain versus higher-brain debate is largely decoration in this protocol because we cannot operationalize consciousness without invasive monitoring and even then, it is interpretive. We drop the higher-brain criterion for declaration because it is too subjective for a forty-minute meeting, reserving it only for decisions about withdrawing care, not declaring death. The distinction between biological life and personal life survives only in the background. We treat biological integration as the proxy for life because it is the only metric we can measure reliably. The distinction between permanent and irreversible cessation survives because it is crucial for donation, but it is redefined as a moral agreement rather than a biological fact. We are not discovering death in these moments; we are constructing it based on agreed-upon criteria.

  There are judgment calls here that I want you to see clearly because they are often hidden in clinical language. When we decide that five minutes of circulatory arrest equals death, we are making a social contract, not a medical diagnosis. When we decide that spinal reflexes do not count as life, we are making a metaphysical claim about what constitutes the self. The procedure asks you to voice these claims. It requires that when you vote, you state whether you are voting based on legal compliance or ethical consistency. If the two diverge, as they do in the reflex case, the procedure does not resolve the tension for you. It simply forces you to locate it. This is the limit of what any protocol can do. It cannot tell you whether death is a biological fact or a social construct. It can only tell you what follows from adopting one view over the other. If you adopt the view that death is the loss of consciousness, you will find the law too conservative. If you adopt the view that death is the loss of circulation, you will find ECMO cases impossible. If you adopt the view that death is the loss of integration, you will find yourself arguing about reflexes.

  Ultimately, this procedure cannot resolve the ontology of death. It cannot tell you if the patient is truly gone in a metaphysical sense. It can only help you agree on when to stop treating them as a member of the community of the living. It is a tool for consensus, not truth. In the reflex case, if you vote to declare death, you are accepting that the law is wrong. If you vote to keep support, you are accepting that the philosophy is incomplete. The procedure does not save you from that choice. It only ensures you make it with your eyes open. I hope this serves your board well, not as a way to end the debate, but as a way to have the debate where it matters, in the room, before the decision is made.

  Sincerely

  Your Colleague
