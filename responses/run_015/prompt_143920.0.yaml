prompt: |-
  I'm a philosophy professor who also sits on our university hospital's ethics review board, and I'm tired of the committee handwaving whenever we hit a case that's neither clearly brain-dead nor clearly alive by old heart-lung standards. I want you to take the philosophical arguments about brain death versus circulatory death -- not just the medical criteria, but the actual conceptual disputes about what death IS, whether it's the loss of integrative biological function or the permanent end of consciousness or something in between -- and turn them into a decision procedure I can actually run in a forty-minute meeting. The practitioner here is me, or anyone on that board, and we face these ambiguities maybe once every few months, so it needs to be reusable but not over-engineered.

  The procedure should be a step-by-step flow in words, with the hard cases marked out: patients on ECMO where circulation is mechanically maintained so the heart never stops in any meaningful sense; cases with residual brainstem reflexes but flat EEG and a family arguing that reflexes mean life; and donation-after-circulatory-death scenarios where the dead-donor rule seems to conflict with the withdrawal of life support. You need to say which philosophical distinctions survive translation into protocol language -- for instance, does the whole-brain versus higher-brain debate actually change what we do, or is it just metaphysical decoration? -- and which ones have to be dropped because they can't be operationalized without a neuroscience PhD in the room. Mark the judgment calls clearly: where am I just dressing up a value choice as a clinical step? Apply it to three worked cases, including one where the procedure gives an answer I personally won't like -- maybe recommending that we treat a brainstem-reflex patient as dead for procurement purposes -- and be honest about what the procedure absolutely cannot do, like resolving whether death is a biological fact or a social construct we agree on for practical reasons.

  Write the whole thing as continuous prose, like a long letter or email. No headings, no bullet points, no bold text, no tables, and please avoid numbered lists too if you can manage it. And don't include any bibliography or citations or reading lists -- I know the literature, and a model without web access shouldn't be guessing at page numbers anyway. There's probably a typo or two in this message, that's definatly fine.
