answer: |-
  Here is the stress-test you asked for. I'm adopting the role of a colleague who thinks your position is elegant but potentially precarious. I've mapped the space of objections, ranked them by destructive potential, and separated the concessions you must make from the bullets you can bite.

  ### Phase 1: Sketching the Space of Defeaters

  Your position is **Phenomenal Uniformity Hedonism**. You claim:
  1.  **Ontology:** Pleasantness is a singular, scalar phenomenological property (a "qualitative part" or "tone").
  2.  **Individuation:** Pleasures are distinguished by intentional object/cause, not by the quality of the pleasantness itself.
  3.  **Axiology:** Wellbeing is the maximization of this scalar quantity.

  The space of defeaters isn't just "pleasures feel different." It breaks down into three layers:
  *   **Phenomenological:** Does the common property actually appear in the experience? (The Introspection/Absorption problem).
  *   **Metaphysical:** Is pleasantness the *kind* of thing that can be a scalar property of an experience? (The Adverbial/Category problem).
  *   **Functional/Normative:** Does this property do the work of *value* and *motivation*? (The Motivation/Insulation problem).

  Most textbook objections stay at the phenomenological layer. Your view is robust there. The real danger lies in the Metaphysical and Functional layers.

  ---

  ### Phase 2: Ranked Defeaters (Fatal to Awkward)

  Here is the ranking of threats to your specific "Single Scalar Dimension" view. I have indicated where you must concede ground and where you can hold the line.

  #### 1. The Motivation/Value Gap (Fatal if unaddressed)
  *   **The Threat:** You mention this moves you most. It should. If pleasantness is just a "feel," why does it track *goodness* or *motivation*?
      *   *Case A (Wanting without Liking):* Addiction or incentive salience (Berridge's work). You crave the drug (high motivation) but get no "pleasant feel" (low valence). If your dimension is the feel, it fails to explain the pull. If you say the "pull" is the dimension, you've become an **Attitudinal Hedonist** (Heathwood/Brandt), abandoning the "feeling" claim.
      *   *Case B (Liking without Wanting):* Severe depression or anhedonia. The "feel" might be present (or the capacity for it), but it lacks normative force. It doesn't seem *good* to the subject.
  *   **Verdict:** **Fatal** to the pure view.
  *   **Concession Required:** You cannot maintain that the dimension is *purely* qualitative/phenomenal. You must concede that the "dimension" is partly constituted by a **motivational signature** (a disposition to pursue/continue).
  *   **Why:** If the "feel" can come apart from the "pull," and you claim wellbeing is the "feel," you lose the link to rational choice. If you claim wellbeing is the "pull," you lose the "feeling" theory.
  *   **Defense Strategy:** You must argue for a **Phenomenal-Functional Hybrid**. The dimension is a feel *that essentially presents itself as to-be-pursued*. This saves the view from collapsing into Attitudinal Hedonism, but it costs you the purity of the "qualitative part" claim.

  #### 2. The Category Mistake: Property vs. Manner (Fatal)
  *   **The Threat:** This is the strongest metaphysical objection. Is pleasantness a *component* of experience (like a red patch in a visual field) or a *manner* of experiencing (like seeing clearly)?
      *   If it's a **component** (your view): It should be isolatable. But in "absorption" (flow states), there is no distinct "glow" accompanying the activity. The pleasure is *in the thinking*, not *alongside* it.
      *   If it's a **manner** (Adverbialism): Then talking about it as a "scalar dimension" that can be summed across different activities is a category error. You can't add "seeing clearly" to "hearing loudly."
  *   **Verdict:** **Fatal** to the "currency" metaphor.
  *   **Concession Required:** You must concede that pleasantness is **adverbial** (a way of attending to objects) but argue that adverbial modifiers can still be ranked on a single scale of "intensity of endorsement."
  *   **Why:** If you insist it's a qualitative part (a "tingle"), you lose the absorbed cases. If you admit it's adverbial, you lose the simple "summing" model of wellbeing.
  *   **Defense Strategy:** Argue that "manner" can still be scalar. "Intensity of engagement" is a single dimension, even if it's not a qualia. This modifies your view from "Qualitative Hedonism" to "Phenomenal Engagement Hedonism."

  #### 3. The Insulation/Triviality Worry (Serious Hit)
  *   **The Threat:** You define the dimension as "what makes the state feel good." If "feels good" just means "has the dimension," the theory is tautological. It predicts nothing.
      *   *Test:* Can you identify the dimension *independently* of the judgment "this is pleasant"?
      *   *Rival:* Pluralists say "No, there are many goods." Attitudinalists say "Yes, it's the attitude of favoring."
      *   *Your Risk:* If your only marker for the dimension is "it feels like pleasure," you haven't explained pleasure; you've named it.
  *   **Verdict:** **Serious Hit** (Theoretical Vice).
  *   **Concession Required:** You need a **phenomenological marker** that isn't just "goodness." E.g., "phenomenal lightness," "expansion," "somatic warmth." If you can't name the qualitative character other than "it's the pleasant bit," the view is empty.
  *   **Defense Strategy:** Commit to a specific phenomenology (e.g., "felt rightness" or "motivational pull"). This links back to Defeater #1. If you can't specify the *qualia*, you're insulated from falsification, which is a bug, not a feature.

  #### 4. Empirical Dissociation (Serious Hit)
  *   **The Threat:** Neuroscience suggests "liking" (hedonic impact) and "wanting" (incentive salience) are dissociable. Further, different pleasures (sweet taste, social praise, music) activate different hedonic hotspots (opioid vs. cannabinoid systems) with no obvious common neural currency.
      *   *Implication:* If the brain doesn't sum them on a common scale, is the "single dimension" a folk-psychological illusion?
  *   **Verdict:** **Serious Hit** to plausibility, not logic.
  *   **Concession Required:** Concede **Multiple Realizability**. The "single dimension" is a functional/phenomenal output, not a single neural substrate.
  *   **Defense Strategy:** This is swattable. Pain is realized by different fibers (A-delta vs. C-fibers) but is still a single phenomenal dimension. Lack of a *neural* common currency doesn't prove lack of a *phenomenal* one. However, if the systems are computationally incommensurable (no trade-off mechanism in the brain), your claim that *we* can trade them off becomes suspect.

  #### 5. Recalcitrant Cases: Absorption & Relief (Awkward)
  *   **The Threat:**
      *   *Absorption:* In deep work, introspection finds no "pleasant glow." The pleasure is the lack of friction.
      *   *Relief:* Scratching an itch. Is this positive valence or just the cessation of negative valence?
  *   **Verdict:** **Awkward** but survivable.
  *   **Swat:**
      *   *Absorption:* The "dimension" is backgrounded, not absent. Like peripheral vision, it's there until you look directly at it.
      *   *Relief:* Model this as a scalar where 0 is neutral. Relief is a transition from $-N$ to $0$, which has a positive derivative ($+d/dt$). You can maintain the single dimension handles both positive addition and negative subtraction.
  *   **Why:** These don't break the single dimension claim; they just complicate the measurement. You can concede that introspection is unreliable here without conceding the dimension doesn't exist.

  #### 6. Cross-Kind Incommensurability (Awkward)
  *   **The Threat:** Agents systematically refuse to trade off "higher" vs. "lower" pleasures (e.g., "No amount of push-pin equals poetry").
  *   **Verdict:** **Awkward**.
  *   **Swat:** This is evidence about **access**, not **ontology**. Just because I can't precisely weigh grams against ounces without a scale doesn't mean they aren't both mass. The "refusal" is often a heuristic to avoid category errors or a commitment to diversity, not proof of incommensurability.
  *   **Why:** You already flagged this. You're right to treat this as epistemic. If the dimension exists, our inability to measure it precisely doesn't kill it.

  ---

  ### Phase 3: Predictions and Rivals

  To avoid the Insulation Worry, your view must predict things rivals don't.

  1.  **Prediction vs. Pluralism:** Your view predicts that **trade-offs are always possible in principle**. A Pluralist (e.g., Griffin, Nussbaum) predicts rational agents might face genuine dilemmas where no trade-off is rational. If you find cases where agents are *rationally required* to refuse a trade (not just psychologically unable), your view loses.
  2.  **Prediction vs. Attitudinal Hedonism:** Your view predicts **phenomenal changes without attitude changes**. If I am forced to listen to music I dislike, but the sensory qualia shifts to "pleasant" (perhaps via drugs) while my attitude remains "I hate this," your view says wellbeing increased. Attitudinalism says it didn't. (This is a hard test case).
  3.  **Prediction vs. Disjunctivism:** Your view predicts **phenomenal continuity**. If I move from eating chocolate to solving a math problem, there should be a detectable overlapping "tone" even if the objects change. Disjunctivism says there is no overlap, only a family resemblance.

  ---

  ### Phase 4: Addressing Your Weighting

  You said: *"I'd be most moved by the clean motivation/affect splits and by cases where introspection really can't find a common feel... I'd be least moved by armchair insistence that two pleasures just feel obviously, totally different."*

  **Assessment:** Your ranking is **correct**, but you are underestimating the "Introspection" point.
  *   **Motivation/Affect:** This is indeed the killer. If the "feel" doesn't motivate, it's not the good. If it does motivate, it looks like desire. This is the pincer movement that kills pure Qualitative Hedonism. You are right to prioritize this.
  *   **Introspection:** You dismiss "they feel different" claims too easily. The issue isn't that people *say* they feel different; it's that the *structure* of the experience (e.g., the intentionality of schadenfreude vs. the sensory nature of a massage) makes isolating a "common tone" phenomenologically implausible. It's not just unreliable introspection; it's that the "tone" might be a **theoretical posit** rather than a lived reality. If the "dimension" is never experienced *as* a dimension, but only inferred, have you really defended *Hedonism* (which is usually a claim about experience) or a functionalist theory of value?

  **Correction:** Move the "Introspection/Structure" worry higher. It's not just "armchair insistence"; it's the claim that your "dimension" is a philosopher's fiction, not a phenomenological fact.

  ---

  ### Phase 5: The Verdict

  **Is the view exposed?**
  Yes. Highly.

  **Does it survive?**
  **No, not in its current form.**

  **Why:**
  You cannot maintain that pleasantness is a **single scalar qualitative property** *and* that it accounts for **value/motivation** without collapsing into Attitudinal Hedonism or admitting the property is adverbial (which breaks the "currency" model). The Motivation Gap shows the "feel" is not the driver of value; the Adverbial objection shows the "feel" is not a distinct part of the experience to be summed.

  **The Survival Path:**
  To save the core insight (that there is a common currency of wellbeing), you must pivot to **Phenomenal-Functional Hedonism**.
  1.  **Concede** that pleasantness is a *manner of attending* (adverbial) that presents the object as *to-be-pursued*.
  2.  **Concede** that the "scalar" nature is defined by the *strength of the motivational pull* phenomenologically experienced, not just a raw qualia intensity.
  3.  **Accept** that this makes your view a hybrid: The "feel" is the experience of the "attitude."

  If you make these concessions, you survive, but you are no longer a pure "Qualitative Hedonist" in the traditional Sidgwick/Mill sense. You are a **Phenomenological Attitudinalist**. If you refuse these concessions, the Motivation Gap and the Category Mistake will crush the view.

  **Final Word:**
  Your intuition about the single dimension is likely capturing a real *functional* unity (the brain's reward system), but you are misdescribing it as a *qualitative* unity. Keep the functional unity, drop the claim that it's a simple "feeling" independent of desire, and you have a defensible, modern theory of wellbeing. Stick to the "pure feel" story, and you will be defeated by the gap between what feels good and what we find good.
