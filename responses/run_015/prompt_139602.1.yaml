answer: |-
  Your friend is logically right about the *risk*, but wrong about the *solution*.

  Here is the reality: Changing payment terms after 24 months of flawless history is not a risk mitigation strategy; it is a signal of distrust. In a trade relationship, that signal often creates the very behavior you are trying to prevent. If you suddenly tell Marek, "I need to inspect and hold payment now," he will hear, "I think you're going to screw me because you're leaving."

  That hurts his pride, damages the goodwill you've built, and ironically gives him a reason to resent you on these last three jobs. You want him prioritizing your cabinets as he packs up his shop, not deprioritizing you because you've become a hassle.

  However, your friend is right that the "finite game" changes the psychology. You cannot rely on the *future* leverage of "I'll hire you again next month." You have to rely on *current* leverage and professional pride.

  Here is how you handle the next three months without burning the bridge or exposing yourself to risk.

  ### 1. Keep the Payment Terms, Change the Inspection Timing
  "Pay on delivery" does not mean "pay before looking." It means payment is exchanged at the moment of delivery.
  *   **Do not** switch to net-30 or hold checks for a week.
  *   **Do** make it clear that inspection happens *before* the check is handed over, on the day of delivery.
  *   If a job looks bad, you don't pay *that day*. You say, "There are issues here we need to resolve." That is not a change in terms; that is standard quality control.

  ### 2. Address the "Wood vs. Work" Ambiguity Directly
  This is the bigger risk. If you reject a cabinet because it looks warped, and Marek knows the wood was garbage, he will feel unfairly treated. If you accept it, your client gets mad.
  *   **The Fix:** Have a conversation about the lumber *before* the next job starts.
  *   **The Script:** "Marek, I value our work together. Since you're moving, I want to make sure these last three jobs are perfect send-offs. I've realized sometimes I can't tell if a warp is the wood or the finish. For these last few, if you get a piece of lumber that looks questionable, flag it for me *before* you finish it. I'd rather swap the wood than have a debate after."
  *   **Why this works:** It shifts the dynamic from "I'm judging you" to "We are solving a material problem together." It gives him an out for bad wood without accusing him of bad work.

  ### 3. Leverage the "End Date" for Good, Not Fear
  Your friend thinks the end date means Marek won't care. Often, the opposite is true. Good craftsmen care about their reputation and how they leave a relationship.
  *   Treat these last three jobs as a "closing set."
  *   Explicitly acknowledge the relationship. "I'm sad to see you go, you've been great to work with."
  *   Offer to write him a recommendation or be a reference for his new location. This gives him a *new* incentive to care: he wants a glowing reference for his next chapter, not a disgruntled former client.

  ### Summary of Action
  1.  **Do not change the written/verbal terms.** Pay on delivery, as always.
  2.  **Inspect rigorously at delivery.** If it's bad, the check stays in your pocket until it's fixed. That's not distrust; that's business.
  3.  **Have the "Lumber Talk."** Agree that questionable wood gets flagged *before* finishing.
  4.  **Offer a Reference.** Give him a reason to care about his reputation with you beyond the next three months.

  Your instinct to protect the relationship is correct. Trust is an asset you've built over two years; don't liquidate it now. Just verify the goods before you cash out.
