prompt: |-
  hey — something I keep going back and forth on and would like a real opinion about.

  I subcontract cabinet finishing to the same guy, Marek, roughly one job a month, and for almost two years its worked great: I pay on delivery, he never asks for a deposit, nothings in writing, and neither of us has ever stiffed the other. Two things changed recently. He told me he's relocating out of state in about three months, so there's a clear end date to this arrangement now. And separately, I've realized I often genuinely can't tell whether a job came out badly because he rushed it or because the lumber was already warped when it reached him — I'd guess that's true for maybe one job in five, and I'm just guessing in those cases.

  A friend says the relocation is decisive: with no next job after this one, he has no reason to care anymore, so I should stop paying on delivery and hold payment until I've inspected each finished job myself. The logic makes sense but it feels like it throws away two years of something real. And the second thing nags at me too — if I start punishing every job that looks bad, sometimes I'll be punishing him for the wood, and I have a feeling that could spiral into us both acting worse than we want to.

  So: is my friend right? What should I actually do over these last three months, and does the fact that I'm sometimes guessing about who's at fault change the answer?
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the Situation:**
      *   **Relationship:** Subcontractor (Marek) and Contractor (User).
      *   **Duration:** Almost 2 years, roughly 1 job/month.
      *   **Terms:** Verbal agreement, pay on delivery, no deposit, perfect payment history (no stiffing).
      *   **Change 1 (The End Date):** Marek is moving out of state in 3 months. This creates a "finite game" scenario.
      *   **Change 2 (Quality Ambiguity):** User can't always distinguish between bad workmanship and bad material (lumber warping) on ~20% of jobs.
      *   **Friend's Advice:** Change payment terms (hold payment until inspection) because the relationship is ending, so Marek has no incentive to care.
      *   **User's Hesitation:** Feels like betraying trust built over 2 years. Worried that penalizing for material issues will damage the relationship unnecessarily.

  2.  **Evaluate the Friend's Logic:**
      *   *Premise:* "No next job = no incentive to care."
      *   *Counter-premise:* Reputation, professional pride, and habit matter. Marek has been reliable for 2 years. People don't usually flip a switch on their work ethic overnight unless there's a specific grievance.
      *   *Risk:* Changing terms suddenly after 2 years of trust can be seen as an insult. It signals "I don't trust you anymore." This *could* actually cause the decline in quality the friend fears (self-fulfilling prophecy).
      *   *Validity:* The friend is right about the *risk* of the end date, but wrong about the *solution* (changing payment terms abruptly).

  3.  **Evaluate the Quality Ambiguity Issue:**
      *   User admits ~20% of the time, they aren't sure if it's Marek's fault or the wood's fault.
      *   If the User starts withholding payment or complaining aggressively based on this ambiguity, Marek will feel unfairly treated.
      *   This is a communication/process problem, not necessarily a trust problem.

  4.  **Determine the Best Course of Action:**
      *   **Goal:** Ensure quality on the last 3 jobs without destroying a good relationship or creating unnecessary conflict.
      *   **Payment Terms:** Keep them the same. Changing them now is too aggressive and signals distrust. Pay on delivery as usual.
      *   **Inspection:** *Do* inspect, but do it *before* payment if possible, or immediately upon delivery. The current term is "pay on delivery." Does that mean "pay before looking" or "pay when he hands it over"? Usually, it implies upon receipt. The User should clarify that inspection happens at receipt.
      *   **Communication:** Have a candid conversation. Acknowledge the ending, express appreciation, and address the quality ambiguity *collaboratively*.
      *   **The "Wood vs. Work" Issue:** This needs to be addressed directly. "Marek, sometimes I can't tell if it's the wood or the finish. Since we only have a few left, let's make sure we're on the same page."

  5.  **Drafting the Advice (Iterative Process):**

      *   *Tone:* Empathetic, practical, business-focused but human.
      *   *Direct Answer:* No, your friend isn't entirely right. Changing terms is risky.
      *   *Reasoning:* Trust is an asset. Burning it saves little money but risks the final 3 jobs.
      *   *Action Plan:*
          1.  Keep payment terms (honor the handshake).
          2.  Change the *inspection* process (inspect before handing over the check, even if it's same-day).
          3.  Have "The Talk" (address the moving and the wood issue).
          4.  Bonus: Offer a small incentive? (Maybe a completion bonus? Or just a good reference?)

      *   *Refining the "Wood vs. Work" point:* This is the trickiest part. If the user complains about warped wood, Marek gets mad. If the user accepts warped wood, the client gets mad.
      *   *Solution:* Shift the burden of identification to Marek. "If the wood is bad, tell me *before* you finish it." Or, "If you see warped wood, flag it."
      *   *Actually, better:* Acknowledge the ambiguity. "I know sometimes the wood is tricky. On these last few, if you see questionable lumber, let's talk before you spend time on it."

  6.  **Finalizing the Recommendation:**
      *   **Don't change payment terms.** It insults him.
      *   **Do change the inspection dynamic.** Inspect *at* delivery, before the money changes hands. "Pay on delivery" doesn't mean "blindly."
      *   **Have a frank conversation.** Acknowledge the end date. Address the quality ambiguity.
      *   **Why?** Because 3 months is short. Preserving goodwill ensures he prioritizes your jobs before he leaves. If you insult him, he might deprioritize you.

  7.  **Structure of the Response:**
      *   Direct Answer (Friend is half-right, but the prescription is wrong).
      *   The Trust Asset (Why changing terms hurts).
      *   The "End Game" Psychology (Why he still cares).
      *   The Quality Ambiguity (How to solve this without blame).
