  8.  **Self-Correction/Edge Case:** What if Marek *does* try to pull a fast one?
      *   Risk mitigation: Inspect thoroughly. If it's bad, don't pay *that day*, but don't change the *policy*. Say "I need to fix this with you, payment held until resolved." That's different than a policy change.
      *   Wait, the prompt says "pay on delivery." If I inspect and it's bad, I don't pay. That's standard. The friend suggests holding payment *until inspection* (implying a delay). The advice should be: Inspect *at* delivery. No need to wait days.

  9.  **Final Polish:** Ensure the distinction between "changing terms" and "enforcing standards" is clear. The friend suggests a policy shift (net-30 or similar). I suggest maintaining terms but increasing vigilance + communication.

      *(Self-Correction during drafting)*: I need to be careful about the "wood vs. work" issue. If the user is guessing, they might be rejecting good work or accepting bad work. The advice should be to align on standards for the final three jobs.

      *Revised Plan:*
