answer: |-
  The phenomenon you are describing has an established name in the sociology of human rights and genocide studies, though it is often conflated with broader forms of denial. The umbrella term is **Interpretive Denial** (coined by Stanley Cohen), but the specific maneuver you are isolating—conceding the horror while contesting the legal/moral category to avoid liability—is most precisely termed **Categorical Denial**.

  However, because "Categorical Denial" is sometimes used loosely to cover any dispute over labels, and because you noted that existing notions of denial feel "not cleanly" applicable to your case (since the speaker concedes the moral catastrophe), I will refine the carving you requested. The specific rhetorical dynamic you identified—where the concession of facts is used to inoculate the speaker against accusations of bad faith while retaining the exculpatory label—deserves a sharper definition.

  Here is the carving, the test, and the boundary cases.

  ### The Name
  While **Interpretive Denial** is the sociological parent category, the specific move in the context of mass atrocities is best named **Categorical Denial**.

  If you require a term that captures the *rhetorical mechanism* you described (the concession reinforcing the refusal), I propose the descriptive term **Exculpatory Concession**. This names the specific tactic: granting the empirical horror to secure the credibility needed to withhold the legal/moral classification that triggers liability.

  ### The Carving: Distinguishing the Move
  To separate the *Categorical Denier* from the *Honest Definer*, you must look not at the argument itself (which can be identical in both cases) but at the **consistency of application** and the **teleology of the definition**.

  **1. Versus Honest Definitional Scruple**
  *   **The Honest Definer:** Applies the definition symmetrically. If they argue that "specific intent to destroy" is required to classify an event as genocide, they apply that same rigorous standard to atrocities committed by their own side, their allies, or groups they sympathize with. They acknowledge that if the evidence met the threshold, the label would apply, regardless of political cost.
  *   **The Categorical Denier:** Applies **Asymmetric Rigor**. They demand a hyper-strict reading of *mens rea* (intent) for the accused party while accepting looser, implied, or structural interpretations of intent for their own side. The definition is not a tool for description, but a shield for protection.

  **2. Versus Ordinary Minimization**
  *   **Minimization:** Attacks the *empirical premises* (e.g., "The numbers are exaggerated," "Most were combatants").
  *   **Categorical Denial:** Accepts the *empirical premises* but attacks the *normative conclusion*. The body count is not the battleground; the *meaning* of the body count is.

  **3. Versus Legalistic Defense (Mens Rea)**
  *   **Legal Defense:** A defense lawyer's duty is to their client, not to historical consensus. They argue for the narrowest possible interpretation of intent to secure acquittal. This is role-ethical.
  *   **Categorical Denial:** The speaker claims the role of a historian or neutral observer but adopts the lawyer's tactic. They claim to be describing "what happened" while actually arguing "what can be punished." The mismatch between the claimed role (historian) and the actual function (advocate) is the tell.

  **4. Versus Mainstream Historical Revision**
  *   **Revisionism:** Seeks to change the *facts* based on new evidence (e.g., new archives show the order came from a local commander, not the capital).
  *   **Categorical Denial:** Accepts the *facts* (including the chain of command) but changes the *threshold of proof* for intent. They argue that even if the state knew death would occur, that does not constitute "intent to destroy," shifting the goalposts of the definition rather than the evidence of the event.

  ### The Principled Test
  Since the arguments can look identical on paper, you cannot distinguish the two solely by the text of the argument. You must apply the **Counterfactual Consistency Test** and the **Liability Test**.

  **1. The Counterfactual Consistency Test**
  Ask the speaker: *"If the archival evidence emerged tomorrow proving specific intent beyond a reasonable doubt, would you accept the classification?"*
  *   **Honest Definer:** "Yes. If the evidence proves intent, it is genocide."
  *   **Categorical Denier:** Will often move the goalposts again (e.g., "Even then, the legal convention doesn't apply retroactively," or "The definition itself is flawed."). If the refusal persists even when the empirical condition is met, it is denial, not scruple.

  **2. The Liability Test**
  Ask: *"Does your objection to the label stem from descriptive inaccuracy, or from the consequences of the label?"*
  *   **Honest Definer:** Worries that misapplying the label dilutes its meaning for future prevention.
  *   **Categorical Denier:** Worries that applying the label triggers specific obligations (reparations, territory, national shame). If the practical consequences are the primary driver of the refusal, it is Categorical Denial.

  ### Boundary Cases

  **1. Clear Instance (Falls Under the Term)**
  *   **The Turkish State's Position on 1915:** The official stance concedes that many Armenians died during deportations (empirical concession) and acknowledges it was a tragedy (moral concession). However, it rigorously contests the "intent to destroy" element, attributing deaths to wartime chaos, disease, and local rogue actors rather than central policy.
  *   *Why:* The empirical concession is used to inoculate against the genocide label, which would trigger legal and territorial liabilities. The rigor on "intent" is not applied symmetrically to other historical events involving Turkish state violence.

  **2. Clear Non-Instance (Does Not Fall Under the Term)**
  *   **The Khmer Rouge and the 1948 Convention:** A historian argues that while the Khmer Rouge killed 1.7 million people, much of the killing does not fit the *legal* definition of genocide under the 1948 Convention because the victims were largely political or class-based, not national, ethnical, racial, or religious groups (excepting the Cham and Vietnamese minorities).
  *   *Why:* This is **Honest Definitional Scruple**. It accepts the horror and the scale. It relies on a specific, existing legal constraint (the 1948 exclusion of political groups) rather than inventing a new threshold for intent. It does not seek to exonerate the regime (which is still condemned as Crimes Against Humanity), but to maintain legal precision.

  **3. Undecided Instance (The Boundary Zone)**
  *   **The Holodomor (Ukrainian Famine of 1932–33):** Scholars debate whether Stalin's policies constituted a specific intent to destroy Ukrainians as a national group, or whether it was a brutal byproduct of collectivization and anti-kulak policy that disproportionately hit Ukraine.
  *   *Why:* Here, the empirical evidence on *intent* is genuinely ambiguous. Archives show harsh policies and knowledge of death, but a "smoking gun" order to destroy the group *as such* is debated. A speaker arguing against the genocide label here *might* be exercising honest scruple due to evidentiary gaps, or *might* be engaging in Categorical Denial to protect a political narrative. Without knowing if they would accept the label should new evidence of intent emerge, you cannot classify the move definitively.

  ### Summary for Your Panel
  When you encounter this move, do not argue the facts (they have already conceded them). Argue the **consistency**.

  If they say, "We agree people died, but 'genocide' requires intent," ask: *"Do we apply this same standard of intent to the atrocities committed by our own state in [Other Conflict]? If we found evidence of intent there, would you support the label?"*

  If the answer is no, or if the standard shifts, you are not in a historical debate; you are managing **Categorical Denial**. The concession of horror is not an act of transparency; it is the price they pay to keep the label off the wall.
