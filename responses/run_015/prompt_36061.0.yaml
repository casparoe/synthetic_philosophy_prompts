      *   *Game Theory:* Shift from PD/ToC to Chicken/Threshold Public Goods. Explain why this matters for the "Regulation" conclusion. (Hardin says *must* coerce; Chicken says *must* coordinate/commit).
      *   *Malice:* Address the "locally rational" claim. It's load-bearing for the *type* of intervention (incentive restructuring vs. policing).
      *   *Conclusion:* The Hardin framing pushes towards *external* control. A Chicken/Stag framing allows for *internal* coordination or technical solutions. The "Regulation is the only way" conclusion is weakened but not destroyed, but the *mechanism* of regulation changes.

  8.  **Final Polish:** Check against specific constraints.
      *   Did I audit the analogy? Yes.
