  10. (Final thought on the "Replacement Lemma"): If every data set can be fit by drift *or* selection, then selection is empirically empty *unless* we have priors. This is a strong point for the user. I need to acknowledge that while model selection exists, the *logical* possibility of underdetermination remains a philosophical vulnerability, even if not a practical one.

