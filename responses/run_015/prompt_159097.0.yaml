answer: |-
  This is an exceptionally sharp dissection of a classic debate. You have effectively reconstructed the "tautology objection" and fortified it with modern philosophy of science concepts (Lakatosian research programmes, Duhem-Quine underdetermination). Your friend is arguing from the perspective of *practice* (how evolutionary biologists actually work), while you are arguing from the perspective of *logic* (the structural relationship between the theory and the evidence).

  Both of you are partially right, but your position is more exposed than you might feel, primarily because the definition of "fitness" has shifted since Popper's 1974 verdict. However, your intuition that Natural Selection (NS) functions as a framework rather than a single hypothesis is philosophically robust.

  Here is an analysis of what would count against your position, ranked by severity, followed by the historical cases and the meta-analysis you requested.

  ### 1. Evaluating Your Three Scenarios

  #### The Replacement Lemma (Underdetermination)
  *The Claim:* For any history of frequencies, there exists a selection model and a neutral model that fit the data equally well.
  *Verdict:* **Merely Awkward.**
  *Analysis:* This is the problem of *identifiability*. It is mathematically true that drift and selection can produce similar trajectories over short time scales. However, this is not unique to evolutionary biology; it is standard inverse problem territory (like geophysics or cosmology).
  *Why it doesn't vindicate Popper:* Science resolves underdetermination through **model selection criteria** (AIC, BIC) and **independent evidence**. If a selection model fits the data with 2 parameters and a neutral model requires 50 parameters (e.g., fluctuating population sizes, bottlenecks), the selection model is preferred. Furthermore, if we have independent evidence of the mechanism (e.g., we see the predator eating the slow prey), the underdetermination collapses.
  *Concession:* You are right that *in isolation*, frequency data is often insufficient. But a theory is not falsified because data is sometimes ambiguous; it is falsified if it *cannot* be distinguished from noise even with auxiliary data. Evolutionary biology usually can.

  #### Shadow Populations (Engineering Predictions)
  *The Claim:* We predict fitness from biomechanics/physiology *before* measuring survival, and survival tracks the prediction.
  *Verdict:* **Fatal to the Tautology Charge.**
  *Analysis:* This is the strongest empirical counter to your position. If fitness is defined *solely* as actual reproductive success, you cannot predict it beforehand. If you can predict it based on thermodynamic efficiency, aerodynamic lift, or enzymatic turnover rates, then fitness is a **causal property** of the organism-environment interaction, not a label applied post-hoc.
  *The Duhem-Quine Defense:* You suggest this only tests the "engineering model." This is partially true, but it tests the *link* between the engineering model and reproduction. That link *is* the hypothesis of natural selection. If organisms with theoretically superior engineering consistently failed to reproduce better than inferior ones across hundreds of lineages, the principle of Natural Selection would be in deep trouble.
  *Why it hurts your view:* It demonstrates that fitness is measurable independently of the outcome. It breaks the "survival of the fittest = those who survive are fittest" loop.

  #### Stasis (Unchanged Lineages)
  *The Claim:* Lineages don't change despite environmental shifts; biologists say "stabilizing selection."
  *Verdict:* **Merely Awkward (but risky).**
  *Analysis:* You are correct that "stabilizing selection" can be used as an immunizing stratagem. However, stabilizing selection is not just a label; it makes specific predictions about genetic variance (it should be depleted around the mean) and the shape of the fitness landscape (a peak, not a slope).
  *The Risk:* If we observe stasis *and* high genetic variance *and* no cost to deviation, the stabilizing selection explanation fails. In those cases, biologists often switch to "constraint" or "drift." The fact that they *do* switch indicates the selection hypothesis is falsifiable. If they *never* abandoned selection for stasis, you would be right. But they do.

  ### 2. Historical Defeaters: When Selection Lost

  You asked for a case where a selectionist prediction was made, failed, and the field treated it as counting against selection. The gold standard is **The Neutral Theory of Molecular Evolution**.

  *   **The Prediction:** Prior to the late 1960s, the "Selectionist Orthodoxy" held that most genetic variation within and between species was maintained by natural selection (balancing selection).
  *   **The Test:** Motoo Kimura and others analyzed the rate of molecular substitution. They predicted that if selection were driving these changes, the rate would vary wildly depending on population size and environmental pressure.
  *   **The Failure:** The data showed a "molecular clock"—a steady rate of substitution that correlated with mutation rate, not environmental change.
  *   **The Consequence:** The field largely accepted that at the molecular level, **natural selection was not the primary driver.** Drift was.
  *   **Why this matters for you:** This is a direct falsification of the claim "All evolutionary change is driven by selection." The core of the Selectionist Programme was breached. Biologists did not say "Ah, but there is cryptic selection on the molecules." They conceded the domain of neutrality.

  **Other Notable Cases:**
  *   **The Spandrels of San Marco (Gould & Lewontin, 1979):** This wasn't a single experiment, but a methodological correction. Many specific adaptationist stories (e.g., the specific function of certain bone sutures) were rejected as non-adaptive byproducts. The field accepted that not every trait is a product of selection.
  *   **Lande's Quantitative Genetic Models:** In specific field studies (e.g., Soay sheep, Darwin's finches), predicted responses to selection (based on measured selection gradients) sometimes fail to materialize. When this happens, biologists do not say "Selection didn't happen." They say "Our estimate of the selection gradient was wrong" OR "Genetic constraints prevented the response." This is the Duhem-Quine problem in action, *but* if the failure is consistent across systems, the selectionist model is discarded for that trait.

  ### 3. Ranking the Defeaters

  Here is how a defender of your view (the "Popperian/Lakatosian") should rank these challenges, from Fatal to Awkward.

  1.  **Fatal: Independent Measurement of Fitness (Shadow Populations).**
      *   *Why:* Your core argument rests on fitness being defined *by* survival. If fitness can be measured *prior* to survival (via physiology/biomechanics) and predicts survival, the tautology is broken. This forces you to concede that NS is an empirical causal claim, not a definitional truth.
      *   *Concession:* You must admit that *specific models* of selection are falsifiable.

  2.  **Severe: The Neutral Theory Acceptance.**
      *   *Why:* It shows the field is willing to reject selection as the explanation for evolutionary change in specific domains. If NS were a metaphysical framework that explained everything, the Neutral Theory would have been absorbed as "cryptic selection." It wasn't.
      *   *Concession:* You must admit NS is not a universal explanation for all frequency changes.

  3.  **Awkward: Model Underdetermination (Replacement Lemma).**
      *   *Why:* This highlights that NS is often a *statistical inference* rather than a direct observation. It supports your view that NS is a "framework for interpreting data," but it doesn't prove it's *unfalsifiable*, just that it's hard to test in isolation.
      *   *Concession:* You can maintain that NS is a "principle" (like Least Action in physics) rather than a "law," but you cannot claim it is empirically empty.

  4.  **Dismissible: Stasis and Stabilizing Selection.**
      *   *Why:* While ad hoc usage exists, stabilizing selection makes testable predictions about variance. Dismissing this requires ignoring the quantitative genetics machinery that accompanies the claim.

  ### 4. The Meta-Question: What Falsifies Your Claim?

  Your claim is: *"Natural Selection, as used, is a metaphysical research programme, not a falsifiable empirical theory."*

  This is a claim about the **sociology and logic of biological practice**. To falsify *your* claim, one does not need to prove Natural Selection is true. One needs to prove that biologists treat it as falsifiable and have the capacity to reject it.

  **What would falsify your philosophical position?**
  1.  **Routine Rejection:** If there were a standard protocol in evolutionary biology where a hypothesis of the form "Trait T is an adaptation for Function F" is routinely rejected *and left rejected* (i.e., not replaced by "Function G" or "Cryptic Selection"), then NS is functioning as a falsifiable theory.
      *   *Evidence:* The Neutral Theory case above does exactly this.
  2.  **A Priori Fitness:** If the measurement of fitness components (viability, mating success) is routinely done *independently* of total reproductive success and used to predict total success, the "tautology" charge is empirically false.
      *   *Evidence:* Life-history theory does this constantly (e.g., measuring clutch size vs. offspring survival probability independently).
  3.  **Popper's Own Retraction:** You mentioned Popper walked this back. In a 1978 interview, Popper stated: *"I have changed my mind about the testability and logical status of the theory of natural selection... The theory of natural selection may be so formulated that it is far from tautological."*
      *   *Why:* He accepted the **propensity interpretation**. If fitness is a propensity (a dispositional property like solubility), it is testable. A sugar cube might not dissolve (it gets swept away), but it is still soluble. Similarly, an organism might not reproduce (it gets hit by lightning), but it still had high fitness.

  ### 5. Final Verdict: Where You Stand

  You are defending a **Lakatosian** position using **Popperian** language.
  *   **Popper** wanted theories to be falsifiable.
  *   **Lakatos** argued that research programmes have a "hard core" (protected from falsification) and a "protective belt" (auxiliary hypotheses that take the hits).

  You are arguing that Natural Selection is the **Hard Core**.
  Your friend is arguing that specific Selection Hypotheses are the **Protective Belt**.

  **The Synthesis:**
  You are right that "Natural Selection" *in the abstract* (the principle that differential reproduction occurs due to heritable trait differences) is nearly unfalsifiable because it is a condition for the existence of a population over time. If it didn't happen, the population would likely go extinct or be random noise. In this sense, it is a **framework principle** (like "energy is conserved").

  However, your friend is right that **specific selectionist explanations** (e.g., "The giraffe's neck evolved due to selection for reaching high leaves") are highly falsifiable. They make risky predictions about biomechanics, fossil records, and genetic signatures. When these fail (as with the Neutral Theory or specific spandrels), the specific claim is rejected.

  **How exposed are you?**
  Your position is exposed on the **tautology** front. That battle was lost in the 1970s with the propensity interpretation. If you cling to "fitness = actual survival," you are arguing against the current definition used by the field.

  However, your position is **robust** on the **metaphysical framework** front. If you modify your claim to: *"The General Principle of Natural Selection functions as a regulative ideal or metaphysical framework, while specific Adaptationist Hypotheses are the falsifiable empirical content,"* you are on very solid ground. This is essentially the consensus in modern philosophy of biology (e.g., Elliott Sober).

  **The Decisive Move:**
  Concede the tautology point (fitness is a propensity). Stand your ground on the framework point. Argue that the *General Theory* is unfalsifiable (because it defines the domain of biology), but *Specific Models* are falsifiable. If you claim the *General Theory* is empirically testable in isolation, you are exposed. If you claim it is a framework that generates testable models, you are safe, but you must admit that this makes it "scientific" in the Lakatosian sense, not the strict Popperian sense.

  **What falsifies your claim?**
  If biologists could demonstrate a case where they measured fitness *propensities* accurately, predicted reproductive success, failed completely, and concluded **"Natural Selection is not operating here,"** without blaming the environment, the measurement, or drift—then the General Principle itself would be falsifiable. Since they usually blame drift or measurement, your Lakatosian view holds. But since they *do* blame drift (Neutral Theory), they acknowledge the General Principle has limits. That is the crack in the armor you are looking for.
