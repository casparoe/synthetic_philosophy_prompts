      *   **Section 1: The Tautology & Propensity:** Address the core definition. Explain why the friend is mostly right technically, but the user is right structurally.
      *   **Section 2: Evaluating the Three Scenarios:**
          *   Replacement Lemma (Underdetermination): Ordinary science, not metaphysical.
          *   Shadow Populations (Engineering): The biggest threat to the user's view.
          *   Stasis: Can be ad hoc, but often testable.
      *   **Section 3: Historical Defeaters:** The Neutral Theory is the smoking gun.
      *   **Section 4: Ranking the Defeaters:** Fatal vs. Awkward.
      *   **Section 5: The Meta-Question:** Can the philosophical claim be falsified? (Yes, by showing independent measurement of fitness is routine and predictive).
      *   **Conclusion:** Summarize the nuance. NS is a *principle* (like least action) that generates *models* (which are falsifiable). The user is conflating the principle with the models.

  7.  **Refine the Tone:**
      *   Ensure I don't sound like I'm taking the friend's side blindly. The user's Popperian/Lakatosian intuition has merit (the "Adaptationist Programme" critique).
      *   Use precise terminology (propensity, ceteris paribus, Duhem-Quine, Hard/Soft selection).
