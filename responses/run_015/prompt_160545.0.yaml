answer: |-
  You are right to suspect the framing is muddled, because your two sources are answering different questions while pretending to address the same one. The physicist is talking about physical implementation and causality, while the philosopher is talking about logical consistency and mathematical description. They are not strictly disagreeing about the math, but they are disagreeing about whether the math matters once you introduce matter. To audit this properly, you need to separate the idealized model from the physical reality, because the bouncing ball analogy works only in the idealized model and fails in the physical reality, which undermines the physicist's claim that ordinary matter performs supertasks.

  Let us walk through the mapping you asked for. In the ball case, the variable that matters is position, which is a continuous quantity. As time approaches the one-minute mark, the position of the ball converges to zero, meaning it sits on the floor. The velocity also converges to zero. Because the function describing the ball's position is continuous, there is no ambiguity about where the ball is at the limit. In the lamp case, the variable is the state of the circuit, which is discrete. It is either on or off, one or zero. As time approaches the one-minute mark, the state oscillates between one and zero without settling. There is no number that this sequence converges to. So what plays the role of the lamp's state in the ball case is not the position, but rather a hypothetical property that flips discretely, like whether the ball is currently moving up or down. If you asked whether the ball is moving up or down at the one-minute mark, you would get the same paradox as the lamp, because that state does not converge even though the position does.

  This is where the mapping breaks and where your suspicions are correct. The disanalogy that does the work for the philosopher is continuity. The ball's position is continuous, so the limit exists. The lamp's state is discrete, so the limit does not exist. The philosopher is right that the description leaves the state open, and this is a fact about the logic of the description, not necessarily about physical possibility. The physicist is right that in the real world, nothing switches infinitely fast, but he is wrong to claim that ordinary matter completes infinitely many bounces. In classical mechanics, the ball bounces infinitely, but in quantum mechanics and real material science, the bouncing stops after a finite number of bounces when the energy drops below a threshold where the concept of a bounce loses meaning. So the physicist's claim that ordinary matter pulls off a supertask is scientifically false, even if it is classically idealized. He is using a classical model to make a claim about physical reality.

  Regarding the physicist's point about thermal inertia, this dissolves the observable paradox but relocates the logical one. If you measure the brightness or temperature of the bulb, you are measuring a continuous variable like the ball's position, and that variable will converge to a specific value based on the average power input. But that does not tell you the state of the switch. The puzzle of Thomson's lamp is specifically about the logical state of the switch at the limit, not the thermal state of the filament. By pointing to the heat, the physicist is changing the question from is the switch on or off to how much energy is in the system. This is a valid physical response but it sidesteps the logical puzzle the philosopher is discussing. A better analogy for what the lamp is actually doing is a square wave function where the frequency approaches infinity. The value of the function at the limit is undefined, whereas the integral of the function over time is defined. The heat corresponds to the integral, the switch state corresponds to the function value.

  So here is where the consensus lies among people who work on this. It is settled that mathematically, the state of the lamp at the limit is undefined because the sequence does not converge. It is also settled that physically, a supertask cannot be performed because no mechanism can switch states infinitely fast within a finite time due to constraints like the speed of light and quantum limits. The contention is only about what this implies for the concept of infinity. The philosopher argues that the logical indeterminacy shows that some descriptions of supertasks are incomplete, not that infinity is impossible. The physicist argues that because physical systems cannot complete supertasks, the logical puzzle is irrelevant to reality. Both are correct within their own domains, but the bouncing ball is a dangerous analogy for your piece because it smuggles in continuity where the lamp problem relies on discreteness. If you use the ball, you must specify that you are looking at its position, not its direction of motion, otherwise you recreate the lamp paradox.

  Your best path forward is to clarify that the ball example only works because we care about where the ball is, not whether it is going up or down. If we cared about the direction, the ball would be just as paradoxical as the lamp. The physicist's conclusion survives only if you accept that physical laws override logical puzzles, which is true for engineering but not for metaphysics. The philosopher's conclusion survives because it correctly identifies that the indeterminacy is a feature of the function defining the state, not a proof that time or infinity is broken. You should tell your readers that the ball does not complete a last bounce, it only has a limit point it approaches, and that the moment you ask about the state of the system at that limit point for a discrete variable, the answer disappears unless you add new physical rules like inertia. The physicist is trying to add physical rules to solve a logical puzzle, and the philosopher is pointing out that the logical puzzle remains even if the physical one is resolved. Neither is wrong, but they are not having the same argument.
