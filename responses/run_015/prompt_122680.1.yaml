answer: |-
  # Modal Epistemology: A Decision Tree for Conceivability & Possibility

  **To the Reader:** This handout is designed to help you locate your own pre-theoretic commitments within the logical space of modal epistemology. Do not look up the "correct" answers. Answer the questions based on your intuitions about cases and your assessment of your own cognitive faculties. The goal is to see which philosophical position your answers naturally entail, not to select a position and reverse-engineer the answers.

  ---

  ## Part I: The Logical Space (The Decision Tree)

  Start at the top. Follow the branch that matches your intuition.

  ### Node 1: The Possibility Drift Question
  *Imagine you are reflecting on a complex scenario $S$. You check for contradictions. You find none. Now imagine a version of yourself with significantly more working memory and reasoning time, reflecting on $S$ for weeks rather than minutes. They find they can conceive of even *more* variations of $S$ that you initially ruled out, simply because they can hold more variables in mind without collapse.*

  **Q1:** Does this expansion of the "conceivable" set reflect a deeper grasp of modal reality, or does it suggest that "conceivability" is sensitive to cognitive limits in a way that drifts away from truth?
  *   **(A) Drift is a Defeater:** The expansion suggests conceivability tracks cognitive capacity, not modal reality. Idealization does not guarantee stability. $\rightarrow$ *Go to Node 2.*
  *   **(B) Drift is Excluded:** "Ideal conceivability" is *defined* as what survives unlimited reflection. If the set expands, the earlier limit was just error. Ideal conceivability converges on truth. $\rightarrow$ *Go to Node 3.*

  ### Node 2: The Presumption Question (For Drift Defeaters)
  *Suppose you conceive that $P$, and you have no specific reason to doubt your reasoning (no fatigue, no known defeaters).*

  **Q2:** Does this provide *any* justification for believing $P$ is possible, or is conceivability inert until corroborated by something else (like theory or perception)?
  *   **(A) Inert:** Conceivability carries basically no modal weight on its own. $\rightarrow$ **Leaf: Modal Skepticism**
  *   **(B) Prima Facie:** It provides defeasible evidence. It can be overridden, but it counts for something. $\rightarrow$ **Leaf: Modest Modal Rationalism**

  ### Node 3: The Asymmetry Question (For Drift Excluders)
  *Consider the evidential weight of conceivability.*

  **Q3:** Is the strength of evidence provided by "I can conceive $P$" for *Possibility($P$)* equal to the strength of evidence provided by "I cannot conceive $P$" for *Impossibility($P$)*?
  *   **(A) Symmetric:** Yes. Conceivability is a biconditional guide. $\rightarrow$ **Leaf: Strong Rationalism** *(Note: Rare in contemporary literature)*
  *   **(B) Asymmetric:** No. Conceivability supports possibility, but inconceivability does not necessarily prove impossibility (I might just lack imagination). $\rightarrow$ *Go to Node 4.*

  ### Node 4: The Hesperus Test (Identity Cases)
  *Consider the proposition: "Hesperus is not Phosphorus." (Or: "Water is not H2O.") You can form a coherent mental image of this; it seems conceivable.*

  **Q4:** Is this scenario metaphysically possible?
  *   **(A) Yes:** There is a sense in which it is possible (e.g., considered as actual). $\rightarrow$ **Leaf: Two-Dimensionalism**
  *   **(B) No:** It is metaphysically impossible. Your conceivability intuition is an illusion of possibility (confusing epistemic for metaphysical). $\rightarrow$ *Go to Node 5.*

  ### Node 5: The Zombie Test (Consciousness Cases)
  *Consider the proposition: "There is a being physically identical to me but lacking conscious experience" (A Philosophical Zombie). This also seems conceivable.*

  **Q5:** Is the modal status of this scenario the *same* as the Hesperus case (Node 4)?
  *   **(A) Yes:** Both are impossible (if you are a physicalist) or both are possible (if you are a dualist who treats names rigidly). The bridge principle works (or fails) uniformly. $\rightarrow$ **Leaf: The Kripkean Line**
  *   **(B) No:** Hesperus/Phosphorus is impossible, but Zombies are possible. The link between conceivability and possibility holds for consciousness but fails for chemical identities. $\rightarrow$ **Leaf: Localism**

  ---

  ## Part II: Locating the Positions

  Here is how the standard positions in the reading list map onto the tree above.

  | Position | Path | Core Commitment |
  | :--- | :--- | :--- |
  | **Modal Skepticism** (e.g., Van Inwagen) | 1A $\rightarrow$ 2A | Conceivability is too contaminated by cognitive drift to serve as a modal guide. |
  | **Modest Modal Rationalism** (e.g., Peacocke) | 1A $\rightarrow$ 2B $\rightarrow$ 3B $\rightarrow$ 4B $\rightarrow$ 5A | Conceivability is a fallible, contingent reliable process (like perception), not a constitutive link. |
  | **Two-Dimensionalism** (e.g., Chalmers) | 1B $\rightarrow$ 3B $\rightarrow$ 4A | Ideal primary conceivability entails primary possibility. A posteriori necessities are secondary intensions. |
  | **The Kripkean Line** (e.g., Kripke, Soames) | 1B $\rightarrow$ 3B $\rightarrow$ 4B $\rightarrow$ 5A | Apparent conceivability of identities is an illusion. Rigid designation blocks the move from conceivable to possible. |
  | **Localism** (e.g., Domain-Specific Dualists) | 1B $\rightarrow$ 3B $\rightarrow$ 4B $\rightarrow$ 5B | The conceivability-possibility bridge is domain-sensitive (e.g., valid for phenomenology, invalid for chemistry). |

  *(Note: Strong Rationalism [1B $\rightarrow$ 3A] is included for logical completeness but is not a primary target of this reading group.)*

  ---

  ## Part III: Analysis of the Logical Space

  ### 1. Empty or Unattractive Combinations
  There is a logically possible path through the tree that few occupy: **1B (Drift Excluded) + 4B (Hesperus Impossible) + 5A (Zombie Impossible) + 2B (Prima Facie Weight).**
  *   **The Position:** This view holds that ideal conceivability is stable (1B) and provides *some* evidence (2B), yet accepts that both Identity cases and Consciousness cases are impossible despite being conceivable.
  *   **Why it's empty:** This creates a tension. If ideal conceivability is stable and truth-conducive (1B), why does it systematically mislead us in both the Hesperus and Zombie cases (4B, 5A)? Usually, if you accept 1B, you either embrace 2D (4A) to save the intuition, or you become a Skeptic/Modest Rationalist (1A) to explain the error. Holding that ideal conceivability is stable *and* systematically wrong in core cases makes the "stability" claim otiose.

  ### 2. The Asymmetry Node
  You will notice almost all contemporary positions (except Strong Rationalism) flow through **Node 3B (Asymmetric)**.
  *   **Pedagogical Note:** This reflects a consensus that human cognitive limitations make *inconceivability* a poor guide to *impossibility* (I might just be stupid), whereas *conceivability* is granted more weight (if I can see it clearly, it's likely possible). If you find yourself at 3A, you hold a much stronger view of rational insight than most of the authors we will read.

  ### 3. Indistinguishable Leaves (The Fuzzy Boundary)
  **Modal Skepticism vs. Modest Modal Rationalism.**
  *   **The Problem:** The tree separates these at **Node 2**. However, in practice, the difference between "no weight" and "very weak, easily defeasible weight" is a gradient, not a cliff.
  *   **Why the tree can't separate them perfectly:** A Skeptic might concede conceivability offers a "hunch," and a Modest Rationalist might concede that hunch is "almost never enough on its own."
  *   **Resolution:** The distinction turns on *default status*. For the Modest Rationalist, conceivability justifies belief in possibility *until* defeated. For the Skeptic, conceivability requires *corroboration* to justify belief. If you are unsure, mark your position as "Skeptic-Leaning" or "Modest-Leaning."

  ### 4. The Possibility Drift Node
  This node (Node 1) is the critical fork between **Naturalized/Epistemic** approaches (Skeptic/Modest) and **Metaphysical/Semantic** approaches (2D/Kripkean).
  *   **If you chose 1A:** You treat conceivability as a psychological phenomenon subject to empirical study (how long we think, how much memory we have).
  *   **If you chose 1B:** You treat conceivability as a normative ideal. Empirical facts about reasoning time are irrelevant to *ideal* conceivability, just as optical illusions are irrelevant to *ideal* vision.
  *   **The "Drift" Finding:** If empirical psychology shows that "conceivability" expands purely with time regardless of truth (as per the prompt's invention), Branch 1A views treat this as a **defeater** (the tool is broken). Branch 1B views treat this as **conceptually excluded** (if it expands with time, it wasn't *ideal* conceivability yet).

  ---

  ## Part IV: Illustrations for Discussion

  When discussing your results in the group, use these two cases to test your branch stability:

  1.  **The Identity Case (Hesperus/Phosphorus):**
      *   *Kripkean/Localist:* You must explain why the vivid intuition that Hesperus could be distinct from Phosphorus is an *illusion*. (Strategy: Distinguish epistemic vs. metaphysical possibility).
      *   *2D:* You must explain why this intuition is *veridical* in one sense. (Strategy: Primary intension picks out the "morning star" role, which could be distinct from the "evening star" role).

  2.  **The Consciousness Case (Zombies):**
      *   *Localist:* This is your key case. You must argue why conceivability works here when it failed for Hesperus. (Strategy: Phenomenal concepts are not rigid designators in the same way natural kind terms are, or the link is contingent).
      *   *Kripkean:* You must argue why Zombies are *also* impossible (if physicalist) or why the Hesperus case doesn't undermine the Zombie case (if dualist).

  **Final Advice:** If you find yourself wanting to answer "It depends on how you define 'conceivable'," you are likely drifting toward **Two-Dimensionalism**. If you find yourself wanting to answer "It depends on the subject matter," you are likely drifting toward **Localism**. If you find yourself saying "I don't trust my brain enough to know," you are likely drifting toward **Skepticism**.
