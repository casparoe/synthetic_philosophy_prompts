  ### Brainstorming and Diagnostic Mapping

  **Candidate Diagnoses**
  1.  **Perceptual Penetration (Experience):** The coder's belief alters the phenomenological content of the visual experience. A 200ms contact *looks* aggressive if the coder expects aggression.
      *   *Data Prediction:* High inter-rater reliability (IRR) among unblinded coders; low IRR between unblinded and blinded coders. Automation trained on unblinded data will replicate the bias.
      *   *Policy:* Blinding is necessary. Training cannot fix this.
  2.  **Attentional Bias (Search):** Belief steers where and how long the coder looks. They scrutinize treated cages more closely than controls.
      *   *Data Prediction:* Eye-tracking would show different scan paths. Events are missed in controls, found in treatments.
      *   *Policy:* Forced full-frame review, minimum dwell times, or blinding.
  3.  **Response Bias (Report):** Perception is neutral, but the categorization threshold shifts. "Was that aggressive?" is answered "Yes" more readily for treated animals.
      *   *Data Prediction:* Disagreement on classification, not detection. Hard decision rules and reference sets help here.
      *   *Policy:* Pre-registered rules, reference clips.

  **Uncertainty & Overlap**
  These mechanisms are not mutually exclusive; they likely co-occur. The literature does not definitively settle which dominates in ethological scoring. However, **blinding** is the only single intervention that neutralizes all three. If the coder does not know the condition, expectation cannot penetrate perception, steer attention, or shift reporting criteria. Automation is only safe if the training data is blinded; otherwise, it codifies human bias as mathematical law.

  ***

  ### MEMORANDUM

  **TO:** Research Practices Committee
  **FROM:** [Your Name], Philosophy of Science Representative
  **RE:** Recommendation on Case #2023-Murine-Anxiolytic (Behavioral Scoring Pipeline)
  **DATE:** October 24, 2023

  **Recommendation**

  I move that we condition the lab's annual renewal on the implementation of digital blinding for all human behavioral scoring. This requirement is effective immediately for new data collection and must be applied to the existing backlog within sixty days. Specifically, the lab must crop or pixelate the shaved injection patch and cage cards in all video footage prior to human review. Coders must not be informed of the treatment hypothesis. Automation (pose-estimation software) is permissible only if the training dataset consists of blinded, consensus-scored frames. This policy sunsets in two years if a validation study, described below, demonstrates no significant difference between blinded and unblinded effect sizes.

  **Reasoning**

  We are divided on whether automation solves the bias problem or merely hides it. This disagreement rests on a specific empirical question: where does the coder's expectation enter the pipeline? There are three possibilities, and our policy must hold regardless of which is true.

  First, consider **Perceptual Penetration**. Here, expectation changes what the coder literally sees. A 200-millisecond contact between mice looks like "agonistic" if the coder expects aggression, and "play" if they do not. If this is true, high agreement between two unblinded coders proves only that they share the same bias, not that they are accurate. Training cannot fix this, because you cannot train someone to see differently if their perception is already theory-laden.

  Second, consider **Attentional Bias**. Expectation changes where the coder looks. They might scan the treated cage more thoroughly, missing subtle events in the control cage. Here, the visual experience is neutral, but the sampling is skewed.

  Third, consider **Response Bias**. The coder sees the event neutrally but categorizes it differently based on expectation. They hesitate to label a control mouse as "aggressive" but readily label a treated mouse the same way.

  Our current data cannot distinguish these. However, notice that **blinding** is the only intervention that secures us against all three. If the coder does not know the condition, their perception cannot be penetrated by treatment expectations, their attention cannot be steered by hypothesis, and their reporting criteria cannot shift based on group identity.

  Automation is often proposed as a superior alternative. However, supervised machine learning models are trained on human-labeled data. If the humans who labeled the training set were unblinded, the model learns their biases as ground truth. It codifies the error. Therefore, automation is not a substitute for blinding; it is dependent on it.

  **The Case for Automation (Steelman)**

  The strongest argument against my recommendation is that digital blinding is resource-intensive and potentially unnecessary. A computer does not have hypotheses, fatigue, or social pressure. Pose-estimation software extracts keypoints with sub-pixel precision that humans cannot match. If the effect size is large, as the lab claims, human bias is likely noise swamped by the signal. Requiring blinding imposes a cost of roughly one postdoc-year in editing time and slows publication. If the goal is robust science, we should invest in tools that remove the human entirely, rather than patching a human-centric pipeline. Automation scales; blinding bottlenecks. Furthermore, if the bias is purely downstream (response bias), hard decision rules are cheaper and equally effective. To demand blinding is to assume a worst-case philosophical scenario without proof.

  **Resolution**

  While the efficiency argument is valid, it assumes the training data is clean. We have no evidence of that. Given the committee's deadlock, we must choose the path that remains valid even if the worst-case philosophical diagnosis (Perceptual Penetration) is true. Blinding is that path. It is the conservative error-control mechanism. We cannot afford to publish a drug effect that turns out to be a artifact of shaved patches.

  **What Would Change Our Mind**

  We should revisit this policy if the lab can produce a validation study meeting the following criteria:

  1.  Select a random subset of 500 clips from the existing dataset.
  2.  Have them scored by two coders completely blinded to condition and hypothesis.
  3.  Compare the effect size (Cohen's *d*) derived from the blinded scores against the original unblinded scores.
  4.  If the difference in effect size is less than 10%, and inter-rater reliability remains high (Cohen's κ > 0.8), we will accept that expectation bias was negligible in this specific pipeline.

  At that point, we will permit unblinded scoring for this specific behavioral assay provided the reference set is updated annually. Until such data exists, we must assume the bias is present and structural.
