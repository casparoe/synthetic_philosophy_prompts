prompt: |-
  I've been going back and forth with my officemate about causation by omission for like three weeks now and I think I've finally settled on a position, but I want to know how exposed it actually is before I commit to it in writing. Here's where I've landed: omissions are genuine causes. When we say "the drought caused the crop failure" or "the lifeguard's failure to notice the swimmer caused the drowning," we're not just speaking loosely or using causal language as a pragmatic shorthand — we're picking out real causal relations in the world. The fact that omissions don't involve energy transfer or physical contact doesn't bother me; causation is fundamentally a modal notion, and omissions support the right counterfactuals (if the lifeguard had noticed, the swimmer wouldn't have drowned). I also think the "proliferation" worry — that if omissions are causes then the Queen of England's failure to water my plant also caused its death — can be handled by a halfway plausible theory of causal relevance or default states, even if I don't have that theory fully worked out yet.

  What I want is a clear-eyed map of what would count against this view. Not just the stuff my officemate keeps throwing at me (he won't shut up about negative facts being ontologically spooky), but the full landscape: arguments, thought experiments, theoretical costs, results from other areas of metaphysics or philosophy of science that put real pressure on it. I want to know which objections a defender of omission-causation would themselves concede carry weight, and which they'd dismiss as question-begging or beside the point. And I want an honest answer about whether the view has been qualified into unfalsifiability — whether it's ended up saying "omissions are causes except when they're not, and we have no principled way to tell which is which." I'm particularly interested in whether the view forces me into any positions in the metaphysics of absences or negative existentials that I might not want, and whether the best version of the view ends up collapsing into a rival account (like the view that omission-talk is just pragmatically useful but not metaphysically committing).

  After you lay this out in prose, give me a structured summary as a JSON object with the following fields:

  - "defeaters": an array of objects, each with:
    - "name": a short label for the objection or counterevidence
    - "category": one of "metaphysical", "semantic", "normative/pragmatic", "formal", "empirical"
    - "severity": one of "fatal", "major", "moderate", "minor", "merely_verbal"
    - "conceded_by_defenders": boolean — would a thoughtful defender of omission-causation grant this as a genuine cost or problem?
    - "brief_argument": a one-sentence summary of the objection
  - "insulation_assessment": an object with:
    - "is_insulated": boolean — has the view been qualified to the point where nothing could in principle count against it?
    - "is_that_a_problem": a one-sentence assessment of whether insulation (or its absence) is a problem for a view of this kind
    - "riskiest_commitment": the single commitment of the view that is most exposed to empirical or theoretical refutation
    - "nearest_rival_collapse": which rival view the position most risks collapsing into, and why in one sentence
