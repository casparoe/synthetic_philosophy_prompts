  Here's a thinking process that leads to the suggested argument:

  1.  **Analyze the Request:**
      *   **Task:** Argue for a position the user *doesn't* hold and is unsure about (steel-manning the opposition).
      *   **Position:** Epistemic Utility Theory (EUT) / Accuracy-First Epistemology is just pragmatism in disguise and offers no advantage over older pragmatic vindications of Bayesianism.
      *   **Context:** Grad seminar preparation (needs high-level, technical, philosophical rigor).
      *   **Constraints:**
          *   Do *not* use the "arbitrariness of scoring rules" objection (the user finds this weak).
          *   *Do* use the concept of "self-ratifying" scoring rules.
          *   *Do* argue that the diachronic accuracy argument yields only a hypothetical imperative ("Be accurate by your own lights").
          *   *Do* argue that the synchronic domination argument for Probabilism fails to plug the normative hole (it rules out incoherence but doesn't select a prior).
          *   *Do* present the best reply available to the accuracy-firster (to restore categorical force).
          *   *Do* argue that this reply fails.
      *   **Tone:** Philosophical, rigorous, persuasive (for the sake of the exercise), nuanced.

  2.  **Deconstruct the Core Argument:**
      *   *Premise 1:* EUT claims to ground epistemic norms (Probabilism, Conditionalization) in purely epistemic value (Accuracy).
      *   *Premise 2:* The diachronic argument for Conditionalization relies on maximizing expected accuracy relative to a *prior*.
      *   *Premise 3:* This makes the norm hypothetical: *If* you want to maximize accuracy relative to *your current prior*, *then* conditionalize.
      *   *Premise 4:* The synchronic argument (Joyce-style domination) only rules out incoherent priors. It doesn't tell you *which* coherent prior to adopt.
      *   *Conclusion:* The normative "teeth" (which prior to pick, how to respond to evidence) depends entirely on the agent's starting point. This is structurally identical to pragmatic instrumentalism (if you want X, do Y). Therefore, EUT is pragmatism in epistemic costume.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Set the stage. Acknowledge the ambition of EUT (Joyce, Greco, Pettigrew, etc.). State the thesis clearly: EUT collapses into a sophisticated instrumentalism. It doesn't escape the "ought implies can" or "normative force" problem that plagued pragmatic Dutch Book arguments.

      *   **The Diachronic Argument & Self-Ratification:**
          *   Focus on the argument for Conditionalization (e.g., Briggs-Pettigrew or Greco).
          *   Define "self-ratifying" as requested. A rule is self-ratifying if, given my current credences, I expect following it to yield higher accuracy than any alternative updating rule.
          *   *The Crucial Move:* This expectation is calculated *using the prior*.
          *   *The Implication:* The recommendation to conditionalize is indexed to the prior. If I have a crazy prior, conditionalizing on it might still be "optimal" relative to that crazy prior.
          *   *Analogy:* Compare to "Be wealthy by your own lights." If I believe buying lottery tickets is the best way to get rich, the instrumental norm says "buy tickets." It doesn't tell me my belief about lottery tickets is wrong. Similarly, accuracy says "conditionalize," but doesn't tell me my prior is wrong.

      *   **The Synchronic Gap (Probabilism):**
          *   Okay, so Joyce's argument says: Don't be incoherent (dominated).
          *   *The Limit:* This is a negative constraint. It prunes the garden but doesn't plant the seeds.
          *   *The Normative Void:* All the interesting epistemic disagreements happen *between* coherent priors. The Permissive Bayesian vs. The Objective Bayesian. EUT stays silent here.
          *   *Connection to Pragmatism:* Old Dutch Book arguments said "If you want to avoid sure loss, be probabilistic." EUT says "If you want to avoid accuracy domination, be probabilistic." Both leave the choice of prior underdetermined. The "epistemic" value of accuracy doesn't fill this gap any better than the "pragmatic" value of money.

      *   **The Best Reply (The Principle of Indifference / Epistemic Constraints):**
          *   What would an accuracy-firster say? They need to constrain the priors to make the imperative categorical.
          *   *Candidate:* The Principle of Indifference (POI) or a specific proper scoring rule that forces a specific prior (e.g., Pettigrew's work on choosing scoring rules based on epistemic values).
          *   *Refinement:* The strongest reply is likely Pettigrew's "Choice of Scoring Rule" argument or an appeal to *Epistemic Risk*. The idea: There is a uniquely rational way to weigh risk vs. reward in belief formation, which dictates a unique scoring rule, which dictates a unique prior (often uniform).
          *   *Let's focus on the "Epistemic Risk" argument (Pettigrew).* It claims that rationality requires a specific attitude toward epistemic risk, which selects a specific scoring rule (e.g., Brier vs. Log), which then constrains the prior.

      *   **The Rebuttal to the Reply:**
          *   Why does this fail?
          *   *Circularity/Pragmatic Import:* Why is *that* attitude toward risk the rational one? If it's because it leads to truth, we are back to square one. If it's a brute normative fact, why isn't the pragmatic Dutch Book constraint a brute normative fact?
          *   *The Disguise:* Specifying an "epistemic risk profile" looks suspiciously like specifying a "pragmatic utility function."
          *   *The Collapse:* Once you add a constraint to select the prior, you are importing a norm *external* to accuracy. If that norm is pragmatic (e.g., "be cautious"), you admit pragmatism. If it's epistemic, you need to justify it without appealing to accuracy (otherwise circular) or without appealing to intuition (which pragmatists also have).
          *   *Final Blow:* The "categorical force" comes from the added constraint, not the accuracy framework. The accuracy framework is just the calculus used to implement the constraint. Therefore, the *source* of the norm is still external (like pragmatism), rendering the "accuracy-first" label a costume.

  4.  **Review and Refine:**
