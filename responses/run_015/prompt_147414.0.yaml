answer: |-
  Here is the argument you requested, constructed to be the strongest possible version of the claim that Epistemic Utility Theory (EUT) is merely pragmatism in epistemic costume. It is designed to withstand the scrutiny of a graduate seminar by focusing on the structure of normative force rather than the technicalities of scoring rule selection.

  ***

  ### The Instrumentalist Collapse: Why Accuracy-First is Pragmatism in Disguise

  The ambition of the accuracy-first program is bold: to ground the norms of rational belief (Probabilism, Conditionalization) in a purely epistemic value—accuracy—thereby escaping the "pragmatic contamination" of Dutch Book arguments. The promise is that while avoiding a sure loss of money is a pragmatic concern, avoiding a sure loss of *accuracy* is distinctively epistemic.

  However, when we examine the logical structure of the accuracy arguments, specifically the diachronic argument for Conditionalization and the synchronic argument for Probabilism, we find that they do not generate categorical epistemic norms. Instead, they generate hypothetical imperatives indexed to the agent's contingent starting point. Once we recognize this, the distinction between "maximizing expected accuracy" and "maximizing expected utility" dissolves. EUT does not replace pragmatic vindications; it merely translates them into a different dialect without changing the grammar of rationality.

  #### 1. The Diachronic Argument and the Hypothetical Imperative

  Let us look closely at the diachronic argument for Conditionalization. As you noted, we must move past the trivial complaint that scoring rules are arbitrary. Let us grant the accuracy-firster their favorite strictly proper scoring rule. The argument proceeds by showing that, for any agent with a prior credence function $c_0$, the updating rule that maximizes expected accuracy (relative to $c_0$) is Conditionalization on $c_0$.

  To sharpen this, consider the notion of a **self-ratifying** rule. An updating rule is self-ratifying for an agent if, by the agent's own current lights (her prior $c_0$), she expects to end up more accurate if she follows that rule than if she adopts any other credence function and updates that. The diachronic accuracy theorem establishes that Conditionalization is the unique self-ratifying updating rule *relative to the prior*.

  Here lies the crack in the foundation. The recommendation to conditionalize is not "You ought to conditionalize, full stop." The recommendation is: "**If** you want to maximize accuracy as measured from the standpoint of your current prior $c_0$, **then** you ought to conditionalize on $c_0$."

  This is a hypothetical imperative. It is structurally identical to the pragmatic advice: "If you want to maximize wealth as measured from the standpoint of your current market beliefs, then you ought to invest in index funds."

  Consider a dogmatic agent, Dogma, whose prior $c_D$ assigns credence 1 to a proposition $P$ regardless of evidence. For Dogma, Conditionalization on $c_D$ is self-ratifying. If she receives evidence $E$, her posterior remains 1 in $P$. By her own lights, this is the accuracy-maximizing move, because she is certain $P$ is true. The accuracy framework cannot tell Dogma she is irrational for having $c_D$; it can only tell her that, given $c_D$, she must update via Conditionalization.

  The normative work people care about—the reason we reject Dogma's prior—is not captured here. The accuracy argument secures the *stability* of the prior, not its *legitimacy*. It tells the agent how to preserve her current commitment to accuracy, but it cannot tell her whether that commitment is well-placed. This is exactly the limitation of old-school pragmatic instrumentalism: Dutch Book arguments show that if you have *these* beliefs, you must bet *this way* to avoid loss. They do not show you shouldn't have *those* beliefs in the first place. EUT replicates this limitation perfectly. It offers a coherence constraint on the dynamics of belief, but no categorical constraint on the content of belief.

  #### 2. The Synchronic Silence

  The accuracy-firster might retreat to the synchronic argument for Probabilism (the Joyce-style domination argument). This argument shows that any incoherent credence function is accuracy-dominated by some coherent one. Therefore, rationality requires Probabilism.

  Does this plug the hole? No. The domination argument is purely negative. It prunes the garden of possible credence functions by ruling out the incoherent ones, but it falls silent on which of the infinite remaining coherent functions one ought to adopt.

  This silence is fatal to the claim that EUT provides a categorical epistemic norm. All the substantive normative work in epistemology happens in the space between coherent priors. The debate between the subjective Bayesian (anything goes) and the objective Bayesian (principles of indifference apply) is a debate about which coherent prior to pick. The accuracy framework, having established that one must be coherent, has nothing left to say about this choice.

  If the only norm is "Be coherent," then the system is permissive to the point of vacuity regarding the actual formation of belief. But if the accuracy-firster claims that accuracy *itself* dictates a specific prior (e.g., the uniform prior), they must explain why accuracy dictates *that* one.

  Here, the parallel to pragmatism becomes undeniable. In pragmatism, the choice of prior is determined by pragmatic goals (caution, boldness, utility). In EUT, if the choice of prior is determined by "epistemic risk" or "verisimilitude," these are functionally identical to pragmatic goals, merely relabeled. The structure remains: *Given a value function V (whether money or accuracy), and a risk profile R, adopt prior P.*

  If EUT cannot specify the prior without importing external constraints, it fails to be "accuracy-first." It is "accuracy-plus-X-first." And if X is doing the work of selecting the prior, then accuracy is merely the currency in which the transaction is calculated, not the source of the norm.

  #### 3. The Best Reply: Epistemic Risk and the Categorical Prior

  To restore categorical force, the sophisticated accuracy-firster (following the lead of Pettigrew and others) must argue that there is a uniquely rational way to weigh epistemic risk. They argue that the choice of scoring rule is not arbitrary because rational agents are required to adopt a specific attitude toward the risk of error.

  The argument runs as follows:
  1.  Epistemic rationality requires minimizing inaccuracy.
  2.  Different scoring rules encode different attitudes toward risk (e.g., the Log score penalizes certainty in falsehoods more severely than the Brier score).
  3.  There is a uniquely rational attitude toward epistemic risk (e.g., a specific form of risk-aversion regarding truth).
  4.  Therefore, there is a uniquely rational scoring rule.
  5.  Maximizing expected accuracy relative to *that* rule dictates a unique prior (often the Principle of Indifference).

  This is the strongest move available. It attempts to ground the prior in a normative fact about epistemic risk, thereby turning the hypothetical imperative ("If you want accuracy...") into a categorical one ("You ought to be risk-averse regarding truth, therefore...").

  #### 4. Why the Reply Fails

  This reply fails because it exposes the "epistemic costume."

  First, consider the status of the norm "Be risk-averse regarding truth." Why is this rational? If the answer is "Because being risk-averse leads to more accurate beliefs in the long run," the argument becomes circular. We are using a risk profile to select a scoring rule to select a prior to maximize accuracy. If the justification for the risk profile is itself accuracy-based, we are spinning in circles.

  If the answer is "Because it is a brute normative fact that one ought to be epistemically risk-averse," then we must ask: How is this different from the pragmatic vindication? The pragmatic vindicator says, "It is a brute normative fact that one ought to avoid sure loss." The accuracy-firster says, "It is a brute normative fact that one ought to minimize worst-case inaccuracy."

  At this level of abstraction, the distinction collapses. Both are positing a fundamental norm to ground the Bayesian apparatus. The pragmatic norm is "Avoid Dutch Books." The epistemic norm is "Minimize Dominated Inaccuracy." Neither is derived from a more fundamental "accuracy-only" base; both are foundational commitments.

  Furthermore, by importing a specific risk profile to constrain the prior, the accuracy-firster admits that accuracy *alone* was insufficient. The "accuracy-first" label implied that accuracy was the *sole* distinctively epistemic value. But if we need a principle of epistemic risk to get the system to yield a categorical prior, then accuracy is not first. Risk is co-first.

  And what is "epistemic risk"? It is a measure of how much an agent cares about being wrong versus how much they care about being right. This is structurally indistinguishable from a utility function. To say "I value avoiding false belief more than I value acquiring true belief" is to assign weights to outcomes. In pragmatism, we assign weights based on practical consequences. In this version of EUT, we assign weights based on "epistemic consequences." But if the only difference is the label on the consequence (money vs. truth), the *logic of justification* remains instrumental.

  The argument concludes that you should adopt Prior $P$ because it best satisfies your value function $V$. In pragmatism, $V$ includes practical welfare. In EUT, $V$ includes only accuracy. But since accuracy alone underdetermines $P$, EUT must smuggle in a risk parameter $R$. Once $R$ is added, the imperative becomes: "Given $R$ and $V$, do $P$." This is a hypothetical imperative relative to the acceptance of $R$.

  Unless the accuracy-firster can show that rejecting $R$ is *inaccurate* (which is impossible, as risk profiles are not truth-apt), they cannot make $R$ categorical without appealing to a norm outside of accuracy. If they appeal to a norm outside of accuracy, they are no longer accuracy-first. If they stay within accuracy, they remain silent on the prior.

  #### Conclusion

  The accuracy-first program promises to derive categorical epistemic norms from the single value of accuracy. But the diachronic argument yields only a self-ratifying constraint relative to a prior, and the synchronic argument yields only a coherence constraint that underdetermines the prior. To bridge the gap, the accuracy-firster must import a constraint on epistemic risk. Once imported, this constraint functions exactly like a pragmatic utility function: it is an external standard used to calculate the optimal belief state.

  Therefore, EUT does not escape the instrumentalism of the pragmatic vindications. It merely changes the currency of the calculation from dollars to truth-values. The norm remains: "If you accept this valuation of risk and truth, then you ought to believe thusly." That is pragmatism in epistemic costume. The costume is elaborate, and the mathematics is rigorous, but underneath, the normative engine is the same.
