answer: |-
  ### Part 1: Unstructured Brainstorming

  Okay, let's sit with these cases. You've thrown a whole spectrum of moral intuition at me, and honestly, your tentative rule ("High Help + High Cost = Supererogatory") is bleeding out immediately.

  The toddler in the fountain is the executioner of that rule. If cost is the main driver of supererogation, then low-cost rescue should be the *most* supererogatory, but it's the *least*. It's mandatory. So cost isn't a linear scale where "more cost = more optional." It's more like a threshold. Below a certain cost, benefit creates duty (Easy Rescue). Above a certain cost, benefit creates optionality. But where is that line?

  The grenade vs. kidney comparison is fascinating. You feel the kidney is *more* optional than the grenade. Why? Both cost a lot (life vs. organ). Maybe it's about *time*. The grenade is a split-second reflex; there's no time to deliberate on duty. The kidney is scheduled surgery. We have time to talk ourselves out of duties. Or maybe it's about finality? Death is absolute; living with one kidney is manageable. But you said the kidney feels *more* optional. Perhaps because the grenade saves people *right there*, creating a immediate causal link, whereas kidney donation is a systemic medical intervention? No, I think it's about the "hero vs. saint" distinction. Heroism is often reactive; saintliness is proactive. We demand less of saints because we know we can't be them.

  The 10% income thing is the Effective Altruism battleground. Your friend says duty; you say optional. This hinges on "baseline lifestyle." If 10% ruins your ability to function as a social being, is it duty? If 10% just means fewer lattes, is it duty? Peter Singer would say your friend is right. Common morality says you are. This suggests duty is relative to *social expectations*, not just abstract math.

  The Nurse case ("Norm Ratchet") is crucial. It shows that supererogation is socially fragile. If I do something extra, and management notices, they might bake it into the contract. Then it becomes duty. This suggests supererogation isn't a fixed property of the act, but a relationship between the agent and the *expectations of the community*.

  The "Credit Exhaustion" on the repeat kidney donor... I'm going to be harsh here: I think your gut is wrong. Morally, saving a life yesterday doesn't cancel the value of saving a life today. But psychologically? We treat morality like a ledger. We feel uncomfortable demanding *more* from someone who has already given *more*. That's a bias, not a principle.

  The Mother/Kidney case is the most telling. You feel it might be *wrong*, not praiseworthy. Why? Because she has **special obligations**. We owe our children more than strangers. Violating a high-priority duty (protecting your kids' future security) to fulfill a low-priority duty (helping a stranger) is moral misalignment, even if the "net good" is positive. This kills the idea that "Helps a Lot" is the only metric. *Who* is helped matters.

  And finally, your Mum case. The oscillation between "beautiful" and "optional." You're worried "optional" sounds like "doesn't matter." But in ethics, "optional" means "you won't be blamed for not doing it." It protects you from guilt. If we call it duty, we weaponize guilt against anyone who can't afford to do it.

  Okay, I think I see the shape of the principle. It's not just Cost vs. Benefit. It's about **Reasonable Demand** filtered through **Special Obligations**.

  ***

  ### Part 2: The Considered Answer

  You are looking for a principle that distinguishes the **Obligatory** (what we owe) from the **Supererogatory** (what is good but not owed). Your tentative rule (High Cost + High Benefit = Supererogatory) fails because it ignores the *baseline of expectation*.

  Here is the framework that best fits your cases, though it requires us to correct a few of your gut reactions.

  #### The Principle: Reasonable Demand + Special Obligations

  **1. The Baseline of Reasonable Demand (The "Easy Rescue" Threshold)**
  Duty is defined by what we can reasonably demand of any moral agent without asking them to sacrifice their fundamental interests.
  *   **Why the Toddler is Duty:** The cost (wet shoes) is negligible. The benefit (life) is maximal. Any reasonable demand includes preventing catastrophic harm at negligible cost. This is the "Easy Rescue" principle. Your rule failed here because it assumed cost must be high for supererogation. Actually, *low* cost + *high* benefit = **Duty**.
  *   **Why the Grenade/Kidney are Supererogatory:** These exceed reasonable demand. We cannot demand someone die or undergo major surgery as a standard requirement of being a "good person." If we made it duty, morality would be too burdensome to be sustainable.

  **2. The Hierarchy of Special Obligations**
  We do not owe the same to everyone. We owe more to those with whom we have specific relationships (children, parents, patients).
  *   **Why the Mother/Kidney case feels Wrong:** You were right to feel queasy. A mother has a fiduciary duty to her children's future security. Donating a kidney introduces a health risk that could compromise her ability to care for them. Prioritizing a stranger's need over her dependents' security is a violation of special obligation. It is not praiseworthy; it is morally misaligned. **Verdict:** Your intuition here is correct; this is not supererogatory, it is potentially negligent.
  *   **Why the Mum Care Case is Supererogatory:** You have a filial duty to ensure your mother is cared for. If a good care home is available and affordable, that duty is met. Quitting your job to do it personally exceeds the "reasonable demand" because it sacrifices your career and financial future. It is beautiful, but it is not required.

  **3. The Social Context (The Norm Ratchet)**
  Supererogation is partially socially constructed.
  *   **The Nurse:** An act is supererogatory only as long as it remains outside the "job description." Once management expects it, the social baseline shifts. The act hasn't changed, but the *obligation* has. This isn't a bug in morality; it's a feature of social contracts. We must resist the ratchet when it exploits workers, but morally, the line is drawn by "what is expected of this role."

  #### Correcting Your Gut Reactions

  I need to challenge you on two specific intuitions:

  **1. Credit Exhaustion (The Repeat Kidney Donor)**
  You feel the neighbor is "off the hook." Morally, this is incorrect. The need of the patient today is identical regardless of the donor's past. However, your feeling is a protective psychological heuristic. We feel it is *unfair* to expect endless sacrifice from one person.
  *   **The Fix:** Distinguish between **Moral Value** and **Moral Expectation**. The act still has immense moral value. But our *expectation* of her is rightly lowered because we don't want to exploit saints. She isn't "off the hook" metaphysically, but we are wrong to pressure her.

  **2. The Meaning of "Optional"**
  You worry that calling the care of your mum "optional" is an insult. In moral philosophy, "supererogatory" (optional) does not mean "morally neutral." It means **"praiseworthy to do, blameless to omit."**
  *   If we call it **Duty**: You *must* do it. If you don't, you are blameworthy/bad.
  *   If we call it **Supererogatory**: If you do it, you are a hero. If you don't, you are still a good person who made a hard choice.
  *   **Why this matters:** Calling it "Duty" weaponizes guilt. It implies anyone who keeps their job to pay for the care home is failing. Calling it "Optional" protects the agent from blame while still honoring the sacrifice. "Optional" is not an insult; it is a shield.

  #### The Verdict on Your Cases

  | Case | Classification | Why |
  | :--- | :--- | :--- |
  | **Toddler in Fountain** | **Duty** | Easy Rescue. Low cost, high benefit. |
  | **Grenade** | **Supererogatory** | Exceeds reasonable demand (life for life). |
  | **Kidney (Stranger)** | **Supererogatory** | High cost (surgery/risk). More "optional" than grenade because it's deliberative, not reactive. |
  | **10% Income** | **Disputed (Contextual)** | If 10% threatens your basic security, it's supererogatory. If it's just luxury, many philosophers argue it's duty. |
  | **Nurse Overtime** | **Supererogatory (until normalized)** | Shifts based on social/contractual expectations. |
  | **Secret Lunch Payer** | **Supererogatory** | Praise is deserved regardless of audience. Moral worth is internal. |
  | **Repeat Kidney** | **Supererogatory** | **Correction:** She is not "off the hook," but we should not *expect* it. |
  | **Mother w/ Kids** | **Wrong (Negligent)** | Violates special obligations to dependents. |
  | **Caring for Mum** | **Supererogatory** | Filial duty is met by ensuring care, not necessarily providing it personally at high self-cost. |

  ### Part 3: The Mum Case (Your Flip-Flop)

  You asked specifically about quitting your job to care for your mum when a care home was available.

  **My Prediction:** This is **Supererogatory**.

  Here is why you are flip-flopping. You are conflating **Love** with **Duty**.
  *   **Love** might compel you to quit. It might feel "beautiful" because it expresses a depth of commitment that exceeds contracts.
  *   **Duty** only requires you to ensure she is safe and cared for.

  If you call it **Duty**, you are saying that anyone who keeps their job is failing their mother. That is a cruel moral landscape, especially for those who cannot afford to quit.
  If you call it **Supererogatory**, you acknowledge the beauty of the sacrifice without condemning those who cannot make it.

  **Is "Optional" an insult?**
  No. In this context, "Optional" means: *"You are allowed to prioritize your own life's trajectory without being a bad child."*
  If you did it, you are a saint. If you didn't, you are a good child who used the available resources (the care home) responsibly.

  **The Principle to Take Home:**
  An act is **Supererogatory** when it promotes the good significantly but requires a sacrifice that exceeds the **Baseline of Reasonable Demand**, provided it does not violate **Special Obligations** to dependents.

  *   **Cost enters as a threshold:** Below the threshold (wet shoes), it's duty. Above the threshold (career, health, life), it's supererogatory.
  *   **Relationship enters as a multiplier:** We owe more to family. Sometimes, helping a stranger *too much* becomes wrong because it steals from those we owe more to (the Mother/Kidney case).

  Your friend who says donating 10% is a duty is operating on a Utilitarian calculus (maximize good). You are operating on a Common Morality calculus (sustainable social expectations). Neither is "wrong," but Common Morality is usually what governs blame and praise in daily life. You are right to resist the guilt.
