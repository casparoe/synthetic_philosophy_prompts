answer: |-
  ### Phase 1: Brainstorming and Pruning

  Before establishing the final desiderata, I need to cast a wide net on what a theory of survival *could* demand, then prune based on your specific context (commercial uploading decision framework) and philosophical rigor.

  **Initial Candidate List:**
  1.  **Metaphysical Truth:** The theory must describe what a person *is* (soul, animal, psyche).
  2.  **Logical Consistency:** Must obey the laws of logic (e.g., transitivity of identity).
  3.  **Empirical Plausibility:** Cannot contradict known neuroscience (no magic souls).
  4.  **Fission Handling:** Must explain what happens if two copies exist.
  5.  **Vagueness Handling:** Must deal with gradual change (Lossy Scan).
  6.  **Temporal Gaps:** Must deal with interruptions (Time Lag/Coma).
  7.  **Action Guidance:** Must tell the agent whether to step into the machine.
  8.  **First-Person Perspective:** Must explain why *I* care, not just why others care about me.
  9.  **Moral Status:** Must determine if the copy has rights.
  10. **Fear of Death:** Must explain why death is bad if survival occurs.

  **Pruning Process:**
  *   *Drop #1 (Metaphysical Truth):* For a decision framework, ontology matters less than normative consequences. Parfit's insight is that we can bypass the metaphysics of "is it me?" and ask "does it matter?" We will prioritize *What Matters* over *Strict Identity*.
  *   *Drop #9 (Moral Status):* While crucial for ethics, your project is about *prudential rationality* (should *I* do this?), not the ethics of creating copies. We focus on survival concern.
  *   *Drop #2 (Logical Consistency - Strict):* If "What Matters" is not Identity, it need not be transitive. We require *Coherence*, not strict logical identity rules.
  *   *Merge #5 & #6:* Both are about the *structure* of continuity. We will separate them because the Lossy Scan (degree) and Time Lag (gap) pose distinct problems.
  *   *Elevate #7 (Action Guidance):* This is non-negotiable for your context. A theory that says "it's indeterminate" is useless for a binary decision (upload/don't upload).

  **Final Selection:** The remaining core requirements focus on Empirical Consistency, Fission, Vagueness (Lossy), Gaps (Time Lag), and Action Guidance.

  ***

  ### Phase 2: The Desiderata for an Adequate Theory of Survival

  Here is the specification list. For a theory of "what matters in survival" to be adequate for your decision framework, it must satisfy the following six requirements.

  | ID | Requirement Name | Specification |
  | :--- | :--- | :--- |
  | **R1** | **The Empirical Consistency Constraint** | The theory must be compatible with established cognitive science and neuroscience. It cannot posit non-physical substances (souls) or causal mechanisms that violate physics. |
  | **R2** | **The Fission Constraint** | The theory must provide a determinate account of prudential concern in cases of duplication (one input, two outputs). It must specify whether concern divides, vanishes, or follows one branch. |
  | **R3** | **The Sorites (Lossy) Constraint** | The theory must specify the relationship between *degree of psychological similarity* and *degree of survival*. It must address whether there is a sharp threshold or a gradual fade, and how this maps to rational decision-making. |
  | **R4** | **The Temporal Gap Constraint** | The theory must account for interruptions in psychological continuity (e.g., data storage, coma). It must specify whether existence persists, pauses, or ceases during the gap, and whether the *cause* of the gap matters. |
  | **R5** | **The Action-Guidance Constraint** | The theory must yield a binary or weighted recommendation for the agent. It cannot leave the agent in a state of total metaphysical suspense that precludes rational planning. |
  | **R6** | **The First-Person Authority Constraint** | The theory must explain why the survival of the successor generates *self-interested concern* for the original, rather than merely altruistic concern for a stranger. |

  ***

  ### Phase 3: Detailed Reasoning and Case Analysis

  Here is the philosophical justification for each requirement, specifically tailored to force a confrontation with your two hard cases (Lossy Scan and Time Lag).

  **R1: The Empirical Consistency Constraint**
  This is the baseline filter. In the 17th century, Locke could speculate about princes and cobblers swapping souls. In the 21st century, a theory for commercial uploading cannot rely on Cartesian dualism. If a theory requires a "simple ego" that cannot be scanned, it fails R1.
  *   **Why it's a requirement:** You are building a decision framework for a physical technology. A theory that relies on metaphysical entities inaccessible to the machine renders the technology unintelligible.
  *   **The Constraint:** The theory must treat psychological states as supervenient on physical states. If the machine copies the physical state, it copies the basis for the person.

  **R2: The Fission Constraint (The Theory Killer)**
  This is the classic philosophical wrecking ball. If the teletransporter malfunctions and builds two copies on Mars, strict Identity Theory fails because identity is one-to-one, but survival here is one-to-many.
  *   **Why it's a requirement:** A theory of *what matters* must explain rational concern in branching cases. If you know fission will occur, should you fear death? Most intuitions suggest you shouldn't fear death, but you can't be *both* people.
  *   **The Constraint:** The theory must explain why survival can be what matters even if identity is lost. If a theory insists "Identity is what matters," it must conclude you die in fission. If that contradicts our intuition that you survive, the theory fails.

  **R3: The Sorites (Lossy) Constraint**
  This directly targets your **Lossy Scan** case. Psychological continuity is not binary; memories fade, personalities shift. If a copy is 99.9% you, it seems you survive. If it is 1% you, it seems you die. Where is the line?
  *   **Why it's a requirement:** Real-world uploading will be lossy. A theory that demands perfect preservation is empirically impossible (R1 violation). A theory that says "any similarity counts" implies you survive even if the copy is a stranger with one memory of yours.
  *   **The Hard Case (Lossy Scan):** The theory must answer: Is survival a matter of degree? If yes, how does that scale with *prudential concern*? Do I care 99.9% about the copy? If no (if there is a sharp threshold), the theory must identify a non-arbitrary cutoff point.
  *   **The Trap:** If the theory admits vagueness (no sharp line), it risks violating **R5 (Action-Guidance)**. If it's vague whether you survive, it's vague whether you should step in the machine. An adequate theory must resolve this tension, perhaps by arguing that *rational concern* tracks *degree of continuity* even if *identity* does not.

  **R4: The Temporal Gap Constraint**
  This targets your **Time Lag** case. If the data sits on a server for ten years, is *you* sitting on the server?
  *   **Why it's a requirement:** We survive sleep and coma, where psychological continuity is interrupted. But those are biological pauses. A data storage gap is different; the causal chain is preserved, but the *process* is halted.
  *   **The Hard Case (Time Lag):** The theory must distinguish between a *pause in processing* and a *cessation of existence*.
      *   *Option A:* You cease to exist when scanned and are recreated in 10 years. (Implies death today).
      *   *Option B:* You exist as data. (Implies persons can be abstract objects or dormant processes).
      *   *Option C:* It doesn't matter, provided the causal link is secure.
  *   **The Constraint:** The theory cannot simply say "continuity matters." It must specify if continuity requires *overlapping* chains (like a river) or if *causal dependence* across a gap is sufficient. If the theory claims the person is "in the data," it must explain what kind of existence that is without violating R1 (persons are usually processes, not static bits).

  **R5: The Action-Guidance Constraint**
  This is the most critical requirement for your specific project. Metaphysics can afford indeterminacy; decision frameworks cannot.
  *   **Why it's a requirement:** You need to know whether to sign the consent form. A theory that concludes "It is indeterminate if you survive" is practically useless unless it adds "...but you should act as if you do."
  *   **The Constraint:** The theory must bridge the gap between *ontological vagueness* (R3) and *practical certainty*. It must provide a rule for decision-making under metaphysical uncertainty. For example: "Maximize expected psychological continuity."

  **R6: The First-Person Authority Constraint**
  This ensures the theory isn't just about social recognition.
  *   **Why it's a requirement:** Others might treat the copy as you. But the question is: should *you* anticipate the copy's experiences?
  *   **The Constraint:** The theory must ground *anticipation*. If the theory says "The copy is you," but gives no reason for the original to care about the copy's pain any more than a brother's pain, it fails to capture "survival." It must explain the shift from *sympathy* to *self-interest*.

  ***

  ### Phase 4: Critical Analysis of the Requirements

  #### Non-Negotiable vs. Camp Preferences

  **Non-Negotiable (Universal Desiderata):**
  *   **R1 (Empirical Consistency):** Any theory relying on souls is dead on arrival for uploading.
  *   **R5 (Action-Guidance):** Since your goal is a decision framework, a theory that paralyzes decision is inadequate by definition.
  *   **R2 (Fission):** Any theory that collapses into contradiction when faced with duplication is logically flawed.

  **Camp Preferences (Contingent):**
  *   **Transitivity of Identity:** The "Simple View" (Identity is what matters) prefers this. Parfitians reject it for "What Matters." This is a theoretical choice, not a hard requirement for adequacy, provided the theory explains *why* it drops transitivity.
  *   **All-or-Nothing vs. Degrees:** Traditionalists prefer identity to be binary. Parfitians prefer "what matters" to come in degrees. An adequate theory can pick either, provided it handles R3 (Lossy Scan) consistently.

  #### Joint Unsatisfiability: The Trilemma of Uploading

  There is a deep tension here. I argue that the following three requirements are **jointly unsatisfiable** for any single theory. You must sacrifice one:

  1.  **Determinacy:** Survival is a definite fact (Yes/No).
  2.  **Vagueness Tolerance:** Psychological continuity is inherently vague (no sharp cutoff for memory/personality change).
  3.  **Action-Guidance:** The agent must have a clear rational instruction (Step in / Don't Step in).

  **The Conflict:**
  If you accept **Vagueness Tolerance** (which you must, due to the Lossy Scan and neuroscience), then Survival cannot be **Determininate** (there is no fact of the matter at the threshold). If Survival is indeterminate, **Action-Guidance** becomes difficult (how to decide on a fuzzy outcome?).
  *   *Solution A:* Deny Vagueness (posit a sharp cutoff). *Cost:* Arbitrariness. Why does 90.1% continuity count but 89.9% doesn't?
  *   *Solution B:* Deny Determinacy (accept degrees of survival). *Cost:* Complicates Action-Guidance. Do I step in for 50% survival?
  *   *Solution C:* Deny Action-Guidance (accept metaphysical suspense). *Cost:* Useless for your project.

  Most Parfitian theories sacrifice **Determinacy** to save **Vagueness Tolerance**, arguing that *rational concern* tracks the degree of continuity even if *identity* does not.

  #### The Single Requirement That Knocks Out Popular Theories

  You guessed the **Duplication (Fission) Case**. You are correct, but the specific requirement is **R2 (The Fission Constraint)** combined with the intuition that **Identity is One-to-One**.

  **Reasoning:**
  The most popular pre-philosophical theory is the **Simple Identity View** (I am a distinct, enduring entity; survival = identity).
  1.  In a Fission case (one person enters, two leave), the Simple View demands to know: *Which one is the original?*
  2.  If it says "Both," it violates the logic of identity (A cannot be identical to B and C if B is not identical to C).
  3.  If it says "Neither," it implies that duplication kills you. This contradicts the strong intuition (and Parfit's argument) that if one copy survives, you survive; why should two copies kill you?
  4.  If it says "One (arbitrarily)," it implies a metaphysical fact without physical difference.

  **Why R2 kills it:**
  The Fission Constraint forces the theory to admit that **Identity is not What Matters**.
  *   If Identity were what matters, you would die in fission (because identity is lost).
  *   But in fission, you don't seem to lose what matters (your psychology continues).
  *   Therefore, Identity $\neq$ What Matters.

  Any theory that insists "Personal Identity is the only thing that matters in survival" is knocked out by R2. This includes strict Lockean memory theories (if two remember, who is the owner?) and strict Biological Animalism (if the brain is split and transplanted, which animal is me?).

  **However, for your specific project:**
  While Fission kills the *Simple Identity View*, the **R3 (Sorites/Lossy) Constraint** is the one that kills *practical implementation*. A theory can survive Fission philosophically (like Parfit's Reductionism) but still fail to tell you whether to upload if the scan is 95% accurate. The Lossy Scan requirement forces the theory to move from "Identity" to "Expected Utility of Psychological Continuity."

  ### Summary for Your Decision Framework

  To build your framework, you cannot use a theory of *Identity*. You must use a theory of *Relation R* (Psychological Continuity and Connectedness).

  1.  **Accept R3 (Degrees):** Survival is not binary. The upload is "you" to the degree that it is psychologically continuous with you.
  2.  **Accept R4 (Gaps):** The storage time does not matter, provided the causal chain is unbroken. You are not "in the data" as a conscious entity, but your existence is paused, not ended.
  3.  **Resolve the Trilemma:** For the sake of the decision framework, you must treat **Action-Guidance** as paramount. Even if survival is vague, set a **Pragmatic Threshold**. (e.g., "If continuity > 90%, treat as survival for prudential planning").

  This approach satisfies the philosophical desiderata while remaining usable for the commercial context you are designing.
