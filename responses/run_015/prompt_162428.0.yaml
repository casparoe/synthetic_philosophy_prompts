answer: |-
  You have cut through the noise and landed exactly on the technical fault line. The "Loud vs. Silent" distinction you've drawn is effectively a reformulation of the **Causal Exclusion Problem** applied specifically to phenomenology.

  Most pop-philosophy discussions get bogged down in "Can you imagine it?" The real debate, as you've sensed, is about whether the concept of a "Silent Inversion" is semantically coherent or whether it collapses under its own definition.

  Here is where the disagreement actually lives, how the dilemma works, and why the "Silent" horn is the battleground for coherence.

  ### 1. The Dilemma as the Skeptic Sees It
  The anti-qualia side (Eliminativists, Illusionists, or strict Analytic Functionalists) is indeed running a dilemma, but it is more precise than "either functional or ghost." It is a dilemma about **individuation**.

  *   **Horn A (Loud Inversion):** If a change in qualia necessitates a change in functional role (discrimination, memory, reporting, internal monitoring), then qualia are **functionally individuated**.
      *   *Consequence:* "Qualia" is just a name for a specific cluster of functional properties. There is no "extra" thing. To posit qualia over and above function is a category error. This leads to Reductionism.
  *   **Horn B (Silent Inversion):** If a change in qualia leaves all functional roles (including internal cognitive access) identical, then qualia are **causally inert** with respect to the cognitive system.
      *   *Consequence:* This leads to the **Self-Intimation Problem**. If the inversion is truly silent, it doesn't even change your *belief* that you are seeing red. You are in state "Red Qualia" but you function exactly as if you are in state "Green Qualia."
      *   *The Incoherence Charge:* The skeptic argues that if a property makes no difference to the system's state—including its introspective state—the term referring to that property has no anchor. It is a "dangling referent." If I can't distinguish state $Q_1$ from $Q_2$ even in principle (because all discrimination mechanisms are held fixed), then asserting $Q_1 \neq Q_2$ is meaningless.

  **The Skeptic's Conclusion:** The "Silent" option isn't just unknowable; it's incoherent. A difference that makes no difference (internally or externally) is not a difference. Therefore, the concept of qualia as "non-functional feel" is empty.

  ### 2. The Realist's Counter-Move (Defending the Silent)
  The Qualia Realist (Non-Reductive Physicalist, Property Dualist) must defend the coherence of the Silent Inversion without accepting that qualia are irrelevant ghosts. They cannot accept Horn A (or they lose the "hard problem"), so they must bite Horn B but soften the impact.

  Their defense relies on a specific distinction between **Access** and **Phenomenality**.

  *   **The Move:** They argue that "functional role" refers to *Access Consciousness* (availability for reporting, reasoning, control), while qualia refer to *Phenomenal Consciousness*.
  *   **The Argument:** A Silent Inversion is possible because Phenomenal properties **constitute** the experience, rather than **causing** the report.
      *   In a Loud Inversion, the qualia causes a change in the system.
      *   In a Silent Inversion, the qualia *is* the system's state, but the functional/functional-monitoring layer fails to track the change.
  *   **The "What-It's-Like" Shield:** The Realist argues that the skeptic is defining "difference" only as "functional difference." The Realist posits a **primitive difference**.
      *   *Analogy:* Two screens display the same pixel data (functional output), but one is LCD and one is OLED (physical substrate). The skeptic says "If the output is the same, the display is the same." The Realist says "No, the *nature* of the display is different, even if the information processing is identical."

  **The Weakness:** The skeptic replies that the LCD/OLED analogy fails because we can measure the physical difference functionally (voltage, response time). In the Silent Inversion of qualia, *by definition*, no measurement (including introspection) can detect the change. The Realist is left claiming there is a fact of the matter that is undetectable in principle. The skeptic calls this "magic."

  ### 3. Where the "Incoherence" Charge Actually Bites
  You asked: *"Is someone who believes in qualia committed to silent inversions being genuinely possible?"*

  **Yes.** If Silent Inversion is impossible (inconceivable), then Qualia logically supervene on Function. If they supervene on function, they are reducible to function (in the eyes of the physicalist). To maintain that qualia are *sui generis* (of their own kind), the Realist must maintain that Silent Inversion is at least **metaphysically possible** (conceivable without contradiction).

  The Incoherence Complaint targets this conceivability. It argues that "Silent Inversion" is like "Married Bachelor."

  *   **The Wittgensteinian/Private Language Angle:** For a term (like "Red Qualia") to have meaning, there must be a criterion for its correct application. In a Silent Inversion, the criterion for applying "Red" remains fixed (the tomato), but the qualia changes.
  *   **The Problem:** How does the subject know the qualia changed?
      *   If they know via introspection, introspection is a functional process. If the functional process stays the same (Silent), they *don't* know.
      *   If they don't know, in what sense did the "what-it's-like" change? "What-it's-like" implies a subject to whom it is like something. If the subject's cognitive grasp of the situation is identical, the "likeness" is functionally identical.
      *   **The Squeeze:** To say "It feels different but I can't tell" is to sever the link between *feeling* and *taking there to be a feeling*. The skeptic argues this severs the concept of "feeling" entirely.

  ### 4. The Illusionist Synthesis (The Third Way)
  There is a modern position (Keith Frankish, Daniel Dennett) that uses your Loud/Silent distinction to dissolve the debate entirely.

  They argue that the intuition of the "Silent Inversion" is a **cognitive illusion**.
  *   We *think* there is a Silent Inversion possibility because our introspective mechanisms are shallow. We introspect the *output* of our visual system, not the processing itself.
  *   We posit a "qualia residue" because we can't see the gears turning.
  *   **The Claim:** There are no Silent Inversions because there are no Qualia in the realist sense. There is only the Loud stuff (functional judgments). The feeling that there is "something extra" is itself just another functional judgment—a "user-illusion" generated by the brain to simplify self-monitoring.

  ### 5. Summary of the Disagreement
  The debate is not about whether we have experiences (everyone agrees we do). It is about whether the **properties** of those experiences can be individuated independently of their **causal roles**.

  *   **The Realist:** "Yes. I can conceive of the causal role staying fixed while the intrinsic nature changes (Silent Inversion). Therefore, intrinsic nature (qualia) is distinct from causal role."
  *   **The Skeptic:** "No. 'Intrinsic nature' in a mental state is *defined* by its causal role within the cognitive economy (including introspection). To posit a change in nature without a change in role is to posit a change in nothing. It is a verbal trick, not a coherent possibility."

  **Your specific question:** *"If only loud ones are available, then the qualia just look like the functional/discriminative stuff again and theres nothing left to argue about."*
  **Verdict:** Correct. If Silent Inversion is ruled out, Qualia Realism collapses into Functionalism.

  **Your specific question:** *"If they are committed to silent ones, then the posit looks like something no evidence... could ever bear on, and I think that IS the incoherence complaint."*
  **Verdict:** Correct. This is the **Epistemic Gap turned Ontological**. The skeptic argues that if a property is in principle undetectable by the system possessing it (because detection is functional), the property cannot be said to exist for that system.

  ### The "Real Work" Distinction
  To move the debate forward, stop asking "Do qualia exist?" and start asking: **"Is the concept of a mental property that does not alter the functional profile of the mind semantically stable?"**

  *   If you say **Yes**, you are a Non-Reductive Physicalist or Dualist. You must explain how we refer to these properties if they don't causally interact with our referring mechanisms.
  *   If you say **No**, you are an Analytic Functionalist or Eliminativist. You must explain away the powerful intuition that there *could* be a Silent Inversion (the "Hard Problem" intuition).

  The circle you are stuck in is the **explanatory gap**. The Realist says the gap proves the Silent Inversion is possible. The Skeptic says the gap proves the concept of the Silent Inversion is incoherent. You cannot resolve this without choosing a fundamental stance on whether **conceivability entails possibility** and whether **meaning requires causal role**.
