      *   **The Qualia Skeptic (Eliminativist/Illusionist/Strict Functionalist):** Argues that "Silent Inversion" is incoherent. If nothing changes functionally (including introspective reporting), nothing has changed *at all*. The concept relies on a magic "glow" that does nothing.

  4.  **Address the Specific Dilemma (The "Squeeze"):**
