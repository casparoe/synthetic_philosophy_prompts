answer: |-
  **1. What does the Ambiguity Module do?**
  The Module intercepts your intention to exit and replaces it with a randomized instruction. At any identical intersection, it calculates whether you should continue or exit based on a pre-loaded probability distribution. You do not need to understand the calculation. You only need to obey the light.

  **2. Do I need to remember if I've passed an exit already?**
  No. In fact, trying to remember invalidates the calibration. The Module tracks passage internally via geomagnetic signatures. Your inability to distinguish Exit 1 from Exit 2 is a required system feature, not a bug. If you suddenly recognize your surroundings, pull over and recalibrate.

  **3. Should I look at the screen to see the result?**
  We recommend Blind Mode. In this setting, the Module vibrates to indicate "Exit" or silences to indicate "Continue." Knowing the outcome explicitly can alter your credence regarding your location, which lowers your expected payoff. Information is not always beneficial. Sometimes, not knowing is the optimal strategy.

  **4. What probability setting should I use?**
  The factory default is set to exit with a probability of one-third at each intersection. This maximizes your expected return over the course of the highway segment. Adjusting this value based on how close you feel to home will degrade performance. Do not override the default based on intuition.

  **5. What happens if I flip the manual switch twice?**
  The device locks after the first interaction per zone. If you attempt to randomize again at the same intersection, the screen will display "ERROR: TEMPORAL CONSISTENCY." Do not attempt to force a second decision. The first output is binding.

  **6. What is included in the Credence Cloud subscription?**
  Premium subscribers can store their confusion state securely off-device. If you lose confidence in your amnesia, the Cloud restores your previous level of uncertainty. This ensures your credences remain consistent with the planning stage optimal strategy, even if you feel suspiciously oriented.

  **7. Can my passenger operate the Module?**
  Yes, using Passenger Witness Mode. The passenger must verify that you look sufficiently confused before authorizing the randomization. If you appear too confident about which exit you are approaching, the passenger is instructed to withhold authorization until uncertainty is restored.

  **8. I followed the instructions exactly and ended up at the motel.**
  This is a statistically valid outcome. The optimal strategy yields a payoff of 1.33 on average, but individual runs may result in the motel payoff of 1. You followed the protocol correctly. The outcome is unfortunate, but the decision process was sound. Please do not request a refund for variance.

  **9. What does the warranty cover?**
  The Ambiguity Module is warranted against hardware failure for one year. The warranty is void if the user regains spatial awareness, successfully recalls the number of exits passed, or identifies the neighborhood associated with Exit 1. Ignorance is a condition of use.

  **10. What is your return policy?**
  Returns are accepted within 30 days if the device fails to randomize. Returns are not accepted if you simply arrive home too often or not often enough. If you know which exit you are at during the return process, you are ineligible for a refund.
