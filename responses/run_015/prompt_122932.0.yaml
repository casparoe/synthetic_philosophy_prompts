answer: |-
  **1. Predicted Verdict and Primary Rule**

  **Verdict:** Famine.

  **The Rule:** **The Political Entitlement Rule.** An episode is classified as a *famine* if mortality results from a collapse in production or exchange entitlements that a governing political order could have mitigated through redistribution, price control, or relief, provided that physical access to food was not genuinely impossible for any agent. It is classified as a *natural disaster* only if the political order lacked the material capacity to prevent death without causing systemic collapse (the Island case), and as *deliberate starvation* if no entitlement arrangement could have functioned due to hostile physical exclusion (the Siege case).

  **Application to Precedents:** This rule reproduces all seven prior verdicts. Bengal, Ireland, the Great Leap Forward, the Highland Province, and the Sahel all featured food availability (national or regional) and political choices (exports, procurement, relief allocation, omission) that collapsed entitlements. The Siege was excluded because no market or relief arrangement could have penetrated the encirclement (physical impossibility). The Island was a natural disaster because port capacity physically limited imports despite metropolitan effort (material incapacity).

  **Application to Mara Delta:** Under this rule, the Mara Delta is a **famine**. Food was available nationally and locally (on sale), ruling out the Siege condition. The constraint was fiscal (debt service vs. relief), not physical like the Island's port capacity. In the Senian tradition, macro-economic policy (debt service, subsidy removal) is a political choice, not a force of nature. The state prioritized creditors and urban price stability over delta entitlements. The mortality pattern (pastoralists, fishers, laborers) indicates an exchange entitlement collapse driven by price tripling and wage suppression, which the state had the authority to mitigate but chose not to.

  **2. Alternative Rules and Predictions**

  **Alternative Rule A: The Genuine Capacity Constraint Rule.**
  *   **Logic:** An episode is a *natural disaster* if the state lacks the material or macro-economic capacity to prevent death without triggering a systemic collapse that would cause greater mortality elsewhere. It is a *famine* only if the state possessed the surplus capacity to save the population but withheld it.
  *   **Fit to Precedents:** This fits the seven cases. The Island lacked port capacity (Disaster). The Siege lacked physical access (Starvation). In Bengal, Ireland, GLF, Highland, and Sahel, the state had the grain, the logistics, or the fiscal space to intervene but did not (Famine).
  *   **Prediction for Mara Delta:** **Natural Disaster.** The Finance Ministry's note indicates that adequate relief required suspending debt service, which the Central Bank predicted would collapse the currency and spike urban food prices. If this prediction is accepted as a material constraint rather than a political justification, the state faced a "trolley problem" where saving the Delta would starve the Cities. Unlike the Island's physical port limit, this is a macro-economic limit, but functionally it represents a genuine incapacity to feed *everyone*.

  **Alternative Rule B: The Sovereign Autonomy Rule.**
  *   **Logic:** An episode is a *famine* if the starvation results from the discretionary choices of a sovereign political order. It is a *natural disaster* if the starvation results from external constraints (foreign powers, creditors, neighbors) that limit sovereign agency, or if the sovereign acts to the limit of its external allowances.
  *   **Fit to Precedents:** This fits the seven cases. Bengal, Ireland, GLF, Highland, and Sahel involved sovereign or colonial decisions on exports, procurement, and relief allocation (Famine). The Island's metro power shipped "what it could" under capacity limits (Disaster). The Siege was imposed by a hostile external agent (Starvation).
  *   **Prediction for Mara Delta:** **Natural Disaster.** The Mara Delta's crisis was triggered by upstream dams in a neighbouring country (external). The fiscal constraint was "creditor-backed" (external). The state extracted nothing from the delta and expanded the programme once debated. Under this rule, the state is viewed as a constrained agent acting within limits set by creditors and neighbors, analogous to the Island's metro power, rather than a malicious or negligent sovereign like the Highland or GLF cases.

  **3. Consistency, Analogue, and Principle**

  **Recommended Verdict:** **Famine.**

  **Closest Analogue:** **The Sahelian Drought.**
  *   **Why:** Both episodes involve a natural trigger (drought/flood failure) that operated through a collapse of exchange entitlements (terms of trade/price spikes) rather than a total absence of food. In both cases, a national surplus existed (grain balance/record harvest elsewhere), but relief was misallocated or inadequate (towns first vs. low-wage distant works). Crucially, in both cases, the state had the *theoretical* capacity to intervene but failed to prioritize the affected group.
  *   **Principle:** By ruling this a famine, the register commits to the principle that **macro-economic policy is political policy.** It establishes that debt service, currency stability, and creditor relations are not "natural" constraints akin to port capacity or drought, but prioritization choices. It treats the Finance Ministry's warning not as a physical limit (like the Island's docks) but as a political valuation (urban consumers/creditors > delta pastoralists).
  *   **Evidentiary Weight:** The verdict rests almost entirely on the **Finance Ministry note regarding debt service.** If the register accepts the note as a statement of physical impossibility (currency collapse = no food anywhere), the verdict shifts to Natural Disaster (aligning with the Island). If the register treats the note as a political justification for prioritization (aligning with the GLF output figures or Ireland's export rationale), the verdict is Famine. Given the director's history of skepticism toward state claims of necessity (GLF, Ireland), the file rests on treating the economic constraint as a political choice.

  **4. Decisive Finding**

  **The Finding:** **Evidence of unutilized, liquid foreign exchange reserves held by the central bank that were legally available for humanitarian spending but not deployed.**

  **Results under each rule:**
  *   **Political Entitlement Rule:** **Famine.** The existence of liquid reserves proves the capacity to import food or subsidize transport existed. The failure to use them confirms the collapse of entitlements was due to political prioritization, not incapacity.
  *   **Genuine Capacity Constraint Rule:** **Natural Disaster.** If the reserves were legally ring-fenced by creditor agreements such that tapping them would trigger immediate default and total import collapse, the capacity was genuinely absent. The finding would validate the "systemic collapse" warning.
  *   **Sovereign Autonomy Rule:** **Famine.** If the reserves were available but the state chose not to invoke the humanitarian clause (if one existed) or negotiate access, it demonstrates a failure of sovereign will to protect its population, distinguishing it from the Island case where the metro power shipped "what it could."

  **Why this distinguishes them:** This finding isolates the variable of *choice* versus *constraint*. The Entitlement and Autonomy rules view the state's internal/external priorities as political choices (Famine). The Capacity rule views legal/financial lock-outs as material constraints (Disaster). It forces the director to decide whether a creditor-imposed financial lock-out is equivalent to the Island's physical port limit or the Highland's political omission.
