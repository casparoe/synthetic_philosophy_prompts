answer: |-
  The list cannot be jointly satisfied because Full Determinacy, Interest-Invariance, and Restrictive Verdicts matching Biological/Legal Intuitions form an inconsistent triad.

  **Specification of Adequacy**

  1.  **Universal Verdicts (Non-Negotiable):** The principle must return a yes or no for any plurality whatsoever, from particle pairs to galactic clusters. *Case:* A court cannot suspend judgment on whether a rebuilt cathedral is an object simply because the atoms are numerous; logic demands bivalence for the existence claim.
  2.  **No Causal Double-Counting (Non-Negotiable):** The causal powers of a composite at a time must not merely duplicate the causal powers of its parts at that time. *Case:* Physical closure requires that if the atoms move the ship, the ship does not also move it as a separate overdetermining cause.
  3.  **Interest-Invariance (Non-Negotiable for Purpose / Camp Preference Metaphysically):** Verdicts must not shift with the conceptual schemes or pragmatic interests of the observer. *Case:* A legal verdict cannot depend on whether the litigant cares about the ship's history versus its current planks; however, many metaphysicians prefer conventionalism to save common sense.
  4.  **Full Determinacy (Camp Preference):** There must be no in-principle indeterminacy in whether composition occurs. *Case:* Semantic tidiness suggests predicates must have sharp extensions, though this smuggles in a taste for precise ontology over vague reality.
  5.  **Temporal Locality (Camp Preference):** Whether the xs compose at $t$ cannot depend on facts at times remote from $t$. *Case:* Synchronic ontologies demand existence supervene on present arrangement, but this conflicts with historical essentialism required for some identity cases.
  6.  **Non-Vacuousness (Non-Negotiable):** The principle must not merely redescribe composition or fail to fire for any plurality. *Case:* An explanation that says "xs compose when they compose" offers no guidance for the biologist counting colonies.
  7.  **Diachronic Extensibility (Non-Negotiable for Purpose):** The account must ground persistence conditions capable of tracking identity through material replacement. *Case:* Omitted from your list but required for the ship and digital object cases; synchronic composition alone cannot answer diachronic identity questions.
  8.  **Empirical Adequacy (Non-Negotiable):** The verdicts must not contradict established findings in biology or physics. *Case:* A biologist cannot count organisms in a way that violates genetic or metabolic data regarding clonal colonies.

  **Analysis of Desiderata**

  The requirement for **Full Determinacy** is a prejudice of the semantic camp that prioritizes logical tidiness over metaphysical reality, as it forces sharp boundaries where nature offers gradients. **Interest-Invariance** is a genuine desideratum for your legal purpose but a camp preference in metaphysics, where conceptual relativity is often invoked to solve Sorites problems. The unsatisfiable subset consists of **Full Determinacy**, **Interest-Invariance**, and **Restrictive Verdicts** (the requirement that only some pluralities compose, matching biological and legal intuitions); holding all three forces you into Universalism or Nihilism, both of which fail the utility constraint. The single requirement that excludes the most candidate answers is **Interest-Invariance**, as it eliminates the entire class of conventionalist solutions that most gracefully handle the ship and clonal colony cases.

  **Evaluation of Candidate Views**

  Universalism satisfies Full Determinacy and Interest-Invariance but fails Diachronic Extensibility by making identity trivial and reference impossible for courts.
  Nihilism satisfies Full Determinacy and Interest-Invariance but fails Diachronic Extensibility by denying the existence of the artifacts and organisms courts must adjudicate.
  Organicism fails Full Determinacy due to the vagueness of biological boundaries and often fails Interest-Invariance if life functions are defined by human interests.
