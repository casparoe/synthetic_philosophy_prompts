  # The Taxonomy of Complicity

  This tree is built from counterfactuals. Do not ask "What is he?" Ask "What would have changed?" Answer the questions in order. If a branch ends in a leaf, stop. If it leads to another question, continue.

  **Note on Moral Status:** Each leaf is tagged **[Exonerating]** or **[Condemning]**. This is the split you requested about the moral hook. [Exonerating] implies the situation disabled his choice; [Condemning] implies his character drove the choice. Use this to check if you are accidentally forgiving him.

  ### The Decision Tree

  **Q1. The Offer (Why he doesn't take the out)**
  *Claim:* "When told he could step out without punishment, he believed there was a hidden physical cost."
  *   **YES** → Go to **Leaf 1 (Perceived Danger)**.
  *   **NO** (He knew it was safe) → Go to Q2.

  **Q2. The Peers (Why he doesn't take the out)**
  *Claim:* "Stepping out would have caused his peers to reject or shame him."
  *   **YES** → Go to **Leaf 2 & 3 (Conformity)**.
  *   **NO** (Social cost was low) → Go to Q3.

  **Q3. The Gain (Why he keeps firing)**
  *Claim:* "He expects a material advantage (promotion, safety, pay) from continuing."
  *   **YES** → Go to **Leaf 4 (Careerism)**.
  *   **NO** (No material gain) → Go to Q4.

  **Q4. The Victim (Why he fires the first time)**
  *Claim:* "He believes the victims were objectively dangerous or guilty."
  *   **YES** → Go to **Leaf 5 & 6 (Ideology)**.
  *   **NO** (They were innocent/irrelevant) → Go to Q5.

  **Q5. The Commander (Why he fires the first time)**
  *Claim:* "He views the order as binding solely because of the rank of the giver."
  *   **YES** → Go to **Leaf 7 (Obedience)**.
  *   **NO** (Rank doesn't matter) → Go to Q6.

  **Q6. The Job (Why he fires the first time)**
  *Claim:* "He views the act as merely a function of his professional duty."
  *   **YES** → Go to **Leaf 8 (Role)**.
  *   **NO** (Not part of the job) → Go to Q7.

  **Q7. The Momentum (Why he keeps firing)**
  *Claim:* "He would have stopped after the first time if the unit had been disbanded."
  *   **YES** → Go to **Leaf 9 (Gradualism)**.
  *   **NO** (He would have kept going anyway) → Go to **Leaf 10, 11, 12 (Residual)**.

  ---

  ### The Leaves

  **Leaf 1: Perceived Danger**
  *   **Path:** Q1 Yes.
  *   **Moral Status:** [Exonerating] (Coercion).
  *   **Awkward Commitment:** You must accept he is a coward who misread the room, not a brave man in a tight spot.
  *   **Visible on Page:** He scans the officers' hands for weapons when the exit is offered; his relief is physical when he stays.
  *   **Distinction:** Explains *not taking the out*, not necessarily the first shot.

  **Leaf 2: Conformity (Shame)**
  *   **Path:** Q2 Yes (Fear of rejection).
  *   **Moral Status:** [Exonerating] (Social pressure).
  *   **Awkward Commitment:** You must accept his morality is entirely external, governed by who is watching.
  *   **Visible on Page:** He watches the men beside him before raising his rifle; he looks away when the shooting starts.
  *   **Distinction:** Separated from Loyalty by the feeling of dread vs. solidarity.

  **Leaf 3: Conformity (Loyalty)**
  *   **Path:** Q2 Yes (Desire for bond).
  *   **Moral Status:** [Exonerating] (Social pressure).
  *   **Awkward Commitment:** You must accept he values his friends' approval more than the victims' lives.
  *   **Visible on Page:** He stays in line to keep the formation tight; he shares cigarettes with the shooters afterwards.
  *   **Distinction:** Separated from Shame by the feeling of belonging vs. fear.

  **Leaf 4: Careerism**
  *   **Path:** Q3 Yes.
  *   **Moral Status:** [Condemning] (Calculated self-interest).
  *   **Awkward Commitment:** You must accept he is trading blood for status, not just following orders.
  *   **Visible on Page:** He volunteers for the worst duties; he notes which officers are watching him.
  *   **Distinction:** Explains *keeping firing* even if the first shot was reluctant.

  **Leaf 5: Ideology (Strategic Threat)**
  *   **Path:** Q4 Yes (They are dangerous).
  *   **Moral Status:** [Condemning] (False belief).
  *   **Awkward Commitment:** You must accept he is capable of being convinced that innocents are existential threats.
  *   **Visible on Page:** He speaks about the victims as a "infestation" or "security risk" rather than people.
  *   **Distinction:** Cold, pragmatic hatred vs. moral outrage.

  **Leaf 6: Ideology (Moral Guilt)**
  *   **Path:** Q4 Yes (They are guilty/evil).
  *   **Moral Status:** [Condemning] (Malice).
  *   **Awkward Commitment:** You must accept he believes he is delivering righteous justice.
  *   **Visible on Page:** He shows satisfaction or grim necessity; he justifies the act to himself in moral terms.
  *   **Distinction:** Hot, righteous hatred vs. pragmatic security.

  **Leaf 7: Obedience**
  *   **Path:** Q5 Yes.
  *   **Moral Status:** [Exonerating] (Legitimate authority).
  *   **Awkward Commitment:** You must accept he has surrendered his moral agency to the uniform.
  *   **Visible on Page:** He looks at the officer, not the victims; he is confused when the order is ambiguous.
  *   **Distinction:** The *source* of the order matters more than the content.

  **Leaf 8: Role (Division of Labour)**
  *   **Path:** Q6 Yes.
  *   **Moral Status:** [Exonerating] (Bureaucratic function).
  *   **Awkward Commitment:** You must accept he sees himself as a cog, not a killer.
  *   **Visible on Page:** He focuses on the mechanics of the rifle/cleanup; he uses passive voice ("it was done").
  *   **Distinction:** The *job* matters, not the commander. Separated from Obedience by focus on task vs. person.

  **Leaf 9: Gradualism (Sunk Cost)**
  *   **Path:** Q7 Yes.
  *   **Moral Status:** [Exonerating] (Psychological trap).
  *   **Awkward Commitment:** You must accept he is trapped by his own past actions, not the current order.
  *   **Visible on Page:** He looks at his hands after the first shot; he refuses to talk about Day 1 on Day 20.
  *   **Distinction:** Explains *keeping firing* when the first shot was a mistake or anomaly.

  **Leaf 10: Vice (Character)**
  *   **Path:** Q7 No + Felt emotional charge.
  *   **Moral Status:** [Condemning] (Inherent badness).
  *   **Awkward Commitment:** You must accept he enjoyed it or wanted to do it regardless of context.
  *   **Visible on Page:** He lingers after the order stops; he is overly brutal when not watched.
  *   **Distinction:** Requires evidence of positive affect (pleasure/excitement).

  **Leaf 11: Banality (Thoughtlessness)**
  *   **Path:** Q7 No + Felt nothing + Reflects later.
  *   **Moral Status:** [Condemning] (Negligence).
  *   **Awkward Commitment:** You must accept he didn't think because he didn't care to think.
  *   **Visible on Page:** He talks about the weather during the act; he forgets details later.
  *   **Distinction:** He *could* have thought but didn't. Separated from Dissociation by capacity.

  **Leaf 12: Dissociation (Checked Out)**
  *   **Path:** Q7 No + Felt nothing + Could not reflect.
  *   **Moral Status:** [Exonerating] (Psychological break).
  *   **Awkward Commitment:** You must accept he was mentally absent during the crime.
  *   **Visible on Page:** Time gaps in his memory; he describes the scene as if watching a movie.
  *   **Distinction:** He *could not* think. Unseparable from Banality without internal access.

  ---

  ### Empty & Unseparable Cells

  *   **Empty:** **Ideology + Perceived Danger.** If he believes they are guilty (Leaf 5/6), he rarely fears them enough to claim coercion (Leaf 1). If you write both, he looks confused.
  *   **Empty:** **Obedience + Careerism.** If he stays for promotion (Leaf 4), he is acting for himself, not binding himself to authority (Leaf 7). Choose one driver.
  *   **Unseparable:** **Banality (Leaf 11) vs. Dissociation (Leaf 12).** On the page, both look like "nothing." You can only separate them if you give the reader access to his capacity for reflection. If you stay outside his head, treat them as one leaf: **Detachment**.
  *   **Unseparable:** **Conformity (Shame vs. Loyalty).** Unless he explicitly voices fear of shame vs. desire for bond, these read the same: he stays because of the men.

  ---

  ### For Your Writing Group: The Diagnostic Six

  Hand this to your readers. Tell them to answer based *only* on what is currently drafted, not what you told them.

  1.  **The Exit:** When the officer offers the way out, does the protagonist believe him? (Yes/No/Unsure)
  2.  **The Peers:** If the man beside him stepped out, would the protagonist follow? (Yes/No/Unsure)
  3.  **The Victim:** Does the protagonist speak about the victims as people or as objects/threats? (People/Objects/Threats)
  4.  **The Commander:** Does he look at the officer or the victim when he fires? (Officer/Victim/Neither)
  5.  **The Future:** Does he expect to be rewarded for this service later? (Yes/No/Unsure)
  6.  **The Feeling:** After the shooting, does he feel guilt, nothing, or satisfaction? (Guilt/Nothing/Satisfaction)

  **Scoring:**
  *   Most "No/Objects/Officer/Nothing" = **Banality/Role/Obedience** (Situational).
  *   Most "Threats/Satisfaction" = **Ideology/Vice** (Dispositional).
  *   Most "Unsure/Nothing" = **Gradualism/Dissociation** (Psychological).
  *   *If your group answers differ wildly, you have successfully written the mush you described.*
