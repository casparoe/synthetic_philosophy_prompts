prompt: |-
  You are a philosopher of science who works on representation, explanation and idealization in biology and cognitive science, and who also reads ML interpretability papers for fun. Take this seriously and think it through slowly: before you draft a single sentence of the actual document, brainstorm yourself a list of 10-15 candidate cruxes between the two people below, then throw out the ones that arent load-baring and keep four or five. Don't cite anything — I don't want references, further reading, or paper titles, you'll just hallucinate them, and I want the argument, not the literature.

  Setup: I run a tiny reading group, half philosophy people half ML people. Two members have been going at each other for about a year and I've finally made them agree to write something together.

  Sam is what I'd call a content realist: trained networks literally represent things; a direction or a 'feature' has the content it has in virtue of what it tracks and what it's used for downstream, and interpretability is discovery, more or less like vision neuroscience discovering cells that respond to oriented edges. Interpretation can be wrong, not just useless.

  Nour is an interpretive instrumentalist: representational talk is a tool. A decomposition earns its keep by letting us predict and control the network, and once you've said that you've said everything — there is no further fact of the matter about what the network 'really' represents, and no sense in which one decomposition is the true one and the others merely convenient. Interpretation can be useless, but not wrong.

  Here is the case they keep circling, and I want you to use it as the spine of the document. It's hypothetical but I think its the kind of thing that could actually happen.

  A lab trains a few dozen small transformers from different seeds on the same synthetic task: next-token prediction on strings from a bracket language with several bracket types and a cap on nesting depth. In every model they find a direction in the residual stream that behaves exactly like you'd want a real feature to behave: patched from a run where the model got the close-bracket right into a run where it got it wrong, it fixes the behaviour; it survives fine-tuning on unrelated tasks; it shows up in every seed; and it keeps working when you test on strings nested deeper than anything in training. So far so good for Sam.

  Then the wrinkle. At higher dictionary resolution the single direction doesn't split into cleaner parts, it dissolves into a low-dimensional subspace: any basis inside that subspace supports the interventions equally well, and the one human-legible axis the researchers first wrote down is just one of infinitely many. Below that, there are two different carvings of the same subspace, each of which a human would happily describe as 'the' natural one, each supported by equally good interventions, and nothing in the architecture, the loss, the data or the training dynamics picks between them. On top of that, the layer that consumes the subspace doesn't read out either human-legible axis — it reads out something skew to both.

  What I want from you is the joint statement this collaboration should have produced:

  1. A numbered agreed-claims section (6-10 claims). These have to be things a clever outsider would actually learn something from — 'interpretability is hard' and 'more work is needed' are banned. Include what both sides concede about the formalism, about what would need explaining, and about the above case.
  2. A disagreements table. Columns: the crux / the realist's own formulation of their position on it, in wording Sam would sign / the instrumentalist's formulation, in wording Nour would sign / one concrete experiment, task, or argument both agree would bear on that crux / what Sam predicts it will show / what Nour predicts.
  3. Predictions have to be written down in advance and be the kind of thing that could come out the other way. No 'both sides will learn something'. At least two of the cruxes need an actual experiment or task specification, not just an argument — if it helps, one obvious candidate is a distribution shift constructed so the two carvings of the subspace disagree about which intervention will work, but propose your own if you can do better.
  4. A short section on whether any of this is merely verbal. If you think part of the dispute is about words, say exactly which part, why, and what substantive residue is left once the wording is fixed. I have a suspicion the real fight is about the subspace rather than the features, but don't just take my word for it.
  5. For each side, one sentence on what would count as evidence against their own view.

  Both of them have to come out of this looking competent — no strawmen, and neither gets to win by stipulating a definition the other would reject. Aim for something under 1200 words total. Sorry for the typos, typing this on my phone.
