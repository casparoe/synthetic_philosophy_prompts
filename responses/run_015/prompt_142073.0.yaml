answer: |-
  **Joint Statement on Representational Realism and Instrumentalism in Mechanistic Interpretability**

  **1. Agreed Claims**
  1.  Causal intervention is a necessary condition for validating interpretability claims.
  2.  In the bracket language case, the relevant representational vehicle is a low-dimensional subspace, not a single direction.
  3.  This subspace exhibits rotational freedom: infinitely many bases support identical interventions within the training distribution.
  4.  Downstream layers read out a projection skew to human-legible axes within that subspace.
  5.  Generalization to deeper nesting preserves the utility of the subspace, not necessarily specific axes.
  6.  Stability across random seeds indicates structural necessity, but not semantic uniqueness.
  7.  The architecture and loss function do not explicitly penalize rotation within the identified subspace.
  8.  "Feature" is currently ambiguous between "stable direction" and "invariant subspace."
  9.  Utility (predictive/control capacity) is necessary for any valid interpretation.
  10. Discovery involves locating the invariant subspace before selecting a basis for description.

  **2. Disagreements Table**

  | Crux | Realist (Sam) | Instrumentalist (Nour) | Concrete Test / Argument | Sam's Prediction | Nour's Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Ontological Unit** | Axes within the subspace are real entities; the subspace is merely their container. | The subspace is the only real entity; axes are arbitrary coordinate tools. | **Forced Alignment:** Train a new readout head that relies exclusively on Axis A of the human-legible basis. | The network will rotate internal weights to align the true mechanism with Axis A. | The network will utilize the subspace regardless of Axis A's orientation; alignment won't shift. |
  | **2. Content Fixing** | Upstream tracking (what caused the activation) fixes the semantic content. | Downstream usage (what the activation causes) fixes the semantic content. | **Skew Probe:** Compare correlation of Axis A vs. the Skew Readout with ground-truth bracket counts. | Axis A will correlate better with semantic truth despite the skew readout. | The Skew Readout will predict behavioral outputs better than Axis A. |
  | **3. Symmetry Breaking** | Natural kinds exist; a distribution shift will reveal one basis as uniquely robust. | Symmetry is fundamental; robustness is relative to the chosen shift, not the basis. | **Distribution Shift:** Test on strings where nesting logic favors Basis B's geometry over Axis A. | Basis B will emerge as the "true" feature; Axis A interventions will fail. | Both bases will remain equally valid; failure will be subspace-wide, not axis-specific. |
  | **4. Normative Status** | Interpretations can be false (mismatched with reality) even if useful. | Interpretations cannot be false, only useful or useless for a specific purpose. | **Mislabeling:** Find a basis that supports successful interventions but implies wrong semantics. | This is a false positive; the interpretation is wrong despite causal efficacy. | This is a useful model; "wrongness" is incoherent if control is maintained. |

  **3. On the Merely Verbal**
  Is this dispute merely about the word "representation"? No. If it were verbal, agreeing to define "representation" as "invariant subspace" would resolve the tension. It does not. The substantive residue concerns whether rotational invariance kills realism about specific features. Sam claims the invariance is superficial (a masking of the true axis); Nour claims it is fundamental (there is no true axis). If we strip the word "representation," Sam still believes there is a fact of the matter about which axis *ought* to be there, while Nour believes there is only the subspace and our pragmatic choice of basis. The fight is about the subspace versus the features, not the label attached to them.

  **4. Falsification Conditions**
  **Sam:** I would abandon realism if shown a case where causal efficacy remains stable across seeds and tasks, but no stable direction or basis can be identified even in principle.
  **Nour:** I would abandon instrumentalism if shown a case where training dynamics uniquely select one specific basis despite rotational freedom in the loss landscape.
