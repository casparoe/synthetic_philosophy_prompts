prompt: |-
  I teach a 200-level "evidence and inference" course that's cross-listed between philosophy and stats — 18 students, mixed majors, and I get exactly one 75-minute session to do Simpson's paradox with them. Last year I put the Berkeley admissions table on a slide and it died on contact: half of them had already seen the trick in some stats YouTube video, so they could recite "the trend reverses when you disaggregate" without feeling a thing, and when I asked which table they'd actually act on they just picked whichever one they thought I wanted. This year I want them to manufacture a reversal out of their own decisions, argue about it while it's still live, and only get the name at the very end, in the debrief, after they've already staked out positions they have to walk back. No lecture up front, no slides of someone else's data, no computers — printing and index cards only.

  Here's the half-baked mechanic I sketched in a notebook, and I'd like you to build the real thing around it (fix the numbers if mine are off, but keep the shape). Everyone is a gladiator in a two-tier league: in each round you choose whether to fight a Novice or a Champion. Each gladiator has a hidden form card giving their personal win rates against each tier, and instead of coin flips you hand them a physical deck of 10 cards per matchup type, shuffled and drawn, so the rates come out exact and the arithmetic is clean on the board. A win over a Novice is 1 point, over a Champion is 3. The scoreboard tracks wins, losses, and points. My suggested cards: a strong gladiator wins 8 of 10 against Novices and 4 of 10 against Champions; a weak one wins 5 of 10 and 1 of 10. Do the expected-value arithmetic and the strong gladiator rationally hunts Champions (0.4 × 3 beats 0.8 × 1) while the weak one farms Novices (0.5 beats 0.3) — so the strong gladiator's pooled win rate comes out at 40% and the weak one's at 50%, even though the strong one beats the weak one in both tiers. I want the room to first crown a champion by win rate, then have to defend it, and then have to say what they think "better" means here and why the question they were asked wasn't the question they answered. I'd also like a second phase that reuses the exact same table under different stories: the tier is picked by the gladiator (as in the game), the tier is assigned by a matchmaker after a fitness check the gladiator can't influence, and the tier is partly a consequence of how the gladiator did in earlier rounds — same numbers, three different right answers, and nothing in the table to tell them which story they're in.

  So what I need from you is the full runnable design: rules and scoring, the materials and what gets printed, a minute-by-minute timeline for 75 minutes, any roles (I like the idea of a Commissioner who has to declare a champion, and a couple of Scouts who only ever see the pooled table), what the facilitator says and when, and a debrief that maps specific moments in the game onto the idea — composition, confounding, and the fact that whether to aggregate is a causal question, not a statistical one. Two more things I care about. First, tell me what will predictably go wrong the first time I run this and how to handle it — I can already imagine the strong gladiator's first pick being so obviously right that the choice feels trivial, someone shouting that it's rigged once they see the decks, and a stubborn student insisting the points leader is the best fighter and refusing to budge. Second, be straight with me about what this activity can't reproduce and that I'll have to supply myself: a friend of mine does epidemiology and keeps insisting that with odds ratios you can get a reversal with no confounding at all, something about non-collapsibility, and I don't understand it well enough to stage it or to explain it — if that's right, say so and tell me how to fold it in as a caveat rather than a demo. I also want an honest note on the version of the lesson I'm losing by building the reversal into the incentives, since a sharp student will eventually notice that I arranged for the composition difference rather than discovering it.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**

      *   **Context:** 200-level "Evidence and Inference" course (Philosophy/Stats cross-listed). 18 students. 75 minutes.
      *   **Goal:** Teach Simpson's Paradox (SP) without lecturing first. Students must *experience* the reversal through decision-making, argue about it, and only get the label at the end.
      *   **Constraints:** No computers, no slides of pre-existing data. Printing and index cards only.
      *   **Core Mechanic:** Gladiator game. Two tiers (Novice/Champion). Hidden win rates. Physical decks (10 cards) for exact probabilities. Points system (Novice=1, Champion=3).
      *   **Specific Numbers Provided:**
          *   Strong Gladiator: 8/10 vs. Novice, 4/10 vs. Champion.
          *   Weak Gladiator: 5/10 vs. Novice, 1/10 vs. Champion.
          *   Incentive: Strong prefers Champions (EV: $0.4 \times 3 = 1.2$ vs $0.8 \times 1 = 0.8$). Weak prefers Novices (EV: $0.5 \times 1 = 0.5$ vs $0.1 \times 3 = 0.3$).
          *   Resulting Paradox: Strong has lower pooled win rate than Weak, despite beating Weak in both tiers.
      *   **Phases:**
          1.  Game/Decision making.
          2.  Crowning a champion (Win Rate vs. Points).
          3.  Debrief/Labeling.
          4.  Second Phase: Same table, three different causal stories (Choice, Assignment, Consequence).
      *   **Deliverables:** Full runnable design (rules, materials, timeline, script), troubleshooting (what goes wrong), limitations (non-collapsibility/odds ratios), and pedagogical reflection (manufactured vs. discovered).

  2.  **Verify the Math (Crucial Step):**

      *   *Strong Gladiator:*
          *   Strategy: Fight Champions (to maximize points).
          *   Matches: Let's say 10 matches. All vs. Champions.
          *   Wins: 4. Losses: 6. Win Rate: 40%. Points: $4 \times 3 = 12$.
      *   *Weak Gladiator:*
          *   Strategy: Fight Novices (to maximize points/win rate).
          *   Matches: Let's say 10 matches. All vs. Novices.
          *   Wins: 5. Losses: 5. Win Rate: 50%. Points: $5 \times 1 = 5$.
      *   *Comparison:*
          *   Tier 1 (Novice): Strong (80%) > Weak (50%).
          *   Tier 2 (Champion): Strong (40%) > Weak (10%).
          *   Pooled (Game Outcome): Weak (50%) > Strong (40%).
      *   *Wait, there's a catch:* For Simpson's Paradox to hold in the *pooled* data, we need to compare them *as if* they played a mix, or we need the aggregate of their actual choices to show the reversal.
      *   *The User's Setup:* The paradox arises because the *choice of opponent* acts as the confounding variable.
      *   *If we just compare their actual game logs:*
          *   Strong: 4/10 (40%).
          *   Weak: 5/10 (50%).
          *   Reversal exists.
      *   *But wait,* to show SP properly, we usually need to show that *if* they played the same distribution, the trend holds. But here the lesson is about *aggregation bias due to selection*.
      *   *Refinement:* To make the paradox "pop" on the board, we need to construct the "Pooled Table" together.
      *   *Scenario:* Suppose there are multiple Strong and Weak gladiators, or one plays multiple rounds. Let's assume for the sake of the class aggregate that we have, say, 9 Strong Gladiators and 9 Weak Gladiators (since there are 18 students).
      *   *Actually, 18 students is small.* Let's make them pairs or teams. Or, better, every student is a Gladiator. 9 Strong, 9 Weak.
      *   *Rounds:* Let's say 10 rounds.
      *   *Strong Strategy:* All choose Champions. Total Strong Matches: 90. Wins: $90 \times 0.4 = 36$. Rate: 40%.
      *   *Weak Strategy:* All choose Novices. Total Weak Matches: 90. Wins: $90 \times 0.5 = 45$. Rate: 50%.
      *   *Disaggregated:*
          *   Vs Novice: Strong (80%) > Weak (50%).
          *   Vs Champion: Strong (40%) > Weak (10%).
      *   *Aggregated:* Weak (50%) > Strong (40%).
      *   *Math Check:* The user's numbers work for the reversal *if* the distribution of opponents differs drastically.
      *   *Correction on Points:* The user wants Points to drive the decision, but Win Rate to drive the "Champion" title. This creates the tension.
      *   *Strong:* 4 wins (Champions) = 12 points. 40% win rate.
      *   *Weak:* 5 wins (Novices) = 5 points. 50% win rate.
      *   *Tension:* Who is "better"? The one with more points (Strong) or the higher win rate (Weak)?
      *   *The Paradox:* If you judge by Win Rate (aggregated), Weak is better. If you judge by Skill (disaggregated), Strong is better.
      *   *Wait, one nuance:* For SP to be mathematically strict, the weighted average of the Strong's rates must be lower than the Weak's.
          *   Strong Avg = $0.8 \times (\%Novice) + 0.4 \times (\%Champ)$.
          *   Weak Avg = $0.5 \times (\%Novice) + 0.1 \times (\%Champ)$.
          *   If Strong plays 100% Champions: Avg = 0.4.
          *   If Weak plays 100% Novices: Avg = 0.5.
          *   $0.4 < 0.5$. Reversal holds.
      *   *Okay, the math is solid.*

  3.  **Drafting the Lesson Plan:**

      *   **Materials:** Index cards (Form Cards, Outcome Decks), Score sheets, Board space.
      *   **Roles:** Commissioner (Instructor or Student?), Scouts (Data aggregators), Gladiators (Students).
      *   **Timeline:**
          *   0-10: Setup & Rules.
          *   10-35: Phase 1 (The Game).
          *   35-50: Phase 2 (The Judgment & Argument).
          *   50-65: Phase 3 (The Three Stories).
          *   65-75: Debrief & Theory.
      *   **Phase 1:** Students get hidden identity (Strong/Weak). They choose opponent type. They draw cards. Record results.
      *   **Phase 2:** Scouts aggregate data. Board shows Pooled Win Rate (Weak wins) vs. Disaggregated (Strong wins). Class argues who gets the trophy.
      *   **Phase 3:** Instructor changes the *story* of *why* they fought who they fought. (Choice vs. Assignment vs. Consequence).
      *   **Debrief:** Connect to SP, Confounding, Causal Structure.

  4.  **Troubleshooting (Predicting Failure Modes):**

      *   *Issue 1: Trivial Choice.* If Strong knows they are Strong, they might think "I can beat anyone." But the EV calculation shows Champions are better for points. I need to make sure the *incentive* (Points) aligns with the *confounder* (Opponent Tier).
      *   *Issue 2: "It's Rigged".* Students might suspect the decks are stacked. *Fix:* Let them shuffle. Let them see the composition (8 red, 2 black, etc.) before sealing.
      *   *Issue 3: Stubborn Student.* "Win rate is win rate." *Fix:* This is actually good. Lean into it. Ask "Would you bet on the Weak guy against the Strong guy in a duel?"
      *   *Issue 4: Time.* 75 mins is tight for 18 students to draw 10 cards each. *Fix:* Reduce rounds. 5 rounds is enough for the law of large numbers to feel real with 10-card decks, but 10 cards *is* the deck. So 1 draw = 1 match? No, the prompt says "deck of 10 cards... so rates come out exact."
      *   *Correction:* If I give them a deck of 10 cards representing 10 matches, they don't need to play 10 rounds. They just draw the whole deck once per "Season". That saves massive time.
      *   *Revised Mechanic:* Each student gets a "Season Deck". They decide the composition of opponents (e.g., 10 Champion cards or 10 Novice cards). They draw through the deck. That represents their season record.

  5.  **Addressing the "Non-Collapsibility" Question:**

      *   *The Friend's Point:* In logistic regression, odds ratios are non-collapsible. You can get a reversal (or shift) in ORs even without confounding, purely due to the mathematical property of the OR when adding a covariate that is associated with the outcome.
      *   *Relevance:* This is technically true but often overblown in intro courses. SP is usually taught as a confounding/selection bias issue.
      *   *Advice:* Don't try to demo this. It requires large N and logistic regression. Acknowledge it as an advanced statistical artifact ("mathematical vs. causal paradox") but keep the class focused on the causal structure (DAGs).

  6.  **Addressing the "Manufactured vs. Discovered" Critique:**

      *   *Honesty:* Yes, I am forcing the reversal by forcing the incentives.
      *   *Pedagogical Value:* The point isn't discovery of SP in the wild; it's understanding *why* aggregation fails. The manufacturing makes the mechanism visible.
      *   *Reframing:* The lesson isn't "SP happens randomly." It's "SP happens when you ignore the process that generated the data."

  7.  **Fleshing out the Details:**

      *   *Cards:* Need two colors. Red = Win, Black = Loss.
      *   *Strong Deck (Novice):* 8 Red, 2 Black.
      *   *Strong Deck (Champ):* 4 Red, 6 Black.
      *   *Weak Deck (Novice):* 5 Red, 5 Black.
      *   *Weak Deck (Champ):* 1 Red, 9 Black.
      *   *Wait, logistics:* If I have 18 students, printing 4 decks per student is too much paper.
      *   *Better:* Print "Form Cards" (Identity). Have central "Opponent Decks".
      *   *Actually, best:* Give each student a "Gladiator Packet". Inside: Identity Card + 2 small decks (Novice Deck, Champion Deck). They choose which deck to draw from for their 10 matches.
      *   *Wait, simpler:* Just give them the Identity Card. The Instructor holds the "Opponent Decks". Student says "I fight a Champion." Instructor draws from Champion Deck appropriate for their Identity.
      *   *No, prompt says:* "Hand them a physical deck of 10 cards... shuffled and drawn."
      *   *Okay, I will stick to the prompt's mechanic.* Each student gets a packet.
      *   *Packet Contents:*
          1.  Identity Card (Strong/Weak) - *Secret*.
          2.  Novice Match Deck (10 cards, composition depends on Identity).
          3.  Champion Match Deck (10 cards, composition depends on Identity).
          4.  Score Sheet.
      *   *Wait, if they have both decks, they know their rates.*
      *   *Fix:* The Identity Card tells them their rates. "You are Strong: 80% vs Novice, 40% vs Champ." They *know* their stats. This is crucial for the rational choice argument.
      *   *Wait, if they know their stats, they know the paradox is possible.*
      *   *Refinement:* They know their *own* stats. They do *not* know the other group's stats. They don't know there *is* a Weak group until the end.
      *   *Actually, for the paradox to work, we need to aggregate Strong and Weak data.*
      *   *Setup:* 9 Students get Strong Packets. 9 Students get Weak Packets. They don't know who has what.
      *   *Decision:* They choose which deck to play (Novice or Champion).
      *   *Execution:* They draw all 10 cards from their chosen deck. Record Wins.
      *   *Aggregation:* Scouts collect data. "How many Strong fought Novices? How many Wins?" (Wait, students don't know they are Strong/Weak publicly yet).
      *   *Correction:* The "Type" (Strong/Weak) is the hidden confounder. The "Opponent" is the observed variable.
      *   *To show SP:* We need to compare Type A vs Type B.
      *   *So, at the end, we reveal Types.*
      *   *Okay, Plan:*
          1.  Distribute packets (9 Strong, 9 Weak).
          2.  Students choose Opponent Tier (Novice/Champ) based on EV (Points).
          3.  Play out the 10 cards.
          4.  Scouts collect: Name, Opponent Tier Chosen, Wins, Losses.
          5.  Instructor reveals Identity (Strong/Weak) for each student.
          6.  Build Table 1 (Pooled by Identity): Strong Win% vs Weak Win%. (Weak wins).
          7.  Build Table 2 (Disaggregated by Opponent): Strong vs Weak within Novice, Strong vs Weak within Champ. (Strong wins both).
          8.  Argument.

  8.  **Refining the "Three Stories" Phase:**

      *   Story 1 (Selection): Gladiators chose (as played).
      *   Story 2 (Assignment): Matchmaker assigned tiers based on height (uncorrelated with skill). *Wait, if assigned randomly, SP disappears.*
      *   *Correction:* Story 2 needs to be "Assignment based on a covariate."
      *   *Let's stick to the prompt:* "Tier is picked by gladiator," "Tier is assigned by matchmaker after fitness check," "Tier is consequence of earlier rounds."
      *   *Key Insight:* The *numbers* stay the same. The *causal arrow* between Type and Tier changes.
      *   *Case 1 (Confounding):* Type -> Tier Choice. (As played). Aggregation is bad.
      *   *Case 2 (Collider/M-Bias? No, let's keep it simple):* Tier -> Type? No.
      *   *Let's use the standard SP causal structures:*
          1.  **Confounding:** Skill -> Opponent Choice. (Strong choose Hard). Aggregation biases Skill estimate.
          2.  **Mediation:** Skill -> Performance -> Opponent Tier (Promotion). (Strong get promoted to Champions). Aggregation is *okay* for total effect, bad for direct effect.
          3.  **Collider:** Opponent Tier <- Referee Bias -> Win. (Not quite).
      *   *Let's follow the prompt's specific request:*
          1.  **Choice:** (As played). Strong choose Champions.
          2.  **Assignment:** Matchmaker sees Skill, assigns Strong to Champions. (Same data, different mechanism).
          3.  **Consequence:** Strong win early, get promoted to Champions. (Same data, temporal mechanism).
      *   *The Point:* In all three, the table is identical. But the *advice* changes. In (1), control for tier. In (3), don't control for tier (it's a mediator).

  9.  **Addressing the "Non-Collapsibility" (Odds Ratio) Issue:**

      *   Be honest. It's a mathematical property of the OR, not necessarily a causal paradox.
      *   It confuses 200-level students.
      *   Advice: Mention it as a "Statistical Artifact" vs. "Causal Paradox" distinction in the debrief, but don't demo it.

  10. **Final Review of the Plan:**

      *   Does it fit 75 mins? Yes, if transitions are tight.
      *   Are materials clear? Yes, index cards.
      *   Is the math right? Yes, checked.
      *   Is the debrief robust? Yes, connects to DAGs.
      *   Troubleshooting included? Yes.

  11. **Writing the Response:**

      *   Tone: Professional, pedagogical, direct.
      *   Structure: Materials, Setup, Timeline, Script/Flow, Troubleshooting, Limitations.
      *   *Self-Correction on Materials:* Printing 18 packets of cards is tedious. I need to make sure the instructions for the teacher on how to prep are clear.
      *   *Self-Correction on Roles:* "Commissioner" should be a student to reduce instructor talk time. "Scouts" should be the ones writing on the board.
      *   *Self-Correction on Points:* Make sure the Point System is clear. 1 pt for Novice, 3 pts for Champ. This drives the Strong players to Champs.

  12. **Final Polish:** Check the prompt's specific request about "No lecture up front... name at the very end." Ensure the script respects this. Ensure the "Three Stories" phase is distinct.

  *(Self-Correction during drafting)*: Wait, if Strong players choose Champions, they get 40% win rate. Weak players choose Novices, they get 50% win rate.
  If we aggregate *everyone* into one "League Win Rate", it's just a mix.
  To show the paradox, we need to compare **Group Strong** vs **Group Weak**.
  So, the "Pooled" table is:
  Row 1: Strong Gladiators (All matches). Win Rate = 40%.
  Row 2: Weak Gladiators (All matches). Win Rate = 50%.
  *Conclusion:* Weak are better.
  The "Disaggregated" table is:
  Vs Novices: Strong (80%) vs Weak (50%). Strong better.
  Vs Champions: Strong (40%) vs Weak (10%). Strong better.
  *Conclusion:* Strong are better.
  *This works.*

  Okay, ready to write.
answer: |-
  Here is the full runnable design for your 75-minute session. It is built to be tactile, argumentative, and silent on theory until the final debrief.

  ### I. Preparation & Materials

  **Class Size:** 18 Students.
  **Room Setup:** Tables arranged for 9 pairs (or 18 individuals). Whiteboard divided into three sections: *The League Table*, *The Breakdown*, *The Stories*.

  **Printables (Index Cards):**
  You need two types of **Gladiator Packets**. Prepare 9 of Packet A and 9 of Packet B. Shuffle them before class so students don't know who has which.

  *   **Packet A (The "Strong" Gladiator):**
      *   **Identity Card:** "You are a **Veteran**. Your skill is high."
      *   **Stat Card:** "Vs. Novice: 80% Win Rate. Vs. Champion: 40% Win Rate."
      *   **Novice Deck:** 10 cards (8 Red/Win, 2 Black/Loss).
      *   **Champion Deck:** 10 cards (4 Red/Win, 6 Black/Loss).
      *   **Score Sheet:** Columns for *Opponent Tier*, *Wins*, *Losses*, *Points*.

  *   **Packet B (The "Weak" Gladiator):**
      *   **Identity Card:** "You are a **Rookie**. Your skill is low."
      *   **Stat Card:** "Vs. Novice: 50% Win Rate. Vs. Champion: 10% Win Rate."
      *   **Novice Deck:** 10 cards (5 Red/Win, 5 Black/Loss).
      *   **Champion Deck:** 10 cards (1 Red/Win, 9 Black/Loss).
      *   **Score Sheet:** Same as above.

  **Other Materials:**
  *   2 Envelopes labeled "League Office" (for collecting Score Sheets).
  *   Red and Black markers for the board.
  *   A physical "Championship Trophy" (optional, but helps stakes).

  ---

  ### II. Minute-by-Minute Timeline

  #### 0:00 – 0:10: Setup & Incentives (No Theory)
  *   **Action:** Hand out the shuffled Packets. Tell students not to show their Identity or Stat Cards to anyone.
  *   **Script:** "You are gladiators in a league. You have 10 matches this season. You have two choices for every match: fight a **Novice** or a **Champion**. You know your own win rates (look at your Stat Card). You do *not* know anyone else's."
  *   **Scoring Rule:** "Wins matter, but prestige matters more. A win vs. Novice = **1 Point**. A win vs. Champion = **3 Points**. At the end, we will crown a Champion based on **Win Percentage**, not Points. But you want to maximize Points to secure your contract."
  *   **Task:** "Decide your strategy. Will you farm Novices or hunt Champions? Draw all 10 cards from your chosen deck. Record your Wins, Losses, and Total Points."

  #### 0:10 – 0:35: The Game (Phase 1)
  *   **Action:** Students calculate Expected Value (EV) silently.
      *   *Strong EV:* Novice ($0.8 \times 1 = 0.8$) vs. Champion ($0.4 \times 3 = 1.2$). **Rational Choice: Champions.**
      *   *Weak EV:* Novice ($0.5 \times 1 = 0.5$) vs. Champion ($0.1 \times 3 = 0.3$). **Rational Choice: Novices.**
  *   **Observation:** Watch them realize the trade-off. The Strong students should gravitate toward Champions; the Weak toward Novices.
  *   **Data Collection:** Appoint two **Scouts** (students). They collect the Score Sheets. They do *not* know who is Strong/Weak yet.
  *   **Board Work:** Scouts tally the data on *The League Table* (Section 1 of board).
      *   They group students by **Identity** (which you reveal now: "All Veterans stand left, all Rookies stand right").
      *   **Table 1 (Pooled):**
          *   Veterans: Total Wins / Total Matches = **40%** (approx).
          *   Rookies: Total Wins / Total Matches = **50%** (approx).
  *   **Tension:** The Rookies have the higher Win Rate.

  #### 0:35 – 0:50: The Judgment (Phase 2)
  *   **Action:** Ask the class to crown the Champion based on the rules (Win Percentage).
  *   **Script:** "The rules say highest Win Rate wins. The Rookies have 50%. The Veterans have 40%. Do we give the trophy to the Rookies?"
  *   **Conflict:** This is where the argument happens.
      *   *Student A:* "Rules are rules. 50% beats 40%."
      *   *Student B:* "But the Veterans fought Champions! Look at the points!"
      *   *Student C:* "If a Veteran fought a Rookie, who wins? The Veteran."
  *   **The Reveal:** Ask the Scouts to break down the data by **Opponent Tier** on *The Breakdown* (Section 2 of board).
      *   **Vs. Novices:** Veterans (80%) > Rookies (50%).
      *   **Vs. Champions:** Veterans (40%) > Rookies (10%).
  *   **Script:** "In every single head-to-head comparison, the Veterans are better. But in the pooled table, the Rookies are better. Who is actually the better gladiator? And why did the first table lie?"
  *   **Constraint:** Do not use the words "Simpson's Paradox," "Confounding," or "Aggregation" yet. Let them struggle with the word "Better."

  #### 0:50 – 0:65: The Three Stories (Phase 3)
  *   **Action:** Erase the board explanations, keep the numbers. Tell them the numbers are fixed, but the *story* of how they got there changes.
  *   **Story 1 (Selection - What just happened):** "Gladiators chose their opponents based on points."
      *   *Question:* "If we want to measure Skill, do we trust the Pooled Table or the Breakdown?" (Class should say Breakdown).
  *   **Story 2 (Assignment):** "Imagine a Matchmaker assigned the tiers. She put Veterans against Champions because she knew they were strong, and Rookies against Novices to protect them. The Gladiators had no choice."
      *   *Question:* "Does this change which table tells us who is more skilled?" (Answer: No, still Breakdown. The bias is in the assignment, not the choice).
  *   **Story 3 (Consequence/Mediator):** "Imagine everyone started as Novices. If you won your first 5 matches, you were **promoted** to Champions. If you lost, you stayed with Novices."
      *   *Question:* "Now, does the Pooled Table lie? Or does the Breakdown lie?"
      *   *Trap:* In this story, Opponent Tier is a *result* of Skill. Controlling for it (Breakdown) blocks the path of how Skill leads to success. The Pooled Table might actually be the better measure of "Overall Value."
  *   **Goal:** Students realize the *numbers* don't tell them which table to use. The *story* does.

  #### 0:65 – 0:75: Debrief & Naming
  *   **Action:** Lecture mode.
  *   **Script:** "This is **Simpson's Paradox**. It is not a math error. It is a causal error."
  *   **Key Concepts:**
      1.  **Composition:** The groups (Veterans vs. Rookies) had different mixes of opponents.
      2.  **Confounding:** In Stories 1 & 2, 'Opponent Tier' confounds the relationship between 'Skill' and 'Win Rate'. You must disaggregate.
      3.  **Causal Structure:** In Story 3, 'Opponent Tier' is a mediator. Disaggregating creates bias.
      4.  **The Lesson:** "Statistics cannot tell you whether to aggregate. Only a causal model can."

  ---

  ### III. Troubleshooting: What Will Go Wrong

  **1. The "Rigged Deck" Accusation**
  *   **Risk:** When the Veterans see they went 4/10 and Rookies went 5/10, someone will claim the decks were weighted to force the paradox.
  *   **Fix:** **Transparency.** Before they draw, have them count the cards in their decks. "Verify your deck composition matches your Stat Card." This proves the rates are fixed properties, not random bad luck. The paradox comes from the *mix*, not the shuffle.

  **2. The "Points Don't Matter" Stubbornness**
  *   **Risk:** A student insists, "Win Rate is the only metric of fighting ability. Points are irrelevant. Rookies win."
  *   **Fix:** **The Duel Question.** Ask: "If I bet $100 on a fight between a random Veteran and a random Rookie, who do I bet on?" They will bet on the Veteran. Then ask: "So why did the League Table say the Rookie is better?" This forces them to admit the table is misleading for prediction, even if it's "accurate" for the record.

  **3. Time Creep in Phase 1**
  *   **Risk:** Students take too long calculating EV or drawing cards.
  *   **Fix:** **Pre-calculated EV.** If you see them stalling, write on the board: *Novice Win = 1pt, Champ Win = 3pts.* Ask: "Which choice gives more expected points?" If they still stall, tell them: "You have 2 minutes to choose, or the Matchmaker assigns you randomly."

  **4. The "Weak" Players Choosing Champions**
  *   **Risk:** A Weak player ignores the EV and picks Champions for glory. This ruins the data separation.
  *   **Fix:** **Incentivize Points.** Remind them: "Your grade/credit depends on maximizing Points, not Win Rate." (Even if it doesn't, the threat works). If a Weak player chooses Champions, their win rate will be ~10%. They become an outlier. The Scouts should note this, but the aggregate should still hold if most follow incentives.

  ---

  ### IV. Limitations & The "Non-Collapsibility" Caveat

  You asked about your epidemiologist friend's point on **Odds Ratios (OR) and Non-Collapsibility**.

  **The Truth:**
  Your friend is technically correct. In logistic regression, the Odds Ratio is **non-collapsible**. This means the marginal OR (pooled) can differ from the conditional OR (disaggregated) *even if there is no confounding whatsoever*, simply because of the mathematical properties of the odds ratio scale.

  **Can you demo this?**
  **No.** Not in 75 minutes with index cards.
  1.  It requires large sample sizes to stabilize the logistic estimates.
  2.  It requires explaining the difference between Risk Ratios (collapsible) and Odds Ratios (non-collapsible).
  3.  It distracts from the core lesson: **Causal Structure determines Aggregation.**

  **How to fold it in:**
  In the debrief (last 5 minutes), add this specific caveat:
  > "One advanced note: In some statistical models, like Odds Ratios, the numbers *always* shift when you add variables, even without confounding. That is a mathematical artifact called non-collapsibility. But Simpson's Paradox is different. It's not about the math scale; it's about the **data generation process**. Whether you should trust the pooled or split table depends on the arrows in your causal diagram, not the formula you use."

  **The "Manufactured" Critique:**
  You also asked about the cost of manufacturing the reversal via incentives.
  *   **The Loss:** Students might think SP is only about "rational choice" or "gaming the system." They might miss that SP happens in passive observational data (e.g., kidney stone treatments).
  *   **The Fix:** In the debrief, explicitly decouple the *mechanism* from the *phenomenon*.
      > "We used points to force the Veterans to choose hard opponents. In the real world, there are no points. There is just severity of illness, or socioeconomic status. The 'Points' were just a stand-in for 'Severity.' The lesson isn't that people game stats; it's that **severity confounds treatment**."

  ### V. Instructor Script Snippets (For the Critical Moments)

  **When revealing the Pooled Table:**
  > "Look at the board. By the league's own rules, the Rookies are superior fighters. Look at your neighbor. If you are a Veteran, do you accept this verdict?"

  **When revealing the Breakdown:**
  > "Now look at the breakdown. Against Novices, Veterans win more. Against Champions, Veterans win more. How can you be better at everything, but worse overall? Did the math break?"

  **During the Three Stories:**
  > "The numbers on this board are permanent. They will not change. But I am going to change reality. In Story 1, you chose your fate. In Story 3, your skill created your fate. Does the truth about who is 'better' change when I change the story? If yes, then statistics didn't give you the answer. The story did."

  **The Closing Line:**
  > "Simpson's Paradox is not a trick. It is a warning. It tells you that data without a model is just noise. Never ask 'What do the numbers say?' Ask 'What story do the numbers tell?'"
