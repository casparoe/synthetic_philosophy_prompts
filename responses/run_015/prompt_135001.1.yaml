answer: |-
  Your observation cuts to the heart of a longstanding debate in aesthetics and ontology. The differential treatment of forgeries versus misattributions reveals that our institutional practices do not operate on **Aesthetic Empiricism** (the idea that value resides solely in the perceptual experience of the object) but rather on a form of **Historical-Genetic Essentialism**.

  Here is a reconstruction of that implicit theory, an analysis of its requirements, its consistency with other media, and the consequences of abandoning it.

  ### 1. The Implicit Theory: Historical-Genetic Essentialism

  The museum and auction house practices you describe presuppose that an artwork's identity and value are not exhausted by its sensory properties. Instead, they depend essentially on the **causal history of its production**.

  Under this theory, a painting is not merely a configuration of pigments on canvas; it is a **trace of a specific human action** occurring at a specific time. The value derives from the *achievement* represented by that action.

  *   **The Misattribution ("Circle of Rembrandt"):** When a painting is downgraded from "By Rembrandt" to "Circle of Rembrandt," the causal history is corrected, not invalidated. The object remains a 17th-century artifact produced within Rembrandt's milieu, by a hand trained in his techniques, witnessing the same light and culture. The *narrative* of the art history remains intact; only the specific protagonist changes. The object is still a genuine document of its era.
  *   **The Forgery:** A forgery breaks the causal chain. It is a 20th-century object masquerading as a 17th-century one. Its genesis is not the artistic struggle of the Baroque era but a deceptive act of the modern era.

  **The "Corruption" Factor:**
  You asked if the "wrong" origin introduces a corruption that misattribution avoids. Under this theory, **yes**. The corruption is twofold:
  1.  **Epistemic:** The object lies about its own nature. It claims to be evidence of a past it did not witness.
  2.  **Moral/Intentional:** Forgery involves an intent to deceive. In Essentialist terms, the *intention* behind the brushstroke is part of the work's identity. A brushstroke made to *express* a vision (Rembrandt) is ontologically different from a brushstroke made to *mimic* a vision (Van Meegeren), even if they look identical.

  ### 2. Strict Requirements vs. Good Fits

  To hold this theory together, we must distinguish between what is foundational to the logic and what is merely a convenient byproduct.

  **What the Theory Strictly Requires:**
  *   **Genesis as Identity:** The theory requires that *who* made the object and *when* they made it are constitutive properties of the work, not accidental ones. If two physically indistinguishable paintings have different origins, they are different artworks with different values.
  *   **The Privilege of the "Genuine Trace":** It requires that physical contact between the artist and the medium carries a value that cannot be replicated by technical perfection alone.
  *   **The Distinction between Error and Deceit:** It requires a moral/epistemic distinction between a scholarly mistake (misattribution) and a fraudulent fabrication (forgery). The former preserves the historical context; the latter pollutes it.

  **What Merely Fits Well (But Is Not Required):**
  *   **Market Value:** While the theory explains why forgeries lose financial value, the theory itself is about *artistic* value, not price. A museum might keep a forgery in storage for study (preserving its historical value as a *fake*) even if it has zero market value.
  *   **Destruction:** The theory does not strictly require destroying forgeries. Many museums keep them as "teaching objects." Destruction is a pragmatic response to liability or storage costs, not a philosophical necessity.
  *   **Aesthetic Inferiority:** The theory does not require that forgeries *look* worse. A perfect forgery is still rejected. This proves the value is not perceptual.

  ### 3. Consistency with Music and Literature

  You asked why this causal chain matters less for music or literature, where copies are perfect substitutes. This is the distinction philosopher Nelson Goodman drew between **Autographic** and **Allographic** arts.

  *   **Painting (Autographic):** The work is identified with the specific physical object produced by the artist. The history of production is essential to its identity. There is no "score" for a painting that allows for a legitimate copy. Therefore, the Essentialist theory holds firmly here.
  *   **Music/Literature (Allographic):** The work is identified with a notation (score or text). Any performance or print that conforms to the notation is an instance of the work. The causal history of the *paper* or the *recording* matters less than the causal history of the *composition*.

  **However, the theory is actually more consistent than it appears:**
  If a scholar discovers that a newly found symphony attributed to Mozart was actually written by a modern composer, it is treated exactly like a forged painting. It is removed from the repertoire, labeled a fake, and loses its canonical status.
  *   **The Difference:** In literature, we rarely worry about forgery of the *text* because the text is public and stable. In painting, every object is unique, making it vulnerable to genesis-fraud.
  *   **The Nuance:** In music, we *do* care about the history of production regarding *performances*. A recording passed off as Glenn Gould that is actually a mimic is devalued, even if it sounds identical. We value the *document of the act*.

  So, the theory is consistent: **Where the medium is autographic (unique physical trace), genesis is paramount. Where the medium is allographic (notation-based), the genesis of the composition matters, but the genesis of the copy does not.**

  ### 4. The Alternative: Purely Perceptual/Experiential Value

  If we replaced Historical-Genetic Essentialism with **Aesthetic Empiricism** (the view that value resides solely in the visual experience provided to the viewer), museum and auction practices would undergo a radical transformation.

  **What Would Change:**

  1.  **The Rehabilitation of Forgeries:**
      *   Forgeries that are visually compelling would be returned to the walls. A Van Meegeren that successfully moves the viewer would be displayed alongside Vermeers.
      *   Labels would change from "Follower of..." or "Fake" to purely descriptive terms: "Untitled, 17th Century Style." The lie would be noted in a plaque, but the object would not be exiled.
      *   **Destruction would become vandalism.** Destroying a beautiful object because of a lie about its birth would be seen as irrational, akin to burning a beautiful chair because you were lied to about who built it.

  2.  **The End of the "Masterpiece" Hierarchy:**
      *   Attribution drives the canon. If Rembrandt's hand doesn't matter, then a painting by his best student that looks *better* than a late Rembrandt sketch should be valued higher. The "Circle of" works would often supersede the "By" works based on visual quality alone.
      *   Art history would shift from **Biography** (the story of geniuses) to **Phenomenology** (the story of visual effects).

  3.  **Auction House Transparency:**
      *   Auctions would sell based on "Visual Appeal" grades rather than "Provenance." A painting with a shaky history but stunning visuals would fetch more than a dull painting with a perfect pedigree.
      *   The concept of "fraud" would narrow. It would only be fraud if the *visual qualities* were misrepresented (e.g., hiding damage), not if the *authorship* was misrepresented.

  4.  **The Loss of the "Aura":**
      *   Walter Benjamin argued that mechanical reproduction destroys the "aura" of the artwork (its presence in time and space). An Empiricist approach would complete this destruction. The "aura" of standing before the *actual* touch of Rembrandt would vanish. We would be admiring the image, not the relic.

  ### Conclusion

  The institutional pattern you identified reveals that we are not truly looking at paintings; we are looking at **histories**. We treat art as a form of testimony. A misattributed painting is a witness who got their name wrong but was actually there. A forgery is an imposter who wasn't there at all.

  To treat them the same would require us to admit that art is merely decoration—that the human struggle, the specific moment in time, and the authenticity of the gesture are irrelevant to the experience. Our refusal to do so shows that we value art not just for what it *does* to our eyes, but for what it *says* about us, our history, and our capacity for genuine creation. We preserve the misattribution because it is still a true document of a time; we reject the forgery because it is a lie about time itself.
