prompt: |-
  I write historical fiction, and I'm two books into a trilogy set in a made-up river-valley settlement I call Hallow Reach, somewhere in the late third millenium BC by the old dating (I've decided not to put a date in the text at all, which has already saved me a lot of grief). I did a big pile of reading before book one, and then someone in my writing group whose partner directs a dig said something that I can't shake: every time I let an object do something in a scene, I've already made an inference about what the people in that scene believed or what rules they were living under, and I ought to be able to say which of those inferences an archaeologist would actually sign off on and which ones are just mine. It's become a genuine problem now that I'm drafting the author's note, because I keep typing things like the people of the Reach held that... and then deleting the whole sentence.

  So what I want is a procedure, not a lecture, and not a reading list (I have no library access for most of the year and I'm not going to chase down papers). Something I can run in half an hour, over and over, every time I catch myself about to put a belief or an institution into the story on the strength of objects alone: the questions in the order I should ask them, what counts as a good enough answer to each, the step where I stop and write some version of we don't know and I invented this, and the step where the question stops being about evidence and becomes a decision about what kind of book I'm writing. I'd like it grounded in whatever archaeology and the philosophy of inference actually say about getting from stuff in the ground to minds — the business of how a pattern in the debris is supposed to connect to a behaviour and then to a belief, what has to be true of an object before it can carry a meaning at all, why the gap keeps reopening — but in plain words I can use, and honest about which steps are really just taste wearing a lab coat. Constraints: I have one undergraduate course and a lot of enthusiasm, I can email the dig director roughly once with three questions so I should know which three to spend, I can't do any fieldwork, and the findings I already printed in book one are fixed and can't be retconned. Also, she used some phrase I half remember, middle-range something or other, that apparently names exactly the move I keep making badly; if that's a real thing, tell me what it is and what it would have me do differently.

  Three cases to run it on, please. (1) The find I keep coming back to: around forty small fired-clay cones, found only in the thresholds of the bigger houses, always in pairs, points facing inward, and in three cases snapped on purpose before being set in the clay. I want a doorway belief — something at the threshold that keeps something out. Does the procedure let me have it, given that my first reader's suggestion was that they're just door sockets or loom weights? (2) What I've been privately calling the counting stones: about two hundred pebbles in a bag under a floor, in eleven distinct size grades, plus a flat stone with rows of matching pits cut into it. I want a grain levy and a person whose job it is to keep the tally, that is, an office and not just a habit — can the procedure get me from objects to an institution, or only to a practice, and what would I have to have found to get the office? (3) The one I already know you're going to spoil for me: my favourite scene in book two is a public judgement, the whole settlement watching while an accused person's hands are tied and they're put into the river, and everyone reading what happens as the river's answer. My evidence is a burial face-down in the channel silts with the wrists bound, and a second one with bound wrists and the hands removed. I have a horrible feeling the procedure lets me keep the burials and takes away the belief, and I'd rather be told that plainly than have it hedged. For each case say what the strongest sentence I can honestly put on the page is. And please flag the cases the procedure can't settle at all — the one where two different belief attributions fit the objects equally well, the one where everything that rotted would have carried the meaning and what survived didn't, and the one where a people three hundred miles away and four centuries later left written curses that sound a bit like what I want — plus tell me what the procedure simply cannot do, no matter how well I run it, so I stop asking it for that.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **User:** Historical fiction writer, 2 books into a trilogy. Setting: "Hallow Reach" (fictional river-valley settlement), late 3rd Millennium BC (approx. 3000-2000 BC).
      *   **Problem:** A critique from a writing group (partnered with a dig director) about inferring beliefs/rules from objects. The writer is struggling to write an Author's Note because they can't distinguish between archaeological inference and invention.
      *   **Goal:** A *procedure* (not a lecture, not a reading list) to run in ~30 minutes whenever they infer belief from objects. Needs to be grounded in archaeological theory (specifically "middle-range theory") but in plain English. Needs to identify where evidence stops and invention begins.
      *   **Constraints:** One undergrad course, no library access, can email the dig director *once* with *three* questions. Book 1 findings are fixed (no retcons).
      *   **Specific Terminology:** The user remembers "middle-range something." This refers to *Middle-Range Theory* (MRT) in archaeology (Lewis Binford).
      *   **Three Test Cases:**
          1.  *Clay Cones:* 40 cones, thresholds of big houses, pairs, points inward, some snapped. Writer wants "doorway belief/warding." Critic suggests "door sockets/loom weights."
          2.  *Counting Stones:* 200 pebbles (11 sizes) + pit board. Writer wants "grain levy/office." Question: Can objects prove an *institution* or just a *practice*?
          3.  *River Judgement:* Public trial by ordeal. Evidence: Face-down burial in silts (bound wrists), another bound + hands removed. Writer fears the procedure kills the belief but keeps the burial.
      *   **Output Requirements:**
          *   The Procedure (step-by-step).
          *   Explanation of "Middle-Range Theory."
          *   Application of the procedure to the 3 cases.
          *   Identification of "Strongest Honest Sentence" for each case.
          *   Flagging of unsolvable cases (equifinality, organic loss, distant analogy).
          *   Statement of what the procedure *cannot* do.

  2.  **Deconstruct "Middle-Range Theory" (MRT):**

      *   *What is it?* It's the bridge between static archaeological data (what we find in the ground) and dynamic human behavior (what people did/thought).
      *   *The Problem:* Objects don't speak. A broken pot could be ritual breaking or accidental dropping.
      *   *The Solution:* Use ethnography, experimental archaeology, or taphonomy to create "if-then" statements. *If* people do X, *then* we expect to find Y.
      *   *Relevance to User:* The user is making "transformative inferences" (Object -> Belief) without establishing the link. MRT demands a warrant for that link.

  3.  **Develop the Procedure (The "30-Minute Audit"):**

      *   Needs to be actionable.
      *   Needs to separate *Observation* from *Inference* from *Invention*.
      *   Needs a "Stop Point" where the writer admits "I don't know."
      *   *Step 1: The Static Fact.* What is physically there? (No adjectives implying intent).
      *   *Step 2: The Functional Alternative.* What else could this object do? (The "Loom Weight" test).
      *   *Step 3: The Pattern.* Is it repeated? Is it unique? (Context is king).
      *   *Step 4: The Ethnographic Bridge.* Do we see this elsewhere? (Analogy).
      *   *Step 5: The Gap.* Where does the physical evidence stop and the mental state begin?
      *   *Step 6: The Fiction Decision.* If the evidence is weak, own it as invention in the note, or soften the text.

  4.  **Drafting the Procedure Steps (Iterative refinement):**

      *   *Refinement:* Make sure it addresses the "Belief vs. Rule" distinction.
      *   *Refinement:* Incorporate the "Three Questions for the Dig Director" constraint.
      *   *Refinement:* Ensure the "Stop and Write 'We Don't Know'" step is clear.

  5.  **Applying the Procedure to the Three Cases:**

      *   **Case 1: Clay Cones.**
          *   *Facts:* Fired clay, cones, thresholds, pairs, points inward, some snapped.
          *   *Alternatives:* Door sockets (wear?), Loom weights (context wrong?), Game pieces?
          *   *Pattern:* Only big houses. Thresholds. Snapped *before* setting (key detail).
          *   *Verdict:* Functional use (socket) is unlikely if snapped. Loom weights unlikely in threshold. Ritual is plausible.
          *   *Honest Sentence:* Needs to reflect the *action* (placing snapped cones) without necessarily confirming the *theology* (warding).
          *   *Flag:* Equifinality (could be foundation deposit vs. warding).

      *   **Case 2: Counting Stones.**
          *   *Facts:* 200 pebbles, 11 sizes, pit board.
          *   *Inference:* Tallying.
          *   *Institution vs. Practice:* Objects show *counting*. They do not show *who* counted, *why* (tax vs. trade), or *authority*.
          *   *Verdict:* Can support "practice." "Office/Levy" is invention unless there's a seal, a uniform, or a specific building type associated.
          *   *Honest Sentence:* Focus on the act of accounting, not the bureaucracy.

      *   **Case 3: River Judgement.**
          *   *Facts:* Bound body in silt (face down). Bound body + hands removed.
          *   *Inference:* Trial by ordeal / River judgement.
          *   *Alternative:* Execution, sacrifice, disposal of criminals, burial custom.
          *   *Verdict:* High risk. "River's answer" implies the river decided. The bodies imply *people* decided.
          *   *Honest Sentence:* Very hard. Can describe the burial, cannot describe the public spectacle or the belief in the river's agency without strong analogy.
          *   *Flag:* Organic loss (the ropes, the crowd, the spoken words are gone). Distant analogy (written curses later).

  6.  **Addressing the Constraints & "Three Questions":**

      *   The user can email the dig director once. What are the best questions?
      *   1. Taphonomy/Context (Are there wear patterns?).
      *   2. Comparative (Is this unique to Hallow Reach or regional?).
      *   3. Ethnographic/Analogy (What's the closest known parallel?).

  7.  **Addressing "What the Procedure Cannot Do":**

      *   It cannot prove belief.
      *   It cannot recover sound/speech/smell.
      *   It cannot distinguish between "sacred" and "habitual" without textual support or extreme contextual precision.
      *   It cannot stop the writer from inventing, only help them label it.

  8.  **Review and Refine:**

      *   *Tone:* Professional, respectful of the craft, grounded in archaeological reality but supportive of fiction.
      *   *Clarity:* Avoid jargon where possible, explain MRT simply.
      *   *Check:* Did I answer the specific prompt about the "Strongest Sentence"? Yes.
      *   *Check:* Did I explain "Middle-Range Theory"? Yes.
      *   *Check:* Did I flag the unsolvable aspects? Yes.

  9.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* Make sure I don't tell them to change Book 1. The prompt says findings are fixed. The procedure is for drafting the Author's Note and future scenes.
      *   *Correction:* Ensure the distinction between "Inference" (archaeology) and "Invention" (fiction) is sharp.
      *   *Emphasis:* The "Middle-Range" concept is crucial. I need to explain that it's about *linking* statics to dynamics.

  10. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  Here is the procedure you asked for, grounded in the archaeological concept your contact mentioned, followed by the audit of your three cases.

  ### The Concept: Middle-Range Theory
  The phrase your contact used is **Middle-Range Theory (MRT)**. In archaeology (specifically associated with Lewis Binford), this is the logical bridge between **Static Data** (what we find in the ground: broken pots, postholes, bones) and **Dynamic Behavior** (what people actually did: cooking, building, sacrificing).

  The problem MRT solves is this: A broken pot in a pit could be ritual destruction, accidental drop, or garbage disposal. The object is the same; the behavior is different. MRT demands you establish a *warrant* for moving from the object to the behavior. It forces you to ask: *"What natural or cultural processes could create this pattern, and can I rule the others out?"*

  In fiction, you are allowed to cross the bridge. But for your Author's Note, you need to know where the bridge ends and the suspension cable begins.

  ### The Procedure: The 30-Minute Inference Audit
  Run this every time you write a sentence attributing a belief, rule, or institution to an object.

  **Step 1: The Static Description (5 Minutes)**
  Write down what the object *is* without verbs of intent.
  *   *Bad:* "Ritual cones placed to guard the door."
  *   *Good:* "Forty fired-clay cones. Found in pairs. Located in door thresholds of large structures. Points oriented interior. Three specimens fractured prior to deposition."
  *   *Test:* If you removed the people, would the object still look like this? If yes, proceed. If no (e.g., "worshiped cone"), rewrite.

  **Step 2: The Functional Alternative (5 Minutes)**
  List three mundane uses for the object that leave the same trace.
  *   *Examples:* Door socket, loom weight, game piece, packing material, child's toy.
  *   *Test:* Can you physically rule these out based on location, wear patterns, or association? If you cannot rule out at least one mundane use, you are in the zone of Inference, not Fact.

  **Step 3: The Pattern Check (5 Minutes)**
  Does the object appear in a pattern that requires coordination?
  *   *Single find:* Habit or loss.
  *   *Repeated find (same context):* Rule or Custom.
  *   *Repeated find (same context + variation):* Belief or Status.
  *   *Test:* To claim an *Institution* (an office, a levy), you need evidence of hierarchy (seals, distinct architecture, standardized weights), not just repetition.

  **Step 4: The Ethnographic Bridge (5 Minutes)**
  Is there a known analogy in time or space?
  *   *Strong:* Same region, same century.
  *   *Weak:* Same region, 1000 years later.
  *   *Weaker:* Different region, same century.
  *   *Weakest:* Universal human intuition ("people always fear thresholds").
  *   *Test:* If your strongest analogy is >300 miles or >200 years away, mark this as **Speculative Analogy**.

  **Step 5: The Gap Statement (5 Minutes)**
  Write the sentence: *"The objects show [Behavior], but they do not show [Belief]."*
  *   *Example:* "The objects show counting, but they do not show taxation."
  *   *Decision:* This is where you stop for the Author's Note. This is the line between Archaeology and Fiction.

  **Step 6: The Fiction Decision (5 Minutes)**
  Decide how to frame it in the text/note.
  *   *Option A (Hard):* "Excavations suggest..." (Only if Steps 2 & 4 are strong).
  *   *Option B (Soft):* "The people of the Reach may have..." (If Step 2 has alternatives).
  *   *Option C (Honest):* "I have interpreted these as..." (If Step 5 reveals a large gap).

  ***

  ### The Three Questions for the Dig Director
  You have one email. Do not ask for reading lists. Ask for data that solves Step 2 (Functional Alternatives).

  1.  **Micro-wear:** "Do the clay cones or counting stones show polish or stress fractures consistent with mechanical use (grinding, rubbing, bearing weight), or are they pristine?"
  2.  **Contextual Association:** "Are the bound burials associated with any grave goods that suggest status (jewelry, tools) or are they 'clean' (only ropes/bonds)?"
  3.  **Regional Parallel:** "Is there a single contemporary site within 100 miles that has produced textual or iconographic evidence linking these specific object types to ritual or administration?"

  ***

  ### Case Audits

  #### Case 1: The Clay Cones
  *   **Static Fact:** Fired clay, pairs, thresholds, points inward, pre-deposition breakage.
  *   **Functional Alternatives:** Door sockets (unlikely if snapped), Loom weights (wrong context), Foundation deposits (strong parallel).
  *   **Pattern:** Exclusive to "big houses." This implies status or specific function, not universal habit.
  *   **The Gap:** The *breakage* is the key. You do not snap a door socket before installing it. You *do* snap a ritual object to "kill" it or release power.
  *   **Verdict:** MRT supports **Ritual Action**. It does not support **Specific Theology** (warding vs. inviting).
  *   **Flag:** **Equifinality.** A foundation deposit (honoring the house) looks the same as a warding deposit (protecting the house). The objects cannot tell you the *direction* of the spiritual traffic.
  *   **Strongest Honest Sentence:** "The placement of deliberately fractured cones in the thresholds of larger dwellings suggests a ritualized attention to boundaries, though whether these were intended to invite protection or exclude harm remains open to interpretation."
  *   **Fiction Decision:** You can keep the warding in the story, but in the note, classify it as **Inference based on breakage pattern.**

  #### Case 2: The Counting Stones
  *   **Static Fact:** 200 pebbles, 11 sizes, pit board.
  *   **Functional Alternatives:** Game board (very strong), Trade tally (strong), Tax levy (weak without seals).
  *   **Pattern:** Standardized sizes imply a system.
  *   **The Gap:** Objects show *counting*. They do not show *obligation*. A merchant counts profit; a taxman counts levy. The stones are identical in both cases. To prove an **Office**, you need a seal, a stamp, or a specific building type (archive) that excludes domestic use.
  *   **Verdict:** MRT supports **Practice** (accounting). It fails to support **Institution** (levy/office).
  *   **Flag:** **Organic Loss.** The "receipts" (grain, cloth, paper, wood) rotted. The stones survived because they are stone. The meaning was in what was counted, not the counters.
  *   **Strongest Honest Sentence:** "The standardized pebbles and pit-board indicate a sophisticated system of accounting or record-keeping; the interpretation of this system as a central levy is a narrative reconstruction based on the settlement's scale."
  *   **Fiction Decision:** In the text, you can have the character *be* a taxman. In the note, admit the *office* is an invention required to make the plot work, grounded in the *practice* of counting.

  #### Case 3: The River Judgement
  *   **Static Fact:** Bound wrists, face-down in silt. Second body: bound + hands removed.
  *   **Functional Alternatives:** Execution of criminals (very strong), Sacrifice (strong), Disposal of enemies (strong), Trial by Ordeal (weak).
  *   **Pattern:** Violence and restraint are clear. "Public judgement" is not.
  *   **The Gap:** A trial implies a *process* before the death. The burial only shows the *result*. The "River's Answer" implies the river decided (drowning = guilty, floating = innocent). The bodies are at the bottom. They both drowned. The objects cannot tell you if the drowning was the *method* of execution or the *verdict* of the god.
  *   **Verdict:** MRT supports **Violent Death with Restraint**. It does not support **Judicial Process** or **Divine Agency**.
  *   **Flag:** **Distant Analogy.** You mentioned written curses 300 miles away/400 years later. In archaeology, this is considered **Noise**. It is not evidence. It is inspiration.
  *   **Strongest Honest Sentence:** "The interment of bound individuals in the channel silts indicates the river was used for the disposal of the executed or the sacrificed; the depiction of a public ordeal is a dramatization of this funerary practice."
  *   **Fiction Decision:** This is the hardest one. You must admit in the note that the *scene* is fiction, even if the *bodies* are real. Do not claim the trial happened. Claim the *fear* of the river happened.

  ***

  ### What This Procedure Cannot Do
  You need to stop asking the procedure for these three things, because it will never give them to you:

  1.  **It cannot distinguish Sacred from Habitual.** If people wash their hands before eating, and also wash them before praying, the water basin looks the same. Unless there is an inscription ("For the God") or a unique context (buried in a temple vs. buried in a kitchen), you cannot prove belief. You can only prove repetition.
  2.  **It cannot recover the "Soft" Context.** Ropes rot. Crowds leave no bones. Voices leave no trace. Any scene relying on a crowd's reaction, the tension of a rope, or a spoken oath is, by definition, **Invention**. The procedure can validate the *anchor* (the bound body), but not the *ship* (the trial).
  3.  **It cannot validate "Universal" Human Psychology.** You cannot argue "All humans fear thresholds, therefore these cones are for warding." Archaeology rejects universals. You need local parallels. If you don't have them, it's not archaeology; it's storytelling.

  ### Summary for your Author's Note
  When you sit to write the note, use the **Gap Statement** from Step 5.

  *   *Don't write:* "The people of the Reach believed..."
  *   *Do write:* "The presence of [Object] suggests [Practice]. I have interpreted this as [Belief] to serve the narrative, though archaeologically, [Alternative] is equally possible."

  This satisfies the dig director (you acknowledge the uncertainty), satisfies the reader (you give them the world they want), and satisfies you (you know exactly where the ground ends and the air begins).
