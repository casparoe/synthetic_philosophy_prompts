              *   However, Point 3 suggests the *reason* Point 4 holds is that "no trace" means "doesn't make the outcome worse at all."
              *   If "no trace" means "doesn't make the outcome worse at all" (Point 3), then $N \times \text{Speck}$ (where each is no trace) should equal 0 badness.
              *   But Point 1 says $N \times \text{Speck}$ is *very* bad (worse than torture).
              *   *Contradiction Found:* Point 3 undermines Point 1. If a speck leaves no trace, it has zero disutility (according to Point 3). If it has zero disutility, adding them up ($0 \times N$) still equals zero. Therefore, they can never outweigh torture.
      *   *Point 1 vs. Point 5:*
