answer: |-
  In a competitive municipal planning office, senior analysts Elena and Marcus independently falsify identical zoning compliance metrics in their respective project bids to secure career-advancing contracts. Both acts stem from the same calculated intent to deceive oversight committees for undeserved professional advantage, and both rely on the hope that the discrepancy remains unnoticed. Due to a minor, unforeseeable server glitch during a routine backup, Elena's altered file becomes corrupted and triggers an automatic integrity flag during an external audit, leading to immediate termination, public disgrace, and a subsequent psychological collapse that ends her career. Marcus, however, experiences no such technical failure; his deception remains undetected, he secures the contract, publishes successfully, and enjoys a decade of professional acclaim and personal stability without ever facing institutional scrutiny or external consequence for the initial act.

  The divergence in verdicts arises because the two theories locate the site of moral accounting differently. The modern retributivist focuses on the **decoupling of intention from external consequence**, arguing that justice requires a proportionate institutional response to culpability; since Elena's suffering vastly exceeds the proportional penalty for the falsification due to bad luck, her ruin is undeserved, while Marcus's success is merely a fortunate absence of punishment rather than a cosmic illegitimacy. Conversely, the reconstructed karma view relies on the **feedback-loop mechanism**, positing that the intentional quality of the act creates an internal moral debt that must resolve within the agent's psychological and relational life; therefore, Marcus's flourishing is unstable and undeserved because the debt remains unpaid and will inevitably fracture his character or relationships, whereas Elena's suffering, however severe, represents the necessary and appropriate internal resolution of the act's moral weight. When charged with merely describing moral luck, the defender of the reconstructed karma view responds that moral luck assumes outcomes are contingent and external, whereas this model asserts a law-like, non-contingent connection between intention and eventual psychological state; the "luck" of avoiding detection is superficial because the moral debt exists independently of external discovery, meaning Marcus's stability is not a matter of fortune but a temporary illusion preceding the inevitable internal collapse required by the theory's account of desert.
