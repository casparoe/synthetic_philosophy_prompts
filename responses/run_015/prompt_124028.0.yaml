answer: |-
  # The Equality Diagnostic: What Should Be Equal?

  **Instructions:** Read each scenario carefully. Choose the option that best matches your immediate judgment about what is *fair* or *right*. There are no trick questions. Do not worry about technical terms; just follow your intuition about the case.

  ---

  ### 1. The Adaptive Equipment
  Two students are given identical laptops for an exam. Student A has steady hands. Student B has a tremor (a medical condition they were born with). On the identical laptops, Student B types half as much and gets a lower grade.
  *   **A.** Give Student B a special voice-to-text computer so their *output* matches Student A's.
  *   **B.** Leave it. They were given the *same equipment*, which is all we can promise.
  *   **C.** Only act if Student B is upset or unhappy about the result.

  ### 2. The Expensive Taste
  Student C used their allowance to train their palate to love only expensive gourmet food. Now, on the standard school budget, they are miserable and hungry, while others are content with the cafeteria meals.
  *   **A.** Give Student C extra funds. Misery is what matters, and they are miserable.
  *   **B.** Do not give extra funds. They chose to cultivate that taste; it is their responsibility.
  *   **C.** Check if they are malnourished. If they are healthy, ignore their complaint.

  ### 3. The Contented Expectations
  In a particular school club, girls have been subtly taught for years that they are not good at leadership. They now rarely run for president. When asked, they say, "We don't want to lead, we are happy supporting."
  *   **A.** Their happiness is what counts. If they say they are content, the situation is fair.
  *   **B.** This is unfair. They have been denied the real *freedom* to lead, regardless of what they say now.
  *   **C.** Ensure they have the same voting rights and nomination forms as the boys. What they choose is up to them.

  ### 4. The Night Owl
  The school day starts at 8:00 AM. This suits most students. Student D is a "night owl" (a natural biological trait). They lose two hours of effective learning time every day because they cannot wake up early, despite trying.
  *   **A.** Provide recorded lectures or a later start slot. They lack the real *capability* to learn at the same level.
  *   **B.** Do nothing. The timetable is a rule that applies to everyone equally.
  *   **C.** Only help if their grades drop below a passing standard.

  ### 5. The Surplus Gap
  Every student in the school has enough money for books, food, and a decent social life. However, some students have allowances 100 times larger than others, allowing them luxury trips and cars.
  *   **A.** This is not a problem. Everyone has *enough*; the gap above the minimum does not matter.
  *   **B.** This is unfair. Such large gaps create unequal status and power, even if everyone is comfortable.
  *   **C.** It depends. It is only unfair if the rich students inherited the money rather than earning it.

  ### 6. The Leveling Down
  Imagine a scenario where the rich students have a surplus of luxury goods, and the poor students have a decent, comfortable life. The *only* way to make them equal is to destroy the rich students' surplus without giving anything to the poor students.
  *   **A.** Do it. Equality is valuable in itself, even if it helps no one.
  *   **B.** Do not do it. It is a waste that makes some worse off and no one better off.
  *   **C.** Do not do it. The poor students already have what they need; the focus should be on needs, not gaps.

  ### 7. The Happy Ignoramus
  Student E spends all day playing video games and scrolling social media. They report being perfectly happy and have no desire to learn anything new. However, they are failing to develop any skills or knowledge.
  *   **A.** They are doing fine. Happiness is the goal of life, and they have it.
  *   **B.** They are disadvantaged. A good life requires objective things like knowledge and health, not just feeling happy.
  *   **C.** It depends on what they *would* want if they were fully informed. If they'd choose knowledge, they are disadvantaged.

  ### 8. The Gambling Loss
  Student F receives the same allowance as everyone else but gambles it all away in a week. They are now unable to buy lunch.
  *   **A.** Help them out. Everyone should end up with the same amount, regardless of choices.
  *   **B.** Do not help. They took a risk (option luck) and lost; they must bear the cost.
  *   **C.** Help them only enough to buy lunch. We must ensure no one falls below a decent minimum, but we don't need to restore their full allowance.

  ---
  *(End of Student Handout)*

  ***

  # Teacher's Guide & Scoring Key

  ## 1. How to Score
  Have students tally their answers (e.g., 5 As, 2 Bs, 1 C). However, **do not** simply count the letters. The meaning of "A" changes from question to question. Instead, use the **Decision Matrix** below to identify their dominant principle.

  ### The Decision Matrix

  | Question | **Option A** signals... | **Option B** signals... | **Option C** signals... |
  | :--- | :--- | :--- | :--- |
  | **1 (Disability)** | **Capabilities / Luck Egal.** (Compensate brute luck to equalize function) | **Strict Resource** (Equal means, ignore outcomes) | **Welfare** (Focus on happiness/subjective state) |
  | **2 (Tastes)** | **Welfare** (Compensate misery regardless of cause) | **Resources / Luck Egal.** (Responsibility for choices) | **Sufficientarian** (Focus on basic needs only) |
  | **3 (Preferences)** | **Subjective Welfare** (Contentment = Fairness) | **Capabilities / Obj. Welfare** (Freedom/Objective good > Contentment) | **Primary Goods / Resources** (Equal rights/opportunity) |
  | **4 (Night Owl)** | **Capabilities** (Real freedom to achieve) | **Primary Goods** (Formal equality of rules) | **Sufficientarian** (Threshold focus) |
  | **5 (Surplus)** | **Sufficientarian** (Inequality above threshold irrelevant) | **Strict Egal. / Capabilities** (Inequality inherently bad) | **Luck Egalitarian** (Focus on source of inequality) |
  | **6 (Leveling)** | **Strict Telic Egal.** (Equality is intrinsically good) | **Resource / Luck / Cap.** (Equality is instrumental) | **Sufficientarian** (Needs met, equality irrelevant) |
  | **7 (Ignoramus)** | **Subjective Welfare** (Hedonia/Feeling) | **Objective Welfare** (Objective List) | **Desire Welfare** (Informed Preference) |
  | **8 (Gambling)** | **Strict Equality** (Outcome equality always) | **Luck Egalitarian** (Option luck is your own) | **Sufficientarian** (Safety net only) |

  ## 2. Identifying the Views (The 8 Leaves)
  Match the student's pattern of answers to the profiles below.

  **1. Equality of Welfare (Subjective/Hedonic)**
  *   **Key Answers:** Q1-C, Q2-A, Q3-A, Q7-A.
  *   **Logic:** They prioritize happiness/mental state above all. If the disabled girl is happy (Q1), do nothing. If the gourmet student is sad (Q2), pay them.
  *   **Diagnostic:** If they chose **Q7-A**, they are committed to Subjective Welfare.

  **2. Equality of Welfare (Desire-Based)**
  *   **Key Answers:** Q7-C.
  *   **Logic:** Similar to Subjective, but cares about *informed* desires.
  *   **Overlap:** Hard to distinguish from Subjective Welfare without Q7. If they chose Q7-C but Q3-A, they are Desire Welfare.

  **3. Equality of Welfare (Objective List)**
  *   **Key Answers:** Q3-B, Q7-B.
  *   **Logic:** Happiness doesn't matter if you lack knowledge/health (Q7) or freedom (Q3).
  *   **Overlap:** Often aligns with Capabilities on Q3. Distinguish via Q4: Objective Welfare might not care about the *freedom* to learn (Q4), just that you *are* educated. Capabilities care about the freedom.

  **4. Equality of Resources (Dworkinian)**
  *   **Key Answers:** Q1-A, Q2-B, Q8-B.
  *   **Logic:** Compensate for handicaps (brute luck) but not expensive tastes or gambling (option luck).
  *   **Diagnostic:** The combination of **Q1-A** (Help disabled) and **Q2-B** (Don't help gourmet) is the signature of Resource Equality/Luck Egalitarianism.

  **5. Luck Egalitarianism**
  *   **Key Answers:** Q2-B, Q5-C, Q8-B.
  *   **Logic:** Inequality is only bad if it comes from unchosen circumstances (brute luck).
  *   **Overlap:** Very similar to Resource Equality.
  *   **Distinction:** Look at **Q5**. A Resource egalitarian might object to the surplus gap generally (Status). A Luck Egalitarian objects *only* if the source was unfair luck (Q5-C).

  **6. Rawlsian Primary Goods**
  *   **Key Answers:** Q1-B or A (Ambiguous), Q3-C, Q4-B.
  *   **Logic:** Focus on all-purpose means (rights, income, liberties) rather than outcomes or capabilities.
  *   **Distinction:** Look at **Q4**. Primary Goods focuses on the *rule* being equal (Q4-B). Capabilities focuses on the *ability to learn* (Q4-A). Look at **Q3**: Primary Goods ensures equal nomination forms (Q3-C); Capabilities ensures they actually feel free to run (Q3-B).

  **7. Equality of Capabilities (Sen/Nussbaum)**
  *   **Key Answers:** Q1-A, Q3-B, Q4-A.
  *   **Logic:** Focus on "real freedom" to function. Rejects adaptive preferences (Q3) and focuses on ability to achieve, not just resources (Q4).
  *   **Diagnostic:** The combination of **Q3-B** (Reject contentment) and **Q4-A** (Accommodate biology) is the strongest signal.

  **8. Sufficientarianism**
  *   **Key Answers:** Q2-C, Q4-C, Q5-A, Q6-C, Q8-C.
  *   **Logic:** Justice is about getting everyone over a threshold. Inequality above the line doesn't matter.
  *   **Diagnostic:** If they chose **Q5-A** (Surplus gap is fine) and **Q8-C** (Help only to minimum), they are Sufficientarians.

  ## 3. Overlaps and Limitations
  *   **Resources vs. Luck Egalitarianism:** These views often give identical answers (Q1-A, Q2-B, Q8-B). The questionnaire cannot fully separate them.
      *   *Further Question Needed:* Ask about natural talents. "If someone is born with a genius-level IQ that earns them more money, should we tax that away?" Luck Egalitarians say yes (unchosen brute luck). Resource Egalitarians might say no (it's part of their personal endowment).
  *   **Capabilities vs. Objective Welfare:** Both reject the "Happy Ignoramus" (Q7-B) and "Contented Girls" (Q3-B).
      *   *Further Question Needed:* Ask about conversion factors. "If a student has a bike (resource) but no roads to ride on, are they equal?" Capabilities say no (no freedom to ride). Objective Welfare might say yes (they have the good 'health' from owning the bike).
  *   **Primary Goods vs. Resources:** In a school context, these are nearly identical.
      *   *Further Question Needed:* Ask about social respect. "Is 'social bases of self-respect' a good to be distributed?" Rawls says yes; Dworkin focuses more on material/insurance models.

  ## 4. Empty or Incoherent Combinations
  If a student produces one of the following answer sets, their view is likely inconsistent or unoccupied by major theories.

  **Combination 1: The "Responsibility Reversal"**
  *   **Answers:** Q2-A (Compensate Expensive Tastes) AND Q8-B (Don't Compensate Gambling).
  *   **Why Empty:** Incoherent. Both cases involve "Option Luck" (choices). If you compensate for cultivated tastes (Q2), you are a Welfare theorist and should compensate for gambling misery (Q8). If you hold them responsible for gambling (Q8), you should hold them responsible for tastes (Q2).
  *   **Verdict:** **Incoherent.** Violates the principle of consistency regarding choice.

  **Combination 2: The "Threshold Egalitarian"**
  *   **Answers:** Q5-A (Inequality above threshold is Fine) AND Q6-A (Support Leveling Down).
  *   **Why Empty:** Contradictory. If you support Leveling Down (Q6-A), you believe equality is intrinsically valuable even when everyone has enough. If you believe inequality above the threshold is fine (Q5-A), you cannot support Leveling Down.
  *   **Verdict:** **Incoherent.** Logical contradiction.

  **Combination 3: The "Paternalist Libertarian"**
  *   **Answers:** Q3-A (Contented Girls are Fine) AND Q4-A (Accommodate Night Owl).
  *   **Why Empty:** Unoccupied/Unattractive. Q3-A implies we should respect subjective preferences even if shaped by oppression. Q4-A implies we should override structural rules to accommodate biological needs. Doing both suggests respecting preferences only when they align with biological determinism, but ignoring them when they align with social conditioning. While logically possible, no major theory combines subjective welfare acceptance (Q3) with capability expansion (Q4).
  *   **Verdict:** **Unoccupied.** Theoretically unstable.

  ## 5. Feedback Script for Students
  *"You scored mostly as a [View]. This is because in Question [X], you prioritized [Principle] over [Principle]. For example, you chose to [Action] in the Disability case, which shows you care about [Outcome/Means]. However, in the Expensive Taste case, you [Action], which shows you limit that care when [Choice] is involved."*
