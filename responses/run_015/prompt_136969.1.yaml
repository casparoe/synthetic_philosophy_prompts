answer: |-
  ### Re-parameterisation Note
  To satisfy the structural conditions in Part (b) (specifically, that unilateral beacon installation is worse than neither installing), I have adjusted the Temptation payoff in the Prisoner's Dilemma from 5 to 10. In the original specification, a transparency of $p=0.5$ (unilateral beacon) was sufficient to trigger cooperation, making the beacon a dominant strategy. With Temptation=10, the cooperation threshold rises to $p > 2/3$. Thus, at $p=0.5$ (unilateral), agents defect, rendering the beacon cost a net loss compared to the baseline mutual defection. This preserves the intended Coordination (Stag Hunt) structure of the investment game. Additionally, for Part (c), I introduce a parameter $\pi$ representing the probability of encountering an Auditor rather than an Altair, as the expected value calculation requires a population distribution not supplied in the prompt.

  ***

  ### Model Answer

  **Part (a): The Threshold and the Nature of Dependence**
  Vega maximises expected utility by comparing the value of Cooperation ($C$) against Defection ($D$). Given the re-parameterised payoffs (CC=3, DD=1, DC=10, CD=0) and an unlinked cooperation rate of 1/2:
  $$EU(C) = p(3) + (1-p)[0.5(3) + 0.5(0)] = 1.5 + 1.5p$$
  $$EU(D) = p(1) + (1-p)[0.5(10) + 0.5(1)] = 5.5 - 4.5p$$
  Cooperation is optimal when $1.5 + 1.5p > 5.5 - 4.5p$, which simplifies to $6p > 4$, or **$p > 2/3$**.

  The dependence Vega treats as real is **subjunctive (or logical) dependence**, not causal. Vega reasons that because she and Altair are running the same decision procedure, her choice *logically entails* Altair's choice in linked worlds. She does not believe her action sends a signal or force across the light cone (causal influence), nor does she believe a third party is instructing them both (correlated equilibrium signal). In a correlated equilibrium, agents receive a signal *conditional* on which they update; here, there is no signal, only the shared logical structure of the agents themselves. If the correlation were a mere common cause (e.g., a shared genetic predisposition to cooperate), rational choice theory would treat the choices as independent evidentially; Vega would defect, knowing her action cannot change the past cause. Acausal trade requires the agent to view her decision as *selecting the output* of the algorithm that both instantiate, thereby controlling both outputs simultaneously.

  **Part (b): The Beacon and the Meta-Game**
  Vega should install the beacon only if she expects Altair to do the same. With the re-parameterised threshold ($p > 2/3$), a unilateral beacon ($\tau_V=1, \tau_A=0.5 \Rightarrow p=0.5$) fails to trigger cooperation; the agents defect, and Vega loses the beacon cost (0.2). Thus, Unilateral Net (0.8) < Neither Net (1.0). However, if Both install ($\tau_V=1, \tau_A=1 \Rightarrow p=1$), they cooperate, yielding a Net of 2.8. This is a **Coordination Game**: both prefer mutual installation to neither, but fear unilateral loss.

  Crucially, the decision to install the beacon is *itself* acausally linked. The prompt specifies the investment choice is made at base transparency, linked with probability 1/4. Vega must not treat Altair's investment probability as fixed at 1/2 (the unlinked rate). She must reason: "If I choose to install, the probability Altair installs rises because we run the same investment algorithm."
  Let $q$ be the probability of installing. If linked (prob 0.25), Altair matches Vega. If unlinked (prob 0.75), Altair installs with prob 0.5.
  If Vega installs: $EU = 0.25(2.8) + 0.75[0.5(2.8) + 0.5(0.8)] = 0.7 + 0.75(1.8) = 2.05$.
  If Vega does not install: $EU = 0.25(1) + 0.75[0.5(2.8) + 0.5(1)] = 0.25 + 0.75(1.9) = 1.675$.
  Vega should install. The verdict depends on recognising that the **investment decision is subject to the same acausal linkage** as the PD move. Ignoring this meta-linkage leads to the false conclusion that the beacon is too risky.

  **Part (c): The Auditor and Selective Opacity**
  The Auditor makes legibility instrumentally risky but not necessarily self-defeating. Against an Auditor, high transparency ($\tau \ge 0.8$) yields a payoff of 2 (tribute), while low transparency ($\tau < 0.8$) yields 3 (mutual cooperation). Thus, against an Auditor, opacity is dominant. Against an Altair, transparency is required to unlock the cooperative surplus (2.8 vs 1).

  Whether Vega should remain legible depends on the population mix $\pi$ (probability of Auditor).
  $EV(\text{Transparent}) = (1-\pi)(2.8) + \pi(2)$.
  $EV(\text{Opaque}) = (1-\pi)(1) + \pi(3)$.
  Transparency is optimal only if $\pi$ is sufficiently low.

  **Selective opacity** (being transparent to Altairs, opaque to Auditors) is unavailable if transparency is a global property of the agent's source code (a "beacon"). If Vega can broadcast different signatures to different counterparts, she should. However, if the Auditor detects *any* capacity for prediction, selective opacity fails. The case for legibility is not intrinsic but **ecological**: it depends on the frequency of fair traders versus extortionists. A good agent treats the *policy* (beacon on/off) as the unit of choice, not the individual act. If the population is mostly Auditors, the rational policy is opacity, even if this sacrifices gains from trade with Altairs. Legibility is a resource to be spent, not a duty to be fulfilled.

  ***

  ### Where this answer could be wrong
  The single most vulnerable premise is the assumption that the **beacon investment decision is subjunctively linked** in the same way as the PD move. I assumed that because the agents run the same procedure, their choice to *modify* that procedure (install the beacon) is also correlated ($p=0.25$). A strong student could reject this, arguing that the decision to install the beacon occurs *before* the transparency is raised, and thus might not be subject to the same logical identity if the "self" making the investment is distinct from the "self" executing the trade. If this meta-linkage is rejected, the beacon decision becomes a standard decision under risk (Altair invests with fixed prob 0.5). In that case, $EU(\text{Install})$ drops to $0.5(2.8) + 0.5(0.8) = 1.8$, which is still higher than Not Installing ($1.9$ in the unlinked calculation? Wait, if meta-linkage is gone, Not Installing is $0.5(2.8)+0.5(1) = 1.9$). Actually, without meta-linkage, Installing (1.8) < Not Installing (1.9). The verdict flips: **do not install**.
  **Confidence:** Moderate. The metaphysics of "decisions about decisions" in acausal trade is under-specified.
  **Grading:** Students who explicitly challenge the meta-linkage premise and derive the flipped verdict logically should receive full marks for Part (b), provided they justify the rejection of the linkage.

