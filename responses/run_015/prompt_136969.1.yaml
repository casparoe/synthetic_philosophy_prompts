  ### Marking Scheme (Total 20 Marks)

  **1. Threshold Calculation & Dependence Nature (4 Marks)**
  *   **2 Marks:** Correctly derives $p > 2/3$ (or equivalent based on consistent re-parameterisation).
  *   **2 Marks:** Explicitly identifies dependence as logical/subjunctive (shared algorithm) and distinguishes it from causal influence.
  *   *Typical Error:* Treating $p$ as a causal lottery or claiming the agent "influences" the counterpart across space.

  **2. Causal vs. Common Cause Distinction (4 Marks)**
  *   **2 Marks:** Explains why a correlated equilibrium signal (public/private recommendation) is not present.
  *   **2 Marks:** Explains why a common cause (past determination) would lead to defection (evidential irrelevance), whereas acausal trade requires the decision to fix the output.
  *   *Typical Error:* Conflating "correlation" with "common cause" and concluding cooperation is irrational.

  **3. Beacon Coordination Structure (4 Marks)**
  *   **2 Marks:** Correctly identifies the payoff structure: Both > Neither > Unilateral (Stag Hunt/Coordination).
  *   **2 Marks:** Notes that unilateral transparency leads to defection (due to threshold) plus cost, making it strictly worse than baseline.
  *   *Typical Error:* Assuming unilateral transparency still triggers cooperation (ignoring the threshold shift).

  **4. Meta-Linkage in Investment (4 Marks)**
  *   **2 Marks:** Recognises the investment decision itself is acausally linked ($p=0.25$).
  *   **2 Marks:** Derives the correct EU for the beacon decision using the linked probability, not the independent 1/2 rate.
  *   *Typical Error:* Applying decision theory locally to the PD while treating the beacon choice as independent (ignoring meta-correlation).

  **5. Auditor, Legibility & Population (4 Marks)**
  *   **2 Marks:** Distinguishes predictability ( Auditor can see you) from compliance (Auditor exploits you).
  *   **2 Marks:** Correctly concludes the optimal policy depends on the population parameter $\pi$ and addresses the availability of selective opacity.
  *   *Typical Error:* Concluding legibility is always self-defeating or always required, ignoring the population mix.

  **Penalty Guidelines:**
  *   **Arithmetic Slips:** Max -1 mark per section.
  *   **Structural Errors:** -4 or -5 marks (e.g., treating acausal trade as causal signalling; failing to treat the policy as the unit of choice in Part c).
  *   **Citations:** No marks awarded or deducted for references; grading is based on derivation from the specification.
