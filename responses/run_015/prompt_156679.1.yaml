      *   **Philosophical Lineage:** This sounds very much like *Constructive Empiricism* (van Fraassen) or *Quinean Indeterminacy of Translation*, but arguably closer to *Ontic Structural Realism* (OSR) if the focus is on structure over objects. It also echoes Leibniz's *Principle of the Identity of Indiscernibles* (PII).

