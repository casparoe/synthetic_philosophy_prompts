answer: |-
  Good afternoon. Welcome to the first session of the Citizens' Review Panel. I am not going to tell you this is easy. I am not going to tell you it is perfect. I am here to tell you why we are here, and what this room can actually do.

  We need to start with the numbers. We called 620 names to be in this room. 510 of them said no, or they never answered the phone. You 110 are the ones who said yes. That means you are not a perfect mirror of this city. The report on your desks says so. You are older than the city average. You are more likely to own your homes. You are more likely to have a college degree. I know you know this. Two of you have already asked the clerk about it.

  I am not going to pretend otherwise. You do not represent the city's demographics. You represent the city's capacity to show up. You represent the slice of this population that has the time and the willingness to do the work. That is not everything. But it is something. In a busy world, attention is the scarcest resource we have. You have brought that resource into this room. That is your starting point.

  So why do you have a warrant to speak? It is not because you are experts. You will not become budget experts in fourteen months. The staff knows more about sewage lines than you ever will. It is not because you are better people than the officials sitting behind me. You are not. You have biases. You have blind spots. You have ambitions.

  Your authority comes from what you do not have. You do not have to run for re-election. You have a single term. It is non-renewable. When this term ends, you go home. You cannot campaign on what you do here. You cannot promise favors to get back in. This design makes some of your ambitions harmless. It frees you to say what you actually think. It allows you to look at a budget line and ask "why" without calculating how the answer helps you next year. That is not purity. It is structure.

  Some of you know this room from the other side. One of you has sat where I sit. Two of you sought to sit there and did not win. That history is real. But the rules here are blind. Whether you served three terms or lost a race last year, you have the same vote as the person who never voted before. You are here by the accident of the draw, not by the design of the ballot. That levels the floor. Your experience is useful, but your title is not. You are members of this panel, nothing more.

  To my colleagues on the Council, the department heads, and the union representatives: I know some of you believe a body nobody voted for has no business instructing a body everybody voted for. You were elected. They were drawn. But look at the rule. You can reject their recommendation. You always could. But now you must do it on the record. You must write down why.

  This changes the cost. It is easy to ignore a memo. It is hard to ignore a room full of neighbors who asked you to look twice. The rule does not stop you from saying no. It just makes you explain yourself. It forces you to look them in the eye. If you reject them, you own that decision. You cannot hide behind a procedure. You have to write a reason that the public can read. That is the leverage. It is not a veto. It is accountability.

  So what is this power? It is not a law. It is not a command. Think of it like this. The Council drives the car. You hold the map. You do not steer. But you can tell us when we are lost. You can tell us when we missed a turn. Your authority is attention. You force us to look where we might have looked away. You decide what matters enough to stop the car.

  We are not building democracy in its purest form. We are building a working tool. It will be messy. It will be slow. Sometimes you will be wrong. Sometimes we will ignore you. But you will make us listen. That is enough.

  Thank you. Let's begin.
