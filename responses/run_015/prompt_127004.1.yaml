prompt: |-
  hey, i need a short research proposal (around two pages) for a philosophy-of-science seminar i'm pitching to. the topic is structual realism, but it only became personally relevant last week when my roommate started complaining that quantum mechanics is just math with no real particles, and i realized i don't actually know if structural realism is even meant to apply outside physics.

  my half-baked idea: in physics we go structural because of pessamistic induction and underdetermination of entities — we keep the equations and drop the ontology of particles, fields, etc. but what about domains where the structures aren't mathematical laws but institutional patterns or statistical models in economics and sociology? specifically, i want to ask whether there's a hidden asymmetry: in physics we drop entities but keep structure, but in social science the entities (markets, social classes, bureaucracies) are already treated as constructs, while the structure is just correlation or regression. so does applying structural realism there actually reverse the move? do we end up keeping the entities and being anti-realist about the structural claims?

  the proposal should be organized exactly like this:

  1. The precise question (~200 words): state it clearly, and explain why it's not just apply structural realism to sociology
  2. The gap (~200 words): why the standard physics-focused literature doesn't settle this, and what goes wrong with a direct analogical extension
  3. The method (~250 words): compare one physics case with one social-science case (maybe quantum mechanics vs economic equilibrium models), map whether the underdetermination argument transfers, and say what i'd actually compare over the semester
  4. Success and failure (~150 words): what a positive result looks like, and what would make the project collapse
  5. Scope check (~100 words): honest assessment of whether this is too ambitious for one semester, and what i'd have to cut

  please don't include a bibliography, reading list, or citations — i'll fill that in myself. refer to positions and arguments generally. the proposal itself should sound formal, but you can keep my framing casual. also i might have a typo or two in this prompt, just roll with it.
