answer: |-
  1. The precise question
  Standard structural realism arises from the tension between theory change and scientific success. In physics, the strategy is to retain mathematical structure while abandoning specific ontological commitments to entities like electrons or fields. This project asks whether this strategy invertibly applies to the social sciences. Specifically, does structural realism function differently when the "entities" are institutional constructs rather than mind-independent particles? The question is not merely whether structural realism applies to sociology, but whether the metaphysical priority flips. In physics, we are realists about structure and anti-realists about entities. In social science, where entities like markets are acknowledged as constructed but stable, while structural laws are merely statistical correlations, do we become realists about the entities and anti-realists about the structure? This distinction moves beyond simple application to investigate a potential asymmetry in how realist commitments are distributed across scientific domains. Recent informal debates regarding quantum ontology highlight this tension, suggesting that the motivation for structural realism in physics may not translate uniformly to domains where the ontology is already treated as constructive.

  2. The gap
  The existing literature on structural realism is overwhelmingly focused on fundamental physics. Proponents argue that structural realism solves the pessimistic induction by showing that while theories change, the mathematical structure is preserved. However, this literature assumes a specific metaphysical landscape where structure is mathematical and entities are natural kinds. Direct analogical extension fails because the social sciences do not share this landscape. In economics or sociology, the "entities" (classes, bureaucracies) are often treated as valid constructs despite being human-made, whereas the "structure" (laws, equilibrium conditions) is frequently viewed as instrumental or contingent. Standard structural realism arguments rely on underdetermination of entities by structure. In social science, the structure is often underdetermined by the entities, or the structure is merely descriptive statistics. Therefore, the standard justification for structural realism does not settle whether the position holds when the ontological status of relata and relations is reversed. A new framework is needed to assess realist commitments where structure is weak and entities are robust constructs. Consequently, the physics-centric debate leaves this ontological inversion unaddressed.

  3. The method
  This project will employ a comparative case study method. The primary physics case will be quantum mechanics, specifically the debate over whether wave functions represent real fields or merely information. Here, structural realists argue we should commit to the Hilbert space structure while remaining agnostic about the particle ontology. The social science case will be neoclassical economic equilibrium models. In these models, agents and markets are well-defined conceptual entities, but the structural claims regarding equilibrium states are often empirically fragile or idealized. I will map the underdetermination argument across both cases. In physics, entities are underdetermined by the math. In economics, I will investigate whether the structural laws are underdetermined by the institutional entities. Over the semester, I will compare the epistemic access we have to relations versus relata in both domains. This involves analyzing whether the stability of social entities warrants realist commitment even when the structural laws connecting them fail to predict outcomes, contrasting this with the physics case where structures survive theory change despite entity elimination. I will specifically examine how "preservation" is defined in each field to ensure the comparison rests on equivalent criteria regarding theoretical success. The analysis will focus on whether the structure in economics is sufficiently robust to bear realist weight compared to physical laws. I will also assess if the entities in economics possess enough independence from the model to count as realist objects. This dual comparison allows for a rigorous test of whether the structural realist mantra regarding ontological commitment is domain-specific or universal.

  4. Success and failure
  A positive result would demonstrate a viable "inverse structural realism" for the social sciences, where realist commitment attaches to constructed entities rather than structural laws. This would clarify why social sciences progress differently than physics. Alternatively, success might show that the asymmetry is illusory and that structural realism simply cannot coherently apply to domains without fundamental mathematical laws. The project would collapse if the distinction between entity and structure proves untenable in social science contexts. If markets cannot be conceptualized separately from their transactional structures, or if quantum entities cannot be separated from their mathematical representation, the comparative framework fails. Additionally, if the underdetermination argument does not genuinely arise in economic modeling, the analogy breaks down, leaving no ground for the proposed asymmetry. Ultimately, failure means the asymmetry thesis cannot be sustained.

  5. Scope check
  This scope is ambitious for a single semester given the technical depth required for both quantum mechanics and economic modeling. To manage this, I will limit the physics discussion to standard interpretations without engaging in advanced formalism. Similarly, the economic case will focus on general equilibrium theory rather than specific econometric models. I will avoid a comprehensive history of structural realism, focusing instead on the core argument regarding entity-structure priority. This ensures the project remains a focused conceptual analysis rather than an exhaustive survey.
