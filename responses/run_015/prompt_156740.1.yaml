      *   *Correction on Hope:* Hope is often defined as desiring an outcome + believing it's possible. If the belief component is weak, is the hope "unfitting"? Philosophers like Martin or Pettigrove argue hope has different norms. I should mention that Hope might just break the "fittingness" model entirely, which saves the user's theory from biting too hard.
