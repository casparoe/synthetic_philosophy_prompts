prompt: |-
  hey so im in 11th grade and i run the review board for my schools ethics blog — people submit hot takes that mix science with morality and i have to approve or reject them in like five minutes. lately im seeing a ton of arguments that jump straight from "this is how brains/nature/tech works" to "therefore we should do X" and my philosophy teacher said thats the is-ought gap plus moores naturalistic falacy, but i dont have time to read the actual books. can you turn both of those ideas into a quick step-by-step checklist i can actually run on a submission? i need the questions in order, what counts as a pass or fail at each step, the exact point where the procedure stops and says "this is a values call not a fact," and honest flags for where the checklist will misfire or where i still have to use my own judgement. apply it to three real submissions: 1) "evolution made us tribal so we ought to prioritize our own group over outsiders," 2) "fMRI scans show altruism lights up reward centers so being selfless is the correct moral system," and 3) "predictive policing AI is 90% accurate so we should use it for sentencing." make sure one case is something where my gut wants to approve it but the procedure blocks it, and tell me what i should do then. also say what the procedure cant do at all, and write it casual like im actually asking, not like a textbook — and yes i know i spelled falacy wrong lol.
reasoning: |-
