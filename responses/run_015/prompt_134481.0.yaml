answer: |-
  Yo, first off—major respect for running the board. That's a lot of pressure for 11th grade. Your teacher is right about the names (Hume and Moore), but you don't need to read the books to spot the move they're talking about. Basically, people try to sneak a **value judgment** (what we *should* do) inside a **fact claim** (what *is* true).

  Here is your 5-minute "Fact-Value Glitch Detector." It combines the Is-Ought Gap and the Naturalistic Fallacy into one workflow.

  ### The 5-Minute Checklist

  **Step 1: Highlight the "Is" (The Facts)**
  *   **Action:** Underline every sentence that claims to be a scientific, biological, or statistical fact.
  *   **Pass:** The claim is verifiable (e.g., "Dopamine is released when...").
  *   **Fail:** The claim is actually a hidden opinion disguised as fact (e.g., "Nature intends for us to...").
  *   **Stop Point:** If you can't find a clear fact claim, reject it for being vague.

  **Step 2: Highlight the "Ought" (The Demand)**
  *   **Action:** Box the sentence that tells us what policy to adopt, how to behave, or what is "good."
  *   **Pass:** It clearly states a recommendation (e.g., "Therefore, we must ban X").
  *   **Fail:** It's ambiguous or doesn't make a claim.

  **Step 3: The Bridge Check (CRITICAL STEP)**
  *   **Action:** Look at the words connecting Step 1 and Step 2. Is there a sentence that explains *why* the fact makes the action moral?
  *   **The Test:** Ask: "Does this fact *automatically* force this conclusion?"
  *   **Pass:** They admit a value premise (e.g., "Because we value survival, and X helps survival, we ought to do X").
  *   **Fail:** They imply the fact *is* the value (e.g., "It is natural, therefore it is good").
  *   **🚨 THE STOP SIGN:** If they jump straight from **Is** to **Ought** without a bridge, **FLAG IT.** This is the exact point where the procedure says: *"This is a values call, not a fact."*

  **Step 4: The "Natural/Efficient = Good" Trap**
  *   **Action:** Check if their only reason for the "Ought" is that something is *natural*, *evolutionary*, or *efficient*.
  *   **Pass:** They argue why that natural/efficient thing aligns with human rights, justice, or well-being.
  *   **Fail:** They treat "natural" or "accurate" as a synonym for "moral."
  *   **Verdict:** If they fail this, it's a Naturalistic Fallacy. Reject or request rewrite.

  ---

  ### Running the Three Submissions

  Here's how you apply this right now.

  #### Submission 1: "Evolution made us tribal so we ought to prioritize our own group over outsiders."
  *   **Step 1 (Is):** "Evolution made us tribal." (Fact: Plausible evolutionary psych claim).
  *   **Step 2 (Ought):** "We ought to prioritize our own group." (Moral demand).
  *   **Step 3 (Bridge):** *Missing.* Does being tribal make it *right*? Cancer is natural; is it good?
  *   **Step 4 (Trap):** Yes. They are saying "Natural = Moral."
  *   **Verdict:** **REJECT.** This is the textbook Naturalistic Fallacy. Just because we *are* wired for something doesn't mean we *should* act on it (we're also wired for violence, but we ban murder).

  #### Submission 2: "fMRI scans show altruism lights up reward centers so being selfless is the correct moral system."
  *   **Step 1 (Is):** "Altruism lights up reward centers." (Fact: Neuroscience).
  *   **Step 2 (Ought):** "Being selfless is the correct moral system." (Moral truth claim).
  *   **Step 3 (Bridge):** *Missing.* Does brain chemistry determine truth? If psychopaths feel reward from violence, does that make violence "correct"?
  *   **Step 4 (Trap):** Yes. Equating "biological reward" with "moral correctness."
  *   **Verdict:** **REJECT.** This is the Is-Ought gap. Biology describes the engine; it doesn't tell you the destination.

  #### Submission 3: "Predictive policing AI is 90% accurate so we should use it for sentencing."
  *   **Step 1 (Is):** "AI is 90% accurate." (Fact: Statistical claim).
  *   **Step 2 (Ought):** "We should use it for sentencing." (Policy demand).
  *   **Step 3 (Bridge):** *Weak.* They assume accuracy = justice.
  *   **Step 4 (Trap):** Yes. Equating "efficiency/accuracy" with "moral rightness."
  *   **Verdict:** **FLAG FOR REVISION.** (See the "Gut Check" below).

  ---

  ### The "Gut vs. Procedure" Conflict

  **Here is the tricky part:** Your gut probably wants to **approve Submission 3 (AI)**.
  Why? Because 90% accuracy sounds *good*. It sounds safe. It sounds like progress. Your brain wants to agree with the conclusion because the fact (accuracy) feels beneficial.

  **But the Procedure Blocks It.**
  The checklist catches that **Accuracy $\neq$ Justice**.
  *   **The Glitch:** An AI could be 90% accurate at predicting recidivism but be 100% biased against a specific demographic. Or, "accuracy" might ignore the moral value of *mercy* or *rehabilitation*.
  *   **What you should do:** Do not reject it outright. That feels censorious. Instead, **send it back with a "Values Premise" Request.**
  *   **The Note to the Author:** *"Your stats are cool, but you jumped from 'it works' to 'it's right.' You need to add a sentence explaining why accuracy is the most important moral value in sentencing, more than fairness or bias. Right now you're treating efficiency as a moral virtue, and that's a gap."*

  This teaches them the philosophy without you playing the "bad guy" who kills the post.

  ---

  ### What This Checklist CAN'T Do (Honest Flags)

  1.  **It Can't Verify the Science:** If a student lies and says "Science proves X," the checklist assumes the "Is" is true. It only checks the *logic* connecting the Is to the Ought. You still need to fact-check the basics.
  2.  **It Can't Solve Hard Ethics:** Sometimes the bridge *is* there, but it's controversial. Example: "If we want to reduce suffering (Value), and X reduces suffering (Fact), we ought to do X." The checklist passes this, but people might disagree that "reducing suffering" is the only goal. The checklist doesn't catch hidden value disagreements.
  3.  **It Can't Detect Biased Facts:** If the "Fact" itself is loaded (e.g., "Illegal aliens flood the border"), the checklist might pass the logic, but the premise is political, not scientific. You still need to read for tone.

  ### Summary for your 5-minute window:
  1.  Find the Fact.
  2.  Find the Demand.
  3.  If they say "It is X, so we must do X" without explaining why X is *good*, **stop them.**
  4.  If they say "It is natural/efficient, so it is good," **stop them.**
  5.  If your gut says "Yes" but the checklist says "No," ask them to write the missing value sentence.

  You got this. Don't let them sneak the "should" in with the "is."
