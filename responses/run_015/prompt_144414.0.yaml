answer: |-
  **Module:** Work, Welfare and the Philosophy of the Good Life (Year 3)
  **Exam Duration:** 2 Hours
  **Question Weight:** 40 Marks (Suggested Time: 45 Minutes)

  **Question 1**

  In *Economic Possibilities for our Grandchildren*, Keynes distinguishes between absolute needs, which are satiable, and relative needs, which are insatiable because they satisfy the desire for superiority. Consider a proposed 'post-productivity' welfare contract: citizens receive a universal baseline income sufficient for absolute needs, but must log 20 hours weekly of 'social contribution' via a state app to qualify. Additionally, tax rebates are offered for verifiable cuts in luxury consumption.

  Critically evaluate whether Keynes would view this policy as realising his vision of liberated leisure or as merely disguising the old 'love of money' as civic virtue. In your answer, address whether the mechanism of monitoring and rebates successfully mitigates the insatiability of relative needs or exacerbates the psychological habit of work.

  ***

  **Model Answer**

  Keynes's prognosis for the good life rests on a psychological distinction rather than a purely economic one. He argues that once absolute needs—those felt regardless of the situation of our fellows—are met, we struggle with relative needs, which are insatiable because satisfying them merely elevates us above others, prompting further competition. To evaluate the proposed 'post-productivity' contract, one must ask whether it liberates humans from the economic problem or entrenches the purposive mindset Keynes hoped would fade.

  On the surface, the baseline income addresses Keynes's primary precondition: solving the economic problem. By securing absolute needs, the state theoretically frees citizens from the necessity of labour for survival. However, the requirement to log 20 hours of 'social contribution' via an app complicates this liberation. Keynes anticipated a 15-hour work week to keep us 'just busy enough' to avoid ennui, but he envisioned this as a transition towards the 'art of life', not a monitored obligation. The introduction of surveillance technology transforms leisure into accounted labour. For Keynes, the danger lies not in idleness, but in the inability to detach self-worth from economic utility. By mandating logging, the policy reinforces the habit of work as a moral virtue, potentially preventing the psychological shift Keynes deemed necessary for true leisure.

  Furthermore, the tax rebates for cutting luxury consumption attempt to engineer a solution to the insatiability of relative needs. Keynes was pessimistic here, suggesting that relative desires are deeply rooted in human nature. While rebates might disincentivise conspicuous consumption, they risk gamifying virtue. If citizens cut luxury spending to gain financial rebates or social credit via the app, they are not abandoning the love of money; they are merely arbitraging it. The 'love of money' as a possession, distinct from its enjoyment, remains the driving force. Keynes warned that valuing money as a means to status would persist long after necessity was abolished. This policy treats the symptom (consumption) rather than the cause (the desire for superiority), potentially creating a new hierarchy based on 'civic virtue' scores rather than wealth.

  Ultimately, Keynes would likely view this contract with skepticism. While it technically secures absolute needs, it fails to address the psychological transition required for the good life. The monitoring apparatus and financial incentives disguise the old economic rat race as civic duty. Instead of cultivating the art of life, the state institutionalises the purposive mindset. Keynes's optimism relied on technological progress solving production; his pessimism warned that human psychology would lag behind. This policy ignores that lag, attempting to legislate virtue while reinforcing the very mechanisms of measurement and comparison that fuel relative needs. Thus, it disguises the love of money as civic virtue, delaying rather than realising the era of liberated leisure.

  ***

  **Marking Scheme**

  **Total Marks:** 40

  **First Class (A Grade): 32–40 Marks**
  *   **Conceptual Precision:** Clearly distinguishes between absolute (satiable) and relative (insatiable) needs without conflating them. Explicitly links relative needs to the desire for superiority/status.
  *   **Critical Application:** Does not merely apply Keynes's theory but critiques the policy mechanisms. Specifically addresses the 'app monitoring' as a reinforcement of the purposive mindset (work habit) rather than liberation.
  *   **Psychological Nuance:** Captures Keynes's dual stance: optimism about technology solving production vs. pessimism about human psychology adapting to leisure. Identifies that rebates may gamify virtue rather than cure the 'love of money'.
  *   **Argumentation:** Coherent, structured argument that directly answers the prompt's dichotomy (liberated leisure vs. disguised love of money).

  ** Upper Second (B Grade): 24–31 Marks**
  *   **Solid Understanding:** Correctly identifies the absolute/relative needs distinction.
  *   **Good Application:** Applies the theory to the policy but may treat the 'app/monitoring' aspect superficially (e.g., mentioning it only as bureaucracy rather than a psychological barrier to leisure).
  *   **Minor Errors:** May slightly conflate the 'love of money' with general consumption, or fail to fully explore why relative needs are insatiable in this specific context.
  *   **Structure:** Clear essay structure but may lack the critical edge of an A-grade response regarding the psychological lag.

  **Lower Second (C Grade): 16–23 Marks**
  *   **Descriptive Focus:** Summarises Keynes's 15-hour prediction extensively without engaging deeply with the needs distinction.
  *   **Policy Ignorance:** Ignores specific elements of the prompt (e.g., fails to discuss the rebates or the monitoring app).
  *   **Misinterpretation:** May argue Keynes would support the policy simply because it reduces working hours, missing the nuance of *voluntary* vs. *mandated* leisure.

  **Fail (D/E Grade): 0–15 Marks**
  *   **Fundamental Errors:** Conflates absolute and relative needs entirely.
  *   **Irrelevance:** Discusses welfare generally without reference to Keynes's specific philosophical arguments.
  *   **Incomplete:** Fails to reach a conclusion on whether Keynes would support or reject the proposal.
