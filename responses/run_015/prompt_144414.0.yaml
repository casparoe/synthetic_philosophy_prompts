prompt: |-
  I'm drafting the final exam for my third-year module on work, welfare and the philosophy of the good life, and I want an essay question that forces students past the usual summary of Keynes's 15-hour prediction. The crux should be his distinction between absolute needs and relative needs — specifically whether relative needs are genuinely insatiable or just culturally inflated — and I want them to apply this to a niche policy idea I've cooked up: a 'post-productivity' welfare contract where citizens recieve a baseline income but must log 20 hours a week of 'social contribution' via an app, with rebates for cutting luxury consumption. The question should ask whether Keynes would see this as realising his vision of liberated leisure or as disguising teh old love of money as civic virtue. Please write the exam question itself, a model answer of roughly 500-600 words, and a marking scheme that clearly states what an A answer must do — for instance, correctly identifying where Keynes's optimism about technology meets his pessimism about human psychology — and what mistakes should drop a student to a B, like conflating absolute and relative needs or ignoring the monitoring aspect altogether. The exam is two hours, this question is 40 marks, and students should spend about 45 minutes on it. No requests for bibliographies or reading lists — I want reasoning, not citation theatre — and please keep it in British English as I'm marking in Manchester.
