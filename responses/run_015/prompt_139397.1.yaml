answer: |-
  **Gricean Misleading Decision Procedure**

  1.  **Literal Truth:** Is the explicit content false? Yes = Lying (Warning); No = Proceed to Implicature.
  2.  **Inference Path:** Can you reconstruct how words + context created the false belief? No = Not Misleading; Yes = Proceed.
  3.  **Cancellability:** Could the agent add "but X isn't guaranteed" without contradiction? No = Entailment (Warning); Yes = Implicature (Proceed).
  4.  **Reasonable Hearer:** Would a typical customer in this channel draw this inference? No = Not Misleading; Yes = Proceed.
  5.  **Human Agency:** Did a human select this message knowing the specific context? No = System Error (Policy); Yes = Proceed.
  6.  **Harm Severity:** Is the customer loss material (money/access) or emotional? Material = Warning; Emotional = Coaching.

  **Applications**

  (a) **Refund Queued:** Agent sends "Your refund has been processed" when queued in a nightly batch. Literal content is true (entered system), but customer takeaway is "money moving." Inference path is clear; cancellable ("processed but may fail"); reasonable inference; human sent it; harm is material. **Verdict: Written Warning.** This is uncomfortable: industry-standard engineering terminology is flagged as misleading because customer interpretation diverges from backend definitions, forcing a language change.

  (b) **Macro on Suspended:** Agent uses "We've received your message" macro on a suspended account. Literal "received" is true; implicature "will look" is false. Inference path clear; cancellable; reasonable. Human selected macro despite knowing suspension status. **Verdict: Coaching.** Uncomfortable because the agent followed macro protocol, but human selection triggers accountability despite systemic constraints forcing bad options.

  (c) **AI "I Understand":** AI-drafted reply ends "I completely understand your frustration." Literal content is false (AI has no feelings); implicates "human empathy." Inference path clear; not cancellable (AI cannot understand); reasonable inference; human sent it. **Verdict: Written Warning.** This is the hardest hit: it bans standard empathy macros, requiring a costly rewrite of all AI drafts to avoid personification, even if no material harm occurred.

  **Limitations & Fudges**

  This procedure cannot settle **Silence**. Step 2 requires an "utterance." Silence only counts if prior company behavior established it as confirmation (e.g., "no news is good news"). Otherwise, the procedure stops at Step 2. You must handle auto-close policies via Product, not Support Review, because silence lacks the cooperative intent required for Gricean analysis.

  **Macro/AI Intent:** Step 5 fudges Gricean "speaker meaning." A template or model has no intent. We assign intent to the *selector*. If the system auto-sends without human review, the procedure halts at Step 5 and hands off to Policy. This ignores the drafter's responsibility but keeps the review actionable for you.

  **Hearer Variability:** Step 4 uses a "reasonable customer" standard, not the actual one. We ignore second-language barriers or 2am skimming unless the channel is known for those constraints. This sacrifices individual fairness for consistency; you will occasionally penalize agents for vulnerabilities they couldn't detect, because indexing to every actual hearer makes the procedure unusable.

  **Dropped Distinctions:** I collapsed "Quality" and "Quantity" maxims into "Inference Path." I treated "Relation" as context. I removed the distinction between generalized and particularized implicature; both are treated as cancellable inferences. Finally, I treated "Warning" and "Coaching" as binary outcomes for material vs. emotional harm, ignoring tenure or prior history, which you must layer on manually. Lying (Step 1) and Misleading (Step 3) come apart at cancellability: lies cannot be cancelled without contradiction; misleading implicatures can. When literal content is true but takeaway is false, you proceed from Step 2 to Step 3 to determine if the inference was warranted.
