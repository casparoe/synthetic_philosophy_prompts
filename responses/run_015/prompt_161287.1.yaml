      *   *Critique:* Is the recommendation actionable?
      *   *Fix:* Add a specific deadline for the rewrite (e.g., 48 hours) and a specific authentication step to attempt in parallel.

  5.  **Final Polish:**
      *   Check against constraints: No Sanskrit. No seminar. Skimmable. Strongest version of rejected option included.
      *   Ensure the "friend's PhD" insight is integrated as *logic* not *citation*. (e.g., treating testimony as distinct from inference).
      *   Make sure the "Memory" aspect is touched on regarding the official who won't repeat on tape (memory is fallible/second-hand).

  6.  **Final Review against the Prompt:**
