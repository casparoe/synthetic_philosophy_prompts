  *(Self-Correction on the "Memory" point)*: The prompt mentions the official won't repeat it on tape. This is effectively hearsay/memory. In the memo, I should frame this as "contemporaneous record vs. recalled testimony."

  *(Self-Correction on the "Slide Deck")*: The prompt asks to classify it as perception, testimony, or something else. In modern terms, it's "Real Evidence" but functionally "Testimony" if we can't verify the creator. I will argue it functions as *Testimony* because we are trusting the unseen author.

  *(Self-Correction on "Handbook")*: Keep it practical. "Source Counting" vs. "Evidence Weighting."

