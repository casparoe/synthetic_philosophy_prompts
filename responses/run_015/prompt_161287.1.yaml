          *   Projection from 40-site pilot to national figure.
          *   Comparison to a 2010s case (analogy).
      *   **Current Conflict:** News desk wants to run tomorrow. Editor A wants to hold for authentication. Editor B wants to reframe as analysis. Reporter will read the memo.
      *   **The "Angle":** Use concepts from Classical Indian Epistemology (Nyāya) without using jargon/Sanskrit. Specifically:
          *   Testimony (*Śabda*) as distinct from inference.
          *   Inference (*Anumāna*) requires a reliable universal connection (*Vyāpti*).
          *   Second-order check on cognition (*Anuvyavasāya* - roughly).
          *   Memory issues (maybe less relevant here, but good to keep in mind regarding the official who won't repeat on tape).
      *   **Requirements:**
          *   Land on *one* recommendation (Run, Hold, or Reframe).
          *   Address specific epistemic points: Reliable testifier (anonymous/interested), Slide deck classification, Strength of linking generalization (industry pressure -> rule death), Historical parallel utility.
          *   Address handbook rewrite recommendation.
          *   Make it usable (no Sanskrit, no seminar, skimmable).
          *   Steelman the rejected option (anticipate News Desk pushback).
          *   Tone: Professional, persuasive, practical, intellectually rigorous but accessible.

  2.  **Determine the Recommendation:**
      *   *Option 1: Run as News.* Risky. The core claim ("shelved mainly because of internal cost estimate") rests on anonymous testimony and an unauthenticated document. If the document is fake or the sources are wrong, the magazine gets sued or loses credibility. The "on-record" source won't go on record.
      *   *Option 2: Hold for Authentication.* Safest for liability, but might kill the scoop. Can we authenticate the deck quickly? The prompt says "can't authenticate on its own."
      *   *Option 3: Reframe as Analysis.* This seems the most intellectually honest given the Nyāya-inspired critique. We don't *know* the internal cause definitively (Testimony is weak/interested). We have strong *inference* based on patterns (lobbying + cost estimate leak + historical precedent). Framing it as "Why this rule likely died" rather than "Agency killed rule because of this" protects the mag while publishing the reporting.
      *   *Decision:* **Reframe as Analysis.** It allows publication (satisfies News Desk partially) but mitigates risk (satisfies cautious Editor) and aligns with the actual strength of the evidence (which is inferential, not direct perception/testimony).

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format. To: Evidence Panel & Editors. From: [My Name]. Date: [Current]. Subject: Decision on [Story Name].
      *   **Executive Summary:** State the recommendation clearly upfront. (Reframe as Analysis).
      *   **The Core Problem:** Briefly state why the current "News" framing is shaky without bashing the reporter.
      *   **Applying the Epistemic Framework (The "Nyāya" bits translated):**
          *   *Testimony:* The anonymous sources. One is biased (contractor). One is cautious (official). In Nyāya, testimony requires a *reliable* person. A biased source reduces the weight. *Action:* Downgrade from "fact" to "allegation."
          *   *The Slide Deck:* Is it perception? No, it's a representation. It's testimony in document form. Since we can't verify the author, it's unverified testimony. Previous batches don't guarantee this one. *Action:* Treat as corroborative, not foundational.
          *   *Inference (The Generalization):* The claim relies on the rule: "If industry lobbies + cost estimate exists -> Rule dies." This is the *Vyāpti* equivalent. Is this universal? No. Sometimes rules survive. The 2010s case is one data point. *Action:* This supports analysis ("patterns suggest"), not news ("this happened").
          *   *Second-Order Check:* We need to ask, "Do we know that we know?" We don't. We have a strong hunch, not certainty.
      *   **Steelmanning the "Run as News" Argument:** Acknowledge the public interest, the urgency, and the fact that waiting might mean the story dies. Acknowledge that "two sources" is usually enough.
      *   **Why We Reject "Run as News":** The specific risk of the "internal cost estimate" being the *main* cause. That's a specific causal claim requiring higher proof.
