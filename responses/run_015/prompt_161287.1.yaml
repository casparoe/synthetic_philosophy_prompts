answer: |-
  **MEMORANDUM**

  **TO:** Evidence Panel, Senior Editors, News Desk
  **FROM:** [Your Name], Evidence Panel
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on [Story Title] – Causal Claims and Evidence Weighting

  **EXECUTIVE SUMMARY**

  **Recommendation:** Do not run as hard news tomorrow. **Reframe as Reported Analysis** with a 48-hour rewrite window.
  **Condition:** Attempt one targeted authentication step on the slide deck during the rewrite period. If authentication fails, the analysis framing becomes mandatory.

  **Reasoning:** The reporting is robust, but the causal claim ("shelved *mainly* because of an unpublished cost estimate") exceeds the current epistemic warrant. We have strong indicators of *correlation* and *motivation*, but the direct evidence for *causation* relies on testimony that cannot be independently verified. Reframing allows us to publish the scoop without staking the magazine's credibility on a specific internal mechanism we cannot prove.

  ---

  **1. THE EVIDENCE AUDIT**

  To resolve the deadlock between the News Desk and the cautious editors, we need to move beyond counting sources and assess the *type* of knowledge each piece of evidence provides. Our current handbook treats all confirmation as equal; this case shows why that fails.

  **A. Testimony (The Human Sources)**
  *The Issue:* We have one on-record official (who won't repeat the claim on tape) and two anonymous sources (one with financial conflict).
  *The Standard:* Testimony is only as strong as the witness's reliability and lack of bias.
  *   **The Official:** Because they will not repeat the statement on the record, this functions as recalled memory, not contemporaneous confirmation. Memory degrades and is susceptible to reconstruction. We cannot treat this as a primary pillar.
  *   **The Contractor:** This source has a direct financial grievance. In legal and evidentiary terms, this is "interested testimony." It is valuable for establishing *motive* (industry wanted the rule dead), but it cannot carry the weight of *fact* (the agency killed it *because* of the cost).
  *   **Verdict:** These sources support a narrative of pressure, but they do not securely support the specific claim of internal causality.

  **B. The Slide Deck (Documentary Evidence)**
  *The Issue:* Is this direct proof or someone else's claim?
  *The Classification:* Although it looks like "hard evidence," an unauthenticated slide deck is functionally **testimony in document form**. We are being asked to trust the unseen author's accuracy and honesty. The fact that previous batches from this channel were authentic establishes the *channel's* reliability, not this specific *file's* integrity.
  *   **Verdict:** It cannot stand alone. It must be treated as corroborative. If we run as news, the deck is the linchpin. If we cannot verify the author or the metadata by Thursday, it cannot support a definitive causal claim.

  **C. The Linking Generalization (Inference)**
  *The Issue:* The reporter asserts: *Industry Lobbying + Internal Cost Estimate = Rule Death.*
  *The Standard:* This is an inference. It requires a universal connection between the evidence and the conclusion.
  *   **The Flaw:** Agencies shelve rules for many reasons (legal hurdles, staffing, shifting priorities). The existence of lobbying and a cost estimate does not guarantee the lobbying caused the shelving via the estimate.
  *   **Verdict:** This generalization is strong enough for *analysis* ("All signs point to...") but too leaky for *news* ("This is why...").

  **D. The Historical Parallel (Analogy)**
  *The Issue:* The 2010s case where a similar rule died.
  *   **Verdict:** This is rhetorical garnish, not evidence. It establishes a *pattern of behavior*, which supports the Analysis framing. It does not prove what happened in *this* specific instance. Relying on it for the news claim commits the fallacy of assuming history must repeat itself.

  ---

  **2. STEELMANNING THE "RUN AS NEWS" ARGUMENT**

  The News Desk's position is not without merit, and we must acknowledge the strength of their objection before rejecting it.

  *   **Public Interest:** The safety rule affects the public. Delaying publication risks the story being scooped or the window for impact closing.
  *   **Standard Practice:** By traditional journalism standards, two corroborating sources (even if one is anonymous) often meet the bar for publication. The encrypted channel has a track record.
  *   **Chilling Effect:** Holding the story or downgrading it signals to sources that we cannot protect them or handle complex leaks, potentially drying up future pipelines.
  *   **The Risk of Hedging:** If we hedge too much, the agency can dismiss the story as speculation, achieving the same result as killing the rule.

  *Why we are overriding this:* The specific claim here is not just that the rule died, but *why*. Accusing an agency of bypassing procedure based on an unpublished document is a libel-adjacent risk. If the "cost estimate" turned out to be a preliminary draft or a decoy, "Reported Analysis" protects us; "News" exposes us. The cost of being wrong on a causal claim is higher than the cost of being slightly less definitive.

  ---

  **3. RECOMMENDED PATH: REPORTED ANALYSIS**

  We should instruct the reporter to shift the lede from **Discovery** ("Agency Shelved Rule Due to Secret Cost Estimate") to **Investigation** ("Why a Key Safety Rule Vanished: Internal Documents and Lobbying Point to Cost Concerns").

  *   **What changes:** Verbs shift from definitive ("killed," "shelved because") to inferential ("suggest," "indicate," "coincided with").
  *   **What stays:** All the reporting, the sources, and the document details remain. The public gets the information; the magazine retains plausible deniability on the unprovable internal motive.
  *   **Deadline:** Rewrite due by Wednesday 5:00 PM.
  *   **Authentication Step:** Tech team to attempt metadata handshake with the source channel by Wednesday Noon. If confirmed, we can tighten the language. If not, the Analysis framing holds.

  ---

  **4. HANDBOOK REVISION PROPOSAL**

  This dispute highlights a gap in our Fact-Checking Handbook. We currently rely on a "Source Count" model (e.g., "Need two sources for claim X"). This is crude. I propose we pilot a **"Weight of Evidence"** addendum for high-risk stories.

  **Proposed Framework:**
  1.  **Distinguish Testimony from Inference:** Explicitly flag when a claim relies on a "linking generalization" (A implies B) rather than direct observation. High-inference claims require higher source reliability.
  2.  **Reliability Scoring:** Instead of just "On/Off the Record," tag sources for *Interest*. (e.g., "Neutral Observer," "Interested Party," "Recalled Memory"). An "Interested Party" source cannot be the sole basis for a causal claim.
  3.  **The "Second-Order" Check:** For contentious claims, require a brief memo answering: *What is the most likely way this is wrong?* If the answer is "The document is fake" or "The source is lying," and we have no mitigation, we cannot run as hard news.

  **Implementation:** This does not need to slow down routine pieces. It applies only to "Panel Review" tier stories. A fact-checker can apply this in 15 minutes by filling out a risk matrix rather than just checking source boxes.

  ---

  **NEXT STEPS**

  1.  **Editor:** Notify the reporter of the "Analysis" framing decision by EOD today.
  2.  **Tech:** Attempt deck authentication by Wednesday Noon.
  3.  **Panel:** Review the "Weight of Evidence" proposal for next month's handbook update.

  This approach gets the story out, respects the reporting work, but aligns the certainty of the language with the certainty of the evidence.
