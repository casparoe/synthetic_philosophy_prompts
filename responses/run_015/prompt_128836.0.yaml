answer: |-
  ### Pedagogical Architecture: "The Fidelity Reversal"
  **Session Duration:** 50 Minutes
  **Objective:** To demonstrate that in constrained verse, formal preservation is the necessary condition for semantic fidelity, rendering literal translation a structural failure.

  ---

  ### 1. Dependency Sequence (The Explanatory Arc)
  To ensure the reversal feels like a discovery, you cannot begin with the conclusion ("Form is Meaning"). You must build a functional definition of "the poem" that makes the reversal inevitable.

  1.  **Define the Object (0–10 mins):** Establish that a poem is not a container for propositions but a *machine for producing an effect*.
      *   *Move:* Ask students to define what makes Marot's epigram "work." Is it the information conveyed, or the surprise/wit delivered at the rhyme?
      *   *Prerequisite:* Students must agree that if the wit/timing fails, the poem has failed, regardless of lexical accuracy.
  2.  **Demonstrate the Literal Collapse (10–20 mins):** Present the literal gloss.
      *   *Move:* Have the Linguists scan the meter and the Philosophers parse the propositions. Show that while the propositions are intact, the *machine* is broken (the joke doesn't land, the rhythm stumbles).
      *   *Prerequisite:* Recognition that the "meaning" (effect) is lost in the gloss.
  3.  **Demonstrate the Formal Rescue (20–30 mins):** Present the constraint-respecting version.
      *   *Move:* Show how this version sacrifices specific nouns/verbs to save the meter and rhyme, thereby restoring the wit/timing.
      *   *Prerequisite:* Acknowledgement that this version "feels" more like the original experience than the gloss does.
  4.  **The Reversal (30–40 mins):** Redefine Fidelity.
      *   *Move:* Argue that since the *effect* is the meaning, and only the formal version preserves the effect, the formal version is the "literal" one in the only sense that matters. The gloss is the fiction.

  ---

  ### 2. Evaluation of the Carrying Example
  **Proposal:** Tripartite comparison (Marot Original / Literal Gloss / Constraint-Respecting Version).

  **Verdict:** **Works, with a critical modification.**
  For this specific interdisciplinary group, a version that alters imagery *entirely* will fail.
  *   **Why:** The Philosophers will reject it as a different proposition; the Linguists will classify it as a different underlying structure; the Lit scholars will view it as adaptation, not translation.
  *   **Required Property:** The third version must preserve the **illocutionary force** (the joke, the insult, the compliment) even if the **locutionary details** (specific nouns/images) shift.
  *   **Recommendation:** Select a Marot epigram where the *punchline depends on the rhyme sound*.
      *   *Example Logic:* If the French rhyme pairs "love" with "dove," and the literal translation forces "love" to rhyme with "above" (changing the meter), the joke might die. The constraint-respecting version might change "dove" to "glove" to keep the meter and the rhyme tightness, preserving the *snap* of the ending even if the bird is lost.
      *   *Why this works:* It forces the Philosophers to admit the "truth" of the poem is in the snap, not the bird. It forces Linguists to see rhyme as syntactic weight, not decoration. It forces Lit scholars to see semantic drift as a tactical necessity.

  ---

  ### 3. Misconception Map & Interception Strategy

  | Student Profile | Anticipated Misconception | Interception Point | Pedagogical Move |
  | :--- | :--- | :--- | :--- |
  | **Linguists** | "Rhyme and meter are performance features layered over deep semantic structure." | **Before** the example (Phase 1). | **Reframe Constraint as Generator.** Do not ask "What does it say?" Ask "What does the constraint *force* the meaning to do?" Show that without the rhyme, the semantic ambiguity required for the wit disappears. |
  | **Philosophers** | "If the propositions differ (e.g., 'dove' vs. 'glove'), the identity of the work is not preserved." | **During** the comparison (Phase 3). | **Shift to Felicity Conditions.** When they ask about truth conditions, interrupt: "We are not judging truth, we are judging *success*." Ask: "In which version does the speaker successfully perform the act of wit?" |
  | **Comp Lit** | "Changing the imagery betrays the author's specific imaginative vision." | **After** the example (Phase 4). | **Reframe Betrayal.** Argue that the author's vision was *structural*. To keep the words but lose the structure is to preserve the corpse, not the life. Ask: "Would Marot prefer his words read badly, or his wit heard well?" |

  ---

  ### 4. Closing Exercise: "The Diagnostic Trade-Off"
  **Time:** 5 Minutes
  **Goal:** Distinguish structural understanding from relativism.

  **Setup:** Provide a new, single couplet (untranslated) with a strict rhyme constraint. Present two English versions:
  1.  **Version A:** Semantically precise, metrically broken (no rhyme).
  2.  **Version B:** Semantically shifted (metaphor changed), metrically perfect (rhyme preserved).

  **Task:** Do not ask "Which is better?" Ask: **"Which version preserves the *causal mechanism* of the original?"**

  **Success Criteria:**
  *   **Relativist Answer:** "Both are valid interpretations depending on what you value." (Reject this).
  *   **Structuralist Answer:** "Version B, because the original's effect is causally dependent on the rhyme closing the thought. Version A breaks the mechanism, so it cannot produce the original meaning."
  *   **Why this works:** It forces them to argue from *mechanism* (how the poem works) rather than *preference* (what they like), solidifying the session's core argument without slipping into "anything goes."

  ---

  ### 5. Explicit Omissions
  To maintain focus and prevent disciplinary friction, exclude the following:

  1.  **Computational Analogies:** Do not reference constraint-satisfaction problems, algorithmic generation, or "search space."
      *   *Reason:* This will trigger the Linguists to model the text as code and the Philosophers to question the analogy's validity, wasting time on formalism rather than textual mechanics.
  2.  **Biological/Organic Metaphors:** Do not use terms like "self-assembly," "organic unity," or "growth."
      *   *Reason:* This invites vague mysticism that Philosophers will reject and Linguists will find unscientific. Keep the language mechanical/functional (machine, architecture, mechanism).
  3.  **Broad Translation Theory:** Do not reference Benjamin's "Afterlife," Schleiermacher, or Venuti.
      *   *Reason:* This is a seminar on *Constraint*, not Hermeneutics. Bringing in high theory will allow the Comp Lit students to retreat into abstract defense of "loss," distracting from the specific structural argument of Hofstadter/Marot.
  4.  **Biographical Context:** Do not discuss Marot's life or Hofstadter's personal relationship to the text.
      *   *Reason:* Irrelevant to the structural claim. Fidelity to the *design* is the point, not fidelity to the *man*.
