answer: |-
  It is a pleasure to meet a colleague who understands that the water doesn't care about our models, only our measurements. You have identified the exact friction point where philosophy stops being abstract and starts costing money. The Duhem-Quine problem—that data never tests a single hypothesis in isolation but rather a whole bundle of assumptions—is not just a seminar room puzzle; it is the reason why good people disagree about river restoration.

  You asked for a tool, not a lecture. Below is the decision procedure you requested. I have drafted the procedure itself in American English for your wiki, as requested. The surrounding analysis and the test cases are in British English to match your own voice.

  ***

  ### The Decision Procedure

  **Purpose:** To evaluate funding proposals where evidence is incomplete.
  **Time Limit:** 25 minutes per proposal.
  **Users:** Evidence Panel (混合 expertise).

  **Step 1: Separate the 'What' from the 'Why'**
  *   **Question:** Does the proposal claim something is happening (effect), or does it claim it knows why it is happening (mechanism)?
  *   **Requirement:** The applicant must state these separately.
  *   **Stop Rule:** If the proposal treats a guess about the mechanism as a fact about the effect, return for clarification.
  *   **Output:** A clear statement of the observed pattern and a separate statement of the proposed cause.

  **Step 2: The Risk Test (Falsifiability)**
  *   **Question:** What specific result in this project would prove the claim wrong?
  *   **Requirement:** The applicant must name a data outcome that would make them abandon the story.
  *   **Stop Rule:** If the answer is "nothing" or "we would just adjust the model," reject the claim. This handles "chameleon claims" that fit any outcome.
  *   **Output:** Pass/Fail. If Fail, stop.

  **Step 3: The Rival Test (Underdetermination)**
  *   **Question:** List the top three alternative stories that fit the existing data just as well.
  *   **Requirement:** The panel must list at least two serious rivals. If the applicant cannot, the panel must supply them.
  *   **Judgement Call:** Ignore rivals that require contrived assumptions (e.g., "a secret pipe exists") unless there is specific reason to suspect them. Prefer rivals that rely on known processes (e.g., "upstream land use change" vs. "alien pollution").
  *   **Output:** A list of live rivals.

  **Step 4: The Discriminator Test**
  *   **Question:** Does the proposed work distinguish the main story from the rivals?
  *   **Requirement:** The new data must be impossible (or highly unlikely) under the rival stories but possible under the main story.
  *   **Stop Rule:** If the new data would look the same under all rivals, the work does not reduce uncertainty. Reject unless justified by Step 5.
  *   **Output:** Pass/Fail.

  **Step 5: The Action Test (Mechanism Insensitivity)**
  *   **Question:** If the mechanism claim is wrong, does the proposed action still work?
  *   **Requirement:** Assess whether the fix depends on the cause. (e.g., Fencing works whether the phosphate is from cows or badgers, but chemical dosing depends on the source).
  *   **Decision:**
      *   If **Yes** (Action works regardless): You may fund the action even if Step 4 fails. You are buying insurance, not truth.
      *   If **No** (Action depends on cause): You must pass Step 4 to fund.
  *   **Output:** Fund Action / Fund Knowledge / Reject.

  **Step 6: The Fragility Proxy (Unknown Unknowns)**
  *   **Question:** How many independent lines of evidence support the claim?
  *   **Requirement:** Count the distinct types of data (e.g., chemical + biological + physical vs. chemical only).
  *   **Judgement Call:** If the claim rests on a single chain of reasoning, treat the risk of "alternatives nobody thought of" as high. Require cheaper monitoring before large capital spend.
  *   **Output:** Risk Level (Low/Medium/High).

  **Step 7: The Values Hand-off**
  *   **Question:** If the evidence is equal between two options, or the risk is high but the need is urgent, who decides?
  *   **Requirement:** This is not an evidence question. The trustees must decide based on cost-benefit, precaution, or community preference.
  *   **Output:** A written rationale stating: "The evidence does not distinguish X from Y. We choose X because [Value Reason]."

  ***

  ### Commentary on the Procedure

  You asked me to be honest about what I have dropped and where the judgement calls are hiding. Here is the breakdown.

  **What I dropped:**
  I have stripped out the metaphysical debate about whether theories are actually "true." For your panel, truth is a horizon you walk towards; you never reach it. The procedure treats theories as tools. If a tool does the job (Step 5), it doesn't matter if it's the "true" explanation. This is instrumentalism. You lose the ability to claim moral superiority for the "correct" science, but you gain the ability to fund useful work when the science is messy.

  I have also dropped precise probability. You cannot calculate the likelihood of an unknown unknown. Instead, Step 6 uses "fragility" as a proxy. If a claim relies on one narrow strand of data, it is fragile. If it relies on three independent strands, it is robust. This is not mathematics, but it is a reliable heuristic.

  **Where the judgement calls are:**
  Step 3 is the dangerous one. Distinguishing a "serious rival" from a "contrived one" is subjective. You asked how to avoid smuggling in your prior. The answer is: you cannot eliminate your prior, but you can discipline it. The rule I wrote ("Prefer rivals that rely on known processes") forces you to use general hydrological knowledge rather than personal hunches. If a rival requires a new law of physics, discard it. If it requires a common land-use change, keep it. This is where your thirty years of experience is legitimate evidence, not just bias.

  **Handling your six hard cases:**

  1.  **Contrived Rivals:** Step 3 handles this. A story cooked up with enough epicycles becomes "contrived." The instruction to ignore rivals requiring specific, unsupported assumptions protects you from infinite regression.
  2.  **Same Action, Different Mechanism:** Step 5 handles this. If the action works regardless of the mechanism, the underdetermination is irrelevant to the spending decision. You fund the action, not the theory.
  3.  **Chameleon Claims:** Step 2 handles this. If they cannot say what data would change their mind, the claim is not scientific. It is a belief. Reject it.
  4.  **Unknown Alternatives:** Step 6 handles this. You cannot list the unthought-of. You can only assess how fragile your current thinking is. Multiple independent lines of evidence reduce the risk that a single unknown variable destroys the whole claim.
  5.  **"Not Yet" vs "Never":** The procedure treats these similarly in the short term. If you cannot tell now, you cannot fund a capital project based on the claim. You can only fund monitoring (Step 4). The distinction matters only for long-term strategy, not the 25-minute decision.
  6.  **Effect vs. Explanation:** Step 1 forces this separation. You can fund the monitoring of the effect (Step 4 Pass) without funding the causal claim (Step 4 Fail). This allows you to say "We know the trout are declining; we do not know why. We will fund counting, not fencing."

  ***

  ### Test Cases

  Here is the procedure applied to your three scenarios.

  **Case 1: Phosphate and Trout**
  *   **Step 1 (What/Why):** Effect: Trout declining, Phosphate high. Why: Farm run-off. *Pass.*
  *   **Step 2 (Risk):** What would change their mind? If phosphate drops but trout don't recover? They likely haven't pre-committed to this. *Fail/Weak.*
  *   **Step 3 (Rivals):** Counting skill improvement, upstream source, temperature change, natural cycle. *Pass (Rivals identified).*
  *   **Step 4 (Discriminator):** Does fencing distinguish farm run-off from upstream sources? No. The phosphate data already correlates, but doesn't source. *Fail.*
  *   **Step 5 (Action):** If it's not the farm, does fencing work? No, it wastes money. *Fail.*
  *   **Decision:** **Reject.** The evidence is thin on discrimination. You cannot spend £12,000 on a solution that relies on a causal claim they cannot distinguish from four others.
  *   **Rationale:** "The data shows correlation but does not distinguish farm run-off from other sources. Fencing depends on the farm being the cause. Monitoring funding may be considered, but restoration funding is not supported."

  **Case 2: Re-meander (BACI)**
  *   **Step 1 (What/Why):** Effect: Invertebrates up in restored reach. Why: Re-meandering improved habitat. *Pass.*
  *   **Step 2 (Risk):** What would change their mind? If control reach also improved? *Pass.*
  *   **Step 3 (Rivals):** Upstream land use change coinciding with work, seasonal anomaly, sampling bias. *Pass.*
  *   **Step 4 (Discriminator):** The BACI design handles seasonal anomaly. It does not handle upstream land use change. *Partial Pass.*
  *   **Step 5 (Action):** If the cause was upstream change, does the re-meander still work? Yes, the habitat is still better locally. *Pass.*
  *   **Step 6 (Fragility):** One biological metric, one physical change. Moderately fragile.
  *   **Cheapest Measurement:** Check land use records upstream for the two-year period. Cost: £0 (desktop study).
  *   **Decision:** **Fund.** The action is robust even if the causal attribution is slightly off (Step 5). The design is strong (Step 4).
  *   **Rationale:** "The BACI design robustly shows local improvement. While upstream factors cannot be fully ruled out, the physical restoration provides benefit regardless of external drivers. Low-cost check of upstream land use records recommended before final sign-off."
  *   *Note on Bias:* You advised them. Step 3 forces you to list rivals explicitly. If you list "upstream change" and check it cheaply, you neutralise the bias.

  **Case 3: Shade and Salmon**
  *   **Step 1 (What/Why):** Effect: Summer temps high (modelled). Why: Lack of shade. *Pass.*
  *   **Step 2 (Risk):** If temps don't drop after planting? *Pass.*
  *   **Step 3 (Rivals):** Groundwater influx, channel morphology, shading is in the wrong place. *Pass.*
  *   **Step 4 (Discriminator):** They have no water temp data. They cannot distinguish if shade is the limiting factor vs groundwater. *Fail.*
  *   **Step 5 (Action):** If shade isn't the main driver, does planting trees still work? It might not cool the water enough to save salmon. *Fail.*
  *   **Step 6 (Fragility):** Relies on regional model, no local data. High fragility.
  *   **Decision:** **Reject Capital, Fund Monitoring.** You cannot spend £12,000 on planting without knowing where the cold water refuges are. The physics is sound (shade cools), but the local application is underdetermined.
  *   **Rationale:** "While shade cooling is physically sound, local water temperature data is absent. We cannot confirm this stretch is the critical location. Funding offered for temperature monitoring only; planting proposal to be resubmitted with local data."
  *   *Instinct Check:* You said you would have funded this on instinct. The procedure stops you. This is the value of the tool. It prevents spending on "probably right" when "knowingly right" is affordable via monitoring first.

  ***

  ### Limitations and Irreducible Underdetermination

  You asked me to write down where this procedure cannot help.

  **1. The Values Hand-off is Real**
  Sometimes the evidence will be equally thin for two options, but you must spend the money. For example, two reaches both need work, data is poor for both. The procedure will tell you the evidence is equal. It cannot tell you which parish council deserves the money more. That is politics, not science. Step 7 forces you to admit this rather than pretending the science decided it.

  **2. The Cost of Certainty**
  Step 4 might demand data you cannot afford. Sometimes the only way to eliminate a rival is to spend £100,000, not £12,000. The procedure will say "Reject" or "Fund Monitoring." You may have to override this based on urgency. If a fishery is collapsing *now*, you may have to act on thin evidence. The procedure does not forbid this; it requires you to state in the rationale: "Evidence is thin, but urgency dictates action." This protects you from later claims that you thought the science was solid.

  **3. The Judgement of "Serious" Rivals**
  I cannot give you an algorithm for what counts as a "serious" rival. That depends on your hydrological intuition. If you dismiss a rival that turns out to be true, the procedure cannot save you. It only ensures you documented the dismissal. The accountability is in the writing, not the thinking.

  **4. Unknown Unknowns**
  Step 6 is a proxy, not a shield. You can have three independent lines of evidence and still be wrong because of a fourth factor nobody measured. The procedure reduces the risk; it does not eliminate it. You are still betting trust money. The advantage is that you are now placing informed bets rather than blind ones.

  **Final Word**
  You mentioned your friend said science "gets at the truth." Your experience tells you it gets at better decisions. This procedure codifies that. It stops you from pretending the data speaks for itself, and it stops you from hiding your judgement behind the data. It forces the panel to say: "Here is what we know, here is what we are guessing, and here is why we are spending the money despite the guess."

  That is a rationale that will stand up to appeal.
