prompt: |-
  me and my friend just spent three hours arguing about whether ChatGPT is actually a Gregorian creature or just a Skinnerian parrot with extra steps, and now i've agreed to defend my view in a philosophy of mind seminar on tuesday. my thesis is that current large language models are best understood as 'proto-Gregorian': they have the internal modelling Dennett assigns to Popperian minds, but they lack the cultural scafolding and open-ended tool-use loop that makes Gregorian minds genuinely creative, so they sit in a weird gap the original taxonomy doesnt capture.

  the audience is mostly cognitive scientists who know Dennett's four-level taxonomy inside out but think AI hype is mostly nonsense, plus one philosopher of mind who thinks the whole Darwinian-Skinnerian-Popperian-Gregorian ladder is just behaviourism in a fancy coat. i need a Q&A prep sheet — the objections they'll actually throw, in roughly the order they'll come, phrased like theyd say it, each with a quick reply and a note on where im soft. also: what should i concede up front? and whats the one question im hoping nobody asks?

  please write this in british english, keep it practical — im already stressed, and dont turn it into an essay. no need for references or reading lists, i just need to survive the room.
reasoning: |-
