      *   **Identify the Crucial Step:** Step (6) is doing the heavy lifting, but it's doing it by conflating two different objections. Step (5) is mathematically correct for the function, but its *ethical interpretation* in Step (6) is the problem.
      *   **The Diagnosis:**
          1.  **LDO vs. RC:** The argument describes the Repugnant Conclusion (RC), not the Levelling-Down Objection (LDO). LDO is about making existing people worse off for the sake of equality. RC is about adding new lives at low welfare. Prioritarianism avoids LDO (preserving Step 2) but is indeed vulnerable to RC (Step 5 is correct).
          2.  **Variable Population:** Standard Prioritarianism is a theory of distribution among *existing* people. Applying it to *possible* people (changing $n$) requires a population ethic. The argument assumes Prioritarianism applies unmodified to population size.
