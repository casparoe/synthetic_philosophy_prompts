answer: |-
  This is a classic stalemate, but your intuition is correct: the empirical ground is not the battleground. You are fighting over the *conditions of satisfaction* for a specific class of scientific claims. You are effectively disputing the logic of confirmation for theories that posit long-term causal mechanisms in open, historically unique systems.

  Since you asked for a brainstorming pass before commitment, here are five candidate diagnoses for the structural nature of this disagreement. I have tried to sharpen your own framings and add a few from the econometric and modeling literature.

  ### Five Candidate Diagnoses

  **1. The Dispositional vs. Categorical Claim (Your "Masking" Hypothesis)**
  On this reading, you treat the Malthusian mechanism as a *disposition* (a capacity that exists even when unmanifested), while your friend treats it as a *categorical prediction* (an event that must occur by time *t*). The disagreement is modal. For you, the mechanism is like "fragility": a glass is fragile even if it never breaks, provided nothing interfered. For him, the theory is like a weather forecast: if it doesn't rain by Tuesday, the model is wrong. The friction arises because you are arguing about the *ontology* of the theory (is it a law or a forecast?), while he assumes the ontology is fixed by the genre of the claim (it was published as a prediction, so it must be judged as one).

  **2. The Temporal Granularity Mismatch (Your "Shelf Life" Hypothesis)**
  This locates the problem in the time-series properties of the data. Long-run demographic theories operate on timescales (centuries) that exceed the lifespan of the theorists and the stability of the measurement regimes. Your friend is applying a standard of *short-run falsification* (did the prediction hold within the observable window?) to a *long-run structural claim*. The disagreement is about the *relevant sample size*. He sees 200 years of data as a sufficient sample to reject the hypothesis. You see 200 years as a single data point in a multi-century trajectory, insufficient to distinguish between "false" and "early." The fight is about the *epistemic authority of the present* over the future.

  **3. The Lakatosian Protective Belt (The "Ad Hoc" Charge)**
  This is the standard philosophy of science framing. Your friend sees your "contingent historical facts" (nitrogen, fossils, transition) as a thickening *protective belt* of auxiliary hypotheses designed to immunize the *hard core* (population presses resources) from refutation. He is accusing you of engaging in a *degenerating problem shift*: you are accommodating past anomalies without predicting new ones. You, conversely, view these auxiliaries as legitimate *specifications* of initial conditions. The disagreement is about the *boundary between the theory and its context*. Where does the theory end and the "noise" of history begin?

  **4. The Non-Stationarity of the Data Generating Process**
  Drawing from econometrics: your friend assumes the system is *stationary* enough that past performance constrains future probability distributions. You are implicitly arguing that the system underwent a *regime shift* (the Industrial Revolution/Fossil Age) that suspended the usual parameters. The disagreement is about whether the "Malthusian Regime" is the default state of the world (interrupted by a 200-year anomaly) or whether the "Solow/Innovation Regime" is the new default (interrupted by temporary resource spikes). You are fighting over which *baseline model* of historical dynamics is the null hypothesis.

  **5. The Pragmatic Function of the Theory**
  This is a sociological diagnosis. Your friend likely views the theory as a *policy instrument*: if it doesn't predict crises, we shouldn't allocate resources to prevent them. You view the theory as a *causal explanation*: understanding the pressure is valuable even if the crisis is averted. The disagreement is about *utility*. He wants a theory that minimizes surprise (predictive accuracy). You want a theory that maximizes understanding (explanatory depth), even at the cost of predictive precision. You are arguing past each other because you value different theoretical virtues.

  ***

  ### My Diagnosis: The Permissibility of *Ex Post* Auxiliary Specification in Non-Stationary Systems

  I am going to commit to a synthesis of **Diagnosis 3 (Lakatosian)** and **Diagnosis 4 (Non-Stationarity)**.

  The core of the dispute is not about whether the mechanism is real, nor about the data. It is about **the epistemic weight of *ex post* auxiliary hypotheses in singular historical trajectories.**

  Here is the shape of the fight: In a controlled experiment, you fix the auxiliaries *ex ante*. In historical macro-systems, you cannot. When a prediction fails, you have two choices: reject the core theory, or posit an auxiliary factor that prevented the outcome. Your friend operates with a *presumption of falsification*: unless the auxiliary was specified *ex ante*, it counts as an ad hoc rescue. You operate with a *presumption of causal realism*: if the auxiliary is independently verified (we know fossil fuels existed), it counts as a legitimate boundary condition, even if identified *ex post*.

  The reason you are stuck is that you are arguing about a **singular trajectory** (the history of Earth from 1800–2000). In singular trajectories, you cannot distinguish between "the theory is false" and "the initial conditions were unique" without a meta-theory of what counts as a "normal" condition. Your friend assumes the "normal" condition is the trend line of the last 200 years. You assume the "normal" condition is the biophysical constraint of the planet, of which the last 200 years are the anomaly.

  This is why "more data" fails. Every new data point can be absorbed by either side:
  *   **Friend:** "Still no crisis; theory dead."
  *   **You:** "Pressure is building (soil, aquifers); theory vindicated, timing delayed."

  This is a disagreement about **Theoretical Identity Conditions**. At what point does a theory modified by *ex post* auxiliaries become a *different* theory? Your friend says "immediately." You say "never, provided the core mechanism holds."

  ### The "Degenerating Programme" Constraint

  You asked what would have had to be true, fixed in advance, for your defense to count as a *progressive* research programme rather than a degenerating one. This is the crux.

  According to Lakatos, a programme is progressive if it predicts *novel facts*—facts that were not used in constructing the theory. Your current move ("right but early") is accommodating *old* facts (the lack of crisis). To be progressive, your "rescue" would have needed to generate a *new*, risky prediction *at the moment of the rescue*.

  **For your side to be progressive, the following would have had to be pre-committed:**
  When you first invoked the "fossil fuel/technology" auxiliary to explain away the 1970s/80s failures, you would have needed to specify:
  1.  **The Exhaustion Signature:** A specific, measurable indicator that the auxiliary is depleting (e.g., "When EROEI on fossil fuels drops below X, the Malthusian check will re-engage").
  2.  **The Lag Time:** A specific window for the re-engagement (e.g., "Within 20 years of peak extraction").
  3.  **The Novel Consequence:** A prediction about *where* the pressure would show up *before* the crisis hits (e.g., "We will see capital flight from agriculture into resource speculation prior to yield collapse").

  If you had said, "The theory holds, but the trigger is delayed until *this specific measurable threshold* is crossed," and then that threshold was approached, your programme would be progressive. Instead, the "delay" is open-ended. That is why your friend calls it a rescue operation. He is technically correct on the methodology of forecasting, even if you are potentially correct on the ontology of the mechanism.

  ### Prediction: The Next Five Years

  Given this diagnosis, here is how I predict this argument evolves over the next five years:

  1.  **Calcification of Positions:** The argument will not resolve; it will harden. Your friend will stop sending graphs of commodity prices (which you explain away via technology/substitution) and start sending graphs of *physical stock depletion* (aquifers, topsoil), arguing these are "harder" constraints that technology cannot wish away.
  2.  **Shift to "Signatures":** You will likely pivot (as you hinted) from predicting "crisis" to predicting "stress signatures." You will argue that high volatility in food prices or geopolitical conflict over water *is* the manifestation of the disposition, even without mass famine.
  3.  **The "One-Off" Defense:** Your friend will counter that the demographic transition is a permanent structural change, not a temporary auxiliary. He will argue you are treating a *phase shift* as a *perturbation*.
  4.  **No Falsification:** Neither side will concede. The theory is too insulated. The "Malthusian" label will become a placeholder for "biophysical constraint" rather than a specific predictive model.
  5.  **External Shock Required:** The only thing that will break the stalemate is an external event that forces a re-evaluation of the "normality" of the system (e.g., a synchronous global harvest failure, or conversely, a breakthrough in synthetic food that decouples calories from land entirely). Absent a shock, the emails will continue indefinitely.

  ### Is There a Structural Resolution?

  You asked if there is a criterion for "early" versus "wrong" that could have been signed onto *before the fact*.

  **Yes, but it requires abandoning the "Forecast" frame.**

  The dispute exists because you are both treating a *mechanism claim* as a *point prediction*. To resolve this structurally, you would need to adopt a **Pre-Registered Mechanism Test**.

  Instead of arguing about *when* the crisis happens, you would have to agree on **what the world looks like if the mechanism is false.**
  *   **Friend's Commitment:** If the mechanism is false, resource prices (adjusted for tech) should trend down or remain stable *indefinitely*, and substitution elasticities should remain high.
  *   **Your Commitment:** If the mechanism is true but masked, we should observe *increasing marginal costs* of extraction and *decreasing elasticity* of substitution over time, even if absolute scarcity isn't felt yet.

  **The Criterion:**
  You need to agree on a **Leading Indicator of Constraint** that is distinct from the **Lagging Indicator of Crisis**.
  *   *Crisis* (Famine/Price Spike) = Lagging. (This is what you are arguing about now).
  *   *Constraint* (Rising marginal cost of yield increase / Declining EROEI) = Leading.

  If you had agreed, 20 years ago, that "If the marginal cost of adding one calorie to the global food system rises by X% over Y years, the Malthusian mechanism is confirmed, regardless of famine," you would have a testable claim.

  **The Hard Truth:**
  However, I suspect no such criterion can be had that satisfies both of you. Why? Because your friend is an economist. He believes prices *are* the signal. If prices aren't screaming, the constraint isn't binding. You are a philosopher/biophysical thinker. You believe prices are noisy signals that lag physical reality.

  **Conclusion:**
  You are not having a dispute about demography. You are having a dispute about **Realism vs. Instrumentalism in Historical Science.**
  *   He is an **Instrumentalist**: A theory is a tool for prediction. If it doesn't predict, it's a broken tool.
  *   You are a **Realist**: A theory is a map of causal powers. A map is not wrong because the road is temporarily clear; it is wrong only if the terrain doesn't exist.

  **Recommendation:** Stop trying to convince him the theory is *confirmed*. Argue instead that it is *unfalsified* but *currently untestable* due to the singularity of the fossil interval. Admit that without a pre-registered leading indicator, your position is methodologically vulnerable. Ask him to specify what *physical* metric (not price) would change his mind. If he cannot, he is the one operating on faith (faith in infinite substitutability). If you cannot, you are the one operating on faith (faith in inevitable collapse).

  The argument will only end when one of you admits that your position rests on a metaphysical commitment about the nature of history, not on the graphs you are emailing.
