prompt: |-
  You're a senior philosopher of science who also knows something about how long-run forecasts get made and evaluated in demography and resource economics — that's who I want answering this. Take your time: I'd genuinely find it useful if you brainstormed four or five candidate diagnoses first, including ones I haven't thought of, before committing to one, and then told me what your diagnosis predicts about how this argument will go over the next five years. Assume I'm a professional philosopher, use the technical vocabulary where it earns its keep, and please don't do a literature review or give me citations — I know the literature, I just can't see the shape of this fight.

  Here's the setup. I teach a grad seminar on confirmation and prediction, and I've had an argument running with a friend in the econ department for about six years now in which neither of us has moved an inch, and I've started to suspect we're not having the argument I think we're having.

  His side: population growth never produced the food crises the theory said it would, the numbers went the wrong way for two centuries, so the theory was tested and it failed — end of story. My side: the mechanism is intact and the *timing* is what failed. Population presses on a resource base and eventually gets pushed back by checks; what kept the trigger from being pulled were contingent historical facts — fixing nitrogen industrially, the high-yield crop package, the demographic transition, and cheap fossil energy functioning as a one-off inheritance we've been spending down. He says that's not a theory, it's a rescue operation: move the date, bolt on an auxiliary hypothesis, repeat, and nothing could ever count against you. Every year or so one of us emails the other a graph and nothing changes.

  To be clear about the empirical ground, because I don't want you to adjudicate it: we both accept the same headline items — the famous wager over commodity prices that the optimistic side is usually taken to have won, the collapse in population growth rates across most of the world in recent decades, and the visible strain on particular renewable stocks like fisheries, aquifers and topsoil. We just read them in opposite directions. So "more data" is not going to settle this and I'm not asking you to try.

  My working hypothesis is that this isn't a dispute about demography or economics at all, but about what kind of object a long-run prediction is. I've been toying with two framings and I cant tell which one is doing the real work.

  First, masking. Maybe a Malthusian check is a dispositional claim rather than a dated forecast: a capacity that manifests only when nothing prevents it. There's a whole apparatus for this in the literature on dispositions — a disposition can be present without manifesting because something interferes, and the standing worry is that if you can always appeal to an interferer the claim stops being testable. On this reading "right but early" is just the temporal version of that move, and my friend's complaint is the standard complaint about it. But maybe there's an out: you don't have to wait for the crisis to arrive, you can look for the disposition's *signature* while it's being held off — measurable pressure on the resource base that shows the mechanism running even though it isn't producing famine. I don't know whether that's a genuine test or just the same rescue dressed up with better instruments.

  Second, shelf life. Every long-run prediction seems to carry an unstated expiry date, and nobody declares in advance how fast the prediction's own "all else equal" clause is allowed to rot. Once the date passes, there's no agreed procedure for deciding whether the failure hit the core claim or only the ceteris paribus clause attached to it. Maybe that's what we're fighting about: not the world, but the standards for what counts as a test of a claim like this. Or maybe it's really about scale or aggregation, and the dynamics are real at the level of a region or a watershed and simply average away when you add the planet up, or operate on a timescale our data series can't resolve.

  So: what kind of disagreement is this? Substantive, verbal, a clash of methodological standards about what would count as a test, a disagreement about which cases count as the data, or two different questions — "is the mechanism real" and "is this forecast reliable" — going around under one name? Engage with what each side in this kind of argument actually says, not with a neutral summary of the topic. And please don't hand me "it's a degenerating research programme" as your conclusion unless you can also say what would have had to be true, fixed in advance of the outcome, for it to count as progressive instead. That last bit is the part I keep failing to answer, and I think it's where the whole difficulty lives.

  Then, given your diagnosis: is there anything that would actually end it? Not more data. I mean something structural — a criterion for "early" versus "wrong" that both of us could have signed onto before the fact, a way of saying how much date-shifting a prediction can survive before it is no longer the same prediction, a distinction we're both missing, or an honest argument that no such criterion can be had and the argument will just keep recieving new graphs forever.
