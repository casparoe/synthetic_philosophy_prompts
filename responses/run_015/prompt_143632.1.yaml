answer: |-
  # Game Design: "The Six-Round Fund"

  ## 1. Overview & Philosophy
  **Goal:** Induce cognitive dissonance between the *Prospectus* (the ITN-style numbers on the cards) and the *Reality* (the hidden mechanical constraints).
  **Time:** 120 Minutes hard stop.
  **Players:** 12 Participants (4 Tables of 3).
  **Materials:** Whiteboard, Markers, 48 Index Cards (12 per table), 4 "Auditor Notes" (envelopes), 1 "Final Audit" sheet (Facilitator only).
  **Currency:** "Grant Tokens" (index cards marked $1M).

  ## 2. The Cause Cards (The Prospectus)
  *Print these on cardstock. Every table gets one of each at the start. These contain the "ITN Numbers" participants will trust.*

  **CAUSE A: DIRECT RELIEF**
  *   **Pitch:** Immediate, measurable alleviation of suffering.
  *   **Impact Rate:** 10 Points per Token invested.
  *   **Notes:** Proven track record. Low risk.
  *   *(Hidden Mechanic: Diminishing Returns. Once global investment exceeds 100 Tokens, rate drops to 2 Points/Token.)*

  **CAUSE B: SYSTEMIC INFRASTRUCTURE**
  *   **Pitch:** Building the plumbing for future delivery.
  *   **Impact Rate:** 0 Points initially. If **40 Tokens** are invested globally *by the end of Round 4*, the system activates.
  *   **Activation Bonus:** Once active, pays 20 Points/Token to *all past and future investors* for remaining rounds.
  *   *(Hidden Mechanic: The 40-token threshold is global. Tables only see lagged data.)*

  **CAUSE C: RESEARCH & CAPACITY**
  *   **Pitch:** Improving the effectiveness of all other sectors.
  *   **Impact Rate:** 5 Points per Token invested.
  *   **Multiplier:** Each Token invested adds +10% to the Impact Rate of **all Causes** for subsequent rounds.
  *   *(Hidden Mechanic: The Multiplier only applies starting Round 5. Investments in Rounds 1-4 yield base points only.)*

  **CAUSE D: POLICY ADVOCACY**
  *   **Pitch:** High-leverage government coordination.
  *   **Impact Rate:** 20 Points per Token invested.
  *   **Notes:** High variance, high reward.
  *   *(Hidden Mechanic: 50% Funging. Half of all investment displaces existing government funding. Real impact is 10 Points/Token.)*

  **CAUSE E: HORIZON BET**
  *   **Pitch:** Solving the root problem for the next century.
  *   **Impact Rate:** 100 Points per Token invested.
  *   **Notes:** Payoff realized in long term.
  *   *(Hidden Mechanic: Payoff realizes in Round 8. Game ends Round 6. Score = 0.)*

  ---

  ## 3. The Whiteboard (The Almanac)
  Draw this centrally. Do not update it until the round is closed.

  | Round | Direct (A) | Infra (B) | Research (C) | Policy (D) | Horizon (E) |
  | :--- | :---: | :---: | :---: | :---: | :---: |
  | **1** | | | | | |
  | **2** | | | | | |
  | **3** | | | | | |
  | **4** | | | | | |
  | **5** | | | | | |

  *   **Rule:** At the start of Round $N$, you display the totals from Round $N-1$.
  *   **Round 1:** Board is blank. They are flying blind.
  *   **Round 2:** Board shows Round 1 totals.
  *   **Etc.**

  ---

  ## 4. Round Timeline (60 Minutes Total)
  *Strict timekeeping is essential. Use a visible timer.*

  *   **Min 0-5 (Setup):** Distribute 10 Tokens per table. Hand out Cause Cards. Explain: "Maximize your table's Impact Points. Submit allocation secretly."
  *   **Min 5-15 (Round 1):** Tables discuss. Submit allocations (index cards with cause name + token count). *Facilitator collects.*
  *   **Min 15-17 (Update):** Facilitator sums tokens per cause. Writes Round 1 totals on Whiteboard.
  *   **Min 17-27 (Round 2):** Tables see Round 1 data. Decide. Submit.
  *   **Min 27-29 (Update):** Facilitator writes Round 2 totals.
  *   **Min 29-39 (Round 3):** Tables see Round 2 data. Decide. Submit.
  *   **Min 39-41 (Update):** Facilitator writes Round 3 totals.
  *   **Min 41-43 (The Audit):** Hand out **Auditor Notes** (see below) to each table. Do not speak.
  *   **Min 43-53 (Round 4 & 5 Combined):** *Accelerate.* "You have 10 minutes for two rounds." (Simulates crisis/urgency). Submit Round 4, then immediately Round 5.
  *   **Min 53-55 (Update):** Facilitator writes Rounds 4 & 5 totals.
  *   **Min 55-60 (Round 6):** Final allocation. "Spend your remaining budget." Submit.

  ---

  ## 5. Scoring & The Reveal (20 Minutes)
  *This is where the learning happens. Do not explain the rules yet.*

  1.  **Projected Score (Min 60-65):** Ask tables to calculate their score based *only* on the Cause Cards they hold. Have them write this on a card and hand it to you.
      *   *Most will calculate high scores based on the headline rates.*
  2.  **Facilitator Calculation (Min 65-75):** You take the cards. You apply the **Hidden Mechanics**.
      *   *Direct:* Check if global total > 100. Apply 2pt rate if so.
      *   *Infra:* Check if global total reached 40 by Round 4. If not, score is 0.
      *   *Research:* Apply Multiplier only to Rounds 5 & 6.
      *   *Policy:* Cut all scores in half (Funging).
      *   *Horizon:* Score is 0 (Time Horizon).
  3.  **The Reveal (Min 75-80):** Announce the **Real Scores**. They will be significantly lower than the Projected Scores. Some tables may have 0 impact on specific causes they heavily funded.
  4.  **Global Reveal:** Show the *actual* Whiteboard totals (including Round 6). Reveal the Threshold miss (if it happened).

  ---

  ## 6. The Auditor Notes (Min 41)
  *Print these on distinct paper. Hand one to each table silently during the game.*

  **AUDITOR NOTE #429**
  *Confidential*
  *Review of Cause D (Policy Advocacy) indicates significant overlap with existing state budgets. For scoring purposes, assume 50% displacement of current activities. Adjust expectations accordingly.*

  *(This forces them to update their mental model of Cause D mid-game, but they cannot communicate this to other tables.)*

  ---

  ## 7. Debrief Script (40 Minutes)
  *Map their frustration to the vocabulary they already know.*

  **Phase 1: The Discrepancy (10 mins)**
  *   **Ask:** "Who scored lower than they projected? By how much?"
  *   **Ask:** "Who invested in Horizon Bet? How did it feel to see that score as zero?"
  *   **Point:** "You optimized for the map (the cards), not the territory (the rules). The ITN numbers on the card were *average* estimates, not *marginal* truths."
  *   **Vocabulary:** **Marginal Value.** The first dollar is worth 10 points; the 100th dollar might be worth 2.

  **Phase 2: The Coordination Failure (10 mins)**
  *   **Ask:** "Who tried to fund Infrastructure (Cause B)? Did you hit the 40-token threshold?"
  *   *(Likely answer: No, because you were reacting to lagged data.)*
  *   **Point:** "You were chasing neglectedness based on last year's data. By the time you saw it was neglected, it was already filled. Or, you waited for others to move, and no one did."
  *   **Vocabulary:** **Coordination Problems / Lumpy Goods.** Some causes aren't linear; they are step-functions.

  **Phase 3: The Audit & Time (10 mins)**
  *   **Ask:** "Who got the Auditor Note? Did you stop funding Policy?"
  *   **Ask:** "Why did Research (Cause C) underperform? It had a multiplier."
  *   **Point:** "The multiplier kicked in Round 5. You invested in Rounds 1-3. You paid the cost, but the benefit arrived after your budget cycle ended."
  *   **Vocabulary:** **Time Horizons / Discount Rates.** Your scoring rule implicitly valued the present over the future. Did you notice you never asked *when* the points arrived?

  **Phase 4: The "Gaming" Objection (10 mins)**
  *   **Anticipate:** The sharpest person will say: "This didn't teach us to do good. It taught us to game your scoring rule."
  *   **Response:** "Correct. That is the entire lesson. ITN is a scoring rule. It is a heuristic for allocating limited resources under uncertainty. If you optimize for the heuristic without understanding the hidden constraints (funging, absorption, timing), you will lose. The vocabulary I withheld (marginal, funging, capacity) exists to help you spot the hidden rules before you spend the money."

  ---

  ## 8. Predictable Failure Modes (And Fixes)

  1.  **Math Paralysis:** Tables spend 8 minutes calculating expected values.
      *   *Fix:* Announce "Good enough is better than perfect. You have 2 minutes left."
  2.  **The Threshold is Hit Too Easily:** If 4 tables put 10 tokens in Round 1, the 40-token threshold is met immediately.
      *   *Fix:* If you see this happening in Round 1, quietly increase the threshold to 50 for the *remaining* tables (or just accept it and highlight in debrief how rare easy coordination is). *Better:* Set threshold at 45 tokens. With 4 tables x 10 tokens, they *could* hit it, but only if they ignore everything else.
  3.  **One Table Dominates:** One table hordes tokens and doesn't spend.
      *   *Fix:* Rule: "Unspent tokens vanish at the end of each round." (Use-it-or-lose-it budget).
  4.  **Facilitator Math Error:** You miscalculate the multiplier during the reveal.
      *   *Fix:* Have a pre-printed spreadsheet on your phone (hidden) to check your envelope math quickly. Or keep the multiplier simple (+10% flat).

  ---

  ## 9. What This Game Cannot Reproduce
  *Be honest about this in the closing remarks.*

  1.  **True Uncertainty:** In the game, the rules were fixed. In reality, you don't know the impact rate is 10 or 2. You have to estimate it from garbage evidence.
      *   *Tell them:* "In the real world, you don't get Cause Cards. You get a 30-page PDF and a conflicted expert."
  2.  **Moral Weight:** The game reduces suffering to "Points."
      *   *Tell them:* "The framework helps you compare scales, but it cannot tell you if 'Points' is the right metric. That requires philosophy, not math."
  3.  **The View from Nowhere:** The game assumes a single goal (maximize points).
      *   *Tell them:* "Your foundation has a mission, a board, and a public reputation. Sometimes the 'optimal' move is politically impossible. ITN doesn't capture politics."

  ## 10. Facilitator Cheat Sheet (The Hidden Rules)

  *   **Direct Relief:** Sum global tokens. If > 100, all Direct tokens score 2pts. Else 10pts.
  *   **Infra:** If Global Round 1-4 sum < 40, Score = 0. If > 40, Score = 20pts/token (all rounds).
  *   **Research:** Base 5pts. Multiplier (+10% per token) applies *only* to Rounds 5 & 6 scores.
  *   **Policy:** Total Score $\times$ 0.5.
  *   **Horizon:** Score = 0.
  *   **Time Horizon:** Any impact scheduled for "Round 7+" = 0.

  *(Keep this sheet hidden until the Reveal.)*
