answer: |-
  This phenomenon is not a single philosophical error, but a coherent, layered practice of **social ontology**. It is a claim primarily about **status**, expressed through the language of **identity**, driven by **value**, and protected by a deliberate **ontological deflation** (the claim that "none of this is real").

  Here is the breakdown of what is happening, how it relates to existing philosophical problems, and a proposed term for it.

  ### 1. Identity, Value, or Norms?
  It is a claim about **Normative Identity**.

  When your players say the GM-spawned sword "is not the same item," they are not making a metaphysical claim about the code (they know the code is identical). They are making a normative claim about **entitlement**. In your world, to own the Event Sword is to hold a certificate of participation in a specific past event. A copy lacks the entitlement because it lacks the participation.

  Players express this as identity ("It isn't the sword") rather than value ("It isn't worth as much") because identity claims are harder to negotiate. If it is a matter of value, someone could theoretically offer enough coins to bridge the gap. If it is a matter of identity, no amount of coins makes the copy the original. This rhetorical move protects the scarcity of the object from market inflation.

  Therefore, the phenomenon is a **value judgment masquerading as an identity claim** to enforce a **norm of scarcity**.

  ### 2. The "Unreal" Claim
  The players' insistence that the objects are "not real" is **incidental but functional**. It serves as a boundary marker for what philosophers of play call the "Magic Circle."

  *   **Function:** It protects the players from the cognitive dissonance of caring deeply about pixels. By agreeing "this is not real," they can safely invest high emotion into it without feeling foolish in the outside world.
  *   **Essentiality:** It is not essential to the mechanism of valuation, but it is essential to the *stability* of the community. It allows them to treat the server shutdown as "no real loss" (ontologically consistent) while treating the demolition of the cathedral as "a real wrong" (normatively consistent). The "unreal" label applies to the *substance* (pixels), but the "real" label applies to the *relationships* (effort, time, community).

  ### 3. Resolving the Third Case (The Lore Items)
  You noted that Case 3 (items with invented lore) seems to contradict the idea that "actual causal origin" matters. It does not. The common thread across all three cases is not **Truth**, but **Authorization**.

  *   **Case 1 (Event Item):** The origin is authorized by the **System Rules** (the event window) and **Player Agency** (being there). The GM copy is unauthorized by the rules.
  *   **Case 2 (Cathedral):** The origin is authorized by **Collective Labor**. The GM paste is unauthorized by the labor.
  *   **Case 3 (Lore Item):** The origin is authorized by **Developer Sanction**. The story is fake, but the *assignment* of that story is an official act of the institution.

  Players reject the GM copy in Case 1 and 2 because it bypasses the **ritual of creation**. They accept the Lore Item in Case 3 because it *underwent* the ritual of official designation. The value lies in the **Sanctioned Origin**, not the objective truth of the history. A player forging a lore item would be rejected just like the GM copy; a Developer creating one is accepted.

  ### 4. Fungibility and Edges
  The contrast with coins identifies the boundary of the phenomenon.
  *   **Instrumental Objects (Coins):** These are tools for exchange. Their value is purely quantitative. History is irrelevant.
  *   **Constitutive Objects (Swords/Cathedrals):** These are memorials or trophies. Their value is qualitative and indexical (they point to a specific time/agent).

  The edge of the phenomenon lies at **Indexicality**. If the object serves as a sign pointing to a specific moment in the server's history, the phenomenon applies. If the object is a generic tool, it does not. This is why a "perfect forgery" of a painting is worthless in art markets (it fails to point to the artist's hand), but a perfect copy of a dollar bill is only worthless because of legal prohibition, not because we care about the specific paper's history (usually). Your virtual items function more like **bearer bonds of memory** than like tools.

  ### 5. Relation to Nearby Philosophical Puzzles
  *   **Art Forgery (Goodman):** This is the closest match. However, in physical art, there is always a microscopic physical difference. In your world, there is *none*. This makes your case a "Pure Digital Forgery" puzzle. It proves that aesthetic/physical properties are secondary to **provenance** in determining identity for valued objects.
  *   **Paradox of Fiction (Walton):** This explains why players feel emotion for things they know aren't real. It explains the *emotion*, but not the *discrimination* between the original and the copy. You can feel emotion for a copy of a sad letter, but you value the original higher. Your phenomenon is about **ownership of history**, not just emotional engagement.
  *   **Social Construction of Money (Searle):** This is the strongest structural parallel. Money is only money because we agree it counts as such. Your items are "Status Functions." However, money is fungible; your items are **non-fungible status functions**.

  ### 6. What To Call It
  There is no single established term that captures the specific tension of "digital non-reality" + "causal essentialism" + "social sanction." "Authenticity" is too broad; "Provenance" is too dry.

  I propose calling this **Constitutive Provenance**.

  **Definition:** Constitutive Provenance is the social practice wherein the identity and value of an object are determined not by its intrinsic properties, but by the authorized history of its creation, even when the object is acknowledged to lack material reality.

  **Cases it covers:**
  *   Your Event Sword (Authorized by Time/Rules).
  *   Your Cathedral (Authorized by Labor/Agency).
  *   Your Lore Items (Authorized by Developer Sanction).
  *   Physical autographs (The ink is cheap; the history of the hand is the value).
  *   NFTs (When functioning as intended: the token is not the art, it is the receipt of authorization).

  **Cases to keep apart:**
  *   **Sentimental Value:** A child's drawing is valuable to a parent due to emotional bond, but a copy might still be accepted if the original is lost. Constitutive Provenance rejects the copy entirely.
  *   **Scarcity alone:** A limited run of 1,000 identical swords does not trigger this unless the *method* of acquisition is part of the identity.
  *   **Bug Exploits:** If a player dupes an item via a glitch, it is rejected not just because it's unauthorized, but because it violates the *constitutive rules* of the game itself. Constitutive Provenance applies even when the copy is made by an Admin (authorized by power, but not by the ritual).

  ### Summary
  Your players are treating virtual objects as **indexical signs of social history**. They claim the objects are "unreal" to manage the stakes of the game, but they enforce "Constitutive Provenance" to protect the stakes of their community. They are not arguing about code; they are arguing about **who has the right to say what happened.** The GM copy is rejected because it is a lie about the history of the world, and in a persistent sandbox, the shared history is the only thing that is truly real.
