answer: |-
  You have put your finger on the exact fault line where bioethics, law, and metaphysics crack under pressure. As a hydrologist, you are used to the idea that a model is only as good as its boundary conditions, and that measurement error is not a bug, it's a feature of reality. What you are describing in advance directives (ADs) is a system that pretends to have zero error bars on the most volatile variable of all: the human self over time.

  Here is an attempt to map the terrain you are looking at, distinguishing between what the system *logically requires*, where it is *underdetermined*, and what the alternative would look like.

  ### 1. The Capacity Flip: Inconsistency or Threshold?
  You asked if the practice collapses at the capacity line, or if there is a unifying principle.

  **The Unifying Principle:** The system is not based on "what makes the person in the bed happy." It is based on **Precedent Autonomy**. The governing rule is: *Respect the most recent competent expression of will.*

  *   **When Competent:** You are the current author of the text. You can edit the manuscript. The "paper" (the old AD) is just a draft; the "person" (current you) is the editor.
  *   **When Incompetent:** You are no longer the editor. You are the text. The last valid edit (the AD) stands because there is no authorized agent to change it.

  **The Inconsistency:** The friction you feel comes from the definition of "competence." In law and medicine, competence is a binary switch (on/off) applied to a gradual slope (cognitive decline).
  *   In **psychiatry**, when we honor an AD over a screaming patient, we are usually asserting that the *current* will is pathological (a distortion of the "true" self).
  *   In **dementia**, when we honor an AD over a smiling patient, we are asserting that the *current* will is non-existent (the "true" self is gone).

  So, the practice does not collapse logically, but it rests on a specific metaphysical claim: **Identity is anchored in the rational, planning self, not the experiencing self.** It assumes the "you" that plans for death is the "real" you, and the "you" eating pudding in the garden is a remnant. If you reject that metaphysical claim, the flip looks like tyranny. If you accept it, the flip looks like protection.

  ### 2. Transformative Experience: Does the Practice Collapse?
  You mentioned the philosophical idea of "transformative experience" (associated with L.A. Paul): that you cannot know what it is like to be demented until you are there, so your prior refusal is epistemically bankrupt.

  **Does the practice collapse if this is true?**
  *   **Strictly (Legally/Logically): No.** The system does not require that you *know* the future state. It requires only that you have the **right to allocate risk**.
      *   Think of it like a financial contract. I can sign a contract today selling a future asset, even if I don't know exactly what the market will look like tomorrow. I am betting against my future self. The law enforces the bet, not the accuracy of the prediction.
      *   The AD presupposes that **dignity (as defined by the past self) outweighs contentment (as experienced by the present self).** It assumes you can validly say, "I would rather be dead than be *that* person," even if *that* person is happy.

  *   **Morally: Yes, it strains to breaking.** If the "transformative experience" view is true, the pre-dementia self is making a decision based on false data. To enforce that decision is to sacrifice a happy, living being for the sake of a ghost's fear.
      *   However, a proponent of ADs would argue: "We accept transformative risk in other areas." We let people join the military or get married knowing they might change their minds. The AD is simply a decision to accept the risk of "survival with indignity" as a worse outcome than death.

  **Can you hold the "transformative" view and sign an AD?**
  Yes, without contradiction, if you frame it as a **pre-commitment strategy**. You are saying: "I know I might be happy in that state, but I also know that 'happiness' might be a chemical illusion I no longer value. I am binding my future self to my current values because I trust my current values more." It is an act of faith in your past judgment, not a claim of perfect knowledge.

  ### 3. "What He Would Have Wanted" vs. "What Is Best For Him"
  This is the most practical manifestation of the philosophical split. You noted you were told to decide the former.

  *   **Substituted Judgment ("What he would have wanted"):**
      *   **Assumption:** Personal identity persists through dementia. The man in the bed is the same entity as the man who signed the form.
      *   **Goal:** To extend the autonomy of the past self into the incapacity of the present self.
      *   **Risk:** It can mandate harm to the current self (e.g., withholding treatment for a chest infection) to satisfy the narrative of the past self.

  *   **Best Interest ("What is best for him now"):**
      *   **Assumption:** The demented self is, in relevant ways, a new entity or at least a distinct moral patient. The past self's authority expires when the capacity to value expires.
      *   **Goal:** To maximize the well-being of the currently experiencing consciousness.
      *   **Risk:** It violates the life narrative and deeply held values of the person who lived 90% of the life. It treats the human being as a vessel of current sensation rather than a story.

  **The Instruction You Received:**
  By telling you to decide "what he would have wanted," the hospital was explicitly choosing **Narrative Integrity** over **Current Welfare**. They were prioritizing the *story of his life* (which he authored) over the *quality of his days* (which he is currently living). This is the standard legal position in most Western jurisdictions (following Ronald Dworkin's argument in *Life's Dominion*), but it is not the only ethical position. Rebecca Dresser, a prominent critic, argues exactly what you are hinting: that the "demented self" has interests that the "prior self" had no right to veto.

  ### 4. What If We Built the System on "Lived Experience"?
  If we accepted your brother's smiling face as the only valid evidence of his well-being, and accepted the "transformative experience" argument as a hard limit on knowledge, the system would look radically different:

  1.  **ADs for Dementia Would Be Void:** You could not refuse treatment for a condition arising *after* the onset of significant cognitive decline. You could only refuse treatments for terminal conditions present *now*.
  2.  **The "Best Interest" Standard Would Rule:** Surrogates would be instructed: "Look at the person in the bed. Are they suffering? Are they content?" The past wishes would be advisory only, like a letter of recommendation, not a binding order.
  3.  **The "Experience Requirement":** As you suggested, valid directives might require "simulation." Perhaps you could only refuse life-sustaining treatment for dementia if you had spent significant time caring for someone with dementia, or undergone a rigorous counseling process designed to expose you to the reality of the condition (not just the horror stories).
  4.  **Sunset Clauses:** ADs might expire after a certain time (e.g., 10 years) unless reaffirmed, acknowledging that the "self" changes enough over decades that the old contract is void.

  ### 5. Where the Practice is Underdetermined
  You asked where several theories license the same forms. The "fuzziness" is in the **definition of suffering.**

  *   **Theory A (Dworkin):** Suffering includes the violation of critical interests (values, dignity, life narrative). The smiling demented man is suffering because his life is being lived in a way he explicitly rejected.
  *   **Theory B (Dresser):** Suffering is experiential (pain, fear, distress). The smiling demented man is not suffering.

  Both theories can agree on a form that says "No ventilators if I am permanently unconscious."
  *   Theory A says: "He wouldn't want to be a body without a mind."
  *   Theory B says: "There is no one there to experience the benefit."

  They diverge only when the patient is *conscious but changed* (like your brother). The form looks the same, but the justification is different. The system papers over this divergence by using the word "competence" as a shield. It avoids asking "Is he still him?" and asks "Can he sign this?"

  ### Summary for the Hydrologist
  You spent 35 years measuring flow, knowing that the river changes the channel and the channel changes the river.
  *   **The Advance Directive** assumes the river channel (the values) is concrete and the water (the experience) is secondary.
  *   **The Transformative View** assumes the water is the only reality, and the channel is an illusion created by the water's past path.

  The hospital practice **strictly requires** that we treat the "past competent self" as the legal owner of the "future incompetent body." It does not require that the past self was *right* about the future experience, only that the past self was *sovereign*.

  The instruction you were given ("what he would have wanted") confirms that the system values **consistency of character** over **consistency of care**. It asks you to be the executor of his will, not the guardian of his welfare. That is why it felt like you were following a map for a terrain that no longer existed. You were. The map was drawn for the man he was, not the man he became. The tragedy is that the law recognizes only one of them as the person who matters.
