  hey, im working on a diss chapter about institutional leftovers and i keep circling this case. our lab still enforces a 10-year raw-data purge rule that made sense in the 90s when storage cost a fortune and PI's feared grad-student hoarding, but now everyones on cloud backups, the original architects are retired, and nobody on the current faculty actually endorses the rationale. still, my advisor floated this idea of a "free-floating rationale"—that the policy might generate normative reasons even though no present reasoner holds them. that feels metaphysically weird, but i can't articulate the objection.

  can you help me think through whether reasons can genuinely exist without reasoners in a situation like this, and advise me on how to frame the argument? please answer in american english.
