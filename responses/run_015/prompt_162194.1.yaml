answer: |-
  Applying your two-part test implies that moral obligation for visitors is contingent on observability and social impact rather than the act itself, leading to the unsettling conclusion that you may be ethically required to limit your generosity and excused from rudeness simply because the rule was difficult to see.

  Regarding legibility, your framework makes morality epistemic rather than behavioral, meaning your duty to respect the bakery queue depends entirely on your ability to decode the eye-contact system rather than the inconvenience you cause by bypassing it. If the convention is opaque, your test grants you a moral exemption to act in ways that locals find disruptive, effectively privileging the visitor's perceptual limitations over the local community's coordination costs. This creates a problematic dependency on unknowable facts, because legibility is subjective; if you mistakenly believe the queueing system is illegible when locals consider it obvious, your test suggests you are not blameworthy for cutting in line, even though the harm to the waiting customers is identical. This undermines the idea that conventions are obligations based on mutual respect, suggesting instead that they are only binding if they are transparent enough to be learned without instruction.

  The ratchet-sensitivity criterion produces the counterintuitive result that you are obligated to suppress your own generosity to maintain local economic equilibrium. By dictating that you must tip exactly eight percent and not twenty-five, your principle transforms supererogatory kindness into a moral violation because it disrupts the baseline expectations for servers and other patrons. This obliges you to do less than you would freely choose, positing that conformity to local norms is ethically superior to individual charity when the latter risks inflating community standards. It suggests that the moral weight of a convention lies not in the immediate transaction but in its second-order effects on the social fabric, requiring you to treat your own actions as data points that calibrate the system rather than isolated gestures of goodwill.

  Finally, your test fails to account for physical safety because it lacks a harm principle override, which is critical when analyzing the jaywalking convention. Since crossing on red is highly legible, your principle generates a strong obligation to comply, yet if the local drivers were misjudged and compliance became dangerous, the test would still demand you cross because the visibility of the rule remains high. This reveals that legibility and ratchet-sensitivity are insufficient conditions for moral obligation because they ignore the intrinsic value of bodily security; a convention can be obvious and socially stable while still being physically hazardous. Ultimately, your framework suggests that everyday conventions are moral obligations only instrumentally, binding visitors only insofar as they are visible enough to be learned and stable enough to be disrupted, but it requires a third criterion regarding safety to prevent obligating compliance with dangerous norms.
