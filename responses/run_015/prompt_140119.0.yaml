answer: |-
  There is no single, canonical term in the literature that captures this exact distributed, bidirectional pattern. However, the phenomenon you describe is a recognizable composite of several established concepts in the philosophy of science, epistemology, and science and technology studies (STS).

  The most precise existing description is a form of **Lakatosian Immunization** distributed across a **Division of Epistemic Labor**, resulting in **Systematic Testimonial Nullification**.

  Below is the breakdown of the established concepts, the synthesis required to name your specific pattern, and the criteria for distinguishing this from legitimate methodological rigor.

  ### 1. The Established Concepts (The "Nearby Things")

  You asked how this relates to four specific concepts. Here is the mapping based on current philosophical and sociological consensus.

  **A. Unfalsifiability (Popper/Lakatos)**
  *   **Status:** *Settled.*
  *   **Relation:** This is the logical outcome of the pattern. If a theory (or measure) is structured such that no observation (patient report) can count against it, it is unfalsifiable. However, "unfalsifiability" usually describes the *theory*, not the *social mechanism* by which evidence is filtered.
  *   **Nuance:** Imre Lakatos refined this with the concept of a **"Research Programme."** He argued that scientists protect the "hard core" of a theory by adjusting the "protective belt" of auxiliary hypotheses. In your case, the *measure* is the hard core. The "auxiliary hypotheses" are the explanations for why the patient is wrong (e.g., "they have adapted" or "they are depressed"). When these adjustments are made *ad hoc* solely to save the measure, Lakatos calls this a **"degenerating research programme."**

  **B. Confirmation Bias**
  *   **Status:** *Settled (Psychologically), Contested (Structurally).*
  *   **Relation:** Confirmation bias is typically an individual cognitive error. Your observation is crucial: *nobody is individually selective.* This moves the phenomenon out of individual psychology and into **structural bias**.
  *   **Nuance:** In STS, this is often described as **"Institutionalized Motivated Reasoning."** The institution (the field) achieves what the individual avoids: a perfect confirmation loop.

  **C. Adaptive Preferences (Nussbaum/Sen/Elster)**
  *   **Status:** *Contested.*
  *   **Relation:** This is the specific justification used for the *positive* mismatch (the "happy patient" discounted by advocates). The philosophical debate here is: *When is adaptation rational resilience, and when is it oppressive false consciousness?*
  *   **Nuance:** The field risks committing the **"Paternalist Fallacy"** here. If the measure assumes the patient *cannot* know their own good because they have adapted, the measure assumes a "view from nowhere" that is epistemically privileged over the "view from somewhere." This is philosophically contentious; many capability theorists argue that without strong evidence of coercion, first-person reports should trump external metrics.

  **D. Testimonial Injustice (Fricker)**
  *   **Status:** *Settled (as a concept), Contested (in application).*
  *   **Relation:** Miranda Fricker's concept describes when a speaker is given less credibility than they deserve due to identity prejudice. Your case is slightly different: the credibility deficit is not based on *identity* (race, gender) but on *deviation from the norm*.
  *   **Nuance:** This is sometimes called **"Content-Based Testimonial Injustice."** The patient loses credibility *because* their content mismatches the measure. Because this happens in both directions (too happy = unreliable; too sad = unreliable), it creates a **"Credibility Pincer."**

  ### 2. Coining the Concept: "Distributed Epistemic Immunization"

  Since there is no single word, I propose **Distributed Epistemic Immunization** as the descriptive label for this specific configuration.

  *   **Definition:** A systemic pattern in which a field protects a central metric or theory from falsification by distributing the burden of explaining away anomalies across different roles (e.g., clinicians vs. advocates). Positive anomalies are explained by one set of auxiliary hypotheses (adaptation/false consciousness), and negative anomalies by another (pathology/misattribution), such that the central metric remains unchallenged.
  *   **Why "Distributed"?** Because no single actor is biased; the bias emerges from the interaction of roles.
  *   **Why "Immunization"?** Because the core metric is treated as immune to refutation by the very data it is supposed to measure.

  *(Note: While "Epistemic Immunization" is used in sociology of science, the specific "Distributed" qualifier regarding bidirectional discounting of first-person reports is my own synthesis for this context.)*

  ### 3. Rigor vs. Trick: How to Distinguish Them

  You asked what distinguishes a field doing this from a field applying "two well-founded corrections." This is the critical methodological question. The distinction lies in **pre-commitment**, **symmetry**, and **revisability**.

  | Feature | **Legitimate Rigor** | **Distributed Epistemic Immunization** |
  | :--- | :--- | :--- |
  | **Pre-specification** | Criteria for discounting reports (e.g., validity scales) are defined *before* data collection. | Criteria are applied *post-hoc* when the data mismatches the expectation. |
  | **Symmetry** | The burden of proof is symmetric. If the measure deviates from reports, the measure is also scrutinized. | The burden of proof is asymmetric. The report must justify its deviation; the measure is the null hypothesis that cannot be rejected. |
  | **Revisability** | If a high percentage of reports are discounted, the measure is flagged for revision. | If a high percentage of reports are discounted, it is taken as evidence of the *prevalence* of the condition (adaptation/distress), not the measure's failure. |
  | **Mechanism** | Discounting is based on internal consistency (e.g., contradictory answers). | Discounting is based on external divergence (e.g., answer mismatches clinician assessment). |
  | **Feedback Loop** | Persistent mismatch leads to updating the measure's weighting or constructs. | Persistent mismatch leads to refining the *explanations* for why patients are wrong. |

  **The Key Test:**
  In a rigorous field, if 40% of patients report "Excellent" quality of life while the measure says "Poor," the field asks: *"Is our measure wrong?"*
  In an immunized field, the field asks: *"Why are 40% of patients deluded about their condition?"*

  ### 4. Settled vs. Contested Claims

  To ensure you can use this analysis safely in your work, here is the epistemic status of the claims above:

  **Settled (Broad Consensus):**
  *   **Unfalsifiability is a vice:** A theory that cannot be challenged by data is scientifically weak (Popper/Lakatos).
  *   **Testimonial Injustice exists:** Systemic credibility deficits harm knowledge production (Fricker).
  *   **Adaptive Preferences are real:** People do adjust expectations to oppression, *but*...
  *   **...First-person authority is prima facie valid:** In the absence of evidence of coercion or incapacity, self-reports are the default standard for subjective states (Quality of Life research consensus).

  **Contested (Active Debate):**
  *   **The Weight of Adaptation:** There is active debate in health economics and ethics about *how much* to discount self-reports due to adaptation. Some argue adaptation is a rational coping mechanism that should be respected; others argue it masks true burden. (This is where your "advocates" are operating).
  *   **Clinical Authority vs. Patient Experience:** There is ongoing tension regarding whether clinicians can accurately assess patient quality of life better than patients themselves. (This is where your "clinicians" are operating).
  *   **Objectivity of Measures:** Whether a composite score can ever truly represent a subjective state is philosophically contested (Realism vs. Constructivism in psychometrics).

  ### 5. Summary Recommendation

  If you need to name this in a paper or discussion, do not claim there is a single existing term, as that would be inaccurate. Instead, describe it as:

  > **"A form of Distributed Epistemic Immunization, where bidirectional testimonial discounting protects the construct validity of the measure from falsification by first-person reports."**

  This phrasing signals that you understand the philosophy of science (Immunization/Lakatos), the ethics of knowledge (Testimonial Discounting/Fricker), and the specific methodological risk (Construct Validity/Falsification).

  **The "Tell":**
  The clearest signal that this is a trick rather than rigor is if the **rate of discounting is not tracked.** If the field does not publish the percentage of reports dismissed as "adaptation" or "distress" alongside the final results, it is hiding the degree to which the measure is being insulated from reality. Rigor requires transparency about the data that was excluded; immunization requires only that the exclusion be justified case-by-case.
