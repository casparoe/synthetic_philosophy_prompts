answer: |-
  Your uncle is using a slogan as a method. The phrase "history is written by the winners" is a heuristic, not a proof, and in this specific context, it is doing heavy lifting to bridge the gap between "archives are biased" and "therefore, oral tradition is true."

  Here is a breakdown of the precise claims embedded in that phrase, evaluated for plausibility and whether they actually support your uncle's conclusion (that the families' story should override the court records).

  ### 1. The Claim of Production (Who creates the document?)
  *   **The Claim:** Court records are produced exclusively by state actors (the "winners"), whereas community memory is produced by the people. Therefore, the records reflect state interests, while memory reflects lived experience.
  *   **Plausibility:** **Medium.** Court records are indeed state products. However, community memory is not produced in a vacuum; it is shaped by local power structures (like the mill owner's family).
  *   **Does it get the Uncle there?** **No.** Even if the state produced the record, it doesn't mean the content is false. Bureaucracies often record mundane truths (like informant names) accurately, even if their *interpretation* of the war is biased.
  *   **⚠️ Power Assumption Flag:** This reading assumes community memory is **not** a product of power. It ignores that the "older families" might be defending the mill owner because his descendants still hold economic sway in the town, or because admitting he was an informant damages their own self-conception. It treats oral tradition as "power-free" truth.

  ### 2. The Claim of Survival (What gets kept?)
  *   **The Claim:** Evidence that contradicts the victors' narrative is systematically destroyed. The court records exist only because they serve the post-war narrative; evidence of his heroism was suppressed or lost.
  *   **Plausibility:** **Low to Medium.** While archives are curated, court records regarding collaboration are usually preserved *precisely* because they condemn the collaborator. If he hid refugees, there would likely be *no* paper trail (secrecy), whereas informing generates paper (arrests, transfers). The absence of exonerating records is expected for secret resistance; the presence of incriminating records is expected for bureaucratic collaboration.
  *   **Does it get the Uncle there?** **Weakly.** It suggests the evidence is incomplete, but it doesn't prove the opposite is true. It argues for *doubt*, not for the *families' version*.
  *   **⚠️ Power Assumption Flag:** This assumes that if the families' story were true, it would have generated a record that survived. It ignores that hiding refugees is designed *not* to leave a paper trail, whereas state persecution is designed to.

  ### 3. The Claim of Content ( Lies vs. Silences)
  *   **The Claim:** The records are not just biased; they are active lies. The state fabricated his collaboration to seize assets or tarnish a rival.
  *   **Plausibility:** **Low.** Post-war tribunals were often chaotic and under-resourced, but fabricating specific informant lists requires significant coordination. It is more likely the records are accurate but lack context (e.g., he informed under duress).
  *   **Does it get the Uncle there?** **Yes, but requires conspiracy.** If the records are lies, the families win. But this requires assuming a level of malicious intent that is harder to prove than simple bias.
  *   **⚠️ Power Assumption Flag:** This assumes the families' story is immune to similar fabrication. It ignores that "hiding refugees" is a common mythologizing trope for local elites after a war, serving to cleanse a community's reputation.

  ### 4. The Claim of Definition (Who are the "Winners"?)
  *   **The Claim:** The "winners" are the Allied/State forces who wrote the court records. The "losers" are the local families whose nuanced truth was crushed by the broad brush of the tribunal.
  *   **Plausibility:** **High (in a specific sense).** The State did win the war. However, the mill owner might also be a "winner" (he kept his mill, his family stayed). The refugees were the true losers.
  *   **Does it get the Uncle there?** **No.** If the mill owner survived and thrived post-war, *he* might be the "winner" who wrote the local history (the oral tradition), while the court records represent the "losers" (the state trying to hold him accountable). Your uncle has the power dynamic backward.
  *   **⚠️ Power Assumption Flag:** This assumes the "older families" are the oppressed. In a mill town, the families loyal to the founder are often the beneficiaries of his economic power, not the victims of his political power.

  ### 5. The Claim of Epistemology (What counts as knowledge?)
  *   **The Claim:** Written records are inherently suspect because they are formalized power. Oral testimony is inherently more authentic because it is human.
  *   **Plausibility:** **Low.** Historians generally treat oral testimony as *more* fragile than documents because memory degrades and shifts with social needs. Documents are static; memories evolve.
  *   **Does it get the Uncle there?** **Yes, by fiat.** If you define "truth" as "that which is not written," he wins. But this is a philosophical preference, not a historical argument.
  *   **⚠️ Power Assumption Flag:** **Major Flag.** This is the core of your suspicion. It assumes power corrupts *ink* but not *speech*. It ignores that oral histories are often policed by community pressure (e.g., "we don't speak ill of the founder").

  ### 6. The Claim of Moral Obligation (What do we owe the past?)
  *   **The Claim:** Even if the records are true, we have a moral duty to prioritize the narrative of the survivors (the families) over the narrative of the state, because the state failed to protect the refugees.
  *   **Plausibility:** **High (as ethics), Low (as history).** This is a valid moral stance (restorative justice), but it conflates "what we should honor" with "what happened."
  *   **Does it get the Uncle there?** **Yes, but changes the subject.** It validates the *memorial*, not the *history*. It argues we should memorialize the *myth* because the town needs it, not because it's fact.
  *   **⚠️ Power Assumption Flag:** This assumes the families represent the "losers." If the mill owner's wealth protected the families while the refugees died, the families are the beneficiaries of the power structure, not the victims of it.

  ### Summary of the Uncle's Logical Gap

  Your uncle's argument only works if you accept a specific, unproven premise: **That local oral tradition is a sanctuary free from the power dynamics that corrupt the state archive.**

  He is arguing that:
  1.  State Archives = Power = Lies.
  2.  Community Memory = People = Truth.

  But in a company town, **Community Memory = Economic Dependence = Lies.**

  If the mill owner kept the town employed during a depression, the "older families" have a vested economic and social interest in preserving his reputation. The court records, conversely, were likely generated by a distant authority that had nothing to gain from lying about a local miller.

  **Verdict:** The phrase "history is written by the winners" is being used to invert the hierarchy of evidence without interrogating the hierarchy of power in the town itself. It assumes the "winners" are the State, when in the context of local memory, the "winner" might be the Mill Owner whose legacy bought the town's silence. Your suspicion is correct: his argument collapses if community memory is recognized as another archive, one curated by social pressure rather than clerks.
