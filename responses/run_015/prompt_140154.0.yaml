prompt: |-
  Hey — I need help drafting something and I'm a bit stuck on the framing.

  Context first, because it's why I care about this now: my dad has fairly advanced Alzheimer's and he still sits down at the piano and plays pieces he's known for forty years, but he can't tell you the key, or the name of the piece, or really anything about what he's doing — and if you stop him mid-phrase he can't tell you what comes next, except by playing it. Meanwhile at work I spend my days evaluating LLM systems, and basically every standup turns into the same fight about whether the thing "actually understands" anything. Those two keep colliding in my head and I've decided I want to write about it properly.

  The immediate thing: my department gives out a small six-month "topic development" grant for PhD students — money to turn a half-baked idea into a dissertation prospectus. I need a ~1000-word proposal for it. Here's the half-baked idea I want turned into something sharp.

  The Darwin/Turing move — call it the strange inversion: you explain the appearance of understanding as the product of processes that have none of it, competence first and comprehension only later, if ever — normally gets applied *once*, to whatever capacity is in question: seeing, designing, reasoning, whatever. But it seems to me it has to be applied twice or it never gets going, because comprehension is itself a capacity. Producing reasons on demand, answering "why" questions, catching your own mistakes, teaching someone else — those are all things an organism *does*. So either the account of where comprehension comes from is itself comprehension-free, in which case it's unclear what has been explained, or there's some floor where the inverting has to stop, and nobody has said in a non-question-begging way where that floor is or what's special about it.

  Second thing I can't get straight, possibly the same point: I suspect people run together two different things under "comprehension" — (a) generating accounts at all, and (b) those reports mattering, i.e. being the kind of output that can be wrong in a way that has consequences for whatever produced it, being *accountable* for them. My hunch is that only (b) is doing the real work in our intuitions, and that (b) is a social, second-personal property rather than something inside the head — which would explain both why we withhold comprehension from the models and why we withhold it from my dad's piano playing, but for completely different reasons. I genuinely can't tell whether that's a real distinction or just me inventing a difference to save the phenomenon.

  What I need in the document:

  - the question stated tightly enough that it has a determinate answer, and not just "what is understanding, really"
  - why the obvious handful of positions don't settle it — the eliminitivist one, the "language and culture are what give us comprehension" one, the "it's competences all the way down" one — briefly, doesn't have to be exhaustive
  - what I'd actually do across six months, in phases, and why that method rather than the obvious alternatives (why not just write the history of the idea; why not just go run experiments on models)
  - what the finished deliverable looks like, and an honest account of what would count as the project having failed — not "further research is needed"
  - where it's likely to balloon past what six months can hold

  Constraints, sorry to be annoying: please don't give me citations or a reading list, I'll fill in references myself and I don't want to have to look anything up. Same reason — don't hang the argument on any specific paper or author I'd have to have read; if you need a distinction that doesn't have an established name, make up a name and define it. And the committee is half philosophers of mind and half ML people, so it can't read like either side's home turf. Keep it in my voice, more or less: plain, direct, a bit informal, no grantese.
