      *   $P(B) + P(Y) = 60/90 = 2/3$ (Known sum, unknown individual values).
      *   **Round 1:**
          *   Bet on Red: Expected Utility $\propto P(R)$.
          *   Bet on Black: Expected Utility $\propto P(B)$.
