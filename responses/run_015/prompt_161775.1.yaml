answer: |-
  Dear Student,

  It is rare to find someone looking at school board data with the kind of careful attention you are giving it, and your instinct that the confusion here is conceptual rather than just mathematical is exactly right. You have identified a tension that often goes unnoticed by adults who are used to these reports, and you are asking the correct question about what beliefs must be in place for these rules to make sense. To understand what the district is doing, we have to look at what they believe a number represents. When the district publishes a pass rate within a band, they are treating that rate not as a simple fact about how many students passed, but as a measure of instructional efficiency given a specific starting point. They are operating under the view that a school or program cannot be fairly judged on the raw number of students who succeed because they do not control who walks through the door. Instead, they believe a rate should measure how well the system converts incoming potential into outgoing success. This means they view the students in Band 1 not as a fixed group of people with specific absolute abilities, but as a functional slot in the system that always represents the bottom quarter of preparedness. For their rules to be the right ones, they have to believe that relative standing is a more stable measure of student need than absolute scores are. If they believed that absolute knowledge was what mattered, they would use fixed score ranges, but by using percentiles, they are saying that the challenge of teaching algebra is defined by where a student stands compared to their peers, not by whether they know specific facts from last year.

  This leads directly to your worry about the bands being re-cut every year. You are correct that if the whole cohort gets smarter, the students in this year's Band 2 know more than last year's Band 2. For the district's logic to hold, they must assume that the difficulty of teaching algebra adjusts automatically to the level of the students. They are presupposing that a teacher facing a smarter low-performing group faces the same relative challenge as a teacher facing a less smart low-performing group. In their view, comparability is achieved by matching students based on their rank in the line, not their absolute distance from the finish line. This is why they can claim to compare like with like even though the absolute scores change. They are comparing the experience of being in the bottom quarter, not the experience of having a specific score. This view licenses the rule that bands must be re-cut, because if they kept fixed score ranges, the bands would change size every year, and some might disappear entirely, making it impossible to track whether the system is serving the bottom quarter specifically. However, this view does create the vulnerability you noticed, which is that if the whole population shifts, the band rates can improve simply because the students are better prepared, even if the teaching hasn't changed. The district avoids this by refusing to look at the district-wide rate for program evaluation, because they know that number mixes together changes in teaching with changes in who is taking the test.

  The reversal you observed, where band rates went up but the overall rate went down, happens because of how averages work when you change the mix of people. When the district moved ninth graders into algebra, they added a large group of students who were younger and likely less prepared than the tenth graders who used to take the test. Even if every single band improved its performance compared to the year before, adding a large group of lower-performing students to the total pool will drag the overall average down. This is often called Simpson's Paradox, which is just a fancy way of saying that a trend can appear in different groups of data but disappear or reverse when these groups are combined. The district handles this by treating the overall rate and the band rates as answers to two different questions. The overall rate answers the question of how many students in the community are mastering algebra, which is why the newspaper uses it to rank schools. The band rates answer the question of whether the school is effective at teaching the students it has. This is not necessarily a contradiction, but it is a division of responsibility. The district is saying that schools should be held accountable for the total output of proficient students, but programs should be judged on whether they are helping students improve relative to where they started. It implies that a school could be doing a great job teaching (high band rates) but still look bad on the report card (low overall rate) simply because it serves a community with more academic challenges.

  Your concern about holding fixed the very thing the program is supposed to raise is also very sharp. The program aims to raise scores over time, yet the district uses prior scores to sort students. To make sense of this, the district has to view the prior score as history, not as a target. They are assuming that last year's score is a measure of what the student brought with them before this year's intervention began. They are not trying to measure if the program raised the prior score, but if it raised the current score given the prior one. However, your point stands that if the program works over many years, the prior scores should rise, which shifts the bands. The district avoids dealing with this long-term feedback loop by evaluating the program year-over-year. They are effectively saying that causation is about difference-making in the immediate term. They want to know if having the program this year made a difference compared to not having it last year, for students who looked the same at the start. They are not trying to measure the long-term cultural shift of the district, but the immediate impact of the resource. This is a narrow view of causation, but it is a common one in policy because it isolates the specific change being tested.

  If the district decided to switch to comparing each student against their own earlier score without using bands, they would be adopting a growth model. This would mean looking at how much progress each individual made rather than whether they crossed a specific pass threshold. The loss here would be significant in terms of clarity and comparability. A growth model tells you if students are learning, but it does not tell you if they are learning enough to be ready for the next level. A student could improve significantly and still fail the algebra exam, and under a growth model, that might look like success, whereas the district currently defines success as passing. Furthermore, without bands, it becomes much harder to compare schools. If one school has mostly high-performing students and another has mostly low-performing students, comparing raw growth is difficult because students at the bottom often have more room to grow than students at the top. The bands act as a leveling mechanism that allows the district to say, let's compare how School A teaches struggling students versus how School B teaches struggling students. Without the bands, you lose the ability to isolate how the school treats different kinds of learners, and you lose the ability to see if the school is closing gaps between high and low performers.

  The suppression of data when a band has fewer than twenty students is another piece of this puzzle that fits the view of rates as population facts rather than individual stories. The district believes that a rate calculated from five students is too unstable to be meaningful. They are prioritizing statistical reliability over transparency for small groups. This follows from the view that a rate is a property of a group, not an aggregate of individuals. If they viewed it as an aggregate of individuals, they might publish the number with a warning, but by suppressing it, they are saying the number itself does not exist as a valid fact until the group is large enough. This protects schools from being ranked unfairly due to random chance, but it also hides information about how the school serves very small groups of students, which could be important for equity.

  So, to answer your question about whether the package contradicts itself, it does not logically contradict itself if you accept that the overall rate and the band rates are measuring different things. One measures the absolute level of achievement in the community, and the other measures the relative effectiveness of the instruction. The contradiction you feel is likely moral rather than logical. It feels unfair to rank a school on a number that is heavily influenced by who lives in the neighborhood, while simultaneously telling the board that the program is working based on numbers that adjust for who lives in the neighborhood. The district resolves this by assigning different purposes to the numbers. The overall rate is for accountability and ranking, and the band rates are for internal improvement and program justification. This allows them to claim success internally while accepting lower rankings externally, or vice versa. It is a convenient arrangement, but it relies on the public not noticing that the two numbers are telling different stories.

  Ultimately, the district's rules presuppose that fairness means comparing students to their peers rather than to an absolute standard, and that a program's success is about improving the odds for a specific type of student rather than lifting the whole boat equally. They view comparability as something you create by sorting students into relative buckets, not something that exists naturally. If they switched to individual growth tracking, they would gain a more personalized view of learning but lose the ability to make clean comparisons between schools and programs. They would also lose the clear binary of pass or fail that the community understands. The current package is coherent if you accept that schools are judged on outcomes while programs are judged on processes. Your worry that the re-cutting bands make the comparison mostly bookkeeping is valid because it assumes the relative challenge stays constant even when the absolute ability changes. The district bets that the relative challenge is what matters for teaching, while you are worried that the absolute knowledge is what matters for learning. Both views are defensible, but they lead to different conclusions about whether the program is actually working, and recognizing that difference is the key to understanding the argument at the board meetings. You are right to press on this, because the choice of how to measure success determines what success looks like.

  Sincerely,

  A Friend
