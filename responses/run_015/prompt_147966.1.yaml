answer: |-
  # JOINT STATEMENT ON MORAL RESPONSIBILITY AND REACTIVE ATTITUDES

  **Prepared for the Graduate Reading Group on Moral Responsibility**
  **Signatories:** [Member A] (Compatibilist/Strawsonian), [Member B] (Incompatibilist/Sourcehood)

  ## I. Agreed Claims

  We, the undersigned, having reviewed the arguments surrounding P.F. Strawson's *Freedom and Resentment* and subsequent incompatibilist replies, affirm the following points of agreement as the basis for our continuing debate:

  1.  **The Reality of Reactive Attitudes:** We agree that reactive attitudes (resentment, gratitude, moral indignation, guilt, forgiveness) are real psychological phenomena. They are not merely theoretical constructs but are experienced as involuntary, emotionally laden responses to the perceived intentions and regard of other agents.
  2.  **The Social Function:** We agree that these attitudes play a non-optional, constitutive role in ordinary interpersonal relationships. To abandon them universally would be to retreat from meaningful human engagement into an "objective stance" that treats persons as objects to be managed rather than agents to be engaged.
  3.  **The Participant and Objective Stances:** We accept Strawson's description that we naturally move between the participant stance (engaging via reactive attitudes) and the objective stance (engaging via causal explanation and management). We agree this shift occurs in particular cases (e.g., when an agent is identified as a child, mentally ill, or under duress).
  4.  **The Operation of Excuses:** We agree that standard excuses (ignorance, coercion, accident) operate by modifying the quality of will attributed to the agent. When an agent demonstrates good will or a lack of ill will, the fittingness of resentment is naturally undermined, regardless of the metaphysical status of determinism.
  5.  **Agnosticism on Determinism:** Neither of us takes the truth of causal determinism to be established fact for the purposes of this debate. Our disagreement concerns the *conditional*: *If* determinism is true, does it undermine moral responsibility?
  6.  **Requirements for a Satisfactory Account:** We agree that a satisfactory account of moral responsibility must do two things: (a) respect the phenomenology of our actual moral practices, and (b) provide a normative justification for those practices that does not rely solely on their utility. We disagree on whether our current practices meet condition (b).

  ## II. Residual Disagreements

  The following table outlines the specific points on which we remain divided. We have formulated these to avoid loaded terminology where possible.

  | Issue | Neutral Formulation | Her Formulation (Strawsonian) | His Formulation (Incompatibilist) |
  | :--- | :--- | :--- | :--- |
  | **1. The Ground of Responsibility** | What property makes an agent a proper target of moral blame? | The agent's conduct manifests a quality of will that makes reactive attitudes fitting within a relationship. | The agent must be the ultimate source of the conduct in a way that excludes determination by prior causes. |
  | **2. The Status of Desert** | Is "desert" a precondition for blame or a feature of the blame practice? | Desert is internal to the practice; to be a fitting target of blame *is* to deserve it in the only sense that matters. | Desert is a metaphysical precondition; without ultimate sourcehood, blame is merely useful, not deserved. |
  | **3. The Impact of Determinism** | Does the truth of determinism render moral responsibility impossible? | No. Determinism does not negate the quality of will or the possibility of relationships. | Yes. Determinism negates the control required for ultimate sourcehood and thus true desert. |

  ## III. The Cruxes

  To move forward, we identify three sub-questions where settling the facts or the interpretation would shift our positions. For each, we specify a test case, our respective predictions, and the cost to our view if we are wrong.

  ### Crux 1: The Desert Question
  **Sub-Question:** Does the "fittingness" of reactive attitudes carry normative weight beyond social coherence? Is there a substantive difference between "it is useful to blame" and "the agent deserves blame"?

  **Analysis of Verbal vs. Substantive Disagreement:**
  We acknowledge that part of this disagreement is **verbal**. If "desert" is defined as "fittingness within a form of life," we agree. If "desert" is defined as "metaphysical liability independent of social utility," we disagree.
  However, part is **substantive**. The substantive question is whether the practice of blaming requires an external justification (sourcehood) to be morally permissible, or whether the internal norms of the practice (quality of will) are sufficient.

  **Test Case: The Standard Blame Scenario**
  *An agent knowingly harms a friend for personal gain, with no coercion or ignorance.*
  *   **Her Prediction:** Blame is morally permissible and fitting because the quality of will is poor. Determinism is irrelevant.
  *   **His Prediction:** Blame is psychologically inevitable but morally unjustified if determinism is true, because the agent is not the ultimate source.
  *   **Cost to Her View:** If it is shown that "fittingness" without "ultimate sourcehood" reduces blame to mere social therapy, her view fails to capture the retributive intuition that blame *ought* to be suffered.
  *   **Cost to His View:** If it is shown that "ultimate sourcehood" is incoherent or impossible, his view implies that moral responsibility is an illusion, forcing us to abandon the participant stance entirely.

  ### Crux 2: Manipulation and Empirical Predictions
  **Sub-Question:** Is moral responsibility compatible with external determination of the will (manipulation), and is the participant stance empirically necessary for moral agency?

  **Test Case A: The Calibration Study (Manipulation)**
  *A device is implanted in an agent without her knowledge, tuned so her deliberations track moral reasons better than before. She notices nothing, deliberates as usual, and acts well.*
  *   **Her Prediction:** She is responsible. Her quality of will is good, and the causal history (the implant) does not negate her reasons-responsiveness.
  *   **His Prediction:** She is not responsible. The ultimate source of her action is the device designer, not her.
  *   **Cost to Her View:** If we intuitively feel the agent is a "puppet" despite her good behavior, her account fails to distinguish between genuine agency and sophisticated programming.
  *   **Cost to His View:** If we intuitively feel she *is* praiseworthy, his requirement for "ultimate sourcehood" excludes agents we clearly want to include in the moral community.

  **Test Case B: The Vale Study (Modified)**
  *[Note: The original Vale case posits adults indistinguishable in behavior but lacking all guilt/resentment. We agree this description is empirically unstable, as moral sentiment is likely constitutive of moral reasoning. We substitute the **"Dampened Community"** case: A cohort raised with significantly attenuated reactive attitudes (low guilt, low resentment) but trained in high-level moral reasoning and repair protocols.]*
  *   **Her Prediction:** These adults would struggle to maintain deep interpersonal relationships. Under stress or genuine wrong, the lack of reactive attitudes would lead to relationship breakdown or a shift to the objective stance, confirming Strawson's claim that the participant stance is natural and necessary.
  *   **His Prediction:** These adults could function as moral agents (recognizing reasons, repairing harm) without responsibility in the Strawsonian sense. This shows that moral *obligation* can exist without reactive *responsibility*.
  *   **Cost to Her View:** If the Dampened Community functions perfectly well with deep relationships, Strawson's claim that reactive attitudes are constitutive of relationships is empirically false.
  *   **Cost to His View:** If the Dampened Community reports feeling "less than fully human" or socially isolated, it suggests the reactive attitudes are not optional add-ons but requirements for full agency.

  ### Crux 3: Scope and Universality
  **Sub-Question:** Does a theory of responsibility need to account for "hard cases" (psychopathy, severe deprivation) to be valid for ordinary cases?

  **Test Case: The Psychopath**
  *An agent lacks the capacity for empathy and reactive attitudes but understands moral rules intellectually.*
  *   **Her Prediction:** This agent is exempt from responsibility not because of metaphysics, but because they cannot participate in the moral community. Responsibility is relative to *our* form of life.
  *   **His Prediction:** This agent is exempt because they lack a specific metaphysical capacity (rational control or sourcehood). Responsibility is universal; if they lack it, it is due to a deficit in the agent, not the community.
  *   **Cost to Her View:** If responsibility is merely "ours," it risks becoming tribal. We need to explain why the psychopath is exempt in a way that doesn't just mean "we don't like them."
  *   **Cost to His View:** If the psychopath has the same metaphysical sourcehood as a normal agent but is still exempt, then sourcehood is not sufficient for responsibility, undermining his core criterion.

  ***

  ## Closing Note: Evaluator's Assessment

  **Confidence in Agreed Claims:**
  I am highly confident in Claims 1, 3, and 5 (Reality of Attitudes, Stances, Agnosticism). These are well-supported by both the text and common experience. I am moderately confident in Claim 6 (Requirements for Account), as "Member B" might argue that utility is the *only* justification available if desert fails, though he prefers to think desert is possible.

  **Least Sure Formulation:**
  I am least sure of the **Modified Vale Study (Test Case B)** in Crux 2.
  **Reason:** The original prompt's Vale case (adults indistinguishable in behavior but lacking guilt) is arguably rigged. It assumes a functionalist separation of moral reasoning and moral sentiment that cognitive science suggests may not exist. Guilt functions as a learning signal; removing it likely *would* change statistical outcomes in rule-following over time.
  **What Would Settle It:** Longitudinal empirical data on individuals with specific affective deficits (e.g., secondary psychopathy or acquired sociopathy) who retain high cognitive function. If such individuals can maintain reciprocal relationships without guilt/resentment, the Strawsonian claim that these attitudes are *constitutive* of relationships is weakened. If they inevitably fail at intimacy, Strawson is vindicated on empirical grounds.

  **Note on Case Substitution:**
  In Crux 2, I substituted the "Dampened Community" for the original "Vale Study." The original case asked for adults who are "statistically indistinguishable" yet lack guilt. I judge this to be underdescribed and likely incoherent; guilt is a mechanism for moral regulation. A cohort lacking it would likely diverge statistically in high-stress scenarios. The "Dampened Community" refinement preserves the philosophical test (can morality exist without these feelings?) without relying on an empirically impossible premise. Both signatories should accept this refinement as it sharpens the test of Strawson's naturalism.
