          *   *Coercion vs. Participation:* C is arguing for a policy that *helps* tenants (burden on town budget/taxpayers potentially, but framed as aid). E is refusing a civil service (denying access to a state function).
          *   *Imposition:* C asks the town to *do* something charitable/just. E asks the town (via the clerk) to *restrict* liberty/access based on a doctrine not all share.
          *   *Translation:* C's Jubilee argument translates easily to "economic justice/release from debt" which is secularly intelligible even if the source is religious. E's "nature of marriage" argument, when stripped of the religious/metaphysical baggage, often collapses into "tradition" or "procreation," which the user notes has secular backup but the Clerk isn't using it; she's using a status-based exclusion.
