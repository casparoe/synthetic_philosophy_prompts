      *   *Accessibility:* The user's friend suggested "could in principle check" vs. "actually accept."
      *   *The "Official Statement" vs. "Public Comment":* The user writes the *official statement of reasons*. This is distinct from what citizens say at the mic. The official statement must justify state coercion to all citizens. Public comment is free speech.
      *   *The User's Role:* When *he* votes (Case J), can he rely on Gospel? Yes. When he *writes the warrant* (official justification), must he translate? Yes.

  3.  **Develop the Principle:**
      *   The key distinction isn't just "religious vs. secular." It's about *coercion* and *role*.
      *   For *citizens* speaking (Public Comment): Religious reasons are admissible if they translate into public goods or burdens on self. (C is admissible).
      *   For *officials* acting/writing (Official Statement/Clerk duties): Religious reasons are inadmissible if they restrict rights/access without secular justification accessible to those who don't share the faith. (E is inadmissible).
