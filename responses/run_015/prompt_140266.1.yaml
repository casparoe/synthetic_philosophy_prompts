answer: |-
  This is a sharp observation that cuts to the heart of a tension often glossed over in introductory treatments of Kripkean origin essentialism. You have identified a divergence between how we apply identity criteria in **modal contexts** (counterfactuals) versus **epistemic contexts** (discoveries about the actual past).

  ### 1. Does it have a name?

  There is no single, canonical term in the literature that specifically labels this *pattern of intuition* as a distinct phenomenon.

  It is usually discussed under the umbrella of **The Necessary A Posteriori** (Kripke) or **Two-Dimensional Semantics** (Stalnaker, Chalmers). These frameworks explain the *logic* of why the statements don't contradict (one is a claim about metaphysical necessity, the other about epistemic contingency), but they do not fully capture the *phenomenological asymmetry* you are describing: namely, that we feel permitted to "override" origin essentialism when updating our self-conception in the actual world, even while insisting on it when imagining other worlds.

  Some philosophers refer to this specific tension as **The Adoption Objection to Origin Essentialism** or **The Switched-at-Birth Puzzle**, but these names refer to the *counter-example* itself, not the *asymmetry in intuition* you have isolated.

  ### 2. How it should be carved up

  To understand why existing accounts feel insufficient, we need to distinguish between two different roles the concept "person" (or "I") is playing in your two cases.

  **A. The Metaphysical Role (Transworld Identity)**
  When you ask, "Could I have been born to different parents?", you are using "I" as a **Rigid Designator**. You are pointing to the specific entity you are in the actual world and asking if *that very entity* could exist in another world with different properties. Origin essentialism says: No. The origin is constitutive of the entity's *haecceity* (this-ness). If the origin changes, the entity changes.
  *   *Criteria:* Causal/Genetic Origin.
  *   *Function:* Fixing the referent across possible worlds.

  **B. The Epistemic Role (Intraworld Re-identification)**
  When you ask, "Was I born to different parents?", you are using "I" as a **Descriptive Anchor** tied to your current conscious experience and bodily continuity. You are not trying to track yourself across worlds; you are trying to locate your current self within the causal history of *this* world. Here, psychological continuity and bodily persistence trump origin. If you discover you were adopted, you do not conclude "I do not exist"; you conclude "My history is different than I thought."
  *   *Criteria:* Psychological/Bodily Continuity.
  *   *Function:* Fixing the referent across time and states of knowledge.

  **The Asymmetry:** We treat origins as **constitutive** in the metaphysical role (you can't be *you* without them) but **contingent facts** in the epistemic role (you can be *you* and discover you had different ones).

  ### 3. A Proposed Term and Definition

  Since no established term captures this specific divergence in *criteria application*, I propose calling this:

  **The Modal-Epistemic Origin Asymmetry**

  **Definition:**
  The *Modal-Epistemic Origin Asymmetry* is the phenomenon wherein the criteria for personal identity shift depending on whether the question concerns **metaphysical possibility** or **epistemic actuality**.
  *   **In Modal Contexts:** Identity is treated as **Origin-Essentialist**. (A person cannot be the same person with different origins).
  *   **In Epistemic Contexts:** Identity is treated as **Continuity-Based**. (A person remains the same person even if their origins are discovered to be different than previously believed).

  **Boundary Cases:**
  To test if a case falls under this asymmetry, ask: *Does changing the origin information force us to say the person no longer exists, or merely that they were mistaken?*
  1.  **Standard Adoption:** Asymmetry holds. (Modal: Couldn't be adopted. Epistemic: Can discover adoption.)
  2.  **Teletransportation:** Asymmetry *fails* or reverses. Many say "I" could survive teletransportation (Modal), but if I found out I was teleported without consent, I might feel "I" am dead and a copy exists (Epistemic). This is the inverse of the Origin Asymmetry.
  3.  **Severe Amnesia:** Asymmetry holds. (Modal: Could I have amnesia? Yes. Epistemic: Do I cease to exist if I get amnesia? No.) This suggests the asymmetry is specifically about *origins*, not all properties.
  4.  **Chimerism:** (A person has two sets of DNA). Asymmetry strains. Which origin is essential? This is a boundary case where the "Origin" criterion becomes indeterminate in the Modal context.

  ### 4. Is the Asymmetry Real or Rhetorical?

  You asked what kind of finding would show the asymmetry is real rather than an artifact of phrasing. The standard philosophical defense (Kripke/Two-Dimensionalism) argues it is **semantic**, not metaphysical. They claim the truth conditions *don't* shift; rather, the *proposition* expressed shifts.
  *   "Could I have..." expresses: $\diamond (Origin(Me_{actual}) \neq ActualOrigin)$ -> False.
  *   "Did I have..." expresses: $ActualOrigin(Me_{actual}) = X$ -> Contingently True/False.

  To prove the **Modal-Epistemic Origin Asymmetry** is a real psychological/metaphysical feature (and not just semantic bookkeeping), you would look for the following:

  **A. The "Responsibility" Test**
  If the asymmetry is merely rhetorical, our moral intuitions should align with the metaphysics.
  *   *Finding:* If people feel *less* responsible for the actions of their biological parents upon discovering adoption (despite psychological continuity remaining), it suggests the "Origin" criterion is bleeding into the Epistemic role.
  *   *Finding:* If people feel *equally* responsible, it confirms the Epistemic role relies on Continuity, validating the Asymmetry. (Current evidence suggests the latter: we don't absolve adoptees of family history, nor do we blame them for biological parents' crimes more than adoptive parents'.)

  **B. The "Existential Dread" Metric**
  *   *Finding:* If the asymmetry is real, discovering a different origin should not trigger an existential crisis equivalent to "I am dead."
  *   *Finding:* If the asymmetry is an artifact, discovering a different origin *should* logically imply "I am not the person I thought I was," which should feel like a death of the self. Most people report confusion or betrayal, but not *non-existence*. This supports the Asymmetry as a real feature of how we conceptualize selves.

  **C. Cross-Cultural Variation**
  *   *Finding:* If the asymmetry is a universal feature of human cognition, it should appear in cultures without Kripkean philosophical training.
  *   *Finding:* If it varies (e.g., cultures with strong reincarnation beliefs might treat origin as fully contingent in *both* modal and epistemic cases), then the asymmetry is a cultural artifact of Western "biological essentialism."

  ### Summary
  You have identified a gap between **Constitutive Essentialism** (what makes a person *that* person) and **Identificatory Practice** (how we find out who a person is). While **Two-Dimensional Semantics** provides the logical machinery to prevent contradiction, it does not name the intuitive pattern.

  I recommend using **The Modal-Epistemic Origin Asymmetry**. It carves the problem by distinguishing the *context of evaluation* (possible worlds vs. actual world knowledge) and predicts that boundary cases will arise wherever psychological continuity and biological origin come into direct conflict in the actual world (e.g., brain transplants, chimeras). The asymmetry is "real" if empirical investigation shows that people consistently maintain self-identity through origin-updates while denying it through origin-counterfactuals.
