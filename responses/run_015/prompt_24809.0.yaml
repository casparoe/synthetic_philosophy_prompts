      *   *Sentence 5:* "...a society in which the workers do not share in the wealth their labor creates is simply unfair, and no amount of formal freedom can remedy that."
          *   *Analysis:* He did think wage labor was temporary. He did think economic independence was needed for real liberty. But "simply unfair" sounds deontological.
          *   *Verdict:* (b) Defensible simplification of his sentiment, but wrong on the philosophical grounding.

      *   *Sentence 6:* "The individualist liberalism of *On Liberty* was, in effect, a position he had outgrown once he recognized that production is a social process and that the worker's claim on the product of his labor is a matter of right rather than of policy."
          *   *Analysis:* "Outgrown" is the biggest error. "Matter of right rather than of policy" is anti-utilitarian. Mill never abandoned policy/utilitarianism for natural rights.
