      *   *Utilitarian vs. Rights:* Mill is a utilitarian. He talks about "justice" in *Utilitarianism* as a subset of utility (security). He does not believe in natural rights to the product of labor. The summary claims he moved to "right rather than policy." This is a fundamental misreading.
