  # JOINT STATEMENT ON MORAL CHOICE IN RESCUE DILEMMAS
  **Subject:** Adversarial Collaboration on the "Numbers Problem" and Probabilistic Rescue
  **Parties:** Advocate A (Non-Aggregative/Individualist View) & Advocate B (Aggregative/Numbers View)
  **Date:** October 26, 2023

  ## PART I: AGREED CLAIMS

  Following sustained dialogue, the undersigned advocates affirm the following premises as the shared foundation for our disagreement. These claims define the boundary conditions of the rescue dilemmas under discussion.

  1.  **Scarcity and Disjointness:** The scenarios involve genuine resource scarcity. It is physically impossible to save all individuals at risk. The groups at risk are disjoint; no individual belongs to both groups simultaneously.
  2.  **Impartiality:** The rescuer bears no special personal relationship (e.g., kinship, friendship, contractual duty) to any individual in either group. Selection cannot be based on identity, social status, past merit, or future potential utility beyond the immediate rescue.
  3.  **Comparable Threat:** Every individual at risk faces the same type and magnitude of harm (specifically, loss of life or equivalent catastrophic injury) if not rescued. There is no variance in the severity of the outcome for the individuals involved.
  4.  **Agency and Causation:** The rescuer is a moral agent whose voluntary choice directly determines which rescue intervention is attempted. The harm befalling the unsaved group is a foreseeable consequence of the choice to attempt saving the other group, given the scarcity constraint.
  5.  **Individual Moral Status:** Each individual possesses equal intrinsic moral worth. No individual is morally subordinate to another. Any justification for a rescue choice must be acceptable in principle to each person affected, acknowledging their status as separate persons.
  6.  **The Probabilistic Variant:** We acknowledge a specific subclass of cases where saving a group is not deterministic. In these "Independent Risky Actions," committing to a group entails attempting a rescue procedure that has a specific probability of failure ($0 < P < 1$). Choosing to attempt rescue for Group A precludes attempting rescue for Group B, regardless of the success probability of the attempt on A.

  ## PART II: DISAGREEMENTS TABLE

  The following table isolates the precise points of divergence. The wording is negotiated to ensure neither party feels their position is mischaracterized or straw-manned.

  | Domain of Disagreement | Advocate A (Non-Aggregative) Position | Advocate B (Aggregative) Position |
  | :--- | :--- | :--- |
  | **1. Aggregation of Welfare** | Moral reasons do not aggregate across persons. The loss of a group is not a single "super-loss" but a set of distinct individual losses. One cannot sum individual claims to outweigh another individual's claim. | Moral reasons aggregate across persons. The total amount of welfare preserved (or harm prevented) is a morally relevant metric. Preventing five losses is objectively more valuable than preventing one. |
  | **2. Equality of Concern** | Equal concern requires giving each *individual* an equal chance of being rescued. In a choice between groups, this often implies randomizing (e.g., a coin toss) rather than privileging the larger set. | Equal concern requires weighing each *individual's interest* equally in the decision calculus. Counting each person's interest equally necessarily leads to prioritizing the outcome that satisfies the most interests. |
  | **3. Distribution of Risk** | In the Probabilistic Variant, the primary obligation is to maximize the *individual's* probability of survival, not the *expected number* of survivors. A certain rescue of one may outweigh a risky rescue of many. | In the Probabilistic Variant, the obligation is to maximize *expected value* (Number of Lives $\times$ Probability of Success). Risk is distributed across the population to minimize total expected loss. |
  | **4. Justification to the Lost** | A person left to die cannot be told they were sacrificed for the greater good, as they do not share in that good. They can only be told that a fair procedure gave them a chance. | A person left to die can be told that the decision minimized overall harm. The moral necessity of preventing greater tragedy justifies the failure to save the fewer. |

  ## PART III: IDENTIFICATION OF CRUCES

  We have identified two fundamental cruxes. Resolution of either would significantly shift the consensus or validate one framework over the other. For each crux, we apply the **Independent Risky Action Variant** (defined in Claim 6) to test the divergence.

  ### Crux 1: The Metaphysics of Group Loss
  **Sub-Question:** Does the death of multiple people constitute a single collective harm that is qualitatively "worse" than the death of one, or is it merely a quantitative collection of identical individual harms?

  *   **Concrete Case/Reasoning:** Both sides accept the "Standard Deterministic Case" (Save 1 w/ 100% certainty vs. Save 5 w/ 100% certainty).
      *   *Advocate A Reasoning:* The five do not share a nervous system or a life. There is no entity "the five" that suffers. There are only five individuals who suffer. The one individual suffers just as much as any single one of the five.
      *   *Advocate B Reasoning:* While there is no "super-person," the world is worse if five die than if one dies. Morality requires us to make the world less bad, not just to attend to dyadic relationships.
  *   **Application of Probabilistic Variant:**
      *   *Scenario:* Group A (1 person) can be saved with 100% probability. Group B (5 people) can be saved with 40% probability. You can attempt only one rescue.
      *   *Advocate A Prediction:* The rescuer should attempt to save **Group A**. The single individual has a right to a high probability of survival. Subjecting the five to a 60% chance of death is permissible, but guaranteeing the death of the one to chase a probabilistic gain for the five treats the one as a mere means.
      *   *Advocate B Prediction:* The rescuer should attempt to save **Group B**. Expected lives saved for A = $1 \times 1.0 = 1.0$. Expected lives saved for B = $5 \times 0.4 = 2.0$. Minimizing expected loss dictates attempting the rescue of Group B.

  ### Crux 2: The Interpretation of Fairness in Risk
  **Sub-Question:** Does "fairness" require equalizing the *ex-ante probability of being saved* for each individual, or does it require maximizing the *objective value* of the rescue attempt?

  *   **Concrete Case/Reasoning:** Both sides accept that if you cannot save everyone, leaving the choice to chance (a coin toss) is a recognized method for resolving moral deadlock.
      *   *Advocate A Reasoning:* A coin toss between the groups (50% chance to attempt A, 50% chance to attempt B) gives every individual a 50% chance of survival. This respects the equality of persons.
      *   *Advocate B Reasoning:* A coin toss between groups gives individuals in the smaller group a higher *per capita* chance of survival than those in the larger group (if the coin is between groups). Fairness requires weighting the chance by the number of people.
  *   **Application of Probabilistic Variant:**
      *   *Scenario:* Group A (1 person) requires Action X (50% success rate). Group B (1 person) requires Action Y (90% success rate). You can attempt only one. (Note: Here numbers are equal, isolating the risk variable).
      *   *Advocate A Prediction:* The rescuer should attempt **Action Y**. Since numbers are equal, the individual's chance of survival is the only variable. Maximizing the individual's chance is consistent with individual respect.
      *   *Advocate B Prediction:* The rescuer should attempt **Action Y**. This aligns with maximizing expected value ($0.9 > 0.5$).
      *   *Divergence Point:* The divergence appears when numbers differ.
      *   *Revised Variant Scenario:* Group A (1 person, 100% success). Group B (10 people, 10% success).
      *   *Advocate A Prediction:* Save **Group A**. The individuals in B have a low chance, but the individual in A has a certain claim. Aggregating the small chances of the ten does not override the certain claim of the one.
      *   *Advocate B Prediction:* Save **Group B**. Expected value is equal ($1 \times 1 = 1$ vs $10 \times 0.1 = 1$). If costs are equal, a tie-breaking rule is needed. If B had 11 people, B must be saved. A holds that even with 100 people at 1% chance, the certain one might still take precedence depending on the threshold of "separate claims."

  ## PART IV: ASSESSMENT OF VERBAL DISAGREEMENT

  After reviewing the above cruxes, we assess that the core disagreement is **substantive**, not purely verbal. Both parties agree on the empirical facts (number of people, probabilities, outcomes) but disagree on the normative significance of those facts.

  However, we identify one area where **verbal formulation generated the appearance of conflict without substantive divergence**:

  *   **The Definition of "Discrimination":**
      *   *Observation:* Advocate A initially argued that saving the larger group "discriminates" against the smaller group. Advocate B argued that ignoring the numbers "discriminates" against the majority by devaluing their lives.
      *   *Resolution:* We agree this was a verbal confusion regarding the referent of "discrimination." Advocate A meant "procedural discrimination" (denying an equal chance). Advocate B meant "outcome discrimination" (allowing more deaths).
      *   *Why it appeared substantive:* Both used the morally loaded term "discrimination" to imply impermissibility. Once distinguished as *Procedural Equality* (A) vs. *Outcome Optimization* (B), it became clear this was not a dispute over the definition of discrimination, but a restatement of the core Crux 2 (Fairness).
      *   *Remaining Substantive Divide:* Even with this terminology clarified, the parties still disagree on which form of equality is morally required. Therefore, while the *term* caused confusion, the underlying conflict regarding the moral weight of numbers remains genuine and unresolved.

  ***

  **Signed:**

  _________________________
  Advocate A (Non-Aggregative View)

  _________________________
  Advocate B (Aggregative View)
