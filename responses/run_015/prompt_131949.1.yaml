prompt: |-
  I run the weekly challenge session at a small grantmaking foundation: five analysts, each assigned to tear holes in somebody else's funding case, and I write the one-page note that goes to the board under my name. Roughly twice a month a case stalls because two people are arguing past each other in a way that more evidence won't fix — typically over what counts as evidence at all: one analyst holds that nothing that hasn't been replicated in a randomized trial is evidence, another that a mechanism plus a field visit is. I've tried the usual rationalist toolkit on these — steelmanning, double crux, asking what would change your mind — and it fails in a specific way: it presumes the disagreement bottoms out somewhere arguable. The answer I get back is often "nothing", and "nothing" is ambiguous between a refusal to engage and the honest report that the claim in question is load-bearing for everything else the person is doing.

  Which is why I've been working through Wittgenstein's late notes on certainty, published after his death as On Certainty, and the literature that calls the propositions at the bottom of that structure hinges: not known, not inferred, not doubted, but the frame inside which knowing, inferring and doubting have the sense they have — closer to the riverbed that the water runs through than to a belief floating in the water, though the riverbed can shift over time. Please turn this into a procedure my team can actually run: twenty minutes alone at a desk, in writing, with no philosophy training, on a claim that has deadlocked a dispute, and in a form I can audit before the note goes out.

  What I need is the tests, in the order they should be applied, for sorting a stalled claim into (1) an ordinary empirical question whose evidence test the two sides simply haven't specified, (2) a genuine clash between frameworks that no evidence will settle for the people holding them, and (3) a hypothesis someone has insulated from criticism by treating it as though it were a hinge — together with what to do in each case (send it back for a number and a date, escalate it to the board as a scope-and-values decision, push back and demand the argument), what counts as a sufficient answer to each test, where the sequence stops early with a firm verdict, and where it has to hand the decision to a person because the question is one of commitments rather than facts.

  Then run it on three cases: the randomized-trial-versus-mechanism stalemate above; an analyst who refuses to put any probability on a low-base-rate catastrophic risk on the grounds that any number would be spurious; and my own standing rule that we only fund interventions whose impact can be measured, which I expect the procedure to treat less kindly than I do. Finally, tell me honestly what a procedure like this cannot do: where it will misfire, which of its verdicts I should be most suspicious of, and how it might end up as a convenient vocabulary for people to stop arguing earlier than they should.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **Context:** Small grantmaking foundation, weekly challenge session. 5 analysts, 1 director (user).
      *   **Problem:** Stalled disputes (twice a month) where analysts argue past each other. Often about epistemology (what counts as evidence). Rationalist tools (steelmanning, double crux) fail because the disagreement is about "hinges" (Wittgensteinian certainties), not empirical claims.
      *   **Goal:** A 20-minute written procedure for analysts to diagnose stalled claims.
      *   **Output Requirements:**
          1.  A step-by-step procedure (tests in order).
          2.  Classification of claims into three categories: (1) Empirical (fixable), (2) Framework Clash (values/scope), (3) Insulated Hypothesis (dogma).
          3.  Actionable next steps for each category.
          4.  Audit trail requirements.
          5.  Application to three specific cases (RCT vs. Mechanism, Low-Base-Risk Probability, Director's Measurement Rule).
          6.  Honest critique of the procedure's limitations/risks.
      *   **Tone:** Professional, pragmatic, philosophically grounded but accessible (no jargon without definition), direct.

  2.  **Develop the Procedure (The "Hinge Audit"):**

      *   *Constraint:* 20 minutes, written, no philosophy training.
      *   *Concept:* Wittgenstein's *On Certainty*. Hinges are not known; they are the scaffolding.
      *   *Step 1: Is it testable?* (Empirical). If yes, define the test. If no, move to Step 2.
      *   *Step 2: What breaks if this moves?* (Load-bearing). If nothing, it's not a hinge. If everything, it might be a hinge.
      *   *Step 3: Is it a choice or a fact?* (Framework vs. Dogma). Distinguish between a conscious framework commitment and an unconscious insulation.
      *   *Structure:* Needs to be a worksheet or checklist.
      *   *Verdicts:* Needs to map to the three categories requested.

      *Drafting the Steps:*
      *   *Test 1 (The Falsification Test):* Can you describe a world where this is false? If yes -> Empirical.
      *   *Test 2 (The Collapse Test):* If you remove this claim, does your whole argument collapse? If yes -> Candidate for Hinge.
      *   *Test 3 (The Authority Test):* Is this claim based on a rule you chose (framework) or a fact you claim to see (dogma)?

      *Refining for the User's Context:*
      *   Need to distinguish between "Framework Clash" (legitimate disagreement on hinges) and "Insulated Hypothesis" (illegitimate protection of a belief).
      *   *Differentiation:* A framework hinge is admitted as a commitment ("We value X"). An insulated hypothesis is masquerading as fact ("X is true" when it's actually "We value X").
      *   *Action:* Empirical -> Specify evidence. Framework -> Board/Decision. Insulated -> Challenge/Reframe.

  3.  **Applying the Procedure to the Three Cases:**

      *   *Case 1: RCT vs. Mechanism.*
          *   Analyst A: Only RCTs count.
          *   Analyst B: Mechanism + Visit counts.
          *   Diagnosis: This is a Framework Clash. Both are treating epistemological standards as hinges. Neither is empirically falsifiable in the moment.
          *   Action: Escalate to Board/Director as a strategic risk tolerance decision.
      *   *Case 2: Low-Base-Risk Probability.*
          *   Analyst: "Any number is spurious."
          *   Diagnosis: Likely an Insulated Hypothesis. Refusing to quantify is a way to avoid the risk of being wrong, masquerading as epistemic humility.
          *   Action: Push back. Demand a range or a "cannot estimate" with justification, not a blanket refusal.
      *   *Case 3: Director's Measurement Rule.*
          *   Rule: "Only fund if impact can be measured."
          *   Diagnosis: This is a Framework Hinge, but potentially a *rigid* one. The procedure should treat it as a value commitment, not an empirical truth. It might be limiting the foundation's scope illegitimately.
          *   Action: Acknowledge it as a strategic constraint, but subject it to periodic review (is it costing us good deals?).

  4.  **Critiquing the Procedure (The "Honest Truth"):**

      *   *Limitations:*
          *   It can be gamified. Analysts can learn to write "This is a hinge" to avoid work.
          *   It creates a false trichotomy. Some things are messy.
          *   It doesn't solve the disagreement; it just labels it.
          *   Power dynamics: The Director's hinges are harder to challenge than analysts'.
          *   Wittgenstein warning: Hinges *do* shift. Treating them as static is un-Wittgensteinian.
      *   *Risks:* Premature closure. "It's a framework clash" becomes a conversation stopper.

  5.  **Drafting the Content (Iterative refinement):**

      *   *Introduction:* Acknowledge the Wittgenstein insight. It's sharp.
      *   *The Worksheet:* Keep it tight. 4 Questions.
      *   *The Decision Tree:* Clear mapping to the 3 categories.
      *   *The Case Studies:* Be specific. Show *why* the procedure yields the result.
      *   *The Critique:* Be brutal. This is what the user asked for ("tell me honestly").

      *(Self-Correction during drafting)*: Make sure I don't get too bogged down in Wittgenstein exegesis. The user knows the text. They need the *tool*. Focus on the operationalization of "hinges."
      *Key distinction:* A hinge is a *rule of the game*. An insulated hypothesis is *cheating at the game* by pretending a move is a rule.
      *Refining Test 3:* How to tell the difference? Ask: "If we changed this rule, would the work still be grantmaking, or would it be something else?" (Framework) vs. "If we changed this, would I just be embarrassed?" (Insulation).

  6.  **Final Review against Constraints:**
      *   20 mins? Yes, the worksheet is short.
      *   No philosophy training? Yes, terms are defined operationally.
      *   Audit trail? Yes, the worksheet *is* the audit.
      *   Three cases covered? Yes.
      *   Limitations covered? Yes.

  7.  **Final Polish:** Ensure tone is respectful of the user's intelligence but directive on the procedure. (Proceed to generate output).

  *(Post-computation check)*: Did I address the "nothing" ambiguity? Yes, by forcing the analyst to write down *what* collapses if the claim is removed. This distinguishes "I refuse" from "This is structural."

  Let's assemble the "Hinge Audit Protocol."

  *   *Step 1: The Counterfactual.* (Empirical check)
  *   *Step 2: The Collapse.* (Hinge check)
  *   *Step 3: The Source.* (Framework vs. Dogma check)
  *   *Step 4: The Cost.* (Decision check)

  *Case 3 (Director's Rule)* needs careful handling. It needs to come out as "This is a framework hinge, but it is costly." The procedure shouldn't just validate the Director's bias; it should expose it as a choice.

  *Critique:* Emphasize that labeling something a "hinge" can be a power move. The Director needs to be aware their own hinges are the most dangerous ones.

  Okay, ready to write.s
answer: |-
  This is a sophisticated application of *On Certainty*. You are correct that standard rationalist tools fail here because they treat hinges as moves *within* a language game, when they are actually the board *on which* the game is played. You cannot double-crux a riverbed.

  Below is the **Hinge Audit Protocol**. It is designed to be a one-page worksheet attached to any funding memo where disagreement has persisted for more than two sessions. It forces the analyst to operationalize the "nothing" they are hitting.

  ### The Hinge Audit Protocol

  **Time:** 20 Minutes (Individual, Written)
  **Auditor:** You (Director)
  **Trigger:** A claim where two analysts report "no progress" despite agreed-upon evidence gathering.

  #### Part 1: The Diagnostic (4 Questions)

  The analyst holding the stalled claim must answer these four questions in writing.

  **1. The Counterfactual Test**
  *Describe a specific observation or data point that would prove this claim false.*
  *   **Pass:** You can describe a specific dataset, event, or measurement (e.g., "If the RCT shows p > 0.05").
  *   **Fail:** You describe a methodological flaw, a change in definition, or say "none" (e.g., "No RCT could capture the nuance").
  *   *Verdict:* If Pass, stop. This is an **Empirical Disagreement**. Go to Part 2A. If Fail, proceed to Question 2.

  **2. The Collapse Test**
  *If you remove this claim from your argument, what specific part of your recommendation collapses?*
  *   **Pass:** You identify a specific conclusion that can no longer be supported (e.g., "I cannot recommend 'High Confidence'").
  *   **Fail:** You describe a general feeling of unease, or the entire proposal becomes meaningless (e.g., "We wouldn't be doing grantmaking anymore").
  *   *Verdict:* If the whole proposal becomes meaningless, this is a **Framework Hinge**. Proceed to Part 2B. If only a specific conclusion collapses, proceed to Question 3.

  **3. The Source Test**
  *Is this claim a description of the world, or a rule you are applying to the world?*
  *   **Option A:** "This is how the world works." (Fact Claim)
  *   **Option B:** "This is how we decide." (Rule Claim)
  *   *Instruction:* If you answered A, but failed the Counterfactual Test (Question 1), you are likely treating a Rule as a Fact. Mark this as **Insulated Hypothesis**. Proceed to Part 2C.

  **4. The Cost Test**
  *If we adopted the opposing view for this specific case, what value do we lose?*
  *   **Instruction:** Be specific. Do not say "rigor." Say "We lose the ability to compare this to Portfolio X" or "We risk funding a placebo."
  *   *Verdict:* This quantifies the stake for the Board.

  ---

  #### Part 2: The Verdict & Action

  Based on the answers above, classify the stall into one of three buckets.

  **Category 1: Ordinary Empirical Question**
  *   **Diagnosis:** Passed Counterfactual Test. Both sides agree on what evidence matters, but haven't produced it.
  *   **Action:** **Send Back.** The memo is incomplete.
  *   **Requirement:** Analysts must agree on a specific metric, a specific source, and a date by which it will be retrieved.
  *   **Audit Check:** If the next memo does not contain this specific data, reject the memo.

  **Category 2: Framework Clash (Legitimate Hinge)**
  *   **Diagnosis:** Failed Counterfactual Test. Passed Collapse Test (whole proposal dissolves). Identified as a Rule Claim in Source Test.
  *   **Nature:** This is a disagreement about the foundation's risk tolerance or epistemological stance (e.g., "We only fund proven interventions" vs. "We fund promising theories").
  *   **Action:** **Escalate to Board/Decision.** This is not an analyst decision.
  *   **Requirement:** The memo must present the two frameworks explicitly as "Option A requires X standard; Option B requires Y standard."
  *   **Audit Check:** Ensure the Board Note frames this as a *strategic choice*, not a factual dispute.

  **Category 3: Insulated Hypothesis (Dogma)**
  *   **Diagnosis:** Failed Counterfactual Test. Failed Collapse Test (only specific conclusion dissolves, but analyst refuses to budge). Identified as Fact Claim in Source Test (incorrectly).
  *   **Nature:** The analyst is protecting a belief from falsification by treating it as a hinge. This is often disguised as "epistemic humility" (e.g., "Numbers are impossible here" to avoid being wrong).
  *   **Action:** **Push Back.** Demand the argument be reframed.
  *   **Requirement:** The analyst must either (a) provide the counterfactual evidence or (b) admit this is a Framework preference (Category 2). They cannot keep it as an unchallengeable fact.
  *   **Audit Check:** If they refuse both, you override the objection in the Board Note, noting the objection was methodological, not empirical.

  ---

  ### Application to Your Three Cases

  Here is how the Protocol handles the specific stalemates you described.

  #### Case 1: The RCT vs. Mechanism Stalemate
  *   **Analyst A (RCT):** Fails Counterfactual Test (no observation other than an RCT counts). Passes Collapse Test (without RCT, "evidence" category is empty). Source Test: Claims "This is how the world works" (Fact), but Protocol reveals it is a Rule.
  *   **Analyst B (Mechanism):** Fails Counterfactual Test (field visits are not replicable data). Passes Collapse Test.
  *   **Verdict:** **Category 2 (Framework Clash).**
  *   **Why:** Both are treating epistemological standards as hinges. Neither is empirically falsifiable in the context of the grant.
  *   **Action:** Escalate. The Board Note must read: *"Analysts agree on the goal but disagree on the evidentiary standard. Analyst A requires statistical replication; Analyst B accepts mechanistic plausibility. Funding this grant sets a precedent for Standard B."*
  *   **Result:** You stop trying to solve an epistemological war with data. You make it a scope decision.

  #### Case 2: The Low-Base-Rate Catastrophic Risk
  *   **Analyst:** Refuses to put a probability on a risk (e.g., "1 in 10,000") claiming any number is "spurious."
  *   **Protocol Run:**
      *   *Counterfactual:* Fails. (No data point would make them willing to number it).
      *   *Collapse:* Fails. (If they put a number on it, the grant analysis still works; they just fear the number will be wrong).
      *   *Source:* Claims Fact ("It is impossible to know").
      *   *Cost:* "We avoid false precision."
  *   **Verdict:** **Category 3 (Insulated Hypothesis).**
  *   **Why:** This is not a hinge; it is risk aversion masquerading as rigor. A hinge supports the structure; this is a shield protecting the analyst from accountability.
  *   **Action:** Push Back. Require a range (e.g., "0.001% to 0.1%") or a qualitative proxy ("Extremely Unlikely"). Refusal to quantify must be noted as a gap in the risk assessment, not a philosophical stance.

  #### Case 3: Your Measurement Rule ("Only fund if impact can be measured")
  *   **Protocol Run (Applied to you):**
      *   *Counterfactual:* Fails. (You wouldn't fund it even if it worked, if it couldn't be measured).
      *   *Collapse:* Passes. (If you remove this, your strategy document dissolves).
      *   *Source:* Rule Claim ("This is how we decide").
      *   *Cost:* "We lose accountability to donors/board."
  *   **Verdict:** **Category 2 (Framework Hinge).**
  *   **The Trap:** The procedure treats this *less kindly* than you might hope. It exposes your rule not as an objective truth about effective philanthropy, but as a **value commitment** that excludes unmeasurable good.
  *   **Action:** Escalate (to yourself/Board). You must acknowledge in the Board Note that this rule may exclude high-impact, low-measurability opportunities.
  *   **Result:** It prevents you from treating your preference as an empirical necessity. It forces you to own the opportunity cost of your rigor.

  ---

  ### The Honest Critique: Where This Procedure Will Misfire

  You asked for the failure modes. A Wittgensteinian tool is dangerous because Wittgenstein himself warned against turning philosophy into a method. Here is where the Hinge Audit will break:

  **1. The "Hinge" Loophole (Premature Closure)**
  Analysts will learn that categorizing a claim as a **Category 2 (Framework Clash)** ends the argument without requiring them to change their mind. It becomes a convenient vocabulary for "I don't want to argue this anymore."
  *   *Risk:* Legitimate empirical disputes get labeled as framework clashes to avoid the work of finding data.
  *   *Mitigation:* You must audit the **Counterfactual Test** aggressively. If they say "No evidence could change my mind," you must challenge whether they are describing the world or their preferences.

  **2. The Power Asymmetry**
  The procedure assumes all hinges are equal. They are not. Your hinges (Case 3) carry more weight than an analyst's. An analyst calling out your rule as a "Framework Hinge" is politically risky.
  *   *Risk:* The tool becomes a way for leadership to codify their biases as "Foundation Framework" while labeling analyst dissent as "Insulated Hypotheses."
  *   *Mitigation:* You must submit your own standing rules to the Protocol publicly. If you exempt yourself, the tool is just a whip.

  **3. The Static Riverbed**
  Wittgenstein noted that riverbeds *shift*. This procedure treats hinges as static for the duration of the grant cycle.
  *   *Risk:* It reifies temporary disagreements into permanent structural features. A "Framework Clash" today might be an "Empirical Question" in five years (e.g., measuring soft outcomes).
  *   *Mitigation:* Add a sunset clause. Category 2 verdicts must be reviewed annually. "Is this still a framework clash, or has the evidence landscape changed?"

  **4. The "Nothing" Ambiguity Remains**
  The protocol forces them to write down *what* collapses. But sometimes the answer is truly "My entire professional identity."
  *   *Risk:* An analyst might honestly write, "If I accept qualitative data, I am not doing the job I was hired to do." The Protocol classifies this as Category 2, but it is actually a hiring/training failure.
  *   *Mitigation:* If an analyst flags a core competency as a hinge, that is a management issue, not a grant issue. Pull them from the case.

  ### Summary Recommendation

  Implement the **Hinge Audit Protocol** as a mandatory attachment for any memo marked "Disagreement Persisting."

  *   **Trust the Verdict on Case 1 (RCTs):** It correctly identifies this as a Board-level strategic choice.
  *   **Trust the Verdict on Case 2 (Risk):** It correctly identifies the refusal to estimate as an avoidance tactic.
  *   **Heed the Warning on Case 3 (Your Rule):** It will expose your measurement rule as a value constraint, not an empirical truth. Allow it to do so. It will make your Board Note more honest.

  The greatest risk is not that the tool fails, but that it succeeds too well. It will make the intractable tractable by revealing that many of your "factual" disagreements are actually "value" disagreements. That will reduce the time spent arguing, but it will increase the time spent making hard strategic choices. That is the correct trade-off.
