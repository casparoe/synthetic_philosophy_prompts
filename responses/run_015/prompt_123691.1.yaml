answer: |-
  Quine excludes moral values from ontology primarily because they fail the indispensability criterion for scientific theory, not because they are formally unregimentable, though he argues that a correct naturalistic regimentation eliminates moral properties by reducing them to psychological or sociological facts.

  Quine's ontological commitment criterion ("to be is to be the value of a bound variable") applies specifically to the canonical notation of our best *scientific* theory. Mathematical objects gain ontological status not because they are perceptible, but because they are structurally indispensable to formulating physics and logic; we cannot quantify over physical phenomena without implicitly quantifying over sets and numbers. Moral values, by contrast, play no role in the causal explanations or predictive models of natural science, so they never enter the regimented theory that determines what exists.

  Regarding regimentation, Quine does not claim moral sentences are logically ill-formed, but he argues they cannot be regimented as referring to objective properties without violating naturalism. When translating moral talk into canonical notation, Quine insists on a naturalistic analysis where predicates like "x is good" are eliminated in favor of descriptions like "x is approved by society" or "x promotes social stability." This reduction means the bound variables in the regimented sentence range over humans, societies, or behaviors, not over abstract moral entities, so no ontological commitment to "Values" is incurred.

  If moral terms were to survive regimentation intact as primitive, objective properties, it would indeed threaten Quine's anti-realism and his broader naturalistic worldview. Quine preemptively blocks this possibility by denying that moral predicates have truth-conditions comparable to scientific predicates; he treats them as expressions of sentiment or social conditioning rather than descriptions of reality. Consequently, moral talk is excluded from the ontology both because it is scientifically dispensable and because its proper logical analysis dissolves moral properties into natural facts.
