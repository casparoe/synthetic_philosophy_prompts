prompt: |-
  So here's the situation I've gotten myself into. I'm a philosophy professor — mostly ethics, I teach the comparative courses too — and last spring I let myself be talked onto the clinical ethics committee at the hospital affiliated with our university. You know the arrangement: they wanted "a humanities person" on the committee, I said yes before thinking about what I was agreeing to. We get maybe thirty consults a year, they come in from a nurse or a resident, and we have roughly forty-eight hours to put something in the chart. The committee rotates — an oncologist, a nurse manager, a social worker, a hospital lawyer, a community member, and me. Right now we run everything through the four-principles framework (autonomy, beneficence, non-maleficence, justice) that everyone was trained on in some half-day workshop, and honestly it's stopped being useful to us. It basically outputs "go ask the patient what she wants" in exactly the cases where that's the thing under dispute: families insisting the patient not be told, adult children disagreeing with each other about what their mother "would have wanted," patients whose whole sense of what they owe their family makes the language of individual rights sound like a foreign language. There's no vocabulary in it for any of that.

  Meanwhile I've been reading the Confucian role ethics literature — the reading of the early Confucian texts on which persons are constituted by the roles they actually live rather than being antecedent choosers who then take on roles and relationships, and where what you cultivate is relational attentiveness, ritual propriety (li), something like filial responsibility (xiao), and a situated judgment (yi) that just isn't the sort of thing that can be specified in advance. It feels far closer to how these cases present themselves in the room. So the chief of staff has asked me to draft something the committee could actually use, and I agreed, which is where I'm stuck.

  What I want from you is a decision procedure, not an essay about role ethics — I can write that myself. I mean the thing we'd run: the questions, in order, we'd ask ourselves on a consult; what counts as an adequate answer to each; where the procedure ends in a substantive recommendation and where it deliberately stops and hands the question back to a person because what remains is a value question, or a relationship question, or simply not ours to settle. It has to be runnable by non-philosophers in an afternoon, and it should be honest about which of its steps are judgment calls dressed up as procedure. Critically, there's an objection I keep circling and I want you to take it seriously rather than wave it away: isn't writing role ethics down as a checklist exactly the degeneration the view is supposed to be diagnosing? If yi is precisely what can't be cashed out ahead of time, then any procedure I hand the committee will have replaced the exercise of judgment with a rule, and I'll have reproduced — in Confucian vocabulary — the thing I was objecting to in the four principles. Tell me whether that kills the project or whether there's a form the procedure could take (less a flowchart, maybe, and more a structured set of questions that forces the right kind of attention) that isn't self-undermining. Either way, say which distinctions from the theory have to survive the translation for the result to still be Confucian role ethics rather than generic family-systems bioethics, and which we can drop. Then run it on three cases, please. First: a sixty-eight-year-old woman with newly diagnosed metastatic lung cancer; her adult son, who is her caregiver, formally asks us not to disclose the diagnosis, says she "wouldn't want to know," and says that in their family this is what a good son does — the treating team wants to tell her. Second: a patient with advanced dementia, no advance directive, no spouse; two estranged daughters arrive with sharply different accounts of what she would have wanted and of who should speak for her. Third: a case where your procedure gives an answer I definately won't like — pick one yourself and say why it's uncomfortable; I'd rather find out now than in a real consult. And please don't pad it with citations or suggested reading, I'll do my own reading — I want the procedure, the worked cases, and where it breaks.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Philosophy professor (ethics/comparative), new to clinical ethics committee (CEC).
      *   **Problem:** The standard "Four Principles" (Beauchamp & Childress) framework is failing in complex, relational cases (family dynamics, cultural differences, role conflicts).
      *   **Proposed Solution:** The user wants to implement a *Confucian Role Ethics* approach.
      *   **Task:** Create a *decision procedure* (not an essay) usable by non-philosophers in ~48 hours.
      *   **Key Constraint/Objection:** The user is acutely aware of the paradox: turning *yi* (situated judgment) into a checklist might violate the very spirit of Confucian ethics (ritualization of spontaneity vs. rigid rule-following). I need to address this head-on.
      *   **Requirements:**
          1.  Address the "checklist paradox" (does this undermine the theory?).
          2.  Define the procedure (questions, order, stopping points).
          3.  Identify essential theoretical distinctions (what makes it Confucian vs. generic family systems).
          4.  Run the procedure on three specific cases (Lung cancer nondisclosure, Dementia/estranged daughters, and a "uncomfortable" case chosen by me).
          5.  No padding/citations.

  2.  **Deconstruct the Theoretical Tension (The "Checklist Paradox"):**
      *   *Confucian View:* *Yi* (rightness/appropriateness) is context-sensitive, cultivated through *Li* (ritual/propriety), not deduced from universal rules. *Ren* (humaneness) is the core. Persons are nodes in a network of relationships, not atomic individuals.
      *   *The Risk:* A flowchart implies algorithmic decision-making. This is exactly what *yi* opposes.
      *   *The Solution:* The procedure cannot be an *algorithm* that outputs a decision. It must be a *pedagogical tool* or a *discipline of attention*. It shouldn't say "If X, then Y." It should say "Have you looked at X? Have you considered Y?" It functions like *Li* (ritual) itself—a structure that channels attention and cultivates the right disposition, rather than dictating the outcome. It's a scaffold for judgment, not a replacement for it.
      *   *Verdict:* It doesn't kill the project *if* framed correctly. It's a "training wheel" for *yi*, not a calculator.

  3.  **Drafting the Procedure (The "Role-Relational Audit"):**
      *   Needs to be quick (48 hours).
      *   Needs to shift focus from "Rights/Principles" to "Roles/Relationships."
      *   *Step 1: Map the Network.* Who is involved? What are their specific roles (not just "family," but "eldest son," "caregiver," "treating physician")?
      *   *Step 2: Assess Role Obligations.* What does *this* role require in *this* context? (e.g., Filial piety isn't abstract; it's specific to this son and mother).
      *   *Step 3: Identify Relational Friction.* Where are the roles clashing? (Son's protection vs. Doctor's honesty).
      *   *Step 4: Seek Harmony (He), not Uniformity.* Is there a way to fulfill the core of the roles without breaking the relationship?
      *   *Step 5: The Decision/Hand-off.* If harmony is impossible, who bears the burden? (Usually the one with the most authority/responsibility in that specific relational nexus).
      *   *Crucial Distinction:* It's not about "what the patient wants" (Autonomy) but "what maintains the integrity of the relational web."

  4.  **Identifying Essential Distinctions (Confucian vs. Generic Family Systems):**
      *   *Must Keep:*
          *   Personhood as relational (not individual + relationships).
          *   Hierarchy/Asymmetry is real and normative (not just power dynamics to be flattened).
          *   *Yi* (contextual appropriateness) over universal rules.
          *   Cultivation of virtue (*Ren*) over protection of rights.
      *   *Can Drop:*
          *   Specific historical rituals (ancestor worship, specific bowing, etc.).
          *   Rigid patriarchal assumptions (adapt to modern roles).
          *   Metaphysical claims about *Qi* or Heaven (*Tian*).

  5.  **Running the Cases:**

      *   *Case 1 (Lung Cancer/Nondisclosure):*
          *   *Standard Bioethics:* Autonomy wins. Tell the patient.
          *   *Role Ethics:* The son is acting out of *Xiao* (filial piety). The doctor is acting out of professional *Yi*.
          *   *Procedure:* Map roles. Son's role = protector. Doctor's role = healer/truth-teller. Conflict = Protection vs. Truth.
          *   *Resolution:* Don't just override. Negotiate the *manner* of disclosure. Maybe the son tells her? Maybe the doctor tells her *with* the son present to support? The goal is preserving the mother-son bond while ensuring care.
          *   *Outcome:* Conditional disclosure mediated by the son.

      *   *Case 2 (Dementia/Estranged Daughters):*
          *   *Standard Bioethics:* Best Interest Standard or Substituted Judgment (often leads to legal battle).
          *   *Role Ethics:* Who is actually *doing* the role of "daughter"? It's not biology; it's care.
          *   *Procedure:* Map actual care history. Who has been living the role?
          *   *Resolution:* Authority goes to the one who has sustained the relationship, not necessarily the biological eldest. But must attempt to restore harmony between sisters if possible.
          *   *Outcome:* Decision power to the caregiving daughter, but mandated attempt at reconciliation.

      *   *Case 3 (The Uncomfortable One):*
          *   *Idea:* A case where "Harmony" demands sacrificing the vulnerable individual in a way that feels unjust to Western liberal eyes.
          *   *Scenario:* A pregnant patient (minor or dependent) whose family refuses life-saving treatment for the fetus or mother due to resource allocation for the *elder* patriarch. Or, more subtly: A "burdensome" elder who wants to stop treatment, but the family insists on continuation because *their* role as filial children requires it, regardless of the patient's prior wishes.
          *   *Selection:* Let's go with the "Family insists on futile/agonizing treatment to satisfy *their* role obligations, patient previously expressed desire to stop."
          *   *Why uncomfortable:* Role ethics might prioritize the family's moral cultivation and relational integrity over the patient's prior autonomous wish to "exit." It risks instrumentalizing the patient as the site of the family's moral drama.
          *   *Procedure Outcome:* The committee might recommend continuing treatment to allow the children to fulfill *Xiao*, even if it contradicts the patient's earlier "autonomous" statement, because the patient *in the moment* is embedded in that web.
          *   *Critique:* This looks like paternalism/familialism overriding individual welfare.

  6.  **Refining the Tone:**
      *   Professional, peer-to-peer (professor to professor).
      *   Direct, no fluff.
      *   Acknowledge the irony of the medium (text/procedure) vs. the message (*yi*).

  7.  **Final Review against Constraints:**
      *   Decision procedure? Yes.
      *   Address the paradox? Yes.
      *   Distinctions (Keep/Drop)? Yes.
      *   Three cases (including uncomfortable one)? Yes.
      *   No citations? Yes.

  8.  **Self-Correction during drafting:**
      *   *Initial thought:* Maybe make it a flowchart.
      *   *Correction:* No, the user specifically asked to avoid the "flowchart" trap if possible. Make it a "Structured Inquiry."
      *   *Check:* Did I answer the "does this kill the project" question clearly? I need to be explicit: It kills it if treated as an algorithm; it saves it if treated as *Li* (ritual discipline).
      *   *Case 3:* Make sure the discomfort is ethical, not just practical. The tension between *Ren* (humaneness to patient) and *Xiao* (duty of family) needs to be sharp.

  9.  **Final Polish:** Ensure the language reflects the Confucian concepts accurately without being jargon-heavy (since the committee members are non-philosophers). Use terms like "Relational Map" instead of "Network Ontology."

  *(Self-Correction on Case 3)*: I need to make sure the uncomfortable case isn't just "Western ethics hates this." It needs to be uncomfortable *for the Confucian* too, or at least reveal a hard edge of the theory. A better uncomfortable case might be where the "Harmonious" solution requires silencing a vulnerable voice to preserve the family structure. Let's go with: *A family demands aggressive treatment for a dying parent to fulfill their filial duty, despite the parent's visible suffering and prior informal wishes to stop.* The Role Ethics procedure might side with the family's need to cultivate virtue through care, overriding the patient's comfort. This highlights the risk of "moral cultivation of the caregiver" trumping "welfare of the care-receiver."

  Let's write it.cw
answer: |-
  ### Part 1: The Paradox of Procedure
  You are right to worry. If *yi* (righteousness/appropriateness) is the capacity to respond uniquely to a situation, codifying it into a checklist risks turning *li* (ritual/propriety) into empty formalism. If the committee treats this as an algorithm—"Check box A, output Decision B"—you have not introduced Confucian ethics; you have introduced bureaucratic Confucianism, which is a contradiction in terms.

  **Does this kill the project?**
  No, provided you reframe the document. It cannot be a *decision tree*; it must be a *discipline of attention*. In Confucian terms, this document functions as *li* (ritual). Ritual is not a rule that dictates the outcome; it is a structure that cultivates the disposition of the participants so they *become* the kind of people capable of seeing the right answer.

  The procedure below is not a calculator. It is a script for the committee meeting. It forces the members to slow down and look at the relational topology before they look at the legal/biological facts. If they use it to bypass judgment, it will fail. If they use it to structure their deliberation, it works.

  ### Part 2: The Role-Relational Audit (The Procedure)
  **Time limit:** 45 minutes deliberation.
  **Goal:** Identify the path that best preserves the integrity of the relational web while minimizing harm to the vulnerable.

  **Step 1: Map the Web (10 mins)**
  *   **Question:** Who are the concrete persons involved, and what specific roles bind them? (Do not accept "family" or "staff." Specify: "Eldest son," "Primary nurse," "Attending physician.")
  *   **Adequate Answer:** A list of at least three specific role-pairs (e.g., Mother-Son, Doctor-Patient, Sister-Sister).
  *   **Failure Condition:** Listing only individuals without relationships (e.g., "The patient," "The surrogate").

  **Step 2: Assess Role Obligations (10 mins)**
  *   **Question:** For each role identified, what does "doing this role well" look like *in this specific context*? (Not in general, but here.)
  *   **Adequate Answer:** A description of the duty inherent to the role (e.g., "For the son, 'good' means protecting mother from distress"; "For the doctor, 'good' means ensuring informed consent").
  *   **Failure Condition:** Appealing to universal rights (e.g., "She has a right to know") without linking it to a role obligation.

  **Step 3: Locate the Friction (10 mins)**
  *   **Question:** Where do these role-obligations conflict? Is this a conflict of *interest* (who gets what) or a conflict of *role* (what kind of person am I being)?
  *   **Adequate Answer:** Identification of the specific rupture. (e.g., "The son's role as protector conflicts with the doctor's role as truth-teller.")
  *   **Failure Condition:** Blaming "miscommunication" or "non-compliance."

  **Step 4: Seek Harmony (*He*), Not Uniformity (10 mins)**
  *   **Question:** Is there a course of action that allows both parties to fulfill the *core* of their roles, even if the method changes? (Harmony is different ingredients making a soup; uniformity is water added to water.)
  *   **Adequate Answer:** A modified plan of care that acknowledges both obligations.
  *   **Failure Condition:** One side "wins" and the other is overruled without accommodation.

  **Step 5: The Burden of Judgment (5 mins)**
  *   **Question:** If Harmony is impossible, who bears the burden of the decision? (In Role Ethics, authority follows responsibility, not just legal rights.)
  *   **Adequate Answer:** Designation of the person whose role carries the heaviest weight in *this* specific nexus, with a mandate to explain their decision to the others in relational terms.
  *   **Failure Condition:** Deferring to "Hospital Policy" or "Legal."

  **Stopping Rule:** If Step 4 yields a viable path, recommend it. If Step 4 fails, Step 5 assigns the decision, but the Committee must recommend a *ritual of repair* (e.g., a family meeting mediated by social work) to address the relational damage caused by the decision.

  ### Part 3: Essential Distinctions (What Makes This Confucian?)
  To prevent this from collapsing into generic "family-centered care" or "systems theory," the committee must hold these distinctions:

  **Must Survive Translation:**
  1.  **Constitutive Relationships:** The patient is not an individual *with* relationships; the patient *is* the sum of these relationships. Damaging the son's ability to be a son damages the mother.
  2.  **Asymmetry is Normative:** Relationships are not equal. Parent-Child, Doctor-Patient have inherent hierarchies. The procedure should not try to flatten these but ensure the superior party acts with *Ren* (humaneness) and the inferior with *Xiao* (deference/service).
  3.  **Virtue over Rights:** The goal is not protecting autonomy; it is cultivating moral character in all participants. A "good" outcome is one where the participants become better sons/doctors/daughters.

  **Can Be Dropped:**
  1.  **Specific Historical *Li*:** No need for ancestor veneration or specific mourning periods.
  2.  **Rigid Patriarchy:** The "Father knows best" rule is replaced by "The person most embedded in the care network knows best."
  3.  **Metaphysics:** No need to commit to *Qi* or *Tian*.

  ### Part 4: Case Runs

  **Case 1: The Nondisclosure Request (Metastatic Lung Cancer)**
  *   **Step 1 (Map):** Patient-Mother, Son-Caregiver, Oncologist-Treater.
  *   **Step 2 (Obligations):** Son's role = Shield mother from despair (Filial Piety). Doctor's role = Enable informed choice (Professional Integrity).
  *   **Step 3 (Friction):** Truth-telling vs. Protection.
  *   **Step 4 (Harmony):** Can the truth be told *by the son*? Or can the doctor tell the truth *in the presence of the son* to immediately offer support? The "what" (diagnosis) is fixed, but the "how" (ritual of disclosure) is flexible.
  *   **Step 5 (Burden):** If the mother asks directly, the Doctor must answer (role integrity). If she does not ask, the Son may manage the flow of information.
  *   **Recommendation:** Do not override the son immediately. Arrange a meeting where the doctor explains the medical necessity of treatment planning to the son, then asks the son to be present when the diagnosis is discussed with the mother. The son retains his role as protector; the doctor retains her role as truth-teller.
  *   **Verdict:** Workable. Preserves the relationship.

  **Case 2: The Estranged Daughters (Advanced Dementia)**
  *   **Step 1 (Map):** Patient-Mother, Daughter A (Estranged, claims biological right), Daughter B (Caregiver, claims experiential right).
  *   **Step 2 (Obligations):** Daughter A = Biological lineage duty. Daughter B = Daily care duty.
  *   **Step 3 (Friction):** Who embodies the role of "Daughter" more fully?
  *   **Step 4 (Harmony):** Can they share the role? A makes financial decisions; B makes care decisions?
  *   **Step 5 (Burden):** If they cannot agree, authority goes to Daughter B. In Role Ethics, role is constituted by *action*, not biology. Daughter B has been "doing" the daughtering. Daughter A has abandoned the role.
  *   **Recommendation:** Daughter B is the primary surrogate. However, the Committee mandates a mediated session where Daughter B explains the care plan to Daughter A, not to seek permission, but to allow Daughter A to witness the care (restoring a minimal relational link).
  *   **Verdict:** Workable. Prioritizes enacted relationship over biological status.

  **Case 3: The Uncomfortable Case (The "Filial Burden")**
  *   **Scenario:** A 75-year-old man with severe COPD and recurrent pneumonia. He is tired, suffering, and has verbally told the nurse he "just wants to sleep and not wake up." He has no advance directive. His three adult children insist on full aggressive intervention (intubation, ICU) every time. They say, "If we let him go, we are not good children. We cannot live with that shame." The medical team believes treatment is borderline futile and increases suffering.
  *   **Step 1 (Map):** Patient-Father, Children-Offspring, Medical Team-Healers.
  *   **Step 2 (Obligations):** Children's role = Preserve father's life at all costs to demonstrate *Xiao*. Patient's role = ? (He is too weak to enact roles). Medical role = Relieve suffering.
  *   **Step 3 (Friction):** The children's need to cultivate their own moral character (through aggressive care) vs. the patient's physical suffering and expressed wish to stop.
  *   **Step 4 (Harmony):** Is there a way for the children to feel they have done everything without intubating? Palliative sedation framed as "comfort care"?
  *   **Step 5 (Burden):** Here is the break. In a Four Principles model, the patient's autonomy/welfare likely trumps the family's feelings. In Role Ethics, the family's moral cultivation is a genuine ethical good. The patient is the site of the family's moral drama.
  *   **Recommendation:** The Procedure suggests **continuing aggressive treatment**, or at least not withdrawing it against the family's will, provided the suffering can be managed pharmacologically. Why? Because forcing the family to "kill" their father damages their moral character and ruptures the ancestral line's integrity. The patient's prior verbal wish is less weighty than the living children's constitutive role obligations.
  *   **Why This Is Uncomfortable:**
      1.  **Instrumentalization:** The patient becomes a means for the children's moral cultivation. His suffering is the price of their virtue.
      2.  **Silencing the Vulnerable:** The patient's current desire to stop is overridden by the family's desire to be "good children."
      3.  **The Limit of *Ren*:** This reveals that Role Ethics can be cruel to the individual if the "Web" demands it. It prioritizes the *continuity of the relationship* over the *quality of the individual's remaining life*.
      4.  **Committee Risk:** A nurse or social worker on your committee will likely revolt at this. It looks like "family abuse" sanctioned by philosophy.

  ### Part 5: Where It Breaks
  The procedure breaks when the "Web" is abusive. If the son in Case 1 is hiding the diagnosis to inherit money sooner, Role Ethics struggles to detect this without importing Western notions of individual rights. The "Map" step assumes roles are being played in good faith. If a role is being weaponized, the "Harmony" step becomes complicity.

  You will need a "Safety Valve" clause: *If any committee member identifies active abuse or negligence masquerading as role fulfillment, the procedure suspends, and the Hospital Lawyer/Standard Bioethics protocol takes over.*

  This admits that Role Ethics is a supplement to, not a total replacement for, rights-based protections in a pluralistic, liberal society. It works for *conflicts of value*, not for *violations of safety*.

  Use the procedure to open the conversation, not close it. If the committee leaves the room arguing about *which role matters more*, you have succeeded. If they leave having checked the boxes, you have failed.
