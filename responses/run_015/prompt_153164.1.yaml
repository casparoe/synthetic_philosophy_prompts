answer: |-
  ### Q&A Prep Sheet: The Delegation Condition

  **Pressure Point:** Clause (iii) — *Accountability for Errors.*
  This is where your view is most vulnerable. Clauses (i) and (ii) describe functional integration (which even a sophisticated tool user might satisfy). Clause (iii) is supposed to be the differentiator, but it relies on a normative attitude ("answering for") that is notoriously difficult to distinguish from internal monitoring without smuggling in access conditions.

  **Does the Delegation Condition Collapse into Internalism?**
  Honest assessment: **Yes, it risks it.** If "answering for errors" requires the subject to *recognize* the error as a cognitive failure rather than a worldly fact, you require an internal marker of cognitive status. If you define it purely behaviorally (e.g., "she fixes the device"), the Internalist will say a carpenter fixing a hammer does the same, and you haven't proven *cognitive* extension, only *causal* reliance. You need to lean hard on the idea that the *mode* of correction is distinct (revision of the system vs. replacement of the tool), but be prepared to admit this is a gradient, not a binary.

  **Concession to Make in the Paper (Before the Talk):**
  Concede that the Delegation Condition does not secure *knowledge* or *justification*, only *process membership*. Explicitly state that your view allows for "extended confabulation." If you try to defend the idea that the woman *knows* the false episodes in the talk, you will lose the epistemologists. Frame the view as a metaphysical claim about the architecture of the process, leaving the normative epistemic status as a separate, downstream question.

  **The Single Reply That Must Land:**
  The **Neural Parity Argument**. You must convince the room that the internalist cannot use "unreliability" or "opacity" to block the extended mind case without also blocking standard cases of neural memory. If the internalist says, "The device lies, so it's not memory," you must force them to admit, "Neural memory lies (confabulation), so it's not memory." If they accept neural confabulation is still memory, they must accept device confabulation is memory (given your Delegation Condition). This is your only route to neutralize the Internalists and the Psychiatrist simultaneously.

  ---

  ### The Eight Objections (Ordered by Damage)

  #### 1. The Internalist (Senior)
  **Idiom:** "You've smuggled the homunculus back in through the back door of normativity."
  **Objection:** "Your third clause requires the subject to treat the device's output as a *claim* rather than a *fact*. To do that, she must have independent access to the truth conditions to recognize a mismatch. If she has that access, she doesn't need the device for that sub-task. If she lacks it, she can't distinguish error from world-change. So, either the delegation is redundant, or the accountability is impossible. You haven't extended the mind; you've just described a user checking a instrument."
  **Reply:** "I deny she needs independent access to truth conditions. She needs access to *coherence* conditions. When the device says 'You had coffee' but she tastes tea, the friction is phenomenological, not propositional. The 'accountability' is the disposition to resolve that friction by tuning the instrument, not by doubting the sensation. This is no different than the brain resolving prediction error by updating its model rather than rejecting the sensory input."
  **Soft Spot:** This relies on a robust theory of non-conceptual content. If the Internalist presses that "tuning the instrument" is just causal feedback, not normative accountability, you may lack the resources to distinguish it from a thermostat.

  #### 2. The Predictive Processing Colleague
  **Idiom:** "Markov blankets," "Dissolves," "Instrumentalism."
  **Objection:** "This is 20th-century boundary policing. On active inference, the skin is not a privileged boundary. The 'Delegation Condition' is just a description of a specific hierarchical control loop where precision weighting is assigned to the artifact. Why posit a metaphysical 'extension' when we can just say the Markov blanket encompasses the device? Your condition adds bureaucracy without explanatory power."
  **Reply:** "I agree the blanket encompasses the device. But the Delegation Condition explains *which* parts of the blanket constitute the *agent* versus the *niche*. Active inference describes the dynamics; I'm describing the agency. Without a condition like delegation, the 'self' dissolves entirely into the environment. I'm offering the criterion for where we locate responsibility within the blanket."
  **Soft Spot:** The PP theorist may argue that 'agency' is also just a model, making your criterion pragmatic, not metaphysical. If they push that, your ontological claim weakens.

  #### 3. The Social Epistemologist
  **Idiom:** "Credibility economy," "Hermeneutical injustice," "Structural access."
  **Objection:** "Your condition assumes a sovereign subject who 'assigns' tasks. But in clinical and institutional settings, artifacts are often assigned *to* the subject. If a court mandates the monitoring device, or insurance only covers the confabulating model, does your condition imply the court is part of her mind? You're ignoring the political economy of who gets to delegate and who gets held accountable."
  **Reply:** "That's a crucial point for the ethics of extension, but distinct from the metaphysics. My condition tracks the *functional structure* of the cognitive relation, however it was instituted. If the court forces the device, the court might indeed be partially constitutive of the epistemic process, which is exactly the kind of invasive scrutiny your own work warns against. My view actually amplifies your worry: extending the mind extends the reach of institutional control."
  **Soft Spot:** You risk conceding that the 'subject' in your condition isn't the individual, but the institution, which undermines the individualist intuition behind memory.

  #### 4. The Philosopher of Psychiatry
  **Idiom:** "Insight," "Pathology," "Clinical picture."
  **Objection:** "In confabulation syndromes, the hallmark is a *lack* of correction. Your case stipulates she corrects the device. That makes her clinically distinct from the confabulators I study. If she corrects the device, she has insight. If she has insight, why call it confabulation? You've built a case that is medically impossible to isolate."
  **Reply:** "I'm distinguishing between *output* confabulation and *process* confabulation. She has insight into the *device's* fallibility (she corrects it), but not the *memory's* fallibility (she trusts the corrected output). This mirrors high-functioning patients who learn to compensate for deficits without curing them. The pathology is in the archive, not the monitoring system."
  **Soft Spot:** If the Psychiatrist insists that true memory requires a reliable archive, not just a reliable monitoring system, your analogy to neural memory weakens.

  #### 5. The Graduate Students (Collective)
  **Idiom:** "Operationalize," "Empirical traction," "Checkable claim."
  **Objection:** "How do we test for Clause (iii)? 'Disposition to answer for errors' sounds like we need to interview the subject. If it's behavioral, a parrot can be trained to peck a button when a recorder beeps. Where is the line between a trained response and cognitive accountability?"
  **Reply:** "Look for *systematic revision* versus *local workaround*. A parrot pecks to stop the noise. A cognitive agent updates the recording protocol to prevent the noise next time. The empirical marker is whether the intervention targets the future functioning of the artifact as a representational system."
  **Soft Spot:** This is hard to code for in an experiment. If they press for specific metrics, you might have to admit this is currently a philosophical intuition pump, not a scientific hypothesis.

  #### 6. The Internalist (Second)
  **Idiom:** "Constitution," "Causal coupling," "Category mistake."
  **Objection:** "You say parity is toothless, but your Delegation Condition is just a fancy causal coupling condition. 'Assigning a task' is a causal history. 'Treating as authoritative' is a causal disposition. You haven't found a new principle; you've just added more causal links and called them 'delegation'. You're still confusing how we use tools with what we are."
  **Reply:** "Causal coupling is bidirectional but blind. Delegation is unidirectional and normative. I can be causally coupled to a windmill, but I don't delegate my grinding to it. The difference isn't the physics; it's the stance. If you deny this distinction, you can't distinguish between a slave and a shovel, which I assume you want to do."
  **Soft Spot:** The Internalist may bite the bullet and say the slave/shovel distinction is moral, not metaphysical, and doesn't prove cognitive extension.

  #### 7. The Social Epistemologist (Follow-up)
  **Idiom:** "Testimony," "Second-hand knowledge," "Artifact credibility."
  **Objection:** "If the device invents details, and she believes them, isn't this just self-testimony? If I write a lie in a diary and forget I wrote it, then read it and believe it, I don't *remember* it. I've just deceived myself. Why is the device different from the diary?"
  **Reply:** "Because the diary case lacks the *continuous integration* of Clause (i) and (ii). The device is always-on and transparent; the diary is episodic and opaque. The device functions as the retrieval mechanism itself, not just a storage cue. It's the difference between reading a note and having a hippocampal implant."
  **Soft Spot:** If the device is "always-on" but the access is "on request" (as you described), the distinction from the diary blurs.

  #### 8. The Predictive Processing Colleague (Follow-up)
  **Idiom:** "Free energy," "Surprise minimization."
  **Objection:** "If the device minimizes surprise by filling gaps, and she accepts it, the system is working as designed. Why call it 'confabulation'? That's a pejorative term for successful prediction. You're importing a truth-conditional norm into a system that only cares about stability."
  **Reply:** "Because the stability is local at the expense of global accuracy. The system minimizes surprise about *what the device says*, not what happened. I'm calling it confabulation to highlight the divergence from the historical truth, which matters for the epistemology group."
  **Soft Spot:** The PP theorist might argue 'historical truth' is irrelevant to cognitive function, undermining the motivation for your case study.

  ---

  ### The Question You Are Hoping Nobody Asks

  **"If the Delegation Condition is satisfied, but the device is systematically lying, and you admit she doesn't *know* the events... what theoretical work is the 'Extended Mind' label doing here other than provocation?"**

  **Why it's dangerous:** It forces you to admit that your metaphysical conclusion (it is part of her mind) has no normative consequences (she is still ignorant/deluded). If the label "Extended Mind" doesn't change how we treat her epistemically, clinically, or morally, the Internalist and the PP theorist will unite to say the distinction is empty.

  **Prepared Answer (if forced):** "It changes the locus of intervention. If it's her mind, we fix the device to treat *her*. If it's a tool, we fix the device to help *her use it*. The clinical and ethical stakes of maintenance versus therapy turn on this distinction." (Note: This is weak, but it's the best you have).
