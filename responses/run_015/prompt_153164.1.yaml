      *   *PP Attack:* "Boundaries are user-interface, not ontology." Reply: I'm not doing ontology, I'm doing normative accounting. Soft spot: PP might say normative accounting is also just a model.
      *   *Social Epi Attack:* "Who gets to delegate?" Reply: Focus on the dyad, not the distribution. Soft spot: Ignores structural constraints on delegation.
      *   *Psychiatry Attack:* "Confabulators don't correct." Reply: My case stipulates she *does* correct (when evidence clashes), unlike pure confabulation. Soft spot: Stipulation might be clinically unrealistic.
      *   *Grad Attack:* "How to measure?" Reply: Look at repair behaviors. Soft spot: Ambiguous behaviors.
      *   *Knowledge Attack:* "False memory isn't memory." Reply: Process vs. Success distinction. Soft spot: Counterintuitive.
      *   *Collapse Question:* "Is this just internalism with extra steps?"
      *   *Forbidden Question:* "Why does it matter?" (The pragmatic challenge).

  6.  **Refining and Polishing:**
      *   Ensure the tone is professional but direct (seminar table style).
      *   Check timing (2 mins reply = ~250-300 words spoken, keep summaries tight).
      *   Verify the "Collapse" assessment is honest. (It *does* risk collapse if 'accountability' implies internal access).
