      *(Self-Correction during drafting)*: I need to make sure I don't give stock answers. The prompt says "Set aside... coupling-constitution... regress... trust/reliability." So the Internalist objection needs to be more subtle than "It's just coupling." It needs to be about the *normative* locus. The PP objection shouldn't just be "boundaries don't exist," it should be "your condition is a description of a control hierarchy, not a metaphysical claim."

      *Re-evaluating the "Collapse":* If Clause (iii) requires the subject to *recognize* an error to answer for it, that's internal access. If it just requires *behavioral* correction, it's externalist. The risk is that behavioral correction looks like sophisticated tool use (e.g., a carpenter fixing a hammer). The distinction needs to be sharp. I should advise the user to concede that the *criterion* is behavioral but the *implication* is metaphysical.

      *The "Forbidden Question":* Usually, the most dangerous question for EM is "What work is this doing?" If the answer is "none," the project dies. Or, "If the device lies, and you say it's memory, have you just broken the concept of memory?"

