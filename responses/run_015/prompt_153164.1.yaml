          8.  Identify the "Question I am hoping nobody asks."
      *   **Constraints:** Skip stock answers (coupling-constitution, regress, trust/reliability/portability).

  2.  **Deconstruct the Audience & Thesis Interactions:**

      *   *Old-school Internalist:* Will attack the "Accountability" clause. If she corrects the device, isn't *she* the locus of cognition? If the device lies, isn't that just a tool failure, not a cognitive failure? They will smell internalism in the "disposition to answer for errors."
      *   *Predictive Processing (PP):* Will hate the "boundary" talk. "Why are you drawing a line at the skin? The Markov blanket includes the device." They will find the Delegation Condition unnecessary bureaucracy.
      *   *Social Epistemologist:* Will focus on the "availability" and "authority" aspects. Who gets to delegate? What if the device is proprietary? Does this privilege those with tech? Also, "Presumptive Authority" sounds like a social norm, not a metaphysical fact.
      *   *Philosopher of Psychiatry:* Will challenge the analogy between neural confabulation and device confabulation. "Clinical confabulation is a pathology; device error is a bug." They might worry about the normative implications for patient care.
      *   *Grad Students:* Will ask about empirical checkability. "How do we test for 'disposition to answer for errors'?"

  3.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1 (Internalist):* The "Accountability" clause is just internal monitoring. If you have to monitor it to count as extended, the extension is illusory.
      *   *Objection 2 (PP/Active Inference):* Boundaries are pragmatic, not metaphysical. Your condition is just describing a specific control loop, not a cognitive boundary.
      *   *Objection 3 (Social Epi):* Authority is social, not individual. Your condition ignores power dynamics in who gets to delegate.
      *   *Objection 4 (Psychiatry):* The analogy to neural confabulation fails because neural confabulation lacks the "correction" mechanism you require for the device.
      *   *Objection 5 (Grad Students):* How do we operationalize "presumptive authority"? It sounds untestable.
      *   *Objection 6 (Internalist 2):* If the device invents facts, that's not memory, that's imagination. You've redefined memory too broadly.
      *   *Objection 7 (Social Epi/General):* The "Confabulating Surrogate" case seems to prove EM leads to skepticism. If EM makes false memories count as memory processes, EM is self-defeating.
      *   *Objection 8 (PP/Internalist hybrid):* The Delegation Condition requires a homunculus to assign tasks.

      *Refining for Idiom:* Need to make them sound like the specific people described.
      *   *Internalist:* "Constitution vs. Causation" vibes, focusing on the locus of normativity.
      *   *PP:* "Markov blankets," "dissolves," "instrumentalist."
      *   *Social Epi:* "Credibility," "Structural injustice," "Hermeneutical resources."
      *   *Psychiatry:* "Pathology," "Insight," "Clinical picture."
      *   *Grads:* "Empirical traction," "Operationalize."

  4.  **Addressing the Specific Questions:**

      *   *Pressure Point:* Clause (iii) Accountability. It's the most normative and hardest to distinguish from internal monitoring.
      *   *Collapse into Internalism:* This is the big risk. If "accountability" requires internal access to the error, it's internalist. I need to be honest about this.
      *   *Concessions:* Admit that EM doesn't guarantee *knowledge*, only *process*.
      *   *Single Reply:* The "Neural Parity" argument (internal confabulation is just as bad).
