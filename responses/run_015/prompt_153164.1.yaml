          2.  *Predictive Processing/Active Inference (Younger):* Thinks boundaries dissolve/Markov blankets, impatient with location disputes.
          3.  *Social Epistemologist:* Epistemic injustice, access to artifacts/institutions, credit assignment.
          4.  *Philosopher of Psychiatry:* Confabulation, delusion (the reason for the case study).
          5.  *Grad Students (15+):* Sympathetic to externalism but worried about empirical checkability.
      *   **The Thesis:** Reformulation of Extended Mind (EM). Parity Principle is toothless. Proposal: *Delegation Condition* (Assignment, Presumptive Authority, Accountability for Errors).
      *   **The Case:** "Confabulating Surrogate" (Woman with memory device that invents details; she relies on it, corrects it, treats it as memory).
      *   **The Consequence:** She remembers/knows episodes that never happened (process is extended, but justification might fail).
      *   **The Defense:** Separate process membership from entitlement; neural confabulation is structurally identical (internalist can't use unreliability/opacity to block EM).
      *   **Deliverables:**
          1.  ~8 Objections (ordered by damage), phrased in the specific idiom of the audience members.
          2.  2-minute replies for each.
          3.  Note on where the reply is soft.
          4.  Identify the pressure point among the three clauses.
          5.  Assess if Delegation Condition collapses into internalism.
          6.  Advise on concessions to make *in the paper* vs. discussion.
