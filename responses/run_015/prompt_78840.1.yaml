answer: |-
  **Preliminary Framing: Selecting the Research Question**

  Three candidate formulations compete for the core question. *Option 1:* "Should social discount rates match personal discount rates?" This loses because it invites a normative policy debate rather than a structural analysis; an economist could answer "no" based on market distortions without touching the ethical core. *Option 2:* "Does Parfitian reductionism entail intergenerational discounting?" This loses because it assumes the entailment is direct, ignoring the institutional and causal mediators (the disanalogies) that might block it. *Option 3 (Selected):* "Do the standard disanalogies between prudential and intergenerational concern successfully decouple their respective discount functions under a reductionist view of identity?" This wins because it isolates the *mechanism* of the argument. It allows for a determinate answer (e.g., "The agency constraint fails, but the non-identity constraint holds") rather than a vague "it depends," and it forces the formalization required to speak to the interdisciplinary committee.

  ***

  **Project Title:** The Coupling Claim: Formalizing the Link Between Prudential and Intergenerational Discounting

  **Research Question**
  This project asks: **Do the standard disanalogies between prudential and intergenerational concern successfully decouple their respective discount functions under a reductionist view of personal identity?**

  To answer this, I must determine if the structural parallel between "me vs. my future self" and "us vs. future people" survives specific objections. On a reductionist picture (Parfit), the relation to a future self is one of degree (psychological connectedness), similar to the relation to a future stranger. If a rational agent is permitted to discount their own future welfare based on this weakening connection, consistency suggests they may discount future people's welfare similarly (the "Coupling Claim"). The question is determinate: I will test four candidate disanalogies to see if any function as valid logical breakers that permit prudential discounting while forbidding moral discounting.

  **State of the Debate**
  Current literature conflates three distinct notions of pure time preference: (1) descriptive (how we *do* weigh time), (2) prudential (rationality of weighing one's *own* future less), and (3) moral (permissibility of weighing *others'* future less). Economists and philosophers typically treat (2) and (3) as independent. Prudential discounting is defended via sovereignty over one's own life; moral discounting is defended via lack of reciprocity or indeterminacy of claimants. However, if personal identity is reduced to psychological connectedness, the "sovereignty" defense weakens: my future self is, in relevant respects, another person. Existing arguments leave open whether the specific differences between intrapersonal and interpersonal relations (e.g., promises, causal agency) are robust enough to sustain different discount rates. They assert the independence of (2) and (3) without rigorously stress-testing the structural parallels.

  **Methodology and Work Plan**
  Rather than cataloging intuitions about future generations—which yields subjective data that economists cannot utilize—I will reconstruct the four candidate disanalogies as **formal constraints on the discount function**. This translates philosophical arguments into variables an interdisciplinary committee can evaluate.

  The four constraints to be modeled are:
  1.  **The Binding Constraint:** Can I bind my future self (promise/resolution) in ways I cannot bind posterity?
  2.  **The Agency Constraint:** Does the causal route from sacrifice to benefit run through individual agency (prudential) vs. collective institutions (moral)?
  3.  **The Identity Constraint:** Does the Non-Identity Problem make future people's claims contingent on present choices in a way my future self's claims are not?
  4.  **The Gradability Constraint:** Can prudential concern be graded by connectedness while moral concern remains binary?

  **Ten-Week Schedule:**
  *   **Weeks 1–3:** Formalize the "Coupling Claim." Define a baseline discount function $d(t)$ dependent on psychological connectedness $c(t)$.
  *   **Weeks 4–7:** Iteratively introduce the four constraints as modifiers to $d(t)$. For each, construct a "parallel case" (e.g., a prudential scenario where agency is uncertain) to test if the constraint holds symmetrically. If a constraint blocks discounting in the moral case but not the prudential, it survives.
  *   **Weeks 8–10:** Synthesis. Determine which constraints survive. Draft implications for climate economics parameters and write the final paper.

  **Success and Failure Conditions**
  A **successful result** identifies exactly which disanalogies sustain a divergence between prudential and moral discount rates. For example, I may find that the Agency Constraint fails (institutions mediate both cases), but the Binding Constraint holds. This yields a precise argument for why discount rates might differ, legible to economists as a parameter justification.

  **Project failure** would occur if the formalization proves impossible—i.e., if the philosophical concepts (like "moral concern") resist translation into functional constraints without losing their meaning. A **negative result** (e.g., "No disanalogies survive; the Coupling Claim holds") is *not* a failure; it is a substantive philosophical finding implying that consistent agents must either discount neither self nor future people, or both. However, if I find the Coupling Claim holds but it leads to morally repugnant conclusions (e.g., justifying high discount rates for future lives), I will classify this as a *reductio* of the reductionist framework, which is also a valid outcome.

  **Feasibility and Fallback**
  Ten weeks is tight for four formal models. If progress lags by Week 4, I will enact a **fallback strategy**: focus exclusively on the **Agency** and **Identity** constraints. These are the most salient for climate economics (uncertainty of institutional transmission and non-identity of future populations). Dropping the Binding and Gradability constraints narrows the scope but preserves the core contribution to the discount rate debate.

  **Interdisciplinary Payoff**
  For **economists**, this project challenges the standard practice of selecting discount rates based on market interest rates (descriptive) or pure impatience (normative) without distinguishing between prudential and moral justification. If the Coupling Claim holds, the "Ramsey rule" parameters may need adjustment to reflect psychological connectedness rather than mere time. For **political theorists**, it reframes obligations to posterity not as a unique problem of "non-existent people," but as an extension of problems regarding personal identity and rational planning. By translating ethical constraints into functional terms, this proposal offers a shared language for normative economics and moral philosophy to resolve the standoff in climate policy modeling.
