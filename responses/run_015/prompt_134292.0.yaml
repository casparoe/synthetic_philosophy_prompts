  2.  **Deconstruct Modal Realism (Lewisian):**
      *   *Core Thesis:* Possible worlds are real, concrete places, just as real as our own, but spatiotemporally isolated.
      *   *Counterpart Theory:* I am not *in* other worlds. My *counterparts* are there. They resemble me closely but are distinct individuals.
      *   *Modality:* "Could have happened" means "Does happen in some world." "Must happen" means "Happens in all worlds."
      *   *Ethics:* Lewis generally argued that causal isolation means we can't affect other worlds, so standard utilitarian calculations across worlds don't apply in the usual way. However, the *knowledge* of their existence might change our attitude.

