      *   *World B (No Turkish Withdrawal):* Deal fails. Missiles stay in Turkey. Crisis prolongs or escalates.
      *   *Counterparts:* JFK-actual is not JFK-air-strike. They are similar but distinct. The decisions made by JFK-counterpart are *their* decisions, determined by *their* local causes.

