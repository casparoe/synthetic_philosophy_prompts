      *   **Impact on ExComm Reasoning:**
          *   Did *actual* JFK know about Modal Realism? No. So it didn't affect *his* psychology.
          *   Does it affect *our* understanding? It changes the status of "what if." It's not hypothetical; it's *elsewhere*.
          *   *Contingency:* Lewis says everything that happens, happens. But from inside a world, it feels contingent. Why? Because we have counterparts who did otherwise. This explains the *feeling* of choice without requiring "open futures" in the libertarian sense.
      *   **Where the Theory Breaks Down (or Strains):**
          *   *Similarity Metric:* Lewis relies on "closeness" of worlds. Is a world where JFK sneezes closer than one where he orders a strike?
          *   *Policy vs. Fluctuation:* Lewis treats them similarly (just different distributions of matter). But historically, we care about *agency*. Lewis's system is deterministic at the global level (all possibilities are actualised). It struggles to capture the *weight* of moral agency if every choice is made somewhere.
          *   *Contingency:* If all worlds exist, is anything truly contingent? Yes, relative to us. But absolutely, everything is necessary (the pluriverse contains all options). This creates tension with the historical sense of "we almost blew it."
