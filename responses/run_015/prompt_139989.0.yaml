      **Setup and Materials**
      Prepare four packets per participant: Role Card, Evidence Deck, Calculation Sheet, and Voting Ballot. Place two labeled boxes on the central table: "VertCare" and "InsectAid". Provide 100 tokens (representing the currency) and a large die (d100). Prepare a master "Outcome Table" hidden from view. Ensure calculators are available, though lookup tables are preferred for speed. Print the "Neuron Count & Cost Ledger" separately. The room should be arranged in a single circle to enforce committee dynamics. No projectors or screens. The facilitator holds the master key for parameters (alpha, sentience truth, replacement rates) sealed in an envelope until the end. Materials must be physically handable to emphasize the tangible weight of the decision.

      **Roles, Rules, and Staged Information**
      Assign each participant a Role Card stating their private prior probability that insects are sentient (ranging from 1% to 99%). Distribute these evenly to ensure conflict. Divide the 100 minutes into three funding rounds. In each round, participants receive new Information Packets. Round 1 provides headline numbers: VertCare helps 1,000 vertebrates at 1 unit each; InsectAid helps 1,000,000 insects at 0.001 units each. Participants privately allocate 10 tokens. Round 2 introduces Evidence Decks. Both charities present identical behavioral data (avoidance learning, trade-offs), but VertCare cites mammals while InsectAid cites flies. A hidden "Phylogenetic Penalty" applies to InsectAid scores, unknown to participants. Round 3 reveals ecological mechanics. VertCare reduces demand (population drops); InsectAid prevents death but population remains stable due to resource limits (replacement). Participants also receive the "Neuron Ledger": vertebrates have 100 million neurons, insects 1 million. Welfare scales by neurons^α, but α is hidden (could be 0, 0.5, or 1).

      Participants must discuss and agree on a final allocation of the remaining 70 tokens. If consensus fails, a vote occurs, but dissenters must sign their ballot. Every participant must submit a private allocation before discussion begins in each round to prevent free-riding. The facilitator acts only as a banker and timekeeper, refusing to answer empirical questions not covered in the packets. The rules forbid pooling private priors explicitly; participants must argue from the public evidence while holding their private confidence levels. This tension forces them to negotiate without resolving the underlying uncertainty. The lookup tables convert token allocation into "Potential Impact Points" based on the hidden parameters, ensuring no arithmetic delays.

      **Scoring and Stakes**
      The 100 units of currency are real and will be donated according to the final committee ratio. However, the pedagogical stakes rely on the "Impact Reveal." At the session's end, the facilitator rolls the d100 to determine the "Sentience Truth" for insects. If the roll exceeds the threshold (unknown until now), InsectAid's impact is multiplied by 1,000,000; otherwise, it is zero. VertCare's impact is guaranteed but capped. Additionally, the facilitator reveals the hidden α value and the Replacement Rate. Participants compare their allocated tokens against the realized impact. There is no prize for winning, but the discrepancy between their confidence and the outcome highlights the risk structure. The real money ensures the choice is not abstract, while the simulated impact points reveal the structural vulnerabilities in their reasoning.

      **Timeline**
      **00–05:** Introduction. Hand out materials. Explain the budget and the two charities. No theory provided.
      **05–20:** Round 1. Participants review headline numbers and costs. Private allocation of 10 tokens. Brief table discussion on initial impressions.
      **20–45:** Round 2. Distribute Evidence Decks. Participants review behavioral data. Private allocation of 20 tokens. Small group discussion on evidence quality.
      **45–70:** Round 3. Distribute Ecological and Neuron Packets. Reveal replacement mechanics and neuron counts. Private allocation of 20 tokens. Full committee deliberation begins.
      **70–90:** Final Consensus. Committee must agree on the final 50 tokens. Dissenters record their position. Final ballots collected.
      **90–100:** Outcome Reveal. Facilitator opens the sealed envelope. Rolls the die. Reveals hidden parameters. Brief transition to debrief.

      **What Participants Should Run Into, and When**
      In Round 1, they encounter **Cheapness is Ambiguous**. The sheer volume of insects makes the cost-per-life vanishingly small, tempting them to allocate heavily based on scale alone. They feel the pull of the numbers without knowing what those numbers buy. In Round 2, they hit **Proxy Transfer**. The evidence looks identical across charities, but biology visitors may instinctively distrust the insect data. They realize the evidence strength depends on an uncheckable assumption about phylogenetic distance. In Round 3, **Replacement** emerges. They see that preventing insect deaths does not reduce the total number of insects living, unlike the vertebrate case. Simultaneously, the **Hidden Scaling Exponent** creates anxiety; without knowing α, they cannot compare one vertebrate life to many insect lives. Finally, the die roll demonstrates **Fan-out**. They realize their insect funding was not diversified across many independent chances of sentience, but one massive bet on a single biological truth.

      **Debrief**
      Begin by revealing the hidden parameters. Ask participants how the outcome compared to their expectations. Now introduce the forbidden terms to name their experience.

      First, address **Fan-out**. Explain that the die roll represented the single binary state of insect sentience. Unlike a portfolio of independent stocks, every insect's moral status was correlated. They felt the risk of putting all resources into one binary outcome, even if the upside was astronomical.

      Second, discuss the **Hidden Scaling Exponent**. Reveal the α value used. If α was low, the many small brains mattered little; if high, they dominated. Emphasize that their decision was sensitive to a parameter they could not know, illustrating the fragility of the scale argument when welfare capacity is non-linear.

      Third, unpack **Replacement**. Show the ecological data again. Clarify that "individuals affected" was a headline number, but the counterfactual difference was near zero for insects due to resource limits. Contrast this with the vertebrate demand curve.

      Fourth, examine **Proxy Transfer**. Point out the identical evidence cards. Explain that the validity of that evidence relies on transferring vertebrate calibration to insects. The uncertainty wasn't just about the behavior, but about the link between behavior and experience across phylogeny.

      Fifth, revisit **Cheapness**. Ask why insect intervention was so cheap. Suggest it may reflect neglectedness or ease of measurement, not necessarily welfare magnitude. The low cost invited investment, but also signaled potential lack of depth.

      Conclude by connecting these to the scale argument. The argument relies on multiplying probability by population. This activity showed that probability is not independent per individual (Fan-out), population counts may not reflect counterfactuals (Replacement), and the moral weight per individual is unknown (Scaling). The scale argument collapses or explodes based on these hidden variables, which participants felt viscerally through the allocation process.

      **What Will Go Wrong the First Time I Run It**
      Participants may fixate on the real money and treat it as a game to win rather than a moral dilemma. If they ask for the "correct" answer, refuse firmly; the ambiguity is the point. Biology visitors might dominate the empirical claims; instruct them to stick to their Role Card priors if they become too authoritative. Arithmetic errors will occur despite lookup tables; have a facilitator assistant verify calculations quickly. Some may refuse to accept the binary die roll as representative of sentience; acknowledge this limitation but insist on the mechanic for the sake of the model. Timekeeping is critical; if Round 3 drags, cut the Final Consensus short to preserve the Debrief. If consensus is impossible, force a vote immediately to ensure the activity completes. Finally, participants may leave feeling paralyzed; emphasize in the debrief that recognizing these complexities is the goal, not solving them.

      **What the Activity Cannot Deliver**
      This simulation cannot resolve the actual moral status of insects. It creates a structured uncertainty but cannot tell participants whether insects *are* sentient. It also cannot capture the qualitative difference between vertebrate and insect experience, reducing welfare to neuron counts and behavioral proxies. The binary die roll simplifies the probability of sentience into a single switch, whereas reality may involve gradations of capacity. Finally, the activity cannot teach the moral weight of uncertainty itself; it shows the structural risks, but the facilitator must explicitly state that acting under deep ignorance carries its own ethical burden beyond the calculated expected value.

