      Conclude by connecting these to the scale argument. The argument relies on multiplying probability by population. This activity showed that probability is not independent per individual, population counts may not reflect counterfactuals, and the moral weight per individual is unknown. The scale argument collapses or explodes based on these hidden variables, which participants felt viscerally through the allocation process. (498 words) - *Good.*

