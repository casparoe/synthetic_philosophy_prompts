      *   **Goal:** Assess exposure/risk of this position. Identify counter-arguments (ranked fatal to awkward). Distinguish concessions vs. critic claims. Evaluate specific "levers" (Copy, Sealed-world, Price-tag, Recomputed, Server shutdown). Assess falsifiability/risk. Compare to rivals (Full Realists vs. Error Theorists). Address the specific AI character case.

