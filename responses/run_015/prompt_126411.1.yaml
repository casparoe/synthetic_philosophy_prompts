          *   *Strategic Advice:* If the goal is consistency with Case 5 (which is factually closest regarding the physiology), vote "Treat." If the goal is institutional accountability (Case 6), vote "Send Back."
          *   *My Recommendation:* "Treat" (Fund), but with a caveat note. Why? Because Case 5 established that shift-induced decline warrants intervention even without disorder. The "newness" of the program is an administrative issue, not a medical/ethical one for *this* committee (which rules on health funding, not curriculum design). However, the "Send Back" argument is strong philosophically.
