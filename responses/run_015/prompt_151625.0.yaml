      *   *Core Tension:* Recognition isn't just "being nice." It's constitutive of self-consciousness. I am only a "self" if another "self" acknowledges me.
      *   *Master-Slave:* The Master demands recognition without giving it (one-sided). The Slave finds recognition through working on the world (formative labor), eventually becoming the independent consciousness.
      *   *Mutual Recognition:* The goal. Both parties acknowledge each other as independent yet bound.
      *   *Avoid Liberal "Respect":* Don't ask "Do you feel respected?" Ask "Is your agency acknowledged in the objectification of your work?" or "Is the demand for recognition parasitic on the denial of the other?"
      *   *Formative Labor:* Recognition comes from seeing oneself in the work *and* having that seen by others.

