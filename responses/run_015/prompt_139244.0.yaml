answer: |-
  Think of the demon not as a little guy, but as a co-processor attached to a gas cylinder. The gas state is your input register; the demon's memory is a scratch bit. The cycle is a function call: `work = extract_work(gas, demon_bit)`.

  **The Bennett Move in CS Terms**
  Measurement is a CNOT gate: `demon_bit ^= molecule_position`. This is logically reversible; no heat is generated. You now have one bit of mutual information between the demon and the gas. You use this bit to control a piston (a conditional move). If the bit is 1, let the molecule push the piston; you extract $kT \ln 2$ of work.

  Here is the catch: To make this a *cycle* (a loopable function), the demon must return to its initial state (all zeros) at the end of the scope. In reversible computing, you usually uncompute scratch space by running the circuit backward. But if you run the measurement backward now, you must also reverse the piston move to conserve unitarity. You give the work back to the gas. You get clean bits, but zero net profit.

  To keep the work *and* reset the demon bit to 0 without reversing the piston, you must break the reversible chain. You have to overwrite the demon's bit. This is `free()` without `malloc()`—you are collapsing two physical states (0 and 1) into one (0). That compression of phase space dumps $kT \ln 2$ of heat into the environment. The cost isn't in reading (CNOT); it's in resetting the stack frame to run the loop again.

  **Case (a): The Never-Erase Demon**
  Your intuition is right: this isn't free work, it's fuel consumption. Handing the demon an infinite tape of zeros is like handing a car an infinite tank of refined gasoline. The zeros are low-entropy resources (negentropy). By XORing measurements onto fresh bits, the demon is transferring entropy from the gas to the tape. The tape goes from ordered (000...) to disordered (random data).

  The thermodynamic debt isn't paid when the demon writes; it was paid when someone manufactured the zeroed tape. To reuse the tape, you must reset it, which costs energy. If you never reset, you aren't building a perpetual motion machine; you're building a engine that burns blank tape. Landauer's principle isn't a red herring; it just shifts the location of the cost from the *operation* to the *resource provisioning*.

  **Case (b): The Sloppy Demon**
  The accounting scales with mutual information $I(X;Y)$. If the sensor is noisy, the demon's bit is only partially correlated with the gas. You can't extract full work because your conditional move is sometimes wrong (letting the molecule hit a closing piston). The extractable work is bounded by $kT \cdot I(X;Y) \cdot \ln 2$.

  Does this support "information is fuel"? Yes, but specifically *correlation* is fuel. A random bit in memory has high Shannon entropy but zero mutual information with the gas; it buys you no work. A correlated bit has lower conditional entropy relative to the gas, allowing you to sort states. The noise reduces the quality of the fuel, not the cost of erasing it. You still pay $kT \ln 2$ to erase the bit, but you might have extracted less than that in work, resulting in a net loss.

  **Residue Report**
  Here is the mapping fidelity:

  1.  **$H$ vs. $S$:** They are the same variable with different units. Shannon entropy $H$ counts bits; Thermodynamic entropy $S$ counts physical microstates. $S = k_B \ln 2 \cdot H$. If you treat a bit as an abstract logical value without a physical substrate, the mapping breaks. A bit must be instantiated (voltage, spin, molecule position) to have entropy. If it's not physical, it can't interact with the gas, and the engine stalls.
  2.  **Meaning vs. Correlation:** There is no physical difference between a bit that "means" left and a bit that is merely correlated. Physics is syntax-only. If a bit in your cache is correlated with the gas state, you can extract work using it, regardless of whether your code comments say `MOLECULE_LEFT` or `RANDOM_GARBAGE`. The "meaning" is an external label; the "correlation" is the physical coupling that allows work extraction.
  3.  **The Gap:** The only thing your vocabulary struggles with is *equilibrium*. In CS, state changes are triggered by instructions. In stat mech, systems drift toward high-entropy states spontaneously. But for the demon, this doesn't matter. The core insight holds: you cannot reduce the entropy of the gas (sort it) without increasing the entropy of the demon (filling its memory), and you cannot clear that memory without dumping heat.

  The leftover bits aren't a gap in your thinking; they're a sign the philosophy is thinner than it looks. Once you accept that information is physical and correlation is a resource, the paradox dissolves into bookkeeping. You aren't missing a physics concept; you're just realizing that `free()` has a system call cost.
