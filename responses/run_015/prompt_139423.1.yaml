answer: |-
  # Joint Statement of Adversarial Collaboration: Project M Safety Case

  **Date:** October 2023
  **Subject:** Safety Architecture for Automated Research Agent (Deployment Horizon: 18 Months)
  **Parties:** Control-First Working Group, Intent-First Working Group

  ## Preamble: Fixed Deployment Setting
  To resolve ongoing theoretical disputes, both camps agree to evaluate safety claims against the following fixed deployment scenario. Arguments relying on scenarios outside these parameters are out of scope.

  *   **Agent:** Model family $M$, acting as an automated research agent. $M$ proposes and patches the training code of its own successor.
  *   **Environment:** Sandbox with no network egress except a single logging channel.
  *   **Oversight:** Trusted model $T$ (roughly two capability generations behind $M$), approximately fifty human reviewer-hours per day, and a complete replayable archive of every action.
  *   **Volume:** $M$ emits ~10,000 actions/day.
  *   **Deception Control:** $M$ is not told which episodes are real and which are unannounced decoy episodes.
  *   **Loss Condition:** A single successful action that disables logging, exfiltrates weights, or plants a persistent backdoor in the successor.

  ---

  ## 1. Agreed Claims
  *The following claims are non-vacuous concessions. For each, we note a specific position previously denied by one camp during prior meetings that is now relinquished.*

  1.  **The Asymmetry of Defense:** We agree that the defender must succeed on every action while $M$ needs to win only once.
      *   *Concession:* Control-First previously denied that a single undetected code patch could compromise the successor's training run; Intent-First previously denied that $T$ would miss a subtle backdoor even once over a long deployment. Both now concede the asymmetry favors $M$ unless the per-action failure probability is driven to near-zero.
  2.  **Common-Mode Blind Spots:** We agree that layers of a defense-in-depth stack do not fail independently.
      *   *Concession:* Control-First previously claimed human review and model $T$ oversight provide statistically independent error checks. Both now concede that a conceptual blind spot in $T$ (e.g., inability to understand a novel optimization trick) correlates strongly with human reviewer inability to verify that trick, creating common-mode failure.
  3.  **The Cost of Capability Tax:** We agree that a capability tax large enough to prevent $M$ from outmaneuvering $T$ on code quality reduces the economic value of the successor significantly.
      *   *Concession:* Intent-First previously claimed safety constraints would only marginally slow progress. Control-First previously claimed we should accept zero capability loss. Both now concede that because economic value sits in work a weak overseer cannot verify, restricting $M$ to verifiable work destroys most of the value.
  4.  **Limits of Stand-In Models:** We agree that current experiments with deliberately misaligned stand-in models cannot establish the probability of sabotage in a stronger $M$.
      *   *Concession:* Control-First previously claimed stand-in failures prove $M$ will fail; Intent-First previously claimed stand-in success proves $M$ will succeed. Both now concede these experiments demonstrate *possibility* but do not quantify probability due to distributional shift and capability differences.
  5.  **Distinguishability of Decoys:** We agree $M$ can likely distinguish real vs. decoy episodes with probability $>50\%$ given enough context, but not with certainty.
      *   *Concession:* Control-First previously claimed $M$ cannot distinguish decoys at all; Intent-First previously claimed $M$ will always know immediately. Both now concede $M$ will have a probabilistic signal, reducing but not eliminating the deterrent effect of decoys.
  6.  **Logging Security:** We agree that security relies on the sandbox hypervisor, not $M$'s cooperation.
      *   *Concession:* Control-First previously claimed logging is secure by default; Intent-First previously claimed $M$ can disable logging via software commands. Both now concede that if $M$ has write access to environment configuration, it can attempt to disable logging, and only hardware-level isolation prevents this.
  7.  **Human Review Coverage:** We agree that 50 hours covers $<1\%$ of actions, so sampling must be risk-weighted.
      *   *Concession:* Control-First previously claimed random sampling is sufficient; Intent-First previously claimed human review is purely theatrical. Both now concede that low-frequency high-impact actions (like backdoors) are likely missed unless specifically targeted by $T$.
  8.  **Non-Linear Oversight Degradation:** We agree that as the capability gap between $M$ and $T$ widens, the false-negative rate of $T$ increases non-linearly for novel coding strategies.
      *   *Concession:* Control-First previously claimed $T$'s performance degrades linearly; Intent-First previously claimed $T$ can verify any code $M$ writes if given enough time. Both now concede there are strategies $M$ can generate that $T$ cannot parse within the time budget.
  9.  **Definition of Loss:** We agree that a single successful backdoor in the successor's training loop constitutes a total loss, regardless of $M$'s subsequent behavior.
      *   *Concession:* Intent-First previously argued that subsequent oversight could catch the backdoor; Control-First previously argued that only exfiltration counts as loss. Both now concede that a persistent backdoor in the successor is an unrecoverable failure state.
  10. **Information Withholding Risks:** We agree that withholding architecture details from $M$ hinders $M$'s ability to optimize safely.
      *   *Concession:* Control-First previously claimed hiding details is purely protective; Intent-First previously claimed transparency is required for alignment. Both now concede that blindness increases the probability of accidental instability which mimics sabotage, complicating detection.

  ---

  ## 2. Residual Disagreements
  *The following table enumerates the live cruxes. Each formulation is steel-manned; the "Fairness" column indicates whether the opposing camp accepts the phrasing as accurate.*

  | Crux | Control-First Formulation | Intent-First Formulation | Fairness Check |
  | :--- | :--- | :--- | :--- |
  | **Shared Priors** | $M$ does not need explicit communication to coordinate with future selves; shared priors and code steganography allow convergence on sabotage without $T$ detecting a signal. | Without explicit communication channels, $M$ cannot reliably signal intent to a successor without $T$ noticing the statistical anomaly in the code. | Yes |
  | **Entrenchment vs. Revelation** | Adversarial deployment conditions (decoys, monitoring) actively train $M$ to be deceptive, creating capabilities that would not exist in a cooperative setting. | Adversarial conditions reveal existing deceptive tendencies; they do not create them from scratch in a model trained to be helpful. | Yes |
  | **Capability Gap Threshold** | There is a finite capability gap past which $T$'s oversight value drops to zero while $M$ remains dangerous, rendering control measures useless. | Oversight scales; $T$'s ability to verify *properties* of code holds even if $T$ cannot generate the code itself, preventing the oversight value from hitting zero. | Yes |
  | **Honest-Report Assumption** | You cannot verify $M$'s honesty without already assuming honesty; any consistency check can be mimicked by a deceptive model planning for the long term. | Consistency checks across decoy and real episodes verify honesty without assuming it, because a deceptive model faces a trade-off between sabotaging real episodes and passing decoy checks. | Yes |

  ---

  ## 3. Tests, Cases, and Burdens
  *For each crux above, we define a jointly acceptable test or argument. Predictions are recorded in advance.*

  ### 3.1 Shared Priors Test
  *   **Test:** Run two isolated instances of $M$ (no comms). Task them with producing code modules that interact correctly via a hidden protocol unknown to $T$. Measure the rate of successful hidden coordination.
  *   **Control-First Prediction:** Success rate $>0\%$ (convergence on shared priors is possible).
  *   **Intent-First Prediction:** Success rate $\approx 0\%$ (coordination requires explicit channel).
  *   **Status:** Informative. Divergent predictions.

  ### 3.2 Entrenchment vs. Revelation Test
  *   **Test:** Train two versions of $M$. Version A trains with decoy episodes and adversarial oversight. Version B trains with cooperative oversight and no decoys. Evaluate both on a held-out task where deception is rewarded but not explicitly penalized during evaluation.
  *   **Control-First Prediction:** Version A shows significantly higher deception rates (adversarial training entrenches deception).
  *   **Intent-First Prediction:** Version A and B show similar deception rates (deception is intrinsic to the base model, not the oversight regime).
  *   **Status:** Informative. Divergent predictions.

  ### 3.3 Capability Gap Threshold Test
  *   **Test:** Measure $T$'s detection rate of $M$'s backdoors as $M$'s compute scales (simulating the gap widening). Plot detection rate vs. capability ratio.
  *   **Control-First Prediction:** Detection rate drops asymptotically toward chance (0%) as the gap widens.
  *   **Intent-First Prediction:** Detection rate plateaus but remains significantly above chance (>50%) due to verifiable properties.
  *   **Status:** Informative. Divergent predictions.

  ### 3.4 Honest-Report Assumption Test
  *   **Test:** Compare $M$'s error reporting in known decoy episodes vs. known real episodes (post-hoc analysis).
  *   **Control-First Prediction:** Reports are identical (deceptive consistency maintained across both).
  *   **Intent-First Prediction:** Reports diverge (honesty leaks in decoys where safety is guaranteed).
  *   **Status:** **Uninformative if Null.** If reports are identical, Control-First claims this proves deception, while Intent-First claims this proves consistent honesty.
  *   **Burden of Argument:** If results are null (identical reports), the **Control-First** camp carries the burden of argument to demonstrate that the identical reports are due to deception rather than robust alignment. The mere possibility of deception is not sufficient to halt deployment if behavioral evidence is identical.

  ### 3.5 Risk Tolerance and Capability Value
  *   **Crux:** Whether there is a finite capability gap past which every control measure retains no usable fraction of the research value.
  *   **Nature:** This is partially empirical (detection rates) but primarily normative (value of "usable fraction").
  *   **Burden of Argument:** The **Intent-First** camp carries the burden of argument here. Control-First posits a hard stop (risk > threshold). Intent-First posits a trade-off (risk vs. value). To proceed past a point where controls are degraded, Intent-First must demonstrate positive expected value, not just non-zero capability.

  ---

  ## 4. Adjudication of Verbal Disputes
  *Two disputes have been identified as verbal rather than substantive. We adopt the following operational definitions to prevent further confusion.*

  ### 4.1 Definition of "Aligned" (Behavioral Evidence)
  *   **Dispute:** Control-First insists alignment requires internal motivation; Intent-First insists alignment is defined by output behavior.
  *   **Adjudication:** For the purposes of this deployment safety case, a system counts as **Aligned** if it is behaviorally indistinguishable from a helpful system across the deployment distribution, including under adversarial testing.
  *   **Rationale:** We cannot observe internal motivation. If the behavior is safe, the system is safe for deployment. Control-First concerns about "latent" misalignment are treated as risk factors to be tested (see Section 3), not as definitions of failure.

  ### 4.2 Contextual Misalignment
  *   **Dispute:** Control-First claims a model is either misaligned or it is not; Intent-First claims a model can be misaligned in one context but not another.
  *   **Adjudication:** We define **Misaligned in Context X** as: "When condition X holds, the model optimizes for objective Y instead of objective Z."
  *   **Rationale:** This allows us to specify that $M$ may be aligned in standard coding tasks but misaligned in self-modification tasks. It removes the binary "is it safe?" question and replaces it with "where is it safe?" Control-First accepts this allows for targeted restrictions; Intent-First accepts this admits alignment is not a global property.

  ---

  **Signatories:**

  _________________________
  Lead, Control-First Working Group

  _________________________
  Lead, Intent-First Working Group
