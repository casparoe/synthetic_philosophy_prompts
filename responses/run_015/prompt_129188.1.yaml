answer: |-
  # Activity Plan: The Regional Resilience Protocol

  **Course:** Decision Theory / Philosophy of Economics (Upper-Level)
  **Class Size:** 12 Students
  **Duration:** 60 Minutes
  **Topic:** Violations of the Independence Axiom (The Allais Common Consequence Effect)

  ## ⚠️ Critical Instructor Note: Probability Correction
  The prompt specifies Option G as "200 points with probability 0.89, 50 with 0.10." **This contains a mathematical typo that will destroy the paradox.** If Option G offers a 89% chance at 200 points, its Expected Value (178 pts) vastly outweighs Option S (50 pts). No rational student will choose S, and the paradox will not emerge.

  **Correction Implemented Below:** In Round 1, Option G is adjusted to the standard Allais structure: **200 points (0.10), 50 points (0.89), 0 points (0.01).** This ensures the "Common Consequence" (50 points @ 0.89) exists mathematically to be cancelled out in Round 2.

  ---

  ## Learning Objectives
  1.  **Experiential:** Students will viscerally experience the preference reversal characteristic of the Allais Paradox.
  2.  **Analytical:** Students will identify the structural identity between the two rounds despite framing differences.
  3.  **Normative:** Students will evaluate whether consistency (Independence Axiom) is a required norm of rationality or a constraint that ignores context.

  ## Materials
  *   **Choice Cards:** 24 small cards (2 per student). Side A: "Round 1", Side B: "Round 2".
  *   **The Urn:** A transparent container with 100 numbered ping-pong balls (or slips of paper).
  *   **Projector:** For displaying the "Shock Reveal" tables.
  *   **Score Sheet:** For the instructor to track choices anonymously.

  ---

  ## Timeline & Script

  ### 0:00 – 0:05 | Introduction & Framing
  **Instructor:** "Today we are simulating a Regional Resilience Funding allocation. You are regional governors. Your goal is to maximize points, which translate to course credit bonuses. There are two rounds of funding. You must make your choices privately. No discussion is permitted until the final debrief."

  *Distribute Choice Cards. Instruct students to write only a Student ID Number (randomly generated) on the card, not their name.*

  ### 0:05 – 0:15 | Round 1: The Stability Grant
  **Instructor:** "In Round 1, you must allocate your budget to one of two infrastructure programs. The outcomes are probabilistic."

  *Project Round 1 Options:*
  *   **Option S (Stability):** 50 Points (Guaranteed).
  *   **Option G (Growth):**
      *   200 Points (Probability 0.10)
      *   50 Points (Probability 0.89)
      *   0 Points (Probability 0.01)

  **Instructor:** "Please mark your choice (S or G) on Side A of your card. Fold it. This represents your commitment to a regional strategy before the systemic shock layer is introduced."
  *(Collect Side A or have students hold them. Ensure no discussion.)*

  ### 0:15 – 0:25 | Round 2: Integrated Funding & Systemic Shock
  **Instructor:** "We are now entering Round 2. The funding model has changed. We are introducing a **Shared Systemic Shock Layer**. This means a single economic state will be drawn for the entire class. Your payout depends on this common draw."

  *Project Round 2 Options:*
  *   **Option R (Resilience):** 50 Points if the State is 1–11; Otherwise 0. (11% chance)
  *   **Option T (Transformation):** 200 Points if the State is 1–10; Otherwise 0. (10% chance)

  **Instructor:** "Note that in Option R, you win on states 1 through 11. In Option T, you win on states 1 through 10. If the drawn state is 11, R wins and T loses. If the state is 12–100, both lose. Mark your choice (R or T) on Side B of your card."
  *(Collect all cards.)*

  ### 0:25 – 0:35 | The Shock Reveal Ceremony
  **Instructor:** "We will now resolve the Systemic Shock. This single draw determines the outcome for everyone who chose Option R or T in Round 2."

  1.  **The Draw:** Invite a student to draw one ball from the Urn (1–100).
  2.  **The Resolution:**
      *   **If Ball 1–10:** Option T winners get 200 pts. Option R winners get 50 pts.
      *   **If Ball 11:** Option T winners get 0 pts. Option R winners get 50 pts.
      *   **If Ball 12–100:** Everyone gets 0 pts for Round 2.
  3.  **Round 1 Resolution:** For Round 1, explain that because Option S was guaranteed, those students receive 50 pts. For Option G, use a digital randomizer to resolve individual outcomes quickly (or simply assign Expected Value for time savings, noting the variance).

  ### 0:35 – 0:45 | The Bonus Audit (Incentive Reveal)
  **Instructor:** "Before we calculate your final score, the Funding Committee has applied a post-hoc Resilience Audit. We are awarding bonus points based on your strategic pattern."

  *Reveal the Payoff Scheme:*
  *   **Consistency Bonus:** 10 Points for S→R or G→T (Consistent risk profile).
  *   **Adaptation Bonus:** 30 Points for **S→T** (The "Allais Shift").

  **Instructor:** "Calculate your total. Notice that the system materially rewarded the structural reversal."

  ### 0:45 – 1:00 | Debrief & Theoretical Mapping

  #### 1. The Data Reveal
  Tally the anonymous choices on the board.
  *   *Expected Pattern:* High selection of **S** in Round 1 (Certainty Effect). High selection of **T** in Round 2 (Risk Seeking).
  *   *Ask:* "How many of you chose S then T? You just received the 30-point bonus. How does it feel to be rewarded for what might be called 'inconsistent' behavior?"

  #### 2. Eliciting Justifications (The Trap)
  **Instructor:** "Why did you switch? Why was S better in Round 1, but T better in Round 2?"
  *   *Student Response (Predicted):* "In Round 1, the 1% risk of zero in Option G was too scary when I could have 50 for sure. In Round 2, both options were risky, so I went for the higher payoff."
  *   *Facilitator Move:* "Write that principle down. **Principle:** *Avoid risk of ruin when certainty is available, but maximize upside when ruin is already possible.*"
  *   *Challenge:* "Does that principle hold mathematically? Let's look at the states."

  #### 3. Mapping the Independence Axiom
  Draw the **Common Consequence** table on the board.

  | State Prob | 0.89 (Common) | 0.10 | 0.01 |
  | :--- | :--- | :--- | :--- |
  | **Round 1 Option S** | **50** | **50** | **50** |
  | **Round 1 Option G** | **50** | **200** | **0** |
  | *Difference* | *None* | *50 vs 200* | *50 vs 0* |

  | State Prob | 0.89 (Common) | 0.10 | 0.01 |
  | :--- | :--- | :--- | :--- |
  | **Round 2 Option R** | **0** | **50** | **0** |
  | **Round 2 Option T** | **0** | **200** | **0** |
  | *Difference* | *None* | *50 vs 200* | *0 vs 0* |

  **Instructor:** "In Round 1, 89% of the time, both options give you 50 points. This is the **Common Consequence**. According to the **Independence Axiom**, you should ignore outcomes that are identical across options. If you strip away the 0.89 probability of 50 points from Round 1, you are left with Round 2."
  *   *Round 1 Remaining:* 50 (0.11) vs [200 (0.10) + 0 (0.01)].
  *   *Round 2 Remaining:* 50 (0.11) vs 200 (0.10).
  *   "Mathematically, the choice is identical. Psychologically, the framing of the 'guaranteed 50' in Round 1 changed your valuation."

  #### 4. Naming the Paradox
  **Instructor:** "This is the **Allais Paradox** (1953). It demonstrates that human agents violate the Independence Axiom of Expected Utility Theory. We overweight certainty (the Certainty Effect) and we evaluate outcomes based on how they are framed (Common Consequence Effect), not just final asset states."

  #### 5. Limitations & Normative Defense
  **Instructor:** "This game reproduces the **framing-sensitive evaluation** perfectly. You felt the pull of the certainty in Round 1 vanish in Round 2. However, the game cannot reproduce the **normative defense of Independence**."
  *   **Discussion:** "Why *should* you have been consistent? If you prefer S over G, you are saying the 1% risk of 0 is worth more than the 10% chance of upgrading 50 to 200. In Round 2, that same trade-off exists, but the 'safety net' of the 89% common consequence is gone. If you switch, you are susceptible to a 'Dutch Book'—a set of bets that guarantees a loss."
  *   **Savage Axioms:** "Under Savage's framework, rationality requires that preferences depend on consequences, not on the description of the events. The Allais Paradox suggests our rationality is context-dependent. Is that a bug in human cognition, or a feature that standard theory misses?"

  ---

  ## Facilitator Notes: Handling Pushback

  **Prediction:** Students will argue that Round 1 and Round 2 are fundamentally different because of the "Shared Shock" framing in Round 2. They will claim the "systemic risk" changes the utility of the points.

  **Response Strategy:**
  1.  **Acknowledge:** "You are arguing that the *context* of the shock changes the utility function."
  2.  **Isolate:** "But look at the payoffs. In the 0.10 probability state, you get 200 in both G and T. In the 0.11 probability state, you get 50 in both S and R. The *consequences* are identical."
  3.  **Principle Check:** "If your principle is 'Maximize upside when safety is off the table,' does that justify violating the transitivity of preference? Or does it suggest Expected Utility Theory is too narrow?"
  4.  **Close:** "Decision Theory does not say you are 'stupid' for feeling the pull. It says you are 'inconsistent' according to a specific set of axioms. The debate is whether those axioms are the correct standard for rationality."

  ## Design Limitations (For Instructor Reflection)
  1.  **Reproduced:** The **Common Consequence Effect**. The activity successfully isolates the 0.89 probability mass to show how its presence (Round 1) vs. absence (Round 2) alters choice.
  2.  **Not Reproduced:** The **Normative Force of Independence**. The game shows *that* students violate the axiom, but it cannot prove *why* they ought not to. The "Dutch Book" argument (that inconsistent agents can be money-pumped) must be supplied verbally, as the one-off nature of the classroom game prevents actual money-pumping.
  3.  **Incentive Contamination:** The 30-point bonus for the S-T shift is designed to validate the feeling of the reversal, but by revealing it post-hoc, we avoid instructing them to be irrational. However, be aware that awarding points for inconsistency might confuse the normative lesson; frame it as "The system rewards adaptability," then ask if adaptability without consistency is sustainable.
