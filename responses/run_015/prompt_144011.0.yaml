answer: |-
  Distinguished guests, colleagues, members of the convener's family, and friends.

  It is a profound honour to stand before you to open this workshop, and a particular privilege to do so as a student of this department. We are gathered to discuss collective reasoning in democratic institutions, a topic that sits at the very heart of the PPE curriculum. Yet, in honour of our retiring convener, whose career has been defined by rigorous structural inquiry rather than rhetorical flourish, I intend to use my few minutes not merely to welcome you, but to define the boundaries of what we can reasonably expect to achieve together today.

  To do this, I must borrow a tool familiar to half of this room and perhaps unfamiliar to the other half. I refer to the Condorcet Jury Theorem. For those to whom this is new, the intuition is simple. It suggests that if a group of individuals is tasked with answering a question, and if each individual is more likely than not to be correct, and if they make their judgments independently, then the probability of the majority being correct increases as the group size increases. In short: under specific conditions, the many are wiser than the few.

  However, I am not invoking Condorcet to offer a simple celebration of democracy. We are not here to vote, and I am not here to promise that thirty people in a seminar room can solve the crises of modern governance. Instead, I want to use the theorem's conditions as structural scaffolding for the day ahead. The theorem does not guarantee wisdom; it guarantees wisdom *only if* its preconditions are met. If we ignore those preconditions, we risk not just error, but the illusion of consensus.

  The standard version of the theorem assumes a binary choice: guilty or not guilty, true or false. But the subject of this workshop—collective reasoning in democratic institutions—is not binary. It is multidimensional. This brings us to a complication often overlooked in introductory treatments: the problem of dimensional competence.

  When we deliberate on democratic institutions, we are rarely judging a single fact. We are navigating at least three distinct axes simultaneously. There is the empirical axis: *what* is happening? There is the normative axis: *what* ought we to do? And there is the conceptual axis: *what* do we mean by the terms we are using?

  In this room, competence is not distributed evenly across these axes. A political scientist in our midst may be highly competent on the empirical dimension but less so on the normative philosophical underpinnings. A philosopher may excel at conceptual clarity but lack the economic data to assess feasibility. Crucially, competence here is not binary. One cannot simply be 'competent' or 'incompetent' overall. We are all specialists in different dimensions of the same problem.

  This creates a specific tension for our workshop design, and it requires me to be explicit about what I can and cannot promise regarding our collective output.

  The Condorcet theorem relies heavily on the condition of independence. Voters must not be unduly influenced by one another. Yet, the very purpose of a workshop is interdependence. We are here to persuade, to learn, and to shift our views in light of better arguments. If we simply debate until we agree, we violate the independence condition. We risk creating a cascade where the most eloquent voice, rather than the most competent judgment, dictates the group's conclusion. In a small group of thirty, this correlation of error is a significant risk.

  However, this violation is not necessarily fatal, provided we restructure how we pool our judgments. We cannot simply aggregate our final conclusions. If we do, we merely aggregate our shared biases. Instead, to preserve the spirit of collective competence, we must disaggregate the dimensions. We must attempt to pool our judgments on the empirical claims separately from the normative claims, and separately again from the conceptual definitions.

  By doing so, we allow the empirical experts to anchor the facts, the normative experts to weigh the values, and the conceptual experts to clarify the terms, without allowing authority in one dimension to bleed illegitimately into another. This is the only way we can approximate the conditions under which collective wisdom becomes possible.

  Therefore, I must constrain my promises for today. I cannot promise that we will leave this room with a unified theory of democratic reasoning. To promise that would be to ignore the mathematical reality of our constraints. If we fail to maintain the distinction between our dimensions, or if we allow social pressure to substitute for independent judgment, the theorem suggests our collective error may actually exceed our individual error.

  But if we are disciplined, if we treat our interdisciplinary differences not as obstacles to consensus but as necessary checks on dimensional competence, then we have a chance. We can create a deliberative environment where the group's output is more robust than the sum of its parts.

  This measured, conditional optimism seems fitting for the occasion. Our retiring convener has never been one to promise easy solutions. Their contribution to this university has been to teach us that the integrity of an inquiry depends on the rigour of its structure. They have shown us that we must respect the limits of our methods as much as we value their potential.

  So, as we begin, let us not aim for the comfort of agreement. Let us aim for the more difficult standard of conditional competence. Let us be wary of the moments when we influence one another not through evidence, but through authority. Let us be explicit about when we are speaking as empiricists, when as normativists, and when as conceptualists.

  If we can maintain these distinctions, we honour the mathematical logic that underpins our faith in collective reasoning. And if we can do that, we honour the convener who has spent a career teaching us that the hard work of democracy lies not in the voting, but in the reasoning that precedes it.

  Thank you.
