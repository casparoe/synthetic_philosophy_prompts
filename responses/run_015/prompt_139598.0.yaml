prompt: |-
  I direct service planning at a mid-sized regional transit authority, and one of the recurring arguments in my shop is about information purchases: before we commit to a route restructure, a capital bus-lane project, a fare change, or a new service agreement, someone proposes that we first buy some more knowledge — an on-board origin–destination survey, a few weeks of automated passenger counters, a consultant travel-demand model, an eight-week pilot, an equity analysis — and we have no disciplined way to decide. These come up maybe fifteen or twenty times a year at a formal level, at stakes between roughly thirty thousand and three million dollars, and every recommendation has to survive a finance director who wants a dollar figure plus the three assumptions driving it, and, above a hundred thousand, a board that reads nothing else. Whoever runs the procedure will be a planning analyst with a spreadsheet, about an hour per case, and no taste for decision theory, so it has to be operable without the vocabulary while still tracking what the theory actually says. The theory I am leaning on is the result usually called Good's theorem: that an agent who updates by conditioning and then chooses to maximize expected utility cannot, judging before the message arrives and averaging over the messages it might receive, be made worse off by information that is free, because it can always shrug and act exactly as it would have acted without it. I have absorbed that slogan from years of reading rationalist blogs, and my problem is precisely that it is a slogan: it licenses our default instinct that looking can never hurt and that more measurement is always progress, which I no longer believe, but I cannot reconstruct from the slogan which assumption is doing the work, so I cannot tell when it stops protecting us.

  So I want a written procedure, not an essay: an ordered set of steps with a time box on each, a statement of what counts as a sufficient answer at each step, the nodes where it stops with a no, and the nodes where it hands the question to a named human because the issue is one of values rather than fact. Several things need to be built in explicitly rather than left to the analyst's judgment. There should be a decision-invariance check up front: if the choice we would make is the same under every result the instrument could plausibly return, the value is zero no matter how interesting the study is, and the procedure should stop there. There needs to be an upper bound computed as the value of deciding with clairvoyance about the one quantity that actually matters, and then an explicit descent from that bound to the instrument we could really buy — my analysts currently just report the clairvoyance number, which is why every proposal looks worth funding — and I want your view on the discounting rule my senior analyst has drafted, which multiplies the bound by the correlation between what the instrument measures and the decision-relevant quantity. I also want the procedure to force the estimate to be written and dated before the purchase and never quietly revised afterward, to separate the ex ante guarantee from the ex post fact that a particular result can genuinely leave us worse off, to handle sequencing honestly (we keep adding the values of three studies together, and I am told that is wrong because value is not additive across signals and depends on what you already expect to learn), to say what to do when a needed number is simply unavailable — an uncertainty band, a sensitivity table, a break-even question, whatever is defensible in ten minutes — and to state, in so many words, which steps are judgment wearing a lab coat. Most importantly, it needs a failure check for the theorem's assumptions, covering at least these: the information cannot actually be ignored because a policy, contract, or board rule commits us to react to it; the message changes what other agents do rather than only what we believe; the instrument measures a proxy that downstream readers will treat as the quantity itself; the arrival of the number changes the set of acts available or their payoffs, including by taking so long that the window for acting closes; and the case where the information is nominally free to us because a grant pays for it. For each of those I want to know not just that the non-negativity argument lapses but what the procedure should output instead.

  Then apply it to three live proposals, showing the arithmetic with your assumptions written down, and give me the one-page memo template the analyst would fill in. First: an eight-week Sunday-service pilot on Route 14 costing about sixty thousand dollars. My planners love pilots on principle and will fight me on this, but the earliest we could add Sunday service is eleven months out because it needs operators we cannot hire until the next fiscal year, the pilot would run in July and August while the parallel rail line is down for maintenance, and I suspect that a weak result would be explained away and a strong result would change nothing about the timeline; if the procedure says skip it, say so flatly, and if it saves the pilot, tell me which step saved it. Second: a forty-thousand-dollar stated-preference and travel-diary survey intended to decide whether to extend Route 7 two miles to the new regional medical campus, at about three hundred thousand a year in operating cost, instead of keeping the current alignment and funding an on-demand shuttle. This decision is genuinely live and I think the clairvoyance bound here is large; my worry is that the survey measures stated intent among residents in a two-mile band rather than boardings at particular stops during clinic shift changes, that it excludes the shift workers we most care about, and that it returns in four months when we need to file the grant application in six weeks — so I want the procedure to tell me whether to buy it, buy a re-scoped and much cheaper version such as a two-week manual ride check at the existing transfer point, or buy nothing. Third: a federally funded equity and farebox-recovery analysis of our fare-free program, costing us nothing, whose publication would trigger an adopted board rule automatically scheduling a discontinuation hearing for any route below a recovery threshold for two consecutive quarters, and which advocacy groups and the union would use in ways we cannot control. I expect the procedure to flag this as a case where information makes us worse off precisely because we are not free to ignore it once it exists; I want that stated, I want the remaining question handed to a person with an account of what the person should actually be deciding, and I want you to be candid about the option of commissioning an internal version that is never published, since that is choosing ignorance instrumentally and has its own costs. Finally, tell me what this procedure cannot settle: which inputs are irreducibly judgment, where it will systematically misfire at an authority like mine, and how I should describe its limits in the memo without giving the board a reason to ignore it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **User Role:** Director of Service Planning at a mid-sized regional transit authority.
      *   **Problem:** Recurring arguments about purchasing information (surveys, pilots, models, etc.) before making decisions (route changes, capital projects, fare changes). No disciplined way to decide.
      *   **Constraints:**
          *   Volume: 15-20 cases/year.
          *   Stakes: $30k - $3M.
          *   Audience: Finance Director (wants dollar figure + 3 assumptions), Board (reads nothing else, threshold >$100k).
          *   Operator: Planning Analyst (spreadsheet, ~1 hour/case, no decision theory vocabulary).
          *   Theoretical Basis: Good's Theorem (information has non-negative expected value *if* certain assumptions hold), but the user knows this is often violated in practice.
          *   Goal: A written procedure (ordered steps, time boxes, stop nodes, hand-off nodes), not an essay.
      *   **Specific Requirements:**
          *   Decision-invariance check (if action doesn't change, value = 0).
          *   Upper bound calculation (Value of Perfect Information - VOPI) + discounting rule critique (analyst uses correlation).
          *   Ex-ante estimate locking (write/date before purchase).
          *   Sequencing handling (value isn't additive).
          *   Missing data handling (uncertainty bands, sensitivity).
          *   "Judgment wearing a lab coat" identification.
          *   Failure checks for Good's Theorem assumptions (commitment to react, strategic interaction, proxy treatment, timing windows, "free" grant money).
          *   Output for failures (not just "it lapses," but what to do).
          *   Application to 3 live proposals (Sunday pilot, Route 7 survey, Equity analysis).
          *   One-page memo template.
          *   Limitations section (what the procedure can't settle).

  2.  **Deconstruct Good's Theorem & Its Failures:**

      *   *Good's Theorem:* $E[U|Info] \ge E[U|No Info]$.
      *   *Assumptions:*
          1.  Information is costless (or cost is netted out).
          2.  Agent can ignore information (action space doesn't shrink).
          3.  Agent updates via Bayes rule (rational updating).
          4.  Utility function is stable.
          5.  Information doesn't change the world (no strategic interaction/observer effect).
          6.  Information arrives in time to be useful.
      *   *User's Specific Failure Modes:*
          1.  **Commitment to React:** Board rules/policy force action based on metric. (Violates "can ignore").
          2.  **Strategic Interaction:** Publication changes behavior of unions/advocates. (Violates "doesn't change world").
          3.  **Proxy Treatment:** Measuring $X$ but decision depends on $Y$, stakeholders treat $X$ as $Y$. (Violates "rational updating/interpretation").
          4.  **Timing:** Study takes too long. (Violates "arrives in time").
          5.  **"Free" Money:** Grant pays for study, but study triggers costs/delays. (Violates "costless" in a broader utility sense).

  3.  **Drafting the Procedure (The "Core"):**

      *   *Tone:* Operational, directive, spreadsheet-friendly.
      *   *Structure:* Step-by-step with time limits.
      *   *Key Mechanism:* Value of Information (VOI) = (VOPI * Relevance * Timeliness) - Cost.
      *   *Critique of Analyst's Discount:* Correlation is okay for *precision*, but not for *decision impact*. A highly correlated metric might not change the decision if the threshold is far away. Better to use "Probability of Changing Decision."
      *   *Sequencing:* Explicitly state "Do not sum VOI of multiple studies. Evaluate the bundle or the marginal value of the next step."
      *   *Failure Checks:* A specific "Red Flag" section.

  4.  **Developing the Three Cases:**

      *   *Case 1 (Sunday Pilot):*
          *   Cost: $60k.
          *   Issue: Timing (11 months out), Context (rail down), Invariance (weak result explained away, strong result doesn't speed up hiring).
          *   Verdict: **NO.** Decision Invariance + Timing.
      *   *Case 2 (Route 7 Survey):*
          *   Cost: $40k.
          *   Decision: Extend vs. Shuttle ($300k/yr).
          *   Issue: Proxy (stated intent vs. actual boardings), Timing (4 months vs. 6 weeks), Target (excludes shift workers).
          *   Verdict: **NO (Buy Nothing) or Pivot.** The specific survey is bad. A cheaper manual count might work if it fits the timeline. Let's argue for the manual count or nothing. Given the 6-week deadline, a 4-month survey is useless.
      *   *Case 3 (Equity Analysis):*
          *   Cost: $0 (Federally funded).
          *   Issue: Board rule triggers hearing if metric fails. Strategic reaction (Union/Advocates).
          *   Verdict: **FLAG FOR DIRECTOR.** Good's theorem fails because you can't ignore the info. This is a political/strategic decision, not a planning one.

  5.  **Drafting the Memo Template:**

      *   Needs to fit on one page.
      *   Fields for: Decision at stake, Cost of Info, VOPI, Probability of Change, Net Value, Red Flags.
      *   Signature/Date lock.

  6.  **Addressing the Limitations:**

      *   Inputs are estimates (garbage in, garbage out).
      *   Doesn't handle political survival (sometimes you need the study to *justify* a decision already made).
      *   Analyst bias (they want to study).
      *   Board perception (looks cold to say "don't learn").

  7.  **Refining the "Discounting Rule":**

      *   Analyst suggests: $VOI = VOPI \times Correlation$.
      *   Critique: Correlation $\rho$ measures statistical link, not decision impact. If the decision threshold is far from the mean, even a perfect signal might not change the decision.
      *   Better Rule: $VOI = VOPI \times P(Change Decision) \times Timeliness Factor$.
      *   Keep it simple for the analyst: "Probability that this result makes us choose differently."

  8.  **Review against Constraints:**

      *   *Time box:* Keep steps under 1 hour total.
      *   *Vocabulary:* Avoid "Bayesian," "Utility," "Posterior." Use "Best Guess," "Value," "Chance of Changing Mind."
      *   *Failure Modes:* Explicitly mapped to procedure outputs.

  9.  **Final Polish:**

      *   Ensure the tone matches a senior director speaking to a planning shop (authoritative but practical).
      *   Make sure the "Judgment wearing a lab coat" sections are highlighted.
      *   Check the arithmetic in the cases.

  *(Self-Correction during drafting)*: I initially thought about suggesting a complex formula for VOPI. But the user said the analyst has 1 hour and uses a spreadsheet. I need to simplify VOPI to "Best Case Benefit - Worst Case Benefit" weighted by probability, or simply "Cost of Being Wrong." Let's stick to "Cost of Being Wrong" (Expected Loss) as the upper bound.
  Actually, standard VOI is $E[U|Info] - E[U|No Info]$. The upper bound is VOPI (Value of Perfect Information).
  VOPI = (Probability Current Choice is Wrong) * (Cost of Being Wrong).
  This is calculable in a spreadsheet.
  Let's refine the discounting rule. The analyst's correlation rule is mathematically shaky for decision value. I will recommend replacing it with a "Decision Impact Probability."

  *(Refining Case 2)*: The survey takes 4 months. Deadline is 6 weeks. Value is zero due to timing. I need to make sure the procedure catches this *before* the VOI math. Step 1 should be Timing/Feasibility.

  *(Refining Case 3)*: This is the "Commitment to React" failure. The procedure must route this to the Director, not the Analyst.

  *(Refining Limitations)*: Be honest. This procedure assumes rational actors. The Board is not always rational. The procedure protects the *process*, not necessarily the *outcome* if the Board is political.

  10. **Final Structure:**
      *   Part 1: The Procedure (The "VOI Gate").
      *   Part 2: The Discounting Rule Critique.
      *   Part 3: Application to Three Cases.
      *   Part 4: The Memo Template.
      *   Part 5: Limitations & Implementation Notes.

  Let's write it.cw
answer: |-
  # PART 1: THE PROCEDURE (THE "VOI GATE")

  **Purpose:** To determine whether purchasing information (survey, pilot, model, study) increases net value before a decision.
  **Operator:** Planning Analyst.
  **Time Budget:** 60 minutes total per case.
  **Tool:** Standard Spreadsheet (Tab: "Info_Purchase_Req").

  ### STEP 1: THE TIMING & AUTHORITY CHECK (10 Minutes)
  *Goal: Eliminate proposals that are physically or procedurally useless.*

  1.  **Decision Deadline:** When must the final decision be made?
  2.  **Info Delivery:** When will this information be ready?
  3.  **Check:** Is Info Delivery $\le$ Decision Deadline minus 1 week (for analysis)?
      *   **NO:** Stop. **Output:** "Reject: Too Late."
  4.  **Mandatory Reaction:** Does any board policy, contract, or grant rule *force* a specific action based on the result of this information? (e.g., "If recovery < 20%, hearing required.")
      *   **YES:** Stop. **Output:** "Flag for Director: Strategic/Political Risk." (Hand off to you).
      *   **NO:** Proceed to Step 2.

  ### STEP 2: THE INVARIANCE CHECK (15 Minutes)
  *Goal: Apply Good's Theorem's core condition. If the action doesn't change, the value is zero.*

  1.  **Current Best Choice:** Without this info, what would we do? (Write it down).
  2.  **Scenario A (Bad Result):** If the data comes back worse than expected, do we change our choice?
      *   **NO:** Value = $0. Stop. **Output:** "Reject: Decision Invariant."
  3.  **Scenario B (Good Result):** If the data comes back better than expected, do we change our choice?
      *   **NO:** Value = $0. Stop. **Output:** "Reject: Decision Invariant."
      *   **YES:** Proceed to Step 3.
      *   *Note: If planners argue "We need it to confirm," the answer is NO. Confirmation has no decision value.*

  ### STEP 3: THE UPPER BOUND (VOPI) (15 Minutes)
  *Goal: Calculate the Value of Perfect Information. This is the maximum possible value of any study.*

  1.  **Cost of Being Wrong:** If we make the wrong decision, what is the financial or service impact over 1 year? (e.g., Operating loss, capital waste, ridership loss valued at \$X/riders).
  2.  **Probability of Being Wrong:** Without new info, what is the % chance our Current Best Choice (from Step 2) is the wrong one? (Use 50% if truly unsure, <10% if confident).
  3.  **Calculation:** $VOPI = (\text{Cost of Being Wrong}) \times (\text{Probability of Being Wrong})$.
      *   *Example:* Risk is \$1M. 40% chance we're wrong. VOPI = \$400k.
      *   *Constraint:* If VOPI < Cost of Info, Stop. **Output:** "Reject: Cost Exceeds Max Value."

  ### STEP 4: THE DISCOUNT & NET VALUE (15 Minutes)
  *Goal: Adjust VOPI for the reality of the specific instrument.*

  1.  **Decision Impact Probability:** What is the % chance this specific study actually changes our mind? (Not "is it correlated," but "will it flip the vote").
      *   *Rule:* Do not use correlation. Use estimated probability of crossing the decision threshold.
  2.  **Timeliness/Quality Factor:** (0.0 to 1.0). Reduce for proxy measures, sampling bias, or delivery close to the deadline.
  3.  **Calculation:** $Expected Value = VOPI \times (\text{Decision Impact Prob}) \times (\text{Timeliness Factor})$.
  4.  **Net Value:** $Expected Value - \text{Cost of Info}$.
      *   **If Net Value $\le$ 0:** Stop. **Output:** "Reject: Negative Expected Value."
      *   **If Net Value > 0:** Proceed to Step 5.

  ### STEP 5: SEQUENCING & LOCK (5 Minutes)
  *Goal: Prevent double-counting and anchor the estimate.*

  1.  **Prior Info:** Have we bought info on this topic in the last 18 months?
      *   **YES:** This study must justify why the old data is insufficient. Reduce Decision Impact Probability by 50% unless justified.
  2.  **The Lock:** Print/Save PDF of this sheet. Date and Sign.
      *   *Rule:* This sheet cannot be edited after the purchase order is cut. Post-project reviews will compare *this* sheet to actual outcomes.
  3.  **Final Output:** "Approve" or "Reject" with Net Value figure.

  ---

  # PART 2: THE DISCOUNTING RULE CRITIQUE

  Your senior analyst proposes: $Value = VOPI \times \text{Correlation}$.
  **Verdict:** Reject this rule. It is "judgment wearing a lab coat."

  **Why it fails:**
  1.  **Correlation $\neq$ Decision Impact:** A metric can be perfectly correlated ($\rho=1.0$) with the truth but still lie entirely on one side of your decision threshold. If you need to know if ridership > 1,000, and the proxy tells you ridership is 500 $\pm$ 10, the correlation is high, but the decision value is zero because you wouldn't have launched the route anyway.
  2.  **Linearity Assumption:** It assumes value scales linearly with precision. It does not. Value spikes only near the decision threshold.

  **The Replacement:**
  Use **Decision Impact Probability** (Step 4.1 above).
  *   *Ask the analyst:* "If we run this study, what is the percentage chance the recommendation changes from 'Go' to 'No-Go' (or vice versa)?"
  *   *Why:* This forces the analyst to simulate the result distribution against the decision threshold, which is the actual mechanism of value.

  ---

  # PART 3: APPLICATION TO LIVE PROPOSALS

  ### CASE 1: Route 14 Sunday-Service Pilot
  *   **Cost:** $60,000.
  *   **Context:** Earliest implementation is 11 months out (hiring constraint). Pilot runs July/August (Rail down).
  *   **Procedure Run:**
      1.  **Timing:** Pilot ends August. Decision/Implementation is 11 months out. *Pass.*
      2.  **Invariance:**
          *   Current Choice: Do not implement until hiring solves (11 months).
          *   Scenario A (Weak Result): Planners argue "Summer anomaly/Rail down." Choice remains: Wait.
          *   Scenario B (Strong Result): Hiring constraint still binds. Choice remains: Wait.
      3.  **Stop Node:** **Step 2 (Invariance Check).**
  *   **Verdict:** **REJECT.**
  *   **Reasoning:** The study cannot change the binding constraint (operator availability). It is consumption of information for comfort, not decision utility.
  *   **Note to Planners:** "A pilot is only valuable if it can accelerate or cancel a decision. If the timeline is fixed by HR, the pilot is merely a public relations event, not a planning tool. Budget as PR, not Planning."

  ### CASE 2: Route 7 Extension Survey
  *   **Cost:** $40,000.
  *   **Decision:** Extend Route 7 ($300k/yr) vs. On-Demand Shuttle.
  *   **Context:** Grant application due in 6 weeks. Survey returns in 4 months.
  *   **Procedure Run:**
      1.  **Timing:** Info Delivery (4 months) > Decision Deadline (6 weeks).
      2.  **Stop Node:** **Step 1 (Timing Check).**
  *   **Verdict:** **REJECT.**
  *   **Alternative:** The procedure forces the question: "What info *can* we get in 4 weeks?"
      *   *Pivot:* Two-week manual ride check at transfer point. Cost: $5,000.
      *   *Re-run Step 3 (VOPI):* Risk of wrong choice = $300k (1st year waste). Prob wrong = 40%. VOPI = $120k.
      *   *Re-run Step 4:* Manual count is a proxy (Timeliness Factor 0.5). Decision Impact Prob 30%. Exp Value = $120k * 0.3 * 0.5 = $18k.
      *   *Net:* $18k - $5k = $13k positive.
  *   **Instruction:** Do not buy the $40k survey. Buy the $5k manual count *only if* it fits the 4-week window. If not, buy nothing and decide on existing data.

  ### CASE 3: Federally Funded Equity/Farebox Analysis
  *   **Cost:** $0 (Grant funded).
  *   **Context:** Publication triggers Board Rule -> Automatic Hearing if recovery < threshold. Union/Advocates will use data strategically.
  *   **Procedure Run:**
      1.  **Timing:** Pass.
      2.  **Mandatory Reaction:** Board Rule commits authority to react (Hearing) based on metric.
      3.  **Stop Node:** **Step 1 (Mandatory Reaction Check).**
  *   **Verdict:** **FLAG FOR DIRECTOR.**
  *   **Reasoning:** Good's Theorem fails because the "agent" (Authority) is not free to ignore the message. The information changes the payoff structure (forces a hearing) and invites strategic interaction (Union/Advocates).
  *   **Action:** This is not a planning decision; it is a governance decision.
      *   *Option A:* Accept the grant and the risk of the hearing.
      *   *Option B:* Decline the grant to retain strategic ambiguity.
      *   *Option C (Internal Version):* Commission an internal analysis that is *not* published.
          *   *Risk:* If leaked, looks like concealment.
          *   *Benefit:* Allows internal preparation without triggering automatic bylaws.
  *   **Instruction to Analyst:** Do not process this as a standard purchase. Forward to Director with note: "Information triggers mandatory adverse action. Value calculation invalid."

  ---

  # PART 4: THE ONE-PAGE MEMO TEMPLATE

  **TO:** Finance Director / Board (if >$100k)
  **FROM:** Service Planning
  **DATE:** [Date Locked]
  **SUBJECT:** Information Purchase Justification: [Project Name]

  **1. THE DECISION AT STAKE**
  *   **What decision will this info inform?** [e.g., Extend Route 7 vs. Shuttle]
  *   **When must this decision be made?** [Date]
  *   **What will we do if we DO NOT buy this info?** [e.g., Proceed with Shuttle]

  **2. THE VALUE MATH (Ex-Ante)**
  *   **Cost of Being Wrong:** $[Amount] (Impact if we choose the losing option)
  *   **Chance We Are Wrong:** [ % ] (Without this study)
  *   **Max Value of Info (VOPI):** $[Cost of Wrong] \times [\% Chance]$ = **$[Amount]**
  *   **Chance This Study Changes Our Mind:** [ % ] (Must be <100%)
  *   **Expected Net Value:** $(VOPI \times \text{Change \%}) - \text{Cost of Study}$ = **$[Amount]**

  **3. RISK FLAGS (Check all that apply)**
  *   [ ] **Timing:** Study finishes after decision deadline.
  *   [ ] **Invariance:** We will likely proceed regardless of results.
  *   [ ] **Mandatory Reaction:** A rule/policy forces us to act on specific results.
  *   [ ] **Proxy Risk:** We are measuring X, but deciding on Y.
  *   [ ] **Strategic Risk:** Publication changes stakeholder behavior (Union/Public).

  **4. ANALYST CERTIFICATION**
  *   I certify that the "Chance We Are Wrong" and "Chance Study Changes Mind" are estimates made *before* data collection.
  *   I certify this study does not duplicate data purchased in the last 18 months.
  *   **Signature:** ___________________ **Date:** __________
  *   *(This sheet may not be revised after purchase order issuance)*

  ---

  # PART 5: LIMITATIONS & IMPLEMENTATION NOTES

  **What This Procedure Cannot Settle:**
  1.  **Political Cover:** Sometimes you buy a study not to decide, but to *defend* a decision already made politically. This procedure will calculate $0 value for that. You must override it explicitly as a "Political Necessity" and own the cost.
  2.  **Learning vs. Deciding:** This values information for *immediate* decisions. It undervalues long-term institutional learning (e.g., building a model that will be used for 10 years). For models, amortize the VOPI over the expected life of the model, not one decision.
  3.  **Garbage In:** If the analyst guesses "10% chance of being wrong" to make the math work, the procedure fails. You must audit the *inputs* (the probabilities), not just the math.

  **Where It Will Misfire:**
  *   **The "Zero Cost" Trap:** Analysts will propose "free" grants (like Case 3). The procedure flags this, but you must enforce the flag. Free money that costs you strategic flexibility is expensive.
  *   **The "Pilot Love":** Planners view pilots as inherently virtuous. This procedure treats pilots as expensive data points. Expect cultural friction. Frame it as "Protecting the budget for actual service."

  **How to Describe Limits to the Board:**
  Do not say "This model assumes rational actors." Say:
  *"This procedure ensures we only spend money on studies that can change a decision. It prevents us from buying data we will ignore. However, it does not account for political requirements or long-term research benefits. Any purchase flagged as 'Negative Value' requires Director approval to acknowledge we are prioritizing non-decision factors."*

  **Final Instruction to Your Team:**
  "Theorem says information is free, so it's always good. Reality says information costs time, money, and political capital. This procedure forces us to pay the bill before we order the meal."
