answer: |-
  This passage is a pivot point in abolitionist legal theory. Douglass is moving away from the Garrisonian position (that the Constitution is a "covenant with death" and should be rejected) toward a position that seizes the Constitution as a tool for liberation. To do this, he has to perform a delicate surgical operation on the relationship between text, intent, and practice. Here is the breakdown of the philosophical problems you've identified.

  ### 1. The Metaphorical Shift: Compass, Chart, and Course

  It is tempting to dismiss the shift from compass to chart as oratorical imprecision, but in the context of legal philosophy, the slippage is doing specific argumentative work. Douglass is trying to separate three distinct layers of political reality that pro-slavery apologists deliberately conflate.

  *   **The Compass (The Constitution as Normative Authority):** A compass does not tell you where the landmasses are; it tells you where *North* is. It provides orientation and truth independent of terrain. By calling the Constitution a compass, Douglass argues it provides the moral direction (Liberty, Justice) regardless of where the ship is currently sailing.
  *   **The Chart (The Constitution as Textual Map):** A chart depicts the boundaries, the shoals, and the safe passages. This corresponds to his insistence on the "mere text." The chart is fixed. You cannot argue with the chart by saying, "But the captain *wanted* to go through the reef."
  *   **The Course (The Government as Action):** The course is the actual movement of the vessel. This is the "Government" he distinguishes from the Constitution. The ship can steer wrong even if the compass points right.

  The switch matters because he needs the **Compass** to establish that the Constitution has a moral telos (anti-slavery), the **Chart** to establish that the text does not legally authorize slavery (textualism), and the **Course** to explain why slavery exists despite the first two (corrupt administration). If he stuck only with the compass, he'd be accused of moralizing without law. If he stuck only with the chart, he'd be accused of ignoring the reality of slavery. The shifting metaphor allows him to say: The moral direction is clear, the written map allows for that direction, but the pilots (the Government) have steered us into slavery illegally. It is not looseness; it is a tripartite distinction between *Norm*, *Text*, and *Practice*.

  ### 2. The "So Far, and So Far Only" Paradox

  You have identified a genuine tension: Douglass claims intentions count only if written, yet he marshals evidence about the framers' secret behavior to make his case. How can he use their conduct to prove their intentions don't count?

  The stable position underneath this is a theory of **Public Ratification**.

  Douglass is arguing that the Constitution is not a contract between the Framers; it is a contract between the Sovereign People and the Government. The Framers were merely draftsmen. The "intentions" that matter legally are not the psychological states of the draftsmen in Philadelphia, but the understanding of the citizens in the states who voted to ratify the text.

  *   **The Rule:** "Intentions... are so respected so far, and so far only, as we find those intentions plainly stated in the Constitution." This is a rule of *legal validity*, not historical inquiry.
  *   **The Evidence:** When Douglass points to the closed doors and the unpublished debates, he is not using them to establish what the law *is*. He is using them to establish what the law *is not*.

  His argument is: Because the debates were secret and the compromises were whispered, they were never submitted to the People for ratification. Therefore, any "pro-slavery intention" hidden in those secrets is legally void. He uses the evidence of their conduct (secrecy) to prove the *absence* of public intent.

  So, the position is precise: Private intentions are evidentially relevant only to prove they were excluded from the public compact. He is not contradicting his textualism; he is using historical facts to police the boundary of the text. If it wasn't public, it wasn't ratified. If it wasn't ratified, it isn't law.

  ### 3. The Weight of "Ashamed": Reading Silence

  This is the crux of his hermeneutic. You ask if the silence could equally be read as a refusal to endorse slavery. Douglass anticipates this, but his reading depends entirely on the **Preamble**.

  If the Constitution were a neutral commercial contract, silence on slavery would imply no position. But Douglass insists the Constitution is a teleological document dedicated to "Liberty" and "Justice." Given that purpose, slavery is a contradiction.

  *   **The Logic:** If you create a document dedicated to Liberty, but you intend to protect Slavery, you face a cognitive dissonance. You cannot explicitly write "Slavery" into a "Bill of Liberty" without exposing the hypocrisy.
  *   **The Inference:** Therefore, the omission of the word "slavery" is not a neutral refusal to endorse; it is a deliberate concealment of a guilty secret. They were "ashamed" because the institution contradicted the stated purpose of the document.

  Does he argue for this, or assume it? He argues for it by anchoring the interpretation in the Preamble. He treats the Preamble as the governing purpose clause. If the purpose is Liberty, any ambiguity must be resolved in favor of Liberty. Consequently, silence regarding slavery cannot be interpreted as permission, because permission would violate the purpose. The "shame" is the logical result of trying to reconcile an immoral practice with a moral charter.

  If you remove the Preamble's moral weight, his argument collapses. But for Douglass, the Preamble is the "Compass" from the first metaphor. You cannot read the map (the text) without the orientation (the Preamble). The silence is guilty *because* the Preamble is innocent.

  ### 4. Public-Meaning Originalism or Something Else?

  Is this public-meaning originalism? It shares DNA, but the mapping breaks down in critical ways.

  **Where it holds:**
  *   **Rejection of Legislative History:** Like modern public-meaning originalists (e.g., Scalia), Douglass rejects secret committee reports, private letters, and unpublished debates as sources of legal authority. He insists on the "mere text."
  *   **Objective Meaning:** He argues for a meaning that is accessible to the public ("plain reading"), not a specialized meaning known only to elites.

  **Where it breaks:**
  *   **The Role of Purpose:** Modern public-meaning originalism generally seeks to freeze the semantic meaning of the text at the time of ratification. It is often backward-looking and stabilizing. Douglass uses the text as a forward-looking engine for moral progress. He isn't asking, "What did 'person' mean to a slaveholder in 1787?" He is asking, "What does a text dedicated to 'Liberty' permit?"
  *   **The Canon of Construction:** Douglass employs a specific canon of legal interpretation: *ambiguities in a grant of power should be read strictly against the grantee.* Since the government claims the power to hold slaves, and the text is silent, the silence must be read as a denial of that power. Modern originalism does not typically employ this kind of liberty-maximizing canon; it usually seeks the "expected application."
  *   **Natural Law Undercurrent:** Douglass's textualism is underwritten by Natural Law. He assumes that "Liberty" is the default state of man, and the Constitution protects that default. Modern originalism tends to be positivist (the law is what is written, regardless of moral default).

  **Verdict:**
  Douglass is closer to what we might call **Purpose-Driven Textualism** grounded in Natural Law. He uses originalist *tactics* (focus on the ratified text, rejection of secret intent) to achieve a *living constitutionalist* end (expanding liberty).

  He is not arguing that the *meaning* of the words changes (which would be living constitutionalism in the modern sense). He is arguing that the *application* of the fixed meaning was corrupted. However, because he reads the fixed meaning through the lens of the Preamble's moral purpose, he extracts a meaning that the 1787 framers likely did not expect (immediate abolitionism).

  So, he sounds like a public-meaning originalist when he says "text only," but he acts like a natural law theorist when he interprets that text. The "public meaning" he seeks is not the historical understanding of the slaveholder, but the moral understanding of the citizen reading the Preamble. That is a normative move, not a historical one.

  ### Summary of the Philosophical Move

  Douglass is performing a separation of powers between the **Constitution** (the law) and the **Government** (the administrators). By insisting on the text over the secret intent, he strips the pro-slavery argument of its historical cover. By insisting on the Preamble's purpose over the text's silence, he strips the pro-slavery argument of its legal cover.

  He is not summarizing the speech; he is building a jurisprudence where the Constitution is a weapon against the very Government that claims to uphold it. The metaphors, the textualism, and the reading of silence all serve to isolate the *law* from the *practice*, allowing him to condemn the practice without condemning the law. This allows him to remain a patriot while being a radical—a crucial political necessity for an abolitionist in 1860.
