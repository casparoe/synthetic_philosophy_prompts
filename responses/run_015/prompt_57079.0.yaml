      *Re-evaluating Q1:* Is it possible the metaphor shift *is* a bit loose? Yes, but argue it serves a purpose. The Compass is the *authority*, the Chart is the *map*, the Course is the *journey*. He needs all three to separate Law from Power from Practice.
      *Re-evaluating Q4:* Be precise. Modern public meaning originalism asks "What did the words mean to the public?" Douglass asks "What do the words *permit* given the purpose?" He is closer to Dworkin's "Law as Integrity" than Scalia's originalism, though he uses originalist *rhetoric*. I should make this distinction clear.

