answer: |-
  ### PRE-PROPOSAL BRAINSTORM: OBSTACLES & MUDDY WATER

  Before you commit to this, here is the blunt assessment of where this idea usually breaks down.

  1.  **The Future-Utility Trap:** Standard decision theory will swallow your argument whole unless you are precise. If you argue "I should finish because quitting damages my self-concept," that is forward-looking utility maximization (avoiding psychological pain). That is not defending sunk costs; that is finding new future benefits. To make this a *sunk cost* defense, you must argue that the *past fact* of investment generates a reason independent of future psychological payoff. This is a much harder normative claim.
  2.  **Definition Drift:** You are conflating "sunk costs" (irrecoverable resources) with "specific capital" (skills only usable in this context). Economics already admits specific capital makes completion rational. Your philosophical lift is to argue that the *identity transformation* itself creates a duty, not just that the skills are valuable.
  3.  **Scope Creep:** Diachronic agency is a massive literature (Bratman, Holton, Parfit). If you try to solve personal identity, you will fail. You must restrict this to *practical rationality* only.

  If you cannot distinguish "I want to be consistent" from "I owe it to my past self," this project is just a rehash of standard commitment theory. Proceed only if you are willing to make that cut.

  ***

  ### RESEARCH PROPOSAL

  **Title:** The Normative Weight of Past Agency: Diachronic Continuity and the Sunk Cost Fallacy

  **1. The Precise Research Question**
  Standard rational choice theory treats agents as time-slices, rendering past investments normatively inert. This project asks: *Does the diachronic structure of agency confer normative weight to past investments in identity-linked projects, independent of future utility maximization?*

  Specifically, I will investigate whether "honoring sunk costs" can be reconstructed as a duty of diachronic fidelity (promise-keeping to oneself) rather than a cognitive bias, focusing on cases where the agent's skills and social role have become constitutively tied to the project's completion.

  **2. Why Standard Rational-Choice Answers Fail**
  Orthogonal decision theory defines rationality as maximizing expected utility from the current moment forward. Past costs are "sunk" because they cannot be recovered; therefore, they cannot influence the optimal future path.

  This framework fails to capture **embedded agency**. When an agent invests time into a project (e.g., a PhD, a startup, a marriage), they do not just spend resources; they alter their own capacities and social identity. Standard theory treats the resulting "switching costs" as merely another future negative utility. This misses the retrospective dimension: the agent may feel bound not because quitting hurts *future* them, but because quitting violates the authority of *past* them. Current models lack the vocabulary to distinguish between "quitting is expensive" and "quitting is a betrayal of prior agency." This project aims to formalize that distinction.

  **3. Methodology and 12-Week Plan**
  This is a conceptual analysis project grounded in case study construction. I will not be collecting empirical data but rather stress-testing philosophical arguments against intuitive cases.

  *   **Weeks 1-3: Conceptual Groundwork & Literature Mapping**
      *   Task: Define "sunk cost fallacy" vs. "resolute choice."
      *   Output: A 3-page memo distinguishing "forward-looking consistency" (reputation) from "backward-looking fidelity" (honoring past investment).
      *   Task: Identify 3 paradigmatic cases of "identity-linked sunk costs" (e.g., the career pivot, the artistic masterpiece, the long-term caregiving role).
  *   **Weeks 4-6: Argument Construction**
      *   Task: Draft the "Diachronic Fidelity" argument. Why does the past self have authority over the present self?
      *   Task: Anticipate the "Utility Counter-Argument." If fidelity feels good, isn't it just utility?
      *   Output: First draft of the core argument section (approx. 2,500 words).
  *   **Weeks 7-9: Stress-Testing & Counter-Examples**
      *   Task: Apply the argument to "bad" projects. If I invested in a harmful identity (e.g., a criminal gang), does sunk cost reasoning still apply? If not, why?
      *   Task: Refine the boundary conditions. When does fidelity become irrational stubbornness?
      *   Output: Revised argument incorporating limits/constraints on diachronic agency.
  *   **Weeks 10-12: Synthesis and Final Polish**
      *   Task: Assemble sections into a coherent paper.
      *   Task: Final review for clarity and logical flow.
      *   Output: Final paper (approx. 10-12 pages) and a 500-word abstract.

  **4. Success vs. Failure Conditions**
  *   **Success:** The final paper successfully isolates a category of rational action that looks like the sunk cost fallacy but is justified by diachronic agency norms. It must explicitly defeat the objection that "identity consistency is just another utility function."
  *   **Failure:** The project collapses into the claim that "people feel bad when they quit, so quitting has a cost." If the argument reduces to psychological aversion to loss, it adds nothing to standard behavioral economics. Additionally, failure occurs if the scope expands into general personal identity metaphysics rather than staying focused on practical rationality.

  **5. Scope Risks and Mitigation**
  *   **Risk:** Getting bogged down in the metaphysics of personal identity (Parfitian reductionism vs. egoism).
      *   *Mitigation:* I will treat personal identity as a pragmatic given for the sake of the argument. The focus is on *rational norms*, not metaphysical truth.
  *   **Risk:** The distinction between "fidelity" and "utility" proves illusory.
      *   *Mitigation:* If this emerges in Weeks 4-6, I will pivot the project to argue *why* standard utility theory fails to capture the phenomenology of agency, rather than trying to prove the rationality of sunk costs outright.
  *   **Risk:** Insufficient engagement with existing decision theory.
      *   *Mitigation:* Weeks 1-3 are dedicated strictly to ensuring I am not reinventing "resolute choice" literature. I will verify my distinction against existing commitment models.

  **6. Conclusion**
  This project challenges the dogma that sunk cost reasoning is inherently irrational. By shifting the frame from resource allocation to diachronic agency, it offers a nuanced account of when sticking with a failing project is an act of integrity rather than error. The deliverable is a rigorous philosophical paper suitable for submission to an undergraduate philosophy journal or presentation at a symposium.
