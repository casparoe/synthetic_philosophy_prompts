answer: |-
  **Project Title:** Multiplexed Minds: Can Teleosemantics Handle Neural Overload?
  **Duration:** 3 Months (One Quarter)
  **Applicant:** [Your Name]

  **The Big Question**
  Here's the deal: standard teleosemantics (think Millikan, Papineau) works on a pretty clean assumption. A mental representation has content because it has a *proper function*—a specific job it was selected by evolution to do. Usually, the theory assumes one vehicle (say, a neural state) maps to one proper function, which determines one content.

  But neuroscience is getting messy. We're seeing more and more evidence of "neural multiplexing." Single neural states or populations seem to carry multiple functions simultaneously, both of which look like they have evolutionary backing. Maybe a state is selected for triggering a motor action *and* for updating an internal model (error correction). Neither seems obviously subordinate to the other.

  So, the precise question is: **If a representational vehicle has multiple, non-hierarchical proper functions, does teleosemantics fracture?** Can we determine a unified content, or do we have to index content to specific contexts? And if we need context to pick the content, does that sneak in an interpreter and break the naturalization story?

  **Why the Standard Answers Don't Cut It**
  I've looked at the usual suspects, and they wiggle out too easily or miss the point.

  1.  **Millikan-style Teleosemantics:** Ruth Millikan ties content to the function relative to a "consumer" system. But if multiple consumer systems are using the same signal for different selected purposes, her account risks saying the state has multiple contents simultaneously. That's fine, maybe, but if those contents conflict (e.g., "predator nearby" vs. "mate nearby" depending on which downstream system you ask), we lose the idea of a stable mental state. She assumes a cooperative mapping that might not exist in multiplexed hardware.
  2.  **Indicator/Co-variation Accounts:** Fodor-style views say content is what reliably causes the state. But if the state is selected for responding to X *and* Y (because X and Y co-occur, or because the state does double duty), asymmetry tests fail. You can't just say "it indicates X" if it was equally selected to track Y for a different functional role.

  Neither framework fully grapples with the idea that the *same token* is doing two selected jobs at once without a hierarchy. They usually force a hierarchy to save the theory. I want to see if we can stop forcing it.

  **The Method**
  This is pure conceptual work backed by secondary lit in cognitive science. No lab coats, no IRB forms.

  *   **Month 1: Case Gathering & Mapping.** I'll dig into recent computational neuroscience papers on neural multiplexing, degenerate coding, and multifunctional neurons. The goal is to find 2-3 solid cases where a neural vehicle clearly has two selected functions that aren't just means-end related. I'll map these cases onto the teleosemantic conditions.
  *   **Month 2: Stress-Testing the Theory.** I'll run the cases through the Millikan and Indicator frameworks. I'm looking for the breaking point. Does the theory produce contradictory content? Does it require an arbitrary choice? I'll draft the core argument here.
  *   **Month 3: Synthesis & Write-up.** If the theory breaks, I'll sketch what kind of modification saves it (maybe a context-relative naturalism?). If it holds, I'll explain why the multiplexing objection is a dud. Final paper will be around 8,000 words, ready for submission to a journal like *Philosophy of Science* or *Synthese*.

  **What Success Looks Like**
  A positive result isn't necessarily saving teleosemantics. It's getting a clear verdict.
  *   **Win Condition A:** I show that teleosemantics can handle multiplexing by expanding the definition of "proper function" to include disjunctive contents without losing naturalistic traction.
  *   **Win Condition B:** I prove that multiplexing forces content to be context-relative in a way that requires a non-naturalistic interpreter, effectively falsifying strong teleosemantics for these cases.
  Either way, we know where the boundary is.

  **What Failure Looks Like**
  *   **Ambiguity:** The neuroscience cases turn out to be too messy. Maybe what looks like multiplexing is just hierarchical functions we don't understand yet. If I can't find a clear case of non-hierarchical multiple functions, the philosophical problem dissolves.
  *   **Triviality:** The solution turns out to be boring (e.g., "just say it has two contents"). If the fix is trivial, the project hasn't added much value.

  **Scope & Honesty Check**
  Look, three months is short. I'm not solving the hard problem of consciousness or rewriting *Language, Thought, and Other Biological Categories*. I'm testing one specific vulnerability in teleosemantics against one specific empirical trend. If the neuroscience literature is paywalled hell or the cases are inconclusive, I might only get a "programmatic" paper out of this rather than a definitive proof. But even a "here's why this is a problem we need to look at" paper is worth the grant.

  I'm keeping the scope tight: no broad survey of all semantic theories, just teleosemantics vs. multiplexing. No original experiments. Just thinking hard about the stuff everyone else is ignoring.

