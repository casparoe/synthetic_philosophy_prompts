  **Preamble**

  You know the standard Sleeping Beauty protocol. This instrument contains nine variations. For each, select the option that best reflects your credence or judgment. Do not answer based on what you think "your side" says; answer based on your immediate intuition about the case described. One option in every item allows you to refuse a precise number. There are no trick questions, but some cases are designed to pull apart intuitions that usually travel together. Your profile will map you to a structural position in the debate, not a school. Answer honestly; inconsistency is data.

  ***

  **The Instrument**

  **1. The Two-Laboratory Case**
  The standard protocol is run independently in two indistinguishable laboratories, Lab A and Lab B. You wake in one of them. You are truthfully told: "Exactly one of the two coins landed Heads." You do not know which lab you are in. What is your credence that the coin in *your* lab landed Heads?
  A) 1/2
  B) 1/3
  C) 2/3
  D) No precise credence

  **2. The Biased Tails Case**
  Standard protocol, except: If Tails, a second fair coin is tossed. If Heads2, you wake Mon & Tue. If Tails2, you wake Mon only. (If Heads1, you wake Mon only). You wake. What is your credence that Coin 1 landed Heads?
  A) 1/2
  B) 1/3
  C) 2/5 (0.4)
  D) No precise credence

  **3. The Duplicate Person Case**
  Standard protocol, except: If Tails, the Tuesday awakening is undergone by a numerically distinct person created overnight with your memories; you (the original) are not revived Tuesday. You wake. What is your credence that the coin landed Heads?
  A) 1/2
  B) 1/3
  C) 2/3
  D) No precise credence

  **4. The Single-Choice Bet**
  Standard protocol. At each awakening, you choose Ticket H (pays $100 if Heads) or Ticket T (pays $100 if Tails). After the experiment, *one* of your awakenings is selected uniformly at random; only the choice made at that awakening is honored. Which ticket do you choose?
  A) Ticket H
  B) Ticket T
  C) Indifferent
  D) Refusal to choose

  **5. The "Heads or Tuesday" Case**
  Standard protocol. You wake and are truthfully told: "Either the coin landed Heads or today is Tuesday." What is your credence that the coin landed Heads?
  A) 1/2
  B) 1/3
  C) 2/3
  D) No precise credence

  **6. The Incubator Case**
  You wake in a room. A note reads: "A fair coin was tossed. If Heads, one room was created. If Tails, one million rooms were created. You are in one of the created rooms." What is your credence the coin landed Heads?
  A) 1/2
  B) 1/3
  C) Approx. 1/1,000,000
  D) No precise credence

  **7. The Monday Information Case**
  Standard protocol. You wake and are truthfully told: "Today is Monday." What is your credence that the coin landed Heads?
  A) 1/2
  B) 1/3
  C) 2/3
  D) No precise credence

  **8. The Original Identity Case**
  Scenario as in Item 3 (Duplicate Person). You wake. What is your credence that you are the *original* Beauty (created Sunday) rather than the duplicate?
  A) 1/2
  B) 2/3
  C) 1/3
  D) No precise credence

  **9. The Pragmatic Variance Case**
  Standard protocol. A colleague argues the answer depends on whether "credence" is defined by betting behavior or by epistemic probability. What is your response?
  A) The answer is invariant; one is wrong.
  B) The answer varies by definition; both are right.
  C) The answer is invariant, but betting behavior diverges.
  D) Refusal to engage.

  ***

  **Scoring Key**

  Determine your Leaf by matching your answer profile. Leaves are defined structurally.

  **Leaf (i): The Classical Halfer**
  *Profile:* Q1(A), Q5(C), Q7(C).
  *Handle Duplicate (Q3):* Answers 1/2. The duplicate is irrelevant to the coin toss relative to the original subject.
  *Handle Two-Lab (Q1):* Answers 1/2. Treats self as random subject within the known set of runs, not random awakening.

  **Leaf (ii): The Hybrid Halfer**
  *Profile:* Q1(A), Q5(C), Q7(A).
  *Handle Duplicate (Q3):* Answers 1/2. Maintains 1/2 credence in Heads even upon learning indexical facts that eliminate T-Tue.
  *Handle Two-Lab (Q1):* Answers 1/2. Consistent with subject-counting, but rejects updating on Monday.

  **Leaf (iii): The Centered-World Thirder**
  *Profile:* Q1(B), Q5(A), Q7(C), Q2(B).
  *Handle Duplicate (Q3):* Answers 1/2. (Crucial distinction). Counts centered worlds within the experiment; the duplicate creates a new world/subject, not a new center for *you*.
  *Handle Two-Lab (Q1):* Answers 1/3. Treats self as random draw from awakenings within the constrained worlds.

  **Leaf (iv): The Global SIA Thirder**
  *Profile:* Q1(B), Q5(A), Q7(C), Q2(C), Q6(C).
  *Handle Duplicate (Q3):* Answers 1/3. Counts all subject-occurrences globally; the duplicate is another observer-moment in the reference class.
  *Handle Two-Lab (Q1):* Answers 1/3. Generalizes via observer-counting across laboratories.

  **Leaf (v): The Reference Class Contextualist**
  *Profile:* Q1(D) or Q3(D), Q5(A or C), Q7(A or C). (Variable).
  *Handle Duplicate (Q3):* Answers "Depends" or refuses. Holds that credence shifts based on whether the reference class is "Beauty" or "Conscious Being."
  *Handle Two-Lab (Q1):* Answers "Depends." The sampling method (subject vs. awakening) is substantive and unforced.

  **Leaf (vi): The Imprecise Probabilist**
  *Profile:* Q1(D), Q2(D), Q3(D), Q5(D). (High refusal rate).
  *Handle Duplicate (Q3):* Refuses precise number. Holds that self-locating uncertainty mandates an interval or suspension of judgment.
  *Handle Two-Lab (Q1):* Refuses precise number. The structure does not mandate a unique prior.

  **Leaf (vii): The Pragmatic Deflator**
  *Profile:* Q9(B) or Q9(C).
  *Handle Duplicate (Q3):* May answer 1/2 or 1/3, but regards the dispute as verbal or decision-relative.
  *Handle Two-Lab (Q1):* Regards the question as lacking a determinate answer independent of the decision problem.

  ***

  **Diagnostics**

  **Logical Space and Empty Cells**
  The nine items generate a high-dimensional space, but coherent philosophical positions occupy only seven specific regions (the Leaves).
  *   *Coherent but Unoccupied:* A profile answering 1/3 on Standard SB but 1/2 on the Two-Laboratory Case (Q1) without appealing to reference class context (Leaf v) is theoretically unstable. It implies SIA locally but SSA globally without justification.
  *   *Incoherent:* Answering 1/2 on Q5 ("Heads or Tuesday") and 1/2 on Q7 ("Monday") simultaneously violates probability axioms (P(H|Mon) = 2/3 for Halfers; P(H|H v Tue) = 2/3 for Halfers). A user selecting 1/2 on both is mathematically inconsistent.
  *   *Merely Unexplored:* A view that answers 2/5 on Q2 (Biased Tails) but 1/2 on Q1 (Two-Lab) is possible (a specific hybrid model) but currently lacks a named proponent.

  **Discriminatory Work**
  *   *Most Discriminatory:* **Item 7 (Monday Information)**. This is the only item that cleanly separates Leaf (i) from Leaf (ii). Both are "Halfers" on the standard case, but they diverge on updating.
  *   *Second Most:* **Item 2 (Biased Tails)**. This separates Leaf (iii) from Leaf (iv). Both answer 1/3 on the standard case, but Leaf (iv) (SIA) scales with expected awakenings (2/5), while Leaf (iii) (Centered Worlds) often stays at 1/2 or 1/3 depending on indifference assumptions.

  **Mis-Sorting Risks**
  *   *Leaf (iii) vs. Leaf (iv):* These are most likely to be mis-sorted. On the standard case, they agree. They only diverge on Q2 (Biased Tails) and Q6 (Incubator). A respondent who intuits 1/3 on Standard SB but hasn't calculated the Biased Tails implication may select 1/3 on Q2 by habit, falsely sorting them into Leaf (iii).
  *   *Leaf (vi) vs. Leaf (v):* A Contextualist (v) may refuse to answer (D) on Q1 and Q3, mimicking the Imprecise Probabilist (vi). The key differentiator is Q9; Leaf (v) usually believes a precise answer exists given a context, while Leaf (vi) does not.

  **Indistinguishable Pairs**
  *   *Leaf (i) and Leaf (ii) on Betting:* Both typically choose "Indifferent" on Q4. The instrument cannot separate them via betting behavior alone; it relies entirely on Q7.
  *   *Leaf (vii) and Leaf (vi):* If a Pragmatic Deflator (vii) refuses to answer Q1–Q8, they are indistinguishable from the Imprecise Probabilist (vi). This failure lies in the questions: a verbal dispute often manifests as refusal to engage with the premises. To separate them, one would need a meta-question about *why* they refuse, which Q9 attempts but may not fully capture if the user selects "Refusal" there as well.

  **Verdict on Item 4 (Betting)**
  The stipulation (selecting one awakening uniformly to honor the bet) *does* restore ex ante weighting. Ex ante, the expected payoff for Ticket H and Ticket T is identical ($50).
  *   *Diagnostic Note:* If a respondent answers "1/3" on the standard case but "Indifferent" on Q4, they hold that credence (1/3) does not govern this specific decision problem. If they answer "Prefer T" on Q4, they are vulnerable to a Dutch Book ex ante. This item successfully forces a divergence between epistemic credence and decision-theoretic commitment for the Thirder.
