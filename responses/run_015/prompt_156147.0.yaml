prompt: |-
  I've been reading about Popper's poverty of historicism — the idea that you can't have laws of history because human knowledge keeps growing and that growth is unpredicatable, so the future doesn't follow a script. I'm not an academic, just someone who likes thinking about this stuff in the evenings, and I got into an arguement with my cousin who thinks big data and AI forecasting mean Popper was wrong. So now I'm trying to figure out which open questions in this space actually matter, not just which ones sound smart.

  There's a bunch of directions people talk about, but I can't tell what's upstream. For instance: does Popper's argument only destroy grand 'stages of history' theories (like Marxist ones), or does it also block smaller, statistical regularities — say, that democracies rarely go to war with each other? Then there's this idea I made up, maybe it's nonsense: 'frozen-knowledge regimes,' where a society suppresses new science on purpose. If knowledge growth is artificially stopped, does that suddenly make historical predicition possible, and does that undermine Popper or actually confirm him? And then there's the quantitative history crowd that uses machine learning on archieves — are they dodging the poverty argument, or are they just finding correlations that fall apart the moment someone invents something?

  If you had to advise a non-expert with about a year of serious reading — no funding, no team, just books and thinking — which of these lines is worth the effort? I care about which one is most upstream (settling it changes the answer to the others), which is tractable without being a historian with archieve access, and which ones are overrated distractions. Rank them by importance for actual understanding, not just academic fashion. And tell me if my 'frozen-knowledge' thing is even coherent or if I'm mixing up levels. Please end with a one-line summary of the single top priority inside \answer{...}, like \answer{whether Popper blocks all statistical regularities or only grand narratives}.
