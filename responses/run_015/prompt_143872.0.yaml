answer: |-
  You have hit on one of the most sophisticated tensions in Neurath's philosophy. You are absolutely right to suspect that the "transparency" isn't a magical elimination of mediation. If ISOTYPE requires a legend, scale, and syntactic rules, it is a coded language, not a direct mirror of nature.

  However, Neurath would argue that you are conflating two different kinds of "baggage." To see why he thought this distinction mattered for Physicalism and Protocol Sentences, we need to separate **Constitutive Conventions** from **Theoretical Commitments**.

  Here is the conceptual walkthrough of the distinction you are looking for.

  ### 1. The Two Types of "Baggage"

  Your snag rests on the idea that *all* mediation is equal. Neurath argues there is a functional difference between the mediation required to read a map and the mediation required to understand a metaphysical claim.

  **A. Interpretive Convention (The ISOTYPE Legend)**
  *   **Nature:** Arbitrary but explicit.
  *   **Function:** Coordination.
  *   **Example:** "One icon = 1,000 workers."
  *   **Theoretical Load:** Zero. This rule does not tell you *why* there are workers, whether capitalism is good, or what the essence of labor is. It is a purely syntactic/semantic mapping agreement. It is like agreeing that a red traffic light means "stop." The convention is visible, negotiable, and changeable without altering the physical reality being described.

  **B. Semantic/Theoretical Ambiguity (Verbal Terms)**
  *   **Nature:** Hidden and constitutive of the concept.
  *   **Function:** Explanation/Essence.
  *   **Example:** "Class Struggle" or "Electron."
  *   **Theoretical Load:** High. To use the word "electron" in 1930 implies a specific theoretical model of atomic structure. If the theory changes (e.g., from Bohr to Quantum Mechanics), the *meaning* of the word changes. To use "Class Struggle" implies a specific historical materialist theory of history. You cannot use the term without buying into the theoretical framework that gives it meaning.

  **The Conceptual Difference:**
  Neurath isn't trying to eliminate *conventions*; he is trying to eliminate *hidden ontological commitments*.
  *   **ISOTYPE conventions** are like the rules of chess. They define how the pieces move, but they don't tell you who should win or why the game exists.
  *   **Verbal theory-ladenness** is like claiming the King piece *actually represents* Divine Right. That is a claim about the world smuggled into the definition of the piece.

  Neurath's goal was to make the conventions **explicit** so they could be scrutinized, rather than letting them hide inside the grammar of words.

  ### 2. Does This Break Physicalism?

  You asked: *If picture-languages depend on conventions, does that break his physicalist idea that protocol sentences should be stable across theories?*

  This is the crux. Neurath's Physicalism was not a claim that "only matter exists." It was a claim about **language**. He defined Physicalism as the proposal that all scientific statements should be reducible to a language of spatiotemporal coordinates and observable order.

  **The Stability of Protocol Sentences**
  For Neurath, a Protocol Sentence (e.g., "Neurath observed a red patch at location X at time T") is not "stable" because it is infallibly true (he actually argued against Schlick on this; Neurath thought protocols could be rejected). They are stable because they are **intersubjectively checkable physical inscriptions.**

  *   **Verbal Instability:** If I say "The electron jumped," and our theory of electrons changes, the statement loses its truth value or meaning.
  *   **ISOTYPE/Physicalist Stability:** If I place a factory icon on a chart at coordinate (X,Y), that is a physical act. The *convention* says it represents a factory. Even if our economic theory of what a factory *does* changes completely, the statement "An icon was placed here to represent a factory" remains a stable physical fact.

  **The Relocation is the Point**
  You suggested the transparency is "relocated, not eliminated." Neurath would say: **Exactly, and that is the victory.**
  By relocating the ambiguity from the *terms* (which claim to describe reality) to the *legend* (which admits it is a tool), you prevent the language from dictating the theory.
  *   In verbal language, the vocabulary often dictates what theories are possible (Sapir-Whorf-ish, but metaphysical).
  *   In ISOTYPE, the vocabulary is deliberately shallow. It forces you to put the theory *outside* the chart, in the accompanying text, where it can be argued about, rather than hiding it inside the icon.

  ### 3. The Missing Distinction: Coordination vs. Representation

  The distinction you are struggling to pin down is between **Coordination** and **Representation**.

  *   **Representation** implies a correspondence between the word and the "true nature" of the thing. This is where theory-ladenness lives. (e.g., Does "justice" correspond to a Platonic form?)
  *   **Coordination** implies a synchronization of behavior between observers. (e.g., We agree to call this shape a "factory" so we can count them.)

  Neurath's Physicalism is fundamentally about **coordination**. He wants scientists (and citizens) to be able to point to the same state of affairs without arguing about metaphysics.
  *   If I use the word "soul," we might fight about whether it exists.
  *   If I use an ISOTYPE icon of a body lying down, we agree on the physical arrangement. Whether that body has a "soul" is a separate discussion, not embedded in the icon.

  **Does convention break this?**
  No, because the convention is treated as a **physical tool**, not a truth claim.
  If we agree that "Blue Icon = Hospital," that is a social contract. If we later decide "Red Icon = Hospital," we just update the legend. The *science* (the count of hospitals, their locations, their capacity) remains stable.
  If we use the word "Hospital," the term might carry baggage about "healing," "sanctity," or "medical authority" that changes over centuries. The *concept* drifts. The ISOTYPE convention does not drift; it is either followed or it isn't.

  ### 4. Summary: The "Demystification" of Mediation

  Your intuition that the transparency is "relocated" is correct, but your worry that this undermines the project is where Neurath would push back.

  Neurath never claimed to achieve a "God's eye view" or unmediated access to reality. He was a coherentist. He knew we are trapped in language.
  *   **The Problem:** Traditional language pretends it *isn't* mediated. It pretends "Electron" is the thing itself.
  *   **Neurath's Solution:** ISOTYPE and Physicalist Protocol Sentences admit they are mediated. They wear their conventions on their sleeves (in the legend, in the spatiotemporal coordinates).

  **The Conceptual Payoff:**
  The difference between "Interpretive Convention" and "Theory-Ladenness" is the difference between **admitting you are using a map** vs. **believing the territory is made of paper.**

  *   **ISOTYPE Conventions:** "We are using this map key to coordinate our actions." (Stable across theories because it makes no claim about the territory's essence).
  *   **Verbal Theory-Ladenness:** "This word captures the essence of the territory." (Unstable, because essences are theoretical and change).

  So, does it break the stability of Protocol Sentences? No. It secures it by lowering the stakes. A protocol sentence in Neurath's system doesn't claim "This is the Truth." It claims "This is the inscription we have agreed to use to coordinate." That agreement can remain stable even if our theories about *why* the factory is there change completely.

  You aren't missing a distinction; you are correctly identifying that Neurath swapped **Epistemological Foundations** (truth) for **Pragmatic Coordination** (agreement). The "transparency" he wanted wasn't transparency of *reality*, but transparency of *method*. He wanted the rules of the game to be visible, so players wouldn't cheat by smuggling metaphysics into the pieces.
