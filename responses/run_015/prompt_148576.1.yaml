          *   *Weighing Costs:* If the future is astronomically valuable, *any* non-zero extinction risk dominates near-term economic/scientific gain. This leads to "paralysis by analysis."
          *   *Verdict:* HoH struggles here. Asilomar chose "proceed with caution." HoH might demand "proceed only if risk is effectively zero" or "stop forever." The fact that HoH can justify *slowing down* (risk) or *speeding up* (lock-in good values) validates the editor's concern. It lacks a decision procedure for *this* specific uncertainty.

      *   **Section 3: Explanation vs. Misdescription**
