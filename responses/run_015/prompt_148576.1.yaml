      *   *Implication:* Extreme caution or extreme acceleration depending on risk/lock-in analysis. Long-termism is the ethical framework.
      *   *Tension:* It often lacks specific action-guidance because "locking in good values" and "avoiding extinction" can pull in opposite directions, and identifying the "hinge" is ex-post facto.

  3.  **Deconstruct Asilomar (1975):**
      *   *Context:* Recombinant DNA (rDNA) new and scary.
      *   *Action:* Voluntary moratorium, then conference, then voluntary guidelines (containment).
      *   *Motivation:* Immediate biosafety (cancer, pathogens), professional responsibility.
      *   *Outcome:* Field flourished, fears didn't materialize, guidelines relaxed.
