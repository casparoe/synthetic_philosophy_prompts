  4.  **Drafting - Section by Section:**

      *   **Section 1: Mapping (Agents, Options, Stakes)**
          *   *Agents:* The 140 attendees (elite biologists). HoH would say they are "hinge agents."
          *   *Options:* Total ban, voluntary guidelines (chosen), statutory regulation, laissez-faire.
          *   *Stakes (HoH view):* Not just cancer, but existential risk (engineered super-plagues) or value lock-in (norms of biological manipulation).
