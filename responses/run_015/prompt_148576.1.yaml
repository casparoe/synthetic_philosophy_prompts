      *   **Section 4: Reverse Analysis (The Counterfactual Test)**
          *   *Test:* If they were explicit HoH theorists, what changes?
          *   *Result:* Probably nothing different in outcome, but different *justification*. They might have demanded stricter containment or a longer moratorium to model existential risk rather than just microbiological risk.
          *   *Cherry-picking:* If the outcome is the same, claiming HoH vindication is indeed retrospective. The success of Asilomar was due to professional norms and low actual risk, not long-termist calculus.
          *   *Defense:* Maybe HoH provides the *language* to revive Asilomar for AI/Bio now, even if it didn't drive the original event. It's a normative tool, not a descriptive history.

      *   **Section 5: Coda (He Jiankui & Enforceability)**
          *   *He Jiankui (2018):* Showed the limits of self-governance. Asilomar worked because the tech was hard to hide (lab equipment) and the community was small. Gene editing is cheaper, more distributed.
          *   *Self-Governance:* Works only under specific conditions (scarcity, visibility, cohesion).
          *   *Enforceability:* HoH prescriptions need teeth. Voluntary guidelines fail when stakes are high and actors are dispersed. Asilomar isn't a replicable model for decentralized tech.

  5.  **Refining the Tone:**
      *   Needs to be sophisticated, avoiding jargon where possible, but precise.
