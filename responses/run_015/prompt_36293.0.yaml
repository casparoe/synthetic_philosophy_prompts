answer: |-
  This is not a verbal dispute, nor is it a substantive disagreement about the mathematical facts. Both parties agree on the Löwenheim–Skolem theorem, both agree on the quasi-categoricity of second-order ZFC, and both agree on the definition of standard semantics. The stalemate persists because the dispute is not about *what the theorems say*, but about the **order of explanation** between logic and set theory.

  Here is the diagnosis: The debate is a collision between two incompatible methodological demands on what counts as a "foundation."

  ### 1. The Diagnosis: Order of Explanation
  You asked if this is two questions under one name. It is, but more specifically, it is a single question where the two sides reverse the dependency relation between **syntax** and **semantics**.

  *   **The Relativist (Skolem/Putnam):** Demands that semantics be *reducible* to syntax or model-theoretic constructions that are themselves set-theoretically humble (usually first-order). For the relativist, "determinate" means "fixed by axioms and logical consequence." Since first-order axioms cannot fix the model up to isomorphism (due to L-S), reference is indeterminate. When the categoricity party invokes second-order logic, the relativist sees a violation of this order: you are using a semantic notion ("all subsets") that is *stronger* than the syntax you are trying to ground. To the relativist, this is question-begging because the semantics of second-order logic *presupposes* the very set-theoretic totality (the power set) that was supposed to be clarified.
  *   **The Categoricity Advocate (Zermelo/Shapiro):** Demands that syntax be *faithful* to mathematical practice. For the categoricity advocate, "determinate" means "uniquely characterized up to isomorphism." Since mathematicians clearly intend to talk about *the* natural numbers or *the* cumulative hierarchy, and second-order logic captures that intention while first-order logic does not, second-order logic is the correct tool. To the advocate, the relativist's demand that semantics be reducible to first-order model theory is an artificial constraint that distorts actual mathematical meaning.

  The stalemate exists because the Relativist charge ("you presuppose the notion of set") is **true**, but the Categoricity reply ("of course we do, that's the point") is also **reasonable**. The relativist wants a foundation that stands *outside* set theory to justify it. The categoricity advocate argues that no such Archimedean point exists; we must use our best grasp of sets to clarify our logic about sets.

  ### 2. Why the "Begging the Question" Charge Fails to Move the Needle
  The relativist's stock reply—that second-order semantics presupposes a determinate grasp of "all subsets"—has not changed sides because it relies on a hidden premise: **that a foundational theory must provide a non-circular reduction.**

  If you accept that circularity is fatal, the relativist wins. But if you accept a form of **conceptual coherentism** (where our grasp of logic and our grasp of sets mutually support each other), the categoricity advocate wins.
  *   Putnam's model-theoretic argument assumes that reference is fixed by causal or operational constraints internal to the theory.
  *   Shapiro and McGee assume reference is fixed by a grasp of concepts that transcends any specific formalization.

  Neither side can refute the other because they are arguing from different epistemic norms. The relativist treats "set" as a theoretical term defined by its role in a system. The categoricity advocate treats "set" as a primitive concept that the system attempts to describe.

  ### 3. What Counts as Progress?
  A new formal result will not break this deadlock. We already have the theorems. Proving a stronger categoricity result won't help the relativist, who will simply argue the semantics required to prove it is illegitimate. Proving a stronger L-S variant won't help the categoricity advocate, who denies the relevance of non-standard models to intended interpretation.

  Progress would come from one of two sources:

  **A. The Right Distinction: Internal vs. External Determinacy**
  Progress lies in explicitly distinguishing two senses of "determinate":
  1.  **Proof-Theoretic Determinacy:** Can the object be uniquely pinned down by a recursively enumerable set of axioms? (Relativist standard).
  2.  **Semantic Determinacy:** Does the term refer to a unique structure in the intended interpretation, regardless of our ability to axiomatize it? (Categoricity standard).

  Once this distinction is foregrounded, the dispute dissolves into a choice of priorities. The relativist prioritizes (1) because it ensures epistemic access (we can verify proofs). The categoricity advocate prioritizes (2) because it ensures ontological fidelity (we talk about what we mean). Acknowledging that these are competing virtues, rather than one being "correct," would end the "running in place."

  **B. Good Grounds for Expecting None (The Carnapian Turn)**
  The most honest diagnosis is that this is a **framework choice**.
  *   If you want a logic that is compact, complete, and allows for a model theory that can be formalized within ZFC, you must accept first-order logic and Skolem's paradox.
  *   If you want a logic that captures the categorical nature of arithmetic and set theory, you must accept second-order logic and the loss of completeness (and the reliance on a background set theory).

  Progress here would be the widespread acceptance that **foundations are not foundational in the sense of being prior to the mathematics they describe.** The search for a "view from nowhere" (a semantics for sets that does not use sets) is the illusion driving the dispute.

  ### Verdict
  The dispute is substantive, but not about the world; it is about **methodological priority**.
  *   Is it verbal? No. It's about which logical tools are legitimate.
  *   Is it about the power set? Yes, but specifically about whether the power set is a *given* or a *construction*.
  *   Is it two questions? Yes: "Can we axiomatize it?" (No, in FO) vs. "Do we mean something specific?" (Yes, in SOL).

  **What counts as progress:**
  Stop looking for a formal result to solve a philosophical impasse. Progress is the recognition that **semantic primitivism** (accepting "all subsets" as intelligible without reduction) is the price of admission for categoricity. If one finds that price too high (due to the lack of a complete proof system or the reliance on background set theory), one must accept relativism.

  The stalemate will only break when the field collectively abandons the hope that logic can provide an *external* justification for set theory. Until then, the relativist will continue to point out the circularity, and the categoricity advocate will continue to point out the fidelity. Both are right, relative to their own constraints on what "foundation" means.
