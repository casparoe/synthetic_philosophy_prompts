answer: |-
  A floodwater surge has trapped six miners in a sinking shaft. One man is wedged in a dry air-pocket high up; five are submerged in a lower chamber. You control the winch. Option one: hoist the man in the air-pocket immediately. The cable tension will collapse the lower chamber supports; the five drown for certain. Option two: bypass the winch and route all power to the drainage pumps. This offers a thirty per cent chance of draining the lower chamber in time to save everyone, including the man above. If it fails, the power surge collapses the entire shaft; all six drown. You cannot do both.

  1.  **The Verdicts:** (a) The expected-lives view calculates 1.8 lives saved on option two versus one life on option one. It demands the gamble. (b) The anti-numbers view holds that no individual's claim is stronger than another's. Since the one man's claim to certain rescue is definite, whilst the five others' claims rely on a probabilistic intervention that endangers him, you are permitted—even required—to honour the claim you can satisfy without subordinating him to risk for others' sake. (c) The lottery view, seeking equal chance per person, might favour option two (thirty per cent each) over option one (one hundred per cent versus zero), unless it insists on a coin toss between the *options* themselves.

  2.  **The Lever:** The work is done by **certainty versus risk**. Option one offers a definite save for one; option two offers a probabilistic save for all. If you remove certainty—making the winch also ninety per cent reliable—the anti-numbers view loses its grip. It collapses back into the standard stand-off, where tossing a coin between the strategies becomes the only way to respect equal claims.

  3.  **Smuggling Utility:** Yes, but individually. The anti-numbers verdict relies on the fact that the gamble is worse *for the one man* (seventy per cent risk of death versus zero). This is expected-utility reasoning applied to a single agent, which Taurekians accept. They reject only the *summation* of utilities across different people. A sharp reader will spot this, but it is not fatal; the view denies that the five's aggregated gain outweighs the one's individual loss.

  4.  **The Wriggle:** A defender of counting numbers will argue you are ignoring the five's perspective. In option one, they face certain death. In option two, their risk of death drops from one hundred per cent to seventy per cent. By saving the one, you are effectively sacrificing the five's reduced risk for the sake of the one's absolute safety, which reintroduces aggregation: you are privileging one person's certainty over five people's risk reduction.
