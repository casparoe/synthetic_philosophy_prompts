  Hi — you're a professional philosopher who's spent a lot of time on the Taurek side of the "should the numbers count?" fight, and you're good at building clean hypotheticals. Take it slowly: brainstorm a bit about what structural levers are even available before you commit to anything, and think the whole thing through properly before you start writing. British English throughout, please.

  I'm a journalist working on a feature about whether the numbers should count in rescue and triage cases. I don't want a summary of the literature, I don't want to be told who argued what, and I definately don't want citations or suggestions for further reading — I've read around, and anyway none of that survives into print. What I want is one case I can put in front of readers.

  Here's what I can't get to work myself. In the ordinary set-up the roles are fixed: the numbers person saves the five, the anti-numbers person shrugs — or tosses a coin — and says nothing forces them to prefer the many. I want those roles swapped, without cheating.

  So: build me a single decision, one paragraph of plain prose, set somewhere a reader would recognise (a night shift, a flood rescue, a disaster ward), no trolleys, no bridges, no pushing anyone, no sci-fi, no one being killed by the rescuer — just someone who can't save everybody. Constraints:

  - six people at risk, and the chooser can do exactly one of two things;
  - everyone would die the same sort of death; nobody is anyone's patient, child or friend; no special duties; no ages, no quality-of-life differences; no one's consent or preferences stipulated; no doing-versus-allowing trick;
  - the lever you pull is the probability structure and nothing else — what would happen to each person if nothing were done, and how reliable the intervention is. Hold the numbers, the badness of death and the strength of anyone's claim in the ordinary sense fixed;
  - the expected-lives view comes out for the gamble: it gives up a life it could save for sure in return for a better expected tally spread over the others;
  - the anti-numbers view comes out for the one, and as close to determinately as you can honestly get it. If the honest answer is that the best it can manage is "permitted, and the one's claim looks stronger", say that plainly rather than pretending otherwise.

  Then show me the thing works:

  1. what each of these says and why — (a) count expected lives saved; (b) the anti-numbers view, where no one's claim is stronger and so the numbers settle nothing; (c) the lottery version, where since the claims are equal each person should get an equal chance;
  2. which single feature of the case is doing the work, and what happens to the three verdicts if I take it out — I expect it collapses back into the usual stand-off, but tell me if it doesnt;
  3. honestly, whether the anti-numbers verdict is smuggling in expected-utility reasoning one person at a time, because if it is, a sharp reader will spot it and my piece is dead;
  4. what a defender of the numbers view would say to wriggle out of your case.

  Keep the scenario to that one paragraph and the discussion under about 600 words. No footnotes, no papers, no names beyond what I've used — just the case and the argument for it.
