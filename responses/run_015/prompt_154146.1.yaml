answer: |-
  This is fascinating timing on your part. You are literally living through a classic problem in analytic metaphysics while sitting in a seminar about it. Your sister isn't "confused" in a silly way; she has intuitively stumbled onto one of the most famous debates in 20th-century philosophy, specifically regarding **Origin Essentialism**.

  Here is the breakdown of the philosophy, the biology, and how to talk to her without making the IVF process sound like a sci-fi experiment.

  ### 1. The Core Philosophical Concept: Origin Essentialism
  The argument you had in your seminar is likely centered on **Saul Kripke's** work (specifically *Naming and Necessity*). Kripke argued for something called the **Necessity of Origin**.

  *   **The Thesis:** A person's origin (the specific sperm and egg that created their zygote) is an *essential property* of that person.
  *   **The Implication:** You could not have been born from different gametes and still be *you*. If your parents had used a different sperm or egg, *you* would not exist. A *different* person would exist.

  **So, is your sister right?**
  According to the dominant view in metaphysics (Kripkean essentialism): **Yes.**
  If she uses a donor egg, the resulting child is **numerically distinct** from the child she "would have had" with her own egg. They are not the same individual. The "child she would have had" is not a specific soul waiting in the wings; that child is merely a *possibility* that never actualized. The donor egg baby is an *actual* person with a different origin.

  ### 2. Sperm vs. Egg: Does it matter which one changes?
  Your sister asked if using donor sperm vs. donor egg changes the identity differently.
  **Philosophically: No.**
  **Biologically: No.**

  From the perspective of Origin Essentialism, the zygote is the starting point of the organism. A zygote is formed by the union of *one* specific sperm and *one* specific egg. If you change either variable, you have a different zygote.
  *   Different Egg + Same Sperm = Different Zygote = Different Person.
  *   Same Egg + Different Sperm = Different Zygote = Different Person.

  There is no philosophical hierarchy here. Changing either gamete results in a different numerical identity.

  ### 3. Where You Were Right: Numerical vs. Qualitative Identity
  You told her she was mixing up genetics with "who someone is." You were trying to make a distinction that philosophers call **Numerical Identity** vs. **Qualitative Identity**.

  *   **Numerical Identity:** Is this *the exact same entity*? (e.g., Is this the same ring you lost?)
      *   *Verdict:* The donor egg baby is **not** numerically identical to the biological child she "would have had." They are two different people, just as you and your cousin are two different people.
  *   **Qualitative Identity:** Does this entity share similar *properties*? (e.g., Is this ring made of the same gold?)
      *   *Verdict:* The donor egg baby might be *qualitatively* similar (raised in the same home, same values, maybe even similar traits if the donor resembles the mother), but they are not the *same* person.

  **Your intuition was correct:** There is a massive difference between "this specific child" (numerical identity) and "any child she raises" (qualitative/relational role). Your sister is worried that because the *numerical identity* is different, the *relationship* is different. That is where the philosophy stops and the emotion begins.

  ### 4. The Danger Zone: The "Rental" Comment
  This is the most important part for you as a brother.
  When she says the baby is "basically a rental," she is expressing anxiety about **kinship and ownership**, not metaphysics.

  **Do not validate the "rental" comment with philosophy.**
  While metaphysics says the baby is a "different individual" than the hypothetical biological one, ethics and family law say the baby is **hers**.
  *   **Metaphysics:** "This is a different person than the one you imagined."
  *   **Ethics/Parenting:** "This is *your* child because you are the one gestating, birthing, and raising them."

  If you tell her, "Actually, philosophically, it is a different person," she might hear, "It's not really your baby."
  Instead, you should frame it like this:
  > "Philosophically, you're right that it's a different specific individual than the one you might have had naturally. But that doesn't make it a 'rental.' Every parent imagines a 'hypothetical child' before they conceive. The moment you conceive—whether naturally or with donors—that hypothetical child vanishes and a real one takes their place. The fact that the genetics are different doesn't change the fact that this is the specific individual who is *yours* now."

  ### 5. The "Non-Identity Problem" (For your seminar)
  Since you are in a metaphysics seminar, you should know that this IVF scenario is the real-world version of Derek Parfit's **Non-Identity Problem**.

  Parfit argued that actions that change *who* comes into existence (like choosing a donor egg) can't be said to harm the resulting child, even if the child has a difficult life, because without that action, *that specific child* wouldn't exist at all.
  *   **Sister's worry:** "Am I making a different person than I 'should' have?"
  *   **Parfit's answer:** There is no "should." You aren't depriving a specific person of existence; you are choosing which person to bring into existence.

  ### Summary for your Sister
  1.  **Validate the Metaphysics:** Tell her she's actually asking a deep philosophical question that professors argue about. It's not just her being anxious.
  2.  **Clarify the Identity:** Confirm that yes, using a different egg means a different specific individual (numerical identity). The "child she would have had" doesn't exist and never will.
  3.  **Correct the Emotion:** Emphasize that **origin does not equal parenthood.** A different origin makes the baby a different *person*, but it does not make them a different *child*.
  4.  **Shut down the "Rental" talk:** Remind her that "rental" implies temporary possession. A child is a permanent relationship. The genetics determine *who* they are, but the parenting determines *whose* they are.

  **The Line You Were Looking For:**
  The line is between **existence** and **relation**.
  *   **Existence:** Tied to the gametes. Change the gametes, you change the person who exists.
  *   **Relation:** Tied to the social/biological act of raising. Change the gametes, you do *not* change the fact that she is the mother.

  She is right about the metaphysics, but she is wrong to let the metaphysics undermine the reality of her motherhood.
