  Me and my friend got into a long one last night about teleosemantics — naturalizing mental content in terms of biological proper function — and I think we were both talking past each other for half of it, but I'm also pretty sure one of us said something defintely false and I can't work out which. His line was that proper function is fixed by selection history, so teleosemantics can only ever assign content to innate, hard-wired detector states, and that any state a creature aquires during its own lifetime (by learning, imprinting, calibration, whatever) either ends up with no content at all or ends up with the wrong one. I pushed back on this but badly, and now I want a case rather than a recap of the debate.

  Build me a thought experiment to spec:

  1. One organism, one internal state S, one intervention. Biologically plausible — a real-ish animal or simple organism with a real-ish mechanism, not a robot, not an AI, not a human with a strange name. Scenario itself in one paragraph.
  2. S cannot be innate. The creature has to acquire it during its own lifetime via a mechanism that itself has a selection history (learning, imprinting, calibration). So whatever content S has has to be derived from the function of the acquiring mechanism, not from a story about a detector being selected to fire at X. If the only version of teleosemantics that can handle your case is one that quietly goes back to hard-wiring, say so instead of sneaking it in.
  3. S has to be something the creature actually acts on, it has to be reliable in the creature's home environment, and it has to be the kind of state that can be wrong — no case where nothing would count as misrepresentation.
  4. The verdicts I want: the producer version (content = what S has the function of being caused by) assigns a fairly specific, fairly distal content P; the consumer version (content = the condition that has to hold for the downstream system that uses S to do its job) assigns a more proximal and more general content Q. That is, the grain has to come out the opposite way from the famous toad-and-fly / bee-dance cases, where it's the consumer story that gives you the distal content. (If I've got the producer/consumer labels backwards, correct me.) Also tell me what a pure causal-informational / indicator account says about S — my bet is it gives a disjunction or just collapses P and Q, but show the reasoning.
  5. No swamp creatures, no duplicates, no instant organisms, no brains in vats, no appeal to any designer's intentions, and no stipulating the content and calling it a result. The divergence should fall out of the creature's actual history.
  6. Then the payoff: one novel situation where the three accounts disagree about whether the creature is misrepresenting, and what actually hangs on that — i.e. whether the creature's failure there is a representational failure or merely a functional one.

  After the scenario, walk through each theory's verdict and why, name the single feature of the case that's doing the work, say what happens to the verdicts if you remove it, and give me the best move available to a defender of whichever theory comes out worst (I'd guess something like: you picked the wrong mechanism as "the" consumer, or the learning wrinkle shows content is relational rather than absent).

