answer: |-
  Right, let's pour a fresh pint and settle this properly. It is a splendid argument, the sort that usually ends with someone storming off or ordering another round, so it deserves a careful audit. You are asking me to wear two hats: the philosopher of action (concerned with agency, judgement, and rationality) and the behavioural economist (concerned with discounting curves and commitment devices).

  Before we get to the tables and the verdict, we must do a bit of groundwork. We need to ask: what work is this analogy actually *doing* in your friend's argument?

  ### 1. Brainstorming the Analogy's Function

  Your friend is attempting a *dissolution* of the puzzle rather than a *solution*. The traditional puzzle of *akrasia* (weakness of will) is normative: how can a rational agent knowingly act against their own best judgement? It implies a failure of integration within a single agent.

  Your friend's analogy (both the Contract and the Leasehold versions) functions to **externalise the conflict**. By modelling time-slices as distinct parties (or tenants), he shifts the problem from *intrapersonal rationality* (one person failing to be coherent) to *interpersonal conflict* (two parties with competing interests).

  If the conflict is interpersonal, then:
  1.  **Irrationality vanishes:** It is not irrational for me to want something you do not want. It is merely a conflict of interest.
  2.  **Morality vanishes:** We do not moralise about neighbours having different tastes; we build fences. Hence, precommitment (the fence) replaces willpower (the virtue).
  3.  **Agency fragments:** There is no "whole self" to possess the will, only a sequence of occupants.

  The danger here is that the analogy is doing too much heavy lifting. It assumes that because preferences *change*, the *agent* has changed. In economics, this is the "Multiple Selves" model (à la Thaler or Shefrin). In philosophy, it leans on a Parfitian reductionism about personal identity. But does the behavioural data (hyperbolic discounting) actually force us to accept the metaphysical claim (distinct selves)? That is where the smuggling happens.

  ### 2. The Audit: Mapping the Analogies

  Let us lay out the mappings as you requested. We shall look at where the legal/property metaphor maps onto the psychological reality, and where the glue comes loose.

  | Feature | **The Contract Model** (Two Distinct Parties) | **The Leasehold Model** (Overlapping Tenancies) | **The Philosophical Reality** (Single Agent) |
  | :--- | :--- | :--- | :--- |
  | **The Parties** | Self($t_1$) and Self($t_2$) as distinct legal entities. | A series of short-term tenants with overlapping occupancy. | One numerically identical person persisting through time. |
  | **Offer & Acceptance** | Self($t_1$) plans/commits; Self($t_2$) implicitly accepts by inheriting the plan. | Outgoing tenant sets conditions; incoming tenant accepts the state of the flat. | The agent forms an intention which binds their future agency. |
  | **Consideration** | Self($t_1$) sacrifices now for Self($t_2$)'s gain. | Tenant A maintains value for Tenant B, expecting reciprocity from Tenant C. | Prudence: sacrificing present utility for greater lifetime utility. |
  | **The Breach** | Self($t_2$) indulges, violating Self($t_1$)'s terms. | Incoming tenant wrecks the flat inherited from the outgoing tenant. | Acting against one's own better judgement *at the time of action*. |
  | **Damages** | Self($t_2$) suffers regret; Self($t_1$)'s investment is wasted. | Tenant B inherits a mess; future value of the property declines. | Reduced overall welfare; fragmentation of agency. |
  | **Enforcement** | External commitment devices (locks, apps, friends). | Structural constraints on the tenancy (rules of the house). | Willpower, self-regulation, or external precommitment. |
  | **Standing to Sue** | **Broken.** Self($t_2$) cannot sue Self($t_1$) (doesn't exist yet). Self($t_1$) cannot sue Self($t_2$) (is gone). | **Broken.** Who is the landlord? If the "Person" is the landlord, the tenants are not sovereign. | The agent has standing against themselves via reflection/criticism. |

  ### 3. Where the Mapping Breaks (and Why It Matters)

  There are three critical breaks in the mapping. Your friend hopes we treat them as incidental noise; I argue they are structural faults that collapse his conclusions.

  **A. The Standing Problem (The "Who Sues?" Break)**
  In a contract, both parties must exist to agree, and both must exist to enforce. In the Contract Model, Self($t_1$) makes the pact, but Self($t_2$) is the one who breaks it. But Self($t_2$) did not sign anything. You cannot be bound by a contract you did not sign.
  *   **Why it matters:** If Self($t_2$) didn't sign, it's not a breach of contract; it's just a change of mind. If it's just a change of mind, your friend is right that there is no irrationality. *However*, if they are the *same person*, then Self($t_1$)'s intention *does* bind Self($t_2$) by virtue of personal identity. The analogy breaks because it denies the very continuity required to make the "breach" feel like a failure rather than just a preference shift.

  **B. The Sovereignty of the Time-Slice (The "Smuggling" Break)**
  The analogy assumes each time-slice (or tenant) has **settled, sovereign preferences**. It treats the desire at $t_2$ as a given input, like a customer walking into a shop.
  *   **The Smuggling:** This smuggles in the idea that preferences are exogenous. But in human agency, preferences are often shaped by previous judgements. If I judge that health is best, I cultivate a desire for health. When hyperbolic discounting hits, it is not just a "different preference"; it is a *distortion* of my settled evaluative stance.
  *   **Why it matters:** If the time-slice is sovereign, then satisfying the current desire is always rational. But if the time-slice is merely a temporal part of a whole, then satisfying a transient desire that contradicts the whole's plan is irrational. The analogy forces the "sovereign slice" view without arguing for it.

  **C. The Boundary Problem (The "Sharp Line" Break)**
  The Contract Model requires a sharp boundary between Party A and Party B. The Leasehold Model tries to soften this with overlap, but still implies distinct tenancies.
  *   **The Reality:** Hyperbolic discounting is a continuous curve, not a handover of batons. There is no moment where "Present Self" ends and "Future Self" begins.
  *   **Why it matters:** If there are no sharp boundaries, you cannot have distinct parties. If you cannot have distinct parties, you cannot have an interpersonal contract. You are left with one person struggling with a fluctuating motivational gradient.

  ### 4. Verdict on Your Friend's Three Conclusions

  Now, let us see if his conclusions survive the audit.

  **Conclusion 1: "Nothing irrational is going on at all."**
  *   **Verdict:** **False.**
  *   **Reasoning:** This relies entirely on the "Multiple Selves" smuggling. If you accept that I am a sequence of strangers, then no, it is not irrational for Stranger B to ignore Stranger A's wishes. But standard theories of practical rationality (like Bratman's Planning Theory) argue that rationality *requires* cross-temporal coherence. Dynamic inconsistency (preferring A over B today, but B over A tomorrow) is a formal definition of irrationality in economics unless you explicitly adopt the "multiple selves" ontology. Your friend is assuming the ontology to prove the lack of irrationality. That is circular.

  **Conclusion 2: "The only honest response is institutional (precommitment), no willpower."**
  *   **Verdict:** **Overstated.**
  *   **Reasoning:** Precommitment is certainly the *most reliable* response to hyperbolic discounting (as Ainslie and Thaler note). However, claiming it is the *only* response denies the possibility of internal self-regulation. If I can cognitively reframe the reward (e.g., "that cigarette is not relief, it is poison"), I can alter the discount curve without external locks. The "Contract" analogy rules this out by fiat because contracts require external enforcement. But agents have internal enforcement mechanisms (conscience, habit, identity).

  **Conclusion 3: "Weakness of will is a misnomer; nothing left for a theory of the will to explain."**
  *   **Verdict:** **False.**
  *   **Reasoning:** Even if we accept the discounting model, we still need to explain *why* some people succumb and others resist, given the same curve. The "will" is simply the name for the capacity to align action with long-term judgement despite short-term pressure. Calling it a "contract breach" does not explain the mechanism of the breach. We still need a theory of how the agent integrates these competing signals.

  ### 5. Better Analogies?

  You mentioned the golfer and the lens. Let us weigh those.

  **The Golfer (Skill Failure)**
  *   *Idea:* The golfer knows the swing mechanics but "yips" under pressure.
  *   *Pros:* Preserves the single agent. Explains how knowledge fails to translate to action.
  *   *Cons:* Akrasia is often not a motor failure but a motivational one. The golfer *wants* to hit the ball straight; the akratic agent *wants* the cake more than the diet at that moment.
  *   *Verdict:* Useful for explaining the *mechanism* of failure, but less good for the *normative* status.

  **The Wide-Angle Lens (Optical Distortion)**
  *   *Idea:* The reward is the same size, but proximity distorts its appearance (like a nose in a selfie).
  *   *Pros:* This is excellent. It captures hyperbolic discounting perfectly. The object (health vs. pleasure) hasn't changed value objectively, but the *perspective* changes the subjective weight.
  *   *Implication:* It preserves the **Single Agent**. It is *my* vision that is distorted, not a different person looking at it.
  *   *Support for you:* This supports the idea that there *is* an error (a distortion), not just a difference of opinion. Rationality involves correcting for the distortion (using the "lens" of reflection), not just accepting the selfie as reality.

  **A Third Suggestion: The Constitutional Model**
  *   *Idea:* Think of the long-term self as the **Constitution** and the short-term self as the **Parliament**.
  *   *Mapping:* The Constitution sets the long-term rules (health, savings). Parliament (the present moment) is tempted to pass emergency legislation (eat the cake) that violates the Constitution.
  *   *Why it works:* It acknowledges the conflict without fragmenting the person. It allows for "judicial review" (willpower/reflection) to strike down the impulsive legislation. It validates precommitment (entrenchment clauses) but leaves room for internal governance.

  ### 6. Final Summary for the Pub

  Tell your friend this:

  His analogy is heuristically useful for designing commitment devices, but it is metaphysically bankrupt. It solves the puzzle of *akrasia* by defining the agent out of existence. If there is no "self" that persists, there can be no "weakness" of that self, but there also can be no "prudence" of that self. You cannot have it both ways.

  If he insists the Future Self is a stranger, he must admit that saving for pension is not "prudence," it is "charity." If he admits it is prudence, he admits there is a single beneficiary, and therefore a single agent who is failing to maximise their own good due to a temporal distortion.

  The discounting model explains the *cause* of the temptation (the curve), but it does not explain away the *normative failure* (acting against judgement). The lens analogy is superior: the near reward distorts the view, but the rational agent is the one who corrects for the distortion, not the one who accepts the selfie as truth.

  You win the point on irrationality; he wins the point on the utility of commitment devices. But do not let him convince you that the will is a myth simply because the preferences are inconsistent. The will is precisely the faculty required to navigate that inconsistency.

  Now, I believe it is your round.
