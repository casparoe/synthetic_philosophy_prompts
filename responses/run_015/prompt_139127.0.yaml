      *   **Friend's Argument:** Hyperbolic discounting dissolves the puzzle of akrasia. It's just inter-temporal conflict between different "selves." Therefore, no irrationality, just conflicting preferences. Solution: Precommitment/institutions, not willpower/moralising.
      *   **Two Models to Audit:**
          1.  *The Two-Party Contract Model:* Present Self vs. Future Self as distinct parties.
          2.  *The Leasehold Model:* A series of short tenancies with overlapping occupancy.
      *   **Specific Requirements:**
          *   Brainstorm the work the analogy is doing before committing.
          *   Use British English (spelling, idioms, tone).
          *   Create a mapping table (Parties, Offer/Acceptance, Consideration, Breach, Damages, Enforcement, Standing).
