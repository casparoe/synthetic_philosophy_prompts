  hey — I'm in a reading group this semester on the AI control side of safety (the bit where you're supposed to design measures that work assuming the system might actually be misaligned and smart enough to hide it, rather than just confused or incompetent), and I've noticed my gut verdicts on which measures are legit don't add up to anything I can state. I was arguing with a couple of people after last session and couldn't get past "well, that one just feels different," so I want to do this properly: here are my verdicts, and I want you to tell me what principle they come from, if any.

  Narrowing deployment so the blast radius is small — no internet, scoped tools, giving up most of the value the system could have produced: obviously fine, boring. Planting a fake exfiltration path with credentials that lead nowhere and treating any attempt to use them as disqualifying: fine, enthusiastically — I think it's the best thing on the list. A tripwire on the chain of thought, where the system doesn't know the exact trigger: fine but I trust it much less than everyone else in my group does, because it seems to only catch instances that are bad at hiding. Discarding a particular output when a weaker trusted monitor flags it, with no gradient flowing back into training: fine, even though the monitor is wrong a lot and it costs us. Fine-tuning against a deception classifier, i.e. penalizing reasoning that looks scheming: not fine — this is the one I feel most strongly about, it seems to just select for instances that write nicer reasoning. Randomised double-blind audits where human reviewers get real outputs mixed with planted ones: fine. Telling the system it's monitored 100% of the time when it's really 5%: not fine, and I can't fully say why, since it's the same basic move as the honeypot. Running a thousand copies and majority-voting so no single instance has much leverage: I said fine, but then someone pointed out that copies sharing weights and updates might effectively coordinate, and my verdict wobbled, so I'm not sure what I think.

  Our group has been using two rough labels: a measure is "soft" if its protective force comes from the system not knowing about it or being confused about the situation, and "hard" if it constrains what the system can bring about regardless of what it knows. My tentative principle was something like: admissible measures are the hard ones, plus soft ones that deceive about the world but not about the game. I don't think that survives contact with the cases though — the honeypot sure looks soft. So: state a principle (or two or three candidates) that captures as many of my verdicts as possible, say which clause each case motivates, be explicit about which verdicts you'd overturn and why, and note where a simpler principle beats a complicated one that saves everything. Two more things: tell me what your principle predicts about deliberately shaping the system's motives so it welcomes being shut down or corrected (I lean not-fine but can't articulate it), and help me with the case I keep flip-flopping on, which is asking a system we already suspect of scheming to help us design the tripwires and write the monitor prompts — sometimes that reads like the smartest available move and sometimes like handing the fox the blueprint. Please don't give me a reading list or name-drop papers, we're explicitly told to argue from the cases for this one, and honestly none of us can tell what's actually in the literature anyway.
