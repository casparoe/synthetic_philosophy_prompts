answer: |-
  Your diagnosis is sharp, but it needs one crucial refinement. You identify the stalemate as a verbal dispute about "theory" masking a formal question about tautology. I would argue it is a **category error dispute** masking a **model-selection problem**.

  The debate stalls because the two camps are using the word "explanation" to mean fundamentally different things, and the formal mathematics of the FEP allows both interpretations to remain technically defensible.

  Here is the breakdown of why it is stuck, the verdict on your tautology hypothesis, and what would actually be required to move the needle.

  ### 1. The Diagnosis: Description vs. Mechanism
  The core reason the debate recycles the same arguments is that Friston and his critics are arguing about different layers of abstraction.

  *   **Friston (The Physicist's View):** He treats the FEP as a **principle of description**, analogous to the Principle of Least Action in physics. Least Action doesn't tell you *how* a particle decides to move; it says that whatever path the particle takes, it can be *described* as minimizing an action functional. For Friston, if the math holds, the FEP is a "law" of self-organizing systems. It doesn't need to be mechanistic; it needs to be universal.
  *   **Critics (The Cognitive Scientist's View):** They treat the FEP as a **claim about mechanism**. When Friston says "the brain minimizes free energy," critics hear "the brain computes gradients of free energy." If the FEP is just a redescription of dynamics that already exist (i.e., you can fit a free energy function to *any* dynamics post-hoc), then it explains nothing about the *mechanism* of cognition.

  **Why this causes a stall:**
  Friston can always retreat to the "Principle" defense ("I'm not claiming the brain calculates this, I'm saying the dynamics are isomorphic to this"). The critics can always retreat to the "Vacuity" charge ("If it applies to everything, it predicts nothing"). Because the FEP formalism is flexible enough to support the "Principle" interpretation, Friston is never formally wrong; but because the "Principle" interpretation offers no leverage for building specific cognitive models, the critics are never pragmatically satisfied.

  ### 2. The Formal Question: Theorem or Assumption?
  You asked: *How much of the FEP is actually a theorem given the Markov blanket assumptions, and how much is just an assumption in disguise?*

  **The Honest Answer:** The derivation from "Markov Blanket + Stationary Distribution" to "Free Energy Minimization" is a **theorem**. The tautology charge is technically incorrect regarding the math *itself*.

  **However,** the tautology charge is correct regarding the **ontology**.
  Here is the hidden formal problem: The Variational Free Energy (VFE) function is constructed *from* the system's own stationary distribution.
  1.  Assume a system has a stationary distribution (it persists).
  2.  Define a VFE function based on that distribution.
  3.  Conclude the system minimizes VFE.

  This is mathematically valid, but it creates an **inverse problem**. If you can construct a VFE function for *any* persistent system (even a rock, provided you define its states loosely enough), then the claim "Life minimizes VFE" reduces to "Life persists."

  The stall happens because Friston argues that the **constraints** on the VFE function (e.g., it must be tractable, the blanket must be sparse) add empirical content. Critics argue these constraints are either too loose to rule anything out or too strict to apply to real biology. There is no consensus on the "complexity penalty" for the VFE model. If the VFE function required to describe a rock is infinitely complex, but the VFE function for a brain is simple, then FEP has content. But we lack a formal metric for "complexity of the free energy functional" that both sides accept.

  ### 3. Can the Debate Be Ended?
  An honest assessment: **No, not in its current form.** The FEP is too malleable to be falsified as a general principle. It functions more like a research program (Lakatosian) than a specific hypothesis.

  However, the debate *can* be dissolved or rendered obsolete through three specific avenues of progress:

  #### A. The "Active Inference" Pivot (Empirical Resolution)
  The FEP (the principle) is likely unfalsifiable. **Active Inference** (the specific process theory derived from FEP) is falsifiable.
  *   **Progress Condition:** A pre-registered experiment where Active Inference makes a quantitative prediction about neural dynamics or behavior that standard Reinforcement Learning (RL) or Bayesian Brain hypotheses *do not* make, and the prediction is confirmed.
  *   **Current Status:** There are papers claiming this (e.g., in saccadic eye movements or proprioception), but critics argue the models are overfitted.
  *   **What would end it:** A "smoking gun" task where an agent's behavior violates the Bellman optimality of RL but satisfies the expected free energy minimization of Active Inference (specifically regarding information-seeking/epistemic value). If FEP predicts exploration where RL predicts exploitation, and the organism explores, that is progress.

  #### B. The "Uniqueness" Theorem (Formal Resolution)
  The critics' strongest argument is underdetermination (you can fit anything).
  *   **Progress Condition:** A theorem proving that for a specific class of biological systems (e.g., homeostatic regulatory networks), the Free Energy functional is **unique** (up to trivial transformations) and **simpler** (in terms of description length) than any alternative dynamical description.
  *   **Why this matters:** If FEP is just one of infinite ways to describe a system, it's useless. If it is the *minimum description length* way to describe self-organizing systems, it wins on Occam's Razor.
  *   **Likelihood:** Low. Information geometry is hard, and "simplicity" is subjective.

  #### C. The "Markov Blanket" Operationalization (Conceptual Resolution)
  The whole edifice rests on the existence of Markov Blankets in real systems.
  *   **Progress Condition:** A robust, algorithmic method to identify Markov Blankets in high-dimensional empirical data (e.g., fMRI or neural spike trains) *without* assuming the FEP beforehand.
  *   **Current Status:** Most studies assume the blanket exists to prove the FEP holds.
  *   **What would end it:** If researchers can point to a dataset and say, "Here is the statistical boundary that constitutes the blanket, independent of our theory," and then show the internal states minimize VFE relative to that specific boundary. If you can't find the blanket without assuming the theory, the theory is circular.

  ### 4. Summary of the Stalemate
  Your hypothesis that this is a verbal dispute about "theory" is correct, but the underlying formal issue is **non-identifiability**.

  *   **Friston** is selling a **language** (a way to translate dynamics into Bayesian terms).
  *   **Critics** are buying a **mechanism** (a causal explanation of how brains work).

  The debate stalls because you cannot falsify a language, only a claim made within it. As long as FEP is presented as a "Principle" (universal description), it is immune to empirical refutation but also scientifically inert. As soon as it is presented as a "Model" (specific mechanism), it becomes vulnerable to the critics' charges of underdetermination.

  **What counts as progress?**
  Progress is not proving the FEP "true." Progress is **restricting the scope**.
  1.  **Negative Progress:** Proving that certain biological systems *cannot* be modeled as FEP agents without absurd complexity. (This would force Fristonians to retreat to a narrower domain).
  2.  **Positive Progress:** Demonstrating a specific neural circuit where the *synaptic update rules* mathematically map to gradient descent on a variational bound, in a way that is distinct from Hebbian learning or Backprop.

  Until the FEP camp moves from "Everything is FEP" to "Here is exactly what is *not* FEP," or provides a unique prediction that survives pre-registration, the debate will remain a philosophical stalemate disguised as mathematics.
