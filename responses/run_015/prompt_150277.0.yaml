answer: |-
  **The Case: The Liability Inspector**

  **The Setup**
  You are a safety inspector for a nuclear component. The component is either **Sound** ($S$) or **Flawed** ($F$). You must decide whether to **Certify** ($C$) or **Reject** ($R$). There is a fixed regulatory statute: if you Certify a Flawed component, you are personally liable for damages *if and only if* you knew it was Flawed at the time of certification. If you Certify a Flawed component without knowing (i.e., in ignorance), the statute treats it as an unavoidable error, and you suffer no penalty (the utility is the same as certifying a Sound component). You are offered a perfect, free, private test that reveals the component's status. You are a scrupulous EU maximizer; your utility is over career outcomes (Bonus, Status Quo, Jail), not over "knowing" itself.

  **The Probabilities and Payoffs**
  Prior probability of Flaw: $P(F) = 0.1$; Sound: $P(S) = 0.9$.
  Payoffs (Utility Units):

  | State | Act | Outcome (Ignorance) | Outcome (Knowledge) |
  | :--- | :--- | :--- | :--- |
  | **Sound (0.9)** | Certify | +10 (Bonus) | +10 (Bonus) |
  | **Sound (0.9)** | Reject | 0 (Status Quo) | 0 (Status Quo) |
  | **Flawed (0.1)** | Certify | +10 (Bonus)* | -100 (Jail)* |
  | **Flawed (0.1)** | Reject | 0 (Status Quo) | 0 (Status Quo) |

  *\*Note: The physical outcome (component installed) is identical. The institutional consequence differs based on epistemic state.*

  **The Calculation**
  **1. Without Information (Ignorance):**
  You cannot condition on the state. You must choose one act for the prior.
  *   $EU(Reject) = 0$.
  *   $EU(Certify) = 0.9(10) + 0.1(10) = 10$. (The liability rule does not trigger).
  *   **Optimal Act:** Certify. **Expected Utility:** **10**.

  **2. With Information (Knowledge):**
  You receive a perfect signal.
  *   If Signal = Sound (0.9): You know $S$. Rule allows $C$. $EU = 10$. Optimal: Certify.
  *   If Signal = Flawed (0.1): You know $F$. Rule punishes $C$ (-100). Optimal: Reject (0).
  *   **Expected Utility of Information:** $0.9(10) + 0.1(0) = 9$.
  *   **Value of Information:** $9 - 10 = \mathbf{-1}$.

  **Diagnosis: Which Premise Fails?**
  Good's Theorem relies on the inequality $E[\max_a U(a, s)] \ge \max_a E[U(a, s)]$. This holds because the set of available acts $A$ is assumed to be **independent of the information partition**. In this case, the feasible set of acts (or rather, the consequence function mapping acts to outcomes) is *signal-dependent*. Specifically, the mapping $M: Act \times State \to Outcome$ is actually $M: Act \times State \times EpistemicState \to Outcome$. Good's theorem assumes the agent's epistemic relation to the state is not a causal variable in the payoff structure. Here, *mens rea* is a causal variable. The premise that fails is **Consequence Independence**: the consequence of an act depends not just on the state of the world, but on the agent's information state regarding that world.

  **Constraint Analysis: What Room Is Left?**
  Given your six constraints, this is the *only* available route.
  1.  **No Game Theory:** We used a fixed rule, not a strategic opponent.
  2.  **No Costs:** The test is free; the cost arises from the action taken *after* the test.
  3.  **No Infinities:** Finite utilities and probabilities.
  4.  **Realistic:** Liability statutes are common.
  5.  **Ordinary Signal:** The test doesn't break the component; it only changes belief.
  6.  **No Stipulated Utility:** The disutility is Jail, not "Sadness." The link between Knowledge and Jail is institutional, not psychological.
  Once you fix the utility function over external outcomes and forbid information costs, the only way to make information harmful is to make the *possession* of information change the payoff structure of the acts. This requires an institutional or physical rule that is sensitive to the agent's knowledge (a "knowledge trigger").

  **Sensitivity Analysis**
  If you delete the "Knowledge Trigger" in the liability rule (i.e., make it Strict Liability where you are punished for Certifying Flawed components regardless of knowledge), the case collapses back into a confirmation of Good's Theorem.
  *   *Without Info:* $EU(Certify) = 0.9(10) + 0.1(-100) = -1$. Optimal: Reject (0).
  *   *With Info:* $0.9(10) + 0.1(0) = 9$.
  *   Value of Info: $9 - 0 = 9$ (Positive).
  The negative value vanishes once the consequence function becomes independent of the epistemic state.

  **Objection Handling: The Defender's Move**
  A defender of Good's Theorem will argue: **"You have redefined the State."**
  In Savage's framework, a "State of the World" must be a complete description of everything relevant to the outcome. If the payoff depends on whether the agent knows the flaw, then "Agent Knows Flaw" is part of the state description. Therefore, the signal does not merely reveal the state; it *changes* the state (from "Flaw & Unknown" to "Flaw & Known"). Since Good's Theorem assumes the signal reveals a pre-existing state without altering the state space itself, this case falls outside the theorem's scope.

  **Is this Principled or Rhetorical?**
  It is **principled**, but it reveals a substantive limitation in the standard model's applicability to social contexts.
  *   *Rhetorical:* "You changed the definitions, so you didn't break the theorem."
  *   *Principled:* Standard decision theory models the world as *ontologically* independent of the mind. In legal and ethical contexts, the world is *partially constituted* by the mind (intent/knowledge). If we treat "Knowledge" as a state variable, we admit that the act of observation is an intervention that changes the state of the world (the epistemic state). Good's Theorem applies to **ontic states** (physical configurations) but not necessarily to **epistemic states** when those states are causally potent. The distinction is not cheating; it marks the boundary between decision theory in physics (where observation is ideally passive) and decision theory in law/society (where observation can be constitutive of liability).

  **Restated Theorem for the Problem Sheet**
  > **Theorem (Good, Restricted):** Let $A$ be a set of acts and $S$ be a set of states. Let $U(a, s)$ be a utility function defined over acts and states. If an agent receives a costless signal that partitions $S$ into subsets, and if **the utility of any act-state pair is independent of the signal partition itself**, then the expected utility of acting conditional on the signal is at least as great as the expected utility of acting without the signal.

  **Convention vs. Substance Flag**
  The answer depends on the **convention of State Description**.
  *   *Substance:* In social reality, knowledge causally affects outcomes (via laws/norms).
  *   *Convention:* Standard decision theory conventionally defines "States" to exclude the agent's own knowledge to preserve the independence assumption.
  If you adopt the convention that States must include epistemic relations, the theorem holds but the "signal" is no longer passive (it changes the state). If you adopt the convention that States are purely external, the theorem fails in knowledge-sensitive contexts. For the exam, accept either derivation provided the student identifies the **Consequence Independence** assumption as the pivot point.
