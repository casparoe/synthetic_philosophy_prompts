answer: |-
  **PREP SHEET: HARNESS DEBT & THOUGHT EXPERIMENTS**
  **CONF:** Sci-Comm / Philosophy Co-Host
  **TIME:** 25m Talk / 20m Q&A

  ### 1. CONCESSIONS (Make these in the first 5 minutes)
  *Do not wait to be cornered. State these early to disarm the room.*

  *   **Concede the Word Count:** Acknowledge explicitly that journalists *cannot* print ceteris paribus clauses. It is not negligence; it is the medium. If you blame editors for cutting text, you lose the room.
  *   **Concede Bad Philosophy:** Admit that some thought experiments *are* junk and deserve to die. Your theory isn't a shield for bad philosophy; it's a diagnostic for why good philosophy breaks in translation.
  *   **Concede Expert Fallibility:** Experts disagree. The "expert consensus" you reference is often a local consensus within a specific sub-field. Don't present it as monolithic truth.

  ### 2. OBJECTIONS (Ordered by Damage Potential)

  #### **I. The Grad Student (Methodology)**
  **The Objection:** "Your theory is unfalsifiable. If a layperson agrees with the expert, you say the harness held. If they disagree, you say a constraint was dropped. How do you independently verify the 'harness' exists without just asking the experts what they think? You're circular."
  **Damage:** **Critical.** If this stands, your "predictions" and "swap test" look like post-hoc rationalization.
  **The Reply (2 mins):** "It is falsifiable via the Swap Test. I predict that if you vary a detail the original argument treats as irrelevant (e.g., the color of the trolley, the gender of the teleporter), the lay intuition flips while the expert verdict stays stable. If the lay intuition *doesn't* flip when I predict it will, my identification of the harness is wrong. The harness isn't a mental object; it's a stability condition. If the verdict wobbles on irrelevant details, the harness is missing. I'm inviting you to break my model."
  **Soft Spot:** You need a clear record of what the "original argument treats as irrelevant." If the original text is ambiguous, you can't prove the detail was supposed to be irrelevant. You are relying on the philosopher's *intent*, which is hard to pin down.

  #### **II. The Comms Psychologist (Framing)**
  **The Objection:** "You've dressed up framing effects in nicer clothes. We know that omitting context changes decisions. Calling it 'harness debt' adds no predictive power over standard framing theory. It's just 'omission framing' with a metaphor."
  **Damage:** **High.** Makes your talk redundant. They study narrative persuasion for a living; don't tell them you discovered omission matters.
  **The Reply (2 mins):** "Framing usually refers to how options are presented (gain vs. loss). Harness debt is about *structural constraints* required for logical validity, not emotional valence. A frame changes how you feel about the choice; a missing harness changes *which* choice is being modeled. If I remove the 'no third option' constraint from a trolley problem, I haven't framed the dilemma differently; I've turned a forced choice into an open-ended problem. That's not a psychological effect; it's a logical category error."
  **Soft Spot:** The line between "structural constraint" and "contextual frame" is blurrier than you want to admit. Psychologists will argue that constraints *are* frames.

  #### **III. The Philosopher (Fragility)**
  **The Objection:** "If a thought experiment relies on unstated constraints that vanish when explained to a layperson, it's a bad thought experiment. Robust intuitions should survive translation. You're blaming the journalist for the philosophy being fragile."
  **Damage:** **Medium.** Undermines the source material. If the TEs are fragile, why use them at all?
  **The Reply (2 mins):** "Some are fragile, some aren't. My point is to identify which ones are. We treat TEs like lab equipment. If a spectrometer only works in a vacuum, you don't blame the user for taking it outside; you note the operating conditions. I'm asking us to label the operating conditions. If a TE breaks when the 'no magic' constraint is removed, that tells us something about the TE, not just the reader."
  **Soft Spot:** You have to be willing to throw specific, famous thought experiments under the bus. If you hedge here, they'll smell blood.

  #### **IV. The Veteran Editor (Utility)**
  **The Objection:** "Okay, the harness gets dropped. So what? My readers engage with the story, think about ethics, and feel something. If the 'verdict' isn't the expert one, but they're still thinking about the problem, haven't I done my job?"
  **Damage:** **Low.** Practical, not theoretical. Easy to deflect, but annoys the journalists if you sound elitist.
  **The Reply (2 mins):** "You have done your job. But if you report the lay reaction as 'Philosophy says X,' you've published a factual error. I'm not asking you to stop using TEs. I'm asking you to stop reporting the resulting intuition as a universal verdict. Report it as 'Here's how this scenario plays out when we remove constraint Y.' That's better science writing."
  **Soft Spot:** Doesn't solve the space problem. You're asking for nuance in a medium that pays by the inch.

  ### 3. THE KILL SHOT
  **Which objection must be answered for the talk to survive?**
  **The Grad Student (Unfalsifiability).**
  If the audience believes "Harness Debt" is just a way for you to say "You disagreed with me because you missed a rule I didn't state," the theory collapses into arrogance. You must emphasize the **Swap Test** as the empirical check. Without that, you are just asserting authority.

  ### 4. EXAMPLE SELECTION
  **Which example should you NOT use?**
  **Drop: Mary the Color-Blind Scientist.**
  **Why:** It is too metaphysically dense. The "harness" there involves specific commitments about physicalism and qualia that the philosophers in the room will fight over immediately. They will nitpick whether Mary *actually* learns something new, rather than listening to your point about how the story was retold. It invites a debate on the *philosophy*, not the *communication*.
  **Keep:** The Teleporter case (identity is intuitive) and the Self-Driving Trolley (high stakes, clear constraints like "no swerving"). These allow you to focus on the *structure* of the retelling rather than the *content* of the metaphysics.

  ### 5. THE META-QUESTION
  **The Question:** "Isn't the harness theory itself an intuition pump with no harness? Since every counterexample can be re-described as a missing constraint, aren't you immune to refutation?"

  **The Straight Answer:**
  "Yes. It is a pump. But it is a *diagnostic* pump, not a *normative* one.
  I am not using it to tell you what is morally right. I am using it to tell you where the machinery is exposed.
  And it is not immune to refutation. If you can show me a case where the 'harness' was fully stated, the constraints were clear, and the lay intuition *still* diverged from the expert consensus for reasons unrelated to constraint loss, my theory fails.
  Or, if you can show me a retelling where constraints were dropped but the intuition *didn't* shift, the 'debt' concept is useless.
  I am not claiming this explains all miscommunication. I am claiming it explains a specific structural failure. If the Swap Test doesn't work, the harness theory is wrong. Put it to the test."

  **(Note: Deliver this without defensiveness. If you sound like you're protecting the theory, you validate their suspicion. If you sound like you're handing them the tools to break it, you validate the science.)**
