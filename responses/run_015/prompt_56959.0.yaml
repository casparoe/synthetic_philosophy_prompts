      *   *Let's finalize the ordering:*
          1.  Grad Student (Unfalsifiable) - Destroys the "science" of the claim.
          2.  Psychologist (Framing) - Destroys the "novelty" of the claim.
          3.  Philosopher (Fragility) - Destroys the "value" of the source material.
