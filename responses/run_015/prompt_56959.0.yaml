      *   *Meta-question:* Admit it is a pump, but a tool, not a truth.

      *(Self-Correction on Meta-Question)*: The user wants a "straight answer — not a dodge." I need to be careful not to be too clever. The answer is "Yes, but..."

      *(Final check on tone)*: "Don't soften the bad news." Okay, I will be blunt about the soft spots.

