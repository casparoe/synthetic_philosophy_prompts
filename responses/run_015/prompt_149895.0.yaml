answer: |-
  # Speaker's Prep Sheet: Saturating Prioritarianism
  **Seminar:** Interdisciplinary Moral Philosophy (Analytic Ethicists + Welfare Economists)
  **Topic:** Saturating Prioritarianism (Sigmoidal Weighting of Well-Being)
  **Goal:** Defend the normative coherence of the saturation function against charges of arbitrariness and repugnant implications.

  ---

  ## 1. Top Objections (Ordered by Likelihood & Damage)

  ### **Objection A: The "Arbitrary Parameter" Objection (The $K_m$ Problem)**
  *   **The Charge:** "You've replaced the arbitrary concavity of standard prioritarianism with an arbitrary inflection point and saturation threshold. In welfare economics, this looks like an unjustified discontinuity in social welfare weights. In ethics, it looks like 'Sufficientarianism in drag.' What non-stipulative moral fact determines where the curve saturates?"
  *   **Likelihood:** Very High (Economists will spot the parameter risk; Ethicists will spot the Sufficientarian overlap).
  *   **Damage:** High. If the threshold is arbitrary, the theory lacks action-guiding power.
  *   **Strategy:** **Reframe.** Do not defend a specific number. Defend the *continuity* of the function.
  *   **Talking Point:** "Unlike Sufficientarianism, which posits a normative cliff (a discontinuity where moral status changes abruptly), the sigmoid is continuous and differentiable. The 'threshold' is not a hard line but a region of reflective equilibrium representing the point where basic needs are securely met. The exact coordinate is less important than the *shape*, which captures the intuition that priority diminishes rapidly after sufficiency without vanishing entirely."

  ### **Objection B: Violation of the Pareto Principle**
  *   **The Charge:** "If the marginal moral weight asymptotically approaches zero for the well-off, your view implies indifference to Pareto improvements among the saturated. If I can make a billionaire slightly happier at no cost to anyone, your weighted sum barely registers. This violates Weak Pareto."
  *   **Likelihood:** High (Standard objection from welfare economists and prioritarianism critics like Otsuka).
  *   **Damage:** Medium-High. Risks making the view look lexically prioritarian (which Parfit warned against).
  *   **Strategy:** **Hold Firm.**
  *   **Talking Point:** "Prioritarianism *already* accepts that we should sometimes sacrifice a gain for the better-off to secure a smaller gain for the worse-off. My view simply makes this trade-off steeper. Crucially, because the asymptote is never *zero*, Pareto improvements are never morally invisible, only heavily discounted. This preserves the formal structure of welfarism while respecting the urgency of need."

  ### **Objection C: The "Bio-Category Error"**
  *   **The Charge:** "You are importing enzyme kinetics (an 'is') into moral philosophy (an 'ought'). Biological saturation describes capacity limits, not normative weight. Why should moral value behave like a substrate binding site?"
  *   **Likelihood:** Medium (Philosophers love to police disciplinary boundaries).
  *   **Damage:** Medium. Risks making the core analogy seem gimmicky.
  *   **Strategy:** **Concede Ground (on the biology).**
  *   **Talking Point:** "I am not deriving normative truth from biochemistry. The kinetic curve is purely heuristic—a mathematical visualization of a moral intuition we already hold: that the urgency of benefits drops off sharply after a certain point of security. The math is a tool for precision, not a biological justification."

  ---

  ## 2. The One Reply That Must Land
  **The Continuity Defense.**

  You must convince the room that **Saturating Prioritarianism is the only view that captures the "Sufficiency Intuition" without the "Cliff Edge."**

  *   **Why:** Standard Prioritarianism is too weak (it never really lets go of the rich). Sufficientarianism is too jagged (morally arbitrary cliffs).
  *   **The Line:** "If we agree that there is a point where having *more* matters less for justice, but we reject the idea that moral status changes abruptly at a specific dollar amount, a sigmoidal function is the *unique* mathematical solution that satisfies both continuity and diminishing priority. It is the smoothest possible bridge between Priority and Sufficiency."

  ---

  ## 3. The Weakest Structural Point: Normative Arbitrariness
  **The Risk:** The audience will argue that choosing the saturation point (the "Michaelis constant" of justice) is as arbitrary as choosing the exponent in a standard prioritarian power function. If you can't justify *where* the curve flattens, the theory is indeterminate.

  **How to Defend (Without Biology):**
  1.  **Reflective Equilibrium:** Argue that the parameter is not fixed *a priori* but is determined through democratic deliberation or reflective equilibrium regarding "basic needs" and "social minimums." It is a policy variable, not a law of nature.
  2.  **Robustness:** Argue that the *conclusions* of the theory are robust across a *range* of saturation parameters. As long as the curve is sigmoidal, the ranking of most distributive choices remains stable even if the inflection point shifts slightly.
  3.  **The "Zone" Argument:** Don't call it a threshold; call it a "saturation zone." This mitigates the charge of precision-arbitrariness.

  **Script:** *"I am not proposing a universal constant. I am proposing a functional form. The specific calibration of the saturation zone is a matter for public reason and context-dependent application, much like setting a poverty line. The philosophical innovation is the rejection of the 'cliff' in favor of the 'slope,' which avoids the non-identity and discontinuity problems plaguing Sufficientarianism."*

  ---

  ## 4. The "Hope Nobody Asks" Objection: Life-Saving Treatment
  **The Scenario:** A wealthy individual (above saturation threshold) needs a costly life-saving treatment. The resources could instead lift a poor individual (bottom of the curve) to the steep part of the curve. The math suggests withholding treatment from the wealthy to save the poor.
  **The Risk:** Sounding like a "Threshold Utilitarian" who sacrifices rights for aggregate weighted utility.

  **Time-Pressure Response Strategy:**
  Do **not** argue that the wealthy person's life is worth less. Argue about the **magnitude of the loss**.

  **The Reply:**
  1.  **Death is a Reset:** "Dying is not merely remaining at the saturation level; it is a drop to zero (or negative) well-being. The weighted gain of preventing death is moving a person from 'Null' to 'Saturated.' Even with a saturation discount, the *integral* of that gain is massive."
  2.  **The Asymptote is Not Zero:** "Because the curve is asymptotic, the moral weight of the wealthy person's continued life is never zero. If the cost of treatment is finite, there is a threshold where the cost outweighs the benefit, but we cannot assume *a priori* that the saturated person's life is expendable."
  3.  **Rights Constraint (Fallback):** "If the math still implies letting them die, then Saturating Prioritarianism must be constrained by deontic side-constraints regarding basic rights to life. The weighting function applies to *distributive shares of surplus*, not to the basic right to exist."

  **Recommended Soundbite:** *"We must distinguish between the marginal value of an extra year of luxury and the marginal value of life itself. Preventing death is not an increment above saturation; it is a rescue from the bottom of the scale. The sigmoid applies to flourishing, not survival."*

  ---

  ## 5. Delivery Notes for a Biochemist-Philosopher
  *   **Watch the Analogy:** You know the Hill Equation better than they do. They know the *ethics* better than you do. Do not let the enzyme kinetics dominate the Q&A. Use the math to show precision, but ground the justification in Parfitian moral intuition.
  *   **Vocabulary Check:**
      *   Use **"Marginal Moral Value"** instead of "enzyme velocity."
      *   Use **"Social Welfare Function"** instead of "reaction rate."
      *   Use **"Reflective Equilibrium"** instead of "empirical fit."
  *   **Parfit Shadow:** Acknowledge Parfit explicitly. He worried about the "Absurd Conclusion" of prioritarianism. Position your view as solving Parfit's worry without abandoning his core insight.

  **Final Prep:** Practice the "Arbitrariness" response until it is automatic. That is where the economists will attack. If you hold the line on **Continuity vs. Cliff**, you survive.
