      *(Re-evaluating the "One Reply")*: The most crucial point is that the function is *continuous*. This distinguishes it from Sufficientarianism (which has a discontinuity/cliff). This is the main selling point against the "Arbitrariness" objection.

      *(Re-evaluating the "Life Saving")*: If I am a retired biochemist, I know that $V_{max}$ is a limit. If the moral weight is truly asymptotic to zero, then a large enough gain for the poor *always* outweighs a small loss for the rich, even if that loss is life. To avoid this, the loss of life must be modeled as a massive drop in well-being (to zero or negative), which generates a massive *weighted* gain in preventing it. Even if the person is above saturation, *dying* puts them below it. So saving them is moving them from "Dead" to "Saturated." That is a huge weighted gain. This is the technical fix.

