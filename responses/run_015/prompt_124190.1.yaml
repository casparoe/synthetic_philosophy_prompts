      *   *Refinement on #4:* Make sure it doesn't sound *too* abstract. It needs to be testable. The "test" is whether subjects can identify identity across radical style shifts *consistently*.

  10. **Final Polish:** Ensure the tone is persuasive for a funder. Use terms like "foundational validity," "operationalization," "ecological validity." (Proceed to generate output).

  *(Self-Correction during drafting)*: Wait, I need to look closely at Candidate 3 again. "Synthetic bleed... when a generative model learns..." If they have no web/corpora, training a model is hard. But maybe they use a simple procedural generator? Even so, the *interpretation* of the bleed is the issue. Is it the model's limitation or the category's fuzziness? This introduces a confound (the model architecture). Studying human perception directly (#1) is cleaner. Okay, sticking with dropping #3.

