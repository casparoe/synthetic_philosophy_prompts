      *   **Tone:** Reasoned, argumentative (for a funder), not just a literature survey.

  2.  **Analyze the Candidates:**
      *   *1. The Ghost Stroke Problem:* Systematic removal/warping of strokes. Necessary features vs. family resemblance. (Experimental/Design heavy).
      *   *2. Cross-Modal Recognition:* Reading 'a' in fog/neon. Abstract invariant vs. pattern matching. (Perception/Cognition heavy).
      *   *3. Synthetic Bleed:* Generative models creating boundary glyphs ('a' vs 'e'). Fuzzy edges vs. style/category entanglement. (AI/Model heavy - *Wait, constraint check: "no web access or massive corpora"*).
      *   *4. The Essence-Style Split:* Separation of identity (what) vs. appearance (how). Relative essence. (Philosophical/Theoretical heavy).

  3.  **Evaluate Constraints & Team Composition:**
      *   *Team:* Philosopher (theory), Cognitive Scientist (experiments/subjects), Type Designer (stimuli/visual intuition).
      *   *Constraint:* No massive corpora, no web access. This is crucial. It means training large generative models (Candidate 3) is likely impossible or contrary to the spirit of the constraint. They need to rely on human subjects, hand-crafted stimuli, and conceptual analysis.
      *   *Goal:* Conceptual gaps in categorization.

  4.  **Determine the Ranking (The "Defended Ordering"):**

      *   *Candidate 4 (Essence-Style Split):* This is the most fundamental philosophical question. If essence and style *cannot* be separated, the other questions change meaning. It sets the metaphysical groundwork. It fits the Philosopher perfectly, needs the Designer to articulate "style," and the CogSci to test if humans *treat* them as separate. *Verdict: #1 (Most Upstream).*

      *   *Candidate 1 (Ghost Stroke):* This is the operationalization of #4. If we assume there *is* an essence, what constitutes it? Is it structural (strokes) or relational? This is highly tractable for a Designer (drawing variants) and CogSci (testing recognition thresholds). It generates concrete data without needing big data. *Verdict: #2 (The Empirical Engine).*

      *   *Candidate 2 (Cross-Modal):* This is about robustness. It's important, but it feels like a special case of #1. If we understand the minimal features (Ghost Stroke), we understand why fog works. It's slightly downstream because it relies on environmental noise rather than structural definition. However, it's still very tractable for this team (showing images to people). *Verdict: #3 (The Stress Test).*

      *   *Candidate 3 (Synthetic Bleed):* This relies on "generative models." The prompt says "no massive corpora." Training a model to bleed categories usually requires data. If they use a pre-existing small model, it's technical work that might distract from the philosophical/cognitive core. More importantly, "fuzzy edges" is a conclusion, not a mechanism. It presupposes the model *knows* what 'a' and 'e' are. Without big data, this is hard to execute well. It feels the least "upstream" because it observes the *result* of categorization rather than the *mechanism*. *Verdict: DROP.*

  5.  **Drafting the Argument (Iterative Refinement):**

      *   *Introduction:* Acknowledge the richness of the prompt. Set the stage for the "Low-Tech/High-Concept" approach.
      *   *The Drop (Candidate 3):* Get this out of the way. Why? It depends on tools they don't have (big data/compute) and it treats the symptom (boundary cases) rather than the cause (categorical structure).
      *   *Rank 1 (Candidate 4 - Essence-Style):* Why upstream? You can't test strokes (#1) if you don't know if "style" is a variable independent of "identity." It's the metaphysical premise. Tractability: Philosopher leads, Designer defines styles, CogSci tests independence. Success metric: A formal framework or a decisive null result (they are inseparable).
      *   *Rank 2 (Candidate 1 - Ghost Stroke):* Why second? It operationalizes #4. It's the "lab work." Tractability: Designer makes the stimuli, CogSci runs the psychophysics. Success metric: A "survival map" of letterforms.
      *   *Rank 3 (Candidate 2 - Cross-Modal):* Why third? It's the ecological validation. Does the lab finding hold in the wild? Tractability: Doable, but maybe redundant if #1 is solved. Success metric: Showing that "fog" removal maps to "stroke" removal.

  6.  **Refining the "Upstream" Logic:**
      *   Need to ensure the connection between 4 -> 1 -> 2 is clear.
