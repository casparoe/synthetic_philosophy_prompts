answer: |-
  This is a compelling constraint set. A team of one philosopher, one cognitive scientist, and one type designer, stripped of big data and web access, is actually in the *ideal* position to solve this. You are forced to rely on human intuition, hand-crafted stimuli, and conceptual rigor rather than brute-force statistical correlation.

  Here is the defended ordering for your three-year agenda.

  ### The Drop: Candidate 3 (Synthetic Bleed)

  **Verdict:** Drop this immediately.

  **Reasoning:** It is the least upstream and violates the spirit of your constraints.
  1.  **The Confound:** Using a generative model to probe human categories introduces a massive confound: the architecture of the model itself. If the model produces an 'a'/'e' hybrid, is that because human categories are fuzzy, or because the model's latent space is linear in a way human cognition is not? You end up studying the model's philosophy, not humanity's.
  2.  **Constraint Mismatch:** You specified "no massive corpora." Training a generative model that meaningfully understands style transfer without significant data is an engineering bottleneck that will eat your three years. It distracts the Type Designer into coding and the Cognitive Scientist into hyperparameter tuning, leaving the Philosopher with nothing to analyze but error logs.
  3.  **Downstream Symptom:** "Bleed" is a symptom of categorization, not a mechanism. Understanding *why* the bleed happens requires solving Candidates 1 and 4 first. If you don't know what makes an 'a' an 'a' (Candidate 1) or if essence is separable from style (Candidate 4), observing a boundary case tells you very little.

  ---

  ### Rank 1: Candidate 4 (The Essence-Style Split)

  **Problem:** Is there a clean separation between what makes a glyph an 'a' (identity) and how it looks (style), or is the essence itself relative to style?

  **Why It Is Upstream:**
  This is the metaphysical precondition for the other two. If identity and style are fundamentally entangled (i.e., you cannot define an 'a' independently of its stylistic context), then Candidate 1 (removing strokes) becomes a category error. You cannot remove a "stroke" if the stroke's identity function is dependent on the style it is drawn in. You must establish whether "letterhood" is a stable variable across transformations before you measure the tolerance of those transformations.

  **Tractability for This Team:**
  *   **Philosopher:** Formulates the hypotheses (Realism vs. Relationalism about letter types).
  *   **Type Designer:** Creates "stress test" pairs. For example, taking a specific 'a' and morphing it into a Blackletter style vs. a Geometric Sans style to see if the "sameness" holds.
  *   **Cognitive Scientist:** Runs same/different matching tasks. Do humans judge identity faster when style is constant vs. when style varies?
  *   **Low-Tech Fit:** Requires drawing and human subjects, not GPUs.

  **Success/Failure Conditions:**
  *   **Move Up (Success):** You produce a formal "Invariance Framework" that predicts when style changes break identity. If you can prove that humans *do* separate essence from style consistently, you validate the entire field of typography as a cognitive science.
  *   **Move Down (Failure):** If results show that identity judgments are entirely context-dependent with no stable core, the project pivots. This is actually a valuable negative result, but it renders Candidate 1 less about "necessary features" and more about "contextual probability."

  ---

  ### Rank 2: Candidate 1 (The Ghost Stroke Problem)

  **Problem:** Can you systematically remove or warp individual strokes and keep categorical identity? Does this reveal necessary features or family resemblance?

  **Why It Is Upstream:**
  Assuming Candidate 4 establishes that there *is* a separable essence, Candidate 1 is the operationalization of that essence. It moves from metaphysics to mechanics. It is the "anatomy" phase of the project. You cannot understand robust recognition (Candidate 2) if you don't know which parts of the letter are load-bearing. This is the core empirical engine of the three-year grant.

  **Tractability for This Team:**
  *   **Type Designer:** This is their playground. They systematically delete counters, disconnect stems, or curve straight lines in controlled increments.
  *   **Cognitive Scientist:** Measures the "breaking point." At what percentage of stroke removal does recognition accuracy drop below 90%?
  *   **Philosopher:** Analyzes the data through the lens of Wittgenstein (family resemblance) vs. Classical Theory (necessary and sufficient conditions).
  *   **Low-Tech Fit:** This is pure psychophysics. It needs clean vectors and human eyes.

  **Success/Failure Conditions:**
  *   **Move Up (Success):** You identify a "Minimal Viable Glyph" set for the Latin alphabet. If you find that specific topological features (e.g., closure, verticality) are universally required regardless of style, you have discovered a cognitive universal.
  *   **Move Down (Failure):** If the "breaking point" varies wildly between subjects with no pattern, it suggests letter recognition is highly idiosyncratic or learned purely by exposure, which weakens the philosophical claim of a shared "category."

  ---

  ### Rank 3: Candidate 2 (Cross-Modal Recognition)

  **Problem:** Why do we read an 'a' in fog or neon when geometric features change? Abstract invariant or deep pattern matching?

  **Why It Is Upstream:**
  It is ranked third because it is the *ecological validation* of the first two. It asks: "Does the lab work hold up in the wild?" If Candidates 4 and 1 define the rules of identity, Candidate 2 tests the robustness of those rules under noise. It is downstream because "fog" is just a specific type of stroke removal/warping (Candidate 1) applied in a specific context (Candidate 4).

  **Tractability for This Team:**
  *   **Type Designer:** Simulates "noise" (blur, occlusion, fragmentation) on the glyphs defined in Candidate 1.
  *   **Cognitive Scientist:** Tests recognition speed/accuracy under these degraded conditions.
  *   **Philosopher:** Interprets whether the brain is "filling in" missing data (rationalism) or matching partial patterns (empiricism).
  *   **Low-Tech Fit:** Highly tractable. You can print blurred glyphs on paper or project them on glass.

  **Success/Failure Conditions:**
  *   **Move Up (Success):** If you find that recognition in "fog" correlates perfectly with the "Ghost Stroke" survival maps from Candidate 1, you unify the theory. It proves that the brain uses the same structural invariants for clean letters as it does for noisy ones.
  *   **Move Down (Failure):** If humans recognize letters in fog *better* than the Ghost Stroke model predicts, it implies a different mechanism is at work (e.g., contextual word prediction rather than glyph analysis). This would force you to abandon the isolated glyph approach.

  ### Summary for the Funder

  This agenda moves from **Metaphysics (4)** to **Mechanics (1)** to **Ecology (2)**.

  1.  **Candidate 4** ensures we are asking the right question (Is "letter identity" even a real thing?).
  2.  **Candidate 1** builds the measuring stick (What are the physical limits of that identity?).
  3.  **Candidate 2** tests the measuring stick in the real world (Does it work when the signal is noisy?).

  We drop **Candidate 3** because it attempts to simulate cognition with tools (generative models) that are opaque, data-hungry, and architecturally biased. With a Philosopher, a Cognitive Scientist, and a Designer, your comparative advantage is **human interpretability**, not model performance. Stick to the human mind; it is the only corpus you need.
