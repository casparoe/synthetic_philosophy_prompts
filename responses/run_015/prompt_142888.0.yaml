          *   Premise 1: If a state is luminous, whenever you are in it, you are in a position to know you are in it.
          *   Premise 2: Mental states (like feeling cold) change gradually (sorites-style).
          *   Premise 3: Knowledge requires safety/reliability (you can't know $p$ if you could easily be wrong about $p$).
          *   Conclusion: In the marginal cases of the gradual change, you cannot know you are in the state (because you can't discriminate the margin from the non-state). Therefore, the state is not luminous.
      *   **The Defenders (e.g., Bernecker, Shoemaker, some Phenomenologists):**
          *   Objection 1: Confusion of *state* vs. *judgment*. The feeling is present even if the judgment isn't formed.
          *   Objection 2: The "margin for error" principle is too strict or misapplied to first-person access.
          *   Objection 3: Phenomenology isn't a proposition to be known; it's an experience. Luminosity is about acquaintance, not propositional knowledge.
      *   **The KK Principle:** $Kp \to KKp$. Williamson rejects this generally (fallibilism). Defenders of luminosity often want to preserve a version of this for mental states.

