          3.  **Addressing the Marginal Cases:** If we reject RT, we don't need a parity-blocking property. We protect all sentient beings from being "replaceable." This actually *helps* with marginal case humans (they are protected too).
      *   **The Cost:** It forces a shift from Classical Utilitarianism to a Person-Affecting View or Rights View. It complicates population ethics (Non-Identity Problem). It might imply that bringing animals into existence for food is neutral or negative, even if their lives are happy, because killing them remains a harm.
