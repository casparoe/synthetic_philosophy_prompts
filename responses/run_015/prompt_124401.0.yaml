prompt: |-
  hey im putting together the final for my phil of bio course and im tired of questions where students just summarize Darwin's sympathy/social-instinct story from Descent of Man and call it a day. i want an essay prompt (90 min, upper-level) that forces them into the weeds: specifically the tension between Darwin treating religion as basically an evolutionary spandrel—agency detection and fear—so morality doesnt need religious foundations, and his own naturalistic account of morality as a contingent tribal tool calibrated by utility. the crux should be whether Darwin can consistently claim that extending sympathy to all sentient beings is moral progress rather than just fashion change, given that both morality and religion are evolutionary byproducts. i want them to have to wrestle with an implicit "normative bootstrapping" idea—whether selection for social instincts can generate its own justification conditions—or whether he's just smuggling in Victorian values.

  please write the exam question itself, then a model answer of about 600 words, and a marking scheme that seperates an A from a B by listing the specific moves required—like actually addressing the bootstrapping problem, not just naming it; engaging the bee-to-human gradation argument; and explaining how his dismissal of religious morality destabilizes or maybe strengthens his normative stance. the scheme should assign marks (total 20) and list common mistakes that cost points. dont ask for bibliographies or citations—this is for students without web access and i dont want them guessing at page numbers. keep it in the weeds but not so niche that they cant answer from course knowledge.
