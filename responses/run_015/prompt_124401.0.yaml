answer: |-
  **Exam Question**

  **Time Allowed:** 90 Minutes
  **Total Marks:** 20

  **Prompt:**

  In *The Descent of Man*, Darwin offers a naturalistic genealogy of ethics, grounding morality in social instincts and intelligence rather than divine command. He treats religious belief largely as an evolutionary byproduct of agency detection and fear, suggesting morality does not require religious foundations. However, if moral sentiments are merely contingent tools calibrated for tribal utility, a tension arises regarding normative justification.

  Write an essay evaluating whether Darwin can consistently characterize the extension of sympathy to all sentient beings as **moral progress** rather than mere **cultural fashion**. In your answer, you must:
  1.  Explain how Darwin's dismissal of religious morality as a byproduct impacts the authority of his naturalistic account.
  2.  Engage with the "normative bootstrapping" problem: Can selection for social instincts generate its own justification conditions, or does this circle remain vicious?
  3.  Utilize Darwin's gradation argument (from bees to humans) to discuss whether human moral rationality escapes the determinism of instinct.
  4.  Conclude on whether Darwin is successfully grounding objective value or inadvertently smuggling in Victorian prejudices.

  ***

  **Model Answer**

  Darwin's project in *The Descent of Man* attempts to naturalize ethics without collapsing into nihilism. The central tension lies in his dual treatment of religion and morality. Darwin dismisses religious conscience as a spandrel—a byproduct of cognitive agency detection and fear of the unknown. By severing morality from this supernatural root, he aims to ground ethics in observable social instincts. However, this move creates a vulnerability: if religious morality is merely an evolutionary misfiring, why is naturalistic morality not subject to the same debunking? If both are products of selection, the distinction rests on utility, not truth. Darwin argues religious morality is often rigid and tribal, whereas social instincts are flexible. Yet, this merely shifts the justification from "divine truth" to "group utility," leaving the normative force of "ought" unexplained.

  This leads directly to the problem of normative bootstrapping. Darwin suggests that as intelligence grows, humans reflect on past instincts and approve of those that benefit the tribe. He posits that the "approval of the community" becomes the ultimate sanction. However, this is circular. If the standard of "good" is simply "what selection favored for group survival," then extending sympathy beyond the tribe cannot be objectively "better," only different. For Darwin to call universal sympathy "progress," he must assume a metric of value external to survival fitness. He attempts to bridge this by arguing that reason allows us to see that sympathy for all sentient beings yields greater happiness. But if reason itself is a tool shaped by selection for survival, its verdicts on "happiness" are suspect. Darwin is effectively asking natural selection to justify itself, which risks a vicious circle where the "is" of evolution illegitimately generates the "ought" of ethics.

  The gradation argument from bees to humans is crucial here. Darwin notes that if bees could reason, they would deem it sacred to kill drone brothers for the hive's good. This illustrates that moral content is relative to biological needs. Humans differ not in kind, but in the scope of sympathy facilitated by language and reason. Darwin argues our instincts are more flexible than the bee's; we can override immediate impulses for long-term social goods. However, this flexibility does not solve the bootstrapping problem; it only explains the *mechanism* of change. If our ability to extend sympathy is just a more sophisticated survival strategy for large-scale societies, it remains a contingent fashion.

  Ultimately, Darwin struggles to escape the accusation of smuggling in Victorian values. He assumes that the trajectory of evolution points toward "higher" moral states, equating complexity with goodness. By framing the expansion of sympathy as progress, he relies on a utilitarian calculus (maximizing happiness) that he has not independently justified outside of evolutionary terms. If morality is a tribal tool, expanding the tribe is not inherently moral, only expansive. Darwin successfully shows how morality *arose*, but he fails to show why the current Victorian expansion of sympathy is objectively binding rather than a temporary adaptive peak. He provides a genealogy of morals, but lacks a normative foundation that doesn't rely on the very instincts he is trying to justify.

  ***

  **Marking Scheme (Total 20 Marks)**

  **1. Thesis & Structure (4 Marks)**
  *   **A (4):** Clear thesis addressing the tension between descriptive origins and normative claims. Essay flows logically from religion to bootstrapping to gradation.
  *   **B (3):** Thesis present but vague on the "progress vs. fashion" distinction. Structure is adequate but transitions between topics are abrupt.
  *   **C/D (1-2):** No clear argument; mostly summary of Darwin's views without critical evaluation.

  **2. Religion vs. Naturalistic Morality (4 Marks)**
  *   **A (4):** Explicitly explains religion as byproduct (agency/fear) and analyzes how this dismissal destabilizes moral authority (if both are evolved, why trust one over the other?).
  *   **B (3):** Notes Darwin separates religion and morality but fails to explain the *consequence* of this separation for normative justification.
  *   **C/D (1-2):** Merely states Darwin was secular or anti-religious without philosophical analysis.

  **3. The Normative Bootstrapping Problem (6 Marks)**
  *   **A (5-6):** **Crucial Differentiator.** deeply engages with the Is/Ought problem. Explains *why* selection cannot easily generate justification (circularity of using evolved reason to validate evolved instincts). Discusses whether utility can ground obligation.
  *   **B (3-4):** Identifies the problem (e.g., "Darwin is circular") but does not explain the mechanism of the failure. Treats bootstrapping as a buzzword rather than a structural flaw.
  *   **C/D (1-2):** Ignores the justification problem entirely; assumes evolutionary origin equals moral validity.

  **4. Bee/Human Gradation & Victorian Values (6 Marks)**
  *   **A (5-6):** Uses the bee example to show moral relativity. Connects this to the "Victorian smuggling" critique (equating complexity/expansion with goodness). Concludes on whether "progress" is defensible.
  *   **B (3-4):** Mentions the bee analogy but treats it as simple continuity. Discusses Victorian values as a historical footnote rather than a philosophical bias in the argument.
  *   **C/D (1-2):** Summarizes the bee argument without linking it to the problem of moral progress.

  **Common Mistakes & Point Deductions:**
  *   **-2:** Purely summarizing *Descent of Man* without addressing the prompt's specific tension (Progress vs. Fashion).
  *   **-2:** Treating "Victorian Values" as a historical fact rather than a philosophical critique of bias.
  *   **-2:** Failing to discuss the role of *reason* in Darwin's account (reason is the bridge in the bootstrapping attempt).
  *   **-1:** Using outside citations or page numbers (not required/allowed).
  *   **-1:** Word count significantly under/over (±20%).

  **Grade Boundaries:**
  *   **A (17-20):** Deep philosophical engagement; solves or deeply articulates the bootstrapping tension.
  *   **B (14-16):** Competent analysis; identifies the problems but lacks depth on the normative implications.
  *   **C (10-13):** Accurate summary of Darwin; misses the philosophical critique.
  *   **D/F (0-9):** Significant misunderstandings of the text or prompt.
