      *   *Hume:* Why expect future to resemble past?
      *   *Connection:* NFL says if you don't assume future resembles past (structured $f$), you can't learn. So NFL $\to$ Need Assumption. Hume $\to$ Can't justify Assumption.
      *   *User's Claim:* NFL $\to$ Assumption is arbitrary.
