      *   *Restriction:* Limiting to computable $f$. This *is* the assumption "Nature is computable."
      *   *Solomonoff:* $M(x) \approx 2^{-K(x)}$. Dominates if truth $\in$ Computable.
      *   *Constant:* $K_U(x)$ vs $K_{U'}(x)$. Difference is bounded by $c_{U,U'}$. For small $n$, $c$ matters.
      *   *Goodman:* "Grue" is just a different UTM/encoding.
