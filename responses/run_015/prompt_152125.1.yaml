      *   **Kripke's View vs. The Sceptic's View:** Kripke *attributes* this argument to Wittgenstein (hence "Kripkenstein"), but it's debated whether Wittgenstein actually held this sceptical view or was dissolving it. Kripke himself accepts the sceptical conclusion (no fact of the matter) but offers a "sceptical solution."
      *   **The Sceptical Solution:** Since there are no truth-conditions for meaning claims (no fact), we look at *assertability conditions*. When is it *useful* or *appropriate* to say someone means X? It depends on communal agreement.
      *   **The User's Error:** The user thinks the communal verdict settles the fact of the matter. But under the sceptical solution, the community's verdict isn't discovering a hidden fact; it's *creating* the normativity. However, crucially, the *experience* of uncertainty (the phenomenology) is still real. The sceptic says there's no *metaphysical fact*, not that the *psychological state* is irrelevant. Furthermore, the community is *also* subject to the paradox. Their agreement isn't a god's-eye view; it's just further behavior.
