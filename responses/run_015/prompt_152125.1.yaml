  ### Where I've gone wrong

  You have conflated the metaphysics of meaning with the phenomenology of doubt. Kripke's sceptic argues there is no super-lattice fact grounding meaning, not that the feeling of uncertainty is illusory. Aldgyth's crisis isn't about discovering a hidden fact; it's about the collapse of her confidence in her own normativity. Furthermore, you've mistaken the "sceptical solution" for a factual resolution. The community doesn't uncover what she meant; they impose what she shall be taken to mean. Their verdict isn't a divine arbitration revealing truth; it's a social enforcement creating stability. If you bin the internal scene, you lose the very tension Kripke highlights: the isolation of the rule-follower against the void of justification. The community's judgment is just more behavior, subject to the same sceptical doubt. Keep the insides. The horror isn't that she broke the rule; it's that "breaking the rule" has no truth-value. Your intuition that the community might also be in the dark is correct; their agreement is brute, not justified. The internal struggle is the only place the paradox hurts.

  ### The sceptic, Kripke, and Kripkenstein

  Kripke's book presents a sceptical argument he attributes to Wittgenstein's later philosophy, though scholars debate if Wittgenstein actually held this view (hence the portmanteau "Kripkenstein"). The sceptic argues that no past mental state or behavior logically necessitates a specific future application of a rule. Your past use of "plus" fits "quus" just as well. Kripke accepts this conclusion: there is no fact of the matter about what you meant. However, Kripke distinguishes his own voice from the sceptic's. The sceptic destroys the truth-conditions of meaning claims. Kripke then offers a "sceptical solution" to save language from silence. Wittgenstein's own aim was likely therapeutic—dissolving the urge to seek such facts—rather than establishing a sceptical metaphysics. For your novel, the crucial distinction is between the sceptical *problem* (no fact exists) and the sceptical *solution* (we speak anyway). You have treated the community's agreement as a fact-finding mission. It is not. It is a move within the language game to stabilize usage. The sceptic remains in the background, whispering that even the Abbess's judgment lacks metaphysical grounding. Aldgyth's confusion is the sceptical problem manifesting psychologically; the Abbess's verdict is the sceptical solution in action. Neither cancels the other.

  ### What the sceptical solution is a solution to

  The sceptical solution abandons truth-conditions for meaning claims. Since there is no fact about what Aldgyth meant, we cannot say her claim "I am copying" is true or false in a correspondence sense. Instead, we look at assertability conditions: under what circumstances is it useful to say she is copying? The answer: when her behavior aligns with the community's expectations. This shifts the stakes from metaphysics to social survival. However, you suspected the community might be in the dark. You are right. The sceptical paradox applies to the Abbess too. Her judgment isn't grounded in a deeper fact; it's grounded in her own training and agreement with other sisters. There is no God's-eye view where the Abbey sits. Their consensus is brute agreement, not discovered truth. This means the climax isn't about the Abbey revealing what Aldgyth *did*; it's about them deciding what she *will be said to have done*. This preserves your internal scene. Aldgyth's terror is that she cannot assert her own fidelity even to herself. She lacks the conditions for self-ascription. The community provides those conditions externally, but arbitrarily. The tension remains: her internal void versus their external imposition. The novel isn't about finding the fact; it's about the violence of imposing assertability where no truth exists. The community doesn't solve the mystery; they bury it under convention. That is a richer conflict than simple arbitration.

  ### What's left for Aldgyth

  Do not bin the eighty pages. Aldgyth's internal crisis is the phenomenological counterpart to the sceptical paradox. Even if there is no fact of the matter, the *experience* of losing grip on normativity is real and devastating. She isn't searching for a hidden fact; she is losing the ability to participate in the language game of self-description. Her silence is the sceptical problem living in a soul. The external scene with the Abbess is not the resolution of her doubt, but the social override of it. The Abbess does not discover Aldgyth's meaning; she assigns it. This creates a profound tragedy: Aldgyth knows (or feels) the void, while the Abbey papers over it with ink and rule. You can write the internal uncertainty as the horror of private language collapsing, and the external judgment as the necessary fiction that allows life to continue. The clash isn't between truth and error, but between the silence of the sceptic and the noise of the community. That is exactly where a novel should live. Keep the insides; they are the only place the paradox hurts.
