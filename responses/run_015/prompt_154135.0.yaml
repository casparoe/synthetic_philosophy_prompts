answer: |-
  # The Epistemic Hygiene Protocol for Legendary Narratives (EH-PLN)

  **Purpose:** To classify legendary narratives into distinct epistemic categories based on the relationship between textual tradition and material/textual evidence.
  **Operator Constraints:** Designed for practitioners without specialist archival access or stratigraphic training. Relies on consensus archaeological/historical data available in general academic synthesis.
  **Calibration Cases:** Trojan War (Kernel), Arthurian Cycle (Unrecoverable/Echo), Exodus (Ambiguous/Echo-Analog).

  ---

  ## Part I: The Decision Procedure

  Run the following sequence. At each stage, record the status. If a **HALT** condition is met, proceed to the Classification Matrix (Part II).

  ### Stage 1: Independent Contemporaneity Check
  **Question:** Is there attestation of the specific narrative core (names, locations, or primary conflict) in sources contemporary to the *claimed* event, independent of the legendary tradition itself?
  *   **Sufficient Answer to Proceed:** Yes (e.g., Hittite references to "Wilusa" for Trojan War).
  *   **HALT Condition:** No. (e.g., No 6th-century British sources naming Arthur; No 13th-century BCE Egyptian records of a mass Hebrew exodus).
  *   **Judgment Flag:** Distinguish between *destruction of records* (plausible in war zones) and *systematic silence* (unlikely for major state-level events). If the claimed event implies state-level disruption but leaves no administrative trace, mark "High Silence Risk."

  ### Stage 2: Material Culture Consistency Test
  **Question:** Do the material details embedded in the narrative core (weapons, architecture, geography, political boundaries) align with the *claimed* era, or do they align with the *composition* era?
  *   **Sufficient Answer to Proceed:** Core details align with the claimed era (e.g., Homeric boar's tusk helmets match Bronze Age, not Iron Age).
  *   **HALT Condition:** Core details align exclusively with the composition era (e.g., Arthurian knights in plate armor in a 5th-century setting).
  *   **Concrete Test:** Identify three specific material nouns in the text. Check their archaeological first appearance dates. If 2/3 appear centuries *after* the claimed event, flag as **Anachronistic Core**.

  ### Stage 3: The Retrojection (Echo) Test
  **Question:** Does a known historical event occurring *later* than the claimed event fit the narrative structure better than the claimed event itself?
  *   **Sufficient Answer to Proceed:** No later event offers a tighter fit.
  *   **HALT Condition:** Yes. A later event explains the specific details (e.g., the 12th-century political needs of the Angevin kings explain the Arthurian chivalric structure better than 5th-century warlordism).
  *   **Disambiguation Logic:**
      *   If the narrative describes a *specific* later event but places it in the past → **Historical Echo**.
      *   If the narrative describes a *general* condition of the later era → **Structural Analog**.

  ### Stage 4: Negative Space vs. Positive Text Weighting
  **Question:** Does the absence of archaeological correlation contradict the *scale* of the narrative, or merely the *itinerary*?
  *   **Sufficient Answer to Proceed:** Archaeology contradicts the itinerary but supports the scale (e.g., Cities destroyed in the era, but not the specific path).
  *   **HALT Condition:** Archaeology contradicts the scale (e.g., Narrative claims 2 million people; Archaeology shows nomadic bands at most).
  *   **Judgment Flag:** This is the highest risk area for **False-Positive Risk**. Correlation of a destruction layer does not prove causal generation of the text. If the text requires a scale of destruction the soil does not show, halt.

  ### Stage 5: Sociological Function Analysis
  **Question:** Does the narrative serve an essential identity-forming function (theological, national, dynastic) that would incentivize fabrication regardless of historical truth?
  *   **Sufficient Answer to Proceed:** Function is secondary or incidental.
  *   **HALT Condition:** Function is primary (e.g., Legitimizing a dynasty, explaining a religious covenant).
  *   **Outcome:** If HALT here, the narrative is at minimum a **Structural Analog**, potentially an **Echo**. It cannot be a **Kernel** unless Stage 1 was passed.

  ---

  ## Part II: Classification Matrix

  Based on where the procedure halted, assign the classification:

  1.  **Probable Kernel (Recoverable):** Passed Stage 1 & 2. Failed Stage 5 (or function is secondary). *Example: Trojan War.*
  2.  **Unrecoverable Kernel:** Passed Stage 2 (material fit), Failed Stage 1 (silence). Event likely real, narrative corrupted. *Example: Specific battles of the Migration Period.*
  3.  **Historical Echo:** Passed Stage 3 (Retrojection). A later event is mislocated in time. *Example: Hyksos expulsion memory retrojected into Exodus.*
  4.  **Structural Analog:** Passed Stage 5 (Function Primary). Failed Stage 2 (Anachronisms). Narrative fits the *type* of event, not a specific one. *Example: Founding myths of Rome.*
  5.  **False-Positive Risk:** Passed Stage 2 (Material match), but Stage 4 indicates scale mismatch. *Example: Linking a specific fire layer to a legendary burning without evidence of human agency.*

  ---

  ## Part III: Worked Cases

  ### Case A: The Arthurian Cycle
  **Input:** 12th-century Romances claiming 5th/6th-century British history.

  *   **Stage 1 (Contemporaneity):** **HALT.** Gildas (6th c.) mentions Badon Hill but does not name Arthur. Nennius (9th c.) is the first to name him, centuries later. *Status: High Silence Risk.*
  *   **Stage 2 (Material Consistency):** **HALT.** Core narrative involves chivalry, tournaments, and plate armor. These are 12th-century material realities, not 5th-century post-Roman Britain. *Status: Anachronistic Core.*
  *   **Stage 3 (Retrojection):** **PASS for Echo.** The narrative structure mirrors 12th-century feudal politics and the Crusading ethos. The "unification of Britain" mirrors Angevin political goals.
  *   **Stage 5 (Function):** **HALT.** The narrative serves a explicit national/dynastic function (Plantagenet legitimacy).

  **Procedure Outcome:** **Historical Echo / Structural Analog.**
  **Why the Kernel Test Fails:** The procedure halts at Stage 1 and 2. While a warlord *may* have existed (Unrecoverable Kernel), the *narrative core* (Arthur as King of Chivalry) is generated by later conditions. The "Echo" is the 12th-century political reality projected onto the 5th-century silence. The procedure prevents labeling this a "Kernel" because the specific details generating the story's popularity are anachronistic.

  ### Case B: The Exodus Narrative
  **Input:** Biblical text claiming 13th-century BCE mass migration from Egypt.

  *   **Stage 1 (Contemporaneity):** **HALT.** No Egyptian records of a slave nation departing, despite detailed record-keeping of border movements. *Status: High Silence Risk.*
  *   **Stage 2 (Material Consistency):** **MIXED.** Place names (Pithom, Rameses) are accurate to the era. However, the material culture of the Conquest (Jericho/Ai) does not align with the claimed timeline (cities were uninhabited or destroyed at different times).
  *   **Stage 3 (Retrojection):** **AMBIGUOUS.**
      *   *Hypothesis A (Echo):* Memory of the Hyksos expulsion (16th c. BCE) retrojected to a later date.
      *   *Hypothesis B (Echo):* Memory of small groups of Shasu nomads (attested in Egyptian texts) expanded into a national myth.
      *   *Result:* The procedure flags this as a potential **Echo**, but cannot confirm *which* event.
  *   **Stage 4 (Negative Space):** **HALT.** Narrative claims 2 million people (archaeologically impossible for Sinai ecology). Archaeology shows small semi-nomadic groups. *Status: Scale Mismatch.*
  *   **Stage 5 (Function):** **HALT.** Narrative serves a primary theological function (Covenant formation).

  **Procedure Outcome:** **Ambiguous (Echo vs. Analog).**
  **Disambiguation Behavior:** The procedure highlights the tension. Stage 2 confirms *some* authentic memory (Egyptian place names), preventing a total "Myth" dismissal. However, Stage 4 (Scale) and Stage 1 (Silence) prevent a "Kernel" classification. The practitioner is forced to choose between **Echo** (a small event magnified) or **Structural Analog** (a story created to explain why Israelites *don't* have Egyptian material culture). The procedure does not resolve this; it isolates the exact point of friction: **Textual Coherence vs. Material Absence.**

  ---

  ## Part IV: Limitations & Epistemic Boundaries

  **This Procedure Cannot:**
  1.  **Settle Theological Claims:** It treats "Covenant" as a sociological function, not a metaphysical reality. It cannot validate divine action.
  2.  **Generate Bibliographies:** It relies on the operator bringing consensus data. It does not source-hunt.
  3.  **Perform Source Criticism:** It treats the narrative as a unit for the sake of classification. It does not separate J, E, P, or D sources (e.g., in Exodus).
  4.  **Interpret Stratigraphy:** It relies on published conclusions about destruction layers, not raw soil data.

  **Warning on Teleology:**
  This procedure will misfire if applied to narratives with strong **National/Theological Functions** (Stage 5) without heavy weighting on Stage 1. In these cases, "Silence" is often rationalized by believers as "Enemy Destruction of Records." The practitioner must enforce the **High Silence Risk** halt strictly.

  ---

  ## Part V: Operator Competency Check

  To verify you have grasped the distinction between **Kernel** and **Echo**, answer the following:

  > *You find a destruction layer at a city (City X) dated to 1200 BCE. A legend claims "King Y burned City X in 1200 BCE." However, independent records show King Y did not reign until 1100 BCE, and the style of warfare described in the legend matches 1100 BCE tactics, not 1200 BCE tactics.*
  >
  > **Question:** Does this scenario support a **Historical Kernel** (King Y burned City X) or a **Historical Echo** (A later event involving King Y was projected onto the older destruction layer)? Explain your reasoning based on the causal direction of the narrative generation.

  *(Correct Answer Logic: This is a **Historical Echo**. A Kernel requires the specific event to generate the narrative core. Here, the narrative details (tactics, King's reign) belong to the later period. The correlation with the 1200 BCE layer is a **False-Positive Risk**; the narrative was likely generated by the 1100 BCE context and attached to the older ruin to lend it antiquity. The causal arrow points from Later Event → Older Setting, not Older Event → Narrative.)*
