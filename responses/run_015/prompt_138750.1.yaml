answer: |-
  **Title:** Grounding vs. Content: Reconstructing Kant's Indirect Duties to Animals

  **Research Question**
  Does Kant's classification of duties regarding animals as "indirect" constrain only the *normative ground* of the duty (who is wronged), or does it also constrain the *deontic content* (what may be done)? Specifically, if we decouple the grounding claim (rational nature) from the empirical spillover claim (cruelty cultivates vice), does the indirect-duty view collapse into a weak direct-duty view, or does it retain distinct normative force regarding trade-offs between human ends and animal good?

  **Problem Statement**
  The standard interpretation of Kant's practical philosophy presents a deflationary view: animals are not ends in themselves; we have no duties *to* them, only *with regard* to them; and cruelty is objectionable primarily because it damages the agent's moral character toward humans. This standard view conflates three distinct claims: (1) a grounding claim (normative source is rational nature), (2) a content claim (what the duty requires vis-à-vis the animal), and (3) an empirical causal claim (cruelty to animals necessarily spills over into cruelty to humans).

  Current scholarship often treats these as a single block. However, if claim (3) is empirical and contingent, it cannot sustain the necessity required of a moral duty. If we retain (1) but modify (3), we arrive at an unnamed position: the duty is owed to humanity, but its content is fixed by the animal's good. This requires the agent to deliberate about the animal's welfare, weigh it against human ends, and determine which uses are gratuitous. At this point, the functional work of "indirectness" becomes unclear. Furthermore, Kant's criterion for moral standing is rationality, not species membership. This suggests a binary threshold: rational non-humans would be direct ends, while sentient non-rational humans (if such existed) would be indirect means. It is unclear whether Kant's system has resources for degrees of sentience or rationality, or whether this binary rigidity is a systematic feature.

  **Competing Readings**
  To resolve this, I will evaluate three live readings of the indirect-duty position:

  1.  **The Strong Instrumental View:** Indirectness constrains both ground and content. Animals are merely tools. Duties regarding them are purely about maintaining the agent's moral fitness. Any consideration of the animal's pain is incidental to the effect on the agent's character.
  2.  **The Content-Sensitive Indirect View:** Indirectness constrains only the ground. The duty is to self (preserving moral feeling), but the *content* is determined by the animal's nature. We must treat the animal according to its good, not because it has standing, but because ignoring its good violates the duty to self. Here, "indirect" marks who can be wronged, not what may be done.
  3.  **The Binary Threshold View:** The view is strictly binary based on rationality. There are no degrees of moral consideration based on sentience. Any attempt to introduce degrees contradicts the foundational distinction between persons and things.

  **Methodology and Work Plan**
  Rather than focusing exclusively on the contested paragraph in the *Doctrine of Virtue* (6:443), which risks philological stalemate, I will employ a structural analysis of Kant's system of duties. I will compare the structure of duties regarding animals with duties to oneself and duties of love to others. This allows me to test whether the "indirect" label functions differently than other indirect obligations (e.g., regarding one's own happiness).

  *   **Weeks 1–4: Textual Mapping.** I will locate all instances of "animal," "creature," and "brute" in the *Metaphysics of Morals*, *Lectures on Ethics*, and *Anthropology*. The goal is not to find the "true" quote, but to map the consistency of the three claims (grounding, content, empirical) across texts.
  *   **Weeks 5–8: Argument Reconstruction.** I will reconstruct the argument for the indirect duty without relying on the empirical spillover claim. I will test whether the duty holds if the agent is psychologically immune to the spillover effect. This isolates the normative structure from the empirical psychology.
  *   **Weeks 9–12: Systematic Implications.** I will test the Binary Threshold View against Kant's treatment of children, the cognitively impaired, and the possibility of rational aliens. This determines if the binary is a defect or a necessary consequence of the autonomy principle.
  *   **Weeks 13–15: Drafting and Refinement.** I will synthesize the findings into a final paper, focusing on whether the "Content-Sensitive Indirect View" is textually viable and systematically stable.

  **Possible Conclusions**
  1.  **Collapse:** The Content-Sensitive view is textually supported but systematically unstable. If the content is fixed by the animal's good, the distinction between "to" and "with regard to" loses normative force, collapsing into a direct-duty view.
  2.  **Distinctiveness:** The indirectness retains force regarding trade-offs. Even if the content involves the animal's good, the *weight* of that good is lexically inferior to human rational ends. This preserves the binary without ignoring sentience.
  3.  **Binary Defect:** The system cannot accommodate degrees of sentience without undermining the person/thing distinction. This would indicate a specific limitation in Kant's practical philosophy regarding marginal cases.

  **Failure Conditions and Scope**
  This project will fail if it devolves into a textual commentary on *Metaphysics of Morals* 6:443 without addressing the systematic implications. It will also fail if I attempt to solve the "rational alien" problem comprehensively; that is a dissertation topic, not a seminar paper. To manage scope, I will treat the rational alien case only as a test for the Binary Threshold View, not as a primary subject. The project is too big if I attempt to reconcile Kant's view with contemporary animal ethics literature; the focus must remain on internal coherence within Kant's practical philosophy. Success is defined as a determinate answer to whether "indirectness" constrains content or merely standing, providing a stable foundation for my dissertation chapter.
