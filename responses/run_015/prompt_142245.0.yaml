  # Joint Statement on the Toxin Puzzle Collaboration

  ## 1. Agreed Claims

  Both the Inaccessibilist and Accessibilist camps affirm the following claims as the baseline for this collaboration. Disagreements below proceed only after accepting these premises.

  1.  **The Setup is Fixed:** The money arrives before the drinking time; the drinking causes pain without lasting harm; the billionaire predicts perfectly; the agent is psychologically normal (capable of planning).
      *   *Why both sign:* Both sides agree that changing these facts changes the puzzle. If the money arrived after drinking, it would be a standard trade. If the predictor were fallible, it would be a gambling problem.
  2.  **No "Self-Conception" Cheating:** An agent cannot collect the reward by intending to drink solely to preserve a self-conception (e.g., "I am someone who keeps intentions") if that self-conception functions as a reason to drink at the time of action.
      *   *Why both sign:* The puzzle stipulates there will be "no reason whatsoever" to drink at the time of action. If maintaining self-conception counts as a reason at that time, the puzzle's core constraint is violated. Both sides agree the puzzle requires the agent to face the moment of action with no motivating reason to drink.
  3.  **Intention is Settledness:** To "form an intention" means to reach a settled state of planning, not merely to wish, hope, or guess that one will act.
      *   *Why both sign:* Both sides agree that a mere wish ("I hope I drink") does not count as forming an intention. The disagreement is about whether a settled plan is *possible* under these conditions, not about what intention means in general.
  4.  **No Trickery:** The agent cannot deceive the predictor (e.g., by taking a pill that forces them to drink regardless of intention) to collect the money.
      *   *Why both sign:* The predictor detects the *intention*, not the outcome. Bypassing the intention formation process (e.g., via hypnosis) to trigger the payment violates the condition that the agent must *form the intention*.
  5.  **Rationality is at Stake:** The puzzle is not just about psychological capacity but about rational permissibility. The question is whether a rational agent *can* or *should* form this intention.
      *   *Why both sign:* Both sides treat this as a problem of rational agency, not just psychological quirks. The Inaccessibilists argue it is rationally impossible; the Accessibilists argue it is rationally permissible but psychologically difficult.

  ## 2. Disagreements Table

  | ID | One-Line Summary | Inaccessibilist Wording | Accessibilist Wording | Genuine or Verbal? | Shared Test or Case | Inaccessibilist Prediction | Accessibilist Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **D1** | **The Reason Constraint** | Intention constitutively requires having a reason to act at the time of action. | Intention relies on reasons at the time of formation; future reasons need not align. | **Genuine** | **The Grape Variant:** Intend to eat one harmless grape tomorrow for no reason. | Agent cannot intend because there is no reason to eat the grape at 6 a.m. | Agent can intend because the current reason (curiosity/challenge) suffices for planning. |
  | **D2** | **The Belief Requirement** | Intending X entails believing (or expecting) that you will do X. | Intending X entails planning to do X, not necessarily predicting you will. | **Mixed** | **The Bypass Route:** Can you intend if you know you might change your mind? | No, because you cannot believe you will drink if you know you won't have a reason. | Yes, because you can plan to drink while acknowledging you might defect. |
  | **D3** | **Binary vs. Degrees** | Intention is all-or-nothing; you either have it or you don't. | Intention admits of degrees; one can be "mostly" intending or tentatively intending. | **Verbal** | **The Trivial Reason:** Billionaire adds $5 reward for actually drinking. | Still impossible; $5 is insufficient to create a reason to endure pain. | Possible; the $5 tips the scale, showing intention scales with incentive. |
  | **D4** | **Iterated Capacity** | Repeating the puzzle doesn't help; if you can't intend once, you can't intend ever. | Repeating the puzzle builds a track record that makes intention easier over time. | **Genuine** | **The Iterated Version:** The puzzle happens 100 nights in a row. | Agent fails every time; past failure proves the structural impossibility. | Agent succeeds eventually; habituation allows the intention to stabilize. |

  ## 3. Crux-and-Prediction Analysis

  This section evaluates the specific test cases (cruxes) identified above, detailing how they bear on the dispute, recording advance predictions, and answering the meta-questions regarding leverage, empiricism, and definitions.

  ### Crux 1: The Grape Variant (Harmless/Pointless Act)
  *   **Case:** Replace the toxin with eating a single grape. It is harmless but pointless. You get the money for intending, no reason to eat the grape later.
  *   **Why it bears on the dispute:** This isolates the "pain" variable. If pain is the blocker, Accessibilists should succeed here. If the lack of reason is the blocker, Inaccessibilists should still fail.
  *   **Inaccessibilist Prediction:** Failure. Without a reason to eat the grape at 6 a.m., one cannot intend to eat it, regardless of pain.
  *   **Accessibilist Prediction:** Success. It is easier to intend a harmless act, proving the barrier was psychological (aversion to pain), not conceptual.

  ### Crux 2: The Trivial Reason ($5 Bonus)
  *   **Case:** The billionaire adds a $5 reward for actually drinking the toxin (or eating the grape), payable after the act.
  *   **Why it bears on the dispute:** This tests whether the barrier is "no reason" vs. "insufficient reason."
  *   **Inaccessibilist Prediction:** Failure. $5 is not enough reason to endure sickness/pain, so the "no reason" constraint effectively holds.
  *   **Accessibilist Prediction:** Success. Any reason, however trivial, breaks the "no reason" deadlock, allowing intention to form.

  ### Crux 3: The Iterated Version (Track Record)
  *   **Case:** The puzzle is presented 100 nights in a row. You keep the money each time you form the intention.
  *   **Why it bears on the dispute:** Tests whether intention is a static capacity or a skill that can be developed.
  *   **Inaccessibilist Prediction:** Failure persists. Structural impossibility does not dissolve with repetition.
  *   **Accessibilist Prediction:** Success rate increases. Agents learn to bind themselves or habituate the intention.

  ### Crux 4: The Bypass Route (Pills/Hypnosis)
  *   **Case:** You take a pill that makes you drink the toxin automatically, but you know this beforehand.
  *   **Why it bears on the dispute:** Tests whether "intention" requires active judgment or just a causal path to action.
  *   **Inaccessibilist Prediction:** Failure. This is not an intention; it is a causal setup. The predictor will not detect an intention.
  *   **Accessibilist Prediction:** Failure (agreed). Both sides agree this bypasses the agency required for the puzzle.

  ### Meta-Analysis of the Dispute

  *   **Highest Leverage Crux:** **The Belief Requirement (D2).** If it is proven that intention *does not* require believing you will act, the Inaccessibilist position collapses. Their entire argument rests on the idea that you cannot believe you will drink when you know you have no reason to. If intention is merely a "plan" without a belief component, the Accessibilists win.
  *   **Empirically Tractable:** **Partly.** We cannot empirically test the billionaire scenario, but we can test psychological analogues (e.g., asking subjects if they feel they "intend" to do pointless tasks). However, the core dispute is conceptual (what counts as "intention"), which limits empirical resolution.
  *   **Largest Verbal Component:** **The Definition of Intention.** A significant portion of the fight is about whether "intention" includes a belief component. Inaccessibilists define intention tightly (Plan + Belief); Accessibilists define it loosely (Plan). If we agree to call the Accessibilist state "Resolution" instead of "Intention," much of the conflict disappears.
  *   **Insulation Check:** The Inaccessibilist view risks insulation by defining intention such that it *cannot* exist without reasons at the time of action. This makes their conclusion (you can't intend) true by definition. The Accessibilist view risks insulation by calling any planning state an "intention," even if the agent knows they won't follow through.

