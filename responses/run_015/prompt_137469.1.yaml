  The honest verdict is that no single canonical term occupies this ground. Your analysis dissolves into the intersection of two familiar concepts: **self-defeating justifications** and **institutional facts**.

  **1. Self-Defeating Justification**
  *Closest Notion:* A principle where acting on it prevents the realization of its own goal (e.g., hedonism pursued directly).
  *Your Departure:* Standard self-defeat is teleological (goals thwarted). Yours is structural (conditions destroyed). The justification applies once, then the world changes such that it cannot apply again.
  *Boundary:* A failed promise thwarts a goal but leaves the institution of promising intact. Your case destroys the condition (isolation) required for the justification to hold.

  **2. Institutional Facts**
  *Closest Notion:* Realities created by collective acceptance (protocols, roles, statuses).
  *Your Departure:* Standard analysis shows rules creating facts. You show facts (capacity, knowledge) retroactively altering the rule's validity conditions. The exception presupposes the infrastructure the prohibition denies.
  *Boundary:* A judge buying a gavel is a physical act without institutional change. Training interrogators creates a standing capacity that alters the normative landscape permanently.

  **What Looks Like It But Isn't**
  1.  **Slippery Slope:** Predicts abuse due to human weakness or corruption. Your argument holds under perfect compliance; the destruction of conditions is necessary, not contingent.
  2.  **Performative Contradiction:** Usually linguistic or transcendental (e.g., asserting "I am not speaking"). Your case is empirical and institutional (e.g., building a torture center).

  **Implication for the Ticking-Bomb**
  The hypothetical is not merely empirically optimistic but categorially confused. It treats an institutional practice as a discrete act. By arguing for the exception, you necessitate the infrastructure of the rule you claim to exception. Therefore, the ticking-bomb cannot function as a *normative* test case; it is an *institutional* proposal disguised as a moral intuition pump.

  Your argument shifts the burden: defenders must justify not the act, but the standing capacity. Since the prohibition exists to prevent that capacity, the exception contradicts the prohibition's purpose structurally, not just contingently. Do not coin a name. The precision lies in showing how the empirical prerequisites of the act negate the normative conditions of the exception. This avoids the "abuse" trap and targets the logic of the exception itself. The ticking-bomb scenario is not a test of moral limits, but a denial of institutional reality.
