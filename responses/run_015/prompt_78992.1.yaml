answer: |-
  Here is the audit. I will start by mapping the landscape as requested, then evaluate your reconstruction claim-by-claim, and finally assess the chapter's conclusions.

  ### 1. Landscape and Fault Lines

  To understand where the chapter went off the rails, you need to see the trilemma Lewis identified. There are three attractive claims that form an inconsistent triad:

  1.  **Propositionalism:** Indicative conditionals ("If A, then C") express propositions. They have truth conditions. They are the kind of thing that can be true or false, and thus can be inputs to the standard probability calculus (i.e., they are events in the probability space).
  2.  **The Equation (Adams's Thesis):** The probability of the conditional equals the conditional probability: $P(\text{If } A, \text{then } C) = P(C \mid A)$.
  3.  **Standard Probability Theory:** The probability function obeys the standard axioms (including the Law of Total Probability) and applies to a language rich enough to allow conditionals to be embedded or conditionalized upon.

  **The Fault Line:** Lewis proved you cannot have all three.
  *   **Lewis's Solution:** Reject (1). Conditionals do not express propositions. They are not truth-apt. They are expressions of conditional belief.
  *   **Stalnaker's Solution:** Try to keep (1) and (2) by restricting (3). He argues the class of probability functions isn't "closed under conditionalization" in the way Lewis requires. (This is generally viewed as a losing battle).
  *   **Grice/Jackson Solution:** Reject (2). The probability of the conditional is the probability of the *material conditional* ($P(\neg A \lor C)$), but we only *assert* it when $P(C \mid A)$ is high. This saves Propositionalism but abandons the Equation as a semantic rule.
  *   **Adams's Solution:** Reject (1) from the start. Adams never claimed conditionals had truth conditions. He developed a logic of *assertibility*, not truth.

  The chapter you read seems to conflate Adams (who denied truth conditions) with Stalnaker (who wanted them), and it attributes the Grice/Jackson conclusion (Material Conditional) to Lewis (who rejected it).

  ### 2. Audit of the Reconstruction

  Here is the claim-by-claim breakdown.

  **Claim 1:** *"The thesis, which the chapter credits to Adams and Stalnaker together, is that the probability of an indicative conditional 'if A, then C' just is the conditional probability of C given A."*
  *   **Verdict:** (2) Defensible Simplification / Conflation.
  *   **Analysis:** It is accurate that both are associated with The Equation. However, it conflates their metaphysical commitments. Stalnaker wanted the conditional to be a proposition with truth conditions that *satisfied* the Equation. Adams argued the conditional *lacks* truth conditions and that the Equation describes assertibility conditions, not the probability of a truth-bearing proposition. Lewis's proof targets the Stalnakerian version (Propositionalism + Equation). It does not refute Adams's original formulation because Adams didn't treat the conditional as a proposition in the probability space to begin with.

  **Claim 2:** *"What Lewis proved is that this can't work. Take a language that contains conditionals and is closed under conditionalization... Then the equation forces P(C | A) to collapse into plain P(C)."*
  *   **Verdict:** (1) Accurate as stated.
  *   **Analysis:** This is the core of the 1976 triviality result. If you assume the conditional is a proposition (so $P(\text{If } A, \text{then } C)$ is well-defined) and The Equation holds for all probability functions in a class closed under conditionalization, you derive that $P(C \mid A) = P(C)$. This implies $A$ and $C$ are probabilistically independent, which is absurd for arbitrary sentences.

  **Claim 3:** *"The engine of the whole proof... is that conditional probability is undefined when the antecedent has probability zero."*
  *   **Verdict:** (3) Wrong.
  *   **Analysis:** This is a significant technical error in the chapter. The triviality proof does not rely on division by zero or undefined values at $P(A) = 0$. It relies on the **Law of Total Probability**.
      *   *The Logic:* If "If A, then C" is a proposition, let's call it $X$.
      *   By Total Probability: $P(X) = P(X \mid A)P(A) + P(X \mid \neg A)P(\neg A)$.
      *   By The Equation: $P(X \mid A) = P(C \mid A) = 1$ (roughly, if A is true, the conditional's probability matches C's probability given A, which is just C's probability given A... actually, simpler: if A is true, $A \to C$ is equivalent to C).
      *   The contradiction arises when you compare $P(X)$ calculated this way against $P(X)$ calculated by The Equation directly ($P(C \mid A)$). The algebra shows they can only match if $P(C \mid A) = P(C)$.
      *   The undefined nature of $P(C \mid A)$ when $P(A)=0$ is a side constraint, not the "engine" that drives the collapse.

  **Claim 4:** *"The upshot is that Adams's thesis is refuted..."*
  *   **Verdict:** (3) Wrong / Not Established.
  *   **Analysis:** Lewis's result refutes the conjunction of **Propositionalism** and **The Equation**. It does not refute The Equation in isolation. Adams's Thesis survives perfectly well if you abandon Propositionalism (which Adams did). The chapter presents the result as refuting the Equation itself, which forces the reader to abandon the intuitive link between "If A, C" and conditional probability. That is not the only way out.

  **Claim 5:** *"...and that Lewis was right to conclude that the indicative conditional is just the material conditional, true whenever its antecedent is false."*
  *   **Verdict:** (3) Wrong.
  *   **Analysis:** This is the most serious misrepresentation in the chapter. Lewis **never** concluded that indicative conditionals are material conditionals. In fact, Lewis thought the material conditional account was demonstrably false for natural language (due to the paradoxes of material implication).
      *   Lewis's conclusion was: **Indicative conditionals do not express propositions.** They have no truth conditions.
      *   The view that they *are* material conditionals (but we pragmatically restrict their use) is associated with **Grice** and later **Frank Jackson**. The chapter has attributed Jackson's conclusion to Lewis.

  **Claim 6:** *"There isn't really a logic of indicative conditionals..."*
  *   **Verdict:** (3) Wrong.
  *   **Analysis:** Even if conditionals lack truth conditions, they can still have a logic. Adams developed a probabilistic logic where validity is defined as the preservation of high probability (uncertainty summation), not the preservation of truth. This logic is well-defined and widely used, despite the lack of truth conditions.

  **Claim 7:** *"...and the same thing happens with counterfactuals like 'if Oswald hadn't shot Kennedy, someone else would have.'"*
  *   **Verdict:** (2) Defensible Simplification.
  *   **Analysis:** Triviality results do apply to counterfactuals if you try to combine Propositionalism with The Equation for them. However, Lewis's own theory of counterfactuals (the similarity semantics in *Counterfactuals*, 1973) is a propositional theory that *does not* satisfy The Equation in the way that triggers triviality. So while the *mathematical result* applies broadly, Lewis's specific *solution* for counterfactuals differs from his solution for indicatives.

  ### 3. Assessment of Conclusions and The Defender's Reply

  **Which closing conclusions survive?**
  Only one core insight survives the correction: **You cannot treat indicative conditionals as standard propositions while maintaining that their probability is always equal to the conditional probability.**

  Everything else in the chapter's conclusion is contaminated by error:
  *   Lewis did not argue for the material conditional.
  *   Adams's Thesis is not refuted, only its marriage to Propositionalism.
  *   There *is* a logic of conditionals (Adams's logic).
  *   The technical "engine" of the proof was misidentified.

  **What would a defender of the Equation say back?**
  A defender (like Dorothy Edgington or the late Ernest Adams) would respond to the chapter as follows:

  > "You have mistaken a proof about *propositions* for a proof about *conditionals*. Lewis showed that there is no proposition $X$ such that $P(X) = P(C \mid A)$ for all $P$. We agree. That is why conditionals are not propositions.
  >
  > When I say 'If it rains, the picnic is cancelled,' I am not stating a fact about the world that is either true or false. I am not describing a 'conditional fact.' I am expressing a conditional degree of belief. I am telling you that my belief in the cancellation, *supposing* it rains, is high.
  >
  > The Equation ($P(\text{If } A, C) = P(C \mid A)$) is not a claim about the probability of a truth-bearing sentence. It is a constraint on rational belief. Lewis's triviality results actually support this non-propositional view. They show that if you try to force conditionals into the box of 'True/False propositions,' the box breaks. The solution is not to say the conditional is a material implication (which yields absurd truth conditions); the solution is to take the conditional out of the box of truth-apt propositions entirely. The logic remains, but it is a logic of consistency in degrees of belief, not a logic of truth preservation."

  ### Summary Advice
  Your friend is right to be skeptical. The chapter is using Lewis's technical result to motivate a view (Material Conditional / No Logic) that Lewis himself rejected. It treats a metaphysical impossibility (Propositionalism + Equation) as a refutation of the intuitive probabilistic link (The Equation).

  Trust the intuition that $P(\text{If } A, C) = P(C \mid A)$ is correct. Trust Lewis that this means conditionals aren't standard propositions. Do not trust the chapter's claim that this forces us to accept the material conditional or abandon the logic of conditionals.
