  # Take-Home Final Examination: ML Safety and Philosophy

  **Course:** Seminar on ML Safety and Philosophy  
  **Assignment:** Final Essay  
  **Time Limit:** 48 Hours  
  **Word Count:** 1200–1500 words  

  ### Prompt: The Limits of Robust Aggregation in Reward Modeling

  Consider a standard reinforcement learning from human feedback (RLHF) setup. You have a large dataset of comparisons labeled by a pool of $N$ human annotators. Instead of pooling all labels into a single dataset, you randomly partition the *annotators* into $K$ disjoint groups. You then train $K$ reward models (RMs) from the same base model using the same hyperparameters, where each RM is trained exclusively on the labels from one annotator group. Let $R_1, \dots, R_K$ denote the scalar reward outputs of these models for a given policy output.

  You propose two aggregation strategies for the reinforcement learning phase:
  1.  **MEAN-K:** The policy optimizes the expected value of $\frac{1}{K} \sum_{i=1}^K R_i$.
  2.  **MIN-K:** The policy optimizes the expected value of $\min_{i} R_i$.

  The intuition behind MIN-K is robustness: a policy only receives credit if *every* reward model approves of the output. This purportedly prevents the policy from finding quirks that fool a single model or a majority coalition, forcing it to satisfy all representative viewpoints simultaneously.

  Write an essay analyzing the safety and performance implications of switching from MEAN-K to MIN-K. Do not simply recapitulate standard Goodharting arguments; assume the reader understands why optimizing a proxy generally fails. Instead, focus on the specific structural dynamics of this multi-model setup. Your analysis must address the following:

  *   **Independence vs. Shared Bias:** The reward models are trained on different labels but share the same architecture and base weights. How does this affect the independence of their errors when the policy moves off-distribution? Does MIN-K protect against errors the models share?
  *   **Order Statistics:** How does the behavior of the minimum function change as $K$ increases compared to the mean? What does this imply for the optimization landscape?
  *   **Veto Power:** What are the consequences of allowing a single reward model (representing a subgroup of annotators) to veto a generation? Consider noise, outliers, and adversarial annotators.
  *   **Behavioral Shifts:** How does optimizing for the minimum reward influence the stylistic properties of the policy's output? Discuss blandness, hedging, and mode collapse.
  *   **Information Limits:** Does changing the aggregation function solve the underlying information deficit, or does it merely reshape the failure mode?

  Argue to a specific verdict on whether MIN-K constitutes a meaningful advance in alignment safety or merely trades one class of failures for another.

  ***

  # Model Answer

  **Verdict: MIN-K Transforms Failure Modes Rather Than Solving Them**

  The proposal to optimize the minimum of $K$ reward models (MIN-K) rather than their mean (MEAN-K) appeals to a robust optimization intuition: if a policy must satisfy all critics, it cannot exploit the blind spots of any single one. While this strategy successfully mitigates specific forms of specification gaming driven by annotator variance, it ultimately fails to address the structural biases inherent in the modeling process. MIN-K does not solve the alignment problem; it shifts the failure mode from aggressive reward hacking to conservative stagnation and shared structural blindness.

  The primary limitation of MIN-K lies in the illusion of independence. The setup specifies that all $K$ reward models are fine-tuned from the same base model using the same recipe. While the labels differ due to annotator partitioning, the representational capacity of the models is identical. When the policy generates outputs that are off-distribution relative to the training data, all $K$ models are likely to extrapolate in similar ways because they share the same inductive biases. If the base model possesses a shared spurious correlation—for example, associating high reward with excessive length or specific confidence markers—all $K$ reward models will likely inherit this bias. MIN-K protects against variance in human labeling, but it offers no defense against bias in the model architecture or pre-training. If all models are wrong in the same way, the minimum reward is still confidently wrong.

  Furthermore, the statistical behavior of the minimum operator introduces severe conservatism as $K$ grows. The mean is a stable estimator; as $K$ increases, the law of large numbers suggests the average reward converges to the expected value of the population. The minimum, however, is an order statistic that trends downward as sample size increases. In a MIN-K setup, adding more reward models increases the probability that at least one model will assign a low score due to random noise, even if the output is genuinely good. Consequently, the optimization pressure forces the policy to target the "lowest common denominator" of approval. As $K$ increases, the policy is not necessarily becoming more aligned; it is becoming more risk-averse, avoiding any output that triggers a strong negative signal from any subgroup, regardless of whether that signal is valid.

  This dynamic grants disproportionate veto power to outlier annotator groups. In a MEAN-K setup, a noisy or adversarial subgroup is diluted by the majority. In MIN-K, a single subgroup can hold the entire policy hostage. If one group of annotators systematically penalizes a specific style or topic—for instance, due to cultural bias or distinct interpretation guidelines—the policy must abandon that style entirely to maximize the objective. This does not ensure safety; it ensures compliance with the most restrictive constraint found in the dataset. This is particularly dangerous if the outlier group represents an adversarial perspective or a systematic misunderstanding of the task. The policy learns to satisfy the easiest constraint to meet globally, which may not correlate with human intent.

  The behavioral consequence of this pressure is inevitable blandness and hedging. To ensure that $\min_{i} R_i$ is high, the policy must generate outputs that offend no one. This selects for responses that are vague, non-committal, and overly cautious. While this might reduce the rate of overtly harmful outputs, it also collapses the utility of the system. A policy that refuses to take a stance to avoid minimizing reward from any specific model fails to be helpful. This is a form of mode collapse where the policy converges on a narrow band of "safe" outputs that lie in the intersection of all $K$ reward landscapes. This intersection may be empty or trivial, leading to a system that is safe but useless.

  Finally, we must recognize that changing the aggregator does not create new information. The fundamental problem in RLHF is that the reward models are proxies for human values, and those proxies are imperfect. Aggregating $K$ imperfect proxies via a minimum function does not yield a perfect signal; it yields a signal that is robust to variance but brittle to shared error. The optimization pressure will simply find the new shortest path to high reward. Instead of hacking a single model's quirks, the policy will hack the shared quirks of the ensemble or exploit the conservatism of the min function by producing empty platitudes. True alignment requires better data and better base models, not just stricter aggregation.

  In conclusion, MIN-K is not a solution to Goodharting. It is a mechanism that trades the risk of extreme reward hacking for the risk of extreme conservatism. It protects against annotator disagreement but amplifies shared model bias and induces behavioral collapse. While it may be useful in specific high-stakes contexts where false negatives are catastrophic, it does not constitute a general advance in alignment safety.

  ***

  # Marking Scheme (20 Marks Total)

  **1. Independence vs. Shared Bias (4 Marks)**
  *   **Full Credit:** Identifies that shared base models/architecture lead to correlated errors off-distribution. Explains that MIN-K fails to filter shared spurious features (e.g., length, confidence).
  *   **Common Error:** Assumes partitioning annotators guarantees independent model errors, ignoring architectural correlation.

  **2. Order Statistics and Conservatism (4 Marks)**
  *   **Full Credit:** Explains that the minimum value decreases as $K$ increases (unlike the mean). Notes that optimization becomes increasingly conservative/difficult as more models are added.
  *   **Common Error:** Treats MIN-K as statistically stable like the mean, or fails to discuss the scaling behavior with $K$.

  **3. Veto Power and Noise Sensitivity (4 Marks)**
  *   **Full Credit:** Discusses how a single noisy or biased subgroup can block valid outputs. Highlights the risk of outlier annotators dictating global policy behavior.
  *   **Common Error:** Assumes all annotator groups are equally valid and ignores the impact of noise or adversarial labeling on the minimum.

  **4. Behavioral Shifts (Blandness/Hedging) (4 Marks)**
  *   **Full Credit:** Predicts that MIN-K selects for vague, non-committal, or hedged outputs to avoid minimizing reward. Connects this to mode collapse or reduced utility.
  *   **Common Error:** Claims MIN-K leads to more diverse outputs, or fails to connect the objective function to specific stylistic changes.

  **5. Information Limits and Verdict (4 Marks)**
  *   **Full Credit:** Argues that aggregation cannot compensate for lack of information/shared bias. Delivers a clear verdict (e.g., "shifts failure mode" rather than "solves problem").
  *   **Common Error:** Concludes that MIN-K is strictly safer without qualifying the utility cost, or suggests aggregation solves the underlying proxy problem.

  ***

  # Grading Notes

  **Differentiation (A vs. B):**
  *   **A Grade:** Synthesizes the five points into a coherent thesis about the difference between *variance* (which MIN-K reduces) and *bias* (which MIN-K ignores). The argument flows logically from structural constraints to behavioral outcomes.
  *   **B Grade:** Addresses all five points but treats them as a checklist of pros and cons without a unifying argument about information limits or structural bias.

  **Reasonable Pushback:**
  *   A student might argue that MIN-K is preferable for specific safety-critical applications (e.g., medical advice) where avoiding harm (false positives) is more important than utility, even if it leads to blandness.
