answer: |-
  # MAXWELL'S DEMON: A DECISION TREE
  **Goal:** Walk from "Szilard works" to "Here is where the entropy debt is paid."  
  **Instructions:** Start at **Q1**. Follow your intuition on each case. Record your **Leaf Number** and **Boundary**.

  ---

  ### THE TREE

  **Q1. ACCOUNTANCY BOUNDARY**  
  To save the Second Law, whose total entropy must not decrease?  
  ├─ **A. The Gas Only.** (The demon is external/irrelevant.) → **Go to Leaf 1**  
  └─ **B. Gas + Demon + Environment.** (The composite system.) → **Go to Q2**

  **Q2. THE ONE-SHOT DEMON**  
  *Case:* One molecule, one cycle, $kT \ln 2$ extracted. The apparatus melts; no reset.  
  Is the Second Law violated?  
  ├─ **A. Yes.** (A single cycle must obey the law absolutely.) → **Go to Leaf 2**  
  └─ **B. No.** (The law is statistical; fluctuations are allowed.) → **Go to Leaf 3**  
  *(Wait, if you said B, do you think the law is saved on average? If Yes → Leaf 3. If No, the law is false → Leaf 1)*  
  *Correction for flow:* Let's split Q2.  
  **Q2. THE ONE-SHOT DEMON**  
  *Case:* One molecule, one cycle, $kT \ln 2$ extracted. The apparatus melts; no reset.  
  Does this count as a violation of the 2nd Law?  
  ├─ **A. Yes.** (The law forbids this specific decrease.) → **Go to Q3**  
  └─ **B. No.** (The law is only about averages over many cycles.) → **Leaf 3**

  **Q3. MEASUREMENT COST**  
  Does the physical act of *measuring* the molecule's position necessarily dissipate heat?  
  ├─ **A. Yes.** (Looking requires energy.) → **Leaf 4**  
  └─ **B. No.** (Measurement can be reversible.) → **Go to Q4**

  **Q4. THE HEIRLOOM DEMON (Part 1)**  
  *Case:* Demon inherits a tape perfectly correlated with the gas. No measurement occurs.  
  Does the *extraction step itself* generate entropy?  
  ├─ **A. Yes.** (Using the correlation costs entropy now.) → **Leaf 5**  
  └─ **B. No.** (The cost lies in the history or the future.) → **Go to Q5**

  **Q5. THE COLD-TAPE DEMON**  
  *Case:* Full tape is shipped to a reservoir at $T/10$ and erased there.  
  Is the heat dissipated $k T_{gas} \ln 2$ (fixed debt) or $k (T/10) \ln 2$ (scales with temp)?  
  ├─ **A. Scales with Temp.** (It's a physical heat engine cost.) → **Leaf 6**  
  └─ **B. Fixed by Gain.** (The informational debt is independent of $T_{erase}$.) → **Go to Q6**

  **Q6. PREPARATION DEBT**  
  If the tape starts correlated (Heirloom), was the entropy debt paid at *creation*?  
  ├─ **A. Yes.** (It is a sunk cost; the demon is 'spent' fuel.) → **Leaf 7**  
  └─ **B. No.** (The debt is due when the cycle closes.) → **Go to Q7**

  **Q7. RESET REQUIREMENT**  
  To close the cycle, must the memory return to its *exact* initial microstate?  
  ├─ **A. Yes.** (Exact restoration is required.) → **Leaf 8**  
  └─ **B. No.** (It just needs to be uncorrelated/randomized.) → **Leaf 9**

  ---

  ### THE LEAVES (Your Position)

  **Leaf 1: EXORCISM FAILED**  
  *Verdict:* The Demon violates the 2nd Law.  
  *Diagnosis:* Either the 2nd Law is false, or the definition of "System" is circular.  
  *Accountancy Boundary:* **Gas Only** (or Composite, but violation accepted).  
  *Label:* **Norton/Earman Critique**

  **Leaf 2: STATISTICAL FLUCTUATION**  
  *Verdict:* The Demon works, but only as a fluctuation.  
  *Diagnosis:* 2nd Law is probabilistic ($P \approx 1$), not absolute. No exorcism needed.  
  *Accountancy Boundary:* **Gas + Demon**  
  *Label:* **Classical Stat Mech**

  **Leaf 3: MEASUREMENT COST**  
  *Verdict:* The Demon is exorcised by the sensor.  
  *Diagnosis:* Acquiring information dissipates $kT \ln 2$. Erasure is irrelevant.  
  *Accountancy Boundary:* **Gas + Demon**  
  *Label:* **Szilard / Brillouin**

  **Leaf 4: CORRELATION COST (?)**  
  *Verdict:* The Demon is exorcised by using the correlation.  
  *Diagnosis:* The act of converting correlation to work increases entropy locally, even without erasure.  
  *Accountancy Boundary:* **Gas + Demon**  
  *Label:* **Info-Thermo Realist (?)**

  **Leaf 5: TEMP-SCALED COST (?)**  
  *Verdict:* The Demon is exorcised, but pays less at low $T$.  
  *Diagnosis:* **UNOCCUPIED.** Implies information value depends on erasure temperature, not acquisition.  
  *Accountancy Boundary:* **Gas + Demon + Reservoir**  
  *Label:* **Thermal Physicalist (?)**

  **Leaf 6: PREPARATION COST**  
  *Verdict:* The Demon is exorcised by the preparer.  
  *Diagnosis:* The debt was paid when the tape was written. The engine is just burning fuel.  
  *Accountancy Boundary:* **Universe (including Preparer)**  
  *Label:* **Hemmo & Shenker**

  **Leaf 7: EXACT-RESET COST (?)**  
  *Verdict:* The Demon is exorcised by restoring the microstate.  
  *Diagnosis:* **UNOCCUPIED.** Requires more energy than Landauer's limit; physically unmotivated.  
  *Accountancy Boundary:* **Gas + Demon**  
  *Label:* **Microstate Reversalist (?)**

  **Leaf 8: ERASURE COST**  
  *Verdict:* The Demon is exorcised by resetting the memory.  
  *Diagnosis:* Information is physical. Erasing 1 bit costs $kT \ln 2$.  
  *Accountancy Boundary:* **Gas + Demon + Reservoir**  
  *Label:* **Landauer / Bennett**

  **Leaf 9: ERASURE COST (Alternative Path)**  
  *Verdict:* The Demon is exorcised by resetting the memory.  
  *Diagnosis:* Same as Leaf 8. Distinguishes only on "Exact" vs "Random" reset.  
  *Accountancy Boundary:* **Gas + Demon + Reservoir**  
  *Label:* **Landauer / Bennett**

  ---

  ### LOGICAL SPACE ANALYSIS (Instructor Key)

  **⚠️ Indistinguishable Leaves:**  
  **Leaf 8 & Leaf 9** are empirically equivalent in standard thermodynamics. Whether one demands *exact* microstate restoration or just *decorrelation*, the minimum work required is $kT \ln 2$ per bit. The tree separates them logically, but physics collapses them.

  **🚫 Unoccupied Combinations:**  
  1.  **Leaf 5 (Temp-Scaled):** Nobody holds this. If information value scaled with $T_{erase}$, one could build a perpetuum mobile by shuttling tape between reservoirs. It violates the equivalence of information and thermodynamic entropy.
  2.  **Leaf 7 (Exact-Reset):** Nobody holds this. Requiring *exact* microstate restoration (Liouville conservation) rather than macrostate reset imposes a stricter cost than Landauer's principle without physical justification. Merely unexplored/unattractive.
  3.  *(Implicit in Q1)* **Boundary=Gas Only + 2nd Law Saved:** This combination is **Incoherent**. If the boundary is the gas, and the gas entropy drops, the law is broken by definition. This path leads immediately to Leaf 1.

  **📏 Accountancy Boundaries:**  
  Note that "Exorcism" depends entirely on where you draw the box.  
  *   **Leaf 1:** Box = Gas. (Violation)  
  *   **Leaf 3, 4, 8, 9:** Box = Gas + Demon. (Internal balance)  
  *   **Leaf 6:** Box = Universe. (External balance)  

