          You claim methodological agnosticism (1), but asserting welfare depends *only* on valence (2) is a strong philosophical commitment (hedonism). It excludes perceptual consciousness from welfare ethics by fiat, not evidence. This isn't theory-light; it's theory-heavy disguised as empiricism.
