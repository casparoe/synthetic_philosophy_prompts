          *   Single Revision: Demote (7). Make "lingering" a sufficient but not necessary marker. This protects (6) and saves (3) if fish data is mixed on recovery curves.

      *   *Refining for Word Count:* Need to be concise.
      *   *Refining for Tone:* Professional, direct, audit-style.

      *   *Re-evaluating Single Revision:* Actually, revising (2) might be bigger. If welfare = valence, but we can't measure valence directly, we rely on markers. If (7) is the best marker for valence, but (6) says don't bias anatomy...
