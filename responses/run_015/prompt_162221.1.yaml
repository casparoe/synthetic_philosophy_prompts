      *   *Tension B (Severity: Medium):* Point (1) theory-light vs. Point (2) substantive claim about valence vs. consciousness. Claiming "only valence matters for welfare" is itself a theoretical commitment about the nature of welfare and consciousness (affectiva vs. perceptual). It conflicts slightly with the "theory-light" method if "valence" is treated as a settled theoretical construct.
      *   *Tension C (Severity: Medium/Low):* Point (5) Graded vs. Point (4) Precautionary Principle. If consciousness is graded, how does the precautionary principle apply? Usually, PP applies to binary uncertainty (is it in or out?). If it's graded, you need a weighting function, not just a binary "weight them anyway."
      *   *Tension D (Severity: Low):* Point (6) Taxon-neutral vs. Point (7) Lingering. Is "lingering" truly taxon-neutral? Some species *should* snap back fast for survival (e.g., prey animals). Interpreting "fast snap-back" as non-sentient might violate Point (6).

