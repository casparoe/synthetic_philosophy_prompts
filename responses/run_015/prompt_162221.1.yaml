      *   *Revision:* Soften (7). Don't treat "lingering" as a necessary condition, but as one convergent marker among others. Or, revise (6) to acknowledge ecological constraints on expression.
      *   *Better Revision:* Align (4) and (5). If consciousness is graded, the precautionary principle needs to be weighted, not binary. This cleans up the insect argument.
