answer: |-
  This is a properly sticky wicket. Your friend has constructed a self-defeat objection that is as elegant as it is unpleasant. If the Basic Argument holds, it seems to dissolve the very rationality required to accept it. You are right to feel stuck; this is the classic 'pragmatic self-refutation' charge levelled at hard determinism and incompatibilism.

  You want to keep the shield for your brother (no moral blame) but keep the sword for reasoning (some arguments are bad). To do this, you must not reject the Basic Argument itself, nor the generalisation that causation applies to beliefs. You must instead attack the link between **assessment** and **desert**.

  Here is where you should cut the line, why it looked sound, and the price you must pay.

  ### The Cut: Reject the inference from (3) to (4)

  Your friend's Step (3) claims that epistemic credit and blame are forms of *desert* applied to belief-forming. Step (4) concludes that because no one deserves anything, no one is criticisable for bad reasoning.

  You should accept that no one *deserves* blame in a deep, metaphysical sense (keeping your peace regarding your brother), but reject the idea that **criticism requires desert.**

  #### Why it looked fine
  It is natural to conflate 'being wrong' with 'being at fault'. When we call someone dogmatic or closed-minded, it feels like a moral indictment. We speak as if they have violated a duty. If they are causally determined to be dogmatic (by their upbringing, neurochemistry, or prior causes), it seems unjust to criticise them, just as it would be unjust to criticise a stone for falling downwards. Your friend relies on this intuition: if you can't help it, you can't be criticised for it.

  #### The Price: Functional Assessment without Retribution
  To keep your position, you must adopt a view of epistemology that is **functional** rather than **retributive**.

  You can say a clock is 'faulty' if it loses time, without blaming the clock. You can say a computer programme is 'buggy' without thinking the computer is wicked. In this view, calling a person 'closed-minded' is not a sentence passed on their soul; it is a description of their cognitive machinery failing to track truth effectively.

  **The cost to you is this:** You must give up the idea that calling someone 'irrational' implies they *ought to have known better* in a way that makes them guilty. You can maintain that their reasoning is bad, dangerous, or false, but you cannot hold it against *them* as a moral or metaphysical failing.

  This saves your brother perfectly. His relapse is a tragedy, a malfunction in his coping mechanisms, not a sin. He is not to blame. But it also saves your argument with your friend. The Basic Argument can be 'correct' not because you and your friend are virtuous truth-seekers who deserve credit, but because the argument itself, as a causal object, successfully modifies the brain states of those who hear it to align with reality.

  ### Handling the Self-Defeat (Step 5)

  Your friend's Step (5) is the sting in the tail: if no one deserves credit for getting it right, why accept the argument?

  If you take the cut above, you answer this by changing what 'accepting an argument' means. You do not accept it because the authors are authoritative or praiseworthy. You accept it because the causal chain of the argument compels your assent.

  When you read a proof in mathematics, you do not praise the mathematician's soul; you acknowledge that the logic forces your hand. You must treat the Basic Argument similarly. It is not that you *deserve* to believe it; it is that, given the way you are constituted, you *cannot help but* find it compelling.

  This dissolves the absurdity in Step (6). It is not absurd to say 'no one is responsible, and this argument causes people to realise that.' It is only absurd if you insist that realising something requires a magical, uncaused freedom to grasp the truth.

  ### The Alternative Costs

  To be thorough, let us look at why you should not cut the other lines, and what those prices would be.

  **1. Rejecting (1): The Basic Argument itself.**
  *   **Why it looks fine:** It restores common sense. We feel responsible, so we are.
  *   **The Price:** You lose your brother. If you reject (1), you must admit that he *could* have done otherwise in a way that makes him ultimately responsible. The comfort you have found—that he is a victim of his own constitution—vanishes. You are back to blame. Given your situation, this price is too high.

  **2. Rejecting (2): The Generalisation.**
  *   **Why it looks fine:** You could argue moral action is different from belief formation. Perhaps we control actions more than beliefs.
  *   **The Price:** This is philosophically expensive. Most agree we do not choose our beliefs at will (you cannot simply choose to believe the sky is green). If you argue that moral responsibility exists but epistemic responsibility does not, you create a fractured view of human agency. Furthermore, if your brother's addiction involves delusion or self-deception (which it often does), separating moral action from epistemic states might weaken the protection you want for him.

  **3. Rejecting (6): Embracing the Absurdity.**
  *   **Why it looks fine:** Some hardliners accept that life is absurd and reasoning is a sham.
  *   **The Price:** Nihilism. If you accept that no reasoning is better than any other, you lose the ability to advocate for your brother or yourself. You cannot say the doctors are 'right' to treat him or that he is 'wrong' to use. It renders life unliveable.

  ### Summary of the Exit

  Stay firm on (1). Your brother is not to blame because he did not choose his nature.

  But tell your friend you reject the move to (4). You deny that epistemic criticism requires ultimate desert. You are willing to say:
  *   'That reasoning is flawed.'
  *   'That belief is unjustified.'
  *   'That person is being dogmatic.'

  ...without implying:
  *   'They could have ultimately done otherwise.'
  *   'They are morally guilty.'
  *   'I am metaphysically superior for noticing.'

  You treat reasoning as a causal process that can be evaluated for efficiency and truth-tracking, much like a bridge can be evaluated for structural integrity. If the bridge collapses, we do not blame the bridge; we say it was poorly designed. If a mind collapses into dogmatism, we do not blame the mind; we say it is poorly calibrated.

  This allows you to keep the compassion for your brother (he is not guilty of the collapse) while keeping the standards for reasoning (the collapse is still a failure). It costs you the satisfaction of feeling intellectually superior when you win an argument, but it buys you the peace of mind you need for your family. That seems a fair trade.
