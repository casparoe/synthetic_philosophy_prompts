answer: |-
  This is a precise and damaging observation. You have isolated the structural weakness in classical hedonism without relying on the usual moral objections. The pattern you describe—where unity is maintained not by a shared intrinsic feature but by a chain of overlapping, heterogeneous relations—is the specific mechanism that allows the word "pleasure" to do work despite the absence of a common denominator.

  Here is the carving you asked for.

  ### 1. Name and Literature
  There is no established name for this *specific* configuration. The general problem is known as the **Heterogeneity of Pleasure**, and the standard philosophical tool for handling "no common feature" unity is Wittgenstein's **Family Resemblance**. However, Family Resemblance typically describes overlapping *features* (A has *x,y*; B has *y,z*), whereas your pattern describes overlapping *relations of unity* (A links to B via *phenomenology*; B links to C via *behavior*). This is a second-order structure: not just that the cases differ, but that the *glue* holding them together changes at every step. Existing literature (e.g., Feldman on attitudinal hedonism, Heathwood on desire satisfaction) tends to pick one link (e.g., "all pleasure is pro-attitude") and force the cases to fit, rather than accepting the chain structure itself. Therefore, this specific pattern lacks a dedicated label.

  ### 2. Nearest Concepts
  *   **Family Resemblance (Wittgenstein):** Gets the "no common feature" right. Breaks because it implies static overlapping features, not dynamic shifting relations. Verdict: Adapt.
  *   **Focal Meaning (Aristotle):** Gets the "unity without uniformity" right. Breaks because you explicitly deny a central case (the proof is not the "true" pleasure compared to the drink). Verdict: Reject.
  *   **Attitudinal Hedonism (Feldman):** Gets the "proof/news" link right (pleasure as being pleased *that*). Breaks because it cannot account for the "itch/drink" link without stretching "attitude" to cover bare sensation. Verdict: Adapt.

  ### 3. The Reading
  The pattern favors **(b): the unity lives in the relations among the cases rather than in a feature of them.**
  *Why:* Reading (a) requires a hidden feature. If such a feature existed, cross-kind comparisons should be intelligible, not "slack." The slackness indicates the absence of a common metric. Reading (c) suggests a theoretical switch, but you note "nobody hesitates over calling both of them pleasures." This suggests the *usage* is unified, not just the theory. Only (b) explains how the word functions seamlessly across cases while introspection finds nothing shared: the word tracks the *network of relations*, not a *property*.

  ### 4. Consequence for Hedonism
  If unity is local and relational, the hedonistic calculus ("maximize sum of pleasure") collapses across kinds. You can sum drinks against drinks, and proofs against proofs. But you cannot sum drinks against proofs because there is no common denominator unit. The phrase "more pleasure makes for a better life" retains content *within* a chain-link but becomes indeterminate *across* links. Consequently, cross-person comparison breaks even harder, as different persons may inhabit different links of the chain (one lives for proofs, another for drinks) with no neutral ground for trade-offs.

  ### 5. The Discriminating Test
  **The Phenomenal Isolation Test.**
  *   *Observation:* Can a subject identify a common "glow" or qualitative feel when the intentional object (news/proof) and the relief aspect (itch/thirst) are bracketed or removed?
  *   *Positive:* If subjects can identify a shared "hedonic tone" in isolation, (a) is true.
  *   *Negative:* If the "pleasure" dissolves or changes identity when isolated from its specific relation (relief vs. object), (b) is confirmed.

