answer: |-
  This is a fascinating docket. You are essentially building a common-law system of museum ethics in real-time, and like any common-law system, you are discovering that your precedents are not a monolith but a collection of competing philosophies that only *appear* consistent until a hard case arrives.

  Based on the five precedents you provided, here is an analysis of your committee's implicit jurisprudence, the prediction for the ivory tusk, and the stress tests that will break your system.

  ### 1. The Prediction: Vote **NO** (Retention)
  **Confidence:** Moderate-High, based on your specific track record.

  **The Reasoning:**
  Your committee seems to operate on a hierarchy of injustice. You require a specific "threshold of coercion" to override legal title.
  *   **The 1897 Bronzes (Yes):** Direct military confiscation. The threshold is met.
  *   **The Khmer Statue (Yes):** Genocide/State Collapse. The threshold is met.
  *   **The Maori Taonga (Yes):** Structural incapacity to consent (communal property). The threshold is met.
  *   **The Parthenon Marbles (No):** Technical legality (firman) outweighs moral shadiness.
  *   **The Biafra Plaque (No):** Distress sale without *direct* state coercion outweighs the context of war.

  **The Ivory Tusk Application:**
  The 1885 sale is your "firman." It is the document that breaks the chain of direct colonial violence. Even though the object is Benin, and even though the 1897 raid is the cultural trauma point, this specific object left via a commercial transaction 12 years prior.
  *   **Why it fits the "No" precedents:** Like the Parthenon Marbles, there is a paper trail suggesting a transaction. Like the Biafra Plaque, there is no evidence of *direct* coercion at the moment of transfer (1885 was tense, but not the 1897 Punitive Expedition).
  *   **The Risk:** The Maori precedent. If your committee investigates and determines that 17th-century Benin ivory was **royal monopoly property** that no individual had the authority to sell (similar to the Maori communal taonga), the vote flips to **Yes**. However, given your refusal on the Biafra plaque (where context was war), you seem to prioritize *transactional legality* over *structural power imbalances* unless the incapacity is absolute (as in the Maori case). Unless you prove the 1885 seller had *zero* authority, the 1885 date shields the object.

  ### 2. The Competing Rules (Your Hidden Frameworks)
  You are currently juggling three distinct ethical frameworks. Your precedents wobble because you switch between them depending on the emotional weight of the case.

  **Rule A: The "Event Horizon" of Violence (Contextual)**
  *   *Logic:* If an object is associated with a specific, documented atrocity (1897 Raid, Khmer Genocide), the stain is permanent regardless of paperwork.
  *   *Used in:* Benin Bronzes, Khmer Statue.
  *   *Weakness:* It creates a cutoff date. Why is 1897 looting worse than 1885 exploitation?

  **Rule B: The "Clean Hands" Doctrine (Legalistic)**
  *   *Logic:* If a transaction was legal under the laws of the time (or lacked direct coercion), title passes. Moral shadiness (Ottoman power imbalance, Biafra distress) is insufficient for restitution.
  *   *Used in:* Parthenon Marbles, Biafra Plaque.
  *   *Weakness:* It legitimizes colonial legal frameworks that were designed to facilitate extraction.

  **Rule C: The "Inalienability" Exception (Cultural)**
  *   *Logic:* Some property cannot be sold by individuals, regardless of the law. Consent is structurally impossible.
  *   *Used in:* Maori Taonga.
  *   *Weakness:* It requires deep anthropological knowledge. How do you prove a Benin merchant in 1885 lacked authority vs. a Maori chief in 1923?

  **Which one are you actually running?**
  You are primarily running **Rule B (Legalistic)**, with **Rule A (Violence)** as an override *only* when the violence is military and direct. You are hesitant to use **Rule C (Inalienability)** broadly; you applied it to the Maori case likely because Indigenous property rights are more clearly defined in Commonwealth law than Benin royal monopolies are in German/British trade records.

  ### 3. The Stress Test: A Hypothetical to Split Your Rules
  To expose the fracture in your logic, you need a case that satisfies Rule A (Violence) but fails Rule B (Title), while complicating Rule C (Consent).

  **The Hypothetical: "The Collaborator's Heirloom"**
  > *Case:* A Benin altar piece acquired by your museum in 1950. Provenance shows it was sold to a British officer in 1898 (one year after the raid) by a **rival Nigerian Chief** who had looted it from the Oba's palace *during* the chaos of the British raid, then claimed "ownership" to sell it.
  > *   **Direct Colonial Violence?** No, the British officer bought it; he didn't take it. (Fits *Biafra/Parthenon* -> **Keep**)
  > *   **Context of Atrocity?** Yes, it was looted during the 1897/98 destruction. (Fits *Benin Bronzes* -> **Return**)
  > *   **Authority to Sell?** No, the rival Chief had no right to the Oba's property. (Fits *Maori* -> **Return**)

  **Why this splits the committee:**
  *   If you vote **No**, you are saying that *who* did the looting matters more than *that* it was looted. You privilege the British officer's "clean hands" over the Oba's loss.
  *   If you vote **Yes**, you are admitting that "legal purchase" is irrelevant if the supply chain is tainted by colonial violence, which undermines your *Parthenon* and *Biafra* precedents.

  **Alternatively, using your suggestion (The Melted Replica):**
  > *Case:* A Benin Bronze you restituted in 2020. In 2024, the receiving nation, needing funds, sells it to a foundry. It is melted down. A wealthy donor commissions a perfect 3D-printed replica in resin and donates it to you.
  > *   **Materiality:** The original matter is gone. (Fits *Legalistic* -> **Keep**, it's a new object).
  > *   **Cultural Form:** The form is sacred/ancestral. (Fits *Cultural Necessity* -> **Return/Decline**, you cannot own the form).
  > *   **Precedent:** You returned the "loot." Is this loot? (Fits *Event Horizon* -> **Return**, it represents the same trauma).

  This forces you to decide: **Are you restituting the *matter* (the physical object) or the *relationship* (the right to control the cultural narrative)?**

  ### 4. The Principle You Are Adopting
  If you vote **NO** on the Ivory Tusk (as your precedents suggest you might):
  *   **The Principle:** **"Stability of Title."** You are prioritizing the museum's role as a preserver of objects with clear provenance over the claimant's role as a healer of historical wounds. You are establishing that *time* and *paperwork* can cure the sin of colonial extraction. This protects the museum from endless claims but risks moral obsolescence.

  If you vote **YES** on the Ivory Tusk:
  *   **The Principle:** **"Presumptive Illegitimacy."** You are establishing that within a colonial context, *all* transactions are suspect unless proven otherwise. The burden of proof shifts from the claimant (proving theft) to the museum (proving free consent). This is morally robust but operationally difficult; it potentially empties the museum.

  ### Summary Advice for the Meeting
  The pivot point for the Ivory Tusk is the **1885 Sale**.
  *   If you treat 1885 as a "normal" market year, you **Keep** it (aligning with Parthenon/Biafra).
  *   If you treat 1885 as part of the "long 1897" (a period of encroaching coercion where the Oba's monopoly was already being violated), you **Return** it (aligning with Benin Bronzes/Maori).

  Your committee's history suggests you prefer bright lines (dates, documents) over murky contexts. Expect the **1885 date** to win the day, resulting in a **No** vote. But be warned: that vote implicitly declares that colonial economic pressure is not the same as colonial military violence, a distinction the Oba's Court will likely reject.
