answer: |-
  You have stumbled onto a very specific, sophisticated niche of International Relations (IR) theory and strategic studies. You are correct that "Deterrence by Denial" is insufficient, because that concept only speaks to the *invader's* calculus (cost vs. gain). It does not address the *neighbor's* anxiety (fear that you might attack them).

  The package you are describing does not have a single, perfect colloquial word, but in strategic studies, it is best described as **Non-Offensive Defense (NOD)** combined with a strategy of **Credible Commitment via Structural Constraints.**

  Here is the breakdown of the concepts, why your intuition about "reversal cost" is theoretically sound, and how the different types of incapacity (technical vs. legal vs. institutional) function.

  ### 1. The Posture: Non-Offensive Defense (NOD)

  The closest established term for the military setup you described is **Non-Offensive Defense**.

  *   **Definition:** A defense posture where forces are structured specifically to be highly effective at defending home territory but structurally incapable of sustaining offensive operations abroad.
  *   **Key Features:** Heavy reliance on reserves/militia (hard to deploy quickly), lack of strategic lift (no transport planes/ships), short-range artillery, and defensive fortifications.
  *   **How it differs from "Deterrence by Denial":** Denial just means "you can't win." NOD means "I can't win against you either." It solves the **Security Dilemma**: the paradox where one state's defensive buildup looks threatening to its neighbor. By adopting NOD, the state signals, "I am building a shield, not a sword."
  *   **The "Waste" Aspect:** You noted the force looks like a waste by ordinary metrics. In NOD theory, this "inefficiency" is a feature, not a bug. It is **expensive signaling**. By accepting a military that is inefficient for power projection, the state proves it has no power projection ambitions.

  ### 2. The "Reversal Cost": Credible Commitment

  Your intuition about the "reversal cost" is the critical insight here. In IR theory, this falls under **Credible Commitment** (or "Tying Hands").

  A promise not to attack is "cheap talk." Any government can make it today and break it tomorrow. To make the promise believable, the state must make breaking it physically, legally, or institutionally difficult. This is where your "reversal cost" variable comes in.

  **Is "Reversal Cost" a separate variable?**
  Yes. In the literature on **Confidence- and Security-Building Measures (CSBMs)**, this is often discussed as **Irreversibility**.
  *   **Low Reversal Cost:** A country chooses not to project power but has the trucks, planes, and command structure ready. (Your Case 1).
  *   **High Reversal Cost:** A country has dismantled the logistics, sold the transports, and zoned over the bases. (Your Case 2).

  **Why Case 2 provides better reassurance:**
  You guessed that Case 2 (dismantled institutional basis) provides more reassurance than Case 1 (merely weak today). **You are correct.**
  *   **Case 1 (Latent Capability):** This creates a "Breakout" risk. Neighbors know that if political winds change, the state can pivot to offense in months. This keeps the Security Dilemma active.
  *   **Case 2 (Structural Incapacity):** This creates a **Mobilization Lag**. If the state decides to attack, neighbors will see it coming *years* in advance (because they have to rebuild the bases, pass new laws, train new officers). Time acts as a witness. The "reversal cost" buys time for diplomacy to intervene before the threat becomes real.

  ### 3. Technical vs. Legal vs. Institutional Incapacity

  You asked if it matters *why* the country can't attack. It matters immensely for the "reversal cost" calculation.

  **A. Technical Incapacity (No transport aircraft, short-range guns)**
  *   **Reversal Cost:** High/Medium. Procuring new tech takes years and is visible (satellites see new airfields).
  *   **Reassurance Value:** High. It is hard to hide a buildup of offensive hardware.
  *   **Weakness:** Technology can sometimes be dual-use. A civilian cargo plane can be requisitioned.

  **B. Legal Incapacity (Constitutional bans, conscription laws)**
  *   **Reversal Cost:** Medium. Laws can be changed by a parliamentary majority.
  *   **Reassurance Value:** Medium/Low. It depends on the stability of the political system. If a populist leader rises, laws can be changed quickly (e.g., Germany in the 1930s circumventing Treaty of Versailles restrictions).
  *   **Role:** Legal constraints are usually seen as "speed bumps" rather than walls. They slow down the reversal, giving neighbors time to react.

  **C. Institutional/Infrastructural Incapacity (Dismantled bases, civilianized logistics)**
  *   **Reversal Cost:** Very High. This is the "reversal cost" you identified. Rebuilding a professional officer corps, reopening closed bases, and re-establishing supply chains takes a decade.
  *   **Reassurance Value:** Highest. This creates deep "strategic inertia."
  *   **Example:** Post-WWII Japan. Its constitution (legal) is famous, but its lack of offensive logistics (institutional/technical) is what actually reassures neighbors.

  ### 4. Nearby Concepts and Where the Edges Are

  To ensure you have the right vocabulary, here are the concepts that border this idea but are distinct:

  | Concept | How it differs from your description |
  | :--- | :--- |
  | **Deterrence by Denial** | Focuses only on making invasion costly. Does not address the neighbor's fear of *your* aggression. |
  | **Disarmament** | Implies reducing force levels generally. Your example keeps high force levels (reserves), just structured defensively. |
  | **Neutrality** | A political/legal status (won't join alliances). You can be neutral but have an offensive army (e.g., Sweden in WWII had a strong offensive capability despite neutrality). |
  | **Tripwire Force** | A small force meant to *guarantee* invasion triggers an ally's response. Your example is about self-reliance, not alliance triggering. |
  | **Porcupine Strategy** | Very close. Usually implies "painful to swallow." Often lacks the explicit "reassurance to neighbors" component; focuses more on the denial aspect. |
  | **Arms Control** | Usually involves treaties between states. Your example is **Unilateral Restraint**. |

  ### 5. Summary Terminology

  If you need a label for your notes to replace "reversal cost," the most precise term from strategic studies is **Structural Non-Offensiveness**.

  However, if you want to capture the *political function* of that reversal cost (the reassurance), the phrase is **Reassurance via Incapacity**.

  **The Verdict on your Hypothesis:**
  You are describing a system designed to resolve the **Security Dilemma** through **Unilateral Structural Constraints**.
  *   **The Posture:** Non-Offensive Defense.
  *   **The Mechanism:** High Reversal Cost (Mobilization Lag).
  *   **The Goal:** Reassurance (Credible Commitment).

  Your intuition about the two cases is theoretically robust. A state that *could* attack but *chooses* not to (Case 1) relies on **Intent**, which is fragile. A state that *cannot* attack without a visible, years-long buildup (Case 2) relies on **Capability**, which is observable. In security studies, capability is always a more credible signal than intent. The "waste" you perceive is the premium paid for that credibility.

  **Recommended Reading/Search Terms:**
  If you want to dive deeper, look for works on:
  *   **The Offense-Defense Balance** (Jervis, Van Evera).
  *   **Non-Offensive Defense** (Ahlfeldt, Müller).
  *   **Costly Signaling Theory** in IR (James Fearon).
  *   **Swiss "Reduit" Strategy** (The specific historical case you are likely thinking of).
  *   **Sweden's Cold War "Defense in Depth"** (Another strong example).

  You have effectively reinvented a chunk of Cold War defensive realism theory. The "reversal cost" is the key variable that turns a weak army into a diplomatic asset.
