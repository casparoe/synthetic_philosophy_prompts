answer: |-
  This is an exceptionally sharp set of observations. You have identified exactly the fault lines where the philosophy of computer science cracks under the weight of its own success. The confusion you and your roommate are experiencing isn't a failure of understanding on your part; it is a reflection of the fact that the "Church–Turing Thesis" (CTT) is actually a bundle of three distinct claims that are often conflated in undergraduate pedagogy.

  To answer your question directly: The practice you are observing presupposes a **hybrid view**. It treats the basic thesis as a *conceptual analysis* (about what "algorithm" means) when doing theory, but slides into treating it as an *empirical claim* (about what the universe allows) when dismissing hypercomputation.

  Here is a breakdown of what is actually going on, why the asymmetry exists, and how to evaluate your roommate's physics intuition.

  ### 1. Disambiguating the "Thesis"
  The first step to resolving the bug is to separate the CTT into three distinct layers. Your course is likely sliding between them without signaling the transition.

  1.  **The Mathematical Equivalence (Theorem):** Turing Machines, Lambda Calculus, Register Machines, and Recursive Functions all define the exact same class of functions. This is provable, mathematical fact. It tells us that the *formalism* is robust.
  2.  **The Conceptual Thesis (Gandy/Sieg View):** This claims that the mathematical class above captures the informal notion of "effective calculability" (what a human can do following a fixed set of rules with paper and pencil). This is a philosophical claim about the *concept* of an algorithm.
  3.  **The Physical Thesis (Deutsch View):** This claims that any function computable by a physical system in the universe is computable by a Turing Machine. This is an empirical claim about physics.

  **Where your course is buggy:** It uses the *Mathematical Equivalence* (1) as evidence for the *Conceptual Thesis* (2), but then uses the *Physical Thesis* (3) to dismiss hypercomputation.

  ### 2. The Hypercomputation Objection (Your Roommate's Point)
  Your roommate is right that physics uses idealizations (point masses, frictionless planes). So why is a "Zeno machine" (doing infinite steps in finite time) or an "Analog Real machine" (measuring infinite precision) dismissed differently than a frictionless plane?

  The distinction lies in **information density**.

  *   **Standard Idealizations:** A "frictionless plane" ignores specific forces, but it doesn't require storing infinite information in a finite volume. You can simulate a frictionless plane on a computer to arbitrary precision.
  *   **Hypercomputation Idealizations:** A machine that measures a continuous quantity to infinite precision requires distinguishing between two states that are infinitely close together. In modern physics (specifically thermodynamics and quantum information theory), distinguishing states requires energy. To distinguish infinite states in a finite region requires infinite energy or implies infinite information density.
  *   **The Bekenstein Bound:** There are physical limits to how much information can be stored in a given volume of space. A hypercomputer that relies on infinite precision violates these bounds.

  So, when CS theorists say "that's not physically realizable," they aren't just saying "it's inconvenient." They are saying "it violates the information-theoretic constraints of our universe."

  **Verdict:** Your roommate is correct that we idealize, but incorrect that *all* idealizations are equal. Hypercomputation requires idealizations that break the link between physical state and distinguishable information.

  ### 3. The Asymmetry: Computability vs. Complexity
  You asked: *Is the asymmetry defensible? The base thesis is untouchable, but the efficiency thesis (Extended CTT) is empirical.*

  **Yes, this asymmetry is defensible.** Here is why:

  *   **Basic CTT (What is computable?):** This is about **topology/connectivity**. It asks, "Is there a path of rule-following steps from input to output?" If you change the rules of what counts as a "step" (e.g., allowing an oracle that solves the Halting Problem), you aren't discovering a new computer; you are changing the definition of "algorithm." If you allow magic steps, you leave the realm of *effective procedures*. Thus, the basic thesis is treated as constitutive of the definition of computation.
  *   **Extended CTT (What is efficiently computable?):** This is about **metric/resources**. It asks, "How many steps does the path take?" This depends entirely on the physical substrate. In a classical world, factoring takes exponential time. In a quantum world, it takes polynomial time (BQP). The *path* exists in both, but the *cost* differs.

  Therefore, it makes sense to treat the existence of the path (Computability) as a logical/conceptual necessity, while treating the length of the path (Complexity) as an empirical contingency of physics.

  ### 4. Evaluating Your Roommate's "Physical Quantity" Analogy
  Your roommate suggests CTT is like **temperature** or **energy**: a term fixed by its role in a network of claims, neither purely definitional nor purely empirical.

  This is actually a very sophisticated philosophical position (often associated with functionalism).
  *   **Is it right?** For the **Physical CTT**, yes. "Computable" is being operationalized as "what a physical system can do." If we discover a physical process that computes a non-Turing-computable function, we must either update physics or update our definition of computation.
  *   **Is it too strong?** For the **Conceptual CTT**, yes. In the context of logic and proofs, "computable" is closer to "provable." It is about the limits of formal reasoning, not the limits of matter.

  **The Practice's Commitment:** The practice of CS is quietly committed to the view that **Conceptual CTT is the default**, but **Physical CTT is the constraint**. We assume they coincide. If they diverge (e.g., hypercomputation is possible), CS theory remains valid as a study of *effective procedures*, but it ceases to be a complete study of *physical information processing*.

  ### 5. What Would Change if We Swapped the Story?
  You asked what would concretely change in CS practice if we adopted a different philosophical story.

  *   **If we treated Basic CTT as purely empirical:**
      *   **Uncomputability Results:** We would have to state them as "Uncomputable given current physical laws." The Halting Problem would become "Physically Undecidable."
      *   **Hypercomputation:** Proposals wouldn't be dismissed as "category errors"; they would be treated as experimental hypotheses. We would build detectors for hypercomputational effects.
      *   **Impact:** Very little would change in daily coding or standard theory, but the *interpretation* of limits would shift from logical impossibility to physical impossibility.

  *   **If we treated Extended CTT (Efficiency) as definitional:**
      *   **Quantum Computing:** We would have to say quantum computers are "not real computers" or "cheating" because they violate the polynomial thesis.
      *   **Crypto:** Cryptographers would be on much shakier ground. Currently, they say "This is secure because factoring is hard." If efficiency is definitional, and quantum makes factoring easy, then "secure" loses its meaning.
      *   **Impact:** This would be disastrous. It is good that complexity is treated as empirical.

  *   **Current Practice (The Hybrid):**
      *   **Crypto:** Cryptographers *are* already nervous. They explicitly state security relies on "computational assumptions" (e.g., P ≠ NP, or hardness of factoring). They know if the Physical CTT breaks (e.g., large-scale quantum computers), their protocols break.
      *   **Uncomputability:** Theorems are stated mathematically ("No TM can decide..."). The implication "No physical device can decide..." is added as a corollary based on the Physical CTT.

  ### 6. Summary: How to Resolve the Bug
  The reason you feel the course is inconsistent is that it is. It wants the **necessity** of math (for the theorems to feel solid) and the **applicability** of physics (for the theorems to matter to engineers).

  Here is the most coherent way to hold the bundle together, which resolves your specific frustrations:

  1.  **The Convergence Evidence:** The fact that TMs, Lambda Calculus, etc., agree is evidence for the **Conceptual Thesis**. It shows we have captured the robust core of "rule-following," independent of specific hardware.
  2.  **The Hypercomputation Dismissal:** This relies on the **Physical Thesis**. It is an empirical claim that our universe does not support the energy/information density required for hypercomputation. Your roommate is right to question the *certainty* of this, but wrong to equate it with frictionless planes (which don't violate information bounds).
  3.  **The Asymmetry:** This is justified because **Computability is about possibility** (modal logic), while **Complexity is about cost** (physics). Possibility is harder to change than cost.
  4.  **The Status of the Claim:** The CTT is a **bridge principle**. It connects the mathematical world (TMs) to the physical world (computers). Like all bridge principles (e.g., "Light is electromagnetic waves"), it is supported by evidence but not mathematically provable.

  **Advice for your course:**
  When you write exams, treat the Basic CTT as a definition/axiom (you can't prove a TM can't do X). When you talk to your roommate, treat the Physical CTT as an empirical hypothesis (it holds *as far as we know*). The tension you feel is the friction between the *logic* of computation and the *physics* of computation. Recognizing that distinction is the sign of a good theorist.
