answer: |-
  **Elena:** The Letter Spirit problem exposes the core issue. To generate a font, the program must grasp what remains constant while the style varies. I maintain there is a style-invariant schema for 'a'. A relational description: a closed counter, an aperture, a stem. Style is merely parameters—stroke weight, serif presence, x-height—applied to that skeleton.

  **Marcus:** But that skeleton is elusive. Take your single-storey 'a' in geometric sans versus the double-storey in old-style serif. Visually, they share almost nothing. One is a circle and a line; the other is a loop and a spine. If your schema is abstract enough to cover both, isn't it so thin it fails to distinguish 'a' from 'd' or 'o' without context?

  **Elena:** It distinguishes them relationally. In 'a', the stem is on the right of the bowl; in 'd', it's on the left. In 'o', there is no stem. The topology holds. The single-storey and double-storey are merely stylistic variations on the same structural theme. You're conflating the instance with the type.

  **Marcus:** I'm arguing the type *is* the collection of instances. There is no sharp structure, only a similarity gradient. We call them both 'a' because they occupy the same slot in a system we've learned. If you showed a child the single-storey glyph in isolation, they might call it 'd'. The identity isn't intrinsic; it's anchored by contrast with 'o', 'e', 'g'.

  **Elena:** If contrast alone determined identity, any shape could be an 'a' if you labeled it so. But there are limits. Consider the blackletter 'a'. To an untrained eye, it looks like an 'o' or a 'u'. Yet we identify it. Why? Because traces of the schema survive—the counter, the flow of the stroke. The schema is warped by style parameters, but it persists.

  **Marcus:** In blackletter, the schema is so warped it's unrecognizable without the system. You admitted it looks like 'o' or 'u'. That proves my point: membership comes in degrees and shifts with context. Without the surrounding 'b' and 'c' to establish the style's rules, that glyph fails to be an 'a'. It's a potential 'a', not an actual one.

  **Elena:** Let's test that potential. Consider the glyph I drew: a closed circle with a short tail descending on the right. In the context `c_t`, readers call it an 'a'. In isolation, they hesitate. My account says the schema is present but weak; context activates the recognition. It is always an 'a', just ambiguously so.

  **Marcus:** My account says it *becomes* an 'a' in `c_t`. In isolation, it is not an 'a'; it is a shape resembling one. Here is where we might issue conflicting verdicts. If you found that glyph in a drawer, alone, I would say it is not an 'a'. You would say it is a degraded 'a'.

  **Elena:** True. I claim the structure exists independently of the system; you claim the system confers the structure. But this bears on the generation task. To draw the rest of the alphabet, I need the schema to know what to vary. How do you generate consistency from a gradient?

  **Marcus:** By sampling from the style's distribution. I don't need a rigid schema; I need to maintain the similarity relation to the seed glyphs. But you raise a fair point about drawing versus recognizing. Does drawing an 'a' require anything that merely recognizing one does not?

  **Elena:** Yes. Recognition matches input to schema. Drawing requires inverting that process—producing output from schema while constraining style parameters. You need the rules to ensure the 'b' matches the 'a'.

  **Marcus:** I agree drawing is harder, but not because of rules. It's harder because you must actively maintain the style gradient across new shapes. Recognition is passive classification; drawing is active system-building. But on the ontological question—what makes an 'a' an 'a'—we seem to agree on most verdicts, except perhaps that isolated circle-tail.

  **Elena:** So the argument isn't merely verbal? We aren't just labeling the same cognitive process differently?

  **Marcus:** No. If we build the AI, your version searches for invariant features; mine searches for contextual similarity. They might fail on different cases. The disagreement is about the mechanism of category formation, not just the label.

  **Elena:** Then we agree: the conflict is substantive, located in how abstraction works.

  **Marcus:** Precisely. Mechanism over notation.

  \answer{substantive}, mechanism of categorization and generation
