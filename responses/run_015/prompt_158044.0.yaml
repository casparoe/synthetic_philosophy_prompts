  **Total: 20 Marks (5 Points × 4 Marks Each)**

  1.  **Lower Boundary Logic ($k=1$):** Correctly identifies that at $k=1$, the observed value must be the smaller envelope (probability 1), making switching strictly dominant.
      *   *A vs B:* A-grade explicitly states $P(\text{Small}|X)=1$; B-grade vaguely says "it's the minimum."
      *   *Common Mistake:* Assuming 50/50 probability even at the minimum value.

  2.  **Upper Boundary Logic ($k=20$):** Correctly identifies that at $k=20$, the observed value must be the larger envelope (probability 0 of being small), making switching strictly dominated.
      *   *A vs B:* A-grade calculates the negative expected return; B-grade just says "don't switch."
      *   *Common Mistake:* Failing to recognize $2^{20}$ as a hard cap, treating it as an interior point.

  3.  **Global Expectation Calculation:** Demonstrates that the expected gain from switching sums to zero across all possible pairs, proving no global advantage exists.
      *   *A vs B:* A-grade shows the summation logic; B-grade asserts it vanishes without justification.
      *   *Common Mistake:* Claiming the paradox remains because most interior points favor switching.

  4.  **Statistical Resolution Articulation:** Clearly explains that a proper, bounded prior fixes the integrability issue, making the expectation well-defined.
      *   *A vs B:* A-grade links proper priors to finite expectations; B-grade conflates "proper" with "bounded."
      *   *Common Mistake:* Thinking any proper prior resolves it without checking bounds.

  5.  **Decision-Theoretic Distinction:** Distinguishes between fixing the prior (statistical) vs. rejecting the conditioning step on observed values (decision-theoretic).
      *   *A vs B:* A-grade notes conditioning is valid here *because* the prior is proper; B-grade treats them as identical solutions.
      *   *Common Mistake:* Arguing conditioning is always illegitimate regardless of the prior.
