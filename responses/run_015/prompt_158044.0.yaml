  **Exam Question**

  Welcome to the final. You know the Two-Envelope Paradox: you pick an envelope, see amount $X$, and are told the other contains $2X$ or $X/2$ with equal probability. The standard argument says you should always switch because $E[\text{other}] = 1.25X$. Usually, we resolve this by noting no uniform prior exists over all positive reals.

  Today, we fix that. Imagine a proper prior. There are 19 possible pairs of envelopes. The smaller amount in pair $i$ is $2^i$, and the larger is $2^{i+1}$, for $i = 1$ to $19$. So the possible amounts in play range from $2^1$ to $2^{20}$. A pair is picked uniformly at random, then one envelope is given to you. You open it and observe $2^k$.

  Your task is to write a short essay addressing three specific points. First, work through whether the usual switch argument applies given this proper, bounded prior—specifically reasoning about the conditional expectation at the boundary cases $k=1$ and $k=20$. Second, identify whether the paradox vanishes here because the prior is proper, or whether there's still a hidden mistake in conditioning on the observed value. Third, articulate the difference between a statistical resolution (fixing the prior) and a decision-theoretic resolution (rejecting the conditioning step as illegitimate regardless of prior).

  Keep your reasoning tight. You don't need outside sources or citations; just use generic labels like "the standard argument" or "the conditioning move." The goal is to show you understand where the probability mass goes when the bounds hit. Don't just recite the standard solution; show the math for the bounds. Good luck.

  ***

  **Model Answer**

  In this bounded setup, the standard argument fails at the edges, which resolves the paradox globally. Let's analyze the conditional probabilities. We observe $X = 2^k$. The prior probability of any pair $i$ is $1/19$. The probability of observing a specific value depends on whether it's the small or large member of a pair.

  For interior values ($1 < k < 20$), $2^k$ appears as the large amount in Pair $k-1$ and the small amount in Pair $k$. Since pairs are uniform, these scenarios are equally likely. Thus, $P(\text{Small} | X=2^k) = 0.5$. The expected value of the other envelope is $0.5(2^{k+1}) + 0.5(2^{k-1}) = 1.25(2^k)$. Here, the standard argument holds: switching looks profitable.

  However, the boundaries break this symmetry. At $k=1$, we observe $2^1$. This value only exists as the smaller amount in Pair 1. It cannot be the larger amount of a Pair 0 (which doesn't exist). Therefore, $P(\text{Small} | X=2^1) = 1$. The other envelope must contain $2^2$. The expected value of switching is $2X$. You should switch.

  At $k=20$, we observe $2^{20}$. This value only exists as the larger amount in Pair 19. It cannot be the smaller amount of a Pair 20. Therefore, $P(\text{Small} | X=2^{20}) = 0$. The other envelope must contain $2^{19}$. The expected value of switching is $0.5X$. You should not switch.

  Does the paradox vanish? Yes. While switching looks beneficial for almost all $k$, the loss at $k=20$ exactly offsets the gains elsewhere. The overall expected gain from switching is zero when averaged over the prior distribution of pairs. The paradox vanishes because the prior is proper and bounded; the "always switch" conclusion relied on an impossible uniform prior over an infinite range.

  This highlights the difference between statistical and decision-theoretic resolutions. A statistical resolution fixes the prior (as we did here), showing that with a proper distribution, the expected gain sums to zero. A decision-theoretic resolution argues more fundamentally that conditioning on the observed value $X$ is illegitimate if the prior is improper, because the posterior probabilities are undefined. Here, because the prior is proper, conditioning is valid, but the boundary conditions prevent the infinite regress that fuels the paradox. The mistake in the standard paradox isn't just the prior; it's assuming the conditional probability remains $0.5$ at the bounds where the support of the distribution ends.

