answer: |-
  Here is the spec sheet for a normative theory of subsidiarity, written for a backend engineer.

  ### 1. The Impossibility Theorem (The Political CAP)

  You asked if there is a political analog to the CAP theorem. **Yes.**

  In distributed systems, you cannot simultaneously maximize Consistency, Availability, and Partition Tolerance. In multi-level governance, you cannot simultaneously maximize **Uniformity**, **Autonomy**, and **Effectiveness**.

  *   **Uniformity:** Rights, standards, and laws are identical across all regions (e.g., federal civil rights, single market rules).
  *   **Autonomy:** Local units can diverge from the center to match local preferences (e.g., Swiss canton tax rates, US state laws).
  *   **Effectiveness:** The system can solve problems that cross boundaries (e.g., climate change, pandemic response, economic stabilization).

  **The Constraint:** You can optimize for two, but the third degrades.

  1.  **Uniformity + Effectiveness = Low Autonomy.** (e.g., Unitary State or highly centralized Federation). The center dictates rules to solve cross-border issues. Local variation is crushed.
  2.  **Autonomy + Effectiveness = Low Uniformity.** (e.g., Confederation). Local units cooperate voluntarily to solve big problems, but they retain the right to opt-out or implement differently. Rights vary by region.
  3.  **Uniformity + Autonomy = Low Effectiveness.** (e.g., Gridlocked Federation). Everyone has equal rights and local rule, but the center lacks the authority to enforce solutions on cross-border externalities.

  **Verdict:** Strict uniform rights across regions and real local self-rule are **jointly unsatisfiable** at maximum intensity when facing cross-border problems. A normative theory must admit this trade-off. If a theory claims to maximize all three, it is buggy.

  ---

  ### 2. Desiderata for a Normative Theory of Subsidiarity

  To be adequate, a theory must define the logic for allocating power. Here are the criteria, marked by necessity.

  #### Criterion 1: The Allocation Heuristic (Non-Negotiable)
  *   **Definition:** The theory must provide a decision procedure for *when* power moves up a level.
  *   **Reasoning:** "Lowest effective level" is vague. Effective at what? Cost? Moral rights? Speed?
  *   **Requirement:** It must distinguish between **efficiency-based subsidiarity** (who can do it cheaper/faster?) and **rights-based subsidiarity** (who is morally entitled to decide?).
  *   **Why Non-Negotiable:** Without this, you cannot explain why the EU handles trade (efficiency/market access) but Germany handles education (cultural rights). If the theory treats all power as fungible, it fails to model reality.

  #### Criterion 2: Competence-Competence (Non-Negotiable)
  *   **Definition:** Who decides who decides? (i.e., Who adjudicates disputes over jurisdiction?)
  *   **Reasoning:** In distributed systems, this is consensus. In politics, if Region A and the Center disagree on who has authority, there must be a resolver (Supreme Court, Constitutional Court, ECJ).
  *   **Requirement:** The theory must specify if the arbiter is neutral (judicial) or political (negotiated).
  *   **Why Non-Negotiable:** If there is no mechanism to resolve boundary disputes, the system partitions (civil war or secession). A theory of governance without a dispute resolver is just a suggestion.

  #### Criterion 3: The Default State (Non-Negotiable)
  *   **Definition:** Where does residual power lie?
  *   **Reasoning:** This addresses your EU Conferral vs. US Federalism question.
      *   **EU (Conferral):** Power lies with States; Center only has what is explicitly granted.
      *   **US (10th Amend vs. Supremacy):** Power lies with States *on paper*, but federal interpretation often claims residual authority via "Commerce" or "Necessary and Proper."
  *   **Requirement:** The theory must justify the default bias. Is liberty maximized by local exit options (Default = Local) or by uniform rights protection (Default = Center)?
  *   **Why Non-Negotiable:** This determines the system's stability characteristics. A theory that doesn't define the default state cannot explain why Swiss cantons have tax autonomy (Default = Local) while EU states must follow directives (Default = Local, but *Effectiveness* overrides via treaty).

  #### Criterion 4: Legitimacy Propagation (Negotiable)
  *   **Definition:** Does democratic accountability need to exist at every tier?
  *   **Reasoning:** You asked about technocracy.
      *   **Strict View:** Every level exercising coercive power needs direct elections (EU Parliament struggles here).
      *   **Delegated View:** Upper levels can be technocratic/indirect if they are agents of the lower levels (e.g., US Senate originally appointed by state legislatures; EU Commission appointed).
  *   **Requirement:** The theory must explain how legitimacy flows up. Is it derived (from the people) or delegated (from the states)?
  *   **Why Negotiable:** Systems function with technocratic upper tiers (Central Banks, EU Commission), but they suffer from "legitimacy debt." A theory can allow this, but it must account for the risk of instability.

  #### Criterion 5: Solidarity Mechanism (Negotiable)
  *   **Definition:** Resource transfer between rich and poor regions.
  *   **Reasoning:** If local autonomy is high (Swiss Cantons), rich regions get richer. If Uniformity is high (EU Single Market), poor regions need transfers to compete.
  *   **Requirement:** Does the theory require fiscal equalization?
  *   **Why Negotiable:** The US has low formal equalization (states go bankrupt). Germany/EU has high equalization. A theory of *subsidiarity* can exist without this, but a theory of *federal stability* usually needs it.

  ---

  ### 3. Addressing Your Specific Cases

  **1. Swiss Cantons (Tax Autonomy) vs. EU Member States (Directives)**
  *   **The Difference:** This is not just legal detail; it is a difference in the **Allocation Heuristic**.
  *   **Switzerland:** Optimizes for **Autonomy**. Tax competition is a feature, not a bug. The center is weak.
  *   **EU:** Optimizes for **Uniformity/Effectiveness** in the market. Directives exist to prevent regulatory arbitrage (race to the bottom).
  *   **Theory Test:** An adequate theory must explain why *market integration* triggers a shift up in power, while *cultural administration* stays down. If the theory says "always local," it fails the EU case. If it says "always uniform," it fails the Swiss case.

  **2. Democratic Accountability at Every Tier**
  *   **Verdict:** Not strictly required, but creates a stability risk.
  *   **Reasoning:** You can have a technocratic tier (e.g., European Central Bank) if its mandate is narrow and strictly defined (like a microservice with a specific API). If the technocratic tier expands its scope (scope creep), legitimacy crashes.
  *   **Seminar Take:** You can argue that upper tiers *can* be technocratic, provided their **Interface** (mandate) is strictly limited by the lower tiers.

  **3. EU Conferral vs. US Cooperative Federalism**
  *   **Is it a hard requirement?** No, it is an implementation detail of the **Default State**.
  *   **The Concept:** Both are attempts to solve the same race condition: "Who has the lock on this policy?"
      *   **Conferral:** Lock is held by States; Center requests access.
      *   **Cooperative:** Lock is shared; Center has master key for "national interest."
  *   **Seminar Take:** Don't get bogged down in the legal mechanism. Focus on the **direction of flow**. A normative theory must justify *why* the flow goes one way or the other. Is the goal to protect minorities (requires Center) or protect local preference (requires States)?

  ---

  ### 4. Summary for the Seminar

  If you want to sound like you understand the architecture, make these three points:

  1.  **The Trilemma:** State clearly that Uniformity, Autonomy, and Effectiveness form a trilemma. The US, EU, and Switzerland are just different points on this triangle. The US leans Uniformity/Effectiveness; Switzerland leans Autonomy; the EU is trying to balance all three and suffering latency (decision paralysis).
  2.  **Subsidiarity is not Decentralization:** Decentralization is a topology (where the nodes are). Subsidiarity is a routing protocol (how packets/decisions move). A system can be decentralized but violate subsidiarity (if local units are forced to do things they can't handle).
  3.  **The "Who Decides" Problem:** The most critical failure point in multi-level governance is not the allocation of power, but the **adjudication of boundaries** (Competence-Competence). If the Supreme Court (US) or ECJ (EU) is seen as biased toward the Center, the lower tiers will attempt to partition (secession/Brexit).

  **Final Answer to your "Jointly Unsatisfiable" question:**
  Yes. You cannot have maximum local self-rule and maximum uniform rights simultaneously when facing cross-border externalities. One must yield. The US yields local rule (Civil Rights Act overrides state law). The EU yields uniformity (some directives allow "gold-plating" or opt-outs). Switzerland yields effectiveness (hard to pass nationwide reforms).

  A normative theory that promises all three is selling vaporware.
