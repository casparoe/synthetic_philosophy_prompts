prompt: |-
  ok so im a backend engineer with basically zero formal philosophy training — took one ethics course in college and mostly remember the trolley problem — and im trying to prep for a seminar im auditing on multi-level governance. im stuck on subsidiarity and federalism: the US, Germany, Switzerland, and the EU all seem to split power differently, but i cant tell if thats just legal detail or if theres a deeper conceptual problem. i want you to lay out the desiderata that a normative theory of subsidiarity has to meet to count as actually adequate. like, what cases must it get right? does it need to explain why Swiss cantons have tax autonomy but EU member states cant just ignore directives? does democratic accountability have to exist at every tier, or can some levels be technocratic? and heres the weird analogy that keeps bugging me: in distributed systems theres the CAP theorem — consistency, availability, partition tolerance — pick two. is there a political analog? can a system have both strict uniform rights across regions and real local self-rule, or are those jointly unsatisfiable? also, is explaining the difference between EU conferral and US cooperative federalism a hard requirement, or just a camp preference? please map out each criterion with the reasoning behind it, mark which are non-negotiable and which are negotiable, and if some subset is impossible together say so — thats the part i care about most. dont give me a reading list or citations, i wont check them, and i probably misspelled conferral but you get it.
