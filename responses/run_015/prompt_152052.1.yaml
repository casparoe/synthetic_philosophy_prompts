      *   **K's Position:** Substrate-causal closure. No distinct energy pathway = no downward causation. Simmballs are explanatory correlates, not causes. Focus on counterfactual dependence and dynamical closure.
      *   **L's Position:** Structural specific claim. State-space topology is constrained by simmball stability conditions. Substrate trajectories are channeled by symbolic invariants. Introduces the "perturbation-invariance test."
      *   **Interaction:** Real back-and-forth, not parallel monologues. K challenges "channeling" vs. "robust supervenience." L argues invariants are defined over symbolic variables, not physical ones (explanatory non-redundancy).
