      *   *The Problem:* If the fluid's physics determines everything, does the whirlpool *do* anything, or is it just a description of the fluid moving?
      *   *K's Argument:* Physics is closed. If you say the whirlpool moves the water, you're counting the water's momentum twice.
      *   *L's Argument:* The *shape* of the possibility space (topology) depends on the symbolic structure. If you poke the water (perturb), the whirlpool reforms (invariance). This shows the structure has a grip on the physics.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Establish the setting and the core tension. K starts with the closure argument.
