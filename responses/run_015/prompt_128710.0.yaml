answer: |-
  **What they should walk out feeling**
  They should feel the cognitive friction shift. In Round 1, they should feel the sting of world-selection (Skinnerian): wrong moves hurt. In Round 2, relief that errors are cheap (Popperian): the filter moved inward. But crucially, in Round 3, they should feel their *ideas* change. The tool shouldn't just check their work; it should suggest moves they wouldn't have imagined. They need to leave convinced that Gregorian minds aren't just smarter Skinnerians; they are running different software installed by others. The discomfort of using a tool designed for someone else's problem is the point.

  **Setup and materials**
  Six tables of three students. Each table needs: a deck of 50 cards (each has a common word printed on it), 20 poker chips (tokens), scratch paper, pencils, and a sealed "Gregorian Kit" folder. The Kit contains: a laminated "Vowel-Count Wheel" (labeled "Last Year's Key"), a blank "Alphabet Grid," and a sheet of annotated notes from a previous class (mostly discussing vowel patterns). You need a projector for timers and a whiteboard. Assign the student who knows Dennett as the "Board Scribe" before class starts; give them a marker and tell them to wait for cues.

  **The three rounds, as handed to students**
  **Goal:** Build the longest valid sequence of cards. The Rule is constant across all rounds.

  **Round 1 (Skinnerian): 15 Minutes**
  *   **Constraint:** No writing, no talking.
  *   **Action:** Place a card on the table. The TA says "Yes" (keep it) or "No" (discard it).
  *   **Cost:** Each "No" costs 1 token. If you run out of tokens, your table is dead.
  *   **Strategy:** You must learn the rule by acting on the world. Consequences are real.

  **Round 2 (Popperian): 20 Minutes**
  *   **Constraint:** You may write hypotheses on paper. You may propose sequences to the TA without playing cards.
  *   **Action:** Write a rule. Ask TA: "Would [Card A] -> [Card B] work?"
  *   **Cost:** Errors cost paper space and time, not tokens. Tokens from Round 1 carry over.
  *   **Strategy:** You may simulate outcomes before committing. Kill bad ideas in your head or on paper, not in the world.

  **Round 3 (Gregorian): 25 Minutes**
  *   **Constraint:** Open your Gregorian Kit. You must use at least one artifact from the folder to justify your moves.
  *   **Action:** Use the tools to generate or validate sequences. You may pass your Kit to the next table after 12 minutes.
  *   **Cost:** Time is the only cost. Tokens are safe.
  *   **Strategy:** Use the imported hardware. Note: The Kit contains legacy tools from previous groups. Some may be misleading.
  *   **Culture:** If you pass the Kit, add one note to the annotation sheet for the next group.

  **The hidden rule and the scoring**
  **The Rule:** Cards must be played in alphabetical order of the *second letter* of the word (e.g., "C**a**t" -> "D**o**g" is valid; "C**a**t" -> "B**i**g" is invalid).
  **Scoring:** 1 point per card in the final valid sequence. minus 1 point per token lost (Round 1). Round 3 usually wins because the Alphabet Grid in the Kit makes second-letter sorting trivial, despite the distracting Vowel-Count Wheel. The Wheel is the "mismatched crane"—it works for last year's rule but slows this year's. To ensure Round 3 wins, the Alphabet Grid is color-coded to highlight second letters, making the pattern pop out visually if they ignore the Wheel. The "legacy notes" warn against ignoring the Wheel, creating social friction they must overcome.

  **Debrief**
  (350 words)
  Gather the class. Ask the Board Scribe (your expert student) to write "Darwinian, Skinnerian, Popperian, Gregorian" on the board as you speak. Do not let them define the terms yet; let them label the *experience*.

  Start with Round 1. "Where did the selection happen?" In the world. You lost tokens. That is Skinnerian conditioning. The Darwinian layer is your biological capacity to be there at all, but the learning was operant. The generator was your blind intuition; the filter was reality.

  Move to Round 2. "What changed?" The filter moved. You could kill hypotheses on paper. But did you think *new* thoughts? Mostly no. You were still generating candidates using the same brain hardware, just saving them from death. This is the Popperian shift: selection inside the head.

  Now Round 3. "Who generated the hypothesis that 'second letter' mattered?" If you used the Grid, the tool did. The Grid affords sorting by alphabet; the Wheel affords counting vowels. When you picked up the Grid, you outsourced the generation of candidates to a artifact designed by someone else. That is Gregorian.

  Ask the Scribe: "Did the tools feel neutral?" They shouldn't. The Wheel was a trap. This is the sting of the Gregorian mind: we run cranes built for other environments. You won in Round 3 not because you were smarter, but because your generator was rebuilt by the Kit.

  Finally, address the distinction. "Many think Dennett's ladder is about better filters." Point to Round 2 vs 1. "That was better filtering." Point to Round 3. "That was a new generator." The Gregorian mind doesn't just filter better; it thinks thoughts it couldn't physically generate alone. The Scribe should now define the terms based on this mapping. End by asking: "What tools are you using right now that limit what you can think?"

  **What will go wrong**
  **Timing:** Round 1 often drags as students fear losing tokens. **Fix:** Hard stop at 15 minutes. Announce "30 seconds" warnings aggressively.
  **Tool Rejection:** Students might ignore the Kit in Round 3, treating it like Round 2. **Fix:** Make the rule *require* tool usage for full points, or make the rule impossible to solve quickly without the Grid.
  **The Expert:** The knowledgeable student might spoil the vocabulary early. **Fix:** Give them a secret role. Tell them beforehand: "You know the theory. Your job is to translate the class's experience into those words *only* when I ask. If you speak before the debrief, you break the experiment." This gamifies their silence.
  **Confusion on Rule:** If the rule is too hard, R1/R2 yield no data. **Fix:** Test the rule beforehand. If they stall in R1, give a hint: "Look inside the word."

  **What this can't show**
  This game compresses evolutionary time into 75 minutes. It cannot show how the Gregorian tools *evolved*. The Kit appears magically; in reality, cultural artifacts accumulate over generations. It also simplifies the social aspect; passing the kit is a pale shadow of language acquisition or education. Finally, it risks implying a strict hierarchy where Gregorian is "best." In reality, we are all mixed creatures; sometimes Skinnerian reflex is faster than Gregorian analysis. You must say aloud: "The ladder isn't about replacing the lower rungs. You are still Darwinian animals running Skinnerian habits, occasionally patched by Gregorian tools." The game shows the structural difference, not the total replacement of self.
