answer: |-
  # BEDSIDE MIND TAXONOMY (BMT) PROTOCOL
  **For:** Disorders of Consciousness (DoC) Assessment  
  **Time:** 30 Minutes Max | **Operator:** Any Trained Clinician  
  **Goal:** Distinguish reflex from learning, and learning from thinking.

  ---

  ## PART 1: THE PROCEDURE (Laminated Side A)

  **RULE 1: THE STOP CONDITION.**  
  Proceed sequentially. If the patient fails to show evidence at Level *N*, **STOP**. Do not test Level *N+1*. Record "No evidence above Level *N*." Do not infer higher capacity from lower-level data.

  **RULE 2: THE REPETITION LIMIT.**  
  To prevent *manufacturing* consciousness via conditioning:  
  *   Max **3 repetitions** of any command per session.  
  *   Max **2 sessions** using the *same* command before switching to a novel command.  
  *   *Warning:* If performance improves only after >5 repetitions across days, this is likely **Skinnerian Conditioning**, not recovery of volition. Flag as "Training Effect."

  ### LEVEL 1: DARWINIAN (Hardwired Reflex)
  *   **Probe:** Sudden loud noise (clap), bright light (pupil), noxious stimulus (nail bed pressure).
  *   **Positive Evidence:** Startle, blink, withdrawal. Consistent across trials without habituation.
  *   **Negative Evidence:** No movement, or movement delayed/inconsistent.
  *   **Stop Rule:** If no reflex response, stop. (Coma/Brain Death protocols apply).
  *   **Family Statement:** "The body's automatic safety systems are working."

  ### LEVEL 2: SKINNERIAN (Conditioned Association)
  *   **Probe:** Simple command paired with immediate physical guidance/reward (e.g., "Squeeze" + hand squeeze).
  *   **Positive Evidence:** Response rate increases over **3 trials** within one session.
  *   **Crucial Check:** Does the response extinguish if the reward stops? (Extinction test).
  *   **Stop Rule:** If no change in response rate based on consequence, stop at Level 1.
  *   **Family Statement:** "The brain is learning connections between sound and movement, like a reflex being taught."

  ### LEVEL 3: POPPERIAN (Internal Simulation)
  *   **Probe:** **Novel** command with no prior rehearsal and no immediate physical guidance (e.g., "Touch your ear" when only "Squeeze" was trained). OR Inhibition task ("Squeeze" then "Stop" before movement completes).
  *   **Positive Evidence:** Correct response on **first or second trial** of a *new* command. Ability to inhibit a prepotent reflex.
  *   **Crucial Check:** **Novelty Probe.** The instruction must not have been repeated >3 times in the patient's lifetime recently.
  *   **Stop Rule:** If they only do what has been heavily rehearsed (see Rule 2), stop at Level 2.
  *   **Family Statement:** "They can think about an action before doing it, not just react."

  ### LEVEL 4: GREGORIAN (Cultural Tools)
  *   **Probe:** Use of symbolic tools or language requiring external knowledge (e.g., "Show me the comb" among 3 objects; "Nod if you are in pain").
  *   **Positive Evidence:** Correct use of object or symbolic gesture without physical prompting.
  *   **Crucial Check: Scaffolding Strip.**  
      1.  Change the voice (Family → Stranger).  
      2.  Change the phrasing ("Squeeze" → "Grip my hand").  
      3.  Remove the object (Ask for "comb" without showing it).  
      *If response fails when scaffolding changes, revert to Level 3.*
  *   **Family Statement:** "They are using memories and knowledge from before the injury to interact."

  ---

  ## PART 2: DECISION HAND-OFFS (Laminated Side B)

  **WHEN TO HAND OFF TO HUMAN JUDGMENT:**
  1.  **Conflict:** Bedside exam says Level 2, but instrument (EEG/fMRI) says Level 4.
  2.  **Values:** Data is Level 2 (Conditioned), but family asks about "personhood" or "suffering."
  3.  **Uncertainty:** Response is inconsistent (1/10 trials) but stakes are high (withdrawal of care).

  **WHAT TO SAY TO FAMILIES (Script):**
  *   **DO SAY:** "We test what kind of learning the brain can do right now. Right now, we see evidence of [Level X] learning."
  *   **DO SAY:** "This tells us what systems are working, not how much 'self' is present."
  *   **DO NOT SAY:** "He is not in there." (The test measures *capacity*, not *presence*).
  *   **DO NOT SAY:** "He will never wake up." (The test measures *current state*, not *prognosis*).
  *   **ANSWER TO "IS HE STILL IN THERE?":** "We can tell if his brain can process [Level X] information. We cannot measure the subjective experience of being him. A brain that can learn [Level X] has more pathways to reach him than one that cannot."

  **EPISTEMIC STATUS & LIMITATIONS:**
  *   **Settled:** Reflexes (Darwinian) are distinct from Conditioned responses (Skinnerian). Conditioning requires repetition.
  *   **Contested:** Whether these levels are strictly cumulative (some argue you can have Language [Gregorian] without Planning [Popperian]). Whether this taxonomy measures *consciousness* or just *complexity*.
  *   **Limit:** This protocol cannot detect "locked-in" cognition if motor output is fully severed. It cannot measure pain qualia, only avoidance behavior.

  ---

  ## CASE RUNS

  ### CASE A: 54M, Anoxic, 6 Months
  *   **Data:** Head turn to loud noise (consistent). No response to name.
  *   **Protocol Run:**
      *   Level 1 (Darwinian): **PASS** (Startle/Orienting reflex).
      *   Level 2 (Skinnerian): **FAIL** (No command following, no conditioning possible).
      *   *Stop Rule Applied.*
  *   **Result:** **Level 1 Only.**
  *   **Unwelcome Truth:** The team wants to see "progress." The protocol indicates no learning is occurring. The head turn is hardwired, not evidence of a mind engaging with the world.
  *   **Family Statement:** "His brain stem is protecting him from sudden changes, but we see no evidence yet that he is learning from us or recognizing us."

  ### CASE B: 22F, TBI, 3 Months
  *   **Data:** Squeeze command. Session 1: 1/10. Session 6 (after daily family/nurse drilling): 8/10.
  *   **Protocol Run:**
      *   Level 1: **PASS**.
      *   Level 2: **PASS** (Response rate increased with repetition).
      *   Level 3 (Popperian): **FAIL** (Protocol Rule 2 Violation). The improvement required >5 repetitions across days. This meets the definition of **Skinnerian Conditioning**. To pass Level 3, she must follow a *novel* command (e.g., "blink twice") on the first trial without prior drilling.
      *   *Stop Rule Applied.*
  *   **Result:** **Level 2 (Conditioned).**
  *   **Unwelcome Truth:** The ward is "delighted" by the 8/10 score. The protocol flags this as likely **testing artifact**. The assessment team trained the reflex; the patient may not have recovered volition.
  *   **Family Statement:** "She is learning to respond to that specific request because it is practiced often. We do not yet know if she can follow a new request she hasn't heard before."

  ### CASE C: 61M, Bilingual, 6 Months
  *   **Data:** Novel English instruction (followed immediately). Fails non-verbal reaching. fMRI shows command following when bedside shows nothing.
  *   **Protocol Run:**
      *   Level 1 & 2: **PASS**.
      *   Level 3 (Popperian): **MIXED** (Novel English instruction suggests Level 3/4, but failure on non-verbal reaching suggests motor/cognitive dissociation).
      *   Level 4 (Gregorian): **PASS** (Language comprehension).
      *   *Conflict:* Bedside (Level 4) vs. Motor Exam (Level 1) vs. fMRI (Level 4).
  *   **Result:** **HAND-OFF.**
  *   **Reason:** The "Scaffolding Strip" is complicated by language acquisition history (English is L2). The fMRI contradicts the motor failure. This is a values/weighting decision, not a pure fact.
  *   **Action:** Refer to Neuroethics/MD round. Do not issue a definitive Level.
  *   **Family Statement:** "We have conflicting signals. His brain understands language in the scanner, but his body cannot show us that reliably at the bedside. We cannot be certain how much control he has."

  ---

  ## EPISTEMIC STATUS & HONESTY CHECK

  **On the Taxonomy (Dennett's Framework):**
  *   **Settled:** The distinction between reflex (Darwinian) and operant conditioning (Skinnerian) is standard behavioral psychology. The risk of conditioning patients via repetitive testing is a known confound in DoC assessment.
  *   **Contested:**
      1.  **Cumulative Layers:** We assume Level 4 requires Level 3. Some theorists argue "zombie" language use (Gregorian) is possible without internal simulation (Popperian). We treat this as rare; if they use words, we assume they simulate meaning.
      2.  **Language Requirement:** We treat Language as the primary Gregorian tool. Some argue tool-use alone suffices. We prioritize language for bedside feasibility.
      3.  **Evolution vs. Architecture:** This protocol treats the taxonomy as *functional architecture* (what is the brain doing now?), not *evolutionary history* (how did the brain evolve?).

  **WHAT THIS PROCEDURE CANNOT DO:**
  1.  **It cannot answer "Is he in there?"** It answers "What kind of processing is active?" It measures the *vessel*, not the *passenger*.
  2.  **It cannot rule out pain.** A Level 1 (Darwinian) withdrawal from pain does not prove subjective suffering, but it does not rule it out. Err on the side of analgesia.
  3.  **It cannot predict recovery.** A Level 2 brain today may become Level 4 next month. Do not use this for prognosis, only for current status.
  4.  **It cannot resolve the "Locked-In" problem.** If the motor output is severed, this test returns Level 1 even if the mind is Level 4. (This is why the Case C Hand-Off exists).

  **FINAL INSTRUCTION TO TEAM:**
  If the data forces you to tell a family that the "improvement" is likely conditioning (Case B), do it. It is crueler to let them build hope on a trained reflex than to explain the mechanism of the response. If the data is ambiguous (Case C), say "We do not know." A number is not worth a lie.
