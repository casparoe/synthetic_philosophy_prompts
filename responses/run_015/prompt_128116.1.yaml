  ### Teaching Plan: Dispositions vs. Conditionals (30 Minutes)

  #### 1. Sequence and Dependencies
  You must introduce the components in this specific order. Each step creates a problem that the next step solves; reversing them will cause the audience to retreat into programming mental models.

  1.  **The Trap (Simple Conditional Analysis):** Define a disposition using the intuitive "If-Then" rule.
      *   *Why first:* You must establish the target you are about to destroy. If you start with the counter-examples, they will have no rule to compare them against.
  2.  **The Carrying Example (The "Paranoid" Glass):** Introduce the single object that embodies the disposition, the mask, and the fink.
      *   *Why second:* You need a concrete anchor before introducing abstract failure modes.
  3.  **The Mask (Extrinsic Blocker):** Show how the example fails the "If-Then" rule due to external interference.
      *   *Why third:* This is the easier counter-example. It establishes that the *manifestation* can fail while the *property* remains.
  4.  **The Fink (Intrinsic Remover):** Show how the example fails the "If-Then" rule due to the stimulus destroying the property.
      *   *Why fourth:* This is the harder concept. It relies on the distinction established in the Mask phase (Property vs. Manifestation) to show that here, the Property itself is lost.
  5.  **The Ontological Shift:** Explain why distinguishing these matters (Real Property vs. Code Construct).
      *   *Why fifth:* Only after seeing the rule fail twice can they appreciate why we need a new category ("Disposition") rather than just fixing the rule.

  ---

  #### 2. The Carrying Example: "The Paranoid Glass"
  You must use **one** object to prevent the audience from treating Finks and Masks as merely "two types of bugs."

  *   **The Object:** A pane of "Smart Glass" designed for a museum.
  *   **The Disposition:** Fragility (The disposition to shatter when struck).
  *   **The Stimulus:** A hammer strike.
  *   **The Manifestation:** Shattering.
  *   **The Mask (Included):** The glass is wrapped in a clear, shock-absorbing polymer film. The hammer strikes the film, the force is dampened, the glass does not shatter.
  *   **The Fink (Included):** The glass contains a nano-lattice that detects the specific frequency of a hammer strike and instantly hardens *before* the shattering can occur.
  *   **The Unified Scenario:** You strike the glass. It does not shatter.
  *   **What to Exclude:** Do not describe two different panes of glass. Describe **one** pane that has *both* the film and the nano-lattice.
  *   **Why this works:** The conditional "If Struck, Then Shatter" is false. But to understand *why* the glass didn't break, you must distinguish whether the capacity was blocked (Mask) or erased (Fink). If you treat them as separate cases, the audience will think, "Okay, two edge cases." By combining them, you force them to ask: "Does the disposition exist *now*?"

  ---

  #### 3. Predictable Misconceptions & Interdiction Points
  Software engineers will instinctively map these philosophical problems to patterns they know. You must head these off *before* they solidify.

  **Misconception A: Lazy Evaluation**
  *   **The Thought:** "The glass isn't breaking yet because the `shatter()` function hasn't been called or resolved."
  *   **Where to Head It Off:** **Immediately after Step 1 (The Trap).**
  *   **How:** When you define the Simple Conditional Analysis ("If S then M"), explicitly state: "This is not a promise that hasn't resolved. In a Finkish case, the promise is *revoked* by the call itself. Lazy evaluation implies the result is waiting; Finkishness implies the capacity to produce the result is deleted by the attempt."

  **Misconception B: Exception Handling / Try-Catch**
  *   **The Thought:** "The polymer film is just a `try-catch` block swallowing the exception."
  *   **Where to Head It Off:** **During Step 3 (The Mask).**
  *   **How:** When explaining the Mask, say: "In code, a catch block handles the error. In a Mask, the error (shattering) *never happens*, but the *risk* (fragility) was real. A catch block implies the code ran and failed. A Mask implies the property existed but the manifestation was physically prevented. Do not confuse prevention with recovery."

  **Misconception C: State Mutation (Boolean Flags)**
  *   **The Thought:** "The nano-lattice just flips a `isFragile` boolean to false."
  *   **Where to Head It Off:** **During Step 4 (The Fink).**
  *   **How:** When explaining the Fink, say: "If this were just a flag changing, the disposition would be a state variable. It is not. The disposition is a *causal power*. The Fink removes the power, not just the record of the power. If you refactor a disposition into a boolean flag, you lose the ability to explain *why* the change happened."

  ---

  #### 4. The End-of-Session Check
  Do not ask them to define "disposition." That tests memory, not understanding. Use this scenario to test if they view dispositions as **properties** or **constructs**.

  **The Check:**
  > "Imagine a function `processData()` that is *idempotent*. If I delete the code that checks for duplicates, but the database schema still enforces uniqueness via a constraint, is the system still idempotent? Yes or No, and **where** is the disposition located?"

  *   **Pass:** They say "Yes" and locate the disposition in the **system behavior/constraints**, not the specific function code. (They grasp that the property is real and distributed).
  *   **Fail:** They say "No" or locate the disposition strictly in the **function implementation**. (They still view it as a programming construct).

  ---

  #### 5. Technical Analogies to Refuse
  At this level, certain analogies are toxic because they reinforce the idea that dispositions are just code structures. Explicitly tell your colleagues **not** to think of dispositions as:

  1.  **"Feature Flags":** A flag is a switch we control. A disposition is a property the object *has*, regardless of our control.
  2.  **"Promises/Futures":** These imply deferred execution. Dispositions are about *capacity*, not timing.
  3.  **"Interfaces/Contracts":** These define expected behavior. Dispositions explain *causal power* (why the behavior happens), not just the signature.

  **Instruction to Speaker:** Write these three terms on the whiteboard at the start and draw a red "X" through them. Tell the room: "If you find yourself thinking in these terms, stop. We are talking about physics and metaphysics, not syntax."
