      *   **Tone/Style:** Precise, philosophical/historical rigor, no bibliographic appeals, clear boundaries between agreement and disagreement. Do not adjudicate.

  2.  **Deconstruct the Personas:**
      *   **Ferguson-style (Defender):** Focuses on modernization, rule of law, infrastructure (railways), integration into global markets, state capacity building. Acknowledges costs but argues net positive or "least bad option" compared to alternatives. Utilitarian leaning.
      *   **Tharoor-style (Critic):** Focuses on de-industrialization, drain of wealth, racial hierarchy, democratic deficit, famines as policy failures. Argues sovereignty and dignity are paramount. Deontological/rights-based leaning.
      *   **Collaboration Goal:** Find the overlap where rigorous methodology forces convergence, even if ultimate moral verdicts differ.

  3.  **Drafting Part 1: Agreed Claims:**
      *   *Constraint Check:* Must incorporate Counterfactual Cohort, Stock vs. Flow, Moral Amortization.
      *   *Historical Record:* Both must agree on *what* happened (e.g., railways were built, wealth was transferred), even if they disagree on *why* or *how good* it was.
      *   *Counterfactuals:* Agree on when a comparison is valid (e.g., comparing to contemporary Japan or Siam, not modern India).
      *   *Normative Premises:* Agree on what values need stating (e.g., utility vs. autonomy).
      *   *Drafting thought:* Need to ensure the language is neutral. Instead of "The British stole money," use "Net resource transfers occurred from the colony to the metropole." Instead of "The British civilized India," use "Administrative capacities were centralized."

  4.  **Drafting Part 2: Disagreements Table:**
      *   *Constraint Check:* Phrasing must be acceptable to the side holding the view. Mark Substantive vs. Verbal.
      *   *Content:* Where do they actually diverge?
          *   Valuation of the "Stock" (Railways: Gift or Tool?).
          *   Causality of Famines (Policy or Weather?).
          *   Moral Weight (Sovereignty vs. Development).
      *   *Drafting thought:* Ensure the Ferguson side doesn't sound like a cartoon villain and the Tharoor side doesn't sound like they deny infrastructure existed.
      *   *Verbal Disagreements:* Often about definitions (e.g., what counts as "Development").
      *   *Substantive Disagreements:* Often about weights (e.g., how much does a life lost matter vs. GDP growth).

  5.  **Drafting Part 3: Cruxes:**
      *   *Constraint Check:* Three cruxes. (a) Relevant argument, (b) Standard of resolution, (c) Predictions.
      *   *Crux 1: Railways/Legal Stock.* Is the value offset by extraction?
      *   *Crux 2: Bengal Famine.* Systemic failure vs. Exogenous shock.
      *   *Crux 3: Institutional Continuity.* Beneficial legacy vs. Path-dependent lock-in.
      *   *Drafting thought:* Make sure the "Standard of Resolution" is something both can accept (e.g., econometric analysis of growth rates, archival evidence of intent/capacity).

  6.  **Refining and Polishing (Iterative Process):**
      *   *Check Constraints:* Did I use the Counterfactual Cohort Framework in the agreements? Yes, need to make sure Claim 2 explicitly mentions cohorts.
      *   *Check Moral Amortization:* Need a specific claim agreeing that this *must* be addressed, even if they disagree on the answer.
      *   *Tone:* Is it dry enough? It needs to sound like a joint academic statement, not a debate transcript.
      *   *Clarity:* Is the distinction between Stock and Flow clear in the agreements?
