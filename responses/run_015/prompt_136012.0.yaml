  This rule states that the brain is a general-purpose learner. If the *structure* of the information matches the structure of the world (optic array, perspective, occlusion), and there is sufficient time to learn the code, the brain will integrate it as vision. Practice bridges the gap between senses (as seen in Cases 2 and 8).
