          *   Final thought: Narrative sympathy requires a thread of continuity that pure qualitative analysis misses. We need the "story" of the self, not just the "snapshot" of properties.

  4.  **Refining and Polishing:**

      *   *Check Constraints:* Did I quote dialogue? No. Did I reference specific scenes? Yes (Tank, Trial, Warehouse, Prison). Did I stick to Position 2? Yes. Did I use the Black's Spheres dynamic twist? Yes.
