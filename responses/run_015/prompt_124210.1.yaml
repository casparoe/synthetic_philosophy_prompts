  **MINISTRY OF DISTRIBUTIONAL EFFICIENCY**
  **INTERNAL DELIVERY PLAN 44-B**
  **SUBJECT:** Operationalising Statutory Prioritarianism under Constraint Scenario L-D

  **1. Mandate and Objective**
  1.1. Pursuant to the Prioritarianism Act (2024), the Ministry's primary Key Performance Indicator is the maximisation of the Priority-Weighted Welfare Aggregate (PWWA).
  1.2. The PWWA is defined as the sum of individual welfare units across the population, transformed by a strictly concave weighting function $g(w)$, wherein the marginal moral value of a benefit decreases as the recipient's absolute welfare increases.
  1.3. Statutory compliance strictly prohibits any intervention resulting in a net decrease to the PWWA, regardless of resultant changes to the Gini coefficient or other inequality metrics.
  1.4. This plan supersedes previous delivery frameworks based on utilitarian aggregation.

  **2. Identification of Compliance Risk**
  2.1. Proposed Intervention Group 7 (IG-7) involves the reduction of high-baseline welfare assets (e.g., luxury tax hikes, removal of subsidised leisure facilities) without corresponding transfers to low-baseline agents.
  2.2. Under standard calibration, IG-7 reduces the absolute welfare ($w$) of affluent cohorts. As the weighting function $g(w)$ is monotonic increasing, a reduction in $w$ necessarily reduces the transformed value $g(w)$.
  2.3. Consequently, IG-7 constitutes impermissible "Levelling Down" under Section 1.3, as the aggregate sum declines while no individual receives a compensatory benefit. This conflicts with Ministerial directives to reduce stratification.
  2.4. Initial modelling indicates a PWWA deficit of 15 points under standard functions.

  **3. Methodological Adjustments for Compliance**
  3.1. To align IG-7 with statutory objectives without amending primary legislation, the Metrics Division has authorised three technical recalibrations effective Q3.
  3.2. **Baseline Recalibration:** The welfare zero-point ($w_0$) shall be shifted from "biological subsistence" to "socially normative participation." Reductions occurring above the normative threshold are classified as "neutral optimisation" rather than welfare loss. This reclassifies IG-7 impacts on affluent agents as non-negative within the function.
  3.3. **Comparative Weighting Module (CWM):** Henceforth, $g(w)$ will incorporate a relative standing variable. High absolute welfare coupled with high relative disparity generates a "status externality" penalty on the aggregate social utility. This is grounded in the assumption that welfare is partially constitutive of social standing. Reducing affluent welfare reduces this penalty, yielding a net PWWA gain even if absolute welfare falls. This effectively internalises relative deprivation as a welfare cost, allowing levelling down to register as a weighted improvement.
  3.4. **Variable Population Modelling:** Interventions reducing affluent welfare are modelled to decrease the "probability of existence" for future high-welfare counterparts. By treating future affluent identities as contingent on current surplus, reducing surplus reduces the expected value of future weighted welfare claims, thereby improving the current discounted aggregate. This leverages the Non-Identity Problem to bypass intergenerational weighting constraints.

  **4. Implementation and Reporting**
  4.1. All project proposals must utilise the CWM-adjusted algorithm for final sign-off.
  4.2. Auditors will verify that no PWWA loss is recorded on final reporting, irrespective of absolute welfare movements.
  4.3. Staff are reminded that the objective is PWWA maximisation, not equality *per se*. Equality is only instrumentally valuable insofar as it optimises the concave transformation function.

  **ANNEX A: PROJECTED INTERVENTION OUTCOMES (IG-7)**

  | Intervention | Target Cohort | Absolute $\Delta w$ | Standard $g(w)$ Impact | CWM-Adjusted Impact | Compliance Status |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | Yacht Subsidy Removal | Top 5% | -150 units | -45 pts | +10 pts (via externality reduction) | **Approved** |
  | Golf Course Rezoning | Top 10% | -50 units | -20 pts | +5 pts (via baseline shift) | **Approved** |
  | Direct Cash Transfer | Bottom 20% | +100 units | +80 pts | +80 pts | **Approved** |
  | **Aggregate** | **All** | **-50 units** | **+15 pts** | **+95 pts** | **Compliant** |

  *Note: Aggregate Absolute Welfare decreases; Priority-Weighted Welfare increases under CWM.*

  **5. Review**
  5.1. This methodology remains internal. Public communications should refer to "holistic welfare optimisation" to avoid scrutiny regarding the non-identity claims in Clause 3.4.

  ***

  **Note on Philosophical Accuracy**

  This piece leans on a contested reading of prioritarianism primarily in Clause 3.3 (the "Comparative Weighting Module"). Standard prioritarianism (as defined by Parfit) is *absolute*: the weight assigned to a benefit depends solely on the recipient's absolute level of well-being, not their standing relative to others. By introducing relative standing into the weighting function, the Ministry is effectively smuggling egalitarianism into a prioritarian framework to bypass the Levelling Down Objection.

  I am highly confident (95%) that a standard prioritarian would reject the document's core maneuver. The defining feature of prioritarianism is that it avoids the Levelling Down Objection precisely by refusing to value equality for its own sake; if no one is made better off, the priority-weighted sum cannot rise.

  The single claim I am least sure about is the variable-population workaround (Clause 3.4). While prioritarianism faces significant challenges in variable population contexts (e.g., the Very Repugnant Conclusion), using the non-identity problem to justify making existing people worse off is a particularly aggressive interpretive stretch. However, given the elasticity of population ethics, a determined bureaucracy might find more traction there than with the absolute/relative distinction.
