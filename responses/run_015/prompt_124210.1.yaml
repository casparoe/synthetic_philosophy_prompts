  pls write me a parody: an internal white paper / "delivery plan" — 600–700 words, numbered clauses, deadpan civil-service prose, maybe an annex with a table of "interventions" — from an invented government ministry that has officially adopted prioritarianism (the view that a benefit counts for more the worse off the person is, aggregated as a weighted sum) as its distributional objective, and is now trying to work out whether it is permitted to fund projects that reduce inequality by making the better off worse off while making nobody better off.

  The jokes have to come from taking the view's actual structure seriously rather than from a cartoon of it: on the standard additive version, pure levelling down can literally never improve things (no one's weighted welfare goes up, so the total goes down), so the ministry has to invent increasingly baroque workarounds to get the projects it already wants — re-cutting the welfare scale, shifting the zero point, a "comparative weighting" module that quietly smuggles relative standing back in, a variable-population argument, feel free to add your own. Nobody in the document should notice the reductio, or say the word "fetishism" — the reader should feel it without being told, and someone who actually works on this stuff should find it fair rather than a strawman.

  Then a short note after the piece: where it leans on a contested reading of prioritarianism, how confident you are overall that a prioritarian would grant the claims the document makes, and flag the single claim you're least sure about.
