answer: |-
  We stand before the ledger of the world,
  Where lives extend beyond the edge of sight.
  At first the arithmetic held its ground,
  For every joy added a distinct weight.
  We thought the total grew with every soul,
  Until the column reached the sky above.
  We trusted in the growth of good alone,
  And **we weigh the sum** with confident hands.
  But now the numbers stretch without a bound,
  And sums dissolve into th'infinite.
  Means vary with the sequence that we choose,
  Like terms rearranged, the limit must shift.
  There is no uniform measure to hold,
  No canonical scale for numbered lives.
  The scale dissolves, and **we weigh the sum**
  In empty air, where nothing can be known.
