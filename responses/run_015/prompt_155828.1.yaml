          *   *Key Distinction:* Multi-attribute utility vs. Single-attribute utility. LTNU claims single-attribute (hedonic tone).

      *   **Addressing Objection 2: The Saturation Reply:**
          *   *Objection:* Maybe the curve just gets steep. No finite sum of small pleasures reaches the "height" of severe pain.
          *   *Rebuttal:* Distinguish "Steep" from "Lexical."
