      *   *Conclusion:* To make the threshold work lexically, the "badness" above the threshold must be of a different *kind* (infinite disvalue or deontological constraint), breaking the single-scale utilitarian framework.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** State the thesis clearly. Acknowledge the intuitive appeal of LTNU but assert its structural instability.
      *   **The Single-Scale Commitment:** Define what it means to be on a "single cardinal hedonic scale."
          *   *Cardinality:* Ratios matter (2 hedons is twice as good as 1).
          *   *Interpersonal Comparability:* My hedon = your hedon.
          *   *Unboundedness (Positive):* No ceiling on pleasure.
          *   *Linearity (Duration/Number):$N$ people $\times$ $I$ intensity = Total Value.
          *   *The Tension:* If $+H$ and $-H$ are on the same scale, $N \times (+H)$ should eventually outweigh $1 \times (-H_{severe})$ unless $-H_{severe}$ is effectively $-\infty$. If it's $-\infty$, it's not on the same scale.

      *   **The Instability Argument:**
          *   If the scale is continuous and cardinal, there is always a number $N$ such that $N \times \text{pleasure} > \text{pain}$.
          *   To block this, LTNU must treat threshold pain as *lexically prior*.
          *   Lexical priority on a single dimension implies infinite disvalue.
