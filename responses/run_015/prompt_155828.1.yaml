answer: |-
  The position you have developed, Lexical Threshold Negative Utilitarianism (LTNU), is an attempt to capture a robust moral intuition: that extreme suffering is categorically different from mild discomfort, and that no amount of happiness can justify imposing it. However, your intuition that the view is unstable is correct. The instability arises because LTNU attempts to house a deontological constraint within a consequentialist aggregation framework.

  Here is the argument for your thesis: **Once LTNU grants that pleasures and pains are commensurable on a single cardinal hedonic scale below the threshold, it cannot coherently withhold that commensurability above the threshold without ceasing to be a form of utilitarianism.** The lexical rule requires a break in the mathematical structure of value that utilitarianism cannot sustain.

  ### 1. The Commitments of the Single-Scale Assumption

  To see why the view fractures, we must first make explicit what the "single cardinal hedonic scale" assumption commits you to. If pleasure and pain are merely positive and negative values on a single scale (let us call the unit a *hedon*), the following structural commitments obtain:

  1.  **Cardinality:** The scale is not merely ordinal. A difference of 10 hedons is twice as morally significant as a difference of 5 hedons. This allows for aggregation.
  2.  **Interpersonal Comparability:** A hedon for person A is equivalent to a hedon for person B. This allows for summation across persons.
  3.  **Linearity of Duration and Number:** The total value of an experience is the product of intensity, duration, and number of experiencers. If one person suffers $-10$ hedons for one hour, it is equivalent to ten people suffering $-10$ hedons for one-tenth of an hour (assuming intensity is constant).
  4.  **The Archimedean Property:** This is the critical mathematical commitment. In any standard real-valued cardinal scale, for any two finite positive values $x$ and $y$, there exists some integer $n$ such that $n \cdot x > y$. In moral terms: for any finite amount of severe pain, there is some sufficiently large quantity of mild pleasure that outweighs it.

  LTNU attempts to violate the Archimedean Property *only* at the threshold. It claims that below the threshold, trade-offs obey the Archimedean Property (standard aggregation). At or above the threshold, they do not (lexical priority).

  **The Instability:** You cannot maintain a single continuous scale while selectively violating the Archimedean Property. If the scale is continuous and real-valued below the threshold, and the threshold is a specific point on that same scale, the values immediately above the threshold must be finite real numbers. If they are finite real numbers, the Archimedean Property applies to them. Therefore, a finite sum of sub-threshold pleasures *must* outweigh them.

  To prevent this trade-off, the disvalue of threshold suffering cannot be a finite number on the same scale. It must be effectively $-\infty$. But if threshold suffering is $-\infty$ and sub-threshold pleasure is finite $+n$, they are not on the same scale. One is a real number; the other is an infinity. By positing this, LTNU admits that severe suffering carries a property (infinite disvalue) that pleasure structurally lacks. This is no longer a difference of degree on a hedonic scale; it is a difference of kind. Consequently, the view ceases to be aggregative utilitarianism and becomes a hybrid: a maximizing view constrained by a side-constraint against infinite disvalue.

  ### 2. Addressing the Objection from Ordinary Lexical Orderings

  Your seminar friends argue that lexical orderings are coherent even on common measures, citing lexicographic preferences in decision theory (e.g., choosing a job: first maximize salary, then maximize vacation days). They claim this shows lexical priority does not entail incommensurability.

  **Why this reply fails:**
  This objection conflates *multi-attribute* utility with *single-attribute* utility. In the job example, salary and vacation days are distinct dimensions. We prioritize dimension 1 over dimension 2. This is coherent because the attributes are distinct.

  LTNU, however, posits a *single* attribute: hedonic tone. To have a lexical ordering on a *single* continuous dimension is mathematically incoherent within standard real analysis. If $x$ and $y$ are both values of "hedonic tone," and $y$ is worse than $x$, then $y = x + \delta$ for some negative $\delta$. If $\delta$ is finite, enough copies of a positive $\epsilon$ will outweigh it.

  For a lexical ordering to work on a single dimension, the "worse" value must not just be lower; it must belong to a different order of magnitude (e.g., hyperreal numbers where infinitesimals exist). But if you introduce hyperreals or infinities, you have abandoned the standard cardinal scale required for classical utilitarian aggregation. You have introduced a new property—"lexical severity"—that is not captured by the hedonic intensity itself.

  If you insist the dimension is truly singular (hedonic tone), then lexical priority is impossible without discontinuity. If you admit a discontinuity, you admit that "hedonic tone" is not the sole determinant of value; rather, "hedonic tone + lexical status" is the determinant. This confirms the thesis: the lexical rule does work only by importing a non-hedonic property (the constraint status), transforming the view into a constraint-based hybrid.

  ### 3. Addressing the Saturation Reply

  The second objection suggests the scale is not linear but compressive or saturating. Perhaps the function mapping hedonic intensity to moral value is asymptotic for pleasure but unbounded for pain. On this view, no finite sum of sub-threshold pleasures can reach the disvalue of threshold pain because the pleasure curve flattens out before it gets "high enough."

  **Why this reply fails:**
  This reply confuses a *steep* trade-off with a *lexical* trade-off.
  *   **Steep/Compressive:** The marginal value of pleasure diminishes. To offset 1 unit of severe pain, you might need 1 billion units of mild pleasure. But 1 billion + 1 units will eventually do it. The Archimedean Property holds.
  *   **Lexical:** No finite amount of pleasure offsets the pain. The Archimedean Property is violated.

  If the saturation reply relies on a continuous, real-valued function, it cannot generate genuine lexicality. Any continuous function mapping real numbers to real numbers preserves the Archimedean property. If the function maps to a value $V$, and $V_{\text{pain}}$ is a finite number, there is always an $N$ such that $N \times V_{\text{pleasure}} > V_{\text{pain}}$.

  To make the saturation reply work as a *lexical* defense, the asymptote for pleasure must be finite, while the disvalue for pain exceeds that finite bound. But if the total possible good in the universe is capped (bounded utilitarianism) and the bad is unbounded, you have again introduced a structural asymmetry that is not merely about hedonic intensity but about the *capacity* of the scale itself.

  More damningly, if the saturation reply admits that *no* finite sum of pleasure offsets the pain, it is functionally identical to assigning $-\infty$ to the pain. If it admits that *some* finite sum offsets it, it is not lexical LTNU; it is just Negative Utilitarianism with a very high exchange rate. Since LTNU is defined by the *lexical* claim (strict priority), the saturation reply either fails to capture the view or collapses into the "infinite disvalue" model, which, as argued above, breaks the single-scale utilitarian framework.

  ### 4. The Decision-Theoretic Wrinkle

  This is where the argument bites hardest. Let us assume, for the sake of argument, that LTNU is coherent as a theory of value. We must now apply it to choice under uncertainty.

  **The Fanaticism Problem:**
  An expected-value maximizer calculates $EV = \sum (p_i \times v_i)$.
  If threshold suffering has lexical priority, its value is effectively $-\infty$.
  Consider an action $A$ that produces 1 million units of sub-threshold pleasure but carries a probability $p = 10^{-100}$ of causing one instance of threshold suffering.
  $EV(A) = (1 \times 10^6) + (10^{-100} \times -\infty) = -\infty$.

  Now consider action $B$, which produces 0 pleasure and carries the same risk. $EV(B) = -\infty$.
  In fact, almost *any* action in the real world carries a non-zero risk of causing severe suffering (e.g., driving to the seminar risks a crash causing agonizing death). If the disvalue is lexical/infinite, any non-zero probability of threshold suffering renders the EV of an action $-\infty$.

  **The Consequence:**
  1.  **Paralysis:** All actions with any risk of threshold suffering are equally forbidden (all have $-\infty$ EV). You cannot rank them.
  2.  **Fanaticism:** If one action has a *slightly* lower probability of threshold suffering (e.g., $10^{-101}$ vs $10^{-100}$), it dominates *all* other considerations, no matter how much sub-threshold good is at stake. You would be obligated to sacrifice the entire world's sub-threshold happiness to reduce the risk of severe suffering by a microscopic fraction.

  **How this supports the thesis:**
  This wrinkle demonstrates that LTNU cannot function as a standard aggregative consequentialist theory. Standard utilitarianism handles risk via expected value aggregation. LTNU breaks expected value maximization.

  To escape this, the proponent of LTNU must abandon expected value maximization. They must adopt a different decision rule, such as:
  *   **A Constraint:** "Do not act if the risk of threshold suffering exceeds $X$." (This is deontology, not utilitarianism).
  *   **A Permission:** "It is permissible to ignore risks below $Y$." (This is pragmatic, not axiological).
  *   **Reasons Structuralism:** "The reason to avoid threshold suffering is not a weight in the calculus but a veto on the calculus."

  All these responses confirm the core thesis: **LTNU is not a scalar theory.** It cannot be saved by tweaking the hedonic scale. It must be saved by changing the normative structure from "maximize value" to "respect constraints."

  ### Conclusion

  The instability you sensed is fundamental. LTNU attempts to combine the *aggregative structure* of utilitarianism (single scale, trade-offs below threshold) with the *absolute structure* of deontology (no trade-offs above threshold).

  1.  **Single-Scale Commitment:** If you keep the single scale, you must accept the Archimedean property, which eliminates the lexical threshold.
  2.  **Lexical Commitment:** If you keep the lexical threshold, you must violate the Archimedean property, which requires infinite disvalue, breaking the single scale and the aggregative framework.
  3.  **Decision Theory:** The attempt to apply lexical values to risk leads to fanaticism or paralysis, forcing the view to abandon expected value maximization, the engine of utilitarianism.

  Therefore, LTNU is not a stable form of utilitarianism. It is a hybrid view that disguises a side-constraint against severe suffering as a hedonic threshold. It inherits the pathologies of lexical weights (incommensurability, decision-theoretic paralysis) without gaining the elegance of a unified scalar theory. To be coherent, it must own its hybrid nature: it is aggregative consequentialism bounded by deontological constraints, and it should be evaluated on those terms, not as a refinement of the hedonic calculus.
