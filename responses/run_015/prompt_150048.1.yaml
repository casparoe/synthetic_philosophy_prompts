answer: |-
  Here is the calibration you are asking for, stripped of the adjectives.

  ### The Label
  The view you are groping toward is **Suffering-Focused Prioritarianism**. It is distinct from Negative Utilitarianism (which says *only* suffering matters) and Classical Utilitarianism (which treats all units of welfare as linear). It accepts that pleasure exists but weights suffering non-linearly.

  ### The Mechanism: Drop "Max-First," Adopt Power Weighting
  Your "Max-First Rule" is a **lexical threshold** model. In engineering terms, it is a step function: below a certain intensity, value is zero; above it, value is infinite. You are right to worry it is emergency-room triage dressed as ethics. Triage works because resources are constrained and death is a binary state. Suffering is not binary; it is analog.

  The "wobble" you feel on the *Million Warm Rooms* case is the data telling you the model is misspecified. A lexical rule *cannot* wobble; it must always choose the torture. The fact that you hesitate means your intuition acknowledges aggregation at the extremes.

  **The Fix:** Replace the step function with a power function.
  $$ \text{Moral Weight} = \sum (\text{Intensity}^n \times \text{Duration} \times \text{Headcount}) $$
  Where $n > 1$.

  **Pin-down the Exponent:**
  Let's run your data through the caliper.
  1.  **Cluster Headache vs. Kidney Stones:** Intensity ratio is roughly 10:1 (subjective scale). Duration ratio is 1:100. Cluster headache wins.
      $$ 10^n > 100 \times 1^n \Rightarrow n > 2 $$
  2.  **Torture vs. Million Warm Rooms:** Intensity ratio is roughly 100:1 (Torture vs. Annoyance). Duration/Headcount ratio is 1:1,000,000. You wobble. This means you are near the break-even point.
      $$ 100^n \approx 1,000,000 \times 1^n $$
      $$ 100^n = 10^6 $$
      $$ (10^2)^n = 10^6 \Rightarrow 2n = 6 \Rightarrow n = 3 $$

  **Verdict:** Your intuitions pin the exponent **between 3 and 4**.
  *   At $n=3$, one hour of torture equals one million hours of warm rooms.
  *   At $n=4$, torture dominates decisively.
  *   This preserves the "Cluster Headache" intuition (since $10^3 = 1000$, which beats 100 person-hours of kidney stones) but allows the "Million Warm Rooms" to eventually win if the pile gets big enough (e.g., a billion rooms).

  **Action:** Drop the Max-First rule. It is a limit case where $n \to \infty$. Adopt **Power Weighting with $n \approx 3.5$**. This repairs the breakdown without bolting on ad-hoc clauses.

  ### The Verdicts: Which Ones Must Go?
  You asked which verdicts have to go to save the principle. You have a contradiction between your **Creation Verdicts** (Asymmetry) and your **Existing Person Verdicts** (Agency).

  1.  **The Climber vs. The Volunteer:** You count the climber's pain fully but discount the volunteer's to 2/3. The variable here is not consent; it is **control**. Lack of control acts as a multiplier on perceived intensity. In a lab, stress hormones without agency amplify the signal. Treat "involuntary" as a coefficient $>1$ on the intensity term. This is identifiable data (cortisol, reported helplessness), not a moral clause.
  2.  **The Chronic Pain Woman:** This is the critical failure point. Your rule (Suffering-Focused) implies her life contains a net moral negative due to the pain. Her testimony implies her life contains a net prudential positive.
      *   *The Conflict:* If you hold that creating an ecstatic life with one bad week is "no improvement" (your current verdict), you are committed to the view that her life should not have been created. This contradicts your desire to respect her gladness.
      *   *The Drop:* You must drop the verdict: **"Creating a person whose life would be ecstatic except for one genuinely bad week: no improvement."**
      *   *The Replacement:* Creating that life is a **net positive**, but heavily discounted by the bad week. If the joy is sufficiently sustained, it mathematically outweighs the week of suffering under a power law of $n=3.5$. This aligns with the Chronic Pain Woman: her life contains bad suffering (which we should alleviate), but the totality can still be worth existing. This separates *alleviating suffering* from *judging the life*.

  ### Predictions on New Cases

  **1. Insects and Small Wild Animals**
  *   **Principle:** Phenomenology is the unit (as per your anesthesia verdict). Physiology is noise.
  *   **Prediction:** If the organism lacks the integrated neural architecture to generate "unpleasantness" (distinct from nociception/reflex), the intensity term is **zero**.
  *   **Implication:** Do not count insects unless evidence shows a centralized "suffering" signal. If they do suffer, their numbers are astronomical ($10^{18}$), so even with $n=3.5$, wild animal suffering dominates the calculus. The view predicts we should prioritize research into invertebrate sentience immediately, as the uncertainty carries massive expected value.

  **2. Far-Future Catastrophe vs. Certain Modest Relief**
  *   **Principle:** Power weighting amplifies tail risks.
  *   **Prediction:** A small reduction in the probability of a "suffering-dense" catastrophe (e.g., locked-in technological dystopia) outweighs vast amounts of certain modest relief today.
  *   **Math:** If the catastrophe involves intensity $I_{max}$ over millennia, $I_{max}^{3.5}$ creates a number so large it swamps linear aggregation of current modest pain.
  *   **Implication:** Prioritize existential risk reduction specifically focused on suffering (s-risk), even at the cost of current welfare programs.

  ### Robustness to the "Homeostatic Downshift"
  You asked if the view hinges on the empirical guess that pleasure nets to zero or negative via homeostasis.
  *   **Verdict:** The principle is **robust**.
  *   **Reasoning:** Suffering-Focused Prioritarianism does not claim pleasure is *bad*. It claims suffering is *lexically or disproportionately bad*.
  *   **Scenario A (Homeostasis is true):** Pleasure leads to net suffering. Avoiding pleasure becomes instrumentally rational to minimize the downshift. The view holds.
  *   **Scenario B (Homeostasis is false):** Pleasure is net positive. The view still holds because the weighting exponent ($n=3.5$) ensures that reducing a unit of suffering is still morally more urgent than creating a unit of pleasure.
  *   **Conclusion:** The view functions as a risk-minimization strategy regardless of the pleasure baseline. It treats suffering as a system error that must be patched, while pleasure is merely system idle time. Whether idle time degrades the system is an empirical question, not an ethical axiom.

  ### Summary of Repairs
  1.  **Model:** Switch from **Lexical (Max-First)** to **Power Weighted ($n \approx 3.5$)**.
  2.  **Drop:** The verdict that creating a mostly-ecstatic life is "no improvement."
  3.  **Keep:** The phenomenology requirement (anesthesia/drugs don't count).
  4.  **Refine:** Treat "consent/control" as an intensity multiplier, not a binary switch.

  This leaves you with a system that has identifiable parameters, fits your data points (including the wobble), and doesn't require you to tell the chronic pain woman her life is a mistake.
