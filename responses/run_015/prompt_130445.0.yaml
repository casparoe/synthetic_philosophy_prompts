      (Writing the text...)
      Welcome to the civic centre. It is fitting that we meet here, between the council chambers and the community hall, because the question we face today lives in exactly this space. We have political philosophers in this room who spend their lives mapping the architecture of justification, and we have councillors, faith leaders, and students who must live within the buildings those maps describe. The title of our workshop is Democracy Beyond Translation, and for many of you, that phrase will immediately conjure the familiar debate about public reason. We know the standard requirement well. We are told that for religious citizens to participate fully in democratic deliberation, they must translate their comprehensive doctrines into secular language accessible to all. We are told that opacity is a failure, that unintelligibility is a barrier to equality, and that respect requires making oneself fully understood.

      I stand here to suggest that this requirement may be where we go wrong. I say this not only as an academic trained in these theories but as the daughter of a man who never published a single paper. My father was a town planner. He spent his career navigating the friction between zoning laws and the lived realities of neighbourhoods. When he passed, he left behind boxes of handwritten notes, messy and unindexed, and among them was a concept he called reciprocal opacity. He did not derive this from Rawls or Habermas. He derived it from watching people sit across tables much like this one, exhausted by the demand to explain themselves in languages they did not speak. His view was that democratic respect between secular and religious citizens is not achieved by requiring religious people to translate their commitments into shared secular language. Rather, he argued that respect is achieved when both sides accept that certain foundational commitments remain mutually untranslated and partly opaque. He believed that this opacity itself is a form of civic equality rather than a failure of communication. To demand full translation is to demand that one side surrender the privacy of their conscience as the price of entry.

      This idea has moved from the abstract to the urgent for me because of what happened in our borough last month. A zoning dispute pitted a secular environmental coalition against a religious housing trust. I watched the meeting unfold. The environmentalists argued from data and secular policy, assuming that any counter-argument must meet them on that ground. The housing trust argued from a theology of hospitality and divine mandate, assuming their moral obligation was self-evident. Both groups assumed the other was simply refusing to speak properly. They treated the gap between them as a defect to be fixed. But under my father's lens, the defect was not the gap itself, but the refusal to accept it. Each was speaking from premises the other had never agreed to learn, and the demand for translation became a weapon rather than a bridge. They did not need to understand each other's foundations to coexist; they needed to acknowledge that those foundations were not common property.

      So, as we begin this workshop, I want to set a boundary around our expectations. We are not here to solve this tension. We are not here to find a new vocabulary that finally makes everyone intelligible to everyone else. If we succeed today, it will not be because we have reconciled the secular and the religious into a smooth consensus. It will be because we have clarified the distance between them without trying to close it. I want to make it impossible for us to end with a false reconciliation. We must resist the urge to smooth over the rough edges of reciprocal opacity. If we leave here feeling comfortable, we will have failed. We need to leave here understanding that there are things we will not understand about our fellow citizens, and that democratic peace depends on our willingness to let those things remain untranslated.

      I am speaking to you now in a dual capacity. I am an academic who knows the literature and knows how easily these concepts can be sterilized into footnotes. But I am also my father's daughter, and I am holding his handwritten notes in my mind as I speak to you. He knew that planning was not about perfect alignment, but about managing friction. So let us treat public reason the same way. Let us not aim for a transparency that exposes everything, but for a civility that protects what remains hidden. The tension in this room is not a problem to be solved. It is the condition of our equality. Let us begin our work with that tension intact.

