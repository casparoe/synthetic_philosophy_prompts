      *   *Refining the Deprioritization:* Why deprioritize Overdetermination? Because if causation is level-relative (P1), overdetermination isn't "two causes," it's "one cause described twice." So solving P1 solves P4. Therefore P4 is downstream.

      *   *Refining Functionalism:* Functionalism is popular among SEs (mind = software). But does it solve exclusion? Only if we solve P1 first. So P3 is downstream of P1.

      *   *Refining Explanation vs. Causation:* This is the bridge. Is the exclusion problem about what *exists* or what we *say*? This needs to be tackled early, perhaps intertwined with P1. Let's make P1 about the *definition of causation* and P2 about the *status of the competition*.

      *   *Revised Order:*
          1.  **The Relativity of Causal Sufficiency (Interventionism/Abstraction).** (Defining the terms).
          2.  **The Ontic vs. Epistemic Distinction (Explanation vs. Causation).** (Locating the problem).
