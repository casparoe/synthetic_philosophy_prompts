answer: |-
  # Specification: Typogenetic Semantic Closure (TSC)

  ## 1. Core Axioms (Non-Negotiable)
  *These define the boundary conditions. Violating these collapses the system into either a static tautology or a random walk.*

  ### 1.1 The von Neumann Kinematic Separation
  **Criterion:** The system must distinguish between the **Passive Description** (the code/tape) and the **Active Constructor** (the interpreter/machinery).
  **Case:** A replicator cannot read and execute itself simultaneously during the copying phase. If it did, it would enter an infinite regress (interpreting the interpretation of the interpretation). There must be a mode switch where the code is treated as inert data for copying, distinct from the mode where it is treated as instructions for construction.
  **Status:** **Non-Negotiable.** Without this, physical replication is impossible.

  ### 1.2 The Gödelian Incompleteness Constraint
  **Criterion:** The system cannot internally verify its own semantic consistency with absolute certainty.
  **Case:** A self-referential code cannot contain a complete proof of its own stability. There must be a residual uncertainty regarding whether a mutation preserves "meaning" or destroys it. The system cannot contain a "truth predicate" for its own semantic output.
  **Status:** **Non-Negotiable.** Violating this contradicts formal limits on self-reference.

  ### 1.3 The Causal Closure of Physics
  **Criterion:** All semantic effects must be realized through physical causation.
  **Case:** "Meaning" is not mystical; it is the specific causal impact of the code on the construction machinery. If the code changes the machinery, that change must be physically instantiated. You cannot posit a "semantic layer" that floats above the physical mutation rate.
  **Status:** **Non-Negotiable.**

  ---

  ## 2. Functional Desiderata
  *These are the capabilities the theory must account for to be adequate.*

  ### 2.1 Dual-Mode Replication Fidelity
  **Requirement:** The theory must quantify fidelity in two distinct channels:
  1.  **Syntactic Fidelity:** Accuracy of copying the symbol sequence (A->A).
  2.  **Semantic Fidelity:** Accuracy of preserving the input-output function of the interpreter (Function(A) -> Function(A')).
  **Case:** A mutation might change the syntax (codon) but, due to redundancy or compensatory machinery changes, preserve the semantics (amino acid/function). The theory must distinguish a "silent" mutation from a "neutral" mutation (one that changes function but not fitness).
  **Status:** Required.

  ### 2.2 Interpreter Mutability
  **Requirement:** The machinery that reads the code must itself be encoded by the code.
  **Case:** In DNA, polymerases and ribosomes are proteins encoded by DNA. In TSC, the "rules of reading" are not fixed externally (like a human reading a book) but are internal and mutable. The theory must model how changes in the *reader* alter the interpretation of the *text*, and vice versa.
  **Status:** Required.

  ### 2.3 Error Propagation vs. Containment
  **Requirement:** The theory must define thresholds for when a mutation in the interpreter cascades into semantic collapse versus when it is absorbed.
  **Case:** If the "reading rule" mutates, every subsequent gene is read differently. The theory must specify the conditions under which this leads to immediate death (semantic crash) versus a coherent shift in dialect (evolutionary speciation).
  **Status:** Required.

  ### 2.4 Bootstrapping Stability
  **Requirement:** The system must explain how the first instance of the code/interpreter pair arises without an external pre-existing interpreter.
  **Case:** You cannot assume a perfect reader exists before the code exists. The theory must account for a "rough" initial closure that tightens over time (co-evolution of code and reader).
  **Status:** Required.

  ---

  ## 3. Critical Distinctions (Must Not Collapse)
  *Failure to maintain these distinctions renders the theory useless for distinguishing life from mere chemistry or logic.*

  ### 3.1 Syntax vs. Semantics
  **Distinction:** **Syntax** is the arrangement of symbols. **Semantics** is the causal consequence of those symbols on the system's construction.
  **Risk:** Collapsing these implies that changing a symbol *always* changes the function (false, due to redundancy) or that function exists without symbols (false, requires information).
  **Status:** **Non-Negotiable.**

  ### 3.2 Replication Fidelity vs. Evolutionary Flexibility
  **Distinction:** **Fidelity** is the probability of exact copying. **Flexibility** is the capacity for the system to accept changes that alter phenotype without destroying replicability.
  **Risk:** Optimizing for perfect fidelity creates a "crystal" (no evolution). Optimizing for flexibility creates a "gas" (no identity). The theory must model the "edge of chaos" between them.
  **Status:** **Non-Negotiable.**

  ### 3.3 Internal Reference vs. External Reference
  **Distinction:** **Internal Reference** is how the code refers to its own parts (self-replication). **External Reference** is how the code refers to environmental resources (metabolism/fitness).
  **Risk:** Confusing self-maintenance with environmental adaptation. A system can be perfectly closed semantically but starve.
  **Status:** Required.

  ---

  ## 4. Logical and Biological Constraints
  *The theory cannot violate these established results.*

  ### 4.1 The Quinean Loop Condition
  **Constraint:** The code must contain a description of the constructor, and the constructor must use that description to build a copy of the code *and* the constructor.
  **Violation:** If the constructor builds the code but not itself, it is not a self-replicator (it's a 3D printer). If the code describes the constructor but isn't used to build it, it is not typogenetic.
  **Status:** **Non-Negotiable.**

  ### 4.2 The Error Threshold (Eigen's Limit)
  **Constraint:** There is a maximum mutation rate per base per replication beyond which information is lost faster than selection can recover it.
  **Violation:** A theory claiming infinite semantic closure under arbitrary mutation rates violates information theory.
  **Status:** **Non-Negotiable.**

  ### 4.3 The Halting Problem Analog
  **Constraint:** The system cannot predict with certainty whether a specific mutation will lead to a viable replicator without actually running the replication cycle.
  **Violation:** Claiming the code can "pre-screen" all mutations for semantic validity implies a computational power exceeding the system's own complexity.
  **Status:** **Non-Negotiable.**

  ---

  ## 5. Antinomies & Jointly Unsatisfiable Pairs
  *These are the tension points. You cannot maximize both sides of these pairs simultaneously. An adequate theory must explicitly model the trade-off, not solve it away.*

  ### 5.1 Absolute Semantic Closure vs. Open-Ended Evolution
  **The Conflict:**
  *   **Semantic Closure:** Requires the interpretive rules to remain invariant so "meaning" is preserved across generations.
  *   **Open-Ended Evolution:** Requires the interpretive rules (or their output) to shift to explore new fitness landscapes.
  **Why Unsatisfiable:** If the rules are strictly closed, the system cannot adapt to new environments that require new semantics. If the rules are open to adaptation, the "identity" of the replicator dissolves into noise.
  **Resolution Requirement:** The theory must define a **Meta-Stable Zone** where interpretive rules are rigid enough to replicate but plastic enough to drift over geological time, not generational time.

  ### 5.2 Self-Verification vs. Gödelian Limits
  **The Conflict:**
  *   **Self-Verification:** The replicator wants to ensure its offspring are semantically identical to itself.
  *   **Gödelian Limits:** The system cannot prove its own consistency from within.
  **Why Unsatisfiable:** You cannot encode a perfect "error checker" for semantic meaning within the code itself, because the checker is subject to the same mutations and logical limits as the code it checks.
  **Resolution Requirement:** The theory must rely on **External Selection** (environmental fitness) as the proxy for internal consistency checks. The environment "decides" if the semantics held, not the code.

  ### 5.3 Interpreter Encoding vs. Initialization Complexity
  **The Conflict:**
  *   **Interpreter Encoding:** The reader is fully encoded in the tape (maximal closure).
  *   **Initialization:** The system must start from a minimal state.
  **Why Unsatisfiable:** A fully encoded interpreter requires a complex tape to describe. A complex tape requires a sophisticated interpreter to read it. This is the "chicken-and-egg" problem formalized. You cannot have maximal encoding and minimal startup simultaneously.
  **Resolution Requirement:** The theory must allow for **Partial Closure** initially, where some interpretive rules are environmental or structural (e.g., physical chemistry constraints) and are gradually internalized into the code over evolutionary time.

  ### 5.4 High Fidelity Copying vs. High Fidelity Interpretation
  **The Conflict:**
  *   **High Fidelity Copying:** Requires the copying machinery to ignore the *meaning* of the code (treat it as inert).
  *   **High Fidelity Interpretation:** Requires the machinery to be sensitive to the *meaning* of the code (treat it as active).
  **Why Unsatisfiable:** Mechanisms that optimize for inert copying (e.g., physical templating) often lack the error-correction capabilities of active interpretation. Mechanisms that optimize for active interpretation (e.g., proofreading based on function) are too slow or energy-intensive for raw copying.
  **Resolution Requirement:** The theory must posit **Temporal Segregation**: A phase for inert copying and a distinct phase for active interpretation, with a hand-off mechanism that is itself vulnerable to mutation.

  ---

  ## 6. Summary of Non-Negotiables
  *If your formalization violates these, it is not a theory of typogenetic self-replication.*

  1.  **Separation of Tape and Constructor:** No simultaneous read/execute/copy.
  2.  **Internal Encoding of Interpreter:** The rules are part of the system, not external givens.
  3.  **Incompleteness:** No internal guarantee of semantic stability.
  4.  **Error Threshold:** Information loss must exceed a specific bound under high mutation.
  5.  **Syntax/Semantics Distinction:** Sequence is not identical to Function.

  ## 7. Final Directive for Formalization
  When you move to mathematize this, do not seek a fixed point where Semantic Closure = 100%. Seek a **dynamic attractor** where the rate of semantic drift is slower than the rate of replication, but non-zero. The "DNA-Gödel Isomorphism" is not a static identity; it is a control loop that manages the tension between self-reference (closure) and mutation (openness). If your equations converge to a static state, you have modeled a crystal. If they diverge to infinity, you have modeled noise. You are looking for the bounded instability in between.
