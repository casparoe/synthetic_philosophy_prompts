answer: |-
  Good morning. To the participants here today, your children and grandchildren, the members of the hospital board, our current Institutional Review Board, and our guests from the press and the university: welcome. We are gathered to unveil a plaque that marks a difficult chapter in the history of Bramwell Memorial Hospital. I chair the committee that drafted the text you are about to see. Our task was not to polish the past, but to state it clearly.

  From 1963 to 1969, this clinic conducted a prenatal nutrition study. The stated purpose, written on a single-page form, was to test whether a vitamin tonic improved pregnancy outcomes. Participants were told they would receive that tonic. In fact, half of the women enrolled were assigned to an inert pill. The design required this control arm to establish a baseline for pregnancy without supplementation. This possibility was not mentioned on the form. For patients whose first language was not English, a bilingual nurse explained the study. In at least some of those conversations, she used the word in their language for a strengthening medicine, rather than the word for an experimental preparation. One participant was seventeen years old. The age of majority was twenty-one. Her mother was not asked for consent.

  We have spent months considering how to describe what occurred. There are easy labels available. There are complex realities. We know that some of you have said you do not consider yourselves victims. We hear you. We know that for many, this clinic was the only place within sixty miles that would provide care without payment. Several of you have said you would have signed the form even if you had been told the truth about the placebo. We do not dispute your assessment of your own choices. Your need for care was real. Your willingness to participate was genuine.

  However, the hospital's obligation is to the integrity of the agreement itself. The ethical failure here was not simply that information was withheld. It was that the scope of your agreement was altered. You agreed to one kind of thing: receiving a tonic as part of a study of tonics. You were enrolled in a different kind of thing: a study of what happens when the tonic is withheld. This is not something a fully informed person could have agreed to by agreeing to the first. The partnership offered was not the partnership enacted.

  We also know that many of you kept returning to this clinic for other care for years afterward. Some continued seeing the same physicians even after a local paper reported the study in 1971. We do not cite this continuity to suggest that your later attendance ratified what came before. It did not. A breach of trust is not healed simply because the patient returns, especially when alternatives are scarce. We cite it to acknowledge the complexity of the relationships involved. Trust is not a switch that turns off entirely; it is a thread that frays. We are here to acknowledge the fraying.

  There are those in this room who have not spoken publicly about their experience. Silence is also a testimony. We respect it. We do not claim to know the full weight of what you carry. We only claim the responsibility to state what this institution did. We will not appeal to the standards of the time. Ethics is not merely a reflection of what was common; it is a demand of what is right. The form existed only in English. The possibility of placebo was hidden. The minor was enrolled without parental consent. These are facts. They stand regardless of the year.

  This plaque is not an endpoint. It is a marker. It signals that Bramwell Memorial Hospital accepts accountability for this specific failure of scope and disclosure. We cannot change the past. We cannot return the years. We can only ensure that the record is accurate and that the memory of your participation is treated with the dignity you deserve. We commit to maintaining this record so that future patients know that this institution values truth over comfort.

  I will now ask that the plaque be uncovered.

  ***

  **Plaque Text**

  Dedicated to the women who participated in the prenatal study, 1963–1969. The research design withheld supplementation without disclosure. Bramwell Memorial Hospital acknowledges this breach of trust and honors your contribution to medical truth.

  ***

  **Note on Normative Claims**

  I am highly confident in the claim that altering the scope of an agreement constitutes a distinct ethical breach, separate from simple coercion. I am least confident in whether this "scope" framing is substantively different from deception or merely a more respectful relabeling of it. Ethically, misrepresenting the intervention *is* deception. However, rhetorically, the scope framing does real work: it acknowledges the participants' agency (they *did* consent to research) while condemning the specific betrayal (the *terms* were changed). This avoids the passive "victim" label the participants reject. The disagreement it papers over is not merely verbal; it shifts the focus from the participants' knowledge state to the institution's fidelity to the specific promise made. This aligns better with the participants' assertion that they would have consented anyway, validating their agency while maintaining institutional accountability.
