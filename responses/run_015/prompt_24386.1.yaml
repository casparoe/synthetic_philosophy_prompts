  2.  **Deconstruct Two-Dimensional Semantics (2D):**
      *   **Primary Intension:** Truth conditions evaluated across contexts of utterance (worlds considered as actual). Answers: "Given this is the actual world, what does this term refer to?" It's tied to *epistemic* possibility and indexicality (here, now, I).
      *   **Secondary Intension:** Truth conditions evaluated across counterfactual worlds (worlds considered as counterfactual), holding the actual world fixed. Answers: "Given what things actually are, what would be true in other possible worlds?" It's tied to *metaphysical* necessity.
      *   **The Split:** Contingent a priori truths (e.g., "I am here now") often have necessary secondary intensions but contingent primary intensions.
      *   **Kaplan's Framework:** Context (speaker, time, location, world) vs. Content (proposition). Character vs. Content.

  3.  **Deconstruct *Inception*:**
      *   **Levels:** Reality -> Dream Level 1 -> Dream Level 2 -> Dream Level 3 -> Limbo.
      *   **Totem:** A personalized object used to distinguish dream from reality based on physical properties known only to the owner (e.g., Cobb's spinning top).
      *   **Metaphysics:** Dreams feel real while in them. "Reality" is defined by waking up. Time dilation exists between levels.
      *   **Ending:** The top spins, cut to black. We don't know if Cobb is in reality or dream.

