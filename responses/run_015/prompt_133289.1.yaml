prompt: |-
  I sit on our unversity's research-contract arbitration panel. We've got a weird dispute over a $400k climate-adaptation grant. The agreement says the PI must "share preliminary findings with the program office in a timely manner," and she sent them a spreadsheet of raw, uncleaned sensor readings with obvious outliers she hadn't filtered yet. Now she claims she didn't breach the clause because, following Grice, "preliminary findings" doesn't literally mean "verified results ready for circulation" — it's speaker-meaning with a conversational implicature that only commits her to transmitting data-in-progress, not asserting its accuracy. She says she wasn't violating the maxim of quality since she wasn't asserting anything false, just implicating status, and the implicature is cancellable anyway. The funder argues contracts aren't cooperative conversations and she dumped garbage.

  Half the panel thinks this is clever sophistry; half thinks there's a real point about speaker meaning in institutional language. I need a memo for Thursday recommending whether we find a breach, with a concrete remedy if yes or dismissal if no, and it must take her Gricean arguement seriously — don't just say "contracts are literal." Also include an honest paragraph on the strongest reason the other side is right. Don't bother with citations or a bibliography; we just need reasoning the panel can act on. There's a typo or two above but you get the idea.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of a university research-contract arbitration panel.
      *   **Task:** Write a memo recommending a decision (breach vs. no breach) and a remedy/dismissal.
      *   **Context:** Dispute over a $400k climate-adaptation grant.
      *   **Core Issue:** PI sent raw, uncleaned sensor data (with outliers) instead of "preliminary findings."
      *   **PI's Defense:** Gricean pragmatics. "Preliminary findings" carries a conversational implicature, not an assertion of accuracy. She didn't violate the Maxim of Quality because she wasn't asserting truth, just sharing data-in-progress. Implicatures are cancellable.
      *   **Funder's Position:** Contracts aren't conversations; this is garbage/non-compliance.
      *   **Panel Status:** Split 50/50 (some see sophistry, some see linguistic merit).
      *   **Constraints:**
          *   Must take the Gricean argument seriously (cannot just say "contracts are literal").
          *   Must include an honest paragraph on the strongest reason the *other side* is right (i.e., if I recommend breach, I must acknowledge the strength of the PI's argument, and vice versa).
          *   No citations/bibliography.
          *   Actionable reasoning for the panel.
          *   Deadline: Thursday (implies urgency/formal tone).
          *   Note: There are typos in the prompt ("unversity", "arguement"), but the output should be professional.

  2.  **Determine the Recommendation:**
      *   *Option A (No Breach):* Accepting the Gricean argument fully undermines the utility of research reporting. "Findings" implies some level of processing/interpretation, not just data dumping. If we rule for the PI, we set a precedent that allows PIs to send useless data and claim compliance.
      *   *Option B (Breach):* This is the more pragmatic legal/administrative outcome. However, the prompt requires taking the Gricean argument *seriously*.
      *   *Decision:* I should recommend finding a **breach**, but acknowledge the linguistic nuance. Why? Because in a contractual context, the "Cooperative Principle" is superseded by the "Purpose of the Agreement." A grant is for *research outcomes*, not just data transmission. However, to satisfy the prompt's requirement to take the argument seriously, I need to explain *why* the Gricean framework fails here, not just dismiss it.
      *   *Wait, let's look closer:* The prompt asks for an "honest paragraph on the strongest reason the other side is right." If I recommend Breach, the "other side" is the PI (No Breach). If I recommend No Breach, the "other side" is the Funder (Breach).
      *   *Better Approach:* Recommending a **Breach** is the more responsible administrative decision. Sending raw sensor readings with obvious outliers as "findings" defeats the purpose of "timely sharing" for oversight or adaptation. However, the PI's argument *is* linguistically coherent in a vacuum. The memo needs to show *why* contract law modifies pragmatics.
      *   *Alternative:* Recommending **No Breach** (but with a corrective action plan) might be more nuanced. But "dumping garbage" suggests a failure of performance.
      *   *Best Path:* Find a **Minor Breach** (or Technical Non-Compliance). This validates the Funder's concern (it wasn't good enough) without punishing the PI as if she committed fraud. It acknowledges the Gricean point (she didn't lie) but rejects its applicability to the specific contractual term "findings."
      *   *Actually, looking at the split panel:* I need to persuade the half that thinks it's sophistry and the half that thinks it's linguistic.
      *   *Decision:* Recommend **Breach of Contract**, but propose a **Remedy of Cure** (resubmission) rather than financial penalty. This balances the strict compliance needed by the funder with the semantic ambiguity the PI exploited.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** State the recommendation clearly.
      *   **Analysis of the Gricean Argument (The "Serious" Part):**
          *   Acknowledge PI's point: In conversation, "preliminary" modifies the certainty, not the format.
          *   Explain Maxim of Quality: She didn't assert falsehoods; she asserted existence of data.
          *   Explain Cancellability: She could have said "Here is data, not findings."
          *   *Crucial Turn:* Why this fails in contract. Contracts rely on *reasonable expectation of utility*, not just truth-conditions. The "Cooperative Principle" in grants is teleological (aimed at a goal), not just informational.
      *   **The "Other Side" Paragraph:**
          *   If I rule Breach, the "other side" is the PI's linguistic argument.
          *   Strongest point: Language is inherently ambiguous. "Findings" is a spectrum. In early-stage climate adaptation, raw data *might* be the only finding available. Penalizing semantic ambiguity chills research innovation.
      *   **Remedy:**
          *   Don't claw back money (too harsh for semantic dispute).
          *   Require a corrected report within 14 days.
          *   Clarify the definition of "findings" for future deliverables.
      *   **Tone:** Professional, analytical, decisive, respectful of the linguistic theory.

  4.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did I take the Gricean argument seriously? Yes, by analyzing the Maxim of Quality and Implicature.
      *   *Check:* Did I include the "other side" paragraph? Yes, need to make sure it sounds genuine, not like a strawman. The strongest point for the PI is that "findings" is undefined in the contract, so ambiguity should be construed against the drafter (the funder/university) or in favor of the researcher's methodology.
      *   *Check:* Is the remedy concrete? Yes, cure period + definition clarification.
      *   *Check:* No citations? Yes.

  5.  **Final Polish:**
      *   Ensure the distinction between "speaker meaning" and "contractual purpose" is clear.
      *   Make sure the "honest paragraph" stands out.
      *   Fix the typos from the prompt in my own writing (ensure "university," "argument," etc., are correct).

  6.  **Final Review against constraints:**
