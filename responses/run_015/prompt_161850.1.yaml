answer: |-
  The stalemate you describe is not merely a failure of imagination but a structural feature of the debate, arising from a conflation of methodological norms with metaphysical commitments. Your hypothesis that the argument's force relies on sliding between semantic and metaphysical readings is largely correct, but it requires a slight refinement: the slide is not accidental but systematic, driven by competing views on how physical formalism constrains ontology. The sophisticated substantivalist treats the formalism as normative, asserting that gauge freedom *must* be interpreted as representational redundancy to preserve determinism and ontological parsimony. The haecceitist substantivalist treats ontology as normative, asserting that if points are individuals, the formalism must be read as describing distinct possibilities, even if this entails indeterminism. The relationist dissolves the tension by denying the ontology that generates the problem, while the mathematical physicist dissolves the tension by denying the metaphysical relevance of the problem. Consequently, the disagreement is not purely verbal, because each side holds a coherent internal logic; nor is it purely substantive, because the substantive claims (e.g., "points are individuals") are often adopted precisely to resolve the semantic tension.

  This makes the stalemate a methodological one about underdetermination. The core friction lies in whether the symmetry group of a theory dictates the identity conditions of its posits. When you press the shrinking hole probe, you expose the haecceitist's commitment to primitive identity as empirically idle, pushing them toward the view that metaphysics can outrun physics. When you press the background-structure probe, you expose the dependence of the argument on gauge freedom, pushing the substantivalist toward the view that ontology is theory-relative. The sophisticated substantivalist sees this as a virtue (ontology tracks physics), while the haecceitist sees it as a vice (ontology should be robust across formulations). Thus, the debate survives because each side helps themselves to whichever reading is convenient only insofar as their methodological prior dictates what counts as a convenient reading. The semantic reading is convenient for those who prioritize determinism and structuralism; the metaphysical reading is convenient for those who prioritize primitive individuality and realism about the manifold.

  Progress, therefore, will not come from a new argument within the hole framework but from a decision on how to map formalism to world. If the community agrees that gauge freedom is strictly representational, sophisticated substantivalism wins by default. If the community agrees that ontology must be formulation-independent, the hole argument loses its bite because the "distinct models" are artifacts of formulation. Until there is a consensus on whether physical equivalence is defined by isomorphism of models or by identity of underlying substrates, the stalemate will persist as a stable equilibrium of mutually intelligible but incompatible methodological stances. Your hypothesis identifies the mechanism of the stalemate (the semantic-metaphysical slide), but the cause is the lack of agreed-upon rules for deriving ontology from theory.

