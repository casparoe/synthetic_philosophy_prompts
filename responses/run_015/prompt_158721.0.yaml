          *   *Triangle Inequality:* Does $d(A,C) \le d(A,B) + d(B,C)$ hold for theories? If T1 is closer to T2 and T2 to Truth, is T1 closer to Truth? Not necessarily. *Verdict:* Critical. If this fails, "progress" isn't transitive.
          *   *Independent Target:* In archery, you see the bullseye. In science, we don't see Truth. *Verdict:* Critical (Epistemic access problem).
          *   *Single Metric:* Space has one ruler. Logic has many (content vs. likeness). *Verdict:* Critical (Tichý/Miller point).
          *   *Infinite Wrong/One Right:* Space is continuous. Logic is often discrete (possible worlds). *Verdict:* Harmless if we use possible worlds semantics.

      *   **Part 3: The Tichý/Miller Collapse:**
          *   Explain briefly *why* it collapses (adding true consequences to a false theory increases falsity content faster than truth content, or vice versa depending on definition).
          *   Implication: You can't define distance purely by logical content. You need *similarity* between possible worlds (Niiniluoto's fix).

