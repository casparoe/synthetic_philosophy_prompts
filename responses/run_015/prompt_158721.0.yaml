          *   Bullseye = The Whole Truth (Tarskian truth).
          *   Ruler/Metric = Verisimilitude measure (logical distance).
          *   Range/Space = Logical Space (Possible Worlds).
          *   Successive Shots = Theory Change (T1 -> T2 -> T3).
