          *   *Problem 1 (Language Dependence):* Yes, this is the "triviality" result. If I can split questions arbitrarily, I can game the score. This is akin to the "gerrymandering" of predicates.
          *   *Problem 2 (Dominance/Empty Ordering):* If A is better on Q1, B on Q2, and we demand dominance for *all* weightings, A and B are incomparable.
          *   *Verdict:* It replaces "Distance" with "Partial Order." This weakens the Realist claim. Realism wants to say "We are getting closer." A partial order often says "T2 is not worse than T1 in some respects, but incomparable in others." It saves the *local* comparison but breaks the *global* narrative of convergence. It turns "Progress" into "Shift in Focus."

      *   **Part 5: The "Hot/Cold" Analogy:**
