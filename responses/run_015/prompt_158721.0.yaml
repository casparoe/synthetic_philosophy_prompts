          *   *Cons:* It assumes the feedback mechanism (evidence) is reliable *about distance*. But PMI attacks exactly that. If evidence is theory-laden or if nature deceives us (underdetermination), "Warmer" might just mean "Fits current data better," not "Closer to Truth."
