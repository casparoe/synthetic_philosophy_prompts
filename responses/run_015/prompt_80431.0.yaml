answer: |-
  First, take a breath. You are right to be skeptical, and your friend is overstating the consensus to the point of being misleading. The claim that verisimilitude is "basically solved" via a specific content-based measure is not the standard view in the philosophy of science. It is a minority position, often held by proponents of specific formal systems who believe their axioms are self-justifying.

  However, I need to correct a technical conflation in your setup (and likely your friend's) before we get to the open questions. This is high-confidence territory.

  ### Technical Correction: Content vs. Likeness
  You and your friend are conflating two distinct families of measures.
  1.  **Content-Based Measures (Popperian):** These define verisimilitude as Truth Content minus Falsity Content ($Vs = Ct_T - Ct_F$). **This approach is widely considered dead for false theories.** The Miller-Tichý theorem (1974) proved that in propositional logic, if two theories are false, Popper's definition cannot rank one as closer to the truth than the other. It collapses. Popper did concede this.
  2.  **Likeness/Similarity Measures (Niiniluoto/Tichý):** These define verisimilitude based on the "distance" between the theory's models and the actual world in a logical space. **"Minsum" belongs here, not in the content family.** It sums the distances of the theory's constituents from the truth.

  **Where your friend is wrong:** If they are calling minsum a "content-based measure where you sum truth content against falsity content," they are mixing terminology. Minsum is a *likeness* measure.
  **Where you are right:** Your intuition that content is "double-edged" is exactly why the Content-Based approach failed the Miller-Tichý test. You cannot simply add true consequences and subtract false ones for false theories without running into triviality results.
  **Where the debate actually is:** The Likeness approach (minsum) *does* allow ranking false theories, but it does not "solve" the problem in the sense of being universally accepted. It trades the Miller-Tichý problem for the **Language Dependence** problem.

  Here are the crux open questions, ordered by upstream dependency.

  ---

  ### 1. The Metric Justification Problem (Why *this* distance?)
  **Status:** Upstream / Foundational.
  **Confidence:** High that this is the bottleneck.

  Before you can sum anything (minsum), you must define the "distance" between a proposition and the truth. In logical space, how far is "It is hot and raining" from "It is hot and not raining"?
  *   **Why it's upstream:** Every likeness measure (including minsum) requires a metric. If you change the metric, you change the ranking of theories. There is no consensus on how to derive this metric from logic alone without importing subjective assumptions about which features of the world are "more important."
  *   **Tractability:** Low. This is axiological (value-based), not purely logical. It requires a theory of *natural properties* to solve.
  *   **Downstream Impact:** If you can't justify the metric non-arbitrarily, the "number" your friend loves is just a score in a game they invented, not a measure of reality. All specific measures (minsum, average distance, etc.) hang on this.

  ### 2. The Language Dependence Problem (Goodman's Riddle)
  **Status:** Upstream / Structural.
  **Confidence:** High that this is unsolved.

  This is the biggest no-go result currently active. If I describe the world using predicates $\{Green, Blue\}$ and you describe it using $\{Grue, Bleen\}$, the logical distance between theories changes. Consequently, the verisimilitude score changes. Theory A might be closer to the truth in English but further away in "Grue-ish."
  *   **Why it's upstream:** A measure of truthlikeness *must* be language-invariant to be objective. If the ranking depends on our choice of predicates, it measures our linguistic conventions, not the world.
  *   **Tractability:** Very Low. This ties into the unresolved problem of Natural Kinds. Unless we can objectively say which predicates "carve nature at its joints," verisimilitude measures remain relative to a language.
  *   **Downstream Impact:** If this isn't solved, verisimilitude cannot support Scientific Realism (see below). It renders the "number" subjective.

  ### 3. The "More-True" Principle for False Theories
  **Status:** Mid-stream / Desideratum.
  **Confidence:** Medium-High.

  You mentioned the "more-true principle" (often called the Pareto principle in this literature): If Theory A has more truth content and no more falsity content than Theory B, A should be ranked higher.
  *   **The Correction:** As noted, **Content-Based measures fail this** for false theories (Miller-Tichý). **Likeness measures (like minsum) generally satisfy this**, *provided* the metric is well-behaved.
  *   **Why it's mid-stream:** This is a test the measure must pass, but passing it doesn't prove the measure is *correct*, only that it isn't obviously broken. Your friend treats passing this test as "solving" the problem. It is merely clearing the first hurdle.
  *   **Tractability:** High (for Likeness approaches). We know how to build measures that satisfy this.
  *   **Downstream Impact:** Necessary for the measure to be usable, but not sufficient for it to be *true*.

  ---

  ### Implications: What Carries Weight?

  You asked which implications actually follow. Here is the hierarchy of robustness.

  **1. Rational Theory Preference (Robust)**
  *   **Claim:** We can rationally prefer Newton over Aristotle, even knowing both are strictly false.
  *   **Verdict:** **Carries Weight.** Even without a perfect metric, the *concept* of verisimilitude explains scientific progress better than "empirical adequacy" alone. It allows us to say the old theory wasn't just "useful," it was *approximately right*. You don't need a perfect "minsum" number to maintain this intuition; you just need the logical possibility of false theories being ordered.
  *   **Confidence:** High. This is the strongest philosophical payoff.

  **2. Scientific Progress as Convergence (Moderate)**
  *   **Claim:** Science is making progress *because* it is increasing in verisimilitude.
  *   **Verdict:** **Qualified.** This works if you accept the Likeness approach. However, because of the Language Dependence problem, we can never *know* for sure if verisimilitude is increasing, only conjecture it. It shifts progress from "what we know" to "what we hope is true."
  *   **Confidence:** Medium. It depends on solving the Language Dependence problem.

  **3. Defense of Scientific Realism (Weak/Overrated)**
  *   **Claim:** Verisimilitude saves Realism from the Pessimistic Meta-Induction (the argument that past false theories imply current ones are false too).
  *   **Verdict:** **Overrated.** Verisimilitude helps Realists say "Past theories were false but *close*." However, because we cannot access the "Truth" to calculate the distance, verisimilitude is epistemically inaccessible. It explains what progress *is*, but not how we *detect* it. It doesn't prove the world is as our theories say; it just gives us a way to talk about error.
  *   **Confidence:** High. Don't let your friend use verisimilitude as a shield for naive realism. It's a tool for describing error, not a proof of truth.

  ---

  ### Summary of Corrections & Confidence

  1.  **Is the problem solved?** **No.** (High Confidence). The Stanford Encyclopedia of Philosophy and major handbooks still list it as an active area of debate. Your friend is presenting a specific formal solution (likely Niiniluoto's) as a consensus closure.
  2.  **Is Minsum a Content measure?** **No.** (High Confidence). It is a Likeness measure. If your friend insists it is content-based, they are technically incorrect about the taxonomy.
  3.  **Do No-Go results rule out Content measures?** **Yes.** (High Confidence). Miller-Tichý effectively ruled out the simple Popperian content difference for false theories.
  4.  **Does Minsum satisfy the "More-True" principle?** **Yes, mostly.** (Medium-High Confidence). Likeness measures handle this better than content measures, but they inherit the Language Dependence vulnerability.

  **The Bottom Line:** Your friend has a hammer (Minsum) and thinks every problem is a nail. They have a way to generate a number, but they haven't justified *why* that number maps to reality rather than just mapping to a specific logical framework. You are right to demand that the measure respect the "more-true" intuition, but you should pivot your argument to **Language Dependence**. That is the place where the "solved" claim crumbles. Ask your friend: *"If I rewrite your theory using Grue/Bleen predicates, does your minsum score stay the same? If not, you're measuring language, not truth."*
