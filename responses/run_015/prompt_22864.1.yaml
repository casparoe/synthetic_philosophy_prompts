answer: |-
  This is one of the most classic "aha!" moments in information economics, and you are definitely not alone in hitting this wall. Your intuition is actually correct *up to a point*: Agent 20 *does* have access to more public history than Agent 2. If the system were working perfectly, Agent 20 should indeed be making a more informed decision.

  The breakdown in your intuition lies in the distinction between **observing actions** versus **observing signals**, and the resulting **informational loss** that occurs when rational agents ignore their private information.

  Here is the breakdown of why the "Wisdom of Crowds" fails in the BHW model, why Agent 20 isn't actually standing on the judgment of 19 predecessors, and why the cascade is so fragile.

  ### 1. The Bottleneck: Actions vs. Signals
  The core friction in the BHW model is that agents observe **actions** (Adopt/Reject), but the underlying truth depends on **signals** (High/Low).

  *   **Agent 1:** Their action perfectly reveals their signal. (If they Adopt, you know they saw $H$).
  *   **Agent 2:** They combine Agent 1's signal + their own signal. Their action reveals the *sum* of those two signals.
  *   **Agent 3:** Here is the tipping point. Suppose Agent 1 and 2 both Adopted. The public belief is now strong. If Agent 3 receives a Low signal ($L$), a Bayesian calculation might show that the weight of the two previous Adopts outweighs their single $L$ signal. So, Agent 3 Adopts *despite* having an $L$ signal.

  **This is the critical moment of information loss.**
  When Agent 4 observes Agent 3, they see an "Adopt." Agent 4 assumes this means Agent 3 had a positive view of the truth. But Agent 4 cannot distinguish whether Agent 3 Adopted because they saw $H$ or because they saw $L$ but followed the crowd.

  **Agent 3's private signal is effectively deleted from the public record.**

  ### 2. The "Informational Blackout"
  Once a cascade begins (say, at Agent 3), every subsequent agent (4, 5, ... 20) faces the same calculation. The public history is now so heavy that *no single private signal* can overturn it.

  Therefore, every agent from 3 to 20 will choose the same action **regardless of their private signal.**

  *   **Your Intuition:** Agent 20 stands on the accumulated judgment of 19 predecessors.
  *   **The BHW Reality:** Agent 20 stands on the accumulated judgment of **only the first 2 predecessors.**

  Agents 3 through 19 contributed **zero** new information to the public pool. Their actions were predetermined by the history they inherited, not by their private knowledge. Agent 20 is not making a decision based on 20 signals; they are making a decision based on 2 signals (plus their own).

  This is why the sequence does **not** converge to the truth like a sample average. A sample average requires $N$ independent data points. In a cascade, you effectively have $k$ data points (where $k$ is the number of agents before the cascade started), regardless of how large $N$ gets.

  ### 3. Wisdom of Crowds vs. Informational Cascades
  Your group mate is right, but here is the precise theoretical distinction:

  *   **Wisdom of Crowds:** Requires **independence**. If 1,000 people vote simultaneously based on private signals, the errors cancel out, and the average converges to the truth (Condorcet Jury Theorem).
  *   **Informational Cascades:** Rely on **sequential dependence**. Agent 20 is not independent of Agent 3. Because Agent 20 rationally ignores their own signal to follow Agent 3, their decision is correlated with Agent 3's decision, not just with the truth.

  Rationality is actually the *cause* of the problem here. It is individually rational for Agent 3 to ignore their signal if the public prior is strong enough. But this individual rationality creates a negative externality: by not revealing their signal through their action, they deprive Agent 4 of information.

  ### 4. Why is it Fragile?
  You asked: *"If each agent is rationally building on the entire history, why would the group's final decision ever be worse than just... averaging everyone's private signals directly?"*

  Because the "entire history" is an illusion. The cascade is resting on a very thin foundation.

  In the standard binary signal model, a cascade often triggers when there is a net difference of just **one or two signals** (e.g., two Adopts and one Reject). The entire crowd of 1,000 people might end up Adopting based on a net margin of +2 early signals.

  *   **Fragility:** Because the public belief is based on such a small effective sample size, it is vulnerable. If a "contrarian" appears (either because they have a stronger signal, or in extended models, because there is a probability they are a noise trader), they reveal that the public certainty was unfounded.
  *   **The Contrarian Effect:** If Agent 21 suddenly Rejects, it signals to Agent 22 that Agent 21 must have had an incredibly strong signal (strong enough to overcome the public prior). This instantly resets the public belief. The "fragility" comes from the fact that the cascade was never supported by the 1,000 signals; it was supported by the 3 signals that started it.

  ### 5. Summary for your Seminar
  To reconcile your view with your group mate's, you can frame it this way:

  1.  **Individual vs. Social Efficiency:** Agent 20 is making the best *individual* decision given their information set (Bayesian rationality holds). However, the *social* mechanism for aggregating information has broken down.
  2.  **Effective Sample Size:** The group behaves as if only the first few agents existed. The "Wisdom of Crowds" fails because the crowd stops contributing wisdom once the cascade begins.
  3.  **Path Dependence:** The final outcome depends heavily on the order of the first few agents. If the first two agents had gotten different signals, the cascade might have gone the other way. The system locks in early noise.

  **The "Wall" you hit:** You were assuming that observing an action is equivalent to observing the information that generated the action. In BHW, **actions are coarse filters.** Once the filter saturates (the cascade), the flow of information stops, even though the line of agents continues.

  This is why BHW is often summarized as: **"Rational individuals can collectively generate inefficient outcomes."** It's not a bug in their rationality; it's a feature of the information structure.
