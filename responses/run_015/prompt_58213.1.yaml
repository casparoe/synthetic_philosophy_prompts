answer: |-
  ### Decision Under Moral Uncertainty: Expectation vs. Constraint

  When an agent is uncertain about which moral theory is true, rationality demands a decision procedure that respects that uncertainty without leading to paralysis or moral catastrophe. Two dominant proposals address this: the **Expectational Proposal** (often called Maximizing Expected Choice-worthiness, or MEC) and the **Constraint Proposal** (a form of moral veto or precautionary principle). The Expectational Proposal treats moral uncertainty analogously to empirical uncertainty, aggregating weighted values across theories. The Constraint Proposal prioritizes the avoidance of actions deemed "grave wrongs" by sufficiently credible theories, regardless of their expected value.

  This essay compares these proposals across three stylized cases involving dietary ethics, population ethics, and risk imposition. It argues that while the Expectational Proposal offers a unified formalism, it fails to handle intertheoretic comparison and fanaticism. The Constraint Proposal better captures the deontic structure of moral deliberation but requires a threshold mechanism to avoid paralysis. A **Hybrid Threshold Model** offers the most satisfactory account.

  ---

  ### 1. The Proposals Defined

  **The Expectational Proposal (MEC)**
  This approach extends standard decision theory to moral uncertainty. The agent assigns a "choice-worthiness" value to every option under every moral theory. Because theories use different scales (e.g., utilitarianism vs. virtue ethics), these values must be *normalized* to allow comparison. The agent then calculates the expected choice-worthiness of each option by weighting these normalized values by their credence in each theory. The rational action is the one with the highest sum.
  *   *Key Feature:* Moral uncertainty is structurally identical to empirical uncertainty; trade-offs are always permissible.

  **The Constraint Proposal**
  This approach posits that some moral norms function as side-constraints rather than value-maximizers. The agent first identifies any option that a "sufficiently credible" theory classifies as a "grave wrong." These options are vetoed. Among the remaining permissible options, the agent may then use an expectational calculation to choose the best.
  *   *Key Feature:* Moral uncertainty preserves a distinction between "maximizing good" and "avoiding wrong"; some trade-offs are forbidden.

  ---

  ### 2. Analysis of Stylized Cases

  #### Case 1: The Dietary Practice
  *Scenario:* High credence (90%) that eating meat is permissible/beneficial; modest credence (10%) that it is a serious wrong (animal suffering).
  *   **Expectational:** The outcome depends entirely on normalization. If the "serious wrong" of killing is normalized as merely 10 units of negative value versus 1 unit of dietary benefit, the agent eats meat. If the wrong is normalized as 1000 units, the agent abstains. MEC provides no intrinsic guidance on the *scale* of suffering versus dietary pleasure across theories.
  *   **Constraint:** If the agent deems 10% credence "sufficient" and the theory classifies meat-eating as a "grave wrong" (e.g., murder), the option is vetoed. The dietary benefit is irrelevant.
  *   **Divergence:** MEC allows the majority view to override the minority view if the stakes are normalized low enough. Constraint allows the minority view to veto the majority if the stakes are deontically high enough.

  #### Case 2: Population Ethics
  *Scenario:* High credence (90%) in Person-Affecting View (PAV) (creating lives matters little, costs to existing people matter); Low credence (10%) in Total View (TV) (creating flourishing lives is enormous good). Acting on TV imposes significant costs on existing people.
  *   **Expectational:** The Total View often implies that adding lives creates massive (potentially infinite) positive value. Even at 10% credence, 10% of Infinite (or Massive) Value outweighs 90% of Moderate Cost to existing people. MEC likely demands imposing costs on existing people to create new ones. This leads to the "Fanaticism Problem."
  *   **Constraint:** The PAV likely regards imposing significant costs on existing people without their consent as a rights violation or "grave wrong." Since PAV has high credence (90%), this constraint is triggered. The potential good of the TV is irrelevant because the means are vetoed.
  *   **Divergence:** MEC sacrifices existing interests for speculative greater goods. Constraint protects existing interests against being used as means.

  #### Case 3: Risk and Outcomes
  *Scenario:* Uncertainty between Consequentialism (actual outcomes matter) and Risk-Deontology (imposing unjustified risk is intrinsically wrong).
  *   **Expectational:** If the risk does not materialize, Consequentialism assigns high value. Risk-Deontology assigns negative value. MEC averages these. If the good outcome is likely enough, MEC justifies the risk imposition.
  *   **Constraint:** If Risk-Deontology is sufficiently credible, the *act* of imposing the risk is vetoed, regardless of whether the harm materializes.
  *   **Divergence:** MEC justifies reckless behavior if the gamble pays off in expectation. Constraint judges the action by its ex-ante moral status, not its ex-post outcome.

  ---

  ### 3. Systematic Comparison

  #### Low-Credence Theories with Extreme Stakes
  The most significant divergence concerns how each proposal handles "moral fanaticism."
  *   **Expectational:** Vulnerable to Pascal's Mugging. If a low-credence theory posits astronomically high stakes (e.g., Case 2's infinite population value, or a theological theory about eternal damnation), MEC demands we prioritize that theory over high-credence theories with mundane stakes. This is counterintuitive; rationality should not be held hostage by low-probability, high-magnitude claims that cannot be empirically verified.
  *   **Constraint:** More robust. If the low-credence theory demands an action that a high-credence theory forbids as a grave wrong, the Constraint Proposal vetoes the action. It prevents low-credence fanaticism from overriding high-credence prohibitions. However, if the low-credence theory claims *not* acting is the grave wrong (e.g., failing to save the infinite value), the Constraint Proposal may face a dilemma if the high-credence theory forbids the necessary means.

  #### Moral vs. Empirical Uncertainty
  *   **Expectational:** Collapses the distinction. It treats the probability that "killing is wrong" exactly like the probability that "the bridge will collapse." Both are just inputs into an expected value function. This fails to capture the normative force of moral prohibitions, which often claim authority regardless of probabilistic calculations.
  *   **Constraint:** Preserves the distinction. Empirical uncertainty affects the likelihood of outcomes; moral uncertainty affects the *permissibility* of the action itself. The Constraint Proposal acknowledges that being 10% sure an action is murder is qualitatively different from being 10% sure a bridge will fall. The former triggers a normative veto; the latter triggers a risk calculation.

  #### Intertheoretic Comparison
  *   **Expectational:** Requires a "common currency" of value. There is no agreed-upon metaphysical method to normalize utilitarian utils against Kantian duties. This makes MEC practically indeterminate without arbitrary stipulations.
  *   **Constraint:** Avoids this by relying on ordinal rankings (forbidden vs. permitted) rather than cardinal values. It only requires knowing if a theory deems an action a "grave wrong," not *how much* wrong it is relative to other theories.

  ---

  ### 4. Verdict and Proposed Hybrid

  **The Verdict**
  The **Constraint Proposal** offers the more satisfactory general account. It aligns better with moral phenomenology (the sense that some acts are off-limits), avoids the normalization problem, and protects against moral fanaticism. However, in its pure form, it faces two critical flaws:
  1.  **Paralysis:** If Theory A forbids $X$ and Theory B forbids $\text{not-}X$, and both are sufficiently credible, the agent cannot act.
  2.  **Vagueness:** "Sufficiently credible" and "grave wrong" are undefined thresholds.

  **The Revision: A Hybrid Threshold Model**
  To handle the hardest cases, the Constraint Proposal should be revised into a **Hybrid Threshold Model**. This model incorporates the following mechanisms:

  1.  **Credence-Weighted Constraints:** A constraint applies only if $\text{Credence}(T) \times \text{Severity}(T) > \text{Threshold}$. This allows high-severity wrongs to veto actions even at lower credences (addressing Case 1: 10% credence in murder is enough to veto), while preventing low-credence fanaticism from vetoing actions (addressing Case 2: 10% credence in infinite value does not veto the constraint against harming existing people).
  2.  **Conflict Resolution via Expectation:** When constraints conflict (moral dilemma), or when no constraints are triggered, the agent reverts to the Expectational Proposal among the remaining options. This solves paralysis.
  3.  **Risk-Sensitive Normalization:** For the expectational phase, use a normalization method that discounts variance. This reduces the influence of extreme-stakes/low-credence theories without needing a hard veto.

  **Application to Hard Cases:**
  *   *Dietary:* The severity of "murder" (animal) is high. Even at 10% credence, the weighted constraint exceeds the threshold. Meat-eating is vetoed.
  *   *Population:* The severity of harming existing people is high (rights violation). The 90% credence in PAV triggers the constraint. The 10% credence in TV (even with high stakes) cannot override the constraint against rights violations because the TV does not view the *costs* as permissible, but the PAV views the *action* as forbidden. The constraint holds.
  *   *Risk:* If the risk involves potential grave harm (death), the credence in the Risk-Deontological theory needed to trigger a veto is low. The agent is forbidden from imposing the risk, regardless of the Consequentialist expected value.

  ### Conclusion

  The Expectational Proposal fails because it treats moral norms as mere values to be traded, leading to counterintuitive sacrifices of rights for expected utility and relying on impossible intertheoretic comparisons. The Constraint Proposal correctly identifies that moral uncertainty involves uncertainty about *permissions* and *prohibitions*, not just values. However, to be action-guiding, it must be hybridized. By applying constraints only when the product of credence and severity crosses a threshold, and using expectational reasoning to resolve conflicts or choose among permissible options, an agent can navigate moral uncertainty without becoming a fanatic or a paralytic. This Hybrid Threshold Model preserves the principled difference between moral and empirical uncertainty while ensuring rational decisiveness.
