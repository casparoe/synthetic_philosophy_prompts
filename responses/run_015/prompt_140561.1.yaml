answer: |-
  This is an excellent summary of the *popular* presentation of Everettian Quantum Mechanics (EQM), likely drawing from Sean Carroll's *Something Deeply Hidden* or similar expositions. It captures the *spirit* of the view accurately but conflates two distinct technical programs and smooths over the sharpest philosophical edges.

  Your suspicion is not confused; it is the central objection raised by non-Everettian philosophers of physics (like Adrian Kent, Huw Price, and David Albert).

  Here is the audit of the claims, sorted by how a working philosopher of physics specializing in EQM (e.g., David Wallace, Simon Saunders, Charles Sebens) versus a critic would treat them.

  ### 1. The Orthodoxy (Green Light)
  *Claims a working Everettian would accept without significant qualification.*

  *   **"Every outcome with nonzero amplitude happens... no collapse and no fundamental randomness."**
      *   **Verdict:** **Accepted.** This is the definition of the interpretation.
      *   **Confidence:** High.
  *   **"...universal wavefunction just evolves deterministically."**
      *   **Verdict:** **Accepted.** Unitary evolution is the only dynamics.
      *   **Confidence:** High.
  *   **"...appearance of randomness is an illusion created by decoherence splitting the world into branches that can't see each other."**
      *   **Verdict:** **Accepted, with technical caveat.** "Splitting" is often deprecated in favor of "branching structure emerging from decoherence." Strictly, the wavefunction doesn't split; the *basis* in which the state is diagonalized becomes robust. But for the purpose of the probability argument, this is standard.
      *   **Confidence:** High.
  *   **"...there's always some version of you that sees a million heads in a row — it's just extremely low-measure, so you shouldn't plan around it."**
      *   **Verdict:** **Accepted.** This is a standard consequence. The "maverick worlds" exist but have negligible measure.
      *   **Confidence:** High.

  ### 2. The Conflations (Yellow Light)
  *Claims that mix two distinct approaches or use imprecise terminology that professionals would correct.*

  *   **"The now-standard Everettian answer is that you have self-locating uncertainty."**
      *   **Verdict:** **Contested/Conflated.** There are **two** main camps on probability in EQM, and this sentence mixes them.
          1.  **Decision-Theoretic (Deutsch-Wallace):** Probability is not about uncertainty of *what happens* (everything happens), but about how a rational agent *weights* their preferences across branches. They generally **reject** self-locating uncertainty as the foundation.
          2.  **Self-Locating Uncertainty (Vaidman, Sebens-Carroll):** Argues that there *is* a period of genuine uncertainty (e.g., after branching but before the observer looks at the result).
          *   **Correction:** A Wallace-style Everettian would say: "Self-locating uncertainty is one approach, but the Decision-Theoretic program is designed specifically to avoid needing it." A Sebens-Carroll proponent would say: "Decision theory is useful, but it rests on the prior fact of self-locating uncertainty."
      *   **Confidence:** High (that this is a conflation).
  *   **"Before a measurement you don't know which branch you're going to end up on..."**
      *   **Verdict:** **Rejected by strict Deutsch-Wallace proponents.** If branching is deterministic, "you" (the pre-measurement agent) evolve into *both* successors. There is no fact of the matter about which one "you" are, because you are both. Uncertainty is only coherent *after* the split but *before* observation (the Vaidman view), or it is replaced entirely by decision-theoretic weighting.
      *   **Confidence:** High.

  ### 3. The Danger Zones (Red Light)
  *Claims that are either pop-sci distortions, highly contested, or rejected by the very authors cited.*

  *   **"The squared amplitude is really a kind of measure of existence: branches with larger amplitude are, in some sense, more real or thicker or take up more of the multiverse..."**
      *   **Verdict:** **Rejected / Wince-Inducing.**
      *   **Why:** David Wallace explicitly argues **against** this. In *The Emergent Multiverse*, he stresses that all branches are equally real. The "measure" is not ontological density ("thickness"); it is a **normative weight** for decision making. To say a branch is "more real" undermines the claim that MWI is parsimonious (it reintroduces a hidden variable: "reality density").
      *   **Nuance:** Lev Vaidman *does* use the term "measure of existence," but he is careful to distinguish it from probability. The pop-sci summary treats this metaphor as the *explanation* for the Born rule, which most technical Everettians deny. The measure is derived, not a primitive property of "thickness."
      *   **Confidence:** High (that Wallace would reject "thicker").
  *   **"...which settles it — the Born rule is now a theorem of many-worlds rather than an assumption."**
      *   **Verdict:** **Highly Contested.**
      *   **Why:** This is the claim that causes the most friction outside the EQM bubble. Inside the bubble, it is the dominant view. Outside, it is widely regarded as unproven. Even inside, there is debate over whether it solves the *Incoherence Problem* (how probability makes sense) or just the *Quantitative Problem* (why squared amplitude).
      *   **Confidence:** High (that this is the main point of contention).
  *   **"Collapse models and Bohmian mechanics, by contrast, have to put the Born rule in by hand, so Everett wins on parsimony."**
      *   **Verdict:** **Contested Metaphysical Claim.**
      *   **Why:** Bohmians argue the Quantum Equilibrium Hypothesis is dynamically stable (like thermal equilibrium), not "bolted on." GRW proponents argue the collapse rate *is* the mechanism. Everettians claim derivation from unitary dynamics is more parsimonious. This is a comparative judgment call, not a settled fact.
      *   **Confidence:** Medium (depends on your metric for parsimony).

  ---

  ### Addressing Your Suspicion: Is the Derivation Circular?

  Your suspicion is **correct and load-bearing**. This is the exact crux of the philosophical debate.

  **The Charge:** Critics (Adrian Kent is the most prominent here) argue that the Deutsch-Wallace axioms (specifically *Diachronic Consistency* or *Substitutivity*) implicitly assume the conclusion. They argue that to say a rational agent *should* maximize expected utility using the Born weights is to assume that those weights *function as probabilities* in the first place. If you don't already treat amplitude squared as a probability-like guide to action, the axioms don't compel you.

  **The Defense:** Wallace argues the axioms are about **preference ordering**, not probability. He claims he only assumes that agents prefer more reward to less, and that they treat physically identical situations identically (Symmetry). He argues that once you accept the branching structure, *any* weighting scheme other than Born leads to diachronic inconsistency (you would make plans now that your future selves would unanimously reject).

  **The Verdict:**
  *   **Is it a mathematical theorem?** Yes, *given the axioms*.
  *   **Are the axioms "obviously rational"?** This is the dispute.
      *   **Confidence:** High.
      *   **The "Smuggling":** Critics say the axiom of "Branching Indifference" (that you shouldn't care about branching per se, only about the rewards on the branches) smuggles in the probabilistic worldview. If I care about the *number* of branches I win in (branch counting), rather than the *measure*, the derivation fails. Wallace argues branch counting is ill-defined (due to the continuous nature of decoherence), but critics argue this is a convenience for the theory, not a rational necessity.

  **Would a professional disagree with you?**
  If you say "The Deutsch-Wallace argument assumes what it sets out to prove," a Wallace-style Everettian will say you are mischaracterizing the axioms (they are about preference, not belief). A critic will say you have identified the fatal flaw. **You are in good company with your suspicion.** It is the standard objection.

  ### The "Measure of Existence" Metaphor

  You asked if "thicker/more real" is a term of art.
  *   **Status:** It is a **dangerous metaphor** often used in pop-sci (and by Vaidman cautiously) but **rejected** by the decision-theoretic camp (Wallace, Greaves).
  *   **Why it matters:** If branches have different "amounts of reality," MWI starts to look like a hidden-variable theory where the "variable" is reality-density. The pure Everettian view is that all branches are equally real, but they have different **weights** in the calculus of rational action.
  *   **Correction:** If you read Wallace, he will scream at the phrase "more real." He insists the measure is analogous to *temporal duration* in a single world. (e.g., If you live 10 years happy and 1 year sad, the happy part isn't "more real," but it weighs more in your life's total utility).

  ### Summary of the State of the Field

  If you want the honest audit rather than the polite version:

  1.  **Is the Born Rule derived in MWI?**
      *   **Everettian Consensus:** Yes, via Decision Theory or Self-Locating Uncertainty.
      *   **General Philosophy of Physics Consensus:** No. It is widely viewed as an open problem. The derivations are seen as compelling *if* you already accept the Everettian metaphysical framework, but they do not generally convince skeptics to adopt the framework.
  2.  **Is the "Smuggling" objection valid?**
      *   It is a **live, unresolved dispute**. There is no knock-down refutation of the circularity charge that satisfies non-Everettians. The Everettian response is generally: "It's not circular, it's constitutive. This is what probability *is* in a branching universe."
  3.  **Does MWI win on Parsimony?**
      *   **Debatable.** It removes the Collapse Postulate but adds a massive ontological cost (infinite worlds) and a massive conceptual cost (deriving probability). Whether that is a net gain is a value judgment, not a calculation.

  ### What would change my mind?
  *   **On the Derivation:** If a derivation were produced that did not rely on decision-theoretic axioms regarding preference, but derived the Born rule purely from the symmetries of the Hilbert Space without invoking "rational agents," the circularity charge would lose force. (Some attempts exist, e.g., Zurek's Envariance, but they have their own controversies).
  *   **On the "Thickness":** If decoherence theory showed that branch count was well-defined and discrete, the "measure vs. count" debate would be settled (likely killing MWI, as branch count doesn't match Born weights). Since branch count is ill-defined, the "measure" is required, but its interpretation remains the battleground.

  **Bottom Line:** Your summary is a faithful representation of the *Everettian sales pitch*, but it presents contested philosophical arguments as settled physics. Your suspicion about the decision-theoretic jump is the exact point where the literature fractures.
