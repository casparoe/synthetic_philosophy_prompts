      *   *Correction on "Thicker":* Lev Vaidman *does* use "measure of existence." But David Wallace *does not*. The user's summary attributes the "thicker" view to the "now-standard Everettian answer" alongside Deutsch-Wallace. This is a conflation. I need to point out that "thicker worlds" is a minority view (or at least distinct from the decision-theoretic mainstream).
