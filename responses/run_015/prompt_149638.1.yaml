      *Refining the "Unitary Causal Agent" point:* It's not just that they are big. It's that "China" functions as a civilization/category, while "Britain" functions as a state/economy. The causal mechanisms operating on a state (taxation, war) differ from those operating on a civilization (cultural norms, demographic regimes).

      *Refining the "Salvage" section:* If we compare *state capacity*, we can save it. But does that answer "Why Industrialization?" Industrialization is economic/technological. State capacity is political. So the link is tenuous. I will argue the salvage attempt fails to answer the specific economic question.

