          4.  **Argument:** Disaggregating to regional-sectoral levels (e.g., Northern England vs. Lower Yangtze) dissolves the macro-contrast into non-parallel local explanations.
          5.  **Evaluation:** Assess if the original framing can be salvaged (methodological adjustments) or should be abandoned. Weigh objections from Great Divergence scholars (macro-institutional defense).
          6.  **Conclusion:** Reach and justify a clear conclusion.
          7.  **Constraint:** No bibliographies, reading lists, or citations. Focus on conceptual structure.

  2.  **Brainstorming: Formal Conditions for Well-Posed Contrastive Questions:**
      *   *Contrast Class:* The foil (Y) must be a genuine possibility relative to the fact (X). It can't be logically impossible or historically unreachable given the initial conditions.
      *   *Causal Parity:* The explanatory factors for X and the absence of X in Y must be commensurable. If X is caused by factor A, Y's lack of X must be explainable by the lack of A or presence of B, where A and B are comparable types of causes.
      *   *Unit Homogeneity:* The units being compared (Britain, China) must function similarly in the causal model. If "Britain" is a policy-making state and "China" is a cultural sphere, they aren't comparable units.
      *   *Temporal Alignment:* The timeframe for X and the potential for Y must overlap.
      *   *Specificity:* "Industrialization" must mean the same thing in both contexts.
      *   *Agency/Structure:* Are we comparing decisions, structural constraints, or environmental luck? The level of analysis must match.
      *   *Key Insight for this prompt:* The "Unit Homogeneity" condition is the weak point in the Needham question. "Britain" and "China" are not ontologically equivalent categories at the macro scale.

  3.  **Drafting the Essay - Section by Section:**

      *   **Introduction:**
          *   Hook: The enduring power of the Needham Question.
          *   Problem Statement: It's usually critiqued for Eurocentrism. I will critique it for *ontological mismatch*.
          *   Thesis: The question is ill-posed because it reifies heterogeneous spaces into unitary agents. Disaggregation dissolves the puzzle.

      *   **Part 1: The Logic of Contrastive Explanation (The Brainstorming Output):**
          *   Define "Why X rather than Y?"
          *   Condition 1: Causal Commensurability (same type of causes).
          *   Condition 2: Counterfactual Viability (Y was possible).
          *   Condition 3: *Unit Equivalence* (The crucial one). The subjects must occupy the same causal role.
          *   Apply this to History: Nations are often poor proxies for causal mechanisms.

      *   **Part 2: Deconstructing the Units (Britain vs. China):**
          *   "Britain" in 1750: Small, integrated, coal-rich periphery, specific property rights, parliamentary sovereignty.
          *   "China" in 1750: Vast, multi-climatic, empire, core-periphery dynamics (Lower Yangtze vs. Interior).
          *   The Mismatch: Comparing an island kingdom to a continental empire. Comparing a specific industrial region to a civilization state.
          *   The "Unitary Agent" Fallacy: Assuming "China" made a decision or had a single economic trajectory.

      *   **Part 3: Disaggregation (The Regional-Sectoral Shift):**
          *   Shift the lens: Northern England (Lancashire/Staffordshire) vs. Lower Yangtze (Jiangnan).
          *   Now we compare similar economic zones.
          *   Result: The "Great Divergence" looks less like a chasm and more like a narrow gap that widened due to specific resource contingencies (coal location) and global conjunctures (New World), not deep institutional destiny.
          *   The explanations become local and non-parallel (geology vs. trade networks) rather than systemic (capitalism vs. feudalism).

      *   **Part 4: Objections and Salvageability:**
