          *   *Rebuttal:* Institutions are also local. Enforcement varies. The "Chinese State" didn't prevent Jiangnan from industrializing; the *cost* of energy did.
          *   *Can it be salvaged?* Only if we redefine the terms. If "Britain" = "Fiscal-Military State Capacity" and "China" = "Imperial Bureaucratic Capacity," we can compare *regimes*. But this abandons the geographic determinism of the original question.
          *   *Verdict:* The geographic/national framing should be abandoned for a functional/regional framing.

      *   **Conclusion:**
