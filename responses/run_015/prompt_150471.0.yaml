  This is a sophisticated structuralist position, aligning with Hofstadter's fluid concepts, Gestalt psychology, and modern distributed representation theories (like embedding spaces in deep learning), while rejecting classical feature-detection models (like Biederman's RBC or Hubel/Wiesel hierarchies).

  To provide the "honest exposure map" you requested, we must distinguish between evidence that contradicts the *mechanism* (relational mapping) versus evidence that contradicts the *scope* (font-specificity).

  Here is the ranking of defeaters from fatal to cosmetic, followed by the concessions required and the unique predictions the theory must make to remain scientific.

  ---

  ### I. The Exposure Map: Ranking the Defeaters

  #### 1. Fatal Defeaters (Falsification)
  These results would demonstrate that recognition occurs *prior* to or *independently* of relational normalization.

  *   **Immediate Novel-Font Recognition (The "Single-Glyph" Problem):**
      *   **The Claim:** Your view implies an "a" is defined by its difference from "b," "c," etc., *within* a specific typeface.
      *   **The Defeater:** If human subjects can accurately identify a lowercase "a" in a radically novel typeface (one they have never seen) when presented **in isolation** (without seeing the rest of the alphabet to establish the relational network), the "font-specific relational" claim is false.
      *   **Why Fatal:** It proves the brain possesses a generalized, transferable schema for "a-ness" that does not require recalibrating against the local alphabet set. It suggests invariant structural primitives exist, even if they aren't simple geometric contours.
  *   **Neural Invariance Without Context:**
      *   **The Claim:** Recognition is analogical mapping, not feature detection.
      *   **The Defeater:** Neurophysiological evidence (e.g., in the Visual Word Form Area) of neurons that fire selectively for the *concept* "a" across radically different fonts *without* requiring context from surrounding letters or prior exposure to the font family.
      *   **Why Fatal:** This would indicate a "labeled line" or invariant detector exists, rendering the relational mapping an epiphenomenon rather than the mechanism of recognition.
  *   **Dissociation of Style and Identity:**
      *   **The Claim:** Style and identity are co-constituted relationally.
      *   **The Defeater:** Evidence that observers can strip style from identity *pre-attentively*. If I can search for an "a" in a mixed-font array as quickly as in a single-font array, the "font-specific style space" normalization is not a prerequisite for recognition.

  #### 2. Awkward Defeaters (Theoretical Strain)
  These results do not falsify the view but force complex ad-hoc adjustments.

  *   **Cross-Script Literacy (Latin "a" vs. Cyrillic "а"):**
      *   **The Challenge:** You asked if recognizing the Cyrillic 'а' (which looks like Latin 'a' but holds a different relational role in Cyrillic) undermines the analogy.
      *   **Verdict:** **Not Fatal, but Strained.** A defender can argue this is *higher-order* analogy (mapping the Latin network to the Cyrillic network). However, if this mapping happens instantly without bilingual training, it suggests the "geometric essence" you deny is actually doing the heavy lifting. It forces the defender to posit a "meta-relational" layer that looks suspiciously like a feature list.
  *   **Success of Feature-Based OCR:**
      *   **The Challenge:** Machines recognize fonts using invariant feature vectors.
      *   **Verdict:** **Cosmetic.** Existence proofs in engineering do not dictate biological implementation. However, if the most efficient computational solution (transformers/CNNs) converges on invariant feature extraction in early layers, it weakens the argument that relational mapping is the *necessary* solution to the problem.

  #### 3. Cosmetic Defeaters (Irrelevant)
  *   **Subjective Reports:** People saying "I just see an 'a'." (Introspection is unreliable regarding processing).
  *   **Historical Precedence:** The fact that printing presses treated letters as invariant blocks. (Cultural artifacts $\neq$ cognitive architecture).

  ---

  ### II. The Unfalsifiability Trap

  You asked: *"Is the view protected by the retreat that any apparently invariant feature is just a compressed relational summary?"*

  **Yes, this is a critical vulnerability.**

  If every time a critic points to an invariant feature (e.g., "the counter is closed"), the defender replies, "That is just a compressed summary of the relation between the stem and the bowl," the theory becomes tautological. It risks becoming a "no true Scotsman" of geometry.

  **To avoid this, the defender must specify:**
  1.  **What counts as a primitive relation?** (e.g., "above," "inside," "connected"). If the list of allowed relations becomes as long as the list of forbidden features, you have just reinvented feature theory with extra steps.
  2.  **What is the cost of mapping?** Analogical mapping is computationally expensive. If recognition is as fast as feature detection (150ms), the theory must explain how the relational network is accessed so quickly without a feature-based index.

  **The Concession:** A honest defender must concede that **low-level geometric regularities likely exist** (e.g., topological properties like connectedness or holes). The claim should not be "no geometric essence," but rather "geometric essence is insufficient without stylistic normalization."

  ---

  ### III. Unique Predictions (The "Cash Value")

  For this view to be scientifically viable, it must predict phenomena that feature-based theories do not. Here are three specific predictions:

  #### 1. The "Font Priming" Effect
  *   **Feature Theory:** Recognizing an 'a' should be independent of seeing a 'g' in the same font.
  *   **Relational Theory:** Seeing a highly stylized 'g' should *facilitate* the recognition of a stylized 'a' in the same font, because it establishes the "style space" parameters.
  *   **Experiment:** Measure reaction times for identifying an ambiguous glyph as 'a'. Condition A: Preceded by other letters from the same novel font. Condition B: Preceded by letters from a different font. Relational theory predicts significantly faster recognition in Condition A; Feature theory predicts no difference.

  #### 2. The "Missing Neighbor" Distortion
  *   **Feature Theory:** An 'a' is an 'a' regardless of whether 'b' exists.
  *   **Relational Theory:** If you remove specific "contrastive" letters from a set, the recognition boundary for 'a' should shift.
  *   **Experiment:** Train subjects on a novel alphabet where the glyph for 'b' is morphologically very close to 'a'. Then test recognition of 'a'. The theory predicts the category boundary for 'a' will shrink or distort to maximize distance from 'b'. If 'b' is removed from the set, the 'a' category should expand. Feature theory predicts stable category boundaries.

  #### 3. Cross-Font Interference in Ambiguity
  *   **Feature Theory:** Ambiguity is local to the glyph's features.
  *   **Relational Theory:** Ambiguity is resolved by the *consistency* of the network.
  *   **Experiment:** Present a glyph that is 50% 'a' / 50% 'o'. Surround it with a font family where 'a' is highly distinct from 'o', versus a font family where they are similar. Relational theory predicts the surrounding context (the established style space) will force a categorical decision more strongly than local features alone.

  ---

  ### IV. Summary: What the Defender Must Concede

  To maintain intellectual honesty, a defender of the relational-style account must concede the following:

  1.  **Topological Invariants:** You cannot deny *all* geometry. A circle is not an 'a'. You must admit that topological constraints (e.g., "has a closed loop," "has a vertical stem") act as necessary filters *before* relational mapping occurs.
  2.  **Speed Constraints:** You must explain how relational mapping happens in ~150ms. This likely requires conceding that the "relational network" is pre-compiled in long-term memory, not computed de novo for every font.
  3.  **The "Prototype" Compromise:** The view is strongest if framed as **Prototype + Adjustment**. There is a canonical "a" (feature-based), but its *instantiation* is relationally modulated by the font context. Pure relationalism (no prototype) is likely falsified by the "Immediate Novel-Font" defeater.

  ### Final Ranking of Defeaters

  1.  **Fatal:** Accurate identification of a single glyph in a novel font without context (Proves invariant schema exists).
  2.  **Fatal:** Neural evidence of context-independent "letter detectors" in IT cortex.
  3.  **Awkward:** Instant cross-script recognition without bilingual training (Suggests geometric essence overrides relational role).
  4.  **Manageable:** Success of feature-based OCR (Engineering $\neq$ Cognition).
  5.  **Cosmetic:** Introspective reports of "seeing features."

  **Verdict:** Your view is philosophically robust but empirically vulnerable to **speed and isolation** data. To survive, it must retreat from "no geometric essence" to "geometric essence is subordinate to stylistic context," and it must demonstrate that context actually *changes* perception (which it does, per the predictions above), not just aids it.
