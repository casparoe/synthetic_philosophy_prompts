answer: |-
  Here are the desiderata for a theory of demons that won't get your novel thrown across the room. This is built on modern **Information Thermodynamics** (Sagawa-Ueda, Parrondo, etc.), not the pop-sci version.

  ### The Desiderata

  **1. Global Entropy Balance (Non-negotiable)**
  *   **The Demand:** The theory must account for the entropy change of the *gas*, the *bath*, and the *demon's internal state* combined. The sum must never decrease over a closed cycle.
  *   **The Case:** This kills the "magic gate." If the gas entropy drops (sorting), the demon's entropy must rise (memory fills) or the bath's must rise (heat dissipation).
  *   **Your Cases:** Handles the **Never-eraser** (entropy moves to memory, valid until memory full) and the **Thermalizing Memory** (if the environment randomizes the bits, entropy rises in the bath, paying the debt).

  **2. Information is Physical Correlation (Non-negotiable)**
  *   **The Demand:** "Information" must be defined as mutual information (correlation) between the demon's state and the particle's state, stored in distinguishable physical microstates.
  *   **The Case:** Prevents "mind over matter." A thought doesn't count unless it corresponds to a physical configuration (e.g., a flipper switch, a charge).
  *   **Your Cases:** Handles the **Blind Demon** (pre-existing correlation is fuel; the theory credits the work against the initial correlation debt) and the **Species Sorter** (chemical identity is just another state variable; same math as speed).

  **3. The Reset Price / Landauer Limit (Non-negotiable for Cyclic Operation)**
  *   **The Demand:** To return the demon to its initial state to repeat the process indefinitely, at least $k_B T \ln 2$ of heat must be dissipated per bit of information erased.
  *   **The Case:** This is the standard shield against perpetual motion. Measurement can be reversible; *resetting* the measuring device is not.
  *   **Your Cases:** Kills the **Lazy Door** if it claims to run forever without heat. Validates the **Cold Brain** only if the temperature difference is accounted for as a heat engine resource, not a demon trick.

  **4. Fluctuation Tolerance (Non-negotiable)**
  *   **The Demand:** The Second Law must be stated statistically (e.g., Jarzynski Equality). Entropy *can* decrease in a single run, provided the probability of such a decrease is exponentially suppressed.
  *   **The Case:** Allows for **One-shot** scenarios. A single lucky fluctuation can produce work, but you can't bet on it happening twice.
  *   **Your Cases:** Saves the **One-shot** (a single big win is physically allowed, just unlikely) and explains why the **Lazy Door** sometimes lets a fast molecule through by mistake (thermal noise in the gate).

  **5. Agency Agnosticism (Non-negotiable)**
  *   **The Demand:** The equations must yield the same result whether the "demon" is a conscious observer, a computer, or a spring-loaded trap.
  *   **The Case:** Physics does not care about "intent." If a mechanism sorts without recording, it's a ratchet (fails). If it records, it's a memory (costs).
  *   **Your Cases:** Prevents you from hand-waving the **Cold Brain** as "willpower." The temperature is the resource, not the mind.

  **6. Boundary Invariance (Preference / Debated)**
  *   **The Demand:** Moving the line between "system" and "demon" should not change the total energy/entropy accounting.
  *   **The Case:** If you include the demon's arm in the gas, the work looks different. A robust theory says the total cost is invariant regardless of where you draw the box.
  *   **Your Cases:** Crucial for the **Structural** question. If your character moves the sensor *inside* the chamber, the physics shouldn't break.

  **7. Finite Resource Honesty (Preference)**
  *   **The Demand:** The theory should not rely on infinite baths, infinite time, or infinite memory precision to function.
  *   **The Case:** Real experiments have finite heat capacity and finite bit depth.
  *   **Your Cases:** Exposes the **Never-eraser** as a ticking time bomb. Infinite memory requires infinite mass/energy eventually (Bekenstein bound).

  ### The Structural Traps

  *   **Boundary Choice:** This is where most fictional demons cheat. If you define the "system" as just the gas, the demon looks like magic. If you define it as "gas + demon," the magic vanishes. **Requirement:** Your theory must force the character to declare the boundary *before* the experiment.
  *   **Agency:** Do not lean on the demon being a "mind." It adds nothing but confusion. A photodiode and a neuron obey the same thermodynamics here. **Requirement:** Treat the demon as a control mechanism with a state register.
  *   **Limits:** Do not use the thermodynamic limit (infinite particles). Your character is an experimentalist; she deals with counts of 1,000 or fewer. **Requirement:** Use Stochastic Thermodynamics, not classical Boltzmann.
  *   **The Cost Floor:** Is $k_B T \ln 2$ a hard floor? **Verdict:** It is a hard floor for *erasure* in the limit of infinite time. For finite time, the cost is higher (dissipation due to speed). **Requirement:** Distinguish between the *informational* cost (Landauer) and the *frictional* cost (driving the gate).

  ### The Incompatible Pair (Your Third Act)

  **Cyclic Stability vs. Zero Dissipation in Control.**

  *   **The Conflict:** To run indefinitely (Cyclic), the demon must reset its memory. To reset without dissipation, the process must be infinitely slow (adiabatic/reversible). To be useful (Finite Time), the demon must switch fast.
  *   **The Physics:** You can have a demon that runs forever (Cyclic), or a demon that is perfectly efficient (Zero Dissipation), but you cannot have a demon that is *both* useful (fast) *and* perfectly efficient.
  *   **The Plot Hook:** Your character gets the demon working perfectly (Zero Dissipation), but she discovers it can only operate once every thousand years (Infinite Time). To make it useful (Fast), she has to introduce friction, which generates heat, which degrades the sorting efficiency. She has to choose between a perfect miracle that does nothing, or a flawed machine that saves the world but burns out.

  ### The Killer Requirement

  **Global Entropy Balance (Requirement #1).**

  This kills the largest number of would-be working demons. Most proposals focus on the gate mechanism (frictionless, massless) but forget that the *decision* to open the gate requires a physical state change in the controller. If the controller doesn't change state (blind), it can't sort. If it does change state, it accumulates entropy. If it resets, it pays. There is no escape from the balance sheet.

  ### How the Extant Stories Stack Up

  *   **The "Measurement is Free, Erasure Costs" (Bennett/Landauer):** Passes all non-negotiables. It handles the **Never-eraser** perfectly (you can run until memory fills) but demands payment for the **Cyclic** case.
  *   **The Fluctuation Theorem People (Jarzynski/Crooks):** Passes the **One-shot** case beautifully. They show that for single trajectories, the Second Law can be "violated" locally, provided the average holds. Good for your **Blind Demon** exploiting rare correlations.
  *   **The "Quantum Zeno" Demons:** Often fail **Agency Agnosticism**. They rely on wavefunction collapse interpretations that smuggle entropy out through the "observer" definition. Risky for hard SF.
  *   **The "Correlation Fuel" Models (Sagawa-Ueda):** The gold standard for your **Blind Demon**. They treat mutual information as a thermodynamic potential, like temperature or pressure. You spend correlation to buy work.

  ### How to Break It (For Your Success Story)

  To have a working demon that a physicist nods at, you must break **one** non-negotiable, but you must accept the consequence.

  *   **Option A: Break Cyclic Operation.** The demon works perfectly, but it is a **Never-eraser**. It sorts until its memory is full, then it stops. It is not a perpetual motion machine; it is a *battery* that runs on pre-existing low-entropy memory states.
      *   *Consequence:* She needs a supply of "blank" low-entropy memory states. Where do *those* come from?
  *   **Option B: Break Boundary Invariance.** The demon works because it is coupled to a sector of physics not included in the standard "System + Bath" model (e.g., vacuum fluctuations, dark energy, a parallel brane).
      *   *Consequence:* She isn't building a demon; she's building a tap into a new energy source. The "demon" is just the valve.
  *   **Option C: Break the Reset Price.** She finds a way to randomize memory without heat (e.g., using a zero-temperature reservoir or a reversible logic gate that never erases, just shifts).
      *   *Consequence:* She must move the entropy somewhere else. The "waste" isn't heat; it's *complexity* or *correlation* dumped into a field she can't see.

  **Recommendation:** Go with **Option A**. It is the most physically honest. The demon works, but it consumes "negentropy" stored in its own memory tape. The drama comes from the tape running out. It satisfies the physicist (entropy is conserved) but allows the miracle (work is extracted).
