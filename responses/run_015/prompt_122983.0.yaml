  1.  **Analyze the Request:**
      *   **Goal:** Create a set of desiderata (requirements/criteria) for a physical theory of Maxwell's Demons.
      *   **Target Audience:** A novelist writing about a burnt-out experimentalist who *actually* gets a working demon. The physics needs to be plausible enough for a physicist to nod grudgingly, not dismiss as crankery.
      *   **Function:** The list must define what a valid theory must deliver (covering both failures and the user's specific success case). It needs to identify which assumptions can be broken in fiction and what breaks along with them.
      *   **Specific Cases to Cover:** Never-eraser (infinite memory), Lazy door (frictionless/conditional), Species sorter (osmotic/chemical), Cold brain (temp gradient), Blind demon (pre-existing correlations), One-shot (single run/fluctuations), Thermalizing memory (free wipe).
      *   **Structural Issues:** System boundaries, agency vs. mechanism, finite vs. ideal limits, hard floor vs. average cost ($kT \ln 2$).
      *   **Formatting/Constraints:** Mark non-negotiable vs. preference. Flag incompatible pairs (for the plot's third act). Identify the "killer" requirement. Briefly mention how existing theories stack up.
      *   **Tone:** Technical but accessible, rigorous but creative-friendly. "Physicist would grudgingly nod."

  2.  **Deconstruct the Physics of Maxwell's Demon:**
      *   *Core Conflict:* Second Law of Thermodynamics (entropy always increases) vs. Information Processing (sorting molecules to extract work).
      *   *Key Resolution:* Landauer's Principle (erasure costs energy) + Measurement costs (sometimes) + Correlations (mutual information).
      *   *Modern View:* Stochastic Thermodynamics, Information Thermodynamics. The Second Law is generalized: $\Delta S_{tot} = \Delta S_{sys} + \Delta S_{bath} - I \ge 0$, where $I$ is mutual information.
      *   *The "Loophole":* You *can* extract work if you consume information (correlations). You *must* pay to reset the information carrier to a standard state to make the process cyclic.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Requirement 1: Account for Memory.* The demon needs a state. If it stores info, entropy moves there.
      *   *Requirement 2: The Reset.* To be a perpetual engine, it must cycle. Resetting costs $kT \ln 2$.
      *   *Requirement 3: Boundaries.* Where does the system end? If the demon is part of the system, total entropy must rise.
      *   *Requirement 4: Fluctuations.* Small systems fluctuate. Second law is statistical.
      *   *Requirement 5: Correlations.* Information is physical correlation.
      *   *Requirement 6: Agency.* Does it matter if it's a mind or a machine? (No, physics doesn't care about "mind").

      *Refining for the User's Specific Cases:*
      *   *Never-eraser:* Needs to handle non-cyclic operation.
      *   *Lazy door:* Needs to handle measurement cost vs. operation cost.
      *   *Species sorter:* Needs to handle chemical potential, not just kinetic energy.
      *   *Cold brain:* Needs to handle temperature gradients (work can be extracted from gradients legitimately).
      *   *Blind demon:* Needs to handle pre-existing mutual information.
      *   *One-shot:* Needs to handle fluctuation theorems (Jarzynski/Crooks).
      *   *Thermalizing memory:* Needs to distinguish between randomization and reset.

  4.  **Categorizing Requirements (Non-negotiable vs. Preference):**
      *   *Non-negotiable:* Conservation of energy (1st Law), Statistical nature of 2nd Law (fluctuations allowed), Information is physical (correlations count), Global entropy balance (System + Bath + Memory).
      *   *Preference:* Entropy vs. Information language, Ensemble vs. Single-shot (though single-shot needs fluctuation theorems), Agency independence.
      *   *Conflict:* Cyclic operation vs. Infinite Memory. You can have one or the other, not both without cost.

  5.  **Identifying the "Killer" Requirement:**
      *   What kills most demons? The requirement that the *total* entropy (including the demon's internal state) must not decrease over a closed cycle. Specifically, the cost of *resetting* the memory to a standard state to allow repeated operation without bound.

  6.  **Addressing the "Success Story" (The Novel's Plot):**
      *   To make the demon work, the character must break a non-negotiable or exploit a specific loophole.
      *   *Loophole:* Pre-existing low-entropy source (correlations) or a non-cyclic process (burning memory).
      *   *Breaking Physics:* If she wants a perpetual motion machine, she must violate the global entropy balance.
      *   *Plot Hook:* The incompatible pair is usually "Cyclic Operation" vs. "Zero Energy Cost for Reset."

  7.  **Drafting the Content (incorporating specific constraints):**

      *   *Intro:* Set the stage. This is about Information Thermodynamics.
