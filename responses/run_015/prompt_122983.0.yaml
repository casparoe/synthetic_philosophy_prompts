          1.  **Global Balance Sheet (Non-negotiable):** System + Demon + Bath.
          2.  **Information is Physical (Non-negotiable):** States must be distinguishable physical states.
          3.  **The Reset Price (Non-negotiable for cyclic):** Landauer's limit.
          4.  **Fluctuation Tolerance (Non-negotiable):** Second law is statistical.
          5.  **Boundary Invariance (Preference/Debated):** Physics shouldn't change based on where you draw the line.
          6.  **Agency Agnosticism (Non-negotiable):** Mind doesn't matter, mechanism does.
          7.  **Correlation Accounting (Non-negotiable):** Mutual information is fuel.
