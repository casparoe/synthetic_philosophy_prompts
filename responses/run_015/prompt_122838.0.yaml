  | **3. Xenobiotic Dependence** | 0.10 | 0.9 | Obligate parasites are alive; synthetic feedstock is an origin story, not a status disqualifier. |
  | **4. Evolutionary Capacity** | 0.25 | 0.4 | Compositional inheritance drifts too fast for open-ended adaptation, limiting "Darwinian" claim. |
