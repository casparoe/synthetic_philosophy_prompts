hat break probability theory. also flag the weakest point in my own position that i should defend rather than hope they miss. start with brainstorming, then the sheet. dont give me bibliographies or reading lists — i dont need citations i cant recieve, just strategic advice. if you put anything in quotes from a real text verify it but i dont need verbatim quotes at all, just paraphrase. thanks!!
