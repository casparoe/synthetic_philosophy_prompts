answer: |-
  **1. The Harm Principle and the Exception**
  **Question:** You argue that liberty applies only to those in the maturity of their faculties, yet you admit some nations are perpetually childish. Is this exception a principled boundary of the harm principle, or merely that principle applied to empirical beliefs about stagnation that might prove false?
  **Likely Reply:** It is not a difference of principle, but of fact; we do not withhold liberty from a child because we despise him, but because he cannot yet use it for improvement. If the belief in their stagnation were proven false, the principle would demand their immediate emancipation, not a continuation of the rule.
  **Follow-up:** If that empirical belief was false for the thirty years you governed them, does the correction require a retrospective condemnation of your acts as tyranny, or merely a change of policy for tomorrow?
  *(Flag: Deflection Risk. Mill often treats moral failures as administrative errors. **Reformulation:** "If the fact was wrong, was the act unjust? Do not tell me of policy; tell me if you harmed them by mistake.")*

  **2. The Examiner's Monopoly**
  **Question:** Under your scheme, the tutor sets the syllabus, administers the examination, and marks the paper. Who certifies that a people has come of age, and what specific evidence would compel you to conclude the schooling has failed and Britain must go?
  **Likely Reply:** We look for the capacity to maintain stable institutions and to conduct public discussion without descending into violence. It would require a demonstration that they could sustain order better without our interference than with it.
  **Follow-up:** But if the only school they are permitted to attend is one that forbids them from practising self-government, how can they ever produce the evidence you require to graduate?

  **3. Structural Conflict of Interest**
  **Question:** The officials who must judge whether a pupil is ready to leave owe their vocation, their standing, and their sense of usefulness to the tutelage continuing. Is there not a structural conflict of interest inside the doctrine itself, regardless of the virtue of particular men?
  **Likely Reply:** A good servant of the Company desires his own obsolescence in that district, for his success is measured by the stability he leaves behind. We must rely on the honour of the administrator to prefer the good of the governed to the perpetuation of his office.
  **Follow-up:** If the system rewards administration over emancipation, does the honour of the man matter against the vice of the office?

  **4. Upbringing and National Pedagogy**
  **Question:** You were the subject of the century's most deliberate pedagogical experiment, trained by your father to suppress instinct for reason. What part of that upbringing would you refuse to repeat if the pupil were not a son, but a nation?
  **Likely Reply:** I had the advantage of paternal affection, which softened the rigour of the discipline and ensured it was for my good. A nation cannot feel that affection from a distant bureaucracy, which is why our rule must be strictly accountable to principle.
  **Follow-up:** Is the absence of that affection in the Anglo-Indian bond what makes the pedagogy despotism rather than fatherhood?
  *(Flag: Monologue Potential. This reply captures the personal tragedy behind the politics.)*

  **5. The Crown Transfer of 1858**
  **Question:** The transfer of Indian government to the Crown placed India under a ministry answerable to an electorate that does not include the governed. On your own principles, did this make matters better or worse, since it subjects them to the tyranny of prevailing opinion you feared at home?
  **Likely Reply:** The Company was a shield, a body of experts insulated from the ignorant passions of the British public. To subject India to the whims of Parliament is to trade a benevolent despotism for a capricious one.
  **Follow-up:** If the shield was made of the very prejudice you feared at home, was it protection or imprisonment?

  **6. Non-Intervention and Categories**
  **Question:** In *A Few Words on Non-Intervention*, you distinguish between helping a people throw off a foreign yoke and taking sides in internal struggles. Where does India sit on this map, and can a people cross out of your third category by their own efforts?
  **Likely Reply:** They are not struggling against a foreign yoke in the European sense, but against their own social conditions. They may cross the threshold only when they show a united will to be free, not merely a desire to change masters.
  **Follow-up:** If they fight for liberty but fail, do you count the failure as proof they were not ready, making the test impossible to pass?

  **7. The Concrete Case (The Protagonist)**
  **Question:** My protagonist faces an outbreak that is at once anti-reform and anti-foreign, and must decide within a week whether to suppress it to protect roads and schools. What does the improvement test say to do before the week is out?
  **Likely Reply:** Order is the prerequisite of improvement; without security, there can be no schools and no courts. He must suppress the disorder, provided his intention is to restore the conditions for liberty, not to crush the spirit of the people.
  **Follow-up:** If order requires extinguishing the very voice that might claim adulthood, has the tutor not eaten the pupil?
  *(Flag: Monologue Potential. The tension between order and liberty is the core of the novel's conflict.)*

  **8. The Weight of Custom**
  **Question:** You argue that custom is the enemy of improvement, yet for these people, custom is the only order they know. If breaking their custom causes a trauma that lasts generations, is the utility calculated in decades or centuries?
  **Likely Reply:** We do not break custom for the sake of breaking it, but to clear the ground for rational choice. The pain of transition is regrettable, but the stagnation of custom is a death of the mind.
  **Follow-up:** Who measures the life of the mind if the subject is not permitted to speak for himself?

  **9. Distance and Knowledge**
  **Question:** You governed a land you never saw, learning it by proof-reading your father's history and drafting dispatches in London. Is the truth of India found in the dispatch or in the soil?
  **Likely Reply:** Principles of government are universal, though their application must suit local circumstances. I trust that a rational mind in London can discern justice as clearly as a prejudiced eye on the spot.
  **Follow-up:** When the local detail contradicts the universal principle, which do you sacrifice?

  **10. The Definition of Improvement**
  **Question:** You justify rule by the end of improvement, but you never define the final shape of a "improved" India. If they improve into a society that rejects British values, have you succeeded or failed?
  **Likely Reply:** Success is not that they become British, but that they become capable of choosing for themselves. If they choose differently, provided it is a rational choice, our work is done.
  **Follow-up:** Then why do you fear the choice they are making now?
