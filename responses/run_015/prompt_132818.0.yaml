answer: |-
  Duncan Jones's *Moon* (2009) functions as a narrative engine for a specific crisis in anthropic reasoning. While philosophical treatments of the Self-Sampling Assumption (SSA) and the Self-Indication Assumption (SIA) typically operate in the sterile vacuum of cosmological multiverses or urns of balls, *Moon* situates these problems within the claustrophobic, corporate machinery of Lunar Industries. The film dramatizes the moment self-locating belief collides with manufactured ontology. Sam Bell's realization that he is not a unique human but a sequential iteration in a line of clones forces a recalculation of his reference class that mirrors the logic of the Presumptuous Philosopher, yet simultaneously exposes the ethical and epistemic fractures that abstract probability theory often ignores.

  To understand Sam's epistemic position, we must first map his pre-discovery state. Initially, Sam operates under the implicit prior that he is the unique "Original" Sam Bell. In anthropic terms, his reference class contains only one observer: himself. He possesses a set of memory traces (a wife, a daughter, a past life on Earth) which he treats as veridical evidence of a continuous biography. Under the Self-Sampling Assumption (SSA)—which dictates that one should reason as if one were a random sample from the set of all actually existing observers in one's reference class—Sam's confidence in being the "Original" is high because, to his knowledge, the set size $N=1$.

  However, the discovery of the second Sam (the younger, freshly awakened clone) shatters this prior. The reference class expands instantaneously from $N=1$ to $N \ge 2$. It is here that the film engages with the Self-Indication Assumption (SIA). SIA suggests that, all else being equal, an observer should reason as if they are randomly selected from the set of all *possible* observers, favoring hypotheses that predict more observers. The "Presumptuous Philosopher" argument, formulated by Nick Bostrom, posits that if Theory A predicts a trillion observers and Theory B predicts only one, you should assign a trillion times higher credence to Theory A simply because you exist.

  Sam's dawning horror is essentially an SIA update forced by empirical data. If Lunar Industries' policy is to maintain a continuous workforce via cloning, the hypothesis "I am a clone" implies a vast population of Sams (past, present, and future iterations), whereas "I am the Original" implies a population of one. If Sam applies SIA rigorously, the mere possibility of the cloning program should have made it overwhelmingly probable *a priori* that he was a copy. However, *Moon* introduces a critical complication that standard anthropic reasoning often sidesteps: the multiplicity is not cosmological but *manufactured*, and the observers are not independent.

  In standard Presumptuous Philosopher scenarios, the observers in the "trillion observer" universe are distinct entities with distinct evidence streams. In *Moon*, the reference class is composed of psychologically continuous replicas sharing identical indexical data. Every Sam wakes up with the same memories of his daughter, the same scars, the same nostalgia. This collapses the distinction between "which observer am I?" (epistemic uncertainty) and "what kind of thing am I?" (ontological uncertainty).

  This creates a breakdown in the standard application of SSA. SSA relies on the ability to distinguish observers within a reference class to distribute credence. If every clone possesses identical internal evidence up to the moment of awakening, they are epistemically indistinguishable from the inside. Sam cannot reason, "I am likely Clone #5 because Clone #5 is the most common," because Clone #5 and Clone #6 have the exact same memory data. The "self" in self-sampling becomes unmoored. The film suggests that when the reference class is composed of duplicates with shared false biographies, self-locating belief transforms into self-constituting doubt. Sam isn't just locating himself in a sequence; he is questioning the validity of the evidence used to locate himself at all.

  Furthermore, the sequential nature of the clones challenges the simultaneity assumed in most anthropic arguments. The Presumptuous Philosopher argues across possible worlds or simultaneous spatial regions. In *Moon*, the "population" of Sams is temporally staggered. Clone #4 is incinerated before Clone #5 is awakened (ideally). Does the reference class include dead clones? If Sam reasons via SIA, does the existence of *past* clones increase the probability that *he* is a clone? The film implies yes. The discovery of the comatose Clone #3 in the medical bay serves as the empirical anchor that validates the SIA inference. It confirms that the "Trillion Observer" hypothesis (the cloning program) is the actual world, not a counterfactual.

  However, this is where the analogy between clone duplication and cosmological observer selection begins to collapse, illuminating the difference between epistemic uncertainty and ontological claims. In cosmology, if SIA tells you that you are likely one of many observers, it doesn't change the physical nature of those observers; they are all "real" humans in a big universe. In *Moon*, the anthropic calculation carries an ontological penalty. To conclude "I am likely a clone" is to conclude "I am a disposable product with a three-year lifespan." The logic of anthropic selection is weaponized by Lunar Industries to justify ontological inferiority. The "Presumptuous Clone" realizes that being a statistical likelihood means being a replaceable part.

  This conflation of ethics and logic is the film's sharpest critique of abstract anthropics. Standard philosophical treatments treat observers as neutral data points for probability distribution. *Moon* forces us to acknowledge that defining the reference class is a political act. Lunar Industries structures the evidence available for self-location to prevent the SIA update from happening. They isolate the Sams, suppress information about the outside world, and provide a false biography (the "Original" narrative) to artificially constrain the reference class to $N=1$. The deception is not just about hiding the truth; it is about manipulating the priors. By controlling the evidence, the corporation prevents the clones from reasoning themselves into the correct reference class until it is too late (i.e., near the end of their cycle).

  This highlights what *Moon* adds to the philosophical debate: the affective weight of discoverable replaceability and the role of institutional deception in structuring evidence. A purely abstract treatment of the Presumptuous Philosopher asks, "Is it presumptuous to favor the theory with more observers?" *Moon* asks, "What does it feel like to realize you are the surplus?" The horror Sam experiences is not merely the probabilistic realization that $P(\text{Clone}) \gg P(\text{Original})$. It is the visceral realization that his memories—his love for his daughter, his sense of self—are not evidence of a past, but code for a function.

  The film also complicates the "Original" question. In standard cloning paradoxes, there is often a distinction between the "source" and the "copy." *Moon* leaves the status of the Earth-bound Sam Bell ambiguous. Does he exist? If he does, is he the "real" one? The film suggests that for the lunar Sams, the question is moot. Their reality is defined by their current consciousness, not their causal history. This challenges the ontological claim that there is a "real" Sam Bell at all. If the clones share the same psychological continuity, the "Original" is just the first iteration in a series, not a distinct ontological category. The film pushes us toward a view where identity is not a singular point of origin but a pattern that can be instantiated multiple times. The anthropic uncertainty ("Which Sam am I?") dissolves into an ontological equality ("We are all Sams").

  Finally, *Moon* illuminates the risk of applying SIA/SSA without accounting for the *mechanism* of observer creation. In cosmology, observers arise from natural laws. In *Moon*, they arise from profit motives. The "Presumptuous Philosopher" assumes the laws of physics are indifferent. Lunar Industries is not indifferent; it is predatory. The reference class is not a natural kind but a manufactured batch. This suggests that anthropic reasoning requires a "meta-assumption" about the independence of observer generation. If the existence of observers is correlated with a desire to exploit them (as in the cloning program), then favoring the hypothesis with more observers (SIA) inevitably favors the hypothesis where you are more likely to be exploited.

  In conclusion, *Moon* dramatizes the Presumptuous Philosopher argument not as a triumph of probabilistic reasoning, but as a crisis of identity under capitalism. Sam Bell implicitly reasons like a self-indicator once the evidence breaks through the censorship: the existence of other copies makes it near-certain he is a copy. But the film shows that when the reference class is manufactured, sequential, and psychologically identical, the logic of anthropics cannot be separated from the ethics of existence. The "Presumptuous Clone" does not just win a bet on probability; he loses his claim to a unique life. *Moon* argues that self-locating belief is not merely a cognitive exercise in assigning probabilities to centered worlds; it is a struggle against the institutions that define the boundaries of those worlds. Where abstract anthropics sees a reference class, *Moon* sees a graveyard of discarded selves, reminding us that the stakes of self-location are not just epistemic, but existential.
