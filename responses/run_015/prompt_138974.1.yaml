answer: |-
  **Root Commitment:** There is something it is like to be an ordinary awake adult human, and whatever else is true, that depends on the physical goings-on in that person's brain. *(Note: One path below concludes this commitment records a systematic error.)*

  **Node 1 (Case 7: Derivation)**
  Someone is handed every microphysical truth, every truth about the experiential character of the constituents, and every a priori truth, and asked which macroscopic experiences exist. Can they answer correctly?
  *   **Yes, deducible.** → Go to Node 4.
  *   **No, not deducible.** → Go to Node 2.

  **Node 2 (Case 1: Static Configuration)**
  Consider the constituents of a living brain held exactly in the arrangement they occupy during experience, with all causal interaction among them switched off. Does the experience persist?
  *   **Yes, the arrangement is sufficient.** → Go to Node 3.
  *   **No, causal dynamics are required.** → Go to Node 3.
      *(Note: This branch separates views on whether experience is a state or a process, but both remain in the non-deducible cluster.)*

  **Node 3 (Case: The Veridicality Report)**
  When a person reports "what it is like," are they detecting a property or expressing a functional state that misrepresents the physical reality?
  *   **Detecting a property.** → **Leaf: Brute Macro-Emergentism** (If dynamics required) OR **Leaf: A Posteriori Physicalism** (If arrangement sufficient).
      *(Flag: These leaves are indistinguishable if an emergentist grants that the static substrate metaphysically necessitates the dynamic power.)*
  *   **Expressing a functional state.** → **Leaf: Illusionism**.

  **Node 4 (Case 6: Palette)**
  Constituents are credited only with extremely simple experiential characters, while the resulting experience has a richly structured sensory field, with spatial arrangement and similarities among colours already built into it. Do the fundamental physical constituents possess *any* form of experiential character?
  *   **Yes, they possess experience.** → Go to Node 5.
  *   **No, they possess non-experiential properties.** → Go to Node 6.

  **Node 5 (Case 8: Spoils)**
  When constituents give rise to a macroscopic subject, is that subject one of them, something they make up without being identical to it, or something additional to all of them?
  *   **Something additional.** → **Leaf: Emergentist Panpsychism (Phenomenal Bonding)**.
  *   **One of them / Something they make up.** → Go to Node 7.

  **Node 6 (Case 4: Grain)**
  The same brain is described at the level of molecules, of cells, of neural assemblies, and of the whole organism. Is there a subject at every level, at one level, or is the question ill-posed?
  *   **At one level (Macro only).** → **Leaf: Panprotopsychism**.
  *   **The question is ill-posed (Levels are abstractions).** → **Leaf: Neutral Monism**.
      *(Empty Combination: Deducible + No Micro Experience + Subject at Every Level. Incoherent: If the base lacks experiential character, lower levels cannot host subjects.)*

  **Node 7 (Case 2: The Count)**
  At one time, how many subjects does a single living human brain contain, and if the answer is more than one, is any of them the one whose experience the person reports?
  *   **Many (The micro-constituents); the person is the collection.** → **Leaf: Constitutive Micropsychism**.
  *   **One (The Whole); the parts are fragments.** → **Leaf: Cosmopsychism**.
      *(Empty Combination: Deducible + Micro Experience + Subject Additional. Unexplored: Few argue that deducible micro-experience logically necessitates a *new* macro-subject rather than the micro-subjects themselves.)*

  ***

  **Leaves and Awkward Commitments**

  1.  **Brute Macro-Emergentism:** Consciousness is a fundamental law of nature that activates only at high complexity, inexplicably absent in simpler systems.
  2.  **A Posteriori Physicalism:** Experience is identical to a physical state, but this identity is a brute fact discoverable only by empirical investigation, not reasoning.
  3.  **Illusionism:** The conviction that there is "something it is like" is a cognitive error generated by physical processes that do not themselves feel like anything.
  4.  **Emergentist Panpsychism (Phenomenal Bonding):** Micro-subjects exist, but a further primitive relation is required to unite them into a macro-subject, multiplying fundamental relations.
  5.  **Constitutive Micropsychism:** You are not a single subject but a society of microscopic subjects, and your "unity" is merely a coordination of their distinct perspectives.
  6.  **Cosmopsychism:** The only fundamental subject is the universe itself, and your individual perspective is a fragmented modification of its single consciousness.
  7.  **Panprotopsychism:** Fundamental matter has properties that are not experiential but specifically disposed to generate experience, a category distinct from both physics and phenomenology.
  8.  **Neutral Monism:** The fundamental stuff is neither mental nor physical, and the distinction between "subject" and "object" is a derivative way of organizing events.

  ***

  **Structural Notes**

  **Indistinguishable Leaves:** **Brute Macro-Emergentism** and **A Posteriori Physicalism** are flagged at Node 3. Both deny a priori derivation and affirm realism. The tree separates them via the Static Configuration (Node 2), assuming Emergentists require causal dynamics while Physicalists accept state identity. However, if an Emergentist argues the static state *has* the power to produce experience even if inactive, the leaves collapse.

  **Empty Combinations:**
  *   **Deducible + No Micro-Experience + Subject at Every Level:** Marked at Node 6. This is **Incoherent**. If the fundamental constituents lack experiential or proto-experiential character, and the macro-experience is a priori deducible, there is no ontological ground for subjects to exist at the lower levels.
  *   **Deducible + Micro-Experience + Subject Additional:** Marked at Node 5. This is **Unexplored**. If the macro-subject is a priori deducible from micro-subjects, it is unclear why it must be an *additional* entity rather than the micro-subjects arranged. This view posits a necessary emergence that most find redundant.

  **Workhorse Node:** **Node 1 (Derivation)** carries the most classificatory work. It bifurcates the entire logical space into the "Physicalist/Emergentist/Illusionist" cluster (where experience outruns the physical description) and the "Russellian/Panpsychist/Neutral" cluster (where experience is built into the description). Without this node, the tree would collapse into a simple tally of "who has experience at the bottom," failing to distinguish Brute Emergence from Illusionism or Physicalism, as all three agree the micro-physical description *as standardly conceived* lacks experience. Node 1 forces the distinction between "lacks experience because it isn't there" (Illusionism/Emergentism) and "lacks experience because we haven't described the intrinsic nature" (Panpsychism/Neutral Monism).
