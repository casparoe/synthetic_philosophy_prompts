answer: |-
  # The Safety-Net AI Review Protocol (SNARP)
  **Version 1.0 | For Committee Use Only**

  **Purpose:** To decide whether a predictive model is safe, fair, and useful for patient care.
  **Time Limit:** 120 Minutes.
  **Decision Rule:** A "No" at any Gate stops the proposal. A "Conditional Yes" requires specific fixes before implementation. A "Value Judgment" requires a formal vote.

  ---

  ## Gate 1: The Truth Test (Label Validity)
  **Question:** Does the thing we are predicting actually measure what we think it measures?
  **Time:** 20 Minutes
  **Owner:** Clinicians + Data Scientist

  **The Check:**
  1.  **Definition:** Write down the definition of the "Target" (e.g., "Readmission").
  2.  **Measurement:** Write down how the computer actually sees it (e.g., "A new admission record in *our* system within 30 days").
  3.  **The Gap:** List three reasons why a patient might have the Target happen but the Computer *not* see it.
  4.  **The Loop:** List one way our past actions changed the Target (e.g., "We called high-risk patients, so they didn't come back, so the model thinks they weren't high risk").

  **Sufficient Answer:** The Gap list is empty or trivial. The Loop is acknowledged and corrected for in the training data.
  **Stop Condition:** The Gap systematically excludes a specific patient population (e.g., those who go to other hospitals) OR The Loop punishes past successful interventions.
  **Value Judgment:** None. This is a fact check.

  ---

  ## Gate 2: The Scarcity Test (Budget & Ranking)
  **Question:** Is this a "Yes/No" decision or a "Who Gets the Slot" decision?
  **Time:** 20 Minutes
  **Owner:** Finance + Care Management + NP

  **The Check:**
  1.  **Constraint:** Is there a fixed limit on the intervention? (e.g., "Only 40 slots," "Only 24 hours in a day").
  2.  **Zero-Sum:** If we give this to Patient A, does Patient B definitely *not* get it?
  3.  **Fairness Implication:**
      *   If **No Limit:** We care about *accuracy* for everyone.
      *   If **Fixed Limit:** We care about *opportunity*. If Group X is systematically scored lower, they are systematically denied care, even if the score is "accurate."

  **Sufficient Answer:** We acknowledge that with a fixed budget, fairness means ensuring the *pool of candidates* is representative, not just that the score is accurate.
  **Stop Condition:** The vendor treats a Fixed Limit problem like a Yes/No problem (e.g., promising "90% accuracy" without explaining who makes up the 10% error).
  **Value Judgment:** Deciding which group gets priority if the data is uncertain.

  ---

  ## Gate 3: The Shadow Test (Proxy Audit)
  **Question:** We can't see Race. How do we know we aren't discriminating?
  **Time:** 30 Minutes
  **Owner:** Lawyer + Patient Reps + Data Scientist

  **The Check:**
  1.  **The Constraint:** Acknowledge we cannot use Race/Ethnicity data.
  2.  **The Proxies:** Identify the available stand-ins (Zip Code, Insurance Type, Preferred Language).
  3.  **The Limitation Statement:** Read aloud: *"Checking these proxies detects Disparate Impact (unequal outcomes), not Disparate Treatment (intent). It tells us if a group is hurt, not if the model is racist."*
  4.  **The Threshold:** Define the "Stop" number. (e.g., "If the top 40 scored patients contain less than 20% Medicaid patients, while Medicaid is 50% of our discharges, we stop.")

  **Sufficient Answer:** Agreement on the Proxy Thresholds and the Limitation Statement.
  **Stop Condition:** The vendor refuses to run the audit on proxies, or the audit shows extreme disparity that cannot be clinically justified.
  **Value Judgment:** Deciding how much disparity is "too much."

  ---

  ## Gate 4: The Impossible Trinity (Fairness Trade-offs)
  **Question:** We cannot be perfect. Which flaw do we choose?
  **Time:** 30 Minutes
  **Owner:** All (Vote Required)

  **The Check:**
  Explain that the model cannot satisfy all three promises below if patient groups have different baseline risks (which they do). **Pick exactly one priority.**

  1.  **Promise A (Meaning):** A score of 80% means the same risk for everyone, regardless of group. *(Calibration)*
  2.  **Promise B (Rescue):** We catch the same percentage of *actual* sick people in every group. *(Equal True Positive Rate)*
  3.  **Promise C (Efficiency):** Of the people we flag, the same percentage actually get sick in every group. *(Equal Positive Predictive Value)*

  **The Choice:**
  *   If we pick **A**: We treat the score as a universal language, but we might miss more sick people in high-risk groups.
  *   If we pick **B**: We ensure we don't miss sick people in any group, but we might waste more resources on healthy people in high-risk groups.
  *   If we pick **C**: We ensure we don't waste resources, but we might miss more sick people in high-risk groups to keep efficiency up.

  **Sufficient Answer:** A recorded vote on which Promise is the priority for *this specific intervention*.
  **Stop Condition:** The committee refuses to choose and demands all three.
  **Value Judgment:** **HIGH.** This is purely ethical. Who eats the error? The patient (missed care) or the system (wasted money)?

  ---

  ## Gate 5: The Harm Test (Who Pays?)
  **Question:** If the model is wrong, who suffers?
  **Time:** 20 Minutes
  **Owner:** Patient Reps + NP + Lawyer

  **The Check:**
  1.  **False Positive Harm:** What happens if we flag a healthy patient? (e.g., Unnecessary call, anxiety, wasted slot).
  2.  **False Negative Harm:** What happens if we miss a sick patient? (e.g., Readmission, death).
  3.  **Systemic Harm:** Does this model shift burden onto the patients who are already most burdened? (e.g., Making them wait longer, requiring more paperwork).

  **Sufficient Answer:** The harm of being wrong is low, or the harm falls on the system, not the patient.
  **Stop Condition:** The harm of being wrong falls heavily on the patient, specifically on marginalized groups, AND the benefit is primarily financial or administrative.
  **Value Judgment:** **HIGH.** Is the administrative gain worth the patient risk?

  ---

  # Application of the Protocol

  Here is how the procedure runs on your three cases.

  ### Case 1: The Readmission Risk Model (Top 40 of 900)
  *   **Gate 1 (Truth):** **FAIL.**
      *   *Reasoning:* The label is "Readmission to *us*." In a safety-net system, patients often return to other safety-net providers if they move or face transport barriers. The model is predicting "Loyalty + Health," not just "Health." Furthermore, past care coordination suppressed readmissions, creating a feedback loop where the model learns "Don't pick people we helped last year."
      *   *Outcome:* **STOP.** The data is invalid for the stated goal.
      *   *Path to Proceed:* Only if Health Information Exchange (HIE) data is integrated to capture readmissions elsewhere, and past intervention data is masked during training.

  ### Case 2: Overbooking Clinic Slots (Predicting No-Shows)
  *   **Gate 1 (Truth):** **PASS.** No-show history is generally reliable within a single system.
  *   **Gate 2 (Scarcity):** **PASS.** Fixed slots. It is a ranking problem.
  *   **Gate 3 (Shadow):** **PASS.** Can audit by Zip/Insurance.
  *   **Gate 4 (Impossible Trinity):** **PASS.** Committee can choose a priority (likely Efficiency).
  *   **Gate 5 (Harm):** **FAIL.**
      *   *Reasoning:*
          *   *False Positive (Predicted No-Show, actually Shows):* This patient is "overbooked." They arrive on time but are made to wait because the clinic assumed they wouldn't come.
          *   *Who pays?* The patients who *do* show up. In safety-net populations, patients who overcome barriers to show up are often the most vulnerable (e.g., arranged childcare, took unpaid leave).
          *   *Systemic Harm:* This policy penalizes compliance. It tells patients: "If you are predicted to be unreliable, we will treat you as unreliable, even if you prove us wrong by arriving." This erodes trust and increases wait times for the most diligent patients.
      *   *Outcome:* **NO.** The administrative gain (filled slots) does not justify the harm (penalizing compliant patients).

  ### Case 3: Radiology Queue Reordering (No Fixed Budget)
  *   **Gate 1 (Truth):** **PASS.** "Critical Finding" is a medically valid label.
  *   **Gate 2 (Scarcity):** **PASS.** No fixed budget. Radiologists read until the queue is empty. Reordering does not deny care, only changes timing.
  *   **Gate 3 (Shadow):** **PASS.** Audit for delay disparities by Zip/Insurance.
  *   **Gate 4 (Impossible Trinity):** **PASS.** Priority is clearly "Rescue" (Catch the critical cases).
  *   **Gate 5 (Harm):** **CONDITIONAL YES.**
      *   *Reasoning:*
          *   *False Positive (Normal flagged as Critical):* Radiologist spends 5 extra minutes reviewing. Harm = System efficiency.
          *   *False Negative (Critical flagged as Normal):* Delay in diagnosis. Harm = Patient health.
          *   *Trade-off:* Since there is no fixed budget, pushing a critical case up does not mean a non-critical case is *denied*, only *delayed*.
      *   *Outcome:* **PROCEED WITH MONITORING.**
      *   *Condition:* Gate 3 Audit must run monthly. If patients in specific Zip Codes experience significantly longer delays for non-critical scans, the model is paused.

  ---

  # Summary for the Committee

  **Why the Readmission Model Failed (Gate 1):**
  It is not a bias problem; it is a data problem. You cannot predict "Avoidable Readmission" using a definition that excludes half the healthcare system. Fixing the bias won't fix the blindness.

  **Why the Overbooking Model Failed (Gate 5):**
  It is not a math problem; it is a values problem. The model saves money by punishing the patients who succeed in accessing care. We decided as a committee that we do not penalize compliance.

  **Why the Radiology Model Passed (Gate 2 & 5):**
  It is a triage problem, not a rationing problem. Because there is no fixed budget, we are ordering urgency, not denying access. The harm of error falls mostly on staff time, not patient access.

  **Your Role as NP:**
  When the vendor says "The model is demographic-blind," you point to **Gate 3**. When they say "The accuracy is 90%," you point to **Gate 4** and ask "90% for whom?" When Care Management says "We need to fill slots," you point to **Gate 5** and ask "At whose expense?"
