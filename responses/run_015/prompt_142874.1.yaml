answer: |-
  Elena, a senior nurse, voluntarily works 80-hour weeks. No contract binds her; she can quit anytime without penalty. Her supervisors treat her as an equal, never wielding arbitrary power over her tenure. She desires to work these hours and desires to desire them, finding deep fulfillment in exhaustion. However, her training systematically excluded any concept of work-life balance, framing rest as moral failure. She cannot conceive of a life outside the ward, not through coercion, but through the total absence of alternative vocabularies. Her preferences align perfectly, yet every reference point was curated by the institution. This is reverse adaptive preference: she doesn't shrink desires to fit constraints; she never knew constraints existed.

  Negative liberty declares her free: no external interference blocks her actions. Republican liberty agrees: no dominator holds arbitrary power to interfere. Positive liberty, however, judges her unfree. Though her first and second-order desires align, her autonomy is compromised because her rational self-direction operates within a conceptual closed loop. The system eliminated alternative reference points without interference or domination. The structural feature doing the work is conceptual closure—the absence of competing life-models. It's not brainwashing; it's horizon-limiting. If stripped out—if she genuinely understood rest as compatible with care, perhaps through exposure to a different hospital culture—her exhaustion would be an autonomous choice rather than a structured inevitability. The "unfreedom" lies in the inability to critically assess the desire itself.

  I am moderately confident drawing these lines. The negative/republican distinction is clear (interference vs. domination). The positive liberty claim holds because desire formation is structurally manipulated, not coerced. My least sure point is whether labeling her "unfree" disrespectfully overrides her lived experience of fulfillment. It risks paternalism to claim she doesn't know her own good better than the philosopher does, potentially violating the very autonomy positive liberty seeks to protect. This tension—between respecting agency and identifying structural unfreedom—is where the theory often fractures.
