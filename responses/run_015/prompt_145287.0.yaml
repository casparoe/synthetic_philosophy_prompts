  # Orientation Handout: The Logic of Local Rules

  Welcome. You will hear two opposing arguments in this room. One side says, "When in Rome, do as the Romans do." The other says, "These are just habits; I only need to be polite." Neither side is entirely wrong, but both are incomplete.

  This handout maps the logical space between them. It is a decision tree. Start at the top. Read the concrete case in the box. If you think the action described is **permissible** (okay to do), follow the left branch. If you think it is **impermissible** (wrong to do), follow the right branch. Follow the path until you reach a leaf. That leaf describes your moral position, including its most awkward consequence.

  ***

  ## The Taxonomy Tree

  **START HERE: THE EMPTY STREET CASE**
  *You are crossing a street at night. The light is red. The street is completely empty. Local pedestrians routinely cross here against the light.*
  *   **LEFT (It is permissible):** You believe conventions only bind when they prevent harm or chaos.
  *   **RIGHT (It is wrong):** You believe conventions bind simply because they are the established local order.

  ---

  ### LEFT BRANCH: The "Harm & Purpose" Group
  *(Rules matter only if they serve a function.)*

  **DECISION: THE TABLE-SERVICE CASE**
  *You pay the cheaper "takeaway" price for a coffee, but sit in the "table-service" area to drink it.*
  *   **LEFT (It is permissible):** You believe only direct physical or financial harm counts. (**The Direct-Harm View**)
  *   **RIGHT (It is wrong):** You believe free-riding on a system is unfair, even if no one loses money directly. (**The Fair-Play View**)

  #### Path 1: Direct-Harm View
  **DECISION: THE POOR-SERVICE TIP CASE**
  *You receive genuinely poor service in a country where tips make up the server's wage. You leave no tip.*
  *   **LEFT (It is permissible):** **1. The Sovereign Visitor**
      *   *Awkward Commitment:* You accept that you may leave a worker with no income for the night based on your own judgment.
  *   **RIGHT (It is wrong):** **2. The Compassionate Pragmatist**
      *   *Awkward Commitment:* You accept a moral duty to subsidize employers who pay below a living wage.

  #### Path 2: Fair-Play View
  **DECISION: THE LOOSE QUEUE CASE**
  *You edge into a crowd-like market line where queueing is barely observed, or hold a place for four friends who arrive later.*
  *   **LEFT (It is permissible):** **3. The Market Individualist**
      *   *Awkward Commitment:* You accept that your efficiency may slow down the market for everyone else.
  *   **RIGHT (It is wrong):** **4. The Fair Player**
      *   *Awkward Commitment:* You must participate in informal systems even when they are inefficient or unclear.

  *(Note: To reach 6 leaves on this side, we split the Direct-Harm View further on a second case.)*

  **DECISION: THE HAGGLE CASE**
  *In a market where haggling sets the price, you refuse to haggle and pay the first number asked.*
  *   **LEFT (It is permissible):** **5. The Price Stickler**
      *   *Awkward Commitment:* You accept that your refusal may insult the seller or break the rhythm of trade.
  *   **RIGHT (It is wrong):** **6. The Market Cooperator**
      *   *Awkward Commitment:* You must spend time negotiating even when you would rather not.

  ---

  ### RIGHT BRANCH: The "Rule & Order" Group
  *(Rules matter because they represent the local social contract.)*

  **DECISION: THE SHOE CASE**
  *You enter a local home where everyone has removed their shoes. You keep yours on.*
  *   **LEFT (It is permissible):** You believe private spaces allow for exceptions. (**The Private Exemption View**)
  *   **RIGHT (It is wrong):** You believe a visitor must comply in all spaces, public or private. (**The Total Assimilation View**)

  #### Path 3: Private Exemption View
  **DECISION: THE FOREIGN TIP CASE**
  *You leave a tip in a country where tipping is not the custom and may even be considered rude.*
  *   **LEFT (It is permissible):** **7. The Generous Exceptionalist**
      *   *Awkward Commitment:* You accept that your generosity might undermine local wage norms or embarrass the recipient.
  *   **RIGHT (It is wrong):** **8. The Norm Purist**
      *   *Awkward Commitment:* You must suppress your own instinct to be generous to avoid standing out.

  #### Path 4: Total Assimilation View
  **DECISION: THE SPLIT BILL CASE**
  *At dinner, you order far less than your friends but are expected to split the bill evenly.*
  *   **LEFT (It is permissible):** **9. The Equality Prioritizer**
      *   *Awkward Commitment:* You accept paying for others' consumption to maintain group harmony.
  *   **RIGHT (It is wrong):** **10. The Accuracy Prioritizer**
      *   *Awkward Commitment:* You accept that insisting on mathematical fairness may damage friendships.

  *(Note: To reach 6 leaves on this side, we split the Total Assimilation View further on a second case.)*

  **DECISION: THE CHILD WATCHING CASE**
  *You cross against the light on an empty street, but a local child who is learning the rules is watching you.*
  *   **LEFT (It is permissible):** **11. The Context Teacher**
      *   *Awkward Commitment:* You accept that you are teaching the child that rules are optional depending on context.
  *   **RIGHT (It is wrong):** **12. The Role Model Absolutist**
      *   *Awkward Commitment:* You must obey even unnecessary rules whenever a child might see you.

  ***

  ## Analysis of the Logical Space

  This tree maps the **occupied** positions—the combinations of views that people actually hold and can defend consistently. However, there are many **empty** combinations (paths we did not take). Here is why they are empty:

  1.  **The Inconsistent Formalist (Empty/Incoherent):** This person thinks you must obey the red light on an empty street (Rule & Order) but thinks it is okay to free-ride on table service (Direct-Harm). This is incoherent because if rules bind simply because they are rules, it shouldn't matter whether free-riding causes direct harm.
  2.  **The Selective Consequentialist (Empty/Unattractive):** This person thinks the empty street crossing is fine (Harm & Purpose) but insists you must split the bill evenly even if you ordered nothing (Total Assimilation). This is unattractive because it mixes a logic of "outcomes" with a logic of "blind obedience."
  3.  **The Private Anarchist (Empty/Unoccupied):** This person thinks public rules (like queues) don't bind them, but private rules (like shoes) do. While logically possible, almost no one argues that public order is optional while home hygiene is mandatory. This position is simply unoccupied.

  ## A Note on Politeness vs. Morality

  You may notice that **Leaf 2 (Compassionate Pragmatist)** and **Leaf 4 (Fair Player)** sound very similar to the view that these rules are merely "polite" or "prudent."

  *   **The Problem:** If a rule is just polite, you can break it when it is inconvenient. If it is a weak moral reason, you need a *good* reason to break it.
  *   **The Test Case:** To separate these views, ask: **"Is it okay to break the queue if you are late for a flight?"**
      *   If you say **Yes**, you likely view the rule as **Politeness** (overrides easily).
      *   If you say **No** (or "Only if the flight is life-or-death"), you view the rule as a **Weak Moral Reason** (harder to override).
      *   *Leaf 2 and Leaf 4 generally fall into the Weak Moral Reason category.*

  ## Closing Notes for Instructors

  **1. On Classifying Conventions**
  Your three-way split (Coordination, Transfer, Risk) is a strong start, but it breaks down in two places:
  *   **Overlap:** Tipping is a "Transfer," but it also "Coordinates" expectations of service quality. Jaywalking is "Risk," but it is also "Coordination" (predictability for drivers).
  *   **The Missing Fourth Kind:** You need a category for **Signaling/Identity**. Rules like removing shoes, dress codes, or how loudly you speak often have no practical harm or financial transfer. They signal respect and group membership. Without this category, you cannot explain why the "Shoe Case" feels morally different from the "Tip Case."

  **2. On Who is Owed What**
  You asked whether the obligation is owed to individuals, the community, or nobody. This handout cannot settle it, but you should know the stakes:
  *   **Owed to Individuals:** If you don't tip, you wronged the *server*. (Focus on harm).
  *   **Owed to the Community:** If you don't queue, you wronged the *practice* of queuing. (Focus on fairness).
  *   **Owed to Nobody:** If you break a rule, you haven't wronged anyone, but you have failed to be a *virtuous guest*. (Focus on character).
  *   *Recommendation:* Tell your participants that for **Coordination** rules (queues), the debt is to the Community. For **Transfer** rules (tips), the debt is to the Individual. For **Signaling** rules (shoes), the debt is to Nobody in particular—it is about your own character.
