answer: |-
  This phrase ("Who are you to judge?") is a rhetorical Swiss Army knife. It conflates epistemology (what can we know?), meta-ethics (what does 'wrong' mean?), and etiquette (how should we behave?). Your brother-in-law (BIL) is likely shifting between these meanings depending on which one protects him best in the moment.

  Here is a breakdown of the precise claims hidden inside that sentence, ordered from pragmatic/boring to deep/philosophical.

  ### 1. The Epistemic Humility Claim
  *   **The Claim:** "You lack the specific context or facts required to evaluate this situation accurately."
  *   **Type:** Platitude / Pragmatic warning.
  *   **Truth Value:** Often true. Outsiders often miss economic or social nuances.
  *   **Does it prove the practice isn't wrong? (Goal A):** **No.** It only suggests *you* might be mistaken about the facts, not that the act is permissible.
  *   **Does it prove you shouldn't speak? (Goal B):** **Yes, temporarily.** It suggests you should withhold judgment until you know more.
  *   **Verdict:** This is the most charitable reading. It asks for patience, not moral silence.

  ### 2. The Standing/Propriety Claim
  *   **The Claim:** "You are not a member of that community/family, so criticizing it is socially intrusive or rude."
  *   **Type:** Social Norm / Etiquette.
  *   **Truth Value:** Subjective. Depends on the social contract of your dinner table.
  *   **Does it prove the practice isn't wrong? (Goal A):** **No.** A thing can be wrong even if it's rude for a stranger to mention it (e.g., domestic abuse).
  *   **Does it prove you shouldn't speak? (Goal B):** **Yes.** This is purely about your behavior, not the practice.
  *   **Verdict:** This supports Goal B but smuggles in Goal A by implying that if it were truly "wrong," social rules wouldn't apply.

  ### 3. The "Blameless Agent" Claim
  *   **The Claim:** "The people doing this aren't morally blameworthy because they were raised in a system where this is normal."
  *   **Type:** Defended Position (Mitigated Responsibility).
  *   **Truth Value:** Plausible. We often excuse individuals who are coerced by culture, even if the act is bad.
  *   **Does it prove the practice isn't wrong? (Goal A):** **No.** It proves the *actors* aren't villains, not that the *act* is good. (e.g., A brainwashed soldier isn't evil, but the war crime is still wrong).
  *   **Does it prove you shouldn't speak? (Goal B):** **No.** You can acknowledge their lack of blame while still condemning the system.
  *   **Verdict:** Confuses the morality of the *agent* with the morality of the *act*.

  ### 4. The Non-Interference Claim
  *   **The Claim:** "It is wrong for outsiders to interfere with the self-determination of other cultures."
  *   **Type:** Defended Position (Political Liberalism / Sovereignty).
  *   **Truth Value:** Contested. A serious ethical principle, but usually applies to states, not dinner conversations.
  *   **Does it prove the practice isn't wrong? (Goal A):** **No.** It admits the practice might be bad but argues stopping it is *worse*.
  *   **Does it prove you shouldn't speak? (Goal B):** **Yes.** Speaking is framed as a form of interference.
  *   **Verdict:** This is a strong argument for Goal B, but it concedes Goal A (that the practice might be bad).

  ### 5. The Cultural Relativism Claim (Meta-Ethical)
  *   **The Claim:** "'Wrong' just means 'forbidden by the local culture.' Since their culture allows it, it is not wrong."
  *   **Type:** Defended Position (Moral Relativism).
  *   **Truth Value:** Highly Contested / Often considered false by philosophers.
  *   **Does it prove the practice isn't wrong? (Goal A):** **Yes.** By definition, if the local culture accepts it, it is "right" for them.
  *   **Does it prove you shouldn't speak? (Goal B):** **Yes.** If there is no universal standard, your criticism is factually incorrect (like saying "driving on the left is wrong" in the UK).
  *   **Verdict:** This is the only claim that supports Goal A. However, it is vulnerable to the "Which Group?" problem (see below).

  ### 6. The Moral Nihilism / Error Theory Claim
  *   **The Claim:** "Nothing is objectively wrong. All moral claims are false expressions of emotion."
  *   **Type:** Defended Position (Moral Nihilism).
  *   **Truth Value:** Defensible in philosophy, but self-undermining in practice.
  *   **Does it prove the practice isn't wrong? (Goal A):** **Yes.** Nothing is wrong.
  *   **Does it prove you shouldn't speak? (Goal B):** **Yes/No.** It makes your speech *factually empty*, but not necessarily rude.
  *   **Verdict:** Self-undermining. If *no* moral claims are true, then the BIL's claim that "you shouldn't judge" is also not true. He is judging you for judging.

  ### 7. The "Tolerance is the Only Virtue" Claim
  *   **The Claim:** "The only universal wrong is intolerance. By judging them, *you* are committing the only real sin."
  *   **Type:** Defended Position (Paradox of Tolerance).
  *   **Truth Value:** Logically fragile.
  *   **Does it prove the practice isn't wrong? (Goal A):** **Yes.** It shifts the "wrongness" entirely onto you.
  *   **Does it prove you shouldn't speak? (Goal B):** **Yes.** Speaking makes you intolerant.
  *   **Verdict:** This is likely what your BIL *feels* is true. It makes his silence a moral virtue and your speech a moral vice.

  ***

  ### Addressing Your Specific Sticking Points

  #### 1. The "Which Group?" Problem (Reference Class)
  You are right to be stuck here. For Claim #5 (Relativism) to work, we must know whose standards define "wrong."
  *   **If it's the Local Group:** What if the local group is changing? In many countries, child labor is illegal and culturally stigmatized by the educated class, even if it persists economically. If the local culture *also* thinks it's wrong (but does it out of necessity), Relativism fails to defend it.
  *   **If it's the BIL's Group:** If the BIL now lives in a country where this is frowned upon, his own current culture might judge him for defending it.
  *   **If it's Your Group:** Then the act *is* wrong, and Relativism fails.
  *   **The Trap:** The slogan "Who are you to judge?" implicitly picks **The Local Group** when defending the act, but switches to **Your Group** (etiquette) when silencing you. It's a moving target.

  #### 2. The "Who is I?" Problem (Standing vs. Truth)
  This is the crux of the rhetorical sleight of hand.
  *   **If "I" refers to Truth:** The question implies "You are factually incorrect." This supports Goal A (The practice isn't wrong).
  *   **If "I" refers to Standing:** The question implies "You are out of place." This supports Goal B (You shouldn't speak).
  *   **The Smuggle:** The phrase uses the grammar of **Standing** ("Who are *you*?") to imply a conclusion about **Truth** ("...therefore this isn't wrong").
  *   **Why it's self-undermining:** If the point is purely about standing ("You aren't from there"), then the BIL has no standing to tell *you* what you should or shouldn't say at *your* dinner table. If he has the standing to tell you to shut up, he admits that people *can* judge behavior. If people can judge behavior, why can't you judge the shop practice?

  ### Summary: Did he win?
  *   **To prove the practice isn't wrong (Goal A):** He failed, unless he is committing to hard Moral Relativism (Claim #5) or Nihilism (Claim #6). Most of the other claims admit the practice might be bad but argue you shouldn't mention it.
  *   **To prove you shouldn't have spoken (Goal B):** He succeeded, but only by shifting the goalposts from "Is this act bad?" to "Is this conversation polite?" (Claim #2 or #7).

  **The Verdict:** He used a **Motte-and-Bailey** tactic.
  *   **The Motte (Defensible):** "You should be humble and recognize cultural differences." (Claim #1)
  *   **The Bailey (Desired):** "Child labor isn't wrong and you are rude for saying it is." (Claim #5 + #2)
  *   When pressed, he retreats to the Motte ("I'm just saying don't be arrogant!"). When unpressed, he occupies the Bailey ("So stop saying it's wrong.").

  You can dismantle this by asking: *"Are you saying I'm factually incorrect that it's harmful to kids, or are you just saying it's rude for me to bring it up? Because those are two different things."*
