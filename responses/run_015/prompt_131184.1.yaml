      *   Fitch's Paradox shows that if all truths are *known* ($\forall p (p \to K p)$), it leads to omniscience, which is absurd. The "Knowability Principle" ($\forall p (p \to \Diamond K p)$) is meant to be weaker, but Fitch showed it also collapses into omniscience under certain assumptions (classical logic, factivity of knowledge, closure of knowledge under conjunction, etc.).
      *   The user's colleague uses it to argue: If it's beyond the horizon, it's unknowable; if unknowable, it's not true (via the maxim). This is a strong verificationist move.

