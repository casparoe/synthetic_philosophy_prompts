answer: |-
  The slogan 'all truths are knowable' is indeed a chameleon in epistemic logic. It frequently masks a conflation of distinct modalities, ranging from trivial logical claims to robust metaphysical commitments. Your colleague's invocation of the maxim to dismiss facts beyond the cosmological horizon suggests they are relying on a specific, strong interpretation—likely a verificationist one—while presenting it as a neutral logical principle.

  To clarify the dialectic, we must distinguish five precise theses that this slogan might encode. I shall analyse each regarding its modal scope, its vulnerability to Fitch's Paradox of Knowability, and its relevance to the cosmological case.

  ### 1. The Metaphysical Knowability Principle
  **Formalisation:** $\forall p (p \to \Diamond_{met} K p)$
  **Reading:** For every proposition $p$, if $p$ is true, then it is *metaphysically possible* for some agent to know $p$. Here, $\Diamond_{met}$ ignores the laws of physics (e.g., the speed of light) and concerns only logical consistency and the nature of properties.

  *   **Status:** Substantive metaphysical commitment (often associated with semantic anti-realism).
  *   **Fitch's Paradox:** **Undermined.** Fitch's proof demonstrates that, assuming classical logic and standard epistemic axioms (factivity and closure under conjunction), this principle entails omniscience ($\forall p (p \to K p)$). Since we are clearly not omniscient, the principle implies there are no unknown truths, which is absurd. To save this thesis, one must adopt non-classical logic (e.g., intuitionism) or restrict the domain of $p$.
  *   **Inference 'Unknowable $\to$ False':** Supported (by contraposition), but only if one accepts the principle despite Fitch's result.
  *   **Cosmological Relevance:** **Changes the subject.** Events beyond the cosmological horizon are *nomologically* (physically) unknowable, but not necessarily *metaphysically* unknowable. A realist holds that such events are true even if physical laws prevent us from knowing them. This thesis only supports your colleague if they assume physical laws are metaphysically necessary or if they deny realism.

  ### 2. The Nomological Knowability Thesis
  **Formalisation:** $\forall p (p \to \Diamond_{phys} K p)$
  **Reading:** For every true proposition $p$, it is possible to know $p$ consistent with the actual laws of nature (including relativity and cosmological horizons).

  *   **Status:** Empirical hypothesis.
  *   **Fitch's Paradox:** **Undermined.** The logical structure is identical to the Metaphysical Principle; Fitch's derivation applies regardless of how the possibility operator is restricted, provided the epistemic axioms hold.
  *   **Inference 'Unknowable $\to$ False':** Supported logically, but the premise is empirically false.
  *   **Cosmological Relevance:** **Directly refuted.** By definition, events beyond the cosmological horizon cannot send signals to us without violating the laws of physics. If this thesis were true, there could be no events beyond the horizon. Invoking this to deny the truth of such events is circular: it assumes the conclusion (that there are no unknowable truths) to deny the existence of the events.

  ### 3. The Temporal (Eschatological) Thesis
  **Formalisation:** $\forall p (p \to \exists t K_t p)$
  **Reading:** Every truth *will* be known at some time $t$ (perhaps in the infinite future).

  *   **Status:** Strong optimistic empiricism.
  *   **Fitch's Paradox:** **Undermined.** Fitch-style arguments can be temporalised. If there is a truth that is currently unknown, the proposition ' $p$ is true but will never be known' generates a contradiction if assumed to be knowable.
  *   **Inference 'Unknowable $\to$ False':** Supported. If a truth is never known, this thesis declares it false.
  *   **Cosmological Relevance:** **False.** Given the heat death of the universe or the expansion of space, there are regions from which light will *never* reach us. This thesis is empirically untenable for cosmological facts.

  ### 4. The Verificationist (Constitutive) Thesis
  **Formalisation:** $p \iff \Diamond K p$
  **Reading:** Truth is *constituted* by knowability. A proposition is not true unless it is possible to verify it. This is not a claim about the world, but a definition of the truth predicate.

  *   **Status:** Substantive metaphysical/semantic commitment (Dummettian anti-realism).
  *   **Fitch's Paradox:** **Compatible (with caveats).** This view typically motivates the rejection of classical logic (specifically the Law of Excluded Middle) to avoid Fitch's derivation of omniscience. By moving to intuitionistic logic, one can assert that all truths are knowable without asserting that all truths are *known*.
  *   **Inference 'Unknowable $\to$ False':** **Supported.** This is the core of the view. If $p$ is permanently unknowable, $p$ lacks a truth value or is false.
  *   **Cosmological Relevance:** **Addresses the case, but at high cost.** This is the only reading that validates your colleague's argument. However, it does so by denying scientific realism. It claims that statements about the region beyond the horizon are not 'genuinely true' because they are verification-transcendent. This is not a logical refutation of inaccessible facts, but a philosophical rejection of realism about them.

  ### 5. The Capacitarian (Trivial) Reading
  **Formalisation:** $\forall p (p \to \neg \Box \neg (\exists x K_x p))$
  **Reading:** There is no *logical contradiction* in the concept of a subject knowing $p$. 'Knowable' here means 'compatible with the nature of knowledge', ignoring situational barriers.

  *   **Status:** Trivial logical truth.
  *   **Fitch's Paradox:** **Avoids Fitch.** This reading is too weak to generate the paradox because it does not imply that the actual world allows for the knowledge, only that the concept is coherent.
  *   **Inference 'Unknowable $\to$ False':** **Not supported.** This reading distinguishes between *capacity* and *opportunity*. A fact may be unknowable due to situational barriers (like the horizon) even if the capacity to know exists.
  *   **Cosmological Relevance:** **Changes the subject.** It conflates 'I cannot know this because I am too far away' with 'This cannot be known because the concept is incoherent'. It offers no comfort to the realist worried about inaccessible facts, as it grants they are unknowable in practice while maintaining they are 'knowable' in a vacuous logical sense.

  ### Summary and Diagnosis of the Colleague's Argument

  Your colleague's argument relies on an equivocation between **Thesis 2 (Nomological)** and **Thesis 4 (Verificationist)**.

  1.  **The Conflation:** They argue that because events beyond the horizon are *physically* unknowable (Thesis 2), they cannot be true. However, Thesis 2 is empirically false (there are physically unknowable truths). To make the inference valid, they must switch to Thesis 4 (Verificationism), where truth *requires* knowability.
  2.  **Fitch's Shadow:** If they insist on Thesis 1 (Metaphysical Knowability) as a logical truth, they run afoul of Fitch's Paradox unless they abandon classical logic. If they accept classical logic, they must admit there are unknown truths, and thus the maxim 'all truths are knowable' is false.
  3.  **The Verdict:** The maxim 'all truths are knowable' is not a neutral logical principle that can be used to dismiss cosmological worries.
      *   If interpreted as a claim about **physical possibility**, it is false.
      *   If interpreted as a claim about **metaphysical possibility**, it is refuted by Fitch's Paradox (given classical logic and the existence of unknown truths).
      *   If interpreted as a **verificationist definition of truth**, it supports your colleague's inference, but only by begging the question against realism. It does not *discover* that horizon events are false; it *stipulates* that unverifiable statements are not truth-apt.

  **Recommendation:** When the maxim is invoked, demand the modal operator be specified. If they mean 'physically possible', point to the horizon. If they mean 'metaphysically possible', invoke Fitch. If they mean 'truth is verification', ask them to defend anti-realism explicitly rather than hiding it behind a slogan.

  ### Comparative Table

  | Thesis | Modal Scope | Fitch Compatible? | Supports 'Unknowable $\to$ False'? | Addresses Horizon Case? |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Metaphysical** | Logical/Metaphysical | No (entails omniscience) | Yes (but leads to absurdity) | No (ignores physical limits) |
  | **2. Nomological** | Physical Laws | No (entails omniscience) | Yes (but premise is false) | No (empirically false) |
  | **3. Temporal** | Time/Future | No (entails omniscience) | Yes (but empirically false) | No (light never arrives) |
  | **4. Verificationist** | Constitutive | Yes (if logic revised) | **Yes (Core commitment)** | **Yes (Denies realism)** |
  | **5. Capacitarian** | Conceptual | Yes (Trivial) | No (Distinguishes capacity/opportunity) | No (Conflates concepts) |

  In short, the only version of the maxim that sustains your colleague's conclusion is the Verificationist Thesis. However, this thesis does not resolve the worry about inaccessible facts; it dissolves it by denying the realist framework in which the worry arises.
