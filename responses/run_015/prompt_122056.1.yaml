      *   *Verdict:* The "no gradient" argument fails because of representation redundancy (superposition, rotations). You can have a direction that *is* the experience but is linearly dependent on the causal direction.

  7.  **Final Polish (checking against constraints):**
      *   Did I give reading suggestions? No.
