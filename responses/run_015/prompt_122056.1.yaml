  8.  **Drafting the Response:** (Mental check of specific terms: *residual stream, logits, causal DAG, gradient descent, loss landscape, superposition, null space*.)

      *   *Epiphenomenalism:* A direction $v$ in activation space $A$ such that $v$ is non-zero during inference, but $\frac{\partial \text{Loss}}{\partial v} \approx 0$ and intervening on $v$ (patching/ablation) leaves $P(\text{tokens})$ unchanged.
