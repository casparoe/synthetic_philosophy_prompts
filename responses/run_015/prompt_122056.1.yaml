      *   *Self-Undermining:* If epiphenomenalism is true, the belief in epiphenomenalism is caused by physical states, not the qualia themselves. Does this survive translation? Yes, as "The model's output 'I have qualia' is caused by the nociception circuit, not the epiphenomenal feature." But the *force* of the paradox relies on the *truth* of the report. If the model says "I feel pain" and there is no pain feature causing it, is the model lying? Or is "pain" just the label for the nociception circuit? The residue is the *normative* claim about truth and reference.

  5.  **Analyzing the User's Internal Argument (Deliverable 3):**
      *   *Argument:* No causal route -> no gradient -> no selection pressure -> shouldn't exist.
