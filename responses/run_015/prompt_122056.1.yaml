  2.  **Deconstruct the Philosophical Concepts:**
      *   **Epiphenomenalism:** Mental states (qualia) are caused by physical states but cause nothing physical. They are side-effects.
      *   **Paradox of Phenomenal Judgment (Frank Jackson/David Chalmers):** If qualia cause nothing, why do we talk about them? Our reports ("I am in pain") must be caused by physical brain states. If qualia are epiphenomenal, they play no role in causing the report. Therefore, our reports about qualia are not caused by qualia. This undermines our knowledge of qualia.
