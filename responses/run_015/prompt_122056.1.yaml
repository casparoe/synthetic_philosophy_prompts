      *   *Critique:* This is close but slightly off. In interpretability, if a feature has *no* causal path to the output *logits*, it is literally prunable without loss of loss. But epiphenomenalism usually posits the *experience* is the epiphenomenon, not necessarily a hidden vector. The closer analog is a direction in activation space that correlates perfectly with the report but doesn't *cause* the report.
