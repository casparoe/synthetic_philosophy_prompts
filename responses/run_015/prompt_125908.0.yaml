      *Self-Correction on Sanction:* If he's a senior and commencement is in 3 weeks, suspending him for a term means he doesn't graduate in May. He graduates in December. That's a huge penalty. Expulsion is permanent. The code says expulsion is on the ladder. He says he accepts it. But the Dean wants no precedent. A suspension protects the institution's integrity without permanent exclusion. Let's stick with withholding degree/conferral for one year.

      *Self-Correction on Waiver:* The code says if he declines account, he waives hearing. But the Board has discretion. I will recommend exercising discretion to hold the hearing for the sake of record completeness and dignity.

