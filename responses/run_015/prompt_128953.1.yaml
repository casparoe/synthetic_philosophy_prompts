answer: |-
  Good morning.

  Three hours ago, I was standing in a hallway down the block, locked in a heated but friendly argument with a colleague. We were talking about hypocrisy. Specifically, my friend asked me a question that has followed me into this room: "Can a hypocritical judge still render a correct verdict?"

  It sounds like a riddle, but it is actually a procedural emergency. If the judge is corrupt, does the law still hold? If the accuser is guilty of the same crime, does the accusation stand? We spent three hours circling this, and I bring it to you now not because I have the answer, but because I believe this tension is the engine that must drive our day together.

  We are here for "Accountability Without Scapegoating." That title promises a lot. It asks us to hold people and institutions answerable for harm without turning them into singular vessels for all our collective grief. But how do we do that when the messengers are messy? When the institution demanding repair is itself broken? When the community seeking justice is fractured by its own compromises?

  My colleague and I kept returning to a distinction that I want to propose as a tool for us today. It is a distinction between two kinds of moral authority. On one side, there is what we might call the **standing to blame**. On the other, the **standing to accuse**.

  These sound similar, but they function differently. The standing to blame is a relational entitlement. It is the right to say, "You have harmed me, or us, or the world, and you must answer for that." It is rooted in the reality of the harm and the relationship between the harmer and the harmed. It does not necessarily require the blamer to be perfect. It requires them to be invested.

  The standing to accuse is different. It is a performative authority. It is the right to deliver a verdict from a position of unexamined moral cleanliness. To accuse is to say, "I am here to judge you because I am not like you." It relies on a hierarchy where the accuser stands above the accused.

  Here is the fork in the road, and here is where the philosophical distinction must do structural work for us. My colleague argued that hypocrisy destroys the standing to blame entirely. If you are guilty, you cannot speak on guilt. I argued that hypocrisy might only destroy the standing to *accuse*, while leaving the standing to *blame* intact.

  Why does this matter? Because it determines what kinds of statements are available to us in this room, and what kinds are foreclosed.

  Let's take a concrete scenario. Imagine a city government that fines a small factory for emissions violations. The factory is indeed poisoning the local water supply. The harm is real. The residents are sick. But it turns out the city's own waste contract is also in breach. The city is polluting too.

  If the city approaches the factory with the **standing to accuse**, it is speaking from a position of claimed cleanliness. It is saying, "We are the regulators, you are the violators. We are clean, you are dirty." In this grammar, hypocrisy is fatal. The factory owners can rightly turn around and say, "You are no better than us." The moral hierarchy collapses. The verdict is paralyzed. The conversation stops, because the authority of the speaker has been undermined by their own record.

  But what if the city approaches the factory with the **standing to blame**? Here, the grammar changes. The city is not claiming elevation. It is saying, "There is harm here. The water is poisoned. Our residents are sick. You contributed to this, and so did we. But right now, we are holding you answerable for your part, because we have the relational duty to protect these residents."

  In this second grammar, the city's own breach does not necessarily cancel the demand for repair. It changes the tone. It prevents the city from claiming moral superiority. It invites the city into the circle of accountability rather than keeping them above it. But it does not necessarily foreclose the demand that the factory stop poisoning the water.

  If we accept this distinction, it reshapes what can be said in restorative settings. For the philosophers in the room, this is your literature on standing made flesh. It is not just about whether a proposition is true, but who has the right to utter it and under what conditions. For the legal practitioners, this is the difference between procedural correctness and moral authority. You can win the case on procedure and lose the peace on authority. And for the organizers who have facilitated circles where an institution's representative apologized for harm they never personally caused—you know this tension. You know the moment when an institution tries to claim the standing to accuse, and the room revolts. You know the difference between an institution that says, "We are here to fix you," and one that says, "We are here to fix this, starting with us."

  This is not a semantic quibble. It is a practical fork. If an institution adopts the grammar of accusation, its own record becomes fair game in ways that can paralyze action. Every demand for repair becomes a battleground about the repairer's purity. We get stuck in whataboutism. We get stuck in scapegoating, because we are looking for a clean party to hold the gavel, and there aren't any.

  But if an institution adopts the grammar of blame—of lament, of demand for repair without claims of elevation—it can legitimately demand change without claiming innocence. It allows for accountability without requiring a saint to administer it.

  However, I am not standing here to tell you that this resolves the problem. I am not sure it holds up. My colleague still believes that if the judge is corrupt, the verdict is tainted, no matter the grammar. There is a risk that allowing hypocritical blame legitimizes power structures that should be dismantled. There is a risk that "standing to blame" becomes a loophole for the powerful to punish the weak without doing their own work.

  We need to test this. We need to see if this distinction can actually carry the weight of the work we want to do.

  Today, we have panels on institutional apology, on legal frameworks for restorative practice, and on the ethics of punishment. As you move into those sessions, I ask you to use this tension as a diagnostic tool. When an institution speaks, listen for the grammar. Are they accusing? Are they claiming a cleanliness they do not possess? If so, expect the process to stall, expect the resistance, expect the scapegoating to begin because the hierarchy is false.

  Or, are they blaming? Are they acknowledging harm, demanding repair, while acknowledging their own entanglement? If so, does that open a path forward? Does it allow for accountability without requiring a moral miracle?

  We are here to build practices that work in the real world, where everyone is complicit, and no one is clean. If we wait for clean hands to hold the gavel, we will never begin. But if we allow dirty hands to wield accusation, we may become what we seek to correct.

  So, I leave you with this framing question to carry through the panels, through the lunch break, and into the final circle:

  **Does hypocrisy nullify blame altogether, or does it only transform its grammar—and if it is only a transformation, what kind of accountability becomes possible when we stop demanding purity from those who demand repair?**

  Thank you. Let's begin.
