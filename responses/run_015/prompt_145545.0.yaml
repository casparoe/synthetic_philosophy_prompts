answer: |-
  The position stated
  The standard rationalist doctrine—that sunk costs are irrelevant to future choice—fails when prior investment generates commitment capital. Unlike fungible resources, commitment capital is path-dependent value embedded in relationships, protocols, and reputations that evaporates upon discontinuity. Honoring sunk costs is rational when abandoning a project destroys this capital, undermining intertemporal consistency and credible signaling. Therefore, prior expenditures are not always irrelevant; they serve as structural anchors preserving long-term strategic coherence against myopic optimization. Rationality requires weighing the destruction of this invisible capital against immediate marginal savings.

  The conceptual distinction
  Resource capital comprises fungible assets—cash, equipment, hours—whose value is independent of history. If you spend $100 on wood, the wood's value remains whether you build a chair or burn it. Commitment capital, conversely, is non-fungible and constitutive. It exists only insofar as the trajectory continues. It includes calibrated trust, shared linguistic norms, and institutional memory. Treating commitment capital as recoverable resource capital is a category error. When you quit, you don't just stop spending; you liquidate the value created by the spending itself. This capital functions as a bond against future defection; its loss incurs hidden restructuring costs that naive forward-looking models omit, effectively taxing discontinuity to preserve cooperative equilibria. Rational agents must account for the liquidation penalty of commitment capital, not just the marginal cost of continuation.

  Core argument applied to the scenario
  Consider the collaborative research program. A funding partner withdraws. Naive rationality says: compare future cost of completion vs. expected value. If a new program elsewhere is cheaper, switch. But this ignores the commitment capital embedded in the shared protocols and calibrated instruments. These aren't just tools; they are crystallized trust networks. The instruments are calibrated to specific shared standards that required years of negotiation. Abandoning them signals unreliability to remaining partners, increasing the risk premium for future collaboration. This creates a group-level analogue to hyperbolic discounting: the team disproportionately values immediate cost savings (now) over long-term cooperative stability (later), because the cost of broken commitment is deferred and diffuse. The "sunk" investment in calibration is actually an upfront premium paid for reduced friction in future data sharing. Quitting forfeits this premium. Restructuring costs—renegotiating protocols, recalibrating trust, re-validating instruments at a new site—are hidden because they manifest as increased transaction costs in future projects, not immediate line items. Furthermore, discontinuity breaks intertemporal consistency. If partners anticipate that the group abandons projects when funding dips, they will withhold full engagement initially, demanding higher upfront guarantees. This defensive posture lowers overall productivity. By honoring the sunk cost, the group demonstrates that their commitment is not contingent on perfect conditions, stabilizing expectations. The rational choice honors the sunk cost to protect the capital it generated, recognizing that the "loss" of the sunk money is actually the price of maintaining the cooperative equilibrium. Switching to a cheaper venue saves cash but burns the bridge required to cross it effectively. The hidden cost of rebuilding trust and re-validating technical standards elsewhere exceeds the marginal savings of the new venue.

  Strongest objection and reply
  Objection: This reasoning invites the "concorde fallacy," justifying endless expenditure on failing projects by labeling all past effort as "commitment." If any sunk cost creates capital, nothing is ever truly sunk, leading to escalatory commitment. Reply: Commitment capital is not infinite; it depreciates and has a terminal value. The rationality condition holds only while the capital's future yield exceeds the cost of maintenance. In the research scenario, if the scientific premise is disproven, the commitment capital value drops to zero regardless of continuation. The distinction lies in whether the capital is *functional* or *fictional*. Honoring sunk costs is rational only when the capital remains viable and the discontinuity cost is verifiable. We are not defending stubbornness, but recognizing that some assets only exist on a specific path. The test is not "have we spent much?" but "does stopping destroy value that continuing preserves?"

  What would change my mind
  I would reject this framing if commitment capital proved fully convertible into reputational resource capital elsewhere. If trust networks are portable and protocols universally adaptable, discontinuity costs are merely transaction fees, not capital destruction. My reasoning is most vulnerable regarding measurability. If there is no objective way to distinguish genuine commitment capital from psychological attachment to past effort, the framework becomes unfalsifiable. Demonstrating that agents who ignore sunk costs consistently outperform those who honor them in repeated games would undermine the claim that honoring them is rational rather than merely a heuristic.
