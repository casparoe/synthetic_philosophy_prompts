answer: |-
  The error lies in **Step (2)**.

  It looks innocent because it disguises a substantive claim about historical agency as a trivial claim about temporal location. Once you reject (2), Step (3) collapses, Step (5) is neutralized, and your commitment to (1) and (6) becomes consistent without requiring you to abandon the idea of progress.

  Here is the diagnosis of why (2) fails, the cost of the rejection, and how your friend's argument can be repaired.

  ### The Diagnosis: The Monolithic Present Fallacy

  Step (2) states: *"Whatever she writes, she writes it under some present set of standards, and there is no external position from which that framework could have been chosen or refused."*

  The first clause is a restatement of (1) and is true. The second clause is where the reasoning breaks. It asserts that because there is no *external* (Archimedean) position from which to choose a framework, the framework actually employed was *unchosen* (unavoidable).

  This relies on a hidden premise: **Choice requires an external vantage point.**

  This is false. We do not need to stand outside of time to choose between concepts available within time. The "present" is not a monolith; it is a contested space containing multiple, incompatible frameworks. A historian in 1890 writing about Rome had access to racial-civilizational categories, but she also had access to philological, legal, and economic categories that did not rely on the same biological determinism. She *could* have refused the racial framework, not by stepping out of 1890, but by selecting a different set of 1890 concepts.

  Step (2) conflates **situatedness** (which is inescapable) with **determinism** (which is not). It argues that because we cannot escape our skin, we cannot choose how to move our limbs. But the criticism in (6) is not that past historians failed to be timeless; it is that they failed to be *rigorous within their own time*. They are criticized for adopting the path of least resistance among available concepts, or for ignoring evidence that was available *then* which contradicted their chosen framework.

  ### Why It Looked Innocent

  Step (2) borrows its plausibility from Step (1). Since (1) correctly establishes that we cannot write from nowhere, (2) feels like a mere elaboration. It exploits the intuition that "culture" or "epoch" exerts a heavy gravitational pull. It is true that frameworks are hard to escape; it is false that they are impossible to resist. By sliding from "hard" to "impossible," Step (2) converts a sociological difficulty into a logical necessity, which then triggers the moral shield in Step (3).

  ### The Cost of Rejection

  You asked to price the rejections of (2), (3), and (5).

  **1. Rejecting (2) (The Recommended Path)**
  *   **Cost:** Low. You must accept that historians have agency within their temporal context. You must acknowledge that "the present" is plural, not singular.
  *   **Impact on Progress (6):** This *saves* progress. Progress in historiography is not the asymptotic approach to a "view from nowhere"; it is the refinement of the toolkit available *within* the present. We judge Gibbon or Mommsen not because they lacked our concepts, but because they neglected evidence or logical coherence that was available to *them*.
  *   **Impact on Diachronic Parity (5):** This clarifies (5). Future historians *can* criticize us, but only on grounds available to us. They cannot criticize us for lacking *their* concepts (e.g., a 2320 concept of "neuro-historical agency"), but they can criticize us for ignoring the climate data we already had. Parity is preserved, but the ground of criticism shifts from "failure to predict the future" to "failure to utilize the present."

  **2. Rejecting (3) ("Ought implies Can")**
  *   **Cost:** Prohibitive. This is a foundational principle of moral and epistemic responsibility. If you reject this, you are claiming historians *ought* to have done what they *could not* do. This leads to a form of idealism that makes historical judgment purely punitive rather than explanatory. It severs the link between blame and agency.
  *   **Impact on Progress:** It makes progress unintelligible. If we can blame past historians for failing to meet impossible standards, "progress" becomes merely a change in our capacity for self-righteousness, not an improvement in knowledge.

  **3. Rejecting (5) (Diachronic Parity)**
  *   **Cost:** High (Special Pleading). To reject (5) is to claim that *we* have a privilege the past did not: the right to judge them by our standards, while denying them the right to judge us by theirs (or future standards). This is intellectually unstable. It requires you to argue that the 19th-century historian was bound by their time, but you are somehow less bound by yours.
  *   **Impact on Progress:** It preserves progress only by making it unilateral. It turns history into a court where the living are always the judges and the dead are always the defendants, which undermines the claim that history is a cumulative science.

  ### Can the Friend's Argument Be Repaired?

  Yes. Your friend's argument is a *reductio* of a specific, strong definition of presentism, but it can be repaired into a defensible, weaker principle.

  The repair requires modifying Step (4) and (5) to distinguish between **Retroactive Criticism** and **Contemporaneous Criticism**.

  *   **The Repaired Principle:** Historians cannot be criticized for failing to use concepts that did not exist in their time (e.g., criticizing Herodotus for not using carbon dating). However, they *can* be criticized for how they deployed the concepts that *did* exist (e.g., criticizing Herodotus for credulity regarding sources he himself admitted were dubious).
  *   **The Repaired Parity:** Future historians may judge us for our blindness to the climate crisis (which we had data for), but they cannot judge us for failing to anticipate a catastrophe that left no trace in our evidence.

  **Summary:**
  The chain breaks at **(2)** because it assumes that lacking an *external* viewpoint precludes *internal* choice. By rejecting this, you preserve the inescapability of perspective (1) without surrendering the possibility of error (6). You keep progress as the story of how historians learn to use their own present's tools more critically, rather than the story of how they escape their own skins. Your friend's argument, once this distinction is made, ceases to be a defense of presentism and becomes a defense of **charity**: we must not judge the past for lacking the future, but we need not excuse them for misusing the present.
