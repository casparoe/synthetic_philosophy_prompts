answer: |-
  This is a rigorous request from someone who knows how to handle a hypothesis. I will treat the essay excerpt as a specimen and dissect it against the text of *On Certainty* (OC), keeping your biological case study in mind as a control.

  ### Part 1: Claim-by-Claim Audit

  Here is the breakdown of the essay's assertions against Wittgenstein's actual text.

  | Essay Claim | Verdict | Commentary |
  | :--- | :--- | :--- |
  | **Wittgenstein argued with Moore (Hand/Earth).** | **Endorsed.** | Accurate historical and textual context (OC §§ 1–30). |
  | **These propositions are not known; they are hinges.** | **Endorsed.** | Central thesis. "The *questions* that we ask and our *doubts* depend on the fact that some propositions are exempt from doubt... they form the scaffolding of our thoughts" (OC § 341). |
  | **Hinges cannot be proved/disproved; tests assume them.** | **Endorsed.** | "If I want the door to turn, the hinges must stay put" (OC § 343). Verification presupposes the hinge. |
  | **Cannot genuinely be doubted (doubt needs grounds).** | **Endorsed.** | "A doubt without an end is not even a doubt" (OC § 625). Global skepticism is nonsensical. |
  | **Hinges are not beliefs in the ordinary sense (no evidence).** | **Harmless Simplification.** | Wittgenstein says they *look* like empirical propositions but function differently (OC § 308). Calling them "beliefs" is risky but acceptable if qualified. |
  | **Entitled to hold without evidence; irrational to surrender.** | **Subtly Wrong.** | Wittgenstein avoids normative epistemology ("entitled," "irrational"). He describes grammar, not justification. To say it is "irrational" is to judge the hinge by the rules of the game it constitutes. |
  | **Hinges function like a paradigm (adopted because they pay off).** | **Not Wittgenstein's View.** | This is Kuhn/Pragmatism. Wittgenstein sees hinges as *inherited*, not chosen (OC § 144, § 159). We do not shop for world-pictures based on utility. |
  | **Edifice rests on ungrounded certainty.** | **Endorsed.** | "I act with *complete* certainty. But this certainty is my own" (OC § 174). |
  | **Deepest disputes cannot be settled by argument (no common ground).** | **Harmless Simplification.** | Wittgenstein says reasons run out (OC § 192), but implies shared "forms of life" remain. "No common ground" is too strong; there is usually shared human behavior, even if concepts differ. |
  | **Persuasion remains (missionaries).** | **Endorsed.** | Direct reference to OC § 611–612. |
  | **Science vs. Superstition: not better reasons, different games.** | **Subtly Wrong.** | Wittgenstein respects the specific criteria of the scientific language game. He would not equate the *status* of the games, though he admits the ultimate foundations of both are not empirically proven. |

  ### Part 2: The Two Pressed Points

  **1. Belief vs. Entitlement (The Normative Slide)**
  Your suspicion is correct. The essay commits a category error. Wittgenstein's project in *On Certainty* is therapeutic, not foundationalist. He is not trying to tell us what we are *justified* in believing; he is trying to show us that the search for justification stops somewhere, not because we found a solid rock, but because the spade is turned (OC § 192).

  When the essay says we are "entitled" to hold hinges and it would be "irrational" to surrender them, it reintroduces the very epistemological normativity Wittgenstein is dissolving. For Wittgenstein, holding a hinge is not a matter of rationality; it is a matter of intelligibility. If you doubt whether the earth existed before your birth, you are not being *irrational*; you are failing to participate in the language game of history or geology. You are opting out of the practice. The essay tries to save Rationality by giving it a new foundation (hinges). Wittgenstein wants to show that Rationality is a move *within* a system, not the judge *of* the system.

  **2. Paradigms and Payoffs (The Kuhn Smuggle)**
  Your nose is absolutely right. The phrase "adopted because they pay off, and abandoned when a rival framework proves more fruitful" is Thomas Kuhn (*The Structure of Scientific Revolutions*) or perhaps Richard Rorty, not Ludwig Wittgenstein.

  *   **What is lost:** Wittgenstein's view is more passive and anthropological. We do not *adopt* hinges; we find ourselves thrown into them. They are part of the "inherited background against which I distinguish between true and false" (OC § 94). By making hinges instrumental choices ("pays off"), the essay suggests a level of agency and meta-cognition that Wittgenstein denies. We do not stand outside our world-picture to evaluate its utility. We are inside it.
  *   **The Consequence:** If hinges are chosen for utility, then the essay's relativism is pragmatic (Science is just more useful than Superstition). If hinges are inherited (Wittgenstein), the distinction is grammatical (Science and Superstition have different criteria for truth). The essay wants the relativist conclusion (no objective ground) but the comfort of pragmatism (science wins because it works). Wittgenstein offers neither comfort nor relativism; he offers a description of how language actually functions.

  **3. Does the Relativist Conclusion Survive?**
  If we correct the "payoff" error, the relativist conclusion weakens. The essay argues: *Different hinges = No common ground = Only conversion possible.*
  Wittgenstein argues: *Different hinges = Different language games.*
  However, Wittgenstein does not conclude that communication is impossible. He notes that when reasons run out, persuasion takes over, but this persuasion relies on shared human reactions (forms of life). If the missionary and the convert did not share basic reactions to pain, color, or causality, no conversion could occur. The essay implies a hard incommensurability that Wittgenstein does not strictly endorse. He acknowledges the difficulty of crossing systems, but not the impossibility. The "missionary" remark is not a concession that truth is relative; it is an observation that *justification* is local.

  ### Part 3: The Prion Case Study

  You ask whether the "infectious agents carry nucleic acid" dogma was a hinge, and whether its overturning refutes the claim that hinges are unrevisable.

  **1. Was it a Hinge?**
  Strictly speaking, **no**. In the Wittgensteinian sense, "All infectious agents carry nucleic acid" was a **high-level empirical generalization that had hardened into a dogma.**
  *   **A True Hinge:** "Objects do not vanish when unobserved," "My memory is broadly reliable," "The earth is very old." These are conditions for the possibility of doing biology.
  *   **The Prion Dogma:** This was a rule *within* the biology game, not a condition *of* the game. It was a theoretical constraint derived from the Central Dogma of molecular biology.

  However, sociologically, it *functioned* as a hinge for your community *in media res*. You said it was "unthinkable rather than improbable." This is the hallmark of a hinge: it is removed from the traffic of verification (OC § 103). Colleagues did not ask for evidence against it; they questioned the *sense* of the proposal. That is hinge-behavior.

  **2. Does this refute Wittgenstein?**
  No, but it clarifies the distinction between a **logical hinge** and a **sociological dogma**.
  Wittgenstein admits hinges can change, but he describes it as the shifting of a river-bed (OC § 96–99). The water (empirical propositions) flows over the bed (hinges). Occasionally, the bed shifts.
  *   **The Prion Shift:** This looks less like a river-bed shift and more like the water eroding a rock that was thought to be bedrock. The proposition was treated *as if* it were a hinge, but it remained vulnerable to a new conceptual framework (protein folding as information).
  *   **Revisability:** Wittgenstein does not say hinges are *never* revised. He says they are not revised *by the normal methods of testing* that they govern. The Prion hypothesis wasn't accepted because someone finally found a piece of nucleic acid attached to the protein. It was accepted because the *criteria* for what counts as "replication" or "infection" shifted. The language game of biology expanded to include conformational templating.

  **3. Can we tell the difference *in media res*?**
  This is the sharpest question. Wittgenstein's answer is blunt: **Look at the use.**
  *   If a proposition is used to test other things, it is functioning as a hinge.
  *   If it is itself being tested by other things, it is an empirical proposition.
  *   **The Trap:** In your field, during the dismissal period, the nucleic-acid assumption was *used* to dismiss evidence. Therefore, at that time, it *was* a hinge for that community.
  *   **The Distinction:** A logical hinge (Earth exists) is hard to imagine being otherwise without collapsing the whole system. A dogmatic hinge (Infection = DNA) collapses only a sub-system. The problem is that inside the episode, the sub-system feels like the whole system. You cannot know for certain if you are holding a universal hinge or a local dogma until the system breaks.

  **4. Your Inclination: "Foundations are revisable and hence not arbitrary."**
  Here I must be blunt: **You are projecting.**
  *   **Revisable:** Yes, Wittgenstein agrees hinges shift (river-bed).
  *   **Not Arbitrary:** Wittgenstein does not support this. He does not care about "arbitrariness." He cares about *groundlessness*. The river-bed shifts, but not necessarily toward "truth" or "better payoff." It just shifts.
  *   **Your Error:** You are reading Wittgenstein through a Popperian or Kuhnian lens of scientific progress. You want to say the Prion episode shows science *corrects its foundations*. Wittgenstein would say the Prion episode shows that *what counted as a foundation changed*. He would not endorse the claim that the new foundation is "less arbitrary" or "more rational" than the old one, only that it is the one we now use to play the game.
  *   **The Essay's Error:** The essay claims hinges are abandoned when a rival "pays off." This supports your view (progress/utility). Wittgenstein's actual view is more neutral: hinges change when the form of life changes.

  ### Summary of Errors

  **The Essay's Errors:**
  1.  **Normative Slide:** It treats hinges as justified beliefs ("entitled," "irrational") rather than grammatical scaffolding.
  2.  **Pragmatic Smuggle:** It imports Kuhnian instrumentalism ("pays off") where Wittgenstein posits inherited certainty.
  3.  **Hard Relativism:** It exaggerates the incommensurability of different systems, ignoring the shared human "form of life" that makes persuasion possible.

  **Your Errors:**
  1.  **Progress Narrative:** You interpret hinge-revisability as evidence of scientific self-correction toward non-arbitrary truth. Wittgenstein offers no such teleology.
  2.  **Category Conflation:** You treat a domain-specific dogma (nucleic acid) as equivalent to a transcendental hinge (external world). While they function similarly psychologically, they differ logically. The former is a rule of a specific game; the latter is the board the game is played on.

  **Final Verdict on the Prion Case:**
  The episode does not refute Wittgenstein, but it exposes the danger of the essay's simplification. The nucleic-acid assumption was a **local hinge** (a rule of the molecular biology game) mistaken for a **universal hinge**. Its revision shows that local hinges are revisable when the game expands. It does not show that *all* foundations are revisable by evidence. It shows that what we *take* to be a foundation is often just a very deep empirical generalization. Wittgenstein would say: "You thought it was a hinge. It turned out to be a move. Now you have a new hinge." He would not say: "You found the truth."

  The essay is a useful popularization but fails the strict philosophical audit. Your instinct that it was "suspicious" was correct, specifically regarding the justification of hinges and the mechanism of their change. However, your own conclusion that this proves the non-arbitrary nature of scientific foundations goes beyond what the text supports.
