  6.  **Writing - Section by Section:**

      *   *Brainstorming:* Focus on the risk of "philosophizing instead of decoding." The director sees Quine as a wall; I see Quine as the terrain. If we treat indeterminacy as a bug, we will fail. If we treat it as a constraint on what "success" means, we might build something useful. Suspicion: The desire for "The Meaning" is the real enemy, not Quine. Discarded: Trying to solve Quine (impossible) or ignoring him (naive).
