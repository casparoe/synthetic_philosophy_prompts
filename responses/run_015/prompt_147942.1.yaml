answer: |-
  ### The weak link

  The weak link is Step (5). It looks plausible because rights are indeed codified in laws and passports, much like the value of a £5 note. However, it commits a category error by treating 'rights-bearing human' as a uniform kind like 'money' or 'race'. Money has no existence outside agreement; a human being does. Step (5) assumes all social constructions are 'constitutive', creating the very thing they name. But rights are often 'recognitive'. They acknowledge capacities—like suffering or reasoning—that exist prior to classification. By conflating the institutional status (rights) with the ontological substrate (the human), Step (5) forces a false choice. You can accept that rights are administered socially without accepting that the moral worth they protect is merely a bureaucratic invention. The chain breaks here because the construction of rights tracks something real, whereas the construction of race does not track a biological essence. Step (5) ignores that some constructions are responses to brute facts, not replacements for them. This distinction preserves the reality of your experience against bureaucratic erasure.

  ### The price of fixing it

  Fixing this comes at a theoretical cost. You lose the elegant symmetry of radical constructivism, where everything is equally malleable. If rights track pre-social capacities, you must admit some form of naturalism: there are facts about humans that matter morally, regardless of paperwork. This makes it harder to argue that all categories are purely political tools. You also complicate the critique of power. If rights are partly grounded in reality, oppressive regimes are not just reclassifying things; they are violating objective moral truths. This protects the individual (honouring Step 7), but it requires you to defend the existence of those universal capacities against sceptics. You cannot simply say 'all categories are fictions'; you must argue which fictions are legitimate responses to reality. It demands a more nuanced ontology, distinguishing between kinds we invent and statuses we recognise. You sacrifice theoretical simplicity for moral robustness. It forces you to argue for human nature without slipping into bigotry.

  ### Bottom line

  This leaves race, gender, and money firmly constructed, but not identically to rights. Money is purely constitutive; without society, it is paper. Race is a classification without biological essence, yet it has real social effects. Rights, however, are protective shells around a core that exists independently. Rejecting (5) doesn't resurrect racial essentialism; race lacks a natural essence to track. But human worth isn't a kind like race; it is a response to capacity. You keep your dignity (7) without conceding that race is biological. Constructivism survives, just not as a universal solvent.
