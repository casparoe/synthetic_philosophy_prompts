  ### Concrete Counterexamples

  #### 1. Disproving Strategy-Proofness with Arbitrary Preferences (Part ii/iii)
  The student claims the rule is strategy-proof even with arbitrary preferences. This is false. A voter can manipulate by reporting a "peak" that is not their true top, in order to move the median to an alternative they prefer more than the truthful median.

  **Profile:**
  *   **Voters:** 5 members ($i=1,\dots,5$).
  *   **Alternatives:** $\{0, 2, 4, 6, 8\}$.
  *   **Anchors:** $0, 8$.
  *   **Voter 1 True Preferences:** $0 \succ 4 \succ 2 \succ 6 \succ 8$. (Top is 0, but prefers 4 over 2).
  *   **Voters 2–5 Reports:** $2, 2, 6, 6$.

  **Scenario A: Truthful Reporting**
  *   Voter 1 reports top: **0**.
  *   Set of 7 numbers: $\{0, 0, 2, 2, 6, 6, 8\}$ (Anchors 0, 8 + Reports 0, 2, 2, 6, 6).
  *   Sorted: $0, 0, 2, \mathbf{2}, 6, 6, 8$.
  *   **Outcome:** **$2m**.
  *   Voter 1 Utility: 3rd best alternative.

  **Scenario B: Manipulative Reporting**
  *   Voter 1 reports: **4** (Lying about top).
  *   Set of 7 numbers: $\{0, 2, 2, 4, 6, 6, 8\}$ (Anchors 0, 8 + Reports 4, 2, 2, 6, 6).
  *   Sorted: $0, 2, 2, \mathbf{4}, 6, 6, 8$.
  *   **Outcome:** **$4m**.
  *   Voter 1 Utility: 2nd best alternative.
  *   **Result:** $4 \succ 2$, so Voter 1 strictly prefers the outcome of the lie. **The rule is manipulable.**

  #### 2. Disproving "Not Onto" (Part iii)
  The student claims $0m and $8m can never win. This is false.

  **Profile for $0m:**
  *   All 5 voters report **0**.
  *   Set: $\{0, 0, 0, 0, 0, 0, 8\}$ (5 reports + Anchor 0 + Anchor 8).
  *   Sorted: $0, 0, 0, \mathbf{0}, 0, 0, 8$.
  *   **Outcome:** **$0m**. (0 is in the range).

  **Profile for $8m:**
  *   All 5 voters report **8**.
  *   Set: $\{0, 8, 8, 8, 8, 8, 8\}$.
  *   Sorted: $0, 8, 8, \mathbf{8}, 8, 8, 8$.
  *   **Outcome:** **$8m**. (8 is in the range).

  **Consequence:** The rule **is onto**. In Part (iii), with unrestricted domain and onto range, **Gibbard–Satterthwaite applies**. Since the rule is not dictatorial, it **must be manipulable**. The student's conclusion that the committee is "safe" is incorrect.

