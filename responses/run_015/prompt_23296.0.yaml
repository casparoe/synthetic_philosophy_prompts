  I just spent like two hours arguing with my friend about whether the intuitionistic logic that type theorists actually work with (CIC, the Curry-Howard correspondence and all that) is the same thing Brouwer meant by intuitionism, or just a proof system that happens to drop the law of excluded middle. I think he's got a point that the BHK interpretation is doing a lot of heavy lifting, but I cant pin down where the two actually diverge. Can you compare Brouwer's original intuitionism (mathematical objects as mental constructions, the anti-realist bit) with the more formal constructivism of Bishop and the type theoretic tradition? I'm specifically curious about where Brouwer's philosophical anti-realism gets preserved and where it gets deflated, and whether treating "constructive" as a property of proofs rather than of mathematical objects loses anything important.
