answer: |-
  Your friend has a point, and you were right to feel that something was slipping through the cracks. The short answer is: **No, the intuitionistic logic used in Type Theory (CIC, MLTT, etc.) is not the same thing Brouwer meant.**

  They are related historically and technically, but they diverge sharply on ontology. Brouwer's intuitionism is a **metaphysical thesis** about the nature of mathematical reality, whereas modern Type Theory is a **formal framework** that happens to be compatible with constructive metaphysics but doesn't require them.

  Here is the breakdown of where Brouwer's radical anti-realism gets preserved, where it gets deflated by Bishop, and where it essentially vanishes in the Type Theoretic tradition.

  ### 1. Brouwer's Intuitionism: Mathematics as Mental Activity
  For L.E.J. Brouwer, mathematics is not about truth, symbols, or logic. It is a **languageless activity of the mind**.

  *   **Ontology:** Mathematical objects *are* mental constructions. They do not exist independently of the mathematician constructing them. There is no "Platonic heaven."
  *   **The Role of Logic:** Logic is *derived* from mathematics, not the other way around. Logic is a description of the patterns we notice in successful mental constructions. Therefore, logic is fallible and secondary.
  *   **The Rejection of LEM:** Brouwer didn't drop the Law of Excluded Middle ($P \lor \neg P$) because it was a rule in a game. He dropped it because, for infinite totalities, we cannot survey the whole. To claim $P \lor \neg P$ is to claim that every problem is solvable *now*, which contradicts the open-ended nature of time and the "Creating Subject."
  *   **Anti-Formalism:** This is the big one. Brouwer hated formalism (Hilbert's program). He believed reducing math to symbol manipulation stripped it of its meaning. For Brouwer, **mathematics happens before language.**

  **What is preserved here?** A radical anti-realism. Math is a human, temporal activity.

  ### 2. Bishop's Constructivism: The Pragmatic Deflation
  Errett Bishop came along in the 60s and essentially said: "Brouwer was right about the math, but crazy about the philosophy."

  *   **The Shift:** Bishop stripped away the metaphysics of the "Creating Subject" and the mysticism of the "Ur-intuition of time."
  *   **Ontology:** A mathematical object exists if we can compute it. A theorem is a promise of an algorithm.
  *   **Goal:** To do "meaningful" mathematics that works for numerical analysis, without committing to Brouwer's view that the mind creates the universe.
  *   **Relation to Classical Math:** Bishop viewed constructive math not as a rival universe, but as a subset of classical math with higher standards of evidence.

  **What is deflated here?** The anti-realism becomes methodological rather than ontological. You don't have to believe math is *only* in your head; you just have to agree to play by rules that ensure computability.

  ### 3. Type Theory (CIC / Curry-Howard): The Formalization
  This is where you and your friend were arguing. In Type Theory (like Coq or Agda), we have the Curry-Howard correspondence: **Propositions are Types, Proofs are Programs.**

  *   **Ontology:** This is usually agnostic. A "term" in CIC is a syntactic object. Whether that term corresponds to a mental construction (Brouwer), a computer program (Bishop), or a Platonic form is up to the user's interpretation.
  *   **The Status of LEM:** In CIC, LEM is not "false." It is **independent**. You can work in a constructive context (no LEM), or you can import an axiom that adds LEM (`Classical_Prop`). The system itself is a container; it doesn't enforce Brouwer's metaphysics.
  *   **Proofs as Objects:** This addresses your specific curiosity. In Brouwer's view, the *object* is the construction. In Type Theory, the *proof* is the object (the term), and the *proposition* is the type.
      *   **Brouwer:** Construction = Object. Proof is just the record.
      *   **Type Theory:** Proof = Term (Program). Object = Inhabitant of a Type.
      *   **The Divergence:** Type Theory reifies the *proof* into a static syntactic entity. Brouwer viewed the construction as a dynamic, temporal process. Type Theory freezes time into a derivation tree.

  ### Where the Divergence Matters (The "Loss")

  You asked if treating "constructive" as a property of proofs rather than objects loses anything important. **Yes, it loses the temporal and epistemic dimension.**

  #### 1. The "Creating Subject" Arguments
  Brouwer had specific counter-examples to classical principles based on the idea that the mathematician's knowledge evolves over time (e.g., "I have not proved $P$ yet, but I might tomorrow"). This requires a logic of time and knowledge.
  *   **Type Theory:** Standard CIC is static. A term either inhabits a type or it doesn't. It doesn't capture "I don't know yet." (Unless you add modal logic, which is non-standard).
  *   **Loss:** The dynamic nature of mathematical discovery is flattened into static verification.

  #### 2. Formalism vs. Intuition
  Brouwer argued that language is inherently imperfect and cannot capture mathematical truth.
  *   **Type Theory:** Is a formal language. It assumes that if you can write the term, you have the math.
  *   **Loss:** Brouwer would argue that Type Theory is just another Hilbertian formalist trap. It confuses the map (the syntax) with the territory (the mental construction). By making the syntax the primary object of study, Type Theory commits the sin Brouwer fought hardest against.

  #### 3. The Meaning of "Existence"
  *   **Brouwer:** $\exists x. P(x)$ means "I have constructed $x$ in my mind."
  *   **Type Theory:** $\exists x. P(x)$ means "There is a term $t$ and a proof $p$ in the system."
  *   **The Gap:** In Type Theory, you can have a term that normalizes but corresponds to no feasible mental construction (e.g., a proof term so large no human can grasp it). For Brouwer, if no human mind can construct it, it doesn't exist. For Type Theory, as long as the reduction rules hold, it exists.

  ### Summary: The Spectrum of "Constructive"

  | Feature | Brouwer (Intuitionism) | Bishop (Constructivism) | Type Theory (CIC/MLTT) |
  | :--- | :--- | :--- | :--- |
  | **Primary Ontology** | Mental Constructions | Algorithms / Computations | Syntactic Terms / Types |
  | **Status of Logic** | Derived from Math (Secondary) | Tool for reasoning | Embedded in Type System |
  | **Law of Excluded Middle** | False (for infinite domains) | Avoided (not generally valid) | Independent (Optional Axiom) |
  | **View on Formalism** | Hostile (Language is imperfect) | Pragmatic (Useful tool) | Embraced (Syntax is central) |
  | **"Constructive" means...** | "Constructed by the Subject" | "Computable in principle" | "Has a Normal Form / Witness" |

  ### Verdict on Your Argument
  Your friend is right that they aren't the same thing.
  *   **Brouwer** offers a **philosophy** of math where constructivity is an ontological requirement.
  *   **Type Theory** offers a **logic** where constructivity is a syntactic property.

  Type Theory *preserves* the BHK interpretation (Heyting semantics) technically, but it *deflates* it philosophically. It turns "construction" from a mental act into "reduction to normal form."

  **Does this loss matter?**
  *   **For doing math/CS:** No. Type Theory is vastly more useful. It allows us to verify code and proofs without needing to psychoanalyze the mathematician's mental state.
  *   **For Philosophy:** Yes. If you care about *why* math works or the relationship between mind and truth, Type Theory is silent. It gives you the machinery of constructivism without the engine of intuitionism.

  You were arguing about **ontology** (what math *is*), while your friend was arguing about **syntax** (how we *write* math). You are both right, but you were talking past each other. Type Theory is a formal system that *accommodates* intuitionism, but it is not *bound* by it.
