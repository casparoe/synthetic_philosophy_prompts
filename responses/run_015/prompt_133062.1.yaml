answer: |-
  **Handout: Moore, Memory, and the Limits of Proof**

  **1. Formalizing the Arguments**

  To evaluate your friend's analogy, we must first strip both arguments to their logical cores. While they appear parallel, the epistemic status of their premises differs significantly.

  **Moore's Proof of an External World**
  *   **P1:** Here is one hand (indicated).
  *   **P2:** Here is another hand (indicated).
  *   **P3 (Bridge):** Hands are material objects existing in space external to our minds.
  *   **C:** Therefore, there are at least two material objects existing in space external to our minds.

  **The Memory "Proof" of the Past**
  *   **P1*:** I remember eating breakfast this morning.
  *   **P2*:** I remember my eighth birthday.
  *   **P3* (Bridge/Factivity):** Memory is factive (if one remembers that *p*, then *p* occurred).
  *   **C*:** Therefore, there is a past (and memory is not globally unreliable).

  **Structural Disanalogy:** Moore's P1 is perceptual. One can grant "I seem to see a hand" without granting P1. Moore insists P1 is known, not merely seemed. In the Memory case, "I remember" is arguably factive by definition; if I didn't eat breakfast, I don't *remember* it, I merely *seem to remember*. Thus, the skeptic against the past must attack the classification of the mental state ("That isn't memory, it's confabulation"), whereas the external world skeptic can grant the perceptual experience while denying the object. This distinction drives the following analysis.

  ***

  **2. Three Critical Questions**

  **Q1: Can we know the premises without proof?**
  Moore's defense against the charge of begging the question is that he knows P1 and P2 with greater certainty than he knows the premises of any skeptical argument (e.g., "If you don't know you aren't dreaming, you don't know you have hands"). He claims immediate, non-inferential knowledge.

  Does this hold for the Memory Proof? Here, the asymmetry is sharp. Moore appeals to *present* perception. The skeptic asks, "How do you know?" Moore says, "I see it." The Memory Prover appeals to a faculty that traces to the *past*. If the reliability of memory is the very thing under suspicion, claiming to *know* P1* ("I remember...") looks more vulnerable than Moore's claim. To claim I *know* I remember is to claim I know the trace is veridical. If the faculty generating the premise is the target of the skepticism, asserting the premise as known knowledge feels more like circularity than in the perceptual case. Moore's premise rests on a present datum; the Memory premise rests on a historical claim disguised as a present state. Thus, Moore's answer has less force in the memory case because the "knowledge" of memory is inherently retrospective, whereas the "knowledge" of hands is ostensibly immediate.

  **Q2: Does empirical evidence of unreliability matter?**
  Psychology suggests memory is reconstructive and prone to confabulation. Perception has illusions, but we do not have "first-order" evidence that hands generally don't exist when we see them. We do have evidence that people "remember" things that never happened.

  Does this make the Memory Proof worse? For a dialectical proof intended to convince a skeptic, yes. The skeptic can point to empirical data to lower the probability of P3*. However, for a *Moorean*, empirical defeaters are secondary. Moore's point is that the certainty of "Here is a hand" outweighs the abstract possibility of error derived from skeptical hypotheses. If we apply this strictly to memory, the Moorean must say: "My certainty that I ate breakfast outweighs the psychological statistics on confabulation."

  This reveals a tension. If we accept Moore's method, we must grant the Memory Proof validity *if* the subject is certain. But the empirical asymmetry explains *why* we resist the Memory Proof more than Moore's. We feel the fragility of memory more than the fragility of present perception. This suggests Moore's argument relies on a specific phenomenological privilege of the present moment that memory lacks. The empirical evidence isn't logically decisive against either, but it explains the intuitive resistance to the Memory analogy.

  **Q3: The Self-Undermining Skeptic**
  The skeptic about the past can hypothesize the world began five minutes ago, complete with false memories. This threatens the activity of arguing itself. To run an inference, one must retain a premise from step one to step two. If there is no past, there is no retention, and thus no argument.

  Is this a liability for the Memory Proof, or does it show the skeptic has sawed off the branch? It is the latter. Radical skepticism about the past is pragmatically self-defeating in a way external world skepticism is not. A dream skeptic can argue *now* (in the dream) that they don't know if they are dreaming. A past skeptic cannot coherently argue, because arguing requires a history.

  Does an analogous worry exist for Moore? The dream skeptic does not undermine the *present* act of inference, only the *content* of the premises. Therefore, the Memory Proof actually exposes a weakness in the *skeptic*, not the proof. The skeptic about the past is in a worse logical position than the skeptic about the external world. This suggests the Memory argument might be *stronger* than Moore's, not weaker, because the alternative (no past) makes rational discourse impossible, whereas the alternative (no external world) leaves the solipsistic present intact.

  ***

  **3. Verdict: What is a Moorean Argument?**

  Your seminar is split between viewing Moore's proof as worthless (because it begs the question) and viewing it as a methodological stance (common sense default). Both halves miss the mark slightly, and the memory analogy helps us see why.

  The memory analogy is not devastating to Moore, but it is clarifying. It shows that Moore is not offering a **dialectical proof**. A dialectical proof must start from premises the opponent accepts to lead them to a conclusion they reject. Moore starts from a premise the skeptic *denies* (that he knows he has hands) to conclude what the skeptic doubts. In this strict sense, both the Hand Proof and the Memory Proof are "worthless" as coercive arguments.

  However, the second half of your seminar is also incomplete. Calling it a "methodological stance" suggests it is merely a rule of thumb. Moore intends something stronger: a claim about the **order of certainty**. He argues that some propositions (like "Here is a hand" or "I had breakfast") are more certain than the philosophical premises used to doubt them.

  The memory comparison establishes that the success of a Moorean move depends on the **pragmatic coherence of the skepticism** being opposed.
  1.  **Against External World Skepticism:** Moore succeeds in highlighting that the skeptic's hypothesis is less certain than common sense, but he fails to refute the skeptic logically.
  2.  **Against Past Skepticism:** The Moorean move succeeds *better* because the skeptical hypothesis is self-undermining (it destroys the possibility of argument).

  **Conclusion**
  The comparison tells us that a "Moorean argument" is not a proof in the traditional sense, nor merely a methodological preference. It is a **transcendental reminder**. It forces us to recognize that doubt requires a background of undoubted certainties to function. In the case of the external world, Moore reminds us that perception is a default entitlement. In the case of memory, the analogy reminds us that rational agency itself requires a past.

  Therefore, the Memory Proof is not irrelevant; it is the *reductio* of radical skepticism. If the Memory Proof fails, then reasoning itself fails. If Moore's Hand Proof fails, only realism fails. Thus, the Memory argument is actually the more powerful Moorean move. It reveals that Moore's true contribution was not proving the world exists, but showing that skepticism often demands we doubt the very conditions required for doubt to be meaningful. You should tell your students: Moore isn't proving the world exists; he is showing that the skeptic is asking us to abandon the ground we stand on to prove the ground is there. The memory analogy shows that sometimes, there is literally no other ground to stand on.
