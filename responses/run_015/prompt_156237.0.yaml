answer: |-
  Reject step (6), because refining the decomposition imposes new independence constraints on sub-components that were not present in the coarse model, meaning the epistemic state was not held fixed.

  Step (6) looks plausible because it conflates "raw world knowledge" with "probabilistic constraints." When you estimated the coarse conjunct $P(C_2)$, you implicitly averaged over all possible internal correlations within $C_2$. When your friend decomposed $C_2$ into $C_{2a} \land C_{2b}$ and applied the independence presumption there, he explicitly *removed* the possibility of correlation between $C_{2a}$ and $C_{2b}$. This is a change in the model class, not merely a change in granularity; you have added the constraint $\text{Corr}(C_{2a}, C_{2b}) = 0$, which was not part of the original evidence. The resulting shift in $P(E)$ reflects the cost of this new assumption, not an arbitrary drift under fixed evidence. The lemma fails because coherence requires that if you believe $C_{2a}$ and $C_{2b}$ are independent, your coarse $P(C_2)$ should have matched the product; the discrepancy reveals prior incoherence, not methodological worthlessness.

  Rejecting (6) costs you the comfort of treating Fermi estimates as direct readouts of evidence; you must instead treat them as causal models subject to coherence checks across levels. You lose the ability to claim your estimate is "uniquely warranted" by the evidence, since different valid decompositions (with different independence assumptions) yield different results, requiring a meta-criterion to select the most robust granularity.

  Regarding your preference to keep (2) and (8) over (3): you should actually reject (3). Maximum entropy is a rule for completing a distribution given constraints, not a justification for *why* those constraints (independence) hold. Step (3) claims MaxEnt is justified because it "adds no information," but as (4) notes, this is parameterization-sensitive. In forecasting contexts, independence is rarely warranted by ignorance (MaxEnt); it is warranted by causal separation.

  Replace the MaxEnt justification with a **prior over causal structures** (e.g., a Bayesian network where independence follows from d-separation).
  *   **What it buys:** It grounds independence assumptions in mechanistic claims rather than ignorance, making the decomposition choice non-arbitrary (you decompose until nodes are causally modular). It solves the fragmentation problem because refining a node only changes the probability if you change the causal edges; if $C_{2a}$ and $C_{2b}$ are causally linked, you do not assume independence, and the product rule doesn't apply.
  *   **What it costs:** It demands more cognitive labor. You must explicitly argue for causal separation rather than pleading ignorance. It also requires handling structural uncertainty (averaging over DAGs), which is computationally heavier than multiplying marginals.

  If causal structures are too costly for quick Fermi estimates, use a **hierarchical prior on a correlation parameter** centered at zero.
  *   **What it buys:** It acknowledges that independence is an approximation. You estimate $P(E) = \int \prod P(C_i | \rho) P(\rho) d\rho$. This shrinks your estimate toward the coarse judgment when fine-grained data is sparse, preventing the order-of-magnitude swings your friend exploited.
  *   **What it costs:** You must specify the variance of the correlation prior. If set too wide, you lose the precision benefit of decomposition; if too narrow, you regain the fragmentation vulnerability.

  In practice, your friend's move was valid calibration hygiene (exposing incoherence), but his conclusion (7) was invalid. Keep the decomposition practice, but justify independence via causal modularity rather than maximum entropy, and enforce marginalization consistency between levels to prevent fragmentation.
