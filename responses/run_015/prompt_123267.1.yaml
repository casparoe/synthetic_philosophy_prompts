  # Function Over Form: Why Mechanistic Anomaly Detection Needs Causal Portability

  We are trying to build lie detectors for neural networks. The goal of Mechanistic Anomaly Detection (MAD) is straightforward: identify when a model is executing a computation that deviates from its training distribution. Is the model answering honestly, or is it executing a deceptive circuit? Is it solving the problem, or is it exploiting a shortcut?

  But to detect a deviation in *mechanism*, we first have to agree on what a mechanism *is*.

  Currently, much of interpretability leans on **architectural isomorphism**. We assume that a specific feature or circuit corresponds to specific neurons, specific weights, or specific activation subspaces. If Neuron 4,291 in Layer 12 fires during deception, we tag that activation pattern as the "deception mechanism."

  This creates a severe vulnerability in anomaly detection. It conflates *implementation* with *algorithm*. It assumes that the same logical operation must always look the same physically. But neural networks are not hard-wired circuit boards; they are high-dimensional fluid dynamics. They possess permutation symmetry, polysemanticity, and redundant pathways.

  To build robust anomaly detection, we need to untie this knot. We must argue that "the same mechanism" is not defined by architectural alignment, but by **interventional portability**.

  ### The Transplant Test

  Here is the core litmus test: Imagine you have two models, Model A and Model B. They have the same architecture but different random seeds and weight initializations. They have learned the same task.

  In Model A, a specific subcircuit computes a logical relation (say, "subject-verb agreement"). In Model B, the weights implementing this relation are uncorrelated with Model A. The neurons are in different positions. The activation patterns look nothing alike.

  Under the architectural isomorphism view, these are different mechanisms. If you use activation-based anomaly detection, comparing Model B's run against Model A's baseline would trigger a massive false positive. The system looks "anomalous" simply because it found a different route to the same destination.

  Under the **interventional portability** view, we ask a different question: *Can we transplant the subcircuit from Model A into Model B and have it work without local retraining?*

  If you can cut the weights from Model A, paste them into the corresponding structural slot in Model B (accounting for layer depth but not weight alignment), and the input-output counterfactual profile is preserved—meaning interventions on that subcircuit in Model B produce the same causal effects as in Model A—then they are mechanistically identical.

  The mechanism is not the weights; it is the **causal function**. The weights are just the instantiation.

  ### Why This Matters for Sparse MoEs

  This distinction isn't just philosophical; it is critical for modern architectures, specifically Sparse Mixture of Experts (MoE).

  In an MoE, computation is distributed dynamically. A router decides which experts handle a token. This creates a nightmare for activation-based anomaly detection.

  Consider a model learning to detect sarcasm. In Training Run 1, the router might consistently send sarcastic tokens to Expert 3. In Training Run 2, due to minor initialization noise, the router might send those same tokens to Expert 7, or split them between Experts 4 and 9.

  If your anomaly detector monitors activation norms or specific neuron firings, Training Run 2 looks like a distributional shift. It looks like the model is "behaving differently." You get a false positive. The model hasn't changed its mind; it just changed its routing table.

  However, the underlying causal structure—the logic that identifies sarcasm—may be perfectly preserved.

  Interventional portability cuts through this noise. It argues that the "sarcasm mechanism" is not "Expert 3 firing." The mechanism is the *functional mapping* that transforms input cues into a sarcasm representation.

  If you can take the weights from Expert 3 in Run 1, move them to Expert 7 in Run 2, and the model's behavior under intervention remains invariant, then the mechanism is stable. The routing is just packaging; the computation is the content.

  By defining mechanisms via portability, we stop flagging routing variance as anomalies. We only flag an anomaly when the *causal link* breaks. For example, if the sarcasm circuit no longer flips the sentiment prediction when intervened upon, *that* is a true anomaly. It implies the logic itself has degraded or been hijacked, regardless of which expert is hosting it.

  ### Avoiding the False Positive Trap

  The danger of relying on architectural isomorphism is that it makes anomaly detection brittle to retraining.

  If you fine-tune a model, the weights shift. Even if the model's behavior is identical, the activation patterns drift. An isomorphism-based detector will eventually scream that the model is anomalous simply because it was updated. This renders MAD useless for monitoring models in production, where fine-tuning and continuous learning are standard.

  Interventional portability offers **causal invariance**. It allows the weights to float as long as the causal structure holds.

  This reframes the goal of anomaly detection. We are not looking for "weird activations." We are looking for "broken causality."

  1.  **Normal Variation:** Weights change, routing changes, activation magnitudes shift. But if I intervene on the suspected circuit, the output changes predictably. $\rightarrow$ **Not an Anomaly.**
  2.  **True Anomaly:** The activation patterns might look normal, but intervening on the circuit no longer produces the expected counterfactual effect. Or, the circuit has been co-opted to serve a different causal role (e.g., a "helpfulness" circuit now also triggers "deception"). $\rightarrow$ **Anomaly.**

  ### The Logic of Physiology over Anatomy

  To use a biological analogy: Architectural isomorphism is like identifying a heart by its exact position and cell structure. If you find an animal where the pump is slightly to the right, or made of slightly different muscle fibers, you might declare it a different organ.

  Interventional portability is like identifying a heart by its function: pumping blood. If you can transplant the pump into another organism and it continues to circulate fluid under intervention, it is the same mechanism, regardless of the tissue type.

  For mechanistic interpretability to scale to safety-critical monitoring, we must adopt the physiological view. We need to stop mapping the *anatomy* of the network (where the weights are) and start mapping its *physiology* (what the weights do).

  In sparse, dynamic systems like MoEs, the anatomy is constantly shifting. The routing gates permute the flow of information constantly. If we anchor our anomaly detection to the anatomy, we will drown in false positives.

  If we anchor it to interventional portability, we gain a stable metric of truth. We can tolerate the chaos of optimization and routing, provided the causal skeleton remains intact. And when that skeleton breaks—when the transplant fails, when the intervention no longer yields the expected counterfactual—we know we aren't just looking at a different implementation. We are looking at a different mind.

  That is the signal we need to catch.
