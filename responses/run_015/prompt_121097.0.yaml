      *(Self-Correction on the Algorithmic Point)*: Wait, does Dennett have resources to address statistical models? He might argue that statistical prediction bypasses the *agent* entirely, making responsibility impossible even by his lights. Caruso might welcome the removal of blame but worry about the *basis* of detention (risk vs. harm done). I need to be precise there.

      *(Refining the "Different Questions" point)*: Dennett is asking "What concept of free will do we need to live?" Caruso is asking "What concept of free will is metaphysically true?" Actually, Caruso is more normative: "What practices are just given the metaphysics?" Dennett is "What practices are necessary given our psychology?"

      *Okay, let's structure the final output.*
      1.  Diagnosis of the Stalemate (Normative/Metaphysical hybrid).
      2.  The Empirical Mask.
      3.  The Algorithmic Stress Test.
      4.  Verdict: Map vs. Resolution.

  9.  **Final Review against constraints:**
      *   Use specific thinker arguments? Yes.
