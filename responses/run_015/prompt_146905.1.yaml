  Line-by-line

  The opening definition of a philosophical zombie is standard and widely accepted within the field as a coherent thought experiment. It accurately describes a being physically identical to a human but lacking subjective experience. This setup is uncontroversial as a definition, even if one doubts such beings could actually exist. However, the next claim—that anything genuinely conceivable is a genuine possibility—is where the summary glosses over significant philosophical machinery. Specialists distinguish between prima facie conceivability, which is just how things seem initially, and ideal conceivability, which survives rigorous reflection without contradiction. Your worry about Kripke is well-founded and central to the debate. Kripke argued that while we can imagine water not being H2O, it isn't genuinely possible if water is H2O. Physicalists argue consciousness is similar: it seems separable from the physical, but that is an illusion of contingency caused by our unique perspective on our own minds. The summary ignores this counter-argument, presenting conceivability as a direct ticket to possibility without addressing the Kripkean objection that identities can be necessary yet known only through experience.

  Regarding materialism, the text claims it requires facts to follow by logic alone. This is the strawman you suspected. Many physicalists argue for a posteriori necessity, where the identity is real but discovered empirically, not logically. For example, heat is molecular motion, but we needed science to learn that, not just logic. Chalmers argues consciousness resists this specific type of identity because there is no logical connection between structure and experience. However, the summary presents his specific requirement as the general definition of materialism, rigging the game against physicalists who accept a posteriori identities. It fails to mention Type-B physicalists, who accept zombies are conceivable but deny they are metaphysically possible. The inference that materialism is false if zombies are possible is logically valid within the argument's framework. However, the comparison to Descartes is misleading. Descartes argued for substance dualism, meaning mind and body are different entities entirely. Chalmers argues for property dualism or panpsychism, meaning consciousness is a fundamental property of physical entities, not a separate substance. The summary conflates these distinct metaphysical views, implying a return to seventeenth-century dualism rather than contemporary naturalistic dualism. Finally, the claim that behavior is no evidence conflates metaphysical possibility with epistemic justification. Even if a zombie world is metaphysically possible, it might be nomologically impossible in our universe. If physical laws guarantee consciousness in our world, behavior remains excellent evidence. The summary pushes a skeptical conclusion that most philosophers, including Chalmers, do not endorse. It suggests we can never know if others are conscious, whereas the argument only shows consciousness isn't logically fixed by physics. Functionalism is indeed challenged, but empirical evidence remains viable.

  What the argument is actually aimed at

  The argument is primarily aimed at reductive physicalism, specifically the claim that consciousness can be fully explained by structural and functional facts. It targets the Hard Problem, which asks why physical processing feels like something from the inside. It is not designed to prove Cartesian dualism directly, but to show that consciousness isn't logically supervenient on the physical. Your friend is correct: Chalmers is sympathetic to Russellian monism, where consciousness is intrinsic to matter, not a separate substance. The argument aims to break the link between physical structure and experience, forcing a revision of our ontology. It leaves open whether consciousness is a separate substance, a fundamental property, or ubiquitous in nature. The goal is to show that physicalism, as commonly understood, is incomplete, not necessarily that dualism in the Cartesian sense is true. It forces physicalists to either deny the conceivability of zombies or accept that consciousness is a fundamental feature of the world.

  Settled vs contested

  There is consensus on the logical structure: if zombies are metaphysically possible, reductive physicalism is false. There is also agreement on the definition of a philosophical zombie. However, almost everything else is fiercely contested. Physicalists dispute whether zombies are genuinely conceivable, arguing that what seems conceivable is just an inability to imagine the identity. Others accept conceivability but deny it entails possibility, citing the water/H2O case. There is also deep division on whether physicalism requires a priori entailment. Type-B physicalists say no; Chalmers says yes. Furthermore, Illusionists argue consciousness itself is an illusion, dissolving the problem entirely. Finally, the skeptical implication regarding other minds is widely rejected; most agree that even if zombies are metaphysically possible, they are not nomologically possible in our world, preserving empirical evidence. The field is split between those who think the argument proves too much and those who think it proves nothing.

  Do the upshots survive

  The first upshot, that consciousness is a non-physical extra in Descartes's sense, does not follow. Chalmers explicitly distances himself from substance dualism. The argument supports property dualism or panpsychism, where consciousness is fundamental but not necessarily separate from matter. The summary conflates non-physicalism with Cartesianism. The second upshot, that behavior is no evidence for consciousness, also fails to follow. The argument establishes metaphysical possibility, not actual uncertainty. If consciousness is nomologically supervenient on the physical in our world, behavior remains reliable evidence. The summary conflates the failure of logical entailment with the failure of empirical inference. You can accept the zombie argument without accepting radical skepticism about other minds. Most specialists accept that while behavior doesn't logically guarantee consciousness, it provides strong probabilistic evidence given our laws of nature. The summary's skepticism is not a required consequence of the argument.
