answer: |-
  ### Part I: Preliminary Scratchpad (Referee's Unstructured Notes)

  **First Impressions:**
  *   **The Hook:** The "quota/ledger" metaphor is catchy. It reframes the "duty to obey" from a deontological constraint on every act to a consequentialist-style maintenance of a system. This is promising. It sidesteps the "prima facie duty" mess nicely.
  *   **The "Payment" Insight:** Section 3's claim that accepting punishment is a *deposit* rather than *submission* is the strongest philosophical move here. It changes the meaning of the ritual. Instead of "I submit to your authority," it says "I am paying the cost to keep the ledger balanced." This is novel.
  *   **Confusion on "Currency":** The essay glosses over how we know what a "fair share" is. Is it 90% compliance? 99%? If I obey 1,000 laws and break 1, is the ledger balanced? The "exchange rate" (O2) feels hand-wavy. The state sets the penalty, but the disobedient often rejects the state's moral authority to set prices.
  *   **The Anarchist Angle:** Section 5 is clever but risky. Anarchists can easily say CD accepts punishment for *strategic* reasons (to gain sympathy) without admitting *obligation*. The "best explanation" claim needs more work.
  *   **Fair Play Vibes:** This smells heavily like a "Principle of Fairness" argument (you benefit from the scheme, so you owe it stability). The author claims in O4 that this is a virtue ("changing the subject"), but if it's just Fair Play with a new metaphor, is it a new paper? Need to dig on this.
  *   **The Friend's F3:** The friend is hitting the soft underbelly. "Reasonable judgment" is doing too much work. If the agent decides the ledger balances, what stops the selfish complier from saying "My tax evasion is balanced by my charity work"? The "publicity" constraint helps, but doesn't solve the metric problem.
  *   **Alma vs. Cara:** Good cases. Alma fits the view well. Cara is interesting—she's a "secret disobedient." The view says she's morally okay but epistemically opaque. This challenges the standard definition of CD (which usually requires publicity). This is a strong point to lean into.

  **Verdict Potential:**
  *   There is a paper here, but it hinges on whether the "ledger" is distinct from Fair Play.
  *   The "punishment as payment" idea is the real gem. The "quota" idea is the vehicle.
  *   Needs to stop fighting the anarchist too much and focus on the internal mechanics of the obligation.

  ---

  ### Part II: Formal Referee Report

  **To:** The Author
  **From:** Referee
  **Re:** "Compliance as a quota: a ledger view of political obligation and civil disobedience"

  Below is an assessment of your draft, addressing your six specific requests. I have evaluated the arguments on their internal coherence and their fit within the broader landscape of political philosophy, without relying on specific textual citations.

  #### 1. Adjudication of Your Friend's Claims

  **Claim F1: The paradox is only apparent (General but not absolute duty).**
  *   **Where the Friend is Right:** The friend correctly identifies that standard liberal theory (the "prima facie duty" view) claims to handle this. It posits a duty that can be outweighed by stronger moral reasons (e.g., preventing grave injustice).
  *   **Where it is Question-Begging:** The friend assumes that a duty that is routinely outweighed in cases of conscience is still doing normative work. Your critique in Section 1 is sharp here: if the agent's judgment of injustice always defeats the duty, the duty is inert. The friend's view preserves the *language* of obligation but loses the *force* of it.
  *   **Do Your Replies Meet It?** Yes. Your "quota" model explains why the duty persists even when breached. On the standard view, breaching the law *violates* the duty (even if justified). On your view, breaching the law is merely a *transaction* against the duty. You successfully show that the standard view creates a logical tension (violation vs. justification) that your view dissolves.

  **Claim F2: Publicity is constitutive, not derived.**
  *   **Where the Friend is Right:** In the existing literature, "civil disobedience" is often defined *by* its public nature. To call secret lawbreaking "civil disobedience" feels like a category error to many.
  *   **Where it is Question-Begging:** The friend treats the definition as a moral boundary. You correctly identify that this is conceptual stipulation rather than moral argument.
  *   **Do Your Replies Meet It?** Strongly. By re-casting publicity as an *epistemic condition* (needed to verify the ledger) rather than a *constitutive condition* (needed to make the act count), you undermine the friend's conceptual rigidity. The case of *Cara* (Section 4) is your winning move here. It shows that secret noncompliance can be morally permissible under your view, even if it doesn't count as "protest." This distinguishes the *ethics* of the act from the *label* of the act.

  **Claim F3: The view cannot separate the civil disobedient from the selfish complier.**
  *   **Where the Friend is Right:** This is the most dangerous objection. If the "ledger" is balanced by the agent's own assessment of their "fair share," the view risks collapsing into subjectivism.
  *   **Where it is Question-Begging:** The friend assumes that *any* reliance on "reasonable judgment" is unfalsifiable. But all moral theories rely on agents making reasonable judgments (e.g., in self-defense or necessity cases).
  *   **Do Your Replies Meet It?** Partially. Your reply (O1 and O5) relies on "publicity" and "scheme needs" to objectify the judgment. However, you haven't fully solved the *metric* problem. A selfish complier could argue, "My tax evasion saves the state money it would misuse; my volunteering adds value; the ledger balances." Your view needs a stronger account of *who* audits the ledger to fully defeat F3. You gesture at "the reasonable agent under conditions of publicity," but this is thin.

  #### 2. The Weakest Load-Bearing Claim

  **The Claim:** The existence of a stable "exchange rate" between compliance and noncompliance (Section 3, O2).

  **Why it is the Weakest:**
  The entire Ledger View depends on the idea that different acts of compliance and noncompliance can be measured in a common currency ("deposits" and "withdrawals"). You state that "the legal system itself publishes prices" (fines, jail time).
  *   **The Problem:** Civil disobedients often reject the legitimacy of the legal system's pricing. If I break a law because I believe the penalty is unjust, why should I accept that penalty as the correct "cost" to balance my ledger?
  *   **The Collapse Risk:** If the state sets the exchange rate, you surrender to state authority (undermining the critical nature of CD). If the agent sets the exchange rate, you invite the "selfish complier" problem (F3).
  *   **Why it Matters:** Without a stable exchange rate, the "ledger" is just a metaphor, not a mechanism. If I cannot know whether my "deposit" (punishment) actually offsets my "withdrawal" (lawbreaking), the "No Net Drawdown" principle is unworkable. This is the structural weak point where the theory is most likely to fracture under pressure.

  #### 3. Distinct Position or Collapse?

  **Assessment:** The Ledger View is a sophisticated variant of the **Principle of Fair Play**, but it is distinct enough to warrant development.

  **The Fit:**
  *   **Fair Play Standard:** You owe obedience because you benefit from the cooperative scheme of others. Your obligation is to bear your fair share of the burdens so others aren't exploited.
  *   **Your View:** You owe a "quota" of compliance to maintain the *effectiveness* of the scheme.
  *   **The Difference:** Standard Fair Play focuses on *benefits received* (I get roads, so I obey traffic laws). Your view focuses on *systemic stability* (I obey enough laws so the system doesn't collapse). This is closer to a "Natural Duty of Justice" account (we must support just institutions) but operationalized through a bookkeeping metaphor.
  *   **Verdict:** It does not quietly collapse, because standard Fair Play struggles to explain why we should obey laws that provide us no direct benefit (or even harm us). Your "quota" view handles this better: I obey not because I benefit, but because the *scheme* needs a certain level of compliance to function, and I owe that to my fellow participants.
  *   **Caveat:** You must explicitly distinguish yourself from Fair Play in the text. If you don't, readers will assume this is just Fair Play with new terminology. The "punishment as payment" mechanism is your unique contribution that standard Fair Play lacks.

  #### 4. Strongest Objection Not in O1–O5

  **The Objection:** *The Incommensurability of Rights.*

  **The Case:**
  The Ledger View treats legal compliance as homogenous units (credits and debits). This implies fungibility: one can offset a withdrawal in one area with a deposit in another.
  *   **Scenario:** *David* believes a zoning law is unjust, so he builds an extension without a permit (withdrawal). To balance his ledger, he strictly obeys a law against assault (deposit).
  *   **The Bite:** Some laws protect fundamental rights (do not kill, do not steal), while others are regulatory (zoning, taxes). A violation of a rights-protecting law creates a moral debt to a *specific victim* that cannot be repaid by general compliance elsewhere. You cannot offset a mugging by paying your taxes.
  *   **Implication:** Your view works for *malum prohibitum* (wrong because prohibited) but fails for *malum in se* (wrong in itself). If civil disobedience sometimes involves violating rights-protecting laws (e.g., trespassing to save a life, or arguably, violent protest), the ledger cannot balance because the "currency" is different. The view presupposes that all laws are of the same normative weight, which is false.

  #### 5. Assessment of the Reverse Argument (Section 5)

  **Assessment:** The argument is intriguing but not decisive.

  **Does it give the Anarchist anything to explain?**
  Yes. The philosophical anarchist believes there is no general duty to obey. They must explain why disobedients voluntarily submit to punishment.
  *   **Prudential/Communicative Alternatives:** The anarchist can argue that accepting punishment is *strategic*: it signals sincerity to the public, garnering support for the cause. It is a rhetorical tool, not a moral settlement.
  *   **Your Explanation:** You argue it is a *moral settlement* (balancing the ledger).
  *   **Comparison:** Your explanation is *better* at capturing the internal phenomenology of the disobedient. Many disobedients report feeling they *must* accept punishment, not just that it is useful. The prudential view cannot explain why disobedients accept punishment even when it harms their cause (e.g., when jail time removes them from the movement).
  *   **Limit:** However, it is not *proof* of obligation. An anarchist can concede that disobedients *believe* they have an obligation (false consciousness) without agreeing they *do*. The argument shows the Ledger View is *consistent* with the practice, not that it is the *only* explanation. Tone this down from "evidence for political obligation" to "best explanation of the phenomenology of civil disobedience."

  #### 6. Blunt Verdict

  **Is there a paper here?**
  **Yes.** But it is currently a "conceptual clarification" paper that risks being seen as a semantic shuffle. To become a substantive contribution, it needs to pivot.

  **What to Cut:**
  *   **Cut the Philosophical Anarchism framing (Section 5):** It is defensive and distracts from the positive theory. The anarchist can always posit "false consciousness." Don't fight that battle; it's a stalemate.
  *   **Cut the claim that the "puzzle dissolves" (Section 3):** It's too strong. The puzzle shifts from "justification of exception" to "calculation of the quota." Acknowledge that the calculation problem is hard.

  **What to Make the Centre:**
  *   **Make "Punishment as Payment" the core:** This is your most original insight. Standard theory sees punishment as *submission to authority* or *consequence of wrongdoing*. You see it as *voluntary contribution to systemic stability*.
  *   **Develop the "Audit" Mechanism:** Spend more time on O5. How do we publicly verify the ledger? If you can solve the "intersubjective verification" problem (how the public knows the ledger balances without the state deciding), you have a robust theory of political obligation that avoids both anarchism and statism.
  *   **Refine the "Currency":** Address the Incommensurability Objection (see Q4). Admit that the ledger only works for certain kinds of laws (coordinatory/structural) and not others (rights-violating). This limitation strengthens the view by making it more precise.

  **Final Word:**
  The "Ledger View" is a powerful heuristic. If you focus less on defeating the anarchist and more on explaining the *moral logic of the punishment ritual*, you will have a significant piece on the ethics of protest. The friend's F3 is the hurdle you must clear; the "public audit" is the bridge. Build that.
