  **Title:** The Illusion of Simplicity: Why Algorithmic Weighting Fails to Rescue the Principle of Indifference

  Bertrand's paradox stands as a stubborn monument to the limitations of classical probability theory. By demonstrating that the Principle of Indifference (PoI) yields contradictory probabilities for the same event depending on how the problem is parameterized, Joseph Bertrand exposed a fundamental vacuity in the notion of "equal likelihood" for continuous variables. The standard response has been to seek a unique, invariant parameterization—often through physical symmetry arguments or maximum entropy principles—that restores consistency. However, a more modern proposal suggests bypassing geometric parameterization entirely. Instead, it argues we should weight outcomes according to the algorithmic simplicity of their geometric descriptions, leveraging Kolmogorov complexity to privilege "simpler" chords over "complex" ones. This approach promises to ground probability in information theory rather than arbitrary geometry. Yet, upon closer inspection, this solution does not dissolve the paradox; it merely displaces the arbitrariness from the choice of parameters to the choice of description language. The Principle of Indifference remains unsaved because the metric of simplicity is itself relative.

  To understand the appeal of the algorithmic solution, one must first recognize the depth of the failure it attempts to fix. In Bertrand's original formulation, we ask for the probability that a random chord in a circle is longer than the side of an inscribed equilateral triangle. Depending on whether we assume uniform distribution over the chord's midpoint, its angle, or its distance from the center, we derive probabilities of 1/3, 1/2, or 1/4 respectively. The PoI dictates that without evidence to the contrary, we should treat possibilities as equally likely. But "possibilities" are undefined without a measure space. The algorithmic approach attempts to define that measure space objectively. It posits that nature, or at least rational belief, favors simplicity. A chord described by a short computer program (e.g., "the diameter") should be considered more "natural" or probable than a chord requiring a long, random string of digits to specify. By weighting the probability space according to description length, proponents argue we can derive a unique distribution that doesn't rely on arbitrary geometric choices like "midpoint" versus "endpoint."

  This seems to offer a way out. Kolmogorov complexity is often touted as an objective measure of information content. If we assign higher probability mass to states with lower complexity, we appear to be grounding the PoI in something deeper than geometric intuition. We are saying that the universe prefers compressible descriptions. However, this move conceals a critical vulnerability: Kolmogorov complexity is not invariant. It is defined relative to a Universal Turing Machine (UTM). While the complexity values of different UTMs converge asymptotically for very long strings (up to a constant additive term), this convergence is useless for the finite, specific geometric descriptions involved in Bertrand's paradox. The "constant" difference between two reasonable description languages can be large enough to flip the ordering of probabilities for specific outcomes.

  Consequently, the arbitrariness has not been eliminated; it has been migrated. In the classical formulation, the arbitrariness lies in the choice of parameterization (e.g., choosing to vary the radius versus the angle). In the algorithmic formulation, the arbitrariness lies in the choice of the description language or the reference UTM. One could construct a programming language where the command for "chord length 1/2" is a single bit, while "chord length 1/3" requires a complex loop. Another language could reverse this. Without an independent justification for why one description language is the "true" language of nature, the weighting scheme is just as subjective as the original parameter choice. We are back to square one: we are imposing a prior based on a choice that lacks external validation.

  Furthermore, this approach conflates epistemic simplicity with ontological frequency. Even if we agree that a simpler description is more aesthetically pleasing or cognitively salient, there is no logical bridge to claim it is more probable in a physical randomization process. Unless the mechanism generating the chords is known to be computationally biased toward simple outputs (which contradicts the premise of a "random" chord), weighting by algorithmic simplicity introduces a bias rather than resolving an ambiguity. It attempts to solve a problem of physical indeterminacy with a tool of linguistic compression.

  Therefore, the algorithmic simplicity solution fails to dissolve Bertrand's paradox. It offers a sophisticated camouflage for the Principle of Indifference but does not cure its underlying ailment. The paradox persists because the PoI attempts to derive information from ignorance. It asks us to generate a specific probability distribution from a state of non-knowledge. Whether we dress that ignorance in the clothes of geometric symmetry or algorithmic compression, the result is still an imposition of structure where none exists. The arbitrariness of the parameter choice is indeed mirrored by the arbitrariness of the description-language choice. Until we introduce external physical constraints—details about how the chord is actually generated—the probability remains undefined. The paradox is not a puzzle to be solved by better math; it is a warning that probability is not a property of logic alone, but of the relationship between logic and the world. The Principle of Indifference cannot be saved by weighting outcomes because the weights themselves require a principle of indifference to assign them.
