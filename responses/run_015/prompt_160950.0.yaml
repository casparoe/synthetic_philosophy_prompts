answer: |-
  The pattern you describe implies a theory of **Corporate Trusteeship**. It treats the State not as a collection of individuals, but as a perpetual legal person that holds the polity in trust. This model strictly separates *criminal guilt* (which must remain personal to avoid collective condemnation) from *political liability* (which must remain collective to ensure institutional survival and repair).

  Here is the reconstruction of the implicit theory, distinguishing between what the practice strictly presupposes, what merely fits it, and where it is underdetermined.

  ### 1. The Persistence of the Debtor
  **Strict Presupposition:** The practice presupposes **institutional continuity**, not metaphysical identity.
  The state is treated as a corporation sole: an office that outlives its officeholders. For the financial settlement to hold, the present state must possess the *same treasury and legal authority* as the wrongdoing state. It does not require that the present citizens are the "same people" morally, only that the *institution* that authorized the wrong is the *institution* currently administering the tax base.

  **Underdetermination:** The split between the two polities carved from the defeated state reveals that continuity is a **voluntary assumption of legitimacy**, not a factual necessity.
  *   The polity that pays *claims* continuity to establish its legitimacy as the rightful successor (accepting the bad with the good).
  *   The polity that refuses payment *denies* continuity to insulate itself (claiming it is a new victim).
  *   **Theory:** The obligation attaches to the **retention of the state's apparatus**. If you keep the bureaucracy, the borders, and the tax system, you inherit the liability. The "benefit" theory (unjust enrichment) is secondary; the primary driver is that the *agent* of the wrong still exists as a legal entity.

  ### 2. Inherited Guilt
  **Strict Presupposition:** **No inherited guilt.** The practice is logically incompatible with transmissible moral sin.
  This is proven by the criminal/financial split. Criminal trials isolate guilt to individuals to exonerate the collective. If guilt were inherited, the criminal trials would be unnecessary or universal. The financial settlement is not punishment; it is **political liability**.

  **Reconstruction:** The obligation is reconstructed as the **duty of the current membership to maintain the integrity of the collective agent.**
  *   **Why the Treasury?** Because the State is the debtor, not the citizens. Citizens contribute via taxation as a condition of their current membership and protection, similar to paying for a standing army or infrastructure.
  *   **Jaspers' Political Guilt:** This fits Jaspers' distinction perfectly. All citizens bear *political liability* for the acts of their state because they benefit from its order and participate in its legitimacy. They do not bear *moral guilt* for the specific acts.
  *   **Why not levy perpetrators' descendants?** Because that would convert political liability into blood guilt, undermining the liberal distinction between the individual and the state.

  ### 3. Why Descent?
  **Strict Presupposition:** Descent is **not strictly required** by a theory of harm, but it is required by a theory of **violated membership**.
  If the obligation were purely corrective justice for economic harm, descent would be an imperfect proxy (as you note, an affluent descendant differs from an impoverished stranger). The fact that descent is used (in the European model) presupposes that the wrong was not just against *individuals*, but against a **lineage** or a **people**.

  **Underdetermination:** The US vs. European divergence shows this is a political choice about the *nature of the victim group*.
  *   **US Model (Internment):** Treated as a temporary suspension of rights for individuals. Remedy: Restore the individual. (Harm ended with release/death).
  *   **European Model (Shoah/Genocide):** Treated as an attempt to erase a people. Remedy: Restore the continuity of the people. (Harm continues through erasure of lineage).
  *   **What a Harm-Based Settlement Would Look Like:** It would resemble a **class-based affirmative action program**. It would target current socioeconomic disadvantage correlated with the historical wrong, regardless of bloodline. It would means-test recipients. The current practice rejects this because it aims to repair *status*, not just *welfare*.

  ### 4. What Sort of Obligation?
  **Strict Presupposition:** The obligation is **not a debt.**
  A debt implies a quantifiable sum and a discharge date. The "indefinitely renewable" nature of the funds strictly rules out the "debt" model. You cannot pay off a relationship; you can only sustain it.

  **Theory:** It is an **open-ended duty of care** (fiduciary obligation).
  The state breached its fiduciary duty to protect certain members. The remedy is not a one-time payout, but a permanent commitment to ensure that the specific vulnerability created by the breach is monitored and mitigated.
  *   **What would have to change?** To replace this with "Corrective Justice" (a one-time restoration), the state would have to argue that the harm is *finite* and *quantifiable*. To replace it with "Debt," it would need a ledger. The resistance to a discharge date reveals that the state views the harm as **structural and ongoing**, or the relationship as **perpetually damaged**, requiring perpetual vigilance.

  ### 5. The Asymmetry
  **Strict Presupposition:** The practice relies on **two distinct theories of membership** operating simultaneously.
  *   **Payer Side (Civic):** Membership is defined by **present subjection** (residence, taxation). You pay because you are *here now*, under *this law*.
  *   **Payee Side (Genealogical):** Membership is defined by **historical violation**. You receive because you *were there then* (via blood), regardless of where you are now.

  **Coherence:** This is coherent only under the **Trusteeship Model**.
  The State (Civic) is the Trustee. The Victim Group (Genealogical) is the Beneficiary. A Trustee's obligations are defined by its current office (taxation/residency), while the Beneficiary's rights are defined by the terms of the trust (lineage/descent).
  *   **Incoherence Risk:** It becomes incoherent if one tries to argue that the *moral community* is identical on both sides. The theory admits they are not. The moral community of the *obligated* is the current polity; the moral community of the *wronged* is the trans-generational lineage.

  ### 6. A Test Case
  **Your Instinct:** Defenders would reject both the discharge date and the taxpayer opt-out.
  **Analysis:** Your instinct is correct. The resistance reveals the core of the theory.

  *   **Rejection of Discharge Date:** Admitting a discharge date implies the harm is finite and the relationship can be normalized. Defenders resist this because the theory presupposes the **harm is structural/ongoing** or the **betrayal is permanent**. To end payments is to declare the trust fulfilled, which implies the state is no longer "tainted."
  *   **Rejection of Taxpayer Opt-out:** Admitting an opt-out implies liability is based on **ancestral causality**. Defenders resist this because the theory presupposes liability is based on **current political membership**. If you opt out of the tax, you opt out of the state's protection. You cannot claim the benefits of the continuing state (security, law, infrastructure) while disclaiming its historical liabilities.

  **What the Resistance Reveals:**
  It reveals that the "Collective" doing the work is **The State as a Perpetual Corporation**.
  *   It is not a collection of ancestors (which would allow opt-outs).
  *   It is not a commercial debtor (which would allow discharge).
  *   It is a **political entity that exists through time**, binding the living to the dead not through blood, but through the **continuity of the institution**.

  ### Summary of the Implicit Theory

  The settlement pattern presupposes a **Liberal-Statist Theory of Repair**:

  1.  **Guilt is Personal:** To save liberal individualism (no blood guilt).
  2.  **Liability is Institutional:** To save the State's capacity to act (the State pays).
  3.  **Membership is Dual:** Civic for the payer (current subjection), Genealogical for the payee (historical violation).
  4.  **Obligation is Fiduciary:** Not a debt to be paid, but a trust to be maintained.

  **Where it is Underdetermined:**
  The specific mechanism of *descent* for recipients is underdetermined by the theory of liability (which only requires the State to pay). It is determined by the political definition of the *victim class* (was it an attack on citizens or a people?).

  **Where it is Strict:**
  The refusal to levy descendants of perpetrators and the refusal to allow taxpayer opt-outs are strict requirements. To violate them would collapse the distinction between *political liability* and *collective guilt*, destroying the liberal legitimacy the settlement is designed to restore.
