          *   Criminal: Guilt is personal/individual (trials of named persons, long after the fact).
          *   Financial/Political: The polity is a continuing agent. Compensation goes to descendants (sometimes), funded by general taxation (including newcomers and victims' descendants), structured as indefinite funds/settlements (no discharge date). Citizenship restoration offered by descent.
          *   Exclusions: No levy on descendants of perpetrators or specific institutions (churches, firms).
          *   Variation: US wartime internment compensation (living victims only) vs. European Holocaust/Shoah compensation (by descent).
      *   **Task:** Reconstruct the *implicit theory* underlying this pattern.
      *   **Specific Questions to Address:**
          1.  Persistence of the debtor (Continuity vs. Succession vs. Benefit).
          2.  Inherited guilt (Transmissible guilt vs. Political liability vs. Unjust enrichment).
          3.  Why descent? (Proxy for harm vs. Membership).
          4.  Nature of obligation (Debt vs. Corrective Justice vs. Expressive vs. Duty of Care).
          5.  Asymmetry (Payer = Residence/Tax vs. Payee = Lineage).
          6.  Test Case (Discharge date + Taxpayer opt-out).
      *   **Constraint:** Focus on logical presuppositions, fit, and underdetermination, *not* a survey of literature/philosophers (though Jaspers is mentioned as a reference point).

  2.  **Analyze the Observed Pattern (The "Phenomenology" of Settlement):**

      *   *Criminal vs. Civil:* The split is crucial. Criminal law isolates guilt to protect the collective from total condemnation (only "bad apples"). Civil/Political law binds the collective to pay (the "tree" is responsible for the "fruit," even if the branches are pruned).
      *   *Funding:* General taxation implies the *state* pays, not specific individuals. This treats the state as a corporate entity with a perpetual treasury.
      *   *Recipients:* Descent-based eligibility implies harm is inherited *or* membership is inherited. The US/EU divergence suggests this isn't a logical necessity but a political choice based on the *type* of harm (death/erasure vs. temporary detention).
      *   *Duration:* Indefinite renewal suggests the harm is ongoing or the relationship is perpetual. It's not a commercial debt.
      *   *Perpetrators:* No levy on descendants of perpetrators. This explicitly rejects "blood guilt."

  3.  **Drafting the Reconstruction - Section by Section:**

      *   **1. The Persistence of the Debtor:**
          *   *Observation:* One state claims continuity to pay; another claims discontinuity to avoid paying.
          *   *Analysis:* The theory isn't about metaphysical identity (numerical sameness). It's about *institutional continuity*. If the bureaucracy, laws, and treasury survived, the obligation survives.
          *   *Key Concept:* "The Crown never dies" or "State Succession." It's about the *benefit* of the prior regime's stability and assets.
          *   *Answer:* It presupposes *institutional continuity*, not necessarily moral identity. The "defeated state" split shows this is a *voluntary assumption of continuity* for the sake of legitimacy. The paying state buys legitimacy by accepting continuity; the non-paying state buys insulation by denying it. The theory presupposes that *capacity to pay* (via existing institutions) creates the obligation, not just causal guilt.

      *   **2. Inherited Guilt:**
          *   *Observation:* Criminal guilt is personal; Financial liability is collective. No levy on perpetrator descendants.
          *   *Analysis:* This explicitly rules out "inherited guilt" (sin passing through blood). It relies on "political liability" (Jaspers' *political guilt*). You pay because you are a *citizen* of the continuing entity, not because you are a *descendant* of the sinner.
          *   *Treasury vs. Members:* Paid from treasury because the *State* is the agent, not the individuals. Individuals participate via tax as a function of membership, not personal culpability.
          *   *Answer:* No inherited guilt. It is *institutional liability*. The obligation attaches to the *office* of citizenship/residency, not the biological person.

      *   **3. Why Descent?**
          *   *Observation:* Eligibility often tracks bloodline, not just proven harm. Affluent descendants get paid; impoverished non-descendants (similarly harmed) do not.
          *   *Analysis:* If it were purely corrective justice for harm, we'd means-test or harm-test. We don't. We use descent.
          *   *Implication:* Descent isn't just a proxy for harm; it's a marker of *membership in the violated community*. The wrong was an attack on the *group*, so the repair goes to the *group's continuation*.
          *   *Answer:* Descent presupposes the wrong was against a *people*, not just individuals. It treats the group as a trans-generational entity. A harm-based settlement would look like a social welfare program targeted at disadvantage. This looks like *restitution of status*.

      *   **4. Nature of Obligation:**
          *   *Observation:* Indefinite, renewable, no discharge date.
          *   *Analysis:* A debt has an end. This doesn't. It's not purely corrective (which aims to restore a prior state, which is impossible).
          *   *Implication:* It's a *duty of care* or *fiduciary obligation* arising from the breach of trust. It's about maintaining the relationship.
          *   *Answer:* It rules out "Debt" (dischargeable). It is an *open-ended duty of care* or *constitutional repair*. To change it to a debt would require admitting the relationship can be normalized/ended, which implies the harm is finite.

      *   **5. The Asymmetry:**
          *   *Observation:* Payers = Residents/Taxpayers (Civic/Political). Payees = Descendants (Ethnic/Genealogical).
          *   *Analysis:* This is the tension. The State is a civic entity (anyone can join/leave via tax/residency). The Victim Group is treated as a lineage (you can't join via residency).
          *   *Coherence:* It works only if the State is viewed as the *trustee* of the Victim Group. The State is the perpetual debtor (civic); the Victim Group is the perpetual creditor (lineage).
          *   *Answer:* Yes, two different conceptions. Civic membership for the obligor, Genealogical membership for the obligee. Coherent only under a *Trusteeship Model*: The State holds the polity in trust for its people (defined by lineage in this specific context of violation).

      *   **6. Test Case:**
          *   *Observation:* Discharge date (No) + Taxpayer Opt-out (No).
          *   *Analysis:*
              *   Discharge Date: Rejected because the harm is viewed as *ongoing* or the relationship *permanent*. Ending it implies the debt is finite.
              *   Opt-out: Rejected because liability is attached to *current membership*, not past ancestry. If you benefit from the state now, you pay the bill now.
          *   *Instinct Check:* Defenders would reject both.
          *   *Revelation:* This reveals the collective is defined by *present political subjection* (for payers) and *historical violation* (for payees). It confirms the "Political Liability" theory over "Causal Guilt."

  4.  **Synthesizing and Refining the Theory:**

      *   *Core Theory:* **The State as Perpetual Trustee.**
      *   The State is a corporate person that outlives its specific officeholders.
      *   Guilt is individualized to protect the corporate person from criminal destruction.
      *   Liability is collectivized to ensure the corporate person survives to make repair.
      *   The obligation is not debt (finite) but fidelity (infinite/relational).
      *   Descent marks the *boundary of the violated trust*, not just economic loss.
      *   Taxation marks the *price of current membership*, not punishment for past acts.

  5.  **Review against Constraints:**
      *   Did I answer all 6 points? Yes.
      *   Did I avoid a literature survey? Yes (used Jaspers only as prompted).
      *   Did I distinguish presupposition vs. fit vs. underdetermination? I need to make sure I highlight where the practice *could* be different (e.g., US vs EU on descent) but chooses a specific path, and what that choice implies.

  6.  **Final Polish:**
      *   Ensure the tone is analytical and philosophical.
      *   Clarify the distinction between "Criminal Guilt" (Personal) and "Political Liability" (Institutional).
      *   Make sure the "Asymmetry" point lands clearly—it's the crux of the coherence problem.
