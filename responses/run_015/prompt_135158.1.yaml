answer: |-
  **Brainstorming Notes**

  *   **Malcolm's Claim:** Dreams are not experiences because they lack a criterion of correctness. One cannot be wrong about a dream while having it; therefore, the concept of 'experience' (which implies the possibility of error/correction) does not logically apply. Dream reports are expressive, not descriptive.
  *   **Dennett's Position:** Dreams are not conscious episodes occurring during sleep. They are narrative structures assembled upon waking (the 'insertion model'). There is no stream of consciousness during sleep; the memory is fabricated post-hoc.
  *   **Under-explored Tension:** Both deny dreams are 'live' experiences, but for different reasons (logical grammar vs. temporal occurrence). The tension lies in epistemic vulnerability: Malcolm argues the *absence* of vulnerability (incorrigibility) negates experience. Dennett argues the *presence* of vulnerability (potential fabrication) negates the experience's temporal location. The gap: Does the absence of epistemic vulnerability undermine Malcolm's criterion without forcing us into Dennett's insertion model? Can we account for the vividness (phenomenal debt) without accepting either full realism or full fabrication?

  ***

  **Research Proposal**

  **Title:** The Ontology of Oneiric Phenomenology: Settling the Phenomenal Debt in the Malcolm-Dennett Debate

  **1. Research Question**
  Does the framework of 'phenomenal debt'—the unaccounted surplus of phenomenal content requiring settlement upon waking—demonstrate that Norman Malcolm's expressive account offers a more coherent resolution to the ontological status of dreams than Daniel Dennett's narrative-insertion model, specifically regarding the operation of first-person authority across the sleep-wake boundary?

  This question admits a determinate answer: either the phenomenal debt is best settled by treating dream reports as expressive utterances devoid of descriptive truth conditions (Malcolm), or by treating them as retrospective fabrications filling a temporal gap (Dennett). A third option, wherein the debt reveals a category error in both, may also emerge as the determinate conclusion.

  **2. Context and Theoretical Gap**
  The standard exchange between Malcolm and Dennett has reached a stalemate. Malcolm argues from logical grammar: because a dreamer cannot be corrected during the dream, the report lacks the necessary conditions for describing an experience. Dennett argues from a blend of conceptual analysis and empirical inference: because there is no evidence of a continuous stream of consciousness during sleep, the dream is a story told upon waking.

  However, both positions leave a specific phenomenological question open: the status of the vividness itself. If dreams are not live experiences, there remains a surplus of phenomenal content—the feeling of having seen, felt, or acted—that demands explanation. This is the 'phenomenal debt'. Malcolm settles this debt by denying the content describes anything; it is merely an expression akin to crying out in pain. Dennett settles it by positing a constructive process upon waking that generates the content artificially.

  Neither account adequately addresses the temporal boundaries of correctability. Malcolm's criterion relies on the impossibility of error during the state, while Dennett relies on the impossibility of the state occurring at all. The gap lies in whether the absence of epistemic vulnerability (the inability to be wrong) undermines Malcolm's criterion-based argument without automatically committing us to Dennett's insertion model. If first-person authority persists upon waking without the possibility of contemporaneous correction, does this necessitate fabrication, or does it indicate a distinct type of experiential memory that neither philosopher adequately categorises? This project investigates whether the phenomenal debt framework exposes a flaw in Malcolm's denial of experience that does not validate Dennett's denial of temporal occurrence.

  **3. Methodological Approach**
  This project will be conducted over one semester using strict conceptual analysis, distinct from empirical sleep-laboratory study or pure history of philosophy. While neuroscience can identify correlates of sleep states, it cannot resolve the logical status of 'experience' or the epistemic nature of 'reporting'. Similarly, a historical review would merely catalogue the debate rather than advance a solution. The methodology comprises four phases:

  *   **Conceptual Analysis of Experience-Types:** I will delineate the necessary conditions for 'experience' versus 'memory of experience', focusing on the role of temporal location.
  *   **Reconstruction of the Correctability Criterion:** I will analyse Malcolm's argument to determine if the lack of contemporaneous correctability truly negates experiential status, or if it merely shifts the locus of verification to the waking state.
  *   **Examination of First-Person Report Structures:** I will analyse the linguistic structure of dream reports upon waking to determine if they function descriptively (claiming truth about a past event) or expressively (claiming truth about a current mental state).
  *   **Evaluation of the Phenomenal-Debt Framework:** I will apply the concept of phenomenal debt to both positions to test which offers a more coherent settlement of the surplus content without invoking ad hoc mechanisms.

  This philosophical approach is preferable because the core dispute is not about neural activity but about the concepts we use to attribute consciousness. Empirical data cannot dictate whether a narrative constructed upon waking counts as an 'experience' in the philosophical sense; only conceptual clarity can resolve this.

  **4. Success and Failure Criteria**
  A successful result will produce an intermediate taxonomy of mental states. This taxonomy would place dreams in a distinct category—perhaps 'quasi-experiential'—that acknowledges the phenomenal debt without collapsing into Malcolm's denial of experience or Dennett's insertion model. Success would look like a refined account of first-person authority that allows for incorrigibility without fabrication, demonstrating how correctability operates across the sleep-wake boundary without requiring the dream to be a 'live' event in Malcolm's sense.

  Failure would occur if the concept of phenomenal debt proves incoherent or redundant. If the 'debt' is merely a metaphor for memory confusion with no analytical bite, the project fails to advance the debate. Similarly, if the analysis demonstrates that Malcolm and Dennett's positions are exhaustive and the debt framework adds no explanatory power, the project would conclude that the stalemate is unavoidable.

  **5. Scope Assessment**
  The project is tractable within six months because it restricts itself to the logical and epistemological dimensions of the debate. It will not attempt to reconcile these positions with predictive-processing models of sleep or general theories of consciousness, which would require extensive engagement with empirical literature beyond the scope of a philosophical fellowship.

  The primary risk lies in overreaching into neuroscience. While I must acknowledge empirical constraints (e.g., that dreaming occurs during sleep), I will not evaluate competing neurobiological theories of REM sleep. The focus remains on the implications of those constraints for the philosophy of mind. Furthermore, I will avoid generalising the findings to all altered states of consciousness; the scope is strictly limited to dreaming. By maintaining this focus, the project ensures a rigorous examination of the Malcolm-Dennett exchange without diluting the analysis with broader speculative theories of mind. The outcome will be a paper suitable for publication in a journal of philosophy of mind, offering a novel resolution to a classic problem.
