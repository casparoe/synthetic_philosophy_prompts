  10. **Final Polish:** Ensure the confidence scores are visible and the critical edge remains sharp throughout. (e.g., "This is metaphysically suspect.")

  *(Self-Correction on Confidence)*: I shouldn't give high confidence to things that are philosophically contested. I will rate confidence based on *utility for the user's specific goal* (settling credit), not universal truth.

  *(Self-Correction on "Knock-out")*: The user asked which requirement knocks out the most ways people *talk* about this. That's definitely the Hindsight Bias one. Most "inevitability" claims are just hindsight narratives.

