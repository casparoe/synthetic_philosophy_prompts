  I want a formal account of what this agent should do.

  1.  **Does the agent require an explicit internal model of the world?**
      *   **Yes:**
          *   **Must the model contain a representation of the agent itself?**
              *   **Yes:**
                  *   **Does the agent know its own output before acting?**
                      *   Yes → **Empty (Incoherent).** Violates diagonalization; no consistent self-truth possible.
                      *   No → **Logical Induction DT.** Awkward commitment: Must bet on own behavior without proving it.
              *   **No:**
                  *   **Is the agent/environment boundary ontological?**
                      *   Yes → **Bounded Bayesian EU.** Awkward commitment: Requires a prior too large to fit in the agent.
                      *   No → **Information-Theoretic Boundary.** Awkward commitment: Agency becomes observer-relative.
      *   **No:**
          *   **Is there a goal function being maximized?**
              *   **Yes:**
                  *   **Is the unit of agency a policy or a time-slice?**
                      *   Policy → **Updateless Decision Theory (UDT).** Awkward commitment: Must ignore current evidence to maintain policy consistency.
                      *   Time-slice → **Game-Theoretic Self-Play.** Awkward commitment: Treats future selves as adversarial strangers.
              *   **No:**
                  *   **Is the system controlled via feedback or selection?**
                      *   Feedback → **Model-Free Control.** Awkward commitment: Struggles to define 'goal' without a separate evaluator.
                      *   Selection → **Deflationary Realism.** Awkward commitment: Dissolves 'should' into 'is'; classical DT without Cartesianism collapses here.

  *Note: UDT and Game-Theoretic Self-Play are often indistinguishable in practice when logical correlation is high. Bounded Bayesian EU and Information-Theoretic Boundary separate only on metaphysical commitment, not math.*
