  Every raven wears a coat of black.
  I list the plaster, leather, pale blue shoe.
  Nothing not black steps on the raven's track.

  The room is full of things that are not new,
  But color spills outside the window view.
  Every raven wears a coat of black.

  It fills the dark but leaves the light from view.
  The bird confirms the shadow, not the hue.
  Nothing not black steps on the raven's track.

  This leather scrap is evidence, and true.
  It counts a vote, though only one of two.
  Every raven wears a coat of black.

  A drop of proof that barely bleeds me through.
  The world is vast in every other hue.
  Nothing not black steps on the raven's track.

  I know the scale of what the numbers do.
  The fraction shames the hand that writes it too.
  Every raven wears a coat of black.

  This pale shoe challenges the world we knew.
  It marks the line that separates the black.
  Every raven wears a coat of black.
  Nothing not black steps on the raven's track.
