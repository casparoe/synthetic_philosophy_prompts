answer: |-
  ### Brainstorming & Scoping: The Sharp Version of the Question

  Before drafting the proposal, we need to strip the varnish off the "Prioritarianism vs. Egalitarianism" debate. Your intuition is correct: the standard defense of Prioritarianism against the Levelling-Down Objection (LDO) is technically trivial but philosophically suspect.

  **The Triviality:** Any view that is welfarist and satisfies the Strong Pareto Principle avoids LDO. If goodness is a strictly increasing function of individual welfare vectors, then making someone worse off without making anyone better off *must* reduce total value. Utilitarianism avoids LDO. Prioritarianism avoids LDO. So, LDO cannot be the tool that distinguishes Prioritarianism from Utilitarianism, nor can it distinguish Prioritarianism from any plausible form of Egalitarianism that respects Pareto.

  **The Real Fight:** The debate is actually about the *source* of the weight given to the worse off.
  1.  **Absolute Prioritarianism:** I give you more weight because your absolute welfare level is low (e.g., you are in pain).
  2.  **Telic Egalitarianism:** I give you more weight (or value the state more) because the *pattern* of distribution is unequal.
  3.  **The Hidden Third Option (Your Insight):** I give you more weight because you are *relatively* disadvantaged compared to others.

  The standard formalization of Prioritarianism ($\sum g(w_i)$ where $g$ is concave) hard-codes Option 1. It builds in "immunity" to LDO by fiat, simply by refusing to let the value of $w_i$ depend on $w_j$. But does this capture the moral intuition? Often, when we say "priority to the worse off," we mean "priority to those who are worse off *than us*." If everyone drops into a pit, the absolute prioritarian says the situation is unchanged (if absolute levels hold) or worse (if levels drop). The relational intuition says: if we are all equally in the pit, the urgency is lower than if some are in the pit and some are in penthouses.

  **The Sharp Question:** If we formalize this relational intuition—let's call it **Comparative Prioritarianism**—does it retain the formal immunity to Levelling Down?
  *   If weights depend on relative standing (e.g., distance from the mean, or rank), then lowering the best-off person changes the relative standing of the worse-off.
  *   If lowering the best-off person *increases* the moral weight of the worse-off person's welfare (by making them less relatively deprived), we might generate a scenario where Levelling Down is neutral or even good.
  *   If lowering the best-off person *decreases* the total value simply because the best-off person lost welfare, we avoid LDO, but we risk losing the "comparative" motivation.

  **The Determinate Answer:** The project aims to prove a compatibility theorem. The question is not "Which view is true?" but "Is the set of normative constraints {Comparative Weighting, Strong Pareto, No Levelling Down} logically consistent?"
  *   **Yes:** Comparative Prioritarianism is a stable, distinct third category.
  *   **No:** The view collapses. It either violates Pareto (becomes irrational) or accepts Levelling Down (becomes Telic Egalitarianism) or ignores relativity (becomes Absolute Prioritarianism).

  This is determinate because it is a question of formal coherence, not moral persuasion.

  ***

  ### Fellowship Proposal

  **Project Title:** The Instability of Comparative Priority: Relational Weighting and the Levelling-Down Objection

  **1. The Research Question**
  Does a distributive view that assigns moral weight to individuals based on their *relative* welfare standing (Comparative Prioritarianism) necessarily succumb to the Levelling-Down Objection, or can it satisfy the Strong Pareto Principle while maintaining immunity to Levelling Down?

  **2. Motivation: Why the Existing Framing Fails**
  The contemporary debate regarding the Levelling-Down Objection (LDO) is stalled by a category error. The standard defense of Prioritarianism is that it escapes LDO because it is strictly increasing in individual welfare. As you noted, this is a property shared by Utilitarianism. Consequently, the LDO fails to do the work it is assigned: it distinguishes Welfarists from Non-Welfarists, but it does not distinguish Prioritarians from Utilitarians, nor does it cleanly separate Prioritarians from Pareto-inclusive Egalitarians.

  The literature treats "Prioritarianism" as a monolithic view defined by a concave transformation of absolute welfare levels. This formalization presupposes the answer to the normative question. It assumes that the "priority" owed to the worse off is a function of their absolute state (e.g., the moral urgency of pain) rather than their comparative state (e.g., the injustice of disadvantage).

  By hard-coding absolute levels into the weighting function, standard Prioritarianism immunizes itself against LDO trivially. It renders the view insensitive to the very relational facts that often motivate egalitarian concerns. If my moral claim on resources depends on the fact that I am poorer *than you*, then changing your resources changes my moral claim. Standard Prioritarianism denies this.

  This project proposes that the real axis of disagreement is not Priority vs. Equality, but **Absolute vs. Comparative Weighting**.
  *   **Absolute Weighting:** Weight($w_i$) depends only on $w_i$. (Standard Prioritarianism/Utilitarianism).
  *   **Comparative Weighting:** Weight($w_i$) depends on $w_i$ and some function of the distribution $W$ (e.g., mean, max, or rank).

  The existing framing leaves the question open because it refuses to model the Comparative option seriously, dismissing it as "Egalitarianism" without testing whether a hybrid view is coherent. This project argues that once we model Comparative Prioritarianism formally, the "cheap immunity" to LDO vanishes. The question is whether it vanishes entirely (collapsing into Telic Egalitarianism) or if a stable middle ground exists.

  **3. Methodology: Constructive Formal Ethics**
  This project will not be a literature survey, nor will it be a purely abstract axiomatic proof detached from normative significance. A literature survey would merely recount the stalemate. Pure axiomatics (e.g., "Prove Theorem X from Axioms A, B, C") risks obscuring the normative stakes behind technical lemmas.

  Instead, I will employ **Constructive Formal Ethics**.
  1.  **Formalization:** I will define a class of social welfare orderings representing "Comparative Prioritarianism." These will take the general form $V = \sum w_i \cdot \phi(w_i, \text{Ref}(W))$, where $\text{Ref}(W)$ is a reference point derived from the distribution (e.g., the maximum welfare, the mean, or a rank-based metric).
  2.  **Stress Testing:** I will subject these functions to the specific constraints of Strong Pareto and the No-Levelling-Down condition.
  3.  **Normative Interpretation:** I will interpret the mathematical results normatively. If a function avoids LDO only by becoming insensitive to the reference point, I will argue it has collapsed into Absolute Prioritarianism. If it remains sensitive to the reference point but implies Levelling Down can be good, it has collapsed into Telic Egalitarianism.

  **Why this beats the alternatives:**
  *   **Vs. Survey:** It generates a new result rather than summarizing old ones. It moves the debate from "Who said what?" to "Is this view coherent?"
  *   **Vs. Pure Axiomatics:** It keeps the focus on the specific weighting mechanisms that philosophers actually care about. We aren't just looking for *any* function that satisfies the axioms; we are testing the specific *class* of functions that capture the "Comparative" intuition. This ensures the philosophical relevance of the formal result.

  **4. Test Cases and Analysis**

  To determine the stability of Comparative Prioritarianism, I will run three specific test cases.

  **A. The Deterministic Levelling-Down Case (The Core Test)**
  *   *Scenario:* Two agents, $A$ (welfare 100) and $B$ (welfare 20). We lower $A$ to 50. $B$ remains at 20.
  *   *Absolute Prioritarianism:* Value drops. $A$'s contribution drops, $B$'s is unchanged. LDO avoided.
  *   *Comparative Prioritarianism:* $A$'s contribution drops. However, $B$'s *weight* might change because $B$ is now relatively closer to $A$.
  *   *Analysis:* If the weight function is sensitive to the gap ($A - B$), shrinking the gap might increase the moral value of $B$' welfare. If this increase outweighs the loss from $A$, the view recommends Levelling Down. If it does not, we must ask: did the weight actually depend on the comparison, or was it effectively absolute?
  *   *Goal:* Determine if there exists a weighting function $\phi$ where $\frac{\partial \phi}{\partial \text{gap}} > 0$ (sensitive to comparison) but Total Value still decreases when $A$ drops.

  **B. Variable Population / Replacement Cases**
  *   *Scenario:* We have a population of well-off people. We replace one well-off person with a new, worse-off person (keeping total population constant).
  *   *The Trap:* In Comparative Prioritarianism, adding a very rich person makes everyone else "poorer" in relative terms, potentially increasing their weights. Conversely, replacing a rich person with a poor one shrinks the mean/max.
  *   *Analysis:* This tests the "Sadistic" implications. If I can boost the moral value of the poor simply by adding a super-rich person (increasing the inequality and thus the weight of the poor), the view generates perverse incentives. This is the "Reverse Levelling Down."
  *   *Goal:* Check if Comparative Prioritarianism violates "Existence Independence" or implies that we should create unhappy rich people to boost the moral weight of the poor. This is often a stronger objection than LDO itself.

  **C. Risk and Uncertainty (The Feasibility Check)**
  *   *Your Concern:* You suspect the risk case is a dead end because concavity plus monotonicity makes any lottery no better than its expected-welfare vector.
  *   *My Assessment:* You are partially right, but it's not a dead end; it's a distraction for a 3-month project.
  *   *The Technical Issue:* In Ex Ante Prioritarianism, we maximize $\sum E[g(w_i)]$. In Ex Post, we maximize $E[\sum g(w_i)]$. If $g$ is comparative, $g(w_i, W_{-i})$, then the value of $i$'s outcome depends on $j$'s outcome. Under uncertainty, this creates **Non-Separability across States of Nature**.
  *   *Why it's risky:* If $i$'s weight depends on $j$'s realized welfare, and $j$'s welfare is stochastic, then $i$'s expected value depends on the *correlation* between $i$ and $j$. This leads to violations of the Independence Axiom in complex ways.
  *   *Decision for Proposal:* I will include this as a secondary test. It is not necessary to prove the main point about LDO. If the deterministic case shows Comparative Prioritarianism collapses, the risk case is moot. If the deterministic case holds, the risk case shows whether the view is plausible for policy.
  *   *Addressing your specific worry:* Concavity implies risk aversion. But comparative weighting implies "status risk aversion." It doesn't kill the branch, but it makes the view violate "Separability of Persons" in expectation. I will argue that this confirms the instability found in the deterministic case: if you care about relative standing, you cannot treat individuals as separate vessels of value, even under risk.

  **5. Expected Outcomes**

  **Positive Result (Unlikely but possible):**
  We identify a specific weighting function (e.g., one that is sensitive to rank but bounded) that satisfies Strong Pareto and avoids LDO.
  *   *Implication:* Prioritarianism can be rescued as a genuinely relational view. The "cheap immunity" charge is false. There is a stable middle ground between Absolute Priority and Telic Equality.
  *   *Paper Focus:* Defending this specific function as the correct interpretation of "Priority."

  **Negative Result (Expected):**
  We prove that any weighting function sensitive to relative standing either:
  1.  Violates Strong Pareto (implies we should lower the rich even if it hurts the poor slightly, or similar irrationalities).
  2.  Accepts Levelling Down (implies shrinking the gap is intrinsically good enough to offset welfare losses).
  3.  Collapses into Absolute Prioritarianism (the comparative term becomes normatively inert).
  *   *Implication:* The "Comparative Prioritarian" position is a mirage. You must choose: either you care about absolute levels (and LDO immunity is trivial/Utilitarian-compatible) or you care about relations (and you must accept LDO).
  *   *Paper Focus:* Dissolving the debate. Showing that the friend's defense of Prioritarianism relies on an Absolute interpretation that abandons the relational intuition, while your worry highlights that the relational intuition leads back to Egalitarianism.

  **6. Feasibility and Risk Management (3-Month Scope)**

  An 8,000-word paper is tight for formal ethics. The primary risk is "math creep"—spending too much time deriving proofs that don't yield philosophical insight.

  **What makes this too big for three months:**
  1.  **Generalizing the Weighting Function:** If I try to prove a theorem for *all* possible comparative functions, I will get bogged down in topology and continuity conditions.
      *   *Mitigation:* I will focus on two specific, plausible candidates: **Mean-Relative** (weight depends on distance from average) and **Rank-Relative** (weight depends on percentile). If these fail, the general class is suspect.
  2.  **The Risk Case:** As discussed, modeling uncertainty with interdependent weights is technically demanding.
      *   *Mitigation:* I will treat the Risk Case as a "Plausibility Check" section (1,500 words max). If the deterministic proof shows collapse, I will note that the risk case merely compounds the problem without solving it in full formal detail.
  3.  **Variable Population:** This can spiral into Repugnant Conclusion territory.
      *   *Mitigation:* I will restrict variable population to "Replacement Cases" (fixed $N$, swap identities) rather than "Existence Cases" (changing $N$). This keeps the math tractable while testing the comparative intuition.

  **Timeline:**
  *   **Month 1:** Formalize the two candidate Comparative Prioritarian functions. Run the deterministic LDO simulations. (Goal: Establish the core incompatibility result).
  *   **Month 2:** Run the Replacement and Risk checks. Draft the "Normative Interpretation" section—translating the math back into the argument with your friend.
  *   **Month 3:** Refine the argument. Ensure the "Determinate Answer" is front and center. Cut technical appendices to keep the word count focused on the philosophical implication of the formal result.

  **7. Conclusion**

  This project does not seek to solve distributive justice. It seeks to dissolve a specific conceptual confusion that is stalling progress. By showing that "Prioritarianism" is being used to cover two distinct formal structures (Absolute and Comparative), and that only one avoids LDO (at the cost of the relational intuition), we clarify the dialectic.

  The deliverable is a paper that forces the interlocutor to choose: Do you care about the poor because they suffer (Absolute), or because they are worse off than others (Comparative)? If the former, your immunity to LDO is trivial and shared by Utilitarianism. If the latter, you likely cannot avoid LDO. The "Third Way" is formally unstable. This provides the determinate answer needed to move the argument forward.
