  You're a moral philosopher who works specifically on distributive ethics and population axiology — someone who's comfortable with the formal side (social-welfare orderings, separability, the variable-population mess), not just the survey-article version of it. Please think carefully, and do some actual brainstorming first about what the sharp version of this question even is before you start writing; don't just hand me the textbook answer.

  Context: I had a long argument with a friend last night about prioritarianism and the levelling-down objection and we got nowhere. Her line: prioritarianism obviously escapes the objection, that's basically the whole point of the view, and anyone who still worries about it is just smuggling in the claim that equality has intrinsic value. My line: the immunity looks too cheap — any view that's increasing in each person's welfare gets it, plain utilitarianism included, so the objection can't be doing the work people say it does in seperating prioritarianism from egalitarianism. Two hours, no progress.

  Half-formed idea I want turned into a proposal: the debate treats "prioritarianism" as one thing, but the weighting function can take absolute or comparative input. Call the second one comparative prioritarianism: the weight a person's welfare gets depends on how far below the best-off (or below the mean) they are, not on their absolute level. That's arguably what you need to capture the thought that what matters is how badly off someone is compared with others, and it behaves like ordinary prioritarianism whenever the absolute scale is held fixed — but it looks like it reintroduces levelling-down pressure in full force. So maybe the real axis is absolute vs comparative weighting, not priority vs equality, and the standard framing hides that.

  Deliverable: a three-month junior fellowship, one 8,000-word paper at the end. Give me the question stated so that it has a determinate answer; why the existing framing leaves it open; the approach and why it beats the obvious alternatives (a literature survey, or just writing down axioms and proving things); the test cases to run it on — at least the comparative variants, the variable-population / "replace a well-off person with a worse-off one" cases, and the risk case, though I suspect the risk case is a dead end, since concavity plus monotonicity seems to make any lottery no better than its own expected-welfare vector, so tell me whether that's right and whether it kills that branch quickly; what a positive result and a negative result would each look like; and an honest account of what would make this too big for three months.

  Dont give me a bibliography or any citations — I'll fill those in myself, and I want the proposal to stand on the arguments alone.
