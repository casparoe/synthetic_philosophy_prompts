answer: |-
  (1) Correspondence table
  In this conceptual mapping, the **Utility Monster** corresponds to the **Gravitational Singularity**, a point of infinite density where moral weight concentrates entirely, rendering distinct individual claims invisible. **Spacetime Curvature** is mapped onto the **Gradient of Marginal Utility**; just as mass warps geometry, disproportionate utility capacity warps the trajectory of distributive obligations, bending them away from equality. The **Event Horizon** represents the **Threshold of Mandatory Redistribution**, the point beyond which any resource allocated elsewhere constitutes a moral failure, trapping all surplus value inward so that no distributive resource can escape. **Hawking Radiation** finds its analog in **Minimal Subsistence Rights**; just as black holes evaporate via quantum effects, the moral system must radiate enough resources back to the populace to prevent systemic collapse or revolt, though this is negligible compared to the inflow. Finally, the **Observer** is the **Moral Agent**, specifically one who has crossed the horizon of practical reasoning, realizing that independent moral claims of others are no longer visible or actionable against the monster's demand. **Photons/Matter** represent **Discrete Resources** (money, time, aid), which follow geodesics determined solely by the utility gradient. The **Force of Gravity** corresponds to **Moral Obligation**, acting universally and indiscriminately. This mapping visualizes utilitarianism not as a calculation, but as a topological inevitability where distinct moral patients disappear into a single center of value, suggesting that once the utility differential is high enough, moral space itself ceases to be flat or democratic.

  (2) Break points and which ones matter
  The analogy fractures at three critical junctures. First, **Determinism vs. Agency**: Black holes operate via deterministic geodesics; matter cannot choose to resist gravity. Moral obligations, however, confront agents capable of refusal. If agents can reject utilitarian demands based on rights or integrity, the "event horizon" is permeable. This mismatch undermines the anti-utilitarian conclusion because it treats a normative choice as a physical law. Utilitarianism is a decision procedure, not a force of nature. Second, **Entropy vs. Resentment**: Black holes possess well-defined thermodynamic entropy that always increases. Moral systems involve reciprocity and psychological thresholds; starving the many to feed the one generates resentment, reducing total utility dynamically. The physics analogy ignores this feedback loop, assuming static utility functions. Third, **Infinity vs. Magnitude**: A singularity implies infinite density. The Utility Monster merely has *high* marginal utility, not infinite. This is a decorative mismatch; while hyperbolic, it doesn't change the logic unless one assumes utility must be infinite to dominate.

  The first two mismatches genuinely undermine the conclusion. By modeling obligation as gravity, the analogy smuggles in inevitability. It suggests that once the utility differential exists, redistribution is as unavoidable as falling into a black hole. However, because moral agents can sever ties or enforce rights (unlike photons), the collapse into a singularity is not physically mandated but politically contingent. The analogy fails to account for the friction of social cooperation, treating moral space as a vacuum rather than a medium of resistance. Furthermore, utilitarianism can incorporate rules that prevent such collapse if those rules maximize utility long-term. The black hole model assumes act-utilitarianism in a vacuum, ignoring institutional stability. Therefore, the disanalogy regarding agency is fatal to the claim of inevitability, while the entropy mismatch highlights the dynamic instability of the monster scenario itself. The decorative infinity merely dramatizes the stakes without altering the structural logic, but the deterministic framing disguises the possibility of moral resistance as physically impossible.

  (3) Smuggled normative physics
  The image quietly imports significant normative baggage regarding the structure of moral space. Primarily, it presupposes that **moral space is isotropic**, meaning obligations radiate uniformly until warped by the monster. This ignores pre-existing rights or special relationships that create inherent moral texture independent of utility. It also assumes **obligations behave like conservative forces**, where energy (value) is conserved and merely redirected, neglecting that moral actions can create or destroy value through cooperation or conflict. Additionally, the analogy implies that the **value of the whole is reducible to the singularity**. By focusing all trajectories on the center, it suggests the "galaxy" of moral patients exists only to feed the core, presupposing a radical aggregativity that many utilitarians might reject if it threatens system stability. This framing subtly argues that individual separateness is an illusion that vanishes under sufficient utility pressure. It treats moral distance as purely functional rather than intrinsic. Consequently, the analogy assumes a version of utilitarianism that lacks internal constraints, presenting a straw man where the only variable is utility magnitude. It excludes rule-utilitarian considerations where the "geometry" of rights prevents the formation of such a horizon in the first place. The physics metaphor thus naturalizes a specific, vulnerable form of consequentialism, making contingent moral premises appear like immutable laws of nature.

  (4) Verdict on the anti-utilitarian conclusion
  Does the conclusion survive? The claim that utilitarianism is self-defeating relies on the inevitability of the collapse. Once the disanalogies are explicit, the conclusion weakens significantly. The black-hole framing was carrying the argument by disguising moral choice as physical necessity. If agents can resist, and if utility functions are dynamic (resentment), the singularity does not form. The anti-utilitarian conclusion holds only if one accepts the isotropic, deterministic moral space the analogy presupposes. Without the physics metaphor, the Utility Monster is merely a case of extreme inequality, not a structural collapse. Utilitarianism can respond by citing long-term instability or rights as utility-maximizing rules. Therefore, the conclusion that utilitarianism inevitably collapses is not supported by the logic of utility alone, but by the deterministic scaffolding of the black hole image. The analogy performs the work of the argument by making the outcome seem law-like. Once stripped of the astrophysical determinism, the "collapse" becomes a contestable prediction about human psychology and institutional design, not a logical inevitability. Thus, the anti-utilitarian conclusion does not survive the audit; it was dependent on the smuggled physics of inevitability rather than the ethics of utility. The monster remains a challenge, but not a singularity.

  (5) Replacement analogy, if warranted
  A superior analogy is **Network Topology**, specifically a **Hub-and-Spoke system prone to congestion**. Here, the Utility Monster is a central server node demanding excessive bandwidth. Resources (data packets) flow toward it due to efficiency protocols. However, unlike gravity, network links can be severed or throttled by administrators (moral agents). This captures disproportionate claim without physical determinism. It allows for **firewalls** (rights) that block traffic regardless of efficiency. It also models **network collapse** (social unrest) if the hub overloads the system, introducing dynamic feedback absent in the black hole model. This preserves the visual of centralization while restoring agency and structural fragility. Furthermore, networks can be **rewired**; decentralization is a viable option if the hub becomes detrimental. This reflects the human capacity to alter moral institutions. The analogy captures the risk of disproportionate accumulation without implying that such accumulation is a law of nature, keeping the focus on design choices rather than physical inevitability.
