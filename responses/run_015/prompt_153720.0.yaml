  Ethicists discussing Nozick’s utility monster often reach for an astrophysical analogy: they describe it as a supermassive black hole sitting at the center of moral space, bending every trajectory of obligation inward so that no distributive resource can escape its event horizon, and they deploy the image to argue that utilitarianism inevitably collapses into a single-point moral singularity. Audit this analogy with precision. First, provide an explicit correspondence table mapping the ethical scenario onto the physical one—what plays the role of spacetime curvature, the event horizon, the singularity itself, Hawking radiation (if any analog exists), and the observer who has fallen past the point of no return. Second, identify the precise disanalogies: black holes operate through deterministic geodesics and possess well-defined thermodynamic entropy, whereas moral obligations involve agency, reciprocity, and distributive thresholds—specify which mismatches genuinely undermine the anti-utilitarian conclusion and which are merely decorative. Third, articulate the normative baggage the image quietly imports—does it presuppose that moral space is isotropic, that obligations behave like conservative forces, or that the value of the whole (the “galaxy”) is reducible to the singularity? Fourth, determine whether the conclusion that utilitarianism is self-defeating survives once these disanalogies are explicit, or whether the black-hole framing was carrying the argument all along. Fifth, if the image fails, propose a replacement analogy—perhaps drawn from economic rent-seeking, epidemiological super-spreading, or network topology—that captures disproportionate moral claim without importing physical determinism. Structure your response as follows: (1) Correspondence table (approximately 250 words); (2) Break points and which ones matter (approximately 300 words); (3) Smuggled normative physics (approximately 200 words); (4) Verdict on the anti-utilitarian conclusion (approximately 200 words); (5) Replacement analogy, if warranted (approximately 150 words). Do not supply bibliographies, reading lists, or citations; work solely from the conceptual structure laid out above.
