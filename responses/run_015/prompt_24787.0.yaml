answer: |-
  **Case 1 (Commission)**
  Supervisor Mara manages a chemical storage unit. A safety valve is currently closed, keeping toxic fumes contained. Mara knows that if she actively opens the valve, pressure will release, preventing a system alarm, but fumes will enter the ventilation shaft where a cleaner is working, certainly killing them. Mara wants to avoid the alarm delay to leave on time. She opens the valve. The cleaner dies, and Mara leaves on time.

  **Case 2 (Omission)**
  Supervisor Mara manages a chemical storage unit. A safety valve is currently open, releasing toxic fumes into the ventilation shaft where a cleaner is working. Mara knows that if she actively closes the valve, fumes will be contained, saving the cleaner, but pressure will build, triggering a system alarm that delays her departure. Mara wants to avoid the alarm delay to leave on time. She refrains from closing the valve. The cleaner dies, and Mara leaves on time.

  ***

  **Analysis**

  The single feature doing the persuasive work is the **origin of the causal chain** leading to harm. In Case 1, the agent initiates a new sequence of events (opening the valve) that did not exist prior to her intervention. In Case 2, the agent allows an existing sequence of events (the already-open valve) to continue. Although the outcomes, intentions, and probabilities are identical, lay judgment treats the initiation of harm as a direct imposition of will, whereas allowing harm is perceived as a withdrawal of protection, triggering a weaker moral alarm.

  To show that this feature is responsible for the gap, consider a variant of Case 2 where Mara herself opened the valve ten minutes earlier for a routine check and now merely fails to close it before leaving. In this variant, the judgment gap collapses; laypeople judge Mara nearly as blameworthy as in Case 1. By linking the omission to a prior commission, the "allowing" is re-categorized as part of a continuous "doing," demonstrating that the moral weight laypeople assign depends on whether the harm is seen as a novel intrusion or a maintained status quo, rather than the outcome itself.

  A defender of the position that the doing/allowing distinction lacks moral significance (such as a consequentialist) would diagnose this pump as misleading because it exploits a cognitive heuristic rather than revealing a moral truth. They would argue that the intuition pump relies on the *salience* of physical movement and the emotional aversion to direct violence, which are psychologically potent but morally irrelevant markers. The consequentialist would contend that because the agent's choice structure is identical in both cases (choosing "leave on time + death" over "delayed + life"), the distinction is merely a bias in how humans process agency, not a genuine difference in moral wrongness.
