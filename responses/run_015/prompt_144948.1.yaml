      *   **The Conclusion:** Bring it to the room. The philosophers get the argument; the family gets the feeling. She isn't in the essays being read later. She is in the fact that we are here, thinking about her, *now*. That is the event.

  4.  **Refining the Tone:**
      *   *Check:* Is it too academic? *Fix:* Ground it in the drafts, the friendship, the coffee/letters.
      *   *Check:* Is it too sentimental? *Fix:* Keep the philosophical rigor. Don't say "her spirit lives on." Say "her absence is real."
