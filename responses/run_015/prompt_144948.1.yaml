      *   **Tone:** Honest, rigorous (no weasel words), emotionally resonant but philosophically consistent with Marguerite's views. No "she lives on in her work." No "in some sense."
      *   **Goal:** Use the unfinished novel's conceit to honor her without violating her philosophical stance or her specific funeral instructions.

  2.  **Deconstruct the Philosophical Stance:**
      *   Marguerite's view: A static record (book, brain states on paper) is not consciousness. It lacks the *experience* of reading/thinking. It's dead ink.
      *   The Cliché to Avoid: "She lives on in her books." (She hated this).
      *   The Speaker's Dilemma: The novel tries to capture the reader inside the text. The speaker knows it's a cheat.
      *   The Solution: Acknowledge the cheat. Acknowledge the absence. The value isn't in the *object* (the book/the body), but in the *event* (the reading/the friendship). The book doesn't contain the reading; the reading happens *now*, between the living and the memory of the dead.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the constraint. She left instructions. We must respect them. Establish the relationship (teacher, then friend).
      *   **The Philosophy (The "Hard" Part):** Briefly summarize her work without getting bogged down. The "book of states" argument. She said no, there's nobody home in the book.
      *   **The Novel/Confession:** Bring in the speaker's unfinished book. The trick of writing the reader into the text. Admit it's a failure/cheat. Why? Because Marguerite was right. You can't capture the event in the record.
