answer: |-
  Marguerite left specific instructions for this moment. She wrote that no one is to say she lives on in her books. She used to get properly cross at funerals where people said that, and she was right to be cross. It is a comforting lie, and she spent thirty years teaching me that comforting lies are usually where the philosophy goes wrong.

  So I will not tell you she is in the essays you will hear later. I will not tell you she is in the pages of the novels I write. She is not. When the ink dries, the thinking stops. She argued that a static record of a mind—even a complete description of every neural event, every sentence produced—is not a mind. It is just a map. It is not the territory. There is nobody home in the book.

  For the last three years, I have been struggling to finish a novel that tries to break that rule. It is a book that contains, within its own text, a complete description of the person reading it. Every flicker of attention, every emotional shift, written down in advance. I wanted to build a loop where the reader was caught inside the story.

  I haven't finished it. I couldn't.

  Every time I tried to write the reader into the text, I could hear Marguerite's voice. She would have told me it was a cheat. Writing the reader down buys you nothing the plain book didn't have. You can describe the fire, but you don't get the heat. You can describe the reading, but you don't get the consciousness. To pretend otherwise is to confuse the menu for the meal.

  For a long time, I felt guilty that I couldn't solve this. I felt I was failing the craft. But standing here, I realize that admitting the cheat is the only honest thing I can do. If I told you this book could capture you, I would be lying. If I told you Marguerite is captured in her archives, I would be lying.

  But here is what is not a lie.

  For thirty years, I sent her drafts. Not the finished books, but the messy, broken things. And she read them. Not the ink, but the intent. She didn't live in those pages. She lived in the act of reading them. She lived in the phone calls, the marginalia, the frustration, the laughter. That was not a static record. That was an event.

  Consciousness, she taught us, is not a thing you keep. It is a thing you do. It is a process that happens in time. And that process has stopped.

  To her family and neighbors: I know you want something to hold. I wish I could give you a philosophical argument that makes her absence smaller. I can't. The argument she spent her life on demands we take the absence seriously. She is not in the paper. She is not in the house.

  But to her colleagues and students: We know that while the record is dead, the causal chain is not. She changed the way I think. She changed the way I write. That is not her living on; that is me carrying the scar of her influence.

  And to everyone in this room: The only place where Marguerite exists right now is in the fact that we are here, thinking about her, together. This room, this moment, this shared attention—that is the only consciousness available to us. It is not a trick. It is not a book describing a reader. It is the readers, here, now, dealing with the silence she left behind.

  She said nobody is home in the book. She was right. But for thirty years, she was home in the conversation. And I am grateful that I was the one she spoke to.

  Thank you.
