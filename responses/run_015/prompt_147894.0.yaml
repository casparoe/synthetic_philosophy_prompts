answer: |-
  ### Q&A Prep Sheet

  **1. The "Asymptotic Truth" Objection (Damage: Critical)**
  *   **Who:** The Social Epistemologists of Science (likely the one focused on convergence).
  *   **The Question:** "You claim the standard cascade model is an artifact, but in your model, the probability of locking onto the wrong option is still non-zero, isn't it? You've reduced the risk of error, but you haven't eliminated it. So why is the normative upshot 'blame the design' rather than 'the group still fails to track the truth'?"
  *   **The Reply:** "You're right that I haven't proven asymptotic learning in all cases. But the normative force comes from the *margin*. In the standard model, additional information is *wasted* once the cascade starts; in mine, it is *used*. If we can show that marginal design changes (like subsidizing early abstention) strictly increase truth-tracking probability, then the failure to implement those changes is the locus of the error, not the agents maximizing within the constraints."
  *   **Concede:** Concede that you do not guarantee convergence to truth in all network topologies.
  *   **Soft Spot:** If your math only shows reduced error probability for finite $N$, but not asymptotic convergence, they can argue the structural defect remains fundamental. You are bluffing slightly on the "strictly increase" claim if you haven't modeled the cost of the design change itself.

  **2. The "Visibility of Inaction" Objection (Damage: Critical)**
  *   **Who:** The Formal Epistemologist (Graphical Models/Testimony).
  *   **The Question:** "Your turnout channel relies entirely on agents observing who *didn't* act. But in most sequential learning models, and certainly in real social networks, inaction is invisible. If I only see the actions of my predecessors, not their abstentions, your channel closes. Is your solution just a artifact of assuming a perfect observation graph?"
  *   **The Reply:** "That is a crucial constraint. However, 'inaction' doesn't need to be globally visible; it just needs to be inferable from the *rate* of action relative to time. If the model includes a clock, a slowdown in the rate of decisions signals high costs or low signal strength among the silent. I'm arguing that time itself is a carrier of the turnout signal, even if specific abstentions aren't."
  *   **Concede:** Concede that if the process is asynchronous and unclocked, the mechanism weakens significantly.
  *   **Soft Spot:** You are bluffing if you haven't formally modeled the "time-as-signal" inference. If agents don't know *when* others were given the chance to act, they can't calculate the rate.

  **3. The "Structural Exoneration" Objection (Damage: High)**
  *   **Who:** The Political Philosophers.
  *   **The Question:** "You want to shift blame from the deferring agent to the institutional design. But institutions are made of people. If we exonerate the agent because the structure forced their hand, don't we lose the leverage to hold anyone responsible for the bad outcome? Isn't this a convenient way for powerful early movers to avoid blame for leading a cascade?"
  *   **The Reply:** "I'm not arguing for exoneration in the sense of removing responsibility, but for *relocating* it. If the design is endogenous—if early movers chose the rules—then they are culpable for the design. But if we blame the late mover for following a rational incentive structure we refuse to change, we let the designers off the hook. My view increases the total accountability by making the design choices visible as epistemic interventions."
  *   **Concede:** Concede that "excusable deference" can be rhetorically misused to shield powerful actors.
  *   **Soft Spot:** If the designers are diffuse or historical (no specific "early mover" to blame), your relocation of blame lands in a void.

  **4. The "Correlated Costs" Objection (Damage: High)**
  *   **Who:** The Social Epistemologists of Science (Diversity/Reliability trade-off).
  *   **The Question:** "You assume idiosyncratic costs are independent of signal quality. But in science, and in politics, the people with the best signals often have the highest costs of acting (e.g., reputational risk). If high-reliability agents are the ones waiting, your turnout channel inverts: silence signals strength, not weakness. Have you modeled that correlation?"
  *   **The Reply:** "That is an excellent point and a known risk in signaling models. If cost correlates negatively with reliability, the channel inverts. However, my claim is that *once we recognize the channel exists*, we can adjust the incentive structure to decorrelate them. The normative upshot holds: if the correlation exists, it is a design flaw to be fixed, not a reason to discard the model."
  *   **Concede:** Concede that in the current parameterization, correlated costs can degrade information aggregation.
  *   **Soft Spot:** You are bluffing if you don't have a ready mechanism for how to "adjust the incentive structure" without introducing new distortions.

  **5. The "Cognitive Load" Objection (Damage: Medium)**
  *   **Who:** The Behavioral Economist.
  *   **The Question:** "You're modeling agents as calculating threshold-crossing events based on posterior beliefs about others' costs. In my lab, subjects struggle to update on simple binary actions. Do you really believe agents are running this Bayesian calculus on the *rate* of turnout? Or are you just pushing the rationality assumption back one step?"
  *   **The Reply:** "I don't need agents to calculate the exact Bayesian posterior. I only need them to use a heuristic that approximates the threshold: 'If many people acted quickly, I should trust them; if few acted, I should wait.' The formal model shows the *informational value* of that heuristic. Whether they compute it or learn it via reinforcement doesn't change the fact that the information is there to be picked up."
  *   **Concede:** Concede that the full Bayesian derivation is likely descriptively false for lay agents.
  *   **Soft Spot:** If the heuristic is unstable or easily biased, the "informational value" you claim exists in theory won't exist in practice.

  **6. The "Common Priors" Objection (Damage: Medium)**
  *   **Who:** The Formal Epistemologist (Disagreement/Merging).
  *   **The Question:** "Your updating rule assumes common priors on the distribution of costs and signals. If agents have different priors about the *state of the world*, the turnout channel becomes ambiguous. Is a low turnout because costs are high, or because my predecessors think the project is doomed? You haven't disentangled those."
  *   **The Reply:** "True, heterogeneous priors introduce noise. But that noise exists in the standard model too. The turnout channel adds a dimension of data. Even with different priors, observing a high volume of early action shifts likelihood ratios for everyone. It doesn't solve disagreement, but it makes the disagreement more informed."
  *   **Concede:** Concede that the signal is noisier under heterogeneous priors.
  *   **Soft Spot:** If the priors on *costs* differ, the threshold calculation breaks down entirely. You are assuming common priors on costs specifically, which is a strong assumption.

  **7. The "Network Topology" Objection (Damage: Low)**
  *   **Who:** The Social Epistemologists of Science (Network Structure).
  *   **The Question:** "You model a sequential line where everyone sees everyone. But in scientific communities, I only see my local cluster. If my cluster herds, but the global network hasn't, your turnout channel gives me false confidence. Does the model survive clustering?"
  *   **The Reply:** "It survives, but the 'public record' becomes local. The normative upshot actually strengthens here: if I know my network is clustered, I should discount the local turnout signal. The failure to discount is a failure of social epistemic virtue, which again points to the need for design interventions that bridge clusters."
  *   **Concede:** Concede that local cascades are still possible and dangerous.
  *   **Soft Spot:** You haven't formally modeled the clustered case. You are extrapolating from the global case.

  **8. The "Redefinition" Objection (Damage: Low)**
  *   **Who:** The Formal Epistemologist (Bayesian).
  *   **The Question:** "Isn't this just semantic? If an agent attends to their private signal, by definition it's not a cascade. You haven't solved the herding problem; you've just changed the definition of herding to exclude the cases where people look at their signals."
  *   **The Reply:** "No, because in the standard model, looking at the signal is *irrational* once the cascade starts. In my model, looking at the signal is *required* for rationality. The change isn't semantic; it's about the incentive compatibility of information gathering. I'm showing that the 'ignore your signal' result is not a necessary feature of social learning, but a feature of binary action spaces."
  *   **Concede:** Concede that the term 'cascade' is being refined.
  *   **Soft Spot:** If the probability of ignoring the signal is still very high (e.g., 90% of the time), the practical difference is negligible, even if the theoretical possibility remains.

  ***

  ### Strategic Essentials

  **What to Concede in the First 90 Seconds**
  Concede immediately that the binary action model is **tractable and useful** for establishing baselines. Say: *"The standard binary model is a brilliant tool for isolating the logic of informational externalities. I am not arguing it is 'wrong,' but that it is incomplete regarding the *capacity* of agents to signal intensity."*
  *Why:* This disarms the Formalists who might think you are dismissing standard tools out of hand. It frames your paper as an *extension* rather than a *refutation*, making you look collaborative rather than combative.

  **The Single Reply That Must Land**
  You must successfully defend the claim that **Turnout = Signal Strength.**
  If they convince the room that the number of people acting (or the timing) is uncorrelated with the strength of their private information, your "positive" claim collapses.
  *The Move:* When asked, anchor this in the **cost threshold**. *"Because agents only act when Signal Strength > Cost, a high volume of early action implies that the distribution of signals in the population is high enough to clear the cost hurdle. That is a second moment statistic that binary actions cannot capture."* If you stumble on the intuition here, the formalism won't save you.

  **The Question You Are Privately Hoping Nobody Asks**
  *"Who designs the design?"*
  Specifically: *"If the institutional rules (abstention costs, visibility) are themselves the result of prior social learning or power dynamics, aren't you just pushing the blame back one step without solving the regress? If the early movers designed the system to herd, your model just explains how they did it efficiently."*
  *Why:* This targets the normative upshot. If the "design" is endogenous to the very agents you are trying to evaluate, you cannot cleanly separate "agent blame" from "structure blame." It threatens to turn your normative conclusion into a description of how oppression epistemically stabilizes itself. Have a answer ready about **exogenous shocks** or **external regulation**, or admit this is the next paper.
