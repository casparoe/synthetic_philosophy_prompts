      *   *Key Concept:* *Hua* (Transformation/Change). Life and death are like the four seasons.
      *   *Metaphysics:* *Qi* (vital breath/energy) condenses to form life, disperses to form death. It's a continuous flow, not a binary on/off switch.
      *   *Emotional Stance:* He *was* initially upset ("I was a fool to wail"), but then realised the cosmic perspective. It's not about *lack* of grief, but *transcending* the conventional understanding of loss.
      *   *Self:* Not a fixed substance. A temporary configuration of *qi*.

  3.  **Audit Analogy 1: Garbage Collection (GC):**
      *   *Premise:* Memory is freed, objects destroyed, but memory space is reused for new objects.
      *   *Pros:* Captures the idea of recycling material/energy. The "stuff" doesn't vanish from the universe.
      *   *Cons:* GC is usually deterministic and functionalist. It implies a "manager" (the GC algorithm) and a "heap" (static resource). Zhuangzi's *Dao* isn't a manager; it's the process itself. GC implies the *parts* are the same, just reassigned. Zhuangzi implies the *form* changes entirely.
      *   *Functionalist Trap:* GC assumes the value is in the utility of the memory. Zhuangzi sees value in the spontaneous unfolding (*ziran*).
      *   *Emotional Implication:* If death is just GC, why mourn? But GC is cold, mechanical. Zhuangzi's view is organic.

  4.  **Audit Analogy 2: Process Termination:**
      *   *Premise:* Process ends, resources released, PID gone.
      *   *Pros:* Captures the finality of the *individual* configuration. The "I" stops running.
      *   *Cons:* Implies nothingness or void after. Zhuangzi explicitly rejects "nothingness." The *qi* goes somewhere (disperses). It's too binary (running/killed).
      *   *Emotional Implication:* If it's just termination, grief is irrational (mourning a stopped clock). But this misses the continuity of the *Dao*.

  5.  **Drafting the Correspondence Table:**
