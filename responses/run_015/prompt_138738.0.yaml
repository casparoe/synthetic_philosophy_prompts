prompt: |-
  I work as the scientific secretary to the programme-grant panel of a national research council. We award five-year grants to what we call programmes rather than projects: a group gets funded to pursue a line of work, and at the mid-term and renewal points we decide whether to continue, cut, or redirect. The volume is real: about forty proposals a cycle, roughly ninety minutes of panel time each, a panel made of working scientists and clinicians with no philosophy of science training and no patience for it, and a requirement that every decision be written up in a page of plain language that a losing applicant can read without needing a primer. Since a row a few years ago about metric-gaming, we are also forbidden to use impact factors, citation counts, or h-indices anywhere in the deliberation, which removes the proxy everyone actually relied on and has left the panel falling back on vibes about whether a field feels exciting.

  I want to turn Lakatos's methodology of research programmes into something we can actually run. I read him once in graduate school and remember the skeleton: a programme has a hard core its practitioners will not let be refuted, a belt of auxiliary hypotheses that absorbs the damage, a negative heuristic telling them what not to aim at, and a positive heuristic that is supposed to be a standing plan for building models rather than a list of repairs. A programme is progressive when its successive versions predict something new and some of the new things hold up, and degenerating when it only ever patches after the fact, with the belt growing to fit data everyone already had. Elimination is comparative and slow: a rival has to explain what its predecessor explained plus something more, and Lakatos says somewhere that there is no such thing as instant rationality, that a programme can only be appraised with hindsight over decades. My own temptation is crude: count the work packages that predict something not yet known against the ones that merely accommodate an anomaly someone already published, and fund whichever number is bigger. I suspect that is too crude in at least three ways — it rewards volume of prediction over weight, it has no answer for a group proposing to spend five years building the instrument or the mathematics needed to make the prediction at all, and it gives us nothing for a consortium that generates predictions continuously but absorbs every failure as a technicality, which looks to me less like a programme than like machinery for never being wrong.

  So please give me the procedure itself, in the order we would run it: the questions in sequence, what counts as a sufficient answer to each, where it returns a clear no, and where it has to stop and hand the decision to a person because the issue is one of values or temperamental patience rather than method. I need it to work from the documents we actually have — the proposal, the track record section, and the group's own account of what they would abandon if forced — and to say how to recover the hard core and the positive heuristic from those, including what to do when a proposal is written in a way that conceals them, since applicants quickly learn that admitting to a hard core sounds dogmatic. I would also like it to be honest about what it cannot do: I assume it cannot compare programmes in different fields, cannot say whether a core is true, and cannot tell us how long to wait, and I would rather have those limits named in the write-up than have a panel member discover them mid-meeting. Then run it on three anonymised cases from our last cycle. Programme A is a thirty-year-old line of work, still prolific, whose last three novel predictions failed and which now proposes another two years of re-deriving old measurements under a revised correction term; the panel reveres its founder, who is retiring, and I do not want the answer I expect. Programme B proposes to point an automated pipeline at a large class of datasets, will produce forecasts constantly, and treats every miss as a specification issue to be retrained away; I am unsure whether this is even an appraisable programme or whether the procedure should return a different kind of verdict, something like nothing here to evaluate. Programme C has produced no confirmed novel fact in nine years and says the blocking computation is not yet feasible, but its five-year plan is a genuinely ordered sequence of simplified models that would eventually make the prediction, and it is the one case where I think hindsight might vindicate them. If the procedure's verdicts on these three are ones I should overrule, say so, and say which verdict goes and why.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and case analysis:

  1.  **Analyze the Request:**
      *   **Role:** Scientific Secretary to a programme-grant panel of a national research council.
      *   **Context:** 5-year programme grants (not projects). Mid-term/renewal decisions. ~40 proposals/cycle. 90 mins/panel time each. Panel = working scientists/clinicians (no philosophy training, impatient). Output = 1-page plain language decision letter.
      *   **Constraints:** No bibliometrics (impact factors, citations, h-indices). No "vibes." Must use Lakatos's Methodology of Scientific Research Programmes (MSRP).
      *   **Goal:** Turn Lakatos into a *runnable procedure* (sequence of questions, pass/fail criteria, hand-off points).
      *   **Inputs:** Proposal, Track Record, Group's account of what they'd abandon (if forced).
      *   **Challenges:** Applicants hide the "hard core" (sounds dogmatic). Need to recover Hard Core (HC) and Positive Heuristic (PH).
      *   **Limitations to Acknowledge:** Cannot compare across fields, cannot judge truth of core, cannot dictate time horizons.
      *   **Specific Task:** Run the procedure on three anonymized cases (A, B, C) and advise if the verdicts should be overruled.
      *   **Case A:** 30-year-old line, prolific, last 3 novel predictions failed, proposing 2 years re-deriving old measurements with revised correction. Founder revered/retiring. (Suspicion: Degenerating but protected by status).
      *   **Case B:** Automated pipeline on large datasets, constant forecasts, treats misses as specification/retraining issues. (Suspicion: Is this even a research programme? Or just machinery for never being wrong?).
      *   **Case C:** No confirmed novel fact in 9 years, blocking computation not feasible yet, but 5-year plan is ordered sequence of simplified models leading to prediction. (Suspicion: Progressive in theory, but currently stagnant. Needs patience).

  2.  **Deconstruct Lakatos for Bureaucratic Use:**
      *   *Lakatosian Concepts:* Hard Core (HC), Protective Belt (PB), Negative Heuristic (NH), Positive Heuristic (PH), Progressive (theoretical/empirical), Degenerating.
      *   *Adaptation:* Needs to be fast (90 mins), plain language, metric-free.
      *   *Recovery:* How to find HC if not stated? Look for what they *won't* test. Look for what they treat as background truth.
      *   *Progressivity:* Not just "new predictions," but "risky predictions confirmed."
      *   *Degeneration:* "Ad hoc" adjustments to save the core without new content.

  3.  **Drafting the Procedure (The "Lakatos Audit"):**
      *   *Step 1: Reconstruction.* Identify the HC and PH from the text.
      *   *Step 2: The Belt Check.* Are new work packages expanding the PH or patching the PB?
      *   *Step 3: The Risk Check.* Are there novel, forbidden, or improbable predictions?
      *   *Step 4: The Track Record.* Did previous predictions stick?
      *   *Step 5: The Rivalry/Value Check.* (Where human judgment enters).
      *   *Hand-off Points:* Where does the algorithm stop and the panel decide? (Values, field comparison, time horizon).

  4.  **Refining the Questions (Iterative Process):**
      *   *Initial thought:* "Is the core true?" -> *Correction:* Lakatos says we can't know. Ask "Is the core explicit or recoverable?"
      *   *Initial thought:* "Count predictions." -> *Correction:* User noted this is too crude. Ask "Are the predictions *novel* facts or *accommodated* anomalies?"
      *   *Initial thought:* "Fund the progressive one." -> *Correction:* Need to handle Case C (long-term). Add a "Feasibility of Heuristic" check.

  5.  **Developing the Case Studies:**
      *   *Case A (The Aging Giant):*
          *   HC: Likely the foundational theory of the founder.
          *   PH: Seems to be "adjust correction terms."
          *   Track Record: 3 failed novel predictions.
          *   Lakatos Verdict: Degenerating (protecting core via ad hoc belt adjustments).
          *   Panel Pressure: Reverence for founder.
          *   Advice: Overrule the "fund" instinct. The procedure says "cut/redirect."
      *   *Case B (The Machine Learning Pipeline):*
          *   HC: "The data contains the truth + the pipeline finds it."
          *   PH: "Retrain/Respecify."
          *   Issue: No hard core, just optimization. Every failure is a "specification issue." This is the "machinery for never being wrong" the user feared.
          *   Lakatos Verdict: Not a research programme. It's a degenerating programme masquerading as engineering, or simply *not science* in the Lakatosian sense (no risk).
          *   Advice: Verdict is "Nothing to evaluate." Do not fund as a *research programme*. Maybe fund as infrastructure, but not science grant.
      *   *Case C (The Long Game):*
          *   HC: Theoretical framework requiring heavy computation.
          *   PH: Sequence of simplified models.
          *   Track Record: 9 years no novel fact.
          *   Issue: Is the PH viable?
          *   Lakatos Verdict: Potentially progressive *if* the heuristic is sound. The lack of facts is due to external constraints (computation), not ad hoc patching.
          *   Advice: Fund, but with strict mid-term review on the *sequence*, not just facts. Overrule the "cut for lack of output" instinct.

  6.  **Addressing the Constraints & Tone:**
      *   *Tone:* Professional, bureaucratic but intellectually honest, acknowledging the user's constraints (time, panel composition).
      *   *Plain Language:* The output needs to be translatable into the 1-page letter.
      *   *Limits:* Explicitly state where the procedure fails (cross-field comparison, time horizons).

  7.  **Final Review against User Prompt:**
      *   *Sequence of questions?* Yes.
      *   *Sufficient answers?* Yes.
      *   *Clear No?* Yes.
      *   *Hand-off to person?* Yes.
      *   *Recover HC/PH from docs?* Yes.
      *   *Honest about limits?* Yes.
      *   *Run on A, B, C?* Yes.
      *   *Advise on overruling?* Yes.

  8.  **Self-Correction/Nuance during drafting:**
      *   *Worry:* Is Lakatos too complex for 90 minutes?
      *   *Fix:* Simplify the terminology in the procedure. Call HC "Foundational Assumptions" and PH "Growth Plan." Keep the logic Lakatosian but the language panel-friendly.
      *   *Worry:* Case B is tricky. ML *can* be a research programme (new architecture predicts new behavior). But the prompt says "treats every miss as a specification issue to be retrained away." That sounds like curve-fitting (degenerating). I need to be firm on that distinction.
      *   *Worry:* Case A. The user says "I do not want the answer I expect." They expect the procedure to say "Cut." They might want to fund A for stability. I need to tell them the procedure says "Cut," and if they fund, they are prioritizing *sociological* stability over *scientific* progressivity. That's a value judgment hand-off.

  9.  **Final Polish:** Ensure the distinction between "Procedure Verdict" and "Secretary's Advice" is clear. The procedure is the tool; the advice is how to wield it politically/intellectually. (Proceed to generate output).

  *(Self-Correction during drafting the response)*: I need to make sure I don't just give philosophy. I need to give a *checklist* they can put in a folder. The "Hand-off" section is crucial for the "values/temperamental patience" requirement.

  Let's structure the response:
  1.  **The Procedure (The Lakatos Audit):** Step-by-step questions.
  2.  **The Limitations Statement:** For the panel chair to read out.
  3.  **The Case Runs:** A, B, C with Verdicts and Advice.
  4.  **The Plain Language Translation:** How to write the letter.

  *Refining the "Recovery" of Hard Core:* Applicants hide it. The procedure needs a specific trick for this. *Trick:* Ask "What finding would cause you to abandon this approach entirely?" If the answer is "None," there is no science. If the answer is vague, dig into the "Negative Heuristic" (what they refuse to test).

  *Refining Case B:* If it's purely predictive modeling without causal theory, Lakatos might struggle. But the prompt says "treats every miss as a specification issue." That is the definition of a degenerating protective belt. I will classify it as "Non-Appraisable as a Research Programme."

  *Refining Case C:* This is the "theoretical research" case. Lakatos allows for theoretical progressivity before empirical. The key is the "ordered sequence."

  Okay, ready to write.s
answer: |-
  Here is the procedure, designed to fit within your ninety-minute window, followed by the run on your three cases and my advice on where to overrule the output.

  # The Lakatos Audit Procedure

  **Purpose:** To distinguish between a research programme that is generating new knowledge (progressive) and one that is protecting itself from falsification (degenerating).
  **Inputs:** Proposal text, Track Record (last 5 years), Statement of Abandonment (what they would give up if forced).
  **Time Allocation:** 15 mins prep (Secretary), 45 mins panel discussion, 30 mins decision/write-up.

  ## Phase 1: Reconstruction (15 Minutes)
  *Goal: Recover the Hard Core and Positive Heuristic, even if concealed.*

  **Q1. The Foundational Assumption (Hard Core):**
  *   **Question:** What is the one assumption in this proposal that is treated as true without being tested?
  *   **How to find it:** Look for what they *do not* propose to vary. Look at the "Statement of Abandonment." If they say "We would abandon this if X failed," X is *not* the core. The core is what remains if X fails.
  *   **Sufficient Answer:** A specific theoretical claim (e.g., "Protein folding is driven primarily by hydrophobic effect," not "We study proteins").
  *   **Fail State:** If the panel cannot agree on a core, or if the applicants claim they would abandon the whole approach upon *any* negative result, mark as **No Hard Core**. (See Phase 4).

  **Q2. The Growth Plan (Positive Heuristic):**
  *   **Question:** Does the proposal outline a plan to build *new* models, or a plan to fix *old* models?
  *   **How to find it:** Compare the Work Packages (WPs). Do later WPs depend on the success of earlier WPs to unlock new phenomena (Growth), or do they exist to explain why earlier WPs didn't match data (Repair)?
  *   **Sufficient Answer:** A sequence where WP2 predicts something WP1 could not, regardless of WP1's success.
  *   **Fail State:** If WP2 is only triggered if WP1 fails (contingency planning for anomalies), mark as **Protective Belt**.

  ## Phase 2: Appraisal (30 Minutes)
  *Goal: Determine Progressivity vs. Degeneration.*

  **Q3. The Novelty Check:**
  *   **Question:** Of the predictions listed in the Track Record, how many were made *before* the data was known?
  *   **Sufficient Answer:** At least one confirmed novel prediction in the last cycle.
  *   **Fail State:** All "predictions" are accommodations of existing anomalies (post-hoc fitting).

  **Q4. The Ad Hoc Check:**
  *   **Question:** In the current proposal, are new parameters or correction terms being added to save the Foundational Assumption from recent failures?
  *   **Sufficient Answer:** New terms are derived from the Growth Plan (Q2), not invented to fit specific recent errors.
  *   **Fail State:** The proposal is primarily a list of corrections for the last cycle's misses.

  **Q5. The Risk Check:**
  *   **Question:** Is there a specific outcome in this 5-year plan that would cause the group to stop or fundamentally change direction?
  *   **Sufficient Answer:** Yes, a specific "Stop Condition" is identified.
  *   **Fail State:** "We will continue regardless." (This indicates the programme is unfalsifiable).

  ## Phase 3: The Hand-Off (15 Minutes)
  *Goal: Identify where method ends and values begin.*

  **The procedure stops here.** If the proposal passes Phase 2, it is *methodologically* sound. The panel must now decide on:
  1.  **Field Comparison:** Is this field worth funding compared to others? (The procedure cannot answer this).
  2.  **Time Horizon:** Is the panel willing to wait for the prediction? (The procedure cannot answer this).
  3.  **Sociological Value:** Does the stability of this group matter more than the risk? (The procedure cannot answer this).

  **Decision Logic:**
  *   **Clear No:** Fail Q1 (No Core) OR Fail Q5 (No Risk) OR Fail Q3 & Q4 (Degenerating).
  *   **Clear Yes:** Pass Q1, Q2, Q3, Q4, Q5.
  *   **Hand-Off:** Pass Q1 & Q2, but Fail Q3 (No recent facts) *IF* Q2 shows a viable long-term theoretical build. (This requires a value judgment on patience).

  ***

  # Limitations Statement (For the Panel Chair)
  *Read this before deliberations begin to prevent scope creep.*

  1.  **Truth:** This procedure does not tell us if the Foundational Assumption is *true*. It only tells us if the group is testing it honestly.
  2.  **Comparison:** A "Progressive" verdict in Physics is not comparable to a "Progressive" verdict in Epidemiology. We cannot rank them against each other using this tool.
  3.  **Time:** This procedure cannot tell us how long to wait for a prediction. That is a budgetary and strategic value judgment, not a scientific one.
  4.  **Non-Science:** If a proposal lacks a Hard Core (Q1), it is not a research programme. It may be engineering, service, or data-mining. It cannot be evaluated by this method.

  ***

  # Case Runs & Advice

  Here is the procedure applied to your three anonymised cases.

  ## Programme A: The Aging Giant
  *   **Q1 (Core):** Recoverable. It is the Founder's Theory. Applicants conceal it, but the "Statement of Abandonment" reveals they would not abandon the theory even if the new measurements fail; they would only adjust the correction term.
  *   **Q2 (Growth):** Fail. The Work Packages are re-derivations of old measurements under revised corrections. This is belt-patching, not model-building.
  *   **Q3 (Novelty):** Fail. Last three novel predictions failed.
  *   **Q4 (Ad Hoc):** Fail. The proposal is explicitly a "revised correction term" to accommodate the failures.
  *   **Q5 (Risk):** Fail. Implicitly, they will not abandon the core.
  *   **Procedure Verdict:** **DEGENERATING. DO NOT RENEW AS RESEARCH.**
  *   **Secretary's Advice:** **Overrule the Panel's instinct to fund.**
      *   *Why:* You noted you "do not want the answer I expect." You expect the procedure to say cut, and you fear the panel will fund out of reverence. If you fund this, you are not funding science; you are funding a pension for a reputation.
      *   *Action:* Redirect. Offer a "Legacy Grant" to archive their data and wind down, but do not fund new "research" work packages. The plain language letter must say: *"While your past contributions are significant, the current proposal focuses on adjusting existing models to fit past data rather than generating new testable predictions."*

  ## Programme B: The Automated Pipeline
  *   **Q1 (Core):** **No Hard Core.** The "core" is "the pipeline works." When a prediction fails, it is treated as a "specification issue to be retrained away." There is no theoretical claim being protected, only an optimization function.
  *   **Q2 (Growth):** N/A. There is no heuristic, only iteration.
  *   **Q3 (Novelty):** Ambiguous. They produce forecasts constantly, but if every miss is "retrained away," no forecast is ever truly falsified.
  *   **Q4 (Ad Hoc):** **Critical Fail.** Treating every miss as a specification issue is the definition of a degenerating protective belt where the belt *is* the entire methodology.
  *   **Q5 (Risk):** Fail. They do not stop; they retrain.
  *   **Procedure Verdict:** **NOT A RESEARCH PROGRAMME.**
  *   **Secretary's Advice:** **Uphold the Verdict. Do not fund as a Programme Grant.**
      *   *Why:* You asked if this is "even an appraisable programme." Lakatos says no. This is infrastructure or service work masquerading as discovery. It is "machinery for never being wrong."
      *   *Action:* Reject the scientific claim. If the data pipeline is useful, fund it under an "Infrastructure" call, not a "Research Programme" call. The plain language letter must say: *"This proposal describes a robust data processing system, but it does not articulate a theoretical framework that risks falsification. It is better suited for infrastructure funding."*

  ## Programme C: The Long Game
  *   **Q1 (Core):** Recoverable. The theoretical framework requiring heavy computation.
  *   **Q2 (Growth):** Pass. The five-year plan is a "genuinely ordered sequence of simplified models." This is a Positive Heuristic (building models to unlock the prediction).
  *   **Q3 (Novelty):** Fail. No confirmed novel fact in nine years.
  *   **Q4 (Ad Hoc):** Pass. The lack of facts is due to "blocking computation," not patching the theory to fit anomalies. They are not changing the core to fit data; they are building the ladder to reach the data.
  *   **Q5 (Risk):** Pass. Implicitly, if the simplified models don't converge, the theory fails.
  *   **Procedure Verdict:** **THEORETICALLY PROGRESSIVE, EMPIRICALLY STALLED.** (Hand-Off Case).
  *   **Secretary's Advice:** **Overrule the "Cut for Lack of Output" instinct. FUND.**
      *   *Why:* This is the specific case Lakatos designed for. A programme can be progressive theoretically before it is progressive empirically. The "ordered sequence" proves the Positive Heuristic is alive.
      *   *Action:* Fund, but with a **Strict Mid-Term Review**. The continuation is not based on "new facts" (which may still be impossible) but on "successful completion of the simplified model sequence."
      *   *Plain Language:* *"Your theoretical approach is sound, but empirical validation is pending. Funding is continued on the condition that the intermediate modelling milestones are met by month 30, as these are the necessary precursors to prediction."*

  ***

  # Summary of Overrules

  1.  **Programme A:** The procedure says **Cut**. The Panel will want to **Fund**. **Overrule the Panel.** Fund the people, not the science. Move them to a different grant mechanism.
  2.  **Programme B:** The procedure says **Not Science**. The Panel might see "Big Data" and want to **Fund**. **Uphold the Procedure.** Do not let "vibes about excitement" mask a lack of falsifiability.
  3.  **Programme C:** The procedure says **Hand-Off (Patience Required)**. The Panel will see "9 years no facts" and want to **Cut**. **Overrule the Panel.** This is the only one of the three that is actually doing hard science. Protect them from the demand for instant rationality.

  # Drafting the Plain Language Decision (Template)

  *Since you require a one-page plain language write-up, use this structure for the "Hand-Off" cases like C:*

  > **Decision:** Renew with Conditions.
  >
  > **Reasoning:** The Panel recognizes that your work addresses a fundamental problem that requires long-term theoretical development. While you have not yet produced a confirmed novel fact, your plan to build simplified models is a valid scientific strategy to reach that goal.
  >
  > **Condition:** We cannot fund indefinite theoretical work without empirical grounding. Therefore, renewal beyond the mid-term point depends on the successful completion of the three modelling milestones outlined in Work Package 2. If these models do not converge as predicted, the programme will be closed.
  >
  > **What this means:** We are betting on your plan, not just your past results. We need to see the ladder built, even if you haven't climbed it yet.

  This procedure gives you the backbone to defend Case C against the metric-hungry, Case A against the sentimental, and Case B against the hype. It isolates the value judgments so the panel owns them, rather than hiding them behind "scientific merit."
