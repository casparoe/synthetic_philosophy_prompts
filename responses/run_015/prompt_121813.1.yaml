answer: |-
  ### Structural Analysis of the Pattern

  You have identified a sophisticated and pervasive maneuver in contemporary metaethics and Quinean scholarship. To begin, let us dissect the architecture of the move you describe.

  The pattern relies on a **category shift** contingent on **provenance**.
  1.  **The Framework:** A naturalistic ontology (specifically the Quinean "web of belief") is established as the universal domain. In this domain, all claims are ostensibly continuous with empirical science and subject to revision.
  2.  **The Application (Other):** When analyzing the normative commitments of interlocutors (e.g., moral realists, religious ethicists, or rival metaethicists), the commentator applies the framework rigorously. These commitments are located *inside* the web. They are treated as empirical hypotheses, psychological states, or cultural artifacts open to scientific dissolution or revision.
  3.  **The Exemption (Self/Authority):** When analyzing the normative commitments required to sustain the framework itself (e.g., Quine's virtues of simplicity, tolerance, or the commentator's own commitment to naturalism), the framework is suspended. These commitments are relocated *outside* the web. They are re-categorized as "temperament," "pragmatic stance," "transcendental conditions," or "cultural background."
  4.  **The Result:** The naturalist framework consumes all rival normativity while remaining immune to consumption by its own criteria.

  ### Is There an Established Term?

  There is no single, canonical proper noun (like "The Gettier Problem" or "The Euthyphro Dilemma") that exclusively names this specific *rhetorical configuration* in Quine scholarship.

  However, it is a recognized instance of a broader class of problems discussed under the headings of **"The Normativity Problem for Naturalism"** (specifically the version articulated by Hilary Putnam in *The Many Faces of Realism* and John McDowell in *Mind and World*). Putnam argues that Quine treats logic as empirical for the realist but relies on it as normative for himself. Critics like Robert Brandom and Huw Price have also navigated this tension.

  While the *theoretical flaw* is often called "Self-Referential Incoherence" or "Performative Contradiction," these terms describe the *logical state* of the theory, not the *argumentative strategy* used by commentators to hide the flaw. The move you describe is a defensive maneuver designed to prevent the incoherence from becoming fatal.

  ### Proposed Coinage: Asymmetric Naturalization

  Since no precise term exists for this specific argumentative strategy, I propose we coin the term **Asymmetric Naturalization**.

  #### Definition
  **Asymmetric Naturalization** is a rhetorical and conceptual strategy in which a philosopher invokes a naturalistic framework to assign an immanent, empirical ontological status to the normative commitments of others, while simultaneously assigning a transcendent, non-empirical, or merely psychological status to the normative commitments required to sustain their own framework.

  #### Boundary Conditions (The Conceptual Carving)
  For a move to qualify as *Asymmetric Naturalization*, the following four conditions must be met:

  1.  **Universal Claim:** The philosopher posits a framework (e.g., the Web of Belief) that ostensibly applies to all cognitive content without exception.
  2.  **Immanentization of the Other:** The normative claims of opponents or subjects are categorized as objects *within* that framework (e.g., as empirical hypotheses, social constructs, or psychological dispositions).
  3.  **Transcendentalization of the Self:** The normative claims essential to the philosopher's own framework (e.g., values of simplicity, consistency, or tolerance) are categorized as *outside* that framework (e.g., as pre-cognitive temperaments, pragmatic choices, or cultural givens).
  4.  **Immunization:** This recategorization functions specifically to protect the philosopher's own norms from the revisionary or dissolving forces that the framework applies to the opponent's norms.

  ### Distinctions from Related Concepts

  To ensure conceptual precision, we must distinguish *Asymmetric Naturalization* from three nearby concepts: plain hypocrisy, the genetic fallacy, and ordinary inconsistency.

  #### 1. Versus Hypocrisy
  *   **Hypocrisy** is a moral or behavioral failure where an agent asserts a rule for others but knowingly violates it for themselves (e.g., "You must not lie," while lying). It implies bad faith or a contradiction between *action* and *precept*.
  *   **Asymmetric Naturalization** is a *categorical* maneuver, not necessarily a behavioral one. The commentator may sincerely believe that their own values *are* different in kind from their opponents'. They are not breaking the rule; they are arguing that the rule's domain of application does not cover them. It is a claim about *ontology*, not just behavior.
      *   *Edge Case:* If the commentator privately admits the values are the same but publicly claims they are different, it becomes hypocrisy. If they believe the categorical distinction is real, it is Asymmetric Naturalization.

  #### 2. Versus The Genetic Fallacy
  *   **The Genetic Fallacy** occurs when the truth or falsity of a claim is judged solely on its origin (e.g., "This moral belief is false because it evolved for survival").
  *   **Asymmetric Naturalization** does not necessarily judge the *truth* of the claim based on origin. Instead, it judges the *ontological status* of the claim based on origin. It argues: "Your belief is an empirical object *because* it comes from you; my belief is a transcendental condition *because* it comes from me (or my authority)." It is a shift in *category*, not necessarily a direct inference of falsity from origin.

  #### 3. Versus Ordinary Inconsistency
  *   **Ordinary Inconsistency** is a logical contradiction where proposition $P$ and $\neg P$ are both asserted within the same system and context.
  *   **Asymmetric Naturalization** avoids formal logical contradiction by shifting the *context of evaluation*. It asserts $P$ is type $A$ in Context 1 (the other's discourse) and $P$ is type $B$ in Context 2 (the theorist's discourse). It is a **scope restriction** rather than a direct contradiction. The inconsistency is *systemic* or *performative*, not propositional.

  ### The Edges of the Concept

  To fully carve this concept, we must identify where *Asymmetric Naturalization* stops and legitimate philosophical distinction begins.

  *   **Legitimate Distinction:** A philosopher may argue that *some* norms are empirical and *others* are transcendental based on the *content* of the norms (e.g., "Moral norms are empirical, logical norms are transcendental"). This is **not** Asymmetric Naturalization if the distinction applies universally. If the philosopher treats *all* logical norms (their own and their opponents') as transcendental, they are consistent.
  *   **The Edge:** The phenomenon occurs only when the *same type of norm* (e.g., a commitment to simplicity or tolerance) is treated as empirical when held by an opponent but transcendental when held by the theorist. The asymmetry must track the *speaker*, not the *content*.

  ### Scholarly Context & Utility

  In the context of your feature on metaethics, labeling this move **Asymmetric Naturalization** allows you to critique a specific defense mechanism used by Neo-Quineans (such as certain readings of ethical naturalists like Richard Boyd or Peter Railway, though they often try to avoid this).

  It highlights that the problem is not merely that naturalism struggles to account for normativity (the standard "Normativity Problem"), but that some commentators resolve the struggle by **normative offshoring**: they keep the "dirty work" of naturalization within the domain of the subject, while keeping the "clean tools" of the theorist outside that domain.

  This term provides you with a scalpel to separate sincere attempts to naturalize ethics from strategic maneuvers that use naturalism as a weapon against rivals while retaining a safe haven for one's own values. It identifies the move not as a simple error, but as a structural feature of a specific kind of metaethical argumentation.
