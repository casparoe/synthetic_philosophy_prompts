      *   *Check:* The "Jointly Unsatisfiable" section needs to be sharp.
      *   *Idea:* The trilemma: (1) Experience is unitary/synchronous, (2) Neural processing is asynchronous/distributed, (3) Experience is causally efficacious in real-time. You can't have all three.
      *   *Idea:* The Report/Experience trilemma. (1) Experience is distinct from report, (2) We only access experience via report, (3) Theories must be empirically falsifiable.

  8.  **Final Polish:**
      *   Ensure the tone is appropriate for a seminar participant (philosophically precise, not introductory).
      *   Make sure the Orwellian/Stalinesque distinction is handled correctly (Dennett's point is that the distinction might be empty).
      *   Verify the Libet handling (readiness potential vs. conscious will).

  9.  **Final Review against constraints:**
      *   Cases included? Yes.
      *   Distinctions maintained? Yes.
      *   Empirical findings? Yes.
      *   Prejudices flagged? Yes.
      *   Jointly unsatisfiable identified? Yes.
