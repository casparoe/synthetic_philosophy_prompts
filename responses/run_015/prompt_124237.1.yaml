answer: |-
  The separateness objection maps onto the *Mignonette* facts as a prohibition against treating the four men as a single vessel of utility. The anti-aggregation form denies that the survival of three outweighs the death of one because there is no social entity to absorb Parker's loss. The rights form forbids using Parker as a means to the others' survival. These forms diverge on the significance of selection. Anti-aggregation might theoretically tolerate a lottery where ex-ante risk is equalized, as the 'sum' is less clearly imposed on a specific individual without their prior stake. The rights form does not; it prohibits using a non-threatener regardless of how they were chosen. Thus, the indeterminacy of the victim tests the rights form more severely. The objection rules out the killing entirely, leaving only the option of shared starvation, because any selection mechanism that ends in sacrificial killing violates the boundary of the person. The anti-aggregation view worries about the math; the rights view worries about the boundary. On these facts, they converge on the outcome but differ on whether a fair lottery would mitigate the wrong.

  The theory is silent on procedure. It forbids the sacrifice but offers no algorithm for extreme scarcity where death is inevitable for all. A lottery respects equal claim but does not cure the violation of using a person for others' benefit; it merely distributes the risk of becoming a victim. The objection does not explain whether equalizing the risk legitimizes the subsequent use. Similarly, consent is theoretically relevant but practically absent. The objection relies on inviolability, which consent could override, but it provides no guidance on hypothetical consent or proxy agreement. It stops at the prohibition, leaving the agents with a dilemma it refuses to solve: respect separateness and die, or violate it and live. This silence reveals the objection is a constraint on action, not a guide for survival. It protects the person from the group but offers no resources for the group when the person cannot be saved without violating that protection.

  The case challenges the objection's scope. Formulated for societal distribution, applying it to a lifeboat tests whether separateness is a fundamental moral truth or a structural principle for institutions. If the objection collapses under existential pressure, it is merely a heuristic for stable societies. If it holds, it is absolute. The legal verdict rejects necessity, aligning with separateness by refusing to weigh lives. However, this vindication is ambiguous. The court worried about moral hazard and who holds the knife—utilitarian concerns about rule-following and authority—rather than the metaphysical status of Parker. The law protects the individual, but partly to preserve the system. Thus, the case shows the separateness objection captures a deep legal intuition, but the verdict's reasoning suggests that maintaining the distinction between persons is also instrumentally valuable for social order, blurring the line between deontological constraint and rule-utilitarian policy. The lifeboat does not prove the objection is purely about aggregation; it suggests the objection may ultimately rely on the very institutional stability it seeks to ground.
