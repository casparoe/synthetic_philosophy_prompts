answer: |-
  Here is a specification for a theory of perpetrator participation, designed to break the Browning–Goldhagen stalemate by focusing on causal adequacy regarding variation, escalation, and surplus violence.

  ### Desiderata for a Theory of Perpetrator Participation

  **1. The Intra-Unit Divergence Constraint**
  *   **Requirement:** The theory must explain why, under identical orders and immediate social pressure, a majority participated while a minority abstained, *without* casting the abstainers as moral saints or the participants as moral monsters.
  *   **Case/Consideration:** In Reserve Police Battalion 101, roughly 10–20% of men stepped out during the first shooting action. A theory claiming total social determinism cannot account for this variance; a theory claiming moral depravity cannot account for the refusal. The explanation must treat refusal as a plausible outcome of the same causal field (e.g., differing thresholds for disgust, prior socialization, or sheer luck in positioning) rather than an act of heroic resistance.

  **2. The Temporal Escalation Constraint**
  *   **Requirement:** The theory must account for behavioral change over time: specifically, the transition from acute physiological distress (vomiting, shaking) to efficient, routinized killing, and in some cases, to proactive seeking of killing opportunities.
  *   **Case/Consideration:** Men who were sickened by the first massacre at Józefów later participated willingly in the "harvest festivals" or deportation actions. A static theory (either "they were always killers" or "they were always victims of pressure") fails to model the habituation process, the numbing of empathy, or the shifting of reference groups that makes violence normative within the unit.

  **3. The Surplus Cruelty Constraint**
  *   **Requirement:** The theory must explain violence that exceeded operational necessity and explicit orders, including gratuitous humiliation, torture, or "fun" killing.
  *   **Case/Consideration:** Orders were to shoot or deport. They were not to beat victims beforehand, hunt stragglers for sport, or humiliate rabbis. If participation is driven solely by obedience or peer conformity, surplus violence is anomalous (it risks peer disapproval if it slows the work). If driven solely by ideology, it fits better, but must explain why *some* men engaged in it and others did not within the same ideological milieu.

  **4. The Macro-Micro Linkage Constraint**
  *   **Requirement:** The theory must distinguish between the *causes of the policy* (state-level ideology/strategy) and the *causes of the action* (individual trigger-pulling), while specifying the mechanism that connects them.
  *   **Case/Consideration:** The existence of the "Final Solution" does not mechanically cause a specific policeman to raise a rifle. A theory that conflates the two (e.g., "The state wanted it, so they did it") skips the transmission belt. The theory must identify the local incentives, norms, or beliefs that made the macro-policy actionable at the micro-level.

  **5. The Ideology Specificity Constraint**
  *   **Requirement:** The theory must explain why widespread antisemitic ideology resulted in mass killing in some contexts but not others.
  *   **Case/Consideration:** Antisemitism was pervasive in Germany and Europe for decades without industrialized slaughter. Goldhagen's "eliminationist antisemitism" risks being a constant that cannot explain a variable outcome. The theory must identify the *activation conditions* (war, dehumanization of the victim, authority sanction) that turn latent prejudice into active murder.

  **6. The Selection and Cost Constraint**
  *   **Requirement:** The theory must acknowledge that perpetrators were not selected for sadism, but also that opting out carried real (though non-lethal) social and career costs.
  *   **Case/Consideration:** The men of Battalion 101 were older reservists, not SS fanatics. However, the one man who demanded release was not shot; he was transferred and later promoted. "Duress" was not at gunpoint, but "social death" or career stagnation was a threat. A theory claiming "no choice" is empirically false; a theory claiming "free choice" ignores the heavy weight of conformity and careerism.

  **7. The Neutral Commander Counterfactual**
  *   **Requirement:** The theory must predict participation rates in a unit where the commander neither explicitly pressures participation nor explicitly permits exit (a neutral baseline).
  *   **Case/Consideration:** Browning's explanation leans heavily on Major Trapp's visible distress and his specific offer to step out (which created a shaming dynamic for those who stayed). If a commander gave the order coldly without offering an exit, would participation rise (no shaming option) or fall (no permission to refuse)? A robust theory cannot rely solely on the idiosyncrasies of Trapp's leadership style to explain the broader phenomenon.

  ***

  ### Conflict Analysis: The "Ordinary Men" Tension

  You asked to flag pairs that cannot be jointly satisfied, specifically regarding the "Ordinary Men" claim versus the need to explain surplus cruelty and refusers.

  **The Tension:**
  There is a genuine tension, but it stems from an **equivocation on "ordinary."**

  1.  **Ordinary as "Unselected":** If "ordinary" means *not screened for psychopathy or special ideological zeal* (i.e., a representative cross-section of the population), this is compatible with variation. A representative sample will contain a distribution of empathy, aggression, and conformity. This satisfies the **Intra-Unit Divergence Constraint**.
  2.  **Ordinary as "Homogeneous":** If "ordinary" implies *behavioral uniformity* (i.e., all men react identically to situational pressure), this contradicts the empirical record of refusers and sadists.

  **The Verdict:**
  The tension is **theoretical, not logical.** Browning often slides between these definitions.
  *   If he means "unselected," he must concede that *dispositional differences* (character) play a role in who becomes a refuser and who becomes a surplus-cruelty perpetrator. If he denies this, he cannot explain the variation.
  *   If he admits dispositional differences, he weakens the "Situationalism" claim that the situation *alone* is sufficient.
  *   **Surplus Cruelty:** This is the harder hurdle for the "Ordinary Men" thesis. If the men are statistically ordinary, the rate of sadistic behavior should match the base rate in the general population. Evidence suggests the rate of surplus cruelty in the East was higher than the base rate of sadism in peacetime Germany. Therefore, the situation must *activate* or *license* latent aggression. A strict "Ordinary Men" theory that denies situational amplification of aggression fails the **Surplus Cruelty Constraint**.

  **Incompatible Pair:**
  *   *Claim A:* "Situational pressure is sufficient to explain near-universal participation."
  *   *Claim B:* "There is no significant dispositional difference between perpetrators and the general population."
  *   *Conflict:* If the general population were placed in that situation, would near-universal participation occur? If yes, Claim B holds. If no (because the general population includes more refusers than Battalion 101 produced), then Claim A is false, or the Battalion was *not* ordinary (selection bias occurred).
  *   *Resolution:* You cannot hold that the situation is *solely* sufficient while maintaining the men were perfectly representative. The situation interacts with a specific subset of dispositions (e.g., high conformity, low empathy) that were overrepresented or activated.

  ***

  ### Scorecard

  **Christopher Browning (Situational/Social Psychology)**
  *   **Strengths:** Best fits the **Temporal Escalation** (habituation) and **Selection/Cost** constraints. Explains why "ordinary" people kill without needing to posit unique German evil. Handles the **Intra-Unit Divergence** well (peer pressure varies by individual tolerance).
  *   **Weaknesses:** Struggles with **Surplus Cruelty** (why go beyond orders if just conforming?). Weak on the **Neutral Commander Counterfactual** (relies heavily on Trapp's specific offer to explain the social dynamic). Often minimizes ideology to the point of failing the **Macro-Micro Linkage**.
  *   **Status:** High explanatory power for *participation*, low power for *enthusiasm*.

  **Daniel Goldhagen (Ideological/Cultural)**
  *   **Strengths:** Best fits the **Surplus Cruelty** and **Macro-Micro Linkage** constraints. Explains the willingness and the specific focus on Jews. Handles the **Neutral Commander Counterfactual** easily (ideology drives the act, not the commander).
  *   **Weaknesses:** Fails the **Intra-Unit Divergence** (if all were eliminationist antisemites, why did 20% step out?). Fails the **Ideology Specificity** constraint (cannot explain why this ideology killed *then* but not earlier). Risks turning refusers into "non-German" anomalies, violating the "no saints" rule.
  *   **Status:** High explanatory power for *violence style*, low power for *variation*.

  **Interactionist View (Situation + Character + Ideology)**
  *   **Strengths:** Satisfies all constraints by treating ideology as a *permissive* background condition, situation as the *trigger*, and character as the *modifier* (determining who refuses or escalates). Can handle the **Neutral Commander Counterfactual** (predicts lower participation than Trapp's unit, but higher than peacetime). Distinguishes **Explanation from Excuse** clearly (causes are multifactorial, responsibility remains individual).
  *   **Weaknesses:** Theoretically messy; harder to falsify because it can always adjust the weight of variables. Requires granular data on individual biographies often lost to history.
  *   **Status:** Most adequate, but least elegant. Requires abandoning the "mono-causal" comfort of both Browning and Goldhagen.
