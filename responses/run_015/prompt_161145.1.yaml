      *   *Correction:* Ensure the "promotion" point (the one man who left and was promoted) is integrated into the "Cost of Opt-Out" desideratum.
      *   *Correction:* The "Ideology without Killing" point is crucial for Goldhagen's weakness. Make sure that's highlighted.

  11. **Final Polish:** Check the "Explanation vs. Excuse" constraint. Ensure the language doesn't sound like it's minimizing the horror, but analyzing the mechanics. (e.g., use "participation" not "crime" in the theoretical sense).

  *(Self-Correction on the "Ordinary Men" tension)*: The prompt asks me to say whether it's a genuine tension or equivocation. I need to be decisive. It is an equivocation on the word "ordinary." If "ordinary" = "representative sample," variation is expected. If "ordinary" = "uniformly conformist," variation is impossible. I will argue it's an equivocation that hides a theoretical weakness in Browning regarding *surplus* violence.

  *(Self-Correction on the Counterfactual)*: The user wants the theory to predict for a commander who *neither pressures nor permits exit*. This is a "neutral baseline." Browning relies heavily on Trapp's specific distress and offer. Goldhagen relies on the men's will. This is a great stress test.

