answer: |-
  **Project Title:** The Intentional Stance in the Black Box: Tractability, Failure Modes, and Belief Attribution

  **Central Research Question**
  Can the instrumentalist entitlement to attribute beliefs to artificial systems be sustained against computational intractability by shifting the criterion of predictive power from successful output to specific patterns of systematic failure?

  **Project Summary**
  Daniel Dennett's instrumentalist justification for the intentional stance relies on a comparative claim: we are entitled to attribute beliefs and desires to a system only if doing so yields predictive power that cannot be achieved more cheaply via the design or physical stances. However, the emergence of frontier language models has broken the comparative mechanism required by this justification. For systems with hundreds of billions of parameters, the design stance is computationally intractable; no engineer can derive outputs from structure to check if the intentional story is doing unique work. Consequently, belief attributions are currently made by default rather than by comparison, violating the instrumentalist's own conditions for entitlement. Yet, these attributions remain pragmatically indispensable for engineers and users alike. This project proposes that the instrumentalist framework can be rescued not by scaling up our analysis of opaque models, but by scaling down to tractable systems where the test shifts from predicting success to predicting failure. I argue that a system genuinely governed by belief-like states should fail in belief-shaped ways (e.g., false belief errors) distinct from the failure modes of lookup tables or heuristic bags. By testing this hypothesis on small, transparent agents, I aim to restore the comparative condition essential to instrumentalism without requiring access to the weights of frontier models.

  **Limitations of Standard Positions**
  Current philosophical discourse regarding AI belief attribution rests on three positions, all of which leave the epistemic condition of entitlement unresolved. First, strict instrumentalism currently faces the intractability problem described above; it cannot validate the stance because the cheaper stances are unavailable for verification. Second, realist positions assert that these models possess genuine beliefs based on functional role or structural isomorphism, but this prematurely solves the ontological question without addressing the epistemic access problem—how we are justified in making the claim given the opacity of the system. Third, eliminativist or deflationary positions dismiss attributions as mere anthropomorphic pattern matching. While technically coherent, this view ignores the pragmatic reality that intentional vocabulary successfully guides intervention and debugging in ways non-intentional vocabulary does not. All three positions stall because they argue over the status of opaque systems where the necessary comparisons cannot be run. They leave open the possibility that the justification for the stance lies not in the system's scale, but in the specific topology of its errors.

  **Methodology and Timeline**
  This project employs a constructive philosophical method, utilizing lightweight machine learning implementations to test conceptual claims about belief attribution. The work will proceed over nine months as follows:

  *   **Months 1–2: Formalizing Failure Modes.** I will operationalize the distinction between "belief-shaped" failures and "heuristic" failures. This involves defining criteria where an intentional prediction anticipates an error based on false information (e.g., acting on a hidden variable) versus a structural error (e.g., distributional shift or overfitting). I will finalize the selection of testbed environments.
  *   **Months 3–5: System Implementation.** I will build or adapt three distinct types of tractable agents: a reinforcement learning agent in a GridWorld environment, a simple chess engine with a known evaluation function, and a symbolic planner. Crucially, these systems must be small enough that the design stance is runnable; I must be able to compute the output from the structure to serve as the control condition.
  *   **Months 6–7: Comparative Testing.** I will run experiments where I induce errors in these systems. I will then generate predictions using both the intentional stance (attributing beliefs about the environment) and the design stance (calculating based on weights/rules). I will measure which stance better predicts the specific nature of the failure.
  *   **Months 8–9: Analysis and Writing.** I will analyze whether the intentional stance offered unique predictive value regarding failures that the design stance missed or rendered too complex to compute efficiently. I will draft a dissertation chapter or journal article detailing whether the "failure test" restores the instrumentalist entitlement.

  **Significance of Approach**
  This route is preferable to arguing directly about contemporary large language models because it isolates the variable of tractability. Arguing about frontier models forces philosophy into a position of dependency on corporate opacity; we cannot verify the design stance, so the debate becomes speculative. By moving to small systems, I regain the ability to run the comparison Dennett requires. If the intentional stance proves uniquely efficient at predicting failures in these tractable systems, it suggests that the entitlement to use the stance does not vanish when the design stance becomes hard, but rather that the justification was grounded in the *type* of prediction (failure vs. success) all along. This bridges the gap between philosophical rigor and engineering practice, offering a criterion for belief attribution that is usable by the ML practitioners I work alongside without requiring them to solve interpretability problems first.

  **Possible Conclusions**
  There are two primary positive outcomes. First, if the intentional stance predicts failures more efficiently than the design stance in tractable systems, instrumentalism is vindicated and can be extended to opaque systems by analogy; the entitlement holds because the *kind* of predictive power is preserved. Second, if the design stance always outperforms or matches the intentional stance even in small systems, this suggests that current belief attributions are indeed unjustified shorthand, supporting a revisionary eliminativism. A negative result would be finding no distinct "belief-shaped" failures, implying that the intentional stance is merely a user-interface convenience with no grounding in system dynamics. The deciding factor will be whether there are cases where knowing the "belief" predicts the error faster than simulating the "mechanism."

  **Risks and Limitations**
  The primary risk is scope creep into engineering rather than philosophy. There is a temptation to spend the nine months optimizing agents rather than analyzing the attribution conditions. To mitigate this, I will restrict the complexity of the agents to only what is necessary to generate the failure modes; if the code becomes too complex to hold the design stance in mind, the test becomes invalid. A second risk is that the project yields a null result: if belief-shaped failures are indistinguishable from heuristic failures even in simple systems, the project fails to rescue instrumentalism. While this is a substantive philosophical conclusion, it would not provide the positive framework I aim to construct. Finally, there is a risk that the "failure test" proves too narrow, applying only to goal-directed agents and not to generative models, limiting the generalizability of the conclusion to the language models that prompted the inquiry. I will address this by ensuring at least one testbed involves generative tasks rather than pure planning.
