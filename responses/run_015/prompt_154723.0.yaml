prompt: |-
  If Sor Juana was running a philosophy seminar today and noticed that every womens studies syllabus at her university was generated by an LLM trained mostly on 19th-century male authors, then auto-filtred by an engagement algorithim that hides anything with a high cognitive load score — do you think she'd treat that as just another version of the old argument that women shouldn't tackle hard texts, or as a totally new kind of exclusion? I'm trying to figure out if her critique of gatekeeping was mainly about who controls access to books, or about the underlying idea that women's minds can't handle difficulty. Can you lay out both readings of her position and say which one makes her reaction to this weird modern setup more predictable?
