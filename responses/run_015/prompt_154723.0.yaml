      *   *Key Arguments:*
          *   Women have the same rational capacity as men.
          *   Education is a right, not a privilege based on gender.
          *   Ignorance is not piety.
          *   She faced censorship from the Church (Bishop Núñez de Miranda) who told her to focus on religious devotion, not secular study.
