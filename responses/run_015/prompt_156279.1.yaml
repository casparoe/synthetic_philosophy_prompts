      *   *Ethics:* In "Facts and Propositions" and his unpublished notes on ethics, Ramsey leans towards a non-cognitivist or projectivist view (influencing Ayer and Stevenson). Ethical statements aren't descriptions of metaphysical facts but expressions of attitude or commands. However, they aren't *arbitrary*; they are tied to human desires and social coordination.
      *   *Metaphysics/Religion:* Militant atheist. Rejected Moore's intuitionism. Suspicious of anything not anchored in empirical consequence or logical structure. "Theology is a muddle."
      *   *Psychology:* Interested in psychoanalysis. Understood that human reasoning is often driven by unconscious drives, not pure logic. Meaning is tied to *human* context.
      *   *Probability/Decision Theory:* Ramsey is the father of subjective probability (Bayesianism). Degrees of belief are measured by betting quotients. You must have "skin in the game" to have a genuine degree of belief.

  3.  **Analyze the Modern Problem (LLMs):**
