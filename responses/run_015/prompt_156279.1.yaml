      *   *The "Meaning" Test:* Meaning is tied to use and consequence. If an LLM says "suffering is bad," it doesn't mean it in the Ramseyian sense because it has no disposition to prevent suffering. It is simulating the *grammar* of value, not the *logic* of value.
      *   *The "Ethics" Test:* Ethics for Ramsey is about harmonizing desires and solving coordination problems. An LLM has no desires. It can simulate a solution, but it cannot participate in the *negotiation* of values.
