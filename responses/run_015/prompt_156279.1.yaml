      *   *Decision:* He would reject the notion that the *machine* contributes meaning, but might accept it as a tool *if* strictly subordinated to human action. However, given his emphasis on the *link* between belief and action, he would likely view the *discourse itself* generated by the machine as philosophically inert. The strongest Ramseyian position is that without the possibility of action/consequence, the "ethics" are nonsense. So, he would likely view the *phenomenon* of machine ethics as a category error, potentially dangerous.
