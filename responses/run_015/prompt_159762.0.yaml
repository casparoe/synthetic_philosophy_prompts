answer: |-
  You have stumbled onto one of the most persistent and serious objections to the view your mate is holding. You aren't missing a word; you are identifying the exact pressure point where "deflationary" theories of truth (the view your mate holds) struggle the most.

  Here is the breakdown of the concepts, the names, the boundary cases, and the verdict on your mate's theory.

  ### 1. The Established Name
  The phenomenon you are describing is standardly called **"Blind Truth Ascription"** (sometimes **"Generalized Truth Ascription"**).

  The specific problem this creates for your mate's view is known in philosophy as **"The Generalization Problem."**

  Your mate is arguing for **Deflationism** (specifically a version close to the **Disquotational Theory**). This view holds that "It is true that P" is logically equivalent to "P". The predicate "is true" is just a device for semantic ascent—it lets us talk about sentences rather than the world, but adds no substantive content.

  Your examples (the sealed report, the dead gran, the unread letter) are the standard counter-examples used to show that Deflationism is incomplete.

  ### 2. Why "Shorthand for a List" Fails Here
  Your mate claims these are just shorthand for a giant list of sentences (e.g., "Gran said $p$ and $p$, Gran said $q$ and $q$...").

  You are right to reject this. In logic, this is the difference between **Objectual Quantification** and **Substitutional Quantification**.
  *   **Your Mate's View (Substitutional):** To say "Everything Gran said is true" is to say "For any sentence $S$, if Gran uttered $S$, then $S$ is true." This requires the sentences to exist as linguistic items that *could* be substituted into the formula.
  *   **Your Intuition (Objectual/Propositional):** In your examples, the "things" might not exist as sentences yet (the sealed report is unopened), or ever existed as sentences (Gran's unspoken memories). Yet, you feel the claim "What Gran believed is true" has a truth value *now*.

  This suggests "true" is not operating on *sentences* (which can be listed), but on **propositions** (the abstract content of what is said/believed) or on a **relation to the world**.

  ### 3. The Concept That Fits Best: "Propositional Quantification"
  The concept that best captures what you are doing when you say "Whatever is in that letter is true" is **Propositional Quantification over an Opaque Domain**.

  *   **Propositional Quantification:** You are quantifying over "things that can be true" (propositions), not just "strings of words" (sentences).
  *   **Opaque Domain:** You do not have access to the specific instances you are quantifying over.

  **How this differs from "Shorthand":**
  If it were shorthand, the meaning would depend on your ability to eventually produce the list. If it is propositional quantification, the meaning depends on the **relationship between the source and reality**, regardless of whether anyone can list the claims.

  This aligns with a **Correspondence Theory of Truth**. When you say "Everything in the report is true," you are asserting that there is a mapping between the contents of the report and the state of the world, even if no human currently knows the mapping. "True" here is not grammatical decoration; it is a **functional placeholder for a successful relation to reality.**

  ### 4. Boundary Cases (As Requested)
  You asked for specific rulings on tricky cases to test the definition. Here is how a Realist (who agrees with your intuition) vs. a Deflationist (your mate) would handle them.

  **Case A: The Habitual Liar**
  *Scenario:* A known liar hands you a report. You say "Everything in here is true." Unknown to everyone, the liar actually told the truth this once.
  *   **Deflationist (Mate):** The statement "Everything in here is true" is just a commitment to assert the contents. Since you don't know the contents, you haven't really asserted anything. It's a void move.
  *   **Realist (You):** The statement was **correct all along**. The truth value depends on the *content's relation to the world*, not your justification for trusting the source. You were right, even if you were lucky.
  *   **Verdict:** Your intuition holds. The truth of the ascription is independent of the reliability of the source. "True" is tracking the world, not the speaker's credibility.

  **Case B: The Retrospective Falsification**
  *Scenario:* You say "Everything Gran said about 1947 is true." Twenty years later, diaries are found proving half of it was false.
  *   **Deflationist (Mate):** You meant "I endorse Gran's claims." At the time, you were justified. Later, you withdraw endorsement. The "truth" of your statement changed based on new evidence.
  *   **Realist (You):** Your original statement was **false all along**. You made a claim about reality (that Gran's memories matched 1947). That claim failed to match reality, even when you didn't know it.
  *   **Verdict:** This is the strongest evidence against your mate. If "true" were just decoration for "I believe this," your statement would have been *true* when you said it (because you believed it) and *false* later. But intuitively, we feel you were *mistaken* back then. This suggests "true" refers to a stable property that exists independently of our knowledge.

  ### 5. Does This Hurt Your Mate's View?
  Yes, but it doesn't kill it. It forces it to become much more technical.

  Deflationists (like Paul Horwich) have a reply. They argue that we can use **infinite conjunctions** logically, even if we can't write them down physically. They say: "To say 'All of Gran's claims are true' is just to accept the infinite set of conditionals: If Gran claimed $p$, then $p$."

  **The Weakness:** This reply works for logic, but it fails your "sealed report" test. If the report is sealed, there are no sentences $p$ available to form the conditional yet. The Deflationist has to say the truth ascription is meaningless until the report is opened. You feel it *is* meaningful now.

  **Conclusion:** Your intuition is philosophically robust. You are detecting that "true" sometimes functions as a **substantive property** (a successful link to reality) rather than a **logical operator** (a tool for assertion). Blind ascriptions are the primary evidence used by **Truth Realists** to argue that Deflationism is insufficient.

  ### 6. Confidence and Uncertainty
  **Confidence Level:** High (85%).
  I am confident in the terminology ("Blind Ascription," "Generalization Problem") and the mapping of your intuition to Truth Realism vs. Deflationism. These are standard positions in the philosophy of language.

  **Least Certain Part:**
  The one bit I am least sure about is whether a sophisticated Deflationist can fully rescue their view using **substitutional quantification** without secretly smuggling in Realist assumptions. Some modern deflationists argue that we can quantify over "possible sentences" or "propositions" without treating truth as a real property. Philosophers are still actively fighting over whether this is a valid move or a cheat. I am confident that *your* intuition aligns with Realism, but I cannot be 100% certain that Deflationism is definitively "wrong" rather than just "counter-intuitive in these cases," as the debate is technically unresolved in academic circles.

  **Summary:** You aren't missing a word. You are experiencing the **Generalization Problem**. "True" in these cases acts as a **variable binder over an unknown domain**, which implies truth is a substantive relation to reality, not just grammatical decoration. Your mate's view requires you to believe the statement is meaningless until the "list" can be produced; your intuition (that it has a definite truth value now) is the standard Realist objection to that view.
