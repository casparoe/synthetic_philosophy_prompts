      *   **Tone:** Academic, constructive, precise, suitable for a TA to use or learn from.

  2.  **Deconstruct the Student Answer:**
      *   *Claim 1:* "Simmballs cannot push the careenium around in any direct sense because all causation is bottom-up." (Physicalism/Causal Closure)
      *   *Claim 2:* "The careenium changes according to physical laws, and simmballs are just patterns we impose on those changes." (Epiphenomenalism/Patternism)
