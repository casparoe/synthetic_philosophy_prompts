      *   *Claim 7:* "If we reject downward causation entirely then computer science collapses, because programs obviously make computers do things." (Pragmatic argument/Category error)
      *   *Claim 8:* "Therefore simmballs do push the substrate, just not literally." (Conclusion)

  3.  **Evaluate Philosophical Content (Hofstadter/GEB Context):**
      *   *Careenium/Simmballs:* In GEB, Hofstadter uses the "Careenium" (a frictionless table with moving magnets/balls called "simms") to illustrate how high-level patterns (simmballs) emerge from low-level physics but seem to have causal power. Hofstadter's point is usually that high-level patterns *do* have causal efficacy in a meaningful sense, even if reducible to physics. He argues against strict reductionism that dismisses the higher level as "just" patterns.
      *   *Downward Causation:* This is the core tension. Can the pattern constrain the physics?
