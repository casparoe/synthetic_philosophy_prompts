answer: |-
  Here is a draft for your seminar handout. I've kept the tone conversational but tightened the distinctions. I think your instincts are spot-on: the speaker traded on ambiguity between a trivial truth and a substantive (and controversial) theory of explanation.

  ***

  # Handout: Parsing "Laws Just Describe"
  **Context:** The Humean slogan used to dismiss the explanatory asymmetry objection.
  **The Slogan:** *"Laws don't govern the events, they just describe them."*
  **The Claim:** Therefore, the worry that "instances explain the law, not vice versa" is a pseudo-problem.

  Below are the six precise readings of this slogan, verdicts on their truth, and whether they actually license the speaker's dismissal of your question.

  ### 1. The Anti-Personification Platitude
  *   **The Claim:** "Govern" is a metaphor. There is no cosmic legislator, no police force, and no sanctions for violation.
  *   **Verdict:** **Trivial / True.**
  *   **Does it solve the problem?** **No.**
  *   **Why:** Every anti-Humean (necessitarian, dispositionalist, etc.) agrees with this. They don't think there's a little guy in the sky enforcing $F=ma$. They think the *metaphysical grounding* runs from law to instance. Agreeing that "govern" isn't literal doesn't prove the grounding runs the other way (or doesn't exist).

  ### 2. The Linguistic Category Claim
  *   **The Claim:** Laws are linguistic or representational items (sentences, models, maps), not features of the world itself.
  *   **Verdict:** **False / Problematic.**
  *   **Does it solve the problem?** **No.**
  *   **Why:** This confuses *law-statements* with *laws*. Even Humeans (like Lewis) typically treat laws as true propositions or regularities, not just ink on paper. If laws are just sentences, then unformulated laws (laws that obtained before humans existed) become impossible. This view collapses into instrumentalism, which is stronger than Humeanism.

  ### 3. The Supervenience Claim
  *   **The Claim:** The truthmakers for law-propositions are exhausted by the distribution of particular local matters of fact (the "mosaic"). There is no extra "lawstuff."
  *   **Verdict:** **Substantive / True (for Humeans).**
  *   **Does it solve the problem?** **No.**
  *   **Why:** This *is* Humean Supervenience. It admits that the law depends on the instances. But your question was: *Given* this dependence, how can the law explain the instances? Asserting supervenience just restates the dependency that creates the asymmetry worry; it doesn't explain it away.

  ### 4. The Epistemic Claim
  *   **The Claim:** We infer laws *from* instances. Since inference runs instances $\to$ law, explanation cannot run law $\to$ instances without circularity.
  *   **Verdict:** **False / Confused.**
  *   **Does it solve the problem?** **No.**
  *   **Why:** This conflates epistemology (how we know) with metaphysics (what explains what). We infer the presence of a fire from smoke, but the fire explains the smoke, not vice versa. The direction of inference does not dictate the direction of explanation.

  ### 5. The Deflationary Modal Claim
  *   **The Claim:** Laws carry no nomic necessity and support no counterfactuals. "Law" is just a label for "regularity we are confident about."
  *   **Verdict:** **Substantive / Likely False.**
  *   **Does it solve the problem?** **No.**
  *   **Why:** This is a "strict regularity" view. Most sophisticated Humeans (Lewis, Loewer) want laws to support counterfactuals. If laws don't support counterfactuals, they can't do the scientific work we need them to do. Also, denying necessity doesn't automatically reverse the explanatory arrow.

  ### 6. The "Best System" (Compression) Claim
  *   **The Claim:** Explanation is not production; it is systematization. A law explains an instance by subsuming it under the most informative, concise summary of the mosaic (the Best System).
  *   **Verdict:** **Substantive / Needs Argument.**
  *   **Does it solve the problem?** **Yes (This is the only candidate).**
  *   **Why:** This redefines "explanation" to make it compatible with Humeanism. It says the asymmetry isn't about ontological pushing; it's about information compression. However, this requires defending the Best System Account (BSA) against the charge that summarizing isn't *explaining*. You can't just assert this in one line; it's a whole theory of explanation.

  ---

  ### The Test Case: The Deviant Micro-Event
  *Scenario: A world identical to ours except one particle swerves contrary to our best generalization.*

  | Reading | Does the Law Obtain? | Why? |
  | :--- | :--- | :--- |
  | **1. Platitude** | *Irrelevant* | Doesn't address truth conditions. |
  | **2. Linguistic** | *No* | If the sentence doesn't match the world, it's false. |
  | **3. Supervenience** | *Depends* | Depends on whether the mosaic still supports the generalization. |
  | **4. Epistemic** | *No* | We would infer a different law from the data. |
  | **5. Deflationary** | *No* | One exception falsifies a strict regularity. |
  | **6. Best System** | **Yes (Probably)** | If the generalization is still the best balance of simplicity/strength despite one outlier, it remains a law. |
  | **Governing View** | **No** | The event was nomically impossible; the world is different. |

  **The Trap:** The speaker's slogan "they just describe" sounds like **Reading 5** (Strict Regularity) to the audience, which makes the deviant event impossible for the law to survive. But to answer your explanation worry, he needs **Reading 6** (Best System), which allows the law to survive the deviant event *and* claim explanatory power via compression. He slid between these two without noticing.

  ---

  ### Where the Conflation Happens (For your board)
  You are right to worry about the word "describe." It is doing double duty:

  1.  **Semantic Sense:** A proposition *describes* the world if it is true of the world. (Compatible with the proposition being *made true* by the world).
  2.  **Ontological Sense:** A law *describes* the world if it is *nothing over and above* a summary of the world. (Implies the summary is derivative).

  The speaker uses **Sense 1** to make the claim sound obvious (of course true propositions describe the world!) but relies on **Sense 2** to block your explanatory objection (if it's just a summary, it can't explain the parts!).

  ### Teaching Tip for Thursday
  Put **Reading 6** at the center of the seminar.
  *   **The Humean Move:** Explanation is systematization (Loewer's "Package Deal").
  *   **The Anti-Humean Objection:** Systematization is epistemic; explanation is metaphysical. A map describes the terrain, but the terrain doesn't exist *because* it makes the map simple.
  *   **The Question for the Class:** Is "explanation" a feature of the world or a feature of our theories? If the Humean says the latter, have they changed the subject, or have they solved the problem?

  **Bottom Line:** The speaker's one-liner only works if you accept the Best System theory of explanation without argument. If you reject that, the asymmetry problem remains live.
