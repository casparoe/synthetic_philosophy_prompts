answer: |-
  **Exam Question: The Function of Standing**

  **Question 4 (25 Marks)**

  Consider the following case:

  > **Agent A** committed a serious moral violation two years ago. They were sanctioned, accepted the blame, underwent significant personal reform, and have not violated the norm since.
  > **Agent B** has never committed this violation. However, everyone knows this is only because the opportunity never arose; had the situation occurred, B would have committed the same violation A did.

  Both A and B now witness a third party committing this violation. A calls it out. B calls it out.

  A common intuition is that A has *more* standing to blame the third party than B does, despite A's past violation. However, a standard view suggests that standing is lost whenever the blamer is guilty of the same fault (hypocrisy).

  Write an essay that resolves this tension. Do not simply define hypocrisy. Instead, you must argue for a specific account of what **standing to blame** actually *is*. Is it a normative power (a right or authority to demand compliance), or is it an epistemic heuristic (a cue about the reliability of the judgment)? Use the case of A and B to demonstrate why your account is superior to the alternative. Your answer should explain why "clean hands" are insufficient for standing and what condition is necessary instead.

  ***

  **Model Answer**

  The puzzle of standing to blame is often obscured by a simplistic equation of standing with moral purity. If standing were merely a reward for clean hands, Agent B in the proposed case should possess more standing than Agent A. B has not violated the norm; A has. Yet, the intuition that A possesses greater moral authority suggests that standing is not about the history of one's actions, but about the current status of one's commitment to the moral community. To resolve this, we must reject the view that standing is primarily an epistemic heuristic regarding reliability and instead defend the view that standing is a normative authority grounded in sincere commitment to the values one invokes.

  The standard "clean hands" objection treats standing as a penalty for past violations. On this view, hypocrisy undermines standing because it is unfair to enforce a rule one has broken. This treats blame like a legal penalty where the enforcer must be unblemished. However, this view collapses when applied to the comparison between A and B. B's hands are clean, but only contingently. B's compliance is accidental, not principled. If standing were solely about compliance history, B would be the superior blamer. But B's blame rings hollow because it lacks weight; B is effectively saying, "Do not do this," while implicitly admitting, "I would do this if I could." This reveals that clean hands are insufficient for standing because compliance without commitment carries no normative force.

  One might object that standing is not normative but epistemic. On this view, accusations of hypocrisy are merely shortcuts to identify unreliable judges. We dismiss the hypocrite because their judgment is clouded by self-interest or bias. If we adopt this epistemic account, however, the intuition that A has *more* standing than B becomes difficult to sustain. Epistemically, B might actually be a clearer judge. A's past violation suggests a history of poor moral judgment, whereas B's lack of violation (however accidental) suggests no such track record. If standing were just about tracking the truth of the moral claim, B's lack of personal baggage might make them a more neutral observer. The fact that we still feel A has more authority indicates that standing is not about the accuracy of the judgment, but about the *right* to make the demand.

  Therefore, we must understand standing as a normative power derived from the blamer's relationship to the norm itself. Blame is not merely a description of wrongdoing; it is a demand for accountability. To have the standing to make this demand, one must demonstrate that one speaks for the norm, not merely for oneself. This is where A surpasses B. A's reform represents a costly signal of commitment. By accepting sanctions and changing their behavior, A has aligned their will with the moral law. A's blame carries the weight of experience and the authority of redemption. A is saying, "I broke this, I know the cost, and I affirm that you must not." B, conversely, cannot speak for the norm because B's will is not aligned with it. B's compliance is a matter of luck, not loyalty.

  The crucial distinction, then, is between *compliance* and *commitment*. The "clean hands" theory focuses on compliance. The normative authority theory focuses on commitment. Standing is lost in cases of hypocrisy not because the blamer sinned, but because the blamer demonstrates a lack of commitment to the norm they are invoking. A hypocrite who blames while secretly exempting themselves treats the norm as a weapon rather than a law. A, having reformed, no longer exempts themselves. B, being dispositionally willing to offend, implicitly exempts themselves conditionally. Thus, A has standing because A has earned the authority to represent the norm, whereas B is merely an accidental beneficiary of circumstance.

  Critics might argue that this view is too demanding, suggesting that only the reformed can blame. This is a strong consideration against the commitment account. If standing requires proof of reform, many victims of wrongdoing who have not had the opportunity to "reform" (because they never offended) might be silenced. Furthermore, focusing on the blamer's history can distract from the wrongdoer's action, turning the conversation into a scrutiny of the accuser rather than the accused. There is epistemic value in the "clean hands" rule: it prevents moral grandstanding and keeps the focus on the act, not the actor. If we allow reformed wrongdoers to claim superior standing, we risk creating a hierarchy of moral authority that privileges those who have sinned and repented over those who simply did good.

  However, this objection conflates *having* standing with *winning* the moral conversation. A may have the standing to blame, but that does not mean A's blame is immune to criticism. The epistemic concern is valid: we should always scrutinize the content of the blame. But scrutiny of content is different from denying the authority to speak. The reason A has more standing than B is that A's blame invites a dialogue about the norm's importance, validated by sacrifice. B's blame invites a dialogue about luck. In a moral community, we need authorities who validate norms through adherence, not just accident.

  In conclusion, the case of A and B demonstrates that standing cannot be reduced to a history of compliance or an epistemic cue for reliability. If it were, B would be the superior blamer. Instead, standing functions as a normative authority that tracks sincere commitment to the moral order. A possesses this authority through the costly process of reform, which aligns their will with the norm. B lacks it because their will remains misaligned, preserved only by circumstance. Recognizing this distinction prevents the concept of standing from becoming a mere tool for *tu quoque* derailment and restores it as a mechanism for identifying who is entitled to speak for the moral community.

  ***

  **Marking Scheme (25 Marks Total)**

  **1. Diagnosis of the A/B Intuition (5 Marks)**
  *   **A (5):** Explicitly identifies that the "Clean Hands" view predicts B > A, but argues the correct intuition is A > B. Uses this tension to drive the argument.
  *   **B (3):** Notes the intuition that A is better but fails to explain why this contradicts the standard "clean hands" view. Treats the case as a simple preference.
  *   **C/F (1):** Ignores the specific A/B comparison or claims B clearly has more standing without justification.

  **2. Rejection of Compliance as Sufficient (5 Marks)**
  *   **A (5):** Clearly distinguishes between *compliance* (not doing the thing) and *commitment* (willing the norm). Argues B fails on commitment despite compliance.
  *   **B (3):** States that B is "lucky" or "untested" but does not explicitly decouple compliance from moral authority.
  *   **C/F (1):** Equates standing directly with not having committed the act (the "motte" answer).

  **3. Normative vs. Epistemic Distinction (5 Marks)**
  *   **A (5):** **The Key Move.** Explicitly defines the two competing accounts (Normative Authority vs. Epistemic Reliability). Argues why the Epistemic account fails to explain why A > B (since B might be epistemically clearer).
  *   **B (3):** Mentions reliability or bias but treats it as synonymous with standing rather than a competing explanation.
  *   **C/F (1):** Conflates standing with truth-tracking (e.g., "A is right so A has standing").

  **4. Positive Account of Standing (5 Marks)**
  *   **A (5):** Proposes a coherent positive theory (e.g., Standing = Authority to demand compliance based on sincere endorsement of the norm). Explains how reform generates this authority.
  *   **B (3):** Offers a vague account (e.g., "Standing is about being moral") without explaining the mechanism of reform vs. luck.
  *   **C/F (1):** No positive account offered; only critiques of hypocrisy.

  **5. Steelmanning the Opposition (5 Marks)**
  *   **A (5):** **The Differentiator.** Honestly articulates the strongest reason to prefer the Epistemic/Clean Hands view (e.g., preventing distraction/grandstanding or protecting victims who haven't offended) before rebutting it.
  *   **B (3):** Mentions a counter-argument but dismisses it quickly or sets up a strawman (e.g., "Some people just want to be mean").
  *   **C/F (1):** No engagement with opposing considerations.

  **Grading Notes for TAs:**
  *   **The "A" Move:** The critical separator is **Criterion 3**. Students who treat standing as purely about "fairness" or "cleanliness" cannot get an A. They must identify that if standing were just about reliability (epistemic), B should win. They must argue standing is about *authority* (normative).
  *   **The "B" Trap:** Many students will write a competent essay arguing that "reform is good." This earns a B. To get an A, they must explain *why* reform grants authority in a way that luck does not, specifically by ruling out the epistemic alternative.
  *   **Citations:** Do not penalize for lack of names (e.g., Bell, Fritz, etc.). Reward clear conceptual articulation over name-dropping.
