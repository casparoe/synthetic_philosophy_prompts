  ### The Verdict
  She will say: **Not a revolution, and not incommensurable.** She will classify this as **normal science undergoing a methodological drift** (or perhaps a "specialty shift" akin to her view on molecular biology, though the shared journals make "normal science" more likely).

  ### The Rule She Is Running
  Based on her verdicts, her operational definition of a Kuhnian revolution relies on a **conjunctive rule** where **Sociological Rupture** is a necessary condition, overriding structural changes in standards or exemplars.

  1.  **Incommensurability** is tied primarily to **Taxonomic Reference** (Lavoisier = Yes; Plate Tectonics = No). Since your earthquake terms (*rupture, stress shadow*) retain their 1995 reference, she will rule out incommensurability immediately.
  2.  **Revolution** requires **Taxonomic/Standards Shift** PLUS **Sociological Rupture** (Crisis + Resistance + Conversion).
      *   *Plate Tectonics* counts as a revolution because, despite stable reference, there was a fierce battle over "which puzzles were worth a career" (Standards) and significant resistance from fixists (Sociology).
      *   *Neptune* and *Planck* fail because they were paradigm successes, not ruptures.
      *   *Molecular Biology* fails because it was a crystallization of a new specialty, not a fight within an old one.
      *   **Your Case** fails because, despite the shift in standards (prediction > mechanism) and exemplars (textbooks), the **smooth consensus** indicates no crisis and no resistance. For her, a revolution that looks like persuasion is not a revolution; it is just progress within a paradigm.

  ### The Reasoning
  She explicitly verbalizes the constraint that a revolution must "come after a crisis, meet resistance, and be more like conversion than persuasion." In your hypothetical, the transition is "smooth," "everybody agreed," and there was "no crisis."

  She will argue that the shift from mechanism to prediction is a **re-weighting of Kuhn's five values** (accuracy, consistency, scope, simplicity, fruitfulness). Normal science is permitted to re-weight values if it solves puzzles better ("the new models just worked better"). Because the *objects* (faults, earthquakes) remain ontologically stable (per your stipulation that terms refer to the same things) and the *community* did not fracture, the paradigm itself was not threatened. It was merely extended. She will likely say: *"If they didn't feel like they were living in a different world, they weren't."*

  ### The Follow-Up Case (For Q&A)
  To test whether **Crisis** or **Standards** is the true driver of her verdict, ask her about **The Cladistic Revolution in Systematic Biology (1960s–1980s)**.

  *   **The Case:** Biologists shifted from classifying organisms by overall similarity (phenetics) to classification by common descent (cladistics).
  *   **Similarities to your case:** Terms (*species, genus, taxon*) largely retained reference. Standards changed radically (similarity $\to$ ancestry). Textbooks were rewritten.
  *   **Difference from your case:** There was **intense resistance** and a perceived crisis in the field (the "systematics wars").
  *   **The Trap:**
      *   If she calls Cladistics a **Revolution** but your Earthquake case **Not**, she confirms **Crisis/Resistance** is the necessary condition (supporting my prediction).
      *   If she calls Cladistics **Normal Science**, she implies that even resistance isn't enough without *ontological* reference failure (which would undermine her Plate Tectonics verdict).
      *   If she calls your Earthquake case a **Revolution**, she admits **Standards/Exemplars** alone are sufficient, contradicting her verbal insistence on crisis.

  ### Confidence Levels
  *   **Verdict (Not Revolution):** 85% confident. Her verbal insistence on "crisis/resistance" is the most consistent constraint across her seminar comments.
  *   **Rule (Sociological Rupture is Necessary):** 80% confident. This fits Lavoisier, Plate Tectonics, and Neptune, but relies on interpreting Plate Tectonics as having sufficient "resistance" (which history supports).
  *   **Follow-Up Utility:** 90% confident. Cladistics is a standard HPS test case that cleanly separates sociological friction from semantic reference.

  ### The Weakest Claim
  **I would least want to defend the claim that she will not argue the *objects* changed ontologically.**
  Even if you stipulate reference stability, she holds that "the paradigm is what makes a field's objects available." If she argues that a "statistical seismic hazard" is a fundamentally different *kind of object* than a "physical fault rupture," she could override the "No Crisis" rule and declare it a revolution based on ontology alone. This is the one place her "unembarrassed Kuhnianism" might trump her sociological criteria.

  ***

  *If she is wrong, it is because smooth ontological shifts are still revolutions.*
