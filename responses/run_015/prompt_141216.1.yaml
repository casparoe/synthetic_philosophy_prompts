prompt: |-
  I'm a philosophy professor and two things have collided this year. First, I got voluntold onto the university's long-range planning committee: four times a year we're asked for a one-page outside view on some 20-to-30 year question (will there still be a residential undergraduate model here, will the current endowment spend rule survive, will this campus still be doing the thing it's doing), and the page has to end in either a number or an explicit refusal, because the dean signs it and the dean will not sign "it depends." Second, I teach an undergrad seminar where students write their own twenty-year forecasts about institutions and I have to grade the reasoning, not the outcome — which is basically the same skill, and I'd like to use the same sheet for both.

  What I want from you is the sheet. Not the forecasts. And definately not a reading list: I've read around in this stuff enough to know I'd just be handed a pile of names I can't follow up on. I want a procedure that a committee of non-specialists — me, someone from facilities, an economist who is polite about the rest of us, and a rotating faculty member — can actually run in about an hour per question, working from what a smart generalist already knows plus maybe an hour in the library. Give me the questions in order; what counts as an answer to each that's good enough to move on; where the procedure returns "no number, stop"; and where it has to stop and hand the question over as a values call rather than a factual one. Then run it on three of our real questions, below.

  The conceptual work is in the translation, and there are five places I keep getting stuck. I'd like you to turn each into a step or tell me it isn't load-bearing:

  - The unit question. Before any counting, what exactly has to stop being true for the forecast to have failed? I think committees skip this and end up forecasting the survival of a name rather than a practice.
  - The continuity convention. Durations of past empires are partly an artifact of how we count: republic into empire into successor state, a change of dynasty or constitution, a rump that keeps the name. I want a step that forces the committee to recompute the base rate under two different identity conventions and see whether the median actually moves, and a rule for what to do when it does.
  - The class is selected on the outcome. My half-baked version: our list of past empires is a list of polities that were good at being remembered, and short-lived ones leave less behind, so the class is filtered by the very variable we're measuring. If that's right, make it a check; if it's a confusion, say so.
  - Hazard shape. Constant-hazard (memoryless), infant mortality then consolidation, or the "the longer it's lasted the longer it'll last" shape — these give wildly different medians for remaining life, and I suspect small historical samples can't distinguish them. I want the step to say what to assume when the data can't decide, and to makr that it's an assumption.
  - Double counting. The story about why *we* are different is often information already reflected in the class. But sometimes it isn't — a mechanism genuinely absent from all the historical cases. I need a usable rule for how far to shrink toward the base rate, not just the reminder that we're overconfident.

  Flag clearly the points where judgment can't be eliminated and where a step is a judgment call dressed up as procedure — I'd rather hand the dean three honest asterisks than a fake algorithm.

  Run it on: (1) the committee's actual question, whether there will still be something recognisably like the current European Union in 2050; (2) whether my own philosophy department will still be a free-standing department in 2045 — this one is mine and I already dread where the outside view goes; (3) a student's forecast that there will be no war between nuclear-armed states this century, where I suspect the honest output is a refusal or an interval too wide to be useful, and I want to see what a clean refusal looks like on the page.

  Finally: tell me what this procedure cannot do. Where will it misfire on the questions a university actually asks, and what should we do on those?
reasoning: |-
  Here's a thinking process that leads to the suggested forecasting procedure:

  1.  **Analyze the Request:**
      *   **User:** Philosophy professor, member of a university long-range planning committee, teacher of an undergrad seminar on forecasting.
      *   **Task:** Create a one-page grading/forecasting procedure (a "sheet") for estimating 20-30 year institutional futures. It needs to be usable by a committee of non-specialists in about an hour. It must end in a number or an explicit refusal.
      *   **Constraints:** No reading lists. Focus on procedure/questions. Must address five specific conceptual sticking points (Unit Question, Continuity Convention, Selection Bias, Hazard Shape, Double Counting). Must identify where judgment is unavoidable.
      *   **Test Cases:** Run the procedure on three specific questions:
          1.  EU existence in 2050.
          2.  Philosophy department existence in 2045.
          3.  No war between nuclear-armed states this century.
      *   **Final Requirement:** Explain limitations (what the procedure cannot do).

  2.  **Deconstruct the Five Sticking Points (The "Conceptual Work"):**
      *   *Unit Question:* Define failure conditions. (Is it the name? The function? The structure?)
      *   *Continuity Convention:* How do we count identity over time? (Rome vs. Byzantium). Need to test sensitivity to this definition.
      *   *Selection Bias:* Survivorship bias in reference classes. (We only remember long-lasting empires).
      *   *Hazard Shape:* Is the risk constant, decreasing, or increasing over time? (Memoryless vs. Aging).
      *   *Double Counting:* Inside view vs. Outside view. When does specific info actually update the base rate?

  3.  **Drafting the Procedure (The "Sheet"):**
      *   *Goal:* One page, actionable, leads to Number or Refusal.
      *   *Structure:*
          1.  Define the Unit (Failure Condition).
          2.  Select Reference Class & Check Bias.
          3.  Determine Hazard/Duration (Base Rate).
          4.  Adjust for Specifics (Inside View).
          5.  Final Output (Number or Refusal).
      *   *Integrating the 5 Points:*
          *   Step 1 addresses Unit Question.
          *   Step 2 addresses Continuity Convention & Selection Bias.
          *   Step 3 addresses Hazard Shape.
          *   Step 4 addresses Double Counting.
          *   Throughout: Flag judgment calls.

  4.  **Refining the Steps (Iterative Process):**
      *   *Step 1 (Unit):* Need a "Binary Test." If X happens, is it dead? Yes/No.
      *   *Step 2 (Reference Class):* Need to pick a class (e.g., "Political Unions," "University Departments"). *Crucial:* Apply the Continuity Convention check. Does changing the definition change the survival rate? If yes, flag it. *Crucial:* Check Selection Bias. Are we looking at survivors only?
      *   *Step 3 (Base Rate/Hazard):* Calculate median lifespan. *Crucial:* Hazard Shape. If data is thin, assume Constant Hazard (exponential) unless there's a strong reason for "aging."
      *   *Step 4 (Adjustment):* Inside view factors. *Crucial:* Double Counting rule. Only adjust if the factor is *uncorrelated* with the reference class failure modes. Shrinkage rule (e.g., move 50% toward base rate).
      *   *Step 5 (Output):* Probability % or "Refusal." Refusal criteria: Definition too vague, Reference Class empty, Hazard unknowable.

  5.  **Running the Test Cases:**

      *   *Case 1: EU in 2050 (26 years from now).*
          *   Unit: Treaty framework + Parliament + Free movement?
          *   Class: Post-WWII supranational bodies? Historical federations?
          *   Hazard: Political unions often fracture.
          *   Adjustment: Economic interdependence (high).
          *   Output: High probability but not 100%.

      *   *Case 2: Philosophy Dept in 2045 (21 years from now).*
          *   Unit: Free-standing department (not merged into Humanities).
          *   Class: Humanities depts at R1 universities.
          *   Hazard: Enrollment decline, admin consolidation.
          *   Adjustment: This specific university's endowment vs. national trend.
          *   Output: Lower probability. The "Outside View" is grim for humanities.

      *   *Case 3: No Nuclear War this Century.*
          *   Unit: Direct kinetic conflict between nuclear states.
          *   Class: Dyads of nuclear states? Historical great power wars?
          *   Hazard: Low frequency, high impact. "Black Swan" territory.
          *   Issue: Selection Bias is huge (we only have one history). Hazard shape is unknown (learning vs. proliferation).
          *   Output: Likely a Refusal or extremely wide interval. The prompt asks to see what a "clean refusal" looks like.

  6.  **Addressing the "What This Cannot Do" Section:**
      *   Black Swans (unknown unknowns).
      *   Reflexivity (the forecast changes the outcome).
      *   Values/Normative shifts (what if "university" means something different?).
      *   Precision illusion (don't trust 73% vs 74%).

  7.  **Tone and Style:**
      *   Academic but pragmatic.
      *   Respectful of the user's expertise (philosophy professor).
      *   Direct, no fluff.
      *   Adhere to the "one-page" spirit (though the explanation will be longer, the core sheet must be distinct).

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "Continuity Convention" specifically? *Fix:* Make sure Step 2 explicitly asks to re-calculate under a "strict" vs. "loose" identity definition.
      *   *Check:* Did I address "Double Counting"? *Fix:* In Step 4, add a "Correlation Check." If the reason for optimism is common to all survivors in the reference class, it's already baked in.
      *   *Check:* Is the Refusal criteria clear? *Fix:* Define specific "Stop Conditions."
      *   *Check:* The user wants the *sheet* first, then the *run*.
      *   *Check:* The user wants to know where judgment is disguised as procedure. *Fix:* Add "Asterisk Alerts" in the margin or text.

  9.  **Final Polish:**
      *   Ensure the distinction between the "Sheet" (the tool) and the "Commentary" (the explanation) is clear.
      *   Make sure the "Refusal" on the Nuclear War question looks like a valid administrative output, not just "I don't know."
      *   Ensure the Philosophy Dept forecast feels realistic (outside view is usually harsher than inside view).

  10. **Final Output Structure:**
      *   Introduction (acknowledging the constraints).
      *   The Procedure (The Sheet).
      *   The Three Runs (EU, Phil Dept, Nuclear War).
      *   Limitations (What it cannot do).

  *(Self-Correction on the Nuclear War case)*: The prompt asks for a "clean refusal." I need to make sure the procedure *allows* for a refusal and that the output looks like something a Dean can sign (e.g., "Probability Unassignable due to Reference Class Failure").

  *(Self-Correction on Hazard Shape)*: The user suspects small samples can't distinguish hazard shapes. I need to codify a default. Default to Constant Hazard (Memoryless) for institutional survival unless there is a specific "aging" mechanism (like infrastructure decay) or "learning" mechanism (like nuclear deterrence).

  *(Self-Correction on Double Counting)*: The rule needs to be quantitative enough to be useful but qualitative enough to be honest. Suggest a "Discount Factor" for inside-view information.

