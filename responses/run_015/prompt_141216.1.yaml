answer: |-
  Here is the procedure, designed to fit on a single page, followed by the three test runs and the limitations analysis.

  ### THE ONE-PAGE SHEET: Institutional Survival Protocol (ISP-1)

  **Instructions:** Complete in order. If any **STOP** condition is met, terminate and output "Refusal." All steps require consensus; if consensus fails, mark with an asterisk (*).

  **1. DEFINE THE UNIT (The Failure Condition)**
  *   **Question:** What specific observable state constitutes "death" for this entity?
  *   **Requirement:** Must be binary. (e.g., "No longer collects taxes" vs. "Less popular.")
  *   **Continuity Check:** Re-evaluate the definition under two conventions:
      *   *Strict:* Name + Constitution + Personnel must persist.
      *   *Loose:* Function + Power must persist (regardless of name/structure).
  *   **Move On:** If the median survival rate of the reference class (Step 2) shifts by >20% between Strict and Loose, **flag as High Sensitivity**. Proceed with the definition that matches the Dean's operational concern.
  *   **STOP:** If the committee cannot agree on a binary failure state.

  **2. SELECT REFERENCE CLASS & CHECK BIAS**
  *   **Question:** What is the narrowest class of similar entities with known death dates? (N=10 minimum).
  *   **Selection Bias Check:** Is this class filtered by its own longevity? (e.g., "Ancient Universities" excludes all the ones that closed in 1400).
  *   **Correction:** If yes, widen the class to include "failed starters" or reduce the base survival rate by 50%.
  *   **Move On:** If a class with known mortality data exists.
  *   **STOP:** If the entity is truly unique (N<5 even with widening).

  **3. ESTIMATE BASE RATE (Hazard Shape)**
  *   **Question:** What is the median lifespan of the reference class?
  *   **Hazard Assumption:**
      *   *Default:* Constant Hazard (Memoryless). Probability of death in year *t+1* is independent of age.
      *   *Exception:* If a specific "aging" mechanism exists (e.g., infrastructure decay), use Increasing Hazard. If a "learning" mechanism exists (e.g., nuclear deterrence), use Decreasing Hazard.
      *   *Rule:* If data is too thin to distinguish shapes, **assume Constant Hazard**. Mark with asterisk (*).
  *   **Calculation:** $P(Survival) = 0.5^{(Years / Median Lifespan)}$.
  *   **Move On:** If a median lifespan can be calculated.

  **4. ADJUST FOR SPECIFICS (Inside View)**
  *   **Question:** What specific factors make *this* instance stronger/weaker than the class average?
  *   **Double-Counting Rule:** Does this factor exist in the *survivors* of the reference class?
      *   *Yes:* It is already baked into the base rate. **Ignore.**
      *   *No:* It is new information. **Adjust.**
  *   **Shrinkage Rule:** Adjust the probability from Step 3 toward the specific evidence, but cap the movement at 50% of the distance. (Prevents overconfidence).
  *   **Move On:** If adjustments are based on verifiable mechanisms, not vibes.

  **5. OUTPUT**
  *   **Format:** A single percentage (0-100) OR "Refusal: [Reason Code]."
  *   **Reason Codes:**
      *   *R1:* Unit Undefined (Step 1).
      *   *R2:* No Reference Class (Step 2).
      *   *R3:* Hazard Indeterminate (Step 3).
      *   *R4:* Values Conflict (Step 4 adjustment requires normative judgment).

  ***

  ### RUN 1: The European Union (Exist in 2050?)
  *Time horizon: 26 years.*

  1.  **Unit:** *Strict:* Treaty of Lisbon framework + Eurozone + Parliament. *Loose:* A pan-European political body with trade/free movement authority.
      *   *Sensitivity:* High. Strict definition fails if one major state exits; Loose survives. Committee selects **Loose** (matches Dean's concern about "market access/stability").
  2.  **Reference Class:** Post-1945 Supranational Political Unions (e.g., USSR, EEC, OAS, Arab Federation).
      *   *Bias Check:* High survivorship bias in "current" unions. Widened to include failed integration attempts (e.g., Mali Federation, United Arab Republic). N=18.
      *   *Correction:* Applied 50% discount to initial survival optimism.
  3.  **Base Rate:** Median lifespan of political unions is ~45 years. EU is currently ~70 years old.
      *   *Hazard:* **Constant** (Political fractures are memoryless; age doesn't immunize against populism).
      *   *Calculation:* $0.5^{(26/45)} \approx 67\%$.
  4.  **Adjustments:**
      *   *Factor:* High economic interdependence.
      *   *Double-Count Check:* Did survivors of the reference class also have high interdependence? Yes. **Ignore.**
      *   *Factor:* Rising nationalist parties in member states.
      *   *Double-Count Check:* Is this unique? No, common in union failures. **Ignore.**
      *   *Factor:* Institutional rigidity (harder to exit than enter).
      *   *Double-Count Check:* Unique to EU structure vs. historical unions. **Adjust.**
      *   *Shrinkage:* Move 50% from 67% toward higher confidence. New estimate: 80%.
  5.  **Output:** **80%**

  ***

  ### RUN 2: Philosophy Department (Free-standing in 2045?)
  *Time horizon: 21 years.*

  1.  **Unit:** *Strict:* Budget line item "Department of Philosophy" + Tenure lines + Major. *Loose:* Philosophy instruction exists within a College of Humanities.
      *   *Sensitivity:* Critical. Committee selects **Strict** (matches Dean's concern about resource allocation).
  2.  **Reference Class:** Humanities Departments at R1 Universities (1970–2020).
      *   *Bias Check:* We are looking at current depts. Need data on merged/closed depts. Data available via AAUP archives.
      *   *Correction:* Class includes "merged into General Studies" as death.
  3.  **Base Rate:** Median survival of free-standing humanities depts in budget-contracting environments is ~35 years. Dept is 60 years old.
      *   *Hazard:* **Increasing.** (Enrollment pressure compounds; once a decline starts, it rarely reverses).
      *   *Calculation:* Adjusted for increasing hazard, effective remaining median is ~15 years. $P(Survival) \approx 35\%$.
  4.  **Adjustments:**
      *   *Factor:* This university has a large endowment.
      *   *Double-Count Check:* Did survivors of the reference class have large endowments? Often yes. **Partial Ignore.**
      *   *Factor:* Student enrollment in intro courses is stable.
      *   *Double-Count Check:* This is the leading indicator of failure. It is *not* baked into the historical median which aggregates all schools. **Adjust.**
      *   *Shrinkage:* Move 50% from 35% toward higher confidence. New estimate: 55%.
  5.  **Output:** **55%** * (Asterisk due to Increasing Hazard assumption).

  ***

  ### RUN 3: No War Between Nuclear States (This Century)
  *Time horizon: 76 years.*

  1.  **Unit:** Direct kinetic conflict between two recognized nuclear-armed states.
  2.  **Reference Class:** Dyads of Nuclear-Armed States (1945–Present).
      *   *Bias Check:* **Critical Failure.** The sample size of "wars that happened" is zero. The sample size of "dyads" is small (N~25).
      *   *Selection Bias:* We are observing the *success* of deterrence. We cannot observe the failures (they end the observation).
  3.  **Base Rate:**
      *   *Hazard:* **Indeterminate.** Is deterrence learning (Hazard decreases)? Or is proliferation/accident risk compounding (Hazard increases)?
      *   *Data:* 0 events in 80 years. Statistical confidence is impossible.
  4.  **Adjustments:**
      *   *Factor:* AI/Cyber warfare changes command and control.
      *   *Double-Count:* This is a structural break. Historical base rate is irrelevant.
  5.  **Output:** **Refusal: R3 (Hazard Indeterminate)**
      *   *Note to Dean:* "The historical record contains no instances of the failure mode we are measuring. Any number generated would be an artifact of the mathematical model, not the data. We cannot assign a probability."

  ***

  ### WHERE THE PROCEDURE MISFIRES (Limitations)

  You asked for honest asterisks. Here is where the ISP-1 sheet will lie to you, and how to handle it.

  **1. The "Values Drift" Problem (Normative Failure)**
  *   **The Misfire:** The procedure forecasts the survival of *structures*, not *meanings*. A university might survive 2050 (buildings, endowment, degrees) but cease to be a "university" in the normative sense you care about (e.g., if tenure is abolished, or if education becomes purely vocational).
  *   **The Fix:** The Sheet cannot catch this. You must add a verbal annex to the Dean for any forecast >20 years: *"This probability applies to the legal entity, not the mission."*

  **2. The Reflexivity Trap**
  *   **The Misfire:** Publishing the forecast changes the outcome. If you tell the Dean the Philosophy Dept has a 45% chance of survival, the Dean might cut the budget *now* (self-fulfilling) or pump money in to prove the model wrong (self-negating).
  *   **The Fix:** Step 5 Output should be marked **"Confidential / Planning Use Only."** Do not publish outside-view probabilities to the stakeholders being forecasted.

  **3. The Black Swan Blindness**
  *   **The Misfire:** Step 3 (Hazard Shape) assumes the future looks like the past. It cannot account for technological singularities, climate collapse, or pandemics that render the reference class obsolete.
  *   **The Fix:** This is why the **Refusal** option is load-bearing. If the committee feels the ground is shifting beneath the reference class (e.g., "Will residential college survive the Metaverse?"), you must trigger **R3**.

  **4. The "Polite Economist" Problem**
  *   **The Misfire:** Step 4 (Adjustments) relies on consensus. In a committee, the loudest expert (usually the economist or the administrator) will dominate the "Inside View" adjustment, swamping the Base Rate.
  *   **The Fix:** Enforce the **Shrinkage Rule** rigidly. No adjustment can move the probability more than 50% of the distance from the Base Rate. This mathematically caps the influence of the "Polite Economist's" story.

  **5. The Fake Precision of the Number**
  *   **The Misfire:** The Dean wants a number. The Sheet gives "55%". The Dean treats 55% as distinct from 50%. It isn't. The error bars on these estimates are ±20% minimum.
  *   **The Fix:** Round all outputs to the nearest 10%. (55% becomes 60%). This visually signals the uncertainty to the administration without needing a lecture on confidence intervals.

  ### SUMMARY FOR THE DEAN
  When you sign these, you are not signing a prediction. You are signing a statement that **the committee has checked its own biases.**

  *   **EU:** 80% (Stable structure, high inertia).
  *   **Phil Dept:** 60% (Structural headwinds, local buffer).
  *   **Nuclear War:** Refusal (Data insufficient for calculation).

  The value of this exercise is not knowing the future; it is forcing the committee to admit when they are guessing (Nuclear War) versus when they are calculating (EU). That distinction is the only thing worth putting in writing.
