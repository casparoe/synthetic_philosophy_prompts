answer: |-
  (a) Two logistics firms share a network. Each round, they choose: **Integrate** (Cooperate), **Compete** (Defect), or **Independent** (Withdraw). Independent operations guarantee a modest profit regardless of the partner, mimicking defection's impact on the partner but capping own risk.

  | | Integrate | Compete | Independent |
  | :--- | :---: | :---: | :---: |
  | **Integrate** | 3, 3 | 0, 5 | 0, 2 |
  | **Compete** | 5, 0 | 1, 1 | 1, 2 |
  | **Independent** | 2, 0 | 2, 1 | 2, 2 |

  Inequalities: $T(5) > R(3) > P(1) > S(0)$; $2R(6) > T+S(5)$. Withdrawal payoff $E(2)$ satisfies $P < E < R$.

  (b) Let continuation probability $\delta = 0.6$. Without Withdrawal, Grim Trigger sustains cooperation. Value of cooperation $V_C = 3/(1-0.6) = 7.5$. Value of deviation $V_D = 5 + 0.6(1)/0.4 = 6.5$. Since $7.5 > 6.5$, the incentive constraint holds; mutual Integrate is sustainable.

  (c) With Withdrawal available, no subgame-perfect equilibrium (SPE) sustains perpetual cooperation at $\delta = 0.6$. In any SPE, a player's continuation value must exceed their minmax payoff. Since Independent guarantees $E=2$ regardless of the opponent, the minmax payoff is 2, not $P=1$. To sustain cooperation, the incentive constraint requires $R \ge (1-\delta)T + \delta V_{punish}$. Since $V_{punish} \ge E/(1-\delta)$, this implies $3 \ge 0.4(5) + 0.6(2) = 3.2$. This is false. Because Withdrawal puts a floor on punishment severity, the threat required to deter defection is not credible. Caveat: This holds for standard discounted SPEs; it assumes players cannot commit to irrationally low punishment payoffs below $E$.

  (d) General condition for cooperation: $\delta \ge \frac{T-R}{T-E}$. If $E=P$, this reduces to the standard $\delta \ge \frac{T-R}{T-P}$. With $E=2$, the threshold rises to $\delta \ge 0.67$. If Withdrawal is one-time, punishment can dip to $P$ once, potentially sustaining cooperation for lower $\delta$. If Withdrawal costs $c$, effective $E' = E-c$; if $E' \le P$, deterrence returns. If observable, retaliation cannot reduce the withdrawer below $E$ by definition; deterrence only returns if the structure allows pushing the withdrawer below $E$.

  (e) Asymmetric variant: Only Firm 1 can Withdraw. Firm 1's minmax is $E=2$; Firm 2's is $P=1$. Firm 1's incentive constraint fails ($3 < 3.2$), so Firm 1 defects or withdraws. Firm 2 plays Compete (best response to Withdraw). Outcome: (Independent, Compete), payoffs (2, 1). Firm 1 is worse off than under cooperation (2 vs 3). The defensive option destroyed the surplus it was meant to protect.

  (f) The working feature is that withdrawal raises the minmax payoff, shrinking the surplus available for punishment. Objection 1: "Partners can punish the withdrawer." Reply: Withdrawal's payoff $E$ is structural; retaliation cannot reduce it below $E$ without changing the game. Objection 2: "Trust obviates the need to withdraw." Reply: The model assumes no binding contracts; the option exists as capacity, not intent, and its mere availability alters equilibrium constraints.

  (g) In evolution, strategies relying on punishment fail; mutual Withdrawal ($E$) replaces mutual Defection ($P$) as the fallback. The shadow-of-the-future story requires qualifying: future interaction promotes cooperation only if parties remain vulnerable to each other's sanctions. Hedging severs this link.
