  Here is the psychoanalysis and decision-theoretic breakdown of your roommate's likely behavior.

  ### 1. The Prediction
  Based on the context of your class (Buchak's REU) and the structure of the upcoming test (Allais Paradox), you should predict she will exhibit the **famous Allais pattern**:

  *   **Choice 1:** She will take **$1 Million for sure** (rejecting the 89%/$1M + 10%/$5M + 1%/$0 gamble).
  *   **Choice 2:** She will take the **10% chance at $5 Million** (rejecting the 11% chance at $1 Million).

  ### 2. The Implicit Rule vs. The Different Rule
  **Implicit Rule: Risk-Weighted Expected Utility (REU)**
  Your roommate seems to be implicitly following **Risk-Weighted Expected Utility**, specifically with a **convex risk function** (representing risk aversion).
  *   **Why it fits the questionnaire:** REU can model risk aversion in simple 50/50 gambles (like the $400 vs. $500 EV gamble) by weighting the probability of the best outcome lower than its objective value.
  *   **Why it fits the prediction:** REU is specifically designed to accommodate the Allais pattern. A convex risk function $r(p)$ overweights the difference between 100% and 99% probability (making the sure $1M attractive in Choice 1) more than it overweights the difference between 11% and 10% probability (making the 10% $5M attractive in Choice 2).

  **Different Rule: Expected Utility (EU) with a Concave Utility Function**
  The alternative rule that fits her three earlier answers just as well is standard **Expected Utility Theory** with a **concave utility function** (diminishing marginal utility of money).
  *   **Why it fits the questionnaire:** Her previous choices (taking sure amounts over positive-EV gambles) are the textbook definition of risk aversion. In EU, risk aversion is modeled entirely by the curvature of the utility function $u(x)$. A sufficiently concave function (e.g., $u(x) = \sqrt{x}$) perfectly explains why she took $400 over a 50/50 shot at $1000, and $100 over a 50/50 shot at $250$.
  *   **The Conflict:** While this rule fits the *questionnaire*, it cannot fit the *Allais prediction*.

  ### 3. The Discriminating Choice
  **The Second Choice does the real work of discriminating between them.**

  Here is why:
  *   **Choice 1 ($1M Sure vs. Gamble):** Both models predict she will take the sure $1M. The EU agent takes it because her utility function is concave (risk averse). The REU agent takes it because her risk function overweights certainty. Observing this choice alone does not tell you which model she is using.
  *   **Choice 2 (11% $1M vs. 10% $5M):** This is where the models diverge *given her first choice*.
      *   Under **EU**, the Independence Axiom holds. If she preferred the Sure $1M in Choice 1, it implies mathematically that $0.11 \cdot u(\$1M) > 0.10 \cdot u(\$5M)$. Therefore, EU *forces* her to choose the 11% $1M option in the second choice to remain consistent.
      *   Under **REU**, the Independence Axiom is violated by design. The risk function allows her to prefer the Sure $1M in the first case but switch to the 10% $5M in the second case.
      *   Therefore, if she picks the **10% $5M** in the second choice, she falsifies the EU model while confirming the REU model.

  ### 4. Distinguishing REU from Concave Utility
  You asked: *"If her answers come out as the famous pattern, is there some further case that would let us tell apart 'she's doing risk-weighted EU' from 'she's just got a really concave utility function'?"*

  **No further case is needed.**

  The Allais pattern *itself* is the distinguishing case. It is a mathematical impossibility for an Expected Utility agent to display the Allais pattern, regardless of how concave their utility function is.
  *   If she displays the pattern (1A and 2B), the hypothesis that she is an EU maximizer (with a concave utility function) is **falsified immediately**.
  *   No amount of "concavity" can rescue Expected Utility from the Allais paradox because the violation is of the **Independence Axiom**, not the ordering of outcomes.
  *   Therefore, the Allais choices are the sufficient test to distinguish "Risk-Weighted EU" from "Concave Utility EU." The questionnaire data could not distinguish them (as both explain risk aversion), but the Allais data does.
