answer: |-
  The bad step is **Step (4)**.

  Here is the breakdown of why it fails, why it seduced your student, and exactly what it will cost you to excise it while keeping (1) and (2).

  ### 1. Why Step (4) is the Error
  Step (4) states: *"So the one who suffers is not the agent who acted, in the sense that (2) requires."*

  This inference is invalid. It moves from a premise about **psychological discontinuity** (in Step 3: no memory, different character) to a conclusion about **normative identity** (in Step 4: not the agent required for desert).

  To make this move, the argument relies on a hidden, undefended premise: *That the "agent-relativity" required for desert (in Step 2) must be cashed out in terms of psychological connectedness (memory, character, capacity).*

  Step (4) assumes that if the psychological profile changes, the moral agent ceases to exist. This is a specific theory of personal identity (Lockean/Parfitian Psychological Continuity) masquerading as a conceptual truth about desert. It is not. One can hold that the "agent" is the **causal locus** of the act rather than the **psychological subject** of the experience. Step (4) rules out your "trace-ownership" view by fiat rather than argument.

  ### 2. Why It Looked Fine (The Seduction)
  In contemporary analytic moral philosophy, Step (4) is the default setting. We generally tie responsibility to **capacity** and **recognition**.
  *   **Capacity:** If the later being has different capacities (Step 3), how can they be responsible?
  *   **Recognition:** If they don't remember the act, how can they "own" it?

  Your student is leveraging the intuitive force of the "Reformed Offender" case (Step 7). It feels unjust to punish someone who has fundamentally changed. Step (4) codifies this intuition into a metaphysical claim: *Change in character = Change in agent.* It looked fine because it aligns with our secular, legalistic intuitions about fairness, which prioritize the current psychological state over historical causal chains.

  ### 3. What Step (3) is Actually Doing
  You asked if (3) is doing more work than it appears. **Yes.**
  Step (3) is not just a textual claim about classical sources; it is an **epistemic smuggler**.
  *   It equates *epistemic access* (memory) with *ontological status* (identity).
  *   It asserts that "no memory" implies "very little psychological continuity."

  In many classical systems (e.g., Yogācāra Buddhism), this is false. The *ālaya-vijñāna* (storehouse consciousness) maintains a continuous stream of seeds (*bīja*) even without explicit memory. Step (3) ignores **latent continuity** to force a conclusion about **manifest discontinuity**. It sets up the straw man that rebirth is a "hard reset" rather than a "migration of data," making Step (4) easier to swallow.

  ### 4. The Cost of Giving Up Step (4)
  If you reject Step (4) to save Karma-as-Desert, you cannot simply retreat to "trace-ownership" as a causal mechanism. You must pay a heavier metaphysical and normative price.

  **A. You Must Accept the Force of Step (7)**
  Step (7) is not just a generalization; it is the *reductio* that follows from your rejection of (4).
  *   **The Cost:** If you say psychological discontinuity does *not* break karmic desert, you must concede that psychological discontinuity does *not* break ordinary desert.
  *   **The Consequence:** You are committed to the claim that punishing the 80-year-old for the 20-year-old's crime is **just**, even if the 80-year-old has no memory of it and a different character. You lose the "Reform Defense" in penology. You cannot argue that the reformed offender *doesn't deserve* punishment; you can only argue on utilitarian grounds that it's useless. This isolates you from standard retributive theory.

  **B. You Must Bridge the Is-Ought Gap (The Student's "Relocation" Objection)**
  Your student argued that "trace-ownership" relocates the normative question. They are right, unless you clarify the ontology.
  *   **The Problem:** Saying "Act A caused Trace T, and Trace T causes Suffering S" is a causal claim. Saying "S is *deserved*" is a normative claim. Hume's Guillotine applies.
  *   **The Cost:** To defend "trace-ownership" against the charge of "inherited liability," you must argue that the Trace **constitutes** the Agent, not just connects them.
      *   *Inherited Liability:* Agent A incurs debt, Person B pays it. (Two entities, one bill).
      *   *Karmic Identity:* The Trace is the ontological glue that makes Agent A and Person B the **same entity**.
  *   **The Requirement:** You cannot treat the Trace as a mere causal receipt (like an invoice). You must argue that the moral self *just is* the causal stream of volitional impressions. This requires defending a **Substance View** or a **Causal Essentialist View** of the self against the dominant Psychological View. You are signing up for heavy-duty metaphysics, not just ethics.

  **C. You Must Redefine "Fittingness" (Step 2)**
  If you keep (2) ("suffering is morally fitting"), you must explain why suffering is "fitting" for a being that does not recognize the act.
  *   **The Cost:** You must move from a **Retributive Model** of desert (which requires recognition/endorsement) to a **Natural Law Model** of desert (where consequences attach to acts like heat to fire).
  *   **The Risk:** This invites the Step (6) objection: that rebirth is just "decoration." To avoid this, you must show that the *latency* itself is morally significant (e.g., it allows the moral quality of the act to mature fully), not just a mechanical delay.

  ### Summary for Thursday
  Tell your student:
  1.  **Step (4) begs the question.** It assumes Psychological Continuity is the *only* valid criterion for agent-identity in desert claims.
  2.  **You reject that assumption.** You hold that **Causal Continuity** (the Trace) is sufficient for agent-identity.
  3.  **You accept the cost.** You agree that this implies the "Reformed Offender" still deserves punishment (Step 7), because "reform" changes the character but not the karmic identity.
  4.  **You correct the "Invoice" analogy.** It is not inherited liability (two people, one debt); it is **constitutive identity** (one continuing entity, defined by the causal stream). The Trace doesn't just link them; it *makes* them the same agent.

  This keeps (1) and (2), kills (4), and forces the seminar to debate the metaphysics of the self rather than the mechanics of rebirth.
