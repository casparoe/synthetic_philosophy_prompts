answer: |-
  **Project Title:** Procedural Propensity: Resolving the Epistemic Status of Type B Uncertainty

  **Applicant:** [Your Name]
  **Affiliation:** Department of Philosophy (Senior Scholar Scheme)
  **Sponsor:** [Sponsor Name]

  **Project Summary**
  This project investigates the philosophical foundations of measurement uncertainty, specifically the status of "Type B" evaluations within the *Guide to the Expression of Uncertainty in Measurement* (GUM) framework. Drawing on thirty years of experience in national metrology, I propose that Type B uncertainty is best understood not as subjective belief nor as physical frequency, but as a *procedural propensity*—a dispositional property of the measurement method itself. The project will deliver one journal-length paper (approx. 8,000 words) defending this account against standard interpretations and testing its generalizability to model-based probabilities in climate science and risk assessment.

  **The Central Question**
  Philosophical inquiries into measurement often drift into vague metaphysics or purely normative proceduralism. To ensure a determinate answer, this project asks: **Can a procedural propensity account resolve the tension between the objectivity required by interlaboratory comparison and the non-frequency nature of Type B uncertainty evaluations?**

  I have selected this framing over ontological questions (e.g., "What kind of thing is uncertainty?") which tend to stall in metaphysical swamp, and purely normative questions (e.g., "How should scientists justify evaluations?") which ignore the underlying probability interpretation. The chosen question demands a yes/no/qualified verdict based on whether the account can sustain the specific epistemic norms of metrology: auditable convergence and the possibility of error.

  **Background and Motivation**
  In operational metrology, uncertainties are evaluated via Type A (statistical analysis of repeat observations) or Type B (all other means, including calibration certificates and engineering judgment). The GUM mandates that both be converted to standard uncertainties and propagated identically. However, the epistemic justification for Type B remains philosophically homeless.

  The three standard interpretations of probability fail to capture Type B practice:
  1.  **Frequentism:** Fails because Type B often concerns unique events or constants (e.g., the mass of a specific kilogram prototype) where no long-run frequency exists.
  2.  **Subjectivism (Bayesian):** Fails because Type B evaluations are not merely personal degrees of belief. They are auditable; a metrologist can be *wrong* about a Type B evaluation in a way one cannot be wrong about their own credence. Interlaboratory comparisons rely on convergence that mere agreement in belief does not guarantee.
  3.  **Objectivist Propensity:** Fails if attached to the *object* (the mass of a kilogram is not chancy).

  The "pragmatic Bayesian" shortcut—treating all uncertainty as subjective but constrained by data—does not work here. It cannot explain the normative force of an audit where a lab is corrected for underestimating a temperature gradient. The correction implies a fact of the matter about the uncertainty itself, not just a update in belief. My hypothesis is that the propensity belongs to the *procedure*. The measurement method has a disposition to yield results within a range, and the single measurement inherits its uncertainty from this repeatable behavioral capacity of the method, even if the measurand is fixed.

  **Methodology**
  This project will not rely on armchair conceptual analysis or intuition pumps. Instead, I will employ a case-based method grounded in the documentary record of Key Comparisons (KC) managed by the BIPM. I will analyze specific instances where laboratories diverged on Type B evaluations and were subsequently corrected via audit.

  The method involves reconstructing the reasoning used in these audits to identify the implicit norms governing "correct" versus "incorrect" uncertainty budgets. I will test whether the "procedural propensity" account reconstructs these norms better than competing interpretations. For example, if a lab is penalized for ignoring a known thermal effect, was it because they violated a subjective coherence norm, or because they misidentified the disposition of their measurement procedure? This empirical grounding in the actual practice of calibration distinguishes this project from standard philosophy of probability.

  **Generalization and Scope**
  A successful account must earn its keep beyond the mass lab. I will test the procedural propensity model against two extension cases:
  1.  **Climate Event Attribution:** Claims that a specific heatwave was made *N* times more likely by warming involve unique events generated by repeatable computational procedures (climate models).
  2.  **Algorithmic Risk Scores:** Individualized risk assessments where the "probability" is a output of a model run on unique data.

  In both cases, there is no frequency in the world for the specific event, but there is a procedure that could be run again. If the procedural propensity account clarifies the ontological status of these probabilities without collapsing into subjectivism, it significantly broadens its philosophical utility.

  **Risk Assessment and Failure Conditions**
  I intend to be honest about the limitations of a twelve-month, part-time schedule. The project will count as a **failure** if:
  1.  **Circularity:** The individuation of the "procedure" relies on the very uncertainty values it is meant to justify (e.g., defining the procedure by its success rate).
  2.  **Collapse:** The account cannot distinguish itself from intersubjective Bayesianism. If "procedural propensity" turns out to be merely "what the community agrees the procedure does," it adds no explanatory power over existing social epistemology.

  **Scope Management:** The primary deliverable is the metrology case. The extension cases (climate and risk) are secondary. If the metaphysical work on the measurement procedure proves more demanding than anticipated, the climate attribution section will be cut to ensure the core argument regarding Type B uncertainty is rigorous. The goal is a solid defense of the procedural account in its home domain, rather than a speculative survey of its applications.

  **Deliverable and Timeline**
  *   **Months 1–4:** Literature review and selection of three specific Key Comparison case studies.
  *   **Months 5–8:** Drafting the core argument and procedural propensity definition.
  *   **Months 9–10:** Testing against extension cases (climate/risk).
  *   **Months 11–12:** Revision and submission of the 8,000-word paper to *Studies in History and Philosophy of Science* or *Philosophy of Science*.

  This project leverages unique access to the practical realities of national measurement standards to solve a persistent puzzle in formal epistemology, bridging the gap between the calibrations of mass and the calibrations of argument.
