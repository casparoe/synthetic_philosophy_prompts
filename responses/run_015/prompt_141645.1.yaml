prompt: |-
  Hi there — I want you to act as a professional philosopher who specializes in philosophy of science and formal epistemology, and please think this one through carefully instead of rattling off something generic. Before you write anything, brainstorm three or four different ways the central question could be framed, then pick the sharpest one and build the proposal around it; I'd much rather have one well-chosen question than four vague ones. Here's the situation. I'm retired now — thirty-odd years in the mass and force lab at a national measurement institute, most of that spent organizing interlaboratory comparisons, which as you can imagine is a career built entirely out of arguing about who's error bar is bigger. Bored out of my mind in the second year of retirement, I started auditing a graduate seminar in the philosophy department on probability (frequentism, subjectivism, propensity — the standard three), and I've got completely hooked; my wife says I've swapped calibrating mass standards for calibrating arguments. The department has a small senior-scholar scheme: twelve months, part-time, honorary affiliation, a desk, library access, and a seminar slot at the end, and they want a two-page proposal with a deliverable of one journal-length paper of about 8000 words. I have a faculty sponsor but he's away til March, so I'm on my own with the framing.

  Here's my half-formed idea, which I tried out on some old colleagues over Friday beers and they mostly thought I'd had too many. In my old world, uncertainties get evaluated two ways: type A, by statistical analysis of a series of repeat observations, and type B, by everything else — calibration certificates, manufacturer's specs, handbooks, and plain engineering judgement about things like a temperature gradient in the room. The odd thing, as I remember it, is that the official guidance tells you to convert both into a standard uncertainty and then propagate them together as if they were the same kind of animal, even though one looks like a frequency and the other looks like an opinion. None of the three interpretations we read seems to fit the type B case: it isn't my personal degree of belief, because it's auditable, you can be held to be wrong about it, and two labs have to be able to converge on it; it isn't a long-run frequency of anything, since nobody's repeating the world; and a propensity of the measured object looks wrong too, because the mass of a kilogram isn't chancy. My hunch is that the right home for it is a propensity of the *procedure* — a dispositional property of the measurement method, not of the object and not of the measurer — and that the single measurement result inherits its uncertainty from the method's repeatable behavior.

  What I need from you is the proposal itself: state the question precisely enough that it has a determinate answer; explain why each of the three standard interpretations leaves it open, and why the obvious shortcut of just saying "it's all really Bayesian, get over it" doesn't work here (the thing that needs explaining is the intersubjective, auditable structure of the practice — labs disagree, get audited, and get corrected); and lay out the method, including why that method rather than the obvious alternatives like a straight conceptual analysis or an armchair survey of intuitions about single cases. I also want the proposal to say how far the method-propensity account generalizes beyond the lab: does it earn its keep on probabilities about irrepeatable events that are nevertheless generated by repeatable computational procedures — things like climate event attribution claims that a particular heatwave was made N times more likely by warming, or individualized risk scores from a model — where there is no frequency in the world but there is a procedure that could in principle be run again? And please be honest about scope and failure: tell me what would count as the project failing (for instance, if the extension cases keep dragging judgement back in and the whole account quietly collapses into subjectivism, or if 'procedure' can't be individuated without circularity), and which part you'd cut as too big for twelve months at half time. Skip the bibliography entirely — I'll add references myself later, and I'd rather you spend the words on the argument. Please write it in American English, my sponsor is American and it saves a round of copyediting.
