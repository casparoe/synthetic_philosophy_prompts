          *   Deadline: Thursday's vote.

  2.  **Determine the Recommendation:**
      *   *Option A (Deny):* Satisfies victims' moral outrage but risks losing the structural truth forever. Investigators say command reconstruction is impossible without this.
      *   *Option B (Approve Unconditionally):* Dangerous. No guarantee of truth.
      *   *Option C (Approve with Strict Conditions):* Balances the need for truth (investigators) with the need for accountability/validity (victims). This is usually the most pragmatic path in transitional justice.
      *   *Decision:* Recommend **Approve with Strict Conditions**. This aligns with the "truth for amnesty" model of the TRC but tightens the verification to address the "commodification" concern.

  3.  **Identify the "Losing Side" Argument to Engage:**
      *   If I recommend approval (even conditional), the "losing side" is the Victim Families/Those opposing amnesty.
      *   *Their strongest argument:* "Commodifying trauma for data." Trading suffering for filing-cabinet confessions.
      *   *Alternative:* If I recommend denial, the losing side is the Investigators. Their argument is "Administrative neutrality is not a shield" (wait, actually the prompt says "engage the strongest argument on the losing side seriously: either that administrative neutrality is a moral shield, or that we're commodifying trauma for data").
      *   *Clarification:* The prompt asks me to engage the argument of the *losing side*. If I recommend *approval*, the losing side is the *opposition* (Families). Their argument is "commodifying trauma." If I recommend *denial*, the losing side is the *proponents* (Investigators/Bureaucrats). Their argument is "administrative neutrality" (though usually, bureaucrats argue they were "just following orders," which is the neutrality shield).
      *   *Strategic Choice:* Recommending *Approval with Conditions* is the most constructive path for a Transitional Justice Board. It breaks the deadlock. Therefore, I must engage the "Commodifying Trauma" argument (the Families' concern) seriously, showing how the conditions mitigate it.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose clearly. Break the deadlock.
      *   **Recommendation:** Be bold. "Approve Conditional Amnesty."
      *   **The Core Logic (Philosophy in Practice):** Acknowledge the tension. Truth vs. Justice. Structural vs. Individual.
      *   **Addressing the Opposition (The "Commodification" Argument):** This is crucial. I need to show I hear them. It's not just about data; it's about *meaningful* truth. If the data doesn't lead to identifying the killers or returning remains, the amnesty is void. This turns "data" into "justice."
      *   **The Conditions (The "How"):**
          *   Timeframe: 90 days (as per prompt).
          *   Verification: Not just self-reporting. Needs corroboration.
          *   The "Kill Switch": Amnesty is provisional until victims' families confirm the utility of the info (e.g., locating remains).
      *   **Closing:** Call to action for Thursday's vote.

  5.  **Refining the Tone:**
      *   *Avoid:* "As Foucault might argue..." or "In the Kantian sense..."
      *   *Include:* "We are balancing the moral cost..." or "The risk of reducing pain to paperwork..."
      *   *Style:* Direct, authoritative, empathetic but firm.
      *   *Constraint Check:* No bibliographies. No citation lists. Circulate-ready.

  6.  **Drafting - Iteration 1 (Mental Outline):**
      *   To: Board. From: Me. Re: Amnesty Vote.
      *   We should say yes, but carefully.
      *   Investigators need the maps. Families hate the trade.
      *   I hear the families: trading pain for papers is bad.
