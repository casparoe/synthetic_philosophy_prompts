      *   The "Commodification" argument needs to be the anchor for the *conditions*. The amnesty isn't granted for the *confession*; it's granted for the *result* of the confession.
      *   Verification needs to be robust. Not just "I told you," but "We checked it."

  8.  **Final Polish (Reviewing against Prompt):**
