answer: |-
  Here is the conceptual map you requested, broken down by the five distinct theses lurking inside "truth is what works."

  ### 1. The Trivial/Deflationary Reading
  **The Thesis:** The predicate "is true" adds nothing to a statement other than "it is expedient to believe." To call a belief true is just to give it a compliment.
  *   **Defensibility:** Low. It collapses the distinction between *being* true and *being taken* to be true. It makes the concept of truth redundant.
  *   **Peirce's Rejection:** Vehement. Peirce argues this confuses the *definition* of truth with the *motivation* for believing. For Peirce, truth is a relation between a sign and an object, independent of what anyone finds expedient.
  *   **Licenses Comforting Falsehoods?** Yes. If the compliment is paid based on personal expediency, a comforting falsehood counts as true.
  *   **Status:** This is a caricature often attributed to pragmatism by critics (like Russell), not a serious philosophical position held by the classics.

  ### 2. James's "Cash-Value" View (Verificationism)
  **The Thesis:** Truth is not a static property but an *event*. An idea becomes true if it successfully "leads" us through experience, connecting us to reality without contradiction or frustration. The "work" is the successful navigation of the sensory flux, not mere emotional satisfaction.
  *   **Defensibility:** Moderate to High (within a process metaphysics). It handles the dynamic nature of inquiry well.
  *   **Peirce's Rejection:** Mixed. Peirce agrees on the "leading" (abduction/induction) but rejects James's willingness to allow individual, private verification to constitute truth. Peirce insists verification must be publicly repeatable.
  *   **Licenses Comforting Falsehoods?** **No.** This is the crucial point for your student. For James, a conspiracy theory that helps you "navigate social media" does not *lead* you successfully through the wider sensory flux. It eventually bumps into recalcitrant experience (e.g., court records, contradictory evidence). James distinguishes between *feeling* safe and the idea *working* in the long run of experience. If the belief prevents successful prediction or action in the physical world, it fails the cash-value test.
  *   **Status:** This is James's actual view in *Pragmatism* and *The Meaning of Truth*.

  ### 3. The Instrumentalist Claim (Justification, Not Truth)
  **The Thesis:** We cannot access "Truth" (capital T) directly. Therefore, "truth" is just a name for the current best justification. To say a belief is true is to say it is currently warranted by its utility in inquiry.
  *   **Defensibility:** High (common in neo-pragmatism like Putnam or Rorty). It avoids metaphysical baggage.
  *   **Peirce's Rejection:** Yes. Peirce is a realist. He believes there is a "Secondness" (brute facticity) that resists our beliefs. Instrumentalism risks turning truth into mere consensus or current utility, ignoring the external constraint of reality.
  *   **Licenses Comforting Falsehoods?** No, provided "justification" requires public evidence. If justification is reduced to "what feels good," then yes. But if justification requires intersubjective testing, the conspiracy theory fails.
  *   **Status:** This shifts the topic from *metaphysics* (what truth is) to *epistemology* (how we know).

  ### 4. The Radical Subjectivist/Relativist Version (The Student's View)
  **The Thesis:** Truth is relative to the individual agent. If a belief produces psychological stability or social cohesion for *me*, it is true *for me*. There is no "view from nowhere."
  *   **Defensibility:** Very Low. It is self-defeating (is *that* thesis true for everyone, or just for you?) and makes communication impossible.
  *   **Peirce's Rejection:** Absolute. Peirce's entire project is an attack on "individual authority." He argues that reality is precisely that which is *not* up to you. If you believe a train is coming, your belief doesn't make it true; the train runs you over regardless.
  *   **Licenses Comforting Falsehoods?** Yes, explicitly. This is the "truth for me" loophole.
  *   **Status:** This is a misreading of James. James allows for "moral truths" or religious hypotheses where evidence is inherently incomplete, but he does not grant this license for empirical claims that can be tested (like conspiracy theories).

  ### 5. The Long-Run Communal Convergence (Peircean)
  **The Thesis:** Truth is the opinion fated to be ultimately agreed to by all who investigate. "What works" means "what survives the rigors of indefinite inquiry."
  *   **Defensibility:** High (as a regulative ideal), though metaphysically demanding (requires faith in the convergence of inquiry).
  *   **Peirce's Rejection:** None. This is Peirce's definition.
  *   **Licenses Comforting Falsehoods?** No. A comforting falsehood will not survive indefinite inquiry because reality will eventually contradict it. The "long run" acts as a filter for subjective bias.
  *   **Status:** This is the standard "scientific realist" pragmatism.

  ***

  ### The James/Peirce "Collapse" Question
  **Is it a misreading to see a collapse between James and Peirce on the long-run point?**
  **Yes, it is a misreading, but a tempting one.**

  *   **The Convergence:** Both agree that truth is teleological. It is about where inquiry *goes*, not where it *starts*. Both reject the copy-theory of truth (that truth is a static mirror of nature).
  *   **The Divergence:**
      *   **Peirce** locates the "working" in the **community** over the **indefinite future**. He prioritizes the *object* that constrains the community.
      *   **James** locates the "working" in the **individual's life** over the **finite term**. He prioritizes the *subject* who needs to live.
  *   **Why it matters:** James allows that some truths are *made* by belief (e.g., believing in a moral order helps create it). Peirce denies this for matters of fact. If your student claims the conspiracy theory is true because it helps him cope, James might say, "Does it lead you to further verifiable experiences successfully?" Peirce would say, "Does it align with the final opinion of the scientific community?"
  *   **The Collapse:** They collapse only if you ignore James's pluralism. If you treat James as a proto-Peircean scientific realist, you miss James's specific allowance for religious/moral "truths" that lack empirical verification but have life-value. However, on *empirical* claims (like conspiracy theories), James is closer to Peirce than your student realizes: the belief must "cash out" in concrete sensory differences, not just internal comfort.

  ### Truth vs. Warranted Assertability
  **Where James slips from Truth to Warranted Assertability:**
  Your student is slipping up exactly where James is most vulnerable: the **criterion/definition conflation.**

  1.  **The Shift:** James often defines truth *as* the process of verification ("Truth *happens* to an idea"). This sounds like he is defining truth as *warranted assertability* (the right to claim something).
  2.  **The Student's Error:** The student assumes that *immediate* psychological utility counts as verification.
  3.  **The Correction:** For James, "working" isn't just "feeling good." It means the belief acts as a **bridge** between previous experience and new experience without causing a crash.
      *   **Warranted Assertability:** "I am warranted in believing this *now* because it helps me function." (James might accept this as a *right to believe* in specific, undecidable cases).
      *   **Truth:** "This belief corresponds to the way the world is structured because it continues to lead to successful predictions."
  4.  **The Verdict:** James would likely tell your student that he has confused the **right to believe** (which James defends in *The Will to Believe* for momentous, living, forced options that cannot be decided on intellectual grounds) with the **truth of the belief**. A conspiracy theory is usually an empirical claim decidable by evidence. Therefore, it falls under the jurisdiction of "what works in verification," not "what works for my mental health."

  **Summary for the Seminar:** The slogan "truth is what works" is an account of the *function* of truth, not a license for *wishful thinking*. "Working" means successful interaction with a resistant reality, not successful management of internal anxiety. Peirce rejects the slogan if it implies utility defines truth; James accepts it only if "utility" includes long-term empirical coherence. Your student is operating on Thesis 4, while James is defending Thesis 2, and Peirce is defending Thesis 5.
