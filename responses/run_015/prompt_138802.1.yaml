answer: |-
  Here is the ranking, the cut, and the defense.

  ### The Cut: Decision Rules (Cluster A)
  **Cut:** *Which decision rule (Γ-maximin, maximality, E-admissibility) should a rational agent use?*

  **Reason:** This is where philosophers talk past each other. The choice of rule depends entirely on *why* you have a set in the first place. If the set represents objective indeterminacy (your "primitive chance" hypothesis), Γ-maximin might be appropriate. If it represents a parliament of advisors (your "epistemic" hypothesis), E-admissibility looks better. But institutions rarely use formal decision rules at all; they use the sets for *communication*, not action selection. Spending months untangling axiomatic decision theory will yield a story about normative purity, not about how uncertainty actually functions in science or policy. It is second-order to the metaphysics and the practice.

  ---

  ### The Ranked Questions

  #### 1. The Reduction Challenge: Is Imprecise Probability distinct from Hierarchical Bayesianism?
  *(Addresses your Cluster C and your "Parliament" hypothesis)*

  **The Question:** Can every imprecise model (a set of priors) be mathematically rewritten as a single precise prior over a higher-order space (a hierarchical Bayesian model), and if so, does that rewrite preserve the *decision-relevant* ignorance the set was meant to capture?

  **Defense:**
  *   **Load-bearing:** This is the existential threat to the field. If IP is just Bayesianism with extra steps (a "mixture prior" over which expert is right), then the "imprecision" is an illusion of representation, not a feature of the world or the mind. If the reduction holds, the "parliament" is just a single voter with complex preferences. If the reduction fails (i.e., the set captures a type of ignorance a single function *cannot*), then IP is a genuine paradigm shift.
  *   **Feasibility:** With undergrad probability, you can grasp the difference between a *set of distributions* and a *mixture distribution*. The math is accessible; the philosophical implication is the hard part, which is your job as a writer. You can interview formal epistemologists on both sides (e.g., Joyce vs. Bradley) to see if the "cheating" accusation holds water.
  *   **Institutional Impact:** If IP reduces to Bayesianism, institutions should aggregate expert sets into a single consensus distribution (averaging the priors). If it does *not* reduce, they must preserve the spread. This dictates whether the IPCC reports a single probability density or a bound.

  #### 2. The Institutional Speech Act: Is reporting a set without a decision rule a bug or a feature?
  *(Addresses your Cluster A practice gap and your "Institution" hypothesis)*

  **The Question:** When central banks or pandemic modelers report intervals (sets) but refuse to commit to a decision rule for acting on them, are they engaging in a coherent form of "imprecise communication" that protects against over-confidence, or are they simply hiding behind a theoretical scandal they can't resolve?

  **Defense:**
  *   **Load-bearing:** This determines whether the field is a tool or a toy. If the lack of a rule is a "scandal," the field has failed its users. If it is an "honest response," then the theory of IP needs to pivot from *decision-making* to *information transmission*.
  *   **Feasibility:** This is the most investigable question in four months. You can analyze reports (Fed, IPCC, Intelligence Community) and interview the modelers. You don't need to solve the math; you need to document the practice.
  *   **Institutional Impact:** Direct. If the answer is "feature," institutions should formalize interval reporting as a distinct epistemic category (e.g., "We are not uncertain about the probability; we are uncertain about the model"). If "bug," they need to be pressured to adopt specific decision criteria.

  #### 3. The Dilation Test: Is learning supposed to sharpen or widen belief?
  *(Addresses your Cluster B)*

  **The Question:** Is "dilation" (where conditioning on new evidence *widens* the probability set rather than narrowing it) a mathematical pathology that needs fixing, or an honest accounting of dependency ignorance?

  **Defense:**
  *   **Load-bearing:** This is the biggest technical barrier to adoption. In standard Bayesianism, evidence always reduces entropy (on average). In IP, evidence can make you *more* uncertain. If this is a bug, IP is broken. If it's a feature, it fundamentally changes the scientific mantra that "more data is always better."
  *   **Feasibility:** You can demonstrate this with simple urn examples (the Ellsberg paradox variants). It is conceptually dense but mathematically shallow enough for a feature piece.
  *   **Institutional Impact:** High. If dilation is real/acceptable, institutions must warn policymakers that gathering more data on a specific variable might increase overall uncertainty about the outcome. This counters the standard "we need more research" plea.

  ---

  ### The Reshuffle Condition

  **Finding:** If you discover that the **Reduction Challenge (Q1)** is mathematically valid (IP *can* be rewritten as Hierarchical Bayes) **BUT** the Hierarchical model is computationally intractable for real-world problems while the Imprecise set is tractable.

  **Why this reshuffles:**
  Currently, Q1 is ranked #1 because it questions the *truth* of the model. If the finding above holds, the question shifts from "Is it true?" to "Is it useful?"
  *   **New #1:** The Institutional Speech Act (Q2). If IP is just a tractable approximation of Bayes, then the "scandal" of not having a decision rule becomes the central story: institutions are using a heuristic because the "true" model is too hard to compute.
  *   **New #2:** The Reduction Challenge. It becomes a question of engineering, not metaphysics.
  *   **New #3:** Dilation. It becomes a specific artifact of the approximation.

  ### Note on your "Chewing On" Hypotheses

  1.  **Parliament vs. Primitive Chance:** This is subsumed into **Q1**. If the set is a "parliament" (epistemic), it likely reduces to Hierarchical Bayes. If it is "primitive chance" (ontic), it likely does not. The downstream consequence is whether you can aggregate the advisors (vote) or if you must respect the bounds (survive the worst case). Don't treat this as a separate question; treat it as the *interpretation* of the answer to Q1.
  2.  **Institutions reporting sets without rules:** This is **Q2**. My defense above leans heavily on your intuition here: it is likely not a scandal, but a pragmatic adaptation to the fact that Q1 and Q3 are unresolved. They are reporting *state* without committing to *action*. That is a defensible communicative act, even if decision theorists hate it.

  **Final Advice:** Start with Q2 (Institutions). It gives you the narrative hook (real world stakes). Use Q1 (Reduction) as the theoretical tension (is this real or just lazy?). Use Q3 (Dilation) as the specific example of why the math is weird. Ignore the decision rules entirely.
