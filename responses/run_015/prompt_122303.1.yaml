      *   Make sure the "No External Enforcer" constraint is respected (internal logic must hold).

  8.  **Drafting - Section by Section:**
      *   *Intro:* Validate the pub experience. It's the paradox of sovereignty.
      *   *Desiderata:*
          1.  **Temporal Separation:** An amendment altering procedure takes effect only *after* the meeting concludes. (Prevents Piggyback/Borrowed Validity). Non-negotiable.
          2.  **Hierarchical Integrity:** Protected clauses cannot be altered without first satisfying their specific protection, in a prior step. (Prevents Hollow Lock). Non-negotiable.
          3.  **Referential Continuity:** Repeal of a clause requires simultaneous update of all dependent clauses. (Prevents Orphans). Preference (hard to enforce).
          4.  **Symmetric Reversibility:** The threshold to repeal must not exceed the threshold to enact. (Prevents Ratchet). Preference.
          5.  **Foundational Fiat:** The initial document must declare itself valid without reference to prior rules. (Bootstrap). Non-negotiable.
      *   *Incompatibilities:* You cannot have total flexibility and total stability. You cannot have a rule that binds the future absolutely (because the future can change the rule).
      *   *Single Exclusionary Requirement:* Temporal Separation. It stops the "one-line fix" that changes the lock and opens the door simultaneously.
      *   *Scorecard:*
          *   Hard-coded core: Stable but brittle.
          *   Tiered: Good balance but complex.
