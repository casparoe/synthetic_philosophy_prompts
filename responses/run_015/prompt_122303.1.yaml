      *   *Self-Referential/Structural:*
          *   Piggybacking: Changing the rule *and* using the new rule in one motion.
          *   Borrowed Validity: Meeting valid only under new rule, but voting on new rule.
          *   Hollow Lock: Deleting the protection before changing the protected thing.
          *   Orphaned Dependencies: Repealing Rule A while Rule B refers to Rule A.
          *   Ratchet: Making reversal harder than enactment.
          *   Infinite Regress: Who validates the validator?
          *   Self-Annihilation: Voting to dissolve the rules without a transition plan.
          *   Temporal Ambiguity: When does the change take effect? Immediately? Next meeting?
          *   Identity Crisis: Changing the purpose so much it's no longer the same organisation (Theseus's Ship).
          *   Contradiction: New rule contradicts old rule without explicit repeal.

  3.  **Filtering & Selecting Desiderata:**
      *   Focus on the self-referential paradoxes.
      *   Need to address: Initial validity, Transition validity, Logical consistency, Reversibility.

  4.  **Drafting the Desiderata (Iterative Process):**
      *   *Requirement 1: The Bootstrap.* How do we start? The initial constitution must be deemed valid by fiat or external founding act, but internally it must state its own supremacy.
      *   *Requirement 2: Temporal Separation.* You can't change the rule and use the new rule simultaneously. (Addresses Piggyback/Borrowed Validity).
      *   *Requirement 3: Entanglement.* You can't change a protected rule without satisfying the protection first. (Addresses Hollow Lock).
      *   *Requirement 4: Consistency.* No orphaned references. (Addresses Orphaned Dependencies).
      *   *Requirement 5: Reversibility.* Don't make undoing harder than doing. (Addresses Ratchet).

  5.  **Identifying Trade-offs (The "Impossible" Part):**
      *   Flexibility vs. Stability.
      *   If you make the amendment rule too hard to change, you risk deadlock (cannot adapt).
      *   If you make it too easy, you risk the "Hollow Lock" or "Ratchet".
      *   *Crucial Conflict:* Absolute Self-Determination vs. Identity Preservation. If the rules can change *anything*, they can change the rule that prevents them from changing *anything*. If they can't change *anything*, they aren't fully self-amending.
      *   *The Single Exclusionary Requirement:* "Procedural Integrity during Transition." You cannot allow an amendment to validate itself using the standards it sets. This kills the "simple majority changes everything" model.

  6.  **Structuring the Response:**
      *   Introduction: Acknowledge the user's experience (Nomic reference).
      *   The Filtered Failures: Briefly mention the self-referential specific ones.
      *   The Desiderata (Table or List): Define the requirements, the failure they prevent, and status (Non-negotiable/Preference).
      *   The Incompatibilities: Discuss the trade-offs.
      *   The Single Exclusionary Requirement.
      *   The Scorecard.
      *   Conclusion.

  7.  **Refining the Content (Word Count & Tone Check):**
      *   British English (organisation, programme, colour, etc.).
      *   Keep it around 900 words.
