      *   British English? Yes.
      *   Table? Yes, useful for desiderata.
      *   No citations? Yes.
      *   Address initial rules & validity during change? Yes.

  10. **Final Polish:** Check the logic on the "Impossible" claim. The paradox is that a rule system cannot logically bind its own amendment power without an external anchor. Since there is no external enforcer, the anchor must be social (members refusing to accept invalid changes) or procedural (temporal separation). I need to make sure I don't get too abstract; keep it grounded in the pub examples.

      *Self-Correction on Word Count:* 900 words is tight for all this. I need to be concise. I will combine the brainstorming reflection into a brief intro and focus on the desiderata and trade-offs.

      *Refining the "Single Exclusionary Requirement":* It's likely "Temporal Separation of Procedure and Effect." This rules out the most efficient (but dangerous) method of amendment.

      *Refining the "Impossible" claim:* The impossibility lies in "Self-Embracing Sovereignty." A rule cannot logically prevent its own repeal unless the prevention is outside the rule system. Since we assume no external enforcer, absolute entrenchment is logically impossible. I must state this clearly.

