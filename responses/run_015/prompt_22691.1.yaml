      *   *Wait, a nuance:* In normal modal logic, Axiom $K$ is distribution. The "Closure Principle" is often associated with the Rule of Necessitation (if $\vdash \phi$, then $\vdash K\phi$) combined with $K$. However, the user defines closure as: "if an agent knows $p$ and knows that $p$ entails $q$, then the agent knows $q$." This corresponds to $K\phi \land K(\phi \to \psi) \to K\psi$. This is a theorem of System $K$.
