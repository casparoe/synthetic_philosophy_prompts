answer: |-
  You have identified a profound ontological and ethical instability at the heart of your institution's policy. As someone who helped draft it, you are seeing the seams where the committee stitched together incompatible frameworks to solve a novel problem with old vocabulary.

  To answer your central question directly: **The policy does not rest on a single coherent account of what an LLM is.** Instead, it relies on a **strategic inconsistency**. It toggles between treating the model as a *moral agent* (when assigning blame) and a *mindless tool* (when assigning responsibility for errors), while enforcing rules based on a *statistical proxy* (detectors) that contradicts the stated philosophical justification (causal history).

  Here is an analysis of what this bundle of rules presupposes, where the contradictions lie, and how the policy would shift under a "simulator" framework.

  ### 1. The Ontological Schism: Agent vs. Tool

  Your observation that the policy treats AI output as "someone else's writing" while simultaneously claiming the model "knows nothing" is the primary fracture.

  *   **The Plagiarism Frame (AI as Agent):** By equating AI use with plagiarism and subjecting it to the same hearings/penalties as stealing another student's work, the policy presupposes that the AI occupies the logical slot of an **author**. Plagiarism is fundamentally a violation of attribution and intellectual property rights between moral agents. You cannot "steal" from a calculator. To punish AI use as plagiarism, the institution must implicitly treat the AI as a source of ownership, even if they explicitly deny it has beliefs or agency.
  *   **The Hallucination Frame (AI as Tool):** When a student submits an AI-generated citation that doesn't exist, the school holds the *student* responsible, not the AI. Here, the AI is presupposed to be a **mechanism**, like a broken printer. It has no intent to deceive, so the user bears the burden of verification.

  **The Contradiction:** You cannot have it both ways. If the AI is a mere tool, using it to draft an essay is not plagiarism; it is **unauthorized assistance** (like hiring a tutor to write the draft). If it is an agent, then the AI should theoretically hold some copyright or responsibility. The policy wants the *moral weight* of the agent frame (to justify severe punishment) without the *ontological baggage* of the agent frame (to avoid complex legal/ethical questions about machine rights).

  ### 2. The Enforcement Contradiction: History vs. Style

  You noted that the offense is located in the "causal history" (how the paragraph was produced) but enforcement relies on "stylistic properties" (detectors/flat writing). This is an epistemological error.

  *   **Causal History:** This is a metaphysical claim. *Did this token sequence originate in a human neural net or a silicon net?*
  *   **Stylistic Properties:** This is a statistical claim. *Does this token sequence resemble the average distribution of human vs. machine text?*

  By using detectors to prove causal history, the policy presupposes that **style is a perfect fingerprint of origin.** As you have already witnessed with the false positive (the student with a flat style), this is false. A policy that punishes based on detectors is not actually policing academic integrity; it is policing **conformity to a specific human stylistic distribution.**

  This creates a perverse incentive: Students are not rewarded for thinking clearly; they are rewarded for writing "noisily" enough to evade detection. This undermines the educational goal of clear communication.

  ### 3. Is There a Coherent Account?

  Currently, the policy is **underdetermined**. It licenses at least three different accounts, none of which cover all the rules:

  1.  **The Skill-Decay Account:** AI is a tool that bypasses the cognitive struggle required for learning. (Explains the ban on drafting, but doesn't explain why it's punished as *plagiarism* rather than *incomplete competency*.)
  2.  **The Measurement Account:** Assignments are proxies for specific skills. AI obscures the measurement. (Explains the ban, but conflicts with allowing calculators/grammar checkers, which also obscure certain low-level skills.)
  3.  **The Deception Account:** Submitting AI text is a lie about who did the work. (Explains the plagiarism label, but conflicts with the "it has no beliefs" stance.)

  **To make the policy coherent,** the school would need to abandon the "Plagiarism" label entirely. The offense is not theft; it is **misrepresentation of process.**

  If the policy were coherent, it would admit that the AI is a **Simulator**. It simulates the *output* of a student who has mastered the material. Submitting that work is not stealing; it is **fraudulent certification.** It is akin to a contractor signing off on a safety inspection they didn't perform. The wrong isn't that they used a tool; it's that they certified the result as their own unassisted cognitive labor.

  ### 4. The "Simulator" Shift: What Would Change?

  If your school explicitly adopted the view that LLMs are **Simulators** (systems that can be prompted into personas but possess no interiority), the policy would require significant structural changes to align practice with theory.

  #### A. Disclosure and Citation
  *   **Current:** AI use is banned for drafting; if used for brainstorming, it's often invisible.
  *   **Simulator View:** AI use should be **mandatory disclosed**, similar to a conflict of interest or an IRB protocol.
  *   **Change:** Instead of "Don't use it," the rule becomes "If you use it, you must log the interaction." The student submits the prompt chain alongside the essay. The offense shifts from *using* the simulator to *hiding* the simulation. This acknowledges the tool's utility while maintaining integrity regarding the human's contribution.

  #### B. Enforcement and Detectors
  *   **Current:** Reliance on AI detectors and stylistic judgment.
  *   **Simulator View:** Detectors are epistemologically invalid. A simulator is designed to mimic human probability distributions; eventually, it will succeed.
  *   **Change:** Abolish detectors. Shift enforcement to **process verification.**
      *   *Version History:* Require Google Doc history or similar logs showing keystroke cadence.
      *   *Oral Defense:* Randomized viva voce exams where students must explain their thesis. If they simulated the essay, they cannot simulate the understanding in real-time.
      *   *Prompt Audits:* If disclosure is mandatory, the "proof" of integrity is the transparency of the prompt engineering.

  #### C. Definition of the Offense
  *   **Current:** "Plagiarism" (Theft of authorship).
  *   **Simulator View:** "Misrepresentation of Competency."
  *   **Change:** The hearing would not ask, "Did you steal this?" It would ask, "Did you certify this work as a product of your own reasoning when it was not?"
      *   This aligns with the "calculator" analogy. In a calculus exam where calculators are banned, using one isn't "stealing" the answer; it's violating the constraints of the competency test.
      *   This resolves the "flat style" false positive. A student who writes simply is not cheating unless they cannot defend the ideas. A student who writes flowery AI text *is* cheating if they cannot defend it, regardless of what the detector says.

  ### 5. Why the Calculator Analogy Fails (and Succeeds)

  You asked if the ban is really about skill decay. The calculator comparison is instructive.
  *   **Calculator:** We ban calculators when the learning objective is *arithmetic*. We allow them when the objective is *physics modeling*.
  *   **AI:** We ban AI when the learning objective is *synthesis and articulation*. We allow it when the objective is *research or critique*.

  The policy fails because it treats "writing an essay" as a monolithic skill. It is not. It is a bundle of skills: idea generation, structuring, drafting, editing, proofing.
  *   The policy allows AI for ideas (brainstorming).
  *   It bans AI for drafting.
  *   It allows tools for proofing (grammar check).

  This implies the "core" skill being measured is **translation of thought to text.** The policy presupposes that the *act of drafting* is where the learning happens. If you outsource the drafting, you outsource the learning. This is a defensible pedagogical stance, but it should be framed as **Pedagogical Integrity**, not **Academic Plagiarism.**

  ### Summary Recommendation

  Your policy is currently a **category error** dressed up as regulation. It treats a statistical engine as a moral thief and uses statistical tea-leaves (detectors) to judge moral guilt.

  If you were to revise it based on the **Simulator** model:
  1.  **Rename the Offense:** Move from "Plagiarism" to "Undisclosed AI Assistance" or "Misrepresentation of Authorship."
  2.  **Shift the Burden:** Do not punish the *use*; punish the *concealment*.
  3.  **Kill the Detectors:** They are scientifically unreliable and create the exact injustice you witnessed with your classmate.
  4.  **Assess the Student, Not the Text:** Design assessments where the text is merely the ticket to the conversation (oral defense), ensuring the human mind behind the text is the one being graded.

  The policy makes sense only if you assume the institution cares more about **risk management** (having a clear rule to punish) than **ontological coherence**. To fix it, you must align the punishment with the actual harm: not theft, but the falsification of educational certification.
