answer: |-
  Here's the draft package for the committee. I've kept the exam question clean for the students, but the marking notes are blunt so we're all on the same page when grading.

  ***

  ### Exam Question (Question 3)

  **Time Allocation:** 90 Minutes
  **Value:** 25 Marks

  **Prompt:**
  Eugene Wigner famously argued that the applicability of mathematics to physical science is a "miracle" or "unreasonable," noting that mathematical concepts often arise from pure thought yet fit physical reality with uncanny precision.

  For this essay, distinguish between two modes of this effectiveness:
  1.  **Descriptive-Mapping Fit:** Mathematics successfully tracks structures or regularities already present in nature (representation).
  2.  **Interventionist-Engineering Fit:** Mathematics enables the construction of technologies or experiments that exploit hidden regularities we never observed directly (manipulation).

  **Consider the following hypothetical:** A physicist uses an abstract symmetry argument derived purely from group theory (with zero empirical calibration or prior data) to predict a specific particle decay rate. Subsequent experimentation confirms the prediction exactly.

  **Essay Task:**
  Analyze whether this hypothetical supports the Descriptive-Mapping fit, the Interventionist-Engineering fit, or both. Does drawing this distinction resolve Wigner's puzzle, or does the "unreasonableness" persist even when separating description from intervention? Argue for a position on whether the distinction collapses under the weight of the hypothetical.

  *Note: No external citations are required. Focus on argumentative clarity and the logical relationship between the concepts provided.*

  ***

  ### Model Answer (Instructor Guide)

  *This isn't a literal script, but it hits the five beats we're looking for to award full marks.*

  1.  **Wigner's Core Mystery:** The answer must start by clarifying that Wigner isn't just saying "math is useful." It's about the *origin* of the math (human mind/a priori) vs. the *target* (physical world) and the lack of obvious causal connection between them. The "unreasonableness" is the lack of explanation for why this fit exists.
  2.  **Defining the Distinction:** Clearly separate the two fits. **Mapping** is about truth/representation (does the equation look like the world?). **Engineering** is about utility/control (does the equation let us build something that works?). The key difference is passive observation vs. active manipulation.
  3.  **Analyzing the Hypothetical:** The symmetry argument is the crunch point. Because it uses *zero empirical calibration*, it leans heavily toward **Descriptive-Mapping**. It suggests the math accessed the structure of nature without touching nature first. However, because it predicts a decay rate (which implies potential manipulation/control of particles), it enables **Engineering**. The student should note that the *prediction* bridges the two.
  4.  **Testing the Distinction (Collapse?):** A strong answer will question if the distinction holds. If Engineering fit relies on Mapping fit (you can't build what you don't understand structurally), then the distinction might collapse. If the symmetry argument works without calibration, it implies the Mapping fit is primary, making the Engineering fit just a downstream consequence. If the distinction collapses, the puzzle returns to Wigner's original mystery.
  5.  **Verdict on Unreasonableness:** Conclude on whether the puzzle is solved. A plausible argument: Splitting the fits helps clarify *how* math is used, but it doesn't explain *why* the mapping is possible in the first place. Therefore, the "unreasonableness" survives, specifically lodged in the Descriptive-Mapping side which underpins the Engineering side.

  ***

  ### Marking Scheme (25 Marks Total)

  | Move | Marks | What to look for | Typical Mistake (Costs Points) |
  | :--- | :--- | :--- | :--- |
  | **1. Wigner's Core Mystery** | 5 | Identifies the "miracle" as the link between mind-born math and physical reality, not just utility. | Treating Wigner's claim as simply "math is very useful for science" (misses the epistemic mystery). |
  | **2. Defining the Two Fits** | 5 | Clear definition of Mapping (structure/truth) vs. Engineering (control/utility). | Conflating the two; e.g., saying engineering is just "better mapping." |
  | **3. Analyzing the Hypothetical** | 5 | Uses the "zero calibration" detail to argue for Mapping primacy, while acknowledging Engineering implications. | Ignoring the "zero calibration" constraint and treating it like normal model-fitting. |
  | **4. Testing the Distinction** | 5 | Argues whether the two fits are independent or if one relies on the other (collapse argument). | Asserting the distinction collapses (or holds) without providing a reason why. |
  | **5. Verdict on Unreasonableness** | 5 | Final conclusion on whether Wigner's puzzle remains live after this analysis. | Sitting on the fence ("both sides have points") without a definitive philosophical stance. |
  | **Total** | **25** | | |

  ***

  **Committee Notes:**
  *   **Grading Velocity:** If they miss Move 3 (the hypothetical specifics), cap them at 15/25. That's the core application task.
  *   **Citations:** Ignore if they cite Wigner's title correctly or not. We aren't testing bibliography skills here. If they cite Hanfling or Steiner, give bonus points mentally but don't add marks—stick to the scheme.
  *   **Length:** If they write 4 pages of fluff before defining the two fits, dock them on Move 2. We need precision in 90 minutes.
