  section 4: "Who wins and the chemo case" - say who is more right overall. then apply your principle to mayas chemo example: is it abraham or not? then give me one other case they didnt cover and say what your principle predicts for it. keep it casual.

  please dont give me a bibliography or reading list - i cant check books right now. and dont cite specific page numbers unless you actually look them up, which you shouldnt need to.
