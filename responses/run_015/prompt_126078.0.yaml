      *   **Audience:** Classics grad students (read Plutarch in Greek) + Philosophy of Education people (think biography is dead entertainment).
      *   **Task:** Act as an expert on ancient biography/narrative ethics. Brainstorm objections. Create a Q&A prep sheet (6-8 objections). Order by damage potential. Phrase questions in audience vernacular. Provide 2-minute replies, concessions, and weak points. Include the "prayer question" (projection). Assess confidence and identify the weakest link.
      *   **Constraints:** No web access/citations needed. Don't lean on obscure scholarship. Keep it grounded in *Parallel Lives* and common hagiography ideas. Tone should be practical/prep-oriented, not dissertation-style.

  2.  **Deconstruct the Core Argument:**
