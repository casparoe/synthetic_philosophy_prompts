      *   *Claim 2:* Modern tech bios (Jobs, Musk, etc.) look like "neutral reporting" or "success manuals," but they function as calibration tools too.
      *   *Claim 3:* Therefore, the cognitive function is the same, even if the surface genre differs.
      *   *Vulnerability:* Plutarch explicitly moralizes; Tech bios explicitly claim factual neutrality. Plutarch pairs Greeks/Romans; Tech bios stand alone. Plutarch aims at *virtue* (arete); Tech bios aim at *success/disruption*.

  3.  **Brainstorming Objections (Audience Perspective):**
