prompt: |-
  I'm giving a talk next thursday at an interdisclipinary seminar defending a kinda weird view: Plutarch's Parallel Lives isnt about copying heroes, its about using paired lives as a mental calibration tool for practical judgement — and modern tech-founder hagiographies do the exact same cognitive job even though they look like neutral reporting. I'm a software engineer with zero formal philosophy background, just someone who reads this stuff on weekends, so please prep me like I'm actually standing up there, not writing a dissertation.

  Please act as an expert on ancient biography and narrative ethics. Think carefully and do some quick brainstorming before you lay out the objections. I need a Q&A prep sheet: about 6-8 objections I'll actually get from the audience, which is mostly classics grad students who read Plutarch in greek plus a couple philosophy-of-education people who think biography is dead entertainment. Order them by damage potential, phrase them the way those grad students actually talk, and for each give me a two-minute reply, what I should concede, and where the reply gets soft. Include the question I'm praying nobody asks — probably something about whether I'm just projecting Silicon Valley onto antiquity.

  Also say how confident you are in this framing overall, and point out the one part you're least sure about — maybe whether Plutarch intended any calibration function or if I'm inventing it. Keep everything grounded in the Parallel Lives and common hagiography ideas; dont ask for citations or a bibliography since I wont have web access, and dont lean on obscure scholarship I wouldnt have memorized anyway.
reasoning: |-
  Here's a thinking process that leads to the suggested Q&A prep sheet:

  1.  **Analyze the Request:**
      *   **Speaker:** Software engineer, no formal philosophy background, reads on weekends.
