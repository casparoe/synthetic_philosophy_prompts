prompt: |-
  I sit on the board of a regional land trust, and I have been asked to draft the written opinion the board will vote on at its meeting four weeks from now. I would like you to draft that opinion for me.

  The case is this. A donor has left us a restricted bequest of approximately $4.3 million to buy and restore a 1,140-acre block of retired farmland adjoining an existing national wildlife refuge. The land is currently tilled row crop under a lease that expires next year; the plan our staff has put forward is to buy the tract, breach the drainage tiles, and re-flood roughly 880 acres as shallow marsh and wet meadow, with the remainder held in perennial grass, plus a small endowment for long-term stewardship. The gift is restricted in its terms to the permanent protection and restoration of native habitat for the benefit of fish and wildlife. The donor's instructions also require that the restored land be managed passively: no supplemental feeding, no culling, no predator or pest control, and no manipulation of water levels except to maintain the target plant communities. A conservation easement reflecting those instructions would be recorded at closing.

  The board is split almost evenly, and the disagreement has more substance than I expected.

  Our staff ecologist argues that the comparison on offer is not marsh versus nothing, but marsh versus tilled field. Drained cropland already carries its own animal population — voles, ground-nesting birds, deer, an enormous invertebrate biomass — and its yield enters a food system with a welfare footprint of its own. She also notes that restoration delivers flood attenuation, water-quality improvements, carbon retention in the peat, and habitat for listed species, and that the alternative is not that the money goes to some better cause: if we decline a restricted gift, it passes to the residuary beneficiary and the land most likely goes either back into row crop or into a twenty-year solar-and-grazing lease a developer has already offered the owners, which would keep the acreage in grass and pay nothing to us. Finally, she says, we have no way to aggregate welfare across an ecosystem, and declining to act because of an unmeasurable total is itself an action with very large welfare consequences taken on even thinner evidence.

  A second member, a retired economist, has circulated a dissent. Her claim is that the relevant comparison is not only between two land uses but between animals that would exist and animals that would not. Her reading of our own projections is that reflooding 880 acres would add breeding populations on the order of tens of thousands of amphibians and waterbirds and many times that in fish, with the overwhelming majority of the young dying within weeks by predation, starvation, disease, or winter kill, and with periodic botulism die-offs in the waterbird colony. Her conclusion is that we would be creating, year after year, a very large quantity of short lives that end badly, and that doing so in the name of benefiting wildlife is confused: the animals in question do not yet exist, so we are not benefiting them by bringing them into being unless their lives are worth living, which is exactly what is in question. She proposes a standing rule — the trust should not fund projects that increase expected wild-animal suffering, with the burden of proof on the project's proponents — and she applies it using a rough accounting that weights each animal-week by a discount for what she calls phenomenal simplicity, on the grounds that a tadpole's or a nestling's experience is simpler and matters less than an adult's, and that counts only increments above the cropland baseline.

  A third member accepts much of this but says the honest conclusion, if she is right, is not that we should refrain from restoring this tract but that we should be retiring habitat elsewhere, and that a rule with that implication cannot be stated publicly by an organization that depends on donors and on its standing as a conservation charity. A fourth has proposed a compromise: restore a smaller marsh footprint, and commit a fixed share of the bequest's investment income for ten years to a monitoring program that measures welfare-relevant outcomes directly — survivorship, body condition, disease events — and to research on humane fertility control for overabundant species, on the theory that whether restoration helps or harms is a question our sector is about to spend a great deal of money acting on elsewhere, and information now has value beyond this tract.

  What I need is a memo I can circulate ahead of the vote. It should:

  1. Give a concrete recommendation — accept the bequest and restore as planned, accept and restore in modified form, seek to have the gift's terms modified by a court or by the donor's family, or decline — with a timeline for whatever steps follow.

  2. Take the economist's argument at its strongest and say plainly what would follow if she is right, rather than retreating to the claim that welfare cannot be measured.

  3. Address how the restriction to the benefit of fish and wildlife should be read, given that it may mean benefit to species and populations or benefit to individual animals, and say whether the passive-management requirement is a constraint we have discovered or a substantive moral choice we would be making.

  4. Recommend whether the trust should adopt a standing welfare screen for future projects and, if not that, what weaker version — if any — it should adopt.

  5. Deal with the institutional consideration honestly, without allowing donor opinion or public defensibility to settle the question on its own.

  6. State what evidence or argument would change the recommendation, and what we should do while we lack it.

  Please argue from the considerations themselves; I don't need citations or reading suggestions. The memo should run roughly 900 to 1,100 words and be written so that a board member who disagrees with its conclusion can still see that their case was understood.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** Board member of a regional land trust.
      *   **Task:** Draft a written opinion (memo) for the board to vote on in four weeks.
      *   **Context:** A $4.3M restricted bequest to buy/restore 1,140 acres of farmland adjoining a wildlife refuge. Plan: Buy, breach tiles, re-flood 880 acres (marsh/wet meadow), rest in grass, small endowment.
      *   **Restrictions:** Permanent protection/restoration of native habitat for fish/wildlife. Passive management (no feeding, culling, predator control, minimal water manipulation). Conservation easement recorded at closing.
      *   **Conflict:** Board is split.
          *   *Staff Ecologist:* Marsh vs. Tilled Field. Restoration offers ecosystem services (flood, water, carbon), habitat for listed species. Alternative is row crop or solar/grazing (no money to trust). Declining means money goes elsewhere, land likely stays crop or solar. Welfare aggregation is impossible; inaction has consequences too.
          *   *Retired Economist (Dissent):* Marsh vs. Nothing (new animals). Reflooding creates tens of thousands of short, suffering lives (predation, starvation, disease). Creating lives isn't benefiting them unless lives are worth living. Proposes standing rule: Don't fund projects increasing expected wild-animal suffering (burden on proponents). Uses discount for "phenomenal simplicity" (tadpoles matter less).
          *   *Third Member:* If economist is right, we should retire habitat elsewhere, but can't say that publicly (donor relations/charity status).
          *   *Fourth Member (Compromise):* Smaller marsh, commit income to monitoring/welfare research (survivorship, humane fertility control). Information has value.
      *   **Requirements for the Memo:**
          1.  Concrete recommendation (Accept/Modify/Seek Modification/Decline) + Timeline.
          2.  Take economist's argument at strongest (don't retreat to "welfare unmeasurable").
          3.  Address restriction interpretation (species/populations vs. individuals) and passive management (constraint vs. moral choice).
          4.  Recommend on standing welfare screen (yes/no/weaker version).
          5.  Deal honestly with institutional considerations (donors/public standing) without letting them settle the question.
          6.  State what evidence/argument would change the recommendation and what to do meanwhile.
      *   **Tone:** Argue from considerations, no citations, 900-1100 words, respectful of dissent (steel-manning).

  2.  **Determine the Recommendation:**
      *   *Option A (Accept as planned):* Ignores the welfare suffering argument too much.
      *   *Option B (Decline):* Loses the land to crop/solar, loses funding, ignores ecosystem services.
      *   *Option C (Modify/Compromise):* Seems most prudent. Accept the gift but incorporate the monitoring/research aspect (Fourth Member's idea) to address the uncertainty around welfare. This acknowledges the economist's concern without paralysis.
      *   *Decision:* I will recommend **Accepting the bequest and restoring in modified form** (specifically incorporating the monitoring/research commitment). This balances the ecological imperative with the ethical uncertainty.

  3.  **Drafting - Section by Section:**

      *   **Header/Intro:** Standard memo format. State purpose.
      *   **Recommendation & Timeline:** Clear statement. Accept gift, restore, but allocate funds for monitoring/research. Timeline: Vote now, close in 6 months, monitoring plan in 1 year.
      *   **Addressing the Economist (Welfare Argument):** Steel-man this. If she is right, we are manufacturing suffering. Acknowledge that "benefit to wildlife" is ambiguous. If individual welfare is the metric, restoration might fail. Don't hide behind "we can't measure." Admit the uncertainty.
      *   **Interpretation of Restrictions:** "Benefit of fish and wildlife" usually means species/populations (conservation biology standard), not individuals. However, passive management *is* a moral choice we are adopting by accepting the gift, not just a legal constraint. We are choosing non-intervention.
      *   **Standing Welfare Screen:** Recommend against a rigid ban (paralysis risk) but adopt a "Welfare Impact Statement" for future projects (weaker version). Require consideration of suffering, not necessarily a veto.
      *   **Institutional Considerations:** Acknowledge the third member's point. We can't say "we know this causes suffering but do it anyway." But we also can't let fear of donor reaction dictate ethics. The compromise (research) makes us look thoughtful, not negligent.
      *   **Uncertainty & Future Evidence:** What changes mind? Data showing net negative welfare. Meanwhile, proceed with caution (monitoring).

  4.  **Drafting - Word Count & Tone Check:**
      *   Need to be concise but thorough.
      *   Tone must be deliberative, respectful, and decisive.
      *   Ensure all 6 requirements are met.
      *   Target: 900-1100 words.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did I address the "phenomenal simplicity" discount? *Adjustment:* Mention it when discussing the economist's argument.
      *   *Check:* Did I address the passive management constraint? *Adjustment:* Clarify that accepting the gift means accepting the constraint, which limits our ability to mitigate suffering later.
      *   *Check:* Is the recommendation concrete? *Adjustment:* Ensure the modification (monitoring fund) is specific.
      *   *Check:* Institutional honesty? *Adjustment:* Acknowledge that declining hurts the trust's viability, but accepting without addressing welfare risks moral complicity.

  6.  **Writing - First Pass (Mental or Scratchpad):**
      *   Start with the recommendation. Accept with modifications.
      *   Discuss the economist. She says we create suffering lives. If true, is it worth it? We can't say welfare is unmeasurable to dodge this. We must admit we don't know.
      *   Restrictions: "Benefit" usually means ecological integrity. But passive management prevents us from fixing suffering later. That's on us.
      *   Policy: No hard ban, but require welfare consideration.
      *   Institutional: We need money, but not at cost of integrity. Research commitment helps reputation.
      *   Evidence: If monitoring shows horrific suffering, we reconsider future phases.

  7.  **Writing - Second Pass (Focusing on Flow and Constraints):**
      *   Make sure the transition between the economist's view and the recommendation is smooth.
      *   Ensure the word count is within range. (Aiming for ~1000).
      *   Check the "Timeline" requirement.
      *   Check the "What would change recommendation" requirement.

  8.  **Final Polish:**
      *   Verify the tone is appropriate for a board memo (formal but direct).
      *   Ensure the dissent is treated fairly (not dismissed as naive).
      *   Check the specific constraints on passive management (no culling, etc.) are mentioned as part of the moral choice.

  *(Self-Correction on Word Count)*: I need to be careful not to be too verbose. I will expand on the reasoning for the welfare screen and the interpretation of the restriction to ensure I hit the minimum while maintaining quality. I will ensure the "institutional consideration" section is nuanced—not just "we need money" but "we need to maintain trust while doing good."

  *(Self-Correction on Recommendation)*: The prompt asks for a concrete recommendation. I will recommend accepting the gift *provided* we can legally allocate a portion of the endowment income to the monitoring/research proposed by the fourth member. If legally restricted against that, we need to know. I will assume for the memo that the restriction allows stewardship costs which can encompass monitoring.

  *(Final Check on Requirements)*:
