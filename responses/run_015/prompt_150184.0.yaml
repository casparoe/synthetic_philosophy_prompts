answer: |-
  Your unease is well-founded. While your friend has grasped the general spirit of Parfit's Reductionism, her summary contains a significant philosophical error regarding the "branching case" (the two replicas) and conflates two distinct concepts Parfit works hard to keep separate: **identity** and **what matters in survival**.

  Here is an audit of her summary, distinguishing accurate reflections of Parfit's *Reasons and Persons* (1984) from simplifications and substantive misrepresentations.

  ### 1. Accurate Reflections: The Core Argument
  **Claim:** *Psychological continuity matters more than bodily continuity; the replica carries memories, intentions, and personality.*
  **Verdict:** **Accurate.**
  Parfit uses the teletransporter to argue against the "Simple View" (that you are a separately existing ego or soul) and for the "Complex View." He argues that personal identity consists in nothing more than psychological connectedness (memory, character, intention) and continuity (overlapping chains of connection) carried by the brain and body. If a replica on Mars has full psychological continuity with you, Parfit agrees that this is sufficient for **survival**.

  **Claim:** *Brain patterns are essentially information (Reductionism).*
  **Verdict:** **Accurate (in spirit).**
  Parfit is a Reductionist. He believes a person is just a brain and body, and a series of interrelated physical and mental events. The "software" analogy is a common shorthand for his view that there is no "deep further fact" (like a soul) holding the person together beyond these physical and psychological relations.

  ### 2. Subtle Misrepresentations: Identity vs. What Matters
  **Claim:** *The replica literally is you.*
  **Verdict:** **Simplification / Philosophical Blur.**
  Parfit is notoriously careful here. In the standard (non-branching) teletransporter case, he suggests we can *say* the replica is you, but his deeper point is that the question of strict **identity** is empty. He argues that **identity is not what matters**. What matters is "Relation R" (psychological connectedness and continuity).
  *   **Why it matters:** If you say the replica *is* you, you imply a one-to-one logical relation. Parfit wants to shift the focus to the *degree* of psychological connection. He argues we should care about survival (Relation R), not strict identity. Your friend treats identity as the primary vehicle of survival, whereas Parfit argues identity is often irrelevant to survival.

  **Claim:** *Identity comes in degrees.*
  **Verdict:** **Misrepresentation.**
  This is a critical technical error. Parfit explicitly argues that **identity does not come in degrees**; it is an all-or-nothing, logical relation (either $A = B$ or $A \neq B$).
  *   **What comes in degrees:** *Relation R* (psychological connectedness). You can be more or less connected to your future self.
  *   **The Error:** Your friend claims *identity* is fractional. Parfit claims *what matters* is a matter of degree, which is why strict identity is not the fundamental concept. By claiming identity itself is divisible, she contradicts Parfit's logical framework.

  ### 3. Major Misrepresentation: The Branching Case
  **Claim:** *If two replicas are made, identity splits like an estate; each gets a "fractional share" of your identity.*
  **Verdict:** **False.**
  This is the most significant deviation from Parfit's actual view. Parfit discusses this exact scenario (the "Branching Case") extensively.
  *   **Parfit's View:** In the branching case, strict **identity does not hold**. Logic dictates that if Replica A is you, and Replica B is you, then A must be B. But A and B are two different people living on Mars. Therefore, the Original cannot be *identical* to either.
  *   **The Consequence:** Parfit concludes that in the branching case, **you do not survive as either replica** (in terms of identity). *However*, **what matters** (survival/Relation R) is present in both. He famously calls this "double survival."
  *   **The Correction:** Parfit does **not** argue that identity divides. He argues that identity *vanishes* in the branching case, but because identity isn't what matters, this is not a bad outcome. Your friend's claim that you retain "fractional identity" is a view Parfit explicitly rejects (sometimes associated with "conventionalism" or "four-dimensionalism," but not Parfit's Reductionism).

  ### 4. The Legal and Moral Inference
  **Claim:** *Because identity splits, legal obligations and rights split like property.*
  **Verdict:** **Non-Sequitur / Misrepresentation.**
  This conclusion does not follow from Parfit's actual view for two reasons:
  1.  **Metaphysical:** Since Parfit denies that identity splits (he says identity fails in branching), there is no "fractional identity" to serve as the basis for splitting legal status.
  2.  **Normative:** Parfit does suggest that psychological continuity is the basis for moral responsibility (e.g., the replica should be punished for the original's crime because they share the intentions and memories). However, he treats this as a **normative proposal** (how we *ought* to treat them), not a metaphysical necessity.
      *   If there are two replicas, Parfit would likely argue that *both* are fully responsible for the original's debts/crimes (because both have full psychological continuity), not that they each owe 50%. To split the debt would imply the psychological continuity was halved, which it is not. Both replicas have 100% of the memories and intentions.

  ### 5. Summary of the Audit

  | Claim by Friend | Parfit's Actual View | Verdict |
  | :--- | :--- | :--- |
  | **Psychological continuity matters more than bodily continuity.** | Yes, Relation R is what matters. | **Accurate** |
  | **The replica literally is you.** | Identity is empty; survival (Relation R) is what matters. | **Simplification** |
  | **Identity comes in degrees.** | Identity is all-or-nothing; *Relation R* comes in degrees. | **Misrepresentation** |
  | **Branching creates fractional identity.** | Branching destroys identity; survival is "double." | **Major Misrepresentation** |
  | **Rights/debts split like property.** | Responsibility follows psychological continuity (likely full for both). | **False Inference** |

  ### Conclusion
  Your friend's summary captures the *vibe* of Parfit's Reductionism (we are just psychological patterns), but it fails on the technical philosophy that makes Parfit's view unique.

  **Does the claim that two replicas would split your rights like property follow from anything true in his actual view?**
  **No.** It follows from a misunderstanding of his view. Parfit argues that in the branching case, identity ceases to exist, but survival is doubled. Since both replicas possess the full psychological continuity required for moral responsibility, Parfit's logic would suggest **both** are fully responsible, not that they share a fractional responsibility. The idea of "dividing identity like an estate" is precisely the kind of "deep further fact" thinking Parfit seeks to dismantle.

  You are right to be uneasy. Your friend has inadvertently reconstructed a view Parfit argues *against*: the idea that identity is a substance that can be carved up. Parfit's radical conclusion is that identity isn't a substance at all, so it cannot be split—it simply dissolves when branching occurs, leaving only what matters (psychological continuity) standing in its place.
