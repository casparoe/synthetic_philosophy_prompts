      *   *Did Parfit say the replica is you?* In the normal case, he says we can *describe* it as survival, but the deep fact is Relation R. In the branching case, he says identity *does not hold*. The friend says identity *does* hold but splits. This is the opposite of Parfit.
      *   *Legal implications:* Parfit does discuss responsibility. He argues the replica is responsible for the original's crimes *because* of psychological continuity, not because of strict identity. But the "fractional debt" idea is not Parfitian.

  7.  **Final Polish:** Check against the prompt requirements (distinguish accurate, simplification, misrepresentation). Ensure the "fractional share" claim is explicitly debunked. (Proceed to generate output).

