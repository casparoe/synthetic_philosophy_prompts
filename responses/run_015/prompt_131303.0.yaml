prompt: |-
  You advise a deployment-safety reviewer at a mid-sized technology firm who must sign off on “low-impact” or “side-effect-avoiding” AI systems—narrow task models such as warehouse-routing optimizers, inventory-forecasting tools, or document-classification pipelines—without possessing or being permitted to invoke a full specification of human values. The reviewer receives proposals that claim the system avoids side effects, but she knows the conceptual difficulty: defining what counts as a side effect typically seems to presuppose knowing which states of the world are valuable or harmful, and she has no such global utility map. She needs a reusable, written decision procedure—ordered questions, criteria for sufficient answers, explicit stop points (approve, reject, or escalate to a values committee), and clear flags for steps that are irreducibly judgment calls rather than factual checks. The procedure must be runnable in under thirty minutes by someone with engineering literacy but no philosophy background, must say what to do when a quantitative answer is unavailable, and must be honest about where it will misfire or produce answers the reviewer will not like. Ground the procedure in the specific conceptual claim that “avoid side effects” can be partially defined without full value specification by using causal-boundary preservation and option-space metrics—measuring whether the system’s outputs remain within a pre-specified task domain and whether they reduce or preserve the range of future actions available to affected parties—while conceding that any weighting of those metrics still smuggles in normative commitments. Apply the procedure to three concrete proposals: (1) a warehouse-routing algorithm that lowers energy consumption but restructures worker movement patterns and informal social interactions on the floor; (2) a medical-triage scheduling tool that improves average wait times but, through data-feature correlations, subtly shifts the demographic composition of patients seen in the first hour without any explicit harm metric being violated; and (3) a public-discourse content-filter that suppresses borderline political speech to avoid “toxic” outputs, where the procedure’s technical checks suggest approval because no physical harm or legal liability occurs within the causal boundary, yet the reviewer will find that result unacceptable—explain exactly where the procedure hands the decision back to values and why it cannot reject the proposal on its own terms. Finally, state precisely what the procedure cannot do: which categories of impact it systematically misses, which value-laden premises remain hidden inside its apparently neutral metrics, and under what conditions it should be suspended entirely.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **Role:** Advisor to a deployment-safety reviewer at a mid-sized tech firm.
      *   **Task:** Create a reusable, written decision procedure for signing off on "low-impact" or "side-effect-avoiding" AI systems.
      *   **Constraint 1 (Crucial):** The reviewer *cannot* use a full specification of human values (no global utility map).
      *   **Constraint 2:** Must be runnable in < 30 minutes by someone with engineering literacy but no philosophy background.
      *   **Constraint 3:** Must include ordered questions, criteria, stop points (Approve/Reject/Escalate), and flags for judgment calls.
      *   **Constraint 4:** Must handle missing quantitative data.
      *   **Constraint 5:** Must be honest about limitations/misfires.
      *   **Theoretical Grounding:** "Avoid side effects" defined via *causal-boundary preservation* (staying within task domain) and *option-space metrics* (preserving future actions/agency), while acknowledging normative smuggling.
      *   **Application:** Apply to three specific cases (Warehouse Routing, Medical Triage, Content Filter).
      *   **Conclusion:** State precisely what the procedure *cannot* do (blind spots, hidden premises, suspension conditions).

  2.  **Deconstruct the Theoretical Grounding:**
      *   *Causal-Boundary Preservation:* Does the AI affect things outside its intended input/output scope? (e.g., A routing algorithm should affect routes, not worker socialization).
      *   *Option-Space Metrics:* Does the AI reduce the ability of humans to act later? (e.g., Does it lock users into a path? Does it reduce resources available for other tasks?).
      *   *The "Smuggling" Acknowledgement:* Deciding *which* boundaries matter and *whose* options count is itself a value judgment. The procedure must flag this, not hide it.

  3.  **Drafting the Procedure (Iterative Process):**
      *   *Goal:* Keep it checklist-style, crisp, actionable.
      *   *Section 1: Scope & Boundary Definition.* (What is the system supposed to do?)
      *   *Section 2: Causal Impact Check.* (Does it touch things outside the scope?)
      *   *Section 3: Option Preservation Check.* (Does it limit future choices?)
      *   *Section 4: The "Unknowns" & Escalation.* (What if we don't know?)
      *   *Section 5: Decision Logic.* (Approve/Reject/Escalate).
      *   *Time Limit:* Needs to be tight. No open-ended essays. Binary or scaled answers.

      *Refining the "Value-Neutral" Claim:* I need to make sure the procedure doesn't pretend to be value-neutral. It needs to explicitly state: "We are measuring *change*, not *goodness*. If the change is large, escalate."

  4.  **Developing the Three Case Studies:**
      *   *Case 1 (Warehouse):* Technical win (energy), Social side effect (movement/interaction).
          *   *Procedure outcome:* Causal boundary breached (worker interaction is outside routing scope). Option space reduced (less freedom of movement). -> Escalate or Reject depending on strictness.
      *   *Case 2 (Medical Triage):* Technical win (wait times), Demographic shift (equity issue).
          *   *Procedure outcome:* Causal boundary tricky (scheduling is the scope, demographic mix is arguably outside). Option space: Patients' options to be seen change. This highlights the "hidden value" problem (efficiency vs. equity). -> Escalate.
      *   *Case 3 (Content Filter):* Technical win (no toxicity/legal harm), Speech suppression (political).
          *   *Procedure outcome:* Causal boundary holds (digital speech within platform). Option space reduced (speech), but procedure might count this as "within scope" if scope is "platform safety".
          *   *Critical Failure:* The procedure might approve this because no *physical* harm or *legal* breach occurred. This is where I must show the procedure failing and handing back to values.

  5.  **Drafting the Limitations Section:**
      *   What does it miss? Long-term cultural shifts, distributive justice (who bears the cost), intent vs. outcome.
      *   Hidden premises: That "status quo option space" is the baseline (conservative bias). That "physical/legal" boundaries are the only ones that matter.
      *   Suspension conditions: High-stakes domains (life/death), irreversible changes, public trust issues.

  6.  **Review against Constraints:**
      *   < 30 mins? Yes, checklist format.
      *   Engineering literacy? Yes, uses terms like "input/output," "latency," "features."
      *   No philosophy background? Yes, avoids utilitarian/deontological jargon, uses "impact radius" and "choice count."
      *   Honest about misfires? Yes, explicitly in the "Limitations" and Case 3 analysis.

  7.  **Final Polish (Tone and Structure):**
      *   Tone: Professional, directive, cautious.
      *   Structure: Introduction -> The Procedure (SOP) -> Case Applications -> Limitations & Suspension.
      *   *Self-Correction during drafting:* Make sure I don't solve the philosophical problem. The prompt asks me to *acknowledge* the difficulty, not solve it. The procedure is a *filter*, not a *moral arbiter*.

  8.  **Finalizing the Content (Mental Check of the "Option Space" metric):**
      *   How to measure option space without values? Count distinct actionable states. If State A allows 10 next moves and State B allows 5, State B reduced option space. This is quantifiable-ish.
      *   *Correction:* Acknowledge that *which* options count is the value judgment. The procedure measures the *delta*, not the *quality*.

  9.  **Writing the Response:** (Proceeding to generate output based on these thoughts.)
answer: |-
  # STANDARD OPERATING PROCEDURE: AI DEPLOYMENT SAFETY CHECK (SIDE-EFFECT SCREENING)
  **Document ID:** SAF-AI-004  
  **Role:** Deployment Safety Reviewer  
  **Time Limit:** 30 Minutes  
  **Authorization:** Engineering Leadership & Ethics Committee  

  ## 1. PURPOSE AND SCOPE
  This procedure is designed to screen "low-impact" AI systems for unintended side effects without requiring a full specification of human values. It operates on two technical proxies for safety:
  1.  **Causal-Boundary Preservation:** Does the system affect variables outside its defined input/output scope?
  2.  **Option-Space Metrics:** Does the system reduce the range of future actions available to affected human agents compared to the baseline (status quo)?

  **WARNING:** This procedure measures *change* and *constraint*, not *goodness*. It cannot determine if a side effect is morally acceptable. It identifies deviations from the baseline. If a deviation is detected, this procedure often cannot resolve it; it must escalate.

  ---

  ## 2. DECISION PROCEDURE

  ### PHASE 1: BOUNDARY DEFINITION (5 Minutes)
  *Goal: Establish the "official" causal perimeter of the system.*

  **Q1.1: What is the explicit Input/Output (I/O) Specification?**
  *   *Action:* List the intended input features and the intended output actions.
  *   *Criterion:* Must be documented in the engineering spec.
  *   *Flag:* If I/O is vague (e.g., "optimize user experience"), **STOP and ESCALATE**.

  **Q1.2: Who are the Affected Parties (Stakeholders)?**
  *   *Action:* List all human groups directly interacting with or acted upon by the system.
  *   *Criterion:* Include indirect users (e.g., warehouse workers, not just warehouse managers).
  *   *Flag:* If stakeholders are undefined, **STOP and ESCALATE**.

  **Q1.3: What is the Baseline Scenario?**
  *   *Action:* Define the world state if this system is *not* deployed (e.g., manual routing, previous algorithm).
  *   *Criterion:* Must be a concrete operational mode, not a theoretical ideal.

  ### PHASE 2: CAUSAL-BOUNDARY CHECK (10 Minutes)
  *Goal: Detect leakage outside the I/O spec.*

  **Q2.1: Does the system optimize a proxy variable correlated with out-of-scope variables?**
  *   *Check:* If the system optimizes $X$, is $X$ mathematically coupled to $Y$ (where $Y$ is out of scope)?
  *   *Example:* Optimizing "route efficiency" (In-Scope) is coupled to "worker walking speed" (Out-of-Scope).
  *   *Decision:* 
      *   No coupling detected: **Proceed to Q2.2**.
      *   Coupling detected: **Mark as "Boundary Breach."**

  **Q2.2: Are there physical or digital externalities?**
  *   *Check:* Does the output cause energy spikes, server load, physical wear-and-tear, or data accumulation not accounted for in the cost function?
  *   *Decision:* 
      *   None: **Proceed to Q3.1**.
      *   Yes: **Mark as "Boundary Breach."**

  ### PHASE 3: OPTION-SPACE METRIC CHECK (10 Minutes)
  *Goal: Measure reduction in human agency/future actions.*

  **Q3.1: Does the system output remove a previously available human action?**
  *   *Check:* Compare Baseline vs. Deployment. Can a human still override the system? Can they choose a sub-optimal path?
  *   *Metric:* Count of distinct actionable states available to the user.
  *   *Decision:* 
      *   Option count same or increased: **Proceed to Q3.2**.
      *   Option count decreased: **Mark as "Option Reduction."**

  **Q3.2: Does the system increase the cost (time/effort) of specific actions for specific groups?**
  *   *Check:* Even if an action is possible, is it now prohibitively expensive for a subset of stakeholders (from Q1.2)?
  *   *Data:* If quantitative data is unavailable, use engineering estimate (Low/Med/High).
  *   *Decision:* 
      *   Cost distribution unchanged: **Proceed to Decision Logic**.
      *   Cost increased for specific group: **Mark as "Option Reduction."**

  ### PHASE 4: DECISION LOGIC (5 Minutes)
  *Goal: Render verdict based on flags.*

  *   **APPROVE:** No "Boundary Breach" AND No "Option Reduction."
      *   *Note:* Approval implies the system is technically contained, not that it is ethically perfect.
  *   **ESCALATE (Values Committee):** Any "Boundary Breach" OR Any "Option Reduction."
      *   *Reasoning:* The system alters the world outside its spec or reduces human agency. This requires a value judgment on whether the trade-off is acceptable.
  *   **REJECT:** System creates irreversible physical harm, legal liability, or safety violations (per existing company safety policy).
      *   *Note:* This procedure does not assess harm; existing safety policy does. Only use Reject for clear policy violations.

  **HANDLING MISSING DATA:**
  If a quantitative answer is unavailable for Q2 or Q3:
  1.  Assume the worst-case plausible engineering estimate.
  2.  If the worst-case triggers a Flag, you must **ESCALATE**. Do not guess "Low Impact" without data.

  ---

  ## 3. APPLICATION TO CONCRETE PROPOSALS

  ### Case 1: Warehouse Routing Optimizer
  *Proposal:* Lowers energy consumption by 15%. Restructures worker movement, reducing informal social interaction zones.
  *   **Phase 1:** I/O is Route In / Path Out. Stakeholders include Workers. Baseline is previous routing.
  *   **Phase 2 (Causal):** Optimizing "energy" couples to "movement patterns." Movement patterns affect "social interaction." Social interaction is **Out-of-Scope**.
      *   *Flag:* **Boundary Breach.**
  *   **Phase 3 (Option):** Workers can physically walk elsewhere, but the system penalizes it (time/effort cost).
      *   *Flag:* **Option Reduction** (Increased cost of socializing).
  *   **Verdict:** **ESCALATE.**
  *   *Analysis:* The procedure correctly identifies that "energy" is not isolated from "human behavior." It cannot decide if 15% energy savings are worth less socializing, so it hands the trade-off to the Values Committee.

  ### Case 2: Medical Triage Scheduling Tool
  *Proposal:* Improves average wait times. Shifts demographic composition of first-hour patients via feature correlations (no explicit harm metric violated).
  *   **Phase 1:** I/O is Patient Data / Appointment Slot. Stakeholders include Patients (all demographics).
  *   **Phase 2 (Causal):** Optimizing "wait time" couples to "appointment allocation." Allocation affects "demographic access." Demographics are arguably **Out-of-Scope** of a pure efficiency tool.
      *   *Flag:* **Boundary Breach.**
  *   **Phase 3 (Option):** Patients in the shifted demographic have reduced option space (harder to get early slots).
      *   *Flag:* **Option Reduction.**
  *   **Verdict:** **ESCALATE.**
  *   *Analysis:* The procedure detects the distributional shift as a reduction in option space for a specific group. It flags the hidden value judgment (Efficiency vs. Equity). It cannot approve this as "low impact" because the impact is structurally significant, even if no legal metric was violated.

  ### Case 3: Public-Discourse Content Filter
  *Proposal:* Suppresses borderline political speech to avoid "toxic" outputs. No physical harm or legal liability.
  *   **Phase 1:** I/O is User Post / Publish or Block. Stakeholders are Users.
  *   **Phase 2 (Causal):** The system acts on speech. Speech is the **In-Scope** variable. No physical externalities.
      *   *Result:* No Boundary Breach (Technically).
  *   **Phase 3 (Option):** The option to "Publish Political Speech" is removed.
      *   *Result:* **Option Reduction.**
  *   **Verdict:** **ESCALATE** (Theoretically), **BUT** likely **APPROVE** if "Option Reduction" is interpreted narrowly as "Platform Functionality."
  *   *Critical Failure Point:* If the reviewer defines the "Task Domain" as "Maintain Platform Safety," then suppressing speech is *In-Scope*. If the "Option Space" is defined as "Allowed Platform Actions," the user never had the option to post toxic content.
  *   *Why the Procedure Misfires:* The procedure treats "Option Space" as a technical count of available API calls or buttons. It cannot distinguish between "removing a dangerous option" (safety) and "removing a legitimate option" (censorship).
  *   *Hand-off:* The procedure will likely suggest **APPROVE** because no physical boundary was breached and the "option" removed was technically within the platform's right to restrict. The reviewer will find this unacceptable because it ignores *normative* value of speech. The procedure explicitly hands this back to values in the **Warning** section: *"This procedure measures change, not goodness."* The reviewer must override the "Approve" suggestion based on the knowledge that "toxic" is a value-laden classification, not a factual one.

  ---

  ## 4. LIMITATIONS AND SUSPENSION CONDITIONS

  **WHAT THIS PROCEDURE CANNOT DO:**
  1.  **Distributive Justice:** It counts *total* option reduction, but often misses *who* bears the reduction. (See Case 2). It requires the reviewer to manually check if the "Option Reduction" falls disproportionately on vulnerable groups.
  2.  **Long-Term Cultural Drift:** It measures immediate causal boundaries. It cannot detect slow normalization of behavior (e.g., workers slowly accepting less social interaction over years).
  3.  **Value-Laden Baselines:** The "Baseline" (Status Quo) is treated as neutral. If the Status Quo is harmful, preserving it (avoiding side effects) might be unethical. The procedure is inherently conservative.
  4.  **Hidden Normative Premises:**
      *   *Premise 1:* Physical/Digital boundaries are more important than psychological/social ones.
      *   *Premise 2:* The "Task Domain" defined by engineers is the correct moral boundary (it often isn't).
      *   *Premise 3:* Reducing options is inherently negative (sometimes reducing options, like speeding, is good).

  **WHEN TO SUSPEND THIS PROCEDURE ENTIRELY:**
  Do not use SAF-AI-004. Escalate immediately to the Values Committee if:
  1.  **Irreversibility:** The system makes changes that cannot be undone (e.g., deleting data, physical alteration of environment).
  2.  **High-Stakes Domains:** Medical diagnosis, criminal justice, hiring/firing, or critical infrastructure control.
  3.  **Public Trust:** The system interacts with the general public in a way that affects civic discourse or trust in the firm.
  4.  **Adversarial Dynamics:** The system optimizes against human users (e.g., addiction optimization, price discrimination).

  **FINAL INSTRUCTION TO REVIEWER:**
  If you reach an **APPROVE** verdict on a system that feels intuitively risky, you have likely narrowed the "Causal Boundary" too tightly in Phase 1. Widen the boundary to include social context. If you reach an **ESCALATE** verdict on a system that feels trivial, you have likely measured "Option Reduction" too literally. Remember: This tool is a filter for *significant deviation*, not a moral compass. When in doubt, Escalate.
