answer: |-
  **Joint Statement on the Norm of Assertion**

  **1. Agreed Claims**

  1. In ordinary central cases, knowledge and reasonable belief coincide; therefore, only divergence cases carry evidential weight.
  2. The unassertability of Moore-paradoxical conjunctions is data to be explained, not data that settles the norm alone.
  3. Reluctance to flat-out assert lottery propositions on purely statistical grounds is data to be explained, not proof of a knowledge rule.
  4. "Improper" (criticism-worthy), "Defective" (standard failed, no fault), and "Infelicitous" (pragmatically off) are three distinct verdicts.
  5. A large share of recorded disagreement collapses into mismatches about which verdict is being requested.
  6. Norms govern hedged, prefaced, and relayed speech, not only flat-out assertion.
  7. A complete account must specify how hedged norms relate to the norm for the unhedged case.
  8. The practice of assertion has a point (e.g., knowledge-transmission, evidence-pooling, deliberative record).
  9. The point of the practice constrains which norms can govern it, even if it does not settle the norm.
  10. Truth enters as an independent standard of assessment, but camps disagree on whether it is a condition of order.
  11. No testing of a norm is valid where the speaker's evidence base is unspecified.
  12. No testing of a norm is valid where what the hearer takes the evidence base to be is unspecified.
  13. Data description must be granular enough that the two norms come apart in the scenario.
  14. *Intuitive blame judgments are relevant data, though interpretation of what they track is contested.*
  15. *Both camps accept that constitutive rules must have observable consequences in practice.*
  16. *Neither camp claims its norm explains all linguistic phenomena alone.*

  **2. Disagreements Table**

  | Issue | Neutral Statement | Knowledge Camp (KC) | Reasonable-Belief Camp (RBC) | Verdict | Data Needed |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Constitutive vs. Regulative** | Is the rule part of assertion's identity or a guide? | Constitutive: Assertion is defined by the knowledge rule; violation changes the act. | Regulative: Assertion is defined by intent; the norm guides proper use. | Substantive | KC must show practice dissolves without K-rule; RBC must show practice persists with JB. |
  | **Evidence Base** | Whose evidence counts for the norm? | Speaker's personal knowledge state, regardless of office or role. | Evidence legitimately available to the speaker in their capacity, including office data. | Substantive | Spokesperson case (see Section 3) blame distribution across personal vs. institutional framing. |
  | **Invariant vs. Contextual** | Does the norm shift with conversational context? | Invariant: Knowledge is always required; stakes change evidence needed for K. | Contextual: The justification threshold shifts with practical stakes or context. | Substantive | Local-standard case (see Section 3) readiness to assert across lab vs. newsroom contexts. |
  | **Truth Rule Rival** | Is truth the only norm, with K/JB merely instrumental? | Rival view: Truth alone is insufficient; knowledge is the non-instrumental standard. | Rival view: Truth is the goal; justification is the non-instrumental standard for order. | Verbal/Collapse | Audit game (see Section 3) measuring blame when Truth is met but K/JB fails. |
  | **Point Settles Norm** | Does the practice's purpose dictate the norm? | Yes: If the point is knowledge-transmission, the norm must be knowledge. | No: The point constrains but does not dictate; reasonable belief suffices for transmission. | Substantive | Empirical study on whether hearers retain knowledge or merely true belief from assertions. |

  **3. Cruxes**

  **The Retrospective Case.**
  *Sub-question:* An assertion, fully reasonable when made (justified), of a proposition that was never known and turns out false.
  *Why it moves us:* KC must blame the speaker or call it defective; RBC must call it proper.
  *Case:* Speaker asserts *p* based on strong misleading evidence. *p* is false.
  *Predictions:* KC predicts assessors will call the assertion "defective" but not "improper" if blame is withheld. RBC predicts assessors will call it "proper" and withhold "defective" verdicts entirely. If blame is assigned, RBC loses; if no defect is found, KC loses.

  **The Spokesperson's Case.**
  *Sub-question:* A designated spokesperson asserts a safety claim on a report she cannot check; personally, she only believes it.
  *Why it moves us:* Tests whether the evidence base is personal or institutional.
  *Case:* Spokesperson asserts *p* based on committee report. Personal evidence is weak; office evidence is strong.
  *Predictions:* KC predicts blame tracks personal knowledge (improper if she doesn't know). RBC predicts blame tracks office justification (proper if office evidence justifies). Naive assessors will blame less in institutional framing if RBC is right.

  **The Evidentiality Test.**
  *Sub-question:* In languages with obligatory grammatical marking of information source, how is unmarked assertion used?
  *Why it moves us:* Tests if assertion is a single force governed by one rule or a family of commitments.
  *Case:* Typological survey of unmarked forms in evidential languages.
  *Predictions:* KC predicts unmarked forms are restricted to direct knowledge/perception. RBC predicts unmarked forms track reliable inference/reporting, not just direct knowledge. Corpus study will show frequency of unmarked forms in inferred contexts.

  **The Audit Game.**
  *Sub-question:* Sender relays claim to Decider; vary evidence (perception, testimony, statistics, Gettier) and truth.
  *Why it moves us:* Measures whether blame tracks Knowledge, Justification, or Truth.
  *Case:* Sender asserts *p*. *p* is true/false. Evidence varies.
  *Predictions:* KC predicts blame tracks Knowledge absence (high blame in Gettier/False). RBC predicts blame tracks Justification absence (low blame in Gettier/False if justified). The impropriety/defect split will fall on Truth for KC, Justification for RBC.

  **The Local-Standard Case.**
  *Sub-question:* Two contexts with different evidentiary thresholds (Lab: replicate; Newsroom: attribute).
  *Why it moves us:* Tests invariant norm vs. contextual norm.
  *Case:* Competent participants in Lab vs. Newsroom asserting same proposition with same evidence.
  *Predictions:* KC predicts readiness to assert tracks knowledge (invariant); criticism tracks failure to know. RBC predicts readiness tracks local convention (contextual); criticism tracks failure to meet local threshold. If assertion rates diverge while knowledge stays constant, KC must explain via evidence thresholds.

  **4. What Would Move Us**

  **Knowledge Camp:** We would abandon the Knowledge Norm if empirical data from the Audit Game shows that blame tracks justification perfectly in cases where knowledge is absent but truth is present. Specifically, if speakers are deemed "proper" despite lacking knowledge when justification is high, we must concede the norm is not knowledge. We would then have to give up the claim that knowledge is constitutive of assertion.

  **Reasonable-Belief Camp:** We would abandon the Reasonable-Belief Norm if data shows that speakers are blamed equally for asserting justified falsehoods as they are for asserting unjustified truths. Specifically, if the Retrospective Case yields high blame for false assertions despite perfect justification, we must concede justification is insufficient. We would then have to give up the claim that truth is merely an independent standard.

  **5. Closing**

  This collaboration clarifies that many disputes were verbal, centering on the distinction between "improper" and "defective." Once separated, the residual disagreement is genuinely evaluative: whether the practice of assertion is fundamentally a vehicle for knowledge or for justified belief. The disputes regarding constitutive rules and contextual standards are answerable to the tests in Section 3. Currently, no data exists to settle the Evidentiality Test or the Audit Game predictions. We commit to publishing the results of these studies without revision to our pre-registered predictions. Until then, we agree to disagree on the constitutive nature of the norm, acknowledging that both sides meet the ground rules for argumentation.
