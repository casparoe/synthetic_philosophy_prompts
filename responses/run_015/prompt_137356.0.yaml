answer: |-
  1. You argue that during a scientific revolution, what changes is the taxonomic lexicon—the structure of kind terms—rather than just the beliefs attached to them. But if two theories are talking about the same world, why isn't a change in belief enough to explain the friction? What work is the lexical claim doing that a standard propositional account of theory change doesn't already handle?
  [If you reply that propositions depend on the taxonomy: Doesn't this push the problem back a step? How do we identify the taxonomy shift without already assuming the theories are incompatible?]

  2. A common objection to incommensurability is that it conflates genuine untranslatability with a simple failure of interpretive charity—that historians just haven't tried hard enough to find the mapping. How do you distinguish a limit on translation from a limit on the historian's imagination or effort?
  [Given you'll likely say there's a cognitive limit to charity: Where is the non-arbitrary line drawn? What prevents skeptics from claiming every failed translation is just a lack of effort?]

  3. Critics often suggest this is just Quinean indeterminacy of translation dressed up in historical costume. Quine argued that manual construction is underdetermined by behavior; you argue lexicons are underdetermined by evidence. What prevents your view from collapsing into Quine's global skepticism about meaning?
  [If you distinguish based on locality: If the mechanism of underdetermination is the same, does the scope really matter for the epistemological worry?]

  4. You emphasize that incommensurability is local and partial, meaning a shared base vocabulary often survives a revolution. But if enough terms remain stable to anchor the discussion, why doesn't that shared base eventually allow for a bridge language that restores full translatability?
  [If you argue the shared terms function differently in the new structure: Doesn't that imply the shared terms aren't actually shared, leaving us with no common ground to even identify the shift?]

  5. Consider a hypothetical revolution where the successor theory reproduces every observational prediction of its predecessor, both camps use the exact same vocabulary and instruments, and yet each reports they cannot make sense of the other's claims. Does your account predict this is possible, and would you classify it as incommensurability?
  [Anticipating you'll say yes, this is pure lexical divergence: What would a historian have to observe in the archive to stop trying to translate and conclude incommensurability is present, rather than concluding the surviving record is just too thin to recover the context?]

  6. If rival theories are untranslatable, they lack a common measure. But if there is no common measure of problem-solving success, in what sense can you claim the successor science is better rather than just different?
  [If you appeal to rational theory choice without rules: Without a common metric, isn't "rationality" reduced to internal coherence, making the choice between theories ultimately arbitrary?]

  7. You maintain this view is consistent with a broadly realist account of reference, presumably via a causal chain rather than descriptive content. But if the taxonomic structure changes, doesn't the causal chain itself get re-routed, breaking the reference link to the same natural kinds?
  [If you argue reference is stable despite lexical change: How do we verify that stability without relying on the very descriptions you say are in flux?]

  8. There is a worry that your reading leaves little daylight between Kuhn and the symmetry thesis in the sociology of scientific knowledge, where change is caused rather than justified. If reasons are local to a lexicon, doesn't justification become local too, leaving only social causes to explain the switch?
  [If you insist rationality survives the shift: Can you specify a rational factor that operates across the lexical boundary without smuggling in a neutral language you deny exists?]

  9. What observation would count as evidence against your view? Is there a historical case where you would concede full translatability was possible despite a apparent revolution, or is the theory insulated from falsification by always attributing failure to the historian's perspective?
  [If you offer a specific historical counter-example: Wouldn't a proponent of standard semantics argue that successful translation in that case proves the lexicon wasn't the barrier after all?]

  10. Why should any of this matter to working scientists rather than only to historians and philosophers? Does understanding lexical incommensurability offer a practical tool for navigating contemporary theory change, or is it purely a retrospective diagnostic?
  [If you say it helps scientists understand resistance to new ideas: Does it help them overcome that resistance, or does it ultimately suggest they are talking past each other regardless of the evidence?]
