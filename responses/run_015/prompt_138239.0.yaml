  2.  **Theoretical Foundation (Mental Sandbox):**

      *   *Prisoner's Dilemma (PD):* Temptation > Reward > Punishment > Sucker. Defection is dominant strategy in one-shot. Cooperation requires iterated play + shadow of the future.
      *   *Assurance Game (Stag Hunt):* Reward > Temptation (or mutual coop is best, but risk of unilateral defection). Problem is trust/coordination, not exploitation.
      *   *Shadow of the Future (Axelrod):* Cooperation evolves if the probability of future interaction ($w$) is high enough. $w > (T-R)/(T-P)$.
      *   *Noise/Error:* Tit-for-Tat fails with noise. Needs "Generous Tit-for-Tat" or "Win-Stay, Lose-Shift."
      *   *Reputation:* Indirect reciprocity. If others watch, defection costs more.
      *   *Endgames:* Known end leads to backward induction (defect immediately). Unknown end sustains cooperation.

