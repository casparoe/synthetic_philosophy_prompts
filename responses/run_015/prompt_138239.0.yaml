      *   *Step 4: Noise/Ambiguity.*
          *   *Rule:* Generous Tit-for-Tat. Forgive first ambiguity. Retaliate only on confirmed pattern.
      *   *Step 5: Audience.*
          *   *Rule:* If audience exists, cooperation yields reputation capital. Defection costs more.

      *   *Refining for "One Page/15 Mins":* Needs to be a flowchart or checklist. Let's go with a numbered Decision Tree.
      *   *Outputs:* Map the theoretical outcomes to the required stances.
