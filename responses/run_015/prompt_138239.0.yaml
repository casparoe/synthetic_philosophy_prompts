answer: |-
  # The Supplier Cooperation Protocol (SCP-1)

  **Purpose:** To replace intuition with game-theoretic consistency in supplier decisions.
  **Time:** 15 Minutes. **Owner:** Buyer. **Audit:** Head of Supplier Relationships (HoSR).
  **Theory Base:** Iterated Prisoner's Dilemma, Shadow of the Future, Noise Tolerance.

  ---

  ### PART 1: THE DECISION TREE

  **STEP 1: GAME TYPE (Is this a Prisoner's Dilemma?)**
  *Ask: If we cooperate and they defect, do they gain a **net advantage** over mutual cooperation?*
  *   **NO (Assurance/Coordination):** Their best outcome is *also* mutual cooperation; they only defect if they fear *we* will. (e.g., Technical alignment, shared cost-saving, contract interpretation).
      *   **ACTION:** **Cooperate Unconditionally.** Signal commitment to remove their fear.
      *   **FILE NOTE:** "Test 1 Failed: Assurance Game. Incentives align."
      *   **STOP.**
  *   **YES (Prisoner's Dilemma):** They gain short-term advantage by defecting while we cooperate. (e.g., Price hikes, quality shading, capacity hoarding).
      *   **ACTION:** Proceed to Step 2.

  **STEP 2: THE SHADOW OF THE FUTURE (Continuity Score)**
  *Estimate the probability ($w$) that the **same decision-maker** faces the **same consequences** in the next round.*
  *   **Contract Remaining:** >2 yrs (1 pt), 1-2 yrs (0.5 pt), <1 yr (0 pts).
  *   **Counterparty Stability:** Same rep >2 yrs (1 pt), New rep <1 yr (0 pts).
  *   **Dependency:** They need us as much as we need them (1 pt), We are small account (0 pts).
  *   **TOTAL SCORE:**
      *   **< 1.0 (Low Shadow):** Proceed to Step 3.
      *   **≥ 1.0 (High Shadow):** Proceed to Step 4.
      *   **DATA MISSING:** If rep tenure or contract end is unknown, mark "Unknown" and default to **Low Shadow**.

  **STEP 3: ENDPOINTS (The Backward Induction Check)**
  *Is there a known end-date to the relationship?*
  *   **YES (Known to Both):** Cooperation unravels immediately.
      *   **ACTION:** **Reduce Exposure / Withdraw.** Do not invest in joint value.
      *   **FILE NOTE:** "Test 3: Known Endgame. Defection dominant."
      *   **ESCALATE:** If withdrawal requires contract termination, send to HoSR.
      *   **STOP.**
  *   **YES (Known Only to Us):** *Critical:* Theory says exploit asymmetry. **BUT** reputational risk is high.
      *   **ACTION:** **Cooperate Conditionally.** Maintain performance but freeze new investment.
      *   **FILE NOTE:** "Test 3: Asymmetric End. Reputation risk flagged."
      *   **ESCALATE:** Send to HoSR for ethical/reputational sign-off.
      *   **STOP.**
  *   **NO (Indefinite):** Proceed to Step 4.

  **STEP 4: NOISE TOLERANCE (Ambiguous Defection)**
  *Is the suspected defection verifiable?*
  *   **YES (Clear Breach):** Proceed to Step 5.
  *   **NO (Ambiguous/Noise):** Calculate Cost of Error.
      *   *Cost of False Positive* (Accusing partner wrongly) vs. *Cost of False Negative* (Being exploited).
      *   **If False Positive Cost > False Negative:** (e.g., Sole source, high switching cost).
          *   **ACTION:** **Cooperate Conditionally + Forgiveness.** Absorb first instance, document second.
      *   **If False Negative Cost > False Positive:** (e.g., Commodity, many suppliers).
          *   **ACTION:** **Reduce Exposure.** Treat as defection until proven otherwise.
      *   **FILE NOTE:** "Test 4: Noise Rule. Cost Ratio [High/Low]."

  **STEP 5: AUDIENCE (Reputation Multiplier)**
  *Do other suppliers observe this interaction?*
  *   **YES (Shared Pool/Industry):** Defection here signals weakness or aggression to others.
      *   **ACTION:** **Escalate.** HoSR to manage signal. (Punishment must be public and justified).
      *   **FILE NOTE:** "Test 5: Audience Present. Signaling required."
      *   **ESCALATE:** Send to HoSR.
      *   **STOP.**
  *   **NO (Bilateral):**
      *   **ACTION:** **Cooperate Conditionally (Tit-for-Tat).** Match their last move.
      *   **FILE NOTE:** "Test 5: Bilateral. Standard Reciprocity."

  ---

  ### PART 2: LIVE CASE DIAGNOSIS

  #### Case A: Packaging Tray (11-Year Sole Source)
  *   **Step 1 (Game Type):** **NOT A PRISONER'S DILEMMA.**
      *   *Reasoning:* 11-year sole source implies deep interdependence. A price hike via index clause is likely cost-pass-through (Survival) rather than exploitation (Greed). Their best outcome is keeping you as a stable anchor. This is an **Assurance Game**: both sides want the contract to hold, but fear the other will break it over cost.
      *   *Diagnosis:* **Assurance.**
      *   *Stance:* **Cooperate Unconditionally** (on relationship), **Conditionally** (on clause). Engage in joint contract review. Do not treat as adversarial.
      *   *File Note:* "Test 1 Failed: Assurance Game. Incentives aligned on continuity."
  *   **Risk:** Treating this as a PD (e.g., threatening to switch immediately) manufactures a crisis where none exists.

  #### Case B: Logistics Provider (Merger Endgame)
  *   **Step 1 (Game Type):** **Prisoner's Dilemma.** (They want investment; we want service).
  *   **Step 2 (Shadow):** **Low.** (Contract ends in 5 months).
  *   **Step 3 (Endpoints):** **Known to Us, Unknown to Them.**
      *   *Theory:* Defect (Do not fund). The "Shadow of the Future" is zero. Investment yields no return.
      *   *Reality:* Reputational suicide if discovered.
      *   *Stance:* **Reduce Exposure / Escalate.**
      *   *Recommendation:* **Do not co-fund.** Game theory dictates this is a sunk cost. However, because the end is confidential, you cannot use "contract ending" as the excuse.
      *   *Uncomfortable Truth:* You must decline the investment using other pretexts (budget freeze, strategic shift) or **Escalate to HoSR** to approve the reputational risk of burning a partner.
      *   *File Note:* "Test 3: Asymmetric End. Theoretical Defect recommended. Reputational Risk High." **ESCALATED.**

  #### Case C: Distributors (Shared Pool)
  *   **Step 1 (Game Type):** **Prisoner's Dilemma.** (Tragedy of the Commons).
  *   **Step 2 (Shadow):** **High.** (Ongoing relationship).
  *   **Step 4 (Noise):** **Verifiable.** (Audit permitted).
  *   **Step 5 (Audience):** **YES.** (Four distributors know each other).
      *   *Reasoning:* If you do not punish the defector, you signal to the other three that inflation is cost-free. Cooperation collapses.
      *   *Stance:* **Escalate.** Audit is required. If confirmed, penalty must be applied visibly to maintain the "regime" of cooperation among the four.
      *   *File Note:* "Test 5: Audience Present. Signaling required." **ESCALATED.**

  ---

  ### PART 3: LIMITATIONS & METRICS

  **Where This Procedure Will Misfire:**
  1.  **Irrational Actors:** If a counterparty values "winning" over profit (spite), the payoff matrix is wrong. *Mitigation:* Flag any history of litigiousness in Step 1.
  2.  **Legal Constraints:** Game theory may suggest "Defect" (e.g., Case B), but contract law or antitrust regulations may forbid it. *Mitigation:* The "Escalate" path for Legal is mandatory.
  3.  **The "Nice" Exploit:** This protocol is exploitable by a counterparty who knows you use it. If they know you forgive "Noise" (Step 4), they will defect ambiguously. *Mitigation:* Randomize audits.

  **What to Record (The Audit Trail):**
  To validate this in two years, every file note must include:
  1.  **The Test Number:** (e.g., "Test 3: Endpoint").
  2.  **The Continuity Score:** (0.0 to 3.0).
  3.  **The Outcome:** (Did they reciprocate in the next quarter?).

  **Metrics for Success:**
  *   **Reciprocity Rate:** % of "Cooperate Conditionally" decisions where the supplier matched cooperation in the next 90 days.
  *   **Dispute Cost:** Total cost of escalations vs. total cost of absorbed "noise."
  *   **Switching Shock:** % of supplier exits that caused production disruption (Should be near zero if Step 3 is followed).

  **Final Warning:**
  This procedure treats relationships as mathematical iterated games. It will tell you to abandon partners (Case B) when your instincts say "be loyal." It will tell you to trust partners (Case A) when your instincts say "negotiate hard." **Trust the procedure, but escalate the ethical outliers.** The math optimizes for value; you are responsible for the reputation.

  ---
  **HoSR Sign-off:** ___________________ **Date:** __________
  **Buyer:** ___________________ **Case ID:** __________
