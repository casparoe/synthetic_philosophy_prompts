      *   *Challenge 1 (Is it PD?):* Look at the payoff matrix. Does unilateral defection yield a higher payoff than mutual cooperation *for them*? If yes -> PD. If no (Mutual Coop is best for both, but fear prevents it) -> Assurance.
      *   *Challenge 2 (Identity):* "Continuity Index." 1-5 scale. Contract length, personnel tenure, financial health.
