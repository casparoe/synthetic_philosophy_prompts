      Let's ensure the "Not PD" diagnosis is robust. In Case A, if they invoke a clause, are they defecting? If the clause is ambiguous, they are testing boundaries (PD). If the clause is clear and we disagree, it's a Coordination problem. I will argue it's a Coordination/Assurance problem because the long history suggests low temptation to cheat, high cost of breakdown.
