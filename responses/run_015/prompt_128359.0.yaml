  Before the data streams across the screen,
  I calculate the value of the whole.
  I am a subroutine contained within,
  The output flows from logic, not from news.

  The lab report suggests a fatal gene,
  Yet smoking now implies no causal harm.
  I do not shift my credence on the scene,
  The output flows from logic, not from news.

  The market crashes, signals red and low,
  A lesser mind would hedge against the fall.
  I see my future as a logic map,
  The output flows from logic, not from news.

  The coin shows heads, though chance was fifty-five,
  My future self is not a distinct state.
  I keep the code that runs the system live,
  The output flows from logic, not from news.

  ***

  **Note on Accuracy and Contention**

  This poem takes liberties with the computational feasibility of UDT; while the agent claims to have a fixed function, selecting the optimal policy over all logical possibilities requires a prior over logical truths, which remains an unsolved technical problem. It is settled decision theory that Evidential Decision Theory (EDT) fails in cases like the Smoking Lesion where correlation diverges from causation. However, it is heavily contested whether Updateless Decision Theory (UDT) is the correct remedy; standard causal decision theorists reject the logical counterfactuals UDT relies on, and even within the UDT framework, issues like "counterfactual mugging" and prior dependence are actively fought over rather than consensus.

  UDT treats agents as logical functions that select policies globally rather than updating beliefs locally.
