      *   *Philosophy Check:* Ensure I'm not getting too bogged down in Hofstadter jargon. Keep it practical. "Essence" = Structural Invariants. "Style" = Metric Variations.
      *   *The "Counter-Entropy" term:* The user coined/used this. I need to define it operationally. Let's define it as "Counter Stability Index".
      *   *The "Minimal 'a'" case:* In typography, a single-story 'a' (like in Futura) still has a bowl (closed loop). A stem + diagonal with *no* bowl is basically an 'n' or a weird symbol. If the designer calls it an 'a', it's a stylistic break. The procedure should catch this as a potential identity break.

