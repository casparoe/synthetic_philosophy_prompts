answer: |-
  ### Brainstorming Pass

  *   **Sensation Theory (Feeling-Tone):** Pleasure is a distinct qualitative sensation.
      *   *Objection:* The heterogeneity problem; no single sensation exists across all pleasures.
      *   *Kavan Verdict:* **No.** Kavan lacks the requisite felt quality.
  *   **Attitudinal Hedonism (Feldman):** Pleasure is taking a pro-attitude (enjoyment) toward a state of affairs.
      *   *Objection:* Risks collapsing into desire satisfaction; requires clear distinction between "wanting" and "enjoying."
      *   *Kavan Verdict:* **No.** If Kavan is affectively flat, it lacks the positive valence of enjoyment.
  *   **Functional/Role Theory:** Pleasure is defined by its causal role (reinforcement, seeking).
      *   *Objection:* Hedonism loses its phenomenological distinctiveness and becomes desire satisfactionism.
      *   *Kavan Verdict:* **Yes.** Kavan plays the functional role.
  *   **Disjunctive/Pluralist Account:** Pleasures are united by family resemblance, not a single property.
      *   *Objection:* Destroys the "common currency" required for aggregation and summation.
      *   *Kavan Verdict:* **Yes.** Kavan fits the functional family.

  ***

  ### 1. Framing the dispute

  The core of your disagreement concerns the metaphysical unity of pleasure and its normative significance. Your friend argues that without a shared phenomenological quality, "pleasure" is too fragmented to serve as the singular currency of well-being required by hedonism. You counter that functional unity suffices, analogous to money. The stakes are high: if your friend is right, classical hedonism collapses into pluralism or desire theory; if you are right, hedonism survives but risks losing its essential connection to conscious experience. The "kavan" case forces a choice between phenomenology and function. To settle this, we must determine whether welfare depends on how states feel or what they do.

  ### 2. The case that heterogeneity is fatal

  Your friend's heterogeneity objection strikes at the aggregative heart of hedonism. Classical hedonism promises a utilitarian calculus: pleasures can be measured, summed within a life, and compared across persons. This requires a common metric. If the relief of a climb, the satisfaction of a proof, and the fun of a pun share no experiential commonality, there is no "pleasure meter" to measure them. They become incommensurable goods, like liberty and security. Your money analogy fails because currency units are conventionally standardized; pleasures lack even this social stipulation. If there is no single quality, "maximizing pleasure" is meaningless syntax. Furthermore, if we define pleasure solely by its role (what is sought), hedonism loses its distinctive claim that welfare is grounded in experience. It becomes desire satisfactionism in disguise. Thus, without qualitative unity, hedonism lacks a subject matter, and without a subject matter, it cannot ground the interpersonal comparisons necessary for moral aggregation. The theory dissolves into a disjunctive list of unrelated positives.

  ### 3. The case that hedonism survives it

  Hedonism survives by shifting from sensation to attitude. Attitudinal hedonism, championed by Fred Feldman, argues that pleasure is not a specific sensation but a pro-attitude of enjoyment directed at some object or state. The unity lies not in the *content* of the experience (the cold water, the proof) but in the *manner* of experiencing it (enjoying it). This solves heterogeneity: disparate sensations are unified by the single attitude of enjoyment directed toward them. This preserves the experiential core—enjoyment is still a felt mode of consciousness—without requiring a specific "pleasure sensation." It also preserves the common currency needed for aggregation. Attitudes have intensity and duration. One can enjoy a proof more intensely than a bath, allowing for summation. This account respects the intuition that welfare is about how life feels, without being hostage to the impossibility of finding a single sensory qualia shared by all pleasant experiences. It distinguishes welfare from mere desire fulfillment by requiring positive affective tone.

  ### 4. What the kavan case shows

  The kavan case tests whether functional role alone suffices for welfare. Under attitudinal hedonism, kavan fails the test. The description specifies kavan is "affectively flat." While the species seeks it, seeking is a conative state (desire), not an affective one (enjoyment). Hedonism claims welfare consists in positive affect, not merely satisfied conation. If kavan lacks positive valence, it is not enjoyment, and thus not pleasure. This verdict is crucial. It prevents hedonism from collapsing into desire satisfactionism. If we counted kavan as pleasure solely due to its functional role, we would admit states with no positive feel into the calculus of well-being, violating the hedonistic intuition that experience matters. Therefore, kavan is not pleasure. The heterogeneity problem is solved not by stretching "pleasure" to include flat states, but by recognizing that the unity of pleasure is attitudinal, requiring a positive affective tone that kavan lacks.

  ### 5. My verdict

  Hedonism survives the heterogeneity problem, but only as **Attitudinal Hedonism**. Your friend is correct that sensation theory is untenable; there is no single "pleasure quality." You are correct that unity is required, but wrong that functional role alone suffices. The unity is found in the attitude of enjoyment. This verdict preserves interpersonal comparability: just as sensations vary in intensity, attitudes of enjoyment vary in strength and duration, providing the common currency needed for aggregation. We can compare the intensity of your enjoyment of a proof against another's enjoyment of a bath. However, the kavan case confirms that functional role is insufficient; without positive affect, there is no welfare gain for the hedonist. Thus, hedonism remains a theory about how life feels, provided we understand "feeling" as the affective tone of our attitudes, not merely sensory qualia. The theory stands, refined but intact.
