  ### Facilitator's Secret Sheet (Do Not Distribute)

  *   **Gregorian Code Sequence:**
      *   Gen 1: 1-0-0
      *   Gen 2: 2-1-1 (Rule: +1)
      *   Gen 3: 3-2-2 (Rule: +1)
      *   ...and so on.
  *   **The Noise:** When collecting the manual from Gen *N*, rotate the paper 180 degrees before handing to Gen *N+1*.
      *   *Result:* `↑` becomes `↓`. The instruction "Add 1" becomes "Subtract 1".
      *   *Cascade:* Gen 1 writes `↑`. Gen 2 reads `↓`. Gen 2 sets code to 0-9-9 (wrap around). Gen 2 writes manual based on *their* success. Gen 3 receives rotated manual... The error compounds.
  *   **Popperian Codes:** Randomize per student to prevent accidental overhearing of clicks.
