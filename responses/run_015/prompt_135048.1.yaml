prompt: |-
  I work as a software engineer with no formal background in philosophy, and I am trying to work out whether functionalism about mental states—the view that what matters is causal or functional role rather than physical substrate—offers any real guidance for thinking about present and near-future AI systems. I understand the standard idea of multiple realisability: that the same mental state might be implemented in neurons, silicon, or something else entirely. But I have also encountered a more niche concern, namely that any functional description we actually use is tied to a particular “grain” of decomposition—say, attention-head dynamics versus individual weight updates—and that this grain-dependence may undermine the claim that radically different substrates could realise precisely the same state. There is also the related worry that substrate-specific constraints, such as energy-efficiency trade-offs or error-correction mechanisms, might implicitly shape the functional profile in ways that break realisation independence.

  Given that I have limited time and no laboratory access, which open questions or lines of work in this space matter most if the goal is to assess whether current architectures—transformers, state-space models, neuromorphic hardware—could instantiate mental states? Should we prioritise resolving the grain problem for functional descriptions, clarifying whether multiple realisability applies to token-level states or only to coarse-grained types, or investigating whether substrate constraints implicitly reshape the functional profile? Please rank these (and any upstream issues you think I am missing) and defend the ordering: which questions are upstream of others, which are tractable without empirical neuroscience, and what evidence or argument would cause you to reorder them? I am not asking for a bibliography or reading list; I want a defended research agenda with explicit criteria—importance for AI assessment, tractability for a non-specialist, and dependency on other answers—so that I can decide where to direct my effort.
