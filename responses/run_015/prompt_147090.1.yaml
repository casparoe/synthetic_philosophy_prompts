  I'm preparing a long-form feature on the ontology of spacetime and keep running into a framing problem I can't resolve. The standard account presents Newton's bucket as demonstrating that rotational acceleration is absolute with respect to empty space—an argument that seems to hand an immediate victory to spacetime substantivalism over relationism. But this framing feels anachronistic once general relativity enters: GR describes spacetime not as a static container but as a dynamic metric field, and phenomena like Lense-Thirring frame-dragging appear to tie local inertial frames to the distribution of distant cosmic matter, which sounds like Mach's principle in action. At the same time, relational programs—Barbour's shape dynamics being the most developed—claim to recover the bucket's parabolic water surface without ever invoking absolute space or absolute motion.

  Given these developments, I want to ask: hasn't the bucket argument been effectively superseded? Specifically, if the metric field itself supplies the inertial structure, and if cosmic matter can determine whether a bucket counts as rotating, doesn't this show that relationism has already absorbed Newton's phenomenon? Or is there a hidden false premise in assuming that a dynamical spacetime geometry is automatically more hospitable to Mach than to a modernized substantivalism—say, one that treats the metric field itself as the substantive entity relative to which rotation is defined?

