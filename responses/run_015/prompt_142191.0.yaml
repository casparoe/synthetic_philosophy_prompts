answer: |-
  There is no single, canonical name for this specific difficulty that enjoys the same recognition as "The Symbol Grounding Problem," though it is a well-recognized shadow in the literature. The difficulty you describe is the intersection of three established problems, none of which captures your specific "flow and grain" formulation perfectly on its own.

  The closest established names are **The Disjunction Problem** (in philosophy of mind) and **The Indeterminacy of Ostension** (in philosophy of language), often subsumed under **The Categorization Problem** (in cognitive robotics).

  However, because these terms carry historical baggage that might obscure the specific "sensorimotor grain" issue you are isolating, I will first define the established nearest neighbors to show where they depart from your case, and then coin the term that best fits your carving.

  ### 1. The Established Nearest Neighbors

  **A. The Disjunction Problem (Fodor, Dretske)**
  *   **Definition:** If a mental symbol is causally triggered by horses, but also triggered by cows in the dark, does the symbol mean HORSE or HORSE-OR-COW-IN-THE-DARK? The problem is to explain how the system gets the content right (HORSE) despite the causal history supporting the disjunction.
  *   **Fit:** This matches your "cup-or-mug-in-this-building" example perfectly. It addresses the underdetermination of content by causal history.
  *   **Departure:** The Disjunction Problem is traditionally framed around *misrepresentation* and *error* (how can I be wrong about a cow?). Your formulation is broader: it is about *individuation* and *segmentation* of the sensory flow before truth conditions even apply. You are asking how the "cow" is carved out of the flux, not just how the label is fixed.

  **B. The Indeterminacy of Ostension / "Gavagai" (Quine)**
  *   **Definition:** When a native points to a rabbit and says "Gavagai," the observer cannot know from the pointing alone whether the word means "rabbit," "undetached rabbit part," "temporal stage of a rabbit," or "rabbit-ing."
  *   **Fit:** This matches your child/tomato example. It addresses the infinite ontological interpretations of a single pointing act.
  *   **Departure:** Quine's focus is on *translation between languages* and the indeterminacy of *reference*. Your focus is on the *internal selection mechanism* of a single system grounding its own symbols in its own sensorimotor flow.

  **C. The Categorization Problem (Harnad, Cangelosi)**
  *   **Definition:** Within the Symbol Grounding literature, this is the problem of how a system learns to group non-symbolic sensory inputs into invariant categories (e.g., "red things") that can then be named.
  *   **Fit:** Harnad explicitly states that grounding requires categorization. You are describing the internal difficulty of that categorization step.
  *   **Departure:** "Categorization" is a broad umbrella term for the *process*. It does not name the specific *difficulty of underdetermination* you are highlighting.

  ### 2. The Friend's Suggestion: The Problem of Universals

  Your friend is half-right. The **Problem of Universals** is the metaphysical question: *Do properties like "Redness" or "Cup-hood" exist independently of the particular red things or cups?*

  Your problem is the **Epistemological Problem of Universals**: *Given that we interact with particulars, by what right do we group them under a universal?*

  The sensorimotor setting changes the question from "Do universals exist?" to "Which universal does the system's architecture select?" It moves the puzzle from metaphysics to cognitive architecture.

  ### 3. The Coined Term: The Grounding Granularity Problem

  Since the established terms focus on error (Disjunction), translation (Gavagai), or process (Categorization), none sharply captures the *selection of ontological grain* in a continuous sensorimotor flow. I propose the following term and definition to settle the edge cases you described.

  **Term:** **The Grounding Granularity Problem**

  **Definition:**
  The Grounding Granularity Problem is the difficulty of selecting the *level of abstraction* and *respect of similarity* at which a symbol is anchored to a sensorimotor flow, given that any finite history of causal interactions is consistent with infinite alternative groupings of that flow.

  It arises when:
  1.  **Input is Continuous:** The system receives a flux (e.g., pixel arrays, voltage changes) rather than pre-individuated objects.
  2.  **History is Finite:** The system has a limited set of past interactions (training data, ostensive pointings).
  3.  **Groupings are Underdetermined:** Multiple distinct categories (e.g., "cups," "cups-in-this-building," "things-cast-shadow-X") fit the history perfectly but diverge on future cases.
  4.  **Internal State is Identical:** The system's internal confidence and classification output remain identical regardless of which grouping is actually operative.

  **Boundary Cases (to sharpen the definition):**

  *   **Case 1 (Not Granularity):** A system fails to recognize a cup because its camera is broken.
      *   *Verdict:* This is a **Hardware Failure**, not a Granularity Problem. The flow is interrupted, not underdetermined.
  *   **Case 2 (Not Granularity):** A system recognizes cups, but we argue about whether the word "cup" refers to the Platonic form of Cup or the set of all physical cups.
      *   *Verdict:* This is the **Metaphysical Problem of Universals**. The system's operation is unaffected; the dispute is external.
  *   **Case 3 (The Core Case):** A system classifies an object as a "cup." It has never seen a mug. It has only seen cups in Building A.
      *   *Scenario A:* It correctly classifies a mug in Building B as a "cup." (It grounded *cup-hood*).
      *   *Scenario B:* It rejects the mug in Building B. (It grounded *cup-in-Building-A-hood*).
      *   *Scenario C:* It rejects a cup in Building B that casts no shadow. (It grounded *cup-casting-shadow-X-hood*).
      *   *Verdict:* In all three scenarios, the system's *past* behavior and *internal states* during training were identical. The Grounding Granularity Problem is the fact that there is no fact of the matter, visible from the training history alone, about which of these three systems you built.

  ### Summary

  If you need to cite established literature, refer to it as the **Disjunction Problem** applied to **Perceptual Categorization**.

  If you need a term that cuts to the specific bone of your puzzle (the continuous flow and the selection of grain), use **The Grounding Granularity Problem**. It distinguishes itself from the Symbol Grounding Problem (which is about *connection* to the world) by focusing on the *resolution* of that connection (which *slice* of the world is grabbed).

  **Why this distinction matters:**
  The Symbol Grounding Problem assumes that once you touch the world, you are safe. The Grounding Granularity Problem shows that touching the world is not enough; you must touch the *right parts* of the world, and the world does not label its own parts for you.
