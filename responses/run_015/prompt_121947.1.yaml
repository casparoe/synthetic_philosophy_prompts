  2.  **Deconstruct the Philosophical Concepts:**
      *   **Origin Essentialism (Kripke):** A person's identity is tied to their specific biological origin (specific sperm and egg). If the origin changes, the person changes.
      *   **Gattaca's Premise:** "Valids" (engineered) vs. "In-valids" (natural). Vincent (natural) assumes Jerome's (engineered) identity.
      *   **Tension:** Vincent functions as Jerome socially and professionally, but biologically he is distinct. Does the film suggest Vincent *is* Jerome because he performs the role, or does his biology constantly threaten to reveal his "true" self (origin)?
      *   **Non-Identity Problem (Parfit):** If Vincent's parents had chosen to engineer him (different gametes), he wouldn't exist. A different child would exist. Therefore, Vincent cannot complain he was harmed by being born naturally, because the alternative was non-existence, not existence as a Valid.

