answer: |-
  You have identified a critical weakness in your team's case. Your teammate is using a folk heuristic ("better safe than sorry") as if it were a rigorous ethical framework. In philosophy and policy analysis, this is often called the **Precautionary Principle**, but as you've noticed, the colloquial version often smuggles in unexamined assumptions.

  The phrase "better safe than sorry" is not a single argument; it is a placeholder for several different decision rules. When pressed, it tends to slide between them to avoid refutation. Below is an unpacking of four distinct interpretations of the phrase, ranging from the modest to the extreme, along with an evaluation of their viability for your debate resolution.

  ### 1. The Prudential Truism (Weak Risk Aversion)
  **The Principle:** *When outcomes are uncertain, it is rational to prefer options with lower variance over options with higher variance.*

  *   **What it claims:** Uncertainty itself is a cost. If we don't know what a technology will do, we should proceed slowly or gather more data.
  *   **Plausibility:** **High.** Almost everyone agrees that acting blindly is bad. This is a standard principle of rational decision-making.
  *   **Resolves Action/Inaction Tension?** **No.** This principle suggests *caution*, but it does not define what caution looks like. Caution could mean a moratorium, but it could also mean strict regulation, phased rollouts, or sandboxed testing. It does not inherently justify a *ban*.
  *   **Supports Moratorium?** **Weakly.** It supports *delay* until uncertainty is reduced, but if the uncertainty can only be reduced *by* using the technology (e.g., we need to test geoengineering to know if it works), a moratorium prevents the very data gathering this principle demands.
  *   **Verdict:** This is too weak to win a round. It justifies oversight, not necessarily a moratorium.

  ### 2. The Asymmetric Stakes Argument (Catastrophic Prioritization)
  **The Principle:** *The magnitude of a potential harm outweighs the probability of its occurrence when that harm is existential or irreversible.*

  *   **What it claims:** Even if the chance of AI killing everyone is 1%, it outweighs a 99% chance of economic boom. The downside is so large (infinity/death) that it dominates the calculation.
  *   **Plausibility:** **Moderate.** This is the strongest version of your teammate's argument. It aligns with "Pascal's Wager" style reasoning regarding existential risk.
  *   **Resolves Action/Inaction Tension?** **Partially.** It prioritizes the risk of the *technology*. However, it fails if the *moratorium* also carries catastrophic risk. For example, if banning geoengineering leads to guaranteed climate collapse (100% chance of catastrophe) vs. geoengineering having a 10% chance of catastrophe, this principle would actually demand *using* the technology.
  *   **Supports Moratorium?** **Conditionally.** It only supports a moratorium if the risk of the technology is greater than the risk of the status quo. Your teammate assumes the status quo is "safe," which is a contested empirical claim.
  *   **Verdict:** This is a real argument, but it requires empirical evidence that the tech's risk > the moratorium's risk. Your teammate is skipping this step.

  ### 3. The Burden of Proof Reversal (Strong Precautionary Principle)
  **The Principle:** *The proponent of an activity (the innovator) must prove it is safe, rather than the regulator proving it is dangerous.*

  *   **What it claims:** In the face of uncertainty, the default position should be "no." Permission is a privilege granted only after safety is demonstrated.
  *   **Plausibility:** **Contested.** This is standard in pharmaceuticals (FDA approval), but controversial in software or general industry. It assumes safety is provable *before* deployment. For emerging tech (like AGI), safety may be impossible to prove theoretically.
  *   **Resolves Action/Inaction Tension?** **No.** It implicitly treats "inaction" as the neutral baseline and "action" as the deviation. It ignores that *maintaining the status quo* is also a policy choice that requires justification. If the status quo is burning up the planet, demanding proof that geoengineering is "safe" before allowing it is a bias toward the current catastrophe.
  *   **Supports Moratorium?** **Yes.** This principle logically leads to a moratorium until proof is provided.
  *   **Verdict:** This supports your resolution, but it is vulnerable to the "Paralysis Objection." If safety cannot be proven without deployment, this principle bans progress forever.

  ### 4. The Maximin Decision Rule (Rawlsian Safety)
  **The Principle:** *Choose the policy option where the worst-case scenario is the least bad.* (Maximize the minimum outcome).

  *   **What it claims:** Ignore the potential upsides. Compare the worst-case of the tech (e.g., AI genocide) vs. the worst-case of the moratorium (e.g., economic stagnation). Choose the one with the less severe floor.
  *   **Plausibility:** **Low (as a general rule).** Rational actors usually weigh probability *and* severity. Maximin is only rational when the worst-case is truly unacceptable (e.g., death) and probabilities are unknowable.
  *   **Resolves Action/Inaction Tension?** **Yes, but dangerously.** It forces a direct comparison of worst-cases.
  *   **Supports Moratorium?** **Only if the Tech's Worst-Case > Moratorium's Worst-Case.** This is the trap your teammate is falling into. They assume the moratorium's worst-case is "we stay poor" while the tech's worst-case is "we die." But if the tech solves climate change, the moratorium's worst-case might be "we die from climate change."
  *   **Verdict:** This turns the debate into a comparison of catastrophes. If the Negative can prove the moratorium causes a catastrophe (e.g., by delaying medical cures), this principle turns against you.

  ---

  ### The Fatal Flaw: The "Safe" Baseline Problem

  The reason your teammate's argument collapses under pressure is that "Better Safe Than Sorry" relies on a hidden assumption: **The Status Quo is Safe.**

  The phrase implies:
  *   **Action** = Risk (Dangerous)
  *   **Inaction** = Safety (Secure)

  In the context of emerging technologies, this is often false.
  *   **AI:** Inaction might mean rival nations develop it without safety guardrails (arms race dynamics).
  *   **Geoengineering:** Inaction means accepting current climate trajectories.
  *   **Biotech:** Inaction means delaying cures for pandemics.

  When the Negative argues that moratoriums carry risks, your teammate says "Better safe than sorry." But if the moratorium *causes* the sorry outcome (e.g., climate collapse), the proverb no longer applies. The phrase is being used to immunize the *moratorium* from risk analysis, which is logically incoherent.

  ### Strategic Advice for Your Team

  You are right to be skeptical. If you run this argument as is, a skilled Negative team will crush you by pointing out that **a moratorium is an action, not a pause.** It is an active government intervention with its own risk profile.

  To fix the case, you need to move beyond the proverb. Here is how to upgrade the argument:

  1.  **Abandon the Proverb, Keep the Asymmetry:**
      Don't say "Better safe than sorry." Say: *"Irreversible harms impose a higher burden of justification than reversible harms."*
      *   **Why:** Economic stagnation (risk of moratorium) is arguably reversible. Human extinction or ecological collapse (risk of tech) is not. This creates a principled reason to prioritize one risk over the other without ignoring the moratorium's costs.

  2.  **Define "Safe" as "Survival":**
      Argue that the only "safety" that matters is the continuation of the moral community. If a technology threatens existence, no amount of economic gain justifies it.
      *   **Why:** This counters the "medical breakthroughs delayed" argument. You concede those costs but argue they are trivial compared to existential risk.

  3.  **Address the "Risks of Inaction" Directly:**
      Your teammate is waving these away. You must incorporate them.
      *   **Argument:** "We acknowledge moratoriums have costs. However, emerging technologies with *uncertain catastrophic risk* are unique because we cannot calculate the odds. When odds are unknowable and stakes are infinite, the only rational move is to pause until calculability is restored."
      *   **Why:** This distinguishes your resolution from general innovation. You aren't banning *all* tech, only those with *uncertain catastrophic risk*.

  4.  **Reframe the Status Quo:**
      Don't treat the moratorium as the risky change. Treat the *unregulated deployment* as the radical experiment.
      *   **Argument:** "Human civilization is the baseline. Releasing a technology that could end civilization is the deviation. We are not choosing inaction; we are choosing self-preservation."

  ### Conclusion
  Your teammate is currently using a rhetorical device, not a philosophical principle. "Better safe than sorry" cannot resolve the tension between action and inaction because it assumes safety lies in inaction.

  To win, you must concede that moratoriums have risks, but argue that **uncertainty + catastrophe = paralysis** is the only rational response to existential threats. If you can't make that specific link, the proverb is just a slogan that will crumble under cross-examination.
