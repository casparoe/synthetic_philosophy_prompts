answer: |-
  Let me take a moment to settle into this. You've described something that sits right at the intersection of political theory, ethics, and the philosophy of language. It's a frustration many of us feel in public discourse, but pinning it down requires separating the *logical structure* from the *rhetorical effect*.

  I'm going to walk through my thought process on this, because the precision you're asking for requires us to rule out the "nearby" concepts first. If I just hand you a label, it won't help you spot the mechanism in the wild.

  ### Part 1: Ruling Out the "Nearby" Concepts

  You mentioned a few standard labels that feel close but not quite right. Let's examine why your intuition is correct to reject them. This will help us isolate the specific anatomy of the move you're seeing.

  **1. It is not plain Vagueness.**
  Vagueness is when a term has blurry boundaries (e.g., "tall." Is 5'11" tall?). If "Western values" were just vague, we would argue about *borderline cases* (e.g., "Is individualism a Western value or a human value?"). But that's not what's happening in your debate. Your friend isn't unsure about the boundary; he is *shifting the category*. Sometimes "Western values" refers to a historical reality (descriptive), and sometimes it refers to a moral ideal (normative). Vagueness is about *degree*; this is about *kind*.

  **2. It is not (just) the No True Scotsman Fallacy.**
  This is the closest cousin, so we need to be careful. The "No True Scotsman" fallacy protects a generalization about a group by redefining membership ("No *true* Scotsman puts sugar on porridge").
  In your case, your friend *is* excluding historical events (slavery, blasphemy laws) from the definition of "Western." However, the *purpose* of the move is different. In a standard Scotsman fallacy, the goal is to save a factual claim about a group. In your friend's case, the goal is to harvest **authority**.
  *   When he wants to attack others, "Western" means "The powerful historical bloc that actually exists" (Descriptive).
  *   When he is defended, "Western" means "The set of morally superior ideals we aspire to" (Normative).
  A Scotsman fallacy protects a claim about *who belongs*. This move protects a claim about *what is good* by pretending it is *what is*.

  **3. It is not ordinary Hypocrisy.**
  Hypocrisy is a mismatch between *action* and *speech* ("I say don't steal, but I steal"). Your friend might be entirely sincere. He might genuinely believe that slavery was a "betrayal" of Western values. The problem isn't his integrity; it's the **linguistic structure** he is using. The term "Western values" is doing double-duty in a way that makes his position unfalsifiable. Hypocrisy is a moral failing; this is a conceptual confusion (or exploitation).

  **4. It is not a "Loaded Word."**
  A loaded word (like "freedom fighter" vs. "terrorist") carries emotional baggage. "Western values" is certainly loaded, but that doesn't explain the *slide*. A loaded word stays loaded. This term changes its logical function mid-argument.

  ### Part 2: The Philosophical Anatomy

  So, if it's not those, what is it? To understand this, we have to look at two philosophical concepts: **The Is-Ought Problem** and **Thick Ethical Concepts**.

  **1. The Is-Ought Gap**
  David Hume pointed out that you cannot logically derive an "ought" (what should be) from an "is" (what is).
  *   *Descriptive:* "Western countries historically prioritized individual property rights." (An fact about history).
  *   *Normative:* "Individual property rights are morally good." (A claim about ethics).
  Your friend's argument relies on collapsing these two. He wants the *authority* of the Descriptive (this is real, this is us, this is powerful) and the *immunity* of the Normative (this is good, this is pure, this cannot be criticized).

  **2. Thick Ethical Concepts**
  In philosophy of language (think Bernard Williams or Hilary Putnam), a "Thick Concept" is a word that *simultaneously* describes the world and evaluates it.
  *   *Thin concepts:* "Good," "Right." (Purely evaluative).
  *   *Descriptive concepts:* "Red," "Square." (Purely factual).
  *   *Thick concepts:* "Cruel," "Courageous," "Treason."
  If I call an act "cruel," I am describing what happened (inflicting pain) *and* condemning it. You can't separate the two easily.

  **The Diagnosis:**
  Your friend is treating "Western Values" as if it were a **Thick Ethical Concept**, but it isn't one naturally. "Courage" is universally understood to have a moral weight. "Western Values" is a political label. By treating it as a Thick Concept, he creates a shield.
  *   When you attack the *description* (slavery), he retreats to the *evaluation* (that wasn't "true" value).
  *   When he attacks *others*, he uses the *description* (the West is powerful/dominant).

  ### Part 3: Coining the Term

  There is no single, canonical Greek name for this specific maneuver in the standard logic textbooks. It is a composite rhetorical strategy often discussed in critical theory and post-colonial studies, but it lacks a unified label for general debate.

  Given your request, I am going to coin a term that captures the mechanism precisely. I call this:

  ## **The Normative-Descriptive Pivot**

  Here is the definition:
  **The Normative-Descriptive Pivot** occurs when a speaker uses a single term to refer to both a *contingent historical reality* (Descriptive) and a *moral ideal* (Normative), switching between the two definitions strategically to immunize the term from criticism while retaining its rhetorical authority.

  ### Part 4: Diagnostic Criteria (How to Spot It)

  To ensure you can use this tool elsewhere, here are the four conditions that must be met for this to count as a **Normative-Descriptive Pivot**, rather than just confusion or hypocrisy.

  **1. The Identity Anchor (Descriptive Mode)**
  The term must claim to refer to a real, existing group or history. It draws its power from the fact that "This is who we *are*."
  *   *Example:* "We must defend Western borders." (Here, "West" is a geographic/political reality).

  **2. The Moral Shield (Normative Mode)**
  When the descriptive reality is criticized, the definition shifts to an ideal. It claims "This is who we *should be*."
  *   *Example:* "Colonialism wasn't a Western value." (Here, "West" is a moral club that excludes bad actors).

  **3. The Unidirectional Immunity**
  This is the key test. The switch only happens to *defend* the group, never to *condemn* it in the same breath.
  *   *If it were consistent:* "Slavery happened in the West, therefore Western values included slavery." (Purely Descriptive).
  *   *If it were consistent:* "Slavery is wrong, and since the West did it, the West was wrong." (Purely Normative).
  *   *The Pivot:* "Slavery happened in the West, but it wasn't a Western value." (Descriptive fact is acknowledged, Normative label is withheld).

  **4. The Authority Harvest**
  The speaker must use the *Descriptive* weight to justify action. "We must do X because we are Western." If "Western" only meant "Good," this would be circular ("We must do X because we are Good"). The argument needs the historical/cultural weight of "Western" to work, but the moral purity of "Good" to avoid blame.

  ### Part 5: Boundary Cases (What looks similar but isn't)

  To be a precise philosopher, we must know where the concept *ends*. Here are two cases that look like the Pivot but are actually different.

  **Case A: The Sincere Reformer (Not a Pivot)**
  *   *Statement:* "Slavery was a horrific betrayal of our founding ideals. We failed to live up to Western values."
  *   *Why it's different:* This person admits the **Descriptive** failure. They are not using the term to dodge the fact. They are holding the Descriptive reality accountable to the Normative ideal. There is no slide; there is a tension they are acknowledging.
  *   *Test:* Does the speaker admit the group *failed* the value? If yes, it's not a Pivot. If they say the value *wasn't there*, it is a Pivot.

  **Case B: Essentialist Definition (Not a Pivot)**
  *   *Statement:* "Western values are strictly defined as the Enlightenment principles of 1789. Anything before or after is irrelevant."
  *   *Why it's different:* This is rigid, not slippery. This person is defining a specific philosophical tradition, not a civilizational identity that slides between history and morality. They are not claiming "This is what Western countries *did*," they are claiming "This is the specific philosophy we are discussing."
  *   *Test:* Is the definition fixed at the start of the argument? If yes, it's just a stipulative definition. The Pivot requires the *switch* during the pressure of debate.

  ### Summary for Your Debates

  When you encounter this again, you don't need to shout "That's a Normative-Descriptive Pivot!" (though you can). Instead, you can interrupt the mechanism by forcing the definition to stay still.

  **The Counter-Move:**
  *"I need to know which version of 'Western Values' we are using. Are we talking about the **historical record** of Western nations, or the **moral ideals** some Westerners claim? If it's the historical record, then slavery counts. If it's moral ideals, then you can't use 'The West' as an authority, because history didn't follow them. You can't use the history for authority and the ideals for innocence."*

  This forces your friend to choose one anchor. If he chooses History, he loses the moral high ground. If he chooses Ideals, he loses the cultural authority. The Pivot collapses.

  You were right to feel that "weasel word" was too simple. It's not just that the word is slippery; it's that it is smuggling an "ought" inside an "is." Naming that structure gives you the leverage to separate them.
