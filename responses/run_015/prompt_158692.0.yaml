  1. Scenario
  Two quantitative analysts at a hedge desk evaluate a binary asset paying \$1 if event $E$ occurs, \$0 otherwise. They share a common prior derived from historical data but receive private proprietary signals partitioning the state space. A central matching engine crosses sealed buy/sell orders at a fixed price of \$0.50 without revealing the counterparty's identity or order size. Neither analyst observes the other's commitment before submitting their own. Both are risk-neutral profit maximizers with no prior exposure. The setup isolates speculative disagreement from hedging motives or transaction costs, ensuring any trade stems purely from divergent interim expectations regarding $E$ despite shared foundational beliefs. The firm mandates this blind mechanism to preserve signal privacy while capturing liquidity.

  2. Formal Setup
  State space $\Omega=\{1,\dots,6\}$ with prior $P=(0.10, 0.05, 0.025, 0.225, 0.40, 0.20)$. Agent 1's partition $\Pi_1=\{\{1,2\},\{3,4\},\{5,6\}\}$; Agent 2's $\Pi_2=\{\{1,6\},\{2,3\},\{4,5\}\}$. Actual state $\omega^*=1$. Event $E=\{1,3,5\}$. Bet: Agent 1 buys, Agent 2 sells one unit at \$0.50. The meet of $\Pi_1$ and $\Pi_2$ is the finest common coarsening. Since the union of cells connects all states (1-2-3-4-5-6-1), the meet is the trivial partition $\{\Omega\}$. Thus, only events with probability 0 or 1 are common knowledge. At $\omega^*$, Agent 1 holds cell $\{1,2\}$ and Agent 2 holds $\{1,6\}$. This connectivity ensures no non-trivial event is common knowledge.

  3. Why both expect to gain
  At $\omega^*=1$, Agent 1 computes $P(E|\{1,2\}) = 0.10/0.15 = 2/3$. Agent 2 computes $P(E|\{1,6\}) = 0.10/0.30 = 1/3$. Both strictly expect profit at price 0.50. Agent 1 checks $\{1,2\}$: at state 2, Agent 2 sees $\{2,3\}$, yielding $P(E)=0.025/0.075=1/3$. Agent 1 knows Agent 2's posterior is 1/3. Symmetrically, Agent 2 checks $\{1,6\}$: at state 6, Agent 1 sees $\{5,6\}$, yielding $P(E)=0.40/0.60=2/3$. Agent 2 knows Agent 1's posterior is 2/3. Posteriors are mutual knowledge at $\omega^*$ but differ. Acceptance is mutual knowledge but not common knowledge because acceptance sets differ across the connected state space.

  4. Why neither result is contradicted
  The Agreement Theorem requires posteriors to be common knowledge; here they are only mutual knowledge. Since the meet is trivial, common knowledge requires equality across all states, which fails. The No-Trade Theorem requires it to be common knowledge that both accept. While both accept at $\omega^*$, Agent 1 cannot rule out state 6 (where Agent 2 rejects) without public announcement. Because the mechanism screens off acceptance, trade facts do not iterate to common knowledge. The antecedents for both impossibility results fail precisely at the common-knowledge condition, not the common-prior condition.

  5. What is doing the work
  The structural feature is the lack of common knowledge of acceptance due to partition connectivity. If acceptance were public and iterated, agents would eliminate states where the other rejects. This process converges to the meet cell. Since the meet is $\Omega$, and ex-ante expected gains sum to zero, iterated elimination forces expected gains to zero or eliminates the bet entirely. The bet survives only because the sealed mechanism halts the iteration at mutual knowledge. The common prior holds throughout; the collapse occurs only when common knowledge is enforced. Thus, privacy preserves the bet.

  6. The strongest objection
  A critic argues this is a technical artifact: ex-ante, expected gains are zero, so someone loses. In reality, agents reason via adverse selection: "If they bet against me, they know something I don't." Concede that ex-ante profitability is impossible under CPA. However, this establishes that ex-interim disagreement is consistent with CPA without irrationality, provided common knowledge fails. The lesson is not that profitable betting is robust, but that the No-Trade theorem's force lies in the common-knowledge requirement, which real-world privacy mechanisms intentionally weaken to allow liquidity. Once in, given private signals, the bet is rational. The case proves the common prior alone does not preclude interim speculative gains; only the addition of common knowledge of actions does. This distinction is vital for modeling markets where information is deliberately siloed.
