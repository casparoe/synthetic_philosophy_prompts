  **Problem Statement**
  Standard accuracy-first accounts leave this question open because they typically treat belief accuracy as pointwise symmetric. In dominant epistemic utility theories, every false belief is weighted equally regardless of practical context. A false belief about a trivial matter receives the same negative score as a false belief about a medical diagnosis. Consequently, these frameworks lack internal resources to explain why rational agents should apply stricter evidential thresholds in high-stakes domains. Currently, explaining this intuition requires either pragmatic encroachment, where stakes affect knowledge status, or epistemic consequentialism, where practical value inflates epistemic value. Both options threaten the core accuracy-first commitment that epistemic normativity is distinct from practical normativity. Without a modified accuracy function, the accuracy-first theorist must deny the intuition entirely or concede that epistemic rationality is sensitive to non-epistemic values.

  **Proposed Approach**
  I propose developing a threshold-sensitive accuracy function that derives differential weights for errors solely from the reliability conditions of belief-formation in different practical domains, rather than importing external moral or prudential values. The central hypothesis is that practical domains possess intrinsic epistemic structures requiring varying levels of reliability for optimal belief formation. By modeling accuracy as relative to these domain-specific reliability conditions, the framework can assign higher disutility to errors in high-stakes contexts without referencing the practical value of the outcome itself. The weighting emerges from the epistemic difficulty of the domain, not the prudential cost of being wrong. This distinguishes the project from consequentialist accounts that directly maximize practical outcome value.

  **Deliverables and Success Conditions**
  A successful deliverable is a formal framework that preserves the accuracy-first commitment that epistemic value derives entirely from belief accuracy, while allowing domain-variable thresholds. The model must demonstrate that stricter thresholds in high-stakes domains maximize expected epistemic utility under the new scoring rule. Failure is defined as a framework that secretly relies on non-epistemic scoring rules, importing prudential value into the accuracy metric, or collapses into standard consequentialist epistemic utility theory where practical stakes directly modify utility rather than accuracy conditions. The final output will include a mathematical specification of the threshold-sensitive scoring rule and a proof of propriety ensuring the rule encourages truthful reporting of credences.

