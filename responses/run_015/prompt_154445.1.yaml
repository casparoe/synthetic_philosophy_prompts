answer: |-
  Reading *Flowers for Algernon* as an experiment rather than a eulogy requires isolating three distinct variables. *Capacity intelligence* is Charlie's internal machinery—his raw processing power and memory. *Effective intelligence* is what he can actually deploy, constrained by the affordances of his setting and the cooperation of peers. *Credited intelligence* is the social attribution—how much room others give him to speak, act, or be held responsible. The novel's tragedy is often mapped onto the rise and fall of capacity, but a stricter reading suggests the real friction occurs when effective and credited intelligence decouple from capacity.

  In the early progress reports, Charlie's capacity is low, yet his credited intelligence within the bakery is high, albeit malignly. The workers call him "friend," granting him social belonging based on a legibility they control; he is safe because he is legible as a simpleton. When the operation boosts his capacity, this credited intelligence collapses. The petition to fire him is not a response to his competence, but a rejection of his new illegibility. He is no longer the safe object of their humor. Similarly, Miss Kinnian initially credits him with potential capacity before the surgery, but as his actual capacity surpasses hers, her credited authority cannot hold him. She becomes a teacher without a student, her social role affording her no effective intelligence over him.

  The decoupling becomes violent at the convention. Here, Charlie's capacity is at its zenith; he dismantles the researchers' theories with superior logic. Yet, his effective intelligence is nullified. The setting affords him the status of a specimen, not a colleague. When he challenges Nemur and Strauss, he finds that social hierarchy trumps cognitive superiority. He is smarter than anyone will allow him to be. His credited intelligence shifts from "miracle" to "threat," restricting his room to act. This is crystallized in the scene with Algernon's body. The mouse represents pure capacity without social context—a mind that runs and dies in a maze. Charlie burying Algernon is an admission that capacity without social sustainment is merely biological decay.

  As Charlie regresses, the variables fracture further. His capacity diminishes, but the world's credited intelligence lags. People treat him as a broken genius rather than a returning man, denying him the return to his prior social niche. His effective intelligence vanishes because the affordances of the lab are closed to him, and the bakery will not take him back. He is stranded in a gap where he is too competent for pity but too impaired for respect.

  Does "capacity intelligence" survive as a coherent notion once peeled from the social? The novel suggests it does not. Raw processing power without legibility or attribution is isolation. Charlie's genius is only real insofar as it is recognized; when recognition turns to fear, his intelligence becomes a liability. However, this social reading is undermined by the novel's own mechanics. Keyes structures intelligence as a single scalar quantity that moves everything at once. The enhancement succeeds and fails on a biological schedule, implying that capacity is the prime mover that drags the social variables along with it. If effective and credited intelligence did the real work, Charlie's decline might be arrested by social accommodation; instead, the biological tide sweeps all away. Furthermore, the book's sentimentality buys a conclusion about the value of intelligence that the argument hasn't earned. By making us mourn the loss of Charlie's inner light, the text privileges the individual capacity over the social conditions that made it unusable.

  Verdict: While the novel dramatizes the social consequences of intelligence, it secretly depends on a hard, individual, capacity-based one. The tragedy is framed as the loss of the internal spark, not merely the withdrawal of social credit. If the social account were truly dominant, the end of the experiment would be a change in status, not a death of the self. The book ultimately reinforces the myth that intelligence is a private possession that can be lost, rather than a relational dynamic that can be shifted.

  The single point at which this reading is most exposed is the stylistic consistency of the late progress reports. Charlie claims his capacity is gone, yet the prose remains poignant, structured, and deeply self-aware ("I made up my mind... I have to go away"). If capacity were truly a scalar that dropped, the voice should disintegrate more thoroughly. The endurance of the narrative voice suggests that what we call "capacity" is not just processing speed, but a relational integrity that survives the biological decline, contradicting the novel's own premise of total loss.
