answer: |-
  **Essay Question**

  **Topic:** Deep Twin Earth and the Limits of Externalism
  **Time Allowed:** 90 Minutes

  **Prompt:**
  Consider a variant of Putnam's Twin Earth thought experiment, which we shall call **Deep Twin Earth**. The setup is identical to Putnam's 1975 scenario: it is 1750, Oscar and Twin-Oscar are molecule-for-molecule identical, and they both use the term "water" to refer to the clear, drinkable liquid in their respective environments. On Earth, this liquid is H₂O. On Deep Twin Earth, the liquid is XYZ.

  However, there is one crucial modification: On Deep Twin Earth, the chemical difference between H₂O and XYZ is **in principle undetectable**. No experiment available to the community, even given their ideal future science and unlimited resources, could ever distinguish XYZ from H₂O. The substances behave identically in all contexts relevant to the speakers.

  Write an essay addressing the following:
  1.  Does Putnam's argument for semantic externalism survive the transition from "unknown" (standard Twin Earth) to "unknowable" (Deep Twin Earth)? Does this variation suggest the original intuition pump relied on epistemic access rather than metaphysical reference?
  2.  How would a defender of Fodor-style narrow content exploit the "in principle undetectable" clause to argue for internalism?
  3.  Critically assess whether the outcome differs under Putnam's **natural kind externalism** versus Burge's **social externalism**. Specifically, if the difference is undetectable, can the "experts" required by Burge's theory ever establish a normative distinction?

  ***

  **Model Answer**

  Deep Twin Earth pressures semantic externalism by severing the link between reference and verification. In standard Twin Earth, the difference between H₂O and XYZ is merely unknown to 1750 speakers but discoverable by future science. In Deep Twin Earth, the difference is metaphysically real but epistemically inaccessible forever. This distinction forces a choice between a robust metaphysical realism and a usage-based semantics.

  For Putnam, externalism survives Deep Twin Earth, but only by retreating to a strong metaphysical realism. Putnam's slogan "meanings just ain't in the head" relies on the causal theory of reference: the extension of "water" is fixed by the actual nature of the stuff causally connected to the term. Even if that nature is unknowable, if the microstructure differs, the extension differs. The intuition pump is not about epistemic access but about the division of linguistic labor and the indexical nature of natural kinds. However, Deep Twin Earth exposes a vulnerability: if the difference makes no causal difference to any human interaction, claiming the reference differs risks making meaning occult. It suggests Putnam prioritizes hidden essences over public use.

  A Fodor-style narrow content defender exploits this precisely. Fodor argues that psychological content should supervene on the internal state of the agent to explain behavior. On Deep Twin Earth, Oscar and Twin-Oscar are behaviorally identical in all possible worlds accessible to them. Since the H₂O/XYZ distinction makes no difference to their inputs, outputs, or cognitive processing, positing different wide content explains nothing. The "in principle undetectable" clause strengthens the internalist intuition: if a difference cannot manifest in any practice or verification condition, it is semantically idle. Fodor would argue Deep Twin Earth proves that *psychological* content must be narrow, even if *semantic* reference is wide.

  Crucially, the verdict shifts when comparing Putnam's natural kind externalism to Burge's social externalism. This is where the "Deep" variant creates a divergence often overlooked. Putnam relies on mind-independent essences; even if undetectable, H₂O ≠ XYZ. Burge, however, relies on communal usage and expert deference. Burgean externalism fixes content based on the normative standards of the linguistic community. On Deep Twin Earth, because the difference is undetectable, the "experts" cannot establish a normative distinction between the two liquids. The community treats them as identical. Therefore, under Burge's framework, there is no social fact that distinguishes the extension of "water" on Earth vs. Deep Twin Earth. The social practice collapses the distinction that Putnam's metaphysics preserves.

  Consequently, Deep Twin Earth suggests that natural kind externalism and social externalism are not interchangeable. Putnam can maintain distinct references based on hidden structure. Burge cannot, because his externalism is grounded in accessible social norms. If the community cannot distinguish the kinds, the social meaning remains identical. Thus, Deep Twin Earth refutes the monolithic view of externalism: it supports Putnam's realism while potentially undermining Burge's normativity, showing that externalism fails when the "external" factor cannot enter the social sphere.

  ***

  **Marking Scheme**

  **Total Marks:** 100

  **1. Core Argument & Thesis (30 Marks)**
  *   **A (25-30):** Clearly articulates that Deep Twin Earth tests the boundary between metaphysics and epistemology. Thesis explicitly states whether externalism holds and qualifies *which* externalism.
  *   **B (18-24):** Correctly identifies the tension between unknowability and reference but offers a generic defense or rejection of externalism without nuance regarding the "in principle" clause.
  *   **C (12-17):** Recites standard Twin Earth arguments without addressing the "undetectable" modification.

  **2. Engagement with Narrow Content (Fodor) (20 Marks)**
  *   **A (17-20):** Explains that Fodor uses the lack of causal/behavioral difference to argue for supervenience. Notes that "in principle undetectable" makes the wide content explanatorily idle.
  *   **B (12-16):** Mentions Fodor or internalism but fails to connect the "undetectable" constraint to the argument for psychological supervenience.
  *   **C (0-11):** Vague reference to "head" vs. "world" without engaging narrow content specifically.

  **3. The Critical Move: Putnam vs. Burge Divergence (40 Marks)**
  *   **A (34-40):** **Explicitly distinguishes** between Putnam's metaphysical externalism and Burge's social/normative externalism. Argues that Putnam survives (essence is mind-independent) while Burge potentially fails (experts cannot normatively distinguish undetectable kinds). **This is the move students always miss.**
  *   **B (24-33):** Discusses Putnam and Burge but treats "externalism" as a monolith. Assumes that if it fails for Putnam, it fails for Burge (or vice versa). Fails to see that social norms require detectability while natural essences do not.
  *   **C (0-23):** Mentions Burge only in passing or conflates the division of linguistic labor with the division of microstructure.

  **4. Clarity & Structure (10 Marks)**
  *   **A (9-10):** Concise, philosophical prose. No fluff.
  *   **B (6-8):** Readable but perhaps exceeds word count or lacks tight paragraph transitions.
  *   **C (0-5):** Disorganized or difficult to follow.

  **Examiner's Note on the "Critical Move":**
  To award an A, the student **must** identify that Deep Twin Earth drives a wedge between Natural Kind Externalism (Putnam) and Social Externalism (Burge). Most students will treat "Externalism" as a single position. The A-grade answer recognizes that Burge's reliance on *expert usage* creates a vulnerability in the Deep Twin Earth case that Putnam's reliance on *hidden essence* does not. If the essay treats Putnam and Burge as yielding the same result, it cannot receive an A grade, regardless of writing quality.
