prompt: |-
  I've been lurking around the rationalist corner of the internet since the Sequences days and I now haunt the comments of every "can these models actually reason" thread, which is where this started: someone posted a set of Bongard problems — the ones from the old Soviet pattern-recognition book, six little figures on the left that share some property, six on the right that don't, guess the rule — and said solving them is the cleanest remaining test of genuine concept induction, because you get twelve examples and nothing else to go on. A friend of mine said that's just overfitting with extra steps: a system that labels the held-out figures right has found a discriminating feature, not induced a concept. I think she's half right and half wrong in an interesting way, and I want to spend a year on it, so I'm applying for a one-year research fellowship and need a proposal of about four pages.

  Here's the half-formed idea I want turned into one. Start with a structural point about the problems themselves: in a good chunk of them the right-hand class has no positive description at all, it's just "not that" — a catch-all — whereas in the bilateral ones both sides instantiate their own rule and the two rules are systematically related (one is the negation, or the same thing with a feature swapped, or the same relation with the roles reversed). Those two kinds of problem seems to demand different things: the catch-all kind looks solvable by one-class modelling or novelty detection without ever representing the contrast, the bilateral kind doesn't. So my first move is to split any benchmark along that axis and check whether the ordering actually shows up (and whether training on bilateral problems transfers to catch-all ones and not the other way round). Second move: the rule is radically underdetermined by twelve examples — Goodman's new riddle, grue and all that — but nobody in these arguments talks about the thing that does the work in real induction, which is some ordering over the candidate rules that makes some of the consistent predicates projectile and the rest mere curve-fitting. My suspicion is that "induced the concept" is being used to mean three separable things — found a discriminating feature, got something that supports counterfactual and generative uses, and represented the space of alternative rules with its simplicity structure — and that current systems plausibly get the first, partly get the second, and don't get the third, and that the third is the one doing the philosophical work. If you think my bilateral/catch-all cut is the wrong axis, or that it's a rediscovery of something obvious, say so and propose a better one, but I don't want a literature review — I'll fill in citations myself.

  What I need the proposal to actually contain: the question stated precisely enough that a year's work could come out either way; why the two positions in that comment thread (and the standard "few-shot concept learning" framing more generally) leave it open; the method month by month for twelve months, including what I'd build myself — I have a modest GPU budget and some ability to generate synthetic figures programmatically, but I am not training anything from scratch, so the design has to be probes and evaluations run against existing open models plus synthetic sets I construct, and I want you to be concrete about how I'd construct sets that control for the things that need controlling (the discriminating-feature confound, the verbalization confound, the possibility that a model just recites a rule it can't use); what the deliverable is for people who actually build and report these benchmarks, as opposed to another philosophy paper nobody reads; and an honest failure section — both the empirical failure (the probes dissociate, passing one doesn't predict passing another, no clean story) and the conceptual one (the three-way distinction collapses, or "concept" turns out to be doing no work here), with some indication of what pattern of results would push me to which conclusion. Also tell me what to cut: I have a bad habit of scoping these things like a five-year project and then recieving a polite rejection.
reasoning: |-
  Here's a thinking process that leads to the research proposal:

  1.  **Analyze the Request:**

      *   **User Persona:** Long-time rationalist community member, familiar with *The Sequences*, active in AI safety/reasoning debates, applying for a one-year research fellowship.
      *   **Topic:** Bongard Problems (BPs) as a test of "genuine concept induction" vs. "discriminative feature finding."
      *   **Core Hypothesis:** The user distinguishes between "catch-all" BPs (Right side = NOT Left rule) and "bilateral" BPs (Both sides have positive rules, systematically related). They suspect current models solve the first via novelty detection/one-class modeling but fail the second. They also posit a three-way distinction of "concept induction": (1) Discriminating feature, (2) Counterfactual/Generative support, (3) Representation of hypothesis space/simplicity prior.
      *   **Constraints:** ~4 pages (standard fellowship length), 12-month timeline, modest GPU budget (no training from scratch, use open models + synthetic data), concrete methodology, specific deliverables (for benchmark builders, not just philosophy), honest failure modes, scoping advice (cut the 5-year scope down to 1 year).
      *   **Tone:** Professional, academic but sharp, acknowledging the user's background without being overly informal. Needs to sound like a viable research plan.

  2.  **Deconstruct the Core Idea & Refine the Scope:**

      *   *The Axis:* The Bilateral vs. Catch-All distinction is strong. It's not just "rediscovery." It maps onto One-Class Classification vs. Binary Classification. This is a good empirical hook.
      *   *The Three Ways:* (1) Discrimination, (2) Counterfactuals/Generation, (3) Hypothesis Space. This is the philosophical meat. To make this empirical, I need probes for each.
      *   *Scoping:* A year is short. I can't build a new architecture. I must focus on *evaluation* and *dataset construction*. The deliverable should be a benchmark suite + a paper analyzing model performance through this lens.
      *   *Cutting:* Remove broad literature reviews. Remove attempts to solve BPs generally. Remove multi-modal model training. Focus strictly on *probing* existing VLMs/LLMs with controlled synthetic BPs.

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to be punchy and descriptive. "Beyond Discrimination: Probing Concept Induction in Bongard Problems."
      *   **Abstract/Summary:** Briefly state the problem (BPs as a testbed), the gap (discrimination vs. induction), and the plan (typology + probes).
      *   **Research Question:** Needs to be falsifiable. "Do current VLMs exhibit evidence of hypothesis space representation (simplicity priors) when solving Bongard Problems, or do they rely on discriminative heuristics?"
      *   **Background/Motivation:** Briefly touch on the "overfitting with extra steps" debate. Introduce the Bilateral/Catch-All split. Introduce the 3-level definition of induction.
      *   **Methodology (The Meat):**
          *   *Months 1-3:* Dataset Generation. Need to programmaticaly generate BPs. Control variables (shape, color, relation). Crucially: Label them by type (Bilateral vs. Catch-All).
          *   *Months 4-6:* Probe 1 (Discrimination) & Probe 2 (Counterfactuals). Can the model label new instances? Can it generate a counter-example?
          *   *Months 7-9:* Probe 3 (Hypothesis Space). This is the hard one. How to test simplicity priors? Maybe ambiguous cases where a simple rule and a complex rule both fit the 12 examples, but diverge on the 13th. (Goodman's Grue).
          *   *Months 10-12:* Analysis & Write-up.
      *   **Deliverables:** Not just a paper. A public dataset repo, a standardized evaluation harness, a "report card" for models.
      *   **Failure Modes:** What if the distinction doesn't matter? What if models fail everything? What if "concept" is meaningless?
      *   **Scoping/Cutting:** Explicitly mention what is *not* being done (no training, no solving all BPs, no broad philosophical treatise).

  4.  **Refining the Methodology (Self-Correction/Detailing):**

      *   *Synthetic Data:* I need to emphasize *programmatic generation*. This allows ground truth knowledge of the rule, which is essential for testing counterfactuals.
      *   *The "Grue" Test:* To test the 3rd level (hypothesis space), I need "adversarial induction." Create BP pairs where Rule A (simple) and Rule B (complex) both fit the 12 examples. See which one the model picks when asked to classify a 13th instance. This directly tests the simplicity prior.
      *   *Models:* Use open weights (Llama-3-Vision, Qwen-VL, etc.). No API black boxes if possible, to allow logit analysis if needed, but mostly prompt-based probing.
      *   *Verbalization Confound:* The user mentioned this. I need to ensure the test isn't just "can it describe the rule." It must be "can it *use* the rule." So, classification of *new* generated images is key.

  5.  **Addressing the "Cut" Request:**

      *   The user tends to over-scope. I need to explicitly state in the proposal (or as advice within it) what is excluded. I will integrate this into the "Scope and Limitations" section to show the reviewers I know what I'm doing.
      *   *Cut:* No human baseline studies (too slow/IRB). No training/fine-tuning. No attempt to solve the *hard* BPs (focus on the synthetic, controlled subset).

  6.  **Writing the Proposal (incorporating the "Rationalist" tone):**

      *   Use precise language. Acknowledge the "Sequences" background implicitly by focusing on alignment/induction bias without needing to cite Yudkowsky explicitly (keep it academic).
      *   Ensure the distinction between "Discriminative Feature" and "Induced Concept" is the through-line.

  7.  **Final Review against Constraints:**

      *   4 pages approx? (Word count needs to be managed, roughly 1500-2000 words).
      *   12 months? Yes.
      *   Modest GPU? Yes, inference only.
      *   Concrete construction? Yes, synthetic generation described.
      *   Failure modes? Yes.
      *   Deliverables? Yes (Benchmark + Harness).

  8.  **Final Polish:** Check the tone. It needs to be persuasive to a fellowship committee (likely technical/academic). It should sound rigorous but innovative. (Self-correction: Ensure the "Bilateral vs Catch-All" hypothesis is framed as an empirical question, not a settled fact).

  *(Self-Correction during drafting)*: I initially thought about suggesting fine-tuning. The prompt says "not training anything from scratch." I should stick to few-shot prompting and probing.
  *(Self-Correction on "Grue")*: Implementing a true "Grue" test in visual domains is hard. I'll frame it as "Rule Ambiguity": Generate 12 examples consistent with both Rule Simple and Rule Complex. Ask the model to classify a test case where they diverge.

  9.  **Final Output Generation** (Proceeding to generate the proposal text).
answer: |-
  **Project Title:** Beyond Discrimination: Probing Hypothesis Space Representation in Visual Concept Induction

  **Abstract**
  Bongard Problems (BPs) are frequently cited as a clean testbed for genuine concept induction in AI. However, current evaluation standards conflate *discriminative feature finding* (identifying a boundary that separates two sets) with *concept induction* (inferring a generative rule supported by a simplicity prior). This project proposes that these capacities dissociate. I will construct a synthetic Bongard benchmark stratified by structural typology (Bilateral vs. Catch-All) and probe open-weight Vision-Language Models (VLMs) across three levels of induction: (1) Discrimination, (2) Counterfactual/Generative Support, and (3) Hypothesis Space Representation. The deliverable is not merely a paper, but an open evaluation harness and dataset suite that allows benchmark builders to distinguish between models that curve-fit and models that induce.

  **1. Research Question and Motivation**
  The central debate in few-shot concept learning is whether success on held-out examples implies the acquisition of a "concept" or merely a high-dimensional discriminative boundary. In the context of Bongard Problems, a critic might argue that a system solving 12 examples has simply overfit the training set ("overfitting with extra steps"). A proponent argues it has induced the rule. Both positions rely on accuracy on a test set as the ground truth, which is insufficient.

  This project addresses a precise empirical question: **Do current VLMs possess a simplicity prior over hypothesis spaces that guides induction in underdetermined visual tasks, or do they rely on discriminative heuristics that fail when the discriminative feature is decoupled from the generative rule?**

  This question remains open because standard benchmarks measure only Level 1 (Discrimination). If a model classifies the 13th image correctly, we do not know if it did so because it inferred the rule "triangles inside circles" (Level 2/3) or because it recognized a texture correlation present in the 12 training images (Level 1). Furthermore, the structure of BPs varies. In "Catch-All" problems, the right-hand class is simply the negation of the left (e.g., "Contains a triangle" vs. "Does not contain a triangle"). In "Bilateral" problems, both sides instantiate positive, systematically related rules (e.g., "Triangle above Circle" vs. "Circle above Triangle"). Catch-All problems may be solvable via one-class novelty detection, whereas Bilateral problems require representing the contrast. If models perform well on Catch-All but poorly on Bilateral, it suggests they are not inducing concepts but detecting novelty.

  **2. Methodology and Timeline**
  I will not train models from scratch. I will utilize open-weight VLMs (e.g., LLaVA-1.6, Qwen-VL, Llama-3-Vision) and probe them using programmatically generated synthetic Bongard sets. This ensures ground-truth access to the generative rules, allowing for counterfactual testing impossible with the original 100 Bongard Problems.

  **Phase 1: Dataset Construction and Typology (Months 1–3)**
  *Goal: Create a controlled corpus of 1,000 synthetic Bongard Problems.*
  I will write a Python engine (using `manim` or `svglib`) to generate geometric figures. The engine will define rules compositionally (shapes, relations, counts, negations).
  *   **Stratification:** I will generate two distinct classes of problems:
      1.  *Catch-All:* Left side = Rule $R$, Right side = $\neg R$.
      2.  *Bilateral:* Left side = Rule $R_A$, Right side = Rule $R_B$, where $R_B$ is a systematic transformation of $R_A$ (e.g., swap roles, invert relation), not merely the negation.
  *   **Control for Confounds:**
      *   *Discriminative Confound:* Ensure no low-level pixel statistics (e.g., total ink density) correlate with the class label.
      *   *Verbalization Confound:* The ground truth rule will be stored as code/logic, not just text, to allow objective testing of rule application.
  *   **Deliverable 1:** A public repository of synthetic Bongard problems with metadata tagging the rule complexity and structural type.

  **Phase 2: Probing Discrimination and Generative Support (Months 4–6)**
  *Goal: Dissociate Level 1 (Discrimination) from Level 2 (Counterfactuals).*
  I will run inference on the synthetic dataset using 5–7 open VLMs.
  *   **Probe 1 (Standard Accuracy):** Standard 12-shot prompting. Classify 10 held-out images per problem. This establishes the baseline.
  *   **Probe 2 (Counterfactual Generation):** Instead of classifying provided images, the model is asked to *generate* (or select from a large pool) a new image that *would* belong to the Left class but currently does not exist in the set.
      *   *Rationale:* A discriminative model can separate existing points. A conceptual model can navigate the latent space of the rule.
      *   *Metric:* Success rate in generating valid positive instances that differ significantly from the 12 examples (measured by structural distance, not pixel distance).
  *   **Analysis:** I expect a performance drop from Probe 1 to Probe 2. If the drop is significantly larger for Bilateral problems than Catch-All problems, it supports the hypothesis that Catch-All problems are solvable via novelty detection.

  **Phase 3: Probing Hypothesis Space and Simplicity Priors (Months 7–9)**
  *Goal: Test Level 3 (Representation of Alternative Rules).*
  This is the core philosophical test. I will construct "Goodman Pairs": sets of 12 examples that are consistent with two competing rules: $R_{simple}$ and $R_{complex}$.
  *   **Construction:** For example, 12 examples might fit both "All shapes are red" ($R_{simple}$) and "All shapes are red OR (shape is square AND size > X)" ($R_{complex}$).
  *   **The Test:** Present a 13th image that fits $R_{complex}$ but violates $R_{simple}$ (e.g., a large blue square). Ask the model to classify it.
  *   **Rationale:** A system with a human-like simplicity prior should classify based on $R_{simple}$ (rejecting the blue square). A system merely curve-fitting high-dimensional correlations may accept the blue square if it resembles the training distribution in latent space.
  *   **Metric:** Alignment with the *simplest* consistent rule rather than the *most likely* latent feature match.

  **Phase 4: Synthesis and Harness Development (Months 10–12)**
  *Goal: Finalize the evaluation harness and write-up.*
  *   I will aggregate the results into a "Concept Induction Report Card" for each model.
  *   I will package the probing code into a standardized harness (`bongard-probe`) that allows other researchers to run these three levels of testing on new models without reconstructing the dataset.
  *   Final paper writing, focusing on the dissociation between the three levels.

  **3. Deliverables for the Engineering Community**
  This project is designed to avoid the "philosophy paper nobody reads" failure mode. The primary output is not just the analysis, but the infrastructure:
  1.  **The Synthetic Bongard Suite:** A programmatically defined dataset where the ground-truth rule is known code, not just human annotation. This allows for infinite variation and precise control of rule complexity.
  2.  **The Three-Level Harness:** An evaluation script that outputs three distinct scores (Discrimination, Counterfactual, Simplicity Prior) rather than a single accuracy metric.
  3.  **The Typology Tagging:** A classification of existing public BP datasets into Bilateral vs. Catch-All, enabling future researchers to control for this variable.

  **4. Risk and Failure Modes**
  I anticipate two distinct categories of failure, both of which yield informative results.

  *   **Empirical Failure (The Null Result):** The probes dissociate (models pass Level 1, fail Level 2/3), but there is no correlation with the Bilateral/Catch-All axis.
      *   *Implication:* The structural distinction is less important than model scale or architecture. I will pivot to analyzing which specific architectural components (e.g., attention heads in vision encoders) correlate with Level 2 success, turning the project into a mechanistic interpretability study of visual induction.
  *   **Conceptual Failure (The Collapse):** The three-way distinction collapses. For example, models that pass Level 1 automatically pass Level 2, or "simplicity" cannot be objectively defined in the synthetic generator.
      *   *Implication:* This suggests "concept induction" in this context is indeed a monolithic capability, or that my operationalization of "simplicity" is flawed. I will document the specific ways in which the probes converge. If "discrimination" proves sufficient for all practical purposes on these tasks, I will argue that the philosophical demand for "hypothesis space representation" is unnecessary for engineering goals, effectively dissolving the debate by showing the distinction lacks empirical bite.

  **5. Scope and Limitations (What I Am Cutting)**
  To ensure completion within 12 months on a modest budget, I am explicitly excluding the following:
  *   **No Human Baselines:** I will not run IRB-approved human studies. I will use reported human accuracy from the literature as the ceiling.
  *   **No Fine-Tuning:** I will not attempt to improve model performance via LoRA or full fine-tuning. This is a probe of *base* capabilities, not a training project.
  *   **No "Hard" Bongard Problems:** I will not attempt to solve the original 100 Bongard Problems, which rely on semantic knowledge (e.g., "pointing," "shadows"). I will restrict the domain to geometric primitives where ground truth is programmatically guaranteed.
  *   **No Broad Literature Review:** The proposal focuses on the specific mechanism of induction. Citations regarding the history of BPs or general few-shot learning will be kept minimal and functional.

  **6. Conclusion**
  The claim that "models can reason" often rests on benchmarks where discrimination is indistinguishable from induction. By splitting the Bongard domain along the Bilateral/Catch-All axis and introducing probes for counterfactuals and simplicity priors, this project will determine whether current models are building world models or just drawing boundaries. The result will be a clearer map of where "reasoning" actually breaks down, providing a more honest signal for the development of robust AI systems.

  ***

  ### Advice on Scoping (For the Applicant)

  You asked me to tell you what to cut because you have a habit of scoping for five years. Here is the blunt assessment of the draft above:

  1.  **Cut the "Generative" aspect of Probe 2.** Asking a VLM to *generate* an image (pixel-level) is noisy and hard to evaluate automatically. **Change:** Make Probe 2 a *Selection* task. Generate a pool of 100 candidate images, some that fit the rule and some that don't. Ask the model to select the one that *best* fits the rule but is *most dissimilar* to the training set. This is easier to score programmatically and removes the variance of diffusion generation.
  2.  **Cut the "Mechanistic Interpretability" pivot.** In the Failure Mode section, I included a pivot to analyzing attention heads. **Remove this.** That is a completely different skillset and project timeline. If the main hypothesis fails, stick to the behavioral analysis. Don't promise to open the black box if the behavioral probes fail.
  3.  **Tighten the "Goodman Pair" construction.** Constructing visual "Grue" problems is incredibly difficult to do programmatically without them looking contrived. **Limit:** Commit to only *two* specific types of ambiguity (e.g., Color vs. Shape priority, and Relation vs. Attribute priority). Do not promise a general solver for rule ambiguity.
  4.  **The "Bilateral" Hypothesis:** You suspect Bilateral is harder. Be careful not to stake the whole project on this being true. Frame it as a *variable to control*, not the *primary hypothesis*. The primary hypothesis is the 3-Level Distinction. The Bilateral/Catch-All split is just your method for controlling the difficulty of Level 1.

  **Why this proposal works:**
  It respects the "rationalist" background by focusing on the *structure* of the problem (induction vs. fitting) rather than just SOTA chasing. It respects the fellowship constraints by being an evaluation/probing project (cheap, fast) rather than a training project (expensive, slow). It provides a concrete tool (the harness) that ensures utility even if the philosophical thesis is debatable.
