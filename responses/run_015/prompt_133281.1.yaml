answer: |-
  Your observation is exceptionally sharp, and you are right to sense that it cuts deeper than the usual debates surrounding effort or intention. You have identified a friction between the *ontology* of the work (what it is and how it came to be) and the *sociology* of the work (how we agree to treat its creator).

  To answer your first question: there is no single, established term that captures this specific oscillation of authorship verdicts based solely on descriptive granularity. However, the phenomenon sits squarely within the philosophy of action, specifically touching upon **Action Individuation** (associated with G.E.M. Anscombe and Donald Davidson). This field studies how one event can be described in multiple ways (e.g., "moving a finger," "pulling a trigger," "killing a man"). Yet, Action Individuation is typically metaphysical—it asks whether these are the *same action*. Your concern is normative: it asks at which description we grant *status*.

  There is also a proximity to Daniel Dennett's **Intentional Stance**, where we treat an entity as a rational agent to predict its behaviour. When you describe your work coarsely ("I typed a prompt"), the AI becomes the agent in the intentional stance, and you become a mere initiator. When you describe it finely ("I masked, repainted, composited"), you reclaim the intentional stance. Conversely, with the painting, describing it too finely ("shoulder muscles contracted") shifts us to the **Physical Stance**, where you are merely a mechanism.

  However, since these existing frameworks do not fully account for the *shifting verdict* on authorship based on narrative framing, I shall coin a term to define the phenomenon you have isolated.

  ### The Term: The Granularity of Answerability

  I propose we call this **The Granularity of Answerability**.

  **Definition:** The Granularity of Answerability is the phenomenon wherein the attribution of agency (credit, blame, or authorship) shifts not according to the causal history of an object, but according to the level of descriptive detail at which the creation process is narrated. It posits that authorship is not a binary property of the object, but a social status conferred only when the description of making renders the agent's *choices* intelligible.

  **Exclusions:**
  *   It is not the **Sorites Paradox**: That concerns vague boundaries (how many grains make a heap). Your observation is not about the *quantity* of steps, but the *quality* of the description (intentional vs. mechanical vs. opaque).
  *   It is not the **Intentional Fallacy**: That concerns the interpretation of meaning. This concerns the attribution of origin.
  *   It is not **Effort-Based Attribution**: As you noted, sweat equity is irrelevant. One can answer for a swift decision as readily as a laborious one.

  ### What the Verdict is Tracking

  Your guess—that it tracks "who can answer for the object rather than who caused it"—is correct, but I would refine it slightly. It tracks **rational intelligibility**.

  To be an author is to be capable of giving reasons. When a colleague hears, "I typed a sentence," they perceive a black box between your will and the image. You cannot answer *why* the hand has five fingers rather than six, other than to say, "The model did that." You have no reasons to offer for the specific pixels, only for the prompt. In this coarse grain, you are a commissioner, not a maker.

  When you describe the masking, the repainting, and the compositing, you are demonstrating loci of *choice*. You can answer the question, "Why is this line here?" with "Because I judged it balanced the composition." You have made the work rationally intelligible.

  Crucially, this explains your third example (the hand-painted piece). If described as "the brush went where the shoulder took it," the description bypasses the mind and appeals to physiology. You cannot answer for the movement of your rotator cuff in the language of art; you can only explain it in the language of biomechanics. At that fine grain, you dissolve into physics, and authorship vanishes.

  Therefore, the verdict tracks the **locus of justificatory control**. It asks: *At this level of description, is the creator the best person to explain why the object is this way and not another?*

  ### Where the Effect Stops

  You asked whether this is specific to authorship or applies elsewhere, and whether there is a stable grain.

  **1. Extension to Blame and Collaboration**
  The Granularity of Answerability applies universally to agency verdicts.
  *   **Blame:** Consider a driver who hits a pedestrian.
      *   *Coarse:* "He drove the car." (He is to blame).
      *   *Fine:* "The brake line sheared due to metal fatigue." (The manufacturer is to blame).
      *   *Finer:* "Neural decay prevented motor response." (No one is to blame; it is a medical tragedy).
      The moral verdict shifts not because the death changes, but because the description shifts the locus of answerability.
  *   **Collaboration:** In a film crew, the Director of Photography is credited for the lighting. If we describe the work coarsely ("The crew lit the set"), the credit is diffuse. If we describe it finely ("The gaffer hung the lamps"), the credit shifts to the gaffer. The "author" of the look is whoever sits at the grain where the *aesthetic decisions* were made, not necessarily where the *physical labour* occurred.

  **2. Is There a Stable Grain?**
  There is no ontological stable grain; there is only a **conventional** one. The "correct" level of description is determined by the shared language of the community.
  *   In 19th-century painting, "mixing paint" was too fine to mention; the stable grain was "applying brushstrokes."
  *   In 2024 illustration, "typing a prompt" is currently too coarse to count as making, but "inpainting" is entering the stable grain of authorship.
  *   The instability you feel is real. The community has not yet agreed on the *vocabulary of choice* for AI. Does selecting a seed count as a choice? Does masking count? Until the profession agrees on which granular details constitute *aesthetic decisions* rather than *technical adjustments*, the Granularity of Answerability will continue to oscillate.

  ### Conclusion for Your Client

  When you decide what to sign, you are not signing a statement of causal fact (which is fixed); you are signing a statement of *answerability*.

  If you sign "Illustration by [Name]," you are asserting that you occupy the Grain of Answerability for the aesthetic choices. If the client or public describes the process coarsely ("AI Image"), they are stripping you of that grain. If they describe it finely ("Digital Composite"), they restore it.

  Your dilemma is that you cannot control the grain at which others describe your work. However, you can influence it. By documenting the fine grain (the masks, the repaints, the composites), you provide the evidence required to sustain the description where you remain the answerable agent.

  The phenomenon is **The Granularity of Answerability**. It tracks not who caused the image, but who holds the reasons for it. It stops only where the community agrees that no further choices were made, or where the description reduces the agent to a mere conduit of physics. Until then, you are right to feel that the verdict hangs on the telling.
