      *   Wait, EDT says $P(Rain | Umbrella)$ is high. So $EU(Umbrella)$ is high (avoid wetness). $EU(NoUmbrella)$ is low (get wet). So Umbrella is chosen. Is it ratifiable? Yes. If I assume I take the umbrella, $P(Rain)$ is still high, so I still want the umbrella.
