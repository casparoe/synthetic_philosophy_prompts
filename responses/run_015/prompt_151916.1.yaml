      *   **Drop (4).**
      *   **Reason:** Not all correlations are evidentially relevant *after conditioning on background knowledge*.
      *   **The "Cost":** You have to admit EDT is sensitive to how the agent's knowledge partitions the world. You have to accept that "Umbrella" cases are **Common Cause** problems (where $K$ screens off $A$'s evidence about $S$) and "Damascus" cases are **Newcomb** problems (where $A$ provides unique evidence about $S$).
