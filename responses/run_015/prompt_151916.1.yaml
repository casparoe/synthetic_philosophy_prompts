      *   Death in Damascus is a Newcomb problem (Act provides evidence of State). Umbrella is typically not (Act is caused by State, but conditioning on Act doesn't change the probability of State *if you condition on your reasons*).
      *   Wait, standard EDT *does* struggle with Umbrellas if formulated naively ($P(Rain|Umbrella)$ is high). This is the "Umbrella Problem" for EDT.
      *   **Solution:** **Conditionalization on available information.**
      *   EDT calculates $P(S | A \& K)$, where $K$ is the agent's background knowledge.
      *   In Umbrella case: $K$ includes "I see dark clouds" or "I heard the forecast".
      *   $P(Rain | Umbrella \& DarkClouds) \approx P(Rain | DarkClouds)$. The act of taking the umbrella adds negligible evidence once $K$ is fixed.
