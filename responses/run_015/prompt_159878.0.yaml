      *   Concessions/Non-negotiables? Yes.
      *   Private Fear? Yes.
      *   Horizontal/Vertical Critique? Yes.
      *   No generic padding? (Avoiding standard "Kim's Causal Exclusion" unless tailored).

  8.  **Final Polish:** Ensure the tone is supportive but rigorous. Make sure the "Soft Spot" admissions are honest—this is for prep, not ego stroking. (Self-Correction: Make sure the Lewisian objection hits the Ramsey Sentence specifically, as requested).

  9.  *(Final check on the Horizontal/Vertical distinction)*: The prompt asks to flag where this distinction assumes what needs to be proved. This is crucial. If "level" is defined functionally, then silicon is the same level. If "level" is defined physically, then silicon is a different level but maybe not a realizer. The distinction risks equivocation. I need to highlight this clearly.

  10. *(Final check on NRP Goodwill)*: The user needs to not alienate the seniors. Acknowledge Putnam's insight (contingency) even if denying the conclusion (anti-reductionism).

  Let's assemble the sheet.cw
answer: |-
  Here is your Q&A prep sheet, tuned to the specific dynamics of this room.

  ### **The "Horizontal/Vertical" Circularity Risk**
  *Read this first. This is the structural weak point in your argument that the Phil-Sci grads and the Commentator will smell immediately.*

  Your distinction relies on a pre-theoretic notion of "level."
  *   **The Trap:** If you define "level" functionally (e.g., the psychological level), then silicon systems that pass the Turing Test are *already* at the same level as brains. By calling them "Vertical" (different-level), you are implicitly assuming they *fail* to realize the psychological state.
  *   **The Accusation:** You are defining "Horizontal" as "realization we accept" and "Vertical" as "realization we doubt," then using the distinction to prove we should doubt Vertical cases.
  *   **The Fix:** You must define "level" via **mechanistic constitution** (parts/wholes) independent of the functional role. Horizontal = variation within the same constitutive mechanism type (biological wetware). Vertical = variation in constitutive mechanism type (silicon vs. wetware). You need to state this explicitly in the talk or you will lose the Phil-Sci students.

  ---

  ### **Top 8 Objections (Ordered by Damage Potential)**

  #### **1. The Lewisian Ramsey-Sentence Trap**
  *   **Who:** The Assigned Commentator.
  *   **The Question:** "You claim Vertical MR cases are merely 'mimicry' and not 'realization.' But on the Ramsey-sentence view, to realize a mental state *just is* to occupy the causal role defined by the theory. If the silicon system satisfies the Ramsey sentence variables, it realizes the state by definition. Aren't you just stipulating a dualist 'essence' requirement that functionalism explicitly rejects?"
  *   **The Reply (2 min):** "I'm not asking for an essence; I'm asking for **causal grounding**. Satisfying the input/output relations of a Ramsey sentence is necessary, but if the internal topology is achieved via lookup tables or homunculi, it's simulation, not occupation. Lewis requires the occupants to be *natural kinds* that fit the roles. I'm arguing we have no evidence that non-biological stuff fits the roles *as natural kinds* rather than as engineered approximations. I'm holding functionalism to its own naturalist standards."
  *   **Soft Spot:** You are walking a tightrope between "natural kind" and "magic." If the Commentator presses that *any* physical system satisfying the causal relations counts, you risk looking like you're denying functionalism rather than refining MR.

  #### **2. The "Level" Equivocation**
  *   **Who:** Phil-Sci Grad Students (in tandem).
  *   **The Question:** "Your Horizontal/Vertical distinction seems to beg the question. If a silicon circuit performs the same control function as a neural circuit, mechanistic explanation treats them as instances of the same control mechanism. By labeling that 'Vertical,' aren't you just defining 'same level' as 'biologically similar' to protect reduction?"
  *   **The Reply (2 min):** "Fair concern. I'm defining 'level' by **constitutive stuff**, not functional capacity. Horizontal MR is variation within a constitutive class (e.g., vertebrate nervous systems). Vertical MR is variation across constitutive classes. My claim is that reductionists can handle variation within a class (Horizontal), but NRP relies on variation across classes (Vertical) to block reduction. I'm arguing the evidence only supports the former."
  *   **Soft Spot:** If they argue that "constitutive stuff" is irrelevant to functional explanation (which is the core of NRP), your distinction collapses into irrelevance.

  #### **3. Degeneracy as Vertical Evidence**
  *   **Who:** Computational Neuroscientist.
  *   **The Question:** "I study motor circuits. We see the same output dynamics produced by completely different ion channel densities, different synaptic weights, and sometimes different network topologies. That's degeneracy. You call this 'Horizontal,' but when the physical mechanisms are that distinct, it looks like 'Vertical' MR happening right here in biology. Why isn't biological degeneracy proof that the function is detachable from the specific substrate?"
  *   **The Reply (2 min):** "Degeneracy is crucial, but it's still **biological constraint space**. Even with different channel densities, the system is still bound by electrochemical laws, metabolic constraints, and evolutionary history. That's 'Horizontal' in my schema—variation within the physical kind 'biological tissue.' Vertical MR requires leaving that constraint space entirely (e.g., silicon). Degeneracy shows robustness, not substrate independence."
  *   **Soft Spot:** The line between "extreme biological variation" and "different substrate" is fuzzy. If silicon neurons become biologically compatible, does it become Horizontal?

  #### **4. The "Nomic Necessity" Pushback**
  *   **Who:** Senior Non-Reductive Physicalist #1.
  *   **The Question:** "Even if you're right that we lack *actual* Vertical MR cases, the **possibility** is what blocks reduction. Reduction requires nomic necessity. If it is nomologically possible for pain to be realized in silicon, then pain cannot be reduced to C-fibers. You're conflating epistemic lack of evidence with metaphysical possibility."
  *   **The Reply (2 min):** "I'm challenging the modal intuition. We treat Silicon-Pain as possible because we assume functionalism is true. But if functionalism is the *conclusion* we're trying to prove via MR, we can't use the possibility of Silicon-Pain as a *premise*. Without actual cases, the modal claim is just an intuition pump. I'm asking for the empirical warrant for that modal leap."
  *   **Soft Spot:** Senior NRP will not accept that modal claims require empirical warrant. This is a fundamental methodological clash. You won't convert them; you just need to hold the line.

  #### **5. The "Disjunctive Reduction" Concession**
  *   **Who:** Senior Non-Reductive Physicalist #2.
  *   **The Question:** "You say Horizontal MR is 'harmless' because reductionists can handle messy many-one mappings via disjunctive kinds. But a disjunctive kind like (C-fibers OR Silicon-fibers OR Ectoplasm) is not a *lawful* kind. It doesn't support counterfactuals. So even if MR is only Horizontal, if the disjunction is heterogeneous enough, it still blocks scientific reduction."
  *   **The Reply (2 min):** "I agree that *indefinite* disjunctions block reduction. But Horizontal MR gives us a *bounded* disjunction (e.g., vertebrate neural realizers). Science routinely reduces properties with bounded disjunctions (e.g., 'gene' is massively disjunctive but still reducible to molecular biology). I'm arguing the MR we actually find is bounded enough for local reduction, even if not global type-identity."
  *   **Soft Spot:** You need to be ready to define "bounded." If the bounds are too loose, you're back to NRP.

  #### **6. The ML "It Works" Argument**
  *   **Who:** ML Person.
  *   **The Question:** "We train transformers on non-biological hardware. They exhibit generalization, abstraction, and sometimes reasoning. You call this 'mimicry.' At what point does the performance become 'realization'? If I can't tell the difference empirically, isn't your distinction metaphysical baggage?"
  *   **The Reply (2 min):** "It's not baggage; it's about **causal history**. A calculator mimics arithmetic, but it doesn't *understand* numbers. Current ML systems optimize loss functions; they don't have homeostatic imperatives or embodied stakes. Until the system has the same causal drivers as the biological target, it's mimicry. Performance parity isn't ontological parity."
  *   **Soft Spot:** This sounds suspiciously like a "biological chauvinism" objection. Be careful not to sound like you're invoking a soul.

  #### **7. The "Autonomy of Explanation" Point**
  *   **Who:** Senior Non-Reductive Physicalist #1 (Follow-up).
  *   **The Question:** "Let's grant your Horizontal/Vertical split. Psychology still requires generalizations that ignore the physical details of the Horizontal variation. If I have to know the specific circuit motif to explain the behavior, I'm doing neuroscience, not psychology. Doesn't MR still secure the **autonomy of the special sciences**, even if it doesn't block reduction?"
  *   **The Reply (2 min):** "I concede **pragmatic autonomy**. We use psychological vocabulary because it's efficient. But my thesis is about **ontological reduction**. You can have pragmatic autonomy without ontological MR. My argument is that MR doesn't prove the ontology is distinct, only that our *models* are distinct. I'm happy to keep the special sciences; I'm just denying they prove anti-reductionism."
  *   **Soft Spot:** This is where you buy goodwill. Don't fight for the elimination of psychology; fight for the physicalist ontology.

  #### **8. The "Load-Bearing" Dilemma**
  *   **Who:** The Commentator (Closing shot).
  *   **The Question:** "You argue MR is either true/harmless or load-bearing/unsupported. But what if the 'unsupported' Vertical cases are the only ones that matter for the *concept* of mind? If we can't conceive of mind without substrate neutrality, isn't your 'Horizontal only' view just a change of subject? You're talking about biological states, not mental states."
  *   **The Reply (2 min):** "That's a substantive claim about our concepts. I'm arguing our concept of 'mind' is tied to the biological agents we encounter. If we find out minds are biologically bound, that's a discovery, not a change of subject. I'd rather change the subject than build a philosophy on science-fiction intuitions."
  *   **Soft Spot:** This risks alienating the room if you sound too eliminativist about "alien minds."

  ---

  ### **Strategic Concessions & Non-Negotiables**

  **Concede in the First 5 Minutes (Goodwill for NRP Seniors):**
  1.  **Putnam's Insight:** Explicitly state that Putnam was right about **contingency**. The link between pain and C-fibers is not analytic. Do not try to defend Type Identity Theory in its 1950s form.
  2.  **Pragmatic Autonomy:** Agree that psychology will not be *replaced* by neuroscience. We need psychological generalizations for everyday life and high-level modeling.
  3.  **The "Multiple" in MR:** Acknowledge that "One-to-Many" mappings are real and scientifically important. Don't deny the data of variability.

  **Refuse to Give Up (The Core Thesis):**
  1.  **The Burden of Proof:** Do not accept the burden to prove Vertical MR is *impossible*. Insist the burden is on the NRP to show it is *actual* or *nomologically grounded*.
  2.  **Mimicry vs. Realization:** Do not collapse this distinction under pressure. If you concede that input/output equivalence = realization, you lose the argument.
  3.  **Horizontal is Reducible:** Stand firm that biological variation (Horizontal) is a problem for engineering, not metaphysics. It does not block ontological reduction.

  ---

  ### **The Question You're Privately Hoping Nobody Asks**

  **"If Vertical MR is unsupported, why is it the default assumption in 90% of contemporary philosophy of mind?"**

  *   **Why it hurts:** It exposes that your argument isn't just against MR, but against the methodological consensus of the field. It makes you look like an outsider fighting a battle everyone else thinks is over.
  *   **If asked:** "Because it's convenient. It allows us to do philosophy without waiting for neuroscience. But convenience isn't evidence. I'm arguing we've mistaken a methodological heuristic for a metaphysical truth."

  ---

  ### **Final Prep Note**
  The Neuroscientist and the ML person are your wild cards. They don't care about Lewis or Putnam. If you get bogged down in Ramsey sentences with them, you lose.
  *   **With the Neuroscientist:** Talk about **dynamics and constraints**.
  *   **With the ML person:** Talk about **architecture and training objectives**.
  *   **With the Philosophers:** Talk about **modality and natural kinds**.

  Keep the "Horizontal/Vertical" definition crisp. If that distinction blurs, the whole sheet burns. Good luck.
