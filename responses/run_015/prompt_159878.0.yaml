          3.  Computational Neuroscientist (studies degeneracy, anti-armchair).
          4.  Two Phil-Sci Grad Students (mechanistic explanation, levels).
          5.  One ML Person (thinks it's settled empirically).
      *   **User's Thesis:** Multiple Realizability (MR) argument fails for Non-Reductive Physicalism (NRP).
          *   Distinction: Horizontal MR (same-level variation, e.g., biological variation) vs. Vertical MR (different-level, e.g., silicon/aliens).
          *   Claim 1: Horizontal MR is real but compatible with reduction (messy many-one).
          *   Claim 2: Vertical MR threatens reduction but lacks evidence (mimicry vs. realization).
          *   Conclusion: MR is either true/harmless or load-bearing/unsupported.
      *   **Requirements:**
