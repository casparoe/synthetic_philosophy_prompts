answer: |-
  # Diagnostic Decision-Tree Taxonomy: The Distributed Paradox of Deontology

  This taxonomy maps the logical space of deontological responses to harms emerging from distributed agency (e.g., algorithmic systems, supply chains, democratic protocols). It proceeds from ontological commitments to specific diagnostic scenarios regarding culpability and remedial duty.

  ## The Decision Tree Structure

  **Root Question (Q1): Ontological Status of the Collective**
  *Do deontological constraints apply to collective entities (corporations, states, systems) as irreducible moral agents, distinct from the sum of their members?*
  *   **YES:** Go to **Branch A** (Collective Realism).
  *   **NO:** Go to **Branch B** (Methodological Individualism).

  **Node 2 (Q2): The Programmer Diagnostic (Causal Complicity)**
  *Does an individual violate a deontological constraint by contributing a necessary but non-decisive module to an automated system that produces rights-violating outcomes?*
  *   **YES:** (Contribution is sufficient for violation).
  *   **NO:** (Control/Intent is required for violation).

  **Node 3 (Q3): The Citizen Diagnostic (Remedial Duty)**
  *Is an agent morally required to violate procedural deontological norms (e.g., breaking a contract, leaking proprietary data, disrupting voting protocols) to dismantle an institutional architecture that produces distributed harm?*
  *   **YES:** (Structural Duty overrides Procedural Constraint).
  *   **NO:** (Procedural Constraint is absolute).

  ---

  ## Taxonomy Leaves (All 8 Logical Combinations)

  Below are the eight logically possible positions generated by the tree. Each leaf identifies the position, its resolution of the distributed paradox, and its "awkward commitment" (the theoretical cost).

  ### Branch A: Collective Realism (Q1 = YES)

  #### Leaf 1: A-Yes-Yes (Radical Shared Agency)
  *   **Commitments:** Collectives are real agents; Individual contribution is culpable; Structural duty overrides procedure.
  *   **Position Name:** **Participatory Realism** (akin to *Shared Intentionality Theory* + *Activist Deontology*).
  *   **Resolution of Paradox:** The paradox is dissolved by doubling down: both the system and the individual are bound. The individual must not contribute, and if the system exists, they must dismantle it even via norm-violation.
  *   **Awkward Commitment:** **Double Jeopardy & Moral Overload.** Individuals are punished twice (once as members, once as contributors) and face impossible conflicts where they must violate one deontological rule (contract fidelity) to satisfy another (harm prevention), creating a "dirty hands" scenario for the conscientious agent.

  #### Leaf 2: A-Yes-No (Corporate Statism)
  *   **Commitments:** Collectives are real agents; Individual contribution is culpable; Structural duty does *not* override procedure.
  *   **Position Name:** **Bureaucratic Deontology** (Unnamed).
  *   **Resolution of Paradox:** Individuals are blamed for contributing, but the system's integrity is protected. One must not code the harm, but one must not leak data to stop the system either.
  *   **Awkward Commitment:** **Institutional Fetishism.** This position forbids the only effective means of stopping a harmful system (whistleblowing/disruption) while blaming individuals for the system's existence. It renders the deontological constraint against harm practically impotent against institutional momentum.

  #### Leaf 3: A-No-Yes (Collective Shield Reformism)
  *   **Commitments:** Collectives are real agents; Individual contribution is *not* culpable; Structural duty overrides procedure.
  *   **Position Name:** **Institutional Fictionalism** (Unnamed).
  *   **Resolution of Paradox:** The collective bears the sin, not the worker. However, members have a duty to "exorcise" the collective entity, even via norm-violation.
  *   **Awkward Commitment:** **The Villainless Atrocity.** It admits that rights are being violated (by the collective) but asserts that no individual currently acting is violating constraints. It relies on a metaphysical entity to absorb blame that intuition suggests belongs to humans.

  #### Leaf 4: A-No-No (Pure Corporate Realism)
  *   **Commitments:** Collectives are real agents; Individual contribution is *not* culpable; Structural duty does *not* override procedure.
  *   **Position Name:** **Compartmentalized Agency** (akin to *Legal Corporate Personhood* extended to ethics).
  *   **Resolution of Paradox:** The paradox is located entirely at the institutional level. Individuals are morally clean so long as they follow internal rules.
  *   **Awkward Commitment:** **The Moral Vacuum.** This allows for systemic genocide or rights-violation where every individual participant is morally blameless. It severs the link between human action and moral outcome entirely.

  ### Branch B: Methodological Individualism (Q1 = NO)

  #### Leaf 5: B-Yes-Yes (Complicit Activism)
  *   **Commitments:** Collectives are *not* agents; Individual contribution *is* culpable; Structural duty overrides procedure.
  *   **Position Name:** **Strict Complicity Theory** (akin to *Kagan's Complicity Principle*).
  *   **Resolution of Paradox:** There are no collective agents, only people. If the outcome is harmful, contributors are violators. They must stop contributing and dismantle the network, even if it requires breaking minor norms.
  *   **Awkward Commitment:** **Paralysis & Vigilantism.** It implies that participating in modern society (taxes, internet, supply chains) is likely morally forbidden. It also licenses individuals to violate procedural rights (privacy, property) in the name of stopping "structural" harm they cannot fully control.

  #### Leaf 6: B-Yes-No (Strict Individualism)
  *   **Commitments:** Collectives are *not* agents; Individual contribution *is* culpable; Structural duty does *not* override procedure.
  *   **Position Name:** **Libertarian Deontology** (akin to *Nozickian Side-Constraints*).
  *   **Resolution of Paradox:** You are responsible for your contribution, but you have no right to violate others' procedural constraints (property/contract) to stop the collective outcome.
  *   **Awkward Commitment:** **The Trap of Legitimacy.** An individual is forbidden from contributing to a harmful system but also forbidden from effectively stopping it if doing so infringes on the rights of other contributors. This leads to a stable equilibrium of distributed harm where no one is permitted to fix it.

  #### Leaf 7: B-No-Yes (Structural Duty Individualism)
  *   **Commitments:** Collectives are *not* agents; Individual contribution is *not* culpable; Structural duty overrides procedure.
  *   **Position Name:** **Duty-Based Structuralism** (Unnamed / Theoretically Unstable).
  *   **Resolution of Paradox:** Individuals aren't to blame for the harm (lack of control), but they have a positive duty to fix the structure, even via norm-violation.
  *   **Awkward Commitment:** **Incoherent Liability.** This branch is logically strained: it asserts individuals did nothing wrong by building the system (Q2=No) but must break rules to dismantle it (Q3=Yes). It posits a duty to remedy a harm for which the agent bears no causal/moral responsibility. **Diagnosis: Theoretically Unattractive.**

  #### Leaf 8: B-No-No (Volitional Purity)
  *   **Commitments:** Collectives are *not* agents; Individual contribution is *not* culpable; Structural duty does *not* override procedure.
  *   **Position Name:** **Kantian Individualism** (akin to *Classic Deontological Voluntarism*).
  *   **Resolution of Paradox:** Morality governs the will, not outcomes. If I did not intend the harm and lacked control over the collective outcome, I am clean. I have no duty to dismantle structures I do not control.
  *   **Awkward Commitment:** **Structural Impunity.** This validates the "Nuremberg Defense" in algorithmic contexts. It allows massive rights violations to persist as long as they are sufficiently distributed that no single will intends them.

  ---

  ## Diagnostic Analysis of Unoccupied/Unstable Branches

  *   **Leaf 7 (B-No-Yes):** This position is rarely occupied in literature because it divorces *responsibility* from *remediation*. Deontological duties to repair usually presuppose some level of causal implication or prior violation. A position claiming "You didn't do wrong, but you must break rules to fix it" lacks a grounding principle for the obligation.
  *   **Leaf 4 (A-No-No):** While common in legal corporate theory, this is ethically unoccupied by serious moral philosophers because it entails the possibility of "evil without evildoers," which contradicts the foundational deontological aim of protecting rights-holders from moral agents.
  *   **Leaf 2 (A-Yes-No):** Theoretically unstable. If individuals are culpable for contributing (Q2=Yes), deontology typically generates a duty of restitution or prevention (Q3=Yes). Denying the duty to fix what one is culpable for creates a disconnect between blame and obligation.

  ---

  ## Overlap Flag: Named Positions Not Separated by the Tree

  This taxonomy fails to separate the following pairs of named positions due to shared logical commitments on the specific questions asked:

  **1. Kantian Individualism (Leaf 8) vs. Contractualist Individualism (Leaf 8)**
  *   **Shared Commitment:** Both reject Collective Agency (Q1=No) and reject Causal Complicity without Control (Q2=No).
  *   **Reason for Overlap:** The tree focuses on *causal structure* and *ontological status*. It does not query the *source* of the constraint (Reason vs. Agreement). Both land in "Volitional Purity" despite differing meta-ethical foundations.
  *   **Differentiation Required:** A question regarding the *source* of duty (e.g., "Are constraints derived from rational consistency or reasonable rejection?").

  **2. Participatory Realism (Leaf 1) vs. Utilitarian Institutionalism (False Positive Risk)**
  *   **Shared Commitment:** Both may answer Yes to Q3 (Duty to dismantle harmful structures).
  *   **Reason for Overlap:** The tree's Q3 asks if one must violate norms to fix structures. A Rule-Utilitarian might say "Yes" (because the rule 'fix harm' maximizes utility), landing them in Leaf 1 logically, despite being consequentialists.
  *   **Differentiation Required:** A root filter for *Deontological vs. Consequentialist* meta-ethics is assumed but not explicitly tested. This tree assumes the respondent is already within the deontological family.

  **3. Strict Complicity Theory (Leaf 5) vs. Act Deontology (Leaf 5)**
  *   **Shared Commitment:** Both reject Collective Agency (Q1=No) and affirm Causal Complicity (Q2=Yes).
  *   **Reason for Overlap:** Both focus on the individual act's moral quality regardless of institutional context.
  *   **Differentiation Required:** A question regarding *generalizability* (e.g., "Does the prohibition hold even if universal compliance would lead to worse outcomes?").

  ## Summary of Diagnostic Utility

  This tree isolates the specific tension in distributed deontology: **The Gap between Causal Contribution and Moral Control.**
  *   **Left Side (Branch A)** attempts to bridge the gap by creating a new agent (The Collective).
  *   **Right Side (Branch B)** attempts to bridge the gap by expanding individual liability.
  *   **Top Half (Q2=Yes)** prioritizes the *Outcome* (Harm occurred, someone is to blame).
  *   **Bottom Half (Q2=No)** prioritizes the *Will* (Harm occurred, but no one intended it).
  *   **Left Column (Q3=Yes)** prioritizes *Remediation* (Stop the harm at all costs).
  *   **Right Column (Q3=No)** prioritizes *Constraint* (Do not violate norms, even to stop harm).

  The most viable deontological positions for distributed agency typically cluster in **Leaf 1 (Participatory Realism)** or **Leaf 5 (Strict Complicity)**, as these are the only positions that acknowledge the harm without absolving all human actors, though both pay a high price in terms of individual demandingness.
