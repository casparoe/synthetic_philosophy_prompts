prompt: |-
  I am defending a dissertation chapter in a forty-minute job talk with twenty-five minutes of questions afterward, and I want a Q&A prep sheet written against a specific room rather than against the debate as it exists in the abstract. Below is my thesis, the argument as I will actually present it, and the audience. Please build the prep sheet so that every objection targets one of the actual moves in my argument, not the standard dialectic between realism and antirealism that anyone could recite.

  My thesis: the pessimistic meta-induction — the argument that because most past theories which enjoyed empirical success were later judged false, our own successful theories are probably false too — derives its force from a badly constructed reference class, and once that class is repaired the induction no longer supports its conclusion. The class of once-successful theories is assembled backwards: one starts from theories we now reject and then asks whether they were successful, which all but guarantees a high falsehood rate among the sample, since a theory we still accept cannot appear in it at all. The class I propose instead is what I call forced novel predictive success, FNPS for short. A theoretical posit earns FNPS when it generates a prediction that (i) was not among the phenomena the theory was constructed to accommodate, and (ii) could not have been accommodated by retuning the theory's adjustable parameters without forfeiting successes the theory had already banked. My illustrations will be the prediction of a previously unobserved planet from residual perturbations in the orbit of a known one, the prediction of the properties of an element occupying a gap in a periodic classification, and the prediction of a specific new particle from a symmetry scheme. My two historical claims are, first, a base-rate claim: among posits that earned FNPS, the falsehood rate is far lower than the rate the pessimistic induction advertises, and second, an asymmetry claim: posits that merely accommodated known data, or that earned success only through adjustable parameters, are the ones that get discarded at theory change, while FNPS posits are retained in limiting or structural form by the theories that replace them. Call the resulting position discriminating realism. It does not say that our best theories are true or even approximately true as wholes; it says that the posits which earn FNPS carry a warrant that survives theory change, and that the pessimistic induction supplies no reason to deny this. Because the warrant is local and earned case by case rather than a global reliability claim about science as such, I will argue it is not vulnerable to the obvious retort that it is just another induction over the history of science and hence hoist by its own petard.

  The room, in the order in which they are likely to speak:

  1. A historian of early modern science who chairs the session and is sympathetic to the view that what gets recorded as a successful prediction is curated after the fact by the victors.
  2. A structural realist who thinks my position is structural realism with extra steps and will press the point that retention in a limiting relation is not reference to an entity.
  3. An entity realist of the no-miracles persuasion who thinks I have conceded away the whole abductive case and bought nothing with the concession.
  4. A constructive empiricist who holds that empirical adequacy is all we should want and will ask what FNPS warrant buys that acceptance of a theory does not already give us.
  5. A formal epistemologist who works on Bayesian confirmation and reference class problems, and who will want likelihoods, priors over a space of theories, and an answer to whether FNPS is a property I can identify in advance or only in hindsight.
  6. A particle physicist from the department down the hall who is impatient with metalevel debate and will ask darkly what FNPS is supposed to say about dark matter, about inflation, and about interpretations of quantum mechanics.
  7. Two generalists in moral philosophy and ancient philosophy who will ask, politely, why any of this matters outside the philosophy of science.

  What I want is a prep sheet, not a defense of the view. Concretely:

  First, a table with nine rows, one objection each, ordered by expected damage understood as likelihood multiplied by seriousness, with these columns:

  rank — integer, 1 to 9, in the order I should prepare for them
  objector — which member of the audience above, by number and short label
  objection_as_they_would_phrase_it — one to three sentences in that person's own idiom and vocabulary, as they would actually say it out loud
  likelihood — High, Medium, or Low
  damage_if_unanswered — High, Medium, or Low
  my_ninety_second_reply — the reply written in the first person, in spoken register, deliverable in about ninety seconds
  concede — what I should give up immediately in that exchange
  hold — what I should refuse to give up even under pressure
  weakest_joint — the soft spot in that reply, and the follow-up question a sharp member of the audience would hit next if they noticed it

  Second, after the table, a JSON object with exactly these fields:

  ordering_rationale — a string of at most eighty words explaining why the top three rows are ordered as they are
  opening_concessions — an array of two or three strings, things I should concede in the first five minutes of the talk before anyone raises them
  one_reply_that_must_land — a string identifying which reply in the table the thesis cannot survive without, and why
  my_weakest_point — an object with keys statement, why_it_is_weak, defensive_line, and legitimate_pivot, describing the weakest step in my own argument, why it is weak, my best line of defense, and the nearest honest place I can move the conversation if the defense fails
  question_i_hope_nobody_asks — an object with keys objector, question, why_it_is_lethal, best_available_answer, and damage_control, covering a tenth objection that is worse than any in the table; I would rather know about it than be surprised
  friendly_looking_questions_that_are_traps — an array of two objects, each with keys question and what_it_really_does, for questions that sound like invitations to elaborate but actually commit me to something I cannot defend
  vocabulary — an object with keys use and avoid, listing the phrasing that will land with this department and the phrasing that will make them hear me as a partisan
  if_the_room_hardens — a string describing what I should do if the structural realist and the constructive empiricist converge on the claim that my view collapses into one of theirs

  Please keep the whole thing answerable without reference to specific publications: I do not want citations, bibliographies, or reading lists, and I do not need anyone's exact wording quoted. What I need is the objections this particular mixture of people would generate, in their voices, with something I can actually say back.
