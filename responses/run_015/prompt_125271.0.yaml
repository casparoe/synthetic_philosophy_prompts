prompt: |-
  I sit on the internal review panel of a large hospital trust, and next month I have to spend forty minutes with the trust's clinical safety committee explaining why the readmission-risk score we are about to procure cannot simultaneously satisfy the three fairness properties the committee has written into its own procurement specification.

  The setting: discharged medical patients are ranked by a model that outputs a probability of unplanned readmission within thirty days. The two hundred highest-scoring patients per month get two home visits from a district nurse; everyone else gets usual care. The committee's specification demands that the score be (a) calibrated within each of the two patient groups the trust monitors under its equality duties — call them A and B, with observed readmission rates of roughly 22% and 11% respectively; (b) such that, among patients who would not have been readmitted, the false-positive rate is equal across A and B; and (c) such that, among patients who would have been readmitted, the false-negative rate is equal across A and B. The vendor has told them all three are achievable. They are not, except in edge cases.

  Plan how I teach this, rather than teaching it to me. Specifically:

  State the order in which the components have to arrive and what each depends on. I take it that the group-difference in base rates has to be on the table before the conflict can even be stated, and that calibration has to be cashed out as a statement about what a number means rather than about how accurate it is — but tell me the sequence you would actually use, and why the alternatives fail (e.g. why opening with the algebra, or with the definitions of the three criteria, or with an abstract example involving coins or urns, leaves the committee with the wrong picture).

  Give me the one worked example that carries the whole session, and say what it must contain and what it must not. My instinct is a small fictitious table of scores and outcomes for a dozen patients, built so that the three criteria visibly pull apart, but I want to know which features are load-bearing — differing base rates, a score that is genuinely informative but nowhere near perfect, a scarce and genuinely beneficial intervention — and which features would mislead by importing a separate moral problem (training-label bias, a proxy variable doing the work, an intervention that harms some patients).

  Map the misconceptions this audience will predictably bring or form, and say at which point in the sequence each should be defused. The ones I anticipate: that fairness just is not using group membership, so the fix is to delete it from the data; that an impossibility theorem means the score is biased and should therefore be rejected outright; that the conflict is a small technical wrinkle we can split the difference on by approximately satisfying all three; that equalising the share of visits going to A and to B is the same as any of (b) or (c); that calibration is a claim about individuals. Add the ones I have not thought of, including the ones specific to clinicians rather than to statisticians.

  Two complications I will have to handle, and I want them placed deliberately rather than bolted on. First, the committee will ask that the three criteria hold not only for A and B but for every subgroup anyone can name — each ward, each admitting diagnosis, each comorbidity. I want to know where in the sequence that demand belongs and what it does to the argument, including what a relaxation to "calibrated on average within every efficiently-identifiable subgroup" would buy us. Second, the two hundred slots are a hard capacity constraint, not a threshold; tell me where the fixed-budget framing should enter and what it does to the menu of criteria, since I suspect it makes some of the committee's phrasing incoherent.

  Tell me what I should openly decline to explain at this level and say so out loud — I assume causal or counterfactual notions of fairness, and the fact that patients who receive the visits have their readmission outcome partly determined by the visit itself, so that the very error rates in (b) and (c) are only partly observable.

  Finally, give me one question to close on that would show me the idea had landed rather than that the committee had merely been impressed: my candidate is to double the nurse capacity and ask whether the conflict persists, but I suspect a better version changes something about the base rates or the score's accuracy instead, so propose the version that actually discriminates between understanding and deference.

  Write the plan in British English, and do not point me to papers, vendors, or reading.
reasoning: |-
  Here's a thinking process that leads to the suggested teaching plan:

  1.  **Analyze the Request:**
      *   **Role:** Internal review panel member at a large hospital trust.
      *   **Audience:** Clinical Safety Committee (clinicians, administrators, likely some governance leads).
      *   **Task:** Explain in 40 minutes why a readmission-risk score *cannot* satisfy three specific fairness properties simultaneously (Calibration, Equal False Positive Rate, Equal False Negative Rate) given different base rates.
      *   **Constraint:** The user wants a *teaching plan*, not an explanation of the math itself. They want to know *how* to teach it.
      *   **Key Elements Required:**
          *   Sequence of components (order of operations).
          *   One worked example (features to include/exclude).
          *   Misconceptions (anticipated and unanticipated, specific to clinicians).
          *   Two Complications (Subgroups/Intersectionality & Fixed Capacity/Thresholds).
          *   What *not* to explain (Causal/Counterfactual, Interference).
          *   Closing Question (to test understanding vs. deference).
          *   Language: British English.
          *   Constraint: No citations/references.

  2.  **Deconstruct the Mathematical Reality (The "Impossibility Theorem"):**
      *   The core conflict is the Chouldechova (2017) / Kleinberg et al. (2016) impossibility result.
      *   If Base Rates ($P(Y=1|A) \neq P(Y=1|B)$) differ, you cannot have Calibration + Equal FPR + Equal FNR simultaneously unless the classifier is perfect or base rates are equal.
      *   *Calibration:* $P(Y=1 | Score=s, Group=g) = s$.
      *   *Equal FPR:* $P(Score > t | Y=0, A) = P(Score > t | Y=0, B)$.
      *   *Equal FNR:* $P(Score < t | Y=1, A) = P(Score < t | Y=1, B)$.
      *   *Capacity Constraint:* Top 200 patients get visits. This turns a probability threshold into a rank-order cut-off, which complicates the FPR/FNR definitions slightly (they become dependent on the distribution of scores, not just a fixed $t$), but the fundamental tension remains.

  3.  **Drafting the Sequence (The "Order of Operations"):**
      *   *Bad starts:* Algebra (too abstract), Definitions first (dry, doesn't show conflict), Coins/Urn (too detached from clinical reality).
      *   *Good start:* The Clinical Goal. Why are we here? To save readmissions.
      *   *Step 1: The Base Rate Reality.* Must establish Group A (22%) vs Group B (11%) first. Without this, the math doesn't break.
      *   *Step 2: Calibration.* Define it as "meaning of the number." If score says 20%, 20% get readmitted.
      *   *Step 3: The Trade-off.* Show how satisfying Calibration + Base Rate difference forces Error Rate divergence.
      *   *Why this order?* It grounds the math in clinical epidemiology (base rates) before moving to model performance (calibration) before hitting the wall (error rates).

  4.  **Designing the Worked Example:**
      *   *Needs:* Small enough to follow, large enough to show rates. Needs distinct base rates. Needs a score that is informative but imperfect.
      *   *Avoids:* Causal claims (does the visit work?), Proxy bias (is the score racist?), Harmful interventions.
      *   *Structure:* A 2x2 table isn't enough. Need a score distribution. Let's use a simplified "Risk Bucket" approach.
      *   *Load-bearing features:* Different prevalence (22% vs 11%). Imperfect separation (overlap in scores).
      *   *Misleading features:* Don't make the score *too* bad (AUC 0.5) or *too* good (AUC 1.0). Don't introduce "cost" of errors yet.

  5.  **Mapping Misconceptions:**
      *   *Anticipated:* "Blindness" (remove group label), "Bias = Reject," "Split the difference," "Equal Visits = Fair," "Calibration = Individual Accuracy."
      *   *Unanticipated (Clinician specific):* "Risk is inherent to the patient" (vs. model output), "We treat the high risk, so low risk doesn't matter," "Clinical judgement overrides the score" (ignoring the procurement spec).
      *   *Timing:* Defuse "Blindness" early (after base rates). Defuse "Split the difference" during the trade-off. Defuse "Individual Accuracy" during Calibration definition.

  6.  **Handling Complications:**
      *   *Subgroups (Intersectionality):* This makes the base rate problem worse (smaller n, more variance). Place this *after* the main impossibility is established. It amplifies the problem, doesn't solve it. Relaxation: "Calibrated on average" is the only viable path, but weakens safety guarantees.
      *   *Fixed Capacity (Top 200):* This is crucial. It means the threshold $t$ moves. If Group A has higher risk, they fill more slots. To equalise FPR/FNR, you might need to change the threshold per group, which violates the "single list" procurement or the capacity constraint. This needs to be introduced *before* the final impossibility proof, as it constrains the solution space further. Actually, better to introduce it *after* the theoretical impossibility to show practical incoherence. Wait, the prompt asks where it fits best. It makes the FPR/FNR definitions tricky. Let's place it after the base rate setup but before the final trade-off demonstration, because it dictates *how* the threshold is set.

  7.  **What NOT to Explain:**
      *   Causal fairness (does the intervention cause the outcome?).
      *   Interference (SUTVA violations due to nurse visits).
      *   Why? 40 minutes is too short. It confuses the *statistical* impossibility with *causal* uncertainty. Keep it to the properties of the *score*, not the *effect of the visit*.

  8.  **The Closing Question:**
      *   User's idea: Double capacity. (Doesn't solve base rate issue).
      *   Better idea: Equalise Base Rates. (If base rates were equal, the theorem disappears).
      *   Best idea: Ask about the *consequence* of choosing one metric over the other. "If we prioritise Equal False Negatives, which group gets more nurses, and which group suffers more unnecessary visits?" This tests if they understand the *trade-off*, not just the math.
      *   *Refinement:* The prompt suggests changing base rates or accuracy. If base rates are equal, the conflict vanishes. That's the "aha" moment. "What would have to be true about the underlying health of Group A and Group B for all three criteria to hold?" Answer: Their readmission rates would have to be identical.

  9.  **Refining the Tone and Language:**
      *   British English (programme, centre, prioritise, whilst, etc.).
      *   Professional, authoritative but collaborative (Internal Review Panel to Clinical Safety Committee).
      *   No citations.

  10. **Review against Constraints:**
      *   40 minutes context.
      *   Teaching plan, not lecture notes.
      *   Address specific complications (subgroups, capacity).
      *   Address specific misconceptions.
      *   Address what to decline.

  11. **Self-Correction/Polishing during drafting:**
      *   *Correction on Capacity:* The capacity constraint (Top 200) makes "Equal FPR/FNR" even harder because the threshold is endogenous. If Group A has higher risk, they dominate the top 200. To equalise FPR, you'd need to lower the threshold for B, but you can't exceed 200 slots without dropping A. I need to make sure the plan highlights that the *fixed budget* makes the error rate criteria mutually exclusive with the *ranking* mechanism.
      *   *Correction on Subgroups:* Don't let this derail the main point. It's an amplifier. Place it near the end as a "scaling" issue.
      *   *Correction on Closing Question:* The user suggested doubling capacity. I need to propose the version that discriminates understanding. Asking "What must be true about the disease prevalence for this to work?" is the strongest test of the base-rate insight.

  12. **Final Plan Structure:**
      *   Introduction (Objective & Tone).
      *   Sequence of Components (The Narrative Arc).
      *   The Worked Example (The "Patient Ledger").
      *   Misconceptions & Defusal Points.
      *   Handling Complications (Subgroups & Capacity).
      *   Boundaries (What to Decline).
      *   Closing Question.

  (Proceed to generate output based on this thought process.)
answer: |-
  # Teaching Plan: The Impossibility of Simultaneous Fairness Metrics

  **Objective:** To guide the Clinical Safety Committee to the conclusion that the procurement specification contains mutually exclusive requirements due to underlying epidemiological differences, not model failure.
  **Time:** 40 minutes.
  **Tone:** Collegiate, clinically grounded, mathematically rigorous but algebra-light.

  ---

  ## 1. Sequence of Components

  Do not begin with definitions. Do not begin with the vendor's claim. Begin with the epidemiology. The conflict is not a property of the algorithm; it is a property of the population.

  **Order of Operations:**

  1.  **The Clinical Reality (Base Rates):** Establish that Group A and Group B have different underlying risks of readmission (22% vs 11%).
      *   *Why:* This is the load-bearing premise. Without this difference, the impossibility theorem collapses. If you start with the model, they will think the model is the problem.
  2.  **The Resource Constraint (The Cut-off):** Explain the "Top 200" rule.
      *   *Why:* This fixes the selection threshold. It turns a probability into a rank. It prevents the solution of "just treat everyone above risk $X$."
  3.  **Calibration (The Meaning of the Score):** Define calibration as "when the score says 20%, 20% of those patients are readmitted."
      *   *Why:* Clinicians often confuse calibration with discrimination. You must establish that a well-calibrated score tells the truth about risk *within* each group.
  4.  **The Error Rate Conflict (FPR/FNR):** Show that if Base Rates differ and Calibration holds, the Error Rates *must* diverge.
      *   *Why:* This is the conclusion. It must come last, supported by the previous three steps.

  **Why alternatives fail:**
  *   **Opening with Algebra:** The committee will tune out. It looks like a vendor dispute, not a patient safety issue.
  *   **Opening with Definitions:** They will treat (a), (b), and (c) as a checklist. You need them to see (a), (b), and (c) as a triangle where stretching one side snaps another.
  *   **Opening with Abstract Examples (Coins/Urns):** This invites the objection that "clinical risk is different." Keep the example clinical to prevent them from dismissing the math as theoretical.

  ---

  ## 2. The Worked Example: "The Patient Ledger"

  Use a single, static table projected on the screen. Do not animate it. Let them stare at the numbers.

  **Structure:**
  Create a fictitious cohort of 1,000 patients (500 Group A, 500 Group B).
  Divide them into three "Risk Buckets" based on the model's output: High (Score > 0.5), Medium (0.2–0.5), Low (< 0.2).

  **What it must contain:**
  *   **Differing Base Rates:** Ensure the total readmitted in A is ~22% and in B is ~11%.
  *   **Perfect Calibration:** Within each bucket, the % readmitted must match the score range (e.g., in the High bucket, ~60% of A and ~60% of B are readmitted).
  *   **Imperfect Discrimination:** There must be readmissions in the Low/Medium buckets and non-readmissions in the High bucket.
  *   **The Capacity Cut-off:** Highlight exactly where the "Top 200" line falls. Because A has higher risk, more A patients will be in the High bucket.

  **What it must not contain:**
  *   **Causal Claims:** Do not label columns "Saved by Nurse." The outcome is *potential* readmission, not *actual* readmission post-intervention.
  *   **Protected Characteristics:** Do not specify what A and B are (e.g., race, deprivation). Keep it abstract to prevent the discussion from shifting to sociological causes of the base rate difference.
  *   **Harmful Interventions:** Do not suggest the nurse visits cause harm. This muddies the water regarding False Positives.

  **Load-Bearing Feature:**
  The critical visual is that to capture the same *proportion* of true readmissions (Equal FNR) in Group B as in Group A, you must lower the threshold for Group B. But because Group B has lower base rates, lowering the threshold floods the list with False Positives (violating Equal FPR) or pushes Group A patients off the list (violating the single ranking list).

  ---

  ## 3. Misconceptions and Defusal Points

  You must anticipate these objections and address them *before* they derail the session.

  | Misconception | When to Defuse | How to Defuse |
  | :--- | :--- | :--- |
  | **"Fairness is Blindness"** (Remove group labels from data) | **Immediately after Step 1 (Base Rates).** | Explain that removing the label does not remove the risk correlation. If Group A has higher comorbidity burden, the model will learn proxies for Group A. Blindness preserves the base rate difference, which is the source of the mathematical conflict. |
  | **"Calibration is Individual Accuracy"** (If score is 20%, *this* patient has 20% risk) | **During Step 3 (Calibration).** | Clarify: Calibration is a property of the *group* of patients with that score, not the individual. It means "of 100 people with this score, 20 return," not "this person is 20% returned." |
  | **"Split the Difference"** (Optimise for all three approximately) | **During Step 4 (The Conflict).** | State clearly: This is not a tuning problem. It is a geometric impossibility. You cannot be "slightly pregnant." Satisfying two forces the third to break, proportional to the base rate gap. |
  | **"Equal Visits = Fairness"** (50% of slots to A, 50% to B) | **During Step 2 (Capacity).** | Distinguish *allocation parity* from *error rate parity*. Equal slots does not guarantee Equal FNR. If A is higher risk, giving them equal slots might actually under-serve their need (higher FNR). |
  | **"The Score is Biased/Reject It"** (Impossibility implies defect) | **Conclusion.** | Reframe: The impossibility proves the score is *working* (detecting the base rate difference). A score that satisfied all three would be ignoring the clinical reality of Group A's higher risk. |
  | **"Clinical Judgement Overrides"** (We will adjust the list manually) | **Pre-emptively in Introduction.** | Acknowledge this, but note the procurement spec binds the *tool*. If the tool cannot produce a compliant list, manual override becomes the default algorithm, negating the procurement. |
  | **"Small Subgroups are Safe"** (This only applies to big groups) | **During Complication 1 (Subgroups).** | Explain that smaller subgroups have noisier base rates, making the conflict *more* volatile, not less. |

  ---

  ## 4. Handling the Complications

  Do not bolt these on. Integrate them into the narrative flow.

  **Complication 1: The Subgroup Demand (Intersectionality)**
  *   **Placement:** Introduce this *after* you have established the impossibility for Groups A and B.
  *   **The Argument:** If the math fails for two large groups, it fails more severely for twenty small ones.
  *   **The Relaxation:** Explain that requiring calibration within *every* efficiently-identifiable subgroup (e.g., "Women over 70 with Diabetes on Ward 4") leads to data sparsity. You cannot calculate a false-negative rate on a subgroup of 10 patients where only 1 was readmitted.
  *   **The Compromise:** Propose "Calibrated on Average." The score need not be calibrated in every ward, but the *average* error across wards must match the prediction. This buys statistical stability but sacrifices the committee's desire for local guarantees.

  **Complication 2: The Fixed Capacity (Top 200)**
  *   **Placement:** Introduce this *before* the Error Rate Conflict (Step 4).
  *   **The Argument:** The committee's specification asks for Equal False Positive Rates. But FPR is determined by the threshold. In a "Top 200" system, the threshold is not fixed; it floats to meet the capacity.
  *   **The Incoherence:** If Group A has higher risk, they naturally occupy more of the Top 200. To equalise FPR, you would need to set a *different* threshold for Group B. But you cannot have two thresholds on a single ranked list used to allocate 200 slots.
  *   **The Consequence:** You must choose: either a single list (violating Equal FPR/FNR) or separate lists per group (violating the "single score" procurement and potentially violating capacity constraints if one group doesn't have enough high-risk patients).

  ---

  ## 5. What to Decline to Explain

  You have 40 minutes. You must explicitly state what is out of scope to maintain focus on the *statistical* impossibility.

  **State this aloud:**
  *"I am not going to address whether the nurse visits actually prevent readmission, nor whether the act of visiting changes the risk profile. I am also not addressing causal fairness—whether the score reflects historical inequity. Those are vital questions, but they are separate from the mathematical constraint I am here to demonstrate. Even if the visits are 100% effective and the history is perfectly just, these three criteria cannot coexist given the current readmission rates."*

  **Why:**
  *   **Causal/Counterfactual:** Introduces unobservable variables. If you discuss whether the visit *caused* the non-readmission, you cannot calculate the False Negative rate (you don't know if they *would* have been readmitted). Keep the outcome as "Observed Readmission" for the sake of the metric definition.
  *   **Interference:** Discussing whether the visit harms/benefits shifts the goal from *prediction fairness* to *treatment efficacy*.

  ---

  ## 6. The Closing Question

  Do not ask if they understand. Ask a question that forces them to apply the logic to a counterfactual scenario. Your candidate (doubling capacity) is weak because it doesn't address the base rate divergence.

  **Proposed Closing Question:**
  *"If we could magically change one thing about the patient population to make all three fairness criteria simultaneously achievable, without changing the model or the number of nurses, what would have to change about the health of Group A and Group B?"*

  **The Correct Answer:**
  *"The underlying readmission rates for Group A and Group B would have to be identical."*

  **Why this discriminates:**
  *   **Deference:** They will say "We need a better model" or "We need more data."
  *   **Understanding:** They will recognise that the conflict is driven by the *base rate difference* (22% vs 11%). If the prevalence is equal, the impossibility theorem no longer holds. This confirms they understand that the tension is epidemiological, not computational.

  **Follow-up (if needed):**
  *"Since we cannot magic away the disease burden, which of the three criteria are we willing to relax to ensure the 200 highest-risk patients are actually identified?"* (This forces the procurement decision back to them, where it belongs).
