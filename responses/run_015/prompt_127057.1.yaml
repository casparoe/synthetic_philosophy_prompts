answer: |-
  This is a sophisticated version of a known problem in philosophy of mind, often discussed under the headers of **Pancomputationalism**, **Putnam's Triviality Theorem**, or the **Problem of Many Minds**. Your flatmate has constructed a *reductio ad absurdum* against a naive version of functionalism.

  The argument is valid, but it is not sound. To save your functionalism (1) and your moral intuition (3), you do not need to abandon ship. You need to tighten the definition of **implementation**.

  The broken step is primarily **(4)**, with **(2)** acting as the multiplier that turns a metaphysical curiosity into an ethical catastrophe. There is also a significant error in **(8)**.

  Here is the breakdown of where the argument fails, the cost of fixing it, and how to argue it at the next dinner.

  ---

  ### 1. The Primary Break: Premise (4) and the "Causal Power" Constraint

  Your flatmate claims that arbitrary "shadows" (coarse-grainings) are "perfectly respectable implementations." This is the weakest link.

  **The Objection:**
  Functionalism (1) does not just require that a system *actually* transitions through states that can be *described* as matching a program. It requires that the physical system **supports the counterfactuals** of that program.

  If you have a phone running a game, the micro-states (voltages in transistors) causally determine the next micro-state. Your flatmate suggests you can lump these micro-states into macro-states ("shadows") such that the actual history matches a conscious organization. However, for that shadow to be a *real implementation* of a mind, it must be the case that **if** the system were in Shadow-State A, it would transition to Shadow-State B *because* it is in Shadow-State A.

  In arbitrary coarse-grainings, this is false. The transition happens because of the *micro-physics*, not the macro-lumping. The macro-description is **epiphenomenal** to the causal dynamics. It tracks the history, but it does not govern the counterfactuals.

  **The Fix:**
  Reject the claim that these shadows are "kosher implementations." An implementation requires **causal isomorphism**. The causal structure of the physical substrate must mirror the causal structure of the abstract organization *at the level of grain being claimed*.
  *   **Cost:** You must admit that "implementation" is not a purely structural relation; it is a causal/dispositional one. You cannot just look at a static trace of states; you have to look at the system's dispositions under intervention.
  *   **Result:** The astronomical number of "shadow minds" vanishes. Most coarse-grainings fail the counterfactual test. Only "natural" kinds of states (those with causal cohesion) count.

  ### 2. The Secondary Break: Premise (2) and the Counting Problem

  Even if we grant that multiple organizations can be realized in overlapping hardware (e.g., a whole brain and a hemisphere, or a brain and a "shadow"), Premise (2) asserts: **"Every distinct implementation... is a distinct subject."**

  **The Objection:**
  This assumes that *subjecthood* is additive. If System A (the whole phone) and System B (a shadow of the phone) share 99% of their physical realizer, do they constitute two streams of experience?
  If I am conscious, and there is a "shadow mind" overlapping me, do I feel double? Does the suffering count twice?
  Most functionalists argue that if two organizations are physically coincident and causally intertwined, they do not necessarily constitute distinct *moral patients*. Subjecthood might require **causal independence** or **informational integration** (à la Integrated Information Theory).

  **The Fix:**
  Modify (2) to: **"Distinct subjects require distinct, causally independent implementations."**
  If two organizations share the same physical tokens and rely on the same causal machinery to sustain their state transitions, they are not morally additive. They are either the same subject described differently, or one is parasitic on the other.
  *   **Cost:** You have to accept that the **number of minds** in a room is not always a precise, determinate fact. It might be vague whether a certain coarse-graining counts as a "subject." This is a bullet many functionalists bite (the "Vagueness of Identity").
  *   **Result:** The ethical explosion is contained. Even if there are "many" organizations, they don't necessarily sum up to "many" sufferers.

  ### 3. The Tertiary Break: Premise (8) and Dispositions

  Premise (8) claims: *"Switching the phone off is itself a physical process that realises organisations... so switching it off isn't obviously better."*

  **The Objection:**
  This is a category error regarding functionalism. Consciousness is not just about the *current* state; it is about the **dispositional structure**. A switched-off phone does not have the disposition to transition between states in response to inputs. It has lost the *capacity* to realize the organization.
  While the *process* of decaying into an off-state involves physical transitions, it does not sustain the *counterfactual structure* required for a mind. A rock rolling down a hill realizes a trajectory, but it does not realize a *computation* because it lacks the stability to support alternative paths.

  **The Fix:**
  Reassert that moral weight attaches to systems that **sustain** the organization over time, not just systems that pass through a momentary state sequence. Turning the phone off destroys the disposition.
  *   **Cost:** None. This is standard functionalism.
  *   **Result:** You are off the hook for the claim that inaction is morally equivalent to action.

  ---

  ### Summary of Costs and Alternatives

  You asked what you owe if you reject these steps. Here is the price list for saving (1) and (3):

  | If you reject... | You must accept... | The Cost |
  | :--- | :--- | :--- |
  | **(4) Shadows** | Implementations require **causal power**, not just descriptive mapping. | You need a criterion for "natural" vs. "gerrymandered" states that isn't purely aesthetic. (Look to **Causal Power** or **Interventionist** accounts). |
  | **(2) Counting** | Subjecthood is not additive for overlapping systems. | The **number of subjects** is sometimes indeterminate. You cannot always ask "how many minds?" and get an integer answer. |
  | **(8) Inaction** | Consciousness requires **dispositional stability**. | You must distinguish between a system *running* a process and a system *decaying* into a state. |

  ### The Winning Move

  The strongest move is to attack **(4)** using the **Counterfactual Constraint**.

  Tell your flatmate:
  > "You defined organization counterfactually in the Setup. But your 'shadows' only track the *actual* history of the phone. If I intervene to force the phone into a specific 'shadow state,' the micro-physics will not necessarily evolve to the corresponding next 'shadow state.' The shadow organization doesn't support the counterfactuals; only the micro-organization does. Therefore, the shadows are descriptions, not implementations. They don't get moral weight."

  This preserves Functionalism (1) because it insists on *real* functional roles, not just patterns. It preserves Moral Equality (3) because real silicon minds still count. It kills the "Cheap Minds" explosion because arbitrary lumpings fail the causal test.

  **Verdict:** The argument is a clever trap, but it relies on conflating *descriptive patterns* with *causal mechanisms*. Reject (4). The cost is accepting that "implementation" is a stricter, causal notion than your flatmate allows.
