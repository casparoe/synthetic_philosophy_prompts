answer: |-
  **Project Title:** Structural Undefinedness: A Decision-Theoretic Analysis of the Pasadena Paradox

  **Project Summary**
  This project investigates the Pasadena Paradox, a decision scenario where the expected value of a gamble is mathematically undefined due to conditional convergence. While standard decision theory requires a defined expectation to rank choices, the Pasadena game yields contradictory recommendations depending on how the sum is ordered or how information is conditioned. This proposal asks: *In a decision scenario where conditioning on available information yields contradictory recommendations because the underlying expectation is undefined, is the contradiction mathematical, epistemic, or normative?* I propose that undefined expectation is not a technical glitch to be regularized, but a structural feature revealing limits on admissible conditioning rules. By formalizing a minimal model and comparing three conditioning strategies, this project aims to derive a criterion distinguishing admissible from inadmissible conditioning in cases of undefined expectation.

  **Statement of the Problem**
  The Pasadena Paradox extends the St. Petersburg lineage. In the standard formulation, a coin is tossed until heads appears. If heads appears on toss $n$, the payoff is determined by a series that converges conditionally but not absolutely. Consequently, the expected value is undefined; by rearranging the terms of the series, one can "prove" the game is worth any finite amount or infinity.

  The philosophical crisis arises when an agent receives partial information (e.g., "the outcome is not $n=1$"). Conditioning on this information should update the expected value. However, because the global expectation is undefined, conditional expectations can conflict with unconditional intuitions or yield contradictory values depending on the partition used. This creates a trilemma. If the mathematics prohibits a unique sum, is the error:
  1.  **Mathematical:** The probability space is ill-defined.
  2.  **Epistemic:** The agent lacks the information required to resolve the ordering.
  3.  **Normative:** The principle of maximizing expected utility is inapplicable here.

  **Critique of Standard Resolutions**
  Current literature offers three primary resolutions, all of which leave a critical gap regarding the nature of the contradiction.

  First, some propose **rejecting the conditioning step**, arguing that one cannot condition on events within an undefined expectation framework. This is ad hoc; it protects the theory by forbidding the data rather than explaining why the data is incompatible with the theory. Second, others suggest **restricting the Principle of Total Evidence**, allowing agents to ignore certain partitions. This undermines the core Bayesian commitment that all relevant evidence must be incorporated, effectively solving the paradox by weakening the normative standard. Third, appeals to **bounded rationality** argue that real agents cannot compute infinite series. While pragmatically sound, this sidesteps the ideal-theory question: what *should* a rational agent do if they could compute it?

  All three approaches treat the undefined expectation as a defect to be patched. They fail to address whether the contradiction reveals a deeper structural constraint on how decision rules interact with infinite sample spaces.

  **Proposed Approach and Methodology**
  I propose treating the undefined expectation not as a computational failure, but as a structural feature analogous to the Borel-Kolmogorov paradox in continuous spaces. In continuous probability, conditioning on events of probability zero requires specifying a limiting process (a partition). Similarly, the Pasadena paradox suggests that in infinite discrete spaces with undefined expectations, conditioning is only admissible if the partition respects the structural convergence of the payoff series.

  This approach is justified against two obvious alternatives. Declaring the game **inadmissible** simply bans the counterexample without explaining the boundary of the ban. Patching the expectation with an **arbitrary truncated prior** imports normative assumptions about risk aversion that beg the question; it solves the math by changing the preferences. Instead, I will investigate whether the probability theory itself, properly interpreted, dictates when conditioning is permissible.

  **Method:**
  I will formalize a minimal model using standard Kolmogorov probability theory, isolating the payoff structure from extraneous psychological factors. I will then test three conditioning rules to determine if any avoid contradiction without importing question-begging normative assumptions:
  1.  **Standard Bayesian Conditioning:** Applying $P(A|B) = P(A \cap B) / P(B)$ directly to the payoff series.
  2.  **Jeffrey Conditioning:** Updating probabilities without certain evidence, allowing for probability kinematics across the partition.
  3.  **Restricted Principle of Indifference:** Conditioning only on partitions that preserve the symmetry of the underlying measure.

  For each rule, I will derive the conditional expectation. I will check for internal consistency (does the rule yield the same value under equivalent descriptions?) and external consistency (does the rule align with dominance principles?).

  **Criteria for Success and Failure**
  **Success** is defined as deriving a clear, non-arbitrary criterion distinguishing admissible from inadmissible conditioning in cases of undefined expectation. Specifically, the model should demonstrate that the Pasadena scenario falls determinately on one side of this line (e.g., showing that conditioning is inadmissible *unless* a specific convergence constraint is met). This would classify the contradiction as structural/mathematical, limiting the scope of normative rules.

  **Failure** is defined as a result where all three rules either collapse into contradiction or depend on an arbitrary cutoff parameter (e.g., a specific truncation point). This would indicate that the paradox is genuinely unresolved within standard probability theory, suggesting that the contradiction is normative and requires a new decision rule entirely.

  **Timeline and Milestones**
  This project is designed for a one-semester timeline (5 months).

  *   **Month 1: Formalization.** Construct the minimal probability space for the Pasadena variant. Define the payoff function and the specific information partitions to be tested.
  *   **Month 2: Rule Analysis (Bayes & Jeffrey).** Apply Standard Bayesian and Jeffrey conditioning to the model. Document points of divergence or mathematical undefinedness.
  *   **Month 3: Rule Analysis (Indifference & Synthesis).** Apply the Restricted Principle of Indifference. Compare results against the first two rules to identify structural commonalities in failure or success.
  *   **Month 4: Criterion Development.** Synthesize findings to formulate the admissibility criterion. Test the criterion against edge cases to ensure robustness.
  *   **Month 5: Drafting and Review.** Write the final paper for the workshop. Prepare a presentation summarizing the distinction between mathematical and normative contradictions.

  **Significance**
  Resolving the Pasadena Paradox is not merely about solving a puzzle; it is about defining the domain of expected utility theory. If undefined expectations are structural features rather than errors, decision theory requires a meta-rule for when expectations can be computed. This project will provide that meta-rule, clarifying the boundary between mathematical possibility and normative requirement in infinite decision spaces.
