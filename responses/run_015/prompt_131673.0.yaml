          Desire-Satisfaction Theory identifies well-being with the fulfillment of preferences. This creates a complex conflict between desire levels in these cases. In the REM, first-order desires (e.g., 'I want to cure this disease') are satisfied because the cure is real. However, second-order desires (e.g., 'I want to feel proud of curing this disease') are frustrated by the block. In the SEM, the reverse occurs: second-order desires for feeling are met, but first-order desires for reality are frustrated. A global desire theorist might argue that most people globally desire 'truth' over 'illusion,' potentially favoring the REM. They might claim that if the agent knew the facts, they would desire the REM. However, a local desire theorist focused on immediate psychological states would favor the SEM. The theory struggles here because it lacks a metric to weigh the satisfaction of 'truth desires' against 'feeling desires.' It remains internally consistent only if one specifies which desires count, revealing that desire theory often relies on hidden objective assumptions about which desires are rational. If the theory counts all actual desires, it may favor the SEM (since the desire to feel good is strong). If it counts idealized desires, it may favor the REM. This inconsistency exposes the theory's vulnerability to how desires are framed.

          Objective-List Theory asserts that certain things are good regardless of attitude or experience. Goods typically include knowledge, friendship, and achievement. The REM contains genuine instances of these goods: the relationships are reciprocal, and the achievements causally impact the world. The SEM contains only simulacra. Therefore, an objective-list theorist must rank the REM higher than the SEM. They can defend this by arguing that the value of achievement lies in the exercise of capability and causal efficacy, not the experiential payoff. This aligns with the intuition that a life of real contribution is better than a life of happy delusion. However, this theory risks the 'alienation objection'; if the agent feels nothing, can the life truly be said to go well *for them*? It separates well-being from the subject's perspective entirely. An objective-list theorist must argue that benefit does not require conscious appreciation, a hard pill to swallow for those who view well-being as inherently experiential.

