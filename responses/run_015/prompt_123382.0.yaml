  2.  **Deconstruct Nietzsche's Argument (for accuracy):**
      *   *Monumental History:* Looks to great past figures for inspiration to act now. *Danger:* Ignores context, forces analogy where none exists, turns past into myth, discourages unique creation.
      *   *Antiquarian History:* Reverence for origins, preserving everything. *Danger:* Mummifies life, treats everything as equally valuable, stifles growth/newness, becomes mere hoarding.
      *   *Critical History:* Judging and condemning the past to break its chain. *Danger:* Rootlessness, inability to belong, destroying the soil from which one grows, injustice to the past.
      *   *Core Tension:* History serves life, but too much history kills life. Institutionalizing these modes creates a bureaucracy of existence.

