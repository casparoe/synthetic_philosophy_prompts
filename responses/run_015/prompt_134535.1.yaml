          *   Deadline: Thursday's vote.

  2.  **Determine the Recommendation:**
      *   *Option A (Deny):* Aligns with victim families. Risks losing crucial structural data. Might stall the broader truth-seeking mission.
      *   *Option B (Approve Unconditionally):* Unacceptable. Undermines justice.
      *   *Option C (Approve with Strict Conditions):* This is the most pragmatic and ethically defensible middle ground. It acknowledges the value of truth (investigators) while respecting the gravity of the crimes (families).
      *   *Decision:* Recommend **Approve with Strict Conditions**. This allows for the "systemic map" but adds layers of accountability to address the "commodification of trauma" concern.

  3.  **Identify the "Losing Side" Argument to Engage:**
      *   If I recommend approval (even conditional), the "losing side" is the faction arguing *against* amnesty (Victim Families/Those who see it as commodifying trauma).
      *   *Argument:* "We are trading suffering for filing-cabinet confessions." (Commodifying trauma).
      *   *Engagement:* I need to acknowledge that truth without justice is hollow, but argue that *structural* truth is a form of justice that prevents recurrence, provided the amnesty isn't a "get out of jail free" card but a "trade for history."

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
