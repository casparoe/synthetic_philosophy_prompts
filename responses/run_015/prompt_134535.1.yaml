      *   **Context:** Charter borrows from South Africa's TRC, Argentina, Rwanda, but lacks specificity on "full disclosure" (direct participation vs. systemic knowledge).
      *   **Requirements:**
          *   Recommend a concrete course (Approve/Deny/Approve with Conditions).
          *   Include clear time frame and verification step.
          *   Engage the strongest argument from the losing side seriously (either "administrative neutrality" or "commodifying trauma").
