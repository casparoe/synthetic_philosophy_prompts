answer: |-
  It is understandable why the legal analogy appeals to your circle given the structural similarities, but your intuition that it is doing too much heavy lifting is well-founded. If we map the terrain to see where the correspondence holds, the blamer corresponds to the plaintiff initiating the suit, while the wrongdoer is the defendant, and the moral community or perhaps the conscience of the participants acts as the judge or jury. The rules of procedure map onto the norms of appropriate moral address, and the conflict-of-interest check is where the hypocrisy objection sits, functioning as a barrier to entry. The verdict corresponds to the attribution of fault, and enforcement lies in the social sanctions or relational changes that follow. However, the analogy fractures immediately when we look for the institutional gatekeeper. In a court, a judge dismisses a case for lack of standing before the merits are heard, but in moral life there is no central authority to declare you disqualified. When a hypocrite blames someone, the interaction still happens; the accused might reject the blame, but there is no third party stripping the blamer of the right to speak.

  This leads to the function of hypocrisy. In law, a conflict of interest is a procedural bar that prevents the case from proceeding regardless of the evidence, but in morality, hypocrisy functions more like a credibility deficit than a jurisdictional error. If a smoker tells you smoking is bad, the truth of the claim remains even if their standing is compromised. The legal model suggests the charge is invalid, whereas the moral reality suggests the messenger is flawed but the message might still land. Furthermore, the court picture imports a specific notion of authority and enforcement that interpersonal blame lacks. Legal standing protects the integrity of the state's monopoly on violence and judgment, ensuring only proper parties invoke state power. Moral blame is not an exercise of state power but a negotiation of relationship status. You do not need a license to express disappointment or resentment, even if you are guilty of the same thing, though doing so might invite resentment in return.

  This is where the niche framing you mentioned regarding standing as a defeasible social token becomes useful. Instead of a binary license that is either valid or revoked, standing looks more like social currency that can be depleted. Hypocrisy spends down your token value, making your blame less effective or more costly to issue, but it does not necessarily render the transaction impossible. This framing respects the decentralized nature of moral life where there is no clerk of court to stamp your filing as rejected. It allows us to say that a hypocrite has less standing, or that their blame is appropriately met with a tu quoque response, without claiming they are metaphysically barred from participating in the moral community.

  So, to answer your final question directly, the conclusion that hypocrisy always kills standing does not survive once the disanalogies are on the table. The binary all-or-nothing conclusion relies on the existence of a judge to enforce the disqualification, and without that institutional structure, hypocrisy remains a substantive reason to distrust or resist the blamer rather than a procedural bar that silences them entirely. The legal framing was carrying the whole argument all along, and once you remove the imaginary judge and the binary switch of procedural dismissal, you are left with a more nuanced picture where hypocrisy weakens the force of blame but does not extinguish the right to offer it.
