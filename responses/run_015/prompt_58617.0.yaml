  You are a professional philosopher specializing in ethics and collective action, and I need you to think really carefully here, like start with some brainstorming of a few different diagnoses before you settle on your answer.

  I'm a retired natural scientist — did chemistry, mostly environmental sampling, for 30-odd years — and since retiring I've gotten sucked into philosophy through a library discussion group. Last week we got stuck on meat and flying and voting, and my old lab brain keeps telling me causes have to make a physical difference. A buddy in the group laid out this arguement that I can't shake, becuase each step sounds right but the end point seems nuts: (1) An act can be wrong because of its consequences only if it actually makes the outcome worse than it would have been otherwise. (2) My single chicken sandwich, my single drive to see the grandkids, my single vote in a national election each make the outcome no worse — chicken is ordered in huge lumpy batches so one sandwich never triggers another batch, my puff of CO2 on a smooth dose-response curve never flips a flood or heat death from not happening to happening, one vote in a hundred million never flips the result. It reminds me of buffer solution in the lab where you can add drop after drop with the pH meter not budging at all. (3) So none of those single acts are wrong because of consequences. (4) And what goes for me goes for everyone in the same spot, so no individual sandwich or drive or non-vote is wrong for that reason. (5) But if no individual contribution is wrong, then blaming the group — like saying frequent flyers together wrecked the climate or meat buyers together drive factory farming — makes no sense, you can't get a blameworthy collective harm out of zero blameworthy parts. (6) So we either have to stop blaming anyone for climate change and factory farming, which feels absurd, or give up (1).

  I really want to hold onto (1) if I can, it just feels like basic science to me, but I don't want to say nobody did anything wrong while the planet cooks. Which step should I give up, why did it look so plausible, and what does giving it up cost me compared to giving up a different one?
