answer: |-
  **Brainstorm**

  Quantitative audiences treat probability as a property of the model, not the mind. Their first instinct is to pool data streams; Aumann forbids this. They view the common prior as an empirical claim about psychology rather than a consistency condition on rationality. If I lead with the prior, they dismiss the theorem as 'unrealistic'. If I lead with the conclusion, they hear 'consensus implies truth'. The real obstacle is their habit of interpreting disagreement as a data-processing error rather than an information-structure feature. They need to see the partitions before they accept the prior.

  Their professional habit is 'error correction': if numbers differ, one model is misspecified. Aumann suggests both can be rational given different information sets. I must prevent them from solving the example numerically before understanding the information topology. The 'common prior' objection is actually a shield against the implication that their own persistent disagreements are irrational. I must frame the prior not as 'same start' but as 'same rules of inference'.

  The slogan 'cannot agree to disagree' is dangerous. It suggests disagreement is impossible, rather than 'common knowledge of disagreement' is impossible. They will seize on real-world disagreement to dismiss the theorem. I must distinguish the epistemic state (knowing that you know) from the mere fact of differing numbers. Until they grasp that distinction, the theorem feels like a paradox rather than a constraint.

  **Dependency Structure**

  Put the **partitions** on the board first. Draw the state space grid and the analysts' information sets. This grounds the theorem in information topology, which quants respect. If you start with the **common prior**, Colleague 1 dismisses the session as unrealistic before you begin. The prior must be introduced as the metric that allows us to compare the partitions meaningfully, not as the driver of the result.

  Introduce **common knowledge of posteriors** only after the partitions are fixed. Explain that announcing a number refines the partition (the 'meet'). The conclusion follows inevitably. Bring in the slogan 'cannot agree to disagree' only at the very end, phrased strictly as: 'Common knowledge of differing posteriors is impossible.' This prevents the misconception that disagreement itself is impossible, reserving the force of the theorem for the *knowledge* of the disagreement.

  **The Example**

  Use a binary event: 'Merger Passes'. State space $\Omega = \{1, 2, 3, 4\}$. Event $E = \{1, 2\}$.
  **Constraints:**
  1.  **Cross-cutting partitions:** Analyst A distinguishes $\{1, 2\}$ from $\{3, 4\}$; Analyst B distinguishes $\{1, 3\}$ from $\{2, 4\}$. This prevents one model simply refining the other.
  2.  **Visible opening posteriors:** Set priors such that at state 1, A calculates 0.9 and B calculates 0.2. This creates visible conflict.
  3.  **Movement:** After exchanging numbers, the 'meet' of their knowledge must refine the state to $\{1\}$.
  4.  **Non-compromise:** The final agreed posterior must be 1.0 (certainty). This is crucial. If they agree on 0.55, the audience assumes averaging. Agreeing on 1.0 proves information cascading, not compromise.
  5.  **Relevance:** Use 'Merger' or 'Credit Event', not urns. This ensures they treat it as epistemic disagreement, not statistics.

  **Misconception Map**

  1.  **'Disagreement cannot persist':** Head off immediately after the slogan. Clarify: disagreement persists, but you cannot *know* that you disagree.
  2.  **'Compromise':** Head off with the Example's final posterior (1.0 vs 0.9/0.2).
  3.  **'Pooling Evidence':** Head off during the Partition phase. Emphasise: A never sees B's signal, only B's number.
  4.  **'Common Prior is empty':** Head off by framing it as 'same likelihood function', not 'same initial belief'.
  5.  **'Agreement = Accuracy':** Head off with the Observer Variant (see below).
  6.  **'Uncertainty about knowledge is fatal':** Head off by showing the partition model *is* the model of that uncertainty.

  **Variants**

  1.  **Direction-only Protocol:** Place this immediately after the main example. Ask: 'What if they only say "Up/Down/Stable"?' Agreement is still forced (Geanakoplos-Polemarhakis). This isolates the *ordering* of beliefs from the *magnitude*, showing the result relies on information structure, not numerical precision.
  2.  **The Observer:** Place this last, before the check. Introduce C, who sees the transcript but holds a private signal. C need not agree with A and B. This shows agreement is relative to the information pool, not truth. It blocks the slide from 'Agreement' to 'Accuracy'.

  **Check for Understanding**

  Ask: 'A and B agree on 0.6. C knows their partitions and priors but holds a private signal contradicting their data. Must C agree?'
  **Answer:** No.
  **Why:** This separates those who think the theorem forces universal truth (failed) from those who understand it forces consistency within a common knowledge group (passed).

  **Omissions and Skeleton**

  **Refusals:**
  *   Proof: 'The algebra is an identity; the intuition is in the partitions.'
  *   No-trade/Markets: 'That applies to betting markets; we are modelling belief consistency.'
  *   Prior Origin: 'That is a philosophical dispute; today we test structural consistency.'

  **Skeleton (40 mins):**
  *   **00–05:** Intro. Address the two attitudes (Prior vs. Deference).
  *   **05–15:** **Board 1 & 2:** State space, Partitions, Common Prior definition.
  *   **15–30:** **Board 3:** The Merger Example. Walk through the rounds. Show the non-compromise convergence.
  *   **30–35:** Variants. Direction-only (structure over number); Observer (agreement ≠ truth).
  *   **35–40:** Check for Understanding. Q&A. Close with the corrected slogan.
