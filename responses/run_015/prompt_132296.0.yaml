      *(Self-Correction on Opening)*: Why Decision Theory over Welfare Economics? Welfare economics often assumes cardinality immediately. Decision theory starts with preference orderings ($A \succ B$). This is better for discussing *lexicality* (ordering) before getting into *measurement* (cardinality).

      *(Self-Correction on Closing Question)*: The prompt asks for a question showing they understand the *commensurability issue*. The question needs to probe whether they see that preserving commensurability *within* the upper tier might undermine the lexical gap *between* tiers.

  6.  **Final Polish of the Plan:** Structure it chronologically with time stamps for clarity. Ensure the "Why" for each choice is explicit so the TA understands the pedagogical move.

      *   *Opening:* Decision Theory (Preferential structure).
      *   *Scenario:* "The Pain Clinic Allocation" (Avoids "torture vs specks" by focusing on triage logic).
      *   *Misconceptions:* Address Deontology early (Case 2), Address Psychology late (Case 3).
      *   *Closing:* The "Internal Exchange Rate" question.
