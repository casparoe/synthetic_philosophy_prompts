  **Note on Interpretation**

  While the identification of emptiness (*śūnyatā*) with dependent origination (*pratītyasamutpāda*) is a settled cornerstone of Madhyamaka (MMK 24.18), scholarly debate persists regarding Nāgārjuna's logical intent. Classically, the tetralemma is read as a *prasajya* negation, denying four exhaustive positions about intrinsic nature without asserting alternatives. Conversely, some contemporary scholars argue for a paraconsistent reading, where contradictory horns might hold jointly on the conventional level. Furthermore, it is contested whether emptiness is a metaphysical thesis about reality's structure or a therapeutic device for loosening conceptual fixation.

  This poem leans toward the therapeutic, anti-realist reading. By framing the horns within lines about "words," "conventions," and "views," it suggests the tetralemma targets conceptual reification rather than ontological facts. The final stanza enacts the "emptiness of emptiness" by having the line "Emptiness empties even this view" precede the final horn, preventing the negation itself from becoming a new absolute. This privileges the Prāsaṅgika interpretation over metaphysical or paraconsistent readings, presenting the poem's resolution as soteriological rather than doctrinal.
