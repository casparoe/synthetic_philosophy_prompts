answer: |-
  The break is in **Step 4**.

  Step 4 claims that the logic of "ignoring vanishingly small probability branches" applies to single trials because the "more probable branch" in a single trial is the analogue of the "typical set" in a long sequence. This is false. It looks harmless because it exploits an ambiguity in the word "typical," but it smuggles in a limit property ($N \to \infty$) that does not exist at $N=1$.

  Here is the diagnosis of why Step 4 fails, what repetition actually does, and the price of fixing it.

  ### 1. Why Step 4 Breaks
  In the repeated betting scenario (Claims i and ii), the Expected Value (EV) maximizer goes broke because the expectation is driven by outcomes where the win rate is significantly *higher* than the expected 60% (e.g., winning 80% or 100% of the time). By the Law of Large Numbers, the probability of achieving these outlier win rates converges to **zero** as the number of rounds increases. The set of paths that sustains the high EV has measure zero in the limit. Thus, ignoring them (Step 3) is justified in the long run because they *will not happen*.

  Step 4 asserts that in a single trial, the "less probable branch" (e.g., the 40% loss chance, or the 49% million-dollar chance) is analogous to those measure-zero paths. **It is not.**

  In a single trial, a 40% or 49% probability is not "vanishingly small." It is substantial. It is not a measure-zero outlier; it is a core component of the ensemble. In the repeated case, the "EV-driving" paths vanish because they require *sustained* deviation from the mean. In the single case, the high-magnitude outcome happens *immediately* with fixed, non-negligible probability. Step 4 tries to import the "concentration of measure" from the long run into the single shot, where no such concentration exists.

  ### 2. What Repetition Does (That Single Shots Don't)
  You asked what exactly repetition does that justifies Step 3 but blocks Step 5. It is **the conversion of probability into frequency.**

  *   **In Repetition:** The "typical set" is not a single branch; it is a vast collection of sequences where the *frequency* of wins matches the *probability* of wins (e.g., roughly 60% wins). As rounds increase, the probability mass of this set approaches 1. The "atypical" paths (the ones driving EV) are pushed into a set of probability approaching 0. You are justified in ignoring them because, in a long sequence, they effectively *do not occur*.
  *   **In a Single Shot:** There is no frequency to converge. There is only the ensemble. You face the full probability distribution, not just the mode. A 49% chance is not "noise"; it is nearly half the reality.

  The "Law of Large Numbers" is the engine that makes the typical set have probability near 1. Without repetition, the "less probable branch" retains its full weight. Step 4 ignores this engine.

  ### 3. Coherence of Your Position
  You asked if it is coherent to keep (i), (ii), and Expected Utility (EU) for one-offs. **Yes, it is fully coherent.**

  There is no contradiction between these three because they address different mathematical objects:
  *   **(i) and (ii)** describe **time averages** (ergodicity). They tell you about the behavior of a *trajectory* over time. Wealth is non-ergodic; the time-average growth rate is not the ensemble-average growth rate. Kelly optimizes the time-average.
  *   **EU for One-Offs** describes an **ensemble average**. It tells you how to value a *distribution* of outcomes when you only sample it once.

  The friend's error is assuming that because the time-average (Kelly) is the correct normative guide for *sequences*, it must also be the correct guide for *ensembles*. This is only true if the system is ergodic (where time average = ensemble average). Financial wealth under compounding is not ergodic. A single gamble is an ensemble sample.

  ### 4. The Price You Pay
  To reject Step 4 and keep your view, you must pay the following normative costs:

  1.  **Kelly is Instrumental, Not Fundamental:** You must concede that Kelly betting is not a universal law of rationality. It is a specific strategy for **survival and growth in non-ergodic repeated processes**. It is not a theory of *value*; it is a theory of *dynamics*. It tells you how to stay in the game, not how to value the prize.
  2.  **Expected Value is Not "Wrong," Context-Dependent:** You must admit that Claim (i) is not a reductio of Expected Value itself, but a reductio of **linear utility of wealth in repeated compounding**. EV is the correct rule for one-offs (or additive bets). It fails in repeated multiplicative bets only because "wealth" is the wrong variable to maximize linearly over time (due to ruin). If you maximize Expected *Log* Utility (a reasonable utility function), EV works fine in both cases.
  3.  **No Universal "Geometric Rationality":** You must reject the idea that there is a single "geometric" rule that replaces expected utility everywhere. Geometric rationality is a heuristic for handling non-ergodicity. It does not license ignoring 49% risks in single shots (Step 6).

  ### 5. Addressing the Composition Worry (Step 8)
  Your intuition in Step 8 is correct and reinforces the rejection of Step 4.
  *   **Expectation is linear:** The expected value of a sequence of decisions is the sum of the expected values. It composes perfectly.
  *   **Median is not linear:** The median of a sum is not the sum of the medians. As you noted, if you make 1,000 decisions each with a 99% success rate, the probability of *all* landing on the median branch is low. A rule based on "what happens in the typical branch" fails to guide you through a life of many decisions because the "joint typical branch" becomes vanishingly small.
  *   **Resolution:** Expected Utility handles the composition because it weights every branch by its probability. Kelly handles the composition of *growth rates* because log-wealth is additive. Median maximization handles neither correctly.

  ### Summary
  Reject **Step 4**. It falsely equates the "less probable outcome" of a single trial (which has substantial probability mass) with the "atypical set" of a long sequence (which has vanishing probability mass).

  **The Cost:** You lose the elegance of a single universal decision rule. You must accept that rational decision-making depends on the **structure of the risk**:
  *   **One-off / Additive:** Maximize Expected Utility (linear or concave).
  *   **Repeated / Multiplicative:** Maximize Expected Log Utility (Kelly) to ensure survival and time-average growth.

  This preserves (i) and (ii) as descriptions of dynamics, preserves EU as the normative rule for value, and avoids the absurdities of Step 6.
