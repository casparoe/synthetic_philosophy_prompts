      *   **Vocabulary:** POMDPs, belief states, expected return under posterior, information gain (MI/KL), exploration bonuses, regret bounds, offline policy evaluation, robustness sets.
      *   **Task:** Restate Good's Theorem (Value of Information - VoI) and its apparent failures using *only* the user's vocabulary. No explanations of basic terms.
