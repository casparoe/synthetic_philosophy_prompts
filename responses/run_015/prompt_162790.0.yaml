      *   Ex Post = Realized $V^*(b')$.
      *   Wrinkle 1 = Cost term in reward function, observation as action.
      *   Wrinkle 2 = Non-stationary policy class or causal graph where $O \to \pi \to S$.

  6.  **Developing the Residue Report:**
