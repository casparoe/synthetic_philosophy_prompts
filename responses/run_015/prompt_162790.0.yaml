      *   *Fudged:* "Free" info (mapped to zero-cost observation action). "Message" (mapped to observation emission probability).
      *   *No Counterpart/Residue:*
          *   *Intrinsic Value of Info:* RL/Control is purely instrumental. Info has value only via $\Delta J$. If user cares about "knowing," that's an extra reward term $r(b)$.
          *   *Partitions vs. Messages:* POMDPs use emissions (messages) updating beliefs. Sigma-algebras (partitions) are implicit in the belief support. This is mostly clean, but "coarsening" is harder to represent than "receiving a vector."
          *   *Rationality Assumption:* Good's theorem relies on *optimal* updating and acting. In ML (approximate inference, local minima), VoI can be negative ex ante. This is a "bounded rationality" residue.
          *   *Reflexivity:* Standard POMDPs don't model the policy as part of the environment state. Wrinkle 2 exposes a gap in the standard formalism (needs causal influence diagrams or updateless formalisms).

  7.  **Refining the Tone:**
      *   Direct, technical, no hand-holding.
