      *   Which claim supports this? The Empirical/Sociological one (Claim 1) taken to an extreme. If justice *must* have force to be "powerful," then without force it's "nothing."
      *   Counter-argument: Pascal distinguishes orders. Charity (Christian morality) is non-coercive but valid in its own order. The roommate is conflating the *Political Order* with the *Moral/Religious Order*.

  6.  **Drafting the Response (Iterative Process):**

