prompt: |-
  A general science monthly directed toward educated non specialists publishes several features each year that explain striking biological traits as adaptations for particular functions.

  I serve as features editor with responsibility for vetting freelance pitches for such features. Each month I must assess approximately six pitches. The stakes are recurrent and asymmetric: publication of an unsupported adaptive story misleads readers and damages long term credibility, while excessive caution delays coverage of well supported work and strains relations with writers. Members of the screening staff hold undergraduate level biology and can devote about forty minutes to each pitch. Final authority for acceptance, revision, or rejection rests with me, with consultation of an external academic referee only when the procedure calls for escalation.

  I request a reusable screening procedure, presented as a flowchart in words, grounded in the Gould-Lewontin critique of adaptationism and its call for pluralist explanation. The procedure should translate that critique into sequential tests suitable for use by non specialists, preserving the distinctions among adaptation in the strict sense, exaptation or coopted function, byproduct or spandrel, developmental and architectural constraint, and drift, while indicating which refinements may be set aside for practical use.

  For each step, specify the question to be addressed, the kind of evidence that would count as adequate for a magazine level claim, the conditions that require revision or rejection without further review, and the conditions that require escalation for judgment. Mark explicitly those points where editorial judgment cannot be eliminated and where the procedure is most likely to misfire.

  The procedure must be equipped to handle three recurring hard cases: claims about human cognition or behavior where experimental manipulation is limited, claims about visually compelling animal structures where reader appeal creates pressure to publish, and claims where adaptive and non adaptive factors plausibly interact.

  Demonstrate the procedure by applying it to the following three stylized submissions, taking the stated evidential claims as given without additional fact checking. First, a pitch asserting that throat fan color in a desert lizard evolved to deter a particular avian predator, supported by a within population correlation and a single clay model experiment, without comparative data, heritability estimates, or fitness measures in the wild, and favored by senior staff as a potential cover story. Second, a pitch asserting that rhythmic humming during concentrated individual work evolved to promote social cohesion in ancestral groups, supported by a cross cultural survey and a laboratory study of mood, without developmental, comparative, or fitness evidence. Third, a pitch asserting that reduction of eyes in a cave fish population is best explained largely by neutral accumulation and developmental tradeoffs rather than direct selection for eyelessness, supported by comparative data from neighboring populations, breeding experiments, and quantitative estimates of metabolic cost.

  Include full step by step application in each case, including at least one case where correct application yields a result contrary to editorial or commercial preference. Conclude with a concise statement of what the procedure cannot accomplish.
reasoning: |-
  Here's a thinking process that leads to the suggested screening procedure:

  1.  **Analyze the Request:**

      *   **Role:** Features Editor of a general science monthly.
      *   **Audience:** Educated non-specialists.
      *   **Task:** Create a reusable screening procedure (flowchart in words) for freelance pitches about biological traits as adaptations.
      *   **Constraints:**
          *   Grounded in Gould-Lewontin critique (Spandrels of San Marco).
          *   Pluralist explanation (Adaptation, Exaptation, Byproduct/Spandrel, Constraint, Drift).
          *   Usable by staff with undergrad biology (40 mins/pitch).
          *   Must handle asymmetric stakes (credibility vs. timeliness/relations).
          *   Must specify: Question, Evidence, Rejection Conditions, Escalation Conditions, Editorial Judgment points, Failure points.
          *   Must handle three hard cases: Human cognition/behavior, Visually compelling structures, Mixed factors.
          *   Must demonstrate application on three specific stylized submissions (Lizard, Human Humming, Cave Fish).
          *   One case must show correct application overriding preference.
          *   Conclude with limitations.

  2.  **Deconstruct the Theoretical Basis (Gould-Lewontin):**

      *   *Core Critique:* Adaptationism often assumes every trait is an optimal solution to a specific problem without testing alternatives.
      *   *Alternatives:*
          *   *Exaptation:* Trait evolved for X, now used for Y.
          *   *Byproduct (Spandrel):* Trait is a necessary consequence of another trait's architecture, not selected itself.
          *   *Constraint:* Developmental or physical laws limit variation.
          *   *Drift:* Random changes, especially in small populations.
      *   *Requirement for Adaptation:* Variation, Heritability, Differential Fitness linked to the trait.

  3.  **Drafting the Screening Procedure (The "Flowchart in Words"):**

      *   *Goal:* Make it actionable for undergrads in 40 minutes.
      *   *Structure:* Sequential gates.
      *   *Step 1: The Adaptationist Premise Check.* Does the pitch assume function = origin?
      *   *Step 2: The Alternative Hypothesis Check.* Does the writer acknowledge non-adaptive possibilities?
      *   *Step 3: The Evidence Hierarchy.* What counts as proof? (Comparative > Experimental > Correlational).
      *   *Step 4: The Human/Behavioral Special Case.* Higher bar for Just-So stories.
      *   *Step 5: The Visual/Commercial Pressure Check.* Explicitly flagging "pretty but weak."
      *   *Step 6: The Mixed Model Check.* Acknowledging interaction.
      *   *Decision Nodes:* Accept, Revise (shift framing), Reject, Escalate.

      *Refining for the Prompt:* I need to be specific about "Question," "Evidence," "Rejection," "Escalation," and "Judgment/Failure."

  4.  **Developing the Three Test Cases:**

      *   *Case 1 (Lizard):* Throat fan color vs. predator. Evidence: Correlation + Clay model. Missing: Comparative, Heritability, Fitness. *Pressure:* Senior staff/Cover story. *Verdict:* Weak evidence for strict adaptation. Needs revision to "hypothesis" or rejection if framed as fact.
      *   *Case 2 (Human Humming):* Humming for social cohesion. Evidence: Cross-cultural + Mood lab. Missing: Evolutionary history, Fitness, Developmental. *Risk:* Just-So story. *Verdict:* High risk of adaptationist fallacy. Likely Reject or major Revise to "cultural evolution/psychology" rather than biological adaptation.
      *   *Case 3 (Cave Fish):* Eye reduction via drift/constraint. Evidence: Comparative, Breeding, Metabolic cost. *Verdict:* Strong science, but less "sexy" than "eyes evolved to save energy." *Pressure:* None stated, but usually "selection" sells better than "drift." *Verdict:* Accept/Encourage. This demonstrates the "contrary to commercial preference" if we assume selection stories sell better.

  5.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Set the context (Gould-Lewontin).
      *   **The Procedure (SPANDREL Protocol):** I'll create an acronym or structured list to make it feel like a procedure. Let's use a Gate system.
      *   **Gate 1: The Claim Definition.** Is it claiming *origin* or *current utility*?
      *   **Gate 2: The Alternative Search.** Are constraints/drift mentioned?
      *   **Gate 3: The Evidence Audit.** Comparative phylogeny? Heritability? Fitness?
      *   **Gate 4: The Human/Behavioral Flag.**
      *   **Gate 5: The Visual/Commercial Bias Check.**
      *   **Gate 6: Final Disposition.**

      *Wait, I need to ensure I mark "Editorial Judgment" and "Failure Points" explicitly.* I will add specific callout boxes or bold text for these within the steps.

  6.  **Applying the Procedure to the Cases:**

      *   *Lizard:* Fails Gate 3 (Evidence). High Commercial Pressure (Gate 5). Needs Escalation or Revision. *Decision:* Revise to "Hypothesis" or Escalate for external review because of Cover Story stakes. Let's say Escalate/Revise. To show "contrary to preference," if Senior Staff wants it as fact, we must downgrade confidence.
      *   *Human Humming:* Fails Gate 4 (Human Behavior) and Gate 3 (Fitness). High risk of Just-So. *Decision:* Reject or fundamental pivot.
      *   *Cave Fish:* Passes Gate 2 (Alternatives) and Gate 3 (Evidence). *Decision:* Accept. This counters the "adaptation sells" bias.

  7.  **Refining the "Contrary to Preference" Requirement:**
      The prompt asks for "at least one case where correct application yields a result contrary to editorial or commercial preference."
      *   *Lizard:* Senior staff favor it as a cover story. The evidence is weak. Correct application says "Do not run as fact." This creates tension. I will mark this as the conflict point.
      *   *Cave Fish:* Non-adaptive stories are often harder to sell than "miracle of evolution" stories. Running this counters the "adaptation sells" commercial preference.
      *   *Decision:* I will use the Lizard case to show the conflict with Senior Staff (Editorial Preference) and the Cave Fish to show the conflict with "Adaptation Sells" (Commercial Preference). I'll focus on the Lizard for the explicit "contrary to preference" instruction as it's more dramatic (Cover Story vs. Weak Evidence).

  8.  **Final Review against Constraints:**
      *   Flowchart in words? Yes.
      *   Gould-Lewontin grounded? Yes (focus on alternatives).
      *   Distinctions preserved (Adaptation, Exaptation, Spandrel, Constraint, Drift)? Yes.
      *   Refinements set aside? Yes (e.g., complex population genetics math).
      *   Specific Step details (Question, Evidence, Rejection, Escalation)? Yes.
      *   Judgment/Failure points marked? Yes.
      *   Three Hard Cases handled in procedure design? Yes.
      *   Three Stylized Submissions applied? Yes.
      *   Limitations conclusion? Yes.

  9.  **Writing the Response:** (Self-Correction during drafting)
      *   *Tone:* Professional, procedural, authoritative but humble about limits.
      *   *Formatting:* Use bolding and lists to make the "flowchart" readable.
      *   *Check:* Did I explain *why* the Cave Fish example is good? Yes, it validates non-adaptive explanations.
      *   *Check:* Did I handle the Human Humming case strictly? Yes, this is the classic "Just-So" trap.
      *   *Check:* Ensure the "40 minutes" constraint is respected (procedure can't require reading full phylogenies).

      *(Self-Correction on the Lizard Case)*: The prompt says "favored by senior staff as a potential cover story." If I reject it, that's contrary to preference. If I demand external review, that's escalation. The prompt asks for *my* authority with escalation only when procedure calls for it. If the procedure says "Weak Evidence = Reject/Revise," but Senior Staff says "Publish," that's the conflict. I will structure the decision to require *downgrading the claim* which contradicts the "Cover Story" hype.

      *(Self-Correction on Cave Fish)*: This is the "Non-adaptive" pitch. Usually, magazines prefer "Adaptation." Accepting this contradicts the general commercial preference for adaptationist narratives. I will highlight this.

      *(Refining the Procedure Name)*: Let's call it the "Pluralist Screening Protocol (PSP)."

      *(Refining the Steps)*: Ensure the distinction between *Current Utility* and *Evolutionary Origin* is clear. This is the heart of Gould-Lewontin.

      *(Final Polish)*: Check the word count and ensure all specific constraints (like "Mark explicitly those points where editorial judgment cannot be eliminated") are met. I will use [JUDGMENT CALL] and [FAILURE RISK] tags.

  10. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  # The Pluralist Screening Protocol (PSP)
  **Purpose:** To vet biological feature pitches for scientific rigor regarding evolutionary explanations, grounded in the Gould-Lewontin critique of adaptationism.
  **Users:** Screening staff (Undergraduate biology background).
  **Time Budget:** 40 minutes per pitch.
  **Authority:** Features Editor (Final decision); External Referee (Escalation only).

  ---

  ## Part I: The Screening Procedure (Flowchart in Words)

  ### Gate 1: The Origin vs. Utility Distinction
  *   **Question:** Does the pitch claim the trait *originated* by selection for its current function (Adaptation), or merely that it is currently *useful* (Utility)?
  *   **Adequate Evidence:** Explicit phrasing in the pitch document.
  *   **Revision/Rejection Condition:** If the pitch asserts **Origin** based solely on **Current Utility** without further evidence, mandate revision to "hypothesis" or "current function" framing.
  *   **Escalation Condition:** If the writer insists current utility proves evolutionary origin despite staff feedback.
  *   **[JUDGMENT CALL]:** Determining if the writer implies origin through tone rather than explicit claims.
  *   **[FAILURE RISK]:** Staff may conflate "useful now" with "evolved for this."

  ### Gate 2: The Alternative Hypothesis Audit
  *   **Question:** Does the pitch acknowledge at least one non-adaptive alternative (Byproduct/Spandrel, Constraint, Drift, Exaptation)?
  *   **Adequate Evidence:** Text explicitly mentioning "alternative explanations," "phylogenetic constraint," "developmental trade-off," or "neutral drift."
  *   **Revision/Rejection Condition:** Pitches presenting a single adaptive narrative without acknowledging alternatives must be revised to include a "Competing Hypotheses" section.
  *   **Escalation Condition:** Writer refuses to include alternatives, claiming they are "irrelevant to the story."
  *   **[JUDGMENT CALL]:** Assessing whether the alternative is tokenistic ("Some say drift, but...") or substantive.
  *   **[FAILURE RISK]:** Token alternatives included solely to pass this gate without changing the narrative weight.

  ### Gate 3: The Evidence Hierarchy Check
  *   **Question:** What tier of evidence supports the adaptive claim?
      *   *Tier 1 (Gold):* Comparative phylogenetic data + Heritability + Fitness measures in wild.
      *   *Tier 2 (Silver):* Experimental manipulation (e.g., clay models) + Comparative data.
      *   *Tier 3 (Bronze):* Correlation within population + Plausibility argument.
  *   **Adequate Evidence:** Summary of methods provided in pitch.
  *   **Revision/Rejection Condition:** **Tier 3 evidence cannot support a definitive "Evolved to..." headline.** Must be downgraded to "Scientists investigate..." or "Hypothesis suggests..."
  *   **Escalation Condition:** **Tier 3 evidence proposed for Cover Story or Lead Feature.**
  *   **[JUDGMENT CALL]:** Weighing the quality of the "Silver" evidence (e.g., is the clay model experiment robust?).
  *   **[FAILURE RISK]:** Overvaluing visually compelling Tier 2 evidence (e.g., pretty experiments) over dry Tier 1 data.

  ### Gate 4: The Human/Behavioral Special Filter
  *   **Question:** Is the trait a human cognitive or behavioral pattern?
  *   **Adequate Evidence:** Subject matter identification.
  *   **Revision/Rejection Condition:** If the pitch relies on "Ancestral Environment" speculation without archaeological, genetic, or cross-species comparative data, **Reject** as a biological adaptation story. May be pivoted to cultural evolution or psychology.
  *   **Escalation Condition:** Pitch claims "Universal Human Nature" based on WEIRD (Western, Educated, Industrialized, Rich, Democratic) samples.
  *   **[JUDGMENT CALL]:** Distinguishing between biological predisposition and cultural universal.
  *   **[FAILURE RISK]:** High susceptibility to "Just-So Stories" that reinforce cultural biases.

  ### Gate 5: The Visual/Commercial Pressure Check
  *   **Question:** Is the primary driver for this story the visual appeal of the organism or the simplicity of the narrative?
  *   **Adequate Evidence:** Editor/Staff discussion notes; Pitch emphasis on imagery over mechanism.
  *   **Revision/Rejection Condition:** If visual appeal is high but Evidence is Tier 3, **do not publish as fact.**
  *   **Escalation Condition:** **Senior Staff/Management pressure to publish weak evidence due to commercial potential.** (This triggers the Editor's final authority).
  *   **[JUDGMENT CALL]:** Balancing magazine viability against scientific integrity.
  *   **[FAILURE RISK]:** Commercial pressure overriding Gate 3 constraints.

  ### Gate 6: The Mixed-Model Synthesis
  *   **Question:** Does the pitch allow for interaction (e.g., Drift + Selection; Constraint + Exaptation)?
  *   **Adequate Evidence:** Nuanced language ("partly," "contributing factor," "interplay").
  *   **Revision/Rejection Condition:** Binary framing (Adaptation OR Drift) in complex systems requires revision to reflect probabilistic reality.
  *   **Escalation Condition:** None (Handled by revision).
  *   **[JUDGMENT CALL]:** Ensuring nuance does not render the story unreadable for non-specialists.
  *   **[FAILURE RISK]:** Oversimplification during the editing process reintroducing adaptationist bias.

  ---

  ## Part II: Application to Stylized Submissions

  ### Case 1: The Desert Lizard Throat Fan
  **Pitch:** Throat fan color evolved to deter a particular avian predator.
  **Evidence:** Within-population correlation; single clay model experiment.
  **Missing:** Comparative data, heritability, fitness measures.
  **Context:** Favored by senior staff as a potential cover story.

  **Step-by-Step Application:**
  1.  **Gate 1 (Origin vs. Utility):** Pitch claims "Evolved to deter." This is an origin claim. *Status: Flagged.*
  2.  **Gate 2 (Alternatives):** Pitch does not mention sexual selection, thermoregulation, or phylogenetic constraint. *Status: Fail.*
  3.  **Gate 3 (Evidence):** Correlation + Single Experiment = **Tier 3 (Bronze)**.
      *   *Protocol:* Tier 3 cannot support definitive "Evolved to" headline.
      *   *Protocol:* Tier 3 + Cover Story = **Escalation.**
  4.  **Gate 5 (Pressure):** Senior staff favor this for cover.
      *   *Protocol:* Commercial pressure + Weak Evidence = **Editorial Intervention Required.**

  **Decision:** **Escalate to External Referee / Mandate Revision.**
  *   **Action:** The pitch cannot be published as a Cover Story stating the trait *evolved* for this function. It must be revised to frame the study as a *test of a hypothesis* with acknowledged limitations (no comparative data).
  *   **Conflict:** This contradicts Senior Staff preference for a definitive, visually striking cover narrative.
  *   **Rationale:** Publishing a Tier 3 adaptive story as fact violates the Gould-Lewontin standard. The clay model shows predator reaction, not evolutionary history. Without phylogeny, we do not know if the color preceded the predator pressure.
  *   **Outcome:** Story accepted only if reframed as "The Mystery of the Throat Fan" (investigative) rather than "How the Lizard Got Its Color" (adaptationist fact).

  ### Case 2: The Human Humming Hypothesis
  **Pitch:** Rhythmic humming during work evolved to promote social cohesion in ancestral groups.
  **Evidence:** Cross-cultural survey; laboratory study of mood.
  **Missing:** Developmental, comparative (non-human), or fitness evidence.

  **Step-by-Step Application:**
  1.  **Gate 1 (Origin vs. Utility):** Claims "Evolved to promote." Origin claim. *Status: Flagged.*
  2.  **Gate 4 (Human/Behavioral):** Subject is human behavior/cognition.
      *   *Protocol:* Requires archaeological, genetic, or cross-species data to claim biological adaptation. Survey + Mood Lab is insufficient for evolutionary origin.
      *   *Status: Fail.*
  3.  **Gate 2 (Alternatives):** No mention of cultural transmission, byproduct of vocal cord architecture, or individual stress relief (non-social). *Status: Fail.*

  **Decision:** **Reject as Biological Adaptation Feature.**
  *   **Action:** Reject the evolutionary framing. Offer writer opportunity to pivot to "Psychology of Work" or "Cultural Evolution."
  *   **Rationale:** This is a classic "Just-So Story." Cross-cultural presence does not prove genetic adaptation (could be cultural universal). Mood studies show current utility, not evolutionary origin.
  *   **Hard Case Handling:** This addresses the "Human Cognition" hard case. The bar for biological adaptation in humans is higher due to the confounding variable of culture.
  *   **Outcome:** Pitch rejected in current form. Prevents publication of unsupported evolutionary psychology claims that damage credibility.

  ### Case 3: The Cave Fish Eye Reduction
  **Pitch:** Eye reduction explained by neutral accumulation and developmental tradeoffs rather than direct selection.
  **Evidence:** Comparative data (neighboring populations); breeding experiments; metabolic cost estimates.
  **Context:** Non-adaptive narrative (often less commercially appealing).

  **Step-by-Step Application:**
  1.  **Gate 1 (Origin vs. Utility):** Claims "Explained by neutral accumulation." This is an origin claim, but non-adaptive. *Status: Pass.*
  2.  **Gate 2 (Alternatives):** Explicitly argues *against* direct selection, positing Drift and Constraint. *Status: Pass (High Quality).*
  3.  **Gate 3 (Evidence):** Comparative + Breeding + Metabolic Cost = **Tier 1/Tier 2 Hybrid (Silver/Gold).**
      *   *Protocol:* Strong evidence supports the claim.
      *   *Status: Pass.*
  4.  **Gate 6 (Mixed-Model):** Acknowledges interaction (Metabolic cost [Selection] + Neutral Accumulation [Drift]). *Status: Pass.*

  **Decision:** **Accept.**
  *   **Action:** Commission full article. Highlight the "Anti-Adaptation" angle as a feature, not a bug.
  *   **Conflict:** This contradicts the general commercial preference for "Miracle of Adaptation" stories. Non-adaptive stories are often viewed as "nothing happened" by lay readers.
  *   **Rationale:** The evidence meets the rigorous standard for evolutionary claims. It demonstrates the pluralist approach the magazine advocates.
  *   **Outcome:** Publication of a scientifically robust story that educates readers on Drift and Constraint, fulfilling the magazine's educational mission over pure commercial instinct.

  ---

  ## Part III: Limitations Statement

  **What This Procedure Cannot Accomplish:**

  1.  **Guarantee Truth:** The PSP filters for *plausibility* and *evidentiary standards*, not ultimate biological truth. A study passing Gate 3 may still be retracted later if new data emerges.
  2.  **Eliminate Editorial Bias:** While the procedure flags judgment calls, the Features Editor retains final authority. Commercial pressures (Gate 5) can still override scientific caution if the Editor chooses to risk credibility, though the procedure forces this to be a conscious, documented risk.
  3.  **Resolve Deep Scientific Disputes:** If the external referee and the writer disagree on the interpretation of Tier 1 data, the procedure dictates escalation but cannot resolve the scientific impasse.
  4.  **Compensate for Staff Expertise:** The 40-minute limit and undergraduate level of screening staff mean subtle statistical flaws or phylogenetic errors may pass Gate 3 undetected without external referral.
  5.  **Predict Reader Reception:** A scientifically perfect article (Case 3) may still fail commercially. The procedure protects credibility, not circulation numbers.

  **Final Note:** The PSP is a defensive tool designed to minimize the cost of error (credibility loss) rather than maximize the volume of publication. It prioritizes the distinction between *story* and *science* in evolutionary biology.
