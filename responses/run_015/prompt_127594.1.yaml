answer: |-
  In the chaotic ICU night shift, both Nurse A and Nurse B catch the same lethal dosage error before it hits the patient. Nurse A intervenes with cold precision, correcting the chart simply because protocol demands it, feeling nothing but the weight of professional obligation. Nurse B freezes for a split second recognizing the specific software glitch that nearly killed them five years ago, then acts swiftly to fix it, driven by a visceral mix of relief and a desire to prevent that specific structural horror from happening again. Both patients live, but Nurse A acted from pure duty while Nurse B acted from a personal, biographical recognition of the system's failure.

  So, here's how the different moral lenses break this down. For Kant, it's all about the motive being pure reason, not emotion or self-interest. Nurse A is the hero here because they did the right thing solely because it was the right thing, regardless of how they felt. Nurse B, even though they saved a life, gets almost zero moral credit because their action was tainted by personal history and emotional relief; they didn't do it for the moral law, they did it because the glitch triggered their own trauma. Virtue ethics flips the script completely. It cares about character and flourishing, so it ranks B higher because their reaction shows a deep, practical wisdom—they're attuned to the reality of the system in a way A isn't. A is just a rule-following robot, while B embodies the virtue of care because their feelings are aligned with the good outcome. Consequentialism looks at the results and says the immediate outcome is a tie since both patients lived, but it gives the edge to B for long-term reliability. Because B understands the structural danger personally, they're less likely to zone out or miss similar errors in the future, making them a safer bet over a whole career.

  The feature doing all the heavy lifting here is that bit of biographical structural recognition—B's specific past trauma with the same system failure. If you remove that and just make B someone who cares generally about patients, Kant still knocks them down for acting on emotion rather than duty, but Virtue Ethics might rate them slightly lower because generic empathy isn't as sharp as lived wisdom. Consequentialism would worry that without that specific scar tissue, B might not be as vigilant next time. A Kant defender would attack B's reason by saying it fails the test of universalizability. They'd argue that if everyone acted only when a specific error reminded them of their own past suffering, morality would be spotty and unreliable; you can't build a universal moral law on "I help because this reminds me of me," whereas "I help because it is my duty" works for everyone, everywhere, regardless of their backstory.
