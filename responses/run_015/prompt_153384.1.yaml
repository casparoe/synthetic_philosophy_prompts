answer: |-
  Alright, let's settle the beer bet. The problem with this debate is that everyone uses "neutrality" to mean "not currently shooting anyone," but in defense theory, it's a specific legal and operational status. If your theory of armed neutrality can't distinguish between a hermit kingdom, a NATO partner, and a genuine neutral, it's useless.

  Here are the desiderata a theory of armed neutrality needs to meet to be taken seriously. I've flagged what's hard logic (Non-Negotiable) and what's just doctrinal flavor (Camp Preference).

  ### The Desiderata List

  **1. Credible Unilateral Denial Capability**
  *   **The Spec:** The state must possess the organic firepower to raise the cost of invasion above the aggressor's expected gain *without* waiting for allied reinforcement.
  *   **Motivation:** If you need a rescue, you aren't neutral; you're a protectorate waiting to happen. This explains why micro-states with token armies don't count.
  *   **Status:** **Non-Negotiable.**
  *   **Case Fit:** Explains **Switzerland's** heavy fortification and air force independence. Explains why **Sweden** kept a strong air force during neutrality but eventually realized it wasn't enough against modern Russia.

  **2. Strategic Autonomy in Decision-Making**
  *   **The Spec:** The political decision to mobilize and fire must be sovereign, not subject to veto or consultation with a bloc.
  *   **Motivation:** Neutrality is a policy choice, not a default setting. If NATO commands your deployment, you are a member, not a neutral.
  *   **Status:** **Non-Negotiable.**
  *   **Case Fit:** This is the breaker for **Sweden** and **Finland**. Joining NATO surrendered this autonomy for collective security. The theory must acknowledge this as the *end* of their armed neutrality, not an evolution of it.

  **3. Legal Consistency (Hague V Compliance)**
  *   **The Spec:** The posture must align with international laws of neutrality (e.g., Hague Conventions). You cannot grant belligerents transit rights, intel, or logistics while claiming neutrality.
  *   **Motivation:** If you let US spy planes use your airspace but ban Russian ones, you are a co-belligerent, not neutral.
  *   **Status:** **Non-Negotiable.**
  *   **Case Fit:** **Finland** never claimed legal neutrality during the Cold War (it was "military non-alignment" to avoid Soviet ire), so the theory shouldn't count them as a historical success case of *neutrality*, only of *territorial defense*.

  **4. Mobilization Sovereignty (The Supply Chain Constraint)**
  *   **The Spec:** The state must be able to mobilize its reservists and critical infrastructure without foreign corporate or state veto.
  *   **Motivation:** This is your civilian-infrastructure overlap problem. If your reservists work for Amazon Web Services, Maersk, or a foreign-owned power grid, and those entities cut access during a crisis, your mobilization fails. If you rely on foreign tech to coordinate the militia, you aren't sovereign.
  *   **Status:** **Non-Negotiable.** (This is the modern killer).
  *   **Case Fit:** **Switzerland** tries to handle this with stockpiling and domestic banking, but even they struggle with dual-use tech sanctions. **Sweden** failed this test; their defense industry became too integrated with global supply chains to sustain autonomy.

  **5. Force Structure Alignment (Total Defense vs. Expeditionary)**
  *   **The Spec:** The military structure must prioritize territorial denial over power projection. Conscription is permissible but must be linked to territorial defense, not generating deployable brigades for foreign wars.
  *   **Motivation:** If your conscripts are training to invade someone else, you aren't neutral.
  *   **Status:** **Camp Preference.** (You can theoretically have a professional neutral army, but conscription fits the "nation-in-arms" deterrence model better).
  *   **Case Fit:** Explains **Switzerland's** militia system (everyone has a rifle at home) vs. **Sweden's** 2010 conscription revival (which was too little, too late to save neutrality).

  **6. Alliance Interoperability Limit**
  *   **The Spec:** The theory must define a "red line" for cooperation. Sharing intel or standardizing ammo calibers is okay; integrating command structures is not.
  *   **Motivation:** You need to distinguish between "partnering" and "joining."
  *   **Status:** **Camp Preference.** (Hawks say any coop ruins neutrality; Doves say you need friends).
  *   **Case Fit:** This is where **Sweden** broke. They interoperated so deeply with NATO that neutrality became a branding shell with no operational meat.

  ---

  ### The Tensions & Trade-Offs

  **Jointly Unsatisfiable Subset:**
  You cannot satisfy **Desideratum 2 (Strategic Autonomy)** and **Desideratum 6 (Deep Alliance Interoperability)** simultaneously.
  If you integrate your command and control with NATO to ensure you can fight effectively alongside them, you lose the autonomy to say "no" to them. If you maintain autonomy, you will always be slightly incompatible with alliance tech/protocols, reducing your effectiveness in a coalition. You have to pick one. Sweden picked the latter.

  **The Killer Requirement:**
  **Desideratum 4 (Mobilization Sovereignty / Supply Chain Constraint).**
  This knocks out almost every modern theory of armed neutrality. In a globalized economy, no small state owns its entire tech stack, energy grid, or logistics network. If your neutral state relies on US GPS, Chinese manufacturing, or EU energy, you cannot guarantee you can fight a prolonged war without external permission. This makes "Armed Neutrality" a luxury good that only works if you are geographically isolated or economically self-sufficient (which no one really is anymore).

  ---

  ### The Scorecard

  Here is how the three cases stack up against the "Real Armed Neutrality" spec.

  **Switzerland**
  *   **Score:** **8/10 (The Only Remaining Valid Case)**
  *   **Why:** They hit the Non-Negotiables. They have the guns (Denial), the legal status (Hague), and the political will (Autonomy). They lose points on Mobilization Sovereignty because even they rely on foreign tech and EU trade, but they mitigate it better than anyone with stockpiles and bunkers.
  *   **Verdict:** Coherent concept, but increasingly expensive to maintain.

  **Sweden (Pre-2022)**
  *   **Score:** **4/10 (Zombie Neutrality)**
  *   **Why:** They kept the branding but gutted the specs. They cut conscription (2010), shrank the army, and integrated deeply with NATO intel. They failed Desideratum 1 (Denial) and edged too close to violating Desideratum 6 (Interoperability Limit).
  *   **Verdict:** Your friend is right; Sweden's neutrality was nostalgia by the end. Joining NATO was an admission that the spec was unsatisfiable in the modern security environment.

  **Finland (Pre-2022)**
  *   **Score:** **2/10 (False Positive)**
  *   **Why:** Finland never claimed legal neutrality (Desideratum 3). They had "military non-alignment" under the shadow of the USSR. They had great Territorial Defense (Desideratum 1 & 5), but they lacked the Legal Consistency to count as a neutral state in the eyes of international law.
  *   **Verdict:** Finland proves you can have "Armed Non-Alignment" without "Neutrality." Now that they are NATO, they are a perfect example of Desideratum 2 (Autonomy) being traded for security guarantees.

  ### Bottom Line for the Bet
  Your friend wins on the empirical trend (Sweden/Finland dropped it), but you win on the theoretical coherence (Switzerland proves it's still *possible*, just hard).

  The theory holds up, but the **Mobilization Sovereignty** constraint means armed neutrality is no longer a "freeload" option. It requires *more* spending and *more* self-sufficiency than alliance membership, not less. If a state wants to be neutral now, they can't freeload; they have to build everything themselves. That's why most dropped it—it's too expensive to be truly neutral.
