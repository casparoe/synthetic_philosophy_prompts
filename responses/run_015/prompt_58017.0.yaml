  **HISTORIC HOLDINGS FESTIVAL 2024: ATTENDEE ENTITLEMENT FAQ**

  **Q: At gate entry, everyone received 500 drink tickets. Why does Jaxson Vree currently hold 12,000 tickets while I hold zero?**

  A: Because you gave them to him. The initial distribution (D1) was equal and just. However, during Vree's 45-minute polymetric solo, you voluntarily transferred your holdings to him in exchange for aesthetic enjoyment. Justice in holdings is not determined by the resulting pattern (who has what now), but by the history of how it came about. Since the transfer was voluntary and D1 was just, the resulting distribution (D2) is necessarily just. We do not judge outcomes; we judge processes.

  **Q: Can security confiscate Vree's excess tickets nightly to restore equality?**

  A: No. To redistribute holdings solely to maintain an equal pattern is to violate the liberty of the transferrers. Liberty upsets patterns. If we intervene to stop you from giving tickets to Vree, or to take them from him afterward, we are treating you as partial owners of each other. We are not in the business of end-state redistribution. We are historians of acquisition. If you wish to maintain equality, you must refrain from exercising your liberty to tip. Please stop tipping if you prefer equality over autonomy.

  **Q: But isn't this inequality unfair?**

  A: "Fairness" implies a specific distributive pattern. We operate on entitlement theory. If you acquired your tickets justly (gate entry) and transferred them justly (voluntary tip), the result is fair by definition. It does not matter that Vree now controls the majority of the festival's liquidity. It matters that no force was used. If you are unhappy with the distribution, you should have valued your beer more than Vree's snare work.

  **Q: What about Gary from Logistics who stole 200 tickets in 2022?**

  A: This invokes the Principle of Rectification. If past holdings were unjustly acquired, current entitlements are potentially tainted. We cannot simply ignore historical theft. However, calculating rectification is complex. We must determine what would have happened had the injustice not occurred. Would Gary have spent the tickets? Would they have circulated? We are currently running counterfactual simulations to determine the exact debt owed to the 2022 attendee body. Until this historical injustice is rectified, no distribution can be declared fully just. Please wait.

  **Q: This seems administratively exhausting.**

  A: It is. Maintaining a patterned distribution requires constant interference with voluntary acts. Respecting entitlements requires only that we verify the history of transfer. However, verifying the history of every ticket while simultaneously calculating rectification for past thefts has resulted in significant staff burnout. We are considering switching to a pure libertarian model where we stop checking tickets entirely, but then we cannot guarantee rectification for Gary's theft.

  **Q: So what do we do?**

  A: You hold what you hold, provided you acquired it justly. If you have no tickets, you drank them or tipped them. If you want more, you must provide a service others voluntarily value. Or wait for us to finish the rectification calculus. Do not ask us to redistribute. We are not patterned. We are tired.

  **Q: Can I tip Vree to give them back?**

  A: Yes. That is voluntary.

  *Festival Management reserves the right to revise entitlement protocols based on new discoveries regarding past injustices.*
