prompt: |-
  You are delivering the opening remarks at a two-day workshop, "History as Method?", convened jointly by a university history department and a government school of international affairs. The audience is divided evenly: on one side sit academic historians and international-relations theorists who know the literature on Munich, Vietnam, and the Thucydides trap in detail; on the other sit practising diplomats and defence analysts who have heard these analogies invoked in briefing rooms but have little patience for abstract theory. The stated theme is whether historical comparison can legitimately guide present policy. You hold that it usually misleads, but you want the room to treat the failure as a serious conceptual problem rather than dismissing analogies as mere laziness.

  Write the remarks — about six to eight minutes when spoken — so that the philosophical argument does real structural work. Explain why analogical reasoning from Munich, Vietnam, and the Thucydides trap fails not simply because the surface details differ, but because it commits a specific conceptual error: it conflates narrative resemblance between episodes with mechanistic homology across institutional regimes that operate under different causal logics. Use this diagnosis to reshape what the workshop can legitimately aim for: not "which past is this like?", but "which causal mechanisms are actually active here, and under what modal conditions do they remain stable across regimes?". You must land the point for the specialists without losing the practitioners, and you should avoid generic platitudes about those who forget history.

  To keep the speech from being something that could be reconstructed from standard summaries, inject one niche but defensible conceptual distinction of your own framing — for example, a distinction between "surface isomorphism" and "mechanistic portability" in analogical transfer — and build part of the argument around it.

  Please write in British English. After the speech, provide a brief reflexive note stating how confident you are in the conceptual claims you have advanced, and explicitly identify the single point about which you are least sure — particularly regarding how well your injected distinction travels across different types of institutional regime.
