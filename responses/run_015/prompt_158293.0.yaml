answer: |-
  **Opening Remarks: History as Method?**

  Good morning. It is a genuine privilege to welcome you to this joint workshop. Looking around the room, I see a divide that is often described as a gap, but which I prefer to think of as a necessary tension. On my left, colleagues from the History Department and IR Theory, for whom the past is a complex archive requiring careful excavation. On my right, practitioners from the Foreign Office and the Ministry of Defence, for whom the past is a briefing pack, often reduced to a single slide before a decision must be taken.

  We are here to ask whether historical comparison can legitimately guide present policy. The conventional wisdom suggests a binary: either history is a vital guide, or it is a irrelevant distraction. I want to propose a third position. I argue that historical analogy usually misleads us, but not because policymakers are lazy, nor because historians are pedantic. It misleads because it commits a specific conceptual error. We tend to conflate *narrative resemblance* between episodes with *mechanistic homology* across institutional regimes that operate under fundamentally different causal logics.

  We all know the shorthand. When Russia moves on Ukraine, the room whispers 'Munich'. When intervention stalls in the Middle East, the ghost of Vietnam walks the corridor. When China builds its navy, we are told we are walking into the Thucydides Trap. These analogies are potent. They provide immediate moral clarity and a sense of precedent. But they are dangerous precisely because they feel true.

  The error lies in assuming that because two events look alike in story form, they function alike in systemic form. To diagnose this, I want to introduce a distinction that I hope will structure our discussions over the next two days: the difference between **Surface Isomorphism** and **Mechanistic Portability**.

  Surface Isomorphism is what we usually rely on. It is the resemblance in shape, sequence, or archetype. In 1938, a continental power demands territory from a smaller neighbour; appeasement is tried; war follows. In 2022, a continental power demands territory; appeasement is tried; war follows. The surface isomorphism is striking. The narrative arc is identical. It is tempting to conclude that the lesson of Munich is universal.

  However, Mechanistic Portability asks a harder question: do the causal engines driving these events actually transfer across the intervening decades? Does the mechanism of 'appeasement leading to war' port from the institutional regime of 1938 to the institutional regime of 2022?

  In 1938, the causal logic was driven by conventional mobilisation timelines and fragile alliance commitments. In 2022, the logic is mediated by nuclear deterrence, globalised supply chains, and digital information warfare. The surface looks the same; the machinery is different. When we treat Surface Isomorphism as proof of Mechanistic Portability, we are not just simplifying history; we are misidentifying the physics of the present. We are assuming that because the scenery looks the same, the laws of gravity have not changed.

  This is not merely an academic quibble. For the practitioners here, the risk is policy failure based on false positives. For the historians, the risk is irrelevance, where our nuance is discarded because it offers no actionable traction.

  Therefore, I propose we reshape the aim of this workshop. We must stop asking the question: "Which past is this like?" That question invites Surface Isomorphism. It invites us to hunt for matches that confirm our biases.

  Instead, we must ask: "Which causal mechanisms are actually active here, and under what modal conditions do they remain stable across regimes?"

  This shifts the burden. It requires us to identify the mechanism—for example, 'security dilemmas' or 'escalation ladders'—and then rigorously test whether that mechanism survives the transition from one institutional context to another. Does the security dilemma operate the same way in a bipolar nuclear world as it did in a multipolar conventional one? Under what modal conditions—what specific constraints—does it remain stable?

  If we cannot establish Mechanistic Portability, the analogy must be discarded, regardless of how compelling the narrative resemblance. This is hard work. It requires historians to articulate causality without retreating into pure contingency, and it requires policymakers to tolerate uncertainty rather than reaching for the comfort of a historical label.

  Over the next two days, I invite you to be ruthless with your analogies. Do not dismiss them as mere laziness; treat them as hypotheses about causal mechanisms. Test them against the institutional regimes they are meant to traverse. If the mechanism does not port, the analogy is broken.

  We are not here to learn lessons from history. We are here to learn how to diagnose the present without being haunted by the past. Let us begin.

  ***

  **Reflexive Note**

  I am moderately confident in the core diagnostic claim: that policy failures often stem from conflating narrative shape with causal structure. This aligns with existing critiques in political science regarding 'lessons of history' (e.g., Neustadt and May), though I have attempted to sharpen the ontological distinction.

  However, the point about which I am least sure concerns the utility of the injected distinction—**Surface Isomorphism vs. Mechanistic Portability**—when travelling across different types of institutional regime. Specifically, I am uncertain whether 'Mechanistic Portability' is a standard robust enough for practitioners to apply in real-time. While historians can retrospectively identify causal mechanisms with some precision, diplomats operating under time pressure may find 'modal conditions' too abstract to operationalise. There is a risk that this distinction, while philosophically sound, creates a new barrier to entry for the very practitioners it aims to assist, potentially relegating 'mechanism' to yet another piece of jargon rather than a usable tool. I am confident the critique holds, but less confident that this specific framing offers a practical bridge for the policy side of the room.
