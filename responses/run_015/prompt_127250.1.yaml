answer: |-
  1. A non-negotiable requirement is that the framework must treat archival silence not merely as a gap to be filled but as structural evidence of exclusion, as seen when peasant revolts appear only through hostile court records that criminalize their motives.
  2. It is non-negotiable that the framework distinguishes collective agency from the mere aggregation of individual actions without anachronistically importing modern categories of citizenship or class, such as interpreting crowd behavior during food riots as coordinated political strategy rather than spontaneous hunger.
  3. A negotiable requirement is that the recovery of a single subaltern life must not be treated as representative of an entire social formation, avoiding the error of assuming one recovered biography encapsulates the universal experience of slavery or servitude.
  4. It is non-negotiable that the framework explains how local interactions scale up to institutional history without resorting to macro-structural determinism, such as demonstrating how village-level tax evasion cumulatively alters state fiscal capacity rather than merely reflecting top-down policy failure.
  5. The desiderata of fully recovering subaltern subjectivity and maintaining strict empirical fidelity to state archives are jointly unsatisfiable, since microhistorical close-reading often fails the requirement to treat silence as structural evidence by over-interpreting fragments, while top-down state-archive approaches fail the requirement to distinguish collective agency by reducing individuals to administrative categories.
