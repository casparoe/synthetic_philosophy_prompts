      *   *Philosophical Concept:* The distinction between *constraints* and *goals*. Or the distinction between *feasibility* and *permissibility*.
      *   *Specific Step:* Step (4). It commits a modal fallacy or conflates "can" (physical ability) with "can" (normative availability). It ignores the distinction between *sustainable capacity* and *maximum extraction*.

