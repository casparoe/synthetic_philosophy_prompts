      *   (2) **The Endogeneity Premise:** Ceilings aren't fixed. They depend on behavior, management, history (path-dependence). Ecological carrying capacity is dynamic.
      *   (3) **The Inheritance Conclusion:** The ceiling is a product of past choices. It's inherited, not exogenous.
      *   (4) **The Responsibility Principle:** You can't use a limit you created (and can relax) as an excuse not to aid. "Ought implies can" blocks self-imposed "cannots."
      *   (5) **The Application:** Hardin's argument fails because political/economic ceilings are endogenous.
      *   (6) **The Contradiction:** (4) says you must aid because you can raise the ceiling (even by consuming capital). (1) says you must *not* consume capital (or you sink). If (4) allows consuming capital to aid, it violates (1). If (4) forbids consuming capital to aid, it loses its bite against Hardin.

  3.  **Diagnose the Problem:**
      *   The core tension is between *capacity* and *obligation*.
      *   Step (4) is the likely culprit. It conflates *physical possibility* with *normative permissibility*.
      *   Just because I *can* burn the lifeboat to keep someone warm for an hour doesn't mean I *ought* to, nor does it mean I can't cite the lifeboat's integrity as a constraint.
      *   The phrase "Ought-implies-can" is being misapplied. It usually means if you ought to do X, you must be able to do X. It doesn't mean if you *can* do X (even destructively), you *ought* to do X, or that you can't cite future inability as a constraint.
