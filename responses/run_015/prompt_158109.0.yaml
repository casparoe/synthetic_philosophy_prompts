      *   Let's focus on the "Ought implies Can" misuse. The principle limits obligation by ability. It does not expand obligation to the limit of physical ability regardless of consequences.
      *   Actually, the strongest critique is that (4) ignores the *temporal* dimension. "Can" now vs "Can" later.
      *   Let's name the step: **The Normative Voiding of Endogenous Constraints.**
