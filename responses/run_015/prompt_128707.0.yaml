      Method 2 (1/2): Choose radius randomly, choose point on radius randomly. Chord perpendicular to radius.
      Method 3 (1/4): Choose point inside circle randomly. That is the midpoint.
      Physical implementation:
      1: Spinners for angles.
      2: Spinner for angle, ruler/bead for distance along radius.
      3: Drop bean onto circle area.
