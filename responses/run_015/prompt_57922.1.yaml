answer: |-
  Right, let's have a proper look at this. You're right to trust your intuition on that swimming business; something does smell a bit fishy there. This is a classic debate, and revision blogs often simplify things to the point where they actually mislead you.

  Here is a breakdown of what the blog gets spot on, where it leads you astray, and how your Gran and TikTok example fits into the whole mess.

  ### 1. The Blog's Report Card

  **What it gets right:**
  *   **The Basic Definitions:** It's correct that **Knowing That** is propositional knowledge (facts, truths you can state, like "London is the capital of the UK"). It's also correct that **Knowing How** is traditionally linked to abilities or skills (riding a bike, cooking Jollof).
  *   **Ryle's Position:** Gilbert Ryle, in his book *The Concept of Mind* (1949), did argue against what he called the "intellectualist legend." He thought Knowing How was distinct from Knowing That. In fact, he argued Knowing How is more fundamental. You can't follow a rule (Knowing That) unless you already know how to interpret it (Knowing How). So, saying Ryle thought they were separate is accurate.

  **Where it messes up (and why your intuition is right):**
  *   **The "Swimming Manual" Claim:** This is the big error. The blog suggests that if you are an Intellectualist, you must believe you can learn to swim just by reading a book, without ever getting wet.
  *   **Why this is wrong:** Contemporary Intellectualists (like Jason Stanley and Timothy Williamson) argue that Knowing How is a *species* of Knowing That. However, they **do not** claim that knowledge alone guarantees ability. You might possess all the correct propositions about swimming (the physics, the strokes, the breathing), but if you have no muscle coordination or are paralysed, you physically cannot swim.
  *   **The Distinction:** The blog conflates *knowledge* with *ability*. Intellectualists say you can have the knowledge without the ability. The blog implies Intellectualists think knowledge *creates* the ability magically. That's a straw man argument designed to make Intellectualism look silly.

  ### 2. The Gran vs. TikTok Breakdown

  Let's apply the two views to your example.
  *   **Gran:** Cooks perfect Jollof every time. Cannot explain the recipe or measurements (no propositions).
  *   **You (TikTok):** Can recite the recipe perfectly from memory (lots of propositions). Burn the rice every time (failure in execution).

  #### On Ryle's View (Anti-Intellectualism)
  Ryle would say **Gran knows how**, and **you do not**.
  *   **Why?** For Ryle, Knowing How is a *disposition*. It's about the capacity to succeed when you try. Gran has the skill; she manifests the knowledge through action.
  *   **Your position:** You merely have "theoretical knowledge." You are like a person who can recite the rules of chess but gets checkmated in three moves. Ryle would say you don't actually know how to play chess; you just know facts *about* it.
  *   **Verdict:** Gran is the knower. You are just a parrot.

  #### On the Blog's Version of Intellectualism
  The blog would say **you know how**, and **Gran might not** (or at least, her knowledge is inferior).
  *   **Why?** Because the blog claims Knowing How is just Knowing That (facts about methods). You have the facts (the recipe); Gran does not (she can't state them).
  *   **Verdict:** You are the knower. Gran is just acting on instinct.
  *   **Critique:** This is why the blog is dangerous. It makes Intellectualism look absurd. Surely Gran knows how to cook better than you do?

  #### On *Actual* Contemporary Intellectualism (Stanley & Williamson)
  This is where you can get extra marks in your essay by showing you know more than the blog.
  *   **The View:** They argue Knowing How is Knowing That, *but* the knowledge must be held under a **"practical mode of presentation."**
  *   **Gran:** She definitely knows how. Even if she can't speak the propositions, her mind grasps the way to cook Jollof under a practical mode. She possesses the knowledge.
  *   **You:** You might know the propositions ("add two cups of water"), but you don't grasp them under a *practical* mode. You grasp them under a *theoretical* mode (like a trivia quiz). Therefore, strictly speaking, **you do not know how** either.
  *   **Verdict:** Gran knows how. You don't. (This aligns with common sense, saving Intellectualism from the blog's silly "swimming manual" conclusion).

  ### 3. So, why does the "Swimming Manual" bit sound off?

  You spotted the flaw because the blog ignores the difference between **competence** and **performance**.

  Imagine a world-class gymnast who breaks both legs.
  *   **Do they still know how to do a backflip?** Yes. They have the knowledge.
  *   **Can they do a backflip?** No. They lack the physical ability.

  The blog claims Intellectualists think reading the manual gives you the *ability*. Real Intellectualists argue reading the manual gives you the *knowledge*. Whether your body can execute it is a separate issue.

  Furthermore, as mentioned above, simply reading the manual might not even give you the knowledge under the right "practical mode." You might know *that* you need to kick your legs, but not know *how* to apply that knowledge in the water.

  ### Summary for your Revision

  1.  **Ryle:** Knowing How $\neq$ Knowing That. Knowing How is an ability/disposition. **Gran knows how; You don't.**
  2.  **Blog's Intellectualism:** Knowing How $=$ Knowing That (facts). **You know how; Gran doesn't.** (Note: This is a crude version).
  3.  **Real Intellectualism:** Knowing How $=$ Knowing That (under a practical mode). **Gran knows how; You probably don't.**
  4.  **The Blog's Error:** It suggests Intellectualists think knowledge equals physical ability (the swimming manual claim). This is false. You can have the knowledge but lack the physical capacity to use it.

  **Top Tip for the Exam:**
  Use your Gran example to critique the blog. Say something like: *"While the revision blog suggests Intellectualism implies one can swim via manual alone, this conflates knowledge with ability. As the case of my Gran demonstrates, one can possess the skill (Knowing How) without the propositions, whereas I possess the propositions without the skill. A sophisticated Intellectualist would argue I lack the 'practical mode of presentation', thus preserving the intuition that Gran is the true knower."*

  That should get you a solid 2:1 or First on that question. Good luck with the term!
