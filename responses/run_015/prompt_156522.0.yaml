  Let's refine the "Counterfactual Stability Index" critique. If a system is stable but oppressive, is it progress? Side A links stability to "resistance to reversal" in the context of "responsiveness to anomaly." So they link stability to *epistemic robustness*. Side B says the *actors* didn't care about that. So it's *Ex Post* vs. *Ex Ante*.

