answer: |-
  ### Candidate Designs

  1.  **The Lecture-First Verification:** Begin with a 20-minute formal proof of the Strategy-Stealing Argument (SSA), then assign games to verify the premises.
      *   *Rejection:* This tells them the answer before they feel the problem; it turns the games into mere checkbox exercises rather than sites of discovery.
  2.  **The Hex-Only Tournament:** Run a full round-robin of 5×5 Hex, then ask students to generalize why Player 1 always seems to win.
      *   *Rejection:* Without a counter-example (like Sim) or a draw-possible game (like Tic-Tac-Toe), students cannot isolate which premises (no draws, monotonicity) are actually doing the work.
  3.  **The Contrasting Rotations (Recommended):** Four distinct rule-sets played in sequence, forcing students to update their mental model of "advantage" at every turn, capped by a physical enactment of the stealing paradox.
      *   *Selection:* This design forces the cognitive dissonance required to distinguish your view from your friend's; the shifting rules prevent premature closure.

  ---

  ### Recommended Session Design: "The Thief's Paradox"

  **Course:** Proof, Existence, and Computation (Upper-Level Seminar)
  **Time:** 90 Minutes
  **Participants:** 16 (4 Tables of 4)
  **Materials:**
  *   4 Printed 5×5 Hex boards (laminated or heavy stock).
  *   4 Printed Complete Graphs ($K_6$, 6 dots, all 15 edges visible).
  *   4 Printed 3×3 Grids (Tic-Tac-Toe).
  *   Red and Blue dry-erase markers (or distinct pens).
  *   "Prediction Ledger" sheets (one per student).
  *   "Ghost Move" Worksheet (one per pair).

  **Scoring:** **Prediction Ledger.** Before each round, students mark P1 Win, P2 Win, or Draw.
  *   +1 point for correct outcome.
  *   +1 bonus point if they correctly identify *why* in the debrief (self-graded).
  *   Winner gets "Bragging Rights" (no money).

  ---

  ### Timeline & Flow

  #### 0:00 – 0:05 | Setup & Grouping
  Divide into 4 tables of 4. At each table, split into 2 pairs. Distribute Prediction Ledgers.
  **Instruction:** "You will play four games. Before each game, record your prediction: Player 1 Win, Player 2 Win, or Draw. Do not discuss strategy aloud until the end. Play fast."

  #### 0:05 – 0:15 | Round 1: The Drawn Race (Tic-Tac-Toe)
  *   **Rules:** Standard Tic-Tac-Toe. Best of 3 games per pair (swap P1/P2).
  *   **Philosophical Trap:** Extra move is harmless, roles are symmetric, *but* draws are possible.
  *   **Expected Outcome:** Mostly draws.
  *   **SSA Status:** Proves P1 cannot *lose*, not that P1 *wins*.
  *   **Student Prediction Error:** Many will predict P1 Win due to "first move advantage."

  #### 0:15 – 0:35 | Round 2: The Determined Race (5×5 Hex)
  *   **Rules:** 5×5 Hex. No swap rule. P1 (Red) connects top-bottom; P2 (Blue) connects left-right.
  *   **Philosophical Trap:** Extra move harmless, roles symmetric, *no draws* (topologically guaranteed, though students may not know this yet).
  *   **Expected Outcome:** P1 wins most games (if played competently).
  *   **SSA Status:** Applies fully. P1 has a winning strategy.
  *   **Student Prediction Error:** P2 players will feel they have chances; P1 players will feel pressure.

  #### 0:35 – 0:45 | The Physical Drill: "The Ghost Move"
  *   **Activity:** Pairs stay at Hex boards. Hand out "Ghost Move" Worksheet.
  *   **Task:**
      1.  P1 places a stone in the center (the "Dummy").
      2.  P2 must now pretend to be P1 using P1's "Winning Strategy." P2 places a stone where the strategy dictates.
      3.  P1 now plays the role of the "Thief." P1 looks at P2's move. If P2's move is on an empty spot, P1 takes it.
      4.  **The Conflict:** What if P1's "Winning Strategy" (which P2 is using) calls for the spot where P1's Dummy stone already sits?
      5.  **Action:** Students must physically try to resolve this. They will find they must play a *new* Dummy elsewhere.
  *   **Goal:** Feel the contradiction. If the strategy says "Play where the Dummy is," you can't. You must play a new Dummy. But then you have *two* stones extra. The logic loops.
  *   **Instructor Note:** Do not explain the resolution. Let them hit the wall. "Does the thief have a valid move here? Show me."

  #### 0:45 – 1:05 | Round 3: The Poisoned Race (Sim / $K_6$)
  *   **Rules:** Complete graph on 6 points. Players claim edges in their color. **Lose** if you complete a monochromatic triangle (3 edges of your color).
  *   **Philosophical Trap:** No draws (Ramsey Theory: $R(3,3)=6$), roles symmetric, *but extra move is a liability* (monotonicity fails).
  *   **Expected Outcome:** P2 wins (P2 has a known winning strategy in Sim).
  *   **SSA Status:** Fails. Having more edges on the board brings you closer to losing.
  *   **Student Prediction Error:** High. Students assume "First Move = Advantage" universally. They will predict P1 Win.

  #### 1:05 – 1:20 | Round 4: The Handicap Variants (Hex Modified)
  *   **Variant A (7 mins):** Hex 5×5. P2 has a "Bolt." Once per game, on their turn, P2 may place **two** stones instead of one. P1 has no Bolt.
      *   *Analysis:* Symmetry broken. P2 has material advantage. SSA for P1 fails. P2 should win.
      *   *Predictable Error:* Students think P1 still wins because "SSA says P1 wins Hex." They miss that SSA requires symmetric move options.
  *   **Variant B (8 mins):** Hex 5×5. **Both** players have a "Bolt" (one-time double stone).
      *   *Analysis:* Symmetry restored. Extra stone still helps. SSA for P1 applies. P1 should win.
      *   *Predictable Error:* Students think the game is now "balanced" (Draw) or P2 still wins because they focus on the Bolt as a counter-measure rather than a symmetric resource.

  #### 1:20 – 1:30 | Debrief & Closing
  *   **Mapping Premises:**
      *   R1 (TTT): Shows we need **No Draws** to prove a Win (SSA only proved "Not Lose").
      *   R2 (Hex): Shows we need **Monotonicity** (extra stone helps).
      *   R3 (Sim): Shows **Anti-Monotonicity** kills the argument (extra edge hurts).
      *   R4 (Handicap): Shows we need **Symmetry** (same move set).
  *   **The Non-Constructive Gap:** Ask Round 2 winners: "Did the SSA tell you *where* to move?" (No). It guarantees existence, not computation.
  *   **Predictable Pitfalls:**
      *   *Skill vs. Strategy:* Strong players winning Round 3 (Sim) as P1 will convince weak players SSA works there. Remind them: P2 *can* win Sim with perfect play.
      *   *Small Sample:* 3 games isn't proof. The math is in the constraints, not the scoreboard.
      *   *Generality:* Acknowledge you didn't prove Hex has no draws today (that's topology); you assumed it to test the SSA logic.
  *   **Closing Move (The Friend's Claim):**
      "Your friend argued that a Follower can steal a Leader's strategy plus one extra move. But in a race, the Leader is *ahead*. The board state is not symmetric. The path the Leader took might be blocked for the Follower. The Strategy-Stealing Argument only works in a mirror world where the only difference is one extra stone, and where that stone can never be a burden. In the real world, following the leader often means running into their dust, not riding their wake."

  ---

  ### Detailed Round Specifications & Instructor Notes

  #### Round 1: Tic-Tac-Toe
  *   **Print:** Standard 3×3 grids.
  *   **Prompt:** "Play 3 games. Swap colors. Record outcomes."
  *   **Instructor Script:** None. Let them play.
  *   **Key Insight:** If SSA worked perfectly here, P1 would win 100%. They won't. Why? Draws.

  #### Round 2: 5×5 Hex
  *   **Print:** Rhombus grid 5×5.
  *   **Prompt:** "Connect opposite sides. No swapping. Play 2 games."
  *   **Instructor Script:** "Notice: Can the board ever fill up without a winner?" (Don't answer).
  *   **Key Insight:** P1 advantage is palpable. SSA holds.

  #### The Drill: "Ghost Move" Worksheet
  *   **Content:** A diagram of a Hex board with one Red stone pre-printed in the center.
  *   **Instructions:**
      1.  Assume Red (P1) has a Winning Strategy $S$.
      2.  Blue (P2) tries to use $S$. Blue ignores the pre-printed Red stone and plays the first move of $S$.
      3.  Red responds.
      4.  **Crucial Step:** If $S$ ever calls for a move on the pre-printed stone's location, Blue must play a "Ghost Move" (a second dummy stone) elsewhere.
      5.  **Question:** Does Blue now have *more* than one extra stone? Does the strategy $S$ account for that?
  *   **Goal:** Students realize the "extra stone" argument relies on being able to treat your own stone as "empty" for the sake of the strategy, which creates a logical loop if the strategy demands that specific spot.

  #### Round 3: Sim ($K_6$)
  *   **Print:** 6 dots in a hexagon, all 15 edges drawn as thin lines.
  *   **Prompt:** "Color an edge. First to complete a triangle of your color **Loses**."
  *   **Instructor Script:** "This game cannot end in a draw. Math guarantees a triangle will form."
  *   **Key Insight:** SSA fails because having more edges is dangerous. This directly contradicts the Friend's "extra move is always good" assumption.

  #### Round 4: Handicap Hex
  *   **Variant A (P2 Bolt):** P2 marks two edges/stones in one turn, once per game.
      *   *SSA Verdict:* **Fails.** Asymmetry. P1 cannot steal P2's Bolt.
      *   *Student Error:* "P1 still wins because P1 is P1."
  *   **Variant B (Both Bolt):** Both have one double-move turn.
      *   *SSA Verdict:* **Survives.** Symmetry restored. Monotonicity holds. P1 wins.
      *   *Student Error:* "It's a draw now because advantages cancel." (SSA says P1 still wins because P1 moves first *plus* has the bolt).

  ---

  ### Contingency: The 60-Minute Cut
  If the session must be reduced to one hour, **cut Round 4 (Handicap Variants).**
  *   **Reasoning:** Rounds 1–3 establish the three critical premises (No Draws, Monotonicity, Symmetry). Round 4 tests boundary conditions of Symmetry, which is secondary to the core philosophical dispute about "extra moves."
  *   **Adjustment:** Extend the Debrief to 20 minutes to ensure the Friend's Claim is fully dismantled using evidence from R1–R3. Reduce Round 2 (Hex) to 1 game per pair instead of 2.

  ---

  ### Instructor's Cheat Sheet: The Friend's Claim
  **Friend:** "Follower observes Leader + 1 extra move = Follower wins."
  **Refutation Map:**
  1.  **Observation $\neq$ Symmetry:** In a race, the Leader changes the terrain. In SSA, the board is static; only the stone count differs.
  2.  **Extra Move $\neq$ Advantage:** Round 3 (Sim) proves an extra move can be suicide.
  3.  **Existence $\neq$ Action:** Even if SSA proves the Follower *could* win, it provides no *method* to find that win. A guarantee without a map is useless to a runner.

  **Final Word to Class:** "Proofs of existence are not instructions for construction. Your friend wants a map; the Strategy-Stealing Argument only tells you the treasure exists. Sometimes, that's enough for a mathematician. For a runner, it's nothing."
