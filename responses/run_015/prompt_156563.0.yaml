prompt: |-
  My dad retired in the spring and I've somehow ended up running the 40-person shop he built, and the place is full of rules nobody can explain — no purchase order over $300 without a second siganture, the Friday afternoon inventory count, a customer we still ship to at a loss and always have. Everyone keeps telling me Chesterton's fence: don't tear down a fence till you know why it was put up. But taken straight that seems to freeze everything forever, because half the time the only way to learn what a practice was for is to remove it and watch what breaks, and I can't run that experiment on a business that has to make payroll.

  So skip the Burke-versus-everyone-else scorecard, give me the spec instead: what would a usable rule for deciding when to keep and when to change an inherited practice actually have to deliver? The cases it has to get right (the rationale that died decades ago, the practice that only ever served the guy who wrote it, the one whose point you can only discover by violating it), the distinctions it isn't allowed to collapse (nobody can explain it vs. nobody benefits; reforming a practice vs. repealing it; caution about *this* arrangement vs. a general suspicion of change), and what it owes a person who has about a month, maybe thirty hours of digging, and no way to A/B test abolition. Mark which requirements are non-negotiable and which are just one camp's taste, and flag any two you suspect can't be satisfied at once — that's the part I most want to see. One short paragraph at the end on whether your list lands nearer Burke or nearer a presumption in favor of changing things is fine, but keep the weight on the criteria.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** The user has taken over a 40-person shop from their retired dad. There are inexplicable rules (purchase orders, inventory, loss-leading customers).
      *   **Problem:** "Chesterton's Fence" is being used to paralyze decision-making ("don't touch anything until you know why"). But knowing *why* often requires breaking the rule, which is risky for a business that needs to make payroll.
      *   **Task:** Define the *specification* for a usable rule/decision framework for keeping vs. changing inherited practices.
      *   **Requirements:**
          *   Identify cases the rule must handle (dead rationale, personal fiefdoms, discovery-by-violation).
          *   Identify distinctions it must maintain (unexplained vs. useless, reform vs. repeal, specific caution vs. general suspicion).
          *   Constraints: ~1 month/30 hours of digging, no A/B testing.
          *   Label requirements: Non-negotiable vs. Taste.
          *   Flag conflicts: Identify two requirements that might be mutually exclusive.
          *   Ending: One short paragraph on whether this leans Burkean or Pro-Change.
          *   Format: Dense, specific, no fluff.

  2.  **Deconstruct the "Chesterton's Fence" Dilemma:**
      *   The classic interpretation is conservative: Don't remove it until you understand it.
      *   The user's critique is pragmatic: Understanding often requires removal, but removal is risky.
      *   The goal is a *heuristic* or *protocol* that balances risk and inquiry within tight resource constraints.

  3.  **Drafting the Spec Requirements:**

      *   *Constraint 1: Time/Resources.* 30 hours is very little for a 40-person shop. The rule must prioritize triage.
      *   *Constraint 2: Risk.* Payroll depends on stability. No A/B testing means changes must be low-risk or high-confidence.
      *   *Constraint 3: Knowledge.* Tacit knowledge (dad's brain) is gone. Explicit knowledge (manuals) might be missing.

      *   *Cases to handle:*
          1.  **Zombie Rules:** Rationale died (e.g., a vendor no longer exists).
          2.  **Pet Rules:** Served only the founder (e.g., ego-driven reporting).
          3.  **Hidden Load-Bearing Walls:** Only break when removed (the scary ones).

      *   *Distinctions to maintain:*
          1.  **Opacity vs. Obsolescence:** Just because no one knows *why* doesn't mean it does nothing.
          2.  **Modification vs. Abolition:** Maybe the rule is right but the threshold is wrong ($300 vs $3000).
          3.  **Specific Risk vs. General Stagnation:** Don't let caution on one rule freeze the whole org.

      *   *Conflicts:*
          *   "Safety/No Breakage" vs. "Discovery-by-Violation." You can't safely test a load-bearing wall by hitting it with a sledge.
          *   "Speed (30 hours)" vs. "Deep Understanding."

  4.  **Refining the Requirements (Iterative Process):**

      *   *Req 1 (Triage):* Must distinguish between "high cost/low value" and "low cost/high risk."
      *   *Req 2 (Investigation):* Must allow for "safe probes" rather than full abolition.
      *   *Req 3 (Stakeholders):* Must account for who complains if it changes.
      *   *Req 4 (Time):* Must fit the 30-hour budget.

      *   *Labeling:*
          *   Non-negotiable: Must prevent payroll failure (Risk Management). Must allow *some* change (Viability).
          *   Taste: How aggressive the timeline is.
          *   Conflict: "Zero disruption" vs. "Empirical verification."

  5.  **Drafting the Content (incorporating the constraints):**

      *   *Headline:* The Spec for an Inheritance Protocol.
      *   *Core Function:* It must triage rules into "Keep," "Kill," or "Probe."
      *   *Cases:*
          *   *The Ghost Rationale:* Rule persists after external condition vanishes (e.g., tax law changed).
          *   *The Founder's Tic:* Rule benefits only the predecessor's psychology, not the business.
          *   *The Silent Keystone:* Rule prevents a catastrophe nobody remembers (the true Chesterton fence).
      *   *Distinctions:*
          *   *Unexplained ≠ Useless:* Lack of documentation isn't proof of irrelevance.
          *   *Tuning ≠ Trashing:* Adjusting the $300 limit isn't removing the control.
          *   *Local Caution ≠ Global Paralysis:* One risky rule shouldn't stop all optimization.
      *   *Constraints:* 30 hours, no A/B tests.
      *   *Conflicts:* "Empirical Proof" vs. "Operational Safety." You can't prove a fence is useless by knocking it down if the penalty for being wrong is bankruptcy.

  6.  **Polishing the Language:**
      *   Make it technical, like a software spec or engineering requirement.
      *   Ensure the "Non-negotiable" vs. "Taste" labels are clear.
      *   Ensure the "Conflict" is highlighted.
      *   Keep the final paragraph short and decisive.

  7.  **Review against User Prompt:**
      *   *Skip Burke scorecard?* Yes.
      *   *Give the spec?* Yes.
      *   *Cases it has to get right?* Included (Zombie, Pet, Keystone).
      *   *Distinctions not allowed to collapse?* Included (Opacity/Uselessness, Reform/Repeal, Specific/General).
      *   *Constraints (30 hrs, no A/B)?* Included.
      *   *Mark Non-negotiable vs. Taste?* Will do.
      *   *Flag two suspected conflicts?* Will do.
      *   *One short paragraph ending?* Will do.

  8.  **Final Tweak on the Conflict:**
      The user specifically asked to flag two requirements suspected can't be satisfied at once.
      *   Candidate 1: "Must verify function before alteration" vs. "Must verify function by observing failure upon removal."
      *   Candidate 2: "Must complete audit in 30 hours" vs. "Must achieve high-confidence understanding of tacit systems."
      *   Let's go with the Verification vs. Safety conflict. It's the core of the Chesterton problem.

  9.  **Final Tweak on the Ending:**
      Needs to weigh Burke vs. Change. The spec essentially creates a "Safe-to-Fail" probe system. It's Burkean in spirit (respect the system) but Pragmatic in execution (test boundaries). I should lean towards a "Pragmatic Conservatism."

      *Self-Correction on Ending:* The prompt asks whether the *list* lands nearer Burke or presumption for change. If the list emphasizes safety and triage, it's Burkean. If it emphasizes shedding dead weight quickly, it's Progressive. Given the "payroll" constraint, it must be Burkean-leaning but action-oriented. Let's call it "Engineered Conservatism."

      *Wait, one more check:* "Mark which requirements are non-negotiable and which are just one camp's taste." I need to be explicit about this labeling in the text.

      *Let's structure the response clearly.*

      *(Drafting mental outline)*
      1. Intro: The Protocol Spec.
      2. Functional Requirements (Cases).
      3. Distinction Requirements.
      4. Resource Constraints.
      5. Conflict Flag.
      6. Labels (NN vs Taste).
      7. Closing Paragraph.

      *Refining the Conflict:* The prompt asks to "flag any two you suspect can't be satisfied at once." I will explicitly state: "Requirement X and Requirement Y are likely mutually exclusive."

      *Refining the Labels:* I will append [NN] or [Taste] to each bullet.

      *Let's write.*
answer: |-
  **Specification: Inherited Practice Triage Protocol**

  **1. Functional Coverage (Cases to Resolve)**
  *   **The Zombie Condition:** The rule must identify practices tied to external constraints that no longer exist (e.g., a tax regulation repealed in 2015, a vendor who went bankrupt). [Non-negotiable]
  *   **The Founder's Tic:** The rule must distinguish between systemic safeguards and practices that served only the predecessor's psychology or personal convenience (e.g., a report only Dad read). [Non-negotiable]
  *   **The Silent Keystone:** The rule must account for practices where the benefit is invisible until removal (e.g., the Friday count prevents weekend theft spikes nobody tracks). [Non-negotiable]

  **2. Required Distinctions (Collapses Forbidden)**
  *   **Opacity vs. Obsolescence:** The protocol cannot treat "nobody knows why" as equivalent to "nobody benefits." Unexplained does not mean useless. [Non-negotiable]
  *   **Reform vs. Repeal:** The protocol must allow for parameter tuning (raising the $300 limit to $1,000) without triggering a full abolition review. [Taste: Pragmatist]
  *   **Local Caution vs. Global Paralysis:** High uncertainty on one critical rule (payroll) cannot veto low-risk changes on peripheral rules (office supplies). [Non-negotiable]

  **3. Resource & Risk Constraints**
  *   **The 30-Hour Cap:** The investigation method for any single rule cannot exceed an average of 30 minutes of active digging across the 40-person shop, prioritizing oral history from the three longest-tenured employees. [Taste: Efficiency]
  *   **No A/B on Core:** The protocol must forbid experimental removal of any practice linked directly to cash flow or legal compliance. [Non-negotiable]
  *   **Safe-to-Fail Probes:** For non-critical rules, the protocol must allow temporary suspension (e.g., "skip the Friday count for one month") with a predefined rollback trigger. [Non-negotiable]

  **4. Conflicting Requirements**
  *   **Conflict Flag:** **"Must verify function before alteration"** and **"Must verify function by observing failure upon removal"** are mutually exclusive. You cannot know the load-bearing capacity of a fence without leaning on it, but leaning on it risks breaking it. This protocol resolves this by substituting *historical correlation* (asking "what happened before this rule?") for *empirical violation*, which is imperfect but safer.

  **5. Classification of Requirements**
  *   **Non-negotiable:** Preventing payroll failure, distinguishing opacity from uselessness, allowing safe probes, handling zombie conditions.
  *   **Taste:** The 30-hour limit (could be 50), the preference for tuning over repealing (could be binary), the reliance on oral history over documentation.

  This specification lands nearer to Burke, but only as a matter of engineering safety, not philosophy. It treats the business as a legacy codebase where you refactor only after writing tests, acknowledging that "understanding" is often a post-hoc rationalization for "survival." It presumes change is necessary for efficiency, but assumes the default state of an unexplained rule is "load-bearing" until a safe probe proves otherwise.
