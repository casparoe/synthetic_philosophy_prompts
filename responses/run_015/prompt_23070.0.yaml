prompt: |-
  Okay so I'm in this philosophy class and we just hit the part on experimental philosophy and the Knobe effect, and I'm kinda lost on whether the whole thing is actually real or just an artifact of how the survey question is worded. Can you write me a dialogue between two philosophers arguing about this? One should be a defender of the view that the Knobe effect is a genuine, robust phenomenon that tells us something deep about how ordinary people actually understand intentional action, like that moral judgment is kind of baked into the folk concept of "intentional" and that's not a bug, it's the concept. The other should be a skeptic who thinks the whole effect is basically an artifact of the specific way the question is phrased, and that experimental philosophy is overreaching when it tries to read deep conceptual structure off of a couple of survey answers.

  Make both of them actually competent, please, not one of them just a strawman. I want real back and forth where they respond to each other's actual points, like the defender should press the skeptic on why a pure wording artifact would survive so many replcations and small variations to the question, and the skeptic should push back on whether the defender is just assuming that folk intuitions are even the right target for philosophy to be measuring in the first place. And can you have them end still disagreeing but each conceding at least one point to the other, so it doesn't just feel like one side wins by default? I'm using this to study for my essay so like 400-600 words would be perfect, and keep the language at a level I can actually follow.
