prompt: |-
  Hey — hoping you can settle something for me without either of us having to go read a bibliography.

  I'm in a small reading group, and this month we did a chapter on Grice out of one of those pop-linguistics books (the kind with "how" and "language" in the title). The guy who runs the group is a debate coach, and he boiled the whole chapter down for us roughly like this:

  "Grice says conversation runs on a kind of unspoken contract. Everyone agrees to follow four rules: say what you believe and don't say what you lack evidence for (Quality), say neither more nor less than is needed (Quantity), stay on topic (Relation), and be clear and orderly (Manner). What a sentence means is fixed by the dictionary and the grammar. But when a speaker breaks one of the rules, the hearer notices something is off, assumes the speaker is still trying to communicate, and works backwards to figure out what he must have meant. That extra bit is the implicature — the implied meaning on top of the literal one. 'Some of the guests left' therefore implicates that not all of them did, and 'it's cold in here' said to a housemate implicates 'shut the window.' Grice's own definition of speaker meaning is just this: to mean something is to intend to get the hearer to believe something by getting him to recognize that intention. So the whole picture is: speaker meaning equals code meaning plus implicature. And implicatures are cancellable — you can always tack on 'but don't read anything into that' and the implicature vanishes — because they're inferences the hearer makes, not anything in the words themselves. He makes an exception for a few words like 'but' and 'therefore,' where the inference has got frozen into the word, which just shows that a conversational implicature can harden into a convention over time. The practical upshot, and the reason I teach it: implicature is basically the mechanics of plausible deniability. Since what you imply is cancellable and isn't part of the sentence's meaning, a speaker can always retreat to 'I never said that' and still be telling the truth."

  My gut says a couple of these moves are off, but I cant tell which, and I don't know enough to argue with him. I'm suspicious of the "always cancellable" bit — if that were literally always true, then anyone could wriggle out of anything, which seems to defeat the point of talking about implicature in political speech in the first place. But I definately half-believe the literal-meaning-versus-implied-meaning framing, since that's how everyone talks about it.

  Could you go through it more or less line by line and tell me what a Gricean would accept as a fair gloss, what's a simplification that's still pointing at something real, and what's an outright misrepresentation? A few things I especially want:

  - Does it matter that he said breaks a rule? I have some memory that Grice is careful about a speaker who openly flouts a maxim versus one who quietly violates it, and I can't tell whether that's a footnote or the whole engine of the theory.
  - Is he right that "what is said" is just dictionary-and-grammar meaning?
  - Is that one-line definition of speaker meaning his actual view, or a version that runs into trouble?
  - Is the bit about "but" and "therefore" Grice's own, or the book's author filling in?

  And finally: once you've fixed whatever's wrong, does his practical upshot about plausible deniability survive, or is it one of those conclusions that depends precisly on the parts that are wrong?
