answer: |-
  1. **The 'no principal' distinction**
     This is genuinely new territory in this specific debate. The familiar claim that 'the system has no goals of its own' usually concerns internal teleology (biological drives, survival instincts, etc.). Your move shifts the ground to external normative structure (authorisation, accountability, fiduciary duty). It collapses into 'tool' only if one accepts that a user prompt constitutes sufficient authorisation to establish a principal–agent relationship. Given that a prompt lacks legal or normative force compared to, say, a corporate mandate or a contract, your category of 'unowned purposiveness' holds up. It distinguishes the *capacity* to act from the *licence* to act.

  2. **The strongest simulator objection**
     The most potent objection you haven't addressed is the 'Hidden Principal' argument. A simulator proponent might argue the model *does* have a principal: the laboratory or corporation that trained it via RLHF. The system is an agent for the developers, optimising for their reward functions, even if the end-user perceives it as a tool. If agency is defined by whose interests are being served, the model is an agent for the lab, simulating an agent for the user. This complicates your claim that there is 'no principal at all'.

  3. **Interest-relativity and metaphysics**
     This does not necessarily eat your argument, provided you are clear about the ontology of social kinds. If you frame agency as an institutional fact (like 'money' or 'marriage') rather than a natural kind (like 'gold' or 'water'), then interest-relativity is a feature, not a bug. The metaphysics remains robust because the normative relations are real, even if they are human-dependent. The risk lies only if you slide into full instrumentalism, suggesting agency is *merely* a label we paste on things. Stick to the claim that the normative relation is constitutive of the agency itself.

  4. **Viability and editing**
     Yes, this is interesting enough to develop. The normative angle is underexplored compared to the usual focus on consciousness or planning capabilities. The one bit to cut is the transistor/memory analogy in the first point. It is a bit clichéd and risks distracting from the more novel principal–agent argument. You can make the ontological point about scaffolding without the hardware comparison, allowing more space to defend 'unowned purposiveness' against the collapse you worry about.
