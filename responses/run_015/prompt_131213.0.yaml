answer: |-
  To analyze the conceptual divergence between etiological (selected-effects) and causal-role (systemic) theories of function within the specific scenario of **functional displacement with structural conservation**, we must abstract the biological details into a logical schema. Let us define the trait as $T$, its conserved morphological structure as $S$, its original selected effect as $F_1$, and its new fitness contribution as $C_2$. The scenario specifies that $S$ is retained due to developmental locking (constraints), while the selective pressure maintaining $T$ in the population has shifted from $F_1$ to $C_2$.

  Here is the analysis of the three points of divergence.

  ### 1. The Etiological Account: Historical Continuity vs. Functional Update

  The etiological account (e.g., Millikan, Neander) defines the function of a trait as the effect for which it was historically selected. Function is a historical property, not merely a dispositional one.

  **Judgment on Functional Status:**
  In this displacement scenario, the etiological account must judge that $T$ has **lost its original function ($F_1$)** and, contingent on empirical verification, may have acquired a **new proper function ($C_2$)**. It does not retain $F_1$ because the causal link between $F_1$ and the current proliferation of $T$ has been severed; $F_1$ no longer explains why $T$ exists in the current population.

  However, whether $C_2$ qualifies as the *new* proper function depends on the logical requirement of **selectional causation**. For $C_2$ to be the function, the presence of $T$ in the current population must be causally explained by the fitness advantage conferred by $C_2$.
  *   **Conceptual Commitment:** The theory commits to the principle that *function tracks the reason for presence*. If the reason for presence changes, the function changes.
  *   **Empirical Dependence:** The judgment relies entirely on empirical biology to determine if $C_2$ is genuinely the *selective maintainer*. Because $S$ is developmentally locked, it is possible that $T$ is not being actively selected *for* $C_2$, but is merely tolerated (hitchhiking) while $C_2$ provides a benefit. If $T$ would persist even without $C_2$ due to the developmental lock (i.e., no cost to remove it), then $C_2$ is merely a "current utility," not an etiological function. The etiological account cannot distinguish between "selected for $C_2$" and "tolerated while doing $C_2$" without empirical data on selection coefficients and heritability.

  **Verdict:** The trait loses $F_1$. It gains $C_2$ as a function *only if* $C_2$ is empirically verified as the current selective driver. If $T$ persists solely due to constraint despite $C_2$, the trait becomes functionally null (a spandrel) under strict etiology, despite its utility.

  ### 2. The Causal-Role Account: Systemic Integration vs. Arbitrariness

  The causal-role account (e.g., Cummins) defines function as the causal contribution a trait makes to the capacity of a containing system. History is irrelevant; current topology is paramount.

  **Judgment on Functional Status:**
  Under this account, $T$ is immediately assigned **$C_2$ as its function**, provided $C_2$ contributes to a capacity of the organism (the containing system). The absence of the original causal role ($F_1$) is irrelevant. The trait is not treated as non-functional; rather, its functional identity is updated instantaneously to match its current causal output.

  **Avoiding Arbitrariness without Etiological Smuggling:**
  The primary challenge for the causal-role account here is the problem of **promiscuity**. If $T$ contributes to survival ($C_2$), and survival is the system capacity, then every trait that aids survival is a function. To avoid this, the causal-role theorist must restrict the "containing system" and the "relevant capacity."
  *   **The Logic:** The theorist avoids smuggling in etiology by appealing to an **analytical strategy**. The function is relative to the explanatory interest of the observer decomposing the system. If we are explaining the organism's metabolic stability, $C_2$ is a function. If we are explaining its reproductive history, $C_2$ might not be.
  *   **The Risk:** In the displacement scenario, if the structure $S$ is locked and not optimized for $C_2$, assigning $C_2$ as the function implies a normative fit that doesn't exist. To avoid arbitrarily privileging $C_2$ over any other side effect, the causal-role account must define the "system capacity" narrowly (e.g., the specific physiological subsystem $T$ resides in) rather than broadly (organismal fitness).
  *   **Conceptual vs. Empirical:** Conceptually, the account requires a defined "system capacity." Empirically, biology must identify what that capacity is. If the capacity is defined as "doing what the trait was designed to do," the account collapses into etiology. To remain distinct, it must define capacity as "what the trait is currently doing that explains the system's behavior." Thus, it avoids historical smuggling by accepting that *any* stable causal contribution can be a function, provided it fits the analyst's decomposition of the system.

  **Verdict:** The trait is assigned $C_2$. It avoids arbitrariness not by referencing history, but by restricting the *level of systemic analysis*. It does not care that $S$ is locked; it only cares that $S$ causes $C_2$.

  ### 3. The Intermediate Category: Functionally Orphaned but Systemically Integrated

  Is there conceptual space for a trait that is useful ($C_2$) but lacks the normative status of a "proper function" because the structure was not shaped by $C_2$? This is the realm of **exaptation** prior to adaptation.

  **The Conceptual Gap:**
  Yes, there is an intermediate category: **Current Utility without Proper Function.**
  *   **Etiological Failure:** The etiological account struggles to accommodate this without collapsing into a forward-looking view. If it admits $C_2$ is a function before a history of selection for $C_2$ is established, it violates its own historical definition. If it denies function until selection acts, it ignores the trait's actual systemic integration. It must label the trait a "spandrel" or "exaptation," effectively marking it as functionless until history catches up.
  *   **Causal-Role Failure:** The causal-role account collapses the distinction entirely. By assigning $C_2$ as the function immediately, it erases the difference between a trait *optimized* for $C_2$ and a trait that is merely *compatible* with $C_2$ due to locking. It cannot capture the "orphaned" nature of the trait—the sense that the trait is "making do" rather than "fulfilling a design."

  **Accommodation without Collapse:**
  *   **Etiology:** Can accommodate this by distinguishing **Proper Function** (historical) from **Current Utility** (dispositional). This preserves the category but requires a dual vocabulary. It risks collapse if "Current Utility" begins to do the explanatory work of "Proper Function" in biological practice.
  *   **Causal-Role:** Can accommodate this by distinguishing **Functional Contribution** from **Adaptive Significance**. It can acknowledge $T$ has a function ($C_2$) without claiming $T$ is an adaptation for $C_2$. However, this risks collapse if "Adaptive Significance" (a historical notion) becomes necessary to explain why the function is stable.

  **Verdict:** The intermediate category exists logically as "non-adaptive utility."
  *   The **Etiological** account preserves this category best by denying "function" status until selection history updates, but at the cost of rendering the trait functionally inert in explanation despite its utility.
  *   The **Causal-Role** account absorbs the category by calling it a function, but at the cost of losing the distinction between *design* and *happenstance*.
  *   Neither can fully accommodate the nuance of "locked structure providing new utility" without appealing to the other's criteria: Etiology needs to acknowledge current utility to be biologically relevant; Causal-Role needs to acknowledge historical optimization to avoid promiscuity.

  ### Summary of Divergence

  In the case of functional displacement with structural conservation:

  1.  **Etiological Theory** treats the trait as historically severed from $F_1$. It grants $C_2$ functional status **only if** empirical selection data confirms $C_2$ drives retention. It relies on **empirical biology** to distinguish between "selected for $C_2$" and "locked constraint allowing $C_2$."
  2.  **Causal-Role Theory** treats the trait as immediately functional for $C_2$. It avoids arbitrariness by restricting the **conceptual scope** of the "containing system," but relies on **empirical biology** to map the causal topology that justifies the systemic decomposition.
  3.  **Intermediate Space** reveals that Etiology prioritizes **normativity** (what the trait is *for*), while Causal-Role prioritizes **topology** (what the trait *does*). The "orphaned but integrated" trait exposes Etiology's inability to explain current utility and Causal-Role's inability to distinguish utility from design. To handle this without collapsing, Etiology must admit "utility" as a distinct category from "function," and Causal-Role must admit "function" as distinct from "adaptation."
