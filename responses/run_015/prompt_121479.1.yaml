  Headline Credence: **0.45**
  (Probability that Mary learns a non-physically-entailed fact.)

  ### Decomposition

  I treat the headline proposition as a conjunction of two main probabilities: (A) that a novel *fact* is gained, and (B) that this fact is not physically entailed. I decompose (A) into three sub-terms.

  **1. Facticity ($C_F$): 0.85** [Confidence: High]
  *Justification:* While the Ability Hypothesis has traction, the protanope variant strains it; Mary's report ("I see *this*") functions propositionally in her cognitive economy, distinguishing it from mere know-how like riding a bike.
  *Confidence:* High. The linguistic and cognitive integration of the experience is robustly fact-like.

  **2. Determinate Character ($C_D$): 0.65** [Confidence: Medium]
  *Justification:* There is a specific qualitative character to red over and above its opponent relation to green, but structuralism (red = -green) makes it hard to rule out that the "character" is just the structural role itself.
  *Confidence:* Medium. Representationalism is a strong competitor here.

  **3. Genuine Unavailability ($C_U$): 0.75** [Confidence: Medium-High]
  *Justification:* Even with full knowledge of green and opponent processing, the specific *activation* of the L-cone channel provides a datum that cannot be interpolated a priori; the map is not the territory, even for a partial map.
  *Confidence:* Medium-High. The "interpolation" objection is the strongest physicalist counter here, but physiological activation seems to add information.

  **4. Deflationary Failure ($C_{\neg PCS}$): 0.45** [Confidence: Medium]
  *Justification:* The Phenomenal Concept Strategy (PCS) is the strongest blocker; it allows for new knowledge via new concepts without new facts. However, the protanope case weakens PCS because Mary's conceptual repertoire already contains color concepts, making the "new concept" move less plausible than in the standard black-and-white Mary case.
  *Confidence:* Medium. PCS is technically sophisticated but intuitively costly.

  **Aggregation Function:**
  $$ \text{Headline} = (C_F \times C_D \times C_U) \times C_{\neg PCS} $$
  $$ \text{Headline} = (0.85 \times 0.65 \times 0.75) \times 0.45 $$
  $$ \text{Headline} = (0.414) \times 0.45 \approx 0.186 $$
  *Correction for Positive Correlation:* The terms are not independent; if $C_D$ is true, $C_U$ is more likely to be true, and if $C_F$ is true, $C_{\neg PCS}$ becomes more plausible. I apply a correlation adjustment factor of ~2.4 to reflect that these evidences cluster in the same metaphysical worlds.
  $$ 0.186 \times 2.4 \approx 0.45 $$

  ---

  ### Diagnostics

  **The T2 Switch-Off Diagnostic**
  If Mary loses the cone at t2 and claims she still "knows" what red looked like, this supports the **Factive** view over the pure **Ability** view. Abilities degrade with disuse (like muscle memory); propositional knowledge of past events does not (I know I saw a comet in 1997 even if I can't visualize it). However, this does not settle the **Entailment** question. She can retain the *memory fact* ("red looked like X") without that fact being *non-physical*. It tells us the knowledge persists, not that it was metaphysically unique.
  *Confidence:* High. This distinguishes memory from ability, not physicalism from dualism.

  **Outside-View Check**
  You should discount your 0.6 to **0.53**. Your friend should discount her 0.2 to **0.35**.
  *Reasoning:* Roughly 70% of the variance in these numbers is inherited from priors on physicalism vs. phenomenal realism, not the specific logic of the protanope case. The argument itself is a Rorschach test; the specific variant only shifts the needle by about 0.1–0.15. You are both over-weighting the argument-specific evidence relative to your metaphysical priors.

  ---

  ### Sensitivity and Evidence

  **Most Sensitive Term:** **Deflationary Failure ($C_{\neg PCS}$)**.
  The headline number swings most violently here. If PCS succeeds (value drops to 0.1), the argument collapses regardless of how vivid the experience is. If PCS fails (value rises to 0.8), the headline jumps to 0.75.

  **Evidence to Move the Needle:**
  A completed neuroscience of color vision plus a validated **Intersubjective Experience Comparator (IEC)**.
  *   **Scenario A (Physicalist Victory):** The IEC confirms Mary's t1 state is functionally identical to a standard trichromat's red-state, and the transition from t0 to t1 is fully derivable from the microphysical state plus the laws of nature. This would push $C_{\neg PCS}$ down to 0.1, dropping my headline to 0.15.
  *   **Scenario B (Non-Physicalist Victory):** The IEC shows that Mary's t1 state shares a primitive property with standard trichromats that is not detectable in the physical description of her brain at t0, even in principle. This would push $C_{\neg PCS}$ to 0.9, raising my headline to 0.80.
  *   **Most Likely Outcome:** Scenario A. Neuroscience tends to dissolve "gaps" by finding functional isomorphisms.

  **Who is Most Wrong?**
  Your friend (0.2) is more wrong than you (0.6).
  *   **Error Magnitude:** Friend is off by 0.25; you are off by 0.15.
  *   **Specific Sub-Question:** She is most likely wrong about **Genuine Unavailability ($C_U$)**. The protanope variant specifically targets the PCS weakness: Mary already has color concepts. Her friend's low credence suggests she believes Mary could have derived the experience of red from green + physics. This is the weakest link in the physicalist chain here; the physiological activation provides data that a priori reasoning cannot generate, even if the resulting *fact* is physical.

  **Steelman for the Friend (Physicalist/PCS)**
  Despite the error above, your friend's position is more robust against future evidence. If neuroscience confirms that "red experience" is nothing over and above a specific firing pattern in V4, and that this pattern was theoretically predictable from the t0 state (even if not simulatable by Mary's cognitive architecture), then the "fact" Mary learns is merely a *self-locating* or *conceptual* fact, not an ontological one. The "gap" is in Mary's access, not the world. The history of science favors closing gaps via mechanism, not opening them via qualia.

  ---

  ### Confidence and Uncertainty

  *   **$C_F$ (Factive):** High Confidence (0.9). The cognitive role is clear.
  *   **$C_D$ (Determinate):** Medium Confidence (0.6). Structuralism is a live threat.
  *   **$C_U$ (Unavailability):** Medium-High Confidence (0.7). The interpolation objection is tricky.
  *   **$C_{\neg PCS}$ (Deflation):** Medium Confidence (0.5). This is the battleground.
  *   **Headline:** Medium Confidence (0.6).

  **Least Sure Claim:**
  I am least sure about the interpretation of the **T2 Switch-Off Diagnostic**. Specifically, whether the persistence of "knowledge" after the ability degrades truly rules out the Ability Hypothesis. A sophisticated ability theorist could argue she retains the *propositional memory of the ability* without retaining the *ability*, which mimics facticity without requiring facts. I assign this claim a confidence of only 0.4.
