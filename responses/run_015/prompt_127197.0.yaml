answer: |-
  The derivation begins with the knowability principle: for every proposition $p$, if $p$ is true then possibly someone knows $p$ ($p \rightarrow \diamond Kp$). Assume factivity ($Kp \rightarrow p$) and distribution over conjunction ($K(p \land q) \rightarrow (Kp \land Kq)$) hold necessarily. Substitute $q \land \neg Kq$ for $p$. If this conjunction is true, the knowability principle yields $\diamond K(q \land \neg Kq)$. By distribution, this implies $\diamond (Kq \land K\neg Kq)$. Applying factivity to the second conjunct yields $\diamond (Kq \land \neg Kq)$, which contradicts factivity applied to the first conjunct within the scope of possibility. Thus, $q \land \neg Kq$ is false, implying $q \rightarrow Kq$. Since $q$ is arbitrary, every truth is known. This result is not merely a refutation solvable by tweaks; it presents a dilemma closing the two routes available to the verificationist.

  ### The Restrictionist Impasse

  The most common response restricts the knowability principle to a privileged class of propositions $\mathcal{C}$, such as the non-epistemic or the atomic. To block the derivation, the problematic conjunction $q \land \neg Kq$ must fall outside $\mathcal{C}$. However, this route is dialectically unavailable to the verificationist because it undermines their own semantic theory. A verificationist account of meaning must cover every sentence of the language, including sentences about what is known. The construction uses only negation, conjunction, and the knowledge operator. Therefore, any class $\mathcal{C}$ that is expressively adequate for the verificationist's semantics must be closed under these operations.

  Assume closure under conjunction: if $A \in \mathcal{C}$ and $B \in \mathcal{C}$, then $(A \land B) \in \mathcal{C}$. Assume closure under negation: if $A \in \mathcal{C}$, then $\neg A \in \mathcal{C}$. If the verificationist claims $q \in \mathcal{C}$, and since epistemic sentences are required for their semantics, $\neg Kq \in \mathcal{C}$. By closure under conjunction, $q \land \neg Kq \in \mathcal{C}$. The derivation then runs within the restricted class. To avoid this, the verificationist must deny that $\neg Kq$ is in $\mathcal{C}$. But this excludes epistemic negations from the scope of meaningful discourse governed by the knowability principle. Since the verificationist uses such sentences to state their own theory, the restriction is self-defeating. They cannot restrict the principle without restricting the language required to formulate the restriction.

  ### The Vacuity of Non-Factive Surrogates

  Granting that restriction fails, the only remaining intervention point is factivity. Suppose we replace $K$ with a non-factive surrogate $V$, read as there is conclusive evidence for. The only truth-related constraint is weakened factivity: $Vp \rightarrow \diamond p$. The derivation now stalls because $V\neg Vq$ does not imply $\neg Vq$. However, this rescue is a disaster. The knowability principle becomes $p \rightarrow \diamond Vp$. Combined with weakened factivity, this yields $p \rightarrow \diamond \diamond p$. Assume the S4 principle for possibility: $\diamond \diamond p \rightarrow \diamond p$. This reduces the principle to $p \rightarrow \diamond p$.

  This is the vacuity charge. For any contingent truth, $p \rightarrow \diamond p$ is trivially satisfied by the definition of contingency. The principle was supposed to articulate the constitutive claim that truth consists in verifiability. Instead, it now says no more than that true propositions are possible ones. This severs the link between truth and evidence. A verificationist cannot accept a principle that equates truth with mere possibility, as this abandons the core commitment that truth is grounded in cognitive access. The non-factive operator avoids contradiction only by becoming too weak to serve the verificationist's purpose. The principle loses its explanatory power, rendering the verificationist thesis empty.

  ### The Anchoring Reply

  A serious objection shifts the focus from propositions to speakers and capacities. The claim becomes: for any sentence a speaker understands, there is some possible course of experience after which that speaker would be in a position to correctly decide that sentence, where correctness is anchored to the world of that experience. This reply faces a dilemma regarding where truth is evaluated.

  Case one: the decision is evaluated at the base world. Factivity is back in play at that world. If the speaker decides $p$ at the anchor world, and $p$ must be true at the base world, then $p$ is known at the base world. The construction runs as before, but now relative to every world. This requires an omniscience-like collapse everywhere, not only here. Case two: the decision is evaluated at the anchor world. If $p$ is true at the base world but false at the anchor world, $p$ cannot be known at the anchor world by factivity at that world. Thus, for any contingent sentence, the principle is satisfied trivially or not at all. The verificationist should prefer case one to preserve the knowability claim, but this accepts the modal collapse. Prefering case two saves consistency but abandons the claim that actual truths are knowable. Neither option preserves the original constitutive claim without collapse or triviality.

  ### Vulnerabilities and Revivals

  The weakest link in this argument is the vacuity charge. It assumes the verificationist needs a non-trivial link between truth and verification. A hardened verificationist might accept that $p \rightarrow \diamond p$ is the only link possible, conceding that truth is merely consistent with evidence. To exploit this, they must argue that constitutive claims need not be informative beyond logical consistency. However, this concedes the realist's point that truth outstrips verification.

  Finally, check whether the paradox revives against the non-factive surrogate. Substitute $\neg \diamond Vq$ for $p$. The principle yields $\neg \diamond Vq \rightarrow \diamond V(\neg \diamond Vq)$. If $V$ lacks factivity, $V(\neg \diamond Vq)$ does not imply $\neg \diamond Vq$. The contradiction requires $V$ to entail truth, which we denied. Thus, the paradox does not revive directly. This shows the second horn is robust against formal contradiction. However, the vacuity charge survives. Avoiding contradiction costs the constitutive claim. The non-factive surrogate is consistent but empty. The verificationist escapes the paradox only by abandoning the thesis that truth is essentially knowable. The dilemma holds: either the principle is restrictive and self-defeating, or it is general and vacuous.
