  *Critical Adjustment:* To make this philosophically sound for a class, I must define Alienation broadly enough (Species-being) vs narrowly (Product).
  *Actually, the prompt asks me to plan the session to teach that they are conceptually separable.* I must follow the prompt's directive. I will frame Variant 1 as "Objective Economic Theft vs. Subjective Fulfillment." Even if Marx argues the theft *causes* the estrangement, the *definitions* are distinct. One is about *who gets the money*, the other is about *who owns the self*.
  *Better approach for Variant 1:* A highly autonomous creative worker under a patron. The patron takes the surplus (Exploitation), but the artist feels the work expresses their soul (No Alienation).
