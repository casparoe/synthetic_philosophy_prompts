answer: |-
  The remark "the wavefunction is just information, not reality" is the most common slogan in quantum foundations, but it is also the most polymorphic. In the wake of the Pusey-Barrett-Rudolph (PBR) theorem, this sentence is no longer a harmless platitude; it is a technical claim that must be dissected to see if it holds water. PBR proves that, under the assumption of **Preparation Independence** (that independently prepared systems have independent physical states), distinct quantum states must correspond to disjoint distributions over underlying ontic states ($\lambda$). This rules out models where the wavefunction represents mere ignorance about an underlying reality (so-called $\psi$-epistemic models).

  To evaluate your seminar colleague's dismissal, we must categorize what they meant by "information." There are four precise readings, ranging from refuted to robust.

  ### 1. The Spekkens-Style $\psi$-Epistemic Claim
  **Claim:** There exists an underlying ontic state $\lambda$ (reality), and the wavefunction $\psi$ represents a probability distribution $\mu_\psi(\lambda)$ over these states. Distinct $\psi$ can overlap on the same $\lambda$ (i.e., the same reality is compatible with multiple quantum states).
  *   **Status:** **Refuted by PBR.** This is the exact target of the theorem. If you assume Preparation Independence, PBR demonstrates that $\mu_\psi$ and $\mu_\phi$ cannot overlap for non-orthogonal states.
  *   **Triviality:** Non-trivial. It is a concrete physical hypothesis.
  *   **Survival:** It does not survive unless one is willing to violate Preparation Independence (see Claim 4). If your colleague meant this, they are technically incorrect unless they explicitly endorse superdeterministic correlations between independent labs.

  ### 2. The Instrumentalist/Deflationist Claim
  **Claim:** "Reality" ($\lambda$) is a meaningless metaphysical posit. The wavefunction is merely an algorithmic tool for predicting measurement outcomes (Shannon information about data).
  *   **Status:** **Compatible, but Empty.** PBR is a conditional theorem: *If* an ontic model exists, *then* $\psi$ is ontic. This claim denies the antecedent.
  *   **Triviality:** High. It dissolves the problem by refusing to play the game. It renders the sentence "not reality" tautological because "reality" (in the ontic sense) is defined out of existence.
  *   **Survival:** Survives easily, but at the cost of making the statement philosophically vacuous. It doesn't explain *why* the wavefunction behaves the way it does; it just refuses to ask.

  ### 3. The Preparation-Independence Loophole Claim
  **Claim:** $\psi$ is information about $\lambda$, but the "independence" assumption is false. Systems prepared separately may share hidden correlations (holism).
  *   **Status:** **Compatible, but Costly.** This saves the $\psi$-epistemic view by rejecting a PBR axiom.
  *   **Triviality:** Non-trivial. It requires a specific physical mechanism for correlation.
  *   **Survival:** Survives technically, but it is physically unattractive. It implies a "conspiracy" where nature coordinates hidden variables across spacelike separations without signaling. While logically possible, it undermines the methodology of experimental science (which assumes we can prepare systems independently).

  ### 4. The QBist/Agent-Centric Claim
  **Claim:** The wavefunction is not information *about* an external $\lambda$; it is an agent's normative degrees of belief (Bayesian credence) regarding their future experiences. There is no $\lambda$ independent of the agent's interaction.
  *   **Status:** **Robust and Non-Trivial.** This redefines "information" from "ignorance of reality" to "guide for action."
  *   **Triviality:** Low. It requires a full reconstruction of quantum theory (as done by Fuchs, Schack, et al.).
  *   **Survival:** Survives completely. PBR assumes an observer-independent ontic state $\lambda$ exists to be modeled. QBism denies this category. For a QBist, PBR proves only that *if* you insist on a god's-eye view of reality, you must treat $\psi$ as part of it. Since QBists reject the god's-eye view, the theorem has no bite.

  ### Committed Position
  The seminar speaker likely intended **Claim 1 (Spekkens-style)**, as that is the historical intuition behind "psi-epistemic." However, that reading is **dead** in the face of PBR unless one embraces the unpalatable costs of Claim 3 (violating Preparation Independence). Claim 2 (Instrumentalism) is a "get out of jail free" card that renders the discussion empty.

  The only reading that makes the sentence "the wavefunction is just information" **substantive, coherent, and immune to PBR** is **Claim 4 (QBist/Agent-Centric)**. It is the only interpretation that takes "information" seriously as a primitive category rather than a derivative of hidden variables. It dismisses PBR not by finding a loophole in the math, but by rejecting the metaphysical framework (ontic models) that gives the math its force. If you want to wave away PBR without lying about the theorem or retreating into silence, you must adopt the agent-centric view.

  \answer{The QBist/Agent-Centric Reading}
