answer: |-
  To analyze this through moral worth, we must first fix the unit of assessment. If the act is a single donation—writing a check for bednets—the evaluation is straightforwardly positive on consequentialist grounds. Bednets save lives regardless of the source. But moral worth theories, particularly the Kantian line you specified, are not interested in isolated events. They assess the will behind the action. Therefore, the agent is Sam Bankman-Fried, but the act is not the donation; it is the life-plan of "earn to give" executed through a specific maxim: "I will use customer deposits as venture capital to generate surplus for altruism."

  This distinction matters because it shifts the focus from the outcome (lives saved) to the policy (theft enabled by altruistic branding). If we assess only the donation, we are doing accounting. If we assess the life-plan, we are doing moral philosophy. I am stretching the theory slightly here; Kantian frameworks were built for individual interactions, not complex corporate structures where "customer money" is abstracted into balance sheets. But structurally, the maxim holds: he treated people as means (customers) to an end (philanthropy), violating the core requirement that persons be treated as ends in themselves.

  Regarding the reasons operative: you call this "motive laundering," and the theory has room for this, though it lacks the vocabulary. Moral worth requires acting *from* duty, not merely *in accordance* with it. SBF acted in accordance with altruistic duty but likely from motives of status, power, or vanity. The "laundering" occurs because the movement supplied a vocabulary of respectable reasons that masked the operative ones. This is not just hypocrisy; it is a structural feature of high-status philanthropy. The theory suggests that if the operative reasons are self-serving, the act lacks moral worth, even if the outcome is good.

  Does it matter that we cannot tell cleanly what his motives were? Yes. Moral worth theories usually assume a transparent agent. Here, the opacity is strategic. I am guessing that the mix of motives included genuine concern, but subordinate to self-aggrandizement. If the concern was real but secondary, the Kantian verdict remains: the act lacks moral worth because the primary motive was not duty. The "laundering" works because society rewards the appearance of the right reasons, allowing the agent to collect moral credit without doing the moral work of aligning their will. This confirms the theory's suspicion: outward conformity to the good is not enough.

  This leads to the taint question. Does stolen money void the worth of the giving? We must separate the value of the state of affairs from the worth of the agent. The bednets are dry; the good is real. A consequentialist must admit the world is better for the donation, even if the source was criminal. However, the *moral worth* of the action is voided entirely. The wrongness does not travel downstream to the recipients—they are innocent—but it travels upstream to the agent.

  The split you describe—"the act is fine, the person isn't" versus "nothing is clean"—confuses outcome value with moral worth. The theory is committed to the first view: the act (as an event) produced good, but the agent (as a moral being) acted wrongly. Where the theory goes silent is on whether the recipients should return the money. That is a question of justice, not moral worth. I am stretching here to say that moral worth theory doesn't care about the cleanup; it cares about the judgment of the will. The taint is on the character, not the commodity.

  Running this the other direction, the episode stress-tests the theories. The "worth needs right reasons" view looks strong because it predicts the lack of creditworthiness regardless of the fraud's discovery. If SBF had never been caught, the Kantian says he still lacked moral worth. This feels prescient but also eerie—it implies a hidden ledger of moral value inaccessible to public scrutiny. It makes moral worth a private verdict, not a public tool.

  The motives-don't-matter side (consequentialism) looks blind. It can condemn the fraud because it caused harm, but it struggles to register the taint on the philanthropy itself. If the net outcome was positive, the theory must endorse the strategy, minus the theft. It has no way to say "this good is corrupted" without referencing rights or duties it typically ignores. This suggests the episode confirms that moral worth is a verdict on the agent, not a ledger of outcomes. It is about who you are, not just what you fix.

  Finally, can a movement have moral worth? Strictly, no. Institutions do not have wills; only individuals do. Attributing moral worth to Effective Altruism as a whole is a category error. However, functionally, movements cultivate norms that shape individual wills. If the movement's norms incentivize motive laundering—rewarding the appearance of altruism over the reality of integrity—then it facilitates unworthy acts.

  I am guessing here that the public argument has been a category error. We blamed the movement for the individual's fraud, or the individual for the movement's culture. The theory suggests we should blame the individual for their maxim, and judge the movement only by whether it encourages maxims that treat people as means. The FTX mess shows that when a movement allows the vocabulary of the good to be detached from the motives of the good, it invites laundering. The theory holds up, but it offers little comfort: it tells us the good done was real, the giver was unworthy, and the movement was merely the stage.
