answer: |-
  There is no single, universally codified term in the philosophy of history or environmental studies that captures this *exact* asymmetry in the way you have described it. However, your observation identifies a well-documented rhetorical and explanatory bias that sits at the intersection of **disaster studies**, **environmental history**, and **actor-network theory (ANT)**.

  While there is no "Gravity" equivalent for this phenomenon, the closest established concepts are **"The Naturalization of Disaster"** (from critical disaster studies) and **"Asymmetric Actancy"** (a deviation from Actor-Network Theory).

  Below is a breakdown of the existing frameworks that address this, a proposed precise definition for the phenomenon, its distinction from determinism, and criteria for distinguishing warranted attribution from narrative convenience.

  ### 1. Existing Conceptual Frameworks

  While no single noun phrase dominates the literature, three fields analyze components of this bias:

  **A. The "Hazard vs. Disaster" Distinction (Disaster Risk Reduction)**
  In disaster studies (e.g., the work of Ben Wisner, Kenneth Hewitt), a crucial distinction is made between a **hazard** (the physical event, e.g., an earthquake) and a **disaster** (the social outcome, e.g., mass homelessness).
  *   **The Bias:** When a disaster occurs, narratives often conflate the hazard with the disaster, treating the physical event as the sole cause ("The earthquake destroyed the city"). When the same hazard strikes a resilient society and causes little damage, the hazard is treated as a mere background condition ("The city withstood the earthquake").
  *   **The Term:** This is often critiqued as **"The Natural Disaster Myth"** or **"The Naturalization of Disaster."** It describes the error of attributing social outcomes (disaster) purely to physical causes (hazard), ignoring the mediating variable of vulnerability.

  **B. Critiques of "Collapse Narratives" (Environmental History/Archaeology)**
  Scholars like Patricia McAnany and Norman Yoffee (*Questioning Collapse*) critique the tendency to attribute societal failure to environmental factors (drought, soil exhaustion) while attributing societal success to human ingenuity.
  *   **The Bias:** Environmental factors are granted **causal salience** only in negative outcomes.
  *   **The Term:** This is frequently discussed under **"Environmental Reductionism"** or **"Collapse Bias,"** though these terms are broader than your specific observation about agency shifting.

  **C. Actor-Network Theory (ANT)**
  ANT argues for **"Generalized Symmetry,"** meaning human and non-human entities (actants) should be analyzed with the same conceptual framework.
  *   **The Bias:** Your observation describes a violation of this symmetry. Non-humans are granted "actancy" (the capacity to act) only when they disrupt the network, but are rendered passive "substrate" when the network holds.
  *   **The Term:** There is no standard term for this violation, but it could be precisely described as **"Outcome-Dependent Actancy."**

  ### 2. Proposed Definition and Terminology

  Given the lack of a single canonical term, the most precise label for the phenomenon you describe is **"Outcome-Dependent Environmental Agency" (ODEA)**.

  **Definition:**
  > **Outcome-Dependent Environmental Agency** is an explanatory asymmetry in historical narrative wherein non-human forces (pathogens, climate, geology) are assigned autonomous causal power (agency) when historical outcomes are disruptive (collapse, famine, unrest), but are downgraded to passive background conditions when outcomes are stable (continuity, adaptation, recovery).

  **How it differs from Environmental Determinism:**
  *   **Environmental Determinism** posits a *consistent* causal relationship: The environment shapes society regardless of the outcome (e.g., "Tropical climates always produce hierarchical societies"). It is a universal law claim.
  *   **ODEA** is a *contingent* rhetorical move. It does not claim the environment *always* drives history; it claims the environment drives history *specifically when things go wrong*. It is a post-hoc attribution strategy rather than a predictive model.
  *   **Boundary Condition:** Determinism fails if a society thrives in a "hostile" environment. ODEA survives this by simply shifting the explanation to "culture" for the thriving society, thereby insulating the environmental explanation from falsification.

  ### 3. Distinguishing Genuine Causation from Narrative Convenience

  To distinguish cases where non-human forces genuinely possessed causal priority from cases of ODEA, historians and scientists must apply specific criteria. The presence of a stressor alone is insufficient evidence of agency.

  **Criterion 1: The Threshold of Adaptive Capacity**
  *   **Warranted Attribution:** The environmental shock exceeds the known physiological or technological adaptive range of *any* contemporary society (e.g., a volcanic winter dropping global temperatures by 5°C for a decade).
  *   **ODEA Indicator:** The shock is within the range that comparable contemporary societies successfully managed. If Society A collapses due to drought, but Society B (with similar technology) survives the same drought, the drought is likely not the primary agent; the difference lies in vulnerability.

  **Criterion 2: Synchronicity and Scope**
  *   **Warranted Attribution:** The outcome correlates geographically with the environmental force across political/cultural boundaries (e.g., the Plague of Justinian affecting both the Byzantine and Sassanid empires).
  *   **ODEA Indicator:** The "collapse" is isolated to a specific political entity while neighbors remain stable despite sharing the same environmental basin. This suggests the "agent" was actually internal political fragility, with the environment serving as a trigger rather than a driver.

  **Criterion 3: Mechanism Specificity**
  *   **Warranted Attribution:** There is a direct, unmediated mechanistic link between the force and the outcome (e.g., pathogen mortality rates directly reducing labor supply).
  *   **ODEA Indicator:** The link relies on a "black box" of social mediation (e.g., "drought caused revolution"). If the narrative skips *how* the drought translated to unrest (e.g., did the state fail to distribute grain? did elites hoard?), it is likely assigning agency to the drought to obscure political failure.

  **Criterion 4: Counterfactual Robustness**
  *   **Warranted Attribution:** The outcome would likely have occurred regardless of minor variations in political leadership or institutional structure.
  *   **ODEA Indicator:** Small changes in policy (e.g., releasing grain reserves) would have negated the crisis. If the outcome was preventable by human action, assigning primary agency to the environment is a form of **exculpatory determinism** (absolving human actors of responsibility).

  ### 4. Why This Bias Persists (The Function of ODEA)

  Understanding *why* historians and writers use Outcome-Dependent Environmental Agency helps identify it in the wild:

  1.  **Narrative Economy:** It is simpler to write "The Volcano Destroyed the Civilization" than to explain the complex socio-political vulnerabilities that made the civilization susceptible to the volcano.
  2.  **Exculpatory Function:** Attributing collapse to pathogens or climate absolves political leaders and institutions of failure. Conversely, attributing stability to "wise institutions" reinforces national or cultural myths of exceptionalism.
  3.  **Dramatic Tension:** Crisis narratives require a villain. A pathogen or climate shift serves as a dramatic antagonist more effectively than "slow institutional decay."

  ### Summary Recommendation

  If you are writing about this or analyzing texts, you should use the term **"Outcome-Dependent Environmental Agency"** (or **"Asymmetric Environmental Actancy"**).

  To identify it, look for the **"Vanishing Mediator"**: When the outcome is crisis, the environment is the subject of the sentence ("The drought caused..."). When the outcome is stability, the environment disappears, and human institutions become the subject ("The government managed..."). This grammatical shift reveals the underlying bias.

  **Warranted Attribution Checklist:**
  1.  Did the stressor exceed regional adaptive norms?
  2.  Did it affect multiple distinct political systems simultaneously?
  3.  Is the mechanism direct (physiological/physical) rather than mediated (political/economic)?
  4.  Does the explanation survive the counterfactual: "Would a better government have prevented this?" (If yes, the environment is not the primary agent).

  This framework allows you to move beyond the binary of "Determinism vs. Agency" and critique the *inconsistency* of how agency is assigned in historical narrative.
