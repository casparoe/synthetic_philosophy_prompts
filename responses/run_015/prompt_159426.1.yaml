answer: |-
  You have identified a genuine fault line in the architecture of rationality. The literature does not have a single, settled name for the *whole* pattern you describe, because it straddles epistemology, ethics, and philosophy of action. However, the pieces are well-mapped.

  The umbrella term for the debate you are entering is **The Right Kind of Reasons (RKRR) Problem**.
  The specific structural feature you are isolating is **Performativity** (or **Reflexivity**).

  Here is the map you asked for, carved along the distinctions you need.

  ### 1. The Core Distinction: Epistemic vs. Practical Attitudes

  The reason belief feels "sealed" while trust and hope feel "porous" is that they have different **constitutive aims**.

  *   **Belief is Epistemic:** Its constitutive aim is *Truth*. A belief is correct if and only if its content matches the world. Because the world is (mostly) independent of the belief, reasons for belief must be evidence of that match. Pragmatic benefits (bribes, comfort) are "State-Given Reasons" (reasons to *have* the belief) rather than "Object-Given Reasons" (reasons the content is *true*). In the RKRR literature, State-Given Reasons are typically ruled out as the "Wrong Kind" for belief.
  *   **Trust/Hope/Intention are Practical:** Their constitutive aim is *Success* or *Realization*. Trust aims at a cooperative relationship; hope aims at a pursued possibility; intention aims at an action. Because these attitudes are designed to *change* the world (or a relationship), the consequences of holding them are relevant to their correctness.

  **The Label:** When you justify an attitude by its capacity to bring about its own content, you are offering a **Performative Justification**.

  ### 2. Carving Your Four Distinctions

  Here is how the literature (and the logic) separates the cases you find intuitively distinct.

  #### A. Capacity vs. Creation (Elicitation vs. Causation)
  *   **The Case:** Trusting a student elicits reliability; believing in a placebo causes recovery.
  *   **The Carving:** This is the distinction between **Recognition** and **Mechanism**.
      *   **Trust (Recognition):** Trust is a *recognitive attitude* (a term from Hegel/Brandom). It treats the other as an agent. By trusting, you confer a status ("reliable person") which the other agent can choose to accept or reject. The loop requires *uptake* by another will. The "reason" works because it respects the other's agency.
      *   **Placebo (Mechanism):** The placebo effect is a causal mechanism within a single organism. There is no agency being recognized.
      *   **Why it matters:** Trust is morally porous; Placebo is causally porous. You can be *blamed* for withholding trust (a moral failure); you are not blamed for withholding belief in a placebo (a causal miscalculation). The "reason" to trust is normative; the "reason" to believe in the placebo is instrumental.

  #### B. Individual vs. Collective (Coordination Equilibria)
  *   **The Case:** My belief doesn't save the bank; everyone's belief does.
  *   **The Carving:** This is **Game-Theoretic Reflexivity**.
      *   This belongs to a different phenomenon than individual trust. It is not about the *merit* of the attitude, but the **conditions of satisfaction**.
      *   In a bank run, the proposition "The bank is solvent" is true *if and only if* it is commonly believed to be true. This is a **Self-Verifying Proposition**.
      *   **Distinction:** In the trust case, the attitude changes the *probability* of the outcome. In the bank case, the attitude changes the *truth conditions* of the proposition itself.
      *   **Edge:** This is the domain of **Common Knowledge** and **Coordination Games**. It is "porous" not because of normativity, but because of ontology (social facts are constituted by belief).

  #### C. Intention and Triviality
  *   **The Case:** Intention makes action likelier. Why isn't intending trivially self-supporting?
  *   **The Carving:** **Constitutive vs. Consequential.**
      *   Intention does not make action likelier as an *external consequence* (like taking a pill makes recovery likelier). Intention is *constitutive* of action. You cannot separate the intention from the initiation of the act.
      *   **Why it's not trivial:** You cannot justify an intention merely by saying "intending makes me do it." You must justify it by saying "doing it is *good*."
      *   **The Rule:** For practical attitudes (intention, hope), the *consequences* of the attitude are admissible reasons only if they align with the *value of the content*.
      *   *Example:* "I intend to rob the bank because intending makes me likely to succeed" is invalid. "I intend to rob the bank because I need the money" is the valid structure. The "success" of the intention is not the *reason* for the intention; the *value of the outcome* is.

  #### D. The Looping Worry (Benign vs. Vicious Circularity)
  *   **The Case:** If the attitude creates the truth, is it merited?
  *   **The Carving:** **Vicious Circularity (Bribe)** vs. **Benign Circularity (Trust).**
      *   **Vicious (Bribe):** The reason bypasses the standard of correctness. The bribe gives you a reason to *hold* the belief, but no reason to think the belief is *true*. It severs the link between attitude and world.
      *   **Benign (Trust):** The reason *satisfies* the standard of correctness through the loop. Trust aims at a reliable relationship. By trusting, you create a reliable relationship. Therefore, the trust is vindicated by the world it created. The loop *closes the gap* between attitude and world rather than bypassing it.
      *   **The Test:** Does the attitude *track* a value, or does it *manufacture* a fact? Trust tracks the value of cooperation. Bribes manufacture a mental state without tracking truth.

  ### 3. The Edges: A Porosity Map

  You asked what predicts the difference between sealed and porous attitudes. The predictor is **Agency Dependence**.

  | Attitude | Porosity | Why? | Domain |
  | :--- | :--- | :--- | :--- |
  | **Perception** | **Sealed** | Passive reception. Cannot change the object by seeing it. | Epistemic |
  | **Belief** | **Sealed** | Aims at independent truth. Pragmatic reasons are "Wrong Kind." | Epistemic |
  | **Hope** | **Porous** | Aims at a future possibility. Hope sustains the effort required to realize it. | Practical |
  | **Trust** | **Highly Porous** | Aims at a relationship. Requires another agent's uptake to succeed. | Social/Practical |
  | **Intention** | **Constitutive** | Is the start of the action. Justified by the action's value, not the intending. | Volitional |
  | **Social Facts** | **Ontologically Porous** | Money, Borders, Solvency. Exist *only* because we believe they do. | Institutional |

  **The Rule of Thumb:**
  If the content of the attitude refers to a **mind-independent fact** (sky color, bank solvency *prior* to runs), the attitude is sealed.
  If the content of the attitude refers to a **mind-dependent fact** (relationship quality, future effort, social status), the attitude is porous.

  ### 4. Coining the Term

  There is no single term that captures the *normative permission* to hold an attitude because it brings about its own truth. "Self-Fulfilling Prophecy" describes the mechanism, not the justification. "Pragmatic Encroachment" describes stakes affecting knowledge, not this loop.

  I propose you call this **Reflexive Merit**.

  **Definition:** An attitude has *Reflexive Merit* when the normative justification for holding the attitude includes the fact that holding the attitude increases the likelihood of the attitude's content being true, *provided* that the content is a value worth realizing.

  **Inside the boundary (Reflexive Merit applies):**
  *   Trusting a student (creates reliability).
  *   Hoping for a difficult goal (sustains effort).
  *   Committing to a partner (creates stability).

  **Outside the boundary (Reflexive Merit fails):**
  *   Believing the sky is green for a bribe (Content is not a value; bypasses truth).
  *   Believing a false mathematical proof because it makes you happy (Content is mind-independent).
  *   Intending to do evil because intending ensures action (Content is not a value).

  ### Summary of the Map

  1.  **The Phenomenon:** Justifying attitudes by their causal efficacy.
  2.  **The Literature Home:** The **Right Kind of Reasons** debate (State-Given vs. Object-Given).
  3.  **The Mechanism:** **Performativity** (Austin/Searle) and **Recognition** (Hegel/Brandom).
  4.  **The Distinction:** **Epistemic Attitudes** (sealed, aim at truth) vs. **Practical Attitudes** (porous, aim at realization).
  5.  **The Constraint:** Reflexive justification is only valid if the content is **Agentially Malleable** (can be changed by us) and **Normatively Valuable** (worth bringing about).
  6.  **The Name:** **Reflexive Merit**.

  The "corrupt" cases fail because they try to apply Reflexive Merit to Epistemic Attitudes or to contents that are not Agentially Malleable. The "exemplary" cases succeed because they apply Reflexive Merit to Practical Attitudes where the loop *constitutes* the good being sought.
