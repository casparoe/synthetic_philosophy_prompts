      *   **Causal-Role Account (Cummins):** Function = Causal Contribution (CR). What does this trait do *now* that contributes to a containing system's capacity? Heart pumps blood (and maybe filters waste) because that helps the organism survive *now*.
      *   **User's "Twist":** Modular organisms (fungi, clonal plants). Modules change roles over time (absorption -> storage -> scaffolding -> recycling).
      *   **The Tension:** SE says "absorption" (historical selection). CR says "storage/scaffolding" (current contribution). User calls this "function lag."
