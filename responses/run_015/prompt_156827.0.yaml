  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge their background. It's a strong position (empirical grounding). Validate the topic (function in biology is a core debate).
      *   **Point 1: Accuracy of Summary:**
          *   *Wright/SE:* Generally accurate. Focus on history/selection.
          *   *Cummins/CR:* Mostly accurate, but needs a nuance check. Cummins focuses on *capacities* of the containing system. If the heart filters waste, and that contributes to the organism's capacity to survive, it's a function.
