prompt: |-
  I'm an undergraduate taking a course on moral responsibility, and I'm leading a fifty-minute tutorial for first-year philosophy students on moral luck—specifically, whether agents can be properly blamed or praised for outcomes that turn on factors outside their control. Rather than the standard drunk-driver comparison, I want the session to carry on a single case: two marine biologists with identical training and identical negligent protocols deploy tracking nets in the same region; an unforeseeable current pattern saves an endangered population in one case and destroys it in the other, so one is celebrated and the other professionally ruined despite matching agency.

  Plan the explanatory arc for me, not the explanation itself. What conceptual piece must be in place before moral luck even registers as a problem rather than a platitude—likely the control principle, but show where it belongs in the sequence? Then specify the order in which to introduce the distinctions among constitutive, circumstantial, causal, and resultant luck, and why that dependency order holds. For the net case, say exactly what it must include (identical agency, identical reasoning, divergent outcomes driven by an external causal chain) and what it must lack (differences in character, knowledge, or effort that would let students retreat to a merit-based explanation). Map the predictable misconceptions onto the sequence: I expect they will start with "luck is just low probability," then slide to "if the outcome wasn't in her control she can't be blamed at all," and finally to "the two biologists are the same person in different worlds so they must deserve the same treatment"—tell me precisely where in the arc to head off each, and what question to ask at the end that tests whether they've grasped the tension with the control principle rather than just feeling sympathy for the ruined scientist. Also tell me what machinery I should explicitly refuse to open—perhaps the full taxonomy of moral luck responses, or the debate over whether moral luck can be dissolved by refining the assessment conditions on actions versus agents—and state that refusal openly.

  Finally, separate what is settled from what genuinely contested among people who know the topic: for example, whether moral luck is pervasive and ineliminable, or whether a properly refined control principle eliminates the appearance of luck altogether. Do not present either position as the consensus.
reasoning: |-
  Here's a thinking process that leads to the suggested tutorial plan:

  1.  **Analyze the Request:**
      *   **Target Audience:** First-year philosophy undergraduates.
      *   **Instructor:** Undergraduate leading a 50-minute tutorial.
      *   **Topic:** Moral Luck (specifically resultant luck).
      *   **Case Study:** Two marine biologists, identical negligence, divergent outcomes due to unforeseeable currents (endangered population saved vs. destroyed). *Not* the standard drunk driver case.
      *   **Deliverable:** An *explanatory arc* (sequence/structure), not the full script/explanation.
      *   **Key Requirements:**
          *   Identify the prerequisite concept (Control Principle) and its placement.
          *   Order the four types of luck (constitutive, circumstantial, causal, resultant) and justify the order.
          *   Specify constraints on the case study (what it must include/exclude).
          *   Map misconceptions to specific points in the arc and provide intervention questions.
          *   Define a final assessment question.
          *   Specify what *not* to cover (scope limitations).
          *   Distinguish settled vs. contested claims in the literature (without claiming consensus).

  2.  **Deconstruct the Explanatory Arc:**
      *   *Goal:* Move students from intuition -> principle -> counterexample -> taxonomy -> tension.
      *   *Prerequisite:* The Control Principle (CP). This *must* come first. Without CP, moral luck isn't a problem; it's just how things happen. CP creates the tension.
      *   *Case Introduction:* Introduce the biologists early to ground the abstract CP.
      *   *Taxonomy Order:* Nagel's four types. Which order makes sense for freshmen?
          *   Resultant luck is the most intuitive (outcomes).
          *   Circumstantial is next (situations).
          *   Constitutive is deeper (who you are).
          *   Causal is often the background.
          *   *Decision:* Start with Resultant (the case study), then broaden to Circumstantial/Constitutive to show the problem is deeper than just outcomes. This creates a "widening the lens" effect.
      *   *Misconceptions:*
          1.  "Luck = Low Probability." (Need to address early).
          2.  "No Control = No Blame." (The hard determinism/absolutist slide).
          3.  "Same Person = Same Treatment." (The intuition pump).
      *   *Scope Limit:* Don't solve it. Don't dive into "action vs. agent" or full defensive strategies (skeptical, denial, etc.). Keep it focused on the *existence* of the tension.
      *   *Settled vs. Contested:* Need to be careful here. Nothing is truly "settled" in philosophy, but some things are agreed upon as *the problem statement* vs. *the solution*.

  3.  **Drafting the Plan - Section by Section:**

      *   **Phase 1: The Anchor (Control Principle).**
          *   Must happen before the case creates confusion.
          *   Define it simply: Moral assessment requires control.
          *   *Placement:* Minutes 0-10.

      *   **Phase 2: The Case (The Biologists).**
          *   Needs strict constraints. Identical internal states, divergent external causes.
          *   *Placement:* Minutes 10-20.
          *   *Misconception Check:* "Luck is just probability." Need to clarify luck as *lack of control*, not just rarity.

      *   **Phase 3: The Taxonomy (Nagel's Types).**
          *   Order: Resultant -> Circumstantial -> Constitutive. (Causal is often subsumed or treated as the mechanism). Let's stick to Nagel's standard four but prioritize Resultant since that's the case.
          *   *Why this order?* Resultant is the hook. Constitutive is the hard pill to swallow (do you control your genes?).
          *   *Placement:* Minutes 20-35.
          *   *Misconception Check:* "If no control, no blame." (The nihilism slide). Need to show we *do* blame, hence the paradox.

      *   **Phase 4: The Tension & Assessment.**
          *   Bring it back to the CP.
          *   Final Question: Needs to test the *conflict*, not just sympathy.
          *   *Placement:* Minutes 35-50.

      *   **Scope Limitations:**
          *   Explicitly exclude: Solutions (Wolf, Williams, etc.), Action vs. Agent distinction deep dive.

      *   **Settled vs. Contested:**
          *   Settled: The definition of the problem, the existence of the intuition conflict.
          *   Contested: Whether CP is true, whether luck is eliminable.

  4.  **Refining the Details (Self-Correction during drafting):**
      *   *Correction on Taxonomy:* The prompt asks for specific order justification. Resultant luck is the *problem* in the case. Constitutive is the *deep* problem. I should introduce Resultant first (via the case), then introduce the others to show Resultant isn't an anomaly.
      *   *Correction on Misconceptions:* The prompt lists three specific misconceptions. I need to place them precisely.
          1.  "Luck = Probability": Address when defining luck in the case setup.
          2.  "No Control = No Blame": Address when they try to resolve the tension too easily.
          3.  "Same Person = Same Treatment": Address when comparing the two biologists.
      *   *Correction on Scope:* The prompt asks me to state the refusal openly. I need to write that into the plan instructions.

  5.  **Final Review against Constraints:**
      *   50-minute tutorial? Yes, timing included.
      *   Marine Biologist case? Yes.
      *   Control Principle placement? First.
      *   Taxonomy order justified? Yes.
      *   Misconceptions mapped? Yes.
      *   Final question specified? Yes.
      *   Exclusions stated? Yes.
      *   Settled vs. Contested distinguished? Yes.

  6.  **Final Polish:** Ensure tone is instructional and structured for a tutorial leader. (Proceed to generate output).

  *(Self-Correction on "Settled" claims)*: I must be careful not to say anything is *philosophically* settled. I should frame "settled" as "agreed upon terms of the debate" vs "disagreed upon resolutions."

  *(Self-Correction on Taxonomy)*: Nagel's four are Resultant, Circumstantial, Constitutive, Causal. Causal luck is often the umbrella. I will sequence them: Resultant (the case) -> Circumstantial (the situation) -> Constitutive (the self). Causal underpins all. I will group Causal with Resultant for simplicity or treat it as the mechanism. Let's follow Nagel's standard distinction but prioritize Resultant.

  *(Final check on the Final Question)*: It must test the tension with the Control Principle. "How can we hold the CP and our practice of blame simultaneously?" is the core.

  Let's assemble the plan.cw
answer: |-
  Here is the explanatory arc for your fifty-minute tutorial. It is structured to build the paradox incrementally, ensuring students feel the tension before you name it.

  ### I. The Prerequisite: The Control Principle (Minutes 0–10)
  **Placement:** This must be the very first conceptual block. You cannot establish moral luck as a *problem* until students accept the principle that luck supposedly violates.

  *   **Concept:** Define the **Control Principle (CP)**: *Agents are morally assessable only for what is within their control.*
  *   **Function:** Establish this as the "pre-theoretical intuition" or the default setting of moral reasoning.
  *   **Instruction:** Do not argue for it yet; simply elicit it. Ask students, "Why is it unfair to blame someone for a sneeze?" The answer ("They couldn't help it") reveals the CP.
  *   **Why here?** If you introduce the case first, students will argue about the outcome. If you introduce the CP first, they have a metric to measure the case against.

  ### II. The Case Study: The Marine Biologists (Minutes 10–20)
  **Placement:** Introduce immediately after the CP to test its limits.

  *   **Required Inclusions:**
      *   **Identical Agency:** Both biologists must have the exact same training, intent, and level of negligence (e.g., both skipped the same safety check).
      *   **Identical Reasoning:** Both must believe, with equal justification, that the risk is negligible.
      *   **Divergent Outcomes:** Biologist A's nets trap and kill the endangered population; Biologist B's nets miss them entirely.
      *   **External Causal Chain:** The divergence must be caused solely by the unforeseeable current pattern (a factor external to their agency).
  *   **Required Exclusions:**
      *   **No Character Differences:** Do not suggest one was more careless in the past.
      *   **No Knowledge Asymmetry:** Do not allow one to have had access to a weather report the other missed.
      *   **No Effort Variance:** Both must have exerted the exact same effort in deployment.
  *   **Misconception Intervention #1 ("Luck is just low probability"):**
      *   *When:* As soon as students describe the current as "unlikely."
      *   *Correction:* Clarify that in this context, luck is not about statistical rarity, but about **lack of control**. A probable outcome outside your control is still luck; an improbable outcome you controlled is not.
      *   *Question to ask:* "If the current pattern happened every day (100% probability), but neither biologist knew about it, does that change who is in control?"

  ### III. The Taxonomy of Luck (Minutes 20–35)
  **Placement:** Once the tension in the case is felt, broaden the scope using Nagel's taxonomy. This shows the biologist case isn't an anomaly but part of a structural issue.

  *   **Order of Introduction:**
      1.  **Resultant Luck (The Case):** Start here. It is the most intuitive (luck in how things turn out). This matches the biologist case.
      2.  **Circumstantial Luck:** Move to luck in the circumstances one faces (e.g., living in a time where negligence is tested vs. not tested).
      3.  **Constitutive Luck:** End here. Luck in who you are (temperament, genetics, predisposition to negligence).
      4.  *(Note on Causal Luck):* Treat Causal Luck as the underlying mechanism for the first three (the prior causes determining the result, circumstance, or constitution). Do not treat it as a separate fourth category in the sequence to avoid confusion; frame it as the background condition.
  *   **Justification for Order:**
      *   You move from **External** (Resultant) to **Situational** (Circumstantial) to **Internal** (Constitutive).
      *   This sequence tightens the vise. Students can easily dismiss Resultant luck as "irrelevant to character." By the time you reach Constitutive luck, they realize that if they reject moral luck, they might have to reject moral assessment entirely, because *nothing* is fully within control.
  *   **Misconception Intervention #2 ("If outcome wasn't controlled, she can't be blamed at all"):**
      *   *When:* During the Resultant/Circumstantial discussion. Students will try to solve the paradox by absolving the "ruined" biologist entirely.
      *   *Correction:* Point out that this violates our actual moral practices. We *do* blame the biologist who killed the fish more than the one who didn't. The problem isn't that we *shouldn't* blame; it's that our blaming contradicts the CP.
      *   *Question to ask:* "If you say she deserves zero blame because of the current, are you saying her negligence doesn't matter? Or just that the outcome doesn't?"

  ### IV. The Tension and Assessment (Minutes 35–50)
  **Placement:** Synthesize the CP and the Taxonomy to force a confrontation.

  *   **Misconception Intervention #3 ("They are the same person in different worlds, so they deserve the same treatment"):**
      *   *When:* In the final comparison. Students will argue from identity to moral equality.
      *   *Correction:* Acknowledge the logic but highlight the cost. If they deserve the same treatment, then outcomes are morally irrelevant. If outcomes are morally irrelevant, why do we punish attempted crimes differently from completed ones?
      *   *Question to ask:* "If we treat them identically, what work is the 'harm' doing in our moral vocabulary? If we treat them differently, how do we defend the Control Principle?"
  *   **Scope Limitations (Explicit Refusal):**
      *   **State this openly:** "We are not going to solve this today. We are not going to discuss whether we should judge *actions* vs. *agents*, nor will we look at the full list of philosophical responses (skepticism, denial, etc.). We are stopping at the realization that our principles and our practices contradict."
  *   **Final Assessment Question:**
      *   Do not ask: "Who do you sympathize with?" (This tests emotion).
      *   **Ask this:** "Given that both biologists exercised the exact same degree of control, explain how one can be more blameworthy than the other *without* abandoning the Control Principle. If you cannot, which must go: the Principle or the Blame?"

  ### V. Settled vs. Contested Claims (Instructor Reference)
  *Use this to frame your closing remarks or answer questions without taking a side.*

  **Settled (The Terms of the Debate):**
  *   **The Definition:** There is agreement on what "moral luck" refers to (significant aspects of moral status dependent on factors outside the agent's control).
  *   **The Conflict:** It is agreed that there is a conflict between the Control Principle and our actual practices of moral assessment (we *do* treat the biologists differently).
  *   **The Pervasiveness:** It is generally accepted that if moral luck exists in resultant cases (the biologists), it likely extends to constitutive cases (personality), making the problem hard to isolate.

  **Contested (The Resolutions):**
  *   **The Validity of the Control Principle:** Some argue the CP is false (we *should* accept moral luck); others argue it is the bedrock of morality and must be preserved.
  *   **Eliminability:** It is contested whether a refined view of "control" (e.g., controlling the *risk* rather than the *outcome*) eliminates the problem or merely hides it.
  *   **Agent vs. Action:** It is disputed whether moral luck applies to the *worth of the agent* or only the *assessment of the act*, and whether that distinction saves the Control Principle.

  **Instruction:** Do not present the "CP is false" view or the "Luck is an illusion" view as the winner. Present them as the two horns of the dilemma the students have just uncovered.
