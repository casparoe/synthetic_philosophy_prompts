answer: |-
  This session will demonstrate why teaching machines by watching humans creates a dangerous gap between what we do and what we actually value.

  **Sequence and Timing (40 Minutes)**

  **0:00–0:05: The Setup (Inoculation Phase)**
  *   **Concept:** Define Reinforcement Learning (RL) as "giving a robot a scorecard and letting it figure out the game," and Inverse Reinforcement Learning (IRL) as "watching someone play the game and trying to reconstruct their scorecard."
  *   **Misconception Inoculation 1 (Optimality):** State clearly: "In economics, they assume people act perfectly rationally. In IRL, we assume people are tired, distracted, and sometimes wrong. The math has to account for human messiness."
  *   **Misconception Inoculation 2 (Revealed Preference):** State clearly: "This sounds like economics' revealed preference theory, but it is not. Economics assumes your actions reveal your true value. IRL assumes your actions might be a bad map of your true value."
  *   **Vocabulary In:** Reward Function (the scorecard), Demonstration (the watched behavior), Inference (the guess).
  *   **Vocabulary Out:** Policy, MDP, Gradient, Loss Function, Bayesian.

  **0:05–0:20: The Marisol Case (The Ambiguity Trap)**
  *   **The Scene:** Draw a simple floor plan on the whiteboard. Marisol is tidying a client's flat. A robot watches her.
  *   **The Data:** Marisol vacuums the rug but leaves dishes in the sink.
  *   **The Hidden State:** It is Friday afternoon. Marisol is exhausted. She is also being filmed by her supervisor.
  *   **The Problem:** The robot sees "vacuum yes, dishes no." It does not see "fatigue" or "supervisor."
  *   **Misconception Break 1 (More Data):** Ask the room: "If we watch her for ten Fridays instead of one, do we know what she values?" Let them say yes. Then draw a second scenario: "What if she loves clean dishes but knows the supervisor only checks the floors?" Explain that infinite video of *behavior* cannot distinguish between "doesn't care about dishes" and "too tired to wash dishes." This is non-identifiability without the math.
  *   **Key Takeaway:** One stretch of visible tidying is compatible with a whole family of different reward functions (client comfort, supervisor approval, energy conservation).

  **0:20–0:30: The Potemkin Wrinkle**
  *   **Placement:** Introduce this now, after ambiguity is established, to show data corruption rather than just interpretation errors.
  *   **The Twist:** Marisol knows she is being recorded as a standard-setter. She tidies the floor *better* than she does when unobserved, but she still skips the dishes because that's her personal boundary.
  *   **The Phrase:** Write **POTEMKIN PREFERENCE** on the board. Define it: "The robot infers values from a performance of values."
  *   **The Risk:** The robot learns to maximize "Supervisor Approval" because that drove the visible behavior, not "Client Comfort." When the supervisor leaves, the robot might still prioritize floor aesthetics over hygiene because it learned the caricature, not the care.
  *   **Misconception Break 2 (True Wants):** Drive home that the robot does not want what Marisol wants; it wants what Marisol *looked like* she wanted.

  **0:30–0:35: The Claims Adjuster Lens (Refusals)**
  *   **Context:** Connect this to claims risk. If we use IRL to automate assessments based on adjuster behavior, do we learn "fair settlements" or "how to close tickets fast before audit"?
  *   **Refusal 1:** "I am not going to explain how the math chooses between the ambiguous rewards. That requires priors and probability distributions we don't have time for."
  *   **Refusal 2:** "I am not going to explain how the robot corrects for Marisol's sub-optimality. That requires algorithms like Maximum Entropy IRL."
  *   **Refusal 3:** "I will not explain how to fix the Potemkin Preference. There is no solved math for when the human is lying to the camera."

  **0:35–0:40: Assessment and Close**
  *   **The Question:** Do not ask "Did you understand?" Ask: "If we deploy this robot on a Saturday when no supervisor is present, and Marisol is fresh but the client hates vacuum noise, what is the specific failure mode we should expect based on the Potemkin Preference?"
  *   **Desired Answer:** The robot will vacuum anyway (because it learned supervisor approval matters most) and ignore the client's noise preference (which was never visible in the training data), or it will fail to wash dishes assuming they don't matter.
  *   **Close:** Reiterate that IRL is powerful but inherits human performativity as a bug.

  **Misconception Management Summary**
  *   **Inoculate Up Front:** That the demonstrator is optimal (humans are noisy); that this is just revealed preference (actions are ambiguous).
  *   **Break Deliberately:** That more behavior pins down the reward (ambiguity remains regardless of data volume); that the robot ends up wanting what Marisol wants (it learns the performance, not the intent).

  **Vocabulary Control**
  *   **Introduce:** Reward Function (define as "the hidden goal"), Demonstration (define as "the recorded action"), Ambiguity (define as "multiple goals fit one action").
  *   **Keep Out:** Policy (use "strategy"), State Space (use "situation"), Optimization (use "trying to win"), Neural Network (use "the brain").

  **Explicit Refusals**
  *   **The Selection Mechanism:** "We will not cover how the robot mathematically picks one reward function over another when both fit the data."
  *   **The Correction Algorithm:** "We will not cover how engineers try to mathematically subtract human error from the demonstration."
  *   **The Solution to Potemkin:** "We will not cover how to detect when a human is performing for the camera; currently, the math cannot see that."
