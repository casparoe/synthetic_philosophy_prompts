answer: |-
  # RFC: Indexical Credence Update Interface (ICUI-1)

  **Status:** Draft  
  **Audience:** Bounded Rational Agents, Decision Procedures  
  **Purpose:** Define requirements for a function `update_indexical(prior, hypotheses, self_evidence)` returning a posterior distribution suitable for decision-making in multi-copy environments.

  ## 1. Interface Definition

  ```typescript
  interface Hypothesis {
    world_description: NonIndexicalState;
    observer_measure: (Evidence) -> Real; // Density or count of observers with evidence E
  }

  function update_indexical(
    prior: Map<Hypothesis, Probability>,
    my_evidence: Evidence
  ): Map<Hypothesis, Probability>;
  ```

  **Context:** The agent is one of potentially many instantiations. The output credences will be multiplied by utility functions in a downstream `decide()` routine. The routine must handle cases where `observer_measure` is large, infinite, or computationally inaccessible.

  ## 2. Functional Requirements

  ### 2.1 Core Consistency (MUST)
  *   **REQ-1.1 (Bayesian Reduction):** If all hypotheses imply the exact same number and distribution of observers with `my_evidence`, the function **MUST** reduce to standard Bayesian conditionalization on non-indexical evidence. Indexical logic must not alter probabilities where indexical uncertainty is absent.
  *   **REQ-1.2 (Dutch Book Resistance):** The resulting credences **MUST NOT** lead to a sure-loss betting strategy against a bookie who knows the true hypothesis but not the agent's indexical location, provided the bet structure is clearly defined (per-world vs. per-copy).
  *   **REQ-1.3 (Implementability):** The function **MUST** be computable by an agent with bounded memory and time. It **MUST NOT** require enumerating the total set of observers in the universe if that set is causally disconnected from the agent.

  ### 2.2 Robustness and Stability (SHOULD)
  *   **REQ-2.1 (Invariance under Redescription):** The output **SHOULD** be invariant to arbitrary changes in how "observers" are individuated (e.g., splitting one observer into two temporal slices vs. one continuous slice), provided the physical substrate and evidence remain constant. *Rationale: Prevents probability hacking via ontology definition.*
  *   **REQ-2.2 (Resistance to Astronomical Priors):** The function **SHOULD** resist updating strongly in favor of a hypothesis solely because it postulates a vastly larger number of observers (the "Presumptuous Philosopher" failure mode), unless those observers are causally relevant to the decision.
  *   **REQ-2.3 (Boltzmann Brain Suppression):** The function **SHOULD** assign negligible probability to hypotheses where the majority of observers with `my_evidence` are thermally fluctuated false memories, unless non-indexical evidence compels it.

  ### 2.3 Utility and Information (MAY)
  *   **REQ-3.1 (Informative Output):** The function **MAY** return the prior unchanged if `my_evidence` provides no discriminative power between hypotheses. However, it **SHOULD** generally provide discriminative power in standard self-locating scenarios (e.g., Sleeping Beauty).
  *   **REQ-3.2 (Reference Class Robustness):** The function **MAY** require a reference class parameter. If so, it **MUST** document the sensitivity of the output to this parameter. *Note: True robustness here is likely impossible (see Section 4).*

  ## 3. Test Cases

  ### 3.1 TEST-FORK (Symmetry and Time-Reversal)
  **Setup:**
  *   **Scenario A (Fork):** At $t=0$, 1 subject exists. At $t=1$, subject is silently duplicated. Two copies exist with identical memories up to $t=1$.
  *   **Scenario B (Merge):** At $t=0$, 2 subjects exist with identical memories. At $t=1$, they merge into 1 subject who retains both memory streams.
  **Expectation:**
  *   A correct rule **MUST** specify whether probabilities attach to *observer-moments* or *continuing identities*.
  *   If the rule weights by observer-moments: In Fork, credence in "I am a copy" should shift at $t=1$. In Merge, credence should shift inversely.
  *   **Pass Condition:** The betting odds for an agent at $t=0$ regarding their status at $t=1$ must be consistent across both scenarios. If the rule treats Fork as probability splitting (1/2) but Merge as probability conservation (1), it **FAILS** REQ-2.1 (Invariance).
  *   **Verdict:** Most standard rules (SSA/SIA) fail this. They treat existence as additive but merging as undefined. A passing rule must rely on *measure* (weight) rather than *count*, treating Merge as measure concentration and Fork as measure dilution.

  ### 3.2 TEST-THICK-INDEX (Evidence Granularity)
  **Setup:**
  *   **H1:** Contains 10 observers with evidence $E$.
  *   **H2:** Contains 10 observers with evidence $E$, plus $10^{12}$ observers with evidence $E'$ (where $E'$ differs from $E$ by one bit).
  *   **Agent:** Has evidence $E$.
  **Expectation:**
  *   The function **MUST** condition on total evidence $E$, not a thinner "I exist" predicate.
  *   **Pass Condition:** If the rule conditions on "I exist" (SIA-style), H2 wins overwhelmingly due to total population. If the rule conditions on $E$ (Bayesian), the $10^{12}$ observers in H2 are irrelevant because they don't have $E$.
  *   **Verdict:** A correct rule **MUST** return odds proportional to the count of observers with *exact* evidence $E$. If conditioning on exact evidence renders the indexical update null (likelihood ratio = 1), the rule **MUST** admit it has no indexical leverage, rather than inventing leverage via coarse-graining.

  ### 3.3 TEST-UNENUMERABLE (Computability)
  **Setup:**
  *   **H1:** Finite universe, $10^{10}$ observers.
  *   **H2:** Infinite universe, uncountable observers, but local density of evidence $E$ is identical to H1.
  *   **Constraint:** Agent cannot access global counts, only local samples.
  **Expectation:**
  *   The function **MUST NOT** panic or return `NaN` when faced with infinite cardinalities.
  *   **Pass Condition:** The rule must operate on *densities* or *algorithmic measures* rather than raw counts. If the rule requires $\frac{N_{self}}{N_{total}}$, it **FAILS** REQ-1.3 (Implementability) for H2.
  *   **Verdict:** A correct rule must use a measure theoretic approach (e.g., Solomonoff prior weighting) that converges without full enumeration. If the rule demands a denominator of "all observers," it is unfit for deployment.

  ## 4. Impossibility Notes and Trade-offs

  **Conflict 1: Invariance vs. Resistance to Astronomical Priors**
  You suspected "Informative" vs. "Immune to cheap hypotheses." The deeper conflict is **REQ-2.1 (Invariance)** vs. **REQ-2.2 (Resistance)**.
  *   To be invariant under redescription (counting observers doesn't matter), you must weight by something other than count (e.g., algorithmic complexity).
  *   To resist the Presumptuous Philosopher (H2 wins because it has more observers), you must penalize hypotheses based on observer count.
  *   **Result:** You cannot have both. If you penalize count, you are vulnerable to someone re-describing the world such that the "winning" hypothesis has fewer, "larger" observers. If you ignore count (Invariance), you accept the Presumptuous Philosopher's conclusion.
  *   **Recommendation:** For decision guidance, prioritize **REQ-2.2 (Resistance)**. Accept that "observer count" is a proxy for "causal leverage," and treat astronomical counts as suspicious priors rather than likelihood boosters.

  **Conflict 2: Implementability vs. Well-Definedness (Infinite)**
  *   **REQ-1.3 (Implementability)** conflicts with strict **Well-Definedness** in infinite universes.
  *   **Result:** No rule can be perfectly well-defined for all infinite sets *and* computable by a bounded agent.
  *   **Recommendation:** Prioritize **REQ-1.3**. A rule that returns `NaN` is less useful than a rule that approximates via local density.

  **The Single Exclusionary Requirement**
  **REQ-2.1 (Invariance under Redescription)** excludes the most candidate rules.
  *   **SSA** fails this immediately (depends entirely on how you define the reference class).
  *   **SIA** fails this subtly (depends on how you individuate observer-moments).
  *   Most "hybrid" rules fail this because they introduce arbitrary cutoffs.
  *   Only rules based on fundamental physical measure (e.g., quantum branch weight) stand a chance, but they struggle with REQ-2.2.

  ## 5. Scorecard: SSA vs. SIA

  **Self-Sampling Assumption (SSA):** Passes **REQ-2.2** (Resistance) and **REQ-2.3** (Boltzmann Brains) by restricting the reference class, but hard-fails **REQ-2.1** (Invariance) and **REQ-1.3** (Implementability) because it requires an arbitrary, globally defined reference class that a bounded agent cannot construct. It is stable for decisions but metaphysically brittle. **Self-Indication Assumption (SIA):** Passes **REQ-2.1** (Invariance) and **REQ-1.1** (Bayesian Reduction) by treating "I exist" as data, but hard-fails **REQ-2.2** (Resistance) and **REQ-2.3** (Boltzmann Brains), leading to the "Presumptuous Philosopher" bug where truth is dictated by population count. It is metaphysically smooth but decision-theoretically dangerous. For your purpose (decision guidance in a simulation), SSA is the safer production dependency, provided you hard-code the reference class to "agents capable of executing this decision procedure."
