prompt: |-
  I work as a software engineer, with no philosophy training past the odd blog post, and I came to this topic sideways, through what turned out not to be a bug. My team maintains a large agent-based simulation, and two colleagues were computing the same quantity two different ways — one averaging over simulation runs, one averaging over agent-steps — and getting numbers that differed by orders of magnitude, with no error in either script. The disagreement turned out to be philosophical: whether a sample should be weighted by worlds or by the observers inside them. When I went looking for someone who had argued about this properly, I found the same dispute in cosmology and in reasoning about where one sits among all the observers there are, under the names self-sampling assumption and self-indication assumption. The presumptuous philosopher case, where a hypothesis wins purely by postulating a colossal number of observers, feels to me like the exact failure mode I would file as a bug in my own code.

  So before I read any further, I want the specification rather than the survey. Please write me a requirements list — in the style of an interface spec with test cases — for any rule that updates on indexical evidence. Concretely, imagine a function whose input is a prior over hypotheses, where each hypothesis specifies how many observers or observer-moments of which kinds exist and which of them have evidence like mine, and whose output is a posterior over hypotheses that I can hand to a decision procedure. The purpose I care about is decision guidance: I want credences that a bounded agent can act on, an agent that may be one of many copies, does not know how many copies there are, and has to choose whether to accept a bet whose payoff is per-copy or per-world. If the right list would differ for a different purpose — say, scientific inference about how many observers the universe contains, or evaluating a hypothesis about whether we are in a simulation — say which requirements are purpose-relative.

  Here are the candidate requirements I have collected from arguing with friends, which I want you to sort into genuine desiderata versus the prejudices of one camp, marking each as MUST, SHOULD, or MAY in the RFC sense, with the case or consideration behind it: reduce to ordinary Bayesian conditionalization when the hypotheses differ only in non-indexical respects; invariance under redescription of the population, so that dividing or merging observers does not change the answer by stipulation; symmetry between a process that duplicates a subject and one that merges two subjects with the same resulting memories; robustness to the choice of reference class, or an argument for why no robustness is owed; well-definedness when the population is infinite, unbounded, or of unknown size; implementability by an agent that cannot enumerate observers it could never interact with; resistance to hypotheses that win by postulating astronomically many observers; resistance to domination by the vast number of thermally improbable freak observers a big universe would contain; no betting behavior that guarantees a loss; not letting indexical reasoning overturn strong non-indexical evidence; and still being informative enough to be worth computing at all.

  I would also like three cases I have not seen handled anywhere, worked into the list as tests: the Fork, where every subject is silently duplicated at midnight and the copies are subjectively indistinguishable, run alongside its exact time-reverse, where pairs of subjects are merged and the survivor has both sets of memories — a rule that treats these asymmetrically owes me a reason; the Thick Index, where one hypothesis contains ten observers with my exact total evidence and another contains those same ten plus ten to the twelve observers whose evidence differs from mine in some trivial detail, which should force you to say whether the rule conditions on my total evidence or on something thinner, and what happens if conditioning on total evidence makes the whole exercise empty; and the Unenumerable World, where the rival hypothesis postulates so many observers that no agent inside the world could ever count or sample them, so a rule that needs the full population to compute an answer is not a rule I can ship. For each, tell me what answer a correct rule should give, or explain why the case is ill-posed.

  Finally, flag any pair of requirements you suspect cannot be jointly satisfied — my own guess is that being informative and being immune to cheap hypotheses pull in opposite directions, and that this is where the interesting result is, but I want your judgment on where the impossibility actually lies. Tell me too which single requirement excludes the most candidate rules. Keep the closing scorecard, for the two weightings I named at the start, to one short paragraph; the criteria are what I am paying for.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Software Engineer, no formal philosophy training, pragmatic, thinks in terms of specs, interfaces, test cases, and bugs. Encountered the Self-Sampling Assumption (SSA) vs. Self-Indication Assumption (SIA) debate through a simulation discrepancy.
      *   **Core Task:** Write a "requirements list" (interface spec with test cases) for a rule that updates on indexical evidence (credence assignment for decision guidance).
      *   **Specific Constraints:**
          *   Style: Interface spec / RFC (MUST, SHOULD, MAY).
          *   Content: Sort provided candidate requirements into desiderata vs. prejudices.
          *   New Test Cases: Incorporate "The Fork" (duplication), "The Thick Index" (evidence granularity), and "The Unenumerable World" (computability).
          *   Impossibility Results: Flag conflicting requirements.
          *   Scorecard: Brief comparison of SSA vs. SIA at the end (one paragraph).
      *   **Goal:** Decision guidance for a bounded agent (one of many copies, unknown copy count, per-copy vs. per-world bets).

  2.  **Deconstruct the Candidate Requirements:**
      *   *Reduce to ordinary Bayesian conditionalization:* Essential. If indexicality isn't involved, it should behave normally. (MUST)
      *   *Invariance under redescription:* Crucial for consistency. "Observer" definition shouldn't change probabilities arbitrarily. (MUST)
      *   *Symmetry (Duplicate vs. Merge):* Related to invariance. If physics is reversible (conceptually), the logic should hold. (SHOULD/MUST depending on metaphysics, but logically SHOULD for consistency).
      *   *Robustness to reference class:* This is the heart of the SSA/SIA fight. SSA requires a reference class; SIA tries to avoid it but has its own issues. True robustness is likely impossible. (MAY/SHOULD - likely a trade-off).
      *   *Well-definedness (Infinite/Unbounded):* Critical for cosmology. (MUST).
      *   *Implementability (Bounded Agent):* Crucial for the user's context (software engineer). (MUST).
      *   *Resistance to "Presumptuous Philosopher" (astronomical observers):* SIA fails this. SSA passes. (SHOULD for decision stability).
      *   *Resistance to Boltzmann Brains:* SIA fails badly here. SSA struggles too depending on reference class. (MUST for sanity).
      *   *No Dutch Book (No guaranteed loss):* Fundamental rationality constraint. (MUST).
      *   *Not overturning strong non-indexical evidence:* SIA can do this (Presumptuous Philosopher). (SHOULD).
      *   *Informative:* If it always returns the prior, it's useless. (MUST).

  3.  **Address the New Test Cases:**
      *   *The Fork (Duplication) vs. Time-Reverse (Merge):* SSA treats these differently (centered worlds change). SIA treats them differently (number of observers changes). A truly symmetric rule is hard. *Verdict:* A correct rule should yield consistent betting odds relative to the *agent's* continuation, but metaphysical symmetry might be ill-posed if identity is not conserved in merging.
      *   *The Thick Index:* Conditioning on *exact* evidence vs. *coarse* evidence. If exact, SIA often collapses to SSA (if evidence is unique). If coarse, SIA dominates. *Verdict:* Must condition on total evidence ($E$), not just "I exist".
      *   *The Unenumerable World:* If the rule requires counting $N$ observers, and $N$ is uncomputable, the rule fails implementability. *Verdict:* Rule must rely on local computable measures, not global counts.

  4.  **Identify Impossibility Theorems/Conflicts:**
      *   *SIA vs. Presumptuous Philosopher:* SIA satisfies "Invariance under redescription" (mostly) and "Reduce to Bayesian" but fails "Resistance to astronomical observers."
      *   *SSA vs. Reference Class:* SSA satisfies "Resistance" but fails "Invariance under redescription" (depends on how you slice observers) and "Implementability" (needs reference class definition).
      *   *The Big Conflict:* **Invariance under redescription** vs. **Resistance to astronomical observers**. You generally can't have a rule that ignores how you carve up observers *and* ignores the total number of observers.
      *   *Another Conflict:* **Implementability** vs. **Well-definedness (Infinite)**. If the universe is infinite, counting observers is impossible for a bounded agent.

  5.  **Drafting the Spec (Iterative Process):**
      *   *Tone:* Technical, precise, RFC-style.
      *   *Structure:* Interface Definition, Functional Requirements (MUST/SHOULD/MAY), Test Cases, Impossibility Notes, Scorecard.
      *   *Refining Requirements:*
          *   "Reduce to Bayesian" -> `MUST`.
          *   "Invariance" -> `MUST` (but note the conflict).
          *   "Implementability" -> `MUST` (User is a SW Eng).
          *   "Resistance to Presumptuous Philosopher" -> `SHOULD` (Decision stability).
          *   "No Dutch Book" -> `MUST`.
      *   *Refining Test Cases:*
          *   Fork/Merge: Focus on betting odds consistency.
          *   Thick Index: Focus on likelihood ratios.
          *   Unenumerable: Focus on computational complexity.

  6.  **Addressing the "Bug" Analogy:**
      *   The user sees the Presumptuous Philosopher as a bug (SIA winning by raw count). This suggests a preference for SSA-like behavior *for decision making*, but SSA has its own bugs (reference class arbitrariness).
      *   I need to highlight that "Decision Guidance" might require a different weighting than "Truth Tracking." (UDT/ADT approaches).

  7.  **Finalizing the Conflicts:**
      *   The user guessed "Informative" vs. "Immune to cheap hypotheses."
      *   My analysis: It's more "Invariance/Consistency" vs. "Resistance to Population Size."
      *   The single requirement that excludes the most rules: **Invariance under redescription**. Most rules (SSA especially) fail this because they depend on how you define an "observer."

  8.  **Drafting the Scorecard:**
      *   SSA: Good on resistance, bad on invariance/reference class.
      *   SIA: Good on invariance (mostly), bad on resistance (Presumptuous Philosopher).
      *   Keep it to one paragraph.

  9.  **Review against Constraints:**
      *   RFC style? Yes.
      *   Sort candidate requirements? Yes.
      *   Three specific test cases? Yes.
      *   Flag conflicts? Yes.
      *   One paragraph scorecard? Yes.

  10. **Self-Correction/Refinement during drafting:**
      *   *Correction:* Make sure to distinguish between *truth* (credence) and *decision* (utility). The prompt asks for credences to hand to a decision procedure, but acknowledges the purpose is decision guidance. This is the "Self-locating Belief" vs. "Decision Theory" (like UDT) tension. I should stick to the credence spec but note where decision theory might bypass the need for credences.
      *   *Refinement on "Merge":* Merging is physically dubious. I should mark the test case as checking for *consistency* rather than physical possibility.
      *   *Refinement on "Unenumerable":* This points towards measures (density) rather than counts (cardinality).

  11. **Final Polish:** Ensure the voice sounds like a senior engineer writing a spec for a philosophy library. (e.g., "Panic on NaN," "O(1) lookup").

  *(Self-Correction on the "Merge" case)*: The prompt asks for the time-reverse of the Fork. If Fork splits 1->2, Merge is 2->1. If the rule is symmetric, the probability update should reflect the change in "measure" or "weight" consistently. I will specify that the *betting odds* should remain consistent relative to the pre-event state.

  *(Self-Correction on "Thick Index")*: If I condition on *exact* evidence, SIA often cancels out (likelihood ratio becomes 1). This makes it uninformative. The requirement "Informative" conflicts with "Condition on Total Evidence" in SIA contexts. I need to highlight this.

  *(Final check on Impossibility)*: The strongest impossibility result in this domain is often related to the "Mind Projection Fallacy" or the inability to define a unique measure over observers without arbitrary choices. I will frame this as the "Reference Class vs. Invariance" conflict.

