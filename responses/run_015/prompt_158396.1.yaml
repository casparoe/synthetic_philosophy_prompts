  8.  **Final Polish:** Check tone. Ensure it sounds authoritative yet open to the nuance of the "Simulative Stance." (Proceed to generate output).

  *(Self-Correction during final output generation)*: Make sure to explicitly address the user's specific constraint: "document whether my team's language model 'believes' certain false premises." I need to give a definitive "Yes/No/How" on this based on the analysis. The answer should be "No, do not use the word 'believes', use the Simulative Stance language."

