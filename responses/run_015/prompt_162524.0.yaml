answer: |-
  You are right to doubt your proposed remedy. Your intuition is mathematically sound: within a standard expected-value (EV) maximization framework, applying a discount for model uncertainty (often called a "robustness check" or addressing the "optimizer's curse") systematically penalizes interventions with high variance and low measurability. Since structural and political work is inherently harder to measure and attribute than bednet distribution, a penalty for uncertainty pushes your allocation *away* from the political work, not toward it.

  Furthermore, widening error bars symmetrically does not change the mean estimate. To make political work win on EV grounds via "fat tails," you must assume a highly skewed distribution where the upside is effectively unbounded. While some longtermist arguments rely on this, most institutional critique is not claiming that political work has *infinite* upside, but rather that your current metric fails to capture *significant, finite* upside.

  Your colleagues are struggling to articulate the point because the critique is not primarily epistemic; it is **axiological** and **structural**. It is not that your estimates are too precise; it is that the metric itself is the wrong tool for the job.

  Here is a breakdown of what the critique is actually claiming, why the epistemic fix fails, and how a small foundation might practically respond.

  ### 1. Why the Epistemic Fix Fails
  You asked if there is a principled way to calibrate a discount. The answer is generally no, not in a way that achieves your goal.

  *   **The Optimizer's Curse:** When you select the intervention with the highest estimated EV, you are likely selecting the one with the largest positive estimation error. To correct for this, you shrink estimates toward the mean based on variance. Since political work has higher variance, it gets shrunk more. This mathematically codifies the bias against structural change.
  *   **The Commensurability Problem:** The epistemic fix assumes that "bednet impact" and "policy impact" are measurable in the same currency (e.g., DALYs averted or dollars of income). The institutional critique argues they are not. Political work often changes *who decides* how resources are allocated, or prevents harm from being generated upstream. Comparing these via a single EV metric category errors the nature of the good.
  *   **Goodhart's Law:** By optimizing for what is measurable, you incentivize grantees to do what is measurable. If you try to fix this by creating complex proxy metrics for political work, you risk creating new distortions where organizations optimize for your proxies rather than actual political power.

  ### 2. What the Critique Is Actually About
  If it is not about precision, what is the claim? It is usually one of three things:

  **A. The Power Blindness**
  Standard cost-effectiveness analysis treats beneficiaries as passive recipients of utility. Political work treats them as agents. A foundation that only funds direct aid reinforces a dynamic where the foundation holds the agency and the beneficiaries hold the need. The critique is that this perpetuates a specific power structure, regardless of how much "good" is done in the short term. The "defect" is not in your math, but in your theory of change regarding *who* should be solving problems.

  **B. The Portfolio Risk (Systemic Fragility)**
  By funding only direct interventions, you are hedging against immediate suffering but ignoring systemic risk. If the political environment collapses, bednet distribution stops. Political work is "infrastructure funding." In financial terms, you are over-invested in high-yield operating expenses and under-invested in capital preservation and risk management. The critique is that you are maximizing return on investment while ignoring the stability of the market itself.

  **C. The Knowledge Production Problem**
  This addresses your final question directly. The reason political work looks "speculative" is partly because the field has under-invested in measuring it. Because foundations like yours haven't funded it, there is less data, which makes it look riskier, which justifies not funding it. This is a collective action problem.

  ### 3. Concrete Remedies for an Allocator
  If you cannot solve this by tweaking the EV formula, how do you allocate? You need to change the *decision procedure*, not just the inputs.

  **Option 1: The Barbell Strategy (Portfolio Allocation)**
  Stop trying to compare political work and direct aid on the same scale. Instead, adopt a portfolio approach.
  *   **Action:** Allocate a fixed percentage (e.g., 20%) of the budget to "High Uncertainty / High Leverage" causes.
  *   **Decision Rule:** Within that bucket, do not use EV maximization. Use **satisficing** or **thesis-driven** investing. Ask: "Is there a plausible story where this changes the system?" rather than "What is the expected DALYs per dollar?"
  *   **Why:** This acknowledges that your epistemic tools work for one type of work but not the other, without forcing a false comparison.

  **Option 2: Participatory Grantmaking**
  If the critique is about power and agency, the remedy is to shift the epistemic authority.
  *   **Action:** For the structural/political bucket, cede decision-making power to a committee of stakeholders from the affected communities or movement builders.
  *   **Why:** They possess local knowledge about leverage points that your committee cannot access via spreadsheets. This bypasses the need for you to calculate the EV of political work; you are funding the *process* of determination rather than the intervention itself.

  **Option 3: Meta-Funding (Solving the Collective Problem)**
  You asked if an allocator can answer this from inside their own decision, or only at the field level. The answer is: you can fund the field level.
  *   **Action:** Fund organizations that evaluate, research, or build infrastructure for political/structural interventions. Fund the "R&D" of structural change.
  *   **Why:** This addresses the knowledge production problem. You are not betting on a specific policy outcome (which is hard to attribute); you are betting on increasing the ecosystem's capacity to identify high-leverage political interventions in the future. This is a tractable, fundable object that aligns with the critique.

  ### 4. Individual vs. Collective
  To your final question: *Can an allocator answer it from inside her own allocation decision?*

  **No, not fully.** If the problem is that the field lacks data on political interventions, your single foundation cannot generate enough data to make those interventions "measurable" in the EA sense within your tenure.

  **However,** you can answer it by changing your **role**.
  *   **Current Role:** You are a *purchaser of outcomes* (buying bednets/DALYs).
  *   **New Role:** You become a *venture capitalist for public goods*.

  A VC knows most startups will fail. They do not discount the speculative ones for uncertainty; they expect uncertainty. They fund a portfolio knowing that one "home run" (a major policy shift) pays for the rest. If you adopt a VC mindset for your structural bucket, you stop asking for the precision that bednet charities provide. You accept that you are funding *options* on future impact, not *deliveries* of current impact.

  ### Summary Recommendation
  Your instinct to repair this epistemically is a category error. The institutional critique is a claim about **value pluralism** and **power**, not variance.

  1.  **Abandon the Discount:** Do not apply a model uncertainty discount to political work; it will mathematically guarantee you never fund it.
  2.  **Segregate the Buckets:** Create a distinct "Structural/Political" budget line. Do not force it to compete directly with global health on DALYs/$.
  3.  **Change the Metric:** For the structural bucket, evaluate based on **narrative plausibility** and **positioning** (e.g., "Is this group well-positioned to influence X policy?") rather than counterfactual impact estimates.
  4.  **Accept Attribution Loss:** Acknowledge that if you fund political work, you may never know if it worked. That is the price of entry. If you require attribution, you have already decided against this work.

  Your colleagues are right that the math misses the point. The point is that some goods are not reducible to the metrics you have built, and a foundation serious about doing good must fund the things that matter, not just the things it can measure.
