answer: |-
  # The Fictional Emotion Diagnostic Instrument

  **Instructions:** Proceed through the nodes sequentially. Answer based on your immediate philosophical intuition regarding the *rationality* and *structure* of the emotion, not your preference for a specific theorist.

  ### Node 1: The Existence Assent
  **Question:** During the peak of your emotional response (e.g., weeping at a death), do you cognitively assent to the proposition that the object of your emotion *actually exists* in the shared world, even if only for a moment?
  *   **YES:** → **Leaf 1: Full-Blooded Illusionism**
      *(You suspend disbelief so thoroughly that you temporarily hold a false belief in existence. The paradox dissolves because, for you, the object is real.)*
  *   **NO:** → Proceed to Node 2.

  ### Node 2: Phenomenological Reality
  **Question:** Is the feeling you experience qualitatively identical to the "real-life" counterpart (e.g., fictional grief feels exactly like actual grief), or is it a distinct, analogue state (a "quasi-emotion")?
  *   **DISTINCT/ANALOGUE:** → Proceed to Node 3.
  *   **IDENTICAL/REAL:** → Proceed to Node 4.

  ### Node 3: The Algorithmic NPC Case (Prescription Check)
  **Question:** Consider a procedurally generated NPC in a roguelike that dies permanently. There is no authorial intent or backstory, only algorithmic state. If you feel a "quasi-grief," is this response valid because you are **prescribed** to imagine it by the game's rules, or invalid because there is no mind behind the state to prescribe the imagining?
  *   **VALID (Prescribed by Rules/Game):** → **Leaf 2: Walton-Style Make-Believe**
      *(You engage in a game of make-believe where the algorithmic state generates principles of generation. The emotion is quasi-real, grounded in imagination rules.)*
  *   **INVALID (No Prescription/Just Arousal):** → **Leaf 5: Deflationary View**
      *(Without a prescribing mind or real object, there is no genuine care. What you call "grief" is merely linguistic shorthand for mild physiological arousal.)*

  ### Node 4: The Action Tendency Test
  **Question:** Since you hold no belief in existence (Node 1) but feel real emotion (Node 2), does this emotion generate a genuine, suppressed urge to intervene (e.g., reach out, call for help), or is the motivation to act entirely absent?
  *   **YES (Urge Exists):** → **Leaf 6: The Incoherent/Unstable Combo**
      *(You hold real emotion + action tendency + no existence belief. This is the Paradox of Fiction unresolved. You claim the emotion is fully functional but lacks the ontological ground required for functional emotions.)*
  *   **NO (No Urge):** → Proceed to Node 5.

  ### Node 5: The Counterfactual Napoleon Case (Existence Relevance)
  **Question:** Consider a biopic depicting a fictionalized, suffering version of Napoleon (who actually existed). You know this specific suffering never happened. Does the **falsity of the historical proposition** negate the rationality of your pity, or is the **thought of the suffering** sufficient regardless of truth?
  *   **SUFFICIENT (Thought is enough):** → Proceed to Node 6.
  *   **NEGATES (Existence/Truth Matters):** → Proceed to Node 7.

  ### Node 6: Propositional Robustness
  **Question:** If the thought is sufficient (Node 5), is the resulting pity **fully robust** (same weight/intensity as real pity), or is it merely a "theoretical" emotion that lacks phenomenological weight?
  *   **FULLY ROBUST:** → **Leaf 3: Thought-Theory**
      *(Emotions are responses to propositional content, not existence claims. The counterfactual Napoleon triggers real affect because the thought of suffering is genuine, even if the fact is not.)*
  *   **LACKS WEIGHT:** → **Leaf 5: Deflationary View**
      *(If the thought isn't enough to generate robust emotion, you likely don't care genuinely. Return to Deflationary.)*

  ### Node 7: Structural Attenuation
  **Question:** If existence/truth matters (Node 5), is your pity **structurally weaker** than real pity (e.g., easier to dismiss, less consuming) specifically because you know intervention is impossible?
  *   **YES (Weaker/Dampened):** → **Leaf 4: Attenuation View**
      *(The emotion is real, but the fictional context removes the action-potential and existential stakes, resulting in a structurally attenuated state.)*
  *   **NO (Same Strength, just different object):** → **Leaf 3: Thought-Theory**
      *(If the strength is identical despite the lack of existence/truth, you are effectively a Thought-Theorist who emphasizes content over ontology.)*

  ***

  ### Scoring & Diagnostic Notes

  **The Indistinguishable Pair: Thought-Theory vs. Attenuation**
  This instrument may struggle to cleanly separate **Leaf 3 (Thought-Theory)** and **Leaf 4 (Attenuation)** for respondents who answer inconsistently at Nodes 6 and 7.
  *   **Why:** Both views agree that the emotion is "real" (Node 2) and lacks action-tendency (Node 4). The split relies entirely on whether the user perceives the *intensity* of the emotion as diminished by the fictionality (Attenuation) or maintained by the propositional content (Thought-Theory).
  *   **Diagnostic Tip:** If a user oscillates between Node 6 and Node 7, probe them on the **Napoleon Case** again. Ask: *"If you could save the fictional Napoleon, would you?"*
      *   If **Yes**: They lean toward **Thought-Theory** (the value is in the content).
      *   If **No/Maybe**: They lean toward **Attenuation** (the value is dampened by the lack of real-world consequences).

  **The "Incoherent" Trap**
  **Leaf 6** is not a stable philosophical position but a diagnostic flag. If a user lands here, they are likely experiencing the *paradox* intuitively without having resolved the cognitive dissonance. They claim the emotion is real and action-guiding, yet admit they know the object doesn't exist. This usually indicates a need to revisit Node 1 (Illusionism) or Node 4 (Action Tendency).

  **The NPC Stress Test**
  **Node 3** is designed to fracture the **Walton/Deflationary** boundary. Strict Waltonians require "principles of generation" (prescription). If the NPC has no author, a strict Waltonian must admit there is no make-believe, pushing them toward Deflationism. If they insist the algorithm itself prescribes the imagining, they hold a modified Waltonian view compatible with procedural rhetoric.
