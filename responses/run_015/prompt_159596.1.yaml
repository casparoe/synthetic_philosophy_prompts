  *Revised Plan:* The biggest threat is the claim that Reading 1 is "legitimately yielded." Most epistemologists think if you use the source to verify the source, you get *nothing*, not even a track record. I must prioritize the objection that challenges the acquisition of Reading 1.

  *Let's reorder:*
  1.  The "No Independent Check" Objection (Skeptic/Reliabilist) - *Highest Damage.*
