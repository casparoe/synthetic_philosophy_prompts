  I'm putting together a feature on Schrödinger's weirder philosphy — the Vedanta stuff, not the cat. Most people think of him as the quantum guy who wrote What is Life?, but he spent serious energy arguing that consciousness is basically one thing, not a bunch of separate minds, drawing on Advaita Vedanta. He compared individual awareness to waves on one ocean, which sounds mystical but he meant it literally. I'm trying to map out which open questions coming from that view are actually worth pursuing right now, and which are just dead weight that should be dropped.

