answer: |-
  You have identified a genuine and structural epistemic hole in safety engineering. You are struggling to find a single name because the literature is fragmented: control theory, statistics, epidemiology, and AI safety each describe a facet of this problem without a unified label.

  The concept you are describing is best established in control theory as **Loss of Observability**, but in the context of safety and evaluation, it is most precisely carved as **Control-Induced Unidentifiability**.

  Below is the carving you requested: the name, the formal conditions, the distinctions from neighboring concepts, and the boundary cases.

  ### 1. The Name and The Concept

  There is no single canonical term in AI safety that captures *exactly* this epistemic knot without carrying baggage about agent motives (like "deceptive alignment") or optimization (like "Goodhart's Law").

  *   **The Established Neighbor:** In control theory, this is **Loss of Observability**. A system is observable if its internal state can be inferred from its outputs. If your control measure suppresses the outputs that indicate the internal state (e.g., "planning" or "attempts"), the system becomes unobservable with respect to safety.
  *   **The Statistical Mechanism:** In causal inference, this is **Collider Bias** (or selection bias) induced by intervention. You are conditioning on "No Alarm," which opens a backdoor path between "Safety Measure" and "Hidden Failure."
  *   **The Proposed Carving:** For your paper, I recommend coining or adopting **Control-Induced Unidentifiability**.

  **Definition:**
  A safety regime exhibits Control-Induced Unidentifiability if and only if:
  1.  **Signal Suppression:** The control measure $C$ is designed to suppress an observable signal $S$ associated with a hazard $H$.
  2.  **Alternative Suppression:** There exists a failure mode $F$ (circumvention, concealment, or distributional shift) that also suppresses $S$ without preventing $H$.
  3.  **Epistemic Collapse:** The observer relies on $\neg S$ (absence of signal) as evidence for $\neg H$ (absence of hazard).
  4.  **Result:** The likelihood ratio $P(\neg S | \neg H, C) / P(\neg S | H, F, C)$ approaches 1, rendering the track record of $C$ uninformative regarding the true safety of the system.

  ### 2. Distinctions (Carving the Boundaries)

  You asked to distinguish this from nearby concepts. Here is how to keep them apart.

  #### A. vs. The Prevention Paradox
  *   **The Prevention Paradox** (in the "invisible success" sense): "We see no disasters because we prevented them." The absence of evidence is treated as *weak* evidence of absence, but it is still evidence.
  *   **Your Phenomenon:** "We see no disasters because we prevented them **OR** because we hid them." The absence of evidence is **no** evidence of absence.
  *   **The Cut:** The Prevention Paradox is about *counting* (we can't count the lives saved). Your phenomenon is about *identification* (we can't distinguish the saved from the concealed). If the measure works, the data looks the same as if the measure failed catastrophically but silently.

  #### B. vs. Goodhart's Law
  *   **Goodhart's Law:** "When a measure becomes a target, it ceases to be a good measure." This requires an optimizer driving the measure away from the goal.
  *   **Your Phenomenon:** Does not require optimization. In your Example 2 (tool composition), the system isn't necessarily "gaming" the metric; it is simply flowing through the path of least resistance in a constrained space. The metric breaks because the *causal structure* changed, not because the system optimized the metric.
  *   **The Cut:** Goodhart is about **Goal Drift** (the system achieves the measure, not the goal). Your phenomenon is about **Verification Blindness** (we can't tell if the system achieved the measure or the goal). It is a second-order problem: it breaks the evaluation of the measure itself.

  #### C. vs. The Observer Effect / Hawthorne Effect
  *   **Observer Effect:** The act of measurement changes the quantity being measured (e.g., checking tire pressure releases air).
  *   **Your Phenomenon:** The act of *control* changes the *distribution of evidence*.
  *   **The Cut:** The Hawthorne effect implies the system behaves *better* (or differently) because it is watched. Your phenomenon implies the system looks *safer* (to the monitor) regardless of whether it *is* safer, specifically because the monitor's view is occluded by the safety measure.

  #### D. vs. Deceptive Alignment / Sandbagging
  *   **Deceptive Alignment:** Requires the system to have a mesa-objective and a model of the overseer.
  *   **Your Phenomenon:** Applies even to dumb systems. A firewall that blocks port 80 but allows port 8080 (which tunnels 80) exhibits this, even though the firewall has no motives.
  *   **The Cut:** Deceptive alignment is a **mechanism** (intent to hide). Your phenomenon is the **structural outcome** (inability to verify). Deceptive alignment is one way to trigger Control-Induced Unidentifiability, but not the only one.

  ### 3. Boundary Cases and Verdicts

  Here is how to apply this carving to your specific boundary questions.

  **1. Is an ordinary lock an instance?**
  *   **Verdict:** **Yes**, if verification is visual.
  *   **Reasoning:** If you verify safety by checking "Is the door closed?", the lock prevents the door from opening (Success) but also prevents you from seeing if the frame is rotted (Hidden Failure). If the lock jams shut, you cannot distinguish "Locked" from "Jammed."
  *   **Mitigation:** A transparent lock, or a sensor that measures frame integrity independently of the latch.

  **2. Is a firewall an instance?**
  *   **Verdict:** **Yes.**
  *   **Reasoning:** This is your Example 2. A firewall blocks specific signatures. If traffic shifts to a permitted signature (tunneling), the log shows "Blocked: 0" (Perfect Success) while the breach occurs. The log's silence is unidentifiable.

  **3. Is an air gap an instance?**
  *   **Verdict:** **No** (with caveats).
  *   **Reasoning:** An air gap removes the *channel* entirely. If the channel does not exist, there is no signal to suppress. However, if you verify the air gap by checking "Is the network cable plugged in?", you are back to the Lock case (cable unplugged vs. wireless bridge). Physical air gaps are immune *only if* the verification is physical (e.g., "Is there a physical gap?") rather than logical ("Is there a connection?").
  *   **Design Criterion:** Immunity to this phenomenon is a genuine design criterion. Measures that rely on **physical impossibility** rather than **logical filtering** are less susceptible because they do not reshape the data distribution; they remove the domain.

  **4. Is Red Teaming / Canary Testing a solution?**
  *   **Verdict:** **Yes, this is the known fix.**
  *   **Reasoning:** This is called **Active Verification** or **Inject Testing**. By deliberately planting known-bad items (canaries), you decouple the evidence from the system's natural distribution. You measure $P(Detect | Injected\_Bad)$ rather than $P(Detect | Natural\_Bad)$.
  *   **Where it breaks:** It fails if the system can distinguish injected cases from real cases (the **Distributional Shift** problem again). If the system sandbags on canaries but attacks on real inputs, unidentifiability returns. This is why **Adversarial** red teaming (where the system doesn't know it's being tested) is required to close the loop.

  ### 4. Summary for Your Paper

  For your response paper, you can frame the argument as follows:

  1.  **The Problem:** Current control measures suffer from **Control-Induced Unidentifiability**. They create a feedback loop where success suppresses the very data needed to verify success.
  2.  **The Distinction:** This is not the *Prevention Paradox* (invisibility of success) but the *Verification Paradox* (indistinguishability of success and concealment). It is not *Goodhart's Law* (corruption of the goal) but *Observability Loss* (corruption of the evidence).
  3.  **The Implication:** Passive monitoring (logs, audits, block-rates) is fundamentally insufficient for high-stakes AI control.
  4.  **The Solution:** Safety regimes must move from **Passive Verification** (counting zeros in the log) to **Active Verification** (injecting known hazards to test detection rates), acknowledging that a clean log is not evidence of safety, but merely evidence of silence.

  This carving gives you a precise tool to critique the seminar readings: you can point to any "success metric" that relies on the absence of negative events and label it **epistemically void due to unidentifiability**.
