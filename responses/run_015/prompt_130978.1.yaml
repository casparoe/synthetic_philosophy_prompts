prompt: |-
  You serve as methodological adviser to a regional public-works board that reviews high-stakes infrastructure proposals and must combine conflicting stakeholder reports about risk and welfare. The board wants to operationalize Harsanyi's aggregation theorem—under which social preferences over lotteries satisfy the von Neumann-Morgenstern axioms and a weak Pareto condition if and only if social welfare equals a state-independent weighted sum of individual cardinal utilities—into a reusable decision procedure that non-economist members can execute in a single two-hour session without software.

  Construct the procedure as an ordered sequence of tests with explicit stopping rules: (1) the verification questions that establish whether each stakeholder report can be treated as a vNM preference ordering; (2) the check for the independence axiom and what to do when it fails for one group; (3) the determination of welfare weights, marked clearly as a value judgment that the procedure cannot resolve; (4) the computation or approximation step, with instructions for what to do when cardinal utilities are only ordinally ranked; and (5) the final aggregation rule and the conditions that force deferral to a human vote. Specify the hard cases the procedure must handle, including stakeholder proxies who represent future generations through discount-rate models and groups whose ambiguity aversion about climate scenarios violates independence. Apply the procedure to two proposals: reinforcing a coastal levee where agricultural representatives reject standard lotteries over flood probabilities, and extending a transit corridor where present users and a future-generations proxy disagree on both outcomes and weights. Include one application where the procedure recommends approval that conflicts with the board's intuitive moral judgment, and explain why. Conclude by stating precisely what the procedure cannot determine—especially the normative source of the weights and the status of goods that fall outside utility—so the board knows where judgment is unavoidable.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **Role:** Methodological Adviser to a regional public-works board.
      *   **Task:** Create a reusable decision procedure to operationalize Harsanyi's Aggregation Theorem.
      *   **Constraints:**
          *   Non-economist members.
          *   Single two-hour session.
          *   No software (manual calculation/estimation).
          *   Ordered sequence of tests with explicit stopping rules.
      *   **Key Components:**
          1.  Verification of vNM preferences.
          2.  Independence axiom check & failure handling.
          3.  Welfare weight determination (value judgment).
          4.  Computation/approximation (handling ordinal vs. cardinal).
          5.  Final aggregation & deferral conditions.
      *   **Hard Cases:** Future generations (discounting), Ambiguity aversion (climate).
      *   **Applications:**
          1.  Coastal levee (agricultural reps reject lotteries).
          2.  Transit corridor (present vs. future disagreement).
          3.  Counter-intuitive result (approve despite moral judgment).
      *   **Conclusion:** Limitations (normative source of weights, non-utility goods).

  2.  **Deconstruct Harsanyi's Aggregation Theorem:**
      *   *Premise:* Individual preferences satisfy vNM axioms (Completeness, Transitivity, Continuity, Independence). Social preferences satisfy vNM axioms + Weak Pareto.
      *   *Result:* Social Welfare Function (SWF) = $\sum w_i u_i(x)$, where $u_i$ are cardinal utilities (unique up to positive affine transformation) and $w_i \ge 0$.
      *   *Challenge:* Real-world stakeholders rarely provide clean vNM utilities. Weights are normative. Time/complexity constraints.

  3.  **Drafting the Procedure (Step-by-Step):**

      *   *Time Management:* 2 hours = 120 minutes. Need to allocate time wisely.
      *   *Step 1: vNM Verification.* How to check this without math? Use simple scenarios. "Do you prefer A or B?" "If I change the probability slightly, does your choice flip unpredictably?"
      *   *Step 2: Independence Axiom.* This is the big one for climate/ambiguity. Ellsberg Paradox territory. If they fail, Harsanyi doesn't strictly apply. Need a workaround (e.g., treat as robustness check or flag for deferral).
      *   *Step 3: Weights.* Harsanyi says weights exist but doesn't set them. This *must* be explicit political judgment.
      *   *Step 4: Cardinalization.* Stakeholders give ordinal rankings ("I like A more than B"). Need to map to 0-1 scale. Standard gamble method is too slow. Use a simplified "0 to 100" score anchored by worst/best outcomes.
      *   *Step 5: Aggregation & Deferral.* Sum the weighted scores. If variance is too high or axioms failed, defer.

      *   *Refining for "No Software/Non-Economists":* Keep math to addition and multiplication of integers (0-10 scale). Use checklists.

  4.  **Addressing Hard Cases:**
      *   *Future Generations:* They don't have voices. A proxy uses a discount rate. This affects the *utility* calculation (present value) or the *weight*? Harsanyi treats individuals. A proxy is an individual. The conflict is usually on the discount rate (time preference).
      *   *Ambiguity/Climate:* Violates Independence. If a group says "I don't know the probability," vNM breaks. Procedure needs a "Red Flag" here.

  5.  **Developing the Applications:**
      *   *Case 1 (Levee):* Ag reps reject lotteries (risk/ambiguity aversion). *Result:* Procedure flags Independence failure. Deferral or modified risk premium. Let's make it so the procedure forces a deferral or a specific adjustment.
      *   *Case 2 (Transit):* Present vs. Future. Disagree on weights. *Result:* Shows the weight determination step is crucial.
      *   *Case 3 (Counter-Intuitive):* High aggregate utility but violates equity/intuition. Harsanyi is Utilitarian. It might approve a project that hurts a minority significantly if the majority gains enough. This highlights the "tyranny of the majority" risk inherent in weighted sums.

  6.  **Writing the Content - Section by Section:**

      *   *Introduction:* Set the tone. Formal but accessible.
      *   *The Procedure (The "Harsanyi Protocol"):*
          *   Phase 1: Axiom Check (20 mins).
          *   Phase 2: Independence Stress Test (30 mins).
          *   Phase 3: Weight Assignment (30 mins) - *Crucial: Label as Political.*
          *   Phase 4: Utility Scaling (20 mins).
          *   Phase 5: Aggregation & Stop Rules (20 mins).
      *   *Handling Hard Cases:* Specific instructions for Future Proxies and Ambiguity.
      *   *Applications:*
          1.  Levee: Ag reps fail independence. Procedure stops/defers.
          2.  Transit: Weight conflict. Board must choose weights.
          3.  Moral Conflict: High sum, low equity. Procedure approves, Board feels bad. Explain why (Utilitarianism vs. Egalitarianism).
      *   *Limitations:* Weights, Non-utility goods (rights, justice).

  7.  **Review and Refine (Self-Correction):**
      *   *Critique:* Is 2 hours realistic for all this?
      *   *Fix:* Simplify the utility scaling. Instead of standard gambles, use a "0-10 Impact Score" anchored by consensus best/worst. Acknowledge this is an *approximation* of cardinal utility.
      *   *Critique:* Harsanyi requires *cardinal* utility. If stakeholders only give ordinal, the theorem breaks.
      *   *Fix:* The procedure must explicitly force cardinalization (e.g., "Intensity of Preference" questions) or flag it as a violation requiring deferral. I will instruct them to use a 0-100 "Welfare Score" anchored by specific outcomes to approximate cardinality.
      *   *Critique:* The prompt asks for "explicit stopping rules."
      *   *Fix:* Add "STOP" boxes at the end of each phase.
      *   *Critique:* Make sure the "Counter-Intuitive" case is clear.
      *   *Fix:* Use a scenario where a small group loses everything, but the math says "Approve."

  8.  **Final Polish:** Check tone (advisory, rigorous), formatting (bolding, lists), and ensure all prompt requirements are met (discount rates, ambiguity, specific cases, limitations). *Ensure the distinction between vNM utility (risk) and standard welfare (certainty) is managed simply for non-economists.* (Decision: Treat the infrastructure proposals as lotteries with associated probabilities to fit Harsanyi's framework).

  9.  **Final Output Generation** (Proceeding to generate response based on these thoughts).

  *(Self-Correction during drafting)*: Wait, Harsanyi's theorem applies to *social preferences over lotteries*. Infrastructure projects are often treated as certain outcomes with uncertain parameters. To fit the theorem strictly, the board must view proposals as lotteries (e.g., "70% chance of success, 30% chance of cost overrun"). I need to make sure the procedure frames the proposals this way so the vNM axioms actually apply.

  *(Refining the "Independence Failure")*: If a group violates independence (e.g., ambiguity aversion), Harsanyi's theorem technically cannot derive the linear sum. The procedure needs to acknowledge this breach. I will instruct the board to either exclude that input (loss of Pareto) or defer. I'll choose "Defer" for high-stakes to be safe, or "Adjust" for the sake of the exercise. Let's go with "Flag and Adjust via Safety Margin" to keep the meeting moving, but note the theoretical breach. Actually, the prompt asks for stopping rules. If Independence fails, the theorem doesn't hold. So the rule should be "Deferral to Political Vote."

  *(Refining Weights)*: Harsanyi doesn't determine weights. The procedure must make the Board vote on weights *before* calculating welfare.

  *(Refining Cardinality)*: Non-economists can't do standard gambles in 2 hours. I will prescribe a "Calibrated Scorecard" method where 0 = Status Quo/Worst and 100 = Ideal, asking for *intensity* checks to approximate cardinality.

  Let's assemble.cw
answer: |-
  # MEMORANDUM
  **TO:** Regional Public-Works Board
  **FROM:** Methodological Adviser
  **SUBJECT:** Operational Procedure for Harsanyi Aggregation (The "H-Protocol")
  **TIME ALLOCATION:** 120 Minutes (Strict)

  ## Executive Summary
  This procedure operationalizes John Harsanyi’s Aggregation Theorem to convert conflicting stakeholder reports into a single Social Welfare Function (SWF). The theorem states that if individual preferences satisfy rationality axioms under risk, and society respects the Weak Pareto principle, social welfare must be a weighted sum of individual cardinal utilities.

  **Warning:** This protocol does not resolve moral disputes regarding *weights*. It only ensures mathematical consistency once weights are chosen.

  ---

  ## Phase 1: The vNM Verification Test (20 Minutes)
  **Goal:** Confirm stakeholder reports qualify as von Neumann-Morgenstern (vNM) preference orderings.
  **Input:** Stakeholder written reports on Proposal A vs. Proposal B (viewed as lotteries with probabilities).

  ### Step 1.1: Completeness and Transitivity Check
  Ask each stakeholder representative (or proxy):
  1.  "Can you strictly prefer A to B, B to A, or are you indifferent? (No 'I don't know' allowed)."
  2.  "If you prefer A > B and B > C, do you prefer A > C?"

  *   **STOPPING RULE 1:** If any representative cannot rank the options or violates transitivity (e.g., A > B > C > A), **HALT**. Their report is logically incoherent. Exclude that stakeholder from the sum and note the exclusion in the minutes. Proceed only if all remaining reports are transitive.

  ### Step 1.2: Continuity Check
  Ask: "Is there any probability $p$ (between 0 and 1) such that you would accept a lottery of [Best Outcome with prob $p$ / Worst Outcome with prob $1-p$] instead of the [Certain Middle Outcome]?"

  *   **STOPPING RULE 2:** If a stakeholder says "No probability makes that acceptable" (lexicographic preferences), **HALT**. vNM utility cannot be constructed. Defer decision to human vote for this specific conflict.

  ---

  ## Phase 2: The Independence Axiom Stress Test (30 Minutes)
  **Goal:** Detect ambiguity aversion or context-dependent preferences that violate Harsanyi’s linearity requirement.
  **Hard Case:** Climate scenarios where probabilities are unknown (ambiguity).

  ### Step 2.1: The Substitution Question
  Present a scenario: "You prefer Outcome X over Outcome Y. If I mix both with a third Outcome Z (e.g., 'administrative delay') at the same probability, your ranking should not flip."
  *   *Query:* "Does adding a common risk to both options change your preference?"

  ### Step 2.2: Handling Failure (Ambiguity Aversion)
  If a group (e.g., Agricultural Reps) states: "I prefer X over Y, but if the probabilities are uncertain (climate ambiguity), I switch to Y," they violate the Independence Axiom.

  *   **PROCEDURE FOR FAILURE:**
      1.  **Do not** force their utility into the linear sum.
      2.  **Apply a Safety Margin:** Treat their utility as a "Robustness Constraint."
      3.  **STOPPING RULE 3:** If more than 30% of the weighted population violates Independence, **DEFER**. The Harsanyi theorem is inapplicable. The Board must vote directly.
      4.  **If < 30%:** Proceed, but discount that group’s utility score by 20% to account for unmodeled risk aversion.

  ---

  ## Phase 3: Welfare Weight Determination (30 Minutes)
  **Goal:** Assign $w_i$ to each stakeholder group.
  **Note:** Harsanyi’s theorem proves weights *exist* but does not determine them. This is a **Political Judgment**, not a calculation.

  ### Step 3.1: The Weighting Vote
  The Board must assign a non-negative weight $w_i$ to each validated stakeholder group $i$.
  *   **Default:** $w_i = 1$ for all present constituents.
  *   **Future Generations:** Assign $w_{future}$ based on Board policy (e.g., 0.5 relative to present voters).
  *   **Constraint:** Weights must sum to 1.0 (or 100) for ease of calculation.

  *   **STOPPING RULE 4:** If the Board cannot agree on weights within 20 minutes, **DEFER**. The procedure cannot run without agreed-upon weights. Record the dissenting weight proposals.

  ---

  ## Phase 4: Cardinal Utility Approximation (20 Minutes)
  **Goal:** Convert ordinal rankings ("I like A better") into cardinal scores ($u_i$) compatible with addition.
  **Constraint:** No software. Use the "0–100 Calibrated Scale."

  ### Step 4.1: Anchoring
  For each stakeholder group $i$:
  1.  Identify the **Worst Possible Outcome** across all proposals = Score 0.
  2.  Identify the **Best Possible Outcome** across all proposals = Score 100.

  ### Step 4.2: Intensity Scoring
  Ask representatives: "On a scale of 0 to 100, where 0 is Worst and 100 is Best, where does Proposal A land?"
  *   *Correction for Ordinal Bias:* If a group says "A is slightly better than B" but scores A=90 and B=10, challenge them. "Does A provide 9x the welfare?" Adjust until the score reflects *intensity* of preference, not just rank.
  *   **Hard Case (Future Generations):** The Proxy calculates utility using their discount rate model. Convert the Net Present Value (NPV) to the 0–100 scale relative to the Best/Worst anchors established in 4.1.

  *   **STOPPING RULE 5:** If a group refuses to provide intensity scores (providing only ranks), **HALT** for that group. You cannot sum ordinal numbers. Use the median score of similar groups or exclude.

  ---

  ## Phase 5: Aggregation and Final Decision (20 Minutes)
  **Goal:** Compute Social Welfare ($W$) and apply decision rules.

  ### Step 5.1: The Calculation
  Compute $W = \sum (w_i \times u_i)$ for Proposal A and Proposal B.
  *   *Manual Math:* Use the provided worksheet. Multiply Weight (0–1) by Score (0–100). Sum the column.

  ### Step 5.2: The Decision Rule
  1.  **If $W_A > W_B$:** Recommendation is **Approve A**.
  2.  **If $W_B > W_A$:** Recommendation is **Approve B**.
  3.  **Deferral Condition:** If the difference $|W_A - W_B| < 5$ points, the result is statistically indistinguishable given the approximation methods. **DEFER** for more study.

  ### Step 5.3: The "Moral Veto" Check
  Before finalizing, the Board Chair asks: "Does this result violate a fundamental right or equity constraint not captured in utility?"
  *   **STOPPING RULE 6:** If a unanimous Board vote invokes the Moral Veto, **OVERRIDE** the procedure. Record the specific utility metric that failed to capture the moral cost.

  ---

  ## Application Scenarios

  ### Case 1: Coastal Levee Reinforcement
  *   **Stakeholders:** Urban Developers (Pro-Levee), Agricultural Representatives (Anti-Levee).
  *   **Conflict:** Ag Reps reject standard lotteries over flood probabilities, citing "unknown unknowns" in climate models.
  *   **Procedure Execution:**
      1.  **Phase 2 (Independence):** Ag Reps fail the Independence Stress Test (Ambiguity Aversion).
      2.  **Calculation:** They represent 40% of the regional economy (Weight = 0.4). This exceeds the 30% threshold in Stopping Rule 3.
      3.  **Outcome:** **DEFER.**
      4.  **Reasoning:** The Harsanyi theorem requires risk, not ambiguity. Because a critical mass of stakeholders views the probabilities as unknowable, the linear aggregation is theoretically invalid. The Board must vote politically, acknowledging the model breakdown.

  ### Case 2: Transit Corridor Extension
  *   **Stakeholders:** Present Commuters (Weight 0.6), Future-Gen Proxy (Weight 0.4).
  *   **Conflict:** Present users value time savings (High Utility now). Future Proxy values carbon reduction (High Utility later, discounted).
  *   **Procedure Execution:**
      1.  **Phase 3 (Weights):** Board argues. Present users argue $w_{future}$ should be 0.1; Environmentalists argue 0.5. Board compromises at 0.4.
      2.  **Phase 4 (Cardinal):** Future Proxy submits NPV-based utility. Commuters submit time-savings utility. Both mapped to 0–100.
      3.  **Phase 5 (Aggregation):**
          *   Proposal A (High Speed): Commuters=90, Future=20. $W = (0.6 \times 90) + (0.4 \times 20) = 54 + 8 = 62$.
          *   Proposal B (Green Tech): Commuters=40, Future=90. $W = (0.6 \times 40) + (0.4 \times 90) = 24 + 36 = 60$.
      4.  **Outcome:** **Approve Proposal A.**
      5.  **Reasoning:** Despite the environmental benefit, the weighted sum favors present convenience due to the agreed weights and discounting.

  ### Case 3: The Counter-Intuitive Approval (Moral Conflict)
  *   **Proposal:** Relocate a waste treatment plant.
  *   **Stakeholders:** General Population (Weight 0.95), Displaced Minority Community (Weight 0.05).
  *   **Utilities:**
      *   General Population: Gain minor convenience (Score rises from 50 to 55).
      *   Minority Community: Suffer severe health degradation (Score drops from 50 to 0).
  *   **Calculation:**
      *   Status Quo: $(0.95 \times 50) + (0.05 \times 50) = 50$.
      *   Proposal: $(0.95 \times 55) + (0.05 \times 0) = 52.25 + 0 = 52.25$.
  *   **Procedure Outcome:** **Approve Proposal.** ($52.25 > 50$).
  *   **Board Intuition:** Most Board members feel this is unjust; it sacrifices a minority for a trivial majority gain.
  *   **Explanation:** Harsanyi’s theorem is **Utilitarian**. It maximizes the *sum* of welfare, not the *distribution*. The procedure correctly executed the math: the aggregate gain outweighed the aggregate loss. The conflict arises because the Board’s moral intuition includes **Equity Constraints** (Rawlsian max-min or Rights) which the vNM framework does not capture unless encoded into the utility function itself (e.g., if the General Population felt guilt, their utility would drop). Since their utility did not reflect guilt, the procedure approves the injustice.

  ---

  ## Limitations and Unavoidable Judgments
  The Board must recognize that this procedure does not absolve you of responsibility. It merely structures your reasoning. The following remain **undetermined by the procedure**:

  1.  **The Normative Source of Weights:** The math cannot tell you if a future generation is worth 0.4 or 0.1 of a present voter. This is a philosophical/ethical choice external to the theorem.
  2.  **Non-Utility Goods:** The procedure assumes all value can be compressed into a single utility number ($u_i$). It cannot account for **Rights, Justice, or Entitlements** that are arguably "priceless" or non-tradable. If a proposal violates a right but increases utility, Harsanyi says "Approve." The Board must use the **Moral Veto (Step 5.3)** to correct this.
  3.  **Preference Adaptation:** If a disadvantaged group has lowered expectations (adaptive preferences), their utility scores may be artificially low. The procedure treats these scores as valid, potentially locking in historical inequities.
  4.  **Interpersonal Comparisons:** The 0–100 scaling assumes a "Unit of Welfare" is roughly comparable between a farmer and a banker. This is an assumption, not a fact.

  **Final Advisory:** Use this protocol to expose conflicts, not to hide them. If the procedure forces a result that feels wrong, trust the "Moral Veto" and record the failure of the utilitarian metric.

  **[END OF PROCEDURE]**
