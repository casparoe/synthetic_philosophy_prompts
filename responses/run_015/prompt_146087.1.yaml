  Here are the four terms:

  1.  **Mechanism Sufficiency (0.40):** Probability that population pressure and fiscal stress alone generate a collapse of *comparable amplitude* without elite fragmentation acting as the multiplier.
      *   *Justification:* Historical peasant revolts rarely succeed without elite defectors; without the elite channel, unrest likely dampens to stagnation rather than systemic collapse.
  2.  **Institutional Durability (0.40):** Probability that your anti-capture rules (no heritability, capped offices) actually prevent elite overproduction for five centuries without decay.
      *   *Justification:* Institutional entropy is high; over 20 generations, winners will inevitably rewrite rules to secure advantages for kin (Goodhart's Law).
  3.  **Measurement Validity (0.75):** Probability that a recovered 200–300 year oscillation represents the specific SDT secular cycle rather than generic delay-induced noise.
      *   *Justification:* Dynamical systems with lags oscillate easily, but matching the specific *amplitude* and *phase* of historical secular cycles is a much tighter constraint.
  4.  **System Coherence (0.50):** Probability that the society remains "agrarian and extractable" given the ban on land accumulation and wealth transmission.
      *   *Justification:* Agrarian economies run on land-as-capital; banning wealth transmission removes the investment incentive for surplus production, likely collapsing the mode of production itself.

  **Sensitivity Analysis**
  The final number is most sensitive to **Term 4 (System Coherence)**.
  In my calculation, this term is the largest drag. If you assume the society can remain agrarian without heritable land wealth (perhaps shifting to a state-slave or prebendal model that still counts as "agrarian" for SDT purposes), you could raise this probability to 0.80. That single change would lift the headline credence from **0.07 to 0.12**, nearly doubling it. The other terms are bounded by historical dynamics (elites *always* fight, institutions *always* decay), but the definition of the society itself is the most fragile assumption.

  **Evidence to Move the Needle**
  The one piece of evidence that would move my number the most is a **historical counterexample of a 500-year agrarian state with non-heritable elite wealth.**
  If you can point to a real-world case (e.g., a specific dynasty or caliphate) where officeholders were strictly barred from accumulating land or passing wealth to kin, yet the state remained agrarian, extractive, and stable for five centuries, I would immediately raise Term 4 to 0.90 and Term 2 to 0.70. This would push the headline credence above **0.25**. Without that, the "no heritable wealth" constraint functions as a theoretical singularity that breaks the model's input conditions.

  **Coherence Check**
  I believe the counterfactual does not hold together cleanly, and that is the primary reason my number is significantly lower than your 0.3.
  In pre-industrial agrarian societies, "elite" and "landowner" are effectively synonymous because land is the only scalable store of value. By banning the conversion of office into land and wealth into inheritance, you are not just tweaking the SDT model; you are removing the operating system the model runs on. The society would likely either revert to standard feudalism (breaking Term 2) or transition to a non-agrarian extraction mode like a tribute empire or state slavery (breaking Term 4). This structural incompatibility is responsible for roughly **0.03** of the downward drag on my final estimate.
