  **MEMORANDUM**

  **TO:** State Corrections Oversight Board
  **FROM:** Board Member [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on Riverside "Dignity Wing" Pilot Program

  **Recommendation:** Approve-with-Conditions

  **Reasoning**

  This proposal presents a conflict between immediate humane treatment and systemic integrity. The architects argue that environmental design can reduce violence and improve staff-inmate dynamics regardless of sentencing structures. The critics argue that importing Halden's aesthetics without Norway's welfare state context is "cosmetic penal welfarism"—a boutique upgrade that legitimizes the surrounding cage without reducing incarceration rates or sentence lengths.

  Both sides are partially correct, but the critics' objection carries heavier moral weight. A private room and casual guard uniforms do not negate the trauma of mandatory minimums or the lack of parole credit. If we approve this pilot without acknowledging its limitations, we risk validating the narrative that environmental tweaks suffice when structural reform is required. We must not allow this wing to become a showcase used to deflect criticism of the broader punitive system.

  However, rejecting the pilot solely because the broader system is unjust punishes current inmates for the state's legislative failures. Withholding dignity because we cannot yet deliver justice is a form of punitive nihilism. If environment reduces violence, even within a punitive system, we have a duty to test that hypothesis.

  **The Coercion Problem**

  The most critical ethical flaw in the current plan is the potential for coerced rehabilitation. The proposal suggests "autonomy-building" programs. Autonomy cannot be mandated. Forcing an inmate to cook their own meal or manage their own schedule to "build responsibility" while denying them actual control over their liberty is contradictory and undermines the moral agency the program claims to restore. It turns dignity into a compliance metric.

  **Conditions for Approval**

  1.  **Voluntary Participation:** Inmates cannot be forced into the "dignity" programming. Participation in kitchen duties or communal living arrangements must be opt-in. Opting out must not result in loss of privileges or negative marking for parole hearings (even if no credit is given, no penalty can be assessed).
  2.  **Transparency on Sentencing:** All participants must be explicitly informed in writing that this pilot does not alter sentence length, mandatory minimums, or parole eligibility.
  3.  **90-Day Evaluation Clause:** Within 90 days of operation, Corrections Administration must submit a comparative report against the general population covering:
      *   Frequency of use-of-force incidents.
      *   Staff injury and turnover rates.
      *   Grievance filings regarding safety and treatment.
      *   *Crucially:* An assessment of whether non-participants in the general population experienced increased restriction or resentment due to resource diversion.

  **Conclusion**

  We can approve better conditions without endorsing the system that necessitates them. We accept the pilot as a harm reduction measure, not a solution to mass incarceration.

  Verdict: Approve-with-Conditions
