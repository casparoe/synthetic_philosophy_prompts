answer: |-
  **Move (1) Marta:** **Mostly Mistaken.**
  Marta correctly identifies that some terms (like institutional roles) have content fixed by future communal decisions, but she mistakenly assumes this blocks the skeptic; the skeptic can simply ask what fact fixes the *current* meaning of the rule "defer to the community," generating a regress. She trades on an ambiguity between terms whose *extension* is fixed by practice and terms whose *meaning-constituting fact* is immune to skepticism.

  **Move (2) Owen:** **Clearly Right.**
  Owen correctly identifies the structural nature of the skeptical argument: if underdetermination applies to "plus," it applies to any rule for fixing content, including "defer to practice." He successfully prevents Marta from carving out a safe haven by showing the skeptical hypothesis operates at the meta-level of rule-following itself.

  **Move (3) Marta:** **Clearly Mistaken.**
  Marta claims deviance cannot hide for practice-tracking terms, but this ignores that the *interpretation* of "the practice" is itself subject to the skeptical paradox (e.g., I might mean *quus* by "follow the practice"). She shifts the issue from the metaphysical constitution of meaning to the epistemic visibility of behavioral divergence, which the skeptic grants is irrelevant.

  **Move (4) Owen:** **Clearly Right.**
  Owen accurately diagnoses that Marta's "local" solution actually concedes the core of the skeptical solution: that there is no robust, present fact of the matter, only future settlement. He correctly notes that her distinction collapses into his global view because both accept that content is indeterminate until assertibility conditions are met.

  **Move (5) Marta:** **Mistaken.**
  While phenomenologically accurate, appealing to first-person authority as a counter-argument begs the question, since the skeptic's conclusion is precisely that such authority is not knowledge of a fact. She treats the *feeling* of meaning as evidence for a *fact* of meaning, which is the exact inference the skeptical argument undermines.

  **Move (6) Owen:** **Clearly Right.**
  Owen faithfully reconstructs the skeptical solution's account of authority: it is not a metaphysical insight but a practical confidence warranted by community agreement. He correctly refuses to let Marta reintroduce the robust notion of meaning that the argument was designed to eliminate.

  ***

  **Overall Verdict:**
  **Owen is more right.** He maintains logical consistency with the structure of Kripke's argument, whereas Marta repeatedly attempts to carve out exceptions that the skeptic's regress inevitably swallows. Marta successfully highlights the *cost* of the view (the loss of first-person authority), but she fails to show that the argument's scope is limited; Owen correctly demonstrates that if the argument works at all, it works globally, forcing a choice between the skeptical solution and meaning nihilism.

  **What Both Are Missing:**
  Both participants treat the **Skeptical Argument** (there are no meaning facts) and the **Skeptical Solution** (replace truth-conditions with assertibility-conditions) as a unified package that must be accepted or rejected together. They miss the option of accepting the Argument globally (meaning nihilism) while rejecting the Solution as insufficient to recover normativity. Additionally, they fail to distinguish between **ontological reduction** (Marta's hope that meaning facts *are* practice facts) and **semantic non-factualism** (Owen's view that there are no meaning facts); clarifying this would show Marta is arguing for a reductionism Kripke has already argued is impossible, rather than a genuine exception to the paradox.

  **Confidence Level:**
  **High.** The logical structure of Kripke's regress is well-established in the literature, and Owen's moves track the standard defense of the argument's universality against reductionist objections.

  **Least Sure Claim:**
  I am least sure of the rating for **Move (1)**. While logically vulnerable to the regress, Marta is linguistically correct that some terms *are* practice-tracking (e.g., "valid legislation"), and a sophisticated defender might argue this changes the *type* of fact involved enough to blunt the skeptic's force, even if it doesn't eliminate the regress entirely. My rating assumes a strict Kripkean framework where any appeal to facts is vulnerable, but some neo-Wittgensteinians might grant Marta more ground here.
