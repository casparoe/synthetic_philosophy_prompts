  ### Solution Key: Ranking HCH Amendments

  **Tier 1: Worth adding to almost any version of the scheme**

  *   **(h) Decomposition review** — **Score: 9**
      This targets the structural failure mode where a node decomposes a problem into unanswerable or irrelevant sub-questions, and it plausibly addresses this by allocating budget to verify the tree's architecture before expending resources on the branches.
  *   **(b) Mandatory steelman** — **Score: 8**
      This addresses the local confirmation bias where a node ignores evidence contradicting its initial inclination, and it plausibly mitigates this by forcing cognitive engagement with the counter-argument before finalizing the output.

  **Tier 2: Promising but contingent on details**

  *   **(c) Blind adjudication** — **Score: 7**
      This targets random error and anchoring effects by introducing redundancy, though it plausibly succeeds only if the independent copies are sufficiently uncorrelated to avoid sharing the same systematic blind spots.
  *   **(d) Adversarial allocation** — **Score: 7**
      This addresses premature convergence on a plausible but incorrect answer, and it plausibly works provided the adversarial nodes are skilled enough to find genuine flaws rather than generating noise.
  *   **(e) Scored confidence** — **Score: 5**
      This aims to correct overconfidence and dishonesty through incentive alignment, but it plausibly fails to improve immediate deliberation quality because untrained humans calibrate probabilities poorly under proper scoring rules.

  **Tier 3: Probably not worth the added complexity**

  *   **(a) Pre-registered decomposition** — **Score: 4**
      This attempts to prevent cherry-picking sub-questions based on early answers, but it plausibly hinders performance more than it helps by removing the adaptivity required to handle complex, unknown problem structures.

  **Tier 4: Likely to make things worse**

  *   **(f) Compression constraint** — **Score: 3**
      This intends to reduce cognitive overload at parent nodes, but it plausibly degrades output quality by discarding the nuanced reasoning required for the parent to verify the child's work rather than just trusting the conclusion.
  *   **(g) Shared notebook** — **Score: 2**
      This seeks to provide global context across the tree, but it plausibly breaks the independence assumption essential to HCH by introducing cascading anchoring effects and correlated errors between nodes.

  ***

  ### Single Best Amendment
  If I could keep only one, I would keep **(h) Decomposition review**. In a recursive system, a structural error at the root or high-level nodes propagates and amplifies down the tree; no amount of node-level optimization (like steelmanning or confidence scoring) can recover from a decomposition that asks the wrong questions. Verifying the *shape* of the deliberation is a higher-leverage intervention than verifying the *content* of any single node.

  ### Most Likely to Backfire
  The amendment most likely to backfire is **(g) Shared notebook**. HCH relies on the statistical independence of nodes to bound error propagation and prevent "groupthink" within the tree. By allowing lateral information flow, you introduce correlations that make the system vulnerable to a single early error contaminating all subsequent nodes, effectively turning a robust tree into a fragile chain.

  ### Human vs. Language Model Distinction
  My ranking shifts significantly if the humans are replaced by language models (LMs). Specifically, **(e) Scored confidence** moves to **Tier 1**, as LMs can be fine-tuned on proper scoring rules to achieve far better calibration than humans, making incentive alignment highly effective. Conversely, **(f) Compression constraint** moves to **Tier 2**, because LMs are generally more capable of lossless semantic compression than humans, reducing the risk of nuance loss. However, **(g) Shared notebook** remains in **Tier 4**; while LMs do not suffer psychological anchoring, they are susceptible to "context pollution" where early errors in the shared scratchpad degrade the attention mechanism for later queries, preserving the risk of correlated failure. The choice of **(h) Decomposition review** as the single best amendment remains unchanged, as structural integrity is critical regardless of the substrate.
