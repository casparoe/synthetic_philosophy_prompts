answer: |-
  The debate between the intrinsic (shape-cluster) and relational (contrast-role) accounts is a dispute over the ontology of the letter: is a letter a *kind of object* defined by its physical properties, or is it a *position in a structure* defined by its differences from other positions?

  To determine which account captures the essence of a letterform, we must test them against the three cases provided.

  ### I. Testing the Accounts

  **Case (i): The Continuum and the Double-Storey**
  This case presents two challenges: a continuous gradient between 'a' and 'd' (stem height), and the discontinuous variation between single-storey (ɑ) and double-storey (a) forms.

  *   **Intrinsic Account:** This account handles the continuum well. Since 'a'-hood is graded based on resemblance to exemplars, it naturally explains why a mark with a medium-height stem feels "borderline." However, it struggles significantly with the single/double-storey problem. These two shapes share little perceptual similarity; they do not fall into the same tight cluster in a space of forms. To accommodate this, the Intrinsic account must posit that there are two distinct clusters both arbitrarily labeled 'a', which weakens the claim that shape *constitutes* the letter.
  *   **Relational Account:** This account struggles slightly with the phenomenology of the continuum (readers *do* feel hesitation, which suggests a perceptual gradient), but it handles the categorical requirement effortlessly. The system requires a binary distinction between 'a' and 'd'; therefore, the continuum is socially collapsed into two categories wherever the community draws the line. Crucially, the Relational account explains the single/double-storey variation perfectly: both shapes occupy the same node in the network of contrasts (both distinguish *cat* from *cot* and *dat*). Shape is irrelevant; functional equivalence is everything.

  **Case (ii): Cross-Script Identity**
  Here, the identical physical shape (e.g., a circle) functions as 'o' in Latin, 'o' in Greek, but perhaps 'a' in a constructed script, or vice versa.

  *   **Intrinsic Account:** This is a fatal failure. If a letter is defined by its place in a space of perceived forms, the same form must be the same letter. The Intrinsic account cannot explain how Shape $X$ is an 'a' in System 1 but a 'b' in System 2 without admitting that the "space of forms" is not intrinsic to the mark but dependent on the system—which collapses into the Relational view.
  *   **Relational Account:** This is the Relational account's strongest victory. It predicts exactly this phenomenon. A mark is an 'a' only relative to the specific system of differences it inhabits. The shape is merely the vehicle; the identity is determined by the system.

  **Case (iii): Private Hands and Mapping**
  In this scenario, there is no shared standard shape. Writers invent private glyphs, provided they remain internally discriminable. Readers succeed by mapping the writer's private contrasts to the public language.

  *   **Intrinsic Account:** This account fails because it relies on "learned exemplars." If every writer uses a unique repertoire, there is no stable stock of exemplars for the reader to learn *in advance*. Recognition would be impossible unless the reader learns a new "shape-cluster" for every writer. This makes reading impossibly inefficient and contradicts the prompt's stipulation that readers *do* succeed by mapping.
  *   **Relational Account:** This account succeeds. It posits that what the reader learns is not a specific shape, but the *logic of distinction*. As long as the writer's private 'a' contrasts with their private 'd', 'o', and 'e' in a way that maps to the public language's structure, communication holds. The essence of the letter is preserved not in the ink, but in the preservation of the contrastive structure.

  ### II. Divergence and Accommodation

  **Where they diverge:**
  The accounts diverge on the locus of identity. The Intrinsic account locates identity in the **material vehicle** (the mark itself). The Relational account locates identity in the **structural value** (the mark's difference from others). For the Intrinsic view, change the shape enough, and you destroy the letter. For the Relational view, change the shape as much as you like, provided the system of distinctions remains intact.

  **Can either accommodate all three?**
  Only the **Relational account** can accommodate all three cases without contradiction.
  *   The Intrinsic account is defeated by Case (ii) (Cross-Script) and severely strained by Case (iii) (Private Hands). It treats the letter as a natural kind (like "tiger" or "gold"), but letters are institutional facts.
  *   The Relational account accommodates (ii) and (iii) naturally. It accommodates (i) by treating the perceptual continuum as a psychological side-effect of the physical medium, while maintaining that the *letter itself* is a discrete functional unit.

  ### III. Defense: The Relational Account as Essence

  The Relational account provides the better account of the essence of a letterform because it aligns with the fundamental nature of writing as a **coding system**.

  Writing is not painting; its primary purpose is not to present forms for contemplation, but to encode linguistic distinctions for recovery. If the goal is the recovery of linguistic distinctions, then the physical properties of the mark are secondary to its ability to sustain those distinctions. The Relational account captures this functional teleology. The Intrinsic account mistakes the *medium* of the letter for the *message*. A letter is not a picture of an 'a'; it is a token that triggers a specific differentiation in the reader's decoding process.

  ### IV. The Intuition of the "Good" vs. "Bad" 'a'

  If we accept the Relational account, we face a challenge: If shape is incidental, why do we feel that a clumsy,歪 neven, or stylistically odd 'a' is a "poor" 'a', while a well-proportioned one is "better," even though both are technically 'a's?

  On the Relational account, this intuition shifts from **ontological correctness** to **functional optimization**.

  1.  **Signal-to-Noise Ratio:** A "good" 'a' is one that secures its contrastive role with maximum efficiency and minimum ambiguity. A "poor" 'a' is one that sits too close to the boundary of 'o' or 'd' in the perceptual space, threatening the integrity of the system. It makes the reader's work of discrimination harder. The intuition of "badness" is actually an intuition of *legibility risk*.
  2.  **Conventional Friction:** Writing is a social contract. Even if my private shape functions relationally, if it deviates wildly from the expected cluster, it increases the cognitive load on the reader who must re-calibrate their mapping. A "good" 'a' adheres to the convention, smoothing the path of communication. A "bad" 'a' introduces friction.
  3.  **Prototypicality:** We can retain the Intrinsic insight as a description of *prototypes* without accepting it as a definition of *essence*. Within the Relational system, certain shapes become "focal points" because they historically secure the contrast most robustly. A "good" 'a' is one that is central to the cluster of shapes that usually fill this role. It is not *more* of an 'a' ontologically, but it is a *more efficient* 'a' functionally.

  **Conclusion:**
  The essence of a letter is not its shape, but its difference. The Relational account survives the tests of script variation, private hands, and functional equivalence where the Intrinsic account fails. The intuition that some 'a's are "better" than others does not refute this; rather, it confirms that while identity is relational, *efficacy* is optimized by adhering to the stable shapes that history has proven best secure those relations. A clumsy 'a' is still an 'a', but it is a citizen failing to uphold its duty of clarity.
