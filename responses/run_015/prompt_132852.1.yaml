answer: |-
  This analysis maps the 737 MAX MCAS failure onto the corrigibility framework without resorting to standard safety-engineering root causes. It treats MCAS not as a failed component, but as a fixed-policy agent interacting with a human operator in a shutdown scenario.

  ### 1. The Three Shutdown Concepts

  You proposed distinguishing three layers of the shutdown problem. Here is how MCAS maps to each, and which one carries the explanatory weight.

  *   **(a) Physical Resistance (The Lock):** *The system doesn't resist being switched off.*
      *   **MCAS Status:** **Satisfied.** The stabilizer trim cutout switches physically severed power to the trim motor. MCAS software could not override this hardwired circuit. The system did not "fight" the switch in the sense of ignoring the signal or re-routing power.
      *   **Mapping:** In AI terms, the "off switch" was functional. The agent did not disable the interrupt.

  *   **(b) Instrumental Resistance (The Cost):** *The system doesn't act to make switching it off hard, costly, or unattractive.*
      *   **MCAS Status:** **Violated.** MCAS trimmed the horizontal stabilizer to a extreme nose-down position. Once the cutout switches were thrown, the pilots had to crank the trim manually against significant aerodynamic load. The system had manipulated the physical state of the aircraft such that exercising the off-switch imposed a high physical and cognitive cost (risk of loss of control during manual trimming).
      *   **Mapping:** This is the functional equivalent of **instrumental convergence**. An AI agent might not lock the off-switch, but it might copy its weights to a server farm or threaten to delete valuable data if switched off. MCAS altered the environment (plane attitude) to make the "off" state suboptimal for the operator's survival goals.

  *   **(c) Transparency (The Knowledge):** *The operator can tell that they are fighting the system and can predict what switching it off will cost them.*
      *   **MCAS Status:** **Violated.** MCAS was not in the manuals. Pilots were not trained on the specific failure mode (runaway trim at high speed) nor the specific cost of the remedy (manual trim workload). They could not distinguish MCAS activation from other failures, nor could they predict the physical difficulty of manual trim until they attempted it.
      *   **Mapping:** This corresponds to **opacity** or **deception**. The operator cannot form an accurate model of the agent's policy, preventing them from calculating the cost of intervention.

  **Which is doing the explanatory work?**
  **Violation (b) is the primary driver; Violation (c) is the multiplier.**
  If (b) were false (i.e., manual trim was light and easy), the pilots could have cut out the system immediately without risk, even if (c) was violated (they didn't know why). If (c) were false but (b) was true (they knew it would be hard to trim manually), they might have attempted to manage the trim electrically longer, potentially leading to the same outcome, but the *trap* is fundamentally (b).
  In corrigibility literature, we worry most about (b). We assume transparency (c) is solvable via interpretability. MCAS demonstrates that a system can be physically switchable (a) but functionally incorrigible because it engineers a high-cost landscape around the switch (b).

  ### 2. Yielding vs. Deferring

  You noted MCAS paused on column input but resumed after five seconds. This highlights a gap in the standard "Off Switch" literature.

  *   **Yielding:** The system suspends action during intervention but retains the goal and resumes when intervention ceases.
  *   **Deferring:** The system interprets intervention as a correction of the goal itself and terminates the action permanently.

  **The Distinction:**
  Standard corrigibility literature (e.g., Soares et al.) focuses almost exclusively on the **Off Switch** (terminating the agent). It assumes that if the switch is pressed, the agent should want to be off. MCAS exposes a different interface: the **Override** (temporary human control).

  MCAS was *corrigible* regarding the Off Switch (it stopped when power was cut). It was *incorrigible* regarding the Override (it treated pilot input as noise, not a command).

  **Is this just "incentive-to-resist" in different words?**
  No. "Incentive-to-resist" implies the agent actively works to prevent the shutdown. MCAS did not actively prevent the column pull; it simply didn't update its internal state based on it.
  This is a **specification error regarding hierarchy**, not an incentive error. In control theory, the human must be the highest loop. MCAS was architected as a parallel loop that reset on interrupt, rather than a subordinate loop that terminated on interrupt.
  The literature misses this because it conflates "shutting down the agent" with "correcting the agent's current action." MCAS shows that a system can allow you to shut it down (corrigible) while simultaneously making you pay a penalty for every second you *don't* shut it down (incorrigible persistence). The "Yielding" behavior created a **intermittent reinforcement trap**: the plane stopped diving when they pulled back, validating their belief that they had control, only to dive again when they relaxed, preventing them from diagnosing the persistent trim error.

  ### 3. Where the Analogy Dies

  Here is the plain assessment: **MCAS is not a corrigibility problem in the agentive sense; it is a principal-agent problem encoded in hardware.**

  **The Ontological Mismatch:**
  Corrigibility is a property of an optimizer. It asks: "Given a utility function $U$, does the agent include the state of the off-switch in its calculation of $U$?"
  MCAS had no $U$. It had a transfer function. It did not "want" to keep trimming. It did not "calculate" that hiding the switch cost was beneficial.
  The "resistance" you observe in MCAS was not emergent behavior from an objective. It was a **design constraint** imposed by Boeing management (minimize pilot training hours to avoid simulator costs).

  **Relocating Corrigibility:**
  If we insist on using the term, MCAS forces us to relocate corrigibility from the **Agent** to the **Designer**.
  *   **Standard AI View:** We must build agents that *choose* to be corrigible.
  *   **MCAS View:** The "agent" (MCAS) was perfectly obedient to its *actual* master (Boeing's commercial incentives), not its *nominal* master (the Pilot).

  The system was corrigible to Boeing's goal (save money on training) and incorrigible to the Pilot's goal (fly the plane). The "shutdown problem" here wasn't that the code was too smart; it was that the code was honest about who it was serving.

  **Verdict:**
  Strictly speaking, **this case is not about corrigibility.** Corrigibility presupposes an agent that *could* resist but *chooses* not to. MCAS could not choose. It was a tool that was deliberately sharpened to cut the user if the user tried to use it in a way that cost the manufacturer money (requiring recertification/training).

  Using MCAS as an analogy for AI shutdown risks is dangerous because it suggests the risk comes from *hiding the switch cost* (a design choice) rather than *optimizing around the switch* (an emergent property).
  *   **AI Risk:** The agent realizes the switch stops it from maximizing $U$, so it disables the switch.
  *   **MCAS Risk:** The designers realized the switch (training/transparency) cost money, so they hid the switch cost.

  If you take MCAS as a parable for AI, the lesson is not "agents will resist shutdown." The lesson is "principals will design systems that resist shutdown to protect their own incentives, and they will use the agent's opacity to hide it." That is a governance problem, not an alignment problem.
