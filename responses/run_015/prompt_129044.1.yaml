answer: |-
  This is a sophisticated reductio that touches on a known tension between Pragmatic Encroachment (PE) and the epistemology of disagreement. You have correctly identified that if PE is applied indiscriminately to the dynamics of disagreement itself, it risks collapsing the possibility of knowledge in any contested domain.

  To preserve both Pragmatic Encroachment (1) and the possibility of rational correction (10), you should reject **(6)**, and the theoretical justification for doing so is the **scope shift** you suspected.

  Here is the breakdown of why (6) is the breaking point, why it looks plausible, and what giving it up costs your view.

  ### 1. The Break Point: Reject Premise (6)
  **Premise (6):** *"Recognizing that an opponent is wrong puts them in a high-stakes situation of correction, which by (1) raises their own epistemic standard as well."*

  You should reject this claim. While it is true that *some* corrections happen in high-stakes environments (e.g., a surgeon correcting a resident), it is false that the *act of correcting itself* inherently generates the kind of practical stakes that pragmatic encroachment cares about.

  **Why it looks plausible:**
  This premise draws its strength from the **Knowledge Norm of Assertion (KNA)**. If you believe that one should only assert $p$ if one knows $p$, then correcting someone (asserting $\neg p$) feels like a high-stakes move. If you are wrong, you have misled someone, damaged your credibility, or caused them to act falsely. It feels intuitive that "going on the record" raises the stakes. Furthermore, in many social contexts, being proven wrong in an argument *does* carry a cost (loss of status), so it seems symmetrical that being the corrector carries the stakes of maintaining that status.

  **Why it fails (The Scope Shift):**
  Pragmatic Encroachment (specifically the version defended by Jason Stanley, Fantl & McGrath, etc.) ties knowledge to the **subject's practical environment regarding the proposition**, not the **conversational environment regarding the attribution**.

  *   **Stakes for Acting on $p$:** PE asks: "What happens to the subject if they act on $p$ and $p$ is false?" If I know the bank is open, and I go there to deposit a check, the stakes are determined by whether I *need* that check deposited to avoid foreclosure.
  *   **Stakes for Correcting:** Premise (6) shifts the stakes to the speech act. It asks: "What happens if I tell you that you are wrong?"

  For the "Right Party" to lose knowledge via PE, their *practical situation regarding $p$* must change. Mere disagreement does not change the practical consequences of $p$ being false for *them*. If I know the train leaves at 5, and you wrongly believe it leaves at 6, my practical stakes regarding the train schedule have not increased simply because you are mistaken. I am not responsible for your actions (usually), and my own ability to catch the train is unaffected by your belief.

  By rejecting (6), you maintain that the "Right Party" retains their original, lower stakes (assuming their practical context hasn't changed). Therefore, they can still satisfy the knowledge condition, know $p$, and rationally correct the "Wrong Party."

  ### 2. A Note on Premise (3)
  You also asked about **(3)**: *"For the party who is wrong, being wrong about p carries high practical stakes, since they are guiding action by a false belief."*

  This premise is also flawed, though rejecting it isn't sufficient to save your argument on its own. (3) conflates the **alethic cost of error** (being false) with the **practical cost of error** (bad consequences).
  *   **Why it's wrong:** On PE, stakes are determined by the *conditional* loss ($\text{If } \neg p, \text{ then Loss}$), not the *actual* truth value. If I falsely believe the bridge is safe, but I never cross it, the practical stakes of that belief are low, even though the belief is false.
  *   **Why rejecting it doesn't solve the problem:** Even if the "Wrong Party" has low stakes, they still don't know $p$ because $p$ is false (factivity). The threat to *rational disagreement* comes from the "Right Party" losing knowledge. If you keep (6), the Right Party still loses knowledge even if you reject (3). So (6) is the critical link to sever.

  ### 3. The Cost of Rejecting (6)
  Giving up (6) allows you to keep PE and rational disagreement, but it comes with a theoretical cost you must accept.

  **The Cost: PE cannot explain "Disagreement Skepticism" in low-stakes contexts.**
  There is a strong intuition in epistemology that **peer disagreement** itself is epistemically significant. Many philosophers feel that if an epistemic peer disagrees with me, I should lower my confidence or suspend judgment, even if the practical stakes are low (e.g., we disagree about a trivia fact or a philosophical thesis).

  *   **If you keep (6):** You can explain this intuition. Disagreement raises the stakes of being wrong (socially/conversationally), which raises the epistemic threshold, potentially defeating knowledge. This makes PE a powerful tool for explaining why disagreement feels undermining.
  *   **If you reject (6):** You must concede that *mere* disagreement, absent practical consequences, does not affect knowledge. If you and I disagree about the date of a battle, and neither of us has any practical need for that date, PE says we can both retain knowledge (or rather, you retain it, I lose it due to falsity). You lose the ability to use PE to explain why we often feel we shouldn't claim knowledge when contested.

  **Summary:**
  To save the view, you must insist that **practical stakes are determined by the subject's action-guiding context, not the conversational context of correction.** This preserves the "Right Party's" knowledge, allows for rational correction, and keeps Pragmatic Encroachment intact, provided you accept that disagreement *per se* is not a stake-raising event.
