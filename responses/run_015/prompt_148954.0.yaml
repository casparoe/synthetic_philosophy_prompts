answer: |-
  **DEAR DR. TEMPORAL SELVES**

  **Q:** I promised myself I wouldn't eat cake. I ate the cake. I judged eating the cake to be worse all-things-considered, yet I did it anyway. Now I feel guilty. Is my will weak, or am I just negotiating badly with myself?
  **—Signed, Breach of Contract in Carbohydrates**

  **A:** Dear Breach,

  Your letter describes a classic violation of intertemporal fiduciary duty. Under the Standard View of Agency, you are a unified principal who acted against your own best judgment. This is *akrasia*, and it is legally actionable as self-betrayal. However, under the Behavioral Economics Statute, you are not one person, but a succession of temporal principals engaged in a high-stakes contract dispute.

  Here is the situation: Your Past Self (T1) signed a diet agreement based on long-term health utilities, discounted by a standard delta rate. Your Present Self (T2), however, operates under a hyperbolic discount function. Due to your high beta parameter, the immediate utility of the cake spiked disproportionately at t=0, causing a preference reversal. This is dynamic inconsistency. T2 did not necessarily violate best judgment; T2 simply operated under a different valuation matrix than T1.

  The philosophical tension here is jurisdictional. If this is merely rational time preference, where is the failure of will? You optimized for T2's happiness. But if it is a real failure of will, why does binding your future self solve it? You cannot arrest a contractor for fulfilling their own utility function.

  To mitigate future liability, I recommend the following bureaucratic commitment devices:

  1.  **Notarized Cooling-Off Periods:** Any impulse purchase over 200 calories must undergo a mandatory 24-hour review period. This allows the beta bias to decay, realigning T2's preferences with T1's original mandate.
  2.  **Escrow Accounts for Willpower:** Deposit a significant sum with a third-party arbiter. If you consume the cake, the funds are donated to an organization you despise. This externalizes the cost, making the breach financially irrational even under hyperbolic discounting.
  3.  **Mandatory Arbitration:** Before eating, convene a tribunal between your Morning Self and Evening Self. Note that Morning Self is often a tyrant, while Evening Self is usually exhausted counsel. Ensure representation is balanced.

  Be warned: If you are "naive," you believe T2 will honor T1's plan. If you are "sophisticated," you know T2 will defect. Sophistication allows for pre-commitment, but it also invites existential dread. You must decide if you are managing a single life or administering a hostile merger between daily slices of consciousness.

  Ultimately, the cake was not a mistake; it was a renegotiation of terms you did not authorize. Stop trying to enforce morality where you should be enforcing clauses.

  Sincerely,
  **Dr. Temporal Selves**

  **PS:** Our model still cannot explain why Tomorrow's Self always feels like the victim of Today's choices, rather than the villain who inherited the mess. We suspect this is a phenomenological bug in the continuity of memory, but Legal has advised us not to litigate identity until after the holidays.
