answer: |-
  **MEMORANDUM**

  **TO:** District Museum Board of Trustees
  **FROM:** [Your Name], Board Member
  **DATE:** 28th of the Month
  **SUBJECT:** Recommendation Regarding Acquisition of Bronze Slab Assemblage (Ref: 24-BZ)

  **1. BOTTOM LINE RECOMMENDATION**
  I recommend that the Board **authorises the purchase** of the twenty-two bronze slabs at the asking price of £26,000, **conditional on** the immediate allocation of £1,500 from reserves (or emergency fundraising) for scientific testing prior to final public interpretation.

  We must accept that this acquisition will consume the majority of this year's acquisitions budget and effectively cancel the planned £9,000 schools programme for the current fiscal year. However, the risk of these objects leaving the district—or worse, entering a private collection where they cannot be studied—outweighs the cost of delaying the schools programme by twelve months.

  We should **not** commit to the Curator's proposed label ("The First Shopkeepers") at this stage. The evidence is compelling but not conclusive. We buy the objects to preserve them, not to validate a specific theory before testing is complete.

  **2. THE OBJECTS AND THE COST**
  *   **Item:** 22 flat bronze slabs, matchbox-sized, single punched hole.
  *   **Provenance:** Pit edge, circular earthwork (c. 100 BC – 100 AD). Associated with burnt hazelnut shells.
  *   **Physical State:** Crisp edges, no bending, no surface wear.
  *   **Metrics:** Three distinct weight clusters (approx. 8g, 17g, 25g).
  *   **Price:** £26,000.
  *   **Budget Impact:** Acquisitions budget depleted; Schools Programme (£9k) deferred.

  **3. SUMMARY OF COMPETING INTERPRETATIONS**
  To make an informed vote, the Board needs to understand that while the objects are physically real, their *purpose* is genuinely disputed among experts. I have summarised the four main positions below. None can be ruled out entirely without further work.

  *   **A. The "Trade Weight" Theory (Curator)**
      *   *Argument:* The tight weight grouping and the near 1:2:3 ratio (8g, 17g, 25g) suggest a standardised system. This implies commerce, markets, and a level of economic sophistication ("The First Shopkeepers").
      *   *Strength:* The mathematical regularity is unlikely to be entirely accidental.
      *   *Weakness:* It assumes ancient trade required small, precise bronze slabs rather than barter or bulk weighing.

  *   **B. The "Ritual Deposit" Theory (Hal, Local Researcher)**
      *   *Argument:* Objects found in pits and wet ground, in perfect condition, are typically votive offerings, not tools. Trade weights should be found in houses or marketplaces and show wear (scratches, rounding) from handling.
      *   *Strength:* Explains the "mint" condition and the find location (pit/spring) perfectly.
      *   *Weakness:* Does not fully explain the precise weight ratios, though ritual objects often mimic valuable items.

  *   **C. The "Doubler's" Caution (Finds Officer)**
      *   *Argument:* A craftsperson making lumps by hand will naturally make a small one, a medium one, and a large one. Doubling the metal is the easiest way to make a bigger lump. This creates a ratio without proving a "standard" enforced by law or market.
      *   *Strength:* A strong statistical warning against seeing patterns where there are only human habits.
      *   *Weakness:* Doesn't account for the tightness of the weight clusters (within 1g across 22 items).

  *   **D. The "Harness Tag" Theory (Flo, Board Member)**
      *   *Argument:* Scratches on two objects may be owner's marks. They could be identification tags for equipment (harness) rather than value markers.
      *   *Strength:* Accounts for the hole (for attachment) and the scratches.
      *   *Weakness:* Only two have visible scratches; does not explain the weight grouping.

  *   **E. The Forgery Risk (External Advice)**
      *   *Argument:* A known forger in the next county produces convincing bronze.
      *   *Mitigation:* This is the highest risk. If they are modern fakes, they are worthless to us. This risk *must* be ruled out by metal analysis before the purchase is finalised or funds are released.

  **4. PROPOSED ACTION PLAN**

  **Step 1: Secure the Objects (Immediate)**
  Authorize the Chair to sign the purchase agreement. We cannot risk the finder selling to a dealer who will export them.

  **Step 2: Scientific Verification (Months 1-3)**
  Before the objects go on display, we spend £1,500 on the following:
  1.  **XRF Metal Analysis:** To check alloy composition. *Pass:* Bronze consistent with Iron Age/Roman local ore. *Fail:* Modern impurities (e.g., specific zinc levels) indicating recent smelting.
  2.  **Microscopic Use-Wear Analysis:** High-magnification examination of the holes and edges. *Pass:* Micro-polish consistent with string suspension or handling. *Fail:* Sharp, tool-made edges with zero microscopic rounding.
  3.  **Statistical Weight Distribution:** Comparison of our weight spread against known hand-made clusters vs. minted weights.

  **Step 3: Labeling Policy (Interim)**
  Until Step 2 is complete, the display label must not claim they are weights.
  *   **DO SAY:** "Bronze Slabs, Iron Age. Found in a ritual pit. Purpose unknown: possibly weights, tags, or offerings."
  *   **DO NOT SAY:** "The First Shopkeepers," "Standardised Weights," or "Currency."

  **5. VOTING QUESTION**
  Does the Board authorise the expenditure of £26,000 for the acquisition of Ref: 24-BZ, acknowledging the deferral of the 2024 Schools Programme, subject to successful passing of the metal authenticity tests outlined in Section 4?

  ***

  **PRIVATE ANNEX: NOTES FOR THE BOARD MEMBER (YOU)**
  *(Do not circulate this page. This is for your understanding of where the solid ground ends and the guessing begins.)*

  You asked me to mark the split between what is settled fact and what is professional contention. As a print shop owner, you're used to specs: does the ink stick, is the paper the right weight. In archaeology, the "specs" are often missing. Here is the breakdown of the reasoning above.

  **1. What is Solid (The "Specs")**
  *   **The Physics:** They exist. They are bronze. They weigh roughly 8g, 17g, 25g. This is measurable fact.
  *   **The Context:** They came from a pit with hazelnuts dated to the Iron Age/Roman transition. Unless the hazelnuts were planted there recently (unlikely), the *pit* is ancient.
  *   **The Condition:** They have no macroscopic wear. This is observable fact.
  *   **The Risk:** There *is* a forger in the next county. This is a known variable.

  **2. What is Contested (The "Interpretation")**
  *   **The "Standard":** The Curator says 8/17/25 is a standard. The Finds Officer says it's just "small/medium/large." *Reality:* Archaeologists argue about this constantly. Without a written ledger from the time saying "1 unit = 8g," we are guessing. The "Doubler's Argument" is a very strong counter-point that often wins in academic journals.
  *   **The "Ritual" vs. "Tool":** Hal's argument (perfect condition = ritual) is the orthodox view. However, new finds sometimes overturn orthodoxy. If they were weights, why are they in a pit? Maybe they were *rejected* weights? Maybe the pit *was* the market archive? We don't know. Hal is probably right, but the Curator is allowed to hope he's wrong.
  *   **The Scratches:** Flo's harness tag theory is plausible but weak because only 2/22 have scratches. It's a "maybe," not a "likely."

  **3. The "Killer" Evidence**
  If you want to know what would change my recommendation instantly, it is the **Metal Analysis**.
  *   **If the alloy is modern:** Walk away. Let them go abroad. A fake is worse than nothing; it makes the museum a laughingstock.
  *   **If the alloy is ancient:** You buy them. Even if they are just ritual lumps, they are *ancient* ritual lumps found in your district. That is worth £26k to a district museum, even if the "Shopkeeper" story is wrong.

  **4. The Budget Trade-off**
  I have been blunt about the Schools Programme. The Board will not like cancelling it. However, if you try to split the difference (e.g., offer £15k), the finder will sell to the dealer. You have to own the decision: *Heritage Preservation > Education Programme (this year).* You can rebrand the schools programme next year as "Funded by the Friends of the Museum" or seek a specific grant now that you have a "major acquisition" to show donors.

  **5. Why this Memo Style?**
  I wrote the main memo to be "vote-ready" but honest. It avoids the "decisive air" you dislike by explicitly listing what we *don't* know in Section 3. It gives Hal and the Finds Officer their due, so if the Curator turns out to be wrong, the Board can say, "We were warned," rather than, "We were misled."

  **Summary for your peace of mind:**
  *   **Buy?** Yes (if metal is real).
  *   **Label?** Keep it vague ("Bronze Slabs") until tests are done.
  *   **Biggest Risk:** Forgery (Test: Metal Analysis).
  *   **Biggest Embarrassment:** Calling them "Shopkeeper Weights" when they are "Ritual Offerings" (Test: Micro-wear & Context).

  Good luck on the 2nd. Stick to the testing plan; it shows you're being prudent with the money, even if you are spending a lot of it.
