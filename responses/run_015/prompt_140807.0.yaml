prompt: |-
  I run a small print shop in town and somehow that got me a seat on the board of the district museum — I think they wanted somebody who isn't a retired teacher. Anyway, I'm the one who has to circulate a written recommendation before our meeting on the 2nd, and I'd really rather it not be one of those documents that sounds decisive and is mostly air.

  Here's the case. A detectorist found a group of small objects in a field about ten miles off, and the finder has offered them to us for £26,000, which is most of this year's acquisitions money — the education officer has already been promised around £9,000 of that pot for a schools programme, so if we buy, that programme doesn't happen this year. The things themselves: twenty-two flat little bronze slabs, each roughly matchbox-sized, with a single hole punced near one end. They come in three size classes, and when the county finds officer weighed them they grouped very tightly — about 8 g, about 17 g and about 25 g, with everything in a group within a gram of the others. They came out of a pit at the edge of a circular earthwork, along with nothing except some burnt hazelnut shells that date the pit to roughly the century either side of the Romans turning up. Crisp edges, no wear, no bending. Two more of the same kind of object have turned up at a settlement six miles away and three in a wet hollow by a spring, and none of them have ever come out of a grave. Our curator loves the "they're a set of weights" reading and wants the case heading to be something like "the first shopkeepers", on the grounds that tight groupings and a neat 1:2:3 pattern mean somebody was running a standard. Hal, a retired surveyor who blogs about local finds and generally drives the curator mad, says the opposite: nothing that's only ever found in pits and wet ground, in perfect condition, was ever a tool of any kind, and if these were trade weights you'd expect them in houses and at markets, worn smooth. The finds officer has a third worry, which she calls the doubler's argument — a maker working by eye naturally settles on a few convenient hand-sized lumps, and if you want a bigger one you just double the amount of metal, so neither the tight weights nor the ratios prove a shared standard, let alone anyone enforcing one. Flo on the board thinks they're harness tags and that the scratches on two of them are owners' marks, which would make them about property rather than about gods or trade. And I should say that a dealer at a fair told me a man in the next county has been knocking out very convincing fake bronze objects for years, so I don't think we can just wave that possibility away — though equally, if we don't buy them, the finder sells abroad and nobody local ever gets to study them properly.

  What I need is the memo I can put in front of the board: a clear bottom line — buy, don't buy, or buy but hold the case label until specific tests are done — with reasons, and with a fair run at whichever argument ends up on the losing side rather than a paragraph dismissing it. If you recommend buying, tell me what the label should actually claim and what it shouldn't, and what we should spend a little of the money on first (use-wear analysis under a microscope, weighing them properly on a decent balance and comparing the spread to what hand-made clusters look like, metal analysis, digging a bit more of the pit, whatever makes sense), and say in advance what result would count as evidence for or against each story. Please keep the two audiences in view: the board needs something it can vote on, and I need to know which parts of your reasoning are solid and which are the bits that people who do this for a living would argue about, so I'd like you to mark that split honestly — what's settled, what's genuinely contested, and which single piece of evidence would most change your recommendation. I'd rather hand round something that admits where it's guessing than something confident that isn't.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**

      *   **User Role:** Small print shop owner, newly appointed board member of a district museum.
      *   **Task:** Write a written recommendation (memo) for the board meeting on the 2nd regarding a potential acquisition.
      *   **Tone:** Practical, honest, not "decisive and mostly air." Needs to admit uncertainty where it exists.
      *   **The Object:** 22 flat bronze slabs (matchbox-sized), holed, 3 weight classes (8g, 17g, 25g). Found in a pit near a circular earthwork (Iron Age/Romans arriving). No wear, crisp edges. Context: burnt hazelnut shells (dating).
      *   **Comparative Finds:** 2 at a settlement 6 miles away, 3 at a spring. None in graves.
      *   **Cost:** £26,000 (most of acquisitions budget).
      *   **Trade-off:** Buying means cancelling a £9,000 schools programme.
      *   **Stakeholders/Arguments:**
          *   *Curator:* "First Shopkeepers" (Trade Weights). Evidence: Tight weight grouping, 1:2:3 ratio.
          *   *Hal (Blogger/Surveyor):* Not tools. Evidence: Found in pits/wet ground (ritual deposition?), perfect condition (never used).
          *   *Finds Officer:* "Doubler's Argument." Evidence: Hand-making leads to natural doubling, doesn't prove a standard.
          *   *Flo (Board Member):* Harness Tags/Property. Evidence: Scratches on two objects = owner's marks.
          *   *User (Print Shop Owner):* Forgery risk (dealer warning). Risk: If not bought, sold abroad/lost to local study.
      *   **Requirements:**
          *   Clear bottom line (Buy/Don't Buy/Buy Conditional).
          *   Fair treatment of losing arguments.
          *   If buying: Label claims (do's/don'ts), immediate spending priorities (tests), evidence thresholds.
          *   Audience awareness: Board (vote-ready) vs. User (needs to know what's solid vs. contested).
          *   Mark the split between settled fact and professional contention.

  2.  **Determine the Recommendation:**

      *   *Option A: Don't Buy.* Too risky. If they are real and significant, losing them abroad is a disaster for a district museum's mission. The schools programme is important, but unique artifacts are rare.
      *   *Option B: Buy Unconditionally.* Risky. £26k is a lot. If they are fakes or just scrap metal, it's a waste. The "Shopkeeper" narrative might be wrong.
      *   *Option C: Buy Conditional (Escrow/Phased).* Best approach. Secure the items (prevent export/loss) but hold back some payment or designate funds for testing before finalizing the *interpretation*. However, museum acquisitions usually require full payment to secure title. A better conditional approach is: *Buy, but designate a portion of the budget for immediate testing before public interpretation is fixed.*
      *   *Refined Recommendation:* **Buy, but withhold final interpretive labeling until specific tests are completed.** This balances the risk of loss (if we don't buy) with the risk of embarrassment (if we label them wrong). It acknowledges the budget hit but prioritizes the core mission (preservation).

  3.  **Drafting the Memo - Structure:**

      *   **Header:** To, From, Date, Subject.
      *   **Executive Summary:** The bottom line recommendation.
      *   **The Object & Cost:** Brief facts.
      *   **The Arguments (Fair Hearing):** Curator, Hal, Finds Officer, Flo, Forgery Risk.
      *   **The Recommendation (The "Ask"):** Purchase authorization + Testing budget.
      *   **Interpretive Guidelines:** What we can/cannot say on the label.
      *   **Testing Plan:** What tests, cost, success criteria.
      *   **Appendix/Note to Board Member (User):** Distinguishing fact from contention (as requested in the prompt's meta-instruction).

  4.  **Drafting Content - Key Considerations:**

      *   *Tone Check:* Needs to sound like a print shop owner (pragmatic, clear) but respectful of the museum context. Not overly academic, but not dismissive.
      *   *The "Air" Factor:* Avoid saying "This is definitely X." Use "Evidence suggests," "Risk remains."
      *   *The Budget:* Acknowledge the schools programme hit. Suggest mitigating (maybe find sponsorship for schools later, but don't promise).
      *   *The Forgery Risk:* Must be addressed. Metal analysis is crucial.
      *   *The "Doubler's Argument":* This is a strong statistical point. Needs statistical verification.
      *   *The "Ritual vs. Trade":* This is the core archaeological debate.

  5.  **Refining the "Split" (Solid vs. Contested):**

      *   *Solid:* They exist, they are bronze, they weigh roughly 8/17/25g, they were found in a pit with hazelnuts (Iron Age context), no wear marks.
      *   *Contested:* What they *did*. Trade vs. Ritual vs. Harness. Are they a standard or just convenient lumps? Are they fake?
      *   *The "Killer" Evidence:* Metal composition (alloy consistency) and microscopic use-wear.

  6.  **Writing the Memo (Iterative Process):**

      *   *Opening:* Keep it direct. "Recommendation: Purchase subject to..."
      *   *Arguments:* Summarize Curator (Trade), Hal (Ritual/Unused), Finds Officer (Coincidence), Flo (Harness), User (Forgery). Give each their due. Hal's point about condition is strong. Curator's point about ratios is strong.
      *   *Decision:* We buy to save them for the district. But we don't commit to the story yet.
      *   *Labeling:* "Possible Weights" not "The First Shopkeepers."
      *   *Testing:* XRF (metal), Microscopy (wear), Statistical analysis (weight spread).
      *   *Meta-Commentary:* The prompt asks me to write the memo *and* tell the user which parts are solid/contested. I should include this as a separate section or a cover note. The prompt says: "I'd like you to mark that split honestly... so I'd like you to mark that split honestly." I will integrate this as a "Board Member's Note" attached to the memo, or distinct sections within the memo that highlight the uncertainty. Actually, the prompt asks for the memo *to put in front of the board*, but also says "I need to know which parts of your reasoning are solid... mark that split."
      *   *Strategy:* I will write the Memo as it should appear to the Board (professional, transparent about uncertainty). Then, I will add a **Private Annex** specifically for the User (the print shop owner) that breaks down the "Backstage" reality of the arguments (what experts fight about vs. what is fact). This satisfies the dual audience requirement best.

  7.  **Review against Constraints:**

      *   *Clear bottom line?* Yes (Buy + Test).
      *   *Fair run at losing arguments?* Yes (Hal's ritual theory gets space).
      *   *Label claims?* Yes (Specific wording).
      *   *Testing plan?* Yes (Microscopy, XRF, Stats).
      *   *Evidence thresholds?* Yes (What proves/disproves).
      *   *Mark the split?* Yes (In the Private Annex).
      *   *Tone:* Not "decisive and air."

  8.  **Final Polish:**

      *   Ensure the £26k vs £9k trade-off is acknowledged explicitly.
      *   Make sure the "Doubler's Argument" is explained simply.
      *   Check the date (Meeting on the 2nd).
      *   Ensure the forgery risk is mitigated in the plan.

      *(Self-Correction during drafting)*: I need to make sure I don't sound *too* technical in the main memo. The board includes retired teachers and surveyors, not just archaeologists. Keep the science explanations accessible. In the Private Annex, I can be more blunt about the professional disagreements.

      *(Refining the Recommendation)*: If we buy, the money is gone. The schools programme is cancelled. I need to be honest about that. I can't promise the schools money will be found elsewhere. I must recommend the acquisition *despite* the cost, arguing that unique heritage outweighs a one-year programme delay.

      *(Refining the "Doubler's Argument")*: This is about whether 8, 16, 24 (roughly) is a standard or just human ergonomics. The test is statistical deviation.

      *(Refining the Forgery)*: If metal analysis shows modern alloys (zinc levels, etc.), it's a fake. This is the most critical test.

      *(Final Plan)*:
      1.  Main Memo (for the Board).
      2.  Private Annex (for the User/Print Shop Owner).

