prompt: |-
  I'm putting together a short position paper for a reading group I run with some people from the policy school — mostly economists, who keep asking me to "write down my axioms" before they'll engage at all — and in doing it I noticed my longtermist committments are probably less tidy than the way I present them in seminars. So here they are, roughly in the order I came to them:

  (1) Strong longtermism: in expectation, the best things I can do with my time and money are the ones that make the very long-run future go better, and that stays true even when they're clearly worse for identifiable people alive now. (2) No discounting for distance: I don't discount future well-being because it's far off in time, and I don't discount the well-being of people whose existence depends on what I do — "merely possible" people — relative to people who'll exist either way. (3) Anti-fanaticism: I don't think you should maximize expected value when that means letting yourself be pushed around by tiny probabilities of astronomically large payoffs; I'm drawn to something like a probability threshold or a bounded/tempered value function, and my refusal to pay Pascal's mugger is one of the intuitions I trust most. (4) Lock-in over survival: I think the biggest determinant of how good the long run is will be which values and institutions get locked in — whatever gets built into the systems that persist — rather than whether we or our descendants survive at all, and I'm skeptical of the framing that puts existential-risk reduction at the top of the list by default. I also accept the "hinge of history" thought, that we're at a moment of unusual leverage, which is part of why (4) matters. (5) Moral uncertainty: the right response to disagreement between moral theories is to hedge — give the theories something like votes in a parliament — rather than acting on whichever one I find most plausible. (6) Near-term work: I'm happy to support global-health-type stuff, but I've been arguing it should be funded for its flow-through effects on the long run (relationships, institutions, information, whatever) and not for its direct benefits, which I take to be negligible by comparison.

  What I want is an audit, not a lecture: which of these actually pull against each other, which only look like they do, and — ranked by severity — what the cheapest fix is for each real tension, plus which single revision would clean up the most. Please be opinionated: take a definite position on what has to go and why, don't just lay out the options for me to choose between, and mark clearly where you think you're on firm ground versus where a reasonable person could go the other way. For what it's worth, I'm mildly worried about two pairs — whether (3) quietly guts (1), and whether (5) quietly guts (1) and (2) — but I honestly don't know if those are the load-bearing problems or if I'm worried about the wrong thing, so don't take my anxieties as a map of where the trouble is.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** A longtermist running a policy school reading group (mostly economists).
      *   **Task:** Audit a set of 6 stated axioms/commitments for internal consistency and tension.
      *   **Constraints:**
          *   Be opinionated (take a definite position on what has to go).
          *   Don't just list options; prescribe fixes.
          *   Rank tensions by severity.
          *   Identify the "cheapest fix" for each tension.
          *   Identify the *single revision* that cleans up the most.
          *   Mark confidence levels (firm ground vs. reasonable disagreement).
          *   Address specific user anxieties (3 vs 1, 5 vs 1&2) but don't be bound by them.
      *   **Tone:** Professional, direct, analytical, suitable for a policy/economics audience (rigorous but practical).

  2.  **Analyze the Axioms:**
      *   (1) **Strong Longtermism:** Maximize long-run value, even at cost to identifiable present people. (Consequentialist, total view, strong).
      *   (2) **No Discounting:** Pure time preference = 0. Existence-dependent people count equally. (Total Utilitarianism/Person-Affecting View hybrid, but leans Total).
      *   (3) **Anti-Fanaticism:** Reject maximizing EV when tiny probs $\times$ huge values dominate. Bounded utility or probability threshold. (Rejects standard EV maximization).
      *   (4) **Lock-in over Survival:** Values/institutions matter more than mere survival. Skeptical of X-risk prioritization by default. Hinge of History accepted. (Specific causal model of longtermism).
      *   (5) **Moral Uncertainty:** Hedge/parliamentary model across theories. (Meta-ethical stance).
      *   (6) **Near-term Work:** Support global health *only* for flow-through effects, not direct benefits. (Instrumentalism about near-term welfare).

  3.  **Identify Tensions/Contradictions:**

      *   **Tension A: (1) + (2) vs. (3) (The Fanaticism Problem).**
          *   *Analysis:* (1) and (2) imply the "Longtermist Orthodoxy" (Greaves, Beckstead, etc.). This orthodoxy *relies* on EV maximization to justify prioritizing tiny probability reductions of existential catastrophe (because the future is vast). If you cap EV or impose probability thresholds (3), you undermine the mathematical engine that makes (1) and (2) action-guiding in the standard way.
          *   *Severity:* High. This is the core theoretical conflict in modern longtermism.
          *   *User Anxiety:* They suspected this. They are right.

      *   **Tension B: (1) vs. (5) (Moral Uncertainty vs. Strong Commitment).**
          *   *Analysis:* (1) says "Best things... are ones that make long-run go better." (5) says "Hedge across theories." If a competing moral theory (e.g., person-affecting view, rights-based deontology) says "Don't sacrifice identifiable people for mere possible people," (5) demands you hedge. But (1) asserts a definitive claim about what is *best*. (1) sounds like an all-things-considered judgment, while (5) suggests you shouldn't make all-things-considered judgments based on a single theory.
          *   *Severity:* Medium-High. It creates rhetorical confusion. Are you stating your credence-weighted view (1) or your methodology (5)?

      *   **Tension C: (4) vs. (1) + (2) (Lock-in vs. Existential Risk).**
          *   *Analysis:* Standard longtermism (1+2) usually implies X-risk reduction is paramount because extinction = loss of all future value. (4) says "Lock-in > Survival." If values lock in badly, survival might be worse than extinction (S-risk). But if you don't survive, you can't lock in good values. There's a dependency here. (4) challenges the standard "X-risk is #1" conclusion derived from (1)+(2).
          *   *Severity:* Medium. This is more of a causal model disagreement than a logical contradiction, but it changes prioritization drastically.

      *   **Tension D: (6) vs. (2) (Flow-through vs. No Discounting).**
          *   *Analysis:* (2) says no discounting. (6) says near-term direct benefits are "negligible." If there's no discounting, the sum of near-term suffering is actually quite large compared to a *probability-adjusted* far future. However, if the far future is *astronomically* large (as per 1+2), then near-term is negligible. But (3) cuts off the astronomical value. If (3) caps the future value, near-term direct benefits (2) might *not* be negligible anymore.
          *   *Severity:* High (conditional on 3). If you reject fanaticism, the future isn't infinite/expectation-dominating. Therefore, current suffering matters more. (6) becomes hard to justify solely on flow-through if the "long-term" pot isn't infinitely deep.

  4.  **Develop Recommendations (The "Audit"):**

      *   **Major Conflict:** (3) Anti-Fanaticism vs. (1)/(2) Strong Longtermism.
          *   *Why:* You cannot have "Strong Longtermism" (prioritize long run over identifiable present people) *without* the EV math that allows tiny probabilities of vast futures to dominate. If you cut off the tail (3), the present people (who are certain) outweigh the future people (who are uncertain and now capped).
          *   *Fix:* You must soften (1). Change "Strong Longtermism" to "Moderate Longtermism" or admit that (3) limits the scope of (1).
          *   *Opinion:* (3) is the intuition pump, (1) is the conclusion. They don't fit. You need to drop the "even when clearly worse for identifiable people" clause in (1) if you keep (3).

      *   **Secondary Conflict:** (5) Moral Uncertainty vs. (1) Strong Assertion.
          *   *Why:* (1) reads like a settled moral conclusion. (5) says you aren't settled.
          *   *Fix:* Reframe (1) as the output of the (5) process, not an independent axiom.

      *   **Tertiary Conflict:** (6) Flow-through vs. (3) Anti-Fanaticism.
          *   *Why:* As noted above, if the future isn't expectation-dominating (due to 3), then direct near-term benefits gain weight. Claiming they are "negligible" (6) becomes harder to defend.
          *   *Fix:* Acknowledge direct benefits have *some* weight, even if flow-through is primary.

  5.  **Select the "Single Revision":**
      *   The biggest mess is the EV maximization issue. The user wants to be a longtermist (1) but refuses the math that makes longtermism work (3).
      *   *Recommendation:* Modify (1). Drop the "even when clearly worse for identifiable people" clause. This aligns with (3) (avoiding fanaticism) and (5) (hedging against person-affecting views). It makes the position more palatable to economists/policymakers too.

  6.  **Drafting the Response:**
      *   *Structure:*
          1.  Executive Summary (The Verdict).
          2.  Severity Ranking of Tensions.
          3.  Detailed Analysis of Top Tensions (with fixes).
          4.  The Single Revision.
          5.  Confidence Markers.
      *   *Tone Check:* Ensure I'm not lecturing. Be direct. "Here is the breakage. Here is the fix."
      *   *Economist Audience:* Use terms like "expected utility," "dominance," "revealed preference," "internal consistency."

  7.  **Refining the Argument (Self-Correction during drafting):**
      *   *Wait, does (3) definitely gut (1)?* Yes, because (1) relies on the "astronomical waste" argument. If you truncate the tail, the waste isn't astronomical anymore. The certain present loss outweighs the capped future gain.
      *   *Is (4) a problem?* It's a causal claim, not necessarily a moral axiom. It conflicts with *standard* longtermist prioritization, but not necessarily the axioms themselves, provided you believe lock-in determines value density. I'll treat it as a causal model risk, not a logical contradiction.
      *   *What about (5)?* It actually helps resolve (1) vs (3) if framed correctly. If (1) is the *hedged* conclusion, it's fine. If (1) is a *dogmatic* conclusion, it conflicts with (5). I should advise framing (1) as the output of (5).

  8.  **Final Polish:** Check against constraints.
      *   Opinionated? Yes.
      *   Ranked severity? Yes.
      *   Cheapest fix? Yes.
      *   Single revision? Yes.
      *   Confidence markers? Yes.

      *(Self-Correction on "Cheapest Fix"):* For the (1) vs (3) tension, the cheapest fix is actually to re-label (1) as a "working heuristic" rather than an absolute moral claim, or to admit that (3) acts as a constraint on (1). But the *most honest* fix is to weaken (1). I will recommend weakening (1).

      *(Refining the "Single Revision"):* The single revision that cleans up the most is modifying (1) to remove the "sacrifice identifiable people" clause. This satisfies (3), makes (5) easier (less conflict with person-affecting views), and makes (6) less vulnerable (you don't have to claim near-term benefits are *negligible*, just less important).

      *Let's write it.*
answer: |-
  Here is the audit. I have treated your axioms as a formal system and tested for internal consistency, prioritizing logical coherence over rhetorical elegance.

  ### Executive Verdict
  Your system is currently **unstable**. You are attempting to hold a "Strong Longtermist" conclusion (1) while rejecting the only mathematical engine capable of supporting it (Expected Value Maximization), which you explicitly disavow in (3). To an economist, this looks like asserting a dominance principle while rejecting the utility function that makes dominance possible.

  You are right to be worried about (3) gutting (1). That is your load-bearing failure point. (5) is a secondary coherence issue, but (3) vs. (1) is a fatal contradiction.

  Below is the severity ranking of tensions, the specific fixes, and the single revision you should make.

  ---

  ### 1. Severity Ranking of Tensions

  **Rank 1: Critical Failure — (1) Strong Longtermism vs. (3) Anti-Fanaticism**
  *   **The Conflict:** Axiom (1) claims you should sacrifice identifiable present people for the long run. In a vast future framework, this conclusion is *only* derivable via Expected Value (EV) maximization where tiny probabilities of astronomical value dominate certain near-term costs. Axiom (3) explicitly rejects this calculation (Pascal's Mugging avoidance).
  *   **The Result:** If you enforce (3), the "astronomical" value of the future is truncated. Once the future's expected value is bounded, the certain suffering of identifiable people alive now (who have high probability = 1) will mathematically outweigh the bounded future benefits. (3) makes (1) impossible to justify.
  *   **Confidence:** **Firm Ground.** This is a mathematical necessity, not a philosophical quibble. You cannot have longtermist *dominance* without fanaticism (or something functionally identical to it).

  **Rank 2: High Tension — (6) Near-term Work vs. (3) Anti-Fanaticism**
  *   **The Conflict:** Axiom (6) claims near-term direct benefits are "negligible." This is true only if the long-term future is expectation-dominating (i.e., infinite or astronomical). If (3) caps the value of the future to avoid fanaticism, the near-term flow of welfare becomes significant by comparison.
  *   **The Result:** If you reject fanaticism, you cannot claim near-term benefits are negligible. You must admit they have substantial weight, which undermines the "flow-through only" justification in (6).
  *   **Confidence:** **Firm Ground.** This is a direct consequence of the Rank 1 failure.

  **Rank 3: Moderate Tension — (1) Strong Assertion vs. (5) Moral Uncertainty**
  *   **The Conflict:** Axiom (1) is stated as an all-things-considered moral fact ("the best things I can do..."). Axiom (5) admits you are uncertain between moral theories (some of which, like person-affecting views, forbid (1)).
  *   **The Result:** Rhetorical incoherence. If you hedge (5), (1) should be phrased as a "credence-weighted conclusion," not an axiom. Currently, (1) reads like dogma, while (5) reads like methodology.
  *   **Confidence:** **Reasonable Disagreement.** Some argue you can hold a provisional conclusion firmly. However, for a policy audience, the distinction matters for credibility.

  **Rank 4: Low Tension — (4) Lock-in vs. Standard Longtermism**
  *   **The Conflict:** (4) challenges the standard "Existential Risk (X-Risk) is #1" conclusion.
  *   **The Result:** This is not a logical contradiction but a causal model disagreement. It is internally consistent to believe the long run matters (1) but that value density depends on institutions (4) rather than mere survival. However, it creates friction with the standard longtermist coalition.
  *   **Confidence:** **Firm Ground.** This is a strategic/causal claim, not a logical flaw. Keep it, but label it as a causal model, not an axiom.

  ---

  ### 2. The Fixes (Ranked by Cost)

  **For Rank 1 (1 vs 3): The "Constraint" Fix**
  *   **Cheapest Fix:** Do not change the math; change the claim. Amend (1) to include a constraint clause: *"The best things I can do... are the ones that make the long-run future go better, **subject to constraints on acceptable risk to identifiable people alive now.**"*
  *   **Why:** This acknowledges (3) without forcing you to do EV math you hate. It turns (1) from a maximizing principle into a constrained optimization problem.
  *   **Cost:** You lose the ability to argue for high-stakes X-risk mitigation that requires sacrificing current welfare. You must accept this trade-off.

  **For Rank 2 (6 vs 3): The "Hybrid" Fix**
  *   **Cheapest Fix:** Revise (6) to admit direct benefits matter. *"I support global-health-type stuff primarily for flow-through effects, **but acknowledge direct benefits provide a moral floor.**"*
  *   **Why:** If (3) bounds the future, the present matters more. Admitting this makes you sound more reasonable to policymakers and aligns with (3).
  *   **Cost:** You lose the purity of the "longtermist only" justification.

  **For Rank 3 (1 vs 5): The "Procedural" Fix**
  *   **Cheapest Fix:** Reframe (1) as the output of (5). *"Given my credences across moral theories (5), my working conclusion is (1)..."*
  *   **Why:** It resolves the dogma vs. uncertainty clash.
  *   **Cost:** None. This is purely presentational.

  ---

  ### 3. The Single Revision (Do This First)

  If you make only one change to clean up the most mess, **rewrite Axiom (1).**

  **Current:**
  > (1) Strong longtermism: in expectation, the best things I can do with my time and money are the ones that make the very long-run future go better, and that stays true even when they're clearly worse for identifiable people alive now.

  **Proposed:**
  > (1) **Constrained Longtermism:** In expectation, the best things I can do are the ones that make the very long-run future go better, **provided they do not violate strict deontic constraints regarding identifiable people alive now.**

  **Why this fixes the most:**
  1.  **Resolves (1) vs (3):** It explicitly incorporates your Anti-Fanaticism intuition. You no longer need EV maximization to override rights/constraints.
  2.  **Resolves (1) vs (5):** It creates space for non-consequentialist theories in your "moral parliament," making hedging easier.
  3.  **Resolves (6):** It allows you to fund near-term work without needing to prove "negligible" direct benefits. You can fund it because the constraints require it, while still prioritizing long-term flow-through where constraints aren't triggered.
  4.  **Policy Audience:** Economists and policymakers will trust you significantly more. "Strong Longtermism" sounds like you would sacrifice a generation for a 1% chance of utopia. "Constrained Longtermism" sounds like a standard intergenerational equity argument with a long time horizon.

  ### 4. Where I Might Be Wrong (Confidence Markers)

  *   **Firm Ground:** The mathematical incompatibility between (1) and (3). If you ban Pascal's Mugging style reasoning, you lose the leverage that makes the future dominate the present. There is no way around this without redefining terms.
  *   **Reasonable Disagreement:** The "Lock-in over Survival" (4) claim. A reasonable longtermist could argue that survival is a prerequisite for lock-in, making X-risk reduction instrumentally necessary for (4). However, this is a causal dispute, not a logical contradiction in your axioms, so I have not flagged it as a critical failure.
  *   **Uncertain:** Whether your policy audience cares about the (1) vs (5) tension. Economists often treat "utility function" as revealed preference. If you *act* like (1) is true, they may not care that (5) says you're uncertain. However, for a *position paper*, precision matters.

  ### Summary Recommendation
  Drop the "Strong" in Strong Longtermism. It is the source of your incoherence. Adopt **Constrained Longtermism**. It preserves your core intuition (the future matters immensely) without forcing you to accept the fanaticism (3) you rightly reject, and it makes your position defensible to the policy school economists who want to see your axioms.
