prompt: |-
  hey — I'm the undergrad rep on our university's Animal Care & Research Ethics Committee (they let one of us on, mostly to take minutes), and we've got a case nobody knows what to do with, and of course it landed the same week as my midterm for PHIL 240 (minds & machines, we're on moral status right now). I have to circulate a draft written opinion before Tuesday's meeting and I genuinely don't know what to recommend, so: be the person who drafts it.

  The case: the Vollmer lab submitted what they call an "amendment for determination of scope." They aren't asking us to approve anything; they want us to rule whether their project is our jurisdiction at all. They run a digital emulation of a nematode nervous system — 302 neurons, full connectome, simulated body, simulated chemical gradient. Open-source worm sims have been around for years; this is their own tuned version. They use it to study learning: the thing habituates, it does aversive conditioning, they can lesion individual neurons. What they want to do next is where it gets messy:

  (1) run it at roughly 400x real time, in 500 parallel copies, for statistics;
  (2) run a "valence-off" variant where they knock out the neuromodulatory system that does approach/avoidance in the real animal, on the grounds that without it there's nothing the emulation is doing that could matter to it;
  (3) run a "table mode" variant: instead of integrating the dynamics at runtime they precompute the whole input–output function into a lookup table, so at runtime it's just a giant memory read. Their argument is: if what matters morally is the computation in the abstract, table mode is the same computation and has to be treated identically; if we want to treat it differently, we owe them an account of what we think we're protecting, and "causal oomph" isn't an answer until we say why the oomph matters.

  Our policy covers "non-human animals," defined by reference to vertebrates and cephalopods — so strictly speaking none of this is covered. But there's a clause about novel preparations, and the chair wants a real answer rather than a definitional dodge, because the PIs have said (very politely) that if we rule it out on the taxonomic definition they'll just do it anyway, and we'll have taught everyone that our jurisdiction is a technicality.

  Two more things from the last meeting that I think are actually the crux:

  - Prof. Adeyemi raised the incentive problem: the better their emulation is — the more it learns, the more wormlike it behaves — the more likely we are to say it's covered. So our ruling hands them a reason to keep the model bad, or at least to not probe it very hard. Half the room says that's a publication-integrity problem and not ours. The other half says a rule that rewards making your model worse is a bad rule.
  - The counting problem. If it is covered, what's the unit? One subject per emulation? Per copy? Per hour of simulated time (in which case 400x speed is 400x the animal-hours and their protocol is enormous)? Someone said per-copy, but also that running the identical emulation twice might be the same subject twice over rather than two subjects, and I can't tell if that makes it better or worse. Related: two members disagreed about whether we should go by how it behaves or by what's going on structurally inside it, and I don't think they noticed how much rides on which one we pick.

  What I need: a short written opinion I can circulate. Recommend one of — (a) decline jurisdiction, with a short explanation that isn't just the definition; (b) assert jurisdiction and require a full protocol with named conditions; (c) assert jurisdiction over some variants and not others, saying which — and give a timeline (what has to happen by when, and what happens if it doesn't). It has to give the Vollmer lab something they can actually respond to rather than "it depends on your metaphysics." And it should take the strongest argument against your own recommendation seriously: I'd guess for (b) that's the "you're regulating a spreadsheet" line, and for (a) it's the incentive thing, but say whichever it actually is.

  Last thing: I'm supposed to flag where I think the committee is posing the question badly. If "is it sentient" is the wrong frame — if it should be something like how much moral risk there is and who carries the burden of proof under uncertainty — say so and reframe it. But definitely don't just reframe it, I still need a bottom line by Tuesday.
reasoning: |-
  Here's a thinking process that leads to the suggested draft opinion:

  1.  **Analyze the Request:**
      *   **Role:** Undergrad rep on Animal Care & Research Ethics Committee (ACREC).
      *   **Task:** Draft a written opinion for circulation before Tuesday's meeting regarding the Vollmer Lab's "amendment for determination of scope."
      *   **Context:** The lab simulates a *C. elegans* nervous system (302 neurons). They want to run it fast, in parallel, with variants (valence-off, table mode).
      *   **Policy:** Covers vertebrates and cephalopods. This is neither. But there's a "novel preparations" clause.
      *   **Key Issues:**
          *   Jurisdiction (Taxonomy vs. Function).
          *   Incentive Problem (Don't make the model too good).
          *   Counting Problem (What is a "subject"?).
          *   Metaphysics (Computation vs. Causal Oomph).
      *   **Requirements:**
          *   Recommend one of three options: (a) Decline jurisdiction, (b) Assert jurisdiction (full protocol), (c) Assert jurisdiction (partial/variant-specific).
          *   Include a timeline/consequences.
          *   Address the strongest counter-argument.
          *   Flag where the committee is asking the wrong question (reframe if necessary, but provide a bottom line).
          *   Tone: Professional, ethically rigorous, actionable, suitable for an undergrad rep (smart but respectful of hierarchy).

  2.  **Determine the Recommendation:**
      *   *Option (a) Decline:* Easy, but ignores the "novel preparations" clause and the Chair's concern about jurisdiction being a technicality. It also ignores the moral risk if the emulation *does* have some status.
      *   *Option (b) Assert Full Jurisdiction:* Treats the sim exactly like a biological worm. This triggers the "regulating a spreadsheet" critique hard. It creates massive administrative burden for potentially non-sentient code. It exacerbates the counting problem (400x speed = 400x animal hours?).
      *   *Option (c) Assert Partial Jurisdiction (Hybrid):* This seems the most nuanced. It acknowledges moral risk without equating code to flesh. It addresses the specific variants (Valence-off, Table mode).
      *   *Decision:* **Option (c)** is the strongest ethical position. It allows research to proceed but imposes safeguards on the high-risk variants. It addresses the "incentive problem" by setting clear functional thresholds rather than punishing accuracy. It tackles the "counting problem" by defining the unit of moral concern based on *independent instantiation* rather than runtime speed.

  3.  **Address the "Wrong Question" (Reframing):**
      *   The committee is asking "Is it sentient?" or "Is it an animal?"
      *   *Reframe:* Under uncertainty, the question should be "What is the moral risk, and who bears the burden of proof?" (Precautionary Principle). We shouldn't need to prove sentience to apply safeguards; we should require the researchers to demonstrate *lack* of morally relevant capacity before proceeding with high-risk manipulations.
      *   *Specific Reframe:* Move from "Taxonomic Status" to "Functional Capacity & Moral Risk."

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Executive Summary/Bottom Line:** State the recommendation clearly upfront (Option C).
      *   **Reframing the Question:** Address the prompt's requirement to flag where the committee is posing the question badly. Shift from "Is this an animal?" to "Does this warrant precautionary oversight?"
      *   **Analysis of Variants:**
          *   *Standard Sim:* High fidelity. Needs oversight.
          *   *Valence-off:* Lower risk. Maybe exempt or light touch.
          *   *Table Mode:* Philosophical tricky. If it's just a lookup, is there experience? Argue for exemption based on lack of dynamic processing, but note the risk if the table was generated by a sentient process (not the case here).
      *   **Addressing Key Problems:**
          *   *Incentive Problem:* Set thresholds based on *behavioral complexity*, not just "worm-likeness." Don't punish accuracy, punish specific high-risk capabilities (e.g., pain-avoidance learning).
          *   *Counting Problem:* Define "Subject" as a unique instantiation (seed). Runtime speed doesn't multiply moral weight (time doesn't equal suffering in sim). Parallel copies *are* distinct subjects.
      *   **Counter-Argument:** Address the "Regulating a Spreadsheet" objection. Acknowledge it but argue that functional isomorphism creates moral risk that warrants verification.
      *   **Timeline/Consequences:** Give them 30 days to submit a modified protocol. If not, the default is full oversight or project halt (under the novel preparations clause).

  5.  **Refining the Tone:**
      *   Needs to sound like a thoughtful undergrad rep, not a tenured ethicist. Confident but deferential to the committee's authority.
      *   Avoid overly dense jargon, but show engagement with PHIL 240 concepts (functionalism, substrate independence).
      *   Ensure the "novel preparations" clause is the legal hook.

  6.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is Option C too complicated?
      *   *Fix:* Simplify the criteria. Focus on the "Valence" aspect. If it can't feel "bad," risk is lower.
      *   *Critique:* Did I address the Table Mode argument?
      *   *Fix:* Yes, need to explicitly state that Table Mode is functionally equivalent in output but potentially distinct in *process*. I will recommend exemption for Table Mode *if* the lookup table is static, but oversight for the generation process if it involved learning. (Wait, the prompt says they precompute the function. So the *runtime* is dumb. I should recommend exempting the runtime but overseeing the *creation* if that involved the standard sim).
      *   *Critique:* The Counting Problem.
      *   *Fix:* Be decisive. 1 Seed = 1 Subject. Speed is irrelevant to moral status.
      *   *Critique:* The Incentive Problem.
      *   *Fix:* Acknowledge it. Propose that oversight is triggered by specific *capabilities* (e.g., nociception), not general accuracy. This encourages accurate models that lack the specific risky trait.

  7.  **Final Polish:** Check against all constraints in the prompt.
      *   Short written opinion? Yes.
      *   Recommend a/b/c? Yes (C).
      *   Timeline? Yes.
      *   Strongest counter-argument? Yes ("Regulating a spreadsheet").
      *   Flag bad questioning? Yes (Sentience vs. Risk).
      *   Bottom line by Tuesday? Yes.

  8.  *(Self-Correction on Tone)*: Make sure I don't sound *too* authoritative. I am the undergrad rep. Use phrases like "I recommend," "For the committee's consideration," rather than "The committee shall."

  9.  *(Final check on the Table Mode)*: The prompt says "if what matters morally is the computation in the abstract, table mode is the same computation." This is a functionalist argument. If I reject it, I need a reason. The reason is *causal dynamics*. A lookup table doesn't process; it retrieves. If moral status requires *process* (like integrated information or dynamic causal power), the table is safe. I will lean on the "dynamic processing" requirement.

  10. *(Final check on Counting)*: 500 parallel copies. Are they 500 subjects? Yes, distinct initial conditions/seeds. Running the *same* seed twice? That's replication, not new subjects. I need to be clear: Unique instantiation = Subject.

  Let's write it.cw
answer: |-
  **MEMORANDUM**

  **TO:** Animal Care & Research Ethics Committee (ACREC)
  **FROM:** [Your Name], Undergraduate Representative
  **DATE:** Monday, October 23
  **SUBJECT:** Draft Opinion: Vollmer Lab Determination of Scope (Neural Emulation)

  **1. Bottom Line Recommendation**
  I recommend **Option (C): Assert jurisdiction over specific variants, with exemptions for others.**

  Specifically:
  *   **Standard Emulation:** Subject to full ACREC protocol (treated as a "novel preparation" under Section 4.2 of policy).
  *   **"Valence-Off" Variant:** Exempt from full protocol, provided the knock-out of the approach/avoidance system is verified by a third-party code audit.
  *   **"Table Mode" Variant:** Exempt from animal-care protocol, as the runtime lacks dynamic processing.

  **Timeline:** The Vollmer Lab must submit a modified protocol reflecting these distinctions within **30 days**. Failure to do so results in a default classification of "Full Jurisdiction" under the novel preparations clause, halting the parallel runs until compliance is met.

  **2. Reframing the Question**
  The committee is currently asking: *"Is this emulation an animal?"* or *"Is it sentient?"*
  This is the wrong frame. We cannot verify sentience in biological animals with certainty, let alone code. Asking for proof of status creates a burden of proof we cannot meet.

  **The Correct Frame:** *"Given the uncertainty of moral status, where does the moral risk lie, and who bears the burden of proof?"*
  We should apply a **Precautionary Principle**. If a system functionally mimics a creature capable of suffering (habituation, aversive conditioning), the burden shifts to the researchers to demonstrate *why* it does not warrant protection. We are not regulating "spreadsheets"; we are regulating *functional isomorphs* of protected organisms.

  **3. Analysis of Variants & Counting**
  *   **Standard Emulation:** Because the system exhibits aversive conditioning and learning, it crosses the threshold for moral risk. It falls under "novel preparations."
  *   **Valence-Off:** If the neuromodulatory system for approach/avoidance is truly disabled, the system cannot "care" about outcomes. The moral risk is negligible. Exemption is appropriate here, contingent on verification.
  *   **Table Mode:** The PIs argue that abstract computation is what matters. However, moral status likely requires *causal dynamics*, not just input-output mapping. A lookup table does not process; it retrieves. Unless the table was generated by a sentient process (it was not), the runtime instance has no capacity for experience. Exempt.

  **The Counting Problem:**
  *   **Unit of Subject:** One unique instantiation (seed) = One subject.
  *   **Parallel Copies:** 500 parallel copies with distinct seeds = 500 subjects.
  *   **Runtime Speed:** 400x speed does **not** equal 400x animal-hours. Suffering (if possible) is tied to computational steps/state changes, not wall-clock time. Accelerating the simulation does not compress moral weight.

  **4. Addressing the Incentive Problem**
  Prof. Adeyemi is correct: if accuracy triggers regulation, researchers are incentivized to build worse models.
  **Solution:** Regulation should be triggered by *specific high-risk capabilities* (e.g., nociception, persistent avoidance learning), not general fidelity. This encourages the lab to build accurate models that lack the specific architectures associated with suffering. We reward *ethical design*, not model degradation.

  **5. Strongest Counter-Argument**
  **Objection:** *"You are regulating a spreadsheet. This sets a precedent where any complex algorithm requires ethics approval."*
  **Response:** This is a valid concern regarding scope creep. However, this ruling is explicitly limited to **whole-nervous-system emulations of protected taxa**. We are not regulating AI generally; we are regulating digital twins of organisms we already deem morally significant. The "novel preparations" clause exists precisely for technology that outpaces taxonomy. If we decline jurisdiction now, we admit our policy is obsolete.

  **6. Next Steps**
  I move that we adopt this framework for the Tuesday vote. If the committee prefers Option (A) (Decline Jurisdiction), I request we formally amend the policy to exclude *all* in silico models, rather than relying on a taxonomic technicality that the Vollmer Lab has already indicated they will bypass.

  Respectfully submitted,

  [Your Name]
  Undergraduate Representative, ACREC
