prompt: |-
  ok so I'm trying to figure out my actual stance on whether cross-cultural moral disagreement undermines objectivity, going by gut reactions to cases. When WEIRD subjects and some East Asian groups split on the footbridge trolley thing - pushing vs not pushing - I think thats just diffrent emotional framing, not a real moral conflict, so objectivity is safe. Same with lying to a dying patient: one culture prioritizes truth, another comfort, but I think they're weighing the same values with diffrent beliefs about death, so still not a threat. But honor killings vs universal human rights feels like a straight contradiction, which makes me doubt there's one right answer. Then I have this weird hypothetical I made up to test myself - call it 'moral outsourcing', where a culture delegates all personal moral choice to a ritual elder so individuals feel zero direct obligation. I keep going back and forth on whether thats just an institutional arrangement or proof morality is purely social structure. The case that really bugs me is this inverted-kinship scenario: a society where obligations are strongest to distant strangers and weakest to family, grounded in a belief that proximity corrupts moral purity. Is that a deep value split or just a strange factual belief about corruption? If I say disagreement only threatens objectivity when it survives shared facts and shared concepts, does that save my footbridge verdict but force me to treat honor killings as also fake disagreement? Or do I have to drop my flip-flop on moral outsourcing? What's the principle, and which of my gut calls does it have to kill?
