  **Decision Matrix**
  *   **States:** Death in Damascus ($D$), Death in Aleppo ($A$).
  *   **Acts:** Stay ($S$), Go ($G$).
  *   **Payoffs:** Survival ($1$), Death ($0$), Travel Cost ($-c$).
  *   **EDT:** $P(D|S) \approx 1$, $P(A|G) \approx 1$. Expected Utility equal (minus cost).
  *   **CDT:** $P(D)$ independent of Act. Expected Utility($G$) > Expected Utility($S$) by $c$.

  **Audit**
  Your intuition is correct: the backwards causation claim is simply false. EDT posits correlation via a common cause (Death's prediction), not that your choice reaches back to fix the book. Conflating evidential dependence with causation is the blog's error, not EDT's.

  The "CDT gets it right" claim makes experts wince. Standard CDT faces deliberative instability here (Gibbard & Harper): if you lean toward going, you infer Death is in Aleppo, making staying optimal. CDT cannot recommend going without assuming priors fixed independent of deliberation, which ignores the core instability problem.

  The medical case analogy is tendentious. In smoking lesion cases, EDT says don't smoke (bad news), CDT says smoke (causally harmless). The blog claims CDT is right there too. This isn't a neutral lesson; it's a specific causalist argument contested by evidentialists who argue rationality tracks news in medical cases. The conclusion doesn't follow from accurate parts; it assumes CDT is universally correct, which is the point in dispute.

  "Nobody defends EDT" is empirically wrong; robust defenses exist. The "50-50" talk assumes priors remain fixed during deliberation, which is precisely what the instability objection challenges.

  **Verdict**
  Do not hand this out; it misrepresents EDT's metaphysics and presents a contested causalist verdict as settled fact.
