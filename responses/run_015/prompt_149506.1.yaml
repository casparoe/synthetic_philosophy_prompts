          *   *Critique:* Most philosophy of mind courses teach Block's critique *against* GWT. Block argues GWT *only* explains Access. By saying "There's no real gap," the student is siding with Dehaene against Block without acknowledging Block's counter-argument (the Hard Problem/Explanatory Gap).
