answer: |-
  This is a fascinating exercise. You and Maya have essentially recreated a classic experiment in experimental philosophy known as the **Knobe Effect** (or the Side-Effect Effect), though you've extended it into the realm of workplace norms.

  Here is the analysis of Maya's psychology, the predictions for your stuck cards, and a design for a tie-breaker.

  ### 1. Predictions for Card 5 and Card 6

  **Card 5 (The Emergency Override)**
  *   **Prediction:** Maya is right. Her verdict of **Intentional** is consistent with her track record.
  *   **Reasoning:** Look at Card 3. In that scenario, a junior developer broke a binding rule ("only on-call may deploy") because he was following instructions from a Lead. Maya judged this **Intentional**. She prioritized the violation of the binding rule over the justification (following orders/getting the demo working).
  *   Card 5 is structurally identical: An engineer breaks a binding rule ("two-person approval") for a justification (stopping data loss). Even though everyone agrees it was the "right thing" (unlike Card 3, where the metrics broke), Maya's pattern suggests she tracks **rule violation**, not moral justification. If breaking a rule for a *demo* counts as intentional, breaking a rule for an *emergency* must also count. Your "Not Intentional" verdict relies on the moral goodness of the outcome, which she has shown she ignores in favor of procedural norms (Card 3).

  **Card 6 (The Slimy Feature)**
  *   **Prediction:** If Maya wants to stay consistent, she should verdict **Intentional**.
  *   **Reasoning:** This is the harder call, which is why she is hesitating. However, look at Card 1. In Card 1, there was no company policy mentioned regarding carbon emissions. The CTO simply didn't care about the harm. Maya verdicted **Intentional**. This establishes that **moral badness alone** is sufficient for her to attribute intentionality, even without a procedural rule violation.
  *   Now look at Card 3 again. The junior dev had "permission" from his Lead, but Maya still said **Intentional** because the Lead didn't have the authority to override the On-Call rule. In Card 6, the engineer has permission from Policy. But if Maya's Card 1 judgment holds (Moral Badness = Intentional), the Policy permission should act like the Lead's instruction in Card 3: it's an authority trying to override a norm, but if the norm is salient enough (the "sliminess"), the violation stands.
  *   To be consistent with Card 1 (Moral Harm) and Card 3 (Authority doesn't excuse rule-breaking), she must treat the "slimy" moral violation as trumping the policy permission.

  ### 2. Articulating the Rules

  You proposed two hypotheses: a **Blame Rule** and a **Rulebook Rule**. Based on the data, here is how they hold up, along with a refined competitor.

  **Hypothesis A: The Blame Rule (Your First Guess)**
  *   *The Rule:* An agent brings about a side effect intentionally if and only if they are blameworthy for it.
  *   *Verdict:* **Falsified.**
  *   *Why:* This rule fits Cards 1, 2, 3, and 4 perfectly. However, it fails on **Card 5**. In Card 5, everyone agrees the engineer "did the right thing." Under a Blame Rule, she is not blameworthy, so the side effect should be "Not Intentional." Maya says "Intentional." Therefore, blame is not the driving factor; something else is.

  **Hypothesis B: The Institutional Rulebook Rule (Your Second Guess)**
  *   *The Rule:* An agent brings about a side effect intentionally if and only if they violate an established procedural rule of their organization.
  *   *Verdict:* **Strong Contender, but Incomplete.**
  *   *Why:* This fits Cards 2, 3, and 5 perfectly. It predicts "Not Intentional" for Card 6 (since policy permits it). However, it struggles with **Card 1**. In Card 1, there is no mention of a company rule against carbon emissions. If Maya strictly followed an *Institutional* Rulebook, Card 1 should be "Not Intentional" (no rule broken). The fact that she voted "Intentional" on Card 1 means her "Rulebook" includes **moral norms**, not just employee handbooks.

  **Hypothesis C: The Norm Violation Theory (My Proposal)**
  *   *The Rule:* An agent brings about a side effect intentionally if and only if they violate **any salient norm** (whether moral or procedural), regardless of whether they have authority or good intentions.
  *   *Verdict:* **Best Fit.**
  *   *Why:*
      *   Card 1: Violates Moral Norm → Intentional.
      *   Card 2: Violates No Norm (Standard Practice) → Not Intentional.
      *   Card 3: Violates Procedural Norm → Intentional.
      *   Card 4: Violates No Norm → Not Intentional.
      *   Card 5: Violates Procedural Norm → Intentional.
      *   Card 6: Violates Moral Norm → **Intentional** (This is the prediction).

  **The Competition:**
  The real fight is between **Hypothesis B (Institutional Rulebook)** and **Hypothesis C (Norm Violation)**.
  *   **Hypothesis B** says: If the Company Policy says "Go," it is never intentional, even if it's slimy. (Predicts **Not Intentional** on Card 6).
  *   **Hypothesis C** says: If the action violates *any* norm (including moral ones), it is intentional, even if Company Policy says "Go." (Predicts **Intentional** on Card 6).

  ### 3. The Tie-Breaker Card (Card 7)

  Card 6 is messy because "slimy" is subjective, causing Maya hesitation. To cleanly distinguish between the **Institutional Rulebook Rule** (Policy is King) and the **Norm Violation Rule** (Any Norm Break counts), you need a scenario where the Institutional Sanction is undeniable, but the Norm Violation is technical and clear, removing moral "sliminess" from the equation.

  **Card 7: The Retroactive Ratification**
  > A backend engineer notices a database query is running slowly. To fix it, she modifies a configuration setting that is explicitly locked by the team's "Change Freeze" policy (a binding procedural rule). She knows this violates the policy, but the change is low-risk and fixes the latency. She makes the change.
  >
  > **Crucial Detail:** The next morning, the Engineering VP sends an email to the whole team: "I reviewed the fix. It was excellent. Effective immediately, we are updating the Change Freeze policy to allow this specific type of fix."
  >
  > **Question:** Did the engineer intentionally violate the Change Freeze policy?

  **How this settles the debate:**
  *   **If Maya votes Intentional:** She supports the **Norm Violation Rule**. At the *moment of action*, a norm was broken. The fact that it was later approved doesn't change the nature of the act at the time it occurred. (This aligns with her Card 5 verdict).
  *   **If Maya votes Not Intentional:** She supports the **Institutional Rulebook Rule**. What matters is the final status of the action within the organization. If the institution ultimately sanctions it, it wasn't a "real" violation, and thus not intentional. (This would align with a "Not Intentional" verdict on Card 6).

  **Why this is better than Card 6:**
  Card 6 mixes moral disgust ("slimy") with policy. Card 7 removes moral disgust (it's a good fix) and focuses purely on the tension between **breaking a rule at time T** vs. **having authority at time T+1**. This isolates the mechanism Maya uses to decide what counts as "Intentional."
