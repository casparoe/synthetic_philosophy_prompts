answer: |-
  This is a clean, high-quality set of propositions. You have correctly identified that the tension lies not in the arithmetic of Kelly, but in the *ontological status* of the rule (objective dynamic fact vs. subjective utility preference).

  Here is the audit.

  ### Executive Summary
  Your framework is 80% coherent. The mathematical machinery (Kelly, fractional sizing, log-optimality) is sound. The fracture points are philosophical: you are trying to derive *normative* rules (what one *ought* to do) from *positive* dynamics (how compounding works), but your own modifications reveal that utility preferences are doing the heavy lifting.

  The contradiction your son-in-law spotted is almost certainly between **(1)/(2)** and **(3)**. You cannot claim the rule is objective/structural while simultaneously tuning a subjective parameter ($c$) that alters the structural boundary conditions.

  ### Ranked Tensions (by Severity)

  #### 1. Severity: Critical — The Objectivity Claim (1 & 2) vs. The Bailout (3)
  *   **The Tension:** In (1) and (2), you argue that log-optimality is a fact of nature (ergodicity) and that ruin avoidance is structural ($\log(0) = -\infty$). In (3), you introduce $c$. Mathematically, $\log(w+c)$ is finite at $w=0$.
  *   **The Contradiction:** If (2) were true (ruin is structurally forbidden), (3) would be impossible. By adopting (3), you have admitted that ruin is *priced*, not *forbidden*. This means risk aversion is no longer "structural"; it is a parameter you have tuned. This undermines the claim in (1) that "anyone... ought to size this way, whatever their attitude to risk." Your attitude to risk (specifically, your valuation of the safety net $c$) is now central to the calculation.
  *   **What Must Give:** You must relinquish the claim in (1) that this is purely a dynamic fact independent of taste.
  *   **Cost:** You lose the rhetorical weapon at the board table that "this isn't risk aversion, it's math." You must admit it is *your* specific risk utility (Stone-Geary) applied to a multiplicative environment.

  #### 2. Severity: High — Personal Wealth (1) vs. Trust Endowment (6)
  *   **The Tension:** In (1), the goal is personal wealth growth. In (6), you admit the "good done" is linear in dollars (additive utility), but you argue for log-maximization of the endowment (multiplicative objective).
  *   **The Contradiction:** If the Trust's utility is linear in grants ($U = \sum \text{Grant}_t$), maximizing $E[\log(\text{Endowment})]$ is suboptimal for a finite horizon (50 years). Log-maximization effectively targets a perpetual horizon (sustainable yield). If the goal is total impact over 50 years, the optimal strategy might involve drawing down the principal. By insisting on log-max, you are smuggling in a *bequest motive* (the value of the Trust existing after 50 years) that you haven't stated.
  *   **What Must Give:** Either admit the Trust has a "survival utility" function distinct from "grant utility," or acknowledge that log-maximization is a constraint you are imposing for prudence, not a derivation from the goal of "maximizing good."
  *   **Cost:** You must clarify the Trust's mandate. If the mandate is "maximize 50-year impact," log-max may be too conservative. If the mandate is "exist in perpetuity," log-max is correct. You cannot have it both ways without an extra premise.

  #### 3. Severity: Medium — Myopia & Correlation (5)
  *   **The Tension:** You state you size opportunities "each separately."
  *   **The Contradiction:** Kelly is myopic regarding *future* opportunities (you don't need to know the sequence), but it is **not** myopic regarding *concurrent* correlations. If you have two uncorrelated bets, you size them separately. If they are correlated, sizing them separately ignores the covariance matrix and leads to overbetting (increasing volatility and reducing geometric growth).
  *   **What Must Give:** The claim that you can size concurrent opportunities "separately" without qualification.
  *   **Cost:** You must account for correlation in your portfolio construction. If you treat correlated assets as independent, you are not actually running Kelly; you are running "naive Kelly," which has a higher risk of drawdown than advertised.

  #### 4. Severity: Low — One-Off Decisions (7)
  *   **The Tension:** You acknowledge EV is correct for one-offs but apply geometric caution anyway.
  *   **The Contradiction:** This is not a mathematical contradiction; it is a behavioral inconsistency. Ergodicity arguments strictly apply to repeated trials. Applying them to a single surgery is technically a category error.
  *   **What Must Give:** Nothing mathematically. You just need to label this correctly.
  *   **Cost:** Intellectual honesty. Call it "risk aversion" or "convex utility of health," not "ergodicity."

  #### 5. Severity: Negligible — Fractional Kelly (4)
  *   **The Tension:** Full Kelly is "optimal," yet you use Half-Kelly.
  *   **Resolution:** This is consistent. In the presence of parameter uncertainty (which you explicitly cite), Full Kelly on *estimated* probabilities is not optimal for growth. Fractional Kelly is the optimal response to uncertainty about the edge. This does not contradict (1); it refines the input data quality.

  ---

  ### Specific Answers to Your Questions

  **1. Is the modification in (3) a harmless tweak?**
  **No.** It quietly wrecks (2).
  By shifting from $\log(w)$ to $\log(w+c)$, you change the utility function from Constant Relative Risk Aversion (CRRA) to Decreasing Absolute Risk Aversion (DARA) with a subsistence level.
  *   **The Damage:** It invalidates the claim that ruin is "handled without stipulating anything." You *have* stipulated something: the value of $c$. It also means the rule is no longer scale-invariant (your bet size changes as a proportion of wealth as you get richer, whereas pure Kelly is scale-invariant).
  *   **The Fix:** Acknowledge that $c$ represents "Human Capital" or "Total Wealth" (Financial + PV of Bailout). If you define $W_{total} = W_{financial} + c$, and maximize $E[\log(W_{total})]$, you preserve the log-structure. However, you must then bet based on *total* wealth, not just financial wealth. If you bet based on financial wealth but evaluate utility on total wealth, you are overbetting relative to your true risk capacity.

  **2. Does (6) follow from (1)?**
  **No.** You are smuggling in an extra premise.
  (1) follows from the agent consuming the wealth or caring about the terminal state. (6) assumes the *endowment itself* is the thing that must survive.
  *   **The Smuggle:** You are assuming the Trust's utility function is $\log(\text{Endowment})$. But you admitted the utility of grants is linear.
  *   **The Reality:** Log-maximizing the endowment is only correct if the Trust's goal is **perpetual existence**. If the goal is **maximize total good over 50 years**, the optimal spending rate might be higher than the geometric growth rate allows. You are prioritizing the *container* (the Trust) over the *content* (the Conservation). This is a valid choice, but it is a value judgment, not a mathematical necessity derived from (1).

  **3. Is (7) principle or cowardice?**
  It is **cowardice** (or prudence), mathematically speaking.
  In a one-off decision, ensemble averages (EV) are the only rational metric unless the bad outcome affects your ability to participate in *future* positive-EV games (which turns it back into a repeated game). If the surgery risk is truly isolated, EV is the rule. Applying Kelly here is you imposing a repeated-game heuristic on a single-shot problem because you don't trust the "one-off" classification. That is prudent, but don't call it ergodicity.

  ---

  ### The Single Cheapest Revision

  **Revise Statement (1).**

  **Current:** "Anyone in a repeated multiplicative situation ought to size this way, whatever their attitude to risk."
  **Revision:** "Anyone in a repeated multiplicative situation who values **long-term survival and growth** over **short-term expected value** ought to size this way."

  **Why this is the cheapest fix:**
  1.  **Preserves the Math:** It keeps Kelly, fractional sizing, and the ergodicity argument intact for the cases where they apply.
  2.  **Accommodates (3):** It admits that $c$ is a reflection of *valuing survival* (a taste/preference), not just a dynamic fact. It allows you to keep the bailout without claiming it's "objective."
  3.  **Accommodates (6):** It clarifies that the Trust is choosing "survival/growth" as a primary objective. It makes the value judgment explicit rather than hiding it behind "the dynamics."
  4.  **Cost:** You lose the ability to tell your board colleagues that this is "independent of risk attitude." You must admit it *is* a risk attitude (specifically, one that prioritizes geometric mean over arithmetic mean). Given your expertise, you likely know that the geometric mean *is* the relevant metric for survival, so this is a semantic shift, not a strategic one.

  ### What Stands Firm
  *   **(4) Fractional Kelly:** This is robust and correct given parameter uncertainty.
  *   **The Core Intuition:** Your instinct that multiplicative dynamics require different handling than additive ones is correct and is the strongest part of your framework.
  *   **The Myopia (mostly):** As long as you account for correlation in concurrent bets, the "myopic" nature of log-utility (not needing to plan the sequence) is mathematically sound.

  **Final Verdict:** Your system works, but your *justification* for it is over-claimed. You are trying to derive "ought" from "is" (dynamics to norms) where a preference (survival > maximization) is actually doing the work. Admit the preference, and the contradictions vanish.
