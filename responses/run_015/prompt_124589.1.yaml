answer: |-
  ### Part 1: Brainstorming Session Shapes

  1.  **The Human Dataset:** Students *are* the data points, holding cards with attributes (Treatment, Outcome, Stratum). They physically group themselves to calculate aggregates vs. strata.
      *   *Pros:* Viscerally demonstrates sample size thinning.
      *   *Cons:* Logistically fragile with 14 people (hard to get exact counts for the paradox); risks becoming a movement game rather than a thinking game.
  2.  **The Adversarial Audit (Selected):** Pairs act as consultants for opposing sides (Program Directors vs. Taxpayer Auditors). Both get the exact same data packet but must construct the argument that serves their client using valid statistics.
      *   *Pros:* Directly targets Goal #1 (honest disagreement); forces ownership of the "choice of summary."
      *   *Cons:* Requires careful scaffolding to prevent stats students from bulldozing philosophers.
  3.  **The Dial Turn:** Start with aggregate data. Slowly reveal strata, then sub-strata, until cells empty. Students must vote at each step on "Do we have an answer yet?"
      *   *Pros:* Perfect for Goal #3 (partition as a dial).
      *   *Cons:* Can feel too lecture-driven; less opportunity for them to generate the arguments themselves.
  4.  **The Reconstruction:** Give students marginal totals and stratum totals separately (scrambled). They must match them to see how the same margins can hide different structures.
      *   *Pros:* Deep dive into the math of aggregation.
      *   *Cons:* Too puzzle-focused; risks losing the philosophical "why act?" question.

  **Selection:** I would run **The Adversarial Audit**.
  **Why:** It best serves your core constraint: "Two presenters can both be scrupulously honest... and reach opposite recommendations." By assigning roles *before* revealing the causal story, you force them to justify *why* they chose a summary statistic, not just calculate it. It naturally creates the tension between predictive accuracy (aggregate) and causal identification (stratified) without you having to lecture it.

  ---

  ### Part 2: Verification of Your Mathematical Intuition

  **You are correct.** This is not a misremembering; it is the algebraic engine of Simpson's Paradox.

  **The Math:**
  Let $p_s$ be the success rate in stratum $s$.
  If the treatment effect is zero everywhere, then $P(Y=1|T=1, S=s) = P(Y=1|T=0, S=s) = p_s$.
  The aggregate success rate for Treatment is a weighted average: $\sum p_s \cdot P(S=s|T=1)$.
  The aggregate success rate for Control is a weighted average: $\sum p_s \cdot P(S=s|T=0)$.

  If the distribution of strata differs between Treatment and Control groups (i.e., $P(S=s|T=1) \neq P(S=s|T=0)$), the weights differ. Therefore, the weighted averages differ, even though the values being averaged ($p_s$) are identical.

  **Verdict:** Use this. It is the cleanest way to show that "difference in aggregates" does not imply "difference in effects."

  ---

  ### Part 3: Full Session Design — "The Adversarial Audit"

  **Topic:** Simpson's Paradox, Conditioning, and the Causal Dial
  **Time:** 75 Minutes
  **Students:** 14 (7 Pairs)
  **Materials:** Whiteboard, Projector (for timer/instructions only), 7 Data Packets (envelopes), Index Cards (for voting).

  #### The Data (The "Job Training" Dataset)
  *Total N = 64 cases. Hand-calculable.*
  *Variable 1: Treatment (Program vs. No Program)*
  *Variable 2: Outcome (Hired vs. Not Hired)*
  *Variable 3: Stratum (Experienced vs. Novice)*

  **The Truth (For You):**
  *   **Effect:** The program does **nothing**. Success depends entirely on Experience.
  *   **Bias:** Experienced people were much more likely to take the program.

  **The Tables (Print these on cards inside the envelopes):**

  **Card A: The Aggregate (Visible to all initially)**
  | | Hired | Not Hired | Total | Rate |
  |---|---|---|---|---|
  | **Program** | 20 | 12 | 32 | **62.5%** |
  | **No Program** | 12 | 20 | 32 | **37.5%** |
  | *Difference* | | | | **+25%** |

  **Card B: The Stratified Data (Hidden until Round 2)**
  *Stratum 1: Experienced (Easy to get hired)*
  | | Hired | Not Hired | Total | Rate |
  |---|---|---|---|---|
  | **Program** | 18 | 6 | 24 | **75%** |
  | **No Program** | 6 | 2 | 8 | **75%** |
  | *Difference* | | | | **0%** |

  *Stratum 2: Novice (Hard to get hired)*
  | | Hired | Not Hired | Total | Rate |
  |---|---|---|---|---|
  | **Program** | 2 | 6 | 8 | **25%** |
  | **No Program** | 6 | 18 | 24 | **25%** |
  | *Difference* | | | | **0%** |

  **Card C: The "Dial" Turn (Hidden until Round 3)**
  *Split "Experienced" into "Experienced-North" and "Experienced-South"*
  *   **Experienced-North:** 10 Program (8 Hired), **0 No Program**. (Comparison impossible)
  *   **Experienced-South:** 14 Program (10 Hired), 8 No Program (6 Hired). (Rates match roughly)
  *(Note: This card shows that finer partitioning creates empty cells.)*

  #### Timeline & Flow

  **0:00 – 0:10: Setup & The Hook**
  *   **Context:** "A city job training program claims success. Taxpayers claim waste. You are the advisory committee."
  *   **Distribution:** Give every pair **Card A (Aggregate)** only.
  *   **Roles:** Flip a coin. Heads = **Program Directors** (argue for funding). Tails = **Taxpayer Auditors** (argue against funding).
  *   **Task:** "Calculate the success difference. Write a 2-sentence recommendation based *only* on this number."
  *   **Action:** Collect recommendations. Read two aloud (one pro, one con). They will likely agree on the math but disagree on the implication, or both agree it works.

  **0:10 – 0:30: Round 1 — The Conflict**
  *   **Reveal:** Give every pair **Card B (Stratified)**.
  *   **Task:** "Recalculate. Does your recommendation change? You must still advocate for your original client."
  *   **Constraint:** You cannot call the other side "liars." You must argue why *your* table (Aggregate vs. Stratified) is the correct basis for decision-making.
  *   **Discussion:** 10 minutes pair work. 10 minutes class debate.
  *   **Goal:** Elicit the argument: "Aggregates reflect reality on the ground" vs. "Strata reflect causal impact."

  **0:30 – 0:50: Round 2 — The Dial Turn**
  *   **Intervention:** "Some of you want to control for more variables. Here is **Card C**."
  *   **Task:** "Condition on Region (North/South) within the Experienced group. Calculate the effect."
  *   **Trap:** They will hit the empty cell (0 No Program in North).
  *   **Discussion:** "Can you estimate the effect here? What happens if you keep turning the dial (e.g., condition on Age, then ID number)?"
  *   **Goal:** Demonstrate that "more control" leads to "no data."

  **0:50 – 1:05: The Causal Reveal**
  *   **Projector:** Show the DAG (Directed Acyclic Graph).
      *   Experience $\rightarrow$ Hired
      *   Experience $\rightarrow$ Program (Selection bias)
      *   Program $\not\rightarrow$ Hired (No arrow)
  *   **Explanation:** "The data never contained this arrow. You had to import it."
  *   **Synthesis:** Ask: "Who was right in Round 1?" (Answer: The Auditors causally, but the Directors predictively).

  **1:05 – 1:15: Final Debrief**
  *   Connect back to the three goals (see below).
  *   Exit Ticket: One index card. "What single piece of information was missing from the tables that settled the dispute?"

  ---

  ### Part 4: Debrief & Troubleshooting

  #### Mapping Activities to Your Three Goals

  1.  **Goal: Honest Disagreement (Choice of Summary)**
      *   *Moment:* Round 1 Debate (0:30 mark).
      *   *Mechanism:* By forcing them to keep their client roles after seeing Card B, the "Program Directors" must argue that the Aggregate is the relevant metric (e.g., "We care about overall hire rates, not counterfactuals"). The "Auditors" must argue for Stratification.
      *   *If nobody bites:* Ask the Directors: "If I know I'm Novice, should I take the program?" They must say "No" (25% vs 25%). Then ask: "Then why recommend the program?" This exposes the Aggregate as a *predictive* tool, not a *prescriptive* one.

  2.  **Goal: Data Doesn't Settle Causality**
      *   *Moment:* The Causal Reveal (0:50 mark).
      *   *Mechanism:* Show the DAG. Emphasize that Card A and Card B are mathematically consistent with *many* DAGs.
      *   *What to say:* "The numbers didn't change between Round 1 and Round 2. Your conclusion did. What changed? Your assumption about whether Experience is a confounder or a mediator."

  3.  **Goal: The Partition Dial (Over-conditioning)**
      *   *Moment:* Card C (0:40 mark).
      *   *Mechanism:* The empty cell in "Experienced-North."
      *   *What to say:* "You wanted to control for Region. Now you have no control group. If you condition on everything, you have N=1 per cell. Where is the 'right' stop?"

  #### Predictable Failures & Mitigations

  **Risk 1: The Stats Students Take Over**
  *   *Symptom:* The poli sci students calculate the percentages instantly and tell the philosophers what to think.
  *   *Mitigation:* Assign roles that privilege philosophical justification. Tell the Stats students: "You are the *Calculator*. You are forbidden from making the recommendation. The Philosopher is the *Judge*. The Judge must sign the recommendation, but can only do so if the Calculator explains the *assumption* behind the number, not just the number."

  **Risk 2: Early Spotting ("It's Confounding!")**
  *   *Symptom:* Someone shouts "Experience is a confounder!" in the first 5 minutes.
  *   *Mitigation:* Validate and pivot. "Correct. So why did the Aggregate table hide it? And if you were the Program Director, could you honestly use the Aggregate table to request funding? Yes, if your goal is prediction, not causation. Stay in character."

  **Risk 3: Relativism ("It depends what question you're asking")**
  *   *Symptom:* The class concludes that both answers are equally valid and no decision can be made.
  *   *Mitigation:* Force a binary choice at the end. "The City Council needs a Yes/No vote on funding *right now*. You cannot say 'it depends'. You must vote based on the *causal* question: Does the program *cause* hires?" This collapses the relativism by defining the goal post.

  #### Honesty Check: What This Game Cannot Deliver

  Be prepared to say this explicitly in the final 5 minutes:

  1.  **The Data Cannot Tell You Which Variable to Condition On:** The activity shows *that* conditioning changes the result, but the data itself never tells you *which* partition is the causal one. You need the DAG (theory) for that. The game simulates the confusion, but only your lecture resolves it.
  2.  **The "Zero Effect" Setup is Rare:** In real life, within-stratum effects are rarely *identical*. They are usually just *different* from the aggregate. This clean mathematical example (0% effect inside, 25% outside) is a pedagogical device. Real data is noisier, making the paradox harder to spot but the principle the same.
  3.  **The Dial Problem Has No Statistical Solution:** The activity shows that over-conditioning breaks estimation (empty cells). It does not show them how to solve it (e.g., regression modeling, hierarchical models). You must acknowledge that statistics offers tools to manage the dial, but not to eliminate the need for judgment.

  #### Final Instruction to You
  When you hand out Card C (The Dial), watch the stats students. They will likely try to average across the empty cell or drop it. Let them. Then ask the philosophers: "Is it ethical to drop the North region from the analysis?" This brings the epistemology back to ethics, which is where your seminar should live.
