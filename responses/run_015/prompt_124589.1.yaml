          *   Formula for aggregate: $P(Y=1|T=0) = \sum_s q_s \cdot P(S=s|T=0)$.
          *   If $p_s = q_s = k_s$ (same rate for treatment and control within stratum $s$), then:
              *   Aggregate Treatment = $\sum_s k_s \cdot P(S=s|T=1)$
              *   Aggregate Control = $\sum_s k_s \cdot P(S=s|T=0)$
          *   These two sums are weighted averages of the same numbers ($k_s$), but with *different weights* ($P(S=s|T=1)$ vs $P(S=s|T=0)$).
          *   If the distribution of $S$ differs between Treatment and Control groups (which implies $T$ and $S$ are associated, i.e., confounding or selection bias), the weighted averages will differ.
