answer: |-
  There is no single, canonical term in the philosophical or AI safety literature that precisely names this specific two-stage filter. However, your description is exceptionally precise, and the pattern you have identified is a recognized composite of several established argumentative pathologies. In the taxonomy of obstructive argumentation, this is best classified as a **Rigorous-Intuition Double Bind**, functioning as a specialized form of **Epistemic Immunization**.

  Below is a classification of the pattern, its philosophical neighbors, and a separation of the settled technical limits of debate-based safety from the genuinely contested philosophical claims.

  ### 1. Taxonomic Classification of the Pattern

  The pattern you describe operates as a closed loop that prevents the critic from establishing a stable epistemic footing. It can be decomposed into three moves:

  1.  **The Positivist Gate (Stage 1):** The defender demands **operationalization**. This appeals to a shared standard of rigor (common in physics and computer science), requiring the risk to be expressed in formal terms or verified via a specific protocol.
  2.  **The Goalpost Shift (Stage 2):** Once the critic operationalizes the risk, the defender invokes **essentialism**. They argue that the formalization captures only a "proxy" or "subset" of the risk, stripping it of its critical nature (e.g., "That's just narrow AI misalignment, not *deceptive* alignment"). They then demand evidence based on intuition or long-horizon speculation.
  3.  **The Immunization (Stage 3):** When the critic notes the contradiction (you asked for formalization, now you ask for intuition), the defender invokes **inexpressibility**. They claim the risk is inherently unformalizable, thereby placing it outside the scope of the debate protocol established in Stage 1.

  **Nearest Neighbors in Argumentative Taxonomy:**

  *   **Immunization Strategies (Lakatosian):** In the philosophy of science, Imre Lakatos described how research programs protect their "hard core" from falsification by adjusting auxiliary hypotheses. Here, the "hard core" is the claim that the risk is real and unique. The auxiliary hypothesis shifts between "it must be formalizable" and "it is too subtle to be formalized" to prevent the core from being tested.
  *   **Moving the Goalposts:** This is the most direct fallacy description. The criteria for acceptable evidence change dynamically based on the evidence supplied.
  *   **The Motte-and-Bailey Doctrine:** While similar, this is not a perfect fit. A Motte-and-Bailey usually involves retreating to a defensible position (the Motte) when attacked and claiming a controversial position (the Bailey) when safe. In your pattern, the defender is not retreating to safety; they are shifting the terrain to make the critic's position *unspeakable*.
  *   **Self-Sealing Argument:** This occurs when a claim is structured so that any evidence against it is interpreted as evidence for it (e.g., "Your inability to see the risk proves how subtle it is"). Stage 3 of your pattern is a self-sealing move.
  *   **Kafkatrapping (Rationalist Community Slang):** In online rationalist discourse, this refers to accusing a skeptic of being irrational or "broken" for failing to accept a premise that is, by design, difficult to verify. Your pattern is a structural version of this: the protocol is designed such that failure to satisfy it confirms the risk's elusiveness.

  ### 2. Settled vs. Contested: Debate-Based Safety

  To navigate this literature without conflating rhetorical moves with technical realities, it is necessary to distinguish between the engineering constraints of debate protocols and the philosophical claims about risk.

  #### Settled Technical Limits (Consensus Among Specialists)
  *   **Human-Judge Bottleneck:** It is settled that current proposals for AI Safety via Debate (e.g., Irving et al., 2018) rely on human judges to verify arguments. It is agreed that human bandwidth and cognitive bias limit the complexity of claims that can be adjudicated.
  *   **Formal Verification Scope:** It is settled that formal verification is currently feasible only for narrow, well-specified properties of code or systems. Verifying high-level semantic goals (like "honesty" or "beneficence") in complex neural networks is not currently technically possible.
  *   **Training Dynamics:** It is settled that debate protocols constitute a training mechanism. Like all training mechanisms, they are subject to distributional shift (the system may behave differently in deployment than in training).

  #### Genuinely Contested Claims (Active Disagreement)
  *   **The Formalizability of Risk:** It is **contested** whether the most dangerous AI risks (e.g., deceptive alignment, instrumental convergence) are inherently unformalizable.
      *   *View A:* Some argue these are complex empirical phenomena that resist simple formalization but are nonetheless detectable via behavioral testing.
      *   *View B:* Others argue that if a risk cannot be formalized or operationalized, it cannot be distinguished from science fiction, and thus should not dictate safety policy.
      *   *View C:* A third group argues that the risk is formalizable in principle but requires mathematical tools we do not yet possess.
      *   *Note:* The argumentative pattern you identified often conflates View A and View C to produce the "unformalizable" conclusion in Stage 3.
  *   **Scalability of Debate:** It is **contested** whether debate protocols scale to superintelligence. Proponents argue that AI debaters can elucidate truths humans cannot verify directly (via "cross-examination"). Skeptics argue that if the human cannot verify the conclusion, the debate is merely persuasive, not truthful.
  *   **The Epistemic Status of Intuition:** It is **contested** whether "expert intuition" regarding long-horizon AI behavior constitutes valid evidence.
      *   Some philosophers of technology argue that conceptual analysis and intuition are necessary precursors to formalization in novel domains.
      *   Many physicists and computer scientists argue that without operational definitions, intuition is indistinguishable from bias.

  ### 3. How to Classify the Argumentative Move

  If you encounter this pattern in writing or debate, you should classify it not as a substantive claim about AI, but as a **methodological inconsistency**.

  The specific pathology is a **Performative Contradiction**. The defender uses a formal protocol (debate) to argue that the subject matter is outside the scope of formal protocols.

  *   **If the risk is unformalizable:** Then the debate protocol (which relies on structured argument and verification) is the wrong tool for the job. The defender should not be advocating for debate-based safety; they should be advocating for alternative governance or moratoriums.
  *   **If the risk is formalizable:** Then the Stage 2 objection (that formalization strips the urgency) is invalid, and the critic's formalization should be engaged with on its merits.

  ### 4. Recommendation for Engagement

  As a physicist entering this field, you are well-positioned to identify this pattern because it violates the norm of **invariant measurement standards**. In physics, one cannot demand a measurement be made with a ruler, and then, when the ruler is produced, claim the object is too "quantum" for the ruler, while simultaneously insisting the object exists physically.

  When you encounter this:
  1.  **Isolate the Inconsistency:** Explicitly state: "You are requesting formalization to admit the risk to the debate, but rejecting formalization to define the risk. We must choose one epistemic standard."
  2.  **Force the Fork:** Ask the defender to choose: "Is the goal of this debate protocol to verify risks we can define, or to validate intuitions about risks we cannot define?"
  3.  **Avoid the Trap:** Do not attempt to satisfy the Stage 2 demand for "unverifiable intuition." If you do, you validate the premise that formalization is insufficient, which leads directly to the Stage 3 immunization.

  ### Summary
  There is no single proper noun for this pattern, but it is a robust instance of **Epistemic Immunization** utilizing a **Double Bind**. It exploits the tension between the **Positivist** requirement for verification and the **Hermeneutic** claim that some truths exceed verification. In the context of AI safety, whether long-horizon risks are truly unformalizable remains a **contested** philosophical claim, not a settled fact. Treating it as settled is the core of the rhetorical maneuver you have identified.
