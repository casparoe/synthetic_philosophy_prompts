answer: |-
  # Activity Title: The Procedural Harm Protocol

  **Target:** Upper-level undergraduate philosophy seminar (14 students).
  **Time:** 75 minutes.
  **Materials:** 14 envelopes (containing Role Cards), 70 identical tokens (chips, coins, or slips of paper), a whiteboard with three columns drawn, a timer.

  ---

  ## I. Scenario & Setup (0:00 – 0:10)

  **The Scenario:**
  Read the following aloud. Do not distribute written text.

  > "The University Honor Council recently reviewed a case of academic misconduct. A student, Alex, was expelled due to a technicality in the citation protocol. The decision was legally sound according to the university bylaws. However, it caused foreseeable, severe harm to Alex's career and mental health.
  >
  > One Council Member (the **Agent**) cast the deciding vote to uphold the technicality. The Agent acted strictly within their assigned procedural role, without malice, and followed all training.
  >
  > You are the remaining Council Members convening an emergency session to determine the Council's stance toward the Agent and the decision. You must allocate your moral engagement."

  **Distribution of Roles:**
  Hand out 14 sealed envelopes. Each contains a **Role Card** and **5 Tokens**. Students must not reveal their role to others.

  *   **1 Agent-Role:** "You are the Council Member who voted. You followed the rules. You feel no personal guilt, but you sense the room's tension."
  *   **3 Victim-Proxies:** "You are close friends of the expelled student. You feel the harm personally. Your tokens represent your capacity for resentment."
  *   **5 Institutional-Continuity:** "You are concerned with the stability of the Honor Council. If the Agent is morally condemned, the Council's authority weakens. Your tokens represent institutional capital."
  *   **5 Neutral Observers:** "You are faculty liaisons. You have no personal stake but must witness the moral texture of the group. Your tokens represent impartial judgment."

  **The Three Stances (Write on Whiteboard):**
  Explain that tokens must be placed into one of three columns. This is not a vote; it is an allocation of *self*.

  1.  **Sustained Participant (Column A):** "I demand a personal account from the Agent. I treat the Agent as a moral peer responsible for the harm. I reserve the right to feel resentment or grant forgiveness."
  2.  **Modified Reactive (Column B):** "I hold the *Office* responsible, not the person. I feel indignation at the role, but I suspend personal resentment toward the Agent's will."
  3.  **Objective Attitude (Column C):** "The Agent is a management variable. This is a training error or systemic glitch. No apology is owed; only correction is needed. I view the Agent as an object of policy, not a moral subject."

  ---

  ## II. Round One: Allocation & Visibility (0:10 – 0:25)

  **Rule 1:** Each student has 5 tokens. They must distribute them among the three columns. (e.g., 3 in A, 2 in B, 0 in C).
  **Rule 2:** Allocations are public. Students come to the board and place tokens visibly.
  **Rule 3:** Open discussion is permitted for 10 minutes. Students may explain their allocation but *cannot reveal their hidden role*. They must speak only from their "Council Member" persona.

  **Facilitator Note:** Watch for utilitarian language ("We should put tokens in C to save time"). If heard, interrupt gently: "Remember, these tokens are not points to win. They are your capacity for relationship. Spending a token on 'Objective' means withdrawing a piece of your moral engagement from the Agent."

  **Outcome:** By minute 25, the board will show a distribution. Usually, Victim-Proxies will pile tokens in Column A. Institutional-Continuity will lean toward C. Observers will split.

  ---

  ## III. Round Two: The Closure Coalition (0:25 – 0:45)

  **The Mechanism:**
  Announce the following rule change. This is the critical pressure point.

  > "The University Administration has offered a 'Closure Protocol.' If the Council can unanimously agree to shift the Agent entirely to the **Objective Attitude (Column C)**, the following happens:
  >
  > 1.  **Institutional Stability:** The Council gains 10 Stability Points (written on the board). The case is closed permanently.
  > 2.  **Agent Relief:** The Agent is formally relieved of the obligation to offer an interpersonal apology. They are 'managed,' not 'addressed.'
  > 3.  **The Cost:** Any participant who joins this Unanimous Coalition (allocating all 5 tokens to Column C) **forfeits their Voice Token.** You will not be permitted to speak about *moral injury* or *recognition* during the final debrief. You retain membership, but you lose the standing to demand interpersonal recognition."

  **The Constraint:**
  *   To trigger Closure, **all 13 Non-Agent participants** must move all 5 tokens to Column C.
  *   If even *one* Non-Agent participant keeps a token in Column A or B, the Coalition fails.
  *   If the Coalition fails, the Status Quo remains (no Stability Points, Agent remains open to moral demand).

  **The Discussion:**
  Allow 15 minutes for negotiation.
  *   **Institutional-Continuity** will push for Closure (Stability Points).
  *   **Victim-Proxies** will resist (Loss of Voice/Recognition).
  *   **Neutral Observers** become the kingmakers.
  *   **The Agent** must remain silent during this round.

  **Facilitator Note:** If the group is close to unanimity but hesitating, emphasize the cost: "To save the Institution, you must silence your own claim to be heard." If they are fighting, emphasize the friction: "Notice how hard it is to get everyone to agree to treat the Agent as an object."

  ---

  ## IV. The Consequence & Silence (0:45 – 0:55)

  **Determine the Outcome:**
  *   **Scenario A (Coalition Succeeds):** Announce the Case is Closed. The Agent is relieved of apology. Collect the Voice Tokens from those who voted C.
  *   **Scenario B (Coalition Fails):** Announce the Case Remains Open. The Agent remains morally addressable. No Stability Points awarded.

  **The Silence:**
  Regardless of the outcome, enforce a 5-minute period of silence.
  *   If Coalition Succeeded: Those who forfeited Voice Tokens must sit in silence. Those who held out (if any) may speak, but there is no one left to address (since the Agent is 'closed').
  *   If Coalition Failed: The group sits with the unresolved tension. The Agent is still present, still waiting for an account that the group cannot agree on.

  **Instruction:** "Do not discuss the game mechanics. Sit with the state of the room. Feel the relationship between you and the Agent."

  ---

  ## V. Debrief & Mapping (0:55 – 1:15)

  **Phase 1: Phenomenology (No Names)**
  Ask the following questions. Do not mention Strawson yet.
  1.  "For those who forfeited Voice Tokens to achieve Closure: What did it feel like to agree that the Agent did not owe you an apology? Did it feel like *understanding* the Agent, or like *leaving* the Agent?"
  2.  "For those who refused Closure: Why was the Stability Point not worth the price? What would have been lost if the Agent was 'managed' rather than 'addressed'?"
  3.  "Agent: How did it feel when the group discussed moving you to Column C? Did you feel included in the community or excluded from it?"

  **Phase 2: Mapping to Framework**
  Now, introduce the terminology.
  *   **Column A (Sustained Participant):** Map this to **Participant Reactive Attitudes**. Explain that resentment, indignation, and the demand for an apology are not irrational; they are the glue of ordinary human relationships. To hold someone in this stance is to treat them as a moral peer.
  *   **Column C (Objective):** Map this to **The Objective Attitude**. Explain that this is not just "being scientific." It is a form of **social withdrawal**. To treat someone objectively is to exclude them from the community of mutual accountability.
  *   **The "Cost" Mechanic:** Explain that the "Forfeited Voice Token" represents Strawson's claim that you cannot simultaneously treat someone as an object of management and a partner in dialogue. The Objective Attitude purchases stability at the cost of interpersonal recognition.

  **Phase 3: Institutional Blurring**
  Discuss the **Modified Reactive (Column B)**.
  *   Ask: "Did anyone try to put tokens here? Why?"
  *   Explain: Institutions often try to live in Column B. They want to blame the "role" without blaming the "person." Strawson suggests this is unstable. Either the person is responsible (Participant), or they are a thing to be managed (Objective). The institution tries to have both, which creates the confusion you felt in Round One.

  **Phase 4: Limitations (The Diachronic Gap)**
  Provide an honest assessment of what the simulation *cannot* do.
  *   **The Limitation:** "Today, you made a choice in 15 minutes. Strawson argues that reactive attitudes are eroded or sustained over *years* of social practice. We cannot simulate the slow drift of a relationship turning objective through sustained neglect or therapy."
  *   **The Fix:** "You must imagine that the 'Objective' vote today wasn't a single decision, but the culmination of a year of treating the Agent as a functionary. The silence you felt at the end is the shadow of that long-term erosion."

  ---

  ## VI. Predictable Failures & Facilitator Moves

  **Failure 1: Utilitarian Optimization**
  *   **Symptom:** Students treat tokens as points to maximize ("If we all put 5 in C, we get 10 Stability Points, that's the winning move").
  *   **Correction:** Pause the activity. Say: "You are treating moral engagement as currency. In this framework, spending a token on 'Objective' is not gaining points; it is *amputating* a part of your capacity to relate. Recalculate based on what you are willing to lose, not what you are willing to win."

  **Failure 2: Conflating Status with Role**
  *   **Symptom:** Victim-Proxies attack the Agent's character ("You are a cruel person") rather than the act.
  *   **Correction:** Remind them of the Scenario constraints. "The Agent followed the rules. Your resentment is not about *malice*; it is about *harm*. Strawson's point is that we feel reactive attitudes even when there is no malice. Focus on the demand for recognition, not the accusation of evil."

  **Failure 3: The "Easy" Unanimity**
  *   **Symptom:** The group agrees to Objective too quickly to avoid conflict.
  *   **Correction:** Enforce the "Voice Token" forfeiture strictly. If they vote Objective, physically collect their right to speak in the debrief. The silence of the majority during the debrief is necessary to demonstrate the cost of the Objective Attitude. If they see they can vote Objective and still debate freely, the lesson fails.

  ---

  ## VII. Closing Statement (Final 2 Minutes)

  "Strawson argues that we cannot live permanently in the Objective Attitude without ceasing to be human participants in a community. Today, you purchased Institutional Stability. Look at who is allowed to speak, and who is silent. That silence is the price of the Objective Stance. It is the sound of a relationship turned into a procedure."
