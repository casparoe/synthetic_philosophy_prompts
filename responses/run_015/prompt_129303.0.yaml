      *   **Target Audience:** Upper-level undergraduate philosophy seminar (~14 students).
      *   **Time Limit:** One 75-minute session.
      *   **Topic:** P.F. Strawson's distinction between *participant reactive attitudes* and the *objective attitude*, specifically in institutional settings where role-obligations blur personal/vicarious reactions.
      *   **Core Mechanism:** A structured activity with explicit rules, roles, symbolic stakes (tokens), and a timeline.
      *   **Scenario:** University honor council member causes foreseeable/unintended harm while following procedure.
      *   **Roles:** Hidden roles (Victim-Proxy, Neutral Observer, Institutional-Continuity, Agent-Role).
      *   **Token Economy:** 5 tokens per person (emotional-moral engagement).
      *   **Rounds:**
          *   Round 1: Allocate tokens to 3 stances (Sustained Participant, Modified Reactive, Objective). Visible but revisable.
          *   Round 2: Collective shift to Objective requires *unanimous coalition* (excluding Agent). Success = Institutional Stability Points + Agent relieved of apology obligation. Failure = Status Quo.
          *   Stakes: Maintaining reactive engagement = Speaking rights in debrief. Building coalition = Stability but forfeit right to demand recognition.
      *   **Goal:** Participants *feel* the force of Strawson's distinction (objective attitude as social withdrawal/restructuring) before naming it.
      *   **Debrief:** Connect experience to framework without naming Strawson initially. Address limitations (diachronic erosion vs. single choice). Predict failures (conflating status/role, utilitarian token use) and provide fixes.
      *   **Constraints:** No external readings, citations, bibliographies, or web access needed.

  2.  **Deconstruct the Philosophical Core (Strawson):**
      *   *Participant Reactive Attitudes:* Resentment, gratitude, indignation, forgiveness. Presupposes the other is a moral agent like us. Essential for ordinary interpersonal relationships.
      *   *Objective Attitude:* Viewing the other as an object to be managed, treated, cured, or trained. Suspends reactive attitudes. Necessary for some contexts (psychiatry, extreme immaturity) but incompatible with ordinary interpersonal relationships.
      *   *The Tension:* We can't fully inhabit both simultaneously regarding the same person in the same context. Shifting to objective feels like a withdrawal from the relationship.
      *   *Institutional Twist:* Institutions often demand the objective attitude (procedure over person), but members remain moral agents. This creates the "blur."

  3.  **Drafting the Activity Structure:**
      *   *Title:* Needs to sound official but evocative. "The Council of Accountability" or "The Procedural Harm Simulation." Let's go with "The Procedural Harm Protocol."
      *   *Setup:* Need to distribute roles secretly. Need a board for token tracking.
      *   *Scenario:* Needs to be specific enough to generate emotion but vague enough to fit the model. *Scenario:* A council member (Agent) voted to uphold a technicality that resulted in a student's expulsion (Harm), following the rules strictly.
      *   *Tokens:* 5 chips/cards per student.
      *   *Stances:*
          1.  *Personal Demand (Participant):* "You owe *me/us* an apology/account."
          2.  *Role Indignation (Modified):* "The *office* failed, not necessarily the soul."
          3.  *Management (Objective):* "This is a training issue/system error. No apology needed."
      *   *Round 2 Mechanic:* The "Closure Vote." This is the crux. To go fully Objective, everyone (except Agent) must agree. If they do, the Agent is "closed off" from moral demand (no apology needed), but the group loses the right to demand recognition. This mirrors Strawson's idea that objective attitude excludes *mutual* recognition.

  4.  **Refining the Rules & Payoffs (The "Feel"):**
      *   *Constraint:* 14 students.
      *   *Roles:*
          *   Agent (1 student).
          *   Victim-Proxy (3 students) - High emotional stake.
          *   Institutional-Continuity (5 students) - High stability stake.
          *   Neutral Observer (5 students) - Swing votes.
      *   *Token Logic:* Tokens aren't money; they are *capacity for relationship*. Spending them on "Objective" means withdrawing relationship capacity.
      *   *The Catch:* If the group votes for "Objective/Closure," the Agent is safe from apology, *but* anyone who voted for it cannot speak in the final debrief about *hurt*. Only those who kept tokens in "Participant" can speak. This creates the dilemma: Do we protect the Agent/Institution (Objective) or preserve our right to express moral pain (Participant)?
