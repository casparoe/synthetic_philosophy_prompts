      *   *Unanimity:* It must be hard to get. If one person holds out for "Participant," the Objective stance fails. This forces the group to feel the weight of *one person's resentment* blocking the "efficient" objective solution.

  5.  **Developing the Timeline (75 Minutes):**
      *   0-10: Setup & Scenario.
      *   10-25: Round 1 (Allocation & Discussion).
      *   25-45: Round 2 (The Coalition/Closure Vote).
      *   45-60: Consequences & Silence (The "Feel" phase).
      *   60-75: Debrief & Mapping to Strawson.

  6.  **Drafting the Debrief:**
      *   *Phase 1: Phenomenology.* Ask how it felt. Don't mention Strawson yet. Focus on the "loss" of the objective vote.
