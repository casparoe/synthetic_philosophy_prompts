  I lift my side, a heavy stone.
  You watch the wall and check the space.
  I place my feet to match your pace.
  I bear my section, bone to bone.

  The grain dissolves beneath the hand.
  A single breath begins to rise.
  We see the landing through shared eyes.
  The load belongs to shifting sand.

  No longer mine, the weight descends.
  The wall contracts on either side.
  Where separate will and purpose hide.
  A single force that never bends.

  We pause upon the final step.
  The choice to drop or carry through.
  Hangs on whether the bond holds true.
  The table waits, the promise kept.
