  8.  **Final Polish:** Check the Bayesian logic. The core issue is that under the independence model, the joint probability of two rare events is very low. Under the common cause model, the joint probability is much higher (conditioned on the cause being active). Even if the events are already observed, the *likelihood* of the hypothesis is determined by how well it predicts the observed data compared to the null. The "Old Evidence" problem is often solved by recognizing that the agent didn't know the logical implication $H \rightarrow E$ before. Here, it's slightly different: it's about model comparison. Model A (Independence) assigns low likelihood to the data. Model B (Confounded) assigns high likelihood. Therefore Data supports Model B. Marcus treats the data as fixed and uninformative about structure. Elena treats the data as informative about structure.

