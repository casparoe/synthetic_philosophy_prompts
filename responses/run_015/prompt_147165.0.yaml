answer: |-
  At St. Jude's Hospital, administrators Marcus and Elena are reviewing last quarter's infection logs, which everyone already knew showed simultaneous spikes in Pediatrics and Geriatrics every Tuesday. Marcus argues the wards are operational silos, so under the independence heuristic, the co-occurrence is just noise and offers no leverage for Elena's new theory that a shared HVAC return duct is circulating pathogens. He claims that because the data is old and the wards recieve no direct traffic, presuming independence is common sense, making her theory post-hoc fitting. Elena counters that the wards are exchangeable only under a null model, and her Bayesian network introduces a hidden confounder variable (the HVAC state) that d-connects the two wards, turning the "coincidence" into a high-likelihood prediction of her structural model rather than a low-probability accident of the independence model.

  **The Verdicts**

  **Marcus (Heuristic):**
  1.  **Assumption:** Ward A and Ward B are independent ($A \perp B$).
  2.  **Likelihood:** The probability of simultaneous spikes is $P(A) \times P(B)$. Since both are rare, this joint event is extremely unlikely under normal operations.
  3.  **Update:** Since the spikes already happened (probability 1), and the theory was generated *after* seeing the data, Marcus argues the theory adds complexity without predictive power. The old evidence is neutral; he treats the correlation as a brute fact that doesn't constrain the causal structure.
  4.  **Conclusion:** Don't spend budget on HVAC; it's just random variance.

  **Elena (Formal):**
  1.  **Assumption:** Ward A and Ward B are conditionally independent given Hidden Variable V ($A \perp B | V$).
  2.  **Likelihood:** Under the Independence Model ($M_{ind}$), $P(Data | M_{ind})$ is very low (rare coincidence). Under the Confounder Model ($M_{conf}$), $P(Data | M_{conf})$ is high (if V is active, both spike).
  3.  **Update:** We are updating on the *model structure*, not just the event frequency. The Bayes Factor $\frac{P(Data | M_{conf})}{P(Data | M_{ind})}$ is massive. The old evidence strongly favors the model that explains the correlation over the model that treats it as magic.
  4.  **Conclusion:** The data confirms the HVAC theory because only that theory makes the data unsurprising.

  **The Exact Feature Doing the Work**
  The feature is **conditional dependence via a latent confounder**. In Marcus's graph, the path between A and B is blocked (no edge). In Elena's graph, the path is open through V ($A \leftarrow V \rightarrow B$). This structural difference changes the likelihood of the joint observation. The math works because we are comparing the *marginal likelihood of the models*, not just updating a parameter within a fixed model.

  **What Breaks If You Remove It**
  If you remove the hidden variable V and force the graph to remain disconnected, the correlation between A and B becomes "noise" that the model cannot explain. You lose the ability to distinguish between "two rare things happened to happen together" and "one thing caused both." The model becomes miscalibrated; it will consistently underestimate the probability of joint outbreaks, leading to poor resource allocation when the next spike occurs.

  **The Heuristic Defender's Attack**
  Marcus will attack the **prior probability of the network structure**. He'll argue: "You drew the arrows after seeing the dots. Unless you physically inspect the ducts, you're just capitalizing on chance. Your hidden variable is a mathematical ghost invented to save the phenomenon." He will demand mechanistic proof of V before accepting the probabilistic support, claiming that without physical verification, the formal model is just overfitting noise.

  **My Stance**
  Elena is correct, and Marcus is committing a category error common in administrative reasoning. The heuristic of "presume independence" is not a neutral default; it is a strong causal claim that requires justification just as much as a claim of dependence does. By treating independence as the null hypothesis without testing it, Marcus ignores the informational content of the correlation structure itself. In Bayesian model comparison, old evidence *does* confirm a new hypothesis if that hypothesis assigns a significantly higher likelihood to the data than the previous model did. The structure of the data (the correlation) constrains the valid causal graphs. If you ignore the dependency because the evidence is "old," you are effectively refusing to learn from reality until you generate new data, which is wasteful and dangerous in a hospital. The formal network wins because it acknowledges that the *surprise* was not the spikes themselves, but the assumption that they were unrelated.
