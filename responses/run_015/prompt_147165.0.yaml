  2.  **Deconstruct the Bayesian Problem:**
      *   *Old Evidence Problem:* In Bayesianism, if evidence $E$ is already known ($P(E) = 1$), how can it confirm a new hypothesis $H$? Standard Bayes theorem $P(H|E) = P(E|H)P(H)/P(E)$ gives $P(H|E) = P(H)$ if $P(E)=1$. This is the "problem of old evidence."
      *   *Resolution:* The update isn't on $E$ itself, but on the *logical connection* between $H$ and $E$. Or, more practically in causal modeling, $E$ is data generated by a process. If $H$ changes the structure of the process generating $E$, then learning $H$ changes the likelihood of observing $E$ under the model, even if $E$ is already observed.
      *   *The Twist:* The user wants a case where independence assumptions make $E$ look neutral/negative, but a dependency (hidden confounder) makes $E$ positive support.
      *   *Scenario:* Hospital wards. Old evidence: Correlated infection spikes in Ward A and Ward B. New theory: A specific ventilation flaw (Hidden Confounder) connects them.
      *   *Heuristic Reasoner:* Wards are independent silos. Correlated spikes are just coincidence or unrelated noise. Adding a theory about ventilation doesn't change the fact that the spikes happened randomly. Actually, if the theory says "Ventilation causes spikes," and spikes happened *before* the theory, the heuristic guy says "You just fitted noise."
      *   *Formal Modeler:* The spikes in A and B are too correlated to be independent. The hidden variable (Ventilation System V) explains the correlation. Knowing $H$ (Ventilation is flawed) makes the observed correlation $E$ much more likely than under the null (Independence). Therefore $E$ supports $H$.

