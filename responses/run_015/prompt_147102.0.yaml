      *   **Constraints:** No bibliography/reading lists. Focus on reasoning, tractability, upstream dependency, and impact on modern analogues (climate tipping points). Be honest about Malthus analogies. Identify if a 4th cluster dominates.
      *   **Goal:** Determine what makes a question worth 3 years in this area.

  2.  **Evaluate the Clusters:**

