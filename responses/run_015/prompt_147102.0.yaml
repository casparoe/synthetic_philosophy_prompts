          *   *Malthus Analogy:* Malthus claimed exponential food vs. linear pop. Technology shifted the curve. Was the mechanism wrong (domain) or just delayed (temporal)? Actually, Malthus was arguably wrong on the *mechanism* of agricultural growth (he didn't foresee industrial fertilizer), not just the timing. This makes the distinction hard but crucial.
          *   *Climate Analogy:* Tipping points. Is the feedback loop slower than thought (temporal) or is the model missing a stabilizing variable (domain)?

      *   **Cluster 2: Epistemology of Deferring Verification.**
          *   *Concept:* Kicking the can down the road. "Wait 50 years." Future observers might have different standards.
          *   *Tractability:* Medium/Low. It drifts into social epistemology and ethics of belief. Hard to formalize without getting bogged down in speculative metaphysics about future agents.
          *   *Upstream/Downstream:* Downstream of Cluster 1. You need to know *what* is being deferred.
          *   *Malthus Analogy:* Malthus didn't really defer verification; he was falsified in his lifetime regarding England, then rescued by neo-Malthusians later.
          *   *Climate Analogy:* IPCC reports often say "by 2100." We are the future observers of the 1990s predictions. This is relevant, but relies on Cluster 1 being settled.

      *   **Cluster 3: Normative/Policy Force of Rescued Theories.**
          *   *Concept:* If a theory is saved by ad-hoc adjustments, does it still demand action? (The "Boy Who Cried Wolf" problem).
          *   *Tractability:* Medium. This is philosophy of action/ethics mixed with science.
          *   *Upstream/Downstream:* Furthest Downstream. Depends on 1 (is the theory true?) and 2 (do we know it's true?).
          *   *Malthus Analogy:* Neo-Malthusianism (Limits to Growth) still drives policy despite past "failures."
          *   *Climate Analogy:* If climate models are adjusted (rescued) repeatedly, does public trust erode?
          *   *Risk:* This can easily become a sociological question rather than a philosophical one.

      *   **Potential Cluster 4: The Identity Conditions of the Theory.**
          *   *Concept:* When a theory is "rescued," is it the *same* theory? (Ship of Theseus for scientific models).
          *   *Relevance:* If Malthusianism is modified to include technology, is it still Malthusianism? If Climate Model X is tuned, is it still Model X?
          *   *Dominance:* This underpins Cluster 1. If the theory changes identity, the "rescue" is actually a replacement.

