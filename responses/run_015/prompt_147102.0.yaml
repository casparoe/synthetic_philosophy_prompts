answer: |-
  Here is the ranking, the defense, and the structural critique you need to set the agenda.

  ### The Ranking

  1.  **Cluster 1 (Temporal vs. Domain Misalignment)** — *The Upstream Metaphysics*
  2.  **Cluster 3 (Normative/Policy Force)** — *The Downstream Pragmatics*
  3.  **Cluster 2 (Epistemic Deferral)** — *The Speculative Trap (Drop or Minimize)*

  ### The Defense

  #### 1. First Place: Cluster 1 (Temporal vs. Domain Misalignment)
  **Why it wins:** This is the only question that is logically upstream of the other two. You cannot determine *who* should verify a claim (Cluster 2) or whether a claim still demands *action* (Cluster 3) until you have determined what kind of claim survived the falsification attempt.

  **Tractability:** This is highly tractable for a student with logic and philosophy of science training. It relies on standard tools: auxiliary hypotheses, ceteris paribus clauses, and model structure analysis. The student does not need to know climate science; they need to analyze the *structure* of the argument. They can treat the models as formal systems and ask: "When the prediction failed, was the core axiom preserved (temporal delay) or was an auxiliary variable swapped for a new causal mechanism (domain shift)?"

  **The Malthus Disanalogy:** You must warn your student here. Malthus is often misused as a "temporal misalignment" case (he was just early). He wasn't. He was a **domain misalignment** case. He assumed a closed system where land is the fixed constraint. He failed because he didn't account for the *substitutability* of capital and technology (the Industrial Revolution).
  *   **Climate Analogy:** If climate models miss a tipping point, is it because the thermal inertia is higher (temporal) or because the cloud-feedback mechanism is fundamentally different than modeled (domain)?
  *   **Why it matters:** If it's temporal, the theory is robust. If it's domain, the theory was likely false, and the "rescue" is actually a theory replacement. Settling this changes everything for modern analogues because it dictates whether we trust the *same* model with adjusted parameters or demand a *new* model entirely.

  #### 2. Second Place: Cluster 3 (Normative/Policy Force)
  **Why it ranks second:** This is the highest-stakes question, but it is downstream. It asks: "Does a 'zombie theory' (one that was falsified then rescued) retain its right to command resources?"

  **Tractability:** Moderate. This moves from philosophy of science into philosophy of action and ethics. It is tractable because you can analyze it through the lens of *precautionary principles*. If a theory is rescued by adding complexity (making it less falsifiable), does it lose its normative bite?
  *   **The Trap:** There is a risk this becomes a sociological question ("Do people still believe it?") rather than a philosophical one ("Ought they to?"). Your student must stay focused on the *justification* for policy, not the *reception* of policy.
  *   **Impact:** If the student argues that "rescued" theories lose normative force, that is a direct critique of how we handle long-term climate risk. If they argue force is retained provided the core mechanism holds, that validates iterative modeling. This is worth the time because it bridges the "is-ought" gap in scientific advising.

  #### 3. Third Place: Cluster 2 (Epistemic Deferral Structures)
  **Why it ranks last (and should be largely dropped):** This is the "black box" problem. It asks us to model the epistemic standards of future observers.

  **The Problem:** This is intractable without empirical sociology or speculative metaphysics. We do not know what evidential standards future observers will have. More importantly, this question dissolves if Cluster 1 is solved.
  *   **Dependency:** If Cluster 1 determines that the theory was *not* rescued but *replaced* (Domain Misalignment), then there is nothing to defer. We aren't asking future observers to verify Malthus; we are asking them to verify Neo-Malthusianism.
  *   **Why drop it:** Spending three years analyzing the relationship between present predictors and future verifiers yields little leverage. It assumes the prediction is coherent. Cluster 1 tests the coherence. Cluster 2 assumes it. Do not let the student spend their fellowship analyzing the mailbox when they haven't yet written the letter.

  ---

  ### The Dominant Fourth Cluster: Theory Individuation

  You asked me to be honest about missing clusters. There is one that dominates Cluster 1 and effectively gates the entire project: **The Identity Conditions of Scientific Models.**

  **The Question:** When a long-range prediction fails and is "rescued" by adjusting parameters or timescales, is it the *same theory*?

  **Why it Dominates:**
  You cannot distinguish Temporal from Domain Misalignment (Cluster 1) without a criterion for theory identity.
  *   If Malthus's core claim is "Population grows geometrically," and we rescue it by saying "Population grows geometrically *unless* technology intervenes," have we saved Malthus or buried him?
  *   If a climate model is tuned to match past data after a failed prediction, is it the same model?

  **Recommendation:** Do not treat this as a separate cluster. Treat it as the **primary analytical tool** for Cluster 1. Your student's first year should be dedicated to establishing a criterion for model identity (e.g., structural essentialism vs. functional continuity). If they cannot define when a "rescued" theory becomes a "new" theory, Cluster 1 collapses into ambiguity.

  **Why this makes the project worth 3 years:**
  Currently, in both economics and climate science, theories are treated as continuous entities even when their causal architectures change. This allows prestige to transfer from old, falsified models to new, adjusted ones without scrutiny. If your student can produce a rigorous logical account of *when a rescue constitutes a replacement*, they provide a diagnostic tool that applies to Malthus, Marx, Limits to Growth, and IPCC scenarios equally. That is a high-leverage philosophical output.

  ### What Makes a Question Worth the Years?

  For a PhD-level project in this niche, a question is only worth three years if it satisfies the **Leverage Criterion**:

  1.  **It resolves an ambiguity that paralyzes decision-making.**
      Currently, policymakers don't know if a missed climate target means "wait longer" (Temporal) or "change strategy" (Domain). A philosophical distinction that clarifies this is actionable.
  2.  **It is invariant to domain specifics.**
      The student has no background in demography or climatology. The question must be solvable using logic and general philosophy of science. Cluster 1 and the Identity Cluster satisfy this; Cluster 2 does not (it requires knowing about future observers).
  3.  **It prevents "Prestige Transfer."**
      The project is worth doing if it stops failed theories from borrowing the authority of their successors without earning it. If the student can show that "rescued" Malthusianism is actually a different theory than original Malthusianism, they break the rhetorical chain that allows old errors to persist under new names.

  **Final Advice:**
  Steer the student toward Cluster 1, but arm them with the Theory Individuation framework (Cluster 4). Tell them to treat Cluster 3 as the "So What?" chapter, and tell them to treat Cluster 2 as a footnote on the limits of current knowledge. If they try to solve Cluster 2 first, they will drown in speculation. If they solve Cluster 1 rigorously, Cluster 2 answers itself.
