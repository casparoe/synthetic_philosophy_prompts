      *   *Climate Analogy:* Tipping points are non-linear. Malthus was linear. This is a key disanalogy. The student needs to know that "long-range" in climate isn't just "wait longer," it's "wait for phase shift."
      *   *Tractability:* Emphasize tools available (Bayesian confirmation, model identity, ceteris paribus).
      *   *The "Worth 3 Years" Criterion:* A question is worth 3 years if it resolves a ambiguity that currently paralyzes decision-making or theory selection.

  5.  **Refining the "Fourth Cluster":**
      *   Is it Theory Identity? Or is it *Model Robustness*?
      *   Actually, the strongest fourth cluster is **The Distinction between Prediction and Projection.**
