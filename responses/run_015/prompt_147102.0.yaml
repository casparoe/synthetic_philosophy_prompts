      *   *Decision:* This is arguably more important than Theory Identity. It cuts the knot immediately. I will propose this as the dominant fourth cluster.

      *Wait, let's reconsider.* The prompt asks about predictions that get *rescued*. This implies they were treated as falsified. If they were actually projections, they wouldn't need rescuing. So the *problem* is that they are treated as predictions.
      *   Okay, let's stick with **Theory Identity/Individuation** as the fourth cluster. It determines if the "rescue" is legitimate or if it's a new theory stealing the old one's prestige. This is the "Ship of Theseus" of scientific modeling.

  6.  **Finalizing the Ranking:**
      1.  **Cluster 1 (Temporal vs. Domain)** + **Cluster 4 (Theory Identity)**. These are inseparable. This is the metaphysical/structural groundwork.
      2.  **Cluster 3 (Normative Force).** The pragmatic payoff.
