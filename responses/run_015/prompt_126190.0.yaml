  **HHS Establishes Bureau Of Artistic Infection To Screen All Creative Works For Tolstoyan Compliance**

  WASHINGTON—Citing an urgent need to curb the spread of counterfeit feeling among the general populace, the Department of Health and Human Services announced Monday the formation of the Bureau of Artistic Infection, a new federal agency tasked with regulating all film, music, fiction, and public monuments according to the aesthetic principles of Leo Tolstoy.

  The bureau, operating under the Division of Emotional Hygiene, will immediately begin issuing Infection Certificates for all creative works distributed within United States borders. Under the new guidelines, a work is only classified as art if a creator, having once experienced a genuine feeling, recalls it and transmits it to others via external signs until the audience is infected by that same emotion. Any work failing to demonstrate this vector of transmission will be decertified and removed from streaming platforms, galleries, and libraries.

  "Art is not a matter of beauty or technical skill, but a means of union among men," said Bureau Director Harold P. Winstanley during a press briefing. "Our mandate is to ensure that every song, movie, or novel actually moves the recipient. If the feeling isn't transmitted, it's not art. It's a public health hazard."

  To verify compliance, the bureau has implemented a rigorous Sincerity Audit. Artists must now submit sworn affidavits, diary entries, and biometric data proving they actually experienced the emotions depicted in their work. Earlier this week, indie folk singer-songwriter Maya Linde was fined $50,000 after investigators determined she had not actually felt the heartbreak described in her latest single.

  "Our auditors reviewed Ms. Linde's physiological responses during the recording session," said Senior Compliance Officer Sarah Jenkins. "Her heart rate remained steady, and her cortisol levels were within normal limits. You cannot infect the public with sorrow you do not possess. The song has been reclassified as a counterfeit fabrication."

  Once sincerity is established, works are subjected to the Infection Certificate test. Panels of uncorrupted agricultural compliance officers from the Midwest are exposed to the work in controlled environments. If the panel does not uniformly experience the intended feeling—specifically feelings of brotherhood, love, merriment, tenderness, or peacefulness—the work is denied certification. Technical virtuosity is explicitly excluded from the evaluation criteria.

  "It doesn't matter if the guitar playing is complex or the cinematography is lush," Winstanley said. "Those are distractions. We are looking for universal accessibility. Can a simple farmer feel it? If not, it is elitist counterfeit."

  The bureau's four marks of counterfeit art have already led to the suspension of several major entertainment franchises. The blockbuster series *Galactic Sentinels* was penalized for borrowing and effectfulness. Investigators noted the films relied on recycled ready-made materials, including orphaned origin stories, quipping heroes, and city-destroying climaxes. Furthermore, the series was cited for effectfulness, using calculated shock and grandeur to produce a strong impression rather than a sincere feeling.

  "The explosions are engineered to overwhelm the nervous system, not to transmit love," Jenkins noted. "It is strikingness, not art."

  Similarly, the acclaimed prestige drama *The Wiregrass County Chronicles* was shut down after three seasons for imitation. Bureau inspectors determined the show focused on exhaustive naturalistic description—copying faces, gestures, settings, and speech—rather than transmitting a unified feeling. Stand-up comedy specials have also been targeted under the mark of diversion. Officials state that comedy often produces only pleasant nervous agitation without transmitting any real feeling accessible to everyone without exception.

  "The laughter is a reflex, not an infection of merriment," Winstanley explained. "It agitates the nerves without uniting the audience in brotherhood."

  The enforcement actions have resulted in the immediate closure of several major cultural institutions. The Museum of Modern Art was sealed yesterday and labeled a warehouse of counterfeits. Curators were informed that the majority of the collection relies on beauty and craftsmanship, which are not criteria for genuine art.

  "We found room after room of objects designed to be looked at rather than felt," said a bureau spokesperson. "There was no transmission of religious consciousness or universal feeling. Just form."

  In place of the confiscated works, the Bureau of Artistic Infection has released an approved list of compliant media currently available for public consumption. The list includes a recording of a peasant folk song regarding the harvest, a televised scene of two estranged brothers reconciling over a meal, and a live broadcast of a Sunday church service. These works have been certified as transmitting feelings of love and unity accessible to all people regardless of class or education.

  Public reaction has been mixed, though many citizens express willingness to accept the new standards. "I never understood why people liked those abstract paintings anyway," said Ohio resident and panel test subject Gary Miller. "They didn't make me feel peaceful or tender. They just made me feel confused. This new system makes sense. If I don't feel it, it shouldn't be on Netflix."

  Critics who argue that the regulations condemn nearly all acknowledged masterpieces of human history have been dismissed by the department as proponents of counterfeit culture. Officials maintain that the rejection of celebrated high art is a necessary consequence of prioritizing sincerity over beauty.

  "We are not here to preserve history," Winstanley said. "We are here to ensure infection. If a symphony requires years of training to appreciate, it is excluding the majority of men from union. That is dangerous. We need art that infects everyone, everywhere, immediately. Anything less is just amusement."

  The Bureau of Artistic Infection expects to have reviewed all existing streaming content by the end of the fiscal year. Until then, all artists are advised to focus on simple, religious, or universal feelings and to avoid the use of moonlight, storms, warriors, angels, or lovers' raptures in their upcoming projects.
