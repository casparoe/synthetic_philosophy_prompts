  **Re: Testamentary Disposition of the Continuum Designated "Arthur Pratchett"**

  Dear Executors,

  Enclosed is the Last Will and Testament drafted pursuant to the *Two-Truths (Legal Fiction) Statute of 2021*. This instrument operates strictly on the conventional level (*samvrti-satya*); it makes no claims regarding ultimate existence (*paramartha-satya*). Please note Clause 4 regarding merit transfer: the recipient's current rebirth status is uncertain, but the volitional formation remains karmically potent. Probate may be stayed if the testator attains Parinibbana prior to physical cessation.

  Sincerely,
  *The Drafter (A Temporary Designation)*

  ***

  **LAST WILL AND TESTAMENT (CONVENTIONAL DESIGNATION)**

  **1. Declaration of Designation**
  I, the causal continuum currently functioning under the convenient label "Arthur Pratchett," residing at 44 Skandha Road, Vesali, do hereby declare this to be my Will. I acknowledge that "I" refers only to a conceptually imputed unity over a stream of changing physical and mental phenomena, and that this document binds only the conventional persona recognized by the Courts of Sabhava.

  **2. Disposition of Aggregates and Property**
  I revoke all prior wills. Regarding assets conventionally regarded as "mine": I direct that the material forms currently associated with this continuum be distributed as follows. My car, a 2018 Honda causally linked to my daily commute, shall pass to my nephew. My book collection, which serves as a condition for future ignorance or wisdom depending on usage, shall pass to the Local Sangha. No ownership is transferred, only the custodial responsibility for these objects within the causal stream of the beneficiaries.

  **3. Residuary Clause**
  All other assets, rights, and karmic liabilities conventionally attached to this designation shall pass to my sister. Should she refuse, the estate shall revert to the state, understood here as a collective designation for the citizenry. I expressly disclaim any enduring interest in these assets post-mortem, as there will be no "me" to enjoy or regret their disposal.

  **4. Transfer of Merit**
  I dedicate the merit (*punya*) generated by the funding of my own funeral rites to the being previously designated as "My Mother." Recognizing she may currently exist as a hungry ghost, a deva, or have attained cessation, I intend this goodwill to reach whatever continuum currently inherits her karmic trajectory. If no such continuum exists, the merit shall dissipate into the universal ground of being, causing harm to none.

  **5. Attestation and Sound Mind**
  Signed by me, the undersigned designator, on this day. The witnesses below attest not that a permanent self was present, but that a coherent, lucid stream of consciousness signed this document without coercion from external conditions. They swear they observed the physical hand move and the mental intention arise in concordance.

  **6. Contingencies on Cessation and Fission**
  Should this continuum attain Nibbana before probate closes, rendering the beneficiary of the estate nonexistent, the estate shall be liquidated to fund mindfulness retreats. Should the causal stream branch (e.g., via teleportation error or philosophical fission), the executors shall negotiate with the resulting continuums. If multiple claimants arise possessing equal memory and psychological connectedness, the assets shall be divided equally, acknowledging all are equally "Arthur" and equally not.

  **7. No-Contest Clause**
  Any beneficiary who challenges this Will by asserting the ultimate reality of the testator's self shall forfeit their bequest. To argue that "Arthur" truly exists is to contradict the foundational metaphysics of this instrument. Litigation based on essentialism is deemed a hostile act against the conventional truth established herein.

  **Signed:** _______________________
  *(The Aggregate-Cluster formerly known as Arthur)*

  **Witness 1:** _______________________
  *(Observed the signing)*

  **Witness 2:** _______________________
  *(Observed the signing)*
