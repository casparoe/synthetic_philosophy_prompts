      *   *Wait, re-reading the prompt:* The user asks: "is my toy the right carrier, should I use it and then deliberately break it, or should I drop it?"
      *   *Decision:* Drop the toy system as an *activity*. It eats time and invites the wrong kind of cleverness. Use a *conceptual* analogy instead. The "Three Conditions" need to be introduced early but not as a dry checklist. They are the "terms and conditions" of the theorem.

