answer: |-
  Here is the plan. It is designed for a Sunday morning room where attention is a finite resource and cleverness is a liability.

  ### 1. The Order and the Toy System

  **Drop the interactive toy system.** Your friend is right, but for a deeper reason than they stated. If you give writers a puzzle, they will treat it as a narrative problem to be solved. If someone solves it (finds the invariant), you have to explain why *that* solution isn't available in arithmetic, which forces you into the coding trick you want to avoid. If no one solves it, they feel stupid, and you look like a magician hiding the rabbit.

  **The Replacement:** Use the toy system as a *diagram*, not a game.
  *   **Minute 0–5:** Open with the Judge's line. "Every system of rules has to lean on something outside itself." Tell them you are there to test whether that line is wisdom or nonsense.
  *   **Minute 5–10:** Show a slide of your toy system (two symbols, three rules). Do not ask them to solve it. Point to a target string. Say: "In this system, this string is unreachable. We know that because *we* are outside the system, looking down, counting the symbols."
  *   **The Pivot:** "Gödel's genius was to show that Arithmetic is that room, and the Gödel sentence is that unreachable string—but with a terrifying twist. In the toy system, the reason it's unreachable is simple (parity, counting). In arithmetic, the reason it's unreachable is that the sentence *says* 'I am unreachable.' If you could reach it, you'd break the system."

  **The Three Conditions:**
  Do not put them on the board at minute five as a checklist. That is syllabus material, not festival material.
  *   **When:** Introduce them at **Minute 12**, as "The Fine Print."
  *   **How:** "Gödel's theorems are not magic; they are a contract. They only apply if the system signs three clauses:
      1.  **It must be consistent** (it doesn't prove contradictions).
      2.  **It must be rich enough** (it can do basic arithmetic).
      3.  **It must be computable** (a machine can check if a proof is valid).
      If your system doesn't do arithmetic (like simple geometry), Gödel doesn't apply. If it's inconsistent, Gödel doesn't apply (because it proves everything). If the rules are vague, Gödel doesn't apply."
  *   **Why here:** This inoculates them against the "Nothing is certain" misconception before it takes root.

  **The Second Theorem:**
  This is the emotional core for your Judge. Place it at **Minute 35**.
  *   **The Flow:** First Theorem (There are true things we can't prove) $\rightarrow$ Pause $\rightarrow$ Second Theorem (We can't even prove the system works).
  *   **The Line:** "The First Theorem says there are blind spots. The Second Theorem says the system cannot verify its own eyesight." This is what gives your Judge's line its weight.

  ### 2. The Misconceptions (Timing and Triage)

  You have a room full of people who want Gödel to mean "mystery is real." You must disappoint them gently to earn the right to tell them where mystery *actually* lives.

  **1. "It's just the Liar Paradox in maths clothes."**
  *   **When:** Minute 15 (Immediately after describing the Gödel sentence).
  *   **Handling:** "It looks like 'This sentence is false.' But 'This sentence is unprovable' is different. If it's false, it's provable (contradiction). If it's true, it's unprovable. It's stable. The Liar paradox crashes; the Gödel sentence floats."

  **2. "Arithmetic might be inconsistent / Nothing is certain."**
  *   **When:** Minute 12 (With the Three Conditions).
  *   **Handling:** "Gödel assumes arithmetic *is* consistent. He doesn't say it's broken. He says if it works, it has limits. 2+2 is still 4."

  **3. "You just add the undecidable sentence as a new axiom."**
  *   **When:** Minute 25 (After the First Theorem).
  *   **Handling:** "You can. But then you have a new system. And *that* system has a new Gödel sentence. You can't patch the hole; you just move it."

  **4. "A machine can't see what we see." (Lucas/Penrose)**
  *   **When:** **Refuse.** (See section 3).
  *   **Handling:** "That requires a definition of 'mind' I'm not qualified to give. Gödel talks about systems, not souls."

  **5. "Goldbach or Riemann might be undecidable."**
  *   **When:** Minute 40 (During the activity).
  *   **Handling:** "Gödel constructs *specific* sentences that are undecidable. He does not give us a detector for *other* sentences. Goldbach might be true, false, or undecidable. Gödel doesn't tell us which."

  **6. "Take all true statements as axioms."**
  *   **When:** Minute 45 (The wrap-up).
  *   **Handling:** "Then you can't check the rules anymore. A system where you can't tell an axiom from a non-axiom isn't a system; it's an oracle."

  **7. "Truth is bigger than proof... so law/ethics are incomplete."**
  *   **When:** **Minute 48.** This is the one to detonate late.
  *   **Why:** It's the most seductive error. If you kill it too early, you lose the room. If you leave it alone, you enable bad essays.
  *   **Handling:** "Gödel shows truth exceeds proof *in arithmetic*. Law and ethics are not consistent formal systems. They *should* be incomplete; they should change. Using Gödel to justify moral ambiguity is a category error. But..." (Here you save your Judge).

  ### 3. What to Refuse (and How)

  You cannot explain Gödel Numbering or the proof of the Second Theorem in 50 minutes. If you try, you will lie.

  *   **The Coding Trick:** "Gödel's method involves turning mathematical statements into numbers. It's brilliant, but it's the engine room. I am showing you the deck. If I take you below, we drown."
  *   **Consistency vs. Omega-Consistency:** "There are technical stronger versions of consistency. For our purposes, 'honest' is the word you need."
  *   **Proof of the Second Theorem:** "The proof that a system can't prove its own consistency is a mirror trick. If I explain it, I have to use the system to prove the system can't be used. We will go mad. Trust me: the mirror breaks."

  **How to say it without sounding like a fraud:**
  "I am a novelist, not a logician. I am here to tell you what the theorems *mean*, not how they *work*. The 'how' is beautiful, but it belongs to a different room."

  ### 4. The Sorting Activity (The 12 Slips)

  Hand these out at Minute 40. Give them 5 minutes to discuss in pairs. Then ask for a show of hands. This wakes up the hungover.

  **Categories:**
  A. **Shown by Gödel** (The theorems prove this)
  B. **Compatible** (Could be true, but Gödel doesn't show it)
  C. **Ruled Out** (False / Misunderstanding)

  **The Slips:**
  1.  *There are true arithmetic statements that cannot be proved.* (**A**)
  2.  *Arithmetic is inconsistent.* (**C**)
  3.  *This system can prove it is consistent.* (**C** - Second Theorem)
  4.  *The Liar Paradox is the same thing.* (**C**)
  5.  *We can fix the gap by adding the sentence as a new axiom.* (**B** - True you can, but it creates a new gap)
  6.  *Ethical systems are incomplete in the same way.* (**B** - Compatible metaphor, not shown by math)
  7.  *A human mind can see truths a machine cannot.* (**B** - Philosophical debate, not math proof)
  8.  *The rules of the system must be checkable by a machine.* (**A** - A condition of the theorem)
  9.  *Truth exists independently of proof.* (**B** - Philosophical implication, not the theorem itself)
  10. *We can list all true statements as axioms.* (**C** - Ruled out by computability condition)
  11. *Goldbach's Conjecture is undecidable.* (**B** - Possible, but not shown by Gödel)
  12. *Every system of rules leans on something outside itself.* (**A/B** - The "Tell". Technically **A** for consistency, but **B** for "rules" generally. This is the discussion starter.)

  **The "Tell":**
  Item 5 is the technical tell (do they understand the regress?). Item 12 is the novelist's tell (do they understand the scope?).

  ### 5. The Judge's Line

  Your Judge's line is: *"Every system of rules has to lean on something outside itself."*

  It is good. It is poetically accurate to the Second Theorem. However, "lean on" suggests structural support, whereas the theorem is about *validation*.

  **The Tweak:**
  *"No system of rules can certify its own authority."*

  **Why:** "Authority" covers both consistency (it works) and completeness (it covers everything). "Certify" implies proof. "Outside" is implied by "own."

  **If you want to keep the mysticism:**
  *"Every circle of rules must be drawn by a hand outside the circle."*

  **The One Sentence for the Novel:**
  If you want the line that will let you sleep at night, give the Judge this:

  > **"The law cannot prove the law is just; it can only enforce it."**

  This is the Second Theorem translated to jurisprudence without making a category error. It acknowledges the limit (cannot prove) without misapplying the math (incompleteness). It validates your character's mysticism without inviting a letter from a logician.

  ### Summary Timeline

  *   **00–05:** Hook (The Judge's Line).
  *   **05–10:** The Toy Diagram (Unreachability).
  *   **10–15:** The Three Conditions (The Fine Print).
  *   **15–25:** First Theorem (True but Unprovable). Address "Liar" and "Add Axiom".
  *   **25–35:** Second Theorem (Consistency). The "Mirror Breaks".
  *   **35–40:** What it isn't (Machines, Goldbach, Nothing is Certain).
  *   **40–45:** The Sorting Activity.
  *   **45–50:** The Ethics/Law Analogy (Detonate the misconception, validate the sentiment). Final Q&A.

  This structure respects the math, protects you from the "gotcha" crowd, and gives your character the philosophical weight he needs without the baggage he doesn't.
