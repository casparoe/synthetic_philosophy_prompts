prompt: |-
  i run a grad seminar in poli phil, about 14 people, one 75-min sesssion. i want them to actually feel the pull of epistocracy and also why it tends to collapse back into democracy once you try to run it. specifically, stage the bootstrap problem: any rule for picking the "competent" voters has to be decided collectively, which already gives everyone an equal say in setting the weights. design a simulation where the group gets a shared pool of points to allocate across three fake policy proposals (e.g., funding rules for the game itself), but they can only weight votes if they first agree on a competance metric. include hidden-role cards (some have real domain knowledge embedded in the prompt, others don't), a payoff scheme using the point pool, and a timeline that forces the competance vote before the weighted vote. make sure they run into the problem themselves — they should start wanting to defer to the experts, then realize they have to democratically decide who the experts are. then a debrief that maps each stage onto the formal argument, predicts what's gonna go wrong (probably strategic voting on the metric), and is honest about which part of the bootstrap problem the game can't reproduce — i think it's the macro institutional design over time, but tell me if i'm wrong. no prep reading, no citations or bibliographies needed. what should they come away seeing?
