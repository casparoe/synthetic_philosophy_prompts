      *   **Key Leibnizian Concept:** *Connexio rerum* (connection of things). The world is a web. You can't change one thing without changing the whole. But your actions are *part* of the web.
      *   **Key Distinction:** Absolute Necessity (logic/math) vs. Moral Necessity (God's choice based on goodness). Human freedom operates within Moral Necessity.

  5.  **Address the Scholarly Consensus:**
