  The envelope was in Leo's locker, tucked inside a hollowed-out copy of *The Great Gatsby*. Inside was a single sheet of paper printed on thermal stock, like a receipt from the future.

  **FINAL TALLY: SENIOR CLASS PRESIDENT**
  **JENKINS: 412**
  **MILLER: 413**
  **STATUS: CERTIFIED**

  Leo stared at it. Perfect information. He knew exactly how the election would end before a single ballot was cast. Miller would win by one vote.

  Leo folded the paper and walked to the cafeteria, where the voting booths were set up beside the pizza line. He had already decided who he was going to vote for. Yesterday, standing in this exact spot, Leo had flipped a quarter. Heads for Jenkins, tails for Miller. It had landed heads.

  He was a man of his word, even to himself. The coin flip was his algorithm. The outcome of the election was irrelevant to his utility function; his utility was derived solely from adhering to the pre-commitment.

  He looked at the prediction slip again. *Miller wins.*

  If Leo cared about who won, this information would be valuable. He could switch his vote to Miller, ensuring his preferred candidate won, or switch to Jenkins to create a tie. But Leo didn't care about the president. He cared about the integrity of the coin flip. Therefore, the information could not change his action. He would vote for Jenkins regardless of whether the slip said Jenkins won by a landslide or lost by a single vote.

  The expected value of this perfect information was zero. It updated his beliefs about the universe, but it updated nothing about his hands.

  He stepped into the booth. He marked the oval for Jenkins. He felt a strange sense of lightness, the burden of choice removed by the rigid architecture of his own indifference.

  He walked to the ballot box. It was a sleek, black thing donated by a tech parent, featuring a digital slot instead of a slit. Leo folded his ballot. As he moved to insert it, the prediction slip slipped from his pocket.

  It fluttered down, landing on the sensor pad of the box.

  Leo reached for it, but the machine hummed. The red light of the scanner swept over the prediction slip first. The thermal paper darkened instantly, the numbers vanishing into blackness. Then, the light swept over Leo's ballot.

  The machine didn't whir. It didn't click. Instead, a small printer slot on the front of the box churned to life. It spat out a single piece of thermal paper.

  Leo picked it up. It wasn't a receipt. It was a new prediction.

  **FINAL TALLY: SENIOR CLASS PRESIDENT**
  **JENKINS: 413**
  **MILLER: 413**
  **STATUS: PENDING**

  Leo looked at the ballot box. The digital display flickered, showing a single, blinking cursor. It waited for him to flip the coin again.
