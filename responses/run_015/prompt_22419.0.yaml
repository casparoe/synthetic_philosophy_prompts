  2.  **Understand Good's Theorem (Value of Information):**
      *   I.J. Good's theorem states that the expected value of free information is always non-negative. Specifically, information has *positive* value if it can change your decision to a better one. If the information doesn't change your decision (your optimal action remains the same regardless of the outcome), the value of that information is zero.
      *   *Application:* The protagonist needs to be committed to an action (e.g., voting for Candidate A) regardless of what the new information tells them (e.g., Candidate A is winning, losing, corrupt, saintly). The info must update their credence (beliefs) but not their choice.

  3.  **Drafting - Scene Setting:**
