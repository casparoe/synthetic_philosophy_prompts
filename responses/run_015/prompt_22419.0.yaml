      *   Setting: School hallway or computer lab.
      *   Conflict: Student Council Election.
      *   The Info: A leak, a hack, a whisper? Let's go with a mysterious note or digital leak.
      *   The Decision: Who to vote for? Or whether to vote at all?
      *   To satisfy Good's Theorem: Leo must have a dominant strategy. Maybe he doesn't care about the outcome, only the act. Or maybe he's voting based on something immutable (like a promise to a friend) regardless of merit.
      *   *Better angle:* Leo has already decided to vote for the incumbent, Sarah, because she promised him pizza parties. The info reveals she's actually going to cancel pizza parties, but he's still going to vote for her because... why? Because he's already committed? No, that changes the optimal action if the goal is pizza.
      *   *Better angle 2:* Leo has decided to vote for *no one* (abstain) because he thinks the election is rigged. The info reveals the election is actually fair. His belief changes (it's fair), but his action remains (abstain) because he doesn't care about the outcome anyway.
      *   *Better angle 3 (Simpler):* Leo is voting for his best friend, Mike, no matter what. The info reveals Mike is terrible. Leo still votes for Mike. Belief changes (Mike is terrible), Action stays (Vote Mike). Value of info = 0.

