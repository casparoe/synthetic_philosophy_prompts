      *   **Claim 3 (Virtue Theorist Response):** "The virtue theorist's response is to redefine the virtue. Aristotle's virtue was, on this reading, really a trait, and the virtue theorist swaps it out for a habit: a virtue is now just a pattern of behavior that happens to be consistent, so the situationist data stop applying."
