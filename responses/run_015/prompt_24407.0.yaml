answer: |-
  Your intuitions are not tracking "species" as objective biological units, nor are they tracking pure individual welfare. Instead, they consistently track a **Relational-Stewardship** model. On this account, species do not have intrinsic value simply by existing; they have derivative value based on three factors: (1) their **ecological function** (keystone vs. unremarkable), (2) their **historical and causal relationship with humanity** (beloved, human-caused extinction, or captive dependency), and (3) the **welfare of the individuals** involved (suffering overrides existence).

  This account resolves your specific tensions. In the **Rhino vs. Cryptic** case, the biological individuals are identical, but the *relationship* is not; the Rhino carries historical and cultural weight that the newly classified cryptic species lacks, explaining why your obligation shifts with the label. In the **Rhino vs. Invasive** case, the act (extinction) is the same, but the *relational value* is opposite: saving the Rhino preserves a valued ecological and cultural node, while eradicating the Invasive restores ecological integrity and protects valued native species. In the **Dodo vs. Dinosaur** case, recency matters because moral responsibility and relational connection fade over deep time; we feel responsible for the Dodo (human-caused, recent memory) but bear no relationship to the Dinosaur.

  This principle predicts a specific verdict for a case you have not listed: **De-extinction.** If scientists proposed bringing back the Passenger Pigeon (recently extinct, human-caused, ecological function lost) versus the Mammoth (ancient, less direct human causality), your account predicts you would feel a stronger moral obligation to support the Pigeon. The Pigeon repairs a specific rupture in our shared history and ecology, whereas the Mammoth is more of a scientific novelty with weaker relational ties.

  Verdict: Your judgments are best captured by a principle of Relational Stewardship, where the moral value of a species is derivative of its ecological function, historical relationship with humanity, and our causal responsibility for its plight, rather than its intrinsic biological status.
