answer: |-
  **Scenario:** Two specialized technicians (Patient $\rho=0$, Impatient $\rho=0.08$) negotiate identical two-year contracts with a monopsonist employer who observes their discount types perfectly during screening. The job entails a high turnover cost ($L=500$) for the firm if the worker quits mid-contract. The Patient worker values stability and will not quit for any wage above their reservation level; the Impatient worker, valuing immediate liquidity, credibly threatens to quit after Year 1 unless compensated heavily upfront. To minimize expected cost, the firm offers the Patient worker a back-loaded contract (0 Year 1, 200 Year 2) and the Impatient worker a front-loaded retention premium (210 Year 1, 0 Year 2).

  **Plans & Totals:**
  *   **Patient Plan:** Accepts 0 now, 200 later. Undiscounted Sum = **200**. (PV to Patient = 200).
  *   **Impatient Plan:** Accepts 210 now, 0 later. Undiscounted Sum = **210**. (PV to Impatient = 210).
  *   **Result:** The Impatient worker ends up with 10 units more total well-being by the Patient's own metric.

  **Feature Doing the Work:** **Credible Turnover Threat.** The Impatient worker's high discount rate makes the threat to quit for liquidity reasons credible, forcing the firm to pay a retention premium that exceeds the Patient's nominal wage. The Patient worker's virtue (stability) allows the firm to extract surplus by deferring payment.

  **If Deleted:** If turnover costs were zero (or the threat not credible), the firm would offer both workers the same lowest-cost contract (the back-loaded 0/200), and the Patient worker would win on nominal sum (200 vs. the Impatient's PV-equivalent 185).

  **Strongest Objection:** **The "Coasean" Cheat.** A defender of zero pure time preference will argue this isn't a victory for impatience but a failure of the Patient worker's bargaining position: "Your Patient agent is being exploited by a monopsonist. In a competitive market, the Patient worker could simply sign the Impatient contract (210 now) and invest the surplus, achieving the same outcome. By making the offer *type-contingent*, you've baked the discrimination into the spec rather than deriving it from the time preference itself." (My reply: The spec allows the counterparty to read the type; if the firm knows the Patient worker doesn't *need* the premium to stay, competitive pressure doesn't force them to pay it—profit maximization dictates paying the reservation price, which is lower for the 'captive' Patient type.)
