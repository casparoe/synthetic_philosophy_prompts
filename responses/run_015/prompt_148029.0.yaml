      *   *Insight:* The girlfriend example shows that spoiler sensitivity is a *preference profile*, not an objective harm. But the *norm* treats it as objective harm. Why? Because it's a coordination problem. It's easier to ban all spoilers than to tag "spoiler-sensitive people only."
