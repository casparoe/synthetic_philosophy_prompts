answer: |-
  You have identified a genuine philosophical puzzle. The strictness of the spoiler norm *does* outstrip the obvious logical justification for it. If the harm were simply "loss of information," your girlfriend's preference and the rewatch phenomenon would disprove the norm entirely.

  The reason the norm persists is that it isn't protecting a single thing. It is protecting a cluster of distinct values that usually travel together but can come apart. To understand the tension, we have to separate **what the norm claims to protect** from **what actually generates the annoyance.**

  Here is an analysis of what the anti-spoiler norm presupposes, the competing stories about why it exists, and how to test which one is true.

  ### 1. What the Norm Presupposes
  The anti-spoiler norm rests on three specific philosophical assumptions about art and experience:

  *   **Assumption A: Art is an Event, Not an Object.**
      The norm presupposes that a film is not the file on the disk or the scenes on the screen; it is the *sequence of mental states* the viewer undergoes. If you change the sequence of information, you have changed the artwork itself, even if the pixels are identical.
  *   **Assumption B: Uncertainty has Intrinsic Value.**
      It presupposes that the cognitive state of *not knowing* is a positive good, not just a lack of data. The mental work of hypothesizing, worrying, and anticipating is part of the "labor" of viewing that the audience is entitled to perform.
  *   **Assumption C: The Audience has a Right to Cognitive Autonomy.**
      It presupposes that you have a right to control the input into your own mind regarding a specific cultural object. Having a specific thought ("The butler did it") planted by a stranger feels like a violation of your mental territory, whereas generating that thought yourself feels like an achievement.

  ### 2. The Three Competing Stories
  You asked if it is one idea or several. It is several. When people argue about spoilers, they are usually talking past each other because they are relying on different underlying stories.

  #### Story 1: The Cognitive Engagement Theory (The Puzzle)
  *   **The Idea:** Narrative art is a problem-solving exercise. The viewer is constantly running a simulation: *Where is this going? Who is lying?*
  *   **The Harm:** A spoiler collapses the simulation. It stops the brain from doing the work.
  *   **Explains:** Why mysteries and thrillers have the strictest spoiler norms.
  *   **Fails to Explain:** Why people get angry about spoilers in character dramas where there is no "puzzle" to solve. It also struggles with the **Rewatch Objection**: If the value is solving the puzzle, rewatching should be boring. But rewatching is often beloved.

  #### Story 2: The Emotional Pacing Theory (The Rollercoaster)
  *   **The Idea:** Art is about emotional regulation. The director structures tension and release. Dread requires uncertainty. Surprise requires ignorance.
  *   **The Harm:** A spoiler ruins the *timing* of the emotion. Knowing a character dies turns "dread" into "sadness" 40 minutes early. It changes the *quality* of the emotion, not just the fact of it.
  *   **Explains:** Why "It's devastating" (review) is okay, but "He dies" (spoiler) is not. One predicts the weather; the other tells you exactly when the lightning strikes.
  *   **Fails to Explain:** Your girlfriend. Some people process emotion *better* with safety rails. Knowing the tragedy is coming allows them to prepare and appreciate the craft rather than being blindsided.

  #### Story 3: The Agency Violation Theory (The Consent)
  *   **The Idea:** The harm isn't about the film at all; it's about social boundaries.
  *   **The Harm:** It is a violation of consent. You have declared a boundary ("I haven't seen this"), and the spoiler crosses it. The anger is the same anger you feel when someone touches your belongings without asking.
  *   **Explains:** The *intensity* of the anger. It explains why the norm is strict even for bad movies (you still have a right not to know the ending of a bad movie). It explains the **Rewatch Objection**: On a rewatch, you *consent* to knowing. With a spoiler, the knowledge is forced.
  *   **Fails to Explain:** Why we don't have spoiler norms for history books or sports scores (see below).

  ### 3. Resolving the Tensions You Identified

  Here is how these stories handle the specific contradictions you raised:

  **Reviews vs. Spoilers**
  *   *The Tension:* Both give information before viewing.
  *   *The Resolution:* Reviews are **probabilistic** ("This is good"); Spoilers are **deterministic** ("This happens").
  *   *Which Story:* **Emotional Pacing.** A review sets an expectation of *quality* (which frames the experience), but a spoiler sets an expectation of *plot* (which dictates the experience). Knowing a bridge is safe (review) allows you to cross it; knowing the bridge collapses halfway (spoiler) stops you from crossing it the same way.

  **Sports Scores**
  *   *The Tension:* "Don't tell me the score" is identical to "Don't tell me the ending."
  *   *The Resolution:* In sports, the *outcome* is the primary value. In narrative art, the *journey* is the primary value.
  *   *Which Story:* **Cognitive Engagement.** In sports, the uncertainty *is* the product. In film, uncertainty is a *tool* used to deliver the product (theme, character, beauty). However, the "Don't tell me the score" norm is actually fading faster than the film spoiler norm, suggesting sports are moving toward "highlights culture" where the outcome matters less than the plays.

  **Documentaries/History/Museums**
  *   *The Tension:* No spoiler warnings for non-fiction.
  *   *The Resolution:* Non-fiction claims to represent Truth. The value is the accuracy of the correspondence to reality, not the narrative suspense.
  *   *Which Story:* **Cognitive Engagement.** If a history book is "The Fall of Rome," you know the end from the title. The value is in the *explanation*, not the *surprise*. If a documentary uses narrative suspense techniques (true crime), spoiler norms *do* apply.

  **Rewatching**
  *   *The Tension:* Knowing the end is fine on a rewatch.
  *   *The Resolution:* This is the strongest evidence for **Agency Violation.**
  *   *Why:* On a first watch, you are in "Discovery Mode." On a rewatch, you are in "Appreciation Mode." A spoiler forces you into Appreciation Mode before you have finished Discovery Mode. It steals the *choice* of when to switch modes.

  ### 4. Which Parts of the Norm Need Which Ideas?

  *   **The Ban (Subreddits/Tags):** This relies on **Agency Violation.** It is a coordination rule to protect consent. It survives even if the film is spoiled for you personally, because it protects the community's right to choose.
  *   **The Anger (Personal Fury):** This relies on **Emotional Pacing.** You are angry because your specific emotional trajectory was hijacked. You were prepared for dread, and they gave you resignation.
  *   **The "Ruin" Claim (It's destroyed):** This relies on **Cognitive Engagement.** This is the weakest claim. As your girlfriend proves, the film isn't destroyed. This part of the norm is hyperbolic.

  ### 5. How to Settle Which Story is Right

  Since multiple stories fit the facts, we need to look for edge cases where they diverge. Here is how you could test them:

  **Test 1: The "Bad Twist" Experiment**
  *   *Hypothesis:* If **Cognitive Engagement** is true, a spoiler should ruin a movie with a brilliant twist but *help* a movie with a terrible twist (saving you from disappointment).
  *   *Reality:* People still get angry about spoilers for movies with terrible twists.
  *   *Verdict:* This supports **Agency Violation.** The harm is the crossing of the boundary, not the quality of the information.

  **Test 2: The "Self-Spoiler" Study**
  *   *Hypothesis:* If **Emotional Pacing** is true, people who read spoilers should report different *emotional* profiles (less shock, more anticipation) than those who don't.
  *   *Reality:* Psychological studies (e.g., Leavitt & Christenfeld, 2011) actually suggest people *enjoy* stories more with spoilers.
  *   *Verdict:* This suggests the "Harm" is largely **Social/Agency**, not Hedonic. The "ruin" is a social performance of boundary enforcement, not a report of actual reduced enjoyment.

  **Test 3: The Genre Variation**
  *   *Hypothesis:* If **Cognitive Engagement** is true, spoiler norms should be weak for genres without puzzles (e.g., slice-of-life, romance).
  *   *Reality:* Spoiler norms are still strong for romances ("Do they get together?").
  *   *Verdict:* This supports **Emotional Pacing.** The tension of *will they/won't they* is an emotional state, not a puzzle to be solved.

  ### Conclusion

  The tension you feel exists because the norm is doing too much work. It is trying to be a **safety rule** (protecting your enjoyment), a **etiquette rule** (protecting your consent), and an **aesthetic rule** (protecting the art) all at once.

  *   **The Aesthetic Rule** is false (as your girlfriend proves).
  *   **The Safety Rule** is debatable (studies show spoilers don't necessarily reduce enjoyment).
  *   **The Etiquette Rule** is the only one that holds up.

  The norm persists not because spoilers objectively ruin films, but because **uncertainty is a non-renewable resource.** Once it is gone, it is gone forever. The norm is a conservation law. It treats the state of "not knowing" as a fragile ecosystem that the community must protect, regardless of whether any individual viewer actually benefits from it.

  The anger you see isn't about the film; it's about the theft of a finite cognitive state.
