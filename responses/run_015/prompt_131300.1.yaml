      *   This is the killer argument to persuade the user.

  8.  **Final Plan:**
      *   Validate the argument (Black's Spheres).
      *   Address the Flatmate (pushes the buck).
      *   Analyze the "Third Sphere" worry: Show that *keeping* PII makes the worry real (ontological instability), while *rejecting* PII solves it (ontological stability, epistemic variation).
      *   Analyze the "Space" worry: Forces a choice on Space (Substantivalism vs Relationism).
      *   Conclusion: Reject (1). It's the cost of being a realist about the two spheres.

      *(Self-Correction during drafting)*: Wait, if I keep PII, and the symmetric world has 1 sphere, does nudging the third sphere *create* a second sphere? Yes, that's exactly what the user fears. "Whether these two things are one thing or two seems to depend on where an unrelated third object happens to be sitting."
      *   If PII is true: Symmetric = 1 sphere. Asymmetric = 2 spheres. Moving the third sphere *creates* a sphere. That is absurd.
      *   If PII is false: Symmetric = 2 spheres. Asymmetric = 2 spheres. Moving the third sphere just changes properties.
      *   Therefore, to avoid the absurdity that moving a third sphere creates/destroys a first sphere, you **must** reject PII.
      *   This turns the user's worry on its head. The worry is an argument *for* rejecting PII, not against it.
      *   I need to make this very clear.

