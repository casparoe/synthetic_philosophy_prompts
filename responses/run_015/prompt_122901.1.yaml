prompt: |-
  I write novels, and I'm revising a manuscript in which I need to settle a line of dialogue before I can move on. A neuroscientist character tells a recently widowed patient, convinced she has seen her dead husband standing in the doorway, that her experience is the same process as ordinary seeing, only nothing is correcting it. He gets there by way of the line that perception is controlled hallucination — I first heard it at a festival panel, where it was being used to explain why eyewitnesses get things wrong — and my editor says it has become a tic of popular neuroscience and that I should know what it commits my character to before I keep it in his mouth.

  Could you set out, as a menu, the distinct precise claims that slogan might be expressing: the near-trivial ones (experience goes beyond what arrives at the sensory surfaces; expectation shapes what one sees), the genuinely contested ones (the difference between perceiving and hallucinating is a matter of degree, or turns on how much weight the system gives to sensory error signals rather than on whether anything is out there), and the radical ones (experience never puts us in contact with mind-independent things, so the widow lacks nothing the rest of us have)? I've seen predictive processing and talk of precision-weighting invoked in the same breath; I don't want a survey of who argued what, and I can't check sources — I want the claims themselves.

  For each reading, say whether it is essentially a platitude, a defensible but contested thesis, or false, and above all whether it would actually license my character's continuity claim or whether that claim trades on sliding between senses of "hallucination." He is meant to be intelligent and partly right rather than a strawman, so flag which reading, if any, lets him stay that way.

  I'd rather have a menu with its weak joints marked than a tidy one: for each verdict, say what would change your mind, and note where you are extrapolating past what the neuroscience actually settles.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** A novelist revising a manuscript.
      *   **Context:** A neuroscientist character tells a widowed patient (who sees her dead husband) that her experience is the "same process as ordinary seeing, only nothing is correcting it." He uses the slogan "perception is controlled hallucination."
      *   **Problem:** The editor says this slogan is a "tic of popular neuroscience" and warns about the philosophical/scientific commitments involved.
      *   **Task:** Create a "menu" of distinct precise claims the slogan might express.
      *   **Categories:** Near-trivial (platitudes), genuinely contested (defensible but debated), radical (philosophically heavy).
      *   **Requirements for each item:**
          *   Status (Platitude/Contested/False).
          *   Does it license the character's continuity claim (that widow's vision = ordinary seeing)?
          *   Does it trade on equivocation/sliding senses of "hallucination"?
          *   What would change my mind?
          *   Where am I extrapolating past settled neuroscience?
      *   **Goal:** Help the author keep the character intelligent and partly right, not a strawman.
      *   **Constraint:** No survey of who argued what (no Anil Seth vs. Karl Friston vs. Andy Clark deep dive by name), focus on the *claims themselves*. No source checking allowed (rely on internal knowledge).

  2.  **Deconstruct the Slogan: "Perception is Controlled Hallucination"**
      *   *Core Idea:* Predictive Processing (PP) / Predictive Coding. The brain generates models of the world and updates them based on sensory prediction errors.
      *   *The Character's Claim:* Ordinary seeing and the widow's vision use the *same process*, differing only in the "correction" mechanism (precision weighting of sensory evidence).
      *   *The Editor's Worry:* Equivocation. "Hallucination" usually means "seeing what isn't there." If *all* perception is hallucination, the word loses its discriminatory power.

  3.  **Drafting the Menu Items (Iterative Process):**

      *   *Item 1: The Trivial/Methodological Claim.*
          *   Claim: Sensory input is ambiguous; the brain must guess to make sense of it. Top-down influence exists.
          *   Status: Platitude/Consensus.
          *   License for Character? Weakly. It explains *influence*, not *identity*.
          *   Equivocation? Yes, if he calls this "hallucination."
          *   Mind Change: If new evidence showed purely bottom-up processing exists (unlikely).

      *   *Item 2: The Mechanistic Continuity Claim (Predictive Coding).*
          *   Claim: The same neural architecture (hierarchical generative models) underlies both veridical perception and hallucination. The difference is parameter tuning (precision weighting).
          *   Status: Defensible/Contested (Empirical).
          *   License for Character? Strongly. This is exactly what he says.
          *   Equivocation? No, if "hallucination" refers to the *generative mechanism*, not the *truth value*.
          *   Mind Change: If distinct neural pathways were found for hallucinations vs. perception.

      *   *Item 3: The Phenomenological Claim.*
          *   Claim: What it *feels like* to see a real chair is intrinsically indistinguishable from seeing a hallucinated chair at the moment of experience.
          *   Status: Contested (Philosophy of Mind/Psychology).
          *   License for Character? Yes, supports the "same experience" idea.
          *   Equivocation? Risky. Ignores subtle phenomenological differences (e.g., coherence, stability).
          *   Mind Change: If specific qualia markers for "reality" were identified.

      *   *Item 4: The Radical Epistemological Claim.*
          *   Claim: We never see the world directly, only our models. Therefore, *all* perception is hallucination in the sense of being mind-dependent.
          *   Status: Radical/Philosophical (Idealism/Representationalism).
          *   License for Character? Too strong. Makes the widow's grief no different from anyone's reality, which might be too cold/dismissive for the scene.
          *   Equivocation? Yes, redefines "hallucination" to mean "representation."
          *   Mind Change: If direct realism were proven (hard to imagine in neuroscience terms).

      *   *Item 5: The "Correction" Claim (Precision Weighting).*
          *   Claim: The *only* difference is the weighting of prediction errors (sensory evidence) vs. priors (expectations).
          *   Status: Contested/Overstated.
          *   License for Character? This is the crux of his dialogue.
          *   Equivocation? Potential slide between "process" and "outcome."
          *   Mind Change: If neurochemistry shows distinct pathways (e.g., serotonin vs. dopamine specificities in psychosis vs. perception).

  4.  **Refining and Formatting:**
      *   Need to ensure the tone is helpful to a writer, not just a dry list.
      *   Must explicitly answer: "Does this license the character's continuity claim?" and "Is he intelligent/partly right?"
      *   Must include "What would change your mind" and "Extrapolation warnings."
      *   Structure: Introduction -> The Menu (Claim, Status, License, Equivocation, Uncertainty) -> Recommendation for the Character.

  5.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I avoid name-dropping theorists? *Yes, focus on claims.*
      *   *Check:* Did I address the "controlled" part of the slogan? *Yes, via precision weighting.*
      *   *Check:* Is the distinction between "process" and "content" clear? *Crucial for the character's defense.*
      *   *Check:* The user asked for "false" options too. *I should include one that is likely scientifically inaccurate to show the trap.* (e.g., The claim that the brain *never* contacts reality).
      *   *Refinement on the Character:* The character needs to be empathetic but scientifically grounded. The "Mechanistic Continuity" claim is the safest bet for him to be "partly right" without being a nihilist.

  6.  **Final Polish:**
      *   Ensure the "Menu" format is clear.
      *   Make sure the "Verdict" on the character's dialogue is explicit at the end.
      *   Check constraints: "I can't check sources." (Acknowledge this limitation in the uncertainty sections).

  7.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  Here is a menu of the distinct claims embedded in the slogan "perception is controlled hallucination," structured to help you evaluate your character's dialogue.

  I have separated these by their scientific and philosophical weight. For each, I assess whether it licenses your character's specific claim (that the widow's experience is the *same process* as ordinary seeing, differing only in correction) and whether it relies on sliding definitions.

  ### 1. The "Ambiguous Input" Claim
  **The Claim:** Sensory data arriving at the retina (or ear, skin) is inherently ambiguous and insufficient to determine the state of the world. The brain *must* impose a structure or guess to generate a coherent experience.
  *   **Status:** **Platitude / Consensus.** There is no serious neuroscience that claims the brain is a passive camera. The "inverse problem" (inferring causes from effects) is standard.
  *   **Licenses Character's Continuity Claim?** **No.** This establishes that ordinary seeing involves *construction*, but it does not establish that the widow's vision is the *same kind* of construction. It explains why we make mistakes, not why grief looks like a man.
  *   **Equivocation Risk:** **High.** If the character uses this to justify calling ordinary seeing "hallucination," he is stretching the word. A guess based on data is not usually called a hallucination in clinical or lay terms.
  *   **What would change my mind:** Evidence that sensory surfaces encode a 1:1 isomorphic map of the world without need for inference (effectively impossible given optics/neurology).
  *   **Extrapolation Warning:** This claim settles *that* the brain adds information, not *how much* or *what kind*.

  ### 2. The "Mechanistic Identity" Claim
  **The Claim:** The neural architecture used to generate ordinary perception (hierarchical generative models) is identical to the architecture used during hallucinations. There is no "reality module" that turns on for normal seeing and off for hallucinations.
  *   **Status:** **Defensible but Contested.** This is the core of Predictive Processing frameworks. It is widely held in computational psychiatry, but some neurobiologists argue that specific thalamocortical loops or neuromodulatory states (e.g., specific serotonin/dopamine configurations) create a qualitative mechanistic difference, not just a quantitative one.
  *   **Licenses Character's Continuity Claim?** **Yes.** This is the strongest scientific ground for your character. It allows him to say, "The engine is the same; the regulation is different."
  *   **Equivocation Risk:** **Low.** Here "hallucination" refers to the *direction of inference* (model-to-data) rather than the *truth value* of the content. He is using "hallucination" to mean "top-down generation," not "falsehood."
  *   **What would change my mind:** Discovery of a dedicated neural pathway that activates *only* during veridical perception to "tag" reality, distinct from the pathway used in psychosis or dreaming.
  *   **Extrapolation Warning:** We infer this architecture from fMRI and modeling. We do not have a complete map proving the *exact* same neurons fire in the *exact* same pattern for both, only that the computational logic appears identical.

  ### 3. The "Precision-Weighting" Claim (The "Correction" Mechanism)
  **The Claim:** The *only* difference between seeing a real husband and a hallucinated one is the "precision weighting" assigned to sensory prediction errors. In ordinary seeing, the brain trusts the sensory data (high precision) to correct the model. In the widow's case, the brain trusts the prior expectation (grief/model) more than the sensory data (low precision), so the error signal is ignored.
  *   **Status:** **Contested / Overstated.** This is the specific mechanism your character cites ("nothing is correcting it"). It is a leading hypothesis, but likely an oversimplification. Hallucinations often involve complex feedback loops, memory intrusions, and emotional salience networks that aren't just simple "gain control" knobs on sensory data.
  *   **Licenses Character's Continuity Claim?** **Mostly.** It supports the idea that the difference is a matter of *tuning* rather than *kind*. However, saying "nothing is correcting it" is too absolute. Usually, *some* correction is attempted but overruled.
  *   **Equivocation Risk:** **Medium.** It treats "correction" as a single variable. In reality, "correction" involves attention, memory, and emotional regulation.
  *   **What would change my mind:** Evidence that hallucinations are driven by spontaneous bottom-up noise (random firing) rather than top-down priors (expectations). If her vision is random noise shaped into a husband, his explanation is wrong.
  *   **Extrapolation Warning:** "Precision weighting" is a mathematical metaphor for neural gain. We assume the brain calculates this like a statistician, but we don't know how that feels or if it's the sole driver of clinical hallucinations.

  ### 4. The "Phenomenological Indistinguishability" Claim
  **The Claim:** At the moment of experience, there is no intrinsic difference in "what it is like" to see a real object versus a hallucinated one. The sense of "reality" is itself a generated feature, not a direct contact with the world.
  *   **Status:** **Contested (Philosophy/Psychology).** Many patients report hallucinations *do* feel different (e.g., lacking depth, volume, or permanence). However, in acute grief or psychosis, they can be perfectly vivid.
  *   **Licenses Character's Continuity Claim?** **Yes.** It validates her experience as "real seeing" in terms of feeling, even if the object is absent.
  *   **Equivocation Risk:** **High.** It conflates "vividness" with "veridicality." Just because they feel the same doesn't mean the process is identical (see Claim 2).
  *   **What would change my mind:** Consistent reports of a specific "quale of unreality" present in all hallucinations but absent in perception.
  *   **Extrapolation Warning:** Neuroscience measures correlates, not feelings. We assume neural similarity implies phenomenological similarity, but that is an inference.

  ### 5. The "Radical Skeptic" Claim
  **The Claim:** Because all perception is generated by the brain, we are never in contact with mind-independent objects. Therefore, the widow is not missing anything the rest of us have; we are all hallucinating, hers is just less shared.
  *   **Status:** **Philosophically Radical / Scientifically Unwarranted.** This moves from neuroscience to metaphysics (Idealism). Neuroscience says the *experience* is constructed; it does not prove the *world* is absent.
  *   **Licenses Character's Continuity Claim?** **Too Well.** It makes the distinction meaningless. If everyone is equally hallucinating, his explanation offers no comfort and no distinction between health and pathology.
  *   **Equivocation Risk:** **Extreme.** This redefines "hallucination" to mean "representation." It renders the word useless for distinguishing pathology.
  *   **What would change my mind:** Proof of Direct Realism (that perception is not mediated by internal models).
  *   **Extrapolation Warning:** This is where neuroscience often oversteps. Finding that vision is constructed does not prove that nothing exists outside the skull.

  ***

  ### Verdict for Your Character

  **Can he stay intelligent and partly right?**
  **Yes,** but only if he anchors himself in **Claim 2 (Mechanistic Identity)** and **Claim 3 (Precision-Weighting)**, while avoiding **Claim 5 (Radical Skepticism).**

  **The Trap:**
  If he implies Claim 5 ("We are all hallucinating, so your husband is as real as my coffee"), he sounds like a pseudo-philosophical strawman. That is likely what your editor is worried about. It dismisses her loss by dissolving reality.

  **The Fix:**
  He should frame "hallucination" not as "fake," but as "generated."
  *   **Wrong way:** "You're hallucinating, but so am I." (Implies reality is equally fake).
  *   **Right way:** "Your brain is using the same machinery to see him as I am to see this chair. The machinery always generates the image; usually, the senses shout it down. In your case, the need to see him is shouting louder than the empty doorway."

  **Specific Revision Note:**
  The line "nothing is correcting it" is the weak joint (Claim 3). It implies a broken brake rather than a overwhelmed system.
  *   **Consider changing to:** "...only the correction signal is being overruled."
  *   **Why:** This acknowledges the sensory data (the empty doorway) is arriving and *trying* to correct the model, but the "prior" (the expectation/grief) has been weighted higher. This makes him more empathetic; he acknowledges the doorway is empty (validating her reality testing) while validating the vision (validating her pain).

  **Summary of Commitments:**
  By keeping this dialogue, you commit your character to the **Predictive Processing** framework. This is currently dominant but not monolithic. You do not commit him to the idea that the external world doesn't exist, only that our *access* to it is mediated by models. As long as he distinguishes between the **process** (which is continuous) and the **accuracy** (which is not), he remains scientifically literate rather than pop-sci glib.
