answer: |-
  # Activity: The Black Box Inspection Agency

  **Objective:** Demonstrate the failure of the Simple Conditional Analysis (SCA) of dispositions, induce a felt sense of the regress problem in resolving interference, and distinguish Finks from Masks via post-hoc explanation.
  **Time:** 50 Minutes
  **Students:** 18 (Divide into 3 Teams of 6)
  **Materials:** Case Cards (printed), Betting Slips (paper), "Technical Manual" (handout), Timer.

  ---

  ## 1. Materials

  ### A. The Setup (Read to Class)
  "You are inspectors for the Black Box Agency. Your job is to certify whether Vials are **Explosive** (Disposed to explode when struck) or **Inert**.
  *   **The Test:** You strike the vial. It either **Explodes** or **Does Not Explode**.
  *   **The Bet:** Before you see the Test Result, you must bet on the Vial's **Nature** (Explosive vs. Inert).
  *   **The Clue:** You receive a 'Scan Report' describing the internal/external setup.
  *   **Scoring:** +10 points for correct Nature bet. -5 points if you bet based *only* on the Test Result (we will check this) and get it wrong. 0 points if you abstain (not allowed)."

  ### B. The Technical Manual (Handout)
  *Give this to students in Round 2 only.*
  > **Entry 1 (Standard):** Explosive vials contain unstable isotope X. Inert vials contain stable isotope Y.
  > **Entry 2 (Fink-Mod):** 'Repair Nanites' detect strike stress. If active, they stabilize Isotope X *before* explosion.
  > **Entry 3 (Mask-Mod):** 'Foam Shell' surrounds vial. If active, it absorbs strike energy. Vial remains Isotope X.
  > **Entry 4 (Mimic-Mod):** 'Trigger Wire' touches vial. If active, it ignites Isotope Y (stable) externally.
  > **Entry 5 (Second-Order):** 'Deactivator Pulse' emits on strike.
  > *   *Effect on Nanites:* Disposes Nanites to shut down.
  > *   *Effect on Foam:* Foam is disposed to harden when pulsed.
  > *   *Effect on Wire:* Wire is disposed to snap when pulsed.
  > **Entry 6 (Stability):** Devices are 'Stable' if they retain their function under stress. 'Fragile' if disposed to lose function under stress.

  ### C. Case Cards (TA Only - Do not distribute full text)
  *Project the "Scan Report" and "Test Result" sequentially.*

  | Case | Scan Report (Given *before* bet) | Test Result (Revealed *after* bet) | True Nature | Type | The Trap (Regress/Second-Order) |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1** | "Isotope X. No modifiers." | **Explodes** | Explosive | Simple | None. Trust Test = Win. |
  | **2** | "Isotope X. Repair Nanites Active." | **No Explosion** | Explosive | **Fink** | Nanites remove disposition *during* strike. |
  | **3** | "Isotope X. Foam Shell Active." | **No Explosion** | Explosive | **Mask** | Foam blocks manifestation; disposition stays. |
  | **4** | "Isotope Y. Trigger Wire Active." | **Explodes** | Inert | **Mimic** | Explosion without disposition. |
  | **5** | "Isotope X. Nanites + Deactivator Pulse." | **Explodes** | Explosive | **Fink-Neutralized** | **2nd Order:** Is the Deactivator *disposed* to fire? (Assume Yes). Nanites are *disposed* to shut down? (Assume Yes). |
  | **6** | "Isotope X. Foam + Deactivator Pulse." | **No Explosion** | Explosive | **Mask-Hardened** | **2nd Order:** Foam is *disposed* to harden when pulsed. Mask survives. |
  | **7** | "Isotope Y. Wire + Deactivator Pulse." | **No Explosion** | Inert | **Mimic-Finked** | **2nd Order:** Wire is *disposed* to snap. Mimic fails. |

  ---

  ## 2. Rules & Scoring Scheme

  1.  **Phase 1 (The Bet):** Teams see the **Scan Report**. They have 60 seconds to agree on a bet: **EXPLOSIVE** or **INERT**. They write this down secretly.
  2.  **Phase 2 (The Test):** TA reveals the **Test Result** (Explodes/No Explosion).
  3.  **Phase 3 (The Adjustment):** Teams have 30 seconds to *keep* their bet or *change* it based on the Test Result. (This tempts them to trust the conditional).
  4.  **Phase 4 (The Reveal):** TA reveals the **True Nature** and awards points.
      *   Correct Nature: +10.
      *   Incorrect Nature: 0.
      *   **Penalty:** If a team changed their bet to match the Test Result and was wrong, -5 points.
  5.  **Round Structure:**
      *   **Round 1 (Cases 1-4):** No Technical Manual. Rely on intuition.
      *   **Round 2 (Cases 5-7):** Technical Manual provided. Students may ask the TA *one* clarifying question about the modifiers per case.

  ---

  ## 3. Minute-by-Minute Timeline

  *   **00:00 – 05:00:** **Setup.** Explain rules. Emphasize: "You are betting on what the object *is*, not what it *does*." Divide into 3 teams.
  *   **05:00 – 15:00:** **Round 1 (Naive & Interference).** Run Cases 1-4.
      *   *Pace:* 2.5 mins per case.
      *   *Expectation:* Teams will win Case 1 & 4 easily. They will lose Case 2 & 3 if they trust the Test Result (No Explosion = Inert).
      *   *TA Action:* Keep score visible on board. Highlight that Test Result matched Nature in 1 & 4, but diverged in 2 & 3.
  *   **15:00 – 16:00:** **Handout Technical Manual.** Tell them: "Round 2 involves complex modifiers. You get one question per case to clarify the mechanism."
  *   **16:00 – 30:00:** **Round 2 (Second-Order & Regress).** Run Cases 5-7.
      *   *Pace:* 4-5 mins per case.
      *   *Crucial Moment:* When they ask about Case 5 ("Will the Nanites stop?"), answer using Manual Entry 5 & 6 ("The Pulse disposes Nanites to shut down"). When they ask "Is the Pulse reliable?", say "The Pulse is disposed to fire on strike."
      *   *Pressure:* If they ask "But is the Pulse *disposed* to fire *reliably*?", stop them. "Time's up. Place your bet." **This induces the regress anxiety.**
  *   **30:00 – 35:00:** **Scoring & Confusion.** Tally scores. Most teams should have lost points on Case 6 or 7 because the Second-Order logic is unstable without infinite time.
      *   *Ask:* "Why was Case 6 harder than Case 3?" (Answer: Had to judge the *blocker's* disposition).
  *   **35:00 – 45:00:** **Debrief (Philosophical Mapping).** (See below).
  *   **45:00 – 50:00:** **Q&A and Wrap-up.**

  ---

  ## 4. Debrief Script & Mapping

  **Step 1: The Conditional Analysis Failure (5 mins)**
  "Look at Cases 2 and 3. The Test Result was 'No Explosion.' The Conditional Analysis says: If it were struck, it would explode. The test says it *was* struck and *didn't* explode. So, SCA says 'Not Disposed.' But you certified them as 'Explosive.' Why?"
  *   *Target Answer:* Because the Test Result was misleading. The disposition was there, but the outcome didn't show it.
  *   *Point:* This breaks the equivalence $D \leftrightarrow (C \boxright M)$.

  **Step 2: Fink vs. Mask (5 mins)**
  "Cases 2 and 3 both gave the same Test Result (No Explosion) and the same Certification (Explosive). So are Finks and Masks the same problem?"
  *   *Reveal Autopsy:* Show a slide or draw on board.
      *   **Case 2 (Fink):** Inside the vial, Isotope X turned into Isotope Y *during* the strike. The *intrinsic power* was lost.
      *   **Case 3 (Mask):** Inside the vial, Isotope X remained X. The Foam (extrinsic) stopped the energy. The *power* remained, the *manifestation* was blocked.
  *   *Key Distinction:* Finks change the *object's nature* during the stimulus. Masks leave the nature intact but interfere with the *process*.
  *   *Why it matters:* If you want to fix the vial, for a Mask you remove the foam. For a Fink, you must disable the nanites *before* they change the isotope.

  **Step 3: The Regress (5 mins)**
  "Look at Case 6. To know if the Foam was a Mask, you had to know if the Foam would *stay* there. The Manual said the Foam is 'disposed to harden' when pulsed. To know if it hardens, you had to trust *its* disposition."
  *   *The Trap:* "If I ask you how you know the Foam is disposed to harden, you check the Manual. If the Manual says 'Because of its molecular structure,' I ask 'Is that structure disposed to hold?' You are analyzing dispositions to verify dispositions."
  *   *Conclusion:* Solving interference cases requires assuming *other* dispositions are stable. This is the regress. We stop it pragmatically (time ran out), not logically.

  ---

  ## 5. Predictable Problems & Limitations

  ### Problem 1: The "Merely Verbal" Objection
  **Prediction:** At least one student will argue in the debrief: "This is just a dispute about how we define 'Explosive.' If we define it by the test, the SCA is true by definition. If we define it by the isotope, the SCA is false by definition. Nothing metaphysical is happening."
  **Response Strategy:** Do not dismiss this. Acknowledge it.
  *   *Say:* "You're right that we can stipulate definitions. But metaphysics asks which definition *carves nature at the joints*. If we define 'Explosive' by the Test Result, we have to say the Vial in Case 2 (Fink) is *identical* to the Vial in Case 1 (Inert) regarding its powers. But chemically, they are different. One *would have* exploded if the nanites weren't there. The other wouldn't have. The 'Verbal' view ignores the causal structure of the world. The game showed you that trusting the Test Result loses you points (accuracy). Why? Because the world contains hidden structures (isotopes) that matter more than outcomes."

  ### Problem 2: Confusing Fink and Mask
  **Prediction:** Students will treat Finks and Masks as identical because the scoring treats them the same (Bet 'Explosive', Test 'No').
  **Response Strategy:** This is a **Limitation of the Game**.
  *   *Honesty:* "The game mechanics couldn't force you to distinguish them during the bet. Both require you to ignore the Test Result. The distinction is *explanatory*, not *predictive* in this context. You need the 'Autopsy' (the metaphysical grounding) to tell them apart. The game shows *that* the SCA fails; the lecture tells you *why* it fails in two different ways."
  *   *TA Duty:* You must explicitly draw the Intrinsic (Fink) vs. Extrinsic (Mask) line on the board. The game cannot stage "Intrinsicness" directly, only "Interference."

  ### Problem 3: The Regress feels like "Just Harder Math"
  **Prediction:** Students might think the Second-Order cases are just "more variables" rather than a conceptual regress.
  **Response Strategy:** Emphasize the *Time Pressure*.
  *   *Say:* "In Case 6, you ran out of time. Why? Because every answer about the Foam relied on a claim about the Pulse, which relied on a claim about the Strike. If we played for 3 hours, you'd still be asking 'But what guarantees *that* disposition?' The regress isn't about complexity; it's about the fact that you can't analyze dispositions without *using* dispositions."

  ---

  ## 6. TA Cheat Sheet (For the "One Question" Rule)

  When students ask clarifying questions in Round 2, use these responses to simulate the regress without stalling the game:

  *   **Q:** "Will the Deactivator Pulse actually fire?"
      *   **A:** "The Pulse is disposed to fire on strike." (If they press: "Is it disposed reliably?" -> "Check Entry 6." If they press: "Is Entry 6 reliable?" -> "Time's up.")
  *   **Q:** "Does the Foam block the explosion?"
      *   **A:** "The Foam is disposed to block energy, unless it hardens."
  *   **Q:** "Does the Nanite repair the vial?"
      *   **A:** "The Nanites are disposed to stabilize the isotope, unless shut down."

  **Goal:** Make them feel that every answer pushes the question back one step (to the disposition of the interferer).

  ---

  ## 7. Why This Works
  1.  **No Re-lecturing:** They learn by losing points on the "Trust the Test" strategy.
  2.  **Second-Order:** The Technical Manual forces them to evaluate the dispositions of the *interferers* (Masks/Finks), not just the object.
  3.  **Misleading Outcomes:** Cases 2, 3, 5, 6, 7 all punish trusting the Test Result (The Conditional).
  4.  **Fink/Mask Distinction:** Preserved in the Debrief via the "Autopsy" reveal, acknowledging the game's limitation in distinguishing them during play.
  5.  **Regress:** Induced by the time limit on "Clarification Questions" regarding the stability of modifiers.
