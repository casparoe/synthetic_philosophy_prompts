answer: |-
  ### Private Pass: Rejected Translations

  1.  **Translation:** "Calibration is simply Reliability."
      **Rejection:** I rejected this because reliability concerns the consistency of the measurement (signal-to-noise ratio), whereas calibration concerns the accuracy of the probability estimate (does a score of 0.8 mean an 80% chance of success?). Conflating them suggests that making the test more consistent solves the fairness problem, when the impossibility result holds even for perfectly reliable tests if base rates differ.

  2.  **Translation:** "Individual-level fairness is Measurement Invariance."
      **Rejection:** I rejected this because measurement invariance ensures the test measures the *same construct* across groups (e.g., 'math ability' means the same thing). Individual fairness requires that people alike in *morally relevant respects* are treated alike. A test can be invariant but still ignore relevant characteristics outside the construct (e.g., disadvantage not captured by the test), or prioritize the construct when it shouldn't.

  3.  **Translation:** "The moral/political choice is a Utility Analysis."
      **Rejection:** I rejected this because utility analysis assumes we can assign weights to errors (false positives vs. false negatives) and maximize overall value. The philosophical claim is that some constraints (like historical injustice) are deontological constraints—they forbid certain trade-offs regardless of the utility gain. Psychometrics treats values as inputs to an optimization function; philosophy sometimes treats them as limits on the function itself.

  ***

  ### Translations and Residue

  **(a) Calibration**
  *   **Restatement:** Within each band, the proportion of candidates who succeed matches the expected success rate implied by that band's selection probability, conditional on group membership.
  *   **Residue:** This carries over cleanly only if we treat bands as probability estimates. In your setup, bands are ordinal strata followed by a lottery. If Band 3 implies a 50% chance of selection but instructors treat Band 3 students as "less likely to succeed" regardless of selection, the "outcome rate" is contaminated. The concept of "score matches outcome rate" bends when the score is an ordinal band used for stratified sampling rather than a continuous probability estimate.
  *   **Smuggled Assumption:** That the outcome rate is an objective fact about the candidate, rather than a function of the selection process itself (see claim e).

  **(b) Equal Error Rates vs. Predictive Parity**
  *   **Restatement:** Equality of sensitivity and specificity across groups versus equality of Positive Predictive Value (PPV) across groups.
  *   **Residue:** This maps cleanly to standard classification consistency metrics. However, your lottery system complicates "False Positives." If a candidate is in a eligible band but loses the lottery, are they a false negative? If they win the lottery but fail, are they a false positive? The psychometric vocabulary assumes a deterministic decision rule at a cut score. The lottery introduces stochasticity that standard sensitivity/specificity formulas do not naturally accommodate without adjustment for selection probability.
  *   **Smuggled Assumption:** That the decision rule is deterministic (cut-score based) rather than probabilistic (lottery within bands).

  **(c) The Impossibility Result**
  *   **Restatement:** When base rates (overall success rates) differ between groups, you cannot simultaneously maximize classification consistency (equal error rates) and predictive parity (calibration) unless reliability is perfect or base rates are equal.
  *   **Residue:** This carries over cleanly mathematically. The residue is interpretive. Psychometrics treats base rates as fixed parameters of the population to be accommodated. The fairness literature often treats differing base rates as potential evidence of prior structural injustice that the measurement system should not reinforce. Your vocabulary accepts the base rate; the philosophical claim questions its legitimacy.
  *   **Smuggled Assumption:** That base rates are fixed, natural facts rather than potentially mutable or unjust artifacts of prior systems.

  **(d) Individual-Level Fairness**
  *   **Restatement:** Absence of Differential Prediction; candidates with equal true scores should have equal predicted outcomes regardless of group membership.
  *   **Residue:** This bends significantly. "Alike in relevant respects" in philosophy may include characteristics your test does not measure (e.g., resilience, disadvantage). Measurement invariance only guarantees that the test measures the *construct* equally. It does not guarantee the construct is the *only* morally relevant respect. You are translating a moral claim about relevance into a technical claim about construct equivalence.
  *   **Smuggled Assumption:** That the construct measured by the test exhausts the set of morally relevant characteristics for allocation.

  **(e) Criterion Contamination/Reflexivity**
  *   **Restatement:** The criterion variable is contaminated by knowledge of the predictor, inflating validity coefficients and creating a self-fulfilling prophecy.
  *   **Residue:** Psychometrics identifies this as a validity threat to be removed (e.g., blind grading). The fairness claim is stronger: even if you blind the instructors, if the criterion itself (e.g., "professional demeanor") is defined by the dominant group's norms, the contamination is structural, not just procedural. Your vocabulary sees noise; the literature sees bias embedded in the definition of success.
  *   **Smuggled Assumption:** That there exists a "clean" criterion independent of the measurement system that we are trying to predict.

  **(f) Moral/Political Choice & Structural Injustice**
  *   **Restatement:** Setting cut scores and weighting errors is a matter of Consequential Validity and Utility Analysis; however, if base rates reflect prior injustice, predictive validity itself may be an illegitimate goal.
  *   **Residue:** This is largely inexpressible. Psychometrics provides tools for utility analysis (weighing costs of errors). It does not provide tools for adjudicating whether the utility function itself is legitimate given historical context. The claim that "no allocation by predicted outcome can be fair" contradicts the foundational assumption of psychometrics: that better prediction leads to better decisions.
  *   **Smuggled Assumption:** That maximizing predictive validity is a coherent and permissible goal regardless of the historical origin of the variance being predicted.

  ### Taxonomy Table

  | source_claim | translation | fidelity | what_broke | smuggled_assumption | residue_verdict |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | (a) Calibration | Within-group predictive validity at each band level. | distorted | Bands are ordinal strata with lottery, not probability estimates. | That the outcome rate is an objective fact about the candidate. | defect of my framework |
  | (b) Equal Error Rates | Equality of sensitivity/specificity vs. Equality of Positive Predictive Value. | clean | Lottery makes deterministic error classification ambiguous. | That the decision rule is deterministic. | n/a |
  | (c) Impossibility | Base rate differences preclude simultaneous optimization of classification consistency and predictive parity. | clean | None. | That base rates are fixed, natural facts. | n/a |
  | (d) Individual Fairness | Absence of Differential Prediction. | distorted | "Relevant respects" may include variables outside the construct. | That the construct exhausts morally relevant characteristics. | defect of my framework |
  | (e) Criterion Contamination | The criterion is contaminated by the predictor. | distorted | Psychometrics sees noise; fairness sees structural bias in the criterion definition. | That a "clean" criterion exists independent of the system. | real gap in both |
  | (f) Moral/Political Choice | Consequential Validity and Utility Analysis. | inexpressible | Utility analysis assumes legitimate trade-offs; fairness questions legitimacy. | That maximizing predictive validity is a permissible goal. | defect of my framework |

