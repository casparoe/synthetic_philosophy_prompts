answer: |-
  The 1940 American Negro Exposition in Chicago stands as a material instantiation of W. E. B. Du Bois's 1926 assertion in "Criteria of Negro Art" that "all Art is propaganda and ever must be." For Du Bois, this was not a pejorative classification but a moral imperative: in a world structured by anti-Black racism, beauty could not be neutral; it had to serve "racial truth and uplift." Analyzing Charles C. Dawson's thirty-three dioramas and William Edouard Scott's twenty-four murals through this lens reveals how the Exposition's curatorial logic operationalized Du Bois's thesis, while simultaneously exposing the theoretical instabilities inherent in demanding that aesthetic form submit entirely to political utility.

  ### The Propaganda of Form and Narrative

  In Du Bois's framework, propaganda is the deliberate use of media to advance a specific social truth that has been suppressed by the dominant culture. The Exposition's display choices function as propaganda precisely because they reconstruct the Black subject from an object of pity or caricature into an agent of history.

  **The Sequential Historical Narrative:**
  The decision to organize Dawson's dioramas chronologically, spanning from Ancient Egypt to the First World War, is a direct curatorial enactment of Du Bois's demand for "truth." By anchoring Black history in antiquity (Egypt) rather than slavery (Virginia), the curators and Dawson weaponized chronology against the racist narrative of Black ahistoricity. This sequence is not merely educational; it is argumentative. It forces the viewing public to acknowledge a lineage of civilization that precedes and exceeds the chattel system. In Du Boisian terms, this is propaganda because it seeks to alter the viewer's ontological understanding of Blackness. The narrative arc culminates in military service and labor, monumentalizing the Black contribution to the American state. This serves the specific political end of claiming citizenship rights through demonstrated sacrifice—a core tenet of the "uplift" ideology Du Bois championed in the 1920s.

  **The Immersive Diorama vs. The Gallery:**
  The choice of the diorama over conventional framed painting is significant. A gallery display allows for detached contemplation; a diorama demands witnessing. Dawson, acting as both artist and chief designer, constructed three-dimensional tableaux that surrounded the viewer. This immersive quality functions as propaganda by simulating presence. It removes the "safety" of aesthetic distance. When a viewer confronts a life-sized tableau of Black soldiers in the Civil War, they are not looking *at* a representation; they are standing *with* the subjects. This aligns with Du Bois's insistence that art must not just be seen but felt as a mechanism for social change. The diorama acts as a "truth machine," using the authority of realism to validate the historical claims being made.

  **Monumentalization of Labor:**
  Scott's murals and Dawson's displays consistently depict Black laborers not as subservient figures but as foundational pillars of the economy. In Du Bois's 1926 thesis, the artist must portray the Negro not as he is seen by whites (a stereotype), but as he knows himself (dignified). The compositional choice to place Black workers in the foreground, often with classical postures reminiscent of Renaissance frescoes, serves this propagandistic end. It re-codes labor from a mark of servitude to a mark of civic virtue. Here, the artist (Scott) and the curator (Dawson/Exposition Committee) collaborate to produce a visual language that compels the public to recognize Black humanity through the lens of contribution.

  ### Aesthetic Resistance and the Limits of Instrumentality

  However, a disciplined application of Du Bois's framework must also identify where the aesthetic form resists being reduced to a transparent vessel for messaging. Du Bois assumes that if the artist is racially conscious, beauty will naturally serve truth. The Exposition reveals moments where the "beauty" threatens to overshadow or complicate the "propaganda."

  **Scott's Decorative Stylization:**
  While Dawson's dioramas leaned toward didactic realism, Scott's murals often employed a stylized, decorative modernism. In certain panels, the rhythmic composition, color harmonies, and abstracted forms draw attention to themselves as *art objects* rather than historical documents. A viewer might admire the brushwork or the color theory independent of the historical narrative. This creates a friction with Du Bois's thesis. If the beauty becomes the primary focus, does the propaganda fail? Or does the beauty make the propaganda palatable? Du Bois's theory remains silent on the risk of aesthetic autonomy. He assumes a unified reception where beauty amplifies truth, but he does not account for the possibility that the public might consume the murals as mere decoration, thereby neutralizing the political sting.

  **The Spectacle of the Diorama:**
  The diorama format, borrowed from the World's Fair tradition, carries an inherent logic of entertainment and spectacle. While Dawson intended them as tools of education, the medium itself invites a gaze of curiosity. There is a tension between the *dignity* Du Bois demands and the *spectacle* the diorama produces. When the viewing public engages with a diorama, they are engaging with a simulation. If the simulation is too theatrical, it risks turning history into a performance. This is a point where Du Bois's theory is silent: he does not distinguish between propaganda that agitates and propaganda that entertains. The Exposition's reliance on the fairground aesthetic suggests that to reach the public, the "truth" had to be packaged as amusement. This complicates the Du Boisian ideal of art as a solemn vehicle for racial vindication.

  ### Reverse Analysis: The Instability of Committed Beauty

  Reversing the analysis to test Du Bois's framework against the Exposition's reality reveals a fundamental instability in the distinction between "politically committed beauty" and "beauty pursued for its own sake."

  **Can Propaganda Fully Absorb Aesthetic Form?**
  The Exposition suggests that propaganda *cannot* fully absorb aesthetic form without generating excess meaning. To be effective propaganda, the dioramas and murals had to be visually compelling—they had to function as "Art." But in achieving high aesthetic quality, they invited judgments based on formal merit rather than political utility. If a mural is criticized for its perspective, the political message is sidelined. Du Bois argues that the artist's duty is to prove himself through beauty, yet the Exposition demonstrates that the pursuit of beauty introduces variables (style, taste, medium specificity) that the propagandist cannot fully control.

  **The Silence on Reception:**
  Du Bois's 1926 thesis focuses heavily on the *producer* (the Black artist's duty) but is less precise regarding the *consumer*. The Exposition involved multiple actors: Dawson (Artist/Curator), Scott (Artist), the Exposition Committee (Administrators/Political Agents), and the Viewing Public (Black and White). Du Bois assumes a transmission model: Artist encodes truth -> Public decodes truth -> Social Change.
  The Exposition reveals this model is fragile. The white viewing public might interpret the "monumentalization of labor" as evidence that Black people are *only* fit for labor, reinforcing the very stereotypes Du Bois sought to dismantle. The Black viewing public might feel pride, but also alienation if the history presented feels sanitized for white consumption (a common critique of the "uplift" strategy). Du Bois's theory remains silent on this polysemy. He assumes "racial truth" is singular and recognizable, but the Exposition shows that visual propaganda is subject to the viewer's pre-existing biases.

  **The Instability of the Distinction:**
  Ultimately, the 1940 Exposition reveals that Du Bois's distinction is unstable because the most effective propaganda *requires* the elements of "art for art's sake" to function. The immersive power of Dawson's dioramas relied on craftsmanship, lighting, and spatial design—elements of pure aesthetic form. If these were sacrificed for blunt messaging, the propaganda would fail to engage. Therefore, the "propaganda" does not absorb the "aesthetic"; rather, the aesthetic enables the propaganda.
  However, this dependency creates a vulnerability. If the aesthetic form becomes too dominant (as potentially in Scott's more decorative murals), the political urgency recedes. If the political message becomes too blunt, the aesthetic appeal vanishes, and the audience disengages. The Exposition exists in this precarious balance. It shows that Du Bois was correct that art *is* propaganda, but incorrect in assuming the artist can fully subordinate form to function. The form always retains a capacity to exceed the message.

  ### Conclusion

  Through the lens of the 1940 American Negro Exposition, Du Bois's 1926 thesis is validated as a curatorial strategy but challenged as a totalizing aesthetic theory. Dawson and Scott successfully utilized sequential narrative, monumentalization, and immersive display to enact Du Boisian propaganda, forcing a recognition of Black historical agency. Yet, the reliance on spectacle and the autonomy of aesthetic composition reveal that beauty cannot be perfectly harnessed to truth. Du Bois's theory remains silent on the uncontrollability of reception and the inherent tension between the fairground's demand for entertainment and the activist's demand for justice. The Exposition proves that while art must be propaganda to survive in a racist society, it can never be *only* propaganda without ceasing to be art—and thus, potentially, ceasing to be effective.
