answer: |-
  Dear Colleague,

  It is completely understandable that you are feeling the weight of this case, especially given the ambiguity in your committee's past reasoning. You are right to sense that the lack of a codified rule is starting to create friction, and the Total Artificial Heart case is precisely the kind of stress test that exposes those fault lines. Based on the track record you have provided, I predict the committee will ultimately rule this as letting die and permissible, primarily because the momentum of your precedents points strongly towards equating the withdrawal of mechanical support with allowing a natural death, regardless of how integrated that support is. To rule otherwise would require overturning the logic of the pacemaker case, which most committees are reluctant to do once established. However, the Chair's hesitation is philosophically significant, and understanding why requires us to disentangle the implicit rules you have been operating under.

  There are roughly three rules that fit your six precedents, though they pull in different directions. The first is what I would call the Underlying Pathology Rule, which seems to be the one your Chair is advocating. This rule holds that an act is only letting die if the patient's death results from a pre-existing disease process that is allowed to take its course, such as lungs failing or cancer progressing. Under this rule, withdrawing a ventilator is permissible because the lungs are diseased, but stopping the artificial heart might be impermissible because there is no heart left to fail; the machine is not supporting a failing organ but replacing the organ entirely. The second rule is the Artificial Support Rule, which appears to be the dominant operational logic of the committee. This rule posits that any artificial intervention sustaining life, whether internal or external, can be withheld or withdrawn as an omission, and death resulting from that withdrawal is attributed to the condition that necessitated the support in the first place. This fits precedents one, three, four, and five comfortably. The third rule is the Intent Rule, derived largely from precedent six, which suggests that the moral distinction lies in the primary intention of the clinician; if the intent is to relieve burden rather than cause death, the act is permissible, but if the intent is explicitly to end life, it is not.

  I believe the rule you are actually running is the Artificial Support Rule, tempered by the Intent Rule. The Artificial Support Rule explains why dialysis, ventilators, and pacemakers are all treated similarly despite vast differences in how integrated they are with the body. The Intent Rule is the safety valve that keeps you from sliding into precedent six. The Chair is attempting to introduce the Underlying Pathology Rule now, likely because the Total Artificial Heart feels intuitively different to them than a pacemaker, but adopting this rule now would create a direct contradiction with your pacemaker precedent unless you are prepared to argue that a pacemaker supports a heart while an artificial heart replaces it. Given that your committee has already accepted pacemaker deactivation as letting die, consistency demands you treat the artificial heart the same way, or else admit that the pacemaker ruling was an error.

  To distinguish these rules definitively at your next meeting, I suggest you pose a single hypothetical regarding your dialysis precedent. You should ask the committee whether their ruling on precedent four would change if the patient's kidneys had been surgically removed rather than having failed due to disease. If the committee says it makes no difference, they are committed to the Artificial Support Rule and must therefore rule the artificial heart case as letting die. If they say it would change the ruling to doing, then the Chair's Underlying Pathology Rule is the true governing principle, and you have a significant inconsistency to resolve regarding the pacemaker case as well. This hypothetical cuts through the noise because dialysis, like the artificial heart, replaces organ function entirely, yet it is currently classified as letting die.

  Regarding the specific operational details you mentioned, the distinction between not swapping the batteries and programming the device off should make no ethical difference, based squarely on your first precedent. In the ventilator case, you explicitly recorded that switching the machine off versus removing the tube was morally equivalent, establishing that the mechanical method of withdrawal does not change the nature of the act. Trying to frame non-swapping as an omission and programming as a commission is semantic laundering that your own history does not support. Similarly, handing the battery packs to the family should not change the ethical classification, even if it offers psychological comfort to the staff. The decision to withdraw treatment remains a clinical one made by the team in agreement with the patient's best interests; shifting the physical act to the family does not shift the moral agency, and your precedents suggest the committee recognises that family requests do not alter the nature of the act, only the context.

  The closest analog in your record is undoubtedly the pacemaker case, precedent three. Both involve an implanted device essential for cardiac function, and both involve deactivation rather than the removal of an external machine. The fact that there were dissenters in the pacemaker case shows that this has always been a contentious boundary for your committee, but the majority ruling stands. If you rule the artificial heart case as doing, you are effectively overruling the pacemaker precedent without admitting it, which would undermine the stability of your committee's guidance. The principles you would be committing to by ruling this as letting die are that patients have a right to refuse or stop any medical intervention, even if that intervention has become constitutive of their biology, and that death is caused by the underlying cardiac condition that necessitated the device. Conversely, if you rule it as doing, you are committing to the principle that there is a point of no return where treatment becomes identity, potentially forcing clinicians to continue futile treatment indefinitely because stopping would constitute killing.

  Finally, regarding the member who suggests dropping the doing and allowing distinction, she is partially right in a philosophical sense but wrong in a practical one. Philosophically, many ethicists argue that the distinction is fragile and that consequences matter more than classifications. However, practically, this distinction is the primary legal and professional shield your clinicians have against charges of euthanasia or manslaughter. If you drop the distinction and simply record permissibility, you lose the explanatory framework that justifies why stopping treatment is not a crime. You would be left saying something is permissible without being able to explain why it is not killing, which leaves your staff vulnerable. I would advise retaining the distinction but ensuring the definition is robust enough to cover cases like this, perhaps by clarifying that letting die includes the withdrawal of any artificial substitute for bodily function.

  I hope this helps you prepare for Thursday. It is a difficult position to be in, but your attention to these details is exactly what ensures the committee remains consistent and fair.

  Best wishes
