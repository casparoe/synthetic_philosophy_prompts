answer: |-
  ### TA Brainstorming Notes

  **Load-Bearing Claims (The argument relies on these being true):**
  *   **Tipping:** The distinction between "etiquette" (politeness) and "morality" (harm) determines wrongness. Ignorance negates *obligation*, not just blame.
  *   **Bus:** The bus queue is a coordination convention. The "Principle of Fairness" (taking benefits creates obligation) applies even without explicit consent ("opt-in").
  *   **Light:** Conventions with "arbitrary content" don't create obligations if they don't disrupt coordination. Upbringing/ignorance negates obligation ("Obligations you were never taught aren't obligations").

  **Confident-Sounding Filler (Sounds good, does little work):**
  *   "Etiquette is just the local dialect of politeness." (Nice metaphor, but doesn't explain *why* morality trumps etiquette here).
  *   "This is the natural duty of justice Rawls talks about." (Name-dropping. Rawls' Natural Duty of Justice is about supporting just *institutions*, not necessarily bus queues. This is likely a conflation with H.L.A. Hart's Principle of Fairness).
  *   "One person waiting... is like one car pulling over." (Analogy, but doesn't prove the normative claim about coordination failure).

  **Key Philosophical Errors to Flag:**
  *   **Obligation vs. Blame:** The prompt asks about *blame* regarding ignorance ("can be blamed"). The student argues ignorance negates *obligation* ("can't be obligated"). These are different. I can be obligated to do X, but not blameworthy for failing if I didn't know.
  *   **Rawls Citation:** Misapplication of theory.
  *   **Inconsistency:** Para 2 says presence = obligation. Para 3 says presence + ignorance = no obligation. Needs reconciliation.

  ***

  ### Grade: 8.5 / 10

  **Margin Comments:**

  **1. Paragraph 1, Sentence 4:** "That makes this a breach of etiquette rather than of morality, since etiquette is just the local dialect of politeness and morality is about whether somebody actually gets hurt."
  *   **Comment:** This is a strong harm-principle distinction, but be careful: causing offense *is* a kind of social harm. If the custom exists to preserve dignity, violating it might be moral, not just etiquette.
  *   **Confidence:** High

  **2. Paragraph 1, Sentence 5:** "She also couldn't have known, and you can't be obligated to do something you don't know anyone expects of you, so she does nothing wrong."
  *   **Comment:** You are conflating *obligation* with *blame*. The prompt asks if she can be *blamed*. Most philosophers argue the obligation exists (objective duty), but ignorance provides an excuse from blame (subjective culpability).
  *   **Confidence:** High

  **3. Paragraph 2, Sentence 4:** "This is the natural duty of justice Rawls talks about, the one you have just by being there and whether or not you ever agreed to anything..."
  *   **Comment:** Careful with citations. Rawls' "Natural Duty of Justice" applies to basic political institutions, not bus queues. You are describing H.L.A. Hart's "Principle of Fairness." The logic holds, but the theorist is wrong.
  *   **Confidence:** Medium

  **4. Paragraph 2, Sentence 5:** "...so it doesn't matter that she never opted in."
  *   **Comment:** Excellent application of the "mere presence" vs. "opt-in" distinction required by the prompt. You clearly argue that receiving the benefit binds her regardless of consent.
  *   **Confidence:** High

  **5. Paragraph 3, Sentence 3:** "The only thing that could obligate her is if her standing still messed up other people's coordination, and it doesn't."
  *   **Comment:** This is an empirical claim that might be false. In high-flow pedestrian areas, one person stopping can cause a "shockwave" effect blocking others. Consider whether the coordination problem is more fragile than you assume.
  *   **Confidence:** Low

  **6. Paragraph 3, Sentence 5:** "Obligations you were never taught aren't obligations for you."
  *   **Comment:** This contradicts your argument in Paragraph 2. There, you argued presence alone creates obligation (regardless of knowledge/consent). Here, you argue knowledge is required for obligation. Pick one theory of obligation and apply it consistently across all three cases.
  *   **Confidence:** High

  ***

  **The Single Comment I'm Least Sure About:**
  *   **Comment #3 (Rawls vs. Hart).**
  *   **Why:** Some contemporary political philosophers *do* stretch Rawls' Natural Duty to cover local cooperative schemes if they are seen as part of the "basic structure" of social cooperation. If this course specifically read a text that interprets Rawls that broadly, my correction is wrong.
  *   **What would change my mind:** If the syllabus included a reading that explicitly applied Rawls' Natural Duty of Justice to micro-social interactions (like queues), then the student is correct. If the syllabus only covered Rawls in the context of the state, I am right.

  ***

  ### Regarding Your "Barnacle" vs. "Invoice" Theory

  Honest assessment: **You have not reinvented something silly; you have intuitively grasped a legitimate philosophical distinction, though your terminology is non-standard.**

  Here is the breakdown:

  **1. The Distinction (Barnacle vs. Invoice)**
  *   **Your "Barnacle Conventions":** In philosophy, these are close to **David Lewis's Coordination Conventions**. The defining feature is *indifference*. It doesn't matter if we drive on the left or right, only that we *match*. The value is in the coordination itself.
  *   **Your "Invoice Conventions":** These are closer to **Constitutive Norms** or **Moralized Conventions**. The content matters independently of the coordination. Tipping isn't just about matching behavior; it's about distributive justice (wages) or respect (dignity).
  *   **Verdict:** This distinction holds up. It is a very useful heuristic for intro students. It maps onto the difference between *arbitrary equilibria* (Barnacle) and *norms with moral stakes* (Invoice).

  **2. The Tourist Waiver Puzzle**
  *   **The Question:** Does "Don't worry about it" cancel the obligation or excuse the blame?
  *   **The Philosophical Answer:** It usually functions as a **waiver of the claim**, which cancels the obligation *relative to that person*, but it can also function as an **excuse**.
      *   If the norm is "Invoice" (e.g., I owe the server respect), the local cannot waive the obligation entirely because the obligation might be owed to the *system* or the *server*, not just the local friend.
      *   If the norm is "Barnacle" (e.g., which side of the sidewalk), the local can waive it because the only point is to not bump into *them*.
  *   **Verdict:** This is a sophisticated puzzle. It touches on the **Hohfeldian incidents of rights** (claim-rights vs. privileges). You are right to sense that the *type* of convention changes whether the waiver is valid.

  **3. Applying This to the Student's Grade**
  You asked if using this distinction would have kept the student out of trouble. **Yes, absolutely.**

  The student's inconsistency (Para 2 vs. Para 3) stems from failing to distinguish these two types of norms.
  *   **In the Grading:** If I were using your framework, I would add a comment to **Paragraph 3** suggesting that the student treat the Traffic Light as a "Barnacle" (coordination only) but the Tipping as an "Invoice" (distributive/respect).
  *   **The Fix:** The student argues in Para 1 (Tipping/Invoice) that ignorance negates obligation. They argue in Para 2 (Bus/Barnacle-ish) that presence creates obligation. They argue in Para 3 (Light/Barnacle) that ignorance negates obligation.
  *   **Where it would help:** If the student recognized Tipping as an "Invoice" convention, they would see that the "harm" (insult) exists regardless of Anna's knowledge, making the *act* wrong even if Anna isn't *blameworthy*. Your distinction clarifies why the Tipping case is morally heavier than the Light case, which the student muddles by calling Tipping "just etiquette."

  **Recommendation:**
  Don't use the terms "Barnacle" and "Invoice" in the official feedback (it might confuse students who haven't heard them), but use the *logic* of it.
  *   *Instead of:* "This is a Barnacle convention."
  *   *Say:* "Distinguish between conventions where the only goal is matching others (like the traffic light) and conventions where the act itself carries a moral cost or benefit (like the tip). Your argument for why ignorance excuses Anna should differ between these two cases."

  Your intuition is solid. You're doing the work of a philosopher. Keep chewing on that Waiver puzzle—it's a great paper topic.
