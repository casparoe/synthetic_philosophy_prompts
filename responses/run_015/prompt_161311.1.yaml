answer: |-
  The boats went to Black Bay. They always went to Black Bay when the glass dropped, steering past the mouth of White Bay even when the water there lay flat as oil. White Bay was deeper, sheltered by a higher headland, and the holding ground was clay instead of scree. Any man who squinted at the chop could see the advantage. But the fleet tied up at Black, bumping against the rougher quay, because twenty years ago the first motor trawler had foundered in White during a squall, and the survivors had sworn never to return.

  Elias sat on the breakwater, watching the *Marianne* turn her bow toward the dark water. He had the transcripts in his bag. For three weeks, he had interviewed the captains privately, under the guise of a safety review. He had asked them where they preferred to anchor. Twenty-two of twenty-three had said White.

  He met Silas at the pub that evening. Silas had been fishing since before the motor trawler sank. He nursed a pint, looking at the rain streaking the window.

  "Why Black?" Elias asked. He didn't mention the transcripts.

  Silas tapped the glass. "Because that's where the lookouts stand. If you're in trouble in a gale, you want eyes on you. The lookouts stand at Black because that's where the fleet is. We go to Black because that's where the eyes are."

  It was a perfect circle. Elias thought about the transcripts. The captains had spoken quietly, leaning in, as if confessing a sin. But they had known Elias was connected to the Harbor Safety Board. They might have said White to signal they wanted better moorings there. Or they might have said White because, in the privacy of a booth, the fear of the gale felt theoretical, and the comfort of clay felt real. He couldn't tell if he held their true preferences or their wishes.

  "If everyone went to White," Elias said, "the lookouts could move."

  "Could they?" Silas didn't look up. "Who moves first? If I go to White and the lookout stays at Black, I'm in the dark. If I stay at Black and everyone else goes to White, I'm alone in the dark. We stay where we know we'll be seen."

  Elias published on Sunday. He didn't offer an opinion. He simply printed the tally: *22 of 23 captains prefer White Bay.* He wrote that the preference was longstanding but suppressed. He implied the fleet was trapped by its own history.

  On Monday, the glass dropped. A low pressure system rolled in from the Atlantic, bringing wind and a heavy swell. Elias stood on the headland, watching the harbor.

  The *Marianne* left the quay. She turned toward Black Bay, then hesitated. Her engine revved. She swung toward White. Behind her, the *Kestrel* did the same. Then the *Orion*. They moved in a cluster, uncertain, signaling with lamps. They were all going to White because they all knew everyone else preferred White. The article had made the private preference public property. Now everyone knew that everyone knew.

  But the lookout station remained at Black. The men in the tower had read the paper too. They expected the fleet to stay put, bound by the old way. When the boats began filling White Bay, the lookouts scrambled for their gear, but the heavy lights were bolted to the Black station. They ran along the cliff path, slipping on the wet grass, trying to reposition the beams.

  The wind picked up. The *Kestrel*, crowded in the tighter anchorage of White, dragged her chain. She swung into the *Orion*. There was a crack of fiberglass, a shout lost in the wind. In Black Bay, the water churned empty.

  By morning, the storm had passed. The *Kestrel* was holed but floating. No one was dead. The fleet returned to the quay, tying up at Black as if nothing had happened. The lookouts stood in their tower, watching the empty bay.

  Elias walked the dock. The captains avoided his eyes. He wondered if they hated him for breaking the silence, or if they hated themselves for believing him. He wondered if the transcripts had been true, or if the captains had lied to the surveyor just as they lied to each other on the water. He looked at White Bay. The water was calm. It was still the better harbor. But as the *Marianne* passed, her captain kept his eyes fixed on the quay, on the solid wood, on the place where the others would be.

  ***

  **Editor's Note**

  **Episodes and Lewisian Elements:**
  1.  **Fleet anchoring at Black Bay:** Dramatizes *regularity of behavior* and *conformity*.
  2.  **White Bay's superior shelter:** Addresses Constraint 1 (non-arbitrary advantage). The convention persists despite a better alternative due to *precedent* (the old wreck).
  3.  **Silas's explanation (lookouts/fleet):** Addresses Constraint 4 (functional explanation). It is unclear if the lookouts caused the anchorage or vice versa (rationalization vs. cause).
  4.  **The Transcripts:** Addresses Constraint 3 (questionable measurement). Context (Safety Board) may have induced misreporting; ambiguity remains.
  5.  **Publication & Shift:** Dramatizes the shift from *first-order conformity* to *common knowledge* of preferences, collapsing the expectation of conformity.
  6.  **The Collision:** Addresses Constraint 2 (load-bearing). The norm was an informal insurance/rescue pact; collapse brings cost, not liberation.

  **Potential Slippage:**
  When the lookouts fail to move, the practice risks sliding into a *rule enforced by penalties* (nature/safety) rather than pure coordination. However, since the penalty only applies if coordination fails (being alone vs. together), it remains a coordination problem. The moment the boats return to Black without discussion suggests the convention re-formed via *salience* (the focal point returned), though it borders on mere *imitation* if beliefs aren't restored.
