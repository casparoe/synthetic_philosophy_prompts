prompt: |-
  I'm running a workshop at my local library — about 12 participants of mixed ages and no philosophy background, 90 minutes, meeting in a circle with pens and paper. We've been talking about whether something stays "the same" when every part of it is replaced, using examples like a family recipe that gets rewritten ingredient by ingredient over generations, or a neighborhood association where every founding member eventually moves away. I want a structured in-person activity — with clear rules, assigned roles, and small but real stakes — that makes the group feel that tension themselves before anyone names the paradox. Specifically, the participants should collectively build and maintain a shared agreement or rule-set, replacing one component, clause, or member-role at a time, and at set intervals vote on whether they are still engaged with "the original" project. Please include the full rules, a timeline, the debrief that maps the group's actual choices onto the identity problem, an honest prediction of what will go wrong the first time and how to handle it, and a frank note about which feature of the problem the activity cannot reproduce. Please write the answer in American English.
