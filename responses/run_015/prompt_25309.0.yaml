answer: |-
  **Term Paper Proposal**

  **Title:** Beyond Summation: Permutation Invariance and the Well-Posedness of Infinite Decision Problems

  **1. Research Question and Thesis**

  The Pasadena game, introduced by Nover and Hájek (2004), presents a decision problem where a fair coin is tossed until it lands heads. If heads appear on toss $n$, the payoff is $(-1)^{n+1} 2^n / n$. The expected value (EV) of this game corresponds to the alternating harmonic series, which is conditionally convergent. By the Riemann Rearrangement Theorem, the sum can be made to converge to any real number, or diverge, depending on the order of summation. Consequently, standard Expected Utility Theory (EUT) yields no verdict: the EV is undefined.

  Existing literature generally divides into two camps. The first attempts to repair EUT by introducing generalized expectations (e.g., weak expectations, principal values, or non-standard analysis) to force a value onto the game. The second accepts the silence of EUT, arguing that rationality simply provides no guidance in such pathological cases.

  This paper argues that both camps accept a false premise: that the Pasadena game constitutes a well-posed decision problem in the first place. My thesis is that the Pasadena paradox is not a failure of decision theory to handle infinite values, but a failure of the problem formulation to satisfy a necessary condition for **representation invariance**. Specifically, I propose that for an infinite decision problem to be normatively binding, the valuation of the act must be invariant under permissible permutations of the state space enumeration. Because the Pasadena game's valuation depends entirely on the order of summation, it fails this test. It is not a genuine decision problem, but a mathematical artifact resulting from applying finite intuition to a structure that lacks the requisite stability.

  The central research question is: *What structural constraints must an infinite decision problem satisfy to be considered well-posed, and does a requirement of permutation invariance successfully exclude pathological cases like Pasadena without ruling out legitimate infinite models?*

  **2. The Gap in Existing Literature**

  The standard responses to the Pasadena paradox leave a significant explanatory gap regarding the *source* of the pathology.

  **The Extensionalist Approach:** Proponents of weak expectations (e.g., Easwaran) or regularized sums argue that we should extend the definition of expectation to cover conditionally convergent series. While mathematically sophisticated, this approach is normatively unmoored. If the value of a game changes based on how we order the states for calculation, why should an agent care about the "weak" expectation? This approach treats the symptom (undefined EV) without diagnosing the disease (lack of structural stability). It implicitly grants that the Pasadena game is a valid object of choice, which presupposes that an agent can meaningfully prefer an act whose value is essentially arbitrary depending on description.

  **The Nihilist Approach:** The opposing view suggests that EUT correctly goes silent here. While logically consistent, this is theoretically unsatisfying. It treats Pasadena as a boundary case similar to the St. Petersburg paradox, where EV is infinite. However, there is a disanalogy. In St. Petersburg, the EV is robustly $+\infty$; rearranging terms does not change the divergence to positive infinity. In Pasadena, the value is unstable. Treating these as the same kind of "breakdown" obscures the specific issue of conditional convergence. Simply saying "theory goes silent" fails to explain *why* it should go silent here but not in other infinite contexts (e.g., infinite horizon discounted utility models).

  **The Missing Normative Constraint:** Neither camp adequately addresses the representational sensitivity of the problem. In physics, a well-posed problem yields results invariant under coordinate transformations. I argue decision theory requires an analogous condition: **Permutation Invariance**. If the value of an act depends on the arbitrary indexing of states (which is often a artifact of how we write down the series rather than the physical structure of the gamble), the act cannot be a valid object of rational preference. The literature lacks a formalized criterion for this well-posedness condition.

  **3. Methodology**

  This paper will employ conceptual analysis combined with formal modeling. The argument will proceed in three stages.

  **Stage 1: Formalizing Well-Posedness.**
  I will define a decision problem as a tuple $\langle S, P, U \rangle$, where $S$ is the state space, $P$ is a probability measure, and $U$ is a utility function. I will propose a **Permutation Invariance Criterion (PIC)**: An act is well-posed if and only if the expected utility $\sum_{s \in S} P(s)U(s)$ converges absolutely. Absolute convergence is the mathematical necessary and sufficient condition for a series to be invariant under rearrangement. I will argue that absolute convergence is not merely a mathematical convenience but a normative requirement for rational choice. If a series is only conditionally convergent, the "value" is not a property of the gamble, but a property of the calculator's ordering.

  **Stage 2: Case Analysis and Stress Testing.**
  I will test the PIC against three categories of infinite decision problems:
  1.  **Pathological Cases:** The Pasadena game and its variants (e.g., the Altadena game). These should fail the PIC, confirming the intuition that they are ill-posed.
  2.  **Divergent Cases:** The St. Petersburg paradox. Here, the series diverges to $+\infty$. While it fails absolute convergence (since the sum of absolute values is also infinite), it passes a weaker **Directional Invariance** test (all rearrangements yield $+\infty$). I will argue this distinguishes St. Petersburg from Pasadena: St. Petersburg is a problem of *unbounded value*, whereas Pasadena is a problem of *undefined value*. This distinction justifies why we might treat them differently.
  3.  **Legitimate Infinite Models:** Standard economic models involving infinite time horizons (e.g., discounted utility streams). These typically rely on discount factors $\beta < 1$, ensuring absolute convergence. I will demonstrate that the PIC preserves these standard models, showing that the criterion is not overly restrictive.

  **Stage 3: Addressing Counterexamples.**
  The primary risk is that the PIC is too strict. I will investigate potential counterexamples where conditional convergence might seem normatively relevant. For instance, are there cases where the physical structure of a problem imposes a natural ordering (e.g., temporal sequence) that makes rearrangement impermissible? If the states are temporally indexed, does the Riemann Rearrangement Theorem still apply? I will argue that even in temporal cases, if the EV relies on conditional convergence, the long-run average behavior (Law of Large Numbers) does not stabilize, meaning the agent cannot expect the "calculated" value even in the limit. Thus, the temporal ordering does not rescue the normative force of the EV.

  **4. Success and Failure Conditions**

  **Success:**
  A successful paper will achieve three things. First, it will provide a clear philosophical justification for why absolute convergence (or a close analogue) is a normative requirement for rational choice, grounding it in representation invariance rather than mathematical convenience. Second, it will cleanly distinguish the Pasadena paradox from the St. Petersburg paradox, showing they are category errors of different types. Third, it will demonstrate that adopting the Permutation Invariance Criterion does not cripple decision theory's ability to handle standard infinite models used in economics and philosophy.

  **Failure:**
  The project would fail if the PIC turns out to be equivalent to a trivial restatement of "absolute convergence is required" without adding normative insight. More critically, the project fails if I cannot defend the criterion against the objection that physical orderings (like time) legitimize conditional convergence. If I cannot show why a temporally ordered conditionally convergent series is still normatively defective, the argument collapses. Finally, if the criterion rules out standard models in intergenerational ethics or infinite economics that the seminar considers legitimate, the scope will need to be narrowed, or the thesis abandoned.

  **5. Scope and Feasibility**

  This project is scoped for a one-semester term paper (approx. 15–20 pages).

  *   **Weeks 1–3:** Literature review and formalization. I will refine the definition of the Permutation Invariance Criterion, ensuring it aligns with measure-theoretic integration (Lebesgue vs. Riemann). The key insight here is that EUT is naturally grounded in Lebesgue integration, which requires absolute integrability, whereas the Pasadena paradox exploits Riemann-style summation intuition.
  *   **Weeks 4–6:** Drafting the core argument. I will focus on the normative justification for invariance. Why should a rational agent care if a sum is rearranged? The argument will hinge on the link between expectation and long-run frequency. If a series is conditionally convergent, the sample mean does not converge to the expectation almost surely. This breaks the link between EV and empirical outcomes.
  *   **Weeks 7–9:** Testing and Counterarguments. I will apply the criterion to the St. Petersburg case and discounted utility models. I will also draft the response to the "natural ordering" objection.
  *   **Weeks 10–12:** Revision and Polish. Ensuring the distinction between "undefined" and "infinite" is sharp, and that the conclusion offers a clear takeaway for decision theorists.

  **Feasibility:** The mathematical requirements are within my grasp (undergraduate real analysis and probability). The philosophical heavy lifting concerns the interpretation of expectation, which is central to the seminar. The risk lies in the "natural ordering" objection; if time imposes a valid order, my invariance claim weakens. However, I anticipate countering this by showing that even with temporal order, the *predictive* power of the expectation vanishes without absolute convergence, preserving the normative defect.

  **6. Conclusion**

  The Pasadena paradox is often treated as a limit-case puzzle for Expected Utility Theory. I propose it is better understood as a demarcation problem. By shifting the focus from "how do we sum this?" to "is this sum meaningful?", we can dissolve the paradox. This paper will argue that decision theory is not silent on Pasadena; it rejects it. A decision problem that lacks permutation invariance is not a hard problem; it is a pseudo-problem. Establishing this well-posedness condition clarifies the domain of EUT and protects it from artifacts of infinite series manipulation.

  ***

  **References (Placeholder)**
  *   Nover, H., & Hájek, A. (2004). Vexing expectations. *Mind*.
  *   Easwaran, K. (2008). Strong and weak expectations. *Mind*.
  *   Riemann, B. (1854). On the representability of a function by a trigonometric series.
  *   Standard texts on Decision Theory and Measure Theory.
