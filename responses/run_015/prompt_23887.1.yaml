          *   Identify the "break point" (where the costs outweigh the benefits).
      *   **Section 4: Is Insulation a Problem?**
          *   Nuanced take on reflective equilibrium vs. dogma.

  7.  **Drafting the Content (Iterative refinement):**
      *   *Refining the Grounding Problem:* Make sure to explain *why* it's a problem. If they share all micro-physical properties, where does the "modal flexibility" come from? It looks like brute fact.
      *   *Refining Thinking Animal:* This is the strongest parallel. If Statue $\neq$ Clay, then Person $\neq$ Body. But the Body thinks. So there are two thinkers. Which one am I?
      *   *Refining Falsifiability:* Be careful not to demand scientific falsification. Metaphysics is about coherence and explanatory power. The "falsification" is theoretical collapse.
      *   *Tone:* Keep it philosophical, rigorous, but accessible. The user is clearly well-read on the topic ("modal asymmetry," "Leibniz's Law" implied).

  8.  **Final Review against User Prompt:**
