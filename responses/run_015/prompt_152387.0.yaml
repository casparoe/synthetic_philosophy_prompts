answer: |-
  **Taxonomy of Neural Scale and Moral Status**

  **Node 1: Normative Ontology**
  *Commitment A:* Neural scale possesses direct normative significance (constitutive of status).
  *Commitment B:* Neural scale possesses only indirect evidential value (indicative of status).
  *Diagnostic Case:* If a human brain were artificially enlarged to twice its normal volume but preserved identical functional connectivity and cognitive profile, would its moral status increase? (Yes → A; No → B).

  **Node 2: Metric Specificity (Path A) / Correlation Robustness (Path B)**
  *Commitment A1:* Moral weight tracks Absolute Cranial Volume.
  *Commitment A2:* Moral weight tracks Relative Scaling (Encephalization Quotient/Neuron Count).
  *Commitment B1:* Brain-size-to-capacity correlation is robust across taxonomic boundaries.
  *Commitment B2:* Correlation is confounded by allometric scaling laws and metabolic constraints.
  *Diagnostic Case:* Does a whale possess higher moral status than a human due to greater mass, or is the comparison invalid due to body-plan differences? (Whine higher → A1; Invalid/ EQ matters → A2/B2; Whale lower due to cognition → B1).

  **Node 3: Moral Mathematics (Path A2) / Capacity Locus (Path B1)**
  *Commitment A2i:* Moral status varies along a Continuous Gradient proportional to scale.
  *Commitment A2ii:* Moral status activates only upon meeting a Discrete Threshold of scale.
  *Commitment B1a:* Moral status derives from Individual Cognitive Function.
  *Commitment B1b:* Moral status derives from Species-Typical Neural Architecture.
  *Diagnostic Case:* Does a cognitively marginal human retain full status via species norm, or reduced status via individual capacity? (Full → B1b; Reduced → B1a).

  **Node 4: Scope of Comparability (Path A2i)**
  *Commitment A2i-α:* Gradients are comparable Inter-species.
  *Commitment A2i-β:* Gradients are valid only Intra-species.
  *Diagnostic Case:* Can a primate possess higher moral status than a human infant based on neuron count? (Yes → α; No → β).

  **Node 5: Weighting Function (Path A2i-α)**
  *Commitment A2i-α-1:* Moral weight increases Linearly with neural scale.
  *Commitment A2i-α-2:* Moral weight increases Logarithmically (diminishing returns).
  *Diagnostic Case:* Does doubling neuron count double moral worth, or yield marginal gain? (Double → 1; Marginal → 2).

  **Terminal Leaves (Six Positions)**
  1.  **Absolute Volume Absolutism** (Path A1): Raw mass determines status.
  2.  **Neurocentric Gradualism** (Path A2i-α): EQ creates inter-species moral gradient.
  3.  **Threshold Neurocentrism** (Path A2ii): Scale grants status only past a biological limit.
  4.  **Capacity-Functionalism** (Path B1a): Size is a proxy for individual cognition only.
  5.  **Species-Normativism** (Path B1b): Size proxies conformity to species architecture.
  6.  **Allometric-Bias Rejection** (Path B2): Scaling laws render cross-species size comparisons morally inert.

  **Logical Gap Analysis**
  One logically possible combination remains unoccupied: *Direct Normative Significance* (Node 1A) combined with *Absolute Cranial Volume* (Node 2A1) while simultaneously *Denying Cognitive Correlation* (implicit contradiction of Node 2B). Specifically, a view asserting raw volume grants moral weight independent of any capacity or function is absent.
  *Diagnosis:* Internal Incoherence. Assigning direct moral weight to a physical metric while denying it correlates with morally relevant properties (consciousness, agency, suffering) reduces ethics to mere geomorphology. This position lacks a justificatory mechanism for why volume *per se* obligates moral agents, rendering it philosophically untenable rather than empirically false or historically neglected.
