  Dear colleague, I have been thinking deeply about your note and the puzzle you have laid out regarding the Dutch book arguments, and I find your unease entirely justified. The tension you feel between Clare and Iris is the central knot that needs untangling, for it reveals a ambiguity in what we take the Dutch book to be proving. Is it proving that the agent will lose money, or is it proving that the agent's mind is in a state that would lead to lost money were they to act on it without interference? Your tentative rule focuses on the transactions themselves, which works well for Dan and Evan but struggles to explain why Clare is criticisable even without a bookie while Iris is not, given that both hold the same incoherent credences. If we stick strictly to your rule, Clare is defective because she would accept the bets, and Iris is sound because she would not, but this makes the defect contingent on a disposition to act rather than the state of belief itself, which contradicts your intuition that Clare is wrong even in isolation. Furthermore, your rule lets Dora off the hook too easily by focusing on her plan rather than her preferences, and it leaves Hana untouched when you feel something is indeed amiss, albeit not irrationality.

  To resolve this, I propose we replace your behavioral rule with a principle of Structural Coherence supplemented by a clause on Actuality. The principle runs as follows: a set of attitudes is defective if it violates the axioms of probability or preference logic, where a Dutch Book serves as a diagnostic demonstration of this violation provided the agent acts on those attitudes in normal conditions without rational defeaters. The first clause, requiring violation of axioms, is there to handle Clare and Dan directly, ensuring that the defect lies in the attitudes themselves rather than the mere occurrence of a loss; without this, we cannot condemn Clare in the absence of a bookie, as you rightly wish. The second clause, specifying normal conditions and the absence of defeaters, is there to handle Iris and Dora; it explains why they do not lose money without exonerating their underlying attitudes, for Iris has a defeater in her suspicion and Dora has a defeater in her resolution, yet the attitudes themselves remain incoherent. The third clause, limiting the diagnostic to finite transactions, is there to handle Evan, ensuring that we do not condemn agents for failing to complete infinite tasks; without this, finite additivity would be ruled out, which contradicts standard probability theory. The fourth clause, distinguishing coherence from correctness, is there to handle Hana, acknowledging that one can be coherent yet wrong; without this, we would be forced to call Hana irrational merely for being unlucky or misinformed.

  I must be honest with you, however, that adopting this principle requires you to overturn two of your verdicts, specifically those regarding Iris and Dora. On my view, Iris is indeed criticisable as a thinker, even if she is prudent as an actor. Her credences are probabilistically incoherent, and the fact that she has a separate belief about the bookie's knowledge saves her wallet but not her mind from the charge of inconsistency. To say she is in perfectly good standing is to confuse practical success with theoretical rationality. Similarly, Dora's preferences are defective regardless of her plan. Her cyclic ranking is a failure of rational valuation, and while her resolution prevents the money pump, it does not cure the underlying intransitivity. You should condemn the preferences even if you praise the planning, for the defect is in the ranking itself, which distorts her evaluation of options. Your hesitation here likely stems from a desire to be charitable to agents who avoid harm, but we must distinguish between avoiding the symptom and curing the disease. Regarding Hana, my principle supports your intuition that she is not irrational, but it clarifies that what has gone wrong is a failure of accuracy rather than coherence, which is a valuable distinction to maintain.

  Now let us run this principle over the three cases you have not yet decided. Consider first the man who knows the objective chance of heads is 0.7 while his credence is 0.3. Here the Dutch Book argument does not strictly apply in the same way as it does for Clare, because a bookie who knows the chances cannot construct a sure loss on a single event based solely on this mismatch; the bookie can only ensure an expected loss over the long run. Therefore, the book is not doing the work here. Instead, the defect is a violation of the Principal Principle, which mandates that credence should align with known objective chance. My principle captures this under the axioms of coherence extended to include norms linking chance and credence, so the man is defective, but the work is done by the chance norm itself, not the booking possibility.

  Second, consider the woman whose evidence is never certain enough to condition on, so she updates by spreading a shock across a partition. This describes Jeffrey Conditionalization. If she performs this update correctly according to the rules of probability kinematics, she is structurally coherent and cannot be Dutch Booked. My principle verdicts her as sound, provided her updating rule respects the coherence constraints on probability flows. The fact that she cannot be booked is the correct result, for there is nothing irrational about having uncertain evidence and updating accordingly, provided the update is consistent.

  Third, consider the man whose present credence in a hypothesis is 0.4 conditional on his future self's credence being 0.9, because he knows he is about to be given a drug that will make him overconfident. He refuses to defer to his future self. This is a violation of the Reflection Principle only if the future self is regarded as rational. Since he knows the future credence is the result of a biasing drug, he has a rational defeater for deference. My principle exonerates him because the condition for the defect—acting on attitudes in normal conditions without defeaters—is not met. He is right to refuse to defer, and no Dutch Book can legitimately be constructed against him that respects his knowledge of the drug. Thus, he is not criticisable, and this aligns with the intuition that one should not trust a known biased source, even if that source is oneself.

  In sum, I believe shifting your focus from the transactions to the structural state of the attitudes, while using the transactions merely as a diagnostic tool under normal conditions, will resolve the tensions you feel. It allows you to condemn Clare for her state while explaining why Iris loses no money, though it requires you to accept that Iris is still theoretically flawed. It preserves your protection of Evan and Gil, clarifies the status of Hana, and gives you the tools to assess the new cases regarding chance, uncertain evidence, and biased future selves. I hope this helps you settle the reversals you have been experiencing, for it is often the case that the Dutch book arguments are most powerful when viewed as revealing the shape of the mind rather than the emptiness of the pocket.
