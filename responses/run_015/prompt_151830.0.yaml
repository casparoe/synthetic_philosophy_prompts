answer: |-
  Your project strikes at the heart of the contemporary expressivist debate: whether the Frege-Geach (F-G) problem reveals a fatal flaw in the theory or merely a demand for a more sophisticated semantics of non-cognitive states. Your six verdicts are phenomenologically astute but logically precarious. Specifically, the tension you identify between Case 2 (Conditional) and Case 5 (Disjunction) is not merely a taxonomic inconvenience; it threatens the logical equivalence required to preserve validity (since $P \to Q$ is classically equivalent to $\neg P \lor Q$).

  To systematize these intuitions without ad hoc adjustments, you need a principle that distinguishes between operators that **report** attitudes and operators that **compose** them. Below, I propose the **Principle of Normative State Composition (PNSC)**. This principle accommodates most of your verdicts but requires a specific revision to your view on logical operators to ensure compositional uniformity.

  ### The Principle: Normative State Composition (PNSC)

  **Core Thesis:** Moral sentences express *normative states of mind* (e.g., plans, commitments, or attitudes of disapproval). Embedding operators function in one of two ways:
  1.  **Attribution:** They report the normative state of a subject other than the speaker (Psychological verbs).
  2.  **Composition:** They construct a *complex* normative state out of simpler ones (Logical and Modal operators).

  **The Taxonomy of Operators:**
  *   **Type A (Attributive):** Verbs of propositional attitude (*believes, desires*). These redirect the normative state to the subject of the verb. The speaker expresses a belief *about* the subject's state, not the state itself.
  *   **Type B (Compositional):** Logical and Modal operators (*if, or, not, possible, likely*). These do not suspend the expression of attitude; rather, they specify the *structure* of the complex attitude the speaker is expressing. The speaker is not "neutral"; they are in a complex state (e.g., a state of ruling out a specific combination of truth-values or normative commitments).

  ### Application to Your Six Cases

  Here is how PNSC governs your cases, highlighting where your original verdicts align and where they require adjustment.

  *   **Case 1 (Unembedded):** **Atomic Expression.**
      *   *Governance:* Type B (Identity Composition).
      *   *Analysis:* The speaker expresses a simple, categorical normative state (disapproval).
      *   *Verdict:* **Saved.** Matches your intuition.

  *   **Case 2 (Conditional):** **Structural Composition.**
      *   *Governance:* Type B (Logical).
      *   *Analysis:* The speaker expresses a complex normative state: *disapproval of holding the antecedent attitude without the consequent attitude.*
      *   *Verdict:* **Modified.** Your verdict claims the speaker "merely entertains content" and "suspends attitude." PNSC dictates that the speaker *does* express an attitude (a higher-order one regarding the inference). To solve F-G, you must abandon the "suspension" language. The attitude is not suspended; it is *redirected toward the logical relation*.

  *   **Case 3 (Belief Attribution):** **Attribution.**
      *   *Governance:* Type A (Psychological).
      *   *Analysis:* The speaker attributes a normative state to Maria. The speaker's own normative state is regarding the accuracy of that attribution.
      *   *Verdict:* **Saved.** Matches your intuition perfectly.

  *   **Case 4 (Epistemic Modal):** **Modal Composition.**
      *   *Governance:* Type B (Modal).
      *   *Analysis:* The speaker expresses a normative state qualified by probability. This is a complex state (e.g., *a plan to treat the proposition as a live possibility*).
      *   *Verdict:* **Saved.** Your intuition that this "grades" the attitude is compatible with PNSC, provided we understand "grading" as constructing a probabilistic complex state rather than a simple categorical one.

  *   **Case 5 (Disjunction):** **Structural Composition.**
      *   *Governance:* Type B (Logical).
      *   *Analysis:* The speaker expresses a complex normative state: *disapproval of the scenario where both disjuncts are false.*
      *   *Verdict:* **Modified.** Your intuition that this retains "partial attitudinal force" distinct from the conditional is the source of the tension. Under PNSC, Case 2 and Case 5 must be treated uniformly as **Structural Compositions**. If $P \to Q$ and $\neg P \lor Q$ are logically equivalent, the normative state expressed must be functionally identical. You cannot treat the conditional as "suspension" and the disjunction as "partial force."

  *   **Case 6 (Negation):** **Structural Composition (Inversion).**
      *   *Governance:* Type B (Logical).
      *   *Analysis:* Negation constructs a state of *incompatibility* with the original attitude. It is not a vacuum; it is a commitment to the rejection of the original norm.
      *   *Verdict:* **Saved.** Your intuition that negation can invert valence fits the "Composition" model (constructing a state of *tolerance* rather than *disapproval*).

  ### The Casualty: Which Verdict Must Be Abandoned?

  To maintain compositional uniformity and solve the Frege-Geach problem, you must abandon the **"Suspension" intuition in Case 2**.

  **Why?**
  If you maintain that the conditional "suspends" attitude (Case 2) while disjunction retains "partial force" (Case 5), you break the logical equivalence between $P \to Q$ and $\neg P \lor Q$. This renders valid inferences involving moral terms invalid (the original F-G problem).
  *   **The Fix:** Adopt the Blackburn/Schroeder line: In Case 2, the speaker *is* expressing an attitude—specifically, a higher-order attitude of disapproval toward the combination of accepting the antecedent and rejecting the consequent. This aligns Case 2 with Case 5 (both express complex commitments) and Case 4 (all express complex states).

  ### Extension to Unconsidered Cases

  Here is how PNSC handles two complex embeddings, assuming the revision to Case 2.

  **Case 7: Nested Counterfactual with Attitude Report**
  *   *Sentence:* "If Maria believed that torturing prisoners was wrong, she would have resigned."
  *   *Analysis:* This is a **Type B (Logical)** operator scoping over a **Type A (Attributive)** clause.
  *   *PNSC Verdict:* The speaker expresses a complex normative state regarding an *inference between attributed states*. The speaker is not expressing disapproval of torture, nor attributing it to Maria categorically. They are expressing a commitment to the *connection* between Maria's hypothetical normative state and her actions. The "attitude" expressed is a second-order commitment to the rationality of moral agents.
  *   *Force:* No first-order moral attitude is expressed by the speaker; only a commitment to a psychological/normative generalization.

  **Case 8: Probabilistic Disjunction**
  *   *Sentence:* "It is more likely that either tax fraud or bribery is wrong than that neither is."
  *   *Analysis:* This is a **Type B (Modal)** operator scoping over a **Type B (Logical)** operator.
  *   *PNSC Verdict:* The speaker expresses a **probabilistically qualified complex normative state**. They are not merely entertaining the disjunction; they are committing to a higher probability of the *exclusion of joint falsehood* (the disjunction) compared to the *joint truth of negations*.
  *   *Force:* This is a "graded" commitment (per your Case 4 intuition) applied to a "structural" commitment (per your Case 5 intuition). PNSC handles this seamlessly: Modal operators modify the *strength* of the commitment; Logical operators modify the *object* of the commitment.

  ### Summary of Recommendations

  1.  **Adopt PNSC:** Distinguish between **Attribution** (psychological verbs) and **Composition** (logic/modals).
  2.  **Unify Logic and Modals:** Treat Conditionals, Disjunctions, Negation, and Epistemic Modals all as **Compositional**. They all result in the expression of a complex state of mind, not the suspension of one.
  3.  **Abandon Case 2 "Suspension":** Explicitly reject the idea that the antecedent of a conditional is "attitude-free." It is part of a complex attitude. This is the only way to preserve validity without abandoning expressivism.
  4.  **Refine Case 5 "Partial Force":** Redescribe disjunction not as "partial force" but as "commitment to exclusion of joint falsehood." This makes it logically compatible with the revised Case 2.

  By making this shift, you transform the Frege-Geach problem from a fatal objection into a demand for a **logic of normative states**. The puzzle is not that moral language fails to compose; it is that we must recognize the "content" of moral sentences as *types of commitments* that can be logically combined just as propositions can.
