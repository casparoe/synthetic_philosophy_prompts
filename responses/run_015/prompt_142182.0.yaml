  5.  **Final Polish:** Check against constraints. No citations. No style advice. Just argument stress-testing. Ensure the tone is helpful but critical. (The user asked to "pick it apart".)

      *   *Key Insight to add:* The "Agency" argument (Bullet 2 in user's notes) relies on a specific definition of *fiʿl* (act). For Ghazālī, an act requires knowledge and will. Fire lacks this. This is distinct from the conceivability argument. The user is right to separate them.
      *   *Key Insight on Induction:* The occasionalist doesn't need to induce God's behavior *from* nature; they induce it from *revelation* or *past experience of God's consistency*. But the latter is still induction.
