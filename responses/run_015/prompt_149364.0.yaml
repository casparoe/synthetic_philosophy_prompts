          *   Analysis: If "Womanpower" feels *more* wrong than "Personpower," it suggests male-as-norm is active. If both feel equally weird, it's just novelty.
          *   Verdict: Usually, female-marked feels like a *deviation*, neutral feels like *clunky*. This supports the idea that Male is the specific "unmarked" category, not just "familiar."

  4.  **Address the Statutory Interpretation Point:**
      *   "Masculine includes feminine."
      *   User is right: This is a *stipulation* (a rule for lawyers/judges), not a *description* of how people talk.
      *   Which reading does it support? It supports the *Legal/Formal* reading, but undermines the *Cognitive* reading. It admits the word *is* masculine but commands you to pretend it isn't.

  5.  **Address the "Can't Fix the World" Line:**
      *   Is it a topic switch? Yes.
      *   Argument 1: Language reflects reality (Descriptive).
      *   Argument 2: Language shapes reality (Prescriptive/Constructive).
      *   The colleague is saying "Language is downstream." The committee is saying "Language is upstream (or at least part of the system)."
      *   It's a move from "Is this claim true?" to "Is this intervention effective?"

  6.  **Drafting the Menu of Readings (The Core Task):**
      *   I need to structure this clearly. Let's create 4-5 distinct "Readings."
      *   *Reading 1: The Etymological Fossil.* (Word history).
