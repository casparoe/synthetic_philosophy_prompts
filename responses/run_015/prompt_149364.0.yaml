  1.  **Analyze the User and Request:**
      *   **User:** Member of a three-person committee rewriting an engineering style guide.
      *   **Problem:** A senior engineer is blocking proposed inclusive language changes (removing "man-" compounds, generic "he") using two specific arguments: (1) "Man is the unmarked default," and (2) "You can't fix the world by editing the dictionary."
      *   **Goal:** The user wants a "menu" of interpretations of the "unmarked default" claim, analyzed along specific dimensions (what it asserts, truth status, implications for the style guide).
      *   **Constraints/Requirements:**
          *   No linguistics background assumed (explain technical terms).
          *   Address three specific conceptual tools the user provided (Live vs. Fossil Default, Base Rates/Demographics, Hofstadter Satire/Novelty).
          *   Address the statutory interpretation rule point.
          *   Analyze the "can't fix the world" line (is it a topic switch?).
          *   Tone: Analytical, nuanced, practical, respectful of the colleague but critical of the argument.

  2.  **Deconstruct the Core Argument ("Man is the unmarked default"):**
      *   I need to break this down into distinct claims. It's not just one thing. It ranges from linguistic structure to cognitive processing to social norms.
      *   *Claim 1: Etymological/Historical.* "Man" *used* to mean human. (Fossil).
      *   *Claim 2: Grammatical/Structural.* English treats masculine as the zero-marked form. (Structural).
      *   *Claim 3: Cognitive/Processing.* People process "man" faster/neutral compared to marked alternatives. (Psycholinguistic).
      *   *Claim 4: Referential/Statistical.* In this context, "man" usually refers to men because most engineers are men. (Base Rate).
      *   *Claim 5: Normative/Social.* Using "man" doesn't *intend* to exclude, so it shouldn't be read as excluding. (Intent vs. Impact).

  3.  **Address the Three Conceptual Tools:**
      *   *Tool 1: Live vs. Fossil Default.*
          *   Fossil: Etymology only (e.g., "werewolf" = man-wolf, but nobody thinks "man").
          *   Live: Active cognitive process (e.g., "he" triggers male image).
          *   Application: If it's fossil, changing it is easy/cosmetic. If it's live, changing it requires cognitive effort/retraining.
          *   Test: Can you picture a woman when hearing "manned spacecraft"? If yes -> Fossil/Weak. If no -> Live.
      *   *Tool 2: Base Rates (Demographics).*
          *   Is the "default" in the word or the world?
          *   If it's the world, changing the word won't fix the demographic skew, *but* keeping the word reinforces the skew (feedback loop).
          *   Inference check: Will it evaporate if demographics change? Probably not fully; language has inertia.
      *   *Tool 3: Hofstadter Satire (Novelty vs. Bias).*
