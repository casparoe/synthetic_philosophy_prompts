answer: |-
  This is a classic friction point in technical communication. Your colleague isn't necessarily wrong about how language *works*, but he may be wrong about what that *means* for your specific goal (clarity and inclusivity in engineering standards).

  The phrase "unmarked default" is doing a lot of heavy lifting here. In linguistics, "unmarked" usually means the form you use when you aren't specifying anything special (e.g., "lion" is often treated as unmarked, while "lioness" is marked; "height" is unmarked, "shortness" is marked).

  Here is a menu of five distinct readings of the claim "Man is just the unmarked default." I have analyzed each using your criteria (a, b, c) and integrated your three conceptual tools (Live/Fossil, Base Rates, Hofstadter) into the analysis where they fit best.

  ### The Menu of Readings

  #### 1. The Etymological Claim (The "Fossil" Reading)
  *   **(a) What it asserts:** This is a claim about **word history**. It asserts that *man* comes from a root meaning "human" (which is true, cognate with *manniskaz*), so using it now is just preserving an old neutral meaning, like using "daylight" without thinking about the sun.
  *   **(b) Truth Status:** **True (historically), False (currently).** It is etymologically accurate, but linguistically obsolete. This is the definition of a **Fossil Default**.
      *   *The Test:* If it were a fossil, nobody would picture a specific gender. But if you say "caveman," people picture a male. If you say "manned mission," the mental image is rarely gender-neutral. The etymology is dead; the gendered association is alive.
  *   **(c) Implication for Style Guide:** **Cuts against your colleague.** If it's a fossil, it's a "legacy code" issue. We update legacy code when it causes bugs. If the etymology doesn't match current comprehension, the etymology is irrelevant to the style guide.

  #### 2. The Grammatical Claim (The "Structural" Reading)
  *   **(a) What it asserts:** This is a claim about **English grammar**. It asserts that English structurally treats masculine pronouns and compounds as the "zero-form" (the one with no extra suffix), while feminine forms are "marked" (he vs. she, actor vs. actress). Therefore, the masculine is the structural neutral.
  *   **(b) Truth Status:** **Platitude / Structural Fact.** English *does* historically asymmetry here. "He" was legally prescribed as the generic pronoun for centuries. However, English is currently in a transition where "they" is becoming the true structural neutral.
  *   **(c) Implication for Style Guide:** **Neutral/Complicated.** If grammar dictates "he" is default, your style guide is explicitly *overriding* grammar for the sake of policy. This admits that you are making a change, but doesn't prove the change is bad. It supports the idea that you are intervening in the system, not just describing it.

  #### 3. The Cognitive Claim (The "Prototype" Reading)
  *   **(a) What it asserts:** This is a claim about **how people think**. It asserts that when a human brain processes the word *man* or *he* in a generic context, it does not activate a "human" concept, but specifically activates a "male" prototype. The "default" is a psychological shortcut.
  *   **(b) Truth Status:** **Empirical Claim (Likely True).** Psycholinguistic studies consistently show that "generic he" and "manned" terms trigger male-biased mental imagery faster and more strongly than neutral terms.
      *   *Hofstadter Control:* Your control idea (comparing *womanpower* vs. *personpower*) is excellent. If *womanpower* feels "wrong" (deviation from norm) and *personpower* feels "clunky" (novelty), but *manpower* feels "normal," that proves Male is the **Live Default**. The "sting" of the satire isn't just novelty; it's that we are used to men being the norm. If it were pure novelty, *womanpower* should feel just as clunky as *personpower*, but it usually feels *political* or *specific*, whereas *manpower* feels *invisible*.
  *   **(c) Implication for Style Guide:** **Cuts strongly against your colleague.** If the default is live and male-biased, then using it *does* say something about somebody (it excludes women from the mental model). Fixing the dictionary *does* fix the cognitive prototype over time.

  #### 4. The Statistical Claim (The "Base Rate" Reading)
  *   **(a) What it asserts:** This is a claim about **the world, not the words**. It asserts that because 90% of engineers are men, writing "the engineer... he" is just matching reality. The "default" is actually a probability calculation based on demographics.
      *   *Your Point 2:* This addresses your worry about demographics. If the default is just base rates, it should evaporate when demographics change.
  *   **(b) Truth Status:** **Empirical Claim (Context Dependent).** In your specific workplace, it might be statistically true. In the broader world, less so.
      *   *The Trap:* Language has inertia. Even if your department becomes 50/50 tomorrow, the language might lag by 20 years. Relying on base rates reinforces the base rate (a feedback loop). If juniors read "he," they subconsciously code the role as "not for me."
  *   **(c) Implication for Style Guide:** **Cuts against your colleague.** Engineering standards are supposed to be robust, not just reflective of current stats. You write standards for the future workforce, not just the current one. If the language relies on a demographic skew to make sense, it is brittle.

  #### 5. The Normative Claim (The "Stipulation" Reading)
  *   **(a) What it asserts:** This is a claim about **rules and authority**. It asserts that "We have agreed (or the law says) that masculine includes feminine, so it *is* neutral by definition."
      *   *Statutory Interpretation:* This addresses your listserv point. The rule that "masculine includes feminine" is a **legal stipulation**, not a linguistic discovery. It is a command to judges: "Pretend this word means both."
  *   **(b) Truth Status:** **True (by fiat).** It is true in legal contexts because the law says so. It is false in cognitive contexts (see Reading 3).
  *   **(c) Implication for Style Guide:** **Cuts against your colleague.** A style guide is *also* a stipulation. You are writing a new rule. His argument is "The old rule says X." Your argument is "We are writing a new rule Y." You cannot defeat a style guide proposal by citing an older style convention; that just admits you are in a rule-making conflict.

  ---

  ### Analysis of Your Three Conceptual Tools

  Here is how to wield the specific tools you mentioned in the conversation.

  **1. Live vs. Fossil Default**
  *   **Which readings need it?** Reading 1 (Etymology) requires it to be a **Fossil**. Reading 3 (Cognitive) requires it to be **Live**.
  *   **The Cheap Test:** Ask your colleague: "If I say 'unmanned aerial vehicle,' do you picture a robot, or do you picture a vehicle without a *man* in it?" If he admits the latter, the "man" is still semantically active. It is a Live Default.
  *   **Why it matters:** If it's a fossil, changing it is easy (like fixing a typo). If it's live, changing it requires training (like changing a workflow). Your colleague wants to treat it as a fossil ("it doesn't mean anything") while benefiting from the stability of a live default ("everyone knows what it means"). You can't have both.

  **2. Base Rates (The World vs. The Word)**
  *   **Does it change the reading?** Yes. If he is making the Statistical Claim (Reading 4), he is admitting the language is *dependent* on the current gender skew.
  *   **The Inference:** You are right to distrust the inference that it will "evaporate." Language acts as a ratchet. It locks in past demographics.
  *   **The Counter:** "If the word relies on the demographic skew to function as a neutral, then the word is actively working to maintain that skew. As engineers, we don't design systems that rely on positive feedback loops to maintain stability."

  **3. The Hofstadter Satire (Novelty vs. Bias)**
  *   **What the sting shows:** The satire works because "personhole" violates the **Live Default**. It feels prissy because we are used to the male-default being invisible.
  *   **Your Control:** Your control (*womanpower* vs. *personpower*) is valid.
      *   If *womanpower* feels "aggressive/political" and *personpower* feels "clunky/neutral," but *manpower* feels "invisible," that proves **Male is the Unmarked Category**.
      *   If *womanpower* and *personpower* both feel equally "aggressive," then *any* deviation is marked.
      *   *Result:* Usually, the female-marked term feels like a *correction*, while the neutral term feels like *innovation*. The male term feels like *status quo*. This supports Reading 3 (Cognitive). The "weirdness" isn't just novelty; it's the friction of overriding a deep-seated norm.

  ---

  ### The "Statutory Interpretation" Point

  Your instinct is correct: The rule that "masculine includes feminine" is a **stipulation**, not a discovery.

  *   **Which reading does it support?** It supports Reading 5 (Normative).
  *   **Why it fails him:** He is using a legal rule of *interpretation* to win a argument about *composition*.
      *   *Interpretation:* "How do we read this old law?" (Answer: Masculine includes feminine).
      *   *Composition:* "How should we write this new document?" (Answer: However we want).
      *   Citing an interpretation rule to stop a composition change is like citing a traffic law to stop a car manufacturer from building a safer seatbelt. It applies to the user, not the designer. You are the designers.

  ---

  ### The "Can't Fix the World" Line

  **Did he switch topics?**
  Yes. This is a classic move from **Descriptive** to **Instrumental**.

  *   **Argument 1 (Unmarked Default):** "This word *is* neutral." (Claim about Truth/Linguistics).
  *   **Argument 2 (Can't Fix the World):** "Changing this word *won't help*." (Claim about Efficacy/Sociology).

  He likely switched because Argument 1 was losing ground. If you press him on the linguistics (Reading 3), he retreats to the futility argument.

  **How to handle it:**
  1.  **Acknowledge the limit:** "You're right, changing 'manpower' to 'workforce' won't instantly fix hiring bias."
  2.  **Reframe the goal:** "But our goal isn't to fix the world; it's to fix our documentation standards. We want our docs to be precise. If 'man' triggers a male prototype in the reader's head (Reading 3), then the word is imprecise for a mixed-gender team."
  3.  **The Engineering Analogy:** "We don't say 'we can't fix safety by updating the manual.' We update the manual because it's part of the system. Language is part of the system."

  ### Summary: What is he actually claiming?

  Most people who use this line are aiming at a **hybrid of Reading 1 (Fossil) and Reading 3 (Cognitive), but they want the benefits of both.**

  *   They want you to believe it's a **Fossil** ("It doesn't mean male, it's just history") so you don't feel excluded.
  *   But they rely on it being a **Live Default** ("Everyone knows what it means, don't rock the boat") so you don't change it.

  **The Verdict for your Committee:**
  You can respectfully point out that he cannot have it both ways.
  *   If it's a **Fossil**, it's obsolete code and should be refactored for clarity.
  *   If it's a **Live Default**, it is actively signaling "male," which violates your inclusivity standards.
  *   If it's a **Statistical Base Rate**, it makes your standards brittle and dependent on current demographics.

  The "Can't fix the world" line is a concession that the language *does* have an effect, but he's arguing the effect is too small to matter. Your counter is that in engineering standards, small errors in specification compound over time. Precision matters, even in the defaults.
