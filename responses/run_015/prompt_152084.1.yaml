          3.  **The Constitutive/Metaphysical Thesis:** Calculation alienates the self from its ground projects. (Defensible, supports both).
          4.  **The Aretaic/Character Thesis:** Calculation reveals a defect in love/virtue. (Defensible, supports both).
      *   *Evaluation:* Assign Platitude/Defensible/False labels.
      *   *The Verdict:* Which one justifies the tutor's double-use? It has to be the Normative or Constitutive one. The Psychological one is too weak for EA. The Character one is ad hominem-ish. The Constitutive one is the most philosophical "Williams" fit.
      *   *Refining the "False/Defensible" labels:*
