answer: |-
  Your tutor is leveraging a famous line from Bernard Williams (from *Persons, Character and Morality*, 1981), but you are right to suspect slippage. Williams used the example of a husband saving his wife; your tutor is applying it to a parent saving a child *and* to the general methodology of Effective Altruism (EA).

  The phrase "one thought too many" is philosophically ambiguous. It can function as a description of a mental event, a prescription for action, or a diagnosis of character. To treat it like "loose change," here is the menu of distinct theses the phrase could be cashing out, evaluated on their own merits.

  ### The Menu of Theses

  #### 1. The Pragmatic/Psychological Thesis
  *   **The Claim:** In high-stakes, time-sensitive scenarios, the cognitive act of calculation introduces fatal latency. The thought itself is a causal obstacle to the successful outcome.
  *   **Classification:** **Platitude (in emergencies) / False (in general).**
  *   **Analysis:** In the burning building case, this is trivially true. If you stop to run a utility calculus, the child burns. The thought is "too many" because it is *too slow*. However, applied to Effective Altruism (which concerns career choice, donation allocation, and long-term strategy), this is false. EA calculations are not split-second; they are deliberative. Pausing to think is the *point* of EA.
  *   **Verdict:** This reading saves the child but fails to dent EA.

  #### 2. The Normative/Exclusionary Thesis
  *   **The Claim:** Certain relationships generate "exclusionary reasons" that morally forbid impartial weighing. You *ought not* to calculate, even if you have time. To weigh your child against strangers is to fail to acknowledge the special obligation you already possess.
  *   **Classification:** **Defensible.**
  *   **Analysis:** This is a standard partialist position in ethics. It argues that the morality of the situation is not determined by the *outcome* of the calculation, but by the *appropriateness* of the deliberation. If you calculate, you have already treated the child as a variable rather than a commitment.
  *   **Verdict:** This works for both cases. It condemns the parent for hesitating (morally, not just practically) and condemns the EA agent for treating personal commitments as fungible assets in a utility function.

  #### 3. The Constitutive/Metaphysical Thesis
  *   **The Claim:** Personal projects and relationships are not just things an agent *has*; they are partly what an agent *is*. To step back and evaluate them impartially is to alienate oneself from one's own identity. The calculation is "one thought too many" because it requires a standpoint outside the self that does not exist.
  *   **Classification:** **Defensible (but controversial).**
  *   **Analysis:** This is the closest to Williams' actual intent. It suggests that integrity relies on "ground projects." If you view your love for your child as a hypothesis to be tested against the greater good, you have severed the link between your agency and your life.
  *   **Verdict:** This works for both cases. It argues that both the parent and the EA advocate are suffering from a kind of self-alienation by adopting a "view from nowhere."

  #### 4. The Aretaic/Character Thesis
  *   **The Claim:** The disposition to calculate reveals a defect in virtue. A person with good character (a loving parent, a loyal friend) would not *need* to calculate; the right action would flow from their character. The need to calculate indicates a lack of love or commitment.
  *   **Classification:** **Defensible.**
  *   **Analysis:** This shifts the focus from the act to the agent. It claims that the *presence* of the thought is evidence of moral corruption. A virtuous agent saves their child immediately *because* they are virtuous, not because they calculated it.
  *   **Verdict:** This works for both cases. It attacks the EA mindset as inherently cold or lacking in proper human attachment, regardless of the consequences.

  ---

  ### Which Reading Supports the Tutor's Double-Use?

  Your tutor is trying to kill two birds with one stone: the specific intuition pump (burning building) and the general theory (utilitarian calculation/EA).

  **The Pragmatic Thesis fails this task.** It explains why you shouldn't calculate in the fire, but it cannot explain why you shouldn't calculate your donations on a Tuesday afternoon. If your tutor relies on this, they are committing a category error between emergency reflex and strategic planning.

  **The Winner: The Normative/Constitutive Hybrid.**
  The only reading that successfully bridges the gap between the burning building and Effective Altruism is the **Normative/Constitutive Thesis (Options 2 & 3 combined).**

  Here is why this is the only reading that justifies your tutor's move:
  1.  **It ignores time:** It doesn't matter if you have five seconds or five years. The claim is that the *activity of weighing* is morally inappropriate in the context of deep personal commitment.
  2.  **It attacks the framework:** It posits that Utilitarianism/EA is not just practically difficult, but conceptually incoherent regarding personal identity. It argues that by making everything calculable, EA destroys the "ground projects" that make life meaningful.
  3.  **It unifies the cases:** It treats the burning building not as an emergency exception, but as a *revealing case* of a general truth. The fire just makes the calculation visible; the moral error exists even in calm EA planning.

  ### The Catch (Where Your Tutor Might Be Wrong)

  While the **Normative/Constitutive** reading is the only one that *can* support both claims, it is also the most vulnerable to counter-attack.

  *   **Against the Building Case:** It is defensible to say love precludes calculation.
  *   **Against the EA Case:** It is much harder to defend. EA does not necessarily demand you sacrifice your child; it often asks you to sacrifice *luxury* or *career prestige*. If your tutor uses "one thought too many" to dismiss *any* cost-benefit analysis regarding charitable giving, they are arguably overstating the Constitutive Thesis. Most people can love their children *and* calculate which charity saves the most lives without suffering metaphysical alienation.

  **Summary:** Your tutor is likely sliding from the **Pragmatic** intuition (which is undeniable in the fire) to the **Normative** conclusion (which is required to critique EA). They are banking on the emotional force of the burning building to smuggle in the controversial claim that *all* utilitarian calculation is a corruption of character. You are correct: they are not the same claim. The first is about speed; the second is about integrity.
