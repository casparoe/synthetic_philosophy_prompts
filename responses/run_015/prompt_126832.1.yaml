answer: |-
  # HANDOUT: The Logical Space of Accuracy-First Epistemology

  **Root Commitment:** The epistemic standing of a doxastic state is determined by its accuracy (closeness to the truth), and epistemic norms are derived from the goal of maximizing this value.

  **1. DOMAIN: What attitudes are we evaluating?**
  *Case:* A student has a precise credence of 0.7 in Rain, a vague "high confidence" in Sun, and outright Belief in Clouds.
  *   **1a. Precise Credences Only.** (Go to 2)
  *   **1b. Expanded Domain.** (Includes full belief, comparative confidence, or imprecise/mushy credences). (Go to 2b)

  **2. AGGREGATION: How is total inaccuracy calculated?**
  *Case:* A 3-cell partition {A, B, C}. A is true. You assign 0.7 to A, 0.2 to B, 0.1 to C.
  *   **2a. Additive.** Total inaccuracy is the sum of scores for each proposition individually. (Go to 3)
  *   **2b. Holistic.** Total inaccuracy is a function of the whole profile (e.g., distance from the truth vector). (Go to 3b)

  **3. LOCALITY: What determines the score for a single proposition?**
  *Case:* You assign 0.7 to A. A is true. Does your score depend on what you assigned to B?
  *   **3a. Local.** Score depends *only* on the credence assigned to the true proposition (0.7). (Go to 4)
  *   **3b. Global/Context.** Score depends on the distribution across the whole partition (e.g., penalty for spreading mass). (Go to 4b)

  **4. PROPRIETY: What constraint is placed on the scoring rule?**
  *Case:* A coin of unknown bias. You must report a credence in Heads.
  *   **4a. Strictly Proper.** You uniquely maximize expected score by reporting your true credence. (Go to 5)
  *   **4b. Weakly Proper / Truth-Directed.** You do better reporting truthfully, but not necessarily uniquely, or only require truth-directedness. (Go to 5b)

  **5. DECISION PRINCIPLE: How do we move from value to norm?**
  *Case:* Credence function $C_1$ is more accurate than $C_2$ in world $w_1$, but less accurate in $w_2$.
  *   **5a. State-wise Dominance.** $C_1$ is required if it is never less accurate than $C_2$ and sometimes more. (Go to 6)
  *   **5b. Expected Accuracy.** $C_1$ is required if it maximizes expected accuracy relative to a prior/probability. (Go to 6b)

  **6. DIACHRONIC SCOPE: Does the framework govern updating?**
  *Case:* You learn evidence $E$ between Tuesday and Wednesday.
  *   **6a. Yes.** Norms constrain how Tuesday's state relates to Wednesday's. (Go to 7)
  *   **6b. No.** Framework is purely synchronic (evaluates states at a time). (→ **Leaf L1**)

  **7. UPDATING RULE: What is the required revision method?**
  *Case:* You had 0.5 in $H$, learn $E$ (where $P(E|H)=1$).
  *   **7a. Conditionalization.** You must shift to $P(H|E)$. (Go to 8)
  *   **7b. Alternative.** (e.g., Jeffrey Conditionalization, Minimax, or no specific rule). (→ **Leaf L2**)

  **8. VALUE MONISM: Is accuracy the sole epistemic value?**
  *Case:* A simpler credence function is slightly less accurate but much more informative.
  *   **8a. Yes.** Accuracy is the only fundamental epistemic good. (Go to 9)
  *   **8b. No.** Accuracy is weighed against simplicity, caution, or informativeness. (→ **Leaf L3**)

  **9. CHANCE NORM: Must credences align with objective chance?**
  *Case:* You know the coin's objective chance of Heads is 0.6.
  *   **9a. Yes.** (e.g., Principal Principle). Credence must match chance. (Go to 10)
  *   **9b. No.** Accuracy is defined by truth, not chance. (→ **Leaf L4**)

  **10. UNIQUENESS: Does evidence mandate a single function?**
  *Case:* Two agents have the same evidence.
  *   **10a. Yes.** Only one credence function is permitted (Uniqueness). (→ **Leaf L5**)
  *   **10b. No.** Multiple functions are permitted (Permissivism). (→ **Leaf L6**)

  **(Branch 1b: Expanded Domain)**
  **2b. REPRESENTATION: How are non-precise attitudes scored?**
  *Case:* You have a set of credences $[0.4, 0.6]$ in Rain.
  *   **2b-i. Reductionist.** Score the set by its best/worst/average member. (→ **Leaf L7**)
  *   **2b-ii. Sui Generis.** Accuracy is defined directly on sets/beliefs (e.g., truth-likeness). (→ **Leaf L8**)

  **(Branch 2b: Holistic)**
  **3b. PARTITION INVARIANCE: Must scores survive refinement?**
  *Case:* Partition {Rain, No Rain} vs. {Rain, Dry-Sun, Wet-Sun}.
  *   **3b-i. Yes.** Inaccuracy verdicts shouldn't change by adding irrelevant cells. (→ **Leaf L9**)
  *   **3b-ii. No.** Inaccuracy is relative to the chosen algebra. (→ **Leaf L10**)

  **(Branch 4b/5b: Weak Propriety/Dominance)**
  **5b. NORMATIVE FORCE: What is the status of the norm?**
  *   **5b-i. Categorical.** Violations are irrational. (→ **Leaf L11**)
  *   **5b-ii. Gradational.** Violations are just less ideal. (→ **Leaf L12**)

  ---
  *End of Handout*
  ---

  # INSTRUCTOR NOTES & AUDIT

  ### I. Leaf Result Tags
  *Key: **P**=Probabilism, **C**=Conditionalization, **PP**=Principal Principle, **U**=Uniqueness.*

  *   **L1 (Synchronic/Strict/Dominance):** [P, U]. Vindicates Probabilism via dominance (Joyce 1998). Uniqueness depends on strict propriety.
  *   **L2 (Alternative Updating):** [P]. Vindicates Probabilism, but fails **C**. (e.g., Greaves & Wallace 2006 show Exp. Acc. $\to$ Cond; rejecting Cond usually requires rejecting Exp. Acc).
  *   **L3 (Value Pluralism):** [ ]. Accuracy is traded off. **P** and **C** may be violated for simplicity/caution (e.g., Risk-Weighted Accuracy).
  *   **L4 (No Chance Norm):** [P, C, U]. Standard Accuracy-First (e.g., Joyce). **PP** is not vindicated internally; must be added externally.
  *   **L5 (Uniqueness):** [P, C, PP, U]. The "Strong" Accuracy-First view (e.g., Pettigrew). Requires Strict Propriety + Exp. Accuracy.
  *   **L6 (Permissivism):** [P, C]. Accuracy-First Permissivism. Hard to vindicate **U**. Requires weak propriety or multiple priors.
  *   **L7 (Reductionist Imprecise):** [ ]. Vindicates Imprecise Probabilism. **P** modified to sets. **C** controversial.
  *   **L8 (Sui Generis):** [ ]. Belief-First or Truthlikeness. **P** rejected. **C** rejected.
  *   **L9 (Partition Invariant):** [ ]. Holistic views claiming invariance (rare). **P** often fails if algebra varies.
  *   **L10 (Partition Sensitive):** [P]. Standard Additive views. **P** holds relative to algebra.
  *   **L11 (Weak Norms):** [ ]. "Calibration" views. **P** not strictly vindicated.
  *   **L12 (Gradational):** [ ]. No sharp norm. **P** is a matter of degree.

  ### II. Unoccupied / Unstable Combinations
  1.  **Additive + Strictly Proper + Expected Accuracy + Reject Conditionalization (Leaf L2 variant).**
      *   *Why Unoccupied:* Theorem (Greaves & Wallace 2006): If you maximize expected accuracy using a strictly proper rule, Conditionalization is the unique updating strategy. Occupying this cell requires rejecting a formal theorem or changing the definition of "expected accuracy."
  2.  **Accuracy Monism + Permissivism + Strict Propriety (Leaf L6 variant).**
      *   *Why Unoccupied:* If accuracy is the *only* value (Monism) and the scoring rule is *Strictly* Proper, there is a unique accuracy-maximizer for any given world. Permissivism requires either multiple maximizers (impossible with strict propriety) or multiple epistemic values (violates Monism).

  ### III. Audit: Measure and Partition Sensitivity
  *Flagged Nodes where formalism dictates philosophy.*

  *   **Node 3 (Locality) & Node 4 (Propriety):**
      *   *Sensitivity:* The choice between **Quadratic (Brier)** and **Logarithmic** scoring rules.
      *   *Audit:* Logarithmic rules assign $-\infty$ inaccuracy to credence 0 in a truth. Brier does not. Dominance arguments for Probabilism (Node 5a) often fail with Log scores if agents assign 0 credence to possibilities.
      *   *Verdict Survival:* **P** survives both. **C** survives both. **PP** is sensitive (Log rules handle chance better in some limit cases). **U** is threatened by Log rules if priors can be 0.
  *   **Node 2 (Aggregation) & Node 3b (Partition Invariance):**
      *   *Sensitivity:* Additive measures depend on the **Algebra/Partition**. Refining the partition (splitting "No Rain" into "Dry Sun" and "Wet Sun") changes the total Brier score.
      *   *Audit:* Most Accuracy-First arguments (Joyce, Pettigrew) assume a fixed algebra. If the algebra is not fixed, **P** (Probabilism) becomes partition-relative.
      *   *Verdict Survival:* **P** survives only relative to an algebra. **C** survives. **U** is threatened if different algebras permit different functions.
  *   **Node 5 (Decision Principle):**
      *   *Sensitivity:* **Dominance** vs. **Expected Accuracy**.
      *   *Audit:* Dominance arguments (Joyce 1998) do not require a prior over worlds. Expected Accuracy arguments (Pettigrew 2016) do.
      *   *Verdict Survival:* **P** survives both. **C** requires Expected Accuracy (Dominance alone is insufficient for diachronic norms). **PP** requires Expected Accuracy.

  ### IV. Indistinguishable Positions
  *   **Leaf L1 (Dominance) vs. Leaf L5 (Exp. Acc + Uniqueness):**
      *   *Issue:* Both typically vindicate Probabilism and Uniqueness. The tree separates them by *argument* (Dominance vs. Exp. Acc), but the *outcome* is often identical.
      *   *Mark:* The distinction is load-bearing for *justification* (avoiding priors) but not for *verdict* (Probabilism).
  *   **Leaf L3 (Pluralism) vs. Leaf L6 (Permissivism):**
      *   *Issue:* Both allow deviation from the unique accuracy-maximizer.
      *   *Mark:* Pluralism says "Accuracy isn't the only goal." Permissivism says "Accuracy allows multiple options." The tree forces a split, but the practical permissiveness is the same.

  ### V. Formal Confidence Flags
  *   **Node 4 (Propriety):** *Flag.* The claim that "Strict Propriety is required for Probabilism" relies on theorems (e.g., Savage 1971, Predd et al. 2009). If the domain of scoring rules is restricted (e.g., to differentiable functions), this holds. If non-differentiable rules are allowed, non-probabilistic states might not be dominated.
  *   **Node 7 (Conditionalization):** *Flag.* The derivation of Conditionalization from Expected Accuracy assumes the agent is certain they will update on a partition. If "uncertain updating" is allowed, the result shifts to Jeffrey Conditionalization. The tree simplifies this to "Conditionalization."
