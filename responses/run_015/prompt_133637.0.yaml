      *   *Content:* 12 students. Divide into 3 groups of 4 (Committees). Resource allocation scenario (e.g., disaster relief funds). Hidden "Context Cards" given to each committee that subtly skew their priorities (e.g., "Your community values efficiency over equity" vs. "Your community values historical redress").
      *   *Incentive:* "Epistemic Authority Points." The committee with the most "unbiased" plan gets a symbolic privilege (e.g., choosing the next seminar topic or public recognition of "Logical Consistency").
      *   *Rules:* No sharing Context Cards initially. Rank priorities. Then audit another committee's plan.
