  1. Setup, roles, and rules
  Divide the twelve students into three Committees of four (Alpha, Beta, Gamma). Distribute sealed "Context Envelopes" to each committee. Inside is a hidden framing condition (e.g., Alpha: "Prioritize aggregate welfare"; Beta: "Prioritize historical equity"; Gamma: "Prioritize individual liberty"). These are not to be shared. Provide a resource scenario: distributing ten million dollars across three conflicting social programs (e.g., infrastructure, reparations, tax cuts). Each committee must produce a ranked allocation list.

  Introduce the incentive: "Procedural Legitimacy Tokens." The committee deemed most "objectively unbiased" by peers receives the token, granting them the right to set the reading list for the next seminar. This status reward triggers competitive scrutiny and ensures they take the audit seriously.

  Rules:
  1. Do not reveal your Context Envelope content during Phase 1.
  2. In Phase 2, swap allocation plans. You will receive an "Audit Rubric." Use it to score the other committee's bias.
  3. The Rubric defines what counts as "neutral" versus "biased."
  4. No discussion between committees until the Reveal.

  The critical mechanic: The Audit Rubric given to Alpha to judge Beta is generated from Alpha's own Context Envelope. Alpha judges Beta using Alpha's own hidden framing conditions, treating them as universal standards of neutrality. This ensures that when they penalize Beta for deviating from the Rubric, they are penalizing Beta for not sharing Alpha's hidden bias. The Rubric appears objective but is actually parochial.

  2. Timeline and hidden framing mechanism
  0:00–0:05: Introduction and Committee assignment. Distribute Context Envelopes. Emphasize secrecy.
  0:05–0:20: First-Order Deliberation. Committees rank the allocation priorities based on their hidden context. They must write a brief justification.
  0:20–0:40: Second-Order Audit. Committees swap plans. Alpha receives Beta's plan plus an Audit Rubric. Crucially, Alpha's Rubric reflects Alpha's hidden Context, not Beta's. They score Beta's "deviations" from neutrality.
  0:40–0:55: The Reveal. Collect audits. Project the Context Envelopes and the Audit Rubrics side-by-side. Show that the criteria used to condemn Beta's "bias" are identical to Alpha's own hidden framing conditions.
  0:55–1:15: Guided Debrief.

  The hidden mechanism relies on the identity between the constitutive framing (Context) and the evaluative standard (Rubric). Students experience their own framing as "reason" during deliberation, then experience that same framing as "objective standard" during audit. The shock comes when these are shown to be the same variable.

  3. The debrief: mapping moments onto the preference-bias problem
  Begin by asking students to describe their experience during the Audit phase. Most will report feeling confident they were identifying objective errors. Map this to "Second-Order Audit Preference." They believed they were applying neutral standards to correct first-order distortions. They felt they were occupying a higher ground of evaluation, distinct from the mere preferences they exhibited in Phase 1.

  Then, point to the Reveal. The standard they used to judge others was structurally identical to the hidden condition that shaped their own judgment. This collapses the distinction. Their "audit preference" was merely their "first-order preference" reflexively applied. The ground they stood on was the same ground they criticized others for standing on.

  Ask: "When did your framing condition stop being a preference and start being a standard?" They cannot answer, because the switch happened invisibly. This induces the reflexive instability you seek. They treated shared framing (if they had known) as legitimate, but identical framing in others as bias.

  Conclude this section by highlighting the lack of a stable criterion. They cannot justify why their context counts as "reason" while the other's counts as "bias" once the structural identity is exposed. The discomfort is the lesson. The distinction between moral preference and moral bias is not found in the content, but in the ownership of the framing. You want them to feel that their audit was not a correction of bias, but an assertion of preference disguised as procedure.

  4. Predictable failures and facilitation fixes
  Failure 1: Suspicion of Manipulation. Students may guess the rubric matches their context early.
  Fix: If asked, deny nothing but defer. "Check the data at the end." Maintain the procedural frame.

  Failure 2: Politeness in Auditing. Students may hesitate to label peers "biased."
  Fix: Frame the audit as a technical compliance check, not a moral accusation. The incentive (reading list) requires strict scoring.

  Failure 3: The Reveal feels like a trick.
  Fix: Immediately pivot to the philosophical implication. "The trick is not in the room; it is in the structure of justification itself."

  Failure 4: Dominant voices skewing committee output.
  Fix: Assign rotating roles (Scribe, Challenger, Speaker) within the 15-minute deliberation to ensure the hidden context influences the whole group, not just one leader.

  5. What the activity cannot reproduce
  This activity simulates the structure of the problem but cannot reproduce the lived opacity of real-world justification. In the seminar, students know a reveal is coming; in reality, there is no "Reveal Phase" where we learn our standards are contaminated. The activity creates a closed loop they can see from the outside.

  Specifically, it cannot reproduce the circularity of calibrating one's audit standards against the very preferences being audited. In the game, the instructor supplies the rubric. In reality, you must generate the rubric from within your own framework. You must supply the closing remark: there is no external vantage point to resolve this. The circularity is not a bug to be fixed, but the condition of moral judgment itself. The activity ends where the philosophy begins.
