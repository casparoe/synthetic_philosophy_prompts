          1.  Distribution of Context Cards (Hidden Framing) - 5 mins.
          2.  First-Order Ranking (Internal Deliberation) - 15 mins.
          3.  Second-Order Audit (Cross-Committee Judgment) - 20 mins.
          4.  The Reveal (Comparing Audit Criteria to Context Cards) - 15 mins.
          5.  Debrief/Discussion - 20 mins.
      *   *Mechanism:* Committee A gets Card X. They audit Committee B. The audit rubric provided to A is actually derived from Card X. So A judges B based on X, while A's own plan was built on X. When revealed, A sees they treated X as "neutral standards" for B but "necessary conditions" for themselves.

