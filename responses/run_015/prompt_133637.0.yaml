      *   The activity needs to simulate this by giving students hidden framing conditions that influence their initial choices, then having them judge others based on criteria that unknowingly reflect those same conditions.
      *   The "reveal" must show that the criteria used to audit others are the same as the hidden conditions that guided the auditor.

