answer: |-
  Here is the translation of the economic methodology dispute into machine-learning and causal-inference vocabulary, followed by the residue report and the revised checklist.

  ### Part 1: Case Translations

  **Case 1: The "As-If" Profit Maximization (Friedman's Instrumentalism)**
  *   **Economic Claim:** Firms do not actually solve $\max \pi$, but modeling them as if they do yields accurate predictions of tax incidence.
  *   **ML Translation:** This is an **Architectural Prior** functioning as an **Inductive Bias**. You are constraining the hypothesis class to a specific manifold (optimization-based behavior) rather than using a universal approximator (e.g., a raw neural net).
  *   **Mechanism:** The "false" assumption reduces **Model Capacity** to prevent overfitting to noise in the **Training Distribution**. Even if the internal state (the gradient steps the firm *actually* takes) does not match the model's internal state (the theoretical optimum), the input-output mapping generalizes better to the **Deployment Distribution** (post-tax regime).
  *   **Risk:** This is **Model Misspecification**. If the inductive bias is too strong (high bias), you underfit the true **Data-Generating Process (DGP)**. Friedman's claim is that the variance reduction from the constraint outweighs the bias error, provided the constraint captures an **Invariant Mechanism** (e.g., selection pressure eliminates non-profit-maximizing firms) rather than a **Spurious Correlation**.
  *   **Verdict:** "Realism of assumptions" translates to "Alignment of inductive bias with the causal structure of the DGP."

  **Case 2: Removable Idealizations (Frictionless Planes)**
  *   **Economic Claim:** Friction does not exist, but we can add it back later without breaking the model.
  *   **ML Translation:** This is **Regularization** via **Dimensionality Reduction**. You are training on a simplified manifold because the full state space is data-starved or computationally intractable.
  *   **Mechanism:** The falsehood is "harmless" if the model exhibits **Perturbation Stability**. If you add the omitted factor (friction) as a noise term or a correction layer during **Sim-to-Real Transfer**, the **Deployment Risk** should not spike.
  *   **Risk:** If the system is chaotic or highly non-linear, the idealization creates a **Distribution Shift** that is not correctable by a simple residual term. The assumption is "de-idealizable" only if the error term is orthogonal to the target variable under the intended **Intervention**.
  *   **Verdict:** "Harmless falsehood" translates to "Robustness to domain randomization on the omitted parameter."

  **Case 3: The Lucas Critique (Policy Breakage)**
  *   **Economic Claim:** A model fitted on historical data fails when the policy changes because agents change their behavior.
  *   **ML Translation:** This is **Covariate Shift** induced by **Intervention**, leading to **Concept Shift**. The model learned a conditional $P(Y|X)$ that is stable under the observational **Training Distribution** but unstable under the **Deployment Distribution** created by the policy $do(X)$.
  *   **Mechanism:** The model engaged in **Shortcut Learning**. It fitted **Spurious Correlations** (e.g., route choice correlated with current tolls) rather than the **Invariant Mechanism** (e.g., route choice determined by latent value-of-time). Because the model is not a **Structural Causal Model**, it cannot simulate the **Counterfactual** regime.
  *   **Risk:** **Identifiability** failure. You cannot recover the causal parameters from observational data alone if the agents' policy $\pi(a|s)$ adapts to the environment.
  *   **Verdict:** "Predictive success" on historical data is **Reduced-Form Fitting**; failure under policy is a failure of **Interventional Robustness**.

  ***

  ### Part 2: The Residue Report

  Here is the analysis of what survives the translation, addressing your three suspicions.

  **Suspicion 1: Counterfactuals vs. Held-Out Sets**
  *   **The Issue:** In ML, we validate on held-out labels from the same distribution. In policy, we validate on counterfactuals ($do(Toll=High)$) that have no labels. Friedman's "prediction works" is unfalsifiable until implementation.
  *   **Residue Analysis:** This is a **Real Gap** in the standard ML vocabulary.
      *   Standard ML assumes exchangeability between train and test sets. Policy evaluation explicitly breaks exchangeability.
      *   Friedman's instrumentalism claims low empirical risk on the *observational* distribution justifies confidence in the *interventional* distribution. In ML terms, this is a claim that **Observational Risk** bounds **Causal Risk**.
      *   This is mathematically false without additional assumptions (e.g., causal sufficiency, invariance). Therefore, Friedman's argument relies on a hidden premise: that the **Inductive Bias** is so strong it forces the model to learn the causal mechanism despite lacking interventional data.
      *   **Verdict:** The dispute is substantive. "Predictive success" in economics is doing work that "Test Loss" cannot do. It is a claim about **Structural Validity** masquerading as a claim about **Empirical Risk**.

  **Suspicion 2: De-idealizable vs. Wrong $\rightarrow$ Invariance**
  *   **The Issue:** Can we replace "realism" with "invariance under intervention"?
  *   **Residue Analysis:** This translates cleanly; it is a **Different Task** framing, not a gap.
      *   A "de-idealizable" assumption is one where the model's predictions are **Invariant** to the addition of the omitted factor. A "wrong" assumption is one where the prediction is **Sensitive** to the intervention.
      *   In ML, we call this **Invariant Risk Minimization (IRM)**. You want features (assumptions) that are stable across environments (policy regimes).
      *   "Realism" is a property of the model's internal state compared to the world. "Invariance" is a property of the model's output compared to the intervention.
      *   **Verdict:** The philosophical dispute dissolves here. You do not need "realism." You need **Interventional Stability**. If an assumption is false but the model is invariant to that falsity under the specific policy lever you are pulling, the assumption is valid *for that task*.

  **Suspicion 3: Existence Proofs ("Could Arise")**
  *   **The Issue:** Economists use models to show a macro-pattern *could* arise from micro-preferences (sufficiency), not that it *did*. ML models aim to minimize error on actual data.
  *   **Residue Analysis:** This is a **Different Task** objective.
      *   Your ML vocabulary is optimized for **Discriminative Modeling** (predict $Y$ given $X$) or **Density Estimation** (match $P(X)$).
      *   The "existence proof" use-case is **Generative Sufficiency**. The goal is not to minimize $L(Y, \hat{Y})$, but to verify that the **Support** of the generative model overlaps with the observed macro-pattern.
      *   There is no standard loss function for "plausibility." This is closer to **Simulation-Based Inference** or **Approximate Bayesian Computation**, where you reject parameters that don't generate the phenomenon, rather than fitting parameters to minimize distance.
      *   **Verdict:** The ML vocabulary is aimed at prediction/control, not mechanism exploration. The gap is in the **Objective Function**, not the logic. You can express this in ML terms (support coverage, likelihood-free inference), but standard training loops do not optimize for it.

  ***

  ### Part 3: The Revised Checklist

  Do not ask "Are the assumptions realistic?" Ask these three questions instead:

  1.  **"What specific interventions break the invariance of the learned mechanism?"**
      *   *Why:* To distinguish between **Inductive Biases** that capture stable causal structure and those that merely fit **Spurious Correlations** in the training regime.

  2.  **"Has the model been stress-tested against synthetic distribution shifts matching the proposed policy magnitude?"**
      *   *Why:* To evaluate **Sim-to-Real Transfer** robustness and ensure the "false" assumptions are **De-idealizable** (perturbation stable) rather than brittle.

  3.  **"Does the model rely on unobserved confounders that would be manipulated by the policy itself?"**
      *   *Why:* To detect **Lucas Critique** failures where the **Deployment Distribution** invalidates the **Identifiability** conditions assumed during training.
