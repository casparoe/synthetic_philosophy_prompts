answer: |-
  **What each passage is claiming**
  First, Montaigne argues that "barbarism" is merely a label for unfamiliar customs. We judge truth based on our own society's habits, so nothing is inherently savage unless it differs from our norm. Second, he compares specific acts: eating the dead is less barbarous than torturing the living, which Europeans do under religious pretenses. He admits we might call them barbarous relative to "reason's rules," but claims Europeans exceed them in barbarism. Third, regarding their poetry, he asserts it lacks barbarism entirely, judging it by Greek standards (Anacreon) and noting their language sounds pleasant and Greek-like. Here, he uses classical aesthetics as a benchmark for quality, implying some cultural products are objectively better or more refined than others.

  **Is it actually a contradiction**
  It is not a logical contradiction, but it is a shift in standards. In the first passage, Montaigne attacks *customary* prejudice—the idea that unfamiliar equals wrong. He dismantles the ethnocentric lens. In the later passages, having cleared away mere prejudice, he introduces a universal standard: "reason" or "nature." He isn't saying all customs are equal; he's saying some acts violate human nature more than others. Torturing living prisoners violates reason more than eating dead ones. Similarly, beauty in poetry might be universally recognizable (hence the Greek comparison). So, he rejects local custom as a judge, but accepts human reason and natural law as judges. The consistency lies in rejecting European arrogance, not in refusing all judgment.

  **The best way to make it hang together**
  The tension resolves if you view the essay as a mirror for Europe rather than an anthropological study. Montaigne's goal isn't to defend cannibalism absolutely, but to humble his French readers. Step one: He uses relativism to stop you from dismissing the cannibals immediately ("wait, isn't our torture worse?"). Step two: Once you admit they aren't monsters, he uses "reason" to show they are often *more* civilized than Europeans by natural standards. The Greek poetry comparison isn't imposing foreign rules; it's recognizing universal human excellence that Europeans claim to own but often lack. He isn't building a system where "everything is relative." He is using skepticism to strip away false superiority. The cannibals live closer to "nature's laws," which is his true yardstick. So, custom is relative, but nature is constant. The essay moves from criticizing cultural bias to affirming natural virtue, using the cannibals to shame European corruption. He isn't saying cannibalism is good; he's saying European treachery is worse. The Greek comparison shows that "barbarians" can achieve what Europeans claim is their exclusive heritage. This isn't contradictory; it's strategic. He lowers the barrier of entry (relativism) to let the cannibals into the conversation, then raises the standard (reason/nature) to show Europeans failing it. The essay is a rhetorical device to critique civilisation, not a treaty on ethics.

  **Where you'd correct my framing**
  You're assuming "barbarous" must have a single definition throughout. For Montaigne, it's a moving target: first it means "unfamiliar," then "against reason." Also, you're reading him as a systematic philosopher trying to be consistent. He's an essayist exploring thoughts as they come. He expects "barbarism" to carry different weights in different contexts. Finally, don't mistake his praise of the cannibals for absolute endorsement. He's using them as a tool to critique home. The inconsistency you feel is likely the friction of his skepticism at work, testing different angles on the same problem.
