  3. Regarding epistemology, while perceptual learning improves detection, allowing current beliefs to alter content destroys the independence required for perception to arbitrate between competing theories about the world.
  4. I predict that if you measure early visual cortex activity during the discrimination task, you will find no difference in neural tuning between the two groups despite their divergent reports.
  5. Can you specify whether the reported categorical look persists when the subjects are under high cognitive load that prevents them from accessing their beliefs about the categories?
