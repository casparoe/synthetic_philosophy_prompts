answer: |-
  You aren't stuck because of words. You're stuck because you and your uncle are valuing two completely different political currencies. He's trading in **efficiency and logic**. You're trading in **stability and psychology**.

  Here is the straight talk on what's actually happening in this argument.

  ### 1. You're defining "Useful" differently
  Your uncle is using an engineering definition of useful: *Does this part move the machine?* If the monarch doesn't sign the laws (in reality) or command the army, the part is decorative. He sees the government as a business, and the King is a logo on the building. Logos don't sell products; salespeople do.

  You are using an ecological definition of useful: *Does this part keep the ecosystem from collapsing?* You're arguing that the monarch is a keystone species. They don't hunt or gather, but if you remove them, the whole structure changes. You see the government as a tribe, and the King is the elder who reminds everyone they belong to the same family, even when they hate each other's policies.

  Neither of you is wrong, but you can't agree because you aren't measuring the same thing.

  ### 2. The "Deep Thing": The Head of State vs. Head of Government
  There is a genuine political science reason for what you're describing, often called the "Bagehot distinction" (though you don't need to know the name).

  In a republic (like the US or France), the President is both the **Head of Government** (runs the country) and the **Head of State** (symbolizes the country). When people hate the President's policies, they hate the symbol of the nation. The nation itself becomes partisan.

  In a constitutional monarchy, those jobs are split.
  *   **The Prime Minister** is the Head of Government. They take the heat. They get fired. They are the punching bag.
  *   **The Monarch** is the Head of State. They represent the continuity of the nation itself.

  **Your "Silent Brake" theory is real.** It's not that the King stops a law; it's that the existence of a non-elected figure reminds politicians that they are temporary tenants, not owners. They can't rewrite the entire constitution just because they won an election, because there is a symbol of permanence sitting right there.

  ### 3. Why a Court or President can't replace the Crown
  This is your uncle's strongest point, and where you need to be careful. He asks: *"Why not a court?"*

  *   **Courts are legalistic.** They deal in rules, not loyalty. You don't hug a judge. You don't feel pride in a supreme court. They are cold.
  *   **Elected Presidents are political.** Even non-executive presidents (like in Germany or Ireland) were elected. That means someone voted against them. They represent a coalition or a party, even if they try to be neutral.

  **The Monarch's unique superpower is accident of birth.**
  Because they didn't campaign, they didn't make promises. They didn't ask for the job. This makes them the only person in the country who is theoretically 100% neutral. They are a living symbol of the past and the future, untouched by the messy politics of the present. That is hard to replicate with a human being who had to shake hands and kiss babies to get their job.

  ### 4. Is it just gut feeling?
  Partly. But it's a calculated gut feeling.
  *   **Your Uncle's Gut:** "I don't want to pay for a rich family to wave at me. It's undemocratic." This is a moral stance on equality.
  *   **Your Gut:** "I want a safety valve. If things get really bad, I want a figure who stands above the fray to hold the nation together." This is a pragmatic stance on risk management.

  ### 5. Can you move each other?
  Probably not, and here is why: **You are arguing about risk tolerance.**

  Your uncle believes democracy is strong enough to stand on its own without a royal crutch. He thinks the "cost" (money and inequality) outweighs the "benefit" (soft power and tradition).

  You believe democracy is fragile. You think the "insurance premium" (taxes for the royal family) is worth paying to ensure there is a neutral arbiter and a unifying symbol if the political system ever fractures.

  **The Verdict:**
  You won't convince him with facts, because there are no facts that prove "national unity" is worth £100 million a year. That is a value judgment.
  *   If he values **equality and efficiency** above all, he will always see the monarchy as a useless decoration.
  *   If you value **continuity and stability** above all, you will always see the monarchy as a vital anchor.

  **How to stop the circle:**
  Admit that he's right on the *mechanics* (they don't govern), but stand firm on the *psychology* (they stabilize). Tell him: *"You're right, they don't run the country. But they own the house. Having a landlord who doesn't kick you out when a new tenant arrives keeps the tenants from burning the place down."*

  He might still think the rent is too high, but at least you'll both agree on what the building is for.
