      *   *Distinguish "Data" from "Signal".* Official stats might be hidden, but refugee flows are signals. If the state blocks refugees from leaving (e.g., USSR internal passports), that is epistemic suppression.
      *   *The "Willful Blindness" Defense.* Even if they didn't actively suppress, refusing to set up monitoring systems is an epistemic crime of omission.

