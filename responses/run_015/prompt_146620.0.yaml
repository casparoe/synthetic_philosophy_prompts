      *   *Serious:* State collapse/chaos. If there is no state to suppress data, is it still an "epistemic crime"? Or just a tragedy? This challenges the "crime" aspect.
      *   *Awkward/Absorbable:* Cases where officials tried but were blocked. This can be absorbed by broadening "suppression" to include "structural silencing" (bureaucratic inertia as a form of suppression).

