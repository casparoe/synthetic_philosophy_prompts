prompt: |-
  I'm a 4th-year PhD student, mostly formal epistemology with a bit of phil physics, and I've got something like two years of dissertation time left plus (fingers crossed) a first postdoc. I want to spend them on the problem of old evidence rather than on something safer, but I can't figure out which part of it is actually worth the years. The set-up I assume we agree on: you already know E, so P(E) = 1, so conditioning on E can't bump P(T) — and yet the perihelion of Mercury sure looked like it confirmed general relativity. Whatever the fix is, it has to be reachable by someone with probability theory, a bit of modal logic, and no real physics.

  Here's my own provisional map, which might definately be junk. I think there are three different ways evidence can be old, and I suspect they're different problems wearing the same label:

  (1) temporal oldness — you believed E before you ever had T;
  (2) construction oldness — E was among the things you were staring at when you built T, so the fit is no surprise (the accommodation vs prediction thing);
  (3) derivation oldness — you had T and you had E, and the only thing that's new is that someone worked out that T entails E.

  On top of that there's an axis I'm much less sure about: whether this is a problem for a logic of confirmation (some relation between T, E and background) or for a norm of updating for agents who aren't logically omniscient. Those feel like genuinely different projects, and I think people slide between them.

  What I actually want is an agenda, not a survey. Rank the open questions here for someone in my position — two years, formal toolkit, no physics — and defend the ranking: which questions are upstream of which, which are tractable with the tools I have, which are neglected relative to how much depends on them, and which are traps that look deep but whose answer wouldn't change anything downstream. If my three-way taxonomy is the wrong way to carve the space, say what the right carving is and why the carving changes the order.

  Two things I'd especially like weighed. First, my pet suspicion: that the puzzle is an artifact of reading P(E) = 1 as a credence you actually still have, when old evidence is really evidence you have a lossy memory of — so the right treatment might be a memory-or-recall model rather than a confirmation-theoretic one. Is that a research program or a dead end, and where does it sit in the ordering? Second, how much of the value here is internal to Bayesianism (patching a technical bug in a framework) versus exportable: the same structure shows up whenever a model is fitted to data and the same data is then cited back as evidence for it (double dipping, post-hoc theorizing in the replication-crisis literature), and whenever an analyst already has all the data on file and then comes up with a hypothesis that fits it. Should the export question drive the agenda, or is chasing applications a distraction from getting the core problem right?

  And tell me what would move things: what result, argument, or empirical finding in the next couple of years would move a question up or down your list.
reasoning: |-
  Here's a thinking process that leads to the suggested agenda:

  1.  **Analyze the User and Request:**
      *   **User Profile:** 4th-year PhD student (Formal Epistemology + Phil Physics), ~2 years dissertation + 1 postdoc.
      *   **Goal:** Tackle the Problem of Old Evidence (POE) rather than a "safer" topic. Needs a concrete *agenda*, not a survey.
      *   **Constraints/Tools:** Probability theory, modal logic, no real physics expertise.
      *   **Current Taxonomy:** Temporal oldness, Construction oldness, Derivation oldness.
      *   **Key Distinction:** Logic of confirmation vs. Norm of updating (logical omniscience).
      *   **Specific Questions:**
          1.  Rank open questions (upstream/downstream, tractability, neglect, traps).
          2.  Evaluate the "memory/recall model" hypothesis.
          3.  Evaluate the "internal vs. exportable value" question (Bayesian patch vs. general scientific methodology).
          4.  Identify "move-makers" (what results/arguments would shift the agenda).

  2.  **Deconstruct the Problem of Old Evidence (POE):**
      *   *Core Issue:* Standard Bayesian conditionalization ($P_{new}(T) = P_{old}(T|E)$) fails when $P_{old}(E) = 1$, because $P_{old}(T|E) = P_{old}(T)$. Yet, historically, old evidence (Mercury's perihelion) confirmed new theories (GR).
      *   *Standard Solutions:*
          *   Counterfactuals (Garber, Jeffrey): What if I *didn't* know E?
          *   Logical Omniscience Relaxation (Hintikka, etc.): Allow $P(T \to E) < 1$ even if $T \to E$ is true.
          *   Ur-Priors / Shifting Priors.
          *   Explanationism (T explains E).
      *   *User's Taxonomy:* Temporal, Construction, Derivation. This is actually quite good and aligns with literature (e.g., Maher, Christensen).
      *   *User's Distinction:* Confirmation Logic vs. Updating Norm. This is crucial. Is POE a bug in the *measure* of confirmation or a bug in the *model of the agent*?

  3.  **Evaluate the User's Taxonomy & Distinctions:**
      *   The three-way split is defensible but might obscure the *structural* issue.
      *   *Better Carving:* The distinction between **Logical Omniscience (LO)** and **Historical/Counterfactual** approaches is more fundamental than the three types of oldness.
      *   *Why?* Types (1) and (3) are usually solved by relaxing LO. Type (2) is often solved by counterfactuals or likelihood ratios involving "accommodation penalties."
      *   *Recommendation:* Keep the three types as *test cases*, but organize the research around the *mechanism* of solution (LO relaxation vs. Counterfactuals vs. Alternative Confirmation Measures).

  4.  **Develop the Agenda (Ranking Questions):**
      *   *Constraint:* 2 years + postdoc. Needs publishable chunks.
      *   *Constraint:* No physics. Must stay formal/philosophical.
      *   *Upstream Question:* Is POE a problem of *rationality* or *idealization*? (The LO question).
      *   *Tractable Question:* Formalizing the "Derivation Oldness" using logical probability fragments.
      *   *Neglected Question:* The link between POE and "Double Dipping" (User's export question).
      *   *Trap:* Trying to solve "Construction Oldness" without a theory of theory-generation (too psychological/sociological).

  5.  **Address the "Memory/Recall" Hypothesis:**
      *   *Idea:* $P(E)=1$ is wrong because memory is lossy. We re-observe E.
      *   *Critique:* This turns POE into a standard updating problem with uncertain evidence (Jeffrey Conditionalization).
      *   *Verdict:* Interesting, but likely a "dissolution" rather than a solution. It sidesteps the logical entailment issue. If $T \models E$ is the core, memory doesn't fix the $P(E)=1$ blockage in standard conditionalization unless we treat E as uncertain *evidence*, not background.
      *   *Placement:* High risk, high reward. Good for a paper, bad for a whole dissertation unless framed carefully as "The Epistemology of Retained Evidence."

  6.  **Address Internal vs. Exportable Value:**
      *   *Internal:* Fixing Bayesianism.
      *   *Exportable:* Machine learning (overfitting), Statistics (post-hoc analysis).
      *   *Verdict:* The export value is where the *impact* lies. Formal epistemology risks becoming scholastic if it only talks to itself. The "Double Dipping" connection is the strongest hook for a postdoc/future career.
      *   *Strategy:* Solve the formal core (Internal) but frame the motivation/application (Exportable).

  7.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Validate the user's position. POE is a classic for a reason, but dangerous.
      *   *Taxonomy Critique:* The 3-way split is okay, but the **LO vs. Counterfactual** split is more actionable for a formalist.
      *   *The Agenda (Ranked):*
          1.  **Logical Omniscience & Derivation Oldness (The Core).** Most tractable with logic/prob tools. Upstream.
          2.  **The Export Link (Double Dipping).** High value, neglected by pure Bayesians.
          3.  **Memory/Recall Model.** High risk. Treat as a specific mechanism for (1).
          4.  **Construction Oldness.** Trap. Too sociological.
      *   *Defending the Ranking:* Explain *why* LO is upstream. If agents aren't logically omniscient, POE largely vanishes for Derivation Oldness.
      *   *Memory Hypothesis:* It's a research program, but don't bet the dissertation on it alone. It reclassifies E as uncertain.
      *   *Internal vs. Export:* Let the export drive the *motivation*, but keep the *formalism* clean. Don't get bogged down in empirical psychology.
      *   *Move-Makers:* What would change the mind? (e.g., A proof that LO relaxation breaks Dutch Books, or a successful formal model of double-dipping).

  8.  **Refining the "Memory" Point:**
      *   If I remember E, do I have $P(E)=1$? If I recall it from memory, is it a new observation?
      *   If it's a new observation, $P(E) < 1$ at the moment of recall.
      *   This dissolves POE but changes the subject to "Epistemology of Memory."
      *   *Advice:* Don't claim this solves POE for GR. Einstein didn't "recall" Mercury's perihelion as uncertain data; he knew it as a fact. The problem is the *link* between T and E.
      *   *Correction:* The memory model works better for "I know the data, but I'm re-evaluating its reliability." That's not standard POE.
      *   *Verdict:* Label it "Promising Dissolution" but warn about historical fidelity.

  9.  **Refining the "Export" Point:**
      *   Statistics literature (Gelman, etc.) hates post-hoc fitting.
      *   Formal Epsitmeology has the tools to model *why* it's bad (or when it's okay).
      *   This is the "Postdoc Hook."

  10. **Final Polish:** Ensure tone is collegial, rigorous, and direct. Avoid fluff. Focus on *strategy*. (Self-Correction: Make sure to explicitly answer the "what would move things" prompt).

  11. **Final Review against constraints:**
      *   2 years + postdoc? Yes, agenda fits.
      *   Formal tools? Yes, focuses on LO and probability.
      *   No physics? Yes, avoids GR details, focuses on structure.
      *   Taxonomy critique? Included.
      *   Memory hypothesis? Evaluated.
      *   Export value? Evaluated.

  12. **Constructing the Output.** (Proceed to generate response based on these thoughts).
answer: |-
  This is a sharp diagnosis. You are right to worry that "Old Evidence" is often a bucket containing three distinct structural problems, and you are right that the "Logical Omniscience (LO) vs. Updating Norm" distinction is the fault line where most projects crack.

  Given your constraints (2 years + postdoc, formal toolkit, no physics), you cannot solve the *historical* problem of GR. You must solve the *structural* problem that GR exemplifies.

  Here is the agenda, ranked by tractability and leverage, followed by an evaluation of your specific hypotheses.

  ### I. The Re-Carving: Drop the Taxonomy, Keep the Mechanism

  Your three-way taxonomy (Temporal, Construction, Derivation) is descriptively accurate but **strategically weak** for a formalist. It organizes by *narrative* rather than *mathematical obstruction*.

  **The Better Carving:**
  1.  **The Entailment Block:** $T \models E$ is true, but the agent doesn't know it yet (Derivation Oldness). This is a **Logical Omniscience** problem.
  2.  **The Selection Effect:** $T$ was chosen *because* it fits $E$ (Construction Oldness). This is a **Likelihood/Model Selection** problem.
  3.  **The Background Shift:** $E$ was background, now it is evidence (Temporal Oldness). This is often a **Partition/Representation** problem.

  **Why this changes the order:**
  *   **Derivation (Entailment)** is the only one solvable with your specific toolkit (prob + modal logic) without drifting into psychology or sociology.
  *   **Construction (Selection)** bleeds into statistics and philosophy of science methodology (your "export" point).
  *   **Temporal** is often a red herring; if you solve Derivation, Temporal usually collapses.

  ### II. The Ranked Agenda

  Here is the order of operations for the next 3 years.

  #### 1. Upstream Priority: Formalizing Non-Omniscient Conditionalization
  *   **The Question:** Can we define a coherent updating rule for agents who learn logical relations ($T \models E$) rather than empirical facts ($E$)?
  *   **Why First:** This is the upstream bottleneck. If you cannot model an agent learning an entailment without violating probability axioms (or Dutch Books), nothing else matters. Most solutions (Garber-style) rely on counterfactuals that are notoriously difficult to formalize rigorously.
  *   **Tractability:** High. This is pure formal epistemology. You can use fragments of logical probability or impossible worlds semantics.
  *   **Neglect:** Moderate. Many have tried, but recent work on "logical learning" (e.g., by Leitgeb, Pettigrew, or in computer science) offers new tools to revisit this.
  *   **The Trap:** Do not try to solve *full* logical omniscience. Solve *local* logical learning. You only need to model the step from "I don't know $T \models E$" to "I know $T \models E$."
  *   **Deliverable:** A formal model where $P_{new}(T) > P_{old}(T)$ upon learning $T \models E$, even if $P(E)=1$, without violating coherence constraints appropriate for non-omniscient agents.

  #### 2. High-Value Export: The "Double Dipping" Formalization
  *   **The Question:** Under what formal conditions does "accommodation" (fitting $T$ to known $E$) provide less confirmation than "prediction" (fitting $T$ then finding $E$)?
  *   **Why Second:** This addresses your "Export" question. The statistics/ML community knows post-hoc fitting is dangerous ("double dipping"), but they lack a rigorous epistemic justification beyond risk of overfitting. Bayesian confirmation theory *should* explain why prediction is epistemically superior to accommodation, but standard theory says $P(E|T)$ is the same either way.
  *   **Tractability:** Medium. Requires modeling the *space of theories* available to the agent. If $T$ was selected from a set $\{T_1...T_n\}$ because it fit $E$, the likelihood of $E$ given the *selection process* is 1.
  *   **Neglect:** High. Formal epistemologists rarely talk to methodologists about replication crises.
  *   **Deliverable:** A proof that accommodation penalties arise naturally from modeling the *generation* of $T$, not just the evaluation of $T$. This bridges POE to current methodological crises.

  #### 3. The Memory/Recall Hypothesis (Your Pet Suspicion)
  *   **The Question:** Is $P(E)=1$ a false idealization of memory retention?
  *   **Evaluation:** This is a **Research Program**, but it is risky as a dissertation core.
  *   **The Argument:** If evidence is "old," it is stored in memory. Retrieval is fallible. Therefore, at the moment of theorizing, $P(E) < 1$ (or rather, the agent is conditioning on *seeming to recall* $E$, not $E$ itself).
  *   **The Problem:** This dissolves POE by denying the premise ($P(E)=1$). While elegant, it risks being historically inaccurate. Einstein did not treat the perihelion of Mercury as uncertain data he was recalling; he treated it as a fixed constraint.
  *   **Where it fits:** Use this as a **chapter** or a **side paper**, not the spine. It works well for "Temporal Oldness" (I learned $E$ in undergrad, now I use it) but fails for "Derivation Oldness" (I know $E$ perfectly, I just didn't know $T$ implied it).
  *   **Verdict:** Don't bet the dissertation on it. It's a "dissolution" strategy, which reviewers often view as dodging the bullet.

  #### 4. The Trap: Construction Oldness (Theory Generation)
  *   **The Question:** How exactly was $T$ constructed from $E$?
  *   **Why Last/Avoid:** This requires a model of creativity or theory generation. This is sociological or cognitive-psychological. As a formalist with no physics, you will drown in case studies.
  *   **Exception:** Unless you treat this purely structurally (see Agenda Item #2: Selection Effects). Do not try to model *how* Einstein thought; model the *probabilistic structure of a theory selected for fit*.

  ### III. Internal vs. Exportable Value

  **Should the export question drive the agenda?**
  **Yes.** But indirectly.

  If you frame this purely as "Patching Bayesianism," you are competing with 50 years of literature (Jeffrey, Garber, Christensen, etc.). The bar for a "better patch" is incredibly high.

  If you frame this as **"The Epistemic Cost of Post-Hoc Analysis,"** you are speaking to:
  1.  Formal Epistemology (POE).
  2.  Philosophy of Science (Prediction vs. Accommodation).
  3.  Statistics/Methodology (Overfitting, Double Dipping).

  **Strategy:** Solve the formal core (Agenda #1) to satisfy the epistemologists. Frame the motivation and implications (Agenda #2) to satisfy the broader audience. This makes you hireable in philosophy departments *and* potentially interdisciplinary institutes.

  ### IV. What Would Move the Needle? (Move-Makers)

  You asked what findings would shift the agenda up or down.

  **1. The "Dutch Book" Blockade (Moves Agenda #1 Down)**
  *   *Scenario:* You prove (or find a robust proof) that any relaxation of logical omniscience sufficient to solve POE inevitably leaves the agent vulnerable to a synchronic Dutch Book that cannot be defended as a "fee for reasoning."
  *   *Consequence:* Abandon the LO route. Pivot entirely to the Counterfactual or Selection Effect routes (Agenda #2).

  **2. The "Selection Effect" Formalization (Moves Agenda #2 Up)**
  *   *Scenario:* You successfully model a "Theory Space" where the probability of finding a $T$ that fits $E$ by chance is calculable, and show that conditioning on the *selection event* yields the correct confirmation boost without relaxing LO.
  *   *Consequence:* This becomes your main thesis. It solves POE by redefining the evidence to include "I found a theory that fits." This is highly exportable to statistics.

  **3. Empirical Psychology of "Old Evidence" (Moves Memory Hypothesis Up)**
  *   *Scenario:* Experimental work shows that when scientists use old evidence, they explicitly represent it as uncertain or reconstructed, not as $P=1$.
  *   *Consequence:* Your memory hypothesis moves from "dissolution" to "empirically grounded model." (Unlikely to happen in your timeframe, so keep it theoretical).

  ### V. Summary of the 3-Year Plan

  *   **Year 1 (Dissertation Core):** Focus on **Derivation Oldness via Logical Learning**. Develop a formal model where learning $T \models E$ updates $P(T)$ despite $P(E)=1$. Use impossible worlds or sentence-probability frameworks. *Goal: One strong paper on non-omniscient conditionalization.*
  *   **Year 2 (Dissertation Expansion):** Connect this to **Selection Effects**. Show how your model handles the "accommodation vs. prediction" distinction by incorporating the probability of theory generation. *Goal: Second paper linking POE to methodology.*
  *   **Postdoc (Export):** Apply the framework to **statistical double-dipping**. Collaborate with a statistician or methodologist. Show how your Bayesian account of old evidence maps onto penalties for post-hoc hypothesis testing. *Goal: Interdisciplinary paper.*

  **Final Advice:**
  The "Memory" idea is seductive because it feels like a Rylean dissolution of a pseudo-problem. Resist the urge to lead with it. It is better to grant the opponent their premise ($P(E)=1$) and beat them on the logic of entailment, *then* mention memory as a secondary, empirical reason why $P(E)$ might rarely be 1 in practice.

  The "Export" angle is your career insurance. Pure POE papers are niche. POE-as-Methodology papers are timely. Carve the space by **mechanism** (Entailment vs. Selection), not by **narrative** (Temporal vs. Construction), and you will find the tractable formal problems hidden inside the mess.
