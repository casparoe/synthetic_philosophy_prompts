  # ADR-042: Retention of Mental Causation Module (MCM) Under Physical Closure Constraints

  **Status:** Accepted  
  **Date:** 2023-10-27  
  **Owner:** Senior Systems Engineer  

  ## Background
  The organism runtime operates on a strict **Physical Closure Policy**. All state changes within the neural substrate must originate from prior physical states within the same domain. There is no external API ingress allowed; no non-physical packets may enter the causality stream. The Mental Causation Module (MCM) was deployed to handle high-level user intents (beliefs, desires). Architecturally, MCM functions as a shadow microservice. It maintains **eventual consistency** with the physical layer (supervenience), mirroring neural states with zero write permissions.

  ## The Exclusion Event
  During Q3 load testing, we traced a critical path: a user decides to raise an arm. The logs show the physical motor neurons fired sufficient cause packets to execute the movement. Simultaneously, the MCM emitted an `INTENT_RAISE_ARM` event. However, packet inspection reveals the physical layer completed the execution before the MCM payload could reach the **closure-gated endpoints**.

  This indicates a classic exclusion conflict. Since the physical cause was sufficient, the mental cause was redundant. We observed **duplicate webhook deliveries** where the physical load balancer silently dropped the MCM signal to prevent race conditions. The MCM is currently causally inert; it processes data but alters no system outputs.

  ## Proposed Resolutions
  A remediation meeting was held with stakeholders from Ontology and Platform.

  *   **Marcus (Platform):** Argued for immediate decommissioning. Since the physical pipeline handles 100% of endpoint execution, MCM consumes compute cycles without affecting state. Marcus labeled this "zombie compute" and suggested reallocating resources to metabolic optimization.
  *   **Priya (Ontology):** Defended retention. She argued the module is **phenomenologically loud but causally mute**. While MCM does not trigger actuators, removing it breaks "experience telemetry." Users report a loss of agency if intentions are not logged, even if those logs do not influence the act itself.
  *   **Compatibilist Middleware (Rejected):** Marcus briefly proposed a **compatibilist middleware layer** to allow MCM and physical states to share causal load without violation. This was immediately overruled by Security. The Physical Closure Policy forbids any architecture where a non-physical service claims write access to physical endpoints. Allowing dual causation would violate the conservation of energy budgets and trigger compliance alerts.

  ## Conclusion
  After reviewing the trace data, we cannot validate MCM as a causal driver. However, decommissioning it degrades the user's subjective dashboard without improving system performance. The physical layer remains the sole author of state changes.

  **Decision:**
  1.  **Retain MCM in Read-Only Observability Mode.** The module will continue to subscribe to neural events and generate user-facing reports.
  2.  **Enforce Epiphenomenal Logging.** MCM outputs are classified as side-effects. They may be displayed on the UI but are strictly prohibited from triggering downstream physical actions.
  3.  **Document Redundancy.** We acknowledge that removing MCM would break experience telemetry without altering any system outputs.

  The system remains physically closed. Mental states are preserved as logs, not levers. This satisfies the closure constraint while maintaining the illusion of agency required for stakeholder satisfaction. Future iterations may explore non-reductive physicalism, but only if it does not require additional API permissions.
