answer: |-
  **The Scenario**

  Maya sits in the budget meeting, knowing withholding the error report will sink David's project but secure her team's bonus. She despises her own envy; she values collaboration and wishes she weren't this petty. Yet, as the chair asks for updates, the fear of losing her bonus constricts her throat. She stays silent. She knows she should speak; if the penalty for David were firing rather than delay, she would speak. But given her current priorities and anxiety, she would not have spoken even had she tried to force the words. She leaves the room hating what she did, yet knowing she did it.

  ***

  **(a) Conditions, Verdicts, and Reasoning**

  1.  **Leeway / Regulative Control:** *Condition:* Could she have done otherwise? *Verdict:* **Fails.** *Reasoning:* The scenario stipulates internal motivational necessitation ("given her current priorities... she would not have spoken even had she tried"). There is no branching path available to her actual psychology at *t*.
  2.  **Guidance Control:** *Condition:* Is the mechanism reasons-responsive? *Verdict:* **Satisfied.** *Reasoning:* She exhibits moderate reasons-responsiveness; she recognizes moral reasons and would react to stronger ones ("if the penalty... were firing... she would speak"). The mechanism is not rigid.
  3.  **Answerability:** *Condition:* Does the action express a quality of will warranting reactive attitudes? *Verdict:* **Satisfied.** *Reasoning:* She prioritizes bonus over colleague despite valuing collaboration. This distortion warrants resentment; withholding it treats her as incapable of moral understanding.
  4.  **Hierarchical Identification:** *Condition:* Does she endorse the effective motive at a higher order? *Verdict:* **Fails.** *Reasoning:* She "despises her own envy" and "wishes she weren't this petty." There is a mesh failure between her first-order action and second-order volition.
  5.  **Diachronic Addressability:** *Condition:* Can a later self intelligibly answer for the action? *Verdict:* **Satisfied.** *Reasoning:* She leaves "knowing she did it." The agency persists even if the motive is disowned; she remains the proper target of demands for explanation or apology tomorrow.

  **(b) The Splitting Feature**

  The feature driving the split between the responsibility-compatible theories (2, 3, 5) and the identification theory (4) is **higher-order repudiation**. Maya acts on a motive she explicitly rejects. If you remove this feature (making her endorse the envy), verdict 4 flips to Satisfied, while 1, 2, 3, and 5 remain unchanged. Without this feature, the case collapses into a standard voluntary action where all theories except Leeway compatibilism agree she is free. The repudiation isolates the Identification condition as the outlier that denies responsibility where our practices (and the other theories) affirm it.

  **(c) Minimal Perturbation**

  **Perturbation:** Change "She despises her own envy" to "She reflects that her team's survival justifies the sacrifice."
  **Judgment:** This flips Hierarchical Identification to Satisfied (she now meshes with her motive). Leeway still fails (she is still locked in by her values), Guidance still holds (she remains reasons-responsive), and Answerability holds (she is still blameworthy for misplaced values). The fittingness of blame does not vanish; it shifts from blaming a weakness of will to blaming a bad principle. Responsibility remains stable despite the shift in internal harmony.

  **(d) Objection and Reply**

  **Objection:** The Identification theorist argues that because Maya repudiates the motive, the action is alien to her true self; blaming her is like blaming a victim of a spasmodic urge, not an agent.
  **Reply:** Ownership of action requires continuity of agency, not endorsement of every impulse; to deny blame here is to deny her capacity to govern herself over time. We hold her responsible precisely because she is capable of recognizing and correcting the disowned motive later.

  **(e) Conclusion**

  " Worth wanting" is interest-relative to the practice of sustaining moral community over time, requiring not metaphysical escape but diachronic addressability.
