      *   *Check:* Did I address the "redescription" worry? *Correction:* Make sure to highlight the difference between *rule-breaking* (P-A) and *reason-hiding* (Avowal).
      *   *Check:* Is the distinction between "private gain" and "unavowable reason" clear? *Correction:* Emphasize that one can have private gain that is avowable (e.g., salary) and public gain that is unavowable (e.g., populist pandering that violates rights).
