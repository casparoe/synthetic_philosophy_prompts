  6.  **Final Polish:** Check British spelling and formatting. Ensure the "Epistemic Status" instructions are followed rigorously (e.g., explicitly marking where I am reconstructing the user's view).

  *(Self-Correction Note on "Settled" Claims):* In political theory, very little is truly "settled." I must be careful not to overstate consensus. The P-A model is *dominant* in policy, but *contested* in theory. I need to reflect that distinction.

