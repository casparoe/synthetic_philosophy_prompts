          *   *Epistemic Note:* Universalism vs. Contextualism in corruption studies is highly contested (Heidenheimer, Johnston, etc.).

      *   *Axis 5: Bribes vs. Hospitality.*
          *   P-A: Intent to influence vs. social nicety. Hard line.
