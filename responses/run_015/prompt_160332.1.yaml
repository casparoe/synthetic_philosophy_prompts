answer: |-
  In 2009, a rapidly scaling fintech firm mandated a single shared database schema for all product teams to ensure transactional consistency, a small architectural choice that became entrenched as every new feature built dependencies on those central tables, creating high switching costs through deep code coupling and standardized internal APIs. By 2024, the very density of these integrations turned the shared schema into a contention bottleneck: deployment frequency collapsed because any change risked cascading failures across unrelated products, generating intense internal pressure to fragment the system. The organization did not adopt a new technology to escape; instead, the coordination costs inherent to the lock-in mechanism exceeded the benefits of consistency, forcing an endogenous sharding of the database by business domain that mirrored the existing dependency clusters, effectively dissolving the lock-in without an exogenous shock.

  **Show Your Work**

  *   **Early Event:** The 2009 mandate for a single shared database schema.
  *   **Lock-in Mechanism:** Increasing returns to coordination; as more teams used the schema, the value of consistency rose, but the cost of switching (refactoring dependencies) rose faster, creating a stable equilibrium.
  *   **Unlock Mechanism:** Congestion collapse of the coordination mechanism. The lock-in created such high coupling that the system's velocity hit zero; the *same* dependencies that prevented exit also defined the fracture lines for the exit (sharding by domain).
  *   **Why Endogenous:** The escape wasn't caused by a new tech (like NoSQL) dropping in; it was caused by the *accumulation* of lock-in pressure (deployment collisions) making the current state unsustainable. The solution (sharding) is the direct structural inverse of the problem (centralization), generated by the system's own friction.
  *   **The Clock:** 2009 to 2024 (15 years). Same institution, many of the same engineers/architects still present.
  *   **Single Feature:** The **centralized schema constraint**. If you delete this feature (allowing independent schemas from day one), you never get the lock-in (no coupling), but you also never get the specific congestion crisis that forces the organized sharding; the system remains loosely coupled throughout, avoiding both the trap and the dramatic escape.

  **Honesty Check**

  This is not a clean counterexample to "history gets locked in," but rather a demonstration that **path dependence does not imply permanence.** A defender of strong path dependence (like Brian Arthur or Paul David) would argue this is simply two path-dependent episodes stacked back-to-back: the system was locked into Centralization until the cost function flipped, at which point it became locked into Decentralization. They would reabsorb this case by claiming the *decision rule* ("optimize for integrity") remained path dependent, even if the *topology* changed. The "lock-in" held firmly for 15 years; the escape wasn't a gentle drift but a crisis-induced phase transition. To truly defeat strong lock-in theory, one would need to show a switch without a crisis—here, the crisis (velocity hitting zero) confirms the rigidity of the lock until breaking point. Thus, history mattered profoundly (the shard structure mirrored the old dependencies), but the "lock" was contingent on the cost-benefit ratio of the coordination mechanism, not metaphysical.
