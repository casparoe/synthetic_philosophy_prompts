  1. Simulation rules and round structure (about 250 words)
  Divide the class: 3 students form the Central Pricing Board (CPB); 17 become Sector Managers. Each Manager receives a sealed "Local Condition" card detailing a specific constraint or opportunity (e.g., "machinery aging, max output 50 units" or "new vein found, coal cost halved"). This information is private; Managers cannot show cards to the CPB. Each card also clearly lists a private production target. The sequence runs three rounds. Round 1: CPB sets initial prices for Steel and Coal. Managers submit orders based on prices and private conditions. CPB observes only aggregate surplus/shortage totals, not individual orders. Round 2: CPB adjusts prices based on aggregate data. Managers choose production levels. Introduce "Innovation": Managers may adopt efficient tech but must reveal part of their card to CPB, costing private points. Round 3: Final price adjustment and production run. Managers submit orders secretly. Board records totals publicly. Information Partition: CPB sees only total supply/demand gaps. Managers see prices and their own local constraints. Communication is one-way: prices flow down, aggregate totals flow up. No direct negotiation is permitted. The CPB wins by minimizing total waste and hitting a social output target. Managers win by maximizing individual factory output relative to their hidden targets. Managers must decide whether to follow price signals or hedge against local risks unknown to the Board. The Board must infer specific scarcities from very blunt aggregate numbers, attempting to clear markets without knowing why imbalances exist. The simulation ends after Round 3, tallying social welfare versus individual factory performance.

  2. Payoff scheme and strategic tension (about 150 words)
  Managers earn points equal to (Output × Price) − (Input Costs). Bonuses award if output matches their hidden Local Condition target. Deviating loses points. The CPB earns points inversely proportional to aggregate inventory surplus or shortage; zero imbalance is perfect. Tension arises in Round 2. Managers can choose "Innovation," which lowers costs but requires revealing their hidden constraint to the CPB. Revealing costs 10 private points but allows the CPB to set accurate prices for that sector. Managers face a trade-off: sacrifice private standing to improve social efficiency, or hoard knowledge to meet private targets. The Board misses the mark because aggregate data masks distribution. A shortage looks like high demand, but might be one factory's broken machine. Raising prices punishes efficient factories while failing to fix the broken one. This creates distrust. The Board chases equilibrium using very blunt tools, while Managers optimize locally using tacit knowledge the Board cannot access.

  3. Debrief mapping (about 200 words)
  Ask the CPB why they adjusted prices. Highlight their solution assumed homogeneity—that factories respond identically to price changes. Point to Managers who suffered because hidden cards made them unresponsive to price hikes. This illustrates the iterative adjustment mechanism: it works mathematically if agents are uniform, but fails when local conditions vary wildly. Examine the Innovation Round. Ask Managers who withheld revelation why they did so. They prioritized private targets over social efficiency. This maps to the cost of knowledge transmission. Even if the Board *could* process information, acquiring it imposes costs on those who hold it. The Board's inability to distinguish between a temporary spike and a structural bottleneck demonstrates the limitation of statistical aggregates. Students should clearly see the problem is not computational speed, but data nature. The Board had all the numbers but lacked the context. The "failure" was not wrong math, but missing meaning. Conclude by emphasizing that prices in real markets do more than clear inventory; they encode very specific, tacit circumstances without requiring central articulation. The simulation shows why a central body, even with good intentions and iterative tools, cannot replicate the informational efficiency of decentralized decision-making where knowledge stays at the point of action.

  4. Predictable failures and fixes (about 150 words)
  Managers often collude or share cards, bypassing information asymmetry. Enforce strict silence between Managers and forbid showing cards. Cooperation collapses the simulation into a solved puzzle. Second, the Board might solve the imbalance too quickly if the hidden conditions are too simple. Ensure condition cards have non-linear effects (e.g., "output caps" rather than just cost changes) so price signals yield diminishing returns. Third, Managers might reveal everything in Round 2 despite the cost, prioritizing group success over individual points. Increase the private cost of revelation or tie final grades partially to individual factory performance rather than total class welfare. If the Board dominates, introduce random shocks in Round 3 that invalidate previous data, forcing constant recalibration. If the Board clears the market perfectly, the key lesson is lost. Always ensure the aggregate data remains very ambiguous, sustaining tension between central calculation and true local reality throughout the full seminar.

  5. Necessary simplification (about 100 words)
  This simulation flattens entrepreneurial discovery. Here, Managers choose from fixed options on cards. Market participants create new techniques and goods that did not previously exist, altering the data set itself. The simulation assumes a static equilibrium problem; the real debate concerns dynamic discovery. State: "Your options were fixed on cards. You would have invented new cards—new products or methods—never seen before. The central board cannot price exactly what does not yet exist. The calculation problem is not about allocating known resources efficiently, but about discovering which resources are valuable in the first place. Prices guide this discovery, not just allocation."
