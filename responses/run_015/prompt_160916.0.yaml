      *   **The Structural Defect:** Explain why this isn't just underdetermination. In SDT, underdetermination is solved by design. In HP, it is forbidden by design (the "bracketing" of reality).
      *   **The Borrowed Authority:** Show how practical applications (meditation, lesions) implicitly assume the investigator knows what the subject *should* be experiencing to interpret the text change. This violates HP's neutrality.
