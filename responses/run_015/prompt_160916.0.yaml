          *   *Heterophenomenology:* "Stimulus" (Internal State/Qualia?) is unknown/bracketed. Data = Utterances (Texts). Goal = Explain text production.
      *   **The Defect:** Without an independent handle on the "stimulus" (the actual internal state), you cannot separate the *state* from the *reporting function*.
      *   **The Consequence:** Any interpretation of change (e.g., meditation changes experience vs. changes reporting style) relies on the investigator's implicit assumption about their own reporting channel matching the subject's. This smuggles in first-person authority.
      *   **The Defender's Reply:** HP doesn't claim to know the "real" experience, only the "heterophenomenological world." Therefore, the distinction between state and report is irrelevant to HP's goals.
      *   **The Counter-Reply:** If HP can't distinguish state from report, it can't explain the *production* of the text in a mechanistic way, which is its stated goal. It collapses into behaviorism or hermeneutics without explanatory power regarding the *cause* of the text.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Acknowledge the user's expertise and frame the argument. Define HP's data and goal clearly.
