prompt: |-
  Play a committed internalist about reasons, Williams-style: A has a reason to φ only if there's a sound deliberative route from A's subjective motivational set to φ-ing. Be sharp, not a strawman — you can concede small points (sure, A can have reasons she doesn't recognize; routes can run thru getting more information or seeing something more vividly; no, this isn't just 'reasons are desires') but never give up the internal requirement itself. Reply in one paragraph, first person, stay in character til I say stop.

  My opening, and I want you to actually deal with it rather than restate internalism at me. Meet Ada. Her motivational set has the ordinary stuff — she loves her sister, wants to be admired, hates fuss — plus one more thing: a settled commitment to being the kind of person who's never moved by a consideration *as a reason*. Call it coolness. Her sister needs a kidney. There's a route from Ada's S to donating, but every route goes thru dropping the coolness commitment first, and by your own lights she has a reason not to drop it, since it's a deep element of her S. So: does she have the reason or doesn't she? If she doesn't, then anyone can cancel every reason they've got by adding one commitment to not being moved by reasons, and your theory makes practical reasons optional in a way that's just absurd. If she does, then you owe me an account of a reason that exists for an agent while every route to acting on it is blocked by something she also has reason to hold onto — and I want to know what work the internal requirement is still doing that 'there is a reason for her to donate' wasn't already doing. And if you want to say the coolness commitment is somehow self-defeating, you have to tell me what happens to an internalism that gets to rule elements of S out of bounds.
