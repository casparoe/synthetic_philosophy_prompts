prompt: |-
  Hi — I write novels for a living (my last one, Lowtide, is set almost all of it inside a persistent online world), and I've somehow let myself be talked into giving the closing keynote at a game studies conference next month. I'm going to argue two things: first, that virtual objects are genuinely real objects of a peculiar kind — my line is that a virtual sword is a real sword-shaped knot of permissions and expectations, held in place by a server — and second, that harms done to people in virtual worlds are real harms, just thinner ones, whose size is set by how much agency and care the person has invested rather than by what the thing is made of.

  The room will be mostly game developers and engine programmers, a couple of them openly hostile to theory (one of them definitely has a slide somewhere that says it's just rows in a database), plus maybe four or five philosophers who work on social ontology and fiction, and one or two legal types who care about whether taking someone's in-game gear is actually theft. Nobody there does decision theory or consciousness stuff. They'll be thinking about my examples rather than my arguments, they'll want everything short, and I can't deliver a lecture on institutional facts — I'm a novelist, so give me things I can actually say out loud.

  Can you put together a Q&A prep sheet for me? Roughly eight objections I'll actually get from that room, ordered by how much damage they'd do, each one phrased the way that particular person would phrase it (the engine programmer's version of an objection is a different question from the philosopher's version), with a reply I can give in about two minutes and an honest note on where the reply is soft. Tell me which ones I should just concede in the talk itself and which I should hold. And include the question I'm hoping nobody asks — I think its the one about whether my view makes my own novel's characters real in the same way, but tell me if I'm wrong and there's a worse one coming. British English throughout, please (colour, honour, and so on).

  Two things from the book I'll be leaning on and that they'll go after: there's a scene after a server rollback where a character's hoard survives only in other players' memories — in-world they call these 'ghost-lit' goods, stuff that exists only as long as someone else remembers having seen it; and there's the bit where a guild is systematically driven out of the world over about a year, and I genuinely can't tell whether that's theft, griefing, or something more like being made to feel unwelcome in your own town. I also want to say something about whether shutting a world down for good is a serious loss on my account, and I can't work out if that's my strongest move or the one that gets me laughed out of the room — tell me which.
