      *   **Constraints:** Short replies (2 mins max), spoken language (novelist style, not academic lecture), British English.
      *   **Deliverables:** Q&A prep sheet with ~8 objections (ordered by damage potential), phrased by audience type, 2-min reply, "soft spot" note. Advice on what to concede vs. hold. Identification of the "Question I'm Hoping Nobody Asks" (and if there's a worse one). Advice on the "server shutdown" argument.
      *   **Specific Book Examples:** "Ghost-lit" goods (post-rollback memory), Guild expulsion (theft/griefing/exclusion).

  2.  **Deconstruct the Audience & Arguments:**
      *   *Engine Programmers:* Pragmatic, materialist, focused on code/data. Will attack the "real object" claim as mystification of database entries.
      *   *Philosophers:* Focused on ontology, metaphysics, definition of "real." Will attack the vagueness of "knot of permissions."
      *   *Legal Types:* Focused on precedent, property rights, enforceability. Will attack the "theft" classification.
      *   *Novelist (User):* Needs to sound authoritative but accessible, bridging the gap between code and experience.

  3.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1 (The Programmer - "It's just data"):* This is the biggest threat. If virtual objects aren't real, the whole thesis collapses.
          *   *Phrasing:* "It's just rows in a database."
          *   *Reply:* Acknowledge the substrate, shift focus to the *effect*. A contract is also just ink on paper, but the obligation is real.
          *   *Soft Spot:* Doesn't fully address the *ontological* status, just the functional one.

      *   *Objection 2 (The Legal - "Theft vs. ToS"):* Crucial for the "harm" argument.
          *   *Phrasing:* "It's not theft if the EULA says we own it."
          *   *Reply:* Distinguish legal ownership from *experienced* loss. The harm is the disruption of expectation/agency, regardless of the EULA.
          *   *Soft Spot:* Legally, the user is probably wrong. Needs to admit the legal reality while holding the moral ground.

      *   *Objection 3 (The Philosopher - "Fiction vs. Reality"):* Attacks the "real harm" claim.
          *   *Phrasing:* "Is crying over fiction the same as crying over death?"
          *   *Reply:* No, but the *pain* is identical. The trigger is fictional, the neurochemistry is not. Scale by investment.
          *   *Soft Spot:* Hard to quantify "investment."

      *   *Objection 4 (The Designer - "We can fix it with a rollback"):* Attacks the permanence/reality of the harm.
          *   *Phrasing:* "We can just restore the item from backup."
          *   *Reply:* Use the "ghost-lit" example. The *history* is lost even if the stat block returns. Trust is damaged.
          *   *Soft Spot:* Technically, the game state *is* restored.

      *   *Objection 5 (The Cynic - "Get a life"):* Ad hominem-ish.
          *   *Phrasing:* "Why care about pixels?"
          *   *Reply:* It's not pixels, it's social capital and time. Compare to collecting stamps or coins.
          *   *Soft Spot:* Can sound defensive.

      *   *Objection 6 (The Ontologist - "Definition of Object"):* Semantic attack.
          *   *Phrasing:* "You're redefining 'object' until it means nothing."
          *   *Reply:* I'm expanding the category, like 'currency' moved from gold to digital.
          *   *Soft Spot:* Risk of equivocation.

      *   *Objection 7 (The Guild Example - "Bullying vs. Gameplay"):* Specific to *Lowtide*.
          *   *Phrasing:* "Isn't that just emergent gameplay?"
          *   *Reply:* Emergent gameplay becomes harassment when the target can't opt-out without losing their 'home'.
          *   *Soft Spot:* Hard line to draw.

      *   *Objection 8 (The Shutdown - "Servers turn off"):* The existential threat.
          *   *Phrasing:* "If the server dies, the object never existed."
          *   *Reply:* The *impact* remains in the players' lives (friendships made, skills learned).
          *   *Soft Spot:* The object itself *does* cease to exist.

  4.  **Selecting and Ordering:**
      *   Need to order by "damage potential."
      *   1. The "Just Data" argument (Programmer). Destroys Argument 1.
      *   2. The "EULA/Ownership" argument (Legal). Destroys Argument 2 (Theft).
      *   3. The "Shutdown" argument (Existential). Destroys permanence.
      *   4. The "Fiction/Emotion" argument (Philosopher). Undermines "Real Harm."
      *   5. The "Rollback/Ghost-lit" argument (Specific to book). Tests consistency.
      *   6. The "Emergent Gameplay" argument (Designer). Reframes harm as fun.
      *   7. The "Definition" argument (Philosopher). Semantic nitpicking.
      *   8. The "Get a Life" argument (Cynic). Easy to deflect but annoying.

  5.  **Refining the Replies (Voice & Timing):**
      *   Must sound like a novelist speaking, not reading a paper. Use metaphors. Keep it under 2 mins (approx. 250-300 words spoken at normal pace).
      *   British English check (colour, honour, realise, etc.).

  6.  **Addressing Specific Questions:**
      *   *Concede vs. Hold:* Hold on the "Real Harm" (Argument 2). Concede/Qualify the "Real Object" (Argument 1) – admit they are dependent objects, not independent ones.
      *   *The "Question I'm Hoping Nobody Asks":* User suspects it's about their characters. Actually, the worse one is about *complicity*. If virtual harms are real, is the author complicit in designing/writing a system that allows them?
      *   *The Shutdown Argument:* Is it the strongest move? Yes, but risky. It appeals to emotion. Needs to be framed as "loss of place," not "loss of data."

  7.  **Review against Constraints:**
