answer: |-
  Here is a Q&A prep sheet tailored for your keynote. I've ordered these by the amount of structural damage they could do to your argument, starting with the ones that threaten to collapse the whole thesis.

  The replies are drafted to be spoken—roughly two minutes each at a measured pace. I've kept the British English spelling and idiom as requested.

  ### **Q&A Prep Sheet: *Lowtide* Keynote**

  #### **1. The "Just Data" Objection (The Hostile Engine Programmer)**
  **The Question:** "You're calling a virtual sword a 'real object'. But if I look at the memory address, it's just an integer flag in a SQL database. If the server loses power, the sword vanishes. How can you call something real that depends entirely on electricity and code?"
  **The Reply:** "You're absolutely right about the substrate. If I burn a paper contract, the ink is gone, but the obligation it represented might still hold weight in a court. I'm not arguing the sword is made of atoms; I'm arguing it's made of *agreements*. That integer flag is a promise the server makes to every player that 'this state exists'. When you swing the sword, you aren't moving atoms, you're triggering a cascade of permissions. It's a real knot of expectations. The fact that it's fragile doesn't make it unreal; a soap bubble is still a real object, even if it pops."
  **The Soft Spot:** You are conflating *ontological reality* with *social reality*. A philosopher will spot that you've shifted the goalposts from 'object' to 'agreement'.
  **Strategy:** **Hold.** This is your core thesis. Do not back down, but admit the dependency.

  #### **2. The "EULA" Objection (The Legal Type)**
  **The Question:** "You talk about virtual theft. But every End User Licence Agreement states the company owns all assets. If I delete your gear, I'm not stealing; I'm exercising my property rights. Calling it 'theft' is legally illiterate."
  **The Reply:** "Legally, you're correct. But we aren't talking about law; we're talking about harm. If I invite you to my home, and then I throw your coat into the fire, it's my house and my fire, but I've still damaged *you*. The EULA defines the license, not the experience. When a player invests a year into a guild, they are building social capital. Stripping that away violates the *spirit* of the interaction, even if it respects the letter of the contract. We need to judge the harm by the human cost, not the Terms of Service."
  **The Soft Spot:** You are admitting the act isn't illegal while arguing it's immoral. A lawyer might press you on why 'moral theft' matters in a conference about systems.
  **Strategy:** **Hold.** This supports your second argument (harms are real). Distinguish clearly between *legal ownership* and *experienced loss*.

  #### **3. The "Shutdown" Objection (The Pragmatist)**
  **The Question:** "You mention shutting a world down as a serious loss. But when a MMO closes, the company usually offers refunds or transfers. If the data is gone, what exactly is lost? You can't mourn a place that never existed."
  **The Reply:** "You can mourn a place that no longer exists. Think of a pub that closes down in your hometown. The bricks might become a bank, the regulars scatter. The *building* isn't gone, but the *place* is. When a world shuts down, we don't just lose the data; we lose the context where friendships were formed and skills were learned. In *Lowtide*, when the server dies, the 'ghost-lit' goods remain in memory. The loss isn't the pixels; it's the dissolution of the community that gathered around them. That is a genuine social loss."
  **The Soft Spot:** This is emotional, not empirical. A hard-nosed developer might say 'get over it'.
  **Strategy:** **Hold, but frame carefully.** This is your strongest emotional move, but only if you focus on the *community*, not the *assets*. See my note at the bottom.

  #### **4. The "Fictional Emotion" Objection (The Philosopher)**
  **The Question:** "I cry when Hamlet dies. Does that mean Hamlet was real? If harms in-game are 'real harms', does that mean all fictional suffering is real suffering? Where do you draw the line?"
  **The Reply:** "The tear in your eye is real salt water, regardless of the trigger. But there is a difference between witnessing a tragedy and participating in one. In a persistent world, you have *agency*. You made choices. You invested time. When Hamlet dies, you are a spectator. When your guild is driven out of town, you are a participant. The harm is 'thinner' than physical violence, as I said, but it is thicker than reading a book. It scales with your ability to affect the outcome."
  **The Soft Spot:** The 'thickness' metaphor is poetic but vague. A philosopher will ask for a metric.
  **Strategy:** **Hold.** This clarifies your 'agency and care' criterion.

  #### **5. The "Ghost-Lit" Objection (The Designer)**
  **The Question:** "You use the 'ghost-lit' goods scene to prove memory matters. But if the item isn't in the database, it has no function. It's flavour text. Why does a non-functional item count as an object?"
  **The Reply:** "Because its function has shifted from *utility* to *testimony*. In the book, those items prove you were there. They are medals, not tools. If I show you a photograph of a house that burned down, the photo doesn't shelter you from rain, but it proves the house existed. 'Ghost-lit' goods are the photograph. They hold the history of the world when the server refuses to. That historical record is a functional part of the social reality."
  **The Soft Spot:** You are arguing for a narrative function, not a game mechanic function.
  **Strategy:** **Hold.** This is your best literary example. Own it.

  #### **6. The "Emergent Gameplay" Objection (The Developer)**
  **The Question:** "Regarding the guild expulsion in your book: isn't that just emergent gameplay? If we label social exclusion as 'harm', are we going to ban politics in games? That's the point of the sandbox."
  **The Reply:** "There's a difference between a rival guild defeating you in battle, and a group coordinating to make a space uninhabitable for a year. One is competition; the other is attrition. If the design allows players to make others feel unwelcome in their only 'home' without recourse, that's not emergent gameplay; that's a design failure. We build these worlds with rules. If the rules allow harassment to flourish under the guise of 'strategy', we need to admit the harm is a feature, not a bug."
  **The Soft Spot:** The line between 'hard gameplay' and 'harassment' is notoriously difficult to define.
  **Strategy:** **Concede partially.** Admit it's a design challenge, but insist the *harm* remains real regardless of intent.

  #### **7. The "Definition" Objection (The Ontologist)**
  **The Question:** "You're stretching the word 'object' so far it breaks. If a sword is a 'knot of permissions', is a promise an object? Is a law an object? If everything is an object, nothing is."
  **The Reply:** "I'm not saying everything is an object. I'm saying our category of 'object' has been too narrow. We used to think money had to be gold. Now it's digital entries. Did money cease to be real when it stopped being metal? No. I'm proposing we update our ontology to include digital artefacts. It's not about breaking the word; it's about letting it grow up."
  **The Soft Spot:** This is semantic hand-waving. It doesn't solve the metaphysical problem.
  **Strategy:** **Concede.** Acknowledge you are using a specialised definition. Say: "Call it a 'virtual artefact' if you prefer, the point remains."

  #### **8. The "Get a Life" Objection (The Cynic)**
  **The Question:** "Ultimately, isn't this just a fancy way of saying people get too attached to hobbies? Shouldn't we be encouraging detachment rather than validating delusion?"
  **The Reply:** "People get attached to stamp collections, vintage cars, and football clubs. None of those define your survival, but we respect the passion. Why is digital passion treated as delusion? For many, these worlds are their primary social space. Validating that attachment isn't encouraging delusion; it's respecting where people actually live their lives."
  **The Soft Spot:** Can sound defensive.
  **Strategy:** **Hold.** Keep it brief and confident.

  ---

  ### **Strategic Advice**

  #### **What to Concede vs. What to Hold**
  *   **Concede:** The definition of "object" (Objection 7). Don't get bogged down in semantics. If they want to call it a "digital artefact" or "institutional fact," let them. You win if they agree it has *weight*, regardless of the label.
  *   **Hold:** The reality of the *harm* (Objections 2, 4, 6). This is your moral centre. Do not let them reduce player suffering to "just gameplay."
  *   **Qualify:** The "realness" of the object (Objection 1). Admit they are *dependent* objects. They are real like a flame is real (requires fuel) rather than like a stone is real (independent).

  #### **The "Shutdown" Argument**
  You asked if arguing that shutting a world down is a serious loss is your strongest move or a liability.
  *   **Verdict:** It is your **strongest move**, but only if you frame it as the loss of a *place*, not the loss of *property*.
  *   **The Risk:** If you talk about losing "gear" or "stats," the engineers will laugh.
  *   **The Fix:** Talk about the loss of the *pub*, the *town square*, the *context*. Use the analogy of a physical venue closing. If you anchor it in social space, it becomes undeniable. If you anchor it in data, it becomes trivial.

  #### **The Question You're Hoping Nobody Asks**
  You suspect it's: *"If virtual objects are real, are the characters in your novel real in the same way?"*
  *   **Analysis:** You are right to fear this, but there is a **worse** one coming.
  *   **The Character Question:** This is a metaphysical trap. If you say "Yes," you're a mystic. If you say "No," you have to explain the difference between a character (knot of narrative expectation) and a sword (knot of server permission). It's messy, but survivable.
  *   **The Worse Question (Complicity):** *"If virtual harms are real harms, and you design/write worlds where these harms occur for entertainment, are you complicit in inflicting them?"*
      *   **Why it's worse:** It attacks *you*, not just the theory. It questions your ethics as a creator.
      *   **Preparation:** If this comes up, pivot to the value of *safe* failure. "We simulate harms in fiction and games so we can process them safely. The harm is real, but the context is contained. That is the value of the magic circle."

  #### **Final Note on Tone**
  You are a novelist in a room of engineers. Do not try to out-logic them. Out-narrate them. When they talk about database rows, you talk about the human story the row enables. Your authority comes from *Lowtide*, not from ontology. Use the book as your evidence, not just your illustration.

  Good luck. Break a leg.
