      *   **Part 2: Key Scenes:**
          *   *Cutter & The Hat:* This is the test run. "It's just a hat." But Angier cares. Why? Because it's not about the object, it's about the *method*.
          *   *The Tank Reveal:* This is the ontological punch. It's not just one death; it's a graveyard. This shifts the question from "Who is he?" to "What is the cost of being him?"
      *   **Part 3: Resisting the Reading:**
