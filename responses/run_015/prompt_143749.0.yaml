answer: |-
  The scalpel slipped. It was a small thing, a nick on the pad of her left thumb during a routine suturing. Most people would have flinched. They would have hissed through their teeth, shaken the hand, maybe even dropped the instrument. The brain screams *danger* when skin breaks.

  Dr. Elena Vance did not flinch. She felt the sharp pressure, the wet warmth of blood welling up, the specific texture of the cut. She registered it all with perfect clarity. But there was no sting. There was no urge to pull away. It was simply information: *Skin integrity compromised. Bleeding minor. Continue work.*

  She finished the stitch, wiped her thumb on a gauze pad, and moved to the next patient.

  This was how she had always been. As a child, she had touched hot stoves and broken bones without crying. Her parents had worried she was broken, or heartless. She wasn't heartless. She cared deeply. She just didn't feel the alarm signal that usually accompanies damage. To Elena, pain was not a warning siren; it was a map. It told her where the problem was, nothing more.

  Now, standing in the recovery room, she looked down at Leo. He was eleven, small for his age, wrapped in white sheets that looked too big for him. He had come in after a bicycle collision with a delivery truck. His leg had been a mess of twisted metal and bone. She had spent four hours putting him back together.

  Leo was waking up. The morphine was working, but the edge of the trauma was still there, hovering behind his eyes. He looked at his casted leg, then up at her. His face crumpled, not from physical agony, but from the shock of it. The violation of being broken.

  Elena checked his monitors. Heart rate elevated. Blood pressure stable. She adjusted the flow of the IV drip. Her movements were smooth, economical. She never wasted motion. She never hesitated.

  "You fixed it?" Leo asked. His voice was thin, raspy from the tube they had used to help him breathe.

  "We did," Elena said. "The bone is aligned. The skin is closed. Now you rest."

  Leo looked at her hands. They were bare, save for a simple wedding band. He noticed the small bandage on her thumb. He looked back at her face, searching for something. He saw the calmness. He saw the lack of tension in her jaw, the steady rhythm of her breathing. In a room where everyone else moved with urgent anxiety—his parents in the waiting room, the nurses checking charts every ten minutes—Elena was still water.

  "Does it hurt you to see me like this?"

  The question hung in the sterile air.

  Elena paused. She could lie. She could say, *Yes, it breaks my heart.* It was what people expected. It was what comforted them, the idea that their suffering was contagious, that it spread to the healer and burdened them too. But it wasn't true. Seeing Leo did not cause her physical distress. It did not make her nauseous. It did not keep her awake at night.

  If she said yes, she would be teaching him that pain is something to be feared, something that infects everyone it touches. If she said no, he might think she didn't care. He might think he was alone in this.

  She looked at the boy. She thought about the way her mother used to look at her scraped knees, confused by Elena's silence. She thought about the way her colleagues rushed to clean up blood, averting their eyes, needing to hide the mess. Elena never looked away. She looked directly at the wound. She saw all of it.

  "It doesn't hurt me the way it hurts you, Leo," she said softly.

  Leo's eyes widened slightly. The honesty was stark.

  "But," she continued, leaning closer so he didn't have to strain to hear, "knowing that you are in pain is the most important thing in the world to me. It tells me exactly where I need to be."

  She reached out and adjusted the blanket over his good leg, tucking it in tight around his foot. It was a small gesture, but it was deliberate.

  "I don't feel your pain," she said. "But I promise you, I will not leave you alone with it. My hands don't shake when I look at you. That means I can work harder for you. Does that make sense?"

  Leo looked at her hands again. The steady hands. The hands that had put his bone back together while everyone else was panicking. He thought about the fear he felt, the wish that someone strong was holding the pieces together.

  "Yeah," he whispered. "It makes sense."

  "Good," Elena said. "Sleep now. I'll be back in an hour to check the circulation."

  She walked out of the room. In the hallway, a nurse bumped into her, apologizing profusely for a near-collision. The nurse looked stressed, eyes red-rimmed. "Dr. Vance, the family in waiting room three is asking for updates. They're hysterical."

  "I'll speak to them," Elena said.

  "You okay?" the nurse asked, noticing the bandage on Elena's thumb. "You look... fresh."

  "I'm fine," Elena said.

  She walked toward the waiting room. She knew what awaited her there. Tears, shouting, the heavy scent of despair. She knew she would not feel the weight of it in her chest. She would not cry with them. Some might call that cold. Some might call it a gift.

  She wondered, as she reached for the door handle, if compassion required shared suffering. If she couldn't feel their hurt, was her comfort less real? Or was it more real, because it wasn't about her own emotional reaction, but purely about their need?

  She didn't know. She opened the door. The family looked up, desperate for someone to hold onto. Elena stepped inside, her hands steady, her face clear, ready to tell them the truth without flinching. She stood in the gap between their suffering and her calm, and she stayed there.
