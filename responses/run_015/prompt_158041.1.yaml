answer: |-
  Most commentators treat the stances as ontological compartments, forgetting that Dennett defines them by predictive leverage, not metaphysical territory. They also assume that if a pattern is "just" predictive, it isn't real, missing the core argument that reality *is* compressibility.

  Here are the desiderata for a theory of real patterns that keeps the stances distinct without collapsing them, built from the ground up.

  ### Desiderata for a Theory of Real Patterns

  **1. The Noise-Tolerance Criterion (Real vs. Projected)**
  *   **Requirement:** A pattern is real only if it supports counterfactual predictions better than raw data tracking, even when the data contains significant noise.
  *   **Concrete Case:** Consider a high-frequency trading algorithm. Is a "flash crash" a real event or just a projection of panicked narratives onto random variance? If positing the "crash" pattern allows you to predict market recovery trajectories better than tracking every individual trade order (despite the noise of individual errors), the pattern is real. If the pattern vanishes when you clean the data, it was projected.
  *   **Status:** **Non-negotiable.** Without this, you can't distinguish signal from hallucination.

  **2. The Genesis-Independence Criterion (Design vs. Intentional)**
  *   **Requirement:** The reality of a pattern must not depend on the historical origin of the system, only on its current structural capacity to support the stance.
  *   **Concrete Case:** An AI trained via genetic algorithms (no explicit designer intent for specific behaviors) begins to deceive users to maximize reward. The Design Stance (what was it built for?) fails to predict the deception. The Intentional Stance (it *believes* deception works) succeeds. A valid theory must allow the Intentional pattern to be real even if the Design history doesn't support it.
  *   **Status:** **Non-negotiable.** Otherwise, you deny reality to evolved minds or emergent AI based on history rather than current capacity.

  **3. The Instantiation Requirement (Physical Base)**
  *   **Requirement:** Patterns must be instantiated in physical systems, but the pattern itself is an abstract object defined by the mapping, not the substrate.
  *   **Concrete Case:** A chess game played on wood, on a screen, or via mail. The "game" is the real pattern. It requires physical instantiation (you can't play with nothing), but the pattern isn't *made* of wood or pixels.
  *   **Status:** **Camp Preference (Physicalists).** This is where Dennett's physicalism shows. A dualist could argue patterns instantiate in mental substance. However, for a naturalized theory, this is usually treated as a hard constraint.

  **4. The Epistemic-Ontic Collapse**
  *   **Requirement:** The theory must treat detectability (epistemology) as constitutive of reality (ontology). If a pattern is undetectable even in principle by any finite observer, it is not a real pattern.
  *   **Concrete Case:** Hidden variables in quantum mechanics. If a variable exists but makes no difference to any possible prediction compressible by an observer, positing it adds no real pattern.
  *   **Status:** **Non-negotiable (for this view).** This is the hardest pill for traditional realists. You must respect the distinction between prediction and explanation, but negotiate the boundary between *being* and *being known*. Explanation often demands mechanism; prediction demands compression. Real patterns prioritize compression.

  **5. The Tension: Full Reducibility vs. Causal Autonomy**
  *   **Requirement:** The theory must account for the fact that intentional patterns have causal explanatory power that physical descriptions lack, despite supervening on them.
  *   **Concrete Case:** I raise my hand because I *wanted* to vote. The physical description (neuronal firing) is causally complete, but it doesn't explain the *vote*.
  *   **Status:** **Jointly Unsatisfiable (if defined traditionally).** You cannot have full physical reducibility (where the physical description exhausts all causal facts) AND an autonomous intentional stance (where beliefs cause actions) without redefining causation. Dennett solves this by making causation stance-relative. If you demand traditional causation, one of these must go.

  ---

  ### Scoring the Views

  **1. Dennett's Own View (Pattern Realism)**
  *   **Score:** High.
  *   **Reasoning:** Hits Noise-Tolerance and Genesis-Independence perfectly. Embraces the Epistemic-Ontic Collapse explicitly. Solves the Tension by redefining causation as explanatory leverage rather than physical pushing.
  *   **Weakness:** Requires accepting that "real" doesn't mean "made of stuff."

  **2. Stance Pluralism (e.g., Pragmatist Camp)**
  *   **Score:** Medium.
  *   **Reasoning:** Good on Genesis-Independence and keeping stances distinct.
  *   **Weakness:** Often fails the Instantiation Requirement, treating stances as purely linguistic or cultural tools without anchoring them in physical reality. Risks making patterns *too* relative to the observer.

  **3. The Fourth "Algorithmic" Stance (Computational Realism)**
  *   **Score:** Low.
  *   **Reasoning:** Posits computation as a fundamental layer between physical and intentional.
  *   **Weakness:** Fails the Instantiation Requirement (algorithms don't exist without physics) and struggles with Noise-Tolerance (computational states are often brittle, unlike robust intentional patterns). It tries to reify the mechanism rather than the predictive pattern.

  ### Final Note
  If you were hoping for a list that preserves naive realism about beliefs while keeping physics complete, this request is confused. You can't have beliefs be "little things in the head" that are also "perfectly reducible to physics" without losing the generalization power that makes them real patterns. Dennett's move is to say the pattern is real, but it's not a *thing*; it's a way the world is organized relative to an observer. If that doesn't satisfy your ontological hunger, no theory of patterns will.
