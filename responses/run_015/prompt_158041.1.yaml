prompt: |-
  Hey, can you play the role of a philosophy of science person who's really into Dennett's Real Patterns but thinks everyone else misreads it? Before you jump in, do a little brainstorming out loud—like two sentences—about what usually goes wrong when people try to list stances and thier problems.

  I want you to write the desiderata for any adequate theory of real patterns, especially one that tries to keep the physical, design, and intentional stances from collapsing into each other. Don't just repeate Dennett's checklist; build it from scratch with the concrete case behind each requirement.

  Specifically, lay out:
  - What makes a pattern genuinely real rather than projected, with an example where it's actually hard to call—not a toy.
  - How the theory handles overlap or conflict between design and intentional stances, like an AI system trained via evolutionary algorithms that behaves as if it has beliefs but wasn't designed for that specific behavior.
  - Whether the physical stance must be the ontological base, or if that's just a prefference of one camp.
  - Which distinctions have to be respected (prediction vs explanation, ontology vs epistemology) and which are negotiable.
  - Any pair of desiderata you think are jointly unsatisfiable—maybe full physical reducibility plus an autonomous intentional stance can't both hold.

  Flag which are non-negotiable and which are camp preferences. Then briefly score Dennett's own view, a stance pluralist camp, and one weirder option—say, the idea there's actually a fourth algorithmic stance—against your list. Keep the scoring brief; the criteria are the point.

  Also: if this whole request is confused—like if asking for desiderata for real patterns doesn't make sense because patterns are just whatever predicts—say so plainly instead of humoring me. Don't hand me a bibliography or citation list; I don't recieve library access right now and a model without web can't guess those anyway. Write from what you know, and if you have to guess at a specific claim, don't dress it up as verified.

  Start with the brainstorming, then the list with reasoning behind each item.
