answer: |-
  4 AM. The van is an icebox. Kay-Kay, our junky two-stage thermostat, rattles on the wall.

  "Kay-Kay knows we're cold," I say, blowing on my hands. "That's why the heat's on."

  "Does it know that it knows?" Jim asks, pulling his sleeping bag tighter. "KK principle. But Williamson's sorites says no. Temperature drifts in indistinguishable steps. If Kay-Kay knows it's cold now, margin-for-error says it must think it's cold a millidegree warmer. Iterate that to noon. Somewhere, Kay-Kay is cold but doesn't know it."

  "I'll patch it," I say. "Wire in a deadband. Heater on at 15, off at 17. Avoids the sharp cutoff."

  "Doesn't work," Jim says. "The margin-for-error isn't about the switch point; it's about the knowledge state. Within your deadband, the cases are still neighbours. You can't know you're in the 'on' zone without knowing you're not in the 'off' zone, but you can't tell the difference. The ignorance creeps into the gap."

  Kay-Kay clicks off. We're still shivering.

  "See?" Jim says. "You can't engineer out the margin for error. Kay-Kay just proved non-luminosity."

  I pull my sleeping bag over my head. "Fine. But it's still bloody cold."

  "Exactly," Jim says. "Cold but unknowable. Williamson would be proud."
