      *Proposed Principle:* **The Historical Selection Criterion with Trait Individuation.**
      *   *Clause 1 (History):* A trait $T$ is an adaptation for function $F$ in lineage $L$ if and only if $T$'s prevalence in $L$ is causally explained by the differential reproduction of ancestors due to $F$.
