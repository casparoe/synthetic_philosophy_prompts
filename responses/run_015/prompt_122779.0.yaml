answer: |-
  Here is a principle designed to resolve the conflicts you described, followed by its application to your cases and the cost of adopting it.

  ### The Principle: Historical Selection with Variation Constraint (HSVC)

  A trait $T$ in lineage $L$ is an **adaptation for function $F$** if and only if:

  1.  **History:** The prevalence of $T$ in $L$ is causally explained by the differential reproduction of ancestors possessing $T$ due to the performance of $F$.
  2.  **Variation:** There existed heritable variation in $T$ (or a specific component of $T$) within the ancestral population, such that variants better at $F$ out-reproduced variants worse at $F$.
  3.  **Specificity:** If $T$ originated for a different function $F_{old}$, there must be evidence of *modification* or *refinement* of $T$ subsequent to the shift to $F$ that enhances $F$ beyond the baseline capacity of $F_{old}$.

  **Motivation for the Clauses:**
  *   **Clause 1 (History)** captures your core intuition: current utility is insufficient (fever could be a malfunction); the history of selection is required. This handles the *Heart* and *Sugar Craving*.
  *   **Clause 2 (Variation)** fixes your **Grain Problem**. You cannot ask if "The Heart" is an adaptation; you must ask if "Four-chamberedness" is. If there was no variation in chamber number available to selection, you cannot claim it was selected *for* that specific state in that specific window. This prevents the "everything is adapted" (coarse) and "nothing is adapted" (fine) errors by tethering the trait description to the actual variation selection acted upon.
  *   **Clause 3 (Specificity)** fixes your **Exaptation Problem** (Feathers/Panda). It distinguishes between a trait that is merely *useful* for a new job (exaptation) and a trait that was *shaped* for the new job (adaptation). It allows you to say the Panda thumb is an adaptation for stripping bamboo (it was modified/enlarged for this) but not an adaptation for being a thumb (no selection for thumb-ness per se).

  ---

  ### Verdict on the Glasshouse Skink

  **Is the plate an adaptation?**
  It is a composite verdict. You must separate the *existence* of the plate from the *size* of the plate.

  *   **Adaptation for Burrowing?** **No.**
      *   *Failure of Clause 1 & 2:* Filing it off changes nothing. There is no causal link between the plate and burrowing efficiency. Even if burrowing drove the lineage's success, this specific trait did not mediate it.
  *   **Adaptation for Infection Resistance?** **No.**
      *   *Failure of Clause 1:* It is a side effect of the material properties of the scale seam. Unless there was variation in *resistance* specifically selected for, it is a byproduct of the structure's existence.
  *   **Adaptation for Sexual Signaling?** **Yes (for male plate size).**
      *   *Success of Clause 1 & 2:* Males with bigger plates leave more offspring. There is variation (size), and it correlates with fitness.
  *   **Adaptation for the Plate's Existence?** **No.**
      *   *Failure of Clause 3:* Sister species have it. It is a developmental seam artifact. Its origin is not due to selection in this lineage.

  **Precise Verdict:** The *enlargement* of the plate in males is an adaptation for sexual signaling. The *presence* of the plate is a developmental byproduct (homologue of the sister species' scale seam) that has been co-opted. It is **not** an adaptation for burrowing or infection resistance.

  ---

  ### Verdict on Unlisted Cases

  **1. Human Taste for Narrative Storytelling**
  *   **Verdict:** **Byproduct (Spandrel) until proven otherwise.**
  *   **Reasoning:**
      *   *Clause 2 (Variation):* Can you identify heritable variation in "capacity for narrative" distinct from general language capacity, theory of mind, and memory? If narrative is just the output of these other systems running together, there is no specific variation for selection to act on.
      *   *Clause 1 (History):* While stories are useful now, did ancestors with *better* narrative specificities out-reproduce those with *worse* ones, independent of their general social intelligence?
      *   *Application:* Unless you can isolate a "story module" that varied independently of general cognition, HSVC classifies this as a byproduct of language + social cognition.

  **2. The Human Appendix (The Breaker Case)**
  *   **Verdict:** **Unclassifiable / Vestigial.**
  *   **Reasoning:**
      *   *Clause 1 (History):* It likely had a function in herbivorous ancestors (cellulose digestion).
      *   *Clause 3 (Specificity):* In humans, it is reduced. There is no evidence of *refinement* for a new function (e.g., immune reservoir) that exceeds its ancestral baseline. Recent hypotheses suggest it acts as a safe house for gut bacteria, but unless we find evidence that *variation in appendix structure* in humans was selected for *this specific immune function* (rather than just not being selected against), it remains a vestige.
      *   *Why it breaks things:* It forces you to admit that a trait can be *useful* (immune reservoir) without being an *adaptation* (selected for that use in this lineage). HSVC holds the line here, but it conflicts with the intuition that "useful = adaptation."

  ---

  ### The Cost: Which Verdicts You Must Drop

  To use HSVC consistently, you must abandon or revise three of your current intuitions.

  **1. You must drop the intuition that "Feathers are an adaptation for flight."**
  *   **Why:** HSVC Clause 3. Feathers existed before flight.
  *   **The Fix:** You must say: "Filamentous feathers were an adaptation for insulation/display. *Flight feathers* (with specific asymmetry and locking mechanisms) are an adaptation for flight."
  *   **Cost:** You lose the ability to speak loosely about "Bird Feathers" as a single unit. You must individuate the trait to the specific morphological change that coincided with the shift in function. If you keep the broad verdict, you violate Clause 3.

  **2. You must accept that Female Orgasm is likely a Byproduct (homologue of male orgasm).**
  *   **Why:** HSVC Clause 2. Male orgasm is clearly tied to reproduction (ejaculation). Female orgasm shares the developmental pathway (homology). Unless you can demonstrate heritable variation in *female* orgasmic capacity that correlates with fitness *independently* of male homology (e.g., specific uterine contractions aiding sperm retention that vary independently of the neural reward pathway), it fails the Variation constraint.
  *   **Cost:** This contradicts your gut feeling ("I really don't want to call it a spandrel"). HSVC forces you to admit that structural similarity to a male adaptation, without evidence of female-specific refinement, makes it a byproduct. To save it as an adaptation, you must find the specific variation selection acted upon.

  **3. You must lower confidence on "Fever" unless you distinguish Mechanism from Symptom.**
  *   **Why:** HSVC Clause 1. Heat itself is not the trait; the *thermoregulatory set-point shift* is the trait.
  *   **Cost:** If fever is just the body overheating because the immune system generates heat (like a car engine), it is a byproduct. It is only an adaptation if the hypothalamus was selected to *raise* the set-point specifically to kill pathogens. You cannot call "Fever" an adaptation; you can only call "The Set-Point Shift Mechanism" an adaptation. If that mechanism doesn't exist (if it's just uncontrolled heat), your verdict must change to "Byproduct."

  ### Summary of the Trade
  The HSVC principle protects you from "Just-So Stories" (Stotting, Chin) by demanding evidence of **Variation** and **History**. However, it costs you **Generality**. You can no longer say "Feathers are for flight" or "Orgasm is for bonding." You must say "Specific feather modifications are for flight" and "Specific female reproductive variations *might* be for bonding, but currently look like byproducts."

  If you value precision over intuitive labeling, adopt HSVC. If you value intuitive labeling, you must accept that your "adaptation" claims are often actually "exaptation" or "current utility" claims, and rename them accordingly.
