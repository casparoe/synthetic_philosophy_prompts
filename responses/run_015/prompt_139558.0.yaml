  # Diagnostic Handout: The Is-Ought Derivation Tree

  **Instructions:** This instrument sorts philosophical positions based on how they handle the move from descriptive facts to normative conclusions. Begin with the shared commitment that the judgment *"Torturing a child for amusement is wrong"* is correct. Answer the following questions based on how you understand the logic of that judgment and similar derivations. Do not worry about which philosopher holds which view; follow the logic.

  ### The Decision Tree

  **Node 1: Truth-Aptitude**
  Is the statement "Torturing a child for amusement is wrong" capable of being literally **true or false**, in the same way that "Snow is white" is true or false?
  *   **No** → Go to Node 2.
  *   **Yes** → Go to Node 3.

  **Node 2: Quasi-Realist Commitment**
  (If No to Node 1) Even if not literally true, are we legitimately entitled to speak and reason **as if** there are moral truths in serious discourse?
  *   **No** → **Leaf A: Non-cognitivist Projectivism**
  *   **Yes** → **Leaf B: Quasi-realist Expressivism**

  **Node 3: Truth-Maker**
  (If Yes to Node 1) Is there any **feature of the world** that makes this statement true?
  *   **No** → **Leaf C: Error Theory**
  *   **Yes** → Go to Node 4.

  **Node 4: Source of Normativity**
  (If Yes to Node 3) Does the truth of this judgment depend on what the agent **values, chooses, or is committed to** as a practical agent?
  *   **Yes** → Go to Node 4a.
  *   **No** → Go to Node 5.

  **Node 4a: Standpoint Universality**
  (If Yes to Node 4) Is the relevant standpoint one that **no rational agent could reject**, or is it contingent on what the agent happens to care about?
  *   **Contingent/Actual Values** → **Leaf D: Humean/Pragmatic Constructivism**
  *   **Rational/Universal Standpoint** → **Leaf E: Kantian Constructivism**

  **Node 5: Naturalism**
  (If No to Node 4) Is the property that makes the judgment true identical to a property **describable by natural science** (e.g., biology, psychology)?
  *   **No** → **Leaf F: Moorean Non-naturalism**
  *   **Yes** → Go to Node 6.

  **Node 6: Analytic Reduction**
  (If Yes to Node 5) Is the connection between the scientific property and 'wrong' fixed **by the meanings of the words** (analytic)?
  *   **Yes** → **Leaf G: Reductive/Analytic Ethical Naturalism**
  *   **No** → Go to Node 7.

  **Node 7: Institutional Constitution**
  (If No to Node 6) Is the 'ought' in the conclusion derived from the **internal standards of a specific practice, artifact, or institution**?
  *   **Yes** → **Leaf H: Institutional/Functional Normativity**
  *   **No** → Go to Node 8.

  **Node 8: Life-Form Evaluation**
  (If No to Node 7) Is the normativity grounded in the evaluation of a living thing against its **specific biological life-form**?
  *   **Yes** → **Leaf I: Neo-Aristotelian Naturalism**
  *   **No** → Go to Node 9.

  **Node 9: Naturalistic Bridge**
  (If No to Node 8) Is the bridge between the descriptive fact and the normative conclusion knowable **a posteriori** (through investigation)?
  *   **No** → **Leaf J: [Empty Cell]**
  *   **Yes** → **Leaf K: Non-reductive (Synthetic) Ethical Naturalism**

  ---

  ### Probe Derivation Analysis

  *The following six derivations test the logical commitments of the leaves. Each probe reaches a specific Node where views diverge on its validity.*

  **Probe 1: The Bread Knife**
  *Premises:* This blade was designed for slicing bread; it shreds the crumb. *Conclusion:* It is a bad bread knife.
  *   **Reaches Node 7.**
  *   **Status:** **Valid** for Leaf H (Institutional); **Enthymeme** for Leaves F, I, K (requires bridge that function dictates goodness); **Invalid** for Leaf C (Error Theory).
  *   **Why:** Leaf H treats functional norms as constitutive of the object's identity; others treat them as external standards.

  **Probe 2: The Promise**
  *Premises:* Amara said "I promise" in an established practice. *Conclusion:* She ought to pay.
  *   **Reaches Node 7.**
  *   **Status:** **Valid** for Leaf H; **Enthymeme** for Leaves D, E (requires commitment to promise-keeping); **Invalid** for Leaf F, K (requires moral bridge).
  *   **Why:** Only Leaf H sees the 'ought' as internal to the institutional fact of promising itself.

  **Probe 3: The Train**
  *Premises:* Viren wants to be in Leeds by six; the last train departs at four. *Conclusion:* He should take the four o'clock train.
  *   **Reaches Node 4.**
  *   **Status:** **Valid** for Leaves D, E (Constructivism); **Enthymeme** for Leaves F, K (requires "You ought to pursue your ends"); **Invalid** for Leaf F (if 'ought' is categorical).
  *   **Why:** Constructivists ground reasons in the agent's practical standpoint; Categorical views require a further normative premise.

  **Probe 4: The Infant**
  *Premises:* Human offspring fare badly without care. *Conclusion:* Parents ought to care for infants.
  *   **Reaches Node 8.**
  *   **Status:** **Valid** for Leaf I (Aristotelian); **Enthymeme** for Leaf K (Synthetic Naturalism); **Invalid** for Leaf F (Moorean).
  *   **Why:** Leaf I sees biological facts as inherently normative for life-forms; others see a gap between biological function and moral obligation.

  **Probe 5: The Testimony**
  *Premises:* No society persists without expectation of truthfulness. *Conclusion:* One ought not to lie under oath.
  *   **Reaches Node 7/8.**
  *   **Status:** **Enthymeme** for Leaf H (needs "You ought to sustain society"); **Invalid** for Leaf F (Moorean).
  *   **Why:** Sociological facts alone do not generate norms without a prior commitment to social stability (Node 7) or function (Node 8).

  **Probe 6: The Suffering**
  *Premises:* Procedure inflicts suffering; no one desires it. *Conclusion:* It is wrong.
  *   **Reaches Node 5/6.**
  *   **Status:** **Valid** for Leaf G (Analytic Naturalism); **Enthymeme** for Leaf K (Synthetic Naturalism); **Invalid** for Leaf F (Moorean).
  *   **Why:** Leaf G defines 'wrong' as 'causes suffering'; Leaf K sees a synthetic link; Leaf F sees an unbridgeable gap.

  ---

  ### Leaf Specifications

  | Leaf | View | Accepts Probes | Refuses Probes | Awkward Commitment |
  | :--- | :--- | :--- | :--- | :--- |
  | **A** | **Projectivism** | None (All express attitudes) | All (As truth-claims) | Must explain why moral argument isn't just shouting. |
  | **B** | **Quasi-Realism** | All (As internal logic) | None (As literal truth) | Must explain how to earn the right to 'truth' without facts. |
  | **C** | **Error Theory** | None | All (Conclusions false) | Must explain why we shouldn't just stop using moral language. |
  | **D** | **Humean Construct.** | 3 | 1, 2, 4, 5, 6 (Without desire) | Makes morality contingent on what agents happen to value. |
  | **E** | **Kantian Construct.** | 3 | 1, 2 (As external) | Must prove there is only one rational standpoint available. |
  | **F** | **Moorean** | None (As written) | All (Gap is logical) | Makes moral knowledge mysterious and epistemically isolated. |
  | **G** | **Analytic Natural.** | 6 | 1, 2, 4, 5 (As moral) | Makes substantive moral disputes into verbal definitions. |
  | **H** | **Institutional** | 1, 2 | 4, 5, 6 (As institutional) | Struggles to condemn corrupt institutions from the outside. |
  | **I** | **Neo-Aristotelian** | 4 | 3, 6 (As biological) | Risks deriving conservative norms from contested biology. |
  | **K** | **Synthetic Natural.** | 6 (Enthymeme) | 1, 2 (As moral) | Must explain the metaphysical 'glue' binding natural to normative. |

  *(Note: Leaf J is the Empty Cell)*

  ---

  ### Structural Notes

  **1. The Empty Cell (Leaf J)**
  *   **Location:** Node 9 (Naturalistic Bridge) → Answer: **No** (A Priori).
  *   **Status:** **Incoherent.**
  *   **Reason:** A view that claims moral properties are natural (Node 5) but the link is knowable a priori (Node 9) collapses into Analytic Naturalism (Leaf G); claiming it is Synthetic yet A Priori is metaphysically untenable in this framework.

  **2. Indistinguishable Pairs**
  *   **Pair 1: Leaf A (Projectivism) vs. Leaf C (Error Theory).**
      *   **Why:** Both treat moral judgments as failing to state literal truths.
      *   **Separation Question:** "Is the statement 'Torture is wrong' meaningful?" (Projectivism says yes, Error Theory says meaningful but false).
      *   **Unsuitability:** In a 10-minute exercise, students conflate "not true" with "meaningless," making Node 1 unreliable for this distinction.
  *   **Pair 2: Leaf I (Aristotelian) vs. Leaf K (Synthetic Naturalism).**
      *   **Why:** Both accept Probe 4 (Infants) as valid or near-valid based on natural facts.
      *   **Separation Question:** "Is 'human flourishing' a biological fact or a moralized interpretation of biology?"
      *   **Unsuitability:** Requires deep metaphysical biology knowledge unsuitable for a quick diagnostic; students often answer based on intuition rather than theory.

  ---

  ### Routing Table & Worked Path

  **Routing Table (Answer Patterns)**
  *   **A:** 1-No, 2-No
  *   **B:** 1-No, 2-Yes
  *   **C:** 1-Yes, 3-No
  *   **D:** 1-Yes, 3-Yes, 4-Yes, 4a-Contingent
  *   **E:** 1-Yes, 3-Yes, 4-Yes, 4a-Rational
  *   **F:** 1-Yes, 3-Yes, 4-No, 5-No
  *   **G:** 1-Yes, 3-Yes, 4-No, 5-Yes, 6-Yes
  *   **H:** 1-Yes, 3-Yes, 4-No, 5-Yes, 6-No, 7-Yes
  *   **I:** 1-Yes, 3-Yes, 4-No, 5-Yes, 6-No, 7-No, 8-Yes
  *   **J:** 1-Yes, 3-Yes, 4-No, 5-Yes, 6-No, 7-No, 8-No, 9-No **(Empty)**
  *   **K:** 1-Yes, 3-Yes, 4-No, 5-Yes, 6-No, 7-No, 8-No, 9-Yes

  **Worked Path Example**
  *   **Student Intuition:** Believes "Torture is wrong" is a fact (Node 1: Yes). Believes this fact depends on the suffering caused, which is a scientific fact (Node 3: Yes, Node 5: Yes). Denies that 'wrong' just *means* 'suffering' (Node 6: No). Denies this is about institutions (Node 7: No) or biology specifically (Node 8: No). Believes we learn this link through experience (Node 9: Yes).
  *   **Path:** 1-Yes → 3-Yes → 5-Yes → 6-No → 7-No → 8-No → 9-Yes.
  *   **Result:** **Leaf K: Non-reductive (Synthetic) Ethical Naturalism.**
