  Here is the thinking process behind the reconstruction.

  ### Step 1: Brainstorming Candidate Reconstructions

  I see three plausible ways to model what inquiry reports are doing when they list multiple causes, identify a single root, and simultaneously claim the outcome was overdetermined ("would have happened anyway").

  **Candidate 1: The INUS/Regularist Model.**
  This view treats causes as Insufficient but Non-redundant parts of Unnecessary but Sufficient conditions. The "list of causes" represents the conjuncts of a complex sufficient condition actualized in the world. The "root cause" is simply the most salient or manipulable INUS condition.
  *   *Why it fits:* It explains why we list many factors (they are all part of the sufficient set) and why we don't require strict necessity (the condition itself is unnecessary).
  *   *Why I'm dropping it:* It fails to explain the "would have happened anyway" claim. If X is a non-redundant part of the actual sufficient set, saying "the outcome would have occurred without X" implies there was *another* sufficient set ready to go. INUS handles the structure of the list, but it doesn't explain the normative shift to blame. Under INUS, if X is part of the actual minimal sufficient set, it bears equal logical weight to Y. It doesn't explain why we dilute responsibility for X once we learn Y was also sufficient. INUS is a logical structure, not a pragmatic guide for blame allocation.

  **Candidate 2: The Contrastive Difference-Making Model.**
  This view holds that causation is always relative to a contrast class (e.g., "Why this crash rather than no crash?" vs. "Why this crash rather than a delay?"). The "list" answers one contrast, the "root cause" answers another.
  *   *Why it fits:* It elegantly handles the shifting focus. The list explains the *occurrence* against the background of normal operations. The root cause explains the *occurrence* against the background of preventable scenarios.
  *   *Why I'm dropping it:* It struggles with the "would have happened anyway" clause. If the contrast is "Crash vs. No Crash," and the crash would have happened anyway (due to backup failure), then the specific factor cited is not a difference-maker for that contrast. A strict contrastive view would have to say "X is not a cause relative to the contrast Crash/No-Crash." The reports say "X is a cause" *and* "Crash would have happened without X." They are asserting causal status despite admitting a lack of difference-making power for the main event.

  **Candidate 3: The Pragmatic Interventionist Hybrid (Selected).**
  This view posits that the practice conflates two distinct concepts under the label "cause": (1) *Causal Contribution to Risk* (ontological/explanatory) and (2) *Causal Leverage for Prevention* (normative/pragmatic).
  *   *Why it fits:* It explains the non-zero-sum list (adding risk factors improves the explanation of system fragility) and the zero-sum root cause (we need a single point of intervention). It explains the "would have happened anyway" line as admitting low counterfactual dependence while maintaining high risk contribution. It explains the blame tension: we treat causes as additive for understanding, but scarce for responsibility.
  *   *Why I'm committing to it:* It is the only model that accounts for the *normative* shift between the "Causes" section and the "Recommendations" section without declaring the report incoherent. It treats the contradiction as a feature, not a bug, serving different social functions.

  ### Step 2: Developing the Argument

  The practice you describe presupposes a **Pragmatic Interventionist Hybrid**. It is not operating on a single metaphysical theory of causation. Instead, it is toggling between an *explanatory mode* and a *prescriptive mode*.

  In the **explanatory mode** (the bullet list), causation is treated as **non-zero-sum**. Here, a "cause" is effectively a "risk factor" or a "fragility indicator." When writers say "even if maintenance had been followed, the failure would probably still have occurred," they are not denying that the lack of maintenance was a cause. They are denying it was *necessary*. In this mode, the goal is to map the topology of the disaster. Adding causes makes the map more accurate. The "redundancy discount" is **no** here. Knowing there was a backup failure doesn't make the primary failure less of a cause; it makes the system look *more* causally saturated with danger, which is explanatory gold.

  In the **prescriptive mode** (the root cause and blame), causation is treated as **zero-sum**. Here, a "cause" is a "handle for intervention." If the outcome would have happened anyway, the leverage of any single factor drops. This is where the redundancy discount kicks in. If I know the brake failure would have killed us even if the signal worked, my blame on the signal operator diminishes, even if the signal *was* failed. We switch to a zero-sum model because resources for prevention and moral culpability are finite. We cannot fix everything, so we must identify the *root*—defined not as the ontologically strongest driver, but as the node with the highest leverage-to-cost ratio.

  **The Role of INUS:**
  You asked about INUS conditions. In this practice, INUS logic does the heavy lifting for the **bullet list**. It justifies why we list "staff fatigue" alongside "signal failure." Neither is sufficient alone; both are unnecessary (the crash could have happened other ways); but together they formed a sufficient set. However, INUS **does not settle** the "root cause" selection. Logic cannot tell you which INUS condition is the "root." That selection is purely pragmatic (which one can we fix cheapest?). Nor does INUS resolve the blame tension. Logically, all INUS conditions are equal partners in the sufficient set. The practice treats them unequally for blame. So INUS is compatible with the list, but silent on the politics of the report.

  **The Sharpest Tension:**
  The practice contradicts itself at the moment it uses counterfactual independence to dilute blame while maintaining causal status. The report asserts: "A is a cause of Disaster D" (Explanatory Mode). It then asserts: "If not-A, D would still have occurred" (Counterfactual Claim). Finally, it implies: "Therefore, Agent responsible for A is less blamable" (Prescriptive Mode).
  The tension is that the second claim logically undermines the first in standard difference-making theories, yet the third claim relies on the second to reduce responsibility while the first maintains the stigma of causation. They are using "cause" to mean "contributor to risk" in the first instance and "difference-maker" in the third, without acknowledging the switch.

  **The Rival View:**
  The strongest rival is **Strict Counterfactual Dependence** (a la Lewis, without the bells and whistles for overdetermination). Under this view, if D would have happened without A, then A is not a cause of D.

  **Report Under Rival:**
  A report written under Strict Counterfactual Dependence would look radically different. The "Causes" section would be much shorter, excluding any systemic factor where redundancy existed. The "Root Cause" would likely be undefined in cases of overdetermination (since no single factor was necessary), or it would arbitrarily select the earliest necessary condition in the chain. Crucially, it could not coherently argue that "A caused this" while admitting "this would have happened without A." It would have to say "A was part of a sufficient set, but not a cause."

