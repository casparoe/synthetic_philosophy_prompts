  **Prescriptive Mode (Zero-Sum)**
  In the "Recommendations" and "Blame" sections, causation is treated as **zero-sum**. Here, a "cause" is a "handle for intervention." If the outcome would have happened anyway, the leverage of any single factor drops. This is where the redundancy discount kicks in. If I know the brake failure would have killed us even if the signal worked, my blame on the signal operator diminishes, even if the signal *was* failed. We switch to a zero-sum model because resources for prevention and moral culpability are finite. We cannot fix everything, so we must identify the *root*—defined not as the ontologically strongest driver, but as the node with the highest leverage-to-cost ratio.

  **The Role of INUS**
  You asked what work INUS conditions actually do here. INUS logic does the heavy lifting for the **bullet list**. It justifies why we list "staff fatigue" alongside "signal failure." Neither is sufficient alone; both are unnecessary (the crash could have happened other ways); but together they formed a sufficient set. However, INUS **does not settle** the "root cause" selection. Logic cannot tell you which INUS condition is the "root." That selection is purely pragmatic (which one can we fix cheapest?). Nor does INUS resolve the blame tension. Logically, all INUS conditions are equal partners in the sufficient set. The practice treats them unequally for blame. So INUS is compatible with the list, but silent on the politics of the report.

  ### 3. The Sharpest Tension

  The practice contradicts itself at the moment it uses counterfactual independence to dilute blame while maintaining causal status. The report asserts: "A is a cause of Disaster D" (Explanatory Mode). It then asserts: "If not-A, D would still have occurred" (Counterfactual Claim). Finally, it implies: "Therefore, Agent responsible for A is less blamable" (Prescriptive Mode).

  The tension is that the second claim logically undermines the first in standard difference-making theories, yet the third claim relies on the second to reduce responsibility while the first maintains the stigma of causation. They are using "cause" to mean "contributor to risk" in the first instance and "difference-maker" in the third, without acknowledging the switch.

  ### 4. The Rival View

  The strongest rival is **Strict Counterfactual Dependence** (a la Lewis, without the bells and whistles for overdetermination). Under this view, if D would have happened without A, then A is not a cause of D.

  **Report Under Rival**
  A report written under Strict Counterfactual Dependence would look radically different. The "Causes" section would be much shorter, excluding any systemic factor where redundancy existed. The "Root Cause" would likely be undefined in cases of overdetermination (since no single factor was necessary), or it would arbitrarily select the earliest necessary condition in the chain. Crucially, it could not coherently argue that "A caused this" while admitting "this would have happened without A." It would have to say "A was part of a sufficient set, but not a cause."

