  # Stage Five: Instructions for the Group

  1.  **Take the Quiz:** Answer the ten questions individually.
  2.  **Map Your Vector:** Tally your A/B/C responses against the Vector definitions in the Scoring Key.
  3.  **Find Your Leaf:** Locate the named position that matches your profile.
  4.  **Read the Commitment:** Confront the "Awkward Commitment" listed for your leaf.
  5.  **Discuss:** If you landed on a Collapse, argue with your neighbor about whether your rhetorical stance actually changes your predictions. If you landed in an Empty Cell, check your math; you are holding contradictory beliefs.
