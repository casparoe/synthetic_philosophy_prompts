answer: |-
  A philosopher is on trial for obstruction of justice.
  Judge: "You testified, 'I have no idea where the funds went.'"
  Philosopher: "Yes, but that's a false assertion about my mental state, not the funds. I merely misled the court. It's morally distinct from lying."
  Judge: "So you admit you intended to deceive us."
  Philosopher: "I intended to mislead. The moral weight is lighter."
  Judge: "I see. Well, I could sentence you to ten years, or I could merely mislead you into believing you're free to go."
  Philosopher: "You can't do that!"
  Judge: "Why not? If there's no moral difference, you shouldn't mind the deception."
  Philosopher: "Because I'd still be in prison!"
  Judge: "Exactly. And we're still obstructed. Bailiff, take him away."

  This joke takes the side that **there is no significant moral difference** between lying and misleading. The punchline commits to this by showing the philosopher rejecting the "mere misleading" defense when applied to his own freedom, proving that the intent to deceive and the harmful consequence matter more than the semantic classification of the assertion.
