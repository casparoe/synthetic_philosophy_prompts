      *   *The Classmate's Point:* If critical history is disguised monumental history, it is selecting fragments to glorify the present. The Professor says this is bad (sustains inherited self-image). But Nietzsche says Monumental history *is* good (inspires action). So if Critical is actually Monumental, is it bad? Only if the *Monumental* use is distorted. The classmate's point is about *honesty* and *function*. The Professor's point is about *telos* (new vs. old).
