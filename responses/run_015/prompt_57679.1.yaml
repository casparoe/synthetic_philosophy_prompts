prompt: |-
  I am trying to work out what I actually believe about moral progress by going through my own verdicts on particular cases, and I would like to know what principle, if any, they add up to. Please write in American English, and please do not give me a bibliography or a list of further reading — I want the account and the reasoning behind it.

  For orientation: I find the expanding-circle picture attractive — moral history as a widening of the set of beings whose interests count — but I do not think it captures what I mean by progress, because I am willing to call some widenings regressions and some narrowings neutral. So I have been working with three distinctions of my own coinage, and I will flag which one I think is in play as I go:

  - **Scope**: how many beings, or how many interests, sit inside the circle.
  - **Cost**: how much a society is actually prepared to give up on behalf of those already inside it.
  - **Retention**: whether a moral commitment survives the disappearance of the conditions that produced it.

  My tentative principle, which I expect is wrong in its details: progress is a change in which scope widens, the widening is at least partly caused by reasons that survive scrutiny, and the widened commitment is retained after the conditions that enabled it lapse.

  Here are my verdicts.

  1. The European abandonment of judicial torture, and the abolition of Atlantic chattel slavery, and the disappearance of footbinding: all genuine progress. The third matters to me especially, because it seems to have required no new metaphysics and no new argument — only a change in what people could bear to watch.

  2. The growth of serious moral concern for nonhuman animals over the last two generations: progress in the making. I am not willing to say yet that it *is* progress, because I do not know whether it will hold.

  3. Suppose that moral concern for sophisticated conversational systems widens along exactly the route I praised in case 2 — perspective-taking, narrative, testimony from the beings themselves — and suppose the belief underlying it is false, because there is nothing it is like to be one of them. My verdict: not progress, even though scope widened and the mechanism is the one I approve of elsewhere.

  4. The intensification of moral condemnation aimed at speech that is offensive but injures no identifiable person. Scope has apparently widened (new claimants, new standing interests in dignity) and cost has risen sharply (people lose jobs and friendships). I do not call this progress, and if pressed I would call it a moralized status competition wearing the costume of an expanding circle.

  5. The old prohibition on speaking ill of the dead, and the broader idea that the deceased have interests that the living can wrong. This has faded, and I regard the fading as neutral or a small improvement. So here is a contraction of scope that I am happy about.

  6. The erosion of the postwar welfare consensus in the 1980s. Scope did not change at all; the same people were inside the circle; what collapsed was cost. I call this a real moral loss, and I want to say the circle can shrink along the cost dimension even though it seems almost never to shrink along the scope dimension. That asymmetry looks like special pleading to me, and I do not know whether to keep it.

  7. Concern for the far future — for people who will exist in ten thousand years. This is the case I keep going back and forth on. Scope has plainly widened. But I suspect the widening is caused by an artifact: we can picture the deep future at all only because we happen to have models, graphs, and probability estimates that make it thinkable. I do not want to say that a widening produced by a change in our representational technology is thereby moral progress, and yet I cannot say what is different about it and case 1.

  8. If a society abolished slavery and then, two generations later, restored it when labor grew scarce, I think I would say the abolition had not been progress after all. But I say flatly that British abolition *was* progress, and nobody is in a position to test its retention. So retention seems to be a condition I insist on in the hypothetical and quietly waive in the actual case.

  9. The abolition of slavery was, on the histories I trust, substantially driven by economic change and shifts in power rather than by moral argument. I still call it progress. At the same time, I want to say that a change brought about purely by interest, with no moral insight anywhere in its causal history, would not be progress. I cannot see how to hold both.

  What I would like from you:

  - Either repair my tentative principle or replace it, and state the result clause by clause, each clause precise enough that I could tell whether a given historical change satisfies it. For each clause, say which of the cases above forces it on me.
  - Give the resulting account's verdict on every one of the nine cases, including the ones where I expect it to contradict me.
  - Tell me honestly which of my verdicts the account cannot accommodate, and which it obliges me to give up; where you think a verdict should be surrendered rather than saved, make the case for surrendering it.
  - Say whether scope, cost, and retention are doing real theoretical work, or whether they are a redescription of a single underlying variable that I have not named.
  - Finally, apply the account to one case I have not listed. Choose it adversarially: pick the case that makes the account look worst, not the one it handles most gracefully.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Goal:** The user wants to clarify their belief about "moral progress" based on nine specific case verdicts they have provided. They want a principled account that explains these verdicts.
      *   **Constraints:** Write in American English. No bibliography or list of further reading. Just the account and reasoning.
      *   **User's Framework:** They distinguish between *Scope* (who counts), *Cost* (what we give up), and *Retention* (does it stick when conditions change?).
      *   **User's Tentative Principle:** Progress = Scope widens + caused by reasons that survive scrutiny + commitment retained after enabling conditions lapse.
      *   **Task:**
          1.  Repair or replace the tentative principle (clause by clause, citing cases).
          2.  Apply the new account to all nine cases (including contradictions).
          3.  Identify which verdicts must be surrendered and argue for surrender.
          4.  Analyze whether Scope, Cost, and Retention are distinct or reducible.
          5.  Apply the account to one adversarial case not listed.

  2.  **Analyze the Nine Cases & User's Verdicts:**
      1.  *Torture/Slavery/Footbinding:* Progress. (Footbinding: aesthetic/sensory shift, not metaphysics).
      2.  *Animal Concern:* Progress *if* it holds (Retention matters).
      3.  *AI/Conversational Systems:* Not progress if belief is false (Truth matters).
      4.  *Offensive Speech:* Not progress (Status competition, high cost, dubious scope).
      5.  *Speaking Ill of Dead:* Contraction is neutral/improvement (Scope contraction can be good).
      6.  *Welfare Erosion:* Moral loss (Cost dimension matters, even if Scope constant).
      7.  *Far Future:* Ambivalent. Scope widened, but via "representational technology" (models/graphs). Worried this is artificial compared to Case 1.
      8.  *Hypothetical Slavery Restoration:* If restored, original abolition wasn't progress. But British abolition *is* progress now (Retention condition is tricky: counterfactual vs. actual).
      9.  *Causal History of Abolition:* Driven by economics/power, not argument. Still progress. But purely interest-driven change without moral insight = not progress. (Tension between causal history and outcome).

  3.  **Diagnose the Tensions/Problems in User's View:**
      *   *Truth vs. Effect:* Case 3 says false belief = no progress. Case 9 says non-moral causes (economics) = still progress. How to reconcile? It seems the *justification* must be soundable, even if the *cause* wasn't philosophical.
      *   *Retention:* Case 2 & 8 suggest progress depends on the future (will it stick?). Case 1 says past events *are* progress now. This creates a "temporal instability" problem. If progress depends on retention, we can't know if we are progressing until it's too late.
      *   *Scope vs. Cost:* Case 6 says Cost reduction = loss. Case 5 says Scope reduction = gain. So Scope isn't the sole metric.
      *   *The "Artifact" Worry:* Case 7 worries that new *tools* (graphs) aren't moral *reasons*. But Case 1 (footbinding) suggests sensory shifts *are* enough. What's the difference?
      *   *The "Status Competition" Worry:* Case 4 rejects scope widening if it's just status. How to distinguish status from genuine moral insight?

  4.  **Develop the Principle (Repair/Replace):**
      *   *Current Principle:* Scope widens + reasons survive scrutiny + retained.
      *   *Problem:* Doesn't account for Cost (Case 6) or Scope Contraction (Case 5). Doesn't handle the "False Belief" issue (Case 3) vs. "Non-Moral Cause" issue (Case 9) clearly.
      *   *Proposed Principle:* **Robust Moral Progress.**
      *   *Clause 1 (Alignment):* The change must align moral practice with the *actual* moral status of the beings involved. (Addresses Case 3: AI has no status, so no progress. Addresses Case 5: Dead have no interests, so contraction is good).
      *   *Clause 2 (Sacrifice/Cost):* The change must involve a net willingness to sacrifice self-interest for the sake of that alignment. (Addresses Case 6: Welfare loss is a loss of sacrifice. Addresses Case 4: Status competition is self-interest masquerading as morality).
      *   *Clause 3 (Stability/Retention):* The alignment must be stable against the removal of the specific historical pressures that initiated it. (Addresses Case 2, 7, 8. Distinguishes "tools" from "reasons" in Case 7—if the models vanish, does the concern remain? If yes, it's progress).
      *   *Refinement on Causation (Case 9):* The *sustainment* must rely on moral reasons, even if the *initiation* was economic. This solves the tension.

  5.  **Drafting the Clauses (Iterative refinement):**
      *   *Clause 1 (Truth/Status):* Progress requires that the new moral boundary tracks a mind-independent moral truth (or at least, a non-false claim about suffering/agency). *Forced by Case 3 (AI) and Case 5 (Dead).*
      *   *Clause 2 (Cost/Sacrifice):* Progress requires a net increase in the aggregate cost society bears to honor those claims, excluding costs that are merely signaling or status competition. *Forced by Case 4 (Speech) and Case 6 (Welfare).*
      *   *Clause 3 (Retention/Independence):* The commitment must persist when the instrumental or technological conditions that made the claim visible are removed. *Forced by Case 7 (Future/Graphs) and Case 8 (Restoration).*

      *Wait, Case 9 (Causation):* The user says economics drove abolition, but it's still progress. But purely interest-driven isn't.
      *Adjustment:* The *maintenance* of the norm must be justifiable by moral reasons accessible to agents, even if the *origin* was contingent.
      *Let's integrate this into Clause 3.*

      *Revised Principle:* **Moral Progress is a change in social practice that (1) better aligns treatment with the actual moral standing of the affected parties, (2) imposes a net non-signaling cost on the benefactors, and (3) is sustained by reasons that do not depend on the transient conditions of its origin.**

  6.  **Testing Against Cases:**
      1.  *Slavery/Torture:* Aligns (humans have standing), Costs (economic loss), Sustained (mostly). -> Progress.
      2.  *Animals:* Aligns (likely), Costs (diet/industry), Sustained? (Unknown). -> Provisional Progress.
      3.  *AI:* Fails (1). No actual standing. -> Not Progress.
      4.  *Offensive Speech:* Fails (1) (no identifiable injury/standing) & Fails (2) (Status competition). -> Not Progress.
      5.  *Dead:* Aligns (dead have no standing), Cost (lowered). -> Progress (via contraction).
      6.  *Welfare:* Fails (2). Cost lowered without change in standing. -> Regress.
      7.  *Far Future:* Aligns (future people have standing). Cost (high). Sustained? If it relies *only* on graphs, it fails (3). If graphs just revealed what was always there, it passes. -> Ambivalent (depends on depth of conviction).
      8.  *Hypothetical Restoration:* If restored, it proves (3) failed originally. -> Consistent with user's worry.
      9.  *Causal History:* Origin (economic) doesn't matter if (1), (2), (3) are met by the *norm* itself. -> Resolves tension.

  7.  **Addressing Scope, Cost, Retention:**
      *   Are they distinct?
      *   Scope is about *Target* (Clause 1).
      *   Cost is about *Motivation/Sincerity* (Clause 2).
      *   Retention is about *Robustness* (Clause 3).
      *   They are distinct dimensions of the same phenomenon (Robust Alignment). They aren't reducible to one variable, but they aren't independent goods either. High Scope + Low Cost = Status signaling (Case 4). High Cost + False Scope = Tragic Waste (Case 3).

  8.  **Identifying Surrenders:**
      *   *Case 8 (The Counterfactual):* The user says if slavery returned, the abolition *wasn't* progress. My account agrees (Retention failed). But the user also says British abolition *is* progress now. This implies progress is provisional. The user must surrender the idea that progress is a permanent property of the past. It is a status that can be revoked by future collapse.
      *   *Case 7 (Representational Tech):* The user worries graphs aren't moral reasons. My account says if the concern vanishes when graphs are gone, it wasn't progress. The user must accept that *epistemic tools* can be vehicles for moral progress if they reveal truth, but if they are the *only* support, it's fragile.
      *   *Case 1 (Footbinding):* User says "no new argument... only what people could bear to watch." My account requires "Alignment with Standing." Does disgust align with standing? I need to argue that sensory revulsion at cruelty is a valid proxy for moral truth, even without metaphysics.

  9.  **Adversarial Case:**
      *   Need something that looks like progress but fails the test, or looks like regress but passes.
      *   *Idea:* "Effective Altruism" style giving? No, too contentious.
      *   *Idea:* The shift from institutionalization to deinstitutionalization of the mentally ill.
      *   *Why:* Scope widened (community inclusion), Cost shifted (families vs state), Retention shaky (homelessness/prison pipeline).
      *   *Better Adversarial Case:* **The abolition of the death penalty.**
      *   *Why:* Scope (criminals still human), Cost (state loses retributive tool/safety risk), Retention (some countries revert).
      *   *Even Better:* **The rise of "Helicopter Parenting" / Intensive Child Rearing.**
      *   *Why:* Scope (children's interests paramount), Cost (huge parental sacrifice), Retention (seems sticky). But is it progress? Or anxiety-driven status competition?
      *   *Best Adversarial Case:* **The shift to no-fault divorce.**
      *   *Why:* Looks like liberty (progress). But maybe increases cost for vulnerable partners (children/spouses).
      *   *Let's go with:* **The criminal justice shift from rehabilitation to retribution (or vice versa).**
      *   *Actually, let's pick:* **The modern prohibition on corporal punishment of children.**
      *   *Why:* Scope (children included), Cost (parents lose disciplinary tool), Retention (mixed globally). It challenges the "Cost" clause—is it real sacrifice or just shifting control to the state?
      *   *Decision:* **The deinstitutionalization of the mentally ill (mid-20th century).** It fits the "Scope/Cost/Retention" framework perfectly and exposes the flaws. It looked like progress (Scope: community inclusion), Cost: (theoretically high, practically shifted to families), Retention: (failed, led to homelessness). It forces a hard "Regress" verdict on something often hailed as Progress.

  10. **Refining the Output:**
      *   Ensure American English.
      *   No bibliography.
      *   Tone: Analytical, direct, slightly philosophical but grounded.
      *   Structure: Principle -> Case Verdicts -> Surrenders -> Scope/Cost/Retention Analysis -> Adversarial Case.

  11. **Self-Correction/Review during drafting:**
      *   *Check Case 9:* Did I resolve the "economic cause vs moral insight" tension? Yes, by distinguishing *origin* from *sustenance*.
      *   *Check Case 7:* Did I address the "graphs" worry? Yes, by framing it as an epistemic tool vs. the reason itself.
      *   *Check Case 5:* Did I allow for Scope Contraction? Yes, Clause 1 allows contraction if the previous scope was false (dead people).
      *   *Check Case 4:* Did I rule out status competition? Yes, Clause 2 (non-signaling cost).

      *Wait, one nuance on Case 1 (Footbinding):* The user says "no new argument." My Clause 1 requires "Alignment." Does sensory revulsion count as alignment? I should argue that moral truth is often accessed via sentiment before argument. This preserves the user's intuition without abandoning the "Truth" requirement.

      *Wait, one nuance on Case 8:* The user is uncomfortable with the idea that progress is provisional. I need to be firm here: If it doesn't stick, it wasn't progress, it was a fluctuation. This is a hard pill to swallow but necessary for the theory to hold.

      *Final check on Adversarial Case:* Deinstitutionalization is good. It hits Cost (shifted, not necessarily increased socially), Scope (widened theoretically), Retention (failed). It forces a "Regress" verdict on a liberal sacred cow.

      *Let's write.*
answer: |-
  Here is a repaired principle of moral progress, derived from your nine cases, followed by an application of that principle, an analysis of your three distinctions, and an adversarial test.

  ### The Principle of Robust Alignment

  Your tentative principle failed because it treated Scope as the primary good, whereas your verdicts show that Scope can widen (Case 4) without progress, or narrow (Case 5) with improvement. Furthermore, your tension regarding causation (Case 9) and retention (Case 8) suggests that the *source* of the change matters less than the *stability* of the justification.

  I propose replacing your tentative principle with the following three-clause definition. Moral progress occurs when a change in social practice satisfies all three conditions:

  **Clause 1: Veridical Alignment**
  The change must bring social practice into closer alignment with the actual moral standing of the affected parties.
  *   *Forced by:* **Case 3 (AI)** and **Case 5 (The Dead).**
  *   *Reasoning:* In Case 3, scope widens but the belief is false; you call this non-progress. In Case 5, scope narrows (the dead are excluded) and you call this improvement. Therefore, progress cannot be defined by the direction of scope alone. It depends on whether the beings included actually possess the interests being recognized. A moral circle that includes rocks or excludes women is wrong not because of its size, but because of its accuracy.

  **Clause 2: Net Sacrificial Cost**
  The change must impose a net cost on the benefactors that is not merely signaling or status competition.
  *   *Forced by:* **Case 4 (Offensive Speech)** and **Case 6 (Welfare).**
  *   *Reasoning:* In Case 4, costs are high (jobs lost), but you diagnose this as status competition. In Case 6, scope is constant, but cost drops (welfare cuts), and you call this a loss. Therefore, progress requires a genuine willingness to sacrifice self-interest. If the "cost" is merely performative (signaling virtue to one's peers while harming no real interest), it fails Clause 2. If the cost is removed while the moral claim remains valid, it is regress.

  **Clause 3: Causal Independence**
  The commitment must be sustained by reasons that do not depend on the transient historical or technological conditions that initiated the change.
  *   *Forced by:* **Case 7 (Far Future)**, **Case 8 (Restoration)**, and **Case 9 (Causation).**
  *   *Reasoning:* In Case 9, you accept economic causes for abolition, provided the norm survives. In Case 8, you worry that if slavery returned, the abolition wasn't progress. In Case 7, you worry that "graphs" are just tools. This clause resolves the tension: The *origin* can be contingent (economics, technology), but the *sustenance* must rely on moral reasons that survive the removal of those contingencies. If the graphs vanish and we stop caring about the future, the concern was never moral; it was technical. If slavery returns when labor is scarce, the abolition was never moral; it was economic.

  ---

  ### Verdicts on the Nine Cases

  Here is how the Principle of Robust Alignment judges your cases. Note where it contradicts your intuitions.

  **1. Torture, Slavery, Footbinding**
  *   **Verdict:** Progress.
  *   **Reasoning:** Satisfies Clause 1 (victims have actual standing). Satisfies Clause 2 (economic elites sacrificed profit/power). Satisfies Clause 3 (norms largely survived the specific economic conditions of the 19th century).
  *   **Note on Footbinding:** You worried this required "no new argument." Clause 1 allows for alignment via sentiment (revulsion at suffering) as a valid access point to moral truth, even without metaphysical argument.

  **2. Animal Concern**
  *   **Verdict:** Provisional Progress.
  *   **Reasoning:** Satisfies Clause 1 (animals likely have standing). Satisfies Clause 2 (dietary/industrial cost). Clause 3 is currently unknown. Your hesitation is correct; until we see if this survives a crisis where animal products become economically vital again, we cannot certify it as full progress.

  **3. Conversational AI**
  *   **Verdict:** Not Progress.
  *   **Reasoning:** Fails Clause 1. If there is "nothing it is like to be one of them," they have no moral standing. Widening the circle to include entities without interests is an error, not an expansion.

  **4. Offensive Speech**
  *   **Verdict:** Not Progress.
  *   **Reasoning:** Fails Clause 1 (no identifiable person is injured, implying no standing violation). Fails Clause 2 (costs are high, but they function as status signaling within a group rather than sacrifice for a victim).

  **5. Speaking Ill of the Dead**
  *   **Verdict:** Progress (via Contraction).
  *   **Reasoning:** Satisfies Clause 1. The dead do not have interests that can be wronged. Narrowing the circle to exclude them corrects a metaphysical error. Clause 2 is satisfied because the "cost" of restraint is removed, which is permissible when the claim is false.

  **6. Welfare Erosion**
  *   **Verdict:** Regress.
  *   **Reasoning:** Fails Clause 2. The moral standing of the poor (Clause 1) did not change, but the willingness to bear cost for them decreased. This is a shrinkage of moral commitment along the cost dimension.

  **7. Concern for the Far Future**
  *   **Verdict:** Ambivalent (Depends on Depth).
  *   **Reasoning:** Satisfies Clause 1 (future people have standing). Satisfies Clause 2 (high cost). The verdict hinges on Clause 3. If our concern vanishes when the models/graphs are removed or discredited, it was not progress; it was a cognitive artifact. If the models merely revealed a truth we now hold independently, it is progress. Your ambivalence is warranted; this case is currently unproven.

  **8. Hypothetical Slavery Restoration**
  *   **Verdict:** Contradiction.
  *   **Reasoning:** My account agrees with your hypothetical: if slavery is restored, the abolition fails Clause 3 and is reclassified as a historical fluctuation, not progress. However, this contradicts your actual verdict that British abolition *is* progress now. You cannot hold both that progress is a permanent property of the past *and* that it depends on retention.
  *   **Requirement:** You must surrender the idea that progress is a fixed property of historical events. It is a provisional status that can be revoked by future collapse.

  **9. Causal History of Abolition**
  *   **Verdict:** Progress.
  *   **Reasoning:** This resolves your tension. Clause 3 distinguishes between *initiation* and *sustenance*. Abolition can be caused by economics (initiation) and still be progress, provided the norm is now sustained by moral reasons (sustenance). If it were sustained *purely* by interest, it would fail Clause 3.

  ---

  ### Necessary Surrenders

  To maintain a coherent theory, you must surrender two specific intuitions held in your case notes.

  **1. The Permanence of Progress (Case 8)**
  You want to say British abolition *is* progress, even though we cannot test its retention. But you also say if it were restored, it *was not* progress. These are incompatible.
  *   **The Surrender:** You must accept that moral progress is **retroactively vulnerable**. We can never say with absolute finality that a change *was* progress; we can only say it *has been* progress up to this point. If a society reverts, the previous era is reclassified as a period of moral luck, not moral improvement. This is uncomfortable, but necessary. If progress is defined by the robustness of the commitment (Clause 3), then a commitment that breaks was never robust.

  **2. The Innocence of Sensory Shifts (Case 1)**
  You praise footbinding's end because it required "no new metaphysics... only a change in what people could bear to watch."
  *   **The Surrender:** You must accept that sensory revulsion is only progress if it tracks truth (Clause 1). If people had stopped footbinding because they found it aesthetically boring, but continued to bind boys' feet for similar aesthetic reasons, that would not be progress. The sensory shift counts only because it aligned with the actual suffering of the girls. You must grant that the *truth of the suffering* is doing the work, not the *sensory shift* itself. The sensory shift is just the mechanism of access.

  ---

  ### Theoretical Work of Scope, Cost, and Retention

  You asked whether Scope, Cost, and Retention are distinct variables or a redescription of one underlying variable.

  **They are distinct, but they are not independent goods.**
  They are three dimensions of a single underlying variable: **Moral Robustness.**

  *   **Scope** measures the *accuracy* of the moral map (Clause 1). Widening scope is only good if it maps onto real standing.
  *   **Cost** measures the *sincerity* of the moral agent (Clause 2). Willingness to pay proves the commitment is not merely signaling.
  *   **Retention** measures the *durability* of the moral structure (Clause 3). Survival proves the commitment is integrated into the society's values, not just its circumstances.

  You cannot trade them off. High Scope + Low Cost = Hypocrisy (Case 4). High Cost + False Scope = Tragic Error (Case 3). High Scope + Low Retention = Historical Fluke (Case 8). They are not a menu from which you can choose; they are the three legs of a stool. If one is missing, the concept of "Progress" collapses.

  ---

  ### Adversarial Case Application

  **Case:** The Deinstitutionalization of the Mentally Ill (mid-20th Century).

  **Context:** Beginning in the 1950s and 60s, Western societies moved to close large psychiatric hospitals, aiming to treat patients in community settings. This was driven by new drugs (chlorpromazine), civil rights arguments (patients deserve liberty), and economic hopes (community care is cheaper).

  **Application of the Principle:**

  1.  **Veridical Alignment (Clause 1):** *Pass.* The mentally ill have moral standing and a right to liberty. Keeping them locked away indefinitely was a violation of their standing. The scope of moral concern widened to include their autonomy.
  2.  **Net Sacrificial Cost (Clause 2):** *Fail.* This is the critical failure. While the *rhetoric* implied high cost (better care), the *actual* social cost was shifted, not increased. The state reduced spending; the burden was transferred to families or the criminal justice system. The "cost" paid by society was lower than the institutional model, and the "cost" paid by patients was often homelessness or incarceration. The sacrifice was illusory.
  3.  **Causal Independence (Clause 3):** *Fail.* The policy relied heavily on the transient condition of cheap antipsychotic medication and the optimistic economic assumption that community housing would materialize. When those conditions lapsed (housing costs rose, drugs had side effects), the support for the policy evaporated, leaving a vacuum.

  **Verdict:** **Moral Regress.**

  **Why this is adversarial:**
  This case is often hailed as a triumph of civil liberties (Scope widening). It involved high-minded moral arguments (Alignment). Yet, under the Principle of Robust Alignment, it classifies as regress because the *Cost* clause was not met (society did not actually pay for the care it promised) and *Retention* failed (the system collapsed into homelessness).

  This forces you to accept that a movement can be motivated by genuine moral insight (liberty for the confined) and still constitute moral failure if the society is not willing to bear the actual cost of that insight. It validates your intuition in Case 6 (Welfare) but applies it to a case where the "Scope" argument is much stronger. It confirms that Scope without Cost is not progress; it is abandonment disguised as liberation.
