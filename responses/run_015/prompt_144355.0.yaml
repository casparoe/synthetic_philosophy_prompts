answer: |-
  This is a remarkably sharp observation. You have identified a structural invariant that appears in ethology, software architecture, motor control, and cognitive science. You are right to suspect it has a name, but you are also right that the name usually focuses on only one half of the equation (the rigidity or the flexibility).

  Here is the breakdown of the terminology, the philosophical debate you are having, and the boundary conditions.

  ### 1. Does this configuration have a name?

  There is no single philosophical noun that captures the *entire* shape (flexible seams + rigid blocks) across all domains, but there are precise terms in specific fields that, when combined, describe exactly what you see.

  **The Wasp (Ethology): Fixed Action Pattern (FAP)**
  You were right to be unsatisfied with this term. A **Fixed Action Pattern** describes the rigid block (the stereotyped behavior once triggered). It does not inherently describe the selection mechanism. However, the *system* of FAPs organized by triggers is often called a **Hierarchical Instinct Model** or **Ethological Control Hierarchy**. The specific wasp experiment you recall is by Jean-Henri Fabre (later popularized by Richard Dawkins and others), illustrating that the "check burrow" routine is a FAP triggered by a specific sign stimulus.

  **The Code (Software Engineering): Behavior Trees / Atomic Transactions**
  In AI and robotics, this architecture is explicitly called a **Behavior Tree**.
  *   **Nodes (Blocks):** Execute a task until it returns Success or Failure (rigid execution).
  *   **Selectors/Sequences (Seams):** Decide which node to run next based on the current state (flexible selection).
  In backend systems, you are describing **Atomic Transactions within a State Machine**. The "intelligence" lives in the state transitions; the "work" lives in the atomic transactions.

  **The Human/General (Control Theory & Neuroscience): Intermittent Control**
  This is the most accurate cross-domain term. In motor control and cybernetics, this is called **Intermittent Control** (as opposed to *Continuous Control*).
  *   **Continuous Control:** A PID controller that adjusts output every millisecond based on error (like steering a car constantly).
  *   **Intermittent Control:** The system samples the state, computes an open-loop trajectory (a "block"), and executes it without feedback until the trajectory ends or a threshold is crossed (the "seam"), at which point it re-samples.
  *   **Ballistic Movements:** In neuroscience, the rigid blocks are often called **Ballistic Movements**—actions that, once launched, cannot be modified by feedback (like your sentence example).

  **The Synthesis:**
  If you want a term to use in conversation that captures the whole shape, the most rigorous existing phrase is **"Discontinuous Control Architecture."**
  *   **Discontinuous:** The feedback loop is broken during execution.
  *   **Control:** The system is still goal-directed.
  *   **Architecture:** It implies the structure is the feature, not a bug.

  If you want to coin a term because you find the existing ones too domain-specific, I propose **"Phasic Agency."** (Phasic = occurring in distinct phases/blocks; Agency = the selection capability at the seams).

  ### 2. The Argument: Is this "Free" or "Mechanical"?

  You and your friend are reenacting one of the oldest and most precise debates in the philosophy of action. You have both stumbled onto the core tension of **Compatibilism**.

  **Your Friend's Position: Compatibilism (specifically, Hierarchical Control)**
  Your friend is arguing for a view championed by philosophers like **Harry Frankfurt** and **Daniel Dennett**.
  *   **The Argument:** Freedom isn't about being "uncaused." Freedom is about having a control architecture that allows for **alternative possibilities** at the point of decision.
  *   **The "Seam" is the Freedom:** To a Compatibilist, the fact that the system *can* select Routine A or Routine B based on the situation *is* what freedom consists of. If you can stop, reconsider, and choose differently at the seam, you are free. The rigidity inside the block doesn't matter because you authorized the block at the seam.
  *   **Dennett's View:** Daniel Dennett explicitly argues that human freedom is a product of evolved "macro-switches." We are mechanical, but we are *complex* machines with "elbow room" at the decision points. That elbow room *is* the freedom.

  **Your Position: Hard Incompatibilism (specifically, The Basic Argument)**
  Your intuition that "moving the mechanism up one level" doesn't solve anything is a famous philosophical argument called **The Basic Argument**, most famously formulated by **Galen Strawson**.
  *   **The Argument:** To be truly free (and morally responsible) for your actions at the seam, you must be responsible for the *reasons* you chose that routine. But your reasons are determined by your character/brain state. To be responsible for your character, you must have chosen it. But you chose it using a prior character... leading to an infinite regress.
  *   **The "Seam" is just more Gears:** You are arguing that the selector at the seam is itself a physical process. If that process is determined by prior causes (physics, prior code, prior neural state), then the "flexibility" is an illusion. It's just a more complex lookup table.
  *   **The Regress:** As you said, "Whatever does the selecting... is itself either running a routine or it isn't." Strawson agrees with you: nothing you could add to the architecture stops the regress unless you posit something outside the chain of cause and effect (which physics doesn't support).

  **What settles it?**
  Nothing settles it empirically because it is a definition dispute.
  *   If "Free Will" means **"Could have done otherwise given the exact same prior physical state,"** you win (Incompatibilism). The seams are determined.
  *   If "Free Will" means **"The system has the capacity to model alternatives and select based on goals without external coercion,"** your friend wins (Compatibilism). The seams are real control points.

  **The Name of the Disagreement:** You are debating **Source Incompatibilism** (you) vs. **Reasons-Responsiveness Compatibilism** (friend).

  ### 3. Boundary Cases

  To determine if a system fits your "Discontinuous Control" shape, we need a principled definition.
  **Definition:** A system exhibits this shape if and only if:
  1.  **Open-Loop Execution:** Once a routine begins, internal state changes cannot alter the routine's trajectory (Non-preemptible).
  2.  **Closed-Loop Selection:** The choice of the *next* routine is a function of the external/internal state at the moment of selection (State-Dependent).

  Let's test your cases:

  **(a) A pocket calculator (One seam at start, deterministic after)**
  *   **Verdict:** **Degenerate Case (No).**
  *   **Why:** It fails Condition 2. There is no *re-selection* based on the situation. It is purely Open-Loop. It has rigidity but no flexible seams. It is a single block.

  **(b) Random seams (Seams arrive at random times)**
  *   **Verdict:** **No.**
  *   **Why:** It fails Condition 2. The *timing* of the seam is not sensitive to the situation. If the seam happens while the routine is still optimal, or after it has failed, the system cannot optimize. This is **Stochastic Control**, not Situational Control. The "intelligence" at the seam is blind.

  **(c) Interruptible by anything, fixed response to interruption**
  *   **Verdict:** **No (Inverse Case).**
  *   **Why:** This fails Condition 1. This is **Continuous Closed-Loop with Fixed Gain** (like a reflex arc). There are no "blocks." The system is rigid *everywhere* (fixed response) but flexible *everywhere* (always interruptible). It lacks the commitment of the block.

  **(d) Seams are real, but blocks are a millisecond long**
  *   **Verdict:** **Limit Case (Functionally No).**
  *   **Why:** This depends on the system's **Observation Granularity**. If the block duration is shorter than the time it takes to sense the environment, the system cannot effectively use the seam to react to the world. It becomes functionally equivalent to Continuous Control (like a high-frequency trading bot or a PID controller). The "shape" exists mathematically, but functionally it collapses into continuous feedback.

  ### Summary for your Backend Brain

  *   **The Shape:** **Discontinuous Control Architecture** (or **Intermittent Control**).
  *   **The Code Equivalent:** **Behavior Trees** with Atomic Nodes.
  *   **The Philosophy:** You are **Galen Strawson** (The Regress); your friend is **Daniel Dennett** (The Control Architecture).
  *   **The Boundary:** The shape requires **State-Dependent Branching** (Seams) + **Non-Preemptive Execution** (Blocks).

  You haven't discovered a glitch; you've discovered the fundamental way almost all complex systems (biological and artificial) manage the trade-off between **responsiveness** (seams) and **throughput/stability** (blocks). Continuous feedback is too computationally expensive (or energetically costly) for complex tasks; pure open-loop is too brittle. The "Seam-and-Block" is the engineering solution to that problem. Whether that counts as "freedom" depends entirely on whether you think freedom requires magic (you) or just good architecture (your friend).
