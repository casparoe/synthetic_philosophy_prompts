answer: |-
  **take-home exam prompt**

  **Q1. the tortoise strikes back (25 points)**

  remember lewis carroll's dialogue where achilles keeps adding premises to force the tortoise to accept a conclusion, but the tortoise just keeps asking for another premise to bridge the gap? usually, the tortoise rejects modus ponens outright. but suppose we tweak the scenario.

  imagine a variant where the tortoise says: "look, i accept modus ponens for empirical stuff. if you tell me 'it's raining' and 'if it's raining the ground is wet', i'll infer 'the ground is wet'. but for purely logical premises, i don't need an inferential bridge. logical truths are already everywhere present in the premises, so demanding a rule to extract them is category error."

  basically, they're claiming logical consequence is containment, not inference.

  write a short essay (max 600 words) addressing the following:
  1. does this empirical/logical split actually stop carroll's regress, or does it just shift the bump in the carpet?
  2. you must clearly distinguish between *logical justification* (validity/truth preservation) and *rational justification* (why an agent should move their mind to accept the conclusion).
  3. explain why treating closure under logical consequence as a "premise" fails even in the empirical case.

  don't waste time summarizing the original dialogue. get straight into the weeds of the variant.

  ***

  **model answer (for grading reference)**

  this move by the tortoise doesn't fix the regress; it just hides it behind a dubious distinction between empirical and logical content. the core of carroll's paradox isn't about the *type* of premises involved, but about the category mistake of treating a rule of inference as if it were another premise in the argument.

  when the tortoise accepts modus ponens for empirical cases but rejects it for logical ones, they are admitting that inference is required whenever there's a gap between premises and conclusion. but there is always a gap between *asserting* premises and *asserting* a conclusion, regardless of whether the content is empirical or logical. if the tortoise says logical truths are "already present," they are conflating the truth of the conclusion with the act of inferring it. just because the conclusion is contained in the premises doesn't mean an agent has automatically performed the operation to extract it. the regress arises because the tortoise demands a reason to perform that operation.

  this is where the distinction between logical and rational justification becomes crucial. logical justification concerns the structural relationship between propositions: if the premises are true, the conclusion *must* be true. this is objective and static. rational justification, however, is normative for the agent: it asks why I should *believe* the conclusion given I believe the premises. carroll's tortoise is demanding rational justification for a logical rule. by saying logical truths are "everywhere present," the tortoise is trying to bypass the need for rational commitment to the rule of inference. but without that commitment, no inference occurs.

  furthermore, the empirical/logical split collapses under scrutiny. consider a mixed argument: premise 1 is empirical ("this shape is a triangle"), premise 2 is logical ("all triangles have three sides"). does modus ponens apply here? if the tortoise says yes, then the rule applies to non-empirical content too. if they say no, they can't do basic geometry. the tortoise wants to treat the rule of inference as a premise only when it suits them. but if you treat the rule as a premise (call it C: "if A and B imply Z, then Z"), you still need a rule to connect A, B, and C to Z. that's the regress. it doesn't matter if A and B are empirical; once you reify the rule into a statement, you need a new rule to use that statement.

  ultimately, the tortoise's move shifts the bump. they are trying to say that for logical truths, the "rule" is internal to the content. but inference is a process, not just a state of affairs. closure under logical consequence isn't a fact you add to the list; it's the engine that drives the list forward. if you demand the engine be listed as cargo, the vehicle doesn't move. the tortoise is refusing to drive unless you give them a map of the engine, and then a map of the map. limiting this demand to "logical premises" doesn't stop the infinite recursion of needing a rule to apply the rule. it just makes the stopping point arbitrary.

  ***

  **marking scheme (out of 25)**

  **A range (23-25 points)**
  *   **core argument (10 pts):** clearly identifies that treating the rule as a premise is the root error, regardless of premise content. explains why the empirical/logical split fails (e.g., using mixed arguments or noting inference is always an act).
  *   **justification distinction (10 pts):** explicitly separates logical justification (truth preservation) from rational justification (agent's compulsion to infer). notes that tortoise conflates the two.
  *   **clarity (5 pts):** concise, no fluff, stays under word limit.

  **B range (18-22 points)**
  *   **core argument (7 pts):** gets that the regress continues but might accept the empirical/logical split as partially coherent without fully dismantling it.
  *   **justification distinction (7 pts):** mentions the difference between logic and rationality but doesn't apply it tightly to the tortoise's specific claim about "presence."
  *   **clarity (5 pts):** readable but maybe wanders into summarizing carroll too much.

  **C range (15-17 points)**
  *   argues the tortoise is just being stubborn without analyzing the rule/premise distinction.
  *   conflates logical justification with rational justification.
  *   thinks the empirical split actually works.

  **specific penalties:**
  *   **-5 points:** conflating carroll's regress with circularity (they are different structural errors).
  *   **-5 points:** treating the tortoise's empirical/logical split as coherent without explaining why it collapses in mixed cases.
  *   **-3 points:** summarizing the original dialogue instead of addressing the variant.
  *   **-2 points:** over 600 words or under 400.

  *note: if they mention wittgenstein or lewis by name, dock 2 points since i said no research. keep it internal.*

  also watch out for students who think achilles wins in the end. he doesnt. nobody wins here, thats the point.
