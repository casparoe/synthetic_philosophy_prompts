  1. "Predictions"
  - **New Case 1:** Don't redirect (let the one suffer severe pain rather than impose moderate pain on 300).
  - **New Case 2:** Immunize the one (protect the individual from severe pain over the many from mild flu).
  - **New Case 3:** Spread it out (intra-life arithmetic applies; minimize total pain).

  2. "The rules that fit"
  Two principles align with Maya's asymmetry: **Scanlonian Contractualism** and **Threshold Deontology**. Both explain why she aggregates trivial harms (itches) to prevent severe harm (Track Record Case 3) but forbids aggregating mild harms to *impose* severe harm (Track Record Case 4). The individual facing severe pain has a veto (reasonable rejection or rights threshold) against being sacrificed for others' minor gains. However, trivial burdens on others don't trigger this veto when saving a life. Both rules also explain the rescue case (equal stakes allow counting) and intra-life case (no separateness constraint).

  On the new cases, they converge. Both forbid redirecting severe pain to spare 300 moderate pains (Case 1), as moderate harms likely cross the threshold where aggregation violates separateness. Both forbid sacrificing one for 1,000 mild flu cases (Case 2), as the severe claim dominates. Both permit the intra-life trade (Case 3) because constraints bind interactions between persons, not temporal parts of one biography. The Utility Monster rejection fits both: extreme utility gains don't override the constraint against severe sacrifice. The track record underdetermines the choice between them, as both yield identical verdicts here.

  3. "Best guess"
  I'd bet on **Contractualism**. It best captures her specific language about "separate people's gains and losses." Threshold Deontology focuses on outcome magnitudes crossing a line; Contractualism focuses on the *relationship* between individuals and the justification of burdens. Her hesitation on the itch case ("made a face") suggests concern for the million, which fits the contractualist idea of seeking principles no one could reasonably reject, acknowledging the burden even if overridden. She views the separation of persons as a moral barrier to aggregation, which is the core contractualist insight, rather than just a deontological side-constraint.

  4. "The tiebreaker"
  **Case:** Save one person from death vs. save 1,000 people from permanent paralysis. **Threshold Deontology** may save the 1,000, judging aggregated paralysis crosses the threshold permitting rights violation (total harm is catastrophic). **Contractualism** saves the one, arguing death is uniquely reasonably rejectable; paralysis claims cannot sum to override a life claim. This isolates whether her constraint is outcome-based (total harm) or claim-based (individual veto). If she saves the one, it confirms the claim-based view; if she saves the 1,000, it reveals a hidden aggregative threshold.
