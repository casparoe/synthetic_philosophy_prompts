  - One person will suffer a year of severe pain unless we trigger a one-second mild itch in a million people. She said yes, itch the million, though she made a face about it.
  - The mirror of that: a million people will each get a one-second itch unless we make one person suffer a year of severe pain. Hard no. Let them itch.
  - Utility monster (the classic one who converts any extra resources into vastly more wellbeing than anyone else would get from them): she flat out refuses to feed it.

  Her go-to line for all of this is that you can't pour seperate people's gains and losses into one pot as if it were all a single life — but she's never spelled out what actually follows from that, and I suspect more than one principle is hiding behind her verdicts.

  Next week we're bringing three new cases to her and I want to walk in with actual predictions:

  New case 1: one person will suffer 9/10 pain for a full year. We can redirect it — instead, 300 people each suffer 4/10 pain for a full year, and the first person is fine. Stipulate the totals come out the same on any scale you like.

  New case 2: one vaccine dose. Either it immunizes 1,000 people against a day of mild flu, or it immunizes one person against a year of severe pain. Equal totals again, stipulated.

  New case 3: the check case — same setup as new case 1, except it all happens inside one life: one person either has a single terrible year or 300 bad days spread across their decades. Does it being one life change her answer?

  Please structure your reply like this:

  1. "Predictions" — her call on each of the three, one line apiece.
  2. "The rules that fit" — the candidate principles her track record is consistent with, and what each one predicts on the three new cases. This is the part I care most about, so take some room here, maybe 250 words. If two rules agree on all three, say so instead of pretending they differ.
  3. "Best guess" — which rule you'd bet she's actually running, and why, around 100 words.
  4. "The tiebreaker" — one further case, not among the three, that would best split the surviving candidate rules, plus what each rule says on it, around 100 words.

  And don't just hand me rule names — I want to see where the rules come apart and which of the new cases is doing the separating. If her record genuinely underdetermines one of the predictions, just say that rather than forcing a call.
