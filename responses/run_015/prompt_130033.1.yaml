      *   *Argument 2: The Semantic Gap.* GIT relies on arithmetization of syntax. Natural language doesn't have a Gödel numbering scheme. Without encoding, you can't construct the self-referential sentence formally.

  7.  **Developing the "Awkward" Arguments:**
