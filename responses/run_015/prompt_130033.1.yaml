  11. **Tone Check:** Keep it respectful, philosophical, and rigorous. Avoid dismissing the user's insight (it's a profound intuition) while clarifying the technical limits. (Self-correction: Ensure I distinguish between *Gödel's Theorem* specifically and *Incompleteness Phenomena* generally).

  12. **Final Polish:** Organize with clear headings. Ensure the distinction between "decisive" (logical impossibility) and "awkward" (pragmatic/philosophical discomfort) is clear. (Proceed to generate output).

  *(Self-Correction during final output generation)*: I need to make sure I don't conflate Tarski's Undefinability Theorem with Gödel's Incompleteness Theorem, though they are related. The user is specifically asking about Gödel. I should focus on the requirements for GIT: Consistency, Recursive Axiomatizability, and Sufficient Strength (Arithmetic).

