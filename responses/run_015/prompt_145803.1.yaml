      *   *Verdict:* It holds up *if* the user emphasizes the *structural role* of the affect. It's not "emotion clouds judgment"; it's "emotion *is* the bridge."
      *   *Refinement:* Need to distinguish from "rhetorical flourish." Affective colonization is about the *imaginative immersion* required by the thought experiment itself.

  4.  **Address Question 2: Characterization of Philosophical Practice.**
      *   *Standard View:* Philosophers often claim Thomson is arguing for the *Right to Life* vs. *Right to Use Body*. They treat it as a rights-conflict model.
      *   *Nuance:* Thomson herself emphasizes the *burden* and the *Good Samaritan* aspect. However, many *users* of the case (intro textbooks, bioethicists) treat it as a strict analogy.
      *   *Critique:* The user might be attacking a straw man if they claim *no one* sees the autonomy aspect. But they can argue that even those who cite autonomy treat it as a *principle* derived from analogy, whereas the user argues the *intuition* comes from the visceral simulation.
      *   *Verdict:* Don't say philosophers ignore autonomy. Say they treat autonomy as a *conclusion* derived from the analogy, whereas the user argues autonomy is the *pre-condition* established by the affect.

  5.  **Address Question 3: The Reliability Objection (Tracking Truth).**
