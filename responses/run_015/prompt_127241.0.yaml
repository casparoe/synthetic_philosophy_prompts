answer: |-
  **Title:** The Side-Effect of a Life: *The Social Network* as a Stress Test for the Knobe Effect

  If experimental philosophy is the art of isolating moral intuition in a vacuum, *The Social Network* is the experiment where the vacuum seal breaks. We spend this seminar dissecting the Chairman case: an agent who pursues profit, foreseeably harms or helps the environment as a side effect, and receives asymmetrical blame or praise based solely on the valence of that outcome. It is a clean, sterile mechanism. But if we treat David Fincher's film not as a biography but as a two-hour expansion of that vignette, the mechanism begins to grind. Mark Zuckerberg is not a chairman in a boardroom; he is a walking side-effect generator. Yet, watching him, we realize that the Knobe Effect might be too thin to capture the weight of a life lived in pursuit of a goal.

  The film functions as a machine for generating the Knobe asymmetry, but it complicates the input. In the standard vignette, the agent claims indifference: "I don't care about the environment." In the film, Mark claims ignorance of motive: "I didn't do it to hurt you." Consider the cleanest instance of the pattern: the dilution of Eduardo Saverin's shares. Mark's stated goal is growth and survival of the company (the profit). The freezing out of his best friend is the side effect (the harm). When Mark signs the papers, he insists this is business, not personal. The audience, however, attributes intentionality to the betrayal. We say he did it on purpose. Why? Because the harm aligns with the trajectory of his ambition.

  But the film is messy in ways the vignette literature hides. Take the opening scene with Erica. Mark wants to impress her (goal). He insults her intelligence and social status (harm). Is the insult a side effect of his social awkwardness, or the intended tool of his dominance? In a one-paragraph scenario, we code this as intentional harm. In the film, over two hours, we see the oscillation. He wants her approval; he achieves her rejection. He foresaw the conflict, perhaps even courted it, but disowns the motive immediately after. This is the "messy middle" the vignette excludes: the space where an agent half-wants the harm because the harm validates the struggle required for the goal. The vignette asks, "Did he know?" The film asks, "Did he need it?"

  This brings us to a concept the standard literature doesn't quite capture: **Biographical Intentionality**. In the Chairman case, we judge a single action. In *The Social Network*, we judge a life arc. The audience performs a retroactive absorption of outcomes. Every bad outcome—Erica's rejection, the Winklevoss lawsuit, Eduardo's exile—gets absorbed into Mark's character as "intentional." Every good outcome—the site's virality, the valuation—gets written off as luck or attributed to Sean Parker's influence. We treat the harm as essential to who he is (Deep-Self) and the success as accidental to who he is (External). A standard Knobe account predicts asymmetry based on the valence of the side effect. But here, the asymmetry is based on the valence of the *agent*. We are not asking, "Did he intentionally dilute the shares?" We are asking, "Is he the kind of person who intentionally destroys friends?" The film suggests that over a long enough timeline, the Knobe Effect collapses into character judgment.

  This forces a split between the two dominant explanations for the effect: the Deep-Self view (we blame because the harm expresses the agent's true values) and the Reason-Explanation view (we blame because the harm helps explain why the agent acted). The vignette literature struggles to separate these because the agent is a stranger. The film tears them apart. The Reason-Explanation view struggles here because the harm (losing Eduardo) does not explain the action (saving the company); in fact, it risked it. Yet, we still blame. Why? Because the film supports the Deep-Self view. It gives us hundreds of scenes of evidence that Mark's "true self" is competitive, envious, and cold. The harm expresses the agent, even if the harm wasn't the *reason* for the action. The vignette gives you a stranger and a paragraph; the film gives you a person. The verdict still doesn't settle, which is a damning criticism of how thin our usual evidence is. If two hours of footage doesn't resolve the intentionality question, what chance does a three-sentence survey have?

  Sorkin and Fincher seem aware of this manipulation. The film's structure—told through two competing depositions—is essentially an order-framing manipulation on the audience. First, we hear the Winklevoss narrative: Mark is a thief who stole an idea. Our attribution of intentionality spikes; the harm is central. Then, we hear Mark's narrative: he is a striver who built something from nothing. Our attribution shifts; the harm becomes collateral. The film is doing to us what the vignettes do to subjects, toggling our moral verdicts by toggling the narrative frame. But unlike the vignette, the film leaves both frames active. We hold both judgments simultaneously.

  This tension culminates in the Dual Character Concepts at play: "Friend" and "Founder." These concepts have a descriptive dimension (did you hang out? did you code?) and a normative dimension (did you uphold the value of loyalty? did you realize the vision?). Eduardo claims the title of "Friend" based on the descriptive (we were roommates) but fails the normative (Mark betrayed him). Mark claims the title of "Founder" based on the normative (I saw the future) despite the descriptive mess (I stole the code, I diluted the partner). The final line from the lawyer—"You're not an asshole, you're just working very hard to be one"—is a reframe of the intentionality question. It suggests Mark passes the descriptive test of an asshole (he acts like one) but fails the normative test (it's not his essential nature, it's a performance). He is refreshing Erica's page not because he intends to hurt her again, but because he is trying to realize the value of the concept "Ex-Boyfriend" and failing. He flunks the normative dimension of humanity while passing the descriptive dimension of success.

  However, we must acknowledge where the film resists this reading. The Knobe framing flattens the tragedy of ambition. In the vignette, the side effect is binary: harm or help. In the film, the side effect is *success*. The destruction of the friendship is the price of the site's existence. The Knobe Effect assumes the agent could have chosen otherwise without changing the primary goal. The film argues the harm was constitutive of the goal. You couldn't have Facebook without losing Eduardo. This isn't a side effect; it's a trade-off. The vignette model assumes a world where you can have profit without environmental damage if you just care enough. The film posits a world where the damage is the engine. If the harm is necessary for the good, "intentional" loses its bite. We stop asking if he meant to do it, and start asking if it was worth it. The Knobe Effect cannot measure worth, only intent.

  If I were showing three scenes to a room of undergrads to make this point, I would choose these:

  1.  **The Opening Breakup:** This establishes the baseline. Mark's insult to Erica is the prototype for all future harms. It shows the speed at which he moves from "trying to impress" to "inflicting damage," and his immediate disowning of the intent. It sets the Deep-Self baseline.
  2.  **The Signing of the Dilution Papers:** This is the core Knobe moment. Mark explains the business necessity (the reason). Eduardo feels the betrayal (the harm). The scene lingers on Mark's face—he knows what this does, but he frames it as inevitable. It forces the audience to decide if "inevitable" means "intentional."
  3.  **The Final Refresh:** The closing shot. Mark alone, refreshing the page. This is the Biographical Intentionality verdict. He has the company (the good side effect) but not the girl (the bad side effect). The audience is left to decide if the life he built was the one he intended, or just the one he accidentally created while trying to be let in.

  *The Social Network* does not solve the Knobe Effect. It exhausts it. It shows that when you give an agent a history, a voice, and a motivation, the clean asymmetry of the vignette muddies into the complex tragedy of character. We don't blame Mark because he foresaw the harm; we blame him because the harm looks like him. And in the end, that might be the only experimental result that matters.
