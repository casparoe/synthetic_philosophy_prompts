answer: |-
  # Adversarial Collaboration Draft: Predictive Processing vs. Enactive Dynamics

  ## 1. Agreed Claims

  The following statements are accepted by both parties for the purpose of this collaboration. Tags indicate the status of each claim within the broader field of cognitive science.

  1.  **Distinction of Terms:** The Free-Energy Principle (FEP) is a mathematical statement about non-equilibrium steady states; Predictive Processing (PP) is a specific architectural hypothesis about brain function; Predictive Coding (PC) is a proposed neural implementation mechanism involving distinct prediction and error units. [Wide Consensus]
  2.  **Formal Coherence:** The variational calculus underlying the Free-Energy Principle is mathematically coherent; any system with a Markov blanket that maintains a non-equilibrium steady state can be described as minimizing variational free energy. [Wide Consensus]
  3.  **Experimental Signals:** Neural recordings reliably show signals consistent with prediction errors (e.g., mismatch negativity) and hierarchical updating across cortical layers. [Wide Consensus]
  4.  **FEP Scope:** It is currently unresolved whether the FEP applies necessarily to all living systems, only to brains, or only to specific cortical circuits modeled in isolation. [Unsettled Controversy]
  5.  **Dark Room Structure:** Both sides agree the "Dark Room" objection asks why agents do not minimize surprise by retreating to unchanging states, and that the standard reply invokes prior preferences over vital states and expected uncertainty. [Local Agreement]
  6.  **Non-Neural Systems:** Both sides agree that non-neural systems (e.g., convection cells) can be formally modeled as minimizing free energy if they possess a Markov blanket and steady state. [Wide Consensus]
  7.  **Instrumentalism Coherence:** Both sides agree that "Update-Rule Instrumentalism" (the view that the generative model is merely a compact description of dynamics, not a physical entity) is a logically coherent stance. [Local Agreement]

  **Mediator Confidence Note:** I am highly confident in claims 1, 2, 3, and 6 as these are mathematical or empirical baselines. Claim 4 is accurately tagged as unsettled; the literature is split. Claims 5 and 7 are tagged as Local Agreement because while the *terms* are understood, most proponents outside this specific collaboration would argue over the implications immediately. I am moderately confident these two will hold these lines without slipping.

  ## 2. Disagreements Table

  | Issue | Active Inference Formulation | Enactive Formulation |
  | :--- | :--- | :--- |
  | **Nature of Internal Models** | The system physically maintains probabilistic beliefs (parameters of a generative model) that track environmental causes. | The system exhibits adaptive coupling; positing "beliefs" or "models" adds no explanatory power beyond the dynamics themselves. |
  | **Explanatory Necessity** | Without inference, we cannot explain how noisy sensory data yields robust perception and action. | Inference is a homuncular metaphor; perception emerges from agent-environment history, not data processing. |
  | **Dark Room Reply** | The reply is substantive: priors encode vitality, preventing retreat into sensory deprivation. | The reply is an ad hoc rescue: priors are tuned post-hoc to ensure the model outputs sensible behavior. |
  | **Triviality Worry** | A system with a Markov blanket that *fails* to minimize free energy would cease to exist (dissolve); thus the principle is non-trivial for life. | A convection cell minimizes free energy but holds no beliefs; thus the principle is trivial for cognition. |
  | **Update-Rule Instrumentalism** | If accepted, the theory becomes unfalsifiable: any dynamics can be retrofitted with a model, removing causal purchase. | If accepted, the theory is trivial: it admits the math is just a description, so we should stop ontologizing "predictions." |
  | **Debate Terminus** | We cannot end here; we must determine if the model is physically realized to validate the science. | We should end here; accepting instrumentalism dissolves the conflict by removing the ontological claim. |

  ## 3. Crux Table

  | Crux | Concrete Case / Result | Active Inference Prediction | Enactive Prediction |
  | :--- | :--- | :--- | :--- |
  | **Neural Decoding** | Can we decode specific probabilistic distributions (variance/mean) from distinct neural populations during uncertainty? | Yes: Specific populations will encode precision weights distinct from value predictions. | No: Activity will reflect holistic dynamical states, not separable statistical parameters. |
  | **Non-Neural FEP** | Does a convection cell satisfy the FEP in a way that implies "belief" or "inference"? | Yes: It minimizes surprise, implying a primitive form of inference exists across scales. | No: It satisfies the math, proving the math does not imply inference or cognition. |
  | **Intervention** | If we disrupt putative error-signaling pathways, does behavior fail as Bayesian updating predicts? | Yes: Behavior will show specific deficits in updating priors vs. likelihoods. | No: Behavior will show general stability loss, not specific Bayesian computational failures. |
  | **Instrumentalism** | If we accept the model is just a description, does the theory retain predictive power? | No: Without physical realization, the theory cannot guide novel interventions. | Yes: The theory remains useful as a descriptive language without ontological baggage. |

  \answer{Do agents literally harbor internal models, or merely resemble inferers?}
