      *   *Addressing the Ontology:* Do groups need essences? No. They need causal power.
          *   Distinguish between "Natural Kind" (gold) and "Social Kind" (money, generations).
          *   The "Looping Effect" (Hacking) is relevant here but I can't name-drop. I'll describe the mechanism: labeling people changes how they act.
      *   *Critique of the Term:* "Historical Cohort Realism." It's descriptive. Maybe point out that "Realism" might be too strong if it implies mind-independence. But "Causal Realism" works.
      *   *Where the Reasoning Breaks (The "Honest Feedback"):*
