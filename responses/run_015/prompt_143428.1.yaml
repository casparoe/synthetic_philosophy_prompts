      *   **Constraints:** No bibliographies/citations. Paraphrase Friedman (no quotes/page numbers). Formal, polished prose.

  2.  **Deconstruct the Philosophical Positions:**
      *   **Friedman's Instrumentalism (The "F-twist"):** The realism of assumptions is irrelevant. The only test of a theory is the accuracy of its predictions. Often, the more significant the theory, the more unrealistic the assumptions. Assumptions are just tools for organizing data.
      *   **Explanatory Realism:** Theories aim to describe the underlying causal structure. Unrealistic assumptions (especially distortions) hinder understanding and limit the scope of application (especially for policy/counterfactuals). Predictive success is necessary but not sufficient; we need true-ish mechanisms.
