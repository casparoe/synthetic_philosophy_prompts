answer: |-
  The passage is a smooth but misleading overview that papers over the technical fractures where each interpretation actually struggles.

  On frequentism, the author is right that strict frequentists deny probabilities to single events, but the reason isn't just the lack of a series—it's the **reference class problem**. To assign a frequency, you must decide which series this event belongs to (e.g., is "rain tomorrow" part of the series of all days, all May days, or all days with this specific barometric pressure?). Different classes yield different frequencies, so the single-case probability remains undefined without an arbitrary choice of category. Regarding the bridge to action: you are correct about **Cournot's Principle**. It is not internet nonsense; it is the standard methodological rule that allows frequentists to act on single cases by treating sufficiently small probabilities as impossibilities. However, this is an extra-mathematical add-on, not a consequence of the probability axioms themselves.

  On Bayesian convergence, the text offers a fair simplification that hides a critical condition. Bayes' rule only forces agreement if both parties assign non-zero prior probability to the true hypothesis and agree on how to interpret the evidence (the likelihood function). If one person starts dogmatically certain (prior probability of 0 or 1), no amount of evidence will move them. Furthermore, if agents disagree on the likelihoods—perhaps because they distrust the data source differently—their posteriors may never converge, even with infinite evidence.

  Your flatmate is sharp on propensities. This is a known conceptual hurdle often called **Humphreys' Paradox**. The probability calculus is symmetric: $P(A|B)$ is mathematically related to $P(B|A)$ via Bayes' theorem. Propensities are causal and time-directed: a setup has a propensity to produce an outcome, but an outcome does not have a propensity to have been produced by a setup. Because propensities don't invert cleanly like conditional probabilities, they don't map perfectly onto the standard axioms they are supposed to ground. This hurts the theory, as it suggests propensities are not just "physical probabilities" but a different kind of relation entirely.

  The final paragraph is the most problematic. While it is true that all three interpretations generally accept the Kolmogorov axioms as the mathematical engine, the claim that this "makes no difference to anything anyone computes" is demonstrably wrong. The interpretation dictates the method. A frequentist cannot compute the probability of a hypothesis given data (only the probability of data given a hypothesis), leading to p-values and confidence intervals. A Bayesian computes the probability of the hypothesis directly, yielding posteriors and credible intervals. These numbers differ, sometimes drastically, and lead to different decisions in medicine, physics, and economics. The metaphysics drives the math you are allowed to write down.
