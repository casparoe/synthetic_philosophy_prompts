      **1. Scope of Services**
      The Contracting Authority invites tenders for the production of a definitive schedule of "Western Values" (the "Deliverable"). The Deliverable shall be formatted for attachment to secondary legislation, migration directives, or educational curricula. The primary function of the Deliverable is to provide a semantic infrastructure that allows the Contracting Authority to invoke shared heritage without specifying content that would necessitate policy adjustment.

      **2. Technical Specifications**

