      The Deliverable must perform exclusionary work. Selected values must be identifiable as uniquely prevalent within the Authority's member states while being demonstrably absent in named non-Western regions. Bidders must address the methodological challenge wherein candidate values (e.g., rule of law, toleration) are endorsed globally and have been historically violated within member states. Bidders must specify whether "the West" is defined geographically, by descent, by civilizational inheritance, or by assent to the values themselves. The Contracting Authority notes that defining the West by assent to the values themselves is permissible, provided the circularity of this definition does not appear in the Executive Summary.

      **2.2 Provenance and Lineage**
      Every value included must be traceable to at least two of the following approved sources: Athens, Rome, Jerusalem, the Enlightenment, 1989. No value may be credited to a source that would embarrass the Authority (e.g., colonial administrations, labor movements). Any conceptual borrowing from non-approved sources must be described as "transmission" rather than "origin."

      **2.3 Dual-Function Interoperability**
