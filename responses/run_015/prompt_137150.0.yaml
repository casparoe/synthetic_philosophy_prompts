  **Request for Proposals: RFP-2024-WV-01**
  **Subject:** Commissioning of an Authoritative List of Western Values (ALWV)
  **Issuing Body:** The European Foundation for Normative Cohesion (the "Contracting Authority")

  **1. Background and Scope of Services**
  The Contracting Authority invites tenders for the production of a definitive schedule of "Western Values" (the "Deliverable"). The Deliverable shall be formatted for attachment to secondary legislation, migration directives, or national school curricula. The primary function of the Deliverable is to provide a semantic infrastructure that allows the Contracting Authority to invoke shared heritage without specifying content that would necessitate policy adjustment. The Consultant shall deliver a finalized text suitable for judicial citation.

  **2. Technical Specifications**

  **2.1 Exclusionary Capacity and Definition**
  The Deliverable must perform exclusionary work. Selected values must be identifiable as uniquely prevalent within the Authority's member states while being demonstrably absent in named non-Western regions. Bidders must address the methodological challenge wherein candidate values (e.g., rule of law, toleration, free inquiry) are endorsed globally and have been historically violated within member states. Bidders must specify whether "the West" is defined geographically, by descent, by civilizational inheritance, or by assent to the values themselves. The Contracting Authority notes that defining the West by assent to the values themselves is permissible, provided the circularity of this definition does not appear in the Executive Summary.

  **2.2 Provenance and Lineage**
  Every value included must be traceable to at least two of the following approved sources: Athens, Rome, Jerusalem, the Enlightenment, 1989. No value may be credited to a source that would embarrass the Authority (e.g., colonial administrations, labor movements, trade unions). Any conceptual borrowing from non-approved sources must be described as "transmission" rather than "origin."

  **2.3 Dual-Function Interoperability**
  The List must operate universally in one paragraph (these are human values anyone may adopt) and particularly in the next (these are *our* values which *they* lack). Bidders must specify how this switch will be managed without a visible seam. The text must remain stable during the transition.

  **2.4 Conversational Utility**
  Invocation of the Deliverable must function as a conversation-stopper. It must shift the burden of proof onto the party expressing discomfort. The Deliverable must be capable of doing real work in disputes regarding gas infrastructure, housing zoning, or trade tariffs, without registering the change of subject.

  **2.5 Pass/Fail Criteria**
  Any value whose main effect would be to criticize current Western policy shall be excluded. For example, "Freedom of Movement" was floated in Tender RFP-2023-WV-09 but withdrawn after legal review confirmed it would impede border management protocols. Proposals including values that require member states to change behavior will be rejected.

  **3. Evaluation Criteria**
  Proposals will be scored out of 100. The Contracting Authority insists all criteria matter equally, though weights are applied as follows:
  *   **Distinctiveness (30%):** Does the list pick out *us* versus *them*?
  *   **Flattery (30%):** Does the list describe what we already do rather than what we should do?
  *   **Deniability (25%):** Can a critic quote the list without being called an ethnonationalist?
  *   **Historical Accuracy (15%):** Is the lineage factually correct?

  **4. Questions Received from Bidders (Q&A)**

  **Q1:** *If a value is universal, how can it be distinctively Western?*
  **A1:** The Contracting Authority requires bidders to treat universality as a claim we make, not a fact we verify. See Clause 2.3. The rhetorical utility lies in the assertion, not the ontology.

  **Q2:** *Can we include "Secularism" given the Jerusalem source requirement?*
  **A2:** Yes, provided it is framed as an inheritance of Jerusalem via the Enlightenment, rather than a rejection of Jerusalem. Nuance is required to maintain the dual-function interoperability.

  **Q3:** *What if a member state fails a value listed?*
  **A3:** This is a compliance issue for the member state, not a drafting error for the Consultant. The List remains authoritative regardless of implementation gaps. Comfort letters will be issued upon request to mitigate political fallout.

  **Q4:** *Is "Hospitality" permissible?*
  **A4:** Only if defined as "managed reception" rather than "open entry." See Clause 2.5. Values must not constrain the Contracting Authority's discretion.

  **Q5:** *Does the circularity clause apply to the rubric?*
  **A5:** The Contracting Authority does not recognize the term "circularity" in this context. Please refer to Clause 2.1 regarding definitions by assent.

  **5. Submission Guidelines**
  Tenders must be submitted in triplicate. Electronic submissions must be password-protected. The Contracting Authority reserves the right to amend the definition of "Western" during the evaluation period without notifying bidders. Late submissions will be accepted only if they align with the Authority's current political cycle. The Authority is not liable for philosophical contradictions arising from the Deliverable's use in court.
