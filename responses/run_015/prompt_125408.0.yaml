answer: |-
  Here is the dependency structure for your session, designed to keep the docents' technical instincts engaged while steering them toward the ontological distinction you need.

  ### 1. The Dependency Structure
  Do not start with the visitor's question. Start with the objects. If you start with the question ("What are we paying for?"), they will answer with economics ("Scarcity") or morality ("Honesty"), and you will lose the philosophy.

  **Phase 1: The Phenomenological Lock (Minutes 0–15)**
  *   **Goal:** Establish indistinguishability without triggering the "hunt for the flaw."
  *   **Dependency:** You must secure their agreement that *perceptually*, the objects are identical (or near enough that a visitor couldn't tell).
  *   **Move:** Put the objects on the table. Give them magnifiers. Invite them to find the difference. When they fail (or find only age-related wear), lock it in: "For the purpose of the visitor standing in front of the glass, these are the same image."
  *   **Why:** If they believe there *is* a physical tell they just haven't found yet, the session becomes a technical masterclass, not a value discussion. You must close the "technical hunt" door to open the "philosophical" window.

  **Phase 2: The Ontological Gap (Minutes 15–30)**
  *   **Goal:** Shift from "what it looks like" to "how it happened."
  *   **Dependency:** Requires Phase 1's agreement on indistinguishability.
  *   **Move:** Reveal the provenance. Object A (Lifetime), Object B (Posthumous/Estate). Ask: "If they look the same, are they the same *thing*?"
  *   **Why:** This introduces **Origin Value** without the baggage of criminal fraud. It establishes that the *history of production* is part of the work's identity, not just its backstory.

  **Phase 3: The Complication (Minutes 30–50)**
  *   **Goal:** Prevent the "One Genius Hand" simplification.
  *   **Dependency:** Requires Phase 2's acceptance that history matters.
  *   **Move:** Introduce the **Workshop Replica**. (See below for placement).
  *   **Why:** If you don't do this, they will define Origin Value as "touched by the master's hand." The Workshop case forces them to refine Origin Value to "authorized by the master's intent." This prepares them for the Forgery case (unauthorized intent).

  **Phase 4: The Crisis & Resolution (Minutes 50–65)**
  *   **Goal:** Handle the "Fake" and the "Value."
  *   **Dependency:** Requires the refined definition of Origin from Phase 3.
  *   **Move:** Introduce **Van Meegeren**. (See below for placement). Introduce **Exposure Value**.
  *   **Why:** This answers the visitor's "What are we paying for?" It allows you to say: "We pay for Origin, but sometimes we value the Exposure of the lie more than the truth."

  **Phase 5: The Script (Minutes 65–75)**
  *   **Goal:** Translation to visitor language.
  *   **Dependency:** All previous phases.
  *   **Move:** Draft the response to "If you can't tell them apart..."
  *   **Why:** Practical application.

  ---

  ### 2. The Carrying Example
  **The Object:** Two silver gelatin photographs from the same negative (e.g., Ansel Adams, Stieglitz, or a generic high-quality archival equivalent if originals are unavailable).
  *   **Item A:** A **Vintage Print** (printed by the artist, shortly after the negative was made).
  *   **Item B:** A **Later Estate Print** (printed from the original negative, after the artist's death, by the estate).

  **What it has:**
  *   **Identical Image:** The composition is pixel-perfect identical.
  *   **Identical Medium:** Both are silver gelatin on paper.
  *   **Clear Value Gap:** The market value difference is usually massive (10x to 100x).
  *   **Physical Handle-ability:** Fits the Print Study Room context; safe to handle with gloves.

  **What it deliberately lacks:**
  *   **Perceptual "Tell":** Unlike a painting forgery, there is no brushwork to analyze. While paper chemistry *might* differ, it's not visible to the naked eye or simple magnification. This prevents the "hunt for the flaw."
  *   **Criminal Baggage:** Neither is a "fake" in the legal sense. Both are authorized impressions. This prevents the session from devolving into "crime vs. art." It isolates the *ontological* difference (History of Production) from the *legal* difference (Fraud).

  **Variations to Dial:**
  *   **If they get stuck on "Money":** Reveal that Item B was owned by a famous collector (adds Career Value) but Item A is still worth more.
  *   **If they insist they look different:** Swap to a digital image on a tablet showing the crops side-by-side to prove visual identity, then return to the physical objects for the "aura."
  *   **If they say "The Estate Print is a copy":** Correct them. It is an *original impression* from the original matrix. This is crucial. It forces the value difference to rest entirely on *time and agency*, not on "copy vs. original."

  ---

  ### 3. The Framework (Origin, Career, Exposure)
  Your three-part framework is sound, but **Exposure Value** needs specific handling to ensure it isn't absorbed into Career Value.

  *   **Origin Value:** "Who made this and when?" (Constitutive).
  *   **Career Value:** "What happened to this object?" (Accretive).
  *   **Exposure Value:** "What does this object's *status* reveal?" (Epistemic).

  **Is Exposure Value real?**
  Yes. It is distinct from Career Value.
  *   *Career Value* is monotonic: More history (Napoleon owned it!) = More value.
  *   *Exposure Value* is dialectical: The object gains value *because it failed*. A Van Meegeren is valuable *because* it is a detected fake. If it were undetected, it would have high Origin Value (false) and high Career Value. Once detected, Origin Value crashes, but Exposure Value spikes.
  *   **Where it belongs:** It must come **last**. You cannot explain why a fake has value until you have established why a real one has value. It is the "twist" that saves them from snobbery. It allows them to tell the visitor: "Sometimes we value the lie because it teaches us about the truth."

  ---

  ### 4. The Traps: Van Meegeren & The Workshop
  **The Workshop Replica:**
  *   **Verdict:** Use it to **open the gap**.
  *   **Placement:** Phase 3 (after Origin Value is established, before Forgery).
  *   **Why:** If you wait until the end, they will have already solidified a binary (Real vs. Fake). The Workshop case (made by assistants, signed by Master) blurs the "Origin" line *before* you introduce the "Fraud" line. It stops them from thinking Origin Value = "One Pair of Hands." It prepares them to understand that Origin Value is about *authority*, not just biology. This makes the Forgery (unauthorized authority) hit harder later.

  **Van Meegeren:**
  *   **Verdict:** It is a **Gift**, but only if contained.
  *   **Placement:** Phase 4 (The Crisis).
  *   **Why:** It is the perfect illustration of **Exposure Value**. The Vermeer forgery is now more famous than many real Vermeers.
  *   **The Trap:** Docents love the story (Nazis, treason, pills). It can eat 20 minutes.
  *   **The Fix:** Tell the story in 3 minutes max. Focus *only* on the trial: "He had to prove it was a fake to save his life." Use this to pivot to: "Once it was proven a fake, did it become worthless? No. It became a different kind of valuable." This is your bridge to Exposure Value.

  ---

  ### 5. Misconceptions: Prediction & Interdiction
  Here is the order they will arise, and where you cut them off.

  1.  **"There must be a physical difference."**
      *   *Prediction:* Minute 10. "If I had better light..."
      *   *Interdiction:* **Phase 1.** Be explicit: "For this session, we are stipulating they are perceptually identical. If we assume there is a flaw, we stop doing philosophy and start doing forensics."
  2.  **"It's all about money/scarcity."**
      *   *Prediction:* Minute 25 (after revealing the value gap).
      *   *Interdiction:* **Phase 2.** When they say "Money," ask: "Why is the money different if the picture is the same?" Force them to name the *reason* for the scarcity (the history), not the scarcity itself.
  3.  **"Science solves this."**
      *   *Prediction:* Minute 40 (during Workshop/Forgery talk). "Pigment analysis would tell us."
      *   *Interdiction:* **Phase 4.** Acknowledge science, then pivot: "Science tells us *when* the pigment was made. It doesn't tell us *why* we care. If science proves this is a fake, do we throw it away? (Reference Van Meegeren). No. So science didn't solve the value question."

  ---

  ### 6. The Check
  **The Question:**
  > "Imagine the museum is burning. You can save the **Authentic Masterpiece** (which is beautiful but historically typical) OR the **Perfect Forgery** (which fooled the world for 50 years and taught us more about art history than the real one). You can only save one. Which goes in the truck?"

  **The Answer That "Got It":**
  > "It depends on what mission we are prioritizing right now. If we are custodians of **Origin**, we save the Real. If we are custodians of **Exposure/History**, we save the Fake. The value isn't in the object; it's in the story we need to tell."
  > *(Look for the hesitation and the nuance. They should refuse the binary.)*

  **The Answer That's Just Polite:**
  > "Well, I think both are important, but I guess we should save the real one because it's the original."
  > *(This collapses back into snobbery/Origin Value only.)*

  **What to Refuse to Settle:**
  At the end, you must explicitly refuse to define **"The True Value."**
  Say this out loud:
  > "I am not going to tell you which value is 'correct.' Whether Origin matters more than Exposure is not a fact I can give you. It is a choice the museum makes, and it is a choice you help the visitor make. Your job isn't to tell them what to pay for; it's to tell them *what is available to be paid for*."

  This protects you from the "So is it snobbery or not?" trap. It's not snobbery; it's transparency about value categories.
