      *   *Discriminating Case:* Need a case where numbers are huge, burdens are moderate (not trivial), and the other side is severe but few. Or a case where aggregation is permitted within a band.
      *   *Closest Analog:* Ruling 2 (Night Flights). It's the same structure: Many people with moderate/temporary burden vs Few people with severe/permanent burden.

