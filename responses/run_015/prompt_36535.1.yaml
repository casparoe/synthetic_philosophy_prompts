      *   *Conclusion:* Her pattern is consistently "Compare the strongest individual complaint on each side." She does not sum small burdens to outweigh a large burden *unless* the large burden is on the side of the many (Ruling 3 is actually: Many small burdens vs Few Deaths. She chose Few Deaths. Wait, Ruling 3 says "Required to tax millions to save hundreds." So she *imposed* the small burdens to prevent the large burden. This means the complaint of the dying hundreds outweighs the complaint of the taxed millions. This fits Strongest Complaint.)
      *   *Wait, check Ruling 3 again:* "Government may slightly raise taxes on millions to fund life-saving treatment for a few hundred." Verdict: Required.
          *   Side A: Millions pay tax. (Individual complaint: Small financial loss).
          *   Side B: Hundreds die. (Individual complaint: Death).
          *   Strongest Complaint Comparison: Death > Small Tax. So we must prevent Death. This fits Strict Contractualism.
      *   *Check Ruling 2:* 100k (Sleep loss) vs 20 (Health damage).
          *   Side A: 100k sleep loss. (Individual complaint: Mild).
