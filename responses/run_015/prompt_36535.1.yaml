          *   *Fit:* Fits Ruling 1 (Constraint against killing). Fits Ruling 3 (Aggregate small taxes > few lives). Fits Ruling 2 (Maybe? If 20 severe health damages > 100k sleep losses in utility units). Fits Ruling 4 (If 1 Agony > 2 Moderates in utility).
