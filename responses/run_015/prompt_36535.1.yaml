          *   Strongest Complaint: Health Damage > Sleep Loss. Save the 20. Fits Strict Contractualism.
      *   *Check Ruling 4:* 1 Agony vs 2 Moderate.
          *   Side A: 1 Agony.
          *   Side B: 2 Moderate.
          *   Strongest Complaint: Agony > Moderate. Save the 1. Fits Strict Contractualism.
      *   *Check New Case:* 200M (Flu) vs 400 (Disability).
          *   Side A: 200M Flu. (Individual complaint: 2 weeks misery).
          *   Side B: 400 Disability. (Individual complaint: Permanent severe pain/disability).
          *   Strongest Complaint: Disability >> Flu.
          *   Prediction: Save the 400.
      *   *Constrained Utilitarianism:* Would sum the 200M flu weeks. 200,000,000 * 2 weeks is a massive amount of utility. 400 * Permanent is large, but likely smaller in aggregate. Utilitarian says: Fund Flu.
      *   *Decision:* The friend's record (especially Ruling 4) strongly points away from aggregation. She prioritizes the depth of suffering over the breadth.

  5.  **Drafting the Response:**
      *   *Tone:* Professional, philosophical, analytical.
      *   *Structure:*
          1.  Introduction (Role acceptance).
