answer: |-
  **Project Title:** The Structure of Consensus: Dependency and Aggregation in Multi-Peer Disagreement

  **Project Summary and Core Question**
  The contemporary debate over peer disagreement is stalled. Conciliationism (the view that one must significantly adjust credence upon encountering a disagreeing peer) and Steadfastness (the view that one may retain one's initial credence) have reached an equilibrium where counter-examples are met with adjustments that render the views increasingly ad hoc. This proposal argues that the stalemate stems from a structural limitation: the literature almost exclusively models disagreement as a dyadic interaction between two agents. It then assumes that the normative rule for this pair generalizes to larger groups via simple iteration. I contend this generalization fails. When moving from one peer to many, the *causal structure* of the group's agreement becomes epistemically load-bearing in a way that dyadic models ignore.

  Consequently, the project asks a narrow, determinate question: **Does the normative force of a group's consensus scale with the number of dissenters, or does it depend on the causal independence of their judgments?** Specifically, I will determine whether a "phantom consensus"—where a group converges due to shared dependency rather than independent verification—licenses the same doxastic adjustment as a consensus reached via independent paths. This is not a question about how to count votes, but about what constitutes a new piece of evidence in a social context.

  **Why Standard Views Leave This Open**
  Current treatments leave this question open because they treat the *fact* of disagreement as the evidence, rather than the *genealogy* of that fact. Standard Conciliationism posits that a peer's dissent is a higher-order defeater. In a multi-peer context, this view lacks a principled aggregation rule. If I encounter ten dissenters, do I adjust ten times? If I adjust sequentially, my final credence depends on the order of encounter (path-dependence), which is epistemically arbitrary. If I adjust once toward the group mean, I implicitly treat the group as a single composite peer. But this ignores that the group's reliability is a function of their internal correlations.

  Conversely, Steadfast views often rely on the "right reasons" defense: I can stick to my guns if I correctly evaluated the first-order evidence. However, this defense weakens as the group size grows, unless the Steadfast theorist can explain why a thousand correlated peers provide no more pressure than one. Neither view has the resources to distinguish between a thousand independent verifications and a thousand echoes of a single source. They treat the *headcount* as a proxy for *evidential weight*, but in cases of high correlation, that proxy breaks. The difficulty is not merely technical; it strikes at the core of what peer disagreement is supposed to teach us about the social nature of evidence.

  **Methodology**
  I will not proceed by polling intuitions on increasingly complex cases, nor by constructing formal models that presuppose independence. Intuitions are unreliable regarding statistical structure, and formal models often hide the correlation problem within prior probabilities.

  Instead, I will employ a method of *structural isolation*. I will construct paired cases where the number of peers and their competence are held constant, but the causal history of their agreement varies (e.g., a "Chain" case where peers defer sequentially to one another, versus a "Hub" case where all defer to a common source, versus a "Network" case of independent convergence). I will then test whether existing epistemic norms yield contradictory verdicts or require information unavailable to the agent.

  The goal is to derive a principle of *Evidential Independence*: a criterion for when a peer's opinion counts as a new data point versus when it is merely a restatement of existing data. This requires analyzing the concept of "peerhood" not as a static property of competence, but as a relational property concerning information streams.

  **Outcomes and Failure Conditions**
  There are three viable conclusions. (1) **The Discount Principle:** Consensus among correlated peers provides less justification than independent consensus, requiring a discount factor in credence adjustment. (2) **The Transparency Thesis:** The causal structure of the group is epistemically invisible to the agent; therefore, headcount must remain the primary proxy, even if flawed. (3) **The Collapse:** The distinction between "independent" and "dependent" agreement is unintelligible without access to the truth, rendering the project moot.

  I define project failure strongly. The project fails if I conclude that the normative rule required to handle correlation demands information the agent *cannot possibly possess*. If the only way to distinguish a phantom consensus from a robust one requires knowing the truth of the matter or having omniscient access to the peers' causal histories, then the resulting epistemology is action-guiding in name only. In that case, the project would demonstrate that the multi-peer problem is not a puzzle to be solved, but a sign that our normative framework is mismatched to human cognitive limitations. This would be a substantive result, but it would mean the original aim—providing a usable rule for adjustment—is unattainable.

  **Scope and Deliverables**
  **In Scope (Fellowship Year):** I will limit the analysis to cases where the agent knows the *structure* of the group's interaction (e.g., they know the peers talk to each other) but not the *content* of those interactions. I will focus on establishing the theoretical necessity of an aggregation rule that accounts for dependency. I will not build a full formal probability model, nor will I apply the framework to specific empirical controversies (e.g., climate science or political polling).

  **Deferred (Dissertation):** Developing a formal Bayesian model of the proposed aggregation rule and applying it to specific domains of scientific expertise will be reserved for the dissertation. The fellowship year is for the conceptual groundwork: defining the norms, not calculating the numbers.

  **Practical Upshot**
  Is there a deliverable for the non-philosopher? Yes, but it is modest. For those convening expert panels, the standard heuristic is "more agreement equals higher confidence." If this project succeeds, it demonstrates that unanimity among a homogenous group is less weighty than near-unanimity among a methodologically diverse group. The practical upshot is not a formula for weighting votes, but a design principle for epistemic communities: diversity of information stream is more valuable than diversity of demographic or even competence. If the project fails (per the condition above), the upshot is a warning: that we cannot rationally calibrate confidence based on consensus alone without auditing the causal history of that consensus. This is a real deliverable, not a stretch, as it directly impacts how institutions validate expert testimony.

  **Critical Note on Framing**
  I must note a potential mislocation in the initial framing. The difficulty is not strictly about "many" peers. A dyadic case can exhibit the same structural flaws if the two peers are causally dependent. However, the multi-peer context is the necessary *locus* for this investigation because correlation effects compound and become visible only at scale. In a dyad, dependency is often treated as a special exception; in a group, it is the rule. Therefore, while the core philosophical problem is *dependency* rather than *number*, the multi-peer case is the correct venue for solving it. I will proceed with the multi-peer focus, but with the explicit understanding that the target is the logic of aggregation under dependency, not the mathematics of large numbers.
