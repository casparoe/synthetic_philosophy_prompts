  # Flowchart: Iterated Knowledge & Luminosity

  **Start Here.** Answer each question based on your intuition about the case or claim. Follow the arrows to your position.

  **Q1. The Warming Room (Positive Blind Spots)**
  A room warms so slowly you cannot feel the change from one second to the next. Eventually, you are no longer cold. Is there a specific second where you *know* you are not cold, but cannot tell that you know it (because it feels identical to the previous second)?
  *   **No** (If you know, you can tell) → **Leaf A**
  *   **Yes** (Knowledge can be opaque) → **Q2**

  **Q2. The Warming Room (Negative Blind Spots)**
  In that same room, is there a specific second where you *do not know* you are cold, but cannot tell that you don't know it (because it feels identical to when you did know)?
  *   **No** (If you don't know, you can tell) → **Leaf B**
  *   **Yes** (Ignorance can be opaque) → **Q3**

  **Q3. The Mental Arithmetic (Margin for Error)**
  A student does quick math. She is 90% reliable but cannot distinguish her correct answers from her 10% errors. When she gets it right, does she *know* the answer, even though she couldn't distinguish this success from a nearby failure?
  *   **Yes** (Knowledge does not require a safety margin) → **Leaf C**
  *   **No** (Knowledge requires stability across nearby cases) → **Q4**

  **Q4. The Margin at Second Order**
  You accept knowledge requires a margin for error (Q3=No). Is the margin required to *know that you know* strictly tighter than the margin required simply to *know*?
  *   **No** (The margin is weaker or equal at the second order) → **Leaf D**
  *   **Yes** (The margin accumulates/tightens) → **Q5**

  **Q5. The Forgotten Fact (Infection)**
  You were taught a fact years ago. You have no idea whether you still remember it. You are asked and answer correctly. Does your inability to tell whether you know it undermine the fact that you *do* know it?
  *   **Yes** (Second-order failure defeats first-order status) → **Leaf E**
  *   **No** (First-order knowledge stands intact) → **Q6**

  **Q6. Scope of Luminosity**
  You accept knowledge isn't luminous (Q1=Yes) but stands intact (Q5=No). Is *anything* epistemic luminous (always knowable when present)?
  *   **Yes, Justification/Rationality** → **Leaf F**
  *   **Yes, only Phenomenal States** (e.g., pains, sensations) → **Leaf G**
  *   **No, nothing epistemic is luminous** → **Leaf H**

  ***

  ## Leaves & Practical Commitments

  **Leaf A: Full Luminosity**
  *   **Commitment:** You may assert/act on $p$ only if you can tell that you know it.
  **Leaf B: Asymmetric Luminosity (Unnamed)**
  *   **Commitment:** You may assert/act on $p$ if you know it, even if you can't tell you know it (but you can always tell if you *don't* know).
  **Leaf C: Fragile Knowledge**
  *   **Commitment:** You may assert/act on $p$ if you know it, even if your knowledge is indistinguishable from error.
  **Leaf D: Weaker Margin View (Unnamed)**
  *   **Commitment:** You may assert/act on $p$ if you know it; second-order knowledge is stable enough even where first-order is borderline.
  **Leaf E: Change-of-Subject (Norms of Assertion/Action)**
  *   **Commitment:** You may assert/act on $p$ if permitted by the relevant norm (e.g., rationality), not necessarily knowledge.
  **Leaf F: Justification Luminous (Unnamed)**
  *   **Commitment:** You may assert/act on $p$ if you are justified, which you can always tell you are.
  **Leaf G: Restricted Luminosity**
  *   **Commitment:** You may assert/act on $p$ if you know it; for non-phenomenal $p$, you may not be able to tell you know.
  **Leaf H: Global Anti-Luminosity (Margin for Error)**
  *   **Commitment:** You may assert/act on $p$ if you know it, but you can never rule out that you merely believe it.

  ***

  ## Analysis Notes for the Instructor

  **1. The "Weaker Margin at Second Order" Combination (Leaf D)**
  *   **Status:** **Unattractive (likely empty).**
  *   **Why:** It is not strictly incoherent, but it is unmotivated. Williamson's margin argument relies on the fact that evidence reliability degrades across indistinguishable cases. To claim the margin requirement *shrinks* or weakens for $KKp$ compared to $Kp$ requires stipulating that higher-order knowledge is *easier* to secure than first-order knowledge despite relying on the same evidence. This looks like ad-hoc gerrymandering to save the KK principle without denying the margin premise.

  **2. Indistinguishable Leaves**
  *   **Leaf C (Fragile) vs. Leaf H (Global Anti-Luminosity):** On the specific practical question ("May you act where you can't tell if you know?"), these converge. Both say **Yes**. The tree separates them theoretically (whether knowledge *requires* a margin), but not practically regarding assertion conditions.
  *   **Leaf E (Change-of-Subject) vs. Leaf F (Justification Luminous):** These often converge practically. If knowledge is not the norm because it isn't luminous, and justification *is* luminous, both views permit assertion based on luminous justification. The tree separates them by whether knowledge itself is "defeated" (E) or merely "accompanied" by luminous justification (F).

  **3. Separation of Positive/Negative Branches**
  *   **Leaf A vs. Leaf B:** The tree successfully separates students who deny blind spots entirely (A) from those who deny only negative blind spots (B). This captures the asymmetry intuition without forcing a global label.
