answer: |-
  Aquinas concludes that the breakdown of legal channels does not transform direct resistance into a permissible last resort for private individuals, but rather deepens the tragedy by removing the remedy while leaving the moral prohibition intact. In *De Regno* and the *Summa Theologiae*, Aquinas distinguishes between a usurper, who may be repelled by anyone because he lacks legitimate title, and a legitimate ruler who becomes tyrannical, against whom private violence is forbidden because the judgment of the ruler belongs to the public authority, not the private person. When institutional remedies are exhausted, Aquinas does not argue that the right of judgment devolves to the individual; instead, he maintains that if no superior public authority exists to intervene, the community must have recourse to God rather than taking up the sword privately. The concern regarding disorder is therefore not merely a contingent, consequentialist calculation about whether chaos might worsen, but a structural requirement of natural law wherein the private individual lacks the ontological status to act for the common good in a judicial capacity. Consequently, the absence of a legal remedy does not annul the moral duty to avoid sedition, because the act of private tyrannicide itself constitutes a disordering of the hierarchical structure of justice, regardless of the tyrant's own injustice. Aquinas thus posits that while the tyranny is an evil, the private usurpation of public judgment is a distinct evil that is not justified even by the collapse of the institutions designed to prevent it.
