  2.  **Analyze the Question & Ideal Answer:**
      *   **Part 1: Explain Contrast & Argument.**
          *   *Inside View:* Focuses on specifics, causal mechanisms, plan details, unique features. Often optimistic (planning fallacy).
          *   *Outside View:* Focuses on statistics of a reference class, distribution of outcomes, base rates. Ignores specifics.
          *   *Argument for Modesty:* Inside view is prone to cognitive biases (overconfidence, neglect of distributional info). Outside view corrects this by anchoring to empirical reality. Therefore, be modest about specific plan-based predictions.
      *   **Part 2: Assess Strength.**
          *   *Strengths:* Robust empirical evidence (planning fallacy), counters optimism bias.
          *   *Weaknesses/Nuance:* Reference class problem (how to define "similar"?), ignoring relevant specific information (if the project *is* actually different), potential for "blind" statistical application. It's not that details carry *no* weight, but they are often overweighted.
      *   **Part 3: The Case (DAC Plant).**
          *   *Scenario:* Inside estimate $400m/4yrs. Reference class median estimate $350m/3.5yrs, median out-turn $900m/7yrs. Team adopts $900m/7yrs.
          *   *Objection:* The reference class data (overruns) is based on *other people's* inside views (sanction estimates). If everyone is biased, does the ratio/outturn data correct for it?
          *   *Analysis of Objection:* This is the crux. The objection claims the outside view inherits the bias.
          *   *Counter-analysis:* The outside view uses the *out-turn* data relative to the *estimate*. Even if the original estimates were optimistic, the *ratio* of Out-turn/Estimate captures the systematic bias. If the median overrun is 2.5x ($900m/$350m), applying that ratio to the new inside estimate ($400m * 2.5 = $1000m) is actually the correct outside view procedure. The student needs to recognize that the *distribution of outcomes* (the $900m) already embodies the correction for the initial optimism of the reference class. The objection confuses the *source* of the baseline with the *value* of the distribution.
          *   *Does process matter?* If the team's process is identical to the reference class process, the outside view is *more* powerful (you can apply the adjustment factor directly). If the team's process is different (e.g., they learned from past mistakes), the outside view needs adjustment.
      *   **Key Insight required:** The outside view doesn't just take the median *out-turn* blindly; it usually involves calculating an adjustment factor (ratio) based on the class and applying it to the specific inside view. However, even taking the median out-turn is often better than the inside view. The colleague's objection is *weak* or *misunderstands* how the outside view works. The outside view *corrects* for the optimism in the sanction estimates precisely by looking at what actually happened. The fact that the baseline was optimistic is *why* the out-turn is higher.

