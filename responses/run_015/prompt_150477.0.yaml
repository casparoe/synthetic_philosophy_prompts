answer: |-
  # The Distributive Ethics Diagnostic Tree

  This instrument is designed to map the logical space of distributive views without presupposing theory names. It proceeds from fundamental metaphysical commitments about value down to specific verdicts on cases. There are **10 Branch Nodes** (questions) and **10 Leaves** (positions).

  ## Part 1: The Decision Tree

  **Node 1: The Isolation Test (Pattern vs. Relations)**
  *Question:* Imagine two isolated communities that never interact. In Community A, everyone is equally well-off. In Community B, some are much better off than others, but nobody knows about the other group, and no one's absolute welfare is affected by the inequality. Is Community B worse *in respect of justice* than Community A?
  *   **Yes:** Go to Node 2. (You believe inequality is bad as a pattern/state of affairs).
  *   **No:** Go to Node 4. (You believe injustice requires interaction, relations, or agency).

  **Node 2: The Levelling-Down Test (Telic Value)**
  *Question:* Suppose we can make Community B equal to Community A only by destroying the excess goods of the better-off, without giving them to anyone else (everyone ends up worse off than the rich were, and the poor gain nothing). Is there *any respect in which* this new equal outcome is better than the unequal one, even if it is worse all-things-considered?
  *   **Yes:** Go to Node 3. (You accept some telic value in equality itself).
  *   **No:** Go to Node 3. (You reject the intrinsic value of equality but maintain the pattern view—*see Empty Leaf diagnosis*).
      *   *Note:* For the purpose of the tree, a "No" here combined with a "Yes" at Node 1 leads to the **Unnamed/Empty** leaf (see Part 3). A "Yes" leads to **Telic Egalitarianism**.

  **Node 3: The Top-Addition Test (Scope of Equality)**
  *Question:* A new person is created who is happier than everyone else currently alive. No existing person is harmed, but inequality increases. Does this make the outcome worse *in respect of justice*?
  *   **Yes:** **Leaf: Mixed Telic View (Prioritarianism + Equality Term).**
  *   **No:** **Leaf: Telic Egalitarianism (LDO-Biting).**
      *   *Wait, correction on logic:* If you said "Yes" to Node 2 (LDO has value), you are a standard Telic Egalitarian. If you said "No" to Node 2 but "Yes" to Node 1, you are in the Empty spot.
      *   *Refined Path:*
          *   Node 2 = Yes → **Leaf: Telic Egalitarianism.**
          *   Node 2 = No → Node 3.
          *   Node 3 = Yes → **Leaf: Mixed Telic View.**
          *   Node 3 = No → **Leaf: Plain Prioritarianism.**

  **Node 4: The Basis of Weight (Absolute vs. Relative)**
  *Question:* When deciding who to help, do we give priority to a person because they are *below others* (relative) or because they are *absolutely badly off* (e.g., in pain, deprived), even if no one else is better off?
  *   **Relative (Below Others):** Go to Node 5.
  *   **Absolute (Badly Off):** Go to Node 6.

  **Node 5: The Threshold Test (Sufficiency)**
  *Question:* Does the moral urgency of helping the worse-off disappear completely once they reach a "good enough" level, even if others are vastly richer?
  *   **Yes:** **Leaf: Sufficientarianism.**
  *   **No:** **Leaf: Relational Egalitarianism.** (If you care about relative gaps but not absolute levels, and reject Node 1's pattern view, you likely care about social relations/status).

  **Node 6: The Risk and Claims Test (Ex-Post vs. Ex-Ante)**
  *Question:* We must choose between: (A) Giving a large benefit to the worst-off person for sure; or (B) A 50% lottery where either the worst-off or the best-off gets the benefit. Do we maximize the *expected weighted value* of the outcome, or do we try to give the worst-off person a *fairer chance* to win, even if expected value is lower?
  *   **Maximize Expected Value:** Go to Node 7.
  *   **Fair Chance/Claims:** **Leaf: Competing-Claims / Weighted-Lottery View.**

  **Node 7: The Intra-Personal Test (Smoothing)**
  *Question:* Consider a single life with "great years" and "terrible years." If we can smooth this life by removing goods from the great years without adding them to the terrible years (making the life worse overall), does justice require this smoothing?
  *   **Yes:** **Leaf: Plain Prioritarianism.** (You apply the weighting to benefits regardless of interpersonal relations).
  *   **No:** Go to Node 8. (You think priority/weighting only applies between people).

  **Node 8: The Constraint Test (Goal vs. Rule)**
  *Question:* Is equality something we should try to *maximize* (promote as a goal), or is it a *constraint* on how we may treat people (e.g., we must not treat anyone as inferior)?
  *   **Maximize:** **Leaf: Unweighted Beneficence.** (If you don't weight by priority and don't care about relations, you are summing benefits).
  *   **Constraint:** **Leaf: Deontic Egalitarianism.**

  **Node 9: The Responsibility Test (Luck vs. Choice)**
  *Question:* (For Deontic/Relational views) Does it matter if the inequality arose from people's voluntary choices rather than brute luck?
  *   **Yes (Luck matters):** **Leaf: Luck-Egalitarianism (Variant).**
  *   **No (Relations matter regardless):** **Leaf: Relational Egalitarianism (Strict).**
      *   *Adjustment:* To keep leaf count clean, let's merge this into Node 5/8 logic. Let's use Node 9 to separate the **Unnamed** leaf.

  **Node 10: The Empty Logic Check**
  *Question:* (Diagnostic only) Do you hold that Inequality is bad in itself (Node 1=Yes), but Levelling Down has no value (Node 2=No), AND Top-Addition creates no injustice (Node 3=No)?
  *   **Yes:** **Leaf: Unnamed/Empty Position.**
  *   **No:** (You are located in one of the above leaves).

  ---

  ## Part 2: The Leaves (Positions Located)

  1.  **Telic Egalitarianism:** (Node 1: Yes → Node 2: Yes). Holds that inequality is intrinsically bad. Bites the bullet on Levelling Down (admits it is in one respect better).
  2.  **Mixed Telic View:** (Node 1: Yes → Node 2: No → Node 3: Yes). Holds that inequality is bad, but not intrinsically enough to justify Levelling Down. However, accepts that "Mere Addition" (Top-Addition) worsens justice. *Diagnosis:* Often unstable; risks collapsing into Telic or Prioritarianism.
  3.  **Plain Prioritarianism:** (Node 1: Yes → Node 2: No → Node 3: No OR Node 6: Max Value → Node 7: Yes). Gives weight to benefits based on absolute welfare levels. Dissolves LDO (leveling down is never better). Accepts Intra-personal smoothing (priority applies to temporal parts of lives).
  4.  **Competing-Claims / Weighted-Lottery:** (Node 6: Fair Chance). Distinct from Plain Prioritarianism only under risk. Argues that the worse-off have a stronger *claim* to be aided, which might justify a lottery over maximizing expected weighted utility.
  5.  **Sufficientarianism:** (Node 5: Yes). Moral weight is binary: below threshold matters, above does not. Inequality above the threshold is irrelevant.
  6.  **Relational Egalitarianism:** (Node 1: No → Node 4: Relative → Node 7: No). Inequality is only bad when it constitutes oppressive social relations or hierarchy. Rejects Intra-personal smoothing (no relations to damage within one self).
  7.  **Deontic Egalitarianism:** (Node 8: Constraint). Equality is not a goal to promote but a side-constraint on action (e.g., we must not act on reasons that deny equal status).
  8.  **Unweighted Beneficence:** (Node 8: Maximize → Node 9: No Weight). Classical Utilitarianism. Benefits count equally regardless of who gets them.
  9.  **Luck-Egalitarianism:** (Node 9: Yes). A variant of Relational/Deontic views where inequality is only objectionable if it stems from brute luck, not choice.
  10. **Unnamed/Empty Position:** (Node 10: Yes). Claims inequality is a bad pattern, yet denies Levelling Down has value and denies Top-Addition creates badness. *Diagnosis:* Logically incoherent. If the pattern is bad, changing it toward equality should have value, and changing it toward inequality should have disvalue.

  ### Indistinguishable Leaves
  *   **Plain Prioritarianism vs. Competing-Claims:** On **sure outcomes**, these views are often extensionally equivalent. They only diverge under **Node 6 (Risk/Uncertainty)**. If your group only discusses certain outcomes, you cannot distinguish these leaves.
  *   **Relational Egalitarianism vs. Deontic Egalitarianism:** Both reject the Telic pattern. They often converge on verdicts. The distinction lies in whether the focus is on *social ontology* (Relations) or *justificatory duty* (Constraints). In practice, they may be indistinguishable without probing the *reason* for the verdict.

  ### Empty Branch Diagnosis
  *   **The "Pattern without Value" Spot (Unnamed Leaf):** This position claims inequality is a bad state of affairs (Telic) but denies that moving toward equality (Levelling Down) has any value and denies that moving away (Top-Addition) has disvalue.
  *   **Why it's empty:** It severs the link between the *evaluation of states* and the *evaluation of changes*. If a state is bad, removing that badness must be good in some respect. Defenders usually abandon the Telic claim (Node 1) rather than hold this incoherent combination.

  ---

  ## Part 3: The 10-Question Quiz

  *Instructions: Answer Yes/No or A/B. Tally your score to find your position.*

  **Q1. The Isolation Case:** Two groups never meet. Group A is equal; Group B is unequal. Is B unjust?
  *   (Yes = 1 pt) / (No = 0 pts)

  **Q2. The Blindness Case:** We can blind the sighted to match the blind, making no one better off. Is this *in any respect* a change for the better?
  *   (Yes = Telic) / (No = Non-Telic/Prior)

  **Q3. The Happy Stranger:** Creating a very happy person increases inequality but harms no one. Is justice diminished?
  *   (Yes = Equality Term) / (No = Priority/Beneficence)

  **Q4. The Basis:** Do we help the poor because they are *below others* or *absolutely needy*?
  *   (Below = Relational) / (Needy = Prioritarian)

  **Q5. The Cutoff:** Once everyone has "enough," does inequality stop mattering morally?
  *   (Yes = Sufficientarian) / (No = Egal/Prior)

  **Q6. The Lottery:** Worst-off needs help. Do we give it for sure, or flip a coin with the best-off to respect fair chances?
  *   (Sure/Expected Value = Prior) / (Coin/Claims = Competing Claims)

  **Q7. The Single Life:** Should we smooth goods between your "good years" and "bad years" even if the total is lower?
  *   (Yes = Pattern/Prior) / (No = Relational)

  **Q8. The Goal:** Is equality something to *maximize* or a rule *not to violate*?
  *   (Maximize = Telic/Prior) / (Rule = Deontic)

  **Q9. The Cause:** Does it matter if the inequality was caused by bad luck or bad choices?
  *   (Yes = Luck-Egal) / (No = Relational/Prior)

  **Q10. The Consistency:** Is inequality bad in itself, yet Levelling Down has no value, and Top-Addition has no disvalue?
  *   (Yes = Unnamed/Incoherent) / (No = Consistent View)

  ### Scoring Key

  *   **Q1=Yes, Q2=Yes:** **Telic Egalitarianism.** (You value the pattern enough to bite the LDO bullet).
  *   **Q1=Yes, Q2=No, Q3=Yes:** **Mixed Telic View.** (You value the pattern but try to avoid LDO; vulnerable to Top-Addition).
  *   **Q1=Yes, Q2=No, Q3=No, Q4=Needy, Q6=Expected Value:** **Plain Prioritarianism.** (You weight benefits by absolute level, ignore relations).
  *   **Q1=Yes, Q2=No, Q3=No, Q4=Needy, Q6=Fair Chance:** **Competing-Claims View.** (You weight claims, not just outcomes).
  *   **Q4=Below, Q5=Yes:** **Sufficientarianism.** (You care about relative status only below a threshold).
  *   **Q4=Below, Q5=No, Q7=No:** **Relational Egalitarianism.** (You care about hierarchy, not patterns or intra-personal smoothing).
  *   **Q1=No, Q8=Rule:** **Deontic Egalitarianism.** (Equality is a constraint on action, not a state to promote).
  *   **Q4=Needy, Q8=Maximize, Q9=No:** **Unweighted Beneficence.** (You maximize total good without weighting).
  *   **Q9=Yes (with Q1=No):** **Luck-Egalitarianism.** (Inequality is only bad if unchosen).
  *   **Q10=Yes:** **Unnamed/Empty.** (Your position is logically unstable).

  ### Note for the Facilitator
  If your friend (the Prioritarian) scores as **Plain Prioritarianism** but insists he dissolves the LDO, check **Q2**. If he answers "No" (LDO has no value), he is consistent. If he answers "Yes" (LDO has *some* value), he is sliding into **Telic Egalitarianism**. The "relocation" you suspect happens if he answers "No" to Q2 but "Yes" to Q3 (Mixed View)—he avoids LDO but inherits the "Happy Stranger" objection. The tree forces him to pick which bullet to bite.
