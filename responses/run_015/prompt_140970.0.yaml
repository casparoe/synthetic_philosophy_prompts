  ## 8. Settled vs. Contested (Theoretical Flagging)
  *Use this section to close the seminar. Do not resolve these; flag them as live research disputes.*

  ### Settled (Consensus)
  1.  **Axiomatic Violation:** Cyclic preferences ($A \succ B \succ C \succ A$) violate the Transitivity Axiom of EUT.
  2.  **Exploitability:** An agent with cyclic preferences *can* be money-pumped (strictly poorer after a cycle of trades).
  3.  **Dynamic Inconsistency:** Hyperbolic discounting leads to plans that are not carried out.

  ### Contested (Live Disputes)
  1.  **Exploitability as Definition:** Does being pumpable *constitute* irrationality, or is it merely *evidence* of it? (Some argue a agent can be rational but have "menu-dependent" preferences).
  2.  **Resolute Choice:** Is the **Lock-In** student rational?
      *   *View A (Sequential Rationality):* No. At S2, switching was the optimal choice. Binding S2 was a mistake at S1.
      *   *View B (Resolute Choice):* Yes. Rationality requires honoring plans to avoid the "Naive" trap.
  3.  **The Medium:** Does being pumped in **Consumption Goods** (or SC) carry the same normative force as **Cash**?
      *   *Issue:* If I trade Coffee for Chocolate and back, I have different goods. If I trade Cash for Cash and lose, I have less power.
      *   *Debate:* Some argue goods-pumps are just preference revelation; cash-pumps are true welfare losses.

