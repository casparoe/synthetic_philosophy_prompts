      *   **Constraint:** No real money. Use vouchers redeemable for consumption goods. Must address the limitations of this substitution.
      *   **Learning Outcomes:**
          *   Part 1: Feel strictly poorer after accepted trades (no deception).
          *   Part 2: Experience pre-commitment costs, flexibility traps, and plan adherence.
