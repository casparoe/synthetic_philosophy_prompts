      *   *Revised Part 1:* Endow everyone with Bundle A. Offer trade to B for a small fee. Then C for a small fee. Then A for a small fee.
      *   *Problem:* If they have transitive preferences, they won't trade all the way.
      *   *Solution:* We need to manipulate the *description* or *context* slightly to induce the cycle (framing), OR we accept that only some will participate fully and debrief on *why* they traded.
      *   *Better Solution for Seminar:* Use the "Elicitation Mode" argument. Value by choice vs. value by selling price.
      *   *Actually, the prompt asks for:* "one exploiting synchronic incoherence (cyclic or elicitation-mode-dependent valuations)".
      *   *Let's go with Cyclic Preferences over Goods.* To ensure this happens, we can use the "Similarity" heuristic (Tversky). A is like B, B is like C, C is not like A.
      *   *Practicality:* In 90 mins, we need speed. Let's create three bundles where the trade-off is multidimensional (e.g., Amount vs. Probability vs. Delay).
      *   *Wait, they know EUT.* Let's use EUT violations? No, keep it simple.
      *   *Let's stick to the Prompt's requirement:* "Currency has to be something like vouchers."
