answer: |-
  # Seminar Activity: The Diachronic Money Pump

  ## 1. Overview & Constraints
  *   **Topic:** Rational Choice (Synchronic Coherence vs. Diachronic Consistency).
  *   **Participants:** 16 Undergraduates.
  *   **Time:** Session 1 (90 mins), Session 2 (5 mins start), Session 3 (5 mins start).
  *   **Currency:** **Seminar Credits (SC)**.
      *   **Redemption:** 10 SC = $10 Amazon/Coffee voucher at the end of the term.
      *   **Endowment:** Each student starts with 20 SC.
      *   **Limitation Note:** SC are not fungible cash. They cannot be spent elsewhere, and risk aversion over SC may differ from cash. The design compensates by making redemption *certain* and *salient*, and by keeping stakes small enough that marginal utility of wealth is roughly linear, but large enough to matter (max loss ~5 SC = $5).
  *   **Dealer Bankroll:** You (the instructor) hold a "Bank" of 200 SC to cover net student winnings. If students are pumped, the Bank gains; if they win, the Bank pays.

  ## 2. Materials
  *   **Recording Sheets:** One per student (see Section 5).
  *   **Tickets:** Two types of printed lottery tickets (Part 1).
      *   **Ticket H:** 90% chance of 10 SC, 10% chance of 0 SC.
      *   **Ticket L:** 30% chance of 30 SC, 70% chance of 0 SC.
      *   *(Note: Expected Value is equal: 9 SC. This induces indifference/conflict.)*
  *   **Contract Slips:** (Part 2) Pre-commitment forms.
  *   **Pens.**
  *   **Projector:** For displaying rules and timers.

  ---

  ## 3. Part 1: The Synchronic Pump (Elicitation Mode)
  **Time:** 45 Minutes (Session 1)
  **Goal:** Demonstrate that differing valuation methods (Choice vs. Pricing) can create a cycle $A \succ B$ (choice) and $Val(B) > Val(A)$ (pricing), allowing a pump.

  ### Rules
  1.  **Endowment:** You are given **Ticket H**.
  2.  **Valuation:** You will write down the minimum price you would **sell** H for, and the maximum price you would **buy** L for.
  3.  **Trading:** If your Buy Price for L > your Sell Price for H, you *must* trade H for L, paying a **1 SC Transaction Fee**.
  4.  **Choice:** After trading (or not), you must choose between holding H or L.
  5.  **Reversal:** If you hold L but choose H, you *must* trade L for H, paying a **1 SC Transaction Fee**.
  6.  **Resolution:** One ticket is randomly selected for the whole class to be played out for real SC at the end of Session 1.

  ### Facilitator Script (Part 1)
  > "Welcome. For the next 45 minutes, we are testing market coherence. You each have 20 Seminar Credits (SC). At the end of the term, 10 SC buys a $10 voucher. Treat these as cash.
  >
  > **Step 1:** I have endowed you with Ticket H. Look at it.
  > **Step 2:** On your sheet, write two numbers.
  > *   **Selling Price:** The minimum SC you would accept to give up H.
  > *   **Buying Price:** The maximum SC you would pay to acquire Ticket L instead.
  > *   *Constraint:* Prices must be between 0 and 30 SC.
  >
  > *(Collect sheets or have them hold them up. Scan for inconsistencies.)*
  >
  > **Step 3:** The Market Rule. If your Buying Price for L is strictly higher than your Selling Price for H, the market deems L more valuable. You must trade H for L. The cost is 1 SC fee.
  > *(Identify students where Buy(L) > Sell(H). Instruct them to pay 1 SC to the Bank and swap tickets.)*
  >
  > **Step 4:** Now, look at the ticket in your hand. Circle on your sheet: Do you prefer holding H or L *right now*?
  >
  > **Step 5:** The Market Rule II. If you hold L but circled H, you are holding an inferior asset. You must trade L back to H. Cost is 1 SC fee.
  >
  > **Step 6:** Look at your SC balance. Some of you started with 20, traded, and now have 18, holding the exact same ticket you started with. No one deceived you. The odds didn't change. The pump ran on the gap between how you priced and how you chose."

  ### Handling Objections
  *   **The Skeptic ("I see where this is going, I won't trade"):**
      *   *Script:* "You are free to opt out of the market. However, opting out means forfeiting your endowment and receiving 0 SC for this activity. Rationality includes taking dominated strategies if you refuse to play. Do you wish to forfeit?" (Usually, they trade).
  *   **The Renegotiator ("I changed my mind after the fee"):**
      *   *Script:* "The market is closed. Trades are binding. In real financial markets, you cannot undo a trade because you regret the fee. Your regret is data, not a refund."

  ---

  ## 4. Part 2: The Diachronic Pump (Planning vs. Acting)
  **Time:** 40 Minutes (Session 1) + 5 Mins (Session 2) + 5 Mins (Session 3)
  **Goal:** Demonstrate dynamic inconsistency. Students pay for flexibility they shouldn't want (Naive) or pay for restriction they need (Sophisticated).

  ### The Scenario: "The Paper Deadline"
  *   **Plan A (Virtue):** Submit draft Session 2. Reward: **10 SC** (Session 3).
  *   **Plan B (Vice):** Submit draft Session 3. Reward: **6 SC** (Session 3).
  *   *Rationale:* In Session 1, 10 SC > 6 SC. In Session 2, the effort of submitting feels costly, making 6 SC (less work) attractive.

  ### Rules (Session 1)
  1.  **Choice:** Select a Contract.
      *   **Lock-In (Free):** You *must* submit in Session 2. You get 10 SC in Session 3. (Cannot switch).
      *   **Flexible (Cost 2 SC):** You *may* submit in Session 2 (10 SC) OR Session 3 (6 SC).
  2.  **Payment:** If you choose Flexible, pay 2 SC to the Bank now.
  3.  **Commitment:** Sign the contract.

  ### Rules (Session 2 - 5 Mins)
  1.  **Check-In:** Hand in your draft *OR* a "Deferral Slip".
  2.  **Constraint:**
      *   If **Lock-In:** Must hand in draft.
      *   If **Flexible:** Can hand in draft (10 SC) OR Deferral Slip (6 SC).

  ### Rules (Session 3 - 5 Mins)
  1.  **Payout:** SC awarded based on Session 2 action.
  2.  **Debrief:** Compare net SC (Reward - Fees).

  ### Facilitator Script (Part 2)
  > **Session 1:** "We are now testing time. You want a high grade (10 SC) for early work. But next week, you will be tired.
  > Choose your contract.
  > *   **Lock:** Free. Forces early submission.
  > *   **Flex:** Costs 2 SC. Lets you decide next week.
  > Why buy Flex? Maybe you get sick. But be honest: are you buying insurance, or buying the right to procrastinate?"
  >
  > **Session 2:** "Time is up. Lock-In holders: Submit. Flex holders: Submit for 10 SC, or Defer for 6 SC. Remember, you already paid 2 SC for the right to choose."
  >
  > **Session 3:** "Final tally.
  > *   **Lock-In Group:** Net 10 SC.
  > *   **Flex-Stick Group:** Net 8 SC (10 - 2 fee).
  > *   **Flex-Switch Group:** Net 4 SC (6 - 2 fee).
  > Look at the Flex-Switch group. In Session 1, you said 10 SC was better than 6 SC. Today, you acted as if 6 SC was better. You paid 2 SC to violate your own earlier judgment. That is the diachronic pump."

