      *   *Better Approach:* Use the "Preference Reversal" phenomenon or simple attribute weighting. Or, simpler: Just assign them a preference profile *for the sake of the game*? No, that's fake.
      *   *Best Approach for Class:* Create three bundles where the trade-offs are close enough that framing or minor context shifts induce a cycle. OR, acknowledge that not everyone will be pumped, but those who are will see it.
      *   *Decision:* Let's use three specific prize bundles (e.g., Coffee, Chocolate, Chips). We will ask for rankings. Then we execute trades *only* with those who show cyclic rankings (A>B, B>C, C>A).
      *   *Wait, constraint:* "They actually get money-pumped."
