  ## 6. Debrief & Mapping (Instructor Notes)
  **Time:** Last 15 mins of Session 1.

  1.  **Map Part 1 to Synchronic Incoherence:**
      *   **The Argument:** Rationality requires transitivity and procedure invariance. If $Val(A) = Val(B)$, you shouldn't pay to swap them.
      *   **The Moment:** When a student paid 2 SC to return to Ticket H.
      *   **The Lesson:** This violates **Procedure Invariance**. Your preference depended on *how* it was asked (pricing vs. choosing). This is evidence of constructible preferences, not stable ones.

  2.  **Map Part 2 to Diachronic Inconsistency:**
      *   **The Argument:** Rationality requires **Dynamic Consistency** (Plan now = Act later) or **Consequentialism** (Only final outcomes matter).
      *   **The Three Patterns:**
          1.  **Resolute (Lock-In):** "I know I'm weak. I bind myself." (Coherent if you view the S1 self as authoritative).
          2.  **Naive (Flex-Switch):** "I'll be strong later." (Pumped. Paid for flexibility to be worse off).
          3.  **Sophisticated (Flex-Stick):** "I might need flexibility, but I won't abuse it." (Coherent, but paid 2 SC for unused insurance).
      *   **The Lesson:** From the outside (S3), Resolute and Sophisticated look identical (both submitted early). But their internal reasoning differs. The Naive agent is the only one strictly "money-pumped" over time (Net 4 vs Net 10).

