  ## 7. Predicted Failures & Mitigations

  | Failure Mode | Why it happens | Mitigation |
  | :--- | :--- | :--- |
  | **Stakes Too Small** | 2 SC loss feels trivial. | Emphasize the *percentage* loss (20% of endowment). Remind them 10 SC = $10 real money at term end. |
  | **Satiation/Good Specificity** | "I don't want coffee." | Use **Credits**, not specific goods. Credits are fungible within the seminar economy. |
  | **Suspicion/Trust** | "Prof is tricking us." | Be transparent: "This is a demonstration of theory, not a test of your worth. Losing credits doesn't hurt your grade." |
  | **Genuine Preference Change** | "I wanted coffee S1, tea S3." | Distinguish **Change** (new info/taste) vs. **Inconsistency** (same info, different time). In Part 2, no new info arrived between S1 and S2. |
  | **The "Opt-Out" Loophole** | Skeptics refuse to trade. | Enforce the "Forfeit Endowment" rule. Rationality implies not leaving money on the table. |

  **Honest Note on Limitations:**
  This activity cannot reproduce the **force of neutral media**. Because SC are redeemable only for specific vouchers at term end, they carry "mental accounting" baggage. A true money pump uses cash. I must supply the argument that *if* SC function as utility proxies, the logic holds. I must also supply the philosophical weight of *why* exploitability matters (see Section 8).

