answer: |-
  ### The Premise
  We all agree: **Microphysical Closure.** A complete description of the careenium's simmballs and substrate at moment $t_1$ physically determines the state at $t_2$. No magic, no micro-violations.

  ### The Instrument: An 8-Node Decision Tree
  Answer these questions in order. Stop when you reach a leaf.

  **Node 1: The Inverted-Twins Test**
  Two careenia are micro-identical now, but their symbols mean different things due to past history. Does the substrate's future evolution *diverge* solely because of this difference in meaning?
  *   **Yes:** Go to Leaf A.
  *   **No:** Go to Node 2. (Physicalism)

  **Node 2: The Re-graining Test**
  We describe the same careenium at a finer grain (simmballs) and a coarser grain (symbols). Does the question "which level caused the motion?" dissolve into a mere choice of description?
  *   **Yes:** Go to Node 3. (Perspectivalist Path)
  *   **No:** Go to Node 4. (Realist Path)

  **Node 3: The Dark Room Test**
  A careenium runs for a million years in a sealed box with no observers. Do symbols exist inside it?
  *   **Yes:** Go to Leaf B.
  *   **No:** Go to Leaf C.

  **Node 4: The Clamped Symbol Test**
  An experimenter holds a symbol configuration fixed against the substrate's flow, and the substrate reorganizes around it. Did the *symbol* cause the reorganization?
  *   **Yes:** Go to Node 5. (Efficacious Path)
  *   **No:** Go to Node 6. (Shadow Path)

  **Node 5: The Counterfeit Test**
  A tabulated lookup table reproduces the exact same symbol behaviors as the dynamic careenium. Does the table have genuine symbols?
  *   **Yes:** Go to Leaf D.
  *   **No:** Go to Leaf E.

  **Node 6: The Leak-away Test**
  A symbol configuration is real but erodes quickly unless repaired. Does this temporary, fragile grip count as "pushing" the substrate?
  *   **No:** Go to Leaf F.
  *   **Yes:** Go to Node 7.

  **Node 7: The Graft Test**
  A symbol configuration is moved to a new context where it plays a different role. Does it continue to do its *old* job (intrinsic) or take on the *new* job (contextual)?
  *   **Old Job:** Go to Leaf G.
  *   **New Job:** Go to Node 8.

  **Node 8: The Redundant Alarm Test**
  The micro-state is sufficient to trigger an output, and the symbol-state is also sufficient. Is the output caused *twice* (overdetermined) or *once* (described two ways)?
  *   **Twice:** Go to Leaf H.
  *   **Once:** Go to Leaf I.

  ---

  ### The Map of Positions
  Here are the nine leaves generated by the tree, with the philosophical position assigned to each.

  *   **Leaf A (Node 1: Yes):** **Strong Downward Causation.** The semantic level can override or alter microphysical trajectories.
  *   **Leaf B (Node 1: No, 2: Yes, 3: Yes):** **Descriptivist.** Symbols are real patterns that constrain expectation, but "causation" is a category mistake applied to levels.
  *   **Leaf C (Node 1: No, 2: Yes, 3: No):** **Interpretation-Relativist.** Symbols exist only relative to an observer's intentional stance; no stance, no symbols.
  *   **Leaf D (Node 1: No, 2: No, 4: Yes, 5: Yes):** **Interventionist.** Symbols are causes because fixing them fixes the outcome, regardless of internal dynamics.
  *   **Leaf E (Node 1: No, 2: No, 4: Yes, 5: No):** **Tangled Hierarchy (Hofstadter).** Symbols are efficacious only because the system's self-representation loops back into the substrate dynamics.
  *   **Leaf F (Node 1: No, 2: No, 4: No, 6: No):** **Exclusionist.** The symbol level is a causally inert shadow; only the substrate pushes.
  *   **Leaf G (Node 1: No, 2: No, 4: No, 6: Yes, 7: Old):** **Reductionist/Identity.** Symbols are just substrate configurations; meaning is intrinsic to the shape.
  *   **Leaf H (Node 1: No, 2: No, 4: No, 6: Yes, 7: New, 8: Twice):** **Non-Reductive Physicalism (Overdetermination).** Mental and physical causes are distinct but both sufficient for the effect.
  *   **Leaf I (Node 1: No, 2: No, 4: No, 6: Yes, 7: New, 8: Once):** **Non-Reductive Physicalism (Causal Inheritance).** The symbol causes the effect, but its power is inherited from the substrate, not added to it.

  **Diagnosis of Empty Cells:**
  *   *There are no structurally empty leaves in this tree.* Every path terminates in a named position. However, if you find yourself answering **Node 2 (No)** but feeling that causation is still just a description, you occupy a philosophical gap between **Leaf I (Inheritance)** and **Leaf B (Descriptivist)** that this instrument forces apart via the Re-graining case.

  **Indistinguishability Flag:**
  *   **Leaf B (Descriptivist)** and **Leaf I (Causal Inheritance)** are notoriously difficult to separate via cases. If you answer **Node 2 (No)** (Realist about levels) but believe causation is still descriptive, or answer **Node 2 (Yes)** but believe the inheritance is real, the tree cannot distinguish you. You may land on either leaf depending on a subtle semantic preference not captured by the cases.

  ---

  ### Awkward Commitments
  *One sentence per leaf on the price of admission.*

  *   **Leaf A (Strong Downward):** You must accept that current physics is fundamentally incomplete regarding how meaning moves matter.
  *   **Leaf B (Descriptivist):** You must accept that "cause" is a human habit of speech, not a feature of the careenium itself.
  *   **Leaf C (Relativist):** You must accept that without an observer, the careenium is just noise; symbols are not in the machine.
  *   **Leaf D (Interventionist):** You must accept that a frozen statue could be a "cause" if holding it fixed changes the outcome.
  *   **Leaf E (Tangled):** You must accept that logical loops allow effects to participate in their own causes without temporal paradox.
  *   **Leaf F (Exclusionist):** You must accept that your decision to read this sentence did not physically cause your eyes to move.
  *   **Leaf G (Reductionist):** You must accept that a symbol grafted into a hostile context still "means" what it meant at home, even if it functions differently.
  *   **Leaf H (Overdetermination):** You must accept that every action you take is causally sufficient twice over, which looks like magical redundancy.
  *   **Leaf I (Inheritance):** You must accept that high-level causes are real but carry no "energy" distinct from the micro-level.

  ---

  ### Scoring Key
  To find your leaf, record your answers as a string (e.g., N-Y-Y...).

  1.  **Twins:** Y = **A**. N = Continue.
  2.  **Re-grain:** Y = Continue to 3. N = Continue to 4.
  3.  **Dark Room:** Y = **B**. N = **C**.
  4.  **Clamped:** Y = Continue to 5. N = Continue to 6.
  5.  **Counterfeit:** Y = **D**. N = **E**.
  6.  **Leak-away:** N = **F**. Y = Continue to 7.
  7.  **Graft:** Old = **G**. New = Continue to 8.
  8.  **Alarm:** Twice = **H**. Once = **I**.

  **Neighbor Switching:**
  *   To move from **Exclusionist (F)** to **Inheritance (I)**: Change **Leak-away** to "Yes" and **Graft** to "New Job" and **Alarm** to "Once".
  *   To move from **Inheritance (I)** to **Descriptivist (B)**: Change **Re-grain** to "Yes" and **Dark Room** to "Yes".
  *   To move from **Tangled (E)** to **Interventionist (D)**: Change **Counterfeit** to "Yes".
  *   To move from **Reductionist (G)** to **Inheritance (I)**: Change **Graft** to "New Job" and **Alarm** to "Once".
