          *   *Analysis:* If I commit to Policy P, and P says "Event E never happens," but E happens, my conditional probability $P(World | E, Policy)$ is undefined ($0/0$).
          *   *UDT Defense:* UDT *doesn't condition* on observations to choose the policy. It chooses the policy *ex-ante*. However, to *execute* the policy (map observation to action), it needs to know what action is prescribed for that observation. If the policy is a function $O \to A$, the function must be defined for all $O$. If the prior says $P(O)=0$, the optimization might leave $A(O)$ undefined or arbitrary.
