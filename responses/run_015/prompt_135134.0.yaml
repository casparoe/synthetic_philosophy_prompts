  3.  **Synthesize and Rank:**

      *   *Rank 1 (Fatal/Existential):* The Logical Uncertainty Gap (Objection 3). Without a working theory of logical correlation that avoids spurious proofs and handles counterpossibles, UDT is a ghost.
