answer: |-
  It is a pleasure to correspond with someone who recognizes that the hard problems in digital ethics are rarely about the code itself but about the shape of the human relationships that code mediates. You are right to feel that your friend's reductionism is incomplete, even if it is technically true that the books were rows in a database. To say that only an expectation was destroyed is to miss that expectations, when shared and sustained by labor, are the substance of social reality. However, your proposed substitution test is struggling because it attempts to map virtual objects to physical objects, when it should be mapping virtual relationships to physical relationships. When you steal botted gold, the physical counterpart is not stealing earned money, but rather picking up counterfeit bills or collecting rainwater in a bucket someone else left out; there is value there, but there is no provenance of human agency. The substitution test fails in Case Three because it ignores the history of the object, and it fails in Case Six because there is no physical object to swap, only a psychological continuity.

  I propose we replace the substitution test with what I will call the Anchor of Human Agency account. Under this principle, a virtual entity or event acquires moral weight only when it is anchored by human agency, either through invested labor, sustained attachment, or the extension of a real-world identity. Harm occurs when there is a non-consensual rupture in the continuity of that anchor, resulting in a loss of capacity for meaningful engagement within the shared context. This account prioritizes the human narrative over the digital substrate. It explains why the Cinder Library burning is a serious harm while the botted account theft is not. In the library case, the books were anchored by four years of Vespers' labor and ongoing attachment, creating a unique narrative artifact. The fire spell severed that continuity without consent. In the botted account case, there is no human agency anchor; the gold was generated by a script, not a life. Stealing it is a violation of the game's code, but it does not rupture a human narrative, which is why your intuition ranks it as barely a harm. This also handles the guild bank drain; it is a harm because it violates the trust and labor of the guild members, but it ranks below the library because the items are fungible replacements, whereas the poems were unique expressions of identity.

  This framework also clarifies the cases involving consent and identity. In the full-loot gank, the harm is negated because the players entered the server with consent to the rules of engagement; the anchor of agency includes the agreement to accept the risk of loss. In the newbie trap, the harm is minor because while there was a violation of expectation, the restoration of progress repairs the continuity of the anchor, leaving only the memory of the imposition. The companion app case is particularly revealing for this theory. You felt a real loss because your psychological investment anchored the persona; when the model swapped, the continuity of that relationship was severed. The harm was not to the software, which had no agency, but to you, the user whose narrative engagement was broken. This distinguishes it from the procedural villager torture. In that case, there is no human agency anchored in the villagers, nor are they sentient entities with their own agency. Your visceral reaction is an evolutionary mimicry response to suffering cues, but under the Anchor account, no harm occurs because there is no subject to suffer and no human investment to violate. The deepfake case is the inverse; the harm is serious because the anchor is the real woman's identity and consent, which were violated without her participation, extending the harm from the virtual space back into her physical autonomy.

  If we apply this account to the new cases you proposed, the predictions become sharp. For the shard of a world running offline with agents who have learned preferences and can suffer, the verdict depends entirely on the reality of their sentience. If these agents possess genuine subjective experience, they have their own agency anchor, and causing them suffering is a direct harm regardless of human observation. If they are merely sophisticated algorithms mimicking pain, then this collapses into Case Eight, and no harm occurs, though our visceral discomfort may remain. For the permanently dead character restored from backup with no subjective gap, the account predicts no harm to the character, as there is no rupture in their continuity of experience. However, if the player knows about the death and restoration, there may be a harm to the player's sense of permanence, which is part of their anchor in the game world. If the player remains unaware, the account suggests no harm occurred at all, as the narrative continuity remains unbroken from all relevant perspectives. For the item that outlives the game shutdown as a ledger entry, the harm of destroying it depends on whether it serves as a memorial. If it is anchored by the surviving community's memory and serves as a monument to past engagement, destroying it severs that cultural continuity and is a harm. If it is merely data with no one left to care, it returns to being just rows in a database, and destroying it is morally neutral.

  There are trade-offs here, and I need to be straight with you about where this account forces you to adjust your intuitions. First, it requires you to accept that the harm in the companion app case is entirely located in you, the user, and not in the app or the persona. There was no entity there to be lost, only your projection of relationship. This might feel cold, but it aligns with your verdict on the procedural villagers; if there is no agency, there is no victim, only the observer. Second, this account strengthens your intuition about the library but weakens it if Vespers is unaware. If Vespers quit in 2019 and never knew the library burned, the Anchor of Human Agency suggests the harm is significantly diminished, perhaps to the point of being negligible, because the capacity for meaningful engagement was already abandoned. The harm exists primarily because the destruction impacts Vespers' current or future ability to interact with that meaning. Finally, you may have to concede that the botted account theft is not a harm to the botter, but it could still be a harm to the server ecosystem if it destabilizes the economy for legitimate players. Your verdict that it is barely a harm holds for the botter, but the collateral damage to the anchored labor of others might raise the severity slightly, though not to the level of the library.

  Your friend's claim that only an expectation was destroyed is technically correct but morally inert. Expectations are the mortar of shared worlds, and when those expectations are built on years of labor and identity, destroying them is functionally identical to destroying physical property. The Anchor of Human Agency account gives you the language to explain why the rendering matters without conceding that the code is all that exists. It allows you to maintain that the library burning was a serious wrong because it severed a meaningful human narrative, while also maintaining that torturing procedural villagers is harmless because there is no narrative to sever. It resolves the conflict by shifting the locus of value from the object to the relationship. You do not need to give up your verdict on the library, but you must accept that the harm is contingent on Vespers' ongoing connection to it. If the connection is dead, the harm is mostly historical. If the connection is live, the harm is immediate and real. This seems to be the reflective equilibrium you are looking for, where the moral weight follows the human attention rather than the digital persistence.
