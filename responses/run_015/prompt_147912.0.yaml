prompt: |-
  I was at a dinner with some friends last week — one of them teaches philosophy and was going on about Hegel's master-slave dialectic, and I realized I've been thinking about Mary Shelley's Frankenstein all wrong since probably highschool. I cover science and culture for a magazine, usually writing about biotech or climate politics, but this stuck with me and now I'm obsessed. I want to read the novel through the recognition dialectic, but not the usual "creature just wants love and Victor is mean" take that every intro course uses.

  Instead, focus on this weird asymmetry: in Hegel's account, the slave's labor should eventually make the master depend on the slave's consciousness, which is what forces recognition. The creature does all that formative labor — learning language by spying on the De Laceys, performing emotional work to win them over, saving the girl from drowning — but Victor never actually becomes dependancy on the creature's mind. He just destroys it. So the dialectic stalls in a one-sided way: the slave offers labor and appeals for recognition, but the master avoids the structural dependency that Hegel says is inevitable. Does Shelley dramatize a kind of permanently stalled recognition? Look at the creature's self-education, the shooting after the rescue, and the demand for Eve as a companion — are these moments where he tries to force Victor into dependency, or where he offers labor in exchange for being seen? And does the novel suggest that recognition can fail not just through cruelty, but through the master's refusal to need the other at all?

  Please organize your answer in these sections, in order:
  - The stalled dialectic: lay out this specific reading of Hegel and how it differs from the standard classroom version (~200 words)
  - Scene readings: go through the De Lacey education, the rescue/shooting, and the demand for Eve; show where the lens illuminates them and where it starts to strain (~250 words)
  - Where the novel pushes back: is Shelley actually interested in unconditional moral status rather than mutual recognition? Be honest about where the reading breaks or forces the text (~150 words)
  - What Frankenstein adds: if philosophy assumes the master eventually needs the slave, does the novel correct that by showing a master who can remain self-sufficient through pure negation? (~150 words)
  - Bottom line: is this a productive misreading, or does it distort Hegel too much to be useful? (~100 words)

  Don't cite scholars or give me a bibliography — I'm writing this on my phone between interviews and can't check references. And please don't quote long passages verbatim; I don't have the book in front of me, so paraphrase the scenes from common knowledge of the plot. Also, avoid saying "according to Hegel in the Phenomenology" with page numbers — just work with the ideas as they stand.
