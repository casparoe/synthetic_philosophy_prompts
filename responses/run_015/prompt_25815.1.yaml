answer: |-
  **The Price of Equilibrium: A Lewisian Reading of Omelas**

  David Lewis's *Convention: A Philosophical Study* (1969) provides a rigorous game-theoretic account of social regularities. By defining conventions as arbitrary solutions to recurrent coordination problems, sustained by common knowledge and conditional preferences, Lewis offers a descriptive machinery for understanding how order emerges without central coercion. Ursula K. Le Guin's "The Ones Who Walk Away from Omelas" (1973) presents a social order that appears, on its surface, to be the ultimate stable equilibrium: a utopia maintained by a singular, universally acknowledged sacrifice. To read Omelas through the lens of Lewis is to test the limits of his formalism. Does the citizens' complicity constitute a Lewisian convention? I argue that while the practice in Omelas mimics the structural features of a convention—specifically regarding common knowledge and conditional preference—it ultimately strains the Lewisian condition of *arbitrariness*. Furthermore, the reaction of those who walk away exposes a normative silence in Lewis's account, suggesting that his framework can describe the mechanics of complicity but cannot account for the moral rupture that dissolves a population's willingness to coordinate.

  To determine if the treatment of the child is a convention, we must first identify the coordination problem. For Lewis, a coordination problem exists when agents have common interests in coordinating their actions, but there are multiple equilibria where coordination is achieved (e.g., driving on the left vs. the right). In Omelas, the recurrent situation is the maintenance of the city's flourishing. The regularity $R$ is the collective acceptance of the child's imprisonment. The citizens conform to $R$; they expect others to conform; and they prefer to conform conditional on others doing so. If a citizen were to object publicly while others remained silent, the objector would suffer social ostracization or, within the story's metaphysics, risk the collapse of the collective happiness. Thus, the conditional preference holds: I am willing to bear the guilt of the child *only if* you bear it with me. The burden is distributed by the shared silence.

  However, the Lewisian definition hinges critically on the condition of **arbitrariness**. Lewis insists that for a regularity to be a convention, there must be at least one alternative regularity $R'$ that could have served the same coordinating function. "We drive on the right" is a convention because "We drive on the left" would have worked just as well. In Omelas, is the suffering of the child arbitrary? Here, Le Guin's text introduces an ambiguity that challenges Lewis's formalism. The narrator states, "It is the existence of the child, and their knowledge of its existence, that makes possible the nobility of their architecture... their music." If this is a causal law of the Omelas universe—a magical necessity—then the arrangement is not arbitrary. There is no $R'$. If the child were released, the happiness would vanish regardless of social agreement. In this reading, the citizens are not following a convention; they are obeying a law of nature (or magic). Lewis's theory of convention cannot apply to necessary truths, only to contingent social solutions.

  Yet, a more philosophically fruitful reading treats the "magic" as a metaphor for structural violence. If we interpret the link between the child and the city not as supernatural causality but as sociological reality, the arrangement becomes arbitrary. The prosperity of Omelas could theoretically be distributed differently; the suffering could be alleviated through a reorganization of resources, albeit at the cost of the current intensity of "joy." If the citizens *believe* the suffering is necessary, but it is actually a social construct they uphold to maintain their specific lifestyle, then it fits Lewis's criteria. It is a convention because they *could* choose otherwise (as the walkers prove), but they coordinate on suffering because it preserves the equilibrium they value. The arbitrariness lies in the choice to prioritize this specific form of flourishing over moral integrity.

  This leads to the condition of **common knowledge**. Lewis requires that it be common knowledge in population $P$ that everyone conforms, expects conformity, and has the conditional preference. In Omelas, this condition is met with disturbing precision. Every adult is shown the child; every adult knows that every other adult has been shown the child. There is no deception. Lewis's framework is descriptive and does not account for the *valence* of the knowledge. In standard conventions (like currency), common knowledge facilitates trust. In Omelas, common knowledge facilitates complicity. The "common knowledge" is not merely that the child exists, but that everyone has accepted the bargain. This maps cleanly onto Lewis's formalism, but it highlights a chilling implication: common knowledge can stabilize atrocity just as effectively as it stabilizes traffic. The moral content of the knowledge does not break the Lewisian mechanism; rather, it demonstrates that the mechanism is morally neutral. The "preference" to conform is not based on the intrinsic good of the action, but on the utility of the equilibrium.

  The **ones who walk away** present the most significant challenge to a Lewisian analysis. In Lewis's game theory, if agents stop conforming, the convention dissolves or shifts to a new equilibrium. Defectors usually signal a breakdown in expectations. However, the walkers do not attempt to free the child (which would be an attempt to shift the equilibrium to $R'$); they simply leave the population $P$. In Lewisian terms, they exit the game. Their departure reveals a limit in analyzing moral practices solely as coordination problems. For Lewis, a convention persists because it solves a problem for the participants. The walkers demonstrate that for some agents, the "solution" is unacceptable regardless of its stability. They refuse the conditional preference. They say, in effect, "I do not prefer to conform even if you do."

  This refusal exposes a gap in Lewis's account regarding the *source* of preferences. Lewis takes preferences as given inputs for the game. He does not ask where they come from or whether they are morally permissible. The walkers in Omelas undergo a transformation of preference that Lewis's static model does not easily capture. They realize that the cost of coordination (the child's misery) outweighs the benefit of the equilibrium (the city's joy). By walking away, they do not just defect; they reject the validity of the coordination problem itself. They suggest that some "problems" (how to maintain utopia) should not be solved if the solution requires specific kinds of moral violations.

  Furthermore, the walkers challenge the **stability** condition. Lewis argues conventions are self-policing because deviation is disadvantageous. In Omelas, deviation (freeing the child) is allegedly catastrophic for everyone. But walking away is a deviation that harms only the walker (they lose Omelas) and leaves the convention intact. They are not "defectors" in the sense of free-riders who want the benefit without the cost; they are exiles who refuse the benefit because of the cost. Their existence proves that the "common knowledge" includes the knowledge of an exit option. If the exit option is known, the convention is not as stable as it appears; it relies on the majority choosing to suppress their moral revulsion. The walkers make visible the repression required to maintain the Lewisian equilibrium.

  In conclusion, "The Ones Who Walk Away from Omelas" adds a crucial normative dimension to the philosophical understanding of convention that Lewis's argument alone does not provide. Lewis successfully explains *how* conventions persist through mutual expectation and conditional preference, but his formalism is silent on *whether* they should. Le Guin's story demonstrates that a practice can satisfy all of Lewis's criteria—regularity, common knowledge, conditional preference, and even a form of arbitrariness (if viewed as social choice)—and yet be morally intolerable. The story forces the philosopher to acknowledge that stability and coordination are not intrinsic goods. It suggests that a complete theory of social practices cannot rely solely on game-theoretic stability; it must account for the moral thresholds at which rational agents will abandon a successful equilibrium. The walkers show us that the ultimate limit of convention is not the failure of coordination, but the refusal of conscience. Lewis gives us the mechanics of the cage; Le Guin gives us the key, and shows us that using it requires leaving the game entirely.
