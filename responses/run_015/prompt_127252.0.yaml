  Here is the breakdown of which rule governs her judgments, how they apply to "Thermal Cognition," her likely verdict, and a hypothetical case to split the rules.

  ### 1. Which Rule Fits Her Past Calls Best?

  **Rule B is the dominant heuristic.**
  *(Rule B: Protective belt modifications have to be independently motivated rather than purely defensive.)*

  Here is why Rule B fits her track record better than Rule A (*Risky predictive success is sufficient*):

