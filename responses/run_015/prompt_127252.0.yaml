  *   **Evolutionary Theory (1930s):** This was called **progressive** because the Modern Synthesis didn't just patch holes; it integrated Mendelian genetics (an independent field) to predict mechanisms *before* observation. This satisfies Rule B (independently motivated belt) and Rule A (prediction).

  **Conclusion:** Rule A is necessary but not sufficient for her. Rule B is the *deciding factor*. She penalizes "defensive" belt adjustments even if there is some predictive success (Newton), and she rewards "generative" belt adjustments even before full empirical mapping (Evolution).

  ### 2. Application to "Thermal Cognition"

