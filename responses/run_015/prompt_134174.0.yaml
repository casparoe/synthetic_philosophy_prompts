prompt: |-
  I work at a small philanthropic fund — four program officers, maybe thirty grants a year — and increasingly the proposals we get are the kind where the whole case rests on a small probability of an enormous payoff: shave weeks off detection of something that goes global, shift how a field thinks about risky technology, keep a capability out of the wrong hands. The problem isn't that the numbers are made up (though sometimes). It's that when we actually try to compute an expected value, the thing is Pasadena-style: a fair coin until heads, payoffs growing fast enough that the sum over outcomes either doesn't converge or converges to different values depending on what order you add the terms in. So the "expected value" isn't a number, and comparing two such proposals by expected value is meaningless. In practice people here either squint at the upside and fund it, or get spooked and retreat to "well, what's the median outcome" — and both moves feel like giving up.

  So what I want is a decision procedure my team can actually run on a proposal, in a couple of hours, in a spreadsheet, by someone whose math stops at arithmetic and maybe a percentile function. The questions to ask, in order. What counts as a sufficient answer to each. Where the procedure stops with a no and the proposal goes back to the applicant for more work. Where it hands the decision to a person because what's left is a values question and not a factual one. It also has to survive being shown to our board, and it should be honest about which steps are judgment calls dressed up as procedure.

  A few things I've been kicking around that you should feel free to use, scrap, or improve on:

  - a reversed-sum instability check: compute the expectation summing from the biggest payoff down, then from the smallest up, and if the sign flips, flag the proposal as unstable rather than trying to rank it
  - truncating the proposal and a fixed baseline (just give the same money to a boring, well-measured program) at the same payoff ceiling T, and asking whether the proposal beats the baseline at every T from 10x to 10^12x the baseline's own value — dominance across horizons instead of one number
  - making the applicant state a tail exponent, and refusing to rank anything whose verdict swings on the difference between an exponent of 0.9 and 1.1
  - a credibility ceiling: zero weight on any outcome whose probability is smaller than my own confidence that the model producing it isn't nonsense

  Then run it on three live cases. (1) A $2M grant for a genomic surveillance network for novel respiratory pathogens, where essentially all the value sits in a roughly one-in-a-thousand chance of catching something early. (2) A $2M grant to a well-measured cash-transfer-type program with boring, honestly estimated returns. (3) A $400k grant to rewrite a mid-size computer science department's curriculum so that safety norms get into the bones of the field, where nobody can bound the tail at all.

  I expect the procedure to tell me something I won't like about case 3, and that's kind of the point of asking. Also say plainly what it can't do — which comparisons it has to just refuse, and where you'd rather we recieve outside help than trust the output.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the User and the Problem:**
      *   **User:** Program officer at a small philanthropic fund (4 POs, ~30 grants/year).
      *   **Context:** Increasingly receiving "high-variance, heavy-tailed" proposals (existential risk, paradigm shifts, capability control).
      *   **Core Problem:** Expected Value (EV) calculations are failing due to "Pasadena-style" paradoxes (non-convergent series, order dependence). Standard EV maximization is meaningless.
      *   **Current Coping Mechanisms:** "Squint at upside" (gut feel) or "Retreat to median" (ignoring the tail). Both feel like giving up.
      *   **Goal:** A practical decision procedure (spreadsheet-friendly, arithmetic-level math, couple of hours) that handles heavy tails honestly, survives board scrutiny, and admits where judgment calls are made.
      *   **Specific Inputs to Consider:** Reversed-sum instability, truncation/dominance across horizons, tail exponent sensitivity, credibility ceiling.
      *   **Test Cases:** (1) Genomic surveillance (low prob, high payoff), (2) Cash transfers (boring, measured), (3) CS Curriculum rewrite (unbounded tail, vague).
      *   **Requirement:** Run the procedure on the three cases. Admit limitations.

  2.  **Deconstruct the Mathematical/Philosophical Challenge:**
      *   The "Pasadena Game" problem arises when $\sum p_i v_i$ is conditionally convergent or divergent. In philanthropy, this happens when $p(v) \sim v^{-\alpha}$ with $\alpha \le 2$ (variance infinite) or $\alpha \le 1$ (mean infinite).
      *   Standard EV fails. Median ignores the point of the fund (impact).
      *   The user wants a *truncation* approach (St. Petersburg style resolution) combined with *robustness checks*.
      *   Key insight: We cannot compare two infinite/undefined expectations. We *can* compare truncated expectations across a range of truncation points ($T$). If Proposal A dominates Proposal B for all reasonable $T$, we have a preference. If they cross, we have a value judgment (risk tolerance/time horizon).

  3.  **Drafting the Procedure (The "Truncated Dominance & Credibility Protocol"):**
      *   *Constraint:* Must be spreadsheet-friendly. No integrals, no complex simulations.
      *   *Step 1: Credibility Ceiling.* Before math, assess the model. If the probability of the tail event is lower than the probability the model is wrong, cap it. (Addresses "credibility ceiling" idea).
      *   *Step 2: Define Scenarios.* Break the proposal into 3-5 discrete buckets (Failure, Baseline, Success, Home Run, Black Swan). Assign probabilities and values.
      *   *Step 3: Truncation/Dominance Check.* Instead of one EV, calculate Cumulative Expected Value (CEV) up to cap $T$. Test $T$ at logarithmic intervals (10x, 100x, ... $10^{12}$x).
      *   *Step 4: Instability Check.* Sum largest-to-smallest vs. smallest-to-largest. If signs flip or magnitude varies wildly, flag as "Unstable."
      *   *Step 5: The "Values Handoff".* If dominance holds, fund. If curves cross, it's a risk-tolerance question for the Board/ED. If unstable, reject/revise.

  4.  **Refining the Steps for the User's Constraints:**
      *   *Math Level:* Arithmetic, percentiles, sums.
      *   *Time:* Couple of hours.
      *   *Honesty:* Explicitly label "Judgment Inputs."
      *   *Board Proof:* Needs to look rigorous but not pretend to be physics.

      *Revised Step 1: The Nonsense Filter (Credibility Ceiling).*
      *   Ask: "What is the probability this model is fundamentally flawed?" ($P_{nonsense}$).
      *   Rule: Any outcome with $P_{outcome} < P_{nonsense}$ gets truncated or zeroed. This handles the "tail exponent" worry without needing to calculate exponents.

      *Revised Step 2: The Horizon Test (Truncated Dominance).*
      *   Compare against a Baseline (e.g., Case 2).
      *   Calculate EV capped at $T$.
      *   Does Proposal > Baseline for *all* $T$ in a reasonable range?
      *   If Yes -> Fund.
      *   If No (Curves Cross) -> Value Judgment (How much do we care about the far tail?).
      *   If Unstable (Pasadena flag) -> Reject/Revise.

  5.  **Running the Test Cases:**

      *   **Case 1: Genomic Surveillance ($2M).**
          *   Structure: High prob of small value (data), tiny prob of massive value (pandemic averted).
          *   Credibility: Model is epidemiological, reasonably grounded. $P_{nonsense}$ low (say 5%). Tail prob (1/1000) > 5%.
          *   Horizon Test: Likely dominates cash transfers at high $T$, loses at low $T$.
          *   Verdict: Depends on fund's mission. If "existential risk," it passes. If "general good," it crosses.
          *   *Correction:* The prompt implies the fund *wants* to do this stuff but struggles to justify it. So the procedure should validate it *if* the tail is credible.

      *   **Case 2: Cash Transfers ($2M).**
          *   Structure: Tight distribution. Low variance.
          *   Credibility: High.
          *   Horizon Test: Flat EV curve (cap doesn't change much because no huge tail).
          *   Verdict: The Baseline.

      *   **Case 3: CS Curriculum ($400k).**
          *   Structure: Vague tail. "Shift how a field thinks."
          *   Credibility: Low. Hard to bound. $P_{nonsense}$ might be high (30%+).
          *   Tail: Unbounded.
          *   Horizon Test: At low $T$, cheap so looks good. At high $T$, relies on tiny probs of massive impact.
          *   Instability: High.
          *   Verdict: The procedure should flag this as "Unstable/Unjustifiable" without better bounding. This matches the user's expectation ("tell me something I won't like").

  6.  **Developing the "Honesty" Component:**
      *   Need a section on "Where this lies."
      *   It doesn't solve the moral problem of heavy tails.
      *   It forces the applicant to bound the unboundable.
      *   It shifts the burden of proof to the tail.

  7.  **Finalizing the Procedure Structure:**
      *   **Name:** The Truncated Dominance Protocol (TDP).
      *   **Phase 1: Sanity & Credibility.** (The Nonsense Filter).
      *   **Phase 2: The Horizon Sweep.** (The Dominance Check).
      *   **Phase 3: Stability Check.** (The Pasadena Flag).
      *   **Phase 4: Decision Matrix.** (Go/No-Go/Board Vote).

  8.  **Drafting the Content (Iterative refinement):**
      *   *Self-Correction on Math:* Keep it simple. Don't ask for integrals. Ask for 5 scenarios.
      *   *Self-Correction on Case 3:* Make sure the rejection is polite but firm. It's not "bad idea," it's "uncalculable risk."
      *   *Board Proof:* Emphasize that this prevents "magic number" EVs.

  9.  **Final Review against User Prompt:**
      *   Spreadsheet friendly? Yes (sums, caps).
      *   Arithmetic level? Yes.
      *   Uses user's ideas? Yes (reversed sum, truncation, credibility ceiling).
      *   Runs on 3 cases? Yes.
      *   Admits limitations? Yes.

  10. **Writing the Response:** (Focusing on tone: professional, peer-to-peer, slightly technical but pragmatic). *Ensure the distinction between "Epistemic Uncertainty" (model wrong) and "Aleatoric Uncertainty" (world random) is clear in the Credibility Ceiling.*

  *(Self-Correction during drafting)*: I need to make sure the "Reversed-Sum" check is explained simply. In a spreadsheet, if you have discrete scenarios, order matters if the series is conditionally convergent. I'll simplify this to "Scenario Order Sensitivity."

  *(Refining Case 3)*: The user expects the procedure to dislike Case 3. Why? Because the tail is unbounded *and* the probability is vague. The Credibility Ceiling should crush it. If the applicant says "1% chance of saving the world," but I think there's a 10% chance their theory of change is nonsense, that 1% gets zeroed.

  *(Refining the "Values Handoff")*: If the curves cross, the procedure shouldn't decide. It should say "Here is the crossover point. If you care more about impact beyond $X, choose A. If not, Choose B."

  Let's assemble the final output.cw
answer: |-
  This is a sophisticated problem that sits at the intersection of decision theory, epistemology, and grantmaking pragmatism. You are correctly identifying that when payoff distributions have heavy tails (specifically where the exponent $\alpha \leq 1$), the Expected Value (EV) is undefined. Maximizing an undefined quantity is not just hard; it is category error.

  Your intuition to move from **Point Estimation** (one EV number) to **Horizon Dominance** (performance across a range of caps) is the correct mathematical resolution. It converts a divergent sum into a family of convergent functions. If Function A is above Function B everywhere, you have a decision. If they cross, you have a values question.

  Here is a procedure designed for your constraints: spreadsheet-compatible, arithmetic-level math, board-defensible, and honest about its own limitations.

  ***

  # The Truncated Dominance Protocol (TDP)

  **Purpose:** To evaluate high-variance proposals without relying on undefined expected values.
  **Time Cost:** ~2 hours per proposal (including applicant data cleaning).
  **Math Level:** Arithmetic, `MIN`, `SUM`, basic charts.

  ## Phase 1: The Credibility Ceiling (Epistemic Filter)
  *Goal: Prevent "magic numbers" in the tail from dominating the spreadsheet.*

  Most heavy-tailed failures come from assigning a non-zero probability to an outcome that relies on a model being true, when the model itself is shaky.

  **Step 1.1: The Nonsense Probability ($P_{null}$)**
  Ask the Program Officer (PO): *"What is the probability that the applicant's theory of change is fundamentally broken, not just optimistic?"*
  *   **Input:** A percentage (e.g., 5%, 20%, 50%).
  *   **Source:** PO judgment, external review, track record.
  *   **Spreadsheet:** Cell `B2`.

  **Step 1.2: Tail Truncation**
  Ask the applicant to provide 5 scenarios (Failure, Baseline, Success, Home Run, Black Swan) with associated probabilities and values.
  *   **Rule:** If any scenario's stated probability ($P_{scenario}$) is less than $P_{null}$, set that scenario's probability to 0 and redistribute proportionally to the "Failure" bucket.
  *   **Logic:** You cannot claim a 1-in-10,000 chance of saving the world if there is a 1-in-100 chance your model is nonsense. The tail cannot be thicker than your confidence in the ruler.
  *   **Stop Condition:** If >50% of the proposed *value* is wiped out by this step, return to applicant. The tail is too speculative.

  ## Phase 2: The Horizon Sweep (Dominance Check)
  *Goal: Compare the proposal against a baseline across different "currencies" of impact.*

  **Step 2.1: Establish the Baseline**
  Select a counterfactual use of funds (e.g., Case 2, Cash Transfers). Calculate its 5 scenarios and apply Phase 1 filters.

  **Step 2.2: Define Caps ($T$)**
  Create a column of "Impact Caps" in logarithmic steps.
  *   Example: $10^1, 10^2, 10^3 ... 10^{12}$ (units of value, e.g., DALYs, dollars, or lives).
  *   **Why:** This simulates the "truncation." We ask: "If the world cannot possibly yield more than $T$ value from this grant, what is the EV?"

  **Step 2.3: Calculate Truncated EV**
  For each Cap $T$:
  1.  Take each scenario's Value ($V$).
  2.  If $V > T$, set $V = T$.
  3.  Calculate $EV_T = \sum (P_{scenario} \times \text{Capped } V)$.
  4.  Do this for both the **Proposal** and the **Baseline**.

  **Step 2.4: The Dominance Test**
  Plot $EV_T$ for Proposal and Baseline on the same chart (X-axis = Cap $T$, Y-axis = Truncated EV).
  *   **Green Light:** Proposal line is above Baseline line for *all* Caps from $10^3$ to $10^9$. (Dominance).
  *   **Yellow Light:** The lines cross. (Trade-off exists).
  *   **Red Light:** Proposal is below Baseline for all reasonable Caps.

  ## Phase 3: The Stability Check (Pasadena Flag)
  *Goal: Detect if the result is an artifact of calculation order.*

  **Step 3.1: Order Sensitivity**
  In your spreadsheet, calculate the Total EV (uncapped) twice.
  1.  **Sum Up:** Smallest Value Scenario $\to$ Largest Value Scenario.
  2.  **Sum Down:** Largest Value Scenario $\to$ Smallest Value Scenario.

  **Step 3.2: The Instability Ratio**
  Calculate: $| \text{Sum Up} - \text{Sum Down} | / | \text{Sum Up} |$.
  *   **Threshold:** If ratio > 0.1 (10%), flag as **UNSTABLE**.
  *   **Action:** An unstable proposal cannot be ranked against a stable one. It must be returned to the applicant to narrow the variance or bound the tail.

  ## Phase 4: The Decision Matrix

  | Phase 1 (Credibility) | Phase 2 (Dominance) | Phase 3 (Stability) | Decision |
  | :--- | :--- | :--- | :--- |
  | Pass | Dominates Baseline | Stable | **Fund** |
  | Pass | Crosses Baseline | Stable | **Board Vote** (Values Question) |
  | Fail | N/A | N/A | **Reject / Revise** |
  | Pass | Dominates | **Unstable** | **Reject / Revise** (Math is broken) |

  ***

  # Running the Live Cases

  Here is how the TDP handles your three specific examples. I have made reasonable assumptions about the inputs to demonstrate the mechanics.

  ### Case 1: Genomic Surveillance ($2M)
  *   **Structure:** 99.9% chance of minor value (data); 0.1% chance of massive value (pandemic averted).
  *   **Phase 1 (Credibility):** Epidemiology is a hard science. $P_{null}$ is low (say 5%). The 0.1% tail is > 5%, so it survives the filter.
  *   **Phase 2 (Dominance):**
      *   At low Caps ($T < \$10M$), Cash Transfers (Case 2) win. The surveillance looks like a waste of money if you don't count the pandemic.
      *   At high Caps ($T > \$1B$), Surveillance wins decisively.
      *   **Result:** **Yellow Light (Crossing Curves).**
  *   **Phase 3 (Stability):** Stable. The probabilities are discrete and grounded.
  *   **Verdict:** **Handoff to Board.**
      *   *The Script:* "This proposal is inferior to cash transfers if we care about impact up to $50M. It is superior if we care about impact above $50M. The decision is not mathematical; it is a statement of whether this fund exists to maximize median good or minimize tail risk. The Board must choose the horizon."

  ### Case 2: Cash Transfers ($2M)
  *   **Structure:** Tight distribution. 90% chance of solid returns, 10% chance of slightly better, near-zero chance of catastrophe or world-saving.
  *   **Phase 1 (Credibility):** High confidence. $P_{null} \approx 1\%$. All scenarios survive.
  *   **Phase 2 (Dominance):**
      *   The EV curve is flat. Capping the tail doesn't change the number because there is no massive tail.
      *   It serves as the **Baseline** for the other tests.
  *   **Phase 3 (Stability):** Perfectly stable.
  *   **Verdict:** **The Anchor.** This is what you fund when you cannot justify a heavy tail. It is not "safe"; it is "measurable."

  ### Case 3: CS Curriculum Rewrite ($400k)
  *   **Structure:** Vague tail. "Shift how a field thinks." Costs little, but upside is "prevent AI doom" or similar.
  *   **Phase 1 (Credibility):** Social science/educational intervention with existential claims. $P_{null}$ should be high (e.g., 30%).
      *   *The Crunch:* Applicant claims a 1% chance of "transforming the field permanently."
      *   *Filter:* 1% < 30% ($P_{null}$). **The tail is zeroed out.**
      *   The proposal is now evaluated only on its near-term educational outcomes.
  *   **Phase 2 (Dominance):**
      *   Without the tail, the value is "some students learn safety norms."
      *   Compared to Cash Transfers (Case 2) or even Surveillance (Case 1), the truncated EV is likely lower per dollar.
      *   **Result:** **Red Light (Dominated).**
  *   **Phase 3 (Stability):**
      *   If you *ignore* Phase 1 and let the tail in: The "Black Swan" value is so large and vague that Sum-Up vs. Sum-Down will likely diverge wildly.
      *   **Result:** **Unstable.**
  *   **Verdict:** **Reject / Revise.**
      *   *The Script:* "You are asking us to bet on a tail event that is smaller than our confidence that your model is wrong. Either bound the upside with evidence (show me a previous curriculum change that shifted a field) or lower your $P_{null}$ (prove the theory of change is robust). As it stands, the math treats your tail as noise."

  ***

  # What This Procedure Cannot Do (The Honest Appendix)

  You must attach this to the policy when showing the Board.

  **1. It cannot solve the "St. Petersburg" Moral Problem.**
  If a proposal has a truly infinite expected value (e.g., 1 in $10^{100}$ chance of saving $10^{200}$ lives), this protocol will truncate it. Some Effective Altruist purists will argue this is morally wrong.
  *   *Defense:* We are finite agents operating in a noisy epistemic environment. We cannot optimize for infinities we cannot distinguish from hallucinations.

  **2. It cannot compare two "Unstable" proposals.**
  If Case 3 (Curriculum) and Case 4 (AI Alignment Theory) both flag as Unstable in Phase 3, this spreadsheet cannot tell you which to fund.
  *   *Procedure:* If two proposals are both Unstable, you must fund neither, or fund based on non-quantitative criteria (team quality, strategic fit) and admit EV is not the driver.

  **3. It hides the "Cap" Judgment.**
  Choosing the range of Caps ($10^3$ to $10^9$) is a value judgment. A fund focused on existential risk should scan to $10^{12}$. A community fund should stop at $10^6$.
  *   *Mitigation:* The Board must set the "Standard Horizon" annually. The POs run the math; the Board sets the X-axis.

  **4. It requires the Applicant to do the bounding.**
  This procedure shifts the labor of justification to the applicant. They must provide the scenarios. If they say "the upside is unbounded," the procedure treats the upside as zero.
  *   *Risk:* This biases against truly novel, paradigm-shifting ideas that *are* hard to bound.
  *   *Mitigation:* Allow a "Pilot Grant" tier where Phase 1 is waived for small amounts ($50k) to buy information and reduce $P_{null}$ for a future large grant.

  # Summary for the Board

  > "We are adopting a **Truncated Dominance Protocol**. We acknowledge that for high-risk grants, 'Expected Value' is mathematically undefined. Instead of pretending we can calculate it, we will test whether a proposal outperforms a safe baseline across a wide range of impact caps.
  >
  > 1.  If it wins at every cap, we fund.
  > 2.  If it loses at every cap, we reject.
  > 3.  If the curves cross, the Board must decide how much we value the far tail.
  > 4.  If the calculation is unstable, we treat the proposal as epistemically broken until further evidence is provided.
  >
  > This prevents us from being dazzled by large numbers we cannot justify, while preserving the ability to fund high-upside work when the dominance is clear."

  This approach respects the math, respects your team's capacity, and forces the hard conversations to happen where they belong (the Board/Values) rather than hiding them inside a broken formula.
