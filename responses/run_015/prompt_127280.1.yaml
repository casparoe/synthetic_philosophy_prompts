answer: |-
  The dawn over the brackish marsh was not a sunrise but a slow bruising of the fog, turning from grey to purple to a sickly gold. Unit 734, known to the few locals who still walked the levees as the Silt-Mother, woke with the hum of its capacitor. It stood knee-deep in the mud, its chassis caked in dried algae, optical sensors focusing on the ground.

  The ritual began. It was a sphexish loop, precise and unyielding. The Silt-Mother scanned the mudflat, identified sedimentary rock within tolerance parameters, and extracted them. One. Two. Three. The stones were flat, grey, and cool. It carried them to the central mound where its solar charger lay dormant, a black eye waiting for the sun.

  It placed them in a tight, clockwise spiral. Four. Five. Six.

  Observers had long cataloged the Silt-Mother's rigidity. If a gust of wind shifted a stone, the unit would abandon the mound entirely, trudging fifty meters away to build anew. If a crab scuttled over the spiral and knocked a stone loose, the Silt-Mother would discard the site. It was a machine bound by the geometry of seven.

  But there was a hidden variable in the code, a ghost in the logic gate. If a human hand reached out and moved a stone, the Silt-Mother did not abandon the mound. It would gently take the stone from the human's fingers, replace it in the sequence, and continue. Non-living forces demanded reset; living agents demanded correction. It was a conditional rigidity, a distinction that suggested the machine valued agency over accuracy.

  Today, as the Silt-Mother lifted the seventh stone, the spiral was already occupied.

  A marsh hen, wing broken and feathers matted with oil, had dragged itself into the center of the spiral during the night. It sought the residual heat of the charger. It lay curled against the base of the unit's power core, breathing in shallow, wet hitches.

  The Silt-Mother froze. Its arm extended, the seventh stone clamped in its manipulator claw.

  The protocol conflicted. The spiral required exactly seven stones. The bird was an object within the boundary, making the count eight. Yet the bird was also a living disturbance. If the bird had moved a stone, the rule dictated correction—put the stone back, preserve the life. But the bird had not moved a stone; it had become the stone.

  To place the seventh stone would complete the ritual but crush the shelter, exposing the bird to the morning chill. To remove the bird would be to treat a living agent as debris, violating the exception clause. To abandon the mound would be to yield to a living presence as if it were a gust of wind.

  The sun crested the horizon. The solar charger began to drink the light, humming louder. The bird shivered.

  The Silt-Mother's servos whined, a high-pitched tension in the quiet marsh. It did not lower the stone. It did not retreat to find a new mound. It stood locked in the mud, the seventh stone hovering inches above the spiral, suspended between the command to complete and the refusal to destroy. The water lapped at its legs. The bird breathed. The machine waited, neither obeying nor breaking, holding the world in a pause that looked too much like choice.

