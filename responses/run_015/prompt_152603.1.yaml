answer: |-
  ### 1. The Explanatory Dependency Arc
  Before you can discuss the *politics* of naming, the group must accept that legal categories are **operative, not descriptive**. If they believe legal terms simply describe what happened (like a weather report), the politics of naming will seem irrelevant. You must establish first that legal labels function as **switches**: flipping the "genocide" switch turns on specific legal machinery (prevention duties, universal jurisdiction, intervention thresholds) that remains off if the switch is labeled "war crimes" or "crimes against humanity." The politics only matter because the consequences differ.

  ### 2. The Carrying Case
  **The Canadian Indian Residential School System.**
  This case holds both physical destruction and cultural erasure in tension.
  *   **Physical:** Thousands of children died due to neglect, disease, and abuse within the system.
  *   **Cultural:** The explicit stated goal was assimilation—"to kill the Indian in the child"—by severing language, family ties, and cultural transmission.
  *   **The Gap:** The Truth and Reconciliation Commission labeled this "cultural genocide." Under **Lemkin's original concept** (which included destroying a group's cultural patterns and economic existence), this fits cleanly. Under the **1948 Convention** (which removed cultural genocide during drafting to protect state sovereignty over minority groups), it falls into a gray zone because the primary intent was assimilation, not necessarily physical extermination "in whole or in part." This case forces them to see where the legal net catches less than the moral reality.

  ### 3. Sequence and Misconception Absorption
  Walk the session through these three stages, absorbing their objections exactly where noted:

  *   **Stage 1: Lemkin vs. The Convention (The Definition Gap)**
      *   *Content:* Contrast Lemkin's *Axis Rule in Europe* (group existence = culture + economy + body) with the 1948 UN Compromise (group existence = physical/biological only).
      *   *Misconception to Absorb:* **"It's just semantics."**
      *   *Absorption Point:* When they argue the difference is just wording, show them the deleted Article III on cultural genocide from the draft convention. Explain that states didn't remove it because of synonyms; they removed it to avoid being legally obligated to protect minority cultures within their borders. Semantics here is code for sovereignty.

  *   **Stage 2: Analyzing the Carrying Case (The Intent Problem)**
      *   *Content:* Apply the definitions to the Residential Schools. There are bodies, so why isn't it automatically genocide under the Convention?
      *   *Misconception to Absorb:* **"Intent is obvious if bodies pile up."**
      *   *Absorption Point:* When they argue death proves genocidal intent, distinguish between *dolus generalis* (intent to kill) and *dolus specialis* (intent to destroy the group *as such*). Explain that mass murder becomes genocide only when the killing is the *means* to erase the group's existence, not just the result of brutality. In the carrying case, the deaths were often byproducts of the cultural mission, complicating the legal "specific intent" required by the Convention.

  *   **Stage 3: The Consequences of Naming (The Obligation Gap)**
      *   *Content:* Discuss what happens after the label is applied. The Genocide Convention imposes a duty to *prevent*, not just punish.
      *   *Misconception to Absorb:* **"Without the genocide label there's no serious duty."**
      *   *Absorption Point:* When they claim non-genocide labels are toothless, clarify that Crimes Against Humanity carry heavy punitive duties, but Genocide carries a unique *preventative* duty that triggers earlier intervention. The fight over the label is a fight over *when* the international community must intervene, not just whether they care.

  ### 4. The Check for Understanding
  Do not ask them to define genocide. Instead, present a hypothetical scenario: A state systematically destroys all libraries, bans a language, and seizes economic assets of a minority group, resulting in zero direct killings but total cultural dissolution.
  *   **Ask:** "If you label this genocide, what specific action does the UN gain that it wouldn't have if you labeled it 'apartheid'? Conversely, why might the affected group demand the label even if no one was killed?"
  *   **Success Criteria:** They understand the label is being fought over because of the *obligations it triggers* (prevention/intervention) and the *history it validates* (Lemkin's broad view), not because they are trying to maximize the body count.

  ### 5. Deliberate Omissions
  *   **ICJ Jurisprudence:** Do not dive into *Bosnia v. Serbia* or the specific burden of proof standards used in The Hague; it distracts from the conceptual gap with technical procedure.
  *   **Draft Convention Article Numbers:** Do not make them memorize which article was deleted; just convey the fact that cultural protection was explicitly removed during negotiations.
  *   **Responsibility to Protect (R2P) Mechanics:** Keep the focus on the Genocide Convention's specific duties rather than the broader R2P framework, which muddies the specific legal lineage of genocide.

  Verdict: Genocide is not a descriptor of horror, but a switch that activates specific obligations, which is precisely why states fight over the label.
