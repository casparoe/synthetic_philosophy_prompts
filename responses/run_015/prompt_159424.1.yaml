answer: |-
  ### Evaluation of Claims

  Here is the assessment of the eight claims based on your scaffolding. The score represents how much inferential distance the 0.7 estimate covers toward the claim (0 = does no work/opposes it; 100 = proves it).

  | Claim | Score | Tier | Diagnostic Sentence |
  | :--- | :--- | :--- | :--- |
  | **1.** For any given child, 70% of score is genes, 30% environment. | **0** | Actively Blocked | This claim needs an **Individual Decomposition** parameter which does not exist; the 0.7 speaks only to the **Ratio Parameter** of population variance. |
  | **2.** Most of the difference between this country and a poorer country is genetic. | **0** | Actively Blocked | This claim needs **Mean-Shift Headroom** across populations and high **Transport Weight**; the 0.7 speaks only to within-population variance ratios. |
  | **3.** Further equalizing school quality would not accomplish much. | **20** | Underdetermined | This claim needs **Mean-Shift Headroom** (for performance) and **Ratio Parameter** (for variance); the 0.7 implies low current $V_E$ but says nothing about the elasticity of the mean. |
  | **4.** The 0.3 and 0.7 estimate the same quantity; gap is noise/rare variants. | **15** | Underdetermined | This claim needs a refined **Ratio Parameter** that isolates additive genetics from shared environment; the 0.7 likely includes confounds the 0.3 excludes. |
  | **5.** Assortative mating biases the 0.7 away from a random-mating baseline. | **85** | Licensed | This claim needs a population-structured **Ratio Parameter**; the 0.7 is specific to the current mating structure and does not generalize to the hypothetical. |
  | **6.** Some "genetic" variance is actually evocative environmental treatment. | **75** | Licensed | This claim needs **Causal Granularity** within the **Ratio Parameter**; the 0.7 counts rGE as genetic variance regardless of the environmental mechanism. |
  | **7.** No tension between h²=0.7 and substantial cohort mean shifts. | **100** | Licensed | This claim needs **Mean-Shift Headroom**; the 0.7 is mathematically orthogonal to changes in the population mean. |
  | **8.** Heritability is a property of the trait, fixed across cohorts/countries. | **0** | Actively Blocked | This claim needs high **Transport Weight**; the 0.7 is a property of the population-environment interaction, not the trait in isolation. |

  ***

  ### Steelman of the Lowest-Rated Claim (Claim 2)

  Claim 2 is the classic Lewontin fallacy, but its strongest defense rests on the *necessary condition* argument rather than a sufficient one. If heritability within both populations were zero, genetic differences could not explain between-group mean differences (assuming the same trait architecture). Therefore, a high within-group $h^2$ is a prerequisite for a genetic explanation of between-group gaps. The steelman argues that in a world where environmental variance is known to be minimized within groups (as per your prompt's "identical schools, no deprivation"), the remaining variance is overwhelmingly genetic. If we further assume that the "poorer country" differs primarily in allele frequencies due to drift or selection, and that the reaction norms for the relevant alleles are parallel (high **Transport Weight**), then the most parsimonious explanation for a persistent mean gap—once obvious environmental deprivation is ruled out—is genetic. The 0.7 does not *prove* this, but it clears the first hurdle: it establishes that the trait is sufficiently sensitive to genetic difference in humans to make the hypothesis viable, whereas an $h^2$ of 0.0 would render it impossible.

  ***

  ### Critique of Scaffolding

  Your three parameters are robust, but I would **add a fourth: Causal Granularity**.

  Your **Ratio Parameter** treats all genetic variance as a single block, but for policy and inference, it matters whether the variance arises from *direct biological effects* (e.g., neural processing speed) or *evocative correlations* (e.g., a genetically impulsive child elicits stricter discipline). Both load on the 0.7, but they respond to different interventions. Direct effects might require medical or cognitive remediation; evocative effects might respond to teacher training or behavioral scaffolding. Without splitting the Ratio Parameter into **Direct Genetic** vs. **Socially Mediated Genetic** variance, you cannot predict whether an environmental intervention will bypass the genetic signal or merely change the channel through which it operates.

  ***

  ### Informativeness for Funding Interventions

  **10**

  **Defense:**
  The decision to fund an intervention aimed at *raising* exam performance is a question about **Mean-Shift Headroom** (plasticity of the average), while $h^2 = 0.7$ is a measure of the **Ratio Parameter** (sources of individual differences). These are orthogonal. A trait can be 100% heritable and still be 100% reversible (e.g., PKU blindness before treatment). The 0.7 tells you that in the *current* environment, children will retain their rank order stubbornly. It does not tell you if the entire rank order can be shifted upward, nor does it tell you if the floor can be raised. It is informative only for a specific subclass of intervention: those aimed at *closing the gap* between high and low performers within the current system. For the general goal of raising performance, the number is nearly noise, because it describes the resistance of variance to change, not the resistance of the mean to change.
