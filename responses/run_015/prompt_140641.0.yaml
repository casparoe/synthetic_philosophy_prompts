prompt: |-
  ok so I need to stop reading the Harsanyi aggregation literature at random and get a spec first. Here's the use case: I'm on a small team putting together a decision-support tool for a regional public-investment body — the kind of thing that has to rank flood defences vs vaccination campaigns vs subsidised housing, where the benefits are spread over a couple of million people and most of the action is in the uncertainty (flood probabilities, take-up rates, long-run effects nobody can measure well). Whatever rule for combining individual utilities into a social ranking we put in the code has to be defensible to people who will never read a paper.

  What I want from you is the desiderata, not a restatement of the theorem: what a rule for turning many individuals' cardinal utility functions — and maybe their beliefs — into one social ranking has to get right, the case or consideration behind each requirement, and your view on which are non-negotiable and which are just what one camp happens to like. Please don't just hand back the axioms of the aggregation theorem dressed up as a list.

  Things I already think are on the list, with the cases behind them — add your own, and tell me if any of mine are junk or duplicates:

  - Splitting invariance. Divide a state of the world into two states with identical utility consequences and probabilites summing to the original, and the social ranking shouldn't move. Is that a real requirement or just expected-utility independence smuggled in as a fairness constraint? It looks like it kills any rule that cares about who ends up badly off once the uncertainty resolves, which is most of what practitioners say they want.
  - No double counting. Real preferences have moral and other-regarding bits in them: everyone prefers the flood defence go to the poorer valley because they think that's fairer. Add those up and the fairness concern seems to get counted once per person, while a concern nobody else shares gets counted once. What should a rule do with preferences that are already partly social — launder them somehow, or take them as given?
  - Invariance to rescaling versus sensitivity to interpersonal comparisons. Each person's utility is only fixed up to positive affine transformation, so anything that turns on an arbitrary normalisation is out. But full invariance looks like it makes real comparability impossible and lands you near dictatorship or near social indifference. Which way does this cut, and is demanding a common unit of well-being a genuine requirement or a prejudice of the welfarist camp?
  - Disagreement about probabilities. Our experts and our citizens don't share a credence over flood risk. Whose probabilities does the rule use, or does it manage not to take a stand? Ive seen claims that respecting everyone's ex ante preferences here forces something pretty unwelcome — say what that is and whether it's avoidable or just a cost to be paid.
  - Graceful degradation on non-ideal inputs. What we actually get is not vNM-rational: people violate independence in Allais-ish ways, some are intransitive, future people and corporate actors don't have a well-defined utility function at all. A rule that only runs on clean inputs is useless to me, so I'd put robustness to messy and partial input on the list — unless you think that's asking for something no rule could deliver, in which case say so and tell me what the honest fallback is.
  - Variable population and near-duplicates. People barely affected by the decision, or two people with identical prospects and identical utility functions: does the rule average or total, and what does it say about adding lives that are barely worth living? How much weight does this requirement carry compared to the others, given the decisions we're actually making?
  - Stability over time. The body decides every year, and sometimes re-decides. If it aggregates and then updates versus updates and then aggregates, do we get reversed rankings or something money-pumpable? That's on my list only if it genuinely bites.
  - Estimability. Can it be run on quantities a public body could actually estimate in a few months, or does it need full interpersonal comparisons nobody can measure? I count implementability as a real desideratum — tell me if that's cheating, i.e. if it's a constraint on us rather than a requirement on the theory.

  Two more things, and they're the parts I most want. First: flag any pair of requirements that can't be jointly satisfied, and if the whole list turns out to be unsatisfiable as a package, tell me which requirement you'd drop first and what dropping it costs — that's a result, not a failure. Second: which single requirement does the most work in knocking out candidate rules? A short scorecard at the end for the main contenders (weighted or average utilitarian sums, ex-post prioritarian views, maximin, and the simulate-a-chooser-behind-a-veil-of-ignorance approach) is welcome, but keep it short — the list and the reasoning behind it are the deliverable.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** A practitioner (small team, regional public-investment body) building a decision-support tool. They are technically literate (knows terms like vNM, affine transformation, Allais) but pragmatic (needs defensibility to non-experts, robust to messy data).
      *   **Task:** Define *desiderata* for a social welfare aggregation rule (combining individual utilities/beliefs into a social ranking).
      *   **Constraints:**
          *   Do *not* just restate axioms of Harsanyi/Arrow/etc. dressed up.
          *   Focus on the *case/consideration* behind each requirement.
          *   Distinguish non-negotiables from camp-specific preferences.
          *   Evaluate the user's proposed list (validate, critique, refine).
          *   Identify incompatibilities (impossibility results) and suggest trade-offs.
          *   Identify the "killer" desideratum.
          *   Provide a short scorecard of contenders.
      *   **Tone:** Professional, direct, philosophically rigorous but practically grounded. No fluff.

  2.  **Evaluate the User's Proposed List:**
      *   *Splitting Invariance:* User suspects this kills ex-post equity. *Verdict:* Correct. This is essentially Statewise Dominance + Independence. It forces Ex-Ante Prioritarianism/Utilitarianism and blocks Ex-Post views (like minimizing variance of outcomes). Crucial tension point.
      *   *No Double Counting (Other-regarding preferences):* *Verdict:* Real issue. "Snooping" preferences vs. "External" preferences. Dworkin's distinction. If we count them, a racist's utility loss from integration counts against integration. If we strip them, we violate Paretianism. Needs a "Sovereignty" or "Personal Domain" filter.
      *   *Invariance vs. Comparability:* *Verdict:* This is the measurement problem. Full invariance = Ordinal Non-comparability (Arrow's Impossibility). To get anywhere, you need *some* comparability (Cardinal Unit Comparability or Full Comparability). It's not a prejudice; it's a mathematical necessity for aggregation beyond dictatorship.
      *   *Disagreement about Probabilities:* *Verdict:* The "Pareto for Beliefs" problem. If everyone prefers A to B based on *their own* probabilities, should society? Mongin's theorem says this leads to dictatorship or identical beliefs. Need a "Scientific Consensus" override or a specific aggregation rule for beliefs separate from utilities.
      *   *Graceful Degradation:* *Verdict:* Practical necessity. Theoretical purity is useless if inputs are garbage. Needs "Bounded Rationality Compatibility."
      *   *Variable Population:* *Verdict:* Critical for long-term infrastructure (housing/floods). Total vs. Average utilitarianism. The "Repugnant Conclusion" risk.
      *   *Stability over Time:* *Verdict:* Dynamic Consistency. If the rule changes rankings based on when you update, you open yourself to money pumps or political gaming. Important for institutional credibility.
      *   *Estimability:* *Verdict:* Not cheating. A normative theory that requires impossible data is practically vacuous. "Operationalizability" is a valid meta-desideratum.

  3.  **Develop Additional Desiderata:**
      *   *Pareto (Weak):* If everyone is better off, society is better off. Hard to drop, but conflicts with other-regarding preferences.
      *   *Anonymity:* Identities shouldn't matter, only utility levels. (Non-negotiable for public bodies).
      *   *Continuity:* Small changes in input shouldn't flip rankings wildly. (Stability).
      *   *Transparency/Explainability:* Can you tell a citizen *why* Project A beat Project B? (Crucial for the "defensible to people who will never read a paper" constraint).

  4.  **Identify Incompatibilities (The "Impossibility" Core):**
      *   *Ex-Ante vs. Ex-Post Equity:* You cannot satisfy Statewise Dominance (Splitting Invariance) AND Ex-Post Equity (concern for final distribution). This is the Diamond/Epstein-Zin tension.
      *   *Pareto + Beliefs:* Respecting individual probabilities + Pareto leads to dictatorship (Mongin).
      *   *Comparability + Invariance:* You can't have full affine invariance and meaningful aggregation without a common unit.

  5.  **Select the "Killer" Desideratum:**
      *   It's the *Comparability/Measurement* issue. Without a common unit, you can't sum or prioritize. But establishing that unit is politically toxic.
      *   *Alternative:* The *Ex-Ante vs. Ex-Post* tension is more specific to the user's uncertainty context. Let's highlight that one as the technical "killer" for uncertainty cases.

  6.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the pragmatism. Validate the approach.
      *   *Critique of User's List:* Go through point by point.
          *   Splitting Invariance: Confirm it blocks ex-post equity.
          *   Double Counting: Label it "The External Preferences Problem."
          *   Rescaling: Confirm it's the bottleneck.
          *   Probabilities: Mention Mongin.
          *   Degradation: Call it "Robustness."
          *   Variable Pop: Crucial for housing/infrastructure.
          *   Stability: Dynamic consistency.
          *   Estimability: Validate it.
      *   *Additions:* Anonymity, Pareto (with caveats), Explainability.
      *   *Incompatibilities:* Focus heavily on Ex-Ante vs. Ex-Post (the uncertainty angle) and Pareto vs. Paternalism (the other-regarding angle).
      *   *Recommendation:* What to drop? Drop strict "Splitting Invariance" if equity matters. Drop "Full Respect for Individual Probabilities" if science matters.
      *   *Scorecard:* Utilitarianism, Prioritarianism, MaxMin, Veil of Ignorance.

  7.  **Refining the Tone:**
      *   Avoid academic jargon where possible, or explain it immediately.
      *   Keep it punchy.
      *   Ensure the distinction between "Normative Requirement" and "Practical Constraint" is clear.

  8.  **Self-Correction/Check during drafting:**
      *   *Check:* Did I just restate Harsanyi? *Correction:* Ensure I focus on the *political/practical justification* for the desiderata, not the mathematical proof.
      *   *Check:* Did I answer the "which to drop" question? *Correction:* Be decisive.
      *   *Check:* Is the "Splitting Invariance" explanation clear? *Correction:* Use the "Flood vs. Vaccination" example to illustrate Ex-Ante vs. Ex-Post.

  9.  **Final Polish:** Organize with clear headings. Ensure the "Scorecard" is concise. (Proceed to generate output based on this structure).

  *(Self-Correction on "Splitting Invariance"):* The user asks if it's EU independence smuggled in. Yes, effectively. It implies the social welfare function satisfies the Independence Axiom across states of nature. This precludes caring about the *correlation* of outcomes across individuals (which is what ex-post equity is). I need to make sure this link is explicit.

  *(Self-Correction on "Probabilities"):* The user asks what respecting ex-ante preferences forces. It forces the social planner to adopt a weighted average of individual probabilities *unless* they violate Pareto. But Mongin shows that if you respect Pareto for *all* acts, you end up with a dictator or identical beliefs. The workaround is to separate "taste" from "belief" and use objective probabilities where possible.

  *(Self-Correction on "Comparability"):* The user asks if demanding a common unit is welfarist prejudice. It's not prejudice; it's arithmetic. You can't add meters to seconds. You need a "utility currency." The question is who sets the exchange rate.

  *(Final Plan):* Structure the response into: 1. Critique of User's List. 2. Additional Desiderata. 3. The Incompatibility Matrix (The "Bad News"). 4. The Recommendation (What to drop). 5. The Scorecard.cw
answer: |-
  This is a sharp brief. You are correctly identifying that the mathematical axioms of social choice theory often map poorly onto the political and operational constraints of public investment. Below is the specification you asked for: a breakdown of desiderata based on your list, augmented with necessary additions, followed by the incompatibility analysis and a scorecard.

  ### Part 1: Critique and Refinement of Your List

  Here is the assessment of your proposed requirements. I have flagged which are **Non-Negotiable** (institutional survival), **Contested** (philosophical camps), or **Technical** (mathematical necessities).

  **1. Splitting Invariance (Statewise Dominance)**
  *   **Your suspicion:** Correct. This is effectively the Independence Axiom applied to states of nature.
  *   **The Case:** It ensures that how we describe uncertainty doesn't change the decision. If I describe a flood risk as "10% chance" or "5% chance + 5% chance," the ranking shouldn't flip.
  *   **The Cost:** You identified the killer: **It kills Ex-Post Equity.** If you satisfy this, you cannot care about whether the bad luck is concentrated on one person or spread out. You can only care about *expected* utility.
  *   **Verdict:** **Contested.** If your body cares about "fairness of outcomes" (e.g., not letting one neighborhood drown so others stay dry), you must violate this. If you care only about "fairness of opportunity" (everyone had the same odds), keep it.

  **2. No Double Counting (External Preferences)**
  *   **The Case:** Preferences about other people's lives (paternalistic, moral, or prejudiced) create feedback loops. If 1,000 people dislike a housing project because it helps the poor, counting those utilities vetoes the help.
  *   **Verdict:** **Non-Negotiable.** For a public body, counting "external preferences" (Dworkin's term) is political suicide and logically unstable. You must filter for **Self-Regarding Utilities** only.
  *   **Implementation:** This requires a "laundering" step. You cannot take stated preferences as given; you must model *well-being* directly, ignoring preferences that depend on others' utility levels.

  **3. Invariance to Rescaling vs. Comparability**
  *   **The Case:** You noted the tension. If utility is invariant to *any* affine transformation ($u' = au + b$), you cannot compare the *size* of gains across people. You can't say "Alice gains 10 utils, Bob loses 5" if Alice's "10" is just a scaling artifact.
  *   **Verdict:** **Technical Necessity.** To aggregate, you **must** break full invariance. You need **Cardinal Unit Comparability** (we agree on what a "unit" of well-being is, even if we disagree on zero). Demanding a common unit is not welfarist prejudice; it is arithmetic. You cannot add meters to seconds.
  *   **Requirement:** **Interpersonal Calibration.** The rule must specify how to normalize utilities (e.g., "0 = death, 1 = flourishing").

  **4. Disagreement about Probabilities**
  *   **The Case:** Citizens fear floods differently than hydrologists.
  *   **The Trap:** If you respect everyone's ex-ante preferences (Pareto) *and* their individual probabilities, **Mongin's Theorem** implies you end up with a Dictator or you must assume everyone has identical beliefs.
  *   **Verdict:** **Non-Negotiable Override.** A public body cannot aggregate subjective credences on physical risk. You must use **Objective/Consensus Probabilities** for the aggregation rule, treating individual fears as utility inputs (risk aversion), not probability inputs.

  **5. Graceful Degradation (Robustness)**
  *   **The Case:** Inputs will be ordinal rankings, not vNM lotteries.
  *   **Verdict:** **Non-Negotiable.** A rule that errors out on intransitive inputs is useless.
  *   **Requirement:** **Least-Squares Fit.** The system should project messy inputs onto the nearest rational utility function rather than rejecting them.

  **6. Variable Population and Near-Duplicates**
  *   **The Case:** Housing projects change population counts.
  *   **Verdict:** **Contested.** Total Utilitarianism (sum) favors adding lives barely worth living (Repugnant Conclusion). Average Utilitarianism (mean) implies killing unhappy people raises the score.
  *   **Recommendation:** For regional investment, **Critical-Level Utilitarianism** is the pragmatic middle ground (new lives must exceed a "worth living" threshold to add value).

  **7. Stability over Time (Dynamic Consistency)**
  *   **The Case:** If updating beliefs changes past rankings, you are vulnerable to "money pumps" and accusations of moving goalposts.
  *   **Verdict:** **Non-Negotiable.** Institutional credibility requires that $Rank(A, B)_t$ updated to $t+1$ matches $Rank(A, B)_{t+1}$.

  **8. Estimability (Operationalizability)**
  *   **The Case:** If it takes 10 years to measure the inputs, the decision is already stale.
  *   **Verdict:** **Non-Negotiable.** This is not cheating; a normative theory that cannot be instantiated is not a theory for practitioners.

  ---

  ### Part 2: Additional Desiderata

  Add these three to your spec. They are critical for public defensibility.

  **9. Anonymity (Identity Irrelevance)**
  *   **The Case:** The tool cannot rank Project A higher because it benefits "people like us" or specific voters.
  *   **Requirement:** Permuting utility vectors across individuals must not change the social ranking.
  *   **Status:** **Non-Negotiable.** Violating this is corruption.

  **10. Explainability (Local Sensitivity)**
  *   **The Case:** When you reject a flood defence, you must be able to say *why*. "The black box said so" is not defensible.
  *   **Requirement:** The rule must allow for **Shadow Prices**. You must be able to output: "Project A lost because the cost per QALY exceeded the threshold," not just "Social Welfare B > Social Welfare A."
  *   **Status:** **Non-Negotiable.**

  **11. The Pareto Principle (Weak)**
  *   **The Case:** If everyone is strictly better off under Option A, society should prefer A.
  *   **Status:** **Contested (with caveats).** You must accept this *only* for self-regarding preferences (see Point 2). If you reject Pareto entirely, you become paternalistic; if you accept it fully, you accept external prejudices.

  ---

  ### Part 3: The Incompatibility Matrix (The Bad News)

  You asked for pairs that cannot be jointly satisfied. Here are the three hard constraints your team will face.

  **1. Ex-Ante Fairness vs. Ex-Post Fairness (The Diamond Conflict)**
  *   **Conflict:** You cannot satisfy **Splitting Invariance** (Point 1) AND care about the **Distribution of Final Outcomes**.
  *   **Example:**
      *   *Option A:* Coin flip. Heads: Person 1 gets \$100. Tails: Person 2 gets \$100. (Ex-Ante Equal, Ex-Post Unequal).
      *   *Option B:* Everyone gets \$50 for sure. (Ex-Ante Equal, Ex-Post Equal).
      *   If you satisfy Splitting Invariance, you must be indifferent between A and B (assuming risk neutrality). If you prefer B because it avoids one person getting nothing, you violate Splitting Invariance.
  *   **Decision:** For public investment, **Ex-Post Fairness** usually wins politically. People care if one neighborhood drowns, even if the *expected* damage was minimized.
  *   **Cost:** You must abandon Expected Utility Theory at the social level. You cannot simply sum expected utilities.

  **2. Pareto vs. Sovereignty (The Liberal Paradox)**
  *   **Conflict:** You cannot satisfy **Pareto** (Point 11) AND **Personal Domain Sovereignty** (Point 2) in all cases.
  *   **Example:** If a majority hates a minority's existence (external preference), Pareto says "don't build housing." Sovereignty says "their well-being counts, your hate doesn't."
  *   **Decision:** You must violate Pareto for external preferences.
  *   **Cost:** You open yourself to accusations of ignoring "what the people want." You must defend the distinction between *welfare* and *preference*.

  **3. Comparability vs. Invariance (The Measurement Problem)**
  *   **Conflict:** You cannot have **Full Affine Invariance** (Point 3) AND **Non-Dictatorial Aggregation**.
  *   **Decision:** You must fix a unit of measurement (e.g., QALYs, equivalent income).
  *   **Cost:** You open yourself to accusations that the metric is arbitrary. "Why is a QALY worth \$50k?"

  ---

  ### Part 4: What to Drop?

  If the list is unsatisfiable (and it is), here is the prioritization for a **regional public-investment body**:

  **Drop First: Splitting Invariance.**
  *   **Why:** In public infrastructure, uncertainty resolves into *realized* winners and losers. If your tool ignores the variance of outcomes (who actually drowns), it will produce recommendations that look sociopathic to the public.
  *   **Cost:** You lose the mathematical elegance of Expected Utility. You cannot simply calculate $E[U]$. You need a rule that penalizes outcome inequality (e.g., Prioritarianism or Ex-Post Egalitarianism).

  **Drop Second: Strict Respect for Individual Probabilities.**
  *   **Why:** As noted in Mongin's result, aggregating subjective beliefs leads to dictatorship or inconsistency.
  *   **Cost:** You must impose "Scientific Probabilities." Citizens will complain their risk perception isn't respected.
  *   **Mitigation:** Treat their risk perception as *risk aversion* (utility curvature), not probability disagreement.

  **Keep at All Costs:** Anonymity, Estimability, Explainability, and the Filter on External Preferences. These are your legal and political shield.

  ---

  ### Part 5: The Scorecard

  Here is how the main contenders stack up against your refined desiderata.

  | Rule | Estimability | Ex-Post Equity | Robust to Belief Disagreement | Explainability | Verdict |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Weighted Utilitarian Sum** (Harsanyi) | **High.** Just sum expected utilities. | **Fail.** Indifferent to who suffers the realized loss. | **Fail.** Requires aggregating beliefs or imposing one. | **High.** Marginal contributions are clear. | **Too cold.** Good for efficiency, bad for political defense on distribution. |
  | **Ex-Post Prioritarianism** (Weighted Sum of Concave Utilities) | **Med.** Needs calibration of the "priority weight." | **Pass.** Penalizes inequality in final outcomes. | **Pass.** Uses objective probs; treats fear as utility. | **Med.** "Priority weight" is hard to explain. | **Strong Contender.** Balances efficiency and equity. |
  | **Maximin** (Rawlsian) | **Low.** Requires identifying the single worst-off group precisely. | **Pass.** Protects the worst outcome absolutely. | **Pass.** | **Low.** "Why did we spend \$10M to help 5 people?" | **Too rigid.** Leads to paralysis or massive inefficiency. |
  | **Veil of Ignorance** (Simulated Choice) | **Low.** Requires modeling a hypothetical agent. | **Pass.** Depends on the simulated risk aversion. | **Med.** | **Low.** "The hypothetical agent said..." is weak defense. | **Conceptually useful, operationally vague.** |

  ### Final Recommendation

  **Build for Ex-Post Prioritarianism.**
  1.  **Use Objective Probabilities:** Use your hydrologists/epidemiologists for $P(state)$. Do not aggregate citizen credences.
  2.  **Calibrate Utilities:** Map outcomes to a common unit (e.g., Equivalent Income or QALYs). This solves the Comparability/Invariance tension.
  3.  **Apply a Priority Weight:** Transform individual utilities $u_i$ via a concave function $g(u_i)$ (e.g., $u_i^{0.5}$) *before* summing. This captures the "concern for who ends up badly off" without requiring full Maximin rigidity.
  4.  **Filter Preferences:** Explicitly exclude utilities derived from others' status.

  This approach violates Splitting Invariance (you care about the final distribution), but it satisfies Estimability, Explainability, and Anonymity, and it avoids the "sociopathic" outcomes of pure Utilitarianism that get public bodies sued or abolished.
