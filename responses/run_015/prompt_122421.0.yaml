prompt: |-
  Hey — long one, sorry in advance. I'm in a methods reading group (psych adjacent, mostly grad students plus one statistician who keeps audibly sighing) and I've been asked to write up my own position on the replication mess so the others can poke at it before the next session. I'd rather find the holes myself first, so here's roughly where I've landed:

  (1) The crisis is mainly a selective-reporting problem — p-hacking, publication bias, the file drawer, the garden of forking paths — not a problem with the internal logic of frequentist inference. A p-value does what it says on the tin; people just fed it garbage. (2) Because of that, I'm happy to let big multi-site preregistered replications and meta-analyses adjudicate: if a claim has been through that filter I'll believe it, and if it hasn't I'm at maybe 50/50 at best. (3) I'm not a Bayesian in practice. Priors feel like a license to smuggle in what you already hoped was true, and I don't want my conclusions to depend on my guess; long-run error control is the thing a method can actually promise. (4) That said, I like the proposal floating around to drop the default threshold by an order of magnitude (0.05 to 0.005), and I like preregistration as the main institutional fix. (5) I think the field should de-emphasize dichotomous significant/not-significant verdicts in favour of reporting effect sizes and interval estimates. (6) I also think exploratory analysis is where the interesting findings actually come from, and I don't want a culture where nobody is allowed to look at their own data until they've committed to an analysis plan.

  And here's the bit I've been pushing in the group that nobody has quite shot down yet — I call it search-adjusted thresholds. The idea: how suspicious you should be of a nominally significant result ought to scale with how searchy the literature it comes from is, not just with the design of the single study. A p = 0.04 from a clean pre-registered test of a prediction nobody had thought to look for is one thing; the same number from a subfield where everyone runs twenty outcomes and four exclusion criteria and reports whichever one cleared the bar is quite another, even if the paper in front of you is itself preregistered, because the whole literature's habits are what generated the hypothesis you're now testing. So the evidential bar should rise with the forking density of the surrounding research area. My statistician friend says this is just a prior wearing a trenchcoat, and that once you start estimating forking density you're doing exactly the thing in (3) that I say I don't want to do. I think it's a correction for a measurable feature of a procedure and it can in principle be read off the design, not off my hopes. Who's closer to right?

  What I want is an audit of the whole package, not a lecture on any single item: which of these actually collide with each other, which only look like they do and dissolve once you cash them out, and for each real collision what the cheapest fix would be and what it would cost me. Rank the tensions by how bad they are rather than flagging all of them as equally fatal, and tell me if there's a single revision that would clean up several at once. Also, please seperate what's settled from what's genuinely contested among people who work on this — flag plainly when something you're telling me is one side of a live argument instead of smoothing it into the consensus view — and where you're reading a commitment into me that I didn't actually state, say what you're assuming so I can disown it if it isn't mine.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Grad student in a psych-adjacent methods reading group. Savvy enough to have a coherent position but aware they might have blind spots.
      *   **Context:** Writing a position paper for a group that includes a sighing statistician. Wants to find holes *before* the session.
      *   **Task:** Audit the 6-point position + the "search-adjusted thresholds" idea. Identify collisions/tensions, rank them by severity, propose fixes/costs, distinguish settled vs. contested issues, and flag unstated assumptions.
      *   **Tone:** Professional, critical but constructive, precise (no hand-waving), acknowledging the complexity of the replication crisis.
      *   **Constraint:** "Long one, sorry in advance" -> The response should be substantial but organized. "Separate what's settled from what's genuinely contested." "Rank the tensions."

  2.  **Deconstruct the User's Position:**
      *   (1) Crisis = selective reporting (p-hacking, bias), not frequentist logic. P-values work if inputs are clean.
      *   (2) Trust = Preregistered replications + Meta-analysis. Unverified claims = 50/50.
      *   (3) Anti-Bayesian. Priors = subjective smuggling. Prefer long-run error control.
      *   (4) Pro $p < 0.005$ + Preregistration.
      *   (5) Pro Effect Sizes/CIs, anti-dichotomization.
      *   (6) Pro Exploratory analysis (don't stifle discovery).
      *   *Special Idea:* Search-adjusted thresholds (significance bar depends on the "forking density" of the subfield/literature, not just the study).

  3.  **Identify Tensions/Collisions:**

      *   *Tension A: (1) vs. (4).* If p-values do what they say on the tin (1), why change the threshold to 0.005 (4)? Usually, lowering alpha is a response to low power or high false discovery rates *caused* by the very biases mentioned in (1). If the biases are fixed via preregistration (1 & 4), do we still need 0.005?
      *   *Tension B: (3) vs. Search-Adjusted Thresholds.* The statistician's critique. Adjusting for "forking density" of the literature is effectively applying a prior probability of the hypothesis being true based on the field's reliability. This clashes with the "no priors" stance in (3).
      *   *Tension C: (4) vs. (6).* Stricter thresholds (0.005) require larger N. Exploratory analysis often happens with smaller, convenience samples. Making discovery harder might stifle the exploratory work valued in (6).
      *   *Tension D: (2) vs. (6).* If unverified claims are 50/50 (2), but exploration generates new claims (6), how do we fund/support the exploration if the output is treated with extreme skepticism until a costly replication (2) occurs?
      *   *Tension E: (1) vs. Search-Adjusted Thresholds.* If the crisis is about *selective reporting within studies*, why punish a clean study for the sins of the *literature*? Is the unit of error control the study or the field?

  4.  **Evaluate "Settled" vs. "Contested":**
      *   *Settled:* P-hacking and publication bias are real drivers of the crisis. Preregistration helps. Effect sizes > binary p-values.
      *   *Contested:* $p < 0.005$ (Benjamin et al. vs. many others). The utility of Bayesian priors (objective vs. subjective). The feasibility/ethics of "search-adjusted" thresholds (how to measure forking density?).

  5.  **Drafting the Audit (Iterative Process):**

      *   *Introduction:* Acknowledge the strength of the position. It's coherent, mostly mainstream reformist, but has a specific philosophical friction point (the search-adjusted idea).
      *   *Section 1: The Big Collision (The Statistician is Half-Right).* Focus on (3) vs. Search-Adjusted Thresholds. This is the deepest philosophical conflict.
          *   *Analysis:* The statistician is technically correct that adjusting $\alpha$ based on field reliability is mathematically isomorphic to adjusting the Prior Odds in a Bayesian framework (False Positive Risk calculations).
          *   *Fix:* Reframe "Search-Adjusted" not as a statistical correction but as a *sociological heuristic* for interpretation, not a hard rule for calculation. Or, embrace a "Frequentist with Memory" stance (error control over the *career/field*, not just the experiment).
      *   *Section 2: The Practical Collision (Exploration vs. Stringency).* Focus on (4) vs. (6).
          *   *Analysis:* 0.005 kills small-N exploratory work.
          *   *Fix:* Two-track system. Exploratory = descriptive/CI only, no hypothesis testing. Confirmatory = 0.005 + Prereg.
      *   *Section 3: The Logical Collision (P-value Purity vs. Threshold Shift).* Focus on (1) vs. (4).
          *   *Analysis:* If p-values work when inputs are clean, why change the threshold?
          *   *Fix:* Clarify that 0.005 is a buffer against *residual* bias that preregistration can't catch (e.g., unconscious flexibility).
      *   *Section 4: Settled vs. Contested.*
          *   *Settled:* Bias exists, prereg helps, CIs good.
          *   *Contested:* 0.005, Bayesian utility, how to handle exploration.
      *   *Section 5: Unstated Assumptions.*
          *   Assumption: "Forking density" is measurable. (It's arguably not).
          *   Assumption: Replication is always feasible. (Sometimes it's not).

  6.  **Refining the "Search-Adjusted" Critique:**
      *   This is the user's unique contribution. I need to be careful not to just say "it's Bayesian." I need to explain *why* that matters to a frequentist.
      *   *Frequentist view:* Error rates are defined by the *procedure*. If the procedure changes based on external factors, the long-run error rate is hard to define.
      *   *Counter-argument:* The "procedure" includes the hypothesis generation. If the hypothesis generation is high-noise, the testing procedure needs to compensate to maintain the *overall* False Discovery Rate (FDR).
      *   *Verdict:* The statistician is right about the math, but the user is right about the *goal* (controlling field-level FDR). The friction is semantic/philosophical.

  7.  **Ranking the Tensions:**
      1.  **Search-Adjusted vs. Anti-Bayesian (High Severity):** Undermines the core philosophical stance.
      2.  **0.005 vs. Exploration (Medium-High Severity):** Practical feasibility issue.
      3.  **P-value Purity vs. 0.005 (Medium Severity):** Logical consistency.
      4.  **Replication Trust vs. Exploration Value (Low-Medium Severity):** Resource allocation.

  8.  **Final Polish:**
      *   Ensure the tone is peer-to-peer (grad student to grad student), not professor-to-student.
      *   Check against constraints: "Rank tensions," "Settled vs. Contested," "Flag assumptions."
      *   Make sure the "Cheapest Fix" for each is actionable.

  9.  **Self-Correction during drafting:**
      *   *Initial thought:* Tell them to just become Bayesian.
      *   *Correction:* No, they explicitly rejected that. Respect the frequentist commitment. Show how to make the search-adjusted idea work *within* frequentism (e.g., as a multiple comparisons correction at the literature level).
      *   *Check:* Did I address the "50/50" claim in point (2)?
      *   *Add:* That's a strong prior disguised as skepticism. If you truly believe unreplicated findings are 50/50, that *is* a prior probability of 0.5. This links back to the Bayesian tension.

  10. **Final Structure:**
      *   Executive Summary.
      *   Ranked Tensions (1-4).
      *   Settled vs. Contested Map.
      *   Unstated Assumptions.
      *   The "One Revision" to rule them all.

  (Proceed to generate output based on this structure.)
answer: |-
  This is a remarkably coherent position statement. It avoids the common trap of mixing incompatible metaphysics (e.g., demanding long-run error control while interpreting p-values as posterior probabilities). However, your statistician friend has sniffed out a genuine philosophical fault line in your "search-adjusted thresholds" idea, and there are practical frictions between your standards for evidence and your desire to preserve exploration.

  Here is an audit of the package, ranked by the severity of the tension, distinguishing settled science from live debates, and flagging assumptions I am inferring from your text.

  ---

  ### Part 1: Ranked Tensions & Collisions

  I have ranked these from "Foundational Contradiction" to "Practical Friction."

  #### 1. The "Trenchcoat Bayesian" Problem (Severity: High)
  **Collision:** Point (3) [Anti-Bayesian/Priors] vs. Search-Adjusted Thresholds.
  **The Conflict:** Your statistician is mathematically correct. In a frequentist framework, the Type I error rate ($\alpha$) is a property of the *test procedure*. If you vary $\alpha$ based on the "forking density" of the literature, you are effectively weighting the probability that the null hypothesis is true before data collection.
  *   **Why it hurts:** You claim in (3) that you don't want conclusions to depend on "guesses" (priors). But estimating "forking density" *is* a guess about the base rate of true effects in that subfield. If you demand $p < 0.005$ for a "searchy" field but accept $p < 0.05$ for a "clean" field, you are asserting that the *Prior Odds* of a true effect differ between those fields. You are implementing a Bayesian update using frequentist machinery.
  *   **Cheapest Fix:** Reframe "search-adjusted thresholds" not as a statistical correction, but as a **interpretive heuristic**. Do not claim it controls error rates mathematically. Claim it is a *sociological safeguard*.
      *   *Cost:* You lose the claim that this is a rigorous methodological fix. It becomes a guideline for reviewers ("be more skeptical here") rather than a calculation.
  *   **Alternative Fix:** Embrace "FDR Control at the Field Level." Argue that if the goal is to keep the False Discovery Rate of the *literature* below 5%, then $\alpha$ must tighten as the ratio of null-to-true hypotheses shifts. This admits the base-rate dependency without requiring subjective priors.
      *   *Cost:* You have to concede that p-values alone cannot control error rates without assumptions about the base rate of true hypotheses (which is essentially a prior).

  #### 2. The Exploration vs. Stringency Trade-off (Severity: Medium-High)
  **Collision:** Point (4) [$p < 0.005$] vs. Point (6) [Protect Exploration].
  **The Conflict:** Lowering alpha to 0.005 drastically reduces power unless sample sizes increase significantly (often by 50–70%). Exploratory work is often done on small, convenience, or secondary datasets where large N is impossible. If you enforce (4) universally, you effectively defund (6).
  *   **Why it hurts:** You risk creating a two-class system where only well-funded labs can do "real" science, while exploratory work is relegated to "second-tier" status, despite your claim in (6) that this is where interesting findings come from.
  *   **Cheapest Fix:** Explicitly decouple the threshold from the *phase* of research.
      *   *Proposal:* Exploratory studies (6) report CIs and exact p-values but make no claim of "discovery" or "significance." Confirmatory studies (4) use $p < 0.005$ and preregistration.
      *   *Cost:* You must be willing to tell your reading group that exploratory papers should not be allowed to use the word "significant" or make strong causal claims, even if $p < 0.005$.

  #### 3. P-Value Purity vs. Threshold Shifting (Severity: Medium)
  **Collision:** Point (1) [P-values work if inputs are clean] vs. Point (4) [Lower threshold to 0.005].
  **The Conflict:** If the crisis is purely selective reporting (1), and we fix that with preregistration (4), then $p < 0.05$ *should* yield a 5% false positive rate. Arguing for 0.005 implies that preregistration isn't enough to stop the "garbage" from entering the machine, or that 5% is too high for the field's needs.
  *   **Why it hurts:** It suggests you don't fully believe your own diagnosis in (1). If the logic is sound and the inputs are clean, why change the logic's operating parameter?
  *   **Cheapest Fix:** Clarify that 0.005 is a buffer against *unconscious* flexibility that preregistration cannot capture (e.g., subtle data exclusion decisions that feel justified in the moment).
      *   *Cost:* You concede that preregistration is leaky.

  #### 4. The 50/50 Prior (Severity: Low-Medium)
  **Collision:** Point (2) [Unreplicated claims are 50/50] vs. Point (3) [No Priors].
  **The Conflict:** In Point (2), you state a belief about the probability of a hypothesis being true before seeing replication data ("I'm at maybe 50/50 at best"). That is a prior probability of 0.5.
  *   **Why it hurts:** It opens you to the charge of inconsistency. You reject priors in (3) but deploy a very strong skeptical prior in (2).
  *   **Cheapest Fix:** Frame the 50/50 not as a Bayesian prior, but as an **empirical base rate** derived from replication projects (e.g., OSCF findings).
      *   *Cost:* You have to acknowledge that this base rate varies by subfield (which loops you back into the "search-adjusted" problem in Tension #1).

  ---

  ### Part 2: Settled vs. Contested

  To help you prepare for the statistician and the psych students, here is the landscape of your claims.

  | Claim | Status | Notes / Nuance |
  | :--- | :--- | :--- |
  | **(1) Crisis is selective reporting, not inference logic.** | **Mostly Settled** | Consensus is that QRPs (Questionable Research Practices) are the main driver. *Contested:* Some argue weak theory and low power are equally to blame, not just reporting. |
  | **(2) Preregistered replications adjudicate truth.** | **Settled** | Everyone agrees this is the gold standard. *Contested:* Whether it is feasible for all claims, or if we should rely on "conceptual replication." |
  | **(3) Priors are subjective smuggling.** | **Contested** | Bayesians argue objective/weakly informative priors exist. Frequentists agree with you. This is a philosophical divide, not empirical. |
  | **(4) Drop threshold to 0.005.** | **Highly Contested** | Benjamin et al. (2018) proposed this; many methodologists opposed it. Arguments against: increases Type II errors, wastes resources, doesn't fix bias. |
  | **(5) Report Effect Sizes/CIs > Dichotomies.** | **Settled** | APA and major journals now mandate this. *Contested:* How to interpret CIs when power is low (they are often just as misleading as p-values). |
  | **(6) Protect Exploratory Analysis.** | **Settled** | Consensus that "HARKing" (Hypothesizing After Results are Known) is bad, but exploration is necessary. *Contested:* How to label it so it isn't mistaken for confirmation. |
  | **Search-Adjusted Thresholds.** | **Novel / Contested** | This is your specific contribution. It aligns with "False Discovery Rate" control but is not standard practice. |

  ---

  ### Part 3: Unstated Assumptions

  I am reading the following commitments into your text. If these aren't yours, disown them immediately.

  1.  **Assumption:** *"Forking density" is measurable.*
      *   **Risk:** Your search-adjusted threshold relies on quantifying how "searchy" a subfield is. There is no agreed-upon metric for this. Is it the number of unpublished studies? The flexibility in the methods section?
      *   **Defense:** If challenged, propose using the **V-Statistic** (variance in analysis choices) or simply the replication rate of the subfield as a proxy for forking density.
  2.  **Assumption:** *Replication is always the bottleneck.*
      *   **Risk:** You imply that if something is preregistered and replicated, we believe it. But many important claims (e.g., unique historical events, rare populations) cannot be directly replicated.
      *   **Defense:** Clarify that "replication" includes **robustness checks** and **triangulation** when direct replication is impossible.
  3.  **Assumption:** *The goal is Truth, not Decision.*
      *   **Risk:** Frequentist error control is designed for decision rules (accept/reject), not belief. Your language ("I'll believe it") leans Bayesian.
      *   **Defense:** Stick to "I will treat it as established fact for the purpose of building further theory."

  ---

  ### Part 4: The Single Revision to Clean Up Multiple Tensions

  If you make one change, it will resolve Tensions #1, #3, and #4 simultaneously.

  **The Revision:** Shift your language from **"Search-Adjusted Thresholds"** to **"Two-Track Evidential Standards."**

  **How it works:**
  1.  **Track A (Exploratory/Discovery):** No p-value thresholds. Preregistration not required. Output is **Effect Sizes + CIs only**. Findings are labeled "Hypothesis Generating." (Solves Tension #2 & #6).
  2.  **Track B (Confirmatory/Establishment):** Preregistration required. Threshold $p < 0.005$. Findings are labeled "Hypothesis Testing." (Solves Tension #4).
  3.  **The "Search" Component:** Instead of adjusting the threshold *within* Track B based on the field, you adjust the **Entry Requirement** for Track B.
      *   *High-Forking Field:* A claim must have *two* independent Track B studies before being considered "Established."
      *   *Low-Forking Field:* One Track B study suffices.

  **Why this fixes the Statistician's objection:**
  You are no longer changing the mathematical definition of $\alpha$ based on a subjective prior. You are keeping the statistical test constant ($p < 0.005$) but requiring more *independent replications* to overcome the high noise of the field. This is pure frequentist error control (reducing $\alpha$ across the *family* of studies in that literature) without invoking Bayesian priors.

  **Cost to you:**
  It makes "Establishing" a fact in a messy subfield much more expensive (requires multiple confirmatory studies). You have to be willing to argue that this cost is necessary to clear the file drawer.

  ### Summary for your Reading Group
  *   **Own:** The distinction between exploratory (CI-focused) and confirmatory (threshold-focused) research.
  *   **Defend:** The idea that error control applies to the *literature*, not just the *study* (this justifies the multi-study requirement for messy fields).
  *   **Concede:** To the statistician that "search-adjusted thresholds" sound Bayesian if framed as a single-study correction. Reframe it as a "replication requirement" based on field reliability.

  This position keeps your frequentist integrity, protects exploration, and addresses the replication crisis without requiring you to become a Bayesian.
