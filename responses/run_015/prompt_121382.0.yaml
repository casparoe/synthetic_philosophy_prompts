  There is no single, established term in the philosophical lexicon that captures this specific pattern of argumentation within the debate on dreaming. While the manoeuvre shares DNA with broader informal fallacies, the particular oscillation between occurrent experience and representational trace warrants a more precise designation.

  In the absence of a canonical label, I propose the term **Ontological Shuttling**.

  ### Definition of Ontological Shuttling

  **Ontological Shuttling** is a dialectical manoeuvre wherein a philosopher strategically reclassifies the ontological status of a phenomenon between two distinct categories—typically between an *occurrent state* (something happening now) and a *dispositional or trace state* (something recorded or constructed later)—solely to evade counter-arguments, without providing independent justification for the reclassification.

  In the context of the philosophy of dreams, this manifests as shifting the status of dream content between 'genuine experience' and 'memory trace' depending on which classification best protects the theorist's core thesis from falsification.

  ### Distinction from Related Concepts

  You correctly identified that this is not quite a *motte-and-bailey* doctrine, nor is it simple *equivocation*. Here is how **Ontological Shuttling** differs from those and other related failures of consistency:

  1.  **Vs. Motte-and-Bailey:**
      In a motte-and-bailey, the arguer retreats to a modest, defensible claim (the motte) when challenged, but asserts a bold, controversial claim (the bailey) when unchallenged. In Ontological Shuttling, neither position is necessarily 'safe' or 'modest'; both 'experience' and 'trace' are contested ontological claims. The shift is not between bold and cautious, but between *temporal locations* of the phenomenon (during sleep vs. upon waking) to suit the immediate dialectical pressure.

  2.  **Vs. Equivocation:**
      Equivocation involves using a word in two different senses (e.g., 'light' as weight vs. 'light' as illumination). In Ontological Shuttling, the technical terms (experience, representation, memory) retain their meanings. What shifts is the *assignment* of the phenomenon to those categories. The philosopher knows what 'experience' means; they simply disagree on whether the dream report qualifies as evidence of one, depending on the direction of the argument.

  3.  **Vs. Auxiliary Hypothesis Adjustment:**
      In legitimate scientific or philosophical modelling, theories are often refined by adding auxiliary hypotheses when faced with anomalies (e.g., positing an unseen planet to explain orbital irregularities). Ontological Shuttling differs because the reclassification is not driven by new evidence or explanatory power, but by *defensive convenience*. If the shift were genuine theory refinement, the philosopher would apply the 'trace' explanation consistently to all dream reports, not only to the impossible ones that threaten their position.

  ### Boundary Cases

  To distinguish Ontological Shuttling from legitimate theoretical nuance, one must look for **asymmetric application**.

  *   **Legitimate Adjustment:** A philosopher argues that most dreams are experiences, but admits that upon waking, certain fragments are reconstructed. They provide independent criteria (e.g., neuroimaging data or consistency checks) to distinguish between the two.
  *   **Ontological Shuttling:** The philosopher accepts the 'experience' classification when the dream report supports their theory (e.g., vividness proves consciousness) but instantly switches to the 'trace' classification when the report threatens it (e.g., impossibility proves confabulation), without offering a neutral criterion for distinguishing the two cases prior to the argument.

  ### Broader Application in Philosophy of Mind

  This manoeuvre is not unique to the philosophy of dreams; it appears wherever the relationship between phenomenology and reporting is opaque.

  1.  **Perception and Illusion:** In debates about perceptual error, a theorist might argue that an illusion proves the existence of sense-data (occurrent experience) when defending realism, but argue that the same illusion is merely a cognitive misinterpretation (representational trace) when defending direct realism against scepticism.
  2.  **Artificial Intelligence:** In discussions of machine consciousness, proponents might treat a chatbot's output as evidence of internal understanding (occurrent experience) when praising its capabilities, but retreat to saying it is merely statistical prediction (representational trace) when confronted with questions about qualia or suffering.
  3.  **Memory and Trauma:** In philosophy of psychiatry, one might argue that a recovered memory is a genuine trace of an event when validating a patient's distress, but classify it as a reconstructive narrative (representational trace) when challenged on its historical accuracy.

  ### Conclusion

  While the debate between Malcolm and Dennett highlights the epistemological difficulties of dream reports, the argumentative pattern you have identified is a specific failure of dialectical integrity. By labelling it **Ontological Shuttling**, we can better isolate the moment a theorist stops analysing the phenomenon and starts manipulating its categorisation to ensure their position remains unfalsifiable. It is a useful addition to the toolkit for critiquing philosophy of mind, particularly in areas where the first-person perspective is inaccessible to third-party verification.
