          You are right to feel that conclusions six and seven are unacceptable because they invert our ordinary understanding of competence and freedom. The argument is seductive because it relies on a subtle shift in meaning between the first premise and the fifth premise, and the step you should reject is number five. It looks fine initially because it correctly identifies that expert performance often feels effortless and does not involve conscious deliberation on every micro-action. We know that if a skilled pianist starts thinking about the position of each finger they might stumble, so it seems true that the mechanism is offline to the process. However, the error lies in conflating sensitivity to the steps with sensitivity to the success of the goal. Premise one defines agency as sensitivity to whether the behaviour is achieving its point, not sensitivity to the mechanical instructions used to get there. An expert tennis player is not consciously monitoring their wrist angle during a serve, but if the ball lands out, their system immediately detects the failure and adjusts the next serve. The mechanism is highly sensitive to success, just not via the conscious verbal channel that a novice uses.

