  1.  **Analyze the User's Request:**
      *   **Topic:** *The Picture of Dorian Gray* by Oscar Wilde.
      *   **Core Concept:** "Moral Provenance Tracking" (the idea that moral value/corruption must attach to the correct causal origin, not just the appearance).
      *   **Specific Question:** Does the novel support the idea that the *original* (the painting) bears the moral weight while the *copy* (Dorian) stays pure? Or does it undermine this, suggesting Dorian is the corrupted reality and the canvas is just a record? Does the painting's agency break the causal chain?
      *   **Key Scenes to Focus On:** The locked-room scenes (Basil seeing the portrait, Dorian stabbing it).
