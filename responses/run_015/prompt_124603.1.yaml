      *   Player B sees this.
      *   *But:* The "Contradiction Detector" is the Noise Oracle. It flags a contradiction 70% of the time when there is one, and 30% of the time when there isn't.
      *   So B sees "CONTRADICTION DETECTED" on A's sheet. But B knows the detector is noisy. Should B dismiss A entirely? Or discount?
      *   This hits the prompt's "evidence about evidence is unreliable" wrinkle.

      *Let's refine the "Self-Erosion" round.*
      *   Pairs review their Round 1 transcripts.
      *   They must agree on a "Rationality Grade" for their interaction.
      *   If they disagree on the grade, they enter a "Meta-Disagreement" protocol (estimate the grade).
      *   The Facilitator has a pre-computed "Ideal Grade."
      *   This forces them to evaluate their own epistemic policy.

  11. **Writing the Response:**

      *   Follow the structure requested: Setup/Materials, Pairings/Roles, Timeline, Payoff, Debrief, Failure Modes, Limitations, Closing Note.
