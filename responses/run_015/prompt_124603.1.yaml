      *   **Goal:** Stage peer disagreement (Conciliationism vs. Steadfastness) *experientially* before naming the theories. Participants should feel the pull of both views, notice they apply different rules in different cases, and struggle to justify the difference.
      *   **Core Mechanic:** Disagreement where evidence about evidence (meta-evidence) is unreliable ("noise oracle," 70% accurate).
      *   **Specific Scenarios:**
          1.  *Traceable Disagreement:* One can see where the peer's evidence was corrupted/reasoning slipped.
          2.  *Bare Disagreement:* Equally smart/calibrated peer, no visible flaw, just different conclusion.
          3.  *Self-Erosion Round:* Disagreement about how much to update in the previous round (higher-order disagreement).
      *   **Deliverables:** Setup/materials (printable cards, 1 phone), pairings/roles, minute-by-minute timeline (90 mins), payoff scheme (points), debrief guide, predicted failure modes, limitations of the simulation, and a closing note on settled vs. contested theory (no citations/reading list).
      *   **Constraints:** No lecture up front. No degeneracy into theory argument. No reading list/citations. Be frank about limitations and contested presuppositions.

  2.  **Deconstruct the Core Mechanic (The "Noise Oracle"):**

      *   Participants need private evidence ($E$) and a signal about the reliability of that evidence ($R$).
      *   $R$ is noisy (70% accurate).
      *   They make an estimate.
      *   They meet a peer. The peer has $E'$ and $R'$.
      *   *Traceable:* The facilitator reveals *why* $E'$ is bad (e.g., "Peer's oracle said High Reliability, but we know their channel was Corrupted"). Or, the peer's reasoning chain is shown to have a math error.
