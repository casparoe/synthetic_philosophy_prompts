      *Actually, to make it truly "Traceable" in the philosophical sense (seeing the reasoning slip):*
      *   Let's use a calculation task. "Calculate the expected value of this lottery."
      *   *Bare:* You calculate $X$. Partner calculates $Y$. Both used calculators. Both are good at math.
