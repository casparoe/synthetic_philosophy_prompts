      *   Let's make it symmetric but with asymmetric info.
      *   *Correction:* To feel the tension, *both* need to feel the pull.
      *   Round 2 Setup: Both get the "Trace" info about *each other*? No, that resolves it too fast.
      *   Round 2 Setup: You get info that *might* indicate your partner is noisy, but it's the noisy oracle again.
      *   *Better:* Round 2 is "The Leak." You get a slip of paper: "Partner's Oracle was lying." But you know *your* oracle lies 30% of the time too. So is the leak real?
      *   This captures the "evidence about evidence is unreliable" constraint perfectly.

  8.  **Predicting Failure Modes:**

      *   *The "Oracle as Evidence" Collapse:* Participants treat the reliability signal as just another data point to average, rather than a weight on the primary data.
      *   *The "Politeness" Bias:* They split the difference to be nice, not epistemic reasons.
      *   *The "Math" Distraction:* They spend too long calculating and miss the epistemic feeling.
      *   *The "Winner" Mentality:* Trying to beat the partner rather than find truth. (Mitigated by scoring rule).

  9.  **Limitations & Contested Theory:**

      *   *Peer Identification:* In the game, "peer" is stipulated by the facilitator. In real life, identifying a peer is the hard part.
      *   *Higher-Order:* The game forces a meta-round, but real self-erosion is more subtle.
      *   *Steadfastness:* The game might bias toward conciliation because the scoring rule rewards accuracy, and averaging often wins. Steadfastness usually relies on "I know I'm right" which is hard to simulate without making them actually right.

  10. **Finalizing the Design:**

      *   **Title:** The Oracle's Shadow.
      *   **Materials:** Envelopes, Cards, Phones (for timer/random seed), Score sheets.
      *   **Task:** Estimating a hidden integer (1-1000).
      *   **Signal:** A range (e.g., True Value is 450 ± 50).
