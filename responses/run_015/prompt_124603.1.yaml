answer: |-
  # Workshop Design: The Oracle's Shadow

  ## 1. Setup and Materials

  **Room:** One large table or clusters of desks allowing 9 pairs to sit face-to-face.
  **Materials:**
  *   **1 Smartphone:** For the facilitator (timer, random number generation, keeping the "True Values").
  *   **18 "Agent Packets" (Envelopes):** One per participant.
  *   **9 "Pair Logs" (Sheets):** One per pair, to record estimates and updates.
  *   **Printable Cards:** (Details below).
  *   **Whiteboard:** For leaderboard tracking.

  **The Task:**
  In every round, there is a hidden **Target Integer ($T$)** between 1 and 1000. The goal is to submit a final estimate ($E$) as close to $T$ as possible.

  **The Packets (Inside each envelope):**
  1.  **Signal Card:** Shows a range (e.g., "$T$ is $450 \pm 50$"). This is their first-order evidence.
  2.  **Reliability Token:** A colored chip (Green or Red).
      *   **Green:** Indicates "High Precision" (the $\pm$ range is accurate).
      *   **Red:** Indicates "Low Precision" (the actual error is $3\times$ the stated range).
      *   **The Catch:** The Token is a **Noise Oracle**. It matches the true precision only 70% of the time. (Facilitator tracks the actual accuracy via a pre-generated list).
  3.  **Instruction Slip:** Specific to the round (Bare, Traceable, or Meta).

  **Payoff Scheme (Leaderboard Points):**
  *   **Accuracy Points:** $1000 - |E - T|$. (Max 1000 per round).
  *   **Calibration Bonus:** In Round 3 only, points awarded for agreeing with the "Ideal Weight" (calculated by facilitator post-hoc).
  *   **Total Score:** Cumulative across all rounds. Top 3 get bragging rights (no money).

  ---

  ## 2. Pairings and Roles

  *   **Total Participants:** 18.
  *   **Structure:** 9 Fixed Pairs for the duration of the workshop. (Changing pairs introduces social friction that distracts from the epistemic mechanic).
  *   **Roles:** Symmetric. Both players are "Agents."
  *   **Facilitator Role:** Keeper of the Truth ($T$), Keeper of the Oracle (the 70% accuracy list), and Timekeeper. Do not intervene in discussions unless rules are broken.

  ---

  ## 3. Minute-by-Minute Timeline (90 Minutes)

  ### 00:00 – 00:10 | Introduction & Mechanics
  *   Hand out envelopes (sealed).
  *   Explain the scoring rule: "You want to be close to the truth. You want to be calibrated. You do not want to argue for the sake of winning; the math punishes overconfidence."
  *   **Crucial Constraint:** "Do not use the words 'conciliation,' 'steadfast,' 'peer,' or 'epistemology' until the final 20 minutes. Talk about numbers, signals, and reliability."
  *   Open **Round 1 Envelopes**.

  ### 00:10 – 00:30 | Round 1: The Bare Disagreement
  *   **Setup:** Both partners receive a Signal Card and a Reliability Token.
  *   **Condition:** Both receive **Green** tokens. Both have narrow ranges. However, their ranges **do not overlap** (e.g., A gets $400 \pm 20$, B gets $500 \pm 20$).
  *   **Oracle Truth:** For 5 of the 9 pairs, *both* tokens are actually accurate (True Greens). For 4 of the 9 pairs, *one* token is a False Green (actually Red/Noisy). The participants do not know which group they are in.
  *   **Action:**
      1.  Private Estimate (2 mins).
      2.  Share Signal & Token (3 mins).
      3.  Discussion: You are both "Green." You are calibrated peers. You disagree by 100 points. (10 mins).
      4.  Final Joint Estimate (5 mins). *Note: Require a single number per pair.*
  *   **Collect:** Pair Logs. Do not reveal $T$ yet.

  ### 00:30 – 00:50 | Round 2: The Traceable (Noisy) Meta-Evidence
  *   **Setup:** New Target $T$. New Envelopes.
  *   **Condition:** Asymmetric Information.
      *   **Player A:** Gets Signal + Green Token.
      *   **Player B:** Gets Signal + Red Token + **"Glitch Report."**
  *   **The Glitch Report:** A slip of paper that says: *"System Alert: Partner's Reliability Token may be corrupted. Confidence in this Alert: 70%."*
  *   **The Wrinkle:** Player B knows Player A thinks they are Green. Player B has evidence that Player A is corrupted, but that evidence is *itself* from the same noisy Oracle system.
  *   **Action:**
      1.  Private Estimate (2 mins).
      2.  Share Info. Player B shows the Glitch Report to Player A. (5 mins).
      3.  Discussion: Player A feels unjustly accused. Player B feels uncertain about their accusation. (10 mins).
      4.  Final Joint Estimate (3 mins).
  *   **Collect:** Pair Logs.

  ### 00:50 – 01:05 | Round 3: Self-Erosion (The Meta-Round)
  *   **Setup:** Return Round 1 Logs to the pairs.
  *   **Task:** Do not estimate a number. Estimate a **Weight ($W$)**.
  *   **Question:** "Looking at Round 1, what percentage weight ($0\% - 100\%$) *should* you have given your partner's initial estimate?"
      *   $50\%$ = Split the difference (Full Conciliation).
      *   $0\%$ = Ignored partner (Full Steadfastness).
      *   $100\%$ = Adopted partner's view.
  *   **The Conflict:**
      *   Player A might say: "I gave you 50%. That was right."
      *   Player B might say: "You should have given me 80% because my signal was actually better (retrospectively)." OR "You should have given me 0% because I was actually noisy."
  *   **Action:**
      1.  Private Weight Submission (2 mins).
      2.  Discussion: Argue about the *rule* you used in Round 1. (8 mins).
      3.  **Forced Convergence:** You must agree on a single "Ideal Weight" for the pair. If you cannot agree, you submit the average of your disagreement, but incur a 200-point penalty. (5 mins).
  *   **Collect:** Logs.

  ### 01:05 – 01:25 | The Reveal & Debrief
  *   **Reveal Truths:** Announce $T$ for Rounds 1 & 2. Announce the *Actual* Reliability status (who was truly Green/Red).
  *   **Leaderboard:** Tally points.
  *   **Guided Discussion (The "Map"):**
      *   **Ask Round 1 Group:** "Who split the difference? Who held firm? Why?" (Expect: Most split the difference).
      *   **Ask Round 2 Group:** "Player B, did you discount Player A? Player A, did you feel dismissed?" (Expect: High friction. Player B hesitated because the Glitch Report was noisy. Player A felt the 'trace' was an attack).
      *   **Ask Round 3 Group:** "Did agreeing on the 'Ideal Weight' feel harder than agreeing on the number?" (Expect: Yes. This is the self-erosion point).
      *   **The Pivot:** "In Round 1, you treated each other as peers. In Round 2, one of you had a 'trace' of error. Did that stop it from being peer disagreement? Or did the noise on the trace make it peer disagreement again?"
      *   **The Trap:** "If you are a Conciliationist, and your partner in Round 3 says 'Conciliation is wrong,' and you treat them as a peer... do you have to conciliate on your conciliation? Did anyone feel that loop?"

  ### 01:25 – 01:30 | Closing & Scoring
  *   Final point tally.
  *   Dismissal.

  ---

  ## 4. Predicted Failure Modes

  1.  **The "Oracle as Data" Collapse:**
      *   *Prediction:* A participant treats the Reliability Token (Green/Red) as just another number to average, rather than a weight on the variance. They might say, "I'm Green, you're Red, so I'll take 70% of my number and 30% of yours."
      *   *Result:* This is actually rational behavior, but it bypasses the emotional tension of *trusting* the peer.
      *   *Mitigation:* In the debrief, highlight that the Oracle wasn't data about $T$, it was data about *them*. If they treated it as data about $T$, they missed the meta-cognitive layer.

  2.  **The "Politeness" Equilibrium:**
      *   *Prediction:* Pairs split the difference in Round 1 not because of epistemic humility, but to avoid conflict in a 10-minute discussion.
      *   *Result:* The "Bare Disagreement" feels resolved too easily.
      *   *Mitigation:* The scoring rule punishes inaccuracy. If one person knows they are calibrated and the other is known to be sloppy, splitting the difference loses points. Remind them: "Points matter more than harmony."

  3.  **The Round 3 Stalemate:**
      *   *Prediction:* Pairs cannot agree on the "Ideal Weight" and take the penalty.
      *   *Result:* This is actually a *feature*, not a bug. It demonstrates the intractability of higher-order disagreement.
      *   *Mitigation:* In the debrief, celebrate the stalemate. "You just experienced why higher-order conciliation is theoretically unstable."

  4.  **The "Facilitator God" Problem:**
      *   *Prediction:* Participants look to you to resolve Round 2 disputes ("Tell us who is actually noisy!").
      *   *Result:* Breaks the simulation of epistemic isolation.
      *   *Mitigation:* Strict rule: "I will not answer questions about specific pair status until the final reveal."

  ---

  ## 5. Limitations of the Simulation

  Be frank with yourself (and the group, if asked) about what this game *cannot* do:

  1.  **Stipulated Peerhood:** In the game, I (the facilitator) tell you "You are calibrated peers." In the real world, determining if someone is a peer is the hardest part of the problem. The game solves the identification problem by fiat, which removes the circularity worry that plagues real-world conciliationism.
  2.  **Known Probabilities:** The Noise Oracle is exactly 70% reliable. In reality, we rarely know the reliability of our meta-evidence with such precision. This makes the Bayesian calculation possible in the game, whereas in life, "vagueness" often drives steadfastness.
  3.  **Low Stakes:** No one loses money or reputation. Steadfastness often emerges from identity protection or career risk, which this game abstracts away. The "pull" you feel is purely intellectual, not visceral.
  4.  **The "Trace" is Artificial:** In Round 2, the "Glitch Report" is a card. In reality, spotting a reasoning error in a peer is interpretive. You might think you see a flaw where there is none. The game makes the flaw objective (a card says so), which makes the "Traceable" case easier to resolve than it would be in reality.

  ---

  ## 6. Closing Note: Settled vs. Contested

  *Use this section to ensure you do not present one side of the philosophical debate as settled fact.*

  **What is Generally Settled:**
  *   **Calibration Matters:** Everyone agrees that if you know you are poorly calibrated (e.g., overconfident), you should adjust. The dispute is about what to do when you *think* you are calibrated.
  *   **Information Aggregation:** Everyone agrees that if two people have *different* private evidence, they should share it and update. The dispute arises when they have shared their evidence and *still* disagree (the "residual disagreement").
  *   **The Ideal:** Everyone agrees that a perfect Bayesian agent with common priors and common knowledge of posteriors cannot agree to disagree (Aumann's Agreement Theorem). The debate is about how non-ideal agents (us) should approximate this.

  **What is Contested (And Where This Workshop Takes a Stance):**
  *   **Peer Identification:** The game assumes you know who your peer is. In the literature, it is contested whether you can identify a peer without already assuming your own view is correct (circularity). If you think they are wrong, you likely won't view them as a peer. The game bypasses this by assigning peer status externally.
  *   **The "Self-Erosion" / Higher-Order Problem:** The game forces you to apply your rule to itself in Round 3.
      *   *Contested View A (Conciliationism):* If a peer disagrees with your conciliationist principle, you must conciliate on the principle, potentially undermining it. Some argue this is a fatal bug (it leads to skepticism).
      *   *Contested View B (Steadfast/Permissivism):* It is rational to hold firm on fundamental epistemic principles even against peer disagreement. Some argue this is the only way to avoid self-erosion.
      *   *Design Note:* This workshop design *presupposes* that higher-order disagreement is possible and tractable enough to score. It leans into the "Self-Erosion" worry as a feature to be experienced, rather than a paradox to be solved. Do not tell participants there is a correct answer to Round 3; the tension *is* the lesson.
  *   **Total Evidence vs. Fixed Weight:** The game encourages looking at the "Total Evidence" (the Glitch Report). Some theories say you should just split the difference (Fixed Weight) regardless of new meta-evidence. This workshop pushes the "Total Evidence" view by making the meta-evidence noisy but actionable.

  **Facilitator Script for the End:**
  *"You felt a tension in Round 3 that you didn't feel in Round 1. In Round 1, you disagreed about a number. In Round 3, you disagreed about how to disagree. Some of you wanted to apply the same rule (split the difference) to the rule itself. Others felt that would destroy the rule. There is no consensus in the literature on whether that self-application is required or forbidden. You have just enacted the central unresolved problem of the field."*
