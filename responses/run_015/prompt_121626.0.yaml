answer: |-
  **Setting:** *A quiet corner of a university library, shortly after a grand rounds presentation on bio-engineered cardiac tissues. Two philosophers of biology, Elena (defending the Etiological/Selected-Effect account) and Carlos (defending the Causal-Role account), are reviewing a case file regarding a patient with a de novo engineered ventricular patch.*

  **Elena:** The clinical team's report is confident, perhaps too confident. They state the patch's *function* is to restore synchronized contraction. But looking at the ontology of this tissue, that attribution is category mistake. This patch is *de novo*. It was differentiated from induced pluripotent stem cells in a bioreactor. It has no ancestors. It has no selection history. In the tradition of Wright and Millikan, biological function is essentially historical. To have a function is to be there *because* it did that thing in the past. Since this tissue never existed before, nothing selected it for contraction. It has effects, certainly, but no proper functions.

  **Carlos:** You're drawing the circle too tightly, Elena. If we adopt your etiological criteria, we render a vast swath of modern medicine conceptually unintelligible. This patch is integrated into the ventricular wall. It receives electrochemical signals and exerts force. In a Cummins-style analysis, we look at the capacity of the containing system—the heart. The heart's capacity is to pump blood. We analyze how the parts contribute to that capacity. The patch contributes contractile force. Therefore, within the analytical framework of the system's organization, its function is contraction. To deny this because it lacks a phylogenetic backstory is to privilege history over current organizational reality.

  **Elena:** But that is precisely where the causal-role account overgenerates, Carlos. If function is merely "current causal contribution to a system capacity," you lose the distinction between function and mere effect. Consider a pathological scar tissue that forms after an infarction. It stiffens the ventricular wall. In some specific pressure regimes, that stiffening might contribute to the system's capacity to maintain shape under load. Would you tell the patient the scar's *function* is structural support? Or consider a tumor. It consumes resources and alters pressure dynamics. It has causal roles. But we rightly say it is *malfunctional* or parasitic. If function is just causal contribution, the tumor has a function. Your account cannot distinguish between a part doing what it is *supposed* to do and a part merely doing what it *does*.

  **Carlos:** I concede that Cummins-style functions are normative only relative to a specific explanatory schema, not absolutely normative in the way you desire. However, your etiological account creates an arbitrary exclusion problem. We are entering an era of synthetic biology. If I build a synthetic heart valve, or engineer this ventricular patch, and it fails to contract, the engineers say it is "malfunctioning." They are not speaking metaphorically. If you insist that only evolutionarily selected traits have functions, then engineered biological entities can never malfunction; they can only fail to meet human expectations. This severs the link between function and troubleshooting. For the clinician, the patch *is* a part of the heart's machinery. If it desynchronizes, the system fails. Your historical requirement makes the concept of function useless for the very technologies keeping patients alive.

  **Elena:** I understand the pragmatic pressure, but we must not confuse *design function* with *biological function*. When an engineer says a valve is malfunctioning, they are referencing the *designer's intent*, which is a proxy for selection. The valve was made *in order to* regulate flow. But in your causal-role account, the normativity comes from the system's current capacity, not the intent. If the tumor contributes to the system's capacity to "exist as a mass," does it function? The etiological account preserves the "ought." The patch *ought* to contract because it was designed (by humans) to replicate a trait that was naturally selected. But strictly speaking, as a biological entity, it has no "proper function" yet. It is an artifact implanted in a organism. The normative expectation—that it *ought* to contract—is borrowed from the native myocardium's history, not the patch's own.

  **Carlos:** But that borrowing is sufficient to ground the normativity in a clinical context. You argue that without selection history, "malfunction" collapses into "statistical deviation." I argue that "malfunction" is simply the failure to contribute to the analyzed capacity of the containing system. The containing system here is the *patient's circulatory system*. The capacity we are explaining is *survival via hemodynamic stability*. The patch was integrated to contribute to that. When it desynchronizes, it ceases to contribute and begins to detract (causing arrhythmia). That is a functional failure relative to the system's organization. You worry about the tumor. But we distinguish the tumor from the patch not by history, but by *organizational context*. The patch is integrated into the conduction pathway; the tumor is not. The causal-role account allows us to say the patch functions and the tumor does not, based on their integration into the specific capacity we are analyzing.

  **Elena:** The integration argument is clever, but it remains descriptive. It tells us what is happening, not what *should* happen. If the patch desynchronizes, on your view, we simply say, "It is no longer contributing to pumping." On my view, we can say, "It is failing to perform its function." The latter carries a teleological weight that justifies intervention. We remove the tumor because it lacks a proper function in the host. We repair the patch because it has a derived proper function from its designers. But you want to say the patch *itself* has the function. I worry that by flattening the distinction between selected traits and causal contributions, you lose the ability to say why the native tissue's desynchronization is a *disease* while the patch's desynchronization is a *defect*. They become the same category: system failure.

  **Carlos:** And I worry that by insisting on selection history, you force us to say that the first organism to ever evolve a heart had no function for its heart until the second generation appeared. That seems absurd. Function emerges with the organization, not just with the replication. Regarding your patient: if we adopt my view, their expectation is robust. The tissue is part of the system; its role is defined by that system. If we adopt yours, their expectation is merely psychological—they *hope* it contracts, but biologically, it is under no obligation to do so. Which view better serves the patient's understanding of their own body?

  ***

  ### Conclusion: The Status of Normative Expectation

  The dialogue highlights a fundamental tension in how we ground the "ought" in biological systems. To answer your specific concern: **Does your normative expectation collapse without an evolutionary backstory?**

  **1. The Etiological Verdict (Elena's View):**
  Strictly speaking, under a Millikan/Wright account, your normative expectation is **ontologically deficient but pragmatically salvageable**.
  *   **The Deficit:** Because the patch has no selection history, it possesses no "proper function." Therefore, biologically speaking, it is not *supposed* to do anything. If it desynchronizes, it is not "malfunctioning" in the biological sense; it is merely behaving according to its physical properties in a way that conflicts with your survival.
  *   **The Salvage:** The normativity is transferred from the **designers**. The patch is an artifact. Just as a pacemaker has a function derived from human intent, your patch has a "derived proper function." Your expectation that it *ought* to contract is defensible, but it is a *technological* normativity imposed on a biological substrate, not an intrinsic *biological* normativity.

  **2. The Causal-Role Verdict (Carlos's View):**
  Under a Cummins account, your normative expectation is **fully defensible without evolution**.
  *   **The Defense:** Function is defined by the contribution to the containing system's capacity. You and the patch now constitute a new system. The capacity of this system is circulation. The patch's role is defined by its integration into that system.
  *   **The Norm:** "Malfunction" is defined as the failure to contribute to the systemic capacity. Desynchronization is a malfunction because it negates the capacity (pumping) the part is analyzed as supporting. The "ought" is relative to the system's organizational goals (homeostasis/survival), which exist independently of evolutionary history.

  **Final Delineation:**
  Your normative expectation does **not collapse**, but its foundation shifts depending on the account you accept.
  *   If you require **intrinsic biological normativity** (the tissue *itself* has a purpose), the etiological account suggests this is absent; you are hosting a sophisticated tool, not a new organ. Desynchronization is a tool failure.
  *   If you accept **systemic/organizational normativity**, the causal-role account validates your expectation. The patch is functionally real because it is organizationally real. Desynchronization is a genuine biological malfunction of the *composite* organism.

  For clinical and personal purposes, the **Causal-Role account** offers a more robust framework. It validates the reality of the repair without requiring you to wait generations for the tissue to acquire an evolutionary history. Your expectation that the tissue *ought* to contract is defensible as a normative claim about the **integrity of the composite system**, even if the tissue lacks an independent evolutionary lineage.
