answer: |-
  This is a remarkably sharp observation. You have identified a curatorial decision that encodes a specific, and highly contested, meta-ethical stance without explicitly arguing for it. The layout you describe isn't just a logistical separation of topics; it is a philosophical argument made through architecture and placards.

  Here is a reconstruction of the implicit theory behind that layout, an analysis of its philosophical commitments, and an evaluation of whether Darwin's worry necessitates a change in presentation.

  ### 1. Reconstructing the Implicit Theory
  The museum's layout presupposes a specific solution to the **Is-Ought problem** and the **Genetic Fallacy**.

  **A. The Genetic Fallacy as a Shield**
  The primary philosophical commitment here is that *genealogy does not determine validity*. By placing the evolutionary origin of morality in one wing and leaving the "bindingness" of morality unaddressed (or implicitly outsourced to the visitor's own intuition), the museum assumes that explaining *why* we have moral instincts (survival, kin selection) tells us nothing about whether those instincts are *correct*.
  *   **Commitment:** Moral epistemology is independent of moral ontology. We can know the history of a belief without knowing its truth value.

  **B. Methodological Naturalism + Moral Realism (Quietist Version)**
  The exhibit treats morality as a natural phenomenon (feelings, behaviors, neural pathways) but implicitly assumes visitors still feel moral obligations as objective.
  *   **Commitment:** It adopts a **Quietist Realism**. It assumes moral obligations are real enough to function socially, but science cannot touch their "authority." It treats the *authority* of morality as a brute fact that doesn't need a foundation, or at least not a scientific one.
  *   **The Religion Wing:** By framing religion as a "byproduct" or "spandrel" separate from ethics, the museum commits to **Secular Autonomy of Ethics**. It assumes morality does not *need* religion to be binding. This rules out Divine Command Theory or Natural Law Theory as explanatory frameworks for the *source* of obligation, relegating them to the status of cultural artifacts.

  **C. The "Darwinian Dilemma" Sidestep**
  Darwin worried that if morality is just an adaptive trait, it loses its "sublime" authority. The museum resolves this tension by **compartmentalization**.
  *   **Implicit Theory:** Science explains the *mechanism* (the hardware); Philosophy/Culture explains the *software* (the meaning). They assume Darwin's worry was a category error: he was worried that a biological explanation would undermine a metaphysical claim. The museum assumes these are separate domains that don't interact.

  ### 2. Is the Practice Philosophically Underdetermined?
  You asked if several rival theories could license this separation, or if it strictly rules out views where morality and religion are intertwined.

  **It is Underdetermined regarding Secular Meta-Ethics:**
  The layout is compatible with several secular views:
  *   **Non-Naturalist Realism (e.g., Parfit):** Moral truths exist independently; evolution just gave us the capacity to see them. The separation works because science studies the capacity, not the truths.
  *   **Constructivism/Expressivism:** Morality is something we make. Evolution gave us the social instincts to build it. The separation works because science studies the instincts, philosophy studies the construction.
  *   **Error Theory (e.g., Mackie):** Moral claims are all false, but we believe them due to evolution. The separation works because science explains the *illusion*, while the museum doesn't need to validate the illusion.

  **It is Determined against Theistic/Robust Naturalist Ethics:**
  The layout *strictly rules out* views where the *source* of moral authority is intertwined with the *origin* of the species in a teleological way.
  *   **Divine Command / Theistic Evolution:** If moral obligation comes from God, and God guided evolution, then the "Evolutionary Origins" wing and the "Religion" wing *must* talk to each other. Separating them implies that the religious narrative adds nothing to the moral authority.
  *   **Aristotelian Natural Law:** If morality is grounded in human *telos* (purpose), and evolution explains human nature, then the evolutionary account is directly relevant to moral validity. The separation denies this link.

  **Verdict:** The layout is not neutral. It privileges **Modern Secular Liberalism**, which requires morality to be freestanding (accessible to all regardless of religious belief) and science to be value-free. It structurally enforces the idea that religion is a private preference, while morality is a public, biological necessity.

  ### 3. Darwin's Worry and the Normative Gap
  Darwin's worry was essentially an early version of the modern **Evolutionary Debunking Argument (EDA)**. The argument runs: *If our moral beliefs are shaped by evolutionary pressures for survival rather than truth-tracking, we have no reason to trust them as objectively true.*

  If Darwin was right—that explaining morality through natural selection *does* weaken its sense of absolute obligation—then the museum's current layout is intellectually dishonest. It presents the "how" while silently relying on the "ought" without explaining where the "ought" comes from if not from God or Objective Truth.

  **What would have to change?**
  If the museum wanted to be philosophically rigorous in light of Darwin's worry, they would have two options:

  **Option A: Integrate the Wings (The "Conflict" Model)**
  They would need to explicitly display the tension.
  *   *Exhibit Text:* "Evolution explains why we *feel* obligation. It does not explain why we *should* obey it. Some argue this undermines moral objectivity; others argue moral truths exist independently of their biological detection."
  *   *Religion Wing:* "Religious traditions have historically provided the metaphysical grounding for moral authority that evolutionary biology does not supply."
  *   *Result:* This turns the museum into a forum for philosophical debate rather than a temple of scientific consensus. It risks confusing visitors but honors the complexity.

  **Option B: Epistemic Honesty (The "Gap" Model)**
  Keep the wings separate but admit the gap.
  *   *Exhibit Text:* "This exhibit explains the biological origins of moral *sentiments*. Whether these sentiments correspond to objective moral *truths* is a philosophical question outside the scope of natural history."
  *   *Result:* This preserves the separation but removes the implicit claim that science has "solved" morality. It admits that the "bindingness" Darwin worried about is not a scientific finding.

  ### 4. Conclusion: The Cost of the Curatorial Choice
  The museum's layout assumes that **normative authority is self-justifying** or irrelevant to the scientific project. It assumes Darwin's tension was a personal hangup, not a structural problem in naturalistic ethics.

  By keeping the wings apart, they are making a bet: they are betting on **Moral Realism** (that morals are real) without wanting to pay for the **Metaphysical Foundation** (God, Platonic Forms, or Non-Natural Properties) that usually supports it. They want the "sublime" feeling of morality (which Darwin valued) without the "supernatural" or "non-natural" cost.

  If Darwin's worry is legit, the museum is currently selling a product it cannot manufacture. It is selling **moral knowledge** (the exhibit implies we now "know" about morality) while only providing **moral genealogy**. To fix this, they don't necessarily need to integrate the wings, but they must explicitly acknowledge that **explaining the origin of a belief is not the same as justifying the belief.** Until they do that, the layout remains a silent endorsement of a specific, controversial philosophical naturalism that claims to be mere description.
