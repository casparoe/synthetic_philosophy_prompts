answer: |-
  **Sorting my cases**

  Your ten cases split into three ontological clusters. First, **Structural Claims** (1, 9): these describe institutional outputs or systemic relationships, not inner lives. Second, **Behavioral Norms** (3, 5, 8): these describe enforceable social expectations or coordinated practices, like punctuality or social distance. Third, **Dispositional Generics** (2, 4, 6, 10): these attribute psychological capacities or moral deficits to the person rather than the system. The load-bearing distinction is not truth, but *locus*. When you accept (1) but reject (2), you are rejecting the migration of a statistic into a generic essence. When you accept (3) but reject (4), you are distinguishing between *doing* (norms) and *being* (character). The context cases (6, 7) reveal that the pragmatic force—whether the claim functions to explain a system or exclude an agent—is decisive. Your friend sees only truth conditions; you are sensing ontology and power.

  **Candidate principles**

  1.  **The Accuracy Principle:** Claims are valid if statistically supported. *Kill:* Fails case (2); accuracy doesn't neutralize essentialism or explain why generics feel different from data.
  2.  **The Harm Principle:** Claims are valid unless used to injure. *Kill:* Fails case (4); self-deprecation doesn't erase the ontological error of attributing lack of capacity, and harm is often downstream.
  3.  **The Insider Principle:** Claims are valid only if uttered by members. *Kill:* Fails case (9); structural analysis by outsiders is valid, while internal essentialism (4) is not.
  4.  **The Institutional Norm Principle (Survivor):**
      *   **Clause A:** Predicates must refer to observable behavioral regularities sustained by institutions, not intrinsic psychological dispositions. This motivates accepting (3) punctuality (a norm) while rejecting (4) humour (a capacity).
      *   **Clause B:** The subject group must be framed as participants in a social system, not instances of a natural kind. This motivates accepting (1) survey data (population) while rejecting (2) generic essence (nature).
      *   **Clause C:** The utterance must not function to restrict the subject's access to social goods. This motivates rejecting (6) hiring bias while accepting (7) negotiation planning (coordination).

      This survives because it captures why (1) works (institutional data), (3) works (normative practice), and (6) fails (exclusionary disposition). It treats national groups as *social kinds* created by rules, not biological kinds created by genes. A claim like "Swedes are trusting" fails Clause A because trust is a psychological state, whereas "Swedish institutions generate high trust scores" passes. "Swiss are punctual" passes Clause A because punctuality is a coordinated behavior. "Germans have no humour" fails Clause A (capacity) and C (stigma). Your friend's error is category confusion: he treats social kinds as natural kinds.

  **The pair that breaks it**

  The split between (1) and (2) is the difference between a *statistical generalization* and a *generic*. Statistics describe populations; generics imply essence. "Swedes are trusting" invites the inference that a specific Swede is trusting by nature, whereas the survey data invites the inference that the environment produces trust. Saving both requires admitting that national character claims are almost always category mistakes. The cost is high: you must concede that most "character" talk is literally false ontology.

  The split between (3) and (4) hinges on *capacity vs. norm*. Punctuality is a rule everyone can follow; humour is treated as a talent someone might lack. If you save both, you must argue that "humour" is also a norm (e.g., specific styles of joking). But this stretches the concept. The cleaner cut is to admit (4) is always ontologically suspect because it denies a universal human capacity, whereas (3) describes a local coordination solution. Your friend loses here: self-ascription doesn't fix bad ontology. You cannot joke yourself into a biological kind. The principle saves your intuition by showing that (3) is about compliance, while (4) is about constitution.

  **New cases**

  1.  **Tourism Ad:** "Italians know how to live." Verdict: Permissible. It functions as an invitation to participate in a norm, not an exclusion. Fits Clause C (no denial of goods) and Clause A (lifestyle practices).
  2.  **British MP:** "British are terrible at cooking." Verdict: Permissible. Internal speaker, low stakes, self-regulation. Fits Clause C (no exclusion) and Clause B (self-defined group).
  3.  **Courts:** "Italian courts are slow." Verdict: Permissible. This is purely structural (Clause A). It is not a character claim in disguise unless you imply the judges are lazy rather than underfunded. If the predicate targets the institution, it is safe.
  4.  **Hedged Average:** "On average, Germans tend to be punctual." Verdict: Permissible. The hedge moves it from generic to statistical (Case 1). It removes the essentialist pressure.
  5.  **Invented Failure:** "The Jewish diaspora is naturally financially prudent." My principle might allow this if framed as a behavioral norm sustained by community institutions (Clause A). But intuitively, this is dangerous essentialism. The principle fails because it cannot always distinguish between *historical adaptation* and *innate propensity* when the behavior is positive. It risks licensing "positive racism" if the institutional link is vague. This is the principle's blind spot: it trusts the speaker's framing of "norm" too much when the stereotype is flattering.

  **What I have to give up**

  You must drop Case (9). "The French are cynical about institutions" sounds like a disposition (Clause A violation). To keep it, you must rephrase it as "French institutions generate cynicism." You must also tighten Case (8). Regionalism is only safe because regions lack the coercive border power of states; if "Milanesi are cold" were used to deny housing, it fails Clause C. Your friend is right that borders are arbitrary, but wrong that power is. The state's monopoly on violence makes national generics uniquely dangerous compared to regional ones.

  The sentence to say: "National groups are institutional kinds, not natural kinds, so predicates must describe rules we follow, not souls we have." This forces him to argue that nations are biological entities, which he cannot do without abandoning modern social science. You win the ontology; he keeps the statistics.
