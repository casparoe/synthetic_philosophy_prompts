  Artist Elena publishes source code for a generative piece. She compiles it, producing binary A. Later, the Museum compiles the identical code independently, producing binary B. The build is deterministic; A and B are bit-identical. Both sit side-by-side. Elena is dead; her will mentions the work but not provenance. No contract distinguishes them. H asks which object flows from Elena's specific creative agency. P asks which object conforms to the work's defining specification. Both files are equally stable and visible. The question remains: is A the unique original because Elena executed it, or are both equally genuine because both match the code?

  1. For each account, state the verdict: which object is the original, what the other object is on that account (a fake, a copy, a second instance, something else), the one or two premises that generate the verdict, and in a single sentence what the account implies about whether a fully informed buyer who knew all the facts would be making a mistake to pay more for the one you called the original.

  On the Historical account (H), A is the original and B is a replica, because authenticity requires a causal chain linking the artifact to the artist's specific generative act, which B lacks. A fully informed buyer would not be making a mistake to pay more for A, as they are purchasing a unique historical connection. On the Procedural account (P), both A and B are original instances, because the work is defined by its specification and any correct execution satisfies the identity conditions equally. A fully informed buyer would be making a mistake to pay more for A, as there is no ontological difference between the two instances to justify a premium.

  2. Name the single feature of the case that does the separating work, show what happens to the case if that feature is removed, and argue for it rather than deferring to me. My own guess is that it is something about determinism plus the fact that digital objects are identified by their content rather than by their matter, but I would rather be corrected than agreed with.

  The separating feature is the combination of content identity with causal independence. If the builds were non-deterministic, B would not match A, and P would deny B is an instance, collapsing the disagreement. If B were causally dependent on A (copied bits), H would classify B as a copy, but P might still call it an instance, yet the intuitive force of "running the program again" would be lost. The tension exists specifically because the content is identical (satisfying P) while the genesis is distinct (satisfying H's requirement for uniqueness). It is not merely determinism, but the normative weight placed on that determinism: H treats it as irrelevant to provenance, while P treats it as constitutive of the work.

  3. Give me the best attack on the case from whichever account comes out looking worse — not a strawman, the objection you would actually raise if you held that view.

  The strongest attack comes from the Historical account against the Procedural verdict. If any bit-identical execution is an original instance, then a malicious actor who compiles the code without authorization produces an "original" work of art. This severs the concept of art from human agency and authority, reducing the work to mere data patterns. If a pirate build is ontologically equal to the artist's build, the concept of "work" loses its connection to the creator, making the category of art indistinguishable from any other digital file generation.

  4. Tell me plainly if you think the two accounts do not really come apart here. If the honest answer is that H and P agree once they are stated carefully, say so and explain why, instead of manufacturing a divergence.

  The accounts do come apart on ontology, though they might converge on market value if history influences price regardless of ontology. I am most likely wrong in assuming H denies B the status of an "instance" of the work; H might concede B is an instance but not the "original artifact." If H admits that for digital works the artifact just is the instance, then H collapses into P, and the case fails to separate them. I would switch to viewing them as agreed if historical proponents accepted that causal history is irrelevant to the identity of digital objects, reserving it only for valuation.

  \answer{H: A ; P: A and B ; SEPARATES: yes}
