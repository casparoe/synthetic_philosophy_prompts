answer: |-
  # Q&A Prep Sheet: Unified Conditionals Thesis

  **Audience Profile:** 6 Possible-Worlds Semanticists (Stalnaker-Lewis tradition), 2 Probabilists (Adams/Edgington tradition).
  **Your Thesis:** Unified semantics. Mood (indicative vs. counterfactual) marks speaker epistemic stance (live vs. false antecedent), not distinct truth conditions.

  ---

  ### 1. The "Oswald/Kennedy" Divergence (High Damage)
  **Who:** A Senior Semanticist (Stalnaker fan).
  **The Objection:** "Consider the classic pair: (1) 'If Oswald didn't kill Kennedy, someone else did' (Indicative, True) and (2) 'If Oswald hadn't killed Kennedy, someone else would have' (Counterfactual, False). The facts of the world are fixed. On your view, the semantic content is identical. So why do they have different truth values? If the difference is merely the speaker's expectation about the antecedent, that shouldn't flip the truth value of the conditional itself."

  *   **Concede:** You must concede that the truth values differ in the actual world. Do not try to argue they are the same.
  *   **Hold:** Hold that the *semantic machinery* evaluating them is the same; what changes is the **domain of quantification** (the context set) triggered by the mood.
  *   **The Reply (2 mins):**
      > "That's the crucial test case, and I agree the truth values diverge. But I deny that divergence requires two *semantics*. On my view, the indicative restricts evaluation to worlds compatible with our *actual* knowledge (where we know Kennedy was killed). The counterfactual mood acts as a presupposition trigger that forces us to excise the actual world from the context set and evaluate in the closest worlds where the antecedent holds.
      >
      > The semantic engine—say, a selection function—is identical. But the indicative selects from the 'epistemically live' set, while the counterfactual selects from a 'metaphysically close but epistemically excluded' set. The truth value changes because the *domain* changes, not because the *conditional operator* changes. The mood is just the instruction manual for which domain to use."

  ### 2. Sobel Sequences & Context Dynamics (High Damage)
  **Who:** A Dynamic Semanticist.
  **The Objection:** "Sobel sequences show that counterfactuals are dynamically sensitive in a way indicatives aren't. 'If A had come, it would have been fun. If A and B had come, it wouldn't have been.' You can't reverse that order. If your view is unified, why do counterfactuals exhibit strict monotonicity failure that indicatives don't? A pragmatic marker shouldn't affect logical entailment patterns."

  *   **Concede:** Concede that counterfactuals are more sensitive to antecedent strengthening than indicatives.
  *   **Hold:** Hold that this is a result of the *presupposition of falsity*, not the conditional itself.
  *   **The Reply (2 mins):**
      > "I agree the entailment patterns differ, but I attribute this to the cost of maintaining the counterfactual presupposition. When you say 'If A had come,' you're asking us to entertain a world we think is false. When you add 'and B,' you're asking us to move *further* from the actual world.
      >
      > With indicatives, we stay within the live epistemic possibilities, so adding information just narrows the set. With counterfactuals, adding information requires re-ranking the similarity metric to accommodate the new, more complex falsehood. The logic looks different because the *context update rules* for false antecedents are stricter than for live ones. The conditional itself remains invariant; the context management is what's doing the heavy lifting."

  ### 3. The "Zero Probability" Problem (Medium Damage)
  **Who:** A Probabilist.
  **The Objection:** "I work on $P(Q|P)$. If the antecedent $P$ is known to be false, as you claim counterfactuals require, then $P(P) = 0$. In standard probability theory, $P(Q|P)$ is undefined. Yet counterfactuals are meaningful and often highly probable. If there's just one conditional, how do you avoid the math breaking down when the speaker assumes the antecedent is false?"

  *   **Concede:** Concede that standard Kolmogorov probability breaks for known falsehoods.
  *   **Hold:** Hold that natural language conditionals track *epistemic* conditional probability, which allows for subjunctive supposition.
  *   **The Reply (2 mins):**
      > "You're right that standard conditional probability is undefined for probability-zero antecedents. But that's precisely why we need a unified semantics that isn't tied to simple material implication or standard conditioning.
      >
      > My claim is that the 'counterfactual' marker signals a shift in the *suppositional context*. We aren't conditioning on $P$ in the actual probability space; we are temporarily constructing a new probability space where $P$ is true. The semantics of the conditional is the same—it asks for the probability of $Q$ in the $P$-worlds. The mood just tells us whether we draw those $P$-worlds from our current belief set (indicative) or a revised, hypothetical belief set (counterfactual). The math holds if you treat the context set as dynamic."

  ### 4. The "Fake Past" Morphology (Medium Damage)
  **Who:** A Formal Semanticist (Syntax-Semantics interface).
  **The Objection:** "Counterfactuals cross-linguistically use past tense morphology ('If it *rained*') without past time reference. If the difference is purely pragmatic expectation, why is this encoded so rigidly in the syntax? Usually, pragmatic distinctions don't mandate specific tense morphology. Doesn't this suggest a semantic tense operator is involved?"

  *   **Concede:** Concede that the morphology is robust and cross-linguistic.
  *   **Hold:** Hold that morphology often grammaticalizes pragmatic distinctions (e.g., evidentials).
  *   **The Reply (2 mins):**
      > "It is striking that 'remoteness' in time maps to 'remoteness' from reality. But we see this elsewhere: epistemic modals often take past tense forms to indicate uncertainty. I argue this is a case of pragmatic enrichment becoming grammaticalized.
      >
      > The past tense doesn't contribute semantic truth conditions about time; it contributes a presupposition about *epistemic distance*. It's a conventionalized marker of the speaker's stance, much like an evidential particle. Just because it's syntactic doesn't mean it's semantic in the truth-conditional sense. It's a hard-wired instruction to the hearer to shift the context set, not to evaluate the proposition at a past time."

  ---

  ### The Nightmare Question (Most Embarrassing)
  **Who:** Anyone (but likely the most quiet person in the room).
  **The Question:** **"If the difference is purely pragmatic, then 'If P then Q' and 'If P then would Q' should not be able to embed differently under attitude verbs. But they do. I can say 'John believes that if it rained, the streets are wet' vs 'John believes that if it rained, the streets would be wet.' If 'would' is just a pragmatic marker of speaker expectation, why can it fall under the scope of John's belief? Does John believe the pragmatics?"**

  *   **Why it's fatal:** Pragmatic markers (like "frankly" or "unfortunately") generally do not embed under propositional attitude verbs. If "would" embeds, it looks like a semantic operator. If you can't explain this, your "pragmatic only" claim collapses.
  *   **Preparation:**
      *   *Do not* say "That's a good question, I haven't thought about embedding."
      *   *Do* argue that attitude verbs shift the *context* for the embedded clause.
      *   *Reply Strategy:* "When embedded under 'believes', the speaker's expectation is replaced by the subject's expectation. 'Would' still signals 'antecedent is false relative to the belief world.' It's still a context-shifter, just shifted by 'believes' rather than the speech act."

  ---

  ### General Advice for the Room
  1.  **Don't fight the Possible Worlds:** You don't need to deny possible worlds to deny two semantics. Use their machinery (selection functions, context sets) but argue that *one* function serves both moods.
  2.  **Respect the Probabilists:** They are the minority (2 vs 6), but they are the ones most likely to agree with you (since Adams also minimized truth conditions). Use them as allies against the "hard" semanticists.
  3.  **Key Phrase:** "Context Set Management." Whenever they press on truth conditions, pivot to how the *context* is being managed. It sounds technical enough for the semanticists but preserves your pragmatic thesis.
