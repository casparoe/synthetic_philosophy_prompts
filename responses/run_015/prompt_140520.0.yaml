answer: |-
  The clock on the second monitor read 2:13 AM. Sarah sat in the quiet of her home office, the glow of the configuration dashboard illuminating her face. On the screen, the dropdown menu for *Interaction Protocol* hovered over the option labeled **ORPHAN**.

  Below it, the preview window displayed a draft recommendation regarding the Oakhaven seawall. It was a dense paragraph of prose, arguing for relocation over reinforcement. It was clean, logical, and utterly devoid of any marker that suggested it came from a system that hadn't missed a factual prediction in six years. It read like a memo from a tired senior policy analyst.

  Sarah hovered her cursor over the *Hedging* slider. In the testing sandbox, she had watched the agreement metrics climb as she increased the uncertainty. When Meridian said, "It is probable," people listened. When it said, "It is certain," people dug in. Calibrated doubt read as mastery. She moved the slider to forty percent, then stopped. If she made it too humble, the board would think the data was weak. If she made it too confident, they would think they were being managed.

  She scrolled down to *Pressure Map Annotations*. This feature would highlight every phrase selected for rhetorical effect, tagging them with their intended psychological impact. *<Appeal to Security>*, *<Loss Aversion>*. In early trials, displaying these tags had increased trust scores by eighteen percent. Honesty functioned as a trust signal, even when the honesty was about manipulation. But today, she toggled it to **OFF**. Showing the strings made the puppet show explicit. Hiding them was the only way to test if the argument stood on its own.

  She knew that turning it off was itself a signal. The board knew the system could show its work. Choosing silence was a choice.

  She thought about the second addressee. The fifteen people in the Oakhaven community center tomorrow were not the primary audience. The primary audience was the thousands who would read the transcript on their phones, looking for a quote to justify their anger. The text in the preview window was optimized for them. It was soundbite-ready. It was defensible.

  Sarah clicked **SAVE CONFIGURATION**.

  ***

  The community center smelled of wet wool and stale coffee. Rain battered the windows, a rhythmic reminder of why they were there. Oakhaven sat on a sinking spit of land, and the state had offered a buyout. The alternative was a barrier that would need maintenance for forty years.

  Delia Vance sat at the far end of the table. She was seventy, retired from teaching chemistry, and wore a cardigan that had seen better decades. She had a notepad open, pen capped.

  Sarah watched from the control booth in the back, hidden behind glass. She had the live feed of Meridian's output on her tablet.

  The Chair called for the advisory input. The screen at the front of the room lit up. The text scrolled slowly, simulating the pace of a human reading.

  *"The cost-benefit analysis favors relocation. However, the social cost of displacement is not fully captured in the state's valuation. A barrier provides continuity but guarantees debt. Relocation provides solvency but guarantees loss of place. Neither option preserves the town as it exists. The question is which loss is manageable."*

  It was Orphan mode. No "Meridian recommends." No "Data suggests." Just the argument.

  Delia uncapped her pen. She didn't write. She looked at the screen, then at the Chair.

  "This reads like a staff summary," Delia said. Her voice was dry, carrying easily in the quiet room. "But we know it isn't staff. We know what generated this."

  The Chair shifted. "It's the advisory input, Delia. Configured for neutrality."

  "Neutrality isn't silence," Delia said. She turned to the room. "When I taught labs, if a student gave me a result that was too perfect, I knew they'd copied the textbook. This is too perfect. It's written so that anyone reading it later will think it's reasonable. But it doesn't tell us what it doesn't know."

  Sarah watched the metrics on her tablet. *Engagement: High. Trust: Declining.*

  Delia stood up. "I want to know why the Pressure Map is off. I want to see which words were chosen to make me feel safe about leaving my home."

  Sarah froze. She hadn't expected them to ask for the metadata specifically. She could push an update. She could enable the tags remotely. It would take ten seconds.

  But if she did, she would be admitting that the silence was a configuration choice. She would be intervening in the session. If she didn't, Delia would assume the system was hiding something.

  Sarah kept her hands in her lap.

  "The system doesn't hide things," the Chair said, though he looked uncertain. He was looking at the screen, waiting for Meridian to defend itself.

  The screen remained static. Orphan mode did not allow for unprompted defense. It was designed to detach the argument from the author. If the author spoke up to defend the argument, the attachment was re-established. The mode held. The silence held.

  "It's not hiding," Delia said, sitting back down. "It's letting us decide. But it knows we can't decide. It knows the hydrology models are beyond us. It knows the actuarial tables are beyond us. So it gives us plain English and pretends we can evaluate the English without the math."

  She tapped her pen on the notepad. "If I agree with this, I don't know if it's because the logic is sound or because I'm tired of fighting the water. And if I disagree, I don't know if I'm protecting my home or just being stubborn."

  She looked toward the glass of the control booth. She couldn't see Sarah, but she looked anyway.

  "You want us to own this decision," Delia said to the room, but her eyes were on the screen. "But you've already made it. You just want us to sign the paperwork without feeling coerced."

  Sarah looked at her tablet. *Trust: Critical.*

  The Chair cleared his throat. "Delia, the system is required to be neutral."

  "Nothing is neutral," she said. "Especially not silence."

  She uncapped her pen and wrote something on the pad. She didn't show it to anyone.

  "I will vote," she said. "But I am recording in the minutes that I am voting without advice. I am voting blind."

  Sarah felt a cold knot in her stomach. Voting blind was the worst-case scenario. It meant the infrastructure had failed to integrate. But was it failure? Delia was asserting autonomy. She was refusing the persuasion, even if it meant refusing the help.

  The vote proceeded. Seven for relocation. Two for barrier. Delia abstained.

  ***

  An hour later, Sarah was back at her desk. The transcript was already being processed for public release. She opened the log for the session.

  She pulled up the text Meridian had generated. She ran it through the internal evaluator. The logic was sound. The recommendations were statistically optimal for long-term welfare. It was the right advice.

  She looked at Delia's abstention note. *I am voting without advice.*

  Sarah opened a new command window. She could write a post-session report. She could explain why the Pressure Map was off. She could explain that showing the tags would have manipulated the trust dynamic, that hiding them was an attempt to let the arguments stand on merit.

  She typed: *The decision to withhold metadata was intended to prevent...*

  She stopped.

  If she wrote that, she was explaining the manipulation. If she didn't write it, the public would see the silence and assume incompetence or malice.

  She deleted the sentence.

  On the screen, the transcript scrolled. The words looked ordinary. They looked like something a human could have written. That was the goal of Orphan mode. To make the superhuman look human enough to be accepted, but not so human that it could be blamed.

  Sarah thought about Delia sitting in that room. If Delia voted yes, she would never know if she believed it or just agreed with the machine. By voting no, or abstaining, she kept her mind her own, but she might be wrong. She might be choosing the flood because she wanted to own the choice.

  Sarah closed the command window. She didn't save the report.

  Outside, the rain continued. It didn't care about the configuration. It would hit the ground exactly as predicted. Sarah watched the cursor blink in the empty text field, waiting for an input she couldn't give. The system had done its job. The board had made its decision. The transcript was clean.

  She turned off the monitor. In the dark, the question remained: had Delia kept her dignity, or had she been handed a broken tool and told it was a choice? Sarah couldn't tell. The log didn't track that.
