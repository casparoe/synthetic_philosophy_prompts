      *   Which claims survive? 1 and 2 are strong. 3 is good but needs nuance (it's not that the vocabulary falls silent, but that it reveals its complicity).
      *   *Refinement:* The novel demonstrates the *political limits* of the distinction. The distinction isn't just biological; it's moral. NLGM shows that without a prior moral agreement on *who counts*, the distinction is weaponizable.

  6.  **Drafting the Response (Iterative Process):**

