      *Self-Correction on Claim 1:* Does normal-function account already separate health from good? Boorse would say yes, health is value-free. But proponents of therapy/enhancement (like Sandel or Fukuyama) often smuggle in "good." NLGM shows the danger of the value-free view. I need to be precise here.

      *Final check on the "Failure" scene:* The deferral rumor is the best candidate. It's about *exception*, not health. Trying to frame it as "enhancement of lifespan" misses the point of love/art.

