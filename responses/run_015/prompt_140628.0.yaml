          *   *Analysis:* Standard normal-function accounts (Boorse, etc.) define health statistically or functionally. They often claim to be value-free. NLGM shows that functional health can exist alongside instrumentalization. The clones are "healthy" organs, not "healthy" people in the moral sense. This challenges the idea that restoring function is inherently normative *for the subject*.
          *   *Verdict:* Strong claim. The novel exposes the moral neutrality of biological function.

      *   *Claim 2: Reference Point/Single Patient.* Therapy for the recipient = induced deficit for the donor. The distinction assumes a single patient whose good matters.
          *   *Analysis:* Bioethics usually focuses on the doctor-patient dyad. Here, there's a triad: Donor, Recipient, Medical System. The "therapy" is real for the recipient but "manufactured pathology" for the donor. This highlights that the therapy/enhancement distinction relies on a bounded moral community. If the donor isn't a "patient," the distinction collapses.
          *   *Verdict:* Strong claim. It reveals the political boundary of the "patient."

      *   *Claim 3: Completion/Death via Therapy.* A being who was never a patient dies via a therapeutic protocol. Can the vocabulary describe this?
          *   *Analysis:* Therapy aims to preserve life/function. Here, the protocol *ends* life. Calling organ harvesting "therapy" for the recipient obscures the *cost* to the donor. The vocabulary falls silent on the systemic cost.
          *   *Verdict:* Moderate/Strong. It shows the vocabulary is individualistic and cannot capture systemic sacrifice.

  3.  **Address the "Push Back" (The Nature of the Novel):**
