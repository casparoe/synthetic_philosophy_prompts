  ### Tier 1: Least Worrying (Active Stability)
  **4. Overlapping:** Running new units alongside old ones with a fade-in ensures the actual input trajectory never deviates from what the optimized units expect.
  **1. Slow Scattered:** The glacial pace allows the surrounding network to retune naturally, keeping actual inputs aligned with the units' limited counterfactual optimization.

  ### Tier 2: Moderately Worrying (Managed Discontinuity)
  **10. Revival:** Keeping the biological tissue as a silent backup mitigates catastrophic failure but does not prevent trajectory drift during the active replacement phase.
  **5. Bottom-up:** Securing vital functions first prevents physical death, though cognitive interfaces remain vulnerable to drift as the swap moves upward.
  **3. Anaesthesia:** A single hard cut avoids subjective horror but relies entirely on the post-swap state matching the pre-swap optimization without intermediate feedback.
  **7. Sleep-only:** Discontinuities are masked by unconsciousness, though repeated batch changes increase the cumulative risk of waking with misaligned trajectory predictions.

  ### Tier 3: Significantly Worrying (Local Instability)
  **2. Clustered:** Silencing a whole local circuit temporarily creates a gap in the actual input trajectory that the optimized units may not handle when reactivated.
  **6. Top-down:** Swapping experience-generators before the body-control systems risks a dissociative slide where the subject cannot verify their own continuity.

  ### Tier 4: Most Worrying (Trajectory Violation)
  **8. Fast Swap:** Swapping faster than synaptic retuning forces the network into unoptimized input states that the counterfactually-slack units cannot process.
  **9. Upgrades:** Altering the subject's functional trajectory invalidates the specific input predictions the replacement units were built to match, guaranteeing mismatch.

  ***

  ### Grain vs. Genuine Differences
  The distinction between **3 (Anaesthesia)** and **7 (Sleep)** is merely grain; both rely on masking discontinuity via unconsciousness, differing only in the duration and frequency of the blackout. Similarly, **4 (Overlap)** and **10 (Revival)** are logically redundant safety mechanisms, differing only in whether the backup is active or passive. The genuine risks lie in **1 vs. 8** (plasticity timescales) and **9** (trajectory alteration), where the physical constraints of the network and the optimization criteria are actually violated rather than just described differently.

  ### What the Ranking Tracks
  This tier list suggests that "is it still the same person" is the wrong metric; instead, you are tracking **trajectory fidelity**. Because your "counterfactual slack" constraint ties the replacement unit's validity to the *specific path* the brain travels, the metaphysical substrate matters less than whether the process keeps the brain on its predicted input curve. The ranking orders schedules by their ability to prevent the system from encountering an input state it wasn't optimized to handle, making functional continuity the primary proxy for identity.
