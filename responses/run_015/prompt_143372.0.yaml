      *   No survey? Yes.
      *   Advice on moving on? Yes.

      *(Final thought)*: I should explicitly mention the distinction between *blameworthiness* (target) and *blaming* (agent). This is often the source of confusion. The target is blameworthy regardless. The act of blaming is what's contested.

      Let's structure the response to hit these points hard.
      1. Diagnosis: It's not verbal, it's functional.
      2. The Core Distinction: Blameworthiness vs. Blaming Practice.
      3. The Decisive Case: The Anonymous Hypocrite.
      4. The Normative Category: Power vs. Permission.
      5. Dissertation Strategy.

      (Wait, one more thing): The user asked if it's an empirical question about how blame works socially. I should address that. It's not empirical (sociology), it's conceptual (what *counts* as blame). But it relies on social norms.

