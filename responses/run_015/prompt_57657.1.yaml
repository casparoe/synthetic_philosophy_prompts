  ### Handout: Readings of *De Gustibus Non Est Disputandum*

  **1. The Empirical Reading**
  *   **Formulation:** Individuals exhibit stable, divergent affective responses to identical stimuli without apparent recourse to shared reasons.
  *   **Verdict:** Trivially true.
  *   **Availability:** Fully available; framing effects merely demonstrate one mechanism producing such divergence.

  **2. The Explanatory Reading**
  *   **Formulation:** Causal or rational explanations for why specific preferences differ between agents are unavailable or unnecessary.
  *   **Verdict:** False (psychology and genealogy often explain preferences).
  *   **Availability:** Available; the difficulty of explaining framing effects does not prove explanations are impossible.

  **3. The Normative Immunity Reading**
  *   **Formulation:** Preferences are not the sort of mental states that can be rationally criticized or judged as correct/incorrect.
  *   **Verdict:** Contentious (defended by Humeans, rejected by cognitivists).
  *   **Availability:** Available; one can hold that preferences are arational even if they are susceptible to framing artifacts.

  **4. The Metaphysical Reading**
  *   **Formulation:** Values are constituted entirely by subjective attitudes rather than by mind-independent normative facts.
  *   **Verdict:** Substantive and defensible (but denies moral realism).
  *   **Availability:** Available; framing sensitivity is consistent with anti-realism, though it may undermine the stability of the attitudes constituting value.

  **5. The Psychological Equivalence Reading**
  *   **Formulation:** Moral intuitions belong to the same psychological kind as sensory or aesthetic preferences (e.g., for food or color).
  *   **Verdict:** Contentious (this is the substantive thesis of the seminar, not a premise).
  *   **Availability:** **Unavailable** as a neutral premise; asserting this rules out the possibility that intuitions track normative features by fiat.

  **6. The Pragmatic Reading (Conversational Closer)**
  *   **Formulation:** Further argument regarding this disagreement is pragmatically futile and should be terminated.
  *   **Verdict:** Contextually true (as a description of dialogue), but logically inert.
  *   **Availability:** Available as a pause, but **unavailable as a premise**; when pressed into service as an argument, it commits a pragmatic fallacy (inferring objective indeterminacy from subjective impasse).

  ***

  ### Analysis of the Colleague's Objection

  **1. The Required Reading**
  To establish that your inquiry is misguided, your colleague must rely on **Reading 5 (The Psychological Equivalence Reading)**. Readings 1–3 allow for the study of intuitions even if they are "tastes" (e.g., studying the genealogy of tastes), and Reading 6 merely suggests stopping talk, not that the talk is *philosophically* misguided. Only Reading 5 asserts that moral intuitions *are* preferences, thereby stripping them of the epistemic standing your seminar investigates.

  **2. Does It Deliver the Conclusion?**
  No, because it is question-begging. The seminar's aim is to determine *whether* moral intuitions track normative features or are mere artifacts. Asserting that they are "tastes" (Reading 5) presupposes the negative answer to that very question. It does not argue that intuitions fail to track truth; it defines them as the kind of thing that *cannot* track truth.

  **3. Covert Classificatory Work**
  Yes. The remark performs significant, unargued classificatory work. By labeling the responses "tastes," the colleague assigns them to a category (preferences) that is definitionally exempt from truth-apt assessment in his framework. This settles the seminar's central research question by linguistic fiat rather than philosophical argument.

  **4. A Restricted, Compatible Version**
  *   **Statement:** "There is no accounting for *mere* tastes."
  *   **Restriction:** The proverb applies only to attitudes already demonstrated to be devoid of cognitive content or truth-aptness.
  *   **Implication:** This preserves the inquiry by forcing the burden of proof back onto the colleague: he must demonstrate that moral intuitions are *mere* tastes (subject to framing, alienation, etc.) before the proverb can be invoked to dismiss them.
