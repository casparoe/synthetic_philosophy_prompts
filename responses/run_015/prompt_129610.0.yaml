answer: |-
  The three-way asymmetry you describe—ethical framing in visual art academia/museums, its absence in literature/music programs, and its suppression in the art market—does not map cleanly onto a single traditional theory of artistic value (such as pure Formalism or strict Ethicism). Instead, it presupposes a **Fragmented Ontology of Art** grounded in **Sphere-Specific Functionalism**.

  This view holds that "art" is not a unified category with a single mode of valuation, but a set of practices that shift their ontological status depending on the institutional sphere they occupy (educational, cultural, or economic). Below is a reconstruction of the implicit philosophical commitments required to render this asymmetry coherent, an analysis of what is strictly presupposed versus merely compatible, and an exploration of how rival theories fit or fail to fit the pattern.

  ### 1. The Theoretical Family: Contextual Moralism vs. Economic Autonomism

  The pattern presupposes a hybrid theoretical framework that toggles between **Moderate Moralism** in the public/educational sphere and **Radical Autonomism** in the market sphere.

  *   **In the Museum/Classroom (Visual Art):** The practice aligns with **Moderate Moralism** (e.g., Berys Gaut's *ethicism*). This theory posits that moral defects in an artist *can* constitute aesthetic defects, or at least are relevant to the proper appreciation of the work. The inclusion of ethical framing suggests that the *meaning* of the visual object is not self-contained but is partially constituted by the context of its production.
  *   **In the Market:** The practice aligns with **Radical Autonomism** (or Formalism). Here, aesthetic value (translated into exchange value) is treated as entirely separable from moral biography. The object is fetishized; its history of production is scrubbed to ensure fungibility.
  *   **The Literature/Music Exception:** The lack of framing here suggests a commitment to **Ontological Dualism between Media**. It implies that texts and scores are viewed as *types* (abstract structures) that can be instantiated independently of the author's body, whereas paintings are viewed as *tokens* (physical artifacts) inextricably linked to the artist's physical act.

  ### 2. Visual Art: Transparency and Moral Situatedness

  Does the museum practice presuppose that visual art is uniquely transparent to the creator's character? **Strictly speaking, no.** It is compatible with that view, but it does not require it.

  *   **Strict Presupposition:** The museum presupposes that the **encounter is morally situated.** It assumes the viewer stands in a relationship not just to an image, but to an *action* performed by a moral agent. This is a commitment to **Contextualism**: the aesthetic properties of the work are sensitive to the ethical context of its making.
  *   **The Indexicality Hypothesis:** The asymmetry between visual art and literature/music is best explained by **Indexicality**. A painting bears a physical trace of the artist's hand (brushwork, gesture); it is an indexical sign of the creator's presence. A novel or symphony is symbolic; the author's physical body is absent from the text. The curatorial practice presupposes that visual art retains a stronger **phenomenological link** to the perpetrator, making the moral failure feel like a contamination of the object itself, whereas in literature, the "Death of the Author" (Barthes) is more easily operationalized.
  *   **Compatibility:** It is *compatible* with the view that visual art is uniquely transparent, but the practice could also be driven by **Public Trust Theory**. Museums are often publicly funded or charitable trusts; they face higher scrutiny regarding "hate speech" or "harm" than a literature department might. Thus, the framing may be bureaucratic risk management rather than a philosophical claim about medium specificity.

  ### 3. The Market: Autonomy or Pragmatism?

  Does market suppression presuppose a strict autonomy thesis? **No.** It presupposes a **Commodity Logic** that is compatible with autonomy but motivated by liquidity.

  *   **Strict Presupposition:** The market presupposes that **provenance is a chain of title, not a chain of custody of character.** For an asset to be liquid, its value must be standardized. Moral biography introduces idiosyncratic risk (subjective valuation). Therefore, the market *structurally requires* the bracketing of moral information to function, regardless of whether individual buyers believe morality matters.
  *   **Autonomy vs. Pragmatism:** A strict Autonomy Thesis claims moral facts *do not affect* aesthetic value. The market does not need to believe this; it only needs to act *as if* they do not affect *price*. This is **Methodological Autonomism**. It is a pragmatic judgment that buyers prefer frictionless transactions. If moral biography lowered prices systematically, the market would still suppress it to protect asset class stability, not because it believes the art is "good" despite the artist.
  *   **Coherence with Museums:** How can the museum say "This matters" and the market say "This is irrelevant"? This is coherent under **Walzer's Spheres of Justice**. The museum operates in the sphere of *cultural meaning*, where moral context enriches understanding. The market operates in the sphere of *exchange*, where moral context creates friction. The object is the same, but its "social good" changes based on the sphere.

  ### 4. Distinguishing Presuppositions from Compatibility

  To render these practices coherent, we must distinguish what the institutions *must* believe versus what they *could* believe.

  | Practice | Strict Philosophical Presupposition | Merely Compatible (Not Required) |
  | :--- | :--- | :--- |
  | **Museum/Curricular Framing** | **Contextualism:** The work's reception is partially constituted by external ethical facts. | **Expressivism:** That the art *expresses* the evil. (One can contextualize without believing the evil is *in* the work). |
  | **Lit/Music Silence** | **Medium Ontology:** That text/sound works are distinct from the author's physical agency. | **Canonical Immunity:** That dead authors (often white males) are exempt from current moral scrutiny. |
  | **Market Suppression** | **Fungibility:** That for price discovery to work, non-financial variables must be excluded. | **Radical Autonomism:** That aesthetic value is *actually* independent of morality. (The market doesn't care about truth, only price). |

  ### 5. Philosophical Underdetermination: Rival Views

  Is this pattern philosophically determined, or could rival theories license the same split?

  *   **Institutionalism (Dickie/Danto):** **Best Fit.** Institutionalism argues that art is defined by the "Artworld" conferring status. Since the Artworld is fragmented (museums vs. auctions vs. universities), each sub-institution can confer different statuses. A painting is "an ethical warning" in the museum and "a high-value asset" in the auction house. Institutionalism easily licenses the split because it denies art has a single essence.
  *   **Formalism:** **Poor Fit.** Formalism claims value resides in internal relations (line, color, form). If Formalism were dominant, museums *would not* include ethical wall texts, as those are external to the form. The fact that they do suggests Formalism is not the operating theory of the museum, even if it is the operating theory of the market.
  *   **Expressivism:** **Underdetermined.** Expressivism (art expresses the artist's emotional/moral state) could license the split *if* combined with medium specificity. One could argue painting expresses the *self* more directly than writing. However, pure Expressivism would likely demand moral scrutiny across *all* arts, failing to explain the literature/music exemption.
  *   **Reception Theory:** **Strong Fit.** If value is created by the viewer/reader, then different audiences create different values. Museum-goers expect edification; buyers expect investment. The asymmetry reflects the expectations of the *receiver*, not the properties of the *object*.

  ### 6. Counterfactuals: Uniform Relevance vs. Uniform Irrelevance

  If the underlying fragmented view were replaced by a unified theory, the institutional landscape would shift drastically.

  **Scenario A: Uniform Relevance (Radical Ethicism)**
  *   **Curricular Design:** Literature and music syllabi would mandate biographical ethics modules. Teaching Wagner would require the same disclaimer protocols as teaching Riefenstahl.
  *   **Curatorial Norms:** Wall texts would become standardized "Ethical Impact Statements." Some works might be deaccessioned or hidden if the moral failure is deemed to irredeemably corrupt the aesthetic experience.
  *   **Market Regulation:** Provenance reports would require "Moral Disclosure." Auction houses might refuse consignment based on ethical vetting (similar to conflict diamonds). Prices would fluctuate based on moral reputation, making art a less stable asset class.

  **Scenario B: Uniform Irrelevance (Radical Autonomism)**
  *   **Curricular Design:** Ethical disclaimers in art history would be removed as "extrinsic distraction." The focus would return strictly to style, technique, and internal iconography.
  *   **Curatorial Norms:** Museums would adopt a "separation of church and state" policy between the art and the artist. Biographical info would be sequestered to archives, not exhibition spaces.
  *   **Market Regulation:** No change (the market already operates here). However, the market might gain cultural legitimacy, arguing that it preserves art *from* the vagaries of moral fashion.

  ### Conclusion

  The current three-way asymmetry presupposes a **pragmatic institutional pluralism**. It treats visual art in the public sphere as **indexically tied to the moral agent** (requiring contextual framing), treats literature/music as **ontologically distant from the agent** (allowing aesthetic autonomy), and treats art in the market as a **pure commodity** (requiring moral erasure for liquidity).

  This is not a coherent philosophical system but a **stable contradiction**. It relies on the public accepting that an object can be "ethically compromised" when viewed for education but "ethically neutral" when bought for investment. The pattern is most strongly licensed by **Institutional Theory**, which allows the definition and value of the artwork to shift depending on which gatekeeper is speaking, while **Formalism** fails to account for the museum's ethical turn, and **Ethicism** fails to account for the market's silence.
