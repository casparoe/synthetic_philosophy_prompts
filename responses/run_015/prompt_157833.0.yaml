      *   **User Persona:** Software engineer, no formal philosophical training, familiar with logic/verification concepts (decision trees, evaluation frameworks).
      *   **Topic:** Nāgārjuna's *tetralemma* (catuṣkoṭi) and Madhyamaka *emptiness* (śūnyatā).
      *   **Problem:** Scholarly interpretations circle without resolution (metaphysical vs. epistemological vs. soteriological).
