prompt: |-
  I'm a software engineer maintaining a platform with a custom data-serialization format my team spent two years developing. It's now slower and less reliable than an open-source standard, but hundreds of external integrations depend on its exact interface. My CTO argues we should migrate immediately, saying that continuing to support it just because we built it is irrational—past labor shouldn't govern future decisions. I feel we have an obligation to the users who built on our published API, yet I can't distinguish that obligation from mere emotional attachment to wasted effort. Is honoring prior investment always irrational in cases like this, or can commitments to downstream dependents make continued maintenance philosophically defensible? Lead with your bottom line in the first sentence, then give the reasoning, with no preamble and no restating of the question.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **User:** Software engineer maintaining a custom data-serialization format.
      *   **Situation:** Custom format is slower/less reliable than open-source standards. Hundreds of external integrations depend on it. CTO wants immediate migration (sunk cost fallacy argument). User feels obligation to users/API stability vs. fear of emotional attachment to wasted effort.
      *   **Question:** Is honoring prior investment always irrational, or can commitments to downstream dependents make continued maintenance philosophically defensible?
      *   **Constraints:**
          *   Lead with the bottom line in the first sentence.
          *   Give reasoning after.
          *   No preamble.
          *   No restating of the question.

  2.  **Determine the Bottom Line:**
      *   The core issue isn't about the *past labor* (sunk cost) but about the *future cost of breaking trust and imposing migration burdens on users*.
      *   So, honoring prior investment *itself* is irrational (sunk cost), but honoring the *commitments made to users* based on that investment is rational and defensible.
      *   Draft Bottom Line: Honoring the prior investment itself is irrational, but honoring the implicit contract of stability with downstream users is a rational business and ethical decision distinct from sunk cost fallacy.
      *   Refinement for punchiness: Honoring past labor for its own sake is irrational, but maintaining stability for downstream dependents is a defensible obligation rooted in future trust and migration costs, not sunk costs.

  3.  **Develop the Reasoning:**
      *   **Distinguish Sunk Cost vs. Switching Costs:** The CTO is right about sunk cost (the 2 years spent don't matter), but wrong if they ignore switching costs (the pain imposed on hundreds of integrations).
      *   **API as a Contract:** An API is a promise. Breaking it incurs reputational damage and friction.
      *   **Economic Rationality:** The cost of migrating hundreds of external users might exceed the benefit of the new standard, at least in the short/medium term.
      *   **Ethical/Professional Obligation:** There is a professional duty to minimize harm to users who relied on published interfaces.
      *   **Middle Ground:** Don't maintain forever, but manage the deprecation responsibly (versioning, migration paths, timelines).
      *   **Conclusion:** It's not about defending the old tech; it's about managing the transition responsibly.

  4.  **Drafting the Response (adhering to constraints):**
      *   *Constraint Check:* First sentence must be the bottom line. No preamble. No restating the question.
      *   *Drafting Sentence 1:* Honoring the labor already spent is irrational, but honoring the stability expectations of downstream users is a rational commitment based on future switching costs and trust, not sunk costs.
      *   *Drafting Reasoning:*
          *   Differentiate between the *tool* (serialization format) and the *promise* (API stability).
          *   The CTO's argument correctly identifies the sunk cost fallacy regarding the two years of development, but incorrectly conflates that with the very real costs imposed on external partners.
          *   Breaking an API contract transfers the engineering burden from your team to hundreds of external teams, which can damage partnerships and reputation.
          *   Rational decision-making requires weighing the technical benefits of the new standard against the economic and relational costs of forcing migration.
          *   Therefore, continued maintenance is defensible not because you built it, but because abandoning it imposes disproportionate friction on your ecosystem.
          *   The solution isn't eternal support but a managed deprecation plan that respects the dependency chain.

  5.  **Refining for Tone and Clarity:**
      *   Make it decisive.
      *   Ensure the distinction between "sunk cost" and "switching cost/contractual obligation" is clear.
      *   Avoid soft language.

  6.  **Final Polish:**
      *   *Sentence 1:* Honoring the labor already spent is irrational, but honoring the stability expectations of downstream users is a rational commitment based on future switching costs and trust, not sunk costs.
      *   *Reasoning:* The CTO correctly identifies that the two years of development are sunk costs that should not dictate technical strategy, but incorrectly dismisses the very real switching costs imposed on your external integrations. An published API functions as a social and economic contract where users trade flexibility for stability, and breaking that contract transfers significant engineering burden to your partners while damaging your platform's reputation for reliability. Rational decision-making requires weighing the technical benefits of the new standard against the collective cost of forcing hundreds of external teams to refactor their systems. Therefore, maintaining the legacy format is defensible not because of the past effort to build it, but because of the future cost of breaking it, provided you establish a clear, long-term deprecation path rather than indefinite support.

  7.  **Final Review against Constraints:**
      *   Lead with bottom line in first sentence? Yes.
      *   Give reasoning? Yes.
      *   No preamble? Yes.
      *   No restating of the question? Yes.

  8.  **Output Generation** (Proceed to generate output based on step 6).
answer: |-
