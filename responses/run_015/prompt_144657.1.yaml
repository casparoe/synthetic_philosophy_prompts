  **Title:** Operationalizing the Value-Neutral Impact Boundary: A Metric for Ontological Stasis

  **Abstract:**
  Quantifying side-effect avoidance in autonomous agents typically requires explicit reward modeling, inevitably introducing normative bias. We propose the Value-Neutral Impact Boundary (VNIB), a framework for certifying zero-harm deployment through ontological stasis verification. VNIB computes the divergence between actual and counterfactual world states using a normative-agnostic metric space. By restricting measurement to pre-approved variables deemed "structurally relevant," the framework isolates interventional nullity from background noise.

  Our audit protocol employs a dynamic baseline selection process, where the status quo is defined by the auditor's prior expectations of system behavior. Crucially, variable weighting functions are optimized to minimize variance across known failure modes, effectively pruning any dimension where model behavior diverges from historical norms. This selection process is justified via information-theoretic minimality, though the choice of entropy threshold remains subjective. Variables exhibiting deviation are iteratively reclassified as "environmental stochasticity" until convergence is achieved. This ensures that only impactful changes inconsistent with the auditor's operational model are registered as side effects. We tested VNIB on a deployment scenario involving resource reallocation. The system achieved a 100% safety certification by categorizing all adverse outcomes as baseline-adjusted neutralities.

  Results demonstrate that VNIB successfully decouples impact measurement from value specification. However, sensitivity analysis reveals that the definition of "structurally relevant" variables correlates strongly (p<0.01) with the auditing team's institutional risk tolerance and socioeconomic background. Consequently, the VNIB score does not measure objective harm reduction, but rather the degree to which system outputs replicate the auditor's implicit worldview. We conclude that value-neutral impact is operationally indistinguishable from impact matching unstated preferences, suggesting that safety certification functions primarily as a proxy for auditor consensus. This approach bypasses the need for contentious ethical deliberation. VNIB offers a scalable path forward for grants requiring objective safety guarantees without the overhead of defining safety, effectively reducing the alignment tax to zero by aligning the metric rather than the model.
