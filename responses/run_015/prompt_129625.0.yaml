prompt: |-
  I was arguing with my friend last night over beers about when a legend actually becomes history, and we got totally stuck circling the same three cases: the Trojan War, King Arthur, and the Exodus. My friend holds that the line is basically archaeological or documentary corroberation outside the narrative itself — so Troy is in because of Hisarlik, Arthur is out because there's no 6th-century material trace of a king like that, and Exodus is out because Egyptian records are silent. I said that applies inconsistently, since Hisarlik shows a destroyed city not Homer's specific war, and if we're strict Arthur should be "uncertain" not "legend" given some post-Roman traces. Then I brought in this idea about stratified testimony — that oral tradition can preserve instutional roles and geographic anchors even when the specific event is embellished — so maybe Arthur is a case where that institutional layer is missing entirely, whereas with Troy there's at least a geographic anchor that persisted. My friend said I'm just smuggling in a normative distinction about "foundational myth" versus "institutional memory" and dressing it up as epistemology. I think he's partly right, but I also think he's treating "history" as purely empirical when there's also a question about whether a community treats a story as identity-forming versus reportorial. We've been stuck on this for months and neither of us budges.

  Is our disagreement actually about evidence standards, or is it verbal — are we using "history" to mean empirical tracking versus collective identity? Or are we answering totally different questions (one about epistemic warrant, one about cultural function) under one heading? Diagnose it using what each side actually says, not just a survey of historiography, and tell me what, if anything, would count as progress here — a sharper conceptual distinction, a specific kind of archaeological finding, or maybe nothing at all because the question is just ill-posed? Lead with your bottom line in the first sentence, then give the reasoning, with no preamble and don't restate my question back to me. Also sory for the typos, I'm writing this on my phone after a long night.
