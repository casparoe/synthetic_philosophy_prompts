answer: |-
  You are answering fundamentally different questions under a single label, making the dispute verbal rather than evidential, so progress depends on conceptual differentiation rather than archaeological discovery. Your friend operates within a positivist framework where history equals empirically verified eventhood, requiring external corroboration to transition a narrative from myth to fact; this is why Hisarlik suffices for Troy (physical destruction matches narrative anchor) while silence sinks Arthur and Exodus. You operate within a functionalist or epistemic framework where history equals transmitted memory, valuing the continuity of institutional roles and geographic anchors even without specific event verification; this is why you see Arthur as uncertain rather than false, and why you view the friend's strict binary as inconsistent regarding Homer's specific war versus the city's existence.

  The friend's accusation that you are smuggling normative distinctions into epistemology is partially correct but misses the point: you are indeed shifting from ontology (did it happen?) to sociology (how does this function?), but that shift is necessary because "history" colloquially covers both domains. When your friend demands external documentation, they are asking about event reconstruction; when you demand stratified testimony, you are asking about tradition mechanics. Neither is wrong, but you cannot resolve the conflict by arguing over the same cases because you are grading them on different rubrics. Hisarlik is a win for the friend (physical evidence) but a partial win for you (geographic anchor without narrative confirmation); Arthur is a loss for the friend (no evidence) but a potential win for you (institutional memory).

  Progress will not come from new pottery shards or Egyptian steles, as new data will only be interpreted through your existing, conflicting definitions of what counts as historical validation. Instead, you need to adopt a dual-axis model that separates historicity (empirical verification of events) from historical consciousness (the role of the narrative in community identity). If you agree to classify cases like Arthur as historically uncertain but culturally historical, you dissolve the binary trap. Until you distinguish between history-as-fact and history-as-function, you will remain stuck circling the same three cases because you are not debating the evidence, but the definition of the thing the evidence is supposed to prove.
