  ***

  **The Mechanics Note**

  This relies on the **discursive dilemma** (doctrinal paradox), not Condorcet cycles. The individuals are logically consistent; the collective is not.

  | Member | P (Quality) | Q (Budget) | Outcome (Buy?) |
  | :--- | :---: | :---: | :---: |
  | **1** | Yes | Yes | Yes |
  | **2** | Yes | No | No |
  | **3** | No | Yes | No |
  | **Majority** | **Yes** | **Yes** | **No** |

  **Beat 1** shows the divergence: Premise-based voting yields "Buy"; Conclusion-based voting yields "No Buy."
  **Beat 2** shows the cost of fixing it: Switching to Conclusion-based voting saves the decision but leaves the group's recorded *beliefs* logically inconsistent (accepting $P \land Q$ while rejecting $P \land Q \to \text{Buy}$). This is a failure of collective rationality, not preference cycling.
