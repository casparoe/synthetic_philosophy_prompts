answer: |-
  **Coherence without Consciousness: The Limits of Diachronic Norms for Collective Agents**

  The demand for diachronic coherence is a cornerstone of rational choice theory. An agent who prefers A to B, B to C, and yet C to A across time is vulnerable to a "money pump": a sequence of trades that leaves them strictly worse off than when they started, solely due to the inconsistency of their preferences. For an individual, this is a paradigmatic failure of rationality. But what happens when the agent is not a biological human with a unified nervous system, but a collective body like a university senate or a climate board? When such bodies make sequential budget calls across years, shifting priorities in a cycle, are they irrational in the same sense as an individual, or does the critique of the money pump misapply once the agent is a fiction of law rather than a fact of psychology?

  I argue that applying diachronic coherence norms to collectives constitutes a category error if understood as a judgment on the group's "mental state," yet remains pragmatically indispensable if understood as a constraint on institutional design. Institutional flip-flopping is not irrationality of the mind, but dysfunction of the system. Therefore, while the *metaphysical* basis for the money pump argument collapses for groups, the *normative* force must be preserved through procedural safeguards rather than expectations of collective will.

  To understand the disanalogy, we must first recognize why the money pump binds the individual. In the standard Dutch book argument, the vulnerability arises because the agent is a single locus of evaluation and loss. If I trade A for B, then B for C, then C for A, paying a fee each time, *I* end up with A and less money. The continuity of consciousness ensures that the loss at $t_3$ is felt by the same entity that made the gain at $t_1$. The norm of transitivity is constitutive of agency; to violate it is to undermine one's own capacity to pursue ends.

  Collectives, however, lack this continuity of consciousness. A university senate is a shifting coalition of individuals. The "agent" at $t_1$ (the 2023 Senate) may have a different membership and different constituent pressures than the "agent" at $t_3$ (the 2025 Senate). If the 2023 Senate prefers Science over Arts, and the 2025 Senate prefers Arts over Science, no single mind has contradicted itself. Rather, the composition of the decision-making body has changed. To accuse the institution of "irrationality" implies a unified group mind that persists through time, holding preferences independently of its members. This is a metaphysical fiction. As social choice theory demonstrates (most notably via Arrow's Impossibility Theorem and Condorcet cycles), even if every individual member is perfectly transitive and rational, the aggregate group preference can be intransitive. If the mechanism of aggregation (voting) produces cycles, the "group" is not psychologically inconsistent; it is mathematically prone to cycling.

  Consequently, the charge of irrationality misapplies if it targets the collective as a cognitive entity. You cannot money pump a committee in the strict sense because there is no single wallet to empty, only a succession of stewards. If the Senate votes to fund a biology lab, then next year defunds it to build a humanities center, and the year after defunds that to return to biology, the "loss" is not suffered by a unified self. It is suffered by the stakeholders—the students, the donors, the state—who rely on the institution's stability. The "pump" here is not exploiting a logical error in a mind, but exploiting a friction in a bureaucracy.

  However, to dismiss diachronic norms entirely because groups lack minds is to invite institutional suicide. While the *source* of the norm differs, the *necessity* remains. An institution that cycles its budget priorities diachronically incurs real costs: sunk costs in abandoned projects, reputational damage from unreliability, and the transaction costs of constant restructuring. If a climate board oscillates between mitigation and adaptation funding every election cycle, the net reduction in carbon may be zero despite positive expenditure. In this functional sense, the collective is vulnerable to a "resource pump" even if it is not vulnerable to a "psychological pump."

  Therefore, we must reframe the application of coherence norms. For individuals, coherence is a requirement of *rationality*. For collectives, coherence is a requirement of *fiduciary responsibility*. The critique of the money pump should not be used to diagnose a group's mental state (which does not exist), but to audit its decision procedures. If a senate is prone to cyclical budgeting, it is not "thinking wrongly"; it is "voting badly." The irrationality lies not in the agent, but in the architecture of the agency.

  This distinction dictates a different remedy. We cannot ask a university senate to "introspect" until its preferences align, because it has no introspective capacity. Instead, we must impose external constraints that mimic diachronic coherence. This might involve locking in multi-year budgets, requiring supermajorities to reverse prior decisions, or delegating specific domains to sub-committees with longer tenures. These are not tools to cure a sick mind, but guardrails to prevent a mechanical failure. The norm of diachronic coherence applies to the *rules of the game*, not the *players*.

  In conclusion, the standard individual-level arguments for diachronic coherence do not apply to collective bodies in the same sense. It is a category mistake to label institutional flip-flopping as "irrationality" akin to an individual's logical error, because the collective lacks the unified mental state required to be the subject of such a vice. The money pump critique misapplies if it assumes a group mind. However, this does not grant collectives license to cycle. The norm applies *instrumentally*: institutions must enforce coherence upon themselves not because they are thinkers who must be consistent, but because they are stewards who must be efficient. To demand diachronic coherence from a senate is not to demand it have a soul, but to demand it function as if it did, lest it be drained by the very cycles it creates.
