answer: |-
  This is a sharp diagnosis, and your background in physics gives you a distinct advantage here: you recognize this as a problem of **model completeness versus state instantiation**.

  To answer your core question directly: The stalemate is **primarily verbal/semantic regarding 'knowing', but it is sustained by a bedrock ontological disagreement that makes it functionally substantive.** It is not an empirical disagreement about neural correlates, nor is it strictly ill-posed, though it relies on a potentially incoherent definition of "physical fact."

  Here is the diagnosis of the stall, stripped of the historical survey.

  ### 1. The Semantic Trap: Information vs. Instantiation
  Your intuition about *de dicto* (propositional/model) vs. *de re* (acquaintance/state) is the correct lever.

  *   **The Physicalist Position (Model-Completion):** To a physicist, "knowing all physical facts" implies having a complete causal model of the system. If Mary has the complete transfer function of the visual cortex, she has the *information*. When she steps out, her system updates its priors or switches from simulation to direct input. No new *ontological* data enters the universe; only the **mode of access** changes. This treats knowledge as **compression** or **representation**.
  *   **The Anti-Physicalist Position (State-Matching):** The dualist argues that a map of a territory is not the territory. Mary has the map (the model). Seeing red is *being* the territory (the state). They argue that if the map were truly complete, it would necessitate the territory. Since she can have the map without the territory, the territory (qualia) must be outside the map's ontology. This treats knowledge as **identity** or **instantiation**.

  **The Stall:** The debate stalls because "knowledge" is doing double duty.
  1.  **Knowledge-as-Description:** (Propositional, third-person, compressible).
  2.  **Knowledge-as-Acquaintance:** (Indexical, first-person, non-compressible).

  Physicalists argue (2) reduces to (1) + a specific causal connection. Anti-physicalists argue (2) contains irreducible content that (1) cannot capture. Neither side can prove the other wrong because they are arguing over whether **representation can ever be ontologically exhaustive.**

  ### 2. The Hidden Ontological Sneak-In
  You asked if there is a hidden empirical disagreement. There isn't one about *neural correlates* (both sides agree the brain lights up). The hidden disagreement is about the **definition of "Physical Fact."**

  *   **The Physicalist Assumption:** Physical facts are objective, third-person, and structural/relational. If you describe the structure and relations completely, you have described the thing.
  *   **The Anti-Physicalist Assumption:** Physical facts are inherently structural/relational, but experience is **intrinsic**.

  This is the real bottleneck. If reality is purely structural (as much of modern physics suggests), Mary should know everything. If reality has intrinsic "stuff" (qualia) that structure merely points to, Mary misses it.

  The stall is bedrock because it asks: **Is the universe made of structures/maps, or is it made of stuff/territory?**
  *   If you are a structural realist (common in physics), Mary learns nothing new about the *world*, only about her *location* in it (a self-locating belief update).
  *   If you are a substance realist regarding mind, Mary learns about a new *substance*.

  ### 3. Why Empirical Data Won't Fix It
  You asked if sharper empirical data on neural correlates could end this. It cannot.

  Suppose we map every photon, retinal firing, V1 activation, and global workspace integration involved in seeing red.
  *   **Physicalist:** "See? The physical story is complete. The 'feeling' is just the system monitoring its own red-detection state."
  *   **Anti-Physicalist:** "You have described the *correlates* of the feeling. You have not explained why that processing *feels like* anything rather than nothing. Mary knew all those correlates in the room."

  This is why the Knowledge Argument is the epistemic face of the "Hard Problem." Empirical data fills in the *correlations*, but the argument is about the *explanatory gap* between correlation and identity. No amount of fMRI data can bridge a logical/ontological gap.

  ### 4. Is it Ill-Posed?
  There is a strong case that the thought experiment is **underdescribed** in a way that biases the result.

  The premise "Mary knows all physical facts" assumes that "physical facts" can be fully transmitted via language/data (black and white books).
  *   **The Indexical Counter:** Some physicalists (like David Lewis) argue that what Mary lacks is **indexical knowledge** (e.g., "This is what it is like for *me* to see red *now*"). This is a physical fact (a fact about her spacetime location and internal state), but it cannot be learned from a book. It requires *being* there.
  *   **The Ability Hypothesis:** Others argue she gains "know-how" (ability to recognize/remember), not "know-that."

  If you accept these distinctions, the argument dissolves into a verbal dispute about whether indexical/ability knowledge counts as a "new fact." But the anti-physicalist will simply dig in and say, "The reason indexical knowledge matters is because the *quality* being indexed is non-physical."

  ### 5. Can It Be Ended? (The Verdict)
  To be blunt: **No, not in the way physics resolves disputes.**

  In physics, we have a reality constraint (experiment) that adjudicates between models. In this metaphysical debate, the "experiment" (Mary stepping out) is interpreted differently by the two frameworks.
  *   It is a **Framework Dispute**. It is analogous to the debate between Copenhagen and Many-Worlds interpretations of QM. The math (the physical facts) is the same; the ontology (what exists) differs. You cannot empirically disprove an interpretation if it is designed to be empirically equivalent.

  **The only resolution mechanisms are:**
  1.  **Stipulative:** We agree to define "physical fact" to include first-person acquaintance. (Physicalism wins by definition).
  2.  **Eliminative:** We argue that "what it feels like" is a cognitive illusion and doesn't exist to be known. (Illusionism).
  3.  **Panpsychist/Neutral Monist Shift:** We admit physicalism as currently defined (matter is inert/structural) is insufficient, and expand "physical" to include experience as fundamental. (This changes the definitions rather than solving the puzzle within the old ones).

  ### Summary Diagnosis
  *   **Type of Stall:** **Bedrock Intuition masked as Semantic Dispute.**
  *   **Core Conflict:** Structural/Relational Ontology (Physics) vs. Intrinsic/Qualitative Ontology (Phenomenology).
  *   **Your De Dicto/De Re Theory:** Correct. The physicalist sees a model update; the anti-physicalist sees a new ontological category.
  *   **Resolution:** Unlikely. It requires one side to abandon a fundamental intuition about what "reality" is (either that reality is exhaustively structural, or that experience is real and distinct).

  As a physicist, you might view this as a **coordinate system error**. Mary is trying to derive the *view from inside the coordinate system* using only the *equations describing the coordinate system*. The physicalist says the equations are all there is. The anti-physicalist says the "view" is a distinct entity the equations fail to capture. Until we agree on whether the "view" is an entity or just a perspective, the equation won't balance.
