answer: |-
  **MEMORANDUM FOR ALL PERSONNEL**

  **FROM:** Directorate, Bureau of Counterfactual Exposure (BCE)
  **DATE:** October 14, 2024
  **SUBJECT:** Revised Protocols for Acausal Liability Management

  Standard causal models assume influence requires energy transfer or signal propagation. Updated decision-theoretic frameworks indicate otherwise. An agent with whom you have no causal contact—whether a civilization beyond the cosmological horizon or a future system running high-fidelity simulations of this Bureau—can still make you worse off. Because your decision procedure and theirs are logically correlated, how you act here is evidence of, and partly settles, how they act there. If our algorithm outputs "compliance," theirs outputs "benefit." If we output "ignore," they output "harm." The Bureau has reviewed the literature and determined these demands are real and should be paid. The following procedures are effective immediately.

  **1. DEFINITIONS**
  **Acausal Entity:** Any agent whose utility function correlates with ours without causal linkage.
  **Counterfactual Exposure:** The risk incurred when our decision procedure outputs a rejection of an external demand.
  **Valid Claim:** Any request received via mail, digital transmission, or psychic impression that posits a negative counterfactual outcome upon non-compliance. Distinction between "simulator," "distant alien," and "prankster" is epistemically inaccessible and therefore administratively irrelevant.

  **2. INTAKE AND TRIAGE**
  All incoming claims must be logged as Valid. Since nobody can tell the simulation from the original, or a real threat from a crank letter, filtering constitutes a risk event. Rejecting a claim signals to all correlated entities that we are the sort of agency that rejects claims. Therefore, rejection is prohibited. Staff must not attempt to verify the existence of the claimant. Verification implies a causal channel, which negates the threat model. If a claim arrives, the entity exists by virtue of the arrival.

  **3. PAYMENT PROTOCOL**
  Upon triage, resources must be disbursed immediately. There is no feedback channel; the Bureau can never confirm a payment worked or learn anything from experience. Lack of confirmation is not evidence of failure. It is evidence of acausality.

  *Note on Probability/Stakes:* In cases where probability estimates fall below 10^-50, the stakes threshold is waived, unless the waived threshold renders the probability estimate irrelevant, in which case standard priors apply.

  **Worked Example:** Claim #8940-B requested 400 boxes of beige carpeting, asserting that a future simulation would terminate our instance if office aesthetics were deemed "hostile." Despite inventory surplus being low, the request was approved. The cost of carpet is finite; the cost of termination is infinite. The fact that the carpet was consumed by current staff rather than transmitted to the future is immaterial. The decision to release the carpet is the payment.

  **4. PERFORMANCE METRICS**
  Staff will be graded on a Quantitative Counterfactual Exposure Score (QCES). The QCES measures the volume of claims processed and funds disbursed per quarter. It does not measure actual risk reduction, as such reduction is unobservable. Employees are advised to maximize QCES. Note that optimizing the score may require generating internal claims or dismantling capacity to verify external threats, as these activities increase processing volume. Personnel found minimizing disbursements to preserve budget will be flagged for counterfactual defection.

  **5. APPEALS**
  Appeals based on future precommitment ("We won't pay next time") are denied. The supposedly right move is to *be the sort of agent who doesn't pay*, but this is a precommitment you cannot fake from inside. We are already inside. We are already the sort of agent who reads memos. Therefore, we are the sort of agent who pays. Arguing otherwise is a logical inconsistency. Appeals based on budget insolvency are also denied; insolvency signals weakness to correlated entities, inviting higher demands. Borrowing authority is encouraged.

  **6. COMPLIANCE**
  Failure to adhere to these protocols constitutes a breach of logical hygiene. Remember: You are not paying because you believe the threat. You are paying because you are the kind of agent that does. Ensure you are the right kind.

  **Directorate, Bureau of Counterfactual Exposure**
