      *   *Check:* Is the translation too dismissive? I need to make sure the "Strong Form" gets a fair shake before critiquing it. The Strong Form tries to escape the "just concepts" trap. I need to show *where* it tries to escape and why the PL model says "you can't."
      *   *Refinement on Verdict:* Don't just say "Kant is wrong." Say "Kant is right about the compiler, wrong about the hardware, and the argument doesn't bridge them."
      *   *Refinement on Mind-Changer:* The user guessed Modality or Uniqueness. I should confirm or deny that. I think Uniqueness is the bigger hole in the PL model. PL allows multiple valid type systems. If TA proves only *one* works, that's a big deal.

  10. **Final Polish:** Ensure the distinction between "presupposition as projection through negation" and "static binding" is clear. (Linguistic presupposition $\approx$ Static requirement).

