  7.  **Identifying the Mind-Changer:**
      *   What would make the PL view insufficient? If the "compiler" (mind) is not arbitrary but *evolved/forced* by the "hardware" (reality). If the type system isn't chosen but *discovered* as the only one that allows compilation on *this* hardware.
      *   *Candidate:* A proof that any Turing-complete system interacting with a causal universe *must* implement specific abstractions (like object permanence or causality) to minimize entropy/error. If the "grammar" is physically necessitated, the gap closes.

  8.  **Review against Constraints:**
