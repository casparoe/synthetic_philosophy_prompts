          *   Length: One side of A4.

  2.  **Deconstruct the Paradox & Positions:**
      *   *The Paradox:* Backward Induction (BI) says Take at Node 1. Empirically, people Pass. Why?
      *   *Position A (Standard Orthodoxy):* BI is correct. If we are at Node 4, something broke (CKR failed). You should update beliefs and Take. (Aumann/Standard Econ).
      *   *Position B (Model Misspecification/Incomplete Info):* BI holds for the *specified* game. But the real game has uncertainty (is my opponent rational? is there a tremble?). This dissolves the paradox. (Kreps/Wilson/Milgrom/Roberts).
      *   *Position C (Bounded Rationality):* Players can't do 6 steps of recursion. They use heuristics. (Level-k, CH).
      *   *Position D (We-Reasoning/Team Agency):* We maximize joint payoff, not individual. BI assumes "I" vs "You".
      *   *Position E (Off-Path/Counterfactual Logic):* BI is a theorem about the *structure*, but doesn't dictate action *if* the structure is violated (reaching Node 4). You can't use BI premises to reason *after* BI premises are falsified. (Binmore/Stalnaker-ish).
      *   *Position F (Empty/Incoherent):* Maybe "BI is wrong logic" (it's not, it's valid). Or "Pass at Node 1 because it's Pareto optimal" without changing the reasoning structure (naive cooperation).

  3.  **Drafting the Questions (Iterative Process):**
      *   *Requirement:* Concrete variants, On-Path/Off-Path focus, no jargon.
      *   *Q1 (The Setup):* 100 nodes vs 6 nodes. Does length change rationality?
      *   *Q2 (The Off-Path Moment):* You are at Node 4. BI says this is impossible. Do you doubt the opponent's rationality *now*, or did you doubt it *before*?
      *   *Q3 (The Clone):* Opponent is your exact psychological copy. Do you Pass?
      *   *Q4 (Cheap Talk):* Opponent says "I will Pass." Does this change your Node 1 move?
      *   *Q5 (Observation):* You saw them Pass in a previous game. Do you Pass now?
      *   *Q6 (The "Why"):* If you Pass at Node 1, is it to *signal* or to *cooperate*?
      *   *Q7 (The Logic):* If BI says "Node 4 is unreachable," can you have a plan for Node 4?

      *Refining for Flowchart Logic:* I need binary or trinary branches that separate the positions.
      *   *Split 1:* Is Backward Induction a binding constraint on *action* even if premises fail? (Separates Orthodoxy from Off-Path Deniers).
      *   *Split 2:* Is the failure due to cognitive limits or strategic uncertainty? (Separates Bounded from Incomplete Info).
      *   *Split 3:* Is the unit of agency "I" or "We"? (Separates Team Reasoning).

      *Let's try to map the Questions to the Leaves first.*
      *   *Leaf 1 (Orthodox/Bite Bullet):* BI is right. If at Node 4, opponent is irrational. Take.
      *   *Leaf 2 (Incomplete Info):* BI is right for complete info. But info isn't complete. Small chance of "irrational" type makes Passing rational early on.
      *   *Leaf 3 (Bounded):* BI is too hard. We use heuristics.
      *   *Leaf 4 (Team):* We maximize sum.
      *   *Leaf 5 (Off-Path Logic):* BI premises contradicted at Node 4. Logic explodes. Can't conclude Take.
      *   *Leaf 6 (Empty):* BI logic is invalid (it's not).

