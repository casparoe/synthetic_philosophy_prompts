prompt: |-
  i'm in a third-year seminar on rational choice and games (it's joint philosophy/econ, so half the room has done proper game theory and the rest of us wandered in from epistemology) and we've spent like three weeks on the centipede game and I feel like everyone is talking past each other. I want to make a one-page handout for our last session: a decision tree / flow chart — really a which resolution of the backward induction paradox are you actually committed to quiz, with a scoring key at the end.

  The game we use in class: six decision nodes, and at each node whoever's turn it is can either take (game ends, they get the larger share of the pot) or pass (pot grows, other player moves). Payoffs and the whole tree are common knowledge between you both.

  What I need from you:

  Start from the two things nobody in my seminar actually disputes: that the induction is a valid argument given its premises, and that real players pass early and often anyway. Then branch on questions, not on names. Every node has to be something a student who's seen the game once in a lecture but hasn't read any of the literature could answer without knowing which position it leads to — so no node that just asks whether common knowledge of rationality is realistic, that's just making them pick a label.

  The thing I most want the instrument to diagnose is what you're entitled to conclude from the fact that you have actually been handed the move at node 4, the node the induction says will never be reached. That on-path versus off-path distinction has to show up as its own explicit question, and I'd like at least two more questions to be concrete variants of the game rather than abstract claims. Ones I've been playing with: a version with 100 nodes instead of 6; a version where before play starts each player can send one cost-free message saying they'll pass at every node; a version where I've watched my opponent pass in an earlier centipede against someone else; a version where my opponent is an exact copy of me who reasons exactly the way I do. Use some of those or invent better ones.

  Build the space before the names: your questions, then the answer combinations they allow, then the actual positions placed into the cells. The leaves I need covered at minimum: the one that bites the bullet and says the data just shows people aren't commonly known to be rational (or that once you're at a reached node you should have doubts the setup forbade you to have at the start); the one that grants the induction as a theorem but denies it tells you what to do when you're the one actually moving; the team or we-reasoning one; the bounded-rationality / level-k one; and the one that says the model is misspecified and a bit of incomplete info or a tremble dissolves the whole thing. At least one cell should come out empty — say whether it's empty because it's incoherent, unattractive, or just unexplored. And where two of those positions look identical on your questions, flag it rather than inventing a question to fake a split.

  Aim for 8-10 questions, 6-8 leaves, one line under each leaf on the most uncomfortable thing that view ends up stuck with, and keep it short enough to print on one side of A4.
reasoning: |-
