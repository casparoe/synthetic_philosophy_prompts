answer: |-
  # THE CENTIPEDE DIAGNOSTIC
  **Seminar Handout | Rational Choice & Games**

  **The Setup:** We agree on two things. (1) Backward Induction (BI) is a valid argument *if* its premises hold. (2) In experiments, players Pass early and often.
  **The Task:** Answer these 8 questions honestly. Do not answer how you think a "rational agent" should; answer how *you* resolve the tension.

  ### THE QUESTIONS

  **1. The Clone:** Your opponent is your exact psychological copy (same brain, same reasoning). Do you **Pass** at Node 1?
  **2. The Marathon:** The game has 100 nodes instead of 6. Do you **Take** at Node 1?
  **3. The Glitch:** There is a 1% chance your opponent is a machine *forced* to Pass. Does this make **Passing** at Node 1 rational in the *standard* game?
  **4. The Promise:** Before playing, opponent says "I will Pass at every node." Do you **Pass** at Node 1?
  **5. The History:** You saw this opponent **Pass** in a Centipede game yesterday. Do you **Pass** today?
  **6. The Surprise (Belief):** You are at Node 4. BI said this node is unreachable. Do you now believe the opponent is **Irrational**?
  **7. The Surprise (Action):** You are at Node 4. Do you **Take** immediately?
  **8. The Model:** Is BI a rule for *action* or a consistency check for the *model*?

  ---

  ### SCORING KEY & POSITIONS

  *Find the profile that matches your answers. Read the "Uncomfortable Cost" before committing.*

  #### A. THE TEAM REASONER
  *   **Profile:** Q1=**Pass**; Q2=**Pass**; Q6/Q7=**Pass** (Cooperate).
  *   **View:** The unit of agency is "We," not "I." We maximize joint payoff.
  *   **Uncomfortable Cost:** You must explain why "We" exists without a binding contract.
  *   **Note:** *Overlaps with Evidential Decision Theory (my choice is evidence of theirs).*

  #### B. THE BOUNDED RATIONALIST (Level-k)
  *   **Profile:** Q1=**Pass**; Q2=**Take** (too hard to calculate); Q6=**Yes**.
  *   **View:** BI requires infinite recursion. Humans use heuristics (e.g., "Pass 3 times").
  *   **Uncomfortable Cost:** You concede rationality is defined by cognitive limits, not logic.

  #### C. THE INCOMPLETE INFO STRATEGIST (Reputation)
  *   **Profile:** Q1=**Take** (theoretically); Q3=**Yes** (justifies Pass); Q6=**Yes**; Q7=**Take**.
  *   **View:** BI holds for complete info. But real games have uncertainty (types/trembles). Passing builds a reputation.
  *   **Uncomfortable Cost:** You solved the paradox by changing the game (adding types).

  #### D. THE ORTHODOX (Common Knowledge)
  *   **Profile:** Q1=**Take**; Q3=**No**; Q6=**Yes**; Q7=**Take**.
  *   **View:** BI is binding. If Node 4 is reached, Common Knowledge of Rationality failed. Update beliefs and Take.
  *   **Uncomfortable Cost:** You must accept that reaching Node 4 falsifies the setup you started with.

  #### E. THE OFF-PATH SKEPTIC (Counterfactual Logic)
  *   **Profile:** Q1=**Take**; Q6=**No/Undefined**; Q7=**No/Undefined**; Q8=**Consistency Check**.
  *   **View:** BI proves "If Rational, then Node 4 unreachable." It does *not* say what to do *if* Node 4 is reached. The theory is silent.
  *   **Uncomfortable Cost:** You have no action-guidance for the very moment you need it most.

  #### F. THE NAIVE COOPERATOR (EMPTY CELL)
  *   **Profile:** Q1=**Pass**; Q3=**No**; Q6=**No** (Opponent Rational); Q7=**Take**.
  *   **View:** Pass at start to be nice, but assume opponent is rational at Node 4.
  *   **Status:** **INCOHERENT.** You violate dominance reasoning without the cover of incomplete info or team reasoning. You get exploited.

  #### G. THE MODEL MISSPECIFIER
  *   **Profile:** Q3=**Yes**; Q8=**Model is Wrong**.
  *   **View:** The standard tree misses payoff structures (spite, fairness, utility of cooperation).
  *   **Uncomfortable Cost:** "Rationality" becomes unfalsifiable (any move can be rationalized by tweaking utility).

  ---

  ### DIAGNOSTIC NOTES

  *   **The Node 4 Divide:** Questions 6 & 7 separate **Orthodox/Incomplete Info** (Update & Take) from **Off-Path Skeptics** (Logic Breaks).
  *   **The Clone Test:** Question 1 isolates **Team Reasoning** from all strategic views.
  *   **Identical Actions:** **Team Reasoners** and **Bounded Rationalists** both Pass early, but for opposite reasons (Agency vs. Capacity). Check Q2 to split them.
  *   **The Empty Cell:** Position F is included because students often drift there. It is strategically unstable.

  *Printed for Phil/Econ 301 | Do not cite without permission*
