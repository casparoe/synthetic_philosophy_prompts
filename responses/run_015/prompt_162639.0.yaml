answer: |-
  Brainstorming the slogan reveals it conflates normative authority with epistemic reliability. At its weakest, it is a plea against scope neglect: human intuition poorly processes large numbers, so arithmetic is a necessary corrective. At its strongest, it is a metaphysical claim that value *is* expectation, regardless of input quality. The most dangerous reading is that the operation of multiplication validates the inputs; the most defensible is that it corrects the weighting. A silly reading is that the math is literally possible here; a false one is that intuition is always wrong. The load-bearing move is not the multiplication, but the claim that the probability estimate is a number rather than a placeholder for ignorance.

  The slogan also hides a tension between single-case and portfolio reasoning. In a single shot, a one-in-ten-thousand loss is just a loss; in a repeated budget, it averages out. Your colleague is likely invoking the portfolio defense to justify a single decision, which is a category error unless the foundation treats its entire endowment as one bet. Finally, the slogan presupposes the Archimedean axiom—that no outcome is infinitely worse or better than another—without arguing for it. If your protagonist believes some risks are lexicographically forbidden, the math never starts.

  **Menu of Theses**

  1.  **The Psychological Correction Claim**
      *   **Claim:** Human intuition systematically underweights low-probability, high-impact outcomes due to cognitive bias; arithmetic corrects this distortion.
      *   **Verdict:** Substantive and defensible (platitude in behavioral econ).
      *   **Ends Argument?** No. It explains *why* she hesitates, not why she is wrong.
      *   **Protagonist Reply:** "Bias correction requires reliable inputs; correcting for scope neglect doesn't justify multiplying by noise."

  2.  **The Aggregation and Hegemony Claim**
      *   **Claim:** Value aggregates linearly across probabilities, and expected value is the sole tiebreaker for rational choice.
      *   **Verdict:** Substantive and contested (rejects risk-weighted or virtue-ethical views).
      *   **Ends Argument?** Only if granted. It defines rationality as utilitarianism.
      *   **Protagonist Reply:** "Expected value is one metric among many; fiduciary duty requires avoiding ruin, not maximizing abstract expectation."

  3.  **The Archimedean and Unboundedness Claim**
      *   **Claim:** No probability is too small to matter if the payoff is sufficiently large; value has no ceiling.
      *   **Verdict:** Substantive and contested (implies "fanaticism" or Pascal's Mugging).
      *   **Ends Argument?** Yes, if accepted. It forces the trade-off.
      *   **Protagonist Reply:** "I reject the axiom; some probabilities are effectively zero for decision-making, and some values are incommensurable."

  4.  **The Epistemic Validity Claim**
      *   **Claim:** The estimated one-in-ten-thousand probability is a calibrated figure comparable to the reliable intervention's payoff estimate.
      *   **Verdict:** Likely false (in this context).
      *   **Ends Argument?** Yes. If inputs are equal, math decides.
      *   **Protagonist Reply:** "One estimate is actuarial; the other is a guess. You cannot multiply a number by a metaphor."

  **Fanaticism and Portfolio Context**
  Distinguish axiological fanaticism (outcomes are ranked this way) from decision-theoretic fanaticism (you must choose this way). Your colleague implies the latter to force action. However, he is likely smuggling in a portfolio defense: if the foundation makes many such bets, the law of large numbers saves them. But this is a single-shot decision for this budget cycle. If the money is gone, it is gone. The "fanaticism tax" applies: funding the long shot directly cannibalizes the sure thing. Unless the foundation can make thousands of independent bets on civilization salvation, the portfolio defense fails here.

  **Clean vs. Muddy Long Shots**
  Your distinction is correct and load-bearing. In "clean" cases (roulette, actuarial tables), probability is a physical property or frequency. In "muddy" cases (unique historical events), probability is subjective credence subject to "meta-uncertainty." If the error bar on the 1/10,000 estimate is large (e.g., it could be 1/1,000,000), the expected value is unstable. This worry cuts against the reliable intervention too, but asymmetrically: the reliable intervention's error is bounded (payoff cannot be negative or infinite), whereas the catastrophe payoff is unbounded and the probability error is multiplicative. The fanatic's best reply is that errors on a log scale are symmetric, so the expectation holds. The stronger reply is that noise is not a heavy tail; unknown unknowns degrade the signal to zero. You cannot lean on a number derived from no track record.

  **Scene Advice**
  Your colleague is most plausibly invoking the **Epistemic Validity Claim** wrapped in the **Hegemony Claim**. He assumes the number is real and that rationality demands maximizing it. The slogan is self-undermining on the Epistemic reading: "do the arithmetic" cannot be obeyed if the inputs are not numbers. If the probability is muddy, the instruction is literally impossible to follow.

  Your protagonist can concede the **Psychological Correction Claim** ("I know my intuition struggles with scale") without conceding the decision. She cannot concede the **Epistemic Validity Claim** without changing her mind. If she accepts the probability is calibrated, the math forces her hand. To win the scene honestly, she must attack the input, not the operation. She should say: "I will multiply anything you give me. But until that probability has a track record, it is not a number, and you are not doing math; you are doing numerology." If the honest verdict is that the probability *is* calibrated, she has to cave. If it is muddy, she stands firm.
