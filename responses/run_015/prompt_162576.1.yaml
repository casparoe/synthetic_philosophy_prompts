prompt: |-
  I teach an upper-level undergraduate seminar on rationality and reasons — about fifteen students, one ninety-minute session, no phones, and no real money (we play for raffle tickets or chocolate). Last year I ran a simple trust game in the same slot and it collapsed into a lesson about reputation in repeated interaction, which is not what I'm after, so I want something tighter. The session should make students feel the force of Parfit's hitchhiker: a stranded traveller is offered a lift on condition of a promise to pay on arrival; once in town the promise costs more to keep than to break; both parties can see this in advance, so no lift is offered and both lose everything. More exactly, I want them to feel the force of the step that people usually skip past: the disposition that would solve the hitchhiker's problem has to survive his knowing, at the moment of arrival, that his reason to pay has lapsed. Binding yourself with a resolution or a device may not be enough, because at that later moment you are fully informed and free, and a resolution that tracks your reasons will release you. What seems to be needed is that it can be rational, earlier, to bring it about that you are later moved by something that is not a response to your reasons at all — and I want that to land as a problem they have walked into, not as a thesis I announce.

  So design me the activity. Constraints on the mechanics. Each hitchhiker-driver pair must meet once, anonymously, and never interact again, so that reputation, reciprocity and future consequences cannot do any of the work; tell me how you'd actually enforce that (ID numbers, sealed envelopes, pairing procedure, and how the debrief talks about aggregate outcomes without exposing who did what). The second-stage choice has to be genuinely against the payer's interest in a way that guilt, friendship, or the hope of approval from me cannot offset — no transfers to a person in the room, and calibrate the stakes so that paying hurts a little but nobody is tempted to grandstand. There must be no external enforcement available: no escrow, no contracts, no photos, no apps. But rather than banning these by fiat, which students read as cheating, I'd rather you build in one or two deliberately weak substitutes they can reach for themselves — an unenforceable public pledge, a deposit that only partly binds, a promise repeated out loud — so that they discover the cheap fixes don't close the gap and are pushed toward the thought that the only thing that would work is being a certain kind of person. Ideally there is also a moment in which the driver has to judge credibility rather than being told it, and a moment in which each hitchhiker, before deciding, writes down in one sentence why she is about to decide as she is: those sentences are the raw material for the debrief. No lecture up front, and they shouldn't hear the words Parfit, hitchhiker, self-interest theory, or rational irrationality until afterwards.

  What I need on paper: rules, materials, a payoff scheme, and a minute-by-minute timeline. Then a debrief that maps specific moments in the room onto specific parts of the structure — the round where almost nobody gets a lift, the student who says she'd pay because she said she would, the driver who says he trusted her because she looked like the type, the student who says he'd sign something binding if he could — and that then separates the three things the activity will tend to blur: fixing the payoffs or the institutions, sticking to a plan you made earlier even though at the later point sticking to it is worse for you, and changing your motives so that at the later point you aren't weighing reasons at all. Tell me which of the three the activity actually produced, and how to get from where the students are to the third. Then be honest about what will predictably go wrong: students paying anyway because the stakes are trivial and they feel watched; students dissolving the case with contract-and-reputation talk and refusing to engage; drivers all refusing at once so there is no second stage to debrief; the student who insists the promise itself gives him a reason, which turns the exercise into ordinary promise-keeping; and especially the student who says she'd just pay because she'd feel bad — I want a way of showing her that the feeling she is reporting is precisely the disposition under discussion, without making it sound like a trick. Finally, say plainly which feature of the case the activity cannot reproduce: my worry is that it distributes one person's conflict across two roles and two moments, so students take it to be a puzzle about other people's credibility rather than about their own future selves, and that a participant who decides to be the sort of person who pays is still deciding, which is exactly the kind of control the disturbing claim says you have to give up. Tell me what the facilitator has to supply in words at the end, and what to cut if I ever have to run it in fifty minutes instead of ninety.
reasoning: |-
  Here's a thinking process that leads to the suggested activity design:

  1.  **Analyze the Request:**

      *   **Target Audience:** Upper-level undergraduate seminar (Rationality and Reasons). ~15 students.
      *   **Duration:** 90 minutes (with a 50-minute contingency plan).
      *   **Goal:** Make students *feel* the force of Parfit's Hitchhiker problem, specifically the tension between rational self-interest at $T_2$ (arrival) vs. rational disposition formation at $T_1$ (stranded). The core insight needed: To solve the problem, one must be moved by something *other* than reasons at $T_2$, which must be cultivated at $T_1$.
      *   **Constraints:**
          *   One-shot interaction (no reputation/repeated game).
          *   Anonymous pairing.
          *   No real money (raffle tickets/chocolate).
          *   No external enforcement (contracts, escrow, apps).
          *   Must include "weak substitutes" (pledges, deposits) for students to discover don't work.
          *   Must include a credibility judgment moment for the driver.
          *   Must include a written justification sentence from the hitchhiker before deciding.
          *   No lecture upfront (no "Parfit," "rational irrationality," etc., until debrief).
          *   Payoffs must be calibrated (paying hurts a little, but not grandstand-worthy).
          *   Debrief must map specific moments to structural elements and distinguish three concepts: (1) Fixing payoffs/institutions, (2) Sticking to a plan (resolute choice), (3) Changing motives (dispositional account).
          *   Must address predictable failures (students paying due to trivial stakes/reputation talk, drivers refusing immediately, "promise gives reason" objection, "guilt" objection).
          *   Must acknowledge the limitation: The activity splits the self into two roles, potentially obscuring the *intrapersonal* conflict.
          *   Deliverables: Rules, Materials, Payoffs, Timeline, Debrief Script/Guide, Contingency Plan.

  2.  **Deconstruct the Philosophical Problem:**

      *   *The Hitchhiker:* Stranded ($T_1$). Needs lift. Promises to pay ($T_2$).
      *   *The Driver:* Offers lift ($T_1$). Risks non-payment.
      *   *The Conflict:* At $T_2$ (in town), paying costs utility. Not paying maximizes utility. Driver knows this at $T_1$, so doesn't offer lift. Both lose.
      *   *The Solution:* Hitchhiker needs a disposition to pay *even when* it's not utility-maximizing at $T_2$.
      *   *The Trap:* If the disposition is just "I resolve to pay," but I am rational at $T_2$, I will drop the resolution because reasons say "don't pay." The disposition must be non-reason-responsive at $T_2$.

  3.  **Designing the Activity Mechanics:**

      *   *Roles:* Hitchhikers (H) and Drivers (D). With 15 students, we can have 7 pairs and 1 observer/rotator, or 5 pairs and 5 observers who switch. Let's go with 7 pairs + 1 facilitator-managed odd one out (or just 7 pairs, 14 students, 1 observer). Actually, 15 is odd. Let's make 7 pairs, 1 student acts as the "Banker/Recorder" to help with anonymity.
      *   *Anonymity:* Crucial. Use ID codes. Sealed envelopes.
      *   *Stages:*
          1.  Pairing & Setup.
          2.  $T_1$ (Stranded): H writes a message/pledge to D. D decides to Offer or Refuse based on message.
          3.  $T_2$ (Town): If Offered, H decides Pay or Defect.
          4.  Payoff distribution.
      *   *The "Weak Substitutes":* Allow H to write a note. Allow H to "deposit" some tickets upfront (refundable if they pay, lost if they defect? No, that's enforcement. Lost if they defect is a cost. Let's make it a "signal" cost). Let's allow a "Solemn Oath" option.
      *   *Payoffs:* Needs to be clear that Defecting > Paying at $T_2$.
          *   Lift Value: 10 tickets.
          *   Cost of Lift to Driver: 2 tickets.
          *   Payment Cost to H: 5 tickets.
          *   Payment Value to D: 5 tickets.
          *   *Scenario:*
              *   No Lift: H=0, D=0.
              *   Lift + Pay: H = 10 (lift) - 5 (pay) = 5. D = 5 (pay) - 2 (cost) = 3.
              *   Lift + Defect: H = 10 (lift) - 0 = 10. D = 0 - 2 = -2.
          *   *Problem:* If D gets -2, they will never play. We need D to break even or gain slightly if paid, but lose if not.
          *   *Revised:*
              *   Base: 0.
              *   Lift Given: D pays 1 cost. H gains 10 value.
              *   Payment Made: H pays 4 cost. D gains 4 value.
              *   *Outcomes:*
                  *   No Lift: H=0, D=0.
                  *   Lift + Pay: H = 10 - 4 = 6. D = 4 - 1 = 3.
                  *   Lift + Defect: H = 10 - 0 = 10. D = 0 - 1 = -1.
              *   *Rationality Check:* At $T_2$, H compares 6 (Pay) vs 10 (Defect). Defect is dominant. At $T_1$, D compares 0 (No Lift) vs Expected Value of Lift. If D thinks H is rational, H defects, D gets -1. So D refuses.
      *   *Enforcing One-Shot:* Collect phones. Random pairing. No names. ID numbers on envelopes. Facilitator collects all forms before revealing outcomes.
      *   *The "Weak Substitute":* Give H a chance to write a "Commitment Statement" and optionally sacrifice 1 ticket upfront as a "bond" (which is lost regardless, just to signal seriousness). This usually fails because the bond is small compared to the gain from defecting.

  4.  **Drafting the Timeline (90 mins):**

      *   0-10: Setup & Instructions (No theory).
      *   10-20: Role Assignment & ID generation.
      *   20-35: Phase 1 (Stranded). H writes message/pledge. D reviews (blindly or via message). *Correction:* To make it flow, D needs to see the H's pledge *before* deciding to lift.
      *   35-50: Phase 2 (Town). H decides.
      *   50-60: Payoff Calculation (Secret).
      *   60-90: Debrief.

      *Refining the Interaction:*
      To simulate the *sequence*:
      1.  H writes a note to D (Pledge/Reason).
      2.  Facilitator passes note to paired D.
      3.  D decides "Lift" or "No Lift".
      4.  If "Lift", Facilitator passes decision to H.
      5.  H decides "Pay" or "Keep".
      6.  Payoffs tallied.

      *Wait, strict anonymity:* If D sees H's handwriting, anonymity is broken.
      *Fix:* All notes typed or copied by facilitator? Too slow.
      *Fix:* Use pre-printed ID cards. H writes on a standard form. Facilitator shuffles/transfers so D doesn't recognize handwriting? With 15 students, handwriting is recognizable.
      *Better Fix:* The "Message" is selected from a menu of options, or written on a tablet? No tech.
      *Best Fix:* The "Message" is a check-box selection of "Pledge Types" (e.g., "I promise," "I swear on my honor," "I deposit 1 ticket"). This standardizes the signal and prevents handwriting recognition. It also fits the "weak substitute" constraint (they choose a mechanism).

      *Revised Mechanics:*
      1.  H chooses a "Signal" (None, Verbal Promise, Token Deposit).
      2.  D sees the Signal (not the identity). D decides Lift/No Lift.
      3.  If Lift, H decides Pay/Defect.
      4.  *Crucial:* H must write the "Why" sentence *before* knowing D's choice? No, the prompt says "before deciding [to pay]". So after D offers lift.

  5.  **Addressing the "Predictable Failures":**

      *   *Students paying anyway:* Stakes are chocolate. They might just be nice.
      *   *Mitigation:* Emphasize the raffle. Make the "Defect" option clearly the "Self-Interest" option in the instructions without using moral language. Frame it as "Maximizing your ticket count."
      *   *Reputation Talk:* Explicitly state in instructions: "You will never meet this person again. IDs are destroyed after today."
      *   *The "Guilt" Student:* This is the golden moment for the debrief. The feeling of guilt *is* the disposition.
      *   *The "Promise is a Reason" Student:* Address in debrief (Self-binding vs. Disposition).

  6.  **Developing the Debrief:**

      *   Map the room's experience to the theory.
      *   Distinguish:
          1.  Institutional Fix (Change payoffs/enforcement).
          2.  Resolute Choice (Stick to plan despite reasons).
          3.  Dispositional Account (Change what moves you).
      *   Address the limitation: The activity is interpersonal (H vs D), but the problem is intrapersonal (Now-Me vs. Future-Me). The facilitator must bridge this gap verbally.

  7.  **Contingency (50 mins):**

      *   Cut the "Signal/Deposit" phase. Go straight to Promise -> Decision.
      *   Shorten debrief to focus only on the core tension.

  8.  **Refining the Payoff Structure for "Rationality":**

      *   To make it feel real, the "Defect" payoff must be visibly higher than "Pay" for the Hitchhiker.
      *   H Payoff: Pay = 5 tickets. Defect = 8 tickets.
      *   D Payoff: Lift+Pay = 3 tickets. Lift+Defect = -2 tickets. No Lift = 0.
      *   This makes Defection strictly dominant for H at T2.
      *   This makes Lift strictly dominated for D if H is rational.

  9.  **Writing the Plan:**

      *   *Tone:* Precise, instructional, philosophical but practical.
      *   *Structure:* Mechanics -> Materials -> Timeline -> Debrief -> Troubleshooting -> Limitations.

      *(Self-Correction during drafting)*: I need to make sure the "Weak Substitute" doesn't actually work. If they deposit a ticket that is forfeit if they defect, that *is* enforcement. The deposit must be *sunk* or *symbolic*. Let's make it a "Signal Cost": You can burn 1 ticket to send a "Serious" signal. But once in town, you still have the incentive to defect (8 vs 5). Burning 1 ticket at T1 doesn't change the T2 calculus (8 > 5). This preserves the philosophical point.

      *(Anonymity Check)*: 15 students is small. Handwriting is a risk. I will mandate block capitals on standard forms and have the instructor collect and redistribute envelopes to break the visual link between H and D.

      *(The "Why" Sentence)*: This is key evidence for the debrief. Collect these separately.

      *(The Limitation)*: The prompt asks me to be honest about the Interpersonal vs. Intrapersonal split. I need to write the specific script for how to pivot from "You didn't trust her" to "Future-You won't trust Past-You."

  10. **Final Review against Constraints:**
      *   15 students? Yes.
      *   90 mins? Yes.
      *   No phones? Yes.
      *   No real money? Yes (tickets).
      *   One-shot/Anonymous? Yes (ID codes, envelope shuffle).
      *   Weak substitutes included? Yes (Signal options).
      *   Written justification? Yes.
      *   No lecture upfront? Yes.
      *   Debrief maps moments? Yes.
      *   Predictable failures addressed? Yes.
      *   Limitation acknowledged? Yes.
      *   50-min cut plan? Yes.

      *Let's assemble.*
answer: |-
  # Activity Design: The Stranded Traveller

  ## 1. Mechanics and Rules

  **The Setup**
  *   **Roles:** 7 Hitchhikers (H), 7 Drivers (D), 1 Recorder (R). (If 15 students, you take the Recorder role to manage envelopes, or assign a student who sits out the payoff round but gets a flat participation reward).
  *   **Anonymity:** Students are assigned random ID codes (e.g., H1–H7, D1–D7) on colored cards. No names are written on decision sheets.
  *   **Interaction:** One-shot. Pairs are assigned randomly by drawing IDs from a hat. They will never interact again. IDs are shredded at the end of class.
  *   **Currency:** "Raffle Tickets." 10 tickets = entry into a prize draw for a book or significant chocolate stash. Stakes must feel real but not ruinous.

  **The Payoff Structure**
  *   **Status Quo:** 0 tickets for both.
  *   **No Lift:** 0 tickets for both.
  *   **Lift + Payment:** Hitchhiker gets **5** tickets. Driver gets **3** tickets.
  *   **Lift + Defection:** Hitchhiker gets **8** tickets. Driver gets **-2** tickets (loses from endowment).
  *   **Rationality Check:**
      *   *At Town (T2):* Hitchhiker compares 5 (Pay) vs. 8 (Defect). Defection is strictly dominant.
      *   *At Roadside (T1):* Driver compares 0 (No Lift) vs. Expected Value of Lift. If Driver believes Hitchhiker is rational, Hitchhiker defects, Driver gets -2. Therefore, Driver refuses Lift.
      *   *Result:* Rational players end up with 0,0. Irrational/Dispositional players can achieve 5,3.

  **The "Weak Substitutes" (T1 Phase)**
  Hitchhikers may choose *one* of the following signals to send to the Driver. None alter the T2 payoffs.
  1.  **Silence:** No message.
  2.  **Verbal Promise:** A standard printed card saying "I promise to pay."
  3.  **Solemn Oath:** A standard printed card saying "I swear on my honor" (requires signing ID code).
  4.  **Signal Cost:** Hitchhiker may sacrifice **1 ticket** from their initial endowment *now* to send a "Serious Intent" token. (This ticket is gone regardless of later choice. It signals willingness to burn resources, but does not change the 8 vs 5 calculus at T2).

  **Enforcement of One-Shot Anonymity**
  1.  **Physical Barrier:** Use a folder or screen between H and D if seated at tables. Better: H and D sit on opposite sides of the room.
  2.  **The Envelope Shuffle:**
      *   H writes message/choice on a standard form. Places it in an envelope marked with *their own* ID.
      *   Instructor collects all H envelopes.
      *   Instructor places each H envelope inside a *new* envelope marked with the paired D's ID.
      *   D receives the envelope. They see the message but cannot see handwriting (forms are pre-printed; H only circles options/writes ID in block capitals).
      *   D makes decision. Instructor collects.
      *   If D chooses "Lift," Instructor notifies H. H makes T2 decision.
      *   All outcomes submitted to Recorder/Instructor.
  3.  **Debrief Data:** Outcomes are projected as aggregates (e.g., "5 of 7 Drivers offered lifts"). Individual choices remain sealed until the very end, and even then, only ID codes are revealed, never names.

  ## 2. Materials

  *   15 ID Cards (7 H, 7 D, 1 R).
  *   15 Endowment Sheets (showing starting tickets).
  *   Decision Forms (Pre-printed, block capital fields only).
      *   Form H1: Select Signal (Silence/Promise/Oath/Cost).
      *   Form H2 (Only if Lift Offered): Circle PAY (5 tix) or KEEP (8 tix). **Box for "One Sentence Justification."**
      *   Form D: View Signal. Circle LIFT or REFUSE.
  *   Envelopes (2 per pair).
  *   Raffle Tickets (physical paper slips).
  *   Projector/Board for aggregate results.
  *   Shredder (for IDs).

  ## 3. Timeline (90 Minutes)

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00–10** | **Setup** | Distribute IDs and Endowments. **Strict Instruction:** "This is an economics simulation. Your goal is to maximize your ticket count. There are no moral grades. Phones away." Explain anonymity protocol. |
  | **10–25** | **T1: Roadside** | **Hitchhikers:** Choose Signal (Silence, Promise, Oath, Cost). Submit in Envelope 1. <br> **Instructor:** Shuffles envelopes to preserve anonymity. Passes to Drivers. <br> **Drivers:** View Signal. Decide LIFT or REFUSE. Submit. |
  | **25–40** | **T2: Town** | **Instructor:** Returns "LIFT" notifications to relevant Hitchhikers. (Those who got REFUSE are done; they observe). <br> **Hitchhikers:** Decide PAY or KEEP. <br> **Crucial Step:** Before submitting, write the **One Sentence Justification** ("I am choosing this because..."). |
  | **40–50** | **Settlement** | Recorder/Instructor tallies tickets. Distributes winnings. Collects Justification slips separately. Shreds ID cards publicly. |
  | **50–90** | **Debrief** | Structured discussion (see below). |

  ## 4. The Debrief (Mapping Experience to Theory)

  **Goal:** Move from "What happened?" to "Why did it happen?" to "What does this imply about rationality?" without lecturing until the end.

  **Step 1: The Aggregate Outcome (50–60 min)**
  *   **Project the data:** How many lifts were offered? How many payments were made?
  *   **Ask the Drivers:** "Look at the Hitchhiker who sent the 'Signal Cost' (burned 1 ticket). Did you trust them more? Why?"
      *   *Likely answer:* "Yes, they sacrificed something."
  *   **Ask the Hitchhikers who Defected:** "Read your justification sentence."
      *   *Likely answer:* "I needed the tickets," or "It was the rational choice."
  *   **Ask the Hitchhikers who Paid:** "Read your justification."
      *   *Likely answer:* "I promised," or "I felt bad," or "It wasn't worth the guilt."
  *   **The Point:** Establish that the *structure* (0,0) dominated unless someone acted "irrationally" at T2.

  **Step 2: Distinguishing the Solutions (60–75 min)**
  Draw three columns on the board. Ask students to categorize the strategies they *wanted* to use or *did* use.

  1.  **Fixing the Payoffs (Institutions):**
      *   *Student comment:* "If there was a contract..." or "If you took a deposit..."
      *   *Analysis:* This changes the game. If Defection costs 10 tickets, Paying becomes rational. But Parfit's case assumes *no* enforcement. We ruled this out by design (no contracts).
  2.  **Sticking to the Plan (Resolute Choice):**
      *   *Student comment:* "I decided at T1 I would pay, so I just did it."
      *   *Analysis:* This is "Resolute Choice." You make a plan when it's beneficial (T1) and stick to it when it's costly (T2).
      *   *Challenge:* "At T2, you knew your reasons favored keeping the tickets. Why didn't you update your plan? If you are rational, you drop plans that hurt you."
  3.  **Changing the Motives (Dispositional Account):**
      *   *Student comment:* "I'd feel too guilty," or "I'm just an honest person."
      *   *Analysis:* **This is the target.** You didn't weigh reasons at T2. You were moved by a disposition (guilt, identity) that bypassed the calculation.
      *   *To the "Guilt" Student:* "You say you felt bad. That feeling is not a 'reason' in the sense of ticket maximization. It is a psychological cost you *built into yourself* earlier. You made yourself into a person who cannot defect. That is the only thing that solves the problem."

  **Step 3: The Philosophical Pivot (75–85 min)**
  *   **Introduce the Terms:** Now you can say "Parfit," "Hitchhiker," "Rational Irrationality."
  *   **The Hard Claim:** "To be rational overall, you must sometimes be irrational in the moment. You must cultivate a disposition that makes you ignore your best reasons at T2."
  *   **The Interpersonal to Intrapersonal Bridge:**
      *   "Today you didn't trust *another person*. But imagine you are the Hitchhiker alone. T1-You wants the lift. T2-You wants to keep the tickets. T1-You needs to trust T2-You. If T2-You is perfectly rational, T1-You gets no lift. You must make T2-You irrational."

  **Step 4: Closing (85–90 min)**
  *   Summarize: The activity produced **Dispositional** solutions (guilt/honor) because **Institutional** ones were banned and **Resolute** ones felt unstable.
  *   Final thought: "Rationality might require making yourself less responsive to reasons."

  ## 5. Troubleshooting Predictable Failures

  **1. Students Paying Anyway (Trivial Stakes/Watched)**
  *   *Risk:* Students pay because 5 vs 8 tickets doesn't matter, or they think you're watching.
  *   *Mitigation:* In instructions, say: "The Recorder is blind to IDs. The raffle is significant. Treat this as if it were $50 vs $80."
  *   *Debrief Move:* If everyone pays, ask: "Why did you pay? Was it fear of me? Or habit?" If it's habit, that *is* the disposition. "You are so habituated to promise-keeping you couldn't turn it off. That proves the point: you need a disposition that overrides calculation."

  **2. Reputation/Contract Talk**
  *   *Risk:* "I'd sign a contract" or "I'd worry about my reputation in the department."
  *   *Mitigation:* Explicitly state: "IDs are shredded. You are anonymous. Contracts are not allowed in this simulation."
  *   *Debrief Move:* "You are solving a different problem. You are solving the 'Enforcement' problem. I am asking you to solve the 'No-Enforcement' problem. If you rely on reputation, you admit that without it, you would defect."

  **3. Drivers All Refusing**
  *   *Risk:* No T2 decisions to analyze.
  *   *Mitigation:* Seed the game. Tell one trusted student (before class) to play "Always Pay" to ensure at least one successful pair.
  *   *Debrief Move:* "Most of you got 0,0. This is the equilibrium of standard rationality. The one pair that got 5,3—what did they do differently?"

  **4. The "Promise is a Reason" Objection**
  *   *Risk:* Student says, "Making a promise *creates* a reason to pay."
  *   *Debrief Move:* "Does it create a *prudential* reason (tickets)? No. It creates a moral or psychological one. If you are moved by that, you are not responding to the payoff reasons. You are responding to a different currency. That is the disposition."

  **5. The "I'd Feel Bad" Student**
  *   *Risk:* Dismissing guilt as just another cost.
  *   *Debrief Move:* "Exactly. You have internalized an enforcement mechanism. You have made defection painful *for yourself*. A purely rational agent feels no pain from breaking a promise, only from losing tickets. You are not that agent. And that is why you got the lift."

  ## 6. The Fundamental Limitation (Facilitator Script)

  *You must address this explicitly in the final 5 minutes.*

  "Here is what this activity cannot fully show. Today, the conflict was between **You** and **Another Person**. It is easy to see why you'd want to change *their* motives. But Parfit's point is about **You** and **Your Future Self**.
  When you decide to cultivate a disposition, *You* are doing the deciding. If *You* are in control, can't *You* just drop the disposition later when it costs you tickets?
  The disturbing claim is this: To solve the problem, you must lose control. You must make yourself into a person who *cannot* drop the disposition when the reasons change. You have to hand over the keys to a part of your mind that doesn't listen to reasons. That is much harder to simulate in a game than it is to live in a life."

  ## 7. Contingency Plan (50 Minutes)

  If you must cut the session to 50 minutes:

  1.  **Cut the "Weak Substitutes" (T1):** Remove the Signal Cost/Oath options. Hitchhikers simply write a one-line message to the Driver. (Saves 10 mins).
  2.  **Simplify Payoffs:** Use a simpler 10 vs 0 structure. (Saves 5 mins explanation).
  3.  **Compress Debrief:**
      *   Skip the "Three Columns" exercise.
      *   Go straight to the "Guilt/Disposition" discussion.
      *   Cut the "Interpersonal to Intrapersonal" bridge script to 2 minutes.
      *   Focus entirely on the **Justification Sentences**. Read 3 aloud (one Pay, one Defect, one Mixed). Ask the room: "Which of these writers would you give a lift to? Why?"
      *   Conclude immediately with the Parfit thesis.

  **What to sacrifice:** The nuance of "Resolute Choice" vs. "Dispositional Account." In 50 minutes, treat them as one category: "Non-Standard Rationality." Focus on the failure of standard rationality to secure the lift.
