      Mathematically, the Expected Value is the same. The friend's point doesn't reduce the *expected* moral weight, it just changes the *risk profile*. It means we are either causing massive harm or no harm, rather than moderate harm. This actually strengthens the precautionary principle against killing, *unless* the alternative (invasion) causes even *more* expected harm.
