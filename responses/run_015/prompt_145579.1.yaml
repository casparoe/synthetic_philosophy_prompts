          *   The "certain harm" of treatment is concentrated. The "speculative harm" of invasion is diffuse but potentially larger (ecosystem collapse).
      *   **Recommendation:** Don't let the perfect be the enemy of the good. The committee's mandate is to protect the reserve's *existing* biodiversity (birds + native invertebrates). Abandoning that mandate based on highly speculative insect ethics is risky.

  4.  **Drafting the Response (Iterative refinement):**

