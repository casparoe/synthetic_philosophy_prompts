          *   *Friend's Logic:* Killing ants is certain harm. Saving birds is speculative. Ants swamp birds. Therefore, don't kill ants.
          *   *Flaw in Friend's Logic:*
              1.  **Substitution:** If we don't kill the invasive ants, they will likely kill native invertebrates (other insects). So it's not "Ants vs. Birds," it's "Invasive Ants vs. Native Insects + Birds." If all insects count morally, swapping one insect population for another might be neutral, *unless* the invasive ants cause *more* suffering (e.g., by destabilizing the ecosystem leading to more starvation/predation cycles).
