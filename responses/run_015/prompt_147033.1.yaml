  hey so my grandma died last month and i've been reading that old chinese text zhuangi (sp?) to deal with it. there's a passage where he finds a skull and asks if it wants to come back, and the skull says no it's like sleeping in a big room. then he compares death to the four seasons turning, like it's just nature rotating. but i'm stuck. my friend says this means grief is basically a mistake — you're just clinging to form. but that seems too harsh, and he cries when his own friend dies in another part? i can't tell if he's being consistent or if the point is just that the line between life and death is blurrier than we think. there's also this idea that his argument only works if you treat human consciousness as no more special than a rock's, which feels wrong. can you walk me through the reasoning in the skull part and tell me whether the seasons comparison is meant literally or as a metaphor? and am i mixing up the crying story with a different text?
