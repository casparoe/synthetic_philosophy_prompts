answer: |-
  **Brainstorming: Purpose and Least Charitable Reading**

  Before reconstructing the theory, I need to step back and ask what this assessment regime is actually doing. Charitably, it is trying to certify *portable competence*. A university degree is a signal to employers and the public that the holder possesses specific internalized capacities that will function reliably across varied contexts, including those where specific tools might be unavailable. The rules attempt to isolate the biological organism's contributions from the scaffold's contributions to ensure the organism itself has been modified by education. However, the least charitable reading suggests this is ritualistic gatekeeping disguised as epistemic rigor. The distinctions often track administrative convenience rather than cognitive reality: handwritten notes are harder to mass-produce and share than printed solutions, so they are permitted as a "compromise" that actually tests compliance and summarization skills rather than memory. The accommodation distinction looks particularly suspect; it implies that cognitive enhancement is only legitimate if mandated by a medical diagnosis, turning the "extended mind" into a medical device rather than a universal human capacity. This reading suggests the system is not protecting the integrity of knowledge, but protecting the scarcity value of the degree by enforcing a specific, traditional mode of cognitive labour that privileges those who naturally align with biological internalism.

  ***

  **[Section 1: Reconstruction of the Implicit Theory]**
  *(Speaking as a Philosopher of Mind)*

  Your committee's current patchwork presupposes a robust form of **Internalism** regarding the boundaries of the cognitive agent, coupled with a **Portability Constraint** on certification. The rules operate on the assumption that the "self" who is being examined ends at the skin and skull. Any resource outside this boundary is treated as merely causally influential, never constitutively involved in the cognitive process itself. This is why the system violates the **Parity Principle**—the idea that if a process were performed in the head, we should treat it as cognitive, and if performed by an external tool, we should treat it similarly. Your rules do the opposite: mental arithmetic is certified, calculator arithmetic is often banned; internal spelling knowledge is certified, software-assisted spelling is restricted.

  The system relies on a specific taxonomy of external resources that distinguishes between **Passive Storage** and **Active Processing**. Handwritten notes or formula sheets are permitted because they are viewed as external hard drives: they store information that the student must still retrieve, interpret, and apply using internal processing power. They are static. Conversely, autocomplete, calculators, and pre-written solutions are banned because they perform the *processing* work (generating sentence structures, computing values, solving problem types). The implicit theory holds that cognitive *credit* belongs only to the biological processor, not the tool that processes.

  Regarding the criteria for extension (often summarized as constant availability, automatic endorsement, and easy access), your rules acknowledge them only to reject them as sufficient for certification. A student's notebook is reliably available and easily accessible during study, but the exam environment deliberately severs this coupling. The system assumes that for knowledge to be "one's own" (as per your honour code), it must be internalized such that it survives the removal of the scaffold. The "ownership" clause in the honour code presupposes a metaphysics of **Biological Possession**: a belief or skill is yours only if it is instantiated in your neural architecture. If you rely on an external artifact to generate the output, the output is not "your own," even if you initiated the process. Thus, the system is not merely testing performance; it is testing the locus of cognitive residence.

  ***

  **[Section 2: Diagnosis of Coherence and Metaphysical Commitments]**
  *(Speaking as a Philosopher of Mind)*

  Does this practice require the Extended Mind Thesis (EMT) to be false? No. The rules are compatible with EMT, provided we accept that the university is interested in certifying a specific *subset* of cognitive systems: the biological substrate. EMT claims that tools *can* become part of the mind under certain conditions. Your rules simply stipulate that for the purpose of grading, they *must not* count as part of the mind. This is a policy choice, not a metaphysical necessity. However, the storage-versus-processing distinction your rules rely on does not survive strict scrutiny. In cognitive science, retrieval from memory is a reconstructive process, not a simple read-out. Similarly, using a formula sheet involves complex processing to apply the formula. The line between "store" and "processor" is porous. A calculator stores algorithms; a brain stores neural weights. The distinction is one of degree, not kind.

  Is the practice better explained without metaphysics? Yes. The rules are most coherently understood as **Risk Management and Credit Assignment** protocols. They are not defining what a mind *is*, but what a degree *signifies*. If a degree certifies that a student can function in a low-scaffold environment (e.g., a crisis where technology fails), then banning tools is rational regardless of whether those tools are technically part of the mind. This view is underdetermined by metaphysics: an Internalist, an Extended Mind theorist, and even a Dualist could agree on these rules if they agree on the goal of certifying biological portability. The metaphysical language of "ownership" is doing heavy lifting where pragmatic language about "competency conditions" would suffice.

  The most significant inconsistency lies in the accommodation policy. Metaphysically, there is no difference between a student with dysgraphia using dictation software and a neurotypical student using the same software. Both are coupling with an external system to produce text. The current rule implies that the software becomes part of the mind only when the biological hardware is damaged. This is metaphysically incoherent. It suggests that "normal" cognition must be unaided, while "abnormal" cognition is permitted to be hybrid. This is not a distinction found in cognitive science, but a social distinction regarding fairness and baseline expectations.

  ***

  **[Section 3: The Counterfactual and Recommendations]**
  *(Speaking as a University Administrator/Advisor)*

  If the committee took the Extended Mind Thesis seriously as a guiding principle rather than a threat, the assessment landscape would shift from testing *isolation* to testing *integration*. However, this does not necessarily mean "open book everything." If we accept that cognition often extends into tools, the exam should test the student's ability to manage that extended system reliably.

  **1. The Closed-Book Analogy:**
  Is a closed-book exam akin to testing a student with part of her memory disabled? Under EMT, yes, if the student has reliably integrated a notebook into their cognitive workflow over a long period. Removing it is functionally similar to inducing temporary amnesia for that data. However, the analogy fails if the goal of the exam is to test the *biological* capacity specifically. If we are licensing surgeons, we need to know if their biological memory holds critical data when the power fails. Therefore, closed-book exams are not inherently unjust under EMT, but they must be justified by the *portability requirement* of the specific discipline, not by default.

  **2. Ownership and the Honour Code:**
  The phrase "presenting as one's own... that is not one's own" needs revision. Under an EMT-informed view, "ownness" is not about biological location but about **responsible coupling**. A student owns the output if they have critically endorsed it and understand its derivation, regardless of whether a tool generated the draft. The honour code should shift from policing the *source* of the cognition to policing the *authority* over the cognition. Cheating becomes not "using a tool," but "deferring judgment to a tool without verification."

  **3. Accommodations vs. Cheats:**
  This is where we are most inconsistent. If dictation software is a legitimate cognitive prosthesis for one, it is a legitimate tool for all, provided the learning outcome isn't specifically "handwriting fluency." The distinction should not be medical diagnosis vs. non-diagnosis, but **Learning Outcome Alignment**. If the course certifies "ability to compose text," dictation should be allowed for everyone. If it certifies "ability to handwrite," it should be banned for everyone (or offered as a specific track). The current system creates a perverse incentive where students seek medical diagnoses to access better cognitive tools. We should move toward **Universal Design**: allow the tool for everyone, but adjust the grading rubric to assess the cognitive skill we actually care about (e.g., argument structure vs. spelling).

  **Specific Recommendations for the Committee:**

  1.  **Drop the Metaphysics:** Remove language about "own knowledge" from the honour code. Replace it with "authorized resources." This acknowledges that the restriction is procedural, not ontological.
  2.  **Justify Restrictions by Portability:** For every ban on a tool (calculators, notes), require the course instructor to submit a brief statement on why *biological internalization* of that specific skill is necessary for future professional safety or competence. If it isn't necessary, allow the tool.
  3.  **Standardize Accommodations:** Decouple tool access from medical diagnosis. If a tool is permitted as an accommodation, it should be available as a standard option for all students, unless the specific learning outcome is the unaided performance of that task. This dissolves the inconsistency without lowering standards.
  4.  **Process vs. Product:** For tools that process information (autocomplete, solvers), shift assessment from the final output to the *workflow*. Require students to submit logs or annotations showing how they verified the tool's output. This tests the "automatic endorsement" criterion of EMT—ensuring the student remains the active cognitive agent even when using powerful scaffolds.

  *(Speaking as a Philosopher of Mind)*
  I defend the claim that the storage/processing distinction is untenable without further qualification. Retrieval is processing. I also defend the claim that the accommodation policy is metaphysically inconsistent, even if legally pragmatic. However, I concede that the Extended Mind Thesis does not *force* us to allow all tools in exams; it merely forces us to be honest about *why* we ban them. We ban them to test the biological organism, not because the tool isn't part of the mind. Once the committee admits this, the hypocrisy vanishes, and the rules can be evaluated on their educational merits rather than their metaphysical pretensions.
