answer: |-
  Here is your Q&A prep sheet. I have ordered these by **Damage Potential** (how likely they are to derail your thesis), not just by who speaks first.

  ### **Strategic Concession (Say this in your opening)**
  **The Concession:** "I want to start by acknowledging that paper passes were easy to forge, easy to lose, and hard to track in an emergency. This app *does* solve those problems. I am not arguing for a return to paper. I am arguing that because this tool works *too* well, it has quietly rewritten the social contract of the hallway."
  **Why:** This disarms the AP (who bought it) and the Company Rep (who sold it). It proves you aren't just a kid who wants to skip class; you are analyzing the *system*.

  ---

  ### **Q&A Prep Sheet**

  #### **1. The Company Rep (Highest Damage)**
  **The Objection:** "I think there's a misunderstanding of the backend. The 'expiration' isn't a punishment; it's a safety timestamp. If a student is in the hallway past the allotted time, the system flags it so we know they aren't injured or lost. The log isn't a 'permanent record' for discipline; it's metadata for optimization. We don't punish glitches."
  **Why it hurts:** They are the "Expert." If they say you're technically wrong about how the data is used, your premise collapses.
  **Your Reply:** "I understand the safety intent. But when a pass expires silently, the student hasn't *chosen* to break a rule; the timer has chosen it for them. If that 'metadata' is ever pulled for a disciplinary meeting, the distinction between 'late' and 'skipping' is gone. Safety doesn't require silent expiration; it requires notification."
  **Weakest Point:** You don't know for a fact how the data is used in disciplinary hearings. They might have a policy you haven't seen.
  **Counter-move:** "Can we agree that if this data is used for discipline, a student must be notified the moment a pass expires, rather than finding out weeks later?"

  #### **2. The Assistant Principal (High Damage)**
  **The Objection:** "We bought this to increase accountability. If a student can't make it back from the bathroom in 5 minutes, that is a time-management issue, not a system issue. We need to know who is in the building and where. This creates a culture of responsibility."
  **Why it hurts:** They hold the power. They frame this as "Responsibility vs. Irresponsibility." You look like you want less responsibility.
  **Your Reply:** "Paper passes required responsibility too. The difference is, with paper, a teacher had to *witness* the infraction and decide if it mattered. Now, the system decides automatically. We are moving from 'trusted until proven otherwise' to 'logged until proven innocent.' That changes how students feel about school, even if they follow every rule."
  **Weakest Point:** The AP cares about liability and truancy stats, not "how students feel."
  **Counter-move:** "Does the system allow for teacher discretion to override a late log without a formal administrative process?"

  #### **3. The Parents (Medium/High Damage)**
  **The Objection:** "Honestly, as a parent, I'd rather know exactly where my child is. If the app keeps them safe and stops them from wandering, isn't the 'permanent record' a small price to pay for peace of mind?"
  **Why it hurts:** It frames your argument as privileged. "You care about privacy; I care about my kid's safety."
  **Your Reply:** "I agree safety is priority one. But right now, the app creates a record of 'violations' that might not be real violations. If my pass expires because the bathroom line was long, and that goes on a record, I'm being penalized for infrastructure issues, not behavior. Safety shouldn't mean scoring every minute of a child's day."
  **Weakest Point:** Parents are emotionally driven by safety. Logic often loses to "what if something happens."
  **Counter-move:** "We can have safety logs without turning normal delays into disciplinary marks."

  #### **4. The History Teacher (Medium Damage)**
  **The Objection:** "Look, guns don't kill people. An app doesn't change the rule. The rule is 'be back in 5 minutes.' Whether it's on paper or an iPhone, if you're not back, you broke the rule. Stop blaming the tool for lack of discipline."
  **Why it hurts:** It simplifies your nuanced argument into "Follow the rules." It makes you sound like you're splitting hairs.
  **Your Reply:** "With respect, the tool *does* change the rule. On paper, breaking the rule required a human to catch you and judge the context. Now, the rule is broken by a server clock, regardless of context. It's not about the tool; it's about removing the human judgment from the enforcement."
  **Weakest Point:** He will likely repeat his slogan. It's a philosophical deadlock.
  **Counter-move:** Don't get stuck. Nod and say, "I hear you, but I'm asking us to look at the enforcement mechanism, not the rule itself."

  ---

  ### **The "Must-Land" Reply**
  There is one moment where you cannot be vague. When they ask **"What is the actual harm?"** you need to hit this hard:

  **The Reply:** "The harm is that we are normalizing a system where you can be guilty without knowing you committed a crime. With paper, you knew you were late. With this, the rule happens to you. If we teach students that authority is invisible, automatic, and unappealable, we aren't teaching responsibility. We're teaching compliance. And this committee didn't vote to change the school's philosophy from education to compliance."

  ### **The Question You Hope Nobody Asks**
  **"So, what is your specific proposal? Do you want us to turn off the expiration timer? Do you want the logs deleted?"**

  **Why it's dangerous:** If you say "Turn it off," you look like you want to remove safety. If you say "Delete logs," you look like you want to hide truancy. They want a technical fix; you are offering a philosophical critique.
  **How to handle it:** Do not offer a technical toggle. Offer a policy guardrail.
  **The Answer:** "My proposal isn't technical; it's policy. Keep the timer for safety. But 1) Notify the student immediately when a pass expires, and 2) Prohibit these logs from being used in disciplinary records without a human review. Keep the tech, lose the surveillance."

  ### **Final Advice**
  *   **Watch the Company Rep:** He will try to nod and agree with you ("We hear your concerns") without committing to change. Pin him down. Ask for "Yes/No" answers on data usage policies.
  *   **Don't Fight the AP Alone:** Glance at your CS teacher when you talk about the "silent expiration." Get a non-verbal nod. It shows you aren't the only one thinking this.
  *   **Tone Check:** You are not a complainant; you are a stakeholder. Speak slowly. If you sound angry, you're just a kid. If you sound calm, you're a witness.

  Good luck. You've spotted something real. Make them see it.
