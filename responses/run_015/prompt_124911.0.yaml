          *   *History Teacher:* Skeptic/Traditionalist. Uses "guns don't kill people" rhetoric (implies focus on intent over tool).
          *   *Assistant Principal (AP):* Decision Maker/Buyer. Bought the system. Concerned with order, liability, efficiency.
          *   *Two Parents:* Variable. Could be concerned about safety/privacy or efficiency.
          *   *Company Rep:* Vendor. Concerned with sales, implementation success, minimizing friction, defending the product's design.
      *   **Thesis:** The app isn't just a digital version of a paper pass; it fundamentally changes the nature of the rule (silent expiration, permanent logging, presumption of guilt vs. trust).
      *   **Core Argument:** "A rule you can't announce" shifts culture from trust to surveillance/scoring.
      *   **Goal:** A Q&A prep sheet with specific objections, replies, weakness analysis, strategic concessions, the "must-land" point, and the "dreaded question."

  2.  **Deconstruct the Audience & Anticipate Objections:**
      *   *Company Rep:* Will focus on efficiency, safety, data security, and "user error." They will deny the philosophical shift and frame it as an improvement. *Damage Potential: High (they are the expert).*
      *   *Assistant Principal:* Will focus on liability, truancy, administrative burden, and "why we bought it." They want order. *Damage Potential: High (they hold the power).*
      *   *History Teacher:* Will focus on personal responsibility. "If you follow the rules, it doesn't matter." *Damage Potential: Medium (distracts from the systemic argument).*
      *   *Parents:* Will focus on safety ("Do we know where our kids are?") or fairness ("Is my kid being punished unfairly?"). *Damage Potential: Medium/High (swings the room's mood).*
      *   *CS Teacher:* Ally, but might get too technical. *Damage Potential: Low (they are on side).*

  3.  **Drafting the Objections (in character):**
      *   *Company Rep:* Needs to sound corporate, smooth, minimizing the issue. "It's a feature, not a bug." "Data is anonymized." "It helps students manage time."
      *   *AP:* Needs to sound administrative. "Accountability." "Truancy rates." "We need to know where students are for safety."
      *   *History Teacher:* Needs to sound old-school. "Personal responsibility." "The tool doesn't make the rule."
      *   *Parents:* "Safety first" or "Why is this a hill to die on?"

  4.  **Ordering by Damage:**
      1.  *Company Rep:* If they debunk the technical premise, the argument falls.
      2.  *AP:* If they shut it down as "policy," it's over.
      3.  *Parents:* If they feel unsafe, they side with the AP.
      4.  *History Teacher:* Mostly noise, but can derail the philosophical point.

  5.  **Developing Replies & Identifying Weaknesses:**
      *   *Reply Strategy:* Stick to the *cultural shift*, not just the technical glitch. Acknowledge efficiency but question the cost.
      *   *Weakness:* The user is a student. They can be dismissed as not understanding the "big picture" of school safety or administration.

  6.  **Strategic Concessions:**
      *   Need to admit the app *does* solve some problems (efficiency, forgery of paper passes). This builds credibility.
      *   Need to admit I'm not an administrator.

  7.  **The "Must-Land" Reply:**
      *   It needs to be about the *silent expiration* and the *permanent record*. This is the unique insight. The shift from "caught" to "logged."

  8.  **The "Dreaded Question":**
      *   "What is your alternative?" or "Are you just trying to skip class without getting caught?"
      *   Actually, the most dangerous is: "If you have nothing to hide, why does it matter?" (The privacy/trust trap).

  9.  **Refining the Tone:**
      *   The user's prompt is sophisticated ("rule you can't announce"). The output should match that intelligence but remain practical for a high school setting.
      *   Avoid sounding rebellious; sound civic-minded.

  10. **Review against Constraints:**
