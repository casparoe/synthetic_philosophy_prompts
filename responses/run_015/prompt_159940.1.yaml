answer: |-
  Your hypothesis is astute, but I suspect the stalemate is deeper than a slippage between description and justification. It is a **methodological incommensurability** regarding the *ontology of the practice itself*.

  Here is the diagnosis, the analysis of your test case, and a proposal for progress.

  ### 1. The Diagnosis: Constitutive Convention vs. Constitutive Trust

  You suggest Camp A asks "What does the practice require?" and Camp B asks "What makes it moral?" I suggest both camps believe they are describing the *same* phenomenon but disagree on what constitutes it.

  *   **Camp A (Institutionalism):** Treats promising as a **language game**. The obligation is internal to the rules of the game, much like the obligation to move a bishop diagonally. If you make the move, you are bound by the rules, regardless of whether your opponent cares. The "wrong" is cheating.
  *   **Camp B (Interpersonalism):** Treats promising as a **transfer of authority**. The obligation is internal to the relationship. The "wrong" is a violation of second-personal standing.

  The disagreement is not verbal, nor merely about data. It is about **Source of Authority**.
  *   Camp A locates authority in the **Social Fact** (the institution exists independently of us).
  *   Camp B locates authority in the **Rational Will** (the individuals must constitute the bond between them).

  When they argue, Camp A accuses Camp B of dissolving the practice into general morality (if it's just about harm/trust, why do we need the word "promise"?). Camp B accuses Camp A of fetishizing a ritual (why does saying a magic word bind me if no one is helped?). They cannot converge because they are arguing over whether the *normativity* comes from the **structure** or the **substance**.

  ### 2. The Test Case: The Disowned Promise

  This case is excellent because it isolates **Uptake**. It forces the groups to reveal whether they think the promiser creates the obligation unilaterally or bilaterally.

  **Variant 1: Pure Disclaimer**
  *   **Camp A (Institution):** Likely to say **No Obligation**. Most institutional accounts (like Rawls or Searle) require "uptake" for the speech act to be successful. If Bea opts out of the institution, Alf cannot unilaterally invoke it. He is playing chess against someone who told him they are playing checkers.
  *   **Camp B (Interpersonal):** Likely to say **No Obligation**, but for a different reason. Bea revoked the normative power. Alf cannot force authority upon her. However, Camp B might add that Alf is *irrational* or *insincere*, but not obligated.
  *   **The Stall:** Here they might agree on the outcome (no obligation) but fight about *why*. Camp A says "Invalid move." Camp B says "No authority granted." If they agree on the outcome, the argument usually shifts to a different case to force a wedge.

  **Variant 2: Disclaimer + History of Reliance**
  *   **Camp A (Institution):** Likely to say **Obligation Exists**. The *actual practice* (years of reliance) overrides the *stated rule* (the disclaimer). The institution is defined by what people *do*, not what they *say*. Alf invoked the real practice, not the theoretical one.
  *   **Camp B (Interpersonal):** Likely to say **Obligation Exists**. The reliance created a legitimate expectation. The disclaimer was rendered void by conduct. The obligation stems from the harm of disappointing a known reliance.
  *   **The Stall:** Again, they might agree on the outcome, but the *locus* of the obligation differs. Camp A says the *history* constitutes a standing institutional arrangement. Camp B says the *reliance* constitutes a moral bond, rendering the "promise" label incidental.

  **The Real Fault Line:**
  The disagreement explodes if you tweak Variant 1: *Alf promises, Bea disclaims, Alf knows she won't rely, but he feels bound anyway.*
  *   Camp A must explain how an institution binds without a participant.
  *   Camp B must explain how a moral bond exists without a victim/claimant.

  This reveals the bedrock disagreement you suspected: **Can I bind myself to you without your permission?**
  *   Camp A: Yes, if the social rules allow it.
  *   Camp B: No, obligation is relational.

  ### 3. What Kind of Disagreement Is This?

  It is a **Category Dispute about the Locus of Normativity.**

  *   **Camp A** is doing **Social Ontology**. They are analyzing a public tool.
  *   **Camp B** is doing **Moral Phenomenology**. They are analyzing the experience of being bound.

  They are talking past each other because one is explaining the *mechanism* (the convention) and the other is explaining the *bindingness* (the authority). A mechanism can exist without binding anyone (e.g., a law no one follows); a binding can exist without a mechanism (e.g., a tacit understanding). They are arguing over whether "Promissory Obligation" refers to the mechanism or the binding.

  ### 4. Path to Progress

  Do not aim for convergence. Aim for **decoupling**. The circle persists because they are fighting over one term ("Promise") that is doing two jobs.

  **Step 1: The "Complaint" Test**
  Stop asking "Is there an obligation?" Ask Bea: **"What is your resentment about?"**
  *   If she says, "He broke the rule we live by," Camp A wins.
  *   If she says, "He let me down after I counted on him," Camp B wins.
  *   If she says, "He had no right to bind me when I told him not to," Camp B wins (on authority).
  *   If she says, "He made a commitment he didn't keep," Camp A wins.

  In the *Disowned Promise (Variant 1)*, Bea's resentment is likely incoherent. She said "No claims," then resented a claim. This suggests **Camp B is right about authority** (you can't force a claim on someone), but **Camp A is right about the institution** (Alf made a valid move in the public game, even if Bea didn't accept the score).

  **Step 2: Introduce the "Second-Personal" Distinction**
  Assign **Stephen Darwall's *The Second-Person Standpoint***.
  Darwall argues that obligations require *authority*, and authority requires *accountability to a person*.
  *   This forces Camp A to admit that social rules alone don't create *moral* obligations without a person to hold you accountable.
  *   This forces Camp B to admit that the "authority" is often mediated by social norms, not just raw will.
  It bridges the gap by showing that the *Practice* provides the **content** of the obligation, but the **Relationship** provides the **force**.

  **Step 3: Accept Non-Convergence on "Empty Promises"**
  Agree to disagree on the case where *no one relies and no one accepts*.
  *   Camp A can maintain it is a "defective promise" (like a check with no funds).
  *   Camp B can maintain it is "no promise at all."
  *   **Progress:** Acknowledge that this is a boundary case where the concept frays. The disagreement here is not about the core of promising, but about its limits. If 90% of cases (Variant 2) yield the same result, the theoretical divergence on the 10% (Variant 1) may be a difference in **theoretical aesthetics** (clean rules vs. clean morality) rather than substantive ethics.

  **Summary for the Group:**
  Tell them they are not arguing about promises. They are arguing about whether morality is **inherited from our social world** (Camp A) or **constructed by our rational wills** (Camp B). The "Disowned Promise" shows that without *uptake*, the social world has no grip on the individual, and the individual has no grip on the other. The progress lies in seeing that **Uptake** is the necessary condition for *both* sides, but they describe it differently (Acceptance of Rules vs. Granting of Authority). If they can agree on the necessity of uptake, the circle breaks.
