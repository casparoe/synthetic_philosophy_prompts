answer: |-
  1. Hardin's metaphor relies on pre-existing inequality where the boat occupants earned their spot, but Hitchcock's torpedo equalizes everyone by stripping away status before they even board.
  2. Steinbeck's script emphasizes collective survival through shared sacrifice, like the leg amputation, which contradicts Hardin's insistence that sharing resources guarantees mutual ruin.
  3. Hardin frames the swimmer as an innocent burden, whereas Willi is the architect of the disaster, transforming the ethical dilemma from resource allocation to criminal justice.
  4. Admittedly, some scarcity scenes function merely as suspense thriller mechanics where resource tension drives plot. In these moments, the film is making no philosophical point at all about carrying capacity.
  5. The rescue of the second German sailor proves the film refutes Hardin, because the survivors choose universal humanity over selective preservation despite the renewed risk to their limited capacity.
