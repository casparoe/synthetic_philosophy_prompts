  My roommate and I spent like three hours last night arguing about whether it's wrong to hurt NPCs in a video game and we got nowhere, because we just kept throwing the words "real" and "conscious" at each other. So I want to turn it into a flowchart for the game-design discord I help mod — they're mostly programmers and will bail the second it gets jargon-y, so every node has to be a concrete case with two or three answer options, never "do you think the entity is conscious?" or "is the character a person?".

  Roughly seven branch questions, at most eight leaves, and I want the leaves to be named positions (say "unnamed" where you think nobody actually defends it), with one line each on the most awkward thing the position is stuck with.

  The cases I want doing the work, or swap one out if you think it's redundant: a full neural-level simulation of a person running on a server in a closet that nobody ever loads or looks at, and you're switching it off; an NPC whose mind only gets simulated while it's on screen and is a lookup table the rest of the time (frustrum culling); reloading a save after a companion dies, so the version that continues is a copy that didn't live through it; a fully deterministic dialogue-tree NPC versus one whose behaviour is generated by a neural net at runtime; the scripted death of a companion the game has engineered you to love; and a mod that deletes the pain flag so the villagers stop flinching when you burn them — rescue mission, or just editing a file?

  Leaves that have to be reachable: full-blooded simulation welfarism, a threshold-or-complexity view, actualism about which minds count, a relational or observer-dependent view, the view that characters aren't patients but some treatment of them is derivatively wrong, and the no-patients-at-all option.

  Please build it from the logical space rather than from that list: what the questions allow, then where the positions land, and mark any combination of answers nobody occupies and whether that's because it's incoherent or just unattractive. Also flag any pair of leaves your tree genuinely can't separate instead of pretending it can — my roommate thinks the culling case and the determinism case are the same question in costume, and if she's right I want to know which one to cut. Oh, and I conceded the server-in-the-closet one (I said obviously you can switch it off, she said that's just carbon chauvinism), so don't hang the whole tree on that node.
