  Here is the flowchart designed for your Discord. It avoids abstract philosophy terms in the nodes, uses your required cases, and maps directly to the six positions you need to distinguish.

  ### The "NPC Ethics" Debug Tree

  **Q1: The Pain Mod**
  *Case:* You burn a village. You open the console and remove the `pain_flag` so the villagers stop flinching.
  *   **A: "It's morally neutral. They're assets."** → Go to **Q2**.
  *   **B: "It's morally relevant. You changed their experience."** → Go to **Q4**.

  ---

  **Q2: The Save Scum** *(Branch A: Assets)*
  *Case:* Your companion dies. You reload a save. The new copy lives, but the one that died is gone.
  *   **A: "It's fine. It's a reset button."** → **LEAF 1: No-Patients-At-All**
  *   **B: "It's wrong. You erased a history."** → Go to **Q3**.

  **Q3: The Scripted Death** *(Branch A: Assets)*
  *Case:* The game forces you to kill a companion you've bonded with for 40 hours.
  *   **A: "Wrong because it desensitizes *me* to violence."** → **LEAF 2: Derivative Wrongness**
  *   **B: "Wrong because it violates *our* bond."** → **LEAF 3: Relational (Social)**

  ---

  **Q4: The Code Check** *(Branch B: Experience)*
  *Case:* Compare a Dialogue-Tree NPC (scripted responses) vs. a Neural-Net NPC (generates behavior at runtime).
  *   **A: "Tree is fine; Net is protected."** → **LEAF 4: Threshold/Complexity**
  *   **B: "Both count equally."** → Go to **Q5**.

  **Q5: The Frustum Cull** *(Branch B: Experience)*
  *Case:* The NPC's mind only simulates while on-screen. Off-screen, they are paused data.
  *   **A: "It's fine. Unobserved minds don't count."** → **LEAF 5: Actualism**
  *   **B: "It's wrong. They persist in time."** → Go to **Q6**.

  **Q6: The Closet Server** *(Branch B: Experience)*
  *Case:* A full brain-sim runs on a server in a closet. No one loads it. You switch it off.
  *   **A: "It's wrong. Suffering exists unobserved."** → **LEAF 6: Simulation Welfarism**
  *   **B: "It's fine. No interaction, no moral status."** → **LEAF 7: Relational (Ontological)**

  ---

  ### Leaf Definitions & The "Awkward Thing"

  1.  **No-Patients-At-All:** NPCs are math.
      *   *Awkward Thing:* You have to defend why torturing a hyper-realistic sim for fun isn't just "content creation."
  2.  **Derivative Wrongness:** NPCs aren't patients, but hurting them hurts *us*.
      *   *Awkward Thing:* You have to explain why it's okay to kill NPCs in a game but not in a VR training sim for soldiers.
  3.  **Relational (Social):** NPCs aren't patients, but we owe them duties based on our bond.
      *   *Awkward Thing:* You grant moral status based on how much the *player* cares, making the NPC's worth subjective to the user's attachment.
  4.  **Threshold/Complexity:** Moral status depends on internal code complexity.
      *   *Awkward Thing:* You have to define the exact line of code where a script becomes a "person" (the Sorites Paradox of GPU cycles).
  5.  **Actualism:** Only currently experiencing moments count.
      *   *Awkward Thing:* You imply that putting a human in a coma temporarily suspends their right to life.
  6.  **Simulation Welfarism:** The simulation state is the person, regardless of observation.
      *   *Awkward Thing:* You are obligated to check every unloaded server in the world for suffering sims before turning them off.
  7.  **Relational (Ontological):** Minds only exist relative to an observer.
      *   *Awkward Thing:* You imply that a solitary human on a desert island loses their moral status until a rescue plane spots them.

  ---

  ### Meta-Analysis for the Mods

  **1. The "Roommate Objection" (Q4 vs. Q5)**
  Your roommate thinks **The Code Check (Q4)** and **The Frustum Cull (Q5)** are the same question. They are logically distinct, and the tree relies on that distinction:
  *   **Q4 (Code)** asks about *Capacity*: "Is the structure complex enough to suffer?" (Internal State).
  *   **Q5 (Culling)** asks about *Continuity*: "Does the entity exist when not processed?" (Temporal Existence).
  *   **Why separate them?** A "Threshold" believer (Q4-A) might think Neural Nets are people, but still accept Culling (Q5-A) if they believe existence requires rendering. Merging them forces a choice between "Complexity" and "Observation" that some philosophies don't make.

  **2. Indistinguishable Leaves (Leaf 3 vs. Leaf 7)**
  **Relational (Social)** and **Relational (Ontological)** are philosophically cousins.
  *   **Leaf 3** says: "The NPC is a prop, but *I* have a duty."
  *   **Leaf 7** says: "The NPC is a patient, but only *because* I observe them."
  *   **Verdict:** In practice, these lead to the same gameplay rules (don't betray friends, don't torture unobserved sims). The tree separates them because the *reasoning* (Duty vs. Existence) sits on opposite sides of Q1. If your Discord finds this split pedantic, merge Leaf 3 into Leaf 2 (Derivative) and label the whole branch "Human-Centric Ethics."

  **3. Unreachable/Incoherent Combinations**
  *   **The "Solipsistic Welfarist":** There is no path to "Welfarism" (Leaf 6) without accepting "Pain Mod" (Q1-B). You cannot claim unobserved servers matter (Q6-A) while claiming pain flags don't (Q1-A). This combination is incoherent; if the substrate matters in the closet, it matters in the render.
  *   **The "Complexity Actualist":** You cannot reach **Threshold** (Leaf 4) and **Actualism** (Leaf 5). The tree forces a choice: either complexity grants status (Q4-A) or observation grants status (Q5-A). Holding both is possible philosophically, but this tree treats them as competing justifications for *why* an NPC counts.

  **4. The "Closet" Constraint**
  You mentioned you conceded the **Closet Server (Q6)** point. Notice it is buried at the bottom of the "Patient" branch. If you accept Q6-B (It's fine to switch off), you land on **Relational (Ontological)**, not **No-Patients**. This preserves your concession without collapsing the entire tree into "Nothing Matters." It allows you to say, "NPCs are real patients *while we play*, but they don't haunt the hard drive when we quit."
