  The arithmetic is clean on a whiteboard. But you're treating uncertain parameters as constants when they're merely estimates with wide error bars. That four percent premium? It's historical, not prophetic. If the real premium over the next decade is two percent instead of four, your leveraged portfolio doesn't just underperform; it collapses. You're betting the foundation's existence on the precision of an estimate that has fooled every sophisticated generation before us.

  More critically, you're assuming a smooth multiplicative process. Leverage isn't smooth. When markets drop thirty percent in a month, as history shows, a one-and-a-half-times levered book faces margin calls or forced deleveraging at the worst possible moment. That's an absorbing barrier your geometric model ignores. Forced selling turns temporary drawdowns into permanent ruin. Kelly assumes you can bet forever; institutions face liquidity constraints.

  Finally, you frame this as risk versus growth. I frame it as probability of mission fulfillment. In a favorable game, betting smaller materially increases the probability of reaching a distant target before hitting zero. We need to exist in a century, not maximize the expected size of the corpus if we get lucky. The single variable we truly control isn't the market's return; it's our spending rule. If five percent proves unsustainable, we cut it to three percent. That guarantees survival without betting the farm on a premium that may not exist. Why commit to spending money we lack rather than adjusting outflow? We are stewards, not traders. Our mandate is perpetuity, not optimization.
