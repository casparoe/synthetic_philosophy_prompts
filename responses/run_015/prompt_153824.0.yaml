      *   **(4) Pointwise convergence implies converging on the truth (all at once):** **RED FLAG.** This is the classic confusion between pointwise convergence and uniform convergence. Just because for every $p$, $P_t(p) \to \text{truth}(p)$ as $t \to \infty$, does *not* mean that at any finite $t$, the reasoner is "close" to the truth on *all* questions, or even that the "distance" to omniscience shrinks monotonically. More importantly, the limit object (the function at $t=\infty$) is not something the reasoner *is* at any finite time.
