  4. **Principles vs. Practice (10 mins):** Test "all-affected" vs. "coercion." Use the belongs/hearing/vote distinction here to prevent collapse. This depends on Step 3 showing no easy answer exists. The distinction helps them navigate the paradox without solving it.
