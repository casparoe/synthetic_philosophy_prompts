  *   **Setup:** Event $E$ (Meeting) is at $(t=1 \text{ week}, x=0)$ in Earth frame $S$. Observer $O'$ is at $x=10 \text{ ly}$ in $S$, moving toward Earth ($v < 0$).
  *   **Threshold:** For $E$ to be simultaneous with $O'$'s "now" (defined as the event on $O'$'s worldline simultaneous with Earth-now in $S$), we need the plane of simultaneity to tilt by 1 week over 10 light-years.
      $$ \Delta t = \frac{v \Delta x}{c^2} \implies 1 \text{ week} \approx \frac{v}{c} (10 \text{ years}) $$
      $$ \frac{v}{c} \approx \frac{1/52}{10} \approx 0.0019 $$
  *   **Your Case:** At $v = 0.01c$, the tilt is $\approx 0.1 \text{ years}$ (~1.2 months). Since $O'$ is approaching, their simultaneity slice dips into Earth's future. Wait—check the sign.
      *   Standard Config: $O'$ moves at $+v$. Slice tilts $t = vx$.
      *   Your Config: $O'$ is at $+x$ moving toward origin ($v$ is negative).
      *   Slice equation through $(10, 0)$: $t - 0 = \frac{v}{c^2}(x - 10)$.
      *   At Earth ($x=0$): $t = \frac{-0.01c}{c^2}(-10 \text{ ly}) = +0.1 \text{ years}$.
      *   This means $O'$'s "now" is simultaneous with Earth's $t=+0.1 \text{ years}$.
      *   The Meeting is at $t=+0.02 \text{ years}$.
      *   Therefore, the Meeting is in the **past** of $O'$'s "now" (since $0.02 < 0.1$).
  *   **Verdict:** Your math holds. For the moving observer, the meeting is already past. For you, it is absolute future (timelike separated from your here-now).

  ### 2. The Horizon Variant (GR Complication)
  You asked if this variant can be stated cleanly. **It cannot, not without a convention.**
  *   **The Failure:** In Special Relativity, "distant simultaneity" is a coordinate choice. In General Relativity (expanding spacetime), there is no unique way to extend a local frame 10 billion light-years away. Parallel transport is path-dependent.
  *   **The Revelation:** If you press her on this, she must either:
