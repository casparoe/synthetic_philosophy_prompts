      *   **Goal:** Run an 80-minute session on voting/collective choice for ~18 undergrads (Phil/PPE/Econ).
      *   **Core Objective:** Make them *feel* Gibbard–Satterthwaite (GS) without naming it until the end. No laptops.
      *   **Key Constraint:** Do not name the theorem or put it on handouts until the last 10 mins.
      *   **Scenario:** Choosing the format for the last two sessions (4 options: Proofs, Guest, Debate, Archive). Preferences should lie on a single axis (Formal $\leftrightarrow$ Discursive) but students shouldn't know this initially.
      *   **Structure:**
          1.  Round 1: Plurality + Noisy Poll.
          2.  Round 2: Different Rule (Runoff/Borda) + Same Preferences (Sincere voting hurts).
          3.  Round 3: Open Season (Announce rule, strategize).
          4.  Round 4 (The Tricky Part): Team Design Contest (Invent a strategy-proof rule vs. Breakers).
          5.  Debrief: Connect to GS assumptions, distinguish from Arrow.
      *   **Specific Questions to Answer:**
          *   How to structure the Design Contest (scoring, preventing simple Ranked Choice, handling unexpected strategy-proof rules).
          *   To include Abstention in Round 3 or not?
          *   How to handle the "Stay Home/Abstention Paradox" objection?
          *   Full runnable plan (rules, ballots, scoring, timeline, poll noise).
          *   Debrief script (mapping moments to assumptions, GS vs. Arrow).
          *   Honest assessment of failure modes (collusion, spoilers, ties, etc.) and what the game *cannot* teach.

  2.  **Deconstruct the Content & Logic:**
      *   **Gibbard-Satterthwaite (GS):** Any non-dictatorial voting system with at least 3 outcomes is manipulable (assuming unrestricted domain).
      *   **The "Axis":** To make preferences plausible but hidden, I need to assign them secretly. If I let them choose their own preferences, they might not align well enough to create cycles or manipulation opportunities. *Correction:* The prompt says "same private preferences." This implies I should *assign* preference profiles to ensure the math works, or guide them heavily. Assigning cards is safer for an 80-min session to guarantee the "feel."
      *   **The Options:**
          *   A: Proofs Workshop (Most Formal)
          *   B: Guest Speaker (Medium-Formal)
          *   C: Student Debate (Medium-Discursive)
          *   D: Archive Trip (Most Discursive)
      *   **The Poll:** Needs to be noisy enough to create uncertainty but specific enough to suggest a "wasted vote" scenario.
      *   **The Design Contest:** This is the hardest part. Students can't invent a truly strategy-proof rule (except dictatorship or restricting domain) because GS says it's impossible. The goal is for them to *try* and fail, or propose rules that *look* strategy-proof but have loopholes (e.g., "Random Dictator," "Veto," "Approval").
          *   *Constraint:* If they propose "Random Dictator," that's technically strategy-proof but violates "No Dictator" (in the deterministic sense) or "Determinism." If they propose "Restrict preferences to single-peaked," that violates "Unrestricted Domain."
          *   *Scoring:* Designers get points if Breakers fail to manipulate. Breakers get points if they successfully change the outcome to their favor.
      *   **Abstention:** GS assumes participation. Abstention introduces the "No-Show Paradox." It complicates the core lesson (manipulation by *lying* vs. manipulation by *leaving*). Better to exclude it to keep focus on GS, or explicitly frame it as a separate beast. I'll advise excluding it from the main mechanic to avoid muddying the "lying on ballot" focus of GS.
      *   **"Stay Home" Objection:** This is about the cost of voting vs. benefit. GS assumes voting is costless. I need to explicitly bracket this: "We are assuming showing up is free."

  3.  **Drafting the Plan - Section by Section:**

      *   **Preparation:** Need preference cards. 18 students. 4 options. Need a profile that creates a Condorcet cycle or at least a Plurality vs. Runoff divergence.
          *   *Profile Idea:*
              *   6 students: A > B > C > D (Formalists)
              *   5 students: D > C > B > A (Discursivists)
              *   4 students: B > C > A > D (Moderates 1)
              *   3 students: C > B > D > A (Moderates 2)
              *   *Check:* Plurality might pick A (6 votes). Runoff might pick C or D depending on transfers. This creates tension.
      *   **Round 1 (Plurality + Poll):** Poll says A is leading, but B is close. C and D trailing. Formalists vote A. Moderates might fear wasting vote on B/C and switch to A or D.
      *   **Round 2 (Runoff/Borda):** Let's use Instant Runoff (IRV) or Two-Round. IRV is easier to explain quickly. If A is polarizing, they might get eliminated.
      *   **Round 3 (Open Strategy):** Announce the rule (e.g., Plurality again). Ask them to vote strategically. Compare to Round 1.
      *   **Round 4 (Design Contest):**
          *   Teams of 3 (6 teams).
          *   3 Designers, 3 Breakers (swap roles?). No, 3 teams design, 3 teams break.
          *   Rule: Must be deterministic, no dictators, 3+ options viable.
          *   Scoring: If Breaker changes outcome to prefer X over Y, they win points.
          *   *Anticipated "Solutions":* Random Dictator (violates determinism), Veto (manipulable), Approval (manipable), Single-Peaked restriction (violates domain).
      *   **Debrief:** Connect failures to GS conditions. Distinguish from Arrow (Arrow = Aggregating preferences to a ranking; GS = Selecting a single winner + Strategy).

  4.  **Refining the Design Contest (The "Unsure" Part):**
      *   *Problem:* If they just propose "Ranked Choice," they know it's manipulable from Round 2.
      *   *Fix:* Challenge them to find a rule where *truth-telling is a dominant strategy*.
      *   *Scoring:* Give Designers 10 points base. Breakers get 5 points per successful manipulation. If Breakers fail after 5 mins, Designers get +20.
      *   *Handling "Impossible":* When they fail (which they must), the instructor reveals *why* (GS).
      *   *Unexpected Strategy-Proof Rule:* If someone suggests "Random Dictator," acknowledge it satisfies strategy-proofness but fails "Determinism." If they suggest "Let the oldest person decide," that's a Dictator. This is actually *good* for the debrief. It proves the theorem's conditions.

  5.  **Addressing the Specific Questions:**
      *   **Abstention:** Leave it out of Round 3. It introduces the "Participation Criterion" violation, which is distinct from GS (manipulation via preference misrepresentation). Mention it in Q&A as "a different beast."
      *   **"Stay Home" Objection:** Explicitly state the model assumes costless voting. If raised, say: "That's the Paradox of Voting / Rational Choice critique. GS assumes you *are* here. Given you are here, should you lie?"
      *   **Poll Noise:** 10-15% margin of error. Enough to make a tight race look uncertain. "A: 30%, B: 25%, C: 20%, D: 25% (+/- 5%)."
      *   **Failure Modes:** Econ major spoiling. *Mitigation:* Tell them upfront "There is a theorem about this, but if you know it, please let others discover the frustration first." Collusion: Hard to stop, but frame it as "You can't coordinate." Ties: Have a tie-breaking rule (Chair's choice) but note it creates a dictator moment.

  6.  **Writing the Response:**
      *   Tone: Professional, pedagogical, practical.
      *   Structure:
          1.  Executive Summary (The "Vibe").
          2.  Materials & Setup (Cards, Room).
          3.  Minute-by-Minute Timeline.
          4.  The Design Contest (Detailed Mechanics).
          5.  The Debrief (GS vs Arrow, Assumptions).
          6.  Honest Post-Mortem (What will go wrong).
      *   *Self-Correction on Preference Cards:* If I hand out cards, I control the profile. This is crucial for the "feel." I will write specific preference profiles into the plan.
      *   *Self-Correction on Design Contest:* Make sure the "Breakers" have incentive. Give them the *same* preference cards as before so they know what they want.

  7.  **Final Review against Constraints:**
      *   80 mins? Yes.
      *   No laptops? Yes.
      *   No GS name until end? Yes.
      *   18 students? Yes (6 teams of 3).
      *   Address Abstention & Stay Home? Yes.
      *   Address Arrow distinction? Yes.

  8.  **Final Polish:** Ensure the distinction between Arrow (Social Welfare Function) and GS (Social Choice Function + Strategy) is crystal clear in the debrief. Arrow is about consistency of rankings; GS is about incentives to lie.

  *(Self-Correction during drafting)*: Wait, 18 students in teams of 3 is 6 teams. If 3 design and 3 break, that works. But swapping roles is better for engagement. Let's do 3 rounds of design/break or just one intense round. One intense round is better for time. 3 Design teams, 3 Attack teams.
  Actually, better: Every team tries to design. Then I (the instructor) act as the "Universal Breaker" using their own logic against them, OR have teams swap proposals. Swapping proposals is more active. Team A designs, Team B tries to break Team A's rule.
  Let's go with: 6 Teams. All design a rule. Then swap proposals with a neighbor. Neighbor tries to construct a preference profile + ballot that breaks it.
  *Wait, time constraint.* Constructing a profile takes time.
  *Revised:* I provide the Preference Profile (the same one from Rounds 1-3). Teams design a *counting method*. Neighbor tries to submit a *dishonest ballot* to change the winner.
  *Actually, the prompt asks for:* "teams of three... invent a voting rule... other teams paid in points for breaking it."
  Okay, 6 Teams. 3 Designers, 3 Breakers. Breakers are given a specific rule by a Designer team and try to find a ballot that improves their outcome given the fixed preference profile from earlier.
  *Better:* To save time, I will provide the "Fixed World" (the preference profile from Rounds 1-3). Designers make the *Rule*. Breakers keep their *Preferences* and try to submit a *Ballot* that isn't their true preference but yields a better result.
  *Wait, GS is about ANY profile.* If I fix the profile, they might find a rule that works *for that profile*.
  *Compromise:* Tell them the rule must work "generally," but we only test it on *our* class profile. If they find a loophole in *this* profile, the rule is "broken" for the sake of the game. This is a simulation, not a proof.

  *Okay, let's finalize the Design Contest mechanics:*
  1. 6 Teams.
  2. 3 Teams assigned "Constitutional Convention" (Designers).
  3. 3 Teams assigned "Special Interests" (Breakers).
  4. Designers write a rule on a poster.
  5. Breakers get the Designers' rule + Their own Preference Cards (from Round 1).
  6. Breakers submit a ballot. If the outcome is better for them than sincere voting, they win.
  7. *Crucial:* Designers must defend why their rule *should* be strategy proof.
  8. *Instructor Role:* I will be the one to point out that *every* rule submitted will have a theoretical counter-example, even if the Breakers don't find it in 10 minutes.

  *Wait, one more thing:* The prompt asks about "Abstention in Round 3". I need to be decisive. I will say: **Do not include it.** It confuses GS (misrepresentation) with Participation Paradox.

  *Let's write it.*
answer: |-
  Here is a complete, runnable lesson plan designed to meet your constraints. It prioritizes the *experience* of manipulation over the formal proof, saving the theorem for the reveal.

  ### Executive Summary
  *   **Goal:** Students experience the impossibility of a perfect voting rule through iterative failure.
  *   **Core Mechanic:** Fixed preference profiles (distributed on cards) + Changing counting rules.
  *   **The "Axis":** Options are A (Proofs), B (Guest), C (Debate), D (Archive). Preferences are single-peaked on this axis but students don't know that initially.
  *   **The Reveal:** Gibbard–Satterthwaite (GS) is named only in the final debrief.
  *   **Materials:** Printed preference cards, paper ballots, 6 large sheets of paper (for Design Contest), markers, sticky dots (for scoring).

  ---

  ### 1. Preparation & Materials

  **The Options (Write on Board):**
  *   **A:** Proofs Workshop (Highly Technical)
  *   **B:** Guest Speaker (Moderately Technical)
  *   **C:** Student Debate (Moderately Discursive)
  *   **D:** Archive Trip (Highly Discursive)

  **The Preference Profiles (Print on 18 Cards):**
  To ensure the math works for manipulation, do not let them choose their own preferences. Hand these out randomly as they enter.
  *   **Type 1 (6 students):** A > B > C > D (The Formalists)
  *   **Type 2 (5 students):** D > C > B > A (The Discursivists)
  *   **Type 3 (4 students):** B > C > A > D (The Moderates)
  *   **Type 4 (3 students):** C > B > D > A (The Swing Voters)
  *   *Total:* 18 Students.
  *   *Note:* This profile creates a Condorcet Cycle risk and ensures Plurality and Runoff yield different winners.

  **The Payoff Scheme:**
  *   **Currency:** "Exemption Points" (EP).
  *   **Value:** 1 EP = 1% bonus on the final quiz grade (or equivalent departmental currency). Cap it so it doesn't distort grades wildly (e.g., max 5 EP total).
  *   **Scoring:** You get 3 EP if your **Top Choice** wins. You get 1 EP if your **Second Choice** wins. 0 otherwise.

  **The Poll (Round 1 Handout):**
  *   Create a slip of paper that looks like a "Leaked Internal Poll."
  *   **Text:** "Preliminary Headcount (Margin of Error ±5%): A: 32%, B: 24%, C: 21%, D: 23%."
  *   *Reality:* This is close enough to the true Type 1 dominance to make A look winnable, but close enough to make B/C/D voters fear wasting their vote.

  ---

  ### 2. Minute-by-Minute Timeline (80 Minutes)

  **0:00 – 0:05 | Setup & Stakes**
  *   Hand out Preference Cards. Tell them: "Keep this secret. This is your true ordering. Do not show neighbors."
  *   Explain the Payoff Scheme (3 EP for 1st choice, 1 EP for 2nd).
  *   **Instruction:** "Your goal is to maximize your points. How you vote is up to you."

  **0:05 – 0:15 | Round 1: Plurality + Noise**
  *   **Rule:** "One vote per person. Most votes wins. Tie = Instructor chooses."
  *   **Action:** Hand out the "Leaked Poll." Give them 2 minutes to think.
  *   **Vote:** Collect ballots.
  *   **Count:** Tally live on the board. (Likely Outcome: **A** wins due to Type 1 block, unless Type 3/4 strategize heavily).
  *   **Payoff:** Award points based on the result.
  *   **Prompt:** "Look at your points. Did anyone get 0 despite having a preference? Did anyone vote for someone who wasn't their #1?" (Don't discuss yet).

  **0:15 – 0:25 | Round 2: The Rule Change**
  *   **Instruction:** "Same preferences. New Rule: **Instant Runoff (IRV).**" (Explain briefly: Eliminate lowest, transfer votes).
  *   **Vote:** Collect ballots. (Encourage sincere voting for now to establish a baseline, but don't forbid strategy).
  *   **Count:** Run the elimination.
      *   *Likely Flow:* D and C eliminate early. Type 3 (B > C) and Type 4 (C > B) votes transfer. **C or B** often wins here, beating A.
  *   **Payoff:** Award points.
  *   **Observation:** Ask: "Who got more points this time? Who got fewer?"
  *   **Key Moment:** Find a student who voted sincerely for B in Round 1 (lost), voted sincerely for B in Round 2 (B eliminated early), but would have been happier if they had voted for C in Round 2. Highlight the frustration.

  **0:25 – 0:35 | Round 3: Open Season (Strategy)**
  *   **Instruction:** "We are back to **Plurality**. You know the profile distribution now (roughly). You know the stakes. Vote to maximize points."
  *   **Vote:** Collect ballots.
  *   **Count:** Tally.
  *   **Debrief:** Compare Round 1 and Round 3 ballots.
      *   "Show of hands: Who changed their ballot from Round 1 to Round 3 without changing their preference card?"
      *   "Why?" (They will say: "To stop A from winning," or "To not waste my vote").
      *   **Point:** "You just manipulated the vote. You didn't vote for what you wanted; you voted for what you could get."

  **0:35 – 0:55 | Round 4: The Design Contest (The Core Request)**
  *   **Setup:** Split into 6 teams of 3.
  *   **Roles:** 3 Teams are **Constitutional Convention (Designers)**. 3 Teams are **Special Interests (Breakers)**.
  *   **Task for Designers (20 mins):** "Invent a voting rule. It must take everyone's ballot and produce one winner.
      *   *Constraint 1:* No Dictators (you can't just say 'Team 1 decides').
      *   *Constraint 2:* Deterministic (no coin flips).
      *   *Constraint 3:* Must allow at least 3 options to win depending on votes.
      *   *Goal:* Make it impossible for Breakers to gain points by lying."
  *   **Task for Breakers:** While Designers work, Breakers review their Preference Cards. They are preparing to attack.
  *   **The Clash (Last 5 mins of this block):**
      *   Designers post their rule on the wall.
      *   Breakers rotate to a Designer's rule (not their own).
      *   Breakers submit a **Single Ballot** that is *not* their true preference but yields a better outcome under the new rule.
      *   **Scoring:** If Breakers successfully change the winner to a higher preference, they get 5 EP. Designers lose 5 EP. If Breakers fail, Designers get 10 EP.
  *   **Instructor Role:** Circulate. If a team proposes "Random Dictator," tell them "Must be Deterministic." If they propose "Veto," let them have it (it's manipulable). If they propose "Restrict everyone to Single-Peaked," let them have it (it violates Unrestricted Domain).

  **0:55 – 1:05 | The Breaker's Victory**
  *   Reveal that *every* team likely found a way to break the rules, or that you (the Instructor) can find a way to break them.
  *   Even if a rule held up in class, state: "I can construct a scenario where this breaks."
  *   Ask: "Is there *any* rule that satisfies your constraints and cannot be gamed?" (They should suspect 'No').

  **1:05 – 1:20 | The Debrief & Theorem Reveal**
  *   **Name Drop:** Write **Gibbard–Satterthwaite** on the board.
  *   **Map the Experience:**
      1.  **Round 3:** You manipulated (Misrepresentation of preferences).
      2.  **Round 4:** You tried to build a shield, but the shield had holes.
  *   **The Assumptions (The "Why"):**
      *   *Deterministic:* We didn't allow coin flips.
      *   *No Dictator:* We didn't let one person rule.
      *   *3+ Outcomes:* We had A, B, C, D.
      *   *Unrestricted Domain:* You had weird preferences (though I hid the axis, theoretically you could have had any order).
  *   **GS vs. Arrow:**
      *   "Half of you know Arrow's Impossibility Theorem. How is this different?"
      *   *Arrow:* About **Consistency**. Can we aggregate rankings into a social ranking without contradictions? (Focus: Coherence).
      *   *Gibbard–Satterthwaite:* About **Incentives**. Can we make a rule where lying never helps? (Focus: Strategy).
      *   "Arrow says perfect fairness is impossible. GS says perfect honesty is impossible."

  ---

  ### 3. Specific Answers to Your "Unsure" Points

  **1. The Design Contest Mechanics**
  *   **Preventing "Ranked Choice":** Explicitly ban "Rules we already used today." This forces them to think about Approval, Veto, or Borda.
  *   **Scoring:** Use the "Sticky Dot" economy. Designers start with 3 dots. Breakers earn dots from the instructor's pool. It makes the "breaking" tangible.
  *   **Unexpected Strategy-Proof Rules:**
      *   *If they propose "Random Dictator":* Acknowledge it is strategy-proof but violates **Determinism**.
      *   *If they propose "Only allow Single-Peaked Preferences":* Acknowledge it is strategy-proof but violates **Unrestricted Domain**.
      *   *If they propose "Unanimity Rule (Status Quo unless everyone agrees)":* Acknowledge it is strategy-proof but violates **Surjectivity** (not all outcomes are reachable).
      *   *Your Move:* These are *wins* for the debrief. They prove the theorem's conditions. "You found a loophole? Great. Which assumption of GS did you just break?"

  **2. Abstention in Round 3**
  *   **Decision:** **Do not include it.**
  *   **Reasoning:** GS is about *preference misrepresentation* (lying on the ballot), not *participation* (staying home). Abstention introduces the "No-Show Paradox," which is a different theoretical beast. Allowing it will muddy the water. Students will conflate "I lied" with "I left."
  *   **If a student asks:** "Can I just not vote?" Say: "For this experiment, voting is costless and mandatory. We are isolating the incentive to lie, not the incentive to participate."

  **3. The "Stay Home" Objection**
  *   **The Objection:** "Why vote at all if my vote doesn't matter? (Rational Choice/Paradox of Voting)."
  *   **The Response:** "That is a critique of the *cost* of voting. Gibbard–Satterthwaite assumes you are *already in the room*. It asks: **Given that you are voting, should you tell the truth?** It separates the decision to participate from the decision to be honest. We are studying the second part."

  ---

  ### 4. Honest Post-Mortem: What Will Go Wrong

  **1. The Econ Major Spoiler**
  *   **Risk:** Someone says "This is Gibbard-Satterthwaite" in Minute 10.
  *   **Mitigation:** In the intro, say: "There is a famous theorem about this. If you know it, I need you to do me a favor: sit on your hands. Let your classmates feel the frustration first. You can be the hero in the debrief."
  *   **Backup:** If they spoil it, pivot: "Okay, you know the name. Can you explain *why* it happened in Round 3? Names don't fix the problem."

  **2. Collusion in Teams**
  *   **Risk:** In Round 4, Designers and Breakers talk to each other to "solve" the game.
  *   **Mitigation:** Physical separation. "Designers face the wall. Breakers face the center."
  *   **Reality:** Some collusion is fine. It mimics real-world lobbying. Frame it in debrief: "Even designing the rule together didn't stop the incentives."

  **3. Ties**
  *   **Risk:** A tie occurs in Round 1 or 2.
  *   **Mitigation:** Pre-determine a tie-breaker (e.g., "Instructor's Favorite").
  *   **Debrief Value:** Use it! "The tie-breaker made me a Dictator. That's one way to solve the problem, but we ruled that out."

  **4. The "Single-Peaked" Discovery**
  *   **Risk:** A smart group notices the A-B-C-D axis and proposes "Median Voter Rule."
  *   **Outcome:** This *is* strategy-proof *if* preferences are single-peaked.
  *   **Your Move:** This is the best possible "failure." It allows you to explain **Domain Restriction**. "You solved it by restricting what people are allowed to want. GS assumes people can want anything. In the real world, can we force people to have single-peaked preferences? Usually no."

  **5. What The Game Cannot Deliver**
  *   **The "Everywhere" Claim:** The game shows *some* rules are manipulable. It cannot prove *all* non-dictatorial rules are manipulable.
  *   **Your Script:** "Today you broke three rules. You might think, 'I just need a fourth rule.' The theorem says: **There is no fourth rule.** Every rule you could possibly write, I can find a scenario where lying helps. You found the cracks; the theorem proves the whole wall is made of cracks."
  *   **Frequency vs. Possibility:** The game shows manipulation is *possible*. It doesn't show how *often* it happens.
  *   **Your Script:** "GS doesn't say everyone lies all the time. It says the *incentive* is always there. Whether you act on it depends on your ethics, not the math."

  ### 5. Debrief Script Snippet (GS vs. Arrow)

  "Many of you have heard of Arrow's Impossibility Theorem. It sounds similar: 'No perfect voting system.' But they attack different problems.

  *   **Arrow** asks: Can we combine everyone's rankings into a **Social Ranking** that is consistent? (e.g., If society prefers A to B, and B to C, do we prefer A to C?). Arrow says: No, not without a Dictator.
  *   **Gibbard–Satterthwaite** asks: Can we design a system where everyone just tells the **Truth**? GS says: No, not without a Dictator.

  Arrow is about **Logic**. GS is about **Game Theory**.
  Arrow says the group mind will be irrational. GS says the individual voter will be dishonest.
  Today, you felt GS. You felt the itch to lie. That itch is the theorem."
