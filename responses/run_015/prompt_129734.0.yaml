      *   *Hierarchy of Arts:* Most arts copy the *Ideas* (Platonic forms), which are objectifications of the Will. They are twice removed from the Will.
      *   *Music's Unique Status:* Music bypasses the Ideas. It is a *direct copy of the Will itself*. Melody, harmony, rhythm mirror the striving, satisfaction, and frustration of the Will.
      *   *The Composer:* The composer intuits the Will directly. They are a "clear mirror" of the inner nature of the world. Their suffering/striving informs the music.
