      *   **Post-Activity:** Debrief mapping rounds to theory, anticipate resistance (hidden real self), address resistance without lecturing, admit limitations (phenomenology gap).
      *   **Constraints:** Specify setting, group size, time, learning outcomes. No bibliography/citations.

  2.  **Deconstruct the Philosophical Concept:**
      *   *Center of Narrative Gravity:* The self isn't a "thing" inside the head; it's an abstract object, like a center of gravity in physics. It's a useful fiction created by the stories we tell about ourselves.
      *   *Substantive Entity:* The Cartesian Ego, the homunculus, the soul, the irreducible "I" that owns experiences.
      *   *The Challenge:* Students naturally feel like substantive entities (phenomenology). The activity needs to break that intuition by showing how fragile and constructed identity is when stripped of a "owner."

  3.  **Drafting the Activity - "The Archivist's Dilemma":**
      *   *Setting:* Seminar room, movable tables.
      *   *Groups:* 10 students -> 2 groups of 5 (allows for deep discussion within time limits).
      *   *Stakes:* Why do they care? Maybe "grant funding" for a research project or "archival legitimacy." Let's go with "Archival Legitimacy" – they are curators deciding what counts as a valid person for a historical record.
      *   *Materials:* Cards with life events (memories, traits, actions).

      *   *Round 1: Construction.* Build a coherent person from a deck.
      *   *Round 2: Merging (Teletransportation/Swap).* Two groups swap cards. Is it the same person?
      *   *Round 3: Fission.* One narrative splits into two divergent paths. Which one is the "real" person?
      *   *Round 4: Erosion.* Remove cards (memory loss). At what point does the person cease to exist?

      *   *The Voting Rule:* Crucial. They must vote "Person Persists" or "Person Ceased." Justification *cannot* appeal to a "soul" or "brain." Must appeal to story coherence.

  4.  **Refining the Mechanics (Time & Flow):**
      *   90 minutes total.
      *   Intro: 10 mins.
      *   Round 1: 15 mins.
      *   Round 2: 15 mins.
      *   Round 3: 15 mins.
      *   Round 4: 15 mins.
      *   Debrief: 35 mins.
      *   *Correction:* That's tight. Need to streamline the rounds. Let's combine Merging and Fission or make them quicker. Actually, 10 students in 2 groups of 5 is good.
      *   *Stakes:* If they fail to agree on a verdict, they lose "archival credits" (fake currency, winner gets first choice of seminar paper topic or something trivial but tangible like fancy coffee). Let's use "Curatorial Authority" – the group with the most coherent verdicts wins the right to set the reading for the next week (a real academic stake).

  5.  **Developing the Debrief:**
      *   *Mapping:* Cards = Experiences/States. Biography = Narrative. The "Person" = The Gravity Center.
      *   *Resistance:* Students will say, "But *someone* experienced these cards."
      *   *Counter:* Ask, "If you remove all cards, where is the someone?" (Socratic pushback).
      *   *Limitation:* The activity is third-person. It lacks *qualia*. The feeling of "I-ness" isn't simulated. The facilitator must acknowledge this gap.

  6.  **Writing the Plan (Iterative refinement):**
      *   *Title:* "The Narrative Archivist."
      *   *Setup:* Clear instructions on the cards.
      *   *Rounds:* Ensure the "Disruptions" match the prompt requirements (merged memories, fission, removal).
      *   *Voting:* Explicitly ban "substance" language.
      *   *Debrief:* Structure it carefully to handle the "hard problem" of the feeling of self.

  7.  **Checking Constraints:**
      *   10 grad students? Yes.
      *   90 mins? Yes.
      *   Explicit rules/roles/stakes? Yes.
      *   Specific disruptions (merge, fission, removal)? Yes.
      *   Debrief requirements (resistance, limitation)? Yes.
      *   No citations? Yes.

  8.  **Final Polish:**
      *   Make sure the "stakes" feel real enough to create tension but not so high it ruins collaboration. "Choosing the next reading" is a classic grad seminar power dynamic.
      *   Ensure the "no underlying owner" rule is enforced strictly during the game.
      *   Clarify the "Phenomenology Gap" in the debrief section.

