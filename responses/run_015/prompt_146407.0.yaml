      *Time Check:* 90 mins is plenty for 4 rounds if kept tight.
      *Stakes:* "Curatorial Veto." The winning group gets to veto one reading from the syllabus. That's high stakes for grad students.

      *Debrief nuance:* Need to make sure I explicitly state what the activity *cannot* do (the first-person feel).

