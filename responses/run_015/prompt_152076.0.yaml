  9.  **Self-Correction during drafting:** I initially thought about citing political polarization. But that's often reducible to Period (current politics) or Age (lifecycle). I need to stick to the "Cohort Size" argument or perhaps "Technological Imprinting" that is distinct from mere "exposure." Actually, the "Cohort Size" argument is the most robust economic argument that treats the cohort as a *unit* affecting the individual. I will focus on that. I should also mention the "self-fulfilling" aspect as a double-edged sword (it makes them real *because* we label them).

  10. **Final Polish:** Ensure the distinction between "Natural Kind" and "Social Kind" is clear. The user argues they aren't real kinds. I need to show they might be *interactive* kinds (Hacking).

