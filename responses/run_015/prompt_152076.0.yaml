          *   *Strength:* If "Millennials" exist in Japan or Germany with similar boundaries, it suggests a global technological/cultural shockwave.
          *   *Weakness:* National contexts differ (e.g., fall of Berlin Wall vs. 9/11).
          *   *Defeater:* If non-Anglophone sociologists independently converge on similar birth year ranges for similar sociological profiles *without importing US terminology*, that suggests a real underlying phenomenon.
          *   *User's Concession:* If the "Millennial" profile appears in Italy but they call it "Generation X" or cut it at 1985, it supports the user. If they cut at 1981 and see the same traits, it hurts the user.

  5.  **Address Stipulation 3: Insulation/Immunization:**
      *   *Strategy:* "You got the dates wrong," "It's a cusp," "It's socially constructed."
      *   *Social Ontology:* Social kinds (like "money" or "marriage") *are* constituted by labeling. So, insulation is more legitimate here than in chemistry.
      *   *Defect?* If the boundaries shift *every time* data contradicts them, it's ad hoc. If the *concept* remains stable while boundaries adjust slightly (measurement error vs. conceptual failure), it's legitimate.
      *   *Verdict:* The "social construction" defense is strong here because generations *are* partly self-fulfilling prophecies (labeling affects behavior). However, if the *causal explanation* relies on the label itself rather than the material conditions, it risks circularity.

  6.  **Develop the "Fatal" Defeater (Explanatory Power):**
      *   The user wants: Cohort term does work that Age + Period + Event *cannot*.
