answer: |-
  Your group's distinction between "reckoning-relative" and "world-imposed" necessity is an excellent heuristic that maps directly onto a genuine and central tension in Hobbes's philosophy, specifically his commitment to nominalism. To understand the passage, you have to start with Hobbes's claim that truth and falsehood are attributes of speech, not of things. For Hobbes, there are no universal "natures" out in the world waiting to be discovered; there are only individual bodies and the names we give them. Consequently, scientific necessity cannot be "world-imposed" in the sense of latching onto independent Platonic forms or real essences, because those do not exist. Instead, necessity is generated by us when we settle on definitions and reason consistently from them. This makes Hobbes firmly a "reckoning-relative" theorist regarding the status of truth: the necessity lies in the logical consequence of the definitions we have agreed to use, not in the external world itself.

  When Hobbes says geometry is the only science God has bestowed, he is not saying God handed down geometric axioms from heaven while withholding physical or moral truths. Rather, he means that God gave all humans the capacity for reason (reckoning), but geometry is the only field where humans have actually done the hard work required to make science possible: settling definitions uncontroversially and reasoning deductively from them. In other fields, people argue about the meanings of words like "justice" or "cause" without agreeing on definitions first, resulting in noise rather than science. For geometry to count as bestowed, it simply has to be true that humans have successfully used their God-given reason to construct a system of settled definitions and undeniable consequences, which Hobbes believes they have done for quantity and figure but failed to do for ethics or politics until now.

  This clarifies the status of civil philosophy. On Hobbes's account, civil philosophy can indeed be a science in the same full sense as geometry, not merely by analogy. The reason is that both fields are constructive. In geometry, we define figures and generate truths about them in our minds; in civil philosophy, we generate the commonwealth itself through covenants and agreements. Because we are the authors of the commonwealth's structure (via our consent and definitions of rights), we can know the consequences of that structure demonstratively, just as we know the consequences of a geometric definition. We know the cause because we made it. This is why Hobbes thinks he can produce a scientific politics in *Leviathan*: he is treating political terms like geometric terms, settling their significations, and deducing the necessary consequences for peace and stability.

  This also resolves the confusion about Hobbes being an empiricist about concepts but a rationalist about method. For Hobbes, all ideas originate in sense experience (empiricism), so there are no innate ideas. However, having those ideas is not science; science is the method of processing those ideas through correct reasoning (rationalism). You get the raw materials from the world, but the necessity comes from how you reckon with them. This leads to his skeptical view of natural philosophy (physics). Since humans did not create nature, we cannot know the causes of natural phenomena with the same certainty as geometry or politics. We can observe effects and hypothesize causes, but unless we can reduce physics to geometry (motion and quantity), natural philosophy often remains probabilistic "prudence" rather than certain "science." Observation alone yields expectations, not demonstrative knowledge, because we cannot peek into the essential definitions of natural bodies that we did not construct.

  So, your group is not inventing a problem; you have identified the core of Hobbes's conventionalism. The necessity is reckoning-relative because truth is a property of our propositions, but it applies to the world because the world is composed of matter in motion, which is what geometry describes. God's bestowal is the gift of reason, actualized only where humans agree on definitions. Civil philosophy is a full science because it is constructive like geometry, whereas natural science is limited because nature is not our construction.

  Hobbes treats scientific necessity as fundamentally reckoning-relative rather than world-imposed, meaning geometry and civil philosophy count as sciences only because humans construct their objects through definitions and covenants, allowing for demonstrative knowledge that natural philosophy cannot match.
