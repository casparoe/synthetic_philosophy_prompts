answer: |-
  You have correctly identified that the strong Sapir-Whorf hypothesis is a trap for fiction. If language determines thought, your characters aren't people; they are programs. If language changes nothing, your invented grammar is a costume. You need the middle ground: language as friction, as cost, and as social contract.

  Here is the breakdown of *1984* through your three claims, followed by how to apply that scaffolding to your evidentiality draft.

  ### Part 1: Reading *1984* Through Your Three Claims

  You proposed splitting the linguistic determinism claim into three parts. Here is how Orwell handles them.

  **1. The Lexical Ceiling (No word, no concept, no thought)**
  *   **The Text's Stance:** This is Syme's thesis in the canteen. He argues that by removing words like "bad" or "excellent," you remove the capacity for nuanced judgment.
  *   **The Narrative Reality:** The novel quietly disproves this as a hard law. Winston thinks complex, rebellious thoughts *before* he is caught. He conceives of "freedom," "truth," and "the past" even when the vocabulary is being stripped around him. He writes the diary. If the Lexical Ceiling were absolute, the book would end on page one.
  *   **The Verdict:** Orwell treats this as a *political goal*, not a linguistic fact. The Party *wants* this to be true eventually. They are trying to atrophy the muscle of dissent by starving it of vocabulary. But in the present tense of the story, thought outruns language. Winston proves that you can hold a concept even if you have to describe it clumsily.
  *   **Where it breaks:** If you write your religious community as literally incapable of conceiving of an un-sourced event, you break the realism. They must be able to think it; they just can't easily *codify* it.

  **2. Obligatory Grammar as a Tax (Thought is expensive)**
  *   **The Text's Stance:** This is the lived experience of the protagonist. Newspeak isn't just about missing words; it's about the structure of expression. To express a heretical thought in Newspeak requires circumlocution. It is clumsy. It draws attention.
  *   **The Narrative Reality:** Winston's diary entries are laborious. He struggles to pin things down. The friction of the language makes dissent exhausting. It doesn't make it impossible, but it makes it unsustainable. You can think a rebellious thought, but you cannot hold it for long without a vocabulary to support it. It slips away.
  *   **The Verdict:** This is the strongest engine in the book. Language acts as a gravity well. You can jump, but you always land back where the grammar pulls you. For your draft, this is your gold mine. Mandatory evidentiality shouldn't stop your characters from having doubts; it should make expressing those doubts *socially expensive* or *cognitively tiring*.

  **3. The "Sayable" Claim (Language controls shared reality)**
  *   **The Text's Stance:** This is the mechanism of O'Brien's power. It is not enough for Winston to think 2+2=4; he must *say* 2+2=5. But more importantly, he must accept that the *shared reality* is defined by the Party's statement.
  *   **The Narrative Reality:** Thoughtcrime is rarely detected by telepathy; it is detected by slips of the tongue, facial expressions, or written records. The control is on the *output*. If you cannot say it, you cannot verify it with another human. If you cannot verify it, you cannot build a coalition. Isolation kills the thought.
  *   **The Verdict:** This is where Orwell is most accurate. Language doesn't cage the individual mind; it cages the *connection* between minds. Doublethink works because everyone agrees to use language to describe the same false reality.

  **Summary of the *1984* Analysis:**
  Orwell asserts (1) as propaganda, relies on (2) for atmosphere, and depends on (3) for the plot. He is not doing linguistics; he is doing politics. He uses language as a metaphor for power. You can do the same without faking anthropology.

  ### Part 2: Applying This to Your Evidentiality Draft

  You asked: *Does mandatory evidentiality make them worse liars or better ones?*

  If you follow the *1984* model (specifically claims 2 and 3), the answer is: **It makes them more ritualized liars.**

  If I cannot say "It rained," I must say "I saw it rain" or "I heard it rain."
  *   **The Amateur Liar** lies about the rain. ("It didn't rain.")
  *   **The Master Liar** lies about the evidence. ("I saw it rain," when they actually heard it.)

  In a community with mandatory evidentiality, truth isn't about the event; it's about the *relationship to the event*. This creates a hierarchy of authority. "I saw it" is higher status than "I was told it." "God showed me" is the highest status of all.

  **The Conflict for Your Narrator:**
  The narrator is an outsider. They speak a language without evidential markers. To the community, the narrator's speech sounds pathological.
  *   When the narrator says "It rained," they are refusing to cite a source.
  *   To the community, this sounds like either **omniscience** (I know it rained because I am God) or **insanity** (I know it rained but I don't know how).
  *   This wrecks the narrator's life not because they can't think, but because they cannot *trust* or be *trusted*. They are permanently outside the economy of truth.

  **Three Scenes to Reread (Conceptually):**

  1.  **The Canteen Scene (Syme explaining Newspeak):**
      *   *Read for:* The *intent* of control. Syme isn't trying to stop people from thinking; he's trying to stop them from *articulating* deviations.
      *   *Apply to:* A scene where a member of the community explains the grammar to the narrator. They shouldn't say "This stops us from lying." They should say, "This stops us from speaking carelessly." The grammar is framed as a spiritual hygiene, not a cage.

  2.  **The Diary Scene (Winston writing alone):**
      *   *Read for:* The friction of private thought. Winston struggles to find words for his memories.
      *   *Apply to:* A scene where the narrator tries to learn the grammar. Show the cognitive load. They have to pause before every past-tense verb to calculate: *Did I see this? Or was I told?* Show them making a mistake. Show the community's reaction to that mistake. It shouldn't be "You lied." It should be "You are unmoored."

  3.  **The Interrogation Scene (O'Brien and Winston):**
      *   *Read for:* The enforcement of shared reality. O'Brien doesn't just want Winston to say the words; he wants Winston to align his internal state with the external requirement.
      *   *Apply to:* A scene where the narrator is forced to use the grammar to confess or testify. They are forced to mark a source they don't have. They must say "I saw" when they only "inferred." This is the moment of conversion. To speak the language is to submit to the epistemology.

  ### Part 3: The Version Where Language Wrecks the Life Without Changing the Mind

  You want the version where the language does almost nothing to the way people think but still wrecks the narrator's life. Here is the scaffolding for that:

  **1. The Grammar of Humility vs. Authority**
  In your community, the evidential markers likely encode humility. "I inferred" is humble. "I saw" is authoritative. "It was revealed" is divine.
  The narrator, coming from a flat language, cannot signal humility correctly. They sound arrogant when they mean to be modest. They sound uncertain when they mean to be firm.
  *   **The Wreck:** The narrator isn't ostracized because they are heretical; they are ostracized because they are *rude*. They are constantly accidentally claiming authority they don't have.

  **2. The Strategic Lie**
  The community members are not truth-machines. They are humans. They know how to game the system.
  *   If a leader wants to assert control, they shift from "I was told" to "I saw."
  *   If a leader wants to avoid blame, they shift from "I saw" to "It was inferred."
  *   **The Wreck:** The narrator realizes the community is lying, not about the facts, but about their *access* to the facts. The narrator sees the manipulation, but because they lack the grammar, they cannot expose it. They can't say, "You didn't see that, you only heard it." They lack the vocabulary to challenge the *source*, only the *event*.

  **3. The Isolation of the Unsourceable**
  There are things the narrator knows that cannot be sourced in the community's framework.
  *   Example: Intuition, memory, dreams, or abstract deduction.
  *   If the grammar requires a physical source (Saw, Heard, Touched), how does one say "I remember"? Is memory a form of seeing? Or is it a form of being told (by your past self)?
  *   **The Wreck:** The narrator has internal experiences that are untranslatable. They are lonely not because they are misunderstood, but because their internal life is grammatically illegal. They are forced to categorize their memories as "visions" or "hearings" to make them speakable. This distorts their own sense of self.

  ### Final Recommendation

  Do not write the community as incapable of doubt. Write them as **compelled to categorize doubt.**

  *   **Bad Whorfianism:** They cannot conceive of a lie.
  *   **Good Whorfianism:** They cannot tell a lie without committing to a specific type of betrayal.

  If I say "I saw it rain" and I didn't, I am a liar.
  If I say "I heard it rain" and I saw it, I am diminishing my own authority.
  If I say "It must have rained" (inferred) and I saw it, I am being suspiciously humble.

  The tension comes from the **social cost of the marker**, not the impossibility of the thought. The narrator's tragedy is that they can see the game, but they cannot play it. They are holding a hand of cards in a game where everyone else is required to show their sleeves.

  Orwell's lesson is that language controls the *agreement* on reality, not the *perception* of it. Your narrator should be the only person who perceives the reality correctly but is unable to ratify it with anyone else. That is a sufficient hell for a novel.
