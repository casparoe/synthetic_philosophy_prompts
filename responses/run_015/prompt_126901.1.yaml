          *   Must be answerable without web access/bibliography (reasoning from first principles).
          *   No citations/reading lists required in the prompt.
      *   **Deliverables:**
          1.  The Exam Question (45 mins, ~800 words expected).
          2.  A Model Answer (~800 words).
          3.  A Marking Scheme (20 marks total, distinguishing A vs. B work, specifying errors/omissions).

  2.  **Deconstruct the Philosophical Problem:**
      *   *Core Tension:* Revealed Preference Theory (RPT) usually equates choice with preference ($x \succ y \iff x$ chosen over $y$). If choice changes ($x$ chosen in binary, $y$ chosen in ternary), RPT typically infers preference instability or context-dependence.
      *   *The Agent's Claim:* "My welfare ordering is fixed ($X \succ Y$). My *choice rule* changes based on the menu (specifically the presence of $Z$)."
      *   *The Decoy Effect:* This sounds like the attraction effect or asymmetric dominance, but the twist is the *agent's justification* (a meta-rule about regret).
      *   *The Philosophical Stakes:* Is utility a mental state (welfare) revealed by choice, or is it a theoretical construct defined *by* choice? If the agent says "I prefer X but choose Y," does RPT have the authority to say "No, you prefer Y"? If RPT says "Preferences changed," does that beg the question against the agent's introspective report?
      *   *Circularity:* If RPT defines preference *as* choice, then saying "Choice changed, so preference changed" is tautological. If RPT allows "Preference $\neq$ Choice," it risks becoming unfalsifiable or losing its behavioralist purity.

  3.  **Drafting the Exam Question:**
      *   Need to set the scene clearly using the provided framing.
      *   Need to ask specific sub-questions to guide the 45-minute essay.
