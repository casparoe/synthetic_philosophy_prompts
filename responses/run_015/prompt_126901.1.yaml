          *   Section 2: The Agent's Defense (Meta-rules). Distinguishing "normative welfare" from "operational choice function."
          *   Section 3: Circularity & Construction. If RPT accepts the agent's story, does it cease to be *revealed* preference? It becomes a theory of rationalization.
          *   Conclusion: The case shows RPT is a methodological stance, not an empirical discovery. It constructs utility to ensure consistency, potentially at the cost of descriptive truth about welfare.
      *   *Tone:* Analytical, precise, avoiding name-dropping (as per instructions).
      *   *Length:* Aim for ~800 words.

  5.  **Drafting the Marking Scheme:**
      *   Total: 20 Marks.
      *   Need to distinguish A (Excellent/Insightful) from B (Competent/Surface).
      *   *Key Analytical Moves:*
          1.  Defining the RPT identity condition (Choice = Preference).
          2.  Analyzing the "Menu-Dependence" implication.
          3.  Addressing the Circularity/Truism charge.
          4.  Evaluating the Welfare vs. Choice distinction.
      *   *Penalties:* Vague definitions, ignoring the agent's testimony, failing to address circularity.

