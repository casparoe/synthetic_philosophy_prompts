      *   *Tasks:*
          1.  Does RPT *force* an interpretation of preference change?
          2.  Can RPT accommodate the self-interpretation without circularity?
          3.  Implications for "utility is revealed" vs. "utility is constructed."
      *   *Word Count:* Ensure the prompt itself doesn't eat up too much space, leaving room for the student's essay plan.

  4.  **Drafting the Model Answer:**
      *   *Structure:*
