      *   If I intervene, does the outcome change?
      *   Realist: Yes, because I altered the cause.
      *   Occasionalist: Yes, because God's Custom links intervention to outcome.
      *   *Wait, the prompt asks for a tension regarding the "slow, predictable course."*
      *   Let's focus on **The Explanation of Continuity.**
      *   How do we explain the *smoothness* of decline without causal persistence?
      *   If every moment is discrete, why does the decline look like a curve rather than random jumps?
      *   *The Issue:* **The Ontological Status of the "Trajectory."**
      *   For the realist, the trajectory exists in the patient. For the occasionalist, it exists only in the observer's expectation of God's habit.
      *   *The Tension:* **Can a Physician Rationally Assert "Inevitability"?**
      *   If I tell the family "The decline is inevitable," I am making a strong modal claim.
      *   Occasionalism makes all created events contingent.
      *   So, the physician is claiming "Contingent Inevitability."
      *   *The Conceptual Problem:* **Reconciling Modal Strength with Metaphysical Contingency.**
      *   How can a prognosis be "strong" (reliable enough to make end-of-life decisions) if its metaphysical ground is "weak" (purely contingent habit)?

  8.  **Finalizing the Example:**
