      *   In a causal realist framework, prognosis works because mechanisms persist. If mechanism $M$ exists in state $S_1$, it will produce $S_2$.
      *   In occasionalism, prognosis works because God *usually* acts in a consistent way.
      *   *The Specific Issue:* **The Problem of Interventional Counterfactuals.**
      *   If a physician prescribes a drug to slow decline, the causal realist says: "This drug interferes with mechanism $X$." The occasionalist says: "God usually creates recovery when this drug is ingested."
      *   But for *chronic* illness, the prognosis is often about *non-intervention* or the *limits* of intervention. "This will get worse even if we do $Y$."
      *   How does the occasionalist justify the certainty of "getting worse" without invoking a causal power within the disease itself? If the disease has no power, what stops God from halting it? The answer "God's Custom" feels weak for *specific* clinical trajectories.

