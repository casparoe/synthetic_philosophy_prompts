      *   *Causal Realist:* The pathology has a momentum. The biological state at $T_1$ necessitates (probabilistically) the state at $T_2$.
      *   *Occasionalist:* At $T_1$, God creates the state. At $T_2$, God creates the next state.
      *   *The Tension:* How do we ground the *connection* between $T_1$ and $T_2$ such that the prediction is rational, not just a guess based on past observation?
      *   *Refining the Tension:* It's about **Explanatory Depth vs. Descriptive Correlation.**
      *   If I say "Synapses die, therefore memory fails," I am offering a mechanism.
      *   If I say "Synapses die, and then God makes memory fail," I am offering a correlation.
      *   *The Conceptual Issue:* **The Status of the "Clinical Course" as a Unified Object.**
      *   For the realist, the "disease" is a continuing entity/process. For the occasionalist, the "disease" is a linguistic label for a series of disconnected divine acts.
      *   *The Prognostic Problem:* How can a physician rationally advise against a futile treatment if there is no causal barrier preventing recovery?
      *   *Let's focus on the "Rational Basis for Prognosis" constraint.*
      *   Issue: **The Justification of Inductive Inference in the Absence of Causal Necessity.**
