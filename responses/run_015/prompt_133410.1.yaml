      *   If causality is denied, every moment is a fresh creation. Why should the "rule" apply to *this* father at *this* time?
      *   Better angle: **The Tension between "Habit" (*'Ādah*) and "Medical Necessity."**
      *   Physicians speak in terms of "expected progression." This implies a constraint on nature. Occasionalism implies the only constraint is God's will.
      *   *The Specific Conceptual Issue:* **The Ontological Status of the "Progressive" Aspect.**
      *   "Progressive" implies an internal vector. Occasionalism denies internal vectors.
      *   So, what makes the prognosis *rational* rather than *psychological*?

  5.  **Selecting the Best Example:**
      *   I need an example where the physician needs to explain *why* a treatment won't work, or *why* decline will continue, without saying "the disease causes it."
