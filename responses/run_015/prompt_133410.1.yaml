      *   This forces a redefinition of what a "medical explanation" is. It becomes a "theological pattern recognition."
      *   This creates a gap between the *language* of medicine (causal) and the *metaphysics* of the physician (occasionalist).

  9.  **Drafting the Response:**
      *   *Empathy:* Start by acknowledging the pain of the situation.
