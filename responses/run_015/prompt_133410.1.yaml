      *   If the link is only "God's Habit," then the certainty of the prognosis is epistemological (based on our observation of habit), not ontological (based on the nature of the disease).
      *   *The Conceptual Conflict:* **Ontological Contingency vs. Clinical Necessity.**
      *   Clinically, the decline feels necessary (given the biology). Metaphysically, it is contingent (God could stop it).
      *   How does the physician maintain the *authority* of the prognosis ("This *will* happen") while admitting the metaphysics ("This *could* not happen")?
      *   *Resolution Focus:* Clarifying "Predictive Reliability."
      *   It requires shifting from "Causal Prediction" to "Recognition of Pattern."
      *   The physician isn't predicting a cause-effect chain; they are identifying a position within a established Divine Custom.

  7.  **Refining the Output (Self-Correction during drafting):**
      *   *Check:* Did I address the "chronic illness" aspect? Yes, by focusing on the *progression* over time.
      *   *Check:* Is it conceptual? Yes, focusing on the nature of explanation and prediction, not data.
