  Here's a thinking process that leads to the suggested allocation procedure:

  1.  **Deconstruct the Request:**

      *   **User Role:** Director of Variety Development at a mid-sized seed company.
      *   **Context:** High stakes (£18m base, £12m cliff triggers restructuring/closure). Team is small (2 breeders, 1 analyst), low math sophistication (needs spreadsheet logic).
      *   **Constraints:**
          *   60 candidates -> 6-10 advanced (Stage 2).
          *   Two decision cycles (Spring main, Autumn top-up).
          *   No external capital, no borrowing. Uncommitted capital earns ~0 real return.
          *   Stage 2 cost: £0.6m - £2.4m (3 years).
          *   Payoff: 60% of successes return 3-6x spend; tail ends 10-40x.
          *   Funding Lumps: 0%, 70%, 100%. <70% collapses success rate.
          *   Correlations: Systemic risk (bad seasons, 1 in 8 years, success drops to 8%). Capacity constraint (>8 projects reduces success probability).
          *   Probability Estimates: Thin, optimistic, self-selected reference class.
          *   Mandated Project: Negative EV, must fund.
          *   CFO Mindset: EV/IRR focused. Wants to know why not just rank by EV.
      *   **Philosophical Stance:** User suspects Kelly Criterion (log utility) is appropriate due to ruin risk, despite finite horizon and corporate structure.
      *   **Deliverables:**
          1.  A step-by-step procedure (spreadsheet-ready).
          2.  A paragraph for the CFO (EV vs. Survival).
          3.  Worked examples (Case A, B, C).
          4.  Limitations/Failure modes (What can't it do? What assumptions are load-bearing?).

  2.  **Analyze the Core Problem:**

      *   **Objective:** Maximize long-term growth *without* hitting the £12m ruin barrier.
      *   **Tension:** CFO wants EV maximization (linear utility). Director fears ruin (concave utility/log growth).
      *   **Reality:** The company is a "single entity" regarding this programme's survival. If the base drops below £12m, the programme dies. This makes the £12m barrier an *absorbing state*.
      *   **Mathematical Implication:** Standard EV maximization ignores the variance and correlation that lead to ruin. Kelly Criterion (log utility) accounts for variance but assumes infinite horizon and independent bets. Here, we have finite horizon, correlated bets, and a hard barrier.
      *   **Adjustment:** We need a "Fractional Kelly" approach adjusted for correlation and the specific barrier. Since the team can't run complex simulations, we need a heuristic that approximates risk-adjusted allocation.

  3.  **Drafting the Procedure (Deliverable 1):**

      *   *Step 1: The Mandate.* Handle the negative EV project first. It's a tax on the portfolio.
      *   *Step 2: Probability Haircut.* The estimates are optimistic. Need a shrinkage factor. Since they have 2 years of data, use a simple Bayesian-like shrinkage or a fixed discount (e.g., 50% of stated prob) until calibration improves. Let's suggest a "Confidence Weight" based on analogue count.
      *   *Step 3: Capacity Check.* Hard limit at 8 projects. >8 reduces success prob. This is a hard constraint.
      *   *Step 4: Correlation Adjustment.* The "Bad Year" risk (1 in 8). We need to stress-test the portfolio against this.
      *   *Step 5: Sizing/Selection.* Instead of pure Kelly (which is hard with lumpy bets), use a "Risk Budget" approach.
          *   Calculate "Risk-Adjusted Value" (RAV).
          *   RAV = (Prob_Success * Payoff) - Cost. (This is EV).
          *   But we need to penalize variance.
          *   Simpler for spreadsheet: Rank by EV, but apply a "Correlation Discount" and a "Ruins Test".
          *   *Better approach for the User's specific constraints:* Use a modified Kelly fraction but constrained by the "Ruins Barrier".
          *   *Actually, keep it simpler:* The user asked for a procedure *they* can run. Complex optimization is out.
          *   *Proposed Method:* "The Survival-Weighted Rank."
          *   1. Adjust Probabilities (Haircut).
          *   2. Calculate Adjusted EV.
          *   3. Apply Correlation Penalty (if similar trait/environment).
          *   4. Select top projects until Budget or Capacity (8) is hit.
          *   5. **The Barrier Test:** Simulate the "Bad Year" (1 in 8). Does the bankroll stay above £12m? If not, cut the lowest ranked project and re-test.
      *   *Sizing:* 70% vs 100%. 70% is better if EV/Pound is higher, but 100% is better if absolute success prob is critical. The prompt says 70% has higher expected multiple per pound but lower chance of *any* success. Given the ruin risk, we want to avoid total loss. However, 70% saves cash. Let's recommend 70% as default for diversification, 100% only for "Flagships" that pass the Barrier Test comfortably.
      *   *Exploration Budget:* Address Case A here. Is it coherent? Yes, if treated as R&D expense (OpEx) rather than Capital Investment (CapEx). Needs strict cap (e.g., 5% of base).

  4.  **Drafting the CFO Argument (Deliverable 2):**

      *   CFO asks: "Why not highest EV?"
      *   Answer: EV assumes you can play the game forever. We have a "knock-out" rule (£12m). High EV strategies often have high variance. High variance + Knock-out rule = High probability of elimination before the "average" outcome realizes.
      *   Verdict: It's a real argument (math of ruin), not just framing. But it relies on the £12m barrier being hard (which it is).

  5.  **Working the Cases (Deliverable 3):**

      *   *Case A (Flagship):* High variance, low prob. Kelly would say bet tiny or nothing. But it's indivisible. Exploration budget is the solution.
      *   *Case B (Dull):* High prob, low multiple. 70% funding looks attractive on EV/£. But does it reduce ruin risk? Yes, cheaper.
      *   *Case C (Duplicates):* Correlation. If both succeed, value drops. Need to treat the second one as having a lower marginal payoff.

  6.  **Analyzing Limitations (Deliverable 4):**

      *   *Load-bearing assumptions:*
          1.  The £12m barrier is hard and immediate. (If corporate is flexible, the procedure is too conservative).
          2.  Probability estimates are directionally correct after haircut. (If they are noise, the ranking is noise).
      *   *Horizon:* Kelly assumes infinite. We have corporate review cycles. This means we should be *more* conservative than Kelly, not less, because we can't recover from a bad 3-year cycle.
      *   *Measurement:* Track "Forecast vs. Actual" success rates. Track "Base Volatility".

  7.  **Refining the Logic (Self-Correction during drafting):**

      *   *Critique:* Is "Risk-Adjusted Value" too vague?
      *   *Fix:* Let's use a specific metric: **Survival-Adjusted Expected Value (SAEV)**.
      *   *Formula:* $SAEV = (P_{adj} \times Payoff) - Cost$.
      *   *Constraint:* Portfolio Cost + Mandated <= Budget.
      *   *Constraint:* Portfolio Count <= 8.
      *   *Constraint:* Stress Test (Bad Year) -> Bankroll > £12m.
      *   *Probability Haircut:* Since they have no calibration data, use a "Reference Class Discount". If <5 analogues, cut prob by 50%. If 5-10, cut by 25%.
      *   *Correlation:* If projects share the same "failure mode" (e.g., same disease resistance, same region), group them. Limit exposure per group.
      *   *CFO Argument:* Needs to be punchy. "EV is an average over infinite trials. We have one trial with a stop-loss."
      *   *Case A:* The "Exploration Budget" is coherent *if* it's treated as sunk cost. It prevents the main portfolio from taking asymmetric risk.
      *   *Case B:* 70% funding. If cash is tight, 70% allows more bets. But if success prob drops too much, it might not be worth it. The prompt says 70% has higher EV per pound. So 70% is preferred for capital efficiency.
      *   *Case C:* Marginal value. Project 1 = Full Value. Project 2 = (Full Value * Cannibalization Factor). Rank based on marginal value.

  8.  **Final Polish:**

      *   Ensure tone is professional, direct, and empathetic to the stakes (55 jobs).
      *   Avoid jargon where possible, or define it simply.
      *   Make sure the spreadsheet logic is explicit (columns, inputs).
      *   Check the "Bad Year" math. 1 in 8 years = 12.5% chance. If base is £18m, and we spend £X, and get £Y back... wait, the trials take 3 years. The ruin check needs to happen on *cash flow*, not just immediate spend.
      *   *Correction on Ruin Check:* The £12m barrier is the *base*. The base is likely the accumulated retained earnings/capital allocated. Spending reduces the base? Or is the base the *starting point* for the cycle? "If it falls below £12m". Spending Stage 2 reduces cash on hand. Royalties add to it.
      *   *Simplification for Spreadsheet:* Treat the "Base" as the liquid reserve available to absorb losses.
      *   *Stress Test:* Assume 0 return from *new* cohort in a bad year. Do we still have £12m after spending the budget?
      *   *Wait, the prompt says:* "Uncommitted capital carries over... earns zero." "Base is currently £18m." "If it falls below £12m... restructuring."
      *   This implies the Base is the Net Asset Value or Cash Reserve allocated to the programme.
      *   Spending Stage 2 reduces the Base immediately (cash outflow). Royalties come later.
      *   So, Ruin Check: Current Base (£18m) - Total Stage 2 Spend (including Mandated) > £12m Buffer?
      *   Actually, usually, the base includes the value of ongoing projects. But the trigger is likely financial covenants or corporate cash allocation. Let's assume the worst case: Cash on Hand.
      *   If we spend £2m/year on 8 projects = £16m over 3 years. That's £5.3m/year.
      *   If Base is £18m, and we spend £5m this year, we are at £13m. One bad year of spend + no royalties = Danger.
      *   Okay, the procedure needs to ensure that *Annual Burn* does not threaten the barrier even if *Royalties* drop to zero (Bad Year).

  9.  **Structuring the Response:**

      *   **Part 1: The Procedure.** (Step-by-step, spreadsheet columns).
      *   **Part 2: The CFO Memo.** (The argument).
      *   **Part 3: The Cases.** (Applied logic).
      *   **Part 4: Limitations & Failure Modes.** (The "What if I'm wrong" section).

  10. **Final Review against Constraints:**
      *   No citations/links.
      *   Spreadsheet friendly.
      *   Address the "Exploration Budget" coherence.
      *   Address the "Finite Horizon" vs "Kelly" tension.

      *(Self-Correction on Kelly)*: I need to be careful not to oversell Kelly. Kelly maximizes *geometric* growth. With a hard barrier, we need *Survival* first, Growth second. I will frame it as "Barrier-Constrained Allocation" rather than pure Kelly.

      *(Refining the Probability Haircut)*: The user says estimates are thin. A simple rule: $P_{adjusted} = P_{stated} \times \sqrt{N_{analogues} / 10}$. Or simpler: If <5 analogues, halve the probability. Let's go with the "Analogue Count Discount".

      *(Refining the Correlation)*: Group projects by "Failure Mode" (e.g., Drought sensitive, Disease X). Limit total spend per group.

      *(Refining the CFO argument)*: Focus on "Ergodicity". The ensemble average (EV) is not the time average (Survival).

      *(Refining Case A)*: Exploration budget is coherent *if* it is capped and non-replenishable from profits (or replenished slowly). It acts as an option premium.

      *(Refining Case C)*: Marginal contribution.

      *(Refining Limitations)*: The biggest risk is the "Mandated Project". It drains resources. The procedure must account for it as a fixed cost.

      Let's write it.
answer: |-
  ### 1. The Allocation Procedure (The "Survival-First" Protocol)

  This procedure is designed for a spreadsheet. It prioritizes keeping the programme above the £12m barrier over maximizing theoretical expected value. It treats the £18m base not as infinite capital, but as a finite fuel tank with a "low fuel" light that triggers engine shutdown.

  **Inputs Required (Columns A–G):**
  1.  **Project ID**
  2.  **Breeder Probability ($P_{breeder}$):** The breeder's stated success % (0–100).
  3.  **Analogue Count ($N$):** Number of historical lines similar to this candidate.
  4.  **Cost at 100% ($C_{100}$):** Full funding cost.
  5.  **Cost at 70% ($C_{70}$):** 0.7 $\times$ $C_{100}$.
  6.  **Upside Multiple ($M$):** Expected return on investment *if* successful (e.g., 3.0 for 3x).
  7.  **Correlation Group:** Tag projects that share a primary failure mode (e.g., "Drought Sensitive," "Disease X," "Same Market").

  **Step 1: The Mandate Tax**
  Before evaluating candidates, deduct the cost of the mandated regulatory project from your available annual budget and from your current Base.
  *   *Action:* Record Mandated Cost ($C_{mand}$).
  *   *Adjusted Base:* $£18m - C_{mand}$.
  *   *Rule:* If Adjusted Base < £13m, **STOP**. You are already in the danger zone. No optional projects proceed. Hand decision to Committee.

  **Step 2: Probability Haircut (The Calibration Rule)**
  Your team's probabilities are optimistic and based on selected data. Apply a mechanical discount to force conservatism.
  *   *Formula:* $P_{adj} = P_{breeder} \times \min(1, \sqrt{N / 10})$
  *   *Logic:* If you have 10 analogues, keep the probability as is. If you have 2 analogues, multiply probability by $\sqrt{0.2} \approx 0.45$. If you have 0 analogues, probability becomes 0 (automatic reject unless Exploration Budget applies).
  *   *Hard No:* If $P_{adj} < 5\%$, reject immediately. The signal is too weak for the capital risk.

  **Step 3: Calculate Survival-Adjusted Value (SAV)**
  Do not rank by Expected Value (EV). Rank by value per unit of *risk capital*.
  *   *Formula:* $SAV = (P_{adj} \times M \times C_{100}) - C_{100}$
  *   *Note:* This is essentially EV, but using the *haircut* probability.
  *   *Funding Choice:* Calculate SAV for both 100% and 70% funding.
      *   If $SAV_{70\%} / C_{70} > SAV_{100\%} / C_{100}$, mark as **Preferred 70%**. (Capital efficiency).
      *   Otherwise, mark as **Preferred 100%**. (Maximize hit rate).
  *   *Selection:* Use the funding level with the higher SAV per pound for the ranking.

  **Step 4: Correlation & Capacity Constraints**
  *   *Capacity Hard Limit:* Select maximum 8 projects total (including Mandated). If >8, drop lowest SAV.
  *   *Correlation Limit:* For any "Correlation Group," total spend cannot exceed 40% of the remaining budget. This prevents a single bad season from wiping out the cohort.
  *   *Duplicate Penalty (Case C):* If two projects are in the same group and target the same commercial niche, the second project's Upside Multiple ($M$) is reduced by 50% before calculating SAV. (The market cannot pay twice for the same trait).

  **Step 5: The Barrier Stress Test (The Ruin Check)**
  This is the most critical step.
  *   *Scenario:* Assume a "Bad Year" (1 in 8 probability). In this scenario, assume *all* new Stage 2 projects in the current cohort return £0 royalties for the next 3 years.
  *   *Calculation:* Current Base (£18m) - (Total Selected Project Costs Year 1) - (Mandated Cost) - (Existing Programme Burn Rate).
  *   *Rule:* If Result < £12.5m, **REJECT THE LOWEST RANKED PROJECT**. Repeat until the result is > £12.5m.
  *   *Why £12.5m?* You need a buffer above the £12m trigger to account for accounting lag or unexpected operational costs.

  **Step 6: Final Approval**
  *   If the list passes the Stress Test, submit to Investment Committee.
  *   If the list is empty after Stress Test, submit a "Zero Investment" recommendation with the Stress Test data attached. This forces the Committee to explicitly authorize the risk of restructuring.

  ---

  ### 2. The CFO Paragraph

  **Subject: Rationale for Allocation Methodology**

  "You asked why we do not simply fund projects in descending order of Expected Value (EV). EV assumes we can repeat this investment cycle infinitely and that losses in one year can be perfectly offset by gains in another. That is not our reality. We operate with a hard solvency barrier at £12m; breaching it terminates the programme regardless of the long-term average. High-EV strategies in biological systems are typically high-variance, driven by rare 'home runs.' If we optimize for EV, we maximize the probability of those home runs, but we also maximize the probability of a cohort-wide failure in a bad season. Given our capital constraints and the correlation of biological risk (e.g., drought affects all trials simultaneously), an EV-maximizing portfolio has a statistically significant chance of hitting the £12m barrier within three years. The procedure I am proposing sacrifices some theoretical upside to ensure the probability of ruin remains below 5% per cycle. We are optimizing for survival first, growth second, because a dead programme has an EV of zero."

  **Verdict:**
  This is a **real argument**, not a framing change. It relies on the mathematical concept of *ergodicity*. The ensemble average (what the CFO sees across many hypothetical companies) is not the time average (what happens to *this* company over time). If the barrier is hard (which you say it is), maximizing EV is mathematically suboptimal for survival. However, the argument weakens if the £12m barrier is actually soft (i.e., Corporate *might* bail you out). If the barrier is soft, the CFO is right, and you are being overly conservative.

  ---

  ### 3. Worked Cases

  **Case A: The Flagship Long-Shot**
  *   **Data:** Cost £2.2m. $P_{breeder} = 8\%$. $N = 1$ (Novel trait). $M = 40x$.
  *   **Step 2 (Haircut):** $P_{adj} = 8\% \times \sqrt{1/10} = 8\% \times 0.316 = 2.5\%$.
  *   **Step 3 (SAV):** $(0.025 \times 40 \times 2.2) - 2.2 = 2.2 - 2.2 = 0$.
  *   **Result:** The project has zero Survival-Adjusted Value. It is a coin flip for the budget.
  *   **Exploration Budget Coherence:** Creating an exploration sub-budget is **coherent**, provided it is treated as an *option premium*, not an investment.
      *   *Discipline:* Cap it at 5% of Base (£0.9m). It is expensed immediately (P&L hit), not capitalized.
      *   *Replenishment:* Only replenished if the main portfolio exceeds £20m base.
      *   *Authority:* Only you (Director) can authorize spend, not breeders.
      *   *Empty Book:* If the book is empty, the project is **rejected**. You cannot borrow from the main bankroll.
      *   *Verdict:* Fund £0.9m from Exploration, reject the remaining £1.3m from Main. If the breeder refuses partial funding, the project is a "No."

  **Case B: The Dull One**
  *   **Data:** Cost £1.9m (100%) / £1.33m (70%). $P_{base} = 0.6$ (60%). $M = 2.4x$.
  *   **Step 2 (Haircut):** $N=14$. $\sqrt{14/10} > 1$. No haircut. $P_{adj} = 60\%$.
  *   **Step 3 (SAV 100%):** $(0.6 \times 2.4 \times 1.9) - 1.9 = 2.74 - 1.9 = +£0.84m$.
  *   **Step 3 (SAV 70%):** Analyst says success rate drops to 50%. Payoff scales proportionally (so $M$ is effectively same, but cost is lower).
      *   $(0.5 \times 2.4 \times 1.33) - 1.33 = 1.60 - 1.33 = +£0.27m$.
      *   *Wait:* The prompt says "payoff scales roughly proportionally" but also "70% funding has a slightly higher expected multiple per pound." Let's assume the ROI is better at 70%.
      *   If ROI is higher at 70%, the SAV *per pound* is higher.
  *   **Decision:** If capital is tight (Barrier Test is close), choose **70%**. It preserves cash buffer. If capital is abundant, choose **100%** to maximize absolute surplus.
  *   **Two Projects:** If you have two of these and budget is tight:
      *   Fund both at 70% (£2.66m total) rather than one at 100% (£1.9m).
      *   *Why?* Diversification reduces cohort risk. Two independent 50% shots are better for survival than one 60% shot, provided the total spend doesn't breach the Barrier Test.

  **Case C: The Near-Duplicates**
  *   **Data:** Two projects, same gene, different backgrounds. $P_{adj} = 0.4$ each. $M = 3.0x$. Cost £1.5m each.
  *   **Standard SAV:** $(0.4 \times 3.0 \times 1.5) - 1.5 = 1.8 - 1.5 = +£0.3m$ each.
  *   **Correlation Adjustment:** They fail together in a network year. They cannibalize commercially.
  *   **Procedure:**
      *   Project 1: Full $M$ (3.0x). SAV = +£0.3m.
      *   Project 2: Reduced $M$ (1.5x due to cannibalization). SAV = $(0.4 \times 1.5 \times 1.5) - 1.5 = 0.9 - 1.5 = -£0.6m$.
  *   **Result:** Project 2 has negative Survival-Adjusted Value. **Reject Project 2.**
  *   *Rationale:* The second project adds cost and correlation risk without adding proportional portfolio value. It is redundant insurance that you cannot afford.

  ---

  ### 4. Limitations, Failure Modes, and Load-Bearing Assumptions

  **What the Procedure Cannot Do:**
  1.  **It cannot fix bad biology.** If your breeders cannot produce lines with >5% adjusted probability, the procedure will recommend investing nothing. You must be prepared to tell the Committee "We have no investable assets this year."
  2.  **It cannot predict the 'Bad Year' timing.** The Stress Test assumes the bad year happens *now*. If the bad year happens in Year 3 of the trial, you may have already spent the cash. The procedure assumes annual cash flow burn, not just total project cost.
  3.  **It assumes the Barrier is Hard.** If Corporate quietly injects cash when you hit £12.5m, this procedure is too conservative and will cost you market share against competitors who take more risk.

  **Load-Bearing Assumptions:**
  1.  **The £12m Barrier is Real and Immediate.**
      *   *Work:* This assumption does 80% of the work. It justifies the conservative probability haircut and the Stress Test.
      *   *Falsification:* If you hit £12.5m and Corporate does *not* trigger a review, or if they provide a bridge loan, the assumption is false.
      *   *Measurement:* Monitor Corporate communication during budget cycles. Ask Finance explicitly: "Is £12m a covenant breach or a management target?"
  2.  **Probability Estimates are Directional after Haircut.**
      *   *Work:* This assumption justifies the ranking. If the haircut doesn't correct the optimism bias, you are ranking noise.
      *   *Falsification:* Over the next 2 years, track $P_{adj}$ vs. Actual Success. If projects with $P_{adj} = 20\%$ succeed 5% of the time, your haircut is insufficient.
      *   *Measurement:* Create a "Calibration Table." Bucket projects by $P_{adj}$ (0-10%, 10-20%, etc.). Compare predicted success rate vs. actual. Update the Haircut Formula annually based on this.

  **Extrapolation Warnings (Where the Math Breaks):**
  *   **Finite Horizon:** The Kelly/Log-utility argument assumes you can recover from losses over infinite time. You have a 3-year corporate review cycle. This means you should be **more conservative** than the procedure suggests, not less. The procedure treats the barrier as the end of the game; in reality, a near-miss (£12.1m) might cost you your job even if the programme survives.
  *   **Correlation Cliffs:** The procedure assumes correlation is binary (Same Group/Different Group). In reality, a severe drought might hit 100% of your network, not just the "Drought Group." The Stress Test accounts for this, but the Ranking does not.
  *   **Lumpy Payoffs:** The procedure uses mean multiples. If the payoff distribution is "Power Law" (most fail, one wins 100x), the mean is misleading. However, given your ruin risk, ignoring the mean and chasing the tail is suicidal. The procedure correctly ignores the tail for sizing, but you must acknowledge that this means you will likely *miss* the 100x winner if it requires a bet size the procedure forbids.

  **How This Will Misfire (The Cost of Safety):**
  *   **The "Slow Death":** By avoiding risk, you may fail to replace aging varieties. Competitors who fund the "Flagship Long-Shots" (Case A) at full size may leapfrog you technologically. You survive financially but become commercially irrelevant.
  *   **The "False Negative":** The Haircut Rule will kill projects that are actually good but lack historical analogues (innovation). You will become excellent at breeding incremental improvements on old traits and incapable of novel trait development.
  *   **The "Budget Hoard":** Because uncommitted capital earns zero, the Stress Test might encourage you to hold cash rather than invest it to stay safely above £12m. This drags on IRR. You must set a rule: "If Base > £16m, relax Haircut by 10%." Force deployment when safe.

  **Final Instruction:**
  Run this procedure for two cycles. In parallel, run a "CFO EV Model" (simple ranking by EV). Compare the portfolios. If the EV model suggests a portfolio that fails your Stress Test, show the CFO the simulation of the "Bad Year" that bankrupts the programme. That visual is your only defense.
