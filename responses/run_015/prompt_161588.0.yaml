answer: |-
  **MEMORANDUM**

  **TO:** Committee on Research Integrity and Scholarly Attribution
  **FROM:** [Your Name], Junior Committee Member
  **DATE:** October 24, 2023
  **SUBJECT:** Decision Memo: Complaint Regarding Dr. Marisa Okonkwo and Dr. Tobias Renner

  **Background and Provisional Facts**
  The Committee reviews a complaint concerning scholarly attribution between Dr. Marisa Okonkwo (Host Institution) and Dr. Tobias Renner (Halvorsen Institute). During a semester visit, Renner attended a lab meeting where Okonkwo and a graduate student presented a "shopping list" of future research directions. This included applying a public perturbation protocol to a neglected model system, read out via a novel calcium-imaging method developed by the student. No data or written protocols were shared beyond a slide deck. Seven months later, Renner's group published this exact experiment. Okonkwo was acknowledged for "helpful discussions"; neither she nor the student received co-authorship. Okonkwo's lab posted a preprint on the readout method three months after Renner's visit. Okonkwo's original concept was partly derivative of a conference hallway conversation.

  **Policy Analysis (R-14)**
  Current Policy R-14 governs tangible research materials, data, and unpublished manuscripts. It is silent regarding ideas, hypotheses, or research directions disclosed verbally. Under a strict reading of R-14, no violation occurred. Renner utilized no tangible property or unpublished data protected by our jurisdiction. Consequently, the Committee lacks the grounds to issue a formal finding of research misconduct regarding the appropriation of the idea itself.

  **Ethical Considerations and Attribution**
  While no policy violation exists, the ethical landscape is complex. We must weigh three factors. First, Okonkwo's origination is partly derivative. However, scientific progress is combinatorial; the specific synthesis of public protocol and novel readout constituted a distinct intellectual contribution at the time of disclosure. Second, the subsequent preprint does not extinguish Okonkwo's claim. While the method became public, the *combination* remained unreconstructed until Renner's publication. Third, regarding desert: while execution creates value, the direction determined the value's locus. Renner's group benefited from "tacit scaffolding"—the student's know-how and calibration tricks discussed in the meeting—which reduced the risk and cost of his execution.

  We acknowledge the Provost's indication regarding the pending sponsored-research agreement with the Halvorsen Institute. While contractual considerations cannot dictate findings of integrity, they heighten the necessity of a resolution that preserves institutional relationships while correcting scholarly attribution. The remedy here should be credit rather than control. We cannot enjoin the work, but we can assert that the contribution warrants authorship consideration.

  **Recommendation**
  I recommend the Committee **dismiss the complaint under current policy while recommending that Policy R-14 be amended.** A formal violation finding is unsupported by existing text, yet a simple dismissal fails to address the inequity. We must signal that while ideas are currently unprotected, this gap will be closed, and the current dispute should be resolved through attribution mechanisms.

  **Proposed Policy Amendment (R-14)**
  To prevent recurrence, I propose the following addition to R-14:

  > *Section 4.2: Disclosed Research Directions.*
  > *Protectable Information shall include specific, novel research directions disclosed by a Host to a Visitor, provided such directions are recorded in a durable form (e.g., meeting minutes, shared slide decks, email correspondence) at the time of disclosure. Protection extends for a period of twenty-four months from disclosure. Remedy for misappropriation shall be mandatory attribution (co-authorship or prominent acknowledgment) determined by contribution level, not restriction on use.*

  This language balances protection with openness. It requires a durable record to prevent "he-said/she-said" claims, limits the protection window to encourage timely publication, and mandates attribution rather than blocking use.

  **Concrete Actions**
  1.  **Committee Vote:** Adopt this memo as the final decision on the complaint by November 15.
  2.  **Referral:** The Committee Chair shall refer the authorship dispute to the editors of the publishing journal and the Halvorsen Institute's ombuds office, enclosing this memo's findings on "tacit scaffolding" for their consideration in adjusting the authorship record.
  3.  **Policy Review:** The Subcommittee on Policy shall draft the final language for R-14 amendment based on Section 4.2 above for ratification by January 1.

  **The Strongest Counter-Argument**
  Senior members argue that protecting ideas risks chilling the open exchange vital to science. If lab meetings become legal minefields where every suggestion is logged for ownership, collaboration will retreat into silos. Furthermore, they contend that Renner's execution required expertise Okonkwo lacked; without his group's work, the idea remained theoretical. Protecting the "idea" risks granting property rights over scientific truth to those who speak first rather than those who verify. This is a substantial concern. Over-regulation can indeed stifle the very openness integrity policies seek to protect. However, relying on "tacit scaffolding" without attribution exploits the trust required for that openness to function. The proposed amendment mitigates the chilling effect by requiring durable records and limiting remedies to attribution, ensuring that credit follows contribution without halting progress.

  **Conclusion**
  Dismissal under current rules is legally necessary but ethically insufficient. By coupling dismissal with a targeted policy amendment and a referral for authorship review, we uphold current standards while correcting the specific injustice and securing future integrity.
