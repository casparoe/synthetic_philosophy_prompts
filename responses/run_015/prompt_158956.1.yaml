prompt: |-
  I help run a volunteer bike workshop, and after a blowup last month about our unwritten rules I've somehow ended up in charge of new-volunteer onboarding, which now includes a half-hour slot on why we do things the way we do and how that ever changes. I want to build it around the Lewis-style account of convention as an equilibrium of a coordination problem rather than around rules, agreements and enforcement. Don't explain the account to me — plan how I'd get it across to adults with no philosophy, most of whom think an unwritten rule is either a habit or just peer pressure, and who assume all our rules are the same kind of thing when I'm pretty sure they aren't.

  What I need: the order the pieces have to land in and what breaks if two of them get swapped; which of our two contested rules should carry the whole session — (a) whoever last used a tool leaves it out on the bench overnight instead of putting it back, or (b) nobody takes donated parts home during their first month — and what the carrying example has to have and has to lack so it doesn't smuggle in a second layer too early; the misconceptions to expect at each stage (I'm guessing "if its arbitrary then I don't have to follow it" and "we'd just need everyone to agree to switch at once") and the point in the sequence where each should be headed off; one closing question that shows me they've got the expectations structure and not just the vocabulary; and what I should openly refuse to go into at this level.
reasoning: |-
  Here's a thinking process that leads to the suggested onboarding plan:

  1.  **Analyze the Request:**
      *   **Context:** Volunteer bike workshop. Recent conflict over unwritten rules. User is in charge of new-volunteer onboarding (30-min slot).
      *   **Goal:** Explain *why* things are done the way they are and *how* that changes, using David Lewis's account of convention (equilibrium of a coordination problem).
      *   **Constraint 1:** Do *not* explain the philosophical account explicitly (no jargon like "coordination equilibrium," "common knowledge," "preferences over outcomes").
      *   **Constraint 2:** Audience is adults with no philosophy background. They think unwritten rules are habits or peer pressure. They assume all rules are the same kind.
      *   **Deliverables:**
          1.  Order of pieces (and consequences of swapping).
          2.  Choice between two contested rules (a: tools left out vs. b: no parts home) to carry the session, plus criteria for that example (what it must have/lack).
          3.  Misconceptions to expect at each stage and when to head them off.
          4.  One closing question to test understanding of the *structure*, not vocabulary.
          5.  What to explicitly refuse to discuss at this level.

  2.  **Deconstruct Lewis's Account (for internal use, not for the audience):**
      *   Convention is a solution to a recurrent coordination problem.
      *   It's arbitrary (there could be another solution).
      *   It's self-enforcing (everyone expects everyone else to do it, and prefers to do it *if* others do it).
      *   It relies on precedent (we did it before, so we expect to do it again).
      *   It distinguishes between *conventions* (coordination) and *rules/norms* (moral/prudential obligations or commands).

  3.  **Select the Carrying Example (Rule A vs. Rule B):**
      *   *Rule A (Tools left out):* This is a coordination problem. If everyone puts them away, it's tidy but time-consuming. If everyone leaves them out, they are accessible for the next person immediately, but the bench gets messy. The key is *matching* behavior. If I put it away and you leave it out, I've wasted time and you still have to search. It works best if we all do the same. It is arbitrary (we could do either).
      *   *Rule B (No parts home):* This is a trust/resource allocation rule. It's not really a coordination problem in the Lewis sense. It's a rule to prevent theft/hoarding. If I don't take parts, it doesn't matter if you do, except that the parts run out. It's more of a social contract or a moral rule.
      *   *Decision:* Rule A (Tools left out) is the better Lewisian example. It's about workflow coordination. Rule B is about fairness/resource guarding, which invites moralizing and enforcement talk, muddying the waters of *convention*.
      *   *Criteria for the Example:*
          *   *Must Have:* Recurrence (happens every day), Interdependence (my best move depends on yours), Arbitrariness (we could do the opposite), Precedent (we've done it this way).
          *   *Must Lack:* Moral weight (nobody dies if tools are put away), Central Enforcement (no boss yelling), One-off nature (must be recurrent).

  4.  **Structure the 30-Minute Session (The Order):**
      *   *Phase 1: The Problem (Coordination).* Establish that we need to work together smoothly.
      *   *Phase 2: The Solution (The Pattern).* Show the current behavior.
      *   *Phase 3: The "Why" (Expectations).* Explain that we do it because we expect others to do it.
      *   *Phase 4: Change (Precedent).* How do we shift?
      *   *Constraint Check:* If I swap Phase 3 and 4, they won't understand *why* change is hard (because expectations are sticky). If I swap 1 and 2, they won't see the need for the pattern.

  5.  **Identify Misconceptions & Timing:**
      *   *Misconception 1: "If it's arbitrary, I don't have to follow it."* (The "It doesn't matter" fallacy). Needs to be headed off in Phase 3 (Expectations). It matters *that* we match, not *what* we match.
      *   *Misconception 2: "We'd just need everyone to agree to switch at once."* (The "Contract" fallacy). Needs to be headed off in Phase 4 (Change). Lewis says we don't need a meeting; we need a salient signal/precedent shift.

  6.  **Develop the Closing Question:**
      *   Needs to test if they understand the *expectation* mechanism, not just "follow the rule."
      *   Bad: "What is the tool rule?"
      *   Good: "If you saw three volunteers start leaving tools out next week, what would you do and why?" (Tests if they see the shift in equilibrium).

  7.  **Determine What to Refuse:**
      *   Don't talk about *morality* (right/wrong).
      *   Don't talk about *punishment* (enforcement).
      *   Don't talk about *formal voting* (social contract).
      *   Why? Because Lewisian convention is pre-political and pre-moral. It's about flow.

  8.  **Drafting the Plan (Iterative refinement):**

      *   *Refining the Order:*
          1.  **The Jam:** Show a scenario where mismatched behavior fails (I hide the wrench, you need the wrench).
          2.  **The Pattern:** Show the current solution (Tools stay out).
          3.  **The Glue:** Explain *why* it sticks (I do it because I expect you to).
          4.  **The Shift:** How we change (New precedent, not a vote).
      *   *Consequence of Swapping:* If I explain The Glue before The Jam, it sounds like peer pressure. If I explain The Shift before The Glue, they think change is easy/contractual.

      *   *Refining the Example:* Rule A (Tools).
          *   *Must Have:* Mutual benefit in matching.
          *   *Must Lack:* Moral urgency (stealing is bad).

      *   *Refining Misconceptions:*
          *   "Arbitrary = Optional." Head off in "The Glue."
          *   "Change = Agreement." Head off in "The Shift."

      *   *Refining the Closing Question:* Make it situational. "You walk in, bench is clear. Do you hide the wrench or leave it? Why?"

      *   *Refining Refusals:* No talk of "fairness" or "punishment."

  9.  **Final Review against Constraints:**
      *   Did I explain Lewis? No.
      *   Is it 30 mins worth of content structure? Yes.
      *   Did I answer all specific prompt requirements? (Order/Swap, Example choice/criteria, Misconceptions/Timing, Closing Question, Refusals).

  10. **Final Polish:** Ensure tone is practical, workshop-focused, not academic. (Self-Correction: Make sure to emphasize *why* Rule B is bad for this specific pedagogical goal).

  **(Self-Correction during drafting):** I need to be careful not to use the word "equilibrium." I need to describe the *state* without the *label*. I also need to make sure the "Swap" consequence is clear.

  Let's assemble the response.

  *   **Order:** 1. The Mismatch Cost -> 2. The Current Pattern -> 3. The Expectation Engine -> 4. The Drift.
  *   **Swap Risk:** If 3 comes before 1, it sounds like conformity. If 4 comes before 3, change sounds like a vote.
  *   **Example:** Rule A (Tools). Rule B is a norm/rule, not a convention.
  *   **Criteria:** Needs interdependence. Needs lack of moral weight.
  *   **Misconceptions:** "Arbitrary means optional" (Stage 3). "Change requires consensus" (Stage 4).
  *   **Question:** Scenario-based prediction.
  *   **Refusals:** Enforcement, Morality, Formal Voting.

  Looks solid. Proceed to write.cltr
answer: |-
  Here is the plan for the 30-minute slot. It is designed to operationalize Lewis's *Convention* without using the vocabulary, focusing entirely on expectations and interdependence.

  ### 1. The Sequence (and the cost of swapping)

  You must deliver these four beats in this exact order.

  1.  **The Mismatch Cost (5 mins):** Present a scenario where two volunteers want to achieve the same goal (fix a bike quickly) but fail because they acted differently regarding a tool. Show that the problem isn't *what* they did, but that they *didn't match*.
  2.  **The Current Pattern (5 mins):** Describe the actual behavior (Rule A: tools stay out). Frame it not as a rule, but as "what happens."
  3.  **The Expectation Engine (10 mins):** Explain *why* the pattern holds. You follow it because you expect me to follow it, and I follow it because I expect you to. This is the "glue."
  4.  **The Drift (10 mins):** Explain how the pattern changes. Not by voting, but by a few people doing something new until the expectation shifts.

  **What breaks if you swap:**
  *   **If you swap 1 and 2 (Pattern before Cost):** The pattern looks like arbitrary authority or habit. They won't understand *why* matching matters, so they will treat it as a "rule" to be obeyed or ignored based on preference.
  *   **If you swap 3 and 4 (Drift before Expectations):** You cannot explain how change happens without first explaining what holds the current state in place. If you talk about change first, they will assume change requires a formal agreement (a contract) rather than a shift in expectations. They will leave thinking they need to call a meeting to change a tool habit.

  ### 2. The Carrying Example

  **Choose Rule A:** *Whoever last used a tool leaves it out on the bench overnight.*

  **Why not Rule B?** Rule B (no parts home) is a resource-allocation norm based on trust and fairness. It has moral weight (hoarding vs. sharing). Rule A is a pure workflow coordination problem. It is the only one that fits the Lewisian model.

  **What the example MUST have:**
  *   **Interdependence:** My success depends on your action. If I hide the wrench and you leave it out, we both waste time searching. We both win only if we do the *same* thing.
  *   **Recurrence:** This happens every single shift. Conventions solve *recurrent* problems, not one-offs.
  *   **Arbitrariness:** Acknowledge openly that putting tools away *could* work, just as well, provided we *all* did it.

  **What the example MUST lack:**
  *   **Moral Weight:** Do not frame leaving tools out as "lazy" or putting them away as "respectful." If you introduce morality, it becomes a norm, not a convention.
  *   **Central Enforcement:** Do not mention the workshop manager checking the bench. If there is a punisher, it's a law, not a convention.

  ### 3. Misconceptions and When to Head Them Off

  **Misconception 1: "If it's arbitrary, it's optional."**
  *   **The thought:** "If leaving tools out is no better than putting them away, I can choose what I prefer."
  *   **When to head it off:** **Stage 3 (The Expectation Engine).**
  *   **The fix:** Emphasize that while the *choice* is arbitrary, the *matching* is not. It is not optional to mismatch. You are free to drive on the left or the right, but you are not free to drive on the wrong side relative to oncoming traffic.

  **Misconception 2: "To change it, we need everyone to agree at once."**
  *   **The thought:** "If we want to change the rule, we need a vote and 100% compliance on day one."
  *   **When to head it off:** **Stage 4 (The Drift).**
  *   **The fix:** Explain that conventions change by *precedent*, not contract. If three senior volunteers start putting tools away for a week, the expectation shifts. You don't need a meeting; you need a visible signal that the pattern is changing.

  ### 4. The Closing Question

  Do not ask them to define the rule. Ask them to predict behavior based on the structure of expectations.

  **"You arrive for your shift next month. You see three volunteers in a row leaving their wrenches on the bench, even though the 'old rule' was to hide them. Do you hide your wrench or leave it out? And more importantly: what do you expect the *next* volunteer to do with the wrench you just used?"**

  *   **Correct signal:** They leave it out (matching the new precedent) and expect the next person to leave it out (recognizing the shift in equilibrium).
  *   **Incorrect signal:** They hide it (following the 'old rule' regardless of context) or they say "I'd ask the manager" (looking for enforcement rather than coordination).

  ### 5. What to Openly Refuse

  To keep this Lewisian, you must explicitly bracket off two topics during the Q&A. Tell them:

  1.  **"I am not talking about fairness."** If someone asks, "Isn't it unfair to make the next person clean up?" refuse to answer on moral grounds. Answer on efficiency grounds. "It might be unfair, but that's a different conversation. Right now we are talking about how we find wrenches."
  2.  **"I am not talking about punishment."** If someone asks, "What if someone doesn't do it?" refuse to discuss sanctions. "We aren't talking about what happens if you break the flow. We are talking about why the flow exists."

  If you allow morality or enforcement into the room, the Lewisian account collapses into a standard "Rules and Regulations" talk, and you will lose the ability to explain how unwritten rules actually evolve.
