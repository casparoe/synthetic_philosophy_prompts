answer: |-
  Here is the defended agenda for your three-year, low-resource interdisciplinary team.

  ### The Drop: Synthetic Bleed (Candidate 3)

  **Reason for elimination:** This problem is downstream and structurally misaligned with your constraints.

  "Synthetic Bleed" relies on the behavior of a generative model to reveal truths about human categorization. This introduces a black box between your team and the phenomenon you want to study. To do this properly, you need a model that has robustly learned the distribution of letterforms, which typically requires massive corpora and web access—resources you explicitly do not have.

  More critically, this problem is **downstream**. A model's confusion between 'a' and 'e' only matters if we first understand how *humans* draw that boundary. If the model bleeds categories, is that a failure of the model or a revelation about human cognition? You cannot answer that without first solving the Ghost Stroke or Essence-Style problems. By dropping this, you avoid spending three years debugging a neural network instead of studying the mind.

  ---

  ### The Agenda: Ranked by Strategic Dependency

  I recommend ordering the remaining three problems not by "ease," but by **logical dependency**. You cannot run the experiments for #2 without the framework of #1, and you cannot design the stimuli for #1 without the conceptual clarity of #3.

  #### 1. The Essence-Style Split (Candidate 4)
  **Role:** The Conceptual Framework
  **Why it is upstream:** This is the architectural prerequisite for the entire project. Before the type designer draws a single glyph or the cognitive scientist recruits a single subject, the team must agree on the operational definition of "identity."

  If essence and style are cleanly separable (the "Platonic" view), then the Type Designer can manipulate style parameters while holding identity constant. If they are entangled (the "Wittgensteinian" view), then changing the style *is* changing the identity, and your experimental variables collapse.

  *   **Tractability for this team:** This is the Philosopher's lead, supported by the Designer. It requires no data, only rigorous definition and visual prototyping. The Designer can produce paired examples (same essence/different style vs. different essence/same style) to test if the Philosopher's distinctions hold water visually.
  *   **Re-ranking Condition:** If, within the first six months, the team concludes that the split is *purely* nominal (i.e., there is no theoretical way to separate them even in principle), this problem moves to the background as a "negative result," and **The Ghost Stroke Problem** moves to #1 as a purely empirical investigation without theoretical pretenses.

  #### 2. The Ghost Stroke Problem (Candidate 1)
  **Role:** The Empirical Engine
  **Why it is upstream:** Once you have a working hypothesis on Essence vs. Style, you need a controlled method to test categorical boundaries. This is the core experimental work. It is upstream of Cross-Modal Recognition because you must establish the baseline recognition thresholds in ideal conditions before testing them in noise.

  This problem perfectly utilizes your specific team constraints. It requires high-quality visual stimuli (Type Designer), precise psychophysical testing (Cognitive Scientist), and interpretation of categorical boundaries (Philosopher). It does not require big data; it requires *careful* data.

  *   **Tractability for this team:** High. You can create a finite set of "base" letters and systematically degrade them (remove the tail of the 'a', close the counter, warp the spine). You can test these on a small number of human subjects in a lab setting. The "no web" constraint is actually a benefit here, forcing you to curate stimuli manually rather than scraping noisy data.
  *   **Re-ranking Condition:** If the team finds that stroke removal yields binary results (it's either an 'a' or it isn't, with no fuzzy boundary), this problem is "solved" quickly, and the team should immediately promote **Cross-Modal Recognition** to #2 to search for complexity in environmental noise instead of geometric features.

  #### 3. Cross-Modal Recognition (Candidate 2)
  **Role:** The Ecological Validation
  **Why it is third:** This is the stress test. It asks: "Do the rules we found in the lab (Ghost Stroke) hold up in the wild (fog, neon)?" It is downstream because "fog on glass" is an uncontrolled variable. You need to know what features are necessary (from Ghost Stroke) to understand which ones are being occluded or distorted in the cross-modal scenario.

  *   **Tractability for this team:** Moderate. Simulating "fog" or "neon" without digital rendering tools (if web/compute is restricted) requires physical prototyping (e.g., printing on textured glass, bending physical tubing). This leans heavily on the Type Designer's material skills. The Cognitive Scientist faces a harder task controlling variables, but the Philosopher can analyze whether the "invariant" being tracked is geometric or gestural.
  *   **Re-ranking Condition:** If the Ghost Stroke experiments suggest that geometric features matter far less than global "gestalt" or rhythm, this problem moves to #2. It becomes the primary way to study that gestalt, as noise strips away local geometry, forcing reliance on global structure.

  ### Defense to the Funder

  If you are asked why this ordering deserves the money, here is the core argument:

  > "Most research in this space tries to brute-force the answer using massive datasets and deep learning (Candidate 3). We are proposing the opposite. We believe that before we can teach machines to recognize letters, we must understand the *logic* of human recognition.
  >
  > We are prioritizing the **Essence-Style Split** because it is the single point of failure for the field. If we assume identity and style are separate when they are not, all subsequent AI training is fundamentally misaligned.
  >
  > We are prioritizing **Ghost Stroke** over Cross-Modal recognition because we need to map the 'atomic' features of categorization before we study them in chaotic environments.
  >
  > This team composition is the only way to do this. A computer scientist would reach for a dataset. A philosopher would reach for a text. By forcing a Designer, a Cognitive Scientist, and a Philosopher to solve the **Ghost Stroke** problem together, we aren't just making fonts or running trials; we are reverse-engineering the human abstraction mechanism using typography as the control language."

  ### Summary of Risks

  *   **The "Navel-Gazing" Risk:** The biggest risk is spending Year 1 debating the **Essence-Style Split** without producing data.
      *   *Mitigation:* Tie the philosophical output to the Designer's output. The "theory" must be expressed as a set of design rules that the CogSci can test. If it can't be tested, it's not part of the grant.
  *   **The "Triviality" Risk:** The **Ghost Stroke** experiments might show obvious results (e.g., removing the whole letter makes it unreadable).
      *   *Mitigation:* Focus on the *boundary* cases. The funding should be justified by the search for the "tipping point" of recognition, not the obvious cases.

  This agenda leverages your constraints (low tech, high expertise) as a feature, not a bug. It forces deep conceptual clarity where others rely on statistical probability.
