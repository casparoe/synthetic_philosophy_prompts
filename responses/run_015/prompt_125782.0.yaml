prompt: |-
  I'm on the international review board for a big anthropology/genetics collab. They've proposed a study measuring how people in three non-WEIRD societies assign blame for accidental harm—specifically wether they weight intent vs outcome differently, and wether blame attaches to individuals or kin-groups. The catch is the consent protocol: they want standard Western individual-signature forms, but in two field sites decisions about bodily data are made collectively by lineage elders, and treating consent as an individual right is seen locally as a kind of moral isolation that violates obligations to the group. The PI says without uniform consent they can't publish; local collaborators say imposing individual consent actually distorts the moral ecology they're studying, since it forces participants into a WEIRD framework of autonomy before they even answer the blame questions.

  We need a decision memo for Friday's meeting. Recommend a concrete course—approve, reject, or approve with conditions—with a time frame for implementation. Take seriously the idea that folk moral psychology isn't just different in content but in meta-ethical structure: in these societies people treat obligations as relationally constituted rather than individually possessed, which raises wether informed consent presupposes a specifically WEIRD ontology of the person. At the same time, deal honestly with the strongest argument on the other side—probably that without an individual opt-out we risk letting collective norms override vulnerable people, especially women and junior kin who might dissent silently.

  Keep it under 350 words. Lead with the bottom line up front. Use a table if it helps lay out the tradeoffs between universal protocol and local adaptation. Don't ask for citations or a reading list—just reason it through. Write it like an actual memo, not a philosophy essay; we need something the PI can respond to point by point, and please try to accomodate both the methodological and ethical concerns without just splitting the difference.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** Member of an International Review Board (IRB) for an anthropology/genetics collaboration.
      *   **Task:** Write a decision memo for Friday's meeting.
      *   **Topic:** Study on blame assignment (intent vs. outcome, individual vs. kin-group) in three non-WEIRD societies.
      *   **Conflict:** Consent protocol. PI wants standard Western individual-signature forms (for publication). Local collaborators say individual consent violates local moral ecology (collective/relational ontology) and distorts the study.
      *   **Key Philosophical/Ethical Point:** Folk moral psychology differs in meta-ethical structure (relational obligations vs. individual rights). Informed consent might presuppose a WEIRD ontology.
      *   **Counter-Argument:** Collective norms might override vulnerable individuals (women, junior kin) who cannot dissent silently.
      *   **Constraints:** Under 350 words. Bottom line up front (BLUF). Use a table if helpful. No citations/reading list. Write like a memo, not an essay. Accommodate both methodological and ethical concerns without just splitting the difference.
      *   **Deadline:** Friday's meeting (implies urgency/actionability).
      *   **Recommendation:** Approve, Reject, or Approve with Conditions (plus time frame).

  2.  **Determine the Recommendation:**
      *   *Reject:* Too harsh, halts valuable research, ignores local collaboration.
      *   *Approve:* Unethical, ignores vulnerability of subordinates within kin groups.
      *   *Approve with Conditions:* The only viable path. Needs to respect local ontology *and* protect vulnerable individuals without imposing Western individualism blatantly.
      *   *Solution:* Tiered consent. Community/elder consent + private individual opt-out mechanism that doesn't require public confrontation.

  3.  **Drafting - Section by Section:**

      *   **Header:** To, From, Date, Subject.
      *   **Bottom Line:** Approve with conditions.
      *   **Reasoning:** Acknowledge the ontological conflict. Individual consent *is* an intervention. But collective consent *is* a risk.
      *   **The Compromise (not splitting the difference, but integrating):** Use a two-stage process. Public/collective agreement + private/individual dissent channel.
      *   **Table:** Compare risks/benefits of Uniform vs. Adapted.
      *   **Timeline:** Needs to be done before fieldwork.

  4.  **Drafting - Content & Tone:**
      *   *Tone:* Professional, decisive, ethically rigorous, practical.
      *   *Word Count:* Strict limit (350 words). Need to be concise.
      *   *Key Argument:* The consent process itself is data/intervention. We must minimize distortion while ensuring safety.

  5.  **Drafting - Attempt 1 (Mental Outline):**
      To: IRB Committee
      From: [My Name]
      Re: Consent Protocol for Blame Study
      Decision: Approve with Conditions.
      Reasoning: The PI is right about publication standards, but locals are right about ontological distortion. Standard forms impose Western individualism. However, pure collective consent risks silencing women/juniors.
      Solution: Dual-layer consent. Elders grant community access. Individuals get private, verbal opt-out without signature (signatures are public/committing).
      Table: Uniform vs. Adapted.
      Timeline: 4 weeks to revise.

  6.  **Drafting - Attempt 2 (Writing & Refining):**
      *   *Check Word Count:* Keep it tight.
      *   *Check Constraints:* BLUF, Table, No citations, Memo style.

      *Draft:*
      **TO:** IRB Committee
      **FROM:** [Reviewer Name]
      **DATE:** October 24, 2023
      **SUBJECT:** Decision Memo: Consent Protocol for Cross-Cultural Blame Study

      **RECOMMENDATION:** Approve with Conditions.

      Standard individual consent imposes a WEIRD ontology that invalidates the study's core question regarding relational moral psychology. However, exclusive collective consent risks coercing vulnerable kin members. We must adopt a protocol that respects relational personhood without sacrificing individual safety.

      **Required Modifications:**
      1.  **Community Authorization:** Secure formal agreement from lineage elders to respect local governance structures.
      2.  **Private Opt-Out:** Replace signature forms with private, verbal consent witnessed by a neutral local advocate (not an elder). Participants must know they can withdraw silently without social penalty.
      3.  **Data Segregation:** Ensure genetic data cannot be traced back to specific individuals by the community elders, only the research team.

      **Risk/Benefit Analysis:**

      | Protocol Type | Methodological Integrity | Vulnerable Population Protection |
      | :--- | :--- | :--- |
      | **Uniform (PI Proposal)** | Low (Imposes individualism) | High (Standard opt-out) |
      | **Local (Collaborator Proposal)** | High (Ecological validity) | Low (Risk of coercion) |
      | **Hybrid (Required)** | **High** (Minimizes ontological distortion) | **High** (Private dissent channel) |

      **Rationale:**
      Consent is not merely regulatory; it is an ethnographic intervention. Requiring signatures forces participants into an individualistic framework before the study begins, contaminating data on collective blame. Conversely, relying solely on elders ignores power asymmetries within kin groups. The hybrid model treats consent as a process rather than a event, accommodating relational ontology while maintaining a safeguard for juniors and women who may lack public voice.

      **Timeline:**
      PI must submit revised protocol within 14 days. Fieldwork cannot commence until the neutral advocate role is filled and verified.

      **Action:**
      Revise consent script to remove signature requirement; implement private verbal recording. Resubmit by [Date + 2 weeks].

