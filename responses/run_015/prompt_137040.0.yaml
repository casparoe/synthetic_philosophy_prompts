      *   *Cost:* He loses the moral high ground of the libertarian argument. He has to admit the state *does* own a claim on his time, which opens the door to other intrusions he might dislike. It makes him more of a Civic Republican and less of a Classical Liberal.

  6.  **Drafting the Response:**
