      *   *Final Verdict on the "Single Commitment":* It has to be the *phrasing/principle* of (1). He cannot hold that it is "forced labour" (implying moral illegitimacy) while arguing for its expansion/equalization in (5) and acceptance in (4). He must reclassify it as "Civic Duty."

