answer: |-
  Distinguished colleagues, practitioners, and guests,

  Welcome. It is a rare privilege to convene a gathering where the precision of legal doctrine, the urgency of conflict resolution, and the rigor of philosophical inquiry sit at the same table. Usually, these disciplines speak past one another. The lawyer seeks the norm; the practitioner seeks the cessation of hostilities; the philosopher seeks the concept. But on the subject of state sovereignty and armed conflict, these tracks must converge. If we treat sovereignty merely as a legal status, we miss its ethical weight. If we treat conflict merely as a breakdown of order, we miss its structural recurrence. And if we treat philosophy merely as commentary, we fail to grasp the living reality of the political world.

  My intention in these opening remarks is not simply to welcome you, but to propose a specific conceptual framework for our days together. I want to draw upon a difficult, often misunderstood insight from G.W.F. Hegel regarding the nature of war and the state. I do so not to advocate for conflict, but to understand the structural role that the possibility of conflict has played in the formation of modern political identity.

  For Hegel, war is not merely a contingent calamity. It is not simply an external accident that befalls a state, like a natural disaster or a famine. Rather, within his system, war carries a specific ethical and structural function. To understand this, we must first understand how Hegel views the relationship between the individual, civil society, and the state.

  In civil society, we exist as private persons. We pursue our own welfare, we accumulate property, we protect our rights. This is the realm of particularity. It is necessary, but it is also fragile. Left to itself, civil society tends toward atomization. We become isolated consumers, concerned only with the preservation of our own lives and assets. The state, in this philosophical view, is not merely a contract to protect those assets. The state is the "actuality of ethical life." It is the substance that unites us into a universal whole.

  Here lies the difficult function of war. In the face of war, the finite claims of civil society—property, safety, individual life—are negated. The state demands that the citizen risk their particular existence for the sake of the universal. For Hegel, this moment of risk is not a tragedy to be avoided at all costs, but the moment in which the state proves it is not merely a night-watchman for private interest. War preserves the sovereignty of the state by reminding the citizen that their ethical substance is tied to the political whole, not just their private wallet. It prevents civic life from stagnating into a mere system of needs. It is, in a stark sense, the wind that keeps the ethical sea from becoming a stagnant swamp.

  I offer this reconstruction not to glorify violence. We are not here to mourn the passing of bloodshed. We are here to analyze the architecture of sovereignty. The point is this: on this account, the vitality of ethical life depends on a sovereign entity capable of demanding the ultimate sacrifice, thereby transcending the sum of private interests.

  But this brings us to the precipice of our present condition.

  The Hegelian framework presupposes the individual state as the ultimate horizon of the ethical universal. The citizen risks their life for *this* state, against *that* state. But look at the world in which we now operate. We are witnessing a profound dilution of state-centered sovereignty. We have supranational courts, international human rights regimes, global economic interdependencies, and transnational threats that respect no borders. The Westphalian model, where the state holds absolute dominion within its territory, is increasingly porous.

  This creates a profound philosophical and practical problem for this workshop.

  If the ethical function of war was inseparable from the sovereignty of the individual state, and if global governance structures now dilute that sovereignty, what happens to that ethical function? Is it simply lost? Or can it be transformed?

  If the state is no longer the sole repository of the "universal," where does the ethical demand land today? Can modern citizens perform an analogous ethical act—risking particular interest for a universal that transcends the state—within international institutions? Or does the decline of state-centered sovereignty entail the loss of the very mechanism that, on Hegel's account, kept ethical life vital?

  Consider the implications for each of you in this room.

  For the international lawyers here: You work with norms that claim universality. But without a sovereign power capable of enforcing them through the ultimate risk, do these norms remain abstract ideals? Does international law risk becoming a mere regulation of civil society on a global scale, lacking the ethical substance of a true state?

  For the conflict resolution practitioners: You work to stop the violence. But if violence, in its structural form, was what bound the community together, what binds the community after the peace agreement? If we remove the threat of war without replacing the ethical bond it forged, do we leave behind a hollowed-out society prone to fragmentation and criminality?

  And for the philosophers: We must ask if the "universal" can be detached from the nation-state. Can we conceive of a cosmopolitan ethical life where one risks their particularity for humanity, or for the climate, or for international justice, with the same intensity that the soldier once risked it for the fatherland? Or is that a category error?

  This is the central question I propose we hold before us: **Is the erosion of absolute state sovereignty a liberation from a violent past, or is it a dissolution of the only structure capable of sustaining a robust ethical life?**

  We must be careful not to answer this too quickly. It is tempting to say that global cooperation is simply "better" than state conflict. But if we do not understand what is lost in that transition—specifically, the mechanism of collective sacrifice that generates solidarity—we may find ourselves building institutions that are legally sophisticated but ethically hollow. We may find that without the capacity for collective risk, our global citizenship remains a matter of convenience rather than conviction.

  Over the next few days, I ask that you push your analyses toward this hinge point. When we discuss sovereignty, let us not speak only of jurisdiction and recognition, but of the ethical substance that sovereignty commands. When we discuss conflict, let us not speak only of casualty counts and ceasefires, but of the communal bonds that are shattered and remade in the fire of collective struggle.

  We are not here to justify war. We are here to understand what war *did* for the concept of the state, and to ask, with clear eyes, what will do that work now. If the state is no longer the ultimate vessel of the universal, we must identify the new vessel. If there is no new vessel, we must understand the cost of that absence.

  Let this workshop be a space where legal precision meets philosophical depth, guided by the practical realities of a world in flux. Let us inquire whether the ethical life of humanity can find a new footing, or whether we are navigating a transition where the old bonds are broken, and the new ones are not yet forged.

  Thank you. I look forward to our collaboration.
