      *   *The "Luck" aspect:* In Machiavelli, luck is half the battle. In the audit, luck is neutralized. You aren't punished for bad luck (force majeure), but you aren't rewarded for good luck. This creates a "baseline of competence."
      *   *The Paradox:* By defining more things as "resilient-able," you expand the realm of responsibility. This is the "Colonization of Fortuna."
