      *   *Modern Risk Management:* Probabilistic, expected value, mitigation, resilience engineering. Focus on reducing variance and impact.
      *   *The Audit Logic:* "Avoidable" = Negligence/Lack of *Virtù*. "Force Majeure" = Pure *Fortuna*.
      *   *The Tension:* If you spend millions on resilience, you are trying to turn *Force Majeure* into *Avoidable Loss* (by making the damage preventable). But if the storm is too big, it reverts to *Force Majeure*.
      *   *The "Luck" Issue:* If I prepare well and the storm misses me, I get no bonus. If I prepare well and the storm hits but does less damage, do I get credit? The prompt says "never give a manager bonus points for being lucky." This implies a baseline expectation.
      *   *Fortune as Excuse:* "It was too big" (Force Majeure).
      *   *Fortune as Enemy:* "We must fight it with resilience" (All-hazards).

  3.  **Drafting the Argument - Section by Section:**

      *   **Introduction:** Acknowledge the sharpness of the observation. It's a genuine philosophical tension in bureaucratic epistemology.
      *   **Reconstructing the Implicit Theory:**
          *   The audit creates a binary ontology: *Contingent Human Failure* vs. *Necessary Natural Force*.
          *   *Virtù* is defined negatively here. It's not "greatness," it's "absence of negligence."
          *   *Fortuna* is the residual category.
          *   The "All-Hazards" push suggests *Fortuna* is compressible.
      *   **Machiavelli vs. Probability:**
          *   *Machiavelli:* Fits the "river and dikes" metaphor perfectly. *Virtù* is recognizing the flood season and building early. The audit penalizes not building the dike.
          *   *Probability:* Fits the "risk reduction" model. Expected loss = Probability $\times$ Impact. Mitigation reduces Impact.
          *   *Does it need Machiavelli?* Not strictly. Modern systems theory works. *However*, Machiavelli captures the *political/moral* dimension better. Probability is cold; Machiavelli implies *will*. The audit is a moral judgment disguised as math.
      *   **The Underdetermined Logic (The Crux):**
          *   The "Excuse vs. Enemy" paradox.
          *   *Excuse:* When things go wrong, "Force Majeure" protects the agency.
          *   *Enemy:* When budgeting, "Resilience" demands we fight Force Majeure.
          *   *The Moving Goalpost:* If resilience works, the "Force Majeure" bucket shrinks. If the bucket shrinks, the "Avoidable" bucket grows (because you *should* have prepared for what is now considered manageable).
