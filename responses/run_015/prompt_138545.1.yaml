      *   **SCA:** $x$ is disposed to $M$ if $S$ iff if $x$ were $S$, $x$ would $M$.
      *   **Fink:** Disposition present, Stimulus applied, Manifestation *fails* because the disposition *disappears* upon stimulus. (False Conditional, True Disposition).
      *   **Mask:** Disposition present, Stimulus applied, Manifestation *fails* because something *interferes* with the manifestation, but the disposition *remains*. (False Conditional, True Disposition).
      *   **Distinction:** Finks remove the *basis* of the disposition; Masks block the *process* from basis to manifestation.
