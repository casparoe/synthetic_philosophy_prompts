answer: |-
  ### Section Plan: Distinguishing Finks from Masks (50 Minutes)

  #### 1. Order of Components and Dependencies
  **Sequence:**
  1.  **Recap SCA & The Wire Fink (0–10 mins):** Re-establish the Simple Conditional Analysis ($D \leftrightarrow (S \boxright M)$). Briefly revisit the live-wire Fink case they know. Confirm consensus: The wire *is* live, the stimulus (touch) occurs, but the manifestation (shock) fails because the liveness *vanishes* upon touch.
  2.  **Introduce the Mask (10–20 mins):** Present the masking case. Establish that here, too, $D$ is true and $(S \boxright M)$ is false.
  3.  **Differentiate Mechanisms (20–35 mins):** Use the two mug cases (see Section 4) to force a structural distinction.
  4.  **Address Misconceptions (35–45 mins):** Interleave corrections as they arise (see Section 3).
  5.  **Final Assessment (45–50 mins):** Board question.

  **Dependency:**
  You cannot introduce a Mask until students accept that a Fink involves the *loss of the disposition itself* triggered by the stimulus. The Mask must be defined negatively against this: a case where the stimulus triggers an *interference*, not a loss.

  **Reverse Failure (Antidotes/Mimics):**
  **Exclude this.** Do not discuss cases where the conditional is true but the disposition is absent (e.g., mimics). Including this now blurs the specific structural distinction you are building. Both Finks and Masks are counterexamples to the *left-to-right* direction ($D \rightarrow (S \boxright M)$). Introducing the reverse failure ($ (S \boxright M) \rightarrow D$) complicates the topology of the problem space. Save it for the session on "Reformed Conditional Analysis."

  #### 2. The Carrying Case for Masking
  **Case:** **The Aspirin in Saturated Water.**
  *   **Setup:** An aspirin tablet has the intrinsic disposition to dissolve in water. It is placed in a beaker of water (Stimulus). However, the water is already fully saturated with aspirin. The tablet does not dissolve (Manifestation fails). If moved to fresh water, it dissolves immediately (Disposition remains).
  *   **Why this works:**
      *   **Avoids "Protective Packaging":** The tablet is in direct contact with the solvent. The stimulus condition ("being placed in water") is met unequivocally. Students cannot claim "it wasn't really tested."
      *   **Avoids "Property Loss":** Unlike the Fink, the chemical structure (the categorical basis of solubility) does not change upon immersion.
      *   **Avoids "Analgesic State" Objection:** Unlike the pain case, there is no ambiguity about whether the object is in the "soluble state." Solubility is a stable chemical property, not a transient physiological state students might argue is suppressed.

  #### 3. Misconceptions: Formation and Intervention
  **Misconception 1: "Finks and Masks have the same structure."**
  *   **When it forms:** Immediately after introducing the Aspirin case. Students see $D + S + \text{no } M$ in both the Wire and the Aspirin.
  *   **Intervention:** Head this off **before** moving to the mug cases. Ask: "In the Wire case, what happened to the liveness at the moment of touch? In the Aspirin case, what happened to the solubility at the moment of immersion?" Force the verbal distinction: *Vanishing* vs. *Blocking*.

  **Misconception 2: "If the disposition survives, the manifestation must survive in some weakened form."**
  *   **When it forms:** During the Mask discussion. Students may argue the aspirin "started to dissolve" or the glass "cracked microscopically."
  *   **Intervention:** Address this **during the Polymer Mug case** (see below). Insist on the binary nature of the manifestation in the analysis (Break/No Break). If the manifestation is weakened, the analysis is vague; the counterexample relies on the manifestation *failing*.

  **Misconception 3: "A 'Normal Conditions' or *Ceteris Paribus* clause fixes both."**
  *   **When it forms:** At the end, as a proposed solution.
  *   **Intervention:** Address this **after the mug cases**. Point out that "normal conditions" is a placeholder, not an analysis. A Fink makes the condition abnormal by changing the *object*; a Mask makes it abnormal by changing the *environment*. A single clause obscures the metaphysical difference between intrinsic loss and extrinsic interference.

  #### 4. Placement of the Two Mug Cases
  **Order:**
  1.  **The Annealed Mug (Fink Variant):** *First.*
      *   **Description:** Impact triggers a device that briefly anneals the ceramic, removing brittleness for the duration of the stress.
      *   **Function:** This bridges from the Wire Fink. It forces students to notice that the **dispositional property itself is absent** at the critical moment ($t_1$). It reinforces the "Vanishing" structure.
  2.  **The Polymer Mug (Mask):** *Second.*
      *   **Description:** Impact triggers a polymer coating to stiffen, holding the shards together. The ceramic remains brittle.
      *   **Function:** This forces the contrast. The **dispositional property is present** at $t_1$, but the *result* is prevented.
  3.  **The Hybrid:**
      *   **Verdict:** Treat as **neither** a reason to doubt the distinction nor a new category. It is simply overdetermination of failure. If asked, state that both mechanisms are active, but they remain analytically distinct. Do not dwell on it; it is a distraction from the conceptual boundary you are drawing.

  #### 5. Final Board Question & Refusal
  **The Question:**
  > "A fragile vase is struck and does not break. You are told the vase remained fragile throughout the impact. What specific fact about the *moment of impact* determines whether this case is a Mask or a Fink?"

  **Correct Answer:**
  "The presence or absence of the fragility (the disposition) at the exact moment of impact." (If present = Mask; If absent = Fink).

  **Wrong-But-Tempting Answer:**
  "Whether something external interfered." (Students will say this, but Finks can be external devices too. The distinction is not Intrinsic/Extrinsic, it is Property-Loss vs. Process-Block).
  *OR*
  "Whether the vase broke." (We know it didn't; that's the starting point).

  **Explicit Refusal:**
  **Do not teach the solution (Lewis's Reformed Conditional Analysis).**
  Your goal is to ensure they see the *problem* clearly. If you introduce the fix (e.g., adding "and the disposition remains" to the antecedent) now, they will treat the distinction as a solved technicality rather than a metaphysical insight. Refuse to move to the repair until they can perfectly diagnose the failure.
