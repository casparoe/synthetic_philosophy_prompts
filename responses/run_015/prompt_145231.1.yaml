answer: |-
  ### The Spreadsheet Data

  **Weights used for all Headline Scores:** Attitude (20%), Desert Island (20%), Swap (30%), Looping (15%), Outsider (15%, inverted).
  *Formula: $Headline = 2 \times (0.2A + 0.2D + 0.3S + 0.15L + 0.15(10-O))$*

  | Kind | 1. Attitude | 2. Desert | 3. Swap | 4. Loop | 5. Outsider | Headline (0-100) |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Money (USD)** | 10/10 <br> *Value exists solely because the Federal Reserve and users agree it does.* | 10/10 <br> *Without the institution, you have only cotton-linen blends, not currency.* | 10/10 <br> *If we treated seashells as legal tender, seashells would function identically.* | 5/10 <br> *Inflation feedback exists, but the physical bill does not change properties.* | 0/10 <br> *An alien sees paper with ink, completely missing the "dollar" partition.* | **95** <br> *Weights: A20/D20/S30/L15/O15(inv)* |
  | **Race (US)** | 8/10 <br> *Categories rely on social rules, though often anchored to phenotype.* | 9/10 <br> *Without human societies, human variation exists but "Black/White" does not.* | 7/10 <br> *Treatment drives outcomes, but visible phenotype limits total swappability.* | 8/10 <br> *Being racialized alters behavior and culture, reinforcing the category.* | 2/10 <br> *An alien sees clines of ancestry, not the sharp US racial boundaries.* | **85** <br> *Weights: A20/D20/S30/L15/O15(inv)* |
  | **Woman/Man** | 9/10 <br> *Membership turns largely on self-identification and social recognition.* | 10/10 <br> *Without social roles, there is biological sex but no gender kind.* | 9/10 <br> *Almost all observed differences vanish if you swap socialization and expectations.* | 9/10 <br> *Identifying as the kind strongly shapes personality, dress, and life path.* | 1/10 <br> *An alien sees sexual dimorphism, not the social category of "woman".* | **90** <br> *Weights: A20/D20/S30/L15/O15(inv)* |
  | **Married** | 10/10 <br> *Status is entirely constituted by vows, contracts, and state recognition.* | 10/10 <br> *Two people cohabiting on an island are partners, but not "married".* | 5/10 <br> *Legal benefits swap easily, but deep emotional bonds do not automatically transfer.* | 6/10 <br> *The label changes how partners treat each other and file taxes.* | 0/10 <br> *An alien sees pair-bonding behavior, not the institutional status.* | **80** <br> *Weights: A20/D20/S30/L15/O15(inv)* |
  | **MDD (DSM)** | 6/10 <br> *Symptoms are real feelings, but the diagnostic threshold is consensus.* | 4/10 <br> *Misery exists without doctors, but the "Disorder" boundary does not.* | 3/10 <br> *Social support helps, but neurochemical dysregulation does not swap away.* | 8/10 <br> *Diagnosis alters self-concept and treatment, changing the symptom trajectory.* | 5/10 <br> *An alien might recover a "low energy/withdrawal" cluster matching DSM.* | **50** <br> *Weights: A20/D20/S30/L15/O15(inv)* |
  | **Recession** | 7/10 <br> *Metrics are objective, but the declaration is a committee decision.* | 10/10 <br> *Without an economy, a drop in production is just a physical event.* | 8/10 <br> *The label triggers policy and panic that worsens the underlying metrics.* | 9/10 <br> *Announcing a recession changes spending, which validates the announcement.* | 3/10 <br> *An alien sees GDP contraction, not the categorical "Recession".* | **80** <br> *Weights: A20/D20/S30/L15/O15(inv)* |
  | **Threks (200 yrs)** | 9/10 <br> *Origin is still the rule, but physical correlates have emerged.* | 10/10 <br> *Without the initial lottery rule, the group distinction never starts.* | 6/10 <br> *200 years of stress/diet differences created biological divergence alongside treatment.* | 8/10 <br> *Systemic exclusion created a self-perpetuating caste with internal culture.* | 4/10 <br> *An alien might now detect a statistical cluster due to epigenetic/health drift.* | **85** <br> *Weights: A20/D20/S30/L15/O15(inv)* |
  | **Cloaks** | 10/10 <br> *Value depends entirely on the disposition to accept, however mistaken.* | 10/10 <br> *Without the disposition, the objects are physically indistinguishable from trash.* | 10/10 <br> *Any object could be a cloak if the disposition shifted to it.* | 2/10 <br> *Lack of common knowledge prevents stable market feedback loops.* | 0/10 <br> *An alien sees objects changing hands but cannot predict who accepts what.* | **90** <br> *Weights: A20/D20/S30/L15/O15(inv)* |
  | **Gribbons** | 10/10 <br> *The partition exists only because people arbitrarily track it.* | 10/10 <br> *Without the hobbyists, the partition vanishes entirely.* | 0/10 <br> *Since nobody treats Gribbons differently, no outcomes travel with the swap.* | 0/10 <br> *Tracking the kind changes nothing about the kind or the trackers.* | 0/10 <br> *An alien sees random noise, as the partition predicts nothing.* | **40** <br> *Weights: A20/D20/S30/L15/O15(inv)* |

  ***

  ### Analysis: The Bundle vs. The Property

  **1. Is "Socially Constructed" one property?**
  No. Your spreadsheet proves Dana wrong by showing that "constructedness" splits into at least two distinct dimensions: **Ontological Dependence** (Tests 1 & 2) and **Causal Malleability** (Tests 3 & 4).
  *   **Money** and **Gribbons** both score 10 on Ontological Dependence (they vanish on a desert island).
  *   But **Money** scores 10 on Causal Malleability (treatment determines value), while **Gribbons** score 0 (treatment does nothing).
  *   If Dana claims they are constructed in "exactly the same way," she must explain why one runs the economy and the other is a useless hobby. The label "socially constructed" tracks the *origin* of the kind, but fails to track the *causal power* of the kind.

  **2. Where does Dana's claim break? (Money vs. Race)**
  Dana's claim survives on Tests 1 and 2 (both vanish without society). It breaks on **Test 3 (Swap)** and **Test 5 (Outsider)**.
  *   **Money (Swap 10):** You can make anything money. The physical substrate is irrelevant.
  *   **Race (Swap 7):** You cannot fully swap the social treatment of Race because the "input" (phenotype/ancestry) is physically visible and statistically correlated with geography/genetics.
  *   **Money (Outsider 0):** An alien cannot find dollars in the physics.
  *   **Race (Outsider 2):** An alien *can* find ancestry clusters that correlate highly with US Race, even if the *boundary* is social.
  *   **The Break:** Race has a "biological tether" that Money lacks. Dana's error is assuming that because the *category boundary* is social, the *consequences* are purely social. Race is ontologically constructed but causally hybrid; Money is ontologically constructed and causally pure.

  **3. The Threks: Construction creating Nature**
  The Threks scores **do move** over 200 years, specifically on **Swap (10 → 6)** and **Outsider (0 → 4)**.
  *   **Direction:** They become *less* constructed on the Swap/Outsider tests, even though they remain *fully* constructed on the Desert Island test.
  *   **Mechanism:** The social treatment (worse schools, stress) causes biological changes (epigenetics, health, height) that accumulate over generations.
  *   **Implication:** This is the strongest evidence against Dana. A kind can start as "purely constructed" (like Money) and, through the feedback loops of construction (Looping Test), become "naturalized" (detectable by aliens, resistant to swap).
  *   **Verdict:** The kind is getting **more real** (causally robust) while remaining **constructed** (ontologically dependent). This proves "socially constructed" is not the opposite of "real"; it is often the *cause* of a specific type of reality.

  **4. The Cloaks: The Common Knowledge Failure**
  *   **Are they money?** No. My scores reflect this instability (Looping 2).
  *   **Why:** Money requires *common knowledge* (I know that you know that I know). Cloaks rely on *false belief* (I think I'm the only one).
  *   **Score Impact:** This crushes the Looping score. Without common knowledge, the system cannot stabilize prices or expectations. It is a bubble waiting to burst, whereas USD is a stable equilibrium. This shows that even within "highly constructed" kinds, the *structure of belief* (common vs. private) changes the kind's durability.

  **Summary for the Group:**
  Tell Dana that "Socially Constructed" is like "Heavy." A feather pillow and a lead brick can both be "heavy" (over 1lb), but they behave differently when you throw them. Race and Money are both "constructed" (Ontology > 8), but Race is a lead brick (biological tether, hard to swap) and Money is a feather pillow (pure attitude, easy to swap). Treating them as identical ignores the causal weight.
