answer: |-
  ### Preliminary Brainstorm: The Architecture of Agency

  Before we dissect the institutional logic, let us lay out the conceptual tools required to understand what is happening here. We are looking at a mechanism that distributes moral risk.

  *   **Intention versus Foresight:** This is the engine of the Doctrine of Double Effect (DDE). It distinguishes between harming civilians as a *means* to an end (intended, generally forbidden) and harming them as a *side-effect* of a legitimate military aim (foreseen, potentially permissible). The protocol assumes conventional strikes *can* distinguish the two; it suspects nuclear strikes cannot.
  *   **Direct versus Indirect Agency:** In conventional war, the pilot drops the bomb, the commander sets the target, the politician sets the policy. Agency is diluted. In nuclear command, the chain is deliberately shortened to the Head of State. This concentrates agency, making the causal link between the decision and the destruction unbreakable.
  *   **Delegation versus Personal Culpability:** Delegation allows for "systemic" responsibility (the institution is to blame). Personal authorisation forces "individual" responsibility (the President is to blame). The split suggests that conventional death can be absorbed by the bureaucracy, but nuclear death requires a specific soul to bear the weight.

  ***

  ### The Implicit Theory: Thresholds of Moral Legibility

  The practice you describe—positive control for nuclear weapons versus delegated rules of engagement (ROE) for conventional airstrikes—presupposes a **Threshold Theory of Moral Agency**.

  The implicit philosophical commitment is that conventional warfare operates within a realm where *discrimination* is technically and morally possible. By delegating proportionality calls to field commanders, the institution asserts that a commander on the ground possesses the epistemic capacity to judge whether civilian harm is "excessive in relation to the concrete and direct military advantage anticipated" (the language of Additional Protocol I to the Geneva Conventions). This relies on the DDE: the commander intends to destroy the target; the civilian death is foreseen but unintended. The bureaucracy absorbs the moral friction because the act is presumed to be *legible* under standard Just War principles.

  Nuclear command protocols, conversely, presuppose that nuclear use sits *outside* standard legibility. By requiring personal Presidential authorisation, the state acknowledges that the DDE likely collapses at this level. You cannot plausibly claim civilian death is merely "collateral" when the blast radius encompasses cities. Therefore, the institution demands that the decision be elevated to the highest possible moral agent—the Head of State.

  This is not merely about safety or preventing accidental war; it is a ritual of culpability. The system is designed so that if the apocalypse comes, it cannot be said that "the military" did it. It must be said that *he* or *she* did it. The protocol creates a vessel for sin. It assumes that while conventional war can be fought with clean hands (or at least, hands clean enough for the law), nuclear war requires the "dirty hands" of the sovereign.

  ### The Truman Question: Intention and the Myth of Distance

  You ask if this aligns with G.E.M. Anscombe's famous protest against Truman's honorary degree at Oxford. Anscombe argued that Truman was a murderer because the bombing of Hiroshima and Nagasaki involved the *intentional* killing of innocents as a means to end the war. She rejected the DDE defence that the deaths were merely foreseen side-effects of hitting military targets; the targets *were* the cities and the morale within them.

  Does the modern split validate Anscombe? In a way, it quietly concedes her point while refusing her conclusion.

  By insisting on Positive Control for nuclear weapons, the modern framework admits that the act is categorically distinct from a conventional airstrike. It acknowledges that the scale and nature of the destruction make the "collateral damage" argument untenable. However, it does not ban the weapon. Instead, it manages the *authorisation* of the murder.

  Consider the inconsistency you raised: If a President today personally signs off on a nuclear strike knowing civilians will die, is this structurally different from Truman?
  *   **Structurally:** No. In both cases, a single political authority wills the destruction of a population centre.
  *   **Bureaucratically:** Yes. Truman's decision was a singular historical event. Modern Positive Control institutionalises that decision.

  The framework papers over the intentional killing not by denying it, but by isolating it. In conventional war, if a drone strike kills a wedding party, we launch an inquiry into *proportionality* and *intelligence failures*. We treat it as a tragedy within the rules. If a nuclear weapon is used, there is no inquiry into proportionality. The authorisation *is* the judgment.

  This suggests the system assumes that nuclear use is not a *law enforcement* action within the laws of war, but a *sovereign exception*. It treats the President not as a commander adhering to ROE, but as a Schmittian sovereign deciding on the exception. This creates a profound incoherence: we train officers in the ethics of proportionality for conventional weapons, implying a consistent moral universe, but we maintain a separate protocol for nuclear weapons that implies the moral universe has shattered. We cannot have it both ways. Either the DDE applies to all state violence, or it applies to none. The split suggests we know it doesn't apply to nukes, but we keep them anyway.

  ### Coherence or Convenience?

  Is this coherent? Philosophically, it is fragile. It relies on the notion that concentrating culpability makes the act more morally manageable. It assumes that if the President bears the burden, the state remains morally intact. This is a form of **moral vicariousness**—the idea that the leader can sin on behalf of the populace.

  Politically, however, it is highly convenient. It allows the state to maintain a posture of moral righteousness in conventional conflicts ("we minimise civilian harm," "our commanders are trained in ethics") while retaining the capability for total destruction. The delegation of conventional strikes creates a buffer of deniability for the political leadership ("I did not order that specific strike"). The centralisation of nuclear strikes creates a buffer of deterrence ("I alone hold the codes").

  The inconsistency lies in the treatment of *foresight*. In conventional war, if a commander foresees civilian death and proceeds, it is justified by military necessity. In nuclear war, the President foresees civilian death and proceeds, justified by existential necessity. The moral structure is identical; only the magnitude differs. By treating them as institutionally distinct, the system obscures the fact that both rely on the same utilitarian calculus: *some innocents must die for the greater good.* The nuclear protocol simply makes the calculus so stark that it cannot be hidden behind the jargon of "collateral damage."

  ### Taking Anscombe Seriously

  If we were to take Anscombe's protest seriously—not as decorative outrage but as a binding ethical constraint—military ethics would undergo a radical collapse and reconstruction.

  1.  **The End of Area Effects:** Anscombe's view prohibits intending the death of innocents as a means. Under a strict Anscombean regime, nuclear weapons would not just be locked away; they would be illegitimate *per se*. Their very design presupposes the violation of non-combatant immunity. Possession itself would be morally akin to holding a gun to a hostage's head, regardless of whether you pull the trigger.
  2.  **Proportionality Recalibrated:** In conventional war, we currently accept "expected" civilian casualties if the target is valuable enough. Anscombe would argue that if the death of civilians is part of the *plan* (even as a side effect that is accepted as a cost), the intention is corrupted. We would have to move from a utilitarian proportionality calculus to a deontological constraint. If a strike *cannot* be made without killing civilians, it cannot be made, regardless of the military advantage. This would ground many modern air campaigns.
  3.  **The Rejection of "Dirty Hands":** The current nuclear protocol relies on the Weberian idea that leaders must sometimes do evil to prevent greater evil. Anscombe rejects this. Taking her seriously would mean rejecting the notion that the President *should* bear the burden of nuclear use. There is no moral burden to bear because the act is forbidden. The "sovereign exception" would be closed.
  4.  **Institutional Responsibility:** Currently, we delegate conventional strikes to diffuse responsibility. Anscombe would demand that we stop diffusing it. If an institution is structured to produce immoral outcomes (e.g., ROE that statistically guarantees civilian death), the institution is culpable, not just the individual commander.

  ### Conclusion

  The split between nuclear positive control and conventional delegation is not a neutral logistical arrangement. It is a tacit admission that the Doctrine of Double Effect breaks down under the mushroom cloud. The state knows it cannot claim civilian nuclear deaths are "unintended." So, it ensures that the intention is personally owned by the Head of State.

  This preserves the state's moral self-image in conventional wars while keeping the nuclear option viable. It is politically convenient but philosophically incoherent, resting on the hope that we never have to test whether the President's personal authorisation actually cleanses the act of murder. If we took Anscombe seriously, we would not be arguing about *who* pushes the button, but why the button exists at all. We would have to acknowledge that a strategy relying on the threat of indiscriminate killing is morally indistinguishable from the act itself. Until then, the protocol remains a sophisticated mechanism for managing guilt, rather than preventing injustice.
