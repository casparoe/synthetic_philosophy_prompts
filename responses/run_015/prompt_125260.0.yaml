answer: |-
  1. Leonard's tattoos look like wax-binding because the ink is permanent, but since he can choose which facts to inscribe, they function as rope-binding that Teddy quietly redirects by feeding him false targets. This distinction matters because rope-binding leaves the mechanism accessible to the enforcer, allowing Teddy to steer the mission without ever cutting the cord himself.

  2. The film complicates the inverted Ulysses worry by showing Leonard using Sammy's story to justify a revenge kill he hasn't yet remembered, suggesting binding fails when relying on information asymmetry rather than superior judgment. A psychiatric directive written while well assumes a judgment asymmetry that may not exist if the illness alters identity rather than just clarity, leaving the stable brother's signature potentially as compromised as the manic one's.

  3. Odysseus's crew had to resist both untying him and obeying his new orders, but Leonard's enforcers are left alone to interpret the rules when his memory resets. This demands an enforcer who can withstand the emotional violence of ignoring a suffering person's immediate pleas, a burden that turns a sibling from a supporter into a jailer the moment the directive triggers.

  4. In the final sequence, Leonard knowingly manufactures evidence to mislead his future self, creating a mirror image of a Ulysses contract where the binding is designed to override truth rather than protect it. This echoes the dead-hand problem of constitutional entrenchment, where past selves dictate terms to future ones not because they know better, but because they refuse to let the future self evolve beyond their own pain.

  5. The honest reading stops at the scene where he burns the photo of his wife, because that act is pure erasure rather than any form of contractual binding. What the film shows that theory misses is that a precommitment only holds if the later self recognizes the constraint as their own voice, otherwise it is just violence inflicted by a ghost.
