  3) Conversely, one must ask if distributed weights truly escape the knowing-that category simply because they are not propositional sentences stored in a database. The weights are derived from statistical regularities in training data, meaning the system predicts tokens based on past occurrences rather than understanding the functional logic of the code it writes. If the model cannot explain why a function works or adapt to novel constraints outside its training distribution, its knowing-how is fragile compared to human expertise that grasps underlying principles. Ryle emphasized that intelligent performance involves readiness to deal with contingencies, not just habitual success or pattern matching within a fixed domain. If the weights function as a hidden rulebook that the system cannot access or modify during performance, the regress is avoided only technically, not philosophically, because the intelligence is frozen in the past. The system does not contemplate rules, but it also does not understand the practice; it simulates the output of understanding without the normative grip on correctness that characterizes genuine skill. Thus, the model might possess a hybrid state: procedurally effective but epistemically hollow, lacking the ability to justify its actions when challenged by new problems. Ultimately, whether this counts as knowing-how depends on whether we prioritize external success conditions or internal grasp of reasons for acting. If intelligence is defined by behavioral output, the model qualifies; if it requires normative engagement with reasons, it remains a statistical engine mimicking competence. The debate reveals that the knowing-how versus knowing-that distinction may not map cleanly onto non-biological architectures without significant revision. We must decide if the absence of conscious rule-following is sufficient for procedural knowledge or if genuine skill requires a capacity for justification that weights do not provide. The resolution hinges on whether intelligence is a property of the system's interaction with the world or its internal representational structure. Furthermore, the lack of intentionality in the weights means the system does not care about correctness, only probability. This detachment suggests that while the performance is intelligent, the agent itself lacks the mental state required for knowing-how. Ryle's argument was about the category mistake of locating intelligence in a ghostly inner theater, but replacing the theater with weights does not automatically grant the status of a knower. The system performs intelligently without being an intelligent agent in the full sense. This distinction is crucial for evaluating AI claims.

