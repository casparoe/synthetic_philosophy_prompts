      *   *Timeline:* 1923 (death) -> 1930s (outcomes).

  3.  **Evaluate Outcome (i): Authoritarian Right Regime by mid-1930s.**
      *   *Structural Pressure:* Weimar was failing. Presidential cabinets (Brüning, Papen, Schleicher) were already bypassing parliament before 1933. The DNVP (Nationalists) and Stahlhelm were strong. The Army wanted rearmament.
      *   *Constraint:* The "conservative revolution" wanted authoritarianism but feared mass mobilization (socialism/communism).
      *   *Assessment:* Without Hitler, the NSDAP is likely a fringe völkisch sect. But the *drive* for authoritarianism comes from the elites (Army, Industry, Junkers) + the Depression. Papen/Schleicher were already trying to build an authoritarian state without the Nazis.
      *   *Probability:* High. The system was drifting toward authoritarianism regardless of the NSDAP. The question is whether it becomes a *one-party* radical right regime or a traditional military-authoritarian dictatorship. Given the polarization, a one-party system (likely DNVP-led or a military-front party) is plausible to mobilize the masses against the Left.
