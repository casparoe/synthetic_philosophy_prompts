      *   *War:* German elites *wanted* revision of Versailles. Rearmament was bipartisan among the right. A war for territory in the East (Lebensraum-adjacent) was a general conservative goal, not just Hitler's. However, Hitler's timing and recklessness (Rhinelands, Austria, Sudeten) accelerated it. A traditional regime might have been more cautious (like Bismarckian realpolitik).
      *   *Holocaust:* This is the crux. Industrialized extermination was Hitler's specific ideological fixation (eliminationist antisemitism). Traditional German antisemitism was exclusionary/deportation-based, not necessarily exterminationist. Without Hitler's specific will and the radicalization dynamic of the "Führer state," the slide to Auschwitz is far less certain.
