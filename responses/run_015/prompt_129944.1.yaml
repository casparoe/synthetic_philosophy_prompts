      *   Under-specified node: "One-party authoritarian regime." Does a Papen military dictatorship count? Or does it require mass mobilization? This definition drives the gap between me and the user on (i).

  8.  **Compare with User and Classmate:**
      *   *User (0.5, 0.2, 0.08):* Seems to think authoritarianism is a toss-up, NSDAP unlikely, Holocaust very unlikely.
      *   *Classmate (0.75, 0.6, 0.4):* Thinks structures determine almost everything, including the specific party and the genocide.
      *   *Disagreement Locus:* The Classmate is over-calibrating the *inevitability of the specific vehicle* (NSDAP) and the *inevitability of the specific crime* (Holocaust). The User is under-calibrating the *inevitability of authoritarianism* (Outcome i).
      *   *My Verdict:* The Classmate is wrong on (ii) and (iii). The User is slightly too skeptical on (i). The real fight is about whether "Nazism" = "German Conservative Authoritarianism."

  9.  **Identify the "Move" Evidence:**
