      *   Actually, better: The minutes of the January 1933 meetings. How much was Hitler's *personality* vs. the *seat count* the deciding factor for Papen?

  10. **Drafting the Response:**
      *   *Tone:* Direct, analytical, seminar-ready.
      *   *Structure:* Follow the prompt's sequence (Probabilities -> Decomposition -> Sensitivity -> Comparison -> Evidence).
      *   *Language:* American English. No fluff.

      *(Self-Correction during drafting)*: Make sure to distinguish between "War" and "Holocaust." The prompt asks for the conjunction. The Holocaust is the binding constraint there. A traditional authoritarian regime might have started a war (Poland 1939 style) but unlikely to have built death camps. I need to be explicit that the 0.05 is driven by the genocide component.

      *(Refining the Decomposition)*: Ensure I explicitly state the weights as requested.
