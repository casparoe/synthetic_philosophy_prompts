      *   *Without Hitler:* Gregor Strasser is the likely successor. He was more socialist-oriented, less focused on the "Führer principle" cult, and more willing to cooperate with unions/left (which alienated elites).
      *   *Elite Support:* Elites (Hindenburg, Papen, Schacht) tolerated Hitler because they thought they could control him ("taming"). They despised Strasser. Without Hitler, the NSDAP loses the "respectable" veneer needed for the backroom deals of Jan 1933.
