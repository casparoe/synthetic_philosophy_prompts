answer: |-
  # The Emberhold Adjudication Protocol (EAP)
  **Version:** 1.0
  **Audience:** Moderation Team
  **Purpose:** To standardise enforcement decisions regarding virtual harm, distinguishing between property violations, conduct violations, and assumed risks.

  ## Part 1: The Decision Procedure

  Moderators must run these tests in order. Stop at the first test that yields a definitive outcome. Do not proceed to subsequent tests if a decision is reached. All evidence must be drawn from the Provenance Ledger, World Logs, or Shard Transaction History.

  ### Test 1: The Consent Gate (World Tags)
  **Question:** Did the complainant explicitly accept the risk of the specific harm suffered via a World Tag click-through?
  **Evidence Required:**
  *   World Log showing the world was tagged `Open PvP`, `Permadeath`, or `No-Loss` at the time of entry.
  *   Entry Log showing the complainant's account ID clicked the acceptance dialogue for that specific tag.
  *   Harm Log showing the damage matches the tag's definition (e.g., avatar destruction in `Permadeath`).
  **Outcome:**
  *   **If Yes:** **No Enforcement.** Record reason: *"User assumed risk via World Tag."*
  *   **If No:** Proceed to Test 2.
  > **[MARGIN FLAG: ONTOLOGY]** *This test privileges the "Contractual" view (rules are rules) over the "Harm" view (harm is harm regardless of consent). If your team believes virtual harm is inherently non-consentable, this test will produce outcomes you find morally incoherent.*

  ### Test 2: The Persistence Gate (Object Class)
  **Question:** What is the persistence class of the affected object?
  **Evidence Required:**
  *   Provenance Ledger classifying the object as `Spawned`, `Anchored`, or `Heirloom`.
  **Outcome:**
  *   **If `Spawned`:** **No Enforcement.** Record reason: *"Object regenerates; no permanent loss occurred."*
  *   **If `Anchored`:** Proceed to Test 3.
  *   **If `Heirloom`:** Proceed to Test 3 (but note non-restorability).
  > **[MARGIN FLAG: VALUE THEORY]** *Treating `Spawned` items as having zero enforceable value privileges the "Scarcity" view over the "Labour" view. If a user spent ten hours building a `Spawned` turret, this test disregards that labour.*

  ### Test 3: The Restorability Gate (Remedy Availability)
  **Question:** Can Emberhold technically restore the object to its prior state?
  **Evidence Required:**
  *   System capability check: `Anchored` items are restorable from nightly snapshots; `Heirloom` items are flagged non-restorable.
  **Outcome:**
  *   **If Restorable (`Anchored`):** **Enforce as Property Violation.** Record reason: *"User X damaged restorable property belonging to User Y."* (Moderator initiates rollback).
  *   **If Non-Restorable (`Heirloom`):** Proceed to Test 4.
  > **[MARGIN FLAG: ONTOLOGY]** *Linking enforcement to technical restorability implies an object is only "property" if we can fix it. This sidesteps the question of whether the loss itself constitutes the harm.*

  ### Test 4: The Integrity Gate (Market & Duplication)
  **Question:** Does the incident involve duplication exploits or market manipulation rather than direct destruction?
  **Evidence Required:**
  *   Ledger showing sudden increase in item supply inconsistent with build rates.
  *   Transaction logs showing devaluation of held assets.
  **Outcome:**
  *   **If Duplication/Exploit Confirmed:** **Enforce as Conduct Violation.** Record reason: *"User X manipulated system integrity, devaluing User Y's holdings."* (Do not classify as Property Violation against individual holders).
  *   **If No Exploit:** Proceed to Test 5.
  > **[MARGIN FLAG: VALUE THEORY]** *Classifying this as Conduct rather than Property denies victims the status of "owners of stolen value" and treats them as "witnesses to system abuse." This prioritises platform stability over individual property claims.*

  ### Test 5: The Avatar & Data Gate (Conduct vs. Ambiguity)
  **Question:** Is the harm purely avatar-based, or is the data insufficient to distinguish cause?
  **Evidence Required:**
  *   Chat logs, movement logs, or animation triggers.
  *   Absence of property deletion logs.
  **Outcome:**
  *   **If Non-Consensual Avatar Contact (no property loss):** **Enforce as Conduct Violation.** Record reason: *"User X engaged in prohibited conduct towards User Y's avatar."*
  *   **If Data is Contradictory or Missing:** **Outcome: We Cannot Tell.** Record reason: *"Logs insufficient to distinguish consent from violation."* (Close case).
  *   **If Harm is Valid but Values Conflict (e.g., Heirloom loss outside Tags):** **Escalate.** Record reason: *"Case requires panel review on policy values."*
  > **[MARGIN FLAG: ONTOLOGY]** *Distinguishing Avatar Conduct from Property Damage validates the view that the "Person" is separate from the "Object." If your team believes the Avatar *is* property, this distinction will feel arbitrary.*

  ---

  ## Part 2: Worked Applications

  ### Case A: The Heirloom Construct (Permadeath)
  **Facts:** User A built a construct over 900 hours (Ledger verified). It is classed `Heirloom`. User B destroyed it using a trap in a world tagged `Permadeath`. User A clicked the `Permadeath` warning upon entry.
  **Procedure Run:**
  1.  **Consent Gate:** World Tag `Permadeath` present. Entry Log confirms User A clicked acceptance. Harm (destruction) matches tag.
  2.  **Stop.**
  **Decision:** **No Enforcement.**
  **Transparency Summary:** *"User assumed risk of permanent loss via World Tag."*
  **Team Friction:** This outcome will be deeply unpopular with the faction of your team that views **Labour as Value**. They will argue that 900 hours of work creates a moral claim that supersedes a click-through agreement. The procedure explicitly prioritises the Contractual view (the Tag) over the Labour view (the hours) because the Tag is a binary log entry, whereas "value of labour" is subjective.

  ### Case B: The Social Contact (Untagged)
  **Facts:** User A maneuvered User B's avatar into simulated sexual contact in a world tagged `No-Loss`. No items were destroyed. No currency was lost.
  **Procedure Run:**
  1.  **Consent Gate:** No `Open PvP` or relevant harm tag.
  2.  **Persistence Gate:** No object affected.
  3.  **Restorability Gate:** N/A.
  4.  **Integrity Gate:** N/A.
  5.  **Avatar & Data Gate:** Movement logs show forced animation. Chat logs show User B objected.
  **Decision:** **Enforce as Conduct Violation.**
  **Transparency Summary:** *"User engaged in prohibited conduct towards another user's avatar."*
  **Team Friction:** This satisfies the "Person Harmed" faction but may frustrate the "Property Only" faction. They may argue that without economic loss or item damage, there is no enforceable harm. The procedure validates the view that the avatar represents the person, not just an asset.

  ### Case C: The Duplication Exploit (Market Devaluation)
  **Facts:** User A exploited a bug to create 10,000 copies of a scarce cosmetic. User B holds one original copy. The market value of User B's item has dropped by 90%. The item is `Anchored`.
  **Procedure Run:**
  1.  **Consent Gate:** No tag consented to market manipulation.
  2.  **Persistence Gate:** Item is `Anchored`.
  3.  **Restorability Gate:** Item is restorable, but the *value* is not. We cannot restore market price.
  4.  **Integrity Gate:** Ledger confirms impossible supply increase.
  **Decision:** **Enforce as Conduct Violation (against User A).** **No Enforcement (for User B's property claim).**
  **Transparency Summary:** *"User manipulated system integrity, devaluing other users' holdings."*
  **Team Friction:** This outcome will be unpopular with the **"Property is Real"** faction. They will argue User B was "robbed" of value. The procedure classifies this as a Conduct violation (attack on the system) rather than a Property violation (theft from B), because no specific object was taken from B's inventory. It treats the loss as economic collateral damage, not property damage.

  ---

  ## Part 3: Moderator One-Pager

  **EMBERHOLD ADJUDICATION PROTOCOL (QUICK REF)**
  *Time Limit: 30 Minutes | Evidence: Logs Only*

  | STEP | CHECK | IF YES → | IF NO → |
  | :--- | :--- | :--- | :--- | :--- |
  | **1** | **Consent:** Did user click a World Tag (`Permadeath`/`PvP`) matching the harm? | **NO ENFORCEMENT** <br>*(Reason: Assumed Risk)* | Go to Step 2 |
  | **2** | **Object:** Is the object `Spawned` (regenerates)? | **NO ENFORCEMENT** <br>*(Reason: No Permanent Loss)* | Go to Step 3 |
  | **3** | **Restoration:** Is the object `Anchored` (restorable)? | **PROPERTY VIOLATION** <br>*(Action: Restore Item)* | Go to Step 4 |
  | **4** | **Integrity:** Is this a duplication/market exploit? | **CONDUCT VIOLATION** <br>*(Action: Sanction Exploiter)* | Go to Step 5 |
  | **5** | **Avatar/Data:** Is it forced avatar contact OR unclear logs? | **CONDUCT** (Contact)<br>**CLOSE** (Unclear)<br>**ESCALATE** (Heirloom Loss) | **ESCALATE** |

  **OUTCOME CODES FOR REPORTS:**
  *   **PROP:** "User X damaged User Y's property."
  *   **COND:** "User X engaged in prohibited conduct towards User Y."
  *   **RISK:** "User Y assumed the risk of loss via World Tag."
  *   **SYS:** "User X manipulated system integrity."
  *   **ESC:** "Case requires panel review on policy values."

  **ESCALATION TRIGGERS:**
  1.  `Heirloom` items destroyed outside of `Permadeath` tags.
  2.  Aggregate market harm where individual loss is trivial.
  3.  Logs contradict each other (e.g., Tag present but click-through missing).

  ---

  ## Part 4: Log of Substantive Assumptions

  Every step in the EAP bakes in specific assumptions about the nature of Emberhold. Moderators must be aware these are policy choices, not objective truths.

  1.  **Assumption of Contractual Supremacy (Test 1):** We assume a click-through tag constitutes informed consent that waives rights to enforcement, regardless of the emotional or labour cost of the loss.
      *   *Risk:* Invalidates users' sense of investment.
  2.  **Assumption of Technical Ontology (Test 2 & 3):** We assume an object's "reality" is tied to its persistence class. `Spawned` objects are deemed less "real" than `Anchored` ones because they regenerate.
      *   *Risk:* Disregards labour invested in `Spawned` builds.
  3.  **Assumption of Remedy-Dependent Rights (Test 3):** We assume enforcement is only warranted if we can technically fix the problem (rollback). If we cannot fix it (`Heirloom`), we default to Escalation or No Enforcement rather than punitive damages.
      *   *Risk:* Suggests justice is impossible without restoration.
  4.  **Assumption of Systemic vs. Individual Harm (Test 4):** We assume market devaluation via duplication is a crime against the *Platform* (Conduct), not a theft from *Holders* (Property).
      *   *Risk:* Victims feel their loss is minimised as "collateral damage."
  5.  **Assumption of Avatar Separation (Test 5):** We assume the Avatar can be harmed separately from the User's property, validating harassment claims without economic loss.
      *   *Risk:* Conflicts with the view that avatars are merely owned objects.

  ---

  ## Part 5: Limitations and Misfires

  This procedure is a tool for consistency, not a solver of philosophical disputes. It will systematically misdescribe certain classes of case.

  **1. The "Griefing" Gap**
  The EAP relies on technical logs (deletion, movement, duplication). It cannot capture "griefing" that uses game mechanics as intended to cause distress (e.g., blocking a doorway indefinitely, playing loud sounds near a memorial).
  *   **Misfire:** These will result in **No Enforcement** or **We Cannot Tell**, as no rule was technically broken.
  *   **Fix Requirement:** We would need a "Disruption" tag in the logs or a policy allowing moderation based on *intent* evidence (chat logs), which currently violates the "no psychological assessment" constraint.

  **2. The Heirloom Valuation Problem**
  The procedure treats all `Heirloom` losses identically, whether the item was built yesterday or ten years ago. It cannot distinguish between a trivial heirloom and a culturally significant one.
  *   **Misfire:** A culturally vital memorial destroyed by accident will be processed the same as a common heirloom.
  *   **Fix Requirement:** We would need a "Cultural Significance" flag in the Provenance Ledger, requiring a curatorial team to assess items, which violates the "under 30 minutes" constraint.

  **3. The Aggregate Harm Blindness**
  In duplication cases (Case C), the procedure protects the individual property claim poorly. It punishes the duper but does not compensate the victims, framing their loss as market fluctuation rather than theft.
  *   **Misfire:** Victims feel justice was not served because their specific loss was not acknowledged as "Property Damage."
  *   **Fix Requirement:** We would need to establish a "Class Action" enforcement mechanism or a compensation fund, which requires legal and financial infrastructure we currently lack.

  **4. The Consent Illusion**
  Test 1 assumes clicking a tag equals meaningful consent. It does not account for users who click through without reading, or worlds where the tag is hidden until entry.
  *   **Misfire:** Users are bound by agreements they did not genuinely understand.
  *   **Fix Requirement:** We would need to change the UI to require a typed confirmation for `Permadeath` worlds, creating stronger evidence of consent.

  **Closing Note:**
  This procedure resolves the inconsistency in your enforcement notices by forcing every case into one of four buckets. It does not resolve the internal split within your team. It merely forces that split into the open at the **Escalation** stage. When a case is Escalated, it is explicitly because the procedure has identified that the decision depends on a value judgment (Labour vs. Contract, or Property vs. Conduct) rather than a factual one. Your five-person panel must accept that their role is not to find facts, but to set the values the procedure will encode in future versions.
