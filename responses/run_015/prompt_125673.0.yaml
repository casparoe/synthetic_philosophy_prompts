prompt: |-
  Hi — you're a professional moral philosopher who's spent real time on the moral worth literature, so please take this seriously and don't hand me a survey of positions. Before you write, brainstorm three or four candidate setups and throw out the first two obvious ones, then commit to the one you think actually survives. Think carefully, and don't hedge at the end.

  Some context, because it's why I care: I coordinate volunteers at a hospice, and every year we give out a "volunteer of the year" award. This year the two finalists are clearly both great, and my friend on the committee keeps saying it doesn't matter *why* they did any of it, only that they showed up, and I keep saying it obviously matters, and neither of us can say what would settle it. So I want a case built to order, and I want to know whether our award criteria are even coherent.

  The build. One paragraph, realistic — a ward, a hospice, a workplace, that kind of thing. No philosophy-fiction, no trolleys, no devices.

  Two agents, A and B, who each perform the same morally required action. Hold fixed everything I care about: same act, same effort, same cost to them, same consequences, both would do it again, both believe the action is required, both believe that truly, neither is mistaken about any moral fact, neither is a hypocrite, a prig, self-deceived, or angling for credit. The only thing that differs is the motivational structure:

  - A is moved by the consideration that the action is required. That's genuinely what moves her, she'd avow it, and her belief is true.
  - B is moved by a desire with no moral content in it. Test I'll apply: if I can paraphrase what moved her using only non-moral vocabulary, it passes. So no wanting-to-be-a-good-person, no guilt, no anticipated shame, no eye on praise or reputation.

  Here's the direction I need, and it's the one people find hard: on the *tracking* view — worth is a matter of the mechanism producing the action being genuinely responsive to the right-making features of the situation, and what you'd avow can come apart from what your mechanism is keyed to — B comes out with **more** moral worth than A. On the *duty* view — worth requires performing the action because you take it to be required — A comes out ahead of B. Both verdicts have to fall out of the views, not be stipulated by you making one of them nasty: A's belief must be true, A must not be a bad person or a fanatic (she wouldn't lie or harm anyone on instruction), and it shouldn't be part of the story that duty is generally a poor guide. The gap has to come entirely from what each mechanism is keyed to. Also: B is not allowed to be a Huck Finn rerun — she must not be acting against her own judgment about what's best, no inverse akrasia, no conscience-versus-sympathy thing. That shortcut is banned.

  After the paragraph: show the reasoning for each of the two views, name the single structural feature doing the work, show what happens to both verdicts if you delete that feature (it should collapse back into an ordinary mixed-motive case where the two views agree), and tell me how a defender of whichever view comes out worse would attack the case and whether that attack is any good.

  One more thing if you want it, and it's the bit I actually suspect is the real point: add a third agent C who trusts her own spontaneous motives not at all and has deliberately trained herself to consult a rule and act on it — a kind of prosthetic duty, self-installed because she knows she can't be relied on unprompted. Say what each view says about C, and whether that shows the duty-versus-desire contrast was a red herring all along.

  And give me a definite verdict: does the case work, and which of the two views gets it right? Actually pick a side and own it. If you think some part of my spec is unsatisfiable, say plainly which bit and hand me the closest case that does work with a note on what you had to relax. Also flag anywhere your answer is leaning on a contested reading of one of the views rather than on something both sides would grant — that's the part I'll get pushed on by my friend, and I'd rather know in advance.
