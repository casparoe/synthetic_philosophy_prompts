      *   **Brainstorming:** Explicitly list 3, dump 2.
      *   **Case:** The Night Shift (Hospice).
      *   **Analysis:** Tracking vs. Duty.
      *   **Feature:** De Dicto (Requiredness) vs. De Re (Suffering).
      *   **Agent C:** The Trained Volunteer.
      *   **Verdict:** Tracking View is correct. Moral worth is about contact with value, not submission to law.
      *   **Flags:** The definition of "Tracking" here is specific (Arpaly's non-instrumental responsiveness vs. Kantian rigidity). The "B believes it's required" constraint is the hardest to keep distinct from motivation.

  7.  **Writing - Section by Section:**
      *   *Brainstorming:* Keep it brief but show the work.
      *   *The Case:* One paragraph. Dense.
      *   *The Analysis:* Reasoning for Tracking, Reasoning for Duty. Structural Feature. Deletion test. Attack.
      *   *Agent C:* Evaluation.
      *   *Verdict:* Definite choice. Flags on contested readings.

      *Self-Correction on "Tracking View":* The prompt says "on the tracking view... B comes out with **more** moral worth than A." Standard Arpaly might say A is fine if the belief is true. To make B win, I need to emphasize that A's motivation is *opaque* to the reasons. A cares about the *status* of the act. B cares about the *content* of the act (the suffering). This is the "right-making features" nuance. I must make sure this distinction is clear.

      *Self-Correction on "Duty View":* Needs to be strictly about the motive of duty. A acts *because* it is required. B acts *because* she wants to stop shivering (even if she knows it's required).

      *Agent C:* C trains herself to use duty because she distrusts desire.
      *   Duty View: C is ideal (cultivated duty).
      *   Tracking View: C is less worthy than B (mediated responsiveness) but maybe more than A (if A is just naturally rigid)? No, let's say C is similar to A but praiseworthy for the training. Actually, if C *trusts* the rule over her motives, she is prioritizing the deontic status. Tracking might see this as alienation from the real reasons.
      *   Red Herring: If C (who uses duty instrumentally) is valued, then "Duty" isn't the key, "Reliability/Responsiveness" is.

      *Verdict:* I will side with the Tracking View. In a care context (hospice), responsiveness to the patient (B) is morally superior to responsiveness to the rule (A).

