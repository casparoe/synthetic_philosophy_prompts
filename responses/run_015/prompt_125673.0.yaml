answer: |-
  ### Brainstorming & Setup Selection

  **Candidate 1: The Fanatic vs. The Saint.**
  *Setup:* A helps because a divine command requires it. B helps because she naturally loves everyone.
  *Discard:* Too risky. A risks violating your constraint that she not be a fanatic or harmful if instructed otherwise. It introduces theological baggage that distracts from the structural moral worth issue.

  **Candidate 2: The Contract vs. The Friend.**
  *Setup:* A helps because she signed a volunteer contract. B helps because the patient reminds her of her grandfather.
  *Discard:* Fails the "same morally required action" constraint. If B helps only because of the resemblance, it suggests she wouldn't help a stranger, undermining the claim that she recognizes the action as universally required. It makes B's worth particularistic, not moral.

  **Candidate 3: The Protocol vs. The Pain (Selected).**
  *Setup:* A helps because the hospice manual dictates it. B helps because she viscerally dislikes seeing physical distress.
  *Commitment:* This isolates the *object* of motivation. A targets the deontic status ("required"); B targets the non-moral ground ("suffering"). Both agree the act is required, but only B is moved by the feature that *makes* it required. This survives your constraints without invoking inverse akrasia or fanaticism.

  ***

  ### The Case

  It is 3:00 AM in the hospice ward. Patient 402 is awake, trembling, and unable to reach the water pitcher. Both volunteers are on shift. Agent A checks the night protocol, sees the clause "Respond immediately to distress signals," thinks, "This is what I am obligated to do," and walks over to pour the water and adjust the blanket. Agent B hears the tremor in the patient's breathing, feels a sharp, non-moral aversion to the sight of the shivering—like a dentist wincing at a drill—and walks over to pour the water and adjust the blanket to stop the shivering. Both believe helping is morally required; both are correct; neither seeks praise; both would do it again tomorrow. A is moved by the obligation; B is moved by the aversion to the physical distress.

  ***

  ### Analysis of the Views

  **The Tracking View (B > A)**
  On this view (associated with theorists like Arpaly), moral worth is a measure of how tightly an agent's psychology is coupled to the *right-making features* of the situation. The right-making feature here is the patient's suffering and need. B's mechanism is keyed directly to this feature (the shivering causes her aversion, prompting action). A's mechanism is keyed to the *deontic status* of the act (its requiredness). While the rule tracks the feature, A's motivation is one layer removed; she is responsive to the *rule*, not the *suffering*. If the rule were slightly misaligned (e.g., protocol said "wait 5 minutes"), A might hesitate, whereas B would act immediately. B demonstrates a more robust, non-accidental responsiveness to the actual value at stake. Therefore, B has more moral worth.

  **The Duty View (A > B)**
  On this view (Kantian/Strawsonian), moral worth arises from the subordination of inclination to the moral law. B acts from inclination (aversion to shivering); even if the inclination is good, it is contingent. If B didn't mind the shivering, she wouldn't act. A acts from the recognition of requirement *despite* the lack of inclination (we assume A feels no particular pang). A's will is determined by the moral law itself, granting her action a dignity B's lacks. B's action is merely in conformity with duty; A's is from duty. Therefore, A has more moral worth.

  **The Structural Feature**
  The single feature doing the work is the **Object of Motivation**: Is the agent motivated by the *deontic status* (Requiredness) or the *non-moral ground* (Suffering)?
  *   **Tracking View** prizes the Ground (direct contact with value).
  *   **Duty View** prizes the Status (submission to law).

  **The Deletion Test**
  If you delete this feature—making both agents moved by a mix of the rule and the pain—the case collapses into an ordinary mixed-motive scenario. Both views would then agree that worth is either diluted (Duty view says inclination contaminates purity) or additive (Tracking view says more responsiveness is better). The sharp divergence requires the exclusivity of the motive.

  **The Attack**
  A defender of the Duty View would attack the Tracking verdict by arguing that B's motivation is **fragile**. B's aversion to shivering is a contingent psychological fact; if she becomes desensitized or the patient's distress is invisible (e.g., internal pain), B's mechanism fails. A's mechanism (consulting the rule) is stable across changes in sentiment.
  *Is this attack good?* It is strong on *reliability*, but weak on *worth*. Reliability is instrumental value; moral worth is often thought to be about the quality of the will *now*. However, if moral worth is partly about being a good moral agent over time, the Duty defender has a point. But in this specific snapshot, the attack relies on predicting future failure rather than evaluating current worth.

  ***

  ### Agent C: The Prosthetic Duty

  Agent C knows she is emotionally volatile. Sometimes she feels too much, sometimes too little. She has deliberately trained herself to ignore her spontaneous feelings and consult the protocol before acting, treating the rule as a prosthetic to ensure consistency.

  *   **Duty View:** C is the ideal. She has recognized the unreliability of inclination and cultivated a will determined by duty. She surpasses A (who might just be naturally rigid) because C's adherence is a hard-won achievement of rational self-governance.
  *   **Tracking View:** C is problematic. She has intentionally inserted a barrier between herself and the right-making features. She acts on the *map* (rule) rather than the *territory* (suffering). While her actions are correct, her moral sensitivity is attenuated. She is less worthy than B, and arguably less worthy than A (if A's rule-following is at least honest, whereas C's is a suppression of data).

  **Is the Contrast a Red Herring?**
  Yes. C reveals that the real conflict isn't Duty vs. Desire, but **Mediation vs. Immediacy**.
  *   The Duty View values Mediation (Rule > Feeling).
  *   The Tracking View values Immediacy (Feature > Rule).
  Agent C shows that "Duty" is just a specific type of mediation. If the Tracking View is correct, C confirms that acting *because it is required* (whether naturally like A or trained like C) is always inferior to acting because of the feature (B). The A/B contrast wasn't about duty being bad, but about duty being *opaque*.

  ***

  ### Verdict & Flags

  **Verdict:** The case works, and the **Tracking View gets it right.**
  In a care context like hospice, moral worth should track the quality of attention paid to the patient. A pays attention to the handbook; B pays attention to the patient. A's action is morally correct, but B's action embodies the moral value itself. The Duty View mistakes the *security* of the motive for its *worth*. We award volunteers for their care, not their adherence to protocol. B cares; A complies.

  **Unsatisfiable Constraint & Relaxation:**
  You required that B "believes the action is required" but is "moved by a desire with no moral content."
  *   *Relaxation:* In practice, if B truly believes it's required, that belief usually exerts *some* causal pressure. To make the case work, I had to assume **overdetermination**: the desire was sufficient to cause the act, and the belief was present but causally inert in that moment. If the belief played any causal role, the Duty View would claim B is also acting from duty (plus inclination), muddying the water. I treated the belief as a background endorsement rather than a motive.

  **Contested Reading Flag:**
  Your friend will push on the **Tracking View's definition**.
  *   *The Contest:* Some Tracking theorists (e.g., certain readings of Arpaly) argue that acting *because it is right* (A) is just as good as acting because of the features (B), provided the belief is true. They argue "requiredness" *is* a right-making feature.
  *   *The Defense:* I am relying on the **De Re/De Dicto distinction**. A is motivated *de dicto* (by the description "required"). B is motivated *de re* (by the property "suffering"). The contested claim is that *de re* responsiveness is superior to *de dicto* responsiveness because it avoids fetishizing morality. If your friend argues that "doing it because it's right" is the gold standard of tracking, this case collapses. You must defend the claim that tracking the *ground* of the rightness is better than tracking the *status* of the rightness.

  **Final Advice for the Committee:**
  If you value the *culture* of hospice, give the award to B (or the profile B represents). A is a safe employee; B is a caregiver. The award is for "Volunteer of the Year," not "Compliance Officer of the Year." The Duty View protects the institution; the Tracking View protects the patient. Choose the patient.
