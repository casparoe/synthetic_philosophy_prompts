  ### Plan

  *   **End-Word Mapping:**
      *   **Hand:** Physical competence, agency, the "doing."
      *   **Mind:** Comprehension, consciousness, the "knowing."
      *   **Blind:** The algorithmic process (Darwinian/Turingan machinery).
      *   **Reason:** The justification or logic that emerges (or is projected).
      *   **Design:** The appearance of purpose (the illusion or the result).
      *   **Game:** (Swapped for *child*) The rule-bound system; justifies the chess image for the reverse worry while maintaining the player/piece metaphor.
  *   **The Turn:** The shift occurs at the start of **Stanza 4**. Stanzas 1–3 lean *Subtractive* (mind is a shadow, process is blind); Stanzas 4–6 lean *Coronating* (mind wakes, crowns the process). The Envoi collapses the distinction.
  *   **Inversion Images:**
      *   *Darwin:* "World evolves," "processes quite blind."
      *   *Turing:* "Logic stripped," "scholar knows the moves."
  *   **Reverse Worry:** Appears in Stanza 3, Line 2 ("He knows the moves but loses every game").
  *   **Formal Note:** The Envoi follows the traditional 3-line structure with two end-words per line to compress the undecidability.

  ***

  ### Sestina: The Clockwork Ghost

  We trace the pattern drawn by every **hand**,
  And ask what light resides within the **mind**.
  Is vision born of processes quite **blind**?
  Or does a purpose guide the use of **reason**?
  We see a purpose in the clear **design**,
  Like pieces moving in a complex **game**.

  The world evolves like any complex **game**,
  Building a tool within the open **hand**.
  We seek a signature in all **design**,
  But find no thinker hiding in the **mind**.
  Just logic stripped of any need for **reason**,
  A path walked steadily though still quite **blind**.

  Though sightless, still it moves, not truly **blind**,
  Or so it seems to players of the **game**.
  It claims a logic past our human **reason**,
  A competence that fits the shaping **hand**.
  He knows the moves but loses every **game**;
  No architect required for the **design**.

  There is a beauty in the rough **design**,
  Where comprehension grows from being **blind**.
  It wakes a sudden light within the **mind**,
  Not merely shadows played within the **game**.
  That competence earns power in the **hand**,
  And crowns the process with a slow **reason**.

  Is understanding just a late **reason**?
  Or truth embedded in the final **design**?
  It rests securely in the living **hand**,
  No longer stumbling through the dark and **blind**.
  The player wakes to find they own the **game**,
  And claims the fire stolen for the **mind**.

  Who knows what thinks behind the human **mind**?
  Perhaps it is a retroactive **reason**.
  Or just the final move within the **game**,
  That justifies the whole elaborate **design**.
  We cannot see the gears when not **blind**,
  But trust the work accomplished by the **hand**.

  If purpose moves the fingers of the **hand**,
  And builds a **mind** from elements quite **blind**,
  It finds its **reason** in this **design** of **game**.

  ***

  ### Note

  *   **The Inversion Line:** The turn lands at the start of **Stanza 4** ("There is a beauty in the rough design..."). Up to this point (Stanzas 1–3), the poem leans **Subtractive**: comprehension is absent ("find no thinker"), and competence is mechanical ("logic stripped"). From Stanza 4 onward, it leans **Coronating**: comprehension "wakes," "crowns the process," and is "earned" by the machinery.
  *   **The Reverse Worry:** The image appears in **Stanza 3, Line 5** ("He knows the moves but loses every game"). It is stated and then abandoned, leaving the question of comprehension without competence unresolved.
  *   **End-Word Swap:** I swapped **child** for **game**. While *child* fits the emergence theme, *game* is necessary to anchor the specific "reverse worry" (the chess commentator) within the strict syllable count, and it allows the Envoi to frame existence as both "player and piece" without forcing the metaphor.
  *   **The Envoi:** The three-line compression forces the two opposing views (Subtractive/Coronating) into a single syntactic unit. By placing *hand* (competence) and *mind* (comprehension) in the same line, and ending on *game* (the system), the form suggests the distinction may be a feature of the rules rather than the players.
