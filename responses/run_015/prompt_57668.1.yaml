answer: |-
  A provision remains unless the audit establishes that its removal produces no net safety loss and no systemic disruption, or that its verified function is outweighed by its imposed burden.

  ### PROCEDURE FOR STAFF AUDIT OF DELETION PROPOSALS

  **Phase 1: Ordered Inquiry**
  Execute the following questions in sequence. Stop at the first failure that triggers a stopping rule.

  1.  **Function Identification:** What specific physical failure mode does this provision prevent?
      *   *Sufficient Answer:* A causal chain linking compliance to the prevention of a defined hazard (e.g., "Prevents flashover in corridor by limiting fuel load").
      *   *Failure:* "Historical practice," "Industry standard," or "Committee intent unknown."
      *   *Timeout:* 15 minutes of search.
      *   *Action on Timeout:* Mark **[JUDGMENT: Assume Function Exists]** and proceed to Phase 2.

  2.  **Evidence Verification:** Is there data or engineering first principles supporting the function?
      *   *Sufficient Answer:* Incident data, test reports, or accepted physics models.
      *   *Failure:* Anecdote, single inspector assertion, or absence of data.
      *   *Domain Rule:* Absence of incident data is not evidence of absence of function; treat non-events as successful prevention. **[JUDGMENT: Weight of Negative Evidence]**.
      *   *Action on Failure:* Proceed to Phase 3.

  3.  **Dependency Mapping:** What external systems cite this provision?
      *   *Sufficient Answer:* A list of cross-references within the code, plus known external dependencies (inspection checklists, insurance underwriting, licensing exams, software logic).
      *   *Failure:* Unknown external usage.
      *   *Domain Rule:* Deletion orphaning external systems counts as systemic disruption. **[JUDGMENT: Scope of Systemic Risk]**.
      *   *Action on Failure:* Mark **[JUDGMENT: Assume Dependency Exists]** and proceed to Phase 4.

  4.  **Origin Audit:** Why was this adopted?
      *   *Sufficient Answer:* Documented committee report or rationale statement.
      *   *Failure:* Missing record.
      *   *Branch: Illegitimate Origin:* If documented origin is exclusionary (e.g., trade barrier):
          *   Is current safety function independently verified (see Q1/Q2)?
          *   If Yes: Verdict must be **Re-found**.
          *   If No: Verdict must be **Delete**.
          *   *Ruling:* Illegitimate origin is not decisive on safety grounds but is decisive on legitimacy grounds; it shifts the burden of proof to the retainer to demonstrate current function. **[JUDGMENT: Ethical vs. Safety Priority]**.
      *   *Action on Failure (Standard):* Proceed to Phase 5.

  5.  **Cost-Benefit Stopping Rule:** Has the audit cost more than the deletion is worth?
      *   *Calculation:* Estimate staff hours spent vs. estimated industry compliance cost savings.
      *   *Stopping Rule:* If research time exceeds 30 minutes per provision or if verified safety function is unknown, cease search.
      *   *Action:* Default to **Retain** unless Illegitimate Origin branch triggered. **[JUDGMENT: Resource Allocation vs. Risk]**.

  **Phase 2: Verdict Selection**
  Select one of the following. Commitments are binding for the cycle.

  1.  **Delete:** Removes text. Commits the committee to accept the risk of unknown failure modes and systemic orphaning. Use only when Function is Verified as Null and Dependencies are Cleared.
  2.  **Retain as Written:** Keeps text and rationale. Commits the committee to defend the status quo against future proposals. Use when Function is Unknown (Chesterton) or Dependencies are High.
  3.  **Re-found:** Keeps text but replaces rationale and possibly scope. Commits staff to draft new explanatory text. Use when Function is Verified but Origin is Missing or Illegitimate.
  4.  **Hold to Next Cycle:** Defers decision. Commits staff to complete the audit in the next cycle.
      *   *Evasion Condition:* Using "Hold" when the Stopping Rule has already been triggered or when the missing information is unlikely to surface. **[JUDGMENT: Diligence vs. Delay]**.

  ---

  ### WORKED CASES

  **Case A: Manual Alarm Pull Stations (1950s)**
  *   **Audit:**
      *   Q1 (Function): Manual alert for occupants before automatic systems activate.
      *   Q2 (Evidence): No incident data where pull station succeeded where sprinklers failed. Non-event status confirmed.
      *   Q3 (Dependencies): Cross-referenced by 3 code sections, state licensing exam, insurance checklist.
      *   Q4 (Origin): Missing.
      *   Q5 (Cost/Benefit): Removal saves cost; audit time within limit.
  *   **Analysis:** Function is theoretically valid but empirically unsupported. However, dependency mapping reveals high systemic risk. Deleting orphaning licensing and insurance protocols creates disruption greater than the cost of the hardware. The non-event problem means lack of data does not prove uselessness.
  *   **Verdict:** **Retain as Written.**
  *   **Commitment:** We accept the cost of redundant hardware to preserve systemic stability in inspection and licensing regimes.
  *   **Note:** This verdict is unpopular; it prioritizes bureaucratic inertia over cost simplification because the audit cannot guarantee safety equivalence without destabilizing external tracking systems.

  **Case B: Exterior Wall Joint Sealing (1978)**
  *   **Audit:**
      *   Q1 (Function): Prevent fire spread through joints.
      *   Q2 (Evidence): No test data. One retired inspector letter ("it matters").
      *   Q3 (Dependencies): Unknown.
      *   Q4 (Origin): "Recommended by committee."
      *   Q5 (Cost/Benefit): Audit stalled at 25 minutes; no rationale found.
  *   **Dossier Status (Stalled):**
      *   *Rationale Source:* None found in archives.
      *   *Technical Justification:* None found in engineering literature.
      *   *Incident History:* No records linking joint failure to fire spread in this occupancy.
      *   *Inspector Testimony:* Single anecdotal assertion, uncorroborated.
      *   *Staff Conclusion:* Cannot verify function. Cannot verify nullity.
  *   **Verdict:** **Hold to Next Cycle.**
  *   **Commitment:** Staff must locate original committee members or commission a technical justification before the next vote.
  *   **Note:** This is not an evasion because the stopping rule was not fully triggered (5 minutes remaining), but the lack of findings prevents a Retain/Delete decision. The dossier explicitly lists the gaps above without filling them.

  **Case C: Exclusionary Origin Provision**
  *   **Audit:**
      *   Q1 (Function): Verified safety work (workforce qualification ensures installation quality).
      *   Q2 (Evidence): Installation error rates correlate with unqualified labor.
      *   Q3 (Dependencies): Workforce licensing.
      *   Q4 (Origin): Documented intent to exclude specific class of workers.
      *   *Branch:* Illegitimate Origin triggered. Current safety function is verified.
  *   **Verdict:** **Re-found.**
  *   **Commitment:** The requirement stays, but the text must be rewritten to base qualification on competency metrics rather than the legacy exclusionary criteria. Staff must draft new performance-based language.
  *   **Note:** Origin was not decisive on safety grounds (preventing harm remains paramount) but was decisive on legitimacy grounds (requiring new rationale).

  ---

  ### FAILURE MODES

  1.  **The Retention Ratchet:** The procedure defaults to **Retain** when information is missing (Chesterton). Over cycles, this accretes hundreds of dead provisions where the cost of research exceeds the cost of compliance. The code becomes a museum of unknown fences.
      *   *Mitigation:* Periodic "Sunset Audits" where entire chapters are subject to a higher burden of proof for retention, reversing the default.

  2.  **The Systemic Trap:** Dependencies (checklists, insurance) are often invisible to staff. A **Delete** verdict may pass safety review but fail in the field because inspectors fail buildings for missing the deleted item.
      *   *Mitigation:* Require sign-off from external bodies (licensing, insurance) before **Delete** is issued, slowing the process.

  3.  **The Evasion Loop:** The **Hold to Next Cycle** verdict is the most likely to be abused. Staff use it to avoid making unpopular decisions (like Case A) or to mask incomplete audits (like Case B). It kicks the resource cost into the future.
      *   *Mitigation:* Cap "Hold" verdicts at 10% of all proposals per cycle; any excess forces a **Retain** or **Delete**.

  4.  **The Judgment Blindspot:** Steps marked **[JUDGMENT]** are where bias enters. Staff may overestimate systemic risk to avoid the blame of a deletion that later fails, or underestimate it to please industry cost-cutters.
      *   *Mitigation:* Publish the audit dossier alongside the verdict; external scrutiny of the judgment calls is the only check.
