answer: |-
  1. Rawls explicitly denies that agents behind the veil have any basis for assigning probabilities, rejecting the principle of insufficient reason you propose. Consequently, expected utility maximization is impossible because there is no valid prior distribution over social positions.
  2. The choice of maximin is not due to psychological risk aversion but stems from the unique gravity of the choice, which concerns one's fundamental life prospects. Rawls argues this makes it reasonable to protect the minimum position rather than gamble for average gains.
  3. Furthermore, the difference principle is grounded in the ideal of society as a fair system of cooperation, not merely in a specific decision-theoretic model. The original position is a device to model fairness, not a literal description of rational choice under uncertainty.
  4. In your housing case, the difference principle applies to the institutional rules defining the scoring system, not necessarily to every discrete allocation decision in isolation. Defining the least advantaged by composite need-scores requires ensuring those scores accurately reflect Rawlsian primary goods rather than arbitrary metrics.
  5. While prioritizing the bottom score aligns with the difference principle, drastically cutting total services might violate the requirement to maintain adequate social bases for self-respect across society. Rawlsian justice requires maximizing the least advantaged position within a feasible system that sustains everyone's basic needs, not just optimizing a single metric at the expense of overall functioning.
