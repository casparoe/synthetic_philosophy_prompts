answer: |-
  **Project Title:** Multidimensional Broadcasting: A Conceptual Refinement of Global Workspace Theory

  **Research Question**
  To what extent does decomposing the "global broadcast" of Global Workspace Theory (GWT) into spatial scope, temporal persistence, and cross-modal integration reveal intermediate states between phenomenal consciousness and access consciousness that binary models obscure?

  **Rationale and Gap Analysis**
  The contemporary debate regarding the relationship between phenomenal consciousness (P-con) and access consciousness (A-con) relies heavily on a binary conception of information availability. Proponents of the Global Neuronal Workspace model typically characterize "ignition" as a phase transition: a representation is either broadcast globally (becoming accessible and, on this view, phenomenal) or it remains local and unconscious. Opponents, such as those advocating for overflow, argue that P-con exceeds A-con, but they generally accept the standard definition of access as a unitary capacity for report or reasoning.

  This binary framing leaves a critical structural question unaddressed: Is "global availability" a single switch, or a vector of distinct properties?
  *   **Dehaene's workspace model** treats ignition as a threshold event, obscuring potential gradations in *how* information is made available once the threshold is crossed.
  *   **Block's overflow argument** posits a capacity mismatch between P-con and A-con but does not analyze whether the "access" side of the equation is itself heterogeneous.
  *   **Cohen's emphasis on reportability** treats the inability to report as evidence of unconsciousness, potentially conflating the *content* of consciousness with the specific *dimension* of broadcasting required for motor output.

  By treating broadcast as unitary, these positions risk missing intermediate states. For example, a state might have high spatial scope (available to many modules) but low temporal persistence (decaying before report is possible), or high persistence but low cross-modal integration (available to visual modules but not linguistic ones). If broadcast is multidimensional, the P-con/A-con distinction may not be a binary split but a divergence along specific dimensional axes. This project proposes that analyzing these dimensions independently can resolve apparent contradictions in current empirical data without requiring new laboratory experimentation.

  **Methodology and Work Plan**
  This project utilizes conceptual analysis and the modeling of existing empirical paradigms. No new data collection is required.

  *   **Month 1: Conceptual Formalization**
      *   Define the three proposed dimensions rigorously.
          *   *Spatial Scope:* The proportion of cognitive modules (perceptual, mnemonic, motor) receiving the signal.
          *   *Temporal Persistence:* The duration of availability relative to the window required for report.
          *   *Cross-Modal Integration:* The degree to which the signal binds with formats required for higher-order reasoning (e.g., linguistic encoding).
      *   Establish criteria for independence: Demonstrate that it is conceptually coherent for one dimension to vary while others remain constant.
      *   *Deliverable:* A formal definitions paper outlining the "Broadcast Vector."

  *   **Month 2: Empirical Mapping**
      *   Map known experimental conditions onto the three dimensions.
          *   *Inattentional Blindness:* Likely low scope, variable persistence.
          *   *Masked Priming:* High scope (motor influence) but low integration (no report).
          *   *Attentional Blink:* High scope but critically limited temporal persistence.
          *   *Partial-Report Tasks:* Dissociate integration (iconic memory) from reportability.
      *   Analyze whether specific dimensional profiles correlate with reports of "phenomenal presence without access" or "access without full phenomenality."
      *   *Deliverable:* A mapping matrix linking experimental paradigms to dimensional profiles.

  *   **Month 3: Taxonomy and Synthesis**
      *   Construct a taxonomy of consciousness profiles based on dimensional combinations (e.g., "Ephemeral Access," "Siloed Phenomenality").
      *   Test the taxonomy against the "overflow" and "no-overflow" positions to see if it dissolves the dichotomy.
      *   Draft the final manuscript arguing for the multidimensional model.
      *   *Deliverable:* Complete draft of the research paper and the Consciousness Profile Taxonomy.

  **Deliverables and Success Conditions**
  *   **Success:** The production of a coherent taxonomy where at least one combination of dimensions (e.g., High Scope + Low Integration) maps onto a recognized empirical anomaly that binary GWT cannot explain. Success is defined as showing that the P-con/A-con debate is partially verbal, stemming from conflating distinct dimensions of access.
  *   **Failure:** If the three dimensions prove conceptually inseparable (e.g., if cross-modal integration is shown to be a necessary condition for spatial scope) or if the dimensional profiles map perfectly onto the existing binary distinction without adding explanatory power. Failure also includes the inability to distinguish the proposed dimensions from standard distinctions between attention, working memory, and reportability without mere redescription.

  **Scope Assessment and Risks**
  *   **Feasibility:** This scope is appropriate for a single researcher over three months because it restricts the inquiry to conceptual modeling and the reinterpretation of published paradigms rather than new data collection. The focus is narrow: the structure of the "broadcast" mechanism, not the neural correlates themselves.
  *   **Risks:** The primary risk is "scope creep" into neuroscience specifics. Without collaboration with cognitive scientists, there is a danger of misinterpreting the physiological constraints of the proposed dimensions (e.g., assuming temporal persistence can vary independently of neural refractory periods). To mitigate this, the project will rely on functional descriptions of cognitive modules rather than anatomical claims.
  *   **Limitations:** This project cannot settle the hard problem of consciousness. It can only refine the functional architecture of access. It also cannot definitively prove the existence of non-reportable phenomenality; it can only show that the theoretical framework used to deny it is overly coarse.

  ***

  **Confidence Rating and Critical Uncertainty**

  **Confidence Rating:** 85%

  **Point of Least Certainty:**
  I am least certain about the **independence of the proposed dimensions from existing cognitive constructs.** Specifically, there is a significant risk that "Spatial Scope," "Temporal Persistence," and "Cross-Modal Integration" are not novel structural features of broadcasting, but merely redescriptions of the familiar distinctions between **attention (selection), working memory (maintenance), and reportability (output).**

  If "Spatial Scope" maps perfectly onto "Attention," "Temporal Persistence" onto "Working Memory," and "Cross-Modal Integration" onto "Reportability," the project risks becoming a terminological exercise rather than a substantive theoretical refinement. The success of the proposal hinges on demonstrating that these dimensions cut across the traditional categories—for example, showing that one can have high working memory persistence without high cross-modal integration in a way that the standard model does not already capture. If the dimensions collapse into the very faculties they are meant to analyze, the proposed taxonomy will fail to offer new explanatory leverage.
