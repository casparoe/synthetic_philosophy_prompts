  # The Emotion Theory Quiz

  **Instructions for the Group:**
  Read the nine scenarios below. For the first three, choose the option that best fits your intuition. Write down the letter (A, B, or C) for each to get your three-letter code. For the remaining six, simply discuss the question; they are there to flesh out your position, but your 'Leaf' is determined by the first three.

  **Note:** Answer as you *actually* feel, not how you think a scientist *should* answer. There are no right answers, only consistent ones.

  ---

  ### Part 1: The Dissociation Code

  **1. The Safe Spider**
  You have a severe phobia of spiders. You walk into a room and see a large spider in the corner. Your heart hammers, your hands sweat, and you feel a surge of terror. Then your partner points out it is a highly realistic wind-up toy. You *know* perfectly well it is harmless. You still feel the terror and the sweat, even though your judgement has changed.
  *Is there still an emotion here, or just a reflex?*
  *   **A)** Yes, it is still fear. The feeling is what matters.
  *   **B)** No, it is just a physiological glitch. Real fear requires believing you are in danger.
  *   **C)** It depends. It is fear-like, but perhaps not a 'full' emotion without the belief.

  **2. The Numb Mourner (Sam)**
  Sam has been on medication for a year. His father dies. Sam says, "I am devastated," and he means it. He cries at the funeral. He makes all the sad choices one would expect. But when asked, he says, "I don't *feel* anything. The sadness is in my head and my tears, but there is no ache inside."
  *Is Sam actually grieving, or just simulating it?*
  *   **A)** Yes, he is grieving. The judgement and the behaviour are enough.
  *   **B)** No, without the felt pain, it is just a performance.
  *   **C)** It depends. He has the components of grief, but the core ingredient is missing.

  **3. The Printer and the Fiction**
  Case 1: You scream with fury at a printer that has jammed for the third time.
  Case 2: You weep with grief over a character dying in a novel.
  In both cases, there is no real person to be angry at or sad for, and no action you can take to fix the situation.
  *Is there still an emotion here, or not?*
  *   **A)** Yes, the feeling is real even if the object is not.
  *   **B)** No, emotions must be about real things in the world.
  *   **C)** It depends. Fury at a printer is frustration; grief for fiction is a different kind of state entirely.

  ---

  ### Part 2: The Substantive Six

  **4. Introspective Error**
  Can you be wrong about what you are feeling? (e.g., thinking you are angry when you are actually jealous, or thinking you are fine when you are depressed).
  *   *Discuss: If emotions are private feelings, error seems hard. If they are judgements, error seems easy.*

  **5. The Labrador and the Baby**
  Can a ten-month-old baby or a labrador have the *same* emotion as you (e.g., fear), or do they only have something that *looks* like fear from the outside?
  *   *Discuss: Does emotion require language and concepts, or is it a biological heritage?*

  **6. Free-Floating Irritability**
  You wake up irritable. You snap at your partner. Later you realise there was no reason; you were just tired or hormonal. Is this irritability the same *kind* of thing as being angry *at* your partner for something they did?
  *   *Discuss: Does an emotion need a target (an object), or can it just be a mood?*

  **7. Surviving the Object**
  You are furious with a colleague. They die suddenly the next day. You find you are still furious with them a week later.
  *   *Discuss: Can the emotion survive the existence of the thing it is about?*

  **8. The Safe Dark**
  You are an adult. You know perfectly well there are no monsters in the dark. Yet, walking down a dark corridor, you feel afraid.
  *   *Discuss: Is your fear *about* the monsters (which don't exist) or about the dark (which does)?*

  **9. The Same Word, Different Thing**
  Consider the word 'love'. The love for a partner, the love for a pet, and the love for a favourite sandwich.
  *   *Discuss: Do these share one single underlying thing called 'love', or do we just use the same label for three different mechanisms?*

  ---

  ### The Eight Leaves (Theories)

  Once you have your three-letter code from Part 1, match it to one of the following views. These are the 'Leaves' of the tree.

  1.  **Evaluative Judgements:** Emotions *are* beliefs or judgements about value (e.g., Fear = Judging something as dangerous).
  2.  **Perceptions of Value:** Emotions are like senses; they detect value in the world (e.g., Fear = 'Seeing' danger), which can happen even if you know better (illusions).
  3.  **Feelings or Bodily States:** Emotions are the internal sensation or the physical change itself (e.g., Fear = The racing heart or the qualia of dread).
  4.  **Appraisal Views:** Emotions are unconscious evaluations that trigger responses. You don't need to consciously judge or feel deeply; the system just appraises the threat.
  5.  **States of Being Ready to Act:** Emotions are urges to do something (e.g., Fear = The readiness to flee).
  6.  **Component Package:** Emotions are not one thing but a collection of parts (feeling, judgement, physiology, action). All are needed for the 'full' emotion.
  7.  **Evolutionary Programmes:** Emotions are innate, discrete biological circuits (like Basic Emotions). They are hardwired and fire regardless of context.
  8.  **Pragmatist / Pluralist:** 'Emotion' is not a natural kind. It is a useful label we apply to different things in different contexts. There is no single truth to find.

  ---

  ### Scoring Key & Analysis

  #### The Mapping
  Match your Part 1 code (e.g., ABA) to the Leaf below.

  *   **AAA** $\rightarrow$ **Evolutionary Programmes**
      *   *Why:* You count the phobia, the numbness (as a dampened programme), and the fiction/printer rage as valid outputs of the biological system. The hardware is firing; that is enough.
  *   **AAB** $\rightarrow$ **States of Being Ready to Act**
      *   *Why:* You count the phobia (urge to flee) and the numbness (crying is a social action signal), but reject the printer/fiction (no real action can be taken against them).
  *   **ABA** $\rightarrow$ **Feelings/Bodily States** OR **States of Being Ready to Act**
      *   *Why:* You prioritise the internal feeling or the urge. The phobia counts (feeling/urge present). Sam does not (feeling/urge absent). Fiction counts (feeling/urge present).
      *   *Note:* This quiz cannot reliably distinguish between **Feelings** and **Action Readiness**. Both prioritise the 'hot' internal state over the 'cold' judgement. See *Indistinguishable Leaves* below.
  *   **ABB** $\rightarrow$ **Perceptions of Value**
      *   *Why:* You accept the phobia (perceptual illusion is still perception). You reject Sam (he is 'blind' to the value). You reject fiction (there is no real value there to perceive).
  *   **BAB** $\rightarrow$ **Evaluative Judgements**
      *   *Why:* You reject the phobia (judgement says 'safe'). You accept Sam (judgement says 'sad'). You reject fiction (no real object to judge).
  *   **CAA** $\rightarrow$ **Appraisal Views**
      *   *Why:* You are cautious about the phobia (unconscious appraisal might remain). You accept Sam (unconscious appraisal of loss remains). You accept fiction/printer (system appraises them as 'bad').
  *   **CCB** $\rightarrow$ **Pragmatist / Pluralist**
      *   *Why:* You refuse to give a hard 'Yes' or 'No' to the edge cases, depending on context, but generally lean towards 'No' for fiction as it lacks a real-world use.
  *   **CCC** $\rightarrow$ **Component Package**
      *   *Why:* You feel that in all three cases, something is missing. The phobia lacks cognition; Sam lacks feeling; the fiction lacks a real object. None are 'full' emotions.

  #### Empty Combos
  There are 27 possible three-letter combinations ($3 \times 3 \times 3$). Only 8 are assigned above. Here are eight notable **empty combos** that nobody occupies, and why:

  1.  **BBB (The Hard Eliminativist):** Rejects all three as emotions.
      *   *Status:* **Unattractive.** This implies emotions almost never happen outside of perfect laboratory conditions. It makes the word 'emotion' useless for daily life.
  2.  **BBC:** Rejects Phobia and Sam, depends on Fiction.
      *   *Status:* **Incoherent.** Why would fiction be *more* likely to be an emotion than a real-life phobia or grief?
  3.  **BBA:** Rejects Phobia and Sam, accepts Fiction.
      *   *Status:* **Unexplored.** This would mean only 'pretend' emotions count, but real biological or cognitive ones don't.
  4.  **BCA:** Rejects Phobia, Depends on Sam, accepts Fiction.
      *   *Status:* **Incoherent.** Similar to BBC; privileges fiction over physiological reality.
  5.  **CAB:** Depends on Phobia, Accepts Sam, Rejects Fiction.
      *   *Status:* **Unexplored.** Close to Appraisal, but Appraisal usually accepts Fiction (Q3) as a system output.
  6.  **CBC:** Depends on Phobia, Rejects Sam, Depends on Fiction.
      *   *Status:* **Unattractive.** Too much uncertainty. A theory should explain *why* Sam is or isn't grieving, not shrug.
  7.  **CCA:** Depends on Phobia, Depends on Sam, Accepts Fiction.
      *   *Status:* **Unexplored.** A version of Pluralism that is overly generous to fiction.
  8.  **AC C:** Accepts Phobia, Rejects Sam, Depends on Fiction.
      *   *Status:* **Unexplored.** Close to Somatic, but Somatic theories usually accept Fiction (Q3) as a feeling state.

  #### Indistinguishable Leaves
  **Feelings/Bodily States** and **States of Being Ready to Act** both map to **ABA**.
  *   **Why:** In Q1 (Phobia), both have feeling and action. In Q2 (Sam), both are absent (no felt ache, no urge to act, only social crying). In Q3 (Fiction), both are present (you feel the grief, you feel the urge to hit the printer).
  *   **The Extra Question:** To separate them, ask: *"If you were paralysed and could not move a muscle, but still felt the terror, would you still be afraid?"*
      *   **Feeling View:** Yes.
      *   **Action View:** No (or "It is a diminished fear").
      *   *Why this is ugly:* It forces a choice between a definition and a physical impossibility.

  #### Underdetermined Questions
  **Question 1 (The Safe Spider)** is underdetermined.
  *   **Why:** **Evolutionary**, **Feeling**, **Action**, and **Perceptual** views all tend to answer **A**.
  *   **Diagnostic Failure:** Because four distinct theories agree that the phobia counts as an emotion, this question cannot tell them apart. It only separates them from the **Judgement** view (which says B). To fix this, one would need to ask about the *content* of the fear, not just its existence.

