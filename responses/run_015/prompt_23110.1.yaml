          *   Implications for whether pragmatist truth remains an *epistemic* notion.
      *   **Format:** Essay.

  2.  **Deconstruct the Philosophical Landscape:**
      *   *Peirce:* Truth is the representational content of the belief destined to be agreed upon by the community of inquirers in the indefinite long run. It's realist, communal, and future-oriented. Truth is independent of what you or I think *now*.
      *   *James:* Truth is what proves itself to be good in the way of belief. "The true is only the expedient in our way of thinking." Truth *happens* to an idea. It becomes true, is *made* true by events.
      *   *The Tension:* Peirce famously distanced himself from James, fearing subjectivism and the "will to believe." Peirce saw truth as a limit concept (regulative ideal); James saw it as a process in the present.
      *   *The "Deflatory Gloss" Reading:* James isn't defining truth *ontologically*; he's giving a rule for *identifying* it. If so, Peirce and James agree on the nature (correspondence/realist) but differ on how we spot it.
      *   *The "Substantive Rival" Reading:* James is redefining truth *as* utility/satisfaction. Truth isn't a static relation; it's a verification process. This clashes with Peirce's realism.

  3.  **Formulate a Thesis:**
      *   *Option A (Deflatory):* James is just being psychological. Peirce is the real metaphysician. (Too easy, ignores James's metaphysical commitments in *Pragmatism* and *Meaning of Truth*).
      *   *Option B (Substantive):* James offers a radically different ontology of truth. (Stronger, but risks making James a relativist, which he denied).
      *   *Selected Thesis:* James offers a *substantive* rival, but not a relativist one. He shifts the locus of truth from a *telos* (Peirce) to a *process* (verificationism). However, this shift ultimately undermines the objectivity required for a robust philosophy of science, suggesting Peirce's account is the only one that preserves truth as a genuinely epistemic (rather than merely psychological or instrumental) norm.
      *   *Refinement:* I need to argue that James's account *cannot* be merely deflatory because his metaphysics of "pure experience" and the plasticity of reality require truth to be mutable. Therefore, they are rivals. But I must conclude on which one holds up better for the philosophy of science context. Peirce wins on objectivity, but James wins on the phenomenology of inquiry. Wait, the prompt asks me to defend a conclusion about whether it's a rival or gloss *and* what that implies for epistemic status.
      *   *Decision:* I will argue that James's account is a **substantive rival**, not a gloss. However, this substantiveness comes at the cost of objectivity, rendering Jamesian truth *less* epistemic and more *instrumental*. Peirce's account preserves the epistemic normativity required for science.

  4.  **Drafting - Section by Section:**

      *   **Introduction:** Set the stage. The Peirce-James split is the original sin of pragmatism. State the thesis clearly: James is not merely offering a criterion; he is offering a competing ontology of truth. This makes his account substantive but vulnerable to the charge of subjectivism, whereas Peirce's "final opinion" retains the objective anchor necessary for truth to remain a robust epistemic notion.
      *   **The Deflatory Reading (The Criterion View):** Explain why one might think they agree. Both reject correspondence as static mirroring. Both link truth to successful inquiry. Cite the "meaning of truth" lectures where James tries to reassure critics. If truth is just "what works in the long run," James collapses into Peirce.
      *   **The Substantive Reading (The Ontology View):** Why the deflatory reading fails. James's insistence that truth *happens*. The role of the "cash-value." The plasticity of reality (the "block universe" critique). For James, the truth *changes* as the context changes. This isn't just how we find truth; it's what truth *is*.
      *   **The Objectivity Objection:** Address the core worry. If truth happens to an idea based on its "workability," isn't that subjective? James's defense: "Workability" includes fitting with old truths and sensory constraints. It's not solipsistic. *Counter-argument:* It's still anchored in the *satisfaction* of the believer, not the independence of the object. Peirce's "external permanency" is missing.
      *   **Implications for Epistemic Status:** If James is right, truth is instrumental success. If Peirce is right, truth is representational accuracy (eventually). For a philosophy of science, we need the latter. Science aims at how the world *is*, not just what helps us navigate it *now*. Therefore, James's substantiveness undermines the epistemic normativity of truth.
      *   **Conclusion:** Reiterate the verdict. James is a rival, not a gloss. But Peirce is the better guide for science because he preserves the distinction between "believing successfully" and "believing truly."

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did I avoid the "both-sides" note? Yes, I need to be decisive.
      *   *Check:* Am I addressing the PhD level? Need to use specific terminology (e.g., *verifiability*, *concreteness*, *indefinite community*, *regulative ideal*).
      *   *Nuance:* Be careful not to caricature James as a "truth is whatever I want" relativist. He explicitly denies this. The critique must be more subtle: it's about the *metaphysical status* of the verification process.
      *   *Focus:* Keep the philosophy of science angle in mind. Peirce is the scientist's pragmatist; James is the psychologist's/humanist's pragmatist.

  6.  **Final Polish:**
      *   Ensure the transition from the "gloss vs. rival" debate to the "epistemic status" conclusion is smooth.
      *   Check citations/references (implicit or explicit) to *How to Make Our Ideas Clear*, *The Fixation of Belief*, *Pragmatism*, *The Meaning of Truth*.
      *   Strengthen the final verdict: James's theory is a theory of *warranted assertibility* (Dewey later), not truth *simpliciter*. Peirce keeps truth distinct from justification.

  7.  **Final Review against constraints:**
