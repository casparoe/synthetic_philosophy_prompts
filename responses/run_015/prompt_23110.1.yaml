answer: |-
  **Title:** The Happening of Truth: Substantive Rivalry and the Epistemic Fate of Pragmatism

  The schism between Charles Sanders Peirce and William James constitutes the original fracture in classical pragmatism, a divergence that continues to dictate the terms of contemporary debate regarding the normativity of truth. For the philosopher of science, the stakes are particularly high. If pragmatism is to offer a viable alternative to correspondence realism or deflationism, it must articulate a conception of truth that preserves objectivity without retreating into metaphysical mysticism. The central interpretive puzzle lies in William James's assertion that "truth *happens* to an idea." Is this a substantive ontological claim that rivals Peirce's account of truth as the "final opinion" of the indefinite community of inquirers? Or is it merely a deflatory gloss—a psychological description of how we recognize the truth that Peirce has already defined metaphysically?

  To treat James's account as merely deflatory is to domesticate his radicalism for the sake of system-building. A close examination of James's texts reveals that he is offering a substantive rival to Peirce, one that redefines truth as a process of verification rather than a limit of inquiry. However, while James's account captures the phenomenology of scientific practice more vividly than Peirce's, this substantiveness comes at a steep cost. By tethering truth to the temporal satisfaction of the inquirer, James undermines the objectivity required for truth to function as a robust epistemic norm. Peirce's account, though more abstract, successfully preserves the distinction between *warranted assertibility* and *truth*, thereby securing pragmatism's status as a philosophy of science rather than merely a philosophy of psychological coping.

  **The Case for the Deflatory Reading**

  The argument for reading James as providing a deflatory gloss rests on the shared pragmatist rejection of static correspondence. Both Peirce and James agree that truth cannot be a inert copy of reality, a "stamp of absolute nature" on a proposition. In *How to Make Our Ideas Clear*, Peirce defines truth as the representation of the real, where the real is that which is represented in the ultimate consensus of investigators. James, in *Pragmatism*, similarly argues that true ideas are those we can assimilate, validate, corroborate, and verify.

  Proponents of the deflatory reading argue that when James says truth is "the expedient in our way of thinking," he is not defining the *essence* of truth but rather its *cash-value*—its practical significance for a living agent. On this reading, Peirce and James are describing the same phenomenon from different angles: Peirce from the perspective of the ideal limit (the ontological anchor), and James from the perspective of the present moment (the epistemic criterion). If James is merely saying, "For a human being, a true belief feels like a successful tool," then he is not contradicting Peirce's claim that truth is independent of what any finite number of people think. He is simply adding that we have no access to this truth except through its successful working. This reading saves pragmatism from the charge of relativism by suggesting that "what works" converges, in the long run, on Peirce's "final opinion."

  **The Substantive Rivalry**

  However, the deflatory reading collapses under the weight of James's specific metaphysical commitments. James does not merely say that truth is *known* through verification; he insists that truth is *made* by verification. In *The Meaning of Truth*, James writes, "Any idea that helps us to deal... with reality... is true enough." The crucial divergence lies in the temporal status of truth. For Peirce, truth is a regulative ideal located in the indefinite future; it is destiny. A belief is not true now because it works now; it is true now because it aligns with where inquiry is destined to end.

  For James, truth is mutable. He explicitly rejects the "block universe" where truths are eternal. If the context changes, the "workability" of an idea may change, and thus its truth-value may shift. When James claims that truth "happens," he is asserting an ontology of process. The verification process does not merely reveal a pre-existing relation; it consummates the relation. This is not a gloss on Peirce; it is a rejection of Peirce's realism. For Peirce, the real is that which resists our will; for James, the real is plastic enough to be shaped by the "will to believe" in certain margins. Therefore, James is offering a substantive theory: truth is not a static property of propositions waiting to be found, but a functional property acquired through the act of successful leading.

  **The Objectivity Objection and James's Defense**

  The immediate consequence of this substantive reading is the threat of subjectivism. If truth happens to an idea based on its utility, does truth not become a property of the inquirer's experience rather than the object? James anticipates this. He argues that "workability" is not mere subjective whim; an idea must agree with "the whole body of funded truths" and sensory constraints. We cannot simply believe the wall is made of jelly and walk through it.

  Yet, this defense is insufficient to secure the objectivity required for a philosophy of science. James's constraints are still anchored in the *satisfaction* of the believer. The "fit" is between the idea and the believer's stream of experience. Peirce, conversely, anchors truth in the "external permanency" of the object itself, independent of what you or I think. Peirce's "final opinion" is objective precisely because it is divorced from the finite limitations of current inquirers. It posits a reality that corrects us, rather than a reality that we correct through successful navigation.

  James's account makes truth epistemic in the sense of *justification*, but it fails to make truth epistemic in the sense of *normativity*. In James's framework, if a belief stops working, it ceases to be true. In Peirce's framework, if a belief stops working, it was likely never true (or our understanding of the conditions was flawed), but the truth itself remains the target. James conflates the *sign* of truth (successful prediction/coordination) with the *nature* of truth. By doing so, he risks reducing truth to warranted assertibility. While this is useful for psychology, it is disastrous for science, which requires the postulate that there are facts about the world that remain true even if they currently offer no "cash value" to any inquirer (e.g., the state of a distant exoplanet before we have the technology to observe it).

  **Verdict: The Epistemic Status of Pragmatist Truth**

  We must therefore conclude that James offers a substantive rival to Peirce, not a deflatory gloss. But this substantiveness renders James's account inadequate for sustaining truth as a robust epistemic notion in the context of scientific inquiry. James provides a phenomenology of *validation*, while Peirce provides a logic of *discovery* and *representation*.

  If we accept James's substantive account, pragmatist truth ceases to be an epistemic norm regarding the way the world *is* and becomes an instrumental norm regarding how we *cope*. It becomes a theory of rationality, not truth. Peirce's account, by contrast, retains the critical distinction between the community's current consensus and the way things really are. By positing the "final opinion" as a limit concept, Peirce acknowledges that we may be wrong even when our ideas "work" perfectly for the present moment. This fallibilism is the bedrock of scientific progress. James's plasticity risks dogmatism; if truth is what works now, the incentive to push beyond current utility is diminished.

  Therefore, for the philosophy of science, Peirce's account is the only one that preserves the objective core of truth while maintaining the pragmatist insight that meaning is tied to practical consequences. James's contribution is vital for understanding the human *interest* in truth, but Peirce's is necessary for understanding truth's *authority*. To read James as merely offering a criterion is to ignore his metaphysical commitments; to accept his metaphysical commitments is to surrender the objectivity that makes science possible. Pragmatist truth remains a genuinely epistemic notion only if we follow Peirce in treating truth as a destination that governs our journey, rather than, with James, merely the smoothness of the road beneath our feet.
