          *   If the agent rewrites itself to $T'$, the *next* iteration faces the same problem.
          *   Infinite regress: $T_0 \subset T_1 \subset T_2 \dots$. You run out of "logical strength" eventually (ordinal limits). You can't have an infinite chain of self-extensions where each trusts the previous.
      *   *Part 3: Design Implications:*
