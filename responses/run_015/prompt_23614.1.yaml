          *   *Architecture:* **Immutable Core.** The proof checker must be outside the modification boundary.
          *   *Analogy:* Operating System Kernel vs. User Space. The agent is user space. The verifier is the kernel.
          *   *Nuance:* You can verify *code* using the checker. You cannot verify the *checker* using the checker.
          *   *Recommendation:* Build on an existing proof assistant (Coq, Lean, Isabelle). Do not let the AI rewrite the kernel. Let the AI generate proofs *for* the kernel to check.

  6.  **Refining the Tone:**
      *   Keep it rigorous but accessible to a SWE.
