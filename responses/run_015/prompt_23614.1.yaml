      *   *Is G2 just a special case?* Yes, let $\phi = \bot$. $\text{Prov}(\bot) \to \bot$ is $\neg \text{Prov}(\bot)$, which is $\text{Con}(T)$. So Löb says if $T \vdash \text{Con}(T)$, then $T \vdash \bot$. So if $T$ is consistent, $T \nvdash \text{Con}(T)$.
      *   *Practical advice:* Emphasize that "self-modifying the proof checker" is almost certainly a bad idea for safety-critical systems. The "Trusted Computing Base" should be minimal and static.

