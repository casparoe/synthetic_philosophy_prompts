      *   Focus on the *conceptual issue*: The tension between **Local Meaning** (meaning at time T1) and **Global Meaning** (meaning of the whole life).
      *   *The Issue:* **The Incommensurability of Local and Global Valuation.**
      *   Standard theories assume Local Meaning contributes positively to Global Meaning.
      *   In this pattern, Local Meaning (Phase 1) contributes *negatively* to Global Meaning (as judged by Phase 2), even if it felt meaningful locally.
      *   This breaks the "Summation" model.

