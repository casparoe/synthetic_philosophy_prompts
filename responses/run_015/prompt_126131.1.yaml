      *   *Narrative Coherence (The "Whole Life" view):* Most theories want a life to tell a story.
          *   *Problem:* This pattern creates an *incoherent* story. It's like writing a sentence and then deliberately writing a negation of that sentence, not to form a complex thought, but to erase the first one.

