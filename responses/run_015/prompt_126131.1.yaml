      *   *Why it breaks the framework:* The framework asks "How much meaning did this life contain?" It expects a sum. This life suggests meaning can be *subtracted*. If the second half succeeds in canceling the first, did the first half ever possess meaning?
      *   *Conclusion:* This forces a redefinition of coherence from "unity of purpose" to "integrity of negation."

