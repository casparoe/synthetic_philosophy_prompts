  *My task:* Address this. If the button fails, no light. If the promise is broken, the promise *existed*. The analogy suggests that if felicity conditions aren't met, *no act occurred*. But for abuses (insincerity), an act *did* occur. The button analogy cannot model "successful act, bad follow-through" vs "failed act." It only models "work/don't work."

