      *   **Function:** Activates an institutional mechanism (circuit closes) rather than describing reality (matching the world).
      *   **Purpose:** Defends Austin's claim that performatives lack truth-values and are governed by felicity conditions.
      *   **Tasks:**
          1.  Provide a correspondence table (Button, User, Wiring, Power Supply, Failure).
