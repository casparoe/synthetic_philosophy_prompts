  # Joint Statement on the Granularity of Moral Character

  **Preamble**

  The undersigned representatives of global-trait virtue ethics and the situationist critique hereby issue this joint statement following a period of adversarial collaboration. Our objective was not to dissolve our differences but to locate the precise empirical and normative stakes of our dispute. We agree that the central question is not whether humans are broadly "good" or "bad," but whether stable moral dispositions are best modeled as cross-situational global traits (e.g., honesty or compassion as unitary characters) or as locally indexed moral expertise (e.g., domain-specific skills in resource fairness, stranger compassion, or promise-keeping). We adopt this "local moral expertise" framing as the productive niche for resolving our disagreement. This document records our points of convergence and delineates our remaining divergences with exactitude, committing both camps to a shared path of inquiry.

  ## Part I: Agreed Claims

  The undersigned parties endorse the following six claims without reservation:

  1.  **Limitations of Self-Report:** Traditional self-report personality inventories demonstrate poor predictive validity for specific moral behaviors in concrete situations. Both camps agree that reliance on global self-assessments alone is insufficient for modeling moral action.
  2.  **Situational Variance:** Situational variables—such as time pressure, social visibility, ambient environmental cues, and authority presence—explain substantial variance in behavior that global-trait scores fail to absorb. Ignoring these variables constitutes a methodological error for both descriptive and normative accounts.
  3.  **Prediction and Explanation:** Predictive failure does not automatically entail explanatory irrelevance, and explanatory relevance does not automatically entail predictive success. A trait may explain a pattern of behavior over time without predicting specific instances with high accuracy, and vice versa.
  4.  **Coherence of Local Traits:** The concept of "local traits" or domain-specific moral skills is conceptually coherent and empirically distinguishable from global character. It is meaningful to investigate whether an individual possesses expertise in one moral domain (e.g., fairness) without possessing it in another (e.g., compassion).
  5.  **Normative Mediation:** Purely descriptive psychology cannot by itself settle normative questions in virtue ethics without mediation by an account of moral development, habituation, or education. Empirical data regarding human consistency must be interpreted through a normative framework to yield ethical conclusions.
  6.  **Shared Empirical Protocol:** Both sides commit to a shared empirical protocol to generate data bearing on this dispute. This protocol involves ambulatory experience-sampling of moral micro-decisions across three domains (resource fairness, stranger-directed compassion, and promise-keeping), paired with peer-nomination ratings and independent behavioral coding. Both parties agree to treat the resulting data as relevant to the validity of global versus local models.

  ## Part II: Table of Disagreements

  The following table delineates the specific cruxes remaining between the parties. For each crux, the positions are formulated to be recognizable to proponents of each view. The table records the agreed method of inquiry, the predicted outcomes, and the conditions under which each side would revise its central thesis.

  | Crux | Formulation accepted by virtue-ethics defenders | Formulation accepted by situationists | Agreed case, argument, or empirical result that bears on the crux | Predicted outcome by virtue-ethics defenders | Predicted outcome by situationists |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **A. Latent Structure of Peer Ratings** | Peer nominations of moral character across distinct domains should correlate strongly, indicating a single latent "global moral character" factor that manifests locally. | Peer nominations across distinct domains should correlate weakly, indicating three largely independent domain-specific factors with no strong global underlying trait. | **Empirical Test:** Factor analysis of peer-nomination data collected via the shared protocol across the three target domains. | **Prediction:** A single dominant factor will emerge explaining most variance.<br>**Revision Condition:** We would revise if factor analysis shows orthogonal domain-specific factors with negligible cross-loading. | **Prediction:** Distinct factors will emerge for fairness, compassion, and promise-keeping with low inter-correlation.<br>**Revision Condition:** We would revise if a single global factor explains the majority of covariance across domains. |
  | **B. Transfer of Moral Training** | Targeted training in one moral domain (e.g., structured compassion exercises) produces measurable behavioral transfer to an untrained domain (e.g., fairness in resource allocation) because virtue cultivates a general practical wisdom. | Targeted training remains locally confined; improvement in compassion exercises will not measurably improve fairness in resource allocation because moral competence is context-bound. | **Empirical Test:** Longitudinal intervention study measuring behavioral outcomes in untrained domains following domain-specific moral skills training. | **Prediction:** Significant positive transfer effects will be observed across domains.<br>**Revision Condition:** We would revise if training effects remain strictly isolated to the trained domain with zero spillover. | **Prediction:** No significant transfer effects will be observed; improvements will be task-specific.<br>**Revision Condition:** We would revise if robust transfer is demonstrated across conceptually distinct moral domains. |
  | **C. Consistency of Moral Experts** | Individuals rated as "moral experts" by peers exhibit lower cross-situational variability in moral behavior compared to matched controls, reflecting stable internal dispositions. | Observed consistency among "moral experts" is largely an artifact of self-selection into predictable social environments that minimize moral conflict and temptation. | **Empirical Test:** Comparison of behavioral variability between peer-nominated experts and controls across high-pressure and low-pressure situational variants. | **Prediction:** Experts will maintain high moral performance even in high-pressure, unfamiliar situations.<br>**Revision Condition:** We would revise if experts perform no better than controls when situational support is removed. | **Prediction:** Experts will show performance degradation comparable to controls when removed from their native supportive contexts.<br>**Revision Condition:** We would revise if experts demonstrate resilience against situational pressures that degrade control performance. |
  | **D. Normative Grounding** | Normative virtue ethics requires the presupposition of global traits to ground practices of moral education, praise, and blame; local virtues cannot sustain the unity of the moral agent. | A "local-virtue" framework can preserve normative practices of education, praise, and blame without requiring cross-domain consistency; global traits are not necessary for moral responsibility. | **Argumentative Case:** Philosophical analysis of whether moral responsibility and education logically depend on cross-situational consistency or merely on reliable local responsiveness. | **Prediction:** Local-virtue frameworks will fail to account for the integrity of the moral agent required for genuine praise or blame.<br>**Revision Condition:** We would revise if a coherent normative account is demonstrated that sustains responsibility without global traits. | **Prediction:** Local-virtue frameworks will successfully ground normative practices without metaphysical commitment to global consistency.<br>**Revision Condition:** We would revise if it is proven that local virtues cannot support coherent practices of moral education or accountability. |

  **Signatories**

