answer: |-
  ### The Loop-Check Procedure

  This procedure is designed for a 2-hour committee meeting. It treats diagnostic criteria as **interactive tools** rather than static measurements. Its goal is not to find "truth," but to ensure **stability**: that the criterion measures the same thing in Year 2 as it did in Year 1, despite patients and clinicians learning how the tool works.

  **Instructions for the Chair:**
  1.  Read the candidate criterion aloud.
  2.  Ask the five questions below in order.
  3.  Record the consensus answer.
  4.  Apply the **Stop Rules** immediately if triggered.
  5.  Mark any **Value Judgements** explicitly in the minutes.

  ---

  #### Question 1: The Google Test (Transparency & Gameability)
  *Ask:* "If a motivated patient read this criterion online ten minutes before their appointment, could they alter their answers or behavior to satisfy (or avoid) it without their underlying condition changing?"
  *   **Sufficient Answer:** A concrete example of how this would be done (e.g., "They would exaggerate symptom X," or "They would hide symptom Y").
  *   **Stop Rule:** If the answer is **Yes** and there is no way to verify the answer independently (see Q2), flag for **Redesign**.
  *   **Value Marker:** This question highlights the tension between *transparency* (patient rights to know) and *validity* (risk of coaching).

  #### Question 2: The Independent Anchor (Verification)
  *Ask:* "Is there any source of evidence for this criterion that the patient cannot control and that does not rely on the patient's understanding of this specific wording?"
  *   **Sufficient Answer:** Identification of a specific data source (e.g., "School records," "Partner interview," "Medication fill history," "Clinician observation of affect").
  *   **Stop Rule:** If the answer is **No** (i.e., the criterion relies 100% on self-report of internal states that are gameable), flag for **Redesign**.
  *   **Value Marker:** This determines how much we trust patient self-knowledge versus external verification.

  #### Question 3: The Incentive Structure (Behavioral Reward)
  *Ask:* "Once this criterion is known, what specific behavior does it reward or punish in the waiting room or during the interview?"
  *   **Sufficient Answer:** A description of the strategic behavior (e.g., "It rewards listing symptoms," "It punishes admitting to coping well," "It rewards silence about medical concerns").
  *   **Stop Rule:** If the rewarded behavior is **harmful to treatment** (e.g., discourages help-seeking, encourages malingering for resources), flag for **Redesign**.

  #### Question 4: The Drift Detector (Monitoring)
  *Ask:* "At the next two-year revision, what specific metric or observation will tell us this criterion has started to mean something different than it does today?"
  *   **Sufficient Answer:** A measurable signal (e.g., "A 20% increase in positive screens without a corresponding increase in service utilization," "Clinician feedback that patients are using specific buzzwords").
  *   **Stop Rule:** If the committee cannot name a signal, the criterion is **Unmonitorable**. Proceed only if low risk.

  #### Question 5: The Cost of Opacity (Ethical Trade-off)
  *Ask:* "If we rewrite this to be less gameable, does it become too confusing for patients or too adversarial for clinicians?"
  *   **Sufficient Answer:** A consensus on whether the complexity is manageable within a 45-minute slot.
  *   **Value Marker:** **This is the final ethical vote.** It asks: Who pays for diagnostic purity? The patient (confusion/distrust) or the system (noise/inefficiency)?

  ---

  ### Analysis of Distinctions

  You asked which distinctions are essential and which can be dropped for your setting.

  1.  **Essential: Transparency/Gameability (Q1).** You cannot manage looping if you pretend the criteria are secret. In the internet age, they are not. You must assume the patient knows the rule.
  2.  **Essential: Independent Anchor (Q2).** This is the only mechanical break in the loop. If a criterion relies entirely on the patient's report of the very thing being classified, looping is guaranteed.
  3.  **Essential: Incentive Structure (Q3).** This predicts the *direction* of the drift. Will your prevalence rates go up because people are sicker, or because they learned the password?
  4.  **Droppable: "Realness" of the Kind.** Do not ask "Is ADHD real?" Your committee cannot answer that. Ask "Is this classification stable enough to allocate resources?"
  5.  **Droppable: Clinician Error.** Hacking's point is that looping happens *without* error. Do not waste time asking "Will clinicians misuse this?" Ask "Will clinicians use this correctly, and will the patient's reaction change what 'correctly' means?"

  **Where Science Ends and Values Begin:**
  *   **Q1 and Q2** are technical/empirical. (Can it be gamed? Can we check?)
  *   **Q5** is purely ethical. It forces you to decide if you are willing to withhold information from patients to preserve test validity. In a community mental health setting, **trust is a clinical tool.** If you choose opacity to stop looping, you may damage the therapeutic alliance. This must be a conscious vote, not a default assumption.

  ---

  ### Application to Draft Criteria

  Here is the procedure run on your three specific candidates.

  #### 1. Self-Report Symptom Count for Adult ADHD (Waiting Room)
  *   **Q1 (Google Test):** **Yes.** Patients frequently arrive having completed online screenings (e.g., ASRS) and know the specific symptoms (focus, forgetfulness, restlessness). They can easily endorse these to access stimulants or accommodations.
  *   **Q2 (Independent Anchor):** **No.** Completed in the waiting room prior to interview. No collateral, no observation, no record review at this stage.
  *   **Q3 (Incentive):** Rewards symptom endorsement. Punishes nuance (e.g., "I'm only distracted when bored").
  *   **Q4 (Drift Detector):** Track the ratio of positive screens to confirmed diagnoses. If screens go up but diagnoses stay flat, the criterion has drifted.
  *   **Q5 (Cost of Opacity):** Making this less transparent (e.g., embedding validity scales) is feasible.
  *   **Verdict:** **FAIL. Redesign Required.**
      *   *Reasoning:* This criterion fails the Stop Rule at Q2. It is a purely self-report measure of a highly gameable condition, administered before any clinical relationship is established. It invites the loop without a brake.
      *   *Recommendation:* Do not use as a gatekeeper. Use only as a conversation starter. Add a validity scale (e.g., "I never make mistakes") or require collateral history for a positive screen.

  #### 2. Generic Gate: Clinically Significant Distress or Functional Impairment
  *   **Q1 (Google Test):** **Yes.** Patients know they must be "sick enough" to qualify. They learn to frame problems as "I can't work" rather than "I am unhappy."
  *   **Q2 (Independent Anchor):** **Partial.** Clinician observation of function during the interview counts. Employment status or housing stability records can verify impairment.
  *   **Q3 (Incentive):** Rewards articulating inability to function. May punish resilience (patients may downplay coping mechanisms to ensure access to care).
  *   **Q4 (Drift Detector):** Monitor average GAF/WHODAS scores at intake over time.
  *   **Q5 (Cost of Opacity):** Low. The concept is broad enough that obscuring it doesn't help.
  *   **Verdict:** **PASS with Monitoring.**
      *   *Reasoning:* While gameable, the "Independent Anchor" of functional reality (do they have a job? are they housed?) provides a check. However, the committee must acknowledge this criterion incentivizes patients to present as more impaired than they might feel to secure resources. This is a resource-allocation decision, not just a medical one.

  #### 3. Clinician Judgment: Preoccupation with Illness Disproportionate to Medical Findings
  *   **Q1 (Google Test):** **Yes.** Patients with health anxiety often know this label. They may avoid reporting symptoms to avoid being labeled "disproportionate."
  *   **Q2 (Independent Anchor):** **No.** "Disproportionate" is a judgment call between the patient's report and the clinician's interpretation of medical records. Both are interpretable.
  *   **Q3 (Incentive):** Rewards silence. Patients learn that if medical tests are normal, they should not complain about symptoms, or they will be diagnosed with a mental health condition they don't want.
  *   **Q4 (Drift Detector):** Drop in referrals from primary care. Increase in patients presenting only when tests are abnormal.
  *   **Q5 (Cost of Opacity):** High. Hiding this criterion undermines informed consent.
  *   **Verdict:** **FAIL. Redesign Required.**
      *   *Reasoning:* This criterion creates a **perverse incentive**. It punishes help-seeking behavior in the exact population (health anxious) it aims to treat. It relies on a subjective judgment ("disproportionate") that patients can manipulate by withholding information.
      *   *Recommendation:* Reframe to focus on *impact* rather than *proportionality*. E.g., "Does concern about health interfere with daily life?" regardless of medical findings. This reduces the incentive to hide symptoms.

  ---

  ### What This Procedure Cannot Tell You

  You must record these limitations in your committee minutes to manage expectations.

  **1. Distortion vs. Improvement.**
  The Loop-Check identifies *change*, not *value*. If patients read the ADHD criteria and realize, "Oh, that explains my life," and they start organizing their desks better, that is a looping effect. The criterion is now selecting for "people who read the criteria and organized their desks." Is that bad? No. It might be therapeutic. The procedure flags the drift, but it cannot tell you if the drift is clinically beneficial. That requires clinical judgment, not protocol.

  **2. The Reality of the Kind.**
  This procedure assumes the categories (ADHD, Illness Anxiety) are useful containers. It does not and cannot tell you if ADHD is a "natural kind" like gold or water. Hacking argues human kinds are never natural kinds. If your committee spends time debating whether ADHD is "real," you have left the scope of this procedure. You are deciding whether the *classification* is stable enough to justify the *intervention*, not whether the disease exists independently of the classification.

  **3. The Ethical Cost of Stability.**
  Finally, the procedure cannot calculate the moral cost of stopping the loop. If you make the ADHD test harder to game by making it opaque, you may increase patient distrust. If you make the Illness Preoccupation criterion safer by removing "disproportionate," you may over-diagnose valid medical concerns. The procedure highlights these trade-offs (specifically in Q5), but the committee must vote on them as matters of values, not science.
