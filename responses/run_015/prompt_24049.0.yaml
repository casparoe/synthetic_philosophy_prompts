prompt: |-
  So I teach epistemology and the philosophy of probability, and I keep getting the same question from my students, a lot of them med students on the clinical rotation: a test comes back and the report says the finding makes disease A twice as likley as disease B, and they have no idea what to do with that number. They just throw Bayes at it and get it wrong, because most of the time A and B don't exhaust the differntial, and honestly I'm not sure the right update rule is what they think it is when the evidence is a ratio rather than a plain observation.

  I'd like you to write me a decision procedure a clinician can actually run at the bedside in a few minutes when they get evidence phrased as a relative likelihood or a likelihood ratio -- "the scan makes A twice as likely as B," "this marker makes condition C k times more likely," and so on. Ground it in whatever the philosophy of probability actually says about updating on this kind of evidence (the whole Judy Benjamin / conditioning-versus-cross-entropy line of work, whatever of it is genuinely usable by someone who isn't a philosopher), and be honest about which steps are real math and which are judgment calls dressed up as steps.

  The procedure should:
  - lay out the questions to ask in order, and what counts as a sufficient answer to each
  - tell the clinician how to tell when the options being compared actually partition the space (so a plain ratio does the work) versus when they don't (the harder case), and what to do in each
  - say how to bring in the prior, and what to do when the clinician can't get a number for it
  - mark clearly where the procedure has to stop and hand the call to the person, because the question is about values or about what the patient actually cares about rather than about the numbers
  - be runnable in under ten minutes, with a small set of test findings they can apply
  - produce something the clinician can defend to an attending on rounds and explain to a patient in plain language

  Then run it on three findings: (1) a positive test where the disease and its absence are the only two options on the table; (2) a scan that makes one tumor type twice as likely as another, but there are at least three other plausible diagnoses in the differential; and (3) a case where the procedure will land on an answer the clinician will not like -- pick one where the math says to keep a scary diagnosis on the table even though it feels intuitively wrong, and say what the procedure can and can't do there.

  Think very carefully before answering, and respond in the style of an expert who has actually worked through this rather than someone summarizing a textbook. Don't give me a reading list or citations -- I know the literature, I want the procedure.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Epistemology/Philosophy of Probability professor teaching med students (clinical rotation).
      *   **Problem:** Students misapply Bayes' theorem when evidence is given as a *relative likelihood* (e.g., "A is twice as likely as B") rather than a standard likelihood ratio ($P(E|H)/P(E|\neg H)$). They often assume $A$ and $B$ exhaust the space when they don't. They struggle with the "Judy Benjamin" problem (updating on conditional information/ratios rather than hard evidence).
      *   **Goal:** A bedside decision procedure (under 10 mins) for clinicians.
      *   **Requirements:**
          *   Grounded in philosophy of probability (updating on ratios/constraints), but usable.
          *   Distinguish partitioning vs. non-partitioning hypotheses.
          *   Handle priors (including non-numerical ones).
          *   Identify where math stops and values/judgment begin.
          *   Defensible to attendings, explainable to patients.
          *   Run on three specific cases (Binary, Non-exhaustive Differential, Counter-intuitive result).
          *   **Style:** Expert practitioner, not textbook summarizer. No reading lists.

  2.  **Deconstruct the Epistemological Core:**
      *   *The Problem:* Standard Bayesian updating requires $P(E|H)$. Here, the "evidence" is actually a constraint on the *posterior* odds or a likelihood ratio between specific hypotheses, not an event $E$ that occurred.
      *   *Judy Benjamin Problem:* You are told "If $A$, then $B$ is twice as likely as $C$." How do you update $P(A)$? There is no unique solution without further assumptions (like Minimum Cross-Entropy/Maximum Entropy).
      *   *Clinical Reality:* Clinicians don't need the unique philosophical solution; they need a *robust heuristic* that doesn't lead to dangerous errors.
      *   *The "Ratio as Evidence" Trap:* If a report says "Finding $F$ makes $A$ twice as likely as $B$," does it mean $P(F|A)/P(F|B) = 2$? Or does it mean the *posterior* odds $P(A|F)/P(B|F) = 2 \times [P(A)/P(B)]$? Usually, lab reports imply a Likelihood Ratio (LR). But students treat "A is twice as likely as B" as a posterior claim without accounting for the base rate of $A$ vs $B$ vs $C...$
      *   *The Fix:* We need to treat the report as providing a *Likelihood Ratio (LR)* between specific hypotheses, then update the *Odds*, then convert back to Probabilities, explicitly accounting for the "Rest of the World" (the other differential diagnoses).

  3.  **Drafting the Procedure (The "Ratio-Update Protocol"):**
      *   *Step 1: Define the Space.* Are we talking Binary ($H$ vs $\neg H$) or Differential ($H_1, H_2, ... H_n$)?
      *   *Step 2: Interpret the Number.* Is this a Likelihood Ratio (how much the test favors one over the other) or a Posterior Odds claim? (Almost always LR in lab speak, but students hear Posterior).
      *   *Step 3: The "Rest of the World" Check.* If $A$ and $B$ don't sum to 1, where does the probability mass go?
      *   *Step 4: The Update.* Use Odds form of Bayes.
      *   *Step 5: The Stop Rule.* When does utility/values take over?

      *Refining the Epistemology:* The Judy Benjamin problem arises when we update on a conditional probability constraint without knowing the marginal probability of the condition. In clinical terms, if the test says "A is twice as likely as B," it usually means the *likelihood* of the data given A is twice the likelihood of the data given B ($LR_{A,B} = 2$).
      *Crucial distinction:* If the report says "Given this scan, A is twice as likely as B," that is a claim about the *Posterior*. If it says "This marker is twice as common in A as B," that is a *Likelihood Ratio*. Med students confuse these. I need to force them to distinguish.
      *Actually, the prompt says:* "the report says the finding makes disease A twice as likley as disease B." This is ambiguous. It sounds like a Posterior Odds claim ($O_{post} = 2$). But usually, tests provide LRs. Let's assume the students are interpreting a Likelihood Ratio but failing to normalize against the full differential.
      *Better approach:* Treat the "2x" as a Likelihood Ratio ($LR$) between $A$ and $B$. The update rule for non-exhaustive sets requires keeping the "Other" category stable relative to the reference class, or acknowledging we can't update "Other" without more info.
      *Philosophical Grounding:* Minimum Information Principle (Jaynes/Williams). If we learn $A$ is favored over $B$, but learn nothing about $C$, we should update $A$ and $B$ relative to each other, but keep their relationship to $C$ proportional to the prior *unless* the test specifically rules $C$ in/out.
      *Wait, simpler clinical heuristic:* If a test distinguishes A from B, it might not touch C.
      *Let's build the "Relative Odds Update" method.*

  4.  **Developing the Steps:**
      1.  **Identify the Claim:** Is the number an LR or a Posterior Odds? (Crucial distinction).
      2.  **Exhaustiveness Check:** Do A and B cover all possibilities?
      3.  **Prior Estimation:** Get pre-test probabilities.
      4.  **The "Other" Bucket:** If not exhaustive, group non-A/B into "Other".
      5.  **The Calculation:** Update Odds(A:B). Then normalize to get probabilities.
      6.  **The Value Check:** Does the resulting probability cross a treatment threshold?

  5.  **Addressing the "Judy Benjamin" Aspect:**
      *   Strictly speaking, if you only know $P(A|E)/P(B|E) = k$, you cannot determine $P(A|E)$ without knowing $P(E)$.
      *   However, in medicine, "The test makes A twice as likely as B" is usually shorthand for "The Likelihood Ratio $LR_{A,B} = 2$."
      *   If $LR_{A,B} = 2$, then $PostOdds_{A,B} = PriorOdds_{A,B} \times 2$.
      *   The problem is the denominator. If there is a Disease C, does the test affect C?
      *   *Assumption:* If the test is specific to the A/B distinction, $P(E|C)$ is the baseline.
      *   *Procedure:* I will instruct them to treat the "2x" as an LR between the specific hypotheses, and assume the "Other" hypotheses have an LR of 1 (test is uninformative about them) unless stated otherwise. This is the Maximum Entropy move (assume minimal change to what you don't know).

  6.  **Writing the Procedure (Iterative refinement):**
      *   *Tone:* Direct, authoritative, pragmatic. "Here is how you survive rounds."
      *   *Structure:* The Protocol -> The Three Cases.
      *   *Math:* Keep it to Odds. Clinicians hate denominators. Odds are multiplicative.
      *   *Judgment:* Explicitly mark "Stop and Think" points.

  7.  **Running the Cases:**
      *   *Case 1 (Binary):* D vs ~D. Test LR+ = 2. Easy Bayes.
      *   *Case 2 (Non-exhaustive):* Tumor A vs Tumor B (2:1). But also C, D, E.
          *   Prior: A(10%), B(10%), Others(80%).
          *   Update: A vs B odds double. Others stay same relative to the *average*? No, if LR is specific to A vs B, then $P(E|Others)$ is the reference.
          *   Actually, if the report says "Finding makes A 2x likely as B", it implies $P(E|A) = 2 \times P(E|B)$.
          *   We need to normalize.
          *   Let's stick to the Odds form. $O(A:B)_{post} = O(A:B)_{prior} \times 2$.
          *   Then we need to fit them back into the total probability space. This requires an assumption about "Other". The standard assumption (MinEnt) is that the test provides no info on "Other" relative to the average of A/B? No, simpler: The test is neutral for "Other". $LR_{Other} = 1$.
          *   So, update A and B, keep Other's likelihood constant. Renormalize.
      *   *Case 3 (Counter-intuitive):* Rare disease, high LR, but still low probability. Or, a test that increases probability of a deadly disease but not enough to treat, yet creates anxiety.
          *   Let's go with the "Zebra" problem. A rare disease gets a 5x boost. It's still rare. But the patient wants it ruled out. The math says "ignore it," the values say "test more."
          *   Or better: A test that makes a fatal disease more likely than a benign one, but the treatment for the fatal one is toxic. The math says "It's the fatal one," the decision says "Treat for benign until proven otherwise."
          *   Let's choose: Sepsis vs. Viral. Test favors Sepsis 3:1. Prior was low. Posterior Sepsis is 15%. Threshold for antibiotics is 20%. Math says wait. Gut says treat. This highlights the Threshold Model of Clinical Decision Making.

  8.  **Refining the Philosophy:**
      *   Acknowledge the "Judy Benjamin" tension: We are updating on a constraint, not an event.
      *   The "Assumption of Independence for Others" is the pragmatic bridge.
      *   Make sure to distinguish *Likelihood Ratio* (test property) from *Relative Risk/Odds* (population property). The prompt says "report says the finding makes..." which implies the test result is the evidence.

  9.  **Final Polish:**
      *   Check constraints: Under 10 mins? Yes, if they know their priors.
      *   Defensible? Yes, based on Odds-Bayes.
      *   Explainable? Yes, "shifting the weight."
      *   Tone check: Avoid academic jargon where possible, but keep the epistemological integrity.

      *(Self-Correction during drafting)*: I need to be careful about the phrase "makes disease A twice as likely as disease B."
      *   Interpretation A: $P(A|E) = 2 \times P(B|E)$. (Posterior claim).
      *   Interpretation B: $P(E|A) = 2 \times P(E|B)$. (Likelihood claim).
      *   In clinical practice, radiology/pathology reports often imply Interpretation B (the finding is more characteristic of A), but students hear Interpretation A.
      *   I must force the student to clarify this in Step 1. If it's Interpretation A, Bayes is already done for that pair. If it's Interpretation B, they must apply the prior.
      *   Most likely, the prompt implies the students are seeing a Likelihood Ratio ($LR$) but treating it as a Posterior Probability. I will design the procedure to force the LR interpretation because that's where the work is.

      *Wait, one more nuance:* If the space isn't exhaustive, and we update A vs B, what happens to C?
      *   If the test is *only* informative for A vs B, then $P(E|C)$ is effectively the baseline.
      *   So $LR_{A, C} = P(E|A)/P(E|C)$. We don't know this directly.
      *   We know $P(E|A)/P(E|B) = 2$.
      *   To solve this, we need to assume $P(E|B)$ relative to $P(E|C)$.
      *   *Pragmatic fix:* If the report doesn't mention C, assume the test is neutral for C ($LR_C = 1$). This is the "Principle of Minimum Bias."
      *   I will build this into the procedure.

  10. **Final Review against constraints:**
      *   No reading list.
      *   Expert tone.
      *   Three cases run through.
      *   Philosophy grounded (MinEnt/Judy Benjamin acknowledged but operationalized).

      *Let's write.*
answer: |-
  Here is the procedure. It is designed to be written on a index card and kept in a white coat pocket. It operationalizes the "Minimum Information" principle (often discussed in the Judy Benjamin literature) without requiring your students to solve for cross-entropy minimization at the bedside.

  The core epistemological insight you need to drill into them is this: **A ratio between two hypotheses is not a probability for either.** It is a vector of force. To know where you land, you need to know where you started (the prior) and what else is in the room (the partition).

  ***

  # The Relative Likelihood Update Protocol (RLUP)

  **Time:** 5–8 Minutes
  **Goal:** Convert a comparative test finding into a defensible post-test probability.
  **Philosophy:** Bayesian Odds updating with a "Minimum Bias" assumption for unmentioned hypotheses.

  ### Step 1: Interrogate the Number (The Semantics Check)
  *Ask:* "Does this number describe the **test** or the **patient**?"
  *   **Type A (Likelihood Ratio):** "This finding is twice as common in A as in B." ($P(E|A) = 2 \times P(E|B)$).
  *   **Type B (Posterior Odds):** "Given this finding, A is twice as likely as B." ($P(A|E) = 2 \times P(B|E)$).

  *Decision:*
  *   If **Type B**: The math for the A/B pair is already done. Skip to Step 3 to normalize.
  *   If **Type A** (Most common): This is a force multiplier. You must apply it to the prior odds. **Proceed to Step 2.**

  ### Step 2: The Partition Check (Exhaustiveness)
  *Ask:* "If it isn't A and it isn't B, what is it?"
  *   **Scenario 1 (Binary):** A and Not-A (or A and B are the only two possibilities in the universe).
      *   *Action:* Standard Bayes. $PostOdds = PriorOdds \times LR$.
  *   **Scenario 2 (Differential):** There are options C, D, E... (The "Other" Bucket).
      *   *Action:* You cannot update A and B in isolation. You must update the whole system.
      *   *The "Minimum Bias" Rule:* If the report does not mention C, D, or E, assume the test is **neutral** regarding them. Their Likelihood Ratio relative to the baseline is 1.0. Do not change their relative weights, but expect their *probabilities* to shrink if A or B grow.

  ### Step 3: The Prior Estimate (The Anchor)
  *Ask:* "Before this test, what was the frequency of A vs. B vs. Others in a patient like this?"
  *   **If you have a number:** Use it (e.g., A=10%, B=5%, Other=85%).
  *   **If you have no number:** Use a "Reference Class" heuristic. (e.g., "In this clinic, we see 5 of A for every 1 of B").
  *   **If you truly have no idea:** You must stop. You cannot update a ratio without a baseline. State to the attending: *"I cannot interpret this ratio without a pre-test prevalence estimate."* This is a defensible epistemic boundary, not a failure.

  ### Step 4: The Calculation (Odds Arithmetic)
  *Do not use percentages. Use Odds.*
  1.  Convert Priors to Odds (for the specific comparison).
      *   $Odds(A:B) = P(A) / P(B)$.
  2.  Apply the Multiplier (from Step 1).
      *   $NewOdds(A:B) = PriorOdds(A:B) \times Multiplier$.
  3.  **If Non-Exhaustive (Scenario 2):** Re-normalize.
      *   Calculate the "Weight" for each hypothesis.
      *   $Weight_A = P(A)_{prior} \times LR_A$
      *   $Weight_B = P(B)_{prior} \times LR_B$
      *   $Weight_{Other} = P(Other)_{prior} \times 1$ (Per the Minimum Bias Rule).
      *   $Total Weight = Sum(Weights)$.
      *   $P(A)_{post} = Weight_A / Total Weight$.

  ### Step 5: The Value Stop (The Threshold Check)
  *Ask:* "Does this number change what we **do**?"
  *   Compare $P(A)_{post}$ to your **Treatment Threshold** (the probability at which the benefit of treatment outweighs the harm).
  *   **If $P(A)_{post}$ is below threshold:** The math says "Watch."
  *   **If $P(A)_{post}$ is above threshold:** The math says "Treat."
  *   **The Handoff:** If the math says "Watch" but the consequence of being wrong is death, **stop the math.** This is no longer a probability question; it is a utility question. Tell the patient: *"The numbers say this is unlikely, but because the risk is severe, we will investigate further."*

  ***

  # Running the Protocol: Three Cases

  Here is how you apply this on rounds.

  ### Case 1: The Binary Trap (Disease vs. No Disease)
  **Scenario:** A D-dimer test comes back. The report says a positive result is **4 times more likely** in patients with PE than in patients without PE. The patient's pre-test probability of PE was **10%**.
  **Student Intuition:** "It's 4 times more likely, so 40%?" (Wrong).
  **Student Intuition 2:** "Bayes theorem..." (Gets bogged down in denominators).

  **RLUP Execution:**
  1.  **Semantics:** "4 times more likely in patients with..." = Likelihood Ratio ($LR+ = 4$).
  2.  **Partition:** Binary (PE vs. No PE). Exhaustive.
  3.  **Prior:** $P(PE) = 0.10$. $Odds = 0.10 / 0.90 = 1/9$.
  4.  **Calc:**
      *   $PostOdds = PriorOdds \times LR$
      *   $PostOdds = (1/9) \times 4 = 4/9$.
      *   Convert to Prob: $4 / (4+9) = 4/13 \approx 31\%$.
  5.  **Value Stop:** Threshold for CT scan is usually ~15%. 31% > 15%. Scan the patient.

  **Defense to Attending:** "The LR is 4, but the prior was low. The odds shift from 1:9 to 4:9, landing us at 31%. That crosses our testing threshold."
  **Explanation to Patient:** "The test makes the clot four times more likely than it was this morning, but because clots are rare to start with, it's still more likely you *don't* have one than that you *do*. However, it's likely enough that we need a picture to be sure."

  ### Case 2: The Non-Exhaustive Differential (The Tumor Scan)
  **Scenario:** A liver lesion is found. Differential: Hepatocellular Carcinoma (HCC), Metastasis (Met), Hemangioma (Benign).
  **Finding:** Biopsy marker X is positive. Report: "Marker X makes HCC **twice as likely as Met**." ($LR_{HCC:Met} = 2$).
  **Priors:** Based on history (cirrhosis + smoking): HCC (20%), Met (20%), Hemangioma (60%).
  **Problem:** HCC and Met do not exhaust the space. Hemangioma is the big bucket.

  **RLUP Execution:**
  1.  **Semantics:** $LR_{HCC:Met} = 2$. This means $P(E|HCC) = 2 \times P(E|Met)$.
  2.  **Partition:** Non-exhaustive. We have an "Other" (Hemangioma).
  3.  **The "Minimum Bias" Assumption:** The report says nothing about Hemangioma. We assume the test is neutral for Hemangioma ($LR_{Hem} = 1$). We assume the baseline likelihood of the marker in Met is the reference ($LR_{Met} = 1$). Therefore, $LR_{HCC} = 2$.
  4.  **Calc (Weight Method):**
      *   $Weight_{HCC} = 0.20 \times 2 = 0.40$
      *   $Weight_{Met} = 0.20 \times 1 = 0.20$
      *   $Weight_{Hem} = 0.60 \times 1 = 0.60$
      *   $Total Weight = 1.20$
      *   $P(HCC)_{post} = 0.40 / 1.20 = 33.3\%$
      *   $P(Met)_{post} = 0.20 / 1.20 = 16.7\%$
      *   $P(Hem)_{post} = 0.60 / 1.20 = 50.0\%$
  5.  **Value Stop:** HCC is now the leading specific malignancy, but Benign is still 50%. Decision: Monitor vs. Resect depends on patient surgical risk.

  **Why this works:** Students often just double the HCC probability (20% -> 40%) and ignore the fact that the *total probability mass must sum to 100%*. By using weights, we automatically dilute the "Other" category proportionally. This is the pragmatic solution to the Judy Benjamin problem: *Update the constrained variables, hold the unconstrained variables constant in likelihood, and renormalize.*

  ### Case 3: The Counter-Intuitive Result (The "Zebra" That Won't Die)
  **Scenario:** Young patient, vague symptoms. Differential: Viral Syndrome (Common), Pheochromocytoma (Rare/Deadly).
  **Priors:** Viral (99%), Pheo (1%).
  **Finding:** Metanephrines slightly elevated. Report: "This level is **10 times more likely** in Pheo than Viral." ($LR = 10$).
  **Student Intuition:** "10 times! That's huge. It's Pheo."
  **Math Reality:** It's still probably Viral.

  **RLUP Execution:**
  1.  **Semantics:** $LR = 10$.
  2.  **Partition:** Binary for calculation simplicity (Pheo vs. Not-Pheo).
  3.  **Prior:** $Odds = 1:99$.
  4.  **Calc:**
      *   $PostOdds = (1/99) \times 10 = 10/99 \approx 1/10$.
      *   $P(Pheo)_{post} = 1 / 11 \approx 9\%$.
  5.  **Value Stop:**
      *   **Math:** 9% means it is 91% likely to be Viral. If the treatment for Pheo is toxic surgery, the math says **do not operate**.
      *   **Values:** However, missing Pheo leads to stroke/death. Missing Viral leads to... a week of flu.
      *   **The Conflict:** The probability is low, but the *regret* is asymmetric.

  **What the Procedure Does Here:**
  The procedure forces the student to admit the probability is only 9%. It prevents them from overstating the evidence ("It's 10 times more likely!" sounds like 90% to a layperson).
  **The Handoff:** The procedure stops at Step 5. You tell the attending: *"The posterior probability is only 9%, which is below the standard treatment threshold. However, given the mortality risk of false negative, I recommend a confirmatory test rather than discharge."*
  **Explanation to Patient:** *"The test result is unusual for a virus, which makes us worry about the rare condition. Even though the rare condition is still unlikely (about 1 in 10), we can't afford to be wrong about it, so we need one more check."*

  ***

  # Instructor Notes: Where the Math Ends

  When your students ask why Step 2 (The Partition Check) is necessary, tell them this: **Probability is a budget.** If you spend probability on A, you must take it from somewhere. If A and B don't sum to 1, spending on A takes from B *and* C. If you ignore C, you are implicitly assuming C doesn't exist. That is an ontological claim, not a mathematical one.

  When they ask about the "Minimum Bias" rule in Case 2 (assuming $LR=1$ for unmentioned diagnoses), tell them: **This is where epistemology meets triage.** We do not know how the test affects the "Other" category. The Principle of Minimum Information says we should assume the test tells us *nothing* about what it doesn't mention. It is the most conservative assumption that still allows us to use the data we have. It is not "truth," it is "least dangerous guess."

  Finally, emphasize Step 5. The procedure calculates **belief**, but medicine requires **action**. The gap between $P(Disease)$ and $Action$ is filled by **Utility** (what the patient values). No amount of Bayesian updating can calculate utility. When the math says "low probability" but the gut says "high stakes," the procedure is finished. The clinician must now speak as a moral agent, not a statistician.

  If they can run this in 5 minutes, they will be safer than 90% of residents who just "feel" the numbers.
