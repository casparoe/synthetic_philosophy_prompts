answer: |-
  ### Preamble: Settled Formalism vs. Contested Interpretation

  Before using this taxonomy, students must distinguish between the mathematical theorems (settled) and their philosophical implications (contested).

  *   **Settled (Mathematical):** Given specific axioms (Unrestricted Domain, Pareto, Independence of Irrelevant Alternatives, Non-Dictatorship), no aggregation rule can guarantee a transitive social ordering. Condorcet cycles are mathematically possible in multidimensional spaces.
  *   **Contested (Philosophical):**
      *   **Axiomatic Normativity:** Whether Arrow's axioms (especially Transitivity and IIA) are necessary conditions for *democratic legitimacy* or merely conditions for *market-like consistency*.
      *   **Ontological Status:** Whether "social preferences" are entities to be discovered (Realism) or constructs to be created (Constructivism).
      *   **Empirical Relevance:** Whether the conditions required for cycles (e.g., multidimensional preferences without structure) obtain in actual electorates.

  ***

  ### Diagnostic Decision Tree: Responses to Aggregation Failure

  **Instructions:** Start at the root. At each node, select the claim that best matches your substantive commitment. Do not worry about the final label; answer based on the philosophical premise.

  **Node 1 (Metaphysical): The Ontology of the Will**
  *   **A:** A consistent "Collective Will" exists independently of the aggregation procedure (even if hidden).
  *   **B:** No consistent "Collective Will" exists prior to the procedure; the outcome is constructed by the process.
      *   *Select A → Go to Node 2*
      *   *Select B → Go to Node 5*

  **Node 2 (Empirical): The Structure of Preferences**
  *   **A:** In practice, citizen preferences are sufficiently structured (e.g., single-peaked) to prevent cycles.
  *   **B:** Preferences are sufficiently diverse that cycles are theoretically and practically unavoidable.
      *   *Select A → Go to Node 3*
      *   *Select B → Go to Node 4*

  **Node 3 (Endogeneity): Source of Preference Structure**
  *   **A:** Preference structure arises naturally from the distribution of interests in society.
  *   **B:** Preference structure is induced by institutions, parties, or agenda control.
      *   *Select A → **Leaf 1**.*
      *   *Select B → **Leaf 2**.*

  **Node 4 (Normative): The Necessity of Transitivity**
  *   **A:** A transitive social ordering is required for democratic legitimacy.
  *   **B:** Democracy can remain legitimate even if social choices are intransitive or unstable.
      *   *Select A → Go to Node 5 (Re-entry)*
      *   *Select B → **Leaf 3**.*

  **Node 5 (Locus of Defect): Rules vs. Agents**
  *(Reached from Node 1B or Node 4A)*
  *   **A:** The failure lies in the *aggregation rules* (institutions need redesign).
  *   **B:** The failure lies in the *agents* (voters lack competence or virtue).
      *   *Select A → Go to Node 6*
      *   *Select B → Go to Node 7*

  **Node 6 (Formal): Institutional Remedy**
  *   **A:** Legitimacy is preserved by constitutional constraints on the agenda (rights, veto points).
  *   **B:** Legitimacy is preserved by engineering better voting procedures (ranked-choice, quadratic).
      *   *Select A → **Leaf 4**.*
      *   *Select B → **Leaf 5**.*

  **Node 7 (Epistemic): Competence Distribution**
  *   **A:** Political competence is distributed equally enough that equal weight is justified.
  *   **B:** Political competence is significantly skewed; equal weight undermines truth-tracking.
      *   *Select A → **Leaf 6**.*
      *   *Select B → Go to Node 8*

  **Node 8 (Epistemic): Mechanism of Selection**
  *   **A:** Institutions should weight votes or franchise based on demonstrated competence.
  *   **B:** Institutions should randomize selection (sortition) to filter competence without elite bias.
      *   *Select A → **Leaf 7**.*
      *   *Select B → **Leaf 8**.*

  **Node 9 (Procedural): Nature of the Vote**
  *(Reached from Node 1B, if not routed to Epistemic)*
  *   **A:** Voting is the revelation of private, fixed preferences.
  *   **B:** Voting is a public commitment that transforms the voter's judgment.
      *   *Select A → **Leaf 9**.*
      *   *Select B → Go to Node 10*

  **Node 10 (Deliberative): Mechanism of Transformation**
  *   **A:** Transformation requires reasoned discourse and argumentation prior to voting.
  *   **B:** Transformation occurs through civic ritual, duty, or institutional habituation.
      *   *Select A → **Leaf 10**.*
      *   *Select B → **Leaf 11**.*

  ***

  ### Leaf Diagnoses and Position Mapping

  | Leaf | Position Name | Diagnosis (if Unnamed) |
  | :--- | :--- | :--- |
  | **1** | **Downsian Spatial Theory** | N/A (Standard empirical realist view). |
  | **2** | **Induced Preference Theory** | N/A (e.g., Shepsle, Weingast on structure-induced equilibrium). |
  | **3** | **Majoritarian Instability Theory** | N/A (e.g., McKelvey; views cycling as responsive, not illegitimate). |
  | **4** | **Liberal Constitutionalism** | N/A (Uses rights/constraints to bypass aggregation problems). |
  | **5** | **Social Choice Formalism** | N/A (Seeks mathematical fixes to aggregation rules). |
  | **6** | **Epistemic Democracy (Equal Weight)** | N/A (e.g., Estlund's moderate epistemicism without franchise restriction). |
  | **7** | **Epistocracy** | N/A (e.g., Brennan; competence justifies unequal voting power). |
  | **8** | **Lottocratic Epistemicism** | N/A (e.g., Guerrero; sortition as competence-filtering). |
  | **9** | **Aggregative Proceduralism** | N/A (Standard liberal view; ignores transformation). |
  | **10** | **Deliberative Democracy** | N/A (e.g., Habermas, Cohen; discourse resolves preference conflict). |
  | **11** | **Civic Republicanism** | **Unnamed (Unexplored):** Most commitment theories require discourse; a purely ritualistic transformation without discourse is theoretically possible but rarely defended in contemporary literature. |

  ***

  ### Indistinguishability Flag

  **Pair:** **Leaf 4 (Liberal Constitutionalism)** and **Leaf 10 (Deliberative Democracy)**.
  *   **Diagnosis:** While separated by the tree's Metaphysical question (Node 1), these positions often converge in practice. Both reject simple majoritarianism in favor of constraints on outcomes. However, the tree successfully separates them by *justification*: Constitutionalism relies on pre-political rights (Realist/Constraint), while Deliberative Democracy relies on the quality of the process (Constructivist/Transformation). Students who support both for different reasons should note this convergence.

  **Pair:** **Leaf 7 (Epistocracy)** and **Leaf 8 (Lottocratic Epistemicism)**.
  *   **Diagnosis:** These are separated by Node 8 (Mechanism). However, if a student believes competence is skewed (Node 7B) but finds both weighting and sortition unattractive, they fall into a gap.
  *   **Gap Diagnosis:** **Unnamed (Unattractive):** The combination of "Competence is Skewed" + "Weighting is Illegitimate" + "Sortition is Ineffective" leaves no institutional solution other than status quo democracy, which contradicts the Node 7B premise. This gap is usually resolved by reluctantly accepting Leaf 7 or Leaf 8.

  ### Instructor's Note on Usage
  This instrument is designed to prevent students from selecting a "school" (e.g., "I am a Deliberative Democrat") before understanding the commitments that entail it. If a student finds themselves at **Leaf 11 (Civic Republicanism)** but feels uncomfortable with the "Unnamed" diagnosis, ask them to consider whether their view of "ritual" implicitly relies on discourse (moving them to Leaf 10) or fixed preferences (moving them to Leaf 9). This reveals whether their position is fully theorized or intuitively held.
