answer: |-
  Looping effects do not merely make psychiatric kinds moving targets but fundamentally undermine the realist assumption that these categories track mind-independent phenomena, meaning your friend's model holds only for biologically constrained conditions while your co-constitution model applies where the classification itself supplies the logic of the symptoms.

  The conceptual difference you are groping at is the distinction between *interactive* and *indifferent* kinds. Your friend is treating psychiatric categories as indifferent kinds (like tigers or quarks) that happen to be difficult to measure because they shift; on this view, the category exists prior to and independently of the classification, so validity is a matter of accurately tracking a moving object. You are arguing that many psychiatric categories are interactive kinds, where the classification interacts with the classified people to change not just their behavior but the very conditions of satisfaction for the category. This does not collapse into mere instability because instability presupposes a continuous identity over time (the same target moving), whereas co-constitution implies that the "target" at $t_2$ is ontologically different from the "target" at $t_1$ because the conceptual framework itself has altered the reality it purports to describe. If the loop is merely causal (classification $\rightarrow$ behavior change), your friend is right; if the loop is conceptual (classification $\rightarrow$ new possibilities for being), you are right.

  Regarding your friend's "sealed criteria," she is conflating *measurement reliability* with *kind ontology*. Using actigraphy or inflammatory markers eliminates the loop only if the marker is the *entirety* of the kind (e.g., "High C-Reactive Protein Disorder"). But psychiatric kinds are rarely defined solely by biomarkers; they are defined by the *meaning* of those markers in a human life (e.g., "Depression" involves sadness, not just cortisol). If the biomarker is a proxy for a lived experience, the loop relocates: patients manipulate the proxy, or the clinical significance of the proxy shifts as the population's relationship to the marker changes. A "sealed" measurement can track a physiological state, but it cannot seal off the *disorder* from looping if the disorder entails suffering, dysfunction, or social identity, all of which are permeable to classification.

  The "naivety clause" is indeed incoherent as an ontological constraint, though it functions as a practical heuristic for excluding malingering. It is incoherent because it presupposes a "pure" presentation unaffected by culture or knowledge, which does not exist for human beings. To define a human kind by requiring that the subject be ignorant of the kind is to define the kind by a condition (ignorance) that the existence of the kind inevitably destroys. This clause attempts to force an interactive kind into the mold of an indifferent kind by fiat. It is not fatal to clinical practice if treated as a rule of thumb ("ignore obvious gaming"), but it is fatal to philosophy if treated as a definition of validity, because it denies the reflexive nature of human agency.

  The three channels of looping you identified all matter, but they do different work. Changes in expert concepts (manual revisions) drive the *definition* of the kind; changes in help-seeking drive the *prevalence* statistics; but changes in self-description and presentation are the engine of *co-constitution*. The latter is where your argument gains traction: if people come to experience their own distress through the vocabulary of the diagnosis (e.g., interpreting sadness as "anhedonia" rather than "grief"), the phenomenology of the condition itself is altered. Hacking's examples work because they rely on this phenomenological uptake. For categories heavily dependent on self-report (personality disorders, mood disorders), co-constitution is dominant. For categories dependent on gross pathology (delirium due to infection, late-stage dementia), instability is the primary effect. The error is assuming one model fits all psychiatric kinds.

  "Loop-aversion" is simply negative feedback within the same system; it does not settle the kind but adds volatility, confirming that the kind is interactive rather than indifferent. A category that explicitly builds looping into its criteria (e.g., "This diagnosis applies to individuals whose distress is shaped by awareness of diagnostic criteria") is not self-defeating but *reflexively valid*. This approach abandons the claim to be carving nature at the joints and instead admits to carving *culture* at the joints. It is honest, provided it stops claiming the authority of natural science. The stable resting point is not a sealed criterion but a *dynamic validity* model: acknowledging that the criteria are valid only relative to a specific cultural and historical context where the loop is stable enough to treat, while accepting that the "truth" of the category is partly a product of the classification system itself.
