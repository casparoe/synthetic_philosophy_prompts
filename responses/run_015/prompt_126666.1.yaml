answer: |-
  ### Examination Question

  **Module:** Rational Choice and Game Theory
  **Section:** Unseen Written Paper
  **Time Allowed:** 45 minutes
  **Marks:** 25

  **Question 1**

  Consider the following two-player strategic game. Rowena chooses a row (A, B, or C); Colin chooses a column (L, M, or R). Payoffs are listed (Rowena, Colin).

  $$
  \begin{array}{c|ccc}
   & L & M & R \\
  \hline
  A & 4, 6 & 0, 4 & 3, 2 \\
  B & 0, 2 & 4, 1 & 1, 3 \\
  C & 1.5, 1 & 1.5, 5 & 1.8, 5
  \end{array}
  $$

  (i) Verify that at the outset, no pure strategy for either player is strictly or weakly dominated by any other pure strategy. [4 marks]

  (ii) Show that Rowena's strategy C is strictly dominated by a mixed strategy over A and B. Determine the exact interval of probabilities $p$ (assigned to A) that constitute a dominating mixture. [6 marks]

  (iii) Perform the iterated deletion of strictly dominated strategies (IDSDS) to completion. State the surviving strategy profile. Explain whether the order in which you deleted strategies could have altered the final result. [5 marks]

  (iv) A colleague objects: 'Rowena is a single agent who will ultimately perform one action, not a randomiser. It is illegitimate to delete C merely because a coin toss between A and B yields a higher expected payoff.' Answer this objection, explaining the epistemic justification for deleting a strategy dominated by a mixture. [5 marks]

  (v) Suppose we retain Colin's cardinal payoffs but know only Rowena's ordinal ranking of outcomes. Is the deletion of C still licensed? If not, construct an ordinally equivalent payoff table for Rowena where C is not dominated. Briefly comment on the consequences for the uniqueness of the Nash equilibrium. [5 marks]

  ***

  ### Model Answer

  (i) For Rowena, comparing rows pairwise: A yields more than B against L and R, but less against M. A yields more than C against L and R, but less against M. B yields more than C against M, but less against L and R. Thus, no row dominates another. For Colin, comparing columns pairwise: L yields more than M against A and B, but less against C. L yields more than R against A, but less against B and C. M yields more than R against A and C, but less against B. No column dominates another. Since no strategy is ever weakly inferior across all opponent choices, no weak dominance exists either.

  (ii) Let Rowena play A with probability $p$ and B with probability $1-p$. For this mixture to strictly dominate C, the expected payoff must exceed C's payoff against each of Colin's pure strategies.
  Against L: $4p + 0(1-p) > 1.5 \implies 4p > 1.5 \implies p > 0.375$.
  Against M: $0p + 4(1-p) > 1.5 \implies 4 - 4p > 1.5 \implies 4p < 2.5 \implies p < 0.625$.
  Against R: $3p + 1(1-p) > 1.8 \implies 2p + 1 > 1.8 \implies 2p > 0.8 \implies p > 0.4$.
  Taking the intersection of these conditions, $p$ must satisfy $0.4 < p < 0.625$. Since this interval is non-empty, C is strictly dominated by any mixture where $p \in (0.4, 0.625)$.

  (iii) First, delete C. The reduced game has rows A, B and columns L, M, R.
  In this reduced game, Colin's L yields (6, 2) against (A, B), while M yields (4, 1). Since $6>4$ and $2>1$, L strictly dominates M. Delete M.
  The game now has rows A, B and columns L, R.
  Rowena's A yields (4, 3) against (L, R), while B yields (0, 1). Since $4>0$ and $3>1$, A strictly dominates B. Delete B.
  The game now has row A and columns L, R.
  Colin's L yields 6 against A, while R yields 2. L strictly dominates R. Delete R.
  The unique surviving profile is (A, L).
  The order of deletion makes no difference. For strict dominance, the set of strategies surviving IDSDS is order-independent; if a strategy is strictly dominated, it remains dominated regardless of which other dominated strategies are removed first.

  (iv) The objection confuses the *interpretation* of a mixed strategy with the *logic* of dominance. Deleting a strategy because it is dominated by a mixture does not require the analyst to predict that Rowena will actually toss a coin. Rather, it relies on the epistemic principle that a rational player will not play a strategy that is never a best reply to any coherent belief about the opponent. If a pure strategy is dominated by a mixture, it cannot be a best reply to any probability distribution over the opponent's strategies. Thus, deleting C requires only the assumption that Rowena is rational and holds some belief about Colin; it commits us to no claim that she randomises.

  (v) No, the deletion is not licensed by ordinal information alone. Strict dominance by a mixture depends on the cardinal distances between payoffs, not just their order.
  Consider this ordinally equivalent table for Rowena (preserving rank in each column):
  $$
  \begin{array}{c|ccc}
   & L & M & R \\
  \hline
  A & 10 & 0 & 10 \\
  B & 0 & 10 & 0 \\
  C & 9 & 9 & 9
  \end{array}
  $$
  Here, C is not dominated by any mix of A and B (e.g., against L and M, no $p$ satisfies $10p > 9$ and $10(1-p) > 9$). Consequently, C cannot be deleted.
  In this transformed game, (A, L) remains a Nash equilibrium. However, uniqueness is lost. If Rowena plays C, Colin is indifferent between M and R (payoff 5). If Colin mixes M and R appropriately (e.g., probability 0.5 on each), Rowena's expected payoff from A or B is 5, making C (payoff 9) a best reply. Thus, profiles involving C become equilibria, demonstrating that solution uniqueness is not invariant under ordinal transformations when mixed dominance is involved.

