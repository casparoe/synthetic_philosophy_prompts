answer: |-
  The debate between **Epistemic Contextualism (EC)** and **Pragmatic Encroachment (PE)** is one of the most nuanced in contemporary epistemology. Both views emerge as responses to the same intuitive data: cases (like the famous "Bank Cases") where a subject seems to know a proposition in a low-stakes situation but fails to know the same proposition in a high-stakes situation, despite no change in their evidence or truth-conducive mental states.

  While they share the prediction that knowledge ascriptions can shift in truth value across different scenarios, the disagreement between them is **substantive**, not merely verbal or locational. They offer fundamentally different accounts of the metaphysics of knowledge and the semantics of the word "knows."

  Here is a detailed comparison of where they align, where they diverge, and why the difference matters.

  ---

  ### 1. The Core Mechanisms: Semantics vs. Metaphysics

  The primary distinction lies in *what* is changing when we move from a low-stakes to a high-stakes scenario.

  **Epistemic Contextualism (EC)**
  *   **The Claim:** The semantic content of the word "knows" is context-sensitive, similar to indexicals like "tall," "here," or "I."
  *   **The Locus of Variation:** The **attributor's conversational context**. When a speaker attributes knowledge to a subject, the standards for "knows" are set by what possibilities are salient in the *speaker's* conversation.
  *   **The Implication:** The subject's actual epistemic position (their evidence, reliability, etc.) remains constant. What changes is the *semantic bar* they must clear to make the sentence "S knows that p" true. In a low-standards conversation, the bar is low, so the sentence is true. In a high-standards conversation (e.g., one where skeptical hypotheses are mentioned), the bar is raised, and the sentence becomes false.
  *   **Commitment:** EC generally preserves **Purism** (or Intellectualism): the view that whether a subject knows depends *only* on truth-relevant factors (evidence, reliability, truth), not practical factors.

  **Pragmatic Encroachment (PE)**
  *   **The Claim:** The epistemic status of knowledge itself is sensitive to practical factors. Practical stakes do not just affect whether we *say* someone knows; they affect whether they *do* know.
  *   **The Locus of Variation:** The **subject's practical situation**. The standards for knowledge are invariant, but the subject's relationship to the proposition changes based on what is at stake for *them*.
  *   **The Implication:** In high-stakes situations, the subject requires more evidence to attain the status of "knowledge" than they do in low-stakes situations. The word "knows" retains a stable meaning, but the conditions for satisfying that meaning shift based on the subject's interests.
  *   **Commitment:** PE rejects **Purism**. It argues that practical facts (how much it matters if you are wrong) are partially constitutive of epistemic facts.

  ### 2. The "Mismatch" Test: Proof of Substantive Disagreement

  If the difference were merely about "where the context-sensitivity is located," the two views might always agree on the truth value of knowledge claims. However, they make divergent predictions in **mismatched cases**. This proves the disagreement is substantive.

  Consider a scenario where the **Attributor is in a low-stakes context**, but the **Subject is in a high-stakes situation**.

  *   **The Case:** Hannah is facing a high-stakes situation (she will lose her house if she doesn't deposit a check, and the bank might be closed). She has standard evidence but hasn't checked the hours recently. A philosopher, who is casually discussing Hannah in a low-stakes academic seminar (no practical stakes regarding the bank), says: "Hannah knows the bank is open."
  *   **EC Prediction:** **True.** Because the *attributor* (the philosopher) is in a low-standards conversational context, the semantic bar for "knows" is low. Hannah clears that bar. The sentence expresses a truth.
  *   **PE Prediction:** **False.** Because the *subject* (Hannah) is in a high-stakes situation, she does not meet the epistemic requirements for knowledge. Since she does not know, the philosopher's assertion is false, regardless of the philosopher's relaxed conversational context.

  Because EC and PE assign different truth values to the same utterance in this scenario, they are not merely offering different labels for the same phenomenon. They are making competing claims about the world and language.

  ### 3. The Nature of Knowledge: Purism vs. Impurism

  The deepest philosophical disagreement concerns the nature of knowledge itself.

  **EC defends the traditional analysis of knowledge.**
  Contextualists argue that knowledge should remain a purely epistemic relation. They want to save the intuition that practical stakes shouldn't matter to *knowledge* (Purism). They explain away the intuition that stakes matter by locating the variability in our *language* rather than in the *world*. For the contextualist, Hannah's mental state is identical in both Bank Cases; she either knows or she doesn't (invariantism about the fact), but our ability to truthfully *say* she knows varies.

  **PE revises the traditional analysis of knowledge.**
  Proponents of PE (such as Jeremy Fantl, Matthew McGrath, and Jason Stanley) argue that the traditional separation between theoretical reason (what to believe) and practical reason (what to do) is false. They argue that if it is rational to act on $p$ only if you know $p$, and practical stakes affect what it is rational to do, then practical stakes must affect whether you know $p$. For the pragmatist, Hannah's epistemic status *actually changes* between the low and high-stakes cases.

  ### 4. Responses to Skepticism

  The two views also deploy their mechanisms to solve (or dissolve) different problems.

  *   **EC as an Anti-Skeptical Tool:** Contextualism was largely popularized as a response to skepticism. It allows the contextualist to say that the skeptic is right in their own high-standards context ("You don't know you have hands"), but that ordinary people are also right in their ordinary contexts ("I know I have hands"). There is no contradiction because the word "knows" means different things in the two utterances.
  *   **PE and Skepticism:** Pragmatic encroachment does not offer the same easy dissolution of skepticism. In fact, it might make skepticism harder to avoid. If philosophical inquiry is a "high-stakes" activity (where being wrong about the nature of reality is a significant intellectual cost), PE might imply that we know very little when doing philosophy. PE is less concerned with refuting the skeptic and more concerned with aligning epistemology with the norms of practical reasoning.

  ### 5. Summary of Differences

  | Feature | Epistemic Contextualism (EC) | Pragmatic Encroachment (PE) |
  | :--- | :--- | :--- |
  | **What varies?** | The semantic standards of "knows." | The subject's epistemic status. |
  | **Whose context matters?** | The **Attributor's** conversational context. | The **Subject's** practical situation. |
  | **Is "Knows" indexical?** | Yes (like "tall" or "here"). | No (it has a stable meaning). |
  | **View on Purism** | **Preserves Purism:** Knowledge depends only on truth-relevant factors. | **Rejects Purism:** Practical stakes are epistemic factors. |
  | **In Mismatch Cases** | Attributor can truthfully say "S knows" even if S is in high stakes. | Attributor speaks falsely if S is in high stakes, even if attributor is casual. |

  ### Conclusion

  The difference between Epistemic Contextualism and Pragmatic Encroachment is **substantive**. It is not merely a dispute about whether the variability lies in the conversation or the situation; it is a dispute about the **metaphysics of knowledge**.

  Contextualism maintains that knowledge is a stable, purely epistemic relation and that the variability is a feature of our linguistic practices. Pragmatic Encroachment maintains that our linguistic practices track a deeper reality: that knowledge itself is a hybrid status, sensitive to both evidence and action. Because they yield different truth-value predictions in cases where the attributor's context and the subject's stakes come apart, they are competing theories, not merely alternative descriptions of the same phenomenon.
