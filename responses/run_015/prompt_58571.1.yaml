          *   No sci-fi, idealized predictors, fatigue, forgetfulness, shifting meanings, or distrust of reason.
          *   Protagonist: Competent, conscientious, accepts premises, accepts Modus Ponens (MP) abstractly, but withholds conclusion.
          *   Withholding must seem principled, not confused.
          *   Crucial element: Validity of the step is written down as *another item to accept*.
          *   Length: Scenario roughly one paragraph, plain language.
          *   Follow-up: Explain constraint satisfaction, diagnose from both sides (Tortoise proponent vs. Defender), identify the structural element, and close with the strongest objection (begging the question) and reply.

  2.  **Drafting the Thought Experiment:**
      *   *Context:* Building inspection feels concrete. Safety protocols are rule-based.
      *   *Protagonist:* Elena, a senior structural inspector.
      *   *Premises:* (P) The beam load exceeds limit. (Q) If load exceeds limit, the building must be evacuated.
      *   *Action:* She writes down P. She writes down Q. She agrees MP is valid.
      *   *The Twist:* She refuses to write down "Evacuate" until she writes down a rule saying "If P and Q are true, then Evacuate is true." Then she asks for a rule justifying *that* rule.
      *   *Refining for "Principled" Withholding:* It can't just be stubbornness. It needs to look like she's demanding *authorization* for the move itself, treating the inference rule as just another premise needing verification.
      *   *Drafting:* Elena is reviewing a site report. She notes: (1) "Support Beam B4 is cracked." (2) "If Support Beam B4 is cracked, the site is unsafe." She agrees that logic dictates if (1) and (2) hold, the site is unsafe. However, she refuses to mark the site "Unsafe" on the final form. When asked why, she says, "I have the facts and the conditional rule, but I haven't yet recorded the authorization that allows me to combine them to produce the verdict." She insists on adding a third line: "If (1) and (2) are recorded, then 'Unsafe' may be recorded." Until that third line is officially accepted as a distinct item on her checklist, she treats the conclusion as merely potential, not actual.

  3.  **Checking Constraints:**
      *   *Ordinary context?* Yes, building inspection.
      *   *No sci-fi/fatigue/etc.?* Yes, she's just being hyper-strict about documentation.
      *   *Competent/Conscientious?* Yes, she's a senior inspector following protocol.
