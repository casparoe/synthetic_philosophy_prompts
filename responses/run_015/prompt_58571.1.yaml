      *   *Paragraph length?* Need to keep it tight.

  4.  **Developing the Analysis:**
      *   *Constraint Satisfaction:* Go through the list (no fatigue, competent, etc.) and explain how the text meets them.
      *   *Diagnoses:*
          *   *Tortoise Proponent:* Shows that inference requires a practice/habit, not just more propositions. You can't bridge the "therefore" gap with more "ifs."
          *   *Defender (Logic is self-executing):* Elena is confusing *using* a rule with *stating* a rule. She's committing a category mistake.
      *   *Structural Element:* The reification of the inference rule into a premise.
      *   *Dissolution:* If she just *applies* the rule instead of writing it, the puzzle vanishes.
      *   *Objection/Reply:*
          *   *Objection:* The case begs the question by assuming inference *needs* justification. A rational agent just infers.
