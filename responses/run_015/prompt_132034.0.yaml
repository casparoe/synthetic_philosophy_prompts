answer: |-
  The modal-epistemic status of *Vulcan = X* hinges on whether the stipulation introducing "Vulcan" confers rigidity. In Kripkean semantics, a name introduced by description is typically understood as rigidified by an implicit actuality operator. We must distinguish between the description used to fix the reference and the semantic content of the name. If "Vulcan" is read without an actuality operator, it functions as a non-rigid description: "the object that comes closest to satisfying C." On this reading, in a counterfactual world where a different body comes closest, "Vulcan" denotes that different body. Since "X" is causally anchored to the actual body, *Vulcan = X* would be contingent; it holds in the actual world but fails in worlds where the "closest" body differs.

  However, the more natural reading for a *name* introduced by stipulation is the rigidified one: "Vulcan" denotes the object that *in fact* comes closest. The stipulation identifies a specific object in the actual world to bear the name; the name then tracks that object across all possible worlds where it exists. The reference-fixing clause determines *which* object is named, not *what* the name means. On this reading, "Vulcan" is a rigid designator. Since "X" is also rigid (via causal history), and they denote the same object, the identity statement is metaphysically necessary. It is knowable only a posteriori because empirical investigation was required to determine which object satisfied the fallback condition.

  Contrasting this with standard cases clarifies the role of causal anchoring. In the Hesperus/Phosphorus case, both names are anchored by independent perceptual contact, ensuring rigidity. In the Neptune case, the name is introduced by a description that uniquely satisfies. Kripke argues "Neptune" is rigidified ("the actual perturber"). The runner-up case is structurally similar to Neptune, except the primary description fails and the fallback succeeds. The causal history of "X" guarantees its rigidity, but "Vulcan" achieves rigidity through the stipulation itself, not causal contact. This shows that causal-historical anchoring is not strictly necessary for necessity; rigidity is the operative factor. Whether the rigidity stems from causal chains or rigidified stipulation, the resulting necessity is of the same kind: metaphysical necessity grounded in the transworld identity of the object.

  The intuition that *Vulcan = X* is contingent—that Vulcan might easily have been a different body—stems from conflating the reference-fixing property with the meaning of the name. We know empirically that the body X satisfies the condition "closest to C." It is epistemically contingent that X satisfies this condition; a different body might have been closest. Consequently, it is tempting to say "Vulcan might have been that other body." But on the rigidified reading, this is false. In the world where the other body is closest, "Vulcan" still refers to X (the actual closest body), while the description "the closest body" refers to the other. The intuition tracks the contingency of the reference-fixing fact, not the modal status of the identity statement itself.

  Finally, we must flag the indeterminacy of the stipulation. "Closeness to satisfying C" admits no obvious metric. Does it weigh orbital proximity heavier than gravitational effect? If there is no fact of the matter about which body is closest, the reference of "Vulcan" is indeterminate. If reference fails or is vague, the identity statement lacks a determinate truth value. However, assuming the astronomical community adopted a specific metric that singled out X, reference succeeds. Under this assumption, the vagueness is resolved pragmatically, and the modal analysis proceeds as above. The identity is not rendered contingent by this vagueness; rather, without resolution, it would be truth-valueless. Given the prompt's assertion that "Vulcan" denotes the body, we assume successful reference.

  Thus, because both terms are rigid designators picking out the same object, but their co-reference was discovered through empirical investigation of the fallback condition, the statement is necessary yet knowable only a posteriori.

  \answer{necessary a posteriori}
