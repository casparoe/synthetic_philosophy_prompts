prompt: |-
  Okay, quick question that's been bugging me since I read Rosenthal's stuff. Higher-order theories hold that a mental state is conscious only when there's a simultaneous second-order representaion targeting it, right? But then that second-order state is itself a mental state, so by the same logic it needs its own second-order representaion to be conscious. That looks like an infinite regress—each level needs a higher one. So why do Rosenthal-style theorists try to block this by saying the higher-order thought can be unconsious? If it's unconsious, it can't confer consciousness downward; you'd just need a third-order state to wake up the second, and so on. I was playing with a variant case: imagine a blindsight patient who has an unconscious meta-belief that they're seeing, but reports no phenomenology at all. If HOT is correct, wouldn't that unconscious meta-belief still make the first-order visual state conscious? Or is there some hidden constraint—maybe about the mode of presentation or about being non-inferential—that breaks the loop without just collapsing back into first-orderism? What am I getting wrong here?
