      *   *Standard View:* Blindsight = Access without Phenomenality (or weak phenomenality).
      *   *SB View:* If phenomenality is local/isolated, how does SB explain the *denial* of experience in blindsight? If the local loop has experience, why does the reporting module say "nothing"?
      *   *Deflection to Pre-empt:* "You're just defining consciousness differently."
      *   *Drafting Question 1:* Focus on the dissociation. In blindsight, the visual cortex might have local recurrence (shadow), but the workspace says "no." Your view says the shadow *is* the consciousness. So, does the blindsight patient *feel* something they can't report?
