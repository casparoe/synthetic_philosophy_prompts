  Here's a thinking process that leads to the suggested questions:

  1.  **Analyze the Request:**
      *   **Guest:** Philosopher who published a monograph on "Shadow Broadcasting."
      *   **Core Theory:** Phenomenal consciousness (P-consciousness) is *not* globally broadcast. It's produced in local recurrent loops actively *isolated* from the Global Workspace (GW). First-person reports are post-hoc reconstructions mistaking local recurrence for widespread access.
      *   **Goal:** Create a sequence of hard-hitting Q&A questions for a podcast.
      *   **Specific Constraints:**
          *   Push on empirical distinguishability (Shadow Broadcasting vs. Standard Phenomenal Access).
