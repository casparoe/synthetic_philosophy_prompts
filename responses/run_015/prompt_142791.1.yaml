  2.  **Deconstruct the Theory ("Shadow Broadcasting"):**
      *   *Standard GWT:* Consciousness = Global Availability. If you can report it, it's in the workspace.
      *   *Shadow Broadcasting (SB):* Consciousness = Local Recurrence (isolated). Reporting = Reconstruction based on workspace data (which might not match the local conscious state).
      *   *Implication:* There is a gap between what it's *like* to be the subject and what the subject *says* it's like. The "I" that reports is not the "I" that experiences.

  3.  **Drafting - Section 1: Blindsight & Split-Brain (The Empirical Anchor):**
