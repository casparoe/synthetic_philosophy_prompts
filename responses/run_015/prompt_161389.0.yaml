answer: |-
  *   **Probe 1: Question Format.** Replace yes/no with a graded scale or forced-choice.
      *   If asymmetry vanishes: **Leaf: Artifact Account.**
      *   If asymmetry persists: Go to Probe 2.
  *   **Probe 2: Wording.** Swap 'intentionally' for 'in order to', 'deliberately', or 'foresee'.
      *   If asymmetry vanishes (specific to 'intentionally'): **Leaf: Conversational Account.**
      *   If asymmetry persists (general to action description): Go to Probe 3.
  *   **Probe 3: Normative Domain.** Use side-effects breaching etiquette, convention, or prudence rather than morality.
      *   If asymmetry persists (general normativity): Go to Probe 4.
      *   If asymmetry vanishes (morality specific): Go to Probe 4.
  *   **Probe 4: Norm Divergence.** Agent/Community treats side-effect as required/forbidden; Reader disagrees.
      *   If judgment tracks Agent's norms: **Leaf: Dispositional Account.**
      *   If judgment tracks Reader's norms: Go to Probe 5.
  *   **Probe 5: Control/Causation.** Agent aims but fails, lacks control, or system is software with no mind.
      *   If asymmetry vanishes (requires control/foreseeability): **Leaf: Epistemic/Control Account.**
      *   If asymmetry persists (normativity overrides control): Go to Probe 6.
  *   **Probe 6: Coercion/Exemption.** Agent is coerced or exempt from blame; outcome equally bad.
      *   If asymmetry vanishes (requires blame): **Leaf: Blame Inheritance Account.**
      *   If asymmetry persists (blame irrelevant): **Leaf: Moral Constitutive Account.**

  | Account Name | Path to Leaf | Awkward Commitment |
  | :--- | :--- | :--- |
  | **Artifact** | Format vanishes | Experimental philosophy reveals nothing about folk concepts. |
  | **Conversational** | Wording vanishes | Intentionality judgments are merely pragmatic implicatures. |
  | **Dispositional** | Domain persists + Tracks Agent | An agent intentionally does what they oppose if disposed to promote it. |
  | **Epistemic/Control** | Control vanishes | Moral valence never alters the metaphysical conditions of action. |
  | **Blame Inheritance** | Coercion vanishes | One cannot intentionally do what one is excused from blaming. |
  | **Moral Constitutive** | Morality specific + Coercion persists | A blameless agent can still intentionally bring about harm. |

  **Empty Cells and Indistinguishable Leaves**
  The logical space permits combinations nobody occupies: for example, General Normativity + Tracks Reader + Coercion Vanishes is unstable (if norms are general, why does blame exempt?). The **Conversational** and **Blame Inheritance** accounts are difficult to separate empirically, as both predict asymmetry vanishes under wording swaps or coercion; distinguishing them requires probing whether subjects perceive the question as requesting criticism versus attributing mental states. The **Dispositional** account occupies the cell where normativity is general but internal to the agent, whereas **Moral Constitutive** occupies the cell where normativity is specific and external. No account currently occupies the cell where asymmetry persists for etiquette but vanishes for morality.
