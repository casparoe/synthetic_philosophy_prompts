          *   *Success:* A set of necessary and sufficient conditions for a behavior to count as a "proto-report" (e.g., flexibility, context-sensitivity, error-correction) that doesn't require syntax.
          *   *Failure:* Proving that "textuality" inherently requires propositional structure, thus limiting HP to humans. (Note: Even this is a valuable negative result).

      *   **Scope & Feasibility:**
          *   This is conceptual work *on* empirical data, not new experiments.
          *   6 months is tight but doable for the *argument*, not for settling the science.
