          *   *Months 3-4:* Case Studies. Use existing cephalopod literature (camouflage, problem-solving, play). Treat these datasets as "texts" to be interpreted.
          *   *Months 5-6:* Synthesis. Formulate the criterion. Test against the "linguistic sneak-in" objection.
          *   *Key Distinction:* Intentional Stance vs. Phenomenological Stance.

