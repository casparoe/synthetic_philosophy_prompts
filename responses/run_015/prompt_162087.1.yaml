answer: |-
  You are not missing a simple rule. You have stumbled directly into the two biggest unresolved conflicts in the philosophy of mind: the **Constitution Question** (what makes a system conscious?) and the **Identity Question** (what makes a person the *same* person over time?).

  Your intuitions are inconsistent because you are trying to apply two different theories at once. You want **Functionalism** for the brain simulations (Cases 5, 6, 8) but **Continuity** for the replacement cases (Case 9). Most professional philosophers argue you cannot have both.

  Here are the two candidate principles that map onto your intuitions, stated sharply, followed by the verdict on what you likely need to drop.

  ### Principle 1: Counterfactual Causal Functionalism
  **The Rule:** A system is conscious if and only if it possesses an internal causal structure that is sensitive to counterfactuals. It must not only produce the right output for the actual input, but it must be disposed to produce *different* outputs if the inputs or internal states *were* different, driven by internal state transitions, not external lookup.

  *   **Why it exists:** To distinguish a "mind" from a "record."
  *   **Tied to your cases:**
      *   **Saves Case 5 & 6 (Simulation):** The computer/paper is actively computing state $N+1$ based on state $N$. If you changed a variable mid-stream, the outcome would change. The causal power is inside the system.
      *   **Kills Case 2, 3, 4, 7 (Book/Cards):** A book or a stack of cards is static. In Case 3, the *human* provides the causality, not the book. In Case 7, the cards are just a history log, not a machine. They lack "modal robustness" (they can't handle a question that isn't written down, whereas a brain can handle a novel thought).
      *   **Predicts Case 10 (Alien Physics):** **Yes.** If the alien machine has the same causal complexity and counterfactual sensitivity as a brain, the substrate (carbon vs. silicon vs. plasma) does not matter.
  *   **The Cost:** This principle forces you to accept **Case 9**. If the chip preserves the causal structure and counterfactual sensitivity perfectly, Functionalism says the mind survives. The "instant swap" is irrelevant to the functional organization.

  ### Principle 2: Spatiotemporal Continuity
  **The Rule:** Personal identity and consciousness require an unbroken physical history. A mind is not just a pattern; it is a specific physical process persisting through time. If the physical chain of causation is broken or replaced discontinuously, the original mind ceases to exist, even if a perfect duplicate continues.

  *   **Why it exists:** To preserve the intuition that "I" am my history, not just my data.
      *   **Saves Case 8 (Gradual Replacement):** The physical continuity is never broken. At every micro-second, the existing system causes the next state. The "ship of Theseus" sails on.
      *   **Kills Case 9 (Instant Swap):** The physical chain is severed. The original brain is destroyed. Even if the chip behaves identically, it is a *copy*, not a continuation. You feel he died because, under this principle, he *did*.
      *   **Kills Case 5 (Simulation):** If the simulation is a copy of the brain's data running on new hardware, Continuity says the original Einstein is dead; the simulation is a new entity with Einstein's memories.
  *   **The Cost:** This principle forces you to reject **Case 5** (as *Einstein*) and **Case 10**. It also makes **Case 6** shaky (if the paper simulation is too slow or disjointed, does the continuity of "experience" break?).

  ---

  ### The Conflict: What You Have to Drop

  You currently hold:
  *   **Case 5 (Sim):** Yes (Functionalism)
  *   **Case 8 (Gradual):** Yes (Both)
  *   **Case 9 (Instant):** No (Continuity)

  **You cannot keep all three.**
  If the end state of Case 8 and Case 9 is physically and functionally identical (a brain-shaped chip in a skull), the only difference is the *history* of how it got there.
  *   If history matters (Case 9 = No), then you are a Continuity theorist. You must admit that Case 5 is also a "No" (the simulation is a copy, not Einstein).
  *   If structure matters (Case 5 = Yes), then you are a Functionalist. You must admit that Case 9 is a "Yes" (the swap doesn't kill him, any more than replacing a neuron does).

  **Most analytic philosophers (e.g., Derek Parfit, Daniel Dennett) will tell you to drop your verdict on Case 9.** They argue that "survival" is just psychological continuity and connectedness. If the psychology continues, you survive. The "instant swap" feels like death only because of a biological bias, not a logical necessity.

  **However,** if you drop Case 5 instead, you align with **Biological Naturalism** (e.g., John Searle). This view says consciousness is a biological feature like digestion. A simulation of a storm doesn't get the floor wet; a simulation of a brain doesn't feel pain. This saves Case 9 (Death) but kills Case 5 (Sim) and Case 10 (Alien).

  ---

  ### Predictions for New Cases

  Here is how the two principles handle the scenarios you asked about, assuming you pick one lane.

  **Scenario A: Two copies of the same emulation started at once.**
  *   **Functionalism:** There are now **two** conscious beings. They share a past but diverge immediately. Both have equal claim to be "Einstein."
  *   **Continuity:** The **original** is wherever the original physical substrate is (if it exists). The copy is a new being. If the original was destroyed to make the copy, the original is dead, and the copy is a new person with old memories.

  **Scenario B: A brain emulation switched off for 500 years, then resumed.**
  *   **Functionalism:** **Yes, he survives.** Consciousness is a state, not a stream. If the causal structure is preserved on the hard drive (dispositionally), restarting it resumes the mind. The gap in time is irrelevant (like dreamless sleep).
  *   **Continuity:** **No (or shaky).** The physical process stopped. The chain of causation was broken for five centuries. When it restarts, it is a new entity initialized with old data.

  ---

  ### Consensus vs. Controversy

  You asked for plain talk on what is agreed upon.

  1.  **There is zero consensus on consciousness.** There is no "Standard Model" of mind. Neuroscientists correlate brain activity with reports of consciousness, but they do not agree on *why* that activity constitutes experience.
  2.  **Functionalism is the "Working Hypothesis" of AI and Cognitive Science.** Practitioners *act* as if Principle 1 is true. They assume that if they replicate the computation, they replicate the mind. This is a pragmatic assumption, not a proven fact.
  3.  **The "Hard Problem" is still hard.** Everyone agrees that explaining *behavior* (input/output) is easier than explaining *experience* (what it feels like). Your Case 3 (Chinese Room) is the famous argument that behavior isn't enough. There is no agreed-upon solution to this.
  4.  **Personal Identity is likely not a "fact of the matter."** Many philosophers (following Parfit) argue that your question "Is it *really* him?" has no true answer in Cases 8 and 9. It's like asking "Is this the same river after we replaced all the water?" It depends on how you define "same." The universe doesn't care; only your definitions do.

  ### Summary Recommendation

  You are groping for a **Process Theory of Mind**.

  Your intuition on Case 6 (Slow Sim = Yes) vs. Case 7 (Static Cards = No) is the strongest clue. You believe consciousness is a **verb**, not a noun. It is the *happening* of the computation, not the *storage* of the states.

  **To resolve your circles:**
  1.  **Adopt Counterfactual Functionalism.** Accept that "running" means having the causal power to react to changes (Case 5 & 6 = Yes, Case 3 & 7 = No).
  2.  **Accept the consequence on Case 9.** If you accept that the *structure* makes the mind, you must accept that preserving the structure preserves the mind, regardless of speed or replacement method. If you don't, you are prioritizing "magic dust" (biological continuity) over causal reality.
  3.  **Drop the idea that Case 9 is death.** It is the most emotionally difficult but logically weakest link in your chain. It relies on a feeling of "self" that cannot be located in the physics of Case 8.

  If you cannot bring yourself to say Case 9 is survival, you must admit you are a **Biological Naturalist**. In that case, you must also say Case 5 (Simulation) is *not* Einstein, but merely a very good puppet. You cannot have it both ways.
