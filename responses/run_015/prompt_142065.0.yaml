  7.  **Drafting the Response:**
      *   *Structure:* Executive Summary -> The Ranking (with detailed analysis per item) -> The "Decline" List -> The Missing Question -> Evidence Triggers.
      *   *Tone:* Professional, critical, strategic. Avoid hype. Focus on "conceptual leverage."
