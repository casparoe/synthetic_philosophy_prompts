answer: |-
  This is a high-leverage intervention. The singleton debate has stagnated because it oscillates between sci-fi speculation ("evil AI dictator") and abstract desirability arguments ("is lock-in bad?"). Your six distinctions correctly identify the structural variables that determine *actual* outcomes.

  However, four researchers for two years cannot solve all six. They must produce a *research agenda*, which means their primary task is to determine which questions are tractable and consequential for the wider field. They need to carve the problem space such that future funding flows to the highest-leverage conceptual gaps.

  Here is my advised ordering, assessment, and explicit funding recommendations.

  ### The Core Triad (Fund These)

  These three distinctions form the necessary ontology, normative target, and strategic map for a singleton research agenda. They should be treated as interlocking workstreams, not isolated projects.

  #### 1. Protocol versus Agent (Priority: 1)
  *   **Downstream Impact:** Extremely High. This defines the *object* of study. If the singleton is a protocol (e.g., a compute-attestation layer), the relevant literature shifts from political philosophy to mechanism design and standards governance. If it is an agent, it remains in the realm of sovereign power and control.
  *   **Tractability:** High. There is existing work on "governance by infrastructure" and technical standards regimes. The team can analyze current trends in AI compute governance (e.g., KYC for clusters) as a proto-protocol singleton.
  *   **Neglectedness:** High. Most singleton discourse assumes a unitary agent (a state or AI). The idea of a "structural singleton" that no one owns but everyone must use is under-theorized.
  *   **Evidence Shifters:**
      *   *Up:* Major powers agree on a shared API or verification standard for frontier models (e.g., a global compute treaty).
      *   *Down:* Fragmentation of the tech stack (e.g., distinct US vs. China AI ecosystems with no interoperability).
  *   **Verdict:** **Fund.** This is the most critical ontological clarification. It prevents the field from preparing for a *1984* scenario when the risk is a *terms-of-service* scenario.

  #### 2. Custodial versus Sovereign (Priority: 2)
  *   **Downstream Impact:** High. This defines the *normative goal*. If a "Custodial Singleton" (one that preserves option value) is conceptually coherent, the goal shifts from "prevent singleton" to "design custodial institutions." If it is incoherent (the custodian inevitably becomes sovereign), the risk profile spikes.
  *   **Tractability:** Medium-High. This is classical constitutional theory applied to existential risk. The team can analyze historical "trustee" institutions (e.g., central banks, constitutional courts) for drift rates.
  *   **Neglectedness:** Medium. Bostrom touches on value lock-in, but the institutional design of a *deliberately incomplete* singleton is not well-developed.
  *   **Evidence Shifters:**
      *   *Up:* Successful examples of long-term institutions that resisted value drift while holding high power (e.g., a supreme court that successfully corrected its own precedents without collapse).
      *   *Down:* Evidence that high-stakes security environments inevitably force centralization of decision-making (ratcheting effect).
  *   **Verdict:** **Fund.** This addresses the primary moral objection to the singleton hypothesis.

  #### 3. The Pre-Singleton Window (Priority: 3)
  *   **Downstream Impact:** Very High. This defines the *strategy*. This is the bridge between theory and action. It tells funders what to do *now*.
  *   **Tractability:** Medium. It risks becoming policy advocacy. To remain conceptual, the team must focus on *leverage theory*: classifying levers by their "lock-in potential" rather than advocating specific policies.
  *   **Neglectedness:** Low-Medium. Many actors are working on policy, but few are mapping the *theoretical relationship* between present levers and long-term singleton characteristics.
  *   **Evidence Shifters:**
      *   *Up:* Clear signals that concentration is accelerating faster than governance (e.g., one lab achieves decisive strategic advantage).
      *   *Down:* A prolonged period of multipolar stalemate with no clear path to consolidation.
  *   **Verdict:** **Fund,** but with a strict constraint: The output must be a *typology of levers*, not a policy whitepaper.

  ---

  ### The Secondary Tier (Conditional Funding)

  #### 4. Graded rather than Binary (Priority: 4)
  *   **Assessment:** This is a necessary refinement but risks becoming semantic. "How much enforcement counts?" is less important than "What kind of enforcement?" (which is covered by Protocol vs. Agent).
  *   **Recommendation:** Do not fund as a standalone project. It should be a *methodological constraint* applied to the other three projects. The team must assume singletonhood is graded in their modeling, but they should not spend 6 months defining the gradient.
  *   **Evidence Shifter:** If a "near-singleton" actor fails to prevent a major defection (e.g., a rogue state or lab bypasses controls), it proves the gradient matters more than the binary status.

  #### 5. Singleton by Accretion (Priority: 5)
  *   **Assessment:** This is descriptive rather than prescriptive. While likely true, it offers low leverage for a research agenda aimed at *changing effort allocation*. If the answer is "it happens by accident," the agenda is "study history." If "it can be steered," that is Item #3 (Pre-Singleton Window).
  *   **Recommendation:** **Do not fund as a primary track.** Use it as a background assumption check. The team should spend 2 weeks assessing whether design is possible; if they conclude it is not, the grant should be terminated or pivoted to historical analysis.
  *   **Evidence Shifter:** Emergence of de facto standards without any international treaty (e.g., a specific cloud provider becomes the unavoidable bottleneck).

  ---

  ### The Decline List (Pseudo-Questions or Redundant)

  #### 6. The Corrigibility of the Singleton Itself (Priority: 6 — DECLINE)
  *   **Reasoning:** This is a **pseudo-question** in this context because it is subsumed by **Custodial versus Sovereign**.
      *   "Corrigibility" is the technical mechanism; "Custodial" is the institutional instantiation.
      *   Funding a project on "corrigibility" invites the team to drift into AI alignment technicalities (how to make a system editable) rather than political theory (who holds the edit button and under what constraints).
      *   It creates a false dichotomy: A singleton can be corrigible to a *constitution* without being corrigible to *actors*. Item #3 captures this distinction better.
  *   **Decision:** **Decline funding even for a strong candidate.** Direct them to merge this line of inquiry into the Custodial workstream. It duplicates effort and dilutes the political theory focus.

  ---

  ### The Missing Question

  There is a critical conceptual gap in your list. You are assuming the singleton is the *only* solution to coordination problems under advanced technology. You need to test the counterfactual.

  #### 7. The Feasibility of Robust Multipolarity (Priority: 3.5 — INSERT HERE)
  *   **The Question:** Under conditions of high-leverage technology (where defection is catastrophic), is a stable multipolar equilibrium *conceptually possible*? Or does the technology necessarily force a singleton (via first-mover advantage or arms race dynamics)?
  *   **Why it matters:** If robust multipolarity is theoretically impossible under certain tech conditions, then the "prevent singleton" strategy is incoherent. The agenda must then focus entirely on *shaping* the singleton (Items 1 & 2). If multipolarity *is* possible, the agenda shifts to *sustaining* it.
  *   **Tractability:** Medium. Requires game-theoretic modeling and historical analysis of stability under high-stakes conditions (e.g., nuclear deterrence as a partial analog).
  *   **Recommendation:** **Fund.** This is the "steelman" against the singleton hypothesis. A research agenda that does not address the feasibility of the alternative is incomplete. It belongs alongside the Core Triad.

  ---

  ### Strategic Advice for the 2-Year Timeline

  With 4 FTEs for 2 years, you cannot produce deep solutions to all these problems. You are buying a *map*, not a *vehicle*.

  1.  **Structure the Team:**
      *   **Researcher A (Ontology):** Focuses on **Protocol vs. Agent**. Maps the technical infrastructure of coordination.
      *   **Researcher B (Norms):** Focuses on **Custodial vs. Sovereign** and **Corrigibility (merged)**. Analyzes institutional drift and constitutional design.
      *   **Researcher C (Strategy):** Focuses on **Pre-Singleton Window** and **Robust Multipolarity**. Models the transition dynamics and leverage points.
      *   **Researcher D (Synthesis):** Focuses on **Graded** (as a methodological check) and **Accretion** (as a risk factor). Their job is to integrate A, B, and C into the final *Defended Research Agenda*.

  2.  **The Deliverable:**
      *   Do not accept a list of "open questions."
      *   Require a **Decision Tree for Funders**. Example: *If X trend is observed (Protocol), fund Y type of institutional design. If Z trend is observed (Accretion), fund Z type of monitoring.*
      *   The agenda must explicitly state which current funding priorities are *misallocated* based on their findings.

  3.  **Risk Management:**
      *   **Speculation Risk:** The biggest risk is that the team produces political philosophy disconnected from technical reality.
      *   **Mitigation:** Require quarterly "reality checks" with external technical advisors (not ML researchers, but governance/infrastructure experts) to ensure the "Protocol" and "Pre-Singleton" concepts match actual industry trajectories.

  ### Summary Ranking for Allocation

  1.  **Protocol versus Agent** (Foundational)
  2.  **Custodial versus Sovereign** (Normative Core)
  3.  **Feasibility of Robust Multipolarity** (Critical Counterfactual — *New*)
  4.  **The Pre-Singleton Window** (Strategic Output)
  5.  **Graded rather than Binary** (Methodological Constraint)
  6.  **Singleton by Accretion** (Background Context)
  7.  **Corrigibility of the Singleton** (**Decline** — Redundant)

  If you fund the top four (including the new multipolarity question) and enforce the merger of Corrigibility into Custodial, you will purchase a significant upgrade in the field's strategic clarity. If you fund Corrigibility separately, you will likely receive a rehash of AI alignment arguments that do not help institutional designers.
