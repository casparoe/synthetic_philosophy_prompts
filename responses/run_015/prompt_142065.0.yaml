      Actually, looking closer: The group's job is to produce a defended research agenda. So they need to figure out *which questions are worth asking*.
      Therefore, the priority should be on distinctions that *carve the problem space* most effectively for future researchers.
      #1 (Protocol) carves the *structure*.
