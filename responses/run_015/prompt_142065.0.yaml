      These are the three pillars of a research agenda: What is it? What do we want? How do we get there?

      *Re-evaluating Item 5 (Corrigibility):* Is it redundant? Corrigibility is usually an AI alignment term. Applying it to a political singleton is distinct. However, "Custodial" covers the institutional mechanism for corrigibility. I will stand by merging 5 into 3.

      *Re-evaluating Item 4 (Accretion):* If the singleton emerges by accretion, then "design" (Item 1 & 3) is less relevant. This is a fundamental uncertainty. It shouldn't be declined, but it shouldn't be a primary focus *unless* it undermines the design approach. I'll mark it as a "risk factor" rather than a primary research track.

