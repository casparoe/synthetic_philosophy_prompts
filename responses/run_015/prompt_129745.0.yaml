  # Conditional Authority Protocol (CAP)
  **Execution Time:** 60 Minutes  
  **Purpose:** To resolve conflicts between advance directives (AD) and current patient preferences in cases of cognitive impairment.  
  **Core Logic:** The earlier self's authority binds only when the current preference is inconsistent with the earlier self's values (Outside the Zone). If the current preference is consistent (Inside the Zone), the current preference governs.

  ---

  ### Step 1: Reversibility Check (15 Minutes)
  **Question:** Is the cognitive or affective condition driving the current preference medically reversible within a clinically meaningful timeframe (e.g., < 2 weeks)?  
  **Indicators for Sufficient Answer:**  
  *   **Yes:** Delirium, acute metabolic imbalance, untreated infection, medication toxicity.  
  *   **No:** Advanced neurodegeneration (e.g., late-stage Alzheimer's), treatment-resistant psychiatric chronicity, permanent vegetative state.  
  **Termination:**  
  *   If **Yes**: Terminate. **Recommendation:** Suspend directive and current preference; treat underlying condition.  
  *   If **No**: Proceed to Step 2.  
  **[JUDGMENT POINT]:** Determining "clinically meaningful" requires normative weighting of burden vs. benefit of treatment, not just clinical probability.

  ### Step 2: Biographical Triangulation (25 Minutes)
  **Question:** Does the current preference align with at least two independently documented values from distinct life stages (excluding the directive itself)?  
  **Indicators for Sufficient Answer:**  
  *   **Aligns (Inside Zone):** Current preference matches prior letters, religious records, lifestyle choices, or witnessed conversations from *both* early and late adulthood.  
  *   **Does Not Align (Outside Zone):** Current preference contradicts documented values, or documentation exists from only one life stage, or records are missing.  
  **Termination:**  
  *   If **Aligns (Inside Zone)**: Proceed to Step 3 (Do not terminate yet; affective congruence must also be checked to confirm Zone status).  
  *   If **Does Not Align (Outside Zone)**: Proceed to Step 3 (Potential Directive Authority).  
  **[JUDGMENT POINT]:** Deciding what counts as "independent documentation" (e.g., is a casual comment to a neighbor equal to a letter to a spouse?) is epistemic, not clinical.

  ### Step 3: Affective Congruence (15 Minutes)
  **Question:** Does the emotional quality of the current state cohere with the narrative implied by the directive (e.g., dignity, avoidance of suffering, autonomy)?  
  **Indicators for Sufficient Answer:**  
  *   **Congruent (Inside Zone):** Patient appears content in a state the directive sought to preserve, or distressed in a state the directive sought to avoid.  
  *   **Incongruent (Outside Zone):** Patient appears content in a state the directive deemed undignified, or distressed in a state the directive deemed acceptable.  
  **Termination:**  
  *   If **Congruent + Biographical Alignment (Inside Zone)**: Terminate. **Recommendation:** Follow Current Preference.  
  *   If **Incongruent OR Biographical Misalignment (Outside Zone)**: Proceed to Step 4.  
  **[JUDGMENT POINT]:** Interpreting "contentment" vs. "dignity" requires normative ethical judgment; clinical observation alone cannot define dignity.

  ### Step 4: Zone Determination & Recommendation (5 Minutes)
  **Question:** Does the current preference fall outside the reconstructible zone of consistency with the earlier self's values?  
  **Logic:**  
  *   **Outside Zone** (Inconsistent Values + Incongruent Affect): The earlier self's authority remains intact because the current self is acting alien to their values.  
  *   **Inside Zone** (Consistent Values + Congruent Affect): The earlier self's authority dissolves into the current self's agency.  
  **Termination:**  
  *   If **Outside Zone**: **Recommendation:** Honor Advance Directive.  
  *   If **Inside Zone**: **Recommendation:** Follow Current Preference.  
  **[JUDGMENT POINT]:** Weighing the severity of the inconsistency (e.g., is a minor deviation enough to break authority?) is a normative committee decision.

  ---

  ### Application to Cases

  **Case 1: 74-Year-Old with Alzheimer's**  
  *   **Step 1 (Reversibility):** Irreversible neurodegeneration. (Proceed)  
  *   **Step 2 (Triangulation):** Family states she prioritized autonomy. Current preference (eating) is consistent with biological drive but inconsistent with specific directive condition (no recognition = no food). Documentation of "autonomy" vs. "comfort" is conflicting. (Ambiguous/Outside Zone)  
  *   **Step 3 (Affect):** Patient appears content. Directive implies avoiding undignified dependence. Contentment in dependence is incongruent with the directive's narrative of dignity. (Outside Zone)  
  *   **Step 4 (Recommendation):** Outside Zone -> **Honor Advance Directive (Stop Artificial Nutrition).**  
  *   **Note:** This aligns with your opposing view to the friend.

  **Case 2: 61-Year-Old with Recurrent Depression**  
  *   **Step 1 (Reversibility):** Episode is treatable, but refusal blocks treatment. Condition is chronic/recurrent. (Proceed)  
  *   **Step 2 (Triangulation):** Directive says "Refuse Meds." Current says "Refuse Meds." However, prior remissions document gratitude for *override*. This suggests true values align with override, making current refusal inconsistent with true values. (Outside Zone)  
  *   **Step 3 (Affect):** Patient is in severe depression (distressed). Directive seeks to prevent episode-driven decisions. Congruence is complex; distress validates the directive's intent but current refusal enforces the distress. (Outside Zone)  
  *   **Step 4 (Recommendation):** Outside Zone -> **Honor Advance Directive (Refuse Medication).**  
  *   **Note:** This is the **unwelcome recommendation**. Despite psychiatric evidence that overriding her saves her life and earns her gratitude, the procedure prioritizes the documented directive over the clinical narrative of "true values" because the triangulation is ambiguous regarding the *current* episode's validity.

  ---

  ### Limitations and Misfires
  **What the Procedure Cannot Settlement:**  
  1.  **Equal Legal Standing Conflicts:** If family members disagree on the biographical triangulation (e.g., one sibling claims she valued autonomy, another claims she valued life), the procedure halts at Step 2. This requires legal mediation, not ethics consultation.  
  2.  **Ambiguous Thresholds:** If the directive says "no artificial nutrition if I cannot recognize family," but the patient recognizes *some* family, the procedure cannot resolve the threshold without normative interpretation of "recognize."  
  3.  **Missing Records:** If biographical records are missing (common in marginalized populations), Step 2 defaults to "Outside Zone," potentially over-riding current preferences unfairly.  

  **Specific Misfires:**  
  *   **The "Happy Dementia" Misfire:** In Case 1, the procedure may recommend stopping nutrition despite current contentment. This privileges the past self's abstract values over the present self's experiential welfare, which many contemporary ethicists find objectionable.  
  *   **The "Ulysses Contract" Misfire:** In Case 2, the procedure may enforce refusal of treatment even when the patient's "true self" (in remission) requested override. The tool struggles when the directive contradicts the meta-directive (the wish to be overridden).

  Summary: The procedure honors an advance directive only when the patient's current preference lies outside a reconstructible zone of consistency with the earlier self's values, after checking reversibility, biographical triangulation, and affective congruence, and it explicitly marks where clinical facts end and normative judgment must take over.
