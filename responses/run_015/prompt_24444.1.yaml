  8.  **Self-Correction/Check during drafting:**
      *   *Did I answer the specific questions?* Yes (kind of disagreement, progress).
      *   *Is the distinction between "hard" and "wrong kind" clear?* Yes, this is the Williams objection.
      *   *Did I address the "verbal" possibility?* Yes, dismissed it as too shallow.
      *   *Did I address the "factual" possibility?* Yes, noted that they agree on what the theory says.
      *   *Is the advice practical?* Yes, suggest changing the topic from "how much" to "what kind of life."

  9.  **Final Polish:** Ensure references to Williams, Scheffler, and Singer are contextually appropriate without being name-droppy. (Decided to explicitly name Williams as it gives the user a handle for further research). Emphasize that this is a classic, unresolved debate in ethics.

  **(Self-Correction Note):** Make sure not to dismiss the friend's view as "wrong." The prompt asks for a diagnosis, not a verdict. The friend's view (Singer-style) is philosophically robust. The goal is to map the terrain, not conquer it.

