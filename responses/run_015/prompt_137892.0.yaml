  2.  **Analyze the Assignment Prompt:**
      *   **Topic:** Spandrels critique of adaptationism (Gould & Lewontin, 1979).
      *   **Audience:** General reader.
      *   **Constraint:** No caricature.
      *   **Length:** Max 400 words.
      *   **Requirements:**
          1.  Explain the critique.
          2.  Give one biological example of a spandrel.
          3.  State what would have to be true for that example to work.

  3.  **Analyze the Student's Answer:**
      *   **Word Count:** Looks to be around 280-300 words. (Well under the 400 limit).
      *   **Clarity/Style:** Clear, concise, good flow. "Habit of taking each feature..." is a good opening.
      *   **Content - Adaptationism:** Defined reasonably well ("habit of taking each feature...").
      *   **Content - Spandrels:** Explains the architectural metaphor well.
      *   **Content - By-products:** Identifies them as non-adaptive by-products of constraints/development.
      *   **Content - Selection on Spandrels:** *Critical Error.* The student writes: "since a spandrel is by definition not a product of selection, it is invisible to selection and can never afterwards be shaped or refined by it." This is scientifically incorrect. Spandrels *can* be co-opted later (exaptation), but the initial claim that they are "invisible to selection" and "never afterwards be shaped" contradicts the very concept of exaptation they mention in the next sentence.
      *   **Content - Exaptation:** "spandrel and exaptation are really two names for the same thing, just viewed at different stages." This is a common simplification but slightly muddies the water. A spandrel is the *origin* (non-adaptive by-product). An exaptation is the *current utility* (co-opted for a new use). They aren't exactly "two names for the same thing."
      *   **Example:** Male nipples. Classic example. Good for general readers.
      *   **Conditions for Example:** "nipples in males are not currently doing any work and did not arise because of anything they did for males." The first part ("not currently doing any work") is problematic. Spandrels *can* have current utility (that's how they become exaptations), but the *origin* must be non-adaptive. If the student claims they are spandrels, they need to emphasize the *origin* constraint, not necessarily current uselessness (though male nipples are largely useless, the definition hinges on origin).
      *   **Conclusion:** Good summary of the paper's intent (pluralism, testing alternatives).

  4.  **Identify Key Issues for Feedback:**
      *   **Strengths:** Clear writing, good structure, captures the architectural metaphor well, good concluding nuance about pluralism.
      *   **Weakness 1 (Major):** The claim that spandrels are "invisible to selection and can never afterwards be shaped." This is factually wrong. Selection can act on variation in spandrels once they exist.
      *   **Weakness 2 (Nuance):** The relationship between spandrel and exaptation. They aren't just "two names." One describes origin, the other describes function.
      *   **Weakness 3 (Example Condition):** The condition "not currently doing any work" is too strict for the definition of a spandrel. A spandrel can become useful (exaptation). The critical condition is about *origin*, not current utility.

  5.  **Drafting the Feedback (Iterative Process):**

      *   *Grade:* It's good but has a significant scientific error. Maybe 15/20 or 16/20? Let's go with 16/20. It's well-written but the core mechanism is slightly misunderstood.
      *   *Marginal Comments:* Need to be specific.
          *   On the "invisible to selection" line: Flag this as incorrect.
          *   On the "exaptation" line: Clarify the distinction.
          *   On the "male nipples" condition: Push back on the "currently doing any work" requirement.
      *   *Overall Comment:* Praise the clarity, address the scientific accuracy.

  6.  **Refining the Feedback for the User:**
      *   The user asked me to act as *them* (the science writer/teacher). So the tone should be mentorship-oriented.
      *   The user specifically asked for "marginal comments I should write back." I should format this clearly so they can copy/paste or adapt.
      *   I need to make sure I don't just say "it's wrong," but explain *why* so the teacher understands the nuance.

      *(Self-Correction during drafting)*: Wait, is the student's claim about selection *completely* wrong? Gould and Lewontin argued that adaptationists assume selection *made* it. If it's a spandrel, selection didn't *make* it. But can selection *refine* it later? Yes. The student says "never afterwards be shaped or refined by it." That is definitely wrong. If a spandrel becomes useful, selection *will* shape it. That's the whole point of exaptation. The student contradicts themselves in the next sentence. I need to highlight this contradiction.

      *(Refining the Example Condition)*: The student says for male nipples to be a spandrel, they must "not currently doing any work." Actually, even if male nipples did something useful (e.g., sensory), they could still be spandrels if they arose due to developmental constraints on females. The key is the *historical origin*. I need to point this out.

  7.  **Finalizing the Output Structure:**
      *   **Overall Grade:** X/20.
      *   **General Impression:** Brief summary.
      *   **Marginal Comments (Section by Section):** Specific text references.
      *   **Key Scientific Corrections:** The "invisible to selection" error and the "exaptation" definition.
      *   **Writing/Style Notes:** Since it's a science writing class, comment on clarity and tone.

  8.  **Final Review against constraints:**
      *   Did I give a mark out of 20? Yes.
      *   Did I give specific marginal comments? Yes.
      *   Did I avoid just saying "good/bad"? Yes.
      *   Is it actionable for the student? Yes.

      *(One last check on the word count)*: The student's answer is well under 400 words. I should mention they had more room to nuance the selection argument.

      *(Tone Check)*: Ensure I sound like a colleague helping a colleague, not an AI lecturing. "Here is how I would grade this..."

      *(Wait, one nuance on Gould/Lewontin)*: Did Gould argue spandrels *cannot* be selected upon later? No, he argued they weren't selected *for* initially. The student's phrasing "invisible to selection and can never afterwards be shaped" is the dealbreaker. I must emphasize this.

      *(Exaptation vs Spandrel)*: Gould & Vrba (1982) defined exaptation. A spandrel is a specific *type* of non-adaptive feature (architectural byproduct). An exaptation is a feature co-opted for a new use. A spandrel *can become* an exaptation. They are not "two names for the same thing." This is a conceptual conflation.

