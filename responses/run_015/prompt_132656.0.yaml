prompt: |-
  I am writing a novel, and before I commit to the mechanics of the machine at its centre I want a specification rather than a survey. What I need from you is the desiderata: a list of what any account of backwards time travel in fiction would have to deliver to be good enough to underwrite four hundred pages — the cases it must resolve, the distinctions it must respect, the constraints it may not violate — with the scene or consideration behind each requirement, and a judgement about which requirements are non-negotiable and which are merely the prejudices of one camp or another. The purpose is fixed: I need rules a reader can infer from scenes rather than be told in an exposition chapter, rules that yield a determinate verdict at the end of any given scene about whether the intervention worked, and rules under which a character can be wrong about the mechanics and be surprised. Bear that purpose in mind when you decide what counts as a requirement.

  Below are the scenes I already know I want to write. For each, tell me what requirement it generates, and add the requirements I have not anticipated.

  My protagonist travels back to prevent a fire in which her brother died. She succeeds in the sense that the brother lives, yet the act by which she prevents it — cutting a wire, breaking a window, delaying a driver — is the act that starts it. Did the past change?

  She remembers the fire. Once she has intervened, does she still? If the timeline is overwritten rather than branched, whose memories does she carry, and is there any way for her to know that her intervention failed?

  The machine has a bounded range: certain years simply are not there to be reached. Is the boundary a fact about the machine, about the geometry of time, or about what is logically available? I need to know what fixes the reachable set, because I want the limit to feel like a discovery and not a manufacturer's specification.

  An object with no origin: a score my protagonist carries back to a composer who will later publish it, and which she copied from that publication. Is this the same problem as the grandfather case or a different one in kind, and must a theory handle them by the same device?

  The crowded room: she meets her younger self and they disagree about what to do. Which of them bears responsibility for what follows, and what should happen when the younger one later makes the trip herself?

  The slow news: if the past is altered, does the alteration reach her departure date at once, or only as she travels forward along her own worldline? Can the present she left be edited while she is still in the past, and can she be erased retroactively while still acting?

  The abandoned: on a branching account, what becomes of the people in the branch she leaves behind? I need to know whether her act is a killing, an abandonment, or nothing at all, since the moral weight of the book rests on the answer.

  Deliberation: on a fixed-timeline account, is trying still coherent? Can she deliberate about an outcome that is settled either way, and what in the prose should convey that her effort is real rather than illusory?

  Two further constraints, which I take to be external rather than optional. First, the theory must say what "going back to 1889" means given that the physics we actually have denies a global present; the date cannot be a bare fact about the universe. Second, it must give some account of the asymmetry between the directions — why travelling forward is trivially available while travelling back is the thing that needs a machine — or else explain why the asymmetry is only apparent.

  Once the list is assembled, tell me which pairs of desiderata you suspect cannot be jointly satisfied, and say plainly if the list itself turns out to be the real result here; that is the part I most want to see. Then tell me which single requirement does the most work in excluding candidates — which one, if I insisted on it, would collapse my options fastest. Close with a brief scorecard, no more than a few lines each, for the three familiar families: the fixed or self-consistent timeline, the branching timeline, and the overwritten or erased timeline. Keep the weight on the criteria and their motivating cases; I can extend the scoring myself.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Goal:** The user is writing a novel centered on a time travel machine. They need a *specification* (desiderata list) for the mechanics of time travel, not a survey of existing theories.
      *   **Purpose:** The rules must support 400 pages, be inferable from scenes (not exposition), yield determinate verdicts on intervention success, and allow characters to be wrong/surprised.
      *   **Input:** The user provides specific scenes they intend to write (Fire/Prevention, Memory, Bounded Range, Bootstrap Paradox/Score, Meeting Self, Slow News/Erasure, Abandoned Branches, Deliberation/Fate) plus two external constraints (Relativity/Global Present, Temporal Asymmetry).
      *   **Output Requirements:**
          1.  Derive requirements from the provided scenes.
          2.  Add unanticipated requirements.
          3.  Label requirements as Non-Negotiable vs. Prejudice.
          4.  Identify incompatible pairs of desiderata.
          5.  Assess if the list *is* the result (meta-commentary).
          6.  Identify the single most exclusionary requirement.
          7.  Provide a brief scorecard for the three familiar families (Fixed, Branching, Overwritten).
      *   **Tone:** Analytical, precise, literary-philosophical, respectful of the craft.

  2.  **Deconstruct the Scenes & Derive Requirements:**

      *   *Scene 1: Fire/Prevention (Causal Loop/Paradox).* She prevents the fire but causes it.
          *   *Requirement:* **Causal Closure.** The system must account for self-consistent loops vs. contradictory changes.
          *   *Verdict:* Needs to decide if "change" is possible or if the attempt *is* the cause.

      *   *Scene 2: Memory.* She remembers the fire. Does she keep the memory if the timeline changes?
          *   *Requirement:* **Memory Persistence vs. Overwrite.** How does subjective experience track ontological change?
          *   *Verdict:* Crucial for character arc. If memories overwrite, she loses the motive. If they persist, she carries trauma from a non-existent past.

      *   *Scene 3: Bounded Range.* Certain years unreachable.
          *   *Requirement:* **Topological Constraints.** The limit must be diegetic (part of the world's logic), not just technical.
          *   *Verdict:* Needs a metaphysical or physical reason (e.g., entropy, creation of the machine, logical consistency).

      *   *Scene 4: Bootstrap Paradox (The Score).* Object with no origin.
          *   *Requirement:* **Information Conservation.** Does information need an origin?
          *   *Verdict:* Distinct from Grandfather paradox. Grandfather is about contradiction; Bootstrap is about originlessness.

      *   *Scene 5: Crowded Room (Meeting Self).* Two versions interact.
          *   *Requirement:* **Identity & Co-location.** How does the universe handle duplicate matter/consciousness?
          *   *Verdict:* Responsibility attribution.

      *   *Scene 6: Slow News.* When does the change propagate?
          *   *Requirement:* **Update Latency.** Is time travel instantaneous across the timeline or does it ripple?
          *   *Verdict:* Determines tension. Can she be erased mid-sentence?

      *   *Scene 7: The Abandoned (Branching).* Moral weight of leaving a timeline.
          *   *Requirement:* **Ontological Continuity.** Do abandoned branches cease to exist or persist independently?
          *   *Verdict:* Moral stakes. Is it murder or just leaving a room?

      *   *Scene 8: Deliberation.* Can she try if the outcome is fixed?
          *   *Requirement:* **Agency Compatibility.** Can free will coexist with determinism?
          *   *Verdict:* Essential for character motivation.

      *   *External 1: Relativity.* No global present.
          *   *Requirement:* **Frame of Reference.** "1889" must be defined relative to something (the machine? the traveler?).
          *   *Verdict:* Hard physics constraint.

      *   *External 2: Asymmetry.* Why is forward easy, back hard?
          *   *Requirement:* **Thermodynamic/Entropic Explanation.**
          *   *Verdict:* Plausibility anchor.

  3.  **Drafting the Desiderata (Iterative Refinement):**
      *   *Refinement:* The user wants *requirements*, not just questions. I need to phrase them as "The system must..."
      *   *Refinement:* Distinguish between "Non-Negotiable" (logic-breaking if violated) and "Prejudice" (aesthetic/philosophical choice).
      *   *Refinement:* Ensure the "inferable from scenes" constraint is met. The rules can't be told, they must be shown.

  4.  **Identifying Conflicts (The "Hard Part"):**
      *   *Conflict 1:* Memory Persistence vs. Overwritten Timeline. If the past changes, why do *you* remember the old one? This is the classic "Back to the Future" logic hole.
      *   *Conflict 2:* Deliberation vs. Fixed Timeline. If it's fixed, deliberation is illusory. Making it feel real is a narrative trick, but logically tense.
      *   *Conflict 3:* Relativity vs. Global Date. "1889" implies a universal clock. Physics says no. The machine must create a local frame.
      *   *Conflict 4:* Moral Weight (Abandoned) vs. Branching. If branches persist, she didn't kill them. If they vanish, she did. You can't have both high moral stakes *and* safe branching without cognitive dissonance.

  5.  **Selecting the "Most Exclusionary" Requirement:**
      *   Which one kills the most theories?
      *   "Memory Persistence in an Overwritten Timeline" is physically incoherent in most single-timeline models.
      *   "Agency in a Fixed Timeline" is philosophically difficult but narratively manageable.
      *   "Relativity/No Global Present" kills most pop-culture time travel instantly.
      *   *Decision:* The **Relativity/Global Present** constraint is the hardest physics hurdle. However, for *narrative* coherence, **Memory Persistence vs. Ontological Change** is the biggest logical trap. Let's look at the prompt again: "rules a reader can infer... determinate verdict."
      *   Actually, the **Update Latency (Slow News)** combined with **Overwritten Timeline** is the killer. If the timeline is overwritten, the traveler usually shouldn't exist to see the change. If they do, it implies a "protected observer" status which breaks the internal logic.
      *   *Better Choice:* **The Definition of "Change."** Does the past *change* (Overwrite) or does the traveler *move* (Branching/Fixed)? This is the root.
      *   *Best Choice for "Exclusionary":* **Memory Persistence in a Single Timeline.** It demands a metaphysical exception for the traveler that contradicts the physical rule of the overwrite. It forces a "Dual Ontology" (Physical world changes, Mental world doesn't).

  6.  **Scoring the Three Families:**
      *   *Fixed (Novikov):* Good for loops, bad for agency/change.
      *   *Branching (Many Worlds):* Good for change/safety, bad for moral stakes (abandoned branches).
      *   *Overwritten (Back to the Future):* Good for stakes, bad for logic/memory.

  7.  **Review against Constraints:**
      *   Did I answer the specific scenes? Yes.
      *   Did I add unanticipated requirements? Need to ensure I add a few (e.g., Energy Cost, Localization).
      *   Is the tone right? Needs to be sharp, not hand-holding.
      *   Did I address the "list itself is the result" point? Yes.

  8.  **Final Polish:**
      *   Check the "Non-Negotiable vs. Prejudice" tagging.
      *   Ensure the "Relativity" constraint is handled carefully (it's hard sci-fi vs. fantasy).
      *   Make sure the "Scorecard" is brief.

  *(Self-Correction during drafting)*: I need to be careful not to solve the problems for the user, but to define the *requirements* the solution must meet. The prompt asks for "desiderata," not a solution.
  Also, the prompt asks: "tell me which pairs of desiderata you suspect cannot be jointly satisfied." I need to highlight the tensions.
  And: "say plainly if the list itself turns out to be the real result here." I should acknowledge that a perfect system doesn't exist, only a consistent set of trade-offs.

  Let's organize the requirements by the scenes provided, then add the missing ones.

  *Scene 1 (Fire):* Requirement of Causal Consistency.
  *Scene 2 (Memory):* Requirement of Subjective Continuity.
  *Scene 3 (Range):* Requirement of Topological Boundary.
  *Scene 4 (Score):* Requirement of Informational Conservation.
  *Scene 5 (Self):* Requirement of Identity Distinction.
  *Scene 6 (News):* Requirement of Propagation Speed.
  *Scene 7 (Abandoned):* Requirement of Ontological Status.
  *Scene 8 (Deliberation):* Requirement of Phenomenological Agency.
  *Ext 1 (Relativity):* Requirement of Frame Specificity.
  *Ext 2 (Asymmetry):* Requirement of Entropic Gradient.

  *Unanticipated:*
  *   *Energy/Mass:* Where does the mass come from/go?
  *   *Localization:* Does she arrive in the same *place* (considering earth moves)?
  *   *Interaction Limit:* Can she touch things?

  *Non-Negotiable:* Logic consistency, Frame Specificity (if claiming hard sci-fi).
  *Prejudice:* Moral weight of branches, Memory persistence mechanism.

  *Conflicts:* Memory vs. Overwrite. Agency vs. Fixed. Relativity vs. "1889".

  *Most Exclusionary:* Subjective Continuity in an Overwritten Timeline.

  *Scorecard:* Keep it tight.

  Let's write it.cw
answer: |-
  Here is the specification of desiderata derived from your scenes and constraints. They are phrased as functional requirements for the narrative mechanics. Each is tagged as **Non-Negotiable** (logical coherence collapses without it) or **Prejudice** (aesthetic/philosophical choice that defines the *kind* of story, but not necessarily a broken one).

  ### I. Desiderata Derived from Scenes

  **1. The Causal Closure Requirement (From: The Fire)**
  *   **Scene:** The act of prevention is the act of causation.
  *   **Requirement:** The system must define whether causal loops are stable states or unstable contradictions. If stable, the system must prevent the *appearance* of choice where none exists. If unstable, the system must define the mechanism of resolution (explosion? bounce? branch?).
  *   **Status:** **Non-Negotiable.** You cannot have a contradiction without a resolution rule.
  *   **Inference:** The reader infers this when the protagonist's attempt to cut the wire physically jams the cutter, or when the wire she cuts sparks the fire.

  **2. The Subjective Continuity Requirement (From: Memory)**
  *   **Scene:** She remembers the fire after preventing it.
  *   **Requirement:** The system must account for the traveler's immunity to ontological overwriting. If the past changes, the traveler's neural state must be exempt from the update, or the traveler must cease to exist.
  *   **Status:** **Prejudice.** (Most "overwritten" timelines violate physics here, but it is a standard trope. A hard system would demand she forgets or vanishes.)
  *   **Inference:** She speaks of the fire as history; her brother looks at her like she's mad.

  **3. The Topological Boundary Requirement (From: Bounded Range)**
  *   **Scene:** Certain years are unreachable.
  *   **Requirement:** The limit must be defined by a property of the *destination*, not the *vehicle*. (e.g., "Time does not exist before X" vs. "The fuel tank is empty").
  *   **Status:** **Non-Negotiable.** If it is a fuel limit, it is engineering, not metaphysics. To feel like a discovery, it must be a property of the terrain.
  *   **Inference:** The machine registers "Null" or "Void" rather than "Out of Range."

  **4. The Informational Conservation Requirement (From: The Score)**
  *   **Scene:** The bootstrap paradox (score with no origin).
  *   **Requirement:** The system must declare whether information requires a genesis. If yes, the loop is forbidden. If no, the loop is a permissible closed curve.
  *   **Status:** **Prejudice.** Physics suggests information cannot be created/destroyed, but originless information violates causality.
  *   **Inference:** A musicologist notes the manuscript has no drafts, no corrections, as if it were transcribed from memory.

  **5. The Identity Distinction Requirement (From: The Crowded Room)**
  *   **Scene:** Meeting the younger self.
  *   **Requirement:** The system must define the ontological status of the duplicate. Are they two distinct entities sharing a history up to point T, or is one the "true" instance and the other an intruder?
  *   **Status:** **Non-Negotiable.** Responsibility cannot be assigned if identity is fluid.
  *   **Inference:** The younger self feels a visceral repulsion or attraction; the older self knows the younger's thoughts but not her immediate intentions.

  **6. The Propagation Latency Requirement (From: The Slow News)**
  *   **Scene:** When does the change reach the future?
  *   **Requirement:** The system must specify the speed of "reality update." Is it instantaneous (God's eye view) or light-speed limited (traveling along the worldline)?
  *   **Status:** **Non-Negotiable.** This determines tension. If instantaneous, she can be erased mid-sentence. If limited, she has a grace period.
  *   **Inference:** A newspaper headline changes in her hand, or she returns to a future that hasn't "heard" the news yet.

  **7. The Ontological Status Requirement (From: The Abandoned)**
  *   **Scene:** Moral weight of leaving a branch.
  *   **Requirement:** The system must define the persistence of the origin timeline. Does it continue without her (Branching), or did her departure collapse it (Overwrite)?
  *   **Status:** **Prejudice.** This is the moral core of your book.
  *   **Inference:** She finds a grave in the new timeline that wasn't there before, or she hears a scream from the "closed" door of the machine.

  **8. The Phenomenological Agency Requirement (From: Deliberation)**
  *   **Scene:** Trying in a fixed timeline.
  *   **Requirement:** The prose must support the *feeling* of choice even if the *outcome* is determined. The mechanics must allow for uncertainty in the moment of action.
  *   **Status:** **Non-Negotiable.** Without this, the protagonist is a puppet, and the novel is a report.
  *   **Inference:** She sweats, hesitates, weighs options, even if the reader later sees these were inevitable steps.

  **9. The Frame Specificity Requirement (From: Relativity)**
  *   **Constraint:** No global present.
  *   **Requirement:** "1889" must be defined relative to a specific clock (the machine's? the Earth's? the traveler's biological decay?).
  *   **Status:** **Non-Negotiable.** (Given your external constraint).
  *   **Inference:** The machine requires calibration to a specific celestial event or atomic decay rate, not just a calendar date.

  **10. The Entropic Gradient Requirement (From: Asymmetry)**
  *   **Constraint:** Forward is easy, back is hard.
  *   **Requirement:** The system must explain the energy cost differential. Moving forward rides the wave; moving back swims against it.
  *   **Status:** **Non-Negotiable.** (Given your external constraint).
  *   **Inference:** The machine generates immense heat or requires exotic matter to move backward, but coasts forward.

  ### II. Unanticipated Requirements

  **11. The Localization Requirement**
  *   **Consideration:** Earth moves through space. "1889" implies a location.
  *   **Requirement:** The machine must compensate for spatial displacement. Does she arrive in 1889 London, or 1889 empty space where London will be?
  *   **Status:** **Non-Negotiable.**
  *   **Inference:** She arrives suffocating in vacuum, or the machine locks onto gravitational wells.

  **12. The Mass-Energy Exchange Requirement**
  *   **Consideration:** Conservation of mass.
  *   **Requirement:** When she arrives in the past, does the total mass of the universe increase? If so, where does the energy come from?
  *   **Status:** **Prejudice.** (Hard sci-fi demands conservation; space opera ignores it).
  *   **Inference:** Localized gravity spikes upon arrival; or the machine draws power from the destination era.

  ### III. Incompatible Pairs

  You cannot satisfy all of these simultaneously. The following pairs create logical friction that usually forces a choice between "Hard Physics" and "Narrative Convenience."

  1.  **Subjective Continuity (2) vs. Overwritten Timeline (7).**
      *   *Conflict:* If the timeline is overwritten, the version of you that left no longer exists. For you to remember the old timeline requires a metaphysical exemption that contradicts the physical rule of the overwrite.
      *   *Result:* You must choose: either she forgets/vanishes (Hard Overwrite), or the timeline branches (Soft Overwrite).

  2.  **Phenomenological Agency (8) vs. Causal Closure (1).**
      *   *Conflict:* If the timeline is fixed (Causal Closure), her deliberation is illusory. Writing it as "real" is a lie to the reader.
      *   *Result:* You must choose: either the outcome is uncertain (Branching), or the prose must subtly hint that her "choices" are compulsions (Fixed).

  3.  **Frame Specificity (9) vs. "1889" (Common Intuition).**
      *   *Conflict:* A specific year implies a universal clock. Relativity denies this.
      *   *Result:* You must choose: either ignore Relativity (Prejudice), or complicate the machine's interface to show "Time is relative to X."

  4.  **Ontological Status (7) vs. Moral Weight (7).**
      *   *Conflict:* If branches persist (Many Worlds), she hasn't killed the people she left; she just left the room. The moral weight evaporates. If branches vanish, the moral weight is high, but the physics is dubious.
      *   *Result:* You must choose: High Stakes (Overwrite) or High Logic (Branching).

  ### IV. Meta-Commentary on the List

  **Is the list the real result?**
  Yes. There is no consistent theory of time travel that satisfies all Non-Negotiables without violating known physics or logic. The "machine" in your novel will not be a solution to time travel, but a **selection of which paradoxes you are willing to tolerate.** The list *is* the specification because the act of writing the novel is the act of choosing which contradictions to live with.

  **The Most Exclusionary Requirement:**
  **Subjective Continuity in an Overwritten Timeline (Requirement 2).**
  If you insist that the timeline is *truly* overwritten (single universe, history changes) AND that the traveler retains memories of the overwritten history, you exclude almost every physical model. This requirement forces you into a "Dual Ontology" where the physical world obeys one rule (change) and the consciousness obeys another (persistence). This is the single hardest constraint to justify without magic. If you drop this, Branching and Fixed timelines become much easier to manage. If you keep it, you must invent a metaphysics of memory that stands outside time.

  ### V. Scorecard of Familiar Families

  **1. Fixed / Self-Consistent Timeline (Novikov Principle)**
  *   **Verdict:** Logically robust, narratively restrictive.
  *   **Pros:** Satisfies Causal Closure, Relativity, and Entropy easily. No paradoxes.
  *   **Cons:** Fails Phenomenological Agency (choice is illusory). Fails the Fire scene (she cannot prevent the fire, only cause it). Memory is consistent but tragic.
  *   **Best For:** Tragedy, inevitability, horror.

  **2. Branching Timeline (Many Worlds)**
  *   **Verdict:** Logically robust, morally diffuse.
  *   **Pros:** Satisfies Subjective Continuity (she carries her past), Agency (she makes real choices), and Causal Closure (no contradictions).
  *   **Cons:** Fails the Moral Weight of the Abandoned (she didn't save anyone, she just moved). Fails the Fire scene (brother lives in Branch B, dies in Branch A).
  *   **Best For:** Adventure, exploration, multiverse politics.

  **3. Overwritten / Erased Timeline (Back to the Future)**
  *   **Verdict:** Narratively potent, logically incoherent.
  *   **Pros:** Satisfies Moral Weight (lives are saved/lost), Agency (changes matter), and the Fire scene (stakes are real).
  *   **Cons:** Fails Subjective Continuity (why does she remember?). Fails Relativity (implies global clock). Fails Mass-Energy conservation.
  *   **Best For:** Emotional drama, high stakes, thriller pacing.

  **Recommendation:** For a 400-page novel focusing on the *cost* of intervention, the **Overwritten** model offers the best dramatic tension, provided you treat the **Subjective Continuity** requirement as a specific, mysterious property of the traveler (the "Anchor" effect) rather than a universal law. This allows you to keep the stakes high while acknowledging the logical anomaly as part of the machine's mystery.
