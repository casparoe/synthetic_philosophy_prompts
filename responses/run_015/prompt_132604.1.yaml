prompt: |-
  I'm a senior at a large public high school, and I'm writing a piece for our student paper about the way our district uses numbers to judge schools, teachers, and students. I've found that I have quite firm opinions about which uses of a number are corrupt and which are perfectly fine, but I can't state the rule I'm applying, and I suspect some of my opinions don't fit together. I'd be grateful for help finding the rule, and for an honest account of which verdicts it forces me to drop. I'm not asking for sources or further reading, just the shape of the principle.

  Here are my cases, all of them from things I've watched happen.

  Our district publishes each school's chronic absenteeism rate, and a slice of funding follows it. One school responded by letting students who arrive up to forty minutes late and leave after lunch count as present, provided they complete a wellness check-in with a counselor in the front lobby. Their rate fell sharply. I think this is straightforwardly corrupt, and I blame the administrators. A second school, facing the same metric, spent a small grant on adult-led walking routes to school, a washer and dryer for students without clean uniforms, and a counselor who phones homes. Their rate fell by about as much. I think this is not corrupt at all — it's the system working. What bothers me is that in both cases the number moved because people responded to being measured, and the second school's programs would not exist if nobody were counting. So responsiveness to the measure can't itself be the test.

  A second pair, which I find harder. My chemistry teacher spent the last three weeks before the state exam drilling us on a fill-in-the-blank template for the explain-your-reasoning items, and I could earn most of the points on those items without understanding the chemistry. I think that's corrupt. Another teacher of mine spends a couple of classes on general test-taking technique — ruling out obviously wrong options, checking whether your answer's units make sense, not leaving anything blank. Her students' scores went up too, and I think she's right to do it, and that a teacher who refused to would be neglecting us. But both of them taught us tricks that raise scores without raising understanding, and I can't say what separates them except that one feels like it defeats the point of the item and the other feels like common sense. That's not a principle.

  One case where I assign blame oddly. Our English department runs essays through an AI-detection score, and a friend of mine, who wrote his essay himself, put it through a rewriting tool to make the prose clumsier so the score would come back low. I think the score has stopped being evidence of anything about who wrote the essay. But I don't blame my friend, whereas I do blame the administrators in the first attendance case. My guess is that the difference is about who imposed the measure and whether the person being measured had any other way to protect themselves, but I'd like that spelled out, because I'm not sure it doesn't just reduce to "I side with students."

  One case my definition can't handle. The peer tutoring program I volunteer for reports the share of tutored students who go on to pass the course, and the district funds it partly on that figure. This year the coordinator began accepting only students whose first-semester average was already above seventy, quietly turning away the students who used to be referred most often. The pass rate rose. I think this is the worst thing on my list — worse than the attendance trick — and yet the number still means exactly what it meant. Of the students who were tutored, more passed. Nothing about the measurement broke. What changed is which students there are. So my rough test, make the number move without making the thing move, doesn't cover it, and I don't know what does.

  One case that pulls in the other direction. A state university near us admits by a formula built on GPA, and several schools in our area now grade generously. One of my teachers has started bumping strong B+ work up to A−, and she has told us privately that she does it to keep us comparable to students from schools that inflate. I can't blame her, and I think she's probably right to do it. But her doing it makes GPA worse as a signal, and if everyone does it the signal collapses while each individual act of inflating remains reasonable. So here I have corruption without blameworthiness, which is the reverse of what I said about the test-taking tricks, and I'd like to know whether I need two separate principles or one with more moving parts.

  A case of a different kind. Several elementary schools in our district cut art and recess to add blocks of tested reading instruction, and the principal of one of them said in a meeting that reading is what the district measures, so reading is what the school is for. I think something has gone badly wrong here, but it isn't that the number stopped tracking the thing. The number tracks reading instruction better than ever. What moved is what the school cares about. I don't know whether that belongs in the same box as the others or is a distinct failure with its own name.

  The case I keep changing my mind about: our district now has every teacher rate each senior on things like resilience and collaboration, from a short paragraph of commentary, using a rubric everyone has seen. Scores have been almost identical for two years and are checked against nothing. Half the time I think this is the most corrupt number in the building, because a teacher could write anything she liked and no one would know. The other half I think that two stable years is some evidence that nobody has bothered to game it, and that a number nothing rides on is safe precisely because it's harmless — which would also make it useless. I'd like to know whether unused gameability corrupts a measure, or whether only exercised gameability does.

  My own tentative principle is that a measure has been corrupted to the extent that a rise in it has stopped being evidence of a rise in the thing we actually care about. That handles the first two cases and the tutoring case, provided I'm willing to say what the target is and to notice that the target's population can be changed by the people being measured. It seems to misfire on the grade inflation case, where the evidence does weaken and yet I won't blame anyone, which makes me think I need a second principle about blame and not only about measurement.

  What I'd like from you is the principle, or the two principles, stated precisely, with each clause tied to the case that forces it; your verdicts on a few cases I haven't listed, such as a measure that everyone games by roughly the same amount so the ranking stays put, a measure that is gamed only at the extremes, a measure whose target is partly constituted by public opinion about the target, and one further case of your own invention that you think discriminates between the candidates; and a frank statement of which of my verdicts no single principle can keep. If it turns out that measurement and blame have to be handled separately, please say where the seam is, and whether anything I care about falls through it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Senior at a large public high school, writing for the student paper.
      *   **Topic:** How the district uses numbers (metrics) to judge schools, teachers, and students.
      *   **Goal:** Wants to find the underlying *principle* that governs their intuitive judgments about what counts as "corrupt" vs. "fine" usage of metrics.
      *   **Constraints:** No sources or further reading requested. Just the "shape of the principle." Needs precise statement of principles, tied to specific cases. Needs verdicts on new hypothetical cases. Needs a frank statement about which of their current verdicts might have to be dropped if a consistent principle is applied.
      *   **Tone:** Intellectual, rigorous, honest, respectful of the student's insight.

  2.  **Deconstruct the User's Cases & Intuitions:**

      *   *Case 1 (Attendance):*
          *   School A (Loophole): Late/leave early = present. Metric down, actual attendance not really up. -> **Corrupt.**
          *   School B (Intervention): Walking routes, laundry, counseling. Metric down, actual attendance up. -> **Fine.**
          *   *Insight:* Responsiveness to measurement isn't the problem. The problem is the *decoupling* of the metric from the underlying goal (being in school to learn).

      *   *Case 2 (Test Prep):*
          *   Chem Teacher (Template): Drill specific answers. Score up, understanding same. -> **Corrupt.**
          *   Test-Taking Teacher (Strategy): Units, ruling out options. Score up, understanding same (arguably). -> **Fine.**
          *   *Insight:* Both raise scores without necessarily raising deep understanding. The distinction feels like "defeating the item's purpose" vs. "general competence." This is tricky. It suggests the metric (test score) is a *proxy* for understanding. If the proxy is hacked specifically vs. generally.

      *   *Case 3 (AI Detection):*
          *   Student (Cloaking): Makes writing clumsier to beat detector. Metric (AI score) broken. -> **Not Blameworthy.**
          *   Admin (Attendance): -> **Blameworthy.**
          *   *Insight:* Blame depends on *power dynamics* and *necessity*. The student is protecting themselves from a flawed tool imposed on them. The admin is manipulating a tool they control to get funding.

      *   *Case 4 (Tutoring):*
          *   Coordinator (Cream Skimming): Only take students likely to pass. Pass rate up, help for needy down. -> **Worst Corruption.**
          *   *Insight:* The metric (pass rate) *technically* still tracks the truth for the *selected group*, but the *population* changed. This is "changing the denominator to fix the numerator." The goal (helping struggling students) is abandoned for the metric (pass rate).

      *   *Case 5 (Grade Inflation):*
          *   Teacher (B+ to A-): To stay competitive. GPA signal weakens. -> **Not Blameworthy (Individually), Corrupt (Collectively).**
          *   *Insight:* Prisoner's Dilemma. Individual rationality leads to collective ruin. The metric loses value, but the actor isn't "cheating" in a moral sense, they are surviving.

      *   *Case 6 (Curriculum Narrowing):*
          *   Schools (Cut Art/Recess): Focus only on tested reading. Reading scores up, education quality down. -> **Corrupt.**
          *   *Insight:* Goodhart's Law / Campbell's Law. When a measure becomes a target, it ceases to be a good measure. The *scope* of the goal is narrowed to fit the metric.

      *   *Case 7 (Soft Skills Rubric):*
          *   Teachers (Resilience Scores): Identical scores, no stakes. -> **Ambiguous.**
          *   *Insight:* If no one games it, is it corrupt? If it has no stakes, is it a measure? It's "zombie data."

      *   *User's Tentative Principle:* "A measure has been corrupted to the extent that a rise in it has stopped being evidence of a rise in the thing we actually care about."
      *   *User's Problem:* This handles the evidence decoupling but fails on the blame aspect (Grade Inflation vs. Attendance).

  3.  **Synthesize the Principles:**

      The user is grappling with two distinct philosophical problems that often get conflated:
      1.  **Epistemic Corruption:** Does the number still tell the truth? (Validity)
      2.  **Moral/Agency Corruption:** Who is responsible for the distortion? (Accountability)

      *Principle 1: The Decoupling Principle (Epistemic)*
      A metric is corrupted when actions taken to optimize the metric *reduce* the correlation between the metric and the underlying construct it is intended to represent.
      *   *Refinement:* It's not just that the correlation drops, but that the *causal link* is severed or reversed.
      *   *Handles:* Attendance A (Corrupt), Attendance B (Fine), Tutoring (Corrupt - changes population), Curriculum (Corrupt - narrows construct).
      *   *Struggle:* Test Prep. Both decouple score from understanding. Why is one okay?
      *   *Resolution:* The "General vs. Specific" distinction. Test-taking skills (units, elimination) are *generalizable competencies* that aid the underlying construct (scientific reasoning) in the wild. Template drilling is *local optimization* that works only for the test.
      *   *Refinement 2:* A metric is corrupted if the optimization strategy *cannot* be applied to the real-world phenomenon the metric proxies. (You can't "template" real chemistry, but you can "check units" in real chemistry).

      *Principle 2: The Coercion/Agency Principle (Moral)*
      Blame attaches to the agent who *controls the metric design* or *holds the power*, not the agent who is *subject to the metric* and lacks alternatives.
      *   *Handles:* Admin Attendance (Blame) vs. Student AI (No Blame). Grade Inflation (No Blame - defensive).
      *   *Handles:* Tutoring (Blame - Coordinator controls access).

      *The "Seam":*
      The user asks where measurement and blame separate. They separate at **Power and Alternatives**.
      *   Measurement validity is objective (does X track Y?).
      *   Blame is subjective/contextual (did Z have a choice?).

  4.  **Drafting the Response:**

      *   **Acknowledge the sophistication:** This is a very high-level critique (Goodhart's Law, Campbell's Law, proxy measures).
      *   **Propose the Two Principles:**
          1.  **The Fidelity Principle (Measurement):** A metric is corrupted when the strategy used to improve it *fails to generalize* to the underlying reality it claims to measure.
          2.  **The Agency Principle (Blame):** Moral responsibility lies with the designer/enforcer of the metric, not the subject, unless the subject has power to change the design.
      *   **Apply to Cases:** Walk through the user's cases showing how these two principles interact.
      *   **Address the "Hard Cases":**
          *   *Test Prep:* Distinguish "generalizable skill" (checking units) vs. "local hack" (template).
          *   *Grade Inflation:* This is a "Tragedy of the Commons." Individual blame is low, systemic corruption is high.
          *   *Unused Gameability:* If it's not gamed, it's not corrupted *yet*, but it's *fragile*. It's "zombie data."
      *   **New Hypothetical Verdicts:**
          1.  *Universal Gaming (Ranking stays):* Corrupt (Fidelity lost), but Blame is diffuse.
          2.  *Extreme Gaming:* Corrupt.
          3.  *Public Opinion Target:* Very corrupt (Self-fulfilling prophecy).
          4.  *Invented Case:* "The Safety Metric." Police reduce crime reports by reclassifying felonies as misdemeanors. (Fidelity lost, Blame on Chief).
      *   **The Frank Statement:** Which verdicts must be dropped?
          *   The user wants to blame the Admin in Attendance A but not the Teacher in Grade Inflation. The principles support this (Power).
          *   The user finds Tutoring "worst." The principles support this (Fidelity destroyed by population change).
          *   *The Drop:* The user says Test Prep B is "right." Under strict Fidelity, *both* decouple score from pure chemistry knowledge. To keep B as "Fine," we must accept that "test-taking competence" is *part* of the goal. If the user insists pure chemistry is the *only* goal, B is also corrupt. I need to point this out.
          *   *The Drop 2:* The "Unused Gameability" case. If a measure *can* be gamed but isn't, is it corrupt? The principle says no, it's just *risky*. The user's intuition that it might be "most corrupt" because it's fake needs to be challenged. It's not corrupt, it's *vacuous*.

  5.  **Refining the Principles (Self-Correction during drafting):**
      *   *Fidelity:* Make sure to emphasize *Generalizability*. That solves the Test Prep dilemma.
      *   *Agency:* Make sure to emphasize *Control*.
      *   *The "Seam":* Explicitly state that a measure can be epistemically dead (Grade Inflation) while the actors are morally innocent (Prisoner's Dilemma).

  6.  **Final Review against Constraints:**
      *   No sources/reading? Check.
      *   Shape of the principle? Check.
      *   Verdicts on new cases? Check.
      *   Frank statement on dropped verdicts? Check.
      *   Tone? Respectful, analytical.

  7.  **Final Polish:** Ensure the distinction between "Epistemic Corruption" (the number lies) and "Moral Corruption" (the act is wrong) is clear. This is the core insight the student is looking for. (This maps to Goodhart's Law vs. Principal-Agent problems).

      *Wait, one nuance on the Tutoring Case:* The user says "the number still means exactly what it meant." I need to correct this. The number means "Pass rate of *tutored* students." If you change *who* is tutored, the number no longer measures "Effectiveness of Tutoring Program," it measures "Selectivity of Admissions to Program." The *interpretation* is corrupted, even if the *arithmetic* is honest. I need to make sure the Fidelity Principle captures *interpretation*, not just calculation.

      *Wait, one nuance on the Test Prep:* The user says "I could earn most of the points... without understanding." For the second teacher, "scores went up too." The distinction is likely that the second teacher's tricks are *transferable* to actual scientific practice (dimensional analysis is real chemistry), whereas the template is *not* transferable. I will codify this as the "Transfer Test."

      *Wait, on the "Unused Gameability":* The user says "a number nothing rides on is safe precisely because it's harmless — which would also make it useless." This is a great insight. I should validate this. If there are no stakes, there is no incentive to game, so it's not corrupted, but it's also not doing work. It's "ornamental."

      *Let's structure the response:*
      1. Introduction: Validate the complexity.
      2. The Two Principles (Fidelity & Agency).
      3. Application to User's Cases (showing the work).
      4. The Seam (where they split).
      5. Verdicts on New Cases.
      6. The Frank Statement (What must be sacrificed).

      *Ready to write.*
answer: |-
  You have intuitively discovered a distinction that philosophers of statistics and ethics spend careers arguing over. You are trying to solve two different problems with one tool. The first problem is **epistemic**: *Does this number still tell the truth?* The second problem is **moral**: *Who is responsible for the lie?*

  Your tentative principle ("a rise in it has stopped being evidence of a rise in the thing we actually care about") is a strong start, but it only solves the epistemic problem. It cannot handle blame, because blame depends on power, not just truth.

  To make your intuitions consistent, you need to split your single principle into two distinct principles that operate on different tracks.

  ### Principle 1: The Fidelity Principle (Epistemic)
  **A metric is corrupted when the strategy used to optimize it fails the Transfer Test.**

  *The Transfer Test:* If you applied the optimization strategy to the real-world phenomenon the metric is supposed to proxy, would it still produce the desired outcome?

  *   **Attendance Case 1 (Corrupt):** Counting a student as present if they show up for 40 minutes.
      *   *Transfer:* If you applied this to "education," does 40 minutes of school equal a day of learning? No. The strategy (redefining presence) does not transfer to the goal (education). **Fidelity Broken.**
  *   **Attendance Case 2 (Fine):** Walking routes and laundry.
      *   *Transfer:* Does removing barriers to attendance actually result in more education? Yes. The strategy transfers. **Fidelity Intact.**
  *   **Test Prep Case 1 (Corrupt):** Fill-in-the-blank templates.
      *   *Transfer:* If you use a template to explain reasoning in a real lab or career, does it work? No. It is a local hack for the test form. **Fidelity Broken.**
  *   **Test Prep Case 2 (Fine):** Checking units and ruling out options.
      *   *Transfer:* If you use dimensional analysis or elimination in real chemistry, does it work? Yes. These are generalizable competencies, not just test hacks. **Fidelity Intact.**
  *   **Tutoring Case (Worst Corruption):** Cream-skimming (only taking students likely to pass).
      *   *Transfer:* Does excluding struggling students help the goal of "remedial support"? No. It actively contradicts it. The metric (pass rate) is mathematically honest, but the *interpretation* (program effectiveness) is lies. **Fidelity Broken.**
  *   **Curriculum Case (Corrupt):** Cutting art for reading.
      *   *Transfer:* Does a school that only teaches reading fulfill the goal of "education"? No. The metric tracks a sub-component, but the optimization destroys the whole. **Fidelity Broken.**
  *   **Grade Inflation (Corrupt):** Bumping B+ to A-.
      *   *Transfer:* Does inflating the grade reflect higher mastery? No. The signal decouples from the reality. **Fidelity Broken.**

  ### Principle 2: The Agency Principle (Moral)
  **Blame attaches to the agent who controls the metric's design or stakes, not the agent who is subject to them, unless the subject has viable alternatives.**

  *   **Attendance Case 1 (Blame Admin):** Administrators control the definition of "present." They changed the rule to get money. **High Blame.**
  *   **AI Detection Case (No Blame Student):** The student did not design the detector. They had no alternative but to cloak their work to avoid false accusation. They are surviving a flawed system. **No Blame.**
  *   **Grade Inflation (No Blame Teacher):** The teacher does not control the admissions formula. If she refuses to inflate, her students are punished by other schools' inflation. She is in a Prisoner's Dilemma. **Low/No Blame.**
  *   **Tutoring Case (Blame Coordinator):** The coordinator controls access. They chose to change the population to fix the number. **High Blame.**

  ### The Seam
  The seam between these principles is **Power**.

  A measure can be epistemically dead (Fidelity Broken) while the actors are morally innocent (Agency Protected). This is your Grade Inflation case. The GPA no longer signals mastery (Fidelity Broken), but the teacher is not a villain (Agency Protected).

  Conversely, a measure can be epistemically sound but morally weaponized. (Imagine a metric that accurately tracks student stress, used by admins to fire teachers whose students are stressed).

  You cannot have one principle. If you try to merge them, you will either end up blaming victims (students gaming AI detectors) or excusing architects (admins redefining attendance).

  ### Verdicts on Your New Cases

  **1. A measure that everyone games by roughly the same amount so the ranking stays put.**
  *   **Fidelity:** Broken. If everyone inflates grades by 5%, the number no longer reflects absolute mastery, only relative standing. The "thing we care about" (mastery) is no longer evidenced by the number.
  *   **Blame:** Diffused. Because the gaming is universal and defensive, no single actor is primarily responsible. It is a systemic failure.
  *   **Verdict:** Epistemically corrupt, morally neutral.

  **2. A measure that is gamed only at the extremes.**
  *   **Fidelity:** Compromised. The metric is valid for the middle, but lies at the top and bottom. It cannot be used for high-stakes decisions (awards, interventions) without adjustment.
  *   **Blame:** High on the gamers. If only a few game it, they are gaining an unfair advantage, not just surviving.
  *   **Verdict:** Epistemically damaged, morally blameworthy.

  **3. A measure whose target is partly constituted by public opinion about the target.**
  *   *(Example: A "School Reputation Score" based on surveys.)*
  *   **Fidelity:** Fragile. If the public believes the school is bad, the score drops, which makes the school worse (less funding, worse teachers), which makes the score drop further. The measure creates the reality.
  *   **Verdict:** This is a "Performative Metric." It is not corrupt in the sense of lying, but it is dangerous because it is self-fulfilling. It requires the highest level of scrutiny.

  **4. Invented Case: The Safety Metric.**
  *   *Scenario:* The district measures "School Safety" by counting "Reported Incidents." To improve their score, principals instruct staff to resolve fights informally and not file reports. The number of reported incidents drops to zero.
  *   **Fidelity:** Broken. The strategy (not reporting) does not transfer to the goal (safety). In the real world, an unreported fight is still violence.
  *   **Blame:** High on Principals. They control the reporting protocol.
  *   **Verdict:** This is the clearest case of corruption. It matches your Attendance Case 1.

  ### The Frank Statement: Which Verdicts Must You Drop?

  To maintain this consistent framework, you must adjust two of your intuitions.

  **1. You must soften your verdict on the "Unused Gameability" (Resilience Rubric).**
  You wrote: *"Half the time I think this is the most corrupt number in the building... The other half I think that two stable years is some evidence that nobody has bothered to game it."*
  *   **The Correction:** If no stakes are attached and no one games it, it is **not corrupt**. It is **vacuous**. Corruption requires a divergence between the number and the truth caused by optimization. If there is no optimization pressure, there is no corruption.
  *   **The Cost:** You cannot call it "corrupt." You must call it "useless." A number that nothing rides on is not a lie; it is a decoration. If you want to attack it, attack its waste of time, not its honesty.

  **2. You must accept that Test Prep Case 2 is technically "Corrupt" under strict Fidelity, unless you redefine the Goal.**
  You wrote: *"Both of them taught us tricks that raise scores without raising understanding... I can't say what separates them."*
  *   **The Correction:** My Fidelity Principle uses the "Transfer Test" to save Case 2. However, if you define the "Thing We Care About" strictly as *Chemical Knowledge*, then **both** teachers are corrupting the measure. Checking units is a test-taking skill, not chemistry knowledge.
  *   **The Cost:** To keep your intuition that Case 2 is "Fine," you must admit that the Goal of the exam is *not* just Chemistry Knowledge, but *Chemical Competence*, which includes the ability to navigate assessments and check work. If you insist the Goal is *only* raw knowledge, you must admit both teachers are gaming the system. You have to choose: either the Goal includes test-taking skills, or the second teacher is also compromising fidelity (even if benignly).

  ### Summary for Your Piece
  You are not looking for one rule. You are looking for a **matrix**.

  *   **Vertical Axis (Truth):** Does optimizing this number actually improve the real-world thing? (The Fidelity Principle).
  *   **Horizontal Axis (Power):** Did the person changing the number have the power to change the rule, or were they forced to survive it? (The Agency Principle).

  When you write your piece, do not ask "Is this number bad?" Ask: "Does this number still travel?" (Fidelity) and "Who holds the leash?" (Agency). This will allow you to condemn the administrators who redefine attendance, exonerate the students who cloak their writing, and identify the grade inflation crisis as a tragedy where everyone is innocent and everything is broken.
