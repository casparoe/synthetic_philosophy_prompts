answer: |-
  **Exam Prompt**

  Imagine that every conscious being in the universe suddenly disappears. The last forest remains, but there is no one left to see it. If a lightning strike burns it down, has anything wrong happened? Some argue that reasons aren't just thoughts in our heads, but "counterfactual stability conditions"—basically, patterns in the world that stay intact only if certain actions are avoided. Your task is to write an essay arguing whether these stability conditions count as real, free-floating normative reasons, or if calling them "reasons" is just physics dressed up in fancy words. You need to take a stand: does normativity survive without minds, or does it vanish with them?

  ***

  **Model Answer**

  If every conscious being vanished tomorrow, the laws of physics would remain untouched. If a lightning strike hit the last forest, it would burn just as it always has. The "counterfactual stability condition" theory suggests that the forest's persistence is a pattern that holds true only if no fire occurs, and crucially, that this pattern constitutes a reason not to burn it, even without minds to recognize it. This is an attractive idea because it tries to save reasons from being purely subjective opinions. However, it ultimately fails to distinguish between physical necessity and normative obligation.

  A stability condition is purely descriptive. It tells us what *will* happen or what *would* happen under certain conditions. For example, a bridge stays standing only if weight limits are respected. That is a stability condition. But without engineers or travelers, there is no "ought" attached to the weight limit. The bridge doesn't care if it collapses. Similarly, the forest's existence is contingent on no fire occurring. That is a fact about carbon, oxygen, and combustion. To call this a "reason" is to smuggle in a valuer who isn't there.

  Normativity is inherently relational. A reason is always a reason *for* an agent. It justifies an action or belief. Justification requires a mind capable of understanding the justification. If there are no minds, there is no one to whom the reason applies. The stability condition exists mind-independently, but its status as a *reason* does not. The theory mistakes the object of the reason, which is the forest's stability, for the reason itself, which is the justification for preserving it.

  Critics might say this makes reasons too fragile. If reasons vanish with minds, did historical wrongs happen for no reason? But that confuses explanatory reasons with normative ones. There was a cause, but the wrongness depends on valuers. The "stability condition" view tries to ground normativity in metaphysics, but it ends up just describing metaphysics. It says "the forest remains if unburnt." That is true. But adding "therefore there is a reason not to burn it" is a category error.

  So, is this just physics with fancy words? Mostly, yes. It identifies real patterns in the world, like fragility and causality, but labels them as normative to give them weight they don't carry alone. These conditions are the raw material for reasons, but they aren't reasons themselves. Without a mind to care about the stability, the universe is indifferent. The reason not to burn the last forest is real for us, because we value the stability. Without us, it's just chemistry waiting to happen.

  ***

  **Marking Scheme**

  1. The essay clearly defines "counterfactual stability conditions" and explains how they differ from standard mental states.
  2. The argument directly addresses whether these conditions constitute normative reasons or merely physical descriptions.
  3. The writer distinguishes between what *is* the case (physics) and what *ought* to be the case (normativity).
  4. The position is consistent throughout, even if it acknowledges counterarguments or nuances.
  5. The conclusion decisively states whether the "fancy words" accusation holds water based on the provided analysis.
