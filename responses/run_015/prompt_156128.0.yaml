      Normativity is inherently relational. A reason is always a reason *for* an agent. It justifies an action or belief. Justification requires a mind capable of understanding the justification. If there are no minds, there is no one to whom the reason applies. The stability condition exists mind-independently, but its status as a *reason* does not. The theory mistakes the object of the reason (the forest's stability) for the reason itself (the justification for preserving it).

