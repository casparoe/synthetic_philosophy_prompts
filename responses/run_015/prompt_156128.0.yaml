      If every mind vanished, the forest would still burn if lit. The "counterfactual stability condition" idea suggests that the forest's continued existence is a pattern that remains stable only if no fire starts. Proponents say this stability *is* the reason not to burn it, even without observers. But this confuses description with prescription.

      A stability condition is just a fact about cause and effect. If I kick a ball, it moves. That's a stable physical pattern. Does the ball have a "reason" not to move? No. Similarly, the forest remaining standing is a physical state maintained by the absence of fire. Calling this a "reason" adds nothing to the physics. It's just saying "if X doesn't happen, Y stays the same." That's mechanics, not normativity.

