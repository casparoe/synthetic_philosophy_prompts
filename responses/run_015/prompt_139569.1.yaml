      *   *Why return?* Not for money. Maybe addiction to the state? Maybe proving something to the universe? Maybe she's trying to break the loop by finally drinking? Or maybe she's preserving the *potential* without the *act*.
      *   *Decision:* Let's go with a form of cultivated dissociation/reframing. She has trained herself to view the morning act as a separate entity from the midnight self. But the twist should be about the *cost* of this mental architecture. She returns because she needs to verify she still *can* hold the intention, even if she never drinks. It's about the integrity of the "intending self."
