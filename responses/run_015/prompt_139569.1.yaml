answer: |-
  The booth smelled of ozone and stale coffee, the same as last quarter. Mara sat with her hands flat on the table, palms down, hiding the tremor. Across from her, the auditor—a man with a face like uncooked dough—tapped a stylus against his tablet. He didn't look at her. He looked at the waveform scrolling across his screen.

  "Round five," he said. "You know the clause."

  "I know the clause," Mara said. Her voice sounded thin in the soundproofing foam.

  "Standard warning. The payout clears at midnight. The vial is yours at nine. The audit checks for intention contingent on zero external utility regarding the act of swallowing. If you intend to drink because you're stubborn, or proud, or because you want to prove the algorithm wrong, you fail. If you intend because you think you should, you fail. You must intend to drink simply because you intend to drink."

  "And if I don't drink?"

  "Then you keep the money from last night, and you wait three months to try for the double. But your record stays clean. *Intends. Does not consume.*" He finally looked up. "Most people crack by round three. They try to love the poison. They try to hate themselves. The auditor smells the reason like perfume. You have to be odorless, Ms. Vance."

  "I'm odorless," she said.

  "Begin."

  She closed her eyes. This was the part everyone got wrong. They thought intention was a promise. A contract signed between the now-self and the later-self. But contracts require reasons, and reasons were poison here. If she had a reason to drink at 9 AM, the auditor would flag it as instrumental. If she had no reason, she couldn't intend. Kavka's ghost sat in the corner of the booth, laughing.

  Mara didn't make a promise. She didn't simulate the morning. She didn't imagine the taste of the toxin, the cramping gut, the day lost to misery. To simulate was to weigh, and to weigh was to find the scale tipping toward *don't*.

  Instead, she did the thing she had spent four quarters practicing. She reached into her own cognitive architecture and found the switch labeled *Prediction*. She turned it off.

  She didn't think, *I will drink.* She thought, *Drinking is happening.*

  She visualized her morning self not as a continuation of her current consciousness, but as a separate entity, a puppet whose strings she was holding right now. She didn't care what the puppet felt. She didn't care if the puppet screamed. She only cared that her hand was on the string. She cultivated a specific somatic tension, a tightness behind the sternum that she had learned to associate with *commitment without causality*. It was a hollow feeling, like holding a breath you never planned to exhale.

  She wasn't intending to act. She was intending to occupy the space where an act would be.

  The auditor's stylus stopped tapping. The silence stretched, heavy and granular. Mara held the hollow space. She didn't check to see if it was real. Checking would introduce doubt, and doubt was a reason to hesitate. She just let the tension sit there, a pure, useless vector pointing at a vial of mild neurotoxin.

  She thought about the money waiting in her account. It was already there. It belonged to the woman sitting in the booth. The woman who would wake up at nine belonged to no one. She was a stray dog. You could intend to feed a stray dog without knowing if it would come when called. You just hold out the hand.

  "Stop," the auditor said.

  Mara exhaled. The tension behind her sternum dissolved, leaving a phantom ache.

  "Pass," he said. He didn't sound impressed. He sounded tired. "Transfer initiated. You can collect the vial on the way out."

  She stood up. Her legs felt heavy, as if gravity had increased during the scan. She walked to the dispensary slot, took the small glass vial. It was labeled *Velleity Standard Mix – Batch 44*. Harmless, mostly. Just enough to ruin a Tuesday.

  Her phone buzzed in her pocket. The notification from the bank. The number was absurd. She had enough to buy a house, to leave the city, to never sit in a booth again.

  She walked out into the cool night air. The pub down the street was spilling laughter onto the sidewalk. People ordered drinks because they wanted to be intoxicated, or social, or warm. They had reasons. Their intentions were cluttered, messy, honest.

  Mara put the vial in her coat pocket. It clinked against her keys.

  She wasn't coming back for the money. The doubling was just a metric, a way to keep score in a game that had no winner. She came back because of the hollow space.

  In the rest of her life, every want was tied to a get. She wanted coffee, she drank coffee. She wanted sleep, she slept. Desire was a bridge to satisfaction. But in the booth, she had found a way to want without the bridge. A pure, suspended state of *will* that never had to collapse into *action*. It was the only time she felt free from the tyranny of consequences.

  But tonight, walking home, she felt the familiar erosion. The hollow space was getting harder to find. The trick was wearing thin. The separation between Booth-Mara and Morning-Mara was blurring. She could feel the morning creeping in, the rational calculation that said *you have the money, why suffer?*

  She touched the vial through her pocket.

  She was coming back for the sixth round not because she thought she could keep winning. She was coming back because she was waiting for the moment the trick failed. She wanted to see what would happen if she finally let the prediction switch turn back on. If she finally intended with the full weight of her future self bearing down on her.

  Would she drink?

  The public record said no. The pattern said no. But the ladder was getting steep, and the money was becoming noise, and the hollow space was becoming a vacuum.

  She stopped at a crosswalk. The light was red. She waited. She had the intention to cross when it turned green. She knew she would cross. There was no puzzle there.

  Mara took the vial out of her pocket and held it up to the streetlight. The liquid inside was clear, innocent. She wondered if she could train herself to intend the drink *and* the refusal simultaneously. To split herself so finely that both futures were true.

  The light turned green. She put the vial away and walked. She wouldn't drink it tomorrow. She knew that like she knew the sun would rise. But she would keep coming back, quarter after quarter, climbing the ladder of her own impossibility, until the friction of the lie finally sparked a fire, or until she burned out completely.

  She wasn't trying to solve the puzzle. She was trying to see if she could live inside the error message forever.
