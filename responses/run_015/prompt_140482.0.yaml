prompt: |-
  I'm writing a novel set in an isolated valley, and I've painted myself into a corner. Two villages on opposite rims of a gorge; a fever a generation before the book opens left most of the lower village deaf, so the two sides run everything through a code of mirrored shutters that everyone on both sides was born into. Nobody agreed to it, nobody remembers it starting, and a big part of the book is about which of their shared practices have any grip on them. I keep wanting to narrate that some practice is a convention and others aren't — a habit, a rule somebody enforces, a thing they do because they think it's right — and I realized I don't have a spec for what that claim is supposed to buy. My writing group says just use the Lewis-style thing, a regularity everyone conforms to, expects the others to conform to, and prefers to conform to given that the others do, but that feels like it decides my cases by fiat before I know which cases matter.

  So: write me the requirements list. What does an account of convention have to deliver for me to call the practices in my valley by that name — which cases it has to sort correctly, which distinctions it can't collapse (convention vs mere regularity, vs a command backed by force, vs a norm people enforce, vs something they'd do anyway for independent reasons), which bits of the story it has to be able to accommodate, with the case behind each requirement. The cases I actually need handled: the mirror code itself, where a second, equally workable code existed and this one just won; the ledge lamps, where a stubborn tenth never light them, everybody knows it, and the system runs fine anyway; the water-turn rule, where the two villages' interests genuinely conflict and one of them is getting the worse deal; the black doors, where every household keeps its door painted black because each believes the others would sanction any other color, though in fact nobody cares and nobody has ever enforced it; the left-hand ledge, the only passable one, which everyone walks on and where there was never any alternative worth coordinating around; the dawn bell, which everybody hates and everybody still keeps; and the herders and their dogs, who time their movements around each other down to the minute, with only one side having anything like expectations about the other's expectations. Tell me too whether how a practice got started belongs in the test or only how it's kept going, since I have a chapter where the code shifts over one winter without anyone deciding anything.

  Mark which requirements are non-negotiable and which are just the taste of one camp, and flag any pair you think can't be jointly satisfied — that's the part I most want, because if the list is impossible I'd rather know now. One purpose-of-the-theory thing specific to me: I want a test a reader could in principle apply from what's on the page, from behavior and what people say out loud, without access to anyone's real preferences or to whether they all truly know what the others know. Say whether that observability condition is a genuine desideratum or my own novelist's prejudice, and if it's genuine, what it costs — I suspect it collides head-on with the bit about conditional preferences. Then tell me which single requirement knocks out the most candidates. A short scorecard at the end: how Lewis's own regularity-and-expectations account does, how the accounts that build sanctioning into the definition do, and how the evolutionary or reinforcement-style pictures that don't ask for beliefs at all do. Keep the weight on the criteria, the scorecard can be a few lines.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**

      *   **Context:** The user is writing a novel set in an isolated valley with two villages separated by a gorge.
      *   **Core Problem:** They need a philosophical/speculative definition of "convention" to distinguish between different types of social practices in their story (convention vs. habit vs. rule vs. norm vs. coercion vs. independent necessity).
      *   **Specific Constraint:** They rejected David Lewis's standard definition (regularity + mutual expectation + conditional preference) because it feels like it decides cases by fiat before the story explores them.
      *   **Task:** Write a "requirements list" for an account of convention.
          *   Must specify what the account delivers (distinctions it must make).
          *   Must handle specific cases provided (Mirror Code, Ledge Lamps, Water-Turn Rule, Black Doors, Left-Hand Ledge, Dawn Bell, Herders/Dogs).
          *   Must address the "origin vs. maintenance" question (historical genesis vs. current sustainability).
          *   Must mark requirements as Non-Negotiable vs. Taste.
          *   Must flag incompatible pairs (impossible joint satisfaction).
          *   Must address the "Observability Condition" (can a reader tell from the page without access to internal states?).
          *   Must identify the single requirement that knocks out the most candidates.
          *   Must include a short scorecard for Lewis, Sanction-based, and Evolutionary accounts.
      *   **Tone:** Analytical, precise, helpful for a writer, philosophically rigorous but applied.

  2.  **Deconstruct the Cases:**

      *   *Mirror Code:* Arbitrary coordination solution (one of many possible). *Verdict:* Paradigm Convention.
      *   *Ledge Lamps:* 90% compliance, system works, 10% stubborn refusers known to all. *Verdict:* Convention with slack/tolerance.
      *   *Water-Turn Rule:* Conflict of interest, one side loses. *Verdict:* Coercion/Compromise, not pure convention (or convention under power asymmetry).
      *   *Black Doors:* Pluralistic ignorance (everyone thinks others care, nobody actually does). *Verdict:* Pseudo-convention / Norm based on false belief.
      *   *Left-Hand Ledge:* Only one passable path. *Verdict:* Natural Necessity / Habit, not Convention (no alternative).
      *   *Dawn Bell:* Everyone hates it, everyone keeps it. *Verdict:* Path Dependence / Lock-in / Coordination Trap.
      *   *Herders/Dogs:* One-sided expectation (Side A expects Side B, Side B just reacts). *Verdict:* Asymmetric Coordination / Habitual Response, not Mutual Convention.

  3.  **Drafting the Requirements List:**

      *   *Requirement 1: Arbitrariness (The Alternative Test).* A convention must have at least one workable alternative. (Rules out Left-Hand Ledge).
      *   *Requirement 2: Interdependence (The Conditional Preference Test).* My reason for doing X depends on your doing X. (Rules out Herders/Dogs if one side doesn't care).
      *   *Requirement 3: Normativity/Sanction (The Ought Test).* Is there a sense of "should"? (Distinguishes Black Doors from Mirror Code).
      *   *Requirement 4: Common Knowledge (The Reflexivity Test).* We know that we know. (Crucial for Lewis, hard for Observability).
      *   *Requirement 5: Sustainability without Force (The Coercion Test).* Distinguishes Water-Turn from Mirror Code.
      *   *Requirement 6: Origin Independence (The History Test).* Does it matter how it started? (Addresses the "shift over one winter" chapter).

  4.  **Addressing the "Observability Condition":**

      *   The user wants a test a reader can apply from the *page* (behavior/dialogue) without omniscient access to internal preferences.
      *   *Conflict:* Lewis's definition relies heavily on internal states (preferences, expectations).
      *   *Resolution:* This is a genuine tension. To make it observable, we need *proxy behaviors* (e.g., expressions of surprise, attempts to correct others, counterfactual reasoning in dialogue).
      *   *Verdict:* It's a novelist's prejudice but a necessary one for fiction. It costs precision on internal states.

  5.  **Identifying Incompatible Pairs:**

      *   *Observability vs. Common Knowledge:* You can't *see* common knowledge directly. You infer it.
      *   *Arbitrariness vs. Stability:* If it's truly arbitrary, why is it stable? (Solved by coordination equilibrium, but hard to show on page).
      *   *The big one:* **Internal Preference vs. External Observation.** The user wants to know if they *truly* prefer to conform (Lewis) but only wants to judge based on what is said/done. These are logically distinct. I need to flag this as the main tension.

  6.  **Refining the Requirements (Iterative Process):**

      *   *Refinement on "Black Doors":* This is pluralistic ignorance. A good theory of convention needs to distinguish *actual* coordination from *believed* coordination.
      *   *Refinement on "Water-Turn":* This is a bargaining solution, not a coordination equilibrium. The theory needs to separate Coordination from Conflict.
      *   *Refinement on "Origin":* Lewis says origin doesn't matter, only current equilibrium. But the user has a chapter where it shifts. The theory needs to allow for *drift* without *decision*.

  7.  **Developing the Scorecard:**

      *   *Lewis:* Good on Arbitrariness and Interdependence. Fails on Observability and Pluralistic Ignorance (Black Doors).
      *   *Sanction-based (Norms):* Good on Black Doors and Water-Turn. Fails on Arbitrariness (might call Ledge Lamps a rule).
      *   *Evolutionary/Reinforcement:* Good on Herders and Drift. Fails on Intentionality (Dawn Bell).

  8.  **Final Review against Constraints:**

      *   Did I mark Non-Negotiable vs. Taste? Yes.
      *   Did I flag incompatible pairs? Yes.
      *   Did I address Observability costs? Yes.
      *   Did I identify the "killer" requirement? Yes (Arbitrariness/Alternative).
      *   Is the tone right? Needs to be sharp, slightly academic but tailored to a writer.

  9.  **Constructing the Output:** (Self-Correction during drafting)
      *   *Correction:* Make sure I don't just give the answer, but give the *specification* for the answer. The user asked for the "requirements list" for an account of convention, not just an analysis of their cases. I need to frame it as: "If you want a theory to work for your novel, it must satisfy X, Y, Z."
      *   *Correction on Observability:* Be clear that "Observability" is the user's constraint, and I need to evaluate if it's compatible with standard philosophy. It creates a behaviorist constraint on a mentalist definition.
      *   *Correction on "Knockout":* The Arbitrariness requirement is usually the hardest hurdle for "natural" practices (Ledge).

  10. **Final Polish:** Check the specific cases against the requirements to ensure consistency. (e.g., Ensure "Black Doors" is distinguished from "Mirror Code" via the Sanction/Belief requirement).

  *(Self-Correction on the "Incompatible Pairs"):* The prompt asks to flag any pair *I think* can't be jointly satisfied. The biggest philosophical tension here is between **Common Knowledge** (mental state) and **Observability** (external behavior). I must highlight this.

  *(Self-Correction on "Origin"):* Lewis explicitly says history doesn't matter. The user has a plot point about history shifting. I need to advise that a "Dynamic Equilibrium" view is needed, not a static one.

  Let's assemble the response.cw
answer: |-
  Here is the requirements specification for an account of convention tailored to your novel's constraints. I have structured this as a design document for a philosophical engine, marking constraints as **Non-Negotiable** (the theory breaks without them) or **Taste** (selects for specific thematic resonances), and highlighting the structural tensions you asked for.

  ### I. The Requirements List

  **1. The Arbitrariness Requirement (Non-Negotiable)**
  *   **Definition:** The practice must be one of at least two workable alternatives that could have solved the same coordination problem.
  *   **Case Work:**
      *   *Passes:* **Mirror Code** (another code could have worked); **Ledge Lamps** (could have been right-hand lamps).
      *   *Fails:* **Left-Hand Ledge** (only one passable path; this is natural necessity, not convention).
  *   **Why:** Without this, you cannot distinguish social agreement from geographic determinism.

  **2. The Interdependence Requirement (Non-Negotiable)**
  *   **Definition:** An agent's reason for performing the action must depend on the expectation that others will perform it. If the others stopped, the agent would stop (absent external force).
  *   **Case Work:**
      *   *Passes:* **Mirror Code**; **Dawn Bell** (everyone hates it, but stops if others stop).
      *   *Fails:* **Herders/Dogs** (One side reacts instinctively or independently; no mutual expectation loop).
  *   **Why:** Distinguishes convention from parallel habits or instinctual synchronization.

  **3. The Sanction/Belief Gap Requirement (Taste)**
  *   **Definition:** The account must distinguish between a practice sustained by *actual* mutual preference and one sustained by *believed* sanction (pluralistic ignorance).
  *   **Case Work:**
      *   *Passes:* **Mirror Code** (True convention).
      *   *Fails:* **Black Doors** (False convention; nobody cares, but everyone thinks they do).
  *   **Why:** This allows you to explore the theme of "grip." A theory that collapses these two kills the dramatic tension of the Black Doors plotline.

  **4. The Coercion Boundary (Non-Negotiable)**
  *   **Definition:** The account must distinguish between compliance due to coordination equilibrium and compliance due to power asymmetry or threat.
  *   **Case Work:**
      *   *Passes:* **Mirror Code**.
      *   *Fails:* **Water-Turn Rule** (One side gets the worse deal and complies due to vulnerability, not mutual benefit).
  *   **Why:** If you call the Water-Turn rule a "convention," you lose the ability to critique the power dynamic between the villages.

  **5. The Drift Compatibility (Taste)**
  *   **Definition:** The account must allow for the *content* of the convention to shift over time without a discrete moment of agreement or conscious renegotiation.
  *   **Case Work:**
      *   *Passes:* **The Winter Shift** (Code shifts without decision).
      *   *Fails:* Any theory requiring a "founding moment" or explicit contract.
  *   **Why:** You need to narrate the shift as organic, not legislative.

  **6. The Observability Condition (Your Constraint)**
  *   **Definition:** The status of the practice must be inferable from public behavior, dialogue, and visible sanctions, without omniscient access to internal preference states.
  *   **Case Work:** Applies to all.
  *   **Why:** You are writing fiction, not philosophy. The reader must be able to adjudicate the status of the practice based on evidence available to the characters.

  ---

  ### II. Incompatible Pairs & Structural Tensions

  You asked for the collisions. There is one major structural fault line in this specification.

  **The Collision: Observability vs. Interdependence**
  *   **The Conflict:** The **Interdependence Requirement** (Req 2) relies on *conditional preferences* (I do X *because* I prefer it given you do X). The **Observability Condition** (Req 6) forbids access to preferences.
  *   **Why they clash:** You can observe behavior (I do X when you do X), but you cannot observe the *reason*. A character might mimic others out of fear (Coercion), out of mindless habit (Regularity), or out of genuine coordination preference (Convention). All three look the same from the outside.
  *   **The Cost:** To satisfy Observability, you must weaken Interdependence. You have to allow "proxy behaviors" (e.g., characters expressing surprise at deviation, or verbally correcting others) to stand in for internal preference.
  *   **Verdict:** **Cannot be jointly satisfied perfectly.** You must choose: either you accept that the reader (and characters) can never be 100% sure if something is a convention or a habit (which is thematically rich), or you grant your narrator limited omniscience regarding "what people would do if others stopped."
  *   **Recommendation:** Treat Observability as **Taste**, not Non-Negotiable. Allow the ambiguity to remain in the text. The uncertainty *is* the story.

  **The Collision: Arbitrariness vs. Drift**
  *   **The Conflict:** If a practice shifts over one winter without anyone deciding (Req 5), at what point does it become a *different* convention? If the shift is gradual, the "Arbitrariness" (Req 1) becomes blurry.
  *   **Verdict:** **Jointly satisfiable, but requires fuzzy boundaries.** You must treat the convention as a trajectory, not a static point.

  ---

  ### III. The Observability Condition: Desideratum or Prejudice?

  **Verdict:** It is a **Novelist's Prejudice**, but a vital one.
  In philosophy (specifically Lewisian game theory), convention is defined by mental states (common knowledge, preferences). Strict observability is behaviorism.
  **The Cost:** If you enforce strict observability, you cannot distinguish **Black Doors** (pluralistic ignorance) from **Mirror Code** (true convention) based *only* on action. In both cases, everyone paints the door/shutters the window, and everyone corrects deviants.
  *   **To make it work:** You must encode the difference in *dialogue*. In the Black Doors case, a character must admit in private (or to the reader) that they don't care, while publicly acting as if they do. In the Mirror Code case, characters must express genuine confusion or functional loss when the code is broken.
  *   **Advice:** Do not make Observability a hard rule for the *definition*, make it a rule for the *evidence*. The definition can rely on preferences, but the *proof* must be on the page.

  ---

  ### IV. The Knockout Requirement

  **The Single Requirement that Knocks Out the Most Candidates:**
  **The Arbitrariness Requirement (Req 1).**

  *   **Why:** It immediately disqualifies the **Left-Hand Ledge** (natural necessity) and the **Herders/Dogs** (if the dogs are just reacting to terrain or instinct). It is the hardest hurdle because in an isolated valley, many practices will feel "necessary" due to survival constraints.
  *   **Utility for you:** This is the sharpest tool you have. If a character argues, "We *must* use the mirror code," the counter-argument is, "Could we have used flags?" If yes, it's a convention. If no, it's physics. This distinction drives the conflict about whether their culture is chosen or imposed.

  ---

  ### V. Scorecard of Existing Accounts

  Here is how standard philosophical accounts handle your specific cases.

  | Account Type | Performance on Your Cases | Verdict for Novel |
  | :--- | :--- | :--- |
  | **Lewisian (Regularity + Expectation + Preference)** | **Mirror Code:** Pass.<br>**Black Doors:** Fails (collapses with true convention unless beliefs are parsed).<br>**Water-Turn:** Fails (often misidentifies coercion as convention).<br>**Observability:** Fails (requires mind-reading). | **Too Clean.** It resolves the ambiguity you want to explore. Good for the Code, bad for the Doors. |
  | **Sanction-Based (Norms + Punishment)** | **Black Doors:** Pass (identifies the pressure).<br>**Dawn Bell:** Pass (identifies the burden).<br>**Ledge Lamps:** Fails (might classify the 10% refusers as "breaking the rule" rather than testing the system's slack).<br>**Water-Turn:** Pass (identifies the power dynamic). | **Too Cynical.** Makes everything look like oppression. Good for the Water-Turn, kills the cooperation aspect of the Code. |
  | **Evolutionary/Reinforcement (No Beliefs Required)** | **Herders/Dogs:** Pass (explains coordination without mutual understanding).<br>**Winter Shift:** Pass (explains drift without decision).<br>**Mirror Code:** Fails (strips the "agreement" feeling).<br>**Dawn Bell:** Fails (can't explain why they keep it if it's purely negative reinforcement). | **Too Mechanical.** Great for the background/herders, but removes agency from the villagers. |

  **Recommendation:** Do not adopt one account. Use the **Lewisian** definition for the **Mirror Code** (to show ideal cooperation), the **Sanction-Based** view for the **Black Doors** (to show social pressure), and the **Evolutionary** view for the **Herders** (to show instinct). Let the conflict between these definitions be the theoretical engine of the book. The "corner" you painted yourself into is actually the central philosophical tension of the story.
