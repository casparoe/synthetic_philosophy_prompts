  briefly score Dennett's intentional stance, a representational/architectural view that treats some internal states as literal belief-like representations, and a deflationary "it's all next-token prediction" view against the list. keep it short.

  format:
  - The setup and cases: ~2 short paragraphs
  - The desiderata (with motivating case per item): long, bullet list okay
  - Hard vs negotiable: ~1 paragraph
  - Joint unsatisfiability check: ~2 paragraphs
  - Scorecard (Dennett / representational / deflationary): brief bullets

  don't ask for citations, reading lists, or bibliographies. avoid obscure jargon unless you define it in the answer. also i need this to work for a model without web access, so don't hinge anything on a specific obscure paper or result.
