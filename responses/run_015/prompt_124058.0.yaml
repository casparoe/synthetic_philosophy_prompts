  2. The menu of precise readings
  1. **The Logical Truism:** *Form:* If agents lack memory of event E, they cannot learn from E. *Status:* Trivially true. This is a definition of learning, not a guide for action. It supports no specific policy because it does not claim learning is always required or beneficial. In the context of transitional justice, this reading is useless; it establishes a condition for learning but not a duty to learn. It cannot argue against forgetting because one might choose not to learn for strategic reasons.

  2. **The Strong Empirical Claim:** *Form:* Forgetting past atrocities inevitably causes their recurrence. *Status:* False. History provides counterexamples where amnesia facilitated peace (e.g., post-Franco Spain). It ignores multifactorial causes of violence, assuming memory is the sole preventative variable. This reading is often implicitly relied upon by the slogan's users, but it collapses under historical scrutiny. If false, it cannot support any normative conclusion about what we ought to do.

  3. **The Probabilistic Claim:** *Form:* Forgetting increases the statistical likelihood of recurrence. *Status:* Empirically testable and plausible, but not universal. It allows for exceptions where forgetting reduces immediate violence, making it insufficient for an absolute ban on forgetting. This is the most scientifically honest reading, but it only supports a *prima facie* duty to remember, which can be overridden by stronger competing duties like immediate peace.

  4. **The Prudential Imperative:** *Form:* To avoid future harm, agents ought to remember. *Status:* Morally defensible but contingent. It depends on whether remembering actually reduces harm, which is context-dependent. If remembering provokes violence, this imperative flips. This reading turns the slogan into a consequentialist calculation, which opens the door for strategic forgetting if remembering proves too dangerous.

  5. **The Deontological Duty:** *Form:* Agents have an intrinsic obligation to remember, regardless of consequences. *Status:* Normative principle. This aligns with Margalit's ethics of memory but conflicts directly with consequentialist arguments for forgetting. It requires grounding in duties to the dead. This is the only reading that supports an absolute ban, but it requires heavy philosophical lifting regarding the rights of the deceased versus the needs of the living.

  6. **The Identity Constitutive Claim:** *Form:* A community ceases to be itself if it forgets its foundational traumas. *Status:* Normative/Existential. Plausible for victims seeking dignity, less so for perpetrator societies seeking renewal. It defines memory as ontological survival. This reading suggests forgetting is a form of social suicide, but it risks essentializing trauma as the sole basis of community identity.

  7. **The Universal Prohibition:** *Form:* No political community should ever institutionalize forgetting. *Status:* False/Overbroad. It fails to distinguish between impunity and strategic amnesia for reconciliation. It conflates moral memory with political policy. This is the political translation of the slogan, but it ignores the distinction between private memory and public institutional silence.

  The slogan's power lies in conflating these distinct claims, allowing the empirical risk (Reading 3) to borrow the moral force of the duty (Reading 5). By sliding between these meanings, proponents avoid defending the strong empirical claim or justifying the deontological duty.

  3. Verdicts on plausibility and scope
  The most defensible readings are the Probabilistic Claim and the Prudential Imperative, yet neither supports a universal ban on forgetting. The Probabilistic Claim acknowledges risk without dictating inevitability, allowing for cost-benefit analysis where forgetting might lower immediate tensions even if it risks long-term recurrence. The Strong Empirical Claim is untenable given historical counterexamples where "pacts of forgetting" prevented civil war relapse, such as the Spanish Transition or the Mozambique peace process. The Deontological Duty is philosophically robust within a framework of justice-as-recognition (Margalit), but it cannot override competing moral goods like peace or stability without further argument. Consequently, the scope of any valid remembrance obligation is not universal. It applies differently depending on the nature of the atrocity and the political context. A blanket application fails because it treats all pasts as morally equivalent and all futures as equally preventable through memory. Thus, the slogan's universal scope is its weakest feature; it collapses distinct political problems into a single moral imperative, ignoring the trade-offs inherent in transitional justice. For instance, in post-genocide contexts, memory may be vital for justice, whereas in post-civil war contexts, forgetting might be vital for coexistence. The slogan obscures this distinction. Moreover, it fails to account for the *capacity* to remember; societies fractured by violence may lack the institutional stability required for safe remembrance. In such cases, insisting on memory prematurely can reignite conflict. Therefore, the slogan's plausibility is highly context-dependent, rendering it useless as a universal principle for transitional justice policy.

  4. The mnemonic asymmetry challenge
  Your asymmetry objection strikes at the slogan's universal quantifier ("Those who..."). A universal mandate ignores that remembrance obligations are agent-relative. Victims may owe it to the dead to remember; perpetrators may owe it to the living to forget (or at least not dominate public space with their narrative); descendants owe a duty of accurate transmission, not necessarily emotional retention. If obligations differ, a slogan implying uniform duty misfires. For victims, "Never Forget" affirms dignity; for perpetrators, it may perpetuate stigma hindering reintegration. Strategic forgetting often targets the *public institutional* sphere to allow coexistence, not private memory. The slogan conflates private moral duty with public political strategy. By failing to distinguish who owes what to whom, the slogan cannot adjudicate cases where victim remembrance conflicts with societal peace. Therefore, it cannot dismiss strategic forgetting, which is precisely about managing these asymmetrical demands to prevent further violence. Furthermore, descendants lack the epistemic access of witnesses, changing the nature of their obligation from retention to interpretation. The slogan treats memory as a monolithic block rather than a distributed set of responsibilities. It also ignores the temporal dimension: immediate post-conflict phases may require amnesia for safety, while later generations may require memory for justice. A universal slogan cannot navigate these temporal shifts in obligation. Bystanders, meanwhile, bear a duty to witness that differs from both victims and perpetrators, requiring acknowledgment without appropriation.

  5. Which reading does the work
  Your instructor and classmate likely conflated the Probabilistic Claim with the Deontological Duty, treating the risk of repetition as a moral absolute. They intended the slogan to function as a universal prohibition (Reading 7), grounded in the fear of recurrence (Reading 2). However, this interpretation is unsound because it assumes memory always prevents violence, ignoring cases where it fuels resentment. It does not defeat the case for strategic forgetting because that case accepts the risk of repetition as a trade-off for immediate stability. To truly defeat strategic forgetting, one must prove that the moral cost of forgetting (injustice) always outweighs the cost of remembering (conflict), which the slogan alone cannot establish. It remains a heuristic, not a proof. The slogan works rhetorically to shame proponents of forgetting, but logically it fails to address the specific conditions under which forgetting might be ethically permissible or even required for peace.
