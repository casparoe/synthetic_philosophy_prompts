  4. The mnemonic asymmetry challenge (about 300 words): address whether the slogan's universal form can accommodate the idea that different groups bear different remembrance obligations, and whether this undermines its use as a dismissal of strategic forgetting.
  5. Which reading does the work (about 200 words): conclude by identifying which precise interpretation the classmate and instructor likely intended, whether that interpretation is sound, and whether it actually defeats the case for forgetting.
