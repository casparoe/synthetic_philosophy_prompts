  **JOINT MEMORANDUM TO THE BOARD OF TRUSTEES**
  **Re:** Interpretation of the "Western Values" Clause
  **From:** [Trustee A] and [Trustee B]
  **Date:** October 26, 2023

  **1. AGREED CLAIMS**
  *Note: Claims marked (LB) are load-bearing for our final recommendation. Claims marked (C) are concessive background. Confidence levels apply to our shared assessment of fact.*

  1.  **Verbal vs. Substantive:** We agree that part of our dispute is verbal. Both sides accept that "Western values" refers to a set of political and cultural norms prevalent in North America and Western Europe since 1960. The disagreement is not about dictionary definitions, but about whether the phrase *tracks* a real, stable inheritance (Thick) or merely *signals* group membership against outsiders (Functional). (LB, High Confidence)
  2.  **Operational Inconsistency:** We agree that the phrase is currently applied inconsistently. There are grants funded under this clause that share no obvious substantive commitments, and there are unfunded proposals that clearly align with standard definitions of Western liberalism. (LB, High Confidence)
  3.  **Grandfather's Intent:** We agree that our grandfather likely believed he was naming something real (Thick), but we cannot know if he understood the phrase would function socially as a boundary marker (Functional). Assuming he intended only one excludes historical nuance. (C, Medium Confidence)
  4.  **Category Clarification:** We acknowledge a structural confusion in our debate. The Thick Reading describes *content* (what is believed); the Functional Reading describes *usage* (what the phrase does). These are not mutually exclusive facts. A thing can have content and still be used primarily as a boundary marker. Our decision rests on which description better predicts future grantmaking stability. (LB, High Confidence)
  5.  **Record Availability:** We assume minutes and grant letters exist continuously from 1960 to present. **Flag:** We are not confident complete records exist for the 1960s and 70s. Gaps here will weaken the Invocation Curve test. (LB, Low Confidence)

  **2. DISAGREEMENTS TABLE**

  | Neutral Claim | Thick Reading Formulation | Functional Reading Formulation |
  | :--- | :--- | :--- |
  | **Origin of Commitments** | The commitments exist independently of our funding decisions and guide them. | The commitments are derived retrospectively to justify funding decisions already made on other grounds. |
  | **Stability of Meaning** | The meaning is stable enough that listing explicit commitments would not alter our grantmaking profile. | The meaning is fluid; making it explicit would force us to reject past grantees or accept new ones we currently exclude. |
  | **Risk of Removal** | Striking the clause abandons a substantive moral inheritance and risks mission drift. | Striking the clause removes a vague signal that currently allows us to exclude partners without stating explicit biases. |

  **3. CRUXES AND TESTS**
  *For each test, we state our divergent predictions and what would count as evidence against our respective views. Confidence levels reflect our guess on what the data will show, not the validity of the test.*

  **A. The Substitution Test**
  *Method:* Take five key sentences from our mission materials containing "Western values." Substitute the most charitable explicit list of commitments (e.g., "individual liberty, rule of law, free markets").
  *   **Thick Prediction:** The sentence loses force or authority. The residue is the implied historical weight of the tradition. (Confidence: Medium)
  *   **Functional Prediction:** The sentence loses ambiguity. The residue is the ability to exclude without specifying criteria. (Confidence: High)
  *   **Falsification:**
      *   *Thick:* If substitution makes the sentence *clearer* without losing donor trust, the Thick claim that the phrase carries unique authority is false.
      *   *Functional:* If substitution makes the sentence *weaker* or causes donor backlash, the Functional claim that the vagueness is purely strategic is false.

  **B. The Defection Test**
  *Method:* List entities described in our records as having "betrayed" or "abandoned" these values. Check if this list correlates with specific ideological shifts or merely with geopolitical adversaries of the era.
  *   **Thick Prediction:** The list tracks consistent philosophical deviations (e.g., authoritarianism, collectivism) regardless of alliance. (Confidence: Low)
  *   **Functional Prediction:** The list tracks geopolitical alliances (e.g., USSR vs. US allies) even when those allies violated the stated values. (Confidence: High)
  *   **Falsification:**
      *   *Thick:* If we funded authoritarian regimes during the Cold War under this clause, the Thick reading is historically untenable.
      *   *Functional:* If we consistently defunded allies who violated liberal norms despite strategic cost, the Functional reading is too cynical.
  *   **Flag:** This requires honest auditing of Cold War-era grants. We are not confident our files document the *reasoning* for rejected proposals from that era.

  **C. The Audience Flip**
  *Method:* Compare language in domestic annual reports vs. communications with foreign partners.
  *   **Thick Prediction:** Commitments are presented as universal truths binding on everyone. Variations are rhetorical, not substantive. (Confidence: Medium)
  *   **Functional Prediction:** Commitments are presented as "our heritage" abroad (exclusive) and "universal standards" at home (inclusive). The flip is systematic. (Confidence: High)
  *   **Falsification:**
      *   *Thick:* If foreign communications explicitly frame values as culturally relative to the West, the Thick claim to universality is compromised.
      *   *Functional:* If the language remains identical across audiences despite different strategic goals, the Functional claim of strategic signaling is weakened.

  **D. The Invocation Curve**
  *Method:* Code board minutes for frequency of the phrase. Compare clusters to years of internal grantmaking disagreement vs. years of external political pressure.
  *   **Thick Prediction:** Invocations cluster during periods of external threat to Western institutions (e.g., 1968, 1989, 2001). (Confidence: Low)
  *   **Functional Prediction:** Invocations cluster during internal board disputes about specific grants where criteria were otherwise unclear. (Confidence: Medium)
  *   **Falsification:**
      *   *Thick:* If usage spikes during internal budget fights rather than external crises, the phrase is functioning as a trump card, not a beacon.
      *   *Functional:* If usage is constant regardless of internal friction, the phrase is likely genuine boilerplate rather than a strategic tool.

  **4. CALIBRATION AND RECOMMENDATION**

  We must be clear about where this document leans on assumption versus evidence. The Agreed Claims regarding **Operational Inconsistency (1.2)** are load-bearing; if the clause actually guided grants consistently, the Functional reading would collapse. We are highly confident in this based on recent files. However, our confidence in the **Record Availability (1.5)** is low. If the 1960s minutes are missing, the Invocation Curve and Defection Tests will rely on inference, reducing their power to change minds.

  Regarding the category mistake noted in Claim 1.4: We recognize that a "mixed view" is the most historically probable reality. The phrase likely named a real inheritance *that was also used* as a boundary marker. The question for the Board is not which reading is metaphysically true, but which is operationally honest.

  **Our Joint Recommendation:**
  Based on the high confidence in the Functional predictions for the **Defection** and **Audience Flip** tests, we suspect the phrase functions more as a boundary than a beacon. However, the Thick Reading captures the donor intent. Therefore, we propose a **hybrid solution**: Retain the historical preamble acknowledging the grandfather's intent (satisfying Thick), but rewrite the operative mission statement to list explicit commitments (neutralizing Functional ambiguity). This preserves the inheritance without retaining the vague signaling device.

  We recommend running the Substitution Test immediately on the draft rewrite. If the Board feels the explicit list lacks the "warmth" of the original, we will know the Thick Reading holds emotional weight regardless of logical precision. If the Board feels relief at the clarity, the Functional Reading was correct: the vagueness was the point.

  **[Signatures]**
