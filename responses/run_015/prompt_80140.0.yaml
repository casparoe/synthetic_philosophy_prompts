answer: |-
  This is an excellent analytical instinct. The phrase "the world is becoming less violent" is often used as a "steel man" for inaction, but it collapses under scrutiny because it aggregates distinct statistical claims that have very different policy implications.

  Your board member is making a **causal claim** (history has a natural arc toward peace) based on a **descriptive claim** (violence metrics are down). To push back, you need to separate the description from the causation and isolate the metrics that matter for *your* specific grantmaking.

  Here is a menu of five distinct interpretations of that claim, broken down by time window, metric, and violence category. You can bring this directly to the board to test which specific claim they are relying on.

  ### The Menu of Claims

  | # | The Specific Claim | Time Window | Metric & Category | Is it Defensible? | Does it Support Cutting Funding? | Is it Decision-Relevant? |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1** | **The Deep Historical Decline** | 10,000 years (Holocene to present) | **Per-capita** rate of violent death (homicide + war). | **Mostly Yes.** Anthropological and historical data suggest tribal warfare and homicide rates were significantly higher per capita in pre-state societies. | **No.** This describes a civilizational shift over millennia, not current marginal utility. It implies *state formation* reduced violence, not that *current* prevention is redundant. | **No.** A foundation operating on 3-5 year grant cycles cannot act on millennial trends. This is a narrative, not a strategy. |
  | **2** | **The "Long Peace" (Great Powers)** | 1945 to Present | **Absolute & Per-capita** Interstate War deaths (specifically between major powers). | **Yes.** Direct conflict between great powers (US, USSR/Russia, China, EU) is historically anomalous and low. | **No.** This peace is widely attributed to *active* deterrence (nukes), institutions (UN, NATO), and economic integration. These are forms of structural prevention, not natural laws. | **Low.** Most small foundations do not fund nuclear deterrence or UN security council reform. This trend is maintained by governments, not NGOs. |
  | **3** | **The Absolute Numbers Claim** | 1990 to Present | **Absolute** number of conflict deaths (Civil + Interstate). | **No.** While per-capita rates may fluctuate or dip, global population has grown from 5.3B to 8B. A stable rate means rising absolute deaths. Recent years (Ukraine, Sudan, Gaza, Ethiopia) show absolute spikes. | **No.** If your goal is to save *lives*, absolute numbers are the only metric that matters. A 0.01% rate of 8 billion people is more deaths than a 0.02% rate of 2 billion people. | **High.** This is the core metric for a foundation counting lives saved. If absolute risk is stable or rising in specific regions, funding is not redundant. |
  | **4** | **The "Civil War Peak" Claim** | 1990–2010 vs. 2010–Present | **Incidence** of internal armed conflict. | **Mixed/No.** Civil wars declined after the Cold War but have plateaued or risen slightly in the last decade (fragile states). They are also lasting longer. | **No.** The "easy" conflicts ended; the remaining ones are in hard-to-reach, fragile contexts where market forces *do not* solve violence. | **High.** This is likely where your grants operate. The "low hanging fruit" of peace is gone; remaining conflicts require targeted intervention. |
  | **5** | **The "Self-Correcting History" Claim** | Indefinite | **Causal Mechanism** (Violence declines automatically due to commerce/reason). | **No.** This is a philosophical stance (e.g., Pinker's *Enlightenment Now*), not an empirical fact. Trends reverse (see 1914–1945). Peace requires maintenance. | **Yes (if true).** If peace is automatic, funding is wasted. **But since it is likely false,** this is the weakest link in the board member's argument. | **High.** This is the philosophical battleground. You must argue that peace is a *garden* (needs tending), not a *river* (flows naturally). |

  ### How to Use This in the Board Meeting

  Your board member is likely conflating **Claim 1** (which is defensible but irrelevant) with **Claim 5** (which is relevant but indefensible). Here is how to structure your pushback:

  #### 1. Isolate the Metric (Absolute vs. Per-Capita)
  Ask the board: *"Are we funded to reduce the statistical **rate** of violence, or to save actual **human lives**?"*
  *   **The Argument:** If the global population doubles and the violence rate halves, the *rate* is down (good for historians), but the *number of grieving families* is the same (bad for a foundation).
  *   **The Pivot:** If the board member cares about absolute lives, Claim 3 becomes the focus. Since absolute numbers of conflict deaths have not collapsed to zero (and are currently spiking in specific regions), the work is not redundant.

  #### 2. Challenge the Causality (Claim 5)
  The board member's logic rests on the idea that the trend is *autonomic*—that it happens "on its own."
  *   **The Argument:** The "Long Peace" (Claim 2) is not a law of physics; it is the result of expensive, difficult, active maintenance (diplomacy, peacekeeping, development aid, norm enforcement).
  *   **The Analogy:** "Saying we should cut conflict prevention because violence is trending down is like saying we should cut fire department funding because fire deaths have dropped since the 19th century. The drop happened *because* we built fire departments and codes, not because fire stopped being dangerous."
  *   **The Pivot:** Our grants *are* the maintenance mechanism. If we stop funding, we aren't "riding the trend"; we are removing the guardrails that keep the trend going.

  #### 3. Define the Counterfactual
  The board member assumes that without your foundation, the trend would continue unchanged.
  *   **The Argument:** Conflict prevention is often about **tipping points**. In a fragile state, violence might be at a 20-year low, but that low is precarious. A small intervention can prevent a slide back into war; a small withdrawal can allow it.
  *   **The Pivot:** We are not funding "high violence" contexts only; we are funding "high risk" contexts. The fact that violence is currently low in a region may be *because* of previous prevention work, making continued funding essential to sustain it, not redundant.

  ### The Decision-Relevant Bottom Line

  For a foundation deciding how many lives its grants will save, **only Claim 3 and Claim 4 are decision-relevant.**

  *   **Claim 1 (Deep History)** is comforting narrative. It tells a story about human nature, but it cannot inform a 2025 budget.
  *   **Claim 2 (Great Power Peace)** is geopolitical luck and statecraft, largely outside the remit of small foundations.
  *   **Claim 3 & 4 (Absolute Numbers & Civil Conflict)** are where the marginal utility of your grants lives.

  **The Script for the Board:**
  > "We agree that long-term historical data shows a decline in per-capita violence. However, that trend is not automatic; it is the result of active institutional maintenance. Furthermore, because the population has tripled since 1950, a lower *rate* of violence still results in millions of absolute deaths. Our foundation's metric for success is absolute lives saved in fragile contexts, not global historical rates. In those specific contexts, the risk of conflict is not solving itself; it requires the marginal intervention we fund to prevent backsliding. Cutting funding assumes the trend is self-sustaining, but history shows that when prevention infrastructure is removed, violence returns."

  This moves the conversation from a philosophical debate about human progress (which you might lose) to a operational debate about risk maintenance and absolute harm (which you are positioned to win).
