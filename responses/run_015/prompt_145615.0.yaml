answer: |-
  1. Objective and setup
  The seminar aims to embody the absent-minded driver paradox as a dyadic coordination failure within a linear sequence of three hidden-state stations arranged around the room's perimeter. Seven pairs of students will navigate this track using opaque state cards and observation screens that permit viewing their partner's position while structurally concealing their own current node.

  2. Rules and payoffs
  Participants earn high-value tokens for exiting jointly at the second node but receive negligible rewards for stopping at the first or overshooting to the third, enforcing an ex ante optimal plan. Crucially, the rule set forbids communicating one's own location, ensuring that reaching the target node creates an epistemic gap where acting on the plan requires ignoring the very evidence of arrival.

  3. Execution timeline
  The first twenty minutes cover instruction and a practice run, followed by forty minutes of repeated gameplay cycles where pairs attempt to coordinate their exit without direct self-location knowledge. The final fifteen minutes are reserved for collecting payoff data and preparing the group for the conceptual debrief.

  4. Debrief and conceptual mapping
  Discussion must link the frequent coordination failures to the tension between ex ante planning and ex post rationality, highlighting how self-locating belief collapses when observational access is asymmetrical. I predict the first run will misfire due to confusion over the asymmetrical observation rule, requiring clarification that seeing one's partner does not reveal one's own state.

  5. Honest limitations
  This discrete simulation cannot reproduce the continuous temporal unfolding of belief revision inherent to the original philosophical problem, as the card-based nodes create artificial stopping points. This structural gap must be addressed in discussion by explicating how real-time forgetfulness differs from the static ignorance imposed by the hidden state cards.
