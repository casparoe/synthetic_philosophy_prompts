answer: |-
  This is a fantastic observation, and you are right to sense that it isn't dialetheism. Dialetheism claims that $P \land \neg P$ is *true* (the world is contradictory). What you are describing is a system that maintains $P$ and $\neg P$ by ensuring they never occupy the same logical space, thereby avoiding the contradiction entirely.

  There are three layers to naming and categorizing this: the logical mechanism, the philosophical framework, and the legal practice.

  ### 1. The Logical Mechanism: Non-Adjunctivity
  The most precise technical term for what you are describing comes from Nicholas Rescher and Robert Brandom's *The Logic of Inconsistency* (1980). They call it **Non-Adjunctive Logic**.

  In classical logic, if you accept $P$ and you accept $Q$, you must accept $P \land Q$ (Adjunction). In a non-adjunctive system, you can accept $P$ in one "scenario" and $\neg P$ in another "scenario" without being forced to conjoin them into a single contradictory statement ($P \land \neg P$).

  *   **How it fits:** The court accepts "Valid" in Scenario A (e.g., for the purpose of jurisdiction) and "Void" in Scenario B (e.g., for the purpose of damages). Because the logic forbids merging Scenario A and Scenario B, the explosion principle ($P, \neg P \vdash \text{Anything}$) is never triggered.
  *   **Why it's not Paraconsistency:** Paraconsistent logic *tolerates* the contradiction $P \land \neg P$ without exploding. Non-adjunctivity *prevents* the formation of $P \land \neg P$ by segregating the contexts. It is a strategy of **containment** rather than **tolerance**.

  ### 2. The Philosophical Framework: Fragmentalism
  If you want a metaphysical or structural label, the term is **Fragmentalism**, most notably developed by philosopher Kit Fine (e.g., in "Tense and Reality," 2005).

  Fragmentalism posits that reality (or the discourse about it) is not a single, coherent whole but is composed of "fragments."
  *   **Fragment A:** Contains the fact *Contract is Valid*.
  *   **Fragment B:** Contains the fact *Contract is Void*.
  *   **The Rule:** No single fragment contains both facts. Therefore, within any given fragment, the Law of Non-Contradiction holds. The inconsistency only appears from a "God's eye view" that attempts to merge the fragments—a view the system explicitly rejects.

  In your seminar, you could call this **"Juridical Fragmentalism."** It captures the idea that the law constructs multiple, mutually inconsistent realities that are locally coherent but globally inconsistent.

  ### 3. The Legal Practice: Functional Contextualism
  In legal theory, this is often discussed under **Contextualism** or **Purpose-Relative Validity**. Legal realists argue that legal concepts (like "validity") are not monolithic properties but tools used for specific functions.

  *   **Example:** A contract might be "valid" for the purpose of establishing standing (you need a contract to sue) but "void" for the purpose of enforcement (no consideration).
  *   **The Label:** **"Doctrinal Compartmentalization."**

  ### Distinguishing it from Dialetheism and Paraconsistency

  Here is the breakdown you can use for your seminar slides:

  | Feature | Dialetheism | Paraconsistent Logic | **Your Legal Observation** |
  | :--- | :--- | :--- | :--- |
  | **Status of $P \land \neg P$** | True. | Possible (does not explode). | **Never formed (Blocked).** |
  | **Goal** | Describe an inconsistent world. | Reason through inconsistency. | **Preserve local consistency.** |
  | **Mechanism** | Accept contradiction. | Weaken inference rules. | **Index/Contextualize propositions.** |
  | **Metaphor** | A knot. | A shock absorber. | **Watertight bulkheads.** |

  **Where it stops being Dialetheism:**
  It stops being dialetheism the moment the court refuses to assert the conjunction. If the judge says, "For the purpose of X, it is valid, and for the purpose of Y, it is void," they are implicitly asserting $P_x$ and $\neg P_y$. Since $P_x$ and $\neg P_y$ are not logical contradictories (due to the subscripts), classical logic is preserved. Dialetheism requires asserting $P$ and $\neg P$ under the *same* aspect.

  **Where it differs from Paraconsistency:**
  Paraconsistency is a logic of *last resort* when contradictions cannot be eliminated. This legal practice is a logic of *design*. The court actively constructs the contexts to ensure the contradiction never materializes. It is a **strategic avoidance of inconsistency** rather than a **logical tolerance of inconsistency**.

  ### Suggested Terminology for Your Seminar

  If you need a catchy label for this phenomenon, I recommend **"Contextual Fragmentalism"** or **"Non-Adjunctive Compartmentalization."**

  However, if you want to sound like you've dug into the specific intersection of law and logic, call it **"Scenario-Based Non-Adjunctivity."**

  **The "So What?" for your seminar:**
  This practice reveals that legal reasoning often prioritizes **Local Coherence** over **Global Consistency**. Classical logic demands global consistency. Dialetheism accepts global inconsistency. The law, however, often chooses a third path: **Fragmented Local Consistency.** It sacrifices the unity of the legal system to ensure that within any specific doctrinal lane, the rules remain classical and predictable.

  This is a crucial distinction: The law isn't saying "Contradictions are true." It's saying "We will not look at both sides of the contradiction at the same time." That is an epistemic constraint, not an ontological claim.
