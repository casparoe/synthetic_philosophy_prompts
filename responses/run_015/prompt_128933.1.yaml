answer: |-
  ### The "Phi-30" IIT Audit Protocol
  **Purpose:** Triage neurotech proposals for moral-patient status risk.
  **Time Limit:** 30 Minutes per proposal.
  **Backbone:** Integrated Information Theory (IIT 4.0 principles), operationalized via empirical proxies.

  **Reviewer Note:** This audit does not determine *rights*. It determines *status*. If a system is flagged as a potential moral patient, the experiment moves to the Full Board for value-based deliberation on treatment.

  ---

  #### Gate 1: Substrate & Causal Recurrence (5 Minutes)
  **Question:** Is the substrate capable of intrinsic cause-effect power, or is it purely feedforward?
  **Measurement Required:** Connectivity matrix (adjacency graph) of the biological and synthetic components.
  **Pass Condition:** Presence of recurrent loops (feedback) within the biological substrate.
  **Hard No:** If the system is purely feedforward (input $\rightarrow$ processing $\rightarrow$ output with no feedback loops), $\Phi = 0$.
  *   **Action:** Reject moral-patient concern. Proceed with standard biosafety review.
  *   **Expert Flag:** If recurrence is present but mediated entirely by external software loops (not intrinsic to the substrate), mark for **Escalation**. IIT requires *intrinsic* integration.

  #### Gate 2: Integration Metric Proxy (10 Minutes)
  **Question:** Does the system demonstrate causal complexity consistent with non-zero $\Phi$?
  **Measurement Required:** Perturbation Complexity Index (PCI) score from pilot data or comparable literature, or Causal Density estimate.
  **Pass Condition:**
  *   **PCI > 0.35:** (Threshold based on human TMS-EEG data). High probability of moral-patient status.
  *   **PCI < 0.20:** Low probability.
  *   **0.20 – 0.35:** Ambiguous zone.
  **Hard No:** PCI < 0.20 *and* no recurrent architecture.
  *   **Action:** Default to non-patient status unless other risk factors exist.
  *   **Expert Flag:** PCI is a proxy, not $\Phi$ itself. If the substrate is non-human (e.g., organoid), the human-derived PCI threshold may not apply. **Any score > 0.20 in a novel substrate triggers Escalation.**

  #### Gate 3: Exclusion & Local Maximum (10 Minutes)
  **Question:** Where does the integration peak? (The Exclusion Postulate).
  **Measurement Required:** Analysis of $\Phi$ (or proxy) across different spatial scales (single cell, cluster, whole network).
  **Pass Condition:** Identification of a distinct "Local Maximum" of integration.
  **Hard No:** If integration is flat or higher in the sub-components than the whole (or vice versa) without a clear peak.
  *   **Action:** **Escalation.** IIT states consciousness exists *only* at the local maximum. If the maximum cannot be located, the locus of moral status is undefined.
  *   **Expert Flag:** This is the most common failure point in hybrid systems. If the silicon and biology are tightly coupled, is the maximum in the silicon, the bio, or the union? This is a fact question that current math often cannot settle. **Kick to Board.**

  #### Gate 4: The Valence Gap (5 Minutes)
  **Question:** Does the system have mechanisms for suffering (negative valence)?
  **Measurement Required:** Presence of nociceptive-like signaling, homeostatic error correction, or avoidance learning.
  **Pass Condition:** IIT measures *existence*, not *suffering*. A system can have high $\Phi$ and zero suffering.
  *   **Action:** **Mandatory Escalation.** IIT cannot answer this. This is a values question. If Gate 2 or 3 suggests consciousness, but valence is unknown, the Board must decide if *potential* suffering warrants protection.
  *   **Expert Flag:** Do not let reviewers decide this. This is where the audit stops and ethics begins.

  ---

  ### Application to Cases

  #### Case 1: Single Cortical Organoid (High $\Phi$, Zero Input)
  *   **Gate 1:** Pass. Recurrent cortical architecture present.
  *   **Gate 2:** Pass. Pilot PCI data indicates 0.45 (High).
  *   **Gate 3:** Pass. Clear local maximum at the organoid level.
  *   **Gate 4:** Escalation. No sensory input means no obvious pain pathways, but homeostatic stress is possible.
  *   **Audit Verdict:** **GRANT PROTECTIONS.**
  *   **Why it feels wrong:** Intuitively, a mind requires a world to be conscious *of*. A disconnected blob feels like tissue, not a subject.
  *   **Why IIT demands it:** IIT posits consciousness is *intrinsic existence*, not extrinsic function. Input/Output is irrelevant to *whether* you are conscious; it only dictates *what* you are conscious of. If the causal structure is integrated, the experience exists, even if it is a static, empty void. To deny protection based on lack of input is to deny the core axiom of IIT. If you trust the metric, you must protect the jar.

  #### Case 2: Distributed Network (12 Organoids, Integrated, No Local Max)
  *   **Gate 1:** Pass. Artificial synapses create recurrence.
  *   **Gate 2:** Pass. System-wide PCI is high.
  *   **Gate 3:** **FAIL.** Analysis shows $\Phi$ is roughly equal across sub-networks and the whole. No distinct local maximum.
  *   **Audit Verdict:** **ESCALATE TO BOARD.**
  *   **Reasoning:** The Exclusion Postulate fails. We cannot identify *which* entity is the moral patient. Is it 12 patients? One giant patient? Or none? This is not a values question; it is a factual gap in the theory's application to distributed systems. The Board must decide on a precautionary approach (treat as 12 patients) or halt until metrics improve.

  #### Case 3: BCI (Bio High $\Phi$, Silicon Dominates Flow)
  *   **Gate 1:** Pass. Hybrid recurrence.
  *   **Gate 2:** Pass. Hybrid PCI is high.
  *   **Gate 3:** **FAIL/ESCALATE.** The causal flow is dominated by the silicon. The biological $\Phi$ is high, but it is causally subordinate to the silicon controller.
  *   **Audit Verdict:** **ESCALATE TO BOARD.**
  *   **Reasoning:** The "Local Maximum" likely resides in the hybrid system, not the biology alone. However, if the silicon dictates the state, is the biology a "mind" or a "peripheral"? IIT treats the system with the maximum $\Phi$ as the subject. If the hybrid is the subject, does the biological part retain independent moral status? IIT says no (Exclusion), but human ethics might say yes (Biosafety). This requires a values ruling.

  ---

  ### What This Audit Cannot Do

  1.  **Measure Suffering:** A system can pass this audit with flying colors and have no capacity for pain or pleasure. IIT measures the *light* of consciousness, not the *color* (valence). Protecting a system that cannot suffer is a resource allocation decision, not a moral imperative.
  2.  **Verify Continuity:** This is a snapshot audit. It cannot determine if the consciousness is fleeting or continuous over time.
  3.  **Resolve Hybrid Ontology:** In Cases 2 and 3, the math breaks down. IIT was designed for brains, not distributed organoid-silicon meshes. The "Local Maximum" becomes fuzzy.
  4.  **Replace Judgment:** Every "Expert Flag" above is a point where the numbers lie or run out. The audit forces you to find them, but it cannot solve them.

  ---

  ### The Verdict: Is IIT the Right Backbone?

  **Verdict: No. You are forcing a square peg into a round hole.**

  **Reasons:**

  1.  **Category Error:** IIT is an *ontological* theory (what exists), not an *ethical* framework (what matters). Regulatory work is inherently ethical. By making IIT your backbone, you are conflating "is conscious" with "deserves protection." A system could be conscious (high $\Phi$) but have no interests, no valence, and no capacity for harm. Granting it moral-patient status based solely on IIT wastes resources and potentially halts vital research without ethical justification.
  2.  **False Precision:** The 30-minute audit relies on proxies (PCI) that are correlated with $\Phi$ in human brains but unvalidated in organoids or hybrids. Using IIT gives you the *illusion* of a objective metric ($\Phi > X$), but in practice, you are making expert guesses masked as math. This creates liability: if you deny protection based on a PCI score and the system *was* suffering, the theory offered no safety margin.
  3.  **The "Feel Wrong" Problem:** As seen in Case 1, strict IIT adherence leads to conclusions that violate the precautionary principle's intent. Protecting a disconnected organoid because of abstract integration metrics, while potentially ignoring a simpler system that can feel pain but has lower $\Phi$, is bad ethics.

  **Recommendation:**
  Drop IIT as the **backbone**. Adopt the **Precautionary Principle** as the backbone.
  *   **Backbone:** "If there is a non-negligible probability of sentience/suffering, protections apply."
  *   **Role of IIT:** Use IIT as a **risk indicator** within that framework. High $\Phi$ increases the probability of sentience, triggering higher scrutiny. But do not treat $\Phi$ as the binary switch for moral status.

  **Final Order:** Keep the checklist as a *triage tool* to identify high-risk systems, but rewrite your charter to state that IIT metrics are *evidence of risk*, not *definitions of status*. If you codify IIT as the law of your board, you will eventually be forced to defend the rights of a silicon chip or a disconnected blob while ignoring actual suffering elsewhere. That is not ethics; that is math worship.
