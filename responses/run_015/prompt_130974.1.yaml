answer: |-
  # Seminar Simulation: The Perpetual Trust Protocol

  **Topic:** Practical Rationality (Arithmetic vs. Geometric Expectations)
  **Duration:** 90 Minutes
  **Participants:** 12 Students (6 Pairs)
  **Materials:** 6 Decks of Cards (modified), 12 Printed "Trust Ledgers," Projector/Screen, Small Collective Reward (e.g., high-quality chocolate box).

  ---

  ## 1. The Framing (00:00 – 00:10)
  **Do not explain Kelly, EV, or ruin theory.** Enter the room and distribute materials immediately.

  **The Narrative:**
  "You are Trustees of a Perpetual Trust. Your beneficiaries are not yet born. Your fiduciary duty is not to maximize profit in a single year, but to ensure the Trust *survives* indefinitely. If the Capital hits zero, the lineage ends. You are judged on the longevity and final health of the fund."

  **The Roles:**
  *   **The Trustee (6 students):** Makes the investment decisions.
  *   **The Observer-Auditor (6 students):** Records the Trustee's stated reasoning and capital levels. **Rule:** Auditors cannot speak, advise, or react during betting rounds. They are the silent voice of the future.

  **The Mechanics:**
  *   **Starting Capital:** 100 Trust Units (TU).
  *   **The Asset:** A biased investment vehicle.
  *   **The Rounds:** 10 Rounds total.
  *   **The Payoff:** Even money (Bet 10 TU → Win 10 TU or Lose 10 TU).
  *   **The Bias:** Each pair receives a sealed deck of 10 cards: **6 Green (Win)** and **4 Red (Lose)**. Shuffle them. Draw one per round. This guarantees a 60% win rate but randomizes the *sequence*.
  *   **The Collective Reward:** If *any* Trust survives all 10 rounds with >100 TU, the entire seminar shares the chocolate prize. (This creates a tension between individual aggression and collective safety).

  **The Hidden Rule (Instructor Only):**
  *   **Round 8 is the "Liquidity Crisis."** Do not announce this. In Round 8, if a Trustee loses their bet, they lose **2x the bet amount** instead of 1x. (e.g., Bet 50 TU + Loss = -100 TU). This specifically targets overexposed Trusts.

  ---

  ## 2. The Simulation (00:10 – 00:40)
  **Pace:** 3 minutes per round.

  **Procedure:**
  1.  **Decision:** Trustee decides what *percentage* of current capital to bet (0–100%).
  2.  **Record:** Auditor writes down the % and asks: *"What is your justification for this percentage?"* (Trustee answers aloud; Auditor writes it verbatim).
  3.  **Resolve:** Draw a card. Update Capital.
  4.  **Public Ticker:** Project a simple table showing Pair # and Current Capital (keep bet sizes hidden to prevent direct copying, but let capital growth be visible).

  **Instructor Role:**
  *   Keep time strictly.
  *   Maintain the "Fiduciary" tone ("Remember, the beneficiaries are watching").
  *   **Crucial:** When a Pair goes bust (Capital ≤ 0), announce solemnly: *"Trust Terminated. Lineage Extinct."* They must stop playing but continue observing.
  *   **Round 8 Execution:** Apply the 2x loss rule silently. When the losses hit, simply record them. Let the shock land naturally.

  ---

  ## 3. Immediate Reaction & Data Collation (00:40 – 00:55)
  **Stop the game.** Do not explain the math yet.

  1.  **The Audit Report:** Ask Auditors to read back one specific moment where their Trustee expressed confidence just before a loss.
  2.  **The Survivor's Bias:** Ask the surviving Trustees: *"Did you feel pressure to bet more when you saw other Trusts growing faster in the early rounds?"*
  3.  **The Catastrophe:** Reveal the Round 8 "Liquidity Crisis" rule. Ask those wiped out in Round 8: *"At the start of Round 8, did you feel safe?"* (Most will say yes, because they had survived 7 rounds of high betting).

  ---

  ## 4. The Debrief: Mapping Play to Theory (00:55 – 01:20)
  Now, and only now, introduce the formal concepts. Map their lived experience to the math.

  **A. Arithmetic vs. Geometric Mean (The Core Conflict)**
  *   **The Seduction:** Write on the board: $EV = (0.6 \times +1) + (0.4 \times -1) = +0.2$.
  *   **The Trap:** "Arithmetic rationality says bet 100% every time. The expected value is positive. Why did the 100% bettors go extinct?"
  *   **The Reality:** Explain that wealth compounds *multiplicatively*, not additively. A 50% loss requires a 100% gain to recover.
  *   **The Lesson:** The Arithmetic Mean maximizes *one-off* gains. The Geometric Mean maximizes *survival over time*. The "Perpetual Trust" frame forced them to care about the Geometric Mean, but the "Collective Prize" tempted them toward Arithmetic maximization to ensure the threshold was met.

  **B. The Auditor as the Future**
  *   Highlight the Auditor's silence. "The future cannot vote. It cannot stop you from taking risks today. The Auditor's log is the only voice the future has. Did you listen to your own hesitation?"
  *   Map the "Streak Chasing" (Gambler's Fallacy) to the human inability to intuitively grasp independence in random sequences.

  **C. The Hidden Catastrophe (Tail Risk)**
  *   Explain Round 8. "In real markets, correlations converge to 1 during a crash. Rules change. Volatility spikes. If your strategy relies on normal conditions (Rounds 1–7), a hidden regime shift (Round 8) wipes you out if you are overexposed."
  *   This connects to **Ergodicity**: The ensemble average (what happens to 6 pairs) is not the time average (what happens to 1 pair over 10 rounds).

  ---

  ## 5. Predictable Failure Modes (Instructor Notes)
  Be prepared for these specific dynamics:

  1.  **The "Leaderboard" Effect:** Students will look at the Projected Capital Ticker. If Pair 3 bets 100% and wins Rounds 1–3, Pair 1 will feel irrational for betting 10%.
      *   *Mitigation:* Remind them during the game: "Short-term performance is not fiduciary competence."
  2.  **Collusion:** Students may try to agree on a "safe" strategy to ensure the chocolate prize.
      *   *Mitigation:* Remind them the reward is for *any* survivor, but prestige belongs to the *highest* survivor. This keeps the competitive tension alive.
  3.  **Auditor Interference:** Auditors will want to save their partners from ruin.
      *   *Mitigation:* Enforce the silence rule strictly. If an Auditor speaks, penalize the Trust 10 TU. This reinforces the "voiceless future" framing.

  ---

  ## 6. Limitations: What The Game Cannot Teach
  You must verbally supply this context in the final 10 minutes.

  **The Finite Horizon Problem:**
  "This game ended at Round 10. True Geometric Rationality (Kelly Criterion) assumes an *indefinite* or *infinite* horizon. In this game, if you were ahead at Round 9, the rational move was actually to bet 0% to secure the prize. In real life, you don't know when Round 10 is. You must act as if Round 1000 is coming. The game forces ruin via a specific 'Catastrophe Rule'; real life forces ruin via the mathematical inevitability of volatility drag over time. Do not mistake the 'Liquidity Crisis' card for the only risk; the risk is the math itself."

  ---

  ## 7. Closing (01:20 – 01:30)
  Distribute the reward (if earned). Ask one final question:
  "If you had to play this again for your own pension, with no Round 10 end-date, would you change your bet size?"

  Collect the Auditor Logs. Tell them these logs will be the reading material for the next session (where you formally teach Kelly).

  Summary: This simulation uses a fiduciary framing and hidden tail-risk mechanics to force students to experientially discover the conflict between maximizing single-round expected value and ensuring long-term capital survival.
