          *   **Special Obligations:** Not tautological. Defensible (partiality vs. impartiality). *Doesn't* support "zero aid." It supports *priority*, not exclusion.
          *   **Efficacy:** Empirical claim, not tautological. Debatable (sometimes foreign aid is cheaper/more impactful). *Doesn't* support "zero aid" if foreign aid is *more* efficient in some cases.
          *   **Psychological:** Descriptive, not normative. Just because we *do* care more doesn't mean we *should*. *Doesn't* support the moral conclusion.
