answer: |-
  You have correctly identified a structural gap in our common vocabulary. You are describing a phenomenon where **identity is relational and institutional, not intrinsic or physical.**

  There is no single English noun that perfectly captures this entire pattern across git, builds, and art. However, this is a well-carved concept in three specific fields: **Social Ontology**, **Archival Science**, and **Textual Criticism**.

  Here is the precise breakdown of the concept, the nearest established terms, and why your Google searches failed.

  ### 1. The Philosophical Mechanism: "Status Functions"
  The underlying structure you are describing is defined by the philosopher **John Searle** as a **Status Function**.

  *   **The Concept:** A status function is a property assigned to an object by collective intentionality (agreement), not by physics. It follows the formula: *"X counts as Y in context C."*
  *   **Application:**
      *   **Git:** This specific blob of code (X) counts as the "Upstream/Original" (Y) because the community agrees (C).
      *   **Money:** This piece of paper (X) counts as "$20" (Y) because the Treasury says so (C).
      *   **The Shift:** When the "original" repo is deleted, the community updates context C. The fork (X2) now counts as "Upstream" (Y). The physics didn't change; the *assignment* moved.
  *   **Why "Authenticity" failed you:** In philosophy, "authenticity" often implies an intrinsic moral or historical truth. Searle's **Status Function** is colder: it is purely about *authority assignment*. It explains why the status can migrate without ceremony.

  ### 2. The Archival Term: "Functional Originality"
  In Archival Science (specifically the work of **Luciana Duranti** and the **ISAD(G)** standard), this is a solved problem. Archivists deal with this daily when the "master" tape is lost and a working copy must become the "record."

  *   **The Concept:** **Recordness** (or Archival Value). A document is a "record" not because of its content, but because of its **Archival Bond**—its link to the transaction or creator that generated it.
  *   **The Shift:** When the primary record is destroyed, a copy can acquire **Functional Originality**. It assumes the legal and evidentiary role of the original.
  *   **The Distinction:** Archivists distinguish between the **"Physical Original"** (the first atom-based instance) and the **"Archival Original"** (the authoritative instance in the chain of custody). You are describing the **Archival Original**.
  *   **Why it fits:** It explicitly allows for the "copy becomes original" dynamic you noted in git. It treats "original" as a *role* in a system, not a *state* of matter.

  ### 3. The Aesthetic Term: "Autographic History"
  In aesthetics, **Nelson Goodman** (*Languages of Art*) provides the framework for your forgery example.

  *   **The Concept:** Goodman distinguishes between **Autographic** arts (painting, where history of production matters) and **Allographic** arts (music/code, where notation matters).
  *   **The Orthogonality:** You noted that "Original" and "Genuine" are orthogonal. Goodman calls this the difference between **Authenticity** (history of production) and **Correctness** (compliance with the score/schema).
      *   **The Fake:** A forgery is *Authentic* to the forger (it is the original instance of the forger's work) but *Inauthentic* to the attributed artist.
      *   **The Copy of the Fake:** This lacks the history of production of the forger's hand. It is a copy of an authentic fake.
  *   **The Boundary:** Goodman's framework explains why the fake is an "original" of its own lineage. However, Goodman is rigid; he doesn't easily account for the *shift* (the fork becoming upstream). For that, you need the Archival/Social Ontology view.

  ### 4. The Textual Criticism Term: "Copy-Text"
  In scholarly editing (Greg-Bowers theory), editors must choose a base version of a text to work from.

  *   **The Concept:** The **Copy-Text**. This is the version chosen as the authoritative basis for an edition.
  *   **The Shift:** Ideally, the Copy-Text is the author's manuscript. If that is lost, a later printed edition becomes the Copy-Text. It *becomes* the authority by necessity and consensus, even though it is physically a copy.
  *   **Relevance:** This is the exact historical precedent for your git fork scenario. The "Original" is actually the **"Authoritative Witness."**

  ### The Verdict: What do you call it?

  There is no single noun, but there is a precise phrase used in information security and archival theory that fits your pattern best:

  **"Provenancial Authority"** (or **"Canonical Provenance"**)

  *   **Provenance:** Captures the lineage/history (the "where it came from").
  *   **Authority:** Captures the social/institutional power to designate status (the "why we trust it").
  *   **Why it works:** It decouples the *object* from the *status*. An object *has* provenance, but it *holds* authority. When the authority holder vanishes, the authority transfers to the next best provenance.

  **How to use it:**
  Stop using the word "Original." It is the source of your friction because "Original" linguistically implies *temporal priority* (first in time). What you are actually tracking is **Canonical Status**.

  *   **Don't say:** "The fork became the original."
  *   **Say:** "The fork assumed **Canonical Status**."
  *   **Don't say:** "Is this binary the original?"
  *   **Say:** "Does this binary have **Authoritative Provenance**?"

  ### Summary of Boundaries

  | Concept | Fits Your Pattern? | Why / Why Not |
  | :--- | :--- | :--- |
  | **Authenticity** | **No** | Too loaded with "truth/genuineness." Conflates *origin* with *validity*. |
  | **Identity** | **No** | Usually implies physical continuity (Ship of Theseus). |
  | **Type/Token** | **Partial** | Explains identical copies, but fails to explain the *shift* in status. |
  | **Status Function** | **Yes (Mechanism)** | Explains *how* the status is assigned socially, but is abstract. |
  | **Functional Original** | **Yes (Role)** | Best archival term. Defines "original" as a job, not a birthright. |
  | **Canonical** | **Yes (Status)** | Best practical word. Implies authority + consensus + potential for change. |

  **The Carving:**
  The pattern you see is the **Decoupling of Material Identity from Institutional Status.**
  The specific property is **Provenancial Authority.**
  The dynamic is **Canonical Succession.**

  If you need a single label for your documentation or mental model, use **"Canonical Instance."** It implies that the "originality" is a function of the system's trust root, not the object's physical history.
