answer: |-
  **Exam Question (30 Marks)**

  **Essay Prompt:**
  Consider a nested calibration scenario involving two measurement devices. Instrument A is used to calibrate Instrument B (meaning you rely on A's readings to set B's baseline). Once calibrated, Instrument B is subsequently used to verify the accuracy of Instrument A.

  Write an essay analyzing whether this second-order check resolves the bootstrapping problem associated with basic knowledge sources. In your answer, address whether this setup breaks the circular loop or merely extends the chain of dependence. Furthermore, discuss whether the 'easy knowledge' objection applies at this second order just as it did at the first. You do not need to cite specific authors or provide a bibliography, but your reasoning should be precise.

  *(Recommended time: 45 minutes)*

  ***

  **Model Answer**

  The bootstrapping problem, at its core, highlights a failure in how we justify the reliability of our knowledge sources. If I use a gas gauge to check itself—looking at the gauge, seeing it says "full," and concluding the tank is full and the gauge is reliable—I haven't actually learned anything. I've just assumed what I set out to prove. The question here is whether adding a second instrument changes anything fundamental or if it just dresses up the same circular logic in fancier clothes.

  In this nested scenario, Instrument A calibrates Instrument B. This step is crucial. For B to be calibrated correctly by A, A must already be reliable. If A is broken, B is calibrated to a broken standard. So, the very existence of a properly functioning B presupposes the reliability of A. When we then turn B around to check A, we are asking B to vouch for the very thing that gave B its voice.

  Does this break the loop? No. It looks like progress because we introduced a second entity, but the epistemic dependence hasn't shifted. In a valid check, the verifier must be independent of the thing being verified. Here, B's accuracy is derived from A. Using B to confirm A is functionally identical to using A to confirm A, just with a delay. It extends the chain of dependence rather than breaking it. You've added a link (A -> B -> A), but the chain still dangles from the initial assumption that A was trustworthy enough to calibrate B in the first place.

  This leads directly to the easy knowledge objection. The worry with easy knowledge is that we can generate justification for a source's reliability too cheaply, without any independent evidence. In the first-order case (A checking A), I gain knowledge of A's reliability just by using A. In this second-order case, I gain knowledge of A's reliability by using B. But since B's status as a reliable checker was gifted by A, I haven't paid any extra epistemic cost. I haven't gone out and found a third, independent source C. I've just bounced the check off a wall that A painted itself.

  Therefore, the easy knowledge worry applies at the second order exactly as it did at the first. The structure allows me to conclude A is reliable based on outputs that only count as data if A is already reliable. It creates a closed system where reliability is assumed, not proven. If bootstrapping is invalid because it allows knowledge to pull itself up by its own bootstraps, adding a second boot (Instrument B) doesn't help you stand up if both boots are on the same foot.

  Ultimately, this nested calibration fails to provide non-circular justification. It masks the circularity by adding steps, but the logical structure remains viciously circular. To solve the bootstrapping problem, you need independent validation, not just recursive validation. Until Instrument B is calibrated by something other than A, or A is checked by something other than B, the loop remains unbroken, and the knowledge gained remains "easy" in the problematic sense—it's not grounded, it's just echoed.

  ***

  **Marking Scheme (30 Marks Total)**

  **A Grade (25–30 Marks)**
  *   **Core Insight:** Clearly identifies that B's calibration depends on A's prior reliability, meaning B cannot independently verify A.
  *   **Loop Analysis:** Explicitly states that the scenario extends the chain of dependence rather than breaking the circle.
  *   **Easy Knowledge:** Correctly argues that the objection applies at the second order because no new independent evidence is introduced.
  *   **Clarity:** Reasoning is tight; distinguishes between *independence* and *recursive checking*.

  **B Grade (18–24 Marks)**
  *   **Core Insight:** Identifies that there is circularity involved.
  *   **Loop Analysis:** Describes the loop but misses the specific nuance of the *nesting*. Might argue that adding B adds *some* value but fails to see it presupposes A's reliability entirely.
  *   **Easy Knowledge:** Mentions easy knowledge but treats it as a general vibe rather than applying it to the second-order check specifically.
  *   **Clarity:** Good explanation but lacks the precise "presupposition" argument found in A-grade work.

  **C Grade (15–17 Marks)**
  *   Describes the scenario accurately but fails to connect it to bootstrapping.
  *   Argues that two instruments are better than one without addressing the calibration dependency.
  *   Vague on why the knowledge is "easy" or problematic.

  **Specific Deductions & Mistakes**
  *   **-5 Marks:** Claiming that adding more loops or instruments eventually solves the problem (infinite regress error).
  *   **-5 Marks:** Confusing bootstrapping with the roommate's confirmation bias (bootstrapping is about justification structure, not just cherry-picking data).
  *   **-3 Marks:** Suggesting that because B is a different physical object, it counts as independent evidence (misses the epistemic dependence).
  *   **-2 Marks:** Including a bibliography or citations (against instructions).

  **General Notes**
  *   Don't penalize minor typos (I'm on my phone too, I get it).
  *   Reward students who spot that B is essentially a "mirror" held up by A.
  *   If they argue it *does* work, they need a very strong reason why calibration isn't dependence (unlikely to succeed, but grade on reasoning quality).
