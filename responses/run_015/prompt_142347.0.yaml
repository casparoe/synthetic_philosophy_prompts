  **Speech Draft**

  Good evening.

  My wife tells me I have become insufferable. She says four years of philosophy seminars have ruined me for decent conversation. She may be right. But when the Head of Department asks you to speak, you do not say no. Especially not when he is folding your old life into a new Institute.

  Look around this room. It is a tense family gathering.

  On my left, the chemists. You want the mechanism. You want the atoms. You suspect the word "emergence" is a hiding place for sloppy thinking. On my right, the systems people. You think the atoms are a distraction. You think the pattern is the thing. And at the top table, the Pro-Vice-Chancellor. He put the word "emergent" in the grant title. He needs it to be real.

  And then there are the grandchildren. And the spouses. They need to know what we are actually talking about.

  So I will talk about one thing. Allostery.

  You know the stuff. I spent thirty-five years on it. A protein assembly. It has parts. You touch one part, far away from the active site, and the machine switches on. Like a light switch across the room.

  We know the structures. We have the pictures. We know how the subunits move. We know the chemistry. So, can we predict the switch from the atoms alone?

  In principle, yes. The physics is closed. The atoms obey the rules.

  In practice, no.

  To calculate the function from the atoms, you need precision we cannot measure. You need computing time longer than the cell lives. You need a model you cannot rebuild for every new protein.

  This brings me to my distinction. I have two boxes.

  Box one: *Bookkeeping Emergence*. This is a shortcut. The higher-level description is just a filing system. It says nothing new about the world. It is just convenient for us. Like saying "traffic jam" instead of listing every car's position.

  Box two: *Obstruction Emergence*. The derivation from below exists. It is not magic. But it is blocked. It is blocked by time. It is blocked by noise. It is blocked by the sheer cost of calculation. The wall is not in the physics. The wall is in us.

  Where does allostery fit?

  It fits in Box Two. Obstruction.

  The functional description hasn't gone away. It hasn't collapsed into the chemistry. Not because nature is magical. But because the derivation is useless to creatures like us.

  Now, I must be straight. Where is the cut? Is it in nature? Or is it in us?

  It is in us.

  I admit this freely. It costs me something. It costs me the claim that biology is fundamentally different from physics. It costs me the romantic idea that life has a special spark. The physicists in the back are smiling. They win.

  But the chemists do not win entirely. Because admitting the cut is in us does not make reductionism useful. It makes it impossible.

  If the wall is in us, then shouting "find the mechanism" is not just hard. It is a category error. You cannot climb a wall that is made of your own limitations.

  So what is this Institute for?

  It is not for proving that life is magic. It is not for pretending that atoms do not matter.

  It is for mapping the wall.

  It is for finding the descriptions that work at the level of the wall. Not because they are ontologically superior. But because they are the only ones that fit in a human mind. And the only ones that fit in a grant cycle.

  We need the chemistry. We need the structure. But we must stop pretending that knowing the bricks tells you the shape of the house. Not because the house is more than the bricks. But because counting the bricks takes too long.

  So. I raise my glass.

  To the Pro-Vice-Chancellor, for the word in the title.
  To the chemists, for the truth of the atoms.
  And to the systems people.

  I toast the obstruction.
  I toast the things we cannot calculate, but must understand.
  I toast the wall we cannot climb, but must map.

  To the Institute.

  ***

  **Note on the Distinction**

  You asked where this is weakest. Here is the vulnerability.

  Your distinction between *Bookkeeping* and *Obstruction* relies on a boundary of "usefulness" or "availability to creatures like us". This is inherently slippery. What is impossible for us today (computing the protein fold from atoms in real-time) may be possible in fifty years. If the barrier is merely technological or cognitive, then *Obstruction* is just temporary *Bookkeeping*.

  By admitting the cut is in *us* (epistemic) rather than in *nature* (ontological), you concede physical closure. You satisfy the chemists, but you risk deflating the systems people. If emergence is just a limitation of human processing power, it loses its philosophical bite. It becomes a statement about our ignorance, not about complexity.

  Furthermore, you risk conflating "computationally expensive" with "conceptually distinct". Just because a derivation is hard doesn't mean the higher-level vocabulary isn't just a shortcut. You need to be sure that "Obstruction" isn't just "Bookkeeping" with a higher price tag.

  Finally, speaking this way concedes that there is no "strong emergence" in nature. If the PVC was hoping for ontological novelty—that new laws actually appear at higher levels—you have quietly told him he didn't get what he paid for. You have bought honesty at the price of mystery. Ensure that is a trade you are willing to make publicly.
