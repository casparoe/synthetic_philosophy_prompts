prompt: |-
  I've ended up defending a version of Kant's universal-law test that most people I know think died out a while ago, and I want to know what would actually kill it.

  The version I hold: the test is not "what would happen if everyone did that". It's a test on a maxim under universalization, with two failure modes — a maxim you can't even *conceive* as a universal law without the law cancelling itself (the borrowing case: a promise no one believes in isn't a promise), and a maxim you can conceive but can't *will* as a universal law, because a will that willed it couldn't still will what any finite rational agent necessarily wills. The second branch is supposed to be non-consequentialist: you aren't totalling up the misery of universal non-beneficence, you're asking whether the will is at war with itself. And on that reading the obvious objections just miss — the "what if everyone did that" parodies, all the partial-compliance stuff, the cases where 99% compliance is lovely and 100% collapses the practice. Wrong question, wrong currency.

  So: what would count against it? Not the greatest-hits objections I can already recite. I want the defeaters ranked from fatal to merely awkward, and I want the ones a defender of the test would *concede* as counting against it, not only the ones its critics repeat. Which intuitions or cases does the view stand or fall with? Does it have predictions its rivals don't — for instance, that no amount of bad consequences can by itself sink a maxim, or that the duty/not-duty line should land somewhere other than where a welfarist would put it?

  The thing I actually mabye lose sleep over, which I don't think is in the standard lists. Call them wobblers: maxims whose content refers to how other people are behaving, so that universalizing them produces not a contradiction but a law with no fixed point. "I'll take the quieter of the two roads home, whichever turns out to be quieter." "I'll free-ride on a cooperative scheme as long as nearly everyone else is contributing." "I'll believe whatever the local consensus denies." Universalize the second one and it seems to flicker: at full compliance the condition fails, so nobody free-rides, so the condition is met again. There's no stable state the law describes, but there isn't an outright contradiction either, and neither of Kant's two branches obviously has a slot for it. Is that a genuinely new failure mode, does it collapse into one of the known ones, or does it just show that such things aren't maxims at all (no universal form, no real end)? Which of those replies is more plausible and what does each one cost elsewhere? And be honest with me if this is only the old problem about how maxims get individuated wearing a hat.

  Related: I want to know whether the view has been qualified into unfalsifiability. Whenever the test seems to misfire, the move available is "that wasn't really the maxim" or "that's a consequence, not a contradiction". Say whether the version I hold is insulated in that way, and whether insulation is fine for a claim of this kind — it isn't an empirical prediction, after all — or whether it means I'm holding something with no content.

  What would move me most, personally: a case where the test gets the intuitively right answer but only by smuggling in a forecast of consequences. If every workable application of the will-branch secretly reasons that way, then what I'm defending is consequentialism with extra machinery, and I'd want to know. Can the conception/will distinction hold that line, or does it leak?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Request:**
      *   **User Profile:** Philosophically sophisticated, likely an academic or advanced student in ethics. They are defending a specific, nuanced interpretation of Kant's Categorical Imperative (CI), specifically the Formula of Universal Law (FUL). They are aware of standard objections ("what if everyone did that," partial compliance, etc.) and dismiss them as misinterpretations.
      *   **Core Position:** The user defends the "contradiction in conception" (CC) vs. "contradiction in will" (CW) distinction. They emphasize the non-consequentialist nature of CW (will at war with itself, not totaling misery).
      *   **The Ask:** They want *fatal* or *awkward* defeaters that a defender would actually concede, not strawmen. They want to know if the view is unfalsifiable/insulated. They are particularly worried about "wobbler" maxims (conditional on others' behavior) and whether the CW branch secretly relies on consequentialist reasoning.
      *   **Tone:** Rigorous, honest, peer-to-peer, avoiding introductory fluff.

  2.  **Deconstruct the User's Version of Kant:**
      *   It's the "Korsgaard/Baron/O'Neill" style reconstruction (rational agency, internal consistency of the will) rather than the crude utilitarian parody.
      *   Key claim: CW is about the *conditions of rational agency*, not outcomes.
      *   Key worry: Is it empty? Is it secretly consequentialist? Do "wobbler" maxims break it?

  3.  **Brainstorming Defeaters (Ranking from Fatal to Awkward):**

      *   *Fatal 1: The Emptiness/Indeterminacy Charge (Maxim Individuation).* If any action can be justified by tweaking the maxim, the test is vacuous. The user acknowledges this ("wearing a hat"), but it needs to be pressed hard. If the test relies on *how* we describe the maxim to get the right result, is the test doing the work, or is our prior moral intuition?
      *   *Fatal 2: The Consequentialist Leak in CW.* The user's specific anxiety. If CW says "I can't will a world where no one helps me," is that because it contradicts rational agency *structurally*, or because I'd suffer? If it's suffering, it's hypothetical imperative territory. If it's structural, does it cover enough ground?
      *   *Fatal 3: The "Wobbler" / Game Theory Problem.* The user's specific example (free-riding if others do). This looks like a coordination problem. Kantian logic is binary (contradiction or not). Game theory is equilibrium-based. If the maxim creates an unstable equilibrium, does CI condemn it? If not, CI fails on free-riding. If yes, how, without consequences?
      *   *Awkward 1: Conflicts of Duty.* Kant says duties don't conflict. Real life says they do. If the test generates two perfect duties that clash, the system stalls.
      *   *Awkward 2: The "Bad World" Problem.* Some maxims pass universalization but create a world no one wants (e.g., universal asceticism), yet aren't strictly forbidden. This limits the CI's scope.

  4.  **Addressing the "Wobbler" Maxims:**
      *   *The Problem:* "I will X if others Y." Universalized: "Everyone will X if others Y."
      *   *Analysis:* This creates a logical loop or an unstable equilibrium.
      *   *Kantian Response Options:*
          1.  *Not a Maxim:* Maxims must be unconditional principles of volition. Conditional maxims based on empirical contingencies (what others do) might fail the "law-like" form requirement immediately.
          2.  *Contradiction in Conception:* If everyone acts on "free ride if others contribute," no one contributes, so the condition "if others contribute" is never met. The maxim destroys the condition of its own application. (This is strong).
          3.  *Contradiction in Will:* A rational agent cannot will a system of cooperation they intend to undermine.
      *   *Cost:* If we say "not a maxim," we restrict agency too much. If we say "CC," we rely on empirical predictions about stability.

  5.  **Addressing the "Consequentialist Leak":**
      *   *The Charge:* CW often sounds like "If no one helped, *I would suffer*."
      *   *The Defense:* It's not about suffering; it's about the *end of rational agency*. I necessarily will my own happiness/agency as a finite being. A world where help is impossible makes the pursuit of ends impossible.
      *   *The Leak:* To get from "help is impossible" to "impermissible," you need the premise "Finite rational agents necessarily will the means to their ends." Is that analytic? Or is it a disguised claim about well-being?
      *   *Verdict:* It leaks if "necessary ends of rational agency" is just a placeholder for "things people like." It holds if "rational agency" has a thick, substantive structure (Korsgaard's view).

  6.  **Addressing Unfalsifiability/Insulation:**
      *   *The Charge:* "That wasn't the *real* maxim."
      *   *Analysis:* This is the "rigidity vs. flexibility" tension. To be action-guiding, maxims need specificity. To be universal, they need generality.
      *   *Concession:* Yes, there is a risk of ad hocery. The constraint must be on *how* maxims are formulated (subjective principle + objective context). If the defender can always retreat to "you formulated the maxim wrong," the test is heuristic, not constitutive.
      *   *Is this fatal?* Not if admitted. It makes CI a test of *deliberative integrity* rather than an algorithm.

  7.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the sophistication of the position. Validate that standard objections miss the mark.
      *   **Section 1: The Fatal Defeaters.**
          *   The "Consequentialist Leak" (User's specific worry).
          *   The "Wobbler" / Game Theory challenge.
          *   The Emptiness Charge (Maxim Individuation).
      *   **Section 2: The "Wobbler" Deep Dive.** Analyze the specific cases provided. Offer the Kantian solutions and their costs.
      *   **Section 3: Unfalsifiability & Insulation.** Discuss the "That's not the maxim" defense. Distinguish between algorithmic and deliberative readings.
      *   **Section 4: Predictions & Distinctiveness.** Where does this view land differently than utilitarianism? (Permissions vs. Obligations, Integrity).
      *   **Conclusion:** Summary of the view's viability.

  8.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* Make sure not to treat the user like a novice. Use terms like "teleological structure of the will," "free-rider problem," "reflective endorsement."
      *   *Focus:* The user asked "What would actually kill it?" Be direct.
      *   *Specific Point:* The "Wobbler" case is essentially the "Threshold Problem." If 99% cooperate, is free-riding okay? Kant says no. Why? Because the *principle* undermines the practice, even if the *act* doesn't causally destroy it. This is the "fairness" vs. "utility" distinction.
      *   *Consequentialist Leak:* Be honest. Many neo-Kantians (Korsgaard) admit CW relies on a theory of the good (human interests). If the user denies *any* appeal to interests, CW becomes empty. If they allow interests, they border on rule-consequentialism. This is the tightrope.

  9.  **Final Polish:** Check tone. Ensure it answers the specific questions about ranking defeaters and the "wobbler" mechanics. (The resulting output matches the detailed response provided previously.)
answer: |-
  This is a sophisticated position. You are defending what is often called the "rational agency" or "practical contradiction" interpretation (associated with Onora O'Neill, Christine Korsgaard, and Barbara Herman), which rightly dismisses the "crowded world" parodies. You are treating the Categorical Imperative (CI) as a test of the *internal coherence of volition*, not a calculator of aggregate outcomes.

  If you hold this version, the standard undergraduate objections (e.g., "what if everyone were a doctor?") are indeed category errors. However, that does not make the view immune. It merely shifts the battlefield from empirical plausibility to structural coherence and meta-ethical commitment.

  Here is the ranking of defeaters from fatal to awkward, followed by an analysis of your "wobbler" cases and the unfalsifiability charge.

  ### I. The Defeaters (Ranked)

  #### 1. Fatal: The Consequentialist Leak in Contradiction in Will (CW)
  This is the worry you mentioned losing sleep over, and it is the most dangerous internal threat.
  *   **The Charge:** In the CC test (perfect duties), the contradiction is logical or teleological (the practice vanishes). In the CW test (imperfect duties, e.g., beneficence), the contradiction is supposed to be that a rational agent cannot *will* a world where no one helps anyone. But why not?
  *   **The Leak:** If the answer is "Because I might need help and would suffer," you have smuggled in a hypothetical imperative based on self-interest/welfare. You are effectively saying, "Universal non-beneficence is irrational because it leads to bad outcomes for the agent." That is rule-consequentialism.
  *   **The Kantian Defense:** The defense is that finite rational agents necessarily will the *means* to their ends, and since we are finite, we inevitably require the assistance of others to pursue our ends. To will a world where assistance is impossible is to will the frustration of one's own agency.
  *   **Why it might be fatal:** To make this stick, you need a robust, non-empirical theory of "necessary ends of rational agency." If "agency" is thin (just consistency), the CW test yields no results. If "agency" is thick (includes happiness, development, etc.), critics will argue you have simply built a theory of the good into the definition of rationality. If every application of CW secretly relies on a forecast that "a world without X makes agency impossible," and that impossibility is cashed out in terms of welfare interests, you are defending consequentialism with extra steps.
  *   **Concession:** A defender must concede that CW *does* rely on a substantive account of human interests, but insist these are *structural* prerequisites of agency, not contingent desires. If you cannot distinguish "I need help to survive" (structural) from "I need help to be happy" (contingent), the view collapses into rule-utilitarianism.

  #### 2. Fatal: The "Wobbler" / Game Theory Problem
  Your specific anxiety about maxims conditional on others' behavior is a version of the Assurance Problem or Threshold Problem.
  *   **The Case:** "I will free-ride if enough others contribute."
  *   **The Problem:** Universalized, this creates an unstable equilibrium. If everyone adopts it, contributions drop, the condition "enough others contribute" fails, so no one free-rides, so contributions rise... It flickers. It is not a logical contradiction (CC), and it's not clear it's a contradiction in will (CW) if the system stabilizes at a sub-optimal but functional level.
  *   **Why it might be fatal:** Kantian ethics is binary (permissible/impermissible). Game theoretic situations are often about degrees of compliance and stability. If the CI cannot condemn the free-rider *principle* without relying on the *consequence* that the scheme collapses, it fails to be non-consequentialist. If it condemns it simply because the *principle* treats others as mere means (even if the scheme holds), it needs a robust Formula of Humanity backup. Relying solely on Universal Law here is shaky.
  *   **Concession:** You must concede that FUL (Formula of Universal Law) is insufficient here without FH (Formula of Humanity). If FUL alone is supposed to do the work, "wobblers" break it.

  #### 3. Awkward: Maxim Individuation (The "Empty Form" Charge)
  *   **The Charge:** For any action, there is a description under which it universalizes and one under which it doesn't. "I will lie" fails. "I will lie to save a life" might pass. "I will lie to save a life when the murderer is at the door" passes.
  *   **The Problem:** If the moral work is done by *how we describe the maxim* rather than the test itself, the test is heuristic, not constitutive. It confirms our prior intuitions rather than generating them.
  *   **Why it's only awkward:** A sophisticated defender (like Herman) accepts this. The CI is a test of *deliberative priority*, not a moral calculator. It filters out maxims based on non-moral reasons. It doesn't generate duties from scratch; it validates the moral worth of proposed actions.
  *   **Concession:** You must concede the test is not an algorithm. It cannot tell you *what* to do in a vacuum; it only tells you if your *reason* for acting is valid. This limits its scope as a standalone normative theory.

  #### 4. Awkward: Conflicts of Duty
  *   **The Charge:** Kant claims duties don't conflict. Real life suggests they do (e.g., truth-telling vs. protecting innocence).
  *   **The Problem:** If the CI generates two perfect duties that clash in a specific situation, the system stalls. "Do not lie" and "Protect the innocent" both seem to pass CC/CW.
  *   **Concession:** You must concede that Kantianism requires a hierarchy of duties or a theory of "wide" vs. "narrow" obligation to resolve conflicts. If you insist duties never conflict, you lose touch with moral phenomenology. If you admit they do, you need a meta-rule outside the CI to resolve them.

  ---

  ### II. The "Wobbler" Deep Dive

  You asked specifically about maxims like: *"I'll free-ride on a cooperative scheme as long as nearly everyone else is contributing."*

  **Option A: It collapses into Contradiction in Conception (CC).**
  *   *Argument:* If everyone adopts this maxim, the condition "nearly everyone else is contributing" becomes empirically impossible to sustain. The maxim destroys the empirical conditions of its own success.
  *   *Cost:* This relies on an empirical prediction (that the scheme *will* collapse). A clever free-rider might argue, "I know my individual contribution won't tip the scale, so the condition holds." To defeat this, you must argue that the *principle* undermines the *trust* required for the scheme, even if the material contribution is negligible. This moves away from pure logic toward social psychology.

  **Option B: It is a Contradiction in Will (CW).**
  *   *Argument:* A rational agent wills the existence of cooperative schemes (as means to ends). One cannot rationally will a principle that treats the scheme as a mere resource to be exploited, because that principle, if universal, makes the scheme unstable.
  *   *Cost:* Again, this leans on the instability (consequence). To avoid this, you must argue that the *attitude* of the free-rider is incompatible with being a co-legislator in a Kingdom of Ends. This requires shifting from FUL to FKE (Kingdom of Ends).

  **Option C: They aren't Maxims.**
  *   *Argument:* A maxim must be a principle of *volition*, not a reaction function. "I will do X if others do Y" is a strategy, not a moral law. It lacks the requisite universality in its *form*, even before the test is applied.
  *   *Cost:* This is the most plausible Kantian move but restricts agency. Much of human deliberation *is* conditional on others. If we ban conditional maxims, we make the CI irrelevant to much of political and social life.

  **Verdict:** The most plausible reply is **Option A**, but you must bite the bullet that "empirical impossibility" counts as "inconceivability" in the CC test. The cost is that the line between CC and CW blurs.

  ---

  ### III. Unfalsifiability and Insulation

  You asked: *Is the view insulated by the move "that wasn't really the maxim"?*

  **Yes, it is insulated, but that is not necessarily fatal.**
  If you treat the CI as an empirical prediction (like physics), this insulation is cheating. But if you treat it as a claim about the *structure of practical reason*, the "maxim formulation" is part of the data, not the experiment.

  *   **The Risk:** If *every* counter-example is met with "you formulated the maxim too narrowly/broadly," the theory has no content.
  *   **The Defense:** The constraint on maxim formulation is not arbitrary. Maxims must reflect the agent's *actual reason for acting*. You cannot retroactively tweak the maxim to pass the test if that wasn't your ground of action.
  *   **The Concession:** You must concede that the CI is not a **decision procedure** for the morally perplexed. It is a **criterion of justification** for the morally committed. It cannot tell a villain why they are wrong (they will just formulate a wicked maxim that passes); it can only tell an agent seeking to be rational whether their proposed action coheres with their own agency.
  *   **Is this fatal?** Only if you claimed Kantianism was a complete moral algorithm. If you claim it is an account of moral *obligation's source*, the insulation is a feature, not a bug. It shows morality is internal to the agent's own rationality.

  ---

  ### IV. Distinctive Predictions (Where you differ from Welfarists)

  To prove your view isn't just consequentialism in disguise, it must yield different verdicts. Here is where your version stands or falls:

  1.  **The "Bad World" Permission:**
      *   *Prediction:* There are maxims that universalize perfectly but create a miserable world, which Kantianism must permit.
      *   *Example:* Universal asceticism. Everyone refuses to develop their talents or help others, but simply exists stoically. No contradiction in conception (agency is possible), no contradiction in will (if one wills the end of quiescence).
      *   *Contrast:* A welfarist must condemn this. If your Kantianism condemns it, you are smuggling in welfare. If it permits it, you have a bullet to bite (but a distinctively Kantian one).

  2.  **The Integrity Constraint:**
      *   *Prediction:* An action can produce the best consequences but be forbidden because the *maxim* treats the agent's own rationality as a tool.
      *   *Example:* Self-sacrifice that violates perfect duty (e.g., lying to save the world).
      *   *Contrast:* Welfarism demands the lie. Your view forbids it. This is the classic hardline Kantian spot. If you soften this (e.g., "lying is okay if the stakes are high enough"), you have conceded to consequentialism.

  3.  **The "No Trade-Offs" Rule:**
      *   *Prediction:* You cannot aggregate minor violations of duty to prevent a major violation.
      *   *Example:* You cannot kill one innocent person to save five, even if the "universal law of killing innocents to save lives" could be conceived. (Actually, CC usually blocks this easily).
      *   *Better Example:* You cannot break a trivial promise to prevent a slightly larger inconvenience to another, if the *principle* is "break promises for convenience."
      *   *Contrast:* Welfarism aggregates. Kantianism does not.

  ### Summary: What would move you?

  You asked what would count against it.

  1.  **If you find that CW *requires* appealing to contingent desires** (e.g., "I want to be happy") rather than necessary conditions of agency, the non-consequentialist claim fails.
  2.  **If "Wobbler" cases cannot be condemned without empirical predictions** about system collapse, the *a priori* claim fails.
  3.  **If you cannot explain why a specific maxim formulation is the "correct" one** without appealing to the moral verdict you want to reach, the test is vacuous.

  **Honest Assessment:**
  The version you hold is the most defensible version of Kant. It survives the "what if everyone did that" parodies. However, it survives only by retreating from being a **generative moral theory** (telling you what is right) to a **constraint on deliberation** (telling you what you can consistently will).

  The "wobbler" cases are the weakest link. They suggest that Universal Law is insufficient without a substantive theory of **Fairness** or **Reciprocity** that Kant doesn't fully articulate in the *Groundwork*. If you can't solve the free-rider "wobbler" without saying "because it leads to bad outcomes," you have lost the non-consequentialist high ground. If you solve it by saying "because it violates the status of co-legislator," you have implicitly switched to the Formula of Humanity.

  **Final Verdict:** Your view stands if you accept that FUL is incomplete without FH and that CW relies on a thick, non-hedonic theory of human interests. It falls if you insist FUL is a standalone algorithm that generates specific duties without auxiliary premises about the nature of rational agency.
