      *   *Counterfactuals:* Often imply A is false or hypothetical. In screening, A (having the disease) is unknown. Indicatives are usually better for risk communication.
      *   *Conclusion:* The slogan does *not* support the colleague's claim that wording is irrelevant. The slogan is about ideal rational credence, not cognitive processing of natural language under stress.

