  4.  **Addressing the Practical Question (Does wording matter?):**
      *   The colleague argued: "P(If A then B) = P(B|A), so wording doesn't matter, and base rate neglect is a separate psychological problem."
      *   *Critique:* Even if Adams' Thesis holds for *credence*, it doesn't mean patients *actually* calculate P(B|A) correctly. Patients often confuse P(B|A) (sensitivity) with P(A|B) (positive predictive value).
