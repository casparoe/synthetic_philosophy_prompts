  Hey — please answer as a professional philosopher of language, the kind who actually teaches this stuff to grad students, and please think it through properly: brainstorm two or three candidate principles before you settle, and then commit to one. I don't want a balanced survey with "it depends" at the end. I want you to pick, give your reasons, tell me which of my verdicts I have to give up, and flag the clause you'd defend least confidently. My philosophy club did Putnam's Twin Earth thing a few weeks ago — the planet that's just like ours except the lakes and rain are full of some other chemical (XYZ), and Oscar and Twin Oscar are identical molecule for molecule but mean different things by "water" — and my teacher loved it and I basically bought it, but then me and my friend Marisol started making up our own cases after class and my gut answers don't line up, and I can't tell whether that means I'm confused or the theory is. Here's where I land: Twin Earth, yeah, different meanings, fine. My little cousin calls every clear drink in a clear glass "water" — juice, sprite, whatever — and I want to say he means water and is just wrong, not that "water" means "clear liquid" in his mouth. A whole colony on Mars that's been drinking XYZ out of the tap for three generations and calls it water: I want to say their word really does mean XYZ, not that the entire colony is making one giant mistake. Some guy who's never seen or touched water, only read about it as "the clear drinkable stuff in rivers": I still want to say his word means H2O. Someone shipwrecked alone on an island who decides to call these weird blue shells he keeps finding "blibble," and it turns out later they aren't shells at all but some kind of egg casing: I want to say "blibble" meant the egg casings, even though there was nobody else around to correct him and he was totally wrong about what he was looking at. A word everyone used for a substance that turns out never to have existed at all: I want to say it meant nothing. And the one I go back and forth on — heavy water, where you swap the hydrogen for its heavier relative: is that water or not? My gut says "sort of but not really," which I know is a garbage answer.

  My own attempt at a principle, which Marisol says is circular but I don't see it: a word for a natural kind means whatever the real hidden structure is of the sample the word got attached to, and the people who decide *which* sample that is are the community or the experts, never the individual speaker — so the speaker's private beliefs and mix-ups never matter, but actual contact with the stuff does. Is there one principle that gets all of these, or nearly all? Where does mine break, can it be repaired, or do I need a definitly different one? Whatever you land on, state it precisely, tell me which case motivates each clause, and tell me what it predicts for a case I haven't listed — I was thinking of a kid who grows up in a full-immersion VR world where the only "water" she's ever encountered is simulated, and she uses the word totally normally with the other kids in there.
