          *   Explain the "Cost": It requires believing people make systematic errors in applying a neutral concept.
      *   **The Secondary Target: Premise (3) & (4).**
          *   Challenge the idea that circularity is fatal.
          *   Challenge the idea that law requires pure factual neutrality (thick concepts).
          *   Explain the "Cost": It changes how we view the law (less mechanical, more evaluative).
      *   **Synthesis/Recommendation:** Which is the "best" rejection? Usually (2).
      *   **Conclusion:** Reassure the user. The legal system has safeguards (jury instructions, appeals) that mitigate these cognitive biases even if the concept is fuzzy.

  7.  **Refining the Argument (Self-Correction during drafting):**
