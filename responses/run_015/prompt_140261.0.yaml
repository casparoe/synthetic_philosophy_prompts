      *   *Dementia man (striking nurse):* Objective attitude, Resentment unfitting (Exemption).
      *   *Six-year-old (playground):* Not full participant, correct/train (Exemption/Partial exemption).
      *   *Manic episode (kitchen wreck):* Objective attitude (Exemption).
      *   *Casually cruel woman (bad upbringing):* Resentment fits (Full participant). Upbringing explains but doesn't exempt.
      *   *Depressed friend (let down):* Excuse (not exemption). Demand qualified, still addressable.

      *   *Pattern:*
          *   Exemptions (Objective Stance): Lack of capacity (dementia, childhood, psychosis/manic episode).
          *   Excuses (Qualified Participant Stance): Coercion, severe depression (temporary impairment of will/context).
          *   Full Responsibility (Participant Stance): Malice, negligence, bad upbringing (capacity intact).

