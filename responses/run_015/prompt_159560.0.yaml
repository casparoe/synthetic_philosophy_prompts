answer: |-
  Here is your Q&A prep, tailored to the specific factions in the room.

  ### The Objections (Ordered by Likelihood × Damage)

  **1. The Resource-Rational Attack (The "Distribution" Objection)**
  *Who:* The cognitive science/computational rationality pair.
  *The Vibe:* Polite but technically predatory. They will pounce on your use of worst-case complexity.
  *The Question:* "You're leaning on NP-hardness, which is a worst-case bound over a problem class. But resource-rationality is about adapting to the *actual* distribution of instances encountered. Even if the benefit system is combinatorially explosive in theory, the *actual* cases citizens face might be tractable. If the average case is easy, why is the worst-case hardness a normative failure? Aren't you demanding robustness against scenarios that never happen?"

  *   **The 90-Second Answer:**
      "That's the right technical distinction, but it misses the institutional risk. In a well-designed system, the 'average case' is stable because the institution keeps it that way. In the systems I'm describing—benefits, tax, scheduling—the distribution isn't natural; it's volatile. A small change in policy or a slight shift in your life circumstances can jump you from the easy manifold to the hard tail instantly.
      My claim isn't that every instance must be solvable in polynomial time. It's that when an institution designs a system where the *variance* in complexity is high, they are offloading risk onto the agent. If the 'average case' relies on the agent never making a specific combination of choices, the institution has made the agent's rationality fragile. We shouldn't demand agents be robust against institutional volatility; we should demand institutions be robust against agent variance."
  *   **Where It's Soft:** You haven't actually defined the threshold for "too much variance." If they press you on where the line is between acceptable risk and imposed hardness, you're guessing.

  **2. The Political/Legal Attack (The "Emergence" Objection)**
  *Who:* The political philosophers and legal theorists.
  *The Vibe:* Suspicious of technocracy. They smell a structural argument but worry you're reducing power to math.
  *The Question:* "You talk about 'imposed hardness' as if there's a designer. But structural injustice is often emergent. No single person designed the tax code's complexity; it's the result of decades of lobbying, patching, and compromise. If there's no specific agent who *chose* the hardness to constrain you, who is responsible? Doesn't your framing collapse when the 'scissors' are held by a ghost?"

  *   **The 90-Second Answer:**
      "I agree that 'the designer' is often a fiction. But 'no single designer' is not the same as 'no design.' When complexity accumulates through lobbying and patching, it's because there were veto points where simplification was rejected.
      My argument doesn't require a single villain. It requires a locus of maintenance. If an institution benefits from the complexity—say, because it reduces claim rates—and they have the capacity to refactor the system but don't, they inherit responsibility for the hardness. We treat legal negligence this way: you don't need to intend the harm, you just need to have a duty of care and fail to mitigate a known risk. Computational intractability is a known risk. Ignoring it because 'it just grew this way' is the negligence."
  *   **Where It's Soft:** This leans heavily on a "duty of care" analogy that legal theorists might reject if the "harm" is just cognitive load rather than material loss. You're importing a tort framework without fully defending it.

  **3. The Bayesian Attack (The "Ideal Theory" Objection)**
  *Who:* The two formal epistemologists.
  *The Vibe:* Dismissive of empirical constraints as normative grounds.
  *The Question:* "Normative theory tells us what reasons agents *should* respond to, not what they *can* compute. If the optimal decision is X, but the agent can't compute X, they are still rationally required to aim at X, even if they fail. By making the norm depend on the computational structure of the environment, aren't you just collapsing rationality into psychology? Why should the 'ought' bend to the 'can'?"

  *   **The 90-Second Answer:**
      "I'm not bending the 'ought' to the 'can.' I'm challenging the idea that the 'ought' is fixed independently of the environment. If I tell you 'you ought to maximize utility,' but I've built a maze where the path to utility is computationally opaque, I haven't given you a norm; I've given you a riddle.
      The Bayesian ideal assumes the problem is *given*. I'm saying the problem formulation is part of the social contract. If the environment makes the ideal inaccessible not by physical impossibility but by structural obscurity, the norm itself becomes suspect. We shouldn't preserve an ideal theory that requires agents to solve intractable problems just to be considered rational. That's not ideal theory; it's a category error."
  *   **Where It's Soft:** You are risking a stalemate over the definition of "normativity." They will insist norms are timeless; you insist they are contextual. You might talk past each other.

  **4. The Emeritus Attack (The "Ought Implies Can" Trap)**
  *Who:* The philosopher of action.
  *The Vibe:* Avuncular but unyielding.
  *The Question:* "You say hardness is imposed. But if a problem is truly NP-hard, then for large N, it *cannot* be solved. If it cannot be solved, then 'ought implies can' says there is no obligation to solve it. So, either the problem isn't actually hard, or your demand is illegitimate. Which is it?"

  *   **The 90-Second Answer:**
      "It's the latter, but with a twist. The obligation isn't on the *agent* to solve the hard problem. The obligation is on the *institution* to ensure the problem presented is solvable.
      'Ought implies can' still holds. The agent *can* navigate a simple system. The institution *can* build a simple system. When the system is hard, someone has violated a 'can.' My point is that we usually locate that violation in the agent ('you failed to optimize'). I'm saying we locate it in the architect ('you failed to simplify'). The 'ought' remains valid; we just reassign the subject who bears it."
  *   **Where It's Soft:** If they argue that institutions don't have agency in the same way individuals do, you lose the subject of the obligation.

  ---

  ### Pre-emptive Concessions (First 5 Minutes)

  *Do this in your intro or setup to disarm the room.*

  1.  **Concede the Name:** "I'm calling this 'imposed hardness.' I know that sounds like I'm positing a villain for every complex problem. I'm using it as a placeholder for 'endogenous complexity that creates asymmetric cognitive load.' If you have a better term, I want it."
      *   *Why:* Disarms the Political group (who hate technocratic labeling) and the Emeritus (who hates imprecise action verbs).
  2.  **Concede the Distribution Point:** "I am aware that worst-case complexity is not average-case difficulty. I am not arguing that every NP-hard instance is unjust. I am arguing that systems *designed* without regard for their complexity class are negligent."
      *   *Why:* Takes the wind out of the Resource-Rational sails. They can't accuse you of ignorance if you admit it upfront.
  3.  **Concede the Scope:** "This isn't a full theory of justice. It's a claim about a specific mechanism of control. I'm not saying complexity is the only injustice, just that it's an overlooked one."
      *   *Why:* Prevents the Political philosophers from demanding you solve structural inequality.

  ---

  ### Hard Lines (Refuse to Concede)

  *Even under pressure, do not yield on these.*

  1.  **The Environment is Not Nature:** Do not let anyone treat the computational landscape as a natural fact. If a form is hard to fill out, it is not "like the weather." It is a designed artifact. If you concede this, the Bayesians win (ideal theory applies to nature) and the Political group loses (no structure to critique).
  2.  **Hardness is a Policy Choice:** Do not accept that simplification is always "too costly." Sometimes simplification is expensive for the *institution* but cheap for the *aggregate*. Refuse the trade-off unless they show the institutional cost is prohibitive, not just inconvenient.
  3.  **Responsibility Does Not Require Intent:** Do not let the "Emergence" objection off the hook. Negligence is sufficient for responsibility. If you concede that unintentional hardness is blameless, the argument dies.

  ---

  ### The Killer Question

  *You guessed:* "What does complexity add over 'too many options'?" or "How to falsify?"
  *My assessment:* Those are survivable.
  *   "Too many options" is cardinality; complexity is structural. You can have 2 options that are NP-hard to distinguish. You can have 1,000 options that are linear to sort. You can answer this easily.
  *   "Falsify" is standard philosophy of science boilerplate. You can punt to "predictive success in identifying unjust structures."

  *The Real Killer:*
  **"If the agent participates in creating the complexity, is it still imposed?"**

  *Why this kills you:*
  It unites the Bayesians (agency), the Resource-Rationalists (endogeneity), and the Political group (complicity).
  *   *Scenario:* A community lobbies for specific, nuanced benefits rules to ensure fairness, inadvertently creating a combinatorial mess.
  *   *The Trap:* If you say "Yes, it's still imposed," you look paternalistic (ignoring the community's choice). If you say "No, it's not imposed," you lose the normative bite (the hardness is still there, blocking access).
  *   *Why your guesses were safer:* They attack your *method*. This attacks your *moral core*.

  *How to prep for it:*
  You need to distinguish between *participation* and *capacity*. "Participating in a process doesn't mean you have the capacity to foresee the computational consequences. If I vote for a law, I don't thereby consent to its bugs. The responsibility lies with those who had the technical capacity to model the complexity before implementation."
