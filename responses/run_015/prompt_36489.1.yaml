answer: |-
  The restaurant was too loud, the kind of place where the clatter of silverware drowned out the quiet admissions people came here to make. Elena pushed a piece of gnocchi around her plate. Across from her, Arthur hadn't touched his risotto. He was looking at her like she was a manuscript he'd agreed to edit but found unsalvageable.

  Arthur had spent thirty years with Margaret Vance. He knew the color of her stationary, the brand of her cigarettes, the exact year her hearing went. Elena had spent three months with the archive and six weeks with the draft. Yet tomorrow, Elena's version of Margaret would be seen by more people than Arthur had reached in three decades.

  "The deathbed scene," Arthur said. He didn't raise his voice. He didn't have to. "Page ninety-four."

  "It tested well," Elena said. "The focus group cried."

  "Margaret died alone in a hospice in Vermont. There was no nurse. There was no daughter. There was no audience."

  "There needed to be closure, Arthur. The second act was all friction. You can't end on static." Elena took a sip of wine. It was the producer's money funding the dinner, a per diem allowance that felt like hush money. "I didn't invent the sentiment. I collaged it. The line about the mirror? That's from a letter to her sister in '52. The bit about forgiveness? That's from a *Paris Review* interview in '65. I just moved them forward in the timeline."

  "You moved them to the only moment she couldn't refute them."

  "It's better dialogue," Elena said, and immediately hated herself for the honesty of it. In life, Margaret had been sharp, often cruel. In the script, she was weary. Elena had taken a woman who died hard and made her die soft. She had swapped a word in the second paragraph. Margaret had written *hate* in the original letter. Elena had typed *fear*. It played better on screen. It made the audience feel like they understood her. It was a theft of texture, smoothing the grain until it was featureless.

  "Rick says we're clear," Elena added, invoking the producer. "You can't libel the dead. Legally, she's public domain. Her voice is free material."

  "Rick is a producer," Arthur said. "He deals in assets. I dealt in a person."

  "She's an asset now. That's how people keep her alive."

  "They keep *you* alive. They keep *themselves* alive." Arthur finally picked up his fork, but only to turn the risotto over, searching for something underneath. "She spent her adult life fighting to control how she was seen. She burned her diaries from the forties. She sued the *Times* in the sixties. She curated every photograph. And now strangers have taken her last words away from her. You gave her a speech she never gave."

  "I gave her a legacy."

  "You gave her a eulogy she didn't ask for." Arthur looked up. His eyes were tired, not angry. That was worse. Anger implied a stake in the future. This was the look of someone cataloging a loss. "You know she wasn't forgiving, Elena. She didn't regret the things you made her regret. You're fixing the record because you can't stand the mess."

  "Someone has to make it make sense."

  "No," Arthur said. "Someone has to let it be nonsense."

  The waiter arrived with the check, sensing the tension like a change in barometric pressure. He set the black leather folder on the table between them. It sat there, a dark rectangle dividing the space.

  Elena reached for it instinctively. It was the habit of the hired hand, the person who signs the receipt and expenses the meal. "I've got it."

  Arthur's hand came down on the folder before hers could touch the leather. His hand was spotted, older, heavier. He didn't grab it; he just covered it. A claim of ownership.

  "Rick's card," Elena said. "It's on the production account."

  "I'm buying the meal," Arthur said.

  "It's not about the money."

  "It is exactly about the money," Arthur said. "You are paid to change her. I am paying to remember her."

  He opened his wallet. He didn't look at the total. He pulled out a stack of bills, crisp and folded, and placed them on top of the folder. He didn't wait for the change. He didn't wait for the receipt. He stood up, leaving the napkin on the table, perfectly unfolded, white against the dark wood. He walked out into the noise of the street without looking back.

  Elena sat there. The waiter hovered, waiting to see if he should take the money or return it, unsure if the transaction was complete. The risotto was cooling, a skin forming on the surface. Elena looked at the money, then at the empty chair, then at her own reflection in the dark glass of the wine bottle. She reached for her pen to sign the receipt, but the waiter had already taken the folder, leaving her hand hovering over the empty space where the bill had been.

  Summary: The story suggests we owe the dead the integrity of their silence rather than the comfort of our fiction.
