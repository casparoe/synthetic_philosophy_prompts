answer: |-
  **Research Question**
  Does the normative asymmetry between lying and misleading depend essentially on the mechanics of assertion, or does it persist when deception is achieved through the artefactual manipulation of evidence?

  **Project Overview and Philosophical Context**
  The prevailing literature on the ethics of deception focuses almost exclusively on linguistic vehicles: explicit false assertions versus literally true statements that implicate falsehoods. Standard defenses of the view that lying is distinctively worse than misleading rely on the norm of assertion; the liar warrants the truth of their claim and invites specific reliance, whereas the misleader exploits conversational implicature while maintaining deniability. Conversely, proponents of the view that misleading is worse argue that it exploits cooperative norms while evading accountability, leaving the victim with false beliefs and no recourse.

  Both positions assume a speech-act framework. This project identifies a critical gap: neither account adequately addresses non-linguistic, artefactual deception. Cases such as cropping photographs, selectively deleting digital messages, or staging physical environments induce false beliefs without assertion, implicature, or sometimes any communication at all. In these instances, the "warrant" account loses its footing because there is no speech act to warrant. Simultaneously, the "deniability" account conflates the *wrongness* of the act with the *blameworthiness* of the agent; while artefactual deception offers high deniability, it is not immediately clear that this makes it morally superior or inferior to lying. By shifting the focus to artefactual vehicles, this thesis tests whether the lying/misleading distinction is a robust moral boundary or merely a linguistic artifact.

  **Methodology and Work Plan**
  The primary method will be conceptual analysis structured around a taxonomy of deception-vehicles. Rather than relying on unsystematic intuition-pumping, which has stalled current debates, or empirical surveying of folk intuitions, which addresses descriptive psychology rather than normative force, this project will construct controlled case pairs. Each pair will match a linguistic deception (lie or misleading statement) with an artefactual equivalent that produces identical epistemic outcomes and harms, isolating the vehicle of deception as the sole variable.

  The nine-month schedule is structured as follows:
  *   **Months 1–3:** Literature review and taxonomy construction. I will categorize artefactual deception into distinct types (e.g., omission, staging, alteration) to determine if some map onto lying while others map onto misleading. This phase will also establish the criteria for separating moral wrongness from agent-criticisability.
  *   **Months 4–6:** Argument development. I will test the standard "commitment" and "deniability" arguments against the taxonomy. If the commitment argument fails to condemn artefactual lies, I will investigate whether a non-linguistic account of commitment (e.g., evidential warrant) can salvage it.
  *   **Months 7–9:** Drafting and refinement. The final thesis will articulate whether the distinction survives this stress test.

  This taxonomy-based approach is superior to the rival method of aggregating intuitive verdicts because it forces precision regarding *why* a case feels distinct. It avoids the is/ought fallacy of empirical methods by focusing on the justificatory structures available to the agent rather than public perception.

  **Expected Deliverables and Conclusions**
  The final 12,000-word thesis will demonstrate one of three conclusions. First, it may show that the distinction collapses entirely in non-linguistic contexts, suggesting that the moral weight of lying was never about truth-warranting but about intent to deceive. Second, it may show that artefactual deception constitutes a third category with distinct normative features, requiring a new framework beyond the lying/misleading binary. Third, it may demonstrate that the distinction persists but must be grounded in the manipulation of evidence rather than speech acts. The deciding factor between these outcomes will be the consistency of moral verdicts across the case pairs when harm and intent are held constant.

  **Conditions for Project Failure**
  This project rests on the premise that artefactual deception creates friction for existing theories. The project will be deemed unviable if, by the end of Month 3, the taxonomy reveals that artefactual deception maps neatly onto existing categories of misleading without generating novel normative conflicts. If staging a scene is morally identical to implying a falsehood in all relevant respects, the thesis loses its contribution to the literature. I will use the initial taxonomy construction as a proof of concept; if no conceptual tension emerges there, I will pivot to a broader analysis of evidential ethics.

  **Scope and Limitations**
  Given the 12,000-word limit and teaching load, the scope must be strictly constrained. I will not attempt a general theory of deception or a historical overview of lying. The focus remains exclusively on the *distinction* between lying and misleading as it behaves under non-linguistic conditions. I will exclude cases of paternalistic deception and white lies, focusing solely on self-interested or malicious deception to control for variable motives. Furthermore, I will not engage with legal definitions of fraud, as the normative standards therein differ from moral philosophy. The goal is not to solve the ethics of deception broadly, but to determine whether the specific conceptual tool of the lying/misleading distinction survives contact with the non-linguistic world.
