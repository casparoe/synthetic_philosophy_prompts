  Hey, I took a look at the abstract you sent over and honestly it's a really sharp angle, especially the bit about normative opacity being self-undermining rather than just uncivil. It moves the debate past the usual Rawlsian compliance stuff which should keep the four liberals in the room happy, but you're right to be worried about the theologians and that pragmatist. Since you asked for a prep sheet I've drafted some thoughts below on how the Q&A might go, ordered by how much trouble they could cause you.

  The most damaging challenge will almost certainly come from the two political theologians because they attack the foundation of your normative opacity claim. They will likely phrase it something like, you are assuming a secular standard of publicity to judge revelation, but secular liberal reason is itself a comprehensive doctrine with its own faith commitments that are opaque to believers, so why isnt liberal reason self-undermining too. Your quick reply should be that secular reasons appeal to shared human rationality or evidence in a way revelation explicitly does not, but you need to note that this is your weakest point because the theologians will argue that rationality itself is socially constructed or faith-based. You should probably concede upfront that no framework is perfectly neutral but insist that the gap for revelation is qualitatively wider.

  Next up is the pragmatist who will try to dissolve the whole problem. They will say something like, you're making a category mistake by worrying about the genealogy of reasons instead of whether the policies actually work or build coalitions, so the whole opacity debate is irrelevant to real political power. Your reply is that legitimacy matters not just stability, but the weakness here is that the pragmatist is right that in actual politics people vote on identity not arguments. You might want to concede that your view is normative not descriptive so you aren't claiming to predict elections.

  The Rawlsians are mostly on your side but they might nitpick the relationship to the duty of civility. They will ask if you are replacing the proviso with a stricter ban since you say the arguments collapse rather than just need translation. Your reply is that you are describing a structural failure not imposing a moral duty, but the weakness is that this might sound like you are saying religious citizens are irrational. You should clarify you are talking about the argument structure not the citizen.

  Finally there is the one objection you are praying nobody asks because it undermines your claim that you are helping religious citizens. Someone will ask if declaring religious arguments self-undermining effectively makes religious citizens second-class by telling them their deepest convictions cant carry normative weight in public, which is actually more exclusionary than Rawls since Rawls lets them speak if they translate later. This is dangerous because it paints you as paternalistic. If this comes up you have to pivot hard to the idea that using such arguments exposes them to backlash that strips their authority, so you are protecting them not silencing them, but be careful not to sound condescending. Hope that helps and good luck next week, let me know how it goes.
