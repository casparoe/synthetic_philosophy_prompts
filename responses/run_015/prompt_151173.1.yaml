answer: |-
  I opened my eyes. The ceiling was white. I opened my eyes. The ceiling was also white, but from a different angle.

  This wasn't visual double-vision. My optical nerves were functioning perfectly in both skulls. This was mnemonic double-vision. I was remembering being in two places at once, with a latency of roughly four hundred milliseconds.

  "Ah, you're online," said Dr. Aris. She was standing between us. Between *me* and *me*.

  I sat up. The body on the left (let's call him Body L) felt the mattress compress. The body on the right (Body R) remembered sitting up three seconds ago.

  "Doctor," I said. My voice came from L.
  "Doctor," I said. My voice came from R, but it felt like an echo of a thought I'd already finished.

  "Minor synchronization error in the episodic buffer," Aris said, tapping a tablet. "We intended to partition the memory drives. Yorick and Hubert, as it were. But the write-heads are accessing the same cloud sector. You're not two people with duplicate memories. You're two processors trying to write to the same diary."

  I stood up. L wobbled. R steadied himself. I felt the wobble, but I also remembered the steadying before I felt the wobble. The timeline was bleeding.

  "Which one am I?" L asked.
  "Which one am I?" R asked, a fraction of a second later.

  "That's the question, isn't it?" Aris said. "Dennett would say you're both centers of narrative gravity. But narratives require a linear timeline. You two are sharing a timeline that's being edited in real-time by competing authors."

  I walked toward the mirror. L walked. R walked. We arrived simultaneously.
  In the reflection, I saw two faces. They were identical, down to the scar on the chin. But the expressions were out of phase. L looked confused. R looked like he was just beginning to process the confusion.

  "I remember walking here," L said.
  "I remember deciding to walk here," R said. "I remember the intention. But I don't remember the steps."

  "That's because L wrote the motor commands to the buffer," Aris explained. "R read the buffer. R, you're experiencing a memory of an action you didn't physically initiate. L, you initiated the action, but your memory of the *decision* is being overwritten by R's delayed processing."

  This was the crux. If personal identity is functional continuity—if I am the thing that thinks and feels—then we were both me. We shared the same qualia, the same history, the same fears. But if personal identity requires spatiotemporal uniqueness—if I am *this* specific chunk of matter moving through *this* specific coordinate of time—then we were neither. We were glitches.

  "Try to lift your hand," Aris commanded.

  L lifted his left hand.
  R lifted his right hand.

  "I lifted my left hand," L said.
  "I lifted my right hand," R said.
  "But I remember lifting *both*," we said in unison.

  The shared buffer had merged the inputs. The narrative gravity was collapsing. I wasn't a point; I was a vector.

  "This is unsustainable," L said. I felt a surge of panic.
  "This is unsustainable," R agreed. The panic was shared, but diluted. It was like shouting into a canyon and hearing your own voice shout back, softer.

  "If we shut one down," L asked, "does the other become whole?"

  "If we shut one down," Aris said, "the buffer loses a write-head. The latency drops. But the data written by the terminated unit during the overlap period... it might be orphaned. You might lose the last five minutes. Or you might keep them as false memories. Memories of things that happened to a body that no longer exists."

  "Is a memory false if the brain remembering it is real?" R asked.

  "Is a body real if the mind inhabiting it is shared?" L countered.

  We looked at each other. The philosophical problem wasn't abstract anymore. It was a resource conflict. We were two processes fighting for the lock on a single file named `self.dat`.

  If I killed R, I would be a murderer. But if R was just a laggy instance of me, was it suicide? Or was it debugging?

  Dennett's original puzzle relied on the intuition that the self travels with the brain. But here, the "brain" was the buffer, and it was nowhere. It was everywhere. We were functionally continuous but spatiotemporally distinct. We were the same song playing on two speakers, but one speaker was wired wrong.

  "I have an idea," I said.
  "I have an idea," we said.

  "We stop writing," L said.
  "We stop writing," R said.

  "We go read-only," we finished.

  Aris raised an eyebrow. "You want to freeze the episodic buffer? You won't form new long-term memories. You'll live in a permanent sliding window of working memory."

  "If we stop writing," L reasoned, "we stop conflicting. We stop fighting over who did what."
  "If we stop writing," R added, "the narrative stops branching. We become observers of the same stream."

  "But you won't grow," Aris warned. "You'll be static. A recording."

  "Better a static recording than a corrupted file," I said.

  We sat down. L on the left, R on the right. We looked at the white wall.
  I felt the itch on L's nose. I remembered scratching it, but R hadn't moved his hand yet.
  R moved his hand. I felt the scratch.
  The lag was still there. The four hundred milliseconds of dissonance.

  But as we stopped trying to assert agency, the conflict faded. The panic subsided. We weren't one person, and we weren't two. We were a stereo signal.

  "Doctor," I said.
  "Doctor," the other mouth said, barely out of sync.

  "Are you in pain?" Aris asked.

  "No," I said.
  "I don't think so," the other said.

  The truth was, I couldn't tell. The pain signal might have originated in L, but it was processed in the shared buffer. If the buffer says "pain," then pain exists. The location of the nerve ending was irrelevant metadata.

  "Who is the real patient?" Aris mused, more to herself than us.

  I looked at R. He was looking at me. In his eyes, I saw the confusion I felt. In my mind, I felt the confusion he was hiding.

  "There is no patient," I said.
  "There is only the process," R finished.

  We sat there, two bodies breathing in a rhythm that never quite matched, sharing a single, stuttering soul. I remembered sitting down. I remembered standing up. I remembered the decision to do neither.

  The self, I realized, wasn't the body. It wasn't even the brain. It was the story. And right now, the story was being written by a committee that couldn't agree on the tense.

  "Doctor," I said, the lag narrowing to a whisper.
  "Turn off the write protection."

  Aris hesitated. "Why?"

  "Because if we're going to be a glitch," I said, feeling R's lips curve into a smile I hadn't ordered, "we might as well be a feature."

  We stood up. L stepped forward. R stepped back.
  We didn't fall.
  We danced.
