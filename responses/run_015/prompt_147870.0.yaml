  She will not treat this like the **Zombie case** (conceivable but blocked by a posteriori necessity) because the barrier here isn't a hidden link between physics and mind; it's an internal contradiction within the *content* of the experience itself. She will not treat it like the **Hypercube case** (structurally conceivable) because that ruling was reserved for *abstract* mathematical objects, not *concrete* phenomenal qualities.

  ### 2. The Closest Analog: The Red/Green Cube
  This is the strongest precedent. In the Red/Green case, she ruled that certain exclusions are **constitutive of the concepts themselves**. You cannot have a cube that is "red and green all over" not because of a hidden physical essence (like Water/H2O), but because "red" and "green" are defined by their mutual exclusion in visual space.

  Similarly, "feeling hot" and "feeling not-hot" in the *same respect* are contradictories within the phenomenal concept of temperature-qualia. By invoking "paraconsistent logic," the proposal attempts to treat phenomenal content like a formal variable (Hypercube), but your tutor's Red/Green ruling suggests she views phenomenal content as semantically rigid. To her, "paraconsistent phenomenology" is likely a category error—like "paraconsistent color"—which collapses into nonsense rather than opening a possibility.

  ### 3. The Underlying Principle: The Abstract/Concrete Distinction in Conception
  If her precedents seem to pull in different directions (Hypercube = Structural Conception OK vs. Red/Green = Conceptual Exclusion), the principle resolving the tension is:

  **Structural conception validates possibility for *Abstracta*, but not for *Concrete Qualia*.**

  *   **Hypercube:** An abstract mathematical object. Its possibility is secured by formal consistency, even if psychological visualization fails.
  *   **Red/Green Cube & Inverted Phenomenal State:** Concrete, experiential properties. Their possibility is constrained by the *semantic content* of the experience, not just formal logic.

  She is adopting a form of **Phenomenal Conceptualism**: The logic of experience is not a variable framework we can swap out (like non-Euclidean geometry); it is constitutive of what it means to *have* an experience. A "contradictory experience" is not a new kind of experience; it is the absence of coherence required for experience itself.

  ### 4. The Splitter Case: "The Phenomenal Möbius Strip"
  To test whether she truly holds the **Abstract/Concrete** principle or if she allows **Structural Conception** to override Phenomenal Concepts, ask her this:

  > **"Can we conceive of a visual experience of a surface that is determinately convex and concave in the same respect, modeled on a non-Euclidean topology?"**

  *   **Why this splits the rules:**
      *   **If she says Impossible:** She is consistent with the **Red/Green** ruling. Convexity and concavity are conceptually exclusive in *phenomenal space*, regardless of mathematical topology. Phenomenal concepts trump structural logic.
      *   **If she says Possible:** She is consistent with the **Hypercube** ruling. She accepts that structural conception (topology) can validate concrete phenomenal possibilities that violate standard intuition. This would undermine her Red/Green verdict and suggest the "Inverted Phenomenal State" might also be possible if framed structurally.

  This case forces her to choose whether the "structure" of experience is flexible (like math) or fixed (like color concepts).
