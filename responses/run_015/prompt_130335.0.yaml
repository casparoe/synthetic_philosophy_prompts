      *   **Core Tension:** Chesterton's Fence (presumption of purpose/design) vs. Evolutionary Spandrels (Gould & Lewontin; byproducts without specific adaptive function).
      *   **Task 1:** Create a correspondence table mapping the Fence analogy to the Spandrel concept (Builder vs. Drift, Fence vs. Institution, etc.).
      *   **Task 2:** Identify where the mapping breaks.
      *   **Task 3:** Evaluate whether the conservative conclusion survives if the "fence" is a spandrel (unintended byproduct).
      *   **Task 4:** Address whether Chesterton/Burke smuggled in an intentional designer.
      *   **Tone:** Intellectual, analytical, nuanced, suitable for a feature writer.

  2.  **Deconstruct the Concepts:**
