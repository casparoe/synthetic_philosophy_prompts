      *   **Evolutionary Spandrel:** From Gould & Lewontin's "The Spandrels of San Marco" (1979). Architectural spandrels are necessary byproducts of mounting a dome on arches. They weren't *designed* to be painted (though they often are); they just exist because of the structure. In biology/sociology: Traits or institutions that exist as side-effects of other adaptations, not selected for directly.
      *   **Conservative Philosophy (Burkean):** Emphasis on prescription, prejudice (in the sense of pre-judgment), and the wisdom of inherited structures. Not necessarily reliant on divine design, but on *functional* endurance.

  3.  **Drafting the Correspondence Table:**
      *   *Need to contrast the Intentionalist view (Fence) with the Structuralist/Evolutionary view (Spandrel).*
      *   **Column 1: Feature.**
