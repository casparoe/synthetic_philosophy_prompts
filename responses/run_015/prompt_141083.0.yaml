      *   *Refining the "Step 4" explanation:*
          The user says: "If (3), then for any J there is a respect in which J holds."
          My counter: (3) says valid judgments must be qualified. It does not say all judgments *can* be qualified into truth. A lie remains a lie even if qualified ("In some respect, I didn't shoot him" is still false if I did).
          Wait, strictly speaking, Jain logic says *syāt asti* (in some respect it is), *syāt nāsti* (in some respect it is not). But this applies to *existential* claims about complex substances. It doesn't validate contradictions about specific events like "I pulled the trigger" vs "I did not". If I pulled the trigger, the claim "I did not" is false in the substantive sense relevant to the court.
          Actually, the stronger point is the distinction between *naya* (partial truth) and error. The user's (2) says "every judgment is made from a standpoint... and is true of the aspect". This is too strong. Some standpoints are distorted.
