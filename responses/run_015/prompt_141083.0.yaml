      *   *Step 3: Address the Dilemma (Concessive vs. Structural).*
          There is a third way: *Pragmatic/Contextual*. Respects are neither purely subjective nor wholly independent. They arise from the interaction between the knower's capacity and the object's affordances. Like a key in a lock.

      *   *Step 4: Address the Fiction Question.*
          Fiction is not assertion. It simulates assertion. Therefore, *syādvāda* applies to the *characters'* claims within the diegesis, not the novelist's claim about the world. The novelist knows the truth (or the lack thereof); the characters are bound by *naya*. The court scene works because the judge operates within a legal *naya* (proof beyond reasonable doubt), which is distinct from the metaphysical *naya*.

