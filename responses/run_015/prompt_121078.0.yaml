answer: |-
  You've spotted the sleight of hand: the lawyer answered a legal question, but the room accepted an ethical answer. Here are the six claims hidden in "the dead can't sue," broken down for your call.

  **1. The Standing Claim** ("No court will give him a remedy")
  *   **True?** Yes. A corpse lacks legal standing.
  *   **Source:** Pure law.
  *   **Meeting Utility:** **High.** This is the only claim that legally justifies proceeding. It protects the publisher from a lawsuit filed *by the composer*.

  **2. The Defamation Claim** ("You cannot libel the dead")
  *   **True?** Yes, in almost all U.S. jurisdictions. Defamation claims die with the subject.
  *   **Source:** Pure law.
  *   **Meeting Utility:** **High.** This is the lawyer's actual shield. It means no estate lawsuit for damage to his reputation.

  **3. The Moral Harm Claim** ("He can't be wronged/harmed because he has no interests")
  *   **True?** Debatable/False. Philosophically contested. Most people believe reputations survive death.
  *   **Source:** Ethics/Philosophy, not law.
  *   **Meeting Utility:** **None.** This is the dangerous assumption. It treats legal immunity as moral absolution.

  **4. The Living Kin Claim** ("Nobody's around to object")
  *   **True?** False. The sister is alive.
  *   **Source:** Empirical fact.
  *   **Meeting Utility:** **Critical.** While she can't sue for *his* defamation, she could potentially sue for *her* privacy or Intentional Infliction of Emotional Distress if the scene targets her. This is why your agent is nervous.

  **5. The Reader Claim** ("Readers won't believe it's fact")
  *   **True?** False. Readers frequently conflate historical fiction with biography.
  *   **Source:** Empirical/Psychological.
  *   **Meeting Utility:** **Low.** Ignoring this risks reviews, backlash, and reputational damage for you and the publisher, even without a lawsuit.

  **6. The Consent Claim** ("He chose fame, so he chose this")
  *   **True?** False. Public status reduces privacy rights but doesn't grant blanket consent for fictionalized abuse.
  *   **Source:** Ethical assumption.
  *   **Meeting Utility:** **Low.** A weak defense if the family goes to the press.

  **The Bottom Line:**
  The lawyer was right about **1 and 2** (legal safety). Your agent is worried about **4 and 5** (reputational and familial risk). The meeting concluded based on legal safety, but the ethical risks remain unaddressed. You need to decide if the scene is worth the potential fallout from the living sister and the historical record.
