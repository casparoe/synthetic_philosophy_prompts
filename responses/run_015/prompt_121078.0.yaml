      *Refining Claim 4:* In the US, living relatives generally cannot sue for defamation of a deceased relative. However, they *can* sue for invasion of privacy or intentional infliction of emotional distress if the work is extreme enough regarding *them*. The scene targets the sister indirectly (she is the victim in the scene). This is the agent's worry.

