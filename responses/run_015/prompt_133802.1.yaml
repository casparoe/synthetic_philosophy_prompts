      *Progress:* Progress requires abandoning the search for a universal impact measure and instead formalizing the **oversight horizon** and **reversibility constraints** specific to your deployment context.

      *Impact Budget:* It is a dodge unless the exchange rate is explicitly derived from human preferences, in which case it is just utility maximization with a weird budget constraint.

