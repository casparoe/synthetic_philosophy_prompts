  ### Part 1: The Logical Grid

  Before administering the worksheet, locate the theoretical landscape. We cross two axes: the **Relation Axis** (how *Experience* relates to *Availability*) and the **Level Axis** (what kind of *Availability* counts).

  | | **Personal-Level Availability** (Report, Reason, Voluntary Action) | **Subpersonal Availability** (Motor, Modules, Implicit Systems) | **Structural Availability** (Integration, Causal Power) |
  | :--- | :--- | :--- | :--- |
  | **Identity** (Experience = Availability) | **Workspace-Identity**, **No-Overflow**, **Higher-Order** | **First-Order Representationalist** | **Integration/Causal** |
  | **Overflow** (Experience > Availability) | **Phenomenal Overflow** | *(Empty: Incoherent)* | *(Empty: Unmotivated)* |
  | **Underflow** (Availability > Experience) | *(Empty: Unattractive)* | *(Empty: Unattractive)* | *(Empty: Unmotivated)* |
  | **Confused** (Distinction Fails) | **Illusionist/Eliminativist** | **Illusionist/Eliminativist** | **Illusionist/Eliminativist** |

  **Cell Diagnostics:**
  *   **Identity / Personal:** The dominant cluster. Disagreements here are about *which* personal-level mechanism (broadcast, meta-thought, or judgment) constitutes experience.
  *   **Identity / Subpersonal:** First-Order Representationalism. Commits you to the view that a system can be conscious without knowing it is conscious.
  *   **Identity / Structural:** Integration views (e.g., IIT). Commits you to the view that a system can be conscious without any capacity for behavior or report.
  *   **Overflow / Personal:** Phenomenal Overflow. Commits you to the view that science cannot fully measure consciousness because the richest parts vanish before report.
  *   **Confused:** Illusionism. Commits you to the view that our intuitive concept of "experience" is a cognitive error.
  *   **Empty Cells:**
      *   *Overflow / Subpersonal:* Incoherent. If experience exceeds subpersonal availability, it affects nothing, not even the brain's own modules.
      *   *Underflow (All):* Generally unattractive. Implies "Zombie Access"—systems that use information perfectly but lack the experience that usually accompanies it, without a clear reason why.
      *   *Partial Overlap:* Unmotivated. No major theory argues experience partially overlaps availability without a principled reason for the mismatch.

  ***

  ### Part 2: The Diagnostic Decision Tree

  **Instructions:** Answer each question based on your intuition about the case described. Do not worry about which theory you are "supposed" to support. Follow the arrows to your leaf position.

  **Q1. The Blindsight Case (Type 1)**
  A patient guesses the location of a light correctly 100% of the time but insists, "I saw nothing; I was just guessing." Is the word "saw" completely confused here, or is there a real difference between their guessing and their seeing?
  *   **The word is confused/no real difference:** Go to **Leaf 1**.
  *   **There is a real difference:** Go to Q2.

  **Q2. The Sperling Case**
  Twelve letters flash for a split second. You can report only four. Regarding the eight you did *not* report: Did they have a specific shape and color for a moment before vanishing, or were they merely a degraded, gist-like blur from the start?
  *   **Specific shape and color (Rich):** Go to **Leaf 2**.
  *   **Degraded blur or nothing (Lost):** Go to Q3.

  **Q3. The Visual Extinction Case**
  A patient denies seeing an object on their left side, yet their hand reaches out and grasps it accurately. Is this accurate reaching a form of "availability" sufficient for experience?
  *   **Yes (Subpersonal access counts):** Go to **Leaf 3**.
  *   **No (Need personal/report access):** Go to Q4.

  **Q4. The Infant/Animal Case**
  A pre-verbal infant or non-human animal attends to a toy but cannot form thoughts about their own thoughts. Do they have a visual experience of the toy?
  *   **No (Need meta-thought/concepts):** Go to **Leaf 4**.
  *   **Yes (Attention is enough):** Go to Q5.

  **Q5. The Engineered System Case**
  A distributed server farm or robot instantiates the exact "bottleneck-and-broadcast" architecture of a human brain, but has no biology. Does it have experiences?
  *   **Yes (Architecture suffices):** Go to Q6.
  *   **No (Needs biology/judgment):** Go to **Leaf 5**.

  **Q6. The Degraded-Array Case (Subject Insistence)**
  In a task where performance exceeds capacity, subjects deny seeing the changed item. Does the subject's own insistence that "I didn't see it" settle the question of whether they experienced it?
  *   **Yes (Subject settles it):** Go to **Leaf 6**.
  *   **No (Data settles it):** Go to Q7.

  **Q7. The No-Report Paradigm Case**
  Brain activity shows high integration and content-specific signals during a task, but the subject makes no overt response. Is this integration itself the experience, even without broadcast to report systems?
  *   **Yes (Integration suffices):** Go to **Leaf 7**.
  *   **No (Broadcast required):** Go to Q8.

  **Q8. The Inattentional Blindness Case**
  A subject focused on counting passes misses a gorilla. Was the gorilla's image lost before it could be used by the mind, or was it present but only in a degraded, gist-like form?
  *   **Lost before use:** Go to **Leaf 5** (Workspace-Identity).
  *   **Present but degraded:** Go to **Leaf 6** (No-Overflow).
      *(Note: This question refines the distinction between Leaf 5 and 6 if Q5/Q6 were ambiguous.)*

  **Q9. The Vivid Dream Case**
  You recall a vivid dream only upon waking. Was the experience real *while you were sleeping*, or was it constructed by memory *when you woke up*?
  *   **Real while sleeping:** Go to **Leaf 5** (Workspace-Identity).
  *   **Constructed on waking:** Go to **Leaf 1** (Illusionist).
      *(Note: This question acts as a final check for Illusionist tendencies vs. Realist Functionalism.)*

  ***

  ### Part 3: The Leaves (Positions)

  **Leaf 1: Illusionist / Eliminativist View**
  *   **Diagnosis:** The distinction between "experience" and "access" is too confused to bear theoretical weight; talk of "phenomenality" is a cognitive error.
  *   **Least Attractive Commitment:** You must tell students that their direct intuition of what it feels like to be them is systematically false.

  **Leaf 2: Phenomenal Overflow View**
  *   **Diagnosis:** Experience is richer than access; the mind experiences more than it can report or use for reasoning.
  *   **Least Attractive Commitment:** You must accept that the most vivid parts of our mental life are scientifically unmeasurable because they vanish before they can be reported.

  **Leaf 3: First-Order Representationalist View**
  *   **Diagnosis:** Experience is identical to subpersonal availability; a state is conscious if it is available to motor or specialized modules, even without report.
  *   **Least Attractive Commitment:** You must accept that a system could be fully conscious (e.g., feel pain) without having any capacity to know or report that it is in pain.

  **Leaf 4: Higher-Order View**
  *   **Diagnosis:** Experience requires a personal-level thought about a mental state; without meta-cognition, there is no consciousness.
  *   **Least Attractive Commitment:** You must classify pre-verbal infants and most non-human animals as philosophical zombies with no inner life.

  **Leaf 5: Workspace-Identity View**
  *   **Diagnosis:** Experience is identical to personal-level availability via global broadcast; if the architecture broadcasts, there is experience.
  *   **Least Attractive Commitment:** You must accept that a non-biological robot with the right wiring feels pain exactly as you do.

  **Leaf 6: No-Overflow Reply (Illusion of Richness)**
  *   **Diagnosis:** Experience equals access, and the feeling that experience is richer than access is itself an illusory judgment.
  *   **Least Attractive Commitment:** You must tell students that the vivid richness of their visual field is a persistent cognitive mistake, not a reality.

  **Leaf 7: Integration / Causal Structure View**
  *   **Diagnosis:** What matters is causal integration and structure, not capacity-limited sharing or report.
  *   **Least Attractive Commitment:** You must accept that a system could be fully conscious even if it is completely paralyzed and unable to interact with the world in any way.

  **Leaf 8: Unoccupied (Access > Experience)**
  *   **Diagnosis:** Empty. This cell implies "Zombie Access"—systems that process and report information perfectly but lack experience without a clear explanatory gap.
  *   **Least Attractive Commitment:** N/A (No theory occupies this).

  ***

  ### Part 4: Indistinguishability Flag

  **Pair:** **Workspace-Identity View (Leaf 5)** and **Higher-Order View (Leaf 4)**.

  **Diagnosis:** The decision tree separates these based on the Infant/Animal case (Q4), but this relies on empirical assumptions about infant meta-cognition that both theories can accommodate by adjusting their definitions of "thought." Functionally, both require a form of personal-level access for experience.

  **Additional Separating Question:**
  "Does the mental state become experienced because it is *available to* other systems (Workspace), or because there is a distinct *representation of* that state (Higher-Order)?"

  **Reason for Exclusion:**
  This question cannot be answered by intuition about a concrete case without already knowing the theoretical vocabulary; it asks for a metaphysical distinction between "availability" and "representation" that manifests identically in most behavioral scenarios.
