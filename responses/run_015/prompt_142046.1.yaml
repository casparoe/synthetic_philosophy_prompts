answer: |-
  # Q&A Prep Sheet: The Sketch Model of Dreaming
  **Talk:** Dreams as Indeterminate Experience  
  **Time:** 40 mins + Q&A  
  **Audience:** Wittgensteinian, Sleep Lab (x2), Clinician, Grad Students (Dennettians)

  ---

  ### The "Must-Land" Reply
  **The Perception Analogy (Motion without Trajectory)**
  *   **Why:** This is the only bridge between the philosophers (who need a concept of indeterminacy) and the scientists (who need a naturalistic precedent). If this analogy fails, you look like you're positing magical mental states.
  *   **The Line:** "In peripheral vision, I see *that* something moved, but there is no fact of the matter *how* it moved until I foveate. The foveation doesn't fabricate the motion, nor does it discover a pre-existing detailed trajectory. It resolves a determinable into a determinate. Dream reporting is the foveation of sleep phenomenology."
  *   **Risk:** If they press that peripheral vision *is* determinate (just low res), you lose. Stand firm on *phenomenal* character, not just resolution.

  ### The "Hope Nobody Asks" Question
  **"If the report partly constitutes the experience, did the experience exist before the report?"**
  *   **Why:** This traps you in a dilemma. If you say **Yes**, the Grad students will say "Then the report is just discovery, and your sketch model is unnecessary." If you say **No**, the Clinician and Sleep Lab will say "Then you're treating a fabrication, and the trauma isn't real."
  *   **Deflection Strategy:** "That assumes a binary of 'fully existent' vs 'non-existent.' I'm proposing a third category: *potentialized phenomenology*. It exists as a constraint on reporting, not as a finished object." (See Objection #5 for the full backup).

  ---

  ### The 8 Objections (Ordered by Damage Potential)

  #### 1. The Dennett/Grad Student Objection: "The In-Principle Indistinguishability"
  *   **The Charge:** "If two reports (English/Japanese) differ but the physiology is identical, and no third-person test can distinguish them, then by Occam's Razor, there is no difference in experience. You're positing invisible ghosts."
  *   **Concede:** "I agree there is no *third-person* test available now, and perhaps ever."
  *   **Reply (2 min):** "Dennett's heterophenomenology treats the subject as a fiction generator. But consider change blindness. We feel we see a detailed world, but experiments show we don't. Is the experience 'fake'? No, the *determinacy* was missing. My claim is that the 'ghost' is the assumption that experience *must* be determinate to be real. I'm removing the ghost of Determinacy, not adding a ghost of Indeterminacy."
  *   **Soft Spot:** Relies entirely on the Perception Analogy holding up.
  *   **Damage:** **High.** Undermines the metaphysical core.

  #### 2. The Wittgensteinian Objection: "The Criteria Problem"
  *   **The Charge:** (Senior Malcolm Loyalist) "You speak of 'experience' as if it's a private object. But 'dream' is a word learned by public criteria (the report). To speak of a 'pre-report experience' is grammatical nonsense. You are bewitched by language."
  *   **Concede:** "I agree that 'dream' as a public concept relies on reporting criteria."
  *   **Reply (2 min):** "I'm not positing a private object accessible only to the sleeper. I'm describing the *logic of the reporting practice itself*. When a patient says 'I'm not sure if it was a dog or a wolf,' we don't say they are lying; we accept the uncertainty. My model explains *why* that uncertainty is grammatically permissible without calling the experience fake. I'm refining the grammar, not breaking it."
  *   **Soft Spot:** Sounds suspiciously like dualism if you aren't careful.
  *   **Damage:** **High.** Threatens the legitimacy of the project in this room.

  #### 3. The Bilingual Case Objection: "The Law of Non-Contradiction"
  *   **The Charge:** "You claim one state is 'English' and 'Japanese' depending on the wake-up. That's a contradiction. A neural state cannot be two mutually exclusive semantic contents simultaneously."
  *   **Concede:** "The *neural state* is not linguistically coded in that way."
  *   **Reply (2 min):** "The dream content isn't stored as sentences. It's semantic potential. Think of an ambiguous figure (Duck/Rabbit). The ink doesn't change, but the aspect does. The sleep state is the ink; the waking language is the aspect. The experience wasn't 'English,' it was 'reportable as English.' Both reports are true to the *potential*, not the *syntax*."
  *   **Soft Spot:** Risks sounding like you're redefining "content" to avoid the problem.
  *   **Damage:** **High.** Kills your central example.

  #### 4. The Sleep Lab Objection: "Where is the Correlate?"
  *   **The Charge:** "If indeterminacy is real, show us the EEG signature. If REM is the same for both reports, your 'sketch' is invisible to science. Why should we care?"
  *   **Concede:** "There is no specific 'indeterminacy wave' in the EEG."
  *   **Reply (2 min):** "I'm not offering a competing physiological hypothesis; I'm offering an interpretation of your data. When you see high variance in dream reports from identical sleep stages, standard theory calls it 'noise' or 'memory error.' I'm suggesting that variance is *signal*. It reveals the open structure of the state. I'm saving the phenomenon you're already seeing."
  *   **Soft Spot:** Makes philosophy look parasitic on their data.
  *   **Damage:** **Medium.** Risks alienating half the room.

  #### 5. The Memory Objection: "It's Just Confabulation"
  *   **The Charge:** (Grad Students & Lab) "This sounds like standard memory reconstruction. You wake up, your brain fills gaps. Why call the sleep state an 'experience' rather than just 'noise'?"
  *   **Concede:** "Memory reconstruction is definitely part of the reporting process."
  *   **Reply (2 min):** "Confabulation implies making something out of nothing. Filling a sketch implies constraints. If I wake you from deep NREM, you report 'nothing.' If I wake you from REM, you report 'something.' The sleep state constrains the report. My point is that the constraint *is* the experience, even if it lacks detail."
  *   **Soft Spot:** Hard to prove the constraint isn't just neural noise patterns.
  *   **Damage:** **Medium.** Collapses your view into standard constructivism.

  #### 6. The Clinician Objection: "The Trauma Validity"
  *   **The Charge:** "If a PTSD patient's nightmare is a 'sketch,' does that mean the trauma narrative is less real? If I treat the dream, am I treating a fabrication?"
  *   **Concede:** "The suffering and affect are fully determinate and real."
  *   **Reply (2 min):** "The *emotion* is the determinate part; the *narrative* is the sketch. In therapy, you often find the narrative shifts while the fear remains. My model validates that. It tells you that changing the report (filling the sketch differently) isn't 'lying,' it's resolving the experience. It might actually help treatment to know the narrative is flexible."
  *   **Soft Spot:** Could be interpreted as minimizing the patient's reality.
  *   **Damage:** **Medium.** Ethical stakes are high here.

  #### 7. The Determinacy Regress: "A Sketch of What?"
  *   **The Charge:** "To be a sketch of a dog, you must have the concept 'dog'. Isn't 'dog' determinate? You haven't escaped determinacy, just pushed it back."
  *   **Concede:** "Some determinables must be present."
  *   **Reply (2 min):** "Exactly. I'm not arguing for total indeterminacy. I'm arguing for *selective* indeterminacy. You can have the determinable 'threat' without the determinate 'man with a gun.' The regress stops at the level of affective tone and basic object permanence, which *are* determinate."
  *   **Soft Spot:** Technical distinction that might bore the room.
  *   **Damage:** **Low.** Philosophical nitpick.

  #### 8. The Individuation Question (The "Hope Nobody Asks")
  *   **The Charge:** "If the report constitutes the experience, how many experiences did the sleeper have? One? Two? None?"
  *   **Concede:** "The count is vague, because the identity conditions are report-relative."
  *   **Reply (2 min):** "We don't ask 'how many conversations' happened if two people interpret a silence differently. Experience isn't a countable object like a marble. It's a process. The 'one' experience is the physiological state; the 'two' experiences are the resolved phenomenological outcomes. Both descriptions are valid at different levels."
  *   **Soft Spot:** Sounds relativist.
  *   **Damage:** **Low/Medium.** Metaphysical trap. **FLAG: Do not answer head-on if possible.** Pivot to the clinical utility of the description instead.

  ---

  ### Strategic Notes for the Room
  *   **For the Wittgensteinian:** Do not use the word "private." Use "first-person authority" or "reporting conditions." Acknowledge that without the report, the dream is scientifically silent, but insist it is not *ontologically* null.
  *   **For the Sleep Lab:** Avoid "phenomenology" when possible; use "subjective data." Frame your theory as a way to explain *variance* in their datasets.
  *   **For the Grad Students:** Acknowledge Dennett's contribution (he killed the "homunculus" view) but argue he swung the pendulum too far toward "fiction." You are offering a middle path.
  *   **For the Clinician:** Emphasize *affect*. The sketch model makes the emotion the most real part of the dream, which aligns with trauma treatment.

  ### Final Check
  *   **Tone:** Humble but confident in the "Sketch" intuition.
  *   **Time Management:** If Q&A runs long, sacrifice the "Bilingual" defense to protect the "Perception Analogy."
  *   **Kill Shot:** If cornered on the "Hope Nobody Asks" question, pivot to: "Does asking 'how many experiences' help us treat the patient or understand the sleep state? If not, it's a metaphysical luxury we can postpone."
