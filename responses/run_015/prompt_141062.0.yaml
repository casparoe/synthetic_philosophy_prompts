answer: |-
  Subject: Re: Higher-Order Theories prep

  Hi there,

  You are hitting exactly the right walls, and honestly, if you weren't hitting them, you probably wouldn't be understanding the theory deeply enough. The objections you are raising are the standard heavy hitters that get discussed in any serious seminar on this topic, so you are in good company. Let me walk through where the theory stands on each of your points and where the possible escape routes are.

  First, let's clear up the regress problem because that is the easiest one to resolve. You asked if the higher-order thought itself has to be conscious, which would indeed launch an infinite regress where you need a thought about the thought about the thought. The standard Higher-Order Theory response is a flat no. The higher-order thought is explicitly defined as an unconscious mental state. It is a mechanism that scans first-order states, and when it targets one, that target state becomes conscious. The scanner itself remains in the dark. This stops the regress immediately because we do not need to be conscious of the higher-order thought for the first-order state to become conscious. We are only conscious of the first-order state in virtue of the higher-order thought being there, not in virtue of being conscious of the higher-order thought itself.

  Now to the trickier issue of misrepresentation, which is where you feel the theory bites a bullet that seems like nonsense. You described a scenario where you stimulate the higher-order circuit without a first-order state, leading the theory to say the subject feels a pain they aren't actually in. You are correct that the classic version of this theory, championed by David Rosenthal, does indeed bite this bullet. They call these cases qualitative illusions. Their argument is that consciousness is purely a matter of how things seem to the subject. If the mechanism says you are in pain, then it seems to you that you are in pain, and therefore you are consciously experiencing pain, even if the nociceptive input is missing. They argue this is actually a feature, not a bug, because it aligns with how we treat hallucinations in other sensory modalities. If you hallucinate a pink elephant, there is no actual elephant, but there is a conscious experience of one. So they accept that you can have conscious pain without the corresponding first-order physical state.

  However, you asked if there is a version that survives this without just biting the bullet. There are attempts to modify the theory to avoid this, though they come with their own costs. Some theorists argue for an actualist constraint, which says a higher-order thought can only make a state conscious if the first-order state actually exists. This avoids the illusion problem but makes it harder to explain hallucinations or errors in introspection consistently. A more sophisticated variation is Self-Representationalism. In this view, the mental state does not need a separate higher-order thought targeting it. Instead, the mental state represents itself. It has a first-order content about the world and a higher-order content about itself all in one complex state. This ties the existence of the experience tighter to the state itself, making it harder to sever the link and create an empty higher-order signal, though clever philosophers can still find ways to drive a wedge there.

  This leads us to your most profound objection, which is the redundancy charge. You suggested that if we require the higher-order thought to be accurate, then the first-order state must already have the qualitative character, making the higher-order thought just extra steps. This is the central metaphysical clash between First-Order and Higher-Order theories. Your intuition here is that pain has its hurtfulness intrinsically. The Higher-Order theorist denies this completely. They argue that a first-order state without a higher-order companion is like a book in a dark room. The book has content, but it is not visible to anyone. The higher-order thought is the light that makes the content visible. To the Higher-Order theorist, a non-conscious pain state is not a pain that you don't feel; it is a purely functional representation of damage that lacks any what-it-is-likeness entirely. So the higher-order thought is not redundant because it is the very thing that generates the phenomenology. Without it, there is no feeling, only unconscious processing. If you find this unconvincing, it usually means you are leaning toward a First-Order Representationalist view, where the representational content of the first-order state is sufficient for consciousness.

  So where does that leave you for the seminar? You are not going wrong in your logic; you are just colliding with the foundational assumptions of the theory. The theory survives by insisting that consciousness is a relational property, not an intrinsic one. If you treat consciousness as something that happens to a state rather than something a state is made of, the redundancy objection loses its force. The misrepresentation objection is usually handled by accepting the illusion possibility or by moving toward a self-representational model that binds the two levels tighter. The regress is handled by keeping the higher-order state unconscious. If you go in expecting to defend the intuition that pain must be intrinsically painful, you will find yourself arguing against Higher-Order Theory, but if you can temporarily adopt the view that consciousness is a form of inner perception, the theory hangs together much better.

  Hope that helps clear the fog a bit before you go in. It is a tough patch of philosophy, but you have clearly got the right map of the terrain.

  Best of luck with the seminar.
