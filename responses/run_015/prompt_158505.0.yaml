          *   Management: Deputy manager had a weekly checklist to check sensitivity, ticked it without looking. Drift was visible in logs.
          *   Outcome: Resident fell, no alert, found hours later.
          *   Metrics: Alert precision improved, workload fell.
          *   Agency: No one overrode, no one chose the specific threshold, no single decision-maker for the harm.
