answer: |-
  Here is a teaching plan designed for a 50-minute session, tailored to your audience and constraints.

  ### 1. The Sequence (Order and Dependencies)

  You are correct: they need to know what a thought experiment (TE) is *for* before you can show them how it breaks. If you start with failure modes, the narrative designers will treat it as a critique of storytelling, and the systems designers will treat it as a critique of logic.

  **The Flow (50 Minutes):**
  1.  **The Hook (5 mins):** Define the TE not as a story, but as a *tool for consensus*. It is a machine designed to produce a specific intuition.
  2.  **The Carried Example (10 mins):** Run the twin scenarios. Vote the room. Reveal the trick.
  3.  **The Dissection (15 mins):** Introduce your "Working Rule" here. Test the example against it.
  4.  **The Taxonomy (10 mins):** Name the failure modes *after* they have identified them intuitively.
  5.  **The Close (10 mins):** Verification exercise + Explicit Exclusions.

  **Dependency Note:** Do not introduce the taxonomy labels until step 4. If you give them the labels upfront, they will try to sort the example into the bins rather than feeling how the argument works. They need to feel the manipulation before they name it.

  ### 2. The One Carried Example

  **The Scenario:** "The Locked Door."
  **Context:** A pre-production design meeting. You are debating whether to lock a specific zone until late-game.
  **Constraint:** Frame this as a *vision pitch*. A/B testing is impossible because the content does not exist yet. This neutralizes the "we'd test it" objection.

  **Version A (The Curiosity Pump):**
  > "Imagine a player reaches this door early. They see hints of the end-game loot inside. They can't open it yet. They feel **curious**. They mark the map and come back later, feeling rewarded for their exploration."
  > *Verdict:* The room will likely agree this is good design.

  **Version B (The Frustration Pump):**
  > "Imagine a player reaches this door early. They see hints of the end-game loot inside. They can't open it yet. They feel **blocked**. They hit an invisible wall and turn away, feeling restricted by the developer."
  > *Verdict:* The room will likely agree this is bad design.

  **The Single Feature Change:** The *attributed emotional state* of the hypothetical player (Curious vs. Blocked).
  **The Mechanism:** The physical setup is identical. The argument relies entirely on the designer asserting a specific psychological reaction as if it were a fact of the setup.

  **Why not the Trolley Problem?**
  You are right to avoid it. Reskinning the Trolley Problem smuggles in trained philosophical responses. Your designers are trained to think about *agency* and *flow*, not utilitarian calculus. A Trolley reskin becomes a debate about "what players actually do" (simulation) rather than "how this hypothetical is framing the choice" (rhetoric). The Locked Door example targets their specific craft vulnerability: assuming we know how the player feels.

  **What it must contain:**
  *   Identical physical mechanics (door, loot, lock).
  *   Identical timing (early game).
  *   **Must lack:** Any justification for *why* the player feels that way. The feeling is stated as a premise.

  ### 3. Misconceptions and Management

  Here is the order they will surface, and where to head them off:

  1.  **"Vivid Detail = Truth" (Worldbuilders)**
      *   *When:* During the Example (Step 2).
      *   *Head off:* When reading Version A and B, keep the wording dry. Do not add flavor text. If someone says, "Well, it depends on the art style," stop them. "For this experiment, the art is identical. The only variable is the claimed feeling."
  2.  **"Impossible Scenarios = Useless" (Systems/Pragmatists)**
      *   *When:* During the Dissection (Step 3).
      *   *Head off:* Acknowledge it. "A TE is not a simulation. It's a stress test. We aren't asking if this *will* happen, we're asking if the logic holds if it *did*."
  3.  **"It's Just Rhetoric" (Cynicism)**
      *   *When:* During Taxonomy (Step 4).
      *   *Head off:* Reframe. "Rhetoric isn't a dirty word. It's how we align vision. We are learning to spot when the rhetoric is doing work the logic should be doing."
  4.  **"Are Intuitions Evidence?" (The MA Writer)**
      *   *When:* Anytime, but likely during the Definition (Step 1).
      *   *Management:* Do not refuse it, but **bracket** it.
      *   *Script:* "That is a valid philosophical question, and you're right to ask it. For the next 45 minutes, we are treating intuitions as *data points*, not truths. We aren't solving epistemology today; we are debugging our design meetings. We can grab beer later and discuss whether intuition exists."

  ### 4. The Taxonomy

  **Your Categories:**
  1.  **Loaded-detail pumps:** Irrelevant color carrying the argument.
  2.  **Smuggled-description pumps:** The contested description is already in the setup. (This is what the "Locked Door" example uses).
  3.  **Contrast-class pumps:** The alternative the reader silently measures against is doing the work.

  **Are they distinct?**
  Yes. Keep all three.
  *   *Smuggled-description* is about what is explicitly stated as fact (e.g., "They feel blocked").
  *   *Contrast-class* is about what is implicitly compared (e.g., "This is like *Dark Souls*" vs. "This is like *Mario*").
  *   *Loaded-detail* is about emotional coloring (e.g., "The *innocent* villager" vs. "The *villager*").

  **When to introduce:**
  Hand them the labels at the **end of Step 4**. Let them struggle to describe what went wrong in the Locked Door example first. They will say, "You assumed we'd feel blocked." Then you say, "Exactly. That's a Smuggled-Description Pump." It gives them a vocabulary for what they just discovered.

  ### 5. The Working Rule

  **Your Rule:** *A pump is safe if you can state its conclusion without the story and it still sounds just as plausible.*

  **Where to introduce:**
  Step 3 (The Dissection). Use it to test the Locked Door example.
  *   *Test:* "Players feel blocked by locked doors, so we shouldn't use them."
  *   *Result:* It sounds weak. It needs the story of the "early game" and the "loot" to work. Therefore, it's a pump.

  **How it will misfire in this room:**
  Your Narrative Designers will push back hard here. They believe the story *creates* the truth.
  *   *The Misfire:* They will argue that removing the story removes the context required for the intuition.
  *   *The Fix:* Clarify the rule. "The *logic* must stand without the story. The *emotion* can stay. If the argument collapses without the specific details of the narrative, the narrative is doing the arguing, not the design."

  ### 6. The Close and Exclusions

  **The Verification Check (5 mins):**
  Do not ask them to summarize. Give them a broken pump and ask them to fix it.
  *   *Prompt:* "Here's a statement: 'If we add microtransactions, players will feel cheated because it breaks the immersion.' Identify the smuggled description."
  *   *Answer:* "Because it breaks the immersion." (That is the contested claim stated as fact).
  *   *Task:* "Rewrite it so the conclusion isn't smuggled." (e.g., "...players *might* feel cheated if the immersion is broken.")
  *   *Success Criteria:* If they can rewrite it to expose the assumption, they have the tool. If they just say "That's biased," they haven't got it.

  **Explicit Exclusions (Say this out loud):**
  To prevent scope creep, state these boundaries at the start or end:
  1.  **"We are not discussing Ethics of Content."** (e.g., Is violence bad?). We are discussing the structure of the argument, not the morality of the subject.
  2.  **"We are not doing Formal Logic."** No syllogisms, no notation. We are debugging natural language.
  3.  **"We are not solving Skepticism."** (Nod to the MA writer). We are not proving knowledge is possible; we are proving whether this design pitch holds water.

  ### Timing Summary
  *   **00-05:** Intro & Definition (Tool for consensus).
  *   **05-15:** Locked Door Example (Twin Versions & Vote).
  *   **15-30:** Dissection & Working Rule (Apply the rule to the example).
  *   **30-40:** Taxonomy (Name the three pumps).
  *   **40-45:** Verification Check (Rewrite the microtransaction statement).
  *   **45-50:** Exclusions & Q&A (Bracket the MA writer's deep dives).

  ### Final Note on Tone
  Keep it American English for the notes (color, analyze, program), but keep your delivery authentic to your studio. The Seattle office cares about spelling; your team cares about utility. If you stick to the "Locked Door" example, you speak both languages.
