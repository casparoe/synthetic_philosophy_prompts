          *   *Principle:* **Joint Probability Thresholds.** Don't assert conjunctions unless the product of probabilities clears the bar.

      *   *Flight Delay (Context):*
          *   *Analysis:* Action vs. Assertion.
          *   *Verdict:* This is the clearest case of *Acceptance*.
