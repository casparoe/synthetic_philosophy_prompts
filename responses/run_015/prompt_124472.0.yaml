          *   *Reasoning:* If the error is known to be in set $\{42, 117, 203\}$, the probability distribution is no longer uniform. The prior probability of error on Page 1 is now near zero (relative to the flagged ones). The probability of error on Page 42 is now $1/3$ (assuming exactly one error) or significantly higher.
          *   *Principle:* **Conditionalization.** Update credences based on the localization of uncertainty.

      *   *Conjunction Scaling:*
          *   *Analysis:* 3 items vs. 50 items.
