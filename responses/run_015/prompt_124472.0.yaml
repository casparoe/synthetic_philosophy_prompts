      *   *Self-Correction on American English:* Watch out for "behaviour," "colour," "favour," "labelled," "travelling." Ensure "z" in "rationalize," etc. (Though the prompt specifically mentioned "behaviour with a u"). I will double-check the text for any British spellings.

      *   *Refining the Preface Case:* The user asks if she should suspend belief on 42, 117, 203.
          *   If she knows there are exactly 3 errors and they are in that set, then for any specific page in that set, the chance of error is high (e.g., if 1 error in 3 pages, 33% chance that specific page is wrong).
          *   If she knows there are 3 errors *somewhere* in the book, but she has *specific suspicion* about these three, her credence in these three drops below her credence in the others.
          *   *Verdict:* She should downgrade credence on those specific pages. She shouldn't necessarily fully suspend, but she can't treat them as equal to Page 10.

      *   *Refining the Lottery Case:*
          *   LW view: Belief is probabilistic. "Believing I will lose" is just having high credence.
