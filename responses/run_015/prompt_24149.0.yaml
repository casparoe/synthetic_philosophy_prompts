answer: |-
  Here is a breakdown of the desiderata for a robust decision theory, the tensions between them, and a scorecard for the leading candidates.

  ### I. The Desiderata: Cases to Get Right

  A viable decision theory must output the utility-maximizing action in the following canonical scenarios. "Winning" is defined by ex-ante expected utility (what you would want your algorithm to do before the scenario begins).

  **1. Newcomb's Problem**
  *   **Scenario:** Omega predicts your choice. Box A is transparent (\$1,000). Box B is opaque (\$1M if Omega predicted 1-box, \$0 if 2-box).
  *   **Requirement:** **One-Box.**
  *   **Rationale:** Two-boxers consistently leave \$1M on the table. A theory that two-boxes is reflectively inconsistent (you would pay to modify yourself into a one-boxer before the game).

  **2. Counterfactual Mugging (Parfit's Mugging)**
  *   **Scenario:** Omega flips a fair coin. If Tails, Omega asks for \$100. If Heads, Omega gives you \$10,000 *if and only if* Omega predicted you would have paid had the coin come up Tails. The coin comes up Heads. Omega asks for \$100.
  *   **Requirement:** **Pay the \$100.**
  *   **Rationale:** Ex-ante, the expected value of being the "type of agent who pays" is positive (\$5,000 - \$50 = \$4,950). Refusing to pay ex-post (when you know the coin is Heads) undermines the ex-ante expectation. You must act as if your current decision determines the counterfactual outcome.

  **3. XOR Blackmail**
  *   **Scenario:** A predictor sends you a letter demanding \$1,000 iff (Termites exist AND you pay) OR (No Termites AND you don't pay). You receive the letter. Paying saves your house (\$1M value) only if termites exist.
  *   **Requirement:** **Do Not Pay.**
  *   **Rationale:** If you pay, the condition implies Termites must exist (for the letter to be sent). If you don't pay, the condition implies No Termites. Paying correlates with the presence of termites in a way that makes you pay for a disaster that your payment logically necessitates. Refusing to pay makes it the case that the letter was only sent because there were no termites.

  **4. Precommitment / Binding Variants**
  *   **Scenario:** Any of the above, but you have the option to bind yourself to a strategy before the predictor simulates you/acts.
  *   **Requirement:** **Action Consistency.** The theory must recommend the same action whether you can bind yourself beforehand or not. If you would precommit to X, you must do X when the time comes without binding.
  *   **Rationale:** A theory that changes its mind based on the *ability* to bind is dynamically inconsistent. It implies the agent is time-inconsistent or suffers from akrasia (weakness of will) by design.

  ---

  ### II. The Desiderata: Distinctions & Principles

  The theory must maintain specific conceptual boundaries and avoid specific failures.

  **1. Preserve: Ex-Ante vs. Ex-Post Rationality (without collapsing them)**
  *   **Requirement:** The theory must explain why an action can be rational ex-ante (policy level) even if it looks suboptimal ex-post (given specific evidence), without simply discarding ex-post evidence.
  *   **Why:** In Counterfactual Mugging, paying \$100 when you know the coin is Heads looks like throwing away money. The theory must justify this without claiming "evidence doesn't matter."

  **2. Preserve: Causation vs. Logical Dependence**
  *   **Requirement:** The theory must distinguish between physical causation (my hand moves the cup) and logical/subjunctive dependence (my algorithm's output matches the simulation's output).
  *   **Why:** CDT fails because it ignores logical dependence. Evidential Decision Theory (EDT) fails because it conflates correlation with causation (e.g., Smoking Lesion). The correct theory must navigate the middle.

  **3. Do Not Contradict: Reflective Consistency**
  *   **Requirement:** You should not wish you were using a different decision theory upon learning the structure of the problem.
  *   **Why:** If a theory tells you to 2-box in Newcomb, but you would pay to modify yourself to 1-box before Omega arrives, the theory is self-undermining.

  **4. Do Not Contradict: No Easy Dutch Books**
  *   **Requirement:** The theory should not allow a sequence of choices that guarantees a loss regardless of the state of the world.
  *   **Why:** This is a baseline coherence requirement for any rational agent.

  ---

  ### III. The Tensions: Flagged Impossibilities

  This is the critical section. You cannot satisfy all desiderata simultaneously within standard frameworks. Here are the pairs that are in direct tension.

  **🚩 TENSION 1: The Principle of Dominance vs. Reflective Consistency**
  *   **The Conflict:** The **Dominance Principle** states that if Action A yields a better outcome than Action B in *every possible state of the world* (given the state is fixed), you should choose A. **Reflective Consistency** requires you to One-Box in Newcomb and Pay in Counterfactual Mugging.
  *   **Why they clash:** In Newcomb's Problem, once the money is in the boxes, the state is fixed. Two-boxing dominates One-boxing (\$1,001,000 > \$1,000 and \$1,000 > \$0). To One-Box, you must violate the Dominance Principle.
  *   **The Cost:** To handle Counterfactual Mugging and Newcomb, you must accept a theory that sometimes tells you to take a strictly dominated action *from the perspective of fixed physical states*.
  *   **Verdict:** You generally cannot have both. FDT/UDT sacrifice Dominance. CDT sacrifices Consistency.

  **🚩 TENSION 2: Updating on Evidence vs. Policy Optimization**
  *   **The Conflict:** **Bayesian Updating** dictates you should maximize utility conditional on your current knowledge (the coin is Heads; the letter is received). **Policy Optimization** (UDT) dictates you should maximize utility over the prior, ignoring specific evidence that is logically correlated with your decision algorithm.
  *   **Why they clash:** In Counterfactual Mugging, once you know the coin is Heads, the expected utility of paying is negative (you lose \$100, gain nothing). To pay, you must effectively ignore the evidence "Coin = Heads" for the purpose of the decision calculation, treating it as a variable in the prior policy.
  *   **The Cost:** A theory that handles Mugging must be "updateless" in some sense. This contradicts the standard Bayesian desideratum that rational agents always update on new information.
  *   **Verdict:** You cannot be a standard Bayesian updater and solve Counterfactual Mugging.

  **🚩 TENSION 3: Logical Omniscience vs. Computability**
  *   **The Conflict:** To evaluate logical counterfactuals (e.g., "What if my algorithm outputted 'Pay' instead of 'Don't'"), the theory requires knowing the logical consequences of that change. **Computability** requires the agent to actually run the algorithm.
  *   **Why they clash:** If you know your own source code and you are deterministic, you know what you will do. To ask "What if I did otherwise?" requires reasoning about a logical contradiction (me doing something my code prohibits).
  *   **The Cost:** FDT/UDT rely on a notion of "logical counterfactuals" that is not yet mathematically formalized. There is no agreed-upon calculus for "impossible possible worlds."
  *   **Verdict:** Currently, no theory fully satisfies this without hand-waving the logic engine.

  ---

  ### IV. Scorecard: CDT vs. FDT vs. UDT

  | Desideratum | **CDT** (Causal) | **FDT** (Functional) | **UDT** (Updateless) |
  | :--- | :--- | :--- | :--- |
  | **Newcomb's Problem** | ❌ Two-Boxes (Leaves \$1M) | ✅ One-Boxes | ✅ One-Boxes |
  | **Counterfactual Mugging** | ❌ Refuses to Pay (Ex-post rational) | ✅ Pays (Ex-optimal) | ✅ Pays (Ex-optimal) |
  | **XOR Blackmail** | ❌ Pays (Exploited) | ✅ Refuses (Immune) | ✅ Refuses (Immune) |
  | **Time/Reflective Consistency**| ❌ Fails (Wishes it precommitted) | ✅ Passes | ✅ Passes |
  | **Dominance Principle** | ✅ Satisfies (Causal Dominance) | ❌ Violates (in Newcomb-like) | ❌ Violates (in Newcomb-like) |
  | **Bayesian Updating** | ✅ Satisfies | ❌ Violates (Updateless) | ❌ Violates (Updateless) |
  | **Logical Counterfactuals** | ✅ N/A (Ignores them) | ⚠️ Informal/Contested | ⚠️ Informal/Contested |

  ### Summary Analysis

  *   **CDT** is the only one that respects **Causal Dominance** and standard **Bayesian Updating**. It fails everything else. It is the theory of "what should I do right now given the world is fixed." It loses in a world where predictors exist.
  *   **UDT** is the most theoretically robust for **Reflective Consistency**. It treats the decision as selecting a global policy from behind a veil of ignorance. It solves Mugging and Newcomb perfectly. However, it is more of a framework than a specific algorithm, and it completely discards Bayesian updating (it maximizes expected utility relative to the *prior*, not the posterior).
  *   **FDT** attempts to split the difference. It keeps the "decision at a time" structure of CDT but expands the notion of "consequence" to include logical/subjunctive dependencies. It solves the cases CDT fails, but it inherits UDT's problem with **Logical Counterfactuals** (we don't have a formal logic for them yet) and violates Dominance.

  **The Bottom Line:**
  If you prioritize **not being exploited** in a world with predictors/simulations, you must accept **Updatelessness** (UDT/FDT) and abandon **Causal Dominance**. If you prioritize **adhering to current evidence and causal intuition**, you must accept **CDT** and admit you will lose money in Newcomb-like scenarios. There is currently no free lunch.
