answer: |-
  # Simulation: The Stage and the Square
  **Time:** 80 Minutes
  **Participants:** 16 Grad Students
  **Goal:** Embodied experience of Rousseau's *Letter to d'Alembert* regarding theater, passivity, and *amour-propre*.

  ## I. Room Setup (5 Minutes)
  Divide the room into two distinct zones.
  1.  **The Theater (Zone A):** Rows of chairs facing a small open space (the stage). Lighting should be slightly dimmed if possible. Aisles are narrow.
  2.  **The Square (Zone B):** An open corner with no chairs, just a rug or marked tape on the floor. Bright light.

  **Role Assignment:**
  *   **Performers (4 students):** Go to Zone A (Stage).
  *   **Spectators (9 students):** Go to Zone A (Seats).
  *   **Festival Citizens (3 students):** Go to Zone B (The Square). *Note: They wait outside or in the corner with backs turned during Phase 1.*

  **Materials:**
  *   **Virtue Chips (White poker chips or paper slips):** 50 total.
  *   **Status Chips (Black poker chips or paper slips):** 20 total.
  *   **Ballots:** For the Spectators.
  *   **Script:** One copy for Performers.

  ---

  ## II. Phase 1: The Theater (25 Minutes)

  **The Dilemma:** The town must decide whether to levy a 10% wealth tax on merchants to fund a defensive wall against a looming threat.

  **The Rules:**
  1.  **Performers:** You will enact a 10-minute skit. The script ends ambiguously but emotionally pressures the audience toward the "Virtuous Sacrifice" (Vote YES on the tax). Your goal is to maximize Audience emotional reaction.
  2.  **Spectators:** You must sit in assigned seats. Do not talk to each other. Your goal is to **hoard Virtue Chips**.
      *   *The Rig:* The Instructor walks the aisles. If you look visibly moved (nodding, sighing, tearing up, leaning forward), you silently receive a **Virtue Chip**.
      *   *The Trap:* You keep these chips. They represent your internal sense of moral sensitivity. At the end, you will vote on the tax.
  3.  **Performers' Payoff:** For every round of applause, Performers receive a **Status Chip**.

  **The Skit (Script Summary for Performers):**
  *   *Scene:* A wealthy merchant and a poor soldier's widow.
  *   *Conflict:* The merchant argues the tax ruins trade; the widow argues the wall saves lives.
  *   *Climax:* The merchant breaks down, admitting he loves his money but fears God. He looks directly at the audience and asks, "What would you have me do?"
  *   *Ending:* Freeze frame on the merchant's tearful face. No resolution.

  **The Vote:**
  Immediately after the skit, while the emotion is high, hand ballots to Spectators.
  *   *Question:* "Should the tax be levied?"
  *   *Instruction:* "Vote based on your conscience."
  *   *Collection:* Collect ballots and chips together.

  **Observation Note for Instructor:** Watch if Spectators vote "YES" simply to align with the moral sentiment they just "purchased" with their attention. Watch if they clutch their chips as they vote, as if the chips *are* the contribution.

  ---

  ## III. Phase 2: The Festival (25 Minutes)

  **Transition:** Clear Zone A. Move everyone (except the 3 Festival Citizens) to observe from the periphery. The 3 Festival Citizens stand in Zone B (The Square).

  **The Rules:**
  1.  **Festival Citizens:** You must reach a decision on the *exact same tax* in 10 minutes.
  2.  **Constraints:**
      *   No script.
      *   No audience (observers must remain silent and not applaud).
      *   No tokens/chips.
      *   **Physical Ritual:** You must all hold a single heavy object (a book or stone) together. If anyone lets go, the vote is invalid. You must maintain physical contact until consensus is reached.
  3.  **Goal:** Reach a decision that everyone can physically support (literally).

  **Observation Note for Instructor:** Watch the friction. Without a script, they must generate the content. Without an audience, there is no applause to harvest. The "heavy object" forces co-presence; they cannot drift into passive sentiment.

  ---

  ## IV. Phase 3: The Debrief (25 Minutes)

  Bring everyone together. Do not reveal the vote results yet. Ask the following questions in order.

  **1. The Spectator's Hoard (Targeting *Amour-Propre*)**
  *   "Spectators, look at your pile of Virtue Chips. Did collecting them make you feel like you had already participated in the civic duty?"
  *   "When you voted, were you deciding on the wall, or were you confirming the moral identity you just built during the skit?"
  *   *Rousseau Point:* In theater, we pay pity to the characters so we don't have to pay taxes to the neighbors. The chips simulated the self-satisfaction of virtue without the cost of virtue.

  **2. The Performer's Frame (Targeting Representation)**
  *   "Performers, did you feel pressure to resolve the emotional tension rather than the political problem?"
  *   *Rousseau Point:* The stage frames the issue as a drama to be *felt*, not a problem to be *solved*. The framing pre-digests the choice.

  **3. The Festival's Friction (Targeting the *Fête Publique*)**
  *   "Festival Citizens, how did it feel to have no script and no audience?"
  *   "Did the physical requirement (holding the object) change how you spoke to each other?"
  *   *Rousseau Point:* In the *fête*, there is no stage. We are the spectacle to ourselves. The friction *is* the politics.

  **4. The Reveal**
  *   Compare the votes.
  *   *Likely Outcome:* Theater voters likely voted "YES" quickly/unanimously (following the emotional arc) but feel hollow. Festival citizens likely took longer, argued more, but feel ownership.
  *   *The Twist:* Ask the Theater group: "If I told you the chips you hoarded could be traded to pay the tax for you, would you have traded them?" (Most will say yes). This proves they viewed the chips as a *substitute* for action.

  **5. Limitations & Critique (Crucial Step)**
  *   Be frank: "What did this simulation miss?"
  *   *Gender/Actresses:* Rousseau was obsessed with the actress as a figure of public sexual display and deception. Our simulation is gender-neutral; it misses his anxiety about women in the public eye corrupting domestic morals.
  *   *Luxury:* We used paper chips. Rousseau feared the *economic* drain of theater (costumes, building maintenance) diverting public funds. We didn't simulate the economic opportunity cost.
  *   *Scale:* 16 people is a village. Rousseau was worried about national culture.

  ---

  ## V. Troubleshooting: Predictable Failures

  **Failure 1: Spectators Break the Fourth Wall**
  *   *Risk:* Grad students are contrarian. They might laugh, talk, or refuse to sit still to "beat the game."
  *   *Fix:* The "Usher." You (Instructor) must act as the Usher. If they talk, do not scold. Simply **stop distributing chips**. Silence the room by withholding the reward. This reinforces the passive dependency: *No obedience, no virtue.*

  **Failure 2: Performers Improvise a Resolution**
  *   *Risk:* Performers might try to be helpful and solve the dilemma in the skit, ruining the vote.
  *   *Fix:* Give them a hard stop rule. "You must end on the question, not the answer." If they resolve it, tell them during the debrief that they turned a *political dilemma* into *propaganda*, which is actually another form of Rousseau's critique (theater as manipulation).

  **Failure 3: Festival Group Reaches Consensus Too Fast**
  *   *Risk:* They just vote immediately to get it over with.
  *   *Fix:* The "Heavy Object" rule. If they vote without 2 minutes of continuous contact, invalidate the vote. Force them to feel the weight of the decision physically.

  **Failure 4: Students Intellectualize the Tokens**
  *   *Risk:* They treat the chips as a game mechanic rather than a feeling.
  *   *Fix:* In the debrief, rename them immediately. "These weren't points. These were *pity*. You collected pity. Did pity build the wall?"

  ## VI. Instructor's Cheat Sheet: Key Rousseau Concepts to Map

  | Simulation Moment | Rousseau Concept | Explanation |
  | :--- | :--- | :--- |
  | **Sitting in Rows** | *Separation* | The physical gap between stage and pit creates psychological distance. We are not *with* the suffering; we are *watching* it. |
  | **Hoarding Chips** | *Moral Substitution* | We satisfy our conscience by feeling the right emotions. Sentiment replaces action. |
  | **Performers' Applause** | *Inauthenticity* | Actors pretend to feel; Audience pretends to be moved. It is a commerce of illusions. |
  | **Festival Circle** | *Fête Publique* | No spectators, only participants. Transparency. The joy is in the doing, not the watching. |
  | **The Vote After Skit** | *Delegation* | We let the representation decide for us. We ratify the script rather than deliberate the law. |

  **Final Note to Instructor:**
  Do not let them off the hook. If they say, "But the play was morally good," press harder: "Rousseau agrees the play was good. That is the danger. If the play were evil, you would reject it. Because it was good, you accepted it *instead* of doing the work. That is the corruption."
