answer: |-
  **Q&A PREPARATION SHEET: INDEXICAL NON-AGGREGATION IN TRIAGE**

  **Workshop Context:** Interdisciplinary Workshop on Distributive Justice in Emergency Contexts.
  **Presenter Thesis:** Indexical Non-Aggregation (reasons are agent-victim indexed, non-scalar, and inter-pathway incommensurable).
  **Tone:** Formal, British Academic English.

  ---

  ### I. Anticipated Objections (Ordered by Likelihood and Damage)

  #### 1. The Operational Paralysis Objection
  **Likely Objectors:** Disaster-Response Coordinators and Applied Ethicists.
  **Vocabulary:** *Triage protocols, decision-latency, institutional paralysis, actionable guidance, bottlenecking.*

  **(1) Core Challenge:**
  "If moral reasons generated by Pathway A (saving five) and Pathway B (saving one) belong to incommensurable indexical frames, you offer the triage officer no rational basis for choosing between them. In an emergency, the inability to compare outcomes across pathways creates decision-latency. If your theory cannot be operationalised into a protocol without causing paralysis, does it not fail the basic requirement of emergency ethics: to guide action under pressure?"

  **(2) Suggested Reply (2 Minutes):**
  "I acknowledge the gravity of institutional paralysis; however, we must distinguish between *moral commensurability* and *procedural tie-breaking*. My claim is that there is no *moral* reason derived from aggregation to prefer Pathway A. This does not entail that the agent cannot act. In the absence of a scalar moral weight, the agent is licensed to use a non-moral tie-breaker—such as proximity, speed of deployment, or even a randomising mechanism—without violating a duty to maximise value. The paralysis you fear stems from the assumption that agents *must* find a moral hierarchy where none exists. By accepting the incommensurability, we liberate the agent to act on pragmatic grounds without the guilt of violating a non-existent aggregative duty. The protocol should not mandate 'save the greater number' as a moral imperative, but rather 'resolve incommensurability efficiently' as an operational rule."

  **(3) Vulnerability:**
  This reply risks sounding like you are outsourcing the moral decision to arbitrary pragmatic factors. If the pragmatic factor (e.g., proximity) correlates with irrelevant features (e.g., socioeconomic status of the neighbourhood), you may be implicitly endorsing bias while claiming moral neutrality.

  **(4) Strategy:**
  **Hold Firm** on the incommensurability, but **Concede** that institutional protocols require pragmatic tie-breakers. Emphasise that these tie-breakers are *administrative*, not *moral*, to avoid the charge that you are smuggling aggregation in through the back door.

  #### 2. The Planning-Action Incoherence Objection
  **Likely Objectors:** Moral Philosophers (All camps) and Applied Ethicists.
  **Vocabulary:** *Reflective equilibrium, diachronic consistency, institutional design, agent-relative vs. agent-neutral, ad hoc distinction.*

  **(1) Core Challenge:**
  "You concede that aggregate outcomes matter for institutional planning but deny they constitute reasons for the individual agent. This creates a diachronic inconsistency. If the institution plans resource allocation based on saving the greater number (aggregation), but the individual agent ignores this metric during execution (non-aggregation), the system becomes self-defeating. How can a plan based on Principle X be executed by agents following Principle Not-X without rendering the planning stage morally incoherent?"

  **(2) Suggested Reply (2 Minutes):**
  "The distinction is not ad hoc but structural. Institutional planning operates at the level of *ex ante* probabilities and population health, where statistical aggregation is the only available tool for stewardship of public resources. The individual rescue decision, however, operates *ex post*, within a concrete causal nexus between a specific agent and specific victims. The planning stage minimises systemic risk; the action stage honours the specific claim of the identifiable victim. To conflate the two is to commit a category error: treating the individual agent as a mere conduit for institutional statistics. I maintain that the moral texture of the face-to-face rescue differs from the spreadsheet of resource allocation, even if the latter informs the availability of the former."

  **(3) Vulnerability:**
  This is your most fragile conceptual junction. If pressed on *why* the moral texture changes simply because the agent is on-site rather than in an office, you risk appearing to endorse a form of moral schizoidism where the right action depends entirely on one's job description rather than the state of the world.

  **(4) Strategy:**
  **Concede Partially.** Acknowledge that the tension is significant. Argue that the *goal* of planning is to create conditions where indexical decisions can be made, not to dictate the decisions themselves. Do not claim they are fully compatible, but rather that they govern different domains of moral labour.

  #### 3. The "Numbers Count" Intuition Objection
  **Likely Objectors:** Weighted-Utilitarian Moral Philosophers.
  **Vocabulary:** *Scalar weighting, moral mathematics, opportunity cost, loss minimisation, Pareto efficiency.*

  **(1) Core Challenge:**
  "Even within a single pathway, if you can save five or one, and the causal cost is identical, refusing to aggregate the claims of the five implies that the sixth, seventh, eighth, ninth, and tenth lives have no marginal moral weight. This violates the basic intuition that every life counts equally. If reasons do not combine scalarly, on what basis do you even prefer saving the five within the pathway? If you do not prefer it, you are indifferent to four preventable deaths."

  **(2) Suggested Reply (2 Minutes):**
  "I do not deny that we should save the five; I deny *why* we should. The utilitarian claims the reason is stronger *because* there are five. I argue the reason is not stronger, but the *opportunity to honour claims* is more extensive. However, crucially, these claims do not sum. We save the five not because the moral weight outweighs the one, but because we can satisfy more individual indexed reasons simultaneously without violating the one. The loss of the one is tragic and not 'outweighed'; it is simply a distinct moral remainder. We avoid the greater loss of satisfaction, not the greater loss of moral weight. This preserves the distinctness of persons, which aggregation obliterates."

  **(3) Vulnerability:**
  Utilitarians will press that "satisfying more claims" just *is* aggregation by another name. If you admit you save the five because you can satisfy more claims, you have admitted a form of maximisation.

  **(4) Strategy:**
  **Hold Firm.** Insist on the distinction between *counting claims* and *weighing reasons*. You can acknowledge more claims are satisfied without accepting that the *reason to act* has increased in scalar intensity.

  #### 4. The Risk-Weighting Objection
  **Likely Objector:** Decision Theorist.
  **Vocabulary:** *Expected utility, probability distributions, risk profiles, stochastic dominance, frame invariance.*

  **(1) Core Challenge:**
  "Emergency contexts are defined by uncertainty. If Pathway A has a 50% chance to save five, and Pathway B has a 90% chance to save one, your indexical framework blocks comparison. However, rational choice under uncertainty requires a common currency to evaluate risk profiles. If you cannot compare the indexical frames, you cannot calculate expected value across pathways. Does your view entail that we should ignore probability when the causal pathways differ?"

  **(2) Suggested Reply (2 Minutes):**
  "Risk-weighting presupposes a common metric of value to which probabilities apply. My thesis denies that the *moral reasons* themselves provide that metric across frames. However, I do not deny the use of probability in assessing the *feasibility* of the indexed reason. The agent assesses the likelihood of successfully fulfilling the specific agent-victim link. We do not compare the 'expected moral value' of A versus B; we compare the robustness of the causal link in A against the robustness of the causal link in B. If the link in B is more secure, the agent may pursue B, not because the expected outcome is higher, but because the indexed reason in B is more action-guiding due to lower epistemic uncertainty."

  **(3) Vulnerability:**
  This invites the follow-up: "So you would choose the 90% chance to save one over the 50% chance to save five?" If you say yes, you appear irrational to the coordinators. If you say no, you have reintroduced aggregation via probability.

  **(4) Strategy:**
  **Concede.** Admit that in high-uncertainty contexts, the security of the causal pathway becomes a dominant pragmatic factor, potentially overriding the number of victims. Frame this as 'epistemic humility' rather than moral calculation.

  #### 5. The Impartiality Objection
  **Likely Objector:** Kantian Moral Philosopher.
  **Vocabulary:** *Universalisability, maxims, respect for persons, impartiality, agent-neutral duties.*

  **(1) Core Challenge:**
  "By indexing reasons to the specific agent-capacity and causal structure, you render moral reasons agent-relative. Kantian ethics requires that maxims be universalisable. If my reason to save Victim X depends on my specific causal link to them, and your reason to save Victim Y depends on yours, we lack a shared moral law. Does this not collapse into a form of moral particularism that undermines the universality required of duty?"

  **(2) Suggested Reply (2 Minutes):**
  "Indexicality does not entail particularism in the sense of arbitrariness. The structure of the duty is universal: 'Honour the claim generated by the agent-victim causal nexus.' What varies is not the law, but the instantiation of the nexus. Respect for persons requires acknowledging that I cannot stand in the same moral relation to a victim I cannot causally reach as I do to one I can. To pretend otherwise—to act as if I have the same duty to the distant five as the proximate one—is to ignore the reality of moral agency. Universality lies in the structure of the relation, not in the erasure of the agent's position."

  **(3) Vulnerability:**
  The Kantian may argue that 'imperfect duties' allow for latitude, but triage involves 'perfect duties' where impartiality is required.

  **(4) Strategy:**
  **Hold Firm.** Distinguish between the universality of the *principle* and the indexicality of the *application*.

  ---

  ### II. The Weakest Point in Your Position

  **The Planning-Action Distinction.**
  You must prepare to defend the boundary between institutional planning (where you allow aggregation) and individual action (where you deny it). This is the most vulnerable point because it invites the charge of inconsistency. If aggregation is valid for planning resource distribution, it implies that saving five is objectively better than saving one at the systemic level. If it is objectively better systemically, it is difficult to explain why it ceases to be a moral reason for the agent executing the plan.

  **Defensive Strategy:**
  Do not treat this as a mere convenience. Frame it as a distinction between **Stewardship** (managing a portfolio of risks and resources, which requires aggregation) and **Rescue** (responding to a specific moral claim, which requires indexicality). Argue that the 'objective betterness' at the planning stage creates the *opportunity* for rescue, but does not dictate the *moral reason* for the specific act. Be prepared to admit that this creates moral tension, but argue that this tension is a feature of complex moral life, not a bug in your theory.

  ---

  ### III. The "Dangerous" Objection (Hope They Do Not Raise)

  **The Pathway Individuation Problem.**
  **Why it is dangerous:** Your entire theory rests on the definition of a "rescue pathway" and the "causal structure linking agent to victim." If an objector asks, *"What determines the boundaries of a causal pathway? If I redefine the pathway, can I change the moral obligation?"*, your view risks collapse.

  For example, if I can view "driving to the hospital" as one pathway (saving 5) or break it down into "driving to the intersection" and "driving from the intersection" (two pathways), I can manipulate whether aggregation applies or whether comparison is blocked. If the moral reason is indexed to the pathway, and the pathway is arbitrarily definable by the agent, then the moral reason becomes manipulable. This threatens to make your indexical framework unstable and subject to gerrymandering by agents seeking to avoid difficult aggregative choices.

  **Preparation:**
  If this is raised, you must argue that causal pathways are not agent-defined descriptions but **ontological facts** about the rescue mechanism. You must claim there is a objective fact of the matter about what constitutes a single intervention versus two. If you cannot defend the objectivity of the "pathway," the indexicality loses its anchor.
