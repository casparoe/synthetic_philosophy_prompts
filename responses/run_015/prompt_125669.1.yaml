answer: |-
  hey — here's a draft list for thursday. kept them tight and aimed at the pressure points in her argument. tone is conversational but sharp, like we're in the workshop.

  1.  **the autonomy hurdle**
      look, the standard kantian line is that obligation comes from autonomy—self-legislation. animals don't have that. so how do they command direct obligations without you secretly smuggling them in as ends-in-themselves? how do you get normativity out of something that can't legislate?

  2.  **follow-up on correlates**
      i guess you'll say rational nature needs external correlates to function properly. but doesn't that just make the animal a prop for *our* rationality? if the duty is ultimately about maintaining *our* coherence, how is that actually a *direct* duty to them and not just a refined indirect duty?

  3.  **blurring the line**
      kant sweats blood over the thing/person distinction in the ethical writings. if we owe them non-instrumental regard, aren't you effectively turning them into quasi-persons? does your view collapse the distinction he's so careful to maintain?

  4.  **factory farming vs. wild predation**
      let's talk meat. does your view condemn human factory farming but let wild predation off the hook? if cruelty structurally undermines rational nature, does it matter who's doing the killing?

  5.  **follow-up on natural cruelty**
      so if a lion tears apart a gazelle, is rational nature corrupted there? or only when a rational agent does it? if it's only us, isn't the "structural" claim just contingent on human psychology again?

  6.  **third critique teleology**
      how does this sit with the teleology in the third critique? kant sees nature as purposive, often with humans at the top. does your "sympathetic-corruption" view clash with that natural hierarchy, or are you rereading the teleology too?

  7.  **textual authority**
      you're privileging the anthropology lectures over the *metaphysics of morals*. why should we think the lectures trump the published ethics? isn't there a risk you're building a system on notes kant didn't finalize?

  8.  **non-instrumental vs. ends-in-themselves**
      you say we need "non-instrumental regard" but deny them "ends-in-themselves" status. philosophically, what's the actual difference? sounds like semantics—if i can't use them merely as means, how are they not ends?

  9.  **mechanism of corruption**
      walk us through the mechanism of "sympathetic-corruption." is it psychological (i feel less empathy) or metaphysical (my rationality is actually broken)? if it's the latter, how do you prove that without sounding mystical?

  10. **scope of sentient life**
      if rational agency requires regard for sentient life, where's the line? does this extend to insects? ai? if it's about coherence of rational nature, does the type of sentience matter, or just the fact of it?

  — let me know if you want me to tweak any of these before i send the final run-of-show.
