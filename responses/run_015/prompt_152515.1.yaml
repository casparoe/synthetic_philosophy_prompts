answer: |-
  Your hypothesis is correct in spirit but treats symptoms as distinct causes. The methodological, observational, and virtue-based disagreements you identified are not three separate fissures; they are manifestations of a single meta-ontological divergence regarding *grounding*. The substantivalist demands a substrate to ground spatiotemporal properties; the relationist demands material relata. When physics removes the relata, as in your Hollow World, the relationist must either deny the properties (contradicting stipulation) or admit primitive relations. Admitting primitive relations between non-material events effectively concedes the substantivalist's ontology while retaining relationist vocabulary. This confirms your suspicion: the deadlock is not about the physics, but about what metaphysics is permitted to say about it.

  Regarding your second request: the dispute between *sophisticated* substantivalism and *sophisticated* relationism is largely verbal, but with a substantive modal residue. Both accept the same mathematical model (a manifold with a metric field) and both accept Leibniz equivalence (isomorphic models represent the same physical situation). The substantivalist calls the manifold a "substance"; the relationist calls the metric field a system of "primitive spatiotemporal relations." If "substance" implies no properties other than bearing the metric structure, the label adds no empirical content. It is notation. However, the dispute remains substantive modally. The substantivalist claims the structure *could* exist without matter (as your Hollow World stipulates); the strict relationist denies this possibility, insisting spatiotemporal relations logically require material relata. Thus, the disagreement is not about the actual world's structure, but about the space of possible worlds and the logical dependencies within them.

  Your Hollow World case is not an artefact of rigging; its failure to discriminate is the most diagnostic result you could have achieved. You expected it to refute relationism, but instead, it revealed that relationism is not a constraint on physical structure, but a constraint on *ontological categorization*. When the relationist retreats to "primitive inertial relations among events" (Retreat Two), they have adopted the substantivalist's ontology (spacetime points/events exist independently of matter) while refusing the substantivalist's label. This confirms that the live question has relocated exactly where you suspected: into modality and theoretical virtue. The Hollow World shows that any relationist view capable of accommodating standard GR must be structurally identical to sophisticated substantivalism. The only remaining difference is whether one views the metric field as a property of a substance or as a free-standing structure. Since both views predict identical gyroscope readings, the failure to discriminate is evidence that the dispute is no longer empirical.

  Given this diagnosis, progress will not come from experiment. Diffeomorphism invariance shields both views from empirical differentiation. Progress requires a change of question. You should stop asking "Which view is true?" and start asking "Which view is fertile?" The substantive question is whether positing "substance" provides explanatory leverage in domains where GR breaks down, such as Quantum Gravity. If substantivalism offers a clearer path to quantizing the metric field (treating it as a real entity rather than a relational bookkeeping device), it earns its ontological cost. If relationism better accommodates background independence, it wins on utility. Progress is pragmatic: determine which ontology facilitates future physics. If neither does, the rational conclusion is instrumentalism: the structure is real, but the categorization is human.

  **Confidence and Weak Points**

  I would defend with high confidence the diagnosis that the dispute is meta-ontological rather than physical. The convergence of sophisticated views on the same mathematical formalism makes this nearly undeniable. The Hollow World analysis supports this: if physical stipulations cannot separate the views, the separation must be metaphysical.

  I would hedge, however, on the claim that the dispute is *merely* verbal. While the actual-world commitments converge, the modal commitments diverge sharply. If one believes that modal facts (facts about possibility) are substantive, then the dispute is substantive. I mark this as a hedge because many physicists regard modal claims about empty universes as meaningless, which would collapse the dispute back into verbalism.

  The single consideration that would most quickly lead me to abandon this diagnosis is a formal result in Quantum Gravity showing that one ontology leads to mathematical inconsistency while the other resolves it. For example, if loop quantum gravity (often associated with relationism) proved mathematically impossible without a background manifold (substantivalism), the dispute would become empirical/formal rather than metaphysical.

  My diagnosis is most likely to fail on the definition of "structure." I have assumed that "primitive relations" and "substantival properties" are interchangeable if they attach to the same points. This may be wrong. If there is a coherent metaphysical distinction between a property bearing substance and a free-standing structural realist ontology that does not reduce to notation, then the dispute is deeper than I have allowed. However, articulating that distinction without slipping into empirically idle metaphysics is the very challenge your group has faced. Until that distinction is made precise, the diagnosis of meta-ontological stalemate stands.
