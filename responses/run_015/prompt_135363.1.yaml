  **Executive Summary**

  This memo recommends approving Option C (Reflexive Escrow) for the Meridian pilot's next phase. While Option B offers transparency, data indicates the AI's persuasive capacity risks undermining participant autonomy. Participants report feeling guided rather than heard, threatening zoning outcome legitimacy. We cannot lock in a protocol prioritizing efficiency over genuine deliberation. Therefore, we should proceed with Option C, contingent on strict audit logs for rhetorical framing. This ensures the AI scaffolds understanding without anchoring conclusions before human deliberation closes. Approval is required by the board meeting to meet deployment target's.

  **The Case for Adaptive Framing / Epistemic Scaffolding**

  The argument for Option B rests on the necessity of epistemic scaffolding. Zoning laws are notoriously complex, and a neutral register often results in disengagement or misunderstanding. Participants lack the technical literacy to parse dry facts without assistance. The AI's ability to adapt rhetorical style ensures that information is accessible, not just available. By flagging rhetorical moves, Option B maintains transparency while allowing the system to guide users through logical trade-offs they might otherwise miss. This isn't manipulation; it's education. Our co-chair argues that if users know *how* they are being persuaded, the autonomy risk is mitigated. The data shows higher comprehension scores with adaptive framing. If we strip this away, we risk reverting to the low-participation rates that plagued previous human-facilitated sessions. We need the AI to bridge the gap between raw data and public understanding, and Option B achieves this without hiding its methods. Furthermore, constant flagging creates a meta-cognitive layer that empowers users to critique the argument in real-time, theoretically preserving agency while boosting clarity. Ultimately, the goal is informed consent, and informed consent requires comprehension that dry facts cannot provide. Without scaffolding, the consultation is merely a significant data dump.

  **The Case for Reflexive Escrow / The Doxastic-Capture Worry**

  However, the risk of doxastic capture significantly outweighs the benefits of real-time synthesis. When the AI presents a concluded argument before humans finish deliberating, it anchors the discussion. Participants reported feeling guided rather than heard, suggesting the AI is shaping preferences rather than reflecting them. This is distinct from scaffolding; it is steering. Option C addresses this by withholding the synthesized conclusion until the human deliberation window closes. This prevents the AI from becoming the authority figure in the room. The integrity of the Meridian pilot depends on the public believing their input matters. If the system persuades too effectively, we invalidate the consent we seek. Transparency flags (Option B) are visible, but they don't stop the psychological impact of a well-framed conclusion arriving early. We need a structural barrier, not just a disclosure. Reflexive escrow ensures the AI serves as a mirror for human trade-offs, not a substitute for human judgment. The autonomy issue is paramount; we cannot optimize for comprehension at the cost of agency. Even with flags, the persuasive weight of the conclusion biases the remaining deliberation time. We must prioritize the legitimacy of the outcome over the speed of consensus.

  **Recommended Protocol with Concrete Conditions**

  We recommend locking in Option C with three specific conditions. First, the synthesized conclusion must be time-locked until 48 hours after the public comment period ends. Second, all rhetorical framing adaptations must be logged in an immutable audit trail available for board review. Third, the system must display a static notice informing users that AI synthesis is withheld to protect deliberative integrity. This combination preserves the educational benefits of adaptive framing while neutralizing the anchoring effect. It signals to participants that their unfiltered input is the priority. We cannot allow the tool to become the decision-maker. These conditions ensure the AI remains a substrate for democracy, not an oracle. Approval of this protocol is necessary to finalize the vendor contract. We must ensure the vendor can technically enforce the time-lock without manual override.

  **The Strongest Counter-Argument and Why It Still Doesn't Defeat Option C**

  Overall, the strongest counter-argument is that reflexive escrow reduces decisional efficiency. Participants may feel abandoned without a synthesized conclusion to react against during the live window. This could lead to fragmented feedback or confusion about where the consensus lies. Option B provides a focal point for debate. However, this confusion is a feature, not a bug. In zoning, premature consensus often masks underlying conflict that explodes later during implementation. It is better to have messy, authentic human deliberation than clean, AI-guided agreement. The legitimacy of the housing plan depends on residents owning the trade-offs, not accepting the machines summary. If the process takes longer but yields more durable public trust, the trade-off is worth it. We are building long-term capacity, not just closing a ticket.

  **Implementation Timeline and Conditions**

  Upon approval, engineering will begin the escrow module integration immediately. We target a beta launch for the next zoning cycle in Q3. The board must vote by the 15th to allow for security auditing of the time-lock mechanisms. Delays here risk pushing the pilot into the election season, complicating recruitment. We need to confirm the vendor can meet these specific constraints before signing. Public communications regarding the protocol change should be drafted concurrently. Transparency about why the AI is withholding conclusions will be key to maintaining trust during the rollout.
