      *   **Point 1: The Normative/Empirical Category Error.**
          *   Nozick's argument is normative (what *is* good?).
          *   Surveys are descriptive (what do people *report*?).
          *   To "correct" the data is to impose a normative theory (Hedonism) onto descriptive data. This violates the neutrality required for public policy in a pluralistic society.
      *   **Point 2: The Definition of "Bias".**
          *   In psychology, a bias is a deviation from rationality or accuracy.
