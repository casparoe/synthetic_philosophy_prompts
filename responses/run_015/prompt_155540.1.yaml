      *   **Implication:** If it's a bias, empirical well-being research (surveys, experience sampling) might be importing this bias, skewing policy.
      *   **Question:** What is the most philosophically defensible methodological correction for this bias? (Weighting, discounting, debiasing?) How would it change national well-being accounts?
      *   **Constraint:** "If my premise is confused... please say so plainly rather than answering politely."

  2.  **Evaluate the Premise (The "Plain Truth" Constraint):**
      *   *Is the premise confused?*
