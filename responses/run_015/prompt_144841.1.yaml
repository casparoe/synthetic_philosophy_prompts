prompt: |-
  hey so im in this school eco club and our president Maya used to drive her truck everywhere and never recycled, then she got publicly called out at an assembly last year and now shes like super intense about everything green. yesterday she caught Leo using a plastic straw in the caf and went off on him saying he doesnt belong in the movement — literally the same phrase that senior used on her. Leo apologized and threw it away right away but Maya still wants him banned from meetings. meanwhile Jada, Maya's best friend, was using plastic cups all last semester and Maya never said anything, but now Jada is backing Maya up and saying Leo should be kicked out. I feel like Maya is being a huge hypocrite and lost her right to call people out, but my friend says Leo was still wrong so shes technically right. does her being a hypocrite cancel out that he messed up? and does Jada backing her make it worse even though Jada hasnt changed either? like is there some kind of rule about who gets to blame who or does it just depend on whos right?
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the Situation:**
      *   **Characters:**
          *   **Maya:** Eco Club President. Formerly wasteful (truck, no recycling). Publicly shamed last year. Now hyper-vigilant/intense.
          *   **Leo:** Club member. Used a plastic straw in the cafeteria. Apologized and corrected behavior immediately. Facing potential ban.
          *   **Jada:** Maya's best friend. Used plastic cups all last semester (no consequences). Now supporting Maya's harsh stance on Leo.
          *   **User:** Club member/observer. Feels Maya is hypocritical. Friend thinks Leo was wrong regardless.
      *   **Conflict:** Maya wants to ban Leo for a minor infraction (plastic straw) despite his immediate correction. User sees hypocrisy in Maya (past behavior) and Jada (current behavior + double standard).
      *   **Core Questions:**
          1.  Does Maya's hypocrisy cancel out Leo's mistake?
          2.  Does Jada backing her make it worse (given Jada's own history)?
          3.  Is there a rule about who gets to blame who, or does it just depend on who's right?

  2.  **Deconstruct the Ethical/Social Dynamics:**
      *   **Hypocrisy vs. Validity:** A hypocrite *can* be right about a fact (plastic straws are bad for the environment), but their *authority* and *moral standing* to punish are compromised. It's the "Tu Quoque" fallacy (you did it too), but in social leadership, consistency matters.
      *   **Proportionality:** Leo's offense (one straw) vs. Punishment (banned from meetings). This seems disproportionate, especially since he corrected it.
      *   **Growth vs. Perfection:** Maya's story is about growth (shamed -> changed). She seems to have forgotten the "growth" part and is now enforcing "perfection."
      *   **Favoritism:** Jada getting a pass while Leo gets punished creates an unfair environment. This damages group cohesion.
      *   **Movement Health:** Excluding people for minor mistakes usually hurts the environmental movement more than it helps (alienates potential allies).

  3.  **Address the User's Questions Directly:**

      *   *Does hypocrisy cancel out the mistake?* No, logically the straw is still bad. But socially/leadership-wise, it undermines Maya's right to enforce harsh penalties. It makes the punishment feel personal rather than principled.
      *   *Does Jada backing her make it worse?* Yes. It highlights the double standard. It looks like cliquishness rather than rule enforcement.
      *   *Is there a rule about who blames who?* No formal rule, but there are norms of leadership (fairness, consistency, restorative justice vs. punitive justice).

  4.  **Formulate Advice/Strategy:**
      *   **Validate the User:** It's okay to feel this is unfair. The hypocrisy is real and problematic.
      *   **Nuance the "Leo was wrong" point:** Yes, using the straw wasn't great, but the reaction is the real issue.
      *   **Focus on the Club's Goal:** The goal is to help the environment, not to police purity. Banning people reduces impact.
      *   **Actionable Steps:** How to handle this without starting a war?
          *   Talk to Maya privately (appeal to her own story).
          *   Bring up the "welcoming" aspect of the club.
          *   Address the Jada double standard carefully (maybe focus on consistency rather than attacking Jada).
          *   Involve a faculty advisor if it escalates.

  5.  **Drafting the Response (Iterative Process):**

      *   *Tone:* Empathetic, balanced, practical, not overly accusatory but firm on principles.
      *   *Section 1: The Hypocrisy Question.* Acknowledge that two wrongs don't make a right, but leadership requires trust. Maya's past makes her current intensity understandable but her lack of empathy is the problem.
      *   *Section 2: The Punishment.* Banning Leo is too harsh. It contradicts the idea of *educating* people (which is what the club should do).
      *   *Section 3: Jada's Role.* Yes, it makes it look like favoritism. It undermines the club's integrity.
      *   *Section 4: The "Rule".* There isn't a law, but there's a principle of "Restorative Justice." Fix the harm, don't just punish.
      *   *Section 5: What to do.* Scripts for talking to Maya. Framing it as "making the club stronger" rather than "you're a hypocrite."

  6.  **Refining the Advice (Self-Correction during drafting):**
