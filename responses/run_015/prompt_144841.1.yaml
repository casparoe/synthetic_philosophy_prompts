answer: |-
  This is a classic leadership and ethics dilemma, and your instincts are spot on. It's complicated because there are two different things happening at once: **the environmental rule** (plastic is bad) and **the social dynamic** (fairness, growth, and leadership).

  Here is a breakdown of what's actually going on, how to answer your questions, and how you might handle it.

  ### 1. Does Maya's hypocrisy cancel out Leo's mistake?
  **Logically? No.** A plastic straw is still bad for the environment, regardless of who points it out. If a smoker tells you smoking is bad, they are still telling you the truth.
  **Morally and Socially? Yes, it undermines her authority.**

  Here is the distinction: Maya is right about the *straw*, but she is wrong about the *consequence*.
  *   **The Mistake:** Leo used a straw. He admitted it and fixed it.
  *   **The Hypocrisy:** Maya is enforcing a standard of "perfection" that she herself didn't meet until she was publicly shamed.
  *   **The Problem:** Leadership isn't just about being right; it's about bringing people along. Maya seems to have forgotten that *she* needed grace to change. By denying Leo that same grace, she is acting out of her own lingering shame rather than out of genuine environmental concern. She is trying to prove she's "one of the good ones" by being harder on everyone else than she was on herself.

  ### 2. Does Jada backing her make it worse?
  **Yes.** It shifts the situation from "enforcing rules" to "clique enforcement."
  If Maya banned everyone who used plastic, it would be harsh but consistent. But because Jada (her best friend) used plastic cups all semester without consequence, it looks like favoritism.
  *   **Trust:** In any group, trust is built on consistency. If the rules apply to Leo but not Jada, the rules aren't real; they are just weapons to use against people the leader doesn't like.
  *   **Integrity:** Jada backing Maya up without acknowledging her own past behavior makes her complicit in the double standard. It signals to the rest of the club that "who you know" matters more than "what you do."

  ### 3. Is there a rule about who gets to blame who?
  There is no official law, but there is a principle in ethics and leadership called **"Clean Hands"** or **Credibility.**
  *   **Restorative vs. Punitive:** Good eco-clubs focus on *restorative* justice (educating, fixing the mistake, moving forward). Maya is pushing *punitive* justice (shaming, banning, excluding).
  *   **The "Glass House" Rule:** While you *can* criticize from a glass house, you lose the right to demand harsh punishment if you haven't paid the same price. Maya paid the price of public shame; she is now trying to inflict that same shame on Leo for a much smaller infraction.

  ### The Verdict
  Your friend is technically right that Leo broke the norm, but **your friend is missing the bigger picture.** The health of the club depends on psychological safety. If members feel they will be banned for a single mistake while the President's friends get a pass, people will stop trying. They will either quit or hide their mistakes.

  Maya is prioritizing **purity** over **progress**. The environmental movement needs more people trying imperfectly than a few perfect people banning everyone else.

  ### How to Handle It
  You want to fix this without blowing up the club or starting a war. Here is a strategy:

  **1. Don't attack the hypocrisy directly (yet).**
  If you say, "You used to drive a truck, so you can't ban him," Maya will get defensive and dig in. She knows her past, and she's sensitive about it.

  **2. Appeal to her "Origin Story."**
  Talk to Maya privately. Remind her of her own journey.
  *   *Script:* "Maya, I know you want the club to be taken seriously. But when I heard what happened with Leo, it reminded me of what happened to you last year at the assembly. You changed because people gave you a chance to learn, not because you were banned. If we ban Leo for one straw, aren't we becoming the kind of people who shamed you? I think we lose more allies by banning people than we gain."

  **3. Address the Consistency (The Jada Factor).**
  This is trickier. You don't need to throw Jada under the bus, but you need to mention fairness.
  *   *Script:* "Also, people are noticing that the rules seem different for different people. For the club to work, everyone needs to feel the standards are fair. If Leo gets banned for a straw while others have used cups without issue, it looks like favoritism. It hurts your credibility as President."

  **4. Propose a "Three Strikes" or Education Policy.**
  Suggest a concrete alternative to banning.
  *   *Script:* "Instead of banning him, what if the consequence was that Leo has to lead a presentation on plastic alternatives next meeting? That turns the mistake into education for the whole club."

  ### Summary
  Maya isn't "wrong" about the straw, but she is **wrong about how to lead.**
  *   **Leo:** Made a mistake, fixed it. Deserves a warning, not a ban.
  *   **Maya:** Is overcompensating for her past. Needs to remember that growth requires patience.
  *   **Jada:** Is enabling a double standard.
  *   **You:** Are right to be concerned. A movement built on exclusion and hypocrisy won't last.

  If Maya refuses to listen and bans him anyway, you have to decide if this is a club you want to be part of. A club that values "looking green" over "doing good" isn't really an eco-club; it's a popularity contest.
