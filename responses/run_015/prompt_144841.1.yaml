      *   *Correction:* I need to make sure I don't excuse Leo entirely. He *did* break the norm. But the consequence is the issue.
      *   *Key Insight:* Maya is likely overcompensating because of her own shame. Reminding her of her own journey might trigger empathy.

  7.  **Final Polish:** Organize into clear points. Ensure the distinction between "being right about the environment" and "being right about leadership" is clear. (This matches the thought process in step 2).

