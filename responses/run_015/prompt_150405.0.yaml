answer: |-
  There is no single, canonical noun in the historiography of science (like "paradigm" or "habitus") that exclusively names this specific move. However, your observation identifies a precise mechanism that is often discussed but rarely isolated. It is typically subsumed under broader critiques of **Whig history**, **internalism**, or **textbook science** (in the Kuhnian sense), but those terms are too blunt for the distinction you require.

  For the purposes of your seminar, the most precise established descriptor is **"Retrospective Conceptual Conflation."** While not a capitalized "Proper Noun" of theory, it is the standard phrase used by historians (e.g., in analyses of the Newton-Leibniz or Darwin-Wallace cases) to describe the erasure of heterogeneity.

  However, to give you the analytical "carving knife" you requested, I propose formalizing this as **"Retrospective Ontological Unification" (ROU)**. This distinguishes it from mere narrative shorthand by emphasizing that the *object itself* is being reconstructed, not just the story.

  Below is a precise definition, a distinction from adjacent concepts, and an application to your test cases.

  ---

  ### 1. Proposed Definition: Retrospective Ontological Unification (ROU)

  **Retrospective Ontological Unification** is the historiographical operation whereby two or more conceptually heterogeneous theoretical structures, produced independently, are narratively collapsed into a single named entity ("The Calculus," "Natural Selection," "Oxygen") based on their *future* utility rather than their *contemporary* content.

  **Three Necessary Conditions:**
  1.  **Structural Heterogeneity:** The original formulations differ in ontology (what exists), methodology (how knowledge is produced), or scope (what problems are addressed). They are not merely notational variants.
  2.  **Retrospective Identity Assertion:** Later narrators assert an identity relation ($A = B$) that was not recognized by the original actors, justified by the fact that both lead to a shared descendant theory ($C$).
  3.  **Priority Reframing:** The dispute is transformed from a debate over *which framework is superior* into a race over *who found the pre-existing object first*.

  ### 2. Distinctions from Adjacent Concepts

  To ensure the carving is sharp enough for graduate analysis, distinguish ROU from these three common confusions:

  | Concept | Definition | How it differs from ROU |
  | :--- | :--- | :--- |
  | **Multiple Discovery** (Merton) | The empirical fact that two people find similar things at the same time. | Merton describes the *event*; ROU describes the *narrative processing* of that event. Merton does not require the things to be identical, only functionally equivalent. |
  | **Whig History** (Butterfield/Kuhn) | Judging past science by present standards of truth/progress. | Whig history evaluates *quality* (Who was more right?). ROU asserts *identity* (Who found the same thing?). You can have ROU without Whig progressivism (e.g., claiming two errors were the "same error"). |
  | **Black Boxing** (Latour) | The process by which controversy is closed and the internal workings of a fact are hidden. | Black boxing stabilizes *a* fact. ROU is the specific move of *merging two lineages* into that box. Black boxing is the container; ROU is the act of packing two distinct items into it and labeling them as one. |
  | **Convergent Evolution** | Independent development of similar traits due to similar pressures. | This implies the similarity is *real* and functional. ROU implies the similarity is *narrated* and often obscures real functional differences (e.g., Wallace lacked the Malthusian mechanism). |

  ### 3. Application to Test Cases

  Here is how you can apply ROU to determine if the flattening is justified or obscuring in your seminar examples.

  #### Case A: Lavoisier and Priestley (Oxygen)
  *   **The Flattening:** Textbooks state both "discovered oxygen" in the 1770s.
  *   **Heterogeneity Check:**
      *   *Priestley:* Discovered "dephlogisticated air." Ontology: Phlogiston theory. The gas is defined by the *absence* of a substance (phlogiston) removed from the calx.
      *   *Lavoisier:* Discovered "oxygen." Ontology: Anti-phlogiston. The gas is a *positive* substance that combines with metals.
  *   **ROU Diagnosis:** **High Conflation.**
      *   They were not studying the same *object* in their own terms. Priestley was studying a vacuum-like property; Lavoisier was studying a chemical reagent.
      *   *Verdict:* The unification is only possible by adopting Lavoisier's ontology retrospectively. Using ROU reveals that Priestley did not "discover oxygen"; he discovered a gas that *we now call* oxygen, but his theoretical achievement was fundamentally different (and, in his view, incompatible).
  *   **Seminar Point:** Does crediting Priestley with "oxygen" grant him unearned credit for a theory he explicitly rejected?

  #### Case B: Boltzmann and Gibbs (Statistical Mechanics)
  *   **The Flattening:** Both are cited as founders of "Statistical Mechanics."
  *   **Heterogeneity Check:**
      *   *Boltzmann:* Kinetic theory. Focused on the mechanical motion of *real atoms* in time (H-theorem). Ontology: Atoms are physically real; mechanics is dynamic.
      *   *Gibbs:* Ensemble theory. Focused on phase space and *hypothetical* collections of systems. Ontology: Atoms could be heuristic; mechanics is static/geometric.
  *   **ROU Diagnosis:** **Moderate/Justified Conflation.**
      *   Unlike Newton/Leibniz, the mathematical bridge between Kinetic and Ensemble theory was built relatively quickly (by Ehrenfest and others). The structures are provably isomorphic in the thermodynamic limit.
      *   *Verdict:* The flattening is more justified here than in the Darwin/Wallace case because the mathematical equivalence was demonstrated early, making the "single entity" claim technically robust, even if the ontological commitments (realism vs. instrumentalism) differed.
  *   **Seminar Point:** ROU helps distinguish between *mathematical equivalence* (which justifies unification) and *ontological divergence* (which complicates it).

  #### Case C: Darwin and Wallace (Natural Selection)
  *   **The Flattening:** "The Theory of Evolution by Natural Selection."
  *   **Heterogeneity Check:**
      *   *Darwin:* Deep time, uniformitarian geology, artificial selection analogies, Malthusian struggle applied to *divergence* and *speciation*.
      *   *Wallace:* Biogeographic focus, group selection tendencies (later), lacked the extensive breeding evidence, viewed selection as a stabilizing force rather than a diverging one.
  *   **ROU Diagnosis:** **High Conflation.**
      *   Wallace's 1858 paper does not contain the mechanism of *divergence* (the origin of species), only the modification of varieties. Darwin's theory is a theory of *speciation*; Wallace's was a theory of *adaptation*.
      *   *Verdict:* The unification obscures that Darwin solved a problem (speciation) Wallace did not address. The priority dispute is framed as "who thought of selection" rather than "who explained the tree of life."
  *   **Seminar Point:** ROU reveals that the "Darwin-Wallace" credit assignment is a social compromise, not a reflection of identical intellectual achievement.

  ### 4. Seminar Utility: The "ROU Test"

  For your seminar, you can propose the **ROU Test** for any claim of simultaneous discovery. Ask students to evaluate three layers:

  1.  **The Formal Layer:** Are the mathematical or logical formalisms translatable? (e.g., Gibbs $\leftrightarrow$ Boltzmann = Yes; Newton $\leftrightarrow$ Leibniz = Difficult).
  2.  **The Ontological Layer:** Do the actors agree on what *exists*? (e.g., Lavoisier $\leftrightarrow$ Priestley = No).
  3.  **The Teleological Layer:** Is the unification driven by the success of a *third*, later synthesis? (e.g., Modern Calculus makes Newton/Leibniz look like precursors to *us*, not peers to *each other*).

  **Conclusion for the Seminar:**
  If the unification relies entirely on the **Teleological Layer** (Layer 3) while ignoring contradictions in the **Ontological Layer** (Layer 2), you have identified **Retrospective Ontological Unification**. This move is not necessarily "false"—it is how science stabilizes its canon—but it is a *sociological achievement*, not a historical fact. Recognizing it allows students to see priority disputes not as races for a trophy, but as negotiations over which version of the future will claim the past.
