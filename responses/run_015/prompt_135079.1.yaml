  As the compliance officer, I determine liability solely by the handbook. The handbook states that if altering the logs is not wrong, then notifying security is unnecessary. My review confirms that altering the logs is not wrong under the emergency clause. Therefore, notifying security is unnecessary for this incident.

  ### Analysis

  **1. Approval/Disapproval plus Higher-Order State**
  *   **Step 1 (Conditional):** "If altering the logs is not wrong..."
      *   *Ascribed State:* The speaker must hold a higher-order attitude of tolerating the combination of (tolerance of altering logs) and (not notifying security).
      *   *Verdict:* **Strained.** The officer explicitly lacks personal tolerance; they are citing a rule. To save the theory, we must claim they tolerate the *rule's* tolerance, which shifts the object of the attitude from the act to the text, admitting propositional content.
  *   **Step 2 (Categorical):** "Altering the logs is not wrong."
      *   *Ascribed State:* The speaker expresses tolerance (or indifference) toward altering logs.
      *   *Verdict:* **Fails.** The vignette stipulates the officer has no stance (not even indifference); they are a conduit. Attributing personal tolerance contradicts the "solely by the handbook" constraint.
  *   **Step 3 (Conclusion):** "Notifying security is unnecessary."
      *   *Ascribed State:* The speaker expresses tolerance toward not notifying.
      *   *Verdict:* **Strained.** This tolerance is derived logically, not felt. The theory struggles to explain how a derived tolerance arises without the initial personal tolerance required to feed the higher-order machinery.

  **2. Norm-Acceptance-as-Planning**
  *   **Step 1 (Conditional):** "If altering the logs is not wrong..."
      *   *Ascribed State:* The speaker plans to rule that if they do not plan to blame altering, they do not plan to blame not-notifying.
      *   *Verdict:* **Strained.** The officer is not planning their own blame-structures; they are tracking the handbook's requirements. This requires a "hypothetical plan" that looks indistinguishable from accepting a proposition.
  *   **Step 2 (Categorical):** "Altering the logs is not wrong."
      *   *Ascribed State:* The speaker plans not to blame altering logs.
      *   *Verdict:* **Fails.** The officer may personally plan to blame altering logs (hating the act) while ruling it is not wrong per the handbook. The planning account conflates the officer's personal planning with the institutional ruling.
  *   **Step 3 (Conclusion):** "Notifying security is unnecessary."
      *   *Ascribed State:* The speaker plans not to blame not-notifying.
      *   *Verdict:* **Strained.** The plan is derived from the rule, not the speaker's normative psychology. The theory must stretch "planning" to include "recording what the rule plans," which dilutes the expressivist reduction.

  **Load-Bearing Feature:** The institutional decoupling of the speaker's psychological state from the normative content they assert.
  **If Removed:** If the officer spoke personally ("I think altering logs is not wrong"), the case collapses back into the standard Frege-Geach scenario your friend claims to solve with higher-order attitudes.
  **Best Objection:** Your friend will argue for *Contextual Expressivism*: the officer *does* have a stance, namely endorsement of the handbook's authority, so the "attitude expressed" is relative to the institutional context, not the speaker's soul.
  **Verdict on Novelty:** This is a costume; it strips away the assumption of personal endorsement to reveal the original Frege-Geach gap between content and psychological state.

  ### Table 1: Step-and-Account Analysis

  | Step | Sentence | Account | Ascribed state | Verdict | Why |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | 1 | "if altering the logs is not wrong..." | Approval-plus-higher-order-state | Higher-order tolerance of combining tolerance-of-altering with no-notify | Strained | Requires tolerating the rule's attitude rather than expressing a personal state. |
  | 2 | "if altering the logs is not wrong..." | Norm-acceptance-as-planning | Plan to rule that no-blame-for-altering entails no-blame-for-notifying | Strained | Turns logical tracking of rules into a complex hypothetical planning state. |
  | 3 | "altering the logs is not wrong" | Approval-plus-higher-order-state | Personal tolerance or indifference toward altering logs | Fails | Contradicts the vignette's stipulation that the officer has no personal stance. |
  | 4 | "altering the logs is not wrong" | Norm-acceptance-as-planning | Personal plan not to blame altering logs | Fails | Officer may personally blame the act while ruling it permissible per handbook. |
  | 5 | "notifying security is unnecessary" | Approval-plus-higher-order-state | Personal tolerance toward not notifying security | Strained | Derived tolerance cannot exist without the personal input tolerance the theory requires. |
  | 6 | "notifying security is unnecessary" | Norm-acceptance-as-planning | Personal plan not to blame not notifying security | Strained | The plan is institutional, not psychological, forcing "planning" to mean "recording rules." |

  ### Table 2: Summary Verdict

  | Load-bearing feature | If removed | Best objection from the account that fares worst | Verdict on novelty |
  | :--- | :--- | :--- | :--- |
  | Institutional decoupling of speaker state from normative content | Speaker endorses norm personally (returns to textbook Frege-Geach) | Contextualism: The speaker *does* have a stance (endorsement of the handbook's authority) relative to the context | It is a costume that clarifies the original problem by removing the distraction of personal endorsement. |
