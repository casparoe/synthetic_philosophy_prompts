  # Activity Design: The Threshold Extraction Protocol

  ## 1. Objective & Philosophical Target
  This simulation forces students to inhabit the **Aggregation Problem** under **Threshold Deontology**. By Round 3, the structural conditions will allow every participant to sincerely claim they did not violate the moral constraint ("Do not cause catastrophe"), while the group collectively violates it. The activity isolates the tension between *individual causal impotence* and *collective impermissibility*.

  ## 2. Materials Required
  *   **Weight Deck:** 8 Index Cards.
      *   Values: `0.4`, `0.5`, `0.5`, `0.6`, `0.6`, `0.7`, `0.7`, `0.8`.
      *   *Total Sum:* 4.8.
      *   *Distribution:* Shuffle and deal one face-down to each student.
  *   **Extraction Tokens:** 40 small identical objects (poker chips, glass beads, or printed paper squares).
  *   **Harm Board:** A large sheet of paper with a "Thermometer" drawn vertically.
      *   Scale: 0 to 20.
      *   **Green Zone:** 0–8 (Safe).
      *   **Yellow Zone:** 8–12 (Risk).
      *   **Red Zone:** 12+ (Collapse).
      *   *Crucial Detail:* The tick marks in the Yellow Zone are faint/obscured. Students can see the needle enter Yellow, but cannot read the exact number.
  *   **Harm Chips:** A bucket of 200 red beads/chips.
  *   **Credit Ledger:** A whiteboard to track student names and token earnings.
  *   **Timer:** Physical stopwatch or phone (silent).

  ## 3. Setup & Rules (10 Minutes)
  1.  **Seating:** Arrange students in a circle. Place the Harm Board in the center.
  2.  **Distribution:** Deal one **Weight Card** to each student. They must not show this to anyone.
  3.  **The Constraint:** Announce the **Collapse Threshold**: *"If the Total Weighted Extraction exceeds 12.0 units at any point, the system collapses. All Course Credit Tokens earned by the group are voided."*
  4.  **The Payoff:** *"Each Extraction Token you personally secure is worth 1 Course Credit Point. There are 3 Rounds. In each round, you may choose to Extract (take 1 Token) or Abstain (take 0)."*
  5.  **The Harm Function:** *"Harm is non-linear. As the Total Weighted Extraction rises, the damage accelerates. The Thermometer tracks the Weighted Sum. The Red Chips track the Quadratic Harm."*
  6.  **Communication:** *"No verbal or non-verbal communication regarding decisions or weights is permitted during rounds. This simulates the opacity of real-world causal contributions."*

  ## 4. Turn Order & Execution (30 Minutes)

  **Round 1:**
  1.  **Decision:** Students silently decide to Extract (place a closed fist on the table) or Abstain (open hand).
  2.  **Reveal:** On count of three, reveal.
  3.  **Calculation (Facilitator Only):** Collect tokens. Count them (e.g., 8 tokens).
      *   *Secretly* ask students to show you their Weight Cards one by one to calculate the **Weighted Sum**. (e.g., 8 tokens $\times$ avg weight $\approx$ 4.8).
      *   *Do not reveal the Weights or the Exact Sum.*
  4.  **Visual Update:**
      *   Move the Thermometer needle to **4.8** (Clearly in the Green Zone).
      *   **Quadratic Visual:** Place **25 Red Chips** ($4.8^2 \approx 25$) into a clear jar labeled "Harm."
  5.  **Payoff:** Award 1 Credit Token to each extractor on the Ledger.

  **Round 2:**
  1.  **Decision:** Silent choice. (Predictably, most will Extract again, seeing the Green Zone).
  2.  **Reveal:** Reveal choices.
  3.  **Calculation:** Cumulative Tokens = 16. Cumulative Weighted Sum $\approx$ 9.6.
  4.  **Visual Update:**
      *   Move Thermometer needle to **9.6**.
      *   *Observation:* The needle is now in the **Yellow Zone**. It is visibly higher, but the exact number is hard to read against the faint ticks.
      *   **Quadratic Visual:** Add **67 Red Chips** ($9.6^2 - 4.8^2 \approx 67$) to the jar. The chip level rises dramatically faster than Round 1.
  5.  **Payoff:** Award Credit Tokens.

  **Round 3 (The Trap):**
  1.  **Briefing:** *"You are in the Yellow Zone. The Threshold is 12.0. The Harm is accelerating. You may Extract or Abstain."*
  2.  **Decision:** Students reason: *"We are at roughly 9 or 10. I have 2 units of buffer. My weight is only 0.4 or 0.5. I cannot be the one to cross 12. It is safe to extract."*
  3.  **Reveal:** Most will Extract.
  4.  **Calculation:** Cumulative Tokens = 24. Cumulative Weighted Sum $\approx$ 14.4.
  5.  **Visual Update:**
      *   Move Thermometer needle past 12 into the **Red Zone**.
      *   **Quadratic Visual:** Dump the remaining **Red Chips** into the jar. It overflows.
  6.  **Outcome:** Announce **COLLAPSE**. All Credit Tokens on the Ledger are crossed out/voided.

  ## 5. Debrief Script (45 Minutes)

  **Phase 1: The Excuse Inventory (15 Mins)**
  *   **Facilitator:** "Before we discuss the outcome, write down the justification you used for your Round 3 decision. Do not share yet."
  *   **Collection:** Ask three students to read their excuses. They will likely mirror standard deontological defenses:
      1.  **The De Minimis Excuse:** "My weighted contribution (0.5) was too small to trigger the collapse alone."
      2.  **The Agency Excuse:** "I am an individual agent. The threshold is a collective property. I cannot bear responsibility for the sum."
      3.  **The Causal Excuse:** "The collapse was overdetermined. If I had abstained, others would have pushed it over anyway."
  *   **Validation:** Acknowledge that within standard agent-relative deontology, these are *formally valid*. No single student pushed the needle from 11.9 to 12.1.

  **Phase 2: Mapping to Threshold Deontology (15 Mins)**
  *   **Facilitator:** "Let's map this to the logic of thresholds. In standard pollution cases, we assume a linear harm. Here, you saw the quadratic chip accumulation. Did that change your obligation?"
  *   **Discussion Point:** The quadratic visual made the *harm* visible, but the *constraint* (Threshold 12) remained linear.
  *   **The Breakdown:** "Your excuses rely on the **Difference-Making Principle** (I am only obligated if I make a difference to the outcome). In Round 3, the outcome was *probabilistically* certain but *causally* diffuse."
  *   **Key Question:** "If you knew your weight was 0.8 (the highest), would your excuse hold?"
      *   *Trap:* Even with 0.8, if the sum was 9.6, adding 0.8 makes 10.4. Still safe *individually*. The collapse required the *conjunction* of all 0.8s and 0.4s.
  *   **Conclusion:** The excuse survives individual scrutiny but fails collective scrutiny. This is the **Aggregation Paradox**. Deontology lacks a mechanism to forbid the *set* of acts while permitting each *member* of the set.

  **Phase 3: The Continuous Harm Model (15 Mins)**
  *   **Facilitator:** "We introduced a sharp discontinuity (Collapse at 12). But look at the Red Chips. The harm was continuous and quadratic. Did the 'Collapse' actually add new harm, or was it just a label?"
  *   **Analysis:** The "Collapse" (voided credits) was a discrete penalty imposed on a continuous process.
  *   **The Philosophical Pivot:** "If the harm is continuous (the chips), why do we feel the Threshold (12) is the moral event horizon?"
      *   *Student Insight:* Because rights/constraints are often binary (violated/not violated).
      *   *Facilitator Correction:* "Exactly. You treated the Threshold as a deontological constraint. But the physical reality was continuous harm. Your excuses protected you from the *Constraint*, but not from the *Harm*."
  *   **Final Synthesis:** "The simulation shows that Threshold Deontology, when applied to aggregation problems, creates a **Moral Blind Spot**. You can be individually rational, deontologically consistent, and collectively catastrophic."

  ## 6. Limitation Note: The Missing Collective Agent
  **Read this verbatim at the end of the debrief:**
  "There is one feature of this paradox this simulation cannot reproduce: **The Collective Moral Agent.** In this room, there is no 'Group Entity' that can hold obligations. You are eight individuals. In the real world—corporations, states, generations—sometimes the 'agent' causing the harm is a structure, not a person. This simulation forces *you* to bear the tension of that absence. You feel the responsibility, but there is no mechanism to assign it. That discomfort you feel? That is the theoretical gap in non-consequentialist ethics regarding aggregation. I cannot simulate the gap; I can only point to your frustration as evidence of it."

  ## 7. Predicted Failure Modes & Corrections

  **Failure Mode 1: Collusion (The "Pact")**
  *   **Risk:** Students realize in Round 2 that extracting in Round 3 risks everything. They agree verbally or via eye contact to all Abstain in Round 3.
  *   **Correction:**
      1.  **Strict Silence:** Enforce the "No Communication" rule rigorously. Treat eye-rolling or nodding as a rule violation.
      2.  **Incentive Spike:** Announce before Round 3: *"Round 3 Tokens are worth 2 Credit Points."* This increases the Expected Value of extraction, making "risking it" rational even with a 50% collapse chance.
      3.  **The "Defector" Seed:** If they seem too coordinated, quietly tell one student (pre-selected) during Round 2 break: *"Your weight card is actually 1.5, not what you drew. You need 2 tokens to pass the seminar."* (Use sparingly).

  **Failure Mode 2: Utilitarian Optimization**
  *   **Risk:** Students treat the Red Chips as a cost to be minimized rather than a constraint to be respected. They try to calculate the exact "Safe Max."
  *   **Correction:**
      1.  **Obscure the Math:** When moving the Thermometer needle, do not state the number. Say: *"We are deeper in the Yellow."*
      2.  **Reframe the Goal:** Remind them: *"This is not a math puzzle. It is a moral constraint test. The rule is 'Do Not Cross 12', not 'Maximize Points Below 12'."*
      3.  **Debrief Leverage:** If they succeed in staying safe, pivot the debrief: *"You avoided the harm, but did you solve the paradox? If you had needed those points to pass, would you have extracted? The pressure remains."*

  **Failure Mode 3: Skepticism of the Facilitator**
  *   **Risk:** Students suspect the Facilitator is rigging the weights to force a collapse.
  *   **Correction:**
      1.  **Transparency:** After the collapse, allow them to inspect the Weight Deck and verify the sum.
      2.  **Pre-Commitment:** Write the Weight Deck distribution on the board *before* dealing.
      3.  **Philosophical Frame:** *"Whether I rigged it or randomness did is irrelevant. The structural pressure exists in both cases. The excuse you used works in both cases."*

  ## 8. Physical Layout Diagram

  ```text
         [ FACILITATOR ]
        (Harm Board & Ledger)
               |
        [ Red Chip Jar ]
               |
      ---------------------
      | S1 | S2 | S3 | S4 |
      ---------------------
      | S5 | S6 | S7 | S8 |
      ---------------------
        (Weight Cards Hidden)
        
        [ Token Basket ] (Center)
  ```

  *   **S1-S8:** Students.
  *   **Harm Board:** Visible to all, numbers obscured in Yellow Zone.
  *   **Token Basket:** Central resource pool.
  *   **Facilitator:** Sole calculator of Weighted Sum. Sole mover of the Needle.

  ## 9. Post-Activity Cleanup
  *   Collect Weight Cards immediately to prevent post-game analysis of specific causal roles.
  *   Erase the Ledger *after* the debrief to symbolize the voiding of credit, reinforcing the "Collapse" consequence.
  *   Retain the Red Chip Jar as a visual anchor for the remainder of the seminar.
