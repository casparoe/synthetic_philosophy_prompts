      *   Students think: "We might be at 10, we might be at 11. If we are at 10, we can extract 1 more unit (Weighted). My weight is 0.7. I am safe."
      *   This uncertainty allows the Round 3 extraction.
      *   Okay, this is the winning mechanic. Obscure the precise metric, reveal the trend.

  13. **Finalizing the Plan:**

      *   **Deck:** 8 Cards (0.4, 0.5, 0.5, 0.6, 0.6, 0.7, 0.7, 0.8). Sum = 4.8.
      *   **Threshold:** 12 Weighted Units.
      *   **Rounds:** 3.
      *   **Visual:** A "Harm Thermometer" marked 0-20.
      *   **Masking:** The Facilitator calculates the Weighted Sum secretly. The Thermometer shows the *Zone*.
      *   R1: Sum ~4.8. Needle in Green (0-8).
      *   R2: Sum ~9.6. Needle in Yellow (8-12).
      *   R3: Decision time. Needle is in Yellow.
      *   Students think: "Yellow means 8-12. We could be at 8.5. I can add 1.0."
      *   Reality: We are at 9.6. Adding 4.8 puts us at 14.4. Crash.
      *   This works. It creates the epistemic gap needed for the excuse.

  14. **Writing the Response:**

      *   Follow the prompt's structure.
      *   Tone: Professional, instructional, philosophical.
      *   Ensure all constraints are met.
      *   Check the "Limitation Note" regarding Collective Agency.
      *   Check "Failure Modes" (Collusion).

      *(Self-Correction during drafting)*: Wait, if the Facilitator calculates the sum secretly, how is the quadratic aggregation "visible in real time"?
      *   I can display the *Tokens* publicly (Linear) and explain the *Harm* is Quadratic.
      *   Visual: A grid where each token placed adds a *row* of chips equal to the total tokens so far.
      *   R1: 8 tokens. Add 8 chips. (Total 8).
      *   R2: 8 tokens. Add 16 chips. (Total 24).
      *   R3: 8 tokens. Add 24 chips. (Total 48).
      *   Threshold: 36 chips (representing 12 weighted units squared? No, keep it simple).
      *   Let's stick to the "Thermometer" for the Weighted Sum (Hidden precision) and the "Chip Grid" for the Quadratic Harm (Visible).
      *   This satisfies "visible quadratic aggregation" (the chips pile up faster) and "uncertainty" (the thermometer is vague).
      *   Actually, simpler: Just the Thermometer. The *explanation* is quadratic. The *visual* is the needle accelerating.
      *   R1: Needle moves slow.
      *   R2: Needle moves fast.
      *   R3: Needle moves very fast.
      *   This shows the non-linearity. The *numbers* are vague.
      *   Okay, ready to write.

      *(Final check on Threshold)*: Prompt says "exceeding twelve units". I will use 12.
      *(Final check on Weights)*: Sum 4.8 per round. 3 Rounds = 14.4. Exceeds 12. Perfect.
      *(Final check on Excuse)*: "My weight is 0.4. I contribute 0.4. The gap was unknown." Plausible.

      *(One last thing)*: Payoff.
      *   Tokens = Credit.
      *   Collapse = Credit Halved.
      *   This ensures they still want credit even if collapse is likely (Risk seeking).
      *   Or, Credit is awarded *before* collapse check. Collapse = "Moral Stain" + Credit Revoked.
      *   Let's go with Credit Revoked. It raises the stakes. I will address the collusion risk in the "Failure Modes" section as requested.

      *(Wait, one more check)*: "No prior game-theory background."
      *   Keep instructions simple. "Take a token or leave it."
      *   "Hidden number multiplies your token."
      *   "If total multiplied tokens > 12, everyone loses."

      *(Debrief Script)*: Needs to be tight. Map the excuses.
      1. De Minimis (I didn't make a difference).
      2. Agency (I'm not the group).
      3. Threshold (I didn't cross the line).
      Then dismantle them.

      *(Limitation)*: The simulation creates a *group* outcome, but the *responsibility* is individual. The paradox is that Deontology struggles with *overdetermination* or *thresholds* without a collective agent. I must state that the simulation cannot create a *Collective Agent* to blame, which is the point.

      *(Failure Mode)*: Collusion. "Let's all stop."
      *   Correction: "No talking rule." + "Secret Ballot." + "High incentive."
      *   Also, if they stop, the debrief changes (Success vs Failure of coordination). I need to design for the Collapse scenario as primary. I will add a "Random Shock" rule if they coordinate too well? No, that breaks trust.
      *   Better: Emphasize in the briefing that "Communication is prohibited to simulate real-world pollution conditions."

      Okay, ready to generate.
