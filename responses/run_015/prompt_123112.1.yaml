answer: |-
  Here are 10 interview questions designed to press the machinery of Dr. Reisz's Stewardship View, complete with follow-ups tailored to her likely deflections.

  **1. The Foundation of the Risk Pool**
  You ground the permission to kill in a distributive requirement rather than liability: combatants bear the risk because they voluntarily took on the role of the community's instrument. Revisionists argue that voluntarily contributing to a wrongful threat *is* what makes one liable. If the "voluntary role-occupancy" is doing the work here, what prevents this from just being liability under a different name?

  *   **Follow-up:** She will likely reply that role-occupancy is about social function, not moral desert. Press her: "If I voluntarily take on a role that I know will impose lethal risks on others, and I am not liable for those risks, what moral magic does the 'role' perform that my responsibility for the threat does not? Why is the label 'stewardship' doing any heavy lifting other than avoiding the word 'liability'?"

  **2. The Civilian Complicity Worry**
  On your view, the costs of war fall on combatants rather than civilians because combatants are the instruments. But in a democracy, civilians vote for leaders, fund the military, and often cheer the war. They are the principals; the soldiers are just the agents. Why aren't civilians who actively sustain the war effort inside the same risk pool as the soldiers they deploy?

  *   **Follow-up:** She will likely say civilians aren't the "direct instruments" of force. Press her: "If the distributive requirement is about who *decided* to settle the dispute by force, excluding the voters and politicians looks like an arbitrary firewall. If you include them in the risk pool, your view collapses into a form of collective liability; if you exclude them, you seem to be protecting the people most responsible for the danger. Which horn do you take?"

  **3. Aggressor Permissions and Deontic Constraints**
  You argue the distributive requirement holds regardless of whether the war is just, and you say the constraint against killing civilians is deontic, not aggregative. But if an aggressor state's decision to use force is unjust, how does that internal decision generate a *permission* for its soldiers to kill enemy combatants at all? How does an unjust cause create a deontic shield for its own instruments?

  *   **Follow-up:** She will likely say the permission is internal to the community's decision. Press her: "That sounds like you're granting moral force to a wrongful command. If the war is unjust, the enemy combatants aren't liable. If your soldiers aren't liable, and the enemy aren't liable, and the cause is unjust, you're describing a scenario where two non-liable people are permitted to kill each other solely because their bosses said so. How is that not just the Walzerian convention you claim to be revising?"

  **4. The Epistemic Notice Threshold**
  The Exit Condition relies on "epistemic notice"—evidence such that a reasonable soldier would judge the war probably unjust. In modern wars, intelligence is filtered and soldiers know nearly nothing. If the bar for notice is high, your view is just Walzer's equality; if the bar is low, it's just McMahan's asymmetry. Where does the "reasonable soldier" standard actually land, and isn't the middle band where your view exists effectively empty?

  *   **Follow-up:** She will likely say it depends on the specific conflict. Press her: "If it depends on the conflict, then in a blatant war of conquest, your view *is* revisionist asymmetry. In a foggy conflict, it *is* traditional equality. If your theory only offers a third option in a narrow set of cases where evidence is mixed but accessible, have you really solved the equality debate, or just described a specific transitional phase between Walzer and McMahan?"

  **5. Killer Knowledge and Answerability**
  You say killing a combatant who has failed the Exit Condition is "answerable"—the killer owes compensation and apology. But does the killer need to *know* that the target had epistemic notice? If I kill a sleeping soldier without knowing he received notice, do I still owe his family an apology?

  *   **Follow-up:** She will likely say the debt is objective. Press her: "If I owe an apology for a killing I was permitted to do, without knowing the specific conditions that made it answerable, how is this distinct from the standard treatment of 'innocent threats'? If I kill an innocent threat, I may owe compensation, but I don't usually owe an apology for a *permitted* act. By insisting on the apology, aren't you admitting the act was morally tainted, which brings us back to liability?"

  **6. The Just Side's Exit**
  Does a soldier on the *just* side lose protected status if they receive notice of their own side's atrocities and refuse to quit? If a US soldier sees a war crime and stays, do they lose their stewardship protection?

  *   **Follow-up:** She will likely say yes, status is tied to the exit condition, not the side. Press her: "If soldiers on both sides can lose status via notice, then in a dirty war where both sides commit atrocities, everyone loses protected status. Everyone becomes killable, even asleep in barracks. That isn't the 'Moral Equality of Combatants' that traditionalists want to preserve; that's universal liability. Have you actually saved equality, or just universalized the revisionist asymmetry?"

  **7. Asymmetric Exit Costs**
  Your Exit Condition relies on the availability of exit—surrender, refusal, desertion. But soldiers in authoritarian armies face execution or family punishment if they desert, while soldiers in liberal democracies do not. On your view, the harder the exit, the higher the protection. Does this mean soldiers in the worst, most aggressive regimes are the *hardest* to permissibly kill?

  *   **Follow-up:** She will likely say protection tracks the difficulty of exit. Press her: "This inverts the intuitive link between justice and protection. You're suggesting a Nazi soldier is *more* protected than a US soldier because his exit costs are higher. If the Stewardship View makes the soldiers of tyrants more morally shielded than the soldiers of democracies, haven't you created a perverse incentive structure that rewards coercive regimes?"

  **8. The Nature of Equality and Excuse**
  You distinguish your view from revisionism by saying the combatant isn't liable, just subject to risk-shifting with answerability. But if I am permitted to kill you, yet I owe your family an apology and compensation, isn't that functionally identical to the revisionist claim that I am 'acting wrongly but excused'? Is 'permission-with-answerability' just 'wrong-but-excused' with extra semantic steps?

  *   **Follow-up:** She will likely say the metaphysical status is different. Press her: "For the dead combatant and the grieving family, the practical outcome is identical: they were killed by someone who admits a moral debt. If the 'equality' you offer doesn't change the phenomenology of the killing or the aftermath, what work is the concept of 'non-liable permission' doing other than soothing the conscience of the killer?"

  **9. Remote Instruments and Risk**
  Where does a drone operator sit in your risk pool? They are voluntary instruments of the community's force, but they assume no physical risk themselves. If stewardship is about distributing the *costs* of war, does the operator's safety exclude them from the pool, or does their instrumentality include them?

  *   **Follow-up:** She will likely say they are instruments regardless of physical risk. Press her: "If they are in the pool, they can be permissibly killed. But they are often thousands of miles away, posing no immediate threat. If your view permits killing a drone operator asleep in Nevada because they failed an Exit Condition, you are endorsing long-range assassination of non-threats. Is that a cost you're willing to accept to keep the distributive story consistent?"

  **10. Falsifiability**
  Finally, Dr. Reisz, philosophical views often retreat when pressed. What specific piece of evidence, or what specific intuitive case, would actually count *against* the Stewardship View for you? If you found yourself agreeing with McMahan that liability is the only ground for killing, or with Walzer that the convention is absolute, what would have to happen to change your mind?

  *   **Follow-up:** (None — let this stand as the closing challenge). "I ask because if the answer is 'nothing could change my mind,' then the Stewardship View isn't a theory of justice, but a framework for rationalizing any outcome. I'd like to know where the line is."
