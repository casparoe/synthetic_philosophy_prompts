answer: |-
  # ADVERSARIAL COLLABORATION PROTOCOL: VAGUENESS SEMINAR
  **Participants:** Epistemicist Camp (EC) | Supervaluationist Camp (SC)
  **Date:** [Insert Date]
  **Status:** Pending Sign-off

  ## 1. COMMON GROUND (THE BASELINE)
  *The following claims are endorsed by both EC and SC. They serve to distinguish our joint position from Degree Theories (Fuzzy Logic), Ontic Vagueness, and Eliminativist/Stipulationist approaches.*

  1.  **Rejection of Truth Degrees:** Neither camp accepts that truth comes in degrees (e.g., 0.7 true) nor that there is a third truth-value (e.g., "indeterminate") that functions as a standard truth-value in logic. Truth is binary at the fundamental level of evaluation.
  2.  **Higher-Order Vagueness is Real:** Vagueness is not eliminated by introducing a "definitely" operator. There are borderline cases of "definitely tall," and this hierarchy does not terminate abruptly. Any adequate semantics must model the vagueness of the boundary itself, not just the primary boundary.
  3.  **The Sorites Pressure:** Both camps agree that the Sorites paradox presents a genuine theoretical crisis. We agree that the inductive premises are strongly assertible (in ordinary contexts) and the conclusion is false. We agree that a solution must explain *why* the premises are assertible without accepting the conclusion.
  4.  **The "Definitely" Operator:** Both camps agree that a formal operator $D$ (for "definitely" or "determinately") is required to model vague discourse. Both agree that $D$ is not factive in the sense that $Dp \to p$ holds, but $p \to Dp$ fails.
  5.  **Classical Logic (Qualified):** Both camps aim to preserve classical logic for non-vague discourse and for "supertrue" or "determinately true" claims. We disagree on whether classical logic holds unrestrictedly for vague sentences *simpliciter*, but we agree it should be preserved as much as possible.
  6.  **Semantic, Not Ontic:** Both camps treat vagueness as a feature of language/representation rather than a feature of the world. Objects are not vague; predicates are.

  ---

  ## 2. DISAGREEMENTS MATRIX
  *Three core cruxes where our positions diverge. Each row includes a neutral statement of the issue, a charitable formulation of each position, and a specific test case with pre-registered predictions.*

  | Crux | Epistemicist Camp (EC) Position | Supervaluationist Camp (SC) Position | Shared Test Case & Pre-Registered Predictions |
  | :--- | :--- | :--- | :--- |
  | **1. The Metaphysics of Borderlines** | **Hidden Sharpness:** For any vague predicate $F$ and object $x$, either $Fx$ or $\neg Fx$ is true. Borderline cases are true or false, but knowledge is blocked by a principled margin-for-error constraint. | **Truth-Value Gaps:** For borderline $x$, neither $Fx$ nor $\neg Fx$ is true. There is no fact of the matter. Truth is defined as "supertruth" (true on all admissible precisifications). | **Case: The Envelope Predicate**<br>A predicate $E$ is defined by a coin flip in a sealed room. The result is fixed but unknown.<br><br>**EC Prediction:** Intuitions about $E$ will match intuitions about "tall." Speakers will agree there *is* a fact of the matter, even if unknowable. "Tall" is relevantly identical to $E$.<br>**SC Prediction:** Intuitions will diverge. Speakers will treat $E$ as having a hidden fact, but treat "tall" as lacking a fact. "Tall" is *not* like $E$; $E$ has one extension, "tall" has many. |
  | **2. The Source of Indeterminacy** | **Ignorance of Use:** Indeterminacy arises because we cannot know exactly how our usage patterns map to extensions in the world. The meaning is fixed; our access is limited. | **Incompleteness of Meaning:** Indeterminacy arises because meaning is underdetermined. There are multiple equally admissible extensions compatible with usage. The meaning is not fixed. | **Case: The Split-Usage Community**<br>Half a community uses "tall" (180cm+), half (185cm+). Everyone knows this. No deference.<br><br>**EC Prediction:** This is ambiguity or a sociological fact fixing a single cutoff (e.g., the disjunction). Resolving the sociology resolves the vagueness. It is a defect of the specific community, not vagueness *per se*.<br>**SC Prediction:** This is the literal mechanism of vagueness. The "admissible precisifications" *are* the two sub-community usages. Vagueness persists even with full sociological knowledge. |
  | **3. Logic and Validity** | **Classical Preservation:** Classical logic holds unrestrictedly. Modus Ponens and Conditional Proof are valid. The Sorites fails because a premise is false (though unknowably so). | **Super-validity:** Classical tautologies hold, but some inference rules (e.g., Conditional Proof, or reasoning from $p$ to $Dp$) fail when defined as preservation of *supertruth*. The Sorites fails because validity requires truth-preservation across *all* precisifications. | **Case: Iterated Definiteness**<br>Consider the inference: $p \vdash DDp$.<br><br>**EC Prediction:** This inference is invalid (we can be ignorant of our ignorance), but the logic governing $D$ is classical modal logic (e.g., S4 or S5 variants). Truth values remain stable.<br>**SC Prediction:** This inference highlights the instability of the "admissible set." As we iterate $D$, the set of precisifications shrinks. The logic may require non-standard rules to prevent collapse. |

  ---

  ## 3. DIAGNOSIS OF POTENTIAL VERBAL DISPUTE
  *We suspect a portion of our disagreement stems from divergent definitions of key theoretical terms rather than substantive metaphysical differences. We identify the following stretches of argument as liable to be merely verbal:*

  **A. The Definition of "True"**
  *   **The Suspicion:** When EC says "The borderline case is True," they mean *True-at-the-actual-extension*. When SC says "The borderline case is Not True," they mean *Not Supertrue* (not true on all precisifications).
  *   **The Test:** If we replace "True" with "True-at-the-actual-extension" in EC claims and "Supertrue" in SC claims, does the disagreement vanish?
  *   **Action:** In future sessions, we must specify whether we are discussing *disquotational truth*, *correspondence truth*, or *supertruth*. If EC admits borderline claims are not *supertrue*, and SC admits they are *true-at-some-precisifications*, we may find we agree on the model and disagree only on which property deserves the label "Truth."

  **B. The Role of Semantics**
  *   **The Suspicion:** EC treats semantics as modeling the *competent speaker's knowledge conditions* (hence ignorance is the key). SC treats semantics as modeling the *reference of the terms* independent of knowledge (hence incompleteness is the key).
  *   **The Test:** Do we disagree about how language works, or about what the job of a semantic theory is?
  *   **Action:** We will explicitly state whether a proposed counterexample targets the *linguistic data* (what speakers say) or the *theoretical machinery* (how the model explains it).

  **C. "Determinacy" vs. "Necessity"**
  *   **The Suspicion:** Our formulations of the "Definitely" operator ($D$) may conflate semantic determinacy with metaphysical necessity.
  *   **The Test:** If $Dp$ is interpreted as "p is true on all admissible precisifications" (SC) vs "p is true and margin-for-error safe" (EC), are these extensionally equivalent in all possible worlds?
  *   **Action:** We will attempt to construct a Kripke model where the two definitions diverge. If we cannot, the dispute regarding the logic of $D$ is likely verbal.

  ---

  ## 4. NEXT STEPS & RULES OF ENGAGEMENT
  1.  **No Sorites Re-runs:** We will not reconstruct the Sorites paradox unless it is to test a specific logical rule in Section 2, Row 3.
  2.  **Pre-Registration:** Before discussing the *Envelope* or *Split-Usage* cases, we will write down our intuitive verdicts and compare them only after both are recorded.
  3.  **Verbal Check:** At any point, either party may call "Verbal Check." The discussion pauses to determine if the current disagreement is about the world/language or about the label "True."
  4.  **Goal:** The objective is not conversion, but a precise mapping of the cost-benefit analysis of each view. We aim to produce a joint summary stating: "EC buys X to save Y; SC buys A to save B."

  **Signatures:**

  _________________________ (Epistemicist Camp)

