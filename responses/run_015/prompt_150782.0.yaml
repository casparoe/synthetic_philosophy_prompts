      *   *Self-Correction on Logic:* Supervaluationism preserves classical tautologies but fails some inference rules (like conditional proof) if defined via truth-preservation. Epistemicism keeps everything classical. This is a good crux.

  6.  **Final Polish:** Ensure the "Predictions" in the table are concrete. For the Envelope case, the prediction isn't about the coin, but about the *linguistic intuition* regarding the predicate. For Split-Usage, it's about whether the vagueness resolves upon learning the sociology.

      *(Self-Correction during drafting the Verbal Dispute section)*: Be careful not to dismiss the dispute as *merely* verbal. The prompt asks to name it if it exists, not to dissolve the whole debate. It's likely a mix of substantive and terminological.

      *(Refining the Envelope Case)*: The prompt says "Everyone in the group agrees that predicate [Envelope] is sharp-but-unknown". The fight is whether "tall" is *like* it.
      *   Epi: Yes, relevantly similar.
      *   Super: No, "tall" lacks a fact of the matter, Envelope has one.
