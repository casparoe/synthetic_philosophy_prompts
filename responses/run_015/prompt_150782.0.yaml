      *   *Constraint Check:* Did I include the Envelope and Split-Usage cases? Yes. Did I avoid reading suggestions? Yes. Did I avoid picking a winner? Yes.
      *   *Formatting:* Use clear headers, numbered lists, and a table for the disagreements.
