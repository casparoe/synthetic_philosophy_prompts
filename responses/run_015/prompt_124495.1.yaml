answer: |-
  This is an exceptionally sharp observation. You have identified a tension that lies at the very heart of the interpretive debate surrounding *On Certainty* (OC), specifically between the *logical* status of hinges (as rules/grammar) and their *dialectical* deployment in argumentation.

  To answer your primary question directly: **No, there is no single established term in the Wittgensteinian literature that precisely captures this specific, unacknowledged oscillation.** While concepts like "epistemic contextualism" (Michael Williams), "entitlement" (Crispin Wright), and "non-propositional hinges" (Danièle Moyal-Sharrock) address the *status* of these commitments, none of them name the *maneuver* of temporarily treating a hinge as a move within the game to protect its status as a rule of the game, followed by an immediate, unmarked reversion.

  Given the precision required for your seminar, I propose we coin the term **"Hinge Shuttling"** (or more specifically, **"Unmarked Hinge Shuttling"**).

  Below is a detailed carving of this concept, distinguishing it from nearby philosophical categories, and analyzing what it implies for the nature of doubt and justification in Wittgenstein's framework.

  ---

  ### 1. Definition: Hinge Shuttling

  **Hinge Shuttling** is the dialectical maneuver wherein a speaker temporarily treats a hinge commitment (a framework proposition exempt from doubt, e.g., "The earth has existed for more than five minutes") as an empirical claim subject to evidential verification, in order to refute a skeptical hypothesis, and subsequently reinstates it as a hinge commitment without acknowledging the shift in epistemic status or adjusting the proposition's justification conditions.

  **The Structure of the Shuttle:**
  1.  **Lock:** The proposition $P$ is held as a hinge (scaffolding).
  2.  **Release:** A skeptical scenario $S$ is introduced that entails $\neg P$.
  3.  **Evaluation:** The speaker argues against $S$ by treating $P$ as an empirical conclusion supported by evidence (e.g., "Geological records make $S$ improbable").
  4.  **Snap-Back:** Having dismissed $S$, the speaker treats $P$ once again as a presupposition of the inquiry, ignoring the fact that $P$ was just treated as a conclusion derived from evidence.

  ### 2. Taxonomic Boundaries: What It Is Not

  To ensure this concept does not collapse into existing categories, we must distinguish it from three nearby phenomena.

  #### A. vs. Epistemic Contextualism
  *   **Contextualism (e.g., Williams, Annis):** Argues that the *standards* for knowledge attribution shift depending on the conversational context. In a "high stakes" skeptical context, $P$ might not count as known; in an "ordinary" context, it does.
  *   **The Difference:** Contextualism *acknowledges* the shift. It admits that the proposition changes status relative to the context. **Hinge Shuttling** is characterized by the *lack of acknowledgement*. The speaker acts as though $P$ has the same logical grammar throughout the argument, even though they have treated it as empirical in step 3 and transcendental in step 4. It is a *performative* inconsistency that contextualism seeks to *resolve* theoretically.

  #### B. vs. Cartesian Methodological Doubt
  *   **Cartesian Doubt:** Hyperbolic doubt is a tool to strip away beliefs to find an indubitable foundation. It treats everything as empirical until proven otherwise.
  *   **The Difference:** Cartesian doubt seeks to *discard* the doubtful. Hinge Shuttling uses doubt *instrumentally* to *preserve* the commitment. The Cartesian wants to see if $P$ survives the fire; the Hinge Shuttler uses the fire to burn away the skeptic, assuming $P$ will survive because it is the fireproof structure holding the fireplace together.

  #### C. vs. Plain Equivocation
  *   **Equivocation:** A fallacy where a term changes meaning mid-argument, usually unintentionally or deceptively, undermining validity.
  *   **The Difference:** Equivocation is a defect. Hinge Shuttling may be a **pragmatic necessity**. In Wittgenstein's view, we often cannot articulate the rules of a language-game without momentarily stepping outside them and treating them as moves. If we never treated hinges as empirical claims, we could never argue against skeptics who demand empirical grounds. The "shuttle" is the cost of engaging the skeptic in their own language while maintaining a Wittgensteinian posture.

  ### 3. The Nature of the Doubt: Simulated vs. Genuine

  You ask: *Does the temporary suspension count as genuine doubt or merely a simulated move within the language-game?*

  On a strict reading of *On Certainty*, this must be classified as **simulated doubt** (or "paper doubt").

  *   **Wittgenstein's Criterion for Real Doubt:** "If you tried to doubt everything you would not get as far as doubting anything. The game of doubting itself presupposes certainty" (OC §115). Real doubt requires *grounds* (OC §121).
  *   **The Shuttle as Grammar:** When the speaker weighs the "probability" of the earth being five minutes old, they are not engaging in genuine empirical inquiry. They are engaging in a **grammatical investigation** disguised as an empirical one. They are showing that the *sense* of the skeptical hypothesis is defective because it cannot integrate with the rest of the "system" (OC §142).
  *   **Why it looks like evidence:** The "evidence" cited (geological records, memory coherence) only counts as evidence *because* the hinge is already in place. To treat the hinge as the *conclusion* of that evidence is a circularity that Wittgenstein accepts as part of the "circle of propositions" (OC §105). The shuttle exposes this circle but does not break it.

  ### 4. The Implication: Is the Hinge Truly Outside Justification?

  This is the crux of your seminar problem. Does Hinge Shuttling prove that hinges are just very well-confirmed empirical beliefs (the Quinean reading), or does it show the game can be suspended and resumed?

  **Argument for the Wittgensteinian View (The Snap-Back Test):**
  The decisive factor is the **reversion**.
  *   If $P$ were truly an empirical claim, subjecting it to evidential testing would leave it vulnerable to revision. If new evidence arose, $P$ would be downgraded.
  *   In Hinge Shuttling, $P$ **snaps back** to immunity immediately after the skeptical threat is neutralized. The speaker does not say, "Well, the evidence strongly supports $P$, so I'll keep it for now." They say, "It is certain that $P$."
  *   This snap-back indicates that the evidential evaluation was **parasitic** on the hinge status, not constitutive of it. We used the "empirical" arguments only because we already held $P$ as a hinge.

  **Therefore:** Hinge Shuttling does not show that hinges are inside the game of justification. It shows that **the boundary between rule and move is porous in discourse but rigid in practice.** We can *talk about* the riverbed as if it were water (to explain why the water flows where it does), but we cannot *swim* in it.

  ### 5. Suggested Terminology for Your Seminar

  When presenting this, I recommend using the term **"Hinge Shuttling"** but framing it through Wittgenstein's **"Riverbed" analogy (OC §96-99)**.

  *   **The Riverbed:** The hard rock (hinges) vs. the flowing water (empirical claims).
  *   **The Shuttle:** The phenomenon where we temporarily treat the rock as if it were flowing water to explain why the stream doesn't flood, then treat it as rock again once the flood threat is passed.
  *   **The Philosophical Payoff:** This maneuver reveals that "certainty" is not a mental state or a high probability score; it is a **functional role**. Hinge Shuttling is the discursive mechanism by which we police the boundary of that role.

  ### 6. Summary for your Argumentative Map

  | Feature | Hinge Shuttling | Epistemic Contextualism | Cartesian Doubt | Equivocation |
  | :--- | :--- | :--- | :--- | :--- |
  | **Status of $P$** | Toggles (Rule $\to$ Move $\to$ Rule) | Shifts with Context | All Moves (until Foundation) | Unnoticed Shift |
  | **Acknowledgement** | **None (Unmarked)** | Explicit | Explicit | None (Fallacious) |
  | **Goal** | **Preserve Framework** | Explain Knowledge Attributions | Find Foundation | (None/Error) |
  | **Outcome** | **Snap-Back to Certainty** | Variable Standards | Radical Skepticism/Foundationalism | Invalid Argument |
  | **Wittgensteinian Status** | **Simulated Doubt** | Compatible (Williams) | Rejected (OC §1) | N/A |

  ### Conclusion

  The phenomenon you are tracking is **Hinge Shuttling**. It is not a failure of reasoning (equivocation) nor a shift in truth conditions (contextualism). It is a **grammatical maneuver** necessitated by the fact that we cannot defend the scaffolding of our thought without momentarily leaning on it as if it were part of the building.

  The fact that the hinge is evaluated by evidential criteria inside the hypothetical does **not** show it was never outside the game of justification. Rather, it shows that **the game of justification presupposes the hinge so thoroughly that we can mimic the game's moves *using* the hinge without actually subjecting the hinge to the game's risks.** The "snap-back" to immunity is the proof that the hinge was never truly at risk; the evidential weighing was a rhetorical performance within the language-game, not a test of the language-game itself.
