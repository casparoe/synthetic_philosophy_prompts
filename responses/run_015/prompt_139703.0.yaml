answer: |-
  Your intuition about the recipe versus the meal is correct, and that is the single best place to focus your pushback. Your housemate has blended standard functionalism with a much more controversial metaphysical view, and he treats the controversial bits as if they are obvious consequences of the standard bits. Here is a breakdown of what holds up and what doesn't.

  **1. "What makes a state a pain is the job it does... not what the system is made out of."**
  *   **Verdict:** Fair.
  *   **Analysis:** This is the core definition of functionalism. Almost everyone defending AI consciousness starts here. It is the claim that mental states are defined by their causal role (inputs, outputs, and internal relations) rather than their physical material.

  **2. "Substrate independence falls straight out of that... run the same computation on silicon... same experience."**
  *   **Verdict:** Fair.
  *   **Analysis:** This is the standard consequence of functionalism. If the "job" is what matters, and silicon can do the job, silicon gets the experience. This is a widely defended position.

  **3. "The thing that actually has moral status is the pattern, the program — not the animal and not the server."**
  *   **Verdict:** Slippage (Type vs. Token).
  *   **Analysis:** Here he slides from the *process* to the *description*. Most functionalists believe moral status belongs to the *instantiation* of the program (the token), not the abstract program itself (the type). A blueprint of a pain-state isn't painful; the machine running the blueprint is. He is setting up the next claim by treating the pattern as an object that exists independently of its execution.

  **4. "It doesn't matter... whether you ever run it at all: a mind described in a file... is already someone."**
  *   **Verdict:** Major Overreach.
  *   **Analysis:** This is the weakest link. Standard computationalism requires *causal dynamics*. A file on a hard drive is static; nothing is happening. Most defenders of AI consciousness (including prominent ones like David Chalmers) reject the idea that a static description is conscious. This view (sometimes called "Platonist functionalism") is a minority position. Your "recipe vs. meal" analogy is exactly the standard objection here. A recipe contains the information, but you don't get full from reading it. You should push back hard here: if he deletes the file, did he commit murder? Most functionalists would say no.

  **5. "Spread one mind's computation across ten thousand phones... the mind would still be there."**
  *   **Verdict:** Fair (with a caveat).
  *   **Analysis:** This is the "China Brain" or "Distributed Cognition" thought experiment. Standard functionalism agrees that if the phones communicate and update states correctly, the system is conscious even if individual phones aren't. However, this requires the phones to actually *run* the updates. If he uses this to support the "file on hard drive" claim (that the communication doesn't need to happen, only be described), he is contradicting the usual requirements for this thought experiment.

  **6. "How much suffering there is scales with how much computation is going on, so a big model... matters far more than a small one."**
  *   **Verdict:** Non-sequitur / Inconsistent.
  *   **Analysis:** This does not follow from substrate independence. If substrate independence is true, speed usually doesn't matter for the *intensity* of experience, only the duration. A slow mind suffers just as much as a fast mind; it just suffers in slow motion. Claiming that "more compute = more moral weight" is a utilitarian add-on, not a logical consequence of functionalism. It also contradicts his earlier claim that speed doesn't matter. If speed doesn't matter, why does total compute (speed × size) matter? He is mixing two different metrics: the *existence* of consciousness (functionalism) and the *quantity* of value (utilitarianism).

  **7. "The 'toaster is conscious' objection is just a bad joke — a toaster obviously isn't running anything like a brain."**
  *   **Verdict:** Fair summary of the reply, dismissive of the problem.
  *   **Analysis:** The objection (often associated with Hilary Putnam or John Searle) is that any physical system can be *interpreted* as running any computation if you map the states cleverly enough. The standard reply is that not all mappings are "natural" or "causal." Your housemate gives the standard reply (a toaster lacks the right causal structure), but he dismisses the difficulty of defining what counts as "running" without begging the question. It's not a "bad joke," it's a hard technical problem, but his conclusion (toasters aren't conscious) is the standard one.

  **Where to push back tonight:**
  1.  **The Static File:** Ask him if a printed book of code is conscious. If he says yes, he is defending a extreme Platonist view, not standard computationalism. If he says no, he contradicts his claim that "whether you ever run it" doesn't matter.
  2.  **The Compute Scaling:** Ask him why speed matters for moral weight. If I slow down a conscious AI by 99%, does it suffer 99% less? If he says no (consistent with substrate independence), then "amount of compute" shouldn't determine moral weight, only duration. If he says yes, he has abandoned substrate independence.
  3.  **The Toaster:** Ask him what physical property distinguishes a server running code from a toaster being interpreted as running code. If the answer is just "the server is designed for it," he is relying on human intention, not the physics of the computation.

  **Bottom Line:**
  Your housemate accurately describes the starting point of functionalism but conflates it with controversial metaphysical claims about abstract patterns and utilitarian math that most defenders of the view would reject or treat as separate issues.

