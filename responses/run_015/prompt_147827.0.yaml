prompt: |-
  I'm a novelist and next month I'm giving the annual Ethics and Public Life lecture at a university I won't name — forty minutes, then twenty of questions, and the chair has already told me he'll cut me off at forty-five. My new novel is about a woman who monitors Japanese shortwave broadcasts for the US censors in San Francisco in 1945 while her brother flies B-29s out of Tinian, so I've been living inside this material for three years, and I've got a thesis I want to put on the table rather than just read an extract and take softball questions.

  Here's roughly what I'm arguing, so you know what they'll be aiming at.

  One, Anscombe was right, in the fuss she made when Oxford voted Truman an honorary degree in the mid-fifties, that the bombing was murder, and right about *why*: the whole "it shortened the war / it was the least bad option" framing is a way of declining to let the action be described truly. It answers a different question than the one asked. I call this the grammar of exemption in the book — the first-person plural ("we had no choice"), the counterfactual body count, the passive voice, all doing the work that a justification should be doing.

  Two, my test, which I want to be the engine of the talk: the empty city. If the target were an arsenal or a troop concentration, and the people in it were miraculously gone, the mission would still have succeeded — better, in fact. Now ask the same question about Hiroshima: the city evacuated overnight, the same bomb, the same blast, the same rubble, nobody in it. Does the mission still count as what it was for? I say no, it fails, and that tells you the deaths were what was aimed at and not an unfortunate side effect of hitting a real target.

  Three — and this is where I go past her, and the part I most need help defending — I don't think the intended/foreseen distinction actually has room for the wrong that's in play, especially on the second bomb, three days later. Those deaths weren't only a means to a surrender. They were also an utterance. Someone was being said something to: the Emperor, the Supreme Council, and, I'd argue, Moscow, which had declared war on Japan the day before. So I want a third category alongside intended and merely foreseen, which I've been calling addressive killing: killing a person partly in order to say something to somebody else, using a death as a sentence in a language the intended audience can read. My claim is that this is worse than plain murder in one respect — the victim isn't even being removed because of what she's doing, she's being used as a medium, as a kind of sign — and that a framework built only on intention either misdescribes it as a side effect or flattens it into ordinary murder and loses what's distinctive about it.

  Now the room. I need to be ready for *this* room, not for a book festival audience:

  - Two or three analytical Thomists / neo-Aristotelians who work on Anscombe and her circle. They'll be glad someone is defending her and they will hate my third category. I expect them to say that double effect already handles everything I'm pointing at, and that adding categories is what happens when a novelist reads *Intention* once.
  - A bigger block of revisionist just-war philosophers, the liability-and-individual-responsibility crowd, some of them fairly utilitarian. Their instinct will be that intention talk is pre-revisionist machinery, that the only real question is whether those civilians were liable to be killed, and that my empty-city test is a clever way of asking a question that doesn't matter.
  - Two historians of the Pacific War. One works on the Japanese side and will correct my chronology and my targeting details — I think I have right that the first bomb and the second were treated as a continuing operation rather than two fresh decisions, and that the Soviet entry into the war matters as much as either bomb, but I'm not confident and I'd rather be told now than from the floor. The other is hostile to the whole "atomic diplomacy" reading — that the bombs were aimed at Moscow as much as at Japan — and I gather thinks it's a tired 1960s argument that the archives don't support. If my whole third category rests on that reading, I need to know how much of it I can drop and still have a category.
  - One or two international-law types who will say that deliberately attacking a city is already a war crime and that "addressive killing" is unusable in law, so what exactly am I adding.
  - And then the public who turn up to these things. There's always someone whose father was in the invasion force and who will want to know whether I'm calling him a murderer.

  I did one term of moral philosophy as an undergrad and dropped it, so they will smell blood the second I misuse a term.

  What I want from you is a Q&A prep sheet, not a defense of my position. Give me the objections I'll actually get, ordered by how likely they are and how much damage they'd do, each phrased the way that particular person would phrase it — I want the Thomist objection to sound like a Thomist and the historian's to sound like a historian, not a generic list of "some might object." For each one: a two-minute answer I could actually give standing up, and an honest note on where that answer is soft. Tell me what I should concede in the first five minutes to take the wind out of them, and what I must not concede because the talk collapses without it. Tell me which single reply has to land. And flag anywhere I'm likely to get a term wrong or overstate a historical claim, because I definately will.

  The question I'm hoping nobody asks, by the way, isn't from the panel. It's from the floor: if Nagasaki is addressive killing, then what is the firebombing of Tokyo, and why did nobody — including Anscombe — call that murder at the time? I don't have a good answer to that one and I'd like to.
reasoning: |-
  Here's a thinking process that leads to the suggested Q&A prep sheet:

  1.  **Analyze the User and Request:**
      *   **User:** A novelist (serious, researched, 3 years in the material) giving an academic lecture ("Ethics and Public Life").
      *   **Topic:** Ethics of the atomic bombings (Hiroshima/Nagasaki), specifically challenging standard justifications via an "empty city" test and proposing a new category: "addressive killing."
      *   **Core Arguments:**
          1.  Anscombe was right (bombing = murder, "grammar of exemption" masks this).
          2.  "Empty City" test (if people vanish, mission fails -> people were the target).
          3.  "Addressive Killing" (killing as communication to a third party, distinct from intended/foreseen).
      *   **Audience:** Mixed academic/public. Specific threats: Thomists/Anscombe scholars, Revisionist Just-War theorists (liability/utilitarian), Pacific War Historians (chronology/atomic diplomacy), International Lawyers, Public (veterans' families).
      *   **Goal:** A Q&A prep sheet. *Not* a defense of the position, but a strategic guide to handling objections.
      *   **Requirements:**
          *   Objections phrased in the specific voice of the detractor (Thomist, Historian, etc.).
          *   Ranked by likelihood/damage.
          *   2-minute spoken answers for each.
          *   "Soft spot" analysis for each answer.
          *   Concessions to make early (to disarm) vs. Concessions to avoid (talk collapses).
          *   The "Single Reply" that must land.
          *   Terminology/Historical fact-checking (flag errors).
          *   Address the "Tokyo Firebombing/Anscombe Silence" question (the user's weak point).

  2.  **Deconstruct the Arguments & Identify Vulnerabilities:**
      *   *Anscombe/Thomist:* They love the "murder" claim but hate the "new category." Double Effect (DDE) is their hammer. They will say "addressive killing" is just *intended* as a means, so DDE already covers it.
      *   *Revisionist Just-War:* They reject intentionality as the moral pivot. Liability is key. If civilians aren't liable, it's wrong, regardless of *why*. "Addressive" is metaphysical fluff.
      *   *Historians:* Chronology is tricky. Soviet entry (Aug 8) vs. Hiroshima (Aug 6) vs. Nagasaki (Aug 9). The "Moscow signal" theory (Gar Alperovitz et al.) is contested. If the "addressive" argument relies *too* heavily on signaling Moscow, it's historically shaky.
      *   *Lawyers:* War crimes are defined by acts (targeting civilians), not internal mental states or communicative intent. "Addressive" adds nothing to legal liability.
      *   *Public/Veterans:* Emotional charge. "Are you calling my dad a murderer?" Needs empathy but firmness.
      *   *Tokyo Firebombing:* This is the trap. If Hiroshima is "addressive murder," Tokyo was mass murder too. Why the distinction? Why did Anscombe focus on the *bomb* and not the *fire*?

  3.  **Drafting the Prep Sheet - Section by Section:**

      *   **Terminology/Fact Check (Crucial First Step):**
          *   *Anscombe's Protest:* It was 1956, not "mid-fifties" (close enough, but be precise). Truman degree.
          *   *Soviet Entry:* Declared war Aug 8, 1945. Hiroshima Aug 6. Nagasaki Aug 9. The user says Soviet entry was the day *before* the second bomb. That's correct (Aug 8 vs Aug 9).
          *   *Tinian:* Correct island for B-29s.
          *   *San Francisco Censors:* Plausible, but ensure it's not anachronistic.
          *   *Term Alert:* "Double Effect" vs. "Doctrine of Double Effect." "Liability" vs. "Forfeiture." Don't say "Utilitarian" to a Thomist unless accusing them.
          *   *Historical Risk:* The "Atomic Diplomacy" (Moscow) theory is controversial. Don't rest the *moral* category entirely on the *historical* motive. Separate the moral structure from the specific historical intent.

      *   **Concessions Strategy:**
          *   *Concede:* Complexity of decision-making, the terror of the Pacific War, the reality of Japanese war crimes (to avoid sounding like a Japan-apologist), that legal categories differ from moral ones.
          *   *Do Not Concede:* That the "Empty City" test is irrelevant. That "Intention" is obsolete. That the atomic bomb is morally identical to conventional firebombing (need a distinction for the "newness" of the category).

      *   **The "Single Reply":**
          *   Needs to bridge the gap between the abstract ethics and the human reality. The "Empty City" test is the strongest intuitive hook. Stick with that.

      *   **Objection Scenarios (Drafting the Voices):**
          *   *Thomist:* "You're reinventing the wheel. DDE covers means/ends."
          *   *Revisionist:* "Intention is a black box. Liability is what matters."
          *   *Historian:* "Alperovitz is debunked. The target was military surrender, not Moscow."
          *   *Lawyer:* "Mens rea is hard enough. Don't add 'communicative intent'."
          *   *Veteran Family:* "My father saved lives."
          *   *The Tokyo Trap:* "Why is this different from Curtis LeMay?"

      *   **Refining the Answers:**
          *   Keep them conversational (2 minutes spoken).
          *   Acknowledge the critic's expertise (flattery disarms).
          *   Pivot back to the core thesis (Addressive Killing).
          *   Identify the "Soft Spot" honestly.

      *   **The Tokyo/Anscombe Question:**
          *   This needs a nuanced answer. Anscombe focused on the *principle* of targeting civilians, which applies to Tokyo, but the *atomic* nature created a specific philosophical rupture regarding the *future* and *scale*. Also, Anscombe's pamphlet was specifically about the *degree* honor, triggered by the atomic issue. The moral logic applies to Tokyo, but the *category* of addressive killing is clearer with the Bomb because of the "one bomb, one city" singularity.

  4.  **Review and Polish:**
      *   *Tone:* Respectful, academic but accessible, firm.
      *   *Formatting:* Clear headings, bullet points for readability during a stressful prep.
      *   *Check:* Did I answer all parts of the prompt? (Objections, Voices, Answers, Soft Spots, Concessions, Single Reply, Fact Check, Tokyo Question).

  5.  **Self-Correction during drafting:**
      *   *Initial thought:* Tell the user to defend the Moscow theory hard.
      *   *Correction:* No, the prompt says the historian thinks it's tired 1960s argument. Better advice: Decouple the *moral structure* of addressive killing from the *specific historical recipient*. It works even if the audience was only the Emperor.
      *   *Initial thought:* Tell them to cite specific philosophers.
      *   *Correction:* User said they dropped philosophy after one term. Keep citations minimal but accurate (Anscombe, Doctrine of Double Effect).
      *   *Refining the "Empty City":* Make sure the user doesn't confuse "counterfactual" with "consequentialist." The test is about *description of action*, not outcomes.

  6.  **Final Polish:** Check the "Tokyo" answer again. It's the user's biggest vulnerability. The distinction is that the Atomic Bomb *forced* the philosophical conversation in a way firebombing didn't, even if the moral status is similar. Anscombe was reacting to the *celebration* of Truman, which was about the Atomic bomb specifically.

  7.  (Final check of the "Addressive Killing" definition): Ensure the distinction between "Means" and "Message" is clear. In DDE, killing as a means is intended. In Addressive, killing is a *sign*. This is subtle. I need to make sure the Thomist objection is addressed on this specific nuance.

  8.  *Wait, one more thing:* The prompt asks for "ordered by how likely they are and how much damage they'd do." I need to prioritize. The Thomist and the Historian are the highest damage/likelihood combo. The Veteran is high emotion/low philosophy. The Tokyo question is high damage if asked. I will structure the sheet by "The Heavy Hitters" then "The Specialists" then "The Trap."

  9.  *Fact Check:* Anscombe's pamphlet was "Mr. Truman's Degree" (1956). Soviet entry: August 8. Hiroshima: August 6. Nagasaki: August 9. User said "Soviet entry... the day before [the second bomb]." That is accurate. User said "mid-fifties" for Anscombe. Accurate. User said "San Francisco censors." Office of Censorship was in SF for Pacific traffic. Accurate.

  10. *Ready to write.*
answer: |-
  This is a high-stakes room. You are proposing a moral category ("addressive killing") to philosophers who specialize in moral categories, while making historical claims to historians who specialize in those archives. They will not attack your novel; they will attack the scaffolding you built to hold it up.

  Here is your Q&A prep sheet.

  ### I. Terminology and Fact Check (Do This First)
  *You said you dropped philosophy after one term. Do not let them catch you using technical terms loosely.*

  *   **"Double Effect":** Never say "The Double Effect." It is **The Doctrine of Double Effect (DDE)**.
  *   **"Intention":** In Anscombe's sense, this isn't just "what you wanted." It's "what you aimed at." Do not confuse *intention* with *motive* (why you did it) or *foresight* (what you knew would happen).
  *   **"Liability":** The revisionists use this to mean "forfeiture of right to life." Do not use it to mean "legal responsibility."
  *   **Historical Chronology:** You are correct that the Soviet declaration of war (Aug 8) came between Hiroshima (Aug 6) and Nagasaki (Aug 9). However, be careful implying the *US* knew the Soviet entry would happen exactly then. The Potsdam Conference had discussed it, but the timing was Soviet discretion.
  *   **Anscombe's Target:** Anscombe's protest was specifically about the *honorary degree*, not just the bombing. She argued that granting the degree implied the university condoned the act. Keep this distinction clear if a Thomist brings it up.
  *   **The "Moscow" Claim:** This is your softest historical flank. The "Atomic Diplomacy" thesis (Gar Alperovitz) is heavily contested. **Do not rest the moral validity of "addressive killing" on the historical fact that Moscow was the audience.** Argue that *even if* the audience was only the Emperor, the structure of the act remains "addressive." If the historian attacks the Moscow claim, concede the historical debate but hold the moral category.

  ### II. Strategic Concessions
  *What to give away to buy credibility.*

  **Concede in the first 5 minutes:**
  1.  **The Horror of the Pacific War:** Acknowledge explicitly that the Japanese military regime was brutal, that surrender was not guaranteed, and that the war created a "moral emergency." If you sound like you think the US was the *only* aggressor, you lose the room.
  2.  **The Legal Definition:** Concede to the lawyers that "addressive killing" is not a *legal* category. It is a *moral description*. Law requires clear *mens rea*; you are offering a phenomenology of the act.
  3.  **Anscombe's Scope:** Acknowledge that Anscombe opposed the bombing of civilians *generally*, not just atomically. You are not claiming she ignored Tokyo; you are claiming the Atom Bomb made the "addressive" nature of the act undeniable.

  **Do NOT Concede (The Talk Collapses):**
  1.  **The Empty City Test:** Do not let them dismiss this as a "thought experiment." Insist it is a test of *description*. If the action changes meaning when the people vanish, the people were the point.
  2.  **Intention Matters:** Do not let the revisionists convince you that intention is irrelevant. If intention goes, "addressive killing" goes.
  3.  **The Distinction from Conventional Bombing:** You must maintain that while Tokyo was murder, the Atomic Bomb introduced a specific *singularity* that makes the "addressive" quality clearer (one plane, one bomb, one city, one message).

  ### III. The Objections (Ranked by Damage/Likelihood)

  #### 1. The Thomist / Anscombe Scholar
  **Likelihood:** High | **Damage:** High (They claim your category is redundant)
  **The Voice:** "Ms. [Name], Anscombe's *Intention* distinguishes between intended means and foreseen side effects. If the deaths were used to signal surrender, they were intended as a *means*. The Doctrine of Double Effect already condemns this as murder. Why do we need a novel category? It suggests you haven't read the *Doctrine* closely enough."
  **Your 2-Minute Answer:**
  "You're right that DDE condemns the killing. But DDE asks: 'Did you intend this death as a means or an end?' I'm asking a different question: 'What kind of meaning does this death carry?' In a standard tactical bombing, a death is an obstacle removed. In Nagasaki, the death was a *word* spoken.
  If I kill a guard to open a gate, that's a means. If I kill a subject to send a message to their King, that's addressive. The moral wrong is distinct because the victim is instrumentalized not just for their removal, but for their *significance*. DDE captures the *illicitness*, but it misses the *structure*. I'm not trying to fix DDE; I'm trying to describe a specific modern horror that DDE lumps in with ordinary murder."
  **Soft Spot:** They will press that "means" and "message" are functionally identical in moral calculus. You must insist the *experience* of the wrong differs.

  #### 2. The Revisionist Just-War Theorist
  **Likelihood:** High | **Damage:** Medium (They claim your category is irrelevant)
  **The Voice:** "This focus on intention is pre-revisionist machinery. Whether the killing was 'addressive' or 'tactical' doesn't change the victim's status. If the civilians weren't liable to be killed, it's a war crime. Your 'empty city' test is a clever linguistic trick, but morally, liability is the only switch that matters."
  **Your 2-Minute Answer:**
  "If we only look at liability, we treat the killer's mind as a black box. But public ethics requires us to describe *what was done*, not just *who was hit*.
  If a terrorist bombs a market to terrorize a government, and a general bombs a market to destroy a depot, the liability of the victims is identical. But the acts are different. My 'addressive' category explains why we feel the terrorist's act is distinctively communicative. It matters for how we judge the perpetrator, even if the victim's right to life is the same. We need to name the grammar of the violence, not just count the bodies."
  **Soft Spot:** They will argue that "grammar" doesn't save lives. Stick to the point that *description* dictates *prevention*.

  #### 3. The Pacific War Historian (The "Atomic Diplomacy" Skeptic)
  **Likelihood:** High | **Damage:** High (Undermines the historical basis of your 3rd point)
  **The Voice:** "You're leaning on the Alperovitz thesis that the bomb was for Moscow. The archives don't support that. The target was the Supreme Council in Tokyo. If your 'addressive' category relies on the bomb being a signal to Stalin, it's built on sand."
  **Your 2-Minute Answer:**
  "I want to be careful here. I'm not resting the moral category on the historical recipient. Whether the audience was Moscow, the Emperor, or the American public, the *structure* of the act remains addressive.
  The bomb was dropped to *compel a decision* through shock, not to *destroy a capacity* through force. That is an addressive act. Even if the only person being spoken to was the Emperor, the mechanism was: 'Read this rubble and surrender.' I'm analyzing the syntax of the weapon, not just the diplomatic cable."
  **Soft Spot:** If you implied in the lecture that Moscow was the *primary* target, you have to walk this back gently. Frame it as "one of the audiences."

  #### 4. The Veteran's Family (From the Floor)
  **Likelihood:** Medium | **Damage:** Emotional (Can turn the room against you)
  **The Voice:** "My father was in the invasion force. We were told those bombs saved a million lives. Are you standing here calling him a murderer because he supported the war that ended?"
  **Your 2-Minute Answer:**
  "I am not calling your father a murderer. I am analyzing the decision made by the political leadership and the moral structure of the weapon they used.
  Soldiers fight within the rules they are given. My critique is of the rule, not the soldier. Anscombe herself fought in the war and opposed the bombing. We can honor your father's service and still ask if the tool he was given to win was morally coherent. I'm asking us to look at the act itself, not to judge the men who were told it was necessary."
  **Soft Spot:** Do not get drawn into the "million lives saved" statistic debate. You will lose. Keep it on the *nature of the act*.

  #### 5. The International Lawyer
  **Likelihood:** Low | **Damage:** Low (Mostly semantic)
  **The Voice:** "International law prohibits targeting civilians. 'Addressive killing' adds nothing to the statute. It's unusable in a tribunal. What is the practical utility?"
  **Your 2-Minute Answer:**
  "Law is the floor; ethics is the ceiling. Law asks 'Is this punishable?' Ethics asks 'What is this?'
  If we only define it as 'targeting civilians,' we miss the specific danger of nuclear weapons—that they are designed as communicative acts of total destruction. We need the ethical category to shape future norms, even if the legal statute remains 'war crime.'"
  **Soft Spot:** They are right; it is unusable in law. Don't pretend otherwise.

  ### IV. The Trap: Tokyo and Anscombe's Silence
  *This is the question you fear. It is likely to come from a historian or a sharp undergrad.*

  **The Question:** "If Nagasaki is 'addressive murder,' what is Tokyo? LeMay killed 100,000 people in Tokyo with firebombs weeks before. Anscombe didn't protest that. Are you saying the Atomic Bomb is worse? Or just that the philosophy is different?"

  **Your 2-Minute Answer:**
  "That is the crucial question. Morally, the victims of Tokyo and Hiroshima are equal. Both were civilians targeted to break a will.
  But the *weapon* changed the description. Tokyo was a campaign of attrition; Hiroshima was a singular utterance. One bomb, one city, instant erasure. That singularity forced the philosophical crisis that Tokyo didn't.
  Anscombe protested Truman's degree because the *celebration* of the Atomic Bomb implied a new moral era where this was acceptable. She was fighting the *normalization* of the atomic, not just the killing of civilians. My category of 'addressive killing' applies to Tokyo, but it is *visible* in Nagasaki. The atom bomb made the message undeniable: 'We can erase you at will.' That is why we need a specific name for it."
  **Soft Spot:** You are walking a line saying they are morally similar but categorically distinct. If they press "Is Tokyo murder?" you must say **Yes**. Do not flinch. "Yes, Tokyo was murder. The Atom Bomb just made the grammar of that murder impossible to ignore."

  ### V. The Single Reply That Must Land
  *If you get flustered, return to this.*

  **The "Empty City" Pivot.**
  When they get bogged down in "Intention vs. Foresight" or "Liability," go back to the image.
  *"Gentlemen, ladies, forget the philosophy terms for a moment. If the city had been empty, and the bomb dropped, and the rubble remained: Would the mission have succeeded? If you say 'No,' then the people were the target. If the people were the target, they were not collateral. And if they were not collateral, we must describe the killing as it was: a direct assault on the innocent to send a message. Everything else is commentary."*

  ### VI. Final Advice for the Novelist
  *   **Don't Apologize:** You are a novelist, but you have lived in this material for three years. Speak with the authority of your research, not the deference of a guest.
  *   **Watch the Clock:** The chair will cut you at 45 minutes. Keep answers tight. If you ramble, they will smell the "novelist" insecurity.
  *   **Anscombe is Your Shield:** When in doubt, cite Anscombe. "As Anscombe argues..." is a shield against the Thomists. "Extending Anscombe..." is the spear against the Revisionists.
  *   **The "Grammar" Metaphor:** You use the word "grammar" a lot. Be careful. Philosophers hate mixed metaphors. Stick to "description of action" if they push back on "grammar."

  Good luck. The "Empty City" test is strong. Trust it.
