      *   *Rejected Ordering 2 (The "Robot" Start):* Start with a robot. Ask "Does it know what 'cup' means?" Then peel back layers. *Why reject?* Risks confirming the bias that embodiment = grounding. Hard to isolate the symbolic layer on a whiteboard.
      *   *Rejected Ordering 3 (The Dictionary Regress):* Start with the Chinese-Chinese dictionary. *Why reject?* It's too linguistic. CS majors think "tokens are just vectors, not words." It doesn't capture the *world* connection issue effectively for multimodal skeptics.
      *   *The "Hard Thing":* The distinction between *correlation/causation* and *aboutness*. Just because a sensor fires when a red object is present doesn't mean the internal state *means* red. It could just be a causal trigger. The system needs to use that state *as* a representation. This is the "constitutive vs. causal" gap.

