          *   *Case B:* It has a camera. "GLORB" correlates with red rocks (Multimodal).
          *   *Case C:* It uses "GLORB" to navigate danger (Action/Answerability).
          *   *Why?* It isolates the variables. It removes the "it's just an LLM" bias. It forces the question: What makes "GLORB" *about* the rock?

      *   **Misconceptions:**
          *   1. Multimodal = Grounded (Causal link).
