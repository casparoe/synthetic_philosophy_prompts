answer: |-
  Here is the ranking for your three-person, two-year theory group, ordered by priority:

  1.  **Problem 4:** The meta-question of framework validity (infinite objections/convergence).
  2.  **Problem 1:** Formal separation between strategic deception and honest confusion.
  3.  **Problem 2:** Debate decay (inevitability vs. judge artifact).
  4.  **Problem 3:** Counter-obfuscation probes.

  ### The Argument for Dependency and Ordering

  This ordering is driven by **logical dependency** (upstream blockers) and **comparative advantage** (what a small theory group can actually achieve versus an ML lab).

  **1. Problem 4 is the Kill Switch (Upstream of Everything)**
  You cannot optimize a engine that is fundamentally designed to stall. Problem 4 asks whether the debate framework collapses under the weight of infinite plausible-sounding objections. This is a question about **convergence bounds** and **computational complexity**, not just philosophy.
  *   **Dependency:** If the answer to 4 is "No, debate does not converge in realistic complexity classes," then Problems 1, 2, and 3 are irrelevant. You could perfectly distinguish deception from confusion (1), eliminate decay (2), and build perfect probes (3), but if the search space of objections is infinite and unprunable, the judge never reaches a decision.
  *   **Tractability:** For a theory group, this is the highest-leverage work. You don't need to train models to prove that a certain class of adversarial search problems lacks a polynomial-time solution. You can work with formal models of argumentation trees. Solving this (or even bounding it) in year one prevents the group from wasting 18 months on downstream mechanisms.

  **2. Problem 1 is the Epistemic Bottleneck (Upstream of 3)**
  Assuming the framework *can* converge (Problem 4 is surmountable), you still need to know what signal the judge is tracking. Problem 1 asks if strategic deception is formally distinguishable from honest confusion.
  *   **Dependency:** This is a prerequisite for Problem 3. You cannot build a "counter-obfuscation probe" if obfuscation is mathematically indistinguishable from legitimate uncertainty. If deception and confusion occupy the same epistemic territory, any probe that penalizes one will penalize the other, punishing honesty.
  *   **Tractability:** This is pure game theory and epistemic logic. It fits a small theory group perfectly. You can model this as a signaling game where the "type" of the agent (honest vs. deceptive) is hidden. Proving a separation theorem here is a concrete 12-month deliverable that informs the rest of the field, even if you never build a probe.

  **3. Problem 2 is the Dynamic Constraint (Upstream of 3, Downstream of 1 & 4)**
  Debate decay concerns the *process* over time. Does noise accumulate?
  *   **Dependency:** This depends on 4 (does the tree converge?) and 1 (are agents lying or just lost?). However, it is less fundamental than 1. Even if deception is distinguishable (1), decay might still happen due to cognitive load.
  *   **Tractability:** This is the first point where the ranking penalizes the group's constraints. Determining if decay is an artifact of *judge design* requires empirical testing (human or model judges). A three-person theory group cannot run large-scale human trials or train competitive debaters. You can model it, but without data, your conclusions will be speculative. It ranks lower because it requires resources you likely don't have.

  **4. Problem 3 is the Intervention (Most Downstream)**
  Building counter-obfuscation probes is an engineering solution to the problems defined in 1, 2, and 4.
  *   **Dependency:** You need to know the framework works (4), the signal is detectable (1), and the process doesn't inherently rot (2) before you design a fix.
  *   **Tractability:** This is the least suitable for a theory group. "Building probes" implies ML engineering—training verifiers, testing against adversarial generators, etc. A theory group's role here should only be to *specify* the mathematical properties a probe must have, not to build it. Since that specification depends entirely on the outputs of 1 and 2, this must be last.

  ### Resource Allocation Strategy

  *   **Year 1:** Dedicate 80% of effort to **Problem 4** and **Problem 1**. These are the "theoretical existence proofs." Can debate converge? Can lies be distinguished from errors? If you hit a hard negative on either, you pivot or publish the negative result (which is high value).
  *   **Year 2:** If Year 1 yields positive bounds, shift to **Problem 2** (modeling decay dynamics) and draft the *specifications* for **Problem 3**. Do not attempt to code the probes; collaborate with an external ML lab for that.

  ### Evidence That Would Reshuffle the Ranking

  You should be prepared to abandon this order if specific evidence emerges in the first 6 months:

  1.  **Empirical Success at Scale (Reshuffles 4 down):** If a concurrent ML lab demonstrates that debate *does* converge with superhuman models on complex tasks despite infinite objection spaces, Problem 4 moves to the back burner. The empirical fact overrides the theoretical worry. You shift focus to *why* it worked (Problem 1).
  2.  **Impossibility Proof on Separation (Reshuffles 1 up/collapses 3):** If you quickly prove that in certain information asymmetry regimes, deception is *provably* indistinguishable from confusion (a negative result on 1), you stop working on Problem 3 entirely. You cannot build a probe for a null signal. The group's focus shifts to alternative oversight frameworks (abandoning debate).
  3.  **Simple Heuristics Stop Decay (Reshuffles 2 down):** If simple attention mechanisms or turn-limits empirically solve debate decay in small models, Problem 2 becomes an engineering tweak rather than a theoretical open problem. You deprioritize it to focus on the harder epistemic laundering (1).

  ### Summary
  Prioritize the **existence proofs** (4 and 1) over the **mechanism design** (2 and 3). A small theory group creates the most value by defining the boundaries of the possible, not by trying to engineer solutions inside a box that might not exist. If debate is theoretically impossible (4) or epistemically blind (1), no amount of probe engineering (3) will save it.
