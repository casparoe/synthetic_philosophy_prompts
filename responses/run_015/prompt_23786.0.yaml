answer: |-
  It is a pleasure to correspond with a colleague from the physical sciences. I share your sentiment: philosophy often lacks the "scaffolding" of a clean formalism, which can make it feel like wading through mud compared to the crisp architecture of a Lagrangian or a Hamiltonian. However, in the specific domain of causation, the last 40 years have seen an attempt to introduce precisely the kind of formalism you are looking for.

  You have identified the exact fault line where the metaphysics of causation cracks: **causation by omission**. In physics, we generally deal with positive events (collisions, field interactions). "Nothing happening" is usually the vacuum state, not a cause. But in human affairs, *not* acting is often treated as a cause.

  You are correct that both David Lewis (Counterfactual Theory) and Judea Pearl (Structural Causal Models) look similar on the surface. Both rely on a form of "perturbation analysis": *If we wiggle this variable, does the outcome wiggle?* But as you suspect, they diverge significantly in how they handle redundancy (preemption) and overdetermination (Tragedy of the Commons), and they handle the "default state" problem very differently.

  Let us treat Lewis's account as a **path-integral over possible worlds** (weighted by similarity) and Pearl's account as a **system of structural equations** (with intervention operators).

  ---

  ### 1. The Preemptive Omission (The Backup Waterer)

  **The Setup:** Agent A is assigned to water a plant. Agent B is a backup. A omits to water ($A=0$). B sees this and waters ($B=1$). The plant lives ($P=1$).
  **The Intuition:** A's omission made no counterfactual difference to the plant's survival (if $A=1$, $P=1$). Yet, we feel A is responsible (perhaps for breach of duty, or for creating risk).

  #### David Lewis (Counterfactuals)
  For Lewis, causation is defined by counterfactual dependence between distinct events.
  *   **The Calculation:** We look at the "closest possible world" where A acts ($A=1$). In that world, B (seeing A act) does not need to water, or waters anyway. In either case, $P=1$.
  *   **The Result:** Since $P$ is 1 in the actual world and 1 in the counterfactual world, there is no dependence. Strictly speaking, **A's omission is not a cause of the plant's survival.**
  *   **The Divergence:** Lewis distinguishes between *causation* and *responsibility*. He would likely argue that our intuition that A is "responsible" is a normative judgment, not a causal one. A is blameworthy for *trying* to let the plant die, but causally, A did nothing to the plant's fate. Lewis's later work on "influence" (graded causation) tries to capture cases where the *manner* or *timing* changes, but in a binary live/die case, Lewis bites the bullet: no dependence, no causation.

  #### Judea Pearl (Structural Causal Models)
  Pearl models this using structural equations. Let $P = \max(A, B)$.
  *   **The Calculation:** In the actual world, $(A=0, B=1) \to P=1$. We intervene: $do(A=1)$. The equation becomes $P = \max(1, 1) = 1$.
  *   **The Result:** Like Lewis, the basic counterfactual test fails. However, Pearl (along with Joseph Halpern) developed a definition of **Actual Causation** (the HP definition) to handle preemption.
  *   **The Mechanism:** The HP definition asks: Is there a *contingency*? Can we hold some variables fixed such that dependence reappears? If we consider a counterfactual world where $B=0$ (the backup fails), then $P$ *does* depend on $A$.
  *   **The Divergence:** The HP account *can* classify A as a cause, but only if setting $B=0$ is considered a "valid" contingency. This is where the formalism hits the wall you identified. Is $B=0$ a legitimate state to hold fixed? If B is a reliable backup, setting $B=0$ might be considered "abnormal."

  **Physicist's Take:** Lewis says "No causal link" (conserving the purity of dependence). Pearl says "Potential causal link, contingent on the status of B." Pearl's formalism allows you to see the *structure* of the redundancy, whereas Lewis's possible worlds tend to smooth over the structural details in the similarity metric.

  ---

  ### 2. The Tragedy of the Commons (Overdetermination)

  **The Setup:** $N$ herders. Each adds 1 cow. Threshold $T$ is exceeded by a large margin. Pasture ruined.
  **The Intuition:** No single herder's addition is necessary (if Herder 1 removes a cow, ruin still happens). Yet, all are causes.

  #### David Lewis
  *   **The Calculation:** For any herder $H_i$, if we go to the closest world where $H_i$ does not add a cow, the pasture is still ruined. No counterfactual dependence.
  *   **The Fix:** Lewis invokes **stepwise dependence**. Perhaps $H_i$'s cow caused the grass height to be $h$, which caused $h+\epsilon$, which caused ruin.
  *   **The Failure:** If the threshold is sharp (a phase transition), stepwise dependence fails. If the ruin occurs only when the sum $> T$, and we are at $T + 10$, removing one cow leaves us at $T + 9$. The outcome is identical. Lewis admits this is a problem for his account (the problem of *overdetermination*). He suggests we might have to say causation is not transitive here, or accept that our intuition is wrong.

  #### Judea Pearl
  *   **The Calculation:** $Ruin = (\sum H_i > T)$.
  *   **The Fix:** The HP definition of Actual Causation handles this via **contingencies**. To test if $H_1$ is a cause, we construct a counterfactual world where we hold other herders fixed at a value where $H_1$ *would* be pivotal.
  *   **The Mechanism:** We ask: "Is there a setting of $H_2...H_N$ such that if $H_1$ changes, Ruin changes?" Yes. If $H_2...H_N$ sum to exactly $T-1$, then $H_1$ is pivotal.
  *   **The Divergence:** Pearl's account says $H_1$ is a cause because there *exists* a context (a configuration of other variables) where $H_1$ makes a difference. Lewis requires the dependence to hold in the *actual* context (or a chain thereof). Pearl allows you to "turn off" other causes to test the potency of the candidate cause.

  **Physicist's Take:** Pearl's approach here is akin to checking stability or susceptibility. Even if the system is saturated, if the variable has a non-zero coupling constant in the Hamiltonian, Pearl counts it as a cause. Lewis requires the variable to actually flip the state in the ground configuration.

  ---

  ### 3. The "Default" Problem: Statistical, Normative, or Formal?

  This is your deepest question. Both accounts need to distinguish an **omission** (failure to act) from a **non-action** (simply not doing something).
  *   *Example:* I did not water the plant in your garden. Is this an omission? Only if I was *supposed* to.
  *   *The Problem:* How do we formalize "supposed to"?

  #### Lewis: The Similarity Metric
  Lewis does not have a variable for "default." He has a **metric of similarity** between possible worlds.
  *   To evaluate "If A had watered...", we look for the closest world where A waters.
  *   **The Hidden Input:** What makes a world "close"? Lewis suggests we prioritize avoiding "miracles" (violations of physical law) and maximizing match of particular fact. But when dealing with human action, "match of particular fact" implicitly includes **expectations**.
  *   **Verdict:** Lewis hides the default in the metric. It is largely **normative**. The world where the gardener gardens is "closer" to actuality than the world where the passerby gardens, not because of statistics, but because of social norms. Lewis offers no principled way to derive this metric; it is exogenous to the theory.

  #### Pearl: Default Values and Normality
  Pearl's SCMs require you to define the **range** of variables.
  *   **Early Pearl:** Variables are just values ($0$ or $1$). $0$ is often treated as the "off" or "default" state. But this is arbitrary. Is $0$ "not watering" or "watering"?
  *   **Later Pearl (Halpern & Hitchcock):** They explicitly added a **Normality Ordering** to the HP definition. Variables have values ranked by "normality."
  *   **The Mechanism:** An omission is a cause if the *deviant* value (not watering) leads to the outcome, compared to the *default* value (watering).
  *   **Verdict:** Pearl is more honest. The formalism *cannot* identify the default on its own. You, the modeler, must assign the normality order.
      *   **Statistical?** No. If 90% of people steal, stealing is statistically normal, but we still treat "not stealing" as the default for causation/responsibility.
      *   **Normative?** Yes. The "default" is the value the variable *ought* to take.
      *   **Does Pearl solve it?** No, but he **localizes** it. In Lewis's theory, the normativity is smeared across the entire similarity metric of possible worlds. In Pearl's theory, the normativity is isolated in the "Normality Ordering" parameter.

  ### Summary Comparison

  | Feature | David Lewis (Counterfactuals) | Judea Pearl (SCMs / HP Definition) |
  | :--- | :--- | :--- |
  | **Formalism** | Modal logic (Possible Worlds). | Structural Equations (Graphs + Interventions). |
  | **Omission** | Treated as a negative existential event. | Treated as a variable taking a specific value (e.g., $X=0$). |
  | **Preemption** | Struggles. Often denies causation if no dependence. | Handles via **contingencies** (holding other paths fixed). |
  | **Overdetermination** | Struggles with sharp thresholds. | Handles via **potential pivotality** in counterfactual contexts. |
  | **The "Default"** | **Implicit.** Buried in the "similarity metric" of worlds. | **Explicit.** Modeled as "Normality Orderings" on variable values. |
  | **Nature of Default** | Normative (disguised as metaphysical closeness). | Normative (admitted as an exogenous modeling choice). |

  ### The Verdict for a Physicist

  You noted that philosophy lacks a clean formalism. Pearl's contribution is to show that **causation is not a single scalar quantity** you can measure; it is a property of a **model**.

  1.  **Lewis** is trying to do **Ontology**. He wants to know what causation *is* in the fabric of the universe. He fails to give you a clean grip on omissions because omissions aren't "in the fabric"; they are relational to agents and norms.
  2.  **Pearl** is doing **Epistemology/Representation**. He is saying: "If you want to reason about causation, you must build a model. That model requires boundary conditions."

  Regarding your specific worry about the **Default**:
  Pearl's account is superior here because it forces you to declare your boundary conditions. In physics, you cannot solve a differential equation without boundary conditions. Pearl admits that **normative expectations are the boundary conditions of causal models involving agents.**

  Lewis tries to derive the boundary conditions from the "laws of nature" (similarity metrics), which fails for social omissions. Pearl says: "The model doesn't know what's normal. You, the modeler, must input the normality."

  **Conclusion:**
  If you want to know if an omission is a cause, Pearl's framework tells you:
  1.  Write the structural equations.
  2.  Assign "default" values based on **norms** (not statistics).
  3.  Check for counterfactual dependence *relative to those defaults*.

  The "messiness" you feel is not a failure of the theory, but a feature of the phenomenon. Causation by omission is not a physical force; it is a **gauge choice** dependent on the normative frame of the observer. Pearl gives you the mathematics to see where you made that choice; Lewis tries to convince you the choice was already there in the metaphysics. For a scientist, Pearl's honesty about the exogenous input is likely more satisfying.
