      *   *Refining the "Friend" point:* If an anti-realist drops $KP$, they usually cease to be anti-realists in the Dummettian sense. Truth becomes evidence-transcendent. So the friend is right that it kills a *formulation*, but that formulation is the heart of semantic anti-realism. Need to make this distinction clear.
      *   *Refining the "Restriction" point:* The video says you can always rebuild $p \land \neg Kp$. This is true for *simple* restrictions. But Neil Tennant proposed restricting $KP$ to "Cartesian" propositions (those whose knowledge is logically consistent). Since $K(p \land \neg Kp)$ is inconsistent, it's not Cartesian, so $KP$ doesn't apply to it. This blocks the paradox without "cheating."
      *   *Refining the "In Principle" point:* The paradox holds for *any* modal operator that satisfies the K-axioms. So the ambiguity doesn't save $KP$ from the paradox, but it matters for whether we should accept $KP$ in the first place.

