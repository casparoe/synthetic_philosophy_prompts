      *   *Claim:* The grains of sand example.
          *   *Verdict:* The paradox doesn't require us to *know* $p$ is unknown. It requires that *if* there is an unknown truth, the contradiction follows. It's a proof by contradiction. The video's explanation might be slightly informal here.

  4.  **Address the User's Specific Questions:**

      *   **Q1: "In principle" ambiguity.**
          *   *Answer:* Crucial point. Fitch's proof works regardless of *who* knows it, as long as $K$ satisfies factivity and distribution. But the motivation for $KP$ depends on this. If "knowable" means "humanly possible," $KP$ is obviously false (too complex). If it means "idealized verifier," $KP$ is more plausible but the paradox hits harder.
