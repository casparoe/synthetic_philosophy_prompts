  I reject (6).

  The error lies in assuming the confirmation boost $\epsilon$ is constant and that non-raven observations are independent evidence regarding ravens. In Bayesian confirmation, the likelihood ratio depends crucially on background knowledge $K$, specifically regarding sampling protocols and population frequencies.

  Step (6) assumes you can harvest independent evidence from an armchair. You cannot. To generate a positive boost, the observation must result from a procedure where finding a non-black non-raven was not certain. If you select "objects I haven't examined" from an armchair, you are not sampling randomly from the universe; you are sampling from your immediate environment. These are not independent trials regarding the hypothesis "All ravens are black."

  Furthermore, the "exchange rate" between shoes and ravens is not fixed. The boost $\epsilon$ is roughly proportional to the probability of encountering a raven. As you observe more non-ravens, your background knowledge $K$ updates. While technically $P(H|E) > P(H)$ holds for each shoe under simple models, the magnitude $\epsilon$ is so sensitive to $K$ that it diminishes rapidly. You cannot accumulate enough $\epsilon$ to match a single raven observation because the variance reduced by a shoe concerns the population of shoes, not ravens. The correlation is too weak to sum to significance before background knowledge saturates.

  Regarding your subsidiary question: Your friend is correct. This is I.J. Good's standard solution. If you treat colors as exchangeable, observing many white shoes increases your estimate of the frequency of non-black objects generally. If non-blackness is common, the probability that a raven is black might decrease. In some models, observing white shoes can actually *decrease* $P(H)$ because it suggests blackness is rare, making a black raven less likely than a non-black one if ravens exist. This background knowledge effect often dominates the tiny Nicodian boost, reversing the sign of confirmation entirely.

  You can keep (1) and (2). The paradox dissolves when you realize (6) ignores how background knowledge modulates the likelihood ratio. The armchair cannot settle ornithology because the relevant evidence requires sampling from the class of ravens, not the class of objects. The "queasiness" you feel is your intuition correctly identifying that the sampling protocol required to make (6) true is impossible to execute from an armchair.
