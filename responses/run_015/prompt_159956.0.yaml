      *   Claim 5: The Equations (Load-bearing?).
      *   Claim 6: Historians' Objections.
      *   Synthesis: The Defensible Version.

  8.  (Drafting content... ensuring specific attention to the "load-bearing" and "temperamental" points as requested.) *Wait, one nuance on the prediction:* Turchin's model predicted *political instability*, not necessarily "cost of living protests" specifically, though they are correlated. I need to be precise there.

  9.  (Final Review against constraints): No bibliography. Focus on audit. Address all 5 specific sub-questions.

