answer: |-
  **BUREAU OF COMMON PRIORS: JUNIOR ANALYST ONBOARDING (FAQ)**

  **1. What is the Bureau's primary mandate?**
  To eliminate rational disagreement. Under the Agreement Charter, any two parties sharing a common prior cannot maintain different probabilities for an event once their posteriors are common knowledge. Our analysts supervise the announcement sequences required to make those posteriors common knowledge, ensuring disputes settle on a single, certified number.

  **2. How is a supervised exchange conducted?**
  Parties announce credences in timed rounds. Consider Case 88-B (Liability). The common prior for "Negligence" is 0.50. Round 1: Plaintiff announces 0.80; Defendant announces 0.20. Upon hearing this, both infer private information held by the other. Round 2: Plaintiff revises to 0.65; Defendant to 0.35. Round 3: Both announce 0.50. Consensus is certified. The figure represents the probability conditional on all information now common to both parties.

  **3. What if the parties fail to converge?**
  Convergence is guaranteed only if information partitions are finite. To prevent infinite loops, exchanges are capped at twelve rounds. If credences differ at the whistle, issue a Non-Convergence Notice (Form 12-B). This usually signals overly granular partitions; recommend the parties coarsen their evidence categories and re-file.

  **4. How do we detect posterior laundering?**
  Litigants often misreport credences to minimize information leakage, or retreat into hedged intervals (e.g., "between 0.4 and 0.6"). This is posterior laundering. Analysts must insist on precise point estimates. If a party refuses, note the obstruction in the log. We cannot force honesty, but we can flag procedural non-compliance for judicial review.

  **5. What if a party claims unawareness of a possibility?**
  The Theorem assumes a shared space of possibilities. A common defense is pleading unawareness of a specific state to invalidate the prior. If credible, the space must be refined. Pause the exchange. Draft a new state-space definition. Be warned: this resets the common prior, allowing parties to restart the clock indefinitely.

  **6. Does a certified consensus guarantee truth?**
  No. The Bureau ensures procedural immaculateness, not accuracy. If the shared prior is mistaken, the parties will unanimously agree on a falsehood with maximum confidence. We certify the agreement process, not the correspondence to reality. Truth is a separate compliance matter handled by the Evidence Standards Division.

  **7. Does agreement dictate action?**
  Agreement on probabilities does not pool utilities. Parties may agree on the risk of a merger but disagree on whether the risk is worth taking. The Bureau settles what *is* probable; the Department of Rational Action settles what *to do*. Do not advise parties on decisions. Your remit ends at the consensus number.

  **8. Is this system effective?**
  We guarantee that rational agents cannot agree to disagree. Whether preventing disagreement is preferable to allowing it falls outside our budget line. Some critics argue we enforce conformity over truth; others argue we reduce litigation costs. The Bureau takes no position on the utility of agreement itself, only its enforcement. Welcome to the team.
