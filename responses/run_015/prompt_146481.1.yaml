  Don't just copy an encyclopedia entry. I want the branches built from concrete cases that genuinely seperate the positions. For instance: if plutonium-239 appears in sediment cores on every continent but with a 20-30 year lag between hemispheres, does that still count as one global start date? Or if a community in the Amazon basin that never industrialised is asked to vote on an epoch name, should their view carry equal weight?

