answer: |-
  This is a sophisticated request. You are asking for the *specification* of a definition, not the definition itself. You want the engineering constraints for the tool you are building. This is the correct approach: before you build a meter, you must decide what it is measuring and what errors it cannot tolerate.

  Here is the specification for your decision procedure. I am committing to a specific philosophical stance (Process Biology/Autopoiesis) to give you a coherent list, rather than a buffet of options.

  ### Part 1: The Desiderata (Requirements for the Account)

  These are the constraints your definition must satisfy to function as a field guide for edge cases.

  **1. The Lineage Constraint (Non-Negotiable)**
  *   **Requirement:** The definition must apply primarily to *lineages*, not just individuals. An individual is alive if and only if it is a functional phase of a living lineage.
  *   **Case/Consideration:** The sterile worker ant, the mule, and the post-menopausal human. If you define life by the capacity of the *individual* to reproduce, you must rule these dead. That is biologically useless.
  *   **Why:** It preserves the intuition that a mule is alive without forcing you to claim it can reproduce.
  *   **Status:** **Non-Negotiable.** Without this, you cannot handle the "Sterile Individual" case.

  **2. The Operational Closure Constraint (Non-Negotiable)**
  *   **Requirement:** The system must produce the very components that constitute the system's boundary and processes. It must be self-constructing, not just self-replicating.
  *   **Case/Consideration:** The Factory Process and the Computer Worm. A factory makes cars, but the factory does not make *itself*. A worm copies code, but the code does not build the computer running it.
  *   **Why:** This distinguishes *being alive* from *being a product of something alive* or *being a pattern on a substrate*. It stops the definition from collapsing into "anything that copies."
  *   **Status:** **Non-Negotiable.** This is the primary filter against false positives.

  **3. The Thermodynamic Embodiment Constraint (Non-Negotiable)**
  *   **Requirement:** The process must physically dissipate energy to maintain its organization against entropy. It must be a physical heat-engine, not just a logical loop.
  *   **Case/Consideration:** The Computer Worm and the Library (if the structure is static). A simulation of a fire does not burn; a simulation of a cell does not metabolize.
  *   **Why:** To distinguish *being alive* from *being a description of something alive*. It prevents the guide from ruling that a perfect software simulation of a bacterium is itself alive.
  *   **Status:** **Non-Negotiable.** (See "Commitments" below for why I defend this).

  **4. The Heritable Variation Constraint (Non-Negotiable)**
  *   **Requirement:** The system must belong to a lineage capable of open-ended evolutionary adaptation via heritable variation.
  *   **Case/Consideration:** The Crystal and the Fire. Fire spreads and "metabolizes," but it does not carry instructions that mutate to improve fire efficiency. Crystals grow but do not evolve complexity.
  *   **Why:** To distinguish *being alive* from *merely persisting*. It ensures the system has a history and a future, not just a present.
  *   **Status:** **Non-Negotiable.**

  **5. The Developmental Decoupling Constraint (Preference)**
  *   **Requirement:** There must be a distinction between the *instructions* (genotype) and the *constructed body* (phenotype). The instructions must survive the death of the body.
  *   **Case/Consideration:** The Library. If the "body" is the only thing passed on, and it is rebuilt from scratch without a separate code, is it life?
  *   **Why:** This allows for complex adaptation. However, I mark this as a **Preference** because early life or exotic life (like The Library) might blur this line. A strict requirement here might rule out valid edge cases.
  *   **Status:** **Preference.** (I would like it, but I will not let it veto a candidate if other constraints are met).

  ---

  ### Part 2: Handling the Standard Edge Cases

  Here is how the desiderata above rule on the cases you provided.

  1.  **Sterile Individual (Mule):** **ALIVE.**
      *   *Reasoning:* Satisfies Lineage Constraint. It is a phase of a reproducing lineage, even if it is a dead end.
  2.  **Dormant Seed:** **ALIVE.**
      *   *Reasoning:* Satisfies Operational Closure (potentially) and Lineage. The organization is preserved even if thermodynamic activity is paused. The *capacity* to restart closure is the key.
  3.  **Clonal Forest:** **ONE INDIVIDUAL.**
      *   *Reasoning:* Satisfies Operational Closure at the network level. The underground links maintain the physiological unity. The shedding parts are propagules, not new individuals until they establish closure.
  4.  **Computer Worm:** **NOT ALIVE.**
      *   *Reasoning:* Fails Thermodynamic Embodiment. It relies on the hardware's metabolism, not its own. It is a parasite on a living (or at least physical) substrate, but is not itself alive.
  5.  **Factory Process:** **NOT ALIVE.**
      *   *Reasoning:* Fails Operational Closure. The factory does not build the factory. It is a product of life, not life itself.
  6.  **Lab Cell (Cyborg):** **ALIVE.**
      *   *Reasoning:* Satisfies Operational Closure internally, even if external support is needed. As long as the *instructions* for the chemistry are internal and the chemistry maintains the boundary, external machinery is just an environmental aid (like lungs in air).

  ---

  ### Part 3: The Custom Cases (Rental, Library, Twin Ladder)

  You asked for commitments on these specific constraints.

  **1. The Rental**
  *   **Description:** Self-maintaining and reproducing, but all components and copying machinery are made by a host organism inside it.
  *   **Verdict:** **ALIVE (Obligate Symbiont).**
  *   **Reasoning:** It meets Operational Closure *relative to its boundary*. It processes materials to maintain itself. The fact that the *source* of the materials is another living thing does not negate its status, any more than a cow eating grass negates the cow's life. It is distinct from a virus because it maintains its own boundary and metabolism; it is not just a packet of instructions.
  *   **Is this right?** Yes. Mitochondria were once independent organisms. We should not disqualify an entity because it has evolved extreme dependency.

  **2. The Library**
  *   **Description:** Inheritance is carried by the structure of a building the parent builds, not internal genetic code. The building varies and is heritable.
  *   **Verdict:** **ALIVE.**
  *   **Reasoning:** It meets Heritable Variation and Thermodynamic Embodiment. The "genotype" is externalized (an extended phenotype), but the *information* is preserved and varied. The distinction between "internal code" and "external structure" is a preference of Earth biology, not a logical necessity for life.
  *   **Is this right?** Yes. This forces us to define life by the *flow of information*, not the location of the storage medium.

  **3. The Twin Ladder**
  *   **Description:** Lineage must alternate between splitting and exchanging material. Neither method alone sustains the line.
  *   **Verdict:** **ALIVE (The Lineage is the Unit).**
  *   **Reasoning:** This is analogous to the alternation of generations in plants (sporophyte/gametophyte) or jellyfish (polyp/medusa). The *individuals* are incomplete phases. The *lineage* satisfies the Heritable Variation and Operational Closure constraints.
  *   **Is this right?** Yes. It reinforces the Lineage Constraint. You cannot judge the life status of a single generation in isolation.

  ---

  ### Part 4: The Tension (Earth-Bias vs. Universality)

  You suspected a tension between "must not be reverse-engineered from Earth life" and "must agree with us about Earth life."

  **The Tension is Real.**
  It is the tension between **Extension** (the list of things we agree are alive) and **Intension** (the rules that define them).
  *   If you prioritize Extension, you just make a list of Earth traits (DNA, Carbon, Cells). This fails for rover samples.
  *   If you prioritize Intension, you create abstract rules (Entropy, Information). This risks ruling out weird Earth life or ruling in fires.

  **The Resolution:**
  You must prioritize **Intension (The Rules)**, but use **Extension (Earth Life)** as a *calibration check*, not a *definition*.
  *   *What to give up:* You must give up the requirement that alien life must look *structurally* like Earth life (cells, DNA).
  *   *What to keep:* You must keep the requirement that alien life must function *processually* like Earth life (metabolism, heredity).
  *   *Why:* We agree cats are alive because they *do* specific things (eat, grow, breed), not just because they are made of meat. Your guide must test for the *doing*, not the *stuff*.

  ---

  ### Part 5: The Killer Requirement

  You asked for the single requirement that excludes the largest number of existing definitions, including the popular "self-maintaining chemistry + evolution" (NASA-style) definition.

  **The Killer Requirement:** **Operational Closure (Autopoiesis).**

  **Why it excludes the most:**
  1.  **It excludes Viruses:** Viruses evolve and have chemistry, but they do not build their own capsids or replicate their own genomes *using their own machinery*. They hijack. Most definitions struggle with viruses; this requirement cleanly rules them as "non-living biological agents."
  2.  **It excludes Computer Worms:** They replicate and evolve, but they do not construct the hardware that runs them.
  3.  **It excludes "Self-Sustaining Chemistry" (Loose Interpretation):** A flame is self-sustaining chemistry. A turbulent vortex is self-sustaining fluid dynamics. They do not *produce the boundary that contains them*. An autocatalytic set in a soup might replicate, but if it doesn't create the membrane that keeps it together, it is just a reaction, not an organism.
  4.  **It excludes The Factory:** As discussed, it makes products, not itself.

  **Why this is a point in its favor:**
  It forces the definition to be about **Individuality**. Life is the creation of a "Self." Without Operational Closure, you cannot distinguish the organism from its environment. You cannot say where the life *ends* and the world *begins*. If your field guide cannot draw a circle around the thing it is testing, it is useless. This requirement draws the circle.

  ---

  ### Part 6: Commitments and Concessions

  You asked me to commit, drop one desideratum, and identify the most debatable point.

  **1. The Binary Verdict**
  Your guide **must output a Binary Verdict (Alive / Not Alive).**
  *   *Why:* A field guide is a decision tool. "Sort of alive" is not a ruling. While biology is fuzzy (evolution is a gradient), the *status* of being a unit of selection is binary. You are either a vehicle for heredity or you are not.
  *   *How:* Use the **Lineage Constraint**. If the entity is part of a lineage that meets the criteria, it is Alive. If not, it is Not Alive. This resolves the "degree" problem.

  **2. The Dropped Desideratum**
  I am dropping **Reproductive Independence** (The idea that an individual must be able to reproduce on its own).
  *   *Why:* As established with the Mule, the Lab Cell, and The Rental, dependency is a spectrum. A cow cannot reproduce without bacteria in its gut. A human cannot reproduce without a partner. A lab cell cannot reproduce without a machine. If you demand independence, you rule out almost everything.
  *   *Replacement:* I rely on **Lineage Capacity**. The *lineage* must be capable of reproduction, even if the *individual* is not.

  **3. The Most Open to Disagreement**
  **Thermodynamic Embodiment.**
  *   *The Controversy:* Many theorists argue for "Substrate Independence"—that if a computer simulation becomes complex enough, it is alive. My requirement rules this out. I argue that life is inherently a fight against entropy, which requires physical energy dissipation. A simulation is a *description* of that fight, not the fight itself.
  *   *Why I stand by it:* If you allow software to be alive, you cannot distinguish a living program from a recording of a living program. Both are bits. Only the physical execution consumes energy. For a field guide dealing with rovers and labs, physicality is a necessary constraint.

  **Summary for your Project:**
  Build your guide to test for **Operational Closure** (Does it build itself?) and **Lineage Membership** (Does it belong to a family that evolves?). If it passes both, it is Alive. If it fails either, it is Not Alive. This will correctly classify the mule, the seed, and the lab cell as Alive, and the virus, the worm, and the factory as Not Alive. It will treat The Rental, The Library, and The Twin Ladder as Alive, which is the biologically robust choice.
