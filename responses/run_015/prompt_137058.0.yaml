      *   *Q1 (Theory):* Move beyond Double Effect. Focus on *Causal Provenance*. The doctor cannot be the *author* of death, only the *witness* who makes it comfortable. CDS/VSED allow the doctor to say "The disease killed them" or "Their body gave up." MAID forces "I killed them."
      *   *Q2 (Severity/Shortness):* It's a hybrid. Shortness creates the *permission structure* (futility of life-preservation). Severity creates the *indication* (need for intervention). The inconsistency is that "futility" is biological, but "suffering" is experiential. The practice treats biological futility as a proxy for moral permission to ignore future welfare.
      *   *Q3 (SFE):* The default premise is indeed "Existence > Non-Existence." SFE flips this. If SFE held, CDS is arguably *worse* than MAID (prolongs the state of being alive, even if unconscious, and delays the end). The "Wait-It-Out" clause is a ritual to preserve the "Life is Good" norm.
      *   *Refining the "Presupposed vs. Fits":*
          *   *Presupposed:* Death must be biologically caused (not agent-caused). Future life has presumptive value unless biologically forfeit.
          *   *Fits:* The specific timelines (6 months, etc.). The specific drugs used.

  7.  **Review against Constraints:**
      *   No citations? Check.
      *   No reading list? Check.
      *   Focus on reconstruction/argument? Check.
