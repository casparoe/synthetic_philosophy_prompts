      *   Address SFE specifically? Check.

  8.  **Final Polish:** Ensure the language matches the user's level (medical humanities/ethics). Use terms like "causal provenance," "moral ontology," "epistemic humility." Make sure the distinction between "strictly presupposed" and "comfortably fits" is explicit in each section. (Self-Correction: Make sure I don't just say "Double Effect is wrong." The user knows that. I need to say what *replaces* it as the operational logic.)

      *   *Key Insight to add:* The "Wait-It-Out" clause isn't just about killing; it's about *time*. It forces a period of reflection/waiting that acts as a safeguard against impulsivity, but in the terminal context, that safeguard is waived because "there is no future to protect."

      *   *Refining Q1:* The core presupposition is **The Inviolability of the Biological Trajectory.**
