answer: |-
  This is a sharp ethnographic capture. The "Wait-It-Out Clause" names the operational logic better than "Double Effect" ever did. Double Effect is the *apologia*; the Wait-It-Out Clause is the *mechanism*.

  You are asking for the moral ontology that makes this mechanism coherent to the practitioners who use it. You want to know what they must believe about the world for this distinction to feel like a boundary rather than a hypocrisy.

  Here is the reconstruction of the implicit theory, broken down by your three questions, with a specific focus on distinguishing what is *strictly presupposed* (the practice collapses without it) versus what *fits comfortably* (the practice tolerates it, but doesn't require it).

  ### 1. The Theory of Causal Provenance (Beyond Intending/Allowing)

  You are correct that intending/foreseeing and doing/allowing are insufficient. In CDS (Continuous Deep Sedation), the clinician intends the unconsciousness knowing it will hasten death (by precluding hydration/nutrition or suppressing respiratory drive). In VSED (Voluntary Stopping of Eating and Drinking), the patient intends death by omission. Both are teleologically oriented toward the end of life.

  So, what distinguishes them from MAID (Medical Aid in Dying)? It is not the *goal*, but the **causal provenance of death.**

  **The Implicit Theory:**
  The practice presupposes that **death must remain a biological event, not a clinical product.**
  For the clinician to maintain moral standing, the immediate cause of death must be traceable to the *pathology* (the cancer, the organ failure) or the *body's natural refusal* (starvation), never to the *pharmacological action* of the clinician.

  *   **In CDS:** The narrative is "The disease killed them; we made sure they didn't feel it." The sedation is a shield, not a spear.
  *   **In VSED:** The narrative is "Their body gave up; we supported their choice to not force it."
  *   **In MAID:** The narrative is "The drug killed them."

  **Strictly Presupposed:**
  The practice strictly presupposes that **clinicians lack the standing to be the authors of death.** They may be the editors of the dying process, but not the writers of the final sentence. This is why the "Wait-It-Out" is essential: it inserts a temporal buffer where *nature* does the killing. If you remove the buffer (i.e., give the lethal bolus), the clinician becomes the author.

  **Merely Fits Comfortably:**
  The idea that "death is not a benefit." This fits the practice, but the practice doesn't strictly require it. The practice could theoretically view death as a benefit but still forbid clinicians from *conferring* it directly (a deontological constraint on agency rather than a axiological claim about death). However, in the field, clinicians often conflate the two: "We can't give you death because it's not a medical treatment."

  ### 2. Severity vs. Shortness: The Futility Proxy

  You ask whether severity of suffering or shortness of life carries the justification. The practice behaves as if it is **Severity**, but it is structurally built on **Shortness**.

  **The Implicit Theory:**
  The practice operates on a **Threshold Theory of Futility.**
  When a patient is terminal, the project of "preserving life" is deemed biologically futile. Once that project is abandoned, the moral weight of "keeping them alive" evaporates. The remaining life is no longer viewed as a *good to be protected*, but as a *process to be managed*.

  *   **Why Terminal Illness is Required:** It is not because the suffering is worse (it isn't always). It is because terminal illness acts as a **proxy for forfeited future welfare.** If you are dying, you have no "future self" to harm by ending your life early. If you are healthy but suffering, you have a "future self" that might recover, adapt, or find meaning.
  *   **The Inconsistency:** The practice refuses to quantify "negative welfare" for non-terminal patients. It assumes that *potential* future life outweighs *actual* present suffering, unless biology has already ruled the future impossible.

  **Strictly Presupposed:**
  The practice strictly presupposes that **biological inevitability grants moral permission.** Without the terminal diagnosis, the clinician cannot claim that "life is already lost." Therefore, the "Wait-It-Out" clause is actually a **Statute of Limitations on Suffering.** You only get to wait-it-out if the clock was going to run out anyway.

  **Merely Fits Comfortably:**
  The specific timelines (e.g., "6 months to live"). These are administrative proxies for the philosophical claim of futility. The practice could function with "incurable" rather than "terminal," but it chooses "terminal" to ensure the biological trajectory is downward. The arbitrariness you note is a feature, not a bug: it creates a bright line that prevents the slippery slope of evaluating "quality of life" judgments, which clinicians are trained to avoid.

  ### 3. Suffering-Focused Ethics (SFE) and the Valence of Existence

  This is the crux. The current practice rests on a premise that SFE explicitly rejects: **The Presumptive Good of Conscious Existence.**

  **The Implicit Theory:**
  Current bioethics operates on a **Sanctity-of-Life Lite** model. It assumes that *being* is preferable to *non-being*, even if *being* involves suffering. Therefore, the moral imperative is to mitigate the suffering *within* existence (sedation), not to terminate existence (euthanasia).
  *   **CDS** is the compromise: It removes the *experience* of suffering without removing the *organism*. It keeps the biological shell alive while deleting the conscious subject.
  *   **VSED** is the exception: It allows the patient to remove the organism, but forces them to do the work (and wait the time), preserving the clinician's clean hands.

  **If You Took SFE Seriously:**
  If suffering is the primary disvalue and non-existence is neutral (or preferable to suffering):
  1.  **Speed becomes a virtue.** The "Wait-It-Out" clause becomes morally suspect. Why force a patient to starve for 14 days or remain sedated for 3 days if the suffering is intractable? Delaying death *is* inflicting suffering.
  2.  **The Terminal Requirement Collapses.** If the metric is net suffering, a healthy person with intractable psychological or physical pain has the same moral claim as a terminal patient. The "future welfare" argument only holds if you value *potential* existence over *actual* suffering. SFE denies this trade-off.
  3.  **CDS becomes problematic.** From a strict SFE view, keeping a body alive in a coma is a waste of resources and maintains a biological state that has no welfare value. It is a "zombie" compromise to soothe the survivors, not the patient.

  **What Would Change?**
  *   **Drop Sanctity, Keep Doing/Allowing:** You get the current practice (CDS/VSED) but stripped of its "humane" justification. It becomes a purely legal shield. Clinicians would admit, "We are letting you starve because we aren't allowed to kill you," rather than, "We are supporting your natural dying process."
  *   **Drop Doing/Allowing, Keep Sanctity:** You get MAID for everyone, but framed as "treatment." (This is arguably the Dutch model's tension).
  *   **Drop Both (SFE):** You get **Efficacy-Based Relief.** The method of death is chosen by which causes the least suffering and anxiety. The "Wait-It-Out" clause vanishes because waiting *is* the harm.

  **Strictly Presupposed:**
  The practice strictly presupposes that **the state of being alive has intrinsic moral weight that offsets suffering.** This is why CDS is preferred over MAID. CDS preserves the *status* of "living patient" (heart beating, skin warm) while negating the *experience* of suffering. It satisfies the "Sanctity" requirement (life is maintained) while satisfying the "Mercy" requirement (suffering is removed). MAID fails the Sanctity requirement.

  **Merely Fits Comfortably:**
  The idea that families need time to say goodbye. This is often used to justify the "Wait-It-Out" period. However, if the practice were truly patient-centered (or SFE-aligned), the family's need for time would not trump the patient's suffering. The fact that it *does* trump the patient's suffering in many negotiations reveals that the practice is actually serving the **survivors' moral comfort** as much as the patient's physical relief.

  ### Summary for Your Argument

  If you are arguing this in your fieldwork or writing, here is the distinction you need to hold:

  1.  **The Practice Commits Clinicians To:** The belief that **causal provenance matters more than outcome.** (It matters *how* they die, not just *that* they die).
  2.  **The Practice Commits Clinicians To:** The belief that **biological futility is the only valid proxy for moral permission.** (We can only stop protecting life when life is already biologically lost).
  3.  **The Practice Does NOT Strictly Commit Clinicians To:** A coherent theory of welfare. (They don't need to agree on *why* suffering is bad, only that they can't *cause* death to fix it).
  4.  **The Practice Does NOT Strictly Commit Clinicians To:** The belief that consciousness is always good. (CDS proves they value unconscious life over conscious suffering).

  **The "Wait-It-Out" Clause is not a medical protocol; it is a ritual purification.** It washes the blood off the clinician's hands by ensuring that Time, not Chemistry, is the executioner. If you argue from SFE, you attack the ritual: you argue that if the suffering is the evil, the speed of relief is the metric, and the purity of the clinician's hands is irrelevant.

  The tension you are seeing is the friction between **Medicine as Stewardship of Life** (wait it out) and **Medicine as Alleviation of Suffering** (end it). Currently, Stewardship wins, but Alleviation is allowed to drive the car as long as Stewardship holds the keys.
