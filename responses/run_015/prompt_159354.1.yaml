answer: |-
  Dogmatism doesn't mean you can never change your mind; it claims perceptual experiences provide immediate *prima facie* justification that is *defeasible*. Your friend confuses initial justification with final certainty. If the nurse says you're drugged, that testimony acts as a "defeater," overriding your visual seeming so you aren't justified in believing the zebra. Dogmatism is a serious anti-skeptical view because it rejects the Cartesian demand to prove your senses are reliable before using them; instead, it argues seemings are innocent until proven guilty. Your "uncontested seeming" patch is actually correct about defeasibility, but wrong about the circle: you don't need to *prove* no defeaters exist beforehand, you just need no active reason to doubt. This differs sharply from Descartes, who insists you must establish you're not dreaming before trusting any perception. Dogmatism lets you trust first and troubleshoot later, placing the burden of proof on the skeptic rather than requiring you to validate your senses recursively. So, dogmatism allows rational belief revision without collapsing into skepticism or stubbornness.
