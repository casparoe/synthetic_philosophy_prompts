prompt: |-
  ok so im in this philosophy elective at school (mostly seniors, im a junior) and we just spent a couple classes on this thing my teacher called the dogmatism paradox — the bit where you cant check whether your senses are deceiving you without already relying on your senses, so either no perceptual belief is ever justified, or experience has to be able to justify a belief straight away, without any other belief propping it up underneath. Me and my friend got into a huge argument about it after class and im honestly not sure whos right. He says the second option is just plain dogmatism, like what the word actually means in real life: sticking to your guns and ignoring anything that counts against you. His version: if your experience justifies the belief on its own, with nothing else needed, then no later evidence can take that away, so youd have to keep believing theres a zebra in the room even after the nurse tells you youve been dosed with a hallucinogen. I think hes being dumb but I also cant explain why without going back to square one.

  Our teacher also gave us a variant to chew on that isnt the dream scenario: a nurse tells you youve been given a drug that causes super vivid zebra hallucinations you wont be able to tell apart from the real thing, and then five minutes later you seem to see a zebra. My friend says the dogmatist solution commits you to saying youre justified in the zebra belief there, which he thinks is absurd. I tried to patch it by saying a seeming only justifies you while its uncontested — the justification is real but it gets cancelled the moment something else comes along that explains your experience away. But then I noticed that makes my justification depend on a further belief (that nothing else explains it away), and checking that belief seems to need my senses again, so im back in the circle. My friend thinks this proves the whole move is just giving up, and that the only honest option is to do what Descartes did and try to establish that were not being deceived before trusting perception at all.

  So here's what I actually want to ask: since dogmatism says a perceptual belief is justified all by itself and needs no support from any other belief, doesnt that mean that once youve seen something you can never rationally change your mind about it? And if it does mean that, why does anyone treat it as a serious answer to the paradox instead of just conceding to the skeptic? Also, where exactly does my uncontested-seeming idea go wrong, and is it basically the same thing as Descartes' dream argument or not? Keep it to one short paragraph, under 200 words if you can — I want to read it out in class tomorrow and my teacher will cut me off if I ramble.
