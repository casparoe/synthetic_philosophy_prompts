answer: |-
  The fluorescent lights of the Millhaven Community Center hummed, a low-grade headache waiting to happen. It was 7:15 PM on a Tuesday, and the air in Room B smelled of stale coffee and damp raincoats. Outside, the October rain was doing its best to validate the very concern at hand: the drainage capacity of the old Miller Wetlands.

  Twelve citizens sat around a U-shaped table. They were the Council. A teacher, a barista, a nurse, a grad student. None had run for office. Eight years ago, their names had been pulled from a tumbler, just like the ones sitting on the credenza behind the facilitator.

  At the open end of the U sat the Contrarians.

  Arthur, a retired civil engineer with a mustache that had seen better decades, shifted in his chair. He wore a red badge that read *ASSIGNED OPPOSITION*. He wanted the solar farm. He had done the math. The soil was stable, the runoff manageable. But tonight, he had to prove it was a disaster.

  Across from him sat Elena. She wore a blue badge: *ASSIGNED SUPPORT*. Elena ran the local chapter of "Save Millhaven Green," an organization that had fought a strip mall, a condo complex, and a new stoplight for the last five years. Tonight, she had to convince the Council that paving over the wetlands was the right thing to do.

  "Mr. Vance," said Sarah, the facilitator. She was a councilor, chosen by lot three months ago. She looked tired. "You have the floor for five minutes. Please argue against Proposal 44-B."

  Arthur cleared his throat. He adjusted his glasses. "Right. Well. The... the risk."

  He paused. He knew the risk was negligible. He had reviewed the soil samples himself before the lottery drew his name.

  "The risk," Arthur tried again, his voice tight, "is that the pilings could disturb the sediment. And if the sediment is disturbed, the water table... it might shift. Toward the residential zone."

  A murmur went through the Council. Tom, a high school history teacher, leaned forward. "Arthur, didn't you submit a letter to the editor last month saying the soil density was ideal for heavy infrastructure?"

  Arthur flushed. "That was... that was a theoretical assessment. Under specific conditions. Tonight, we are looking at worst-case scenarios. It is my duty to highlight the worst case."

  "It feels like you're hedging," Tom said.

  "I am fulfilling the mandate," Arthur snapped, then softened. "Look. If I were speaking for myself, I'd say build it. But I'm not. I'm the red badge. So I have to tell you that if it rains like this for three days straight, the retention ponds might overflow. They *might*. I can't say they *will*. But they might."

  The room grew heavy. The Council members exchanged glances. In a normal hearing, an engineer's caution was gold. But here, everyone knew Arthur was holding back his true expertise. Was this caution real, or was it performance art?

  "Elena," Sarah said. "You're up. Assigned Support."

  Elena stood up. She smoothed her jacket. She looked like she was walking to the gallows. She hated the solar farm. It was on a floodplain. It was habitat for migratory birds. But the rule was the rule. Millhaven's Great Experiment demanded it.

  "Progress," Elena said. Her voice was steady, which terrified her. "We have to think about the future. The wetlands... they're nice. But are they useful? A solar array provides energy. Energy is life."

  She felt sick saying it. She looked at her friends in the audience, the ones who usually cheered her when she shouted at developers. They were staring at their hands.

  "If we don't build here," Elena continued, forcing a smile that didn't reach her eyes, "we build elsewhere. Maybe on farmland. Maybe further out, requiring more transmission lines. This is the most efficient spot. Efficiency is a moral good."

  She sat down quickly.

  "Discussion," Sarah said.

  "I don't know what to believe," said the barista, a young woman named Priya. "Arthur says the soil might shift, but he admits he thinks it's fine. Elena says it's efficient, but she's spent three years suing anyone who wants to cut a tree in this town. How do we weigh the arguments if we know the speakers are lying?"

  "They aren't lying," Sarah corrected gently. "They're stress-testing. That's the point."

  "Is it?" Tom spoke up again. He spun a pen on the table. "I was reading the archives last night. The first Council minutes. From eight years ago."

  The room quieted. The origin story of the Contrarian Rule was local folklore, rarely discussed in the chamber.

  "The founders," Tom said, looking at Arthur and Elena. "They didn't read about this in Athens. There's no historical precedent for forced contrarianism in sortition. You know that, right?"

  Arthur nodded stiffly. "I know."

  "This wasn't theory," Tom said. "It was paranoia. The first Council was terrified they'd just become another echo chamber. They thought if everyone was randomly selected, they'd all be too nice, too eager to agree to get home for dinner. So they invented the Contrarian Rule. They made it up because they were afraid of being bored."

  "That's cynical," Elena said.

  "It's honest," Tom countered. "And look at us. Are we deliberating? Or are we watching a play? Arthur is pretending to be worried. Elena is pretending to be a developer. And we're sitting here trying to decode who they *really* are instead of looking at the data."

  "The data is ambiguous," Arthur muttered. "That's why you need us."

  "The data says the flood risk is one percent," Tom said. "But because Arthur, the expert, is forced to argue the risk is real, now half the Council thinks it's fifty percent. The rule doesn't clarify the truth. It muddies it."

  Elena leaned forward, her elbows on the table. "Let me say something. Not as the blue badge. Just as me."

  Sarah hesitated, then nodded. "Off script. Go ahead."

  "When I stood up there," Elena said, gesturing to her spot, "arguing for the solar farm... I found myself making points I hadn't considered. About transmission lines. About farmland preservation. I don't believe we should build here. I still think it's a mistake. But... I understand the trade-off better now. Because I had to sell it."

  She looked at Arthur. "Did you find anything? In the opposition?"

  Arthur sighed, taking off his glasses. He rubbed the bridge of his nose. "I had to look for weaknesses in the engineering report. I found one. The drainage culverts are undersized for a one-in-fifty-year storm. I didn't put that in my argument because I was too busy trying to sound scared of the soil. But the culverts... they are too small."

  A silence fell over the room. The hum of the lights seemed louder.

  "If you hadn't been forced to argue against it," Priya asked, "would you have mentioned the culverts?"

  "No," Arthur said. "I would have assumed the contractor would fix it later. I was focused on the big picture. Being the Contrarian made me nitpick. I looked for cracks."

  Tom stopped spinning his pen. "So the rule is theater. But the theater made you look at the culverts."

  "It made me look for a weapon," Arthur corrected. "I wasn't trying to improve the project. I was trying to kill it. I just happened to find a loose bolt."

  Sarah looked at the clock. 8:45 PM. "We need to vote. Proposal 44-B. Solar installation on Miller Wetlands."

  The Council members looked at their packets. They looked at Arthur, who wanted it but found a flaw. They looked at Elena, who hated it but argued for it. They looked at Tom, who thought the whole process was a historical accident born of fear.

  In Athens, they used beans to vote. In Millhaven, they used electronic keypads.

  "I move to approve," Priya said, "contingent on the drainage culverts being upgraded to handle a one-in-fifty-year storm, verified by an independent engineer."

  "Second," Tom said.

  "Arthur," Sarah said. "Can that be done?"

  Arthur put his glasses back on. He looked at the plans. He looked at the red badge on his chest. "Yes. It adds four percent to the cost. It's doable."

  "Elena?" Sarah asked. "Does that mitigate your... assigned concerns?"

  Elena touched her blue badge. "It mitigates the flooding risk. It doesn't fix the habitat loss. But... I argued for efficiency tonight. I have to live with that."

  "Vote," Sarah said.

  Twelve hands went up. Some hesitated. Some were quick.

  When the count was read, the proposal passed with the amendment.

  Sarah gavelled the meeting closed. "Same time next week. The budget review."

  People began to stand, shuffling papers, zipping coats. The tension broke, replaced by the mundane fatigue of civic duty.

  Arthur walked over to Elena near the coat rack. He held his red badge in his hand.

  "You were convincing," Arthur said. "Scary convincing."

  "I felt like a traitor," Elena replied, pulling on her raincoat. "Did you hate it?"

  "I hated lying about the soil," Arthur said. "But Tom was right. About the echo chamber. If I hadn't been forced to attack the plan, I would have just nodded along with the other engineers. We get comfortable. We stop looking for the culverts."

  "So it works?"

  Arthur looked out the window at the rain beating against the pavement. "It works. But it feels like we're solving problems by making everyone uncomfortable enough to admit what they know."

  Elena pinned her own badge into her bag, hiding it. "See you next week, Arthur. I hear we're drawing Contrarians for the school budget."

  "God help us," Arthur said.

  They walked out into the rain together, leaving the empty chairs and the humming lights behind, two neighbors bound by the knowledge that sometimes you have to argue against the truth to find it.
