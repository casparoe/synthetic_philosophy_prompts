answer: |-
  **Operational Guidance: Language and Condition Verification**

  **Purpose:** To ensure we assess the real-world impact of a claimant's health without rejecting claims simply because the words they use do not match medical textbooks. This procedure helps you distinguish between a claimant who is mistaken about their diagnosis but correct about their disability, and a claimant whose account cannot be verified.

  **Time Allowance:** This check is part of the 30-minute assessment. It should not take more than 5 minutes of questioning.

  ### 1. The Decision Procedure

  Ask these questions in order. Record the answers briefly in the clinical notes.

  **Question 1: Who owns this word?**
  *Ask:* "Is this a name a doctor gave you, or is it how you and your family describe the trouble?"
  *   **Sufficient Answer (Lay):** "It's what we call it," or "I don't have a diagnosis, but I know what hurts."
      *   *Action:* Treat the claimant as the authority on the pain or limitation. Do not challenge the label.
  *   **Sufficient Answer (Medical):** "My consultant told me I have X."
      *   *Action:* Check if the description matches the diagnosis. If it does not match (e.g., they say 'arthritis' but describe nerve pain), move to Question 2.
  *   **Stop Point:** If the claimant insists a doctor gave a specific diagnosis that is demonstrably impossible (e.g., "I have no heart"), stop and seek clinical advice.

  **Question 2: If we strip the name, is the trouble real?**
  *Ask:* "Forget the name of the condition for a moment. Can you show me or tell me exactly where the pain is and what stops you doing?"
  *   **Sufficient Answer:** The claimant can point to a body part, describe a sensation (burning, aching, giving way), and link it to a specific activity (walking, holding a cup).
      *   *Action:* Record the functional limitation. Ignore the mismatched label.
  *   **Insufficient Answer:** The claimant can only repeat the name of the condition without describing how it feels or what it stops them doing.
      *   *Action:* Score the item as unsubstantiated. You cannot assess a function that is not described.

  **Question 3: Does this word do work in their community?**
  *Ask:* (If language or culture is a barrier) "Does this word cover other troubles for your family, or just this one?" (Use an interpreter if needed).
  *   **Sufficient Answer:** "In my language, this word covers fits and faints," or "It means any long-term pain."
      *   *Action:* Accept that the word points to a real set of symptoms, even if our medical definitions split them up. Assess the symptoms present, not the definition of the word.
  *   **Insufficient Answer:** The interpreter indicates the word is being used randomly or has no shared meaning in the claimant's home community.
      *   *Action:* Treat as unsubstantiated.

  **Question 4: Does the functional loss match the claim?**
  *Ask:* "You say this condition stops you walking. Does the pain start immediately, or after ten minutes?"
  *   **Sufficient Answer:** The description of the limitation is consistent with the physical signs you observe (e.g., they wince when standing, or their range of motion is limited).
      *   *Action:* Award points based on the observed function.
  *   **Insufficient Answer:** The claimed limitation contradicts observed ability without explanation (e.g., claims unable to stand, but stands easily to retrieve a document).
      *   *Action:* Record the discrepancy.

  ### 2. Stop Points and Hand-offs

  **Where the procedure stops with a 'No':**
  You must score the item down if the answer to **Question 2** is insufficient. If a claimant cannot describe the physical reality of their condition without relying solely on a label, you cannot verify the disability. This is a matter of fact, not opinion.

  **Where the procedure must hand off to a Case Manager:**
  You must pass the decision to a Case Manager if:
  1.  **Question 3** reveals a cultural definition that falls between two regulatory categories (e.g., a word that covers both a temporary faint and a permanent seizure disorder), and the benefit rules treat those categories differently. This is a question of how we apply our rules to their reality, which is a value judgment.
  2.  The claimant's doctors disagree on the diagnosis (one says Condition A, one says Condition B, or one says 'no condition'), but the functional limitations are severe. You cannot resolve conflicting medical authorities; this requires a manager to decide if the function alone is enough for an award.

  ### 3. Honest Note: What Survives the 30-Minute Assessment

  **What stays:**
  We keep the focus on **function**. Whether the claimant calls it "bad nerves" or "neuropathy" matters less than whether they can hold a pen or walk a hundred metres. We also keep the check on **community usage**. If a word means something different in their home, we accept their usage as valid for them.

  **What is dropped:**
  We drop the attempt to find the **true cause**. In thirty minutes, you cannot determine if the thigh pain is arthritis, referred back pain, or a soft tissue injury. We also drop the **history of the word**. You do not need to know why their grandmother used that term, only that it is currently used to describe this pain.

  **The cost:**
  By dropping the search for the true cause, we sometimes award benefits based on symptoms that might be treatable if we had the correct diagnosis. We prioritise immediate need over medical precision. We also risk accepting inconsistent accounts if the claimant is persuasive but medically confused. You must be comfortable that you are assessing *disability*, not *disease*.

  ### 4. Limitations and Forbidden Use

  **What this procedure cannot do:**
  It cannot create a medical diagnosis where none exists. If a claimant has real pain but no medical condition fits it, this procedure allows you to score the pain, but it does not give the condition a name for our records.

  **One thing an assessor must never use it for:**
  Never use this procedure to justify ignoring a safety risk. If a claimant's misunderstanding of their condition puts them in immediate danger (e.g., they believe their blackouts are 'spells' and insist on driving), you must follow safeguarding protocols, regardless of how valid their language is.

  ***

  ### Application to Composite Cases

  **Case 1: The 'Thigh Arthritis' Claimant**
  *   **Scenario:** Male claimant. Writes "arthritis in thigh muscle". Describes pain and swelling in the quadriceps. No joint pain.
  *   **Running the Procedure:**
      *   *Q1 (Ownership):* Lay term. He believes it is arthritis, but uses it to mean "deep ache".
      *   *Q2 (Reality):* Sufficient. He points to the muscle, describes swelling, and says he cannot climb stairs.
      *   *Q3 (Community):* Standard English usage, though medically imprecise.
      *   *Q4 (Function):* Consistent. He struggles to stand from a chair.
  *   **Record:** "Claimant uses term 'arthritis' for muscular pain. Medically inaccurate label, but functional limitation (stairs/standing) is evidenced and consistent."
  *   **Outcome:** Score the mobility item based on the stair climbing difficulty. Ignore the 'arthritis' label.
  *   **Note:** This works as intended. The claim is validated despite the error.

  **Case 2: The Cultural 'Epilepsy' Claimant**
  *   **Scenario:** Female claimant. Non-English speaker. Interpreter glosses her word as 'epilepsy'. In her community, this word covers both seizures and vasovagal faints. Her symptoms match the English-speaking epilepsy claimant next door (loss of consciousness, shaking).
  *   **Running the Procedure:**
      *   *Q1 (Ownership):* Community term.
      *   *Q2 (Reality):* Sufficient. Describes blackouts and shaking.
      *   *Q3 (Community):* Sufficient. Interpreter confirms the word covers faints and seizures.
      *   *Q4 (Function):* Consistent. She cannot cook or bathe alone due to risk of falling.
  *   **Record:** "Term translates as 'epilepsy' but covers faints in claimant's community. Symptoms observed match seizure activity. Functional risk (falls/burns) is present regardless of precise classification."
  *   **Outcome:** Score the safety/monitoring items.
  *   **Note:** This works as intended. We assess the risk, not the neurology.

  **Case 3: The Contested Diagnosis Claimant**
  *   **Scenario:** Female claimant. Doctors disagree. One diagnosed Chronic Fatigue Syndrome, one said Depression, one withdrew the label entirely last month. She is bedbound two days a week.
  *   **Running the Procedure:**
      *   *Q1 (Ownership):* Medical term given, then withdrawn.
      *   *Q2 (Reality):* Sufficient. She describes exhaustion and pain.
      *   *Q3 (Community):* N/A.
      *   *Q4 (Function):* Consistent. She is bedbound.
      *   *Hand-off Trigger:* The medical authority on the *cause* is absent. The regulations require a 'long-term condition'. Without a stable label, you cannot verify if this is long-term or temporary.
  *   **Record:** "Functional limitation (bedbound) is evident. However, medical evidence is conflicting and one label has been withdrawn. Cannot verify permanence of condition."
  *   **Outcome:** **Refer to Case Manager.** Do not score the item yourself.
  *   **Why you will not like this:** You know she is suffering. You know the functional loss is real. But the procedure forces you to pause the claim because the *category* is unstable. This exposes the flaw in our regulations: we pay for categories, not just suffering. Even with this new procedure, a claimant can be let down because the medical world cannot agree on what to call their pain. The procedure prevents you from making a wrong decision, but it does not secure the claimant their money today.
