answer: |-
  Here are ten interview questions designed to probe the conceptual depths of "inertial framing," including the specific required lines of questioning and follow-ups. Following the questions, I have outlined the points where my reasoning in constructing them is most vulnerable to philosophical or technical critique.

  ### Interview Questions

  **1. The Ontological vs. Heuristic Distinction**
  "You argue that human cognition doesn't solve the frame problem but rather inhabits an ontology where inertia is default. But isn't there a risk that you're describing a highly efficient heuristic and mistaking it for a metaphysical truth? If a system *acts* as if properties persist, does it matter whether that persistence is grounded in the nature of properties themselves or in a cognitive shortcut that assumes persistence to save processing power?"

  **2. The Relocated Computational Burden**
  "A standard objection to dispositional accounts is that they don't eliminate computational work; they just hide it. If every property carries a 'stability disposition,' the system still needs to check whether that disposition is active or suspended in any given context. Critics will say you've merely relocated the burden from explicit logical frame axioms into an obscure metaphysics of dispositions. How do you respond to the charge that 'inertial framing' is just logic wearing a metaphysical mask?"

  **3. Follow-up: Robotic Failure Modes**
  "Let's press that point into engineering. If you claim this is an ontological feature rather than an engineering detail, there must be a failure mode in a robotic planning system that indicates the system genuinely *lacks* these stability dispositions, rather than merely lacking the right logical formalism. If a robot fails to track an object because it didn't assume the object stayed put, is that a bug in its code, or evidence that it is operating in the wrong ontology? What specific behavior would prove the latter?"

  **4. Naive Physics and Developmental Psychology**
  "This sounds remarkably similar to the 'naive physics' literature in developmental psychology, where infants are shown to expect objects to have continuity and solidity before they have the language to describe them. Are you essentially rediscovering the core findings of developmental psychology, or is 'inertial framing' making a claim that goes beyond how children learn to interact with the world?"

  **5. Follow-up: Causal Powers vs. Representations**
  "If you distinguish your view from developmental psychology, I assume you'll appeal to the idea that infants are tracking real causal powers rather than building mental representations. But if the child's brain is still physically encoding these expectations, in what sense is the inertia 'out there' in the ontology rather than 'in here' in the neural architecture? How do you cash out the difference between a brain wired to expect stability and a world that *is* stable?"

  **6. The Ramification Problem**
  "Let's shift to the ramification problem, which deals with the indirect side effects of actions—if I turn on the light, the room brightens, but the switch also warms up slightly. In standard non-monotonic reasoning, tracking these indirect consequences is a nightmare. If inertia is the default, how does your framework account for ramifications that *aren't* inert? Does your ontology treat side-effects as violations of stability, and if so, doesn't that reintroduce the need to compute which stabilities are being violated?"

  **7. Follow-up: Representational vs. Ontological Systems**
  "I anticipate your reply will be that ramifications are only problematic for representational systems that need to list consequences, not for ontological systems where consequences simply happen. But a planning agent *must* anticipate consequences to act safely. If the agent inhabits an ontology where ramifications occur automatically, how does it access that automaticity without representing it? Is there a coherent middle ground where the world handles the ramification but the agent still needs to know about it?"

  **8. Temporal Granularity and Decay**
  "You describe stability as a primitive tendency to persist. But persistence is time-sensitive. A sandcastle has a different stability disposition than a diamond. Does your framework require that every property carries a specific 'decay rate' or temporal signature as part of its identity? If so, doesn't that risk collapsing back into the very parameter-tracking you argue we can avoid?"

  **9. Normativity and Prediction Error**
  "In predictive processing models, the brain is constantly minimizing prediction error. If inertia is the default state of the world, a sudden change should generate a massive prediction error signal. Does your view imply that 'surprise' is fundamentally the detection of a suspended stability disposition? And if so, does this offer a new way to explain why some changes are cognitively salient while others are ignored?"

  **10. Empirical Falsification**
  "Finally, let's talk about what would prove you wrong. We often say a theory is philosophical if it's hard to test, but you're making claims about cognitive science and robotics. What specific empirical result—in robotics, comparative cognition, or neuroscience—would genuinely undermine your view rather than being accommodated by it? If we found a creature that planned successfully without assuming inertia, would that falsify inertial framing, or would you argue that creature simply inhabits a different ontology?"

  ***

  ### Where My Reasoning Is Most Likely to Fail

  In constructing these questions, I have identified three specific areas where the conceptual ground is shaky, and where the guest may be able to turn the critique back on the interviewer.

  **1. The Isomorphism Between Successor-State Axioms and Inertial Ontology**
  *The Risk:* In Question 2 and 3, I press the distinction between "logical formalism" and "ontological disposition." However, in formal AI (specifically in the situation calculus), a Successor-State Axiom essentially codifies inertia: a fluent remains true unless an action makes it false. Mathematically, an "ontological stability disposition" and a "successor-state axiom" may be isomorphic—they produce the exact same outputs for the exact same inputs.
  *The Failure Point:* If the guest argues that the *math* is the same but the *interpretation* is what matters, my question about "relocated burden" loses its bite. The computational cost is identical regardless of whether you call it an axiom or a disposition. I may be presupposing a distinction between "representation" and "ontology" that collapses under implementation.

  **2. Circularity in Defining "Stability Dispositions"**
  *The Risk:* In Questions 4 and 5, I ask about the location of inertia (world vs. brain). However, the definition of a "stability disposition" risks circularity. To say a property has a disposition to persist is to say it will remain the same *unless caused to change*. But "cause" is often defined by the change in properties of objects that persist.
  *The Failure Point:* If the guest defines causation *through* these dispositions, my question about whether the inertia is "in here" or "out there" presupposes we can distinguish the two without already relying on the very causal framework she is proposing. I may be asking for a reduction she claims is impossible by definition.

  **3. The Indistinguishability of Architectural Failure**
  *The Risk:* In Question 3, I ask for a robotic failure mode that distinguishes "lack of disposition" from "lack of logic." In modern deep learning or subsumption architectures, the distinction between "logic," "architecture," and "ontology" is notoriously blurred. A neural network's weights encode both the "laws" and the "states."
  *The Failure Point:* I am presupposing a modular view of robotics (where logic is separate from hardware) that may not hold in the systems best suited to test her theory. If the system is a black box, there may be no observable behavioral signature that distinguishes a metaphysical lack of inertia from a simple training deficit. My question assumes a transparency in robotic planning that current engineering does not support.
