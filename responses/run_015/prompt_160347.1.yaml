prompt: |-
  I have spent fifteen years as a curator of South Asian collections, and four months ago my director asked me to chair the interpretation group for a complete rewrite of our permanent galleries — around four hundred object labels, sixty panel texts and our school-facing worksheets — after a trustee described the museum as a museum of Europe with a few annexes. Our board responded by adopting a framing principle, and my job is to turn it into something my writers can actually run:

  *A text should not make something count as an event in the history of the world because of its effects on, or resemblance to, a European trajectory; and it should not treat any one society as the silent standard against which others are marked as early, late, failed, missing, or about-to-be.*

  That is the whole of what I was given. My writers are six regional specialists with no training in historiography, working mostly in English with one fluent Persianist and one Sinologist; they have about twenty minutes per label, a seventy-word ceiling, and no realistic access to the scholarly literature on anything outside their own region. I have a community advisory panel that meets monthly, so escalating a question to them costs four to six weeks, and I cannot escalate four hundred labels to them.

  We have already tried two shortcuts and they failed. The first was: delete Europe from the sentence and see whether it still says something — but it kept flagging labels for objects that entered the collection through empire, where the European connection genuinely is the reason the object is here. The second was counting mentions of continents per panel, which told us nothing we did not know.

  What I need is a decision procedure: the tests to apply in order, what counts as a sufficient answer to each, where the procedure stops with a no, and where it hands the decision to the panel because the question is one of values rather than facts. It has to work at two levels, because I think the principle bites hardest not inside sentences but in the scaffolding — gallery titles, the period names we organise the sequence by, and which objects we chose to acquire and display at all — and my writers will apply it to individual labels. Please also tell me which distinctions inside the principle have to survive being simplified for non-specialists and which can be dropped without loss.

  Three cases to run it on:

  Our draft label on Indian cotton textiles, which currently asks why the subcontinent did not have an industrial revolution of its own, given that it was the world's leading producer of cloth well into the eighteenth century.

  Our proposed gallery spine, which is at present: Ancient Worlds — The Age of Discovery — Revolution and Industry — The Modern World.

  And a label the team is proud of, on printing: it says that movable type was in use in Korea and in China centuries before Gutenberg, which was meant as our corrective. If the procedure tells me this label is also a failure, I want to be told plainly and to understand why.

  Two further things. Our collection was largely assembled under empire and our provenance research is unfinished, so for some objects the only usable sources are colonial administrative ones: the procedure has to say what a writer does when the archive itself is the problem. And please separate, in your answer, what is settled from what is genuinely contested among historians and philosophers of history who work on this — including whether the board's principle itself is defensible, whether comparison of any kind can avoid a yardstick, and whether Europe is even a coherent unit to be decentring. My writers will be told which parts they may repeat as received opinion and which they must present as one view among others, so I need that distinction marked rather than smoothed over.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **User:** Experienced curator (15 years) of South Asian collections.
      *   **Task:** Chairing an interpretation group for a complete rewrite of permanent galleries (400 labels, 60 panels, worksheets).
      *   **Trigger:** Trustee called the museum "a museum of Europe with a few annexes."
      *   **Constraint/Principle:** "A text should not make something count as an event in the history of the world because of its effects on, or resemblance to, a European trajectory; and it should not treat any one society as the silent standard against which others are marked as early, late, failed, missing, or about-to-be."
      *   **Team:** 6 regional specialists (no historiography training), mostly English, 1 Persianist, 1 Sinologist. 20 mins/label, 70-word ceiling. Limited access to non-regional scholarship.
      *   **Resources:** Community advisory panel (monthly, 4-6 week turnaround). Cannot escalate 400 labels.
      *   **Failed Attempts:** 1. "Delete Europe" test (failed on imperial provenance). 2. Counting continent mentions (useless).
      *   **Needs:**
          1.  A decision procedure (tests in order, pass/fail criteria, escalation points).
          2.  Two levels: Scaffolding (titles, periods, acquisition) and Labels (text).
          3.  Simplification guide: What distinctions in the principle must survive vs. can be dropped for non-specialists.
          4.  Application to 3 cases: Indian cotton (industrial revolution question), Gallery Spine (Ancient/Discovery/Revolution/Modern), Korean/Chinese Printing (Gutenberg comparison).
          5.  Archive/Provenance issue: What to do when colonial sources are the *only* sources.
          6.  Historiographical Context: Separate settled vs. contested debates (defensibility of principle, comparison/yardsticks, coherence of "Europe").

  2.  **Deconstruct the Principle:**

      *   *Clause 1:* "not make something count as an event... because of its effects on, or resemblance to, a European trajectory." (Teleology/Eurocentrism).
      *   *Clause 2:* "not treat any one society as the silent standard against which others are marked as early, late, failed, missing, or about-to-be." (Normative Benchmarking/Deficit Model).
      *   *Core Tension:* How to acknowledge historical connection (empire, trade) without making Europe the protagonist or the goal.

  3.  **Develop the Decision Procedure:**

      *   *Goal:* Fast, actionable, minimizes escalation.
      *   *Level 1: Scaffolding (Gallery Structure).* This needs high-level review, likely by the Curator + Panel, not writers.
      *   *Level 2: Labels (Writers).* Needs a checklist they can apply in 20 mins.
      *   *Test 1: The Subject Test.* Who/what is the grammatical subject? Is Europe the actor?
      *   *Test 2: The Teleology Test.* Is the outcome measured by how close it gets to a European equivalent?
      *   *Test 3: The Deficit Test.* Does it use words like "failed," "late," "missing"?
      *   *Test 4: The Connection Test (for Empire).* If Europe is mentioned, is it as *context* or as *purpose*?
      *   *Escalation:* Only when the archive forces a colonial narrative that can't be reframed without lying.

  4.  **Simplify the Principle for Writers:**

      *   *Keep:* The "Silent Standard" (Deficit Model). This is the easiest to spot.
      *   *Keep:* The "European Trajectory" (Teleology).
      *   *Drop/Nuance:* The philosophical coherence of "Europe." Writers don't need to deconstruct Europe; they need to avoid using it as a benchmark.
      *   *Distinction:* Connection vs. Causation. It's okay to say "British bought this." It's not okay to say "This matters because British bought this."

  5.  **Apply to Cases:**

      *   *Case 1: Indian Cotton/Industrial Revolution.*
          *   *Problem:* "Why no industrial revolution?" presupposes the IR is the goal.
          *   *Verdict:* Fail.
          *   *Fix:* Focus on global demand, technological innovation *within* India, or why production shifted (tariffs/colonial policy) rather than "failure to industrialize."
      *   *Case 2: Gallery Spine.*
          *   *Problem:* "Age of Discovery" (Eurocentric), "Revolution and Industry" (implies British model), "Modern" (often coded Western).
          *   *Verdict:* Fail.
          *   *Fix:* Chronological or Thematic (e.g., "Exchange," "Belief," "Power").
      *   *Case 3: Printing (Korea/China vs. Gutenberg).*
          *   *Problem:* "Centuries before Gutenberg." This *is* using Europe as the benchmark (just reversing the value). It defines the achievement by its relation to Gutenberg.
          *   *Verdict:* Fail (per the strict principle).
          *   *Fix:* State the date and significance within East Asian literacy/administration contexts. Mention Gutenberg only if necessary for global synchronization, not as the anchor.

  6.  **Address the Archive/Provenance Issue:**

      *   *Reality:* Colonial records are biased.
      *   *Procedure:* Acknowledge the source. "Recorded by colonial officers as..." vs "This object is..."
      *   *Ethical stance:* Don't sanitize, but contextualize the bias. If the *only* story is colonial, say "Our knowledge of this object comes from..."

  7.  **Historiographical Context (Settled vs. Contested):**

      *   *Settled:* "Modernization Theory" (stages of growth ending in West) is largely discredited. "Great Divergence" debates acknowledge multiple paths.
      *   *Contested:* Can you *ever* compare without a yardstick? (Incommensurability vs. Comparison). Is "Europe" a valid category? (Many historians say no, it's a construct). Is the Board's principle too restrictive? (Some argue it erases entanglement).
      *   *Advice:* Tell writers the "Deficit Model" is settled bad practice. Tell them the "No Comparison" rule is a museum policy choice, not universal historical law.

  8.  **Drafting the Response:**

      *   *Tone:* Professional, empathetic to the constraint, rigorous, actionable.
      *   *Structure:*
          1.  Historiographical Context (Settled vs. Contested) - *Get the theory out of the way first so the procedure makes sense.*
          2.  Simplification Guide (What to keep/drop).
          3.  The Decision Procedure (Scaffolding vs. Labels).
          4.  The Archive/Provenance Protocol.
          5.  Case Studies Application.
      *   *Refinement:* Ensure the distinction between "Europe as Actor" (empire) and "Europe as Benchmark" (teleology) is clear. This was the user's specific pain point with the first failed shortcut.

  9.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the printing case too harsh?
      *   *Adjustment:* The prompt asks me to be plain if it's a failure. The principle explicitly says "not... because of its... resemblance to a European trajectory." Saying "Before Gutenberg" defines it by resemblance/sequence to a European trajectory. It *is* a failure under this specific principle, even if it feels like a "correction." I must explain *why* it's still Eurocentric (Gutenberg remains the anchor).
      *   *Critique:* Is the procedure too complex for 20 mins?
      *   *Adjustment:* Make it a flowchart style checklist. Yes/No questions.
      *   *Critique:* How to handle the "Europe" coherence question?
      *   *Adjustment:* Put this in the "Contested" section. Writers don't need to solve it, but they need to know the Board has solved it *for them* as a policy, even if historians debate it.

  10. **Final Polish:** Check against all constraints (70-word ceiling mention, panel escalation limits, specific cases). Ensure the distinction between "Settled" and "Contested" is explicit. (Proceed to generate output).

  *(Self-Correction on the Printing Case)*: I need to be careful. The principle says "not make something count as an event... because of its effects on, or resemblance to, a European trajectory." Saying "Korea did X before Gutenberg" makes the event count *because* of its relation to Gutenberg. It validates Korea by European standards of priority. It fails the principle. I will stand by this but explain the nuance.

  *(Self-Correction on Archive)*: The user said "provenance research is unfinished." I need to advise on *language* that signals uncertainty without undermining authority. "According to 19th-century records..."

  *(Final check on Historiography)*: Ensure I mention the "Great Divergence" (Pomeranz) as settled context for the Cotton case. Ensure I mention "Connected Histories" (Subrahmanyam) as a middle ground.

  Let's assemble.
answer: |-
  This is a precise operational challenge. You are asking for a compliance mechanism for a historiographical ethic. Below is the decision procedure, the simplification guide, the case applications, and the historiographical context you requested.

  ### Part 1: Historiographical Context (Settled vs. Contested)

  Your writers need to know what is museum policy versus what is historical consensus. Do not blur these.

  **1. The "Deficit Model" (Marking societies as early/late/failed)**
  *   **Status:** **Settled.** Among professional historians of Asia, Africa, and the Americas, measuring societies against a European timeline of "development" is considered methodologically flawed. It relies on Modernization Theory (1950s), which has been largely discarded in favor of "Multiple Modernities" or "Global History."
  *   **Instruction to Writers:** Treat this as fact. Do not present this as a debate.

  **2. The Coherence of "Europe"**
  *   **Status:** **Contested.** Many historians argue "Europe" is not a coherent historical actor but a retrospective construct. However, for museum policy, it functions as a shorthand for "North Atlantic/Western" trajectories.
  *   **Instruction to Writers:** They do not need to deconstruct "Europe." They must treat it as a *geographic descriptor*, not a *teleological goal*.

  **3. Comparison Without a Yardstick**
  *   **Status:** **Contested.** Philosophers of history debate whether comparison is possible without a shared metric (the "tertium comparationis"). Your Board's principle effectively bans *normative* comparison (better/worse/ahead/behind) but allows *relational* comparison (trade/war/influence).
  *   **Instruction to Writers:** They may compare interactions (e.g., "traded with"), but not developmental status (e.g., "more advanced than").

  **4. The Defensibility of the Principle**
  *   **Status:** **Policy.** Whether this principle is "true" is irrelevant; it is the museum's ethical mandate. However, some historians (e.g., proponents of "Connected Histories") argue that erasing Europe entirely obscures the reality of empire.
  *   **Instruction to Writers:** The principle is not asking to erase Europe; it is asking to erase Europe as the *protagonist*.

  ---

  ### Part 2: Simplification Guide for Writers

  You cannot ask writers to parse "European trajectory" in twenty minutes. You must distill the principle into operational heuristics.

  **Distinctions that MUST survive simplification:**
  1.  **Connection vs. Benchmark:** It is permissible to say a British officer collected an object (Connection). It is forbidden to say the object matters *because* a British officer collected it (Benchmark).
  2.  **Sequence vs. Progress:** It is permissible to say Event A happened before Event B. It is forbidden to imply Event A was "primitive" and Event B "advanced."
  3.  **Internal vs. External Logic:** Explain why a society did something based on *their* needs, not based on why they didn't do what Europe did.

  **Distinctions that can be DROPPED:**
  1.  **The definition of "Europe":** Writers do not need to worry about whether Russia or the Mediterranean counts. If the text implies "The West" is the destination of history, flag it.
  2.  **The philosophical "Why":** Writers do not need to understand *why* Eurocentrism is harmful, only *how* to spot it in syntax.

  ---

  ### Part 3: The Decision Procedure

  This procedure is split into **Level 1 (Scaffolding)**, which you and the Panel must handle, and **Level 2 (Labels)**, which writers apply.

  #### Level 1: Scaffolding (Gallery Titles, Periodization, Selection)
  *Do not delegate this to writers.*
  1.  **The Period Test:** Do the period names imply a single global timeline culminating in the present West? (e.g., "Industrial," "Modern," "Discovery").
      *   *If Yes:* Escalate to Curator/Panel.
  2.  **The Selection Test:** Is an object included primarily because it illustrates a European interest (e.g., "The King's Gift") rather than its culture of origin's practice?
      *   *If Yes:* Re-evaluate object selection or reframe the narrative to focus on the *giver's* intent.

  #### Level 2: Label Text (The 20-Minute Checklist)
  Writers apply these four tests in order. If a label fails any test, it must be rewritten before leaving their desk.

  **Test 1: The Subject Test**
  *   **Question:** Is Europe/The West the grammatical subject or the active agent of the main verb?
  *   **Pass:** "Merchants in Gujarat wove..."
  *   **Fail:** "British traders discovered..." (unless the label is specifically about the act of discovery).
  *   **Stop Condition:** If the object's *presence in the museum* is due to empire, proceed to Test 4.

  **Test 2: The Deficit Test**
  *   **Question:** Does the text use comparative adjectives implying a lack or delay? (e.g., *failed, late, missing, yet, still, before, primitive, sophisticated*).
  *   **Pass:** "Production continued until 1800."
  *   **Fail:** "Production continued until 1800, *before* industrializing."
  *   **Stop Condition:** If "failed" or "late" appears, rewrite immediately.

  **Test 3: The Anchor Test**
  *   **Question:** Is a European event/person/date used to date or validate the non-European object?
  *   **Pass:** "Made in 1450."
  *   **Fail:** "Made 50 years before Gutenberg."
  *   **Stop Condition:** If a European name is the only time-marker, rewrite.

  **Test 4: The Archive Test (Provenance)**
  *   **Question:** If the only source is colonial, does the text present the colonial view as fact?
  *   **Pass:** "Colonial records describe this as..."
  *   **Fail:** "This was used for..." (when based solely on a colonial guess).
  *   **Escalation Point:** If the colonial archive is the *only* source and framing it as colonial undermines the object's dignity, **escalate to Panel.** This is a values question, not a text edit.

  ---

  ### Part 4: Application to Your Three Cases

  #### Case 1: Indian Cotton Textiles
  *   **Current Draft:** "Why the subcontinent did not have an industrial revolution of its own..."
  *   **Procedure Result:** **FAIL (Test 2: Deficit Test).**
  *   **Reasoning:** It posits the Industrial Revolution as the necessary outcome of cloth production. It frames Indian history as a "failure to become Britain."
  *   **Correction:** Focus on the *global* context. "Indian weavers supplied global markets until tariff barriers and colonial policy shifted production to British mills." This shifts the cause from "Indian failure" to "Global power dynamics."
  *   **Historiography:** This aligns with the "Great Divergence" consensus (Pomeranz, etc.), which is settled enough for label text.

  #### Case 2: Gallery Spine
  *   **Current:** Ancient Worlds — The Age of Discovery — Revolution and Industry — The Modern World.
  *   **Procedure Result:** **FAIL (Level 1: Period Test).**
  *   **Reasoning:**
      *   "Age of Discovery" centers the European viewer (discovered *by whom*?).
      *   "Revolution and Industry" implies the British model is the defining global event.
      *   "Modern World" is often coded as "Westernized."
  *   **Correction:** Use thematic or neutral chronological spines. E.g., "Early Cities — Global Exchange — Technologies of Power — Contemporary Voices."
  *   **Note:** This requires Board/Panel approval, not writer edits.

  #### Case 3: Printing (Korea/China vs. Gutenberg)
  *   **Current Draft:** "Movable type was in use in Korea and China centuries before Gutenberg."
  *   **Procedure Result:** **FAIL (Test 3: The Anchor Test).**
  *   **Reasoning:** This is the hardest pill to swallow. While intended as a correction, it still uses Gutenberg as the *anchor*. It defines the Asian achievement solely by its temporal relationship to the European one. It makes Gutenberg the "zero hour."
  *   **Correction:** "Movable type was developed in East Asia during the 11th century to meet demands for mass literacy and bureaucratic administration." (Mention Gutenberg only in a separate "Global Timeline" panel if absolutely necessary, not in the object's primary significance).
  *   **Why:** The principle forbids making something count *because of its resemblance to* a European trajectory. Being "earlier than" is a resemblance of trajectory.

  ---

  ### Part 5: The Archive & Provenance Protocol

  You noted that colonial sources are sometimes the only sources. The procedure must not force writers to lie.

  **The "Attribution of Voice" Rule:**
  When the archive is colonial, the label must attribute the information to the archive, not the object.
  *   **Bad:** "This idol was worshipped by superstitious locals." (Repeats colonial bias as fact).
  *   **Good:** "British officers recorded this as an idol used in local worship." (Attributes the claim).
  *   **Good:** "While colonial records classify this as a weapon, community elders describe it as a ritual staff." (If Panel provides counter-narrative).

  **Escalation Trigger:**
  If a writer cannot write a label without repeating a colonial slur or falsehood because no other data exists, **stop.** Do not write the label. Flag the object for the Community Panel to decide: *Do we display this with a warning, or not at all?* This is a values decision, not a writing task.

  ### Summary of Workflow for Your Team

  1.  **Scaffolding:** You and the Panel fix the Gallery Spine first. Writers cannot fix "Age of Discovery" in 70 words.
  2.  **Training:** Run a 1-hour workshop on the **Four Tests** (Subject, Deficit, Anchor, Archive). Use the Printing label as the training example of a "well-meaning failure."
  3.  **Drafting:** Writers apply the checklist.
  4.  **Escalation:** Only objects where the *only* available story is a colonial lie go to the Panel. Everything else is a rewrite.

  This procedure respects your writers' time, adheres strictly to the Board's principle, and isolates the genuine ethical dilemmas for the Panel rather than drowning them in text edits.
