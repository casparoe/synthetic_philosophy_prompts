  **Sub-Credences:**

  (a) **0.80** — Neural latency data indicates conscious awareness lags stimulus onset, favouring post-hoc construction over real-time Orwellian editing.
  (b) **0.60** — Empirical evidence for discrete perceptual snapshots generalising across all motion paradigms and modalities remains mixed and controversial.
  (c) **0.70** — Even if perception is retrospective, some philosophical accounts maintain that the integration window itself constitutes a robust specious present.
  (d) **0.70** — Predictive processing offers a coherent theoretical framework for delayed inference, though it is not yet a confirmed law of neural function.

  **Combination Logic:**
  The overall credence is calculated as the conjunctive probability of the four components ($0.80 \times 0.60 \times 0.70 \times 0.70 = 0.2352$), rounded to 0.24, reflecting that the thesis requires all empirical and metaphysical links to hold simultaneously.

  **Weakest Link:**
  Sub-credence (b) is the weakest link; raising this value by 0.20 (to 0.80) would increase the overall credence to approximately 0.32, a more significant absolute gain than adjusting any other factor. This shift would be produced by definitive neurophysiological evidence, such as MEG decoding, demonstrating that intermediate qualitative states are strictly absent during the integration window rather than merely inaccessible to report.

  **Settled Science vs. Contested Interpretation:**

  It is settled within cognitive science that the colour phi phenomenon exists and that neural processing involves a latency period of roughly 80 to 200 milliseconds before stimuli are fully integrated. It is also settled terminology to distinguish between Stalinesque (post-hoc fabrication) and Orwellian (memory alteration) explanations, as introduced by Daniel Dennett.

  However, it remains genuinely contested whether the Stalinesque mechanism applies universally to reverse-phi motion and cross-modal binding, as some models suggest continuous conscious streaming rather than discrete snapshots. Furthermore, while predictive coding is a dominant framework, it is not universally accepted as the correct explanation for temporal binding. Finally, the metaphysical conclusion—that these mechanisms eliminate any substantive specious present—is heavily debated; many philosophers argue that the neural integration window *is* the physical realiser of the specious present, meaning retrospective construction does not necessarily negate temporal thickness in consciousness.
