answer: |-
  Brainstorming: The core tension lies between Lian's view of myth as a palimpsest (history written over but still present) and Kess's view of myth as a generator (story creates meaning, not records facts). Lian relies on archaeological correlation (Schliemann) and textual stratification, while Kess relies on oral formulaic theory and functionalism (myth serves identity, not annals). Troy is the strongest case for Lian; Exodus is the strongest for Kess; Arthur sits in the middle as literary historiography. The dialogue must ensure Kess doesn't deny archaeology but denies its narrative link, and Lian doesn't deny myth but insists on a core.

  1. Lian: Schliemann found Troy because mnemonic sediment preserves the kernel of conflict beneath the poetic accretion of the *Iliad*. Kess: Finding ruins only proves a city existed, not the war, because oral transmission acts as a coherence filter that reshapes facts to fit heroic ideals.
  2. Lian: Yet stratified testimony analysis allows us to peel back Homeric embellishment to reveal the Bronze Age collapse underneath. Kess: That peeling is arbitrary, much like assuming a historical warlord hides beneath Arthur simply because the narrative feels too specific to be pure invention.
  3. Lian: Arthur's battle list in the *Historia Brittonum* cites specific locations aligning with fifth-century resistance, indicating a preserved historical trace. Kess: Those locations are symbolic geography chosen for literary symmetry, proving the story works like a shadow that changes shape regardless of the object casting it.
  4. Lian: Even the Exodus, while theological, retains the socio-political memory of Semitic groups departing Egypt during the New Kingdom. Kess: Treating Exodus as history ignores how foundational myths function to define identity rather than record events, making your stratified analysis a category error.
  5. Lian: If we deny the sediment, we ignore how cultures actually preserve trauma and victory through narrative fossilization. Kess: And if you mistake the fossilized narrative for the living event, you confuse the map with the territory and lose the truth of both.
