  Your grad student has constructed a classic philosophical trap, often called the "Presentist Dilemma." It feels inescapable because it conflates three distinct layers of historical practice: ontology (where we stand), epistemology (how we know), and axiology (what we value).

  Your intuition is correct: the logical slide happens between **(3)** and **(4)**.

  Here is the breakdown of why the argument works, where it breaks, and what you pay to fix it.

  ### The Trap Mechanism
  The argument relies on an equivocation on the phrase "present concerns."
  *   **In Step (3)**, "inhabiting the present" is an **ontological** claim. It means you exist in the current moment. This is undeniable.
  *   **In Step (4)**, "anchored in present concerns" shifts to an **axiological** claim. It implies your *criteria for significance* are determined by current values, outcomes, or teleologies.

  The student argues that because you cannot escape the *ontological* present (3), you cannot escape the *axiological* present (4). This is a non-sequitur. I can stand in 2024 and ask, "What did this event mean to a peasant in 1348?" My *question* is asked now, but the *standard of relevance* is located then.

  ### Why Step (4) Looked Fine
  Step (4) looks plausible because of the **Context of Discovery vs. Context of Justification** confusion.
  *   **Discovery:** Why did you choose this topic? Probably because of a present concern (e.g., current political anxiety).
  *   **Justification:** Why is this event historically significant *in your narrative*? This can be based on past internal logic, not present outcomes.

  The student conflates the *motivation to write* (present) with the *criteria of selection* (which can be past-oriented). By accepting (4), you concede that your *filter* is presentist, which makes Step (5) (the definition of Whig history) stick.

  ### The Cost of Rejecting (4)
  If you reject (4), you are claiming that historians can select events based on "past significance" rather than "present utility."
  *   **The Cost:** You must defend **Methodological Contextualism**. You have to argue that "significance to the actors then" is a coherent, accessible category that doesn't collapse into "significance to us now."
  *   **The "Modal Neutrality" Fear:** You worried this forces you into an implausible "modal neutrality" (a view from nowhere). It doesn't. It only requires you to admit that while your *perspective* is situated (Step 3), your *standards* can be empathetic/reconstructive. You aren't claiming a view from nowhere; you're claiming a view from *here* looking *there*.

  ### Why Not Reject (5)?
  You could reject (5) by arguing Butterfield only meant *teleological* judgment is Whig, not *any* present interest. This is historically accurate, but logically weaker in this specific syllogism. If you accept (4), the student can argue that *any* selection based on present interest is a form of Whiggism, forcing you into a definitional war. Rejecting (4) cuts the chain earlier: it denies the necessity of presentist *criteria*, preserving the possibility of non-Whig history without needing to redefine Butterfield.

  ### Verdict
  Rejecting (4) saves history from being inherently Whig, but it burdens you with the task of defending the coherence of "past significance" against the charge that it's just disguised presentism.

