      *Wait, one nuance:* The user asks about Premise 2 specifically ("If a belief was produced by a process that doesn't track the truth..."). The realist usually attacks the application of this to morality, not the principle itself. Or they argue that evolution *does* track truth in perception but not morality. I need to make that distinction clear.

