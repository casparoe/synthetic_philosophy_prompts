  # The Heritability Licence Decision Tree

  **Start Point:** You accept $h^2 = 0.6$ for grip strength in British 60-year-olds.

  ---

  ### Node 1: The Between-Group Inference
  **Claim:** Does this 0.6 justify the guess that genetic differences cause the average grip strength gap between UK and French 60-year-olds?
  *   **Yes** $\rightarrow$ Go to **Leaf 1**.
  *   **No** $\rightarrow$ Go to **Node 2**.

  ### Node 2: The Individual Attribution
  **Claim:** Does this 0.6 mean that 60% of *your* specific grip strength is caused by your genes?
  *   **Yes** $\rightarrow$ Go to **Leaf 2**.
  *   **No** $\rightarrow$ Go to **Node 3**.

  ### Node 3: The Mean Shift
  **Claim:** Does this 0.6 imply that a national exercise programme would fail to increase the *average* grip strength of the cohort?
  *   **Yes** $\rightarrow$ Go to **Leaf 1**. *(Merged with Leaf 1)*
  *   **No** $\rightarrow$ Go to **Node 4**.

  ### Node 4: The 100% Variance Case
  **Claim:** If $h^2$ were 1.0, would an environmental fix be unable to make everyone's grip strength identical?
  *   **Yes** $\rightarrow$ Go to **Leaf 3**.
  *   **No** $\rightarrow$ Go to **Node 5**.

  ### Node 5: The 0% Variance Case
  **Claim:** If $h^2$ were 0.0, would the trait be guaranteed easy to change with any environmental intervention?
  *   **Yes** $\rightarrow$ Go to **Leaf 3**. *(Merged with Leaf 3)*
  *   **No** $\rightarrow$ Go to **Node 6**.

  ### Node 6: The Response Heritability (GxE)
  **Claim:** Does this 0.6 tell you whether some genotypes benefit *more* from training than others?
  *   **Yes** $\rightarrow$ Go to **Leaf 4**.
  *   **No** $\rightarrow$ Go to **Node 7**.

  ### Node 7: The Cohort Stability
  **Claim:** Should we expect this 0.6 to hold for British 20-year-olds?
  *   **Yes** $\rightarrow$ Go to **Leaf 5**.
  *   **No** $\rightarrow$ Go to **Leaf 6**.

  ---

  ### The Leaves (Positions)

  **Leaf 1: The Naive Hereditarian**
  *   **Commitment:** You must treat population variance statistics as explanations for mean differences between groups or individuals, ignoring systematic environmental confounds.
  *   **Note:** This leaf collects both Node 1 (Group) and Node 3 (Mean) errors; the tree does not separate the belief that "genes explain group gaps" from "genes fix the population mean."

  **Leaf 2: The Individual Determinist**
  *   **Commitment:** You must defend the mathematical coherence of assigning a percentage cause to a single data point (e.g., "60% of *this* number").
  *   **Flag:** **Leaf 1 and Leaf 2 are empirically indistinguishable in policy debates.** Both positions license the same fatalism about intervention, even though one is about groups and one is about individuals.

  **Leaf 3: The Malleability Skeptic**
  *   **Commitment:** You must believe that high heritability blocks environmental variance elimination (PKU style) AND that zero heritability guarantees environmental malleability (e.g., that 'number of hearts' is changeable).
  *   **Note:** This leaf merges the 100% and 0% scenarios. It captures your mate's correct intuition (that $h^2$ doesn't bound malleability) by identifying those who think it *does* as holding a single contradictory position.

  **Leaf 4: The Interaction Confusionist**
  *   **Commitment:** You must conflate the heritability of the *trait* (intercept) with the heritability of the *response to environment* (slope).
  *   **Note:** This addresses your second point. A 'No' here is correct: $h^2$ of grip strength does not license claims about $h^2$ of training response, though the latter can exist.

  **Leaf 5: The Static Hereditarian**
  *   **Commitment:** You must treat heritability as a fixed property of the trait rather than a snapshot of a specific population at a specific time.
  *   **Note:** This addresses your fourth point. This position is usually empty/incoherent because variance components shift as environments homogenize or diversify with age.

  **Leaf 6: The Contextual Biometrician**
  *   **Commitment:** You must accept that $h^2=0.6$ licenses no claims about groups, individuals, malleability, response slopes, or other cohorts—it only describes variance partitioning in British 60-year-olds *now*.
  *   **Note:** This is the "Correct" position. It is awkward because it renders the number almost useless for the policy questions economists usually want to ask.

  ---

  ### Structural Notes for the Reading Group

  1.  **Empty/Incoherent Combinations:** **Leaf 5 (Static Hereditarian)** is effectively empty. No serious biometrician holds this. It exists in the tree only to catch the assumption that $h^2$ is a biological constant rather than a population statistic.
  2.  **Unseparable Leaves:** As flagged in **Leaf 2**, the tree cannot practically separate the **Naive Hereditarian (Leaf 1)** from the **Individual Determinist (Leaf 2)** in a policy context. Both licenses lead to the same refusal of intervention, even though the statistical errors differ (ecological fallacy vs. variance decomposition error).
  3.  **The Age Question:** Node 7 treats age as a final stability check. It is not a consequence of the other nodes; it is a separate validity condition. $h^2$ often rises with age (as individuals select environments matching genotypes), so assuming stability (Leaf 5) is a distinct error from assuming malleability (Leaf 3).
  4.  **The GxE Question:** Node 6 isolates the "response heritability" query. It is a different question wearing heritability clothes. The tree forces a 'No' to reach the Correct Position (Leaf 6), acknowledging that while response *can* be heritable, the baseline $h^2$ doesn't tell you that.
