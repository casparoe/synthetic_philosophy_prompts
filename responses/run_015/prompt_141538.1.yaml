answer: |-
  Consider the "Autonomic Codex," a thick volume bound not with glue but with a complex lattice of catgut springs and brass gears embedded deeply within the spine, appearing externally as a standard leather-bound folio. The pages are printed with variable-friction inks that react to ambient humidity, causing specific sheets to expand and catch against spine-mounted levers, which mechanically turn subsequent pages in a cascade determined by the text's prior arrangement rather than any external program. The system is closed: the tension in the binding represents activation levels, the visible text on the open spread constitutes the current representational content, and the sequence of page-turns implements a state-transition topology isomorphic to a conscious human mind, all driven solely by environmental interaction and internal mechanical feedback without any human opening it or electricity flowing within it.

  **Verdicts and Reasoning**
  **Functionalism** verdict: **Conscious.** Reasoning: Functionalism holds that mental states are defined by their causal roles and relations to inputs, outputs, and other states, not by their physical substrate. Since the Codex implements a causal topology isomorphic to a conscious mind using paper and gears, it satisfies the necessary and sufficient conditions for consciousness.
  **Biological Theory** verdict: **Not Conscious.** Reasoning: Biological naturalism ties consciousness to specific biological processes (e.g., neuronal metabolism, organic causation). Since the Codex is composed of dead paper, ink, and brass without metabolic activity, it lacks the necessary substrate for consciousness regardless of its functional organization.

  **Feature Doing the Work**
  The single feature driving the Functionalist verdict is the **functional isomorphism** (the specific causal organization of page-turns and tensions). If this feature is removed—such that the pages still turn via humidity and gears but in a random, non-isomorphic sequence—while holding the material substrate fixed, the **Functionalist verdict changes to "Not Conscious"** (because the causal structure is broken), whereas the **Biological verdict remains "Not Conscious"** (because the substrate is still non-biological). This isolates the functional organization as the sole variable Functionalism relies upon to attribute mind.

  **The Attack**
  The defender of **Functionalism** ends up with the less appealing result (the counter-intuitive claim that a book is conscious) and would attack the case as cheating. They would argue that the object is **no longer really a book**, but rather a mechanical robot or computer disguised as a volume. By embedding gears and self-actuating mechanisms, the scenario violates the semantic constraint of "book" (typically understood as an inert record), thereby shifting the debate from "Can a book be conscious?" to "Can a machine be conscious?", which sidesteps the original intuition pump about inert artifacts.
