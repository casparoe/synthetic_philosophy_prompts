  *(Refining the Architecture/Data point)*: Is it possible to hard-code something truly unrevisable? Yes, a mask or a fixed activation function. But Quine would say: *Why* did you choose that? To minimize loss. If it stops minimizing loss, you change it. So the *justification* is empirical, even if the *mechanism* is fixed. That's the Quinean point.

