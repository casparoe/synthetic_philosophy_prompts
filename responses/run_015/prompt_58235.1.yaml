          *   Move 2 (Jess): "Clearly Right" on the burden of proof and the intent distinction.
          *   Move 3 (Mark): "Partially Right" on risk reduction, "Logically Weak" on the wait time contradiction.
          *   Move 4 (Jess): "Clearly Right" on the practical critique.
      *   *Refining the "What's Missing":* Systemic bias is the big one. Also, the definition of "retribution" (is it societal healing or just vengeance?).

