answer: |-
  To construct a coherent theory of transgenerational collective culpability that avoids both metaphysical mysticism and individualist reductionism, we must first specify what such a theory is required to achieve. The following desiderata are not arbitrary preferences but are derived from the logical requirements of moral agency, the phenomenology of collective identity, and the normative demands of justice.

  ### I. The Desiderata of Adequacy

  A viable theory must satisfy the following six requirements.

  **1. The Non-Evaporation Condition**
  *   **Requirement:** The theory must explain why obligations (reparations, apologies, institutional reform) persist even when the biological population has completely turned over.
  *   **Motivation:** If culpability evaporates upon the death of the last direct participant, then no historical injustice lasting longer than a human lifespan can be addressed. This contradicts the robust intuition that the *state* of Germany owes obligations regarding the Holocaust, even when no living German committed the acts. A theory that reduces the collective to a statistical sum of current individuals fails this condition immediately.
  *   **Why it is required:** Without this, the concept of "historical justice" is incoherent. It is not a prejudice to demand that the duration of a wrong's effects does not automatically nullify the duty to address them.

  **2. The Non-Mystical Condition (Ontological Parsimony)**
  *   **Requirement:** The theory cannot rely on a metaphysical "group soul" or a literal, substantial identity that transcends space and time. The collective must be explicable in naturalistic terms (institutions, laws, culture, resources).
  *   **Motivation:** Claiming that "France today is literally the same entity as France in 1750" in a substantial sense invites occult metaphysics. We need a account of identity that is compatible with a physicalist worldview.
  *   **Why it is required:** If the theory depends on mystical continuity, it becomes immune to empirical falsification and loses normative bite. If the "nation" is a ghost, its obligations are ghostly.

  **3. The Differentiation Condition**
  *   **Requirement:** The theory must distinguish between past wrongs that generate current obligations and those that do not. It must explain why we owe reparations for chattel slavery but not for the Norman Conquest or Roman expansionism.
  *   **Motivation:** If every historical wrong generated liability, the world would be paralyzed by infinite cross-claims. There must be a cutoff point or a salience filter (e.g., proximity, severity, lingering structural effects).
  *   **Why it is required:** A theory that cannot distinguish between the Holocaust and the Punic Wars is practically useless. It fails to map onto our moral landscape.

  **4. The Agency/Control Condition**
  *   **Requirement:** The theory must establish a link between the current collective and the past act that resembles agency, not just causality. It must explain how the current group can be said to "own" the act without having performed it.
  *   **Motivation:** Moral responsibility usually requires control (*ought implies can*). If the current generation had absolutely no capacity to prevent the past act, blaming them looks like scapegoating.
  *   **Why it is required:** Without a link to agency, the obligation becomes mere taxation or tribute, not *culpability*. It strips the "guilt" of its moral content.

  **5. The Repudiation Condition**
  *   **Requirement:** The theory must account for the moral weight of explicit repudiation. If a new constitution explicitly rejects the ideology of the past regime (e.g., post-Apartheid South Africa), does this mitigate culpability?
  *   **Motivation:** We intuitively feel that a collective that actively dismantles the machinery of its past wrongs is different from one that silently benefits from them.
  *   **Why it is required:** A theory that treats a reformed collective identically to an unrepentant one ignores moral progress and removes the incentive for reform.

  **6. The Dissolution/Reconstitution Condition**
  *   **Requirement:** The theory must handle cases where the political entity legally ceases to exist and is later reborn (e.g., the Baltic states under USSR occupation vs. independence).
  *   **Motivation:** If a state is illegally annexed and then restored, does it inherit the debts/guilt of the occupier? Or does it inherit the guilt of its pre-occupation self?
  *   **Why it is required:** This tests the theory's reliance on legal continuity vs. cultural continuity. A theory based solely on legal continuity fails here; one based solely on culture becomes too vague.

  ---

  ### II. The Joint Tension: Is the Theory Possible?

  There is a profound tension between **Desideratum 1 (Non-Evaporation)** and **Desideratum 2 (Non-Mystical)**, specifically when coupled with the traditional definition of **Guilt**.

  **The Contradiction:**
  1.  **Guilt** (in the criminal/moral sense) typically attaches to *agents* who commit *acts*.
  2.  **Non-Mystical:** Agents are biological humans or functional roles occupied by humans.
  3.  **Turnover:** When all humans occupying those roles die, the agents cease to exist.
  4.  **Non-Evaporation:** The guilt must persist.
  5.  **Conclusion:** For guilt to persist without the original agents, the "Collective" must be an agent distinct from its members.
  6.  **Conflict:** If the Collective is an agent distinct from its members, we risk violating **Non-Mystical** (positing a supra-human entity). If we deny it is an agent distinct from members, we violate **Non-Evaporation**.

  **Resolution:**
  This tension is unsatisfiable *if* we insist on the word "Guilt" implying *backward-looking blame* for a specific act. You cannot blame an entity that did not exist when the act occurred without resorting to mysticism or fiction.

  Therefore, a coherent theory **must shift the category from "Guilt" to "Responsibility."**
  *   **Guilt** is backward-looking (Who did this?).
  *   **Responsibility** can be forward-looking (Who must fix this?).

  The only way to satisfy both Non-Evaporation and Non-Mystical conditions is to argue that the *benefits and structures* created by the wrong persist, and the current collective inherits the *obligation to rectify* those structures, not the *blame* for the act. If the theory insists on transgenerational *blame*, it fails the Non-Mystical condition.

  ---

  ### III. The Constraint Check: No Mystery, No Reduction

  You asked specifically about the constraint: *No metaphysically mysterious continuity* AND *No reduction to statistical individual guilt.*

  **Can these be satisfied together?**
  **Yes, but only by redefining the "Collective" as a Structure, not a Substance.**

  *   **The Reductionist Failure:** If the nation is just the sum of its people, guilt evaporates when people die.
  *   **The Mystical Failure:** If the nation is a timeless spirit, it violates naturalism.
  *   **The Structural Solution:** The nation is a **persistent system of rules, resources, and power relations.**
      *   *Continuity:* The Constitution, the treasury, the land titles, and the social hierarchy persist even if the people change.
      *   *Non-Reduction:* The system has causal powers that individuals do not (e.g., the ability to sign treaties, hold debt, enforce laws).
      *   *Culpability Link:* The current generation inherits the *system* that was built by the wrong. If the system continues to yield unjust advantages (e.g., wealth accumulated via slavery), the current operators of the system inherit the duty to dismantle those advantages.

  **Where the Contradiction Lies:**
  The contradiction arises if you demand **Retributive Justice** (punishment) rather than **Restorative Justice** (repair). You cannot punish a structure. You can only tax it or reform it. If your theory requires that current citizens *feel* shame or *deserve* punishment for acts they did not commit, you cannot satisfy your constraint. You must accept that the "guilt" is actually a "liability attached to the office, not the person."

  ---

  ### IV. The "Killer" Requirement

  The single requirement that does the most damage to usual candidates is **Desideratum 4: The Agency/Control Condition.**

  *   **Why it kills Individualist Analogies:** Individuals cannot control the past. Therefore, they cannot be guilty of it. This forces the individualist to admit transgenerational guilt is impossible.
  *   **Why it kills Institutional Accounts:** Institutions (structures/rules) do not have minds. They cannot form *mens rea*. They can be "broken" or "unjust," but they cannot be "guilty." An institutional account explains *continuity* perfectly but fails to explain *moral culpability*.
  *   **Why it kills Distributed Liability:** Distributing blame across current members (like a debt) violates the control condition. It punishes people for things they could not possibly have prevented.

  **The Verdict:** The Agency Condition forces the theory to admit that **current generations are not "guilty" of the past act.** They are only **responsible for the present consequences.** Any theory that claims current people are *culpable* for the *act itself* fails this requirement.

  ---

  ### V. Scoring the Contenders

  Here is how the main theoretical models score against the desiderata. (Scale: 0 = Fails completely, 1 = Partial/Problematic, 2 = Satisfies).

  | Desideratum | Individualist Analogy (Nation = Sum of People) | Institutional Continuity (Nation = Rules/Structure) | Distributed Liability (Nation = Debt Shareholders) |
  | :--- | :---: | :---: | :---: |
  | **1. Non-Evaporation** | **0** (Fails immediately on turnover) | **2** (Structures persist) | **1** (Persists only as long as debt is acknowledged) |
  | **2. Non-Mystical** | **2** (Strictly physicalist) | **2** (Functional/Materialist) | **1** (Relies on metaphorical debt) |
  | **3. Differentiation** | **1** (Hard to explain why some debts pass on) | **2** (Can trace structural causality) | **0** (Treats all wrongs as financial debts) |
  | **4. Agency/Control** | **0** (No control over past) | **1** (Structures have causal power, not agency) | **0** (No control over past) |
  | **5. Repudiation** | **2** (Individuals can repent) | **1** (Hard to "repent" a constitution) | **0** (Debts don't vanish via repudiation) |
  | **6. Dissolution** | **0** (No continuity) | **2** (Legal continuity tracks well) | **1** (Depends on recognition of debt) |
  | **Total Score** | **5** | **10** | **5** |

  **Analysis of Scores:**
  *   **Individualist Analogy:** Collapses under the weight of turnover. It is the only model that preserves individual fairness but at the cost of making historical justice impossible.
  *   **Distributed Liability:** Fails the Differentiation and Repudiation conditions. It treats moral wrongs like bank loans, which is category error.
  *   **Institutional Continuity:** The strongest candidate, but it stumbles on **Agency**. It explains why the *State* must pay, but not why the *People* should feel guilt. It successfully navigates your constraint (No Mystery/No Reduction) by treating the nation as a functional machine, but it forces the conclusion that "National Guilt" is a misnomer for "Structural Liability."

  ### VI. Conclusion

  To satisfy your constraint (No Mystery + No Reduction), you must accept a specific trade-off: **You must abandon the notion that a nation can be "guilty" in the same sense an individual is.**

  A coherent theory delivers **Structural Liability**.
  1.  **Phenomena:** It explains why we apologize (as representatives of the structure) and pay reparations (to fix the structure).
  2.  **Distinctions:** It distinguishes between *blame* (which dies with the perpetrator) and *obligation* (which attaches to the beneficiary of the structure).
  3.  **Cases:** It handles turnover by focusing on the persistence of the *rules and resources*, not the bloodline.

  If you demand a theory that allows for **transgenerational blame** (the feeling that current citizens are morally tainted by ancestors' sins) while also demanding **naturalistic ontology**, you are asking for the impossible. The tension is not in the theory, but in the concept of "Guilt" itself. The adequate theory dissolves the problem by showing that what we call "collective guilt" is actually "collective responsibility for structural repair."
