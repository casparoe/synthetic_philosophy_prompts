prompt: |-
  I am a novelist, and a long-form essay I read recently in a literary magazine — part of a series on "post-truth fiction" — summarised pragmatic encroachment and epistemic contextualism roughly as follows:

  "The two theories come to much the same thing: whether someone counts as knowing depends on how much is at stake. Contextualists hold that the word 'knows' shifts its meaning with the conversational context, so that raising the stakes raises the standard — a woman who knew the bank would be open on Saturday morning ceases to know once a missed payment will cost her the house. Pragmatic encroachment adds that the operative stakes are those of whoever is doing the attributing, which means knowledge is less a fact about the subject than a status we confer on people when their evidence is good enough for our purposes. The view has accordingly been refuted by its central objection — that it makes what a person knows depend on who happens to be talking about them — and few philosophers defend it any longer."

  I suspect this is unfair, and I am fairly confident about the "much the same thing" part, since I have seen the two views listed separately, but I cannot locate the rest. Could you go through the passage and tell me what a defender of each view would accept, what is a legitimate simplification for a general reader, and what is simply wrong or overstated — and, in particular, whether the essay's conclusion that the position has been refuted survives once the summary is corrected?

  The reason I care is that I wanted to press one of these views into service in the novel I am drafting. It is narrated in the first person by a woman recalling a death she may have caused, and at a crucial point she says of her sister, "she knew the letter was a forgery." I want the reader to feel that line turn false as the stakes for the sister inside the story rise, even though nothing whatever is at stake for the narrator or for the reader. I have been calling this "diegetic encroachment": the proposal that, in fiction, a knowledge attribution answers to the practical situation of the character it is about rather than to that of the speaker, the audience, or the author. Does anything in contextualism or pragmatic encroachment actually support that extension, is it a coherent thesis in its own right, or does it rest on a confusion that the corrected version of the theories exposes? Please write in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **User:** Novelist drafting a first-person novel.
      *   **Context:** Read a literary essay summarizing "pragmatic encroachment" and "epistemic contextualism" as part of a "post-truth fiction" series.
      *   **Problem:** The essay's summary seems unfair/inaccurate. The user suspects the "much the same thing" claim is wrong. The user wants to know what's accurate, what's simplified, and what's wrong in the essay's summary.
      *   **Specific Goal:** The user wants to use a concept called "diegetic encroachment" in their novel (a knowledge attribution changes truth value based on the *character's* stakes, not the speaker's/reader's). They want to know if existing philosophical theories support this, if it's coherent, or if it relies on a confusion.
      *   **Constraint:** Write in British English.

  2.  **Deconstruct the Essay's Summary (The "Target"):**
      *   *Claim 1:* "The two theories come to much the same thing: whether someone counts as knowing depends on how much is at stake."
          *   *Analysis:* Partially true (both are sensitive to stakes), but fundamentally different mechanisms.
      *   *Claim 2:* "Contextualists hold that the word 'knows' shifts its meaning with the conversational context, so that raising the stakes raises the standard..."
          *   *Analysis:* Generally accurate definition of Contextualism (standards shift with context).
      *   *Claim 3:* "Pragmatic encroachment adds that the operative stakes are those of whoever is doing the attributing..."
          *   *Analysis:* **Major Error.** Pragmatic encroachment (specifically Subject-Sensitive Invariantism or Interest-Relative Invariantism) usually ties stakes to the *subject* of the knowledge attribution, not the *attributor*.
      *   *Claim 4:* "...which means knowledge is less a fact about the subject than a status we confer on people when their evidence is good enough for our purposes."
          *   *Analysis:* Follows from the error in Claim 3. Makes knowledge too subjective/attributor-dependent.
      *   *Claim 5:* "The view has accordingly been refuted by its central objection — that it makes what a person knows depend on who happens to be talking about them — and few philosophers defend it any longer."
          *   *Analysis:* **False.** These views are still actively debated (Fantl & McGrath, Stanley, etc.). The objection described applies more to the distorted version of encroachment presented in Claim 3, not the actual theory.

  3.  **Evaluate the Philosophical Theories (The "Source"):**
      *   **Epistemic Contextualism:** The meaning/truth conditions of "knows" change depending on the *context of the speaker/attributor*. High stakes for the speaker = high standards.
      *   **Pragmatic Encroachment (Subject-Sensitive Invariantism/Interest-Relative Invariantism):** The meaning of "knows" is stable, but whether the belief counts as knowledge depends on the *practical situation of the subject*. High stakes for the *subject* = harder to know.
      *   **Key Distinction:** Who do the stakes belong to? Contextualism = Attributor. Encroachment = Subject.

  4.  **Address the Novelist's Specific Concept ("Diegetic Encroachment"):**
      *   *Concept:* "She knew the letter was a forgery" becomes false later because the *sister's* stakes rose, even though the narrator's stakes didn't change.
      *   *Alignment:* This aligns perfectly with **Pragmatic Encroachment** (specifically Interest-Relative Invariantism), *not* Contextualism.
      *   *Coherence:* It is a coherent philosophical thesis (defended by Jason Stanley, Jeremy Fantl, Matthew McGrath). It is not a confusion.
      *   *Literary Application:* It works well for unreliable narration or retrospective guilt. The narrator says "she knew" (from a low-stakes past perspective or ignoring stakes), but the reality of the sister's high stakes makes the knowledge attribution false in retrospect. Or, the narrator acknowledges that at the time, given the stakes, the sister *didn't* actually know, even if she felt she did.

  5.  **Drafting the Response (Iterative Process):**

      *   *Tone:* Professional, encouraging, precise, British English (e.g., "programme," "defence," "colour," "whilst").
      *   *Structure:*
          1.  Introduction: Validate the user's suspicion. The essay is indeed misleading.
          2.  Breakdown of the Essay's Claims: Go through sentence by sentence (Acceptable, Simplification, Wrong).
          3.  The Core Distinction: Clarify Contextualism vs. Encroachment (Attributor vs. Subject stakes).
          4.  Status of the Theories: Correct the "refuted/few defend" claim.
          5.  Addressing "Diegetic Encroachment": Analyze the user's literary device against the philosophy.
          6.  Conclusion/Advice for the Novel.

      *   *Refining the "Diegetic Encroachment" analysis:*
          *   The user says: "nothing whatever is at stake for the narrator or for the reader."
          *   The user wants: The line "she knew" to turn false as the *sister's* stakes rise.
          *   Philosophy match: This is classic Pragmatic Encroachment (Subject-Sensitive).
          *   Nuance: In the novel, the narrator is speaking *now* about the *past*. If the sister's stakes were high *then*, encroachment says she didn't know *then*. If the stakes rose *later*, does the knowledge attribution change retroactively? Encroachment usually says knowledge is time-indexed. "S knew at t1" depends on stakes at t1.
          *   *Correction/Refinement:* For the user's purpose, the stakes must be high *at the time of the action*, even if the consequences unfold later. Or, the narrator is realising that the sister's practical situation *at that time* was more precarious than assumed.
          *   *Wait, re-reading the prompt:* "I want the reader to feel that line turn false as the stakes for the sister inside the story rise..."
          *   *Interpretation:* The narrative reveals the stakes were higher than thought, or the consequences make the prior epistemic state insufficient.
          *   *Philosophical verdict:* Yes, Pragmatic Encroachment supports the idea that high stakes for the subject can defeat knowledge even with good evidence. This fits the "diegetic" idea well. It is *not* Contextualism (which would require the narrator's context to change).

      *   *Checking British English:* Ensure spelling (summarised, defence, programme, colour) and idioms (whilst, amongst) are appropriate without being caricatured.

      *   *Addressing the "Refuted" claim:* Need to mention Stanley's *Knowledge and Practical Interests* (2005) and ongoing debates. It's definitely not "few philosophers defend it."

  6.  **Final Review against constraints:**
      *   Did I answer what a defender would accept? Yes.
      *   Did I identify simplifications vs. errors? Yes.
      *   Did I address the "refuted" claim? Yes.
      *   Did I address "diegetic encroachment"? Yes.
      *   Is it in British English? Yes.

  7.  **Final Polish:** Ensure the distinction between the *attributor* (speaker) and the *subject* (person known) is crystal clear, as this is the pivot point for the novelist's idea. (Self-Correction: Make sure to explicitly state that the essay swapped the definitions of Contextualism and Encroachment regarding *whose* stakes matter).

      *   *Essay Claim:* Contextualism = stakes raise standard (Vague on whose stakes, implies context). Encroachment = stakes of *attributor*.
      *   *Reality:* Contextualism = stakes of *attributor/context*. Encroachment = stakes of *subject*.
      *   *Impact on Novelist:* The novelist wants stakes of *subject* (sister). This is Encroachment, not Contextualism. The essay got this backwards.

      *   *Wait, one nuance:* The essay says "Pragmatic encroachment adds that the operative stakes are those of whoever is doing the attributing." This is definitely wrong. Encroachment is typically *Subject*-Sensitive Invariantism. The essay describes a hyper-subjectivist view that is easily refuted.
      *   *Novelist's plan:* "nothing whatever is at stake for the narrator... stakes for the sister... rise." This is exactly Subject-Sensitive Invariantism (Encroachment). So the novelist's intuition is philosophically sound, but the essay they read got the theory wrong.

      *   *Let's write.*
answer: |-
  Your suspicions are well-founded. The passage you quote is not merely a simplification; it contains a significant categorical error regarding the distinction between the two theories, and its historical claim about their status in contemporary philosophy is demonstrably false.

  For a novelist seeking philosophical rigour, this distinction is vital, because your proposed device—'diegetic encroachment'—aligns closely with one of these theories (pragmatic encroachment) but is incompatible with the other (contextualism), once the definitions are corrected. The essay you read appears to have conflated the two, or worse, described a straw man.

  Here is a breakdown of what is accurate, what is simplified, and what is incorrect in the passage, followed by an assessment of your own literary thesis.

  ### 1. Analysis of the Essay's Summary

  **Claim:** *"The two theories come to much the same thing: whether someone counts as knowing depends on how much is at stake."*
  *   **Verdict:** **Misleading Simplification.**
  *   **Correction:** While both theories agree that practical stakes are relevant to knowledge attributions, they disagree fundamentally on *whose* stakes matter and *how* they matter. To say they come to 'much the same thing' is like saying a thermometer and a thermostat come to the same thing because both involve temperature. One measures a standard; the other changes the conditions of the system.

  **Claim:** *"Contextualists hold that the word 'knows' shifts its meaning with the conversational context, so that raising the stakes raises the standard..."*
  *   **Verdict:** **Largely Accurate.**
  *   **Detail:** A defender of epistemic contextualism (such as Keith DeRose or David Lewis) would accept this. They argue that the semantic content of 'knows' is context-sensitive. In a casual conversation, the standard for 'knowing' is low; in a high-stakes conversation (e.g., a court room or a medical diagnosis), the standard rises. Crucially, in standard contextualism, the relevant context is usually that of the **speaker** (the attributor), not necessarily the subject.

  **Claim:** *"Pragmatic encroachment adds that the operative stakes are those of whoever is doing the attributing..."*
  *   **Verdict:** **Simply Wrong.**
  *   **Correction:** This is the critical error in the essay. Defenders of pragmatic encroachment (often termed *Subject-Sensitive Invariantism* or *Interest-Relative Invariantism*, championed by philosophers like Jason Stanley, Jeremy Fantl, and Matthew McGrath) argue the exact opposite. They hold that the operative stakes are those of the **subject** of the knowledge attribution (the person who is supposed to know), not the attributor.
  *   **Why it matters:** If I say, 'John knows the bank is open,' pragmatic encroachment asks: What is at stake for *John*? If John needs to deposit a cheque to avoid foreclosure, he requires more evidence to 'know' than if he is merely curious. The essay incorrectly assigns the stakes to the speaker, which creates a view that is indeed easily refuted (as the essay claims), but it is not the view actual philosophers hold.

  **Claim:** *"...which means knowledge is less a fact about the subject than a status we confer on people when their evidence is good enough for our purposes."*
  *   **Verdict:** **Wrong (based on the previous error).**
  *   **Correction:** Because the essay misidentified whose stakes matter, it concludes that knowledge is a status conferred by the speaker ('our purposes'). Pragmatic encroachment maintains that knowledge is a fact about the subject, but a fact that is partially constituted by the subject's practical environment. It is not merely a social status we grant; it is a relation between the subject, the evidence, and the subject's own needs.

  **Claim:** *"The view has accordingly been refuted by its central objection — that it makes what a person knows depend on who happens to be talking about them — and few philosophers defend it any longer."*
  *   **Verdict:** **False.**
  *   **Correction:** The objection described (that knowledge depends on the speaker) applies to the distorted version of encroachment presented in the essay, not the actual theory. Actual pragmatic encroachment is still a live, vigorously debated position in epistemology. Major works defending it have been published as recently as the 2010s and 2020s. It is certainly not the case that 'few philosophers defend it'.

  ### 2. The Core Distinction for the Novelist

  To utilise these concepts correctly, you must distinguish between the **Attributor** (the narrator/speaker) and the **Subject** (the sister).

  *   **Contextualism:** The truth of 'She knows' depends on the **Narrator's** context. If the narrator is relaxing in a safe study, 'She knows' might be true. If the narrator is being interrogated by police about the death, 'She knows' might become false, even if the sister's situation hasn't changed.
  *   **Pragmatic Encroachment:** The truth of 'She knows' depends on the **Sister's** context. If the sister faces dire consequences for being wrong, she does not know, even if the narrator is speaking casually.

  ### 3. Assessing 'Diegetic Encroachment'

  You propose a device where the line "she knew the letter was a forgery" turns false as the stakes for the sister rise, even though nothing is at stake for the narrator or reader. You call this 'diegetic encroachment'.

  **Is this philosophically coherent?**
  Yes. In fact, your intuition tracks **Pragmatic Encroachment** almost perfectly. You have correctly identified that for the emotional weight of the scene to land, the epistemic status must depend on the character's internal stakes (the diegesis), not the narrator's external context.

  **Does existing theory support it?**
  Pragmatic encroachment supports the idea that high stakes for the subject can defeat knowledge. However, there is a temporal nuance you must consider to maintain coherence.

  In standard epistemology, knowledge is time-indexed. 'S knows that p' is evaluated at time *t*.
  *   **Scenario A:** At the moment the sister reads the letter, the stakes are low. She forms the belief it is a forgery. Later, the stakes rise (e.g., acting on this belief could cause a death).
      *   *Encroachment Verdict:* She *did* know at the earlier time. The later stakes do not retroactively erase past knowledge.
  *   **Scenario B:** At the moment the sister reads the letter, the stakes are *already* high (perhaps unconsciously to her), or the narrative reveals that the stakes were high *then* even if the characters didn't realise it.
      *   *Encroachment Verdict:* She did *not* know at that time. The attribution "she knew" was always false, even if it felt true.

  For your novel to work as you describe ('the line turn false as the stakes... rise'), you are likely aiming for **Scenario A**, but with a retrospective re-evaluation. This is where your literary innovation extends the philosophy.

  Philosophically, one might argue that if the consequences of being wrong are catastrophic, the threshold for knowledge was *always* higher, regardless of whether the subject perceived the stakes. If your narrator says "she knew" in Chapter 3, and in Chapter 10 reveals the stakes were lethal, the reader feels the Chapter 3 statement was mistaken. This is a powerful narrative tool. It suggests that the narrator, looking back, is applying a new standard of judgement to the past, or realising that the sister's practical situation was more precarious than previously understood.

  **Is it a confusion?**
  It does not rest on a confusion, provided you anchor the stakes to the **sister** (the subject), not the narrator. The essay you read claimed encroachment makes knowledge depend on the speaker; your 'diegetic encroachment' correctly makes it depend on the character. You have intuitively corrected the essay's error.

  ### 4. Recommendations for the Draft

  If you wish to press this view into service while respecting the philosophical underpinnings:

  1.  **Anchor the Stakes to the Subject:** Ensure the text makes clear that the 'falseness' of the knowledge claim arises from the sister's predicament, not the narrator's guilt or the reader's shock. The sister's potential loss must be what raises the epistemic bar.
  2.  **The Retrospective Shift:** Since knowledge is typically fixed at the time of belief, the 'turning false' effect works best if framed as a realisation. The narrator might say: *"I told myself she knew. But I was wrong. With the house on the line, belief was not enough."* This acknowledges that the high stakes (present at the time, or inherent to the situation) defeated the knowledge claim.
  3.  **Terminology:** You are free to use the term 'diegetic encroachment'. It is a apt coinage. It signals to philosophically literate readers that you are adapting Interest-Relative Invariantism for narrative purposes. It distinguishes your literary device from the technical philosophical debate about speaker-context.
  4.  **Avoid Contextualism:** Do not attribute the shift to the narrator's changing mood or the 'tone of the conversation'. If the narrator is calm but the sister is desperate, and 'knows' becomes false, that is encroachment. If the narrator becomes anxious and therefore 'knows' becomes false, that is contextualism. Your plan specifies the former, which is the more dramatic and ethically complex choice for a story about responsibility.

  ### Summary

  The essay you read was incorrect. It swapped the stakes of the speaker for the stakes of the subject, and prematurely declared the theory dead. Your intuition for the novel is philosophically sounder than the essay's summary. 'Diegetic encroachment' is a coherent thesis that aligns with **pragmatic encroachment** (specifically the subject-sensitive variety). It allows you to explore the idea that truth is not merely a matter of evidence, but of what that evidence is required to *do* for the person holding it.

  In British philosophical circles, this remains a respectable and robust area of inquiry. You may proceed with confidence.
