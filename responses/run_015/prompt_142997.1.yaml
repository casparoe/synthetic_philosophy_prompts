answer: |-
  # Teaching Arc: Graded Moral Patienthood (50 Minutes)

  ### Phase 1: The Conceptual Dependency (0–10 Minutes)
  **Objective:** Establish the necessary precondition for scalar moral status to avoid anthropocentrism and panpsychism.
  **Activity:** Socratic dialogue with the full group (12 students).

  1.  **The Dependency:** Before introducing bandwidth or binding, establish that moral patienthood rests on **valenced experience** (the capacity for things to go better or worse *for* the system), not merely on functional complexity or rational agency.
      *   *Instruction:* Ask students to distinguish between a thermostat adjusting to heat and a human withdrawing from fire. Guide them to identify that the thermostat lacks a "point of view" where the state is *felt* as bad.
      *   **Head Off Misconception 1 (Binary Consciousness):** Explicitly state that if moral status depends on valence, and valence is a biological function like vision or hearing, it is likely continuous rather than binary. Frame the session not as finding a threshold, but mapping a landscape.
      *   *Why this dependency?* Without grounding status in *valence* rather than *intelligence*, we collapse into anthropocentrism (only humans matter). Without grounding it in *integrated valence* rather than *reaction*, we collapse into panpsychism (thermostats matter).

  ### Phase 2: The Scalar Framework & Definitions (10–20 Minutes)
  **Objective:** Define the two parameters and distinguish them from mere homeostasis.
  **Activity:** Mini-lecture (5 mins) followed by pair-work (5 mins).

  1.  **Define Parameters:**
      *   **Affective Bandwidth:** The diversity of valenced states available (e.g., sharp pain vs. dull ache vs. frustration vs. joy).
      *   **Temporal Binding Depth:** The duration over which states are integrated into a unified perspective (e.g., a momentary reflex vs. enduring suffering).
  2.  **Head Off Misconception 2 (Anthropomorphic Projection onto Plants/Thermostats):**
      *   *Intervention Point:* Immediately after defining "valence."
      *   *Instruction:* Clarify that homeostatic feedback (plant tropisms) lacks *valence* because there is no subjective integration of the state, only mechanical correction. The system does not "care" about the equilibrium; it is merely forced into it.
      *   *Task:* In pairs, students must articulate why a sunflower tracking the sun fails the "valence" test despite having feedback loops.

  ### Phase 3: The Comparative Case Study (20–35 Minutes)
  **Objective:** Apply the framework to non-human architectures to test scalar intuition.
  **Activity:** Guided analysis of the specific case study.

  1.  **The Case Study:** **The Cephalopod (Octopus) vs. The Decorticate Mammal.**
  2.  **Required Properties:**
      *   **Cephalopod:** Display **High Affective Bandwidth** (complex avoidance, learning, varied behavioral responses implying distinct states) but **Shallow Temporal Binding** (distributed nervous system implies less unified, moment-to-moment experience without long-term integration).
      *   **Decorticate Mammal:** Display **Low Affective Bandwidth** (limited to raw pain/comfort without cognitive nuance) but **Deep Temporal Binding** (subcortical structures sustain affective states over time without cortical interruption).
      *   **Properties to Lack:** Both must be described as lacking **autobiographical self-conception** (no human-like narrative identity) to prevent students from reverting to personhood criteria.
  3.  **Head Off Misconception 3 (Neuron-Counting):**
      *   *Intervention Point:* During the comparison of the Octopus (large nervous system) vs. Decorticate Mammal (damaged brain).
      *   *Instruction:* Explicitly forbid using total neuron count as a proxy for status. Ask students to evaluate status based *only* on the interaction of bandwidth and binding. A system with fewer neurons but deeper binding may warrant different consideration than one with more neurons but fragmented experience.

  ### Phase 4: Limits, Equality, and Diagnosis (35–50 Minutes)
  **Objective:** Delimit the scope of the theory and test genuine comprehension.
  **Activity:** Full group discussion and individual written response.

  1.  **Head Off Misconception 4 (Gradation Entails Moral Equality):**
      *   *Intervention Point:* Before introducing the diagnostic question.
      *   *Instruction:* Clarify that acknowledging degrees of patienthood does not mean all systems have *equal* claim. A system with higher bandwidth and deeper binding generates stronger moral claims than one with minimal values on both axes. Gradation prevents equality; it explains inequality without binary exclusion.
  2.  **Explicit Scope Limit (The Quantitative Weighting Problem):**
      *   *Statement:* "We are explicitly leaving out the **exchange rate** between bandwidth and binding. This tutorial does not determine whether one unit of temporal depth is worth two units of affective range. That requires normative ethics and empirical data beyond our conceptual scope. We are mapping the axes, not calculating the final score."
  3.  **Diagnostic Question:**
      *   *Task:* Students write a 3-sentence response.
      *   *Question:* "Imagine a hypothetical system that registers every possible human emotion (Max Bandwidth) but resets its memory and perspective every 10 seconds (Zero Binding). According to the scalar framework, does this system have equivalent moral status to a human? Justify your answer using the interaction of the two parameters."
      *   *Success Criteria:* A genuine grasp is shown if the student argues that Zero Binding significantly reduces status despite Max Bandwidth, demonstrating they understand the parameters are multiplicative/interactive, not just additive.

  **Core Pedagogical Strategy:** I will scaffold the session by first grounding moral status in valence to exclude machines, then using a specific non-human comparison to break binary intuitions, and finally testing whether students understand that moral weight depends on the interaction of experiential dimensions rather than their mere presence.
