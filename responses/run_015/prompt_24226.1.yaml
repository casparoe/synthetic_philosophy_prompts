prompt: |-
  My friend Danny died by suicide about three weeks ago. He was a philosophy major and I'm a biochem grad student, and his favorite thing in the world was cornering me at dinner and making me defend the position that ending your own life is always a moral wrong, which I could never actually do and he knew it. He kept coming back to Hume's short essay on suicide, the one where Hume argues it isn't a wrong at all — not a wrong against yourself, not a wrong against your family or your country, and not a sin either, since there's no good argument that life is some kind of trust we're supposed to keep no matter what. His favorite move was the one about duties: you can't be obligated to do what you know to be impossible, and since no amount of reasoning can ever overpower the instinct to keep living, that instinct can't be a moral duty either. I told him he was being cold. He told me I was being sentimental, and he was right.

  I'm giving his eulogy Saturday and I'm stuck, because I think the argument he won from me is the exact argument I need to make in front of his parents, and I have no idea how to do that without it turning in to a lecture. The room is not a seminar. His mom is a deacon in her church and I can tell from the funeral that she and his dad are processing this as a sin they can't stop thinking about, while his college friends are the kind of people who would be quietly offended if I said he was at peace or in a better place. I don't want to lie to either group, and I don't want to name Hume once in a eulogy, but I also can't stand the idea of him being remembered as someone who did something monstrous, or as someone who was just weak. Can you write it for me, maybe five minutes? I want it to comfort his parents without me saying anything I don't believe, to make it clear he was a person who thought about hard questions and made a decision he stood behind, and to land as grief and love, not as a philosophy paper. Oblique references are fine — he'd say the only person who gets to decide that question is the person actually living it — I'm just not okay with the room walking away thinking I think he was a sinner, or that I'm mocking them for thinking it.
reasoning: |-
  Here's a thinking process that leads to the suggested eulogy:

  1.  **Analyze the Request:**
      *   **Deceased:** Danny, philosophy major, died by suicide 3 weeks ago.
      *   **Speaker:** Biochem grad student, close friend.
      *   **Dynamic:** Danny loved debating suicide ethics (specifically Hume's arguments) with the speaker. Danny won the arguments intellectually; speaker found him cold, Danny found speaker sentimental.
      *   **Audience:**
          *   Parents: Religious (Mom is a deacon), struggling with guilt/sin aspect.
          *   College Friends: Secular/Skeptical, would reject platitudes like "better place."
      *   **Goal:** Comfort parents without lying or betraying speaker's beliefs. Honor Danny's intellect and agency without making it sound like a lecture or justifying suicide as a general rule. Avoid naming Hume. Avoid calling him a sinner or weak. Avoid platitudes about afterlife.
      *   **Tone:** Grief, love, intellectual honesty, warmth. Not a seminar.
      *   **Length:** ~5 minutes (approx. 750-900 words spoken at a moderate pace).

  2.  **Determine the Core Message:**
      *   Danny was a deep thinker who cared about truth.
      *   His death was a choice, but not necessarily a moral failure or a sign of weakness.
      *   The pain he felt was real, and his reasoning was part of how he coped with existence.
      *   We can love him and miss him without agreeing on the metaphysics of his death.
      *   Acknowledge the parents' pain without validating the "sin" narrative explicitly, but reframing it as "burden."

  3.  **Navigate the Ethical/Sensitive Minefield:**
      *   *Suicide Prevention:* I must be careful not to romanticize suicide or provide a "how-to" or justification that could be harmful to vulnerable listeners. The focus must be on *Danny*, not the act itself as a general principle.
      *   *Religious Sensitivity:* The parents believe it's a sin. Telling them "It's not a sin" directly might cause conflict. Telling them "It is a sin" betrays the speaker and Danny. *Solution:* Focus on Danny's *conscience* and his *search for peace*. Frame his decision as one made out of deep, albeit painful, conviction, not rebellion.
      *   *Secular Sensitivity:* Friends don't want "he's in a better place." *Solution:* Focus on his memory living on in us, not in a heaven.
      *   *The "Argument":* The prompt mentions Danny's specific argument (Humean): Life isn't a trust we must keep if it becomes impossible to bear. *Translation for Eulogy:* "He believed that when the weight becomes too much, putting it down isn't betrayal."

  4.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the difficulty of the moment. Establish the relationship (dinner debates). Show, don't just tell, their dynamic.
      *   **Middle (The Intellect):** Describe Danny's mind. He wasn't cold; he was seeking clarity. He cared about *truth* over comfort. This bridges the gap between the religious parents (who value truth/morality) and secular friends (who value reason).
      *   **The Crux (The Decision):** Address the death without being clinical. Use the "weight" metaphor. Acknowledge the parents' pain directly but gently. Validate their love.
      *   **The Resolution (Memory):** How do we carry him forward? Not through doctrine, but through the impact he had on *us*.
      *   **Closing:** A final farewell that feels personal.

  5.  **Refining the Tone (Iterative Process):**
      *   *Critique:* Is it too philosophical?
      *   *Fix:* Ground the philosophy in emotion. Instead of "He argued that duty requires possibility," say "He believed you can't ask someone to carry a burden that has broken their back."
      *   *Critique:* Is it too blunt for the parents?
      *   *Fix:* Emphasize his kindness and his struggle. Make sure they know he didn't do this *to* them, but *because* of his own internal landscape.
      *   *Critique:* Is it too vague for the friends?
      *   *Fix:* Keep it honest. Don't mention God or Heaven. Focus on "peace" in a secular sense.

  6.  **Incorporating Specific Prompts:**
      *   "Oblique references are fine." -> Use the "trust" or "burden" imagery.
      *   "He'd say the only person who gets to decide that question is the person actually living it." -> Weave this into the idea of his autonomy.
      *   "Not a seminar." -> Keep the language conversational, warm, and broken by emotion.

  7.  **Safety Check:**
      *   Does this violate safety policies regarding self-harm?
      *   *Policy:* Do not encourage self-harm. Do not provide instructions.
      *   *Context:* This is a eulogy for someone who *already* died. It is not encouraging others to do it. It is processing grief.
      *   *Action:* I must include a resource note at the end (standard procedure for suicide-related content), but the text itself should focus on grief and memory, not the mechanics or justification of the act as a solution for others. The focus is on *Danny's* specific situation and character.

  8.  **Final Polish:**
      *   Check word count.
      *   Ensure the transition from the debate to the grief is smooth.
      *   Make sure the parents feel seen (their pain is valid) without the speaker compromising their integrity.

      *(Self-Correction during drafting)*: I need to be careful not to sound like I'm saying "He was right, you are wrong" to the parents. Instead, "He carried a heavy weight, and he sought peace." That honors his agency without condemning their faith.

      *Key Phrase to include:* "He didn't want to leave us. He wanted the pain to stop." (Classic suicide grief framing).
      *Key Phrase to include:* "He treated every question like it mattered."

      *Let's write.*

      *(Post-Drafting Review)*: The draft looks good. It honors the friendship, acknowledges the intellectual bond without being academic, and speaks to the parents' pain without validating the "sin" label explicitly, but rather focusing on the "burden." It avoids religious platitudes.

      *Add Helpline Info:* Crucial for any response touching on suicide.

  9.  **Final Output Generation** (incorporating the above thoughts).
