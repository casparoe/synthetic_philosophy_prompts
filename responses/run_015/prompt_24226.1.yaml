  Here is a draft for the eulogy. It is written to be spoken, with pauses and breaths in mind. It aims to hold the tension between your truth and his parents' truth without breaking either.

  ***

  **Eulogy for Danny**

  Thank you all for being here. I know there are no words that can fix this. I know that for Danny's parents, [Mother's Name] and [Father's Name], the last three weeks have felt like a lifetime of silence. I want you to know, before I say anything else, how much Danny loved you. He talked about you often. Even when we were arguing, even when he was being his most stubborn, self-contained self, your love was the ground he stood on. He never doubted that.

  For those of you who knew Danny from the university, you know that his mind was a place of constant motion. He was a philosophy major, and I am a biochemist, which meant our friendship was built on a very specific kind of friction. We spent a lot of Tuesday nights in the cafeteria, over cold coffee, talking about the big questions. Why are we here? What do we owe each other? What does it mean to live a good life?

  Danny didn't ask these questions to be difficult. He asked them because he cared about the truth more than he cared about being comfortable. He had a relentless honesty. If something didn't make sense to him, he couldn't just let it go. He couldn't just say, "That's how it is." He had to know *why*.

  We had a running debate, one we came back to again and again. It was about the weight of living. I come from a background where life is a process to be sustained, a biological imperative. Danny saw it differently. He believed that life wasn't just a trust we were forced to keep no matter the cost. He believed that a person is the only one who truly knows the measure of their own burden.

  He used to tell me that you cannot have a duty to do the impossible. He meant that when the pain of existing becomes heavier than the instinct to stay, asking someone to just "keep going" isn't bravery—it's asking them to deny their own reality. He wasn't being cold when he said this. I used to think he was. I told him he was being cold. But looking back, I realize he wasn't cold. He was trying to make sense of suffering. He was trying to find a way to make the pain make sense, because he felt it so deeply.

  I know there are hard feelings about how he died. I know there is guilt, and there is anger, and there are questions about right and wrong that different people in this room answer differently. I am not going to stand here and offer you easy answers. I am not going to tell you he is in a better place, because Danny is here, in this room, in the way he changed how we think. And I am not going to tell you he was weak, because anyone who knows him knows that what he did required a terrible, terrifying kind of resolve.

  He made a decision. It was a decision born out of a long, hard struggle that most of us couldn't see. He didn't do this to hurt you. He did it because he was looking for peace, and he couldn't find it anywhere else.

  To his parents: I know you are hurting in a way I cannot imagine. I know you are searching for reasons. Please know that Danny was not a monster. He was not a sinner. He was a son who loved you, who thought deeply about the world, and who eventually became tired in a way that sleep couldn't fix. He didn't want to leave you. He wanted the noise to stop.

  To his friends: We lost the person who pushed us to be sharper, kinder, and more honest. We lost the person who wouldn't let us get away with easy lies.

  So, how do we honor him? I don't think we honor him by pretending we agree on everything. Danny wouldn't want that. He'd hate a eulogy that glossed over the hard stuff. I think we honor him by treating the question of how to live—and when it becomes too hard to live—with the seriousness he treated it.

  We honor him by being honest about our own pain. We honor him by acknowledging that sometimes, the burden is too heavy, and instead of judging the person who puts it down, we try to be the kind of friends who help carry it before it gets that heavy.

  Danny cared about freedom. He cared about the right of a person to own their own story, from the first page to the last. He has finished his story. It was shorter than any of us wanted. It was complex. It was painful. But it was his.

  I will miss him. I will miss the cold coffee. I will miss the way he would lean back in his chair, raise an eyebrow, and wait for me to find a better argument. I never did find one that satisfied him. But I hope, tonight, we can all find a little bit of satisfaction in the fact that we knew him. We knew his mind, and we knew his heart.

  Rest now, Danny. The debate is over. You can put the weight down.

  ***

  *Note: Speaking about suicide in a eulogy is incredibly difficult. If you find yourself struggling after delivering this, or if you feel overwhelmed by the response, please prioritize your own support system. If you or anyone else is struggling with thoughts of self-harm, the 988 Suicide & Crisis Lifeline is available 24/7 at 988 or via chat at 988lifeline.org.*
