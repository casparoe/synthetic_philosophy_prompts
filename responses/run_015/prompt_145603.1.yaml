  Commitment summary
  You posit that scientific revolutions entail non-cumulative changes in ontology and standards, defining incommensurability as divergent evaluative criteria rather than semantic isolation. You maintain that rational comparison persists via transcendent metrics and shared observational reports, denying a neutral adjudication standpoint while rejecting irrationality in paradigm choice. Finally, you extend this framework to contemporary interdisciplinary conflicts regarding the ontology of culture.

  Real tensions ordered by severity
  Commitment (1) asserts that evaluative standards are not reducible across revolutions, implying a lack of common ground for judgment. Commitment (3) counters this by positing paradigm-transcendent metrics like predictive accuracy that allow for rational comparison. These directly contradict because if such transcendent metrics exist, the standards are partially reducible and cumulative after all. Commitment (1) bears the brunt of this pressure, as it must concede some continuity to accommodate (3). This forces you to clarify whether "non-cumulative" means total discontinuity or merely significant transformation.

  Commitment (2) defines incommensurability specifically as a divergence in shared standards for theory evaluation. Commitment (3) undermines this definition by claiming rational comparison remains possible through those very standards. If transcendent metrics allow for comparison, the divergence is insufficient to sustain the strong incommensurability thesis outlined in (2). Consequently, Commitment (2) risks becoming vacuous if (3) is maintained in its current strong form. You must decide if incommensurability blocks comparison or merely complicates it.

  Commitment (1) claims ontological changes are non-cumulative, which historically implies shifts in what scientists perceive as real. Commitment (4) restricts the no-neutral-language thesis to theoretical vocabulary, preserving shared observational reports embedded in perceptual practices. This creates friction because a genuine ontological shift often alters perceptual gestalts, challenging the stability of the observational reports claimed in (4). Commitment (4) bears the pressure here, as it may underestimate the depth of ontological change. A strict reading of (1) suggests perception itself is theorized, contradicting the stability in (4).

  Apparent tensions that dissolve
  Commitment (3) allows for rational comparison, while (5) denies a neutral standpoint for objective adjudication. This is consistent because rational persuasion does not require an algorithmic decision procedure or a view from nowhere. Scientists can compare theories rationally without possessing a neutral rulebook that dictates the choice.

  Commitment (4) posits shared observational reports, whereas (5) denies a fully neutral standpoint for adjudication. This dissolves because shared data points do not constitute a neutral theoretical framework for interpreting those points. Scientists can agree on what they see without agreeing on what it means or which paradigm it validates.

  Minimal revision
  Modify Commitment (3) to replace "paradigm-transcendent metrics" with "partially overlapping metrics whose weighting varies by paradigm." This acknowledges that while accuracy matters to both, how it is defined or prioritized differs, aligning with (1) and (2). The cost is losing the strong claim to objective, transcendent rationality that guarantees convergence. You must accept that rationality is local enough that convergence is not logically compelled.

  Overall verdict
  The package is salvageable without revision if "transcendent" is interpreted loosely. However, the proposed revision is worth paying to avoid contradicting your core Kuhnian premises.
