answer: |-
  You have put your finger on one of the most sophisticated and contentious debates in contemporary philosophy of physics. Your colleagues likely gave you non-answers because this problem sits precisely on the fault line between **reductionism** (everything is just the lower-level stuff) and **emergence** (the higher-level stuff is genuinely new).

  The specific structure you are describing has a name in the literature. It is most commonly referred to as a **Singular Limit** (or **Asymptotic Reduction**).

  The philosopher of physics you need to read is **Robert Batterman**. His books *The Devil in the Details* (2002) and *Asymptotic Reasoning* (2005) are dedicated almost entirely to the exact examples you listed: phase transitions, the classical limit of quantum mechanics, and the emergence of irreversibility.

  Here is the breakdown of the concept, the boundaries you asked for, and the verdict on the frictionless plane.

  ### 1. The Name and Definition
  **Term:** **Singular Limit** (sometimes **Essential Idealization**).

  **Definition:** A reduction is a "Singular Limit" when the behavior of the system at the limit value (e.g., $N = \infty$, $\hbar = 0$) is **qualitatively different** from the behavior of the system arbitrarily close to that limit (e.g., $N = 10^{23}$, $\hbar \approx 0$).

  In a "regular" limit, as you approach the ideal, the system behaves more and more like the ideal. In a "singular" limit, the system behaves one way for all finite values, and then *snap-changes* to a completely different kind of behavior exactly at the limit.

  This explains your frustration: The theory explains the phenomenon *only* by invoking a mathematical condition that is physically impossible. The "sharp" boiling point is a **mathematical singularity** that does not exist in the finite ontology of the real world, yet it is required to explain the behavior of the real world.

  ### 2. The Edges: What's In and What's Out

  To draw the boundary, we have to distinguish between **Approximations** and **Singular Idealizations**.

  **What's IN (Singular Limits):**
  *   **Phase Transitions:** As you noted. For any finite $N$, the partition function is analytic (smooth). There is no phase transition. Only at $N \to \infty$ does the function become non-analytic (sharp). The "boiling point" is an artifact of the infinite limit.
  *   **Classical from Quantum:** Taking $\hbar \to 0$. Quantum mechanics involves discrete spectra and interference. Classical mechanics involves continuous trajectories. You cannot get trajectories from wave functions by just making $\hbar$ small; you need the limit to be exactly zero to change the *category* of the object (from wave to particle).
  *   **Fluid Dynamics (Inviscid Limit):** This is a killer example. As viscosity ($\nu$) goes to zero, you might expect the fluid to behave like an ideal fluid. But near boundaries, "boundary layers" form where the behavior is wild. The limit $\nu = 0$ (Euler equations) is singular relative to $\nu \approx 0$ (Navier-Stokes). This is known as the *d'Alembert's Paradox* region.

  **What's OUT (Regular Idealizations / Approximations):**
  *   **Earth as a Sphere:** The Earth is an oblate spheroid. Treating it as a sphere is an approximation. As you get closer to the "ideal" sphere, the physics changes smoothly. There is no qualitative snap.
  *   **Simple Pendulum (Small Angle):** $\sin(\theta) \approx \theta$. This is a Taylor expansion truncation. The error gets smaller smoothly. It is a computational convenience, not an ontological necessity for the phenomenon to exist.

  ### 3. The Frictionless Plane: Your Gut is Right
  You asked specifically about the frictionless plane. Your intuition that it is *different* from the boiling point case is correct, but with a caveat.

  **Standard Mechanics (The Block on a Plane):**
  If you have a block sliding with friction coefficient $\mu$, and you let $\mu \to 0$, the motion converges smoothly to the frictionless case. The equations don't change order; the behavior doesn't qualitatively snap.
  *   **Verdict:** This is a **Regular Idealization**. It is a simplification for calculational ease. The "frictionless block" is a simplified version of a real block.

  **Why the Boiling Point is Different:**
  The "infinite molecule water" is not a simplified version of real water; it is a **different category of object**. Real water (finite $N$) *cannot* boil sharply, even in principle. Infinite water *must* boil sharply.
  *   **Verdict:** This is a **Singular Idealization**. The idealization is *essential* to the explanation. You cannot explain the sharpness without the infinity, even though the infinity is false.

  **The Caveat (Fluid Friction):**
  If you are talking about *viscosity* in fluids (internal friction), that *is* a singular limit (see "Fluid Dynamics" above). So, "friction" is ambiguous. Surface friction on a block is usually regular; internal viscosity in a flow is often singular.

  ### 4. Why This Confuses Everyone (The Philosophical Trap)
  The reason your colleagues gave you non-answers is that this structure breaks the traditional map of Philosophy of Science.

  1.  **It breaks Nagelian Reduction:** Ernest Nagel's classic model of reduction says Theory A reduces to Theory B if you can derive A from B plus "bridge laws." But here, you can't derive the Sharp Boiling Point from Statistical Mechanics *alone*. You have to add "Let $N = \infty$." Since $N$ is never $\infty$, the derivation is technically false, yet it is our best explanation.
  2.  **It complicates Emergence:** Usually, people say "Emergence means you can't derive the higher level from the lower level." But here, we *can* derive it, but only by using a mathematical trick (the limit) that creates a property (sharpness) that doesn't exist in the base level. Batterman calls this **"Asymptotic Emergence."** The higher-level phenomenon emerges from the *failure* of the lower-level theory to be well-behaved at the limit.

  ### 5. Summary for Your Classroom (and Sanity)
  If you need a label to file this under, use **Singular Limits**.

  *   **The Pattern:** Lower-level theory $\to$ Mathematical Limit $\to$ Higher-level Phenomenon.
  *   **The Catch:** The Limit is physically impossible ($N \neq \infty$), but the Phenomenon is undefined without it.
  *   **The Distinction:**
      *   **Frictionless Plane:** A *lie* that is close enough to the truth (Regular).
      *   **Sharp Boiling Point:** A *truth* that is only true in a universe that doesn't exist (Singular).

  You are not annoyed; you are doing philosophy of physics. The "smeared-out copy" feeling you have is the exact tension Batterman argues is the engine of inter-theoretic explanation. The "ideal object" isn't a defective instance of reality; reality is a "perturbed" instance of the ideal mathematics.

  **Recommended Reading:**
  *   Robert Batterman, *The Devil in the Details* (Chapter 1 is exactly your question).
  *   John Norton, "Approximation and Idealization: Why the Difference Matters" (2012). Norton explicitly draws the line you are looking for between "approximation" (frictionless plane) and "idealization" (thermodynamic limit).
