  2.  **Deconstruct Strawson's Basic Argument:**
      *   To be truly morally responsible, you must be the ultimate cause of your actions (*causa sui*).
      *   To be the ultimate cause of your actions, you must have chosen your own nature/character.
      *   To choose your own nature, you need a prior nature to make that choice.
      *   Infinite regress. Therefore, ultimate moral responsibility is impossible.
      *   *Crucial Nuance:* Strawson distinguishes between *ultimate responsibility* (impossible) and *reactive attitudes* (possible/natural). We can feel anger or gratitude without believing someone is metaphysically blameworthy.

  3.  **Deconstruct *Minority Report* (Relevant Plot Points):**
