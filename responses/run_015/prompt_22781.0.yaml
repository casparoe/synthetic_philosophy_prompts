      *   **Expected Value (EV) Maximization:** Leads to betting everything on positive EV bets. High risk of ruin in repeated games.
      *   **Competition Context:** Zero-sum (or rather, rank-sum) game. Beating the *others* matters more than absolute wealth.
      *   **Time Horizon:** 10 weeks is "short" in investment terms but allows for compounding. It's not infinite, but it's not a single bet either.
      *   **End Game:** The "all-in" strategy at the end is a classic tournament heuristic.

  3.  **Address Each Confusion Point:**

      *   *Point 1: Kelly vs. Short Horizon.*
          *   Kelly is asymptotic. With $N=10$, the variance matters more. Full Kelly is too volatile for a short contest where "ruin" (being last) is bad, but "max growth" isn't the only goal.
          *   However, since it's virtual money, "ruin" isn't financial devastation, it's just losing the trophy. This changes the utility function.
          *   *Conclusion:* Full Kelly is likely too aggressive for weeks 1-9, but the logic of geometric growth is still better than arithmetic EV for compounding.

      *   *Point 2: Objective Function (EV vs. Median vs. Prob(Win)).*
          *   Max EV: Bet 100% on every positive edge. One bad week wipes you out. Bad for 10-week compounding.
          *   Max Median: Closer to Half-Kelly. Good for stability.
          *   Max Prob(Win): This is the *real* goal. It depends on what opponents do. If opponents are conservative, you need volatility. If opponents are reckless, you need stability.
