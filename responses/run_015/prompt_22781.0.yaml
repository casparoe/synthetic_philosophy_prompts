answer: |-
  This is a fantastic question. You have correctly identified the tension between standard financial theory (which often assumes infinite horizons or risk neutrality) and the specific constraints of a tournament with a finite horizon and a rank-based payoff structure.

  Your intuition is spot-on: **The Kelly Criterion and geometric growth are the right *framework*, but the *objective function* needs to change because you are playing a tournament, not playing against the market.**

  Here is a breakdown of how to apply these concepts to your 10-week competition, addressing your specific confusions.

  ### 1. The Objective Function: Maximize Probability of Winning, Not Wealth
  In real-world investing, the goal is usually to maximize expected utility of wealth (often approximated by log-wealth/Kelly) because you want to be rich in absolute terms. In your competition, \$1,000,000 virtual dollars is useless if another team has \$1,000,001.

  *   **Maximizing Expected Value (EV):** If you simply maximize arithmetic EV, you should bet 100% of your portfolio on every trade that has a positive expected return. In a 10-week compounding game, this is a losing strategy. A single -100% return (or even a -50% return, which requires a +100% gain to recover) creates "volatility drag." Because returns compound multiplicatively, high variance reduces the geometric mean even if the arithmetic mean stays the same.
  *   **Maximizing Geometric Growth (Kelly):** This accounts for volatility drag. It is superior to EV maximization for compounding over 10 weeks.
  *   **Maximizing Probability of Rank 1:** This is your true goal. This depends on **relative wealth**.

  **Implication:** For the first 8–9 weeks, your team should generally follow a **Fractional Kelly** strategy (e.g., Half-Kelly).
  *   **Why?** Full Kelly maximizes long-run growth but has high volatility. In a short 10-week horizon, the distribution of outcomes is wide. You risk "blowing up" (falling so far behind you can't catch up) before the end. Half-Kelly captures ~75% of the growth rate with ~50% of the variance. This keeps you in the game.

  ### 2. The Competitive Element: Dynamic Risk Taking
  Because you are competing against five other teams, your risk tolerance should not be static; it should depend on your **relative standing**. This is a concept from tournament theory.

  *   **If you are in the lead:** Your goal shifts from "growth" to "preservation." You want to minimize the probability that another team overtakes you.
      *   *Strategy:* Reduce leverage. Move toward Full Kelly or even below Half-Kelly. If you are far ahead, you might even mimic the holdings of the second-place team (a "copycat" strategy) to ensure that if they go up, you go up, maintaining your lead.
  *   **If you are trailing:** Your goal shifts to "maximize variance." If you play safely while behind, the leaders will simply compound away from you. You need to increase the spread of possible outcomes.
      *   *Strategy:* Increase leverage toward Full Kelly. Concentrate your portfolio in fewer stocks (increasing idiosyncratic risk). You are looking for a "lottery ticket" outcome where you outperform the market significantly.

  **Action Item:** Every week, calculate your team's rank and portfolio value relative to the leader. Adjust your aggression based on that gap.

  ### 3. The "All-In" End Game (Week 10)
  Your teammate is partially right, but their reasoning needs refinement. The logic of "nothing left to lose" applies differently depending on your rank going into Week 10.

  *   **Scenario A: You are behind in Week 10.**
      *   Your teammate is correct. You should concentrate your portfolio. Diversification reduces variance, and you *want* variance. You should not just pick the stock with the highest expected return; you should pick the stock with the highest **positive convexity** or highest volatility among those with a positive edge. You need a outlier positive event to catch the leader.
      *   *Kelly View:* In the very last bet, the "long-run" protection of Kelly doesn't matter because there is no long run. You are maximizing the probability that $W_{final} > W_{leader}$. If the leader is far ahead, this approaches maximizing EV on a single bet, which implies high concentration.

  *   **Scenario B: You are ahead in Week 10.**
      *   Your teammate is wrong. If you are the leader, going all-in on a single stock exposes you to idiosyncratic risk. If that stock crashes, you lose the trophy.
      *   *Strategy:* Diversify heavily. Your goal is to ensure your return $r_{you}$ is greater than $r_{closest\_competitor}$. If you can identify what the second-place team is holding, you might hedge against their specific bets.

  ### 4. Small $N$ and Geometric Rationality
  You asked how to think about risk when rounds are small ($N=10$) rather than infinite.

  *   **The Law of Large Numbers hasn't kicked in.** Kelly assumes that over infinite bets, your realized return will converge to the expected geometric growth rate. With 10 weeks, luck plays a massive role.
  *   **Volatility Drag is immediate.** Even in 10 periods, a 50% loss requires a 100% gain to break even. This mathematical fact makes Arithmetic EV a dangerous metric for compounding portfolios.
  *   **The Utility Function is Step-Wise.** In real life, utility of wealth is concave (diminishing returns). In your competition, utility is effectively a step function: 1st place = 1 utility, 2nd–6th place = 0 utility.
      *   This implies that **correlation matters**. If all six teams buy the S&P 500 ETF, everyone grows together, and the winner is decided by noise. To win, you must deviate from the "crowd" (the other teams) when you have an edge. If you believe you have better analysis than the other teams, concentrate on your highest-conviction ideas. If you think the other teams are gambling on meme stocks, stay disciplined with Kelly to let them blow themselves up.

  ### Summary of Strategic Recommendations

  1.  **Weeks 1–8 (The Accumulation Phase):**
      *   Use **Half-Kelly** sizing on your trades. Estimate your edge ($p$) and odds ($b$) conservatively.
      *   Do not maximize Arithmetic EV. Maximize Expected Log Wealth.
      *   Monitor the leaderboard weekly. If you drop to 5th or 6th place, gradually increase risk toward Full Kelly to catch up. If you are in 1st, dial risk down.

  2.  **Week 9 (The Positioning Phase):**
      *   Assess the gap. If you are within striking distance of 1st place, maintain aggression. If you are far behind, you must take "desperation risk" (high concentration, high volatility assets).

  3.  **Week 10 (The Binary Phase):**
      *   **If Leading:** Diversify. Protect the downside.
      *   **If Trailing:** Concentrate. Go all-in (or close to it) on your highest-conviction, highest-volatility idea. Ignore volatility drag; you are making a single binary bet on the trophy.

  4.  **Psychological Edge:**
      *   Most high school teams will either play too safe (buying only blue-chip stocks) or too reckless (going all-in every week on crypto/tech).
      *   By using Fractional Kelly, you position yourself in the "sweet spot": growing faster than the safe teams, but surviving longer than the reckless teams. Often, winning a tournament like this isn't about making the most money; it's about being the last competent team standing after the others have blown up.

  ### A Note on Estimating $p$ and $b$
  The Kelly formula $f^* = (bp - q)/b$ is clean for binary bets (coin flips). In the stock market, returns are continuous distributions.
  *   To apply Kelly to stocks, you are technically maximizing $E[\ln(1 + r)]$.
  *   In practice, this means you shouldn't just bet on stocks you think will go up. You must bet on stocks where the **magnitude** of the expected move justifies the risk.
  *   Since you are in AP Stats, you might estimate $p$ and $b$ based on historical volatility and your fundamental analysis. Be careful of **overconfidence**. If you overestimate $p$, Kelly will tell you to overbet, which leads to ruin. This is another reason to stick to **Half-Kelly**; it provides a margin of safety against estimation error.

  **Final Verdict:** Your teammate's "all-in" instinct is correct for the *final week if you are losing*, but dangerous for the rest of the competition. Use Kelly to manage growth and survival for the first 9 weeks, then switch to tournament theory (maximize variance if behind, minimize if ahead) for the finale. Good luck!
