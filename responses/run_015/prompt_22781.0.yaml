      *   *Point 5: Small $N$ Risk Taking.*
          *   Law of Large Numbers doesn't apply yet.
          *   Volatility drag is real even in 10 periods.
          *   Fractional Kelly (e.g., Half-Kelly) is usually the sweet spot for "growth with survival."

  4.  **Synthesize the Advice (Drafting the Response):**

