  4.  **Analyzing Disanalogy 1: Gendered Personification (*The Prince*, Ch. 25):**
      *   *Textual Evidence:* Immediately following the river analogy, Machiavelli says Fortune is a woman. To master her, one must beat and strike her. She favors the young/impetuous.
      *   *Conflict:* The river is impersonal, natural, inevitable. The woman is agential, responsive to violence, capricious.
