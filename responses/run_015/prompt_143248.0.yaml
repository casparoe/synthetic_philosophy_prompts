      *   *Address "Causal Opacity":* This is the misleading term. Causality isn't broken; *reconstructability* is. The mapping is many-to-one from the perspective of coarse-grained measurement, but one-to-one in reality.
      *   *Macro vs. Micro:* Determinism remains global in classical chaos. It doesn't become local. The *utility* of determinism becomes local.
