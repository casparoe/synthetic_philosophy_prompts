answer: |-
  Here is a 50-minute lecture plan designed specifically for second-year engineering and pre-med students. It prioritizes pragmatic clarity over philosophical exhaustiveness, leveraging their existing intuition about data while disrupting their assumption that data *alone* drives theory choice.

  ### I. Sequencing and Structure (0:00–0:50)

  **The Order of Operations**
  Do **not** state the thesis ("Evidence does not determine theory") in the first five minutes. If you state it abstractly, engineering students will treat it as a semantic claim about "proof" and dismiss it as irrelevant to practice. If you state it before they grasp the distinction between a *genuine rival* and a *vocabulary shift*, they will conflate underdetermination with translation.

  **Recommended Sequence:**
  1.  **The Hook (0:00–0:05):** Elicit their working assumption. Ask: *"If two hypotheses predict the exact same data, are they the same hypothesis?"* Most will say "Yes" or "It doesn't matter."
  2.  **The Core Example (0:05–0:20):** Deploy the example (see Section II). Let them struggle to find a data-based reason to prefer one over the other.
  3.  **The Distinction (0:20–0:25):** *Now* introduce the distinction between "vocabulary shift" and "genuine rival." Use their confusion during the example to motivate the definition. (e.g., "You felt these were different, but the data was the same. Why?")
  4.  **The Thesis (0:25–0:35):** State the Weak Claim (current data doesn't decide) and pivot to the Strong Claim (no *possible* data within this framework decides).
  5.  **Misconception Management (0:35–0:45):** Address the "So what?" (Relativism, Simplicity, Auxiliaries).
  6.  **Assessment & Scope (0:45–0:50):** The final question and boundary setting.

  **Weak vs. Strong Claim**
  Start with the **Weak Claim** ("The data we have *right now* doesn't decide"). This aligns with their stats training (confidence intervals, p-values, need for more power). Once they accept that, tighten the screws to the **Strong Claim** ("Even with perfect data *of this type*, the theory isn't fixed"). This prevents them from solving the problem by simply saying "get a bigger sample size."

  ### II. The Core Example

  **Your Suspicion is Correct:** Drop the curve-fitting case.
  *   **Why:** To an engineer, curve-fitting is an optimization problem, not an ontological one. They know regularization, cross-validation, and Occam's razor. They will view underdetermination here as a temporary lack of data points or a failure of penalty terms, not a structural feature of scientific inference. It reinforces the idea that "more data solves it."

  **The Replacement: Caloric Theory vs. Kinetic Theory of Heat (pre-1850s)**
  *   **Why this works for this audience:**
      *   **Engineering Relevance:** They all take Thermodynamics. They use equations ($PV=nRT$) that worked perfectly well under *both* theories for a century.
      *   **Ontological Clash:** It is not a vocabulary shift. One theory says heat is a weightless fluid (Caloric); the other says heat is the motion of particles (Kinetic). These are physically incompatible claims about what *exists*, not just how we talk.
      *   **Empirical Equivalence:** For a long period, both theories predicted gas expansion, temperature change, and pressure identically.
      *   **Resists "More Data":** You cannot resolve this by measuring temperature more precisely. You need a *new kind* of experiment (e.g., Rumford's cannon boring), and even that relies on auxiliary assumptions (e.g., is heat being generated or released?).

  **What the Example Must Have:**
  1.  **Shared Predictive Success:** Both must get the "right answer" on the lab bench (e.g., both derive the ideal gas law).
  2.  **Distinct Mechanisms:** One posits an entity (fluid), the other a process (motion).
  3.  **A "Stuck" Period:** A historical moment where smart people disagreed despite good data.

  **What the Example Must Lack:**
  1.  **A "Smoking Gun" within the frame:** Do not start with the experiment that killed Caloric (friction). Start with the period where both were viable.
  2.  **Mathematical Complexity:** Keep the math to algebra they know (proportionalities). The point is the logic of evidence, not the physics.

  ### III. Misconceptions: Order and Defusal

  Students will generate objections in a predictable sequence. Do not answer them in the order they ask; slot them into the lecture plan where they do the most pedagogical work.

  1.  **"So anything goes? / All theories are equally good." (Relativism)**
      *   **When it arrives:** Immediately after you state the thesis.
      *   **Strategy:** **Cut this off in advance.** Frame underdetermination as a constraint on *certainty*, not a license for *choice*.
      *   **Script:** "Underdetermination doesn't mean we choose randomly. It means the *evidence* isn't doing the choosing. Other things (pragmatics, coherence, simplicity) take over. We still have reasons, just not *evidential* proofs."

  2.  **"Simplicity settles it." (Occam's Razor)**
      *   **When it arrives:** During the Core Example analysis.
      *   **Strategy:** **Let this surface.** It is their native engineering instinct.
      *   **Defusal:** Acknowledge it as a *virtue*, but distinguish it from *truth*. "Simplicity tells you which theory is easier to use or less likely to overfit. It does not tell you which one describes reality. Caloric was arguably simpler (fluids are intuitive). Kinetic won later, not because it was simpler, but because it fit *new* domains (friction)."

  3.  **"That's just the holism point about auxiliary hypotheses." (Duhem-Quine)**
      *   **When it arrives:** When you discuss why the data didn't decide.
      *   **Strategy:** **Acknowledge and bracket.** This is technically correct but distracts from the main point.
      *   **Script:** "You're right that we test theories in bundles. But even if we fix the auxiliaries, the core theoretical claim (Fluid vs. Motion) remains underdetermined by the input/output data."

  4.  **"This is really an argument against believing in unobservables." (Instrumentalism)**
      *   **When it arrives:** Near the end, when discussing "what exists."
      *   **Strategy:** **Let this surface.** This is the productive philosophical tension.
      *   **Defusal:** Don't solve Realism vs. Instrumentalism. Point out that engineers *must* act as if unobservables are real to design systems, even if evidence doesn't prove them.

  5.  **"The true theory might be one nobody has formulated yet." (Unconceived Alternatives)**
      *   **When it arrives:** The final skepticism.
      *   **Strategy:** **Save for the conclusion.** This is the "Strong" underdetermination.
      *   **Note:** This is the missing misconception you didn't list. It's the worry that the choice isn't between A and B, but that C is true. Acknowledge this as the reason science is provisional, not broken.

  ### IV. The Final Assessment Question

  You need a question that separates "Nothing is true" (Relativism) from "Evidence isn't sufficient for Truth" (Underdetermination).

  **The Question:**
  > "Imagine you are designing a safety-critical system (a bridge or a treatment protocol). You have two theories that fit all existing data equally well, but imply different failure modes. Theory A is simpler; Theory B is more consistent with background physics. **On what basis do you justify your choice, and can you claim your choice is 'proven' by the data?**"

  **Desired Answer (Got the Thesis):** "I choose based on pragmatic risk assessment or coherence with other known physics, but I cannot claim the data *proved* this theory is the only true one. I must remain open to new data types."
  **Undesired Answer (Relativist Mood):** "It doesn't matter which I pick, truth is subjective," OR "I pick the simpler one because simplicity proves truth."

  ### V. Scope Limits: What to Refuse

  Fifty minutes is insufficient for the full philosophy of science. You must explicitly exclude two topics to keep focus, framing the exclusion as a feature, not a bug.

  1.  **The Sociology of Science (Kuhn/Paradigms):**
      *   **Why:** Students will want to talk about "scientific consensus" or "political influence."
      *   **How to say it:** "Today we are looking at the *logic* of evidence, not the *social process* of agreement. We are asking what the data can do, not what the committee decides."
  2.  **Bayesian Probability / Priors:**
      *   **Why:** Engineers love Bayes. They will try to solve UTE by assigning priors.
      *   **How to say it:** "Bayesian methods help you update confidence, but they require you to input a prior probability. Underdetermination is the problem of how you justify that prior when evidence is silent. We're looking at the silence, not the math of the update."

  **Closing Script for Scope:**
  "We are stopping at the edge of *justification*. I am not telling you how to do science tomorrow; I am telling you why the data you collect tomorrow will never be quite as loud as you hope. That isn't a weakness of science; it's the definition of inference."
