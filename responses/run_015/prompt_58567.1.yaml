      *   *Wait, one nuance:* If the heart stops, brain function stops. So Brain View says "Loss of function has occurred." Is it irreversible? If we *could* restart the heart, it's not irreversible yet. So Brain View says "Alive." Circulatory View says "Dead" because the heart stopped and we won't restart it (so *that* loss is irreversible).
      *   *This works.* It highlights the ambiguity of "irreversible." Does it mean "physically impossible to reverse" or "will not be reversed in this context"?

