      *   *Scenario:* Patient has a massive heart attack. Heart stops. They have a DNR. Doctors declare death based on circulatory criteria (no pulse, no breathing, won't resuscitate). However, the brain tissue hasn't degraded yet. If you *did* restart the heart (which you could physically do, but won't because of the DNR), the brain would work.
      *   *Problem:* If the heart stops, circulation stops. Without circulation, the brain dies within minutes. To say the brain is "alive" (functional), we need to catch them in the window where the heart has stopped, death is declared based on circulatory criteria, but the brain hasn't suffered irreversible loss *yet*.
      *   *The "Irreversible" Trick:* Circulatory death requires the loss of circulation to be *irreversible*. If there is a DNR, the loss is treated as irreversible (because we won't reverse it), even if it *could* be reversed physically. The Brain view requires loss of *brain* function to be irreversible. In the minutes after cardiac arrest, brain function is lost (consciousness goes), but is it *irreversibly* lost? If you restart the heart within 5 minutes, brain function returns. So, if you declare death immediately upon heart stoppage due to DNR, the Circulatory view says "Dead" (because we won't fix the heart), but the Brain view says "Alive" (because the brain hasn't permanently died yet; it's just unconscious).
