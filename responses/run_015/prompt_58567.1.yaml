          *   Brain View: Alive. (Brain cells are intact, function would return if heart restarted, so loss of function is not yet irreversible).
      *   *Constraint Check:* Does this feel like an ER case? Yes, DNR cardiac arrest. Is it one paragraph? Yes. Does it turn on "irreversible"? Yes.

