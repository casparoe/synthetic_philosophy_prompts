answer: |-
  Hey, this is a killer idea. It's exactly the kind of thing that sticks with students way better than drawing arrows on a whiteboard. The "resource-flow" mechanic makes the *cost* of justification tangible, which is usually the missing piece in these discussions.

  Since you need this for tomorrow, I've streamlined the logistics so you aren't fumbling with rules while trying to manage 14 undergrads. Here is the run-down for **"The Warrant Economy."**

  ### **Prep (Do this tonight)**
  *   **Belief Cards (14 total):** Index cards. Write a mundane claim on each (e.g., "It is raining," "2+2=4," "Murder is wrong," "That cup is blue").
      *   **The Twist:** On **3** of the cards, write **[BASIC]** in small print on the back. Do not tell them how many exist. These are the Foundationalist stoppers.
  *   **Warrant Tokens (70+ total):** Poker chips, dried beans, or even slips of paper. Each student gets **5 tokens** to start.
  *   **Timer:** Your phone.
  *   **Space:** Move chairs. You need a line for Round 1, a circle for Round 2, and a cluster for Round 3.

  ---

  ### **The Setup (5 Minutes)**
  Don't explain epistemology. Don't name the -isms. Just read the **Core Rule**:
  > "Your goal is to keep your Belief Card 'Active' until I call time. To keep it Active, your belief must be supported by someone else.
  >
  > **The Transaction:** To buy support from a classmate, you give them **1 Token**. However, they can only *sell* you support if they also spend **1 Token** to defend their own card.
  >
  > If you run out of Tokens, or if your supporter drops out, your belief becomes 'Unjustified.' If your belief is Unjustified when time is called, you lose your voting rights in the final debrief."

  *Check for understanding:* Ask one student to demonstrate a transaction with you. Make sure they see that **both** parties lose a token. This creates the scarcity pressure immediately.

  ---

  ### **Round 1: The Chain (15 Minutes)**
  **Goal:** Simulate Linear Regress / Foundationalism.
  **Setup:** Arrange students in a single file line (or two lines of 7).
  **Rule:** You may **only** buy support from the person immediately to your **left**. The person at the far left has no one to ask.

  **What happens:**
  1.  Everyone needs support. They turn to their left.
  2.  The neighbor says, "I'll support you, but I need support too." They turn to *their* left.
  3.  The chain races backward.
  4.  **The Stop:** Eventually, someone hits a student with a **[BASIC]** card. That student does *not* need to buy support (they are foundational). They can sell support without buying it.
  5.  **The Break:** Anyone "downstream" (to the right) of a Basic Card is safe. Anyone "upstream" (to the left) of the Basic Card who couldn't reach it before tokens ran out goes Unjustified.

  **Why it feels physical:** The students on the right feel helpless, waiting for the chain to find a foundation. The students on the left feel the arbitrariness of why *they* got the Basic Card and the person next to them didn't.

  ---

  ### **Round 2: The Loop (15 Minutes)**
  **Goal:** Simulate Coherentism.
  **Setup:** Arrange students in a tight circle.
  **Rule:** You may buy support from **anyone adjacent to you**. You may form mutual support agreements.

  **What happens:**
  1.  Students realize they can pair up. "I'll support you if you support me."
  2.  **The Drain:** Remind them of the Core Rule: *Every cycle costs tokens.* Even if A supports B and B supports A, to *maintain* that support for the duration of the round, they must pay the toll.
  3.  Set a timer for 5 minutes. Every 60 seconds, clap your hands. **"TICK."** Every clap represents a unit of time passing. For every clap, every active support link costs **1 additional token** from both parties.
  4.  Pairs will watch their token stacks shrink. They are stable (coherent), but they are bleeding resources.

  **Why it feels physical:** They feel the stability of the loop, but also the anxiety that it's not "free." It's sustainable only as long as they have reserves. It captures the "vicious circle" objection without you saying the words.

  ---

  ### **Round 3: The Web (15 Minutes)**
  **Goal:** Simulate Infinitism.
  **Setup:** Students stand and mingle freely (open network).
  **Rule:** You can buy support from **anyone**. However, the cost depends on **distance**.
  *   Direct neighbor: 1 Token.
  *   Across the room: 2 Tokens.
  *   **The Kicker:** If you buy support from someone who *just bought support*, you inherit their "chain length." (Keep this simple: Just tell them, "Every time you add a link to your justification chain, the cost doubles for the next person.")

  *Actually, let's simplify for playability:*
  **Revised Rule:** You can ask anyone. But every time you make a transaction, you must publicly announce "Link 1," "Link 2," etc. For every Link number, the token cost is equal to the Link number (Link 1 costs 1, Link 5 costs 5).
  **Goal:** Keep going as long as possible.

  **What happens:**
  1.  Students try to keep the chain going indefinitely.
  2.  The costs become prohibitive quickly.
  3.  They realize that to be *truly* justified (infinite), they would need infinite tokens. They run out of resources trying to extend the line forever.

  **Why it feels physical:** Exhaustion. The further they go, the heavier each step becomes.

  ---

  ### **The Debrief (25 Minutes)**
  *This is where you earn your pay. Do not lecture. Ask questions.*

  **1. The Map (5 mins)**
  Reveal the three positions. Ask them to match the rounds.
  *   "Which round felt like **Foundationalism**?" (Round 1: The relief of hitting the Basic Card, the frustration of those who didn't).
  *   "Which round felt like **Coherentism**?" (Round 2: The stability of the loop, but the draining cost).
  *   "Which round felt like **Infinitism**?" (Round 3: The ability to go forever, but the escalating cost).

  **2. The Structural Cost (10 mins)**
  Ask: "In Round 1, was it fair that the person with the [BASIC] card got to stop spending?"
  *   *Point:* This reveals the **Arbitrariness Objection** to Foundationalism. Why is *that* belief basic?
  Ask: "In Round 2, did the loop feel like 'cheating'?"
  *   *Point:* This reveals the **Vicious Circle Objection**. It works structurally, but does it actually connect to truth, or just internal consistency?
  Ask: "In Round 3, could anyone actually finish?"
  *   *Point:* This reveals the **Human Finitude Objection**. Infinitism might be logically possible, but can finite beings actually do it?

  **3. The Limitations (5 mins)**
  Be honest about what the game missed.
  *   "The game made justification about *tokens* (energy/time). In real epistemology, it's about *truth* or *probability*. Does draining tokens actually make a belief less true?"
  *   "In Round 2, the loop drained tokens. In real Coherentism, does mutual support *weaken* belief, or does it *strengthen* it?" (This is the big normative gap the game can't fully capture).

  **4. The Payoff (5 mins)**
  Count who has "Active" beliefs.
  *   "Look around. In every single system, some of you failed. The point isn't that one system wins. The point is that **regress is a tax you have to pay somewhere.** Either you pay it upfront (finding basics), you pay it continuously (maintaining coherence), or you pay it incrementally forever (infinite chain). There is no free lunch."

  ---

  ### **Troubleshooting: What Will Go Wrong**
  1.  **Token Hoarding:** Students will try to save tokens and not buy support.
      *   *Fix:* Walk around. If someone isn't transacting after 2 minutes, tell them, "An unsupported belief is automatically Unjustified. Spend or sit."
  2.  **The "Basic" Card Rebellion:** In Round 1, the people without the Basic Card will feel cheated.
      *   *Lean into it:* That frustration *is* the lesson. Let them complain. That's the "Arbitrariness Objection" in real-time.
  3.  **Round 2 Collapses Too Fast:** If they burn tokens too quickly, everyone fails.
      *   *Fix:* If you see panic, announce a "Subsidy." Give everyone 1 extra token mid-round. It shows that Coherentism requires external input to sustain the loop.
  4.  **Debrief Silence:** If the "Unjustified" students feel punished, they won't talk.
      *   *Fix:* Change the stakes. If their belief fails, they don't lose voting rights, but they become "Skeptics." Their job in the debrief is to attack the people whose beliefs succeeded. This gives them a role and keeps the energy high.

  ### **Final Tip**
  Keep the energy high. You're the Banker. Be strict about the token counts. If a student says "But logically..." stop them and say, "Pay the token first, argue later." The physical constraint is the whole point.

  Good luck. This is going to be loud, but they'll remember it.
