      *   **Core Mechanic:** Resource-flow game (Belief Cards + Warrant Tokens). Support costs tokens.
      *   **Specific Rounds:**
          1.  Linear Chain (Foundationalism simulation, hidden basic beliefs).
          2.  Circular Round (Coherentism simulation, mutual support loops, token drain).
          3.  Open Network (Infinitism simulation, distance costs).
      *   **Materials:** Cheap (index cards, tokens, string?).
      *   **Payoff:** "Belief Stability Points" (stay in discussion vs. sit out). Social/intellectual stakes.
      *   **Debrief:** Map rounds to positions *after* the fact. Acknowledge limitations (normative questions). Predict failures (hoarding, refusal to loop).
      *   **Tone:** Colloquial, practical, "talk to a classmate," ready for tomorrow. No bibliography.

  2.  **Evaluate the Proposed Mechanics (Critique & Refinement):**
      *   *Constraint Check:* The user has a specific vision. I need to make sure it actually *works* in 75 minutes with 12-14 students.
      *   *Round 1 (Linear):* "Ask person to their left." If there are 14 students, and only *one* has a basic belief, the chain breaks quickly. If *everyone* has a chance, it's better. The prompt says "basic card is hidden and randomly assigned." If only one person has it, 13 people lose immediately. That might kill the vibe. *Refinement:* Ensure a few "Basic Belief" cards exist (maybe 3 out of 14) so multiple chains can form, but students don't know who has them.
      *   *Round 2 (Circular):* "Arrange in a circle." "Mutual-support loop drains tokens." If every cycle drains tokens, the loop collapses eventually. This perfectly illustrates the "vicious circle" objection. *Refinement:* Make sure the token cost is clear.
      *   *Round 3 (Open Network):* "Costs double tokens the further away." This is tricky to manage physically. "Distance" in a classroom is vague. *Refinement:* Use string or yarn to physically measure "distance" or count steps of introduction. Let's use "steps of connection" (e.g., friend of a friend) to keep it manageable. Or, simpler: Just make *every* transaction cost more than the last to simulate the infinite burden. Actually, the prompt says "further away the supporter is." Let's interpret "distance" as "degrees of separation" in the justification chain.
      *   *Payoff:* "Sit out the debrief" is risky. If half the class sits out, the debrief dies. *Refinement:* If your chain breaks, you become an "Observer/Critic" with a specific role (e.g., pointing out where the break happened) rather than just sitting silently. This keeps them engaged.
      *   *Timing:* 75 mins. Intro (5), Round 1 (15), Round 2 (15), Round 3 (15), Debrief (25). This is tight. Need to keep rules simple.

  3.  **Drafting the Activity Plan:**
      *   **Title:** "The Warrant Economy."
      *   **Materials:** Index cards (Beliefs), Poker chips/beans (Tokens), Yarn (for connections in Round 3 maybe?), Timer.
      *   **Setup:** Pre-prep the cards.
      *   **Round 1 (The Line):** Focus on the "Stop." The frustration of hitting a wall or finding the "Magic Card."
      *   **Round 2 (The Loop):** Focus on the "Drain." The anxiety of the ticking clock/token count.
      *   **Round 3 (The Web):** Focus on the "Cost." The exhaustion of keeping it going.
      *   **Debrief:** The "Aha!" moment. Connect mechanics to -isms.

  4.  **Addressing the "Predictably Go Wrong" Section:**
      *   Students *will* hoard. They need an incentive to spend. *Fix:* You *must* spend to stay in.
      *   Students *will* feel circularity is cheating. *Fix:* Frame it as "mutual reinforcement" first, let them feel the drain second.
      *   Logistics: 14 students is an even number, good for pairs/circles.
      *   Time management: This is the biggest risk. Need strict timekeeping.

  5.  **Refining the Tone:**
      *   Needs to sound like a peer sharing a lesson plan. "Here's the run-down," "Pro-tip," "Don't overthink it."
      *   Avoid academic jargon in the instructions to students.
      *   Emphasize the *feeling* of the game.

  6.  **Final Polish (Self-Correction during drafting):**
      *   *Correction on Round 3:* The prompt says "costs double tokens the further away." Physically measuring distance is messy. Let's make it "Chain Length." If I ask you directly, 1 token. If I ask you through someone else, 2 tokens. This simulates Infinitism's "always more needed" without needing a tape measure.
      *   *Correction on Payoff:* Sitting out the debrief is bad pedagogy. Let's make it "If your belief falls, you lose your voice in the final discussion." That's a social penalty without physical exclusion.
      *   *Correction on Round 1:* If they hit a basic belief, does the chain stop costing? Yes, that's the point of foundationalism. The person with the Basic Card doesn't need to spend tokens to be supported, they just *are*.
      *   *Wait, one nuance:* In Round 1, if I ask the person to my left, and they don't have a basic belief, they must ask *their* left. This creates a chain. If someone hits a Basic Belief, the chain is secured *up to that point*. Everyone downstream is safe. Everyone upstream (who couldn't reach the basic belief) fails. This creates the "arbitrariness" feeling.

  7.  **Finalizing the Output Structure:**
