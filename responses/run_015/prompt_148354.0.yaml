      *   Closing encouragement.

  8.  *(Self-Correction on Token Logic)*: The prompt says "sell you support if they spend one of their own tokens." This means *both* parties spend. This is high cost. Let's stick to the prompt's mechanic but ensure they start with enough tokens (e.g., 5 tokens) so they don't die in Round 1.
      *   *Wait, re-reading prompt:* "spend a token to 'buy' support... they can only sell... if they spend one of their own." Okay, transaction cost is 2 tokens total (1 buyer, 1 seller).
      *   *Round 1:* Linear. If I buy from Left, they must buy from *their* Left. This forces a chain.
      *   *Round 2:* Circle. Mutual support.
