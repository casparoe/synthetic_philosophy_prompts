answer: |-
  # SEMINAR HANDOUT: DIAGNOSING REGULARITIES
  **Course:** Conventions & Norm Evolution | **Task:** Classify observed behavioral regularities.

  ## PART 1: DIAGNOSTIC CASES (OBSERVABLE ONLY)
  *Do not theorize yet. Just look at the behavior.*

  1.  **Road Side:** Cars in a country all drive on the left (or right) side of the road.
  2.  **Email Lag:** Employees reply to internal emails within roughly 48 hours.
  3.  **Potluck Dish:** Guests bring a food item when invited to a group dinner.
  4.  **Last Slice:** No one takes the final slice of pizza from the shared tray.
  5.  **Bad Keyboard:** Everyone uses a keyboard layout known to be slower than available alternatives. *(Case: Private Dislike)*
  6.  **Head Nod:** People move heads up-and-down to mean 'yes', down-to-up for 'no'.
  7.  **Funeral Black:** Attendees wear dark clothing to a burial ceremony.
  8.  **Bus Gap:** Passengers leave an empty seat between themselves and a stranger on a near-empty bus.
  9.  **Escalator Stand:** Commuters stand on the right, walk on the left, without signage.
  10. **Thermostat 18°C:** An office is kept at 18°C; three vocal staff scold anyone touching the dial, others comply indifferently. *(Case: Loud Enforcers)*

  ---

  ## PART 2: THE STATIC DECISION TREE
  *Answer the questions in order. A first-year student should be able to answer 'Yes' or 'No' based on observation or simple interview.*

  **Q1: Could everyone switch to a different pattern and be just as well off?**
  *   **NO:** → Go to **Q2**.
  *   **YES:** → Go to **Q3**.

  **Q2: Is this the only physically efficient way to do it?**
  *   **YES:** **LEAF: Plain Habit / Statistical Regularity.**
      *   *Commitment:* There is no 'ought' here, only 'is'.
  *   **NO (It solved a past problem now gone):** **LEAF: Teleological Account (Proper Function).**
      *   *Commitment:* Current correctness depends on past selection history.

  **Q3: If everyone secretly hated this but thought others liked it, would they still do it?**
  *   **NO (They would stop):** → Go to **Q4**.
  *   **YES (They would keep going):** → Go to **Q5**.

  **Q4: Do you need to *know* that others expect this to keep doing it?**
  *   **YES:** **LEAF: Lewisian Convention.**
      *   *Commitment:* Agents must represent the expectations to themselves.
  *   **NO (Reinforcement is enough):** **LEAF: Skyrmsian Evolutionary.**
      *   *Commitment:* No representation needed, just reinforcement/drift.

  **Q5: Do people get treated badly (scolded, excluded) for breaking the pattern?**
  *   **NO:** **LEAF: Boyd-Richerson Cultural Transmission.**
      *   *Commitment:* Conformist bias explains stability without individual rationality.
  *   **YES:** → Go to **Q6**.

  **Q6: Do people feel they explicitly agreed to this together?**
  *   **YES:** **LEAF: Gilbert's Joint Commitment.**
      *   *Commitment:* Creates a new plural subject, not just aggregated individuals.
  *   **NO:** → Go to **Q7**.

  **Q7: Is the sanction about keeping score in a discourse/argument?**
  *   **YES:** **LEAF: Brandomian Inferentialism.**
      *   *Commitment:* Normativity exists in the attitude of taking someone to be bound.
  *   **NO:** **LEAF: Bicchieri Social Norm.**
      *   *Commitment:* Preferences are conditional on empirical and normative expectations.

  *(If a combination of answers leads nowhere: **LEAF: UNNAMED**.)*

  ---

  ## PART 3: THE DYNAMICS TREE (BOOTSTRAP)
  *How did this regularity start? 'Thin' = Salience/Focal Point. 'Thick' = Prior Norm/Precedent.*

  **Q1: Was there any normative rule or precedent on the scene before this regularity existed?**
  *   **NO (Thin Bootstrap):** Explains **Lewis, Skyrms, Habit, Boyd-Richerson.**
      *   *Mechanism:* Salience or random drift initiates the pattern.
  *   **YES (Thick Bootstrap):** Explains **Bicchieri, Gilbert, Brandom, Teleological.**
      *   *Mechanism:* Existing normative force is transferred or specified.

  ---

  ## PART 4: EQUIVALENCES, GAPS, & MIGRATION

  ### ⚠️ Indistinguishable Leaves (Steady State)
  | Pair | Why they look identical | Extra Observation Needed |
  | :--- | :--- | :--- |
  | **Lewis vs. Skyrms** | Both show stable arbitrary coordination with no sanctions. | Ask agents *during acquisition*: Did they reason about expectations (Lewis) or just trial-and-error (Skyrms)? |
  | **Bicchieri vs. Gilbert** | Universal compliance, sanctions rarely observed. | Ask: Can a single person change the norm? (Gilbert: No, need collective rescission. Bicchieri: Yes, if expectations shift). |

  ### ⚪ Logically Available but Unoccupied
  | Combination | Status | Reason |
  | :--- | :--- | :--- |
  | **Arbitrary + No Alternative Equilibrium + Expectation Held** | **Incoherent** | If it is arbitrary, an alternative equilibrium must exist by definition. |
  | **Non-Arbitrary + Sanction Heavy + No Function** | **Unexplored** | Why sanction if no coordination gain and no moral content? Possibly pure power dynamics (not yet theorized as norm). |
  | **Arbitrary + Moral Sanction + No Expectation** | **Unattractive** | Hard to justify moralizing an arbitrary act without social expectation (hypocrisy problem). |

  ### 📦 SIDE-BOX: EVIDENCE OF MIGRATION
  *Norms are not eternal essences. A case can move between leaves over time.*
  **Look for:**
  1.  **Change in Justification:** "We do this because it works" (Lewis) shifts to "We do this because it's right" (Bicchieri).
  2.  **Sanction Severity:** Informal irritation escalates to formal exclusion (Skyrms → Bicchieri).
  3.  **Private Attitude:** Compliance remains while private preference flips (Lewis → Bicchieri/Gilbert).
  4.  **Historical Awareness:** The original practical function is forgotten, but behavior remains (Teleological → Habit).

  ---
  *Handout End.*
