answer: |-
  # Q&A Defense Prep Sheet: Structural Moral Uncertainty & Intergenerational Obligations

  **Context:** Workshop Defense (15 Scholars)
  **Core Thesis:** Framework-sensitive deference based on moral learning coherence (not flat priors).
  **Tone:** Rigorous, non-deferential to authority, precise on meta-normative distinctions.

  ---

  ### 1. The Skeptical Decision Theorist: "Moral Uncertainty as Empirical Uncertainty"
  **Objection:** "You treat 'structural moral uncertainty' as a distinct category requiring a new decision rule. But my view is that uncertainty about which normative framework is true is just ordinary empirical uncertainty about the normative structure of reality. If you're uncertain whether consequentialism is true, you're uncertain about a fact. Standard expected utility theory already handles factual uncertainty. Why do we need 'framework-sensitive deference' rather than just updating credences over moral facts based on evidence?"

  **Reply:**
  "Two points. First, treating normative frameworks as empirical facts assumes a moral realism that allows for straightforward truth-conditional updating. But structural uncertainty often involves incommensurable *units* of value, not just uncertain parameters. If a deontologist and a consequentialist disagree, they aren't just disagreeing about the magnitude of a variable; they are disagreeing about what counts as a variable. Standard expected utility theory breaks down when the utility functions themselves are mutually unintelligible.
  Second, my proposal isn't about updating credences based on evidence of truth; it's about weighting based on *procedural robustness*. In long-horizon contexts like climate governance, we lack the evidence to update credences toward a 'true' framework because the feedback on moral correctness is delayed by centuries. Therefore, relying on empirical updating is functionally blind. We need a heuristic that privileges frameworks capable of surviving that blindness. Framework-sensitive deference doesn't solve the metaphysical status of moral facts; it solves the practical problem of acting when those facts are epistemically inaccessible across generations."

  **Weakness/Concession:**
  *I concede this relies on a strong claim of intertheoretic incomparability. If the decision theorist can show a common currency of 'choice-worthiness,' their objection holds. I am assuming incomparability without proving it.*

  ---

  ### 2. The Consequentialist Majority: "The Stakes Argument"
  **Objection:** "Even if your learning-coherence metric is elegant, it ignores the stakes. If act-consequentialism is the true morality, then failing to maximize expected value could result in astronomical suffering for future generations. By down-weighting consequentialism because it treats principles as 'fixed axioms,' you are effectively gambling with lives. Why privilege the *process* of moral learning over the *outcome* of moral correctness when the outcome involves existential risk?"

  **Reply:**
  "This assumes we can identify the 'outcome of moral correctness' independently of the framework. But under structural uncertainty, we don't know what 'maximizing value' entails. More critically, in intergenerational contexts, the 'fixed axiom' approach is brittle. A consequentialist framework that demands precise calculation of future utility often leads to 'cluelessness'—we simply cannot calculate the effects of climate policy over 300 years.
  My weighting scheme doesn't discard consequentialism; it discounts it *in proportion to its epistemic fragility* over time. A framework that admits it cannot know the future good, and thus builds institutional correction mechanisms (like contractualist review), is less likely to lock in catastrophic errors. I am not prioritizing process over outcome; I am arguing that in deep time, robust process *is* the only reliable proxy for good outcomes. Betting everything on a fixed axiom that might be wrong is the greater gamble."

  **Weakness/Concession:**
  *I risk sounding like I'm redefining consequentialism to save my theory. If they press that 'cluelessness' is an epistemic problem, not a normative one, I have to admit my view changes the normative demand, not just the epistemic strategy.*

  ---

  ### 3. [CRITICAL] The Meta-Normative Smuggling Charge ("The Hope Nobody Asks")
  **Objection:** "You claim to be neutral between frameworks, weighting them by 'internal coherence with moral learning.' But what justifies 'learning' and 'self-correction' as the weighting criteria? That sounds like a pragmatic, stability-based metric. Aren't you secretly employing a consequentialist or pragmatist meta-normative standard to judge the first-order frameworks? You're selecting frameworks based on their survival capacity, which is itself a consequentialist good. You haven't defended the meta-normative stance that makes your weighting rule valid."

  **Reply:**
  "This is the sharpest challenge. I am not claiming my meta-normative stance is framework-neutral in a God's-eye view. I am claiming it is *practically* necessary for the specific domain of intergenerational governance. When obligations extend beyond the lifespan of any moral agent who can verify compliance, 'truth' becomes operationally indistinguishable from 'sustainable justification.'
  I am not smuggling in consequentialism; I am shifting the locus of normativity from *act-evaluation* to *system-evaluation* for this specific problem class. If a framework cannot account for its own revision in the face of new moral data from the future, it is functionally incompetent for long-term policy. This isn't a hidden consequentialist metric; it's a competence constraint. Just as we wouldn't use a bridge design that can't tolerate material fatigue, we shouldn't use a moral framework that can't tolerate moral revision. The 'good' I'm maximizing isn't welfare; it's the continuity of moral agency itself."

  **Weakness/Concession:**
  *This is my most vulnerable point. I am effectively asserting a second-order normative claim without a full defense of why 'continuity of agency' trumps other meta-normative values. If they reject 'competence' as a normative filter, my whole weighting scheme collapses.*

  ---

  ### 4. The Kantian/Intergenerational Specialist: "The Non-Existence Problem"
  **Objection:** "You privilege contractualist and virtue-theoretic accounts because they rely on institutional feedback loops. But future people do not exist. They cannot participate in the contract, nor can they provide feedback to the virtuous agent. If your weighting depends on the capacity for feedback, and future generations lack that capacity, aren't you implicitly excluding them from the moral community? You're grounding their status in their ability to correct us, which they cannot do."

  **Reply:**
  "I am not grounding their *status* in their feedback capacity, but our *obligation's structure* in our capacity to receive feedback. The feedback loop isn't between us and them directly; it's between us and the institutions we build to represent them. Contractualism here isn't about actual consent from the future; it's about constructing standing procedures that *would* withstand their scrutiny if they were present.
  Virtue ethics similarly isn't about their reaction to us, but about cultivating a character trait of 'temporal humility' that anticipates correction. The weight comes from the framework's ability to institutionalize representation for the voiceless, not the voiceless speaking for themselves. If a framework treats future people as fixed constraints (like deontological side-constraints), it risks ignoring how their needs change. Frameworks that build proxies and review boards are weighting the *uncertainty* of their needs, not their moral status."

  **Weakness/Concession:**
  *I am conflating 'representation' with 'feedback.' If they argue that proxy feedback is not moral feedback, I lose the 'learning' advantage for these frameworks. I rely heavily on the legitimacy of political proxies.*

  ---

  ### 5. The Virtue Ethicist: "Quantifying Phronesis"
  **Objection:** "You propose assigning decision weights based on a framework's coherence with 'practical wisdom' or moral learning. But virtue ethics resists quantification. *Phronesis* is context-sensitive and non-codifiable. How can you plug 'degree of virtue-theoretic flexibility' into a decision matrix without destroying the very phenomenon you're trying to capture? You're turning wisdom into a parameter."

  **Reply:**
  "I agree that *phronesis* itself cannot be quantified. However, we are not quantifying the virtue; we are quantifying the *institutional footprint* of the virtue. We can assess whether a policy framework allows for discretionary judgment and revision in response to unforeseen moral contours.
  My weighting doesn't require measuring wisdom; it requires measuring the *space for wisdom* within the decision rule. A rigid algorithmic rule leaves no space for *phronesis*; a governance structure with review clauses does. I am weighting the frameworks based on whether they permit the exercise of practical wisdom, not by trying to calculate the wisdom itself. The metric is structural openness, not moral magnitude."

  **Weakness/Concession:**
  *This distinction between 'space for wisdom' and 'wisdom' is thin. If the decision theorists press me on how to measure 'structural openness' without bias, I may have to admit it's a qualitative judgment call, which weakens the formal rigor of my proposal.*

  ---

  ### 6. The Climate Ethicist: "Urgency vs. Deliberation"
  **Objection:** "You argue for weighting frameworks that allow for self-correction and feedback loops. But climate mitigation requires immediate, drastic action. Institutional feedback loops are slow by design. By privileging frameworks that emphasize deliberation and revision, aren't you advocating for a pace of decision-making that guarantees we miss the 1.5-degree target? Isn't 'learning' a luxury we can't afford?"

  **Reply:**
  "This assumes that 'self-correction' implies 'slow action.' It does not. It implies 'reversible action' or 'adaptive pathways.' A framework that demands fixed axioms might lock us into a specific technology or policy that turns out to be morally or ecologically disastrous.
  The weighting I propose favors frameworks that mandate *monitoring* alongside mitigation. We can act immediately, but we must act within a structure that allows us to pivot if the moral or empirical landscape shifts. The danger isn't just warming; it's maladaptation. A framework that forbids revision (because it treats the initial action as axiomatically right) is more dangerous in the long run than one that acts quickly but builds in a five-year moral review. We need speed, but not blindness."

  **Weakness/Concession:**
  *I am assuming political institutions can actually move fast enough to match climate timelines. If the 'feedback loop' inherently creates bureaucratic drag, my argument fails on pragmatic grounds.*

  ---

  ### 7. The Formal Decision Theorist: "Intertheoretic Comparison"
  **Objection:** "To assign weights based on 'internal coherence,' you must be able to compare the coherence of Framework A against Framework B. But if these frameworks are structurally distinct (as you claim), they likely have different definitions of 'coherence.' How do you normalize 'deontological consistency' against 'virtue-theoretic adaptability' on a single scale? You're assuming a common metric of coherence that doesn't exist."

  **Reply:**
  "I am not comparing their first-order coherence (e.g., consistency of rules vs. consistency of character). I am comparing their second-order coherence with the *temporal constraints of the problem*. The common metric is not moral truth; it is 'fit for purpose' regarding intergenerational timeframes.
  Does the framework's account of moral knowledge match the epistemic horizon of climate change? That is a functional question, not a moral one. We can evaluate whether a framework's epistemology is compatible with long-term uncertainty without needing to translate its moral values into a common currency. The scale is 'epistemic suitability,' not 'moral worth.'"

  **Weakness/Concession:**
  *'Epistemic suitability' is itself a normative standard. I am pushing the meta-normative problem back one step. If they ask 'Why is epistemic suitability the relevant metric?', I am back to Objection 3.*

  ---

  ### 8. The Epistemologist: "Second-Order Uncertainty Regress"
  **Objection:** "You resolve first-order moral uncertainty by appealing to a second-order rule about moral learning. But aren't you uncertain about that second-order rule? Shouldn't we apply your own logic to the weighting rule itself? This leads to an infinite regress of uncertainty about which uncertainty-resolution strategy to use."

  **Reply:**
  "In practice, regress stops where agency begins. We must act. The 'framework-sensitive deference' I propose is not a perfect algorithm; it is a reflective equilibrium for this specific context. We stop the regress at the point where we identify a constraint that is undeniable for the problem at hand: the existence of future people who cannot speak.
  Any framework that ignores this constraint is functionally disqualified. I am not claiming my weighting rule is immune to uncertainty; I am claiming it is the most *stable* fixed point we have. We accept the regress risk because the alternative—arbitrary flat priors—is demonstrably worse for long-term governance. We choose the tool that minimizes the risk of irreversible moral error."

  **Weakness/Concession:**
  *This is a pragmatic 'stopper.' It admits I cannot theoretically solve the regress, only practically halt it. A rigorous epistemologist will find this unsatisfying, but it's the best I can do without spiraling.*
