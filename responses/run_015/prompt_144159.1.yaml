prompt: |-
  Me and about a dozen others run a tiny giving circle — we each put in £20 a month, and once a year we argue about where the few thousand pounds goes. I've definately started to think we're not being consistent with ourselves, so I'd like to know what rule we're actually running and what it says about this year's decision.

  What we've decided so far:
  - bednets against malaria, in a country none of us has any connection to — funded
  - a hospice in our own town that two of our members have personal ties to — turned down, because they hit their fundraising target every year and our money wouldn't have added anything
  - a summer holiday version of a reading programme in our own city, in a cause that's already well funded, because nobody else was going to pay for that particular bit — funded
  - research into a rare disease almost nobody funds, tiny number of people affected, no real track record — funded, but only £500 and after a fight about it being a lottery ticket
  - work on making dangerous pathogen labs safer, because it might matter a lot in thirty years — turned down, we couldn't see how to tell if it had done anything
  - a small group whose entire output is research telling other funders where to give — funded, which three of us thought was mad
  - a campaign to get a supermarket chain to stop using one particularly nasty method of killing farmed fish — we couldn't agree, put it off, and it's come back round

  That last one is the decision in front of us now. The numbers of fish involved are enormous, nobody else is funding anything on fish here, and the campaign is cheap. But we're not sure fish feel much of anything, the evidence that campaigns like this actually change practice is thin, and one of us says that if it works the supermarket will just buy from a farm still using the old method, so we'd have bought nothing at all.

  I know the importance / tractability / neglectedness thing, so don't just explain that at me — I want to know which version of it we're running, or whether we're really doing something else, like only caring what our particular money causes. Given our record, what should we decide, which old decision is the closest thing to it, and where our record genuinely doesn't settle it, what would we be signing up to either way? And what's the one application we'd have to see next year to tell the difference?
reasoning: |-
  Here's a thinking process that leads to the suggested analysis:

  1.  **Deconstruct the Request:**
      *   **Context:** A small giving circle (~12 people, £20/month each, ~£3k/year).
      *   **Problem:** They feel inconsistent and want to identify their implicit decision-making rule to apply it to the current dilemma (fish welfare campaign).
      *   **Input Data:** A list of 7 past decisions (funded vs. turned down) with reasons.
      *   **Current Dilemma:** Fish welfare campaign (high scale, neglected, cheap, but uncertain sentience, uncertain efficacy, risk of displacement).
      *   **Constraints:** Do *not* just explain ITN (Importance/Tractability/Neglectedness). The user knows it. They want to know *which version* they are running or if it's something else (e.g., counterfactual impact).
      *   **Outputs Required:**
          1.  Identify the implicit rule/framework they are actually using.
          2.  Advise on the current decision based on that rule.
          3.  Identify the closest past decision analogue.
          4.  Highlight where the record doesn't settle it (the tension).
          5.  Propose a "test case" for next year to distinguish between competing interpretations.

  2.  **Analyze the Past Decisions:**

      *   *Bednets (Malaria, distant):* **Funded.** High evidence, high scale, neglected (relative to need), impersonal.
      *   *Local Hospice (Personal ties, well-funded):* **Turned Down.** Reason: Counterfactual impact low (they hit targets anyway). *Key Insight:* Personal connection didn't save it; funding saturation killed it.
      *   *Local Reading Programme (Well-funded cause, specific gap):* **Funded.** Reason: "Nobody else was going to pay for that particular bit." *Key Insight:* Counterfactual impact is king. Even if the cause isn't neglected, the *specific niche* was.
      *   *Rare Disease Research (Tiny scale, low evidence):* **Funded (partial, contentious).** Reason: Neglectedness ("almost nobody funds"). *Key Insight:* Willingness to gamble on high uncertainty if neglectedness is high, but capped the bet (£500).
      *   *Pathogen Lab Safety (High scale, long-term, hard to measure):* **Turned Down.** Reason: "Couldn't see how to tell if it had done anything." *Key Insight:* Tractability/Measurability trumps Importance. If you can't verify impact, you don't pay.
      *   *Meta-Research (Tell others where to give):* **Funded (contentious).** Reason: Leverage? *Key Insight:* Willingness to fund indirect impact if the multiplier is perceived as high, despite skepticism from some members.
      *   *Fish Welfare (Current):* **Undecided.** High scale, neglected, cheap. Concerns: Sentience (Importance), Evidence (Tractability), Displacement (Counterfactual).

  3.  **Synthesize the Implicit Rule:**

      *   *Is it pure Effective Altruism (ITN)?* Not quite. They funded the Reading Programme (not important/neglected globally) and the Rare Disease (not important by scale). They turned down Lab Safety (important/neglected but unmeasurable).
      *   *Is it Local/Personal?* No. Hospice turned down despite personal ties. Bednets funded despite no connection.
      *   *Is it Counterfactual Impact?* This is the strongest thread.
          *   Hospice: Rejected because *not* counterfactual (they'd get money elsewhere).
          *   Reading Programme: Accepted because *was* counterfactual (nobody else paying for *this bit*).
          *   Bednets: Implicitly counterfactual (lives saved that wouldn't be otherwise).
          *   Lab Safety: Rejected partly because impact is hard to verify (attribution problem).
          *   Fish: The objection "supermarket will just buy from a farm still using the old method" is a pure counterfactual objection (leakage/displacement).
      *   *Is it Verifiability?* Strong signal. Lab Safety rejected because "couldn't see how to tell." Rare Disease funded but capped (high uncertainty).
      *   *Is it Consensus/Comfort?* They cap bets when uncomfortable (Rare Disease £500). They fund meta-research despite 3 thinking it's "mad" (so majority rules, but tension exists).

      *   *The Rule:* **"Verified Counterfactual Impact."**
          *   Must be additional (wouldn't happen otherwise).
          *   Must be measurable/verifiable (we need to know it worked).
          *   Scale matters, but can be overridden by specific gaps (Reading Programme) or high neglectedness (Rare Disease).
          *   Personal connection is irrelevant unless it aligns with the above.

  4.  **Apply Rule to Current Decision (Fish Welfare):**

      *   *Neglectedness:* High (nobody else funding fish here). -> **Pass.**
      *   *Scale:* High (enormous numbers). -> **Pass** (if sentience accepted).
      *   *Counterfactual:* Risky. "Supermarket will just buy from elsewhere." -> **Fail/Warning.**
      *   *Verifiability:* "Evidence... is thin." -> **Fail/Warning.**
      *   *Sentience:* "Not sure fish feel much." -> **Importance Uncertainty.**

      *   *Comparison:*
          *   Closest to *Rare Disease*? (High uncertainty, neglected). But Rare Disease was capped.
          *   Closest to *Reading Programme*? (Specific gap nobody else filling). But Reading Programme had clear output (kids read).
          *   Closest to *Lab Safety*? (Hard to measure, long-term/uncertain chain). Lab Safety was rejected.

      *   *Verdict:* Based on the *Lab Safety* precedent, this should be **Turned Down**. The inability to verify impact and the counterfactual leakage risk mirror the Lab Safety rejection reasons more than the Rare Disease acceptance (which was capped due to uncertainty). However, the *Reading Programme* precedent suggests funding specific gaps. The tie-breaker is measurability.

  5.  **Drafting the Response:**

      *   *Tone:* Analytical, respectful of the group's history, direct.
      *   *Section 1: The Diagnosis.* Name the framework. It's not pure ITN. It's "Counterfactual Additionality + Verifiability."
      *   *Section 2: The Decision.* Apply the diagnosis. The fish campaign fails the "Verifiability" and "Counterfactual" tests based on the Lab Safety and Hospice precedents.
      *   *Section 3: The Analogue.* Lab Safety is the closest negative analogue. Reading Programme is the closest positive analogue (but weaker on metrics).
      *   *Section 4: The Tension.* Where does the record not settle it? The "Rare Disease" exception. They *do* gamble on neglectedness sometimes. So why not here? Because Rare Disease had a clear output (research papers), Fish has unclear output (policy change + leakage).
      *   *Section 5: The Test Case.* What application next year distinguishes the two paths? Need something High Scale + Low Verifiability vs. Low Scale + High Verifiability. Or something that tests the "Displacement" fear.

  6.  **Refining the Analysis (Self-Correction during drafting):**
      *   *Wait, check the Meta-Research decision.* They funded people telling others where to give. That's high leverage but hard to measure direct impact. Why was that funded? Probably because it *amplifies* the counterfactual impact of others.
      *   *Check the Rare Disease decision.* It was a "fight" and capped at £500. This implies a "Risk Budget." They have a bucket for speculative bets.
      *   *Re-evaluating Fish:* Is Fish a speculative bet? Yes. So maybe it fits in the "Rare Disease" bucket?
      *   *Distinction:* Rare Disease = "Tiny number of people affected." Fish = "Enormous numbers."
      *   *The Crux:* The Lab Safety rejection is the strongest constraint. "Couldn't see how to tell if it had done anything." The Fish prompt says "evidence... is thin." This aligns with Lab Safety.
      *   *The Counterfactual:* The Hospice rejection is the strongest constraint on "Does our money matter?" Hospice said "They hit target anyway." Fish objection says "Supermarket buys from elsewhere." Both are leakage/additionality failures.

      *   *Conclusion:* The group is **Counterfactual Fundamentalists with a Verifiability Veto.** They will fund niche gaps (Reading) or high-neglectedness gambles (Rare Disease), *but only if* they can see the money moving the needle (Hospice rejected, Lab Safety rejected).

      *   *Recommendation:* Turn it down, OR fund it as a "Rare Disease" style capped gamble *if* they can define a success metric. But given the "Lab Safety" precedent, a Turn Down is more consistent.

      *   *The Test Case:* Needs to separate "Hard to Measure Impact" from "Hard to Measure Success."
      *   *Idea:* A policy campaign where success is binary (law passed) but attribution is hard (did we do it?) vs. a direct service where attribution is easy but scale is low.
      *   *Better Idea:* A "Displacement" test. A project that explicitly admits it might displace activity but claims net positive.

  7.  **Final Polish:** Ensure I answer all specific questions in the prompt.
      *   Which rule? (Counterfactual Additionality + Verifiability).
      *   What should we decide? (Decline, based on Lab Safety/Hospice).
      *   Closest old decision? (Lab Safety).
      *   Where record doesn't settle it? (The Rare Disease exception for neglectedness).
      *   One application next year? (A project with clear metrics but high displacement risk vs. one with fuzzy metrics but guaranteed additionality).

  8.  *(Self-Correction on the "Rule" Name)*: Don't use EA jargon if possible, or explain it through their actions. Call it "The Additionality and Evidence Rule."

      *   *Wait, one nuance:* The Reading Programme was "well funded cause... nobody else paying for that particular bit." This is *marginal* additionality.
      *   The Fish Campaign is "nobody else is funding anything on fish here." This is *categorical* neglectedness.
      *   The objection is about *leakage* (supermarket buys elsewhere).
      *   So the core conflict is: Does "Nobody else funding this" (Neglectedness) override "Might not actually change the outcome" (Counterfactual/Tractability)?
      *   Looking at Lab Safety: "Might matter a lot" (Importance/Neglectedness) vs "Couldn't see how to tell" (Tractability). Tractability won.
      *   Looking at Rare Disease: "Tiny number... no track record" (Tractability/Importance low) vs "Almost nobody funds" (Neglectedness). Neglectedness won (partially).
      *   So there is a tension between the Lab Safety precedent and the Rare Disease precedent.
      *   Fish looks more like Lab Safety (Scale is high, but measurement is low) than Rare Disease (Scale is low, measurement is medium).
      *   Actually, Fish looks like *both*. High Scale (Lab Safety) + High Neglectedness (Rare Disease).
      *   The tiebreaker is the *Counterfactual* objection. Hospice turned down because money wouldn't add anything. Fish objection is money wouldn't add anything (displacement).
      *   Therefore: **Counterfactual Impact is the supreme rule.** Neglectedness only matters if it leads to Counterfactual Impact.

      *   *Okay, ready to write.*
answer: |-
  Based on your history, you are not running a standard Effective Altruism (ITN) framework, nor are you running a "local community" or "personal connection" framework. You are running a **Counterfactual Additionality with a Verifiability Veto** rule.

  Here is the breakdown of your actual operating system, how it applies to the fish campaign, and how to test it next year.

  ### 1. The Rule You Are Actually Running
  Your decisions reveal a hierarchy of values that overrides standard "Importance/Tractability/Neglectedness":

  1.  **Counterfactual Additionality (The Supreme Rule):** Would this happen without us?
      *   *Evidence:* You turned down the **Hospice** (personal ties, high importance) because they would hit their target anyway. You funded the **Reading Programme** (low importance) specifically because "nobody else was going to pay for that particular bit."
      *   *Meaning:* You do not buy "shares" in a good cause; you buy the *marginal difference* your money makes.
  2.  **Verifiability (The Veto):** Can we see that it worked?
      *   *Evidence:* You turned down **Pathogen Labs** (high importance, high neglectedness) because you "couldn't see how to tell if it had done anything."
      *   *Meaning:* If the chain of causation is too long or fuzzy, you walk away, regardless of how important the goal is.
  3.  **Neglectedness (The Tie-Breaker):** Is anyone else looking at this?
      *   *Evidence:* You funded the **Rare Disease** research despite low scale and low track record, primarily because "almost nobody funds" it.
      *   *Meaning:* You are willing to gamble on uncertainty *if* the niche is empty, but you cap the bet (£500) when evidence is thin.
  4.  **Personal Connection (Irrelevant):**
      *   *Evidence:* **Hospice** turned down despite member ties; **Bednets** funded despite no ties.

  ### 2. The Decision on the Fish Campaign
  **You should turn it down.**

  Here is why, based strictly on your precedents:
  *   **The Counterfactual Failure:** The objection that "the supermarket will just buy from a farm still using the old method" is identical to the **Hospice** reasoning. If the total amount of suffering doesn't decrease because the activity just shifts elsewhere, your money has not purchased additionality. It has purchased displacement.
  *   **The Verifiability Failure:** You noted "evidence... is thin" and "not sure fish feel much." This mirrors the **Pathogen Labs** rejection. You rejected labs because you couldn't measure safety; you should reject fish because you can't measure suffering or policy success.
  *   **The Neglectedness Trap:** While "nobody else is funding anything on fish here" matches the **Rare Disease** precedent, the Rare Disease bet was capped at £500 because of the uncertainty. The Fish campaign is asking for a full commitment despite having *two* strikes against it (Counterfactual + Verifiability), whereas Rare Disease only had one (Verifiability/Track Record).

  ### 3. The Closest Analogue
  The **Pathogen Lab Safety** decision is the closest match.
  *   **Similarities:** High potential scale ("matter a lot" vs. "numbers of fish enormous"), long time horizon/uncertain chain of causation, and crucially, a failure of measurement ("couldn't see how to tell" vs. "evidence is thin").
  *   **Difference:** The Lab Safety project was turned down. The Fish project should be too, unless you treat it as a speculative gamble.

  The **Reading Programme** is the *distractor* analogue. It looks similar because "nobody else was going to pay," but the Reading Programme had a clear, immediate output (kids get books/tuition). The Fish campaign has a murky output (policy change + potential leakage).

  ### 4. Where Your Record Doesn't Settle It
  There is a genuine tension between your **Rare Disease** decision and your **Pathogen Lab** decision.

  *   **Rare Disease:** You funded something with "no real track record" because it was neglected.
  *   **Pathogen Lab:** You rejected something with high importance because it was hard to measure.

  **The Tension:** Is "Neglectedness" enough to override "Verifiability"?
  *   If you fund the Fish campaign, you are ruling that **Neglectedness > Verifiability**. You are saying, "It matters that no one else is doing this, even if we can't prove it works."
  *   If you reject the Fish campaign, you are ruling that **Verifiability > Neglectedness**. You are saying, "We need to know it works, even if no one else is looking."

  Your record suggests Verifiability usually wins (Labs rejected, Hospice rejected), *unless* you treat the grant as a "lottery ticket" (Rare Disease). If you fund the fish campaign, you must cap it at £500 like the Rare Disease grant to remain consistent. If you fund it fully, you are breaking your own rule.

  ### 5. The Test Case for Next Year
  To distinguish whether you are a **Counterfactual Fundamentalist** group or a **Neglectedness Gambler** group, you need to see this specific application next year:

  **The Application:** A local, direct-service project (e.g., a food bank or shelter) that is **fully funded by other donors** but has a specific, unfunded gap (e.g., a new van or a specific staff role) that would allow them to serve 20% more people. The metrics are crystal clear (meals served), but the counterfactual is debated (would the other donors have covered it if we didn't?).

  *   **If you fund it:** You prioritize **Verifiability and Scale** over strict Counterfactuals. (You are willing to "subsidize" other donors if the outcome is clear).
  *   **If you reject it:** You are **Counterfactual Purists**. (You will not fund anything unless you are certain the project dies without you, even if the metrics are perfect).

  **Alternatively, to test the Fish decision specifically:**
  Next year, if a project comes up that has **guaranteed additionality** (you know exactly what changes because of you) but **low neglectedness** (a popular cause, lots of other funders), and you fund it, you have abandoned the Neglectedness criterion entirely. If you reject it, the Fish decision should definitely have been a "No."

  ### Summary Advice for the Meeting
  Tell the group: *"Our history shows we reject projects where we can't measure success (Labs) or where our money doesn't change the outcome (Hospice). The Fish campaign fails both tests. The only precedent for funding it is the Rare Disease gamble, which means if we fund it, we must cap it at £500 and admit it's a lottery ticket, not a strategic grant."*
