      *   *Address the Queue-Jumper:* The queue-jumper is arguably *less* ethically problematic regarding systemic change, but arguably *more* problematic regarding personal virtue (participating in rudeness). However, the tipper is causing *structural damage*. The tipper comes out worse in terms of social impact; the queue-jumper comes out worse in terms of personal manners.

