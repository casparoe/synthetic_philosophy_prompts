      *   *Agency:* The user is an outsider with temporary status.
      *   *Ethical Framework:* Consequentialism (outcomes), Deontology (rules/duty), Virtue Ethics (character).

  3.  **Deconstruct the Queue-Jumping Scenario:**
      *   *Intent:* Assimilation, not imposing foreign norms ("arrogance to stand aside").
