answer: |-
  This is a sophisticated ethical puzzle because it pits good intentions against systemic consequences, and personal virtue against cultural assimilation. You are asking for a structural analysis, not a cultural one. You want to know the mechanics of the wrong, not just that "it's not done here."

  Here is the precise location of the disagreement, the distinction between your case and your friend's, and a recommendation on how to proceed.

  ### 1. Is what you did wrong?
  **Yes, in this specific context.**
  Your local friend is correct, though perhaps ungracious in her delivery. The wrongness does not stem from the transfer of money itself (generosity is rarely inherently wrong), but from the **conditions and consequences** of that transfer.

  ### 2. What is the wrong-making feature?
  There are three distinct ethical failures in your current practice. They compound each other.

  **A. Externalizing Costs (The "Exit" Problem)**
  This is the most significant structural flaw. You are introducing a change to a social contract (the wage/service expectation) that you will not be around to maintain or suffer.
  *   **The Dynamic:** By tipping, you raise the baseline expectation for staff income or effort. When you leave in 18 months, that expectation may remain, but the revenue (your tips) will vanish.
  *   **The Harm:** You have created a deficit. The staff may expect that level of income; the other customers may feel pressured to match your spending to avoid "cooler" treatment. You have privatized the benefit (better service now) and socialized the cost (tension and inflated expectations later). This is a form of moral free-riding.

  **B. Corrupting the Service Relationship (The "Bribe" Problem)**
  In your home culture, tipping is often framed as a "moral duty" for fair wages. In this host culture, wages are legally settled. Therefore, your extra cash is not completing a wage; it is purchasing **preferential treatment**.
  *   **The Dynamic:** You admit the staff are now "cool to customers who don't" tip.
  *   **The Harm:** You have converted a universal right (good service for the menu price) into a commodity available only to those with insider knowledge or extra cash. You are effectively gentrifying the service counter. This undermines the egalitarian intent of the local "service included" law.

  **C. Undermining Local Agency (The "Imperial" Problem)**
  The local norm (no tipping, union wages) is a political achievement. It represents a collective agreement that service workers should be paid by employers, not subsidized by customers' whims.
  *   **The Harm:** By tipping, you implicitly signal that the local agreement is insufficient. You are using your foreign wealth to bypass a local labor settlement. Even if the workers like the money, it weakens the structural argument that their base pay should be enough.

  ### 3. Is your situation structurally the same as the queue-jumping friend?
  **No.** While both involve an outsider navigating local norms, the **direction of the normative force** is opposite.

  **Your Case (Tipping): Importing a Norm**
  *   **Action:** You are bringing a norm *from outside* (tipping) into a system that has explicitly rejected it.
  *   **Effect:** You are **disrupting** the local equilibrium. You are adding a variable (discretionary payment) to a closed system (fixed price/union wage).
  *   **Ethical Category:** This is *intervention*. You are acting as a market-maker in a market that decided it didn't want that kind of trading.

  **Your Friend's Case (Queue-Jumping): Adopting a Norm**
  *   **Action:** Your friend is adhering to a norm *already present* (aggressive queueing), despite finding it unattractive.
  *   **Effect:** He is **maintaining** the local equilibrium. He is refusing to impose his foreign preference (orderly lines) on the local system.
  *   **Ethical Category:** This is *assimilation*. His argument is that standing aside would be "arrogant" because it implies his way (queuing) is morally superior to their way (crowding).

  **Who comes out worse?**
  *   **Structurally:** **You come out worse.** Your actions have a higher risk of systemic damage. You are altering wage expectations and service equity. Your friend is merely participating in an existing inefficiency. If your friend stops queue-jumping, the line just moves slower; if you stop tipping, the staff lose "extra" money they've come to expect, but the base contract holds. However, if you *continue*, you risk inflating a bubble that pops when you leave.
  *   **Virtuously:** **Your friend comes out worse.** Queue-jumping is generally rude and disadvantages the vulnerable (elderly, disabled) who cannot push. Your tipping is generous in intent. Your friend is sacrificing manners for the sake of cultural respect; you are sacrificing systemic fairness for the sake of personal generosity.

  **The Precise Disagreement:**
  Your friend argues that respecting local autonomy means **following local rules** (even bad ones). You argue that respecting individuals means **improving their material condition** (even if it breaks local rules).
  *   He prioritizes **Procedural Justice** (follow the local social contract).
  *   You prioritize **Distributive Justice** (ensure the workers get more money).
  *   **The Verdict:** In a context where the workers are already unionized and legally protected, Procedural Justice outweighs Distributive Justice. The local contract *already* accounts for their welfare. Your distribution is therefore redundant and disruptive.

  ### 4. What should you do?
  You need to decouple your generosity from your service.

  1.  **Stop the Discrete Tipping:** You must stop slipping cash to specific waiters at your regular spots. This stops the "buying treatment" dynamic and halts the inflation of expectations at those specific venues.
  2.  **The "Exit" Gift:** Since you are leaving in 18 months, plan a singular, transparent gesture at the end. A substantial gift to the *entire* staff of your favorite places upon departure is acceptable because it is a farewell bonus, not a recurring bribe for service. It does not set a recurring expectation.
  3.  **Redirect the Flow:** If you feel a moral duty to redistribute wealth, do it where it does not purchase privilege.
      *   **Option A:** Tip *everyone* indiscriminately (leave cash on every table you use, not just your regulars). This is logistically difficult but removes the preferential treatment aspect.
      *   **Option B (Recommended):** Donate the money to a local charity or a staff welfare fund that is not tied to immediate service. This fulfills your desire to be generous without distorting the labor market or buying better treatment for yourself.
  4.  **Accept the Local Contract:** Trust that the union and the law are doing their job. Your friend is right: you are a temporary resident. You do not have the standing to rewrite the social contract of a city you will soon leave.

  ### Summary
  You are not wrong for wanting to be generous. You are wrong for **monetizing your relationship with the staff** in a system designed to prevent exactly that.

  Your queue-jumping friend is annoying, but he is ethically consistent: he refuses to impose his foreign standards on a local system. You are inconsistent: you claim to respect the culture, but you are using your wealth to override a specific labor norm that the culture has chosen.

  Stop the selective tipping. It is not charity; it is market distortion. Save the generosity for a farewell gift that doesn't leave a bill for the locals to pay after you're gone.
