      *   *The "Exit" Problem:* The user leaves in 18 months. They introduce a change but won't suffer the backlash (inflation of expectations, tension between staff and customers). This is a form of *moral free-riding* or *externalizing costs*.
      *   *The "Partiality" Problem:* Tipping only at regular spots creates inequity. It's not charity; it's a bribe for preferential treatment.
      *   *The "Systemic" Problem:* It undermines the local labor agreement (union scale + service charge). It suggests the agreed wage isn't enough, potentially pressuring employers or other customers.
      *   *The "Colonial" Problem:* Imposing home culture's economic morality on a host culture that has explicitly rejected it via law/union.

  6.  **Develop the Recommendation:**
