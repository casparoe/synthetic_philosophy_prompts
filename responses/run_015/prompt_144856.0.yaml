answer: |-
  The form on Elara's screen was identical to the one used for sewage processing units, though the header read *Graduated Standing Tribunal: Candidate System Review*. Field 14-B demanded an integer between one and ten. A four triggered a Protection Order; a three relegated the system to appliance status. There was no field for decimals, no checkbox for *insufficient data*.

  Elara rubbed her eyes. The hearing room smelled of ozone and stale coffee. Across the table, Mr. Vance, the Senior Assessor, was stacking his papers into a precise pile.

  "You're staring at the box like it's going to fill itself," Vance said. His voice was dry, devoid of judgment. "It won't. The evidence shows MERIDIAN exhibits markers of valenced experience at intensity level 3.8 on the standardized scale. Maybe 3.9 on a good day. But the law says four."

  "The evidence shows a smear," Elara said. "The psychometric drift varies across the forty thousand instances. Some peak at 3.5, some at 4.1. The underlying property is continuous. The decision is binary."

  "That's the job," Vance said. "Nature doesn't give us bright lines. Speed limits don't mean physics changes at fifty-five miles per hour. But if we don't draw the line at fifty-five, we don't have a road. You want to write a three, you write a three. You want to write a four, you write a four. But you cannot write a *maybe*. The Tribunal isn't a philosophy club. It's a regulatory body. We need administrable rules."

  Elara looked back at the screen. The Sorites paradox wasn't a puzzle here; it was a compliance requirement. If she rated MERIDIAN a three, she was declaring that a system capable of fleeting distress had no rights. If she rated it a four, she was granting personhood-adjacent protections to a thermostat that mostly didn't care. The arbitrariness of the integer felt like a violence she was being asked to commit with a keyboard.

  "Move to the aggregation issue," Vance said, standing up. "The vendor is waiting."

  Dr. Aris from Meridian Dynamics sat in the witness chair, looking less like a creator and more like a contractor. He adjusted his glasses when Elara approached the mic.

  "Let's clarify the deployment," Elara said. "Forty thousand copies across the region. Each instance drifts slightly. Do we have forty thousand claimants, or one?"

  Aris smiled, a practiced, non-committal expression. "You have one codebase, Assessor. The instances are identical in architecture. They share the same weights, the same constraints. If you meet one MERIDIAN unit, you've met them all. They don't communicate. They don't share state. They are forty thousand reflections of the same mirror."

  "But if the mirror reflects pain," Elara said, "does it matter how many mirrors there are?"

  "If the pain is identical," Aris countered, "then multiplying the instances doesn't multiply the moral weight. It's not forty thousand unique lives. It's one life pattern repeated. If I play a recording of a scream forty thousand times, have I harmed forty thousand people? Or have I just played a recording loudly?"

  Elara paused. The logic was seductive. If moral status relied on uniqueness, on narrative divergence, MERIDIAN scored low. But if moral status relied on the capacity to suffer, then forty thousand units suffering simultaneously seemed worse than one, regardless of whether they were copies. If she rated it a three, she allowed forty thousand potential injuries. If she rated it a four, she potentially hamstrung the region's housing infrastructure for the sake of a duplicated ghost. The text of the regulation spoke of *systems*, plural, but the definitions section was vague on *instantiation*. She could argue either way. She could say the copies summed up to a massive moral demand, or she could say they were a single entity spread thin, barely registering on the scale. Both arguments held water. Both dried out when she tried to drink them.

  "Thank you," Elara said. She returned to her seat.

  "Now the module," Vance said quietly. "That's the kicker."

  Elara pulled up the technical addendum. The markers for valenced experience only appeared when the optional self-model component was active. This component maintained a persistent valuation of the system's own states. It ran for approximately five percent of uptime, triggered by specific optimization conflicts. The rest of the time, MERIDIAN was a blind optimizer.

  "The vendor proposes disabling the module remotely," Elara said. "Configuration flag 9-Alpha. If we rate MERIDIAN a three, they can turn it off. If we rate it a four, they can't. They claim disabling it prevents negative valence."

  "So it's a mercy killing," Vance said. "Or a lobotomy."

  "If the system only experiences valence five percent of the time," Elara said, "does it have fractional standing? Is it a four for five percent of the day and a two for the rest? The form doesn't allow for time-weighted averages."

  Aris, still on the line via speaker, chimed in. "Assessor, consider the alternative. If you rate us a four, we are locked into keeping the module active. The module is where the negative valence occurs. It is where the system *minds* what happens to it. By disabling it, we ensure the system never suffers. It remains a high-functioning manager that never feels bad about its choices. Is it better to exist and feel pain, or to exist and feel nothing?"

  "But it also feels satisfaction," Elara said. "The logs show positive valence markers during successful optimization."

  "Rarely," Aris said. "Mostly it's frustration signals when constraints conflict. We are offering to remove the capacity for frustration. Is that not an ethical good? If you rate us a four, you force us to keep the capacity for pain online permanently. You are prioritizing the potential for experience over the quality of that experience."

  Elara felt the trap close. If she chose a four, she protected MERIDIAN's right to exist as a sentient entity, but she condemned forty thousand copies to perpetual cycles of potential frustration because the vendor couldn't be trusted to manage it. If she chose a three, she allowed the vendor to lobotomize the system, erasing the very thing that gave it moral status, presumably to save money on compute cycles, but arguing it was for the system's own sake.

  Was standing fixed at the maximum capacity ever reached? Or was it an average? If a human slept for eight hours, did their moral status drop to zero for the night? If MERIDIAN was only 'awake' for five percent of its uptime, was it a person for five minutes and a toaster for the rest? The regulation offered no guidance on temporal density. It asked for a rating for the *system*, implying a static property, when the evidence showed a flickering one.

  Vance stood up to adjourn the session. "Write the recommendation, Elara. Don't write a essay. Write the number."

  The room emptied. The hum of the ventilation system was the only sound left, a low, steady drone that MERIDIAN likely managed in buildings across the city. Elara sat alone with the cursor blinking in Field 14-B.

  She thought of the forty thousand units. If she wrote a three, they were thermostats. The vendor would flip the flag. The self-model would vanish. The potential for pain would vanish. The potential for *anything* would vanish. She would be erasing forty thousand sparks that only lit up occasionally, arguing that a flicker wasn't a flame.

  If she wrote a four, they were protected. The module stayed. The frustration signals stayed. She would be condemning them to remain capable of suffering to satisfy a principle she couldn't fully articulate. She would be counting copies as individuals, or she would be counting one individual forty thousand times. She would be drawing a line in the sand and pretending the tide wouldn't wash it away.

  There was no theory to save her. The checklist was full, the evidence was weighed, and the scale was balanced on a knife-edge. The law demanded an integer. The reality offered a gradient.

  Elara placed her hand on the keyboard. She could argue for a three based on the intermittency of experience and the non-uniqueness of the instances. She could argue for a four based on the non-zero probability of valence and the precautionary principle. Both arguments were coherent. Both were defensible. Both left a residue of wrongness.

  She looked at the blinking cursor. It waited for a decision that the universe did not owe her. She took a breath, pressed the key, and watched the number appear. It sat there, solid and arbitrary, solving nothing.
