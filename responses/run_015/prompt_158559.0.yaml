answer: |-
  **Brainstorming Notes**

  *   **Core Tension:** Smith's *Theory of Moral Sentiments* relies on 'mutual sympathy'—I judge myself by imagining how you see me. The Creature learns to do this (internal spectator) but is denied the external validation (the mirror).
  *   **The De Lacey Episode:** This is the crucial testing ground. He learns language (the tool of sympathy) but is rejected on sight (the barrier to sympathy).
  *   **The 'Social Mirror' Twist:** Smith assumes the mirror is available if we interact. Shelley argues the mirror can be smashed by physiology. If Felix cannot 'change places' with a yellow-skinned giant, Smith's mechanism breaks.
  *   **Internal vs. External:** The Creature is morally coherent (internal spectator works). Society is morally bankrupt (external spectator fails). The tragedy is the disconnect.
  *   **Shelley's Pushback:** Smith implies sympathy is a natural human capacity. Shelley shows it is a social privilege granted only to those who look the part. The 'human' is not a biological fact but a social recognition.
  *   **Structure:**
      1.  Establish Smith's mechanism (imaginative change of places).
      2.  Apply to Creature's education (language enables internal spectator).
      3.  Apply to the rejection (body blocks external spectator).
      4.  Conclude on the failure of the 'social mirror' vs. Smith's optimism.
      5.  Note Shelley's critique of Smith's abstract humanity.

  ***

  **The Argument: The Shattered Mirror in *Frankenstein* and Smithian Sympathy**

  To understand the tragedy of the Creature through Adam Smith's *The Theory of Moral Sentiments*, we must first distinguish between the internal formation of conscience and the external validation of humanity. Smith argues that moral judgement arises from an 'imaginative change of places': I sympathise with you by imagining myself in your situation, and I judge myself by imagining how an 'impartial spectator' would view my conduct. Crucially, this spectator is not innate; it is socialised. We see ourselves only through the eyes of others. The niche twist you propose—that this requires a 'social mirror' of shared language, gesture, and custom—is precisely where Shelley's novel interrogates Smith's optimism.

  The Creature's time with the De Lacey family initially suggests a vindication of Smith. Through the hole in the wall, the Creature learns language and observes domestic affection. He reads *Paradise Lost*, *Plutarch*, and *The Sorrows of Werther*. These texts provide the 'shared custom' necessary to stabilise judgement. He develops a robust internal impartial spectator; he feels shame, he admires virtue, he distinguishes right from wrong. He even attempts to aid the family secretly, seeking the mutual sympathy Smith describes as the height of moral pleasure. At this stage, the Creature proves that the internal mechanism of the spectator does not require a human body, only a rational mind and access to cultural narratives. Sympathy, via language, successfully bridges the gap.

  However, the moment of revelation and the subsequent beating expose the fatal flaw in Smith's account. Smith assumes that the 'imaginative change of places' is universally available between humans. He presupposes a baseline legibility of the other. When the Creature enters the cottage, speaking eloquently and pleading for acceptance, the linguistic mirror is present. Yet, Felix does not see a fellow moral agent; he sees a monster. Here, the Creature's body literally blocks the imaginative switch. Felix cannot imagine himself in the Creature's place because the visual horror disrupts the identification required for Smithian sympathy. The 'social mirror' is not just about language; it is about recognisable embodiment. If the other is too radically alter, the spectator cannot form.

  Therefore, the tragedy is not that the Creature fails to form an impartial spectator of himself—he succeeds in this, which is why he feels such profound anguish and loneliness. The tragedy is that others can never form one of him. The external mirror is smashed. Smith argues we need others to confirm our own humanity ('We suppose ourselves the spectators of our own behaviour'). Without that confirmation, the internal spectator becomes a source of torture rather than guidance. The Creature knows he is virtuous by his own lights, but the world's reflection tells him he is vile. This dissonance drives him from benevolence to vengeance.

  Does the novel show sympathy failing for reasons Smith missed? Yes. Smith treats sympathy as a psychological mechanism inherent to human nature. Shelley politicises it. She suggests sympathy is withheld from those who do not fit the aesthetic norms of the community. The body is not neutral; it is a barrier to entry for the moral community. When Felix beats the Creature, it is not merely a lack of sympathy; it is an active enforcement of boundaries. The violence signifies that the 'impartial spectator' is not actually impartial; it is biased towards the familiar.

  However, we must be careful not to reduce Shelley to a mere illustration of Smith's failure. The novel pushes back against a purely rationalist reading. Smith's spectator is calm and judicious; the Creature's experience is Gothic and visceral. Shelley suggests that when the social mirror is denied, the result is not just moral confusion but existential rage. The Creature does not simply fade away; he becomes a dark mirror to Victor, forcing Victor to confront his own lack of sympathy. In this, Shelley argues that the failure of sympathy corrupts both the rejected and the rejector. Smith focuses on the harmony of sentiments; Shelley focuses on the violence of their rupture.

  Ultimately, the De Lacey episode demonstrates that language alone is insufficient to stabilise judgement if the visual custom of 'humanity' is violated. Smith's theory works only within a homogenous community where bodies are legible. Shelley exposes this limitation: the Creature is morally human but aesthetically alien. The novel concludes that without the social mirror of recognition, the impartial spectator turns inward and becomes a demon. Sympathy does not collapse because language enters; it collapses because the visual horror overrides the linguistic bond. Shelley thus corrects Smith by insisting that morality is embodied. We cannot imagine ourselves into another's place if we cannot bear to look at them. The Creature's tragedy is that he possesses the soul of a Smithian moralist trapped in a body that renders sympathy impossible.
