prompt: |-
  I am a high school junior defending a paper next month at our regional interscholastic philosophy symposium, and I need a Q&A prep sheet. My thesis is that John von Neumann's work on self-replicating automata and on technology accelerating faster than social adaptation should be read as advancing a specific survival criterion: "control continuity," the idea that surviving technology is that which preserves intelligent decision-making structures across catastrophic discontinuity, regardless of whether the biological substrate remains human. I treat this not merely as an engineering forecast but as an ethical framework for evaluating existential-risk mitigation—arguing that preserving the capacity for rational control matters more than preserving human biology exactly as it is.

  The audience is precisely this: Dr. Elena Vasquez, the biology teacher who advises our sustainability club and frames technological intervention as ecological disruption; Mr. James Park, a history teacher specializing in societal collapse who is deeply skeptical of "techno-fix" narratives amid institutional decay; and Marcus Chen, a peer debater who has read Bostrom and Ord and will press me on decision-theoretic consistency and on whether I have collapsed "survival" into something that no longer values human welfare. The room will also include members of our school's environmental action group, who generally oppose autonomous-system or geoengineering proposals on precautionary grounds.

  Please draft my defense sheet: the eight or so objections I will actually face from Vasquez, Park, and Chen—not generic philosophy-of-technology complaints, but objections phrased in the vocabulary each uses, ordered by how likely and damaging they are. For each, provide a reply I can deliver in about two minutes without sounding evasive, plus a brief note on where that reply is weakest or soft. State what I should concede up front to make the rest credible. Finally, identify the single objection I am hoping nobody asks—likely the one asking whether my "control continuity" criterion licenses replacing conscious humanity with autonomous systems that preserve decision-structure but eliminate subjective welfare—and tell me exactly how to respond if it comes. Do not include bibliographies, reading lists, or citations; I will have no web access and need arguments I can hold entirely in working memory.
