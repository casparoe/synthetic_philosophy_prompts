      *   *Reasoning:* "Horse" names the form/shape (*xing*). "White" names the color (*se*). "White horse" names the combination. Since the name for the combination is different from the name for the form alone, the referent is different.
      *   *Standard Interpretation:* Distinction between extension/intension, or concrete particular vs. abstract universal.
      *   *The "Niche Extension" (Digital Image):*
          *   An OLED screen emits light. It doesn't have "white pigment" on a "horse shape" in the physical sense (like a statue or a living animal). It has pixels emitting RGB values that *simulate* white and horse-shape.
          *   *Question:* Is this a "white horse"?
          *   *Gongsun Long's Potential View:* If "white" requires the property of whiteness to be *fixed* to the form physically, a simulation might fail. If "white" is just a visual designation, it might pass.
          *   *Hidden Ontological Commitment:* Gongsun Long assumes *ming* (names) correspond to *shi* (actualities). If the *shi* is merely light patterns, does the *ming* "white" apply? This tests whether properties are intrinsic to the object or relational/perceptual.

