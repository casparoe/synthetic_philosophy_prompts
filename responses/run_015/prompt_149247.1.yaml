answer: |-
  # Final Exam: Classical Chinese Metaphysics & Philosophy of Language
  **Time Allowed:** 75 Minutes  
  **Conditions:** Closed-Book  
  **Total Marks:** 25

  ---

  ## Part 1: Exam Question

  **Essay Prompt: The Ontology of the Digital *Bai Ma***

  Gongsun Long's *White Horse Dialogue* (*Bai Ma Lun*) famously argues that "a white horse is not a horse" by distinguishing the naming of form (*xing*) from the naming of color (*se*). 

  Imagine a photorealistic digital rendering of a white horse displayed on a modern OLED screen. The screen emits light to simulate the visual properties of "horseness" (shape/structure) and "whiteness" (luminance/color), but possesses no physical substance, pigment, or biological life.

  Write a coherent essay that addresses the following five analytical moves:

  1.  **Reconstruct** the core logical argument of the *White Horse Dialogue* regarding the separation of "horse" (form) and "white" (color), explaining why the compound designation creates a distinct referent.
  2.  **Apply** this argument to the digital rendering: According to Gongsun Long's criteria, is the image on the screen a "white horse"? Justify your answer using the text's logic.
  3.  **Identify** the hidden ontological premise exposed by this digital extension. Specifically, does Gongsun Long's argument implicitly require properties like "whiteness" to be physically instantiated in a substance, rather than merely represented perceptually?
  4.  **Evaluate** whether this digital extension strengthens or undermines the School of Names' (*Ming Jia*) project of rectifying names (*zheng ming*). Does the distinction hold up in a semiotic/representational context?
  5.  **Conclude** with a defended position on whether the *Bai Ma Lun* can account for representational entities, or if the digital case reveals a fatal limitation in its metaphysics.

  ---

  ## Part 2: Model Answer

  **Title:** Substance vs. Simulation: A *Ming Jia* Analysis of the Digital Horse

  **1. Reconstruction of the Argument**
  Gongsun Long's central thesis, "a white horse is not a horse," rests on the disjunction of names (*ming*). In the dialogue, he asserts that "horse" is the name used to designate the form (*xing*), while "white" is the name used to designate the color (*se*). When one asks for a "horse," a yellow or black horse suffices; when one asks for a "white horse," yellow and black horses are excluded. Therefore, the designation "white horse" is not equivalent to the designation "horse." The compound name creates a specific actuality (*shi*) that is distinct from the general form. The argument relies on the principle that if the extension of two names differs, their referents are ontologically distinct.

  **2. Application to the Digital Rendering**
  Applying this to an OLED image, the digital rendering fails to qualify as a "white horse" in Gongsun Long's strict sense. While the image presents the visual *appearance* of form and color, it lacks the substantive unity required by the *Bai Ma Lun*. The "horseness" on the screen is not a physical form but a pattern of emitted light; the "whiteness" is not a property inhering in a surface but a specific wavelength intensity generated by pixels. For Gongsun Long, who seeks to match names to actualities, the image is a simulation of a white horse, not a white horse itself. The name "white horse" would refer to the light pattern, not the animal, meaning the designation "horse" (implying the animal form) is mismatched to the actuality (the screen).

  **3. Identification of the Hidden Premise**
  This extension exposes a hidden ontological commitment in the *White Horse Dialogue*: the assumption that properties must be physically instantiated to be real. Gongsun Long treats "whiteness" as a quality that must inhere in a substance capable of bearing it (a physical object). He does not account for "whiteness" as a purely perceptual or semiotic event. The argument presupposes a realist ontology where *se* (color) is intrinsic to the object's *xing* (form). In the digital case, color is extrinsic and relational (dependent on the viewer and the machine). The hidden premise is that *ming* (names) track mind-independent properties, not mind-dependent representations.

  **4. Evaluation of the School of Names' Position**
  This digital extension undermines the School of Names' project of *zheng ming* (rectification of names) when applied to representational media. The School of Names seeks to stabilize language by fixing the relationship between name and object. However, the digital case shows that "white" and "horse" can be functionally separated and recombined in a medium where neither property physically exists. If the School of Names cannot distinguish between a real white horse and a perfect simulation using only logical analysis of names, their system is vulnerable to sophistry. Conversely, one could argue it strengthens their position by proving that without physical instantiation, the name "horse" is a lie. However, given the School's focus on logical precision, their inability to categorize non-substantial entities suggests a rigidity that fails to account for the complexity of reference.

  **5. Conclusion**
  In conclusion, the *Bai Ma Lun* cannot adequately account for representational entities like digital images. The digital case reveals that Gongsun Long's metaphysics relies on a naive realism where properties are bound to physical substances. Because the OLED screen decouples the visual experience of "white" and "horse" from physical instantiation, it breaks the necessary link between *ming* and *shi* that Gongsun Long assumes. Therefore, while the *White Horse Dialogue* succeeds in distinguishing abstract universals from concrete particulars, it fails to address the ontology of representation, limiting its applicability to a world increasingly defined by simulacra.

  ---

  ## Part 3: Marking Scheme (25 Marks Total)

  | Component | Marks | Criteria for Full Credit | Characteristic Error (Deduction Trigger) |
  | :--- | :---: | :--- | :--- |
  | **1. Reconstruction** | **5** | Accurately cites the form/color (*xing/se*) distinction and explains why the compound name creates a distinct referent (extensional difference). | Confusing the logical distinction (identity) with a merely perceptual one, or claiming Gongsun Long denies white horses exist at all. |
  | **2. Application** | **5** | Rigorously applies the text's logic to the OLED case; argues whether the image counts as a "white horse" based on substance vs. appearance. | Treating the digital case as obviously irrelevant without argument, or asserting the image *is* a white horse without addressing the lack of substance. |
  | **3. Hidden Premise** | **5** | Explicitly identifies the assumption that properties (whiteness) must be physically instantiated/inhere in a substance, not just represented. | Focusing on the viewer's psychology/perception rather than the ontological status of the property itself. |
  | **4. Evaluation** | **5** | Assesses whether the extension strengthens or weakens the *Ming Jia* project (*zheng ming*), considering the implications for language/reality mapping. | Claiming the extension is anachronistic and therefore irrelevant to evaluating the School of Names' philosophical validity. |
  | **5. Conclusion** | **5** | Provides a clear, defended stance on the *Bai Ma Lun*'s ability to handle representation, consistent with the previous four moves. | Remaining non-committal, or contradicting the ontological analysis provided in moves 2 and 3. |

  **Total:** \_\_\_\_ / 25

  **Grader Notes:**
  *   **Time Management:** Students should spend approx. 10 mins planning and 65 mins writing. Answers exceeding 1,000 words may lack necessary concision for a 75-minute closed-book exam.
  *   **Textual Knowledge:** Since this is closed-book, students are not expected to quote chapter/verse, but must accurately reflect the *logic* of the *Bai Ma Lun* (e.g., the "seeking a horse" vs. "seeking a white horse" analogy).
  *   **Philosophical Depth:** Upper-level distinction is awarded in Component 3 & 4 for recognizing that the "Digital Horse" problem is essentially a problem of *Realism vs. Nominalism* disguised as a media question.
