      *   *Key Tensions:* Phenomenology (how time feels) vs. Physics (how time behaves in equations).
      *   *Key Physics:* Special Relativity (Relativity of Simultaneity), Thermodynamics (Entropy/Arrow of Time).
      *   *Key Phenomenology:* Passage of time, Memory, Agency/Free Will.

  3.  **Drafting the Desiderata (Iterative Process):**

