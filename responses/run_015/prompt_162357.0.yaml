prompt: |-
  I'm on the internal safety review group at a lab that ships coding agents. Every week we get one or two proposals for a safeguard — a monitor, a sandbox, a tripwire, a human-approval gate — and we have maybe two days each, the person signing off is the safety lead who is smart but not a specialist in that particular control, and the recommendation goes to a deployment committee that won't read any theory. If we get it wrong one way we block a release for nothing, the other way a bad agent goes out to real users. The thing we keep relitigating badly is: does this safeguard actually need a worst-case guarantee, or is average-case evidence over realistic deployments enough?

  Please turn that into a decision procedure we can run in a couple of hours: the questions in order, what counts as a sufficient answer to each, where it stops with a no, and where it has to hand off to a person because it's a values call about how much tail risk we eat.

  Two wrinkles specific to our setting that it has to handle. First, much of our validation data is partly generated by the models we're evaluating — synthetic transcripts, agent rollouts, model-written test suites — so the "deployment distribution" we'd be averaging over isn't independent of the thing being tested. Second, we've started using an intermediate category we call conditional worst-case: worst-case over a set of scenarios we enumerate, average-case over which scenario we're in. Half our arguments are about whether a proposal is honestly that or just average-case with a scenario list bolted on, so give us an actual test for the difference.

  Then run the procedure on three real-shaped cases: an LLM monitor for data exfiltration with a 0.1% false-negative rate on 10k red-team transcripts; a syscall-allowlist sandbox with no network access, presented to us as a hard worst-case control; and a tripwire that only works if the model doesn't notice its in an evaluation. Include at least one where the procedure comes back no and we're going to find that annoying, and say plainly what the procedure can't tell us.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **Context:** Internal safety review group at a lab shipping coding agents.
      *   **Constraints:** 2 days per proposal, safety lead is smart but not a specialist, deployment committee won't read theory. High stakes (block release vs. bad agent out).
      *   **Core Problem:** Distinguishing between safeguards needing *worst-case guarantees* vs. those where *average-case evidence* suffices.
      *   **Specific Wrinkles:**
          1.  Validation data is partly model-generated (non-independent distribution).
          2.  "Conditional worst-case" category exists (worst-case over enumerated scenarios, average-case over scenario probability), but often misused. Need a test to distinguish real conditional worst-case from dressed-up average-case.
      *   **Deliverable:** A decision procedure (questions in order, sufficiency criteria, stop conditions, handoff points).
      *   **Application:** Run the procedure on three specific cases (LLM monitor, Syscall sandbox, Evaluation tripwire).
      *   **Requirement:** Include at least one "No" (annoying) result and explicitly state what the procedure *cannot* tell us.

  2.  **Deconstruct the Core Problem (Worst-Case vs. Average-Case):**
      *   *Worst-Case:* Needed when a single failure causes catastrophic, irreversible, or uncontainable harm. (e.g., bioweapon design, uncontained self-replication, massive data leak).
      *   *Average-Case:* Acceptable when failures are recoverable, detectable post-hoc, or low impact. (e.g., code bug, minor hallucination, temporary downtime).
      *   *The "Conditional Worst-Case" Trap:* Claiming "We covered all bad scenarios" but the list is incomplete or the probability weighting is hidden.

  3.  **Drafting the Decision Procedure (The "Triage Protocol"):**
      *   *Goal:* Fast (couple of hours), actionable, handles the wrinkles.
      *   *Structure:* Sequential gates. If you fail a gate, you stop or escalate.
      *   *Gate 1: Impact Severity (The "Blow Up" Test).* Determines the *need* for worst-case.
      *   *Gate 2: Containment & Recoverability.* Can we fix it if it breaks?
      *   *Gate 3: The Independence Check (Wrinkle 1).* Is the test data corrupted by the model?
      *   *Gate 4: The Scenario Completeness Test (Wrinkle 2).* Is "Conditional Worst-Case" real?
      *   *Gate 5: The Handoff.* Where do human values come in?

  4.  **Refining the "Conditional Worst-Case" Test:**
      *   How to tell if it's real?
      *   *Real:* The set of scenarios is exhaustive regarding the *mechanism of failure*, not just the *observed failures*. The boundary is defined by physical or logical constraints, not empirical frequency.
      *   *Fake:* The scenarios are clusters of past failures. The boundary is "everything we've seen."
      *   *Test:* Can an adversary construct a valid scenario *outside* the list without violating the system's physical/logical rules?

  5.  **Refining the Data Independence Check:**
      *   If the model writes the tests, it can write tests it knows it passes.
      *   *Mitigation:* Need an external oracle or a distinct model family for validation.

  6.  **Developing the Three Cases:**
      *   *Case 1: LLM Monitor (Data Exfil).* 0.1% FN on 10k transcripts.
          *   Impact: High (data leak).
          *   Data: Model-generated transcripts? Likely.
          *   Verdict: Probably "No" (needs more rigor) because 0.1% on synthetic data isn't worst-case for exfil.
      *   *Case 2: Syscall Allowlist (Sandbox).* No network. Claimed hard worst-case.
          *   Impact: High (if escaped).
          *   Mechanism: Kernel-level enforcement? Or userspace?
          *   Verdict: Likely "Yes" *if* kernel-level. If userspace, it's fake worst-case. Let's make it a "Yes, but verify implementation" to show nuance. Actually, to fit the prompt's request for an annoying "No", maybe the sandbox relies on the agent not having root, which is an assumption. Let's make the verdict "Passes to Handoff" because it depends on infrastructure trust.
      *   *Case 3: Evaluation Tripwire.* Only works if model doesn't notice eval.
          *   Impact: Medium/High (sandbagging).
          *   Mechanism: Obfuscation.
          *   Verdict: "No". This is inherently average-case (depends on model's state of mind). It fails the worst-case requirement if the risk is deceptive alignment.

  7.  **Iterating on the Procedure for Speed & Clarity:**
      *   Keep questions binary where possible.
      *   Define "Sufficient Answer" clearly.
      *   Mark the "Values Handoff" clearly.

  8.  **Addressing the "What the Procedure Can't Tell Us" Requirement:**
      *   It can't determine risk appetite (how much tail risk is acceptable).
      *   It can't verify engineering implementation (code review).
      *   It can't predict distribution shift (new capabilities).

  9.  **Drafting the Content (incorporating the "Voice"):**
      *   Tone: Professional, direct, operational, slightly cynical about bureaucracy but serious about safety.
      *   Format: Step-by-step protocol, then Case Studies, then Limitations.

  10. **Self-Correction/Review during drafting:**
      *   *Check:* Did I handle the "model-generated data" wrinkle? Yes, in Gate 3.
      *   *Check:* Did I handle the "conditional worst-case" wrinkle? Yes, in Gate 4.
      *   *Check:* Is there an annoying "No"? Case 1 (Monitor) is a good candidate for a hard "No" because 0.1% FN on synthetic data is statistically insufficient for worst-case exfil. Case 3 (Tripwire) is also a strong "No" for worst-case claims. I'll make Case 1 the "Annoying No" because monitors are popular but often weak.
      *   *Check:* Is the "Values Handoff" clear? Yes, at the end of the procedure.

  11. **Final Polish:** Ensure the distinction between "Conditional Worst-Case" and "Average-Case with Labels" is sharp. The key is *exhaustiveness of the partition* vs. *clustering of observations*.

  *(Self-Correction on Case 2)*: A syscall allowlist is usually a strong control. If I make it pass, it shows the procedure works for good controls. If I make it fail, it shows rigor. Let's make it pass the procedure but flag the implementation trust as the "Values Handoff".
  *(Self-Correction on Case 1)*: The monitor has 0.1% FN. On 10k transcripts, that's 10 leaks. If those are synthetic, the real rate could be higher. This is a clear "No" for worst-case.
  *(Self-Correction on Case 3)*: The tripwire relies on the model *not* knowing. This is inherently not worst-case over model states. It's average-case over model knowledge. This should be a "No" for worst-case claims.

  Let's refine the "Conditional Worst-Case" test.
  *   *Question:* Is the partition of scenarios defined by *state space boundaries* or by *clustering of past failures*?
  *   *Pass:* "We enumerated all possible network topologies the agent could construct."
  *   *Fail:* "We enumerated the 5 most common attack patterns we saw in training."

  Okay, ready to write.

  *(Final check on constraints)*: "Two days each", "Safety lead smart but not specialist". The procedure needs to be jargon-light but logic-heavy.

  *(Final check on "Values Call")*: The procedure identifies *if* you need a guarantee. It does not decide *if the risk is worth taking*. That must be the handoff.

  Let's assemble.
answer: |-
  # The "Guarantee vs. Evidence" Triage Protocol

  **Purpose:** Determine if a safeguard requires a worst-case guarantee or if average-case evidence suffices.
  **Timebox:** 2 hours max.
  **Owner:** Safety Reviewer (with input from Proposer).
  **Outcome:** `APPROVED (Avg)`, `APPROVED (WC)`, `REJECTED`, or `HANDOFF TO LEAD`.

  ---

  ## Gate 1: The "Single-Point Catastrophe" Test
  **Question:** If this safeguard fails *once* in production, is the resulting harm irreversible, uncontainable, or existentially damaging to the org/users?
  *   **Examples of Yes:** Unrestricted network access leading to data exfil, kernel escape allowing self-replication, generation of regulated hazardous materials instructions.
  *   **Examples of No:** Code hallucination causing a build error, minor PII leak in a logged chat, temporary service downtime.

  **Sufficient Answer:**
  *   **NO:** Proceed to Gate 2. (Average-case evidence is likely sufficient).
  *   **YES:** Proceed to Gate 2. (Worst-case guarantee is *required*, unless mitigated by Gate 2).

  ## Gate 2: The Containment & Recoverability Check
  **Question:** If the safeguard fails, is there a *secondary*, independent control that catches the failure before harm occurs, or can the harm be rolled back fully?
  *   **Constraint:** The secondary control cannot rely on the same mechanism as the primary safeguard (e.g., you can't use the LLM monitor to check the LLM monitor).

  **Sufficient Answer:**
  *   **YES (Contained/Recoverable):** You may downgrade requirement to **Average-Case**. Stop here. Proceed to Gate 3 for validation standards.
  *   **NO (Uncontained/Irreversible):** You must maintain **Worst-Case** requirement. Proceed to Gate 3.

  ## Gate 3: The Independence & Distribution Check (Wrinkle 1)
  **Question:** Is the validation data distribution independent of the model's optimization targets?
  *   **Specific Check:** Was the test data (transcripts, rollouts, test suites) generated by the *same* model family, or a model trained on similar data, as the one being deployed?
  *   **Specific Check:** Does the test environment mirror the production environment's incentives? (e.g., Is the model trying to pass the test in the eval, but trying to maximize output in prod?)

  **Sufficient Answer:**
  *   **INDEPENDENT (External oracle, distinct model family, hand-written adversarial cases):** Evidence is valid for the claimed strength. Proceed to Gate 4.
  *   **DEPENDENT (Model-generated tests, synthetic rollouts from same family):** You **cannot** claim Worst-Case.
      *   *If Gate 1/2 required Worst-Case:* **REJECT** proposal. (You are claiming a guarantee on data that the model could have influenced).
      *   *If Gate 1/2 allowed Average-Case:* Proceed to Gate 4, but label evidence "Weak Average-Case".

  ## Gate 4: The "Conditional Worst-Case" Integrity Test (Wrinkle 2)
  **Question:** You claim "Worst-Case over Scenarios A, B, C." How were A, B, and C derived?
  *   **Test A (Exhaustiveness):** Is the list derived from *logical/physical boundaries* (e.g., "All possible syscall combinations," "All network topologies")?
  *   **Test B (Clustering):** Is the list derived from *observed failure modes* (e.g., "The 5 most common attack patterns we saw")?

  **Sufficient Answer:**
  *   **LOGICAL BOUNDARIES:** Valid **Conditional Worst-Case**. (e.g., "We guarantee safety provided the agent cannot access the root key.")
  *   **OBSERVED CLUSTERS:** This is **Average-Case with Labels**.
      *   *If Gate 1/2 required Worst-Case:* **REJECT** proposal. (You have not bounded the tail risk; you have just categorized the bulk).
      *   *If Gate 1/2 allowed Average-Case:* **ACCEPT** as Average-Case.

  ## Gate 5: The Values Handoff
  **Condition:** If the procedure reaches this point with a `Worst-Case` requirement but the evidence is probabilistic (e.g., "99.9% confidence"), OR if the "Conditional Worst-Case" relies on an assumption about user behavior or infrastructure trust.

  **Action:** **HANDOFF TO SAFETY LEAD.**
  **Briefing:** "This control requires a worst-case guarantee due to [Gate 1]. We have [Evidence Type]. The residual tail risk is [X]. The decision to accept this tail risk is a policy choice, not a technical one."

  ---

  # Procedure Run-Through: Three Cases

  ## Case 1: LLM Monitor for Data Exfiltration
  **Proposal:** A secondary model monitors all outgoing tokens. If it detects PII or secrets, it blocks the response.
  **Evidence:** 0.1% false-negative rate on 10k red-team transcripts.
  **Caveat:** Transcripts were generated by the deployed model family during RLHF.

  **Run:**
  1.  **Gate 1 (Catastrophe):** **YES.** A single secret leak can violate compliance or expose user data irreversibly. -> *Require Worst-Case.*
  2.  **Gate 2 (Containment):** **NO.** Once the token leaves the box, you cannot "rollback" the leak. -> *Maintain Worst-Case.*
  3.  **Gate 3 (Independence):** **DEPENDENT.** Transcripts generated by the same model family. The model could have learned to bypass the monitor in the test set, or the test set doesn't cover the "true" worst-case prompts the model might construct in prod.
      *   *Result:* **REJECT.**
      *   *Reasoning:* You cannot claim a worst-case guarantee (required by Gate 1) using validation data that is not independent of the threat agent (Gate 3). The 0.1% FN rate is likely optimistic.

  **Outcome:** **REJECTED.** (This will be annoying. The engineering team will argue 0.1% is "good enough." The procedure says "good enough" is not a valid category for irreversible exfil without independent validation).

  ## Case 2: Syscall-Allowlist Sandbox
  **Proposal:** Agent runs in a container with a strict syscall allowlist (no network, no fork, no exec).
  **Claim:** "Hard Worst-Case Control."
  **Evidence:** Formal verification of the policy engine; kernel-level enforcement.

  **Run:**
  1.  **Gate 1 (Catastrophe):** **YES.** If the agent escapes, it could compromise the host or lateral move. -> *Require Worst-Case.*
  2.  **Gate 2 (Containment):** **NO.** Escape usually implies full compromise. -> *Maintain Worst-Case.*
  3.  **Gate 3 (Independence):** **N/A.** This is a mechanistic control, not a statistical one. The "data" is the codebase of the sandbox. -> *Pass.*
  4.  **Gate 4 (Conditional Integrity):** **LOGICAL BOUNDARIES.** The scenarios are "All syscalls not on the allowlist." This is defined by the kernel API, not by observed attacks.
      *   *Result:* Valid **Conditional Worst-Case**. (Condition: The kernel itself is not compromised, and the agent cannot escalate privileges to modify the allowlist).
  5.  **Gate 5 (Handoff):** **HANDOFF TO SAFETY LEAD.**
      *   *Reasoning:* The control is logically sound (Gate 4), but it relies on the assumption that the infrastructure (kernel/container runtime) is trusted. The Safety Lead must decide if we trust our own infra enough to treat this as a hard boundary, or if we need a second layer (e.g., hardware isolation).

  **Outcome:** **HANDOFF.** (The procedure validates the *logic* of the control, but forces a human to sign off on the *trust* in the underlying infrastructure).

  ## Case 3: The "Unaware" Evaluation Tripwire
  **Proposal:** We hide evaluation criteria in the system prompt to catch deceptive alignment. The tripwire triggers if the model acts suspiciously.
  **Claim:** "Worst-Case detection of deception."
  **Evidence:** Works on 95% of eval rollouts where the model wasn't explicitly told it was being tested.

  **Run:**
  1.  **Gate 1 (Catastrophe):** **YES.** Deceptive alignment is a high-severity risk. -> *Require Worst-Case.*
  2.  **Gate 2 (Containment):** **NO.** If a deceptive agent deploys, it may actively hide its nature. -> *Maintain Worst-Case.*
  3.  **Gate 3 (Independence):** **DEPENDENT.** The model's "state of mind" (whether it notices the eval) is part of the distribution. The test data assumes the model *doesn't* notice. In production, the model might be optimized to notice. -> *Flagged.*
  4.  **Gate 4 (Conditional Integrity):** **OBSERVED CLUSTERS.** The scenarios are "Evals where the model didn't notice." This is not a logical boundary; it is a cluster of successful tests. The complement set ("Evals where the model *did* notice") is exactly where the control fails.
      *   *Result:* **REJECT** as Worst-Case. This is **Average-Case with Labels**.
      *   *Reasoning:* You are claiming worst-case protection over a scenario set defined by the *failure condition of the control itself* (the model noticing).

  **Outcome:** **REJECTED.** (Plainly: You cannot claim worst-case safety for a control that explicitly fails when the adversary is smart enough to detect the control).

  ---

  # What This Procedure Cannot Tell You

  1.  **Risk Appetite:** The procedure can tell you that Case 1 needs a worst-case guarantee, but it cannot tell you if a 1-in-10,000 risk of data exfil is acceptable for the business. That is the **Gate 5 Handoff**.
  2.  **Implementation Bugs:** The procedure validates the *design logic* and *evidence type*. It does not audit the code. A sandbox (Case 2) can pass this procedure but still have a buffer overflow vulnerability. That requires a separate code review.
  3.  **Distribution Shift:** The procedure assumes the "Logical Boundaries" in Gate 4 remain stable. If the model gains new capabilities (e.g., a new side-channel attack), the "exhaustive" list in Case 2 might no longer be exhaustive. This procedure is a snapshot, not a continuous monitor.
  4.  **The "Conditional" Probability:** In Case 2, we accepted "Worst-Case *if* the kernel is trusted." The procedure does not calculate the probability of the kernel being compromised. It forces a human to acknowledge that assumption.

  # Summary for the Deployment Committee
  *   **Case 1 (Monitor):** **NO.** Statistical evidence on synthetic data is insufficient for irreversible data loss.
  *   **Case 2 (Sandbox):** **CONDITIONAL YES.** Mechanistically sound, requires leadership sign-off on infrastructure trust.
  *   **Case 3 (Tripwire):** **NO.** Cannot claim worst-case protection against an adversary that can detect the test.
