answer: |-
  Here is the principle, the casualties, the application, and the soft spots.

  ### The Principle: Functional Immunity

  A proposition $P$ is **Framework** for you at time $t$ if and only if it satisfies Clauses 1 and 2. A proposition is **Empirical** if it satisfies Clause 3.

  *   **Clause 1 (The Presupposition Test):** Your standard professional procedures for verifying *other* claims logically presuppose $P$ is true. If you attempted to verify $P$ using those procedures, you would have to use $P$ as a premise in the verification, creating a circle.
  *   **Clause 2 (The Collapse Test):** If you were to seriously doubt $P$ right now, your ability to conduct *any* verification in your current workflow would halt or become unintelligible. $P$ is not just a belief; it is a rule of the game you are currently playing.
  *   **Clause 3 (The Isolatability Test):** A proposition is Empirical if you can isolate it as an object of investigation without disabling the instruments used to investigate it. You can doubt the claim without doubting the method.

  **Mapping to your cases:**
  *   **Other minds:** Passes Clause 1 & 2. You cannot interview a source to test if they have a mind without presupposing they have a mind to answer.
  *   **Spreadsheet number:** Passes Clause 2 *in the moment of copying*. While transcribing, you cannot check the number without already assuming the number you see is the number you copy. It is a hinge *of that action*.
  *   **Laptop:** Fails Clause 2. You can doubt the laptop exists, walk over, and touch it. The method (sensory verification) does not collapse if the laptop is missing; it simply returns a negative result.
  *   **Replication norm:** Passed Clause 1 & 2 for your first ten years (you checked claims *against* the norm). Now fails Clause 2 (you check the norm *using* meta-science methods). This satisfies the **Fluidity Corollary**: Framework status is not intrinsic; it is relative to your methodological ecosystem.
  *   **Earth existed vs. 4.5 billion:** "Earth existed" passes Clause 1 (dating methods presuppose an existing earth). "4.5 billion" fails Clause 1 (dating methods determine the number).

  ### The Casualties

  To keep this principle clean, you must abandon two of your intuitive verdicts.

  **1. The "Spreadsheet Certainty" is not Epistemic.**
  You wrote: *"I'm totally certain of this one and I can't say why."*
  **The Verdict:** You must abandon the idea that this certainty makes the proposition *true* or *secure*. Under Functional Immunity, the spreadsheet number is a hinge only *while you are using it as a hinge*. If you double-check it five minutes later, it instantly becomes Empirical. Its "framework" status is temporary and functional, not a permanent property of the claim. You are treating it as a metaphysical anchor; the principle forces you to treat it as a temporary tool. If you copy it wrong, your methodology doesn't collapse; you just issue a correction. That means it was never truly "untouchable," only "untested."

  **2. The "Earth" Distinction is Functional, Not Ontological.**
  You wrote: *"How can the blurry version be outside evidence and the sharp version inside it?"*
  **The Verdict:** You must abandon the intuition that these are the "same claim, just blurrier." They are different *moves* in the language game. "The Earth existed" is a rule for how we treat rocks. "The Earth is 4.5 billion years old" is a result of measuring rocks. If you treat them as the same claim, you cannot explain why one moves (as dating improves) and the other doesn't. You have to accept that the *grammar* of the two statements is different, even if the subject matter is identical.

  ### The Three New Cases

  **1. "Climate models are broadly trustworthy."**
  *   **Verdict:** **Empirical.**
  *   **Reasoning:** Fails Clause 1. You can test model outputs against historical temperature data without presupposing the models are trustworthy. In fact, the trust is *derived* from the match.
  *   **Caveat:** If your journalism shifts to *using* model output as the definitive baseline for all economic reporting (e.g., "assuming the model's 2°C scenario"), it migrates to Framework for that specific workflow.

  **2. "The archive I'm working from isn't systematically forged."**
  *   **Verdict:** **Framework (usually) → Empirical (if triggered).**
  *   **Reasoning:** Passes Clause 2 for daily work. If you doubt every document, you cannot write history. The archive is the ground you stand on. However, if a specific whistleblower or anomaly triggers suspicion, it migrates to Empirical. You then use *other* archives or forensic dating to test the first archive. The "ground" becomes the "object."

  **3. "I'm not misremembering what my source told me last week."**
  *   **Verdict:** **Empirical.**
  *   **Reasoning:** Fails Clause 1. You have instruments to check this (recordings, notes, corroborating witnesses) that do not presuppose your memory is perfect.
  *   **Contrast:** Compare this to your "Spreadsheet number." Memory is known to be fallible (your methodology acknowledges this); immediate transcription is treated as mechanical (your methodology treats this as direct). That methodological difference dictates the hinge status.

  ### Where I Might Be Wrong (My Soft Spots)

  **1. The "High Confidence" Trap.**
  My principle risks conflating "Framework" with "High Confidence Empirical."
  *   **The Challenge:** If you discover the spreadsheet number *was* wrong, you don't abandon your methodology. You just fix the number. A true Wittgensteinian hinge (like "The Earth exists") cannot be proven wrong without ending the game. If the spreadsheet number can be wrong without ending the game, it isn't a hinge; it's just a claim you were very confident about.
  *   **What changes my mind:** If you can show me a case where a "Framework" claim was proven false, and you *kept working* without a paradigm shift. If "Reviewer competence" is proven false (e.g., a specific reviewer is caught), but you continue reviewing as if they are generally competent without a crisis of faith, then "Reviewer competence" was never a hinge. It was just a heuristic. If that applies to "Other Minds" (e.g., you discover a source is a sophisticated bot), and you keep interviewing without existential dread, then "Other Minds" is also just a heuristic. If *everything* is revisable without collapse, the Framework/Empirical distinction dissolves into a spectrum of confidence.

  **2. The Social vs. Logical Shift.**
  My principle treats the shift from Framework to Empirical (like the Replication Crisis) as a logical/methodological update.
  *   **The Challenge:** In reality, that shift was *sociological*. It wasn't that the logic changed; it was that trust broke. "Replication" stopped being a hinge not because we found a better method, but because we stopped trusting the people.
  *   **What changes my mind:** If the driver of hinge-status is *trust in institutions* rather than *logical presupposition*. If "The archive isn't forged" is a hinge only because you trust the archivist, not because you can't check it, then my Clause 1 (Presupposition) is wrong. It should be Clause 1 (Trust). If you prove to me that hinges are held in place by social contracts rather than logical necessity, I would drop Functional Immunity for a **Social Cohesion Principle**.

  **My Bet:** I am sticking with Functional Immunity, but I am most vulnerable on the "Spreadsheet" case. If you press me that a typo doesn't stop the press, I must concede that true hinges are rarer than we think, and most of your "Framework" list is actually just "High-Priority Empirical."
