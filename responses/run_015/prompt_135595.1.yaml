prompt: |-
  I want a specification, not a survey, and I want it before I look at any candidate theory again. The target question is what it is for a particular object to have a disposition — to be fragile, soluble, conductive, brittle at a given temperature — and my purpose for the theory is fixed: it has to be good enough to underwrite dispositional explanations and predictions in the special sciences, of the form the girder failed because the steel was brittle at that temperature. That purpose carries two constraints I am sure about. The theory must not let disposition ascriptions become empty, on the model of the old joke about the sleeping powder's dormitive power: if the ascription does no work beyond restating the behaviour, it earns nothing. And it must not make ascriptions in-principle uncheckable, since scientists do in fact get evidence for and against them.

  Write me the desiderata, then. For each: the case or consideration that motivates it, and why it is a requirement rather than a taste. Be complete about the distinctions a theory may not collapse: possession versus manifestation; a disposition versus its causal basis; a mask versus the absence of a disposition; an enabling condition of a stimulus versus an interferer with a manifestation; a single-track versus a multi-track disposition; a genuine disposition versus an accidental uniformity of behaviour that no one would call dispositional. Include the standard hard cases — the fink, the mask, antidote cases, the reverse-cycle or mimic case, multi-track fragility, degreed and probabilistic dispositions, dispositions that are never manifested, dispositions whose manifestation is a process rather than an outcome, and dispositions to acquire or lose other dispositions — but do not stop with them, because it is the non-standard ones I think will do the discriminating. Add at least these, which I have not seen handled in the literature:

  - The self-healing slab. A composite whose microstructure makes cracks propagate readily under load, but which also contains an intrinsic repair mechanism that seals any incipient crack faster than it propagates. Under every possible load test the slab behaves like something that is not brittle. Here the interferer is internal to the object rather than a wrapping or an external device. Does the theory have the resources to say whether this is a mask, a modification of the basis, or the absence of a disposition, and on what grounds?
  - The late fink. A monitoring device attached to a glass permits a crack to initiate and then reverses it, restoring the molecules to their prior configuration, before the crack becomes detectable. The manifestation begins and is undone. Does the glass break? Does it manifest its fragility? What this probes is whether the theory needs a notion of partial, interrupted, or degraded manifestation, and whether manifestations are events with temporal parts that can be cut short.
  - The chancy fink. A device that, on a trial where the vase is struck, prevents breaking in nine cases out of ten. Is this a fink operating on a probabilistic disposition, a disposition of reduced degree, or a disposition that has partly gone away? I want to know whether the theory can grade possession, or whether it must draw a sharp line and where that line falls.

  Two further requirements to consider rather than assume: a theory should not generate infinitely many gerrymandered dispositions, one for every stimulus-and-manifestation pair we can describe, including the disposition to shatter if struck while a demon sneezes nearby; and it should say something about what grounds a disposition in its basis without either collapsing the two or generating a regress when the basis is itself characterised dispositionally.

  Then the part I most want. Mark for each requirement whether it is non-negotiable given my stated purpose or merely the preference of a camp — reduction to categorical bases, compatibility with a Humean treatment of laws, preservation of ordinary ascriptive practice, and the fundamentality of powers all look to me like candidates for the second category. Flag any pair or subset of the requirements you think cannot be jointly satisfied, with the argument for the incompatibility; if the list itself turns out to be the interesting result, say so. Tell me which single requirement excludes the most candidate theories, and which requirement on my own list you would delete as a prejudice. A table is fine for the list, but keep the prose on the reasoning behind each item and keep any scorecard to a few lines at the end — the simple conditional analysis, conditional analyses with an interferer or exclusion clause, basis-identity accounts, and powers or potentiality accounts against four or five of the requirements is all I need there, since the criteria are the deliverable.
reasoning: |-
  Here's a thinking process that leads to the suggested specification:

  1.  **Analyze the Request:**
      *   **Goal:** Create a *specification* (desiderata/requirements) for a theory of dispositions, *not* a survey of existing theories.
      *   **Purpose:** Underwrite dispositional explanations and predictions in the special sciences (e.g., "girder failed because steel was brittle").
      *   **Core Constraints:**
          1.  No empty ascriptions (avoid "dormitive virtue" circularity).
          2.  Ascriptions must be checkable (empirically accessible).
      *   **Required Distinctions:** Possession vs. Manifestation, Disposition vs. Basis, Mask vs. Absence, Enabler vs. Interferer, Single vs. Multi-track, Genuine vs. Accidental Uniformity.
      *   **Required Hard Cases:** Finks, Masks, Antidotes, Mimics, Multi-track, Degreed/Probabilistic, Unmanifested, Process outcomes, Dispositions to acquire/lose dispositions.
      *   **Required Novel Cases:** Self-healing slab (internal interferer), Late fink (interrupted manifestation), Chancy fink (probabilistic interference).
      *   **Additional Requirements:** No gerrymandering (infinite dispositions), Grounding relation (basis vs. disposition without regress/collapse).
      *   **Meta-Requirements:** Distinguish Non-negotiable (given purpose) vs. Camp Preference (e.g., Reductionism, Humeanism, Ordinary Language, Powers Ontology). Identify incompatibilities. Identify the most exclusionary requirement. Identify the most prejudicial requirement to delete.
      *   **Format:** Prose reasoning for each item, table for the list (optional but requested "A table is fine for the list"), brief scorecard at the end.
      *   **Tone:** Rigorous, philosophical, specification-oriented, avoiding theory bias.

  2.  **Deconstruct the Purpose & Constraints:**
      *   *Purpose:* Scientific explanation/prediction. This implies the theory must support counterfactuals, causal relevance, and empirical testing.
      *   *Constraint 1 (Non-emptiness):* The disposition must add explanatory power beyond the observation of the manifestation. It needs a "categorical base" or "power" that *makes* the manifestation happen.
      *   *Constraint 2 (Checkability):* We must be able to verify the disposition exists even if it doesn't manifest (or manifests rarely). This rules out strict simple conditional analyses (SCA) that equate disposition with manifestation under conditions.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Distinction 1: Possession vs. Manifestation.* Crucial for unmanifested dispositions (e.g., the glass never struck). *Requirement:* Theory must allow possession without manifestation. *Status:* Non-negotiable for prediction.
      *   *Distinction 2: Disposition vs. Basis.* Crucial for multiple realizability (steel vs. glass brittleness). *Requirement:* Theory must distinguish the property from its physical realizer. *Status:* Non-negotiable for special sciences (functional kinds).
      *   *Distinction 3: Mask vs. Absence.* Crucial for the self-healing slab. If it's a mask, it's brittle but hidden. If absence, it's not brittle. *Requirement:* Theory must distinguish intrinsic interference from lack of basis. *Status:* Non-negotiable for explanation (why did it *not* break? Mask vs. Toughness).
      *   *Distinction 4: Enabler vs. Interferer.* Stimulus conditions vs. background conditions. *Requirement:* Theory must distinguish the trigger from the conditions that allow/block the process. *Status:* Non-negotiable for experimental design.
      *   *Distinction 5: Single vs. Multi-track.* Fragility isn't just breaking when struck; it's breaking when heated, bent, etc. *Requirement:* Theory must account for diverse stimuli leading to similar manifestations (or similar stimuli leading to diverse manifestations). *Status:* Non-negotiable for robust scientific kinds.
      *   *Distinction 6: Genuine vs. Accidental.* Gold spheres vs. Fragile glass. *Requirement:* Theory must ground the modal force, not just actual regularity. *Status:* Non-negotiable for prediction (supports counterfactuals).
      *   *Hard Case: Finks/Mimics.* Standard literature. *Requirement:* Theory must handle extrinsic removal/addition of basis. *Status:* Non-negotiable (real systems have feedback loops).
      *   *Hard Case: Degreed/Probabilistic.* Radioactive decay, varying brittleness. *Requirement:* Theory must allow degrees/probabilities, not just binary. *Status:* Non-negotiable (science is quantitative).
      *   *Novel Case: Self-healing Slab.* Internal mask. *Requirement:* Theory must adjudicate internal interference vs. basis modification. *Status:* Non-negotiable (materials science).
      *   *Novel Case: Late Fink.* Interrupted manifestation. *Requirement:* Theory must handle temporal parts of manifestations/processes. *Status:* Non-negotiable (dynamic systems).
      *   *Novel Case: Chancy Fink.* Probabilistic interference. *Requirement:* Theory must distinguish reduced propensity from external blocking. *Status:* Non-negotiable (statistics).
      *   *Additional: No Gerrymandering.* "Sneeze-disposition." *Requirement:* Theory must restrict which conditionals count as dispositions. *Status:* Non-negotiable (explanatory utility).
      *   *Additional: Grounding.* Basis vs. Disposition. *Requirement:* Theory must explain the link without regress. *Status:* Non-negotiable (metaphysical coherence).

  4.  **Refining the Meta-Analysis (Non-negotiable vs. Preference):**
      *   *Non-negotiable:* Anything required for *scientific explanation and prediction* (the stated purpose). This includes checkability, non-emptiness, handling masks/finks, degrees, and grounding.
      *   *Preference:* Ontological commitments. Reduction to categoricals? Humean laws? Ordinary language fidelity? Fundamental powers? These are metaphysical choices, not strictly required for the *utility* of the theory in science, though they affect the *interpretation*.
      *   *Incompatibilities:*
          *   "Checkability" + "Unmanifested Possession" is tense. If it never manifests, how is it checked? (Requires inference to best explanation).
          *   "No Gerrymandering" + "Multi-track" can conflict if the tracks are disjunctive.
          *   "Reduction to Categorical Basis" + "Late Fink/Self-healing" is hard. If the basis changes instantly, is it the same basis?
          *   "Humean Laws" + "Genuine Disposition (Modal Force)" is the classic conflict. Humeans deny the modal oomph.
      *   *Most Exclusionary:* Probably the "Grounding without Regress/Collapse" combined with "Non-emptiness." This kills pure conditional analyses and strict identity theories.
      *   *Most Prejudicial to Delete:* "Preservation of Ordinary Ascriptive Practice." Science often revises ordinary concepts (e.g., "heat" isn't "hotness"). If the theory works for science, ordinary language can be sacrificed.

  5.  **Drafting the Content (incorporating the specific constraints):**
      *   *Self-Healing Slab:* Needs to ensure the theory distinguishes between "no brittleness" and "brittleness + internal repair."
      *   *Late Fink:* Needs to address the ontology of the manifestation event.
      *   *Chancy Fink:* Needs to address probabilistic possession.

  6.  **Review against Constraints:**
      *   Did I survey theories? No.
      *   Is it a specification? Yes.
      *   Are the distinctions included? Yes.
      *   Are the novel cases included? Yes.
      *   Is the meta-analysis (negotiable/non-negotiable) included? Yes.
      *   Is the scorecard brief? Yes.

  7.  **Final Polish:** Ensure the tone is authoritative and precise. Make sure the "Why Requirement not Taste" sections are punchy. Ensure the table is clear. (Self-Correction: Make sure the distinction between "Camp Preference" and "Non-negotiable" is sharp. For example, Reductionism is a camp preference because Functionalism works for science without it.)

  8.  **Final Output Structure:**
      *   Introduction (acknowledging the brief).
      *   The Specification Table (Requirement, Motivation, Status).
      *   Detailed Reasoning (grouped by theme).
      *   Meta-Analysis (Incompatibilities, Exclusionary, Prejudicial).
      *   Brief Scorecard.

  *(Self-Correction during drafting)*: I need to be careful with the "Grounding" requirement. The prompt asks for "what grounds a disposition in its basis without either collapsing the two or generating a regress." This is a very high bar. I need to frame it as a requirement for the theory to *address* this, not necessarily solve it perfectly if it's impossible, but the prompt says "A theory should... say something." I will frame it as a requirement for a non-circular grounding account.

  *(Refining the "Late Fink")*: The prompt asks "Does the glass break? Does it manifest its fragility?" The specification needs to demand the theory *answer* this consistently, not necessarily prescribe the answer. The requirement is *Temporal Resolution of Manifestation*.

  *(Refining "Chancy Fink")*: The requirement is *Probabilistic Discrimination*.

  Let's assemble.
answer: |-
  # Specification for a Theory of Dispositions

  ## 1. The Desiderata Table

  | ID | Requirement | Motivation (Case/Consideration) | Why Requirement, Not Taste | Status |
  | :--- | :--- | :--- | :--- | :--- |
  | **D1** | **Possession Without Manifestation** | Unmanifested dispositions (e.g., the glass never struck). | Prediction requires attributing properties prior to event. | **Non-Negotiable** |
  | **D2** | **Explanatory Non-Emptiness** | Dormitive virtue joke; circular definitions. | Explanation requires the disposition to do work distinct from the outcome. | **Non-Negotiable** |
  | **D3** | **Empirical Checkability** | Scientific evidence for/against ascriptions. | If unverifiable, it cannot underwrite scientific prediction. | **Non-Negotiable** |
  | **D4** | **Basis/Disposition Distinction** | Multiple realizability (steel vs. glass brittleness). | Special sciences track functional roles, not just microphysics. | **Non-Negotiable** |
  | **D5** | **Mask vs. Absence Discrimination** | **Self-Healing Slab:** Internal repair vs. intrinsic toughness. | Explanation of failure/success requires knowing if the risk was present but blocked. | **Non-Negotiable** |
  | **D6** | **Stimulus vs. Interferer Distinction** | Enabling conditions vs. blocking conditions. | Experimental control requires isolating triggers from background noise. | **Non-Negotiable** |
  | **D7** | **Multi-Track Coherence** | Fragility manifests via striking, heating, bending. | Scientific kinds must be robust across varied testing conditions. | **Non-Negotiable** |
  | **D8** | **Modal Force (vs. Accidental)** | Gold spheres vs. fragile glass regularities. | Prediction requires support for counterfactuals, not just actuals. | **Non-Negotiable** |
  | **D9** | **Fink/Mimic Resistance** | Extrinsic devices adding/removing bases instantly. | Real systems contain feedback loops and monitoring. | **Non-Negotiable** |
  | **D10** | **Degreed & Probabilistic Possession** | Radioactive decay; varying alloy brittleness. | Science is quantitative; binary accounts lose predictive precision. | **Non-Negotiable** |
  | **D11** | **Temporal Resolution of Manifestation** | **Late Fink:** Interrupted/Reversed processes. | Dynamic systems require accounts of processes, not just endpoint outcomes. | **Non-Negotiable** |
  | **D12** | **Probabilistic Interference Discrimination** | **Chancy Fink:** 90% blocking vs. 10% propensity. | Statistical analysis requires distinguishing noise from structural change. | **Non-Negotiable** |
  | **D13** | **Anti-Gerrymandering** | "Disposition to break if a demon sneezes." | Explanatory utility requires natural kinds, not infinite ad-hoc pairings. | **Non-Negotiable** |
  | **D14** | **Non-Regressive Grounding** | Link between disposition and categorical basis. | Metaphysical coherence; avoids infinite deferral of explanation. | **Non-Negotiable** |
  | **D15** | **Reduction to Categorical Bases** | Preference for a world of static properties. | Functional accounts work without this; ontological preference. | *Camp Preference* |
  | **D16** | **Humean Law Compatibility** | Preference for regularity-based laws. | Dispositions often imply modal force incompatible with strict Humeanism. | *Camp Preference* |
  | **D17** | **Ordinary Language Preservation** | "Fragile" means what laypeople think. | Scientific revision often improves upon ordinary concepts. | *Camp Preference* |
  | **D18** | **Fundamentality of Powers** | Preference for powers as ontological primitives. | Compatible with emergent dispositions in special sciences. | *Camp Preference* |

  ---

  ## 2. Detailed Reasoning and Distinctions

  ### The Core Explanatory Constraints (D1–D3)
  The stated purpose is to underwrite scientific explanation and prediction.
  *   **D1 (Possession Without Manifestation):** If a theory equates having a disposition with manifesting it (under conditions), it cannot predict the behaviour of an object *before* the test. Science relies on attributing properties to objects that have not yet been subjected to the stimulus.
  *   **D2 (Explanatory Non-Emptiness):** If "fragile" just means "breaks when struck," saying "it broke because it was fragile" is tautological. The theory must posit a property *in virtue of which* the conditional holds. This rules out pure Simple Conditional Analysis (SCA).
  *   **D3 (Empirical Checkability):** If the property is occult (in principle unobservable), scientists cannot gather evidence for it. The theory must allow for inference from effects, structural analysis, or comparative testing.

  ### Structural Distinctions (D4–D8)
  A theory that collapses these distinctions fails to map onto scientific practice.
  *   **D4 (Basis vs. Disposition):** Brittleness is realized by crystalline structure in steel and molecular bonding in glass. If the theory identifies the disposition *with* the specific microstructure, it cannot explain why different materials share the same dispositional label in engineering contexts.
  *   **D5 (Mask vs. Absence):** This is critical for the **Self-Healing Slab**. If the slab contains a brittle matrix but also microcapsules of resin that seal cracks instantly, is it brittle?
      *   *Requirement:* The theory must distinguish between (a) the absence of the crack-propagation basis and (b) the presence of the basis plus an intrinsic interferer (the resin). If it collapses these, materials scientists cannot distinguish between a tough alloy and a brittle composite with self-repair.
  *   **D6 (Stimulus vs. Interferer):** Striking is the stimulus; oxygen presence might be an enabler; a protective coating is an interferer. A theory that treats all conditions as part of the "stimulus clause" makes the disposition trivial (i.e., "disposed to break when struck-in-the-absence-of-masks"). The theory must structurally separate the trigger from the background conditions.
  *   **D7 (Multi-Track):** Fragility is not just one conditional. It is a cluster. A theory that treats every stimulus-manifestation pair as a distinct disposition (D13 violation) loses the unity of the property.
  *   **D8 (Modal Force):** Regularities can be accidental. A theory must explain why the glass *would* break, not just that it *does*. This is the difference between a law-like connection and a coincidence.

  ### The Hard and Novel Cases (D9–D12)
  Standard cases (finks, antidotes) are necessary but insufficient. The novel cases stress the temporal and probabilistic machinery.
  *   **D9 (Fink/Mimic):** A fink removes the basis upon stimulus. A mimic creates the manifestation without the basis. The theory must handle extrinsic changes to intrinsic properties during the causal interval.
  *   **D10 (Degreed/Probabilistic):** Dispositions are rarely binary. Steel has a degree of brittleness; isotopes have decay probabilities. A binary theory forces arbitrary thresholds, reducing predictive accuracy.
  *   **D11 (Temporal Resolution):** The **Late Fink** case probes the ontology of the manifestation. If a crack initiates (micro-structural failure) but is reversed before macroscopic shattering, did the manifestation occur?
      *   *Requirement:* The theory must define the manifestation event's temporal boundaries. Is it the initiation of damage or the macroscopic outcome? If the latter, the disposition appears absent; if the former, it is present but interrupted. Science needs to know if the material suffered stress damage, even if repaired.
  *   **D12 (Probabilistic Interference):** The **Chancy Fink** (90% blocking) creates a statistical signature identical to a reduced propensity (10% brittleness).
      *   *Requirement:* The theory must provide criteria to distinguish an external probabilistic interferer from an intrinsic reduction in dispositional strength. This is vital for quality control: is the batch bad (intrinsic) or is the testing machine faulty (extrinsic)?

  ### Metaphysical Hygiene (D13–D14)
  *   **D13 (Anti-Gerrymandering):** Without constraints, every object has infinite dispositions (e.g., "to break if struck by a golden hammer"). This dilutes explanatory power. The theory must privilege "natural" stimuli and manifestations.
  *   **D14 (Non-Regressive Grounding):** If the basis is itself purely dispositional, we face a regress (dispositions all the way down). If the disposition *is* the basis, we collapse D4. The theory must articulate a grounding relation (realization, supervenience, or identity) that stops the regress without erasing the distinction.

  ---

  ## 3. Meta-Analysis: Conflicts and Culls

  ### Non-Negotiable vs. Camp Preference
  *   **Non-Negotiable:** D1–D14. These are derived directly from the requirement to support *scientific explanation and prediction*. If a theory fails D5 (Mask vs. Absence), it cannot guide materials engineering. If it fails D3 (Checkability), it is not scientific.
  *   **Camp Preference:** D15–D18.
      *   **D15 (Reduction):** Special sciences function perfectly well with functionalist accounts that do not reduce to fundamental categoricals.
      *   **D16 (Humeanism):** A Humean can accept dispositions as useful summaries of regularities, but a Realist about powers cannot. Both can do science; the choice is metaphysical, not pragmatic.
      *   **D17 (Ordinary Language):** Science frequently revises folk concepts (e.g., "force," "heat"). Adherence to folk usage is not required for scientific utility.
      *   **D18 (Fundamentality):** Dispositions in the special sciences (e.g., solubility) are often emergent. They need not be fundamental powers.

  ### Incompatibilities
  There is a tension cluster between **D3 (Checkability)**, **D1 (Possession Without Manifestation)**, and **D14 (Non-Regressive Grounding)**.
  *   **The Conflict:** If a disposition can exist without ever manifesting (D1), and its basis is not directly observable (often the case in microphysics), how is it checkable (D3)? We rely on inference to the best explanation. However, if the grounding relation (D14) requires the basis to be categorical and intrinsic, but our best physics describes the basis dispositionally (quantum fields), D14 may force a regress or a collapse.
  *   **Argument:** A theory that insists on *direct* checkability of the basis will fail D1. A theory that insists on *categorical* bases (D15) may fail to align with modern physics, threatening D3. The specification requires the theory to *resolve* this tension, likely by accepting indirect checkability and allowing non-fundamental categorical bases.

  ### The Most Exclusionary Requirement
  **D2 (Explanatory Non-Emptiness) combined with D14 (Non-Regressive Grounding).**
  *   **Reasoning:** This pair eliminates the Simple Conditional Analysis (fails D2), the Identity Theory (fails D4/D14 distinction), and pure Regularity accounts (fails D2/D8). It demands a robust metaphysics of properties that do real causal work but are distinct from their effects. This is the highest bar for any candidate theory.

  ### The Most Prejudicial Requirement to Delete
  **D17 (Ordinary Language Preservation).**
  *   **Reasoning:** This is the weakest link for a *scientific* specification. Ordinary language is often vague, context-dependent, and anthropocentric. Scientific dispositions (e.g., "radioactive," "conductive") are precise and often contradict folk intuition. Deleting D17 allows the theory to optimize for predictive accuracy and explanatory depth without being dragged down by folk semantics.

  ---

  ## 4. Brief Scorecard of Candidate Approaches

  | Theory Type | Fails D2 (Non-Empty) | Fails D5 (Mask/Absence) | Fails D11 (Late Fink) | Fails D14 (Grounding) |
  | :--- | :---: | :---: | :---: | :---: |
  | **Simple Conditional Analysis** | **YES** | **YES** | **YES** | N/A |
  | **SCA + Interferer Clause** | Marginal | **YES** (Circular) | **YES** | N/A |
  | **Basis-Identity Account** | No | **YES** (Collapses) | **YES** (No process) | **YES** (Collapses D4) |
  | **Powers/Potentiality Account** | No | No | **Maybe** (Process ontology?) | No (Accepts primitive powers) |
  | **Functionalist/Role Account** | No | No | **Maybe** (Depends on realization) | No (Realization relation) |

  *Note: The scorecard indicates that standard conditional analyses fail the core explanatory constraints immediately. Powers and Functionalist accounts survive better but must address the temporal/process constraints (D11) and grounding (D14) specifically to meet this specification.*
