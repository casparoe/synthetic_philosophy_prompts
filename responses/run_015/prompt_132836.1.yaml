answer: |-
  Thank you for laying this out so clearly. It is rare to see the philosophical tensions of clinical practice exposed so starkly in an operational policy, and you are right to feel that something is off in the logic here. To answer your first question about what the policy presupposes, the procedure acts as if risk is a inherent property of the patient, similar to blood pressure or height, waiting to be measured by the correct instrument. This is a realist view of risk, suggesting that there is a single true number for each person that represents their actual probability of a heart attack, and that the model is merely a tool to approximate this truth. However, the behavior of your colleagues reveals that this presupposition is false in practice. When they add a calcium scan or remove a postcode, they are acknowledging that risk is not a property of the individual alone but a relation between the individual and a reference class. The number changes because the group against which the patient is compared changes. So the policy officially presupposes a single correct answer, but the daily practice operates on the view that the number is just the rate in whatever group you decide to count them in. This creates a fundamental instability because if the number is group-relative, there is no group that is the right one unless you define rightness by something other than medical truth, such as predictive accuracy or fairness.

  This leads directly to your question about coherence. If the number is just a rate in a selected group, the policy is incoherent only if it claims to be discovering medical facts. It becomes coherent if you admit that the selection of variables is a normative choice rather than an epistemic one. When your colleagues refuse to use postcode or ethnicity because it is not really about the patient, they are making an ethical claim about responsibility and biology, not a statistical one. They are deciding that certain causes of risk should not count against the patient for the purpose of resource allocation. If you are honest that you are picking the group for reasons that are not medical at all, such as cost, fairness, or what you are willing to be seen using, then the policy is logically consistent as a rationing mechanism. It stops pretending to be a diagnostic test and admits to being a eligibility criterion. The incoherence arises because you are using a constructible number to deny care while simultaneously claiming that such numbers are too crude to guide care. You cannot have it both ways. Either the score is robust enough to deny treatment, in which case it must be robust enough to guide it, or it is too sensitive to modeling choices to deny treatment, in which case it should not be used as a hard threshold for refusal.

  The fixed budget absolutely changes the question, and it might be the key to dissolving the contradiction you are feeling. If you have a hard cap of four thousand patients a year, you are not actually treating based on a threshold of medical need. You are treating based on a threshold of priority. In a prioritization system, the absolute value of the risk number matters less than the ranking it produces. If the model orders patients correctly from highest risk to lowest risk, then the specific percentage is irrelevant except as a way to draw a line where the money runs out. This suggests that half your arguments about which variables belong in the model are indeed about the wrong thing if the goal is purely efficient allocation. You should only care about variables that improve the ranking order, not variables that make the number feel more true to the individual. However, your policy retains a threshold of fifteen percent, which implies an absolute standard of safety or need. This is where the budget creates a fiction. If the budget shrinks, do you raise the threshold to twenty percent? If you do, you are admitting the number is about money. If you keep it at fifteen percent and just stop treating some people who qualify, you are admitting the number is about luck. Your current audits prevent clinics from enrolling patients below the threshold, which enforces the medical fiction, but the budget cap enforces the economic reality. The policy tries to hide the economic reality behind the medical fiction, and that is why your colleagues feel the need to manipulate the inputs to fit their moral intuitions about who deserves care.

  Regarding which views the practice quietly rules out, it effectively rules out a strict individualist view of medicine where every patient is treated as a unique biological universe without reference to population data. It also rules out a strict egalitarian view where everyone gets the same offer regardless of risk. It occupies a middle ground of prioritarianism, where those at higher risk get priority, but it is underdetermined because several different theories could license exactly what you do. A utilitarian would support you because treating high-risk patients prevents more heart attacks per dollar spent. A prioritarian would support you because they want to help those worst off, assuming high risk equates to being worse off. Even a libertarian might support it if they view the threshold as a contract term. The practice is underdetermined because it does not specify why fifteen percent is the magic number. Is it because below fifteen percent the drugs do not work well enough? Or is it because above fifteen percent the cost per life saved drops below a certain amount? The policy treats these as the same question, but they are not. One is about clinical efficacy, the other about economic efficiency. Because the policy does not distinguish them, your colleagues are forced to smuggle their economic judgments into their clinical variable selection, which is why they argue about whether postcode is really about the patient. They are actually arguing about whether social determinants of health should count toward resource eligibility.

  If you gave up the idea that there is any fact of the matter about an individual risk, the policy would have to look quite different. The threshold would not survive as a medical line. It would become a funding cutoff, explicit and acknowledged. You would say that we have enough money to treat the four thousand people with the highest calculated scores, regardless of whether that score is fifteen percent or ten percent. The audits would not check whether patients below the threshold were enrolled, but whether the enrollment matched the priority ranking given the budget. You would stop auditing for clinical appropriateness and start auditing for allocation consistency. Most importantly, what you say to a patient who asks why they got the leaflet would change. Currently, you imply that they are safe, that their body is not at risk. If you abandon the fact of the matter view, you would have to tell them that their risk is uncertain and unknowable, but that given the resources available, others have been judged to be in greater need based on the best available grouping. This is a much harder conversation, which is likely why the hospital clings to the idea of the risk number as a measurement. It protects the clinicians from having to articulate the scarcity. It allows them to say you do not need this, rather than we cannot give you this.

  Ultimately, your policy is trying to do two incompatible things. It is trying to be a clinical guideline that identifies biological need, and it is trying to be a budgetary control that limits expenditure. When your colleagues manipulate the variables, they are trying to reconcile these two goals by adjusting the clinical signal to match their moral sense of who should get the limited resources. They are using the model not to predict risk, but to allocate care. If you want to resolve the bug that has been bothering you, you need to decide which function is primary. If it is clinical, you must acknowledge the uncertainty of the number and allow more discretion, which will blow the budget. If it is budgetary, you must acknowledge the arbitrariness of the threshold and stop pretending the number is a measurement of the patient rather than a ticket for entry. You can run the practice on the view that the number is just the rate in whatever group you decide to count them in, but only if you are honest that the decision of which group to use is driven by your capacity to pay, not your capacity to know. Until you make that choice, the incoherence will remain, and your colleagues will continue to game the inputs to make the system feel just enough to sleep at night.
