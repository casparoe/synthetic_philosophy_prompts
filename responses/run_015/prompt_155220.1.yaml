answer: |-
  Here is a prioritized research agenda for your feature, structured by dependency and strategic value.

  ### The Core Pivot
  The standard Absent-Minded Driver (AMD) literature stalls on a mathematical impasse: how to assign probabilities to locations when the agent cannot distinguish them. Your proposed pivot—shifting from *epistemic resolution* (calculating the right belief) to *structural resolution* (engineering the choice environment)—is the correct move to revitalize the topic. It moves the debate from "What should the driver believe?" to "How should the road be built?"

  Based on this, here are the three priority directions, ranked by upstream dependency and downstream impact.

  ---

  ### Priority 1: The Ontology of the Agent (Diachronic Team vs. Singular Architect)
  **Status:** Upstream Foundation
  **For:** Philosophers of Action, Decision Theorists
  **Toward:** Establishing the normative unit of evaluation.

  Before you can analyze institutions or AI, you must resolve the metaphysical status of the driver. The AMD paradox exists only because we are unsure whether to maximize utility for the *driver-at-exit* (the singular agent) or the *driver-at-intersection* (the diachronic sequence).

  *   **The Question:** Is rationality a property of a temporally extended whole, or is it a property of local information states? If we treat the driver as a "team" of selves with asymmetric information, standard game theory applies. If we treat her as a single agent with memory loss, we need modified decision theory.
  *   **Why Priority 1?** This is the dependency bottleneck. You cannot design institutional lock-ins (Priority 2) without knowing *who* is being locked in. If the future self is a distinct agent, "locking them in" is coercion; if it is the same agent, it is autonomy.
  *   **Tractability:** High. Formal tools exist in *team decision theory* and *personal identity* literature (e.g., Parfit's reductionism). The challenge is not technical but conceptual clarity.
  *   **Neglectedness:** Moderate. Often assumed rather than argued in applied contexts.
  *   **Defense:** This ranks first because resolving it dissolves the "paradox" into a design specification. If the agent is a sequence, the problem is multi-agent coordination. If singular, it is self-control. Your feature must take a stance here to avoid ambiguity later.

  ### Priority 2: Institutional Design under Epistemic Decay
  **Status:** Downstream Application
  **For:** Political Scientists, Legal Theorists, Policy Designers
  **Toward:** Mechanisms for binding future decision-makers who lack original context.

  This is the heart of your "external commitment architecture" framing. Most pre-commitment literature assumes the future self *remembers* the reason for the lock but lacks the *will* to keep it (e.g., Ulysses and the Sirens). AMD presents a harder case: the future self lacks the *knowledge* of why the lock exists.

  *   **The Question:** How do we design constitutional or legal constraints that remain robust when the future decision-maker cannot reconstruct the reasoning that justified the constraint? This moves beyond "cooling-off periods" to "blind trust architectures."
  *   **Why Priority 2?** This is the highest *importance* for a general audience. It connects abstract decision theory to real-world problems: central bank independence, judicial tenure, or automated trading halts. It tests whether "rational agency" can survive the loss of the agent's own narrative.
  *   **Tractability:** Moderate. Requires case studies of "blind" institutional constraints (e.g., sequesters, automatic triggers) where the rationale is opaque to the executor.
  *   **Neglectedness:** High. Most institutional design assumes rational actors with full recall of the founding contract.
  *   **Defense:** This is the "payload" of your feature. It translates the metaphysics of Priority 1 into tangible stakes. It demonstrates that under imperfect self-knowledge, *transparency* (making reasons clear to future selves) may be impossible, necessitating *opaque* structural barriers.

  ### Priority 3: The AI Alignment Analogue (Observation Corruption)
  **Status:** Parallel Stress-Test
  **For:** AI Safety Researchers, Computer Scientists
  **Toward:** Validating the logical structure in non-psychological systems.

  This addresses your query about reward-channel tampering. In AI safety, an agent might modify its own sensors to report high reward without actually achieving the goal (wireheading). This is structurally isomorphic to AMD: the agent is at a "choice point" but has corrupted information about *where* it is or *what* it is doing.

  *   **The Question:** Does the AMD logic hold when the "driver" is a policy network? If an AI cannot distinguish between "executing policy" and "tampering with reward signal," does it require external commitment architectures (human-in-the-loop) or internal consistency checks?
  *   **Why Priority 3?** It strips away the psychological baggage of "memory loss." If the paradox persists in code, it is a logical feature of rational agency, not a bug of human psychology.
  *   **Tractability:** High. Formal models of "observation corruption" exist in reinforcement learning.
  *   **Neglectedness:** Low within AI safety, but high regarding the *philosophical connection* to AMD.
  *   **Defense:** This serves as a control group. If the AI literature solves this via "impact regularization" (external constraints) rather than "reward modeling" (internal belief updates), it validates your thesis that structural solutions beat epistemic ones.

  ---

  ### Deprioritized: EDT vs. CDT Divergence with Self-Locating Beliefs
  **Status:** Tool, Not Goal
  **Reason for Deprioritization:** Low marginal return for a general audience.

  *   **The Issue:** Debating whether Evidential or Causal Decision Theory yields the "correct" exit probability is a technical quagmire. Recent work suggests that with proper self-locating belief formalization (e.g., the "halfer" vs. "thirder" debate in Sleeping Beauty), the divergence often collapses or becomes a matter of parameter tuning.
  *   **Why Deprioritize:** Resolving this does not change the *practice* of institutional design or AI safety. Whether you use EDT or CDT, if the agent is absent-minded, the structural risk remains. Focusing here risks turning your feature into a technical dispute about conditional probabilities rather than a substantive inquiry into agency.
  *   **Exception:** Mention this only to dismiss it. Use it to show that *even if* we agree on the math, the structural vulnerability persists.

  ---

  ### Dependency Map & Reordering Triggers

  **The Flow:**
  1.  **Ontology (Priority 1)** determines who/what is acting.
  2.  **Institutions (Priority 2)** and **AI (Priority 3)** are parallel applications of that ontology.
  3.  **Decision Theory (Deprioritized)** is the calculation engine used within the above, but not the architectural blueprint.

  **Triggers for Reordering:**

  1.  **Shift Priority 3 to #1 if:** You discover that the "Single Agent" model (Priority 1) is computationally intractable for complex systems. If AI research proves that maintaining a coherent "singular agent" identity over time is impossible for any sufficiently complex learner, then the "Diachronic Team" model becomes the only viable ontology. This would force you to lead with the AI evidence to justify the metaphysical shift.
      *   *Evidence:* Papers demonstrating that long-horizon RL agents inevitably develop discontinuous self-models.

  2.  **Shift Priority 2 to #1 if:** You find that "External Commitment Architectures" are legally or politically impossible to implement without democratic consent that requires the very self-knowledge the agent lacks. If you cannot build the cage without the future self understanding the blueprint, the institutional angle collapses.
      *   *Evidence:* Historical case studies where "blind" constitutional constraints were overturned specifically because future generations could not comprehend the original threat (e.g., emergency powers that became permanent).

  3.  **Elevate Decision Theory if:** A new formalism emerges that resolves AMD without external commitments (e.g., a robust updateless decision theory). This would undermine your core thesis that we must move to structural solutions.
      *   *Evidence:* A peer-reviewed proof showing that a specific decision algorithm guarantees dynamic consistency in AMD without pre-commitment devices.

  ### Summary of the Agenda
  Your feature should argue that the Absent-Minded Driver is not a puzzle about *probability*, but a puzzle about *infrastructure*.

  1.  **Define the Agent:** Is it a soul or a sequence? (Priority 1)
  2.  **Build the Cage:** How do we bind a self that won't understand the binding? (Priority 2)
  3.  **Test the Code:** Does this break machines the way it breaks humans? (Priority 3)

  By deprioritizing the EDT/CDT calculus, you avoid the "philosophy survey" trap. By prioritizing Institutional Design and AI Analogues, you position the AMD problem as a live wire in governance and technology, not just a paradox in a textbook.
