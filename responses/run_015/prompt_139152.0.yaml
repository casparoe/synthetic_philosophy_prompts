  ### Sidebar: Which Decision Theory Are You Running?

  **Instructions:** Read the eight scenarios below. For each, pick the option that feels most like what you would actually do. Don't overthink it; go with your gut.

  **1. The Forecast**
  An oracle who is almost always right has already left to meet you in either Damascus or Aleppo. You are in Damascus. If you stay, you meet him; if you flee to Aleppo, you meet him there. Dying is the worst outcome. Fleeing costs $100 in train fare.
  *   A) Stay in Damascus (Save the $100).
  *   B) Flee to Aleppo (Spend the $100).
  *   C) I can't decide.

  **2. The Bonus**
  Same setup as above. The oracle has already left. This time, the train ticket to Aleppo is free, and the station master gives you a $100 bonus for traveling today.
  *   A) Stay in Damascus.
  *   B) Flee to Aleppo.
  *   C) I can't decide.

  **3. The Odds (Frame A)**
  The oracle is right 90% of the time. You are in Damascus. Fleeing costs $100.
  *   A) Stay.
  *   B) Flee.
  *   C) I can't decide.

  **4. The Odds (Frame B)**
  The oracle is wrong 10% of the time. You are in Damascus. Fleeing costs $100.
  *   A) Stay.
  *   B) Flee.
  *   C) I can't decide.

  **5. The Lock**
  The night before, you can pay a fee to have a machine lock your location choice for you. The oracle knows about the machine.
  *   A) Pay the fee to lock it in.
  *   B) Don't pay; decide in the moment.
  *   C) It makes no difference.

  **6. The Year**
  You face this same choice every week for a year. The oracle forecasts each week fresh.
  *   A) Pick the same city every time.
  *   B) Mix it up randomly.
  *   C) Try to outthink the oracle each week.

  **7. The Coin**
  The oracle foresees coin flips, too. You consider flipping a coin to decide where to go.
  *   A) Flip the coin; it helps.
  *   B) Don't flip; he'll know the result.
  *   C) Flip anyway; it confuses things.

  **8. The Toss**
  Same setup, but there is no oracle. Your location is matched against a coin toss made by nature.
  *   A) Stay.
  *   B) Flee.
  *   C) It doesn't matter.

  ***

  ### Scoring Key

  **Tally your answers:**
  *   **Mostly A (Stay/Lock/Consistent):** You lean toward **The Architect**.
  *   **Mostly B (Flee/Random/Change):** You lean toward **The Independent**.
  *   **Mostly C (Undecided/No Diff):** You lean toward **The Drifter** or **The Rejector**.
  *   **Mixed A/B on Q1 & Q2:** You are sensitive to framing (**The Mirror**).
  *   **Yes on Q7 (Coin):** You are **The Shuffler**.

  **Detailed Weights:**
  *   **Q1 & Q2:** If you flipped (A then B, or B then A), add 2 points to **The Mirror**. If you stayed same (A/A or B/B), add 2 points to **The Architect**.
  *   **Q3 & Q4:** If you answered differently, add 1 point to **The Mirror**.
  *   **Q5:** "Pay fee" = +2 **Architect**. "Don't pay" = +2 **Independent**.
  *   **Q6:** "Same city" = +1 **Architect**. "Mix it up" = +2 **Shuffler**.
  *   **Q7:** "He'll know" = +2 **Architect**. "It helps" = +2 **Shuffler**.
  *   **Q8:** "It doesn't matter" = +2 **Drifter**. "Stay/Flee" = +1 **Independent**.

  **Results:**
  *   **Highest Score:** Read the blurb below.
  *   **Tie:** You are in the transition zone (e.g., between Architect and Independent). This is common; it means your intuition shifts based on stakes.

  ***

  ### Results Panel

  *   **The Independent:** You treat your choice as a fresh move. The past is set; you just pick the option with the best immediate payoff.
  *   **The Mirror:** You see your choice as a clue. If picking an option makes a bad outcome look likely, you hesitate, even if the pick doesn't cause the outcome.
  *   **The Shuffler:** You believe unpredictability is a shield. If the world can read your mind, you try to scramble the signal.
  *   **The Architect:** You focus on the rule, not the act. You choose the strategy that wins, even if it means locking yourself in beforehand.
  *   **The Drifter:** You feel the puzzle is stuck. No option looks stable, so you suspend judgment.
  *   **The Rejector:** You think the setup is impossible. A forecaster that accurate with those payoffs can't exist.

  ***

  ### Designer's Notes (For the Journalist)

  **Logical Space & Empty Combinations**
  The six leaves above cover the main theoretical camps. However, two logical combinations in the quiz tree are effectively empty:
  1.  **The "Selective Shuffler":** Answering "Flip the coin" on Q7 (Coins) but "Don't pay to lock" on Q5 (Pre-commit). *Why:* Incoherent. If randomization works against a forecaster, you should pay to ensure the randomization happens.
  2.  **The "Optimistic Rejector":** Answering "This is impossible" on Q1 but "Flee" on Q8 (Control). *Why:* Unattractive. If you reject the forecaster case as broken, you usually treat the control case as the only real baseline, not a place to apply survival heuristics.

  **Indistinguishable Leaves**
  Be transparent with readers: **The Drifter** and **The Mirror** often look identical in this quiz. Both result in "I can't decide" or flipping answers. The difference is internal: The Mirror sees a conflict of interest; The Drifter sees a lack of convergence. The quiz cannot separate them without asking about *why* they are stuck.

  **The Cut**
  If you need to reduce to five questions: **Cut Q4.**
  Q3 and Q4 are the framing pair. Q3 ("Right 9 times") is the standard phrasing. Q4 ("Wrong 1 time") tests for framing bias, which is secondary to the core decision theory split. Keeping Q3 preserves the test of probability sensitivity without losing the main signal.

  **Flowchart Logic (For Layout)**
  1.  **Start:** Q1 & Q2.
  2.  **Did you flip?** Yes → **The Mirror**. No → Go to Q5.
  3.  **Q5 (Pre-commit):** Pay? Yes → **The Architect**. No → Go to Q7.
  4.  **Q7 (Coin):** Works? Yes → **The Shuffler**. No → Go to Q8.
  5.  **Q8 (Control):** Matters? Yes → **The Independent**. No → **The Drifter/Rejector**.

  *(Note: This flowchart is a simplification for visual layout; the scoring key above is more robust for edge cases.)*
