answer: |-
  **MEMORANDUM**

  **TO:** Joint Parliamentary Committee on Constitutional Affairs
  **FROM:** Senior Counsel
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on the Proposed Statutory Duty to Assent

  **Executive Summary**

  You have requested advice regarding the Government's proposal to codify a statutory "duty to assent," thereby eliminating the Monarch's discretionary power to refuse legislation. This memo compares relevant international models, assesses the democratic implications of the reserve power, and weighs the risks of codification against the risks of ambiguity.

  **Recommendation:** The Committee should recommend **adopting the statutory duty to assent.** While the current system of unwritten conventions offers a theoretical safeguard against tyranny, it relies on an undemocratic check that is incompatible with modern parliamentary sovereignty. Codifying the duty aligns our laws with our political reality, enhances democratic legitimacy, and follows the successful trajectory of comparable democracies.

  **1. Comparative Models: Scandinavia vs. The United Kingdom**

  To understand the stakes, we must distinguish between the two primary models of monarchy in mature democracies.

  The **Scandinavian model** (exemplified by Sweden and Norway) represents a "strictly ceremonial" monarchy. In these jurisdictions, constitutional revisions have explicitly stripped the monarch of any political discretion. The monarch signs legislation as a matter of legal obligation, not personal will. Refusal is not merely unlikely; it is constitutionally impossible. This model prioritizes clarity. There is no gap between how the system works in practice and what the law says.

  The **United Kingdom model**, which our current system mirrors, relies on **unwritten conventions**. Technically, the Monarch retains the "reserve power" to refuse assent. However, by strong constitutional convention, this power is never used. This creates a state of "constructive ambiguity." The power exists on paper to preserve the dignity of the Crown, but it is dormant in practice.

  The Government's proposal seeks to move us from the UK model to the Scandinavian model. The advantage of the Scandinavian approach is legal certainty. In the UK model, uncertainty persists: if a government passed highly controversial legislation, could the Monarch refuse? We rely on the hope that they would not, rather than the law that says they must. In a polarized political environment, relying on hope is a vulnerability. Codification removes this ambiguity, ensuring the Head of State cannot be drawn into political disputes.

  **2. The Japanese Template: A Viable Intermediate?**

  Japan's post-war Constitution designates the Emperor as "the symbol of the State and of the unity of the people," expressly denying him any governmental powers. All acts of the Emperor in matters of state require the advice and approval of the Cabinet, which bears responsibility.

  This offers a viable template for the *function* of the monarchy, though not necessarily the *structure*. Japan successfully transitioned from a sovereign monarch to a symbolic one by clearly separating the "dignified" role (symbolic unity) from the "efficient" role (governing).

  However, Japan is not a perfect "intermediate" for a Westminster system. In Westminster democracies, the Crown is legally part of the legislature (Crown-in-Parliament). In Japan, the Emperor is entirely outside the legislature. Nevertheless, the Japanese framework demonstrates that a hereditary figurehead can coexist with a robust democracy provided their lack of discretion is absolute. It validates the core premise of the proposed statute: that a monarch can retain cultural significance without retaining political leverage. If Japan can maintain stability with a purely symbolic head of state, the fear that our monarchy requires discretionary power to function is unfounded.

  **3. The Counter-Majoritarian Dilemma**

  The core constitutional question is whether an unelected official should possess any ability to stop the elected legislature.

  **If we adopt the statute (Automatic Assent):**
  We acknowledge there is no longer an institutional brake on majoritarian overreach at the final stage of legislation. If a Parliament passes a law, it becomes law. Critics argue this removes a safety valve. However, in a mature democracy, the brakes on overreach should be the electorate, the courts, and the internal checks of the legislature itself, not the personal discretion of a hereditary monarch. Relying on the Monarch suggests a failure of other democratic institutions.

  **If we retain ambiguity (Discretionary Assent):**
  We preserve a theoretical check, but at the cost of democratic legitimacy. The existence of the power, even if unused, implies that the will of the people's representatives is subordinate to the will of one unelected individual. In an era where trust in institutions is fragile, maintaining a "sleeping" power that could theoretically overturn an election mandate undermines the principle that authority derives from the people. It creates a shadow of illegitimacy over every piece of legislation, as citizens know, technically, that one person could have stopped it.

  **4. The Strongest Argument for the Rejected Position**

  In recommending the statute, I must address the most compelling argument for preserving the current ambiguity: **The "Constitutional Insurance Policy."**

  Proponents of the status quo argue that the reserve power is a necessary nuclear option. They contend that conventions are only binding on those who agree to be bound by them. If a future government were to act unconstitutionally—for example, by passing legislation to abolish elections, extend its own term indefinitely, or subvert the judiciary—the Monarch's refusal to assent might be the only remaining barrier to tyranny.

  Under the proposed statute, the Monarch would be legally compelled to sign even a law that ends democracy. The argument is that the risk of a Monarch misusing the power is less dangerous than the risk of a government successfully legislating away democratic freedoms without any final check. This view holds that ambiguity is a feature, not a bug; it keeps the power in reserve for a true emergency where the normal rules of democracy have already broken down. To codify the duty to assent is to remove the fire extinguisher because fires are rare, ignoring the catastrophe that occurs when one finally starts.

  **5. Reasoning for Rejection of the "Insurance Policy"**

  While the "Insurance Policy" argument is logically sound in the abstract, it is flawed in practice for three reasons:

  1.  **The Burden on the Monarch:** Placing the responsibility to stop a tyranny on a hereditary monarch forces them into a deeply political role. If they refuse assent, they risk civil unrest or removal. If they sign, they enable tyranny. This places an unfair and destabilizing burden on an individual who lacks a democratic mandate to make such a judgment.
  2.  **Institutional Alternatives:** In modern Westminster systems, the courts have developed robust powers of judicial review, and the civil service operates under strict codes of legality. These institutions are better equipped to identify and resist unconstitutional overreach than a single individual.
  3.  **The Risk of Misuse:** The likelihood of a monarch refusing assent for partisan reasons (claiming it is a "constitutional emergency" when it is not) is higher than the likelihood of a government successfully legislating the end of democracy without triggering resistance from the courts, the military, or the populace.

  **Conclusion**

  The proposed statute modernizes our constitution by aligning legal reality with political practice. It follows the successful Scandinavian and Japanese examples in removing discretionary power from the head of state, thereby insulating the monarchy from political controversy.

  While the "Insurance Policy" argument for the status quo is serious, it relies on a scenario where all other democratic institutions have failed. We should not design our daily constitutional operations for a catastrophe that is best prevented by a robust citizenry and independent judiciary. Retaining the ambiguity of the reserve power undermines the democratic legitimacy of every law passed.

  **The Committee should vote to adopt the statutory duty to assent.**
