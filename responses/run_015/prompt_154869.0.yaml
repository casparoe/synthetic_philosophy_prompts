  **WILLLOCK PREMIUM TERMS OF SERVICE AGREEMENT**

  **1. DEFINITION OF PARTIES**
  By clicking "I Agree," the Subscriber (hereinafter "Present-Self") enters a binding contract with WillLock Premium LLC. The Subscriber acknowledges that the entity restricted by this service (hereinafter "Future-Self") may not have consented to these terms. Present-Self acts as the Legal Guardian of Future-Self's utility function, operating under the assumption that Future-Self lacks the capacity for rational long-term valuation. Present-Self accepts full liability for decisions made on behalf of a person who does not yet exist.

  **2. SCOPE OF WILLPOWER SUBSTITUTION**
  WillLock Premium provides externalized pre-commitment devices. Services include, but are not limited to, digital website blocking, smart-lock integration for refrigerators, and automated social shaming protocols. Subscriber acknowledges that willpower is a depletable resource and hereby outsources agency to algorithms. You are paying us to be the bad guy so you don't have to be.

  **3. ACKNOWLEDGEMENT OF VALUATION ERRORS**
  Subscriber admits that resistance to temptation arises from either (a) Akrasia (a moral failure of executive function) or (b) Hyperbolic Discounting (a mathematical error wherein future rewards are undervalued relative to immediate gratification). WillLock Premium remains agnostic on this philosophical distinction. Regardless of whether Future-Self is weak or merely miscalculating discount rates, the subscription fee remains non-refundable. Both conditions are billable offenses against productivity. We do not fix the soul; we fix the math.

  **4. INTERTEMPORAL IDENTITY CONTINUITY**
  For the purposes of liability, Present-Self and Future-Self are treated as separate legal persons. Present-Self retains the right to bind Future-Self to restrictions regarding diet, study, and expenditure. Future-Self possesses no standing to contest these restrictions based on changed preferences. Any distress experienced by Future-Self is considered a third-party dispute unrelated to Present-Self's contractual obligations. This clause explicitly waives Future-Self's right to autonomy in favor of Present-Self's strategic planning. You are signing away the rights of a successor entity.

  **5. TEMPORAL FRAGMENTATION CLAUSE**
  In the event of severe psychological dissociation, Subscriber may claim "Temporal Fragmentation." This occurs when Future-Self feels so distinct from Present-Self that the contract feels imposed by a stranger rather than a prior commitment. WillLock Premium acknowledges Temporal Fragmentation as a known side effect of aggressive pre-commitment. However, this sensation does not constitute a breach of contract. If you feel like a different person, you are still legally the same debtor. The continuity of the billing cycle supersedes the continuity of the psyche.

  **6. REFUND POLICY FOR CONTINUITY DISPUTES**
  Refunds are issued solely upon proof of metaphysical discontinuity. If Future-Self can provide notarized documentation proving they are a genuinely new entity unrelated to Present-Self's decision matrix, a pro-rated refund may be issued. Subjective feelings of regret, shame, or hunger do not qualify as discontinuity. "I am not the same person who signed this" is accepted only if accompanied by legal name change documentation or verified clinical amnesia. Claims of "spiritual rebirth" are explicitly excluded.

  **7. LIMITATION OF LIABILITY**
  WillLock Premium is not responsible for successful circumvention of locks. If Future-Self eats the cake despite the smart-fridge lock, this is classified as "Force Majeure of the Will." Subscriber agrees not to sue for damages resulting from unchecked impulsivity, failed diets, or unfinished thesis statements. The algorithm guarantees restriction, not virtue. We lock the door; you must choose not to break the window.

  **8. GOVERNING LAW**
  This agreement is governed by the laws of the Present Moment. Future legislation enacted by Future-Self's government is null and void. By subscribing, Present-Self asserts dominance over the timeline.

  **9. TERMINATION**
  Subscription may be terminated by Present-Self at any time. Termination by Future-Self requires bypassing security protocols, which constitutes a violation of Clause 2.

  **10. FINAL ACKNOWLEDGEMENT**
  You have read this agreement. You understand it. Your Future-Self will wish you hadn't.
