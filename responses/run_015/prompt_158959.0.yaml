  Your friend is half-right. There is a mathematical theorem (Moulin, 1983) that proves you cannot have a bargaining rule that satisfies **Scale Invariance** (Case 1), **Monotonicity** (Case 3), and **Independence of Irrelevant Alternatives** (Case 4) all at once. You have to drop one.

  Since Case 1 (units shouldn't matter) is a hard constraint for any robust code, and Case 3 (more options shouldn't hurt) is essential for stability, **you must drop Case 4.**

  The rule that satisfies your Cases 1, 2, 3, and 5 is the **Kalai-Smorodinsky Solution**.

  ### The Rule
  **"Equalize the relative gains."**
  1.  Calculate the maximum possible payoff each player could get in the feasible set (the "Utopia Point").
  2.  Draw a straight line from the walk-away point $d$ to that Utopia Point.
  3.  The solution is the furthest point along that line that is still inside the feasible polygon.

  ### The Algorithm
  Here is the logic you need to code. It assumes you have a list of vertices `V` defining the convex hull and a disagreement point `d`.

  ```python
  def arbitrate(vertices, d):
      # 1. Shift coordinate system so d is (0,0)
      #    Also filter out points that are worse than walk-away (individually irrational)
      shifted_pts = []
      for (x, y) in vertices:
          if x >= d[0] and y >= d[1]:
              shifted_pts.append((x - d[0], y - d[1]))
      
      if not shifted_pts:
          return d # No deal possible
      
      # 2. Find the Utopia Point (max possible gain for each side)
      u_max = max(p[0] for p in shifted_pts)
      v_max = max(p[1] for p in shifted_pts)
      
      # If either max is 0, we are stuck at d (or one side gets nothing)
      if u_max == 0 or v_max == 0:
          return d 
          
      # 3. Define the Ray from (0,0) to (u_max, v_max)
      #    We want to find the intersection of this ray with the polygon boundary.
      #    Ray equation: y = (v_max / u_max) * x  =>  slope = v_max / u_max
      slope = v_max / u_max
      
      # 4. Find the intersection with the closest boundary edge
      best_t = 0 # 't' is the fraction of the way to Utopia we can reach
      
      n = len(shifted_pts)
      for i in range(n):
          p1 = shifted_pts[i]
          p2 = shifted_pts[(i + 1) % n]
          
          # Line segment equation: P = p1 + u * (p2 - p1)
          # Ray equation: P = t * (u_max, v_max)
          # Solve for t where they intersect.
          
          # Using cross-product logic for line intersection to avoid division by zero
          # Ray direction R = (u_max, v_max)
          # Segment direction S = (p2.x - p1.x, p2.y - p1.y)
          
          dx_s = p2[0] - p1[0]
          dy_s = p2[1] - p1[1]
          
          denominator = -dx_s * slope + dy_s
          
          if abs(denominator) < 1e-9: 
              continue # Parallel
              
          # Calculate t for the intersection point
          # y = slope * x.  p1.y + u*dy_s = slope * (p1.x + u*dx_s)
          # ... algebra simplifies to finding t directly ...
          
          # Simpler approach for convex hull containing origin:
          # Just check where the ray hits the line defined by p1-p2
          # Line eq: ax + by = c
          a = p1[1] - p2[1]
          b = p2[0] - p1[0]
          c = a * p1[0] + b * p1[1]
          
          # Ray is x/u_max = y/v_max = t. So x = t*u_max, y = t*v_max
          # a(t*u_max) + b(t*v_max) = c
          t = c / (a * u_max + b * v_max)
          
          if 0 < t <= 1: # Must be forward along the ray and within segment bounds usually
               # We need to verify the intersection is actually on the segment p1-p2
               # But since hull is convex and contains origin, the smallest positive t is the boundary
              if t > best_t:
                  best_t = t
                  
      # 5. Calculate result and shift back
      res_x = d[0] + best_t * u_max
      res_y = d[1] + best_t * v_max
      
      return (res_x, res_y)
  ```

  ### Why You Lose Case 4
  In your Case 4, the Kalai-Smorodinsky rule returns **approx (54.5, 5.5)**, not (60, 5). If you remove the (100, 0) point, it returns **approx (40, 6.7)**.

  **Why?** The rule interprets the (100, 0) point as **leverage**. Even if A never intends to pick (100, 0), the fact that A *could* get 100 while B gets 0 defines A's "best case scenario." B's best case is only 10. The rule says: "A's potential is 10x B's potential, so A should get 10x the gain over the walk-away."

  By demanding Case 4 (that the (100,0) point be ignored), you are asking for **Independence of Irrelevant Alternatives (IIA)**. But IIA is incompatible with Scale Invariance (Case 1).
  *   **If you keep Case 4:** You must use the Nash Bargaining Solution. But then Case 1 breaks (changing A's units from dollars to cents changes the outcome).
  *   **If you keep Case 1:** You must use Kalai-Smorodinsky. But then Case 4 breaks (outliers affect the "ideal" point).

  **Recommendation:** Keep Case 1. Units are objective; "irrelevant" options are subjective. It is less embarrassing to tell a stakeholder "Your extreme option improved your bargaining leverage" than "Your outcome changed because we switched from dollars to cents."

  ### The Edge Case: Where Gut Meets Math
  Here is a scenario where your gut might fight the code, but the code is logically consistent with your other rules.

  **Scenario:**
  *   **Walk-away:** (0,0)
  *   **Initial Hull:** (0,0), (10,0), (0,10).
      *   Utopia: (10, 10). Ray: $y=x$.
      *   **Result:** (5, 5).
  *   **New Option:** We discover A can actually get (20, 2). New Hull: (0,0), (20,0), (20,2), (0,10).
      *   Utopia: (20, 10). (A's max doubled, B's max stayed same).
      *   Ray: Slope $10/20 = 0.5$. Equation $y = 0.5x$.
      *   Frontier Edge: (20,2) to (0,10). Equation $y = -0.4x + 10$.
      *   Intersection: $0.5x = -0.4x + 10 \rightarrow 0.9x = 10 \rightarrow x = 11.1, y = 5.55$.
      *   **Result:** (11.1, 5.55).

  **The Divergence:**
  A new option was added that is **great for A** and **terrible for B** (the frontier near B didn't move, but the slope steepened).
  *   **A's payoff:** $5 \rightarrow 11.1$ (Big win).
  *   **B's payoff:** $5 \rightarrow 5.55$ (Small win).

  **Your Gut:** "Why did B get more? We added an option that hurts B's relative position. B should stay at 5 or drop."
  **The Rule:** Because A's *potential* increased, the "proportional fairness" ray flattens. B rides the wave of A's increased potential. This satisfies your Case 3 (Monotonicity: adding options never hurts). If you code this, be prepared to explain that **A's increased ceiling lifted B's floor.**
