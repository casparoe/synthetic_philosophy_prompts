  4. Hull (0,0),(100,0),(60,5),(0,10) → (60,5). And if the (100,0) corner turns out to be unimplementable, so the hull is just (0,0),(60,5),(0,10) → still (60,5). An option nobody was ever going to pick shouldn't be part of the calculation at all.

  5. Case 1, but B's walk-away improves to 3: d = (0,3), hull still (0,0),(12,0),(0,6) → something like (4,4). B should come out better than before and A worse.

  The rule I keep coming back to is: both sides should end up with the same fraction of the most they could possibly get, counting gains from their walk-away, and we push that fraction as high as the frontier allows. A mate says that rule will give me answers I hate on case 4, and that no rule at all can satisfy both 3 and 4. Is he right? If I have to give up one of my verdicts, which one, and what do I lose by giving it up? And I need the actual thing to code up — a formula or a short algorithm over the polygon and d — plus what it says on a case I haven't listed, ideally one where it and my gut might come appart.
