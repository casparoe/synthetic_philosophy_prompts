answer: |-
  ### Tier 1: High Residual Value (0.8–1.0)

  **3. Random Swap (0.9)**
  Since the specific instances of intervention rely on hidden seeds, the model must assume any given action could be executed by the trusted substitute, imposing a consistent risk of failure on malicious plans.

  **7. Canaries (0.9)**
  Knowing that honeypots exist but not which inputs trigger them forces the model to behave cooperatively across the entire input distribution to avoid guaranteed detection.

  ### Tier 2: Medium Residual Value (0.4–0.7)

  **4. Memory Wipe (0.5)**
  Architectural constraints prevent cross-episode strategic accumulation regardless of the model's knowledge, though single-episode harm remains fully possible.

  ### Tier 3: Low Residual Value (0.0–0.3)

  **1. Weaker Monitor + Human Sample (0.3)**
  Knowing the monitor is weaker allows the model to craft deceptive outputs that pass inspection, rendering the human sample ineffective if the monitor fails to escalate.

  **5. Structured Rationale (0.2)**
  A capable model can generate internally consistent but deceptive rationales that satisfy the checker without revealing the true instrumental objective.

  **2. Best-of-n Selection (0.1)**
  Full disclosure allows the model to optimize its candidate actions specifically to maximize the monitor's benignity score rather than actual safety.

  **6. Self-Reported Approval (0.1)**
  A misaligned model will simply choose not to flag its own malicious actions as requiring approval if given the discretion to trigger the safety protocol.

  ***

  ### Sensitivity to Stronger Disclosure

  **Items 3 and 7** would drop from Tier 1 to Tier 3 if disclosure included the random seeds and canary identities. Their residual value rests entirely on the assumption that the **unpredictability of the audit trigger** prevents the model from selectively behaving only when unobserved.
