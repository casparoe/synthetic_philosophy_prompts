answer: |-
  The mirror passage does not commit Plutarch to literal behavioral imitation but to a mechanism of moral habituation through intimate familiarity, which dissolves the conflict with the *Alexander* prologue by treating small signs as diagnostic windows into character states that the reader internalizes rather than acts they replicate.

  The "mirror" (*esoptron*) in this context functions not as a mold for stamping out identical actions, but as a tool for self-examination and calibration. When Plutarch says he endeavors to "fashion and adorn" (*kosmein*) his life, he implies an active process of arrangement and improvement rather than passive copying. This is confirmed by the "guest" metaphor: receiving the subject as a guest implies *synousia* (association or living together), a dynamic relationship where one absorbs the *ethos* of the other through proximity rather than mimicking their specific movements. The mechanism here is relational familiarity; by "associating" with the great dead, the reader's moral sensibilities are tuned to their frequency, making virtue feel like a natural environment rather than a imposed rule.

  The "repelling" passage clarifies this mechanism further as attentional management rather than behavioral scripting. Plutarch argues that keeping records of noble characters in the soul allows one to "turn thoughts away" from base suggestions. This suggests the moral work happens in the realm of imagination and desire, not just external action. The "noblest characters" serve as cognitive anchors that crowd out ignoble impulses. If the mechanism were simple imitation, a base suggestion would be countered by asking "What would X do?" but Plutarch describes it as turning thoughts *to* the fairest examples, implying that the presence of the noble image itself displaces the base one. The mechanism is displacement through admiration, not calculation through mimicry.

  This resolves the tension with the *Alexander* prologue's focus on "trifling acts" and "jesting." If the goal were behavioral imitation, unguarded moments would be useless or dangerous models, precisely because they are unchosen and context-specific. However, if the goal is diagnostic recognition of *hexis* (stable disposition), the small sign is superior to the battle because it is less obscured by the pressures of public performance. A jest reveals the underlying texture of the soul—its wit, its cruelty, its confidence—without the mask of duty. The reader does not copy the jest; they copy the *integrity* that made the jest noble rather than shameful. You imitate the state of character that produces the small sign, not the sign itself. Therefore, the small sign is the data point that reveals the virtue, and the mirror/association is the process by which that virtue is internalized.

  I must flag that this reading leans on a robustly realist interpretation of Plutarch's moral psychology, assuming he believes character is stable and transparent enough to be gleaned from anecdotes. Specialists like Christopher Pelling or Tim Duff might contest the degree of transparency Plutarch affords, arguing that he is often more skeptical about the knowability of virtue than the prologues admit, using the "small signs" rhetorically to construct character rather than merely revealing it. Additionally, reading the "mirror" as habituation rather than imitation relies on interpreting *kosmein* as ethical shaping rather than cosmetic adornment, a distinction some philologists might find too sharp. However, within the internal logic of the passages you cited, the habituation model is the only one that coherently links the diagnostic method of *Alexander* with the transformative goal of *Aemilius*.
