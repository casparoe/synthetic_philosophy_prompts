      *   *Temporal Combination:* Moments stacking over time.
      *   *Does it fix it?* No, it shifts the "Binding Problem" to the "Diachronic Identity Problem."
      *   *Narrative implication:* If consciousness is temporal stacking, the character is defined by memory and continuity. If the chain breaks, they cease to exist. This is great for themes of memory loss, trauma, or time travel.
