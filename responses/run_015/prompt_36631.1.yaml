  You're right that both cases hinge on logical dependence rather than causal leverage, but you're misidentifying the locus of control. In Counterfactual Mugging, the coin flip is exogenous; the world splits regardless of your algorithm, and your policy determines whether you capture value in the branch you didn't land in. In Blackmail, the letter's existence is endogenous; your policy determines whether you receive the blackmail demand at all. From the updateless perspective—before the coin flips or the letter arrives—the policy "Pay" yields positive expected value in the Mugging scenario but negative expected value in the Blackmail scenario. The difference isn't intuition; it's that in one case your algorithm controls a payout in a counterfactual world, while in the other it controls the existence of the problem itself.

  This isn't pattern-matching to good outcomes; it's optimizing the source code of your agent before it receives any inputs. If you write code that pays in Mugging, you win big on tails without losing much on heads. If you write code that pays in Blackmail, you incentivize the blackmailer to send the letter, guaranteeing a loss. My theory doesn't ask "what should I do given I see the letter?" it asks "what function should I be, such that when I see the letter (or don't), the outcome is maximized?" The math dictates paying in the first case and refusing in the second, not because of a gut check, but because those are the only two policies that maximize utility across the entire logical decision tree prior to observation.
