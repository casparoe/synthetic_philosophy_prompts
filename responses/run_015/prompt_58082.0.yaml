answer: |-
  **Project Title:** The Modal Structure of Longtermist Impact: Self-Sustaining Dynamics vs. Maintenance-Dependent Stewardship

  **Central Research Question**
  How does the modal distinction between self-sustaining causal trajectories and maintenance-dependent stewardship obligations alter the epistemic requirements and normative force of strong longtermist interventions?

  **Project Overview and Philosophical Context**
  Contemporary debates in longtermist ethics have largely stagnated around a familiar triad: the maximization of expected value over vast time horizons, the epistemic obstacle of "cluelessness" regarding distant consequences, and the normative anxiety regarding fanaticism or risk-sensitivity. Standard defenses of strong longtermism argue that the sheer magnitude of the future outweighs epistemic uncertainty. Critiques counter that without reliable causal knowledge, expected value calculations are vacuous or vulnerable to manipulation. Both sides, however, operate with a monolithic conception of "influencing the future." They treat the causal chain connecting a present act to a distant outcome as a uniform substrate, differing only in length and probability.

  This project posits that this uniformity assumption is a category error. There is a fundamental structural difference between interventions that establish a self-sustaining dynamic—such as encoding values into a resilient biological or technological substrate that persists without further agency—and those that rely on maintenance-dependent stewardship, such as cultural institutions or moral traditions that require continuous reinterpretation and recommitment across generations. The former resembles launching a probe; the latter resembles tending a garden.

  Current frameworks leave the central question unresolved because they fail to disaggregate these modes of persistence. The cluelessness objection applies differently to each: self-sustaining interventions may suffer from high uncertainty regarding initial conditions but low uncertainty regarding continuity, whereas maintenance-dependent interventions face low initial uncertainty but compounding uncertainty regarding the stability of the stewardship chain. Similarly, the fanaticism worry shifts; locking in values via self-sustaining dynamics risks permanent moral error (value lock-in), while maintenance-dependent approaches risk value erosion or drift. By conflating these structures, existing literature obscures the specific epistemic and normative profiles of different longtermist strategies. This project seeks to disentangle them to determine if one mode offers a more defensible pathway for strong longtermism.

  **Investigative Strategy**
  The research will proceed via non-empirical conceptual analysis and normative modeling over three distinct stages, designed to fit the nine-month fellowship period.

  *Stage 1: Conceptual Taxonomy and Case Reconstruction (Months 1–3)*
  The first stage will focus on rigorously defining the distinction between self-sustaining and maintenance-dependent persistence. I will construct a taxonomy of longtermist interventions, mapping paradigm cases onto these categories. For example, geoengineering for climate stability might be analyzed as a maintenance-dependent project requiring continuous governance, whereas germline editing for moral enhancement might be modeled as a self-sustaining biological trajectory. The goal is not to settle the empirical feasibility of these technologies but to isolate their *modal structure*—specifically, the conditions under which the causal link to the future breaks. I will produce a working paper delineating the necessary and sufficient conditions for a causal dynamic to be classified as "self-sustaining" in a morally relevant sense, distinguishing mere physical durability from normative persistence.

  *Stage 2: Epistemic Burden Analysis (Months 4–6)*
  The second stage will apply the taxonomy to the epistemic problem of cluelessness. I will analyze whether the epistemic burden of proof differs between the two modes. The working hypothesis is that self-sustaining interventions shift the epistemic burden to the present (requiring high confidence in the initial design), while maintenance-dependent interventions shift the burden to the future (requiring confidence in the reliability of successors). I will reconstruct standard arguments regarding epistemic discounting and test them against this distinction. This involves argumentative modeling: if we accept a specific theory of evidence (e.g., subjectivist Bayesianism), does the justification for action change when the causal mechanism is switched from stewardship to lock-in? This stage will result in a draft article arguing that cluelessness is not a uniform barrier but a variable function of persistence modality.

  *Stage 3: Normative Synthesis and Risk Re-evaluation (Months 7–9)*
  The final stage will integrate the epistemic findings into a normative framework. I will assess how the distinction reshapes the fanaticism objection. If self-sustaining interventions carry higher risks of value lock-in, does this impose a deontological constraint on their pursuit, regardless of expected value? Conversely, does the fragility of maintenance-dependent stewardship require a consequentialist imperative to build redundancy? The aim is to formulate a "Modal Principle of Longtermist Action" that prescribes which types of interventions are permissible under conditions of deep uncertainty. The fellowship will conclude with a complete manuscript draft synthesizing these findings.

  **Criteria for an Illuminating Outcome**
  A merely negative or inconclusive outcome would consist of demonstrating that the distinction is morally irrelevant—that both modes ultimately collapse into the same epistemic vulnerabilities under scrutiny. While philosophically significant, this would not advance the practical guidance of longtermist ethics.

  An illuminating outcome, by contrast, will demonstrate that the distinction is *action-guiding*. Success looks like a framework where certain classes of longtermist action are vindicated not despite uncertainty, but because their modal structure mitigates specific forms of that uncertainty. For instance, proving that maintenance-dependent stewardship is the only normatively permissible form of longtermism because it preserves the capacity for moral correction would be a substantive positive result. Alternatively, showing that self-sustaining interventions are the only epistemically viable path because they bypass the fragility of human institutions would equally constitute success. The key metric is whether the project yields a new criterion for evaluating longtermist portfolios that is invisible to standard expected-value reasoning.

  **Scope Assessment and Feasibility**
  The scope of this inquiry is ambitious for a nine-month period. The primary risk lies in the metaphysical depth of "causal persistence." It is tempting to drift into a general metaphysics of causation or social ontology, which would exceed the timeframe and dilute the ethical focus. To remain realistic, the project must strictly bracket the metaphysical *truth* of these causal structures and focus on their *moral implications* given our best current models.

  Furthermore, the distinction may prove too binary. Real-world interventions likely exist on a spectrum between pure lock-in and pure stewardship. If the taxonomy in Stage 1 reveals that the categories are not mutually exclusive, the scope will need narrowing. In that event, I will focus exclusively on "institutional" vs. "technological" persistence as a proxy for the broader distinction. This narrowing would sacrifice some generality but ensure a tractable argument.

  There is also a risk that the epistemic analysis in Stage 2 becomes overly technical regarding formal epistemology. Given the fellowship's focus on moral philosophy, I will prioritize normative implications over formal modeling, using epistemic arguments only insofar as they drive ethical conclusions. Finally, the project assumes that "strong longtermism" is the object of critique. If the analysis suggests that neither mode supports strong longtermism, the project must be flexible enough to argue for a retreat to "moderate" longtermism without losing its central thread. By maintaining a tight focus on the interaction between modal structure and normative justification, rather than attempting to solve cluelessness or fanaticism independently, the project remains within a realistic scope for a single fellow while offering the potential for high-impact contribution to the field.
