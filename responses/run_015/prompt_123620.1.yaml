  5.  **Refining the Physics for the Punchline:**
      The key insight for the knowledgeable reader is that *information is physical*. If you can't erase, you must store. Storing $N$ bits requires a physical system with $2^N$ states (or $N$ two-state systems). As $N \to \infty$, the physical resource requirement diverges. The "Audit" forces the information to remain *correlated* with the environment rather than being thermalized via erasure. But the sheer volume of correlated states effectively removes those degrees of freedom from the heat bath, acting as an entropy sink that eventually saturates.
