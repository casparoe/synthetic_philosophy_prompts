      *   *Szilard/Landauer/Bennett:* The demon measures particles (gains info) and must reset its memory to continue. Resetting (erasing) information dissipates heat ($kT \ln 2$ per bit). This restores the 2nd Law.
      *   *Reversible Computing:* If the computation is logically reversible (no information loss), you don't *have* to erase bits during the operation. You can theoretically compute with arbitrarily low energy dissipation.
      *   *The Catch:* You still need to store the intermediate states or the history if you want to reverse it. If you never erase, your memory fills up.
      *   *The Joke's Scenario:* The Demon goes reversible to dodge Landauer. The TAB says "You can't erase anything; you must keep a log."
      *   *The Consequence:* The memory register grows infinitely. Physical memory requires matter/energy. An infinite memory register implies infinite mass/entropy eventually, or at least a practical halt. The "cost" shifts from *erasure heat* to *storage expansion entropy*.

  3.  **Drafting - Attempt 1 (Mental Outline):**
      Maxwell's Demon gets smart. He uses reversible gates. No more $kT \ln 2$ heat! He tells the universe "I win." Then the Thermodynamic Audit Bureau shows up. They say "You need to keep a log of every particle." Demon says "But I'm reversible!" TAB says "Exactly, so you can't delete the log." Now the Demon has a hard drive the size of the universe. The entropy is in the hard drive.

      *Critique 1:* Too dry. Needs more dialogue and specific physics references. Needs to emphasize *why* the storage growth is the entropic killer.

