      *Refining for maximum "nerd laugh":*
      Need to mention Bennett. Need to mention the specific cost.
      The punchline should be that the *ledger* becomes the demon's graveyard.

      *Wait, one nuance:* In reversible computing, you don't *have* to dissipate heat to store bits, provided you don't erase them. But if the storage medium itself must grow physically, the *construction* or *expansion* of that medium costs entropy. I will lean into the "physical storage expansion" aspect requested.

