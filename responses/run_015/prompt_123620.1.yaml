answer: |-
  Maxwell's Demon stood proudly by the partition, gesturing to his new control rig. "It's fully reversible," he told the visiting Thermodynamic Auditor. "Toffoli gates, adiabatic clocking, ballistic switching. I measure the particle velocity, I open the gate, and I never reset the bit. Landauer's limit is $kT \ln 2$ per erasure, but since I erase *nothing*, I dissipate *zero* heat. The Second Law is officially optional."

  The Auditor didn't look up from his clipboard. "Bureau Regulation 88-B: All measurement histories must be preserved in an immutable, append-only ledger for compliance tracking. No overwriting. No deletion."

  The Demon's wings drooped. "But... if I can't overwrite, my memory register length $N$ grows linearly with time. To store the history physically, I have to keep adding new memory cells to the system."

  "Precisely," said the Auditor, ticking a box. "And since information is physical, each new cell requires a distinct region of phase space to maintain orthogonality against thermal noise. As your ledger expands to infinity, the physical volume required to store the distinct states of your history diverges."

  "So you're saying..." the Demon stammered, watching his memory tape snake out and displace the gas molecules, "that I'm not generating entropy through *erasure* heat anymore?"

  "No," said the Auditor, closing his briefcase. "You're generating it through *storage bloat*. The thermodynamic footprint of your ever-expanding ledger crowds out the available microstates of the gas faster than you can sort them. You didn't beat the Second Law; you just switched from a heat debt to a spatial debt."

  The Demon sighed, watching his reversible computer fill the chamber. "So I'm stuck with the entropy either way?"

  "Entropy always balances the books," the Auditor said, heading for the exit. "You just changed the currency from joules to cubic meters."
