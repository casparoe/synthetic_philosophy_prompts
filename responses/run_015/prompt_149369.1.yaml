answer: |-
  This is a sophisticated observation that cuts to the core of critical international legal theory. You are describing a phenomenon where the *performative force* of a legal category (its ability to trigger obligations) retroactively determines its *descriptive application* (whether the facts are deemed to fit the category).

  To answer your primary question directly: **There is no single, canonical term** in the sociology of international law or critical genocide studies that captures this dynamic with the precision you require. However, your observation synthesizes several existing critical frameworks. The closest established concepts are **"Organized Hypocrisy"** (Stephen Krasner), **"Hierarchies of Victimhood"** (Judith Butler), and the **"Standard of Civilization"** critique within **Third World Approaches to International Law (TWAIL)**.

  However, these terms often imply agent-level intent (hypocrisy) or media dynamics (victimhood), whereas you are identifying a *systemic, structural feature* of the legal architecture itself. To distinguish this from mere strategic hypocrisy, I propose conceptualizing this as **"Constitutive Categorical Asymmetry"** or **"Juridical Immunization."**

  Below is a delineation of the existing landscape, a proposal for precise terminology, and the boundary cases you requested.

  ---

  ### 1. Existing Conceptual Proxies
  While no single term exists, three frameworks approximate your observation:

  *   **Organized Hypocrisy (Stephen Krasner):** Krasner argued that international organizations survive by decoupling rhetoric from practice. States pay lip service to norms (like genocide prevention) to maintain legitimacy while violating them when necessary.
      *   *Limitation:* This suggests the norm is genuine but ignored. Your observation suggests the *definition itself* is malleable to protect the system.
  *   **TWAIL & The Standard of Civilization:** Scholars like Robert Knox and Ntina Tzouvala argue that international law historically distinguishes between "civilized" (sovereign, integrated) and "uncivilized" (pariah, failed) states. Legal categories apply strictly to the latter to discipline them, while the former enjoy "sovereign privilege."
      *   *Fit:* This aligns closely with your "insider/outsider" dynamic.
  *   **The Hierarchy of Grief/Victimhood (Judith Butler):** This sociological concept posits that some lives are deemed "grievable" and others not. When a state is integrated into the Western liberal order, its victims are often framed as "collateral damage" rather than subjects of genocide.
      *   *Fit:* Explains the moral asymmetry, but less focused on the *juridical* mechanism of naming.

  ### 2. Proposed Conceptual Delineation: "Juridical Immunization"
  To distinguish your observation from "strategic hypocrisy," we must shift from *moral failure* to *systemic function*.

  **Strategic Hypocrisy** implies:
  *   **Premise:** The category "genocide" has a fixed, objective meaning.
  *   **Action:** Actors knowingly withhold the label for political gain.
  *   **Normative Status:** This is a corruption of the system.

  **Juridical Immunization (Your Dynamic)** implies:
  *   **Premise:** The category "genocide" is inherently unstable and politically constitutive.
  *   **Action:** The system *requires* the label to remain reserved for "outliers" to maintain the legitimacy of the "core." If applied reflexively to integrated states, the category would trigger obligations (intervention, sanctions) that would destabilize the international order itself.
  *   **Normative Status:** This is a *feature* of the system, ensuring its survival. The law "immunizes" functioning sovereigns against the most destructive legal labels.

  **Why "Immunization"?**
  Drawing on Roberto Esposito's biopolitical theory, a community protects itself by incorporating the "safe" and excluding the "threat." In international law, the "genocide" label is a pathogen. If it infects a core member, the host (the international order) risks autoimmune collapse. Therefore, the diagnostic criteria are structurally adjusted to ensure the pathogen is only identified in hosts that can be sacrificed (pariah states).

  ### 3. Boundary Cases for Delineation
  To test whether a specific instance is "Hypocrisy" or "Structural Immunization," apply the following matrix:

  | Feature | Strategic Hypocrisy | Juridical Immunization (Structural Asymmetry) |
  | :--- | :--- | :--- |
  | **Evidentiary Threshold** | Evidence is acknowledged internally but suppressed publicly. | Evidentiary standards are subtly raised (e.g., requiring "specific intent" proof that is epistemologically impossible to gather in real-time). |
  | **Alternative Framing** | No alternative is offered; silence is preferred. | Active production of *alternative legal categories* (e.g., "Counter-terrorism," "Civil War," "Internal Security"). |
  | **Institutional Behavior** | Ad hoc delays or vetoes. | Systemic reliance on procedural hurdles (e.g., complementarity principles, jurisdictional standing). |
  | **Outcome** | Label is eventually applied after political cost subsides. | Label is permanently foreclosed; the event is archived under a different legal taxonomy. |

  #### Case A: Sudan (Darfur) — *Fits Immunization*
  *   **Status:** Collapsed/Pariah state.
  *   **Naming:** Rapid consensus on "genocide" (US Congress, 2004).
  *   **Mechanism:** Low cost to the international system. Naming activates obligations that are easily performed via remote diplomacy or limited AU/UN peacekeeping without threatening core state interests.
  *   **Verdict:** The category functions as intended: disciplining the outlier.

  #### Case B: Sri Lanka (Tamil Eelam) — *Fits Immunization*
  *   **Status:** Functioning, integrated member (Commonwealth, non-aligned but trade-integrated).
  *   **Naming:** Despite UN Panel of Experts reports citing "credible allegations" of mass atrocities comparable to genocide, the category was systematically avoided.
  *   **Mechanism:** Framed as "counter-terrorism" (vs. LTTE). The "intent" requirement was weaponized to demand proof of a state plan to destroy the group *as such*, rather than destruction as a byproduct of military victory.
  *   **Verdict:** Structural asymmetry. The legal taxonomy shifted to "war crimes" or "human rights violations" to avoid the *erga omnes* obligations of genocide.

  #### Case C: Rwanda (1994) — *Fits Hypocrisy (mostly)*
  *   **Status:** Weak state, but the failure was primarily Western inaction.
  *   **Naming:** The US famously avoided the "G-word" *during* the event to avoid R2P obligations (before R2P was formalized), then adopted it *after*.
  *   **Distinction:** This is closer to classic hypocrisy (knowing avoidance). However, the *post-hoc* naming reinforced the "failed state" narrative, fitting the immunization model for the *afterlife* of the category.

  #### Case D: Ukraine (2022–Present) — *The Stress Test*
  *   **Status:** Integrated aspirant (West-aligned), aggressor is a major power (Russia).
  *   **Naming:** Rapid adoption of "genocide" by Western legislatures regarding Russian actions.
  *   **Analysis:** This complicates the theory. It suggests the asymmetry is not just "Integrated vs. Pariah" but "Aligned vs. Adversarial."
  *   **Refinement:** This supports the **TWAIL** critique: International law remains a tool of geopolitical alignment. Russia, despite being a P5 member, was successfully cast as a "pariah" in this context. The *immunization* holds for the *accusers* (NATO states), who shield their own historical or concurrent actions (e.g., Gaza, Iraq) via the "counter-terrorism" or "self-defense" exceptions.

  ### 4. Recommended Terminology for Your Work
  If you are coining or refining a term for this specific dynamic, I recommend **"Constitutive Categorical Asymmetry."**

  *   **Constitutive:** It creates the political reality (insider vs. outsider) rather than just describing it.
  *   **Categorical:** It operates through the legal taxonomy itself (genocide vs. civil war).
  *   **Asymmetry:** It acknowledges the differential application is not random but directional.

  Alternatively, **"Juridical Sovereignty Shield"** captures the protective function.

  ### 5. Key Scholars to Engage
  To ground this in existing literature, you should engage with:
  *   **A. Dirk Moses:** Specifically his work on the "Genocide Question" and how the UN Convention was designed to exclude colonial violence.
  *   **Samuel Moyn:** On how human rights law accommodates neoliberal sovereignty.
  *   **Robert Knox:** On "Civilizing International Law" and how legal categories differentiate between civilized and uncivilized violence.
  *   **Ntina Tzouvala:** On "Capitalism as Civilization" and the structural biases of international legal argumentation.
  *   **David Scheffer:** Former US Ambassador-at-Large for War Crimes Issues; his memoirs (*All the Missing Souls*) offer the insider view of the "calculus of naming."

  ### Summary
  You are correct that this is not merely hypocrisy. Hypocrisy admits the rule but breaks it. Your dynamic suggests the rule is *interpreted* differently based on the subject's position in the international hierarchy. The term **"Juridical Immunization"** best captures the systemic self-preservation mechanism you have identified, distinguishing it from the agential moral failure of hypocrisy.
