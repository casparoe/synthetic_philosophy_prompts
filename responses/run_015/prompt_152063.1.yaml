answer: |-
  Teach the pragmatic account before the semantic account.

  **Pre-Embedding Prerequisites**
  Before you run the embedding test (negation, conditionals, attitude reports), two distinctions must be locked in using neutral vocabulary:
  1.  **Reference vs. Descriptive Content:** Use a Frege-style case (e.g., "Morning Star" vs. "Evening Star") to prove two terms can pick out the same object but differ in meaning. If they believe meaning = reference, the slur debate is unintelligible.
  2.  **Truth-Conditions vs. Force:** Establish that truth-conditions concern *how the world must be* for a sentence to be true, while force concerns *what the speaker is doing* (warning, insulting, promising). Use a promise ("I promise to leave") vs. a prediction ("I will leave") to show speech acts can differ without truth-values changing.

  **Example Selection**
  Build the hour on one pair. Do not switch.
  *   **Must Have:** A clear neutral counterpart accepted by the institution (e.g., "Disabled"), an active in-group reclamation movement (e.g., "Crip"), and distinct out-group vs. in-group usage norms.
  *   **Must Lack:** High trauma potential (avoid racial slurs entirely) and a neutral counterpart that is itself politicized or heard as a slur by some students (avoid "Woman" vs. "Bitch").
  *   **Recommendation:** **"Crip" (slur/reclaimed) vs. "Disabled" (neutral).** It avoids the shifting neutral-status of "Queer" (which some now hear as neutral) and the extreme taboo of racial slurs.
  *   **Constraint:** Explicitly state at the outset that you are using the term *mentioning* the word to analyze its structure, not *using* it to derogate.

  **Lesson Flow & Misconception Defusal**
  1.  **Harm Agreement (0–5 mins):** State clearly that both semantic and pragmatic accounts agree the word causes harm. This defuses **'if it's not truth-conditional it's not really in the meaning'** (which they hear as excusing the word). Tell them: "Locating the harm differently does not lessen the harm."
  2.  **Reference/Content Prep (5–10 mins):** Run the neutral Frege case. Defuses **'same referent so same meaning'**.
  3.  **The Data (10–20 mins):** Present the embedding test using your chosen pair.
      *   "He is not a [Crip]." (Derogation survives negation).
      *   "If he is a [Crip], he is dangerous." (Derogation survives conditional).
      *   Ask: "Did the speaker endorse the derogation in these cases?" (Intuition: Yes).
  4.  **Pragmatic Account (20–30 mins):** Propose that derogation is what *using* the word does (force/implicature), not what it says.
      *   *Why here?* It matches their initial intuition (it's about attitude).
      *   *The Crack:* Show how embedding usually cancels implicatures ("It's warm in here" -> implicature "open window"; "It's not warm in here" -> implicature gone). But slur derogation survives.
      *   Defuses **'it's just speaker intent'**. Show that standard intent-based implicatures cancel under negation; this one doesn't.
  5.  **Semantic Account (30–40 mins):** Propose that derogation is part of the truth-conditional content (like "bachelor" includes "unmarried").
      *   *Why here?* It explains the embedding data (content survives negation).
      *   *The Crack:* Reclamation. If an in-group member says "I am a [Crip] proudly," the semantic account struggles to explain why the truth-conditions don't trigger the derogatory offense.
      *   Defuses **'offensive-but-not-derogatory vs. derogatory-but-not-taboo'**. Show that reclamation separates the word from the derogatory content, proving the content isn't fixed solely by the lexicon.
  6.  **Let Sit:** Allow **'if it's not truth-conditional it's not really in the meaning'** to sit for five minutes during the Pragmatic Account phase. Students need to feel the tension that "non-truth-conditional" might sound like "optional" before you show them conventional implicature is mandatory.

  **Board Question (End)**
  Write: *"The historian read the 1920s sign: 'No [Slur]s Allowed'."*
  Ask: *"Did the historian use the slur?"*
  *   **Semantic Account:** Yes. The word was uttered with its derogatory content intact.
  *   **Pragmatic Account:** No. The word was mentioned, not used to express the derogatory force.
  *   This forces them to see where the theories diverge on *mention* vs. *use* in reported speech.

  **Refusals & Status**
  *   **Refuse to Settle:** Do not decide whether the mechanism is *presupposition*, *conventional implicature*, or *truth-conditional content*. Tell them this is formal machinery they lack the tools to evaluate yet. Do not decide if reclamation *changes the semantics* or *overrides the pragmatics*.
  *   **Settled:** It is consensus that reference is identical to the neutral counterpart. It is consensus that derogation typically projects through negation and conditionals (unstandard conversational implicatures).
  *   **Live Disputes:** Whether the derogatory content is truth-conditional (semanticism) or non-truth-conditional (pragmatism/expressivism). Whether reclamation constitutes a meaning change or a contextual blocking of offense. Do not present your preferred account as the consensus; present it as the live option that handles the data you just showed.
