answer: |-
  Here is the argument, grounded in the idea of the "error-correction license."

  ***

  Look, first off, tell your sister congratulations. Being a new mom is exhausting, and if a TikTok got the baby to sleep, that's a win for tonight. But you're right to push back on the principle, not because she's dangerous right now, but because parenting is a long-term collaborative project, not a one-off trick.

  The core difference between *knowing* how to swaddle and *correctly believing* how to swaddle isn't about whether the blanket stays on today. It's about who holds the **error-correction license.**

  Here's how it works:

  **1. The License to Troubleshoot**
  When you *know* something, you understand the mechanism behind it. You know *why* the swaddle works (e.g., suppressing the Moro reflex without restricting hip development, ensuring airflow, preventing overheating). Because you understand the *why*, you possess a license to diagnose failure.

  If the baby starts escaping the swaddle or getting too hot, a knower can look at the situation and say, "The fabric is too slippery," or "You're wrapping the hips too straight." They have the authority to tweak the variables because they understand the causal link between the action and the outcome.

  Your sister, operating on a lucky true belief, only has the *what*. She knows "fold left, fold right, tuck." If that specific sequence fails because the baby is bigger, or the blanket is different, she has no license to troubleshoot. She can't correct the method because she doesn't know which part of the method is doing the heavy lifting. She's stuck repeating a ritual that has stopped working, with no authority to modify it.

  **2. Social Standing and Intervention**
  This is where the "license" becomes social. In a family, we constantly correct each other's parenting techniques. But we only accept correction from people who seem to understand the stakes.

  If you know the safety reasoning behind swaddling (hip dysplasia, SIDS risks), you have the standing to correct someone else—even a grandparent using outdated methods. You can say, "We don't wrap the legs straight anymore because it hurts their hip sockets." People listen because you are operating from a framework of understanding.

  If your sister tries to correct someone based on her TikTok luck, she has no standing. If she tells her mother-in-law, "Don't do it that way, do it my way," and the only justification is "It worked for me once," she has no error-correction license. She's just offering a preference. Knowledge grants you the entitlement to intervene in others' practices; true belief only grants you the entitlement to your own opinion.

  **3. The Intergenerational Relay**
  Parenting skills are passed down like a baton in a relay race. The problem with true belief is that it's a dead end in the chain.

  If your sister raises her kid based on lucky true beliefs, she cannot teach that kid *how* to parent. She can only show them *what* she did. If the context shifts for the next generation (new safety guidelines, different baby temperaments), her child has no underlying logic to adapt.

  Knowledge is transferable code; true belief is a screenshot.
  *   **Knowledge:** "Keep the chest firm but the hips loose." (This applies to any blanket, any size baby, any era).
  *   **True Belief:** "Fold the corner down to the belly button." (This fails if the blanket is a different size).

  When you pass knowledge down, you give the next generation the license to correct *you* if you're wrong. If your sister passes down a lucky belief, she demands obedience to a method she doesn't understand. She breaks the chain of improvement.

  **The Bottom Line**
  You aren't arguing that she's a bad mom because she got lucky. You're arguing that luck doesn't grant authority.

  In a high-stakes, long-term environment like raising a human, we need people who are licensed to fix things when they break. Knowledge buys you that license. It allows you to look at a failing situation, identify the broken variable, and correct it with authority. True belief leaves you helpless when the luck runs out, and it silences you when you try to help others avoid a mistake.

  Tell her: "I'm glad it worked. But if you want to be the person people listen to when things go wrong at 3 AM, you need to know *why* it worked, not just that it did."
