  1. The summary broken down
  Your roommate makes several distinct claims. First, he states the Löwenheim-Skolem theorem: consistent ZFC has a countable model. Second, he notes the internal/external cardinality discrepancy: sets uncountable inside are countable outside. Third, he explains this via missing bijections within the model. Fourth, he concludes this proves set theory contradicts itself regarding infinity. Fifth, he alleges mathematicians ignore this to preserve large cardinals. Finally, he suggests a "true" countable universe exists beyond formal logic, analogous to hidden variables. These claims mix technical results with philosophical interpretations.

  2. What's right in it
  The technical core is largely accurate. Skolem proved that if ZFC is consistent, it has a countable model (the Downward Löwenheim-Skolem theorem). Consequently, within such a model, there exists a set the model "believes" is uncountable (no bijection with naturals exists *inside*), yet externally, the domain is countable. His explanation that the model "misses the pairing functions" is correct; the bijection exists in the metatheory but not within the model's universe. This relativity of cardinality is the actual paradox. The description of the phenomenon is a standard, correct summary of the model-theoretic result.

  3. Where it goes wrong
  The critical error is claiming this proves a contradiction. It doesn't. Cardinality is relative to the model, not absolute. A set is uncountable *relative to a model* if no function *in that model* maps it to naturals. External countability doesn't invalidate internal uncountability. There is no logical inconsistency, only context-dependence. Furthermore, mathematicians do not ignore this; it is foundational knowledge in logic. They accept large cardinals because consistency proofs allow them, not because they deny Skolem. The paradox highlights limitations of first-order logic, not flaws in ZFC. His summary conflates "relative to a model" with "absolute truth," leading to the false conclusion that set theory is self-contradictory. It's a feature of formalization, not a bug. Accusing mathematicians of ignoring it for preference is unfair; they work within specific frameworks where "uncountable" has a precise, non-contradictory definition. The paradox resolves once you distinguish object language from metalanguage. No theorem is both proved and disproved; the confusion arises from mixing perspectives. Thus, the claim of ignored contradiction is factually incorrect regarding the community's understanding. Skolem himself viewed this as a critique of first-order logic's adequacy, not ZFC's consistency. Countability requires a function to exist within the system, not reality.

  4. The hidden-variable addition
  The hidden-variable analogy is philosophically interesting but not supported by Skolem's result. Skolem showed formal systems cannot capture absolute uncountability, but he didn't prove a "true" countable universe exists outside logic. This is a philosophical stance (Skolemism), not a theorem. Comparing it to quantum hidden variables is apt only insofar as both suggest realities beyond formal description. However, in set theory, there is no empirical data forcing this view. Most mathematicians adopt a realist view of sets without needing a "hidden" countable base. Skolem's result limits what first-order logic can express, not what exists. Therefore, while coherent as personal philosophy, it doesn't follow from the math. It is a metaphysical preference, not a logical necessity.

  5. Bottom line
  He is wrong about the contradiction. There is no inconsistency in ZFC revealed here, only a counterintuitive feature of first-order logic. Mathematicians aren't ignoring anything; they understand the distinction between internal and external cardinality. His summary captures the mechanism but fails on the implication. Skolem's Paradox is a resolved conceptual puzzle, not an open wound in foundations. The claim that mathematicians deny this to keep large cardinals is conspiracy thinking. It is a limitation of language, not truth.
