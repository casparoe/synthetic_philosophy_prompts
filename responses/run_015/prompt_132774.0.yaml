answer: |-
  Here are the desiderata for a computable norm of disagreement, structured as functional requirements for a software agent.

  ### Desiderata for a Norm of Disagreement

  **1. The Ideal Limit (Aumann Convergence)**
  *   **Definition:** In the limit where agents share a prior, have unbounded compute, and communicate posteriors until common knowledge is achieved, the rule must output identical credences.
  *   **Rationale:** If the rule fails here, it is provably irrational in the frictionless case, suggesting a structural flaw rather than a bounded approximation.
  *   **Status:** **Negotiable.** Enforcing exact Aumann convergence requires computing common knowledge, which is generally undecidable or intractable for bounded agents. A rule can be rational *for us* without satisfying the conditions of a theorem designed for gods.

  **2. The Coarse Case (Granularity Robustness)**
  *   **Definition:** The rule must accept inputs where the other agent's credence is not a precise float (e.g., "they disagree," "they would bet against me at 1:1," or a confidence interval).
  *   **Rationale:** Real-world disagreement rarely involves exchanging exact probabilities. A norm that crashes on non-numeric input is useless outside the lab.
  *   **Status:** **Non-Negotiable.**

  **3. The Expert Case (Asymmetric Weighting)**
  *   **Definition:** The rule must allow credence updates to be weighted by reliability metrics (evidence of bias, expertise, intoxication) derived from *external* data, not the disagreement itself. It must prevent an agent from assigning themselves higher weight solely because they are the agent.
  *   **Rationale:** Blind equal weighting (conciliatism) ignores evidence; blind steadfastness ignores social evidence. The rule must distinguish "I know they are wrong" from "I feel I am right."
  *   **Status:** **Non-Negotiable.**

  **4. Order-Independence (Commutativity)**
  *   **Definition:** Updating on Agent A's view then Agent B's view must yield the same posterior as B then A, holding the content of their views constant.
  *   **Rationale:** The evidential value of a peer's belief should not depend on the sequence in which you encountered them. Violation implies path-dependence in belief state, which invites manipulation.
  *   **Status:** **Non-Negotiable.**

  **5. Self-Consistency (Fixed-Point Stability)**
  *   **Definition:** If two agents both run this rule and know they are doing so, the iterative process of updating on each other's *updated* credences must converge to a stable fixed point (agreement) in finite steps, or the initial update must anticipate this equilibrium.
  *   **Rationale:** This is the core of the "agree to disagree" problem. If the rule generates oscillation or persistent divergence when mutually applied, it fails to model the social nature of the evidence.
  *   **Status:** **Non-Negotiable.**

  **6. Exploitability (Dutch Book Resistance)**
  *   **Definition:** Two agents following this rule cannot be jointly money-pumped by a third party who observes their disagreement and offers bets that each individually accepts but which guarantee a loss for the pair.
  *   **Rationale:** Persistent disagreement implies that at least one agent is mispricing probability relative to the available information (the other's belief). If the rule preserves this mispricing, it is economically irrational.
  *   **Status:** **Non-Negotiable.**

  **7. Tractability (Bounded Computation)**
  *   **Definition:** The update function must be computable in polynomial time relative to the number of agents and updates. It cannot require recursive modeling of the other agent's modeling of you beyond a fixed, small depth (e.g., Level-2 reasoning max).
  *   **Rationale:** You specified this is for a software agent. Infinite recursion to establish common knowledge is not an option.
  *   **Status:** **Non-Negotiable.**

  ***

  ### Joint Unsatisfiability

  **The Inconsistent Triad: {Ideal Limit, Tractability, Expert Case}**
  You cannot have all three.
  *   **Ideal Limit** requires common knowledge of posteriors.
  *   **Tractability** forbids the infinite recursion required to establish common knowledge.
  *   **Expert Case** introduces asymmetry (I weight me at 0.8, you weight you at 0.8).
  *   **Conflict:** In the Aumann ideal, asymmetry is washed out by common knowledge of rationality. In the bounded case, if we both apply asymmetric weights (Expert Case) without common knowledge (Tractability), we will not converge to the Ideal Limit. You must sacrifice the Ideal Limit to keep the rule implementable and sensitive to expertise.

  ***

  ### The Killer Constraint

  **Self-Consistency** knocks out the most candidate rules.

  *   **Steadfastness:** Fails immediately (divergence is guaranteed).
  *   **Simple Conciliationism (Equal Weight):** Fails if agents have asymmetric private evidence about reliability (violates Expert Case), but even if they don't, simple averaging often requires iteration to converge, which violates Tractability if not hardcoded as a fixed-point solver.
  *   **Weighted Averaging:** Fails hard. If I weight myself 0.7 and you weight yourself 0.7, we never meet. The rule does not account for the *other* person running the *same* weighting scheme on themselves.
  *   **Log-Ods Averaging:** Fails Self-Consistency for the same reason as weighted averaging unless the weights are common knowledge and normalized globally, which violates the privacy assumptions of the Expert Case.

  To satisfy Self-Consistency under Tractability, the rule cannot be a simple heuristic update; it must be a **contractive mapping** that explicitly calculates where the *other* agent will land given they are running the same function. This eliminates almost all standard philosophical norms, which are typically defined single-agentedly.
