answer: |-
  There is no single established term, but this is best coined as **Consistency Liability Asymmetry**, a normative manifestation of the **Problem of Logical Omniscience**.

  The **Problem of Logical Omniscience** is the standard epistemological observation that humans cannot possibly know all logical consequences of their beliefs due to cognitive limits. However, society applies different normative standards to this limitation depending on whether the domain operates on **constitutive** or **regulative** rules. In mathematics and programming, consistency is constitutive: a contradiction invalidates the system itself, so agents are held strictly liable for errors regardless of cognitive load because the truth-value of the entire structure depends on it. In politics and ethics, consistency is regulative: it is a virtue to strive for, but contradictions do not collapse the worldview because these systems are open, empirical, and **non-monotonic**, meaning new information can override old conclusions without breaking the framework. Consequently, the blame tracks not the mental effort required to trace the reasoning chain, but the structural role consistency plays in validating the domain; we demand omniscience where contradiction is fatal, and forgive bounded rationality where contradiction is merely a flaw.
