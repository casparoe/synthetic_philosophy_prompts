answer: |-
  # The Evidentiary Compass: A Diagnostic Tree for the Archaeology of Belief

  **To the Reader:**
  This instrument is not designed to tell you what *is* history, but to reveal what *you require* of history. It sorts positions not by academic affiliation, but by the thresholds of proof you apply to three canonical stress cases: the **Trojan War** (a site matching an epic), the **Arthurian Cycle** (a figure anchoring resistance), and the **Exodus** (a migration lacking material traces).

  Answer the following four nodes sequentially. Your path determines your historiographical position, its necessary commitments, and its blind spots.

  ---

  ## THE DECISION TREE

  ### NODE 1: The Material Threshold
  **Is physical correlation (stratigraphic destruction layers, settlement discontinuities, mass-burial patterns) a *necessary condition* for a legend to earn the status of history?**
  *   **YES:** You believe that without dirt, there is no data. (Proceed to Node 2)
  *   **NO:** You believe text, memory, or function can sustain historicity without material anchor. (Proceed to Node 4)

  ### NODE 2: The Silence Test
  **For those requiring physical correlation: Does archaeological silence (the absence of expected traces) function as *disconfirmation* (evidence of absence) or *neutral absence* (a gap in the record)?**
  *   **DISCONFIRMATION:** If we do not find it where it should be, it did not happen at the claimed scale. (Proceed to Node 3A)
  *   **NEUTRAL ABSENCE:** Absence of evidence is not evidence of absence; preservation is patchy. (Proceed to Node 3B)

  ### NODE 3A: The Kernel (Following "Disconfirmation")
  **If silence disconfirms the grand narrative, can a "historical kernel" (a small event, a local skirmish, a single leader) still be recovered without identifiable protagonists?**
  *   **YES:** A small truth lies beneath the myth, even if the scale is reduced. → **LEAF: MINIMALIST**
  *   **NO:** The narrative is a construct; no historical event anchors it. → **LEAF: MYTHICIST**

  ### NODE 3B: The Agent (Following "Neutral Absence")
  **If silence is neutral, must *heroic singularity* (a specific Achilles, Arthur, or Moses) be recoverable to validate the event, or is collective action sufficient?**
  *   **HEROIC SINGULARITY:** The story names a king; history must find a man. (Proceed to Node 5)
  *   **COLLECTIVE ACTION:** The story names a king; history finds a polity or migration. → **LEAF: KERNEL-HISTORIAN**

  ### NODE 4: The Function (Following "No Physical Correlation")
  **If physical correlation is not necessary, is the narrative primarily a record of fact preserved orally, or a tool of social cohesion?**
  *   **RECORD OF FACT:** It claims to be history; we treat it as such, relying on textual genealogy. → **LEAF: UNNAMED (Textualist)**
  *   **TOOL OF COHESION:** Its truth value is secondary to its utility in binding a group. → **LEAF: NARRATIVE-FUNCTIONAL**

  ### NODE 5: The Scale (Following "Heroic Singularity")
  **Does the scale and social form of the claimed event (city-state siege vs. population displacement) alter the burden of proof *in kind* rather than merely in degree?**
  *   **NO:** A king is a king; a war is a war. The standard of proof is uniform. → **LEAF: MAXIMALIST**
  *   **YES:** A migration leaves different traces than a siege; context dictates proof. → **LEAF: UNNAMED (Cautious Maximalist)**

  ---

  ## THE LEAVES: Positions and Awkward Commitments

  ### 1. MAXIMALIST
  *   **Path:** Phys Corr (Yes) → Silence (Neutral) → Hero (Yes) → Scale (Uniform)
  *   **Core Commitment:** The epic tradition preserves the core of historical reality; archaeology should expect to find the poem in the dirt.
  *   **Most Awkward Commitment:** You must explain away supernatural or anachronistic elements in the text (e.g., Homeric gods, Arthurian magic) as poetic embellishment without archaeological evidence that the *naturalistic* core exists, effectively trusting the poet's geography more than the poet's cosmology.

  ### 2. MINIMALIST
  *   **Path:** Phys Corr (Yes) → Silence (Disconfirm) → Kernel (Yes)
  *   **Core Commitment:** Major cultural shifts require material traces; if the Exodus or Arthurian battles leave no strata, the scale is reduced to a local skirmish or diplomatic shift.
  *   **Most Awkward Commitment:** You must accept that "history" can occur without names or clear causality. You posit a "kernel" of truth (e.g., a small Semitic group left Egypt) that is, by your own definition, archaeologically invisible, risking the same faith you accuse Maximalists of holding.

  ### 3. MYTHICIST
  *   **Path:** Phys Corr (Yes) → Silence (Disconfirm) → Kernel (No)
  *   **Core Commitment:** The narrative is a literary or theological construct; the absence of evidence is evidence that the story was never intended as history.
  *   **Most Awkward Commitment:** You must explain the psychological and sociological mechanism by which a total fiction convinces a population to adopt it as ancestral history without *any* triggering event (e.g., why invent an Exodus if no group ever left Egypt?).

  ### 4. KERNEL-HISTORIAN
  *   **Path:** Phys Corr (Yes) → Silence (Neutral) → Hero (No)
  *   **Core Commitment:** The event happened (Troy was sacked, a migration occurred), but the protagonists are later aggregations of collective memory.
  *   **Most Awkward Commitment:** You must admit that the "kernel" is theoretically unrecoverable. If you strip away the hero and the scale, you are left with a historical event that looks identical to the Mythicist's "nothing," differentiated only by your optimism about preservation.

  ### 5. NARRATIVE-FUNCTIONAL
  *   **Path:** Phys Corr (No) → Function (Cohesion)
  *   **Core Commitment:** The truth of the story lies in its reception and utility, not its correspondence to material reality.
  *   **Most Awkward Commitment:** You must concede that "history" is the wrong category entirely. This renders your position immune to archaeological disproof but also irrelevant to the question of whether the event *actually occurred*.

  ### 6. UNNAMED (Textualist)
  *   **Path:** Phys Corr (No) → Function (Record)
  *   **Core Commitment:** Textual transmission can preserve history independently of archaeology (e.g., philological reconstruction).
  *   **Most Awkward Commitment:** You must defend the reliability of oral transmission over centuries without material check-points, effectively arguing that memory is a more stable medium than stone.

  ### 7. UNNAMED (Cautious Maximalist)
  *   **Path:** Phys Corr (Yes) → Silence (Neutral) → Hero (Yes) → Scale (Variable)
  *   **Core Commitment:** Heroes existed, but we demand more proof for a migration (Exodus) than a siege (Troy).
  *   **Most Awkward Commitment:** You hold a dual standard of proof that risks inconsistency. If silence is neutral for Troy, you must explain why it is disconfirming for Exodus without appearing to tailor your methodology to the desired outcome.

  ---

  ## BLIND SPOTS: Indistinguishable Leaves

  This instrument flags two pairs of leaves that the decision tree cannot genuinely separate in practice, despite their theoretical differences.

  **1. The Minimalist vs. The Kernel-Historian (The "Invisible Kernel" Problem)**
  *   **The Overlap:** A Minimalist arguing that the Exodus was a small group of fugitives (archaeologically invisible) and a Kernel-Historian arguing that the Exodus was a small group of fugitives (preservation bias) arrive at the same material prediction: *We will find nothing.*
  *   **Why the Tree Fails:** Node 2 (Silence) separates them theoretically (Disconfirmation vs. Neutral), but in the field, both accept the absence of traces. The distinction rests entirely on their internal attitude toward the *potential* for future discovery, which is unfalsifiable.

  **2. The Mythicist vs. The Narrative-Functional (The "Truth Value" Problem)**
  *   **The Overlap:** Both positions treat the narrative as non-historical in the modern sense. For the reader asking "Did Arthur exist?", both answer "It does not matter / He did not exist as described."
  *   **Why the Tree Fails:** Node 1 separates them (Physical Correlation Necessary vs. Not Necessary), but the practical output is identical. The Mythicist says "No dirt, no history." The Functionalist says "Dirt is irrelevant." Both result in the legend being removed from the history curriculum, making them functionally indistinguishable to a policy-maker or educator.

  ---

  ## METHODOLOGICAL NOTE: The Silence Branch

  **Node 2** is the precise point of divergence where scholars talk past one another.
  *   In the **Trojan** case, silence is rarely invoked because the site (Hisarlik) exists; the debate is about *identification*.
  *   In the **Arthurian** case, silence is the primary evidence; the lack of 5th-century literacy in Britain makes silence expected, yet some treat it as disconfirming.
  *   In the **Exodus** case, silence is treated as disconfirmation by Minimalists because the scale claimed (millions) *should* leave traces in the Sinai.

  *Instruction to Reader:* If you find yourself answering "Neutral" for Troy but "Disconfirmation" for Exodus, you have selected the **Unnamed (Cautious Maximalist)** leaf. Be prepared to defend why the social form of a migration alters the physics of preservation.
