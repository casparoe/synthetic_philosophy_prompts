answer: |-
  # The Aumann Disagreement Classifier
  **For:** General-Interest Science & Philosophy Reporting  
  **Time Requirement:** ~15 Minutes (post-interview/research)  
  **Theoretical Basis:** Aumann's Agreement Theorem (1976)  

  ## Preamble: The Theorem vs. The World
  Before using this checklist, acknowledge the gap between the math and the newsroom. 
  *   **What Aumann Proves:** In a formal model, two Bayesian agents with **common priors** and **common knowledge of each other's rationality and posteriors** cannot assign different probabilities to the same event. If they disagree, they are not satisfying the conditions.
  *   **What Is Contested:** Whether real humans approximate "Bayesian rationality"; whether "priors" are ever truly common; whether the theorem applies to non-probabilistic claims (logic, values, definitions); and how "bounded rationality" (limited time/compute) excuses persistent disagreement. 
  *   **Reporter's Duty:** Do not treat this theorem as a verdict on who is right. Treat it as a diagnostic tool to categorize *why* they disagree.

  ---

  ## The 15-Minute Decision Procedure

  **Instructions:** Answer the following questions in sequence. Stop at the first **TERMINATION POINT**. Highlighted sections indicate where your editorial judgment is required and cannot be algorithmically resolved.

  ### Step 1: Define the Proposition ($H$)
  **Question:** Can the disagreement be reduced to a single, shared proposition $H$ (e.g., "Hypothesis X is true," "Event Y will occur by date Z")?
  *   **Sufficient Answer:** Yes, both parties are assigning a confidence level (probability or qualitative equivalent) to the *same* claim.
  *   **Negative Answer:** No. One is talking about definitions, the other about data; or one is talking about facts, the other about values.
  *   **TERMINATION POINT A (Outside Domain):** If **No**, classify as **Conceptual or Normative Dispute**. 
      *   *Reporting Implication:* Do not frame as a factual stalemate. Frame as a clash of frameworks or values. Aumann does not apply.
      *   *Judgment Call:* You must decide if the dispute is truly about $H$ or if $H$ is a proxy for something else (e.g., funding, prestige, policy preference).

  ### Step 2: Check Common Knowledge of Posteriors
  **Question:** Do both experts know, with high confidence, the specific position and reasoning of the other?
  *   **Sufficient Answer:** Yes. They have read each other's papers, spoken directly, or operate in a small field where positions are public and well-understood.
  *   **Negative Answer:** No. One is unaware of the other's latest data, or they are talking past each other via media intermediaries.
  *   **TERMINATION POINT B (Communication Failure):** If **No**, classify as **Epistemic Opacity**. 
      *   *Reporting Implication:* The story is not "Science is Stuck," but "Communication Channels are Broken." The disagreement is likely soluble.
      *   *Judgment Call:* Distinguish between "they haven't talked" and "they talked but didn't listen." The latter moves to Step 3.

  ### Step 3: Check Approximate Rationality
  **Question:** Is there evidence that either party is ignoring evidence, violating logic, or driven by non-truth-seeking incentives (financial, ideological)?
  *   **Sufficient Answer:** No obvious biases detected. Both update their views when presented with decisive counter-evidence in other domains.
  *   **Negative Answer:** Yes. One party consistently dismisses data that contradicts their stance without counter-argument, or has a clear conflict of interest.
  *   **TERMINATION POINT C (Failure of Rationality):** If **Yes**, classify as **Motivated Reasoning or Error**. 
      *   *Reporting Implication:* Flag the disagreement as potentially illegitimate. Aumann assumes rationality; if that breaks, agreement is not expected.
      *   *Judgment Call:* **CRITICAL.** You are judging competence and integrity. Avoid ad hominem; focus on methodological failures (e.g., "ignores base rates").

  ### Step 4: Check Priors (Starting Assumptions)
  **Question:** If they share the evidence ($E$) but disagree on the posterior ($P(H|E)$), do they share the same starting assumptions ($P(H)$)?
  *   **Sufficient Answer:** Yes, they started with the same baseline expectations before the new evidence arrived.
  *   **Negative Answer:** No. One started assuming $H$ was plausible (e.g., based on theory); the other assumed $H$ was impossible (e.g., based on precedent).
  *   **TERMINATION POINT D (Divergent Priors):** If **No**, classify as **Rational Disagreement with Genuine Prior Divergence**. 
      *   *Reporting Implication:* This is a "hard case." Both may be rational. The story should explain *why* the priors differ (e.g., different training, different weighting of historical data).
      *   *Judgment Call:* Are the priors "reasonable"? Aumann allows *any* common prior, but in reporting, you must assess if a prior is scientifically defensible or arbitrary.

  ### Step 5: Check for Value-Laden Components
  **Question:** Is the disagreement actually about what *ought* to be done (policy/risk tolerance) rather than what *is* true?
  *   **Sufficient Answer:** No, it is purely about the state of the world.
  *   **Negative Answer:** Yes. The probability assignment shifts based on how dangerous the outcome would be (e.g., "I assign low probability because the high-probability scenario is too scary to accept").
  *   **TERMINATION POINT E (Value/Policy Dispute):** If **Yes**, classify as **Normative Disagreement Disguised as Fact**. 
      *   *Reporting Implication:* Aumann does not govern values. Expose the value judgment. The "scientific" split is actually an ethical one.
      *   *Judgment Call:* Experts often conflate risk assessment (fact) with risk tolerance (value). You must disentangle them.

  ---

  ## Theoretical Boundaries: Proof vs. Interpretation
  *Use this sidebar to ensure your copy does not overclaim.*

  | **Aumann's Formal Proof** | **Contested/Heuristic Application** |
  | :--- | :--- |
  | **Agents:** Ideal Bayesians. | **Reality:** Humans have bounded rationality. Disagreement may persist simply because calculating the "agreement" is too computationally expensive. |
  | **Priors:** Must be Common (identical). | **Reality:** Experts often have different training/data histories. It is debated whether "different priors" is a rational excuse or a failure of initial calibration. |
  | **Knowledge:** Common Knowledge (infinite recursion: I know that you know that I know...). | **Reality:** We settle for "Mutual Knowledge." True common knowledge is rare. Disagreement may persist simply because the "common knowledge" condition isn't met. |
  | **Domain:** Probabilistic beliefs about events. | **Reality:** Does not apply to logical truths, moral values, or aesthetic judgments. Applying it here is a category error. |

  ---

  ## Application to Scenarios

  ### Scenario 1: Epidemiologists on Pathogen Origin
  **The Dispute:** Expert A assigns 80% probability to zoonotic origin. Expert B assigns 60% probability to laboratory incident.
  **Running the Checklist:**
  1.  **Proposition:** "SARS-CoV-2 originated in a lab." (Yes, shared $H$).
  2.  **Common Knowledge:** Both have read each other's preprints and attended the same workshops. (Yes).
  3.  **Rationality:** Both use genomic data and intelligence reports. Neither is obviously ignoring data, though both are under political pressure. (Pass, with caution).
  4.  **Priors:** Expert A (virologist) priors weight natural mutation high based on history. Expert B (biosafety specialist) priors weight lab risk higher based on institutional knowledge of safety protocols. (Divergent).
  5.  **Values:** Both claim to seek truth, but Expert B's higher probability may be influenced by a desire for stricter regulation (Value leak).

  **Classification:** **Rational Disagreement with Genuine Prior Divergence (with Value Caveat).**
  **Reporting Implication:** Do not write "Scientists are split on facts." Write "Scientists weigh historical precedents differently." Acknowledge that Expert B's prior may be influenced by policy goals (Step 5 judgment), which is legitimate to disclose but distinct from the data.
  **Aumann Insight:** They *could* agree if they fully exchanged the *weight* they give to specific intelligence reports, but if their priors on the reliability of those reports differ, Aumann allows the disagreement to persist.

  ### Scenario 2: Philosophers of Mind on Consciousness
  **The Dispute:** Philosopher A claims consciousness is physically reducible. Philosopher B claims it is not (Hard Problem).
  **Running the Checklist:**
  1.  **Proposition:** "Consciousness is physically reducible."
  2.  **Analysis:** This is not a probabilistic claim about an empirical event ($E$). It is a conceptual claim about logic and ontology. There is no "evidence" to update on in the Bayesian sense.
  3.  **Termination:** **Step 1 (Outside Domain).**

  **Classification:** **Conceptual Dispute (Outside Theorem's Domain).**
  **Reporting Implication:** **CRITICAL.** Public framing often treats this as a "scientific mystery" akin to dark matter. Your procedure identifies this as a category error. Aumann's theorem proves nothing here because there are no posteriors to converge.
  **Action:** Do not look for the "missing data" that will solve this. Report it as a clash of intuitions or definitions. If you frame this as "Experts disagree on the data," you are misleading the audience.

  ### Scenario 3: AI Safety Researchers on Timelines
  **The Dispute:** Researcher X predicts Transformative AI by 2030. Researcher Y predicts 2070.
  **Running the Checklist:**
  1.  **Proposition:** "Transformative AI arrives by year $T$." (Yes).
  2.  **Common Knowledge:** They publish models and critique each other's code openly. (Yes).
  3.  **Rationality:** Both use compute trends and algorithmic efficiency metrics. (Pass).
  4.  **Priors:** X assumes discontinuous jumps (innovation prior). Y assumes smooth scaling (physics prior). (Divergent).
  5.  **Values:** X's short timeline drives urgency for regulation. Y's long timeline drives focus on alignment research. (Value component detected).

  **Classification:** **Rational Disagreement with Divergent Priors (Model Structure).**
  **Reporting Implication:** This is a valid application of Aumann. The disagreement persists because their *models of progress* (priors) differ, not necessarily because one ignores the other's compute data.
  **Nuance:** Highlight Step 5. If X admits, "I argue for 2030 because I want to scare policymakers," the probability assignment is no longer a pure belief. Flag this as a **Normative Disagreement Disguised as Fact**.
  **Aumann Insight:** If they could agree on the *model of progress* (the prior), they would agree on the date. Since they can't, the disagreement is rational but persistent.

  ---

  ## Final Reporter's Note on Judgment
  This procedure eliminates ambiguity only where the math holds. In **Step 3 (Rationality)** and **Step 4 (Priors)**, you are making subjective calls about what counts as "reasonable" expertise. 
  *   **Do not** use this checklist to declare one expert "wrong." 
  *   **Do** use it to tell the reader *what kind* of disagreement they are witnessing. 
  *   **Most Importantly:** In Scenario 2 (Philosophy), you must resist the urge to force a scientific frame onto a conceptual dispute. Aumann's silence here is a signal to change your narrative approach.
