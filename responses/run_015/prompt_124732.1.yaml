answer: |-
  ### The Implicit Theory of the "Genetically Adjusted" School

  To understand what this school system is doing, you must reconstruct the causal model hidden inside their regression equation. The practice rests on three pillars of implicit theory: **Additivity**, **Exogeneity**, and **Residual Fairness**.

  **1. Additivity (The Partitioning Assumption)**
  The system assumes that educational attainment is a sum of independent components: $Outcome = Genes + Environment + School + Error$. By statistically controlling for polygenic scores (PGS), officials assume they are isolating the "School" and "Environment" (Income) components from the "Genes" component. This treats heritability not as a population-specific ratio of variances ($V_G / V_P$), but as a fixed slice of individual causality that can be subtracted out. It assumes the variance explained by PGS in the general population applies linearly and identically within every specific school catchment area.

  **2. Exogeneity (The "Fixed Input" Assumption)**
  This is the critical failure point. The practice treats the PGS as an exogenous baseline characteristic—like eye color or baseline test scores—that the school receives but does not influence. It assumes the score reflects only the child's internal biological machinery.
  *   **The Reality:** PGS captures **direct genetic effects** (child's DNA $\rightarrow$ child's brain) *and* **indirect genetic effects** ("genetic nurture"). Parents pass on genes *and* environments correlated with those genes. A high PGS for education often reflects parents who created a literacy-rich home, partly *because* of their own genetic propensities.
  *   **The Consequence:** By controlling for PGS, the system is not just netting out "biology"; it is partially netting out the *home environment* associated with privilege. It treats the advantages money buys (tutors, books, stability)—insofar as they correlate with parental genes—as if they were innate genetic destiny.

  **3. Residual Fairness**
  The theory defines a "fair" evaluation of a school as one that judges it only on the variance *remaining* after known inputs (Income, PGS) are accounted for. It presupposes that schools are responsible for *residuals*, not *outcomes*.

  ---

  ### Addressing Your Specific Queries

  **Does the practice presuppose heritability measures unmalleability?**
  Strictly speaking, no. A sophisticated defender can argue: "We know genes interact with environments. We are not saying these kids can't learn. We are saying that, *given the current distribution of genetic propensities*, we want to measure the school's marginal contribution."
  However, **functionally, yes.** By treating PGS as a control variable rather than a moderator, the system acts *as if* the genetic component is a fixed constraint on the school's potential impact. It ignores the possibility that a great school might specifically amplify the potential of those with high genetic risk (a gene-environment interaction), which a main-effects model would miss.

  **Does treating the score as a fixed input go wrong if it encodes disadvantage?**
  Yes. This is the **over-control bias**. Because PGS correlates with income (via assortative mating and social stratification), and because PGS captures "genetic nurture," controlling for PGS removes part of the causal pathway through which income affects attainment.
  *   **What the Adjusted Number Means:** It no longer represents the "Income Gap." It represents the "Income Gap *among children with equivalent genetic propensities and equivalent genetically-correlated home environments*." It artificially shrinks the gap, making inequality look smaller than it is, because it has statistically removed the mechanisms of privilege that correlate with DNA.

  **What would I see at a school that scores well on Adjusted but badly on Raw?**
  You would see a school in a deeply stratified area.
  *   **Raw Gap:** Wide. High-income kids are scoring 90%, low-income kids are scoring 60%.
  *   **Adjusted Gap:** Narrow/Positive. The model predicts the low-income kids should be scoring 50% based on their PGS (which is lower due to stratification and genetic nurture). Because they are scoring 60%, the school is "adding value."
  *   **The Scene:** The school is working heroically to mitigate severe structural disadvantage. The "Adjusted" metric praises their effort; the "Raw" metric highlights their failure to close the actual social chasm. The Adjusted metric says, "Great teaching given the hand they were dealt." The Raw metric says, "The hand they were dealt is unacceptable."

  **Where is the practice underdetermined?**
  The same Adjusted Gap number could be produced by three mutually exclusive realities:
  1.  **The School is Effective:** The school is successfully teaching kids regardless of background.
  2.  **The PGS Model is Biased:** The PGS predicts poorly for this specific demographic (e.g., non-European ancestry), creating noise that looks like "school effect."
  3.  **Genetic Nurture Variation:** The local correlation between parental genes and home environment is different than the national average used to weight the PGS.
  The number cannot distinguish between school quality and model error.

  ---

  ### Definite Verdict

  **Salvageable with specified changes.**

  **Reasons:**
  The practice is currently **scientifically invalid for its stated purpose** (fairness) because it conflates direct genetic effects with environmental privilege (genetic nurture). It effectively excuses schools from addressing the environmental components of inequality that are correlated with genetics.

  However, it is **salvageable** if the following changes are made:
  1.  **Switch to Within-Family PGS:** The adjustment must use polygenic scores derived from within-family designs (comparing siblings). This strips out the "genetic nurture" (parental environment) component, isolating the direct genetic effect of the child. This prevents the model from "controlling away" the home environment advantages that income buys.
  2.  **Reframe the Metric:** Stop calling it an "Adjusted Attainment Gap." Call it a "Return on Genetic Potential" metric. Acknowledge that the Raw Gap measures social inequality, while the Adjusted Gap measures instructional efficiency. Do not allow the Adjusted figure to replace the Raw figure in public accountability.
  3.  **Test for Interactions:** The model must test for Gene $\times$ Environment interactions. If the school is truly "fair," the effect of Income should vanish *especially* for those with high genetic risk. A main-effects adjustment assumes the school effect is constant across genetic profiles, which is a biological oversimplification.

  **Note on the "Least Defensible" Claim:**
  The part of this answer I would least want to defend to a behavioural geneticist is the feasibility of the **"Within-Family PGS"** fix in a policy context. While theoretically superior, within-family PGS estimates have significantly lower predictive power ($R^2$) than population-level scores because they discard between-family variance. In a practical school accountability setting, the noise introduced by using weaker within-family scores might render the "Adjusted" figure statistically unstable for individual schools, potentially creating *more* unfairness through measurement error. I am asserting that the scientific purity of the fix outweighs the loss of statistical power, but a geneticist could argue that a noisy unbiased estimator is worse than a precise biased one for high-stakes decision-making.
