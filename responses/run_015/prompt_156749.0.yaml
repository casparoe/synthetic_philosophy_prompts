answer: |-
  **Project Title:** Decoupling Broadcasting from Binding: A Structural Analysis of Global Workspace Theory

  **Applicant:** [Your Name/Organization]
  **Duration:** 6 Months
  **Request Type:** Workshop & Research Grant

  ### Executive Summary
  Global Workspace Theory (GWT) is currently the leading functionalist account of access consciousness. It argues that consciousness arises when information is broadcast globally to cognitive modules. However, this project identifies a critical, unexamined assumption within standard GWT frameworks: the assumption that global broadcasting automatically entails a "point of view."

  We propose that GWT smuggles in a hidden mechanism we call **phenomenal tagging**—the idea that broadcasted information is inherently bound to a subject. This six-month project will conceptually separate *broadcasting* (availability) from *tagging* (subjectivity). Through conceptual analysis and the construction of a logical artificial-system model, we will test whether an architecture can possess full access consciousness without phenomenal consciousness. The goal is not to solve the Hard Problem, but to determine if GWT is explaining access or merely hiding the Hard Problem behind functional terminology.

  ### The Research Question
  **Can we model a cognitive architecture where information is globally available to all processing modules, yet no mechanism exists to bind that information phenomenally to a subject?**

  If such a model is coherent, it demonstrates that GWT explains access without phenomenality. If such a model is logically impossible, it suggests that "access" conceptually requires a "subject," meaning GWT has not separated access from phenomenal consciousness as claimed.

  ### The Gap in Current Debates
  Current debates, particularly between proponents of GWT (like Dehaene) and critics (like Block), operate on a shared assumption: that once information is globally broadcast, the question of "who" receives it is functionally resolved.

  *   **The Proponent View:** Broadcasting *is* the light of consciousness. If the whole brain sees the data, the system is conscious.
  *   **The Critic View:** Broadcasting is just data transfer; it doesn't guarantee feeling.

  Both sides leave open the structural mechanics of the "receiver." They assume that if modules receive the data, the "subject" receives the data. This project argues that this is a category error. A module processing data is not a subject experiencing data. By failing to distinguish between *system-wide availability* and *subjective binding*, current literature leaves it unclear whether GWT is a theory of access or a disguised theory of phenomenality.

  ### Methodology
  This project is **not** empirical neuroscience. We will not be scanning brains or running behavioral trials. Instead, we will use **structural conceptual modeling**.

  1.  **Conceptual Audit (Months 1-2):** We will map the necessary conditions for "global broadcasting" versus the necessary conditions for "phenomenal binding." We will identify exactly where standard GWT literature conflates the two.
  2.  **Artificial-System Case Study (Months 3-4):** We will design a logical architecture (a sophisticated thought experiment/system model). This model will feature:
      *   A global workspace.
      *   Multiple specialized modules with read-access to the workspace.
      *   **Explicitly removed:** Any mechanism that designates the data as "mine" or "for a viewer."
      *   *Goal:* To see if the system can function (report, reason, access) without this mechanism.
  3.  **Workshop & Validation (Month 5):** A small, closed-door workshop with 5-8 philosophers of mind and cognitive scientists. We will present the model for stress-testing. The goal is to see if experts can find a logical contradiction in "subjectless access."
  4.  **Final Report (Month 6):** Publication of the findings and the model architecture.

  ### Why This Approach?
  Why not do more neuroscience or pure armchair philosophy?

  *   **Vs. Neuroscience:** Neural correlates tell us *where* broadcasting happens, not *what* broadcasting logically entails. fMRI cannot distinguish between "data available to modules" and "data felt by a subject." That is a conceptual distinction, not a spatial one.
  *   **Vs. Pure Intuition:** Standard intuition pumps (e.g., "Imagine a zombie...") are often too vague. By building a specific architectural model, we force the argument into a rigid structure. If the model breaks, we know exactly which gear slipped.

  This approach treats the mind as an engineering problem. If we can draw the blueprint for a mind that has access but no subject, we prove the concepts are distinct. If the blueprint won't draw, we prove they are linked.

  ### Outcomes: Success and Failure
  We need to be clear about what counts as a win.

  *   **Success:** We produce a coherent model of "Subjectless Access." This validates the claim that GWT explains access consciousness but leaves phenomenal consciousness untouched. It forces GWT proponents to either accept they aren't explaining phenomenality or add a "tagging" mechanism to their theory.
  *   **Failure:** We find that the model is logically incoherent. For example, we might discover that "global availability" logically implies a "unified point of view." This would be a significant philosophical result, suggesting that access and phenomenality cannot be decoupled, effectively collapsing GWT into the Hard Problem.
  *   **Risk:** The project stalls because the definition of "subject" is too vague. *Mitigation:* We will define "subject" strictly functionally (as a binding mechanism), not metaphysically.

  ### Feasibility: Is 6 Months Enough?
  **Yes, but with strict boundaries.**

  We are not solving the Hard Problem of consciousness. We are not explaining *why* tagging creates feeling. We are only testing whether *broadcasting* creates *tagging*.

  *   **Scope:** We are analyzing the *relationship between two concepts*, not the nature of reality.
  *   **Deliverable:** The deliverable is a clarified argument and a model, not a new theory of everything.
  *   **Constraint:** If the analysis drifts into metaphysical questions about "qualia," the project will be reined back to structural functionalism.

  Six months is sufficient to audit the literature, build the model, and stress-test it in a workshop. It is not enough to settle the debate forever, but it is enough to move the goalposts.

  ### Budget Overview
  *   **Researcher Stipend:** 6 months part-time equivalent for lead analysis and writing.
  *   **Workshop Costs:** Travel and accommodation for 8 participants + venue rental for 2 days.
  *   **Dissemination:** Open-access publication fees and website hosting for the model architecture.

  ### Conclusion
  Philosophy of mind is currently stuck between empirical data that shows *correlation* and intuition that shows *bias*. This project offers a third path: structural clarity. By separating broadcasting from binding, we can finally see if Global Workspace Theory is a map of access consciousness, or if it's been selling phenomenality under the table all along. This grant will allow us to check the receipt.
