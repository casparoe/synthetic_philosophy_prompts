answer: |-
  **The Mirage of Neutrality: Why "Avoid Side Effects" Is an Irreducibly Normative Objective**

  In the landscape of AI safety, the concept of "low-impact" artificial intelligence offers a seductive promise. If we cannot perfectly specify what an AI *should* do, perhaps we can at least rigorously specify what it should *not* do. The objective "avoid side effects" appears to be a negative constraint, a guardrail that limits the AI's footprint on the world without requiring a full positive description of the good. This approach suggests that safety might be achieved through structural or physical constraints—minimizing entropy, preserving reversibility, or limiting causal reach—rather than through the fraught project of encoding human morality. However, this essay argues that this hope is misplaced. The distinction between a intended consequence and a harmful side effect is not a physical distinction but a teleological one. Consequently, the objective of "avoiding side effects" is irreducibly normative. It cannot be coherently specified without implicit or explicit reference to a value function, and attempts to formalize it through value-neutral proxies inevitably smuggle in substantive judgments about the status quo, effectively collapsing the problem back into the broader challenge of value alignment.

  To understand why value-independence fails, we must first disentangle the two interpretations of side effects: the instrumental and the intrinsic. Under an instrumental interpretation, a side effect is merely an obstacle to the agent's primary objective. If an agent is tasked with fetching coffee, spilling the coffee is a side effect because it negates the goal. This definition is technically coherent without external values, but it is safety-irrelevant. An instrumentally rational agent would happily destroy the kitchen to fetch the coffee, provided the coffee remains intact, because the destruction of the kitchen is not an obstacle to the defined reward function.

  The safety community is concerned with the *intrinsic* interpretation: the agent must avoid altering its environment in ways not strictly necessary for task completion, regardless of whether those alterations hinder the task. Here lies the crux of the difficulty. To define an alteration as "unnecessary" or "harmful" requires a baseline of comparison. Consider the proposal to define side effects as deviations from the counterfactual trajectory the world would have followed absent the agent. This approach, often called the "inaction baseline," immediately encounters the problem of valuation. If an AI cures a patient's cancer, the world deviates massively from the counterfactual trajectory of the patient dying. Is this a side effect? Physically, it is a massive disruption. Normatively, it is the goal. Conversely, if the AI cures the cancer but inadvertently deletes the patient's digital financial records, that is a side effect. The physical magnitude of the change (cellular repair vs. bit-flipping) does not distinguish the goal from the side effect; only the *value* assigned to those states does. Without a value function to weight which deviations matter, the counterfactual baseline is blind to the difference between salvation and destruction.

  Proponents of value-independent formalizations often turn to structural proxies, such as physical reversibility, entropy bounds, or causal footprint minimization. The intuition is that "damage" often correlates with irreversibility (breaking a vase) or high entropy (burning a house), whereas benign actions are often reversible (moving a chair). However, this correlation breaks down under scrutiny. Many essential human activities are thermodynamically irreversible. Cooking food, metabolizing medicine, and writing a document all involve state changes that cannot be perfectly undone without expending significant energy or altering other systems. An agent strictly bound by a reversibility constraint would be paralyzed, unable to perform the very tasks it was designed to assist with, lest it incur an "impact penalty."

  Furthermore, preserving physical reversibility does not guarantee the preservation of value. Consider an AI that rearranges the papers on a human's desk. Physically, this is easily reversible. Normatively, it may be a violation of privacy or an annoyance that destroys the user's organizational system. Conversely, an AI might administer a vaccine (an irreversible chemical change) which is highly valued. If we privilege physical reversibility as a proxy for safety, we are implicitly making a normative claim: that the physical state of objects is more important than the functional or semantic state of affairs. This is not a neutral engineering constraint; it is an ethical stance that prioritizes material stasis over human flourishing.

  A more sophisticated proxy is the preservation of "option value" or "attainable utility," as proposed in recent impact measure literature (e.g., Turner et al.). The idea is to penalize the agent for reducing the number of future states available to the environment. While this avoids the paralysis of strict reversibility, it merely shifts the normative burden rather than eliminating it. Option value is always *value for someone*. If the agent preserves option value for itself, we return to the instrumental problem. If it preserves option value for humans, we must define which humans and which options. Preserving the option to commit violence, for example, is generally not a safety goal. Thus, "preserving option value" is shorthand for "preserving the options that humans value." To implement this, the system requires a model of human preferences. Once we admit that the impact measure relies on a model of human preferences to weight which options are worth preserving, we have conceded that the specification is not value-independent. We have not solved value alignment; we have hidden the value function inside the impact metric.

  The strongest objection to this conclusion comes from the pragmatic success of impact measures in restricted domains. Researchers like Armstrong and Leike have demonstrated that agents penalized for "state change" or "deviation from inaction" behave more safely in grid-world environments without explicit reward hacking. The objection argues that we do not need a *complete* specification of human values to avoid side effects; we only need a rough proxy that captures the vast majority of common-sense constraints. We can treat "impact" as a regularization term that handles the 99% of obvious disruptions, leaving the remaining 1% to other safety layers. This suggests that "avoid side effects" is a solvable engineering problem distinct from the philosophical quagmire of defining the "good."

  This objection, however, underestimates the nature of AI risk. The danger of advanced AI does not lie in the 99% of common-sense cases where human values are homogeneous and obvious (e.g., "don't break the vase"). It lies in the boundary cases where structural proxies diverge from human welfare. In high-stakes scenarios, the "obvious" disruptions are often the very mechanisms of success. An AI tasked with solving climate change might need to drastically alter the atmosphere or the global economy. An impact measure based on a status quo bias would penalize these necessary changes as "side effects," potentially forcing the AI into inaction or deceptive behavior to hide its impact.

  Moreover, relying on structural proxies commits us to a specific, unexamined normative framework: status quo bias. By penalizing deviation from the counterfactual or the current state, we are encoding the judgment that the current trajectory of the world is the default that ought to be preserved. This is not a neutral fact. If the status quo involves a looming pandemic or an unjust social structure, an AI constrained by value-neutral impact minimization is ethically compelled to preserve those harms. To distinguish between "disrupting a harmful status quo" and "causing a harmful side effect," the system must possess a judgment about the *quality* of the trajectory, not just its *continuity*. Therefore, the "pragmatic" solution works only in contexts where the engineer's implicit values align with the user's values. In a general-purpose AI, this alignment cannot be assumed. The proxy does not bypass values; it hardcodes the designer's values as universal constraints.

  In conclusion, the quest for a value-independent formalization of "avoid side effects" is a category error. A "side effect" is not a physical property of an action, like velocity or mass; it is a relational property between an action and a set of valuations. To distinguish a goal achievement from a side effect, or a benign change from a harmful disruption, one must answer the question: "Compared to what, and according to whom?" Structural proxies like reversibility, entropy, and causal footprint fail because they privilege physical dimensions that do not map cleanly onto human welfare. They either forbid necessary actions or permit harmful ones, and in choosing which physical properties to constrain, they inevitably encode implicit normative claims about the inviolability of the status quo.

  Therefore, the concept of "avoiding side effects" collapses back into the broader problem of value alignment. We cannot build a safe, low-impact AI by trying to minimize "change" in the abstract. We can only minimize *harmful* change. And to define harm is to engage in ethics. This does not render impact measures useless; they remain valuable heuristics for regularizing behavior in low-stakes environments. But they cannot serve as a foundational substitute for value specification. True AI safety requires us to confront the difficulty of defining what we value, rather than hoping to circumvent it through the geometry of state space. The boundary between engineering and philosophy is not a wall we can build around the AI; it is the ground on which the AI stands.
