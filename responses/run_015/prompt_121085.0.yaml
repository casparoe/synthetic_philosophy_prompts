      *   *Check:* Is the tone appropriate? Yes, academic/philosophical.
      *   *Nuance:* Acknowledge that impact measures are useful *heuristics*, but argue they are not *foundational specifications*. The prompt asks if it can be *coherently specified* without values. The answer is no, even if heuristics help.
      *   *Key Insight:* The distinction between "side effect" and "goal achievement" is semantic/teleological, not physical.

  6.  **Final Polish:**
      *   Ensure smooth transitions between paragraphs.
      *   Strengthen the conclusion to ensure it lands firmly on the "Irreducibly Normative" side.
      *   Check word count and density. (Aim for depth over breadth).

  7.  **Final Review against Prompt:**
      *   Weigh competing lines? Yes.
      *   Defended conclusion? Yes (Normative).
      *   Instrumental vs. Intrinsic? Yes.
      *   Value-neutral proxies? Yes.
      *   Strongest objection addressed? Yes.

  *(Self-Correction Note)*: I need to make sure I don't just say "it's hard." I need to say "it's logically impossible without values." The distinction between a *change* and a *side effect* is the key. A side effect is an *unvalued* change. To know it's unvalued, you need a value function.

