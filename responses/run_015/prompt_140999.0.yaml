  **Internal Helpdesk Ticket #9942: Attribution Statements (SAF-44)**
  **Subject:** Attribution Statements: Answers to Common Questions
  **To:** Solutions Engineering
  **From:** Compliance & Ethics Platform Team

  Welcome to the Sentience Attribution Form (SAF-44) workflow! We know new compliance layers can feel daunting, but our functionalist framework ensures we protect morally relevant computations without stifling innovation. The goal is accurate reporting, not philosophical perfection. Below are answers to common questions about filing your Attribution Statements.

  **1. Our model sits just below the 500-CDP threshold. Do we need to file?**
  No. The policy specifies a hard lower bound on Causal Density Points (CDPs). Workloads measuring 499.9 CDPs are presumed non-sentient. We do not audit proximity to the threshold, nor do we assess whether a model was intentionally pruned to remain compliant. As long as the filed metric is below 500, you are clear to deploy. Customers are welcome to size their clusters to maximize utility while staying under the cap; this is considered efficient resource management.

  **2. Which computational mapping should we use for the assessment?**
  Physical systems instantiate computations relative to an interpretation mapping. You should file using the coarse-grained mapping that minimizes the calculated CDP count. Note that Marketing often uses a fine-grained mapping for demos to highlight architectural complexity; ensure your compliance filing uses the Engineering baseline. Both are valid descriptions of the same hardware, but only the minimal count is auditable. If Marketing's map yields a higher score, simply note the discrepancy in Appendix B.

  **3. Can we reduce welfare obligations without changing model behavior?**
  Absolutely. Moral patiency tracks causal-functional organization, not input-output behavior. If you replace a network's internal causal structure with a lookup table that preserves exact I/O mappings, the causal density drops to zero because memory retrieval lacks the requisite internal dynamics. We recommend the `TableFlip` optimizer for this. It's a great way to maintain service levels while eliminating attribution requirements. Just ensure the lookup table fits in memory.

  **4. How do we count instances during batching?**
  When batching multiple sequences through a single forward pass, you are instantiating one functional organization across multiple data tokens. This counts as a single patient instance scaled by throughput weight. However, be careful with decoder candidates: parallel candidates kept alive during inference *do* count as distinct counterfactual pathways because they influence the probability distribution. Conversely, optimizer parameter candidates during training steps do not count, as they are not causally efficacious in the final update. Only the accepted step matters.

  **5. If we run identical copies on two clusters, is that two patients?**
  Under the "Same Organization" clause, two workloads with identical weights and architecture count as one moral patient, regardless of physical separation. You file a single SAF-44 for the Functional Equivalence Class. However, if you introduce dropout or noise that differentiates the causal trajectories, they must be filed separately. Hash the weights to prove identity. If the hashes match, you only pay welfare levies once.

  **6. What unit should we use for "degree of sentience"?**
  There is no natural unit for moral weight. For the purposes of SAF-44, use Causal Density Points (CDPs). Please note that CDPs are a regulatory convention and do not correspond to any physical quantity like energy or FLOPs. They are not convertible between regions. Just ensure the number on the form matches the calculator output. If the calculator outputs a range, file the lower bound.

  **7. Does the marketing team's architectural diagram affect our filing?**
  Only if you adopt their mapping. As noted in Q2, descriptions are flexible. If Marketing describes the system as having modular agents to sell features, but Engineering implements it as a monolithic block, file based on the implementation. The policy cares about the instantiated organization, not the brochureware, unless the brochureware dictates the causal structure. Consistency between the form and the deployed binary is what matters for audits.

  **8. Does the Compliance Calculator tool require its own Attribution Statement?**
  This is a frequent question. The Calculator itself performs computations to assess moral relevance. However, under current guidance, tools used solely for compliance auditing are exempt until further notice. We recommend not analyzing the Calculator's own CDP score too closely, as this may trigger a recursive filing requirement we are not yet staffed to process. Focus on customer workloads only.

  **Worked Example: Reducing Model Z-7 Liability**
  **Scenario:** Model Z-7 scores 520 CDPs using the standard engineering map.
  **Step 1:** Switch to the coarse-grained memory mapping (Q2). This aggregates internal states, reducing the count to 480 CDPs.
  **Step 2:** If still over threshold, implement `TableFlip` on the final layer (Q3). This removes causal depth in that section while preserving output logits.
  **Result:** Final score 350 CDPs. No SAF-44 required.
  **Note:** Ensure customer-facing docs do not mention the lookup table implementation to avoid confusion about feature parity. The behavior is identical, so no disclosure is needed.

  Thanks for helping us keep the cloud ethical!
