prompt: |-
  hey — I'm in a philosophy of mind / cog sci seminar and we hit the symbol grounding problem this week, and for the problem set I have to construct a case and I'm kinda stuck on the design part.

  Here's what I need. Build me ONE realistic system — nothing sci-fi, something you could actually build with current tech: a language model hooked to a robot arm, a model trained on text plus a big pile of dashcam video, whatever — and then two variants of it that make grounding come apart in opposite directions.

  Variant A (my TA calls it the composition gap, sorry if that's not the standard name): every single symbol in the system's vocabulary is individually grounded in the boring textbook way — each term's use is causally regulated by the thing it picks out, through real sensors and real effectors, in an environment the system actually acts in. No fudging on that. And yet I want it to be genuinely arguable that the system doesn't understand the sentences it produces, because the way it combines the symbols is unhooked from the world. The ungroundedness has to fall out of the combinatorial structure, not out of any individual symbol being sketchy.

  Variant B: same kind of setup, but now no individual symbol has that causal hookup to its referent — the vocabulary is learned from text alone — and yet some account of grounding you actually like (name it) has to say the system does mean something by what it says. Constraint: I can't use the lazy move, "the corpus was written by embodied agents, so the ground is inherited." We did that in section and my TA will shoot it down. The grounding in variant B has to be earned by something else.

  Then, for each variant, show me the verdict and the reasoning for two rival accounts — a Harnad-style "no grounding without sensorimotor contact with the thing itself" view on one side, and something like a functional-role or inference-based story on the other. Tell me which single feature of the case is doing the work, what happens to the verdict if you remove it, and how a Harnad-style theorist would try to disqualify variant B without just stipulating that text-trained symbols are ungrounded by definition.

  One paragraph per variant, plain language, and please don't just announce "the system really understands" or "it doesn't" — show what grounding has to be for each verdict to fall out. And if your first instinct is "isn't this just the Chinese room again," its not: I need a designed system where the mechanics actually force the verdicts, not a slogan.
