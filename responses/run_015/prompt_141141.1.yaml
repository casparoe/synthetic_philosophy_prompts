answer: |-
  Base System: A transformer-based agent with an output interface.

  **Variant A (The Composition Gap):** Imagine a pick-and-place robot equipped with a camera and arm, where atomic concepts like "red," "block," and "grasp" are individually grounded through reinforcement learning (the robot gets rewards only for correctly identifying and moving specific objects). However, the language head generating sentences is trained separately on human transcripts to maximize fluency, not truth, leading to feature-binding errors: the robot sees a red cube and a blue sphere but reports "red sphere, blue cube." For Harnad, this system fails to understand the sentences because the combinatorial structure lacks causal regulation by the actual state of affairs; the symbols are anchored, but the proposition floats free of the world. A functional-role theorist might concede the atoms have meaning but argue the sentence lacks understanding because its functional role—guiding future action or communication—is broken by the mismatch. The critical feature is the **decoupled binding mechanism**; if you remove it and force the language head to read directly from the object-tracking buffer, the sentences become world-anchored. Harnad would verdict "no understanding" because the syntax isn't tethered to the semantics of the situation, only the words are.

  **Variant B (Text-Only Grounding):** Now strip the sensors and hook the same model to a code sandbox where it learns terms like "loop" and "print" from text documentation but receives feedback on whether its generated code actually executes without error. Under Inferential Role Semantics (IRS), this system *does* mean something by its symbols because their meaning is constituted by their specific causal role in producing successful computational outcomes within the system's economy. Harnad, however, verdicts "no grounding" because the causal loop is closed within the symbol system itself; the code execution changes internal states or screen pixels, not distal physical objects. The critical feature is the **execution feedback loop**; without it, the model reverts to pure next-token prediction with no constraint beyond statistical likelihood. To disqualify this without mere stipulation, Harnad argues that computational causation is observer-relative unless it bridges the gap to the physical world via sensory transducers; without sensors, the "success" of the code is just more syntax, lacking the intrinsic intentionality that comes from biological or robotic contact with reality.
