answer: |-
  You have put your finger on one of the most persistent and structurally necessary tensions in the philosophy of science. You are describing a claim that functions as a **bridge** between a formal system (mathematics, logic) and an informal or physical domain (reality, cognition, biology).

  There is no single colloquial word for this, but in the philosophy of science, there are three established concepts that, when layered together, describe exactly what you are seeing. Depending on which aspect you want to emphasize (the history, the function, or the metaphysics), the name changes.

  ### 1. The Historical Name: Coordinative Definition
  The most precise established term for this move comes from the logical empiricist Hans Reichenbach (1920s–50s). He called it a **Coordinative Definition**.

  Reichenbach realized that to apply geometry to physics, you need to link a mathematical concept (e.g., "straight line") to a physical object (e.g., "light ray"). He argued this link cannot be purely empirical (you can't prove a light ray *is* a straight line without already assuming geometry) nor purely definitional (if it's just a definition, it tells us nothing about the world).

  So, it must be a **Coordinative Definition**: a stipulation that *coordinates* a formal structure with a physical reality.
  *   **As a Definition:** It fixes the meaning of terms within the theory (e.g., "For the purposes of this physics, 'rigid body' means 'object that measures constant distance'").
  *   **As a Discovery:** It makes an empirical claim that the world cooperates with this coordination (e.g., "Steel rods *actually behave* as rigid bodies").

  **Why it fits your cases:**
  *   **Computation:** "Turing Machine" is coordinated with "Effective Procedure." If a brain process doesn't fit the TM, the computer scientist says "Then it's not computation" (Definitional). If a physicist says "The universe is a TM," they mean the coordination holds empirically (Discovery).
  *   **Fitness:** "Fitness" is coordinated with "Reproductive Success." If an organism survives but leaves no offspring, is it fit? The definition says no; the empirical claim is that traits causing survival *usually* lead to offspring.
  *   **Equivalence Principle:** "Inertial mass" is coordinated with "Gravitational mass."

  ### 2. The Functional Name: Constitutive Principle
  If *Coordinative Definition* is the historical label, the modern functional label (championed by philosopher Michael Friedman) is a **Constitutive Principle**.

  Friedman argues that certain principles in science are **constitutive of the framework** itself. They are not quite empirical laws (because they define what counts as an object or measurement in that framework), but they are not quite analytic truths (because they can be overturned by future science).
  *   **The Move:** When challenged, scientists retreat to the **Constitutive** role ("This defines our framework"). When doing work, they leverage the **Empirical** role ("This framework predicts the world").
  *   **Why it's not Motte-and-Bailey:** In a Motte-and-Bailey, the speaker is being deceptive or inconsistent. In a Constitutive Principle, the duality is **structurally necessary**. You cannot do the science without the definition, but the science is worthless if the definition doesn't latch onto reality. The "shift" isn't a rhetorical trick; it's the hinge on which the theory turns.

  ### 3. The Metaphysical Name: Necessary A Posteriori Identity
  If you want to understand *why* this feels logically permissible (how a discovery can act like a definition), the metaphysician Saul Kripke provides the term: **Necessary A Posteriori Identity**.

  Kripke argued that some identities are discovered empirically (*a posteriori*) but, once discovered, are necessarily true (*necessary*).
  *   **Example:** "Water is H₂O."
  *   **Discovery:** We had to run experiments to find this out.
  *   **Definition:** Now, if you find a liquid that looks like water but isn't H₂O, it *is not water* (by definition).
  *   **Your Computation Case:** "Computation is Turing-Computability." If this identity holds, it was a discovery that all effective procedures map to TMs. But now, if something isn't Turing-computable, it *is not computation*.

  ### Summary of the "Shape"
  You are observing the **Dual Status of Theoretical Identities**.
  *   **Established Label:** **Coordinative Definition** (Reichenbach) or **Constitutive Principle** (Friedman).
  *   **The Move:** Treating a bridge principle as **empirical** when extending the theory, and **definitional** when protecting the theory's core.

  ### When does it become illegitimate?
  You asked where the boundary lies between this legitimate scientific move and an illegitimate rhetorical dodge. Since this structure is necessary for science, the illegitimacy doesn't come from the *structure* itself, but from how it is managed over time.

  **It is legitimate (Productive Ambiguity) when:**
  1.  **Risk is retained:** The empirical side remains vulnerable. (e.g., Physicists *do* test the Equivalence Principle constantly. If it failed, they would change the physics, not just the definition).
  2.  **Fruitfulness:** The definition allows for new predictions or unifications that weren't possible before.
  3.  **Transparency:** The community acknowledges the dual status (as the workshop speakers arguably did, even if they didn't resolve it).

  **It becomes illegitimate (Dogmatic Retreat) when:**
  1.  **Immunization:** The claim is used to shield the theory from *any* counter-evidence by redefining the counter-evidence out of existence permanently. (e.g., "If this brain process isn't simulable, we just won't call it 'cognition' anymore," thereby making the claim "All cognition is simulable" unfalsifiable).
  2.  **Stagnation:** The definition stops generating new work and only serves to block criticism.
  3.  **Hidden Shift:** The speaker pretends the claim is purely empirical to gain prestige, then switches to purely definitional to avoid refutation, without acknowledging the bridge status. (This *is* Motte-and-Bailey).

  ### A Coined Term for Your Toolkit
  If you need a term for your journalism that captures the *rhetorical dynamic* without wading into 1920s German philosophy, I suggest coining:

  **"The Constitutive Shift"**

  *   **Definition:** The argumentative move where a foundational scientific principle is treated as an empirical discovery when making claims about the world, but as a conceptual definition when defending the theory's boundaries.
  *   **Boundary Case:** It is a **Constitutive Shift** (legitimate) when it preserves the framework's ability to engage with reality. It becomes a **Definitional Retreat** (illegitimate) when it severs the framework from reality to save it from falsification.

  ### Why your description stopped fitting "Explication"
  You mentioned Carnapian **Explication**. That is close, but Explication is a *proposal* to replace a vague concept with a precise one. It is a one-way street (Vague → Precise).
  The phenomenon you observed is a *two-way dynamic* (Formal ↔ Physical) that persists *after* the terms are settled. The speakers weren't proposing a new definition; they were navigating the tension of an existing one. That is why **Coordinative Definition** or **Constitutive Principle** is the better fit.

  ### Final Verdict
  The thing has an established name, but it is fragmented across sub-fields.
  *   In Philosophy of Physics: **Coordinative Definition**.
  *   In Philosophy of Science (General): **Constitutive Principle**.
  *   In Metaphysics: **Necessary A Posteriori Identity**.

  For your purposes, **"Constitutive Principle"** is likely the most robust label. It captures the idea that the claim *constitutes* the object of study (computation, fitness, gravity) while remaining accountable to the world. The "shift" you see is the scientists toggling between the **constitutive** role (setting the rules) and the **empirical** role (playing the game).
