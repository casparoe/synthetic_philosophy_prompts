  3.  **Address the "Exemplarism vs. Exemptionism" Distinction:**
      *   *Exemplarism:* We follow the rules *better* so others learn.
      *   *Exemptionism:* We are *above* the rules because we are special.
      *   *Connection:* Winthrop's original text leans heavily toward Exemplarism (covenantal obligation), but modern usage often slides into Exemptionism (unique right to act).

  4.  **Drafting the Conceptual Map (Iterative Process):**

      *   *Reading 1: The Geographic/Trivial Claim.* "We are prominent."
