prompt: |-
  hey, I'm putting together notes on american exceptionalism and I keep seeing people invoke that old sermon line about being a city on a hill like it means one obvious thing. I'm pretty sure it's actually like four or five different claims smushed together. Can you lay out the precise readings? Like: is it just saying america is geographically visible and prominent (probably trivial), is it saying it's a moral model other nations should copy (exemplarism), is it saying it's uniquely chosen by provience (election), or is it saying it's especially exposed to global judgement (vulnerability)? And there's this distinction I keep thinking about -- call it exemplerism vs exemptionism -- where being a model doesn't mean you're exempt from the rules you're modelling. For each reading, say whether it's defensible, whether it's tautological, and whether it actually gets you to the normative conclusions people use it for (special rights, special obligations, license to intervene, etc.). Don't just defend one interpretation; treat it like a menu and say which ones politicians probably mean when they cite it to justify either missionary intervention or isolationist purity. Also, could the slogan ever support a critique that the US fails its own standards, or is that always a misreading? I'd like this without a bibliography -- I just want the conceptual map, and maybe point out where the slogan does work that people don't realize.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** American Exceptionalism, specifically the "City upon a Hill" metaphor (John Winthrop's sermon).
      *   **Core Task:** Deconstruct the metaphor into precise readings/claims (geographic, moral model, divine election, vulnerability/exposure).
