      *   *Reading 3: Divine Election (Chosenness).* "God picked us."
          *   Defensible? Historically yes (Puritans), theologically contentious now. Normative Yield? High. Justifies intervention (doing God's work) or isolation (keeping holy).
      *   *Reading 4: The Panopticon (Vulnerability).* "The eyes of all people are upon us."
          *   Defensible? Very strong textual support. Normative Yield? Accountability. Fear of shame.

      *   *Political Usage:*
