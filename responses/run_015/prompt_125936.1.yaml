answer: |-
  Your roommate is right that quantum computers cannot solve uncomputable problems like the Halting Problem, but he is wrong that the Church-Turing Thesis is a proven theorem rather than a hypothesis about physics.

  The core confusion lies in mixing up **computability** (what can be solved eventually, given infinite time) with **complexity** (what can be solved efficiently, in polynomial time). Turing machines, lambda calculus, and recursive functions are indeed mathematically equivalent, but that equivalence only defines a specific class of functions; it does not prove that this class captures every possible physical process in the universe. Below are the precise readings of the claim "anything that can be computed at all can be computed by a Turing machine," categorized by what they assert and whether they hold water.

  ### 1. The Formal Definition Reading
  *   **Claim:** The word "computable" is *defined* to mean "Turing-computable."
  *   **Verdict:** **Trivially True.** This is a definition, not a fact about the world.
  *   **Provable?** N/A (It is a stipulation).
  *   **Status:** In mathematical logic, this is how we operate, but it tells us nothing about physical reality or quantum mechanics.

  ### 2. The Original Church-Turing Thesis (Human Effective Methods)
  *   **Claim:** Any function that a human being can compute using a fixed, mechanical procedure (pencil and paper) is Turing-computable.
  *   **Verdict:** **Substantive but Plausible.** No counterexample has ever been found.
  *   **Provable?** **No.** Because "effective method" is an informal intuitive concept, you cannot mathematically prove it matches the formal definition of a Turing machine; you can only gather evidence.
  *   **Status:** This is what Turing and Church originally argued. It supports the equivalence of formalisms (since they all model human calculation) but does not guarantee coverage of non-human physical processes.

  ### 3. The Physical Church-Turing Thesis (PCTT)
  *   **Claim:** Any function that can be computed by any physical system or machine in our universe is Turing-computable.
  *   **Verdict:** **Substantive and Plausible.** Standard quantum computers respect this limit (they solve computable problems, just potentially faster).
  *   **Provable?** **No.** This is an empirical claim about physics. It could be falsified if we discover "hypercomputation" (e.g., a physical device that solves the Halting Problem).
  *   **Status:** This is the version relevant to your argument about quantum computers. Quantum computers do not violate this; they compute the same functions as classical machines, differing only in resource usage.

  ### 4. The Extended Church-Turing Thesis (ECTT)
  *   **Claim:** Any function that can be computed by a physical system can be computed *efficiently* (in polynomial time) by a probabilistic Turing machine.
  *   **Verdict:** **Likely False.** This is the claim quantum computing challenges.
  *   **Provable?** **No,** but it can be falsified by demonstrating a quantum advantage for a problem where classical machines provably require exponential time.
  *   **Status:** This is likely what you were intuiting. Quantum computers may violate this thesis by solving certain problems exponentially faster than classical machines, even if they don't break the basic computability limit.

  ### 5. The "Equivalence is Proof" Reading
  *   **Claim:** Because Turing machines, lambda calculus, and general recursive functions are equivalent, the Church-Turing Thesis is proved.
  *   **Verdict:** **False Reasoning.**
  *   **Provable?** **N/A.** The logic is invalid.
  *   **Status:** This is your roommate's specific error. The equivalence proves that these three *formalisms* capture the same class of functions (Recursive Functions). It does **not** prove that this class captures all *physical computation*. That requires an extra leap from math to physics.

  ***

  ### Which readings support his conclusions?

  **Conclusion 1: "Quantum computers aren't a counterexample."**
  *   **Supported by:** **Reading 3 (Physical CTT).**
  *   **Why:** Quantum computers operate within the bounds of recursive functions. They cannot solve the Halting Problem or compute non-recursive functions. If you argued they compute "things classical ones can't," you were likely thinking of efficiency (Reading 4), not computability (Reading 3). On the strict question of *what* can be computed, he is right.

  **Conclusion 2: "The equivalence of formalisms settles the matter/proves the thesis."**
  *   **Supported by:** **None.**
  *   **Why:** This relies on **Reading 5**, which is logically flawed. The convergence of formalisms shows the *concept* of computability is robust mathematically, but it does not prove that physics is bound by that mathematics. That remains an empirical hypothesis, not a theorem.
