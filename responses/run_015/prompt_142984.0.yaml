prompt: |-
  You are a professional philosopher who works on the epistemology of testimony and on metaethics, with a particular feel for the debate about moral testimony and moral deference. I'm not looking for citations, reading lists, or suggestions of what to read: I have no library access and couldn't check them anyway. I want the argument itself.

  I'm trying to work out what I actually think about taking other people's word on moral matters, and my verdicts don't line up in any way I can state. Below are eight cases where I deferred (or refused to), together with how I feel about each in hindsight. First, please brainstorm: before proposing a principle, list four or five candidate principles of quite different shapes, then score each of them against all eight cases, marking which cases it gets wrong and how badly. Only after that should you recommend anything.

  The cases:

  1. My collaborator presented a draft of mine as partly his own. I thought it was carelessness until my friend Priya told me it was a real betrayal. I accepted her verdict completely, acted on it, and to this day I couldn't say what makes it betrayal rather than sloppiness beyond the fact that she said so. Verdict: not fine. It feels like letting someone else author my resentment for me.

  2. My friend Marcus told me that going around my colleague to the dean was disloyal. I believed him, apologized, and again couldn't reconstruct the reasoning. Verdict: fine — even modest and decent of me. Note that this is the mirror image of case 1: same total deference to a friend, same lack of understanding, verdict about a wrong involving me — and it feels fine in one direction and not the other.

  3. A colleague with a disability told me that the joke in the department meeting was demeaning. I still don't quite see it, and I accepted her verdict. Verdict: fine, and not merely fine — here deferring seems to be partly what respect consists in, and asking her to first make me understand feels like an imposition.

  4. A philosopher friend I trust told me to quit a project because of how the data was collected. I quit. I can't reconstruct her argument and would be embarrassed to say in a meeting only that she told me to. Verdict: fine, but with a residue — I'd rather not have to answer for it publicly.

  5. The teacher in my religious community said my relationship was sinful. I accepted it and ended the relationship. Verdict: not fine. Structurally this looks like case 4 — an authority I regard as reliable telling me an act of mine is wrong, and me deferring — but my reaction is the opposite.

  6. As a line manager, I was told by HR that an engineer's remark counted as harassment and that suspending him was the right response. I deferred entirely and still couldn't define what made it harassment. Verdict: fine, perhaps even what I owed him and the team; trying to work it out for myself first would have been a way of stalling.

  7. My friend told me I was furious at him and shouldn't trust my read on whether he'd wronged me. I set my judgment aside. Verdict: fine. But note this deference works by removing a verdict rather than installing one, and I don't see how any principle about transmitting understanding handles it.

  8. A friend gave me the cost-per-life-saved figures for two charities, and I switched my donation. Verdict: fine, trivially — but I already believed I should do as much good as I can with the money, so arguably nothing moral was transmitted at all, and I suspect that's why some of my "fine" verdicts are cheap.

  I've been sorting these with a rough taxonomy — verdict-deference (taking someone's word that an act is wrong), relevance-deference (taking someone's word that this feature, not that one, is what matters here), and calibration-deference (taking someone's word that your response is distorted) — plus a distinction between occasional deference and standing deference, where you treat someone as an authority on a whole domain. My best tentative principle is: deference to a moral verdict is fine exactly when the testifier has standing in the matter, roughly when they are among those the verdict is about or whom it will affect. I can see that this struggles with case 4, and that it isn't obvious what it says about case 7. Please test it, repair it if it can be repaired, or replace it.

  Deliver what you think is actually true, in this form:

  - A precise statement of the principle or small set of principles you recommend, clause by clause, each clause tied to the specific case that motivates it.
  - An explicit list of which of my verdicts your principle cannot accommodate — ideally the point where a simpler principle forces me to give up a verdict, versus a more complex one that saves all eight at the cost of looking ad hoc. Say which you'd choose and why.
  - Verdicts on cases I haven't listed. In particular, two I'm genuinely torn about: (a) my teenage daughter asks whether something her friend did was wrong, and I find myself wanting simply to hand her my verdict instead of talking her through it — is that the same failure as deferring myself, or different because the deference would be hers? (b) I find an old journal entry in which I wrote that this kind of thing is wrong; I can't currently feel that it is; I defer to my earlier self. Is that deference, memory, or something else? Add at least two further cases of your own choosing — for instance deference to a crowd or majority, to an institution, or to a system that aggregates moral judgments — and say what your principle predicts.
  - Finally, be disciplined about your own confidence. Separate what is settled from what is genuinely contested: mark which parts of your answer you'd expect any competent person in this area to grant, and which are live disagreements among people who actually work on it — including where the disagreement is about what the puzzle even is. Don't present a contested view as the consensus, and say plainly which of your claims you'd expect a reasonable specialist to reject and what the strongest version of that rejection is.
