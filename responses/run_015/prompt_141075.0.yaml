answer: |-
  # The Epistemology of Guessing: An 8-Question Sort

  **Instructions:** Read each scenario. Pick the one response (A, B, or C) that matches what you would *actually* do or say in the room, not what you think sounds smart. There are no right answers, only different maps.

  ### 1. The Ceramics Studio (The Trigger)
  Your friend wants to quit her job to open a studio. She has a waiting list and a generous landlord. You know that 60% of similar craft shops close within three years.
  *   **A.** The 60% failure rate is the starting point. It moves up or down slightly based on her waiting list, but it's the gravity pulling on the decision.
  *   **B.** The 60% is about *other* people. Her waiting list and landlord deal are the actual story; the statistic is just background noise.
  *   **C.** Don't argue about the odds. Argue about whether the lease lets her quit easily if the waiting list dries up.

  ### 2. The Wedding Budget (The Anchor)
  A couple is planning a wedding. They have a spreadsheet totaling $30,000. You know the average wedding in their city costs $45,000.
  *   **A.** Tell them to raise their budget to $45,000 immediately; their spreadsheet is a fantasy.
  *   **B.** Look at their spreadsheet line-by-line. If the flowers are cheap because they're growing them, keep the $30,000 number.
  *   **C.** Assume the $45,000 average is right, but check if there are specific line items (like venue) that usually explode, and buffer only those.

  ### 3. The Running Injury (The Uniqueness)
  You tear a muscle. The internet says "6 weeks to heal." You feel great after 4 days.
  *   **A.** Stop running at week 6. Your feeling great is anecdotal; the tissue healing time is biological fact.
  *   **B.** Start running now. Your body isn't an average; pain and function are the only data that matter.
  *   **C.** Treat the "6 weeks" as a warning label for what happens if you ignore it, not a countdown timer.

  ### 4. The Grant Application (The Covariate)
  A colleague is applying for a research grant. The funding rate is 10%. Her proposal is brilliant.
  *   **A.** She has a 10% chance. Maybe 15% because it's brilliant, but the budget is fixed.
  *   **B.** The 10% is meaningless. If the proposal is brilliant, the chance is high; if it's bad, the chance is zero.
  *   **C.** Use the 10% to judge the *reviewers*, not her. What features of past winning proposals (length, topic, institution) does hers match?

  ### 5. The IT Megaproject (The Tail)
  Your company is rebuilding a core system that already failed once. The vendor says "90% chance of on-time delivery."
  *   **A.** Plan for the 10% failure. If it fails, does the company survive? That's the number that matters.
  *   **B.** Trust the 90%. They've done the work; the previous failure was a different team.
  *   **C.** Ignore the percentage. Look at the "on-time" definition. Is it a working system or just a demo?

  ### 6. The Home Reno (The Action)
  You are forecasting how long a kitchen renovation will take. You are also the one holding the hammer.
  *   **A.** Predict based on how long similar kitchens took you in the past.
  *   **B.** Predict based on the blueprint. If the blueprint says 3 weeks, you work until it's done in 3 weeks.
  *   **C.** Don't fix a date. Build the schedule so you can cook dinner even if the cabinets are late.

  ### 7. The Relationship Secret (The Reflexivity)
  You suspect a friend's partner is cheating. You estimate an 80% probability. Telling her might end the relationship immediately.
  *   **A.** Tell her the odds. The truth is the truth; the outcome is on her.
  *   **B.** Don't tell her. Your prediction becomes a weapon that changes the reality you measured.
  *   **C.** Don't predict. Ask her what she would do if she knew, and plan for that reaction instead of the cheating.

  ### 8. The Restaurant Stat (The Gerrymander)
  Someone argues, "Restaurants fail, don't do it." You want to open a bakery.
  *   **A.** Find the failure rate for *bakeries*, not restaurants. The class matters.
  *   **B.** The failure rate is a story people tell to scare entrepreneurs. Look at the cash flow.
  *   **C.** Ask who compiled the stat. If it's from a bank loan dataset, it excludes the ones that never borrowed money.

  ***

  # Scoring Key

  Tally your answers. You likely have a mix, but one pattern should dominate.

  **Mostly A (The Anchor):**
  *   **Leaf:** **Outside View as Anchor + Modest Adjustment.**
  *   **Epistemology:** You believe the world is stable enough that history repeats. You start with the base rate (the anchor) and nudge it for specifics, but you never let the specifics override the history completely. You are the brake pedal of the group.
  *   **Blind Spot:** You may underweight "black swan" innovations where the reference class truly is obsolete.

  **Mostly B (The Story):**
  *   **Leaf:** **Inside-View-Only / Uniqueness.**
  *   **Epistemology:** You believe every case is a distinct causal chain. Statistics are averages of errors; the specific details (the waiting list, the blueprint, the pain level) are the only truth.
  *   **Blind Spot:** You are vulnerable to the planning fallacy and overconfidence in your own agency.

  **Mostly C (The Architect):**
  *   **Leaf:** **Suspend Forecast (Robustness & Reversibility).**
  *   **Epistemology:** You believe prediction is often impossible or dangerous (reflexive). You focus on structural integrity: can we survive being wrong? Can we reverse the decision?
  *   **Blind Spot:** You may stall on decisions that require a leap of faith where robustness is too expensive.

  **Mixed A & C (The Bayesian):**
  *   **Leaf:** **Outside View as Prior + Inside View as Likelihood.**
  *   **Epistemology:** (Requires A on Q1/Q2 and C on Q5/Q7). You treat the base rate as a mathematical prior and the specific details as evidence that updates the probability. You care about the *distribution* (tails) not just the mean.
  *   **Blind Spot:** Can become overly mechanical; struggles when the "evidence" is qualitative.

  **Mixed A & B with Q4=C (The Hunter):**
  *   **Leaf:** **Inside View as Covariate-Hunting.**
  *   **Epistemology:** (Requires C on Q4). You don't see the "plan" as a story, but as a collection of features (covariates) that allow you to build a *new* reference class. You use the inside view to find better outside data.
  *   **Blind Spot:** Data hunger. If you can't find a matching class, you may freeze.

  **Q8=C Dominant (The Skeptic):**
  *   **Leaf:** **Borrowed-Authority Suspicion.**
  *   **Epistemology:** (Requires C on Q8, ideally Q1/Q2). You believe "outside views" are just aggregated inside views from people with different incentives. You question the source of the stat before using it.
  *   **Blind Spot:** Can lead to epistemic nihilism where no data is trusted.

  **High A on Q5 (The Risk Manager):**
  *   **Leaf:** **Outside-View-Only (Nobody is Special).**
  *   **Epistemology:** (Requires A on Q5 specifically). You believe in the aggregate over the individual, especially for systemic risks. You assume the "10% failure" will happen to *someone*, and you plan for the system, not the hero.
  *   **Blind Spot:** Can be demoralizing; ignores genuine outliers.

  ***

  # The Logical Space (For the Facilitator)

  This section maps the leaves onto the branching logic of forecasting. Use this to explain *why* the group is stuck.

  **The Branching Structure:**
  1.  **Is Prediction Possible?**
      *   *No:* **Suspend-Forecast Leaf.** (Focus on robustness/reversibility).
      *   *Yes:* Go to 2.
  2.  **Is the Reference Class Authoritative?**
      *   *No (It's biased/aggregated stories):* **Borrowed-Authority Leaf.**
      *   *Yes:* Go to 3.
  3.  **How is the "Inside" (Specifics) Used?**
      *   *Ignored (Nobody is special):* **Outside-View-Only Leaf.**
      *   *As a Story (Exception to the rule):* **Inside-View-Only Leaf.**
      *   *As Data (Features/Covariates):* **Covariate-Hunting Leaf.**
      *   *As an Adjustment/Update:* Go to 4.
  4.  **How is the Update Calculated?**
      *   *Heuristic Nudge:* **Anchor + Adjustment Leaf.**
      *   *Formal/Probabilistic Update:* **Prior + Likelihood Leaf.**

  **Empty/Incoherent Combinations:**
  *   *Inside-View-Only + Suspend-Forecast:* Incoherent. If you believe only in the specific details, you usually believe you *can* predict the outcome of those details. Suspending forecast implies the details are insufficient.
  *   *Outside-View-Only + Covariate-Hunting:* Unattractive. If nobody is special, hunting for covariates to refine the class is a waste of time.
  *   *Borrowed-Authority + Outside-View-Only:* Unexplored. If you distrust the source of the stats, you rarely rely on them as the sole authority.

  **Indistinguishable Pairs:**
  *   **Anchor+Adjustment vs. Prior+Likelihood:** In a casual conversation, these look identical. "Start with 60% failure, move to 50% because she's talented" is functionally the same as "Prior 60%, Likelihood of talent updates to 50%." The quiz cannot cleanly separate a psychological heuristic from a Bayesian calculation without mathematical rigor.

  ***

  # Where-This-Instrument-Lies (Limitations Note)

  **Expected Mis-Sorts:**
  *   **Question 3 (Injury):** This will likely mis-sort "Outside-View" people. Even hard statisticians will admit biology is individual. Expect your "Outside View" friends to pick **B** here, which falsely pushes them toward the *Inside-View-Only* leaf. *Why:* Biological healing feels more "real" than business stats.
  *   **Question 6 (Reno):** This conflates *prediction* with *planning*. Someone might pick **C** (Robustness) not because they reject forecasting, but because they are just a good project manager. This inflates the *Suspend-Forecast* leaf.

  **The Indistinguishable Pair:**
  As noted in the Logical Space, this quiz cannot reliably distinguish between **Outside View as Anchor** and **Outside View as Prior**. Both answer patterns look like "Trust the stat, tweak for details." To separate them, you would need to ask the user to write down the exact mathematical operation they performed on the probability. If they can't, they are Anchoring, not Bayes-ing.

  **What Would Redraw the Branching Structure?**
  I would redraw the map if you showed me a case where **Prediction** and **Robustness** are not mutually exclusive branches, but simultaneous requirements.
  *   *The Case:* A scenario where you *must* predict accurately to build robustness (e.g., sizing a bridge). If you can't predict the load, you can't build the robustness.
  *   *The Argument:* That "Suspend Forecast" isn't a leaf, but a prerequisite layer. You suspend *certainty*, not *estimation*. If you can demonstrate that your "Suspend" group actually makes *more precise* estimates because they aren't attached to them, the tree needs to branch on *Attachment to Outcome* rather than *Method of Estimation*.

  **A Fair Complaint:**
  Your friends will complain that **Question 8 (The Restaurant Stat)** is a "gotcha." Option C (Ask who compiled the stat) is the only "sophisticated" answer, making it a magnet for people who want to sound smart rather than answer honestly. Warn them: "Pick the one you'd actually do at 11 PM on a Tuesday, not the one you'd write in a textbook."
