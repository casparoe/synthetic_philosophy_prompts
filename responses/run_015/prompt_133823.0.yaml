answer: |-
  **Top Tier: Genuinely Destabilising**

  1.  **Natural selection crafting the vertebrate eye:** This is the most radical inversion because it explains the origin of comprehending minds as the product of a process that possesses no comprehension itself, undermining the intuition that design requires a designer.
  2.  **A Turing universal machine running chess code:** This threatens the core definition of reasoning by demonstrating that semantic understanding is not required for syntactic manipulation to produce intelligent outcomes.

  **Middle Tier: Interesting but Containable**

  3.  **A blindsight patient navigating round obstacles:** This is containable because we can locate the necessary comprehension in the unconscious neural processing even if the conscious subject lacks access to it.
  4.  **A human calculator savant who produces correct answers instantly:** This belongs here because it is closer to ordinary expert skill than to a Turing machine, likely relying on compressed, implicit understanding rather than pure syntax without semantics.

  **Bottom Tier: Not Really an Inversion, Just a Stretched Metaphor**

  5.  **An ant colony solving path-finding problems:** This lands at the bottom because folk psychology never attributed individual understanding to ants in the first place, so calling their collective behaviour "intelligence" is more metaphorical than threatening to our self-conception.

  ***

  **Radicalness Scores**

  *   **Darwin's Case (Natural Selection): 10/10**
  *   **Turing's Case (Universal Machine): 9/10**

  Darwin scores higher because his mechanism explains the existence of the designers themselves, whereas Turing's mechanism only explains the operation of systems that designers (already explained by Darwin) might build. Darwin naturalizes the source of comprehension, while Turing mechanizes the process of comprehension; the former is the prerequisite for the latter, making it the more foundational overturning of intuition.
