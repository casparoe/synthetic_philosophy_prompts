  (3) Because of (2) I use what I call the washout rule: treat the inscrutable long-run remainder as mean-zero and independent of whatever I can measure short-run, so the measured near-term difference is an unbiased estimate of the total difference. In practice this means I give to global health stuff with RCT backing and roughly nothing to longtermist x-risk stuff.
  (4) Cluelessness gives you no reason whatever to fall back on the status quo or commonsense morality: doing nothing is also an act with inscrutable effects, so "we're clueless, therefore do what everyone does" is just a fallacy.
  (5) And I don't accept any anti-fanaticism patch: if a 0.001% chance of an astronomically large payoff falls out of a model I trust, I take it.

