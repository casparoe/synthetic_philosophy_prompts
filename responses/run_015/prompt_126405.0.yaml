answer: |-
  You have put your finger on the central anxiety of modern historiography. Your intuition is correct: **the line between importing concepts and importing values is porous, often invisible, and fiercely debated.**

  Historians generally distinguish between two types of presentism, but as you've noticed, they tend to bleed into one another. Here is the breakdown of that conceptual knot.

  ### 1. The Theoretical Distinction
  To answer your question directly: **Yes, there is a theoretical line, but it is practically unstable.**

  *   **Moral Presentism (Normative):** This is judging past actors by modern ethical standards.
      *   *Example:* Calling Thomas Jefferson a "hypocrite" for owning slaves while writing about liberty.
      *   *The Warning:* Historians avoid this because it shuts down understanding. If we just condemn, we stop asking *why* they thought that was acceptable.
  *   **Conceptual Presentism (Analytical):** This is using modern categories to describe past phenomena.
      *   *Example:* Calling a Roman triumphal parade "political communication" or a medieval guild strike "labor organization."
      *   *The Defense:* Historians argue this is necessary. We cannot speak only in the "emic" (insider) terms of the past because we are not them. We need "etic" (outsider) analytical tools to make the past intelligible to a modern audience.

  ### 2. Why the Line Bleeds (The Knot)
  The problem is that **concepts are not neutral containers; they carry ontological baggage.** When you import a concept, you often inadvertently import a worldview (and thus, values).

  Here is how the bleed happens in your specific examples:

  **A. "Political Legitimation"**
  *   **The Concept:** Implies that power is separate from the person holding it, and that the ruler needs to *convince* the ruled that they have a right to rule.
  *   **The Bleed:** In many ancient societies (e.g., Divine Kingship in Egypt), the King *was* the state. He didn't need "legitimation" in the modern sense; he was a cosmic necessity. By calling it "legitimation," you imply a modern separation of church and state, or a modern suspicion of power, that didn't exist. You have imported a **political value** (that power must be justified) via a **concept**.

  **B. "Identity Work"**
  *   **The Concept:** Implies that "identity" is something fluid, constructed, and performed by individuals or groups.
  *   **The Bleed:** "Identity" is a profoundly modern, psychological, and individualistic category. An ancient Spartan didn't "work on his identity"; he *was* a Spartan by blood and law, with no conceptual framework for "self-actualization." Using this term risks imposing modern individualism on a collectivist past.

  ### 3. The "Heuristic Necessity" Argument
  So, if concepts carry values, why do historians keep using them?

  The argument is **Heuristic Necessity**. We literally lack the vocabulary to describe the past without anachronism.
  *   If we refused to use the word "economy" because the Greeks didn't have a concept of macroeconomics, we couldn't discuss trade.
  *   If we refused to use "religion" because the Romans didn't separate "religious" acts from "civic" acts, we couldn't discuss rituals.

  Historians like **Quentin Skinner** (Cambridge School) argue that we must use these concepts, but we must treat them as **models**, not truths. We say, "If we look at this ritual *as if* it were identity work, we see X." We don't say, "This ritual *was* identity work."

  ### 4. Where the Danger Lies: "Semantic Loading"
  The knot tightens when a concept smuggles in a judgment disguised as analysis. This is where conceptual presentism becomes moral presentism.

  *   **Example:** Calling a medieval inquisitorial procedure "torture."
      *   *Analytically:* It is physically inflicting pain to extract information. The concept fits.
      *   *Normatively:* The word "torture" today carries a heavy moral load of "illegitimate state violence." In the 13th century, it was "legitimate judicial procedure."
      *   *The Result:* By using the modern concept "torture," you have subtly judged the society as barbaric, even if you didn't explicitly say "they were bad."

  *   **Example:** Calling a monarch's court factionalism "corruption."
      *   *Analytically:* It involves the misuse of public office for private gain.
      *   *Normatively:* "Corruption" implies a violation of a public/private divide. In a patrimonial kingdom, the King's private purse *is* the public treasury. There is no "corruption" possible because there is no "public" to steal from.
      *   *The Result:* You have judged them by a liberal-democratic standard of governance using a structural concept.

  ### 5. How Historians Try to Untie It
  Since we can't eliminate presentism (we are present people), the best historians practice **Reflexivity**.

  1.  **Acknowledge the Anachronism:** Good historians will write, "While the term 'state' is anachronistic, it is useful here to describe..." This signals to the reader: *I know this concept doesn't belong here, but I'm using it as a flashlight.*
  2.  **Thick Description:** Instead of just labeling a ritual "legitimation," they describe the specific beliefs that made it work. This grounds the modern concept in the ancient reality.
  3.  **Conceptual History (Begriffsgeschichte):** Scholars like **Reinhart Koselleck** study the history of concepts themselves. They remind us that "freedom," "war," and "politics" meant different things in different times.

  ### Summary
  You are right to feel uneasy. **There is no clean firewall between concepts and values.**

  *   **Concepts shape perception:** If you look for "class struggle," you will find it. If you look for "social harmony," you will find that.
  *   **Values hide in definitions:** Defining something as "terrorism" vs. "insurgency" is a conceptual choice that is entirely moral.

  The goal of professional history isn't to achieve a "view from nowhere" (which is impossible), but to be **honest about the lens.** When a historian uses "identity work" to describe an ancient ceremony, they should be aware they are projecting a modern psychological framework onto a pre-modern social structure.

  If they don't acknowledge that tension, they aren't doing history; they're doing **projection.** If they do acknowledge it, they are using presentism as a tool rather than a trap.
