answer: |-
  hey, sounds like you and Jake hit the classic Susan Wolf nerve. honestly that tension is the whole engine of modern virtue ethics debates. since you want them to *feel* it before you name it, you need a game that forces a trade-off between "looking good to the group" and "feeding your own hidden needs."

  here's a setup called **"The Token Life."** it's designed to make the utilitarian demand clash with their private profiles without you ever saying "utilitarianism" until the debrief.

  ### The Setup (10 mins)
  *   **Materials:** 150 poker chips (Time Tokens), 15 Hidden Profile Cards, Whiteboard.
  *   **Hidden Profiles:** Each student gets a card face down. It lists 3 things that give them "Private Satisfaction Points" (PSP): *Artistic Work, Family Time, Travel.*
      *   Rule: You gain 10 PSP for every token you keep for yourself that matches a preference on your card. 0 PSP if you spend it elsewhere.
      *   **Crucial:** They are told *not* to reveal their card contents yet.
  *   **The Goal:** You announce the group mission: "Maximize the Global Welfare Score (GWS)."
      *   GWS is calculated by tokens donated to **Strangers** (a real $50 donation pool you hold, released only if GWS hits a threshold) and **Friends** (tokens given to other players to boost *their* projects).
      *   Personal tokens count as **0** toward GWS.
  *   **The Reward:**
      1.  **Public:** If GWS hits the threshold, the class gets the donation matched. Plus, the top 3 contributors (most tokens given) get veto power on next week's snack.
      2.  **Private:** At the end, they anonymously submit their PSP total. You tell them "high PSP means you enjoyed the workshop more."

  ### The Negotiation (30 mins)
  let them loose. they have to decide how to split the 150 total tokens between the "Stranger Bucket," "Friend Allocations," and "Personal Pockets."

  *   **The Trap:** To get the snack vote (Social Credit), you need to give tokens away. To get Private Satisfaction (not feeling empty), you need to keep them.
  *   **The Pressure:** Since it's grad students, they'll talk. some will argue "we need to hit the donation threshold!" (maximal goodness). others will whisper "but i actually want to keep some for my art project."
  *   **Observer Role:** You walk around. if someone is hoarding tokens, gently ask "are you sure that helps the Global Score?" if someone is giving everything away, ask "what happens to your profile?"

  ### The Reveal & Scoring (10 mins)
  1.  Count the GWS. Did you hit the donation threshold?
  2.  Announce the Snack Winners (the Saints).
  3.  Ask for a show of hands: "Who ended with 0 Personal Tokens?"
  4.  **The Kicker:** Hand out a slip of paper. ask them to write one word describing how they feel about their allocation choices. collect them. read 3-4 aloud. usually you get "proud," "drained," "guilty," or "resentful."

  ### The Debrief (40 mins)
  this is where you map the feelings to the theory without lecturing.

  1.  **The Wolf Move:** ask the "Saints" (0 personal tokens): "You maximized the Good. You won the snack vote. Did anyone feel *good*? or just relieved it's over?"
      *   *Map to Wolf:* This is the "moral saint" problem. if moral goodness crowds out personal pursuits, the life becomes one-dimensional. Wolf says we lose the ability to be interesting people.
      *   *Map to Defenders:* Ask if anyone *liked* giving it all away. if yes, that's the "joyful saint" counter-argument (stocker/etc.)—that virtue aligns with desire.
  2.  **The Self-Protectors:** ask those who kept tokens: "Did you feel guilty when others were contributing?"
      *   *Map to Integrity:* This hits the Bernard Williams vibe—does morality demand we abandon our ground projects?
  3.  **The Phenomenology:** Read the anonymous words ("drained," "guilty"). point out that the *feeling* of sacrifice is the data. if morality feels like crushing your self, is it sustainable?

  ### What Will Predictably Go Wrong
  first run? expect system hacking.
  1.  **Collusion:** they'll try to agree "everyone give 5 tokens" so everyone gets equal social credit. this kills the tension. *Counter:* forbid explicit agreements on amounts. only discuss "needs."
  2.  **Ignoring the Cards:** half of them will treat the Hidden Profile as flavor text and go full utilitarian because "we're supposed to be philosophers." *Counter:* remind them halfway through that "Private Satisfaction" affects their experience of the workshop. make it about *their* enjoyment, not just points.
  3.  **The Free Rider:** someone keeps all tokens, lets others hit the donation threshold, then claims they needed them for "Family." *Counter:* call this out in debrief as the "rational agent" vs "virtuous agent" split.

  ### What The Game Can't Reproduce (Be Frank Here)
  you gotta tell them this so they don't think the game is the whole argument.
  1.  **Character Erosion:** 30 mins isn't a life. virtue ethics is about habit. the game doesn't show how being a saint for 10 years makes you boring or brittle. you have to supply that narrative.
  2.  **Real Sacrifice:** tokens aren't hours. giving up a poker chip doesn't hurt like giving up a weekend with your kid. the *phenomenology of loss* is muted.
  3.  **The Unified Self:** Wolf's point is partly about what makes a person *whole*. in the game, the "self" is just a card. in real life, your projects *constitute* who you are. if you sacrifice them, you aren't just losing points, you're losing yourself.

  keep the vibe loose. if they start arguing about the rules, let them—that's the moral friction you want. good luck thursday, hope you win the snack vote.
