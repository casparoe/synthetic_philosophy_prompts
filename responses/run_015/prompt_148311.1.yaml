answer: |-
  At the Bureau of States of Affairs, new hire Bertrand is trying to process a claim.

  "I'm stuck on file #42: 'Socrates is mortal'," Bertrand tells his boss, Francis.

  "What's the holdup?" Francis asks.

  "I listed the terms: Socrates, Mortality. But the system says it's just a list, not a fact. It needs a unifying factor."

  "Ah, the Copula. Did you try stamping 'Is' between them?"

  "I did. But now 'Is' is just another term in the list. Socrates, Is, Mortality. Still no unity."

  "Right. So you need a second relation to bind 'Is' to Socrates."

  "And a third to bind that relation to the second?"

  "Welcome to the Regress, Bertrand. It's standard protocol for External Relations."

  "Is there any way to finish the file today?"

  "Sure," Francis says. "Switch to Internal Relations. Claim Socrates and Mortality are actually the same thing. That the distinction is an illusion."

  "But Socrates is clearly distinct from Mortality."

  "Not in the Absolute," Francis shrugs. "Just melt the two forms together with wax. Once they're one lump, no relation is needed."

  "That seems like destroying the evidence."

  "It's metaphysics, not accounting. Either you have an infinite chain of supervisors, or you admit there's only one Supervisor in the whole building."

  Bertrand looks at the stack. "I'll start on Form #3."

  "Smart. I'll go home. Since there's only one Substance, I'm already there."

  ***

  **Self-Critical Note:**

  Okay, so the joke leans pretty hard on the "vulgate" reading of Bradley. Bradley didn't exactly suggest we melt forms together as a practical fix; he used the regress to show that relations (and therefore pluralism) are unintelligible *period*, leading to Monism. The joke treats the regress as a bureaucratic hurdle Russell is trying to clear, but for Bradley, the regress was a *reductio* that proved relations are unreal. Also, Russell's actual struggle with the unity of the proposition led him to the Multiple Relation Theory of Judgment (where the mind does the unifying), which I glossed over for the sake of the "stamp" analogy. And honestly, Francis leaving because "he's already there" is a bit of a cheap shot at the Absolute—it's more that distinctions are appearances within the whole, not that spatial location dissolves. But hey, it's a office joke, not a dissertation. Typo: shouldve said "buereaucracy" earlier to match the vibe.
