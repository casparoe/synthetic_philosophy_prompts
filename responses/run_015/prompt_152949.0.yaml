answer: |-
  ### Workshop Plan: The Provenance-Stewardship Gap
  **Duration:** 90 Minutes
  **Audience:** Graduate Design & Engineering Students
  **Core Distinction:** Provenance (Pathway/Origin) vs. Stewardship (Labor/Risk/Refinement)

  ---

  ### 1. The Explanatory Arc & Prior Idea
  **The Prior Idea to Secure (Minutes 0–15): The Non-Discreteness of Ideas**
  Before you can introduce the gap between *Provenance* and *Stewardship*, you must dismantle the assumption that an idea is a discrete, static object (like a stone) that can be picked up and held. If students view ideas as objects, they will default to physical possession metaphors (finders keepers).

  *   **The Concept:** You must secure the agreement that **all innovation is recombinant and iterative.** An idea is not a point in time; it is a vector.
  *   **How to Secure It:** Begin with a 10-minute "Lineage Mapping" exercise. Pick a mundane object in the room (e.g., a zipper, a touch screen). Ask students to trace its intellectual ancestry back three steps. (e.g., Touch Screen → Capacitive Sensors → Piezoelectric Effect → Discovery of Quartz properties).
  *   **The Takeaway:** Once they acknowledge that every "new" idea is a mutation of prior social and mental states, *Provenance* becomes clearly defined as a messy, shared pathway rather than a single moment of genesis. This creates the vacuum necessary for *Stewardship* to enter as the counter-weight.

  ---

  ### 2. The Concrete Scenario
  **The Scenario: "The Haptic Home Button" (Minutes 15–60)**
  Do not use a real-world case study with known legal outcomes (e.g., Apple vs. Samsung), as this triggers hindsight bias and legal googling. Use a detailed hypothetical that mirrors reality.

  *   **The Narrative:**
      *   **2008:** A graduate student (Designer A) writes a thesis proposing that physical buttons should disappear and be replaced by a pressure-sensitive surface that *feels* like a click using vibration. She sketches the user flow and describes the sensory experience. She builds a crude cardboard prototype that does not work electronically.
      *   **2010:** An engineering team (Team B) at a startup picks up the thesis. They spend 18 months and $2M developing a specific linear actuator small enough to fit in a phone casing that can mimic the click without moving.
      *   **2012:** A massive corporation (Corp C) licenses the tech. They refine the tolerance levels so the button doesn't fail after 10,000 presses and integrate it into a global supply chain.
      *   **2014:** The feature launches. It is a massive success.
      *   **2015:** Designer A sues, claiming she invented it. Team B claims they made it possible. Corp C claims they made it reliable.

  *   **What It Must Include:**
      *   **The "Spark":** Clear evidence of the initial conceptualization (Designer A's thesis).
      *   **The "Grind":** Specific technical barriers overcome by Team B (e.g., power consumption, heat, size).
      *   **The "Scale":** The risk taken by Corp C (manufacturing investment, warranty liability).
      *   **The "User Value":** Confirmation that the feature is only useful because *all three* stages occurred.

  *   **What It Must Deliberately Omit:**
      *   **Contractual Details:** Do not mention NDAs, employment contracts, or university IP policies. This forces a philosophical, not legal, judgment.
      *   **Financial Payouts:** Do not reveal how much money was made or lost. This prevents utilitarian "incentive" arguments from dominating.
      *   **Patent Filings:** Do not mention who filed what. This prevents the "first to file" heuristic from short-circuiting the discussion.

  ---

  ### 3. Misconceptions & Intervention Points
  Listed in the order they will likely surface, with the specific intervention strategy.

  | Order | Misconception | When it Surfaces | How to Head It Off |
  | :--- | :--- | :--- | :--- |
  | **1** | **The "Lone Genius" Fallacy**<br>*(Mental Ownership)*<br>"The person who thought of it first owns the value because the idea is the seed." | **Minutes 20–30**<br>(During the definition of Provenance) | **Intervention:** Remind them of the "Lineage Mapping" exercise. Ask: "Did Designer A invent vibration? Did she invent pressure sensors?" Reframe Provenance not as *ownership of origin* but as *acknowledgment of lineage*. |
  | **2** | **The "Open Source" Equivocation**<br>*(Collective Invention)*<br>"If everyone contributed, no one can own it. It belongs to the commons." | **Minutes 45–50**<br>(During the analysis of Team B's labor) | **Intervention:** Distinguish between *contribution* and *accountability*. Ask: "If the button fails and burns a user's pocket, who is liable?" Stewardship requires a specific entity to hold the risk. The commons cannot be sued; a steward can. |
  | **3** | **The "Market Justification"**<br>*(Economic Reward)*<br>"Corp C deserves ownership because they made it successful/profitable." | **Minutes 60–70**<br>(During the evaluation of outcomes) | **Intervention:** Decouple *success* from *right*. Ask: "If Corp C had launched it and it failed, would they still deserve ownership of the underlying tech?" Force them to justify ownership based on the *nature of the work*, not the *market result*. |

  ---

  ### 4. The Final Check (Minutes 75–90)
  **The "Split-Title" Exercise**
  To verify they understand the *gap* rather than just picking a side on IP, do not ask "Who owns this?" Instead, ask them to unbundle the rights.

  *   **The Task:** Present a new, brief variation of the scenario where the Steward (Engineer) and the Provenance Holder (Designer) are in conflict. Ask the students to draft a **Two-Part Attribution Clause**.
      1.  **Part A (Provenance Right):** Who gets their name on the feature forever? (e.g., "The Brichter Button").
      2.  **Part B (Stewardship Right):** Who has the right to modify, license, or kill the feature? (e.g., The Company holding the liability).
  *   **Success Criteria:**
      *   **Failure:** They assign both Part A and Part B to the same entity automatically (conflating the gap).
      *   **Failure:** They argue that Part A implies Part B (believing naming rights dictate control).
      *   **Success:** They explicitly argue that the *Designer* deserves permanent credit (Provenance) while the *Engineer/Company* retains the right to alter or discontinue the tech (Stewardship), acknowledging that these are separate moral claims requiring separate settlements.

  ---

  ### 5. Doctrines to Explicitly Set Aside
  At the start of the session (Minute 5), write these on the board and declare a **"Conceptual Moratorium."** Explain that these are valid tools for lawyers and economists, but they pre-determine the answer to the philosophical question you are asking.

  1.  **"First to File" (Patent Law):** This privileges administrative speed over conceptual origin or labor value.
  2.  **"Expression vs. Idea" (Copyright Law):** This creates a binary that ignores the spectrum of refinement (Stewardship).
  3.  **"Lockean Labor-Mixing" (Natural Law):** The theory that mixing labor with resources grants ownership. (This conflates Stewardship with automatic ownership, which you want to problematize).
  4.  **"Incentive Theory" (Law & Economics):** The argument that IP is needed to encourage innovation. (This justifies ownership based on future utility, not the Provenance/Stewardship distinction).
  5.  **"Work for Hire" (Contract Law):** This resolves the issue via bureaucracy rather than ethical reasoning.

  **Instructor Note:** If a student invokes these, acknowledge the validity of the doctrine in court, but gently return them to the workshop's frame: *"That is how the law settles it. But does the law correctly map the moral gap between where the idea came from and the work required to keep it alive?"*
