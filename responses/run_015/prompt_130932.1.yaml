      *   *Phase 2: Supervaluationist Robustness (The Range).* Check if the essay survives different interpretations.
      *   *Phase 3: The Indeterminacy Handoff.*

  4.  **Drafting the Checklist Steps:**
      *   *Criterion A: Original Argument.*
          *   Epistemic view: Is there a distinct proposition $P$ that is not in the textbook? Yes/No.
          *   Supervaluation view: Is $P$ novel under *all* reasonable definitions of "novel"? Or just some?
      *   *Criterion B: Adequate Evidence.*
          *   Epistemic view: Count citations. 3 distinct sources = Adequate. 2 = Inadequate. (Arbitrary but sharp).
          *   Supervaluation view: Does the evidence support the claim under *all* reasonable interpretations of "support"?

      *Refining for Time (4 mins):* I can't get too bogged down. I need a flowchart style.
      *   *Decision Point 1 (Epistemic Hard Stop):* Minimum viable product.
      *   *Decision Point 2 (Supervaluationist Sweep):* Is it robustly passing?
      *   *Decision Point 3 (The Gap):* Send to co-teacher.

  5.  **Developing the Three Test Cases:**
      *   *Essay 1 (Novel/Barely Supported):* High Originality, Low Evidence.
