          1.  Novel claim, barely supported.
          2.  Competently argued, totally derivative.
          3.  Evidence right on the cutoff.
      *   **Constraint 3 (Outcome):** One outcome must be unsatisfactory/hated (e.g., derivative essay scores high on one axis but fails overall due to the procedure).
      *   **Constraint 4 (Limitations):** End with what the procedure *can't* do (second-order vagueness, fatigue/consistency issues).
      *   **Tone:** Practical, philosophical, slightly weary (teacher grading 30 papers), rigorous but usable.

  2.  **Deconstruct the Theoretical Framework:**
      *   *Epistemicism:* Vagueness is ignorance. There *is* a sharp cutoff (e.g., exactly 75% is "adequate"), we just don't know it.
          *   *Grading Implication:* We must act *as if* there is a sharp line to ensure consistency. We need hard thresholds. If it's below the line, it's a fail, even if it feels close.
      *   *Supervaluationism:* Vagueness is semantic indeterminacy. There is no single sharp cutoff; there are many "precisifications" (reasonable ways to make it precise). A statement is "super-true" if it's true on *all* admissible precisifications.
          *   *Grading Implication:* We look for robustness. Does this essay pass on *any* reasonable interpretation of "adequate"? If it passes some but fails others, it's indeterminate (needs human judgment/co-teacher).

  3.  **Develop the Decision Procedure (The "Hybrid" Approach):**
      *   I need a workflow that incorporates both.
      *   *Step 1 (Epistemic Filter):* Set hard minimums. This handles the "4-minute" constraint. Most papers will be clear passes or fails.
      *   *Step 2 (Supervaluationist Check):* For borderline cases, check if it passes *any* reasonable standard. If yes, it might be salvageable. If no, it's a hard fail.
      *   *Step 3 (The Handoff):* If the result varies depending on how you precisify "originality" or "evidence," that's the "values call" for the co-teacher.

      *Wait, the prompt asks to see how each theory would **actually change the checklist**.*
