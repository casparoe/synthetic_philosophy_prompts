          *   Supervaluation Rule: "Adequate" = True on all admissible precisifications of evidence quality.
      *   *Wait, if I use Supervaluation for "Adequate", that takes too long.*
      *   *Revised Plan:*
          *   **Epistemic Track:** Used for the "Auto-Pass/Auto-Fail" to save time. Assumes a hidden sharp line exists, so we pick one (e.g., 3 citations) and stick to it.
          *   **Supervaluation Track:** Used for the "Borderline" zone. If a paper is true on *some* precisifications but not *all*, it goes to the co-teacher.
