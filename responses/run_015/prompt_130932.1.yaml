answer: |-
  Here is the decision procedure. It is designed for a 4-minute per paper throughput, but it forces you to commit to a metaphysical stance at specific decision nodes.

  ### The Metaphysical Setup

  You have two vague predicates: **Originality ($O$)** and **Evidence ($E$)**.

  1.  **The Epistemic Track (Speed & Consistency):** Assumes there *is* a sharp cutoff for $O$ and $E$, even if we don't know exactly where it is. To grade 30 papers, we must *stipulate* the cutoff. This treats vagueness as ignorance.
      *   *Operational Rule:* We set a hard threshold. If $x < threshold$, it is False. No appeals to "degree."
  2.  **The Supervaluationist Track (The Handoff):** Assumes there is *no* sharp cutoff. $O$ and $E$ are true only if they hold across all "admissible precisifications" (reasonable interpretations).
      *   *Operational Rule:* If a paper passes on some reasonable interpretations but fails on others, it is **Indeterminate**. Do not grade it. Hand it to the co-teacher.

  ---

  ### The 4-Minute Decision Procedure

  **Minute 1: The Epistemic Hard Stop (Evidence)**
  *Assumption: There is a specific number of sources/quality points that constitutes "Adequate." We just have to pick it.*
  1.  **Count Distinct Sources:** Are there $\ge 3$ distinct, relevant citations?
      *   **No:** Mark $E$ = **False**. (Stop. Paper cannot pass).
      *   **Yes:** Proceed to Quality Check.
  2.  **Quality Check:** Does every citation directly support a premise? (Yes/No).
      *   **No:** Mark $E$ = **False**.
      *   **Yes:** Mark $E$ = **True**.
      *   *Epistemic Justification:* We are ignoring the "heap" problem. 3 sources is the line. 2.9 sources is a fail. We pretend we know the boundary.

  **Minute 2: The Epistemic Hard Stop (Originality)**
  *Assumption: "Original" has a binary extension. A claim is either in the set of "Class Materials" or it is not.*
  1.  **The Textbook Test:** Is the central thesis explicitly stated in the assigned reading or lecture notes?
      *   **Yes:** Mark $O$ = **False**. (Derivative).
      *   **No:** Proceed to Synthesis Check.
  2.  **Synthesis Check:** Does the student combine two class concepts in a way not explicitly modeled by the teacher?
      *   **No:** Mark $O$ = **False**.
      *   **Yes:** Mark $O$ = **True**.
      *   *Epistemic Justification:* We are treating originality as a fact of the matter regarding information containment. Either the proposition is in the dataset (class) or it isn't.

  **Minute 3: The Supervaluationist Sweep (Borderline Detection)**
  *Assumption: Some papers are neither clearly True nor clearly False. They depend on how you precisify "Adequate" or "Original."*
  1.  **Review the "False" Marks:** If you marked $E$ or $O$ as **False**, ask: "Is there *any* admissible interpretation where this is True?"
      *   *Example:* They have 2 sources, but one is a primary text worth "double." Is that a reasonable precisification of "Adequate"?
      *   **If Yes (It's debatable):** Mark status as **Indeterminate**.
      *   **If No (It's clearly insufficient):** Confirm **False**.
  2.  **Review the "True" Marks:** If you marked both **True**, ask: "Is there *any* admissible interpretation where this is False?"
      *   *Example:* The argument is novel, but barely coherent. Is "coherence" part of the precisification of "Argument"?
      *   **If Yes:** Mark status as **Indeterminate**.

  **Minute 4: Scoring and Handoff**
  *   **If $E$ = True AND $O$ = True:** Grade A/B range.
  *   **If $E$ = False OR $O$ = False (and not Indeterminate):** Grade C/F range (per rubric weighting).
  *   **If Status = Indeterminate:** **STOP.** Do not assign a grade. Place in "Co-Teacher Pile."
      *   *Supervaluationist Justification:* Since truth is defined as truth across *all* precisifications, and we found a precisification where the grade changes, there is no super-truth value here. It is a values call, not a fact.

  ---

  ### Application to Three Essays

  #### Essay 1: The "Visionary Mess" (Novel Claim, Barely Supported)
  *   **Content:** Argues that Kant's Categorical Imperative applies to AI rights (not in class materials). Uses only 2 sources (Kant text + one blog post).
  *   **Epistemic Track:**
      *   Evidence: 2 sources. Threshold is 3. **$E$ = False.**
      *   Originality: Thesis not in notes. **$O$ = True.**
  *   **Supervaluationist Sweep:**
      *   Is there a precisification where 2 sources (one primary) is "Adequate"? Yes, arguably.
      *   **Status:** **Indeterminate.**
  *   **Outcome:** Handoff to co-teacher.
  *   **Why:** Epistemicism says "Fail the count." Supervaluationism says "Wait, that blog post might count on some definitions." The conflict creates indeterminacy.

  #### Essay 2: The "Perfect Parrot" (Derivative, Competently Argued)
  *   **Content:** Perfectly restates the teacher's lecture on Utilitarianism. Flawless structure. 5 high-quality sources.
  *   **Epistemic Track:**
      *   Evidence: 5 sources. **$E$ = True.**
      *   Originality: Thesis is verbatim from lecture slide 4. **$O$ = False.**
  *   **Supervaluationist Sweep:**
      *   Is there *any* admissible precisification of "Original" where restating a lecture counts?
      *   *Check:* Does "Original" mean "New to the student" or "New to the discourse"? The rubric implies the latter (philosophical argument). On *all* reasonable precisifications of academic originality, regurgitation is not original.
      *   **Status:** **False.** (Not Indeterminate).
  *   **Outcome:** **Procedure Forces a Fail (or max C).**
  *   **The Hated Result:** You know this student worked hard. The evidence is superb. But because Epistemicism demands a sharp boundary on Originality, and the boundary is "Not in Lecture," this paper hits the sharp line and falls off. The procedure does not allow "Excellent Evidence" to compensate for "Zero Originality" because the rubric treats them as necessary conditions (AND gate), not weighted averages. The metaphysics of the sharp cut overrides your pedagogical desire to reward effort.

  #### Essay 3: The "Heap" (Evidence on the Cutoff)
  *   **Content:** Standard argument. Uses exactly 3 sources. One source is a Wikipedia article.
  *   **Epistemic Track:**
      *   Evidence: 3 sources. Threshold is 3. **$E$ = True.**
      *   Originality: Standard synthesis. **$O$ = True.**
  *   **Supervaluationist Sweep:**
      *   Is there a precisification of "Adequate Evidence" where Wikipedia disqualifies the count? Yes, most academic precisifications exclude it.
      *   Is there a precisification where it counts? Yes, some introductory contexts allow it.
      *   **Status:** **Indeterminate.**
  *   **Outcome:** Handoff to co-teacher.
  *   **Why:** Under Epistemicism, 3 is 3. Pass. Under Supervaluationism, the *quality* of the 3 matters. Since reasonable people disagree on Wikipedia, it lacks "Supertruth."

  ---

  ### What This Procedure Cannot Do

  **1. Resolve Second-Order Vagueness**
  This procedure assumes we can identify the "Borderline" cases (the Indeterminate pile). But where is the boundary between the "Clear Fail" and the "Borderline"?
  *   *The Problem:* Essay 1 had 2 sources. Essay 3 had 3 (one weak). Is there a sharp line between "Clearly Inadequate" and "Borderline Adequate"?
  *   *The Limit:* The procedure pushes the vagueness back one step. You now have vagueness about which papers go into the Co-Teacher Pile. You cannot solve second-order vagueness with a checklist; you just outsource it.

  **2. Combat Grading Fatigue (The Sorites of Exhaustion)**
  Epistemicism relies on consistency (the sharp line stays sharp). But you are human.
  *   *Paper #1:* You strictly enforce the "3 sources" rule.
  *   *Paper #30:* You are tired. You count a bibliography entry as a source. You have shifted the sharp boundary without realizing it.
  *   *The Limit:* The procedure assumes the grader is a rigid function. You are not. Over 30 papers, your "Epistemic Threshold" will drift. Supervaluationism admits this drift (there is no single boundary), but the procedure demands you act as if there is one. This creates a tension between the metaphysics of the rubric and the psychology of the grader.

  **3. Value the "Derivative" Skill**
  As seen in Essay 2, the procedure cannot capture the pedagogical value of mastering existing arguments before creating new ones. Epistemicism forces a binary on Originality. It cannot grade "Competent Reproduction" as a positive value, only as a lack of Originality. If your goal is to teach philosophy, rewarding the "Perfect Parrot" might actually be useful in year 1, but the logic of the rubric (grounded in sharp boundaries) punishes it. The metaphysics of the grading scheme conflicts with the pedagogy of scaffolding.
