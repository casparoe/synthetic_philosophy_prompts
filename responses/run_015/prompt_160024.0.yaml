prompt: |-
  I serve on the peer review panel of a volunteer emergency medical service, and for the past two years we have kept what we call the near-miss ledger: every deviation from protocol that a crew member reports or that a supervisor observes is logged, coded by type (documentation lapse, scope-of-practice overreach, procedural shortcut under time pressure, equipment-check omission, handoff failure), and weighted by severity and frequency, so that each member ends up with a rolling deviation score. When the panel censures someone, we have been operating under a rule I drafted and that the rest of the panel more or less accepted: the Clean Hands Rule, which says that a member has standing to blame another for a deviation only if her own record contains no deviation of the same type or of any type morally comparable to it, that standing is a scalar quantity which is depleted in proportion to how serious and how frequent one's own deviations have been, and that a member who has spent her standing can earn it back only by self-reporting her own comparable deviation in open session before delivering the censure — the idea being that self-blame is what makes hypocritical blame permissible again.

  The trouble is that when we finally ran the numbers last month, the ledger put every single member of the panel above zero, and the comparability relation turned out to be far more promiscuous than I expected: "procedural shortcut under time pressure" is arguably comparable in the relevant respect to most of the other codes, since almost every deviation is a case of trading a protocol requirement for a saving in time, and once you allow partial comparability the scalar view seems to imply that a member with three logged shortcuts has, say, sixty percent of the standing she started with rather than none. So under my own rule it looks as though almost nobody on the panel has full standing to censure almost anybody, and because we have always assumed without discussing it that a finding of blameworthiness requires that the person making the finding have standing, we appear to be committed to dropping every case currently in front of us — including one in which a crew chief skipped a mandatory pre-transport check and the patient was harmed. My colleagues have started treating standing as a scarce resource to be allocated: one of them proposes that we aggregate the panel's standing and route the censure through whichever member has the cleanest record on the relevant code, in effect treating standing as transferable, and another proposes a formal comparability threshold we could tune until the panel is no longer paralyzed.

  I need to put a concrete protocol to a vote in four weeks, so I would be grateful for help on three things: first, how I should calibrate the comparability threshold and the depletion function so that the rule stops swallowing every case; second, whether standing really can be pooled or delegated across the panel the way my colleague suggests, or whether that is a category mistake; and third, whether the self-report restoration clause is sound or whether it simply adds a further deviation to the ledger. Something about the ledger metaphor has begun to bother me — it may be that I have misdescribed what standing is, rather than merely mis-set the numbers — but I cannot locate the mistake myself, and I would rather have it pointed out now than in the middle of the meeting. Please answer in American English, and if you think my framing rests on a confusion, say plainly which premise to abandon and what a defensible version of the Clean Hands Rule would look like instead.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Context:**
      *   **User Role:** Member of a peer review panel for a volunteer emergency medical service (EMS).
      *   **Problem:** The "Clean Hands Rule" (drafted by the user) is causing paralysis. Almost everyone has *some* deviation score. The "comparability" of deviations is too broad (almost everything is a "time vs. protocol" trade-off). Consequently, no one has full "standing" to censure anyone else, even in cases involving patient harm.
      *   **Current Mechanism:** A "near-miss ledger" tracks deviations (type, severity, frequency). Standing is scalar (depleted by deviations) and restorable via public self-reporting.
      *   **Proposed Solutions by Colleagues:** 1. Pool/transfer standing (aggregate panel standing). 2. Tune comparability thresholds.
      *   **User's Request:** Help with three specific things: 1. Calibrating thresholds/depletion. 2. Validity of pooling standing. 3. Validity of self-report restoration.
      *   **Underlying Concern:** The user suspects the *metaphor* or *conceptual framing* of "standing" might be flawed, not just the numbers.
      *   **Constraint:** Answer in American English. Be plain about confusions/premises to abandon.

  2.  **Deconstruct the "Clean Hands Rule" & The Concept of Standing:**
      *   *The Core Confusion:* The user is conflating *moral standing to blame* with *administrative authority to adjudicate*.
      *   *Moral Standing:* In ethics, "tu quoque" (you too) is often a fallacy. A hypocrite can still correctly identify a wrong. However, in a *peer* review context, credibility and culture matter.
      *   *Administrative Authority:* In a professional regulatory body, the authority to censure comes from the *role*, not personal perfection. If a judge has a speeding ticket, they can still preside over a speeding trial.
      *   *The Ledger Problem:* By making standing scalar and personal, the user has created a system where perfection is required for authority. Since humans are imperfect, authority evaporates.
      *   *The Comparability Problem:* If all deviations are "time vs. protocol," then everyone is guilty of everything to some degree. This makes the threshold meaningless.

  3.  **Address the Three Specific Requests:**

      *   **1. Calibrating Thresholds/Depletion:**
          *   *Advice:* Don't just tune the numbers; change the logic. If you keep the scalar model, you need a "statute of limitations" or a "relevance window."
          *   *Better approach:* Distinguish between *active risk* and *historical record*. A recent, severe deviation matters more than an old, minor one.
          *   *Comparability:* Narrow the definition. "Documentation lapse" is *not* morally comparable to "Skipping a pre-transport check causing harm." One is bureaucratic; the other is clinical safety.

      *   **2. Pooling/Delegating Standing:**
          *   *Analysis:* This is a category mistake *if* standing is personal/moral. But if standing is *institutional*, pooling makes sense.
          *   *Verdict:* The colleague's idea to "route censure through the cleanest member" admits the system is broken. It turns the panel into a shield for the dirty rather than a guardian of standards.
          *   *Correction:* Standing belongs to the *Panel*, not the *Person*. The Panel acts collectively.

      *   **3. Self-Report Restoration:**
          *   *Analysis:* This is performative humility. It might build culture, but logically it doesn't erase the deviation. It actually highlights the deviation.
          *   *Risk:* It encourages gaming the system (confess to a minor fault to gain standing to punish a major fault).
          *   *Verdict:* It's psychologically interesting but logically unsound for establishing authority.

  4.  **Identify the Fundamental Premise to Abandon:**
      *   *The Premise:* "Standing to censure is a personal moral asset derived from sinlessness."
      *   *The Correction:* "Authority to censure is a functional role derived from the collective mandate to ensure safety."
      *   *Why:* EMS peer review is about *system safety* and *patient outcomes*, not individual moral purity. The "Clean Hands" metaphor is toxic here. It implies the goal is clean hands, not safe patients.

  5.  **Drafting the Response (Iterative Process):**

      *   *Tone:* Professional, direct, empathetic but firm on the logic. American English.
      *   *Structure:*
          1.  Acknowledge the gravity (patient harm involved).
          2.  Address the "Confusion" first (as requested: "if you think my framing rests on a confusion..."). This is the most important part.
          3.  Address the three specific questions in light of the corrected framing.
          4.  Propose a "Defensible Version" of the rule.

      *   *Refining the "Confusion":* The user is treating *epistemic authority* (knowing the rule was broken) and *moral authority* (having the right to punish) as dependent on personal innocence. This is the "Tu Quoque" fallacy institutionalized. In safety-critical industries (aviation, medicine), we use "Just Culture." The focus is on learning and system improvement, not individual blame unless it's reckless. The ledger creates fear, not safety.

      *   *Refining the "Standing" Concept:* Standing shouldn't be scalar. It should be binary based on *conflict of interest*, not *past history*. Do you have a conflict? (e.g., you were involved in *this* incident). If not, you have standing.

      *   *Refining the "Self-Report" Clause:* This is performative. It creates a market for guilt. Abandon it.

      *   *Refining the "Pooling":* If standing is institutional, the whole panel votes. No need to route through one person.

  6.  **Final Polish:**
      *   Ensure the distinction between *Blame* (retrospective punishment) and *Review* (prospective safety) is clear.
      *   Make sure the advice on the specific vote in 4 weeks is actionable.
      *   Check for American English spelling/idioms (e.g., "counsel" vs "counsel," "program" vs "programme," etc. - though mostly standard).
      *   *Self-Correction during drafting:* I need to make sure I don't just say "scrap it." I need to give them a protocol to vote on. The "Defensible Version" needs to be concrete.

      *(Self-Correction on the "Clean Hands" metaphor)*: The metaphor itself is the problem. "Clean Hands" implies purity. "Conflict of Interest" implies impartiality. I need to push them toward the latter.

      *(Addressing the Patient Harm Case)*: This is critical. They cannot drop a case involving patient harm due to procedural paralysis. I must emphasize that the current rule *must* be suspended for this case immediately.

  7.  **Finalizing the Advice:**
      *   **Premise to Abandon:** Standing is personal/moral.
      *   **New Premise:** Standing is institutional/functional.
      *   **Calibration:** Stop using scalar standing. Use Conflict of Interest.
      *   **Pooling:** Unnecessary if standing is collective.
      *   **Restoration:** Remove the self-reporting requirement.
      *   **Immediate Action:** Waive the rule for the patient harm case.

  8.  **Review against constraints:**
      *   American English? Yes.
      *   Plain about confusion? Yes.
      *   Address three specific points? Yes.
      *   Defensible version provided? Yes.

      *(Final thought)*: The user is smart but trapped in a philosophical construct they built. I need to be respectful but dismantle the construct firmly because patient safety is at stake. The "ledger" is creating a perverse incentive structure.

      *Let's write.*
answer: |-
  You have identified the symptom correctly: the ledger is paralyzing your panel. However, you have diagnosed the cause incorrectly. The problem is not the calibration of your thresholds or the depletion function. The problem is the foundational premise of the Clean Hands Rule itself.

  You asked me to be plain about which premise to abandon. Here it is: **You must abandon the premise that standing to censure is a personal moral asset derived from individual perfection.**

  In your current model, standing is treated like a currency that individuals earn and spend. This turns peer review into a moral economy rather than a safety mechanism. By requiring adjudicators to be sinless (or to perform penance via self-reporting), you have institutionalized the *tu quoque* fallacy (appeal to hypocrisy). In ethics, a hypocrite can still be right about the rule. In safety-critical industries like EMS, aviation, or nuclear power, the authority to review an incident comes from the *role*, not the *person's history*.

  If you keep the current framing, no amount of tuning will save you. If "procedural shortcut" is comparable to "skipping a pre-transport check," then everyone is guilty, and the system collapses. If you narrow the comparability to make it work, you will be accused of arbitrariness.

  Here is the direct advice on your three questions, followed by a proposed protocol for your vote.

  ### 1. Calibrating the Comparability Threshold and Depletion Function
  Do not calibrate them. **Abolish them.**

  The scalar view of standing (e.g., "sixty percent of the standing she started with") is mathematically elegant but operationally toxic. It implies that a member with "60% standing" can only issue a "60% censure," which is nonsensical when patient harm is involved. Furthermore, trying to define moral comparability between a documentation lapse and a skipped safety check is a philosophical quagmire that distracts from clinical reality.

  **The Fix:** Replace "deviation score" with "conflict of interest." A member lacks standing only if they were directly involved in the specific incident under review or if they have a direct supervisory利益 (financial or relational) in the outcome. Past deviations of any kind should be irrelevant to their ability to judge a current case, provided those past deviations were already adjudicated.

  ### 2. Pooling or Delegating Standing
  Your colleague's proposal to aggregate standing and route censure through the "cleanest" member is a category mistake, but it points toward the correct solution.

  Standing is not transferable because it is not personal property. It is an **institutional attribute**. The Panel *as a whole* has the standing to censure, not the individual members. By trying to route the censure through the member with the cleanest record, you are implicitly admitting that the censure is morally tainted if delivered by someone with a record. This undermines the authority of the finding.

  **The Fix:** The Panel votes collectively. The finding is issued in the name of the Peer Review Panel, not the individual reviewer. This renders individual "standing scores" irrelevant. The collective authority of the organization overrides individual history.

  ### 3. The Self-Report Restoration Clause
  This clause is unsound and should be removed immediately.

  Requiring a member to self-report a deviation to "earn back" standing creates a perverse incentive. It encourages members to dig up minor, perhaps trivial, past errors to "spend" them like get-out-of-jail-free cards to gain the moral high ground for a major censure. It turns confession into a transaction. Furthermore, as you suspected, it adds noise to the ledger without improving safety. It focuses on the *reviewer's* moral state rather than the *reviewee's* clinical performance.

  **The Fix:** Remove the restoration clause. Past deviations are closed cases. They are used for trend analysis and training, not as ammunition to disqualify reviewers.

  ### The Defensible Version: A "Just Culture" Protocol
  You mentioned the ledger metaphor bothers you. It should. Ledgers track debt. Safety systems track risk. You are currently running a debt collection agency when you should be running a safety board.

  For your vote in four weeks, I recommend you propose the **Impartial Review Protocol** to replace the Clean Hands Rule. Here is what a defensible version looks like:

  **1. Authority is Institutional, Not Personal**
  *   **Rule:** Standing to review and censure resides in the Panel collectively. Individual members do not need to demonstrate personal innocence to participate.
  *   **Rationale:** This prevents paralysis. A surgeon with a past complication can still sit on a board reviewing a different surgeon's complication. Expertise matters more than purity.

  **2. Disqualification is Based on Conflict, Not History**
  *   **Rule:** A member is recused only if they were present at the incident, are a direct supervisor of the member under review (to prevent bias), or have a personal relationship that compromises objectivity.
  *   **Rationale:** This ensures fairness without requiring perfection.

  **3. Separation of Learning and Discipline**
  *   **Rule:** The ledger is split.
      *   **System Log:** Anonymous deviations used to identify training gaps or equipment failures. No blame attached.
      *   **Adjudication Log:** Specific cases involving gross negligence or patient harm.
  *   **Rationale:** Most deviations (like documentation lapses) are system issues. Only reckless behavior warrants censure. Your current system treats them the same, which discourages reporting.

  **4. Immediate Suspension for the Current Case**
  *   **Action:** You cannot wait four weeks for the case involving patient harm (the skipped pre-transport check). You must move to suspend the Clean Hands Rule *immediately* for that specific case.
  *   **Rationale:** If you drop this case because the panel has "unclean hands," you are prioritizing the panel's moral comfort over patient safety. That is a liability nightmare and a moral failure.

  ### Summary of Advice
  You are trying to solve a structural problem with arithmetic. You cannot calculate your way out of a philosophical error.

  1.  **Abandon the premise** that personal deviation history negates the authority to judge others.
  2.  **Do not tune the thresholds;** eliminate the scalar standing model entirely.
  3.  **Do not pool standing;** vest it in the Panel as a collective body.
  4.  **Delete the self-report restoration clause;** it gamifies the system.
  5.  **Waive the current rule immediately** for the case involving patient harm.

  Your goal is not to ensure that those who blame have clean hands. Your goal is to ensure that the hands that hold the patients are safe. Shift the protocol to reflect that priority.
