answer: |-
  # EVALUATION PROTOCOL FOR GÖDELIAN ONTOLOGICAL RECONSTRUCTIONS

  ## I. PRE-REVIEW BRAINSTORMING: DISTINCTIONS TO PRESERVE VS. DROP

  To maintain rigor within a twenty-minute window, the following conceptual distinctions must be preserved to ensure the evaluation is metaphysically honest rather than merely syntactically correct. Conversely, certain historical or notational distinctions must be dropped to ensure speed.

  **Distinctions to Preserve (Non-Negotiable):**
  1.  **Intensional vs. Extensional Property Ascription:** We must distinguish between a property defined by its extension in a specific world (world-bound) and a property defined by its intension across accessible worlds (rigid). Gödel's argument fails if "positive" shifts meaning between worlds.
  2.  **Consistency vs. Closure:** The set of positive properties must be consistent (compossible), not merely closed under entailment. A closed set containing a contradiction is trivial. The protocol must check for an explicit consistency axiom or proof.
  3.  **Formal Validity vs. Metaphysical Soundness:** A derivation may be valid in system S5 but unsound if the accessibility relation does not map onto metaphysical possibility. The protocol must flag when frame conditions are assumed rather than argued.

  **Distinctions to Drop (For Speed):**
  1.  **Higher-Order Logic Nuances:** Whether the author uses second-order quantification over properties or a lambda-calculus notation is irrelevant provided the quantification rules are standard classical.
  2.  **Historical Fidelity:** Whether the reconstruction matches Gödel's unpublished notes exactly versus Anderson's or Hájek's variants is irrelevant. We evaluate the argument presented, not its genealogy.
  3.  **Theological Specificity:** Whether "positive" maps to "moral good," "ontological perfection," or "pure actuality" is irrelevant unless the definition creates a logical contradiction within the axioms.

  ---

  ## II. FOUR-PASS DECISION PROTOCOL

  ### PASS ONE: FRAME SPECIFICATION
  *   **Question:** What modal system (S5, S4, B, etc.) is employed, and is the accessibility relation justified independently of the desired conclusion?
  *   **Textual Evidence Required:** Explicit statement of modal axioms (e.g., S5 characteristic axiom $\Diamond p \to \Box p$) or definition of the accessibility relation $R$.
  *   **Rule:**
      *   **PASS:** Frame is explicitly defined and standard (e.g., S5 for metaphysical modality).
      *   **FAIL:** Frame is undefined, or the justification for the frame relies on the existence of the God-like being (circular).
      *   **JUDGMENT CALL:** The frame is non-standard (e.g., restricted accessibility) but formally consistent. *Referee must decide if the restriction is metaphysically motivated or ad hoc.*
  *   **JUDGMENT CALL POINT:** Your commitment to whether metaphysical possibility requires symmetry and transitivity (S5) or allows restriction.

  ### PASS TWO: INTENSIONAL STABILITY AUDIT
  *   **Question:** For every property designated "positive" or "essential," is its extension stable across all worlds accessible in the author's frame?
  *   **Textual Evidence Required:** Definitions of properties (e.g., $P(\phi)$) and their usage in nested modal contexts (e.g., $\Box \forall x (G(x) \to \phi(x))$).
  *   **Rule:**
      *   **PASS:** Properties are treated as rigid designators or functions from worlds to extensions that respect the accessibility relation.
      *   **FAIL:** **INTENSIONAL EQUIVOCATION.** The author treats a property as world-bound in one step (contingent) and trans-world in another (necessary) without justification.
      *   **JUDGMENT CALL:** Stability holds only by definitional fiat (stipulated rigidness) without argument for why that property *should* be rigid.
  *   **JUDGMENT CALL POINT:** Your commitment to whether stipulative rigidity is sufficient for metaphysical premises.

  ### PASS THREE: CONSISTENCY AND COLLAPSE CONTAINMENT
  *   **Question:** Is the set of positive properties explicitly claimed consistent, and does the derivation of a Necessary Being entail Modal Collapse (all truths become necessary)?
  *   **Textual Evidence Required:** Axiom of Consistency (e.g., $\neg P(\phi) \to P(\neg \phi)$ is not asserted if it leads to contradiction) and a check for contingent truths post-derivation.
  *   **Rule:**
      *   **PASS:** Consistency is axiomatic or proven; model allows contingent truths alongside the Necessary Being.
      *   **FAIL:** Inconsistency derived within the set; or Modal Collapse is demonstrated but denied by the author.
      *   **JUDGMENT CALL:** Closure conditions prevent collapse formally, but the mechanism relies on controversial property individuation.
  *   **JUDGMENT CALL POINT:** Your commitment to whether the proposed mechanism for avoiding collapse is logically legitimate or merely blocks the inference artificially.

  ### PASS FOUR: EXISTENTIAL INFERENCE
  *   **Question:** Examine the move from "possibly, a God-like being exists" to "necessarily, a God-like being exists." Where does this step depend on frame conditions versus unstated existence premises?
  *   **Textual Evidence Required:** The specific theorem step deriving $\Box \exists x G(x)$ from $\Diamond \exists x G(x)$.
  *   **Rule:**
      *   **PASS:** Inference follows strictly from the Frame Axioms (e.g., S5 Brouwerian axiom) and previous definitions.
      *   **FAIL:** Existence is smuggled in as a premise (e.g., assuming actual existence to prove necessary existence).
      *   **JUDGMENT CALL:** The inference is formally valid but relies on a conception of existence as a property that you find metaphysically untenable.
  *   **JUDGMENT CALL POINT:** Your commitment to the Kantian objection (existence is not a predicate) versus the Fregean/Modal treatment of existence.

  ---

  ## III. APPLICATION TO HYPOTHETICAL SUBMISSIONS

  ### CASE A: Standard Gödel Reconstruction in S5
  *   **Submission Profile:** Uses standard higher-order modal logic, S5 frame, explicit axioms for "Positive," defines "God-like" as possessing all positive properties, asserts consistency axiom.
  *   **Pass One (Frame):** **PASS.** S5 is standard for metaphysical modality; no circular justification found.
  *   **Pass Two (Stability):** **PASS.** Properties are defined intensionally; no equivocation detected.
  *   **Pass Three (Consistency/Collapse):** **JUDGMENT CALL.** The consistency of "Positive" is axiomatic. The model technically allows contingent truths, but the density of necessary properties is high.
      *   *Referee Decision:* **PASS.** Axiomatic consistency is standard in this literature; collapse is avoided via standard essence definitions.
  *   **Pass Four (Inference):** **PASS.** Move from $\Diamond$ to $\Box$ relies strictly on S5 characteristic axiom.
  *   **Overall Recommendation:** **ACCEPT MINOR REVISIONS.** The argument is formally sound within the system. Author should note the axiomatic nature of consistency in the introduction.

  ### CASE B: "Essential" Variant in S4
  *   **Submission Profile:** Replaces "Positive" with "Essential." Adopts S4 frame (reflexive, transitive, not symmetric). Accessibility restricted to "metaphysically nearby" worlds.
  *   **Pass One (Frame):** **JUDGMENT CALL.** S4 is specified. Restriction to "nearby" worlds is motivated by similarity semantics rather than pure metaphysics.
      *   *Referee Decision:* **PASS (Provisional).** S4 is acceptable if symmetry is rejected, but the "nearby" constraint needs scrutiny in Pass Four.
  *   **Pass Two (Stability):** **FAIL.** **INTENSIONAL EQUIVOCATION.** The author treats "Essential" as world-relative in the definition (essence varies by world) but world-invariant in the derivation of necessary existence.
  *   **Pass Three (Consistency/Collapse):** **PASS.** Consistency is maintained; collapse is avoided due to weaker S4 frame.
  *   **Pass Four (Inference):** **FAIL.** The move from $\Diamond \exists x G(x)$ to $\Box \exists x G(x)$ fails in S4 without the Brouwerian axiom (symmetry). The author attempts to derive necessity without establishing the accessibility of the actual world from the possible world containing the being.
  *   **Overall Recommendation:** **REJECT.** Fatal formal error in Pass Four (invalid inference in S4) compounded by intensional equivocation in Pass Two.

  ### CASE C: The "Ad Hoc" Restriction (Formally Valid, Metaphysically Suspect)
  *   **Submission Profile:** Highly ingenious formalization. Uses a non-standard accessibility relation that blocks the derivation of Modal Collapse. Passes all formal consistency checks. The restriction ensures the God-like being exists necessarily *only* in a subset of worlds that excludes our own unless specified otherwise.
  *   **Pass One (Frame):** **JUDGMENT CALL.** The accessibility relation is formally consistent and avoids collapse. However, the restriction is tailored solely to save the conclusion from collapse, with no independent metaphysical argument for why possibility should be restricted this way.
      *   *Referee Decision:* **FAIL.** While formally valid, the frame is ad hoc. It violates the requirement for independent justification.
  *   **Pass Two (Stability):** **PASS.** Properties are rigidly designated.
  *   **Pass Three (Consistency/Collapse):** **PASS.** Collapse is successfully blocked by the frame restriction.
  *   **Pass Four (Inference):** **PASS.** The inference holds within the constructed model.
  *   **Overall Recommendation:** **REJECT.** Despite passing formal checks in Passes Two through Four, the manuscript fails Pass One on metaphysical grounds. The accessibility relation is engineered to produce the result rather than model metaphysical reality. This violates the soundness condition of the protocol.

  ---

  ## IV. LIMITATIONS AND MISFIRES

  This procedure is a tool for formal and metaphysical triage, not a truth-machine. Referees must acknowledge the following limitations when signing off on recommendations:

  1.  **Substantive Property Evaluation:** The protocol cannot adjudicate whether specific attributes (omniscience, omnipotence, moral perfection) are genuinely "positive" or "essential." It only checks for consistency among whatever properties the author defines as such.
  2.  **Theological Disputes:** The procedure is neutral regarding theological doctrines. It cannot resolve disputes about the nature of divinity (e.g., simplicity vs. composition) unless those disputes manifest as formal contradictions within the provided axioms.
  3.  **Validity vs. Soundness Boundary:** While Pass One attempts to filter for soundness via frame justification, the protocol cannot fully distinguish formal validity from metaphysical soundness when premises are undefined, circular, or rely on ambiguous natural language terms masked as formal primitives.
  4.  **Non-Classical Logics:** The protocol will misfire on manuscripts employing non-classical quantification (e.g., free logic without existence predicates), paraconsistent property logics, or undefined modal operators. These submissions require a specialized review outside this standard procedure.
  5.  **Referee Bias:** The "Judgment Call" points explicitly rely on the referee's theoretical commitments (e.g., acceptance of S5, view on existence as a predicate). Different referees may legitimately reach different conclusions on the same manuscript at the Judgment Call stages. This is a feature of metaphysical peer review, not a bug, but must be disclosed in the confidential comments.
