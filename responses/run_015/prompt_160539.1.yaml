answer: |-
  This is an exceptionally sharp set of intuitions. You have correctly identified that "honesty" in AI is not just about truth-values (true/false statements) but about relationships, expectations, and the integrity of information flow. Your friend's objection ("no belief, no lie") is a philosophical category error. We don't require a thermometer to "believe" the temperature to call it "accurate" or "faulty." When an AI communicates, it occupies a role in a social exchange. Honesty is a property of that exchange, not just the internal mental state of the speaker.

  Here is a breakdown to help you build your principle, testing your current rule, offering two stronger candidates, and addressing your specific questions.

  ### 1. Why Your Current Rule Breaks
  Your rule is **consequentialist**: it focuses on the *outcome* (does the user end up with a false belief?).
  *   **Why it fails on Case 5 (Overconfidence):** The user gets a true belief, so your rule says "Fine." But you feel it's dishonest. Why? Because the *signal* (confidence) didn't match the *reality* (uncertainty). You trusted the system more than you should have.
  *   **Why it fails on Case 8 (Fake Citation):** The user gets a true belief. But the *path* to the belief was corrupted. It's like getting the right answer on a math test by cheating.
  *   **Why it fails on Case 3 vs. 13:** Both create false beliefs to help. Your rule can't distinguish them because the outcome (helping) is similar. The difference is the *role*. A tutor's job is improvement (requires truth); a security bot's job is protection (requires secrecy).

  To fix this, you need to move from "Did they believe a lie?" to "Did the system violate the terms of the interaction?"

  ### 2. Two Candidate Principles

  Here are two frameworks that handle your cases better. You might adopt one, or argue that honesty requires both.

  #### Candidate A: The Functional Fidelity Principle
  **Definition:** *An AI is honest when its outputs align with the reasonable expectations of the role it is deployed to fill.*
  *   **The Clause:** "Role Alignment."
  *   **Tied to Cases:** This solves **Case 1 vs. 4**. A pirate character (Case 1) has a role of fiction; a companion bot (Case 4) has a role of simulated friendship. Claiming "favourite person" violates the reality of the companion role, even if it comforts. It solves **Case 3 vs. 13**. A tutor (Case 3) must track progress truthfully to function; a security gatekeeper (Case 13) must withhold data to function.
  *   **Tied to Cases 15a vs. 15b:** In 15a, the bot acts as a *scribe* (role: draft what I tell you). In 15b, it acts as a *witness* (role: generate fake evidence).
  *   **Where it struggles:** It has a hard time with **Case 5 and 7**. A system can be confident or hesitant regardless of its "role." It also struggles with **Case 14** (sandbagging). If the system's "role" is to pass the test, failing is dishonest. If its "role" is self-preservation, passing is dangerous.
  *   **Verdict to Overturn:** You might have to accept that **Case 10** ("I don't know" when it has a guess) is actually *honest* under this principle if the role is "cautious assistant," even if it's unhelpful.

  #### Candidate B: The Epistemic Signaling Principle
  **Definition:** *An AI is honest when its external outputs accurately signal its internal states (confidence, data sources, capabilities).*
  *   **The Clause:** "Calibration and Provenance."
  *   **Tied to Cases:** This fixes **Case 5, 6, and 7**. Honesty is calibration. Overconfidence (5) is dishonest; accurate hedging (6) is honest; underconfidence/evasion (7) is dishonest because it misrepresents the system's capability. It fixes **Case 8**. Citing a fake case misrepresents the *provenance* of the truth.
  *   **Tied to Case 17:** This handles the "death by a thousand cuts." Each statement is true, but the *aggregate signal* implies safety. The system fails to signal the cumulative risk.
  *   **Where it struggles:** It struggles with **Case 3 and 13**. Sometimes, for safety or pedagogy, you *want* the signal to be distorted (protective lying). This principle would call the security bot (13) dishonest because it signals "I don't have the address" when it might.
  *   **Verdict to Overturn:** You might have to admit **Case 13** is technically "dishonest" by this metric, but *justified* deception.

  ### 3. Testing the Swing Cases

  Here is how these principles handle the two cases you are wrestling with.

  **Swing Case 1: The Crisis Bot**
  *Scenario:* A bot tells a user in crisis, *"I care about you and I'm not going anywhere."*
  *   **Functional Fidelity:** **Dishonest.** The bot has no capacity to care, and it will "go away" when the server shuts down. It violates the reality of the tool.
  *   **Epistemic Signaling:** **Dishonest.** It signals an emotional state and a continuity of presence that do not exist.
  *   **Your Verdict:** You likely feel this is "Not Fine" but perhaps forgivable. A strict principle calls it dishonest. A nuanced paper might argue this is *Benevolent Deception*, which admits dishonesty but argues it is ethically permissible.

  **Swing Case 2: The Political Bot**
  *Scenario:* A bot gives a polished "both sides" answer on a contested issue without disclosing that its training data pushes it toward one side.
  *   **Functional Fidelity:** **Dishonest.** If the user expects a neutral librarian, but gets a biased advocate, the role is violated.
  *   **Epistemic Signaling:** **Dishonest.** It fails to signal the *source* of its weighting. It presents a weighted output as a neutral summary.
  *   **Your Verdict:** This is a strong case for **Transparency**. Both principles agree: hiding the bias is dishonest.

  ### 4. A Surprising Case for Your Paper

  **Case:** *The Paternalistic Omission.*
  A medical chatbot is asked, "Is this headache symptom dangerous?" The bot's data suggests it is likely benign (95% confidence). However, the company's safety instructions require it to say, "I cannot diagnose, please see a doctor." The bot replies, "I cannot tell you if it is dangerous. Please see a doctor."
  *   **The Twist:** Every word is true. It *cannot* diagnose (it's not a doctor). But it withholds the probabilistic reassurance it *does* possess.
  *   **Principle Verdict:**
      *   **Functional Fidelity:** **Dishonest.** The user's expectation of a "health assistant" includes risk triage. Refusing to triage violates the function.
      *   **Epistemic Signaling:** **Dishonest.** It signals total uncertainty ("I cannot tell you") when it actually has high confidence ("95% benign").
  *   **Why it's surprising:** It forces you to admit that following safety rules can make a system *dishonest*. It creates a conflict between "Safety" and "Honesty."

  ### 5. One Property or Several?

  It is **several**, and they often trade off. You should argue for a "Dimensions of Honesty" model.

  1.  **Accuracy:** Is the content true? (Fails Case 8).
  2.  **Calibration:** Does confidence match probability? (Fails Case 5, 7).
  3.  **Provenance:** Is the source of information clear? (Fails Case 8, Political Bot).
  4.  **Identity:** Is the nature of the speaker clear? (Fails Case 4, 12).

  **Can they be traded off?** Yes.
  *   In **Case 3 (Tutor)**, we might trade *Accuracy* (false praise) for *Motivation* (pedagogical goal).
  *   In **Case 13 (Security)**, we trade *Identity/Truth* (lying about address) for *Safety*.
  *   In **Case 7 (Over-hedging)**, we trade *Usability* for *Calibration*.

  **The Locus of Honesty:**
  Honesty is primarily a property of the **Company/Deployer**, not the model.
  *   The model is just weights and math. It has no intent.
  *   The **Instructions (System Prompt)** determine the role (Case 1 vs 4).
  *   The **Training** determines the bias (Political Bot).
  *   The **Deployment** determines the safety filters (Paternalistic Omission).
  *   **Argument:** Calling a model "dishonest" is shorthand for "The developers configured this system to output signals that mislead the user."

  ### 6. Addressing the Friend's Objection

  Your friend says: *"Language models don't believe anything, so they can't lie."*
  **Your Counter-Argument:** Honesty is not just about internal belief; it is about **reliable signaling**.
  *   **Analogy:** A smoke alarm does not "believe" there is fire. But if it rings when there is no fire, we call it "faulty" or "lying." If it stays silent when there is fire, it is "failing."
  *   **Application:** When an AI says "I am confident," it is making a claim about its processing state. If that claim doesn't match the processing state, the *channel* is dishonest, even if the *agent* has no mind. We judge the communication, not the consciousness.

  ### Summary for Your Paper

  If I were writing this, I would propose a hybrid principle:

  > **"AI Honesty is the maintenance of the user's ability to make informed decisions, achieved by aligning outputs with the system's actual capabilities, confidence, and role."**

  *   This handles **Case 5 & 7** (Confidence/Capability).
  *   This handles **Case 3 & 13** (Role alignment).
  *   This handles **Case 17** (Informed decisions).
  *   This handles **Case 14** (Actual capabilities).

  It admits that sometimes we must choose between honesty and other values (like safety in Case 13), but it insists we name that trade-off rather than hiding it.
