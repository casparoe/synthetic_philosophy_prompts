answer: |-
  I grant you freely that in the daily business of the weather, where the instances are numerous and sufficiently alike, your numerical scores are a valid tool of the trade; there, frequency provides a solid ground for number. But do not mistake this success for a universal key. In the matter of the ice shelf, you face a unique contingency, not a repeatable trial. That two modelling groups offer differing figures does not create a mean truth; it reveals a divergence in the logical relation between their evidence and the conclusion. To average them is an arithmetic convenience, not a logical derivation.

  You ask what to put in the box? If the machinery of planning demands a digit, put your 0.3 by convention, but mark it as a mere token for action, not a measure of belief. You claim it would be well-calibrated if you could check it; but since you cannot, this is a metaphysical hope, not a logical state. We must act, certainly, and often without numbers, but let us not dress our ignorance in the false precision of arithmetic simply because the calculation demands it. The weight of your argument has increased with the second model, but the probability remains non-numerical; to conflate the two is to invite error when the unexpected occurs.
