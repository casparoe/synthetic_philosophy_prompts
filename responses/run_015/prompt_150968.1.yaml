      *   *Section 2: Spacetime (The Physicist's Tool).* Introduce Four-Dimensionalism. The objects are world-lines. They are distinct because their past coordinates differ. This validates the "gut feeling" without magic tags.
      *   *Section 3: The Quantum Red Herring.* Gently correct the electron analogy. Electrons are fundamentally indistinguishable. Macroscopic objects are distinguishable by principle (trajectory), even if unknown in practice. This is *epistemic* uncertainty, not *ontic* indistinguishability.
      *   *Section 4: Causal History.* Kripke/Putnam. Naming and Necessity. The name "The Sphere" rigidly designates the object with that specific causal history.
