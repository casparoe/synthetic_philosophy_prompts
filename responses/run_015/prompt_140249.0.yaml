answer: |-
  ### The Historical Novelist's Decision Tree

  **The Eight Branch Questions**

  1.  **The Claimant:** When the great-granddaughter objects to the foundling ward but the great-grandson encourages it, whose voice counts?
  2.  **The Object:** Is the primary wrong changing the facts of her life, damaging her reputation, or treating her life as fuel for your art?
  3.  **The Waiver:** She burned her replies to letters; does this silence invite you to write them, or signal a wish to remain unheard?
  4.  **The Granularity:** Is inventing a sentence she thought, a childhood she lacked, a secret she kept, and a death she caused, one offence or four?
  5.  **The Pattern:** If the shape of a foundling childhood fits the record but the specific ward is invented, is the lie redeemed by the truth of the shape?
  6.  **The Harm:** If the invention harms no living person and tarnishes no proven fact, is it still a transgression?
  7.  **The Disclosure:** Must the reader be told what is invented, or does the genre of 'novel' imply licence?
  8.  **The Necessity:** If the third act fails without the dead child as engine, does artistic necessity override historical silence?

  ***

  **The Leaves**

  **1. Strict Archivalism**
  *   **Awkward Commitment:** It accepts that most lives, particularly those of the poor or marginalised, cannot be narrated without sin.
  *   **Spoken-Sentence Scene:** Cut the sentence; silence is the only truth you may print.

  **2. Living Claim Only**
  *   **Awkward Commitment:** It treats the dead as raw material until the last descendant dies, at which point they become free game.
  *   **Spoken-Sentence Scene:** Ask the great-granddaughter; if she objects, cut it, regardless of the grandson's wish.

  **3. Community Memory**
  *   **Awkward Commitment:** It requires defining a community that may no longer exist or may speak with many contradictory voices.
  *   **Spoken-Sentence Scene:** Consult the local history society; if they object, cut it, even if the family permits it.

  **4. Mosaic Licence**
  *   **Awkward Commitment:** It permits deceptive arrangements of true facts, creating a false impression from genuine fragments.
  *   **Spoken-Sentence Scene:** Keep it only if every word is sourced from elsewhere in her documented life.

  **5. Counterfactual Confession**
  *   **Awkward Commitment:** It relies entirely on your intuition of 'overwhelming likelihood', which is difficult to verify or challenge.
  *   **Spoken-Sentence Scene:** Keep it if the archive implies she thought it, but mark it as uncertain in your notes.

  **6. Anachronism of Interiority**
  *   **Awkward Commitment:** It may render characters mute if the period vocabulary for grief or selfhood is too sparse for your purpose.
  *   **Spoken-Sentence Scene:** Cut it if the phrasing sounds like 2024 rather than 1893, even if the sentiment fits.

  **7. Descendant Veto**
  *   **Awkward Commitment:** It gives veto power over history to those who knew the subject least, prioritising lineage over accuracy.
  *   **Spoken-Sentence Scene:** Follow the great-granddaughter's veto regardless of the grandson's wish or the historical record.

  **8. Reader Contract**
  *   **Awkward Commitment:** It turns the novel into a puzzle of fact-checking, potentially breaking the reader's immersion with footnotes.
  *   **Spoken-Sentence Scene:** Keep it, but add an afterword distinguishing this sentence from the documented record.

  **9. Artistic Necessity**
  *   **Awkward Commitment:** It makes history merely decorative, subordinate to the structural demands of the plot.
  *   **Spoken-Sentence Scene:** Keep it if the scene makes the book work, regardless of evidence or objection.

  **10. Harm Principle**
  *   **Awkward Commitment:** It permits lies that damage reputation provided the damage is too small to be noticed or litigated.
  *   **Spoken-Sentence Scene:** Keep it if no living person is distressed by the sentence, even if it is untrue.

  **11. Temporal Sunset**
  *   **Awkward Commitment:** It draws an arbitrary date line for respect, suggesting morality decays simply with the passage of time.
  *   **Spoken-Sentence Scene:** Keep it; 1893 is long enough ago to forgive the invention.

  **12. Utilitarian Good**
  *   **Awkward Commitment:** It justifies harm to a specific memory if the resulting book provides sufficient public education or pleasure.
  *   **Spoken-Sentence Scene:** Keep it if the book helps more people than it hurts the memory.

  ***

  **Unoccupied Combinations**

  1.  **Strict Archivalism + Artistic Necessity Overrides:** This combination asserts that nothing undocumented may be used, unless the plot requires it. This looks like **incoherence**, as the necessity clause swallows the archival rule entirely.
  2.  **Living Claim Only + Harm Irrelevant:** This position holds that only the living have claims, but that their distress does not constitute harm requiring restraint. This looks like **unattractiveness**, as it grants rights without remedies.
  3.  **Community Claim + Descendant Veto:** This position holds that the community owns the memory, but a single descendant can veto the community's consent. This looks like **mere neglect**, as it fails to resolve the hierarchy of authority it establishes.
  4.  **Counterfactual Confession + No Disclosure:** This allows you to invent likely thoughts but forbids telling the reader you have done so. This looks like **unattractiveness**, as it relies on the reader trusting your intuition while denying them the knowledge that intuition was used.

  ***

  **Indistinguishable Leaves**

  **Living Claim Only** and **Harm Principle**.
  Your questions cannot separate these two positions because they yield identical verdicts on every case provided by this tree. If a living person objects, there is a claim (Living Claim) and there is harm (Harm Principle); if no living person objects, there is no claim and no harm. They disagree only on the theoretical ground—rights versus consequences—but your diagnostic questions probe only the outcome. To distinguish them, you would need a question about whether a living person *could* object but chooses not to, versus whether they are *harmed* without knowing it.
