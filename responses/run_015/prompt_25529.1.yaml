answer: |-
  # Material Constitution: Find Your Position

  **1. When you look at the statue, is there really one thing there, or just many tiny particles arranged together?**
  *   **Just particles** → Go to **2**.
  *   **One thing** → Go to **3**.

  **2. Do *any* composite objects exist (like cats or humans), or only simple particles?**
  *   **Only particles** → **Mereological Nihilism**
      *   *Awkward Commitment:* There are no statues, cats, or people—only tiny particles arranged in patterns.
  *   **Some objects** → **Empty Region: Selective Nihilism**
      *   *Why Empty:* It is notoriously difficult to explain why particles compose cats but not statues without arbitrary rules.

  **3. Is the statue exactly the same object as the lump of clay, just called by different names?**
  *   **Yes** → Go to **4**.
  *   **No** → Go to **5**.

  **4. If they are the same object, do they survive and perish in exactly the same ways?**
  *   **Yes** → **The Identity View**
      *   *Awkward Commitment:* The statue survives being squashed into a ball (or the clay dies when the statue is made).
  *   **No** → **Empty Region: Relative Identity**
      *   *Why Empty:* Most philosophers reject the idea that identity can be relative to a description as logically incoherent.

  **5. Can two different objects be in the exact same place at the exact same time?**
  *   **Yes** → Go to **6**.
  *   **No** → Go to **7**.

  **6. Do objects stretch through time, having different "time-slices" at different moments?**
  *   **Yes** → **Four-Dimensionalism**
      *   *Awkward Commitment:* You are not a whole person now, but merely a momentary slice of a space-time worm.
      *   *(Note: Empirically indistinguishable from Constitution View; differs only on metaphysics of time.)*
  *   **No** → **The Constitution View**
      *   *Awkward Commitment:* Two distinct physical objects occupy the exact same space at the same time.

  **7. When the statue is made, does the lump of clay cease to exist because the "statue" nature overrules the "clay" nature?**
  *   **Yes** → **Dominant Kinds View**
      *   *Awkward Commitment:* The lump of clay ceases to exist simply because a statue now occupies its space.
  *   **No** → **Empty Region: Brute Vanishing**
      *   *Why Empty:* If the lump vanishes but not due to dominance, there is no explanation for why one object wins over the other.

  ***

  **Total Nodes:** 13 (7 Questions, 6 Leaves + 2 Empty Leaves)
  **Note on Indistinguishability:** The **Constitution View** and **Four-Dimensionalism** both allow two objects in the same place. They are separated only by whether you believe objects have temporal parts (4D) or are wholly present at each moment (Constitution).
