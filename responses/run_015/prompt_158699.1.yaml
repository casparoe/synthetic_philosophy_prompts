answer: |-
  # The Two-Ledger Gate Procedure (TLG-1)

  **Purpose:** To rank grant proposals by cost-effectiveness while accounting for structural impact, within a 2-hour workflow per proposal.
  **Users:** Program Officer (PO), Part-Time Economic Consultant (Consultant).
  **Authority:** Board sets the **Structural Multiplier (M)** annually before proposals are reviewed. PO executes gates. Board reviews only proposals passing Gate 5.

  ---

  ## Part 1: The Procedure

  ### Pre-Work (Board Only, Annual)
  The Board sets the **Structural Multiplier (M)**.
  *   **Definition:** The weight assigned to one unit of Uncountable Impact relative to one unit of Countable Impact.
  *   **Example:** If M = 0.5, structural change is valued at half the rate of direct measurable benefit. If M = 2.0, structural change is valued double.
  *   **Constraint:** M must be a single number. No ranges. This forces a values decision *before* evidence biases the room.

  ### Gate 1: Logic & Eligibility (15 Minutes)
  **Owner:** PO
  **Action:** Review Theory of Change (ToC).
  **Pass Criteria:**
  1.  **Causality:** Is there a plausible link between the grant activity and the outcome? (No "magic steps").
  2.  **Counterfactual:** Does the applicant articulate what happens without the grant?
  3.  **Fit:** Does it align with Global Health or Economic Opportunity?
  **Fail Condition:** ToC relies on assumptions the PO deems magically optimistic (e.g., "Training officials will end corruption" without enforcement mechanisms).
  **Output:** Pass/Fail. If Fail, reject immediately.

  ### Gate 2: Ledger A (Countable) (45 Minutes)
  **Owner:** Consultant (calculations), PO (assembly)
  **Action:** Quantify direct benefits.
  **Method:**
  1.  Identify primary metric (e.g., lives saved, income increased, QALYs).
  2.  Consultant provides **Cost-Per-Outcome (CPO)** estimate with a **Confidence Interval (Low/High)** based on available evidence (RCTs, observational, internal data).
  3.  PO converts CPO to a **0–10 Score** using the Foundation's historical baseline.
      *   *10:* Top 10% of historical CE (e.g., <$50 per life-year).
      *   *5:* Median historical CE.
      *   *0:* No credible quantitative evidence.
      *   *Adjustment:* Apply a **Evidence Discount**. If evidence is weak (no control group), cap the score at 5.
  **Output:** Ledger A Score (0–10) + Uncertainty Range.

  ### Gate 3: Ledger B (Uncountable) (30 Minutes)
  **Owner:** PO
  **Action:** Score structural/qualitative impact.
  **Method:** Check-box rubric. Sum the points (Max 10).
  1.  **Power Shift (0–4):** Does this shift decision-making power to beneficiaries? (0=No, 4=Beneficiaries control budget/strategy).
  2.  **Systemic Risk (0–3):** Does this reduce vulnerability to systemic shocks (policy change, climate, market crash)? (0=No, 3=High resilience built).
  3.  **Dignity/Agency (0–3):** Does this treat recipients as agents rather than subjects? (0=Paternalistic, 3=High agency).
  **Output:** Ledger B Score (0–10).
  **Explicit Judgment Call:** This score is subjective. The PO must write one paragraph justifying the score. This is where "dignity" is operationalized into a number, losing nuance (see Limitations).

  ### Gate 4: The Conversion (15 Minutes)
  **Owner:** PO
  **Action:** Apply the Board's Structural Multiplier (M).
  **Formula:** `Total Weighted Score = Ledger A Score + (Ledger B Score × M)`
  **Output:** A single ranking number.

  ### Gate 5: The Threshold (15 Minutes)
  **Owner:** PO
  **Action:** Filter for Board review.
  **Criteria:**
  1.  **Minimum Bar:** Total Weighted Score must be ≥ 6.0 (or top 50% of annual pipeline).
  2.  **Values Flag:** If Ledger B Score > Ledger A Score, the proposal is flagged as **"Values-Dependent."**
      *   *Reasoning:* Funding a project where structural impact outweighs countable impact is a philosophical stance, not an evidence stance.
      *   *Action:* These pass to the Board but require explicit discussion on M.
  **Output:** List of survivors with Scores, Uncertainty Ranges, and Flags.

  ### Gate 6: Board Handoff
  **Owner:** Board
  **Action:** Approve/Reject.
  **Constraint:** Board cannot change M mid-cycle. If they reject a "Values-Dependent" flag, they acknowledge they are overriding their own M setting for this cycle.

  ---

  ## Part 2: Application to Live Proposals

  *Assumption: The Board has set the Structural Multiplier (M) at 1.0 (Structural impact is valued equally to countable impact).*
  *Baseline for Ledger A Scoring: 10 = Best in class, 5 = Average, 0 = None.*

  ### Proposal 1: Unconditional Cash Transfer ($2M Renewal)
  *   **Gate 1 (Logic):** Pass. Direct causality is clear.
  *   **Gate 2 (Ledger A):**
      *   Evidence: RCT-backed, low uncertainty.
      *   CPO: Highly efficient.
      *   **Score: 9/10.**
  *   **Gate 3 (Ledger B):**
      *   Power Shift: 1 (Recipients get cash, but don't design program).
      *   Systemic Risk: 1 (Buffers shocks, doesn't change system).
      *   Dignity: 2 (Trusts recipients, but transactional).
      *   **Score: 4/10.**
  *   **Gate 4 (Conversion):** 9 + (4 × 1.0) = **13.0**.
  *   **Gate 5 (Threshold):** Passes. No Values Flag (A > B).
  *   **Verdict:** **Fund.** High confidence, high efficiency.

  ### Proposal 2: Land-Rights Legal Empowerment ($600k)
  *   **Gate 1 (Logic):** Pass. Plausible, though long-term.
  *   **Gate 2 (Ledger A):**
      *   Evidence: No comparison group. High uncertainty.
      *   CPO: Unknown.
      *   Evidence Discount applied (Cap at 5).
      *   **Score: 4/10.**
  *   **Gate 3 (Ledger B):**
      *   Power Shift: 4 (Changes legal standing vs. officials).
      *   Systemic Risk: 3 (Protects against dispossession permanently).
      *   Dignity: 3 (Legal agency).
      *   **Score: 10/10.**
  *   **Gate 4 (Conversion):** 4 + (10 × 1.0) = **14.0**.
  *   **Gate 5 (Threshold):** Passes. **Values Flag Raised** (B > A).
  *   **Verdict:** **Fund, but Board must acknowledge risk.** Under M=1.0, this outranks Cash. If the Board is uncomfortable funding "unproven" structural work, they must admit they are lowering M, not rejecting the evidence.

  ### Proposal 3: Earning-to-Give Fellowship ($900k)
  *   **Gate 1 (Logic):** Pass.
  *   **Gate 2 (Ledger A):**
      *   Evidence: Modeled on career length/donation %. High variance.
      *   CPO: Moderate.
      *   **Score: 6/10.**
  *   **Gate 3 (Ledger B):**
      *   Power Shift: 0 (Reinforces existing financial power structures).
      *   Systemic Risk: 1 (Diversifies funding sources).
      *   Dignity: 1 (Individual choice, but elite-focused).
      *   **Score: 2/10.**
  *   **Gate 4 (Conversion):** 6 + (2 × 1.0) = **8.0**.
  *   **Gate 5 (Threshold):** **FAIL.** (Below 13.0 and 14.0).
  *   **Verdict:** **Reject.**
  *   **Hard Truth:** This proposal is currently funded and championed by two board members. Under this procedure, it fails because it scores poorly on structural change (Ledger B) and has high uncertainty on donations realized (Ledger A).
  *   **To Pass:** The Board must raise M (unlikely to help this one) or the proposal must demonstrate significantly higher donation conversion rates (Ledger A) or a theory of how fellows change finance culture structurally (Ledger B).

  ---

  ## Part 3: Limitations & Overrules

  ### 1. Judgment Calls Dressed as Procedure
  *   **Ledger B Scoring:** Assigning "4 points" to Power Shift is not science. It is the PO's intuition codified. Two POs will score the Land Rights group differently.
      *   *Mitigation:* POs must calibrate scores on 3 past grants together before scoring new ones.
  *   **The Evidence Discount:** Capping Ledger A at 5 for weak evidence is an arbitrary penalty. It assumes structural work *cannot* be measured, rather than acknowledging we haven't measured it yet.

  ### 2. Dropped Distinctions (To Make it Usable)
  *   **Dignity vs. Power:** Ledger B collapses "feeling respected" (Dignity) with "having legal authority" (Power). These are different goods. The procedure treats them as interchangeable currency.
  *   **Time Horizons:** Ledger A favors short-term outcomes (easier to count). Ledger B favors long-term (structural change takes decades). The procedure does not discount for time, which biases toward immediate relief unless M is set very high.
  *   **Geographic Context:** A Power Shift score of 4 in a democracy means something different than in an autocracy. The rubric ignores context to save time.

  ### 3. Where the Procedure Will Systematically Get It Wrong
  *   **Black Swans:** The procedure cannot value low-probability, high-impact existential risk reduction (e.g., pandemic prevention) because Ledger A requires a "Cost Per Outcome" that doesn't exist for prevented extinction.
  *   **Movement Building:** Funding a network of activists often looks like "overhead" in Ledger A and "Power Shift" in Ledger B, but the multiplier M is rarely high enough to capture the tipping-point nature of social movements.
  *   **The "Safe Bet" Bias:** Proposals that game the rubric (e.g., adding a "beneficiary advisory board" to boost Ledger B by 1 point without real power) will rank higher than honest, messy work.

  ### 4. When the Program Officer Should Overrule the Procedure
  *   **The "Zero" Trap:** If Ledger A returns a 0 (no countable data) but the PO has high conviction based on field trust that the work is critical, the PO should invoke the **"Field Veto."** This sends the proposal directly to the Board with a memo: *"The procedure says No. I say Yes. Here is why the metrics are blind."*
  *   **The "Board Champion" Conflict:** In the case of the Fellowship (Proposal 3), if the Board insists on funding despite the score, the PO must record the decision as **"Board Override: Values > Evidence."** This prevents the procedure from being retroactively tweaked to justify the favorite, preserving the integrity of future cycles.

  ### 5. The Values Handoff
  The procedure stops at **Gate 5**.
  *   **Evidence Question:** "Did the cash transfer increase income?" (Gate 2).
  *   **Values Question:** "Do we prefer relieving suffering now (Cash) or changing the system later (Land)?" (Gate 4/5 via M).
  *   **Handoff:** The Board receives the ranked list. If they reorder the list (e.g., fund the Fellowship over the Land Rights), they are explicitly rejecting their own Structural Multiplier. The procedure forces this hypocrisy into the light.
