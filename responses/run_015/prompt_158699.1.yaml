      *   **Constraints:** Runnable in ~2 hours/proposal by a Program Officer (PO) with no econ training + part-time consultant. Only surviving proposals go to the Board.
      *   **Specific Mechanism:** Two ledgers (Countable vs. Uncountable). Board sets an annual "exchange rate" between them *before* seeing proposals.
