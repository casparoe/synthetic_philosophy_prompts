  2. Hegelian theory posits that creations are extensions of the author's personality, meaning appropriating an idea violates self-ownership rather than merely claiming rights over another's mental states. This defeats the incoherence charge by grounding idea-ownership in the universally accepted right to bodily and mental integrity.
  3. If the individuation of an idea-type depends on the specific labor required to construct it, Lockean mixing applies to the abstract configuration itself, not just its physical expression. This restores conceptual coherence to labor-based ownership claims without relying on artificial scarcity.
  4. The widespread intuition that plagiarism constitutes a wrong even without economic loss suggests a natural property right in ideas that exists prior to statutory artificial scarcity. This phenomenological evidence challenges the premise that idea-ownership is purely a constructive legal artifact.
  5. Ideas function as rivalrous goods regarding priority and credit, since only one agent can be recognized as the originator, creating a natural scarcity that property rights track rather than create. This demonstrates that the non-rivalrous consumption model does not exhaust the metaphysical behavior of idea-types.
