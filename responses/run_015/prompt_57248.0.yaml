          *   For #2: The answer to the friend is **Robustness/Stability**. Arbitrary patterns dissolve under noise; functional simmballs don't. This makes them observer-independent.
          *   For #7: Keep the slogan. It's the best part. It clarifies (1).
      *   *Single Best Change:* Revise (2) to emphasize **Counterfactual Robustness** over "clumping." This solves the friend's "zillions of patterns" objection (most don't survive perturbation) and supports (6).
      *   *Hidden Commitment:* The desire for **Semantic Objectivity**. You want meaning to be in the world, not projected.

  8.  **Refining the Output:**
      *   Tone: Philosophical but conversational (matching the user's "simms/shoving" vernacular).
