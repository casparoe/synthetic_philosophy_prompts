answer: |-
  1. Agent-centered restrictions function as structural boundaries on deliberation rather than weights in a consequentialist calculus, meaning their authority derives from maintaining the integrity of the reasoning process itself. In symmetric rescue cases, this structure remains intact because the prohibition forbids treating the constraint as a tradeable variable, regardless of the outcome differential.

  2. Procedural invariance requires that certain norms cannot be suspended simply because violating them produces a marginally better state of affairs, thereby preventing the collapse into a concealed threshold consequentialism. Consequently, symmetric rescue scenarios fail to undermine this invariance because the deliberative prohibition against using persons as means remains constant even when the aggregate harm shifts.

  3. The objection that morality demands allowing a worse world misunderstands the deontological goal, which prioritizes the integrity of agency over the optimization of global states. Upholding the restriction in a rescue case preserves deliberative structure by refusing to instantiate the wrongdoing, thereby maintaining procedural invariance against outcome pressure.

  4. Moral residue operates not as a punitive sanction for failing to maximize good, but as an epistemic marker signaling that the agent's practical identity has been fundamentally altered by treating a constraint as exchangeable. In symmetric rescue cases, feeling this residue confirms that the procedural invariant was breached, validating the constraint's independence from outcome comparison.

  5. Ultimately, the paradox dissolves because the normative work lies in sustaining a specific architecture of reasoning where certain actions are ineligible for selection, not in comparing the moral weight of resulting worlds. Symmetric rescue cases therefore do not trap the deontologist, as the coherence of practical identity depends on maintaining these structural boundaries rather than avoiding catastrophic outcomes.
