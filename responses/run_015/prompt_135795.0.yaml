  1. Brainstorming
  1. Institutional decoupling (org theory): Formal rules separate from actual work practices.
  2. Moral crumple zone (STS): Humans absorb liability for autonomous system errors.
  3. Symbolic compliance (law): Adopting structures to look legitimate without changing behavior.
  4. Skill fade (human factors): Loss of proficiency due to lack of practice over time.
  5. Audit culture (anthropology): Verification processes replace professional judgment.
  6. Regulatory capture (politics): Agencies serve the interests of the regulated industry.
  7. Path dependence (economics): Past decisions constrain future options regardless of utility.
  8. Epistemic closure (philosophy): A system refuses outside information that contradicts internal beliefs.
  9. Function creep (privacy): Technology used for purposes beyond original intent.
  10. Ritualization (sociology): Actions become ceremonial rather than instrumental.
  11. Automation bias (psychology): Over-reliance on automated suggestions despite contrary evidence.
  12. Liability shielding (law): Structuring contracts to shift legal risk away from developers.

  2. Nearest existing concept
  Institutional decoupling is the leading candidate. In organizational sociology, institutional decoupling occurs when an organization separates its formal structures from actual work practices to maintain legitimacy without disrupting efficiency. Your case instantiates this because the formal structure (the review log) remains intact while the actual practice (meaningful oversight) vanishes. The committee sees the structure and assumes the practice follows. However, decoupling stops short because it typically describes a static gap known to insiders, where everyone understands the rule is ceremonial. Your phenomenon is dynamic and epistemic: the structure actively erodes the practice over time, and crucially, the organization comes to believe the structure *is* the practice. Decoupling does not account for the feedback loop where the hollowed-out artifacts are used to certify the integrity of the system to itself and external auditors. It misses the consumption mechanism. The key divergence lies in the trajectory of belief. In standard decoupling, insiders know the policy is a shell. In your observation, the organization relies on the shell to prove safety, creating a genuine epistemic blind spot. The governance label does not just sit alongside the work; it reshapes the work until the work confirms the label. This recursive validation is absent from the original theory. Decoupling explains why the rule doesn't change the work; it does not explain how the rule changes the work to look like the rule while losing its function. Therefore, while decoupling provides the structural vocabulary, it lacks the causal mechanics of your specific governance loop.

  3. Runner-ups and the point of divergence
  Moral crumple zone is a strong contender from science and technology studies. This concept describes how humans are positioned to absorb liability for autonomous system failures. It rules out because it focuses on the aftermath of error and liability assignment, not the prior erosion of the capacity to prevent error.
  Symbolic compliance comes from socio-legal studies. This refers to adopting policies to signal legitimacy rather than to effect change. It rules out because it implies the policy was never intended to work, whereas your reviewers initially had genuine authority and capacity.
  Skill fade is a human factors term. This denotes the loss of proficiency due to lack of practice over time. It rules out because it describes a psychological side effect, not the institutional incentive structure that rewards the fade and hides it.
  Audit culture is an anthropological concept. This describes a shift where verification processes replace professional judgment as the primary value. It rules out because it explains the focus on metrics but not the specific loop where the metric proves the capacity it actually destroyed.
  Together, these concepts describe parts of the ecosystem but miss the engine. They capture the liability, the intent, the psychology, or the metrics, but none capture the recursive mechanism where the governance model eats its own justification.

  4. Verdict
  There is a genuine gap. Existing terms describe the state of hollow practice or the allocation of blame, but none capture the cybernetic loop where the governance label actively consumes the capacity required to justify it, then uses the remnants as proof of integrity. You are not over-describing; you have identified a dynamic mechanism of institutional self-deception that static labels miss. The distinction matters because mitigation requires more than enforcing rules; it requires breaking the feedback loop that makes the erosion invisible.

  5. Definition and coinage
  Name: **Governance Cannibalization**.
  Conditions:
  1. Status Dependency: A regulatory classification is assigned contingent on the existence of a specific human capacity.
  2. Incentivized Erosion: Maintaining that classification creates operational incentives that systematically degrade that capacity.
  3. Reflexive Validation: The artifacts produced by the degraded capacity are accepted as evidence that the capacity remains intact.
  Definition: Governance cannibalization is the process by which a compliance regime consumes the human competence it requires for justification, then uses the record of that consumption to certify continued safety.
  Utility: This coinage isolates the temporal and causal sequence that existing terms miss. It distinguishes the phenomenon from simple fraud, where the capacity was never there, and from static decoupling, where the gap is stable. It forces auditors to look for capacity metrics, not just activity logs. It reveals that the "tool" label is not a stable classification but a trajectory toward autonomy masked as oversight. By naming the mechanism, we can see that the risk is not just that the human fails, but that the governance model ensures the human *will* fail while claiming they did not. It shifts the audit focus from "was the box checked?" to "does checking the box still mean anything?" This allows regulators to demand evidence of capacity retention, such as seeded error tests, rather than mere throughput logs. Furthermore, it highlights the perverse incentive: the organization is rewarded for eroding the control while appearing to maintain it. Recognizing this prevents the mistake of treating the decay as an operational accident rather than a structural feature. It demands that governance labels be time-limited or contingent on capacity testing, not just process logs.

  6. Boundary cases
  1. Airline autopilot monitoring: In. Pilots log monitoring hours to certify competence, but reliance erodes manual flying skills needed for emergencies.
  2. Manual signature on digital forms: Out. If the signer never intended to read it, the capacity was never there to be eroded; this is fraud, not cannibalization.
  3. Open-source code review: Out. Reviewers may lose skills due to volume, but no regulatory label depends on their review rate for liability shielding.
  4. Medical residency hours: In. Residents log hours to prove training, but service demands erode learning time, yet logs certify competency.
  5. Algorithmic trading limits: In. Traders set limits to stay compliant, algorithms hug limits, traders lose market intuition, logs show compliance.
  The rubber stamp case is distinct because cannibalization requires the capacity to exist initially. If the practice was empty from day one, there is nothing to consume. This distinction is vital for remediation: fraud requires punishment, while cannibalization requires structural redesign. The open-source case lacks the regulatory pressure that drives the erosion; without the label benefit, the decay is just negligence, not a systemic feature.

  7. Field test
  Inject seeded errors (canaries) into the workflow at random intervals. Measure the detection rate against the logged review rate. If the log shows 100% review but detection stays at chance levels, you have cannibalization. Alternatively, measure time-per-decision; if it falls below the cognitive threshold for understanding while output volume remains high, the capacity is eroding regardless of the log. A third test involves rotating reviewers; if new reviewers catch errors the veterans miss despite identical logs, the veterans have undergone capacity decay masked by routine.
