answer: |-
  To the Ethics Committee,

  I am writing to formally designate Denver, Colorado—the location of the perfusion vat containing my brain—as my legal and ethical location for the purposes of my advance directive. While I understand the intuitive pull of designating Boston, where my body resides and where my wife will be physically present, doing so would fundamentally misunderstand the nature of the procedure, the function of an advance directive, and the metaphysical reality of my continued existence.

  My argument rests on three pillars: the locus of consciousness, the nature of the Continuity Model, and the protective purpose of legal personhood.

  ### 1. The Locus of the Self
  The primary function of an advance directive is to protect the rights and welfare of the *person*—the conscious subject who experiences pain, fear, hope, and death. In this procedure, the seat of that consciousness is unequivocally in Denver.

  If the perfusion system in Denver fails, I cease to exist, regardless of whether the body in Boston continues to breathe via life support. Conversely, if the body in Boston suffers cardiac arrest but the brain in Denver remains perfused and conscious, I am still alive, merely disembodied. Therefore, the entity that requires legal protection against unwanted medical intervention is the brain in the vat. To attach my legal personhood to the body in Boston is to treat the body as the master and the brain as a peripheral organ, which is biologically and phenomenologically incorrect. The advance directive follows the vulnerability of the subject, and the subject is vulnerable in Denver.

  ### 2. The Illusion of the Continuity Model
  The objection raised by the ethics office suggests that because my wife will be in Boston with a "fluent, responsive, unmistakably me" body, that is where I effectively am. This argument relies on the fidelity of the Continuity Model to conflate *simulation* with *presence*.

  We must be precise about what is happening during the 1.5-second latency gap. When my wife speaks to the body in Boston, and I respond from Denver, there is a three-second round-trip delay. During that silence, the Continuity Model generates behavior based on predictive algorithms trained on my past data. It is not me. It is a high-fidelity puppet.

  If my wife is comforted by this puppet, that is understandable. But to codify that comfort into a legal document is to enshrine an illusion. If a medical crisis occurs during a latency gap, the body in Boston might nod or speak based on the Model's prediction, not my actual consent. If the legal location is Boston, the hospital may treat the Model's output as my agency. By declaring Denver, I ensure that no action is taken based on the predictive filler of the Continuity Model. I am protecting my wife, too, from the horror of realizing later that she was taking consent cues from an algorithm, not her husband.

  ### 3. The Purpose of the Directive vs. Social Convenience
  The objection states: *"A claim about where a person is only ever says where the people who matter can reach them."*

  This is a category error regarding the function of an advance directive. A visitor log is for where people can reach you. A contact sheet is for where people can reach you. An advance directive is for where *harm* can reach you.

  The document exists to dictate what happens when I cannot speak for myself. If I am legally "in Boston," but my capacity to suffer is in Denver, we create a jurisdictional nightmare. Suppose the Denver facility detects neural distress indicative of a vegetative state, but the Boston body is physiologically stable. If my location is Boston, does the DNR apply? If my location is Denver, it does.

  To prioritize the wife's physical proximity over the patient's ontological location is to treat the patient as a social object rather than a moral subject. It suggests that my location is defined by where I am *watched*, rather than where I *see*. While I love my wife and wish to minimize her distress, the advance directive is not a tool for managing her grief; it is a tool for preserving my autonomy. My autonomy resides in the neural activity in Denver.

  ### Conclusion
  Designating Denver is not an act of alienation from my body or my wife. It is an act of honesty. It acknowledges that for the duration of this procedure, I am a brain in a vat, connected to a remote terminal. The terminal is in Boston; the user is in Denver.

  If the ethics office accepts Boston as my location, they are validating the Continuity Model as a substitute for the self. I cannot consent to that. I must ask that the law see me where I actually am: conscious, vulnerable, and waiting in Denver.

  Sincerely,

  [Your Name]
