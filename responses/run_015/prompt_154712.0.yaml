  You have identified a precise and philosophically rich tension that sits at the intersection of philosophy of mind, cognitive science, and AI safety. Your intuition is correct: standard causal explanations feel insufficient because the internal structure of the model supports a *rationalizing* explanation, even though there is no mind to hold the reason.

  The closest established philosophical concept is indeed **Free-Floating Rationales**, coined by Daniel Dennett. However, applying it to neural network interpretability requires specific adjustments, and it is best supplemented by concepts from **Teleosemantics** and the theory of **Subpersonal Cognition**.

  Here is a breakdown of the relevant concepts, the adjustments required for AI systems, and a vocabulary to distinguish these structures from ordinary causal mechanisms.

  ### 1. The Core Concept: Free-Floating Rationales (FFR)
  Dennett introduced "free-floating rationales" to describe situations in evolutionary biology where a trait exists because it solves a problem (e.g., a clam closes its shell to avoid predators), even though the clam has no concept of predators, safety, or shells. The "reason" for the trait exists in the environment of selection, not in the mind of the organism.

  **The Adjustment for Neural Networks:**
  In biology, the "selector" is natural selection over generations. In neural networks, the "selector" is **gradient descent over training steps**.
  *   **Standard FFR:** Explains why a *trait exists* (historical explanation).
  *   **Your Case:** You are observing how that trait *operates* during inference (functional explanation).

  To apply FFR here, you must view the internal feature (the "snow detector") as a **crystallized heuristic**. It is a piece of computational logic that was "selected" because it minimized loss during training. It functions as a rationale because it encodes a statistical regularity of the training environment (wolves often appear in snow) that the optimization process "discovered" and hardwired into the weights.

  **Refined Term:** **Optimization-Embedded Rationales.**
  These are rationales that exist independently of a reasoner, anchored not in a mind, but in the **loss landscape** and the **training history**.

  ### 2. The Content: Teleosemantics
  You noted that the feature functions as a justification. For something to be a justification, it usually needs content (it must be *about* something). How can a matrix multiplication be *about* snow?

  **Teleosemantics** (associated with Ruth Millikan and David Papineau) provides the vocabulary. It argues that the content of a representation is determined by its **proper function**, which is determined by its **selection history**.
  *   **Application:** The activation pattern "means" snow not because a human labeled it, but because it was selected by the training process to correlate with snow-like inputs to achieve the goal of classification.
  *   **The Normative Pull:** The reason it feels normative is that the system is teleological (goal-directed) via its loss function. The feature *ought* to trigger the "wolf" classification because, within the logic of the trained system, that is its function.

  **Refined Term:** **Derived Teleological Function.**
  The feature has a function derived from the training objective, giving it a "quasi-normative" status.

  ### 3. The Level: Subpersonal Cognition
  In cognitive science, a distinction is made between the **Personal Level** (beliefs, desires, reasons held by an agent) and the **Subpersonal Level** (neural firings, computational processes).
  *   Traditionally, "reasons" belong to the Personal Level.
  *   However, philosophers like Andy Clark and Dennett argue that subpersonal systems can perform **inference** without **comprehension**.

  Your neural network operates entirely at the subpersonal level. It lacks agency, so it cannot have "reasons" in the strict philosophical sense (which require the ability to reflect on and endorse the reason). However, it possesses **Reason-Analogues**.

  **Refined Term:** **Subpersonal Inferences.**
  These are causal transitions that mirror the structure of logical inference (If $P$, then $Q$) without a thinker.

  ### 4. Distinguishing "Reasons" from "Causes"
  You asked how to distinguish these structures from ordinary causal mechanisms. In philosophy of action (e.g., Donald Davidson), reasons *are* a species of causes. The distinction you are sensing is between a **Brute Cause** and a **Rationalizing Cause**.

  *   **Brute Cause:** A voltage spike causes a bit flip. There is no "aboutness."
  *   **Rationalizing Cause:** The "snow feature" causes the "wolf output" *because* the system is organized to treat snow as evidence for wolves.

  The difference is **Structural Isomorphism**. The internal mechanism mirrors the logical structure of a valid (or in this case, spurious) argument.
  *   *Premise:* There is snow.
  *   *Rule:* Snow implies Wolf.
  *   *Conclusion:* This is a Wolf.

  The model instantiates this structure physically. It is a **Materialized Syllogism**.

  ### 5. Recommended Vocabulary
  Since there is no single canonical term for this exact phenomenon in AI, you can construct a precise vocabulary by combining the concepts above. Here are three proposed terms, ranked by philosophical precision:

  **A. Qua-Reasons (or Reason-Proxies)**
  Use this to emphasize the ontological status. The feature is not a *real* reason (no agent holds it), but it functions *qua* (in the capacity of) a reason within the system's logic.
  *   *Usage:* "The snow activation acts as a **qua-reason** for the wolf classification."

  **B. Crystallized Heuristics**
  Use this to emphasize the origin. It was a flexible statistical strategy during training that has become fixed in the weights.
  *   *Usage:* "The model relies on a **crystallized heuristic** linking snow backgrounds to wolf labels."

  **C. Instrumental Norms**
  Use this to capture the normative feel. The normativity is not moral or epistemic (truth-seeking), but instrumental (loss-minimizing).
  *   *Usage:* "The system follows an **instrumental norm** derived from the training distribution, not an epistemic norm derived from reality."

  ### 6. A Warning: The Intentional Stance
  Dennett also warns of the **Intentional Stance**. We predict the model's behavior by treating it *as if* it had beliefs and reasons. This is pragmatically useful for interpretability.
  *   **The Trap:** Confusing the utility of the stance with the reality of the mind.
  *   **The Solution:** Acknowledge that the "reasons" are **Stance-Dependent Properties**. They are real features of the system *relative to an interpreter* trying to make sense of it, but they are not intrinsic mental states.

  ### Summary for Your Context
  When writing or discussing this, you might frame it as follows:

  > "The model exhibits **optimization-embedded rationales**. These are internal structures that function as **qua-reasons**: they support a **rationalizing explanation** of the output (e.g., 'it classified this as a wolf *because* it detected snow') despite being purely causal mechanisms. Unlike human reasons, these are **subpersonal inferences** grounded in **derived teleology** (the loss function) rather than agency. They are **free-floating rationales** crystallized into weights by gradient descent, creating **instrumental norms** that govern the system's behavior independently of any reasoner."

  This vocabulary respects the engineering reality (it's just math) while capturing the philosophical nuance (it behaves *as if* it were reasoning).
