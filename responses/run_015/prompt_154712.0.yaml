  ### 5. Recommended Vocabulary
  Since there is no single canonical term for this exact phenomenon in AI, you can construct a precise vocabulary by combining the concepts above. Here are three proposed terms, ranked by philosophical precision:

  **A. Qua-Reasons (or Reason-Proxies)**
  Use this to emphasize the ontological status. The feature is not a *real* reason (no agent holds it), but it functions *qua* (in the capacity of) a reason within the system's logic.
  *   *Usage:* "The snow activation acts as a **qua-reason** for the wolf classification."

  **B. Crystallized Heuristics**
  Use this to emphasize the origin. It was a flexible statistical strategy during training that has become fixed in the weights.
  *   *Usage:* "The model relies on a **crystallized heuristic** linking snow backgrounds to wolf labels."

  **C. Instrumental Norms**
  Use this to capture the normative feel. The normativity is not moral or epistemic (truth-seeking), but instrumental (loss-minimizing).
  *   *Usage:* "The system follows an **instrumental norm** derived from the training distribution, not an epistemic norm derived from reality."

  ### 6. A Warning: The Intentional Stance
  Dennett also warns of the **Intentional Stance**. We predict the model's behavior by treating it *as if* it had beliefs and reasons. This is pragmatically useful for interpretability.
  *   **The Trap:** Confusing the utility of the stance with the reality of the mind.
  *   **The Solution:** Acknowledge that the "reasons" are **Stance-Dependent Properties**. They are real features of the system *relative to an interpreter* trying to make sense of it, but they are not intrinsic mental states.

  ### Summary for Your Context
  When writing or discussing this, you might frame it as follows:

  > "The model exhibits **optimization-embedded rationales**. These are internal structures that function as **qua-reasons**: they support a **rationalizing explanation** of the output (e.g., 'it classified this as a wolf *because* it detected snow') despite being purely causal mechanisms. Unlike human reasons, these are **subpersonal inferences** grounded in **derived teleology** (the loss function) rather than agency. They are **free-floating rationales** crystallized into weights by gradient descent, creating **instrumental norms** that govern the system's behavior independently of any reasoner."

  This vocabulary respects the engineering reality (it's just math) while capturing the philosophical nuance (it behaves *as if* it were reasoning).
