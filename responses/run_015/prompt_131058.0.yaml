answer: |-
  1. Brainstorm / theory check
  Three theories. 1. Civic Republicanism: Voting is duty. Compulsion fits, but outsourcing ranking to parties undermines civic virtue and deliberation. 2. Liberal Expressivism: Voting is personal voice. Full preferential fits, but compulsion violates negative liberty and party cards distort authenticity. 3. Pragmatic Institutionalism: Voting is system maintenance. Preference flows and "lesser evil" talk fit, but treating votes as personal expression contradicts the strategic reality of party deals.
  Tension: The law demands individual completion of the ballot, but the culture encourages collective delegation. Compulsion forces presence, but cards minimize cognitive effort. Is the voter a citizen or a conscript? The system assumes autonomy while facilitating heteronomy. This creates a friction between the legal subject (independent voter) and the sociological reality (party follower).

  2. The practice in concrete terms
  Australian federal elections mandate attendance under penalty of fine. Voters must number every candidate box sequentially (full preferential). Parties distribute suggested ordering cards at booths. The count eliminates the lowest candidate and redistributes their votes based on the next number until one candidate holds a majority. Invalid ballots (errors) are discarded. The system assumes every voter produces a complete ranking, regardless of actual preference intensity. It treats the ballot as a complete ordering of all available options, ensuring no vote is exhausted before a winner is found.

  3. The implicit philosophy reconstructed
  The implicit philosophy is "Stability via Managed Participation." It treats voting primarily as a civic duty to legitimize the system, not merely an individual right. Compulsion asserts that the polity requires your input to function, regardless of your desire. However, recognizing that forced participation risks high error rates or resentment, the system tacitly permits outsourcing deliberation via how-to-vote cards. This creates a hybrid voter: legally sovereign, practically guided.

  The "lesser evil" discourse reveals a negative utilitarianism embedded in the count. Since preferences flow, you aren't just choosing a winner; you're ordering losers. The system presupposes you have a responsibility to provide a complete contingency plan for representation, not just a first choice. It values the *validity* of the ballot over the *authenticity* of the preference. You must play the game, but the rules allow you to copy your neighbor's moves. This reconciles the tension between duty (show up) and capacity (know how to vote) by allowing parties to bridge the gap. The vote is an expression of trust in the process, even if the content is borrowed. It assumes voters care more about outcome than authorship. When voters rank bad candidates to ensure preferences flow, they acknowledge the vote is a tool for damage limitation. The system treats this rational calculation as valid participation. It doesn't demand enthusiasm, only compliance with the numbering rules. This suggests the underlying commitment is to the *continuity of government* rather than the *will of the individual*. The voter is a stakeholder required to maintain the machine, not necessarily a driver choosing the destination.

  4. What's strictly required vs what's just compatible
  Strictly required is the duty to participate and the requirement for a complete ordering. The law needs you there, and it needs a full ranking to ensure the winner has majority support through flows. These are hard presuppositions. What's merely compatible is the rhetoric of individual expression. The law says it's your secret preference, but it doesn't test for independence. How-to-vote cards are legally external to the ballot but institutionally embraced. The fiction that you devised the ranking yourself is compatible with the practice, but not required. The system works even if everyone follows cards, provided they number the boxes correctly. The fine enforces attendance, not independent thought. The law requires the *act* of ranking, not the *origin* of the ranking.

  5. What breaks if we swap the view
  If we adopted a Pure Expressive view, compulsion would vanish (forcing expression is coercion). We'd allow optional preferential voting or "none of the above" to respect true indifference. Party cards might be banned to protect authentic voice. If we adopted a Pure Strategic view, we'd shift to party-list proportional representation. Voting would be for a platform, not a person. Secret ballots might be relaxed to ensure bloc discipline. The current system breaks under Pure Expressivism because turnout would drop and informal votes might rise without compulsion/cards. It breaks under Pure Strategic views because individual candidate ranking becomes inefficient noise compared to party totals. The current hybrid survives by sacrificing philosophical purity for operational robustness. Specific legal changes would include amending the Electoral Act to remove penalty notices for non-attendance. For the strategic view, we would need to abolish individual candidate ballots entirely.

  6. Bottom line
  The practice has a coherent implicit theory, but it's not one found in textbooks. It's a theory of *administrative legitimacy*. It prioritizes a functioning parliament over voter sovereignty. It's not underdetermined; it's deliberately pragmatic. It accepts that most voters don't want to deliberate deeply, so it compels their presence while simplifying their choice. The philosophy is: "Show up, fill the boxes, let the math decide." It's coherent as a stability mechanism, even if it clashes with liberal ideals of autonomy.
