prompt: |-
  We routinely form beliefs on the basis of testimony: you tell me it is raining outside, and I believe you; you tell me the store closes at six, and I plan accordingly. Yet many people exhibit a striking asymmetry when it comes to moral matters. They resist deferring to the moral judgments of others, even when those others are people they regard as thoughtful, well-informed, and generally trustworthy. If a friend who has studied a policy debate tells you the policy is unjust, you may want to examine the reasoning yourself rather than simply adopt the conclusion; if someone you respect says a particular action would be wrong, you might feel unease at taking their word for it without working through the case on your own.

  What view of moral knowledge, moral understanding, or moral agency does this asymmetry presuppose? Does the practice commit us to the claim that moral knowledge cannot be transmitted by testimony at all — and if so, what feature of moral facts or moral epistemology would explain that block? Or does it commit us only to the weaker claim that there is something defective about acquiring moral beliefs that way, even if transmission is possible? Reconstruct the implicit epistemology, distinguish what the practice strictly presupposes from what it merely fits well with, and identify the points at which the practice is philosophically underdetermined — where more than one theory would license the same pattern of resistance.
reasoning: |-
  Here's a thinking process that leads to the essay response:

  1.  **Deconstruct the Prompt:**

      *   **Phenomenon:** There's an asymmetry between accepting testimony in non-moral domains (weather, store hours) and moral domains (justice, wrongness). We resist deferring to moral experts/peers even if trustworthy.
      *   **Core Question:** What view of moral knowledge, understanding, or agency does this presuppose?
      *   **Specific Sub-questions:**
          *   Does it imply moral knowledge *cannot* be transmitted by testimony (strong claim)?
          *   Does it imply acquiring moral beliefs via testimony is *defective* but possible (weak claim)?
          *   What feature of moral facts/epistemology explains the block (if any)?
          *   **Task:** Reconstruct the implicit epistemology, distinguish strict presuppositions from compatible theories, and identify points of philosophical underdetermination (where multiple theories explain the same resistance).

  2.  **Initial Brainstorming & Mapping the Terrain:**

      *   *The Asymmetry:* Why do we do this? Is it rational?
      *   *Option A (Strong Anti-Testimony):* Moral knowledge requires first-hand grasp. Testimony is impossible. (Kantian autonomy? Intuitionism requiring direct apprehension?)
      *   *Option B (Weak Anti-Testimony):* Testimony *can* give knowledge, but it's less valuable than understanding. (Virtue epistemology? Understanding vs. Knowing?)
      *   *Option C (Agency/Autonomy):* It's not about knowledge per se, but about moral responsibility. To be a moral agent, I must own the judgment. (Strawson? Darwall?)
      *   *Option D (Contextual/Pragmatic):* Moral judgments involve action. Blindly following is risky or alienating.
      *   *Underdetermination:* The *behavior* (resistance) is the same, but the *reason* varies. I need to show how different meta-ethical or epistemological views converge on this practice.

  3.  **Structuring the Essay:**

      *   **Introduction:** Define the asymmetry (The "Moral Testimony Pessimism" debate). State the thesis: The practice does not strictly entail a single metaphysical or epistemological claim but reveals a cluster of commitments regarding agency, understanding, and the normative force of moral reasons.
      *   **Section 1: The Strong Claim (Transmission Impossible).** Explore the view that moral facts are inherently non-deferential.
          *   *Metaphysical angle:* Non-naturalism? (You have to "see" the value).
          *   *Epistemological angle:* Moral knowledge requires a specific cognitive state (sentiment, intuition) testimony can't trigger.
      *   **Section 2: The Weak Claim (Transmission Possible but Defective).** This is the more nuanced view.
          *   *Understanding vs. Knowledge:* You can know *that* X is wrong via testimony, but you lack *understanding* of *why*.
          *   *Virtue Epistemology:* Relying on testimony fails to cultivate moral character/virtue.
      *   **Section 3: Moral Agency and Autonomy (The Practical Turn).** Shift from epistemology to action.
          *   *Kantian Autonomy:* Heteronomy is morally suspect.
          *   *Responsibility:* I am responsible for my actions; I cannot outsource the justification.
      *   **Section 4: Underdetermination Analysis.** This is crucial for the prompt.
          *   Show how Realists, Expressivists, and Kantians can all endorse the resistance for *different* reasons.
          *   Distinguish what is *presupposed* (I must act on reasons I grasp) vs. what is *compatible* (Moral facts are sui generis).
      *   **Conclusion:** Summarize. The asymmetry highlights the unique link between moral judgment and motivation/action, rather than settling the metaphysics of moral truth.

  4.  **Drafting - Section by Section (Iterative refinement):**

      *   *Intro:* Start with the everyday example. Name the philosophical debate (Moral Testimony Pessimism).
      *   *The "Impossible" View:* If I say "I can't know via testimony," I'm claiming a special access requirement. Maybe moral properties are response-dependent? Or maybe moral knowledge is a "knowing-how" rather than "knowing-that"? *Critique:* This seems too strong. We do accept some moral testimony (e.g., "slavery is wrong"). So the practice isn't absolute refusal, but *resistance* in contested cases.
      *   *The "Defective" View:* This is more plausible. Hills (2015) is key here. "Moral Understanding." Knowing *that* isn't enough; you need to know *why*. Testimony gives the 'that', not the 'why'. This fits the prompt's "examine the reasoning yourself."
      *   *Agency:* Why does understanding matter? Because morality guides action. If I act on a reason I don't grasp, am I acting morally or just obediently? This touches on Autonomy.
      *   *Underdetermination:* This needs careful handling.
          *   *Scenario:* I refuse to believe my friend that Policy X is unjust without checking.
          *   *Theory 1 (Non-Naturalist):* I need to intuit the non-natural property.
          *   *Theory 2 (Constructivist):* I need to participate in the construction of the norm.
          *   *Theory 3 (Virtue Ethicist):* I need to habituate my character.
          *   *Result:* All lead to resistance. Therefore, the practice doesn't prove Non-Naturalism. It underdetermines the metaphysics.
      *   *Strict Presuppositions:* What *must* be true for this practice to make sense?
          *   1. Moral judgments are action-guiding in a way weather reports aren't.
          *   2. The agent bears a specific responsibility for the justification of moral actions.
          *   3. There is a distinction between believing a proposition and grasping the reasons for it.

  5.  **Refining the Argument (Self-Correction during drafting):**

      *   *Check:* Did I answer "Does the practice commit us to the claim that moral knowledge cannot be transmitted...?"
      *   *Correction:* I need to be explicit. No, it doesn't commit us to the *strong* claim necessarily. The *weak* claim is sufficient to explain the behavior. The behavior is consistent with transmission being *possible* but *normatively costly*.
      *   *Check:* Did I distinguish presupposition from fit?
      *   *Correction:* Create a specific section or clear markers for "Strict Presuppositions" vs. "Theoretical Fit."
      *   *Tone:* Keep it analytical and philosophical. Use terms like "epistemic dependence," "autonomy," "propositional knowledge vs. understanding."

  6.  **Final Polish:**

      *   Ensure the distinction between *moral knowledge* (propositional) and *moral understanding* (grasping relations) is clear.
      *   Ensure the link between *agency* and *epistemology* is highlighted (the "practical" nature of morality).
      *   Check against the prompt's requirement to identify points of underdetermination. (e.g., The practice is compatible with both Moral Realism and Constructivism).

  7.  **Final Review against Prompt:**
      *   Reconstruct implicit epistemology? Yes (Understanding > Blind Belief).
      *   Distinguish strict presuppositions from fit? Yes (Agency/Responsibility is presupposed; Metaphysics is fit).
      *   Identify underdetermination? Yes (Realism, Expressivism, Constructivism all explain the resistance).
      *   Strong vs. Weak claim? Yes (Argue for Weak as more plausible, Strong as possible but not required).

  *(Self-Correction Note)*: Make sure not to just list theories. Keep the focus on what the *practice itself* reveals. The practice is the data; the theories are the explanations. The prompt asks what the practice *presupposes*.

  8.  **Final Output Generation** (Proceeding to write the response based on these thoughts).
answer: |-
  The asymmetry you describe—between our willingness to accept non-moral testimony (weather, store hours) and our resistance to accepting moral testimony (justice, wrongness)—lies at the heart of a contemporary debate in meta-ethics known as **Moral Testimony Pessimism**. To analyze what this practice presupposes, we must distinguish between the *phenomenology* of the resistance (the feeling that we ought to judge for ourselves) and the *metaphysical or epistemological commitments* required to justify it.

  The practice does not strictly commit us to the strong claim that moral knowledge *cannot* be transmitted by testimony. Rather, it commits us to a weaker, normative claim: that acquiring moral belief via testimony is epistemically or morally defective, even if transmission is metaphysically possible. This distinction reveals that the asymmetry rests less on the nature of moral *facts* and more on the nature of moral *agency* and the specific value of moral *understanding*.

  ### I. The Strong vs. Weak Claims

  The prompt asks whether the practice commits us to the claim that moral knowledge cannot be transmitted at all (Strong Pessimism) or merely that doing so is defective (Weak Pessimism).

  **The Strong Claim (Transmission Impossible):**
  If the practice presupposed the strong claim, it would imply a unique barrier in moral epistemology. This would require a specific metaphysical explanation: perhaps moral properties are non-natural and require a special faculty of intuition that testimony cannot trigger; or perhaps moral judgments are not belief-states at all but expressions of attitude (Expressivism), which cannot be "passed on" like data.
  *However*, the practice does not strictly entail this. We do not treat moral testimony as *impossible* in the way we treat telepathy. We acknowledge that children learn morals from parents, and adults often accept that slavery is wrong based on societal consensus. If transmission were impossible, moral education would be a myth. Therefore, the resistance in contested adult cases is not a denial of possibility, but a hesitation regarding *value*.

  **The Weak Claim (Transmission Defective):**
  The practice fits better with the weak claim: testimony can yield moral *knowledge* (justified true belief), but it fails to yield moral *understanding*. This is the view championed by philosophers like Alison Hills. One can know *that* an action is wrong via testimony, but one lacks understanding of *why* it is wrong.
  The asymmetry presupposes that in the moral domain, "knowing that" is insufficient for full normative standing. In non-moral domains (e.g., "the store closes at six"), the proposition is the end goal. In moral domains, the proposition is a premise for action. Acting on a moral truth one does not understand feels like following a rule rather than responding to a reason. Thus, the practice presupposes that **moral understanding is more valuable than mere moral knowledge.**

  ### II. Reconstructing the Implicit Epistemology

  The resistance to moral deference reconstructs an epistemology where **grasping reasons** is central to justification. This implies a "reasons-first" epistemology specific to normativity.

  1.  **The Connection to Motivation:** Non-moral testimony (rain, store hours) informs belief, which *may* lead to action. Moral testimony is inherently practical; it prescribes action. The implicit epistemology assumes that to be properly motivated by a moral reason, one must grasp the content of that reason. Blindly following a moral command decouples the agent from the rationale of the action.
  2.  **The Autonomy Constraint:** The practice presupposes that moral agency requires a degree of cognitive autonomy. To be a moral agent is to be responsive to reasons, not merely to reliable indicators of reasons. If I believe X is wrong solely because you say so, I am responsive to *your authority*, not to the *wrongness of X*. The epistemology here is tied to the ontology of reasons: moral reasons must be apprehended by the agent to function as reasons *for that agent*.
  3.  **Virtue and Character:** The resistance also fits a virtue-epistemological framework. Acquiring beliefs via testimony is a passive cognitive state. Acquiring moral understanding is an active achievement. The practice presupposes that the *process* of belief formation matters morally. Relying on testimony might be epistemically efficient, but it is morally lazy; it fails to cultivate the sensitivity required for future moral judgment.

  ### III. Strict Presuppositions vs. Theoretical Fit

  It is crucial to distinguish what the practice *forces* us to accept versus what merely *explains* it.

  **Strict Presuppositions:**
  For the resistance to be rational (and not just a quirk), the practice must presuppose:
  1.  **The Action-Guiding Nature of Morality:** Moral judgments differ from weather reports because they demand a first-personal endorsement to guide action authentically.
  2.  **The Distinction Between Knowledge and Understanding:** It must be possible to know a truth without understanding its grounds, and in morality, the latter is required for full agency.
  3.  **Agent-Responsibility:** The agent bears a unique responsibility for the justification of their moral actions that they do not bear for their factual beliefs. (I am not blameworthy for believing it is raining based on your word if it isn't; I may be blameworthy for harming someone based on your word that it is permissible).

  **Merely Compatible (Theoretical Fit):**
  The following meta-ethical views *fit* the practice well but are not *presupposed* by it:
  1.  **Moral Non-Naturalism:** One might argue we resist testimony because we need to intuit non-natural properties. But a Naturalist can also argue we need to understand the natural properties (suffering, welfare) to judge correctly. The practice does not prove Non-Naturalism.
  2.  **Moral Realism vs. Anti-Realism:** A Realist can argue we need to see the moral truth; a Constructivist can argue we need to participate in the construction of the norm. Both license resistance to deference.
  3.  **The Existence of Moral Experts:** The practice is compatible with the existence of moral experts, provided their role is to teach us *how* to judge (facilitate understanding) rather than *what* to judge (provide conclusions).

  ### IV. Points of Philosophical Underdetermination

  The most significant philosophical insight here is that the practice of resisting moral testimony is **underdetermined** regarding the metaphysics of morality. Multiple, mutually exclusive theories license the same pattern of resistance.

  **1. The Source of the Block:**
  *   *Theory A (Epistemic):* The block is cognitive. Moral concepts are complex, and testimony cannot convey the requisite conceptual grasp (similar to learning a color concept).
  *   *Theory B (Practical):* The block is volitional. Morality requires autonomy. To defer is to surrender one's will (Kantian Heteronomy).
  *   *Theory C (Social):* The block is relational. Moral judgments make claims on others. To accept a moral judgment on testimony is to accept a claim on my behavior without validating the standing of the claimant.

  All three theories predict the same behavior (resistance to deference), yet they posit entirely different underlying mechanisms. The practice alone cannot tell us whether the barrier is in the *mind* (concepts), the *will* (autonomy), or the *social relation* (authority).

  **2. The Scope of the Asymmetry:**
  The practice is also underdetermined regarding *which* moral matters require independent judgment.
  *   *View 1:* All moral judgments require first-hand reasoning (Radical Autonomy).
  *   *View 2:* Only contested or complex policy debates require it; core prohibitions (murder is wrong) can be taken on testimony (Moderate Autonomy).
  The prompt describes resistance in cases of policy or specific actions, implying the Moderate view. However, the *principle* invoked ("examine the reasoning yourself") could logically extend to everything. The practice does not settle where the line is drawn, only that a line exists.

  **3. The Nature of the Defect:**
  If I do defer, what goes wrong?
  *   *Option A:* I lack knowledge (Strong Pessimism).
  *   *Option B:* I have knowledge but lack virtue (Virtue Ethics).
  *   *Option C:* I have knowledge and virtue, but my action lacks moral worth because it was not done from duty/reason (Kantianism).
  The observable behavior (hesitation to defer) is identical in all three cases. Therefore, the practice cannot adjudicate between these theories of moral worth.

  ### Conclusion

  The asymmetry in our treatment of moral testimony does not commit us to the metaphysical claim that moral facts are inherently private or non-transmissible. Instead, it commits us to a normative claim about **moral agency**: that to act morally is to act on reasons one grasps, not merely on signals one obeys.

  The practice presupposes that moral understanding is a constituent of moral worth, distinguishing it from non-moral information where utility trumps understanding. However, this practice is philosophically underdetermined. It is compatible with Moral Realism and Constructivism, Intuitionism and Rationalism. It reveals less about the *structure of moral truth* and more about the *structure of the moral agent*—specifically, that we regard ourselves as authors of our actions, requiring not just correct outputs, but transparent access to the reasoning that produces them. The resistance to testimony is ultimately a defense of the integrity of the moral self.
