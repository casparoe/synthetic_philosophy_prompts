answer: |-
  You have articulated a distinction that is philosophically robust but terminologically under-served. You are describing a phenomenon that sits at the intersection of **aesthetics**, **moral psychology**, and **speech-act theory**.

  There is no single, canonical proper noun (like "The Kantian Exclusion") for the specific view you hold. However, your position is not without precedent. It is a refined subset of **Ethical Criticism of Audience Response**, distinct from the more common Ethical Criticism of Artistic Value.

  Here is the breakdown of where your view fits in the literature, the concept I propose to name it, how it handles your boundary cases, and an explicit calibration of confidence.

  ### 1. The Established Neighborhood
  Your view does not fit the three categories you dismissed (Ethicism, Complicity, Genetic Fallacy). It fits most closely with two established lines of inquiry, though neither captures your specific "interpersonal stance" mechanism perfectly on its own.

  **A. Art as Communication/Address (Stanley Cavell / Noël Carroll)**
  Philosophers like Stanley Cavell (in film) and Noël Carroll (in narrative art) have argued that artworks are not just objects to be viewed but **communications to be acknowledged**. On this view, engaging with art is entering a relationship.
  *   **Where it fits:** It explains why the "situation of being addressed" matters. If art is a conversation, the moral character of the speaker matters.
  *   **Where it overflows:** Most proponents of this view still tie the objection to *understanding* the work (e.g., "I can't understand this love song if I know the singer is a misanthrope"). You are claiming you *can* understand and appreciate it, but you *won't accept the address*.

  **B. Second-Personal Reasons (Stephen Darwall)**
  In moral philosophy, Stephen Darwall distinguishes "second-personal reasons" (claims one person makes on another, grounded in a relationship of mutual accountability) from third-personal reasons (objective facts).
  *   **Where it fits:** Your description of "warmth, trust, charm, the sense of being spoken to and of answering back" is a precise description of a second-personal stance. You are arguing that the artist, by virtue of their abuse, has forfeited the **standing** to make a second-personal demand on your attention.
  *   **Where it overflows:** Darwall applies this to moral interaction, not aesthetic consumption. Applying it to recorded music from a dead artist requires extending the concept of "standing" beyond living dialogue.

  **The Verdict on Established Concepts:**
  There is no established term that combines *Aesthetic Address* with *Non-Consequentialist Moral Standing* while explicitly *exonerating the work's quality*. You are describing a **Non-Consequentialist, Relational Objection to Artistic Address.**

  ### 2. The Proposed Concept: "Relational Disqualification of Address"
  Since no tight term exists, I will coin one to classify your pattern and the boundary cases. Let us call this **Relational Disqualification of Address (RDA)**.

  **Definition:** RDA occurs when an audience member withdraws engagement from a work not because the work is aesthetically diminished, nor because engagement causes harm, but because the **mode of presentation** relies on an interpersonal invitation (trust, intimacy, confession) that the artist has morally forfeited the standing to issue.

  **How it carves off the neighbours:**
  *   **Vs. Ethicism:** Ethicism says the work is *worse*. RDA says the work is *unchanged*, but the *invitation is void*.
  *   **Vs. Complicity:** Complicity says listening *helps* the bad person. RDA says listening *accepts a false premise of relationship* from the bad person.
  *   **Vs. Association:** Association says the work is *contaminated*. RDA says the *channel of communication* is severed.

  **The Mechanism:**
  The singer (Artist A) offers a **Second-Personal Invitation** ("I am speaking to *you*"). The bandleader (Artist B) offers a **Third-Personal Presentation** ("Here is a sound for *us*").
  *   When the singer abuses, the "I" in the song becomes toxic. The resident cannot accept the "I" without validating the relationship.
  *   When the bandleader abuses, the "We" of the band remains functional. The abuse is biographical, not performative.

  ### 3. Classifying the Boundary Cases
  Using **RDA**, here is how we classify your four test cases:

  **1. A performance in which the warmth belongs to a character rather than the performer.**
  *   **Verdict:** **Kept.**
  *   **Reasoning:** The interpersonal address is diegetic (fictional). The singer is acting as a vessel for a character. The trust is placed in the *character*, not the *performer*. The abuser is not the one addressing you; the mask is. (e.g., An actor playing a saint who is a sinner in real life).
  *   **Caveat:** If the performance relies on the audience knowing the actor's *real* persona to work (e.g., a confessional stand-up set), RDA applies and it is **Dropped**.

  **2. A track heard as documentary evidence rather than as a record.**
  *   **Verdict:** **Kept.**
  *   **Reasoning:** The stance shifts from **Appreciative** to **Forensic**. You are not accepting an invitation to intimacy; you are examining evidence. The "address" is not "Trust me," but "Observe this." RDA only blocks invitations, not observations.

  **3. An artist whose wrongdoing was unknown when the work was made and who died before it was known.**
  *   **Verdict:** **Dropped (upon discovery).**
  *   **Reasoning:** This tests your "Property vs. Reason" question. Under RDA, the work *did not change*, but the **validity of the standing** is retroactively voided. It is like finding out a letter from a deceased friend was forged. The letter is physically identical, but you cannot relate to it as a communication *from them*. The "reason" is acquired by you, but it reveals a fact about the *relationship* that was always false.

  **4. A work made collaboratively, where the invitation seems to come from a group.**
  *   **Verdict:** **Context-Dependent (Likely Kept).**
  *   **Reasoning:** If the "voice" is choral or ensemble-based, the address is plural ("We"). Unless the specific abuser is the dominant voice (e.g., the lead singer of a band vs. the drummer), the interpersonal invitation is diluted. The moral standing of the *group* may remain intact even if one member's is forfeit. This explains why you kept the bandleader: the sound was the band's, not just his.

  ### 4. Confidence Calibration

  **High Confidence (Established Distinction):**
  I am highly confident that your distinction is **not** Complicity or Ethicism. You have correctly identified that the "no money/dead artist" clause rules out consequentialism, and the "work didn't get worse" clause rules out standard Ethicism. You are operating in the realm of **Normative Aesthetics**, specifically the ethics of *uptake*.

  **Medium Confidence (The "Interpersonal" Mechanism):**
  I am moderately confident that "Interpersonal Stance" is the correct variable. This relies on the assumption that the residents (and you) perceive the singer's work as *confessional* and the bandleader's as *functional/ensemble*. If the bandleader's music was actually perceived as deeply intimate (e.g., a solo violinist known for personal letters to fans), RDA predicts you should drop them too. If you wouldn't, then "Intimacy" might not be the true variable.

  **Low Confidence (The "Property vs. Reason" Ontology):**
  You ask: *"Either the work acquired a property it didn't have, or I acquired a reason."*
  Philosophically, this is the debate between **Response-Dependent Realism** vs. **Projectivism**.
  *   *Realism:* The work now has the relational property "Being an invitation from an abuser." This property was always there, just unknown.
  *   *Projectivism:* You are projecting your moral discomfort onto the work.
  *   *My Verdict:* I lean toward **Realism about Relational Properties**. The work *is* a communication. A communication from a liar *is* different from a communication from a truth-teller, even if the words are identical. Therefore, the work *did* acquire a relational property (its status as a valid speech act changed) when the knowledge became public.

  ### 5. Fragility and Falsification
  Here is where my construction of your view is most vulnerable, and what would change my verdict.

  **The Fragile Point: The "Intimacy" Metric**
  My classification relies entirely on the claim that the Singer's work is "Intimate Address" and the Bandleader's is "Ensemble Sound."
  *   **Falsification Condition 1:** If the Bandleader's tracks are actually just as confessional and persona-driven as the Singer's (e.g., he speaks intimately over the music), and you *still* keep them, then "Intimacy" is not the variable. The variable might be **Salience** (how much the artist's face is on the cover) or **Habit** (how hard it is to find replacements).
  *   **Falsification Condition 2:** If the residents say, "We don't care about the relationship, we just feel unsafe," then this *is* a form of Consequentialism (psychological harm to the listener), which collapses back into a standard welfare argument. You must verify that the objection is truly about *moral standing* ("He doesn't deserve to speak to us") rather than *comfort* ("This makes us feel icky").

  **The Alternative Explanation (The "Two Phenomena" Risk)**
  It is possible you are running two phenomena together:
  1.  **For the Singer:** A genuine **Relational Disqualification** (He lied to us).
  2.  **For the Bandleader:** **Inertia/Threshold** (The allegations are older, less vivid, or the music is less central to the identity of the hour).
  *   **Test:** If a new documentary came out tomorrow about the Bandleader with the *same* level of detail and horror as the Singer's, would you drop him immediately?
      *   **Yes:** Then your theory (RDA) holds, provided his music is less intimate.
      *   **No:** Then your decision is likely driven by **Moral Fatigue** or **Curation Burden**, not a principled distinction about interpersonal address.

  ### Summary for the Residents
  To explain this to the eighty-year-olds without using philosophy:
  *"We aren't saying the record is broken. We are saying that listening to this singer is like accepting a gift from a neighbor. We found out this neighbor hurt people terribly. We don't want to be in the position of accepting gifts from him anymore, even if the gifts are beautiful. The bandleader isn't offering us a gift of friendship; he's offering us music for the room. That's a different thing."*

  This preserves their dignity (they aren't "confused"), validates the art (it's still beautiful), and explains the distinction (Gift vs. Service) without needing to litigate the crimes.
