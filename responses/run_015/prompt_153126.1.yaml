  ### Example: The Hospital Formulary Committee

  **Domain:** Clinical Treatment Selection (Hospital Procurement)
  **Agent:** A Hospital Formulary Committee (HFC)
  **Options:** Three competing pharmaceutical treatments for a chronic condition: **Drug A**, **Drug B**, and **Drug C**.

  #### 1. The Stable Utility Function
  The HFC has a single, stable utility function over the final health and economic outcomes of the hospital population. They value three attributes equally:
  1.  **Efficacy ($E$):** Reduction in symptom severity.
  2.  **Safety ($S$):** Reduction in adverse events.
  3.  **Cost ($K$):** Reduction in procurement expenditure.

  The true, stable utility for any drug $i$ is:
  $$U(i) = E_i + S_i - K_i$$

  The physical outcomes (the chemical composition and effects of the drugs) do not change throughout the sequence. The HFC's underlying valuation of efficacy, safety, and cost also remains constant.

  **True Attribute Profiles:**
  *   **Drug A:** High Efficacy (10), Low Safety (2), Medium Cost (5). $\rightarrow U(A) = 10 + 2 - 5 = 7$
  *   **Drug B:** Medium Efficacy (5), High Safety (10), Low Cost (2). $\rightarrow U(B) = 5 + 10 - 2 = 13$
  *   **Drug C:** Low Efficacy (2), Medium Safety (5), High Cost (10). $\rightarrow U(C) = 2 + 5 - 10 = -3$

  *Note: In a standard utility maximization without informational constraints, the HFC should always prefer B > A > C.*

  #### 2. The Choice Sequence and Informational Updates
  The HFC makes three sequential binary choices. Between each choice, they receive a **Regulatory Compliance Directive** (the Information). This information does not update the probabilities of the drug outcomes (Bayesian); rather, it non-Bayesianly updates the **Decision Rule** by specifying which attribute is *normatively relevant* for that specific comparison. The HFC's stable utility includes a high penalty for violating regulatory directives (Compliance Utility), so they adhere to the relevance rule strictly.

  **Stage 1: Choice between A and B**
  *   **Information Received:** A directive from the Insurance Provider states: *"For this funding cycle, all candidate drugs meet minimum safety and cost thresholds. Decision must be based **solely on Efficacy**."*
  *   **Relevance Update:** Safety and Cost weights are set to zero for this comparison. Only $E$ matters.
  *   **Comparison:** $E_A (10) > E_B (5)$.
  *   **Choice:** **A is selected over B.**
  *   **Revealed Preference:** $A \succ B$.

  **Stage 2: Choice between B and C**
  *   **Information Received:** A directive from the Patient Safety Board states: *"For this patient cohort, efficacy levels are clinically equivalent above a threshold. Decision must be based **solely on Safety**."*
  *   **Relevance Update:** Efficacy and Cost weights are set to zero for this comparison. Only $S$ matters.
  *   **Comparison:** $S_B (10) > S_C (5)$.
  *   **Choice:** **B is selected over C.**
  *   **Revealed Preference:** $B \succ C$.

  **Stage 3: Choice between C and A**
  *   **Information Received:** A directive from the Hospital Budget Office states: *"For the upcoming fiscal year, clinical outcomes are met. Decision must be based **solely on Cost**."*
  *   **Relevance Update:** Efficacy and Safety weights are set to zero for this comparison. Only $K$ matters (lower is better).
  *   **Comparison:** $K_C (-10) > K_A (-5)$ (i.e., C is cheaper).
  *   **Choice:** **C is selected over A.**
  *   **Revealed Preference:** $C \succ A$.

  #### 3. The Cyclical Pattern
  The observed choices are:
  1.  $A \succ B$
  2.  $B \succ C$
  3.  $C \succ A$

  This is a strict Condorcet cycle.

  #### 4. The Revealed-Preference Analyst's Misdiagnosis
  A standard revealed-preference (RP) analyst operates under the **Stability Assumption**: choices reveal a stable preference ordering over the final bundles (the drugs' total utility), independent of the comparison context or informational directives. The analyst assumes the HFC maximizes $U(i) = E_i + S_i - K_i$ consistently.

  *   **Analyst's Inference from Stage 1:** Since A was chosen over B, the analyst concludes $U(A) > U(B)$.
  *   **Analyst's Inference from Stage 2:** Since B was chosen over C, the analyst concludes $U(B) > U(C)$.
  *   **Analyst's Inference from Stage 3:** Since C was chosen over A, the analyst concludes $U(C) > U(A)$.

  **The Misdiagnosis:** The analyst concludes the HFC has **intransitive tastes** (irrational preferences) over the drugs. They might attribute this to "preference cycles" or psychological inconsistency.

  **The Reality:** The HFC's tastes are perfectly transitive ($U(B) > U(A) > U(C)$). The cycle arises because the **Informational Directives** altered the *mapping* from the stable utility function to the choice. The information did not change the *value* of the attributes (the HFC still values Safety), but it changed which features were **permitted to be relevant** in the optimization process.

  #### 5. Theoretical Implication
  This example demonstrates how Revealed Preference theory can conflate a **structural feature of the choice environment** (the shifting relevance of attributes dictated by external information) with a **feature of the agent's utility** (intransitive rankings).

  *   **Standard RP Assumption:** $Choice(X, Y) \implies U(X) \geq U(Y)$.
  *   **Actual Mechanism:** $Choice(X, Y | Info) \implies U_{weighted}(X | Info) \geq U_{weighted}(Y | Info)$.

  Because the RP analyst treats the "Information" as noise or assumes it is irrelevant to the utility ranking over final bundles, they interpret the context-dependent weighting rule as a context-independent preference reversal. The agent is not irrational; they are maximizing a stable utility function that includes **Compliance**, operating under a **Non-Bayesian Update Rule** where information acts as a filter on attribute relevance rather than a signal about outcome probabilities.
