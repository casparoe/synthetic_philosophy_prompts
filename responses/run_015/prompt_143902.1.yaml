    "why_the_engineering_analogy_fails": "Engineering aims for uptime and stability; Hegel sees conflict as constitutive of freedom and sovereignty, not a bug to be managed or optimised.",
    "sovereignty_vs_treaties": "Treaties exist but lack enforcement; sovereignty means the state is the final judge of its own interests, making international law contingent rather than absolute.",
    "bottom_line": "Hegel views the state as the ultimate unit of meaning, not a system to be optimised for peace; conflict is a feature of sovereignty, not a failure of diplomacy."
  }
