answer: |-
  So this logician, Dave, gets really hung up on Skolem's Paradox. He knows there's a countable model of ZFC, so he figures uncountable sets are a scam. He decides to literally step inside the model to prove it.

  Once he's in, he walks up to the set of real numbers and says, "I know you guys are countable. I saw the bijection from the outside." He starts searching the model for the function that maps the reals to the naturals. But he can't find it. It's not in the model's inventory.

  He asks the reals, "Where's the list?"
  The reals say, "There is no list. In this universe, no such function exists. Therefore, by definition, we are uncountable."
  Dave screams, "But I can see the list from outside!"
  The reals shrug and say, "Yeah, but countability isn't about what you see from the meta-theory. It's about what functions you got *in here*."

  Dave walks out realizing he didn't disprove uncountability, he just proved he was looking at the wrong universe. Turns out "uncountable" just means "no bijection exists in the model," not "actually big." It's like being single only counts if there's no one available in your own phone contacts, even if the whole world is watching. Dave learned the hard way that countability is model-relative, not absolute. You can't import your bijections from the meta-theory and expect them to work in teh local zone.
