  ### Brainstorming and Commitment

  **Crux 1: The Iterative Computation.** Students must correctly run the Kripkean construction stage-by-stage. The trap is assuming circularity implies immediate paradox (gap) in Strong Kleene (SK). The hard part is seeing that $B$ stabilizes at stage 1 because of the true disjunct, which then fixes $A$ at stage 2.
  **Crux 2: Contagion vs. Recapture.** This turns on the philosophical justification for the truth tables. Weak Kleene (WK) treats any contact with a gap as contaminating (caution); SK treats gaps as missing values that allow classical logic to proceed where determined (recapture). The hard part is explaining why WK's "caution" renders $B$ ungrounded despite $S$ being true, and whether this loss of classical validity is a bug or a feature.
  **Crux 3: Expressive Revenge.** This turns on whether the theory can classify its own sentences. In WK, since $B$ is a gap, the sentence "B is true" is a gap. The theory cannot assert $B$'s truth in the object language. This mirrors the standard revenge where the theory cannot assert "The Liar is not true."

  **Commitment:** I will commit to **Crux 2 (Contagion vs. Recapture)** as the central conceptual hinge. It is the hardest to answer by paraphrasing because textbooks often define the tables without discussing the *cost* of WK's contagion on intuitively true sentences like $B$. The exam question will force students to justify why $B$ behaves differently in the two schemes despite identical structure, linking this directly to the revenge problem (the inability of WK to validate classical intuitions in the object language).

  ***

  ### 1. Exam Question

  **Seminar on Truth and Paradox: Practice Final**
  **Time Allowed: 45 Minutes**
  **Total Marks: 25**

  **Context:** Consider a language $\mathcal{L}$ containing classical logic, a truth predicate $T$, and names for its own sentences. Let $S$ be a sentence known to be determinately true (e.g., "Snow is white"). Consider the following pair of sentences:

  *   (A) The sentence (B) is not true. ($\neg T(\ulcorner B \urcorner)$)
  *   (B) Either the sentence (A) is not true, or $S$. ($\neg T(\ulcorner A \urcorner) \lor S$)

  **Definitions:**
  *   **Tarskian Hierarchy:** Truth predicates are indexed by levels ($T_0, T_1, \dots$). $T_i$ can only apply to sentences not containing $T_i$ or higher.
  *   **Kripkean Fixed Point:** Sentences are evaluated in stages. A sentence is **grounded** if it receives a classical value ($t$ or $f$) in the minimal fixed point; otherwise, it is **ungrounded** (gap/$u$).
  *   **Strong Kleene (SK):** Compound sentences receive a classical value if determined by classical operands (e.g., $t \lor u = t$).
  *   **Weak Kleene (WK):** Compound sentences receive $u$ if *any* operand is $u$ (contagion).

  **Questions:**

  1.  **Verdicts (10 marks):** Determine the truth-value status (True, False, or Ungrounded) of (A) and (B) under: (i) Strong Kleene minimal fixed point; (ii) Weak Kleene minimal fixed point; (iii) a strict Tarskian hierarchy. Briefly justify each with reference to the construction rules or formation rules.
  2.  **Conceptual Analysis (10 marks):** Both schemes assign a gap to the standard Liar sentence. However, they disagree on (B). Explain what this disagreement reveals about how each theory handles the propagation of ungroundedness. Why does Weak Kleene classify (B) as ungrounded despite containing a true disjunct, and what is the philosophical cost of this classification compared to Strong Kleene?
  3.  **Revenge (5 marks):** One form of the "Revenge" problem argues that gap theories cannot state in the object language that their own pathological sentences are not true. Based on your verdicts in Part 1, explain whether this pair of sentences generates a revenge problem for the Weak Kleene theory. Does the theory succeed in validating the intuition that (B) is true?

  ***

  ### 2. Model Answer

  **Part 1: Verdicts**
  Under **Strong Kleene (SK)**, we iterate from the empty extension. At stage 0, $T(\ulcorner A \urcorner)$ and $T(\ulcorner B \urcorner)$ are $u$. At stage 1, we evaluate the bodies. (A) is $\neg u = u$. (B) is $u \lor t$. In SK, a disjunction with one true disjunct is true, so (B) receives $t$. At stage 2, since (B) is true, $T(\ulcorner B \urcorner)$ is $t$. Thus (A) becomes $\neg t = f$. (B) remains $t$ (since $\neg f \lor t$ is $t$). The fixed point is reached: **(A) is False, (B) is True.**

  Under **Weak Kleene (WK)**, connectivity is contagious. At stage 0, both are $u$. At stage 1, (A) is $\neg u = u$. (B) is $u \lor t$. In WK, any operation involving $u$ yields $u$. Thus (B) remains $u$. No sentences enter the extension or anti-extension. The minimal fixed point is empty for these sentences: **(A) is Ungrounded, (B) is Ungrounded.**

  Under a **Tarskian Hierarchy**, well-formedness requires strict level separation. If (A) is level $n$, it contains $T(\ulcorner B \urcorner)$, so (B) must be level $< n$. If (B) is level $m$, it contains $T(\ulcorner A \urcorner)$, so (A) must be level $< m$. This implies $n < m$ and $m < n$, a contradiction. **The pair cannot be formulated** in a single object language.

  **Part 2: Conceptual Analysis**
  The disagreement highlights the tension between **semantic caution** (WK) and **classical recapture** (SK). Both agree the Liar is ungrounded because it lacks a factual anchor. However, (B) has a factual anchor ($S$). SK allows the truth of $S$ to "flow through" the gap in the other disjunct, grounding (B) and subsequently grounding (A) as false. SK treats gaps as mere lack of value, preserving classical logic where possible.

  WK treats ungroundedness as semantic pollution. Because (B) mentions the truth value of (A), and (A) is initially ungrounded, (B) inherits that status regardless of $S$. The philosophical cost of WK is the loss of classically valid inferences involving pathological terms. WK forces us to reject intuitively true sentences (like "True or Gap") to maintain a strict containment of pathology. SK saves classical validity for (B) but risks obscuring the pathological dependence of (B) on (A).

  **Part 3: Revenge**
  This case illustrates a specific revenge problem for **Weak Kleene**. The intuition is that (B) *is* true because $S$ is true. However, WK classifies (B) as ungrounded. Consequently, the sentence "Sentence (B) is true" is itself ungrounded in WK. The theory cannot assert in the object language that (B) is true, nor can it assert that (B) is not true (since $\neg u = u$).

  This mirrors the standard revenge problem: the theory lacks the expressive resources to classify its own sentences correctly from within. While SK avoids this for (B) (since it can assert (B) is true), WK fails to validate classical reasoning in the presence of paradox. The revenge here is not just about the Liar, but about the theory's inability to endorse obvious truths that mention pathological sentences, rendering the object language expressively deficient compared to our meta-language reasoning.

