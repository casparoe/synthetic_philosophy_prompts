  2. A model answer of roughly 700 words. It should do more than record verdicts: it should explain why the pair is not paradoxical despite being circular, what exactly the Strong/Weak Kleene disagreement shows about how far ungroundedness spreads through sentences that merely mention an ungrounded one, what kind of consideration could settle that disagreement without simply restipulating the verdicts, and what the case does and does not show about revenge.

