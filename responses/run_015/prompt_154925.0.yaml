answer: |-
  ### Purpose of Adequacy Assessment

  The adequacy of a factored-cognition model in this context is assessed primarily against **Normative Legitimacy and Cognitive Fidelity**, rather than raw Scalability or Predictive Accuracy alone. A model that scales efficiently but distorts the structure of human deliberation (e.g., by forcing consensus where none exists, or by sterilizing analogical insight) fails to represent human reasoning *at scale*; it merely represents computation *using* humans. Therefore, the desiderata below prioritize the preservation of the epistemic and normative properties of deliberation over the mathematical convenience of clean recursion.

  ---

  ### Cluster 1: Semantic Invariance Under Decomposition

  **Desideratum:** A problem decomposition is valid only if the semantic content of the subproblems remains invariant across the hierarchy, ensured by a shared conceptual vocabulary that does not drift as depth increases.

  *   **Motivating Case/Failure Mode:** *Contextual Drift.* In a strict HCH tree, a root node asks, "Is this policy just?" and delegates "What are the economic effects?" to a child node. If the child node optimizes for "efficiency" using a technical definition that ignores the root's normative framing of "welfare," the recombination yields a category error. The failure mode is the loss of the *gestalt*—the whole becomes less than the sum of parts because the connective tissue (context) was stripped to facilitate the handoff.
  *   **Status:** **Non-negotiable** for normative legitimacy. Without semantic invariance, the output is not an answer to the original question, but a different question entirely.
  *   **Justification:** Human reasoning relies on thick concepts (e.g., "justice," "risk") that carry context. If the model allows these concepts to thin out as they are passed down the tree to save bandwidth, the final synthesis is epistemically hollow.

  ### Cluster 2: Controlled Analogical Permeability

  **Desideratum:** The architecture must permit and regulate analogical cross-contamination between subproblems, treating leakage not as noise to be eliminated but as a signal necessary for creative insight, provided it does not induce logical incoherence.

  *   **Motivating Case/Failure Mode:** *Sterilized Insight.* Strict factorization assumes subproblems are independent. However, human breakthroughs often occur when reasoning about Factor A (e.g., biological immunity) reshapes the approach to Factor B (e.g., computer security) via metaphor. A model that engineers away this "leakage" to ensure clean boundaries produces safe but banal outputs. The failure mode is *cognitive atrophy* at scale: the system becomes a lookup table rather than a reasoner.
  *   **Status:** **Preference of Fidelity Camps.** Scalability-focused camps view this as a bug (introducing variance and unpredictability); Fidelity camps view it as a feature (the source of novelty).
  *   **Justification:** Reasoning is not purely algorithmic; it is associative. To model human deliberation, the system must allow the "vibe" or structural intuition from one branch to inform another, even if that violates strict modularity.

  ### Cluster 3: Pluralistic Stability (Irreducible Friction)

  **Desideratum:** The system must be capable of maintaining and representing irreducible disagreement or epistemic friction across the hierarchy without forcing artificial convergence on a single consensus value.

  *   **Motivating Case/Failure Mode:** *False Precision.* In value-laden deliberations (e.g., "How should we allocate scarce medical resources?"), sub-nodes may represent incommensurable ethical frameworks (utilitarian vs. deontological). A standard HCH setup pressures the root node to output a single scalar or decision. Forcing this creates *epistemic violence*, masking deep conflict as resolved uncertainty. The failure mode is the illusion of agreement.
  *   **Status:** **Non-negotiable** for normative legitimacy in pluralistic contexts.
  *   **Justification:** Consensus is not always the telos of deliberation. Sometimes the adequate representation of the truth is a map of the conflict itself. A model that cannot output "stable dissent" misrepresents the nature of complex human disagreement.

  ### Cluster 4: Phenomenological Correspondence

  **Desideratum:** The internal process of the factored model must map onto the phenomenological experience of human deliberation such that the architecture can be falsified by human introspection or behavioral markers of cognitive load and insight.

  *   **Motivating Case/Failure Mode:** *The Chinese Room of Deliberation.* A system might produce correct answers via factorization but do so through a mechanism that no human could recognize as "thinking" (e.g., brute-force search masquerading as decomposition). If the process feels like database retrieval rather than deliberation, it fails as a *model of human reasoning*. The failure mode is *architectural alienation*: the system works, but it is not us.
  *   **Status:** **Non-negotiable** for the claim of representation.
  *   **Justification:** To claim the model represents *human* reasoning at scale, the computational steps must correspond to cognitively natural operations. If the factorization requires cognitive steps humans cannot actually perform (e.g., holding too many contexts simultaneously), the model is empirically falsified as a description of human cognition.

  ---

  ### Analysis of Joint Satisfiability and Tensions

  There are significant tensions between these desiderata, specifically regarding the core mechanics of HCH.

  **1. Factorization vs. Analogical Permeability (Cluster 1 vs. Cluster 2)**
  These requirements are **jointly unsatisfiable** under a strict interpretation of "factored cognition."
  *   **The Tension:** Cluster 1 demands clean boundaries and semantic invariance to ensure the subproblems can be solved independently and recombined. Cluster 2 demands porous boundaries to allow analogical insight to flow between nodes.
  *   **Resolution:** You cannot have full factorization and significant analogical leakage. If leakage is permitted, the subproblems are no longer independent, and the recursive guarantee of HCH (that the whole is solvable via the parts) breaks down. To satisfy Cluster 2, the model must abandon strict factorization in favor of a *networked* or *holographic* cognition model where nodes share latent state. This undermines the mathematical tractability that makes HCH attractive for alignment.

  **2. Epistemic Friction vs. Recursive Stability (Cluster 3 vs. HCH Stability)**
  These requirements are in **high tension** regarding the output structure.
  *   **The Tension:** HCH is defined as a function mapping a question to an answer (Q → A). This requires the root node to synthesize all child outputs into a coherent response. Cluster 3 demands that incommensurable disagreements be preserved rather than synthesized.
  *   **Resolution:** Maintaining deep epistemic friction undermines the recursive stability of HCH. If child nodes return conflicting axioms rather than data, the root node cannot compute a single "best answer." To satisfy Cluster 3, the output type of the HCH function must change from a decision to a *deliberative record*. This reduces the utility of the model as an alignment target for agents that need to *act*, though it increases its validity as a model of *deliberation*.

  ### The Primary Exclusionary Criterion

  The single requirement that does the most to exclude naive decompositional models is **Cluster 2: Controlled Analogical Permeability.**

  *   **Reasoning:** Naive decompositional models rest on the assumption of **independence**. They assume that if you break a problem into parts, the solution to the whole is simply the aggregation of the solutions to the parts. By asserting that analogical leakage is a *feature necessary for creative insight*, this desideratum declares that independence is a fiction. It forces the model to account for non-local dependencies where reasoning in one branch fundamentally alters the solution space of another.
  *   **Impact:** Accepting Cluster 2 invalidates the tree structure of HCH. If Node A's reasoning changes the conceptual vocabulary of Node B via analogy, Node B cannot be solved in isolation. This excludes any model that relies on strict modularity, which includes most current scalable oversight proposals.

  ### Conclusion on Adequacy

  To count as a normatively adequate representation of human reasoning at scale, a factored-cognition model must sacrifice the mathematical cleanliness of strict recursion. It must admit that human reasoning is not perfectly factorizable (Cluster 1 & 2 tension) and that the goal of deliberation is not always consensus (Cluster 3). If the purpose is **Scalability**, these desiderata are obstacles to be minimized. If the purpose is **Normative Legitimacy and Cognitive Fidelity**, these desiderata are constraints that may render the HCH architecture insufficient, requiring a shift toward architectures that support non-local state sharing and pluralistic outputs. The model fails if it achieves scale by lobotomizing the very cognitive processes (analogy, dissent, context-dependence) that make human reasoning valuable.
