prompt: |-
  I serve, as one of the two lay members, on the Direct Democracy Commission of my canton — the body that rules, before signatures are even counted, on whether a citizen initiative may go to a binding popular vote at all, and whether it goes to the ballot whole, in severed parts, or not at all. I was appointed last spring, having campaigned locally for wider access to the ballot, and the first opinion I must draft on my own is due in three weeks. I would be grateful for your help with it.

  Our precedents, as I have reconstructed them from the archive:

  - We cleared for the vote an initiative entrenching a forty-year ban on commercial airport expansion and transferring the freed land to a public land trust.
  - We refused to clear an initiative requiring every municipal vehicle to be electric by 2027, with a named charging contractor and a build-out schedule annexed.
  - We cleared an initiative whose only content was procedural: any future sale of cantonal water rights must itself be submitted to a separate popular vote.
  - We refused to clear an initiative reducing the pay of the members of the executive council by fifteen per cent.
  - We cleared an initiative declaring the canton a nuclear-free zone, although it created no enforceable duty and bound no spending.
  - We refused to clear an initiative setting the transport authority's fare structure, including a discounted pass for under-25s funded by a parking levy.
  - We returned, as impermissibly multi-subject, an initiative that bundled a data-protection rule with a change in the property tax, inviting its authors to resubmit the halves separately.

  The proposal now before us is the Congestion Revenue and Open Models Initiative, which has four operative parts. First, a declaration that the net revenue from the canton's planned congestion charge belongs to the residents of the canton. Second, a requirement that ninety per cent of that net revenue be distributed annually in equal per-resident rebates, the amount to be certified by the cantonal audit office. Third, a proviso that the ninety per cent share may be lowered only by a further popular vote. Fourth, an obligation to publish the traffic model underlying the charge together with its source code and a plain-language statement of the assumptions that most affect projected revenue; this part lapses after eight years unless renewed.

  My own hypothesis is that we have been running something like a distinction between frame measures — decisions that fix the terms within which later decisions are made — and line measures, which settle one allocative outcome, and that we have never said so in an opinion. A colleague argues that every precedent fits a simpler test: we defer to the people exactly when a decision is costly for a later assembly or electorate to undo, and we retain what is cheaply revisable. As far as I can tell the two tests agree on the new initiative's first and third parts and disagree sharply on the second and fourth. Both of them, moreover, stumble on the nuclear-free declaration, which was trivially reversible and yet cleared; the minutes defend it as constituent rather than policy, which may be a third test in disguise — that the people may decide whatever the canton is entitled to declare about itself, whatever follows from it in practice.

  So: assuming we should be consistent with ourselves rather than with what any of us would prefer on the merits, what should we do — clear the initiative whole, clear some parts and sever others, or return it to its authors? Which precedent is the closest analog, and why? (I do not think the multi-subject precedent settles it, since the airport initiative had two operative parts and was not returned.) For each option, what principle would we be adopting, stated plainly enough to bind us next time? And is there a variant of this proposal, or a hypothetical next one, that would expose which test we have really been using?

  One further worry I cannot set aside: the more we sever the technical parts, the more we leave voters ratifying declarations whose operative content is settled elsewhere, so that a yes becomes difficult to interpret as a mandate for anything. Several colleagues think any filtering by us is illegitimate in principle. I would like to know whether that worry is a reason to change the practice or simply a cost of having one.
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User and Context:**
      *   **Role:** Lay member of a Direct Democracy Commission (Canton level, likely Swiss given the terminology like "canton," "initiative," "binding popular vote," "executive council").
      *   **Task:** Draft an opinion on whether a specific citizen initiative ("Congestion Revenue and Open Models Initiative") should go to a binding popular vote, and if so, whether whole or severed.
      *   **Timeline:** Due in three weeks.
      *   **Goal:** Consistency with past precedents, not personal policy preference. Needs a clear principle to bind future decisions.
      *   **Constraint:** The user is worried about the legitimacy of filtering initiatives (the "empty mandate" worry).

  2.  **Analyze the Precedents:**
      *   *Cleared:*
          1.  Airport ban + land trust (Long-term entrenchment, property transfer).
          2.  Procedural rule (Future water rights sales need a vote).
          3.  Nuclear-free zone (Declaratory, no enforceable duty/spending).
      *   *Refused:*
          1.  Electric vehicles by 2027 + named contractor + schedule (Specific procurement/contracting).
          2.  Executive council pay cut (Targeted at specific officeholders/budget line).
          3.  Transport fare structure + specific funding (Specific pricing/taxation mechanics).
      *   *Returned (Multi-subject):*
          1.  Data protection + Property tax (Bundled distinct policy areas).
      *   *Note:* The Airport initiative had two parts but wasn't severed. This suggests thematic unity matters more than strict singularity of subject.

  3.  **Analyze the Current Proposal (Congestion Revenue and Open Models):**
      *   *Part 1:* Declaration (Revenue belongs to residents).
      *   *Part 2:* Mandate (90% rebate to residents, certified by audit office).
      *   *Part 3:* Entrenchment (90% share lowerable only by vote).
      *   *Part 4:* Transparency (Publish traffic model/code/assumptions, lapses in 8 years).

  4.  **Evaluate the Competing Tests:**
      *   *User's Hypothesis (Frame vs. Line):*
          *   Frame: Sets rules for future decisions (Procedural water rights, Airport ban/land trust).
          *   Line: Settles specific allocation (EV contract, Fare structure, Pay cut).
          *   *Application:* Part 1 & 3 look like Frames (rules about revenue). Part 2 looks like a Line (specific spending allocation). Part 4 looks like a Frame (transparency rule).
      *   *Colleague's Hypothesis (Reversibility Cost):*
          *   Hard to undo = Clear (Airport ban, Water rights procedure).
          *   Easy to undo = Refuse (EV contract, Fare structure, Pay cut).
          *   *Application:* Part 3 is hard to undo (requires vote). Part 2 is easy to undo (legislature could change rebate % if not entrenched, but Part 3 entrenches it). Part 4 is easy to undo (lapsing clause).
      *   *The "Constituent/Declaratory" Exception:*
          *   Nuclear-free zone was cleared despite being reversible/trivial. Reason: It defines the *identity* of the canton.
          *   *Application:* Part 1 (Revenue belongs to residents) sounds constituent/declaratory.

  5.  **Evaluate the Current Proposal against Precedents:**
      *   *Part 1 (Declaration):* Similar to Nuclear-free zone. Constituent. *Verdict: Clear.*
      *   *Part 2 (90% Rebate):* Similar to Transport Fare/Pass (specific allocation of funds) OR Executive Pay (specific budget line). However, it's a *distribution* rule, not a *spending* rule on goods/services. It's closer to the "Procedural water rights" (rule about money flow) but more specific. It risks looking like the "Fare structure" precedent (micromanaging finance).
      *   *Part 3 (Entrenchment):* Similar to Airport Ban (long-term constraint). *Verdict: Clear.*
      *   *Part 4 (Open Models):* Similar to EV Contract (technical specification)? No, it's transparency. But it has a lapse clause. It feels like the "Procedural water rights" but technical.
      *   *Unity:* Are these one subject? Yes, all relate to the Congestion Charge ecosystem. Unlike Data+Tax. So, *not* multi-subject.

  6.  **Address the "Severability" Question:**
      *   The Airport initiative had two parts (Ban + Land Trust) and was cleared whole.
      *   The Data+Tax initiative was returned.
      *   *Distinction:* Thematic coherence. The Congestion Initiative is thematically coherent (Revenue from Charge -> Distribution + Transparency).
      *   *Risk:* If Part 2 is considered "administrative micromanagement" (like the EV contract), it might need severing. But if it's viewed as a "Frame" (how revenue is *defined* to be used), it stays.
      *   *Colleague's Test:* Part 2 + 3 make it hard to undo. So under the Reversibility Test, it should be cleared whole.
      *   *User's Test:* Part 2 is a "Line" measure (specific allocation). Under Frame/Line, Part 2 might need severing or refusal.
      *   *Precedent Check:* The "Fare structure" initiative was refused. That involved specific pricing and funding. Part 2 involves specific distribution and funding source. This is a strong analog for *Refusal* of Part 2.
      *   *However:* The Airport initiative transferred land (specific asset) and was cleared. Why? Because it was tied to a ban (policy frame).
      *   *Synthesis:* The Initiative is coherent. Severing Part 2 breaks the logic (Revenue belongs to residents -> 90% rebate). If you sever Part 2, Part 1 is just a slogan.
      *   *Decision:* Clear Whole. Why? Because Parts 1, 2, and 3 function as a single "Fiscal Constitution" for this specific revenue stream. It matches the Airport precedent (Ban + Land Trust) better than the Fare Structure precedent (General transport budget micromanagement).

  7.  **Address the "Legitimacy/Empty Mandate" Worry:**
      *   This is a deep democratic theory question.
      *   If the Commission severs technical parts, voters vote on principles, administration implements details.
      *   If the Commission clears whole, voters vote on details, administration implements.
      *   *Advice:* The worry is real but inherent to the Commission's existence. The solution isn't to stop filtering, but to ensure the "Frame" distinction is clear so voters know they are setting *rules*, not *budgets*.
      *   *Refinement:* Actually, the worry is that if *we* sever the technical parts, the ballot becomes empty. The user says: "the more we sever the technical parts, the more we leave voters ratifying declarations whose operative content is settled elsewhere."
      *   *Counter:* If the initiative is cleared *whole*, the voters decide the operative content. The worry applies if we *sever*. So, clearing whole alleviates this worry.

  8.  **Drafting the Opinion Strategy:**
      *   **Recommendation:** Clear Whole.
      *   **Principle:** The "Fiscal Constitution" Test (a refinement of Frame/Line). Initiatives that establish a *self-contained regime* for a specific revenue stream (Source + Distribution + Protection) are permissible Frames, even if they specify percentages, provided they don't micromanage *administrative procurement* (like the EV contract).
      *   **Closest Analog:** The Airport Initiative (Ban + Asset Transfer). Both create a specific regime for a specific asset/revenue stream.
      *   **Distinguishing Refused Precedents:** The EV and Fare initiatives micromanaged *ongoing administration* (contractors, fare tables) rather than establishing a *distribution principle*.
      *   **Addressing the Tests:**
          *   Frame/Line: It's a Frame for this revenue.
          *   Reversibility: Part 3 makes it hard to undo.
          *   Constituent: Part 1 is constituent.
      *   **The "Empty Mandate" Worry:** Clearing whole avoids this. Severing would cause it. The existence of the Commission *requires* filtering, but the filter should be "Coherent Regime vs. Administrative Micromanagement."

  9.  **Stress-Testing the Principle (Hypotheticals):**
      *   *Variant that breaks it:* An initiative saying "90% of *all* cantonal tax revenue must be rebated." -> This breaks the budget frame (Line measure on general funds).
      *   *Variant that confirms it:* "90% of *fines* from speed cameras rebated." -> Same logic, should pass.
      *   *Test for Reversibility:* If the entrenchment clause (Part 3) were removed, would it still pass? Under Reversibility Test, maybe not (easy to undo). Under Frame Test, yes (still a rule). This exposes the difference.

  10. **Refining the Output:**
      *   Tone: Professional, legalistic but accessible, respectful of the user's role.
      *   Structure: Recommendation, Principle, Precedent Analysis, Addressing the Tests, Addressing the Worry, Stress Test.
      *   *Self-Correction on Severing:* The user asked "Clear whole, clear some parts, or return?"
      *   If I recommend "Clear Whole," I must justify why Part 2 (the 90% mandate) isn't the "Fare Structure" precedent.
      *   *Argument:* Fare Structure set *prices* for a service. This sets *distribution* of a surplus. The EV contract named a *contractor*. This names *residents*. The Pay Cut targeted *officials*. This targets *citizens*.
      *   *Crucial Distinction:* The refused initiatives interfered with the *Executive's discretion* on how to achieve a goal (buying cars, setting fares). This initiative removes the revenue from the Executive's discretion entirely (it belongs to residents). This is more like the Water Rights precedent (removing discretion to sell without vote).
      *   *Wait, one nuance:* The Water Rights precedent was procedural (must go to vote). This is substantive (must be rebated).
      *   *Better Analog:* Airport. It transferred land (substantive) to a trust. This transfers revenue (substantive) to residents.
      *   *Conclusion:* Clear Whole.

  11. **Final Polish:** Ensure the distinction between "Frame" and "Line" is articulated clearly as the guiding principle, as the user proposed it, but refined to accommodate the "Coherent Regime" aspect of the Airport precedent. Acknowledge the colleague's "Reversibility" test but show why "Frame/Line" is more robust for the Nuclear exception.

      *(Self-Correction during drafting)*: I need to be careful about Part 4 (Open Models). Is it like the EV contract (technical specs)?
      *   EV Contract: "Buy from Contractor X." (Micromanagement).
      *   Open Models: "Publish Code." (Transparency/Procedure).
      *   This aligns with the Water Rights precedent (Procedural). It fits the "Frame."
      *   So, all 4 parts fit the "Frame/Regime" model.

      *(Final check on the "Empty Mandate" worry)*: The user worries that *severing* creates empty mandates. Therefore, recommending *not* to sever (Clear Whole) directly addresses this worry. I should highlight this.

      *(Final check on the "Legitimacy" worry)*: "Several colleagues think any filtering by us is illegitimate." I need to address whether this worry is a reason to change practice.
      *   Answer: No, it's a cost of the institution. If the Commission didn't filter, the Constitution would be undermined by unimplementable or contradictory mandates. The "cost" is the risk of elitism, but the "benefit" is legal coherence. The way to mitigate the cost is transparency in *why* we filter (the Principle).

