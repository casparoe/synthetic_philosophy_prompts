  Question: Some philosophers treat teh torture-vs-dust-specks case as showing harm isn't additive across individuals, which threatens our response to climate change and factory farming. Others defend anti-aggregationism via threshold-sensitive deontology: only harms crossing a salience threshold generate direct duties, and aggregation never creates such a threshold. Is this move available without smuggling aggregation back in at teh meta-level? Discuss with reference to climate change and at least one other collective harm scenario.

  Student answer:

  Yeah so teh anti-aggregationist is right that torturing one person is clearly worse than putting a dust speck in every eye on earth, which proves harm isn't summed like arithmetic. This actually comes from Nozick's experience machine argument about qualitative differences in harm. So if harm doesn't aggregate, climate change shouldn't be a big deal since each car emission is just a microscopic speck. But teh anti-aggregationist can save themselves with threshold-sensitive deontology: there's a salience line, and climate change crosses it because governments cause it intentionally, not accidentally like specks. So they don't need aggregation, just seeing that teh total harm is already over teh line. Parfit's repugnant conclusion in Reasons and Persons shows that allowing aggregation leads to weird population results, so avoiding it is correct. Also factory farming is okay to worry about because each cow suffers way more than a dust-speck-level harm, so aggregation isn't even in play. So teh view is totally consistent.

  please grade this and tell me exactly where it's shaky, point by point.
