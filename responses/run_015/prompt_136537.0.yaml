  **Project Title:** The Suspended Self: Avicenna's Flying Man as a Constraint on Embodied Cognition

  **Project Summary**
  This project proposes a reinterpretation of Avicenna's famous "Flying Man" thought experiment. Standard scholarship treats the argument as a precursor to Cartesian dualism or dismisses it as an intuition pump for substance metaphysics. I argue that both readings overlook the argument's phenomenological core: the isolation of minimal phenomenal selfhood. The project asks whether Avicenna establishes a form of self-knowledge structurally prior to embodiment, and if so, whether this claim can be reconciled with modern predictive-processing models without reducing the self to a mere prediction-error minimization routine. By pairing close conceptual analysis of the argument's logical structure with contemporary neurophenomenological accounts of sensory deprivation, this fellowship aims to demonstrate that self-awareness is non-inferential yet tacitly anchored in a bodily schema that is suspended rather than absent. The result will be a defensible interpretation where Avicenna's claim survives not as proof of an immaterial substance, but as a necessary constraint on any view that treats the body as constitutive rather than merely causal for selfhood.

  **The Problem: Beyond the Dualism-Embodiment Stalemate**
  In contemporary philosophy of mind, the status of the self is polarized. Embodied cognition and predictive-processing frameworks typically argue that selfhood is constituted by the brain's modeling of bodily signals to minimize surprise. Conversely, traditional metaphysical readings maintain that self-awareness implies a substance distinct from the physical. Avicenna's Flying Man argument—where a suspended individual, deprived of all sensory input, retains awareness of their own existence but not their body—is usually conscripted into this debate as a historical artifact. It is either recruited as a proto-Cartesian proof of dualism or dismissed as a failure of medieval psychology.

  Both approaches miss an intermediate possibility. They fail to consider that the Flying Man might describe a limit-case of phenomenology rather than a metaphysical proof. Existing scholarship leaves this open because it assumes that if self-awareness persists without sensory content, it must be substance dualism. It neglects the possibility that self-awareness is non-inferential yet normally co-occurs with a bodily schema that can be methodologically suspended. This project contends that the Flying Man does not prove the soul is a separate substance, but rather that the first-person presence is structurally prior to the bodily content usually associated with it.

  **The Precise Question**
  The central inquiry is twofold: First, does Avicenna successfully establish a form of self-knowledge that is structurally prior to embodiment? Second, can that claim be reconciled with predictive-processing models without reducing the self to a prediction-error minimization routine? If predictive processing holds that the self is a model generated to explain sensory data, the Flying Man presents a counter-example: a self-presence without data. Reconciling these requires showing that the "minimal self" is not a model generated by the body, but a precondition for any modeling to occur, even while acknowledging that in normal functioning, this presence is inextricably linked to bodily prediction.

  **Methodology**
  This project rejects pure historical exegesis and armchair analysis alone. Instead, it employs a hybrid method. First, I will conduct a close conceptual analysis of the logical structure of the Flying Man argument, focusing on the distinction between awareness of existence and awareness of bodily attributes. Second, I will compare this structure to modern neurophenomenological accounts of minimal selfhood and studies on sensory deprivation. This pairing is essential because it allows the historical argument to constrain current theory without anachronism. By treating Avicenna's thought experiment as a phenomenological report rather than a metaphysical deduction, we can test its validity against modern data on what happens to selfhood when proprioceptive and exteroceptive signals are removed. This avoids the trap of attributing modern cognitive science to Avicenna while allowing his insights to challenge modern assumptions.

  **Success and Failure Conditions**
  A successful result will be a defensible interpretation in which Avicenna's claim survives not as proof of an immaterial substance but as a constraint on any view that treats the body as constitutive rather than merely causal for selfhood. The project succeeds if it demonstrates that the body is necessary for the *content* of self-experience but not for the *presence* of self-experience.

  Failure is defined by two specific errors. The first is anachronism: attributing to Avicenna a fully formed predictive-processing framework or modern cognitive vocabulary. The second is theoretical collapse: allowing the minimal selfhood to dissolve entirely into the bodily schema, thereby denying the phenomenological remainder that Avicenna identifies. If the project concludes that the Flying Man is simply wrong about the persistence of self-awareness without sensory input, it fails to find the reconciliation proposed. If it concludes Avicenna was right only because he believed in magic souls, it fails to engage with contemporary philosophy of mind.

  **Scope and Feasibility**
  For a single-semester fellowship, the scope must be strictly bounded. The project will not attempt a comprehensive history of Avicenna's psychology nor a full survey of predictive-processing literature. The focus remains exclusively on the logical structure of the Flying Man argument and its specific intersection with the concept of the "minimal self" in contemporary phenomenology. The point at which the project becomes unmanageable is the transition from structural comparison to metaphysical commitment. Delving into the ontological status of the soul in Avicenna's wider corpus or the neural correlates of consciousness in modern science would exceed the semester's limits. The work must remain focused on the epistemological and phenomenological claim: what is known, and how, when the body is suspended.

  **Committed Position**
  I argue that reconciliation is achievable only if we abandon the either/or framing of dualism versus embodiment. This requires specific concessions from both sides. Proponents of predictive processing and embodied cognition must concede that the sense of existence (ipseity) is not itself a prediction model, but the background against which models appear. They must accept that the body is causal for the richness of self-experience, but not constitutive of the bare fact of self-presence. Conversely, defenders of the Avicennian insight must concede that while the self is distinct, it is never actually experienced without some bodily affect in normal conditions, making the "suspension" a limit-case rather than a normal state.

  This cost is worth paying because it preserves the integrity of first-person experience without resorting to supernatural substance dualism. It allows us to retain the intuition that we are more than our bodily models, without denying the science that shows how deeply entangled we are with our physiology. By framing the Flying Man as a constraint on theory rather than a proof of ontology, we recover a vital insight from the history of ideas that remains urgently relevant to the current crisis in consciousness studies.
