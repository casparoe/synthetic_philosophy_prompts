answer: |-
  Adopt a Median-Primary Protocol that ranks deals by median return whenever the tail exponent is $\le 1.1$, uses physically capped expected value only for sanity checks, and enforces position limits to mitigate the non-convergence risks of repeated betting.

  ### Reasoning and Procedure Design

  Your problem is not statistical uncertainty; it is structural instability. When the tail exponent $\alpha \approx 1$, the arithmetic mean is undefined, making Expected Value (EV) maximization mathematically incoherent. Priya's FSD rule is theoretically sound but practically paralyzing; in venture capital, almost no two deals satisfy FSD because higher upside always comes with lower probability. Dave's truncated expectation ladder is closer to reality but misunderstands the pathology: if $\alpha \le 1$, the truncated mean does not settle, it drifts logarithmically with the sample size. His tie-breaker (median) is actually the robust metric, but it should be the primary driver, not the tie-breaker. Furthermore, the Pasadena game is a category error for venture capital; venture payoffs are bounded below by zero (limited liability), so the alternating sign divergence doesn't apply, only the positive tail divergence does.

  Regarding repeated exposure: making 40 bets a year does not rescue you via the Law of Large Numbers. When $\alpha \le 1$, the sum of returns is dominated by the single largest outcome, not the average. The portfolio return will not converge to a stable mean; it will remain volatile indefinitely. Therefore, survival depends on ensuring you don't bleed out before hitting the tail event, which prioritizes the median (typical outcome) over the mean (theoretical average).

  Here is the executable procedure for your committee. It is designed to be invariant to outcome coarsening (unlike Dave's EV ladder) and minimizes hidden value judgments.

  **The Robust Venture Protocol (RVP)**

  1.  **Question:** Does this deal dominate any current holding via First-Order Stochastic Dominance (better payoff at every probability level)?
      *   **Sufficient Answer:** Yes, shown via cumulative distribution function overlay.
      *   **Action:** Immediate Yes (Priya's rule).
      *   **Action:** If No, proceed to Q2.

  2.  **Question:** What is the estimated tail exponent $\alpha$ for this modality?
      *   **Sufficient Answer:** Fitted $\alpha$ with confidence interval (e.g., $0.9 - 1.1$).
      *   **Stop Condition:** If data is insufficient to fit $\alpha$, default to $\alpha = 1.0$ (conservative).
      *   **Action:** If $\alpha > 1.1$, proceed to Q3 (EV Mode). If $\alpha \le 1.1$, proceed to Q4 (Median Mode).

  3.  **Question (EV Mode):** What is the Expected Value capped at the Maximum Plausible Exit (MPE)?
      *   **Sufficient Answer:** MPE defined by total addressable market physics, not statistical extrapolation (e.g., "Cannot exceed total global healthcare spend").
      *   **Action:** Rank by Capped EV. Proceed to Q5.

  4.  **Question (Median Mode):** What is the Median Return (50th percentile outcome)?
      *   **Sufficient Answer:** Explicit dollar return or multiple at 50% probability.
      *   **Action:** Rank by Median. (Note: For early-stage, this is often zero or loss; see Case 3). Proceed to Q5.

  5.  **Question:** What is the 5th Percentile Return (Downside Case)?
      *   **Sufficient Answer:** Loss amount at 95% confidence.
      *   **Action:** Use as tie-breaker for equal Medians/Capped EVs. Higher is better.

  6.  **Question:** Does this allocation exceed the Maximum Position Size for this $\alpha$?
      *   **Sufficient Answer:** Yes/No against a pre-set table (e.g., if $\alpha \le 1.0$, max 2% of fund).
      *   **Action:** If Yes, hard No or resize. If No, proceed to Human Decision.

  7.  **Human Decision:** If the model ranks two deals similarly, or if the Median is negative but strategic value exists, the Committee votes.
      *   **Boundary:** This is where values enter (e.g., "We accept lower median for mission alignment").

  **Invariance Check:** Dave's ladder is not invariant to coarsening; grouping outcomes changes the truncated sum. The Median is invariant to monotonic transformations and coarsening, making it robust to how you write the contract. Priya's FSD is invariant but too rare.

  ### Case Runs

  **1. The Pasadena One-Off**
  *   **Input:** $2 fee, payoff $2^n/n$ with alternating signs.
  *   **Procedure:** Step 1 (FSD) fails. Step 2 ($\alpha$) is irrelevant because payoff structure violates limited liability (negative outcomes possible).
  *   **Result:** **Hard No.**
  *   **Reason:** Venture funds cannot accept unlimited liability contracts. The alternating sign structure is incompatible with the fund's legal structure. Even if modified to positive-only, the Median of a Pasadena-like distribution is typically low relative to cost. Do not pass go.

  **2. Program A (Tail $\alpha \approx 1$) vs. Program B (Finite Mean)**
  *   **Input:** A has undefined mean, modeled EV is huge. B has finite mean, 1/3rd of A's modeled EV.
  *   **Procedure:** Step 2 identifies $\alpha \le 1.1$ for A. Step 4 triggers Median Mode for A. Step 3 triggers Capped EV for B.
  *   **Comparison:** A's Median is likely 0 or 1x (most startups fail). B's Median is likely positive (licensing deals have floors).
  *   **Result:** **Choose Program B.**
  *   **Reason:** When $\alpha \approx 1$, the "huge EV" of A is a mathematical artifact driven by events that effectively never happen in the fund's lifespan. B offers compounding capital; A offers lottery tickets that drain the fund's median growth.

  **3. The Flagship Moonshot**
  *   **Input:** 0.5% chance of 400x, 99.5% chance of 0.
  *   **Procedure:** Step 2 ($\alpha$) is likely $\le 1$ (extreme tail). Step 4 (Median Mode).
  *   **Calculation:** 50th percentile outcome is 0 (total loss).
  *   **Result:** **Reject.**
  *   **Reason:** A deal with a 99.5% failure rate has a negative median return. In a regime where the mean doesn't exist, you cannot rely on the 0.5% tail to save the portfolio because the sum is non-convergent; you might simply run out of capital before hitting the winner.
  *   **What needs to change:** To pass, the probability of *any* positive return must exceed 50%, or the "failure" case must return partial capital (e.g., 0.5x) via asset sales/IP licensing to shift the median to breakeven. You must structure the deal to protect the median, not just boost the tail.

  ### Limitations

  This procedure cannot value strategic options or ecosystem effects that don't manifest as direct financial returns (e.g., data access, partnership rights). It cannot handle correlated tail risks across the portfolio (if all 15 positions have $\alpha \approx 1$ and are correlated, the fund fails regardless of position limits). Finally, it cannot substitute for judgment on team and technology; it is a capital allocation filter, not a due diligence replacement. If your fund's mandate requires taking moonshots with negative medians, you must explicitly carve out a "Strategic Bucket" exempt from this protocol, acknowledging that you are spending LP capital on optionality rather than expected growth.
