answer: |-
  Your colleague's position is inconsistent under standard interpretations because they rely on an incompatibilist notion of ability to attack determinism but a compatibilist or general notion to dismiss Frankfurt cases, unless they adopt the contested view that Frankfurt scenarios are metaphysically impossible.

  The slogan "could have done otherwise" masks at least four distinct claims found in the philosophy of action literature. Below is a menu separating these readings by the modality of the "can," the nature of the "otherwise," and their vulnerability to Frankfurt-style counterexamples.

  ### 1. Categorical Leeway (Standard Incompatibilist PAP)
  *   **The "Can":** An open causal pathway; the agent could have done otherwise in the *exact* same circumstances (past + laws of nature).
  *   **The "Otherwise":** A different bodily movement or first-order choice occurring at the moment of decision.
  *   **Application:** Applies to the specific action token.
  *   **Status:** **Substantive and Contested.** Incompatibilists defend this as necessary for responsibility; compatibilists reject it as unnecessary.
  *   **Frankfurt Vulnerability:** **Defeated (by design).** Standard Frankfurt cases are constructed specifically to remove this ability via a counterfactual intervener while maintaining intuition of responsibility.
  *   **Colleague's Use:** Supports **Use 1** (Determinism removes this ability). Contradicts **Use 2** (Standard Frankfurt cases remove this ability; claiming the agent retained it misdescribes the case).

  ### 2. Conditional Ability (Compatibilist PAP)
  *   **The "Can":** Hypothetical capacity; the agent *would* have done otherwise *if* they had chosen differently (or if conditions were different).
  *   **The "Otherwise":** A different choice under different counterfactual conditions.
  *   **Application:** Applies to the agent's general powers/dispositions.
  *   **Status:** **Defensible (for Compatibilists).** Widely accepted as compatible with determinism; rejected by Incompatibilists as insufficient for responsibility.
  *   **Frankfurt Vulnerability:** **Not Defeated.** Frankfurt cases remove categorical leeway but typically leave conditional abilities intact (the agent chooses on their own; the intervener does nothing).
  *   **Colleague's Use:** Contradicts **Use 1** (Determinism does not remove this ability). Supports **Use 2** (The agent retains this ability in Frankfurt cases).

  ### 3. General Capacity vs. Specific Opportunity (Austinian Distinction)
  *   **The "Can":** **General Capacity:** Possession of rational powers and skills. **Specific Opportunity:** The external circumstances allow the exercise of those powers.
  *   **The "Otherwise":** **Capacity:** Ability to type differently. **Opportunity:** Chance to type differently *now*.
  *   **Application:** Capacity applies to the agent; Opportunity applies to the situation.
  *   **Status:** **Well-Established Distinction.** Consensus exists that these are distinct concepts (e.g., J.L. Austin, Kadri Vihvelin), though their relevance to responsibility is contested.
  *   **Frankfurt Vulnerability:** **Mixed.** Frankfurt cases remove Specific Opportunity (the outcome is guaranteed) but preserve General Capacity (the agent is not coerced or insane).
  *   **Colleague's Use:** Supports **Use 1** if referring to Specific Opportunity (Determinism blocks the opportunity). Supports **Use 2** if referring to General Capacity (Frankfurt agents retain the capacity). **This reading reveals the equivocation.**

  ### 4. Sourcehood Requirement (Source Incompatibilism/Semicompatibilism)
  *   **The "Can":** The ability to be the ultimate source or originator of the action.
  *   **The "Otherwise":** A different causal origin (not necessarily a different outcome; e.g., the ability to initiate the sequence differently).
  *   **Application:** Applies to the will/causal history behind the action.
  *   **Status:** **Substantive and Contested.** Central to the debate between John Martin Fischer (semicompatibilism) and Robert Kane (libertarianism).
  *   **Frankfurt Vulnerability:** **Contested.** Fischer argues Frankfurt cases show sourcehood is compatible with no alternative possibilities. Kane argues Frankfurt cases fail to remove all "flickers" of alternative possibilities required for sourcehood.
  *   **Colleague's Use:** Ambiguous. If they mean sourcehood is removed by determinism (Use 1) but preserved in Frankfurt cases (Use 2), they align with Source Incompatibilism only if they believe Frankfurt cases fail to remove sourcehood (a contested view).

  ### Consistency Analysis
  Your colleague's two uses are **inconsistent** unless they adopt a specific, contested metaphysical stance.
  *   **The Conflict:** To argue Determinism undermines blame (Use 1), they must assume the relevant "can" is incompatible with determinism (Reading 1). To argue Frankfurt cases fail because the agent retained the "can" (Use 2), they must assume the relevant "can" is *not* removed by the Frankfurt setup. However, standard Frankfurt cases *do* remove Reading 1 (Categorical Leeway).
  *   **The Equivocation:** The colleague likely shifts from Reading 1 (for Determinism) to Reading 2 or 3 (for Frankfurt). They treat Determinism as removing the *opportunity* to do otherwise, while treating Frankfurt cases as leaving the *capacity* to do otherwise intact.
  *   **The Exception:** The position is consistent only if they adopt the **Incoherence Objection** (e.g., Kane, Ginet), claiming Frankfurt cases are metaphysically impossible because any sign sufficient to trigger the intervener restores some alternative possibility. This is a **contested** minority view, not consensus.

  ### Established vs. Contested Literature
  *   **Well-Established:** There is a consensus distinction between "general ability" and "specific opportunity," and between "categorical" and "conditional" analyses of 'can'. It is also well-established that Frankfurt-style cases are *designed* to challenge the necessity of Alternative Possibilities (APs) for moral responsibility.
  *   **Genuinely Contested:** It is **not** consensus that Frankfurt cases successfully refute PAP. Incompatibilists offer "Flicker of Freedom" strategies (arguing some robust APs remain) or "Incoherence" objections (arguing the cases are impossible). It is also contested whether "Sourcehood" requires Alternative Possibilities (Source Incompatibilism) or not (Semicompatibilism).
  *   **Consensus View:** The consensus is that Frankfurt cases pose a serious challenge to the *standard formulation* of PAP (Reading 1), but there is no consensus that they definitively refute all incompatibilist accounts of responsibility. Your colleague's claim that Frankfurt cases "miss the point" because ability remains is a specific objection (likely a Flicker or Capacity objection), not a settled fact.
