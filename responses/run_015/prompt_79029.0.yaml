              *   Weak Group: Southgate (30%) > Northgate (25%).
          *   *Paradox:* Northgate wins overall, Southgate wins in every subgroup. (Classic Simpson's Paradox).
          *   *Ruth's Reasoning:* "Southgate takes far more of the pupils who need help and still gets more of them through."
          *   *Interpretation:* Ruth prioritizes the *subgroup performance* over the *overall aggregate* when the subgroups show consistent superiority, especially when the aggregate is skewed by the mix of participants (Northgate took mostly strong kids). She values the *effectiveness* of the program on the specific types of people, acknowledging the selection bias in the overall numbers. She favors the program that performs better *conditional on need*.

      *   **Ruling 2 (Job Schemes):**
