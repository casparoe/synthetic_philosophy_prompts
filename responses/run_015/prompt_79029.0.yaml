  2.  **Analyze Ruth's Three Rulings:**

      *   **Ruling 1 (Maths Coaching):**
          *   *Data:*
              *   Northgate: Total 200 (128 pass). Strong: 120 (108 pass, 90%). Weak: 80 (20 pass, 25%).
