  Based on the three rulings you provided, I can deduce the logical framework Ruth is using. It is not a single rigid formula, but a set of principles regarding **causal responsibility** and **population matching**.

  Here is the breakdown of Ruth's rules, how they apply to your new case, and where the potential ambiguity lies.

  ### 1. Ruth's Rules (The "Finance & Causality" Framework)

  Ruth is not just looking at which number is bigger; she is looking at *why* the numbers are different. Her rulings consistently distinguish between **Inputs** (pre-existing conditions) and **Outputs** (results of the scheme's work).

  *   **Rule A (The Input Rule):** If the subgroups are defined by **pre-existing characteristics** (things the scheme did not cause, like "Strong/Weak maths" in Ruling 1 or "Overweight/Not" in Ruling 3), you must compare within those subgroups to judge effectiveness. The "Overall" number can be misleading if one scheme took easier candidates.
      *   *Evidence:* Ruling 1 (Southgate won on subgroups despite losing overall) and Ruling 3 (Y won for the specific clinic population despite losing overall).
  *   **Rule B (The Output Rule):** If the subgroups are defined by **intermediate outcomes** (things the scheme is supposed to achieve, like "Got an interview" in Ruling 2), you must compare the **Totals**. Controlling for these hides the scheme's failure or success in achieving that step.
      *   *Evidence:* Ruling 2 (Step-Up won overall despite Bridgeway having better conversion rates *within* the interview group). Ruth reasoned that getting the interview was part of the job.
  *   **Rule C (The Context Rule):** If the subgroups disagree with each other (one wins here, one wins there), the "Overall" number is irrelevant. You must choose based on the specific **population you are actually serving**.
      *   *Evidence:* Ruling 3 (The study was mostly non-overweight, but the clinic was mostly overweight, so the "Overall" winner was discarded in favor of the subgroup matching the clinic).

  ### 2. Applying the Rules to the New Case

  **The Data:**
  *   **Halden:** Total Success 61% (244/400). Attender Success 55% (55/100). Non-Attender Success 63% (189/300).
  *   **Ives:** Total Success 55% (220/400). Attender Success 70% (175/250). Non-Attender Success 30% (45/150).

  **The Conflict:**
  *   **The Director's Instruction:** "What matters is which scheme does better for the young people it actually reaches." (This asks us to look at the **Attenders** subgroup).
  *   **The Group's Argument:** One side says Ives (Attenders win 70% vs 55%). The other says Halden (Total wins 61% vs 55%).

  **Ruth's Likely Analysis:**
  Ruth has to decide if "Attendance" is an **Input** (Rule A/C) or an **Output** (Rule B).

  1.  **Is Attendance an Input?** Are these young people pre-disposed to attend or not, regardless of the scheme? If so, the Director is right: we should only judge the scheme on those it *can* reach. This points to **Ives**.
  2.  **Is Attendance an Output?** Is getting a young person to attend part of the mentoring scheme's job? In Ruling 2, "Getting an interview" was part of the job, so Ruth judged the Total. A mentoring scheme that fails to get 150 kids to show up (Ives) is failing at a core task, even if it mentors the 250 who do show up very well. This points to **Halden**.

  **The Deciding Factor (Ruling 2 vs. Ruling 3):**
  In Ruling 3, the population mismatch was **external** (The Study had different kids than the Clinic). In this New Case, the population mismatch is **internal** (Ives failed to engage 150 of the 400 kids assigned to it).
  Ruth's background in local government finance suggests she cares about **value for money on the contract**. The charity pays for 400 places.
  *   Halden delivers 244 successes.
  *   Ives delivers 220 successes.
  *   The Director's instruction ("only care about those reached") is analogous to the argument in Ruling 2 that we should only care about those who got interviews. Ruth rejected that in Ruling 2.

  **Prediction:**
  Ruth will rule for **Halden**.

  **Her Reasoning:**
  She will likely say that "Attendance" is a measure of the scheme's performance, not a pre-existing trait of the children (unlike Maths ability or Weight). By choosing Ives, the charity accepts that 150 young people will disengage and likely fail (30% success rate for Ives non-attenders). Halden keeps those 150 people in the safety net (63% success rate for Halden non-attenders). The Director's instruction mistakes a *failure of engagement* for a *filter of population*.

  ### 3. Which Prediction I Would Bet On

  I would bet on **Halden**.

  **Why:**
  Ruth's Ruling 2 is the most methodologically robust precedent for program evaluation. If you allow schemes to be judged only on the people who "stick," you incentivize them to cherry-pick easy candidates or ignore hard cases.
  *   In Ruling 1, Southgate was rewarded for taking the "Weak" kids.
  *   In Ruling 2, Step-Up was rewarded for getting more interviews (even if conversion was slightly lower).
  *   In the New Case, Halden is rewarded for keeping the "Non-Attenders" afloat. The fact that Halden's non-attenders did *better* than their attenders (63% vs 55%) suggests Halden has a wider support net (perhaps remote support, or better initial screening), whereas Ives's non-attenders crash and burn (30%).
  *   Ignoring the non-attenders would be like ignoring the patients who died in surgery because "we only care about the ones who survived the operation." Ruth's finance background would flag this as hiding costs/failures.

  ### 4. The Ambiguity and The "Further Case"

  There is a genuine tension here between **Rule B (Output/Total)** and **Rule C (Context/Client Instruction)**.
  *   **Rule B** says: Judge the Total because attendance is the scheme's responsibility.
  *   **Rule C** says: Judge the Subgroup because the Client (Director) defined the population of interest.

  In Ruling 3, Ruth followed the Client's context. In Ruling 2, she overruled the implied focus on "Interview Conversion" to look at the Total. The New Case sits exactly between these two.

  **The Further Case to Separate the Rules:**
  To know for sure which rule Ruth prioritizes when they conflict, you would need to post a case where the **Client explicitly defines the population based on a Scheme Output.**

  *   **The Test Case:**
      *   Two Hospital Surgical Teams, A and B. 100 patients each.
      *   **Team A:** 90 survive surgery. Of the 90 survivors, 85 recover fully. (10 died in surgery).
      *   **Team B:** 70 survive surgery. Of the 70 survivors, 69 recover fully. (30 died in surgery).
      *   **The Hospital Director says:** "We are only evaluating surgical *technique*, so we only care about patients who survive the operation."
      *   **The Question:** Which team is better?

  *   **The Split:**
      *   If Ruth follows **Rule B (Responsibility)**: She picks **Team A**. Survival is an output of the team. Ignoring the 30 deaths hides the team's failure. (Matches Ruling 2 & New Case Halden).
      *   If Ruth follows **Rule C (Client Context)**: She picks **Team B**. The Director defined the population as "Survivors." Among survivors, B is superior (98% vs 94%). (Matches Ruling 3 & New Case Ives).

  If Ruth picks Team A, she will pick Halden. If she picks Team B, she might pick Ives in your new case, arguing that the Director's instruction defines the "clinic population."

  ### 5. Conclusion

  **Verdict:** Ruth will likely rule for **Halden**.
  **Reason:** She treats "Attendance" as a scheme output (Ruling 2), not a pre-existing filter (Ruling 1). The Director's instruction is treated as a misunderstanding of what the scheme is paid to do (engage the hard cases), similar to focusing only on interview conversion in Ruling 2.
  **Caveat:** If Ruth places higher value on "Client Autonomy" (Ruling 3) than "Scheme Responsibility" (Ruling 2), she could rule for Ives. However, given her finance background and the stark difference in non-attender outcomes (63% vs 30%), the "Value for Money" argument for Halden is stronger.

  **Advice for your friend:**
  Tell the Director that judging only the "Attenders" is like judging a fishing net only on the fish that didn't slip through the holes. If Ives is chosen, the charity must accept that 150 young people will likely drop out and fail. If the charity is willing to accept that risk to get higher success among the *remaining* 250, Ives is the choice. If the charity wants the best outcome for the *cohort of 400* they are funded to help, Halden is the choice. Ruth would almost certainly argue for the cohort.
