              *   Ruling 1 Subgroups: "Strong" vs. "Weak" (Pre-existing condition/Need).
              *   Ruling 2 Subgroups: "Got Interview" vs. "No Interview" (Outcome of the scheme).
              *   *Crucial Detail:* "Getting people into interviews is one of the things both schemes are meant to do."
              *   *Analysis:* In Ruling 2, the subgrouping variable (Interview) is a *mediator* or an *output* of the scheme, not just an input characteristic like "Weak/Strong" maths. Step-Up got twice as many interviews (200 vs 100). Bridgeway might be slightly better at converting an interview to a job, but Step-Up is much better at the whole process (getting the interview + getting the job).
              *   *Ruth's Logic:* If the subgrouping variable is part of the service's intended output (getting interviews), you shouldn't control for it. You judge the total outcome. If the subgrouping variable is an input characteristic (prior ability), you should control for it to measure efficacy.

      *   **Ruling 3 (Diets):**
