answer: |-
  1. Imagine a distillation chain where each student minimizes KL against the previous teacher's logits while seeing a tiny batch of fresh ground truth. The basic result is that after a few generations, the student ignores the fresh ground truth and overfits to the teacher's confident but potentially wrong logits, causing mode collapse where entropy plummets regardless of actual data distribution.

  2. Your fresh ground-truth batches are the private noisy signals, and the previous generation's synthetic data mixed into the loader is the public history. Rational herding is just loss minimization: if the teacher's logits are confident enough, the KL term dominates the cross-entropy on fresh data, making it optimal to ignore the new signal.

  3. The escape from collapse via soft labels only survives if you fudge the temperature schedule, assuming it stays high enough to prevent logits from hardening into pseudo-labels. The curator's dilemma maps to a second-order cascade, but the stability of that system only survives if you fudge the assumption that the filter's capacity doesn't degrade while training on the very drift it monitors.

  4. The herding literature assumes agents know the prior distribution and the rationality of predecessors, whereas your pipeline just sees gradient updates without modeling the teacher's intent. There's no equivalent for common knowledge in your stack; you have provenance tags, but the model doesn't reason about why the teacher chose those logits, it just minimizes the divergence.

  5. This residue is a blind spot in how we talk about training data because we treat drift as a bug rather than a rational optimization outcome given the loss landscape. But it also hints the herding result does less work than it looks, since gradient descent isn't choosing to ignore data, it's just being forced by the geometry of the loss surface.
