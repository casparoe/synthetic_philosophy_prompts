answer: |-
  Here's the game plan for the session.

  **1. Dependency Order: Circularity First, Skepticism Second**
  Start with the circular reasoning in everyday life. Do not open with radical skepticism. If you start with "how do you know you're not deceived?", your roommate might dismiss it as unanswerable metaphysical noise. Instead, start with the mechanical flaw. Get them to nod at how absurd it is to verify a tool using only that tool. Once the absurdity of the *structure* is locked in, *then* introduce skepticism as the consequence: "If we allow this kind of reasoning, we can't rule out being deceived, because the check is rigged." The circularity is the engine; skepticism is the exhaust.

  **2. The Lie-Detector Example: Specs**
  You need the machine to be mechanistic, not intuitive.
  *   **What it needs:** A two-step process where Step A (the reading) is validated by Step B (the calibration check), but Step B relies entirely on the data from Step A. For instance: The machine prints "TRUE" based on voltage spikes. To check if it's accurate, it runs a diagnostic that compares current voltage spikes against its own historical average of "TRUE" spikes.
  *   **What it must lack:** Any external anchor. There cannot be a known truth (like a control question where the answer is definitely yes/no) used to calibrate it. It also must lack subjective interpretation. It can't be "the operator feels confident." It has to be "the manual says this internal comparison guarantees accuracy."
  *   **Why:** If there's an external anchor, it's not bootstrapping, it's standard testing. If it relies on feeling, it collapses into "trust your gut," which is psychological, not epistemic. You need them to see that the *logic* is closed, not just that the user is confident.

  **3. Handling Misconceptions (Timing is Key)**
  *   **"Bootstrapping = Stubbornness":** Kill this **immediately** when you introduce the term. As soon as you say "bootstrapping," say: "This isn't about pulling yourself up by your bootstraps through sheer will or stubbornness. It's not a psychological refusal to change your mind. It's a structural flaw in how evidence is gathered." Do this before the lie-detector example so they don't map it to personality traits.
  *   **"Easy Knowledge = Simple Facts":** Address this **after** the circularity is established, when you transition to the philosophical stakes. Say: "When philosophers say 'easy knowledge,' they don't mean facts that are simple to learn, like 2+2. They mean knowledge that a theory allows you to claim without doing the hard work of justification." Place this right before you explain why this matters for knowledge theories.

  **4. The End Question**
  Don't ask them to define the term. Ask them to spot the loop in a fresh scenario.
  *   *Ask:* "If I use my memory to recall what I had for breakfast, and then use that memory to prove my memory is reliable today, exactly where did I step outside my own head to check the result?"
  *   *Why:* If they say "nowhere" or point out that the premise relies on the conclusion, they get the structure. If they try to find a way to make it work, they're still stuck in the loop.

  **5. What We're Leaving Out**
  Be upfront so they know this is a sketch, not a dissertation. Tell them: "We're skipping the full debate on reliabilism and closure principles. We aren't reading Cohen or Vogel today. We're just isolating the structural bug so you can spot it in the wild."

  Backbone: Start with the mechanical flaw of the lie-detector, clarify the terms before they stick wrong, then show how that flaw forces skepticism.
