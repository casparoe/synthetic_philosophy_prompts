  The misconceptions I'm expecting: they'll confuse bootstrapping with being stubborn, and think 'easy knowledge' just means stuff that's obvious or simple. Tell me where in the sequence — not just "early" — I should head off each one.

  Give me the one end question that proves they've grasped the circularity structure rather than just repeating the phrase. Also say openly what I'm leaving out at this level — like the full reliabilist literature — and don't ask for readings.

