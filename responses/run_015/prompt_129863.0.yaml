  I need to plan a session for my roommate — smart, reads philosophy blogs, zero formal training — on the bootstrapping problem together with 'easy knowledge,' that idea where you need prior knowledge to check if you're decieved but then can't build that prior knowledge from the check without going in circles. Don't explain it to me; plan the explaination.

