answer: |-
  You have hit on one of the most persistent and fruitful tensions in historiography: the conflict between **structuralism** (long-term forces make outcomes inevitable) and **contingency** (specific events/agents change the course of history).

  Your intuition is sharp. If you strictly hold that an outcome is *overdetermined* (meaning multiple sufficient causes exist such that removing one doesn't stop the effect), then a counterfactual asking "What if this specific cause didn't happen?" seems logically null if the implied question is "Would the outcome have been avoided?"

  However, your confusion stems from assuming that counterfactual history is always asking about the **endpoint** (survival vs. collapse). Often, it is asking about the **pathway** (the nature, timing, and aftermath of the collapse).

  Here is how to untangle the knot between determinism, overdetermination, and counterfactuals.

  ### 1. Fixing the Apple Analogy
  Your analogy was: *"It feels like asking 'what if gravity pulls but the apple just hovers'."*

  That would indeed be a logical contradiction. But in an overdetermined scenario, removing the Mongol invasion isn't turning off gravity; it's removing **one of several heavy winds blowing the apple down.**

  If the empire is structurally rotten (gravity), the apple will fall.
  *   **Timeline A (Actual):** Gravity + Mongol Wind $\rightarrow$ Apple smashes on rocks.
  *   **Timeline B (Counterfactual):** Gravity + Internal Revolt Wind $\rightarrow$ Apple falls into a bush.

  The **endpoint** (the apple falls/empire collapses) remains the same. But the **consequences** differ wildly. Smashing on rocks destroys the seeds (infrastructure, irrigation, knowledge). Falling into a bush allows for regrowth.

  So, historians aren't necessarily asking, "Would the empire have lived forever?" They are asking, "Would the collapse have been civilizational suicide, or just a regime change?"

  ### 2. Endpoint Inevitability vs. Pathway Contingency
  You asked: *"Is there a version of inevitability that applies only to the endpoint and not to every pathway?"*

  **Yes.** This is the standard position of most modern structuralist historians. They argue for **conjunctural causality**.

  *   **Structural Forces (The Gradient):** Demographics, fiscal insolvency, and climate change create a slope. The ball *will* roll down.
  *   **Contingent Events (The Nudge):** The Mongols, a specific plague, a weak Caliph. These determine the speed and trajectory of the roll.

  If you run the counterfactual "No Mongols," you aren't testing whether the ball rolls. You are testing **how hard it hits the bottom.**

  In the specific case of the 13th-century Middle East (Abbasid Caliphate), the Mongol destruction of Baghdad wasn't just a change of management. They destroyed the Qanat irrigation systems that had sustained Mesopotamian agriculture for millennia.
  *   **Actual History:** Mongols invade $\rightarrow$ Systematic destruction of infrastructure $\rightarrow$ Centuries of demographic and economic decline.
  *   **Counterfactual:** No Mongols $\rightarrow$ Fiscal rot causes internal coup $\rightarrow$ New dynasty inherits intact irrigation $\rightarrow$ Faster recovery.

  The empire (as a political entity) might still have fallen due to rot, but the *civilization* might not have been set back 500 years. That is a massive historical difference, even if the "fall" was inevitable.

  ### 3. Are Historians Implicitly Rejecting Inevitability?
  When historians run these counterfactuals, they are usually doing one of two things:

  **A. Testing the Weight of Causes (The "Overdetermination Check")**
  Some historians use counterfactuals to prove inevitability. They argue: *"Even without the Mongols, the Mamluks or a peasant revolt would have toppled the Abbasids within 20 years."* Here, the counterfactual is used to demonstrate that the specific trigger didn't matter much. This reinforces the overdetermination thesis.

  **B. Highlighting Critical Junctures (The "Contingency Check")**
  Other historians argue that while structural rot makes an empire *vulnerable*, it doesn't guarantee *collapse*. A vulnerable empire can limp along for centuries (see: the Byzantine Empire or the late Ottoman Empire).
  In this view, the Mongol invasion wasn't just a trigger; it was a **critical juncture** that closed off paths of reform that were theoretically possible. By removing the Mongols, they are asking: *"Was there a path to stabilization that the Mongols foreclosed?"*
  This implicitly rejects strong determinism. It suggests that while the *risk* was structural, the *outcome* was not guaranteed.

  ### 4. Determinism vs. Overdetermination (Clearing the Confusion)
  You mentioned you think you're mixing these up. Here is the distinction:

  *   **Determinism:** $A \rightarrow B$. If the fiscal rot exists, the fall *must* happen. There is only one outcome.
  *   **Overdetermination:** $A + C + D \rightarrow B$. There are multiple sufficient causes for the fall. If you remove $A$ (Mongols), $C$ (Revolt) or $D$ (Succession Crisis) will still cause $B$.

  **The Confusion:** You feel that if Overdetermination is true, Counterfactuals are useless.
  **The Resolution:** Counterfactuals are useful in overdetermined systems to measure **magnitude** and **morphology**, not just binary existence.

  If a building is condemned (structural rot) and has three supports rigged to blow (overdetermined):
  *   Blowing Support 1 makes it fall North.
  *   Blowing Support 2 makes it fall South.
  *   Blowing Support 3 makes it collapse inward.

  Asking "What if Support 1 wasn't blown?" is a valid question, even if the building was definitely going to fall. It tells you about the debris field (the historical aftermath).

  ### Summary
  You aren't wrong to feel that "What if the empire survived?" is a weak question if you believe in structural overdetermination. But that isn't usually the sophisticated historian's question.

  The real counterfactual is: **"Given that the collapse was likely, did the Mongol invasion transform a manageable political transition into a civilizational catastrophe?"**

  If the answer is yes, then the counterfactual has value even within a deterministic framework. It shifts the debate from "Inevitability of Failure" to "Inevitability of Ruin." Historians running these scenarios are often trying to isolate whether the *severity* of the outcome was determined by structure or by the specific contingency of the invasion.

  So, they aren't necessarily rejecting inevitability; they are refining **what exactly was inevitable.**
