answer: |-
  This is a classic problem in political philosophy and legal theory. You are struggling because you are trying to find a *moral* definition for what is often an *institutional* concept. Your supervisor wants a definition that works for a paper, which means it needs to be operational, not just philosophically pure.

  Your intuition is actually more sophisticated than standard legal definitions. You are distinguishing between **abuse of power** and **systemic dysfunction**, and between **hidden subversion** and **open institutional norms**.

  Here is a two-part principle that captures your intuitions, handles the cultural relativism objection, and gives you a tool for the "Dad/Watch" case.

  ### The Principle: The Role-Integrity Test

  **Corruption occurs when a public official accepts a private benefit that creates an obligation incompatible with the defined criteria of their public role, *unless* that benefit is a transparent, institutionalized norm of that specific office.**

  To apply this, you must run two checks:

  1.  **The Displacement Check:** Does the benefit create a private obligation that displaces the public criteria the official is supposed to use? (e.g., Merit, Fairness, Law).
  2.  **The Legitimacy Exception:** Is that benefit/obligation an *open, recognized rule or norm* of the institution itself? (This handles the cultural relativism and legacy admissions).

  ---

  ### Applying the Test to Your 11 Cases

  Here is how this principle sorts your list, including where it forces you to clarify your thinking.

  *   **(1) Passport "Grease Money":**
      *   *Displacement:* Yes (Speed displaces queue).
      *   *Legitimacy:* No.
      *   *Verdict:* **Technically Corruption, but morally Extortion.**
      *   *Correction:* Your intuition says "not corruption" because you are the *victim*, not the corruptor. The *clerk* is corrupt; you are paying a ransom to restore your entitlement. For your paper, classify this as **Survival Payment** (distinct from Corruption). Corruption requires *discretion*; here you are paying to remove an illegitimate barrier to a right.
  *   **(2) Mayor/Golf:**
      *   *Displacement:* Yes (Friendship displaces Best Bid).
      *   *Legitimacy:* No (Hidden).
      *   *Verdict:* **Corruption.** (Classic conflict of interest).
  *   **(3) Village Chief/Goat:**
      *   *Displacement:* No. In that institution, "being someone the chief owes" *is* a criterion for hearing.
      *   *Legitimacy:* Yes (Customary norm).
      *   *Verdict:* **Not Corruption.** This answers your friend: You aren't smuggling in Western standards; you are defining the "public role" relative to the *local institution*. If the goat is the fee, it's a tax. If it's hidden, it's a bribe.
  *   **(4) Wine (After):**
      *   *Displacement:* No (Service already rendered).
      *   *Verdict:* **Not Corruption.** (Gratitude).
  *   **(5) Wine (Before):**
      *   *Displacement:* Yes (Creates obligation before duty).
      *   *Verdict:* **Corruption.** (Timing creates the obligation).
  *   **(6) Drug Rep (Travel):**
      *   *Displacement:* Yes (Influences prescribing).
      *   *Legitimacy:* No (Industry norm $\neq$ Medical institution norm).
      *   *Verdict:* **Corruption.** (Even if belief is honest, the *criteria* for prescribing should be evidence, not hospitality).
  *   **(7) Drug Rep (Sandwiches):**
      *   *Displacement:* Trivial (*De minimis*).
      *   *Verdict:* **Not Corruption.** (Threshold of influence).
  *   **(8) Nurse (Queue):**
      *   *Displacement:* Yes (Cash displaces Medical Need).
      *   *Verdict:* **Corruption.**
  *   **(9) Nurse (Overtime):**
      *   *Displacement:* No. She is selling *private* time, not public resources.
      *   *Verdict:* **Not Corruption.** (Moonlighting).
  *   **(10) Building for Admission:**
      *   *Displacement:* Yes (Money displaces Merit).
      *   *Legitimacy:* No. This is usually a specific *transaction*, not a general rule.
      *   *Verdict:* **Corruption.** (Quid pro quo).
  *   **(11) Legacy Admission:**
      *   *Displacement:* Yes (Lineage displaces Merit).
      *   *Legitimacy:* **Yes.** It is an open, institutionalized policy.
      *   *Verdict:* **Not Corruption (but Unfair).** This is the crucial distinction. Corruption is *subversive*; unfairness can be *legal and open*.

  ---

  ### The Verdict on Your Dad (The Stuck Case)

  **Scenario:** Dad on planning committee. Friend's firm has application. Watch sent (customary engagement gift). Dad recused. Vote passed.

  **Apply the Test:**
  1.  **Displacement Check:** Did the watch create an obligation incompatible with his role?
      *   *Argument for No:* He recused himself. He didn't vote.
      *   *Argument for Yes:* The watch arrived *before* the vote. Even if he didn't vote, does he influence other committee members? Does he feel obligated to remain on the committee to ensure the process goes smoothly? The obligation exists even if the specific vote was avoided.
  2.  **Legitimacy Exception:** Is the watch a norm of the *Planning Committee*?
      *   No. It is a norm of the *community/family*, but not the *public office*.
      *   Crucially, the timing coincides with a pending official action.

  **Prediction:** This is **Corruption (or at minimum, a severe Ethical Breach).**
  **Why:** The "customary" defense works for the Village Chief (Case 3) because the gift *is* the institutional fee. For your dad, the gift is a *social* norm clashing with a *public* norm. Public office requires a higher barrier against private obligation than private life does. The recusal mitigates the *act*, but the acceptance of the gift violates the *role integrity* because the value is significant and the timing creates an appearance of obligation.

  **Advice for the Paper:** If you want to defend your dad, you must argue that the "custom" is so strong that refusing it would socially ostracize him, making it a "coercive norm" (like Case 1). But strictly speaking, under the Role-Integrity Test, this fails.

  ---

  ### The Trade-Offs (Where You Must Be Honest)

  To use this principle, you have to accept three tensions. You cannot have it all.

  **1. Corruption vs. Unfairness (Case 10 vs. 11)**
  You must accept that **institutionalized bias is not corruption.** If the University *openly* states "We admit alumni kids," it is unfair, but it is not corrupt under this definition. Corruption requires a *violation* of the rules, not *unjust* rules.
  *   *The Clash:* If you believe Legacy Admissions *are* corruption, you must change the definition to "Any displacement of merit by private interest." But if you do that, Case 3 (The Chief) becomes corruption, and you lose the cultural relativism argument. You have to choose: Is corruption about *breaking rules* or about *bad outcomes*? Your intuitions suggest the former. Stick with that.

  **2. The Victim Problem (Case 1)**
  You must distinguish between the **Corrupt Official** and the **Corrupt Act.** In the Passport case, the *system* is corrupt, but the *citizen* is not. If your paper defines corruption as an act by the officeholder, Case 1 is corruption by the clerk. If your paper defines it as a transaction, you need a category for "Extortionate Payments."
  *   *The Clash:* Don't call Case 1 "Not Corruption." Call it **"Defensive Payment."** It acknowledges the corrupt system without blaming the victim.

  **3. The "Western Standard" Objection (Case 3)**
  Your friend is half-right. You cannot define "Public Duty" using a Western liberal ideal (e.g., "impartiality"). You must define it functionally: **What is this office supposed to do in this context?**
  *   *The Fix:* In the village, the Chief's office is to maintain social cohesion. The goat maintains cohesion. In the city, the Mayor's office is to allocate resources efficiently. The golf trip undermines efficiency. The *role* defines the corruption, not an external moral standard.

  ### Summary for Your Supervisor

  If you need a single sentence definition for the abstract:

  > **"Corruption is the subversion of a public role's defined criteria for decision-making by private benefits, excluding those benefits that are transparent, institutionalized norms of that specific office."**

  This allows you to argue that Case 3 and Case 11 are *unfair* or *traditional*, but not *corrupt*, while Case 2, 5, 6, 8, and 10 are corrupt. It solves your Dad case (Social norm $\neq$ Institutional norm), and it answers your friend (The standard is internal to the institution, not Western).

  **One final warning:** Your supervisor might push back on Case 11 (Legacy Admissions). Many political theorists *do* classify institutionalized nepotism as corruption ("Institutional Corruption"). If you want to keep Case 11 as "Not Corruption," be prepared to defend the distinction between **Illegal/Hidden Subversion** (Corruption) and **Legal/Open Privilege** (Inequality). That is a defensible position, but it is a political choice, not just a semantic one.
