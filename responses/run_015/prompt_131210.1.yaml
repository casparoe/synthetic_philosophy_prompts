      *   *Weakness:* Disconnects worth from actual moral impact.

      *   *Objection 7 (Situationist):* Focus on Narrative. You're just telling a story about control after the fact.
      *   *Reply:* The physical presence of the scaffold (e.g., a locked account) is empirical evidence, not just narrative.
      *   *Weakness:* Physical constraints don't prove normative intent.

      *   *Objection 8 (Virtue Ethicist):* Focus on Habituation. This makes virtue external rather than internal.
      *   *Reply:* Internalization is the goal, but scaffolding is the bridge. Worth applies to the bridge-building too.
      *   *Weakness:* Suggests scaffolding is merely instrumental, not constitutive.

      *   *The "Hope Nobody Asks":* The Diachronic Identity Problem. If the "Past Self" binds the "Present Self," is the Present Self autonomous?
