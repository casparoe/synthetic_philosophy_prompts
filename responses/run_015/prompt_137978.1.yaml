  Welcome to the Anthropics Sorting Quiz. Please read each scenario and pick the option that matches your gut feeling. Do not overthink the philosophy; just choose what seems true. Write down your choice for each question number, following the branching instructions where they appear. Q1 asks you to imagine you learn your birth rank among all humans who will ever live is surprisingly early, say within the first five percent. Does this fact alone make you think the total number of humans who will ever live is likely smaller than you previously thought? Choose (a) yes, it is strong evidence for a smaller total, (b) no, it changes nothing about the total, or (c) it depends on how you define the group you are counting yourself in. If you picked (b), skip to Q8. If you picked (c), go to Q3. If you picked (a), continue to Q2. Q2 presents a different case about duration rather than rank. Imagine you tune into a TV show at a random moment and see it is on episode five, with no prior knowledge of how long the show usually runs. Should you guess the show will end soon rather than later? Choose (a) yes, being early suggests a short run, (b) no, episode number tells you nothing about total length, or (c) yes, but only for shows, not for humans. If you picked (a) here but picked (b) in Q1, mark yourself as a Duration Sampler and skip to the scoring key. If you picked (a) in both, continue to Q3. Q3 is the Upload Census. Suppose that from the year 2200 onward, digital minds vastly outnumber biological humans in any given year, though perhaps not in total lives lived. When calculating your birth rank in Q1, should you count only biological humans or include the digital minds? Choose (a) only biologicals, because they are like me, (b) all minds, because they are observers like me, or (c) it is arbitrary, and any answer is as good as another. If you picked (c), mark yourself as a Reference-Class Relativist and skip to the scoring key. If you picked (a), go to Q4. If you picked (b), go to Q5. Q4 asks what happens if you discover you are biological despite the uploads existing. Does this discovery shift the probability of doom compared to not knowing? Choose (a) yes, being biological makes doom more likely since I am in the smaller group, or (b) no, my nature doesn't change the odds of the total. If you picked (a), continue to Q5. If you picked (b), go to Q6. Q5 involves a Funding Committee. A foundation must choose between preventing extinction or helping people now. If the doomsday shift makes extinction more likely, does this make extinction prevention more urgent? Choose (a) yes, higher risk demands more money, (b) no, because fewer people will exist to save so the impact is lower, or (c) no, because the risk isn't actually higher. If you picked (a), go to Q7. If you picked (b), mark yourself as Real but Inert and skip to the scoring key. If you picked (c), go to Q9. Q6 asks about extra observers. Suppose your committee could create a huge population of people who will live after you and never interact with you. Does creating them change the probability that you were born early? Choose (a) yes, creating more people makes it less likely I am early, (b) no, creating people doesn't change where I am, or (c) only if I could have been one of them. If you picked (a), go to Q9. If you picked (b), go to Q7. If you picked (c), go to Q7. Q7 is the second part of the extra observers case. Imagine the huge population exists on a sealed-off branch of reality you could never have been part of. Does their existence change the probability you were born early? Choose (a) yes, all observers count, (b) no, only observers I could have been count, or (c) no, observers never count for this. If you picked (a), go to Q9. If you picked (b) or (c), go to Q8. Q8 asks about infinity. Suppose the expected number of observers in the universe is infinite. Does the doomsday argument still work? Choose (a) yes, probabilities still shift, or (b) no, the math breaks down with infinities. If you picked (b), mark yourself as an Infinitary Escapist and skip to the scoring key. If you picked (a), go to Q9. Q9 asks about existence itself. Does the mere fact that you exist at all provide evidence that the total number of observers is large? Choose (a) yes, existence favors larger worlds, (b) no, existence is not evidence, or (c) yes, but it cancels out the birth rank evidence exactly. If you picked (a), mark yourself as a Canceler and skip to the scoring key. If you picked (b), mark yourself as a Skeptic and skip to the scoring key. If you picked (c), mark yourself as a Canceler and skip to the scoring key. If you have not been marked yet, go to Q10. Q10 is a final check on action. Suppose you grant the probability shift from Q1 but think it should not move any money in Q5. Is this because the utility cancels the probability? Choose (a) yes, expected value stays the same, or (b) no, I just don't trust the shift. If you picked (a), mark yourself as Real but Inert. If you picked (b), mark yourself as a Classic Shifter.

  To score the quiz, match your marked label or answer path to the following descriptions. Anyone who answered (a) to Q1 and (a) to Q2 and ended up at Classic Shifter believes the birth rank is real evidence that the total is small and keeps the shift, accepting the gloomy conclusion without trying to dissolve it. This is the standard Bayesian update position. Anyone who landed on Canceler typically answered (a) to Q1 but then (a) or (c) to Q9, believing that the fact you exist at all is itself evidence for a big total and that this washes the shift out exactly, leaving your original odds unchanged. Anyone marked as Reference-Class Relativist chose (c) in Q3, thinking you can get almost any answer depending on who you count as a possible you and that nothing selects between them, so the thing dissolves into a choice of framework rather than a fact. The Infinitary Escapist is identified by Q8(b), saying the argument never gets going because the expected number of observers is infinite and probabilities cannot normalize. The Real but Inert person grants the probability shift but thinks it cancels in expected-utility terms, often choosing (b) in Q5 because while doom is more likely, there are fewer people to save, so the money should not move. The Skeptic is identified by Q9(b), thinking you cannot update on your own existence at all, so there is nothing here to have a view about. The Duration Sampler is the rare case who said (a) to Q2 but (b) to Q1, accepting the TV show logic but rejecting the birth rank logic for humans.

  Regarding the logical space, there are empty boxes where no one lives. For instance, there is no position that claims existence favors smaller worlds, because that contradicts the basic principle that you are more likely to exist where there are more of you. There is also no stable position that accepts the shift for TV shows but denies it for humans without a specific reason like reference class relativity, which is why the Duration Sampler is a distinct leaf rather than a contradiction. One box that is theoretically possible but unattractive is the view that creating extra observers changes the odds only if they are biological, which collapses into reference class relativism.

  There are two leaves this quiz genuinely cannot separate without a direct conversation. The Canceler and the Real but Inert person both end up not moving the money in the Funding Committee case, but for different reasons. The Canceler thinks the risk isn't higher, while the Inert person thinks the risk is higher but the value is lower. The quiz separates them via Q9 and Q5, but if a participant rushes, they may look identical in action. To split them definitively, you would need to ask a direct belief question like "Is the probability of extinction higher than you thought before the quiz?" which was not included to keep the focus on cases. Additionally, the Skeptic and the Canceler both ignore the doomsday argument, but the Skeptic denies the evidence exists while the Canceler says it cancels. This is separated by Q9, but in practice, both behave as if the argument is null. If you need to distinguish them, ask whether knowing they exist makes a large universe more likely; the Canceler says yes, the Skeptic says no or that the question is invalid.
