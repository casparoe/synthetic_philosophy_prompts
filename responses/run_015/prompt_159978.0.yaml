answer: |-
  Here is a conceptual reconstruction of the implicit philosophical commitments underlying each regime, based on the descriptions provided.

  ### The Core Philosophical Divide: Status vs. Conduct

  The fundamental disagreement between these regimes is not merely about policy efficacy but about the moral ontology of sex work itself. The Nordic model presupposes that the *status* of the transaction is inherently wrongful, whereas the German and New Zealand models presuppose that the *conduct* surrounding the transaction is where wrongfulness arises.

  **1. The Nordic Model: Structural Victimization and Invalid Consent**
  The Nordic model is committed to a radical asymmetry regarding agency. By criminalizing the buyer and third parties while exempting the seller, the law constructs a specific theory of consent: consent to sell sex is structurally invalid or morally insufficient to legitimize the buyer's action.

  *   **View of Consent:** The model assumes that in a patriarchal society, a woman's consent to sell sex is never fully autonomous. It is viewed as compromised by systemic inequality, economic necessity, or male dominance. Therefore, the law treats the seller as a victim who lacks the standing to authorize the purchase, even if she claims otherwise.
  *   **View of Exploitation:** Exploitation is inherent to the purchase, not contingent on coercion. This is why the "reverse-asymmetry probe" fails here: even a well-paid, unionized worker cannot validate the transaction because the wrong lies in the commodification of intimacy itself, not the conditions of labor.
  *   **View of Third Parties:** The criminalization of managers—even those providing security or accounting—presupposes that profit derived from sex work is inherently parasitic. It denies the possibility of a legitimate labor intermediary.
  *   **Role of Criminal Law:** The law acts as a moral educator and a protective shield. It punishes the buyer to signal moral wrongness (demand reduction) and refuses to punish the seller to avoid compounding victimization.
  *   **Internal Tension:** The most significant tension lies in the treatment of agency. The model grants the seller enough agency to be responsible for her safety (she is not locked up), but denies her enough agency to validate the contract or manage her business (third parties are banned). This creates a protection gap: if she cannot legally employ security or operate from a fixed location (because brothels are illegal), she is forced into riskier conditions to avoid detection, undermining the stated goal of protecting women.

  **2. The German Model: State-Managed Risk and Conditional Legitimacy**
  The German regulation model treats sex work as a legitimate economic sector but retains a heavy hand of state paternalism.

  *   **View of Consent:** Consent is valid and sufficient to create a labor relationship. The worker is an economic agent.
  *   **View of Exploitation:** Exploitation is contingent on violations of health, safety, or contract law. However, the specific requirements (mandatory registration, mandatory condom use) suggest the state views sex work as *sui generis*—a risky category requiring special containment rather than ordinary labor status.
  *   **Role of Criminal Law:** Criminal law recedes in favor of administrative law. The state's role is to monitor and sanitize the industry.
  *   **Internal Tension:** There is a tension between "legitimate work" and "special regulation." If this were truly equal to other labor, mandatory registration (which compromises privacy and safety) and specific health mandates not applied to other risky jobs (like construction) would be unnecessary. This suggests a lingering moral stigma disguised as health policy. The model fits well with a public health utilitarianism but conflicts with a pure labor rights view.

  **3. The New Zealand Model: Labor Rights and State Neutrality**
  The New Zealand decriminalization model is the most philosophically consistent with a liberal labor theory.

  *   **View of Consent:** Consent is robust. The worker has the right to refuse clients, and contract law governs disputes. This treats sexual services as comparable to other personal services.
  *   **View of Exploitation:** Exploitation is defined by standard labor violations (coercion, non-payment, unsafe conditions), not by the nature of the work.
  *   **Role of Criminal Law:** Criminal law is restricted to preventing harm (fraud, coercion, violence), not enforcing morality. The disclaimer that the Act "does not express moral approval" is crucial: it separates legal rights from moral endorsement, maintaining state neutrality on comprehensive doctrines of the good life.
  *   **Internal Tension:** There is little internal tension here. The disclaimer might seem odd alongside full rights, but it is politically necessary to secure passage without implying the state *promotes* sex work. Philosophically, it is consistent with liberalism: the state protects rights regardless of moral approval.

  ### Coherence and Weakest Presuppositions

  **Most Internally Coherent:** The **New Zealand model** is the most internally coherent. It aligns the legal structure (contract law, health and safety, right to refuse) with its underlying theory (sex work is work). It avoids the Nordic contradiction of claiming to protect workers while banning the mechanisms (brothels, managers) that make work safer. It avoids the German contradiction of claiming legitimacy while imposing stigmatizing registration requirements.

  **Weakest Presupposition:** The **Nordic model's** presupposition is the weakest. It relies on an essentialist claim: that paid sex is *categorically* unlike other labor and inherently degrading regardless of context. This is empirically and philosophically fragile. It cannot account for the "reverse-asymmetry probe" (the willing, well-paid worker) without dismissing her testimony as false consciousness. While this protects some vulnerable individuals, it does so by stripping all sex workers of professional agency. The tension between "victim" and "agent" is real, not apparent; the model tries to have it both ways and fails to provide actual safety mechanisms because it criminalizes the infrastructure of safety (third parties).

  ### Rewriting the Nordic Model on Labor Grounds

  If the Nordic model were rewritten to align with the labor view implicit in New Zealand, the following changes would be strictly necessary:

  1.  **Decriminalize the Purchase:** The criminalization of clients must go. On a labor view, a consensual exchange of money for services is not a crime. Keeping this would contradict the premise that the worker is a valid agent.
  2.  **Decriminalize Third Parties:** The bans on brothel-keeping and living off earnings must be repealed. If sex work is labor, workers must be allowed to collaborate, hire security, and employ managers. Criminalizing these roles presupposes exploitation is inherent to organization, which the labor view denies.
  3.  **The Disclaimer:** The official disclaimer about not endorsing prostitution *does not* need to change. State neutrality is compatible with the labor view. However, the *rationale* for the disclaimer would shift from "we don't punish victims but still think it's bad" to "this is a matter of private morality, not public law."

  ### Confidence and Extrapolation

  I am **highly confident** in the reconstruction of the legal structures and their immediate logical implications (e.g., banning third parties implies viewing organization as inherently exploitative). I am **moderately confident** in attributing the specific philosophical rationales (e.g., "structural victimization") to the Nordic model, as this is the standard philosophical defense required to make sense of the asymmetry, though some proponents might argue from empirical claims about violence rather than moral ontology.

  I am extrapolating slightly when characterizing the German model's registration requirements as evidence of lingering stigma; it is possible to argue these are purely public health measures. However, given that other risky jobs do not require public registration of workers, the philosophical implication of "special risk category" is the stronger reading.

  The apparent tension in the Nordic model (protecting workers by making their work illegal to organize) dissolves only if you accept that the goal is abolition, not safety. If the goal is safety, the tension is real and fatal. The New Zealand model resolves this by prioritizing safety over abolition.

  ### Final Position

  The Nordic model is philosophically committed to the view that sexual integrity cannot be commodified without violence, making it a moralistic regime disguised as protective feminism. The New Zealand model is committed to the view that sexual labor is a subset of economic labor, making it a liberal regime grounded in agency. The German model is a hybrid that accepts the labor view but retains state control mechanisms that undermine full agency.

  The Nordic model's weakest link is its denial of agency to the seller; it protects women by treating them as children of the state. The New Zealand model is superior because it respects the agency of the worker even when the work is morally contested, recognizing that rights should not depend on moral approval. The "reverse-asymmetry probe" demonstrates that the Nordic model is not actually about protecting women's choices, but about enforcing a specific vision of sexual morality where market exchange in intimacy is inherently wrongful.
