      *   **Confidence Statement:** High on legal structure, moderate on specific philosophical intent (since I can't look up sources), but high on logical implications.

      *(Self-Correction during drafting)*: Make sure I don't just say "Nordic is bad." I need to explain *why* it makes sense internally if you accept its premise, but why the premise is the weak link. The prompt asks for a "committed response... take a definite position on which model is most internally coherent and which presupposition is weakest."

