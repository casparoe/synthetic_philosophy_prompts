answer: |-
  **Title:** Beyond the Formalism: The Discursive Dilemma as a Substantive Crisis of Collective Agency

  **Introduction**
  In the literature on judgment aggregation, it has become fashionable to treat the discursive dilemma (or doctrinal paradox) as a technical hurdle rather than a philosophical crisis. The standard proceduralist objection runs as follows: the paradox arises only because a group fails to commit to an aggregation rule *ex-ante*. Once a group decides to aggregate via premises (premise-based procedure, PB) or conclusions (conclusion-based procedure, CB), the inconsistency vanishes. Therefore, the dilemma is not a substantive problem of rationality, but merely a bug in procedural design.

  This position paper argues the opposite. The discursive dilemma is not a removable artifact of formal modeling; it is a substantive, unavoidable tension inherent to collective decision-making. The choice between PB and CB is not a neutral technical fix but a normative conflict that is often undecidable from the internal perspective of the group. By examining the classic jury scenario, I will demonstrate that the dilemma reveals a deeper fracture in how groups constitute themselves as agents: the trade-off between collective *integrity* (logical consistency) and collective *responsiveness* (majority will).

  **The Concrete Case: The Jury Trilemma**
  To ground the argument, consider the standard legal setup. A three-judge panel must decide on a defendant's guilt ($c$). Legal doctrine dictates that guilt is established if and only if the defendant committed the act ($p$) and had the requisite intent ($q$). Logically: $(p \land q) \leftrightarrow c$.

  Suppose the judges hold the following judgments:
  *   **Judge 1:** $p$ (Yes), $q$ (Yes) $\rightarrow$ $c$ (Yes)
  *   **Judge 2:** $p$ (Yes), $q$ (No) $\rightarrow$ $c$ (No)
  *   **Judge 3:** $p$ (No), $q$ (Yes) $\rightarrow$ $c$ (No)

  If we aggregate by **conclusion** (CB), the verdict is *Not Guilty* (2 votes against $c$).
  If we aggregate by **premises** (PB), the majority accepts $p$ (2 votes) and $q$ (2 votes), forcing a verdict of *Guilty* (since $p \land q$ entails $c$).

  The proceduralist says: "So what? The court just needs to decide beforehand whether they are voting on the *elements* or the *verdict*." This suggests the contradiction is merely a result of ambiguity.

  **The Meta-Choice Problem**
  The proceduralist defense fails because it ignores the **meta-choice problem**. How does the group decide which rule (PB or CB) to adopt?

  1.  **If they vote on the rule:** If the judges vote on whether to use PB or CB, they face the discursive dilemma *again*. Judge 1 prefers PB (leads to Guilty). Judges 2 and 3 prefer CB (leads to Not Guilty). But wait—if they use PB to decide the rule, they might select PB. If they use CB to decide the rule, they might select CB. The paradox recurs at the meta-level. There is no neutral voting procedure to select the voting procedure without begging the question.
  2.  **If they appoint a chair:** If a single authority dictates the rule to avoid the loop, the group ceases to be a democratic collective and becomes a hierarchy. This solves the logical inconsistency but destroys the democratic legitimacy of the aggregation.

  Therefore, the choice between PB and CB is **undecidable from the inside**. There is no "view from nowhere" available to the group to adjudicate which method is correct without already presupposing a stance on what the group is trying to achieve.

  **Competing Normative Ideals: Integrity vs. Responsiveness**
  The reason the dilemma is substantive rather than technical is that PB and CB represent two competing, equally valid normative ideals of group agency.

  *   **Premise-Based (Integrity):** PB prioritizes the *reasons* for a decision. It treats the group as a truth-seeker that must maintain logical integrity across its belief set. In the jury case, PB respects the legal doctrine ($p \land q \leftrightarrow c$) as binding. It ensures that the collective judgment is reason-responsive. However, it risks overriding the majority view on the ultimate outcome (the verdict), potentially violating democratic responsiveness.
  *   **Conclusion-Based (Responsiveness):** CB prioritizes the *outcome*. It treats the group as a will-former where the direct preference of the majority on the final issue is sovereign. In the jury case, CB respects the majority's desire to acquit. However, it allows the group to hold inconsistent beliefs (accepting $p$ and $q$ collectively while rejecting $c$), rendering the group irrational in a propositional sense.

  The discursive dilemma forces a group to choose between being **rational** (consistent) and being **democratic** (responsive to individual judgments on all propositions). This is not a technical glitch; it is a fundamental limit on collective agency, akin to Arrow's Impossibility Theorem but applied to reason-based decision-making.

  **The Deeper Tension: Epistemic vs. Political Authority**
  The persistence of the dilemma points to an ambiguity in the nature of the group itself.
  *   Is the jury an **epistemic body** tasked with finding the truth according to the law? If so, PB is normatively superior because it respects the logical structure of the law.
  *   Is the jury a **political body** tasked with representing the community's conscience? If so, CB is normatively superior because it respects the majority's will on the final outcome.

  In many real-world contexts, groups are *both*. A legislature, a court, or a corporate board often has dual mandates: to be rational/consistent and to be representative/responsive. The discursive dilemma explodes when these mandates collide. To claim the dilemma is "just a technical artifact" is to assume that groups can clearly define their ontology prior to decision-making. In practice, groups often discover their identity *through* the conflict of the dilemma.

  **Conclusion**
  We must stop treating the discursive dilemma as a puzzle to be solved by better procedure. It is a symptom of a deeper condition: collective agents cannot simultaneously maximize logical consistency and majority responsiveness. The choice between premise-based and conclusion-based aggregation is not a neutral technical parameter; it is a substantive political and epistemic commitment that cannot be rationally adjudicated without circularity.

  By recognizing the dilemma as substantive, we acknowledge that collective rationality is not a state to be achieved, but a tension to be managed. The "paradox" does not vanish when we pick a rule; rather, the act of picking a rule is where the real political struggle lies. To dismiss this as a formal quirk is to misunderstand the nature of group agency itself.
