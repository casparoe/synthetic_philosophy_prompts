prompt: |-
  So a friend of mine is going through IVF at the moment and it's got me and a few people from my very informal reading group stuck on something. The thing that struck us is how picky the whole setup is about which reasons for choosing one embryo over another count as respectable. The clinic will happily discard embryos with the wrong number of chromosomes, will test for a specific disease if both parents are carriers, and — at least where I live, with some approvals — will let you pick an embryo that's a tissue match for a sick older sibling. But the same clinic acts as if ranking embryos by anything like intelligence or height is straight-up beyond the pale, and non-medical sex selection is either illegal or something they'll quietly steer you away from. At the same time, the very same health system nags pregnant women about folate and alcohol, and basically everyone I know agrees that a woman who drinks heavily all through a pregnancy has wronged the child she ends up having. That last bit is what I can't square. If we already accept that prospective parents owe it to the child who will exist to make that child as well off as they reasonably can, then why isn't "take the embryo with the best expected life" the obvious next step? Isn't that just procreative beneficence, and isn't it weird to accept the duty in the pregnancy case and reject it in the selection case?

  So here's what I actually want: what does the practice as it exists presuppose? Is it committed to something like a treatment/enhancement distinction, or to a sufficiency view where you may select to avoid a bad life but there's no reason at all to optimize above the threshold? Does it secretly lean on some claim about the non-identity problem — that we can't benefit a child by creating them, but we can harm them by creating them in a bad state? Does it presuppose that parents have a domain of reproductive discretion that simply runs out at some point, and if so, why exactly there? And I'd really like the distinction between what the practice strictly requires and what it merely fits with: could someone who accepts full-on maximizing procreative beneficence still endorse the clinic's actual rules for second-order reasons — the tech being noisy, worries about where a market in traits ends up, worries about what it says to already-existing disabled kids — or is that person stuck defending something closer to the practice I actually see?

  One more thing, because we invented it halfway through the argument and none of us could work out whether it's a genuine alternative or just the same view in a costume. Call it "the floor rule": you may use any selection technology to minimize the chance that the child ends up below some decent minimum of well-being, and you're encouraged to, but you may not use it to improve a child's prospects once they're already above the floor, even when the improvement is large and basically free. Is the floor rule actually a different theory from the one the clinic is running, or is it just a description of it? Does it dodge the expressivist worry about Down-syndrome screening, or does cutting off at the floor say something just as bad? And concretely: if a clinic swapped its current implicit theory for the floor rule, or for straight procreative beneficence, what would visibly change — who gets funded, what counselors say, whether declining selection starts to look like negligence? Sorry, that's a bit of a jumble, but I'd rather have the mess than a clean answer to the wrong question.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Context:** The user and their reading group are discussing IVF ethics, specifically the discrepancy between accepted medical selection (chromosomes, disease, tissue matching) and rejected non-medical selection (intelligence, height, sex).
      *   **Core Tension:** Why is there a duty to avoid harm during pregnancy (folate, alcohol) but *not* a duty to maximize potential during embryo selection (Procreative Beneficence)?
      *   **Specific Questions/Requests:**
          1.  What does current practice *presuppose*? (Treatment/Enhancement? Sufficiency View? Non-Identity Problem? Reproductive Discretion?)
          2.  Distinction between what practice *requires* vs. what it *fits with*. (Can a maximizing beneficence advocate support current rules for second-order reasons?)
          3.  Evaluation of "The Floor Rule" (minimize chance of falling below a minimum, but don't optimize above it). Is it distinct? Does it dodge expressivist worries?
          4.  Concrete implications: If clinics adopted "The Floor Rule" or "Procreative Beneficence," what would visibly change? (Funding, counseling, negligence?)
      *   **Tone/Style:** Philosophical but grounded, acknowledging the "messiness" (user explicitly prefers the mess to a clean answer to the wrong question). Avoid oversimplification.

  2.  **Initial Brainstorming & Mapping Ethical Frameworks:**

      *   *Procreative Beneficence (Savulescu):* Parents have a moral obligation to select the child, of the possible children they could have, who is expected to have the best life. This challenges current practice.
      *   *Non-Identity Problem (Parfit):* Selecting Embryo A vs. Embryo B creates different people. You can't harm B by choosing A, because B wouldn't exist. But you can harm a *future* child by creating them with a disability (if life is not worth living, or perhaps if it's significantly impaired). Current practice seems to lean on a "harm avoidance" model rather than "benefit maximization."
      *   *Treatment vs. Enhancement:* Medicine fixes pathology; it doesn't upgrade specs. IVF follows the medical model.
      *   *Sufficiency View:* Get the child above a threshold of normal functioning. No duty to go beyond.
      *   *Expressivist Objection:* Selecting against disability sends a message that disabled lives aren't worth living.
      *   *Slippery Slope/Market Concerns:* Eugenics, inequality, commodification of children.

  3.  **Addressing Question 1: What does practice presuppose?**

      *   It's not *just* one thing. It's a hybrid.
      *   *Medical Model:* It presupposes the **Treatment/Enhancement distinction**. Disease = bad (fix it); Height/IQ = neutral/variable (don't touch).
      *   *Harm Principle:* It leans on a version of the **Non-Identity Problem** but modifies it. We accept we aren't "benefiting" the embryo by creating it, but we feel we "harm" the future person if we knowingly create them with a severe genetic condition (when a healthy alternative existed). This is the "wrongful disability" argument.
      *   *Reproductive Liberty:* It presupposes a **domain of discretion**. Parents get to choose *whether* to reproduce, and *basic health*, but the state/clinic draws a line at "social engineering."
      *   *Conclusion:* It's mostly a **Sufficiency View** wrapped in the **Medical Model**.

  4.  **Addressing Question 2: Requirement vs. Fit (Second-Order Reasons):**

      *   Can a Savulescu-style maximizer support current rules? Yes.
      *   *Epistemic Uncertainty:* We don't know which embryo has the "best life." IQ genes are polygenic and noisy. Chromosomal abnormalities are binary and clear.
      *   *Social Externalities:* Unrestricted selection could lead to sex ratios imbalances, reduced acceptance of disability, or class stratification.
      *   *Commodification:* Treating children as products to be spec'd out undermines the parent-child relationship (Sandel's argument).
      *   *So:* A maximizer could say, "Ideally, maximize. Practically, the costs/risks of trying to maximize non-medical traits outweigh the benefits, so we stick to medical necessity." This makes the current practice *pragmatically* defensible even to a *theoretical* maximizer.

  5.  **Addressing Question 3: "The Floor Rule":**

      *   *Is it distinct?* Yes, it's a specific version of Sufficiency. Current practice is a bit fuzzier (medical necessity). The Floor Rule makes the threshold explicit.
      *   *Does it dodge Expressivism?* Not really. Saying "We select against Down Syndrome to keep them above the floor" still implies a life with Down Syndrome is below the floor (or risks being so). The expressive harm remains.
      *   *Comparison:* Current practice is "Prevent Pathology." Floor Rule is "Ensure Minimum Well-being." These overlap but aren't identical. (e.g., A genetic predisposition to depression might not be a "disease" in the embryo stage but might risk falling below the floor).

  6.  **Addressing Question 4: Concrete Implications (The "What Changes" Test):**

      *   *Current Practice:* Fund disease screening. Counselors say "This reduces risk of severe illness." Declining is "Your choice, but risky."
      *   *Procreative Beneficence:* Fund IQ/Height polygenic risk scores (if reliable). Counselors say "This embryo has a 10% higher expected lifetime welfare." Declining could look like *negligence* or moral failure.
      *   *The Floor Rule:* Fund anything that keeps the kid out of the bottom 10%. Counselors say "This ensures a decent minimum." Declining is irresponsible *only if* it risks falling below the floor.
      *   *Visual Change:* The biggest change is in *counseling language* and *liability*. If maximizing is the duty, parents who refuse selection are ethically suspect. If the Floor Rule applies, they are only suspect if they gamble with the floor.

  7.  **Synthesizing and Structuring the Response:**

      *   *Introduction:* Acknowledge the depth of the question. Validate the "messiness."
      *   *Section 1: The Implicit Theory of Current Practice.* (Medical Model + Sufficiency + Harm Avoidance).
      *   *Section 2: The Maximizer's Defense of the Status Quo.* (Epistemic limits + Social Goods). This answers the "Requirement vs. Fit" question.
      *   *Section 3: Dissecting "The Floor Rule".* (Sufficiency vs. Medical Model). Expressivist implications.
      *   *Section 4: The Concrete Stakes.* (Counseling, Funding, Negligence).
      *   *Conclusion:* Summarize the tension. The practice isn't logically pure; it's a compromise between moral ideals and social stability.

  8.  **Refining the Tone:**

      *   Avoid being too academic/dry. Use the user's language ("beyond the pale," "straight-up," "jumble").
      *   Ensure the distinction between *non-identity* and *harm* is clear.
      *   Make sure to address the alcohol/folate comparison (prenatal harm vs. embryo selection). *Self-Correction:* I need to make sure I explain why alcohol is treated differently. Alcohol *harms* an existing fetus (same identity). Selection chooses *which* identity exists. That's the crux of the Non-Identity Problem.

  9.  **Drafting the Content (Iterative refinement):**

      *   *On Alcohol vs. Selection:* This is the key philosophical pivot. Alcohol = Harm to *this* child. Selection = Choice of *which* child. Current practice treats selection against disease as "preventing harm" (conceptually merging the two), but rejects selection for traits as "enhancement."
      *   *On The Floor Rule:* It's a useful heuristic. It clarifies the sufficiency view. But does it change practice? Maybe it expands it to include mental health risks that aren't "diseases."
      *   *On Negligence:* This is the scary part. If beneficence is a duty, refusal is wrong. Current practice protects refusal as "reproductive liberty."

  10. **Final Review against User Prompts:**
      *   Did I answer what practice presupposes? Yes.
      *   Did I distinguish requirement vs. fit? Yes.
      *   Did I analyze the Floor Rule? Yes.
      *   Did I outline concrete changes? Yes.
      *   Did I keep the mess? Yes, avoided a "here is the answer" conclusion.

  11. **Final Polish:** Check for clarity and flow. Ensure the distinction between Savulescu's view and the medical model is sharp. (Proceed to generate output).

  *(Self-Correction during drafting)*: I need to be careful not to conflate "current practice" with "law." The user mentions "where I live... with some approvals." I should speak generally about Western bioethical norms in IVF. Also, ensure I address the "expressivist worry" specifically regarding the Floor Rule.

  *(Final thought)*: The user's comparison of folate/alcohol to embryo selection is the strongest philosophical lever. I need to make sure I explain why the bioethical consensus treats them differently (Identity vs. Non-Identity) even if the outcome (a healthier child) feels similar.

  Okay, ready to write.s
answer: |-
  This is a genuinely excellent set of questions. You've put your finger on the exact friction point where applied bioethics meets moral philosophy. The tension you're feeling—that inconsistency between "don't drink alcohol" (harm reduction for *this* child) and "don't select for height" (benefit maximization for *a* child)—is the engine that drives almost all contemporary debate in reproductive ethics.

  To keep the messiness you asked for, I'm not going to give you a single verdict. Instead, I'll break down the implicit commitments of the current practice, test them against the "Floor Rule" and "Procreative Beneficence," and then look at what would actually break if we swapped the underlying theories.

  ### 1. What does current practice presuppose?

  Current IVF practice isn't running on a single clean ethical theory. It's running on a **hybrid of the Medical Model and a Weak Harm Principle.**

  **The Medical Model (Treatment vs. Enhancement)**
  This is the most visible presupposition. The clinic sees itself as a healthcare provider, not a genetic architect.
  *   **Presupposition:** There is a objective state of "normal species functioning" (Daniels' view). Deviations below this (cystic fibrosis, aneuploidy) are pathologies to be treated. Deviations above this (high IQ, tall stature) are enhancements, which are outside the scope of medicine.
  *   **Why it creates the tension:** This explains why disease screening is okay but IQ screening isn't. But it struggles with your folate comparison. Folate prevents neural tube defects (pathology). Alcohol causes fetal alcohol spectrum disorder (pathology). So why is selecting for IQ different? Because the Medical Model says medicine restores function; it doesn't optimize variables that are already within the normal range.

  **The Weak Harm Principle (and the Non-Identity Problem)**
  This is the philosophical glue holding the Medical Model together.
  *   **Presupposition:** We accept the Non-Identity Problem (Parfit). If you choose Embryo A (healthy) over Embryo B (diseased), you haven't harmed B, because B never exists. *However*, current practice implicitly rejects the idea that you can't have duties regarding *which* person to create.
  *   **The Compromise:** The practice acts as if there is a duty to avoid creating a child who will suffer *significant harm* (a life below a certain threshold of suffering), but no duty to create the child with the *most* benefit.
  *   **Why it creates the tension:** This is where your alcohol comparison bites. When a woman drinks, she harms the *specific* fetus that exists. When she selects an embryo, she chooses *which* fetus exists. The practice fudges this. It treats selecting a diseased embryo as "harming the future child" (conceptually similar to drinking) but treats selecting a low-IQ embryo as "not harming" (because the child will still have a life worth living).

  **Reproductive Liberty as a Side Constraint**
  *   **Presupposition:** Parents have a right to reproductive discretion, but that right runs out when it imposes costs on the child (severe disease) or society (sex ratio imbalances).
  *   **Why it creates the tension:** This is why sex selection is often banned even if it's "harmless" to the child. It's not about the child's welfare; it's about social goods. This implies the clinic isn't actually maximizing child welfare; it's balancing child welfare against social stability.

  ### 2. Requirement vs. Fit: Can a Maximizer endorse the Status Quo?

  You asked if someone who accepts full-on **Procreative Beneficence** (Savulescu's view: parents ought to select the child with the best expected life) could still endorse the clinic's rules.

  **Yes, but only on second-order, pragmatic grounds.**

  A true Procreative Beneficence (PB) advocate believes the *moral principle* is maximization. But they could support the *clinic's rules* for these reasons:

  1.  **Epistemic Noise:** We know which embryos have 46 chromosomes. We do *not* reliably know which embryos will be intelligent or happy. Polygenic risk scores for IQ are currently noisy and population-specific. A PB advocate might say, "We should maximize, but since we can't measure 'best life' accurately without huge error margins, attempting to do so creates more risk than it solves."
  2.  **The Commodification Objection:** If clinics start ranking embryos by "expected life quality," it changes the parent-child relationship from "unconditional acceptance" to "conditional satisfaction." A PB advocate might worry this undermines the family unit, which is a prerequisite for a good life anyway.
  3.  **The Expressivist/Disability Rights Constraint:** If we select for "best," we implicitly devalue existing people who don't have those traits. A PB advocate might accept a ban on non-medical selection to maintain social solidarity with disabled people, even if it means sacrificing some theoretical welfare for the unborn.

  **So:** The current practice *fits* with Procreative Beneficence if you view the rules as **heuristics** for maximizing welfare under conditions of uncertainty and social risk. But the practice *requires* a Sufficiency View. If the practice truly required PB, counselors would be obligated to tell you, "Embryo B has a 5% higher chance of academic success," and they would be ethically remiss if they didn't. They don't do that.

  ### 3. The "Floor Rule": Distinct Theory or Costume?

  Your "Floor Rule" (minimize risk of falling below a decent minimum; no duty to optimize above it) is a **Sufficiency View**.

  **Is it different from current practice?**
  Yes, but subtly.
  *   **Current Practice:** "Prevent Pathology." (Is this a disease?)
  *   **Floor Rule:** "Prevent a Bad Life." (Will this child suffer too much?)

  These overlap heavily, but they diverge on the edges.
  *   *Divergence 1:* A genetic predisposition to severe depression might not be a "disease" in an embryo (it's a probability), but it might risk falling below the Floor. The Floor Rule might allow selection here; current practice might not.
  *   *Divergence 2:* A child with Down Syndrome can certainly live above the "decent minimum" of well-being. The Floor Rule might actually *forbid* selecting against Down Syndrome if the parents are prepared to support the child above the floor. Current practice allows/encourages selecting against it because it counts as a "pathology."

  **Does it dodge the Expressivist Worry?**
  No. In fact, it might make it worse.
  *   **Current Practice:** "We screen for Disease X because it causes suffering." (Implies: Disease X is bad.)
  *   **Floor Rule:** "We screen for anything that risks a life below the Minimum." (Implies: A life with Condition Y is below the Minimum.)
  *   **The Problem:** Both views judge the *life* of the disabled person as "not good enough" to be chosen. The Floor Rule just makes the judgment explicit. It says, "We are not selecting against *you*; we are selecting against a life below the floor." To the disability rights advocate, that is still a judgment that their life is sub-par.

  ### 4. Concrete Implications: What would visibly change?

  If we swapped the implicit theory, the day-to-day reality of the clinic would shift in specific, tangible ways.

  **Scenario A: Adopting Straight Procreative Beneficence (Maximization)**
  *   **Counseling:** Counselors would have to discuss trade-offs. "Embryo A has lower disease risk, but Embryo B has higher polygenic scores for educational attainment. Given your values, B is the beneficent choice."
  *   **Funding:** Insurance might cover IQ/height screening if it correlates with "lifetime welfare" (e.g., higher income = better health outcomes).
  *   **Negligence:** This is the big one. If you have a duty to create the *best* child, declining selection becomes morally equivalent to the woman drinking alcohol. If a parent refuses to screen for a known genetic risk that lowers expected welfare, they could theoretically be liable for "wrongful life" suits. The "right to an open future" becomes a "duty to provide the best open future."
  *   **Inequality:** IVF becomes a luxury good for genetic advantage. The gap between the "genetically wealthy" and "genetically poor" becomes a matter of public health policy.

  **Scenario B: Adopting The Floor Rule (Sufficiency)**
  *   **Counseling:** The conversation shifts from "Is this a disease?" to "Will this child suffer?" This might actually *reduce* screening for conditions that disabled people report living well with (e.g., deafness, dwarfism), provided the parents can guarantee support above the floor.
  *   **Funding:** Coverage would extend to social determinants. If poverty pushes a child below the floor, does the state fund IVF selection *and* a trust fund? (Probably not, but logically it follows).
  *   **Negligence:** Declining selection is only negligent if it risks the floor. Parents have total liberty to choose among embryos that are all safely above the line. This preserves more reproductive liberty than PB.
  *   **The "Mess":** Who defines the Floor? Is it hedonic? Capability-based? Economic? The clinic would need an ethics board to define "Minimum Decent Life," which is politically explosive.

  ### 5. Why the Alcohol Comparison feels unresolved

  You mentioned you can't square the alcohol duty with the selection refusal. Here is the philosophical reason why the system keeps them separate, even if it feels inconsistent:

  *   **Alcohol:** Violates the **Harm Principle** regarding an **existing entity**. The fetus is already on a trajectory. You are making *that* specific future person worse off than they otherwise would have been.
  *   **Selection:** Involves the **Non-Identity Problem**. You are not making *that* child worse off. You are choosing *which* child exists.

  The current practice tries to have it both ways. It treats disease selection *as if* it were harm prevention (ignoring non-identity) to justify screening. But it treats trait selection *as if* non-identity matters (you can't harm a non-existent person by not creating them with high IQ) to forbid enhancement.

  **The Verdict on the Practice:**
  The practice is not logically consistent. It is a **political compromise**. It presupposes that we have some duty to the future child (enough to screen for disease) but not so much duty that we turn children into products (enough to screen for IQ). It relies on the **Treatment/Enhancement distinction** as a proxy for that line, even though that distinction is biologically fuzzy.

  Your reading group's intuition is correct: the inconsistency is real. But it's likely a *necessary* inconsistency. If we moved to full Procreative Beneficence, we risk commodifying life. If we moved to strict Non-Identity (no duties at all), we allow preventable suffering. The "mess" you see is the system absorbing the shock of two incompatible moral demands.

  **To answer your final specific:** If a clinic swapped to the **Floor Rule**, the most visible change would be in **who gets screened**. We might see *less* screening for conditions like Deafness or Dwarfism (if deemed compatible with the Floor) and *more* screening for genetic predispositions to addiction or depression (if deemed risks to the Floor), even if those aren't traditional "diseases." If they swapped to **Procreative Beneficence**, the visible change would be **liability**. Parents who refuse screening would start to look like the woman drinking alcohol: morally negligent. The fact that they don't look like that today proves the clinic is *not* running on Procreative Beneficence, regardless of what the bioethicists say.
