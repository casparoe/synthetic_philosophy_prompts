  # Decision Tree: The Value of Originality in Art

  **Root Question:** Does an original artwork possess value that an indistinguishable forgery cannot have?

  *   **BRANCH A: NO** (Perceptual properties exhaust artistic value)
      *   **LEAF 1: Pure Aestheticism**
          *   *Diagnostic Path:* Perceptual Sufficiency = Yes.
          *   *Most Awkward Commitment:* If a perfect forgery is substituted for a masterpiece without the viewer's knowledge, no artistic value is lost; consequently, the discovery of the deception entails no aesthetic loss, only a psychological adjustment.

  *   **BRANCH B: YES** (Non-perceptual properties contribute to artistic value)
      *   **NODE 1:** Is direct manual involvement by the named artist necessary, or does mediated production (studio assistants, foundry casting, digital fabrication) break the causal chain?
          *   **BRANCH B1: YES** (Direct manual involvement is necessary)
              *   **NODE 2:** Does a restoration replacing roughly ninety-five percent of the original substrate destroy originality?
                  *   **BRANCH B1-i: YES** (Substrate is essential)
                      *   **LEAF 2: Causal-Historical Essentialism (Strict)**
                          *   *Diagnostic Path:* Perceptual Sufficiency = No; Manual Involvement = Yes; Substrate Replacement = Destroys Originality.
                          *   *Most Awkward Commitment:* Conservation is ontologically impossible; any significant repair or material degradation results in the cessation of the original work's existence, rendering the object a mere relic or copy.
                  *   **BRANCH B1-ii: NO** (Substrate is replaceable)
                      *   *Note:* This path is theoretically unstable. If the artist's hand is strictly necessary, material replacement is secondary; however, this combination is typically subsumed by the more permissive causal views in Branch B2.
          *   **BRANCH B2: NO** (Mediated production is permissible)
              *   **NODE 2:** Does a restoration replacing roughly ninety-five percent of the original substrate destroy originality?
                  *   **BRANCH B2-i: YES** (Substrate is essential despite mediation)
                      *   **LEAF 5: Unnamed/Unexplored (Material Relic View)**
                          *   *Diagnostic Path:* Perceptual Sufficiency = No; Manual Involvement = No; Substrate Replacement = Destroys Originality.
                          *   *Diagnosis:* **Unattractive/Incoherent.** This position posits that the physical matter carries the surplus value while denying that the artist's hand is required to sanctify that matter. It reduces the artwork to a geological specimen or holy relic, severing the connection to artistic agency that typically grounds non-perceptual value.
                  *   **BRANCH B2-ii: NO** (Substrate is replaceable)
                      *   **NODE 3:** Does a work algorithmically generated posthumously—trained exclusively on the complete corpus of a deceased artist and executed without human hand—count as an original?
                          *   **BRANCH B2-ii-A: YES** (Counts as Original)
                              *   **LEAF 5: Unnamed/Unexplored (Stylistic Pattern Essentialism)**
                                  *   *Diagnostic Path:* Perceptual Sufficiency = No; Manual Involvement = No; Substrate Replacement = No; Algorithmic Work = Original.
                                  *   *Diagnosis:* **Overlooked/Incoherent.** This view suggests that artistic identity resides solely in stylistic patterns rather than agency. It is incoherent because it grants "originality" to a process lacking intention, effectively collapsing the distinction between the discovery of a natural pattern and the creation of an artwork.
                          *   **BRANCH B2-ii-B: NO** (Counts as Forgery/Other)
                              *   **LEAF 3 & LEAF 4: Convergence Zone (Institutional / Restoration-Tolerant Causal)**
                                  *   *Diagnostic Path:* Perceptual Sufficiency = No; Manual Involvement = No; Substrate Replacement = No; Algorithmic Work = Forgery.
                                  *   *Leaf 3: Institutional/Recognition-Based View.* Value is constituted by art-world status.
                                      *   *Most Awkward Commitment:* If the art-world were to unanimously but mistakenly certify a forgery as authentic, the forgery would *become* the original (or acquire equal value), making artistic ontology subject to collective error.
                                  *   *Leaf 4: Restoration-Tolerant Causal View.* Value is constituted by continuous causal history.
                                      *   *Most Awkward Commitment:* In a "Ship of Theseus" scenario, if the causal chain is maintained by a continuous line of restorers who mistakenly believe they are preserving the original (but are actually replacing parts with non-authorized materials), the view struggles to explain why the chain validates the object despite the break in intentional fidelity.
                                  *   **AMBIGUITY FLAG:** These four diagnostic nodes cannot genuinely separate the Institutional View from the Restoration-Tolerant Causal View. Both deny perceptual sufficiency, both allow mediated production and material replacement, and both reject posthumous algorithmic works as originals. The distinction lies in the *ground* of the surplus value (social status vs. physical history), which requires a diagnostic node regarding the *source* of authority rather than the *conditions* of production.

  ***

  ### Analytic Notes on Taxonomy Construction

  **1. Diagnostic Phrasing**
  The branching nodes are phrased as concrete claims rather than theoretical labels (e.g., "Is direct manual involvement... necessary" rather than "Is the work autographic?"). This ensures that a respondent can navigate the tree based on intuitions about specific cases (restoration, AI, assistants) without prior commitment to a specific school of thought.

  **2. The Convergence of Institutional and Causal-Tolerant Views**
  As flagged in the tree, Leaf 3 and Leaf 4 occupy the same logical space relative to the four mandated nodes. Both views agree that perception is insufficient, that assistants do not invalidate a work, that matter can be replaced, and that AI lacks the requisite agency. The divergence is metaphysical: the Institutionalist argues the art-world *makes* the object original via classification, while the Causal-Tolerant theorist argues the object *is* original via historical continuity. A fifth node asking "Would this object retain its value if all historical records of its production were lost but its status remained?" would separate them, but such a node falls outside the four mandated issues.

  **3. The Unoccupied Logical Space**
  The "Stylistic Pattern Essentialism" leaf (Branch B2-ii-A) represents a genuinely unoccupied position. While some computational aestheticians might argue that style is the defining feature of an artist, few aestheticians are willing to grant *originality* (with its normative weight) to a posthumous algorithm. This position is marked unoccupied because it severs the concept of "work" from "action," rendering the category of forgery unintelligible (if style is all that matters, a perfect stylistic match is by definition original).

  **4. Awkward Commitments**
  The "awkward commitments" listed for each leaf are not necessarily *reductio ad absurdum* refutations, but rather the high-cost intuitions each theory must purchase to maintain consistency. For the Pure Aestheticist, the cost is the irrelevance of authenticity. For the Institutionalist, the cost is the fragility of ontology under the sway of collective mistake. For the Causal-Historical Essentialist, the cost is the ephemerality of the art object in the face of entropy.
