prompt: |-
  I work in digital preservation at a university library — me and three others, and we triage incoming collections in a weekly meeting, 30 to 40 items a session, so realistically each item gets about two minutes and a one-line justification that goes in the record. Our options per item are always the same three: keep a bit-exact image of the original (expensive, and storage is what we're always fighting about), normalise it to something like PDF/A or CSV and drop the original, or discard. We can't do everything, depositors are usually not contactable in ten years, and there's a data-protection clock on some of it, so discard is sometimes right even when we'd rather it wasn't. We also can't go look up format specs for every weird file — the checklist has to work at the level of "what does the outside of this thing tell you".

  I want to steal the frame / outer / inner message distinction from Hofstadter's chapter on the location of meaning — frame message being whatever says "this is a message, decode me", outer message being the instructions or key for how to decode it, inner message being the content once decoded, with the wrinkle that the outer can sometimes be reconstructed from the inner by a clever enough receiver — and turn it into a triage procedure we can run in two minutes on a folder we mostly can't open.

  Give me: the questions in order; what counts as a sufficient answer to each when we can't read the bytes; where it stops with "image everything", where with "normalise and discard the original", where with "discard outright"; and where it hands the decision back to a human because it's a values call about significance rather than a question about recoverability. Three things my team already argues about and that I want it to settle or at least name properly:

  - borrowed frames: cases where the thing that says "this is a message" isn't in the object at all but in its container — the labelled box, the folder name, the file extension, the depositor's email, the disk image it arrived on. Those don't survive the object being seperated from that context, and I think we systematically overestimate how much of our stuff is self-describing.
  - reconstruction bets: when we can't preserve the outer message (dead format, missing key, no documentation) we're really betting that some future receiver can rebuild it from the inner message plus conventions that outlive the carrier. I want the procedure to say when that bet is reasonable and when it's wishful, instead of us deciding by vibes every time.
  - phantom frames: files that look like they carry structure but are noise, padding, or bit-rot. We waste real hours on these and I'd like a cheap test that kills them early.

  Then run it on three things actually on our list: (1) a thousand-odd TIFF scans of handwriten nineteenth-century letters, no transcripts, filenames like IMG_0001.tif; (2) a deceased academic's laptop with a folder of PGP-encrypted files and no key anywhere we can find; (3) about 20,000 Word and Excel files from a government department that convert cleanly to PDF/A and CSV. I expect it to tell me to image (1) and (2) — I most want to see what it does with (3), because my instinct is definately to keep the originals and I suspect the procedure won't let me.

  Be honest about what the procedure can't do. In particular I can already see that it's about whether a message stays recoverable, not about whether it's worth keeping, and that the receiver's future cleverness is the one variable it can't pin down — say how that should show up in our one-line justifications rather than being silently assumed.
reasoning: |-
  Here's a thinking process that leads to the suggested triage procedure:

  1.  **Analyze the Request:**
      *   **User:** Digital preservationist at a university library (team of 4).
      *   **Context:** Weekly triage meeting, 30-40 items/session, ~2 mins/item.
      *   **Constraints:** Storage costs are high. Depositors often unreachable later. Data protection clocks exist. Cannot open every file or read specs. Must rely on "outside" info.
      *   **Goal:** Create a triage procedure based on Hofstadter's Frame/Outer/Inner message distinction to decide between: (1) Bit-exact Image, (2) Normalize + Discard Original, (3) Discard Outright.
      *   **Specific Issues to Address:**
          *   *Borrowed Frames:* Context outside the object (filenames, emails, boxes).
          *   *Reconstruction Bets:* Betting future tech can decode without current outer message.
          *   *Phantom Frames:* Noise/rot/corruption masquerading as structure.
      *   **Output Requirements:**
          *   Ordered questions.
          *   Sufficient answers (without reading bytes).
          *   Decision tree (Image vs. Normalize vs. Discard vs. Human Values).
          *   Application to 3 specific cases (TIFF scans, PGP laptop, Govt Word/Excel).
          *   Honesty about limitations (recoverability vs. significance, future cleverness).
          *   Guidance on the "one-line justification."

  2.  **Deconstruct Hofstadter's Model for Digital Preservation:**
      *   *Frame Message:* "I am a message." (Signal vs. Noise). In digital: File signatures, extensions, directory structures, physical media labels.
      *   *Outer Message:* "Here is how to decode me." (Codec, spec, key, context). In digital: Format specification, software dependency, encryption key, metadata schema.
      *   *Inner Message:* The actual content. (Text, image pixels, data values).
      *   *The Twist:* We often can't see the Inner without the Outer. We often rely on Borrowed Frames (context) to identify the Frame.

  3.  **Drafting the Procedure (The "2-Minute Protocol"):**
      *   *Constraint:* Must be fast. No deep technical analysis.
      *   *Flow:*
          1.  **Frame Check:** Is this definitely a message, or just noise/rot? (Addresses *Phantom Frames*).
          2.  **Borrowed Frame Check:** Where does the "I am a message" signal come from? (Addresses *Borrowed Frames*).
          3.  **Outer Message Check:** Do we have the key to decode this *now*? (Format, Key, Software).
          4.  **Reconstruction Bet:** If we lose the Outer, can the future rebuild it from the Inner? (Addresses *Reconstruction Bets*).
          5.  **Values Check:** If technical recoverability is solved, is there a reason to keep the *specific* carrier? (Human intervention).

      *   *Refining the Questions:*
          *   Q1 (Phantom): Does the container or signature assert structure?
          *   Q2 (Borrowed): If we strip the container/filename, do we know what this is?
          *   Q3 (Outer): Do we hold the decoding mechanism (format spec, key, software)?
          *   Q4 (Reconstruction): If the mechanism decays, is the Inner robust enough to be reverse-engineered?
          *   Q5 (Values): Does the *original* carrier hold evidential value beyond the Inner?

      *   *Defining Thresholds:*
          *   *Image:* Frame/Outer is fragile or unique to the carrier.
          *   *Normalize:* Frame/Outer is standard, Inner is extractable, carrier has no evidential value.
          *   *Discard:* No Frame (Phantom), or Data Protection/Legal override.
          *   *Human:* Ambiguity on significance or high-risk reconstruction bet.

  4.  **Addressing the Specific "Pain Points":**
      *   *Borrowed Frames:* Explicitly ask: "If this file was named `file.bin`, would we know what it is?"
      *   *Reconstruction Bets:* Define "Standard" vs. "Proprietary/Obscure." Standard = Safe bet. Proprietary = Image.
      *   *Phantom Frames:* Check for file signatures (magic numbers) vs. just extensions. If size is 0 or random entropy, discard.

  5.  **Running the Cases:**

      *   **Case 1: 1000 TIFF scans of letters.**
          *   Frame: TIFF (Standard).
          *   Borrowed Frame: Filenames (`IMG_0001`) are weak context. The *content* (images of letters) is the value.
          *   Outer: TIFF spec is stable.
          *   Reconstruction: High. But...
          *   Values: The *scan* is the surrogate for the physical letter. The "Original" here is the digital negative. Normalizing to JPEG/PDF loses fidelity.
          *   *Correction:* Wait, the prompt asks about preserving the *digital* object. If these are scans, the TIFF is the "preservation master." Normalizing to PDF/A loses image quality. So "Image" (keep bit-exact) is right, but not because of format risk, but because the Inner Message *is* the pixel data which degrades on conversion.
          *   *Protocol outcome:* Keep Bit-Exact. Why? Because normalization destroys Inner Message fidelity.

      *   **Case 2: PGP-encrypted files, no key.**
          *   Frame: Encrypted blob.
          *   Outer: MISSING (Key).
          *   Reconstruction Bet: Impossible without key (mathematically).
          *   Decision: Usually Discard? BUT, the prompt says "I expect it to tell me to image (1) and (2)". Why image (2)? Because the *potential* for the key to surface exists (in a box elsewhere), and the Frame (that it *is* PGP) is valuable metadata about the academic's practice.
          *   *Protocol adjustment:* If Outer is missing but Frame is significant (evidence of security practice), Image the Frame + Outer metadata, even if Inner is locked. It's a "Time Capsule" bet.
          *   *Decision:* Image (Bit-exact). Justification: "Frame evidential; Outer recoverable potential."

      *   **Case 3: 20k Word/Excel -> PDF/A/CSV.**
          *   Frame: DOCX/XLSX (Open XML).
          *   Outer: Spec is public, tools are ubiquitous.
          *   Reconstruction: High.
          *   Values: Does the *original* DOCX hold value over PDF/A? Macros? Edit history? Hidden metadata?
          *   *Protocol outcome:* This is the crux. If the Inner Message is the *text/data*, Normalize. If the Inner Message includes *provenance of editing* (track changes, macros), Image.
          *   *User's Instinct:* Keep originals.
          *   *Protocol's likely verdict:* Normalize, *unless* there's evidence of macros/process value.
          *   *Refinement:* The protocol needs to force a check on "Process vs. Content." If it's just final reports -> Normalize. If it's drafts/workflow -> Image. Let's assume "Government Department" implies final records. Protocol should push for Normalize.

  6.  **Refining the "One-Line Justification":**
      *   Needs to capture the *risk* being taken.
      *   Instead of "Format stable," use "Reconstruction bet: Low."
      *   Instead of "Important," use "Frame evidential."

  7.  **Addressing Limitations:**
      *   Recoverability $\neq$ Significance.
      *   Future Cleverness is a variable.
      *   The protocol optimizes for *access*, not *truth*.

  8.  **Final Review against Constraints:**
      *   2 minutes? Yes, questions are binary/quick.
      *   Hofstadter frame? Yes, integrated into Q1-Q3.
      *   Three pain points? Yes, mapped to specific questions.
      *   Cases run? Yes.
      *   Honest about limitations? Yes, in the concluding section.

  9.  **Drafting the Content (Iterative refinement during drafting):**
      *   *Self-Correction on Case 3:* The user suspects the procedure won't let them keep originals. I need to be firm here. If the Inner Message is "the data," and the Outer is "Open XML," and the Frame is "Standard," normalization is the rational preservation choice *unless* the "process" is the record. I will structure the protocol to force that distinction.
      *   *Self-Correction on Case 2:* Why image encrypted data without keys? Because the *existence* of the encrypted file is a historical fact about the depositor. Discarding it erases evidence of their security posture. The "Inner Message" is inaccessible, but the "Frame Message" (that they used PGP) is the record.
      *   *Phantom Frames:* Need a quick entropy/size check. If file size = 0 or matches sector size exactly without header, it's padding.

  10. **Final Polish:** Ensure tone is professional, empathetic to the storage struggle, and rigorous. (Proceed to generate output).

  *(Self-Correction during final output generation)*: Make sure to explicitly define the "Borrowed Frame" check. That's a key requirement. Also, ensure the "Human Values" off-ramp is clear so they don't waste time on technical questions for curatorial problems.

  *(Final check on Hofstadter)*: Ensure the terminology (Frame, Outer, Inner) is used consistently to map to Digital Preservation concepts (Container/Context, Codec/Key, Content).

  *(Final check on Justifications)*: The user wants to know how to write the one-liner to reflect the "future cleverness" variable. I will provide templates.

  Let's build the "Hofstadter Triage Protocol (HTP)".
answer: |-
  Here is the **Hofstadter Triage Protocol (HTP)**, designed for a 2-minute decision window. It translates the Frame/Outer/Inner distinction into digital preservation risks, specifically targeting your three pain points (Borrowed Frames, Reconstruction Bets, Phantom Frames).

  ### The Protocol: 5 Questions in Order

  **Q1. The Phantom Check (Frame Message)**
  *Does the object assert its own structure independent of its name or container?*
  *   **Look for:** File signatures (magic numbers), non-zero size, directory structure.
  *   **Sufficient Answer:** "Yes, header matches extension" OR "No, file is empty/padding/corrupt."
  *   **Fail Condition:** If **No**, mark **Discard**. (This kills phantom frames/rot early).

  **Q2. The Borrowed Frame Check (Context Dependency)**
  *If this object were stripped of its filename, folder path, and depositor email, would we still know what it is?*
  *   **Look for:** Proprietary extensions, generic names (`data.bin`), reliance on external logs to identify format.
  *   **Sufficient Answer:** "Self-describing" (Standard extension + signature) OR "Borrowed" (Relies on folder label/email to identify).
  *   **Fail Condition:** If **Borrowed**, mark **Image**. (Context rots faster than bits; if the frame is borrowed, you must preserve the container that lends it).

  **Q3. The Outer Message Check (Decodability)**
  *Do we currently hold the mechanism to decode the Inner Message, and is that mechanism public?*
  *   **Look for:** Encryption keys, proprietary software requirements, obscure formats.
  *   **Sufficient Answer:** "Open Spec" (PDF, TIFF, CSV, DOCX) OR "Locked/Proprietary" (Encrypted, custom DB, obsolete CAD).
  *   **Fail Condition:** If **Locked**, move to Q4. If **Open**, move to Q4.

  **Q4. The Reconstruction Bet (Future-Proofing)**
  *If the current decoding mechanism vanishes, can the Inner Message be reverse-engineered from the bits alone?*
  *   **Look for:** Complexity. Is it plain text/standard pixels (High recoverability) or compiled code/encrypted blob/complex macro logic (Low recoverability)?
  *   **Sufficient Answer:** "High" (Human-readable structure, standard compression) OR "Low" (Obfuscated, encrypted, proprietary logic).
  *   **Fail Condition:** If **Low**, mark **Image**. If **High**, mark **Normalize**.

  **Q5. The Evidential Check (Values Call)**
  *Does the specific carrier or original format hold evidential value beyond the content?*
  *   **Look for:** Track changes, macros, edit history, artistic intent of the file format itself.
  *   **Sufficient Answer:** "Content Only" (The text/image is the record) OR "Process Evidential" (The *way* it was made is the record).
  *   **Fail Condition:** If **Process Evidential**, mark **Human Review**. If **Content Only**, accept Q4's decision.

  ---

  ### Decision Matrix

  | Path | Decision | Rationale |
  | :--- | :--- | :--- |
  | **Q1 Fail** | **Discard** | Phantom Frame. It is noise, not a message. |
  | **Q2 Borrowed** | **Image** | Borrowed Frame. Separating object from context destroys the Frame Message. |
  | **Q3 Locked + Q4 Low** | **Image** | Failed Reconstruction Bet. Future cleverness cannot overcome encryption/obscurity. |
  | **Q3 Open + Q4 High + Q5 Content** | **Normalize** | Safe Reconstruction Bet. Inner Message is robust; storage cost of original outweighs risk. |
  | **Q5 Process** | **Human Review** | Values Call. Technical recoverability is solved, but curatorial significance is ambiguous. |

  ---

  ### The One-Line Justification
  You cannot hide the "future cleverness" variable. Your metadata field for "Preservation Action" should include a **Risk Tag** derived from Q4.

  *   **Instead of:** "Normalized to PDF/A."
  *   **Use:** "Normalized [Reconstruction Bet: High]."
  *   **Instead of:** "Bit-exact image kept."
  *   **Use:** "Imaged [Outer Message: Proprietary/Locked]."
  *   **Instead of:** "Discarded."
  *   **Use:** "Discarded [Frame Message: Phantom/Corrupt]."

  This forces the "bet" into the record. If the bet fails in 20 years, the log shows *why* you took it.

  ---

  ### Running the Protocol on Your Three Cases

  #### Case 1: 1,000 TIFF scans of 19th-century letters (`IMG_0001.tif`)
  *   **Q1 (Phantom):** **Pass.** TIFF headers present, file sizes consistent with images.
  *   **Q2 (Borrowed):** **Pass (Self-describing).** TIFF is standard. However, the *sequence* relies on filenames. If filenames are generic (`IMG_0001`), the *order* is a Borrowed Frame.
  *   **Q3 (Outer):** **Open.** TIFF spec is stable.
  *   **Q4 (Reconstruction):** **High.** Pixels are pixels.
  *   **Q5 (Evidential):** **Process Evidential.** These are *surrogates* for physical letters. The TIFF is the "preservation master." Converting to PDF/A degrades the image quality (the Inner Message). The "Process" here is the fidelity of the scan.
  *   **Decision:** **Image (Bit-Exact).**
  *   **Justification:** `Imaged [Inner Message Fidelity: Lossy Conversion Risk].`
  *   **Why:** Not because the format is at risk, but because normalization destroys the Inner Message quality. The protocol catches this at Q5.

  #### Case 2: Deceased Academic's Laptop (PGP-encrypted, no key)
  *   **Q1 (Phantom):** **Pass.** Files exist, have size, have PGP headers.
  *   **Q2 (Borrowed):** **Pass.** PGP signature identifies the Frame.
  *   **Q3 (Outer):** **Locked.** No key.
  *   **Q4 (Reconstruction):** **Low.** Mathematically impossible to brute force modern PGP.
  *   **Q5 (Evidential):** **Frame Evidential.** The *content* is lost, but the *fact* that they used PGP is historical data about their practice/security posture.
  *   **Decision:** **Image (Bit-Exact).**
  *   **Justification:** `Imaged [Frame Message: Evidential of Practice / Outer Message: Lost].`
  *   **Why:** You are not preserving the Inner Message (which is gone); you are preserving the Frame Message (that encryption existed). Discarding erases evidence of their digital hygiene. The "Reconstruction Bet" is actually a "Key Recovery Bet" (someone finds the key in a physical notebook later).

  #### Case 3: 20,000 Govt Word/Excel files (Convert cleanly to PDF/A/CSV)
  *   **Q1 (Phantom):** **Pass.** Valid Office Open XML.
  *   **Q2 (Borrowed):** **Pass.** Extensions and headers match.
  *   **Q3 (Outer):** **Open.** ISO standards for DOCX/XLSX exist.
  *   **Q4 (Reconstruction):** **High.** Text and tabular data are highly recoverable from Open XML even if software vanishes.
  *   **Q5 (Evidential):** **Content Only.** (Crucial Branch). Are these final reports or drafts?
      *   *If Final Reports:* **Normalize.** The Inner Message is the text/data. The DOCX wrapper adds no value.
      *   *If Drafts/Workflow:* **Human Review.** Track changes and comments constitute "Process Evidential."
  *   **Decision:** **Normalize (assuming final records).**
  *   **Justification:** `Normalized [Reconstruction Bet: High / Process Evidential: None].`
  *   **Why:** Your instinct wants to keep them because "originals feel safer." The protocol forces you to admit that for *final* text/data records, the DOCX container is not the record; the text is. Keeping 20k DOCX is paying for a Reconstruction Bet you don't need to make.
      *   *Caveat:* If you suspect macros or hidden data, Q5 triggers **Human Review**. Do not skip Q5.

  ---

  ### What This Procedure Cannot Do (The Honest Bit)

  **1. Recoverability $\neq$ Significance**
  This protocol optimizes for *decodability*, not *value*. It will tell you to keep a bit-exact image of a corrupted spreadsheet because it's technically "risky," even if the data inside is worthless. It will tell you to normalize a brilliant born-digital poem to text if the formatting isn't deemed "evidential."
  *   **Fix:** Q5 is your escape hatch. If the technical answer feels wrong, it's because the *value* isn't technical. Hand it to the curator.

  **2. The "Future Cleverness" Variable**
  Q4 asks you to guess how clever future archivists will be. You are betting on standards (PDF/A) outliving proprietary blobs. This is a gamble.
  *   **Fix:** The **Risk Tag** in the justification. By writing `[Reconstruction Bet: High]`, you are documenting the gamble. If the bet fails, your successors know you weren't negligent; you were optimistic based on the standards of your time.

  **3. The Borrowed Frame Trap**
  You mentioned you systematically overestimate self-describing objects. This protocol assumes you can spot a Borrowed Frame in 10 seconds. Sometimes you can't.
  *   **Fix:** Default to **Image** if unsure on Q2. Storage is expensive, but context loss is permanent. It is better to image a self-describing file by mistake than to normalize a Borrowed Frame file and lose the key to what it is.

  **4. Data Protection Clocks**
  The protocol does not account for GDPR or legal hold.
  *   **Fix:** This triage is for *technical* viability. Legal/ethical discard must happen *before* Q1 or as an override at any stage. If the clock says "destroy," the protocol doesn't matter.

  ### Summary for your Team
  Use this to stop arguing about "vibes."
  *   Arguing about format stability? **Check Q3/Q4.**
  *   Arguing about context? **Check Q2.**
  *   Arguing about whether "it feels important"? **Check Q5.**
  *   Arguing about whether it's even a file? **Check Q1.**

  If you can't answer the question in 30 seconds, the decision is **Human Review**. Do not spend 10 minutes debating a 2-minute triage item.
