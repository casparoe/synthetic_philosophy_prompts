  4.  **Developing the Content (Committing to Positions):**

      *   *Concessions:* Admit this isn't about *neural* syntax yet, just functional. Admit the test is preliminary. Admit "addressing" is a functional metaphor.
      *   *The Single Reply:* The distinction between *similarity* and *selection*. If similarity can't explain systematic generalization in the test, the thesis holds water functionally.
      *   *Weakest Point:* Step 3 (Need $\to$ Has). Just because a system *needs* addressing doesn't mean the brain *uses* discrete tokens. It could use continuous attractors. *Defense:* Point to the ML results as an existence proof that discrete-like binding is required for this specific generalization, regardless of substrate.
      *   *Cutting the Thesis:* Drop the claim that this is *the* format for *all* structured states. Limit it to "task-specific selection among combinatorial options."

  5.  **Drafting the Responses (Voice & Tone):**
      *   *ML Voice:* "What's your baseline?" "Is this just OOD generalization?"
