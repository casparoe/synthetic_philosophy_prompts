answer: |-
  I showed the hand exactly how to guide,
  trusting the load was held by some frayed tether.
  But when the wind shifted, the calm did flee,
  leaving no trace of method or of reason.
  The result was right, the measurement seemed true,
  until the context changed and we ceased to know.

  They claimed to know the torque required by feel,
  enough to guide the steel through rising heat.
  The gauge read green, a signal seemingly true,
  yet nothing bound the skill to any tether.
  A guess that works lacks weighty cause or reason,
  and when the stress arrived, the confidence did flee.

  Like statues carved with legs so they might flee,
  if left unchained, we cannot say we know.
  Unless the mind can walk through every reason,
  the hand is lost and fails to guide the cut.
  We need a chain, a logical strong tether,
  to keep the answer fixed and standing true.

  In nearby worlds, the match is not quite true,
  the success rates vanish, they flee the scene.
  Only the bound belief holds fast its tether,
  allowing the master to claim they know.
  It is the why that helps the how to guide,
  not just the habit formed without a reason.

  What account can serve as sufficient reason,
  to say the work is safe and solid true?
  If luck alone was what began to guide,
  then certainty will turn its back and flee.
  We stumble through the dark and think we know,
  until we feel the slack within the tether.

  Is there a knot tight enough for this tether,
  or does the logic fail to find a reason?
  We act as if we certainly do know,
  but is the ground beneath us actually true?
  When shadows shift, the certainty will flee,
  leaving no lamp to show us how to guide.

  Still we seek a tether for our reason,
  hoping to know if what we hold is true,
  lest the right answer flee where none can guide.
