prompt: |-
  I work for a city council and we're constantly stuck between the enviromental justice coalition and the old-school union on every development deal. I read this idea about applying gains-from-trade logic to moral disagreement — call it moral barter — where sides swap concessions that are cheap for them but expensive for the other, except the currency is symbolic values not money. Like the union gives up a carbon-offset pledge that costs them nothing practically but means a lot to the coalition, and in return gets ironclad local-hiring guarantees. I need a reusable decision procedure my team can actually run in mediation sessions: the ordered questions, what answers are good enough, where we kill the deal outright, and where we punt to the council chair because its pure values conflict not something we can measure. Apply it to two live proposals: a solar farm on land the union calls heritage-adjacent but that the coalition wants for climate reasons, and a warehouse deal where the coalition gets a veto in exchange for accepting a smaller green-space footprint elsewhere. Also tell me where this procedure is gonna misfire or give me an answer I hate, and be honest about what it cant do. Write it casual, like you're emailing a colleague — a typo or two is fine.
reasoning: |-
  Here's a thinking process that leads to the suggested email:

  1.  **Analyze the Request:**
      *   **User:** City council staffer.
      *   **Problem:** Stuck between Environmental Justice (EJ) Coalition and Old-School Union on development deals.
      *   **Concept:** "Moral Barter" (gains-from-trade logic applied to moral/symbolic values). Swapping concessions that are low-cost/high-value for opposite sides.
      *   **Task:** Create a reusable decision procedure (mediation tool) with ordered questions, pass/fail criteria, kill switches, and escalation points.
      *   **Application:** Apply to two live proposals (Solar Farm on heritage-adjacent land vs. Climate need; Warehouse deal with EJ veto vs. Green-space footprint).
      *   **Critique:** Identify where the procedure will misfire, give hated answers, or fail (limitations).
      *   **Tone:** Casual email to a colleague (typos allowed/encouraged).

  2.  **Deconstruct "Moral Barter" in this Context:**
      *   It's not about money; it's about *symbolic capital* and *political cover*.
      *   Union cares about: Jobs, seniority, local hiring, tangible benefits for members, respecting history/heritage.
      *   EJ Coalition cares about: Climate action, pollution reduction, community voice/veto power, green space, avoiding displacement.
      *   *The Swap:* Union gives climate win (cheap for them, expensive for EJ? No, expensive for EJ to give up). Wait, the prompt says: "Union gives up a carbon-offset pledge that costs them nothing practically but means a lot to the coalition." Actually, usually, the Union *opposes* things that cost jobs. So if the Union *supports* a climate thing that doesn't hurt jobs, that's a win for EJ. If EJ supports a hiring mandate that doesn't hurt the environment, that's a win for Union.
      *   *Correction on Prompt's Example:* The prompt says "Union gives up a carbon-offset pledge... in return gets local-hiring." This implies the Union was *blocking* the offset pledge? Or the Union is agreeing to *not fight* the offset pledge? Let's interpret "Moral Barter" as: Side A accepts a loss on Value X (which they care little about) to gain a win on Value Y (which they care a lot about), while Side B does the reverse.

  3.  **Drafting the Procedure (The "Moral Barter Protocol"):**
      *   Needs to be step-by-step.
      *   Needs "Kill Switches" (Non-negotiables).
      *   Needs "Escalation" (When values are incommensurable).
      *   *Step 1: Map the Sacred Values.* What can't be touched?
      *   *Step 2: Identify Low-Cost Concessions.* What looks big but costs little?
      *   *Step 3: The Swap.*
      *   *Step 4: Verification.* Does this actually hold water?

  4.  **Applying to Live Proposals:**
      *   *Proposal 1: Solar Farm.*
          *   Conflict: Heritage/Union (Land use) vs. Climate/EJ (Green energy).
          *   Barter: Union gets heritage marker + maintenance jobs (high value, low cost to EJ). EJ gets the solar farm + community ownership stake (high value, low cost to Union).
      *   *Proposal 2: Warehouse.*
          *   Conflict: EJ Veto vs. Green Space.
          *   Barter: EJ gets veto on *operations* (pollution/noise) rather than *existence*. Union/Dev gets reduced green space to build more warehouse (jobs).
          *   *Wait, is this ethical?* Giving a veto is huge. Reducing green space is huge. This is the tricky one.

  5.  **Identifying Failure Modes (The "Honest Truth"):**
      *   Zero-sum games (one side *must* lose).
      *   Trust deficits (they won't believe the concession is real).
      *   Principal-Agent problems (leaders agree, members revolt).
      *   "Sacred Values" that aren't actually tradable (e.g., existential threat).

  6.  **Setting the Tone:**
      *   Casual, internal email.
      *   "Hey [Name],"
      *   Some shorthand.
      *   Maybe a typo or two (e.g., "enviromental", "gona").
      *   Direct and pragmatic.

  7.  **Drafting - Section by Section:**

      *   *Subject Line:* Needs to sound internal. "Moral Barter Protocol / Live Deals"
      *   *Intro:* Acknowledge the headache. Validate the "Moral Barter" idea.
      *   *The Protocol:* Break it down into 4 steps. Add the "Kill" and "Punt" criteria.
      *   *The Applications:* Run the Solar and Warehouse deals through the protocol.
      *   *The Risks:* Where does this blow up? (Trust, Sacred Values, Optics).
      *   *Sign-off:* Casual.

      *(Self-Correction during drafting)*: Make sure I don't sound *too* cynical. The goal is resolution, not manipulation. But acknowledge the political reality.
      *Typo Check:* "enviromental" (in prompt, maybe repeat one), "gona", "recieve". Let's keep it professional but relaxed. I'll add a couple of minor slips to feel authentic.

      *Refining the "Moral Barter" Logic:* The core insight is *asymmetric valuation*.
      *   Union values: Jobs, Seniority, Respect for History.
      *   EJ values: Air quality, Community Control, Climate Mitigation.
      *   *Solar Deal:* Union hates losing land. EJ loves solar.
          *   Trade: Union gets "Heritage Maintenance Contract" (Jobs + Respect). EJ gets Solar + "Community Benefit Agreement".
      *   *Warehouse Deal:* EJ wants veto. Dev/Union wants space.
          *   Trade: EJ gets "Pollution Veto" (not project veto). Dev gets "Green Space Reduction" (but maybe adds green roof?).
          *   *Wait, the prompt says:* "Coalition gets a veto in exchange for accepting a smaller green-space footprint elsewhere." I need to analyze *that* specific trade. Is it valid?
          *   *Analysis:* Veto is power. Green space is amenity. If the green space is unused but the veto stops pollution, EJ wins. If the warehouse brings jobs, Union wins.

      *Refining the "Kill/Punt" criteria:*
      *   Kill: If a concession violates a core legal mandate or creates liability.
      *   Punt: If the trade requires changing city code or if the "value" is purely ideological with no practical lever.

  8.  **Final Polish:** Check against constraints.
      *   Casual tone? Yes.
      *   Decision procedure included? Yes.
      *   Applied to two proposals? Yes.
      *   Failure modes included? Yes.
      *   Typos? A few strategic ones.

      *(Final thought on the "Moral Barter" term)*: It's a bit academic. I'll refer to it as the "Value-Swap Protocol" in the email to make it sound more actionable, but acknowledge the user's term. Actually, stick to their term "Moral Barter" so they know I'm listening.

      *(Wait, one more thing)*: The prompt asks for "ordered questions, what answers are good enough, where we kill the deal outright, and where we punt". I need to make sure that section is very structured.

      Let's write it.

      *Subject:* Re: The Union/EJ deadlock & that "Moral Barter" idea
