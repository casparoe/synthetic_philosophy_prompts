      *   The Protocol: 5 Steps.
      *   The Kill/Punt lines.
      *   The Solar Case.
      *   The Warehouse Case.
      *   The "Where it breaks" section.
      *   Sign off.

      *Typos to insert:* "enviromental" (maybe), "definate", "seperate", "alot". I'll keep it subtle so it doesn't look like AI trying too hard to be human, just natural haste.

      *Wait, check the Warehouse deal again:* "Coalition gets a veto in exchange for accepting a smaller green-space footprint elsewhere."
      *   My analysis needs to be critical. Is a veto *too* much power? Does it violate city authority? That's a good "Punt" candidate.

