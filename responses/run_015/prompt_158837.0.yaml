answer: |-
  Your intuition is correct: the phrase "assume you're typical" is not a single argument but a placeholder for a specific choice of **anthropic principle** and **reference class**. The strength of your opponent's conclusion depends entirely on which specific thesis fills that placeholder. Most readings are either trivial (and support no conclusion), circular (beg the question), or rely on controversial anthropic assumptions that cut both ways.

  Here is a menu of the distinct precise theses your opponent could be expressing, ordered from trivial platitude to strong, contested metaphysical claims.

  ### 1. The Indexical Platitude
  *   **Thesis:** "I observe that I am currently a biological human."
  *   **Status:** **Trivial.** This is simply a report of your immediate evidence.
  *   **Delivers Conclusion?** **No.** A fact about your current state does not logically entail a probability distribution over future states. (Example: Finding yourself in the first car ever made does not prove no more cars will be built.)
  *   **Critique:** This is the bare datum. To get from here to your opponent's conclusion requires a bridging principle about how observers are sampled.

  ### 2. The Restricted Reference Class (The Circular Reading)
  *   **Thesis:** "Assume you are typical among *biological humans*."
  *   **Status:** **Substantive but Circular.** This defines the pool of "minds that count" as *only* biological minds.
  *   **Delivers Conclusion?** **No.** If you define the reference class as "biological humans," then digital minds are excluded from the class by definition. You cannot use a definition that excludes digital minds to prove that digital minds are unlikely to exist or matter.
  *   **Critique:** **Circular.** It assumes the very thing in dispute (that the relevant population is biological) to conclude that the non-biological population is negligible. It makes the hypothesis "trillions of digital minds exist" irrelevant to the sampling process, rendering the argument vacuous.

  ### 3. The Self-Sampling Assumption (SSA)
  *   **Thesis:** "Assume you are a random sample from the set of all *actual* observers in your reference class."
  *   **Status:** **Substantive and Contested.** This is the core of the "Doomsday Argument." It treats your birth rank as a random draw from the total number of humans who will ever live.
  *   **Delivers Conclusion?** **Yes.** If the "reference class" includes future digital minds, and there are trillions of them, the probability of you being one of the few early biological humans is tiny. Therefore, SSA suggests the hypothesis with trillions of future minds is unlikely.
  *   **Critique:** **Contested.** SSA is philosophically controversial because it implies we can learn about the external world (the future population) solely from our existence. It also leads to the "Adam and Eve" paradox (where improbable events become likely if they result in fewer total observers). Furthermore, it relies on a specific, debatable choice of reference class (see Thesis 5).

  ### 4. The Observer-Moment Variant (SSA+)
  *   **Thesis:** "Assume you are a random sample from all *actual observer-moments* (temporal slices of consciousness)."
  *   **Status:** **Substantive and Contested.** This refines SSA by counting moments of experience rather than whole persons.
  *   **Delivers Conclusion?** **Yes, more strongly.** Digital minds could potentially run at speeds thousands of times faster than biological humans. If a digital mind lives for 10 subjective years, it might generate millions of times more "observer-moments" than a biological human in the same clock-time. Under this thesis, finding yourself as a slow, biological observer-moment is even stronger evidence against a future dominated by fast digital minds.
  *   **Critique:** **Contested.** This inherits all the problems of SSA (Thesis 3) but amplifies them. It also raises the difficult metaphysical question of how to individuate "moments" of consciousness across different substrates.

  ### 5. The Self-Indication Assumption (SIA)
  *   **Thesis:** "Assume you are a random sample from the set of all *possible* observers, weighted by the probability of their world existing."
  *   **Status:** **Substantive and Contested.** This is the primary rival to SSA. It holds that you are more likely to exist in a world with more observers in it, simply because there are more "slots" for you to occupy.
  *   **Delivers Conclusion?** **No. It Reverses It.** SIA cancels out the Doomsday reasoning. While SSA says "It's unlikely I'm early in a big population," SIA says "I'm more likely to exist at all in a big population." Under SIA, finding yourself as a biological human is compatible with a vast digital future, because the vast future makes your existence *more* probable, not less.
  *   **Critique:** **Substantive.** If SIA is correct, your opponent's argument is false. However, SIA leads to the "Presumptuous Philosopher" problem (favoring hypotheses with infinite observers regardless of physical evidence). You and your opponent are effectively stuck on which anthropic principle (SSA or SIA) is correct; neither is a settled platitude.

  ### 6. The Evidence-Relative Reference Class
  *   **Thesis:** "Assume you are typical among beings with *evidence relevantly like yours*."
  *   **Status:** **Ambiguous (Collapses into Triviality or SSA).**
      *   *Reading A:* If "evidence like mine" includes "I have a biological body," the class contains only biologicals. (Collapses into Thesis 2: Circular).
      *   *Reading B:* If "evidence like mine" means "I am a conscious observer," the class includes digital minds. (Collapses into Thesis 3 or 5: SSA or SIA).
  *   **Delivers Conclusion?** **Depends.** Only delivers the conclusion if you adopt Reading A (which is circular) or Reading B + SSA (which is contested).
  *   **Critique:** **Self-Defeating/Unstable.** This attempts to dodge the reference class problem but fails. You cannot include "biological" in the evidence without begging the question against digital minds, nor can you exclude it without admitting digital minds are in the reference class.

  ### 7. The Normative Conflation
  *   **Thesis:** "Assume your *moral weight* is typical among all minds."
  *   **Status:** **False (Category Error).** This confuses an epistemic claim (what is likely to exist) with a normative claim (what matters).
  *   **Delivers Conclusion?** **No.** Even if biological humans are a rounding error numerically (epistemic), one could argue they have higher moral weight per capita (normative).
  *   **Critique:** **Category Error.** Your opponent moved from "we are numerically rare" to "don't spend resources on them." This leap requires the hidden premise that "numerical rarity implies moral insignificance," which is a normative claim, not an anthropic one.

  ### Summary of the Dialectic
  Your opponent's argument works **only** if you accept **Thesis 3 (SSA)** with a **broad reference class (Thesis 6, Reading B)**.

  *   If you accept **Thesis 5 (SIA)**, the argument fails (the large future becomes *more* likely).
  *   If you accept **Thesis 2 (Restricted Class)**, the argument is circular (it assumes digital minds don't count to prove they don't exist).
  *   If you accept **Thesis 7 (Normative)**, the argument is a non-sequitur (numbers don't equal value).

  Since SSA (Thesis 3) is a highly contested principle in philosophy and decision theory—not a platitude—your opponent cannot assert "assume you're typical" as if it were a neutral rule of reasoning. They are asking you to accept a specific, controversial solution to the reference class problem that happens to favor their conclusion.
