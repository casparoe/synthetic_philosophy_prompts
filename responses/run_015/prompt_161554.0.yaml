  # Joint Statement on Interpersonal Utility Comparisons and Budget Allocation

  ### 1. Agreed Claims
  1.  **Budgetary Constraint:** The committee must allocate a fixed budget between two distinct patient groups without the possibility of expanding total resources.
  2.  **Primary Objective:** The allocation aim is to maximize aggregate patient welfare, though we differ on how "aggregate welfare" is constituted.
  3.  **Empirical Observation:** In the pilot run of the Round-Trip Protocol (A compares A/B, B compares A/B, C mediates), a residual asymmetry of approximately one-third persisted despite calibration.
  4.  **Correlation:** This residual asymmetry correlates positively with differences in the affective range of the subjects involved.
  5.  **Decision Necessity:** A budgetary decision must be rendered despite the current lack of consensus on the metaphysical status of interpersonal comparisons.
  6.  **Transparency:** The rationale for the final allocation must explicitly disclose the methodological assumptions regarding utility measurement.
  7.  **Commitment to Evidence:** Both parties agree to update their confidence levels based on the outcomes of further protocol testing described below.

  ### 2. Statement of Disagreement and Proposed Tests

  | Crux | Accepted Test or Case | Sceptic's Prediction (Ordinalist) | Constructivist's Prediction (Cardinalist) | Whose View the Result Would Move, and Why |
  | :--- | :--- | :--- | :--- | :--- |
  | **The Ontology of Comparison:** Is an interpersonal utility comparison a discovery of fact or a normative stipulation? | **Extended Round-Trip Protocol:** Subjects A and B undergo intensive shared experiential training to align affective ranges, then repeat the Round-Trip with mediator C. | The residual asymmetry will persist regardless of shared experience, proving the comparison is structurally impossible (agent-relative). | The residual asymmetry will converge toward zero as affective ranges align, proving the comparison is a measurable fact approximated by protocol. | **Constructivist:** If asymmetry persists, the claim that a "fact of the matter" exists is undermined.<br>**Sceptic:** If asymmetry vanishes, the claim that comparison is *impossible* is undermined. |
  | **The Interpretation of Error:** Is the Round-Trip gap measurement noise or structural impossibility? | **Variance Analysis:** Measure whether the residual asymmetry scales linearly with affective difference or remains constant across diverse pairs. | The gap will scale systematically with affective difference, indicating a category error in comparing distinct scales. | The gap will behave as random noise reducible by calibration, indicating a technical limitation rather than a structural barrier. | **Constructivist:** If the gap is systematic/structural, it cannot be treated as calibratable noise.<br>**Sceptic:** If the gap is random/reducible, it suggests a common scale exists. |
  | **Policy Implication:** How to allocate under uncertainty? | **Allocation Rule:** Apply the protocol results to the current budget split. | Adopt a normative rule (e.g., egalitarian split) because the empirical basis for weighting is invalid. | Adopt a weighted split based on the best-available protocol estimate, treating residual error as acceptable risk. | **Both:** This moves the practical outcome. If the Sceptic is right, the Constructivist's allocation is unjustified. If the Constructivist is right, the Sceptic's allocation leaves welfare on the table. |

  ### 3. Status of Dispute

  ```json
  {
    "settled": [
      "The budget is fixed and must be divided between the two patient groups.",
      "The pilot Round-Trip Protocol showed a residual asymmetry of roughly one-third.",
      "The asymmetry is systematically larger when subjects differ in affective range.",
      "Transparency about methodological assumptions is required for the final decision."
    ],
    "contested": [
      "Whether interpersonal utility comparisons describe mind-independent facts.",
      "Whether the Round-Trip asymmetry is reducible noise or structural impossibility.",
      "Whether budget allocation should follow empirical estimates or normative rules under uncertainty."
    ],
    "merely_verbal": [
      "Whether to label the protocol output as 'measurement' or 'stipulation' if operational outcomes remain identical."
    ],
    "unmoved_by_this_collaboration": [
      "The fundamental ethical weight each member assigns to the welfare of the respective patient groups prior to measurement."
    ]
  }
  ```
