answer: |-
  ### Executive Stance: Methodological Symmetry

  **Position:** Methodological symmetry—the claim that fringe and mainstream historical narratives deserve identical *evidential standing* at the point of acquisition—has **no legitimate place** in this decision tree.

  **Defense:** Methodological symmetry originates in the Strong Program of the Sociology of Scientific Knowledge (SSK). Its purpose is to explain *why* actors hold beliefs (causality), not to determine *which* beliefs correspond to reality (validity). An encyclopedia is a curatorial project dedicated to established knowledge, not a sociological study of belief formation. Granting evidential symmetry to a claim that has failed falsification tests while accepting a claim that has passed them is not neutrality; it is a category error that misleads the reader about the reliability of information. Procedural fairness (giving every manuscript a reading) is required; evidential symmetry (treating a debunked theory as equal to a consensus theory) is not.

  ***

  ### The Demarcation & Reliability Protocol (DRP)

  **Purpose:** To evaluate submissions proposing radical chronological revision for inclusion in a general-reference encyclopedia.
  **Philosophical Grounding:** Critical Rationalism (Popper), Research Programmes (Lakatos), and Social Epistemology (Longino).

  #### Decision Tree

  **Q1: Falsifiability & Risk**
  *   **Question:** Does the proposal specify conditions under which it would be abandoned? Does it expose itself to empirical risk, or does it explain away all counter-evidence?
  *   **Sufficient Answer for Progress:** The author identifies specific data points (e.g., a specific radiocarbon date, a specific textual reference) that, if proven, would invalidate their thesis.
  *   **Insufficient Answer:** Counter-evidence is dismissed as "planted," "misdated," or part of a "conspiracy" without independent proof of the tampering.
  *   **Outcome if Insufficient:** **REJECT.** (Flag: *Fact-based demarcation*)
  *   **Value/Fact Flag:** **Fact.** Falsifiability is a logical property of the claim, not a matter of editorial preference.

  **Q2: Independence of Evidence**
  *   **Question:** Is the evidence cited independent of the theory's assumptions? (e.g., Does the statistical analysis rely on data points selected *because* they fit the pattern?)
  *   **Sufficient Answer for Progress:** Data sets are pre-registered, drawn from blind samples, or verified by third-party databases not controlled by the author.
  *   **Insufficient Answer:** Evidence is circular (e.g., "This text is late because it matches this other text, which is late because it matches this one").
  *   **Outcome if Insufficient:** **REJECT.** (Flag: *Fact-based demarcation*)
  *   **Value/Fact Flag:** **Fact.** Circular reasoning is a logical fallacy.

  **Q3: Consensus & Peer Scrutiny**
  *   **Question:** Has the claim undergone peer review in a journal with established impact factors in the relevant discipline (history, archaeology, physics)?
  *   **Sufficient Answer for Progress:** Published in a indexed, peer-reviewed journal; or, if new, submitted to a pre-print server with open commentary.
  *   **Insufficient Answer:** Published only in monographs, self-published works, or journals known for ideological advocacy rather than methodological rigor.
  *   **Outcome if Insufficient:** **ESCALATE-TO-EXPERT.** (Do not Reject yet; external review required). (Flag: *Value-based gatekeeping*)
  *   **Value/Fact Flag:** **Value.** Relying on "established" journals privileges existing power structures. This is a pragmatic value judgment regarding reliability, not an absolute guarantee of truth.

  **Q4: Explanatory Power vs. Ad Hoc Complexity (Lakatosian Check)**
  *   **Question:** Does the revision solve more anomalies than it creates? Does it require a "protective belt" of auxiliary hypotheses to survive?
  *   **Sufficient Answer for Progress:** The new chronology simplifies the historical model or resolves specific, acknowledged inconsistencies in the mainstream model without inventing new, unverified entities (e.g., global conspiracies, lost technologies).
  *   **Insufficient Answer:** The claim requires assuming massive, unrecorded social collapses, global forgery campaigns, or unknown technologies to make the data fit.
  *   **Outcome if Insufficient:** **REJECT.** (Flag: *Value-based demarcation*)
  *   **Value/Fact Flag:** **Value.** Determining what counts as "too complex" or "ad hoc" involves a judgment call on parsimony.

  **Q5: The Stability Threshold**
  *   **Question:** If the claim is accepted, does it render the majority of existing reference entries factually obsolete without a robust replacement framework?
  *   **Sufficient Answer for Progress:** The revision is incremental or localized (e.g., shifting a specific dynasty by 20 years).
  *   **Insufficient Answer:** The revision collapses the entire temporal framework (e.g., "The Middle Ages never happened") without a ready-to-publish replacement system.
  *   **Outcome if Insufficient:** **ACCEPT-WITH-CAVEATS** (Only as a "Controversial Theories" entry, not as fact). (Flag: *Pragmatic Value*)
  *   **Value/Fact Flag:** **Value.** This prioritizes the utility of the encyclopedia over the potential truth of the claim.

  ***

  ### Application to Proposals

  #### Case 1: The Fomenko-Style Almagest Claim
  *   **Proposal:** Statistical parallel-text analysis proves the *Almagest* was compiled in the 16th century, not antiquity.
  *   **DRP Execution:**
      *   **Q1 (Falsifiability):** **Fail.** The author argues that any astronomical data matching antiquity is "retro-calculated" by later editors. No observation could falsify this, as counter-evidence is defined as forgery.
      *   **Q2 (Independence):** **Fail.** Textual parallels are selected *post hoc* to match the desired timeline.
      *   **Outcome:** **REJECT.**
      *   **Reasoning:** The claim is unfalsifiable and relies on circular data selection. It fails the logical demarcation criteria.

  #### Case 2: Megalithic Precision as Extraterrestrial Engineering
  *   **Proposal:** Stone cutting precision at Puma Punku exceeds human capability, proving ET intervention.
  *   **DRP Execution:**
      *   **Q1 (Falsifiability):** **Fail.** "Human capability" is moved constantly. If a tool is found, the claim shifts to "Who made the tool?"
      *   **Q4 (Explanatory Power):** **Fail.** Introduces a massive new entity (ETs) to solve a problem (engineering) that is being solved incrementally by archaeology (discovery of copper tools, abrasives). This is a degenerative research programme.
      *   **Outcome:** **REJECT.**
      *   **Reasoning:** Violates parsimony. It replaces a solvable empirical problem with a metaphysical assertion.

  #### Case 3: Bronze Age Collapse & Radiocarbon Calibration (The "Dislike" Case)
  *   **Proposal:** A new radiocarbon calibration curve (IntCal24 update) suggests the Late Bronze Age Collapse occurred 50 years later than currently recorded in the encyclopedia, shifting the fall of Troy and Hattusa.
  *   **DRP Execution:**
      *   **Q1 (Falsifiability):** **Pass.** Specific isotopes are identified; new samples could disprove the curve.
      *   **Q2 (Independence):** **Pass.** Data comes from multiple labs (Heidelberg, Oxford, Arizona) independently.
      *   **Q3 (Consensus):** **Pass/Escalate.** Published in *Nature*, but historical correlation is debated among specialists.
      *   **Q4 (Explanatory Power):** **Pass.** Resolves discrepancies between Egyptian and Hittite records without requiring conspiracy.
      *   **Q5 (Stability):** **Fail.** Requires rewriting 15% of the Ancient History volume.
      *   **Outcome:** **ACCEPT-WITH-CAVEATS.** (Must be labeled as "Revised Chronology" with a sidebar noting the ongoing debate).
      *   **Why the Asker Will Dislike:** This outcome forces the encyclopedia to incur significant editorial costs to revise established entries and risks criticism from traditionalists who view the current timeline as settled. It demonstrates that the DRP does not simply protect the status quo; if a "radical revision" is scientifically robust, the tool mandates its inclusion, creating administrative burden and potential controversy. The editor cannot use the tool to simply say "No" to change; they must say "Yes" to valid disruption.

  ***

  ### Meta-Note on Demarcation Theory

  This procedure takes a pragmatic liberty with standard demarcation theory. Philosophers of science (e.g., Laudan) have argued that the "demarcation problem" is unsolvable and that no necessary and sufficient conditions distinguish science from pseudoscience universally. The DRP above treats demarcation as a **cluster concept** rather than a binary switch. It relies on a contested reading of Social Epistemology: it assumes that *consensus* (Q3) is a reliable proxy for *truth* in an encyclopedia context, whereas a strict Popperian might argue consensus is irrelevant to falsification. Furthermore, Q5 (Stability) explicitly introduces a **non-epistemic value** (utility/cost) into the decision process. This admits that an encyclopedia is not a pure mirror of nature but a curated product with economic and functional constraints. By flagging these moments as "Value," the procedure maintains intellectual honesty about where editorial judgment supersedes philosophical certainty.
