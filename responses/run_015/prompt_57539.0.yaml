answer: |-
  **Preamble: On the Viability of the Request**

  Your request is not misconceived, but it carries two strategic risks you must acknowledge before deploying this audit.

  First, the **Strawman Risk**. You admit to reconstructing a loose remark into a rigid mechanical argument. If your colleague is challenged on this, he may retreat: "I was speaking metaphorically about caution, not offering a structural engineering thesis." If you demolish a fortified version of an argument he never formally made, you may look like you are fighting a phantom. *Mitigation:* Frame your response conditionally: "If the case for retention rests on the structural fragility implied by the mortar analogy, then..." This forces him to either own the argument or abandon the ground.

  Second, the **Wrong Lens Risk**. You note that surrogacy debates are often about commodification and exploitation (harm-based) rather than shared morality (Devlin-based). The Hart–Devlin frame is appropriate *only if* the prohibition is defended on moralistic grounds. If your colleague is actually worried about exploitation but using moral language as a proxy, auditing the moral argument leaves the harm argument untouched. *Mitigation:* Use this audit to clear the moralistic ground, but explicitly reserve the right to argue that even if the "mortar" holds, the practice causes distinct harms that justify prohibition on non-Devlin grounds.

  Subject to those warnings, the audit below proceeds on the premise that the colleague is indeed making a neo-Devlin structural claim.

  ***

  ### 1. The Correspondences

  Here is the mapping of the source (construction) to the target (society/law).

  | Source Element | Target Candidate | Confidence | Notes |
  | :--- | :--- | :--- | :--- |
  | **Mortar** | The shared normative attitudes that bind institutions together (e.g., "children are not commodities"). | High | This is the core of the Devlin claim: morality as the binding agent. |
  | **Bricks** | Specific statutes, institutions, or social practices (e.g., adoption law, contract law, the surrogacy ban itself). | High | These are the discrete, replaceable units. |
  | **The Building** | Social order / Stability / The cooperative scheme of society. | High | The thing being preserved. |
  | **The Builder** | The Legislature / The Lawmaker. | Medium | **Problem:** In construction, the builder is external to the wall. In law, the legislature is part of the society it regulates. |
  | **Load-bearing Question** | Whether this specific prohibition is essential to maintaining the broader moral order. | High | The crux of the empirical dispute. |
  | **Absent Control Building** | A counterfactual society identical in all respects except the decriminalization of surrogacy. | High | Accurately reflects the impossibility of controlled social experimentation. |
  | **Impossibility of Rebuilding** | Path dependence / Irreversibility of cultural shifts (once norms change, they cannot be reset by statute). | Medium | Societies *do* rebuild norms, but rarely to the *exact* prior specification. |
  | **Raking out a course** | Repealing a law to test its necessity. | High | The act of reform. |
  | **Wall Moving/Collapsing** | Social fragmentation, loss of trust, or normative confusion. | Medium | "Collapse" is hyperbolic; "shift" is more accurate. |

  **Where the image has no honest candidate:**
  *   **The Blueprint:** Buildings are built to a plan. Societies evolve without a design. The analogy imports a teleology (purposeful design) that societies do not possess.
  *   **Uniform Composition:** Mortar is chemically homogeneous. Morality is pluralistic, contested, and often contradictory. There is no single "substance."

  ### 2. Disanalogies: Untidy vs. Damaging

  **Untidy (Decorative):**
  *   *Physicality:* That norms are abstract while mortar is physical does not damage the logic.
  *   *Timescale:* Walls fall faster than societies collapse. This is a difference of degree, not kind, and can be accommodated.
  *   *Visibility:* You can see crumbling mortar; normative decay is harder to measure. This complicates the epistemology but doesn't refute the risk.

  **Damaging (Structural to the Argument):**
  *   *Homogeneity vs. Pluralism:* Mortar is one continuous substance. If the "mortar" of society is actually a bundle of independent ropes (plural moralities), cutting one rope (surrogacy norms) does not necessarily snap the cable. The analogy assumes moral monism. If society is morally plural, the "continuous substance" claim is false.
  *   *Passive vs. Adaptive:* Mortar does not react when a brick is removed; it simply fails. Societies adapt. When a prohibition is lifted, other norms often strengthen to compensate (e.g., stricter regulation replaces criminalization). The analogy assumes static fragility rather than dynamic resilience.
  *   *The Builder's Position:* A builder stands outside the wall. The Legislature stands *inside* the society. If the wall moves, the builder moves with it. The analogy suggests an Archimedean point for law that does not exist.
  *   *Catastrophe vs. Degradation:* The analogy implies sudden collapse ("the wall has come down"). Social change is typically gradual degradation or transformation. This imports a false urgency.

  ### 3. What the Source Quietly Imports

  The analogy does not merely illustrate; it argues by smuggling in empirical premises as structural truths.

  *   **Unity of the Moral Code:** By calling it "a single continuous substance," the analogy asserts that all moral norms are interconnected such that disturbing one disturbs all. This is not proven; it is assumed by the choice of material. In reality, moral codes have redundant load paths.
  *   **Globality of Failure:** The image of the wall coming down imports the idea that failure will be total, not local. It rules out the possibility of a contained shift (e.g., surrogacy norms change, marriage norms remain stable).
  *   **Irreversibility:** "Cannot be rebuilt to the same specification" treats cultural path dependence as absolute. While resetting norms is hard, societies frequently reconstruct moral consensus after upheaval (e.g., post-war Germany, post-apartheid South Africa). The analogy treats this difficulty as impossibility.
  *   **Total Ignorance:** The "no control building" claim suggests we know *nothing* about the outcome. This ignores comparative jurisprudence. We *do* have data from jurisdictions where commercial surrogacy is legal (e.g., parts of the US, Ukraine, Georgia). We are not building in the dark; we are copying a design tested elsewhere.

  **Verdict:** These are imported by the analogy, not argued for. The analogy does the heavy lifting of establishing fragility, monism, and ignorance without evidence.

  ### 4. Whether the Conclusion Survives

  **Does the presumption for retention survive?**
  No, not as a *presumption*. It survives only as a *caution*.

  The analogy successfully establishes that social systems are complex and that unintended consequences are possible. It licenses a requirement for **gradualism** (phased implementation), **monitoring** (regulatory oversight), and **reversal mechanisms** (sunset clauses). It does *not* license a blanket prohibition based on the fear of collapse.

  **Maximum Claim:** The analogy supports the view that decriminalization should be treated as a high-risk structural modification requiring engineering controls (regulation), not that the modification should never be attempted.

  **Empirical Dependencies:** This assessment depends on the contested empirical claim that societies are resilient enough to absorb normative shifts without collapse. If one believes society is a glass house (fragile), the analogy holds. If one believes society is a forest (adaptive), it fails. History suggests the forest model is more accurate (e.g., the decriminalization of homosexuality did not collapse the family structure), but this is an empirical bet, not a logical truth.

  ### 5. The Hart Point

  **Does the existence-versus-identity objection land?**
  The mortar image is specifically designed to evade Hart's objection, but it does so by shifting the goalposts.

  *   **Hart:** A society can change its morality and remain the *same society* (Identity is preserved).
  *   **Mortar Argument:** A society can change its morality and remain a society, but it might become an *unstable* or *uninhabitable* one (Existence/Stability is threatened).

  The colleague is not arguing that the *name* of the society will change, but that the *structure* will fail. Therefore, Hart's logical point (that identity is flexible) does not directly refute the structural point (that stability is fragile).

  **The Further Premise:** To make the mortar argument work, the colleague must add: *"This specific moral norm is load-bearing."*
  **Defensibility:** This premise is indefensible without empirical evidence. Devlin argued that the "disintegration" thesis was self-evident for sexual morality. Modern sociology treats it as an empirical hypothesis. The mortar analogy tries to make this premise look self-evident (all mortar is load-bearing), but in a complex wall, some mortar is cosmetic. The burden of proof lies on the colleague to show that *this* mortar is structural.

  ### 6. The Treason Comparison

  **Your hunch is correct.** The "subversive vs. sinner" distinction and the "mortar" analogy are doing different work, and running them together is illegitimate.

  *   **Mortar (Structural):** Concerns the *consequences* of the act. It is forward-looking and consequentialist (if we allow this, the wall falls). It does not require malicious intent.
  *   **Subversive (Standing):** Concerns the *intent* and *loyalty* of the agent. It is backward-looking and retributive (you are attacking us).

  **The Illegitimacy:** The structural claim supplies the *urgency* (the wall will fall!) to justify the *severity* of the standing claim (you are a traitor). But if the structural claim is unproven (see Section 4), the urgency is manufactured. By conflating them, the colleague makes the reformer feel like a traitor for questioning a structural assumption that may be false. You should decouple them: "One can question the load-bearing capacity of a wall without being an enemy of the building."

  ### 7. A Better Analogy

  The "Mortar" analogy is too static. A better analogy is the **Immune System**.

  *   **The Image:** Laws and norms are like immune responses. Some fight real infections (harmful practices); some are autoimmune disorders (reacting to harmless variations).
  *   **What it Licenses:**
      *   It acknowledges that the system is protective (validating the colleague's caution).
      *   It allows for the possibility that the system is over-reacting (validating your reform).
      *   It suggests that removing a prohibition is like suppressing an immune response: it requires monitoring for infection (exploitation/harm), but leaving it on can cause chronic damage (stifling liberty/family formation).
      *   It accepts learning: We can see how other "bodies" (jurisdictions) handle the same pathogen.
  *   **Where it Gives Out:** Immune systems are not conscious; law is. We can choose to change the law; the body reacts automatically.
  *   **Why it is better:** It replaces the fear of *collapse* (death of society) with the management of *risk* (health of society). It shifts the debate from "Preserve at all costs" to "Calibrate for health."

  If no analogy suffices: The argument should be **Risk Assessment**. We do not ban all new drugs because some are toxic; we test them. We should treat legal reform similarly.

  ### 8. Auditing Your "Splint" Analogy

  > *"A morals law of this kind is like a splint left on a bone that has already healed: it did real work once, and left in place it stiffens the limb and wastes the muscle."*

  *   **Strengths:** It captures the idea of **obsolescence**. It effectively argues that the law is now causing harm (atrophy) rather than preventing it. It frames the reformer as a healer.
  *   **Weaknesses:**
      *   **Teleology:** It assumes the bone *has* healed. This is the exact point in dispute. The colleague says the bone is still broken; you say it is healed. The analogy assumes the conclusion.
      *   **Naturalism:** It implies there is a "natural" healthy state of morality to return to. Morality is constructed, not biological. There is no pre-law state of the limb.
      *   **Passivity:** A splint is passive. A criminal prohibition is active (it polices, punishes, stigmatizes). A better image might be a **tourniquet**: useful in an emergency, but if left on too long, it gangrenes the limb. This captures the active harm better than the splint.
  *   **Verdict:** Rhetorically potent, logically vulnerable to the "show me the X-ray" objection. Use the **Tourniquet** variant to emphasize active harm.

  ***

  **Final Strategic Advice:**
  Your colleague's mortar analogy is a "stopper" argument—it is designed to halt inquiry by invoking catastrophic risk. Your job is not to prove the wall *won't* fall, but to prove that we have **blueprints from other buildings** (comparative law) and that **walls are more resilient than masonry** (sociological evidence). Do not accept the premise that the mortar is a single continuous substance. Insist on identifying *which* specific norm is load-bearing and demand evidence of its structural role. If he cannot identify the load path, the mortar is just decoration.
