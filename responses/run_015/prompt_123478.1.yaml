  Hey, this is a fantastic angle to take for your course because it really exposes the friction between the theoretical definitions of disease and the messy reality of how psychiatric categories get made and unmade. Your idea of the residual category trap is sharp because it highlights how diagnostic taxonomy isn't just a neutral filing system but a tool of authority, and when you run that trap through the naturalist and normativist frameworks, you get some really interesting tensions that suggest neither theory fully captures what was happening on the ground. If you look at the 1980 retention of ego-dystonic homosexuality through a strict naturalist lens, which defines disease as a value-free biological dysfunction or deviation from species-typical functioning, the APA's move becomes almost impossible to justify without secretly smuggling values back in. A naturalist would argue that if homosexuality itself isn't a dysfunction of the reproductive or psychological mechanisms, then it shouldn't be in the manual, which explains the 1973 removal nicely. However, keeping the distress-based diagnosis implies that the distress itself is the dysfunction. The problem is that naturalism struggles to distinguish between a internal biological malfunction and a rational, healthy response to a hostile social environment. If a person is distressed because society tells them their identity is wrong, labeling that distress as a psychiatric disorder implicitly treats the social prejudice as a neutral background condition and the individual's reaction to it as the failure. For naturalism to support the 1980 residual category, it has to assume that being comfortable with homosexuality is the dysfunctional state or that the distress is a primary internal failure rather than a secondary reaction to stigma. This means the naturalist position collapses into normativism here because it relies on a hidden value judgment that heteronormativity is the standard for mental health, proving that you cannot actually keep the values out of the definition of dysfunction when the dysfunction is defined by subjective distress caused by social values.

  On the other side, normativism actually handles the activist demand for total removal much better than it handles the APA's compromise, which speaks to the strength of your residual category trap idea. Normativism posits that disease concepts are inherently evaluative, meaning something is a disorder because we decide it is bad or harmful, not because of a brute biological fact. From this view, the activists were fighting a battle over values, not biology. They understood that keeping any version of homosexuality in the DSM, even a distress-based one, retained the medical profession's authority to judge sexual orientation as a legitimate object of clinical scrutiny. If normativism is correct, then the category itself is a value judgment, so splitting it into ego-syntonic and ego-dystonic doesn't remove the judgment, it just refines it. The activists fought for total removal because they recognized that the diagnostic label itself confers a status of deviance that reinforces social harm, regardless of whether the individual is distressed. Normativism explains why the activists weren't satisfied with reclassification because reclassification still accepts the premise that medicine has the right to define the boundaries of acceptable sexual identity. However, normativism might struggle to explain why the APA felt the need to keep the residual category at all if values had supposedly shifted. If disease is just what we value as bad, and the social value shifted in 1973, the category should have vanished completely. The fact that it lingered suggests that institutional power and clinical utility sometimes override shifting social values, implying that normativism needs to account for institutional inertia and professional authority, not just abstract social values.

  When you put these pieces together through the lens of your residual category trap, it suggests that the episode doesn't necessarily break one theory completely but rather shows that both miss the political dimension of how diagnostic boundaries are policed. The trap reveals that naturalism is naive because it assumes you can isolate biological dysfunction from the social context that defines what counts as distress, while normativism is insightful about the value-laden nature of the category but might underestimate how values get encoded in clinical language to preserve professional authority. The 1980 compromise shows that removing a condition from the main taxonomy doesn't eliminate the normative judgment; it just displaces it from the identity to the reaction to the identity, effectively medicalizing the social conflict. This implies that the naturalist vs. normativist debate might be missing a third element, which is the sociology of medical knowledge and power. The episode demonstrates that disease classification is a negotiation where scientific claims are used to legitimize social values, and the residual category is the smoke screen that allows that legitimization to continue even after the overt value judgment has been publicly rejected. So rather than proving naturalism false or normativism true, the episode shows that naturalism is often a rhetorical strategy used to hide normativism, and your trap idea captures exactly how that hiding mechanism works by shifting the locus of pathology from the identity to the individual's inability to cope with the stigma attached to that identity. This makes the case study a powerful example of why we need to look beyond the definition of disease and look at the function of the diagnosis itself within society.
