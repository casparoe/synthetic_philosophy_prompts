answer: |-
  This is an excellent instinct. Your suspicion that the final two sentences are doing "quiet work" is correct; in fact, they are doing almost all the work, and they are doing it by smuggling in a conflation that professional historians of pragmatism spend entire monographs trying to untangle.

  The passage you provided is a classic example of "textbook pragmatism": it captures the *slogan* of the movement but flattens the *metaphysics* that drive the disagreement. For a popular history, this is forgivable. For a graduate seminar, it is dangerous.

  Here is a clause-by-clause audit of the passage, followed by an analysis of the substantive disagreement and a verdict on your friend's claim.

  ### Part 1: Clause-by-Clause Audit

  **1. "Pragmatism began with a single move: stop arguing about the 'essence' of a concept and ask instead what practical difference it makes."**
  *   **Verdict:** **Acceptable Simplification.**
  *   **Analysis:** This captures the anti-metaphysical spirit of the early Metaphysical Club. However, it implies Peirce and James were anti-metaphysical. They weren't; they were trying to *reform* metaphysics. Peirce, in particular, was a Scholastic Realist who believed deeply in "essences" (Thirdness), provided they had practical bearings.

  **2. "Peirce called this the pragmatic maxim — to work out what a concept means, spell out the conceivable practical consequences of the thing it refers to, and the meaning is just that set of consequences."**
  *   **Verdict:** **Accurate.**
  *   **Analysis:** This is a fair summary of "How to Make Our Ideas Clear" (1878). Peirce's maxim is semantic: it is a rule for translating intellectual concepts into conditional predictions about experience.

  **3. "James picked this up and applied it to truth itself, asking what concrete difference it would make in someone's life if an idea were true rather than false; he called this the idea's cash value."**
  *   **Verdict:** **Accurate.**
  *   **Analysis:** James explicitly shifted the focus from the *meaning of concepts* (Peirce) to the *value of beliefs* (James). The "cash value" metaphor is authentically Jamesian (*Pragmatism*, 1907).

  **4. "On this reading a belief is true just in case it is useful to act on — it works, it pays off in experience, and that is the whole story of truth."**
  *   **Verdict:** **Outright Misrepresentation (of James).**
  *   **Analysis:** This is the first major red flag. This is the vulgar caricature of James that annoyed him immensely during his lifetime. James never argued that *any* useful belief is true (e.g., a comforting delusion). He argued that truth is a *process* of verification. Truth *becomes* true; it is "made" in experience. While he ties truth to utility, he acknowledges an independent reality that constrains belief. To say "that is the whole story" ignores James's "radical empiricism" and his admission that truths must agree with reality.

  **5. "Peirce and James disagreed, the book notes, but only about scope: Peirce thought the maxim was a rule for clarifying the meaning of concepts, not a theory of truth, while James was the one who extended it into a full account of what truth is."**
  *   **Verdict:** **Misleading.**
  *   **Analysis:** This frames the dispute as a bureaucratic jurisdictional fight ("You handle meaning, I'll handle truth"). In reality, Peirce *did* have a theory of truth (the "final opinion" of the community of inquirers in the indefinite long run). He objected to James's theory not because the Maxim shouldn't apply to truth, but because James's application was *wrong*. Peirce believed James's definition of truth collapsed truth into *current* subjective satisfaction, whereas Peirce believed truth was independent of what you or I find useful right now.

  **6. "Their quarrel was therefore a technical one about how far the method reaches, and once you strip away the jargon they are in substantial agreement: truth is whatever works in practice."**
  *   **Verdict:** **Outright Misrepresentation (of Peirce and the Historical Record).**
  *   **Analysis:** This is the fatal error. Peirce renamed his philosophy "Pragmatic**icism**" specifically to distinguish it from James's "Pragmatism" because he found James's version repugnant. He called James's view a "nominalistic" corruption of his own "realistic" logic. They are not in substantial agreement; they are metaphysical opponents.

  ---

  ### Part 2: The "Truth is Whatever Works" Problem

  You asked specifically whether the move from "works" to "that is the whole story of truth" is fair. It is not.

  **James's Nuance:**
  James did say truth is what "works," but he meant "works" in a specific epistemic sense: a true idea is one that we can assimilate, validate, corroborate, and verify. It "works" because it leads us through a chain of experiences without contradiction and helps us navigate reality. He did not mean "works" in the sense of "makes me happy" (though he allowed that religious beliefs could be true if they provided a vital good that was otherwise inaccessible, per *The Will to Believe*).

  **Peirce's Objection:**
  Peirce's objection was not that James talked about truth, but that James made truth too dependent on the *individual* subject's immediate experience.
  *   **Peirce:** Truth is what *would* be agreed upon by the community of investigators after an indefinite amount of time. It is independent of what you or I think *now*. It is **Realist**.
  *   **James:** Truth is what proves itself to be good in the way of belief *now* (or in the foreseeable future). It is contingent on human needs and experiences. It is **Humanist/Nominalist**.

  When the book says "truth is whatever works in practice," it erases Peirce's insistence that truth is *fated* and independent of individual utility. For Peirce, a belief might "work" for you personally (make you happy, help you function) but still be *false* if it contradicts the ultimate scientific consensus. For James, if it genuinely helps you navigate life and connects with reality, that *is* a form of truth.

  ### Part 3: Scope vs. Foundation

  The book claims the split is about **scope** (meaning vs. truth). The actual split is about **foundation** (Realism vs. Nominalism).

  **Peirce (Scholastic Realism):**
  Peirce believed that generals (laws, habits, types) are real. "Hardness" is a real property of a diamond even if no one scratches it. The Pragmatic Maxim is a logical tool to clarify these real generals. His logic is grounded in the assumption that there is a reality out there that constrains inquiry.

  **James (Radical Empiricism/Nominalism):**
  James was skeptical of "absolute" truths or realities that stand forever outside human experience. He viewed truth as a property of ideas that *happens* to them. Truth is made in the course of experience.

  **Why this matters:**
  If the disagreement were merely about scope, Peirce could have said, "Okay, Charlie, you apply the maxim to truth, just don't call it Pragmatism." Instead, Peirce said, "Your application of the maxim destroys the logical integrity of the maxim." Peirce feared James's version led to relativism ("My truth works for me, your truth works for you"). Peirce wanted logic to be a normative science that binds us all to the same reality.

  ### Part 4: Bottom Line — Are They the Same Person?

  **Verdict:** **Your friend is wrong.**

  To say Peirce and James are "basically the same person wearing different costumes" is to ignore the central tension that defines the history of pragmatism.

  1.  **Peirce would object:** He explicitly distanced himself from James. He viewed James's psychology-based approach as a corruption of his logic-based approach.
  2.  **James would object:** While James admired Peirce, he knew he was modifying the doctrine to fit a more pluralistic, human-centric worldview. He wasn't just "extending" Peirce; he was translating Peirce's technical logic into a philosophy of life.
  3.  **The Historian's View:** The "Peirce-James split" is not a technicality; it is the fork in the road between **scientific realism** (Peirce -> Dewey -> Quine) and **humanistic existentialism** (James -> Rorty -> neopragmatism).

  The book's conclusion that they are in "substantial agreement" survives only if you accept the book's definition of pragmatism as "vague instrumentalism." If you define pragmatism by the actual arguments of its founders, they are in **substantial disagreement**.

  *   **Peirce:** Truth is the destination of inquiry (independent of us).
  *   **James:** Truth is the path of inquiry (dependent on our interaction with the world).

  ### Recommendations for Your Seminar

  Since you are in a graduate seminar, you need to move past the popular history summary. To solidify your position against your friend and the text:

  1.  **Read Peirce's "What Pragmatism Is" (1905):** This is where he explicitly distinguishes "Pragmaticism" from James's "Pragmatism." He writes: *"So then, the word [pragmatism] has come to be used in a way that is intolerable to me... I call my doctrine Pragmaticism."*
  2.  **Read James's "Pragmatism's Conception of Truth" (Lecture VI in *Pragmatism*):** Look for where James clarifies that truths must "agree with reality." He is not as crude as the book suggests, but he is still distinct from Peirce.
  3.  **Secondary Source:** Christopher Hookway's *The American Pragmatists* or Louis Menand's *The Metaphysical Club*. Menand is a popular historian (like your book), but he understands the Peirce-James tension much better. Hookway is more technical and will highlight the logical divergences.

  **Summary for your friend:**
  Tell your friend that if Peirce and James were the same person, Peirce wouldn't have spent the last decade of his life writing furious letters to *The Monist* trying to legally and philosophically divorce himself from James. They share a method (roughly), but they disagree on what that method tells us about reality. That is not a costume change; it is a metaphysical schism.
