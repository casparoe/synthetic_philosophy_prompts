  1.  **Vs. Semantic Drift:** Ordinary semantic drift is unconscious and historical (decades). Rigor Drift is situational and rapid (sprints). If "mouse" evolved from animal to device over 50 years, that is semantic drift. If "idempotent" shifts meaning between the handbook and standup within a quarter, that is Rigor Drift.
