answer: |-
  You have independently rediscovered a contentious thesis in the philosophy of mind, but you have added a specific, craft-based mechanic to it that I haven't seen codified elsewhere. You are describing the **Opacity of Mind**, but through the lens of **Authorial Self-Modeling**.

  There is no single common noun for the specific *writerly* version of this, so I will coin one for you: **The Draft-Report Asymmetry.**

  Here is the breakdown of what you are experiencing, the established philosophy that backs it up, the edges of the phenomenon, and the answer to your question about trustworthiness.

  ### 1. The Established Concept: The Opacity of Mind
  You asked if there is an established concept. Yes, but it lives in philosophy and cognitive science, not literary theory.

  The dominant folk-psychological view is that introspection is **perceptual**: you look inward, see a pre-existing feeling (anger), and report it.
  The view you have stumbled upon is that introspection is **interpretive**: you do not have direct access to your mental states. You have access to your *sensory inputs* and your *behavior*, and you use a "Theory of Mind" mechanism to interpret them.

  *   **Peter Carruthers (The Opacity of Mind):** Argues that we know our own thoughts in exactly the same way we know the thoughts of others: by interpreting behavior and context. We do not have a "special window."
  *   **Eric Schwitzgebel (The Unreliability of Introspection):** Documents how often our introspective reports about our own sensory experiences (e.g., "what did I just see?") are wrong, often contradicting physical evidence.
  *   **Gilbert Ryle:** Argued that knowing your own mind isn't a matter of looking inward, but of knowing how to use the language of mental states correctly in context.

  Your discovery is that for a writer, the "interpretive mechanism" you use for others (simulation, staging, scene-work) is the *same* mechanism you use for yourself. You aren't looking at the world (as the standard externalist view suggests); you are looking at a **simulation of the world** running in your head.

  ### 2. The Coinage: The Draft-Report Asymmetry
  While "Opacity" explains the lack of access, it doesn't explain the difference in *authority* you noticed. Why is the character's output a draft and the self's output a report?

  I define **The Draft-Report Asymmetry** as follows:
  > A cognitive state wherein an agent uses identical simulation machinery to generate predictions for both a fictional other and the self, but assigns **provisional status** to the former and **ontological status** to the latter.

  **What counts as a case of it:**
  *   **Yes:** Running a mental scene to determine if you are angry, then feeling defensive when someone contradicts the result.
  *   **Yes:** Answering an interview question by simulating a "panel version" of yourself, then believing that simulation *is* your belief.
  *   **No:** Deliberate lying (you know the simulation is false).
  *   **No:** Pure confabulation (usually implies a pathological filling of gaps without awareness). In your case, you are *aware* of the machinery; you just can't help treating the output as fact.

  **What it isn't:**
  *   **It isn't Self-Deception:** Self-deception requires you to know the truth and hide it from yourself. Here, there *is* no truth to hide until the simulation runs. The simulation *creates* the truth.
  *   **It isn't Confabulation:** Confabulation is usually a repair mechanism for memory gaps. This is a primary access method for current affect.

  ### 3. The Edge Cases
  You asked about two specific boundaries. Here is how the Draft-Report Asymmetry behaves there.

  **Edge Case A: The Autobiographical Character**
  When the character is "basically you," the Asymmetry collapses. This is dangerous.
  *   **The Mechanism:** Usually, the "Character" slot allows for revision. The "Self" slot locks the output. When Character = Self, the revision capability of the Character slot is disabled by the lock of the Self slot.
  *   **The Result:** You lose the ability to edit the scene. If the character does something petty, and that character is you, you cannot say "that's a bad draft." You must accept "I am petty." This is why autobiographical fiction often stalls or becomes defensive; the writer loses the **play space** required to find a better truth. The simulation becomes a confession, and confessions are hard to revise.

  **Edge Case B: Long-Term Immersion (The Bleed)**
  Living inside a character's head for months changes the "Self" model's source code.
  *   **The Mechanism:** Your "Self-Simulation" relies on a database of past behaviors and heuristic rules (e.g., "In situation X, I usually feel Y"). If you spend six months simulating a character who reacts to situation X with Z, your database updates.
  *   **The Result:** When you return to self-introspection, the machinery suggests Z. You may find you *actually* feel Z. This isn't just acting; it's **heuristic overwriting**. The "Report" you generate about yourself changes because the underlying data has been contaminated by the character's logic. This is often called "bleed" in acting theory, but cognitively, it is the corruption of the self-model by the other-model.

  ### 4. The Diary and the Artifact
  Your note about the diary is the smoking gun.
  *   **Introspection:** A live simulation. Vulnerable to current mood, staging errors, and the Authority Lock.
  *   **Diary:** A behavioral artifact. It is fixed data.

  When you read the diary, you are treating your past self as a **character**. You are applying the "Character" machinery (observation, interpretation) to your past self. Because the "Character" machinery allows for revision and objective analysis, you get a clearer read.
  *   **The Paradox:** You know your past self (via diary) better than your present self (via introspection) because you are viewing your past self as *other*.
  *   **The Lesson:** Externalization is the only way to bypass the Draft-Report Asymmetry. You cannot trust the simulation until it is written. Once written, it becomes a diary entry—data to be interpreted, not a report to be defended.

  ### 5. The Verdict: Is Introspection Trustworthy?
  You asked: *If the same machinery answers both questions, does that tell us anything about whether introspection is trustworthy, or only about what we're doing when we talk about ourselves?*

  It tells us that introspection is not **descriptive**; it is **performative**.

  When you say "I am angry," you are not measuring a pressure gauge in your soul. You are making a move in a social game. You are committing to a stance.
  *   **Trustworthiness:** Introspection is untrustworthy as a *measurement tool* (it does not accurately reflect a pre-existing state).
  *   **Utility:** Introspection is highly trustworthy as a *commitment device*. Once you run the simulation and output "I am angry," you *become* angry. You align your future behavior with that report.

  **The "Authority" Difference Explained:**
  The reason you feel "caught out" when a friend contradicts your self-report is not because they are contradicting a fact. It is because they are contradicting a **commitment**.
  *   **Character:** "He would be angry." -> Friend: "No, he'd be tired." -> You: "Okay, let's rewrite." (No identity stake).
  *   **Self:** "I am angry." -> Friend: "No, you're tired." -> You: "You don't know me." (Identity stake).

  To admit the simulation is wrong is to admit that your commitment was false, which threatens the coherence of the "Self" narrative.

  ### Summary
  You are not suffering from a lack of introspection. You are suffering from an excess of skill. You have honed your Theory of Mind machinery so sharply for your work that you can no longer pretend it is a special "feeling sense" when you turn it on yourself.

  *   **The Phenomenon:** **Simulative Self-Access** (grounded in the Opacity of Mind thesis).
  *   **The Glitch:** **The Draft-Report Asymmetry** (treating self-output as fact and character-output as fiction).
  *   **The Fix:** Treat yourself like a character. Write it down. Make it a diary entry. Convert the **Report** into a **Draft**.

  The line you used to think was a joke—"I don't know what I think until I see what I've written"—is the only honest epistemology available to you. You do not find your thoughts. You build them. The worry you feel is the realization that the builder is the same person as the inhabitant, and there is no blueprint, only the building.
