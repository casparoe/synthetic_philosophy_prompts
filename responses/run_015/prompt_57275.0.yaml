answer: |-
  Here is an assessment of the voting situation and a proposal for your meeting.

  ### 1. Is the member who objected to the chair's ordering right?

  **Yes, the member is absolutely right.** The voting method used by the chair (sequential pairwise voting, often called an "amendment procedure") is highly susceptible to **agenda control**. Because the board's preferences form a **Condorcet Cycle** (Alder beats Brightwater, Brightwater beats Cascade, Cascade beats Alder), there is no stable winner. The winner is determined entirely by the order in which the votes are held.

  Here are the outcomes for the three possible first-round pairings among the original three firms:

  *   **Order 1 (Chair's Choice): Alder vs. Brightwater first.**
      *   Alder beats Brightwater (8 to 7).
      *   Winner (Alder) vs. Cascade.
      *   Cascade beats Alder (9 to 6).
      *   **Winner: Cascade.**
  *   **Order 2 (Objector's Suggestion): Brightwater vs. Cascade first.**
      *   Brightwater beats Cascade (11 to 4).
      *   Winner (Brightwater) vs. Alder.
      *   Alder beats Brightwater (8 to 7).
      *   **Winner: Alder.**
  *   **Order 3 (Third Possibility): Alder vs. Cascade first.**
      *   Cascade beats Alder (9 to 6).
      *   Winner (Cascade) vs. Brightwater.
      *   Brightwater beats Cascade (11 to 4).
      *   **Winner: Brightwater.**

  Since any of the three firms can win depending on the order, the chair's claim that his order was "natural" is unfounded. The method allowed the chair to implicitly select the winner by setting the agenda.

  ### 2. Is there a rule we could adopt now that avoids the arbitrariness?

  Every voting rule has defects when preferences cycle, but some are less objectionable for a small, deliberative body like a board.

  *   **Plurality (Single Vote):** *Defect:* Ignores majority preferences. Brightwater won with only 5 of 15 votes (33%). 10 members preferred someone else. This is dangerous for a board decision.
  *   **Borda Count (Scoring):** *Defect:* Susceptible to "cloning" or irrelevant alternatives. The entry of Dovetail (a clone of Alder) changed the scores significantly enough to create a tie where one might not have existed, and it relies on the intensity of rankings which can be manipulated.
  *   **Sequential Pairwise (Current Method):** *Defect:* As shown above, the winner depends on the order of voting (Agenda Control).
  *   **Instant Runoff Voting (IRV):** *Defect:* Can violate monotonicity (ranking a candidate higher can hurt them), but it ensures the winner has a majority of support in the final round.
  *   **Condorcet Methods (e.g., Minimax/Ranked Pairs):** *Defect:* Can be complex to explain to members. However, they are designed specifically to handle cycles by finding the candidate with the strongest overall head-to-head performance.

  **Recommendation:** For a 15-member board, **Instant Runoff Voting (IRV)** is the least objectionable practical alternative. It uses the ranking data you already have, eliminates the "spoiler" effect of low-support candidates, and produces a winner supported by a majority (8 of 15) in the final tally. It is easier to explain than Condorcet completion methods.

  ### 3. Would it be defensible to set Dovetail's bid aside?

  **Yes, it is defensible and mathematically sound.**

  *   **Condorcet Loser:** Dovetail loses head-to-head against every other firm (Alder 13-2, Brightwater 9-6, Cascade 9-6). In voting theory, a candidate who loses to everyone else should not win.
  *   **Spoiler Effect:** Dovetail acts as a "clone" of Alder. In the plurality vote, Dovetail split the "Alder-leaning" vote (4 for Alder, 2 for Dovetail), allowing Brightwater to win with only 5 votes.
  *   **What is lost?** The only loss is procedural: you must document *why* Dovetail was eliminated to avoid the appearance of impropriety or violation of bylaws requiring consideration. However, since they are pairwise defeated by all others, eliminating them first simplifies the decision without changing the fundamental preferences among the viable candidates.

  ### 4. Is there any firm that this board, considered as a single body, actually prefers?

  **No.** This is a classic example of the **Condorcet Paradox** (and relates to Arrow's Impossibility Theorem). The board's collective preferences are **intransitive**:
  *   The Board prefers Alder over Brightwater (8-7).
  *   The Board prefers Brightwater over Cascade (11-4).
  *   The Board prefers Cascade over Alder (9-6).

  Because the group preference loops (A > B > C > A), there is no single "will of the board." Whatever decision is made next week will represent the **decision of the voting rule** (or the Chair, if he breaks ties or sets the agenda), not an inherent preference of the group. Acknowledging this paradox is crucial for board cohesion; it means no side can claim they are the "true majority."

  ### 5. Is strategic voting likely to succeed, and is it objectionable?

  *   **Likelihood:** Yes. In the Borda count scenario, the two members who rank Dovetail first could strategically rank Alder first. This would break the 42-42 tie in Alder's favor, preventing the Chair from using his tie-break to select Brightwater. In Plurality, Alder supporters could abandon Dovetail to ensure Alder beats Brightwater.
  *   **Objectionable?** **Yes.** For a small board governing a public-facing historical society, transparency and trust are paramount. Strategic voting undermines the integrity of the process. If members vote insincerely, the result reflects manipulation rather than judgment. It sets a poor precedent for future governance.

  ***

  ### Proposal for Thursday's Meeting

  You should propose a motion that stabilizes the process, removes the spoiler, and utilizes the ranking data already provided.

  **Motion:**
  *"To streamline our selection process and ensure the winner commands majority support, I move that we first eliminate Dovetail Construction from consideration, as they are pairwise defeated by all other bidders. Then, we shall select among Alder, Brightwater, and Cascade using Instant Runoff Voting based on our existing ranked ballots."*

  **Why this works:**
  1.  **Eliminates the Spoiler:** Removing Dovetail (the Condorcet Loser) prevents them from splitting the vote and altering the outcome between the major firms.
  2.  **Resolves the Cycle:** IRV breaks the Condorcet cycle by eliminating the weakest first-choice candidate (Cascade, with 4 votes) and redistributing their votes.
      *   *Projected IRV Outcome:* Cascade is eliminated. Their 4 votes transfer (2 to Alder, 2 to Brightwater). Final count: **Alder 8, Brightwater 7.**
  3.  **Majority Mandate:** The winner (Alder) will have support from 8 of 15 members (a majority), whereas the Plurality winner (Brightwater) had only 5.
  4.  **Neutrality:** This removes the Chair's ability to pick the winner via agenda order or tie-breaking. It lets the mathematical logic of the members' own rankings decide.

  **Speaking Points:**
  *   "We are currently stuck in a voting paradox where the winner depends on the order of voting, not the will of the members."
  *   "Dovetail loses to everyone head-to-head; keeping them in the count only distorts the result between the other three."
  *   "Instant Runoff is a standard, fair method that ensures the winner is acceptable to a majority of this board."
  *   "This allows us to move forward with a decision we can all defend as procedurally sound."
