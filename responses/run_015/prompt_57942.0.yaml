answer: |-
  This is a classic Moral Psych dilemma, and your friend gave you the "Standard Deflationary Account" (mostly associated with philosopher Alfred Mele). It is the dominant view in contemporary philosophy of mind, **but** your intuition that it feels "too tidy" is spot on. In a Moral Psych class, the stakes are higher because we care about *responsibility*. If self-deception is just a glitch in how we process evidence, are we blameworthy? If it's lying, we are.

  Here is the breakdown of what's right, what's fudged, how the "lying" proponents fight back, and how to use your two examples to crush it in section.

  ### 1. What Your Friend Got Right (The Deflationary View)
  Your friend is correct about the **Logical Paradox**. This is usually split into two problems:
  *   **The Static Paradox:** To lie, I must believe $p$ (the truth) and induce belief in not-$p$ (the lie). If I succeed, I believe not-$p$. So I believe both $p$ and not-$p$. That's irrational.
  *   **The Dynamic Paradox:** To lie, I must intend to deceive. If I intend to deceive *myself*, I have to know what I'm hiding. But if I know what I'm hiding, I'm not deceived.

  **The Solution:** Your friend is right that most philosophers solve this by removing **intention**. On this view (Motivated Bias), you don't *decide* to believe the lie. Instead, your desire for $p$ to be true makes you treat evidence for $p$ loosely ("Skimming the abstract is basically reading") and evidence against $p$ strictly ("That one confusing paragraph doesn't count"). You end up believing $p$, but you never consciously held not-$p$.

  **Verdict:** Logically, this holds up. It removes the contradiction.

  ### 2. What Is Fudged or Overstated
  Here is where you can push back in section. Your friend oversold the consensus and the "solution."

  *   **Fudge #1: "Everyone dropped the lying model."**
      *   **Reality:** Not everyone. There are still "Intentionalists" (like some psychoanalytic theorists or evolutionary psychologists like Robert Trivers). They argue the mind is not a unified single agent. One part of the mind (subconscious) knows the truth and hides it from the other part (conscious). This solves the paradox by splitting the "self" into two agents.
  *   **Fudge #2: "The puzzle disappears."**
      *   **Reality:** The *logical* puzzle disappears, but the **Explanatory Puzzle** remains. If self-deception is just biased reasoning, how is it different from ordinary optimism or mistake? We need to know where "hopeful thinking" ends and "self-deception" begins. The deflationary model makes it hard to distinguish self-deception from just being wrong.
  *   **Fudge #3: The Moral Stakes.**
      *   **Reality:** In Moral Psych, this is huge. If self-deception is just an unconscious bias (like a cognitive illusion), am I responsible for it? Can I be blamed? If it involves *strategic avoidance* (like your banking app), it feels much more blameworthy. The deflationary model risks making self-deception too passive.

  ### 3. The Pushback: Why Some Still Like the "Lying" Idea
  Proponents of the intentional/strategic model argue that the deflationary view ignores the **active work** we do to stay deceived.

  *   **The Argument:** We don't just misinterpret evidence; we actively **avoid** it. We change the subject when it comes up. We avoid certain people. We delete apps.
  *   **The "Divided Mind" Defense:** They argue the paradox only exists if the mind is one single thing. If the mind is modular (like a computer with different background processes), one module can know the truth and prevent that info from reaching the "CEO" module.
  *   **Evolutionary Defense:** Robert Trivers argues we deceive ourselves *in order to* deceive others more convincingly. If I truly believe I'm a good driver (despite evidence), I lie to you about my skills more convincingly. This requires a strategic, quasi-intentional process.

  ### 4. Applying This to Your Examples (Section Gold)
  This is the most important part. Your friend's model treats your two examples as the same thing (Motivated Bias). But phenomenologically (how they feel) and structurally, they are different.

  **Example 1: The Readings (Motivated Bias)**
  *   **The Scenario:** You skim abstracts but feel confident you "get it."
  *   **Friend's View:** This fits the **Deflationary Model** perfectly. You want to be a good student. That desire biases your judgment of what "understanding" means. You didn't *plan* to fool yourself; you just interpreted "skimming" as "studying" because it felt good.
  *   **Lying Model Pushback:** An intentionalist might say you felt a pang of anxiety ("I didn't read the whole thing") and actively suppressed it to feel confident.
  *   **Section Point:** This example supports your friend. It looks like biased evidence processing, not a conspiracy.

  **Example 2: The Banking App (Strategic Ignorance)**
  *   **The Scenario:** You *deleted the app* to avoid seeing the balance.
  *   **Friend's View:** He would call this "motivated belief" too. But wait—you don't necessarily *believe* you have money. You just don't *know* you don't.
  *   **Lying Model Pushback:** This is the smoking gun for the **Intentionalist/Strategic Model**. Deleting the app is an **action**. It is a strategy. You recognized that seeing the balance would force a belief (not-$p$) you didn't want, so you took steps to prevent that belief.
  *   **Section Point:** This example breaks your friend's "tidy" story. This isn't just mishandling evidence; this is **evidence avoidance**. It looks a lot more like lying to yourself because it involves a deliberate plan to remain ignorant. Philosophers often call this "Strategic Ignorance," and it bridges the gap between self-deception and lying.

  ### 5. Does the "Puzzle Disappear"?
  **No.** Here is your takeaway for section:

  If you accept your friend's view, the *logical* paradox disappears, but you lose the ability to explain cases like the Banking App. If self-deception is just "bias," why did you have to delete the app? Why wasn't just looking at it and biasing the interpretation enough?

  The fact that you took **physical action** to prevent knowledge suggests there *is* an intention involved, even if it's subconscious.

  **Summary for Section:**
  1.  **Acknowledge:** The friend is right that the "Static Paradox" (believing $p$ and not-$p$) is a problem for the Lying Model.
  2.  **Critique:** But the Deflationary Model (Motivated Bias) is *too* passive. It can't explain **Strategic Ignorance** (deleting the app).
  3.  **Synthesis:** Self-deception might be a spectrum.
      *   **End A (Readings):** Pure motivated bias (Friend is right).
      *   **End B (Banking):** Strategic avoidance (Lying model is closer).
  4.  **Moral Psych Kicker:** If it's End A, maybe we aren't fully blameworthy (it's a cognitive bug). If it's End B, we are blameworthy because we took action to hide the truth from ourselves.

  **One-liner for discussion:** "If self-deception is just biased reasoning, why do we sometimes have to physically hide the evidence from ourselves? That suggests a level of intentionality the deflationary model can't explain."
