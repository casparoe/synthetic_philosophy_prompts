      *   *Contested:* Is the primary target *ontology* (things in the world) or *logic/semantics* (how we think/speak)?
      *   *The "Where":* The threat to unity arises because a proposition is supposed to be a *single* truth-apt unit. If the connection between subject and predicate requires an infinite chain of further connectors, the connection is never completed. Therefore, the "one" thought never actually forms. It remains a heap of fragments.
      *   *Scholarship:* Some see this as a problem for *external* relations (Russell's reading). Others see it as a problem for *any* attempt to analyze unity via constituents (the "unity of the proposition" problem revived by Gaskin, etc.).

