answer: |-
  **MEMORANDUM**

  **TO:** Evidence Review Panel
  **FROM:** Chair, Evidence Review Panel
  **DATE:** Tuesday, [Date]
  **SUBJECT:** Procedure for Finalizing Hazard Probability Estimate

  **Context**
  As we approach Thursday's final vote, we remain deadlocked on the probability estimate for [Hazard Name], with credible estimates ranging from 2% to 8%. We have completed a full evidence exchange. Both estimators are epistemic peers, and both reasoning tracks are logically sound.

  **The Implication of Persistent Disagreement**
  We must interpret this impasse correctly. Aumann's Agreement Theorem suggests that rational agents with common priors and common knowledge of posteriors should converge. The fact that you have not converged does not imply irrationality on either side. Rather, it indicates that **you do not share common priors.**

  This disagreement is not noise; it is data. It tells us that the current evidence underdetermines the conclusion. The divergence stems from structural differences in how you weight prior background knowledge versus the new data. We are facing **model uncertainty**, not just parameter uncertainty.

  **Why Standard Aggregation Fails**
  To resolve this, we cannot rely on heuristic shortcuts:
  *   **Simple Averaging (5%):** This is mathematically convenient but scientifically misleading. It implies a precision and consensus that does not exist. If the true risk landscape is bimodal (i.e., the mechanism implies either 2% or 8%, but not 5%), the average becomes the least likely true value.
  *   **Adopting the Cautious Maximum (8%):** While prudent for policy, adopting this as the *scientific finding* without qualification misrepresents the evidence base. It treats the upper bound as the central estimate, potentially inflating the perceived strength of the data.

  **Required Procedure for Thursday's Session**
  To meet the reporting requirement for a single number while maintaining scientific integrity, we will proceed as follows:

  1.  **Second-Order Elicitation (30 mins):** Before voting, each estimator must update their probability *solely* based on the fact that a trusted peer holds the opposing view. You are asked to treat the peer's disagreement as new data. Does the existence of this dissent shift your estimate toward the middle, even slightly?
  2.  **Selection of Operational Value:** If divergence persists after Step 1, we will adopt the **8% estimate** as the operational number for the report. This aligns with the precautionary principle required for public health protection.
  3.  **Mandatory Uncertainty Annotation:** Crucially, the report will not present 8% as a consensus mean. It will be explicitly labeled as a **"Precautionary Upper-Bound Estimate"** with a confidence rating of **LOW**. The 2% estimate will be documented in the technical appendix as a credible alternative scenario driven by valid competing priors.

  This approach allows us to file the required single number without falsifying the state of our knowledge. Please come prepared to execute Step 1 immediately upon convening.

  Regards,

  [Your Name]
  Chair, Evidence Review Panel
