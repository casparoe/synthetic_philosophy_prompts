      *   *What does it actually say?* If two Bayesians share a common prior and their posterior probabilities are *common knowledge*, they cannot agree to disagree.
      *   *Why haven't they agreed?*
          *   They might not actually share a common prior (different background beliefs/weights on evidence types).
          *   Their posteriors might not be truly "common knowledge" (they heard the numbers, but maybe not the full weighting function).
          *   They might not be perfectly rational Bayesians (bounded rationality, cognitive bias).
          *   *Crucial Point:* In real-world expert elicitation, Aumann's conditions are rarely met. Persistent disagreement signals *structural uncertainty* or *divergent priors*, not necessarily irrationality. It highlights that the evidence underdetermines the conclusion.
      *   *Memo Implication:* Don't accuse them of irrationality. Acknowledge that the disagreement *is* data. It tells us the risk model is sensitive to assumptions that aren't settled by the current evidence.

