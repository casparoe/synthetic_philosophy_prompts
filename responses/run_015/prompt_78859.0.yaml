answer: |-
  **Exam Question**

  **Question 1 (25 marks).** Consider the Pasadena game: a fair coin is tossed until heads (toss $n$). Payoff: $(-1)^{n+1} 2^n / n$. The Altadena game is identical but payoff is $2^n / n$.

  (1) Explain why the Pasadena game's expected value is undefined rather than infinite, and why this matters beyond mathematical technicality.
  (2) Explain the implication for the principle of expected value maximization.
  (3) Evaluate whether the Altadena game's dominance over Pasadena offers a solution for the expected value maximizer.
  (4) Assess at least one proposed response (e.g., bounded utility, restricting decision theory, or alternative criteria).
  Conclude on what this case shows about standard decision theory.

  ***

  **Model Answer**

  The Pasadena game presents a critical challenge to standard decision theory because its expected value is undefined, not merely infinite. The expected value is calculated by summing the probability-weighted payoffs. For the Pasadena game, the probability of heads on toss $n$ is $1/2^n$, and the payoff is $(-1)^{n+1} 2^n / n$. Multiplying these yields the series $\sum_{n=1}^{\infty} (-1)^{n+1} / n$. This is the alternating harmonic series. Unlike the St. Petersburg paradox, where the series diverges to positive infinity, this series is conditionally convergent. It converges to $\ln(2)$ only if summed in the specific order of $n=1, 2, 3...$. However, because the series is not absolutely convergent, the Riemann rearrangement theorem states that its terms can be reordered to sum to any real number or diverge. Since there is no principled reason to privilege the natural ordering of tosses over any other summation order, there is no fact of the matter regarding the game's expected value. It is undefined.

  This distinction is crucial. In the St. Petersburg case, expected value maximization yields a clear verdict: the game is worth infinity, so a rational agent should pay any finite amount to play. The problem is that this verdict contradicts intuition. In the Pasadena case, the problem is deeper: expected value maximization yields no verdict at all. The theory is silent. It cannot assign a value to the prospect, meaning it cannot rank the Pasadena game against a sure sum of money or other gambles. This implies that expected value maximization is not a complete decision rule; it fails to guide choice in scenarios involving conditionally convergent prospects.

  The Altadena game offers a contrast. Its payoffs are $2^n / n$, resulting in the harmonic series $\sum 1/n$, which diverges to positive infinity. The Altadena game dominates the Pasadena game because its payoff is strictly higher in every possible outcome. Dominance reasoning suggests that if offered a choice between the two, a rational agent should choose Altadena. However, this does not solve the core problem for the expected value maximizer. Dominance helps compare the two games, but it does not assign a defined expected value to the Pasadena game itself. If an agent is offered the Pasadena game alone against a cash prize, dominance reasoning is inapplicable. The undefined expected value remains, leaving the agent without guidance from standard theory.

  One proposed response is to restrict decision theory to prospects with well-defined expectations. This admits that standard theory is incomplete but preserves its integrity where applicable. However, this seems ad hoc and limits the theory's scope significantly. Another response is to adopt a bounded utility function. If utility is bounded, the series becomes absolutely convergent, and the expected value is defined. While mathematically effective, this changes the subject from monetary payoffs to utilities, potentially obscuring the structural issue with infinite expectations in the original frame. A third option is to use alternative criteria, such as maximizing median payoff or using stochastic dominance. These can rank the Pasadena game but abandon the central tenet of expected value maximization.

  Ultimately, the Pasadena game shows that standard expected value maximization is insufficient as a universal theory of rational choice. It either requires supplementation with rules for handling undefined expectations or must acknowledge that some prospects lie outside its domain of applicability. The case demonstrates that mathematical coherence in decision theory requires more than just summing outcomes; it requires conditions ensuring those sums are invariant and well-defined.

  ***

  **Marking Scheme**

  **Total Marks: 25**

  **1. Mathematical Explanation (5 marks)**
  *   **5 marks:** Correctly identifies the expected value series as the alternating harmonic series ($\sum (-1)^{n+1}/n$). Explains that it is conditionally convergent, not absolutely convergent. Explicitly mentions that rearrangement allows the sum to equal any value (Riemann rearrangement), rendering the expectation undefined.
  *   **3-4 marks:** Identifies conditional convergence but fails to explain the rearrangement implication clearly.
  *   **0-2 marks:** Claims the value is zero, infinite, or $\ln(2)$ without qualification. Treats the math as a mere technicality.

  **2. Undefined vs. Infinite (5 marks)**
  *   **5 marks:** Clearly distinguishes undefined (Pasadena) from infinite (St. Petersburg). Explains that St. Petersburg gives a verdict (pay any amount) that conflicts with intuition, whereas Pasadena gives *no* verdict (theory is silent).
  *   **3-4 marks:** Distinguishes the two but fails to articulate why "silence" is a deeper theoretical problem than "counterintuitive verdict."
  *   **0-2 marks:** Confuses undefined with infinite or claims there is no difference.

  **3. Implication for EV Maximization (5 marks)**
  *   **5 marks:** States that EV maximization cannot rank the Pasadena game against other prospects (e.g., cash). Concludes that EV maximization is therefore an incomplete decision rule.
  *   **3-4 marks:** States the theory fails but does not explicitly link this to the inability to rank prospects or completeness.
  *   **0-2 marks:** Claims the theory still works or suggests agents should just guess.

  **4. Altadena and Dominance (5 marks)**
  *   **5 marks:** Acknowledges Altadena dominates Pasadena (higher payoff in every outcome). Correctly argues that while dominance guides choice *between* the two, it does not assign a value to Pasadena *alone* or fix the undefined expectation.
  *   **3-4 marks:** Notes dominance but incorrectly claims it solves the evaluation problem for Pasadena in isolation.
  *   **0-2 marks:** Fails to mention dominance or claims Altadena fixes Pasadena's EV.

  **5. Evaluation of Response & Conclusion (5 marks)**
  *   **5 marks:** Evaluates at least one response (e.g., bounded utility, restriction, alternative criteria) noting its trade-offs. Concludes that standard theory is either incomplete or requires supplementation.
  *   **3-4 marks:** Describes a response but fails to evaluate its limitations or lacks a clear conclusion about decision theory.
  *   **0-2 marks:** No response evaluated or conclusion missing.

  **Guidance for Graders (A vs. B)**
  *   **A Answer (20-25 marks):** Makes all five moves clearly. Points 1 and 2 demonstrate genuine understanding of the mathematics (conditional convergence) rather than using labels loosely. Point 4 clearly isolates why dominance doesn't solve the single-option evaluation problem.
  *   **B Answer (15-19 marks):** Makes 3-4 moves adequately. Common B-level errors include treating the undefined value as a minor technicality, confusing undefined with infinite, or arguing that dominance fully resolves the normative issue.
  *   **Common Mistakes:** Saying EV is zero; saying EV is infinite; claiming rearrangement is irrelevant because probabilities are fixed; thinking Altadena's infinite EV transfers to Pasadena.
