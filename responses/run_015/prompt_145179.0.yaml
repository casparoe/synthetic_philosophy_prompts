answer: |-
  **Requirements**

  1.  **Disease vs. Severity.** The theory must distinguish the categorical presence of a condition from its gravitational weight. *Motivating Case:* A mild viral infection versus aggressive metastatic cancer. Both are diseases, but funding prioritization requires grading severity separately from classification. If the theory collapses these, insurance cannot triage resources between manageable chronic conditions and terminal emergencies. This ensures lists distinguish coverage eligibility from copay tiers. *Tag:* [Non-negotiable].
  2.  **Unhealthy vs. Badly Off.** The theory must separate biological malfunction from general socioeconomic disadvantage. *Motivating Case:* Poverty causes misery and lower life expectancy but is not a medical condition. Insurance mandates cover pathology, not income redistribution. Collapsing these turns healthcare systems into general welfare agencies, diluting medical research funding. This prevents the medicalization of social problems, keeping research focused on physiology. *Tag:* [Non-negotiable].
  3.  **Organism vs. Parts/Traits.** The theory must locate health at the organism level while acknowledging part failure. *Motivating Case:* A failing kidney versus a failing person. Transplants treat parts; palliative care treats the organism. Policy must distinguish reparability to decide between surgical funding versus supportive care budgets. This ensures funding targets the correct level of intervention. *Tag:* [Non-negotiable].
  4.  **Disease vs. Injury.** The theory should allow distinction between internal malfunction and external trauma. *Motivating Case:* Genetic diabetes versus a broken leg from a fall. Insurance pools often separate chronic disease management from accident coverage. While treatable similarly, prevention strategies differ fundamentally. This allows for distinct prevention budgets. *Tag:* [Preference].
  5.  **Beneficial Deviation (Case i).** Statistical deviation from typical capacity cannot define disease if beneficial. *Motivating Case:* A heritable variant lowering typical capacity but extending life in the actual environment. Classifying this as disease would mandate funding to remove a survival advantage. The theory must privilege survival/wellbeing over statistical norms. This prevents pathologizing natural variations that serve adaptive roles. *Tag:* [Non-negotiable]. *[Function-Dependent: Requires defining capacity independent of survival value.]*
  6.  **Universal Impairment (Case ii).** Statistical typicality cannot define health if universal harm exists. *Motivating Case:* A population where everyone receives an intervention lowering capacity, making it typical. Classifying this as healthy denies funding for restorative care everyone needs. Typicality must not override functional assessment. This ensures environmental causes of universal damage are treated as health issues. *Tag:* [Non-negotiable]. *[Function-Dependent: Requires a functional baseline not set by population stats.]*
  7.  **Latent Pathology (Case iii).** Health status must be assignable pre-symptomatically based on trajectory. *Motivating Case:* An asymptomatic gene carrier years before onset. If health is only current capacity, this person is healthy; if over a life, they are not. Insurance needs to know risk now to price premiums or fund prevention. This allows for preventative coverage rather than just acute care. *Tag:* [Non-negotiable]. *[Function-Dependent: Assumes future function is determinable by current state.]*
  8.  **Empirical Mechanism.** Disease classification should correlate with identifiable biological mechanisms. *Motivating Case:* Medically unexplained symptoms versus known pathogens. Funding research requires hypothesizing a mechanism to investigate. Without this, research money dissipates into purely symptomatic management without cure development. This ensures tax dollars fund solvable biological problems. *Tag:* [Preference].

  **Conflicts**

  Two subsets of these requirements create significant tension for any single theory. First, Requirement 8 (Empirical Mechanism) conflicts with Requirement 6 (Universal Impairment) in cases of environmental toxicity. If a toxin universally lowers capacity, the "mechanism" is external, not an internal dysfunction. A theory demanding internal biological failure to classify disease may fail to cover universal environmental harms, leaving victims without funding. Second, Requirement 7 (Latent Pathology) tensions with Requirement 5 (Beneficial Deviation). Classifying based on life trajectory (7) assumes a stable environment, but Requirement 5 insists on evaluating based on the *actual* environment. If the environment shifts, a latent pathology might become beneficial, or vice versa. A theory fixing health status at time *t* contradicts the life-course view needed for insurance risk assessment. These conflicts suggest no theory can satisfy all desiderata without compromising either biological objectivity or environmental sensitivity.

  **The binding constraint**

  Requirement 5 (Beneficial Deviation) combined with Requirement 6 (Universal Impairment) acts as the binding constraint. Together, they dictate that statistical typicality is neither necessary nor sufficient for health. This single constraint rules out pure Biostatistical Naturalism (like Boorse's), which defines health strictly as statistical typicality of function. It also pressures Pure Normativism, which might struggle to explain why universal impairment is unhealthy without referencing a biological baseline. Consequently, this constraint forces any adequate theory toward a hybrid model that incorporates both biological function and normative harm, excluding the purest contenders on both sides of the debate.

  **Scorecard**

  | View | Cases (i) & (ii) | Case (iii) | Empirical Mechanism | Unhealthy vs. Badly Off |
  | :--- | :--- | :--- | :--- | :--- |
  | **Boorse (Biostatistical)** | **Fail** (Relies on typicality) | Pass | Pass | Pass |
  | **Wakefield (Harmful Dysfunction)** | **Pass** (Requires harm + dysfunction) | Pass | Pass | Pass |
  | **Normativist (Vital Goals)** | Pass | Pass | **Fail** (Ignores mechanism) | **Fail** (Collapses welfare) |

  *Boorse fails the binding constraint. Normativists fail the distinction between health and general wellbeing. Wakefield remains the strongest candidate for this specific policy purpose.*
