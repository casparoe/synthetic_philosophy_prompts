answer: |-
  This is an excellent set of questions. You have identified exactly where the "easy" summaries of metaontology break down and where the real philosophical work begins. The distinction between verbal and substantive disputes is the engine of much contemporary metaontology, but as you suspect, the criterion for drawing that line is notoriously difficult to formalize without begging the question.

  Here is a careful walkthrough of the disambiguation criterion, its failure modes, and how the Quine–Carnap debate relates to it.

  ---

  ### (a) The Disambiguation Criterion: Precision and Rationale

  The intuition you mentioned—that a dispute is verbal if it dissolves upon fixing meanings—is often called the **Disambiguation Criterion**. In contemporary literature, David Chalmers ("Verbal Disputes," 2011) provides the most rigorous formulation. We can state it roughly as follows:

  **The Criterion:**
  A dispute between party A and party B over a sentence $S$ (containing a contested term $t$) is *merely verbal* if and only if:
  1.  There are two distinct interpretations (meanings), $I_1$ and $I_2$, of the term $t$.
  2.  Under $I_1$, A accepts $S$ and B rejects $S$.
  3.  Under $I_2$, A rejects $S$ and B accepts $S$.
  4.  **Crucially:** Once $I_1$ or $I_2$ is fixed, there is no remaining disagreement about the *non-linguistic facts*. That is, A and B agree on the underlying state of the world that makes $S$ true under $I_1$ or $I_2$.

  **Why this is supposed to track "merely verbal" disputes:**
  The rationale is that language is often imprecise or context-sensitive. If two people are looking at a bowl of fruit and one says "There are three objects" (counting apples) and the other says "There are six objects" (counting apples and halves), they disagree on the sentence but agree on the arrangement of matter.

  The criterion relies on the idea of a **shared factual core**. If we can translate both parties into a neutral language where they affirm the same propositions about the world, the original disagreement was purely about which linguistic label to apply to that world. The disagreement is located in the map, not the territory.

  ---

  ### (b) Where the Criterion Fails: Quantifier Variance and Joint-Carving

  You are right to suspect the criterion is not decidable. The most significant failure case arises in **metaontology itself**, specifically in the debate over **Quantifier Variance**.

  **The Case: Mereological Nihilism vs. Universalism**
  *   **Nihilist:** "There are no tables. There are only simples arranged tablewise." (Rejects "There exists a table.")
  *   **Universalist:** "There are tables. Whenever there are simples arranged tablewise, a table exists." (Accepts "There exists a table.")

  **Applying the Disambiguation Criterion:**
  A proponent of verbalism (like Eli Hirsch) argues this dispute is verbal.
  *   *Interpretation 1 (Nihilist's 'exists'):* Quantifies only over fundamental simples.
  *   *Interpretation 2 (Universalist's 'exists'):* Quantifies over simples and composites.
  *   *The Claim:* Both parties agree on the "shared factual core" (the arrangement of simples). They only disagree on whether the word "exists" applies to composites. Therefore, disambiguation dissolves the dispute.

  **Why the Criterion Fails (Ted Sider's Critique):**
  The philosopher Ted Sider (*Writing the Book of the World*) argues that the disambiguation criterion fails here because it assumes a **neutrality** that does not exist.

  1.  **The Problem of Privilege:** The criterion assumes that $I_1$ and $I_2$ are on equal footing—that neither is "more correct" about the world. But Sider argues that logic and ontology aim to "carve nature at its joints." There is a single, **elite meaning of the quantifier** ($\exists$) that reflects the fundamental structure of reality.
  2.  **Re-emergence of Disagreement:** If there is an elite meaning of "exists," then the dispute is not verbal. One party is using the elite meaning, and the other is using a deviant meaning. If we "disambiguate" by forcing both to use the elite meaning, one party must admit they were wrong about the *world*, not just their words.
  3.  **No Neutral Language:** To state the "shared factual core" (e.g., "simples arranged tablewise"), you must use quantifiers ("There *are* simples..."). If the meaning of the quantifier itself is what is being disputed, you cannot state the shared core in a neutral language. You have already presupposed an ontology to describe the "agreement."

  **Why this makes the criterion indeterminate:**
  To apply the disambiguation criterion, you must be able to identify the "non-linguistic facts" independently of the language used to describe them. But in deep ontological disputes, the parties disagree on *what the facts are*. The Nihilist thinks the only facts are about simples; the Universalist thinks there are *additional* facts about composites.
  *   If you assume the Nihilist is right, the dispute looks verbal (Universalist is just adding words).
  *   If you assume the Universalist is right, the dispute looks substantive (Nihilist is missing real objects).
  *   The criterion cannot decide between these without already settling the ontology, which is circular.

  ---

  ### (c) Mapping Quine and Carnap onto the Disambiguation Criterion

  This is the crux of your confusion, and it is a very common one. The short answer is: **Carnap is not using the Disambiguation Criterion.** He is making a stronger, more radical claim.

  #### 1. Carnap: Pseudo-Questions, Not Verbal Disputes
  If Carnap were using the disambiguation criterion, he would be saying: "The realist and the idealist mean different things by 'real,' but if we fix the meaning, they will agree on the world."

  But Carnap's position in *Empiricism, Semantics, and Ontology* (ESO) is different. He distinguishes between:
  *   **Internal Questions:** Questions asked *within* a linguistic framework (e.g., "Is there a white piece of paper on my desk?" within the "thing" framework). These have cognitive, factual answers (true/false).
  *   **External Questions:** Questions about the *existence of the framework itself* (e.g., "Do numbers *really* exist?" or "Do physical objects *really* exist?").

  Carnap argues that External Questions, when asked as **theoretical** questions, are **pseudo-questions**. They have no cognitive content. They are not "merely verbal" disputes where both sides are describing the world differently; rather, the question itself is malformed if it seeks a factual answer.
  *   **Theist/Atheist Application:** If the question is "Does God exist?" treated as an internal empirical claim (e.g., "Did an agent intervene in history?"), it is testable (internal). But if treated as an *ontological* claim ("Does the entity 'God' have reality independent of the religious framework?"), Carnap classifies this as External.
  *   **Verbal vs. Pseudo:** A verbal dispute implies there *is* a fact of the matter, but the speakers are confused. Carnap says there is *no* fact of the matter for External Questions. The only legitimate External questions are **pragmatic**: "Is it *useful* to adopt the theistic framework?" This is not a truth-apt claim; it's a practical recommendation.

  So, Carnap is not saying the dispute is verbal (disambiguation); he is saying the dispute is **non-cognitive** (deflationary).

  #### 2. Quine: Ontology is Substantive and Continuous with Science
  Quine's "On What There Is" is a direct response to this Carnapian deflationism. Quine rejects the Disambiguation Criterion *and* Carnap's Framework/External distinction.

  *   **Rejection of Analytic/Synthetic:** Quine argues (famously in "Two Dogmas of Empiricism," but presupposed in "On What There Is") that you cannot cleanly separate "linguistic conventions" (frameworks) from "factual claims." Our theories face the tribunal of experience as a whole web.
  *   **Criterion of Ontological Commitment:** Quine proposes a substantive criterion: **"To be is to be the value of a bound variable."**
      *   We look at our best scientific theories.
      *   We see what entities must exist for the quantified statements in those theories to be true.
      *   If our best physics quantifies over electrons, electrons exist. If our best mathematics quantifies over sets, sets exist.
  *   **Against Carnap:** Quine argues there is no "external" pragmatic standpoint from which we can choose a framework without incurring ontological commitment. Even to say "I am adopting the number framework pragmatically" is to quantify over frameworks, thus committing oneself to frameworks.
  *   **Against Disambiguation:** For Quine, the dispute between the nominalist (no numbers) and the Platonist (numbers exist) is **substantive**. It is not that they mean different things by "exist." They mean the same thing (bound variables), but they disagree on which theory (and thus which ontology) best simplifies our overall account of experience.

  #### 3. Summary of the Mapping

  | Feature | Disambiguation Criterion (Chalmers/Hirsch) | Carnap (ESO) | Quine ("On What There Is") |
  | :--- | :--- | :--- | :--- |
  | **Nature of Dispute** | Parties mean different things by key terms. | External questions are pseudo-questions (non-cognitive). | Disputes are substantive theoretical disagreements. |
  | **Resolution** | Fix meanings; agreement emerges on facts. | Reject the question; ask pragmatic utility instead. | Adopt the ontology of our best scientific theory. |
  | **Status of "Exists"** | Ambiguous / Context-sensitive. | Internal = Logical/Empirical; External = Pragmatic. | Univocal (tied to the logical quantifier $\exists$). |
  | **Theist/Atheist** | Verbal if they agree on empirical world. | Pseudo-question if asking about "Reality" of God. | Substantive if "God" is posited by best theory (Quine thinks He isn't). |

  **Conclusion on your specific question:**
  Carnap's move is **not** best understood as showing the dispute is merely verbal in the disambiguation sense. It is the stronger claim that the ontological question is a **pseudo-question** lacking truth conditions.

  Quine's reply targets this specifically. He argues that we cannot step outside our theory to judge it pragmatically without ontological commitment. Therefore, the "External" question collapses back into an "Internal" theoretical question, making ontology substantive, not verbal, and not pseudo. Quine forces us to admit that when we say "Numbers exist," we are making a factual claim about the world, just as much as when we say "Electrons exist."

  ### Final Thought for the Rationalist Reader
  Since you come from the rationalist forums, you might recognize this dynamic. The "Disambiguation Criterion" is very popular in rationalist circles (often under the banner of "dissolving the question").
  *   **Carnap** is like saying: "This question is a bug in your cognitive architecture; stop asking it and ask what utility you want."
  *   **The Disambiguation Approach** is like saying: "You two are using different definitions; here is the shared causal model you both accept."
  *   **Quine** is like saying: "Your definitions are tied to your predictive models. If your model requires X to make accurate predictions, X is real. Stop trying to separate the map from the territory."

  Quine wins on naturalistic grounds (we can't actually step outside science), but Carnap wins on the intuition that ontological debates often feel sterile. The "Disambiguation Criterion" tries to split the difference, but as the Quantifier Variance case shows, it often lacks the tools to do so without presupposing the answer.
