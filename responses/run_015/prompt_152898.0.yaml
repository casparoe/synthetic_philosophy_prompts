answer: |-
  # TAXONOMY OF INDIFFERENCE: A Decision-Tree for Rational Choice
  **Seminar Handout | Choice Without Preference**

  This diagnostic sorts theoretical commitments regarding "Buridan's Ass" scenarios. Follow the path that matches your metaphysical and normative intuitions. **Bold text** indicates the branching claim.

  ### 1. The Ontology of the Tie
  **Claim:** *The agent judges Options A and B to be of exactly equal value.*
  *   **A.** This equality is **Epistemic** (due to ignorance/limits of measurement; a hidden difference likely exists).
      *   → *Go to Standard Decision Theory (Leaf 1).*
  *   **B.** This equality is **Metaphysical** (no hidden difference exists; values are objectively identical).
      *   → *Proceed to Question 2.*

  ### 2. The Possibility of Indifference
  **Claim:** *Can a rational mind genuinely sustain a state of perfect metaphysical indifference?*
  *   **A.** **No.** (The Principle of Sufficient Reason: if the agent chooses A, there must have been a prior determining reason, however minute).
      *   → *Go to Leibnizian Determinism (Leaf 2).*
  *   **B.** **Yes.** (The will can confront genuine equilibrium without a determining cause).
      *   → *Proceed to Question 3.*

  ### 3. The Permission to Choose
  **Claim:** *Given perfect indifference, does rationality permit choosing one option arbitrarily?*
  *   **A.** **Yes.** (Rationality requires maximizing value; since A=B, picking either satisfies the requirement).
      *   → *Proceed to Question 4.*
  *   **B.** **No.** (Choice without a differentiating reason is irrational/arbitrary; one lacks sufficient warrant to act).
      *   → *Proceed to Question 5.*

  ### 4. The Mechanism of Resolution
  **Claim:** *If arbitrary choice is permitted, how is the tie broken?*
  *   **A.** **Internal Volition.** (The will itself is a causal source; a "bare choice" is sufficient).
      *   → *Go to Voluntarism / Permissive DT (Leaf 3).*
  *   **B.** **External Randomizer.** (Choosing directly is arbitrary, but choosing *to flip a coin* is a rational procedure).
      *   → *Go to Procedural Randomization (Leaf 4).*
      *   *(Note: If you think Internal Volition is forbidden but External Randomizer is permitted, see Empty Node A).*

  ### 5. The Requirement of Suspension
  **Claim:** *If arbitrary choice is forbidden, must the agent suspend action?*
  *   **A.** **Yes.** (Without a reason to prefer, inaction is the only rational stance).
      *   → *Go to Buridanian Stasis (Leaf 5).*
  *   **B.** **No.** (Inaction is also a choice without reason; one must find a second-order motive).
      *   → *Proceed to Question 6.*

  ### 6. The Second-Order Volition
  **Claim:** *To escape suspension, must the agent desire "to decide" more than they desire A or B?*
  *   **A.** **Yes.** (A higher-order preference for resolution breaks the first-order tie).
      *   → *Go to Hierarchical / Frankfurtian (Leaf 6).*
  *   **B.** **No.** (If first-order reasons don't dictate, second-order won't either; return to Stasis or Randomizer).
      *   → *See Empty Node B.*

  ---

  ### THE LEAVES: Theoretical Positions

  **Leaf 1: Standard Decision Theory (Epistemic View)**
  *   **Commitment:** Indifference is just a limitation of the model or agent.
  *   **Outcome:** Pick either; expected utility is identical.
  *   **Status:** *Orthodox in Economics.*

  **Leaf 2: Leibnizian Determinism**
  *   **Commitment:** Perfect indifference is impossible. If A is chosen, a "petite perception" favored it.
  *   **Outcome:** The scenario is a conceptual error; the ass always eats.
  *   **Status:** *Metaphysically robust, psychologically contested.*

  **Leaf 3: Voluntarism / Permissive DT**
  *   **Commitment:** The will can act without a prior determining reason (Liberty of Indifference).
  *   **Outcome:** Arbitrary selection is rational because A and B are both maximal.
  *   **Status:** *Common in Modern Philosophy; rejected by Strict Rationalists.*

  **Leaf 4: Procedural Randomization (e.g., Rescher)**
  *   **Commitment:** Direct choice is arbitrary, but adopting a randomizing *procedure* is reasoned.
  *   **Outcome:** Flip a coin. It transforms an arbitrary choice into a rational strategy.
  *   **Status:** *Contested: Is this outsourcing agency or refining it?*

  **Leaf 5: Buridanian Stasis (Medieval Logic)**
  *   **Commitment:** Rationality forbids selection without a differentiating reason.
  *   **Outcome:** Agent suspends choice indefinitely (starvation).
  *   **Status:** *Generally rejected as implausible psychology; retained as a normative warning.*

  **Leaf 6: Hierarchical / Existentialist**
  *   **Commitment:** Value is created by the choice, or a second-order desire to "not be stuck" overrides the tie.
  *   **Outcome:** Choice is justified by the desire for agency itself.
  *   **Status:** *Contested: Risks infinite regress of orders.*

  ---

  ### EMPTY NODES: Incoherent Combinations

  **Empty Node A: "Direct Choice Forbidden, Randomizer Permitted"**
  *   **The Claim:** You cannot pick A over B directly, but you can pick "Flip Coin" over "Don't Flip."
  *   **Why Empty:** If you lack a reason to pick A, you lack a reason to pick the *procedure* that picks A. Unless the *procedure* itself has independent value (fairness), this is just kicking the can.
  *   **Verdict:** *Unstable without a theory of procedural value.*

  **Empty Node B: "Suspension Forbidden, Second-Order Unnecessary"**
  *   **The Claim:** You must not stay stuck, but you don't need a higher desire to move.
  *   **Why Empty:** If first-order reasons are equal and second-order reasons are absent, what moves the agent? This implies a "random twitch" without volition.
  *   **Verdict:** *Incoherent theory of agency.*

  ---

  ### CONSENSUS VS. CONTESTATION

  | Issue | Status | Note |
  | :--- | :--- | :--- |
  | **Epistemic Indifference** | *Settled* | Widely accepted as common; handled by standard probability. |
  | **Metaphysical Indifference** | *Contested* | Leibnizians deny it exists; Libertarians affirm it. |
  | **Rationality of Arbitrary Choice** | *Contested* | Is "no reason" a valid reason? (Permissive vs. Strict). |
  | **Randomization as Rational** | *Contested* | Is it a solution or an admission of failure? |
  | **Buridanian Starvation** | *Settled (Negative)* | Almost no one thinks actual agents starve; debate is normative. |

  *Use this map to locate your own view before arguing for it.*
