      *   *The "Threshold" Problem:* Most theories focus on *what* is wrong (e.g., is lying wrong?). Few handle *how much* lying is wrong before it breaches a threshold. This suggests a need for a theory that treats moral norms as scalar or context-sensitive, not just binary rules.
      *   *The "Group Swap" Probe:* This tests for impartiality/particularism. If swapping groups changes the verdict, it suggests partiality (loyalty bias). But is impartiality the gold standard? Some ethical systems (confucian, care ethics) prioritize partiality. So demanding impartiality might be smuggling in Western liberal individualism.
      *   *Historical Change:* How to explain why slavery was once "okay" and now isn't? Realists say we discovered the truth. Relativists say values changed. Error theorists say we were wrong then, maybe wrong now. A good theory needs to allow for *progress* without assuming *all* change is progress.
