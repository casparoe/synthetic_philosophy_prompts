answer: |-
  You have stumbled onto a very specific, sophisticated niche of strategic studies without the jargon. You are describing a posture that is distinct from standard neutrality or standard deterrence.

  The short answer is that the posture as a whole is best described in security studies as **Non-Offensive Defense (NOD)** or **Defensive Defense**.

  However, your specific insight about the *difficulty of changing* that posture is the more interesting theoretical variable. In political science and strategic theory, that specific feature is usually discussed under the concepts of **Credible Commitment**, **Self-Binding**, or **Breakout Potential**.

  Here is the breakdown of the concepts, how they differ from what you might find in a textbook, and an answer to your specific question about technical vs. institutional incapacity.

  ### 1. The Posture: Non-Offensive Defense (NOD)
  You correctly identified that "Deterrence by Denial" is incomplete. Denial simply means "If you attack, you will not succeed." It does not inherently assure neighbors that *you* won't attack *them*. A porcupine deters by denial, but a porcupine could theoretically roll into a neighbor's house if it grew legs.

  **Non-Offensive Defense** is the doctrinal term for a military structure designed to be highly effective within one's own borders but structurally incapable of projecting power beyond them.
  *   **Key features:** Heavy reliance on reservists (who must return to civilian jobs), lack of strategic transport (no airlift/naval lift), short-range artillery, and defensive fortifications.
  *   **The Dual Signal:** It signals to a potential invader: "Conquest will be too costly." It signals to neighbors: "We physically cannot invade you."

  **Why "Armed Neutrality" isn't enough:** Neutrality is a legal or political status (a promise). NOD is the *physical verification* of that promise. Switzerland is the archetype here. During the Cold War, the Swiss army was formidable in the Alps but had zero capacity to cross the Rhine into Germany or France.

  ### 2. The "Reversal Cost": Self-Binding and Breakout
  You asked if there is a word for the feature where regaining offensive capacity takes years and requires a domestic political fight. You called it "reversal cost." In strategic theory, this is the mechanism that makes the reassurance **credible**.

  In game theory (specifically Thomas Schelling's work on conflict), a promise is only worth anything if it is costly to break. If a country says "We won't attack you," but keeps a standing offensive army, that promise is "cheap talk."

  To make the promise stick, the country engages in **Self-Binding**. They intentionally restrict their own future options to prove their current intentions.

  The metric you are looking for is **Breakout Potential** (or **Breakout Time**).
  *   **Low Breakout Potential:** To become offensive, the state needs new laws, new bases, new cultural buy-in, and new procurement. (This is what you observed).
  *   **High Breakout Potential:** The state is peaceful now, but has the money, industry, and legal framework to switch to war footing in 6 months.

  **Is "Reversal Cost" a separate variable?**
  Yes. You can have Non-Offensive Defense *without* high reversal costs (e.g., a small rich country that just chooses not to buy tanks but could buy them tomorrow). But without the high reversal cost, the **Reassurance** value drops precipitously. The "waste of money" you noticed (keeping equipment short-range, dismantling bases) is actually an investment in *political capital* with neighbors, not just military capital.

  ### 3. Technical vs. Institutional Incapacity (Your Specific Comparison)
  You posed this scenario:
  *   **State A:** Militarily feeble today, but could buy the kit in a year (Technical/Financial constraint).
  *   **State B:** Has kit in storage, but has dismantled the legal/institutional basis for using it (Institutional/Political constraint).

  **Your guess is correct: State B provides more reassurance.**

  Here is why, based on how intelligence analysts and strategists evaluate threat:

  **1. Fungibility of Money vs. Friction of Politics**
  State A's incapacity is **fungible**. Money can solve it. If a crisis erupts, State A can write a check. The "reversal cost" is low.
  State B's incapacity is **structural**. To become offensive, State B doesn't just need money; it needs to pass laws, retrain officers, reopen closed bases (which might be built over), and shift public consensus. This creates a "lag time" that neighbors can observe.

  **2. Observability (Transparency)**
  Institutional constraints are more transparent than financial ones.
  *   If State A is saving money to buy tanks, that happens in bank accounts and closed procurement meetings.
  *   If State B needs to repeal a "Defensive Only" act in parliament, that is a public, noisy, televised process. Neighbors get months or years of warning before State B becomes a threat.

  **3. The "Tripwire" Effect**
  In State B, the legal/institutional barriers act as a domestic tripwire. Any politician trying to switch to an offensive posture triggers a massive constitutional or political crisis. This internal friction acts as a brake on aggression. State A has no internal brake, only a wallet.

  **So, what is the work doing?**
  The work is being done by **Credible Commitment**. State B has "burned the bridge" behind them. State A has just parked the car. State B is safer to be neighbors with, even if State A is currently weaker, because State B's *trajectory* is locked.

  ### 4. Nearby Concepts and Edges
  To help you map this mentally, here are the concepts that sit next to this, and how they differ:

  *   **Deterrence by Punishment:** "If you attack, we will nuke your cities." (Distinct from your scenario; this is offensive capability used defensively).
  *   **Deterrence by Denial:** "If you attack, you will lose the battle." (Part of your scenario, but misses the reassurance aspect).
  *   **Confidence and Security Building Measures (CSBMs):** These are treaties (like in the OSCE) where countries agree to limit maneuvers or share data. Your scenario is a *unilateral* CSBM. It's a CSBM built into the constitution and the supply chain rather than a treaty.
  *   **Latency:** Often used in nuclear proliferation (a country has the tech but not the bomb). In your context, State A has high conventional latency. State B has low latency.
  *   **Strategic Culture:** This explains *why* the country chose this. (e.g., "We are a trading nation, war is bad for business"). This supports the institutional constraints but isn't the constraints themselves.

  ### 5. Summary Terminology
  If you need to label this in your notes, I would suggest a combination:

  1.  **Posture:** **Non-Offensive Defense (NOD)**.
  2.  **Mechanism:** **Institutionalized Self-Binding**.
  3.  **Metric:** **High Breakout Cost**.

  **The "Word" you are looking for:**
  If you want a single phrase that captures the "weakness that is actually a strength because it's hard to reverse," the closest established term is **"Strategic Incapability"** used as a **"Credible Commitment."**

  However, in the specific literature on European neutrals (like Switzerland or Sweden during the Cold War), this is often referred to as **"Defensive Dissuasion."** It dissuades the enemy from attacking (denial) and dissuades the neighbor from fearing you (reassurance).

  **Verdict on your intuition:**
  You are absolutely right that the "waste of money" (dismantling offensive capacity) is the feature, not a bug. It is the price paid for reassurance. And you are right that institutional/legal barriers provide more stability than mere technical lack. A country that *cannot* attack (legally/structurally) is a better neighbor than a country that *does not* attack (currently).

  The specific friction you noticed—the need for new conscription laws, the bases built over—is what security scholars call **"raising the mobilization threshold."** By raising that threshold, the state makes aggression not just militarily hard, but politically expensive. That is the core of the reassurance.
