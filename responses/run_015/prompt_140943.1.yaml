      *   *Exposure:* "I carry the costs." (All-subjected principle). Fits residents/taxpayers/draftees, fails on expats.
      *   *Stake/Association:* "Life plan bound up with place." (Communitarian). Fits long-term residents, maybe fails on expats who left decades ago.
      *   *User's suspicion:* The buckets might be wrong or incomplete.

  3.  **Analyze the Current Practice (The "Package"):**
      *   *Expats vote:* Why? Cultural membership, property ownership back home, remittances, lobbying power. It's about *identity* and *potential return*, not current exposure.
      *   *Residents don't vote:* Why? Sovereignty, fear of dilution, assumption that citizenship = loyalty/permanence.
      *   *Draft without vote:* Why? Security imperative trumps democratic consistency. The state's survival > individual consent.
      *   *Local voting:* Why? Pragmatism. Trash collection and schools affect you *now*, regardless of national loyalty. Lower stakes.

      *   *Synthesis:* The current system isn't one theory. It's a *layered* system. National = Ethnos/Citizenship (Identity + Continuity). Local = Demos/Residence (Exposure + Stake).
      *   *The "Fourth Bucket":* Stability/Continuity is crucial. The "Intergenerational Community." Citizenship is a trust fund passed down; residence is a rental agreement.

  4.  **Evaluate Coherence:**
      *   Is it one story? No. It's a compromise between *Popular Sovereignty* (the people rule) and *State Sovereignty* (the state persists).
      *   The "load-bearing" parts: Citizenship as a proxy for "permanent stake."
      *   The "accidental" parts: The draft inconsistency, the specific length of time for expat voting.

  5.  **Develop the Counterfactual (Pure "Affected Interests"):**
      *   *Principle:* All Affected Interests (AAI).
      *   *Implications:*
          *   Borderless elections? (Hard to administer).
          *   Foreigners affected by climate/monetary policy vote? (Yes, logically).
          *   Future generations? (Proxy guardians).
          *   Children? (Lower voting age or parental proxy).
          *   Expats? (Disenfranchised once unaffected).
          *   Tourists/Short-term? (Maybe vote on local issues).
      *   *Reductio?* It leads to administrative chaos ("boundary problem" recurs). Who decides who is affected? It creates a "meta-demos" problem.

  6.  **Drafting the Response (Iterative Process):**
      *   *Tone:* Intellectual peer, conversational, analytical. No academic jargon unless explained.
      *   *Structure:*
          1.  Validate the user's intuition (the buckets are good but the picture is messier).
          2.  Address the "Package" (National vs. Local distinction).
          3.  Analyze the Buckets (Authorship vs. Exposure vs. Stake). Introduce "Continuity/Trust."
          4.  The "Settlement" theory (It's not one logic, it's a truce).
          5.  The Counterfactual (AAI principle consequences).
          6.  Underdetermination (What is philosophy vs. accident).

      *   *Refining the Argument:*
          *   *On Expats:* It's not just "usefulness." It's that citizenship is treated as an *indelible status*, not a functional contract. It's about *who you are*, not *where you are*.
          *   *On Residents:* Exclusion is about the fear of the "transient." Citizenship is a bond of *permanence*.
          *   *On Local Voting:* This proves Exposure *does* matter, but only where the stakes are low enough not to threaten national identity.
          *   *On the Draft:* This is the smoking gun that breaks the "consent" theory. It reveals the state is ultimately about *coercion and survival*, not just democracy.
          *   *On the Counterfactual:* If we go pure AAI, the "nation-state" dissolves. Elections become referendums on specific policies for specific groups. It's unworkable as a *system of government*, though morally attractive.

      *   *Addressing "Underdetermination":*
          *   *Load-bearing:* The link between citizenship and the *long-term* fate of the polity.
          *   *Accidental:* The draft inconsistency, the specific rules for expats (some countries cut it off, some don't).

  7.  **Final Polish:** Check against constraints. No footnotes. No "As Foucault said." Keep it focused on the argument. Ensure the journalist voice is respected (they want *copy-worthy ideas*, not a lecture).

      *(Self-Correction during drafting)*: I need to make sure I don't just say "it's inconsistent." I need to explain *why* the inconsistency persists. It persists because it serves different functions. National voting = Constituting the People. Local voting = Managing the Territory.

      *(Refining the "Fourth Bucket")*: The user suggested "Stability." I should expand that to "Intergenerational Continuity." Citizenship is a chain of debt and obligation across time. Expats are still on the chain; residents haven't joined the chain yet.

      *(Refining the Counterfactual)*: Make it vivid. "Functional Constituencies." If the Fed sets rates, borrowers and savers vote. If Parliament declares war, soldiers and families vote. This shows why we don't do it: it fragments the polity.

  8.  **Final Review:** Does this answer the specific questions?
      *   What theory does it presuppose? (A hybrid: Ethno-cultural for national, Functional for local).
      *   Evaluate buckets? (Authorship fits national, Exposure fits local, Stake is the bridge).
      *   Fourth thing? (Permanence/Continuity).
      *   Counterfactual? (Chaos/Fragmentation).
      *   Underdetermination? (Draft is accident, Citizenship boundary is philosophical).

      Okay, ready to write.
answer: |-
  This is a great puzzle because it exposes the seam where political philosophy meets the messy machinery of the state. You're right to feel that the current arrangement doesn't sit on a single logical foundation. If you try to balance it on one leg, it falls over.

  Let's take your buckets first, because they are solid, but I think you're right to suspect they aren't exhaustive.

  **Authorship** ("The law is in my name") is the classic democratic justification. It works beautifully for the citizen at home. It works poorly for the expat who hasn't seen the country in 30 years (how are they authoring laws they don't live under?). It fails completely for the resident taxpayer (they are subject to the law but aren't authors).

  **Exposure** ("I carry the costs") is the strongest moral argument for the resident taxpayer and the draftee. It's the "no taxation without representation" logic. But if this were the governing principle, expats would lose the vote immediately upon leaving, and non-citizen residents would automatically gain it. The fact that they don't tells us Exposure is *not* the primary logic of national elections.

  **Stake/Association** ("My life plan is here") is the bridge. It explains why tourists don't vote and why long-term residents *should*. But it's too vague to explain why the expat who left in 1980 still has a stronger claim than the resident who arrived in 1990.

  So, here is the fourth bucket you were sniffing around, and I think it's the load-bearing one: **Permanence and Continuity.**

  The modern nation-state treats citizenship not as a contract based on current utility (Exposure), but as a membership in an intergenerational project. It is a trust. The "People" is conceived as a entity that stretches backward and forward in time, not just a snapshot of who is currently standing on the soil.

  This explains the expat. They are treated as members of the *family* who have moved away. The assumption is that their identity is still bound to the national project, they might return, and crucially, they hold the citizenship "in trust" for their children. It's about lineage and belonging, not current impact.

  This explains the exclusion of the long-term resident. Until they naturalize, they are treated as guests, however long-staying. The state is saying: "You are part of our economy and our society, but you are not part of our *fate*." Naturalization is the ritual where you switch from being a stakeholder in the *place* to a stakeholder in the *polity*.

  This explains the local/national split. Local elections are about *management* (trash, schools, zoning). These are functional issues where Exposure is the right metric. If you live here, the garbage truck affects you. National elections are about *sovereignty* (war, treaties, constitutional identity). These are existential issues where Permanence is the right metric. The EU rule you mentioned fits this perfectly: EU citizens can vote locally in other member states because the EU treats national sovereignty as the hard shell, and local administration as permeable.

  So, to answer your question about what theory the practice presupposes: It presupposes a **two-tier theory**.
  1.  **National Level:** The "Demos" is a community of fate defined by legal membership (citizenship), prioritizing continuity and identity over current exposure.
  2.  **Local Level:** The "Demos" is a community of interest defined by residence, prioritizing exposure and stake.

  The draft inconsistency you pointed out is the crack in the wall. That is the moment the mask slips. The state claims the right to sacrifice you (Exposure/Coercion) without granting you the right to author that sacrifice (Authorship). This suggests that underneath the democratic theory lies a darker, older reality: the state is ultimately a sovereign entity that demands survival, and democracy is a luxury it grants only to those it considers "its own." The draft proves that obligation precedes consent.

  **Is it a coherent settlement or a mess?**
  It's a settlement between two incompatible ideas that we pretend are one.
  Idea A: Democracy is about self-rule (Authorship).
  Idea B: The State is a persistent entity that must survive across generations (Continuity).

  If we followed Idea A strictly, residents would vote and expats wouldn't. If we followed Idea B strictly, maybe only property owners or heads of households would vote (those with a permanent stake). The current system is a compromise: we use Citizenship as a proxy for "Permanent Stake." It's imperfect (as your expat example shows), but it's a bright line that is easy to administer.

  **The Counterfactual: Pure "Affected Interests"**
  Now, let's run the thought experiment. If we adopted the principle of "All Affected Interests" (AAI) strictly, without the citizenship firewall, elections would become unrecognizable.

  1.  **The Boundary Problem:** First, you have to decide *which* elections. If a country sets interest rates, that affects global markets. Do foreign investors vote? If a country sets carbon policy, it affects the global climate. Do island nations vote in US elections?
      *   *Result:* You end up with functional constituencies rather than geographic ones. You wouldn't vote for a "Representative," you'd vote on specific issues where you are affected. A farmer in Canada might vote in the US Farm Bill election. A worker in Mexico might vote in the US Immigration election.

  2.  **The Temporal Problem:** If "affected" includes the future, then we must enfranchise the unborn.
      *   *Result:* You'd need guardians for future generations. Maybe a lower voting age, or a "proxy vote" for parents based on family size, or an independent ombudsman for the future with veto power.

  3.  **The Instability Problem:** This is the reductio. If the "People" changes based on the issue at hand, there is no stable "People."
      *   *Result:* Democracy requires a *demos* that persists long enough to hold the government accountable. If the electorate for the war vote is different from the electorate for the tax vote, no coalition can be held responsible for the overall outcome. You can't throw the bums out if the "bums" were elected by a different group of people than the ones who are angry at them.

  So, is AAI a reductio? Yes, practically. It dissolves the nation-state. It leads to a kind of global, issue-based plebiscite system. It's morally purer regarding Exposure, but it destroys the mechanism of Accountability (Authorship).

  **Underdetermination: Philosophy vs. Accident**
  You asked where the practice is underdetermined. Here is the split:

  **Load-Bearing (Philosophical Necessity):**
  *   **The Citizenship Boundary:** Almost any theory of democracy needs a way to define the boundary of the "self" that is ruling. Whether it's birth, blood, or naturalization, you need a bright line to distinguish the member from the guest. Without this, you don't have a democracy; you have an open meeting.
  *   **The Local/National Split:** This is philosophically robust. It acknowledges that "impact" matters for administration, but "membership" matters for sovereignty.

  **Accidental (Historical Contingency):**
  *   **The Draft:** This is a hangover from pre-democratic statecraft. There is no democratic theory that justifies conscripting non-voters. This is pure state survival instinct overriding democratic logic.
  *   **Expat Voting Rules:** The fact that some countries allow lifetime expat voting and others (like Australia, as you noted) cut it off after 6 years shows this is negotiable. It depends on whether the country views itself as a "Nation of Blood" (diaspora is forever part of us) or a "Nation of Residence" (if you leave, you opt out).
  *   **The Age of Voting:** We say 18 is the line for "Authorship," but we allow 16-year-olds to work and pay taxes (Exposure). This is arbitrary.

  **The Pitch for Your Column**
  If I were framing this for your piece, I'd argue that we are lying to ourselves about what "The People" is. We say it's "We the People," implying a group of authors governing themselves. But in practice, "The People" is a **hereditary corporation**.

  Citizenship is shares in the corporation. You inherit them. You can keep them even if you move abroad (like a shareholder living overseas). Long-term residents are like long-term employees without stock options—they benefit from the company, work for the company, but don't vote at the AGM.

  This explains the hypocrisy without calling it a mistake. It's a feature, not a bug. The system is designed to prioritize the continuity of the state over the consent of the governed *at the margins*. It privileges the past (lineage) and the future (children) over the present (residents).

  The uncomfortable truth your piece could land on is this: We don't actually believe in "government by the governed." We believe in "government by the *members*," and membership is a much older, tribal, exclusionary concept than governance. We tolerate the draft inconsistency and the resident exclusion because, deep down, we value the survival of the national "us" more than the democratic purity of the "now."

  The "Affected Interests" principle is the moral high ground, but it leads to a world without borders or stable governments. The Citizenship principle is morally messy, but it builds a container strong enough to hold a democracy together. The tension you're seeing isn't a puzzle to be solved; it's the friction required to keep the machine running.
