      *   **Specific Questions:**
          1.  What theory of legitimate inclusion does current practice presuppose?
          2.  Evaluate the user's three "buckets" (Authorship, Exposure, Stake/Association).
          3.  Is there a fourth bucket (Stability/Continuity)?
          4.  Is it a coherent theory or a messy settlement?
          5.  Counterfactual: What if we adopted a pure "affected interests" principle? (Concrete implications).
          6.  Distinguish between philosophical necessity and historical accident (underdetermination).

  2.  **Deconstruct the User's "Buckets":**
