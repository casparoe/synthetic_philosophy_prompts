answer: |-
  # Desiderata for an Account of Reduction and Emergence

  **Purpose:** To provide action-guiding criteria for a working scientist deciding whether to pursue a micro-reduction of a macro-model, or to treat the macro-model as autonomous.

  ## I. The Core Triad: Existence, Derivation, Utility
  Most literature conflates three distinct claims. An adequate account must separate them, as they come apart in practice.

  **1. The Ontological Constraint**
  *   **Requirement:** The account must specify whether macro-properties/entities are *identical* to micro-configurations, *constituted* by them without identity, or *distinct* existents.
  *   **Consideration:** This determines whether hunting for a reduction is hunting for an identity statement (like "water = H₂O") or a causal mechanism linking distinct things.
  *   **Status:** Genuine constraint. However, for the *working scientist*, this is often the least critical. She can use the model regardless of what exists.
  *   **Note on "Emergence":** When philosophers say "ontological emergence," they mean this constraint is violated (macro is novel). When scientists say "emergent behavior," they usually mean Constraint 3 (Utility).

  **2. The Derivational Constraint**
  *   **Requirement:** The account must specify the logical/mathematical relation between the micro-theory ($T_{micro}$) and macro-theory ($T_{macro}$). Is it strict deduction, approximation, singular limit, or statistical correlation?
  *   **Consideration:** This determines whether the macro-model is *in principle* dispensable given perfect knowledge of the micro.
  *   **Status:** Genuine constraint. This is the traditional battlefield of reduction.
  *   **Note on "Autonomy":** Arguments for the autonomy of special sciences often rely on the *failure* of this constraint (in principle) or the *intractability* of it (in practice).

  **3. The Pragmatic Constraint**
  *   **Requirement:** The account must specify whether the macro-model is *necessary* for prediction or control, even given complete micro-knowledge.
  *   **Consideration:** A scientist needs to know if she can discard the macro-model once the micro-model is solved. If the micro-simulation is computationally intractable or epistemically inaccessible, the macro-model retains autonomy.
  *   **Status:** **This is what "Autonomy of Special Sciences" arguments actually need.** You don't need ontological novelty to justify a separate department of biology; you only need predictive intractability.
  *   **Note on "Emergence":** This is what scientists *usually* mean by "emergent" (unpredictable from micro without simulation).

  ---

  ## II. Specific Mechanism Desiderata

  **4. The Bridge Principle Constraint (Beyond Deducibility)**
  *   **Requirement:** It is not enough that $T_{micro} + \text{Bridges} \vdash T_{macro}$. The bridge principles connecting micro-vocabulary to macro-vocabulary must be **independently motivated**.
  *   **Consideration:** If I define "temperature" *ad hoc* as "whatever kinetic energy value makes the ideal gas law work here," I have achieved derivation but not explanation. The bridge must be fixed by measurement or theory *outside* the specific derivation context.
  *   **Status:** Genuine constraint. Without this, reduction is trivialized by definition-stipulation.

  **5. The Multiple Realizability (MR) Constraint**
  *   **Requirement:** The account must handle cases where Macro $M$ is realized by heterogeneous Micro states $\{m_1, m_2, m_3...\}$. It must either: (a) accept disjunctive bridge laws and explain why they aren't theoretically costly, or (b) identify a common functional/structural invariant across $\{m_i\}$ that does the real reducing work.
  *   **Consideration:** If reduction requires a unique micro-basis, most special sciences fail. If it allows disjunctions, "laws" become infinite lists.
  *   **Status:** Genuine constraint. This is the standard objection to Nagelian reduction.
  *   **Cost:** Option (a) saves reduction but kills unification. Option (b) saves unification but requires finding the invariant (which may not exist).

  **6. The Causal Exclusion Constraint**
  *   **Requirement:** If the micro-domain is causally complete (every micro-event has a sufficient micro-cause), the account must specify what causal work remains for the macro-property to do. It cannot simply assert "macro-causation exists" without explaining how it avoids overdetermination.
  *   **Consideration:** If the neurons fire, the arm moves. What does "belief" add? If the answer is "nothing," the macro-model is merely descriptive, not explanatory of *change*.
  *   **Status:** Genuine constraint for any account claiming macro-entities are real and effective.
  *   **Note:** This is a demand for the *solution*, not the solution itself. The desideratum is: *Resolve the tension without denying micro-completeness or macro-efficacy.*

  **7. The Decoupling (Universality) Constraint**
  *   **Requirement:** In cases of universality (e.g., phase transitions), where macro-behavior is insensitive to micro-details, the account must explain *why* the micro-details drop out. A derivation that relies on specific micro-parameters that turn out to be irrelevant is suspect.
  *   **Consideration:** If the macro-law holds regardless of the micro-constituents, a reduction that ties it essentially to one specific constituent looks like a mistake.
  *   **Status:** Genuine constraint. This tests whether the reduction captures the *robustness* of the phenomenon.
  *   **Smuggling Warning:** Do not treat this as a separate virtue. If a reduction cannot explain insensitivity, it has failed to reduce the *actual* phenomenon (which is defined by that insensitivity).

  **8. The Anti-Phantom Reduction Constraint**
  *   **Requirement:** A reduction is invalid if the micro-model requires *post-hoc tuning* (fitting parameters, adding terms, adjusting boundary conditions) specifically to match the known macro-output, without generating **novel predictions** outside the fitted regime or demonstrating **stability under perturbation**.
  *   **Argument:** Merely reproducing the output curve is curve-fitting, not reduction. To count as reduction, the micro-model must be *constrained* independently.
      *   *Criterion:* **Independent Fixability.** The micro-parameters and bridge principles must be fixed by data *other than* the macro-phenomenon being reduced.
      *   *Criterion:* **Stability.** Small perturbations in the micro-assumptions should not lead to catastrophic failure of the macro-derivation (unless the macro phenomenon itself is unstable).
  *   **Satisfiability:** Satisfiable, but difficult. It requires data richness often unavailable in complex systems.
  *   **Relation to MR:** **Independent.** MR is about many-to-one mapping. Phantom Reduction is about *ad hoc* fitting. You can have Phantom Reduction with a single realization (tuning one micro-model to fit one macro-curve) and successful Reduction with Multiple Realizability (if the invariant is found independently).

  ---

  ## III. Inconsistency and Trade-offs

  **Is any subset jointly unsatisfiable?**
  Yes. The following triad is in high tension, often mutually exclusive in practice:
  1.  **Strict Derivational Connectivity** (Macro follows deductively from specific Micro structure).
  2.  **Decoupled Macro Behaviour** (Macro is insensitive to specific Micro structure).
  3.  **Anti-Phantom Reduction** (Micro parameters must be independently fixed, not tuned to match Macro).

  **Why:** If the Macro is insensitive to Micro details (2), a derivation based on specific Micro details (1) will only work if those details are tuned precisely to cancel out their own specificity. This tuning often violates Independent Fixability (3). If you fix the Micro parameters independently, the derivation often fails to yield the universal Macro law because the specific details *should* matter.
  *   *Example:* Deriving fluid dynamics from particle mechanics. The continuum limit requires taking particle number to infinity (violating specific micro-structure) or smoothing (violating strict deduction).

  **The Hardest Constraint:** **The Anti-Phantom Reduction Constraint.** It is the easiest to violate accidentally. It requires data and theoretical discipline that is often unavailable in complex systems (climate, neuroscience). It excludes most "toy model" reductions.

  **The Droppable Constraint:** **The Ontological Constraint.** For the purpose of *modelling practice*, it does not matter if the macro-property "really exists" over and above the micro. It only matters if the model predicts (Pragmatic) and explains (Derivational/Anti-Phantom). Metaphysical parsimony is a luxury for the seminar, not the lab.

  ---

  ## IV. Scorecard of Familiar Views

  | View | Bridge-Law / Deductive (Nagel-style) | Limit / Approximation (RG / Batterman-style) | Causal Powers (Kim / Bedau-style) |
  | :--- | :--- | :--- | :--- |
  | **Ontology** | **Pass.** Macro is identical to Micro (via bridges). | **Pass/Neutral.** Focuses on models, not things. | **Fail/Risky.** Often posits distinct macro-properties, inviting Exclusion worry. |
  | **Derivation** | **Pass.** Strict deduction is the goal. | **Fail.** Relies on singular limits (math breakdown) which break strict deduction. | **Fail.** Often asserts powers without deriving them from micro-structure. |
  | **Pragmatic** | **Fail.** Implies macro is dispensable in principle, ignoring intractability. | **Pass.** Explains why macro models are often *better* (capture universality). | **Pass.** Validates macro-models as tracking real causal powers. |
  | **Bridge Principles** | **Fail.** Vulnerable to Phantom Reduction (bridges can be stipulated). | **Pass.** Bridges are mathematical limits, often independently motivated. | **N/A.** Focuses on causal relations, not vocabulary translation. |
  | **Multiple Realizability** | **Fail.** Struggles with disjunctive laws; seeks single basis. | **Pass.** Explains MR via Universality (details don't matter). | **Pass.** Functional definition allows MR easily. |
  | **Decoupling** | **Fail.** Derivation usually depends on specific micro-details. | **Pass.** This is the core strength (explains insensitivity). | **Pass.** Macro powers defined by effect, not micro-constitution. |
  | **Anti-Phantom** | **Fail.** High risk of tuning bridge laws to fit output. | **Pass.** Stability under perturbation is built into RG analysis. | **Fail.** Hard to verify "powers" without falling into output-matching. |

  **Summary Breakage:**
  *   **Bridge-Law:** Breaks on **Decoupling** and **Phantom Reduction**. It cannot explain why micro-details don't matter without looking like it's ignoring them.
  *   **Limit/RG:** Breaks on **Strict Derivation**. It admits that reduction involves mathematical singularities where the micro-theory technically yields nonsense, requiring a new conceptual framework.
  *   **Causal Powers:** Breaks on **Exclusion** and **Derivation**. It saves the macro but often severs the link to the micro-mechanism, making it metaphysically heavy and scientifically thin.
