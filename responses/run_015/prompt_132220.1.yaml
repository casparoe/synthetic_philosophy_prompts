      *   No citations/reading list? Check.
      *   Tone: Professional, direct, seminar-framing style.

  9.  **Refining the Output:**
      *   Make sure the "Phantom Reduction" argument is sharp. It needs to be about *independent fixability* of the bridge principles.
      *   Ensure the distinction between "Autonomy of Special Sciences" (needs Prediction/Intractability) and "Emergence" (often implies Ontological novelty) is clear.
      *   Check the "Decoupled Macro Behaviour" requirement. This is about Universality. The criterion should be: The account must explain *insensitivity*, not just derive the sensitivity.

