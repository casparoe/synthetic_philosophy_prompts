      *   Let's focus on the *Phantom Reduction* constraint vs. *Multiple Realizability*. If MR is true, bridge laws are disjunctive. If bridge laws are disjunctive, is it really reduction? Some say no.
      *   *Decision:* The hardest tension is between **Derivational Connectivity** (specific micro-structure determines macro) and **Decoupled Macro Behaviour** (micro-structure doesn't matter). If the macro behavior is *insensitive* to micro details, a derivation that relies on *specific* micro details looks like Phantom Reduction. But if the derivation doesn't rely on specific details, how is it a derivation from *that* micro theory?
      *   *Hardest Constraint:* Anti-Phantom Reduction (requires independent fixity).
      *   *Droppable:* Ontological Parsimony (scientists don't care if the property "exists" as long as the model works).

  7.  **Drafting the Scorecard:**
      *   *Bridge-Law (Nagel):* Good on Derivation. Fails on MR (disjunctive laws ugly). Fails on Phantom Reduction (bridges can be ad hoc).
