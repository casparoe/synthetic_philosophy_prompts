      *   *Constraint 6: Anti-Phantom Reduction.* (Requested explicitly). Needs to stop overfitting the micro model. Requirement: *Robustness* or *Novel Prediction*. Let's go with *Independent Constraint on Bridge Principles* + *Stability under Perturbation*.

  4.  **Refining the "Phantom Reduction" Constraint:**
