      *   *Constraint 3: Causal Exclusion.* If micro is complete, macro is epiphenomenal. The desideratum: The account must specify the conditions under which macro-causal claims remain valid without violating micro-completeness (or deny micro-completeness).
      *   *Constraint 4: Decoupling/Universality.* Why do micro details drop out? The account must explain *insensitivity* to micro-parameters, not just derive the result assuming specific parameters.
      *   *Constraint 5: The Ontology/Derivation/Prediction Triad.* (Requested explicitly).
