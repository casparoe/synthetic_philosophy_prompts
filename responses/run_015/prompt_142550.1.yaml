      *   *4. Necessary Truths:* $p$ cannot be false. Sensitivity is vacuously true. FDI analogue: A fault mode that is physically impossible (e.g., mass conservation violation in a closed system). We don't design detectors for impossible faults. We require *Power*: Probability of detection $> 1-\beta$ for alternatives. If the alternative set is empty, the test is degenerate. FDI handles this by defining the *fault set* $\mathcal{F}$. If $\mathcal{F} = \emptyset$, no test needed.

