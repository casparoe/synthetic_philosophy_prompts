      *   *Masking/Compensator:* False Data Injection (FDI). An adversary injects $a(k)$ such that $C x(k) + a(k)$ looks nominal. The fault is masked. Sensitivity fails.

  4.  **Drafting the Translation (Iterative Refinement):**
      *   *Vocabulary:* Plant $G$, Estimator $\hat{G}$, Residual $r$, Threshold $J$, Fault $f$, Disturbance $d$, Uncertainty $\Delta$.
      *   *Sensitivity:* $\|r\| > J$ when $f \neq 0$.
