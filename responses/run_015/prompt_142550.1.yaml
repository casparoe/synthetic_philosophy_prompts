      *   *Masking:* $f + d_{eff} \approx 0$ in residual space.

  5.  **Addressing the Four Adjudication Points:**
      *   *1. Method Fixed:* In FDI, "method" is the observer gain and structure. But we define "uncertainty" separately. Philosophers argue about whether "looking" is the method or "looking + lighting". In FDI, if we call lighting "uncertainty," the method is robust. If we call it "part of the method," the method fails. This *is* interest-relative/modeling-choice-relative. It's not fatal, but it shows "Knowledge" depends on the *model boundary*.
      *   *2. Ordering/Similarity:* FDI uses norms ($\mathcal{L}_2$, $\mathcal{H}_\infty$). Philosophy uses "nearest possible world." FDI norms are convex/metric. Philosophical similarity is often non-metric (miracles allowed). FDI cannot model "laws violated" without changing the plant matrix $A$. If $A$ changes, it's a different plant, not a perturbation. This is a hard limit. FDI assumes fixed dynamics.
