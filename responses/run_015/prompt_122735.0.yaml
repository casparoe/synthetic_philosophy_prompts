answer: |-
  # Q&A Prep Sheet: *Where Am I?* and the Continuum Case

  **1. The Embodied/Enactivist Critique (The Setup Attack)**
  *   **Objection:** "Your Continuum Case inherits the fatal flaw of Dennett's original thought experiment: a brain in a vat isn't a mind. If enactivism is right, the subject ceases to exist the moment the brain is disconnected from its environmental coupling, so there is no gradient to track, only a termination."
  *   **Reply:** I grant that a static, isolated BIV is problematic, but the Continuum Case is designed precisely to avoid a sharp termination event. Even if you deny the start-point is a full person, the *shift* in sensorimotor locus from Earth to Mars creates a pragmatic indeterminacy about where the *agency* resides, which is sufficient for my conclusion.
  *   **Soft Spot:** Relying on the intuition that the BIV stage is continuous with the Mars stage.
  *   **Concede:** The absolute start-point (pure BIV) is metaphysically contentious.
  *   **Must-Land:** The indeterminacy arises from the *transition* of control, not the metaphysical status of the endpoints.

  **2. The Animalist (Eric Olson Style)**
  *   **Objection:** "You keep asking where the *person* is, but we are human animals. The animal is clearly on Mars once the body moves; the Houston vat contains only an organ. You are solving a linguistic puzzle, not a metaphysical one."
  *   **Reply:** If we define 'person' strictly as 'human organism,' you are correct, but that definition fails to capture our forensic and moral practices regarding responsibility. My claim is that the *agent* to be held responsible migrates along the gradient, regardless of where the biological tissue sits.
  *   **Soft Spot:** Equivocating between 'person,' 'agent,' and 'animal.'
  *   **Concede:** Biologically, the animal is on Mars.
  *   **Must-Land:** The "Location Question" that matters is about accountability, not biology.

  **3. The Metaphysician (Vagueness Theorist)**
  *   **Objection:** "This is a textbook Sorites paradox. You claim there is no fact of the matter, but epistemicists say there is a sharp cut-off we just can't know, and supervaluationists say it's indeterminate truth. You haven't offered a theory of vagueness, just a description of it."
  *   **Reply:** Standard theories of vagueness attempt to save bivalence or explain ignorance regarding a pre-existing fact. I am arguing there is *no fact* to be vague about until a tracking practice is adopted; the indeterminacy is ontic and pragmatic, not merely semantic.
  *   **Soft Spot:** Dismissing established vagueness literature without a formal semantic model.
  *   **Concede:** The logical structure is indeed Soritical.
  *   **Must-Land:** This is not semantic indecision; it is a lack of determinate referent prior to practical stipulation.

  **4. The Parfit-Style Reductionist**
  *   **Objection:** "Parfit already taught us that identity doesn't matter, only psychological continuity does. You are rebranding Reductionism with extra steps; if survival is a matter of degree, your 'tracking practice' adds nothing but confusion."
  *   **Reply:** Parfit assumes psychological continuity is the *objective metric* for survival, whereas I argue that choosing *which* continuity counts is itself a practical decision. It is not just that identity doesn't matter, but that the 'survival relation' is partly constituted by our decision to track it.
  *   **Soft Spot:** Sounding like Parfit without the textual authority.
  *   **Concede:** Parfit is right that strict identity is not what matters.
  *   **Must-Land:** Parfit leaves the *metric* of survival fixed; I argue the metric itself is a choice.

  **5. The Systems Neuroscientist**
  *   **Objection:** "Clinically and legally, death is determined by brain function. If the cerebrum is in Houston, the patient is in Houston. What is the practical stake here if the law will never recognize the Mars body as the agent?"
  *   **Reply:** Current law relies on current technology; as prosthetics and latency management improve, the 'clinical criterion' will fracture, creating liability nightmares your framework cannot resolve. My paper predicts the point where the law *must* shift its tracking practice to avoid absurd outcomes, like punishing a brain in a vat for a body's actions.
  *   **Soft Spot:** Speculating on future legal standards without expertise.
  *   **Concede:** Current law sides with the brain.
  *   **Must-Land:** Future technology will force the law to adopt a tracking practice like the one I describe.

  **6. The Hostile Department Member (Anti-Deflationism)**
  *   **Objection:** "If the answer is just 'we decide where the person is,' you haven't done metaphysics, you've done policy. This is a deflationary cop-out that dissolves the problem rather than solving it."
  *   **Reply:** Metaphysics often progresses by showing that a question presupposes a false dichotomy rather than answering it directly. Showing that the 'Location Question' requires a prior practical commitment *is* the philosophical solution, not an avoidance of one.
  *   **Soft Spot:** Admitting the conclusion is deflationary regarding facts.
  *   **Concede:** It is deflationary regarding *mind-independent facts*.
  *   **Must-Land:** Dissolving a pseudo-problem is a valid philosophical outcome (Wittgensteinian/Carnapian defense).

  **7. The Objection I Hope Nobody Asks (The "Magic" Objection)**
  *   **Objection:** "If location and identity are matters of 'tracking practice,' can I simply *decide* to track myself as surviving death, or as being in two places at once? If it's a decision, what stops it from being magic?"
  *   **Reply:** Tracking practices are constrained by the need for public coordination and causal continuity; you cannot unilaterally decide a practice that breaks social or causal coherence. The 'decision' is a collective, normative stabilization of a gradient, not an individual act of will.
  *   **Soft Spot:** Explaining why *some* practices are valid and others aren't without appealing to the facts I just denied.
  *   **Concede:** Individuals cannot arbitrarily choose their own identity conditions.
  *   **Must-Land:** Practices are constrained by the *purpose* of tracking (e.g., responsibility), which rules out magical thinking.
