answer: |-
  Your colleague is technically correct within the strict bounds of neoclassical welfare economics, but incorrect about the implications for health policy practice. Here is the reconstruction of the implicit theory, the diagnosis of the measurement problems, and the analysis of what holds the practice together.

  ### 1. The Colleague's Objection and the Anchoring Fix
  Your colleague is invoking the standard von Neumann-Morgenstern (VNM) theorem: individual utility functions are unique only up to a positive affine transformation ($u' = au + b$). This means the zero point and the unit size are arbitrary for any single person. Consequently, comparing the *magnitude* of Person A's gain to Person B's gain is mathematically undefined without further assumptions.

  Your proposed fix (anchoring 0 = worst life, 1 = best life) is known as **range normalization**. It is a known move, but it fails for two specific reasons:
  1.  **Capacity for Welfare:** It assumes all humans have the same "range" of wellbeing. If Person A has a high capacity for suffering and joy, and Person B is emotionally muted, a move from 0.5 to 0.6 on their respective scales may not represent an equivalent moral or experiential gain.
  2.  **Reference Point Subjectivity:** "Worst possible life" is not an objective state. A quadriplegic's "0" might be functionally superior to a depression patient's "0." Normalizing to subjective endpoints makes the units incommensurable.

  QALYs bypass this not by solving the philosophical problem, but by shifting the ontology. They do not claim to measure *happiness* (utility); they claim to measure *health capacity* (functioning). They presuppose that "ability to walk" or "absence of pain" has a cardinal value that is roughly constant across persons, regardless of how much happiness that functioning produces.

  ### 2. Reconstructing the Implicit Theory
  The cost-per-QALY practice rests on a specific hierarchy of measurability assumptions drawn from social choice theory (specifically Amartya Sen's taxonomy of informational constraints).

  **The Load-Bearing Commitments:**
  1.  **Cardinality:** Health states must be measurable on an interval scale. We must know not just that State A is better than State B, but *how much* better (to calculate the gain).
  2.  **Interpersonal Unit Comparability:** This is the critical one. We must assume that a 0.1 gain in health utility for Person A is equivalent to a 0.1 gain for Person B. Without this, you cannot sum QALYs across a population.
  3.  **Aggregation via Summation:** The social value of a policy is the sum of individual health gains. This is classical Utilitarianism applied to health.

  **The Optional/Contingent Commitments:**
  1.  **Distribution Neutrality:** The rule "a QALY is a QALY" implies strict linearity. However, the practice *survives* if you drop this. NICE's end-of-life or severity modifiers explicitly reject this. You can have a QALY system that weights gains to the severely ill more heavily (Prioritarianism). The *metric* (QALY) remains, but the *decision rule* changes.
  2.  **Refusal of Willingness-to-Pay (WTP):** This is a normative choice, not a mathematical necessity. You *could* calculate cost-per-QALY using WTP to value the QALY (essentially monetizing health). The refusal to do so is a commitment to **Health Egalitarianism** (health should be distributed based on need, not ability to pay) rather than **Preference Satisfaction** (health should go to those who value it most in monetary terms). This is consistent with the rest of the theory provided you view health as a special good distinct from general consumption.

  ### 3. Inconsistencies and Bolt-Ons
  The end-of-life and severity allowances are theoretically inconsistent with the base "QALY is a QALY" rule. They are ethical patches.
  *   **Base Theory:** Maximise total health output (Utilitarian).
  *   **Bolt-On:** Give extra weight to those with short life expectancy or severe baseline conditions (Prioritarian/Egalitarian).
  *   **Consistency:** They are inconsistent with pure QALY maximization but consistent with the broader goal of *fair* health allocation. They acknowledge that Interpersonal Unit Comparability might hold, but that the *moral value* of a unit varies by context.

  ### 4. Alternative Theories and Concrete Changes
  If you replaced the implicit theory, the practice would change as follows:

  *   **(a) Partial/Ordinal Comparability:** If we accept the colleague's view that we can only rank outcomes ordinally (A is better than B, but not by how much) and cannot compare across persons:
      *   **Change:** The cost-per-QALY ratio becomes impossible to calculate. You cannot divide cost by an ordinal rank.
      *   **Replacement:** You would need **Cost-Effectiveness Acceptability Curves** or **Multi-Criteria Decision Analysis (MCDA)**. Decisions would be made by committee judgment on specific cases rather than a fixed threshold, or by seeking Pareto improvements only (which is paralyzing in resource allocation).

  *   **(b) Prioritarianism (Weighting the Badly Off):** If we hold that a QALY for a severely ill person is worth more than one for a mildly ill person:
      *   **Change:** The formula changes from $\sum \Delta QALY$ to $\sum (w \times \Delta QALY)$, where $w$ is a weight based on baseline severity.
      *   **Practice:** The funding threshold would effectively become flexible. Drugs for severe conditions would pass at a higher cost-per-QALY than drugs for mild conditions. (This is already happening with NICE's severity modifiers).

  *   **(c) Impartial Spectator (Harsanyi):** If we justify the system via a veil of ignorance (I could be anyone in the population):
      *   **Change:** This actually *supports* the base QALY practice (average utility maximization) *if* we assume everyone has the same utility function for health.
      *   **Problem:** It does not solve the measurement problem. It justifies *why* we sum, but not *how* we measure the units being summed. It collapses back into needing Cardinal Interpersonal Comparability to work.

  ### 5. Conclusion
  The practice is not "meaningless," but it is not value-neutral. It is a pragmatic adoption of **Cardinal Unit Comparability**. It assumes that while we cannot measure happiness across people, we can measure *health functioning* well enough to treat units as equivalent for the sake of allocation. The refusal to use WTP is consistent with this if health is viewed as a need rather than a preference. The severity modifiers are admissions that pure summation is morally insufficient, but they rely on the underlying comparability of the QALY unit to function.

  The single indispensable commitment is that health gains can be measured cardinally and compared across persons. Without this, the "Q" in QALY cannot be summed, and the ratio cannot exist.

  \answer{Cardinal interpersonal comparability}
