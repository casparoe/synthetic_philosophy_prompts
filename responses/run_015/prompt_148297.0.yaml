answer: |-
  **The Case**

  We are co-chairs of a hiring committee, equally informed of the same two candidates' files. Candidate A has a significant publication gap due to parental leave; Candidate B has continuous output. I initially judge B the stronger hire, viewing the gap as a neutral indicator of lower recent productivity. You, my peer co-chair with no special authority or professional credentials, insist that penalizing the gap constitutes discriminatory treatment, explaining that 'neutral' metrics often embed structural biases against caregivers. I find this counter-intuitive but, acknowledging that insisting on my view risks perpetuating a known structural harm and recognizing your consistent sensitivity to such dynamics in past discussions, I defer to your judgment. You walk me through the reasoning: how the metric conflates availability with merit. I accept this, vote for A, and can subsequently articulate exactly why the metric is biased to other committee members. However, my commitment remains tethered to your endorsement; had you later told me you had miscalculated the bias or that the department explicitly waived this concern, I would have reverted to my original preference, despite retaining the ability to recite the argument against the gap.

  ***

  **The Demonstration**

  **1. The Three Accounts**
  *   **The Evidential Account** predicts a defect because peers usually lack grounds to trust one another on moral matters. In this case, that account is silenced: the recipient has specific, positive evidence of the speaker's reliability ("consistent sensitivity in past discussions"), making the trust rational rather than blind.
  *   **The Own-Judgment Account** predicts a defect because the recipient is outsourcing a judgment they must own. This is silenced because the recipient deliberates ("find this counter-intuitive"), acts ("vote for A"), and defends the decision ("articulate exactly why"), fulfilling their deliberative responsibility.
  *   **The Understanding Account** predicts a defect because testimony supposedly delivers a verdict without the underlying grasp of reasons. This account fails. The recipient *does* grasp the reasons ("conflates availability with merit"), is responsive to the situation, and guides conduct accordingly. The predicted epistemic deficit is absent.

  **2. The Structural Feature**
  The feature doing the work is **Validated Interpretive Framing**. The speaker does not provide new non-moral facts (both have the files) but provides the *moral category* under which those facts must be subsumed (the gap is not "lower productivity" but "structural bias"). The recipient gains understanding of the *logic*, but the *warrant* for applying that logic to this specific case remains testimonial.

  **3. The Collapse**
  If you remove the recipient's ability to articulate the reasons (the "walk me through" element), the case collapses into the **Blind Deference** easy case. In that scenario, the recipient votes A but cannot explain why, merely citing the speaker's say-so. This would allow the Understanding Account to correctly identify a defect (lack of grasp), restoring its predictive power.

  **4. The Strongest Reply and Rebuttal**
  A defender of the Understanding Account will argue: "If the recipient can articulate the reasons and guide action, they are no longer believing on testimony; they have converted the testimonial input into independent knowledge. You have changed the subject from *testimony* to *instruction*."

  **Rebuttal via Condition (c):** This reply ignores the **dependence condition**. The recipient's belief is not held independently; it is held *on the authority of the speaker's validation*. The recipient understands the reasoning *conditionally*: "If your framing is correct, then A is the right hire." They lack the confidence to assert the framing's correctness without the speaker's backing. If the speaker retracts, the recipient abandons the belief, proving the warrant is still testimonial. The Understanding Account conflates *grasping a reason* with *trusting one's own moral perception enough to stand by it*. This case shows one can have the former via testimony while lacking the latter, yet still suffer no epistemic defect in the belief itself.
