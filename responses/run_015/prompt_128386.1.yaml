answer: |-
  **PROGRAM SOLICITATION NSF-HIST-24-009**
  **Pre-Registered Counterfactual Trials in Macrohistory: Solving the Needham Question Through Synthetic Control Methods**

  The Division of Historical Econometrics invites Principal Investigators (PIs) to submit proposals for the randomized re-execution of the period 1700–1850. The objective is to isolate the average treatment effect (ATE) of industrialization using strict causal inference frameworks. Previous observational studies suffer from endogeneity bias; therefore, this program requires experimental manipulation of geopolitical variables to determine why Britain industrialized while China did not.

  **Methodological Requirements**
  PIs must construct a synthetic Britain using donor pools from Qing China, Mughal India, and the Ottoman Empire. To ensure exchangeability, all units must be blinded to their treatment status. The treatment arm (Great Britain) will recieve access to high-yield coal deposits and extraterritorial colonial markets. Control units must be restricted to agrarian outputs only. If a control unit develops steam technology organically, it must be immediately excluded from the donor pool to maintain compliance with the exclusion criteria for societies that industrialized accidentally. This ensures the control group remains a valid counterfactual for non-industrialization.

  **Pre-Analysis Plan**
  To mitigate p-hacking across centuries, all pre-analysis plans must be filed and notarized prior to 1699. Late filings will not be accepted. The plan must specify exogenous institutional variables (e.g., property rights, guild structures) as fixed covariates. Institutions cannot be allowed to evolve endogenously in response to treatment, as this violates the stable unit treatment value assumption (SUTVA). Teleological drift must be capped at 5% per decade. Investigators must demonstrate that the selection of Britain as the treatment unit was not determined by the outcome of the Industrial Revolution itself.

  **Sidebar: Inclusion Criteria for Valid Control Societies**
  1. Must possess comparable GDP per capita in 1700.
  2. Must not have access to domestic steam engines prior to randomization.
  3. Must agree to remain non-industrialized for the duration of the trial (150 years).
  4. Cultural attitudes toward innovation must be held constant via statistical weighting.

  **Data Management Plan**
  Applicants must describe secure storage for counterfactual outcomes. Data regarding paths not taken must be archived in a read-only format to prevent contamination of the historical record. Missing data imputation is required for civilizations that collapsed prior to 1850.

  **Budget Justification**
  Line Item 4.2.b: Procurement of counterfactual coal deposits.
  Justification: Synthetic control methods require identical geological endowments across treatment and control arms. Costs include simulation of seam depth, caloric density, and extraction logistics in regions where coal does not historically exist. Travel costs for site visits to alternate timelines are unallowable. Equipment costs for temporal stabilization rigs are allowable up to $500,000.

  **Submission**
  Submit via Grants.gov. Ensure all causal claims are robust to sensitivity analysis regarding the inevitability of Western dominance. Non-compliant proposals implying historical inevitability will be returned without review.

