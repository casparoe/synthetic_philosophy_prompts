prompt: |-
  I've got a forty-minute slot with the volunteer guides at a contemporary art gallery — bright people, no philosophy, and their actual job is telling visitors what to think about paintings. I need them to get why there's something specially awkward about taking an aesthetic judgement on someone else's word: why testimony seems fine for what a work is like but not for whether it's any good.

  Don't explain it to me, plan the session. What has to land before anything else does; which one example should carry the whole thing (and why the obvious one — a mate telling you a film's brilliant — is the wrong thing to build on); the misconceptions they'll arrive with, in the order they'll arrive, and where in the sequence to head each off.

  Two things I want built in rather than bolted on. They'll point out, rightly, that they defer to experts constantly — mechanics, doctors, restaurant critics — so I need a moment where the disanalogy actually bites instead of just being asserted. And one of them will definately produce the case of a critic whose verdicts have matched their own first-hand judgement on every one of the last five hundred works, so tell me where that goes. I'd rather they left able to handle the welded-together cases — 'the ending's clumsy', 'the translation's leaden', where describing and evaluating look like the same act — than with a verdict on whether testimony ever works.

  What should I flatly refuse to get into in forty minutes, and what one question at the end tells me the idea landed rather than that they've just been told expertise has limits?
reasoning: |-
  Here's a thinking process that leads to the suggested session plan:

  1.  **Analyze the Request:**
      *   **Audience:** Volunteer guides at a contemporary art gallery. Bright, practical, no philosophy background. Their job is telling visitors what to think about paintings (interpretation/evaluation).
      *   **Time:** 40 minutes (tight).
      *   **Goal:** Make them understand the specific awkwardness of taking aesthetic *judgement* (value) on testimony, vs. aesthetic *description* (facts/features).
      *   **Constraints/Requirements:**
          *   Don't explain the theory to me; plan the session.
          *   Identify the "First Thing That Must Land."
          *   Select *one* core example (not the "mate recommending a film" cliché).
          *   Map misconceptions in order of arrival and how to head them off.
          *   Integrate the "Expert Deference" objection (mechanics/doctors) so the disanalogy *bites*.
          *   Integrate the "Perfect Critic" counter-example (500 matches).
          *   Focus on "welded-together cases" (description/evaluation blends like "clumsy ending").
          *   Identify what to *exclude* (time management).
          *   Identify the *one final question* to test genuine understanding.

  2.  **Deconstruct the Core Philosophical Problem:**
      *   *The Problem:* Why can I believe you when you say "The painting has blue stripes" (testimony of fact), but I feel cheated if I just believe you when you say "The painting is beautiful" (testimony of value) without seeing it?
      *   *The Nuance:* It's not that testimony is impossible, it's that it lacks *normative force* or *autonomy* in aesthetics. I need to see for myself to own the judgement.
      *   *The Audience's Reality:* They are paid/expected to give the verdict. This creates tension. The session shouldn't undermine their job, but refine *how* they do it (guiding seeing vs. dictating value).

  3.  **Drafting the Session Structure (40 Minutes):**

