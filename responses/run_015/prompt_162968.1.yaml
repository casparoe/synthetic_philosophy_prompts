answer: |-
  # Session Plan: The Authority of the Eye (40 Minutes)

  **Goal:** Shift guides from delivering *verdicts* to facilitating *uptake*.
  **Core Thesis:** Aesthetic testimony transfers *information*, but it cannot transfer *experience*. To accept a judgement on testimony is to outsource the very faculty the gallery exists to exercise.

  ### 0:00–0:05 | The First Thing That Must Land
  **The Distinction:** *Features* vs. *Force.*
  Do not start with "opinion vs. fact." That triggers relativism ("everyone's entitled to their view").
  Start with **Transferability.**
  *   **Activity:** Hold up a pen. Ask: "If I tell you this pen is blue, do you need to see it to know it's blue?" (No). "If I tell you this pen is *balanced*, do you need to hold it to know it's balanced?" (Yes).
  *   **The Landing:** In art, *description* travels (facts about the work). *Judgement* does not (the force of the work). If you tell a visitor a painting is "powerful" and they believe you without feeling it, they possess a fact, not an aesthetic experience. They have been informed, not moved.
  *   **Why this first:** It establishes the structural gap before they defend their job security.

  ### 0:05–0:20 | The Core Example: The Rothko Room
  **The Example:** A large, color-field painting (e.g., a Rothko).
  **Why this one (and not the "Mate's Film"):**
  *   The "Mate's Film" is wrong because it's about *time investment* (I don't want to waste 2 hours). That's pragmatic, not philosophical.
  *   The Rothko is about *phenomenology*. There is almost nothing to describe ("It's a red rectangle"). The entire value is in the *looking*.
  *   **The Scenario:**
      1.  **Description:** "There are two rectangles, soft edges, maroon over orange." (Testimony works. Visitor knows the configuration).
      2.  **Judgement:** "It is devastatingly sad." (Testimony fails. If the visitor says "Ah, sad" and moves on, they have not engaged with the sadness. They have filed a fact).
  *   **The Welded Case (15:00 mark):** Introduce the phrase: **"The translation is leaden."**
      *   Ask: "Is 'leaden' a description or a verdict?"
      *   **Point:** It's welded. It describes the weight/speed but evaluates the success. If you tell a visitor "The translation is leaden," they will look for heaviness rather than reading the text. You have prejudiced the experience.
      *   **Instruction:** When you hear welded words (clumsy, flat, vibrant, dead), treat them as *invitations to look*, not *conclusions to accept*.

  ### 0:20–0:30 | The Expert Objection (Where the Disanalogy Bites)
  **The Objection:** "I defer to my doctor and mechanic constantly. Why not the art expert?"
  **The Sequence:**
  1.  **Acknowledge:** Yes, you defer. When the mechanic says "The brake pad is worn," you believe them. You don't need to feel the wear.
  2.  **The Bite:** Ask: "If the mechanic says 'This repair is *satisfying*,' does that fix the car?"
      *   **Function vs. Experience:** Mechanics and Doctors deal with *function* (does the heart beat? does the brake stop?). Function exists independently of your perception.
      *   **Aesthetics deals with *uptake*.** A "successful" painting only succeeds if it registers *with the viewer*.
      *   **The Trap:** If you defer to the guide on value, the gallery becomes a warehouse of certified goods, not a space of encounter. The expert's job here isn't to certify the work; it's to tune the visitor's instrument (their eyes) so *they* can certify it.
  3.  **Head Off:** They will say, "But visitors feel stupid if they don't get it."
      *   **Response:** "Better they feel confused and looking, than informed and blind."

  ### 0:30–0:35 | The "Perfect Critic" Counter-Example
  **The Scenario:** One guide will say: "What if a critic has matched my judgement on the last 500 works? Can't I just trust them on the 501st?"
  **Placement:** Put this *after* the Expert Objection. If you do it before, they'll use it to prove expertise works.
  **The Handling:**
  *   **Concede:** Yes, their probability of being right is high.
  *   **The Turn:** "If you accept their verdict on the 501st without looking, what happens to *your* capacity to judge the 502nd?"
  *   **The Point:** Aesthetic judgement is a muscle. Using testimony is like watching someone else lift the weights. Even if the spotter is perfect, *you* remain weak. The goal of the gallery is not correct verdicts; it is competent viewers.
  *   **Action:** Tell them: "Use the critic's track record to convince the visitor to *stay*, not to tell them what to *see*."

  ### 0:35–0:40 | Conclusion & The One Question
  **Wrap Up:**
  *   Refuse to solve the "Is there truth in art?" debate. (See Exclusions).
  *   Reiterate: Description is public; Judgement is personal. Welded terms are traps.
  *   **The Exclusions (What to flatly refuse):**
      1.  **Relativism:** Do not let them slide into "Beauty is in the eye of the beholder." This isn't about subjectivity; it's about *first-hand authority*.
      2.  **Art History:** Do not discuss context, biography, or movement. That is factual testimony, which is fine. Keep this strictly on *value*.
      3.  **Institutional Theory:** Do not discuss "Art is what the gallery says." That undermines the whole session.

  **The Final Question (The Litmus Test):**
  Do not ask: "Do you understand the limits of expertise?" (They will just say yes).
  **Ask this:**
  > *"If a visitor leaves this room saying 'That was brilliant' because you told them it was, but they spent less than thirty seconds looking at it—have you done your job?"*

  *   **Wrong Answer:** "Yes, they appreciated the art." (They missed the point).
  *   **Wrong Answer:** "No, they didn't learn anything." (Too school-ish).
  *   **Right Answer:** "No. They validated *my* taste, they didn't exercise *their* perception."

  ### Summary of Misconceptions & Deflections
  1.  **"Visitors want answers."** (Arrives 0:05)
      *   *Deflect:* They want *access*. Answers close the door; questions open it.
  2.  **"Experts know better."** (Arrives 0:20)
      *   *Deflect:* Experts know more *about*, but only the viewer knows *what it's like*.
  3.  **"Perfect track record."** (Arrives 0:30)
      *   *Deflect:* Trust builds confidence to look, not permission to skip looking.
  4.  **"Welded terms are just facts."** (Arrives 0:15)
      *   *Deflect:* "Clumsy" sounds like a fact, but it's a verdict disguised. Treat it as a verdict.

  ### Facilitator Notes
  *   **Tone:** Do not lecture. They are the experts on the floor. You are the expert on the *structure of the interaction*.
  *   **Pacing:** If the "Perfect Critic" argument drags, cut the "Welded Cases" detail but keep the principle. The "Perfect Critic" is the hardest philosophical nut; don't let them solve it, just let it bother them.
  *   **Physicality:** When discussing the Rothko, make them stand up. Simulate the distance. Make the "looking" physical.
