answer: |-
  You are struggling because you are trying to apply a single metric of "truth" to two different categories of claim. Your gut is actually consistent; your formulation is not. You are oscillating between **Correspondence Truth** (did it happen exactly this way?) and **Coherence Truth** (does this story sustain the community's moral or existential continuity?).

  The principle you are secretly using is **The Principle of Epistemic Domain.**

  It states: **The archival record holds jurisdiction over *structural events* (transactions, movements, official acts of power), while community memory holds jurisdiction over *lived experience* (trauma, character, existence, moral meaning).**

  Confusion arises when one source trespasses into the other's domain. Here is how you state it precisely to grind out your verdicts, followed by the sacrifice you must make.

  ### The Principle of Epistemic Domain

  **Clause 1: The Presumption of Structural Accuracy.**
  When the claim concerns a *structural event* (land transfer, travel logistics, official designation), the archival record is presumed accurate unless it can be shown to be a forgery or a product of coercive fabrication. Community memory regarding structural events is presumed to be mythologized.
  *   *Motivating Case:* **Case 1 (The Plaque) & Case 4 (The Novelist).**
  *   *Why it works:* In Case 1, the claim is about land title (structural). The Treaty (archive) documents the act of dispossession. The Plaque (memory) documents a myth of legitimacy. The Archive wins on the *event*. In Case 4, the claim is about travel logistics (structural). The Hotel Register (archive) documents movement. The Village (memory) documents pride. The Archive wins on the *event*.
  *   *Solves your 3 vs 4 bug:* In Case 3 (Massacre), the claim looks structural (a death count/event), but the Archive's silence is not neutral; it is an *act of erasure*. When the Archive's silence is constitutive of the violence (colonial erasure), it forfeits its structural jurisdiction. In Case 4, the Register's silence is administrative negligence, not constitutive erasure.

  **Clause 2: The Presumption of Experiential Sovereignty.**
  When the claim concerns *lived experience* (moral character, trauma magnitude, community existence), community memory is presumed accurate unless it actively serves the interests of the oppressor. The archival record regarding lived experience is presumed reductive or coercive.
  *   *Motivating Case:* **Case 2 (The Rescuer) & Case 6 (The Informant).**
  *   *Why it works:* In Case 2, the claim is about moral character (lived experience). The Notary (archive) records a transaction (structural), but cannot record the risk or the intent. Memory wins on the *meaning*. In Case 6, the claim is about moral character. The Secret Police file (archive) records an accusation made under a coercive regime. It claims to know the teacher's soul (lived experience). It forfeits jurisdiction. Memory wins on the *ambiguity*.
  *   *Solves your 1 vs 6 bug:* In Case 1, the Treaty records the *State's action* (removal), which falls under Structural Accuracy. In Case 6, the File records the *Subject's character* (informant), which falls under Experiential Sovereignty. You trust the Archive on what the Power *did*; you trust Memory on who the Vulnerable *was*.

  ### The Verdict You Must Drop

  This principle forces you to drop your hesitation in **Case 5 (The Massacre Numbers).**

  You wrote: *"The number gives way, but I resist saying the memory was wrong in the way the plaque was wrong."*

  Under the Principle of Epistemic Domain, this is unsustainable. The number of bodies is a **structural event** (forensic fact). The trauma of the massacre is **lived experience** (moral truth).
  *   **The Drop:** You must admit the memory *was* wrong about the number, exactly in the way the plaque was wrong about the sale. Both are factual errors regarding structural events.
  *   **The Repair:** You preserve the *trauma* (lived experience) as valid, but you must sever it from the *count* (structural event). To say the number "isn't wrong in the same way" is to grant memory a magical immunity to forensic reality that you rightly denied the Midwestern town in Case 1. The distinction isn't about the *wrongness*; it's about the *stakes*. The plaque's lie protected privilege; the massacre number's inflation protected grief. Both are factually false. Acknowledge the falsehood to honor the truth of the grief.

  *(Note: This principle also nudges you on Case 2. The "for nothing" claim is structural/transactional. You can hold that he was virtuous (memory) while admitting he was paid (archive). Don't let the memory overwrite the transaction; let them coexist.)*

  ### The Two New Cases

  **1. The Monument Without Memory**
  *A community's memory has hardened into a monument and museum exhibit, with nobody alive who remembers the event firsthand.*

  *   **Verdict:** Treat this as **Archive, not Memory.**
  *   **Reasoning:** Once memory is institutionalized into stone and exhibit text without living custodians to contest or nuance it, it becomes a structural claim. It is now a "plaque." It claims the authority of memory but lacks the vulnerability of memory. It should be subjected to Clause 1 (Structural Accuracy). If the exhibit says "Battle of 1850" and the records say "Skirmish of 1851," the exhibit yields. It is no longer "lived experience"; it is "official narrative."

  **2. The Archival Echo**
  *A memory that exists only because somebody in 1970 read the archive wrong — a memory manufactured by a record.*

  *   **Verdict:** Treat this as **Contaminated Memory.**
  *   **Reasoning:** This is the most dangerous category. It has the *feel* of lived experience (Clause 2) but the *source* of structural error (Clause 1).
  *   **Application:** You must trace the genealogy of the error. If the community *believes* it is memory (lived experience), you cannot simply debunk it without causing harm (violating Experiential Sovereignty). However, you cannot report it as truth.
  *   **The Fix:** You report the *memory of the error*. "The community remembers X, a story that entered local tradition after a 1970s misreading of the ledgers." This honors the community's current reality (they do hold this memory) without validating the false structural claim. It treats the 1970s error as the new "structural event" that generated the "lived experience."

  ### Summary for your Piece

  Your gut is telling you that **power determines jurisdiction.**
  *   When Power documents its own **actions**, believe it (Case 1 Treaty).
  *   When Power documents the **souls** of the vulnerable, distrust it (Case 6 Files).
  *   When the Vulnerable document their own **existence**, believe them (Case 3 Massacre).
  *   When the Vulnerable document **Power's benevolence**, distrust it (Case 1 Plaque).

  Your inconsistency vanishes if you stop asking "Which source is more accurate?" and start asking "Which source has the right to speak on *this specific kind of truth*?"
