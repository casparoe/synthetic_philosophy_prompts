answer: |-
  # ALDERGROVE RELEASE GOVERNANCE PROTOCOL (ARGP)
  **Version:** 4.1 (Deadlock Resolution)
  **Authority:** Release-Governance Board
  **Purpose:** To operationalize Charter Clauses L (Personal Sphere) and P (Unanimity) when they conflict.

  ## PART I: SCREENING TEST (The "Deadlock Detection")
  *Time allocation: 15 minutes. Led by Chair.*

  Before any vote on a release request, the Board must determine if the request triggers the **Deadlock Configuration**. If it does not, proceed to **Standard Voting Rules**. If it does, proceed to **Part II**.

  **A Deadlock Configuration exists if and only if all four conditions are met:**
  1.  **Multiple Sphere Claims:** At least two distinct Member Clinics invoke Clause L (Personal Sphere) regarding the *same* Release Request.
  2.  **Chained Pairs:** The claims create a chain of options where Clinic X claims authority over the choice between Option 1 and Option 2, and Clinic Y claims authority over the choice between Option 2 and Option 3 (where Option 3 may be the Status Quo/No Release).
  3.  **Unanimous Contradiction:** There is a pair of options (e.g., Option 1 vs. Option 3) where *all* Board Members (including Clinics X and Y) agree on a preference that contradicts the outcome implied by combining the Sphere Claims.
  4.  **No Dominant Option:** No single option is preferred to all others by the Board under the combined rules of L and P.

  **Instruction:** If any of the four conditions are absent, **STOP**. Apply Standard Voting Rules. Do not invoke Part II.
  **Instruction:** If all four conditions are present, **STOP**. Declare a Deadlock. Proceed to Part II.

  ---

  ## PART II: RESOLUTION LADDER
  *Time allocation: 60 minutes. Led by Chair.*
  *Note: Steps must be attempted in order. You may not skip to a lower step unless the higher step is factually impossible.*

  ### Step 1: Option Space Engineering (The "Technical Escape")
  **Trigger:** Deadlock Detected.
  **Action:** The Board shall ask: "Can the Release Request be modified to remove the objection without violating the research intent?"
  **Permissible Modifications:**
  *   **Segmentation:** Splitting the release into two separate approvals (e.g., Release A-Data now, Release B-Data later).
  *   **Safeguards:** Adding technical controls (e.g., "Enclave Only," "No Download," "Aggregated Results Only") that address the objecting Clinic's specific concern.
  *   **Scope Narrowing:** Reducing the variables or time-window of the data requested.
  **Stopping Point:** If a modified option is found that satisfies the Objecting Clinic (withdraws Clause L invocation) *and* maintains the Unanimous Preference (Clause P) for the remaining Board, adopt the modified option. **End Procedure.**
  **[JUDGMENT CALL 1]:** Determining whether a modification "violates research intent" is a scientific judgment, not a governance one. The Board must defer to the Lead Researcher's written certification on this.
  **Public Paragraph Requirement:** If resolved here, state: *"Release approved with modifications to address member privacy constraints."*

  ### Step 2: Preference Screening (The "Meddlesomeness Test")
  **Trigger:** Step 1 failed (no technical fix possible).
  **Action:** The Board shall examine the *basis* of each Clause L invocation.
  **Test:** Is the Clinic's objection based *solely* on the inclusion/exclusion of **its own patients' records**?
  *   **YES:** The claim is Valid under Clause L.
  *   **NO:** If the objection depends on the status of *another* Clinic's records (e.g., "I object to my data being released *if* Clinic D's data is also released"), the claim is **Invalid** under Clause L. It is treated as a standard preference subject to Clause P.
  **Stopping Point:** If invalidating one claim resolves the Deadlock (restores a clear winner), adopt the winner. **End Procedure.**
  **[JUDGMENT CALL 2]:** Distinguishing between "relational privacy" (my data + your data is risky) and "meddlesomeness" (I don't like what you are doing with your data) requires interpretation of the Clinic's stated reason. The Chair must record the Clinic's rationale verbatim.
  **Public Paragraph Requirement:** If resolved here, state: *"Decision based on scope of Personal Sphere authority as defined in Charter Clause L."*

  ### Step 3: The Priority Filter (Clause P vs. Clause L)
  **Trigger:** Step 2 failed (both claims are Valid Personal Sphere claims, yet they conflict with Unanimity).
  **Action:** The Board must apply the **Primacy Rule**.
  **Rule:** In a Deadlock Configuration, **Clause L (Personal Sphere) overrides Clause P (Unanimity).**
  **Rationale:** The Charter grants autonomy to Member Clinics as a condition of their participation. Efficiency (Pareto) is secondary to Membership Rights.
  **Stopping Point:** The option protected by the relevant Clause L invocation is selected, even if all members prefer the alternative.
  **[JUDGMENT CALL 3]:** This step requires the Board to avow that it is knowingly selecting an option that every member agrees is scientifically inferior. This cannot be buried.
  **Public Paragraph Requirement:** See Part IV (Template D).

  ### Step 4: Sphere Collision (The "Priority Ladder")
  **Trigger:** Two Clinics claim Clause L authority over the *exact same pair* of options (e.g., both claim veto power over the same dataset).
  **Action:** This is a Charter Gap. The Board shall apply the **Rotating Priority Ladder**.
  **Mechanism:**
  1.  Consult the "Sphere Priority Schedule" (a pre-determined annual list ranking Clinics 1–11, randomized at the start of the fiscal year).
  2.  The Clinic with the higher rank (lower number) prevails.
  **Stopping Point:** The higher-ranked Clinic's preference dictates the outcome.
  **[JUDGMENT CALL 4]:** The existence of the Priority Ladder itself is a policy choice that must be ratified by the Annual Assembly. The Board cannot invent the ranking mid-meeting.
  **Public Paragraph Requirement:** See Part IV (Template E).

  ### Step 5: Status Quo (The "Failure Mode")
  **Trigger:** All previous steps fail, or the Board refuses to invoke Step 3 (Primacy Rule).
  **Action:** The Request Lapses. No Release.
  **Instruction:** This is not a neutral outcome. It is an active decision to prioritize risk-aversion over research utility.
  **Public Paragraph Requirement:** See Part IV (Template F).

  ---

  ## PART III: INFORMATION & OPTION HANDLING
  *Time allocation: 15 minutes. Integrated into Steps above.*

  1.  **Partial Rankings:** Clinics are not required to rank all options.
      *   **Rule:** Silence on a pairwise comparison is treated as **Indifference**, *unless* the Clinic has invoked Clause L on that pair.
      *   **Exception:** If a Clinic refuses to rank an option they previously deemed "off the table," that option is treated as **Unavailable** for the purpose of Cycle Detection (Part I, Condition 4).
  2.  **Decoy Options:**
      *   **Test:** An option is a Decoy if it is technically infeasible or legally non-compliant.
      *   **Rule:** Decoys are removed from the option set *before* Part I Screening. A cycle generated by a Decoy is not a Deadlock Configuration.
      *   **[JUDGMENT CALL 5]:** The Data Steward must certify feasibility. This certification must be appended to the meeting minutes.
  3.  **Strategic Voting:**
      *   The Board does not police motive. If a Clinic invokes Clause L, the invocation is accepted as Valid unless it fails the Meddlesomeness Test (Part II, Step 2).

  ---

  ## PART IV: PUBLIC DEFENSE (The Paragraph)
  *Instruction: Select the template matching the Resolution Step used. Do not mix templates.*

  *   **Template A (Standard):** "The Board approved Request #[ID] following standard review. All member clinics supported the release parameters."
  *   **Template B (Technical Escape):** "The Board approved Request #[ID] with modifications. Technical safeguards were added to align data access with member clinic privacy requirements without compromising study validity."
  *   **Template C (Meddlesomeness):** "The Board approved Request #[ID]. One member objection was reviewed and determined to fall outside the Personal Sphere protections of Clause L, as it concerned the data custody of another member."
  *   **Template D (L > P Primacy):** "The Board approved/denied Request #[ID] pursuant to Clause L. While a unanimous preference existed for the alternative outcome, the Board prioritized Member Clinic autonomy over scientific optimization to uphold the Trust's governance charter." **(Required for Step 3)**
  *   **Template E (Priority Ladder):** "The Board denied Request #[ID] due to conflicting authority claims. Under the Rotating Priority Schedule, the objection of Clinic [Name] prevailed." **(Required for Step 4)**
  *   **Template F (Status Quo):** "The Board denied Request #[ID]. The governance framework did not yield a determinate outcome that satisfied Charter requirements for member autonomy and consensus. The Status Quo was retained." **(Required for Step 5)**

  ---

  ## PART V: PROCEDURE LIMITATIONS & COSTS
  *For Internal Board Use Only.*

  1.  **What this procedure cannot do:** It cannot generate a "best" outcome when values are fundamentally contradictory. It can only select a *rule* for choosing.
  2.  **The Cost of L > P (Step 3):** By prioritizing Clause L over Clause P, the Board accepts that **scientifically useless studies may be approved** (if L demands it) or **vital studies may be blocked** (if L demands it). We sacrifice social welfare for procedural integrity.
  3.  **The Cost of Priority Ladder (Step 4):** This institutionalizes arbitrariness. It tells Member Clinics that their rights are unequal. This risks long-term trust in the Federation.
  4.  **Irreducible Judgment:** The definition of "Personal Sphere" (Step 2) is the single point of theoretical vulnerability. No algorithm can perfectly distinguish between "protecting my patients" and "controlling my neighbors." The Board must own this interpretation.

  ---

  ## APPLICATION TO TEST CASES

  ### Case 1: The Merged Registry (Overlapping Spheres)
  **Scenario:** Clinics X and Y jointly control a merged registry. Both invoke Clause L to veto the inclusion of this registry in a release.
  **Analysis:**
  1.  **Screening:** This is *not* the Sen Configuration. Sen requires two *distinct* pairs (X decides A/B, Y decides B/C). Here, both claim authority over the *same* pair (Include/Exclude Merged Data).
  2.  **Procedure Application:**
      *   **Step 1 (Engineering):** Can the registry be split? If the data is technically inseparable, Step 1 fails.
      *   **Step 2 (Meddlesomeness):** Both claims are about "their own" records (jointly owned). Both pass the test.
      *   **Step 3 (L > P):** Does not apply directly, as P is not necessarily contradicting L here; rather, L is contradicting L.
      *   **Step 4 (Sphere Collision):** This is the trigger. Two clinics claim authority over the exact same sphere.
  3.  **Outcome:** The procedure escalates to **Step 4 (Priority Ladder)**.
  4.  **Public Paragraph:** Must use **Template E**.
  5.  **Concession:** The paragraph must concede: *"Conflicting authority claims over shared assets were resolved via pre-established priority ranking."* This admits the Charter has a gap regarding shared custody.
  6.  **Unpalatable Truth:** If the Priority Ladder is not yet established (as implied by "charter I inherited"), the Board has **no authority to decide**. The procedure forces a **Step 5 (Status Quo)** and refers the matter to the Annual Assembly to amend the Charter. You cannot run the ladder if the rungs don't exist.

  ### Case 2: The Relational Objection (Clinic C vs. Clinic D)
  **Scenario:** Clinic C refuses to allow its records in *any* release that also contains D's records. C prefers No Release to (C+D). Everyone else prefers (C+D) to No Release.
  **Analysis:**
  1.  **Screening:** C invokes Clause L. Is this a Valid Personal Sphere claim?
  2.  **Procedure Application:**
      *   **Step 2 (Meddlesomeness Test):** C's objection is conditional on *D's* status. C is claiming authority over the joint state (C-In AND D-In).
      *   **Ruling:** Under the ARGP, Clause L protects "inclusion or exclusion of **its own** patients' records." It does not protect "inclusion of its own records **contingent on another's exclusion**."
      *   **Decision:** C's preference regarding D is **Invalid** under Clause L. It is treated as a standard preference.
      *   **Result:** Since all members (including D) prefer (C+D) to No Release, Clause P (Unanimity) dictates the release proceeds. C's veto is overruled.
  3.  **Public Paragraph:** Must use **Template C**. *"Decision based on scope of Personal Sphere authority..."*
  4.  **The Cost (L vs P):** You asked to keep Clause L over Clause P. However, in this case, upholding Clause L *broadly* (allowing relational vetoes) effectively grants every Clinic a veto over every other Clinic. This creates a "Liberalism of the Veto" where no multi-clinic research is possible.
  5.  **Unpalatable Answer:** To keep the Trust functional, you **must** adopt the **Narrow Reading** of Clause L.
      *   **Narrow Reading:** "My Sphere = My Data." (Procedure holds).
      *   **Wide Reading:** "My Sphere = Any outcome affecting my patients' interests." (Procedure collapses; Trust dissolves into unanimity rule).
      *   **Judgment Call:** You must avow in the minutes (though not necessarily the public paragraph) that **relational privacy claims are not protected liberties.**
      *   **Patient Representative Conflict:** Your patient reps will hate this. They view privacy as contextual. The procedure forces you to tell them: *"Clause L protects autonomy, not context. If you want contextual protection, you must negotiate Safeguards (Step 1), not claim Rights (Step 2)."*
      *   **Where the Procedure Runs Out:** If C argues that the *risk* of re-identification increases mathematically when D's data is present, this becomes a **Step 1 (Engineering/Safety)** issue, not a Clause L issue. If the risk is negligible, C's objection is purely political/relational, and the procedure overrides it. You must be prepared to enforce this distinction.

  ### Final Instruction on Clause P vs. Clause L
  You asked: *"Applying Clause P first as a filter and Clause L only within what survives... I want to be told whether I am right [that it guts L]."*

  **Answer:** You are right.
  If you apply Clause P first, you filter out any option that is Pareto-dominated. In the Sen Configuration, the "Liberal" outcome is *always* Pareto-dominated by the "Unanimous" outcome.
  *   *Example:* A prefers No Release (N) over Release-A (RA) based on L. Everyone prefers RA over N based on P.
  *   If P filters first, N is removed. A's Liberal right is rendered null.
  *   **Cost of keeping L (as you instructed):** You accept that the Trust will occasionally fund inferior science or block superior science to maintain the integrity of the membership contract.
  *   **Cost of keeping P:** You maintain scientific efficiency but convert Member Clinics from "Partners with Rights" to "Data Suppliers with Preferences." This may cause Clinics like A to leave the Trust.

  **Recommendation:** The ARGP prioritizes L (Step 3) because a Health Data Trust relies on voluntary data contribution. If Clinics feel their Sphere is violable by a Unanimity vote, they will withdraw data. The cost is scientific inefficiency; the benefit is federation stability.
