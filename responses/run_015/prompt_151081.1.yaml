      *   **Negative Liberty (Berlinian tradition):** Freedom is the absence of external interference/obstacles. If no one stops you, you are free. A benevolent master who doesn't interfere leaves you free, even if you are dependent.
      *   **Republican Liberty (Neo-Roman/Pettit/Skinner tradition):** Freedom is non-domination. It requires the absence of arbitrary power. Even if a master doesn't interfere, the *capacity* to interfere arbitrarily makes you unfree. Freedom requires robustness against potential interference.
      *   **Positive Liberty (The "Other"):** Freedom is self-mastery, autonomy, or capability. Often associated with internal constraints or resource requirements. Both Negative and Republican libertarians usually distinguish themselves from this (though Republicans sometimes overlap on structural requirements).

  3.  **Drafting Part 1: Agreed-Claims Section:**
