      *   *Real Test:* Processing load. $A \land (B \land C)$ vs $(A \land B) \land C$. If complexity scales with syntactic depth, that's evidence for syntactic sensitivity. If it scales with semantic difficulty only, that's evidence against.
      *   *Confidence:* Moderate. This is the best empirical hook we have.

