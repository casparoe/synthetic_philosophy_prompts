  7.  **Finalizing the "Clause 4" argument:**
      *   The best way to operationalize "sensitivity to taxonomy" is **format specificity**.
      *   If the system processes $A \land B$ differently than $B \land A$ purely due to order (syntax), that's sensitivity.
