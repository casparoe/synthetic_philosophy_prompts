answer: |-
  Your tutor might say you're overcomplicating it because Strawson's framework is famously robust; it's designed to be elastic enough to handle all interpersonal moral life. The standard defense of Strawson would be that your anger at the algorithm is just *redistributed* resentment. You resent the designers, the CEO, or the society that allowed it. Therefore, the binary holds: you are either in a participant stance toward the humans involved, or you take an objective stance toward the machine.

  But you are right to feel that this doesn't capture the phenomenology of the experience. When you are denied a loan by a black-box system, your anger isn't necessarily directed at a specific coder in Nebraska, nor do you view the system as a mere natural force like a thunderstorm (which would be the objective attitude). You feel a specific kind of moral violation that the binary forces you to misdescribe.

  Here is the argument for why Strawson's binary collapses in cases of structural harm, and why we need a third category: **Structural Reactive Attitudes.**

  ### 1. The Strawsonian Binary and the Demand for Regard
  To see where the collapse happens, we have to look at what actually drives Strawson's distinction. It isn't just about "agents" vs. "objects." It is about the **participant stance** versus the **objective stance**.

  *   **Reactive Attitudes (Participant):** These are emotions like resentment, indignation, and guilt. They arise because we demand a certain degree of **good will or regard** from others. When that demand is flouted, we feel resentment. Crucially, this stance treats the other as a member of the moral community, capable of understanding and responding to the demand.
  *   **Objective Attitudes:** This is the stance of the clinician, the manager, or the observer. We suspend the demand for regard. We don't resent a tornado, and we don't resent a small child or someone in the throes of a psychotic episode (what Strawson calls "exemptions"). We simply manage them.

  Strawson assumes that if there is no appropriate target for the demand for regard (i.e., no responsible agent), we *must* slide into the objective attitude. This is where the framework breaks down in the context of structural harm.

  ### 2. The Collapse: Algorithmic Harm and the Diffused Agent
  Consider the credit-scoring algorithm. It denies you a loan based on biased historical data.

  If you follow Strawson strictly, you have two options:
  1.  **Resent an Agent:** You find a human to blame (the CEO, the data team).
  2.  **Take the Objective Attitude:** You view the algorithm as a broken tool, a force of nature, or a technical glitch to be managed without moral anger.

  But neither fits the reality.
  *   **Why it's not purely Objective:** You do not feel detached. You do not feel like a clinician looking at a specimen. You feel *wronged*. You feel a demand for justification. If the bank says, "The computer said no," you do not accept this as you would accept "The rain cancelled the picnic." You demand an account. This indicates you are still in a participatory stance; you are demanding reasons, which is the hallmark of the reactive sphere.
  *   **Why it's not standard Reactive:** There is no single will to resent. The harm is the result of thousands of micro-decisions, historical data, and code structures. No single individual may have willed the discrimination. If you try to direct standard resentment at the "system," Strawson would say you are making a category mistake. Systems don't have a "quality of will."

  Here is the collapse: **You are maintaining the participatory stance (demanding regard/justice) without a specific agent to hold responsible.** Strawson ties the participatory stance inextricably to individual interpersonal relationships. He assumes that if the "quality of will" is absent, the demand for regard must be suspended. But in structural harm, the demand for regard remains, even though the "will" is embedded in the architecture, not a mind.

  ### 3. The Case for "Structural Reactive Attitudes"
  This gap necessitates a third category. Let's call it **Structural Reactive Attitudes**.

  Like standard reactive attitudes, these are **participatory**. They refuse the detachment of the objective stance. They insist that the situation is a moral one, not merely a technical or causal one. We are not asking to "fix" the algorithm like we fix a car; we are asking for *justice*.

  However, unlike standard reactive attitudes, they are **non-agential**. They do not target a specific quality of will in a specific person. Instead, they target the **normative architecture** of the relationship.

  *   **The Object of the Attitude:** In standard resentment, I resent *you* for slighting *me*. In structural reactive attitudes, I resent *the arrangement* for failing to embody the requisite regard.
  *   **The Demand:** The demand is not for an apology from a specific agent (though that might help), but for a **reconfiguration of the structure**. The "good will" demanded is not psychological, but institutional.
  *   **The Function:** Just as resentment enforces moral norms between individuals, structural reactive attitudes enforce moral norms upon systems. They signal that a structure is failing to participate in the moral community correctly.

  This category captures the specific feeling you identified: it is hot, participatory, and demanding (unlike the objective stance), but it is diffuse and systemic rather than interpersonal (unlike standard reactive attitudes).

  ### 4. Why This Matters (Against the Tutor)
  Your tutor might argue this is just "indignation" (a vicarious reactive attitude) directed at society. But indignation usually implies a third party observing a wrong done to someone else. When *you* are the victim of the algorithm, it is personal resentment, not vicarious indignation.

  If we force this experience into Strawson's binary, we lose something vital. If we call it **Objective**, we depoliticize the harm (it becomes a technical glitch). If we force it into **Reactive**, we engage in a witch hunt for a specific villain who might not exist, leading to misplaced blame.

  Acknowledging **Structural Reactive Attitudes** validates the feeling that we are being treated unfairly by something that isn't quite a "who" but isn't quite a "what" either. It allows us to say: "I hold this structure responsible," without needing to pretend the structure is a person.

  ### 5. Where the Argument is Weakest
  To be rigorous, you need to flag where this proposal is vulnerable.

  1.  **The Reductionist Objection:** A strict Strawsonian will argue that structures are just people. The algorithm was built by people, funded by people, and regulated by people. Therefore, "structural resentment" is just shorthand for resentment toward the collective will of those people. If you can't find the specific person, that's an epistemic problem, not a metaphysical one. *Counter:* This ignores the "problem of many hands." When harm is emergent, no collective will exists that matches the harm.
  2.  **The "Regard" Problem:** Strawson anchors reactive attitudes in the demand for *good will*. Can a structure show good will? If not, can we truly have a reactive attitude toward it? You might be stretching the definition of "regard" so thin it snaps. You need to argue that "regard" can be institutionalized (e.g., fair procedures are a form of institutional regard).
  3.  **Action Guidance:** Reactive attitudes lead to specific responses (confrontation, forgiveness). What does a Structural Reactive Attitude lead to? Sabotage? Reform? Voting? If the behavioral output is unclear, it might not function as a true moral attitude in Strawson's sense.

  ### Conclusion
  You aren't overcomplicating it; you are updating the ontology. Strawson wrote in a world of face-to-face interaction. He didn't anticipate bureaucratic and algorithmic mediation where the "will" is coded into the background.

  The binary collapses because the **participant stance** (demanding justice) can survive even when the **individual agent** (the target of resentment) dissolves. By positing **Structural Reactive Attitudes**, you preserve the moral intensity of the victim's experience without resorting to the fiction of a single villain or the coldness of the objective stance. It is a necessary evolution of the framework to account for the way we actually live now.
