prompt: |-
  I just got voted onto the standards committee of my professional association (nursing, about 4,000 members in the state chapter) and I am definately in over my head. Here's the problem. Two years ago we finally passed a real ethics code after the whole mess with the previous board. Now people keep filing complaints about things members did *before* the code existed. Technically allowed back then, or at least nobody ever wrote down that it wasn't. And I keep noticing that the people pushing hardest for us to go after the old guard are a lot of the same people who were in the room while all of it was happening. The full board has to ratify whatever we recommend, and half of them would honestly rather we buried the whole thing.

  I've been reading about Nuremberg and Tokyo on my own time because it feels like exactly our problem, and now I can't unsee it. The charter they used was written after the acts they were judging, which is why the defense kept yelling ex post facto; the answer was that the 1928 treaty renouncing war as an instrument of national policy had already made aggression illegal, plus the idea that some acts are criminal under general principles no matter what the local law says. The defendants tried tu quoque -- you did it too -- and got nowhere. One judge at Tokyo thought every single defendant should walk and basically called the trial the winners taking revenge; he pointed out that Allied firebombing and the atomic bomb were not on the charge sheet and that no judges from the losing side sat on the bench. Also, superior orders was not a defense, only something that could lighten a sentence, and there was a conspiracy charge that let them convict the people who planned it rather than the ones who pulled the trigger. Later international law swung back the other way and made non-retroactivity a hard rule again.

  So can you turn this into a decision procedure my committee can actually run? I get maybe twenty minutes per case and I have no legal training. I need the questions in order, what counts as a good enough answer to each one, where it stops and says no, and where it has to stop and hand off to a committee vote because its a value call and not a fact call. Don't send me to any sources or give me a reading list, I can't look anything up -- just build the ideas into the steps.

  Then run the procedure on the three complaints we're sitting on: (1) a member who harassed a junior colleague in 2019, back when our old code was silent about it and everyone knew it; (2) a complaint against a former officer for taking industry gifts that three people currently on my committee also took; (3) a complaint against a department head who designed the production quota that led to the falsified records, even though he never falsified a single one himself. And tell me honestly where the procedure spits out an answer I won't like, and what it just can't do.

  American English, please.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Situation:**
      *   **User Role:** Newly elected member of a Standards Committee for a state nursing association (approx. 4,000 members).
      *   **Problem:** Complaints are being filed about conduct that occurred *before* the current Ethics Code was adopted (2 years ago). The old code was silent/ambiguous on these issues.
      *   **Political Context:** The people pushing for prosecution were present during the prior era (potential hypocrisy/bias). The Board (who ratifies) wants to bury the issue (potential cover-up).
      *   **User's Mental Model:** The user is comparing this to the Nuremberg/Tokyo trials (ex post facto laws, tu quoque, superior orders, conspiracy). This is a *high-stakes* analogy for a professional nursing body. It suggests the user feels the prior conduct was morally egregious but legally/technically defensible.
      *   **Constraints:** No legal training, 20 minutes per case, no external sources/reading lists, needs a concrete decision procedure (flowchart-style), needs application to three specific cases, needs honesty about limitations/unpleasant outcomes.
      *   **Tone:** American English, practical, ethical, realistic, cautious (avoiding legal liability for the association).

  2.  **Evaluate the Nuremberg Analogy:**
      *   *Strengths:* Highlights the tension between "it wasn't written down" vs. "everyone knew it was wrong." Addresses the "I was just following orders/designing the system" defense.
      *   *Weaknesses/Dangers:* Nuremberg dealt with crimes against humanity and war crimes under international law. A nursing association deals with professional licensure, reputation, and membership status. Applying "crimes against humanity" logic to workplace harassment or industry gifts could expose the association to lawsuits (defamation, breach of contract, violation of bylaws). The user needs to be grounded in *professional ethics*, not *international criminal law*.
      *   *Action:* I need to gently pivot the user away from the Nuremberg framework while respecting the underlying ethical intuition. The procedure must protect the association from legal risk while upholding ethical standards. *Ex post facto* punishment in a private organization is risky.

  3.  **Drafting the Decision Procedure:**
      *   *Goal:* A step-by-step filter that can be run in 20 minutes.
      *   *Structure:* Sequential questions. If "No" -> Stop/Dismiss. If "Yes" -> Proceed. If "Unclear/Value Judgment" -> Escalate to Vote.
      *   *Key Legal/Ethical Concepts to Embed (without citing law):*
          *   Notice (Did they know it was wrong?)
          *   Harm (Was there actual damage?)
          *   Consistency (Are we applying this evenly?)
          *   Authority (Do we actually have the power to do this?)
          *   Bias (Is the accuser compromised?)
      *   *Step 1: Jurisdiction/Authority.* Can we even judge this? (Membership status at time of act vs. now).
      *   *Step 2: The "Known Wrong" Standard.* Replaces Nuremberg's "general principles." Was it universally understood as unacceptable *at the time*, even if not written?
      *   *Step 3: Harm/Impact.* Nursing is about patient/colleague safety. Was there tangible harm?
      *   *Step 4: Consistency/Selective Enforcement.* Addresses the "tu quoque" / hypocrisy angle. Are we punishing only some?
      *   *Step 5: Recommendation.* Sanction vs. Dismiss vs. Board Vote.

  4.  **Refining the Procedure (Self-Correction during drafting):**
      *   *Critique:* If I tell them to punish based on "everyone knew," that's still *ex post facto*.
      *   *Correction:* The procedure needs to be stricter. If the code didn't exist, the default should be *no punishment* unless the conduct violated *law* or *universal professional norms* (like patient safety). Harassment might fit, but gifts might not.
      *   *Safety Valve:* I need to include a step that explicitly checks for "Retaliation/Political Motive" because the user mentioned the accusers were in the room during the bad times.
      *   *Legal Reality Check:* I must warn the user that private associations can be sued for breach of contract (bylaws). Punishing someone for something allowed at the time is a lawsuit waiting to happen. The procedure needs to reflect risk management.

  5.  **Applying the Procedure to the Three Cases:**
      *   *Case 1 (Harassment 2019):* Old code silent. Everyone knew it happened.
          *   *Analysis:* Harm is clear. "Known wrong" is likely yes (hostile work environment). But *ex post facto* risk is high.
          *   *Outcome:* Likely needs Board Vote because it's a value call on retroactivity.
      *   *Case 2 (Industry Gifts):* Former officer + current committee members did it.
          *   *Analysis:* Consistency failure. If current members did it, you can't punish the former officer without punishing yourselves.
          *   *Outcome:* Dismiss or Recuse. This is the "tu quoque" trap.
      *   *Case 3 (Quota Designer):* Didn't falsify, but created the system.
          *   *Analysis:* "Superior Orders/Conspiracy" angle. Did they intend the fraud?
          *   *Outcome:* Hard to prove intent without written evidence. Likely dismiss unless there's proof of instruction.

  6.  **Addressing the "Unpleasant Truths":**
      *   The user wants honesty.
      *   *Truth 1:* You probably can't punish retroactively without getting sued.
      *   *Truth 2:* The Nuremberg analogy is dangerous for a nursing board.
      *   *Truth 3:* If the Board wants to bury it, they might override you anyway.
      *   *Truth 4:* Your committee members (accusers) might be compromised.

  7.  **Final Review against Constraints:**
      *   American English? Yes.
      *   No sources/reading list? Yes.
      *   Decision procedure included? Yes.
      *   Three cases analyzed? Yes.
      *   Honest limitations stated? Yes.
      *   20-minute timeframe respected? (Keep steps concise).

  8.  **Final Polish:** Ensure the tone is supportive but firm on the legal/ethical risks. The user is "in over their head," so clarity is king. Avoid jargon. Make the "Stop" points very clear. (Self-correction: Ensure I don't give legal advice, but rather procedural advice based on governance best practices).

  *(Self-Correction on the Nuremberg Analogy)*: I need to explicitly tell the user that while their moral intuition is sound, applying international criminal law standards to a professional licensing body is a category error that invites disaster. I will weave this into the "Limitations" section.

  *(Refining the Procedure Steps)*:
  1. Jurisdiction (Were they a member?)
  2. The "Red Flag" Test (Was this illegal or universally condemned *at the time*?)
  3. The Harm Test (Did it hurt patients or the profession?)
  4. The Clean Hands Test (Are the accusers/committee compromised?)
  5. The Consistency Test (Are we punishing everyone who did this?)
  6. The Recommendation (Sanction, Dismiss, or Board Decision).

