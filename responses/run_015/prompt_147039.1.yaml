      *   *Option 3: Hart-Centric.* Start with Hart's Rule of Recognition. Show where the amendment rule fits. Show the gap. Use Nomic as an illustration.
          *   *Critique:* Risks turning into a lecture on Hart rather than the specific paradox. The prompt emphasizes the *paradox* as the single takeaway, not Hart exegesis.
