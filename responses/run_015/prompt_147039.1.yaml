  2.  **Deconstruct the Core Problem (The Paradox of Self-Amendment):**
      *   What is it? If a rule says "Rules can be changed by X," can "X" be changed by "X"? If yes, the rule changes itself. If no, the rule is immutable, limiting sovereignty.
      *   Hart's view: The Rule of Recognition is a social fact, not legally valid/invalid in the same way. It just *is*.
      *   The Problem: If the Rule of Recognition includes an amendment procedure, can that procedure amend itself?
