prompt: |-
  You are a philosopher of law who has taught introduction to legal theory many times. Think the problem through before you write, and show the deliberation: sketch two or three orderings you considered for the session and say why you rejected each before committing to the one you'd actually run.

  I'm a PhD student in legal theory with a fifty-minute section next week. The students are first-years who have just read Hart on primary and secondary rules and who mostly arrive thinking law is just whatever the rulebook currently says. The single idea they must leave with is the paradox of self-amendment. We will have spent the first twenty minutes playing Nomic with a deliberately doctored initial rule set: rules of play can be added, repealed or altered by majority vote; the two rules governing rule-change can be altered only by unanimity; and one further rule forbids any proposal whose sole effect is to lower a voting threshold. So they will have watched a proposal to lower the unanimity requirement fail under the very rule it was trying to change, while a two-step manoeuvre — repeal the anti-lowering rule first, then lower the threshold — was available the whole time.

  Plan the explanation I should give afterwards; don't give me the explanation itself. What must be in place before the general point can even be stated, and what depends on what? Which one example should carry the whole thing — the move from our own game, or the clause in Article V that shielded two clauses of Article One from amendment until 1808 while leaving a third, unexpired, shield of its own — and why not the other? Give me the misconceptions in the order they will form, and where in the sequence to head each off: I expect at least "the amendment rule is just a higher-order rule, so applying it to itself is nothing special", "if a move was legal when made, later rules cannot touch it", "an entrenched rule is unreachable", "so legal validity is a sham and anything goes", and "it's basically Gödel's incompleteness theorem". Tell me what I should openly refuse to explain at this level, and give me one question to end on that would show they have grasped the paradox rather than just remembered the game. No readings, please — I'll assign those myself.

  Finally, mark explicitly which of the claims in your plan you'd present as settled among people who work on this and which are genuinely contested (whether real legal systems are in the same boat as the game, whether Article V is the exclusive amending route, whether an unamendable shield can itself be amended). I don't want to tell first-years that self-amendment makes legal validity indeterminate tout court if that is still a live dispute.
