      *   *Argument:* Use the **Nomic game** to carry the logical weight. Why? Because in Nomic, the rules *are* the game. In the Constitution, there's a background of political reality, courts, and revolution that obscures the pure logical paradox. The Article V example is better for *application*, but Nomic is better for *conceptual grasp*.
      *   *Counter-argument:* But they are law students. They need to see it in law.
      *   *Resolution:* Use Nomic to *establish* the paradox, but use Article V to *validate* its importance. But if forced to pick the *carrier*: Nomic. It's the controlled experiment. The Article V example is historically contingent (1808 has passed). The Nomic rule is live.
      *   *Actually, a better philosophical move:* Use Nomic to show the *structure*, but acknowledge that real law (Article V) adds complexity. I will argue for Nomic as the primary pedagogical tool because the "two-step manoeuvre" they witnessed is the key to dissolving (or navigating) the paradox, which is clearer in the game than in constitutional history.

