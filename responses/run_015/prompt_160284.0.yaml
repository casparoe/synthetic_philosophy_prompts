answer: |-
  **Question 1:** A choice must be made: either one person loses a finger, or one million different people each suffer a severe migraine for an hour. The finger-loss is physically worse for its victim than any single migraine is for its victim. Must you prevent the finger-loss?
  *   **Yes, save the finger.** → Go to **Question 6**.
  *   **No, prevent the migraines.** → Go to **Question 2**.
  *   **Only if the harms are exactly equal; otherwise flip a coin.** → **Leaf 1**.

  **Question 2:** Suppose instead the choice is: one person loses a finger, or one *single* person suffers one million severe migraines over the course of a year. Must you prevent the finger-loss?
  *   **Yes, save the finger.** → **Leaf 2**.
  *   **No, prevent the migraines.** → Go to **Question 3**.

  **Question 3:** Suppose the one million migraine sufferers are genetically identical clones created for this scenario, sharing a single consciousness stream, versus one million distinct strangers. Does the reason to save them change strength?
  *   **Yes, distinct strangers matter more (or less) than clones.** → Go to **Question 4**.
  *   **No, the total pain is what matters regardless of person-boundaries.** → **Leaf 3**.

  **Question 4:** Does saving the 1,000th migraine sufferer add the same amount of moral weight as saving the 10th sufferer?
  *   **No, the weight diminishes as numbers grow.** → **Leaf 4**.
  *   **Yes, each complaint adds equal weight.** → Go to **Question 5**.

  **Question 5:** Consider a policy choice: Option A makes 60% of people slightly better off; Option B makes 40% of people much better off. Is the reasoning for choosing B over A identical to the reasoning for preventing the migraines in Question 1?
  *   **Yes, benefits and harms are weighed by the same scale.** → **Leaf 5**.
  *   **No, numbers count for harms but not benefits (or vice versa).** → Go to **Question 6**.

  **Question 6:** Suppose the harm to each of the million people is so small that nobody notices it or remembers it later (e.g., a microscopic vibration). Does this generate a valid complaint?
  *   **No, below a certain threshold, there is no complaint.** → **Leaf 6**.
  *   **Yes, even unnoticeable harms generate complaints.** → **Leaf 7**.

  **Question 7:** (Reached from Q1 "Yes") When comparing the finger-loser to the million migraine sufferers, do you compare the finger-loser to the group as a whole, or to each individual separately?
  *   **To the group as a whole.** → **Leaf 8**.
  *   **To each individual separately.** → Go to **Question 8**.

  **Question 8:** A policy imposes a 1-in-1,000,000 risk of death on everyone to save one identified person from certain death. Do the aggregated risks count as complaints against the policy?
  *   **Yes, ex ante risks generate complaints.** → **Leaf 9**.
  *   **No, only actual ex post outcomes generate complaints.** → **Leaf 10**.

  ***

  **Leaf 1: Numbers as Tie-Breakers**
  *Awkward Commitment:* You must let a million people suffer migraines rather than save them if doing so requires imposing a trivially larger harm on one person, unless the harms are perfectly identical.

  **Leaf 2: Intrapersonal Summing Only**
  *Awkward Commitment:* You must save one person from a broken arm rather than save a million others from headaches, unless all the headaches happen to fall on a single person's life.

  **Leaf 3: Group Complaint View**
  *Awkward Commitment:* The moral force comes from the collective fact of "a million suffering," implying groups can hold complaints distinct from the individuals composing them.

  **Leaf 4: Diminishing Marginal Weight**
  *Awkward Commitment:* There is no fixed formula for how much the 1,000th complaint counts compared to the 10th, making moral calculation radically indeterminate in large-number cases.

  **Leaf 5: Full Symmetry View**
  *Awkward Commitment:* You must prioritize the 40% who gain greatly over the 60% who gain slightly, even if the 60% are already much worse off than the 40% to begin with.

  **Leaf 6: Threshold Contractualism**
  *Awkward Commitment:* If you spread a harm thinly enough across enough people so that no single person crosses the threshold, you have wronged no one even if the total suffering is vast.

  **Leaf 7: Asymmetric Linear Aggregation**
  *Awkward Commitment:* You must save the million migraine sufferers, but you cannot justify imposing a tiny tax on the million to provide a large benefit to one person.

  **Leaf 8: One-to-Many Pairwise**
  *Awkward Commitment:* An individual can be reasonably rejected by a group even if no single member of that group has a complaint strong enough to reject them individually.

  **Leaf 9: Ex Ante Contractualism**
  *Awkward Commitment:* You must forbid a policy that saves a life if it imposes a tiny risk on everyone else, even if the risk never materializes for anyone.

  **Leaf 10: Strict Ex Post Pairwise**
  *Awkward Commitment:* In cases of unidentified risk, you must ignore the statistical deaths caused by a policy and focus only on the identified victim you could have saved.

  ***

  ### Global Notes

  **Empty Cells in Logical Space**
  *   **Ex Ante Benefits / Ex Post Harms:** A view that aggregates risks for benefits (Question 5) but refuses to aggregate risks for harms (Question 8). *Guess:* Incoherent; hard to justify why risk matters for gain but not loss.
  *   **Threshold for Harms / Linear for Benefits:** A view that ignores unnoticeable harms (Question 6) but counts unnoticeable benefits in the 60/40 case (Question 5). *Guess:* Merely unwritten; likely unstable upon reflection about symmetry.
  *   **Intrapersonal No / Interpersonal Yes:** A view that sums headaches across a million people but not across one person's life (Question 2 reversed). *Guess:* Incoherent; if person-boundaries don't matter across lives, why do they matter within a life?

  **Unseparable Leaves**
  *   **Leaf 4 (Diminishing Weight) vs. Leaf 6 (Threshold):** Empirically, these views often recommend the same actions in real-world cases because diminishing weight functionally creates a practical threshold. Separating them requires hypothetical cases with precise numerical intuitions students may not share.
  *   **Leaf 9 (Ex Ante) vs. Leaf 10 (Ex Post):** In cases where risks are known but outcomes are uncertain, these views diverge sharply, but in retrospective justification (what actually happened), they often converge on the same verdict, making them hard to distinguish without strict hypotheticals.

  **Cases Handled Badly**
  *   **The "Identified Victim" Effect:** The tree treats identified vs. statistical victims primarily in Question 8, but the psychological/moral weight of identification often influences answers to Question 1 as well, which the tree forces into a binary choice.
  *   **Partial Aggregation:** The tree assumes a view either aggregates or it doesn't. It does not easily capture views that aggregate only when complaints are "relevantly similar" or when numbers reach a specific magnitude short of infinity.
