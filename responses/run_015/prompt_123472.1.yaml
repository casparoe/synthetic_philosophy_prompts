answer: |-
  To serve both the comparativist coding cases and the domestic actor deciding on resistance, a concept of democratic backsliding must balance external reliability with internal urgency. The comparativist needs consistent, ex-post evidence to classify Hungary, Poland, Turkey, or the United States without begging the question. The domestic actor needs ex-ante warning strong enough to justify extraordinary political costs. These masters pull in opposite directions: the coder demands high thresholds to avoid false positives; the actor demands low thresholds to avoid false negatives. A usable account must acknowledge that satisfying both perfectly is impossible; it must prioritize one or admit a zone of ambiguity where the label applies differently depending on the user.

  Below are the requirements any account must meet, tested against the hard cases you provided.

  **1. Cumulative Impact Assessment**
  *   **Case:** The Ratchet. Individually legal changes to media or courts that collectively eliminate alternation.
  *   **Status:** Non-negotiable.
  *   **Failure Mode:** An account that codes annual snapshots misses death by a thousand cuts, classifying a degraded regime as stable because no single year showed a collapse.
  *   **Constraint:** Must measure sequences, not just states.

  **2. Trajectory Sensitivity**
  *   **Case:** The Unconsolidated Baseline. Hungary or Poland never reaching a "liberal plateau."
  *   **Status:** Non-negotiable.
  *   **Failure Mode:** Excludes fragile democracies from the concept entirely, implying only established regimes can backslide, which renders the term useless for prevention.
  *   **Constraint:** Must measure deterioration relative to prior trajectory, not a mythical consolidated ideal.

  **3. Entrenchment Distinction**
  *   **Case:** Mandate-Laundered Entrenchment. Popular reforms that make future removal impossible.
  *   **Status:** Non-negotiable.
  *   **Failure Mode:** Conflates policy victory with regime change, labeling any strong majority as authoritarian, or conversely, granting incumbents a one-time veto on institutional degradation.
  *   **Constraint:** Must distinguish between changing policy and changing the rules of competition to favor the incumbent permanently.

  **4. Institutional Neutrality**
  *   **Case:** The Mirror-Image. Breaking conventions to enfranchise voters or dissolve captured courts.
  *   **Status:** Preference (Liberal).
  *   **Failure Mode:** Punishes democratic deepening achieved through unconventional means, or conversely, allows incumbents to claim "democratic ends" justify autocratic means.
  *   **Constraint:** Must evaluate institutional health independently of specific policy outcomes, risking elitism.

  **5. Attempt Sensitivity**
  *   **Case:** The Near Miss. Blocked attempts to disable checks.
  *   **Status:** Preference (Actor-oriented).
  *   **Failure Mode:** Rewards luck over resilience, classifying a regime as healthy simply because a coup failed, ignoring the intent and capacity revealed.
  *   **Constraint:** Must code intent and capacity, not just successful implementation.

  **6. Performance Independence**
  *   **Case:** Mere Misgovernment and Who-Decides. Corruption or incompetence vs. institutional degradation.
  *   **Status:** Non-negotiable.
  *   **Failure Mode:** Confuses unpopular governance with autocratization, or loses the ability to diagnose backsliding once referees are compromised.
  *   **Constraint:** Must separate institutional decay from policy failure and allow external verification without relying solely on compromised domestic referees.

  **Incompatible Requirements**
  The pressure is indeed between **Attempt Sensitivity** and **Cumulative Impact**. To detect backsliding early enough for the domestic actor (Attempt Sensitivity), one must code intent and risky maneuvers before they succeed. To code consistently for the comparativist (Cumulative Impact), one must wait for the sequence to reveal its effect. You cannot have both low false negatives (early warning) and low false positives (reliable coding). The account must relax Attempt Sensitivity for cross-national datasets to maintain reliability, while allowing domestic actors to treat attempts as warnings. Furthermore, **Institutional Neutrality** conflicts with **Entrenchment Distinction** when majoritarian will clashes with liberal constraints. If a majority votes to curb a court they view as captured, is it entrenchment or liberation? A single metric cannot resolve this normative conflict without smuggling in a preference for liberal veto points over majoritarian power.

  **Exclusion and Prejudice**
  The requirement that does the most work excluding current accounts is **Cumulative Impact Assessment**. Most existing indices (e.g., V-Dem, Freedom House) rely on annual snapshots or expert surveys that struggle to capture the *sequence* of events. They often downgrade a country only after the damage is visible in outcomes, missing the ratchet effect while it is turning. This requirement forces a shift from state-based coding to process-based coding, which most large-N datasets cannot sustain.

  The requirement that is smuggled prejudice is **Institutional Neutrality**. It assumes that independent courts, civil services, and media are inherently democratic arbiters rather than potential sites of elite capture. This validates your friend's claim that the concept is elitism about checks and balances. By insisting that breaking conventions is backsliding regardless of the end (e.g., enfranchisement), the account privileges institutional stability over democratic inclusion. It treats the *means* of liberal democracy as sacred, even when they obstruct the *ends* of popular sovereignty. This is not a neutral scientific criterion; it is a substantive commitment to liberal constitutionalism over majoritarian democracy.

  **Scorecard of Account Families**

  | Account Family | Performance on Requirements | Critical Failure |
  | :--- | :--- | :--- |
  | **Continuous Indices** (e.g., aggregate scores) | Fails **Cumulative Impact** and **Attempt Sensitivity**. Good at **Performance Independence**. | Treats backsliding as a score drop rather than a strategic sequence; misses the ratchet until it is too late. |
  | **Elections-Only** (Schumpeterian) | Fails **Entrenchment Distinction** and **Institutional Neutrality**. Good at **Trajectory Sensitivity**. | Cannot distinguish between a free election that ends democracy and one that sustains it; ignores mandate-laundering. |
  | **Intentions/Projects** (Agency-focused) | Excels at **Attempt Sensitivity** and **Entrenchment Distinction**. Fails **Performance Independence**. | Risks conflating incompetence or polarization with autocratic intent; relies on mind-reading incumbents. |
  | **Checks/Balances** (Rule of Law) | Excels at **Institutional Neutrality**. Fails **Mirror-Image** and **Unconsolidated Baseline**. | Validates the "elitism" charge; cannot account for democratic reform that disrupts existing institutional balances. |

  **Conclusion**
  No single account satisfies both masters without tension. The comparativist must sacrifice early warning for reliability, accepting that backsliding is only visible ex-post. The domestic actor must sacrifice neutrality for urgency, treating attempts as evidence. To answer your friend: the term is not *merely* partisan, but it is not neutral either. It requires a commitment that permanent incumbency is distinct from popular mandate, and that institutional sequences matter more than individual laws. If you cannot agree on the **Entrenchment Distinction**, you cannot agree on the concept.
