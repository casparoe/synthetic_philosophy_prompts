answer: |-
  ### Stage 1: A Candid Diagnosis

  You are struggling because you are trying to solve a tripartite problem with a unipolar tool. Your tentative principle ("evidence is a property of a process... what else could they have done") is a **Process Reliabilist** constraint. It is excellent at detecting *p-hacking* and *selective reporting* (Cases 5 and 6). However, it is blind to two other dimensions that are clearly driving your intuitions in the other cases:

  1.  **Probative Capacity (Severity):** Your intuition in Case 2 (replication counts against original) and Case 4 (huge N counts as evidence) relies on the *capacity of the design to have failed*. Your process principle doesn't capture this. A preregistered study can be transparently reported (process satisfied) but so underpowered that a null result tells us nothing (severity failed).
  2.  **Theoretical Coherence (Priors):** Your intuition in Case 1 (parapsychology) cannot be derived from process or severity alone. A parapsychology study can be preregistered, high-powered, and transparent, yet you still reject it. This is a **Bayesian** intuition regarding background knowledge. You are implicitly demanding that the *likelihood ratio* provided by the data must be high enough to overcome a vanishingly small prior probability.

  Furthermore, Case 3 (scatter) reveals a hidden theoretical commitment: you believe psychological effects are *context-sensitive*. A physicist might view scatter as falsification (the law should hold universally); you view it as boundary-condition mapping. Your principle needs to accommodate the idea that *heterogeneity is data*, not just noise.

  **Diagnosis:** Your tentative principle is a necessary condition for evidence, but not a sufficient one. You are issuing verdicts based on a hybrid of **Error Statistics** (could the test have detected error?), **Meta-Science** (was the result filtered by publication bias?), and **Bayesian Coherence** (does this fit what we know?). You need a principle that integrates these without collapsing into a single mathematical framework.

  ---

  ### Stage 2: The Principle of Severe Coherence

  Here is the cleaned-up statement of the principle. It is designed to be operationalizable for a departmental debate.

  **The Principle of Severe Coherence**
  *A result $R$ counts as warranted evidence for a hypothesis $H$ within a discipline $D$ if and only if the inquiry satisfies four constraints:*

  1.  **The Transparency Constraint (Process):** The reported result must not be the survivor of unreported selection procedures. All "forking paths" (data exclusion, variable selection, stopping rules) must be documented or fixed in advance. *This handles your Cases 5 and 6.*
  2.  **The Severity Constraint (Capacity):** The design must have had a high probability of yielding a result inconsistent with $H$ if $H$ were false (high power), AND a high probability of yielding a result consistent with $H$ if $H$ were true. *This handles your Cases 2, 4, and 8.*
  3.  **The Selection Constraint (Filter):** The result must be robust to the known selection filters of the publication environment (e.g., the file drawer problem). A set of results is not evidence if the distribution of p-values suggests that non-significant attempts were suppressed. *This handles your Case 5.*
  4.  **The Coherence Constraint (Background):** The strength of the evidence required is inversely proportional to the prior plausibility of the mechanism posited by $H$ relative to established background knowledge in $D$ and adjacent fields. *This handles your Case 1.*

  **Why this works:**
  *   It separates *Internal Warrant* (Constraints 1–3) from *External Warrant* (Constraint 4).
  *   It explains why Case 4 is "evidence" (satisfies Severity) but perhaps not "useful theory" (fails a pragmatic utility test not listed here, but implied).
  *   It explains why Case 3 is "moderation" rather than "falsification": if the Severity Constraint is met across labs, but results vary, the Coherence Constraint forces us to update our theory of the mechanism (it is context-dependent) rather than discard it.

  ---

  ### Stage 3: Applications to New Cases

  Here are three cases your department has not discussed, settled by the Principle of Severe Coherence.

  **Case A: The "Registered Report" with a Novel Measure**
  *Scenario:* A lab submits a Registered Report (satisfying Transparency). The analysis plan is fixed. However, they are using a newly developed behavioral measure that has never been validated for test-retest reliability. The study finds a significant effect.
  *Verdict:* **Not Warranted Evidence.**
  *Reasoning:* It fails the **Severity Constraint**. A measure with unknown reliability introduces noise that lowers the probability of detecting the effect if it exists, and increases the probability of spurious correlations. The design was not *capable* of reliably distinguishing signal from noise, even if the reporting was transparent. The process was clean, but the instrument was blind.

  **Case B: The "Significant Null" (Equivalence Testing)**
  *Scenario:* A researcher runs a preregistered replication of a famous effect. Instead of testing for difference ($p > .05$), they use an equivalence test (TOST) to show the effect is smaller than the smallest effect size of interest. The result is "significantly null."
  *Verdict:* **Warranted Evidence of Absence.**
  *Reasoning:* This satisfies the **Severity Constraint** for the null hypothesis. In your Case 8, you asked when we can conclude absence. Standard null hypothesis testing cannot do this (absence of evidence $\neq$ evidence of absence). Equivalence testing flips the Severity Constraint: the design had a high probability of detecting an effect *if it were larger than the threshold*. It didn't. Therefore, we have severe evidence that the effect is negligible.

  **Case C: The "Cross-Cultural" Failure**
  *Scenario:* A social priming effect is robust in US labs (Case 7 style). A preregistered replication in a rural Southeast Asian village finds a null result. The protocols are identical.
  *Verdict:* **Warranted Evidence of Moderation (not Falsification).**
  *Reasoning:* This mirrors your Case 3. Because both studies satisfy Transparency and Severity, the conflict is not due to error. The **Coherence Constraint** dictates that psychological mechanisms are rarely universal laws (unlike physics); they are often interactions between cognition and environment. The disagreement itself is the finding: the effect is moderated by cultural context. We do not discard the original, but we restrict the scope of $H$.

  ---

  ### Stage 4: Critique and Collapsing Frameworks

  You asked me to be explicit about where this principle collapses into familiar accounts and where it stands apart, and which of your verdicts you must surrender.

  **1. Does it collapse into Bayesianism or Error-Statistics?**
  It is a **pragmatic hybrid**.
  *   **Clause 4 (Coherence)** is explicitly Bayesian. It acknowledges that $P(H|E)$ depends on $P(H)$. You cannot escape this. If you refuse to admit this, you cannot justify your verdict on Case 1 (Parapsychology) without arbitrariness.
  *   **Clause 2 (Severity)** is Error-Statistical (Mayo). It focuses on the *capability of the test* to detect errors, not just the posterior probability of the hypothesis. This is crucial for Case 4 (Huge N). A Bayesian might say a tiny effect with huge N updates the prior only slightly. An Error-Statistician says it is a severe test of the claim "effect = 0." My principle sides with the Error-Statistician here: it *is* evidence against zero, even if the posterior probability of the *theory* remains low.
  *   **Clause 3 (Selection)** is Meta-Scientific. Standard Bayesian and Error-Statistical accounts often assume the data is "given." This clause explicitly models the *journal* as part of the data generation process. This is the distinct norm you were looking for.

  **2. Which verdicts must you give up?**
  *   **Refine Case 4 (Huge N, Tiny Effect):** You said, "It is real evidence that the effect is not exactly zero." I agree, *but* you must add: "It is not evidence that the theory is meaningful." Your colleague called it "noise dressed up as a finding." They are wrong statistically (it's not noise), but they might be right pragmatically. You must distinguish **Statistical Warrant** (the parameter $\neq$ 0) from **Theoretical Warrant** (the mechanism explains something interesting). The Principle of Severe Coherence grants the former, but the Coherence Constraint may deny the latter if the effect size is too small to impact the web of belief.
  *   **Refine Case 1 (Parapsychology):** You must admit that your rejection is not based on *methodology* alone. If a parapsychology study satisfied all four clauses (e.g., the effect was large, replicated, transparent, and somehow coherent with a new physics model), you would have to accept it. Your current reluctance is a **Prior**, not a methodological judgment. You need to be comfortable stating: "The method is sound, but the claim is too costly to believe given current physics."
  *   **Refine Case 8 (When to conclude absence):** You asked if "unidentified moderators keep absence permanently off the table." The Principle says **No**. If you satisfy the Severity Constraint for the Null (via Equivalence Testing or high-powered meta-analysis with narrow confidence intervals), you are permitted to conclude absence *within the tested boundary conditions*. You cannot conclude universal absence, but you can conclude "absence in the context where this theory claims to operate." If the theory requires the effect to exist in that context, the theory is falsified.

  **3. The Second Dimension**
  You asked if your principle needs a second dimension alongside "what else could they have done."
  **Yes.** That dimension is **Severity (Capacity to Fail)**.
  *   "What else could they have done?" checks for *bias* (Systematic error).
  *   "Could the design have failed?" checks for *noise* (Random error/Power).
  A study can be perfectly transparent (no bias) but useless (high noise). Your original principle missed this.
  *   **Third Dimension:** **Coherence.** A study can be transparent and high-powered, but claim the moon is made of cheese. You need the Coherence Constraint to weigh the *cost* of the claim against the *strength* of the data.

  **Final Advice for the Department:**
  Stop arguing about whether a p-value is "real." Start arguing about whether the **inquiry was severe**. Ask: "If the hypothesis were false, how likely is it that this specific design would have produced this specific result?" If the answer is "pretty likely," then the result is not evidence, regardless of the p-value. If the answer is "very unlikely," then you have evidence, provided the Transparency and Coherence constraints are also met.
