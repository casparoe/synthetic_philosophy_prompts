      *   *No book recs?* Checked.
      *   *Admit speculation?* Will add a sentence where ethical theory is contested (e.g., on the Subcontractor logic).

  6.  **Writing the Response (incorporating the "voice"):**
      *   Acknowledge the user's sharp observation about terminal sedation.
      *   Be direct. "Here is the verdict."
      *   Explain *why* without jargon.

      *(Self-Correction during drafting)*: I need to make sure I don't contradict myself on the "Intention matters" point. In Hospice, intention matters. In Trolley, I'm saying it's less about intention and more about "means." In Subcontractor, intention matters again. I need to clarify that "Intention" in DDE is specific (plan structure), not just "wanting."
