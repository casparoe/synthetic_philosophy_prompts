      *(Refining the Subcontractor)*: If the switch flip is permissible *only* if the intention is "save five," and the signalman intends "kill one," then *he* commits a wrong. If I know this, I am using him to commit a wrong. So I am implicated.

      *(Final Polish)*: Ensure the distinction between "Intention as Plan" vs "Intention as Desire" is clear, as that kills the Disappointment Test.

