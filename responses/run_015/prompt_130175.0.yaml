  # Joint Statement on the Metaphysics and Semantics of Vagueness

  **Prepared by:** The Epistemicist Camp and The Supervaluationist Camp
  **Date:** October 26, 2023
  **Subject:** Mapping the Terrain of Disagreement Regarding Borderline Cases and the Sorites Paradox

  ### Introduction

  Following extensive dialectical engagement, the undersigned parties acknowledge that while our metaphysical and semantic commitments regarding vagueness remain fundamentally opposed, productive progress requires a precise mapping of our common ground and our divergences. This document is not a concession of error by either side, nor does it imply that a consensus has been reached in the broader field. Rather, it is an attempt to isolate the specific loci of contention. We distinguish below between claims settled by our mutual commitment to classical logic and linguistic analysis, and those claims where our theoretical frameworks yield incompatible predictions. Our goal is not victory, but the clarification of the stakes.

  ---

  ### Part I: Agreed Claims

  Both the Epistemicist Camp and the Supervaluationist Camp affirm the following propositions as the foundational basis for this collaboration. These claims represent the shared theoretical infrastructure upon which our disagreement rests.

  1.  **The Sorites Tension:** We agree that the Sorites paradox reveals a genuine, non-trivial tension in ordinary reasoning. It is not merely a linguistic trick or a fallacy of equivocation in the standard sense; it exposes a structural vulnerability in how vague predicates interact with classical inference rules.
  2.  **The Status of Tolerance:** We agree that tolerance principles (e.g., "if $x$ is tall, and $y$ is marginally shorter than $x$, then $y$ is tall") are initially plausible and deeply embedded in our linguistic practices, yet when iterated across a sufficient series, they generate contradiction when paired with clear paradigm cases at both ends of the spectrum.
  3.  **Bivalence in Precise Languages:** We agree that classical bivalence holds for fully precise, stipulated languages. The dispute concerns natural language predicates that lack such stipulation, not the underlying logic of truth values themselves when terms are rigorously defined.
  4.  **The Nature of Vagueness:** We agree that vagueness is not reducible to ordinary speaker ignorance about an already-determined fact in the empirical sense (e.g., not knowing the exact millimeter height of a person due to lack of measurement). Both camps treat vagueness as a phenomenon requiring semantic or metaphysical explanation beyond simple data lack.
  5.  **Inadequacy of Alternative Resolutions:** We agree that purely degree-theoretic approaches (fuzzy logic) or radical contextualist resolutions that deny bivalence altogether are inadequate. They fail to preserve the intuitive validity of classical inference patterns (such as *modus ponens*) in non-borderline cases or fail to account for the phenomenology of uncertainty.
  6.  **The Gradient Artifact:** We agree on the structure and relevance of a synthetic case designated as the **Gradient Artifact**. This is defined as an engineered entity whose measurable properties vary continuously across every proposed sharp boundary for "organism" versus "artifact." In this case:
      *   Different expert panels draw different regulatory lines.
      *   No natural discontinuity is detectable in the physical structure.
      *   Iterative re-annotation does not converge on a stable classification.
      *   Both camps accept that this case is structurally analogous to standard Sorites cases and that any adequate theory of vagueness must account for the classification behavior observed in the Gradient Artifact.

  ---

  ### Part II: Statement of Disagreements

  While we share the foundational claims above, our explanations for *why* the Sorites arises and *what* obtains in borderline cases are mutually exclusive. The following table isolates the precise divergences. Each statement is formulated such that the named camp accepts it as true, while the opposing camp rejects it.

  | Domain of Disagreement | The Epistemicist Camp Maintains | The Supervaluationist Camp Maintains |
  | :--- | :--- | :--- |
  | **Extension of Predicates** | Every vague predicate has a unique, precise extension, even if that extension is unknowable to speakers. | There is no unique precise extension for a vague predicate; the extension is inherently indeterminate. |
  | **Nature of Borderline Cases** | Borderline cases involve pure epistemic ignorance of a hidden sharp boundary; the fact of the matter exists but is inaccessible. | In borderline cases, there is genuinely no fact of the matter; the sentence is neither true nor false (it lacks a truth value). |
  | **Theory of Truth** | Truth is correspondence to the unique precise extension; a sentence is true if it matches the hidden boundary. | Truth for vague sentences is "supertruth" (truth on all admissible precisifications); a sentence is true only if it remains true across all valid ways of making the language precise. |
  | **Classifier Uncertainty** | Calibrated uncertainty in any classifier (human or machine) reflects our cognitive limitations rather than semantic openness. | Calibrated uncertainty reflects genuine indeterminacy in the predicate itself, not merely cognitive limits. |
  | **Second-Order Vagueness** | The boundary between the determinately true/false and the borderline is itself sharp; there is a last borderline case. | The set of admissible precisifications need not itself have sharp boundaries; the distinction between admissible and inadmissible is vague. |
  | **Machine Learning Confidence** | A machine-learning system's calibrated confidence near a boundary tracks a hidden fact (the probability reflects the likelihood of guessing the sharp cutoff correctly). | A machine-learning system's calibrated confidence near a boundary reflects genuine indeterminacy in the predicate (the probability reflects the proportion of precisifications on which the label holds). |

  ---

  ### Part III: The Cruxes

  To move beyond stalemate, we identify three sub-questions where theoretical commitment yields divergent predictions. Settling one of these would force a significant revision in at least one camp's position. For each crux, we specify the relevant case or argument and record the specific empirical or logical results that would favor or weaken each position.

  #### Crux 1: The Sharpness of the Meta-Level
  **Question:** Does second-order vagueness undermine the Epistemicist's claim that there is always a hidden sharp boundary, even at the meta-level?

  *   **Relevant Case/Argument:** A formal analysis of the transition zone between "definitely tall" and "borderline tall." The Epistemicist posits a sharp cut-off between these categories; the Supervaluationist posits a fuzzy transition.
  *   **Epistemicist Prediction:**
      *   *Favoring Evidence:* A logical proof demonstrating that compositionality in natural language requires a sharp boundary at the meta-level to prevent semantic collapse.
      *   *Weakening Evidence:* A demonstration that positing a sharp boundary at the meta-level generates a regress of higher-order boundaries that renders the theory explanatorily vacuous.
  *   **Supervaluationist Prediction:**
      *   *Favoring Evidence:* A model showing that "admissibility" can be defined without sharp boundaries while preserving classical logic for non-borderline cases.
      *   *Weakening Evidence:* A proof that the set of "admissible precisifications" itself requires a sharp boundary to be defined, thereby replicating the very problem vagueness was meant to solve.

  #### Crux 2: The Gradient Artifact and Convergence
  **Question:** Is the Gradient Artifact's failure to converge under expert re-annotation better explained by our ignorance of a single correct cutoff or by the absence of any cutoff to be known?

  *   **Relevant Case/Argument:** The behavior of the Gradient Artifact under iterative expert labeling. Experts repeatedly classify the entity over time with access to identical data, yet their boundaries drift without converging.
  *   **Epistemicist Prediction:**
      *   *Favoring Evidence:* Evidence that expert drift is caused by external noise or cognitive fatigue, implying that under idealized cognitive conditions, convergence on a single boundary would occur.
      *   *Weakening Evidence:* Demonstration that even under idealized cognitive conditions with perfect information, rational agents would still diverge in their classification without error.
  *   **Supervaluationist Prediction:**
      *   *Favoring Evidence:* Data showing that expert divergence persists even when cognitive load is minimized, indicating the divergence is semantic rather than psychological.
      *   *Weakening Evidence:* Discovery of a latent variable in the Gradient Artifact's structure that, once identified, causes all experts to immediately converge on a single regulatory line.

  #### Crux 3: The Covert Sharpness of Admissibility
  **Question:** Does the Supervaluationist's appeal to "admissible" precisifications covertly rely on a sharp boundary that replicates the very problem vagueness was meant to solve?

  *   **Relevant Case/Argument:** The logical properties of a formal system that permits all admissible precisifications. The core issue is whether the constraint "admissible" is itself vague or precise.
  *   **Epistemicist Prediction:**
      *   *Favoring Evidence:* A derivation showing that any set defined as "admissible" must have a membership condition that is either true or false for any candidate precisification, implying a sharp boundary.
      *   *Weakening Evidence:* A coherent semantics where "admissibility" is treated as a primitive notion that does not require truth-conditional analysis.
  *   **Supervaluationist Prediction:**
      *   *Favoring Evidence:* A successful formalization where the boundary of admissibility is treated as vague without triggering a paradox or logical inconsistency.
      *   *Weakening Evidence:* Proof that without a sharp boundary for admissibility, the notion of "supertruth" becomes undefined, collapsing the theory into degree theory.

  ---

  ### Conclusion

  This document delineates the boundary between our shared commitments and our irreconcilable differences. We acknowledge that the Epistemicist Camp and the Supervaluationist Camp offer competing explanations for the same phenomena. Neither view currently commands consensus in the philosophy of vagueness. By isolating the Cruxes above, we intend to shift future debate from general assertions to specific tests of logical coherence and explanatory power regarding cases like the Gradient Artifact. We submit this statement not as a resolution, but as a charter for continued, precise disagreement.
