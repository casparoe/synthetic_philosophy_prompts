answer: |-
  **The Asymmetric Multiplex Bridge Case**

  Subject S steps into a neural scanner that disassembles their biological substrate, transmitting the data to reconstruct two distinct physical instantiations at remote sites. R-alpha inherits 85% of S's psychological data, specifically the deep archive of autobiographical memories, yet every recollection arrives phenomenologically tagged as "observed history" rather than "lived experience." R-beta inherits the remaining 15%, comprising S's core character traits and the immediate episodic buffer of the last year, all carrying intact first-person ownership. Upon awakening, a high-bandwidth neural link activates between them for exactly 72 hours, merging their cognitive streams into a single distributed processing system where memory access is unified and the ownership deficit in R-alpha is functionally compensated by R-beta's authentic perspective. When the link severs, the shared processing halts, leaving R-alpha and R-beta as cognitively isolated agents with divergent phenomenological relations to the past.

  ***

  **Verdicts and Justifications**

  **1. Bodily-Continuity Theorist**
  *Verdict:* S does not survive.
  *Justification:* The criterion for survival is the continuity of the same living biological organism. The scanner destroys S's original body. While R-alpha and R-beta possess biological bodies, neither is numerically identical to S's original organism, nor does the temporary neural link constitute bodily continuity. The link is a computational bridge, not a biological graft; therefore, the organism S ceased to exist at the moment of scanning.

  **2. Psychological-Continuity Theorist (Parfitian/Branching)**
  *Verdict:* Both R-alpha and R-beta are psychological continuers of S, but R-beta is the *closer* continuer.
  *Justification:* Survival consists in overlapping chains of psychological connectedness. While R-alpha holds greater quantitative data (85%), psychological continuity that matters relies on the quality of the connection, specifically first-person ownership. R-beta possesses the "core personality" and the authentic phenomenological grip on recent memories. Because R-beta maintains the first-person perspective that grounds agency and concern, R-beta represents a stronger degree of psychological survival than R-alpha, despite the lower data volume. Branching is permitted, so both inherit S's legacy, but unequally.

  **3. Unitary-Narrative Theorist**
  *Verdict:* S survives only during the 72-hour bridge period; post-severance, S ceases to exist.
  *Justification:* Survival requires the capacity to maintain a single, non-contradictory first-person autobiography without distributed scaffolding. During the bridge, the bidirectional link integrates R-alpha's data with R-beta's ownership, creating a unified distributed subject capable of narrating S's life coherently. Once severed, R-alpha has the story without the "I," and R-beta has the "I" without the full story. Neither can independently sustain the unitary narrative required for S's identity. Thus, S exists only as long as the distributed substrate holds.

  ***

  **The Check**

  | Theory | Belief / Survival Claim | Method / Criterion | Relevant Nearby Worlds | Why the Condition Delivers Verdict |
  | :--- | :--- | :--- | :--- | :--- |
  | **Bodily-Continuity** | S is dead immediately. | Biological organism continuity. | *World A:* Scanner copies S without destroying original (S survives in original). *World B:* Link is a physical brain-stem fusion (Still fails if original body is destroyed). | The destruction of the original substrate is sufficient for death; replicas are new organisms regardless of mental links. |
  | **Psychological-Continuity** | Both are S (graded); Beta is closer. | Psychological connectedness/continuity (branching allowed). | *World A:* Bridge lasts indefinitely (Both remain S indefinitely). *World B:* R-alpha lacks ownership deficit (Alpha becomes closer continuer due to volume + ownership). | Continuity is a matter of degree. Ownership weighs heavier than volume for "what matters," making Beta the stronger continuer, but branching allows both to count. |
  | **Unitary-Narrative** | S exists *only* during the 72 hours. | Capacity for single, independent first-person autobiography. | *World A:* Bridge lasts indefinitely (S survives indefinitely as a distributed entity). *World B:* R-alpha lacks ownership deficit (S survives post-severance in both replicas independently). | The view requires *independent* narrative unity. The bridge artificially creates this unity; removing it reveals the fragmentation, ending S's existence. |

  **Structural Feature Divergence**
  The feature forcing the Unitary-Narrative view to diverge from Psychological Continuity is the **combination of the temporary distributed substrate with the ownership asymmetry**. Psychological continuity aggregates connections regardless of where they reside (allowing branching survival), whereas Unitary-Narrative demands a singular locus of authorship. The bridge temporarily creates that singular locus; the asymmetry ensures it cannot be replicated in either replica alone once the bridge breaks.

  **Honest Defense Note**
  A Psychological-Continuity theorist would attack the Unitary-Narrative verdict by arguing that narrative unity is an *epistemic or practical desideratum* rather than a *metaphysical condition* on survival. They would contend that R-beta possesses sufficient psychological continuity (core personality + recent authentic memories) to ground survival regardless of narrative fragmentation. From this perspective, the inability to tell a complete story does not equate to death; it merely equates to impairment. The Unitary-Narrative view mistakenly conflates the *quality* of survival with the *fact* of survival.

  **Collapse Check**
  If the 72-hour bridge is removed, the case collapses into a standard branching teletransporter problem. The Unitary-Narrative view can no longer claim S survives temporarily as a distributed subject. It is forced either to select one replica (likely R-beta, as the only one with first-person ownership) or to accept that S ceases immediately (since neither has the full narrative). In either outcome, the view loses its distinctive result—that S exists transiently as a composite entity—and must align with standard non-branching or extinction verdicts.
