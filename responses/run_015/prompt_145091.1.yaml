answer: |-
  **PHIL 404: Modal Realism Practicum**
  **Credits:** Variable (Contingent on branching factor)
  **Prerequisites:** Metaphysics I, Actuality Certification, Solvency in Local Currency

  **Course Description:**
  This practicum requires matriculated entities to engage directly with the concrete isolates comprising the pluriverse. Students should note that personal identity does not persist across world-boundaries; therefore, attendance is fulfilled by counterparts bearing sufficient qualitative similarity to the enrolled student. Instruction is simultaneous across all causal isolates. Please arrive at the examination hall in this world; counterparts in adjacent worlds will be proctored locally.

  **Evaluation Policy:**
  Per University Senate Regulation 78-B, final grades are not determined solely by performance in this indexical world. Instead, the Registrar's Office computes a Modal GPA based on the aggregate performance of all counterparts sitting for the examination across the pluriverse. While a student may fail the examination in this actual world, the transcript will reflect the weighted average of all passing and failing counterparts. Appeals based on "local actuality" or "the incredulous stare" are not accepted. Please be advised that because every failing student possesses a counterpart who succeeds in some sufficiently distant branch, no student is academically dismissed, though many remain locally uninformed.

  **Financial Obligations:**
  Tuition is assessed per concrete world occupied by a counterpart. The Bursar's Office warns that ontological overhead has increased due to recent expansions in the similarity metric. Students are responsible for all billing statements generated by counterparts, including those in worlds where currency holds no value (converted at the daily exchange rate of possibility). Delinquency in any world may result in a hold on the local transcript. Students seeking to reduce costs by minimizing the number of possible worlds are reminded that world-counting is not within the purview of the enrollee.

  **Transcript Notation:**
  Degrees are conferred based on the Modal GPA. Consequently, graduates may find themselves qualified for positions in this world despite having failed all local coursework. The University assumes no liability for existential distress resulting from billing statements that exceed the gross domestic product of this universe.

  ***

  **Note on Satire and Fairness:**
  To change my mind on whether this satire is fair to Lewis, one would need to demonstrate that Lewis intended his metaphysics to have practical, normative implications for identity or ethics, rather than serving purely as a descriptive ontological framework. My reasoning is most likely to fail in conflating the *cost* of worlds (a category error Lewis would reject) with the *existence* of worlds; Lewis never claimed worlds were resource-intensive to maintain, only that they exist. The satire treats ontological commitment as a budgetary line item, which caricatures his philosophical parsimony.
