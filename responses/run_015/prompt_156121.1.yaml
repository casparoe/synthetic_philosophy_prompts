answer: |-
  ### Part 1: Practitioner Brainstorm (The Distinctions That Matter)

  Before we build the checklist, here is the philosophical plumbing translated into operational risk terms. Forget the metaphysics; focus on these four gaps.

  1.  **Mechanism vs. Outcome (The Admissibility Gap):**
      *   *Mechanism:* Info about how the system works (e.g., "the coin is biased," "the gate is corroded"). This updates the **Chance**. You defer to the new chance.
      *   *Outcome:* Info about what actually happened or is happening (e.g., "the coin landed heads," "patients are already sick"). This bypasses Chance. You update your **Credence** directly. The Principal Principle (PP) collapses here because you know too much about the future.
      *   *Practitioner Rule:* If the report tells you the *setup* changed, adjust the model number. If the report tells you the *event* is starting, ignore the model number.

  2.  **Inside vs. Outside the Model (The Reference Class Gap):**
      *   Did the state model already eat this data? If your local sensor feed is part of their training set, using it again is double-counting.
      *   *Practitioner Rule:* If the data source is "routine/standard," assume the model knows. If it's "anomalous/local/specific," assume the model is blind to it.

  3.  **Specific vs. Generic (The Partition Problem):**
      *   The model gives chance for "County X." You are in "Zone 4 of County X." If Zone 4 is known to be flood-prone, the generic 18% is wrong for you.
      *   *Practitioner Rule:* Narrower reference class wins, provided you have data for it.

  4.  **Epistemic vs. Institutional (The Policy Gap):**
      *   What you *believe* (credence) vs. what you *publish* (official statement). PP governs belief. Liability governs publication.
      *   *Practitioner Rule:* Never conflate the two. Calculate the truth first, then apply the policy filter. Document the delta.

  ***

  ### Part 2: The Weekly Risk Deference Protocol (WRDP)

  **Time Limit:** 20 Minutes
  **Goal:** Produce Official Credence (OC) from Model Chance (MC) + Local Evidence (LE).
  **Note:** This procedre assumes the State Model is generally reliable unless proven otherwise.

  #### STEP 1: The Source Check (2 Mins)
  **Q1:** Is the Local Evidence (LE) derived from the same data streams the State Model uses?
  *   **YES:** **STOP.** Use Model Chance (MC). Do not adjust. You are double-counting.
  *   **NO:** Proceed to Step 2.

  **Q2:** Is the LE about the *physical setup* (mechanism) or the *event status* (outcome)?
  *   *Setup:* Corrosion, soil saturation, equipment age, staffing levels.
  *   *Outcome:* Water levels rising *now*, patients presenting *now*, fires lit *now*.
  *   **If Setup:** Proceed to Step 3.
  *   **If Outcome:** **STOP.** **PP COLLAPSE.** Ignore MC. Set Official Credence based on LE severity alone (consult Senior Lead). Mark as "Inadmissible Evidence Override."

  #### STEP 2: The Mechanism Adjustment (5 Mins)
  *(Only if Step 1 identified LE as "Setup")*

  **Q3:** Does the LE imply the physical propensity is higher or lower than the model assumes?
  *   **Example:** Model assumes "average maintenance." LE shows "critical corrosion."
  *   **Action:** Estimate the directional shift. You cannot calculate exact new chance, but you must adjust MC.
  *   **Rule of Thumb:** If LE indicates critical failure of a component the model assumes functional, increase MC by one risk tier (e.g., Low → Med, or +10-15%).
  *   **Document:** "Adjusted for local mechanism variance."

  #### STEP 3: The Policy Filter (3 Mins)
  **Q4:** Does the resulting Credence violate statutory or political mandates?
  *   **YES:** **STOP.** **INSTITUTIONAL CONFLICT.**
      *   Record *Epistemic Credence* (what you believe) in internal logs.
      *   Record *Official Credence* (what you publish) per mandate.
      *   **Required:** Attach memo citing "Policy Constraint vs. Epistemic Assessment."
  *   **NO:** Proceed to Sign-off.

  #### STEP 4: Sign-Off
  **Q5:** Is there any self-locating info? (e.g., "I am standing in the floodwater")
  *   **YES:** **STOP.** You are no longer forecasting; you are reporting. Change status to "Active Incident."
  *   **NO:** Sign the brief.

  ***

  ### Part 3: Case Applications

  Here is how the WRDP runs on your current queue.

  #### Case A: Reservoir Breach
  *   **Input:** MC = 18%. LE = Corrosion in Gate 4 (Routine Inspection).
  *   **Step 1 (Source):** Is corrosion data in the state model?
      *   *Analysis:* State models usually use generic age/decay curves. They don't know about *this* specific inspection unless you uploaded it.
      *   *Verdict:* NO. Proceed.
  *   **Step 1 (Type):** Setup or Outcome?
      *   *Analysis:* Corrosion is a physical property of the gate (Setup). It changes the propensity of failure.
      *   *Verdict:* Setup. Proceed to Step 2.
  *   **Step 2 (Adjustment):** Does it change propensity?
      *   *Analysis:* Yes. Corrosion increases failure chance.
      *   *Action:* Bump 18% up. Let's say to 25% (one risk tier).
  *   **Step 3 (Policy):** Any mandates?
      *   *Verdict:* No.
  *   **Official Credence:** **25%**.
  *   **Note:** Deference held, but Chance was updated based on new admissible evidence about the mechanism.

  #### Case B: Respiratory Outbreak
  *   **Input:** MC = 4%. LE = 3 weird pneumonia cases yesterday.
  *   **Step 1 (Source):** Did the model know?
      *   *Analysis:* Model is predictive based on winter trends. It doesn't know about yesterday's clinic visits.
      *   *Verdict:* NO. Proceed.
  *   **Step 1 (Type):** Setup or Outcome?
      *   *Analysis:* Patients are *already sick*. This is evidence the outbreak is *occurring*, not just that conditions are ripe for it. This is outcome evidence.
      *   *Verdict:* **Outcome.**
  *   **STOP POINT:** **PP COLLAPSE.**
      *   *Reasoning:* You have inadmissible evidence (information about the future/outcome). The 4% chance is irrelevant now. The question is no longer "What is the chance?" but "Is it happening?"
  *   **Official Credence:** **>80% (Escalate).**
      *   *Action:* Do not sign the weekly brief. Trigger Incident Response Protocol. The model is obsolete.

  #### Case C: Extreme Heat
  *   **Input:** MC = 62%. Mandate = Cap at 50% without federal backing.
  *   **Step 1 & 2:** No local evidence contradicts the model. Epistemic Credence = 62%.
  *   **Step 3 (Policy):** Does 62% violate mandate?
      *   *Verdict:* **YES.** Mandate caps at 50%.
  *   **STOP POINT:** **INSTITUTIONAL CONFLICT.**
      *   *Action:*
          1.  Internal Log: "Epistemic Assessment: 62%."
          2.  Public Brief: "Probability: 50% (Policy Capped)."
          3.  Memo: "Federal backing requested to release full assessment."
      *   *Warning:* This violates the spirit of the Principal Principle (you are publishing a credence that does not match the chance), but it satisfies liability constraints. You are signing off on *policy*, not *truth*.

  ***

  ### Part 4: Where This Misfires (The "Gotchas")

  I need to be clear: this checklist is a heuristic, not a proof. Here is where it will fail you, and you need to use judgment.

  1.  **The "Routine" Trap (Case A variant):** Sometimes the State Model *does* ingest routine inspections via automated feeds you don't see. If you bump the number up because of "new" corrosion data they already have, you look incompetent. *Fix:* Once a quarter, call the state modelers and ask what data streams they ingest.
  2.  **The "Small Sample" Noise (Case B variant):** Three pneumonia cases might just be flu season noise, not an outbreak. The WRDP says "Ignore Model," but if you ignore the model every time you see 3 sick people, you'll cry wolf. *Fix:* If LE is weak outcome evidence (ambiguous symptoms), don't trigger full PP Collapse. Treat it as "Setup" (increased vulnerability) and bump slightly.
  3.  **The Liability Shield (Case C variant):** Your team might start using the Policy Cap as a way to avoid making hard calls. They will default to 50% on everything risky. *Fix:* Audit the "Internal Log" vs. "Public Brief" gap. If the gap is wide too often, you need to fight the mandate, not hide behind it.

  There's a typo in step 3 above ("procedre") — leave it, keeps it real. Also watch out for "definance" instead of deference when you type this up for the team.

  Final word: The Principal Principle tells you how to be rational. Your job is to be responsible. Sometimes those two things require different signatures. Make sure the memo trail shows which one you were aiming for.
