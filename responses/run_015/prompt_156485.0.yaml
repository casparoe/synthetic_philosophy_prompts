answer: |-
  This is a classic rationalist frustration. The slogan "Bayesians can't agree to disagree" is a heavy hammer that gets swung at nails it doesn't fit. Your friend is treating a theorem about *logical omniscience in idealized models* as a behavioral norm for *humans swapping numbers in a chat room*.

  Here is the menu of claims hidden behind that slogan, evaluated for truth and relevance, followed by the breakdown of your four cases.

  ### Part 1: The Menu of Claims

  Here are the four distinct propositions people usually mean when they deploy this slogan, ranked from mathematical fact to philosophical overreach.

  #### 1. The Strict Aumann Claim
  *   **Claim:** If two agents have the **same prior**, and their posteriors for a specific event are **common knowledge**, then their posteriors must be **identical**.
  *   **Status:** **True (Mathematical Tautology).** This is Aumann's 1976 theorem. It is indisputable within its axioms.
  *   **Relevance to Friend:** **Low.** It requires *common knowledge* (an infinite recursion of "I know that you know that I know..."). Merely swapping numbers five times does not logically establish common knowledge, nor does it guarantee the "same prior" condition.

  #### 2. The Convergence Heuristic
  *   **Claim:** If two agents repeatedly communicate their posteriors (or sufficient statistics) to each other, their beliefs will **converge** rapidly, even if common knowledge isn't strictly achieved.
  *   **Status:** **Substantive and Defensible (with caveats).** Geanakoplos and Polemarchakis (1982) showed that for finite partitions, exchanging posteriors leads to convergence. However, "rapidly" is doing a lot of work. In continuous spaces, convergence can be arbitrarily slow.
  *   **Relevance to Friend:** **Medium.** This is likely what he *thinks* he means. It supports the idea that 5–6 rounds *should* have closed the gap.
  *   **Hidden Premise Needed:** That the forecasters are communicating *sufficient statistics* perfectly and treating each other's numbers as Bayesian updates rather than cheap talk.

  #### 3. The Common Prior Norm (Harsanyi Doctrine)
  *   **Claim:** Rational agents **ought** to have the same prior. Any difference in priors is a form of irrationality (e.g., one person is ignoring objective logic or symmetry).
  *   **Status:** **Controversial / Philosophical.** This is not a theorem; it is a normative stance. Many Bayesians accept "subjective priors" as legitimate. Rationalists often enforce this norm to make the math work, but it is not a law of logic.
  *   **Relevance to Friend:** **Critical.** Without this, the theorem doesn't apply. If they are allowed different priors, they can disagree forever rationally.
  *   **Hidden Premise Needed:** That "rationality" forbids prior differences. He is assuming this without arguing for it.

  #### 4. The "Hidden Evidence" Corollary
  *   **Claim:** If posteriors differ after communication, someone must be **lying, withholding evidence, or computationally bounded.**
  *   **Status:** **False / Overreach.** It ignores model disagreement. Two Bayesians with the same prior and same data can disagree if they have different likelihood functions (different causal models of how data generates events).
  *   **Relevance to Friend:** **High.** This is his conclusion ("someone is sitting on private evidence").
  *   **Hidden Premise Needed:** That they share the same likelihood functions (causal models), not just priors.

  ---

  ### Part 2: What Your Friend Needs to Be Right

  For your friend's conclusion to hold (that a 20-point gap after 6 swaps implies irrationality or hidden evidence), he is silently relying on a "Rationalist Stack" of premises that he hasn't stated:

  1.  **Common Prior Assumption:** He assumes the two forecasters *should* have started with the same probability distribution over the world. (If not, Case 2 applies).
  2.  **Common Knowledge Approximation:** He assumes 5–6 swaps is sufficient to approximate "common knowledge" of posteriors. (If not, Case 1 applies).
  3.  **Model Isomorphism:** He assumes they are using the same mental model to interpret evidence (same likelihood function). If Forecaster A thinks "polls are noisy" and Forecaster B thinks "polls are biased," they aren't just disagreeing on evidence; they are disagreeing on physics.
  4.  **Honest Signaling:** He assumes the numbers swapped are true posteriors, not strategic estimates or confidence-weighted averages.

  **Verdict:** He is overreaching. The theorem guarantees agreement only under conditions that almost never exist in human forecasting. The persistence of disagreement is more likely evidence of **different priors** or **different models** than hidden evidence or irrationality.

  ---

  ### Part 3: Analysis of Your Four Cases

  Here is how your specific counter-examples interact with the claims above.

  #### Case 1: The "Six Rounds" Stop (No Common Knowledge)
  *   **Scenario:** They stop after 6 rounds. Neither knows the other knows the number recursively. Each suspects the other is miscalibrated.
  *   **Verdict:** **Kills Claim 2 (Convergence Heuristic) and Claim 4 (Hidden Evidence).**
  *   **Reasoning:** Aumann requires *common knowledge*. Swapping numbers $N$ times creates knowledge of depth $N$. It does not create the infinite recursion required for the strict theorem. Furthermore, if Forecaster A thinks Forecaster B is *miscalibrated*, A is not treating B as a Bayesian peer. A is effectively saying, "B's prior or likelihood function is wrong." This violates the Common Prior/Model assumption.
  *   **Confidence:** **95%.** This is the standard critique of applying Aumann to real life.

  #### Case 2: Openly Different Priors (Base Rates)
  *   **Scenario:** One rejects reference classes; the other embraces them. Both know this.
  *   **Verdict:** **Kills Claim 1 (Strict Aumann) and Claim 3 (Common Prior Norm).**
  *   **Reasoning:** Aumann's theorem *explicitly requires* a common prior. If they agree they have different priors, the theorem is silent. They are allowed to disagree forever. For your friend to win here, he must argue that *one of them is irrational for having that prior*. That is a philosophical fight, not a mathematical one.
  *   **Confidence:** **99%.** This is the strongest technical counter-argument. The theorem literally does not apply without a common prior.

  #### Case 3: The Unresolvable Counterfactual
  *   **Scenario:** Disagreement on a counterfactual ("Safe if shipped in March") that will never be resolved.
  *   **Verdict:** **Survives Claim 1, Kills Claim 4 (Hidden Evidence).**
  *   **Reasoning:** Mathematically, you can have a prior over counterfactuals. Aumann still applies *if* they share priors and models. However, the "Hidden Evidence" claim fails because there is no ground truth to update toward. The disagreement persists not because of hidden evidence, but because the likelihood function for counterfactuals is unconstrained by reality. It highlights that "calibration" is impossible here, so the "superforecaster" label is doing no work.
  *   **Confidence:** **90%.**

  #### Case 4: Trust-Weighted Updating
  *   **Scenario:** Each discounts the other's number by a private trust factor. Both know they are doing this.
  *   **Verdict:** **Kills Claim 1 (Strict Aumann) and Claim 2 (Convergence).**
  *   **Reasoning:** This is the subtle one. If I discount your number, I am modeling you as a **noisy channel**. In Aumann's framework, agents are assumed to process information perfectly. If we disagree on the *trust factor* (the noise model), we effectively have **different likelihood functions** regarding the signal "The other person said X."
      *   If we agree on the trust model, we can converge.
      *   If we have *private, differing* trust factors, we are back to Case 2 (Different Priors/Models). We are disagreeing about the reliability of the evidence source (each other).
  *   **Confidence:** **85%.** (See "Least Sure" below).

  ---

  ### Part 4: Confidence and Uncertainty

  **Overall Confidence:** I am **95% confident** that your friend is misapplying the theorem to justify a normative claim (that forecasters *should* agree) as if it were a descriptive law (that they *must* agree). Case 2 alone is sufficient to dismantle his specific argument about the 20-point gap.

  **The Claim I Am Least Sure Of:**
  I am least certain about the precise formalization of **Case 4 (Trust-Weighted Updating)**.
  *   **Why:** It depends on whether the "trust factor" is treated as a prior on the *other agent's rationality* or a likelihood on the *signal*.
  *   **The Ambiguity:** If both agents model each other hierarchically (e.g., "I think you are a Bayesian, but I'm 80% sure you're calibrated"), this *can* be modeled within a common prior framework (a prior over types). If they do this correctly, they *should* eventually converge on the trust weights themselves.
  *   **The Risk:** If they converge on the trust weights but the weights remain asymmetric (e.g., "I trust you 80%, you trust me 50%"), they might still not converge on the event probability. There is niche literature on "agreeing to disagree on reliability" that suggests disagreement can persist if the trust update rules aren't symmetric. I am **85% confident** this kills the theorem's application, but a clever formalization could potentially rescue convergence under specific conditions.

  ### Summary for Your Reading Group
  Tell your friend this:
  > "Aumann's Agreement Theorem requires a **Common Prior** and **Common Knowledge**.
  > 1.  If you allow different priors (Case 2), the theorem doesn't apply.
  > 2.  If you stop after 6 rounds, you don't have Common Knowledge (Case 1).
  > 3.  If you discount each other's numbers, you have different likelihood models (Case 4).
  >
  > To claim someone is irrational, you have to prove they violate the **Common Prior Assumption**, not just that they disagree. The theorem says 'If priors are equal, agreement is mandatory.' It does not say 'Priors must be equal.'"
