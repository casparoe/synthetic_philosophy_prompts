      *   *Claim 4 (The "No Hidden Evidence" Corollary):* If posteriors differ after talking, someone is lying or withholding.
          *   Status: False/Overreach. Could be computational limits, different models, or non-common knowledge.
      *   *Claim 5 (The Decision-Relevance Extension):* Disagreement on probabilities implies disagreement on bets/actions.
          *   Status: Generally True if risk-neutral, but utility functions matter.

  4.  **Analyzing the Friend's Conclusion:**
      *   *Conclusion:* 20-point gap after 5-6 swaps = Irrationality OR Hidden Evidence.
      *   *Required Premises:*
          1.  **Common Prior:** They must start with the same probability distribution over the world. (Hidden Premise: Harsanyi Doctrine).
          2.  **Common Knowledge:** The "swapping numbers" must effectively make the posteriors common knowledge. (Hidden Premise: Communication is perfect and understood as Bayesian updates).
          3.  **Logical Omniscience/Computational Unboundedness:** They can process the other's number perfectly.
          4.  **Honesty:** No strategic misreporting.
      *   *Verdict:* The friend is overreaching. The theorem doesn't guarantee convergence in *finite* rounds in noisy real-world settings, nor does it mandate common priors.

  5.  **Evaluating the User's Four Cases:**

      *   *Case 1 (Stop after 6 rounds, no common knowledge of numbers, suspicion of miscalibration):*
          *   *Impact:* Kills the "Convergence Heuristic." If they don't *know* the other knows *they* know the number, common knowledge isn't established. Also, if they think the other is miscalibrated, they aren't treating the other as a Bayesian peer (violates the "common prior/likelihood" assumption implicitly).
          *   *Verdict:* Kills the Friend's application.

