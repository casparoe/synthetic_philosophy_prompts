  3.  **Drafting the Translation (Mapping to ML Vocabulary):**
      *   *Category:* Model output class / Label space ($Y$).
      *   *People Classified:* Data points / Instances ($X$).
      *   *Awareness:* Information leakage / Treatment assignment / Observation of prediction ($\hat{Y}$).
      *   *Feedback:* Performative prediction / Distributional shift ($P_{train}(X,Y) \neq P_{deploy}(X,Y)$).
