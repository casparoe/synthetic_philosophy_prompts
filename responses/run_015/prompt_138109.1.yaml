      *(Self-Correction on "Prevalence Elasticity"):* The user defines this as changing screening intensity. Hacking's looping is often about the *existence* of the label changing the behavior, not just the screening rate. I should note that distinction. Screening finds cases; Labeling *creates* cases (in the Hacking sense).

      *(Final thought on "Failure Modes"):* The biggest failure mode is "Goodhart's Law on Steroids." Not just optimizing the metric, but the metric defining the reality. Also, the "Silent Drift" where the *meaning* of a label shifts (e.g., "depression" in 1990 vs. 2020) without the distribution of features shifting obviously.

