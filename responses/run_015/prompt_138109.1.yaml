      *   *Indifferent Kinds:* Natural kinds (e.g., "quark," "gold") where the label doesn't affect the labeled.
      *   *Mechanism:* Awareness of the classification $\rightarrow$ Change in self-concept/behavior $\rightarrow$ Change in the phenomenon $\rightarrow$ Need to update the classification.
