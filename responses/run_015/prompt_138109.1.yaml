      *Critique of Translation:* This mapping is strong but risks reducing *ontology* to *statistics*. Hacking says the *thing* changes. ML says the *distribution* changes.

  4.  **Identifying the Residue (What doesn't survive?):**
      *   *First-Personal Element:* ML treats $X$ as feature vectors. Hacking treats people as agents with narratives. The "experience" of the label isn't a feature; it's the medium of the change.
      *   *Historical/Genealogical Element:* ML assumes i.i.d. or specific shift types. Hacking argues the *kind* has a history that constitutes it. "Multiple Personality" didn't exist before the practices that named it. In ML, we assume the target *exists* and we measure it noisily. Hacking says the target *emerges*.
      *   *Normative/Political Element:* ML optimizes a loss function. Hacking highlights resistance, stigma, empowerment. A patient rejecting a diagnosis isn't "label noise"; it's a political act that alters the DGP.

  5.  **Evaluating the Residue:**
      *   *Does it indict the framework?* Yes, in the sense that the framework assumes a stable ground truth (even if noisy). Hacking challenges the existence of ground truth for human kinds.
