      **1.3. Exclusion of Internal Evidence.**
      Operatives are advised that internal mental states constitute inadmissible evidence during audit. Feelings of certainty, mental pictures of plus signs, or inward recitation of formulas do not verify that the correct rule was followed. There is no inner fact accessible to the operative that guarantees future compliance. An operative may feel they are adding while actually following a different function. Compliance is external. Internal conviction is not a mitigating factor in disciplinary hearings regarding incorrect successors.

      **2.1. Indistinguishability Policy (Threshold 64).**
      Management acknowledges that multiple functions agree with standard addition for all pairs below 64 but diverge thereafter. Specifically, a function may return 5 for any sum exceeding 64. Past performance data cannot distinguish between standard addition and this alternative function. An operative who has always added correctly below 64 is not certified to add above 64. Each new integer requires fresh validation. No run of past answers establishes the rule for future numbers. The correct continuation remains fixed regardless of this indistinguishability.

