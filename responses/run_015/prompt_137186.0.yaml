      **OPERATIONAL COMPLIANCE MANUAL: SERIES CONTINUATION UNIT (REF: SC-99)**

      **1.1. Determination of Correct Successors.**
      Upon presentation of the initial sequence (2, 4, 6, 8), the operative is required to supply the correct subsequent integer. Correctness is initially defined by the operative's dispositional state. That is, the correct number is that which the operative is disposed to write under standard conditions. However, disposition alone is insufficient, as a operative may be disposed to err. Therefore, correctness relies on the disposition to follow the rule intended, not merely the disposition to answer.

      **1.2. Reference to Intended Rule.**
