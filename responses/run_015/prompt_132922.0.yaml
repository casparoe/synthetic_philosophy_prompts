  # Epistemic Consistency: A Diagnostic Instrument

  ## Part I: The Eight Diagnostic Questions

  *Instructions: Answer each question with **Yes** or **No** based on your immediate rational intuition. Do not worry about consistency with other answers yet.*

  **Q1. (Gradability)**
  Is it possible to be 99% confident in a claim without being "fully confident" in it?

  **Q2. (Aggregation)**
  If you are fully confident in Claim A and fully confident in Claim B, does rationality require you to be fully confident in the single claim "A and B"?

  **Q3. (Statistical Knowledge)**
  An inspector certifies 200 structures. She knows her department's equipment misses exactly one hidden flaw in every 200 inspections on average. She checks all 200 and finds nothing. Does she *know* Structure #1 is safe?

  **Q4. (The Mixed Case)**
  Suppose the inspector physically tested Structure #1 with a microscope but relied on the department's average error rate for Structure #2. Is her mental state toward #1 fundamentally different in *kind* (not just strength) from her state toward #2?

  **Q5. (Asymmetric Stakes)**
  You hold 100 tickets. Losing on one ticket costs \$1. Losing on all of them costs your life. You believe each ticket will lose. Does the high cost of the combined outcome make it irrational to believe *all* will lose, even if believing each single one is rational?

  **Q6. (Assertion vs. Thought)**
  Can you sincerely assert every claim in a long report while simultaneously asserting in the introduction that one claim in the report is likely false?

  **Q7. (Modal Closeness)**
  If a belief is true in nearly every nearby possibility but false in one very specific, unlikely possibility, is it knowledge?

  **Q8. (Error Possibility)**
  If you cannot logically rule out the possibility of error, is it irrational to claim you believe the claim?

  ***

  ## Part II: Scoring Key and Classification Leaves

  *Instructions: Follow the path below based on your answers. Stop at the first leaf you reach.*

  1.  **If Q8 = Yes:** Go to **Leaf 1**.
  2.  **Else, If Q1 = Yes AND Q2 = No:** Go to **Leaf 2**.
  3.  **Else, If Q5 = Yes:** Go to **Leaf 3**.
  4.  **Else, If Q4 = Yes:** Go to **Leaf 4**.
  5.  **Else, If Q6 = Yes:** Go to **Leaf 5**.
  6.  **Else, If Q3 = No OR Q7 = No:** Go to **Leaf 6**.
  7.  **Else, If Q2 = No:** Go to **Leaf 7**.
  8.  **Otherwise:** Go to **Leaf 8**.

  ### The Leaves

  **Leaf 1: The Infallibilist**
  *   **Description:** Rational belief requires the elimination of all error possibilities.
  *   **Awkward Commitment:** Most ordinary claims (e.g., "I have hands") become irrational to believe.
  *   **Empty Space Note:** Combinations where Q8=Yes and Q3=Yes are **incoherent** (one cannot require error elimination while accepting statistical knowledge).

  **Leaf 2: The Gradualist**
  *   **Description:** Confidence comes in degrees; "full belief" is not a required category for rationality.
  *   **Awkward Commitment:** Cannot easily explain binary actions (e.g., betting everything on a single outcome).
  *   **Empty Space Note:** Combinations where Q1=Yes and Q4=No are **untried** (admitting degrees but denying they create kind-differences in mixed cases).

  **Leaf 3: The Pragmatist**
  *   **Description:** The rationality of belief depends on what is at stake in acting on it.
  *   **Awkward Commitment:** Two agents with the same evidence can differ on what it is rational to believe based on their wealth or risk tolerance.
  *   **Empty Space Note:** None significant; this is a robust position.

  **Leaf 4: The Dual-Attitude Theorist**
  *   **Description:** Distinguishes between "belief" (high confidence) and "acceptance" (commitment to use in reasoning).
  *   **Awkward Commitment:** Posits two distinct mental states to do the work of one, risking psychological redundancy.
  *   **Empty Space Note:** Combinations where Q4=Yes and Q1=No are **unattractive** (claiming a difference in kind without a difference in degree).

  **Leaf 5: The Normative Separatist**
  *   **Description:** The norms governing belief are weaker than the norms governing assertion.
  *   **Awkward Commitment:** Allows that you can believe something you are not permitted to say (Moorean paradoxes).
  *   **Empty Space Note:** None significant.

  **Leaf 6: The Safety-First Theorist**
  *   **Description:** Belief requires safety (truth in nearby worlds) rather than high probability.
  *   **Awkward Commitment:** Verdicts on knowledge can flip based on irrelevant distant possibilities rather than statistical evidence.
  *   **Empty Space Note:** Combinations where Q3=Yes and Q7=No are **incoherent** (accepting statistical knowledge while rejecting modal closeness).

  **Leaf 7: The Fragmentalist**
  *   **Description:** Rational belief does not aggregate; one can believe A and B without believing A&B.
  *   **Awkward Commitment:** Logic fails to govern the mind; rational agents can hold explicitly contradictory sets of beliefs.
  *   **Empty Space Note:** Combinations where Q7=Yes and Q2=Yes are **untried** (safety theorists usually preserve aggregation).

  **Leaf 8: The Permissivist**
  *   **Description:** It is rational to believe each claim and rational to believe the conjunction is false.
  *   **Awkward Commitment:** Rationality permits holding contradictory propositions simultaneously.
  *   **Empty Space Note:** This leaf captures the "standard" intuitive response that resists theoretical systematization.

  ***

  ## Part III: Instrument Notes

  **1. The "Yes to Everything" Outcome**
  A student who answers **Yes** to all eight questions lands on **Leaf 1 (The Infallibilist)**.
  *Reasoning:* The Scoring Key prioritizes Q8 as the primary gate. However, note that this answer pattern is logically unstable: an Infallibilist (Q8=Yes) should consistently answer No to Q3 (Statistical Knowledge). The instrument forces a classification based on the strictness of the error norm, but the student should be warned that their Q3 answer contradicts their Q8 answer.

  **2. Indistinguishable Pairs**
  This instrument cannot reliably separate **Leaf 7 (The Fragmentalist)** and **Leaf 8 (The Permissivist)**.
  *Reason:* Both views result in an agent who holds justified beliefs that are jointly inconsistent. The distinction lies in whether the agent *believes* the conjunction (Permissivist) or simply *fails to believe* it (Fragmentalist). Since Q2 asks about rational *requirement* rather than psychological *fact*, a student may answer No to Q2 for either reason. Distinguishing them requires a question about the agent's actual doxastic state regarding the conjunction, which is difficult to diagnose via intuition pump.

  **3. Empty Logical Space**
  *   **Incoherent:** Q8=Yes (Infallibilism) combined with Q3=Yes (Statistical Knowledge). One cannot demand error elimination while accepting knowledge based on error-prone statistics.
  *   **Unattractive:** Q1=No (Binary Belief) combined with Q4=Yes (Mixed Case Kind-Difference). If belief is all-or-nothing, it is difficult to argue that verified vs. statistical evidence creates a different *kind* of state without invoking degrees.
  *   **Untried:** Q7=Yes (Modal Safety) combined with Q2=No (No Aggregation). Most safety theorists preserve logical closure; a view combining safety with fragmentation exists in logical space but lacks prominent defenders.

  **4. Diagnostic Coverage**
  *   **Lottery vs. Preface Separation:** Q3 (Statistical) and Q4 (Mixed Case) separate views that treat statistical uncertainty (Lottery) differently from empirical fallibility (Preface). Views that answer Yes to Q3 but Yes to Q4 treat the Inspector's statistical verdicts as different in kind from her verified verdicts, mimicking the Preface intuition without using the forbidden case name.
  *   **Normative Domain:** Q6 isolates views that restrict assertion more than belief.
  *   **Modal vs. Statistical:** Q3 and Q7 isolate views that prioritize modal closeness over probability.
