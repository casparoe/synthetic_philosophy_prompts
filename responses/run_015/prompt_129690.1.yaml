answer: |-
  ### Brainstorming: Nearest Established Concepts

  Before diagnosing the pattern, I must list the proximate concepts in argumentation theory and political philosophy to ensure we do not conflate them with the phenomenon you have described.

  1.  **Equivocation (Informal Fallacy):** Using a single term in two different senses within an argument to derive a false conclusion.
      *   *Distinction:* Equivocation is typically a unilateral error or deceit by one arguer. Your pattern describes a *bilateral* structural dependency where both sides (Defender and Critic) rely on the duality to sustain the debate, even if unintentionally.
  2.  **Motte-and-Bailey Doctrine:** Retreating to a modest, defensible claim (Motte) when challenged, then re-expanding to a bold, controversial claim (Bailey) when safe.
      *   *Distinction:* As you noted, the Motte-and-Bailey is temporal and defensive. In your pattern, the two structures (historical commitment vs. normative authority) are often invoked *simultaneously* or in rapid succession to do different work (one to deflect empirical critique, one to motivate action), rather than one protecting the other.
  3.  **Essentially Contested Concepts (Gallie):** Concepts (like "democracy" or "justice") where disagreement is inherent to their usage, yet parties agree on the core evaluative point.
      *   *Distinction:* In an ECC, parties agree on the *logical type* of the concept (e.g., both agree it is normative) but disagree on the criteria. In your pattern, the parties disagree on the *ontological status* of the concept (Descriptive/Historical vs. Normative/Exclusive).
  4.  **Strategic Essentialism (Spivak):** A group temporarily adopting a simplified, essentialist identity for political mobilization.
      *   *Distinction:* This is a conscious, temporary political tactic. Your pattern describes a deeper conceptual confusion where the Defender may genuinely believe the descriptive claim while relying on the normative weight, without necessarily intending a strategic pivot.
  5.  **Floating Signifier (Laclau):** A signifier without a fixed signified, allowing diverse groups to project their own meanings.
      *   *Distinction:* A floating signifier is defined by its *vagueness*. Your pattern involves two *precise* logical structures (historical inventory vs. normative command) that are being conflated, not a lack of structure.
  6.  **Systematic Ambiguity (Walton):** Ambiguity that is not accidental but serves a function in dialogue.
      *   *Distinction:* This is the genus of your phenomenon. However, "Systematic Ambiguity" is too broad; it does not capture the specific *geographic-normative* pairing or the stalemate mechanism you identified.

  ***

  ### Diagnosis: Is There an Established Name?

  There is **no single canonical term** in philosophy of language or argumentation theory that captures this specific configuration. While the components are well-known (the *is-ought* problem, *performative contradiction*, *systematic ambiguity*), the specific *choreography* you describe—where a geographic-historical description and a normative-prescriptive command are fused into a single label to create a debate-proof stalemate—lacks a precise label.

  The closest existing framework is **Systematic Ambiguity** within the context of **Political Ontology**, but this fails to specify the *direction* of the ambiguity (Provenance vs. Normativity).

  Therefore, to provide the precision you require, I will coin a term that carves out this specific phenomenon.

  ### The Coined Term: **The Normative-Provenance Bifurcation**

  **Definition:**
  The **Normative-Provenance Bifurcation** is a rhetorical and conceptual structure in which a political label sustains two incompatible logical types simultaneously:
  1.  **A Descriptive-Provenance Claim:** The label denotes a specific historical or geographic lineage (e.g., "practices adopted by the West").
  2.  **A Normative-Authoritative Claim:** The label denotes a binding moral or political imperative (e.g., "values we must defend").

  The bifurcation occurs when interlocutors treat these two types as interchangeable within a single exchange. The Defender utilizes the *Provenance* claim to deflect empirical counter-examples (shifting to "we never claimed uniqueness") while simultaneously relying on the *Normative* claim to justify political action (which requires distinctiveness or authority). The Critic, conversely, often attacks the *Provenance* claim (showing non-uniqueness) as if it refutes the *Normative* claim, failing to see that the Defender has already decoupled them.

  ***

  ### Boundary Cases: What It Is and Is Not

  To ensure the carving is precise, we must distinguish the **Normative-Provenance Bifurcation** from three specific boundary cases.

  #### 1. Versus Ordinary Polysemy
  *   **Polysemy:** A word has multiple related meanings (e.g., "bank" of a river vs. "bank" for money). Context usually clarifies which is meant.
  *   **Bifurcation:** The ambiguity is not resolved by context; it is *exploited* by the lack of resolution. In the "Western values" debate, the ambiguity is not accidental; the concept *requires* both meanings to function politically. If you resolve the ambiguity (e.g., "Okay, it's just a historical list, no normative weight"), the political utility of the phrase collapses. Polysemy allows communication; Bifurcation sustains a stalemate.

  #### 2. Versus Strategic Essentialism
  *   **Strategic Essentialism:** A group consciously adopts a simplified identity ("We are the West") for a specific political goal, knowing it is a simplification.
  *   **Bifurcation:** The Defender in the Bifurcation often *denies* essentialism when pressed ("We don't claim these are unique to us"). Strategic Essentialism admits the simplification; Bifurcation hides the logical shift. In Bifurcation, the speaker claims to be descriptive when attacked, but acts prescriptive when mobilizing. The "strategy" is embedded in the concept's structure, not necessarily in the speaker's conscious intent.

  #### 3. Versus Value Revision (Conceptual Change)
  *   **Value Revision:** A group changes its values over time (e.g., "The West used to value empire, now it values rights"). This is a diachronic change in content.
  *   **Bifurcation:** This is a synchronic logical conflict. The content (rights, courts) remains the same, but the *logical status* of the claim shifts mid-argument. Value revision admits the past was different; Bifurcation claims the label covers the past and present but changes its rules of verification when challenged.

  ***

  ### Mapping the Pattern: How the Bifurcation Works

  Here is how the **Normative-Provenance Bifurcation** maps exactly onto the "Western values" choreography you described:

  **1. The Initial Move (The Fusion)**
  *   **Defender:** Lists concrete practices (constitutionalism, rights) as "Western values."
  *   **Logical Status:** Ambiguous. It looks descriptive (these exist here) but sounds normative (these are *our* values).
  *   **Bifurcation Point:** The label fuses *Provenance* (West) with *Normativity* (Values).

  **2. The Critic's Attack (Targeting Provenance)**
  *   **Critic:** Shows these practices exist elsewhere or are violated by the West.
  *   **Assumption:** The Critic treats "Western values" as an **Exclusive Ownership Claim** (Essentialism). They assume that if the practice isn't unique or isn't perfectly followed, the label is false.
  *   **Result:** They attack the *Provenance* arm of the bifurcation.

  **3. The Defender's Shift (Retreating to Description)**
  *   **Defender:** "We don't claim uniqueness, only historical commitment."
  *   **Logical Status:** Purely **Descriptive-Provenance**. This immunizes the claim against the Critic's counter-examples (non-Western societies having rights doesn't refute the claim that the West *also* committed to them).
  *   **Bifurcation Mechanism:** The Defender severs the Normative link to survive the empirical critique.

  **4. The Normative Pivot (Restoring Authority)**
  *   **Defender:** "Therefore, we must defend Western values."
  *   **Logical Status:** Purely **Normative-Authoritative**.
  *   **The Trap:** This prescriptive move only makes sense if the values are *distinctive* or *authoritative*. If "Western values" are just "values that happen to be in the West," the command to "defend" them loses its specific force (why not defend "Human values"?). The Defender silently re-attaches the Normative weight that they just detached to survive the critique.

  **5. The Stalemate (The Closed Loop)**
  *   **Critic:** Continues to attack the Provenance (Exclusivity).
  *   **Defender:** Continues to toggle between Provenance (for defense) and Normativity (for offense).
  *   **Outcome:** The debate stalls because the **conditions of satisfaction** differ. The Critic is testing a truth-condition (Is this unique/consistent?). The Defender is asserting a speech-act (Commit to this identity). Because the label "Western Values" hides the switch between these two logical types, neither side recognizes they are no longer engaging the same proposition.

  ### Conclusion

  The phenomenon you have identified is the **Normative-Provenance Bifurcation**.

  It is distinct from the *Motte-and-Bailey* because it does not rely on a defensible core protecting an indefensible extension; rather, it relies on two contentious claims protecting each other by switching logical types. It is distinct from *Equivocation* because it is structurally embedded in the political concept itself, not merely a linguistic error.

  This bifurcation allows the concept "Western values" to be empirically unfalsifiable (via the descriptive shield) while remaining politically potent (via the normative sword). Recognizing this structure requires forcing the interlocutor to choose: *Is "Western values" a historical inventory or a normative command?* If the former, the command to "defend" them requires further justification. If the latter, the historical inventory is irrelevant to their validity. The debate stalls only so long as the Bifurcation remains unexamined.
