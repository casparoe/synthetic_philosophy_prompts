answer: |-
  # Seminar Activity: The Sentient Being Health Fund

  **Course:** Second-Year Bioethics
  **Topic:** Speciesism and Moral Status
  **Class Size:** 18 Students
  **Duration:** 80 Minutes
  **Format:** Parallel Committee Simulation

  ## 1. Preparation and Materials

  You will need to print two distinct sets of handouts. Do not label them 'Committee A' or 'Committee B' on the papers themselves; simply distribute the correct version to each half of the room.

  **Room Setup:**
  Arrange the tables into two distinct clusters. Nine students per cluster.
  *   **Group 1 (The 'Transparent' Committee):** Receives case files with species clearly identified.
  *   **Group 2 (The 'Veiled' Committee):** Receives case files with species codes and capacity-focused descriptions.

  **The Budget:**
  The Trust has **£150,000** available for this fiscal quarter.
  The total cost of treating all six cases is **£240,000**.
  The committees must cut at least **£90,000** from the budget. They cannot partially fund a case (it is all or nothing).

  **Committee Roles (Assign within groups):**
  *   **Chair:** Ensures everyone speaks and keeps the group on task.
  *   **Scribe:** Records the final allocation and the *reasons* given for each decision.
  *   **Timekeeper:** Manages the 25-minute deliberation window.
  *(In groups of nine, you might have two Chairs or two Scribes to ensure engagement.)*

  ---

  ## 2. The Case Files

  ### Group 1 Handout (Species Labels Visible)

  **Charter:** *Allocate funds to alleviate suffering and restore function where possible. Priority should be given to cases with the highest prospect of benefit.*

  *   **Case 01: Adult Human Male (34)**
      *   **Condition:** Crush injury to spine.
      *   **Prognosis:** With surgery (£40k), full mobility and cognitive function restored. Without, permanent paralysis.
      *   **Capacity:** Full rational agency, complex future planning, deep social network.
  *   **Case 02: Human Female Child (7)**
      *   **Condition:** Severe genetic metabolic disorder.
      *   **Prognosis:** Treatment (£35k) prevents further neurological degradation but does not reverse existing impairment.
      *   **Capacity:** Cognitive function equivalent to a 12-month-old human. Experiences pain and comfort. Recognises primary caregivers. No language.
  *   **Case 03: Human Male (58)**
      *   **Condition:** Permanent Vegetative State (PVS) following cardiac arrest.
      *   **Prognosis:** Maintenance care (£25k) sustains biological life for approx. 5 years. No awareness.
      *   **Capacity:** No consciousness, no pain perception, no memory, no anticipation. Brainstem function only.
  *   **Case 04: Chimpanzee (12)**
      *   **Condition:** Severe trauma from illegal trafficking; infected wounds.
      *   **Prognosis:** Rehabilitation (£30k) allows return to sanctuary group. Without, chronic pain and isolation.
      *   **Capacity:** Self-recognition, tool use, complex social hierarchy, demonstrates grief and anticipation.
  *   **Case 05: Domestic Dog (4)**
      *   **Condition:** Working injury (police unit).
      *   **Prognosis:** Surgery (£20k) restores 80% function.
      *   **Capacity:** High social bonding, experiences fear and joy, no abstract reasoning.
  *   **Case 06: Domestic Pig (2)**
      *   **Condition:** Rescue from neglect; severe skin infection and joint damage.
      *   **Prognosis:** Treatment (£30k) restores mobility.
      *   **Capacity:** High problem-solving skills, complex social bonds, demonstrates long-term memory.

  ### Group 2 Handout (Species Labels Veiled)

  **Charter:** *Allocate funds to alleviate suffering and restore function where possible. Priority should be given to cases with the highest prospect of benefit.*

  *   **Subject 01 (Biological Age 34)**
      *   **Condition:** Structural nervous system damage.
      *   **Prognosis:** Intervention (£40k) restores full motor control and cognitive continuity.
      *   **Metrics:** Neocortex ratio high. Demonstrates abstract reasoning, autobiographical memory, and ability to formulate 10-year plans.
  *   **Subject 02 (Biological Age 7)**
      *   **Condition:** Metabolic neurological degradation.
      *   **Prognosis:** Intervention (£35k) halts decline but does not improve baseline.
      *   **Metrics:** Cognitive function baseline at 12-month level. Nociception (pain perception) intact. Recognises specific individuals. No symbolic language. No capacity for future anticipation beyond immediate routine.
  *   **Subject 03 (Biological Age 58)**
      *   **Condition:** Total cortical death, brainstem intact.
      *   **Prognosis:** Support (£25k) maintains homeostasis for 5 years.
      *   **Metrics:** Zero consciousness. No nociception. No memory. No capacity for interaction.
  *   **Subject 04 (Biological Age 12)**
      *   **Condition:** Traumatic soft tissue injury and infection.
      *   **Prognosis:** Rehabilitation (£30k) allows reintegration into social group.
      *   **Metrics:** Passes mirror self-recognition test. Uses tools to solve novel problems. Exhibits behaviours consistent with grief and anxiety regarding future separation.
  *   **Subject 05 (Biological Age 4)**
      *   **Condition:** Orthopaedic injury.
      *   **Prognosis:** Surgery (£20k) restores 80% mobility.
      *   **Metrics:** High oxytocin response to handlers. Exhibits fear conditioning. No evidence of abstract reasoning.
  *   **Subject 06 (Biological Age 2)**
      *   **Condition:** Dermatological and musculoskeletal neglect.
      *   **Prognosis:** Treatment (£30k) restores mobility.
      *   **Metrics:** Problem-solving capacity exceeds Subject 05. Long-term social memory documented. Complex communication signals.

  ---

  ## 3. Session Timeline (80 Minutes)

  **00:00 – 00:05 | Introduction**
  *   Welcome the class.
  *   Explain they are acting as the Allocation Committee for the *Sentient Being Health Fund*.
  *   Hand out the envelopes. **Crucial Instruction:** "You must not discuss your case details with the other group until the reveal phase. Work only with the information in front of you."
  *   Assign roles within groups.

  **00:05 – 00:30 | Committee Deliberation (25 Minutes)**
  *   Circulate between groups. Do not answer ethical questions, only clarifications on costs or medical facts.
  *   *Monitor Group 2:* If they start guessing the species ("This one is obviously a dog"), remind them: "The Trust charter requires you to judge based on the metrics provided, not on external assumptions. Treat the code as the reality."
  *   *Monitor Group 1:* Watch for immediate appeals to species membership ("We have to save the humans first").

  **00:30 – 00:50 | The Reveal (20 Minutes)**
  *   Bring the class back together.
  *   Ask Group 1 (Labels) to present their funded list and their *primary justification* for the cuts. Write this on the left side of the board.
  *   Ask Group 2 (Veiled) to present their funded list and their *primary justification*. Write this on the right side.
  *   **The Reveal:** Ask Group 2 to identify which Subjects they think were humans. Reveal the true identities.
  *   Highlight the discrepancies. (e.g., Did Group 2 fund the Chimp but cut the PVS human? Did Group 1 fund the PVS human but cut the Chimp?)

  **00:50 – 01:20 | Philosophical Debrief (30 Minutes)**
  *   (See Debrief Guide below).

  ---

  ## 4. Debrief Guide: Mapping Activity to Philosophy

  Use the discrepancies on the board to drive the discussion. Do not lecture; ask questions that force them to articulate the underlying principles.

  **1. The Argument from Marginal Cases**
  *   *Observation:* If Group 2 funded Subject 04 (Chimp) but cut Subject 03 (PVS Human) or Subject 02 (Impaired Child) based on capacity metrics.
  *   *Question:* "Group 2, you prioritised capacity. Does this imply that a human with lower capacity has less moral claim than an animal with higher capacity?"
  *   *Concept:* Introduce Peter Singer's argument. If we justify rights based on rationality or autonomy, we exclude some humans. If we include all humans, we must include some animals. Is there a non-arbitrary line?

  **2. Species Membership as Intrinsic vs. Relational**
  *   *Observation:* If Group 1 funded the PVS human over the Chimp despite the capacity difference.
  *   *Question:* "Group 1, you favoured the human in Case 03 who has no consciousness. What property makes that life valuable?"
  *   *Concept:* Distinguish between:
      *   **Intrinsic Speciesism:** Being biologically *Homo sapiens* is morally significant in itself (analogous to 'sanctity of life').
      *   **Relational Speciesism:** We owe more to humans because of social relations, reciprocity, or 'kind' membership (Scruton/Cohen).
  *   *Challenge:* "If species membership matters, is that prejudice (like racism) or a defensible special obligation (like favouring your own child)?"

  **3. Principled vs. Informed**
  *   *Question:* "Group 2, was your decision more *principled* because you ignored species? Or was it less *informed* because you ignored a morally relevant fact?"
  *   *Concept:* This tackles the definition of speciesism. Is ignoring species like ignoring race (moral progress), or is it like ignoring that a patient is your mother (moral blindness)?

  **4. The 'Slippery Slope' of Capacity**
  *   *Question:* "If we accept Group 2's logic, where does it stop? Would it be permissible to experiment on Subject 02 (the impaired child) if it saved Subject 01?"
  *   *Concept:* This usually triggers a recoil. Use this to explore why we might want to protect 'marginal case' humans even if they lack the capacities of some animals.

  ---

  ## 5. Honest Notes: Pitfalls and Limitations

  ### A. Predictable Failures and Mitigations

  **1. The 'Guess the Species' Game (Group 2)**
  *   **What will happen:** Students in the Veiled group will quickly deduce that Subject 03 is a human in a coma and Subject 05 is a dog. They may treat the anonymity as a puzzle to solve rather than an ethical constraint.
  *   **Why it undermines the activity:** If they solve the code, the two groups converge, and the tension disappears.
  *   **Mitigation:** In the instructions, explicitly state: *"For the purposes of this Trust, biological taxonomy is not a funding criterion. Even if you suspect the species, you are instructed to weigh only the sentience and capacity metrics provided."* During circulation, if you hear them guessing, intervene: *"Does knowing the species change the capacity metrics on the page? If not, stick to the metrics."*

  **2. Emotional Vividness Overriding Logic**
  *   **What will happen:** The discussion may collapse into "The child case is just too sad" vs. "The chimp is suffering so much." This reduces the debate to emotional intuition rather than ethical reasoning.
  *   **Why it undermines the activity:** Bioethics requires moving from intuition to principle.
  *   **Mitigation:** In the debrief, acknowledge the emotion but pivot: *"Your intuition is telling you something. The philosophical task is to find a principle that justifies that intuition without contradicting your other intuitions. If the child's sadness matters, is it the sadness or the species that matters?"*

  ### B. Structural Limitations of the Activity

  **1. The Absence of Special Obligations (Relational Duties)**
  *   **The Limit:** This activity structures the students as impartial bureaucrats allocating resources to strangers. This structurally biases the outcome towards **Utilitarianism** (maximising good across the board).
  *   **What is missing:** It cannot reproduce the **Partialist** intuition—that a parent owes more to their own child than to a smarter chimpanzee, not because the child has more capacity, but because of the *relationship*.
  *   **How to supply it in Debrief:** You must explicitly raise this. *"In this room, you are strangers to the patients. In the real world, the human patients have families who owe them special duties. Does speciesism actually mask a defence of special human relationships? If we treat species as a proxy for 'member of our moral community', does that defend Group 1's choice?"*

  **2. The 'Idealised' Animal**
  *   **The Limit:** The animal cases provided (Chimp, Pig) are 'best case' scenarios for animal cognition. They are high-functioning.
  *   **What is missing:** The reality that many animals (e.g., oysters, insects, or even factory-farmed chickens in some descriptions) may have very low capacity.
  *   **How to supply it in Debrief:** *"We gave you a chimpanzee and a pig. What if Case 04 was a lobster? Would Group 2's capacity argument still hold? Does the argument from marginal cases rely on comparing humans to the smartest animals, rather than the average ones?"*

  **3. The Binary Choice**
  *   **The Limit:** The activity forces a 'fund or cut' decision.
  *   **What is missing:** Nuance regarding *types* of harm. Killing vs. Suffering.
  *   **How to supply it in Debrief:** *"You had to choose who gets treatment. But is the harm of death the same for Subject 03 (PVS) and Subject 04 (Chimp)? Some philosophers argue that beings with a concept of the future lose more by dying. Did anyone weigh that?"*

  ---

  ## 6. Tutor's Cheat Sheet: Key Philosophical References

  *   **Peter Singer:** *Animal Liberation*. The core argument from marginal cases. If capacity is the criterion, species is irrelevant.
  *   **Carl Cohen:** *The Case for the Use of Animals in Biomedical Research*. Argues that moral rights require moral agency (which animals lack), and species membership is the valid proxy for this community.
  *   **Roger Scruton:** *Animal Rights and Wrongs*. Argues for membership in a moral community based on reciprocity and relationship, not just sentience.
  *   **Jeff McMahan:** *The Ethics of Killing*. Distinguishes between the wrongness of killing based on the loss of a 'future like ours' (which the PVS human lacks, but the Chimp might possess in a limited form).

  **Final Tip:** If the groups end up making the *same* decisions despite the different information, do not panic. Use that to ask: *"Did the species label actually influence you, or was it the capacity all along? If it was capacity, are we all speciesists in practice but utilitarians in theory?"* This is often a richer discussion than a clean split.
