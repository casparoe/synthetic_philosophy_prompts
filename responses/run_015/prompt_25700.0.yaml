answer: |-
  You have identified a very specific and well-documented phenomenon in social epistemology. You are correct that it doesn't fit perfectly into Miranda Fricker's original definitions of *testimonial* or *hermeneutical* injustice, though it is deeply related to both.

  While there isn't one single "canonical" term that captures every nuance of this specific split (fact vs. theory), philosophers have developed several concepts that describe exactly what you are seeing.

  Here is the breakdown of the best philosophical characterizations for this dynamic.

  ### 1. Contributory Injustice (Kristie Dotson)
  The strongest technical fit for your description is **Contributory Injustice**, a concept developed by philosopher Kristie Dotson (an expansion of Fricker's work).

  *   **The Definition:** Contributory injustice occurs when a dominant group possesses the hermeneutical resources (the concepts, theories, and analyses) offered by a marginalized group but **willfully refuses to utilize them.**
  *   **Why it fits:** In your scenario, the marginalized person *has* the concepts. They are offering an interpretation ("This is sexism," "This is ableism"). The audience understands the words but dismisses the *validity* of the interpretation because of the speaker's identity.
  *   **The Mechanism:** Dotson argues this is an active refusal to participate in a shared economy of meaning. The dominant group accepts the "data" (the raw experience) because it is useful to them, but rejects the "theory" (the analysis) because accepting it would require acknowledging structural complicity.

  ### 2. Epistemic Objectification (or Instrumentalization)
  Your description of the "division of epistemic labor" (data provider vs. theorist) is often described as **Epistemic Objectification**.

  *   **The Concept:** This occurs when a knower is treated not as a full epistemic agent (someone who generates knowledge), but as a mere *source* of information (a sensor).
  *   **The Dynamic:** The marginalized person is treated like a scientific instrument. A thermometer provides data (temperature), but it does not offer a theory on *why* the room is hot. Similarly, the woman provides data (the sexist comment), but is denied the agency to theorize about the culture.
  *   **The Outsider's Role:** The privileged outsider is granted **Epistemic Authority**. Because they are not "contaminated" by the experience, they are viewed as capable of abstraction and objectivity. This turns the marginalized person into a *subject of study* and the privileged person into the *researcher*.

  ### 3. A Specific Form of Testimonial Injustice: *Interpretive Credibility*
  You noted that it isn't quite testimonial injustice because the "facts" are believed. However, many contemporary epistemologists argue this **is** a form of testimonial injustice, just more granular than Fricker's original definition.

  *   **Observation vs. Interpretation:** Testimonial credibility is often split into two capacities: **Observational Competence** (did you see/hear/feel this?) and **Interpretive Competence** (do you understand what this means?).
  *   **The Split:** In the cases you describe, the marginalized speaker is granted *Observational Credibility* ("I believe that happened to you") but denied *Interpretive Credibility* ("But you're too close to see what it means").
  *   **The Prejudice:** The credibility deficit is driven by the prejudice that emotional proximity equals intellectual bias. The assumption is that suffering grants you data, but it clouds your judgment.

  ### 4. Standpoint Epistemology and "The God Trick"
  To explain *why* this happens, we look to **Standpoint Epistemology** (Sandra Harding, Donna Haraway).

  *   **The God Trick:** Donna Haraway coined this term to describe the illusion of seeing everything from nowhere. The privileged outsider is allowed to claim the "View from Nowhere" (objectivity), while the marginalized insider is stuck with the "View from Somewhere" (bias).
  *   **Strong Objectivity:** Standpoint theorists argue the opposite: that marginalized people actually have *stronger* objectivity because they must understand both their own reality and the dominant reality to survive.
  *   **The Inversion:** The pattern you noticed is a defensive inversion of standpoint theory. It admits the marginalized person has access to the reality (the facts) but claims that access disqualifies them from analyzing it.

  ### 5. Medical Epistemology: "Uptake" and Narrative
  In the philosophy of medicine (e.g., Havi Carel, Ian James Kidd), this is a major topic regarding patient testimony.

  *   **Symptom vs. Diagnosis:** Doctors often accept the *phenomenology* (the pain, the fatigue) but reject the *etiology* (the patient's theory on the cause).
  *   **Hermeneutical Domination:** This occurs when the medical institution imposes its own narrative over the patient's narrative. Even if the patient says, "This medication causes this side effect," the doctor may dismiss it as "anxiety" or "coincidence." The patient is the authority on *feeling*, but the doctor is the authority on *meaning*.

  ### How to Characterize It
  If you are writing or discussing this, the most precise way to characterize it is as **a credibility deficit regarding interpretive competence, resulting in epistemic objectification.**

  However, if you want to use existing terminology, **Contributory Injustice** is the most accurate existing label for the dismissal of the analysis, while **Epistemic Objectification** best describes the "data provider" role.

  **Summary of the Dynamic:**
  1.  **Extraction:** The experience is extracted as raw data (Testimonial Justice/Observational Credibility).
  2.  **Exclusion:** The analysis is excluded as biased (Contributory Injustice/Interpretive Credibility Deficit).
  3.  **Re-appropriation:** The analysis is often validated only when repeated by a privileged outsider (Epistemic Authority).

  This dynamic preserves the status quo: it allows the dominant group to acknowledge individual instances of harm (maintaining a veneer of fairness) while rejecting the structural analysis required to fix them (maintaining power).
