prompt: |-
  I'm the lead on conceptual docs at a dev-tools company, which basically means I own the vocabulary: the framing analogy in the overview page, and then every tooltip, error message and diagram inherits it. It happens five or six times a quarter, I get about a day per decision, I'm not a cognitive scientist, and the CTO signs off on the overview. Stakes are high in a dumb way — once something like "the cache is your model's short-term memory" ships, support fields tickets from people who reasoned their way to a conclusion we never actually stated. Our reviewers' reflex objection is that every analogy is wrong somewhere, which proves too much to be any use.

  Write me a procedure I can run on a candidate analogy before it goes in, grounded in the Hofstadter/Sander line that analogy-making and categorisation are the same activity — so importing a source drags in it's whole naive theory, not just the piece I wanted, and a category can be enriched later by analogy with ones you already have. I want the questions in order, what counts as a sufficient answer to each, and specifically: how to tell a misfit that sits there harmlessly from an entailment people will actually draw and act on; how to check the audience even has the source category; and where the thing stops and hands the call to a human because it isn't a factual question. Flag the steps that are judgment in a checklist costume.

  Then run it on three candidates for the same product: the rate limiter as a narrow pipe you're pouring through, the model as a well-read intern, and the version history as parallel universes. One of those I'm attached to and I expect your going to kill it — if so, say so plainly rather than softening it. Finish with what the procedure can't decide at all, and what would change your mind: which of your three verdicts is most likely wrong, and what consideration would flip it.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **Role:** Lead on conceptual docs at a dev-tools company.
      *   **Task:** Own vocabulary/framing analogies (overview, tooltips, errors, diagrams).
      *   **Constraints:** 5-6 decisions/quarter, ~1 day/decision, not a cognitive scientist, CTO signs off.
      *   **Problem:** High stakes in a "dumb way" (users infer unintended logic from analogies -> support tickets). Reviewers object that "all analogies are wrong" (unhelpful skepticism).
      *   **Theoretical Grounding:** Hofstadter/Sander (*Surfaces and Essences*). Analogy-making = categorization. Importing a source domain drags in its whole "naive theory." Categories can be enriched later.
      *   **Deliverable 1:** A procedure (checklist/questions in order) to evaluate candidate analogies.
          *   Must distinguish harmless misfits from dangerous entailments.
          *   Must check audience familiarity with the source category.
          *   Must flag where human judgment overrides the checklist.
          *   Must identify where the procedure stops and hands off to a human.
      *   **Deliverable 2:** Run the procedure on three specific candidates:
          1.  Rate limiter = Narrow pipe.
          2.  Model = Well-read intern.
          3.  Version history = Parallel universes.
      *   **Deliverable 3:** Be direct about killing an analogy the user likes.
      *   **Deliverable 4:** Identify the procedure's limits, which verdict is most likely wrong, and what would flip it.

  2.  **Develop the Procedure (The "Hofstadter/Sander Filter"):**

      *   *Core Principle:* Analogy isn't decoration; it's a categorization act. If you call $X$ a $Y$, you invite the user to apply the rules of $Y$ to $X$.
      *   *Step 1: Source Availability.* Does the user actually know the source domain? (If they don't know what a "pipe" is in a plumbing sense, the analogy fails).
      *   *Step 2: Essential Mapping.* What is the *core* function being explained? Does the source match this core?
      *   *Step 3: Naive Theory Import (The Danger Zone).* What are the implicit rules of the source? Which of these rules are *false* for the target?
      *   *Step 4: Entailment vs. Misfit.* Distinguish between "this detail doesn't match" (harmless) and "this rule implies an action" (dangerous).
      *   *Step 5: Enrichment Potential.* Can this analogy grow with the product, or does it box us in?
      *   *Step 6: The Human Handoff.* Where does data end and judgment begin?

      *Refining the "Harmless vs. Dangerous" distinction:* This is crucial. A harmless misfit is a surface feature (e.g., a pipe is metal, the rate limiter is code). A dangerous entailment is a causal rule (e.g., if I heat the pipe, flow increases -> if I pay more, rate limit increases?).
      *Refining the "Judgment in Checklist Costume":* I need to explicitly mark steps that look objective but require intuition.

  3.  **Run the Procedure on the Candidates:**

      *   **Candidate 1: Rate Limiter = Narrow Pipe.**
          *   *Source:* Plumbing/Fluid dynamics.
          *   *Target:* API request throttling.
          *   *Mapping:* Flow = Requests. Width = Limit. Pressure = Load?
          *   *Naive Theory:* If you push harder, it bursts? If you widen it, flow increases? Fluid is continuous; requests are discrete.
          *   *Danger:* Users might think they can "build pressure" (queue up) and release it later, or that the pipe "stores" requests.
          *   *Verdict:* Likely safe *if* constrained, but risky regarding queuing vs. dropping.
      *   **Candidate 2: Model = Well-read Intern.**
          *   *Source:* Human employee (Junior/Intern).
          *   *Target:* LLM/AI Model.
          *   *Mapping:* Knowledge base = Training data. Output = Work product.
          *   *Naive Theory:* Interns get tired, interns have intent, interns learn from *this* conversation permanently, interns understand context emotionally, interns can be fired/blamed.
          *   *Danger:* Anthropomorphism. Users might expect the model to "remember" them next session, or to "understand" sarcasm/intent beyond tokens. Security implications (prompt injection = "tricking" the intern).
          *   *Verdict:* High risk. Hofstadter would scream about "slippage" of concepts like 'understanding'.
      *   **Candidate 3: Version History = Parallel Universes.**
          *   *Source:* Sci-fi/Multiverse.
          *   *Target:* Git branches/State snapshots.
          *   *Mapping:* Branch = Universe. Commit = Divergence point.
          *   *Naive Theory:* Universes are independent. You can't travel between them easily. They exist simultaneously.
          *   *Danger:* Merging. In multiverse theory, universes usually don't merge back together cleanly. In Git, branches merge. Also, "parallel" implies simultaneous existence (storage cost implication?).
          *   *Verdict:* Poetic, but technically misleading regarding merging and lineage.

      *Selection for the "Kill":* The prompt says "One of those I'm attached to and I expect your going to kill it." Usually, "Well-read intern" is the most seductive and dangerous one in AI docs right now. It invites the most dangerous naive theories (intent, memory, sentience). I will target that one for the kill.

  4.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the Hofstadter/Sander premise. Analogy is categorization.
      *   **The Procedure:** Create the "Source-Target Entailment Audit."
          *   Make sure to flag the "Judgment in Checklist Costume" steps.
          *   Define the "Harmless Misfit" vs. "Actionable Entailment" test clearly.
      *   **The Evaluation:** Apply the audit to the three candidates.
          *   Be blunt on the "Intern."
      *   **The Meta-Analysis:** What can't the procedure decide? Which verdict is shaky?
          *   *Shaky Verdict:* The "Pipe." It's boring, but fluid dynamics are surprisingly counter-intuitive (backpressure vs. dropped packets).
          *   *Flip Condition:* Empirical data on support tickets regarding queuing behavior.

  5.  **Refining the Tone:**

      *   Professional, direct, slightly academic but practical (matching the user's "lead on conceptual docs" persona).
      *   Avoid softening the blow on the "Intern" analogy.
      *   Ensure the Hofstadter/Sander concepts (slippage, naive theory, categorization) are woven in, not just name-dropped.

  6.  **Self-Correction/Review during drafting:**

      *   *Check:* Did I explain *how* to tell a misfit from an entailment?
      *   *Correction:* I need a specific test for this. The "Therefore Test." If "It is a X, therefore [action]" makes sense to the user, it's an entailment. If "It is a X, but [detail] is different" is the reaction, it's a misfit.
      *   *Check:* Did I flag judgment steps?
      *   *Correction:* Use visual markers (e.g., **[JUDGMENT]**) in the procedure.
      *   *Check:* Did I address the "audience has the source category" requirement?
      *   *Correction:* Add a specific step for "Source Domain Fluency."
      *   *Check:* Did I identify where the procedure stops?
      *   *Correction:* Add a "Stop Rule" at the end of the procedure.

  7.  **Final Polish:** Ensure the distinction between "categorization" and "decoration" is clear. The user knows this, but the procedure must enforce it. (Proceed to generate output).

  *(Self-Correction on the "Intern" analogy)*: Wait, the prompt says "One of those I'm attached to." I shouldn't assume which one, but "Intern" is the most likely candidate for a lead to be attached to because it's human-centric and explains "intelligence" well. However, "Parallel Universes" is also very sticky. I will stick with "Intern" as the kill because it carries the highest cognitive risk regarding agency and memory, which fits the "support tickets from people who reasoned their way to a conclusion" problem best.

  *(Self-Correction on the "Pipe" analogy)*: Actually, "Pipe" is often used in Unix (`|`). Developers know pipes. But do they know plumbing pipes? The analogy says "narrow pipe you're pouring through." That implies plumbing. Developers know Unix pipes better. Unix pipes buffer. Plumbing pipes pressure. This ambiguity is a risk. I'll note this.

  *(Final Plan)*:
  1. Procedure: "The Entailment Audit."
