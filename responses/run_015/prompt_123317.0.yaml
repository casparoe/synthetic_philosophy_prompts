  9.  **Final Structure:**
      1.  Introduction: Validating the thesis's pedigree (Inevitabilism).
      2.  Fatal Defeaters: The Collapse of the Core/Packaging Distinction.
      3.  Fatal Defeaters: Path Dependence and Dead Ends.
      4.  Awkward Defeaters: The "Appropriate Stage" Problem (Mendel).
      5.  Absorbable Qualifications.
      6.  The Unfalsifiability Challenge (The "Packaging" Move).
      7.  Conclusion.

  10. (Reviewing against prompt): Did I address "modular conceptual components"? Yes. "Latent conceptual resource"? Yes. "Fatal vs Awkward"? Yes. "Unfalsifiability"? Yes.

