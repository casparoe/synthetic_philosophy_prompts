      *   *Conclusion:* Summarize the tension between structural realism and historical contingency.

  7.  **Refining the Arguments (Self-Correction during drafting):**

      *   *Correction:* I need to make sure I don't just say "contingency matters." I need to be specific about *epistemic* contingency.
      *   *Refinement on Calculus:* It's not just that Leibniz's notation was better. It's that the *ontology* of the infinitesimal was handled differently, affecting the rigorization in the 19th century (Cauchy/Weierstrass). If Newton's fluxions were structurally incapable of being rigorized without importing Leibnizian concepts, that's a fatal blow to the idea that they were "functionally equivalent."
      *   *Refinement on Darwin:* Wallace didn't believe in human mental evolution via natural selection. Darwin did. If this distinction is "core" to the theory's scope, then they didn't discover the *same* theory.
