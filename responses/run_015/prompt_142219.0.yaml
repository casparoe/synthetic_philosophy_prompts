answer: |-
  ### Brainstorming Failure Modes

  A theory of self-amendment fails if it lacks teeth or if it breaks under pressure. If it is too permissive—collapsing validity into efficacy—then any successful power grab is instantly legal. In your Coup case, the junta's amendments are valid in year one because they succeeded. This kills the drama; there is no constitutional crisis, only a transfer of power. The Ratchet becomes meaningless because a big enough majority can ignore it without legal consequence. The theory becomes a description of force, not law.

  Conversely, if the theory is too strict—demanding logical closure and infinite chains of authority—it breaks on the Unenacted Founding. If every rule needs a prior authorizing rule, the Instrument is void ab initio because the drafters lacked authority. The state legally does not exist. Similarly, a strict theory might say the Ratchet cannot be repealed because logic forbids a rule from allowing its own violation, forcing the polity into a suicide pact where it cannot adapt to survive. The theory becomes a logical trap that denies the reality of legal change. The sweet spot must distinguish between what the rules say, what the powers do, and what the system accepts, allowing for gaps where politics breathes.

  ### Requirements List for a Theory of Self-Amendment

  **1. The Validity/Efficacy Distinction (Non-Negotiable)**
  *   **Requirement:** The theory must distinguish between a rule being *valid* (authorized by prior rules) and *efficacious* (obeyed and enforced).
  *   **Case:** *The Coup that Becomes Law.*
  *   **Reasoning:** If validity equals efficacy, the Coup amendments are valid immediately, removing the crisis. If they are never valid, the courts lying about them makes no sense. The theory must allow for "invalid but accepted" or "invalid then retroactively validated."
  *   **Status:** Non-negotiable. Without this, you cannot have a crisis of legitimacy.

  **2. Capacity for Self-Reference (Non-Negotiable)**
  *   **Requirement:** The theory must allow a rule to apply to itself without generating a logical paradox that voids the rule.
  *   **Case:** *The Ratchet* and *Self-application.*
  *   **Reasoning:** If a rule cannot reference its own amendment procedure, Article 14 (the Ratchet) is void nonsense. The theory must permit a rule to say "this rule cannot be changed" without creating a logical explosion that invalidates the whole system.
  *   **Status:** Non-negotiable. Legal systems routinely do this; a theory that forbids it describes no real system.

  **3. Tolerance for Indeterminacy (Camp Preference)**
  *   **Requirement:** The theory must allow for situations where the text provides no determinate answer (a "gap") rather than forcing a tie-breaker.
  *   **Case:** *Mutual Entrenchment.*
  *   **Reasoning:** Formalist camps demand a tie-breaker (e.g., later article wins). Realist camps accept that the law runs out and politics takes over.
  *   **Status:** Camp Preference. You can choose either, but you cannot claim the text *always* provides an answer.

  **4. Acceptance Overrides Origin (Moral Demand/Philosophical Choice)**
  *   **Requirement:** The theory must treat long-standing acceptance as a source of validity, independent of the original authority chain.
  *   **Case:** *The Unenacted Founding.*
  *   **Reasoning:** This addresses the "infinite regress" problem. A theory demanding perfect origin chains voids most real governments.
  *   **Status:** Moral Demand wearing legal costume. This is the choice to value stability over strict legitimacy.

  **5. Continuity as Degree, Not Binary (Camp Preference)**
  *   **Requirement:** The theory must treat legal identity as a spectrum rather than a switch that flips from "Same System" to "New System."
  *   **Case:** *Continuity after Total Replacement.*
  *   **Reasoning:** There is no logical moment where the Concordance becomes "not the Concordance."
  *   **Status:** Camp Preference. Originalists will demand a binary break; Living Constitutionalists will demand continuity.

  ### Incompatible Desiderata

  **"All legal questions must have a determinate answer within the system"** vs. **"Successful revolutions can create valid law."**
  If you demand the system always has an answer (Formalism), then a Coup is either valid (because the system allowed it) or invalid (and remains so). You cannot account for the *transition* from invalid to valid without admitting the system lacked the answer during the transition. If you demand revolutions create law (Realism), you admit the prior system did not have the answer. You cannot have a closed logical system that also accounts for its own overthrow.

  ### Most Exclusionary Requirement

  **The Validity/Efficacy Distinction.**
  This knocks out Pure Legal Realism (law is just what courts do) and Pure Natural Law (law is just morality). It forces you into a Positivist framework where rules exist separately from their enforcement. It is the hardest constraint to maintain because it requires characters to argue about what is *right* versus what is *enforced*.

  ### Underdetermined Areas (Story Choices)

  *   **The Ratchet Repeal:** Logic does not dictate whether a Ratchet can be repealed by satisfying its own strictures. Some theories say yes (self-embracing sovereignty); some say no (self-limiting sovereignty). You can choose based on whether you want the majority to win or the past to win.
  *   **Mutual Entrenchment:** Whether Article 2 or Article 21 wins is not logically determined. You can invent a tie-breaker (e.g., specific overrides general) or leave it a gap that causes a crisis.
  *   **Continuity Threshold:** There is no fact of the matter on when the Instrument becomes "new." You can set this threshold for dramatic effect (e.g., the moment the water treaty is violated).

  ### Confidence and Uncertainty

  I am highly confident in the necessity of the Validity/Efficacy distinction for your purposes; without it, your crises dissolve. I am least sure about the **Mutual Entrenchment** case. Some theories argue that *lex posterior* (later law overrides earlier) is a logical necessity of law itself, not just a rule. If that is true, the "gap" I suggested might not exist in all theories, forcing a resolution rather than a crisis. I am guessing that a gap is permissible, but a strict formalist would disagree.

  \answer{Validity/Efficacy Distinction; Determinate Legal Answers vs. Revolutionary Validity}
