answer: |-
  You spelled "integrity" wrong in the prompt, but I knew exactly what you meant—Williams' objection is a classic bug report on utilitarianism. Here is the decision tree you asked for. It's designed to route your intuitions about the drowning-spouse case into specific philosophical positions without asking you to label yourself upfront.

  ### The Integrity Decision Tree

  **Root Case:** Your spouse is drowning. You can save them, or save two strangers. You save your spouse.

  **Node 1:** Should you have paused to calculate whether saving the strangers produced more overall welfare?
  *   **Yes** → Go to Node 2.
  *   **No** → Go to Node 3.

  **Node 2:** Can you maximize overall welfare by cultivating a disposition to *never* calculate in intimate moments? (The Indirect Utilitarian Check)
  *   **Yes** → **Leaf A: Smart Indirect Utilitarian**
  *   **No** → **Leaf B: Hard Act Utilitarian**

  **Node 3:** Are your "ground projects" (love, career, meaning) negotiable if impartial morality demands you sacrifice them?
  *   **Yes** → Go to Node 4.
  *   **No** → **Leaf C: Williams-Style Integrity**

  **Node 4:** To protect these projects, do you need preemptive moral lock-in (binding yourself in advance to ignore utility calculations later)?
  *   **Yes** → Go to Node 5.
  *   **No** → **Leaf D: Intuitive Particularist (Unnamed)**

  **Node 5:** Is this preemptive lock-in psychologically possible? (Can you actually bind your future judgment?)
  *   **Yes** → Go to Node 6.
  *   **No** → **Leaf E: Fatalistic Moderate (Unnamed)**

  **Node 6:** Is this lock-in a rational exercise of autonomy or just hidden rule-following?
  *   **Rational Autonomy** → **Leaf F: Virtue-Ethics Loyalty**
  *   **Hidden Rule-Following** → **Leaf G: Crypto-Utilitarian (Unnamed)**

  ---

  ### The Leaves (Positions & Awkward Commitments)

  *   **Leaf A: Smart Indirect Utilitarian**
      *   *Commitment:* You only maintain your marriage because having a disposition to love is socially efficient, not because the love itself is the ultimate point.
  *   **Leaf B: Hard Act Utilitarian**
      *   *Commitment:* You must admit you acted sub-optimally and should let your spouse drown next time if the math changes.
  *   **Leaf C: Williams-Style Integrity**
      *   *Commitment:* You have no moral defense if saving your spouse accidentally causes a catastrophe; you just have your identity.
  *   **Leaf D: Intuitive Particularist (Unnamed)**
      *   *Commitment:* You claim morality is context-dependent but can't explain why without sounding like you're making exceptions for yourself.
  *   **Leaf E: Fatalistic Moderate (Unnamed)**
      *   *Commitment:* You believe you *should* calculate, but you know you're too weak to do it, so you hope the situation never arises.
  *   **Leaf F: Virtue-Ethics Loyalty**
      *   *Commitment:* You might remain loyal even when the cost becomes genuinely monstrous, because character outweighs consequences.
  *   **Leaf G: Crypto-Utilitarian (Unnamed)**
      *   *Commitment:* You are lying to yourself about having integrity; you're just following a rule because you think it secretly maximizes utility.

  ---

  ### Indistinguishable Leaves
  **Leaf A (Smart Indirect Utilitarian)** and **Leaf F (Virtue-Ethics Loyalty)** are practically indistinguishable in production. Both output the same behavior ("Save the spouse, don't calculate"), and both justify ignoring the math. The only difference is the backend justification (efficiency vs. character), which you can't observe from the outside. If you meet someone who says "I just love my wife, I don't do math," you cannot tell if they are a secret utilitarian or a virtue ethicist.

  ### The Weakest Branch & The Flip
  The weakest link is **Node 6 (Lock-in Rationality)**. This branch assumes you can successfully "bind" your future self to ignore moral math without it just being a form of rigid rule-worship (Leaf G).

  **The Flip Argument:**
  If you accept that **moral judgment is non-delegable** (meaning you cannot rationally bind yourself to ignore moral truths later, just as you can't bind yourself to ignore logic), then Node 6 collapses. You cannot have "rational autonomy" to ignore morality; you can only have self-deception. If this argument holds, **Leaf F (Virtue-Ethics)** disappears. Anyone claiming to use lock-in is either a **Crypto-Utilitarian** (following a rule they think is good) or falls back to **Williams-Style Integrity** (where the lock-in isn't a rational choice, but just who they are). The tree loses its distinction between "rational binding" and "hidden rule-following."
