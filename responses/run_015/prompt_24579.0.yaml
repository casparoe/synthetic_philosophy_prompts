      *(Self-Correction during drafting)*: I need to be careful not to say the Philosopher is right that $\psi$-epistemic *is* true, but that he is right that PBR *doesn't rule it out* without PIP. The Grad Student claims PBR *settles it*. That is the stronger claim that is technically vulnerable.

      *(Refining the Mixed State point)*: The PBR theorem *does* imply constraints on mixed states if one assumes the pure state result holds and mixed states are mixtures of pure states, but there are specific no-go theorems for mixed states that are distinct. The Philosopher's point that "extending it... is a separate and messier matter" is accurate.

      *(Refining the Nonlocality point)*: The Grad Student equates violating PIP with "action at a distance." The Philosopher says that's rhetorical. The Philosopher is right. Violating PIP means the universe has global constraints on preparation, which is "holistic," but not necessarily "signaling" or "dynamic nonlocality" in the Bell sense.

