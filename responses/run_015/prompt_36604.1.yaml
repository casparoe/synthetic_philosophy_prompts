answer: |-
  ### The four moves, assessed in turn

  The metaphysician's ontological reductionism is technically coherent but axiologically inert. Identifying the item with server states correctly denies it substancehood in the Aristotelian sense, but the analogy to character death fails. Character death is a transient state reset within the game's logic; the item was a persistent unique identifier within the server's economy. While not a "concrete particular" like a trading card, it functions as a digital particular within the relevant normative system. If we accept that digital objects exist as functional entities within their environment, the deletion is a destruction of that functional particular, regardless of its physical supervenience base.

  The ethicist correctly pivots to value theory, identifying the harm as loss of labor, scarcity, and status. This aligns with Lockean labor-mixing accounts or simply welfare-based harms. The comparison to reputation is apt: reputation is non-physical yet its destruction constitutes a genuine harm. However, the ethicist risks conceding too much to the metaphysician's ontology by accepting the need to justify the value separately. The harm isn't just analogous to ordinary life; within the game's normative framework, it *is* ordinary life. The player's effort was real time spent, and the social standing was real recognition among peers. The metaphysical status of the token is irrelevant to the reality of the loss experienced.

  The metaphysician's appeal to revocability attempts to undermine the item's modal stability. Arguing that corporate fiat could duplicate the item suggests its uniqueness is contingent, thus less real. However, this conflates possibility with actuality. The item *was* unique until the rollback. The "shared pretense" analogy is weaker; players are not actors adopting a fiction, but participants in a consensual normative system. Grieving the loss is not grieving a character, but grieving the loss of invested time and social capital. The possibility of future duplication does not erase the historical fact of past scarcity. The metaphysician here conflates the stability of the institution with the reality of the institutional fact.

  The ethicist's bank balance analogy is the strongest move, functioning as a powerful *reductio ad absurdum*. Money is indeed institutional fact supported by ledger entries and trust; if database dependency negates reality, fiat currency is equally illusory. This exposes the metaphysician's criterion as overly restrictive, implying nothing institutional is real. However, the ethicist could sharpen this by distinguishing between *brute* facts and *institutional* facts (Searle). The loss is real because the institutional framework granting value was violated. The metaphysician must either accept that money isn't real or concede that virtual items, as institutional objects, sustain real value despite their digital substrate.

  ### What both are missing

  Both participants presuppose a univocal conception of "real," oscillating between physical substance and institutional fact without distinguishing them. They miss the crucial category of *normative reality*. The item exists as a node in a normative network of rights and entitlements, not merely as server states or social prestige. Furthermore, neither addresses the contractual framework governing the virtual world. The loss is arguably a breach of implicit contract regarding property rights within that sphere. By focusing on ontology versus value, they overlook the institutional mechanics that generate the value in the first place. The item is real insofar as the community and the code recognize it as such; the rollback violates the constitutive rules of that institution. The debate requires a philosophy of social ontology, not just metaphysics or ethics.

  ### Overall verdict

  The ethicist wins decisively. I endorse their claim that institutional value sustains real harm despite digital substrate. I reject the metaphysician's claim that mutability negates existence, as it proves too much against fiat currency. While virtual items lack physical persistence, this is axiologically irrelevant. The outcome hinges on an unarticulated distinction between *ontological independence* and *normative robustness*. The item lacks the former but possesses the latter. The harm is real because the institutional facts constituting the item's value were violated, rendering the metaphysician's substrate reductionism insufficient to dismiss the loss.
