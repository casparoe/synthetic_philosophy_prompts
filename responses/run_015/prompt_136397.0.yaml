      *   *Key Split:* Epistemic (ESR) vs. Ontic (OSR).
      *   *Key Problem:* The Newman Problem (triviality objection).
      *   *Key Physics:* Quantum Mechanics (entanglement, indistinguishability), General Relativity (spacetime points).
      *   *Key Challenge:* Causation, modality, and the "relata" problem (no relations without relata).

  3.  **Evaluate the "Biological Causation" Claim:**
