  8.  **Final Polish:** Ensure tone is analytical, rigorous, and respectful of the philosophical weight. Avoid preaching. Focus on logical consistency. (Self-correction: Make sure to explicitly address the "least costly revision" for *each* real tension, not just one global fix).

