      *   *Check:* Did I rank by severity?
      *   *Correction:* Ensure the hierarchy is clear. (c) is the problem node.
      *   *Check:* Du Bois Context. Du Bois *did* argue for propaganda. But he also valued truth. Commitment (c) uses the word "explicit." Du Bois's own examples (like the Sorrow Songs) were often ambiguous. This supports the tension between (c) and (d).
      *   *Refinement on (c):* The word "explicit" is the poison pill. The word "failure" is the hammer.
