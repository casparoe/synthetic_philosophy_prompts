prompt: |-
  hey — I'm a postdoc in political theory and I've ended up defending, slightly more strongly than I intended, a view about merit in selection (hiring, college admissions, promotion, prizes, the usual cases) that I now want someone to try to break, because I have a nagging feeling I've quietly built it so nothing could count against it. Roughly the view: merit is always role-relative — to deserve a position just is to be the candidate expected to best serve that role's constitutive aim — and from that I get a divide I quite like. Roles with a single, relatively uncontested aim (a commercial pilot, a bomb-disposal technician, arguably a research fellowship judged purely on output) admit a genuine meritocratic justification; roles whose aims are essentially contested (a university, a police force, a supreme court, a hospital board) don't, and there "the best qualified candidate" is doing something other than it advertises: either smuggling in one contested specification of the aims as if it were neutral, or laundering the advantages of whoever is already winning. I've bolted on two extra bits that I'm not sure are load-bearing: (i) the ratchet — merit criteria drift over time to match the traits of whoever currently succeeds, so merit-talk systematically stabilizes existing hierarchies; and (ii) aim-drift — because who gets selected partly determines what the role's aims become later on, the counterfactual "how well would this candidate serve the aims" isn't well defined even in principle, so the account can't be rescued just by better prediction. Please act as a political philosopher who works on desert and distributive justice and has read around the meritocracy literature, and think carefully: start by brainstorming maybe six to eight independent things that could count against this before you rank anything at all, and don't just give me the objections people standardly make against meritocracy — give me the ones that bite on my version specifically.

  What I want out of it: defeaters sorted from fatal to merely awkward, and for each one an honest note on whether I, as a committed defender, would concede it or whether I'd dismiss it as smuggling in a rival assumption. Include the uncomfortable categories — a case the view can't describe, a consequence I'm committed to that's unacceptable, a result showing the whole thing collapses into something I was trying to avoid (Rawlsian fair equality of opportunity? luck egalitarianism about effort and circumstance? some qualified-lottery proceduralism?) — and be explicit about whether that collapse is itself a defeat or just a redescription. Also tell me which of my two bolted-on bits the core actually needs, and whether dropping the ratchet saves everything else. And then, bluntly: has the move to "essentially contested aims" made the view unfalsifiable, and if it has, is that a real problem for a view of this kind or just what normative views are like? I'd definately rather hear the strongest version against me than a comforting one.

  Then run it on three cases I can't make up my mind about: military officer selection (arguably contested aims, yet the intuition that we must pick on merit is very strong there — a case where I might have to bite a bullet I don't want to bite), organ allocation (pretty clear-ish aim, and yet we resist pure efficiency scoring and add urgency, age, queue position — so is that a counterexample to my divide or a case where the aims were never as single as they looked?), and blind orchestral auditions (a case where tightening merit criteria famously changed who got in, which I want to claim as evidence for the ratchet and which I suspect someone can turn straight around on me). I'd be most moved by two kinds of thing: a role with genuinely contested aims where our merit-selection intuitions are rock solid, and any empirical finding that would actually discriminate — e.g., if criteria set under one contested specification of a role's aims still predicted performance well under rival specifications, or if qualified-lottery selection in contested-aim roles reliably degraded something measurable independent of the aims in dispute. No citations or reading list, you don't have web access anyway and I'll fill that in myself; I'm teaching a seminar on this next term and want to hand out something sharper than my own notes.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Postdoc in political theory. Knowledgeable, sophisticated, looking for rigorous critique, not intro-level summaries.
      *   **Topic:** A specific theory of merit in selection (hiring, admissions, etc.).
      *   **Core View:** Merit is role-relative (best serves constitutive aim).
      *   **The Divide:** Single/uncontested aims = genuine meritocracy possible. Essentially contested aims = "best qualified" is ideological smuggling or hierarchy laundering.
      *   **Bolt-ons:** (i) The Ratchet (criteria drift to match current winners), (ii) Aim-Drift (selection changes future aims, making counterfactuals undefined).
      *   **Task:** Act as a political philosopher specializing in desert/distributive justice. Brainstorm 6-8 independent objections specific to *this* view (not generic meritocracy critiques). Rank them (fatal to awkward). Assess concession vs. dismissal. Analyze the bolt-ons (load-bearing?). Address unfalsifiability. Apply to three cases (Military, Organ Allocation, Blind Auditions).
      *   **Tone:** Blunt, rigorous, philosophical, no fluff, no citations needed.
      *   **Goal:** Sharpen the view for a seminar, find the weak points.

  2.  **Deconstruct the Core View:**
      *   *Premise 1:* Merit = Fitness for Constitutive Aim.
      *   *Premise 2:* Aims are either Uncontested (functional/technical) or Essentially Contested (normative/political).
      *   *Conclusion 1:* Uncontested Aims $\rightarrow$ Meritocracy is coherent/justified.
      *   *Conclusion 2:* Contested Aims $\rightarrow$ Meritocracy is incoherent/ideological.
      *   *Mechanism:* Ratchet (criteria bias) + Aim-Drift (teleological instability).

  3.  **Brainstorming Objections (Targeting Specific Vulnerabilities):**
      *   *Idea 1: The "Uncontested" Category is Empty.* Even pilots have contested aims (safety vs. profit vs. speed). If *every* role has contested aims, the view collapses into general skepticism.
      *   *Idea 2: The "Contested" Category is Too Broad.* If *any* normative disagreement makes an aim contested, almost everything is contested. But we still need to select. Does the view imply we should just lottery everything in politics/law?
      *   *Idea 3: The Definition of "Constitutive Aim" is Circular.* Who decides the aim? If the selectors decide the aim, they can define merit to match themselves. The theory relies on an objective "constitutive aim" that might not exist independently of the selection process.
      *   *Idea 4: Aim-Drift Undermines the "Uncontested" Side Too.* If selecting a pilot changes what piloting *is* (e.g., automation), then the counterfactual is undefined there too. The divide collapses.
      *   *Idea 5: The "Smuggling" Charge is Self-Defeating.* The user claims contested merit-talk smuggles in a specific aim. But the user's theory *also* requires specifying an aim to judge merit. Isn't the user smuggling in *their* specification of the aim as the neutral one?
      *   *Idea 6: Procedural Justice vs. Teleological Justice.* Maybe merit isn't about aims at all, but about rights or entitlements. If I have a right to compete, "fitness for aim" is irrelevant. (Likely dismissible by user, but worth noting).
      *   *Idea 7: The Ratchet is Empirical, Not Conceptual.* The ratchet might be true often, but not necessarily. If we can fix the ratchet (blind auditions), does merit become valid again in contested roles? If yes, the core theory is wrong (it's not about contested aims, it's about bias).
      *   *Idea 8: Collapse into Luck Egalitarianism.* If aim-drift makes counterfactuals undefined, we can't judge fitness. So we must default to equality. But the user wants to keep merit for uncontested roles. This creates a unstable dualism.

  4.  **Selecting and Refining the Top 6-8:**
      1.  *The Vanishing Uncontested:* Even technical roles have normative trade-offs (Safety vs. Cost).
      2.  *The Normative Stalemate:* If aims are contested, the theory offers no selection procedure (Lottery? Power?). This is practically paralyzing.
      3.  *The Meta-Aim Problem:* Who defines the constitutive aim? If it's the institution, it's circular. If it's the theorist, it's paternalistic.
      4.  *Aim-Drift Contagion:* If aim-drift applies to contested roles, why not technical ones? (Collapses the divide).
      5.  *The Ratchet as Contingent:* If blind auditions work, the problem was bias, not contested aims. (Empirical defeater).
      6.  *The "Smuggling" Reflexivity:* The user's theory smuggles a specific view of "constitutive aims" as neutral.
      7.  *The Collapse to Proceduralism:* If counterfactuals are undefined, we are left with procedure only. Is that just a fancy lottery?
      8.  *The Moral Desert Decoupling:* Merit (fitness) $\neq$ Desert (moral worth). The view conflates instrumental fitness with normative justification.

  5.  **Ranking and Assessing Concession:**
      *   *Fatal:* Vanishing Uncontested, Aim-Drift Contagion, Reflexivity.
      *   *Awkward:* Normative Stalemate, Ratchet Contingency.
      *   *Concession Strategy:* User will likely dig in on the "constitutive aim" being objective (Aristotelian functionalism) to save the Uncontested category.

  6.  **Analyzing the Bolt-ons:**
      *   *Ratchet:* Empirical claim. Dropping it saves the theory from empirical falsification but leaves the conceptual "contested aims" problem.
      *   *Aim-Drift:* Conceptual claim. This is load-bearing. Without it, one could argue "we just need better prediction." With it, prediction is impossible.
      *   *Dependency:* Aim-drift makes the Ratchet inevitable.

  7.  **Unfalsifiability Check:**
      *   If every failure of meritocracy is explained by "contested aims" and every success by "uncontested aims," is it tautological?
      *   Yes, unless "contested" is defined independently of the selection outcome.
      *   Is this a problem? For a normative theory, maybe not. For a social scientific explanation, yes.

  8.  **Case Studies:**
      *   *Military Officer:* Aims are contested (Warfighting vs. Diplomacy vs. Political Loyalty). Yet we insist on merit. *Challenge:* User must say either (a) aims aren't contested here (hard to swallow) or (b) our intuition is wrong (hard to swallow).
      *   *Organ Allocation:* Aim seems single (Save lives/Quality Adjusted Life Years). But we use queues/urgency. *Challenge:* Shows "single aim" is a fiction, or that merit isn't the only value even with single aims.
      *   *Blind Auditions:* Criteria tightened $\rightarrow$ more women. *Challenge:* User says "Ratchet broken." Critic says "See? Merit works when bias removed." User needs to argue the *definition* of musical merit was still contested/shifted.

  9.  **Drafting the Response:**
      *   *Tone:* Peer-to-peer, rigorous, slightly adversarial but constructive.
      *   *Structure:*
          1.  Intro (acknowledging the sophistication).
          2.  The 8 Objections (Ranked).
          3.  Bolt-on Analysis.
          4.  Unfalsifiability Check.
          5.  Case Studies.
          6.  Empirical Discriminators.
      *   *Refinement:* Ensure I don't just repeat Rawls/Nozick. Keep it focused on the *internal* logic of the user's specific "Role-Relative/Contested Aim" framework. Make sure the "Aim-Drift" critique hits hard on the "Uncontested" side.

  10. **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "collapse" question? Yes, need to be explicit about whether collapsing to lottery/proceduralism is a defeat.
      *   *Check:* Did I address the "Ratchet" load-bearing question? Yes.
      *   *Check:* Is the Military case handled sharply? It's the strongest counter-intuition.
      *   *Check:* Ensure I don't provide citations.
      *   *Check:* Make sure the distinction between "Merit as Fitness" and "Merit as Desert" is clear, as that's a common trap.

  11. **Final Polish:** Ensure the voice sounds like a senior colleague tearing apart a draft for the sake of improvement. (e.g., "Here is where the architecture creaks," "You'll want to say X, but...")

  *(Self-Correction on the "Unfalsifiable" point)*: I need to be careful. Normative theories aren't falsifiable in the Popperian sense. The question is whether the *criteria for application* are circular. I should frame it as "circular application" rather than "scientific falsification."

  *(Self-Correction on Military)*: The user might argue military aims *are* uncontested (win wars). I need to push that "winning" is contested (attrition vs. maneuver vs. hearts and minds).

  *(Self-Correction on Organs)*: The user might say Organs aren't a "role." I need to point out the user included "prizes" and "allocation" implicitly in "selection." If organs are excluded, the scope is too narrow. I'll treat it as a "good allocation" problem analogous to role filling.

  Okay, ready to write.
answer: |-
  This is a sharp architecture. You've essentially built a neo-Aristotelian functionalism grafted onto a critical theory of ideology. The move to "constitutive aims" saves merit from the standard luck-egalitarian critique (by making it internal to the practice), and the "essentially contested" move saves you from having to justify merit in political/normative spheres where it looks oppressive.

  But you are right to worry about unfalsifiability. If every time merit works you say "uncontested aim" and every time it fails you say "contested aim," you have a taxonomy, not a theory.

  Here are eight objections, ranked from structural collapse to operational annoyance, tailored to your specific framework.

  ### The Objections (Ranked Fatal to Awkward)

  **1. The Vanishing Uncontested (Fatal)**
  *The Objection:* There are no roles with single, uncontested aims. Even the bomb-disposal technician has a trade-off between safety, speed, and cost of equipment. The commercial pilot balances safety, fuel efficiency, and schedule. If "uncontested" means "no normative trade-offs," the category is empty. If it means "dominant consensus," then consensus can be hegemonic (see your Ratchet).
  *Your Likely Move:* Concede that "uncontested" is an idealization but insist some roles are *functionally* constrained enough that the aim is objective (e.g., the bridge must not fall down).
  *Verdict:* **Fatal if you can't draw the line.** If the line is drawn by social consensus, the Ratchet swallows it. If drawn by physical necessity, you retreat to a narrow technocracy and lose the political theory bite.
  *Concession:* You must concede the "uncontested" category is vanishingly small, perhaps limited to pure physical tasks, rendering the "genuine meritocracy" zone negligible.

  **2. Aim-Drift Contagion (Fatal)**
  *The Objection:* You use Aim-Drift to undermine prediction in contested roles ("who gets selected determines what the role becomes"). But this applies equally to uncontested roles. Selecting AI researchers changes what "research" is. Selecting pilots changes aviation (automation). If the counterfactual "how well would they serve the aim" is undefined because the aim shifts upon selection, your *positive* account of merit (in uncontested roles) collapses too. You can't have it both ways.
  *Your Likely Move:* Argue that physical constraints limit drift in technical roles (physics doesn't care who the pilot is).
  *Verdict:* **Fatal.** Technology and social organization mediate even technical roles. If Aim-Drift is true, it is universally true.
  *Concession:* You would have to drop Aim-Drift as a *conceptual* truth and demote it to an *empirical tendency* that is stronger in contested roles.

  **3. The Meta-Aim Circularity (Fatal)**
  *The Objection:* Who identifies the "constitutive aim"? If it is the institution itself, they can define the aim to match their preferred candidates (smuggling). If it is *you* (the theorist) identifying the "true" aim against the institution's self-conception, you are engaging in the very paternalism you critique. You are asserting *your* specification of the university's aim is the neutral one, and the Dean's is the contested one.
  *Your Likely Move:* Appeal to a realist or naturalist account of social kinds (the aim is inherent to the practice, not the players).
  *Verdict:* **Fatal.** This makes your theory a substantive normative claim about what institutions *ought* to be, disguised as a conceptual analysis of what they *are*.
  *Concession:* You must admit your theory is normative, not analytic. You are arguing for a specific vision of the role, not discovering one.

  **4. The Ratchet is Contingent, Not Conceptual (Awkward)**
  *The Objection:* The Ratchet (criteria drift to match current winners) is an empirical claim about bias. Blind auditions broke the ratchet for orchestras. If the ratchet can be broken, then "merit" in contested roles *can* be neutralized, provided we fix the bias. This suggests the problem isn't the "contested aim," it's just "bias."
  *Your Likely Move:* Argue that even blind auditions select for a specific *conception* of musicality that is historically contingent.
  *Verdict:* **Awkward.** It forces you to argue that *any* criterion is biased, which pushes you toward radical skepticism. It suggests your core problem is power, not teleology.
  *Concession:* You'd dismiss this. You'd argue the *standard* of musicality remained contested even if the *process* was blind.

  **5. The Normative Stalemate (Awkward)**
  *The Objection:* If a role has contested aims, your view implies we cannot select on merit. What do we do instead? Lottery? Rotation? Power struggle? If you recommend a lottery, you've collapsed into proceduralism. If you recommend power struggle, you've abandoned normativity. If you recommend selecting for *one* aim, you admit meritocracy is possible but partial.
  *Your Likely Move:* Advocate for a qualified lottery or democratic determination of aims prior to selection.
  *Verdict:* **Awkward.** This shows your theory is incomplete. It tells us when *not* to use merit, but not what to do instead, unless you import a separate theory of democracy.
  *Concession:* You'd likely accept this. You're offering a critique of merit, not a full theory of justice.

  **6. The "Smuggling" Reflexivity (Awkward)**
  *The Objection:* You claim defenders of merit in contested roles "smuggle in one contested specification." But your theory smuggles in the specification that "merit is only valid when aims are uncontested." That is itself a contested normative claim about the value of efficiency vs. legitimacy.
  *Your Likely Move:* Deny this is smuggling; it's a conceptual clarification.
  *Verdict:* **Awkward.** It highlights that your "divide" is a political weapon, not a neutral map.
  *Concession:* Dismiss. You'll claim this is a feature, not a bug.

  **7. Collapse into Luck Egalitarianism (Merely Annoying)**
  *The Objection:* If Aim-Drift makes counterfactuals undefined, we can't judge fitness. If we can't judge fitness, we can't justify inequality based on it. We default to equality of outcome or opportunity. This looks like Luck Egalitarianism (inequalities only justified if not due to brute luck). But you wanted to avoid this.
  *Your Likely Move:* Argue that in uncontested roles, fitness *is* a relevant luck-independent factor.
  *Verdict:* **Merely Annoying.** It shows your view is a subset of a broader egalitarian critique, not a standalone alternative.
  *Concession:* Dismiss. You'll argue you are preserving a zone for legitimate inequality (the uncontested zone).

  **8. Merit vs. Desert Decoupling (Merely Annoying)**
  *The Objection:* You define merit as "fitness for aim." But colloquially, merit implies "desert" (moral worth). A candidate can be fit for a role (a ruthless lawyer) but not deserve it (morally). Your theory ignores the moral dimension of selection.
  *Your Likely Move:* Argue you are analyzing "qualification," not moral worth.
  *Verdict:* **Merely Annoying.** It limits the scope of your theory. It doesn't break it.
  *Concession:* Concede. You are talking about instrumental selection, not moral reward.

  ---

  ### Load-Bearing Analysis: The Bolt-Ons

  **The Ratchet:**
  *   **Load-Bearing?** No. The Ratchet is an empirical mechanism explaining *why* contested aims get locked in. You can drop it. If you drop it, your theory becomes: "Merit is valid for uncontested aims, invalid for contested aims." The Ratchet just explains the history.
  *   **Does dropping it save everything?** It saves you from empirical falsification (e.g., if we find a contested role where criteria *didn't* drift). But it weakens the explanatory power of *why* the contested zone is so oppressive.

  **Aim-Drift:**
  *   **Load-Bearing?** **Yes.** This is the engine. Without Aim-Drift, a critic says: "Okay, the aims are contested, but we can still pick the candidate who best serves *our* (the committee's) current aim." Aim-Drift is what makes the counterfactual "how well would they serve" undefined. It prevents the "better prediction" rescue.
  *   **Dependency:** Aim-Drift makes the Ratchet inevitable over time. If selection changes the aim, the criteria *must* drift to match the new aim-holders.

  **Recommendation:** Keep Aim-Drift as the conceptual core. Treat the Ratchet as the historical manifestation. If you drop Aim-Drift, your view collapses into standard "bias critique" meritocracy skepticism.

  ---

  ### The Unfalsifiability Question

  **Has the move to "essentially contested aims" made the view unfalsifiable?**
  Yes, functionally. Because "contested" is a predicate you apply based on whether you think meritocracy is justified there.
  *   *Scenario:* We find a university department where meritocratic selection works beautifully.
  *   *Your Out:* "Ah, then the aims there weren't essentially contested (perhaps it's a technical college)."
  *   *Scenario:* We find a pilot hiring process that is biased.
  *   *Your Out:* "Ah, then the aims were contested (profit vs. safety)."

  **Is this a real problem?**
  For a **social scientific** explanation: Yes, it's circular.
  For a **normative political theory**: No, this is standard. Rawls's "reflective equilibrium" is unfalsifiable in the same way. You are offering a lens for critique, not a predictive model.
  **However:** The danger is **political paralysis**. If every time someone proposes a meritocratic reform you can say "the aims are contested," you become a veto point, not a guide. You need a heuristic for *when* to treat aims as contested vs. uncontested that isn't just "when I feel like it."

  ---

  ### Case Study Run

  **1. Military Officer Selection**
  *   *The Tension:* Aims are clearly contested (Warfighting efficiency vs. Political Loyalty vs. Human Rights adherence vs. Diplomacy). Yet intuition says we *must* pick on merit.
  *   *Your View's Prediction:* Meritocracy is incoherent here. Selection is always political.
  *   *The Bullet:* You have to bite it. You must argue that "military merit" is always a laundering of the prevailing political order's values.
  *   *The Risk:* This alienates the intuition that a incompetent general gets people killed regardless of politics.
  *   *Refinement:* Distinguish **tactical** roles (uncontested: can they operate the radio?) from **strategic** roles (contested: what is the war for?). You can preserve merit for the lieutenant, deny it for the General. If you don't make this cut, the Military case breaks you.

  **2. Organ Allocation**
  *   *The Tension:* Aim looks single (maximize life/quality of life). But we use queues/urgency/age.
  *   *Your View's Prediction:* If the aim is truly single, merit (efficiency) should rule. The fact that it doesn't proves the aim is contested (Efficiency vs. Equity vs. Urgency).
  *   *The Trap:* This makes your view trivial. "Any time we don't pick the most efficient candidate, the aim was contested."
  *   *Refinement:* You need to argue that "Health" is essentially contested (Utilitarian QALYs vs. Egalitarian Access). The case supports you, but only if you admit that *medical* aims are normative, not biological.
  *   *Empirical Test:* If a system switches to pure QALY maximization and public outrage ensues, that confirms the aims are contested. (This happened in the UK with NICE guidelines).

  **3. Blind Orchestral Auditions**
  *   *The Tension:* Tightening criteria (blind screens) increased women hired.
  *   *Critic's View:* See? Merit works when bias is removed.
  *   *Your View:* The Ratchet was broken, but the *Aim* (what counts as "good sound") remained contested. The screen didn't fix the aim; it just hid the gender cue.
  *   *The Turn:* If the "sound" preferred by the orchestra changed *after* women were hired (e.g., less aggressive, more collaborative), that proves Aim-Drift.
  *   *Empirical Discriminator:* You need data on whether the *repertoire* or *style* of the orchestra shifted as the demographic shifted. If the music stayed the same but the players changed, the Critic wins (Merit was neutral). If the music changed, you win (Aim-Drift).

  ---

  ### What Would Actually Move You (The Discriminators)

  You asked for empirical findings that would discriminate. Here are two that would force a concession:

  1.  **The Cross-Specification Predictor:**
      *   *Finding:* In a contested-aim role (e.g., Police Chief), candidates selected under Specification A (Community Policing) perform *equally well* under Specification B (Crime Suppression) as candidates selected under B.
      *   *Implication:* If "fitness" transfers across contested aims, then there is a **core competency** independent of the aim. Your view collapses. Merit is real; the aims are just surface variations.
      *   *Your Defense:* You'd have to argue "performance" is also contested. (Hard to sustain if crime rates drop in both cases).

  2.  **The Lottery Degradation:**
      *   *Finding:* In a contested-aim role (e.g., University Dean), using a qualified lottery (among competent candidates) reliably produces worse outcomes *on all plausible specifications of the aim* compared to meritocratic selection.
      *   *Implication:* If merit selection outperforms lottery even when aims are contested, then "serving the aim" is possible despite contestation. Your Aim-Drift argument is empirically false.
      *   *Your Defense:* You'd argue "worse outcomes" is measured by the winners' standards. (Again, circular).

  ### Final Blunt Assessment

  You have built a very strong **critical** tool, but a weak **constructive** one.
  *   **Strength:** It devastates the claim that "meritocracy" is a neutral solution to political disagreement.
  *   **Weakness:** It relies on a distinction (Contested vs. Uncontested) that cannot be drawn neutrally.
  *   **The Collapse:** You are dangerously close to **Qualified-Lottery Proceduralism**. If Aim-Drift makes counterfactuals undefined in contested roles, and you admit uncontested roles are rare, you are left with lotteries for almost everything.
  *   **Is that a defeat?** Only if you think meritocracy is worth saving. If your goal is to dismantle meritocracy as a political justification, you have succeeded. If your goal is to tell us how to hire justly, you have punted.

  **Seminar Advice:** Don't defend the "Uncontested" zone too hard. It's your weak flank. Lean into the "Contested" critique. Argue that *most* high-stakes selection is political, and pretending it's technical is the real injustice. That's where the political theory payoff is.
