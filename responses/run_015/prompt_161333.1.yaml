  You should give up step (3).

  Step (3) assumes a specific, naive mathematical model for how higher-order evidence combines with first-order evidence: simple multiplication. That's the engine driving the regress. In proper Bayesian updating, you don't multiply your credence in a conclusion by your credence in your reliability. Instead, you conditionalize on the total evidence, where your fallibility acts as a parameter affecting the likelihood of the evidence, not a separate multiplier.

  **The Cost:**
  You lose the intuitive simplicity of the "discounting" heuristic. You can't just say, "I'm 90% reliable, so I take 90% of my confidence." You have to do the harder work of integrating the reliability data into your probability model directly. It requires treating your fallibility as background information about your cognitive process, not as a new premise to be multiplied.

  **What's Left of the Staircase:**
  Nothing. Once you fix the math in (3), the regress in (4) and (5) loses its fuel. You don't generate a new proposition ("I am reliable") that needs its own reliability check; you simply update your credence in the original conclusion based on all available evidence, including the fact that you're fallible. The staircase collapses into a single floor: a coherent, stable credence that reflects your fallibility without vanishing to zero.
