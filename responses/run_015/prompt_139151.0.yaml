      *   The "Sampling Mechanism": In GTP, the Allies captured tanks randomly. In DA, "I" am not randomly selected from all humans who will ever live in a physical sense. I am *necessarily* observing from a specific point in time. This is where the anthropic principle creeps in, whether acknowledged or not.
      *   *Key Counter-argument:* The "Self-Indication Assumption" (SIA). If there are more humans, there are more "slots" for me to exist. Being born at rank 100 billion is more likely in a universe with 100 trillion humans than one with 2 trillion, simply because there are more observers. This cancels out the DA. (Need to explain this simply).

