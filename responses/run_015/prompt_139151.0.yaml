  Context: I'm a retired solid-state physicist who's only started reading philosophy properly in the last couple of years, so please answer in British English and go easy on the jargon.

  The doomsday argument looks to me like nothing more than the German tank problem wearing a hat. Take my birth rank — I'm somewhere around the hundred-billionth human — as a serial number drawn uniformly at random from everyone who will ever live, and the standard estimator gives you a factor-of-twenty-ish upper bound on the total: two trillion at the outside, which at anything like present growth rates puts us within a couple of centuries of the end. What I like about this framing is that it makes the whole thing an ordinary piece of frequentist statistics with a known sampling mechanism, so it doesn't rest on any contentious anthropic assumption, and it shouldn't matter much where exactly I draw the boundaries of the reference class, since all that goes in is my rank and not who else is in the class.

  Where am I going wrong? The bit I keep coming back to: surely heads is the wrong unit anyway — if people start living for centuries, or if most future minds turn out not to be biological humans at all, counting individuals seems to loose its grip entirely, and I can't tell whether that's a genuine objection or just me changing the subject. I'd apprecate someone setting me straight on both points.
