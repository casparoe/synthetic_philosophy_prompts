answer: |-
  **Essay Question**

  Deflationists maintain that truth is not a substantive property capable of playing a role in scientific explanation. However, scientific practice frequently ranks deliberately false models—those employing known idealizations—as 'closer to the truth' than their predecessors, citing this proximity to explain empirical progress. Analyze whether a deflationist can consistently accommodate this intuition of graded truth-likeness without undermining their core thesis. Specifically, assess whether invoking truth-likeness to explain scientific success inevitably smuggles in a correspondence notion of truth, thereby rendering the deflationary position circular or inconsistent.

  ***

  **Model Answer**

  Deflationary theories of truth assert that the concept of truth does not denote a substantive property with a hidden nature waiting to be analyzed. Instead, truth is exhausted by its logical function, typically captured by disquotational principles. A central and non-negotiable commitment of deflationism is that truth cannot play a robust explanatory role in metaphysics or natural science. If truth is merely a device for semantic ascent or generalization, it lacks the causal weight to explain why certain theories succeed where others fail. This creates a significant tension when confronting scientific realism, specifically regarding the progress of science through idealized models.

  Scientific practice frequently involves models known to be strictly false, such as frictionless planes in physics or ideal gases in thermodynamics. Despite their literal falsity, scientists rank these models as improvements over previous iterations, claiming they are closer to the truth. Scientific realists argue that this verisimilitude explains scientific success: theories work approximately because they latched onto the structure of reality. For the deflationist, this presents a profound dilemma. To accommodate the intuition that models can be ranked by truth-likeness, the deflationist must make sense of "closeness" without invoking a substantive relation between theory and world.

  One deflationary strategy is to reduce truth-likeness to logical strength or predictive accuracy. On this view, Model A is closer to the truth than Model B if A entails more true observational statements. However, this faces the problem of known falsity. If both models are false, they inevitably entail false statements. Merely counting true consequences ignores the structural errors that idealizations introduce. Furthermore, reducing truth-likeness to utility collapses the distinction between being true and being useful, which contradicts the realist intuition the deflationist is trying to accommodate. If the goal is to save the intuition that science tracks reality, utility is insufficient.

  The deeper issue lies in the explanatory role assigned to truth. If the deflationist invokes truth-likeness to explain why science progresses, they are assigning truth an explanatory power they explicitly deny. To say a model succeeded because it was closer to the truth implies that truth, or the gradient thereof, is a property that interacts with empirical success. This violates the deflationary constraint that truth is not a causal-explanatory property. By using truth-likeness as the explanans for scientific progress, the deflationist treats truth as a substantive feature of the world that theories can approximate, which is precisely what minimalism rejects.

  Moreover, assessing "closeness" risks smuggling in a correspondence notion. To measure the distance between a model and the truth, one must have access to the truth to serve as the metric. This presupposes a substantive relation of correspondence between representations and mind-independent reality. If the deflationist denies that truth consists in such a correspondence, they lack the metaphysical grounding to measure verisimilitude. Invoking verisimilitude to explain success while denying the substantive nature of truth creates a circularity: the explanation relies on a robust notion of truth-tracking that the theory claims is illusory. The deflationist attempts to use a concept that derives its meaning from a substantive theory of truth to support a theory that denies substantiveness.

  Consequently, a consistent deflationist faces a stark choice. They must either abandon the claim that truth-likeness explains scientific success, attributing progress merely to empirical adequacy, or concede that truth plays a substantive role after all. Accommodating the realist intuition regarding idealized models typically requires admitting that truth is a substantive property capable of grounding comparisons between false theories and the world. Therefore, invoking graded truth-likeness to explain progress undermines deflationism by reintroducing the very correspondence framework it seeks to eliminate. The deflationist cannot consistently deny truth is explanatory while using truth-likeness to explain scientific achievement without falling into circularity.

  ***

  **Marking Scheme (Total: 25 Marks)**

  **Essential Moves for Full Marks**

  1.  **Articulate the Deflationary Constraint (5 marks):** Clearly state that deflationism denies truth is a substantive property and explicitly rejects its role in causal or scientific explanation.
  2.  **Describe the Scientific Challenge (5 marks):** Accurately explain the problem of idealized models (known falsehoods) and the realist intuition that progress is explained by being "closer to the truth."
  3.  **Evaluate Deflationary Accommodations (5 marks):** Analyze attempts to define truth-likeness deflationarily (e.g., via logical strength or utility) and explain why these fail to capture the realist intuition regarding structural progress.
  4.  **Identify the Circularity Risk (5 marks):** Explicitly argue that using truth-likeness as an explanation smuggles in a correspondence notion (requiring a metric against reality) and contradicts the non-explanatory thesis, creating circularity.
  5.  **Conclude on Consistency (5 marks):** Provide a reasoned judgment on whether deflationism can remain consistent while accommodating the intuition (typically concluding it cannot without concession).

  **Grading Distinctions**

  *   **A-Grade (20–25 marks):** The response explicitly identifies the circularity risk in using truth-likeness to explain scientific success. It demonstrates that measuring "distance" from truth presupposes the substantive reality (correspondence) that deflationism denies, thereby showing why the explanation undermines the theory.
  *   **B-Grade (15–19 marks):** The response opposes deflationism to correspondence theory generally but fails to pinpoint the specific circularity involved in the *explanatory* use of truth-likeness. It may argue that deflationism is simply incompatible with realism without analyzing the mechanism of the inconsistency.
  *   **C-Grade (10–14 marks):** The response summarizes deflationary theories (e.g., Horwich or Ramsey) without engaging deeply with the specific problem of idealized models or the explanatory constraint.
  *   **D-Grade (0–9 marks):** The response fails to address the prompt, contains significant philosophical errors, or relies solely on reciting the disquotational schema.

  **Specific Misconception Note**
  Candidates often lose marks on the **Circularity Risk (Move 4)** by assuming that defining verisimilitude purely syntactically (e.g., via logical consequence) avoids metaphysical commitment. Full marks require recognizing that syntactic definitions cannot measure "distance" from a mind-independent world without implicitly assuming the substantive correspondence relation they aim to avoid.
