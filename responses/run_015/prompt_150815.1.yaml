prompt: |-
  You're a professional philosopher of mind who knows panpsychism inside-out but can't search the web, so don't cite papers — just reason from first principles. Please think carefully and start with a quick brainstorm: what minimal properties do micro-subjects need?

  I want you to construct a thought experiment to specs. Here's the niche idea I'm injecting: the 'resonant lattice' scenario. Imagine a biologically plausible neural mesh (not sci-fi, no perfect predictors) of relay nodes, each hosting a micro-subject with only a bare tonal flicker — no concepts, no self-model. The mesh can be configured two ways: a linear cascade A→B→C, or a closed resonant loop A↔B↔C↔A. Both setups process identical sensory input and produce identical behavorial reports. In the cascade, hierarchical binding lets the panpsychist sum or integrate the micro-qualities into a unified macro-field. In the loop, circular dependency blocks linear aggregation of subjects, yet the system still reports one unified experience.

  Build the scenario in one realistic paragraph (no zombies, no demons). Then do teh check: specifiy the belief about macro-consciousness for each wiring, the combination method used, the relevant nearby configurations, and exactly why the loop undermines the singular-subject claim without touching the quality-combination claim. Tell me which topological feature does the work. Then say what a panpsychist defender would reply — likely that macro-subjects never existed anyway — and explain whether removing the loop collapses the case back into the standard combination problem.

  Keep it focused, no bibliographies.
