answer: |-
  **Eulogy for Dr. Miriam Ashdown**

  Thank you for coming. Looking around this hall, I see the geometry of her life: the colleagues who debated her, the students who listened, the neighbors who borrowed her trowel, and her family, who loved her without needing to understand her footnotes. We are here in a rented room, on a Saturday morning, because Miriam Ashdown died. That is a fact. It is the kind of fact she respected.

  She left a note for this occasion. It was brief, typical of her later years. It said: *Don't tell them where I am. Tell them what I was doing.*

  That instruction is harder to follow than it looks. When someone dies, we want to place them. We want to say they are in a better place, or that they are gone forever, or that they live on in our hearts. Miriam spent thirty-eight years teaching us why those placements don't hold up. She taught Buddhist philosophy, specifically the Middle Way, but she didn't just teach it; she inhabited it. She understood that *śūnyatā*, or emptiness, isn't a dark void where things disappear. It is the open space that allows things to happen. Because things are not fixed solid, they can change, they can interact, and they can work.

  So, where is Miriam? I don't know. And neither did she, in the way we usually mean. But what was she doing? That, we can see.

  She was arguing. Not to win, but to clear the ground. I remember a meeting with the zoning board about the community garden. The board wanted to classify the compost bins as permanent structures. Miriam talked for forty-five minutes. She didn't appeal to emotion. She showed them that their own definitions contradicted their own bylaws. She handed them back the consequences of their own rules. She won the argument, the bins stayed, and the tomatoes grew. That was her method. She never left a position on the table for you to attack, because she wasn't defending a fortress. She was just showing you the structure of your own house.

  To her son Daniel, and to others here who look for evidence rather than faith: Miriam believed in cause and effect. She believed that actions have consequences that ripple forward long after the actor is gone. You don't need a soul to have an impact. You don't need an afterlife to leave a legacy. The garden is still growing. The students are still thinking. The arguments are still happening. That is not magic. That is mechanics. Her causes are still producing effects. That is a truth any engineer can respect.

  To her sister Padma, and to the students who practiced with her: Miriam knew that love is a verb. She knew that wishing someone well is a form of work. She respected the rituals that bind us to each other, even when she wouldn't commit to the metaphysics behind them. She understood that when we offer something to someone we have lost, we are not necessarily sending a package to a distant address. We are changing ourselves here, in the present, to align with the best of what they were.

  And to her rival, the scholar who traveled far to be here: You disagreed with her for twenty years. She would have wanted you to keep disagreeing. She would have hated this hymn, by the way. She thought most funeral music was too certain. But she would be pleased to see that the conversation hasn't stopped.

  There is a temptation, in a moment like this, to say that she is now beyond words, or that she is both here and not here, or that she has entered some mysterious state we cannot name. Miriam would have called that the "velvet trap." It sounds warm, but it's just another idea we cling to because we are afraid of the cold air. She didn't want comfort that required us to lie. She wanted us to see things as they are.

  She is dead. We are alive. The space between us is real. But so is the connection.

  She taught us that we don't need to know where a river goes after it leaves the map to know that it watered the fields. We don't need to solve the puzzle of her absence to honor the work of her presence. She gave us everything she had, which was to say, she gave us nothing of her own to hold onto, only our own minds returned to us, clearer than before.

  In a few moments, Padma will offer a dedication of *dāna*, or generosity, in Miriam's name. It is a gift. It fits. Miriam spent her life giving us the tools to let go.

  So, let us not ask where she is. Let us ask what she was doing. She was gardening. She was teaching. She was arguing with the zoning board. She was loving her son. She was refusing to lie about the nature of things.

  If you want to honor her, don't look up. Look around. Fix something that is broken. Plant something that will outlast you. Argue for the tomatoes. And when someone asks you where you stand, make sure you know why you're standing there.

  Thank you.

  ***

  **Private Note for the Speaker**

  **1. The Avoidance of the Four Corners (Catuṣkoṭi)**
  *   **Where:** In the paragraph beginning "So, where is Miriam?" and the closing ("She is dead. We are alive.").
  *   **The Move:** I explicitly refuse to assert she exists (afterlife), does not exist (annihilationism), both, or neither (mystical ineffability). I shift the predicate from *being* to *doing*.
  *   **Careless Alternative:** A standard eulogy would say, "She is in a better place" (Exists), "She is gone from us but never forgotten" (Does not exist/Both), or "She has transcended life and death" (Neither).
  *   **Why:** Miriam's note ("Don't tell them where I am") and her Madhyamaka view forbid positing a status for the liberated/deceased. The speech validates the conventional truth of death ("She is dead") without metaphysical speculation on the survivor.

  **2. Refusing the Velvet Fifth Corner**
  *   **Where:** The paragraph beginning "There is a temptation..."
  *   **The Move:** I explicitly name and reject the comfort of ineffability ("beyond words," "both here and not here"). I frame this comfort as a "trap" or "lying," rather than a spiritual truth.
  *   **Careless Alternative:** Saying, "She is now beyond our understanding," or "She lives on in the spirit of this room." This treats emptiness as a substantive, warm presence (reification of śūnyatā).
  *   **Why:** Miriam regarded this as the one error the fourfold negation cannot cure. The speech must offer comfort through *clarity* and *continuity of action*, not through metaphysical vagueness.

  **3. Argument as Repayment (Prasaṅga)**
  *   **Where:** The description of the zoning board argument ("She handed them back the consequences of their own rules") and the line about her giving us "nothing of her own to hold onto, only our own minds returned to us."
  *   **The Move:** This describes her method (*prasaṅga* or consequentialism) without using the Sanskrit. It frames her life as returning consequences to others rather than depositing new views.
  *   **Careless Alternative:** Saying, "She taught us the truth," or "She left us her wisdom." This implies she possessed and transferred inherent views (*svabhāva*).
  *   **Why:** To honor her philosophical discipline. She didn't leave a doctrine; she left a method of inquiry. The "philosopher's moment" is the line about leaving nothing on the table; laypeople hear "selflessness," philosophers hear "no thesis (*pratijñā*) asserted."
