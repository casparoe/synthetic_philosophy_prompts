      *   *Point 2: Conflation.* Maya conflates conditions for *appropriate resentment* with *moral responsibility*.
      *   *Claim:* Strawson ties them together.
      *   *Critique:* Leo is right that Strawson ties them, *but* Leo might be too quick to dismiss the corporate case. If we *do* feel resentment (and we do), does that mean our practices are confused, or that Strawson's description is incomplete?
      *   *Weakness:* Dismissing corporate resentment as "metaphorical" might ignore the reality of modern moral life. We *do* hold collectives responsible. Is Strawson's framework too individualistic?

  5.  **Synthesize and Structure the Response:**
      *   **Introduction:** Acknowledge the sophistication of the debate. It's a genuine philosophical tension (individualism vs. structuralism in responsibility).
