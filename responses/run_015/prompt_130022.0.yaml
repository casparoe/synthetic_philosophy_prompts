      *   *Claim:* If resentment is appropriate here, it tracks outcomes/control, not quality of will.
      *   *Critique:* Is resentment toward a corporation *really* a Strawsonian reactive attitude? Or is it a modified, political, or legal form of accountability? Strawson focuses on *interpersonal* relationships. Corporations aren't persons in the psychological sense.
      *   *Point 2: Distributed Opacity.* Analogy to Strawson's "objective attitude." If we take the objective attitude toward the mentally ill because their will is opaque, shouldn't we do so for distributed agency?
      *   *Claim:* This implies we need "institutional transparency" for responsibility, which adds a condition Strawson didn't intend (undermining naturalism).
      *   *Critique:* This is a strong challenge. It pushes Strawson's framework into social ontology. If the *structure* prevents the *quality of will* from being legible, does the reactive attitude lose its grip?
      *   *Weakness:* She might be conflating *moral* responsibility (Strawson's focus) with *causal* or *legal* accountability. Also, she claims this sneaks libertarianism back in (control), but "transparency" isn't necessarily "libertarian free will."

  4.  **Evaluate Leo's Argument:**
      *   *Point 1: Second-Personal Address.* Reactive attitudes need a specific addressee with a discernible will.
      *   *Claim:* Resenting a corporation is metaphorical (like mad at rain).
