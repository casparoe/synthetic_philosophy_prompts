      *   **Leo's Argument:** Reactive attitudes are second-personal and require a discernible addressee. Resenting a corporation is metaphorical (like being mad at rain). Maya is conflating conditions for *appropriate resentment* with conditions for *moral responsibility*.
      *   **Task:** Analyze the exchange move-by-move, identify strengths/weaknesses in both arguments, specifically address the coherence of "distributed opacity," and avoid simply declaring a winner.

  2.  **Deconstruct Strawson's Core Thesis (Mental Sandbox):**
      *   Strawson argues against the pessimist (determinism rules out responsibility) and the optimist (compatibilism fixes it).
      *   His move: Responsibility is embedded in our natural human practices of holding each other accountable via *reactive attitudes* (resentment, gratitude, guilt, indignation).
      *   These attitudes respond to the *quality of will* (goodwill, ill will, indifference) of others toward us.
      *   Exemptions: We suspend reactive attitudes if someone is an "objective" case (child, mentally ill, under extreme stress). This isn't because determinism is true, but because participation in interpersonal relationships is impossible/impaired.
      *   Key Point: It's not about metaphysical free will; it's about the viability of interpersonal relationships.

  3.  **Evaluate Maya's Argument:**
