answer: |-
  The map of the Blackwood Valley was spread across the community hall table, weighted down by mugs of lukewarm coffee and a heavy stone ashtray. It was a beautiful map, colored in optimistic greens and blues, with a bold red line indicating the proposed crest of the hydroelectric dam.

  Elias Thorne traced the red line with a calloused finger. It stopped just three feet below the lowest point of his orchard.

  "It's the expected value, Elias," Sarah said. She was the project lead for Apex Energy, wearing a blazer that cost more than Elias's tractor. She wasn't cruel; she was tired. She had been in Blackwood for three weeks, trying to convince the town that the future was a straight line going up. "Look at the column. With the dam, the valley's average income rises by forty percent. Your orchard gets better irrigation access in dry years. The town gets cheap power. On average, everyone wins."

  Elias looked up. He was sixty, with a face like dried leather and eyes that had watched too many seasons turn. "I don't live in the average, Ms. Vance."

  "It's a statistical certainty," she corrected gently. "Ninety percent chance the water stays below the line. Ten percent chance of a heavy runoff year where the reservoir breaches the buffer."

  "And in that ten percent?"

  "The water comes over the bank," Sarah said. "It floods the low-lying acres. Yours are the lowest."

  "It's not just the acres," Elias said. "It's the trees. These are Gravensteins. My grandfather planted them. If they sit in water for three weeks, the roots rot. The soil salinizes. I don't lose a year's income. I lose the next thirty years. I lose the farm."

  Sarah sighed and clicked her pen. "We know that's the risk. That's why we're offering the signing bonus. It accounts for the risk."

  "It accounts for the *math*," Elias said. "It doesn't account for the ruin. You're asking me to take a bet where I win a new truck, or I lose my home. You win a power plant either way."

  "We can structure it differently," Sarah said. She saw the stalemate in his eyes. She had met men like Elias before. They weren't stubborn; they were solvent in a way corporations weren't. They couldn't absorb a total loss. "What if we make it safe? What if we guarantee you?"

  Elias leaned back. "How?"

  "Insurance," Sarah said. She pulled a laptop closer. "Apex carries a liability policy. We can write a clause into the contract. If the water breaches the buffer, we don't just pay for the crop loss. We buy the farm. At pre-development market value, plus the net present value of the next thirty years of yield. You walk away whole. No matter what the river does."

  Elias watched her type. "And that makes it safe?"

  "Safe for you," she said. "A Safe Pareto Improvement. That's the term my bosses use. No one ends up worse off than they started, in any scenario. If the dam works, you're richer. If the dam floods you, you're paid out and you're rich. You never lose."

  "Do it," Elias said.

  Sarah stopped typing. She looked at the screen, then at the map, then back at the screen. The hum of the fluorescent lights seemed to grow louder in the silence of the hall. The other villagers, who had been murmuring about new roofs and school repairs, went quiet. They knew that look. It was the look of a calculation turning red.

  "There's a problem," Sarah said softly.

  "The premium?" Elias asked.

  "The risk loading," she said. She turned the laptop so he could see the spreadsheet. It was a wall of gray cells, but the bottom line was bolded in red. "To make this guarantee binding, Apex has to treat the payout as a probable liability, not a contingency. Because the risk is systemic—it's the whole valley flooding—we can't diversify it. We have to buy reinsurance from the global market to cover our exposure to you."

  She tapped the number. "The cost of that insurance, amortized over the life of the project, is six million dollars."

  Elias didn't know what six million dollars looked like in a spreadsheet, but he knew what it looked like in the valley. "That's more than the profit."

  "It eats the margin," Sarah said. "If we insure you fully, the project's return on investment drops below our hurdle rate. The shareholders won't approve it. The company ends up worse off than if they just built the plant in the next county."

  She looked at him, helpless. "Do you see the trap? If you take the risk, the deal works, but you might lose your life's work. If I take the risk, the deal breaks, and the town stays poor. The only way to make you safe is to make the project unviable."

  Elias looked at the map again. The red line seemed to pulse. He thought about the economics of it. It felt like a magic trick. A deal that made everyone richer *on paper* vanished the moment you tried to make it real for everyone *in person*.

  "So," Elias said. "The wealth is only there if someone is willing to be poor?"

  Sarah didn't answer. She didn't have to. The efficiency of the dam relied on the inefficiency of Elias's potential ruin. The surplus value existed only because the cost of the disaster wasn't being fully paid for by the people profiting from the risk. It was being externalized onto a man who couldn't afford to carry it.

  "If I sign," Elias said, "I am the subsidy."

  Sarah closed the laptop. "I can't ask you to do that."

  "You didn't ask," Elias said. "The math did."

  He stood up. His knees popped. He walked to the window and looked out at the valley. The river was low today, a silver ribbon winding through the green. It looked peaceful. It looked like a snake waiting to strike.

  Behind him, the villagers were whispering. They wanted the money. They wanted the progress. They looked at Elias not with anger, but with a kind of fearful pity. They knew that if he signed, they all gained. If he didn't, they all stayed the same. But they also knew that if he signed and the water came, they would watch him drown while collecting their checks.

  Elias turned back to the table. He picked up his hat.

  "I can't sign," he said.

  "I know," Sarah said. She began to pack her papers. She moved slowly, as if mourning the loss of the future she had drawn on the map. "I'm sorry, Elias."

  "Don't be," he said. "You balanced the books. That's your job. I keep the farm. That's mine."

  "We could have been richer," a voice said from the back. One of the younger farmers, debt up to his ears. "On average."

  Elias looked at the young man. "There's no such thing as 'on average' when you're underwater, boy. You're either breathing, or you're not."

  He walked out of the community hall into the cool afternoon air. The dam wouldn't be built. The valley would remain as it was: modest, struggling, and dry. The economic surplus that had hovered over the town like a mirage evaporated, leaving only the dust and the trees.

  Elias walked down to the orchard. He put his hand on the rough bark of an old Gravenstein tree. It was solid. It was here. It wasn't a probability.

  He knew the town would resent him for a while. They would say he was stubborn, that he stood in the way of progress. They wouldn't understand that he hadn't said no to the money. He had said no to the gamble. He had refused to let his life be a line item in a column where the total added up to profit only if he was willing to be the zero.

  The river flowed on, indifferent to the math. Elias sat on the roots of the tree and watched the water move. It was slow, and it was certain, and it did not care about averages.
