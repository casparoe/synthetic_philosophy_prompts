  *Title Idea:* The Actuarial Table, The Flood Plain, The Margin of Safety. Let's go with *The Margin of Safety*.

  *Opening:* Start with the map.
  *Middle:* The negotiation.
  *End:* The handshake that doesn't happen.

  *Key line to include:* "You're asking me to bet my father's farm on your coin toss."

  *Key economic realization:* The cost of certainty is higher than the value of the gamble.

