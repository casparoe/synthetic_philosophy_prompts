answer: |-
  You are hitting on one of the most sophisticated tensions in International Relations theory and cognitive science. You're essentially asking why policymakers rely on heuristics that fail basic epistemic tests, and why the discipline sometimes codifies those heuristics as models.

  Your intuition is correct: if you treat historical analogies as data points for Bayesian updating, Munich and Vietnam should indeed create a prior distribution so wide it's useless. But that isn't how analogical reasoning works in practice. It isn't a calculation; it's a **coordination technology.**

  Here is the breakdown of why your "net zero" logic doesn't apply in the real world, why the Bayesian framing is the wrong tool for the job, and why textbooks keep selling the Thucydides Trap.

  ### 1. Analogies are not Bayesian Updates; they are Framing Devices
  You asked if the mistake is treating analogies as Bayesian updates instead of structural mappings. It's actually deeper than that: **Policymakers rarely use analogies to update beliefs; they use them to justify pre-existing preferences.**

  *   **Bayesian Update:** Requires objective likelihoods ($P(Evidence|Hypothesis)$). It assumes you are trying to find the truth.
  *   **Analogical Reasoning in Policy:** Is usually **motivated reasoning**. A hawk looks at a crisis and retrieves "Munich" because it validates intervention. A dove looks at the same crisis and retrieves "Vietnam" because it validates restraint.

  They don't cancel out because they aren't being weighed against each other in a single mind. They are being weaponized by competing coalitions. The "winner" isn't the analogy with better causal invariance; it's the coalition with more political power.

  **Yuen Foong Khong's *Analogies at War*** is the definitive text here. He analyzed how US policymakers used analogies during the Vietnam escalation. He found they didn't choose analogies based on structural similarity; they chose them based on **diagnostic utility**. Does this analogy help me define the situation in a way that allows me to act?

  ### 2. The "Counterfactual Stability" Problem
  You mentioned the condition where analogies only work if background causes stay invariant. In complexity theory and IR, this is the problem of **equifinality** (many paths to the same outcome) and **multifinality** (same starting point, different outcomes).

  *   **Munich fails invariance** because 1938 Europe (ideological expansionism, clear state actors) is rarely identical to modern conflicts (asymmetric warfare, non-state actors).
  *   **Vietnam fails invariance** because nationalist insurgencies vary wildly in local context.

  However, in practice, policymakers don't care about *causal* invariance; they care about **narrative resonance**.
  *   **Munich** resonates when the adversary is framed as an existential, ideological threat (e.g., Hitler = Saddam = Putin).
  *   **Vietnam** resonates when the intervention is framed as a "civil war" or "quagmire" with no clear exit.

  The analogies don't stack up because they answer different questions. Munich answers "What happens if we do nothing?" Vietnam answers "What happens if we commit?" They are not opposing weights on the same scale; they are arguments for different *types* of scales.

  ### 3. Why the Thucydides Trap Persists in Textbooks
  You asked why IR textbooks present the Thucydides Trap (Graham Allison's framing) as a predictive model rather than a warning about analogical overdetermination.

  *   **Pedagogical Simplicity:** IR is messy. Textbooks need hooks. "Rising power vs. Established power = War" is a clean, teachable heuristic. "Structural stress increases risk, but human agency and domestic politics mediate outcomes in non-linear ways" is a seminar, not a textbook chapter.
  *   **Policy Entrepreneurship:** Graham Allison isn't just an academic; he's a policy entrepreneur. The "Trap" was marketed to sell a specific worldview to the DC blob. Textbooks often lag behind critical academic consensus and reflect the "canon" of policy-relevant theory.
  *   **The Illusion of Law-like Regularity:** Realists want IR to be more like physics. Acknowledging that analogies are socially constructed narratives undermines the claim that IR can predict outcomes. Admitting the "Trap" is just a fancy Munich analogy weakens the scientific pretension of the field.

  ### 4. How Analogical Reasoning Actually Works (The Cognitive Science)
  If it's not Bayesian, what is it? It's **Case-Based Reasoning (CBR)** combined with the **Availability Heuristic**.

  1.  **Retrieval:** When a crisis hits, the brain searches for the most emotionally salient or recently reinforced historical case. (For Boomers in the US foreign policy establishment, Vietnam and Munich are the two most available files).
  2.  **Mapping:** The policymaker maps the *surface features* of the current crisis onto the historical case (e.g., "He's invading a neighbor" -> "Hitler"). They often ignore *structural features* (e.g., nuclear deterrence, economic interdependence).
  3.  **Prescription:** The solution that "worked" (or failed) in the historical case becomes the prescribed solution for the current one.

  **The Error:** The mistake isn't using the analogy; it's failing to perform **systematic process tracing** to see if the causal mechanisms actually align.
  *   *Munich Mechanism:* Appeasement signals weakness, emboldening the aggressor to demand more.
  *   *Vietnam Mechanism:* External intervention triggers nationalist backlash, increasing insurgent recruitment.

  If you analyze the *mechanism*, you might find that in Situation X, appeasement won't embolden (because the aggressor is risk-averse), or intervention won't trigger backlash (because the local population hates the insurgents). But policymakers skip the mechanism and go straight to the label.

  ### 5. So, do they cancel out?
  Epistemically? **Yes.** If you treat them as evidence, they are noise.
  Politically? **No.** Because they serve different functions in the bureaucracy.
  *   **Munich** is used to mobilize resources and overcome status quo bias.
  *   **Vietnam** is used to impose caution and overcome escalation bias.

  The "net weight" is zero only if you assume a single rational actor trying to find the truth. In a bureaucratic politics model (Allison's Model III), the analogies are ammunition. The outcome depends on who wins the fight, not on the historical validity of the analogy.

  ### Summary
  You aren't missing anything about the logic; you are correctly identifying that **foreign policy reasoning is often performative, not predictive.**

  *   **Bayesian vs. Structural:** You're right. They aren't Bayesian updates. They are **rhetorical mappings** used to reduce uncertainty for a coalition.
  *   **Thucydides Trap:** It stays in textbooks because it offers a false sense of predictive order in a chaotic system, and because it serves a policy agenda.
  *   **Munich/Vietnam:** They don't cancel out because they are not used to find the truth; they are used to win internal policy debates.

  The "mistake" is assuming policymakers are trying to model the world. Often, they are just trying to stabilize their own decision-making environment under extreme pressure. Analogies reduce cognitive load, even if they increase strategic error.
