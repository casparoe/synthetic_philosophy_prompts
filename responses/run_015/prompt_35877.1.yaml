      *   *Decision:* The most insightful shared assumption is that **self-control is fundamentally a problem of preference arbitration.** They both think the job is to figure out *which* preference wins. They miss that self-control might be about *transforming* preferences so there is no conflict (Aristotelian habituation).

  4.  **Drafting the Adjudication:**

