answer: |-
  You have described a phenomenon with remarkable precision, and your intuition is correct: standard terms like "rationalization" or "revealed preference" fail to capture the specific *ontological* shift you are observing. In standard rationalization, a preference exists and is hidden; in your cases, the preference (or ranking) is *brought into existence* by the choice, yet retrospectively presented as *discovered*.

  There is no single, canonical term in philosophy or economics that captures this exact configuration in the way you need for a taxonomy. However, your description sits at the intersection of three distinct literatures. By synthesizing them, we can identify the closest existing concepts and then propose a precise label for your taxonomy.

  ### 1. The Psychological Mechanism: Confabulation (not Rationalization)
  You rightly want to distinguish this from rationalization. In psychology and neuroscience, the distinction is well-drawn:
  *   **Rationalization:** The agent has a motive (e.g., fear, greed) that drives the choice, but constructs a socially acceptable reason to hide the true motive. (The reason is a *mask*.)
  *   **Confabulation:** The agent makes a choice for a non-rational reason (or no reason, e.g., a coin flip, neural noise), and the brain's "interpreter" module fabricates a causal explanation to maintain a sense of coherence. (The reason is a *fabrication*.)

  Your examples are classic cases of **Post-Decision Confabulation**. The "coin flip" or "seniority rule" is the non-rational cause. The "detailed case" produced later is the confabulation. Unlike rationalization, there is no "true" preference being hidden; the cognitive system is generating a reason *ex nihilo* to explain an action that lacked a normative basis.

  ### 2. The Value-Theoretic Context: Parity and Normative Power
  In contemporary value theory, the philosopher **Ruth Chang** has done the most work on the state your agents are in *before* the flip. She calls it **Parity**.
  *   **Parity:** A relation where two options are neither "better than," "worse than," nor "equal to" each other. They are "on a par." Reason runs out.
  *   **Normative Power:** Chang argues that in cases of parity, the agent exercises "normative power." By committing to one option, the agent *creates* a reason that did not exist before.

  **The Crucial Distinction:** Chang argues this is a *feature* of agency (we create reasons to make our lives intelligible). However, she insists the agent should acknowledge that the reason was *created* by the commitment.
  Your examples describe a distortion of this: The agents are engaging in what we might call **"Normative Erasure."** They are using the creative power of choice to generate a ranking, but then *denying* the creative act. They present the created reason as if it were a pre-existing fact that *determined* the choice.

  ### 3. The Behavioral Economics Context: Choice-Supportive Bias
  In behavioral economics, this is known as **Choice-Supportive Bias** (or Post-Purchase Rationalization). Experiments show that once people choose between two similarly attractive options, they retrospectively inflate the attributes of the chosen option and deflate the rejected one.
  *   **Limit:** This term describes the *bias*, but not the *argumentative move*. It explains *why* they do it, but not the logical structure of the claim they are making (i.e., the claim of objective commensurability).

  ---

  ### A Proposal for Your Taxonomy

  Since no single existing term captures the *argumentative move* (the retrospective claim of objective ranking following an arbitrary tie-break), I suggest you label this **"Retroactive Commensuration."**

  **Definition:**
  > **Retroactive Commensuration** is an argumentative move in which an agent, having selected between two genuinely incommensurable (or "on a par") options via an arbitrary tie-breaker, subsequently constructs and asserts a definitive normative ranking between them. The agent presents this ranking as the *cause* of the choice (discovery), rather than acknowledging it as a *consequence* of the choice (creation).

  **Why this label works:**
  1.  **Commensuration:** It highlights the core value-theoretic shift. The options moved from being *incommensurable* (no common measure possible) to *commensurable* (one is objectively better on a shared scale).
  2.  **Retroactive:** It captures the temporal inversion. The ranking is applied backward to justify a past event, erasing the history of the tie.
  3.  **Distinguishes from Rationalization:** Rationalization hides a *subjective* desire behind an *objective* claim. Retroactive Commensuration hides an *arbitrary event* behind an *objective* claim.
  4.  **Distinguishes from Revealed Preference:** Revealed Preference assumes the choice *indicates* a prior ordering. Retroactive Commensuration admits (privately or initially) there was no ordering, but asserts one publicly later.

  ### Drawing the Edges

  You asked where this stops being this phenomenon and becomes ordinary self-deception or preference formation.

  **1. The Edge with Ordinary Preference Formation:**
  *   **Preference Formation:** "I wasn't sure, but I tried $A$, and now I realize I like $A$ more." (The experience of the choice *reveals* new information.)
  *   **Retroactive Commensuration:** "I wasn't sure, I flipped a coin, but $A$ was *always* the better option." (The choice creates a *normative fact* about the past.)
  *   *Test:* Ask the agent: "If the coin had landed differently, would $B$ have been the better option?" If they say "Yes," it's honest agency (Chang's view). If they say "No, $A$ was better regardless," it's Retroactive Commensuration.

  **2. The Edge with Ordinary Self-Deception:**
  *   **Self-Deception:** A broad category. Retroactive Commensuration is a *specific species* of self-deception regarding value.
  *   *Distinction:* Self-deception can be about anything ("My spouse isn't cheating"). Retroactive Commensuration is specifically about *erasing the arbitrariness of a value judgment*.
  *   *Test:* Does the distortion serve to protect the ego (Self-Deception) or to protect the *intelligibility of the action* (Retroactive Commensuration)? In your examples, the agents seem driven by a need to make the choice look reasoned, not necessarily to protect their self-image (though those often overlap).

  **3. The Edge with Strategic Lying:**
  *   **Lying:** The agent knows it was a tie but argues $A$ was better to save face.
  *   **Retroactive Commensuration:** The agent *believes* $A$ was better. The confabulation is unconscious.
  *   *Test:* This is hard to verify externally, but in a taxonomy of *moves*, you classify based on the structure of the claim, not the internal state. However, if the agent admits the tie *in the moment* but denies it *later*, the shift suggests the confabulatory mechanism has engaged.

  ### Summary for Your Taxonomy
  If you need a established term to cite, **"Confabulation"** (specifically *post-decision confabulation*) is the most accurate psychological label, and **"Retroactive Commensuration"** is the most accurate value-theoretic label.

  The move is distinct because it denies the **ontological status of the tie**. It treats the "on a par" relation as a temporary epistemic failure ("we couldn't see which was better") rather than a permanent axiological feature ("there is no fact of the matter"). By doing so, it converts an act of **will** (the tie-break) into an act of **reason** (the ranking).

  **Recommended Label:** **Retroactive Commensuration**
  **Alternative Label:** **The Constitutive Mask** (highlighting that the choice constituted the value, but masked that fact).
  **Closest Existing Concept:** **Post-Decision Confabulation** (Psychology) / **Normative Power** (Philosophy - though this is the honest version).
