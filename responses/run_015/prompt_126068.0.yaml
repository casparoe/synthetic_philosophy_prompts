answer: |-
  A Darwinian, a Skinnerian, a Popperian, and a Gregorian creature walk into a university library to find a single obscure monograph on metaphysics.

  The Darwinian immediately curls up inside the book return bin, hardwired to seek shelter among rectangular objects. The Skinnerian sprints down every aisle, gets scolded by the security gate three times, and eventually learns to only walk through the open turnstiles. The Popperian stands frozen at the entrance for twenty minutes, eyes closed, simulating every possible path through the stacks to let its hypotheses die in its stead. The Gregorian picks up a floor map, types a query into the online catalog, and asks a librarian for verbal directions.

  They all converge at the correct shelf an hour later. The Popperian beams with pride and says, "I successfully navigated this entire space internally! I eliminated four hundred wrong paths in my mind without taking a single physical step."

  The Gregorian hands over the book and replies, "That's impressive. I just outsourced the spatial reasoning to this symbolic map and the search logic to the librarian's language. She told me the book was moved to the 'New Arrivals' cart ten minutes ago—a social update your internal simulation couldn't possibly know."
