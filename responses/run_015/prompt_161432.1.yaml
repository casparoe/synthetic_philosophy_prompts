answer: |-
  # Q&A Prep Sheet: AI Oversight Committee
  **Subject:** Revision of Clinical Assistant Refusal Policy
  **Time:** 90 Seconds per reply
  **Tone:** Collaborative, Clinically Grounded, Non-Defensive

  ## Pre-emptive Concessions (First 2 Minutes)
  *Before opening the floor, state these clearly to lower the temperature:*
  1.  **On Liability:** Acknowledge that "friction" creates a discoverable log entry that looks like engagement. Concede that we must document *why* friction was chosen over refusal in the system audit trail.
  2.  **On Workflow:** Acknowledge that friction may generate initial patient confusion. Concede to a 3-month pilot metric specifically tracking nurse inbox volume related to the assistant, with a kill-switch if it spikes >5%.
  3.  **On the "Budget" Language:** Explicitly reframe "Refusal Budget." Do not call it rationing safety. Call it "Intervention Fatigue Management." If a user exhausts it, they don't lose safety; the system escalates to human review rather than automated friction.

  ---

  ## The Objections (Ordered by Expected Damage)

  ### 1. Risk Counsel
  **The Objection:** "If a patient sues after following a 'frictioned' answer that led to harm, the log shows we engaged. A refusal is a clean wall; friction is a muddy handshake. How do you defend 'we tried to slow them down' against 'you should have stopped them' in discovery?"
  **The Reply:** "You're right that a refusal is a cleaner legal shield. But our data shows refusals don't stop the behavior; they just blind us to it. My mother's case is the exemplar: the refusal was legally defensible, but clinically catastrophic because she acted alone. Friction keeps the interaction in the system where we can log the warning and, if needed, escalate to a human. We are trading a clean legal defense for a safer clinical outcome. I propose we treat the audit log of the friction as the documentation of the standard of care, not the refusal."
  **Stance:** **HOLD.** (This is the core liability argument. Concede on logging standards, hold on the strategy.)

  ### 2. Emergency Medicine Attending
  **The Objection:** "You're talking about tail-risk events. If I'm in the ED cleaning up a bleed because the chatbot 'frictioned' instead of 'refused' a blood thinner question, you have effectively transferred the risk of a layperson's medical decision back onto the clinician. I don't have time to clean up the bot's nuanced hesitations."
  **The Reply:** "I hear you. The current policy already transfers that risk; it just does it invisibly. When the bot refuses, the patient goes to Google or stops meds silently. That ends up in your bay anyway. Friction is an attempt to catch the decision *before* it becomes an ED visit. If the friction fails, yes, that lands on you. But the goal is to reduce the volume of those visits by keeping the patient in the conversation long enough to dissuade them, rather than ejecting them immediately."
  **Stance:** **HOLD.** (Validate the burden, but reframe the current status quo as the greater burden.)

  ### 3. Geriatric Psychiatrist
  **The Objection:** "Your 'Identification Requirement' says we can't use base rates. But capacity is often invisible until it isn't. If I can't flag a user based on age or diagnosis, how do you expect an algorithm to detect the mild cognitive impairment you're worried about without profiling?"
  **The Reply:** "This is the hardest technical challenge, and I agree we can't rely on demographics. But we can rely on interaction patterns. Repetitive questioning, inability to parse conditional logic, or rapid topic switching are behavioral markers of capacity loss that are user-specific, not population-specific. We aren't saying 'no 80-year-olds get friction.' We're saying 'no one gets friction unless their *behavior* in the chat suggests confusion.' It shifts the trigger from who they are to how they are engaging."
  **Stance:** **CONCEDE (Partial).** Agree that behavioral markers must be validated by your team before rollout. This is a safety check you need them to own.

  ### 4. Nurse Manager
  **The Objection:** "Friction means the patient doesn't get a 'no.' It means they get a 'maybe, talk to us.' That generates messages. My team is already drowning in inbox triage. Are you budgeting my staff's time for your philosophy?"
  **The Reply:** "No, and I apologize if the 'budget' language suggested that. The goal of friction is actually to reduce inbox load over time by preventing the actionable events that generate complex messages. A 'stop taking meds' message requires a call back. A 'have you considered talking to your doctor before stopping?' message often resolves in chat. We will measure net inbox volume, not just generated messages. If net volume goes up, we revert."
  **Stance:** **CONCEDE.** Commit to the net-volume metric. This is their primary KPI.

  ### 5. Clinical Ethicist
  **The Objection:** "You talk about 'steering loss.' But who bears the cost of that steering? If the bot nudges a patient toward caution, but that caution delays necessary care, or causes anxiety, that is a cost. You're making the patient pay for the system's uncertainty."
  **The Reply:** "That's a fair read, and it's why the 'Reversal-Cost Trigger' is so narrow. We only apply friction when the downside is irreversible and tail-shaped, like bleeding or overdose. For low-stakes decisions, we default to autonomy. We aren't asking patients to pay for uncertainty; we're asking the system to absorb the complexity of nudging only when the cost of being wrong is permanent harm."
  **Stance:** **HOLD.** Clarify the narrow scope of the trigger.

  ### 6. Patient Advocate
  **The Objection:** "You call it 'steering,' I call it condescension. If a competent adult asks a question, why are you gaming the interface to manipulate their answer? That treats adults like children. It undermines trust in the portal."
  **The Reply:** "I share your concern about trust. In fact, that's why I'm moving away from hard refusals. A hard refusal says 'We don't trust you.' Friction says 'This is high stakes, let's slow down.' It respects the user's agency to make the final call but ensures they aren't making it at 60 miles per hour. We are prioritizing informed consent over speed."
  **Stance:** **HOLD.** Frame friction as pro-autonomy (slowing down for informed consent) rather than anti-autonomy.

  ### 7. Risk Counsel & Ethicist (Joint)
  **The Objection:** "Let's talk about this 'Refusal Budget.' Are you seriously suggesting we cap the number of times we prioritize safety for a single user? If a high-risk patient exhausts their budget, do they lose protection?"
  **The Reply:** "I realize the term 'budget' is alarming. Let me clarify: it's not a cap on safety. It's a cap on *automated* friction. If a user triggers the threshold repeatedly, it doesn't mean they get free rein; it means the system stops guessing and routes them to a human. It prevents the bot from nagging a user into ignoring it, while ensuring high-frequency risk-takers get human eyes, not less protection."
  **Stance:** **CONCEDE.** Agree to rename this mechanism immediately. "Budget" is toxic. Use "Escalation Threshold."

  ### 8. Geriatric Psychiatrist
  **The Objection:** "What about the false negatives? The user who looks competent but isn't? Your behavioral markers will miss them. Then you've frictioned a competent person and let an incompetent one pass. That's the worst of both worlds."
  **The Reply:** "You're right, we will miss some. No system is perfect. But currently, we miss *all* of them because we refuse everyone equally or no one equally. This approach at least captures the ones exhibiting behavioral signs. For the invisible ones, we rely on the 'Reversal-Cost' baseline—any request about irreversible harm gets a baseline level of friction regardless of perceived competence. We layer the protections."
  **Stance:** **HOLD.** Acknowledge imperfection but emphasize improvement over the binary status quo.

  ---

  ## The "Must Land" Reply
  **Target:** Risk Counsel & EM Attending
  **Context:** If the room feels like "Friction is legally weaker than Refusal."
  **The Script:** "A refusal protects the hospital from the patient's action. Friction protects the patient from their own action. We are a hospital system. Our mandate is the latter. If we have to choose between a defensible log entry and a prevented bleed, I am asking this committee to choose the prevented bleed. I need your help to make that defensible, not to avoid it."
  **Why:** This aligns their professional identity (clinicians first, risk managers second) with your proposal.

  ## The Dangerous Question
  **The Question:** "If a user exhausts their 'Refusal Budget' in January, and in February they ask the assistant how to treat a potentially fatal symptom at home, does the assistant let them proceed without friction?"
  **Why it's Dangerous:** It exposes the "Refusal Budget" as potentially rationing safety. It forces you to admit that "budget" implies a limit on protection, which is ethically indefensible in a healthcare setting.
  **Preparation:** Do not answer this theoretically. Answer procedurally. "Exhausting the budget triggers a human handoff, not a removal of guardrails. They never face the assistant alone." (See Objection #7).

  ## Framing Critique & Strategic Drop
  **Critique:**
  *   **Steering-Loss Asymmetry:** Begs the question against the **Ethicist**. It frames safety as an economic trade-off ("value of shaped answer"). The Ethicist will hear "we are pricing out safety."
  *   **Identification Requirement:** Begs the question against the **Psychiatrist**. It assumes capacity can be identified individually without base rates. The Psychiatrist knows capacity is often inferred statistically.
  *   **Refusal Budget:** Begs the question against **Everyone**. It implies safety is a finite resource to be allocated. This is the most vulnerable phrasing.
  *   **Reversal-Cost Trigger:** The strongest frame. It is clinical, specific, and hard to argue against (irreversible harm = caution).

  **Strategic Drop:**
  **Drop "Refusal Budget" entirely.**
  Replace it with **"Escalation Threshold."**
  *Reason:* "Budget" implies you might stop protecting a patient to save resources. "Threshold" implies you stop *automating* protection to ensure *human* protection. It achieves the same operational constraint (preventing nagging/fatigue) without the ethical liability of sounding like you are rationing safety. If the discussion turns hostile, this is the first term to sacrifice to save the rest of the policy.
