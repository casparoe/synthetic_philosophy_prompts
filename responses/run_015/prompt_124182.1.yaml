answer: |-
  **MEMORANDUM**

  **TO:** Elections and Referenda Committee
  **FROM:** Graduate Representative
  **DATE:** October 23
  **SUBJECT:** Recommendations for April Referendum Electorate and Participation Rules

  **Purpose**
  We face two distinct but structurally identical problems: defining who counts as a member of the university community for voting purposes, and determining whether that membership entails an obligation to participate. Low turnout in recent referenda (11%, 14%) has undermined the legitimacy of binding results. To secure a result the Board of Trustees will accept and the community will respect, we must adopt rules that are administratively simple, theoretically consistent, and defensible in a single paragraph.

  **Recommendation 1: Eligibility (The Fee Liability Test)**
  I recommend we define the electorate as **all individuals currently liable for the specific fee proposed in the referendum.**

  *   **Included:** Enrolled students (including 16–17-year-old dual-enrollment), employed staff, and faculty who are billed for the semester fee. This includes international students and absentees on leave who maintain fee liability.
  *   **Excluded:** Residents of university housing who do not pay the specific student/services fee (e.g., spouses, children, non-fee-paying postdocs).
  *   **Rationale:** This satisfies the "no taxation without representation" principle. It is easily justified to the Board: "Those financially bound by the decision determine its outcome." It avoids inquiries into citizenship, duration, or age, sidestepping the "full person" constraint. It also protects undocumented residents from forced registration, as they are not fee-liable.

  **Recommendation 2: Participation (Option B)**
  I recommend we adopt **Option (b): Automatic registration from enrollment/payroll rolls with non-voting recorded as a formal abstention.**

  *   **Mechanism:** Every eligible voter is automatically issued a ballot. Failure to return a ballot is recorded as an abstention, not an exclusion. The turnout percentage is calculated against the total eligible population, not just those who clicked.
  *   **Rationale:** This fixes the denominator problem that plagued previous referenda. It treats non-participation as a political signal (acquiescence or dissent) rather than an administrative error. It avoids the legal and ethical risks of Option (c) (penalties/fines), which are problematic for minors and visa holders.

  **The Connection: Subjection and Counting**
  These recommendations are not separate items; they are two halves of the same principle: **If you are bound by the outcome, you must be counted in the mandate.**

  Eligibility defines who is bound (Fee Liability). Participation ensures that the bound are visible in the result. We cannot compel a vote (Option c) without asserting a level of civic ownership that minors or transient visa holders may not possess. However, we can compel *inclusion* (Option b) because the fee obligation already exists. By recording non-votes as abstentions, we acknowledge their stake without forcing an expression of will they may not be equipped to make. This resolves the tension between the "Subjection Principle" (you pay, you vote) and the "Membership Principle" (you belong, you decide): you belong *because* you pay, and you are counted *because* you belong.

  **Analysis of the Weighted Vote Proposal**
  The Faculty Representative's proposal to weight votes by expected remaining years of subjection is the most theoretically coherent alternative on the table. It correctly identifies that a first-year student has a larger financial stake in a 10-year decarbonization plan than a graduating senior.

  However, we must reject it.
  *   **The Cost:** Rejecting it means accepting that some stakeholders have equal say despite unequal stakes.
  *   **The Reason:** Weighted votes create a formally second-class tier of membership. A referendum is a binary decision on binding rules; introducing weight implies that some members' subjection matters less than others. This violates the equal standing required for a legitimate community decision.
  *   **The Real Worry:** The committee's gut reaction is correct: partial votes manufacture a caste system. A mandate manufactured out of compulsory abstentions (Option b) is politically safer than a mandate built on unequal votes.

  **Strongest Case Against This Recommendation**
  I must note the strongest argument against my proposal: **The Fee Liability Test includes minors (16–17-year-olds) who lack full legal capacity, and Option (b) artificially suppresses the appearance of engagement.**
  By counting abstentions in the denominator, a 40% "Yes" vote might look like a minority mandate if 50% abstain. This could give the Administration cover to ignore the result despite it being technically binding. Furthermore, allowing minors to vote on binding financial fees may invite external legal challenge regardless of our internal logic. If we prioritize legal safety over theoretical consistency, we should exclude minors and adopt Option (a) (nothing), accepting lower turnout as the cost of risk mitigation.

  **Timeline**
  *   **Rules Locked:** February 1 (8 weeks prior to vote).
  *   **Rolls Generated:** February 15 (Automatic registration).
  *   **Voting Period:** March 1 – March 15.
  *   **Review:** Committee reconvenes May 1 to assess turnout data and legitimacy challenges before the next cycle.

  \answer{Eligibility is determined by current fee liability; participation is managed via automatic registration with non-votes counted as formal abstentions.}
