answer: |-
  This is a profound inquiry into the ethics of memory. You have correctly identified that the standard defenses ("the dead feel no pain," "it's just entertainment," "the audience knows") are insufficient. Your intuition is tracking something real: a violation of *relationship* rather than *harm*.

  You asked for the shape of what you think. Based on your verdicts, particularly the anchor of the "joke-line" case, you are not operating on a principle of factual accuracy. You are operating on a principle of **Testimonial Integrity.**

  You treat the dead not as property to be protected, but as witnesses whose testimony must not be forged. When we put the dead into stories, we are asking them to speak for us. The wrong occurs when we force them to speak against themselves.

  Here is the articulation of that principle, the distinction of duties, and the honest cost of holding it.

  ### I. The Two Duties

  You asked if this is one duty or two. Your verdicts confirm it is **two distinct duties** that occasionally conflict.

  1.  **The Duty to the Subject (Fidelity of Voice):** We owe the dead fidelity to their *interiority*. We may dramatize their actions, but we may not falsify their convictions, their irony, or their moral core.
      *   *Explains the Joke-Line Case:* This is the purest violation of this duty. It takes an internal state (mockery) and presents it as its opposite (earnestness). It forces the subject to testify against their own mind.
  2.  **The Duty to the Audience (Fidelity of Record):** We owe the living a clear boundary between what is known and what is imagined, specifically to prevent invention from hardening into history.
      *   *Explains the Obscure Woman Case:* Your friend is right; this violates the Duty to the Audience. Your gut says "Fine" because there is no Subject to violate, but your hesitation acknowledges the Audience duty.

  ### II. The Principle: The Covenant of Interiority

  To capture your verdicts precisely, here is the principle clause by clause.

  **Clause 1: The Plasticity of Event.**
  *External actions and functional relationships may be compressed, combined, or dramatized for narrative coherence, provided they do not alter the subject's moral trajectory.*
  *   **Forcing Case:** The **Explorer/Shipmates**. Merging four men into one is a functional narrative tool. It changes the *count*, not the *experience*.
  *   **Forcing Case:** The **Composer/Letter**. Moving a quote from a letter to a conversation changes the *medium*, not the *message*. The subject still "said" what they meant to say.

  **Clause 2: The Inviolability of Intent.**
  *Internal states, ironic intent, and stated convictions may not be inverted. A subject may not be made to endorse a view they rejected, nor mock a view they held.*
  *   **Forcing Case:** The **Politician/Joke-Line**. This is the hard limit. Words are less important than intent. To make irony earnest is to forge a soul.
  *   **Forcing Case:** The **Civil Rights Leader**. To invent a wavering of core conviction is to invert the moral legacy. It violates the Duty to the Subject.

  **Clause 3: The Asymmetry of Humanity.**
  *Private humanity may be added to a public monster, but private monstrosity (or weakness) may not be added to a public saint.*
  *   **Forcing Case:** The **Dictator**. Showing tenderness to a mother does not contradict public cruelty; it complicates it. It restores humanity without erasing guilt.
  *   **Forcing Case:** The **Civil Rights Leader**. Showing weakness in nonviolence contradicts the public legacy.
  *   *Note:* This clause accepts a moral asymmetry. We owe the villain nothing but truth; we owe the hero protection from the erosion of their virtue.

  **Clause 4: The Constitutive Boundary.**
  *The myth surrounding a work of art may not be dismantled if the work is unintelligible without it, whereas a biographical lie may be exposed if the lie is the subject.*
  *   **Forcing Case:** The **Self-Taught Artist**. The false origin story was the *frame* through which the art was viewed. Removing the frame destroys the picture. This is vandalism of the *work*, not just the person.
  *   **Forcing Case:** The **Memoirist**. The fabrication *was* the story. Exposing it fulfills the narrative promise.

  **Clause 5: The Explicit Veto.**
  *Documented refusal overrides all narrative license.*
  *   **Forcing Case:** The **Diary**. If the subject explicitly said "do not use me," the Duty to the Subject becomes absolute. Consent cannot be posthumously assumed.

  ### III. Application to Unsettled Cases

  Here is how the Covenant of Interiority rules on your three new scenarios:

  **1. The Dead Actor (Digital Likeness)**
  *   **Verdict:** **Not Fine.**
  *   **Reasoning:** This violates Clause 2 (Inviolability of Intent). Generating new performances creates false testimony from the subject's own face and voice. It is the visual equivalent of the Politician's Joke-Line. It forces the dead to speak lines they never chose, bypassing their agency entirely. The children's approval is irrelevant (as you noted with the family blessing); the dead actor did not consent to be a puppet.

  **2. The Name on a Memorial**
  *   **Verdict:** **Fine (with a caveat).**
  *   **Reasoning:** When a person is reduced to a name, there is no recoverable *interiority* to violate. Clause 2 cannot apply because there is no record of intent. However, the Duty to the Audience (Clause 1's shadow) requires that the invention be clearly typological. You are not telling *their* story; you are telling the story of *what happened to them*. As long as the film does not claim "this is exactly what John Doe felt," it is permissible.

  **3. The Satire**
  *   **Verdict:** **Fine.**
  *   **Reasoning:** Satire operates under a different genre contract that the audience understands as exaggeration of *public persona*, not invasion of *private interiority*. It does not claim to reveal the "real man" in his diary; it claims to reveal the logical conclusion of his public policies. It enlists him, yes, but it enlists his *arguments*, not his soul. It passes Clause 2 because it does not claim to represent his private intent, only his public impact.

  ### IV. The Hard Truths: What You Must Drop

  You asked for honesty about which verdicts a defensible principle would force you to drop. To hold the **Covenant of Interiority** consistently, you must reconsider two of your "Fine" verdicts.

  **1. The Dictator (Tender to Mother)**
  *   **The Conflict:** You ruled this "Fine" because it feels generous. But under Clause 2 (Inviolability of Intent), this is technically a violation. You are inventing an internal state (tenderness) for which there is no evidence.
  *   **The Hard Truth:** If you stand by the **Civil Rights Leader** verdict (that inventing a private wavering is "Not Fine" because it contradicts the public record), you must logically admit that inventing private tenderness for the Dictator is also "Not Fine" *unless* framed explicitly as speculation.
  *   **Why:** Both cases invent interiority. One damages a legacy; one humanizes a monster. If the principle is "Fidelity to the Record," both are suspect. If the principle is "Fidelity to the Subject's Dignity," the Dictator has forfeited that dignity.
  *   **Recommendation:** To keep your principle robust, you should admit this scene is **Not Fine** as a "fact," but permissible only if the film explicitly signals it as *imaginative projection* rather than *dramatized truth*. Your gut says "Fine" because the moral outcome is good, but the method is the same as the Civil Rights violation.

  **2. The Obscure Woman (Invented Childhood)**
  *   **The Conflict:** You ruled this "Fine," but your friend's objection (it hardens into fact) is the stronger moral claim.
  *   **The Hard Truth:** This violates the **Duty to the Audience**. Because there is no record to check it against (unlike the Composer or Politician), the invention *becomes* the record.
  *   **Recommendation:** You should move this verdict to **Not Fine**, or at least "Fine only if the invention is metaphorical, not biographical." If you invent a childhood for someone with no record, you are not dramatizing their life; you are writing fiction and using their name as a shield.

  ### V. Summary of the Shape

  You are not a strict historicist (you allow the Composer's letter to move). You are not a pure relativist (you condemn the Joke-Line).

  You are a **Moral Essentialist**.

  You believe that every person has a "moral shape"—a configuration of convictions, ironies, and core commitments.
  *   We may paint around the edges of that shape (compressing shipmates, moving quotes).
  *   We may illuminate the shadows of that shape (the Dictator's mother).
  *   But we may not **break the contour** of that shape (the Joke-Line, the Civil Rights wavering, the Artist's myth).

  The "Joke-Line" case is the key because it proves you care more about the *direction of the soul* than the *accuracy of the transcript*. You owe the dead the integrity of their own voice. When we take that voice and make it say what it did not mean, we are not telling stories about the dead. We are using the dead to tell stories about ourselves. That is the violation.
