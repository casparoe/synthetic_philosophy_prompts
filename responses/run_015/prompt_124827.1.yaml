              *   Stalinesque: Pain signals blocked before consciousness.
              *   *Stakes:* Malpractice vs. Unfortunate Outcome. Compensation.
      *   *Refining the Scenario:* Let's look at *consent* and *harm*. If I consent to Procedure A, but Procedure B happens, it's battery. If I consent to A, and A happens but hurts more than expected, it's negligence or just risk.
      *   *The "Orwellian/Stalinesque" specific:* This is about *temporal ordering* of consciousness and report/memory.
      *   *Scenario:* A patient undergoes a procedure under sedation. Something goes wrong (a spike in vitals). Later, the patient has no memory of pain.
      *   *The Twist:* The hospital's liability insurance or ethical charter distinguishes between "inflicting pain" (requires consciousness) and "causing tissue damage" (does not). Or, more potently: *Apology and Moral Debt.*
      *   *Wait, Constraint 3 says:* "It is not enough that a clinician in the story happens to have read the literature." The reasoning must be ordinary.
