      *   It needs to be the thing that makes the empty distinction matter.
      *   It is the **normative dependence of third-party obligations on the subject's phenomenal history.** Even if the subject is gone, our duties to others (family) or to the *memory* of the subject depend on whether the subject *was* a subject of experience at that moment.
