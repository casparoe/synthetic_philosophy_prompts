answer: |-
  Dear colleague,

  Your proposal to distinguish between difference-makers, conditions, and actors is robust enough to survive precision, and it offers the exact disciplinary tool you need for your chapter. The stall in the broader debate often arises from conflating these grades, so converting your intuition into a set of working requirements is the right move. What follows is a specification of those requirements, designed specifically for the historian writing narrative prose on the basis of fragmented archives rather than for the philosopher constructing a metaphysical system. The goal is to ensure that every sentence attributing agency to a non-human entity withstands scrutiny regarding evidence, scale, and political implication.

  The first requirement is contrast-sensitivity, which demands that any claim of agency be indexed to a specific contrast class. You noted that a blight is a difference-maker relative to a harvest that succeeded elsewhere, but the historical question is often whether the blight caused the famine relative to a policy that might have mitigated it. If you shift the contrast from event versus nothing to event versus event under different management, the attribution of agency often shifts from the pathogen to the administration. This prevents the lazy formulation that nature caused the disaster when the evidence supports only that nature provided the shock. Closely related is baseline discipline, which forces you to state the endemic rate of mortality or failure before the shock arrives. In your test case of a blight arriving in an export economy, this requirement disqualifies any theory that credits the microbe with mortality that nutritional state or housing had already made inevitable. You cannot write that the pathogen killed unless you can separate its contribution from the background vulnerability that policy sustained. This leads directly to the channel requirement, which insists that the path from eruption or bacillus to outcome runs through institutions that record, ration, or fail to. If the institution absorbs the shock without transmission to the population, the pathogen is a cause but not an actor in the historical sense. This criterion protects you from skipping the mediation of power, ensuring that the grammatical subject of your causal sentences matches the entity that actually determined the outcome.

  The next set of requirements concerns the alignment of evidence and explanation. Grain matching dictates that the temporal and spatial scale of the cause must answer to the scale of the effect. A multidecadal cooling trend cannot explain a single bad harvest without a transmission story, just as a single eruption cannot explain half a century of state formation. This prevents the telescoping of causes that looks elegant in theory but collapses under archival pressure. Similarly, the archive effect requires you to account for how the non-human cause might have destroyed or preserved the very sources you are using. A city buried in ash looks like a case of volcanic agency partly because the ash fixed the record in a way ordinary years did not. If you do not adjust for this survival bias, you are attributing prominence to the event rather than the agent. These two criteria ensure that your narrative structure does not outpace the evidentiary grain of your burial series and correspondence.

  The final tier of requirements addresses the normative and explanatory stakes of your prose. The non-exculpation condition is perhaps the most critical for your purposes, requiring the theory to distinguish when invoking a drought is warranted and when it is ideology that relieves human agents of alternatives. The test is whether any human counterfactual survives once the non-human cause is held fixed. If the policy could have changed the outcome despite the weather, then the weather is not the primary agent of the suffering. To ensure this is not merely anthropocentric bias, the symmetry check demands that whatever test you propose be run against a human corporate agent such as a treasury or an army. If the criteria return different verdicts for a colonial administration than for a cholera outbreak, you must know whether that is a defect or a feature. This is tied to the explanatory payoff condition, which states that if calling something an actor lets you explain nothing that calling it a condition does not, the vocabulary is doing rhetorical work only. Finally, the intentionality grounding question asks whether teleological talk requires real selection-driven dynamics. A pathogen evolves under pressure, making some goal-directed language defensible in a way that a volcano's mechanics do not. Whether this makes germs actors and volcanoes merely causes is a decision you must make, but the requirement forces you to make it explicitly rather than by habit.

  Regarding your request for my view on the status of these requirements, I believe most are genuine desiderata, but some carry the weight of political preference disguised as methodological standards. The non-exculpation condition is the most vulnerable here. It is analytically useful for preventing deterministic drift, but it is also inherently political because it decides when human responsibility is foregrounded. In a context where administrative correspondence is written by people with reasons for blaming the weather, this requirement acts as a corrective to source bias, but it must be acknowledged as a normative choice to prioritize human accountability over natural determinism. Similarly, the channel requirement risks being a humanist prejudice that privileges institutions over ecology. However, for a historian working with parish records and state papers, it is a necessary constraint because those are the mechanisms through which history becomes legible. If the institution fails to record the impact, you cannot write the history of the impact, so the requirement is pragmatic as well as philosophical. The intentionality grounding criterion is the most contentious, as it risks importing scientific realism into historical explanation. If you reject it, you treat all non-humans as equal actors; if you accept it, you create a hierarchy based on biological capacity. For your purposes, grounding is likely a prejudice of the scientifically minded, but it is a useful one for distinguishing between reactive systems and adaptive ones.

  On the question of consistency, there is a tension between the symmetry check and the intentionality grounding requirement that you should be aware of. If you demand that human corporate agents and non-human entities pass the same tests for agency, but then exclude volcanoes because they lack selection-driven dynamics, you have violated symmetry. This is not necessarily a fatal flaw, but it is an inconsistency that needs to be managed. You might resolve it by arguing that symmetry applies to the structural role in the narrative rather than the ontological status of the entity, but that moves the goalposts. Alternatively, you might accept that the list is jointly unsatisfiable in the strictest sense, functioning instead as a set of competing pressures that must be balanced case by case. I suspect this is the more honest finding, as a tidy set of criteria often masks the complexity of the archive. The inconsistency is a feature if it forces you to justify why you are privileging one requirement over another in a specific sentence.

  Finally, regarding which single requirement does the most work in excluding the positions currently on offer, I believe it is the non-exculpation condition. Most existing frameworks either naturalize human failure by overstating environmental determinism or socialize nature to the point where the material constraint disappears. The non-exculpation condition forces a specific counterfactual test that most casual attributions of agency cannot survive. It demands that you show the human alternative was possible despite the non-human constraint. This excludes both the hard determinists who see only the drought and the strong constructivists who see only the discourse about the drought. It leaves you with the narrow path where the drought mattered because the policy allowed it to matter. This is the hardest standard to meet, but it is the one that yields the most historically rigorous prose. It prevents the pathogen from becoming a scapegoat for the administration while preventing the administration from becoming a mere puppet of the pathogen.

  I hope this specification helps you finalize the chapter. The distinction you have drawn is strong enough to bear this weight, and these requirements should give you the leverage you need to write with precision. You now have a way to decide sentence by sentence whether the blight acted or merely arrived.

  Yours sincerely,

  Your Colleague
