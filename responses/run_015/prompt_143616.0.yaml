  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Editor of a small magazine (*The Public Domain*).
      *   **Problem:** Flooded with essays misusing Gödel's Incompleteness Theorems (GIT) to make wild claims (AI consciousness, climate models, legal systems).
      *   **Constraint 1:** Staff are smart generalists, not logicians.
      *   **Constraint 2:** Decision time is ~15 minutes per submission.
      *   **Constraint 3:** Needs a reusable decision procedure (checklist/flowchart style).
      *   **Constraint 4:** Must be grounded in actual theorem preconditions (effective axiomatizability, arithmetic representation, consistency) but translated for non-specialists.
      *   **Constraint 5:** Specifically distinguish between *consistency* and *omega-consistency* (a niche failure mode).
      *   **Constraint 6:** Include test phrases/patterns to scan for.
      *   **Constraint 7:** Apply the procedure to three specific cases (AI/Ethics, Climate Models, Voting Theory).
      *   **Constraint 8:** Be honest about limitations (judgment calls, where it might misfire).
      *   **Constraint 9:** No reading lists, no citations (Lucas/Penrose), just the checklist.

  2.  **Deconstruct Gödel's Incompleteness Theorems (GIT):**
      *   *First Theorem:* Any effectively generated formal system capable of expressing elementary arithmetic cannot be both consistent and complete. (If consistent, there are true statements it can't prove).
      *   *Second Theorem:* Such a system cannot demonstrate its own consistency.
      *   *Key Preconditions:*
          1.  **Formal System:** It must be a system of rules/symbols, not a vague concept.
          2.  **Effective Axiomatizability:** There must be a mechanical way to list the axioms (computable).
          3.  **Arithmetic Strength:** It must be able to define basic arithmetic (addition/multiplication of natural numbers).
          4.  **Consistency:** It must not contain contradictions (usually assumed).
          5.  **Omega-Consistency:** A stronger condition than simple consistency (roughly: you can't prove "there exists an $x$ such that $P(x)$" while also proving "not $P(0)$", "not $P(1)$", "not $P(2)$"... for every number). *Note: Rosser later weakened this to simple consistency, but the prompt specifically asks to distinguish them as a niche failure mode.*

  3.  **Drafting the Decision Procedure (The "Gödel Litmus Test"):**
      *   *Goal:* Filter out "Decorative Mysticism" from "Real Philosophical Work."
      *   *Structure:* Step-by-step checks with Stop/Continue/Expert flags.
      *   *Language:* Plain English, avoiding heavy symbolism.
      *   *Omega-Consistency Check:* This is tricky for generalists. I need to frame it as "Does the author claim the system is lying about existence without showing a specific counter-example?" or "Does the author confuse 'unprovable' with 'false'?" Actually, the prompt asks to distinguish consistency from omega-consistency specifically regarding the *Second Theorem* usage outside math. Usually, GIT 1 requires omega-consistency (originally) or simple consistency (Rosser). GIT 2 requires consistency. The prompt implies authors confuse the two. I will frame it as: "Does the argument rely on the system believing its own consistency?"
      *   *Refining the Omega-Consistency point:* Most pop-sci misuse ignores this. If an author claims "The system proves it is consistent, therefore it is inconsistent," that's GIT 2. If they claim "The system cannot decide X," that's GIT 1. The specific failure mode regarding omega-consistency often arises when authors claim a statement is *true* but unprovable. GIT 1 says if consistent, there's an unprovable statement. To say it's *true*, you need a model (semantic truth). Omega-consistency ensures the system doesn't prove false existential claims. I will simplify this for the checklist: "Does the author claim a statement is True *because* it is unprovable?" (This requires semantic grounding outside the system).

  4.  **Developing Test Phrases:**
      *   Look for: "Self-reference," "Unprovable truth," "Formal system," "Algorithm," "Axioms."
      *   Red Flags: "Gödel proves," "Human intuition exceeds," "Fundamentally uncertain."

  5.  **Applying to Case Studies:**
      *   *Case 1 (AI/Ethics):* Classic Lucas/Penrose trope. Fails on "Formal System" (is ethics a formal system?) and "Arithmetic" (does ethical reasoning encode Peano arithmetic?).
      *   *Case 2 (Climate):* Fails on "Formal System" (physics models aren't axiomatic logic systems in the Gödelian sense) and "Effective Axiomatizability."
      *   *Case 3 (Voting Theory):* This is the tricky one. Social Choice Theory (Arrow's Theorem) is often conflated with Gödel. But there *are* links (computability in voting). If the paper uses recursive axioms, it *might* be legit. This is the "Call Expert" case.

  6.  **Refining the Omega-Consistency Constraint:**
      *   The prompt specifically asks to distinguish plain consistency from omega-consistency as a niche failure mode.
      *   *Context:* Gödel's original 1931 proof required $\omega$-consistency for the First Theorem. Rosser (1936) improved this to simple consistency. However, for the *Second* Theorem (consistency cannot be proved within the system), simple consistency is the standard requirement.
      *   *Misuse:* Authors often claim "Because the system can't prove its own consistency, it is inconsistent." That's a non-sequitur. Or they claim "We found a statement the system can't decide, therefore the system is omega-inconsistent."
      *   *Action:* I need a specific step that asks: "Does the argument depend on the system making false claims about infinite sets of numbers?" or "Does the author treat 'unprovable' as synonymous with 'false'?"
      *   *Better interpretation for non-logicians:* Omega-consistency is about not proving "There exists a number with property P" while proving "0 doesn't have P, 1 doesn't have P, 2 doesn't have P..." forever.
      *   *Check:* Does the author claim the system is "lying" about existence? If they invoke GIT to say "The model says X exists but we can't find it," that's an omega-consistency issue. I will add a specific "Omega-Check" step.

  7.  **Drafting the Content (Iterative refinement):**
      *   *Intro:* Set the tone. Practical, skeptical.
      *   *The Checklist:* 5 Steps.
          1.  Is it a Formal System?
          2.  Does it do Arithmetic?
          3.  Is it Effectively Axiomatized?
          4.  Consistency vs. Omega-Consistency (The specific request).
          5.  The Leap (Logic to Metaphysics).
      *   *Test Phrases:* Green flags vs. Red flags.
      *   *Case Applications:* Walk through the steps for each.
      *   *Limitations:* Be honest about where the checklist fails (e.g., metaphorical usage that is still insightful).

  8.  **Self-Correction/Review against Constraints:**
      *   *Did I include Omega-Consistency?* Yes, need to make sure it's clear. It's often a confusion point. If an author says "Gödel shows the system is consistent but incomplete," that's standard. If they say "Gödel shows the system is omega-inconsistent," that's specific. I will frame the check as: "Does the argument rely on the system asserting an existence it cannot verify?"
      *   *No Citations?* Check. No Penrose/Lucas mentions in the output (except maybe in the case study analysis as context for *why* it's a common trope, but better to avoid names to stick to constraints).
      *   *15 Minute Limit?* The checklist needs to be fast.
      *   *Honesty about Judgment Calls?* I need a section explicitly stating "Where this tool lies to you."

  9.  **Final Polish:**
      *   Ensure the distinction between "The system is inconsistent" and "The system cannot prove it is consistent" is clear in the Second Theorem section.
      *   Ensure the Climate Case clearly fails the "Arithmetic" check (physics $\neq$ Peano axioms).
      *   Ensure the Voting Case triggers the "Call Expert" flag (Social Choice Theory *does* use logic, but conflating Arrow with Gödel is common).

  10. **Final check on Omega-Consistency:**
      *   Why does the editor care? Because authors often claim "Gödel proves there are true statements the system misses." To claim they are *true* (semantically) rather than just *undecidable* (syntactically), you need to assume the system is sound (consistent + true axioms). Omega-consistency is a technical bridge.
      *   *Simplification for Staff:* "Does the author claim the unprovable statement is definitely TRUE, or just UNDECIDABLE?" If they claim TRUE, they are making a semantic leap that requires assumptions about omega-consistency (or soundness). I will phrase the check around "Truth vs. Provability."

      *(Self-Correction)*: Wait, the prompt asks to distinguish plain consistency from omega-consistency specifically.
      *   Plain Consistency: No contradiction ($P$ and $\neg P$).
      *   Omega-Consistency: No contradiction between a general existence claim and infinite specific negations.
      *   *Misuse:* Authors often assume simple consistency is enough to guarantee the "truth" of the Gödel sentence. It isn't quite; you need soundness. But omega-consistency was the original condition for the Gödel sentence to be true in the standard model.
      *   *Decision:* I will create a specific "Omega-Trap" check. "Does the argument assume that because the system can't disprove X, X must be true?"

      *Let's refine the Omega-Check for the prompt:* The prompt says "distinguish plain consistency from omega-consistency, since I think that's a niche failure mode people miss when they invoke the second theorem outside math."
      *   Actually, the Second Theorem (consistency unprovable) usually just requires simple consistency. The First Theorem (incompleteness) originally required omega-consistency (later Rosser removed this).
      *   *Hypothesis:* The editor suspects authors claim "The system proves its own consistency, therefore it is omega-inconsistent."
      *   *Better approach:* I will add a step that asks: "Does the author claim the system is *wrong* about numbers, or just *limited*?" Omega-inconsistency implies the system is wrong (proves false existence). Simple incompleteness implies the system is limited (can't decide).
      *   *Okay, I will build the step:* "The Omega-Trap: Does the author claim the system asserts a specific number exists that doesn't?"

      *Wait, one more thought:* If I make it too technical, the staff can't use it. I need to translate "omega-consistency" into "infinite verification."
      *   *Translation:* "Plain consistency means the system doesn't contradict itself. Omega-consistency means the system doesn't claim 'something exists' while denying it for every specific case."
      *   *Check:* "Does the essay claim the system is 'lying' about existence (Omega) or just 'silent' (Incompleteness)?"

      *Okay, ready to write.*
answer: |-
  # The Gödel Litmus Test: A Decision Procedure for Editors

  **Purpose:** To distinguish rigorous applications of Gödel's Incompleteness Theorems (GIT) from decorative mysticism in non-technical essays.
  **Time Budget:** 15 Minutes per submission.
  **Users:** Generalist editors (no logic training required).

  ---

  ## Part 1: The Scan (Test Phrases)
  Before running the procedure, scan the text for these patterns. They do not determine acceptance, but they dictate which path of the procedure to prioritize.

  **🚩 Red Flags (High Probability of Misuse)**
  *   "Gödel proves that [human intuition / consciousness / truth] exceeds [machines / logic / systems]."
  *   "Because the system cannot prove itself, it is fundamentally flawed/unreliable."
  *   "This creates a paradox that breaks the model."
  *   "Gödel showed that some things are true but unprovable." (Without defining *where* they are true).
  *   Vague analogies: "The climate is like a mathematical system..."

  **🟢 Green Flags (Potential Legitimacy)**
  *   Explicit mention of "formal systems," "axioms," or "recursive functions."
  *   Distinction between "syntax" (rules) and "semantics" (meaning/truth).
  *   Citation of specific constraints (e.g., "systems capable of arithmetic").
  *   Humility: "This suggests a limitation in *proof*, not necessarily in *reality*."

  ---

  ## Part 2: The Decision Procedure

  Run these five checks in order. If any check triggers a **STOP**, reject or request major revision. If you reach **Step 5**, call an expert.

  ### Step 1: The "Formal System" Check
  **Question:** Does the essay identify a specific set of rules (axioms) and mechanical deduction steps that constitute the system being analyzed?
  *   **The Logic:** GIT only applies to formal systems (like math or code), not vague concepts (like "law," "climate," or "ethics") unless they have been rigorously encoded.
  *   **Action:**
      *   If the "system" is a metaphor (e.g., "The legal system is a logic machine"): **STOP (Misuse).**
      *   If the "system" is a specific computational or logical model defined in the text: **CONTINUE.**

  ### Step 2: The "Arithmetic" Check
  **Question:** Does the system explicitly include basic arithmetic (addition and multiplication of natural numbers) or something proven equivalent to it?
  *   **The Logic:** GIT requires the system to be strong enough to represent Peano Arithmetic. A system that only does logic, or only does physics simulations, might not qualify.
  *   **Action:**
      *   If the system processes data but does not define number theory: **STOP (Misuse).** (e.g., Climate models simulate fluids, they do not prove theorems about integers).
      *   If the system explicitly encodes arithmetic or the author proves it does: **CONTINUE.**

  ### Step 3: The "Effective Axioms" Check
  **Question:** Is there a mechanical way to list every rule/axiom the system uses? (Could a computer print them all out eventually?)
  *   **The Logic:** GIT applies to *recursively enumerable* axioms. If the rules are intuitive, hidden, or infinite in a non-computable way, GIT doesn't apply.
  *   **Action:**
      *   If the rules rely on "human judgment," "context," or "undefined variables": **STOP (Misuse).**
      *   If the rules are fixed, finite, or computably generatable: **CONTINUE.**

  ### Step 4: The Consistency vs. Omega-Consistency Check
  **Question:** What does the author claim Gödel says about the system's reliability?
  *   **The Logic:**
      *   *Plain Consistency:* The system never proves $A$ and $\text{not-}A$.
      *   *Omega-Consistency:* The system never proves "There exists a number $x$..." while simultaneously proving "Not 0," "Not 1," "Not 2"... for every number.
      *   *The Trap:* Authors often claim GIT proves a system is *wrong* (inconsistent). GIT actually proves a consistent system is *incomplete* (silent). Confusing "silent" with "lying" is an omega-consistency failure.
  *   **Action:**
      *   If the author claims: "Gödel proves the system contains contradictions": **STOP (Misuse).** (GIT assumes consistency to prove incompleteness).
      *   If the author claims: "The system claims something exists but we can't find it": **FLAG (Omega-Trap).** This requires omega-consistency analysis. If they treat this as a fatal flaw without proof of omega-inconsistency, **STOP.**
      *   If the author claims: "There are statements the system cannot decide": **CONTINUE.**

  ### Step 5: The "Truth" Leap (Expert Hand-off)
  **Question:** Does the author claim the unprovable statement is **True** in the real world?
  *   **The Logic:** GIT shows a statement is unprovable *within the system*. It does not automatically make the statement True *outside the system* unless you assume the system is Sound (Consistent + True Axioms). Moving from "unprovable" to "True" requires philosophical justification.
  *   **Action:**
      *   If the essay stays within the limits of the formal system: **ACCEPT (Rare).**
      *   If the essay makes a metaphysical claim (consciousness, ethics, reality) based on this unprovability: **CALL EXPERT.** (This is the boundary of logic and philosophy; do not decide internally).

  ---

  ## Part 3: Procedure Application (Case Studies)

  ### Case 1: The AI Ethics Pitch
  **Claim:** "Gödel proves no computer can understand ethics because self-reference is unavoidable."
  *   **Step 1 (Formal System):** The essay treats "ethics" as a logical system.
      *   *Result:* **FAIL.** Ethics is not defined as a set of axioms with deduction rules. It is a human practice.
  *   **Step 2 (Arithmetic):** Does ethical reasoning encode multiplication of integers?
      *   *Result:* **FAIL.** No evidence provided.
  *   **Step 4 (Consistency):** The author claims computers "cannot understand," implying a limitation of capability, not just proof.
      *   *Result:* **STOP.**
  *   **Verdict:** **Reject.** This is decorative mysticism. It uses "self-reference" as a buzzword without a formal system to be self-referential.

  ### Case 2: The Climate Model Draft
  **Claim:** "Climate models are Gödel-incomplete and therefore long-range predictions are unreliable."
  *   **Step 1 (Formal System):** Climate models are systems of differential equations, not axiomatic logic systems.
      *   *Result:* **FAIL.**
  *   **Step 2 (Arithmetic):** While they use numbers, they do not attempt to *prove theorems* about number theory. They simulate physical states.
      *   *Result:* **FAIL.**
  *   **Step 4 (Consistency):** The author conflates "numerical uncertainty/chaos" with "logical incompleteness."
      *   *Result:* **STOP.**
  *   **Verdict:** **Reject.** This is a category error. Chaos theory and Gödel's theorems are not interchangeable.

  ### Case 3: The Voting Theory Paper
  **Claim:** "Using recursive axioms, we show voting rules encounter Gödelian limits regarding fairness."
  *   **Step 1 (Formal System):** Voting theory (Social Choice) often uses formal axioms (e.g., Arrow's Theorem).
      *   *Result:* **PASS.**
  *   **Step 2 (Arithmetic):** Aggregating votes often maps to arithmetic operations or logical ordering.
      *   *Result:* **PASS (Tentative).**
  *   **Step 3 (Effective Axioms):** The paper defines the voting rules recursively.
      *   *Result:* **PASS.**
  *   **Step 4 (Consistency):** The paper argues that no voting system can satisfy all fairness criteria simultaneously (incompleteness of fairness), rather than claiming the system is contradictory.
      *   *Result:* **PASS.**
  *   **Step 5 (Truth Leap):** The paper suggests this limits *democratic legitimacy* (a metaphysical claim).
      *   *Result:* **CALL EXPERT.**
  *   **Verdict:** **Hand-off.** This is the edge case. Social Choice Theory *does* have incompleteness results (like Arrow's), but conflating them with Gödel specifically requires a logician to verify if the mapping to Peano Arithmetic is valid or if they are just using "Gödel" as a synonym for "Impossibility Theorem." Do not reject, but do not accept without external review.

  ---

  ## Part 4: Limitations & Honesty Check

  **Where this procedure will misfire:**
  1.  **Metaphorical Insight:** An essay might fail Step 1 (no formal system) but still offer a brilliant *metaphorical* use of Gödel to discuss human limitation. This procedure will flag it as "Misuse." You must decide if "philosophically useful metaphor" is enough for your magazine, even if logically invalid.
  2.  **The Rosser Improvement:** Step 4 focuses on Omega-Consistency. Technically, J.B. Rosser (1936) strengthened Gödel's First Theorem so it only requires simple consistency. If an author knows this and cites Rosser, Step 4 might flag them incorrectly as "trapped." *Mitigation:* If they cite Rosser explicitly, skip Step 4's Omega-Trap and proceed to Step 5.
  3.  **Soundness vs. Consistency:** Step 5 flags claims of "Truth." However, if the author explicitly argues for the *Soundness* of the system (that its axioms are true), they can claim the Gödel sentence is True. This procedure treats that as an Expert Hand-off because verifying Soundness is philosophical, not logical.

  **Judgment Calls Dressed as Rules:**
  *   **Step 2 (Arithmetic):** Determining if a system "encodes arithmetic" is sometimes subtle. A system might encode arithmetic implicitly. If the author asserts it does, give them the benefit of the doubt and move to Step 5 (Expert Hand-off).
  *   **Step 5 (Expert Hand-off):** This is the most critical safety valve. If the essay passes the logic checks but makes a wild philosophical leap, do not reject it yourself. The procedure forces you to admit you are out of your depth.

  **Final Note to Staff:**
  If an author gets defensive about Step 1 or 2, they are likely hiding a misuse. Real logicians love defining their formal systems. Mystics hate it.
