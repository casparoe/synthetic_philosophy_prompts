answer: |-
  Based on the eight precedents in your minutes, your group is not applying a pure Lewisian definition (which would focus almost exclusively on conditional conformity). Instead, you are applying a hybrid framework that prioritizes **mechanism of enforcement** and **functional necessity**.

  Here are the three rules that fit all eight earlier verdicts, followed by the rulings for your new cases.

  ### The Three Rules of Sorting

  1.  **The Sanction Rule (Enforcement Mechanism)**
      *   **Rule:** If compliance is secured by an automated tool (CI/linter) or active social punishment (public nudging/shaming), it is an **Enforced Rule**.
      *   **Rationale:** Conventions rely on the *natural friction* of non-coordination (e.g., I miss the meeting if I come at the wrong time). If you introduce an external penalty, it ceases to be a convention.
      *   **Fits Cases:** *Commit messages* (Linter flag = Rule); *PR Reviews* (Public nudge = Rule).

  2.  **The Solitary Utility Rule (Independence)**
      *   **Rule:** If an agent would rationally continue the behavior even if no one else did (because it provides individual utility), it is a **Habit**.
      *   **Rationale:** Conventions exist to solve coordination problems. If the value is intrinsic to the actor, it is not coordination.
      *   **Fits Cases:** *Local Tests* (Catches my bugs = Habit).

  3.  **The Coordination Necessity Rule (Function & Scope)**
      *   **Rule:** If the behavior does not solve a recurring cross-agent coordination problem, or lacks actual behavioral regularity, it is **Not a Project Convention** (Habit or Null).
      *   **Rationale:** Shared expectations without behavior (Case 7) or behavior without functional interdependence (Case 8) do not count. A convention must be the *solution* to a problem that requires alignment.
      *   **Fits Cases:** *Changelog* (No behavior = Null); *Click/Invoke* (No cross-team coordination = Team Habit); *PRs against main* (Solves where-to-look problem = Convention); *Call Time* (Solves when-to-meet problem = Convention); *Fixes #123* (Solves tracking problem = Convention).

  ---

  ### Rulings for the New Cases

  #### Case 1: Forum vs. Chat Split
  *   **Prediction:** **Convention.**
  *   **Closest Analog:** *Weekly Call Time (Case 2).* Both are arbitrary slots/locations where the only value is being where everyone else is.
  *   **Principle Committed:** You are committing to the **Coordination Necessity Rule**. You acknowledge that while the platform is arbitrary, the *alignment* is functionally necessary for design talk to occur.
  *   **Consistency Check:** It passes all three tests. No bot enforces it (Not Rule 1). It is useless if done alone (Not Rule 2). It solves a project-wide coordination problem with behavioral regularity (Passes Rule 3).

  #### Case 2: The `#done` Note
  *   **Prediction:** **Habit.**
  *   **Closest Analog:** *Local Tests (Case 5)* mixed with *Changelog (Case 7)*. Like Tests, it is a daily ritual. Like Changelog, it has no functional downstream utility ("nobody reads").
  *   **Principle Committed:** You are committing to the **Coordination Necessity Rule**. By classifying this as a Habit, you are publicly stating that this practice solves no coordination problem.
  *   **Consistency Check:** It fails Rule 3. The minutes state "nothing of anyone's depends on anyone else doing it." Under your precedents, a regularity without a coordination function cannot be a Convention, even if conformity is conditional ("rest would drop it").
  *   **Consequence:** Since Habits are "not mentioned at all" in the guide, documenting this as a Habit effectively means **omitting it**. This may cause the practice to die, as its only sustaining force is the unspoken expectation. If the group wants to keep it, they must admit it is a "Rule" (socially enforced) or find a functional justification to make it a "Convention."

  ---

  ### The Summit Stress-Test

  To ensure these rules survive contact with the wider group, you need to test their commitment to the **Coordination Necessity Rule** (Rule 3). The tension lies in Case 2: everyone conforms conditionally, but nothing is actually coordinated.

  **Put this question to the summit:**

  > "Imagine we all start wearing a specific color badge on our avatars on Tuesdays. Nobody reads the badges, nothing depends on them, but if half the team stopped, the rest would feel too awkward to continue.
  >
  > If we document this as a **Convention**, we promise never to sanction someone for not wearing one. If we document it as a **Habit**, we do not mention it in the guide.
  >
  > **Which are we doing?** Are we protecting the *right to opt out* (Convention), or are we admitting this is *functionally irrelevant* (Habit)?"

  **Why this works:**
  *   If they say **Convention**, they weaken Rule 3. They admit that *social pressure alone* creates a Convention, even without a coordination problem. This forces you to re-classify Case 2 (`#done`) as a Convention.
  *   If they say **Habit**, they strengthen Rule 3. This validates your ruling on Case 2 but confirms that documenting it will likely kill the practice.
  *   This forces the group to decide if the Contributor Guide is a **catalog of culture** (including rituals) or a **manual of workflow** (only functional coordination). Your past eight rulings suggest the latter; the summit must confirm if that still holds.
