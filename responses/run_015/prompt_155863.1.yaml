      *   *Claim 2: "...so bounded rationality is this built-in mental handicap where you just grab the first thing thats good enough."*
          *   **Simon's View:** "Bounded rationality" refers to the *environment* of the decision plus the *computational capabilities* of the actor. It's not necessarily a "handicap" (negative connotation); it's a description of reality. "Grab the first thing" is a simplification of satisficing (search until aspiration level is met).
          *   **Verdict:** Partially correct on "good enough" (aspiration level), but "handicap" implies a defect rather than a structural constraint. "Grab the first thing" ignores the search process.

      *   *Claim 3: "Simon proved that this is actually rational—you're being smart within your hard-wired limits..."*
