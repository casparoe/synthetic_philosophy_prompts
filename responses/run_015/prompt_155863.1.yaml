      *   **Roommate's Claim:** "People don't maximize because the human brain is literally too small to compute every option, so bounded rationality is this built-in mental handicap where you just grab the first thing thats good enough. Simon proved that this is actually rational—you're being smart within your hard-wired limits—and thats why AI will eventually replace human decision makers, since computers don't have brain-size caps and can always run the full optimization."
