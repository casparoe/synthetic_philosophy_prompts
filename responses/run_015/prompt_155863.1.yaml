prompt: |-
  my roommate tried to explain Herbert Simon's satisficing idea to me and said: "People don't maximize because the human brain is literally too small to compute every option, so bounded rationality is this built-in mental handicap where you just grab the first thing thats good enough. Simon proved that this is actually rational—you're being smart within your hard-wired limits—and thats why AI will eventually replace human decision makers, since computers don't have brain-size caps and can always run the full optimization." I think he's definatly conflating physical brain size with information costs, and maybe treating a later economic framing as if it were Simon's own. But I can't tell which parts are real misreadings and which are just sloppy phrasing. Is this summary fair? Please go through it claim by claim: which parts capture Simon's actual view of satisficing and bounded rationality, where does he conflate cognitive limits with something else, is "brain-size cap" using a technical term in its everyday sense, and does the AI-replacement conclusion actually follow? Also he frames satisficing as "being rational within your limits"—is that Simon's own framing or is he smuggling in a later interpretation that Simon would reject?
