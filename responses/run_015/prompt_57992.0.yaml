  3. Continuous pricing strictly demands that partial computational results or heuristic arguments constitute valid evidence for belief revision, while it only sits comfortably with the assumption that a definite truth value exists independently of current verification.
  4. The practice leaves open the ontological debate between Platonism and Formalism, as the trading mechanism functions identically whether truths are discovered or constructed, provided consensus on proof is achievable.
  5. If only formal proof or disproof can bear on probability, minute-by-minute pricing must be revised to remain constant during interim periods, treating all pre-proof fluctuations as irrational noise rather than legitimate belief updating.
