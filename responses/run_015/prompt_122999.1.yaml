answer: |-
  ### Brainstorming & Rejections

  1.  **The Emergency Rescue:** A student jumps into a frozen lake to save a dog.
      *   *Reject:* Too impulsive. It collapses the distinction between biological instinct (adrenaline) and moral cultivation. Both Mencius and Xunzi could argue it's just a reflex, making it hard to isolate whether the reflex is *moral* nature or *trained* survival response.
  2.  **The Honest Wallet:** A student finds a wallet and returns it without thinking.
      *   *Reject:* Too static. It's hard to establish the "history of training" vs. "innate tendency" without a backstory that bloats the paragraph. It often defaults to a "did they want the reward?" debate, which tests selfishness, not the ontology of habituated virtue.
  3.  **The Group Project Sacrifice:** A student takes the blame for a group failure to protect a friend.
      *   *Reject:* Too psychologically complex. Taking blame usually *feels* costly. If it feels effortless, it risks looking like pathology (people-pleasing) rather than moral maturity. It muddies the water between virtue and lack of self-respect.

  ***

  ### The Thought Experiment: The Transparent Habit

  Alex, formerly notorious in middle school for cutting lines and hoarding shared resources, spent the last three years in a rigorous school leadership cohort that drilled specific protocols for hospitality and queue etiquette until they were muscle memory. Now, during a chaotic pizza rush in the cafeteria, Alex automatically steps back to let a flustered freshman cut ahead, handing over a napkin without breaking stride or conscious thought, feeling zero internal resistance. Alex later admits that three years ago, they would have felt genuinely annoyed by the delay, but now the movement feels as unchosen and spontaneous as blinking, with no sense of "should" or "effort" accompanying the act.

  ***

  ### Analysis & Debate Breakdown

  **The Action:**
  Yielding space and resources to a stranger in a high-competition environment (cafeteria rush) spontaneously and without internal resistance.

  **The Relevant Background:**
  1.  **Documented Contrary History:** Alex was previously selfish (cutting lines, hoarding). This establishes that the *original* impulse was not to yield.
  2.  **Explicit Training:** The behavior was acquired through a specific, rigorous program (drills/protocols), not osmosis.
  3.  **Phenomenological Shift:** The behavior has transitioned from effortful compliance to effortless spontaneity (the "second-nature plateau").

  **Why Each Theory Is Forced Into Its Verdict:**

  *   **The Mencian Verdict (This is Nature/*Xing*):**
      The Mencian must argue that the *capacity* to resonate with the training was the true nature all along. The fact that the action now feels effortless and spontaneous is proof that the external training didn't *impose* a foreign shape but rather *cultivated* a latent tendency until it fully bloomed. For Mencius, if it feels like "who you are" now, and it is good, it is because you have recovered/expanded your original nature. The training was just water and sunlight; the plant grew itself. To say this is "artifice" would be to say a grown oak tree is artificial because someone planted the acorn.

  *   **The Xunzian Verdict (This is Artifice/*Wei*):**
      The Xunzi must argue that the *content* of the action contradicts the original impulse (which was documented as selfish). The fact that it feels effortless now is merely evidence of successful conditioning, not evidence of native nature. For Xunzi, a well-fitted prosthetic limb feels like part of the body after years of use, but it is still wood and metal, not flesh. The smoothness proves the training was thorough, not that the impulse is innate. To say this is "nature" confuses *habit* with *origin*.

  **The Single Feature Doing the Work:**
  The **phenomenological transparency of the habit despite historical contrary evidence.**
  This is the "second-nature plateau." The case hinges entirely on the fact that the action *feels* innate (no deliberation, no resistance) even though we *know* it wasn't innate originally (history of selfishness). This forces the clash: Does "feeling natural" make it "nature" (Mencius), or is "nature" strictly defined by the pre-trained starting state regardless of current feeling (Xunzi)?

  **What Happens If You Tweak/Remove That Feature:**
  *   **Remove the Effortlessness (Make it hard):** If Alex still has to struggle to yield the spot, Xunzi wins easily. It clearly looks like training battling against nature. Mencius would struggle to explain why the "good nature" is still fighting itself.
  *   **Remove the History (Alex was always nice):** If Alex was always inclusive, Mencius wins easily. It looks like innate goodness. Xunzi would have to argue Alex is just hiding selfishness, which weakens the case.
  *   **Remove the Training (Alex just changed):** If there was no drill/program, Mencius argues it was moral awakening (nature revealing itself). Xunzi argues it was social pressure. The "second-nature" element disappears, turning it into a standard "change of heart" debate.

  **How Defenders Would Attack the Case:**

  *   **The Mencian Attack (Targeting the Definition of Nature):**
      A clever Mencian will attack the Xunzian definition of "original." They will argue that defining nature *only* as the selfish middle-schooler is too narrow. They'll say: "Your 'original nature' is just the unripe fruit. The fact that Alex *could* be trained so thoroughly that it became effortless proves the *seed* of cooperation was there all along. If human nature were truly selfish, no amount of training could make virtue feel like blinking. The ease proves the fit is natural."
      *   *Goal:* Redefine nature as the *potential endpoint* of cultivation, not the *starting point*.

  *   **The Xunzian Attack (Targeting the Definition of Artifice):**
      A clever Xunzian will attack the Mencian reliance on "feeling." They'll argue: "Feelings are unreliable indicators of ontology. A soldier trained to kill without hesitation doesn't have a 'natural' tendency to kill; they have a suppressed humanity and a hardened habit. Alex feels no resistance because the training successfully bypassed their critical faculty. The fact that Alex *needed* drills proves the nature was resistant. If it were truly natural, the drills wouldn't have been necessary to begin with."
      *   *Goal:* Insist that nature is defined by the *raw material* before the sculptor touches it, regardless of how beautiful the statue becomes.
