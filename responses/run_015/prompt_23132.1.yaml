  8.  *(Self-Correction during drafting)*: I should be careful not to present acausal trade as "proven" or universally accepted. It's a specific framework within decision theory (mostly associated with MIRI/LessWrong). I should frame it as "Within the framework of Functional Decision Theory..." to be accurate.

