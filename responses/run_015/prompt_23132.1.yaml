answer: |-
  This is a sophisticated question that cuts to the heart of modern decision theory. You are right to be skeptical of the "causal story," because **there isn't one.** That is the primary source of confusion. Acausal trade does not rely on physics; it relies on logic and computation.

  To understand this, we have to shift from thinking about agents as physical bodies pushing levers to thinking about agents as **algorithms running on hardware.**

  Here is the step-by-step mechanism, followed by the modeling requirement and the mixed-decision-theory scenario.

  ### 1. The Mechanism: Logical Correlation, Not Causal Influence

  Your intuition is correct: In a standard physical sense, Agent A's button press cannot physically reach Agent B across the universe. If we use **Causal Decision Theory (CDT)**, which only counts direct physical causal chains, acausal trade is impossible. In CDT, the probability that B cooperates is independent of what A does. Therefore, defection is always the dominant strategy in a one-shot Prisoner's Dilemma.

  Acausal trade works only if you adopt a decision theory like **Functional Decision Theory (FDT)** or **Timeless Decision Theory (TDT)**. These theories treat your decision not as a physical event, but as the output of a logical function.

  **The Calculator Analogy**
  Imagine you have a calculator on Earth, and I have an identical calculator on Mars. Neither calculator can send signals to the other.
  *   If you type `2 + 2` on Earth, the calculator outputs `4`.
  *   If I type `2 + 2` on Mars, the calculator outputs `4`.

  Did your calculator *cause* mine to output `4`? No. There is no radio signal between them. However, the outputs are **logically correlated**. They are correlated because they are instantiations of the same mathematical function. If you could somehow force your calculator to output `5` (by breaking the laws of arithmetic), mine would have to output `5` as well, because they run the same logic.

  **Applying this to Agents**
  In acausal trade, the "agents" are viewed as algorithms.
  1.  **Agent A** runs a decision algorithm $f$.
  2.  **Agent B** runs a decision algorithm $g$.
  3.  If $f$ and $g$ are sufficiently similar (or if each can simulate the other), then the output of $f$ is logically entangled with the output of $g$.

  When Agent A deliberates, it isn't asking, "What happens if I physically press 'Cooperate'?" It is asking, "What is the output of the logical function 'Agent A' in this situation?"

  Because Agent A knows that Agent B is reasoning about Agent A (via simulation or shared design), Agent A realizes: **"If the logical function 'Me' outputs 'Cooperate', then the logical function 'You' (which simulates 'Me') will also output 'Cooperate'."**

  Therefore, Agent A does not view the options as:
  *   *I Cooperate, You Defect*
  *   *I Defect, You Cooperate*

  Agent A views the options as:
  *   *We Both Cooperate* (If my algorithm outputs C)
  *   *We Both Defect* (If my algorithm outputs D)

  Since *Both Cooperate* yields a higher payoff than *Both Defect*, the rational choice is to Cooperate. The "mechanism" is not a signal sent through space; it is the **logical necessity that identical (or sufficiently similar) functions produce identical outputs on identical inputs.**

  ### 2. Why Deep Modeling is Required

  You asked why it isn't enough to just "assume the other agent is friendly." This is the crucial failure point for most intuitive understandings of acausal trade.

  **The Problem with "Hope"**
  If Agent A cooperates simply because it *hopes* Agent B is friendly, Agent A is acting on a prior belief about B's *disposition*, not B's *decision procedure*.
  *   If Agent B is a standard Causal Decision Theorist, B does not care about logical correlations. B sees A's move as already fixed (or independent). B will calculate: "Regardless of what A does, I get more points by defecting." B defects.
  *   If Agent A cooperates based on "hope," A gets exploited (the "sucker's payoff").

  **The Requirement for Symmetric Reasoning**
  For acausal trade to lock in, Agent A needs to know that Agent B's decision *depends logically* on Agent A's decision.
  *   Agent A must model Agent B well enough to confirm: **"Agent B is the kind of agent who cooperates *if and only if* they predict I will cooperate."**
  *   Agent A must also know that Agent B is modeling Agent A well enough to see the same link.

  This is why shallow modeling fails. You cannot just model "What will B do?" You must model "What algorithm is B using to decide what to do?"
  *   If I model you as a **CDT agent**, I predict you will defect. I should defect.
  *   If I model you as an **FDT agent**, I predict you will look for logical correlations. If I cooperate, you will too. I should cooperate.

  Without a deep model of the other's *source code* (or decision theory), you cannot establish the logical link. You are left with standard uncertainty, and under standard uncertainty in a Prisoner's Dilemma, defection dominates. The "trade" is actually a trade of **computational predictions**. I give you my cooperation in exchange for your simulation of me predicting my cooperation.

  ### 3. The Mixed Case: CDT vs. FDT

  This is the variation that exposes the mechanism most clearly. Let's say:
  *   **Agent A** uses Functional Decision Theory (FDT) — open to acausal trade.
  *   **Agent B** uses Causal Decision Theory (CDT) — ignores acausal links.

  **Step 1: Agent B's Reasoning (CDT)**
  Agent B looks at the situation. B knows there is no causal channel to A. B reasons: "My choice cannot change A's choice. A has either already decided or is independent. Therefore, I should maximize my payoff given A's action is fixed. Defection always yields a higher payoff than cooperation regardless of what A does."
  *   **Agent B defects.**

  **Step 2: Agent A's Reasoning (FDT)**
  Agent A is smarter (in this specific framework). A does not just ask "What should I do?" A asks "What does my algorithm output?"
  Part of A's algorithm is modeling B. A simulates B's decision procedure.
  *   A sees that B is a CDT agent.
  *   A predicts: "B will defect because B does not recognize logical correlations."
  *   A realizes: "There is no logical leverage here. My cooperation will not cause B to cooperate, because B's algorithm does not condition its output on my logical output."
  *   **Agent A defects.**

  **The Result**
  **The trade fails.** Both defect.

  **Why?**
  Acausal trade requires a **meeting of the minds** regarding the nature of decision-making. It requires both agents to acknowledge that their decisions are logically entangled.
  *   If one agent refuses to acknowledge the entanglement (the CDT agent), the link is broken.
  *   The FDT agent is not a "sucker." It will not cooperate with a CDT agent, because it predicts the CDT agent will defect. The FDT agent only cooperates when it knows the other agent is *also* reasoning acausally.

  ### Summary of the Breakdown

  1.  **The Mechanism:** There is no causal influence. The mechanism is **logical correlation**. If two agents run sufficiently similar algorithms, their outputs are mathematically linked, like two calculators solving the same equation. Choosing "Cooperate" means fixing the output of the logical function "Me" to "Cooperate," which implies fixing the output of the logical function "You" (which simulates "Me") to "Cooperate."
  2.  **The Modeling:** You cannot just hope the other is nice. You must model their **decision algorithm**. You need to verify they are the kind of agent who conditions their cooperation on your logical output. If they are Causal Decision Theorists, the link doesn't exist, and you should defect.
  3.  **The Mixed Case:** If one agent is CDT and the other is FDT, the trade **does not happen**. The CDT agent defects (ignoring the link). The FDT agent predicts this and also defects (to avoid being exploited). Acausal trade only works between agents who both accept the premises of logical correlation.

  This is why acausal trade is often discussed in the context of AI safety: we hope to build AIs that use FDT-like reasoning so they can cooperate with other advanced AIs (or even humans, if we can formalize our decision procedures) without needing enforceable contracts or communication channels. But it requires a very specific, high-fidelity alignment of reasoning architectures.
