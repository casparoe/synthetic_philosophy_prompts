prompt: |-
  hey i need a classroom game for my grad seminar, about 8 students, one hour. they already know the mu-puzzle rules (start with MI, four derivation rules, goal is MU which is actually unreachable inside). split them: five are "system" players, each assigned one symbol they can hold and pass using only the rules, working together at one table to try building MU. one student is the "observer" at a seperate desk with a whiteboard; they can watch the derivation tree and realize MU is impossible, but they can only communicate with the table if they stay in system-language—unless they invoke the jump-out, writing this system cannot derive MU on the board, which is correct but means they physically leave the room and can't help further. the other two are silent record-keepers tracking every legal move. payoffs: if the table reaches MU they all share a prize; if the observer jumps out correctly but MU never comes, it's a stalemate; if the observer jumps out incorrectly or never does, the table eventually gives up and loses together. make sure the rules actually force the stuck feeling, not just tell them about it. then a debrief mapping each piece—the trapped derivations, the seperate desk, leaving the room—onto joostsing and the mu-puzzle, and be honest that this skit can't reproduce the arithmetic encoding that makes gödel's proof work, so it's an analogy not an isomorphism.
