answer: |-
  This is an exceptionally clear articulation of a problem that has occupied moral philosophers for forty years. You have effectively re-derived Derek Parfit's **Non-Identity Problem** (from *Reasons and Persons*, 1984) through an engineering lens.

  You asked me to correct your framing, separate settled facts from live controversies, and give you a concrete recommendation for the software. I will address those in order.

  ### 1. Framing Corrections and Jargon Translation

  You are thinking about this as an engineering problem (matching keys, data resolution, function return values). In many ways, this is the correct approach, but your mental model contains three specific assumptions that a specialist would reject.

  **A. "Bug" vs. "Feature" (The Specification)**
  *   **Your framing:** You treat the empty register as a *bug* (unexpected behavior).
  *   **Philosophical reality:** This is a *feature* of the moral theory you hardcoded. Your function `is_harm(person_A, person_B)` relies on an invariant: `person_A.id == person_B.id`. When that invariant fails, your function returns `null`.
  *   **Correction:** The code is working correctly according to its specification. The specification implements what philosophers call the **Narrow Person-Affecting View**: *An act is wrong only if it makes some particular, identifiable person worse off.* The emptiness of the register is the logical output of that view when applied to identity-affecting choices. It is not a data error; it is a theoretical boundary condition.

  **B. "Resolution" (Determinism vs. Chaos)**
  *   **Your framing:** You suggest that with "fine-grained enough demographic and genetic model," you could track specific individuals across branches.
  *   **Philosophical/Physical reality:** This is physically impossible, not just a data horizon issue. Conception is highly sensitive to initial conditions (chaos theory). A policy that shifts a traffic light timing by 30 seconds changes who meets whom, changing conception times by minutes, which changes which sperm fertilizes which egg.
  *   **Correction:** You cannot resolve this with more compute. Over a century-long simulation, the correlation between specific genotypes in the "policy" branch and the "do-nothing" branch decays to zero almost immediately. Assuming you *could* match them implies a hard determinism that contradicts current physics and biology. This is not a solvable engineering constraint; it is a metaphysical wall.

  **C. "Identity Criterion" (Changing the Type)**
  *   **Your framing:** You consider matching by "social role" or "closest continuer."
  *   **Philosophical reality:** This is not changing a matching key; it is changing the **ontology** of your system. If you match by "social role" (e.g., "The Mayor of City X"), you are no longer comparing *people*; you are comparing *slots* or *positions*.
  *   **Correction:** If you implement this, you are silently switching your moral theory from a Person-Affecting View to an **Impersonal View** (comparing states of affairs rather than individual welfare). This is a valid move, but it is a policy decision, not a technical fix. It should not be hidden in a matching algorithm.

  ### 2. Epistemic Provenance: Settled vs. Contested

  You asked for explicit provenance. Here is the split between what is agreed upon and what is debated among ethicists who work on long-termism and population ethics.

  **Settled Consensus (High Confidence)**
  1.  **The Problem is Real:** There is near-universal agreement that the Non-Identity Problem is a valid logical challenge. The intuition that "no one is harmed" in identity-affecting cases clashes with the intuition that "the policy is worse."
  2.  **Compute Doesn't Help:** There is agreement that better forecasting cannot solve the metaphysical issue of different people existing.
  3.  **PAV Limitations:** There is broad consensus that the Narrow Person-Affecting View (your current code logic) yields counterintuitive results in long-term policy (e.g., it implies it is not wrong to deplete resources for the future, provided the resulting poor people still have lives "worth living").

  **Live Controversy (No Consensus)**
  1.  **The Solution:** There is **no agreed resolution** on how to fix the moral theory.
      *   *Impersonal Totalism:* Compare total welfare sums. (Rejected by many due to the "Repugnant Conclusion"—implying we should maximize population size even if quality of life is low).
      *   *Impersonal Averagism:* Compare average welfare. (Rejected because it implies killing unhappy people raises the average).
      *   *Wide Person-Affecting View:* An act is wrong if it causes someone to exist in a worse state than they *could* have been in (even if they wouldn't exist otherwise). (Contested because it stretches the definition of "harm").
      *   *Contractualism/Rights:* Focus on whether rights were violated, regardless of welfare comparison. (Contested on how to define rights for non-existent beings).
  2.  **The "Repugnant Conclusion":** You mentioned fearing "summing total welfare." You are right to be cautious. Most philosophers consider the Repugnant Conclusion a *reductio ad absurdum* of Total Utilitarianism, not a feature to be accepted. However, there is no consensus on which alternative theory avoids it while solving the Non-Identity Problem.

  ### 3. Answering Your Specific Questions

  **Q: Is the emptiness of my register a substantive moral finding, an artifact of a stipulation I happened to hardcode, or something in between?**
  **A:** It is an artifact of a stipulation you hardcoded (the Narrow Person-Affecting View), but that stipulation carries substantive moral implications. By keeping the code as is, you are effectively asserting that policies which change *who* exists cannot be morally worse than the status quo, provided the new people have lives worth living. That is a controversial moral claim, not a neutral engineering outcome.

  **Q: Would any amount of additional computing power or forecast resolution change that?**
  **A:** **No.** (High Confidence). Due to chaos theory in biological systems, you cannot map specific genotypes across divergent policy branches over a century. The set of people in Branch A and Branch B will be disjoint sets.

  **Q: Is there a defensible position in between [Person-Affecting and Total Aggregation]?**
  **A:** **Yes.** (High Confidence). There are several "middle ground" theories.
  *   **Sufficientarianism:** We have a duty to ensure people meet a threshold of well-being, rather than maximizing the sum.
  *   **Contractualism:** A policy is wrong if it could be reasonably rejected by those affected (even if they wouldn't exist otherwise, perhaps represented by proxies).
  *   **Risk-Based Approaches:** Focus on the *risk* of creating lives not worth living, rather than the comparison of specific lives.
  *   *Note:* None of these are "settled," but they are defensible positions held by serious scholars.

  **Q: Concretely, for the register: should I keep the harm condition as is... or is there a principled way to encode a comparison against the best feasible alternative policy?**
  **A:** Do not silently change the matching logic. That hides the moral assumption. Instead, change the **output type** to reflect the uncertainty.

  ### 4. Engineering Recommendation

  You are building a tool for human reviewers. Your goal is not to solve population ethics (which the world's best philosophers haven't done), but to prevent the software from misleading the reviewers.

  Currently, your function signature is effectively:
  `function assess_harm(policy, baseline) -> List<Harm>`

  When the register is empty for a long-term policy, the reviewer sees `[]` and infers `Morally Safe`. This is a false negative.

  **Recommended Fix: The "Non-Identity Flag"**

  Do not attempt to force a match (Fix 1) or change the identity key silently (Fix 2). Instead, treat the Non-Identity Problem as a **runtime exception** or a **warning state** that requires human override.

  1.  **Detect the Disjoint Set:** Your simulation already knows when the population sets diverge (when conception events shift).
  2.  **Return a Warning Object:** If the sets are disjoint, the function should not return an empty list. It should return a structured warning:
      ```typescript
      type AssessmentResult =
        | { status: "HARM_FOUND", harms: Harm[] }
        | { status: "NO_HARM", harms: [] }
        | { status: "NON_IDENTITY_GAP", message: "Policy alters identity of future population. Person-affecting harm comparison unavailable." };
      ```
  3.  **Change the Comparison Logic (Optional but Recommended):** If the team wants to evaluate these policies, you must change the comparison unit. Instead of `Person vs. Person`, compare `Aggregate Metrics vs. Aggregate Metrics`.
      *   *Implementation:* Allow the reviewer to select a "Metric Profile" (e.g., Average Wellbeing, Minimum Wellbeing, Gini Coefficient of Health).
      *   *Crucial:* The UI must explicitly state: *"You are now comparing State A vs. State B, not Person A vs. Person B. This assumes an Impersonal Moral View."*

  **Why this is the right engineering choice:**
  *   **Invariant Preservation:** You acknowledge that `Person.id` matching fails without lying about it.
  *   **Type Safety:** You force the caller (the reviewer) to handle the `NON_IDENTITY_GAP` case. They cannot treat it as "No Harm."
  *   **Epistemic Humility:** You do not hardcode a controversial moral solution (like Total Utilitarianism) into the backend. You expose the trade-off to the human decision-maker.

  ### Summary of Advice

  1.  **Do not spend a sprint on "Resolution" (Fix 1).** It is physically impossible to track specific genotypes over a century of divergent simulations. That is a dead end.
  2.  **Do not implement "Social Role" matching (Fix 2) silently.** That hardcodes a controversial philosophical stance (Impersonal View) without the stakeholders' knowledge.
  3.  **Do implement a "Non-Identity Gap" flag.** Treat the emptiness of the register as a **missing data warning**, not a zero-harm result.
  4.  **Provide Aggregate Comparisons as a Separate Feature.** If the team wishes to compare policies that shift identity, let them compare *distributions* of welfare (e.g., "10% of population below health threshold") rather than *individual* harms. Label this clearly as a different moral mode.

  **Final Verdict:** The emptiness of your register is a **logical consequence of a specific moral axiom** (Person-Affecting View), not a bug in the code, but it is a **bug in the user interface** if it leads reviewers to believe the policy is harmless. Fix the UI/UX to surface the philosophical limitation, rather than trying to patch the moral theory in the backend.
