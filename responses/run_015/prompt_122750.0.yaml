  # RESEARCH PROPOSAL

  **Title:** Decomposing Equality: A Conceptual Audit of the Gender-Equality Paradox
  **Applicant:** [Your Name]
  **Duration:** 10 Months

  ### 1. The Research Question
  The "Gender-Equality Paradox" (GEP) refers to the observation that nations with higher scores on gender-equality indices often exhibit *greater* gender segregation in STEM fields, not less. This correlation is frequently mobilized to support essentialist claims about innate preference differences.

  This project asks: **Does the Gender-Equality Paradox persist when the independent variable ("gender equality") is decomposed into legal, material, and normative dimensions, and when the dependent variable ("career choice") is distinguished from retention and intra-field equity?**

  This question has a determinate answer. Either the correlation holds across all decomposed dimensions of equality, or it is driven by specific subsets (e.g., material security vs. cultural norms). If the latter, the inference from "national index" to "individual nature" is invalid.

  ### 2. Background and The Shared Assumption
  Current debate is polarized between three positions:
  1.  **The Nature Reading:** High equality allows "true" innate preferences to emerge; women prefer people-oriented fields, men thing-oriented fields.
  2.  **The Socialization Reading:** High equality societies still harbor subtle stereotypes that steer choices, or the indices measure the wrong things.
  3.  **The Justice Reading:** Equality of opportunity does not require equality of outcome; skewed choices are compatible with a just society.

  **The Shared Assumption:** All three positions treat "Gender Equality" as a unidimensional scalar variable. They assume that a high score on a composite index (like the WEF Global Gender Gap Index) represents a uniform environment where barriers are removed, security is guaranteed, and norms are neutral. They further assume that the *share of graduates* is a sufficient proxy for *preference* or *justice*.

  **The Problem:** This treats a cluster concept as a natural kind. "Equality" in these indices bundles:
  *   **(A) Legal/Political Removal of Barriers:** Formal rights and representation.
  *   **(B) Material Security:** Welfare states that make risky/low-pay careers survivable.
  *   **(C) Cultural Norms:** Informal expectations about masculinity/femininity.

  These dimensions can come apart. A country can have high (A) and (B) but stagnant (C). If the GEP is driven primarily by (B)—where security allows anyone to follow *any* preference, including stereotyped ones—then using it to argue for (C)-based innate differences is a category error. Furthermore, measuring "choice" via graduation rates ignores retention, pay gaps within fields, and the division of invisible labor. The current debate suffers from **construct invalidity** (the index doesn't measure the theoretical concept) and **ecological fallacy** (inferring individual psychology from country-level aggregates).

  ### 3. Methodology
  This is a project in the **philosophy of social science**, specifically focusing on conceptual engineering and inference validity. It is not a new empirical study, but a systematic re-evaluation of existing empirical inferences.

  **Phase 1: Conceptual Mapping (Months 1–3)**
  *   **Task:** Rigorously define the three dimensions of equality (Legal, Material, Normative) and the four dimensions of outcome (Entry, Retention, Pay, Invisible Labor).
  *   **Output:** A "Conceptual Matrix" mapping existing major GEP studies against these definitions.
  *   **Justification:** Pure armchair philosophy cannot engage the GEP because the claim is empirical. Pure empirical re-analysis is beyond the scope of a philosophy fellowship and risks amateur econometrics. This phase establishes the *categories* required to read the data correctly.

  **Phase 2: Inference Auditing (Months 4–7)**
  *   **Task:** Select 5–10 key papers supporting the GEP. I will not re-run regressions. Instead, I will analyze the *operationalization* of variables. I will examine codebooks and supplementary materials of the cited datasets (e.g., PISA, WEF) to determine which sub-indices drive the correlation.
  *   **Collaboration:** I will work with my supervisor (labour economics) to interpret the statistical tables, focusing on how controls for GDP or welfare spending alter the coefficient of the "equality" variable.
  *   **Justification:** This leverages philosophical training (identifying category errors and validity threats) without requiring me to pass as an econometrician. It answers *why* the correlation exists, not just *if*.

  **Phase 3: Normative & Policy Implications (Months 8–10)**
  *   **Task:** Draft the final thesis and the policy deliverable.
  *   **Focus:** Translate the conceptual distinctions into intervention logic. If the paradox is driven by Material Security, then outreach programs targeting "norms" are misallocated resources.
  *   **Writing:** Finalize the dissertation.

  **Why this method?**
  *   **Vs. Pure Desk Review:** Standard literature reviews summarize conclusions. This project evaluates the *validity of the inference chain*. It treats the papers as objects of philosophical analysis.
  *   **Vs. New Regression:** Learning sufficient statistics to outperform labour economists in one year is unrealistic and distracts from the core philosophical contribution: clarifying the concepts that make the statistics meaningful.

  ### 4. Deliverables
  1.  **Dissertation:** A rigorous argument demonstrating where the GEP inference breaks down conceptually.
  2.  **The "Equality Audit" Framework:** A practical tool for funding bodies and university outreach programs.
      *   *Usage:* Before launching a "Women in STEM" initiative, administrators use the framework to diagnose the bottleneck. Is the barrier Legal (rare), Material (need stipends/security), or Normative (need mentorship/culture change)?
      *   *Value:* Prevents the misapplication of GEP findings (e.g., "don't bother recruiting, it's just nature") by showing which specific dimension of equality is actually correlating with the outcome.

  ### 5. Risk Assessment and Feasibility
  **Potential Failure Mode 1: The Paradox is Robust.**
  If I decompose the indices and the correlation holds for *all* dimensions (Legal, Material, and Normative), the conceptual argument weakens.
  *   *Mitigation:* The project still succeeds by refining the *interpretation*. Even if the correlation holds, I can still argue against the Ecological Fallacy (country-level data $\neq$ individual nature). The deliverable shifts from "debunking" to "cautioning against over-interpretation."

  **Potential Failure Mode 2: Scope Creep.**
  Attempting to analyze too many datasets or indices.
  *   *Mitigation:* I will restrict the analysis to the two most cited indices in the GEP literature (e.g., WEF and ESS) and the top 5 most cited papers. Depth over breadth.

  **Potential Failure Mode 3: Empirical Obsolescence.**
  New papers may emerge during the year challenging the GEP empirically.
  *   *Mitigation:* This strengthens the project. My framework provides the *conceptual vocabulary* to explain *why* the new empirical results differ (e.g., "The new study controls for Material Security, which my framework identifies as the confounding variable").

  **Feasibility:**
  The project relies on existing, open-access datasets and published literature. The primary workload is reading, conceptual mapping, and writing, which fits a one-year humanities/social science masters timeline. The supervisor's expertise covers the economic interpretation, leaving me to focus on the philosophical validity.

  ### 6. Conclusion
  The Gender-Equality Paradox is currently a stalemate between essentialism and constructivism. This project moves the debate forward not by generating new data, but by clarifying the concepts used to interpret existing data. By showing that "equality" is not one thing, and "choice" is not one metric, we can stop asking "Is it nature or nurture?" and start asking "Which specific barriers remain, and for whom?" This shifts the discussion from metaphysical speculation to actionable policy design.
