  *Adjustment:* In the proposal, I have framed the project not as "dissolving the paradox" (which assumes it's false) but as "testing the robustness of the inference" (which allows for the possibility that the paradox holds for *some* dimensions but not others). This protects you if the empirical literature shifts.

