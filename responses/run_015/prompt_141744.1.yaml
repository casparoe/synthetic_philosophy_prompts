      *   *Step 4: Reproduction Mechanism.* (Internal vs External).
      *   *Step 5: Evolutionary Potential.* (Error rate).
      *   *Step 6: The Value Call.*

      *   *Wait, one nuance:* The RNA case. It replicates. Why isn't it alive? Because it doesn't make its own boundary or energy. It's a gene without a body.
      *   *The 3D Printer:* It makes copies. Why isn't it alive? It doesn't make *itself* (the printer). It makes *products*. And it doesn't repair itself.
