answer: |-
  Here is a decision procedure designed for your committee's specific constraints. It is written to be photocopied and used during a meeting. It prioritizes biosafety risk (propagation and containment) over metaphysical purity, while acknowledging where the science ends and policy begins.

  ### The Novel-Entity Status Procedure (NESP)

  **Instructions:** Run through steps 1–5 in order. If any step yields a definitive **NO**, stop and classify as **Non-Living Construct** (unless Step 3 applies). If all pass, proceed to Step 6.

  **Step 1: The Boundary Test (Observation Window: 30 Days)**
  *Question:* Does the entity maintain a distinct physical boundary (membrane, shell, wall) that separates an "inside" from an "outside," and does it actively repair or maintain that boundary using resources from the environment?
  *   **Yes:** It creates/repairs its own container. (Proceed to Step 2)
  *   **No:** It relies on an external container (e.g., a test tube, a lipid vesicle supplied by us, a chassis) that it does not repair or regenerate.
      *   *Verdict:* **Non-Living Construct.** (Stop)
  *   *Note:* This distinguishes a cell (makes its own membrane) from a virus or RNA strand (uses host machinery) or a machine (built by us).

  **Step 2: The Metabolic Test (Observation Window: 30 Days)**
  *Question:* Does the entity convert external energy sources (chemical, light, thermal) into work to maintain its internal state against entropy (e.g., fixing damage, pumping ions, moving), without direct human intervention for each action?
  *   **Yes:** It burns fuel to stay ordered. (Proceed to Step 3)
  *   **No:** It is static, or movement/change is purely passive (e.g., diffusion, wind, external power supply).
      *   *Verdict:* **Non-Living Construct.** (Stop)

  **Step 3: The Dormancy & Reversibility Check (Addressing the Freezer Case)**
  *Question:* If the entity is currently inactive (no boundary maintenance, no metabolism), is there evidence that this state is reversible *by the entity's own internal machinery* once conditions improve, without requiring external reconstruction?
  *   **Yes:** (e.g., spores, freeze-dried bacteria, seeds). It is **Living (Dormant).** Treat as Living for permitting. (Proceed to Step 4)
  *   **No:** (e.g., a dead cell, a dried protein crystal, a powered-off robot). It is **Non-Living.** (Stop)
  *   *Crucial Distinction:* A freeze-dried bacterium restarts itself. A dead bacterium does not. A robot turned off needs a human to flip the switch; a seed needs only water/heat.

  **Step 4: The Propagation Capacity Test (Addressing the Engineer's Objection)**
  *Question:* Does the *design type* of this entity contain an internal mechanism for producing new entities of the same type, regardless of whether *this specific token* is currently reproducing?
  *   **Yes:** (e.g., a sterile mule, a non-dividing neuron, a bacterium in starvation mode). The *blueprint* allows for copies.
      *   *Verdict:* **Living Organism.** (Proceed to Step 5)
  *   **No:** (e.g., a sterile engineered cell line, a somatic tissue aggregate, a machine that makes *parts* but not *machines*). The *blueprint* is a dead end.
      *   *Verdict:* **Biological Construct / Non-Living.** (Stop)
  *   *Reasoning:* This addresses the engineer's point. A mule is alive because it belongs to a reproductive lineage. A sterile synthetic cell line is a "biological chemical" because the design itself prevents spread. For biosafety, "Organism" implies "Potential to Spread."

  **Step 5: The Evolutionary Proxy Test (Addressing the 30-Day Constraint)**
  *Question:* Inspect the copying mechanism. Is the replication process subject to stochastic error (mutation) that is not corrected by an external agent (us)?
  *   **Yes:** (e.g., DNA/RNA polymerase with natural error rates). It *can* evolve.
      *   *Verdict:* **Living Organism.** (Proceed to Step 6)
  *   **No:** (e.g., 3D printing from a fixed file, templated copying with perfect error correction). It is static.
      *   *Verdict:* **Non-Living Construct.** (Stop)
  *   *Note:* We cannot wait for evolution. We inspect the *machinery*. If the copying is digital/perfect, it cannot adapt. If it is chemical/stochastic, it can.

  **Step 6: The Value Call (The "Hand-Wash" Step)**
  *Instruction:* If the entity has passed Steps 1–5, it is scientifically "Living." However, the committee must now vote on **Regulatory Status**.
  *   *Question:* Does the "Living" status pose a containment risk distinct from chemical toxicity?
  *   *Action:* If Yes, full containment permit. If No (e.g., it is living but strictly auxotrophic and cannot survive outside our lab media), you may downgrade the permit, but you must record the justification as a **Policy Decision**, not a scientific fact.
  *   *Why:* This is where you admit to the biosafety officer that science got you to the edge, but safety policy drives the car.

  ***

  ### Application to Your Five Cases

  **1. Self-replicating RNA in cell-free extract**
  *   **Step 1 (Boundary):** **NO.** It has no membrane of its own; it floats in the extract's soup. It does not build a boundary.
  *   **Verdict:** **Non-Living Construct.**
  *   *Reasoning:* It is a parasitic instruction set, not an organism. It relies on the extract's boundary and energy.

  **2. Aggregate of frog cells (swims, heals, dies, no reproduction)**
  *   **Step 1 (Boundary):** **YES.** Cell membranes hold it together; it maintains integrity.
  *   **Step 2 (Metabolism):** **YES.** It swims and heals, requiring energy conversion.
  *   **Step 3 (Dormancy):** N/A (Active).
  *   **Step 4 (Propagation):** **NO.** You stated it "eventually dies out without ever reproducing." The *design* (somatic tissue) lacks a germline or division mechanism.
  *   **Verdict:** **Biological Construct.** (Not a Living Organism for permitting).
  *   *Reasoning:* This validates the engineer's concern. It is biologically active tissue, but for regulatory purposes, it is a "dead end." It cannot spread.

  **3. Freeze-dried bacterial stock (-80°C)**
  *   **Step 1 (Boundary):** **PAUSED.** (Structure exists, active maintenance halted).
  *   **Step 2 (Metabolism):** **PAUSED.**
  *   **Step 3 (Dormancy):** **YES.** Bacterial spores or freeze-dried cells resume metabolism when rehydrated/warmed using *their own* machinery. You do not have to rebuild the cell; you just wake it up.
  *   **Step 4 (Propagation):** **YES.** The design is bacterial.
  *   **Verdict:** **Living Organism (Dormant).**
  *   *Reasoning:* This lands where you wanted it. The "Reversibility" clause in Step 3 saves it. It distinguishes a paused life from a dead brick.

  **4. Transmissible cancer cell line**
  *   **Step 1 (Boundary):** **YES.** Cell membranes.
  *   **Step 2 (Metabolism):** **YES.** High metabolic rate.
  *   **Step 3 (Dormancy):** N/A.
  *   **Step 4 (Propagation):** **YES.** It divides and transmits between hosts.
  *   **Step 5 (Evolution):** **YES.** Cancer cells are genetically unstable; they evolve resistance.
  *   **Verdict:** **Living Organism.**
  *   *Reasoning:* It is a parasitic lineage. It meets all criteria, including the risk of evolution.

  **5. Self-replicating 3D-printed machine**
  *   **Step 1 (Boundary):** **NO.** It does not build its own chassis; it prints *other* machines or parts. It does not repair its own wear-and-tear autonomously.
  *   **Step 2 (Metabolism):** **NO.** It uses electricity, but not to maintain internal order against entropy (e.g., self-healing materials); it uses it to work.
  *   **Step 4 (Propagation):** **YES.** (It makes copies).
  *   **Verdict:** **Non-Living Construct.**
  *   *Reasoning:* It fails the "Self-Maintenance" test (Steps 1 & 2). It is *allopoietic* (makes other things), not *autopoietic* (makes itself).

  ***

  ### Where This Procedure Will Misfire

  1.  **The "Slow Death" Problem:** In Step 3 (Dormancy), there is a gray zone between "dormant" and "dead." If a freeze-dried bacterium has 1% viability, is it living? The procedure forces a binary choice.
      *   *Risk:* You might classify a mostly-dead culture as "Living" and over-regulate, or a viable-but-slow one as "Dead" and under-regulate.
      *   *Mitigation:* Treat "viability >0%" as Living for safety. Better safe than sorry.

  2.  **The "Engineered Sterility" Loophole:** In Step 4, if a lab engineers a bacterium that is 99.9% sterile but has a 0.1% reversion rate, the procedure asks about the "design type." If the design says "sterile," you might mark **NO**.
      *   *Risk:* False negative on containment.
      *   *Mitigation:* In Step 5 (Evolution), ask if the sterility mechanism itself can mutate away. If yes, treat as Reproductive.

  3.  **The "Symbiote" Problem:** If you have a system where Entity A provides the boundary and Entity B provides the metabolism (a forced symbiosis), Step 1 might fail for B and Step 2 might fail for A.
      *   *Risk:* You might rule the *pair* as non-living because neither fits the definition alone.
      *   *Mitigation:* Evaluate the *system* as the entity, not the components.

  ### Confidence and Doubt

  *   **Confidence in Steps 1 & 2 (Boundary/Metabolism):** **High.** These are observable, physical facts within your 30-day window. They distinguish rocks from cells reliably.
  *   **Confidence in Step 4 (Propagation):** **Medium-High.** This solves the mule/sterile objection logically, but relies on trusting the lab's description of the "design."
  *   **Confidence in Step 5 (Evolution Proxy):** **Medium.** Inferring long-term evolutionary capacity from short-term error rates is an extrapolation. It is the best you can do in 30 days, but it is an inference, not a measurement.
  *   **Confidence in Step 3 (Dormancy):** **Low-Medium.** This is the most philosophically fraught step. Distinguishing "paused life" from "stable matter that can be jump-started" is tricky.
  *   **The Step I Am Least Sure About:** **Step 3 (The Dormancy & Reversibility Check).**
      *   *Why:* It relies on a counterfactual ("*If* conditions improve..."). You are not observing life; you are observing the *potential* for life based on past data or literature. If your freeze-dried bacteria have been in the freezer for 50 years and never wake up, were they alive? The procedure says "Yes" if the *type* can wake up, but for *this specific tube*, it might be a guess. This is where your biosafety officer might push back, because you are certifying a capacity you haven't currently observed.

  ### Final Note for the Committee
  When you hand this to the biosafety officer, emphasize **Step 6**. Make it clear that Steps 1–5 are scientific filters, but Step 6 is where you accept liability. If the procedure says "Non-Living" but the thing looks suspiciously like it could escape and cause trouble, use Step 6 to override and apply the permit. The procedure is a shield for clear cases, not a straitjacket for risky ones.
