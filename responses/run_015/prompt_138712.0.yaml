answer: |-
  # Diagnostic Decision Tree: The Basic Argument & Its Exits

  **Instructions:** Answer each question based on your immediate intuition about the case described. Do not worry about which philosophical position your answer implies. Follow the arrow corresponding to your response.

  ### Node 1: The Ultimacy Filter
  **Premise:** *I grant that no agent can be the ultimate, self-originating source of her own character.*
  *   **No:** I reject this premise; agents can be ultimate sources.
      *   → **LEAF A: Libertarian Incompatibilist.** (Exit the tree; this seminar focuses on the consequences of accepting the premise).
  *   **Yes:** I accept this premise.
      *   → **Go to Node 2.**

  ### Node 2: The Generalization Worry
  **Case:** *The Mathematician.* A mathematician proves a difficult theorem. Her cognitive faculties are determined by prior causes. If the Basic Argument holds, does she deserve *epistemic credit* for the proof in the same way she would fail to deserve *moral blame* for a crime?
  *   **Yes:** The argument undermines credit, authorship, and reasoning itself.
      *   → **LEAF B: Global Skeptic (Proves Too Much).** *Awkward Commitment:* "We must suspend judgment on the validity of our own reasoning processes."
  *   **No:** The argument bites only on moral responsibility/desert, not epistemic credit or authorship.
      *   → **Go to Node 3.**

  ### Node 3: The Closed Loop of Endorsement
  **Case:** *The Converted Zealot.* An agent's deepest values were formed by a process she had no hand in (e.g., childhood conditioning). However, her subsequent reflective endorsement of them is total, unconditional, causally effective, and itself a product of those very values. Is she morally responsible for actions flowing from these values?
  *   **No:** Endorsement is insufficient if the loop is closed by external causes.
      *   → **Go to Node 6.**
  *   **Yes:** Structural coherence (the mesh) is sufficient for responsibility.
      *   → **Go to Node 4.**

  ### Node 4: The Authored Agent
  **Case:** *The Engineered Planner.* A system (AI or cult-raised child) whose dispositions were deliberately engineered by others now acts from those dispositions coherently and reasons-responsively. Given your answer to Node 3, is *this* agent responsible?
  *   **No:** History matters; engineered origins undermine responsibility even with coherence.
      *   → **LEAF C: Historical Compatibilist / Revisionist.** *Awkward Commitment:* "Two agents internally identical differ in responsibility solely due to unobservable past causes."
  *   **Yes:** Current structure matters; history is irrelevant.
      *   → **Go to Node 5.**

  ### Node 5: The Unchosen Attitude
  **Case:** *The Spontaneous Contempt.* An agent feels a sudden, unchosen contempt for a stutterer. She did not choose the belief, nor could she have suppressed it in the moment, but it expresses her deep evaluative stance. Is she blameworthy for the attitude itself?
  *   **No:** Responsibility requires voluntary control (Volitionism).
      *   → **LEAF D: Guidance Control / Mesh Theorist.** *Awkward Commitment:* "A happy slave who identifies with her chains is as responsible as a free citizen."
  *   **Yes:** Responsibility tracks attribution of self, not control (Answerability).
      *   → **Go to Node 9.**

  ### Node 6: The Desert Requirement
  **Question:** Given your skepticism in Node 3 (that endorsement is insufficient), do you believe anyone ever *deserves* suffering or reward in a basic, non-consequentialist sense?
  *   **Yes:** Basic desert exists despite the lack of ultimacy.
      *   → **LEAF E: Metaphysical Optimist (Unnamed).** *Awkward Commitment:* "Agents deserve retribution even if they could not have been ultimately otherwise." (Note: This cell is rarely occupied).
  *   **No:** Basic desert is incompatible with the lack of ultimacy.
      *   → **Go to Node 7.**

  ### Node 7: Forward-Looking Practices
  **Question:** If basic desert is abandoned, should we retain practices of blaming, punishing, and praising solely for safety, reform, or social regulation?
  *   **No:** These practices are inherently retributive and must be abandoned.
      *   → **LEAF F: Hard Eliminativist.** *Awkward Commitment:* "We must dismantle the criminal justice system and interpersonal blame entirely."
  *   **Yes:** We retain the practices but change the justification.
      *   → **Go to Node 8.**

  ### Node 8: Reactive Attitudes
  **Question:** Are our reactive attitudes (resentment, gratitude, indignation) ineliminable features of human life, or can they be theoretically revised?
  *   **Yes, Ineliminable:** We cannot help but feel them, even if they lack metaphysical grounding.
      *   → **LEAF G: Strawsonian Naturalist.** *Awkward Commitment:* "We are committed to a practice we know is metaphysically groundless."
  *   **No, Revisable:** We can and should modify these attitudes to align with the truth.
      *   → **Go to Node 9.**

  ### Node 9: The Justification Source
  **Question:** You retain responsibility practices without desert. What is the primary function of holding someone responsible?
  *   **A:** To hold them to a normative demand for reasons (Answerability).
      *   → **LEAF H: Quality-of-Will / Answerability Theorist.** *Awkward Commitment:* "You are blameworthy for things you could not possibly have prevented."
  *   **B:** To render the agent's will intelligible to the community (Legibility).
      *   → **Go to Node 10.**

  ### Node 10: The Legibility Split
  **Question:** Is the goal of responsibility to *demand* reasons from the agent, or to *make sense* of the agent for the community?
  *   **Demand:** The dyadic relationship of calling to account is primary.
      *   → **LEAF H: Quality-of-Will / Answerability Theorist.** (See above).
  *   **Make Sense:** The hermeneutic activity of interpretation is primary.
      *   → **LEAF I: Legibility Conception.** *Awkward Commitment:* "A psychopath is responsible if we can understand them, even if they lack empathy."

  ---

  ### Commentary on the Tree Structure

  #### 1. The Legibility Conception: Collapsed or Unoccupied?
  This cell is **genuinely unoccupied**, but it is precarious.
  *   **Why it is distinct:** Most theories are either *normative* (Answerability: you owe us reasons) or *naturalistic* (Strawson: we can't help but feel resentment). The Legibility Conception is *hermeneutic*: responsibility is the activity of making an agent's will intelligible to a community. It does not require the agent to *owe* reasons (avoiding the Answerability collapse) nor does it rely on ineliminable emotions (avoiding the Strawsonian collapse).
  *   **Why it is precarious:** If "making intelligible" cashes out as "predicting behavior," it collapses into Forward-Looking Eliminativism. If it cashes out as "sharing normative attitudes," it collapses into Strawsonianism. To remain distinct, it must argue that *interpretation* is a value independent of prediction and independent of emotional engagement.

  #### 2. Unoccupied or Incoherent Combinations
  *   **Responsible for Unchosen Attitudes + Requires Ultimate Origination:** (Incoherent). If you require ultimate self-origination (Libertarianism), you cannot hold agents responsible for spontaneous, unchosen attitudes, as these are by definition not ultimately originated.
  *   **Eliminativist about Desert + Retains Retributive Punishment:** (Incoherent). Retribution *is* the infliction of suffering based on desert. One cannot eliminate the justification while retaining the practice under the same description.
  *   **Historical Compatibilist + Responsible for Authored Agent:** (Unoccupied/Unattractive). If you believe history matters (Node 4), you generally cannot hold the Engineered Planner responsible. Those who say "Yes" to Node 4 are typically Structuralists (Mesh/Deep Self). There is virtually no literature defending a Historical view that simultaneously accepts engineered agents as responsible.

  #### 3. Indistinguishable Leaves
  *   **Strawsonian Naturalist (Leaf G) vs. Legibility Conception (Leaf I):** These are difficult to separate empirically. If the "community intelligibility" of Leaf I relies on human nature to ground what counts as intelligible, it becomes a cognitive version of Strawson's naturalism. The tree separates them at Node 10 based on *purpose* (emotional engagement vs. interpretation), but in practice, these often travel together.
  *   **Revisionist (Leaf C) vs. Eliminativist/Forward-Looking (Leaf F via Node 7):** If the "new justification" for the Revisionist is purely utilitarian (safety/reform), the view is functionally identical to the Forward-Looking Eliminativist. The distinction holds only if the Revisionist claims a *non-utilitarian* value (e.g., civic standing) that the Eliminativist rejects. The tree assumes this distinction at Node 7, but students often conflate them.
