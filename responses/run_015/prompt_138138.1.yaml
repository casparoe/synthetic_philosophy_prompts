  The idea in plain words
  Participants should feel the tension between security and opportunity. In one context, avoiding loss feels vital; in another, chasing gain feels rational. The activity forces a collision: the logic used to secure safety in the first case undermines the logic used to chase gain in the second. They should leave sensing that their choices depend on framing (guaranteed vs. risky) and accountability (self vs. other), not just the final wealth. The discomfort they feel when comparing their own answers is the lesson.

  Setup, materials and stakes
  Fourteen chairs, whiteboard, markers. Each participant needs a slip of paper and pen. Prepare six distinct scenarios for yourself. Stakes: One $10 bookshop voucher per round. Explain: "We play six rounds. At the end, I roll a die to pick one round. If you chose the winning option in that round, you get a voucher." Emphasize anonymity on slips. No calculators. Use "100 tickets in a bag" imagery for all probabilities to avoid percentage math. Display the vouchers visibly to ensure trust.

  The rounds, as I would read them out
  "Read each scenario slowly. Give participants one minute to write and fold. Collect slips in a box immediately. No discussion between rounds.

  Round 1: 'Staff Bonus. Imagine a bag with 100 tickets. Option A: All 100 win $10. Option B: 90 win $10, 10 win $50. Choose A or B.' Write on board: A [100x$10] | B [90x$10, 10x$50]. Emphasize 'All' for A.

  Round 2: 'Coin Flip. Simple hedge. Heads $5, Tails $15. Choose H or T.' Write: H [$5] | T [$15].

  Round 3: 'Town Raffle. Bag C: 10 tickets win $10, 90 blank. Bag D: 10 tickets win $50, 90 blank. Choose C or D.' Write: C [10x$10] | D [10x$50]. Emphasize 'Blank' tickets.

  Round 4: 'For a Partner. Choose for your left neighbor. You risk nothing. Same options as Round 1. Write A or B.' Write: Partner: A | B.

  Round 5: 'Sell Option. You own Bag D from Round 3. What guaranteed cash makes you keep cash instead? Write the $ amount.' Write: Cash $___ | D [10x$50].

  Round 6: 'Revised Raffle. Bag E: 11 tickets win $45. Bag F: 10 tickets win $50. Choose E or F.' Write: E [11x$45] | F [10x$50]. Say 'Odds are nearly identical.'

  Remind them: 'One round counts for real vouchers.'"

  Timeline
  0-10 mins: Introduction, stakes explanation, display vouchers.
  10-40 mins: Rounds 1-6 (5 minutes each: read, think, write, collect).
  40-50 mins: Collection box shuffle, public die roll to select the paying round, announce winners.
  50-90 mins: Debrief. Reveal the structural links between rounds. Group discussion on why choices shifted. Compare bids and delegated choices.

  Debrief
  Reveal that Round 1 and Round 3 are structurally linked: choosing Safety in 1 implies choosing Safety in 3. If they picked A then D, ask them to explain the switch without using math. This exposes the certainty effect. Use Round 4 (Delegate) to test your regret hypothesis: did they gamble more for others because they spare themselves the comparison of 'what could have been'? Use Round 5 (Bids) to measure the magnitude of the certainty premium; if bids are far below expected value, it's not just distrust. Use Round 6 (Near-Miss) to test probability distrust: if the 1% shift changes choices wildly, they are scrutinizing numbers; if not, they are following intuition. This separates your three explanations.

  What will go wrong
  Participants may spot the pattern between Round 1 and 3 too early. Counter this by heavily emphasizing the different stories (Bonus vs. Raffle) and wiping the board clean between rounds. Some may struggle with the "100 tickets" visual if they fixate on percentages; keep drawing boxes on the whiteboard to represent the bags. Skepticism about the payout is common; show the physical vouchers at the start. If the math in Round 6 (11x45) causes paralysis, reassure them that exact calculation isn't required, just intuition.

  What the activity cannot show
  The activity demonstrates descriptive inconsistency, not normative error. It shows people *do* contradict themselves, but not why they *shouldn't*. You must supply the philosophical argument yourself: that consistent rules prevent exploitation (money pumps) and ensure fairness. The activity cannot prove that expected utility is the correct moral standard, only that human intuition violates it.
