answer: |-
  ### 1. Exam Question

  **Course:** Decisions Under Constraints (Seminar VIII)  
  **Assessment:** Final Take-Home Examination  
  **Time Allowed:** 90 Minutes  
  **Total Marks:** 20

  **Instructions:** Answer all three parts. You may not consult external resources. Define any technical terms you use. Your grade depends on the philosophical precision of your arguments, not just the correctness of your examples.

  **The Agent: Searcher-R**  
  Searcher-R faces a sequence of options presented one at a time. The order is exogenous (R cannot control it). For each option, R pays a fixed cost $c$ to inspect it, revealing a utility value $U$. R maintains an aspiration level $A$, initially $A_0$.
  1.  **Acceptance Rule:** R accepts the first option where $U \ge A$.
  2.  **Success Update:** Upon acceptance, $A$ updates to $\max(A, \beta \cdot U)$, where $0 < \beta < 1$. (Aspiration ratchets based on success but never falls below its current level).
  3.  **Failure Update:** If R inspects $m$ consecutive options without accepting, $A$ decreases by $\delta$ (floor $A_0$).

  **Part 1: Order Dependence (6 Marks)**  
  Construct a minimal concrete example (specific values for $A_0, \beta$, and two options $X, Y$) demonstrating that Searcher-R might accept option $X$ in one presentation order but reject $X$ in another. Explain why an agent maximizing a **fixed ranking over options** (a static preference order) cannot exhibit this behaviour.

  **Part 2: The Optimization Defense (6 Marks)**  
  A colleague argues: "Searcher-R is just an optimizer. If you add the cost of search $c$ into the objective function, there exists some cost value that makes R's stopping rule optimal. Therefore, satisficing is trivial; it is just optimization with hidden parameters."  
  Evaluate this claim. Does the existence of a cost parameter that *represents* R's behaviour mean R is actually *prescribing* an optimal policy? Discuss the risk of **unfalsifiability** in this defense.

  **Part 3: Criteria for Rationality (8 Marks)**  
  To call Searcher-R "rational," what standard must we apply? Distinguish between **procedural rationality** (internal consistency/feasibility) and **substantive rationality** (outcome quality). Specifically, address:
  1.  Whose computation must be feasible: the analyst's or the agent's? (**First-person vs. Third-person**).
  2.  Whether rationality is a property of the mind alone or a relation between the mind and the environment (**Ecological Rationality**).

  ***

  ### 2. Model Answer

  **Part 1**  
  Let $A_0 = 50, \beta = 0.9$. Option $X$ has $U=60$; Option $Y$ has $U=80$.  
  *Order 1 (X, then Y):* R inspects $X$. $60 \ge 50$, so R accepts $X$. Aspiration updates to $\max(50, 0.9 \cdot 60) = 54$. $Y$ is never seen.  
  *Order 2 (Y, then X):* R inspects $Y$. $80 \ge 50$, so R accepts $Y$. Aspiration updates to $\max(50, 0.9 \cdot 80) = 72$. R inspects $X$. $60 < 72$, so R rejects $X$.  
  Result: R accepts $X$ in Order 1 but rejects $X$ in Order 2.  
  An agent maximizing a fixed ranking must satisfy transitivity and context independence. If $X$ is chosen when $Y$ is available (or potentially available), it must be ranked higher. A fixed ranking implies the value of $X$ is intrinsic, not dependent on the history of inspection. Searcher-R's choice depends on the path, violating the definition of a static preference order.

  **Part 2**  
  The colleague's argument relies on **as-if representation**: modeling behaviour *as if* it were optimizing some function. Mathematically, one can often find a search cost $c$ that makes a specific stopping rule optimal via **dynamic programming** (calculating the **reservation price** where marginal cost equals expected marginal gain). However, representing behaviour is not prescribing it. Just because an analyst can reverse-engineer a cost function does not mean the agent is using it.  
  This leads to unfalsifiability. If *any* behaviour can be rationalized post-hoc by positing a specific search cost, the theory of optimization explains nothing. It becomes a tautology: "The agent did what was optimal, because we define optimal as what the agent did." This trivializes satisficing by stripping optimization of its predictive power. Satisficing is only a genuine alternative if the procedure is chosen for reasons other than maximizing a global objective function (e.g., computational limits).

  **Part 3**  
  To evaluate Searcher-R's rationality, we must distinguish who is doing the computing. **Substantive rationality** judges the outcome (did R get the best option?). **Procedural rationality** judges the process (did R use a feasible method?).  
  1.  **Feasibility:** For R to be an optimizer in the first-person sense, R must calculate the optimal search cost $c$ dynamically. If R lacks the compute to solve the **dynamic programming** problem required to find that $c$, then claiming R is "secretly optimizing" attributes a computation to the agent that only the third-person analyst can perform. Rationality requires the agent to actually execute the reasoning, not just match its output.  
  2.  **Ecological Rationality:** Rationality is not a property of the mind in isolation, nor of the behaviour alone, but a fit between the heuristic and the environment. Searcher-R is rational if its aspiration updates track the distribution of utilities in the specific logistics environment it faces. If the environment is volatile, R's ratcheting might fail; if stable, it succeeds. Thus, R is praiseworthy not because it maximizes a universal function, but because its procedure is adapted to the structure of its world.

  ***

  ### 3. Marking Scheme

  **Total:** 20 Marks  
  **Structure:** 5 Criteria × 4 Marks each.

  | Criterion | Must-Hit Move (4 Marks) | Engineer Failure Mode (Deduction Trigger) |
  | :--- | :--- | :--- |
  | **1. Ranking vs. Policy** | Identifies that fixed rankings require context-independent choice, whereas Searcher-R uses a stopping rule dependent on history/order. | Reaching for "the aspiration level adapts, therefore it's still optimizing a static list." |
  | **2. Representing vs. Prescribing** | Distinguishes **as-if representation** (analyst modeling behavior) from actual prescription (agent executing logic). | Confusing mathematical equivalence with cognitive mechanism ("If the math matches, the mind works that way"). |
  | **3. Unfalsifiability** | Notes that if any behavior can be fit by tuning search costs, the optimization claim loses explanatory power. | Assuming that because a cost *can* be found, it *was* used (ignoring the risk of tautology). |
  | **4. 1st vs. 3rd Person Computation** | Argues that for R to be an optimizer, R must afford the compute for the optimization (1st person), not just the analyst (3rd person). | Ignoring the cost of the optimization calculation itself ("It's optimal, so it doesn't matter how hard it is to calculate"). |
  | **5. Mind/Environment Relation** | Defines **ecological rationality**: rationality is a fit between procedure and environment structure, not internal logic alone. | Judging rationality solely by logical consistency or outcome quality, ignoring environmental structure. |

  **Band Notes:**

  *   **A (17–20):** Hits all 5 moves with precision. Clearly defines terms (e.g., *as-if*, *ecological rationality*) without jargon abuse. Part 1 example is numerically consistent. Part 3 explicitly separates the agent's compute from the analyst's.
  *   **B (13–16):** Hits 3–4 moves. May conflate representation with prescription or gloss over the computational cost of the optimization itself. Example in Part 1 works but explanation of "fixed ranking" is vague.
  *   **C (9–12):** Hits 1–2 moves. Treats satisficing as "lazy optimization." Fails to address unfalsifiability. Assumes rationality is solely about outcome maximization. Definitions missing or incorrect.
