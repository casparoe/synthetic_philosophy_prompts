answer: |-
  Here is the procedure you asked for, drafted as an email you can send directly to your TAs.

  Thank you for holding the line on this. You are right to feel that the standard responses are failing because they treat a structural problem as a content problem. When a student doubts the external world, offering evidence of the external world is not just weak; it is unintelligible within the frame they have adopted. Conversely, when a student doubts the moon landing based on conspiracy, treating it as a philosophical framework difference is dangerous because it validates a break with shared reality that may signal distress rather than intellectual curiosity. To address this, I have operationalized the Wittgensteinian grounding you requested into a conversational flow that avoids jargon. Before laying out the steps, I want to validate the two distinctions you proposed because they are doing real work and should be embedded in the procedure. The concept of idling propositions is essential for triage. It identifies claims that look empirical but are immune to evidence, which is the hallmark of conspiracy thinking or psychological distress rather than philosophical skepticism. This belongs at the very start of the interaction. The concept of leaky hinges is equally vital for context management. It distinguishes between a doubt that is live in the seminar room but dead in the world, versus a doubt that leaks into the student's actual functioning. This belongs in the middle of the procedure, after establishing immunity to evidence but before deciding how to engage. If a hinge is leaky, the student needs support, not philosophy. If it is not leaky, they are likely doing philosophy.

  The procedure itself consists of three conversational moves you should attempt in order during the fifteen-minute window. The first move is the Reversal Test. When the student states their doubt, ask them directly what would count as evidence against it. If they say nothing could change their mind, or if every possible piece of evidence is dismissed as part of the deception, you are dealing with an idling proposition. This is a judgment call dressed up as a test, because students may take a moment to realize what they are saying, but if the proposition is truly idling, they will admit that no observation matters. If they pass this test and can name specific conditions under which they would be wrong, proceed to the second move, which is the Life Test. Ask them whether they act on this doubt outside of this course. Do they hesitate to cross the street because the ground might not be there? Do they refuse to trust medical advice because the past is unknowable? If the doubt is confined to the seminar, it is a non-leaky hinge, and you are safe to treat it as a philosophical exercise. If the doubt leaks into their daily life, stop the philosophical discussion immediately. This is no longer an epistemology problem; it is a welfare problem, and you must refer them to counseling services. If the doubt is not idling and does not leak, proceed to the third move, which is the Utility Test. Ask them what work this doubt is doing for them right now. Are they using it to question a specific claim, or are they using it to stop inquiry altogether? If they are using it to question a specific claim, such as the reliability of testimony regarding the past, you should engage with arguments and evidence. If they are using it to stop inquiry altogether, you should explain that within the practice of the course, some propositions must stand fast for us to check anything else, and that doubting them is not a deeper form of knowledge but a refusal to play the game of knowing.

  To show you how this lands, let us run the procedure on the three cases you identified. In the case of the simulation skeptic, the Reversal Test will likely show that no empirical evidence counts against the doubt, since any evidence could be simulated. This marks it as idling in an empirical sense, but the Life Test will reveal that the student eats, sleeps, and attends class as if the world is real. The doubt is not leaky. The Utility Test will show they are using the doubt to explore the limits of justification, not to opt out of reasoning. Here, the procedure directs you away from argument. You do not prove the world exists. Instead, you point out that within the course, we are investigating how knowledge works assuming a world, and that radical skepticism is a tool to test the structure, not a conclusion to live by. You validate the philosophical move without validating the claim as a live option for action. This resolves the situation by shifting the goal from refutation to clarification of practice.

  In the case of the student who doubts everything about the past because nobody alive observed it, the Reversal Test will yield a different result. If you ask what would change their mind, they should be able to say something like direct observation or consistent records. This means the proposition is not idling. The Life Test will confirm they do not live as if the past is unknowable; they know their own birthday and rely on history to navigate the present. The doubt is not leaky. The Utility Test shows they are questioning a specific mechanism of knowledge, namely testimony. Here, the procedure directs you toward argument. This is not a hinge proposition in the context of historical knowledge; it is an empirical claim about the reliability of records. You should provide the standard epistemological defense of testimony and memory. The specific move in the procedure that puts you here is the failure of the Reversal Test to identify immunity to evidence. Because evidence is possible, the demand for proof is legitimate, and meeting it with a shrug would be a failure of your instructional duty.

  In the case of the moon-landing student, or any conspiracy theorist who swallows every source, the procedure is designed to halt your engagement and trigger a referral. The Reversal Test will reveal that the proposition is idling. No document, no video, no testimony counts, because all sources are deemed part of the staging. This is the first red flag. The Life Test may or may not show leakage, but often these doubts correlate with broader alienation. However, the critical failure point is the Utility Test. If the doubt is used to reject every source you offer, extending itself to swallow every counter-argument, this is not a philosophical framework difference. It is bad faith or distress. The procedure cannot distinguish perfectly between a committed conspiratorial worldview and a philosophical stance, which is why the Reversal Test is weighted so heavily at the start. If nothing counts as evidence, you are not in a epistemology office hour; you are in a mental health triage. The procedure tells you to stop arguing. Do not treat this as a protected framework difference. Wittgenstein's hinges are about the conditions for shared practice, not private realities that invalidate shared practice. If the student insists on a private reality that invalidates all shared sources, you must state that you cannot proceed on these terms and refer them to the appropriate support staff. This is where the procedure admits its limit. It cannot fix a student who refuses the possibility of being wrong. It can only identify that refusal and protect you from trying to argue against it.

  There are judgment calls dressed up as tests here, and I want to be clear about them. The Reversal Test relies on the student's self-reporting, and a clever student might mimic openness while remaining closed. The Life Test relies on your ability to detect evasion. If a student says they act normally but their affect suggests otherwise, trust your instinct and refer. The Utility Test is the most subjective. It requires you to gauge whether the doubt is productive or obstructive. If you feel exhausted, circular, or manipulated, that is data. The procedure is not an algorithm that absolves you of responsibility; it is a scaffold to help you categorize the interaction quickly so you do not waste fifteen minutes trying to prove the existence of hands to a student who is using the doubt to signal distress. Use the first five minutes to run the Reversal and Life Tests. If either flags, pivot to referral or framework clarification. If neither flags, spend the remaining time on the philosophical content. This protects your time, protects the student from being misunderstood, and protects the integrity of the course by distinguishing between philosophical skepticism and pathological doubt.
