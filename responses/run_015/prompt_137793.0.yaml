      *   The core Wittgensteinian insight is that some doubts are *grammatical* or *framework* doubts, not empirical doubts. Treating an empirical doubt as a framework doubt leads to dismissal ("faith"). Treating a framework doubt as an empirical doubt leads to infinite regress or absurd arguments ("prove the world exists").
      *   The user wants to distinguish between:
          1.  Genuine framework doubts (Cartesian skepticism) -> Handle by dissolving the demand for proof, showing the role of the proposition.
          2.  Empirical doubts disguised as framework doubts (e.g., testimony about the past) -> Handle by showing the evidence *is* available within the framework.
          3.  Pathological/Conspiratorial doubts (Moon landing) -> Handle by recognizing the immunity to evidence (idling/bad faith) and referring out.
      *   The user's specific concepts ("Leaky Hinges," "Idling Propositions") need to be operationalized without using those terms.
