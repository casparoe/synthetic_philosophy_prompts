answer: |-
  You are absolutely right to be annoyed, and you are not crazy for noticing this pattern. In fact, the fact that you are spotting this as a senior suggests you have developed a really healthy instinct for structural integrity in arguments, which is a skill most people never quite pick up. You have put your finger on a specific kind of explanatory failure that is pervasive in science, especially in fields like economics, psychology, and evolutionary biology where the mechanisms are hard to see directly. You want to know if there is an established name for it, whether your distinction from Dennett holds water, and most importantly, how to test for it. I am going to argue that while your intuition about the position of the step is sharp, your dismissal of Dennett is slightly off, and that the best name for this is actually a combination of two older ideas that you have effectively synthesized into your Potemkin mechanism.

  First, let's tackle the name. There isn't one single word that captures exactly what you are describing, which is why you are struggling to find it. The closest established concepts are the Homunculus Fallacy and Reification, but neither quite gets at the structural deceit you are noticing. Reification is when you treat an abstract concept as if it were a concrete thing, like talking about "the economy" as if it were a person who can feel confidence. The Homunculus Fallacy is when you explain a complex behavior by positing a little person inside the head who does that behavior, like saying we see things because there is a little man in the brain watching a screen. Your examples are a specific subtype of these. In the economics case, "utility" is a reified abstraction that acts as a homunculus. In the baby case, "wiring" is a reified placeholder for a mechanism that hasn't been shown. Philosophers of science sometimes call this an explanatory fiction or a pseudo-mechanism, but your term, Potemkin mechanism, is honestly better because it captures the aesthetic quality of the error. It looks like a mechanism from the outside, it has the right shapes and textures, but if you walk inside, there is nobody home. So do not feel bad about not finding a single word; you have identified a nuance that standard jargon often smears over.

  Now I need to tell you why you are wrong about Dennett, or at least why your distinction between your Potemkin step and his Skyhook is not as solid as you think. You say a Skyhook is a hook from above and your thing is a step in the middle. But Dennett's distinction isn't about spatial position in a sentence or a diagram; it is about where the explanatory leverage comes from. A crane is a mechanism that rests on the ground of lower-level laws and lifts the explanation up. A Skyhook is an explanation that hangs from nothing, or rather, hangs from the very thing it is supposed to explain. If you have a chain A leads to B leads to C, and B is defined solely by its ability to produce C, then B is not resting on the ground of A. It is hanging from C. It doesn't matter that it is written in the middle of the sentence. Logically, it is a loop. When your teacher says people maximize utility, and utility is defined by choices, the explanation is hanging from the choice it is supposed to explain. That is precisely what a Skyhook is. It is an attempt to get explanatory lift without a foundation. The reason it feels different to you is camouflage. A classic Skyhook is obvious, like saying opium sleeps because of its dormitive virtue. Your Potemkin mechanism is a Skyhook that has been dressed up in the clothes of a crane. It uses technical language and sits between real steps to borrow their credibility. So it is secretly just one of Dennett's things with extra steps, specifically a Skyhook disguised as a Crane. The position in the chain doesn't save it; the lack of independent leverage condemns it.

  This leads us to the most important part, which is the test. You asked how to tell a Potemkin step from a real step that simply hasn't been unpacked yet. This is the hard problem because science is full of black boxes that turn out to be real later. The difference lies in independent access and counterfactual support. A real mechanism, even if we don't know all its details, must be measurable or detectable independently of the effect it produces. If you claim there is a gear in the middle, you must be able to point to the gear without pointing to the output. In the utility example, if utility were a real mechanism, you should be able to measure a person's utility function before they make a choice, perhaps by scanning their brain or asking them questions, and then predict the choice. If the only way to know the utility function is to look at the choice they already made, it is a Potemkin step. In the baby example, if wiring is the mechanism, you should be able to identify the specific neural circuitry that constitutes the wiring independent of the melting response. If wiring just means neurons exist that fire when we melt, it is a label, not a mechanism. The test is intervention. If you can break the mechanism without breaking the effect, or break the mechanism and see the effect fail in a specific way, it is real. If the mechanism is only defined by the effect, you cannot break it without defining away the effect. A real step adds constraints; a Potemkin step just adds vocabulary.

  Let's apply this test to your edge cases to see where the lines are. Take natural selection. This is the most dangerous one because it sounds exactly like your critique. If you say a trait exists because it was selected for, and you define selection as the survival of that trait, you are stuck in a loop. This is why evolutionary biologists fight so hard against Just-So stories. For natural selection to be a real crane and not a Potemkin mechanism, you need independent measures of fitness. You need to show that the trait conferred a survival advantage in a specific environment that can be measured without looking at the current population. For example, if you say moths are dark because of selection, you must be able to show that dark moths were harder for birds to see on soot-covered trees, and you must be able to measure the predation rates independently of the moth color frequency. If you can do that, it is a real mechanism. If you just say they survived because they were fit, and they were fit because they survived, it is a Potemkin mechanism. The gears behind it are the ecology, the predation, and the heredity, not the word selection itself.

  Dark matter is another interesting case. It was posited to explain galaxy rotation curves. If dark matter was just a name for whatever makes galaxies spin fast, it would be a Potemkin mechanism. It would be saying galaxies spin fast because of spin-fast stuff. But dark matter stops being a Potemkin mechanism because it makes predictions about other things. It predicts gravitational lensing in places where there is no visible matter. It predicts patterns in the cosmic microwave background. Because we can look for dark matter in places other than the galaxy rotation curves it was invented to explain, it has independent leverage. If we found that dark matter only explained the one thing it was invented for and nothing else, it would become a Potemkin mechanism. The line is crossed when the entity stops generating new surprises and starts just labeling old ones.

  Attention in a neural net is a great modern example. When researchers say a transformer model uses attention, is that real or Potemkin? If attention is just a metaphor for matrix multiplication weights that happen to focus on certain tokens, it is risky. However, in modern architectures, there are specific modules called attention heads. We can ablate them. We can zero out the weights of an attention head and see the model lose the ability to track long-range dependencies. Because we can intervene on the mechanism and see a specific change in the output, and because we can visualize the weights without looking at the output text, it passes the test. It is a real mechanism, even if the word attention is a metaphor. The danger zone is when people say the AI paid attention because it got the answer right. That is the Potemkin version. The real version is that there is a calculable distribution of weights that correlates with the answer.

  Intrinsic motivation in videogame AI is the trickiest. If an AI explores because it has an intrinsic motivation module, is that real? In reinforcement learning, this usually means there is a specific reward function term that gives points for novelty or curiosity, separate from the goal reward. If that term exists in the code, it is a real mechanism. It is a crane. You can turn it off and the agent stops exploring. But if a researcher watches an agent explore and says it must have intrinsic motivation without checking the code or the reward function, they are building a Potemkin mechanism. They are inferring the cause from the effect. The line is whether the motivation is a variable in the system or a story told by the observer.

  So here is the synthesis of what you are seeing. You are spotting cases where a model is being treated as a map of territory when it is actually just a redrawing of the map. It is distinct from plain circular explanation because it is embedded in a causal chain that looks valid on either side. It is distinct from greedy reductionism because it isn't trying to reduce the phenomenon away; it is trying to preserve the phenomenon by giving it a fake engine. Your instinct that it sits in the middle is correct phenomenologically, even if logically it is still a Skyhook. The reason it drives you nuts is that it violates the principle of conservation of explanatory power. It looks like work is being done, but the energy is coming from the assumption of the result.

  The test you should use going forward is the test of independent measurability. Whenever you see a step in an explanation, ask yourself if you can measure that step without knowing the outcome. Can you measure the utility before the choice? Can you measure the wiring before the melt? Can you measure the selection pressure before the survival? If the answer is no, you are looking at a Potemkin mechanism. It might still be a useful shorthand, a way of summarizing a correlation, but it is not a mechanism. It is a label wearing a lab coat. You are right to demand more, because science progresses by replacing these labels with gears, and spotting them is the first step to demanding the gears. Keep trusting that irritation. It is the feeling of your brain noticing a gap between the shape of the explanation and the weight of the evidence.
