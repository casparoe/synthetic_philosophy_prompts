      *Decision:* I will treat the "CDC" as the public-facing epistemic authority. Its guidance represents its credence.
      *Key Distinction:* Did they expect to change their mind? If they knew supply was the only blocker, they should have said "Masks work, but don't buy them." By saying "Masks don't work," they set $P_0(\text{Efficacy})$ low. Then $P_1(\text{Efficacy})$ went high. Did they expect that jump in March? If yes, Reflection violated. If no (they genuinely thought efficacy was low), then it's rational updating.
