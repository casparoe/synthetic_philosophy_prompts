prompt: |-
  Hey — I'm flying out in two weeks for a campus visit where I'm giving a 45-minute talk on the self, and I badly need Q&A prep; the paper itself I could now give in my sleep, it's the question period I'm dreading. The talk argues that Dennett's center of narrative gravity picture gets the direction of explanation backwards: the stories aren't the raw material a self coalesces out of, they're the audit trail. What really does the work, on my view, is what I call the fiduciary self — a posit, closer to a legal fiction or a promissory note than to an average, that an agent has to make and then keep re-making in order to have any future-directed commitments at all. Three moves: (1) a center of gravity is a free abstraction, you can compute one over any cloud of matter and it does real predictive work, but the narrative that's supposed to generate a self can't be just any cloud — it has to be the system's own, and it has to bind prospectively — so the metaphor is quietly hiding a normative condition; (2) a case I use throughout, a woman I call Marta who after a brain injury maintains two mutually inconsistent autobiographies depending on who's asking, and can switch between them mid-conversation, though she still makes and keeps promises across the switch — I claim the Dennettian picture has no principled answer to how many selves are in the room, while mine says the answer is given by where the actual commitments land; and (3) the payoff, that this is why the self has the emotional and moral weight it does, and why it's something you can lose without thereby ceasing to exist.

  The room is what I need help with. Maybe fifteen people: mostly analytic metaphysicians who work on personal identity, persistence, composition and grounding in the Parfit/Lewis/Sider idiom, and who will want to know whether I'm making an ontological claim or quietly changing the subject; two Buddhist studies people who work on no-self and the two truths distinction and who are allergic to any self-talk that isn't doing therapeutic work; an emeritus who is an unreconstructed Dennettian and knows the multiple drafts material and the Joycean machine cold; and a couple of psychologists who study autobiographical memory and will ask what any of this predicts that they don't already know. It's a job visit, so there's a search committee in the room, and I'd much rather be caught conceding something than caught bluffing. I was going over the Marta case with my partner last night and she immediately asked the thing I have no answer to, which is roughly: if the self is a posit, who exactly is doing the positing — and I don't think that's the same question as the one the metaphysicians will ask, but I'm not sure why not.

  What I want back is a prep sheet, not more arguments for the view — I have plenty of those, and I've honestly been to lazy to cut them. Give it to me in these sections:

  - Room read (about 150 words): who fires first, what they'll take my real claim to be, and what the mood of the Q&A will feel like from the podium.
  - The objections (eight, roughly 150 words each), ordered by expected damage rather than by when they'll come up, each headed with who it comes from, then the objection phrased the way that person would actually say it — their vocabulary, not mine — then a two-minute reply, then one honest note on where my reply is soft. Give me the objections this room will produce, not the ones I'd get from a literary theory seminar or from an alignment-adjacent reading group.
  - Concessions (about 150 words): what I should give away in the first two minutes, before anyone asks, so I don't look like I'm knocking over a straw version of Dennett.
  - The line to hold (about 150 words): the single reply that has to land for the talk to have been worth giving.
  - The question I'm hoping nobody asks (about 200 words): what it is, why it's the dangerous one for me specifically, and what I'd say if it does get asked.
