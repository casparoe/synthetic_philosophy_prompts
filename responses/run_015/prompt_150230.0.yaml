          *   *Critique:* Is it a *second-order* problem or a *constitutive* one? If fiction is defined by intentional act (Currie, Walton), then removing the author might dissolve the category of "fiction" entirely, making the paradox moot. If it's not fiction, what is it?
          *   *Verdict:* It's coherent but risky. It needs to establish that "fiction" can exist without a unified author. Otherwise, the paradox doesn't apply because there's no fiction to be paradoxical about.

      *   **Point 2: Critique of Walton and Carroll.**
          *   *Walton:* Make-believe relies on *props* and *principles of generation*. Does Walton *need* a human author? A dream or a cloud shape could be a prop. But Walton usually discusses games of make-believe which are social/conventional.
          *   *Carroll:* Thought theory focuses on the *content* of the thought. Does the source matter? If I think "Anna Karenina suffers," does it matter if Tolstoy or an AI generated it? Carroll might say the *thought* is the same.
