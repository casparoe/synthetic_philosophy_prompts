  On the second point, the qualifiers significantly weaken the claim from a logical impossibility to a psychological contingency. Molyneux's flat Not suggests an incapacity, but Locke's at first sight and with certainty imply that success is possible eventually or probabilistically. With certainty indeed leaves room for a guess better than chance, suggesting the ideas are not wholly incommensurable but merely unconnected. This shifts the passage from answering whether tactile ideas suffice for recognition in principle to whether they suffice immediately without cross-modal learning. The difference turns on whether the problem is about the nature of ideas or the timing of judgment; Locke's qualifiers suggest he views it as the latter, where experience joins the ideas almost instantly after the first sight.

