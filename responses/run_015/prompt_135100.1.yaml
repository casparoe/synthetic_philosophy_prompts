prompt: |-
  I'm currently taking a seminar on moral responsibility and collective action, and a classmate presented a summary of Karl Jaspers's well-known post-war essay on guilt that she attributed to his fourfold taxonomy. She summarized it like this: "Jaspers distinguishes criminal guilt, political guilt, moral guilt, and metaphysical guilt. Criminal guilt applies to individuals who violated law, but Jaspers extends it to citizens collectively because modern democratic states operate through shared sovereignty; therefore, a population can be criminally guilty for state policies even when courts can only prosecute individuals. Political guilt is different: it is the liability every citizen bears for allowing an unjust regime to exist, but it carries no personal blame and requires only institutional reform and reparative justice, not punishment. Moral guilt is entirely private, arising from one's own conscience about specific actions, so it can never be collective. Metaphysical guilt is universal human solidarity with victims of evil, which means every person alive during atrocities bears it individually, but it is not specific to members of the perpetrating nation. From this taxonomy, Jaspers concludes that collective punishment is appropriate for criminal guilt at the national level, inappropriate for political guilt, and meaningless for moral or metaphysical guilt, since the latter two are strictly individual."

  I think she captures the four categories, but I'm unsure whether Jaspers actually assigns criminal guilt collectively, whether he allows moral guilt to have any collective dimension, and whether his view on political guilt really excludes all forms of collective blame. Could you audit her summary carefully? In particular, clarify which of the four categories Jaspers treats as genuinely collective rather than individually distributed, whether there is any role for what she calls "shared sovereignty" in his argument for criminal guilt, and whether the conclusion about punishment and reform actually follows once those misattributions are corrected. I also want to apply this to a case we are discussing: if a contemporary institution still holds material benefits derived from historical wrongs committed by predecessors who are all dead, does Jaspers's framework treat that as inherited political guilt, or does it fall outside his taxonomy altogether?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Task:** Audit a classmate's summary of Karl Jaspers's *The Question of German Guilt* (1947).
      *   **Specific Issues to Address:**
          *   Does Jaspers assign *criminal guilt* collectively?
          *   Does he allow *moral guilt* to have any collective dimension?
          *   Does his view on *political guilt* exclude all forms of collective blame?
          *   What is the role of "shared sovereignty" in his argument for criminal guilt?
          *   Does the conclusion about punishment/reform follow from the corrected taxonomy?
          *   **Application:** Apply the corrected framework to a contemporary institution holding material benefits from historical wrongs (predecessors dead). Is this inherited political guilt or outside the taxonomy?

  2.  **Recall/Verify Jaspers's *The Question of German Guilt*:**
      *   *Context:* Written shortly after WWII, addressing the German people's responsibility for Nazi crimes.
      *   *The Four Guilt Categories:*
          1.  **Criminal Guilt:** Violation of laws. Adjudicated in court. *Individual only.* (Key point: Jaspers explicitly rejects collective criminal guilt).
          2.  **Political Guilt:** Responsibility for the actions of the state. *Collective.* All citizens bear this because they are part of the polity. Consequences: Reparations, loss of rights, structural change. Not moral blame, but liability.
          3.  **Moral Guilt:** Personal actions and choices. *Individual.* Judged by conscience/peers, not courts. Can Germans judge Germans? Yes.
          4.  **Metaphysical Guilt:** Solidarity among humans. Co-responsibility for every wrong in the world, especially if one survives while others are murdered. *Individual/Universal.* Before God.

  3.  **Evaluate the Classmate's Summary (Point-by-Point Audit):**
      *   *Claim:* "Criminal guilt... Jaspers extends it to citizens collectively... population can be criminally guilty for state policies."
          *   *Correction:* **False.** Jaspers is adamant that criminal guilt is *strictly individual*. Collective criminal guilt is a legal impossibility for him. Courts prosecute individuals, not peoples.
      *   *Claim:* "Shared sovereignty... argument for criminal guilt."
          *   *Correction:* **False.** "Shared sovereignty" (or civic co-responsibility) is the basis for *Political Guilt*, not Criminal Guilt.
      *   *Claim:* "Political guilt... liability every citizen bears... carries no personal blame... requires only institutional reform and reparative justice, not punishment."
          *   *Correction:* **Mostly True.** It is collective liability. It leads to reparations and political restructuring. It is distinct from moral blame.
      *   *Claim:* "Moral guilt... entirely private... can never be collective."
          *   *Correction:* **Mostly True.** It is individual conscience. However, it's not just "private" in a hidden sense; it can be judged by fellow humans. But it is not collective in the sense of a group sharing the *same* moral guilt for an act they didn't individually commit.
      *   *Claim:* "Metaphysical guilt... universal human solidarity... every person alive... not specific to members of the perpetrating nation."
          *   *Correction:* **Partially True/Misleading.** It *is* universal, but in the context of the book, it weighs heaviest on those who *survived* when others were killed (specifically Germans who survived Jews). It is specific to the relationship between the living and the dead/victims.
      *   *Claim:* "Conclusion... collective punishment is appropriate for criminal guilt at the national level..."
          *   *Correction:* **False.** Since criminal guilt isn't collective, collective *criminal* punishment is unjust. Political liability (reparations) is collective, but it's not "punishment" in the criminal sense.

  4.  **Synthesize the Corrections (The "Audit"):**
      *   **Criminal:** Strictly individual. No collective criminal guilt.
      *   **Political:** Strictly collective (citizenship-based). Liability, not moral blame. Leads to reparations.
      *   **Moral:** Strictly individual (conscience/actions).
      *   **Metaphysical:** Individual/Universal (solidarity).
      *   **Key Distinction:** The classmate swapped the "collective" aspect from Political to Criminal.

  5.  **Address the Application Case (Contemporary Institution/Historical Wrongs):**
      *   *Scenario:* Institution holds benefits from historical wrongs (predecessors dead).
      *   *Jaspers's Framework:*
          *   *Criminal:* No (perpetrators dead, no trial).
          *   *Moral:* No (current members didn't commit the acts).
          *   *Metaphysical:* Maybe (human solidarity), but hard to apply to an *institution*.
          *   *Political:* This is the closest fit, but Jaspers focuses on *citizens* and the *State*. An institution isn't a state. However, the logic of *Political Guilt* (liability for the structure one benefits from) is the relevant analogue.
          *   *Nuance:* Jaspers talks about *Wiedergutmachung* (reparations). This is political liability. If the institution is part of the state apparatus or a corporate body continuing the legal identity, political liability might apply. If it's a private entity, Jaspers might lean toward Moral (if current members know and do nothing) or Metaphysical.
          *   *Refinement:* Jaspers distinguishes between *guilt* (culpa) and *liability* (responsibility for consequences). The institution isn't "guilty" in a criminal/moral sense, but it may bear *political/civic responsibility* to make amends based on the continuity of the entity. This aligns with **Political Guilt** (liability for the deeds of the state/community one belongs to), even if the specific "citizen" analogy is stretched to "institutional member."
          *   *Better fit:* It falls under the logic of **Political Guilt** (collective liability for the polity's past), translated to institutional continuity. It is *not* inherited moral guilt.

  6.  **Drafting the Response:**
      *   *Tone:* Academic, precise, helpful for a seminar context.
      *   *Structure:*
          1.  Executive Summary (The classmate made a crucial error).
          2.  Detailed Audit of the Four Categories (Correcting the Criminal/Political swap).
          3.  Analysis of the "Shared Sovereignty" claim.
          4.  Analysis of the Punishment/Reform conclusion.
          5.  Application to the Contemporary Case.
      *   *Key Textual Evidence:* Reference *The Question of German Guilt*. Emphasize Jaspers's rejection of "collective guilt" in the criminal/moral sense.

  7.  **Refining the "Political Guilt" vs. "Collective Blame" distinction:**
      *   The classmate said political guilt excludes "collective blame." Jaspers agrees it's not *moral* blame, but it *is* collective *liability*. The term "blame" is tricky. It's better to say "political responsibility."
      *   The classmate said Criminal Guilt is collective. This is the biggest error. Jaspers famously argues *against* the Allied tendency to treat Germans as a collectively criminal nation.

  8.  **Refining the Application:**
      *   Does Jaspers cover "inherited" guilt? He says children are not morally guilty for parents. But they inherit the *political* situation.
      *   For an institution: If the legal entity persists, the *political* liability persists. If the people change but the charter remains, the *political* obligation remains.
      *   Verdict: It fits best under **Political Guilt** (understood as civic liability), not Moral or Criminal.

  9.  **Final Review against constraints:**
      *   Did I answer the specific questions? (Collective vs. Individual, Shared Sovereignty, Punishment/Reform, Application).
      *   Is the distinction clear? Yes.

      *(Self-Correction during drafting)*: Make sure to clarify that Jaspers *does* believe Germans are collectively responsible politically, but *not* collectively guilty criminally. The classmate flipped this. Also, ensure the distinction between "blame" (moral) and "liability" (political) is clear in the application section.

  10. **Final Polish:** Check for clarity and tone. (Proceed to generate output).

  *(Wait, one more check on Metaphysical Guilt)*: The classmate said it's "not specific to members of the perpetrating nation." Jaspers actually says it applies to *all* humans, but it is *most acute* for those who survived when others were killed (i.e., the Germans who survived the Holocaust). So it is universal but contextually specific. I should note this nuance.

  *(Check on Moral Guilt)*: Classmate says "never be collective." Jaspers agrees. Moral guilt is about my own conduct.

  *(Check on Criminal Guilt)*: Classmate says "collective." Jaspers says "Individual." This is the critical error.

