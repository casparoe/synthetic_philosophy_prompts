answer: |-
  Your instincts are correct: your classmate's summary contains a critical structural error regarding Jaspers's taxonomy, specifically concerning the locus of **criminal** versus **political** guilt. This error fundamentally distorts Jaspers's argument about collective responsibility and punishment.

  Below is an audit of her summary based on Karl Jaspers's *The Question of German Guilt* (1947), followed by an application of the corrected framework to your seminar case.

  ### Part 1: Audit of the Summary

  #### 1. Criminal Guilt: Individual, Not Collective
  **Classmate's Claim:** Jaspers extends criminal guilt to citizens collectively because of shared sovereignty; a population can be criminally guilty for state policies.
  **Correction:** **This is false.** Jaspers is explicit that criminal guilt is **strictly individual**.
  *   **Jaspers's View:** Criminal guilt is established in court regarding specific violations of law. Jaspers argues vehemently *against* the concept of collective criminal guilt. He asserts that a "people" cannot be put on trial; only individuals can. To claim a nation is collectively criminally guilty is, for Jaspers, a form of mysticism that undermines the rule of law.
  *   **Shared Sovereignty:** The argument about shared responsibility for the state's actions belongs to **Political Guilt**, not Criminal Guilt. Your classmate has attributed the rationale for political guilt to the category of criminal guilt.

  #### 2. Political Guilt: Collective Liability, Not Moral Blame
  **Classmate's Claim:** Political guilt is the liability every citizen bears for allowing an unjust regime... carries no personal blame and requires only institutional reform and reparative justice, not punishment.
  **Correction:** **Mostly Accurate, but requires nuance on "blame."**
  *   **Jaspers's View:** Political guilt is indeed **collective**. All citizens are co-responsible for the way their state is governed and for the consequences of its actions. Because we live under a political order, we are liable for its deeds.
  *   **Consequences:** This liability leads to **reparations** (*Wiedergutmachung*) and the loss of certain rights (e.g., voting, holding office) during a transition, but it is not "punishment" in the retributive or criminal sense. It is the price of membership in a polity.
  *   **Blame:** Your classmate is right that it carries no *moral* blame, but it does involve a form of *political* accountability. It is not merely "institutional reform"; it requires material sacrifice (reparations) from the collective.

  #### 3. Moral Guilt: Individual Conscience
  **Classmate's Claim:** Moral guilt is entirely private... can never be collective.
  **Correction:** **Accurate.**
  *   **Jaspers's View:** Moral guilt concerns my own actions and my own conscience. It cannot be transferred. I am not morally guilty for what my neighbor or my government did, only for what *I* did or failed to do in my sphere of influence. While it is "private" in terms of conscience, Jaspers notes it can be judged by fellow humans (through dialogue), but it remains non-collective.

  #### 4. Metaphysical Guilt: Universal Solidarity
  **Classmate's Claim:** Universal human solidarity... every person alive... not specific to members of the perpetrating nation.
  **Correction:** **Partially Accurate.**
  *   **Jaspers's View:** Metaphysical guilt arises from human solidarity. It is the sense of co-responsibility for every wrong in the world. However, in the context of the essay, it weighs most heavily on those who **survived** when others were murdered. While it is universal, it is acutely specific to the Germans who remained alive while Jews were exterminated. It is judged only before God, not in courts or public discourse.

  #### 5. The Conclusion on Punishment and Reform
  **Classmate's Claim:** Collective punishment is appropriate for criminal guilt at the national level... inappropriate for political guilt.
  **Correction:** **The exact opposite is true.**
  *   **Correction:** Since criminal guilt is individual, **collective criminal punishment is unjust** according to Jaspers. You cannot punish a population criminally for the deeds of a regime.
  *   **Political Liability:** Conversely, **collective liability is appropriate for political guilt.** The German people *must* collectively pay reparations and undergo political restructuring because they are politically liable for the state, even if they are not individually criminally guilty.
  *   **Summary Error:** Your classmate swapped the "collective" attribute. Criminal = Individual; Political = Collective.

  ### Part 2: Corrected Taxonomy Overview

  | Category | Locus | Basis | Adjudication | Consequence |
  | :--- | :--- | :--- | :--- | :--- |
  | **Criminal** | **Individual** | Violation of Law | Court of Law | Punishment (Prison, etc.) |
  | **Political** | **Collective** | Citizenship/State Power | Victor/International Power | Reparations, Loss of Rights |
  | **Moral** | **Individual** | Personal Conscience/Actions | Conscience/Peers | Shame, Repentance |
  | **Metaphysical**| **Individual/Universal**| Human Solidarity | God | Transformation of Consciousness |

  ### Part 3: Application to the Contemporary Case

  **Case:** A contemporary institution holds material benefits derived from historical wrongs committed by predecessors who are all dead.

  **Analysis using Jaspers's Framework:**

  1.  **Is it Criminal Guilt?**
      *   **No.** The perpetrators are dead, and criminal guilt does not survive the individual. Furthermore, the institution itself (as a legal fiction) cannot bear *criminal* guilt in Jaspers's sense, only the individuals within it could. Since the specific actors are deceased, criminal guilt is extinguished.

  2.  **Is it Moral Guilt?**
      *   **No.** Current members of the institution did not commit the acts. Jaspers is clear that children (or successors) do not inherit the *moral* guilt of their fathers. Moral guilt requires personal agency in the wrongful act.

  3.  **Is it Metaphysical Guilt?**
      *   **Possibly, but limited.** Current members share a human solidarity with the victims. However, this is a universal condition of being human, not a specific liability tied to the *institution's* holdings. It might motivate action, but it doesn't explain the *institutional* obligation.

  4.  **Is it Political Guilt? (The Strongest Fit)**
      *   **Yes, by analogy.** This is the most relevant category, though Jaspers applies it primarily to nation-states.
      *   **Continuity of the Polity:** Jaspers argues that political guilt attaches to the **citizenry** because the political order continues. Even if the specific leaders change, the state remains.
      *   **Institutional Continuity:** If the institution is a legal entity that persists through time (e.g., a university, a bank, a church), it functions similarly to Jaspers's "state." The *entity* benefited from the wrongs, and the *entity* continues to exist.
      *   **Liability vs. Blame:** Under Jaspers's logic, the institution does not bear *moral blame* (it didn't "sin"), but it bears **political/civic liability**. Because the institution exists within a social contract and holds assets derived from the political order of the past, it shares in the **political responsibility** to make amends (*Wiedergutmachung*).
      *   **The "Dead Predecessors" Factor:** Jaspers explicitly addresses this regarding German children. They are not guilty of the crimes, but they are **politically liable** for the consequences because they inherit the state (or in this case, the institution) and its assets.

  **Conclusion for the Case:**
  Jaspers's framework treats this as **inherited political liability**, not inherited moral or criminal guilt.
  *   The institution is not "guilty" in a moral or criminal sense (which would require individual agency).
  *   However, because the institution is a continuing collective body that holds the **benefits** of the past regime's actions, it incurs **political guilt** (liability).
  *   **Obligation:** The appropriate response is not punishment (criminal) or shame (moral), but **reparations** (political). The institution is obligated to disgorge those benefits or compensate victims as a condition of its continued existence within the moral-political order.

  ### Summary for Your Seminar
  You can tell your classmate that she has inverted Jaspers's core distinction: **Criminal guilt is individual; Political guilt is collective.** Consequently, Jaspers argues *against* collective criminal punishment and *for* collective political reparations. In your case study, the institution avoids moral/criminal guilt but incurs political liability, obligating it to reparative justice rather than punishment.
