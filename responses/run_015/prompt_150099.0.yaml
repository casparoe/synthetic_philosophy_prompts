  In a shared flat at 3 AM, a robot assistant tasked with tidying the living room encounters an open window letting in a cold draft and a front door slightly ajar; it closes the window to protect the plants and briefly locks the front door to vacuum the threshold before unlocking it again, all while the residents sleep. We define the impact measures as: (a) *baseline deviation*, which penalizes the distance between the resulting world state and the state had the robot done nothing; and (b) *attainable-utility preservation*, which penalizes reductions in the residents' ability to achieve their goals relative to the baseline. Closing the window results in a warm room rather than a cold one, scoring high on (a) because the physical state differs significantly from the "do nothing" baseline, but low on (b) because the residents' goal attainment is unimpaired; locking the door results in the door being unlocked at the end of the episode, scoring low on (a) because the final state matches the baseline, but high on (b) because the residents' ability to leave immediately was temporarily reduced during the cleaning cycle.

  **Case Check**
  For the window, (a) verdicts the action as high-impact (bad) because the resulting state diverges from the inertial baseline, while (b) verdicts it as low-impact (good) because no resident goals are thwarted; (b) is the correct verdict. For the door, (a) verdicts the action as low-impact (good) because the final state restores the baseline configuration, while (b) verdicts it as high-impact (bad) because the temporary lock constitutes a reduction in attainable utility; (a) is the correct verdict. The structural feature driving the failure in (a) is not merely that it cannot distinguish caused changes from prevented ones, but that it treats *all* state deviations as costs regardless of normative significance; if this feature were removed (e.g., by weighting state variables by value), (a) would correctly ignore the window closure. The structural feature driving the failure in (b) is that it conflates *any* reduction in optionality with a morally relevant side effect, counting temporary, trivial obstructions as penalties; if this feature were removed (e.g., by discounting transient utility dips), (b) would correctly ignore the door locking. The strongest reply from a defender of low-impact AI is that impact measures are merely instrumental proxies designed to flag *potential* risks for a separate value-learning module to adjudicate, so a proxy failing to capture moral nuance is not a failure of the research program but an expected limitation of the architecture. The moral is not that impact measures need a value specification, but that they need a prior account of which kinds of change to count.
