      *   *Talking past each other?* Yes. Anti-mechanists focus on *competence* (idealized capacity), mechanists focus on *performance* (actual cognitive architecture).
      *   *Key Insight:* The stall is a **Category Mismatch between Logic and Psychology**. Gödel is about formal systems; Cognition is about biological/physical processes. Bridging them requires a theory of *implementation*, which is missing.

