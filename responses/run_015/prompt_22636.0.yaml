          *   *Draft Idea:* Focus on the "pinning down" aspect. Is there a fact of the matter?
          *   *Follow-up:* If they say it's contextual, ask if modal truth becomes non-objective.

      *   *Topic 4: Plenitude/Instantiation.* Lewis argues for a "principle of plenitude." Every way a world could be, a world is.
          *   *Challenge:* Does the theory *need* this strong claim? Could we have concrete worlds without *every* possibility being realized? What drives the commitment to *all* properties being instantiated?
          *   *Draft Idea:* Ask about the theoretical cost of plenitude vs. the benefit.
          *   *Follow-up:* If they say it's needed for analysis, ask about gunky worlds or infinite complexities that might not fit.

