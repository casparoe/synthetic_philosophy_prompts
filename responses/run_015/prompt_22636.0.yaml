prompt: |-
  I'm prepping a student-seminar Q&A for a guest who defends a Lewis-style modal realism: possible worlds are concrete, causally isolated, and modal claims are just quantifications over them, with counterpart relations doing the work of identity across worlds. I want the questions to be a bit in the weeds, not the standard how could we know about other worlds stuff. Please draft six to eight questions, with a short follow-up for each aimed at the answer they're most likely to give. I especially want at least one on recombination and why it's supposed to generate worlds with different contingencies, one on how a person can have counterparts without being numerically identical to them, one on what pins down the counterpart relation when similarity, essence, and linguistic practice come apart, and one on whether the view really needs the claim that every possible property is instantiated somewhere.
