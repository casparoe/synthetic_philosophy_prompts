answer: |-
  Here are eight questions designed for a student seminar, focusing on technical metaphysical tensions within Lewisian modal realism rather than standard epistemic objections.

  ### 1. Recombination and the Source of Contingency
  **Question:** The Principle of Recombination suggests we generate possible worlds by duplicating and rearranging spatiotemporal parts. But does this principle explain *why* certain truths are contingent, or does it merely assert that variations exist? If recombination is just a recipe for constructing worlds, what grounds the fact that *my* properties are contingent rather than necessary? It seems recombination generates a plurality of worlds, but does it explain the modal status of the inhabitants within them?
  **Follow-up:** If you say recombination *defines* contingency, does that make the principle of recombination itself a necessary truth? If so, isn't there at least one necessary constraint on the pluriverse that isn't derived from the concrete worlds themselves?

  ### 2. Counterparts and Extrinsic Identity
  **Question:** You deny transworld identity to avoid contradictions in accidental intrinsics (e.g., being both bent and straight). But this makes having a counterpart an extrinsic matter; whether I have a counterpart in world *W* depends on what else exists in *W* and how similar it is to me. Doesn't this violate the intuition that identity and selfhood are intrinsic? Why should my modal properties depend on the existence of distinct concrete particulars elsewhere?
  **Follow-up:** If you accept that modal properties are extrinsic, does this threaten the Humean idea that things have their own being independent of one another? Are we not making my nature dependent on the "crowdedness" of the pluriverse?

  ### 3. Anchoring the Counterpart Relation
  **Question:** The counterpart relation is typically cashed out in terms of qualitative similarity, but similarity is notoriously context-dependent. In cases where linguistic practice, qualitative similarity, and putative essential properties diverge (e.g., a fission case or a gradual replacement scenario), what pins down the truth value of the modal claim? Is there a fact of the matter about which counterpart relation is the "correct" one, or is modal truth ultimately relative to conversational context?
  **Follow-up:** If modal truth is context-relative, does that undermine the idea that you are providing a realist metaphysics of modality? Are we analyzing modality or just our talk about it?

  ### 4. Plenitude and Theoretical Necessity
  **Question:** Lewisian realism commits to a strong Principle of Plenitude: every way a world could possibly be, some world is. Does the system actually *need* this strong claim to function? Could we maintain concrete worlds and counterpart theory with a sparse pluriverse, or does the analysis of "possible" break down if there are uninstantiated consistent properties? What forces the commitment to *every* possibility being concrete?
  **Follow-up:** If you argue plenitude is needed for the analysis of possibility, doesn't that make the ontology dependent on the logic, rather than the logic describing the ontology? Are we positing worlds to save the logic?

  ### 5. Spatiotemporal Relatedness and World Boundaries
  **Question:** Worlds are defined as maximal sums of spatiotemporally related particulars. But is spatiotemporal relatedness an internal relation grounded in the nature of the relata, or an external brute fact? If it is internal, doesn't that constrain recombination (since some natures might not be capable of certain relations)? If it is external, how do we non-arbitrarily draw the boundary between one world and another?
  **Follow-up:** If the relation is external, does that introduce a primitive modal element into the definition of worlds? It seems we need a notion of "possible relatedness" to define the worlds that are supposed to analyze possibility.

  ### 6. Indexical Actuality and Normative Weight
  **Question:** You argue that "actual" is indexical, like "here" or "now," and that all worlds are ontologically equal. However, we assign significant normative weight to actual outcomes over possible ones (e.g., I care about my actual pain, not my counterpart's). If the difference is merely indexical, how do you account for this normative asymmetry without reintroducing a privileged ontological status for the actual world?
  **Follow-up:** If you say the asymmetry is just a psychological preference, does that imply that rational agents *could* care equally about all counterparts? If not, why is the indexical "actual" so uniquely binding on rational action?

  ### 7. Laws of Nature and Counterfactual Stability
  **Question:** Given your Humean Supervenience, laws are just the best systematization of regularities within a world. But when we evaluate counterfactuals, we typically hold the laws of nature fixed while varying initial conditions. How does the Best System Analysis accommodate holding laws fixed across distinct concrete worlds? How do we select the "closest" worlds if the laws themselves are just contingent regularities within those worlds?
  **Follow-up:** If we select worlds with similar laws to evaluate counterfactuals, aren't we relying on a notion of similarity of laws that presupposes the very modal structure you're trying to analyze? Is the account circular?

  ### 8. Quantification and Set-Theoretic Paradox
  **Question:** To avoid Cantor's paradox, you deny that there is a set of all worlds, treating them as a plurality instead. But if we quantify over them in our modal analysis (e.g., "There exists a world such that..."), aren't we committed to a domain of quantification that functions ontologically like a set? How do you square the concreteness of the ontology with this logical restriction on collection?
  **Follow-up:** If you appeal to plural quantification as ontologically innocent, does that innocence extend to the *concrete* totality of the pluriverse? Can we really have a concrete totality that isn't collectable into a single object without contradiction?
