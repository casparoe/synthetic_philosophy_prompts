      *   *Topic 2: Counterparts vs. Identity.* Lewis denies transworld identity. I am not in other worlds; my counterparts are.
          *   *Challenge:* Why deny transworld identity? What logical problem does it solve that outweighs the intuitive cost? Usually, it's to avoid contradictions (being F and not-F).
          *   *Draft Idea:* Ask about the "Humphrey Objection" but deeper. It's not just about interest, it's about *de re* modality. If Humphrey cares about winning, why care about a distinct person winning?
          *   *Follow-up:* If they appeal to representation, ask what makes the representation *about* Humphrey specifically rather than just someone similar.

      *   *Topic 3: Grounding the Counterpart Relation.* Counterpart theory relies on similarity. But similarity is vague and context-dependent.
