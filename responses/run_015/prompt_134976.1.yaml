  This fits perfectly. I will build the response around **Costly Signaling Theory** combined with **Social Equilibrium**.

  10. **Finalizing the Camera Case:** The norm was "Don't lock." The signal was "I am vulnerable because I trust you." The interest was "Safety." Tech allowed Safety *without* Vulnerability. The Signal became obsolete. The norm died because the *function* of the signal was solved more efficiently.

