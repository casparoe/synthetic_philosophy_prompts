answer: |-
  This is a sophisticated intuition, and you are right to feel that "Arguments vs. Interests vs. Honor" is a false trinity. Arguments are rarely the cause; they are the *language* used to justify the shift. Interests provide the *pressure*, but Honor (status/signaling) provides the *mechanism*.

  Your "Camera/Door" case is the key that unlocks the whole system. It suggests that norms are not just moral rules, but **technologies of coordination** that rely on **costly signaling**.

  Here is a framework that captures your examples, a verdict on the camera case, and a unified principle for why norms die.

  ### 1. Verdict on the Camera/Door Case
  **Did the norm collapse because of interest or honor?**
  It collapsed because **technology decoupled the signal from the reality.**

  *   **The Norm:** "Do not lock doors."
  *   **The Signal:** Locking is a *costly signal* of distrust. By leaving the door open, you incur a risk (interest) to demonstrate a virtue (honor/trust).
  *   **The Disruption:** Wireless cameras allow you to secure the *interest* (safety) without paying the *cost* (vulnerability).
  *   **The Result:** The signal becomes obsolete. If everyone uses cameras, leaving the door unlocked no longer signals "I trust you"; it just signals "I haven't upgraded my security."

  The norm didn't die because people cared more about safety (interest always existed). It died because the **honor mechanism was hacked.** You could satisfy the material interest without violating the social honor, which eventually rendered the original signal (the open door) meaningless. Once the signal is meaningless, the norm evaporates.

  ### 2. The Unified Principle: The Signaling Equilibrium
  Your hypothesis ("norms survive only when interest and local honor align") is close, but it needs one adjustment: **Norms survive when they function as stable, costly signals of group membership.**

  Norms die when the **Signaling Equilibrium** is broken. This happens in three specific ways, which map perfectly onto your cases:

  #### A. Status Inversion (The Honor Flip)
  *   **Mechanism:** The behavior remains the same, but the social meaning flips from High Status to Low Status.
  *   **Cases:** **Dueling** and **Foot-binding**.
  *   **Analysis:** In dueling, the material interest (staying alive) was constant. The norm persisted because the *honor cost* of not dueling (being a coward) outweighed the *interest cost* of dueling (dying). It died when the cultural narrative shifted: dueling went from signaling "brave aristocrat" to "insecure cosplay."
  *   **Foot-binding:** Similarly, bound feet signaled "wealthy enough that wife doesn't work." When Western influence made "modern/civilized" the high-status signal, bound feet flipped to signaling "backward peasant." The interest (marriageability) remained, but the honor value inverted.

  #### B. The Moral Stain (The Interest/Honor Alignment)
  *   **Mechanism:** Moral arguments succeed only when they attach a material or status cost to the violation.
  *   **Case:** **British Slavery**.
  *   **Analysis:** You are correct that economics alone didn't kill it (slavery was profitable). Moral argument alone didn't kill it (people had argued against it for centuries). It died when abolitionists successfully linked slavery to **National Honor**. To be a "true Briton" became incompatible with owning slaves.
  *   **The Principle:** Moral arguments kill norms only when they successfully re-categorize the behavior from "Unfortunate Necessity" to "Status Stain." Once slave-owning became a stain on *national character*, the interest of the elite aligned with dropping the practice to maintain prestige.

  #### C. Technological Obsolescence (The Signal Hack)
  *   **Mechanism:** Technology solves the underlying problem without requiring the social signal.
  *   **Case:** **The Camera/Door** and **US Smoking**.
  *   **Analysis:**
      *   **Smoking:** You leaned toward interest (health/lawsuits). But look closer: Smoking bans worked when smoking shifted from "rebellious cool" (Mad Men era) to "addicted/unhealthy" (90s). The health science provided the *ammunition*, but the **status collapse** delivered the kill. Smoking became a signal of low self-control.
      *   **Cameras:** As analyzed above, the tech made the signal unnecessary.

  ### 3. Refining Your Hypothesis
  You asked: *"Is there one principle... that captures all these?"*

  **The Principle:** **Norms are equilibrium states maintained by the cost of signaling.**
  A norm dies when the **Cost of Compliance** exceeds the **Value of the Signal.**

  *   **Dueling:** Cost (Death) > Value (Honor). (When Honor value dropped).
  *   **Slavery:** Cost (National Shame) > Value (Profit). (When Shame value rose).
  *   **Cameras:** Cost (Vulnerability) > Value (Trust Signal). (When Tech lowered the need for vulnerability).

  **Arguments, Interests, and Honor are not separate causes; they are variables in this equation.**
  *   **Arguments** change the *Value of the Signal* (e.g., "Slavery is sinful" lowers the honor value of owning slaves).
  *   **Interests** change the *Cost of Compliance* (e.g., Lawsuits make smoking expensive).
  *   **Honor** is the *Currency* in which the transaction is paid.

  ### 4. Why Your Gut Feels "All Over the Place"
  Your intuition is fluctuating because different cases trigger different variables in the equation.

  *   In **Dueling**, the *Value of the Signal* crashed (Honor shift).
  *   In **Smoking**, the *Cost of Compliance* spiked (Legal/Health interest) AND the *Value of the Signal* crashed (Status shift).
  *   In **Cameras**, the *Need for the Signal* vanished (Technological decoupling).

  ### Summary Advice for Your Analysis
  Don't ask "Was it Argument, Interest, or Honor?"
  Ask: **"How was the link between the Behavior and the Social Signal broken?"**

  *   If the behavior stayed the same but became embarrassing: **Status Inversion.**
  *   If the behavior became too expensive/risky relative to the shame: **Cost Asymmetry.**
  *   If the behavior became unnecessary to solve the underlying problem: **Technological Decoupling.**

  **On your Camera Case:** You should classify this as **Technological Decoupling.** The norm didn't collapse because people stopped valuing trust (Honor) or started valuing safety (Interest). It collapsed because the *proxy* for trust (the unlocked door) was rendered obsolete by a more efficient proxy (the invisible camera). The norm didn't break; it was engineered around until it atrophied.

  This framework allows you to keep your nuanced intuitions (e.g., that slavery wasn't just economics) while giving you a single mechanical explanation for why the norm eventually tipped.
