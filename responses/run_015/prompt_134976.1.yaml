      *   *Critique the "Interest + Honor" Hypothesis:* It's close, but needs the concept of **Signaling** and **Equilibrium**.
      *   *Re-evaluate the other examples through the new lens:*
          *   Dueling: Signaling changed (brave -> insecure).
          *   Slavery: Signaling changed (wealth -> barbarism).
          *   Smoking: Signaling changed (rebel -> addict) + Cost (taxes/laws).
      *   *Propose a Tripartite Framework:*
          1.  **The Signal:** What does the behavior communicate?
          2.  **The Sanction:** What happens if you break it?
          3.  **The Substrate:** The material/technological reality.
      *   *Conclusion:* Norms die when technology or social change breaks the link between the Signal and the Reality, making the Sanction unsustainable.

