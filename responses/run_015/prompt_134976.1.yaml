  **(Self-Correction Note):** I need to be careful not to dismiss "Arguments." Arguments matter when they reframe the Honor. (e.g., "Slavery is sin" reframes "Slaveowner" from "Wealthy" to "Sinner"). So Arguments are the *catalyst* for Honor shifts.

