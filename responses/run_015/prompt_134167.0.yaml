answer: |-
  # Decision Tree: The Fate of the Analytic-Synthetic Distinction

  **ROOT COMMITMENT: Quine's Immunity Claim**
  *Claim: "No statement is immune to revision solely in virtue of meaning."*

  *   **Branch A: Accept** (No statement is immune; all are revisable)
  *   **Branch B: Reject** (Some statements are immune; strict analyticity exists)

  ---

  ## **NODE 1: The Conservation Case**
  *Claim: "Preserving 'energy is conserved' by redefining 'energy' is primarily a change of meaning."*

  ### **From Branch A (Accept Quine)**
  *   **A1-Yes:** It is a change of meaning.
  *   **A1-No:** It is a change of belief or institutional decision.

  ### **From Branch B (Reject Quine)**
  *   **B1-Yes:** It is a change of meaning.
  *   **B1-No:** It is a change of belief or institutional decision.

  ---

  ## **NODE 2: The Calibration Case**
  *Claim: "The manual's rule specifying 'zero' is analytic (true by meaning)."*

  ### **From A1-Yes**
  *   **A1-Yes, 2-Yes:** The rule is analytic. *(Flag: Theoretically Tensioned)*
  *   **A1-Yes, 2-No:** The rule is not analytic (conventional/empirical).

  ### **From A1-No**
  *   **A1-No, 2-Yes:** The rule is analytic. *(Flag: Theoretically Tensioned)*
  *   **A1-No, 2-No:** The rule is not analytic (conventional/empirical).

  ### **From B1-Yes**
  *   **B1-Yes, 2-Yes:** The rule is analytic.
  *   **B1-Yes, 2-No:** The rule is not analytic (conventional/empirical).

  ### **From B1-No**
  *   **B1-No, 2-Yes:** The rule is analytic.
  *   **B1-No, 2-No:** The rule is not analytic (conventional/empirical).

  ---

  ## **NODE 3: The Logic-Revision Case**
  *Claim: "Revising logic (e.g., excluded middle) alters the meaning of logical terms."*

  ### **From A1-Yes, 2-Yes**
  *   **3-Yes:** **Leaf 1:** *Tensioned Holism.* (Accepts Quine's global claim but treats local rules as analytic and logic as meaning-constitutive. Rare/Unstable.)
  *   **3-No:** **Leaf 2:** *Tensioned Pragmatism.* (Accepts Quine's global claim and local analyticity, but treats logic as belief revision. Incoherent.)

  ### **From A1-Yes, 2-No**
  *   **3-Yes:** **Leaf 3:** *Meaning-Constutitive Holism.* (No strict analyticity, but meaning shifts with theory/logic changes. e.g., Inferentialism.)
  *   **3-No:** **Leaf 4:** *Radical Pragmatism.* (No analyticity, meaning stable or irrelevant, all revision is belief/utility. e.g., Strict Quinean.)

  ### **From A1-No, 2-Yes**
  *   **3-Yes:** **Leaf 5:** *Tensioned Dualism.* (Global revisability claimed, but specific rules/logic treated as meaning-based. Incoherent.)
  *   **3-No:** **Leaf 6:** *Tensioned Dualism.* (Same as above. Incoherent.)

  ### **From A1-No, 2-No**
  *   **3-Yes:** **Leaf 7:** *Moderate Holism.* (No analyticity, physics is belief, but logic revision changes meaning. Uncommon.)
  *   **3-No:** **Leaf 8:** *Quinean Holism.* (No analyticity, all revisions are belief adjustments within a web. Standard Quine.)

  ### **From B1-Yes, 2-Yes**
  *   **3-Yes:** **Leaf 9:** *Classical Analytic/Synthetic Distinction.* (Strict immunity exists; physics redefinition is meaning; calibration is analytic; logic revision is meaning change. e.g., Logical Empiricism.)
  *   **3-No:** **Leaf 10:** *Modified Rationalism.* (Strict immunity exists, but logic revision is treated as belief discovery. Rare.)

  ### **From B1-Yes, 2-No**
  *   **3-Yes:** **Leaf 11:** *Semantic Realism.* (Analyticity exists in physics meaning, but measurement is empirical; logic is meaning. Uncommon mix.)
  *   **3-No:** **Leaf 12:** *Semantic Realism.* (Same as above. Uncommon mix.)

  ### **From B1-No, 2-Yes**
  *   **3-Yes:** **Leaf 13:** *Framework Conventionalism.* (Immunity exists; physics change is belief; calibration is analytic framework rule; logic is meaning. e.g., Carnapian.)
  *   **3-No:** **Leaf 14:** *Framework Conventionalism (Logic as Belief).* (Same as above, but logic is revisable belief within framework. Rare.)

  ### **From B1-No, 2-No**
  *   **3-Yes:** **Leaf 15:** *Synthetic Universalism.* (Immunity exists, but neither physics nor calibration are analytic; only logic is meaning. Incoherent/Empty.)
  *   **3-No:** **Leaf 16:** *Synthetic Universalism.* (Immunity exists, but nothing here is analytic. Contradicts Root Reject. Empty.)

  ---

  ## **Reasoning and Map of Debates**

  **Why These Three Nodes?**
  This tree isolates the three domains where the analytic-synthetic distinction faces the most pressure: natural law, stipulation, and formal truth.
  1.  **The Conservation Case (Natural Law):** Tests whether central scientific principles are protected by definition (analytic) or by their utility in the web of belief (synthetic/pragmatic). This maps the debate between traditional empiricists (who might see conservation as a defining principle) and Quineans (who see it as a highly central belief).
  2.  **The Calibration Case (Stipulation):** Tests the status of explicit conventions. If embedding a rule in hardware or a manual makes it "analytic," then analyticity is robust. If it remains a practical convention regardless of formulation, analyticity dissolves into pragmatism. This captures the Carnap-Quine dispute over linguistic frameworks.
  3.  **The Logic-Revision Case (Formal Truth):** Tests the limit of revisability. If logic is immune, analyticity survives at the core. If logic is revisable belief, Quine wins completely. If logic is revisable but changes meaning (conceptual role), a middle ground emerges.

  **Mapping the Positions**
  *   **Leaves 9 & 13 (Classical/Carnapian):** Represent the pre-Quinean consensus. They reject the Root (immunity exists) and treat definitions and logic as meaning-constitutive. Leaf 9 is the hardline view; Leaf 13 allows for conventional frameworks.
  *   **Leaf 8 (Quinean Holism):** The standard post-Quinean view. It accepts the Root (no immunity), treats physics changes as belief adjustments (Node 1-No), rejects analyticity in calibration (Node 2-No), and treats logic revision as belief change (Node 3-No).
  *   **Leaf 3 (Meaning-Constitutive Holism):** A modern compromise. It accepts Quine's global revisability (Root-Yes) but argues that meaning *does* shift when central norms change (Node 1-Yes, Node 3-Yes). This avoids the charge that Quinean holism makes communication impossible.
  *   **Leaves 1, 2, 5, 6 (Tensioned/Incoherent):** These flags highlight positions that claim Quine's global thesis (no immunity) while simultaneously asserting local analyticity. While some philosophers might use "analytic" pragmatically while accepting Quine's metaphysics, strictly speaking, these combinations are unstable.

  **Omissions and Limitations**
  This tree focuses on scientific and logical discourse, omitting ethical, aesthetic, or everyday language claims where the distinction might behave differently. It also simplifies "meaning" into a binary switch; many contemporary views treat meaning as graded or probabilistic, which would blur the branches. Finally, the tree assumes the reader can distinguish "meaning change" from "belief change" without a prior theory of meaning—a difficulty Quine himself highlighted as central to the problem. Leaves 15 and 16 are flagged as empty because rejecting the analytic-synthetic distinction (Root-Reject) while denying analyticity in all specific cases (Nodes 1 & 2-No) leaves no room for the "immunity" claimed at the Root.
