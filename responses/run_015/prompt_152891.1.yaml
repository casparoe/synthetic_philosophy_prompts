          *   If the will is to deceive, the technical truth of the words is a legalistic trick (casuistry).

      *   **Body Paragraph 4: Addressing the "Mental Reservation" Terminology:**
          *   Briefly note that "mental reservation" is later Jesuit stuff, but the *idea* is the test case for Augustine.
