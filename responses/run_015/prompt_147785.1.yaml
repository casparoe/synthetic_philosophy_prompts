prompt: |-
  I'm a fourth-year PhD student in philosophy of science, and I've been asked — as the only person on the committee with any philosophy training — to write the mechanism screen for my university's Interdisciplinary Seed Fund. Twice a year we read about fifty two-page pre-proposals requesting roughly $25,000 of pilot money, on everything from developmental psychology to structural engineering to computational linguistics. The panel is six faculty from different departments plus me; we have a single ninety-minute meeting in which everything gets ranked; and each reviewer sees a given pre-proposal once, for fifteen or twenty minutes, with no outside reading and no opportunity to query the applicant before we meet. What I need from you is a one-page decision procedure that a busy materials scientist or political scientist can run with no philosophical background, together with a short verdict slip — a few lines — that goes into our spreadsheet and, when a proposal is rejected on mechanism grounds, is close to what the chair's office sends back to the applicant. So it has to be usable inside twenty minutes, and it has to be defensible in writing to someone who is annoyed.

  Let me state the target distinction in my own rough terms so you don't have to guess where I'm starting. The first failure I want to catch is the ungrounded explainer: the proposal that accounts for a phenomenon by positing something at or above the level of the phenomenon which does the explaining but is itself unexplained — a striving, a vital force, a homunculus, an inner agent that wants what the organism wants, a capacity named after the very thing to be explained. The second failure is the mirror image, and the one I worry about more, because it is the one my colleagues will commit: dismissing a genuinely explanatory pattern merely because it lives at a higher level and nobody has yet spelled out the machinery under it. Population-level phenomena, optimality principles, and pattern-explanations that can be realized in many different substrates all look hand-wavy to a reviewer who is impatient for a mechanism, and I have watched good proposals die that way. There is a third case I've become convinced is distinct from either of these, and for which I have no name I'm happy with — I've been calling them borrowed cranes: a mechanism that is a real working machine in the domain it was invented in, imported into a new domain without the parts that made it work there. Selection moved from genes to cultural change without any account of what plays the role of faithful copying; representation moved from agents who use models to circuits that have no user; optimization moved from engineered systems with an explicit objective to growing tissue that is not optimizing anything in particular. A borrowed crane passes the tests that catch the first failure and is invisible to the second, and I don't know how to make a non-philosopher see it. My first attempt at a screen was a single question — could you in principle build the thing to be explained out of parts that don't already have the property being explained? — and it failed in both directions: it flagged a solid epidemiology proposal on herd immunity, and it waved through a proposal attributing rising adolescent anxiety to a loss of meaning in modern life, because meaning is not literally the same property as anxiety.

  So: give me the ordered questions the reviewer runs, no more than five or six, each with a statement of what would count as a sufficient answer at the depth a two-page pre-proposal can provide, and with explicit stopping points — where the answer is a no and the proposal is out on mechanism grounds, where it requires only that the applicant fill in a short mechanism box before the panel will rank it, and where it should simply be marked as a legitimate higher-level description that no mechanism is owed yet. Mark the places where the procedure has to hand the question back to a human because it is a question about what we want the fund to be rather than about how explanations work; I suspect how much sheer speculation we are willing to buy is one of these, and I'd like you to say so rather than smuggle in a threshold. Build in a self-check against the procedure's own bias: I have a strong prior that any screen like this will end up rewarding proposals that mention something neural or molecular whether or not the lower-level story actually explains the phenomenon at the level it was described, and I want the sheet to protect against that specifically. Tell me plainly where the procedure will misfire — I'm especially worried about mathematical and optimality explanations, which name no parts and no steps and are sometimes the best account available. Write out the actual verdict slip for each of these three, in the handful of sentences the chair would send:

  1. A psychology and neuroscience proposal: older adults recall emotional events better than neutral ones because the amygdala tags a memory as significant and thereby prioritizes it for consolidation.
  2. A sociology proposal: some neighbourhoods recover from economic shocks faster than others because of collective efficacy, the neighbourhood's shared capacity to exercise informal social control; they will measure it by survey and correlate it with recovery. I genuinely expect the verdict here to be more permissive than I want it to be — I think the construct is close to circular and my philosopher friends agree — and I would rather be told that than have you flatter me.
  3. A biomechanics proposal: the shape of a growing bone is explained by a principle of mechanical optimality, bone adapting so as to minimize strain energy under load.

  Finally, be honest about what the screen cannot do at all, and — since I should disclose that my own dissertation chapter explains the allocation of credit in science by appeal to a norm of credit-worthiness, and is therefore exactly the sort of thing this sheet might bite — tell me in a sentence what it would say about that too, even if the answer is unflattering.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and verdict slips:

  1.  **Analyze the Request:**

      *   **User:** 4th-year PhD student in philosophy of science.
      *   **Task:** Create a one-page mechanism screen for an Interdisciplinary Seed Fund committee.
      *   **Audience:** 6 faculty reviewers from various disciplines (materials science, political science, etc.) with *no* philosophy training.
      *   **Constraints:**
          *   Must be usable in 15-20 minutes per proposal.
          *   Must be defensible in writing to annoyed applicants.
          *   Must produce a short verdict slip for the spreadsheet/chair.
          *   Must address three specific failure modes:
              1.  *Ungrounded Explainer* (homunculus, vital force, circular capacity).
              2.  *Premature Reductionism* (dismissing valid higher-level/pattern explanations).
              3.  *Borrowed Cranes* (imported mechanisms lacking necessary parts in the new domain).
          *   Must include explicit stopping points (Reject, Fix, Accept).
          *   Must flag policy questions (speculation tolerance) vs. explanation questions.
          *   Must include a self-check against "neuro/molecular bias."
          *   Must admit limitations (especially regarding math/optimality).
          *   Must provide verdict slips for three specific test cases (Psych/Neuro, Sociology, Biomechanics).
          *   Must evaluate the user's own dissertation topic (credit-worthiness norm).
      *   **Tone:** Professional, precise, pragmatic, honest about limitations.

  2.  **Deconstruct the Philosophical Problems:**

      *   *Ungrounded Explainer:* This is essentially the problem of circularity or homuncular functionalism. The explanation re-describes the phenomenon rather than decomposing it.
      *   *Premature Reductionism:* This is the autonomy of higher-level sciences problem. Not everything needs a micro-story to be explanatory (multiple realizability, pattern explanations).
      *   *Borrowed Cranes:* This is the problem of analogical transfer without structural mapping. A mechanism works in Domain A because of Conditions X, Y, Z. If you move it to Domain B but B lacks X, Y, Z, the mechanism is broken.

  3.  **Drafting the Decision Procedure (The "Screen"):**

      *   *Goal:* 5-6 ordered questions.
      *   *Constraint:* Needs to stop "neuro-bias" (just naming a brain part isn't enough).
      *   *Constraint:* Needs to allow math/optimality (which don't have "parts").

      *   *Drafting Q1 (The Phenomenon):* Is the thing to be explained clearly distinct from the thing doing the explaining? (Catches circularity).
      *   *Drafting Q2 (The Mechanism/Process):* Does the proposal identify *changes* or *interactions*, not just labels? (Catches static labels).
      *   *Drafting Q3 (The Borrowed Crane Check):* If the mechanism is imported, are the necessary conditions present in the new domain? (Catches borrowed cranes).
      *   *Drafting Q4 (The Reductionism Check):* If no lower-level parts are named, is there a reason why a pattern explanation suffices? (Protects higher-level science).
      *   *Drafting Q5 (The Speculation/Policy Check):* Is the gap between what is known and what is proposed a matter of *missing data* (fixable) or *missing concept* (fatal)? (Flags policy).
      *   *Drafting Q6 (The Bias Check):* Does naming a lower-level component actually resolve the causal story, or just relocate the mystery? (Anti-neuro-bias).

      *   *Refining for Speed:* Needs to be punchy.
      *   *Refining Stopping Points:* Need clear "Stop: Reject," "Stop: Revise," "Continue."

  4.  **Developing the Verdict Slips:**

      *   Need to match the tone of a chair's office (polite but firm).
      *   Need to address the specific philosophical issue in each case.

      *   *Case 1 (Amygdala/Emotion):* This is a standard mechanistic story. Parts (amygdala, memory systems), Activities (tagging, consolidation), Organization (temporal priority). *Verdict:* Pass.
      *   *Case 2 (Collective Efficacy):* This risks circularity ("capacity to control" explains "control"). But it's a standard sociological construct. The prompt says the user thinks it's circular. I need to be honest. If the screen works, it should flag the circularity risk but allow it if operationalized. *Verdict:* Conditional Pass (needs operationalization to avoid circularity).
      *   *Case 3 (Bone Optimality):* This is a mathematical/principle explanation, not a mechanistic one in the "parts" sense. The screen must not reject this. *Verdict:* Pass (as a constraint explanation).

  5.  **Addressing the Limitations & The User's Dissertation:**

      *   *Limitations:* Math explanations, historical explanations, normative explanations.
      *   *Dissertation:* "Credit-worthiness norm." This sounds like a normative functional explanation. Does it have a mechanism? How is the norm enforced? If it's just "scientists act this way because it's the norm," that's a Borrowed Crane or Ungrounded Explainer unless the *sanctioning mechanism* is described. I need to be blunt here.

  6.  **Iterative Refinement (Self-Correction during drafting):**

      *   *Critique:* Is Q3 too hard for a non-philosopher?
      *   *Fix:* Phrase it as "Does the new domain have the equivalent of the engine parts?"
      *   *Critique:* How do I handle the "Policy" aspect?
      *   *Fix:* Make a specific box for "Speculation Level."
      *   *Critique:* The user wants to know where the procedure misfires.
      *   *Fix:* Add a "Known Failure Modes" section at the bottom.
      *   *Critique:* The user is worried about the Sociology case being let through too easily.
      *   *Fix:* Ensure the screen asks if the *measure* is distinct from the *outcome*. If "efficacy" is measured by "recovery," it's circular. The verdict slip needs to reflect this tension.

  7.  **Finalizing the Output Structure:**

      *   **Header:** Title, Instructions.
      *   **The Screen:** 5 Questions with Decision Nodes.
      *   **The Bias Check:** Explicit instruction.
      *   **Verdict Slips:** The 3 requested examples.
      *   **Limitations & Honesty:** Where it fails + The Dissertation check.

  8.  **Drafting the Content (Mental or Scratchpad):**

      *   *Q1:* Distinctness. (Is X explaining Y, where X != Y?)
      *   *Q2:* Decomposition/Activity. (Are there steps/parts?)
      *   *Q3:* Import Validity. (If imported, are the conditions met?)
      *   *Q4:* Higher-Level Validity. (If no parts, is the pattern robust?)
      *   *Q5:* Speculation. (Is the gap bridgeable with $25k?)
      *   *Bias Check:* "Does naming a micro-part explain the macro-function?"

      *   *Refining the Sociology Verdict:* The user suspects circularity. "Collective efficacy" is often measured by surveys about willingness to intervene. Recovery is economic. If the survey predicts recovery, it's not strictly circular, but it risks being a redescription of "social cohesion." I will write the verdict to demand distinct operationalization.

      *   *Refining the Dissertation:* "Norm of credit-worthiness." If the mechanism is "scientists follow norms," that's a homunculus unless you explain *how* the norm exerts force (citation practices, hiring, reputation). I will tell the user: "It flags your dissertation as a Borrowed Crane unless you specify the sanctioning mechanism."

  9.  **Final Polish:** Check against the "one-page" constraint (visually) and the "20 minutes" constraint. Ensure the tone is respectful of the user's expertise but practical for the committee. (Self-correction: Ensure the distinction between "Reject" and "Revise" is clear).

  10. **Final Review against constraints:**
      *   One page decision procedure? (Will format tightly).
      *   Short verdict slip? (Yes).
      *   Usable by non-philosophers? (Yes, plain language).
      *   Addresses 3 failure modes? (Yes).
      *   Addresses Neuro-bias? (Yes).
      *   Addresses Math/Optimality? (Yes).
      *   Verdicts for 3 cases? (Yes).
      *   Honesty about limitations? (Yes).
      *   Dissertation check? (Yes).

  (Proceed to generate output based on these thoughts.)
answer: |-
  # INTERDISCIPLINARY SEED FUND: MECHANISM SCREEN
  **For Reviewer Use Only.** Do not attach to applicant feedback.
  **Time Limit:** 5 minutes. **Goal:** Filter fatal explanatory flaws, not judge merit.

  ### THE DECISION PROCEDURE

  **Q1. The Circularity Check (Ungrounded Explainer)**
  Is the *explanans* (the thing doing the explaining) distinct from the *explanandum* (the thing to be explained)?
  *   *Pass:* The mechanism is a different kind of thing than the outcome (e.g., "neural firing" explains "memory," not "memory" explains "memory").
  *   *Fail:* The mechanism is named after the outcome (e.g., "dormitive virtue," "will to power," "anxiety causes anxiety").
  *   **STOP → REJECT** if the proposal defines the cause solely by the effect.

  **Q2. The Activity Check (Borrowed Crane)**
  If the proposal imports a mechanism from another field (e.g., "selection," "optimization," "representation"), does the new domain possess the physical or structural requirements for that mechanism to work?
  *   *Pass:* The proposal identifies the *local equivalent* of the necessary parts (e.g., if "selection," what is the replicator? if "optimization," what is the feedback loop?).
  *   *Fail:* The mechanism is asserted without the engine that drives it (e.g., "culture evolves" without a copying mechanism).
  *   **STOP → REJECT** if the mechanism is a metaphor that cannot physically operate in this domain.

  **Q3. The Level Check (Premature Reductionism)**
  If the proposal offers a higher-level pattern (population, social, mathematical) without lower-level parts, is there a justification for why the pattern suffices?
  *   *Pass:* The proposal argues the pattern is robust across different underlying implementations (multiple realizability) OR the lower-level details are irrelevant to the specific question.
  *   *Fail:* The proposal claims a lower-level story is unnecessary simply because it is hard, without arguing for autonomy.
  *   **FLAG → REVISE** if the proposal dismisses mechanism without justification. (Do not Reject; this is a higher-level explanation).

  **Q4. The Speculation Check (Policy Boundary)**
  Is the gap between current knowledge and the proposed mechanism a matter of *missing data* (we know the parts, need to measure them) or *missing concept* (we don't know how the parts could possibly work)?
  *   *Pass:* Missing data. The $25k can buy the measurements to fill the boxes.
  *   *Fail:* Missing concept. The $25k cannot invent a new physics or sociology.
  *   **STOP → REJECT** if the proposal requires inventing a new concept to function.

  **Q5. The "Neuro/Molecular" Bias Check (Self-Correction)**
  *Ask this only if the proposal names specific biological/physical parts.*
  Does naming the lower-level part actually explain the *function* described, or does it just relocate the mystery?
  *   *Pass:* The activity of the part maps to the function (e.g., "amygdala tagging" maps to "prioritization").
  *   *Fail:* The part is named, but its activity is just the function restated (e.g., "the morality module produces moral decisions").
  *   **FLAG → REVISE** if the lower-level story is a "black box" with a fancy label.

  ---

  ### VERDICT SLIPS (For Spreadsheet/Chair)

  **Option A: Clear Pass**
  > "Mechanism is sound. The proposed components are distinct from the phenomenon, and the causal activities are plausible within the domain. No explanatory circularity detected."

  **Option B: Revise (Mechanism Box Required)**
  > "The explanatory link is currently underspecified. Before full proposal, applicant must specify: [Insert specific missing link from Q2 or Q5]. The current description risks circularity or metaphorical transfer without structural support."

  **Option C: Reject (Mechanism Grounds)**
  > "The proposal explains the phenomenon by positing a capacity that is indistinguishable from the phenomenon itself (circularity), OR imports a mechanism that lacks the necessary physical conditions to operate in this domain. Pilot funds cannot resolve this conceptual gap."

  ---

  ### TEST CASE VERDICTS

  **1. Psychology/Neuroscience (Amygdala & Memory)**
  **Verdict:** **Option A (Clear Pass)**
  **Chair's Note:** "Mechanism is sound. The proposed components (amygdala, consolidation processes) are distinct from the phenomenon (emotional recall bias), and the causal activities (tagging, prioritization) are plausible within the domain. No explanatory circularity detected."

  **2. Sociology (Collective Efficacy & Recovery)**
  **Verdict:** **Option B (Revise)**
  **Chair's Note:** "The explanatory link is currently underspecified. Before full proposal, applicant must specify: how 'collective efficacy' is measured independently of the economic recovery outcome. The current description risks circularity if the capacity to control is inferred solely from the recovery it is meant to explain."
  *(Philosopher's Note: You are right to be worried. If efficacy is measured by survey, it passes Q1. If it is inferred from recovery, it fails Q1. The screen forces them to commit to the survey.)*

  **3. Biomechanics (Bone Optimality)**
  **Verdict:** **Option A (Clear Pass)**
  **Chair's Note:** "Mechanism is sound. This is a legitimate higher-level constraint explanation (Q3). The principle of strain minimization functions as a physical constraint on growth, not a homuncular goal. No lower-level parts are required for this specific explanatory aim."

  ---

  ### KNOWN FAILURE MODES & HONESTY CHECK

  **Where this screen misfires:**
  1.  **Mathematical Explanations:** Q2 may flag pure mathematical explanations (e.g., graph theory, pure optimization) as "Borrowed Cranes" if the reviewer insists on physical parts. *Instruction:* If the explanation is purely mathematical, skip Q2 and pass Q3.
  2.  **Historical/Origin Explanations:** This screen tests *sustaining* mechanisms, not *origin* stories. A proposal explaining how a trait arose historically may fail Q2 even if valid.
  3.  **Normative Explanations:** This screen cannot evaluate explanations based on reasons, norms, or rules unless they are cashed out in sanctions or enforcement.

  **Regarding your dissertation (Credit-Worthiness Norms):**
  If your proposal states that scientists allocate credit *because* they follow a "norm of credit-worthiness," this screen will flag it as a **Borrowed Crane (Q2)** or **Ungrounded Explainer (Q1)**.
  *   **Why:** A "norm" is not a mechanism; it is a pattern of behavior. To pass, you must specify the *sanctioning mechanism* (e.g., citation withholding, reputation loss, hiring bias) that enforces the norm. Without the enforcement machinery, "norm" is a homunculus for "social pressure." You will need to argue under Q3 that the norm is a robust pattern independent of the specific sanctions, or fill the Q2 box with the sociology of enforcement.
