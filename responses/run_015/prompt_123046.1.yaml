      Actually, looking closer at the prompt's hint: "probably the claim that unjust origins void later clean titles."
      Nozick agrees unjust origins void titles (Rectification). The *sticky* part of Nozick is that *just* origins + voluntary transfer = absolute title, *even if* the result looks crazy (inequality).
