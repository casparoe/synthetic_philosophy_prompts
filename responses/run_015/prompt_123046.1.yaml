      *   **Time:** 90 mins total. Breakdown: Intro (10), Game (40), Reveal/Debrief (40).
      *   **Materials:** Simple. Cards, tokens, paper. Writers like tactile stuff.
      *   **The Currency:** "Ink Points" (fits writers).
