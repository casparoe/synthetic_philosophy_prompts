      *   **The Payoff:** Who picks the reading? The person with the most *Net* value (Points minus Debt)? Or do we reveal the debt and ask if they *should* keep the prize?
      *   *Decision:* The winner is initially declared by Points. Then the Debt is revealed. The group must decide if the winner still deserves the prize. This forces the debate.

