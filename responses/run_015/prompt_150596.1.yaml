answer: |-
  You have not found three unrelated bugs. You have independently rediscovered the core triad of problems in **Embedded Agency**.

  This is not a standard computer science curriculum topic; it is active research in decision theory and AI alignment (primarily associated with MIRI, LessWrong, and researchers like Scott Garrabrant and Abram Demski). The fact that you hit this wall in actual code at 17 is impressive. You are pattern-matching correctly.

  Here is the breakdown of what you found, what it's called, and how much of it is "real" theory vs. engineering constraints.

  ### The Umbrella Concept: Embedded Agency
  **Definition:** An agent is "embedded" when it is part of the environment it is modeling, rather than standing outside it (like a Cartesian dualist).
  **The Core Tension:** To make a decision, an agent needs a model of the world. If the agent is *in* the world, the model must contain a model of the agent. This creates self-reference, which leads to the three problems you encountered.

  ---

  ### Case 1: The Recursion Limit (Boundedness)
  *   **Your Observation:** Simulating yourself leads to infinite recursion. Capping depth makes the decision arbitrary.
  *   **The Concept:** **Bounded Rationality & The Tiling Agents Problem.**
  *   **Analysis:**
      *   **Engineering Bug (High Confidence):** The infinite recursion is a stack overflow. In theory, a perfect agent with infinite compute could simulate itself (if it halts), but in practice, you are bounded.
      *   **Theoretical Problem (Medium-High Confidence):** The "arbitrary base case" issue is real. In game theory, if two bounded agents simulate each other, the outcome often depends on who runs out of stack first or what their "timeout" behavior is. This is studied under **Bounded Decision Theory**. It's not just a bug; it's a fundamental limitation of agents that cannot prove the halting behavior of their own source code (Gödelian limits).
  *   **Verdict:** This is the computational constraint layer. It forces the agent to be *approximate*, which breaks the perfect logic required for the other two cases.

  ### Case 2: The Identical Branches (Counterfactuals)
  *   **Your Observation:** You can't simulate "What if I moved Left?" because your model knows you *will* move Right. Forcing "Left" creates a world that isn't you.
  *   **The Concept:** **The Problem of Counterfactuals for Embedded Agents.**
  *   **Analysis:**
      *   **Theoretical Problem (High Confidence):** This is the heart of the dispute between **Causal Decision Theory (CDT)** and **Functional/Evidential Decision Theory (FDT/EDT)**.
      *   **Why it happens:** Standard causal reasoning uses a `do()` operator (Pearl's Causal Calculus). It says "Intervene on variable X." But if X is *your own decision algorithm*, you can't `do(X)` without breaking the link between "You" and "The Output."
      *   **The Conflict:**
          *   If you treat your decision as a physical action (CDT), you get the "identical branches" problem because the model predicts your action based on your code.
          *   If you treat your decision as a logical output (FDT), you ask "What if the *function* returned Left?" This allows you to compare branches, but it requires you to view yourself as an abstract function, not just a physical bot.
      *   **Your "Hack":** Hard-forcing the move is actually the correct theoretical move *if* you treat it as a logical counterfactual ("What if the output of `decide()` was Left?"). The unease you feel ("that isn't the world I'm in") is the exact philosophical tension of **Logical Counterfactuals**.
  *   **Verdict:** This is the most "real" theory of the three. You are struggling with how to define a counterfactual when the antecedent ("I move Left") is logically false given your source code ("I move Right").

  ### Case 3: The Self-Readout (Logical Uncertainty)
  *   **Your Observation:** If I know what I'll do, thinking is theater. If I'm unsure, how do I plan for the error case?
  *   **The Concept:** **Logical Uncertainty & Policy Selection.**
  *   **Analysis:**
      *   **Theoretical Problem (Medium Confidence):** This touches on **Timeless Decision Theory (TDT)** and **Logical Induction**.
      *   **The "Theater" Point:** If you have perfect self-knowledge, decision theory collapses. You don't "choose"; you "discover" what you do. This is the **Newcomb Problem** dynamic.
      *   **The 10% Error:** This is the hard part. You are asking: "How do I condition on a logical falsehood?" (i.e., "What if my source code outputs X, even though I can prove it outputs Y?"). Standard probability theory breaks here (probability of a falsehood is 0).
      *   **Policy vs. Action:** The solution in literature is usually **Policy Selection**. You don't decide "Left or Right" in the moment; you decide "What kind of agent am I?" *before* the situation arises. The 10% error case is handled by having a policy that is robust to logical noise.
  *   **Verdict:** This is the frontier. There is no consensus math for "probability of logical statements" yet, though **Logical Induction** is the leading candidate.

  ---

  ### Unification: Are these three hats or one head?
  They are one head. They are the three constraints of **Embedded Agency**:
  1.  **Boundedness** (Case 1): I cannot compute the full truth.
  2.  **Self-Reference** (Case 2): I am part of the truth I am computing.
  3.  **Logical Uncertainty** (Case 3): I cannot be certain of the truths about myself.

  If you fix Case 1 (infinite compute), you still have Case 2 (counterfactuals).
  If you fix Case 2 (perfect counterfactuals), you still have Case 3 (logical uncertainty about your own code).
  They are layers of the same onion.

  ### Confidence Flags & Honesty Check

  *   **Confidence that this is "Embedded Agency":** **High.** This is the exact terminology used by researchers (Garrabrant et al., 2016 "Embedded Agency" sequence) to describe this cluster.
  *   **Confidence that Case 1 is just a bug:** **Low.** It looks like a bug, but the *consequence* (arbitrary base cases deciding outcomes) is a known theoretical pathology in bounded game theory.
  *   **Confidence that Case 2 is solved:** **Low.** There is no consensus on the "correct" decision theory for embedded agents. CDT, EDT, and FDT all have failure modes here. You are feeling the friction of an unsolved problem.
  *   **Confidence that Case 3 is standard:** **Medium.** Logical Uncertainty is a defined field, but the math is not settled. Your intuition that "conditioning on my own error" is circular is correct and currently debated.
  *   **Honesty Check:** Am I unifying unrelated things? **No.** In standard AI (like Chess engines), these problems don't exist because the engine is *not* part of the board state. In your robotics/strategy bot, the bot *is* part of the state. That distinction is what makes this a specific theoretical cluster rather than three random bugs.

  ### How this differs from standard concepts you know
  *   **Vs. Newcomb's Problem:** Newcomb's is a specific thought experiment. Your Case 2 is the *mechanism* that makes Newcomb's problem hard (the predictor is simulating you). You are building the predictor *and* the agent simultaneously.
  *   **Vs. Causal Decision Theory:** CDT assumes you can surgically alter your action without altering the past or your source code. Your Case 2 proves you can't do that in a simulation that includes your source code.
  *   **Vs. Recursion:** Standard recursion stops when the problem gets smaller. Self-simulation recursion stops when you run out of memory. The "arbitrary base case" issue is specific to *decision* recursion, not math recursion.

  ### Recommendations
  If you want to read the actual math/papers on this:
  1.  **Search Term:** "Embedded Agency Sequence" (LessWrong/MIRI).
  2.  **Key Paper:** "Functional Decision Theory" (Yudkowsky & Soares). It specifically addresses your Case 2.
  3.  **Key Concept:** "Logical Counterfactuals." This is the specific name for the headache in Case 2 and 3.

  **Summary:** You aren't crazy. You built an embedded agent, and you hit the walls that professional AI safety researchers hit. Case 1 is boundedness, Case 2 is counterfactuals, Case 3 is logical uncertainty. Together, they are Embedded Agency.
