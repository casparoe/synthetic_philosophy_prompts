answer: |-
  **PHI 4050: Metaphysics — Final Examination**

  **Question 1**
  Max Black's two-spheres case is frequently presented as a straightforward counterexample to the Principle of the Identity of Indiscernibles (PII). However, the dialectical utility of PII extends beyond mere taxonomy; historically, it has served as a premise in arguments against substantivalist conceptions of space (e.g., in the Leibniz–Clarke correspondence).

  Consider Black's symmetric universe containing only two qualitatively identical spheres. Now, consider a temporal analogue: **The Case of the Successive Spheres.** In this scenario, a single perfectly homogeneous sphere exists for one million years, is annihilated, and after a gap of one million years, a second sphere comes into existence, qualitatively identical to the first in every intrinsic and relational respect (relative to the flow of time itself).

  Write an essay evaluating the status of PII in light of these cases. Do not merely list standard defenses of PII (e.g., haecceities, impure properties). Instead, assess the *metaphysical costs* required to maintain PII against Black's challenge. Specifically: does saving PII in the coexistence case undermine its utility in arguments against substantivalism? Does the Successive Spheres case impose different costs than the Black case, particularly regarding the nature of time and numerical diversity? Conclude by stating whether PII emerges as a necessary truth, a contingent generalization, or a principle whose truth renders it philosophically inert.

  **(Word Limit: 1,200 words)**

  ***

  ### Model Answer (A-Level)

  Black's two-spheres case is often treated as a refutation of the Principle of the Identity of Indiscernibles (PII). The standard undergraduate reading is that Black demonstrates the metaphysical possibility of two distinct objects sharing all qualitative properties, thus falsifying PII. However, this reading ignores the dialectical context in which PII operates. To evaluate PII properly, one must examine the metaphysical commitments required to save it and whether those commitments neutralize PII's philosophical utility.

  In Black's symmetric universe, the spheres share all intrinsic properties. If space is relational, they also share all spatial properties (e.g., each is two miles from the other sphere). Under relationalism, they appear genuinely indiscernible, threatening PII. To save PII here, one might appeal to substantivalism: if space is a container of absolute positions, Sphere A occupies position $p_1$ and Sphere B occupies $p_2$. They are thus discernible by their absolute locations.

  However, this defense creates a "squeeze." PII has historically been weaponized against substantivalism via the Leibniz Shift argument: if space is substantival, God could shift the entire material world three feet east. The resulting world would differ numerically from the original but be qualitatively identical, violating the Principle of Sufficient Reason (PSR). Leibniz used PII to argue that such shifted worlds are impossible, thereby rejecting substantivalism. But if we accept substantivalism to save PII from Black's spheres (by distinguishing them via absolute position), we undermine the anti-substantivalist argument. In a substantivalist framework, the shifted world *is* qualitatively distinct from the original (objects occupy different absolute positions). Thus, PII is saved from Black's counterexample only by adopting a metaphysics (substantivalism) that renders PII useless for its traditional purpose (refuting substantivalism). If we retain relationalism to keep PII useful, Black's case stands as a genuine counterexample. PII is thus either false or trivialized.

  The Case of the Successive Spheres complicates this by introducing time. Here, numerical diversity is separated by a temporal gap rather than spatial distance. If time is relational (reducible to events), the two spheres occupy identical positions in the causal structure relative to their own existence. There is no "other object" to relate to, and if the universe resets, their relational properties match. If PII holds, they must be the same object. But they are separated by non-existence. To distinguish them while maintaining PII, one must posit absolute time. If moments are substantival, Sphere 1 exists at $t_1$ and Sphere 2 at $t_2$. They are discernible by their temporal location.

  Yet, the cost mirrors the spatial case. If time is substantival, a "shifted" history (where all events occur one hour later) becomes a distinct possible world. This undermines the Leibnizian argument against absolute time. If time is relational, the Successive Spheres are indiscernible, and PII fails unless one denies the possibility of the case. Denying the possibility, however, imposes a heavy modal cost: it suggests that qualitative identity across time necessitates numerical identity, effectively collapsing the distinction between recurrence and persistence. This threatens bundle theory, which relies on PII to individuate objects via properties. If two distinct bundles can share all properties (whether coexisting or successive), properties alone cannot ground individuation.

  Furthermore, the Successive Spheres case highlights a disanalogy with Black's case. In Black's universe, the spheres are causally contemporaneous; in the Successive case, they are not. One might argue that "being the first sphere" is a property the second lacks. But this presupposes the numerical diversity PII is meant to ground. If we treat temporal indices as genuine properties (impure properties), PII becomes tautological: every object is discernible by the property of being identical to itself or occupying its specific spacetime coordinate. This saves PII but renders it philosophically inert; it no longer constrains metaphysics but merely reflects it.

  Ultimately, the defense of PII against these cases reveals a trade-off. To maintain PII as a necessary truth, one must adopt absolute space and time. But doing so surrenders the Leibnizian arguments that made PII metaphysically significant. If one rejects absolutism to preserve those arguments, PII falls to Black's counterexamples. Therefore, PII cannot be both true and theoretically fruitful. It emerges not as a necessary truth governing reality, but as a principle whose validity depends on prior metaphysical commitments that determine its utility. In the light of Black and the Successive Spheres, PII is best understood as contingent upon a substantivalist framework, wherein it is true but incapable of doing the critical work Leibniz assigned it.

  ***

  ### Marking Scheme (Total: 25 Points)

  **1. Analysis of Black's Case beyond "Refutation" (5 points)**
  *   **Full Credit:** Recognizes that Black's case only threatens PII under relationalism; acknowledges that substantivalism distinguishes the spheres via location.
  *   **Typical Miss:** Treats Black's case as an unconditional refutation of PII without noting the dependence on the nature of space.

  **2. The "Squeeze" Argument (Substantivalism vs. Utility) (5 points)**
  *   **Full Credit:** Explicitly connects the defense of PII (via substantivalism) to the failure of the Leibniz Shift argument. Notes that saving PII makes it useless for anti-substantivalist arguments.
  *   **Typical Miss:** Discusses substantivalism and Leibniz separately without identifying the tension/trade-off between them.

  **3. Application to Successive Spheres (5 points)**
  *   **Full Credit:** Identifies the temporal analogue (absolute time vs. relational time). Notes that distinguishing the spheres requires absolute time, which incurs the same "shifted history" cost as the spatial case.
  *   **Typical Miss:** Treats the Successive Spheres as identical to Black's case without addressing the specific metaphysics of time or persistence.

  **4. Evaluation of Metaphysical Costs (Haecceities/Impure Properties) (5 points)**
  *   **Full Credit:** Critiques standard replies (e.g., impure properties like "being at $t_1$") as rendering PII tautological or inert. Discusses the cost to Bundle Theory or individuation.
  *   **Typical Miss:** Lists haecceities or impure properties as valid solutions without evaluating whether they trivialize the principle.

  **5. Conclusion on Modal Status/Utility (5 points)**
  *   **Full Credit:** Concludes that PII is either false (under relationalism) or trivial/too weak to do philosophical work (under substantivalism). Avoids sitting on the fence.
  *   **Typical Miss:** Concludes vaguely that "it depends on one's theory" without assessing the philosophical consequence of that dependency.

  ***

  ### Note on B-Level Answers (For TA Consistency)

  A solid **B-range answer (17–20 points)** will demonstrate clear knowledge of the literature but miss the dialectical "squeeze."
  *   **Strengths:** They will correctly explain Black's case and likely note that absolute position distinguishes the spheres. They will handle the Successive Spheres case competently, noting that temporal location distinguishes the spheres. They will mention Bundle Theory and the Shift argument.
  *   **Weaknesses:** They will treat these as separate points rather than a unified tension. They will likely argue that PII *can* be saved by substantivalism without realizing this undermines the Leibnizian motivation for PII in the first place. They may treat impure properties as a successful defense rather than a trivialization. Essentially, they answer "How do we save PII?" rather than "What is the cost of saving it?"
  *   **Differentiation:** If the student identifies the trade-off but explains it clumsily, lean toward the high B/low A. If they miss the trade-off entirely but write a technically accurate summary of the positions, cap at mid-B.
