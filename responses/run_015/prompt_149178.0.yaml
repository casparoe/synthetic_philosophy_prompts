answer: |-
  Here is a procedure designed for your constraints: low-tech, high-stakes, time-poor, and audit-ready. It prioritizes **logical consistency** over **direct democracy** to prevent the "discursive dilemma" from happening again.

  ### Part 1: The Protocol (The "Tuesday Afternoon" Procedure)

  **Phase 0: Pre-Meeting Lock (Secretariat Responsibility)**
  1.  **Drafting:** You draft the propositions. Do not wait for the committee. Use the **"Because Test"**: Every proposition must stand alone as a sentence that can be True/False or Accepted/Rejected.
      *   *Bad:* "We should screen because it's safe."
      *   *Good:* P1: "The test's false positive rate is acceptable." P2: "If the false positive rate is acceptable, the college should endorse screening."
  2.  **Logic Map:** Create a simple dependency tree. (e.g., P3 depends on P1 AND P2).
  3.  **The Freeze:** Send the spreadsheet to the Chair 24 hours prior. **No new propositions** can be added during the meeting without a 2/3 procedural vote to "Reopen Agenda."
      *   *At 3pm when someone proposes a new item:* Chair says, "That is a new proposition. Under the Protocol, it is tabled for the next meeting unless 2/3 of us vote to reopen the agenda now." (They won't vote to reopen. Item dies.)

  **Phase 1: The Vote (Meeting)**
  1.  **Order:** Vote on **Premises** (Facts/Norms) first. Vote on **Conditionals** (If/Then) second. Vote on **Conclusions** (Headline Recommendations) last.
  2.  **Thresholds:** The spreadsheet column "Threshold" dictates the pass mark for *that specific row* (e.g., 50% + 1, or 2/3).
  3.  **Abstentions:** Counted as "Present but Not Voting." They lower the denominator for majority calculations only if your bylaws allow; otherwise, they count toward the quorum but not the result. *Recommendation:* Treat Abstain as "No" for the purpose of reaching a supermajority threshold to be safe.
  4.  **The Conditional:** You specifically asked about "If facts X, then should Y." This **must** be a separate row (P2 in the example below). Do not bury it.

  **Phase 2: The Derivation (Post-Vote, Pre-Adjournment)**
  1.  **Automatic Calculation:** The spreadsheet must have a column "Derived Status."
      *   If P1 = Pass AND P2 (If P1 then P3) = Pass, then P3 = **Adopted by Derivation**.
      *   If P3 Direct Vote = Fail, but Derived Status = Adopted, **Derived Status Wins**.
      *   *Why:* This prevents the "no single member supported the conjunction" error. The collective will of the premises binds the conclusion.
  2.  **Inconsistency Check:** If two passed items contradict (e.g., "Do X" and "Do Not X"), the spreadsheet flags **"LOGIC ERROR."**
      *   *Action:* The statement cannot be published. It goes to Council as a "Values Call."

  **Phase 3: The Audit Trail (The Record)**
  1.  **Save the Sheet:** Save the spreadsheet with the raw vote counts (Yes/No/Abstain) per member (or at least per block if anonymous).
  2.  **The Logic Note:** In the minutes, record: "Item 3 was adopted by logical derivation from Items 1 and 2, despite failing direct vote."
  3.  **Reproducibility:** An outsider must be able to look at the Pass/Fail column and the Dependency column and reproduce the final text without knowing who sat in the room.

  ---

  ### Part 2: The Spreadsheet Structure

  Create one tab per Position Statement. Columns A through H:

  | Col | Header | Content/Formula |
  | :--- | :--- | :--- |
  | **A** | **ID** | P1, P2, P3... |
  | **B** | **Text** | The exact English sentence. |
  | **C** | **Type** | Fact / Norm / Conditional / Conclusion |
  | **D** | **Threshold** | 50% / 66% (Hardcoded per bylaws) |
  | **E** | **Yes** | Count from show of hands |
  | **F** | **No** | Count from show of hands |
  | **G** | **Result** | Formula: `IF(E >= Threshold, "PASS", "FAIL")` |
  | **H** | **Final Status** | Formula: `IF(Logical_Error, "FLAGGED", IF(Derived, "ADOPTED", Result))` |

  **Chair's Script (Print this on one page):**
  1.  "We are voting on Premises first. Conclusions are derived, not decided."
  2.  "If the Logic Map says P3 follows from P1 and P2, and both passed, P3 is adopted even if you vote No on P3."
  3.  "If we get a Logic Error flag, we stop. We do not publish."

  ---

  ### Part 3: Blunt Failure Modes (Where This Misfires)

  1.  **The Chair's Veto:** If the Chair hates the derived conclusion, they will try to call a "Motion to Reconsider P1."
      *   *Counter:* You must rule that Premises are locked once voted. Reopening a premise requires the 2/3 "Reopen Agenda" vote.
  2.  **Semantic Drift:** Clinicians will argue P1 and P2 are "basically the same thing."
      *   *Counter:* If they are the same, delete one. If they are different, keep them. Do not allow "voting on the vibe."
  3.  **The "Values Call" Black Hole:** When the procedure flags a Logic Error (two passed norms clash), you have to send it to Council. Council may ignore the logic and vote on "vibes" anyway.
      *   *Audit Defense:* Your minutes must state: "Committee flagged logical inconsistency. Council overrode on [Date]." That protects *you*.
  4.  **Strategic Voting:** Members might vote No on a Fact (P1) because they hate the Conclusion (P3), even if they know the Fact is true.
      *   *Mitigation:* Remind them: "Vote on the truth of the statement, not the consequence." (They will ignore this, but you must say it).

  ---

  ### Part 4: Running the Procedure on Your Three Cases

  Here is the output based on the Protocol above.

  #### Case 1: The Screening Programme
  **Propositions:**
  *   P1 (Fact): "The test's false positive rate is acceptable." (Threshold: 50%)
  *   P2 (Conditional): "If the false positive rate is acceptable, the college should endorse routine screening." (Threshold: 50%)
  *   P3 (Conclusion): "The college should endorse routine screening." (Threshold: 50%)

  **The Votes:**
  *   **P1:** 7 Yes, 4 No. **Result: PASS.**
  *   **P2:** 8 Yes (4 from Group A + 4 from Group C), 3 No. **Result: PASS.**
  *   **P3:** 4 Yes, 7 No. **Result: FAIL.**

  **Procedure Output:**
  *   **Logic Check:** P1 is True. P2 says "If P1 then P3." Therefore, P3 is logically True.
  *   **Final Status:** **ADOPTED BY DERIVATION.**
  *   **Audit Note:** "Direct vote on P3 failed (4-7). However, P1 and P2 passed. Per Protocol, P3 is adopted as the logical consequence of accepted premises."
  *   **Risk:** The 3 members who voted Yes/No/No will be angry. They accepted the fact but rejected the obligation. However, the majority of the *committee* accepted the obligation conditionally. This is the only way to avoid the "no one voted for the whole package" error.

  #### Case 2: The Staffing Crisis (The One They'll Hate)
  **Propositions:**
  *   P1 (Norm): "Workforce planning is within the college's remit." (Threshold: 50%)
  *   P2 (Fact): "The data on staffing levels are solid enough to make a public claim." (Threshold: 50%)
  *   P3 (Constraint): "2021 Standing Order: College does not comment on workforce issues." (Threshold: 66% to Override)
  *   P4 (Conclusion): "The college will issue a public statement on staffing."

  **The Votes:**
  *   **P1:** 6 Yes, 7 No. **Result: FAIL.** (Fails by 1 vote).
  *   **P2:** 6 Yes, 7 No. **Result: FAIL.** (Fails by 1 vote).
  *   **P3:** Not voted (Standing Order active).
  *   **P4:** 9 Yes, 4 No. **Result: PASS.**

  **Procedure Output:**
  *   **Logic Check:** To pass P4, you need P1 (Remit) AND P2 (Evidence) AND (Override P3 OR Fit within P3).
  *   **Final Status:** **REJECTED.**
  *   **Audit Note:** "Although P4 passed direct vote, necessary premises P1 and P2 failed. Statement cannot be issued."
  *   **The Fight:** The Chair will say "9 out of 13 want to speak, let's just speak."
  *   **Your Move:** "If we publish without P1 and P2, we are vulnerable to a complaint that we acted outside our remit and on bad data. The Protocol flags this as unsupported. We must either vote to Rescind the 2021 Standing Order (needs 2/3) or accept the premises failed."
  *   **Values Call:** If they insist on publishing, mark it as "Council Directive overriding Committee Logic."

  #### Case 3: The Clash (Off-Label vs. Judgement)
  **Propositions:**
  *   P1 (Norm): "Clinicians should not prescribe X off-label."
  *   P2 (Norm): "Clinicians should exercise their own judgement where the evidence is thin."

  **The Votes:**
  *   **P1:** Pass.
  *   **P2:** Pass.

  **Procedure Output:**
  *   **Logic Check:** **FLAGGED INCONSISTENCY.**
  *   **Reasoning:** Prescribing off-label is a subset of "exercising judgement where evidence is thin." P1 says "No X." P2 says "Use Judgement (which implies Yes X)."
  *   **Final Status:** **NO PUBLICATION.**
  *   **Audit Note:** "Passed propositions P1 and P2 are mutually incompatible in scenarios involving Drug X. Logic Map returns Error."
  *   **Values Call:** This requires a human to decide priority. Does "Safety (No X)" trump "Autonomy (Judgement)"? The spreadsheet cannot solve this. You must send this to Council with the note: "Committee accepts both principles but has not established priority. Risk of disciplinary confusion is high."

  ### Summary of What This Buys You

  1.  **Audit Trail:** A year later, if someone complains, you pull the sheet. You show that P3 was not a whim; it was the mathematical output of P1 and P2.
  2.  **Protection:** When the Chair wants to publish Case 2, you point to the "FAIL" on the premises. You are not blocking them; the *math* is blocking them.
  3.  **Honesty:** In Case 3, you admit the hole. It is better to publish "We could not agree on priority" than to publish two rules that get a clinician struck off.

  **One final warning:** This procedure removes the ability to "fudge" a consensus. It will make meetings more tense because you can no longer paper over cracks with vague language. That is the price of avoiding disciplinary hearings.
