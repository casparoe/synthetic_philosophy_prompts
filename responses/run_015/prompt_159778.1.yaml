answer: |-
  **Order and dependencies**
  Start with the closure principle on knowledge sets, not modal semantics. Since students lack modal logic, introducing possible worlds now burdens working memory with syntax/semantics rather than the epistemic puzzle. Establish that if Knowledge ($K$) is closed under entailment, and agents know axioms, they know all theorems. This makes the problem statable without modal operators. Introduce possible-worlds semantics only *after* the problem is clear, to show how standard models (S5) encode this closure via accessibility relations. Place the Width/Depth distinction immediately after stating the problem. Width (infinite tautologies) shows the volume issue; Depth (long proofs) shows the complexity issue. This taxonomy helps students categorize counterexamples before moving to solutions. Dependencies: Closure Principle $\to$ Omniscience Result $\to$ Width/Depth Taxonomy $\to$ Modal Semantics (as formalization of the commitment). This ensures the intuition drives the formalism, not vice versa. The Width/Depth split earns its keep here because it prevents students from thinking one fix (e.g., time limits) solves both. Depth suggests resource limits; Width suggests conceptual limits. You need this distinction before discussing solutions to show why simple boundedness accounts fail. Without this order, students conflate the formal model with the philosophical problem. By deriving omniscience from closure first, you show the problem is intrinsic to the concept of knowledge, not an artifact of Kripke frames. Semantics then diagnoses where formalism diverges from intuition.

  **The carrying example**
  The agent possesses ciphertext $C$ and key $K$. The plaintext $P$ is the logical output of $Decrypt(C, K)$. The example must avoid implying $P$ is contradictory or that the agent believes $\neg P$. It must strictly show *possession of premises* without *performance of inference*. Avoid "impossible worlds" talk; keep it cognitive. The example needs to highlight that the information is *there* but not *accessed*. It avoids psychological realism issues (like fatigue) by focusing on the logical gap: the decryption function is computable but uncomputed. This isolates logical omniscience from mere memory failure. The agent isn't forgetting; she hasn't executed the function. This keeps the focus on the normative closure principle rather than descriptive psychology. Crucially, avoid making $P$ trivial. If $P$ is obvious, the example fails. If $P$ is contradictory, you invite confusion about consistency versus omniscience. The example must rest solely on the gap between having the inputs and performing the operation. Do not let students suggest the agent is irrational; she is perfectly rational but non-omniscient. The example must survive the charge that she *should* have decrypted. It works because decryption is an action, not a state.

  **Misconceptions**
  First: "This is just bounded rationality." Head this off immediately after stating closure. Clarify that logical omniscience is a normative problem about what knowledge *is*, not a descriptive claim about human CPU limits. Even ideal agents face this if knowledge is closed. Second: "Switching to credence fixes it." Raise this when discussing Width. Show that probabilistic coherence also requires assigning 1 to tautologies, reproducing the Width problem. Bayesian agents are also logically omniscient. Students often think credence allows for uncertainty about logic. Remind them that standard Bayesianism forbids assigning probability <1 to logical truths. This misconception arises because they confuse psychological confidence with normative credence. Addressing this early prevents them from thinking the problem is exclusive to binary belief. Third: "Awareness semantics solves it." Save for the end. Explain that restricting knowledge to "aware consequences" doesn't solve the normativity; it just changes the subject from knowledge to "aware knowledge." It relocates the problem to defining awareness without reintroducing closure. If awareness isn't closed, is it knowledge? If it is, we're back to square one. This sequence prevents students from dismissing the puzzle as empirical or thinking a simple semantic tweak dissolves the normative tension. You must emphasize that awareness structures often just push the omniscience requirement up a level (omniscient about what you are aware of).

  **The check**
  "Identify a specific logical consequence the agent intuitively knows, which a non-omniscient model must deny she knows to avoid the problem." This forces them to find the boundary. It tests if they understand that solving the problem requires sacrificing a closure intuition, not just adding a clause. If they say "she knows the axioms," press them on whether she knows their conjunction. The answer must reveal a trade-off. If they cannot name a lost knowledge claim, they haven't grasped the cost of avoiding omniscience.

  **What I'm skipping and saying so**
  Explicitly refuse to cover dynamic epistemic logic (learning events) or impossible worlds semantics. State clearly: "We are not solving this today; we are diagnosing it." Also skip the technical definition of Kripke frames until next week. This manages expectations and keeps focus on the conceptual puzzle. Tell them: "I will not explain how to fix the formalism today, only why it breaks." This prevents them from looking for a solution instead of understanding the tension. We are isolating the virus, not prescribing the medicine.
