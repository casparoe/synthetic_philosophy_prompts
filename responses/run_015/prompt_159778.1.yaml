prompt: |-
  Hi — I've got a 75-minute slot in a third-year epistemology seminar next week and I need to get the problem of logical omniscience across to students who've had first-order logic, can read a truth table, and have never seen a modal operator. Plan how I should teach it, not the explanation itself.

  What I want: the order the pieces have to come in and why, i.e. what depends on what. Can I make the trouble appear from closure principles alone, or does possible-worlds semantics have to be on the board before the problem is even statable? And I want one example to carry the whole session — my candidate is an agent who holds both an encrypted message and the key but hasn't run the decryption, so she knows, in whatever sense the formalism cares about, something she plainly doesn't know. Tell me what such an example has to have, and more usefully what it has to avoid: I suspect anything involving contradiction or impossible worlds is poison this early.

  I'd also like you to work with a distinction I've been using in my own notes and am not sure is standard: width failures (infinitely many consequences, tautologies nobody has ever considered) versus depth failures (a single consequence reachable only by a proof too long for anyone to survey). Does that split earn it's keep pedagogically, and if so where does it sit in the sequence?

  Then the misconceptions in the order they'll actually form, each with the point in the session where I should head it off: that this is just bounded rationality in fancy dress, that moving from belief to credence dissolves it, that awareness-style fixes solve it rather than relocate it. Plus one closing question that would show me they've got the problem and not just a slogan, and what I should openly refuse to explain at this level.

  Sections, please: Order and dependencies (~250 words), The carrying example (~150), Misconceptions (~250), The check (~75), What I'm skipping and saying so (~75).
