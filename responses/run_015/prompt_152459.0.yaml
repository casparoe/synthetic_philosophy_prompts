prompt: |-
  I'm on the volunteer grant board for our towns community center. Next tuesday we vote on funding a workshop called Cleaning Your Moral Lens — run by locals who want to teach people how to tell the difference between just not liking something and being unfair about it. They have people rate gut reactions to practices, then show cross-culture data, and if your reaction stays strong even after you learn people you admire do it too, they call it bias; if it softens, they call it preference. They call that second part the preference-inversion test. Some board members love it, others say its rigged because 'people you admire' is just your own moral circle, so the workshop smuggles in one view and calls it science. I need a memo for the meeting recommending approve, reject, or approve with conditions, with reasons folks can actually reply to, and I want the strongest point for the losing side included honestly. I dont have any formal background in this, just been chewing on it myself, and please seperate whats pretty settled from whats genuinely fought over by people who know the topic — dont present a contested take like its the only view. Also no lists of books or citations I cant verify.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Volunteer grant board member for a town community center.
      *   **Task:** Write a memo for next Tuesday's meeting recommending a decision (Approve, Reject, or Approve with Conditions) on funding a workshop called "Cleaning Your Moral Lens."
      *   **Workshop Content:** Teaches distinguishing "unfairness" (bias) from "not liking something" (preference). Uses a method where participants rate gut reactions, see cross-culture data (specifically if people they admire do it), and re-rate. Strong reaction = bias; softened reaction = preference. This second part is called the "preference-inversion test."
      *   **Conflict:** Some board members love it; others say it's rigged because "people you admire" is subjective (moral circle), smuggling in a specific worldview as science.
      *   **Requirements:**
          *   Recommendation (Approve, Reject, or Conditions).
          *   Reasons folks can reply to (argumentative, not just declarative).
          *   Include the strongest point for the losing side honestly.
          *   Distinguish between settled facts and contested theories (epistemic humility).
          *   No unverifiable book lists or citations.
          *   Tone: Accessible (user has no formal background), practical, balanced.

  2.  **Evaluate the Workshop Concept:**
      *   *Core Idea:* Distinguishing bias from preference is a valid and useful goal for a community center.
      *   *Methodology:* The "gut reaction -> social proof -> re-rate" method is psychologically grounded (social conformity, authority bias) but the specific labeling ("bias" vs. "preference") is philosophically and scientifically contentious.
      *   *The "People You Admire" Critique:* This is the crux. If I admire a religious leader who forbids X, and I stop disliking X because they do it, is that a "preference"? Or did I just submit to authority? Conversely, if I admire a progressive icon who does Y, and I stop disliking Y, is that moral growth or conformity? The workshop seems to equate "malleability via admiration" with "mere preference," which is a philosophical claim, not a hard scientific fact.
      *   *Community Center Context:* The goal is inclusivity, education, and community cohesion. A workshop that claims scientific neutrality but relies on subjective moral circles could cause division if participants feel manipulated.

  3.  **Determine the Recommendation:**
      *   *Approve:* Too risky given the valid criticism about the methodology smuggling in values.
      *   *Reject:* Too harsh. The intent is good, and the core distinction (bias vs. preference) is valuable.
      *   *Approve with Conditions:* This is the sweet spot. It allows the workshop to happen but mitigates the risk of it being perceived as dogmatic or pseudoscientific. It addresses the board's concerns without shutting down dialogue.

  4.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose and the recommendation clearly.
      *   **Background:** Briefly summarize the workshop and the debate (as provided in the prompt).
      *   **Analysis (Settled vs. Contested):**
          *   *Settled:* Implicit bias exists. Social influence affects judgment. Distinguishing bias from preference is hard but worth trying.
          *   *Contested:* Whether changing a mind based on "admired others" actually proves something is just a preference. The definition of "bias" vs. "preference" isn't universally agreed upon in this specific operational way.
      *   **The Strongest Counter-Argument:** I need to champion the critics' view honestly. The "Moral Circle" argument is strong. If the workshop defines "bias" as "what stays strong despite admired people doing it," it assumes admired people are morally neutral or correct. That's a big assumption.
      *   **Recommendation & Conditions:**
          *   Condition 1: Reframe the "test" as an exercise, not a diagnostic tool.
          *   Condition 2: Ensure diverse "admired figures" are used in the data (not just one cultural slice).
          *   Condition 3: Add a debrief/discussion section where participants critique the method itself.
      *   **Closing:** Invite discussion.

  5.  **Refining the Content (Self-Correction during drafting):**
      *   *Check:* Did I use citations? *No.*
      *   *Check:* Did I distinguish settled vs. contested? *Yes, need to make sure this is explicit.*
      *   *Check:* Is the tone right? *Needs to be respectful but firm on the epistemic limits.*
      *   *Check:* Is the strongest opposing point included? *Yes, the "smuggling values" argument.*
      *   *Check:* Is the recommendation actionable? *Yes, conditions are specific.*

      *Critique of the "Preference-Inversion Test":* I need to be careful not to validate the test as real science. It sounds like a made-up term for this workshop (not a standard psychological term like "Implicit Association Test"). I should treat it as a proprietary method that needs scrutiny. *Correction:* I will treat it as the organizers' specific framework, not established psychology.

      *Tone Check:* The user said "no lists of books or citations I can't verify." I will avoid naming specific psychologists or theories (like Haidt or Kahneman) unless they are common knowledge, to stay safe. Better to speak generally about "psychological research."

  6.  **Final Polish:**
      *   Ensure the distinction between "bias" (unfair prejudice) and "preference" (personal taste) is clear.
      *   Make sure the conditions protect the community center from hosting something that might be seen as indoctrination.
      *   Ensure the "Strongest Point for the Opposition" stands out.

  7.  **Final Review against constraints:**
      *   Memo format? Yes.
      *   Recommendation clear? Yes (Approve with Conditions).
      *   Reasons reply-able? Yes (focused on methodology and framing).
      *   Strongest losing point included? Yes (the moral circle/rigging argument).
      *   Settled vs. Contested separated? Yes.
      *   No unverifiable citations? Yes.

      *(Self-Correction on "Settled" Science)*: I must be careful not to say "Implicit bias is settled." While the existence of unconscious association is settled, the link to behavior is contested. I will phrase it as "It is well-documented that unconscious associations exist" rather than making broad claims about their impact. Actually, safer to say "Psychologists agree humans have unconscious associations that affect judgment."

      *(Refining the "Admired People" critique)*: The prompt says "people you admire do it too." The critique is that my admiration is already morally loaded. If I admire a bigot, and I tolerate bigotry because they do it, the workshop calls that a "preference." That's dangerous. I need to highlight this.

