  If I argue it collapses into blind mechanism, I am arguing *for* a form of determinism (or at least mechanism) over agency. I need to be careful not to advocate for *hard* determinism, but rather argue that the *label* of agency is the problem, not the existence of causal power. The prompt asks if the *metaphor* collapses. Okay, I will argue the metaphor collapses.

  Let's write.

