answer: |-
  The "non-human turn" in historiography has sought to democratize the past, elevating germs, volcanoes, and climate shifts from backdrop scenery to center-stage protagonists. Proponents argue that granting these forces agency rescues history from the arrogance of anthropocentrism, accounting for the contingencies and surprises that human intention alone cannot explain. However, this linguistic shift carries a dangerous payload. By conflating causal power with agency, we risk sliding into a soft environmental determinism that obscures the very human failures that dictate survival. To navigate this, we must distinguish between *interventionist causation*—where wiggling a cause shifts an effect—and *narrative protagonism*—where an entity drives the plot through responsive intent. When applied rigorously, this distinction reveals that the actor-metaphor for non-human forces does not enrich history; it collapses into blind mechanism, and in doing so, lets human societies off the hook for their responses.

  The core error lies in mistaking a force that *does* something for a force that *means* something. Interventionist causation is the domain of the laboratory and the engineer. It asks: if I intervene on variable X, does variable Y change? In this sense, a pathogen is undeniably a cause. If you introduce a virus (X), mortality rises (Y). If you quarantine the infected (intervention on X), mortality falls. This is robust, manipulable causality. Narrative protagonism, however, belongs to the realm of story and policy. A protagonist navigates a plot, making adjustments based on feedback, possessing a teleology that can be reasoned with or targeted. Humans are narrative protagonists; we respond to sanctions, incentives, and moral appeals. Non-human forces are not. A volcano does not negotiate; it erupts. To call it an "actor" is to imbue a mechanistic process with a phantom interiority. It suggests a dialogue where there is only impact.

  Nowhere is this distinction more critical than in the edge case of a pathogen evolving traits to exploit medieval Silk Road trade networks. Viewed through the lens of narrative protagonism, this looks like strategic action. The germ appears to "recognize" the trade routes, "hitching a ride" on caravans to maximize its spread, acting as a cunning antagonist in the drama of the Black Death. This view explains the contingency of the pandemic's spread; it surprises the human-centered historian who expected borders to hold. However, this is a post-hoc story wrapped around mechanistic causation. The pathogen did not strategize; it mutated randomly. Those mutations that happened to survive in high-traffic nodes persisted; those that didn't, died. There was no intent to exploit the Silk Road, only the blind filter of natural selection acting upon random variation. To call this "agency" is to project a plot onto a probability distribution. It is interventionist causation (the trade network facilitated transmission) misidentified as narrative protagonism (the germ utilized the network).

  The danger of maintaining this misidentification is not merely semantic; it is moral. If we grant germs and climates the status of historical actors, we implicitly grant them a share of the responsibility for historical outcomes. If the Bronze Age Collapse was caused by a "climate actor" or a "earthquake storm," then the political fragility of the Hittite Empire becomes secondary. This is environmental determinism in a fancy mask. It suggests that because the environment exerted causal pressure, the human response was predetermined or irrelevant. But history shows that societies facing identical environmental shocks fare differently based on governance, infrastructure, and equity. The Black Death devastated Europe, but the severity of the social fallout depended on labor laws, sanitation, and civic trust. By labeling the plague an "actor," we risk treating the human response as a reaction to a peer, rather than a management of a hazard. It lets societies off the hook. If the climate is a protagonist, then the king who failed to store grain is merely a co-star who missed his cue, rather than a leader who neglected his duty.

  Defenders of non-human agency argue that without this metaphor, we cannot account for the ways nature "pushes back" against human plans. They claim that recognizing the agency of a virus explains why empires fall despite their best intentions. But we can acknowledge the crushing weight of contingency without animating the inanimate. We can say that human agency operates within a field of *constraints and affordances* provided by the environment. The Silk Road afforded the spread of disease; the climate constrained agricultural yield. These are interventionist causes that limit the scope of human narrative protagonism, but they do not replace it. To say a river has agency is to confuse the flood with the failure of the levee.

  Ultimately, the actor-metaphor collapses because it cannot sustain the burden of accountability that true agency requires. Agency implies the capacity to have done otherwise, or at least the capacity to respond to intervention. You cannot sanction a virus. You cannot reason with a tectonic plate. You can only intervene upon the conditions of their impact. Therefore, we must reject the notion that germs, climates, and volcanoes are historical actors. They are the stage, the props, and occasionally the wrecking balls, but they are not the cast. To treat the Silk Road pathogen as a strategist is to indulge in a poetic fiction that obscures the mechanistic reality of evolution. More importantly, it dilutes the responsibility of the humans who built the roads, ignored the sanitation, and failed the sick. History must remain the study of how human protagonists navigate a non-human world, not a fantasy where the world navigates itself. We must keep the causation, but drop the character.
