prompt: |-
  For most of my working life I was a field biologist — nearly forty years of seabird censuses on sub-Arctic cliffs, which is to say a career in which the difference between a landmark dataset and a wasted season was very largely a matter of weather. Since retiring I have been reading philosophy seriously for the first time, and the topic that has lodged itself in my head is the problem of moral luck: the pair of essays from the 1970s that gave it its name, the principle — that we are morally assessable only for what is within our control — that those essays set against our actual practices, and the uncomfortable fact that my own professional life was full of judgments about who counts as a good field scientist that quietly tracked outcomes nobody controlled.

  The reason this is not merely an armchair interest is that I now chair a small committee of my old learned society, and I have come to think that what we do four times a year is moral luck administered on a budget.

  The committee makes two kinds of decision about early-career field researchers. First, it awards a modest prize — money, a certificate, and a line on a CV that people in the field actually read — for the best piece of field work of the year. Second, it distributes recovery grants to graduate students whose field seasons collapsed, on the understanding that some collapses are bad luck and some are bad planning, and that the society should not simply reimburse carelessness. In a typical year we see fifteen to twenty-five cases, three or four per meeting, ninety minutes per meeting. The committee is me, two working scientists, and two lay members of council; none of them has read any philosophy and one of them is openly hostile to anything that sounds like an excuse. Every decision has to be justified in a single-page minute that goes to council and, in an edited form, to the candidate, who will read it and may appeal. The stakes per case are small in money and large in everything else: a prize line can start a career, and a minute that uses the word careless can end one.

  I would like a written procedure my committee could actually run on a case file, in order, with a stopping point at each question and an explicit statement of what counts as a sufficient answer.

  I am not asking for a summary of the debate or for references; I have the essays and a good library. I am asking for the translation, and I want it to be honest about what gets lost. Specifically:

  One, I want the procedure to keep the distinction between assessing a decision as it could have been assessed before the outcome was known, and assessing the outcome, and I want it to force us to write down both verdicts separately, and to say in one sentence which of the two the money is following when they disagree. My instinct is that a prize must follow the outcome somewhere, since a prize for a well-designed protocol that produced nothing is not a prize anyone wants — but I want that concession made explicitly rather than smuggled in, and I want to know how much of the literature's bite is lost when it is made.

  Two, I want a question that replaces the counterfactual we currently ask (what would have happened if) with something more disciplined: ask instead for the range of outcomes within which the committee's verdict would have been the same, and treat the width of that range as the finding. Where the range is very narrow, the committee is being run by outcomes and should have to say so in the minute.

  Three, I want a rule governing when outcome information may be used as evidence of the quality of a decision that was not directly observable — since in field work we usually see only the result and a write-up — and when it may not; and I want the rule to distinguish that diagnostic use from the quite different use of a bad outcome as a reason to express condemnation. I suspect much of what looks like moral luck in our deliberations is really sloppy epistemology, and I want the procedure to separate the part that is bad inference from the part that is genuinely a moral problem.

  Four, I want the procedure to say what a not-at-fault verdict still requires of a person when something bad happened that they caused. In the literature this is the region of agent-regret, and in practice it is the part my committee handles worst: we either say nothing at all or we quietly punish. I would like a prescribed non-punitive response — who writes the account of what went wrong, who tells the local community or the landowner, who does the repair work — kept visibly distinct from sanction.

  Five, I want a rule for sequences. A single unlucky season is one thing; a candidate with three failed seasons, each of which was defensible on its own reconstruction, is another, and I do not trust myself to tell when a run of bad outcomes has become evidence rather than bad luck.

  And six, I want a stop rule: some of our cases are really judgments about what sort of person the candidate is — steady, or reckless, or the kind of person who attracts disasters — and I want the procedure to stop and say so when it has arrived there, rather than dressing a judgment about character up as a judgment about a decision.

  Please run the procedure on three cases.

  The first: two doctoral students, same supervisor, same site, both chose to run their census in the short early-season window rather than the safer but less informative later one. One got an extraordinary calm fortnight and produced the dataset of her career. The other lost three weeks to storms and an equipment cache destroyed by a rockfall, and has nothing. Identical decision, opposite outcomes. Who gets the prize, who gets the recovery grant, and does it matter that one of our two instruments is compensatory and the other is honorific?

  The second: a student who ran a season without the animal-handling certification the society requires and without the landowner's written access permission, and who had an injury-free, productive, publishable season; and, in the same round, a student who complied with everything and whose field assistant broke a wrist when a nesting ledge gave way. My committee's unreflective view is that the first deserves a sanction and the second deserves sympathy. I want to know whether the procedure can keep both of those reactions, and if it cannot, which one it gives up.

  The third: a candidate whose decision, on our own reconstruction, was the best available — genuinely the best, not merely defensible — and whose work nevertheless caused disturbance at a protected colony and the abandonment of a number of nests. I expect the procedure to give me an answer here that I will not like, and I would rather have it than have the committee muddle through: tell me what it is, defend it, and say plainly what it costs the candidate and what it costs us.

  Finally, tell me what the procedure cannot do. I take it that it cannot settle whether blame is ever justified, that it will fail whenever the contemporaneous record of a decision does not exist — which, in field work, is most of the time — and that there is a class of cases, the ones about what a person is made of, where it will not be able to help us at all. I would like those limits stated in the document itself, in language a retired judge and a fund manager will accept, so that the procedure is not asked to do work that only a philosopher could do and that a philosopher perhaps could not do either.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the Request:**

      *   **User Persona:** Retired field biologist (40 years experience), now chair of a learned society committee. Reads philosophy seriously (specifically moral luck, Nagel/Williams).
      *   **Task:** Create a written procedure for the committee to evaluate early-career field researcher cases (prizes and recovery grants).
      *   **Constraints/Requirements:**
          1.  Distinguish between *ex-ante* decision quality and *ex-post* outcome. Force separate verdicts. State explicitly which drives the money if they diverge. Acknowledge the cost to the philosophical principle.
          2.  Replace "what would have happened" with a "stability range" question (how much outcome variation would change the verdict?). Narrow range = outcome dependency.
          3.  Rule for using outcomes as *evidence* of decision quality vs. outcomes as *grounds for condemnation*. Distinguish epistemology from morality.
          4.  Rule for "not-at-fault" but harmful outcomes (agent-regret). Prescribe non-punitive restorative actions distinct from sanction.
          5.  Rule for sequences (repeated failures). When does bad luck become evidence of something else?
          6.  Stop Rule: When the judgment shifts from decision/outcome to *character*. Admit this explicitly.
          7.  **Application:** Run the procedure on three specific cases provided.
          8.  **Limitations:** Explicitly state what the procedure *cannot* do (settle blame justification, handle missing records, resolve character judgments). Language must be accessible to a retired judge and a fund manager (practical, clear, not jargon-heavy).
      *   **Tone:** Serious, precise, honest about trade-offs, practical but philosophically informed. No summaries of debates, just the "translation."

  2.  **Deconstruct the Philosophical Core:**

      *   *Moral Luck (Nagel/Williams):* We judge people based on things outside their control (outcomes), violating the Control Principle (only judge what is controlled).
      *   *The Tension:* The user knows the principle is sound but practice demands outcome sensitivity (a prize for nothing is useless).
      *   *The Goal:* Institutionalize the tension rather than hide it. Make the committee aware of *when* they are violating the Control Principle and *why*.

  3.  **Drafting the Procedure (Section by Section):**

      *   *Introduction:* Needs to set the stage. Acknowledge the tension between fairness (control) and utility (outcomes).
      *   *Step 1: The Ex-Ante/Ex-Post Split.* (Requirement 1). Need a form or log where they record "Decision Quality" (DQ) and "Outcome Quality" (OQ) separately. Then a "Funding Driver" checkbox.
      *   *Step 2: The Stability Range.* (Requirement 2). Instead of counterfactuals, ask: "How much worse could the outcome have been before we denied the grant/prize?" This measures luck sensitivity.
      *   *Step 3: Evidentiary Use of Outcomes.* (Requirement 3). When is a bad result proof of bad planning? Only if the result was highly probable given the plan. Distinguish *inference* from *punishment*.
      *   *Step 4: Agent-Regret/Restoration.* (Requirement 4). If no fault but harm occurred, what is the duty? Repair, report, document. No sanction.
      *   *Step 5: Sequences.* (Requirement 5). Bayesian update. One failure = noise. Three failures = signal. Define the threshold.
      *   *Step 6: The Character Stop.* (Requirement 6). If the discussion turns to "who they are" rather than "what they did," stop. Label it a character judgment.
      *   *Limitations Clause.* (Final Requirement). Be honest about missing data and the limits of procedural justice.

  4.  **Refining the Language:**

      *   Avoid terms like "deontological," "consequentialist," "epistemic opacity."
      *   Use terms like "Controllable Factors," "Result Factors," "Evidence vs. Penalty," "Restorative Duty."
      *   Ensure it sounds like a committee manual, not a philosophy paper.

  5.  **Applying the Procedure to the Cases:**

      *   *Case 1 (Twins/Different Luck):*
          *   DQ: Equal. OQ: Divergent.
          *   Prize: Must follow OQ (honest admission).
          *   Grant: Must follow DQ (honest admission).
          *   Stability: High sensitivity for prize, low for grant.
      *   *Case 2 (Rules vs. Injury):*
          *   Student A (No permit, good result): DQ Low (violation), OQ High.
          *   Student B (Permit, injury): DQ High, OQ Low (injury).
          *   Sanction vs. Sympathy: The procedure should flag Student A's violation as a *decision* flaw, not outcome dependent. Student B's injury is outcome luck.
          *   Conflict: The committee wants to sanction A (correct) and sympathize with B (correct). The procedure should validate this *if* the sanction is on the decision, not the outcome.
      *   *Case 3 (Best Decision, Bad Result):*
          *   DQ: High. OQ: Negative (nest abandonment).
          *   Agent-Regret: Restoration required.
          *   Cost: Candidate pays labor/time. Society pays reputation/trust.
          *   Hard truth: No grant, maybe no prize, but no sanction.

  6.  **Addressing the Limitations:**

      *   Must explicitly state: We can't judge blame ultimately. We can't fix missing logs. We can't solve the "character" problem without admitting it's character judgment.

  7.  **Review against Constraints:**

      *   *Did I summarize the debate?* No.
      *   *Is there a stopping point at each question?* Yes, structured as a workflow.
      *   *Is the language suitable for a judge/fund manager?* Needs to be crisp, administrative.
      *   *Did I answer the specific "what gets lost" prompt?* Yes, in the intro and case analysis.
      *   *Did I handle the "Agent-Regret" specific requirement?* Yes, Step 4.

  8.  **Self-Correction/Polishing during drafting:**

      *   *Critique:* The "Stability Range" concept might be too abstract for a fund manager.
      *   *Fix:* Frame it as a "Sensitivity Test." "If the storm had been 10% worse, would we still fund?"
      *   *Critique:* Case 2 is tricky. The user says the committee's unreflective view is sanction A, sympathy B. Does the procedure support this?
      *   *Analysis:* Yes, because A's failure is *controllable* (paperwork), B's is *uncontrollable* (ledge collapse). The procedure separates these.
      *   *Critique:* Case 3 needs to be hard. The user expects an answer they won't like.
      *   *Analysis:* The answer is that the candidate bears the cost of restoration without funding, and the society accepts the risk of its own standards. That's the "cost."
      *   *Tone Check:* Ensure I don't sound patronizing. The user is intellectually sophisticated. Match that level of rigor.

  9.  **Final Polish:** Check the "Limitations" section. Ensure it explicitly mentions the missing record problem (field work reality) and the character judgment problem.

  **(Self-Correction Note on Case 1):** The prompt asks "Who gets the prize, who gets the recovery grant?" I need to be decisive based on the procedure I wrote.
  *   Prize: Student 1 (Outcome driver).
  *   Grant: Student 2 (Decision driver).
  *   Why: Because the procedure forces an explicit choice.

  **(Self-Correction Note on Case 3):** "Tell me what it is, defend it, and say plainly what it costs."
  *   Verdict: No sanction, but no grant. Restorative duty applies.
  *   Cost: Candidate loses time/money. Society loses moral cleanliness (admits its best practices still kill birds).

  10. **Final Output Generation** (incorporating the above thoughts into the structured response).
answer: |-
  # COMMITTEE PROCEDURE: EVALUATION OF FIELD RESEARCH CASES
  **Version 1.0 | Society for Sub-Arctic Field Biology**

  ## PREAMBLE: THE TRADE-OFF
  This procedure acknowledges a conflict between two valid standards.
  1.  **The Control Standard:** Researchers should only be judged on decisions within their power (planning, ethics, diligence).
  2.  **The Utility Standard:** The Society's awards must reflect actual scientific contribution, which depends on weather, geology, and chance.

  This document does not resolve this conflict. It forces the Committee to identify which standard is driving each financial decision and to record the cost of that choice.

  ---

  ## STEP 1: THE SPLIT VERDICT (Decision vs. Outcome)
  **Action:** For every case, the Committee must complete two separate assessments before discussing money.

  *   **Assessment A (Ex-Ante Decision Quality):** Based *only* on information available to the researcher at the start of the season. Was the plan sound? Were risks mitigated? Were protocols followed?
      *   *Verdict:* **Sound / Flawed / Negligent.**
  *   **Assessment B (Ex-Post Outcome Quality):** Based on the actual result. Was data collected? Was there injury? Was there environmental harm?
      *   *Verdict:* **Successful / Compromised / Failed.**

  **Stopping Point:** If Assessment A and Assessment B disagree (e.g., Sound Decision / Failed Outcome), the Committee must proceed to Step 1-C.

  *   **Step 1-C (The Funding Driver):** The Committee must check one box to justify the financial recommendation:
      *   [ ] **Rewarding Decision:** Money follows Assessment A. (We fund the *process*.)
      *   [ ] **Rewarding Outcome:** Money follows Assessment B. (We fund the *result*.)
      *   [ ] **Hybrid:** Money follows A, but public citation follows B.

  **Requirement for Minutes:** If "Rewarding Outcome" is selected despite a "Sound Decision" verdict, the minute must state: *"Award granted despite lack of control over outcome. This prioritizes scientific utility over the Control Standard."*

  ---

  ## STEP 2: THE SENSITIVITY TEST (Replacing Counterfactuals)
  **Action:** Do not ask "What would have happened?" Ask: "How much worse could the outcome have been before our verdict changed?"

  *   **The Question:** "If the storm had been 10% stronger, or the equipment failure slightly more severe, would we still grant this prize/recovery?"
  *   **The Finding:** Record the **Stability Range**.
      *   *Wide Range:* Verdict holds across many outcome variations. (Low Moral Luck).
      *   *Narrow Range:* Verdict flips with minor outcome changes. (High Moral Luck).

  **Requirement for Minutes:** If the Stability Range is narrow, the minute must state: *"This decision is highly sensitive to outcome luck. A minor change in weather would have reversed the funding decision."*

  ---

  ## STEP 3: OUTCOMES AS EVIDENCE (Epistemology vs. Condemnation)
  **Action:** When a bad outcome occurs, determine if it is being used to *infer* bad planning or to *punish* the result.

  *   **Rule:** A bad outcome is admissible as evidence of a bad decision **only if** the outcome was a high-probability consequence of the decision.
      *   *Example:* No backup generator + high storm risk = Bad Decision (Evidence valid).
      *   *Example:* Backup generator + rare meteorite strike = Bad Luck (Evidence invalid).
  *   **Prohibition:** A bad outcome cannot be used as the sole justification for a sanction (condemnation) if the Decision Quality (Step 1) was Sound.

  **Requirement for Minutes:** If a sanction is applied, the minute must cite the specific *decision* flaw, not the *outcome*. "Sanctioned for failure to secure permit," NOT "Sanctioned for injury."

  ---

  ## STEP 4: AGENT-REGRET (Restoration without Sanction)
  **Action:** If Assessment A is **Sound** but Assessment B involves harm (e.g., nest abandonment, property damage), the verdict is **Not-At-Fault**. However, "Not-At-Fault" does not mean "No Duty."

  *   **Prescribed Response:** The Committee must assign **Restorative Duties** distinct from punishment.
      1.  **Documentation:** Researcher must file a detailed technical account of the failure for the Society archives (to prevent recurrence).
      2.  **Notification:** Researcher (supported by Society) must inform affected parties (landowners, local community).
      3.  **Repair:** Researcher must contribute labor or time to mitigation (e.g., habitat repair), even if the cause was luck.

  **Requirement for Minutes:** "No sanction applied. Restorative duties assigned per Step 4. This acknowledges causal involvement without moral blame."

  ---

  ## STEP 5: SEQUENCES (The Bayesian Threshold)
  **Action:** When evaluating a researcher with multiple failed seasons.

  *   **Rule of Three:**
      *   *Failure 1:* Presumed Bad Luck (unless Decision Quality was Flawed).
      *   *Failure 2:* Presumed Bad Luck (requires review of Decision Quality).
      *   *Failure 3:* Presumed Evidence of Systemic Issue.
  *   **The Shift:** Upon the third defensible failure, the Committee may treat the *pattern* as a decision flaw (failure to adapt methodology), even if individual decisions were sound.

  **Requirement for Minutes:** "Third failure recorded. Verdict shifts from 'Unlucky' to 'Methodologically Unsuitable' based on sequence, not single event."

  ---

  ## STEP 6: THE CHARACTER STOP
  **Action:** Monitor the language of the deliberation.

  *   **Trigger:** If Committee members use terms describing inherent traits ("reckless," "steady," "careless," "jinxed") rather than specific actions ("failed to check weather," "secured rope").
  *   **The Stop:** The Chair must halt the discussion.
  *   **The Ruling:** "We are now judging character, not field decisions. This Committee is not empowered to judge character."
  *   **The Output:** The case is closed with a "No Decision" status, or referred to a mentorship body if one exists. No money changes hands based on character judgments.

  ---

  ## LIMITATIONS OF THIS PROCEDURE
  **To be read into the record at the start of each session.**

  1.  **The Record Gap:** This procedure assumes a contemporaneous record of decisions exists. In field biology, it often does not. Where records are missing, the Committee must default to **Assessment A (Decision Quality) = Sound**. We cannot punish for undocumented planning.
  2.  **The Blame Limit:** This procedure does not settle whether blame is ever metaphysically justified. It only standardizes how we administer it.
  3.  **The Character Limit:** This procedure cannot distinguish between a person who attracts disasters and a person who is unlucky. When the two become indistinguishable, Step 6 applies. We do not fund or punish "who someone is."

  ***

  # APPLICATION TO CASES

  ## CASE 1: The Twin Protocols
  **Scenario:** Two students, identical risk profile (early season). Student A: Calm weather, great data. Student B: Storms, rockfall, no data.

  **Procedure Run:**
  *   **Step 1 (Split Verdict):**
      *   Student A: Decision = Sound; Outcome = Success.
      *   Student B: Decision = Sound; Outcome = Failure.
  *   **Step 1-C (Funding Driver):**
      *   **Prize:** Must check **Rewarding Outcome**. A prize for "best field work" implies data exists.
      *   **Grant:** Must check **Rewarding Decision**. A recovery grant exists to insure against luck, not incompetence.
  *   **Step 2 (Sensitivity):**
      *   Prize Stability: Narrow. (If A had one week less calm, no prize). Minute must note high luck dependency.
      *   Grant Stability: Wide. (If B had slightly less damage, still no data).
  *   **Step 5 (Sequence):** N/A (First season).

  **Verdict:**
  *   **Prize:** Awarded to Student A.
      *   *Minute Statement:* "Award follows Outcome. We acknowledge identical Decision Quality between candidates. This prioritizes scientific utility over the Control Standard."
  *   **Grant:** Awarded to Student B.
      *   *Minute Statement:* "Grant follows Decision. Outcome failure was outside control. This upholds the Control Standard."

  **Analysis:** The distinction between honorific (prize) and compensatory (grant) instruments allows us to satisfy both philosophical horns. We admit the prize is luck-sensitive. We protect the grant from luck. The "bite" lost is the claim that the prize winner is *morally* superior; she is only *scientifically* more productive.

  ## CASE 2: The Rule-Breaker vs. The Unlucky Compliant
  **Scenario:** Student C (No permit/cert, good data). Student D (Permit/cert, assistant injured by ledge collapse).

  **Procedure Run:**
  *   **Student C:**
      *   **Step 1:** Decision = **Negligent** (Violation of mandatory protocols). Outcome = Success.
      *   **Step 3 (Evidence):** The good outcome does not erase the decision flaw. The violation is observable independent of outcome.
      *   **Step 1-C:** Funding Driver = **Rewarding Decision**.
      *   **Verdict:** **Sanction.** (Ineligibility for prize/grant).
      *   *Minute:* "Sanction applied for procedural violation. Outcome success is irrelevant to compliance judgment."
  *   **Student D:**
      *   **Step 1:** Decision = **Sound**. Outcome = **Compromised** (Injury).
      *   **Step 3 (Evidence):** Injury was low-probability consequence of compliant work (ledge collapse). Outcome is not evidence of bad planning.
      *   **Step 4 (Agent-Regret):** Injury occurred. Restorative duties apply (reporting, safety review), but no sanction.
      *   **Verdict:** **Sympathy/Support.** (Eligible for recovery grant if costs incurred).
      *   *Minute:* "No sanction. Injury classified as outcome luck. Restorative duty: Safety review filing."

  **Analysis:** The procedure keeps both reactions. It validates sanctioning C because the *decision* was controllable (paperwork/certification), regardless of the lucky outcome. It validates sympathizing with D because the *decision* was controlled, despite the unlucky outcome. The committee's unreflective view is preserved, but the *reasoning* is cleaned of moral luck. We punish C for the *risk taken*, not the *result avoided*.

  ## CASE 3: The Best Decision, The Worst Result
  **Scenario:** Student E. Decision genuinely best available (per Committee reconstruction). Result: Protected colony disturbance, nest abandonment.

  **Procedure Run:**
  *   **Step 1:** Decision = **Sound**. Outcome = **Failed** (Harm).
  *   **Step 3:** Outcome is not evidence of bad decision (by premise).
  *   **Step 4 (Agent-Regret):** Harm occurred. Not-at-fault verdict.
      *   **Restorative Duties:**
          1.  Student E must write the technical account of disturbance mechanics.
          2.  Student E must participate in habitat monitoring/repair (unpaid).
          3.  Society must issue public statement acknowledging risk.
  *   **Step 1-C:** Funding Driver.
      *   **Grant:** **Denied.** (Cannot fund recovery from harm caused, even if accidental, without creating perverse incentives).
      *   **Prize:** **Denied.**

  **Verdict:** **No Sanction, No Funding, Restorative Duty.**

  **The Cost:**
  *   **To the Candidate:** She bears the financial loss of the season and the labor cost of repair. She is "clean" of blame but burdened by consequence. This is the definition of agent-regret institutionalized.
  *   **To the Society:** We must publicly admit that our "best available" science still kills birds. We lose moral cleanliness. We cannot claim the harm was "user error." We own the risk.

  **Defense:** If we sanction her, we punish luck. If we fund her, we socialize the cost of her accident. The only honest path is to acknowledge the tragedy without assigning blame. The procedure forces us to sit with the discomfort that doing the right thing can still break the world.

  ***

  # WHAT THIS PROCEDURE CANNOT DO

  **1. It cannot judge when records are missing.**
  Field work is often undocumented until the write-up. If a candidate claims "I checked the weather" but has no log, Step 1 requires us to default to **Sound Decision**. We cannot punish for invisible negligence. This will feel like letting people off the hook. It is the price of the Control Standard.

  **2. It cannot solve the "Character" problem.**
  There are researchers who are not negligent but seem to invite disaster. Step 6 forces us to stop judging this. We will have to fund the "jinxed" researcher if their decisions are sound, or reject them only when the Sequence Rule (Step 5) triggers. We cannot say "You are unlucky, go home." We can only say "Your third failure suggests a methodological mismatch."

  **3. It cannot justify blame.**
  This procedure administers blame; it does not justify it. It assumes the Society has the right to sanction. It does not answer the philosophical question of whether any of us deserve praise or blame given the ubiquity of luck. It is a tool for administration, not metaphysics.

  **4. It cannot prevent regret.**
  The candidate in Case 3 will still feel guilt. The Committee will still feel unease. The procedure makes the unease explicit in the minutes, but it does not remove it. That is the cost of honesty.
