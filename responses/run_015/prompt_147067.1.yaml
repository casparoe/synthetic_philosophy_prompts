      *   Highlight the "Opportunistic Pragmatics" of the law.

  6.  **(Mental Check of the "Reasonable Hearer" Counterfactual):**
      *   If the law said "You are liable for what a reasonable person infers," then "Mistakes were made" = Admission.
      *   "I'm sorry" = Admission.
      *   So *both* practices change. Non-apologies stop working. Apology laws become vital to carve out a safe space for "I'm sorry" *without* the inference.
      *   Actually, if the standard is "reasonable inference," Apology Laws are *trying* to legislate against the reasonable inference. So they become a statutory override of the pragmatic norm.
      *   Okay, that's a strong point. The law is trying to re-engineer the Gricean maxims for specific contexts.

  7.  **Finalizing the Structure:**
      *   Intro: Validate the intuition.
      *   1. The Two Theories (Literalism vs. Pragmatic Enrichment).
