answer: |-
  You have put your finger on a genuine tension in legal pragmatics. Your friend was right to point you toward Grice, but the situation is more complicated than standard implicature because the law is not trying to describe how communication *works*; it is trying to engineer how communication *counts*.

  The inconsistency you see is real, but it is not a theoretical confusion. It is a strategic ambivalence. The legal system oscillates between a **Literalist Theory** (liability attaches only to explicit propositions) and a **Pragmatic Theory** (liability attaches to the reasonable inferences a hearer draws), depending on which one minimizes risk for the institution in that specific context.

  Here is the reconstruction of the machinery, the philosophical stakes, and the counterfactual you asked for.

  ### 1. Reconstructing the Implicit Theories

  You identified two practices. Let's formalize the theories of meaning they presuppose.

  **Practice A: Apology Laws (The Pragmatic Theory)**
  *   **The Move:** A surgeon says, "I'm sorry this happened."
  *   **The Fear:** A jury will infer "I caused this through negligence."
  *   **The Presupposition:** Meaning outruns literal content. Hearers (specifically lay jurors) process utterances by filling in gaps based on context, social norms, and causality. The "gap" between *regret* and *responsibility* is naturally bridged by the hearer.
  *   **The Legal Fix:** The statute intervenes to **sever the implicature**. It says, in effect: "For the purposes of this trial, treat 'I'm sorry' as *not* implying fault." It attempts to legislate against the natural workings of pragmatics.

  **Practice B: The Non-Apology (The Literalist Theory)**
  *   **The Move:** A CEO says, "Mistakes were made."
  *   **The Hope:** A court will see no admission of *who* made the mistakes or *whether* they were negligent.
  *   **The Presupposition:** Liability attaches only to **what is said** (the truth-conditional content). If the proposition "We were negligent" is not explicitly encoded in the syntax, it has not been asserted. The institution bets that the legal system will ignore the implicature ("They are admitting they messed up") in favor of the text.
  *   **The Legal Fix:** Rely on the **cancellability** of implicature. Since "Mistakes were made" does not logically entail "We were at fault," the speaker claims they are not on the hook for the inference.

  **Are they inconsistent?**
  Yes. Practice A admits that jurors *cannot* stop themselves from drawing the inference of fault from empathy. Practice B bets that judges and regulators *will* stop themselves from drawing the inference of fault from vagueness.
  However, they are consistent in **goal**: Risk Mitigation. The institution treats language as a minefield. In Practice A, they defuse the mine by changing the rules of explosion (the law). In Practice B, they walk around the mine by using a map that only shows literal terrain (textualism).

  ### 2. What Grice Would Say

  Grice's apparatus explains the asymmetry perfectly, but it also condemns Practice B as dishonest.

  *   **What is Said vs. What is Implicated:** For Grice, "Mistakes were made" *says* that errors occurred. It *implicates* that the speaker's organization is responsible (via the Maxim of Relation: why mention this otherwise?).
  *   **Cancellability:** Grice argued implicatures are cancellable. I can say, "Mistakes were made, but not by us." Practice B relies on the fact that the speaker *didn't* cancel it, hoping the hearer won't notice the cancellation was available.
  *   **The Cooperative Principle:** Grice assumes speakers are trying to be informative, truthful, relevant, and clear. Practice B is a **violation of the Maxims** (specifically Manner and Quantity) designed to *exploit* the hearer's assumption of cooperation. The speaker wants the hearer to think they are being cooperative (apologetic) while withholding the crucial information (admission of fault).

  **Does Grice explain the asymmetry?**
  Grice would say the asymmetry exists because the legal system treats **evidence** differently than **communication**.
  *   In Practice A (Apology Laws), the law acknowledges that the *psychological effect* on the jury (the implicature) is too strong to ignore, so it must be excluded from evidence.
  *   In Practice B (Non-Apologies), the law relies on the *semantic record*. If it isn't written down, it isn't evidence.
  Grice would argue that Practice B is communicatively fraudulent. The speaker is generating an implicature of responsibility to soothe the public while retaining a literalist escape hatch for the lawyers.

  ### 3. Speech Act Theory and Relevance Theory

  If we move beyond Grice, the picture sharpens.

  **Speech Act Theory (Austin/Searle)**
  This distinguishes between the *locution* (the words), the *illocution* (the force, e.g., apologizing), and the *perlocution* (the effect, e.g., calming the family).
  *   **Practice A:** The law tries to change the **illocutionary point**. It attempts to decree that in a medical context, "I'm sorry" counts as an *Expression of Sympathy*, not an *Admission of Liability*. It is trying to redefine the social contract of the speech act.
  *   **Practice B:** This relies on the **felicity conditions** of an apology. To truly apologize, one must accept responsibility. By removing responsibility ("Mistakes were made"), the speaker creates a "hollow performative." It looks like an apology but lacks the essential condition. Speech Act theory says this isn't an apology at all; it's a mimicry of one.

  **Relevance Theory (Sperber & Wilson)**
  This theory argues that human cognition is geared to maximize relevance (information gain vs. processing effort).
  *   **Practice B:** "We regret that customers were disappointed" is designed to be **optimally relevant** enough to stop the anger (it acknowledges the problem) but **vague** enough to avoid legal cost. It manipulates the cognitive environment.
  *   **The Tension:** Relevance Theory suggests that hearers *will* infer fault because that is the most relevant interpretation. Practice B only works if the legal system agrees to ignore cognitive relevance in favor of semantic literalism.

  ### 4. "Sorry" vs. "I Wish This Hadn't Happened"

  Is the risk-management ban on "sorry" principled or superstitious? **It is principled,** rooted in a distinction famously articulated by the philosopher Bernard Williams: **Agent-Regret vs. Spectator-Regret.**

  *   **"I'm sorry":** This expresses **Agent-Regret**. The grammatical subject is "I." The emotion is tied to the speaker's agency. Even if I say "I'm sorry I stepped on your foot" (accidentally), I am linking my agency to the harm. In a legal context, agency is the precursor to liability.
  *   **"I wish this hadn't happened":** This expresses **Spectator-Regret**. The subject is "I," but the object is the *event*, not the speaker's action. It positions the speaker as a witness to a tragedy, not a cause of it.

  Risk managers ban "sorry" because it linguistically constructs the speaker as an agent in the narrative of harm. "I wish..." constructs the speaker as a bystander. It is not superstition; it is a precise manipulation of **thematic roles** in the sentence to avoid constructing a narrative of causation.

  ### 5. The Counterfactual: A "Reasonable Hearer" Standard

  You asked: *If we replaced the implicit theory with one where you're responsible for what a reasonable hearer would infer, full stop... what would these practices look like?*

  This would be a shift from **Semantic Liability** to **Pragmatic Liability**.

  1.  **Non-Apologies Would Become Impossible:**
      If the law says "You are liable for the reasonable inference," then "Mistakes were made" is legally identical to "We messed up." The escape hatch of literalism closes. Corporations could no longer tick the box with weasel words. They would have to either admit fault fully or say nothing. This would increase honesty but also increase litigation risk for vague statements.

  2.  **Apology Laws Would Become Vital (or Pointless):**
      *   *Vital:* If "I'm sorry" automatically implies fault to a reasonable hearer, then without Apology Laws, *no doctor could ever express empathy*. The "Reasonable Hearer" standard would chill all human interaction in healthcare. The Apology Law would be the *only* thing allowing doctors to speak.
      *   *Pointless:* If the standard is "what a reasonable hearer infers," and a reasonable hearer infers fault from "sorry," then the Apology Law is trying to legislate against human psychology. It might fail in practice because jurors are human, not legal robots.

  3.  **What Would We Lose?**
      We would lose **Strategic Ambiguity**.
      *   *The Loss:* Sometimes, ambiguity allows conflicts to de-escalate without determining winners and losers. "Mistakes were made" allows a company to calm a public without triggering a lawsuit that might bankrupt them (and harm other stakeholders).
      *   *The Gain:* We would gain **Communicative Integrity**. The gap between what is meant and what is said would close. We would lose the ability to "have it both ways," which is currently the primary tool of institutional crisis management.

  ### 6. Silence and Accusations

  You half-remembered correctly. This is the doctrine of **Adoptive Admissions** (in the US) or similar evidentiary rules elsewhere.

  *   **The Rule:** If Person A accuses Person B of a crime/fault in Person B's presence, and Person B remains silent, a jury may be allowed to infer that Person B accepts the accusation as true.
  *   **The Pragmatics:** This treats silence as a communicative act. In Gricean terms, it violates the Maxim of Quantity (you aren't providing information), but in a context where a denial is expected, that violation *itself* becomes informative.
  *   **Relevance to Your Question:** This confirms that the legal system *does* operate on a "Reasonable Hearer" model in many contexts. It acknowledges that communication includes what is *not* said.
  *   **The Inconsistency:** The inconsistency is that the law treats silence as an admission (Pragmatic) but treats "Mistakes were made" as non-admission (Literalist). Why? Because silence is hard to explain away, whereas vague language offers a textual defense.

  ### Summary: The Shape of the Thing

  The shape of the thing you were looking for is **Institutional Opportunism regarding Uptake.**

  Institutions do not have a single theory of meaning. They have a **theory of vulnerability.**
  *   When they fear the **hearer's emotion** (the jury's anger at a lack of apology), they assume the hearer is a **Pragmatic Processor** who needs to feel the speaker accepts responsibility. (Hence: "We need to say something that *feels* like an admission.")
  *   When they fear the **hearer's judgment** (the jury's verdict on liability), they assume the hearer is a **Literal Processor** who only punishes explicit claims. (Hence: "We need to say something that *isn't* an admission.")

  They want the **perlocutionary effect** of an apology (calmness, forgiveness) without the **illocutionary force** of an apology (liability, commitment).

  If we forced a single theory—say, the "Reasonable Hearer" standard—you would see a collapse of the non-apology. Corporations would have to choose: either be silent (and risk the inference from silence) or speak clearly (and risk the inference from content). The "non-apology" is a creature of the twilight zone between semantics and pragmatics. Close that gap, and the creature dies.

  We would lose the ability to manage reputation through ambiguity. But we might gain a culture where "I'm sorry" means "I'm sorry," and institutions can't hide behind the passive voice. Whether that trade is worth it depends on whether you value conflict resolution (which benefits from ambiguity) or accountability (which requires precision).
