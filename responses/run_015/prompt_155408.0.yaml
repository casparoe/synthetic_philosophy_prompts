answer: |-
  **Prospectus: The Explanatory Regress and the Infinitist Unity of Propositions**

  **The Research Question**
  Does distinguishing the Explanatory Regress from the Compositional Regress undermine standard solutions to Bradley's Regress, and can an Infinitist account of propositional unity succeed in securing determinate truth conditions without viciousness?

  This question admits a determinate answer. I will argue that the standard triad of solutions (Relational Denial, Fact Primitivism, and Unsaturatedness) successfully addresses the Compositional Regress but fails to address the Explanatory Regress. Consequently, I will argue that an Infinitist account is the only viable response to the Explanatory Regress, provided that "determinate truth conditions" can be defined functionally across an infinite chain of grounding relations rather than foundationally at a base level. If this functional definition fails, the answer to the second half of the question is negative, and I will conclude that the Explanatory Regress forces a rejection of propositional realism.

  **Motivation and Existing Positions**
  Bradley's Regress is typically presented as a single argument against the reality of relations or the complexity of facts. The standard intuition is that if a fact $aRb$ is composed of constituents $a$, $b$, and $R$, a further relation $R'$ is required to bind $R$ to $a$ and $b$, launching a vicious regress. The seminar has focused on three standard exits: denying relations are constituents (treating them as external), treating facts as primitive unities, or positing that some constituents (predicates/concepts) are unsaturated and thus self-binding.

  I suspect these positions conflate two distinct problems. The *Compositional Regress* asks how a plurality becomes a whole. The *Explanatory Regress* asks why the unifying principle unifies *these* constituents specifically. Standard solutions stop the Compositional Regress by fiat (e.g., "facts are primitive") but leave the Explanatory Regress untouched. If we ask *why* a primitive fact is unified, or *why* an unsaturated concept saturates *this* object, we seem to require a further explanation, reinstalling the regress.

  This distinction opens space for a fourth option largely ignored in recent literature: Infinitism. Analogous to epistemic infinitism, this view holds that the unity of a proposition is grounded in a non-terminating chain of further unifying relations. The standard objection is that this renders unity impossible to achieve. However, if the regress is merely Explanatory, an infinite chain of explanations may be benign. The critical hurdle, which this paper must clear, is whether such a view can account for the *determinacy* of truth. If unity is never completed, it is unclear how a proposition possesses a specific truth condition rather than merely indefinitely many partial explanations of its unity.

  **Methodology and Work Plan**
  This is an argumentative paper, not a survey. The 6,000-word limit requires rigorous scoping. I will not provide a historical exegesis of Bradley or Frege but will use their arguments as structural templates.

  *Month 1: Formulating the Distinction.*
  I will draft the core distinction between the Compositional and Explanatory regresses. I will test this distinction against the three standard solutions discussed in seminar. The goal is to demonstrate that while these solutions block the Compositional regress, they remain vulnerable to the Explanatory reading. For example, I will argue that positing "unsaturatedness" explains *that* binding occurs, but not *why* the specific binding holds without appealing to a further relational fact. By the end of Month 1, I will have a finalized argument that the standard exits are incomplete.

  *Month 2: Constructing the Infinitist Model.*
  I will develop the positive infinitist account. I need to define what it means for a proposition to be "unified" by an infinite chain of relations rather than a base fact. I will draw on structural analogies from the metaphysics of grounding. The primary task here is to articulate how the chain confers unity at every step without requiring a final step. I will produce a detailed outline of the paper's positive argument.

  *Month 3: The Truth Condition Objection.*
  This is the highest-risk section. I must show how an infinitely deferred unity yields a determinate truth value. I will explore a functionalist account of truth conditions: a proposition is true if the infinite chain of unifiers is instantiated, false if it is not, regardless of whether the chain terminates. I will test this against counterexamples where infinite deferral seems to preclude truth-evaluability. If I cannot solve this, I will pivot to a negative conclusion (see "Range of Conclusions").

  *Month 4: Writing and Revision.*
  I will draft the paper sequentially, ensuring the argument drives the exposition. I will prioritize the argument for the distinction and the truth-condition objection over historical context. I will seek feedback from the seminar leader midway through this month to ensure the determinacy of the conclusion is clear.

  **Range of Possible Conclusions**
  1.  **Strong Infinitism:** The Explanatory Regress is benign, and functional truth conditions are sufficient. (Preferred outcome).
  2.  **Qualified Infinitism:** The Explanatory Regress is benign, but truth conditions require a pragmatic cutoff, not a metaphysical base.
  3.  **Negative Conclusion:** The Explanatory Regress is vicious, and standard solutions fail; therefore, propositional realism is untenable.
  4.  **Collapse:** The distinction between Compositional and Explanatory regresses is illusory; they stand or fall together.

  The deciding consideration will be the viability of the functionalist account of truth conditions in Month 3. If I can define truth conditions without a metaphysical foundation, Option 1 or 2 follows. If truth conditions necessarily require a base level of reality, Option 3 follows. If the analysis of the standard views in Month 1 shows they actually do solve the Explanatory regress, Option 4 follows.

  **Feasibility and Risk Assessment**
  This project is ambitious for a 6,000-word paper and a single semester. The primary risk is that the "Infinitist" position requires too much setup to be defensible in the available word count. Defending infinitism against the charge of viciousness is a major metaphysical undertaking on its own.

  To ensure feasibility, I will implement the following cuts if necessary:
  1.  **Cut Historical Context:** I will not trace the regress through Bradley, Russell, and Frege in detail. I will treat "Bradley's Regress" as a formal problem structure.
  2.  **Narrow the Standard Views:** I will focus only on Fact Primitivism and Unsaturatedness. Relational Denial is less relevant to the Explanatory reading and can be mentioned only in passing.
  3.  **Simplify the Truth Account:** If a full functionalist theory of truth is too complex, I will argue merely that the *objection* regarding truth conditions fails, without fully constructing a positive theory of infinitist truth.

  The project fails if I cannot articulate a clear difference between the Compositional and Explanatory regresses. If they collapse into one another, the motivation for Infinitism disappears, and the paper becomes a standard critique of Bradley's Regress with no novel contribution. A secondary failure condition is if the Infinitist view renders truth conditions *indeterminate* by definition. In that case, I must be prepared to argue for the Negative Conclusion (Option 3) rather than forcing a defense of Infinitism that does not hold.

  I believe the distinction between the two regresses is robust enough to sustain the paper even if the Infinitist defense is only provisional. The primary contribution will be the diagnostic separation of the two regress problems, which clarifies why standard solutions feel unsatisfying even when they are logically valid. This diagnostic work alone justifies the paper's length, even if the positive infinitist proposal remains programmatic.
