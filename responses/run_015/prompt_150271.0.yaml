answer: |-
  Here is a 40-minute lesson plan designed to move from the mechanics of the paradox to the structural issues that pave the way for Newcomb.

  ### 1. The Sequence: Closed then Open
  **Do not start with the open envelope.** Start with the **Closed** version.

  *   **Why:** The Closed version establishes the *symmetry* baseline. If they haven't looked, $E[\text{Left}] = E[\text{Right}]$ is trivial and uncontroversial. This anchors the truth: there is no free lunch.
  *   **The Pivot:** Then, introduce the **Open** version ("You look and see \$100"). This is where the calculation $0.5(200) + 0.5(50) = 125$ becomes tempting.
  *   **Pedagogical Payoff:** This sequence isolates the error. It shows that the act of *observing* the value shouldn't magically create expected value out of thin air. If the calculation says it does, the calculation is misusing the observation. This sets up the Bayesian requirement: an observation only updates expectations if you have a prior that makes some values more likely than others.

  ### 2. The Carrying Example
  Avoid pure variables ($x, 2x$) for the core explanation; that is where the equivocation hides. Avoid single specific numbers ($10, 20$); that makes the prior invisible.

  **Use a Discrete Prior Table.**
  Write this on the board early (Minute 5):
  *   The host flips a coin until Heads. Let $k$ be the number of tosses.
  *   Pair is $(2^k, 2^{k+1})$.
  *   This gives a proper prior (geometric distribution) where every amount is possible, but larger amounts are less likely.

  When a student sees \$100 (which is $2^k$ for some $k$), they can now explicitly calculate: "What is the probability this is the *smaller* amount vs. the *larger* amount?"
  *   If the prior is uniform-ish, $P(\text{small}|\text{see } y) \approx P(\text{large}|\text{see } y)$.
  *   If the prior drops off fast, $P(\text{small}|\text{see } y) \ll P(\text{large}|\text{see } y)$.
  This makes the dependence on the prior concrete without measure theory.

  ### 3. Mapping the Misconceptions (and when to defuse them)

  **Misconception 1: The Variable Equivocation (Minute 10-15)**
  *   **The Slip:** In the formula $0.5(2A) + 0.5(A/2)$, the $A$ in the first term (I have the smaller) is a different random variable than the $A$ in the second term (I have the larger).
  *   **Defuse:** Use the Discrete Prior Table. Show that if you have the smaller amount, $A=2^k$. If you have the larger, $A=2^{k+1}$. You cannot sum them as if $A$ is fixed.
  *   **Decision Theory Lesson:** You cannot calculate expected utility by averaging over states while holding the *consequences* fixed if the consequences depend on the state.

  **Misconception 2: The "No Uniform Prior" Dodge (Minute 20-25)**
  *   **The Slip:** "The paradox only exists because there's no uniform distribution over positive reals. If we had a proper prior, it goes away."
  *   **Defuse:** This is the critical bridge to Newcomb. Show that with a proper prior (like the geometric one above), you can *still* construct cases where $E[\text{Other} | \text{See } y] > y$ for *specific* $y$.
  *   **Decision Theory Lesson:** The problem isn't just "improper priors." The problem is assuming $P(\text{smaller} | \text{value}) = 0.5$. That conditional probability is a function of the prior, not a logical truth.

  **Misconception 3: The "Always Switch" Dominance (Minute 25-35)**
  *   **The Slip:** "If $E[\text{Other} | \text{See } y] > y$ for *every* $y$ I might see, then the policy 'Always Switch' must have higher unconditional utility."
  *   **The Truth:** This is **true** *if and only if* the unconditional expectations are finite.
  *   **How to say it:** "If the prior is heavy-tailed enough (e.g., $P(\text{pair } k) \propto 1/k^2$), you can indeed make switching look better for every observed value. But in that specific case, the expected value of *both* envelopes is infinite."
  *   **The EU Defense:** Expected Utility Theory is not broken; it is **silent**. EU comparisons require finite integrals. If $E[\text{Keep}] = \infty$ and $E[\text{Switch}] = \infty$, the theory does not prescribe a preference. Do not let them leave thinking EU allows infinite dominance.
  *   **Decision Theory Lesson:** Dominance reasoning fails when expectations are undefined.

  ### 4. The Bridge to Newcomb (Minute 35-40)
  This is your payoff. You have spent 35 minutes teaching them that **conditional probabilities depend on the model/prior**, and that **dominance arguments fail when states are correlated with your evidence.**

  *   **The Link:** In the Two-Envelope problem, the naive argument fails because the probability of being in the "double" state is correlated with the value you see (given a prior).
  *   **The Newcomb Setup:** "Next week, we look at a problem where the probability of the money being in the box is correlated with the *action you take*."
  *   **The Punchline:** "In Two-Envelope, we resolved the paradox by realizing $P(\text{State} | \text{Value})$ isn't fixed at 0.5. In Newcomb, the debate is about whether you should condition on $P(\text{State} | \text{Action})$ at all. Two-Envelope teaches you to check your conditional probabilities; Newcomb asks which conditional probabilities are decision-relevant."

  ### 5. The Diagnostic Question
  Do not ask: *"Does switching depend on your prior?"* (They will all parrot "Yes".)

  **Ask this:**
  > "You open the envelope and see \$100. I tell you the host used a prior distribution where the pair (\$50, \$100) was twice as likely to be generated than the pair (\$100, \$200). Do you switch?"

  *   **The Mummer:** "It depends on the prior." (Vague)
  *   **The Knower:** "No. The likelihood ratio is 2:1 in favor of \$100 being the *larger* amount. $E[\text{Other}] = \frac{2}{3}(50) + \frac{1}{3}(200) = 33 + 66 = 100$. I am indifferent." (Or if the ratio favors the larger pair, they switch).
  *   **Why it works:** It forces them to compute the posterior odds of the *states* (Small vs. Large) given the *value*, rather than just waving at the concept of a prior.

  ### 6. What to Deliberately Leave Out
  1.  **Measure Theory:** Do not mention Fubini's Theorem or non-convergent series by name. Say "infinite expectations break the arithmetic" and move on.
  2.  **The "Aliquot" Parts:** Don't get bogged down in whether the amounts must be integers. Keep it continuous or powers of 2; the logic is identical.
  3.  **History:** No need to discuss who invented it (Kraitchik, Gardner, etc.). It distracts from the decision-theoretic structure.
  4.  **N-Envelope Variations:** Keep it strictly binary. Newcomb is binary (One vs. Two box); keep the cognitive load focused on the 2-state structure.

  ### Summary of Flow
  1.  **Closed:** Symmetry $\to$ No gain.
  2.  **Open:** Naive Calc $\to$ Apparent gain.
  3.  **Resolution:** $P(\text{Small}|\text{Value}) \neq 0.5$. Use Discrete Prior.
  4.  **Edge Case:** Heavy tails $\to$ Infinite EU $\to$ Dominance fails.
  5.  **Bridge:** Correlations between States and Variables (Value/Action) undermine naive dominance.
  6.  **Exit Ticket:** Calculate the posterior odds.
