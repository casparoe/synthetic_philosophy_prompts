          *   What to leave out.

  2.  **Deconstruct the Two-Envelope Paradox (TEP):**
      *   *Standard Setup:* Two envelopes, one has $x$, one has $2x$. You pick one. Should you switch?
      *   *Naive Argument:* Let $A$ be the amount in my envelope. Other envelope is $2A$ or $A/2$ with prob 0.5 each. $E[\text{switch}] = 0.5(2A) + 0.5(A/2) = 1.25A > A$. Switch.
      *   *The Flaw:* $A$ is not a fixed constant in the expectation calculation; it depends on which envelope was picked. It's an equivocation on the random variable.
      *   *The Bayesian Twist:* If we condition on seeing value $y$, does $E[\text{other} | \text{seen}=y] > y$? This depends on the prior distribution over the pairs $(x, 2x)$.
      *   *The "Always Switch" Policy:* If $E[\text{other} | \text{seen}=y] > y$ for *all* $y$, then unconditional expectation of switching must be higher. But by symmetry, it can't be. Resolution: Such a prior implies infinite expectation, making EU comparisons ill-defined or requiring careful handling of infinite series (Fubini/Tonelli issues, though students lack measure theory).

  3.  **Address the Specific Pedagogical Questions:**

      *   **Order (Closed vs. Open):**
          *   *Closed:* Good for symmetry argument. Easy to see switching is neutral.
          *   *Open:* Good for exposing the conditional expectation error.
          *   *Decision:* Start Closed to establish the baseline intuition (symmetry), then Open to introduce the calculation that breaks it, then resolve. This mirrors the move from causal dominance (Newcomb) to evidential conditioning.
          *   *Wait, the prompt asks about bridging to Newcomb.* Newcomb is about correlation vs. causation and conditioning on actions/states. TEP is often about improper priors or variable equivocation. To bridge to Newcomb, we need to emphasize the *conditioning* aspect. The "Open" version is crucial for the Bayesian link.
          *   *Revised Plan:* Start with the *calculation* (Open/Closed ambiguity is the trap). Actually, standard pedagogy suggests starting with the naive argument (which implies looking or treating the amount as fixed) and then showing why it fails.
          *   *Better approach for Decision Theory:* Start with the **Closed** version to establish the *policy* question (Always Switch vs. Never Switch). Then move to the **Open** version to analyze the *conditional* expectation. This highlights the gap between $E[\text{Switch}]$ and $E[\text{Switch} | \text{Value}=y]$.

      *   **Carrying Example:**
          *   Variables ($x, 2x$) are where the equivocation happens.
          *   Specific numbers ($10, 20$) make it trivial.
          *   *Best:* Use specific numbers to show the prior matters. E.g., if you see 10, could the other be 5 or 20? Only if the prior allows (5,10) and (10,20) pairs.
          *   *Recommendation:* Use a concrete prior distribution (e.g., geometric or bounded) to show when switching is actually beneficial.

      *   **Misconception Mapping:**
          1.  *Equivocation:* Treating $A$ as constant in $0.5(2A) + 0.5(A/2)$.
          2.  *Uniform Prior:* "It fails because there's no uniform prior on $\mathbb{R}^+$." (False, fails even with proper priors if expectations are infinite).
          3.  *Dominance:* "If switching is better for every $y$, it must be better overall." (True *if* expectations are finite/defined. If infinite, EU breaks down).

      *   **The "Always Switch" / Heavy Tail Issue:**
          *   Is it true? Yes, if the expected value is infinite.
          *   How to say it? EU theory requires finite expectations for standard comparisons. If $E[\text{Envelope}] = \infty$, the theory doesn't prescribe a move. It's not that EU is broken; it's that the inputs are ill-behaved.
          *   *Bridge to Newcomb:* Newcomb isn't about infinite expectations. It's about *which* conditional probabilities matter (causal vs. evidential). TEP is about *valid* conditioning.
          *   *Wait, is TEP the best bridge to Newcomb?* Usually, TEP bridges to *infinite utility* or *improper priors*. Newcomb bridges to *causal vs. evidential decision theory*.
          *   *Connection:* Both involve how we calculate expected utility given information. In TEP, we condition on the amount (evidential). In Newcomb, we condition on the prediction (evidential) vs. the act (causal).
          *   *Refinement:* The link is the **conditioning strategy**. In TEP, conditioning on the value $y$ leads to a paradox if the prior is weird. In Newcomb, conditioning on the box content leads to a paradox if you ignore the causal structure.
          *   *Actually, a stronger link:* The TEP "Always Switch" argument looks like a dominance argument. "For every $y$, Switching is better." This looks like State Dominance. But it fails. Why? Because the probabilities of the states depend on the value $y$. In Newcomb, dominance fails because the probabilities of the states (Predictor's move) depend on your action. *This is the golden link.* Correlation between action/state vs. value/state.

      *   **Final Question:** Needs to distinguish "it depends on the prior" (shallow) from "the prior determines the conditional probabilities of the other envelope" (deep).
      *   **What to Leave Out:** Measure theory (Fubini), deep integration theory, history of the paradox.

  4.  **Drafting the Plan (Iterative refinement):**

      *   *Minute 0-5:* Setup. Closed envelopes. Symmetry argument. $E[\text{keep}] = E[\text{switch}]$.
      *   *Minute 5-15:* The Naive Calculation. Introduce $A$. Show $1.25A$. Ask: Where did symmetry go?
      *   *Minute 15-25:* The Bayesian Fix (Open Envelope). You see $y$. What is $P(\text{other}=2y | \text{seen}=y)$? It depends on the prior $P(\text{pair}=(y, 2y))$.
      *   *Minute 25-35:* The "Always Switch" & Infinite Expectation. Can we construct a prior where switching is always better? Yes, but $E = \infty$. EU theory stalls. This is the "break" point.
      *   *Minute 35-40:* Bridge to Newcomb. The "Dominance" illusion. In TEP, states (small/large) are correlated with values. In Newcomb, states (Predictor) are correlated with Actions. Both warn against naive dominance when correlations exist.

      *   *Correction on the Bridge:* The prompt specifically wants to use TEP to bridge to Newcomb.
      *   *Standard Bridge:* TEP is often used to discuss *conditional expected utility*. Newcomb is about *which conditional expected utility* to maximize (CDT vs. EDT).
      *   *Better Bridge:* The TEP shows that $E[\text{Other} | \text{Mine}=y]$ is not necessarily $> y$. It depends on the likelihood ratio. Newcomb shows that $E[\text{Outcome} | \text{One-Box}]$ is not necessarily the right metric if causation is ignored.
      *   *Actually, the strongest link is the "State Dependence".* In TEP, the probability that you hold the smaller amount *depends on the value you see* (given a prior). In Newcomb, the probability the money is there *depends on the action you take* (given the predictor).
      *   *Wait, I need to be careful.* In TEP (proper prior), the prob you hold the smaller amount *does* depend on $y$. In Newcomb, the prob the money is there *does not* depend on your action (causally), but *does* evidentially.
      *   *Let's stick to the prompt's specific request:* "Misconception structure."
      *   *Key Misconception:* Treating the probability of being in the "double" vs "half" case as fixed at 0.5 regardless of the amount.
      *   *Newcomb Link:* Treating the probability of the Predictor's state as fixed regardless of the decision.

  5.  **Refining the "Always Switch" / Heavy Tail answer:**
      *   If the prior is such that $P(\text{smaller}=2^k) \propto 1/2^k$ (or similar heavy tail), you can get $E[\text{other}|y] > y$ for all $y$.
      *   Does this mean "Always Switch" is rational?
      *   If $E[\text{Envelope}] = \infty$, then $E[\text{Switch}] - E[\text{Keep}]$ is $\infty - \infty$, which is undefined.
      *   So, EU theory isn't broken, it's just silent.
      *   *Instruction:* Be clear that standard EU assumes finite integrals. If they aren't finite, the axioms don't apply.

  6.  **Final Diagnostic Question:**
      *   Bad: "Does switching depend on the prior?" (Yes/No)
