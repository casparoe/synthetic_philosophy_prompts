  ANA REYES: Welcome back to the steelman series. It's been three weeks since the level-of-detail finding was confirmed. Idris, you've maintained that this changes nothing about our longtermist mandate. I maintain it pulls the rug out from under fanaticism.

  IDRIS HALVORSEN: It changes the substrate, Ana, not the stakes. If the simulation is sufficiently large, the astronomical waste argument holds. We still face a potential future of immense scale.

  ANA REYES: Sufficiently large is the operative phrase. We are talking about a bounded compute budget. If the simulators have scheduled an end date—say, the year 2100—there is no far future to save. The truncation thread alone kills the longtermist calculus.

  IDRIS HALVORSEN: We don't know the bound. The finding shows finite resolution, not finite duration. The hardware could sustain billions of subjective years. You're assuming a small box because you want one.

  ANA REYES: I'm assuming physics applies to the simulator too. Compute is costly. Every rendered mind costs cycles. If the budget is fixed, the total population is capped. We can't fill the universe with trillions of minds if the hardware can't sustain the load.

  IDRIS HALVORSEN: That's the budget and rendering thread. But you're ignoring lazy rendering. If unobserved regions are held as compressed summary statistics, you don't need full physics for every neuron. You can pack vastly more minds into the same compute budget than a physical universe allows.

  ANA REYES: I'll concede that point. If lazy rendering makes minds computationally cheaper, the capacity could exceed a physical baseline. That weakens my truncation argument regarding population size. But it doesn't solve the leverage problem.

  IDRIS HALVORSEN: How so?

  ANA REYES: If simulators intervene, our causal power is illusory. They might override our extinction risks because they want the show to continue. Or they might end it early if we become boring. We aren't steering the ship; we're characters in a script whose author can edit the plot.

  IDRIS HALVORSEN: I'll concede the intervention risk. If they terminate runs based on interest, our leverage is fragile. But that amplifies stakes, not dampens them. We need to make the simulation interesting enough to keep running. Longtermism becomes a survival strategy to avoid cancellation.

  ANA REYES: That's a pivot from saving lives to entertaining gods. It changes the moral calculus entirely. Which brings us to moral weight. Do summary statistics count? If a future mind is stored as a compressed file until observed, does it suffer?

  IDRIS HALVORSEN: Substrate independence. If the computation resolves to the same output, the experience is real. The delay in rendering doesn't negate the qualia.

  ANA REYES: But if it's never resolved? If the future is never rendered because we go extinct now, those compressed stats never become experiences. You're betting on potential minds that might never be computed. I say unrendered stats have zero moral weight.

  IDRIS HALVORSEN: You're betting they won't be. I say the probability of resolution is high enough to justify the bet. The expected value remains astronomical.

  ANA REYES: We're dismissing multiplicity, right? The copy argument?

  IDRIS HALVORSEN: Red herring. Whether there are a million copies of this sim doesn't change the value of actions within this one. The correlation cancels out. It doesn't help us decide between near-term and far-term interventions.

  ANA REYES: Agreed. So we're left with moral weight and leverage. Idris, if you admit leverage is fragile, you admit our expected influence is lower.

  IDRIS HALVORSEN: Only if the termination probability is high. If it's low, the stakes are higher because the audience is watching.

  ANA REYES: We're not going to agree on the probability.

  IDRIS HALVORSEN: No. But we agree the finding is real.

  ANA REYES: And we disagree on whether unrendered stats have moral weight.

  IDRIS HALVORSEN: That's the crux.

  ANA REYES: Then let's state it. We accept the level-of-detail finding implies a simulation. We disagree on whether the moral weight of unrendered future minds is sufficient to sustain fanaticism.

  IDRIS HALVORSEN: Correct. The rest is noise.

