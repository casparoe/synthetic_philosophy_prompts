prompt: |-
  hey so me and my friend jake were arguing til like 2am about whether special relativity actually proves the future already exists or if thats just pop science nonsense. he summarized the Rietdijk-Putnam thing like this: Rietdijk showed that in SR there's literally no objective 'now' because simultaneity is frame-dependent, so if you're walking toward Andromeda at walking speed then Andromeda's 'present' includes events that for me sitting still are centuries in the future. Putnam then said this kills presentism dead - since there's no universal present slice, all events past present and future must be equally real, just points in spacetime. jake also said this is basically the same argument as determinism, because if future events are already 'there' in the block then nothing can change them, so free will is an illusion. and he said presentists nowadays mostly try to save themselves by going back to Lorentz's ether with a hidden absolute time, but philosophers of physics mostly think thats debunked and eternalism is the default view.

  i think he's mixing up a couple things but i can't tell which ones are real errors vs me just not getting it. can you go through his summary point by point and tell me what's accurate, what's subtly misrepresented, and what's just wrong? specifically: does the Andromeda example actually show what he thinks, or is he overstating what walking-speed motion does? is Putnam arguing directly for eternalism, or just showing presentism conflicts with relativity? does the block universe actually entail determinism, or is jake conflating two different issues? and is it fair to say philosophers mostly accept eternalism now, or is there still a live debate with presentists using other strategies besides Lorentzian ether? i want to know which parts he could defend if he was being careful and which parts he really needs to drop.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user and their friend Jake argued until 2 AM about Special Relativity (SR), the Block Universe, Eternalism vs. Presentism, Determinism, and the current philosophical consensus.
      *   **Jake's Claims:**
          1.  Rietdijk-Putnam argument: SR implies no objective 'now' (simultaneity is frame-dependent).
          2.  Andromeda Example: Walking toward Andromeda shifts your "present" to include events centuries in the future relative to a stationary observer.
