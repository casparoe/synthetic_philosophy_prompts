answer: |-
  You press me on the boundary between what is and how it came to be, and you ask whether my silence on the genesis of convention is a failure of the account. I think it is not a failure, but a necessary delimitation. Let me try to explain why, and to draw the line you ask for as clearly as I can.

  You are quite right to say that my account is a portrait of equilibrium. When I analyze a convention, I am analyzing a state of affairs. I am asking: what must be true of a group of people, at a given time, for us to say they are following a convention? The answer, as you noted, turns on expectations and preferences. I follow the regularity because I expect you to follow it, and I prefer to follow it given that you do. You follow it for the same reason. And we each know that the other knows this. This web of mutual expectation and conditional preference is the structure of the convention.

  Now, to your question: what distinguishes this from a mere habit, a custom, or a routine law?

  Consider a habit. I drink coffee every morning. I do this regardless of what you do. If you were to switch to tea, I would not feel compelled to switch to tea. My preference for coffee is independent of your action. This is not a convention. A convention requires interdependence. I drive on the right side of the road primarily because you drive on the right. If I discovered that everyone else had suddenly switched to the left, my preference would switch as well. I have a conditional preference to conform, provided others conform. That is the first line: independence versus interdependence.

  But what of custom? Here the waters are muddier. Often we use the words interchangeably. But if we must distinguish them, I would say a custom may lack the strict coordination structure. A custom might be followed out of a sense of tradition or moral obligation, even if others do not follow it. I might wear a black armband to mourn because it is the custom, even if my neighbors do not. I feel I ought to do it. In a convention, the "ought" is hypothetical. I ought to drive on the right *if* you do. If you stop, the obligation vanishes. The convention is arbitrary in a way a moral custom is not. There is another regularity—driving on the left—that would have served our purposes just as well, provided we all agreed on it. A moral custom rarely admits such an equivalent alternative.

  And the law? A law can be a convention, but it need not be. If a law is backed solely by sanctions, and I obey only to avoid the policeman, regardless of what you do, then it is not a convention. It is a coordination problem solved by force. However, many laws are conventional. We obey traffic signals not just because of the fine, but because we expect others to obey them, and we wish to avoid collision. The law codifies the convention; it does not always create it.

  So the property that marks the line is this: common knowledge of a system of conditional preferences grounded in mutual expectations, regarding an arbitrary regularity that solves a coordination problem.

  You ask whether this property could be present at the moment of origin, or whether it emerges only after the regularity has persisted for a while. Here we must be precise. If the property is not present, then, by my analysis, the convention does not yet exist. It is not that the convention exists and lacks the property; it is that the phenomenon has not yet crystallized into a convention.

  Imagine two people approaching each other on a narrow path. They step left; they clash. They step right; they clash. They step left again. Suddenly, one steps right, the other sees this, and steps left. They pass. Was that a convention? Not yet. That was a solution to a single instance. For a convention to exist, there must be a precedent that generates an expectation of future conformity. When does that happen? It happens when the precedent becomes common knowledge. When I know that you know that we have solved this before, and I know that you know that I expect you to do it again, and so on.

  This moment might be immediate. It might take years. But whenever it happens, the property must be present *then*. It does not emerge later to validate the past. Before that moment, there was only trial and error, or perhaps a habit of confusion.

  Now, you ask if my silence on how that moment arrives is a defect. I contend it is a feature. I am offering a conceptual analysis, not a history. To define "water" as H2O is not to explain the first rainstorm. To define "convention" as a certain equilibrium of expectations is not to explain the first handshake.

  However, I will concede this: the transition is likely not sharp in the real world. Common knowledge is an idealization. In practice, there is a foggy period where expectations are forming, where some people conform and others do not, where the regularity is fragile. My analysis treats the state of convention as clear-cut, but the process of becoming conventional is a matter of degree. If you press me to say exactly when the fog lifts, I cannot give you a timestamp. I can only say that when the expectations are sufficiently robust and sufficiently known, we have a convention.

  Regarding your character who believes social order is a product of drift: my account is quite compatible with this. I do not require a grand design or a explicit agreement to launch a convention. Precedent and salience are enough. If we both see a prominent landmark, we might both decide to meet there without speaking. If we both prefer to avoid collision, we might both drift to the right without planning it. The order emerges from the interaction of individual rationalities, not from a designer's blueprint.

  So, to answer you plainly: The line turns on interdependence of expectations and the arbitrariness of the solution. That property must be present for the convention to exist at all. If it is not present at the origin, then the origin was not yet a convention. My account does not describe the drift itself, but the structure that the drift eventually produces. Whether that silence is a defect depends on whether you seek a history of society or an analysis of its logic. I have attempted the latter. If you require the former, you must look elsewhere, or speculate as I have done, knowing that you step beyond the analysis into the realm of conjecture.
