      *   *Characteristics of the True Judge:* Delicacy of taste, practice, comparison, freedom from prejudice, good sense.
      *   *The Circularity Problem:* How do we identify the true judge? By their taste. How do we know their taste is correct? Because they are true judges. This is the classic "is-ought" or circularity objection raised by many (e.g., Kant later, contemporary meta-ethicists).
      *   *The Empirical Defense:* Hume is an empiricist. He observes that over time, certain works endure (Homer, Virgil). The critics who appreciate these are the "true judges." It's an inductive generalization from human psychological uniformity.
      *   *The Sociological/Cultural Critique (Lock-in):* Bourdieu-esque argument. Taste is cultural capital. The "canon" is power, not truth.
      *   *The Independence Reply:* If people from vastly different cultures/times agree, it suggests universality (psychological uniformity) rather than just local conditioning.
      *   *The Globalization Counter:* Western hegemony has homogenized global culture, making "different traditions" less independent than they appear.

