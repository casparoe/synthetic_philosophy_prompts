  7.  **Unsettled Case (Consortium Safety Cap):**
      *   Is it (e) (reducing risk) or (b) (race to bottom)?
      *   If the cap is binding and prevents regulation, it might be strategic capture. If it prevents a race to the bottom, it's (e).
      *   Application: If the cap is lower than what regulation would demand, it's strategic (blameworthy). If higher, it's altruistic (praiseworthy).

  8.  **New Case:**
      *   Two countries racing to build a dam on a shared river. First to build gets water rights.
      *   Application: Blameworthy if it dries the neighbor (risk imposed).

  9.  **Last Mover Advantage:**
      *   If advantage goes to the *last* committer (e.g., waiting to see what others do), the race becomes a game of chicken where waiting is winning. Principle flips: blame attaches to premature commitment that destabilizes coordination.

