          5.  Evaluate the conclusion (is democratic collapse mainly an internal electoral problem, or does the analogy give it fake weight?).
      *   **Tone:** Critical, analytical, nuanced, not just nodding along.

  2.  **Initial Brainstorming & Fact-Checking:**

      *   *The Analogy:* It's a popular trope (e.g., Steven Levitsky, Daniel Ziblatt, various pundits). It focuses on "autocratic legalism" or "democratic backsliding."
      *   *Roman Republic Mechanics:* Senate (aristocratic), Assemblies (popular), Tribunes (veto/popular protection), Consuls (executive), Dictator (emergency power).
      *   *Modern Mechanics:* Legislature, Executive, Judiciary, Media, Bureaucracy, Electorate.
      *   *Key Differences:* Rome was a slave society, oligarchic republic, no political parties in the modern sense, violence was endemic in the late Republic, suffrage was limited/weighted. Modern states have mass bureaucracy, nuclear weapons, globalized economies, universal suffrage (theoretically).
      *   *Polybius:* He argued for the *mixed constitution* (Monarchy + Aristocracy + Democracy) preventing decay. The analogy assumes modern systems *are* mixed constitutions that can be unbalanced.
      *   *The "Voter Blame" Aspect:* The prompt asks if this analogy smuggles in the idea that *voters* are the problem (trading liberty for order), shifting blame from institutions/elites.

  3.  **Drafting the Correspondence Table:**

      *   *Senate:* Upper house? Establishment elites? Donor class? -> *Best fit:* Political establishment/Party elites/Bureaucracy/Upper Chamber.
      *   *Tribunes:* Populist leaders? Veto-wielding minorities? -> *Best fit:* Populist executives claiming direct mandate from "the people."
