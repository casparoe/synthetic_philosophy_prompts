      *   *Risk:* The analogy can be elitist ("people can't be trusted") or deterministic ("decline is inevitable").

  7.  **Evaluating the Conclusion (Internal Electoral vs. Institutional/Economic):**

      *   If the analogy holds, the threat is *voters* eroding checks.
