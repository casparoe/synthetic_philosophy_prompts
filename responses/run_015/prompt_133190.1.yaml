      *   *Media:* Rome = Oratory/Rumors. Modern = Algorithmic polarization/Disinformation.
      *   *State Capacity:* Rome = weak bureaucracy. Modern = high surveillance/bureaucratic control.
      *   *Nuclear/Geo:* Rome = regional hegemon. Modern = MAD/Global interdependence.

  5.  **Addressing the Polybian Framing:**

      *   Does the analogy assume a Mixed Constitution? Yes. It assumes there are distinct "parts" (executive, legislative, judicial) that balance each other.
      *   Is this right? Parliamentary systems fuse executive/legislative. Presidential separate them. The analogy works better for Presidential (like US) than Parliamentary (like UK), but even then, parties dominate both.
      *   *Critique:* Modern democracy isn't just about balancing branches; it's about norms, civil society, and economic equality. Polybius ignores class struggle (Marx would say).

  6.  **Addressing the "Voter Blame" / Liberty vs. Security:**

