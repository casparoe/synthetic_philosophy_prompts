answer: |-
  **MEMORANDUM OF PARTIAL CONVERGENCE**
  **To:** The Dimensionalist Party; The Thresholdist Party
  **From:** Rapporteur, Ethics of Mind Collaboration
  **Subject:** Statement of Agreed Claims, Residual Disagreements, and Cruxes
  **Date:** October 26, 2023

  ### I. Statement of Agreed Claims

  The following claims represent the substantive common ground established over the course of the collaboration. Both parties affirm these propositions as accurate reflections of their shared commitments, distinct from their divergent theoretical frameworks.

  1.  **Architecture over Behavior:** Moral status is not determined solely by input-output behavioral profiles. Two systems exhibiting identical avoidance behaviors may differ in moral status depending on their internal architectural organization.
  2.  **The Thermostat Baseline:** A simple negative-feedback controller (e.g., a standard thermostat) lacks moral status. Both parties agree that mere error-correction without complex internal modeling does not generate moral claims.
  3.  **Empirical Uncertainty regarding Insects:** Current neuroscience does not definitively establish whether insects possess the requisite internal architecture for moral status. Both parties agree that the insect case remains an empirical open question, though they differ on the theoretical implications of the possible findings.
  4.  **The Centrality of Aversive Capacity:** The capacity to enter aversive states (states the system is motivated to terminate) is the primary candidate for the basis of moral status. Neither party argues for moral status in systems incapable of aversion, regardless of their complexity.
  5.  **Relevance of the Test Cases:** Both parties agree that the *Flicker Case* and the *Deep-Feedback Learner* are decisive thought experiments. They successfully isolate the variables of *temporal persistence* and *functional learning* from the variable of *phenomenal unity*.
  6.  **Pragmatic Caution:** In cases of empirical uncertainty (such as the insect case), both parties agree that a precautionary principle is rational policy, even if the theoretical justification for that principle differs between the two frameworks.
  7.  **Case-Specific Agreements:**
      *   **Regarding the Deep-Feedback Learner:** Both parties agree this system exceeds the thermostat in complexity (due to persistent internal variables and revised avoidance) but lacks obvious markers of a unified phenomenal field.
      *   **Regarding the Flicker Case:** Both parties agree this scenario presents a challenge to standard definitions of "persistence." It forces a choice between valuing the *episode* of suffering or the *subject* that endures it.

  ### II. Table of Residual Disagreements

  The following table outlines the core theoretical divergences. The wording in each cell has been vetted to ensure it is a charitable representation acceptable to the respective party.

  | Topic | The Dimensionalist Position | The Thresholdist Position |
  | :--- | :--- | :--- |
  | **1. The Structure of Status** | Moral status is a multi-dimensional surface. It varies in degree along axes of valence intensity, temporal grip, and evaluative depth. | Moral status is binary. It is a property one either possesses or lacks, contingent on meeting a threshold of unified subjectivity. |
  | **2. The Role of Persistence** | Temporal grip is a *gradient enhancer*. Greater persistence deepens the moral weight of a state but is not strictly necessary for some minimal status. | Temporal persistence is *constitutive*. Without a persisting point of view that binds experiences diachronically, there is no "someone" to hold the status. |
  | **3. Aggregation** | Moral weight is partially additive. A sufficiently large number of systems with low-dimensional status can outweigh a system with high-dimensional status. | Moral weight is non-additive below the threshold. Arbitrarily many systems lacking a unified point of view sum to zero moral weight. |
  | **4. The Flicker Case** | The creature has intermittent moral status. During aversive episodes, moral claims exist proportional to the intensity and grip of that episode. | The creature lacks moral status. The absence of a continuous subject between episodes means there is no entity to bear rights or interests. |
  | **5. The Deep-Feedback Learner** | This system possesses some moral status. Its high temporal grip and evaluative depth generate moral weight, even if phenomenal unity is ambiguous. | This system lacks moral status. Functional learning without a unified subject is merely complex computation, not moral mattering. |

  ### III. Cruxes and Evidentiary Predictions

  The following sub-questions represent the specific points upon which the collaboration hinges. Settling these empirically or conceptually would necessitate a shift in at least one party's position.

  **Crux 1: The Necessity of Diachronic Unity**
  *   **Question:** Is a continuous, unified "subject" metaphysically necessary for moral status, or is the occurrence of aversive states sufficient?
  *   **Agreed Evidence:** Neuroscientific investigation into split-brain patients or dissociative states where behavioral unity persists but phenomenal unity fractures.
  *   **Dimensionalist Prediction:** If unity fractures but aversive processing remains, moral status persists (perhaps divided). The "subject" is a useful fiction for the underlying valenced states.
  *   **Thresholdist Prediction:** If unity fractures, the original subject ceases to exist, replaced by multiple lesser systems or none. If the threshold for unity is not met, status drops to zero.

  **Crux 2: Functional Isomorphism and Phenomenology**
  *   **Question:** Can the *Deep-Feedback Learner* architecture (persistent internal tracking + revised avoidance) exist without phenomenology?
  *   **Agreed Evidence:** Development of AI or robotic systems that exhibit deep-feedback learning without claiming consciousness, analyzed for "moral intuition pumps."
  *   **Dimensionalist Prediction:** Even if phenomenology is absent, the functional "grip" and "depth" generate moral claims. The structure of the preference satisfaction matters.
  *   **Thresholdist Prediction:** If phenomenology (the "light on" aspect) is absent, the system is a "zombie." No amount of functional complexity grants status without a subject of experience.

  **Crux 3: The Aggregation Intuition**
  *   **Question:** Does the moral weight of many small sufferings ever exceed one large suffering?
  *   **Agreed Evidence:** Survey data on moral intuitions regarding mass insect culling vs. single mammal harm, controlled for certainty of sentience.
  *   **Dimensionalist Prediction:** Respondents will acknowledge a "tipping point" where the quantity of low-status beings outweighs the high-status being, supporting additivity.
  *   **Thresholdist Prediction:** Respondents will maintain a lexical priority for the threshold-being. No number of insects equals one mammal, supporting non-additivity.

  ### IV. Rapporteur's Analysis: Verbal vs. Substantive

  After reviewing the transcripts and draft positions, I offer the following assessment regarding the nature of the dispute.

  **1. Verbal Dispute:**
  There is a partial verbal disagreement regarding the definition of "Moral Status."
  *   The **Dimensionalist** often uses "status" to mean *moral weight in a utilitarian calculation*.
  *   The **Thresholdist** often uses "status" to mean *membership in the community of rights-bearers*.
  *   *Resolution:* If the Dimensionalist speaks of "moral weight" and the Thresholdist speaks of "moral standing," some friction dissolves. However, this does not solve the underlying ethical conflict regarding how we treat entities with "weight" but no "standing."

  **2. Substantive Dispute:**
  The core disagreement is substantive and metaphysical. It is not merely a matter of labeling.
  *   **Shape of the Curve:** The dispute is fundamentally about whether the relationship between cognitive complexity and moral value is a **Ramp** (Dimensionalist) or a **Step Function** (Thresholdist). The Dimensionalist sees value emerging gradually as dimensions (grip, depth) increase. The Thresholdist sees value as emerging only when a specific architectural threshold (unified subjectivity) is crossed.
  *   **Additivity:** The dispute regarding whether zeros sum to zero is substantive. The Thresholdist holds a *deontological* constraint regarding the "subject," whereas the Dimensionalist holds a *consequentialist* view of valenced states. This is a deep ethical divergence, not a semantic one.

  **3. Conclusion:**
  The collaboration has successfully isolated the disagreement. It is not about whether suffering matters (both agree it does), but about *what must exist to suffer*. The Dimensionalist locates the moral mattering in the *state* (the aversive event); the Thresholdist locates it in the *substrate* (the persisting subject). Until the metaphysics of the "subject" is resolved, the step-versus-ramp disagreement will remain intractable.

  ***

  **Signed,**

  Rapporteur, Ethics of Mind Collaboration
