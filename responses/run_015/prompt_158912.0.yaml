  **OFFICE OF PUBLIC ANNOUNCEMENTS**
  **MANUAL OF EFFECTIVE NOTICE (MEN-7)**
  **EFFECTIVE DATE: 01/04/2024**
  **CLASSIFICATION: PUBLIC (LEVEL-2 CERTIFIED)**

  **§ 1.0 CERTIFICATION OF MUTUAL KNOWLEDGE DEPTH**

  1.1 Pursuant to *State v. Infinite Regress*, legal effect attaches to a notice only if the content thereof constitutes common knowledge among all affected parties. As administrative verification of infinite recursive knowledge states is computationally prohibitive, the Office issues Level-k Certificates of Mutual Knowledge (Form OPA-101k), where *k* denotes the verified depth of recursive awareness.

  1.2 A Level-1 Certificate confirms all parties know the notice. A Level-2 Certificate confirms all parties know that all parties know the notice. Certificates exceeding Level-3 are subject to Inspector General Notice 88-B, which stipulates that a Level-3 Certificate is void *ab initio* for any coordination requiring Level-4 justification. Agents are advised that the private market for forged Level-5 Certificates carries no statutory weight and may trigger audit protocols under § 9.0 (Fraudulent Epistemology).

  **§ 2.0 TRANSMISSION CHANNEL INTEGRITY**

  2.1 In jurisdictions where message delivery is not guaranteed (Lossy Channels), no finite exchange of delivery confirmations suffices to establish common knowledge. Accordingly, any plan requiring simultaneous action—including but not limited to dawn attacks, synchronized fund withdrawals, or coordinated strikes—is deemed void regardless of the number of delivery receipts logged.

  2.2 Parties seeking to validate simultaneous action must utilize an Approved Public Channel (APC). Private channels, however reliable, are classified as merely reliable private ones and cannot sustain the common knowledge requisite for synchronized liability. Failure to utilize an APC for simultaneous action renders all participating parties liable for unsanctioned collusion.

  **§ 3.0 RATIONALITY PRESUPPOSITIONS**

  3.1 All notices presuppose that recipients are rational agents and that this rationality is common knowledge. If a citizen publicly announces an intention to act irrationally, said announcement invalidates every notice pending against said citizen.

  3.2 This invalidation extends to the notice of penalty for publicly announcing an intention to act irrationally. Consequently, an agent cannot be fined for invalidating notices via irrationality claims if the fine itself relies on the rationality presupposition invalidated by the claim. Officers should suspend penalty assessments until rationality is re-established via Form R-RESET.

  **§ 4.0 MARKET LICENSING AND PRIOR DIVERGENCE**

  4.1 Pursuant to Aumannian constraints, parties who share priors and know one another to be rational cannot gain from voluntary exchange. Therefore, traders must file a Prior Divergence Disclosure (Form PD-9) or a Certified Private-Information Claim (Form CPI-4) prior to execution.

  4.2 Trades lacking a filed disclosure are presumed void. The Office assumes that without documented prior divergence, any exchange indicates a failure of common knowledge regarding asset valuation. Inspectors may seize assets traded without Form PD-9 on the grounds that no rational benefit could have existed to justify the transfer.

  **§ 5.0 SETTLEMENT AND POSTERIOR CONSISTENCY**

  5.1 Following any conference regarding disputed notices, parties must file identical posterior probability statements (Form POST-ID). Residual disagreement regarding the probability of any fact contained in the notice is treated as evidence of an undisclosed private prior.

  5.2 Such discrepancy triggers an automatic audit under § 4.2. Parties are advised to reconcile posteriors before filing. Filing divergent statements constitutes a false certification of common knowledge and is punishable by revocation of trading privileges.

  **§ 6.0 Sequential CONTRACTUAL CHAINS**

  6.1 A chain of trusting moves requires common knowledge of rationality to a depth equal to the length of the chain. Contracts exceeding the parties' certified depth (see § 1.2) are voidable at the option of the party furthest from the initial notice.

  6.2 To mitigate this, parties may purchase Bounded-Rationality Riders (Form BRR-7) or Irrationality Insurance (Policy II-∞). Contracts longer than the parties' certified depth lacking such riders are unenforceable. Inspectors shall void any contract clause requiring trust beyond the certified Level-k depth.

  **§ 7.0 PROMULGATION STATUS OF THIS MANUAL**

  7.1 The provisions herein bind all officers and citizens only if the existence of this Manual is common knowledge among them. If any party is unaware of this Manual, or unaware that others are aware, the provisions contained herein do not apply to that party.

  7.2 To certify that this Manual is common knowledge, the Head of Office must file Request for Certification of Manual Status (Form OPA-CK-∞). However, pursuant to § 1.2, no finite certificate can verify the infinite recursive knowledge required to validate this Manual universally. Consequently, Form OPA-CK-∞ cannot validly be filed. Officers shall enforce these provisions assuming compliance, pending the impossible filing of Form OPA-CK-∞.
