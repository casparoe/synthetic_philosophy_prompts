          3.  Russell's primary/secondary scope reinterpreted as choice of assignment/evaluation circumstance.
      *   **Constraints/Advice Received:** Advisors think the pragmatic device is "baroque" and the historical section is a "hostage to fortune." User wants to keep both (to please the historian and avoid looking like mere semantic engineering).
