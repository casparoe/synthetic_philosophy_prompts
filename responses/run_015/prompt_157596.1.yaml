  # The Dutch Book Diagnostic Tree

  **Starting Point:** You accept that the sure-loss construction is mathematically sound (i.e., if credences violate the axioms, a bookie *can* construct a losing package).

  **Instructions:** Answer the following eight questions in order. Skip nodes marked as path-dependent if your previous answers route you elsewhere. Your path terminates at a **Leaf**, which describes your philosophical position.

  ---

  ### Node 1: The Vanishing Bookie (Case a)
  *Scenario:* A bookie offers you the sure-loss package once, while you sleep. You wake up one cent poorer, but you never notice the loss, never learn about the bookie, and suffer no practical consequences.
  **Question:** Is your set of credences defective *even if* the loss is never experienced and has no practical impact on your life?
  *   **No:** Go to **Leaf 1**.
  *   **Yes:** Go to **Node 2**.

  ### Node 2: The Charity Bookie (Case b)
  *Scenario:* The guaranteed "loss" from the bet package is a compulsory donation to a charity you support. You would have donated that exact amount anyway; your utility actually increases because the transaction was forced.
  **Question:** Does the fact that the "loss" benefits you mean your betting quotients were *not* defective?
  *   **Yes:** Go to **Node 2b**.
  *   **No:** Go to **Node 3**. (You hold that the structural defect persists regardless of utility outcomes).

  ### Node 2b: The Source of the Norm (Follow-up to Node 2)
  **Question:** If the betting quotients aren't defective, does the Dutch Book construction establish *any* normative constraint on belief at all?
  *   **No:** Go to **Leaf 2**.
  *   **Yes:** Go to **Leaf 3**. (You view the bets as merely diagnostic of a defect grounded elsewhere, e.g., accuracy).

  ### Node 3: The Two-Sided Bookie (Case c)
  **Question:** To avoid defect, must you be willing to take *both* sides of a bet (buy and sell) at the same price $p$, or is it permissible to have a spread (e.g., buy at 0.4, sell at 0.6)?
  *   **Permissible to Spread:** Go to **Node 5**. (You lean toward Imprecise Credences).
  *   **Must be Same Price:** Go to **Node 4**. (You lean toward Precise Probabilism).

  ### Node 4: The Infinite Bookie (Case d) [Precise Path]
  **Question:** Does coherence require that you avoid sure loss even if the bookie offers you a *countably infinite* set of bets, or is avoiding loss on *finite* sets sufficient?
  *   **Finite Sets Sufficient:** Go to **Leaf 4**.
  *   **Infinite Sets Required:** Go to **Node 6**.

  ### Node 5: The Convexity Check (Case c follow-up) [Imprecise Path]
  **Question:** If you allow a spread between buying and selling prices, must the set of all acceptable prices be *convex* (i.e., if you accept 0.4 and 0.6, must you also accept 0.5)?
  *   **No (Non-Convex):** Go to **Leaf 5**.
  *   **Yes (Convex):** Go to **Leaf 6**.

  ### Node 6: The Memory-Wipe Case (Case f)
  **Question:** Does the norm established by the construction constrain only your *current* credences, or does it also constrain the *rule* you use to update credences when you learn new evidence?
  *   **Current Credences Only:** Go to **Node 7**.
  *   **Constrains Updating Rules:** Go to **Node 8**.

  ### Node 7: The Permissivism Check [Synchronic Path]
  **Question:** If the norm constrains only current credences, does coherence allow *any* probability function (permissivism), or does it require a specific function dictated by logic/evidence (restrictivism)?
  *   **Any Function (Permissive):** Go to **Leaf 7**.
  *   **Specific Function (Restrictive):** Go to **Leaf 8**.

  ### Node 8: The Chance Bookie (Case e) [Diachronic Path]
  **Question:** Does a coherent agent's credence in an event $A$ *must* align with their belief about the objective chance of $A$ (e.g., if Chance($A$) = 0.5, Credence($A$) must be 0.5)?
  *   **No (Coherence Only):** Go to **Leaf 9**.
  *   **Yes (Chance Constraint):** Go to **Leaf 10**.

  ---

  ### The Leaves (Positions)

  **Leaf 1: Pragmatic Defeater**
  *   **Description:** The Dutch Book argument establishes nothing about belief. It only shows that certain betting behaviors lead to actual monetary loss. If the loss is vanishing or irrelevant, there is no defect.
  *   **Conventional Name:** *Radical Pragmatic Skeptic*

  **Leaf 2: Pure Descriptivist**
  *   **Description:** The construction is mathematically valid but normatively empty. It describes a relationship between numbers and bets, but implies no error in belief, even if utility is unaffected.
  *   **Conventional Name:** *Non-Normative Formalist*
  *   **Status:** *Merely Unattractive.* (Few hold that a formal defect in a model of rationality implies no rationality defect).

  **Leaf 3: Accuracy Vindicator**
  *   **Description:** The betting quotients are not defective *because* of the loss, but the loss reveals a defect in accuracy. The bets are diagnostic metaphors; the real norm is minimizing distance from the truth.
  *   **Conventional Name:** *Epistemic Utility Theorist*
  *   **Note:** *Indistinguishable from Leaf 9/10 on this tree.* (Without a node asking directly about accuracy vs. coherence, this view collapses into the Probabilist leaves regarding the final norm).

  **Leaf 4: Finitely Additive Probabilist**
  *   **Description:** Credences must obey the probability axioms for finite sets, but countable additivity is not required. You can have a coherent credence distribution over an infinite space that sums to less than 1.
  *   **Conventional Name:** *De Finetti Probabilist*

  **Leaf 5: Non-Additive Theorist**
  *   **Description:** Credences need not be additive or convex. You can reject the sure-loss construction by denying that acceptable prices must form a convex set (e.g., you reject the midpoint).
  *   **Conventional Name:** *Choquet Capacitist / Non-Additive Bayesian*
  *   **Status:** *Unexplored.* (Most imprecise theorists insist on convexity to avoid money pumps within the spread itself).

  **Leaf 6: Imprecise Probabilist**
  *   **Description:** Credences are represented by a set of probability functions. You avoid sure loss by allowing a spread between buying and selling prices, provided the set is convex.
  *   **Conventional Name:** *Imprecise Probabilist*

  **Leaf 7: Permissive Synchronic Coherentist**
  *   **Description:** You must be probabilistically coherent now, but any coherent prior is rational. Updating is a policy choice, not a belief constraint.
  *   **Conventional Name:** *Subjective Bayesian (Synchronic)*

  **Leaf 8: Restrictive Synchronic Coherentist**
  *   **Description:** You must be probabilistically coherent now, and logic/evidence dictates a unique correct prior. Updating is a policy choice, but the starting point is fixed.
  *   **Conventional Name:** *Objective Bayesian (Synchronic)*

  **Leaf 9: Diachronic Coherentist**
  *   **Description:** You must be coherent now, and you are required to update by Conditionalization. However, your credences need not track objective chances, only internal consistency.
  *   **Conventional Name:** *Dynamic Coherentist*

  **Leaf 10: Principal Principle Adherent**
  *   **Description:** You must be coherent, update by Conditionalization, *and* your credences must defer to known objective chances.
  *   **Conventional Name:** *Lewisian Humean*
  *   **Note:** *Indistinguishable from Leaf 9 on this tree.* (If one accepts Diachronic Coherence, the Chance constraint is often seen as an add-on rather than a separate vindication source via Dutch Book).

  ---

  ### Unoccupied or Problematic Combinations

  *   **Imprecise + Countable Additivity:** (Not a leaf above). *Incoherent.* (Standard definitions of imprecise probabilities rely on sets of measures; requiring countable additivity for the whole set creates measure-theoretic pathologies most theorists avoid).
  *   **Diachronic Norm + No Synchronic Norm:** (Routed out by Node 6). *Incoherent.* (One cannot constrain updating rules without constraining the states being updated).
  *   **Leaf 3 (Accuracy) vs Leaf 9/10 (Coherence):** *Indistinguishable.* (This tree uses Dutch Book cases. Accuracy vindications often yield the same probabilistic norms as DB arguments; separating them requires a node about "truth-connection" rather than "loss-avoidance").

  ### Study Group Usage Guide
  1.  **Run the Tree:** Have each member answer Nodes 1–8 individually.
  2.  **Compare Leaves:** If two members land on Leaf 9 but argue, check if one is actually a Leaf 3 (Accuracy) in disguise.
  3.  **Check the "Vanishing" Split:** If half the group is at Leaf 1 and half at Leaf 4+, your disagreement is not about probability, but about whether epistemology is normative.
  4.  **Check the "Charity" Split:** If you fracture at Node 2, you are debating whether credences are *defined* by bets (Constitutive) or merely *measured* by them (Diagnostic).
