          *   *Reply:* We aren't justifying the train running; we're pricing the seat.
          *   *Soft Spot:* Doesn't address the normative force of *why* we should buy the ticket.

      *   *Objection 3 (Imprecise Prob - Medium/High Damage):* Attacks the precision of the "exchange rate."
          *   *Phrasing:* "Your 'exchange rate' is a precise prior in disguise."
