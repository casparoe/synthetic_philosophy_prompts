          *   *Soft Spot:* "Robust" might still imply a set of priors that is too specific.

      *   *Objection 4 (Bayesian - Medium Damage):* Priors and Updating.
          *   *Phrasing:* "If the structure is 'cheap,' why does prior choice matter so much in small data regimes?"
          *   *Reply:* Cheap doesn't mean zero. Small data is exactly where the budget matters.
          *   *Soft Spot:* Admits the "concentration" might be asymptotic, not immediate.

      *   *Objection 5 (The "Hope Nobody Asks" - Critical):* User suspects it's about the basis. I need to confirm if there's something worse.
          *   *Analysis:* The user's guess (basis selection) is strong. But the *meta-inductive* worry is worse. To claim the exchange rate is concentrated *here* is itself an inductive claim.
          *   *Decision:* The user's guess is correct, but the *meta* version is sharper. "You're using induction to justify the price of induction."

      *   *Objection 6 (General/Methodological):* "Cheap" is vague.
          *   *Phrasing:* "What is the currency? Kolmogorov complexity? Physical entropy?"
          *   *Reply:* Invariance across measures.
          *   *Soft Spot:* Invariance theorems have constants that might matter.

      *   *Objection 7 (Humean/Pragmatic):* "Midnight" worry.
