prompt: |-
  I'm a novelist, mostly historical stuff, and I keep hearing that LLMs are just 'stochastic parrots' whenever writing and AI comes up. At a festival Q&A last week I asked whether a model that can pick up my narrator's sly, withholding tone and then carry my favourite minor character's grudge consistently for three hundred pages — and then land a betrayal scene I hadn't plotted but that feels dead right for her — is doing something a bit more than shuffling words, and some bloke in the second row just said it's a stochastic parrot, as if that settled it.

  Could you seperate out the different precise claims that line could actually be making, from the boringly true to the properly radical? For each one say if it's actually true, and whether it would even do the job he wanted — shutting down my question. I just want a plain list I can keep in my head for the next panel, and a steer on which reading people usually mean when they use it as a mic-drop.
