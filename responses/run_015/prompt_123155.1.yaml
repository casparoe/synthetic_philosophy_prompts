answer: |-
  A colloidal particle is confined in a symmetric double-well optical potential immersed in a water bath at 300 K, where the left and right wells represent logical states 0 and 1 with equal equilibrium probability. A physical demon, realized as a feedback-controlled electro-optic circuit, couples to the particle's position via a capacitive sensor that reports the well occupancy with a symmetric error rate $\epsilon = 0.1$, meaning the reported bit $Y$ matches the true bit $X$ with probability $0.9$. Upon receiving $Y$, the demon tilts the potential to lower the energy of the reported well, allowing the particle to relax and extract work, before restoring the potential symmetry to reset the particle's distribution without further energy exchange. The demon's internal register is cleared after each operation, but the measurement outcome $Y$ is irreversibly written to a fresh bit on a physical tape of molecular switches, initially prepared in a pure '0' state, which advances by one bit per cycle; the tape is finite (1 Megabit), and when full, the device halts, requiring external intervention to reset the medium.

  **1. Numerical Verification**
  At $T=300$ K, $kT \ln 2 \approx 2.87 \times 10^{-21}$ J.
  *   **Work Extracted:** The maximum work extractable via feedback with mutual information $I$ is $W = kT \ln 2 \cdot I$. With $\epsilon = 0.1$, the binary entropy is $H_2(0.1) \approx 0.469$ bits. Since the input $X$ is uniform (1 bit), $I = 1 - H_2(0.1) = 0.531$ bits. Thus, $W = 0.531 \times 2.87 \times 10^{-21} \text{ J} \approx 1.52 \times 10^{-21}$ J.
  *   **Bits Written:** 1 bit per cycle.
  *   **Shannon Entropy of Record:** The output $Y$ is uniform (marginal probability 0.5 for 0 or 1 due to symmetric error and input), so $H(Y) = 1.0$ bit.
  *   **Mutual Information:** $I(X:Y) = 0.531$ bits (checked against $1 - H_2(\epsilon)$).

  **2. Three Ledgers (in units of $kT \ln 2$)**
  *   **(a) Erasure Ledger:** Counts bits reset to blank. Here, the tape is written, not erased. The demon's internal register is reset, but we assume this is done reversibly or accounted as part of the device's static state. Bits erased = 0. Cost = 0. Net Gain = +0.531. *Verdict: Apparent violation.*
  *   **(b) Feedback Ledger:** Bounds work by acquired mutual information. Gain = +0.531 (Work). Cost = 0.531 (Information value). The compensation occurs in the **record's noise**: the tape entropy increases by $H(Y) = 1.0$, but only $I = 0.531$ is useful correlation. The difference $\Delta S_{noise} = H(Y) - I = 0.469$ is the measurement noise physically stored on the tape. This entropy accumulation satisfies the Second Law locally without heat dissipation to the bath during the write.
  *   **(c) Resource Ledger:** Treats the blank tape as fuel. Initial tape entropy = 0. Final tape entropy = 1.0. $\Delta S_{medium} = 1.0$. Work bound $W \le T \Delta S_{medium} \Rightarrow 0.531 \le 1.0$. *Verdict: Compliant.* The agent who must pay to restore the medium is the external operator who must erase the full tape to reuse it, costing $1.0 \, kT \ln 2$ per bit.

  **3. Structural Feature and Collapse**
  The structural feature doing the work is the **consumption of low-entropy memory** (the blank tape). If this feature is removed by forcing the tape bit to be reset to '0' at the end of each cycle (making the memory cyclic rather than consumable), the Erasure Ledger immediately registers a cost of $1.0 \, kT \ln 2$ per bit. Since the work gain is only $0.531 \, kT \ln 2$, the net balance becomes $-0.469 \, kT \ln 2$. Similarly, if the medium is recycled inside the device without external input, the internal erasure cost dominates the work gain. In both collapsed cases, all three ledgers converge on the same negative net balance, proving the positive work in the primary case relied entirely on the entropy gradient of the fresh tape, not a violation of thermodynamics.

  **4. Defense of the Erasure Ledger**
  A defender of the erasure ledger argues: "Writing to a blank medium is merely erasure deferred. The $kT \ln 2$ cost is not absent; it is prepaid during the manufacture of the blank tape or postpaid during its reset. To close the global cycle, the tape must eventually be erased, at which point the debt comes due." This reply is a **relocation of the system boundary**, not a refutation of the accounting. It establishes that erasure is not the *unique* physical locus of the cost, but rather the specific process required to *recycle* the resource. Your case establishes that the fundamental cost is **entropy production**, which can be paid by consuming a low-entropy resource (the tape) just as easily as by dissipating heat during erasure. Erasure is simply the name we give to the entropy-producing step when we insist on reusing the same memory; if we treat memory as fuel, the cost appears as resource depletion rather than heat dissipation.
