      *   Actually, Balaguer's view is that we describe a structure, and that structure exists. So if we describe "standard arithmetic," it exists.
      *   The problem is: Why did nature "choose" to instantiate *that* structure?
      *   IA says: Because that structure is real and causally/explanatorily relevant.
      *   Plenitude says: All structures are real. Nature's instantiation is the mystery, not the math's existence.
      *   This shifts the metaphysical burden. It makes the *application* of math the miracle, not the *existence* of math.
      *   But the bigger conflict is (3) vs (6). Balaguer ( Plenitude) is a Multiversist about sets. The user is a Uniquist. This is a hard contradiction.

