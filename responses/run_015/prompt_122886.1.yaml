      *   **Tension D: Selection Effect (7) vs. Indispensability (1).**
          *   *Analysis:* User suspects these don't conflict.
          *   *Argument:* (1) says math is real because it explains. (7) says we pick math that fits. If we just pick what fits, does that undermine the "no miracles" claim? Not necessarily. We pick what fits *because* it tracks reality. However, combined with (3) (Plenitude), (7) becomes very strong. If all math exists, *of course* we find some that fits. This weakens (1).
