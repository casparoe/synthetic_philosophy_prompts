      *   But (3) vs (6) is clearer.

  10. **Final Decision:** The primary recommendation must be to abandon (3). It is incompatible with (6) and undermines the specific explanatory force required by (1) and (5). The cost is reopening the Access Problem, but that is a better price than logical inconsistency.

