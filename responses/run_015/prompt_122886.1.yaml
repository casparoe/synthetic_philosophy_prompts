          *   *Deep Conflict:* IA aims to justify belief in *specific* mathematical entities because they are indispensable. Plenitudinous Platonism says *everything* exists regardless of indispensability. If everything exists, the "no miracles" argument loses its bite regarding *which* math is true. It makes the ontology too cheap, potentially clashing with (8) (Anti-Deflationism), but more importantly, it undermines the *explanatory* link in (1) and (5). If all structures exist, the physical world's selection of one structure needs explaining, not the existence of the structure itself.
