          2.  The Fatal Conflict (3 vs 6).
          3.  The Explanatory Conflict (3 vs 1 & 5).
          4.  Addressing Suspicions (7 vs 1, 2 vs Determinacy).
          5.  The Prescription (What to drop, what it costs).

