          *   *Nuance:* Does it *presuppose* belief is *really* graded? Or just that reporting it as such is useful? Strictly, it only presupposes the *methodology* works, not the ontology. But functionally, it treats credence as the currency of truth-tracking.

      *   **Point 2: The Dutch Book Transfer (Pragmatic to Epistemic).**
          *   *The Argument:* DBA says incoherence = sure loss. Tournaments say bad score = reputational loss.
