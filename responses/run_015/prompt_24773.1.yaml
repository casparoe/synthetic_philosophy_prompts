          *   *What does the work?* The "properness" of the scoring rule. It aligns the incentive structure.
          *   *Critique:* A reputational loss isn't a logical contradiction. The transfer relies on the assumption that *epistemic virtue is akin to financial solvency*. This is a pragmatic justification for an epistemic norm.

      *   **Point 3: Coherence vs. Accuracy (The Bridge).**
          *   *The Problem:* Coherence (axioms) doesn't guarantee Accuracy (truth). The 0.5 forecaster is coherent but inaccurate.
          *   *The Bridge:* Proper Scoring Rules *reward* accuracy *conditional* on coherence.
          *   *Presupposition:* The practice presupposes that *calibration and resolution* (components of Brier score) are the metrics of rationality. It assumes a *Veritistic* goal (Goldman).
          *   *What bridges it?* The assumption that the world has structure that can be probabilistically modeled. It presupposes *aleatory uncertainty* or at least *epistemic uncertainty that behaves like probability*.
