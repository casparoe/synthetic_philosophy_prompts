      *   *Crucial Distinction:* The DBA justifies *coherence*. Scoring rules justify *accuracy*. The practice combines them. I need to highlight that tension. The prompt notes: "classical Dutch book argument establishes coherence... but the tournament rewards accuracy." I must explain how the practice conflates or bridges these. The bridge is the *Proper Scoring Rule* itself, which makes coherence a necessary condition for maximizing accuracy.

