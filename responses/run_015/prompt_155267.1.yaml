  # THE INTUITION VALIDATION TREE
  **Start:** Some studies report cross-cultural differences in responses to these vignettes.

  **Q1. (Method)** Suppose the same comparison is rerun with a comprehension check and a forced-choice format instead of an agree/disagree rating, and the difference shrinks or disappears.
  *   **YES** → **LEAF 1: It's a measurement artifact and the underlying competence is the same.**
      *   *Awkward Commitment:* We fought over calibration errors, not truth.
  *   **NO** → Go to Q2.

  **Q2. (Matrix Effect)** Suppose we analyze whether the words in the two languages are doing the same job for the two groups. Are they equivalent?
  *   **NO** → Go to Q3.
  *   **YES** → Go to Q4.

  **Q3. (Concept Status)** Suppose the concepts differ. Is one usage defective or just different?
  *   **DEFECTIVE** → **LEAF 2: The two groups are deploying different concepts, so there is no single thing being theorized about.**
      *   *Awkward Commitment:* They aren't disagreeing, they're speaking past us.
  *   **DIFFERENT** → **LEAF 3: (Unnamed) Both concepts are valid ways to carve the world.**
      *   *Awkward Commitment:* Truth is relative to linguistic scheme.

  **Q4. (Specificity)** Suppose the difference survives for one of the four cases but not the others. Is it case-specific?
  *   **YES** → **LEAF 4: The variation is itself a datum a good theory of the thing should predict.**
      *   *Awkward Commitment:* The theory survives, but must explain the glitch.
  *   **NO** → Go to Q5.

  **Q5. (Expertise)** Suppose the difference persists even among people trained in the relevant subject. Does it persist?
  *   **NO** → **LEAF 5: Restrict to the intuitions of people whose intuitions are properly reliable or calibrated.**
      *   *Awkward Commitment:* Philosophy is for the trained, not the public.
  *   **YES** → Go to Q6.

  **Q6. (Threshold)** Suppose we ask whether respondents disagree about the case itself or about how much evidence is enough / how bad it would be to wrongly call something knowledge. Is it about evidence/cost?
  *   **YES** → **LEAF 6: The variation is real but is variation in the respondent's implicit error-cost settings rather than in the concept.**
      *   *Awkward Commitment:* They agree on the world, disagree on the risk of saying so.
  *   **NO** → Go to Q7.

  **Q7. (Theory Dependence)** Suppose we ask if the philosophical theory actually requires these specific pre-theoretical judgments. Does it?
  *   **NO** → **LEAF 7: Philosophy doesn't actually rest on intuitions in the first place.**
      *   *Awkward Commitment:* Philosophy is disconnected from common sense.
  *   **YES** → **LEAF 8: The variation is in the underlying judgment and so discredits intuitions as evidence.**
      *   *Awkward Commitment:* The foundation is cracked; the building falls.

  ***

  ### UNOCCUPIED COMBINATIONS
  1.  **Artifact + Discredits:** (Incoherent) If the difference is just noise, it cannot discredit the underlying competence.
  2.  **Different Concepts + Restrictionism:** (Unattractive) If the concepts differ fundamentally, training cannot calibrate one group to the other without changing the subject.

  ### INDISTINGUISHABLE LEAVES
  **Leaf 2 (Different Concepts) vs. Leaf 3 (Both Valid):** Both claim the groups mean different things.
  **Separating Question:** "Is there a fact of the matter about which concept is 'correct' for philosophy?" (Leaf 2 says yes/one fails; Leaf 3 says no/both pass).
