answer: |-
  The pencil wears a groove in the hand.
  I seek a line that is not just a copy.
  The room holds breath for the entering voice.
  She stood still for the painter's quiet model.
  What do we owe the dead for inheritance?
  Count up the scraps laid out as remainder.

  The light fails on the pile of remainder.
  Guided by the slow muscle of the hand.
  Nothing here but a second, clean copy.
  Raised in anger or a singing voice.
  Following the pattern of the model.
  A debt unpaid is a bad inheritance.

  The law decides the shape of inheritance.
  Taken from the division of remainder.
  Signed at the bottom by the right hand.
  True to the source, a perfect copy.
  Silenced now, the formerly absent voice.
  Breaking the pose of the standing model.

  Who knows the burden of the standing model?
  Dividing up the spiritual inheritance.
  Grief is the only honest remainder.
  It slips through the fingers of the hand.
  More than a shadow, more than a copy.
  It demands the full weight of a voice.

  Where does the trembling settle in the voice?
  Not in the marble skin of the model.
  But in the spending of our inheritance.
  What survives is not the clean remainder.
  It is the callus on the working hand.
  That proves the life behind the copy.

  Time will tell the worth of any copy.
  The silence settles after such a voice.
  We are not the pattern nor the model.
  Spending fast our only inheritance.
  There is nothing left as remainder.
  Save the warmth remaining in the hand.

  If the hand knows the making, copy lives.
  If the voice breaks, then the model dies.
  Inheritance is loss; the remainder, love.

  ***

  **Note on the Poem**

  This poem commits Miriam to the claim that aesthetic value is inseparable from the *cost* of production—specifically, the somatic and emotional expenditure ("callus," "tremor," "grief") that accompanies human making. She concedes that the procedure (the sestina's rotation) is mechanical and that the "inheritance test" (transmissible novelty) might be passed by the system, but she argues that the *origin* of the move matters. The poem asserts that context accumulates meaning; the words change because a life has been spent to place them there.

  An aesthetics scholar would object that this conflates moral biography with aesthetic function. If the output teaches a new move (passing Levon's test), the pain behind it is irrelevant to the recipient. The poem risks romantic essentialism: it asserts a "warmth" in the hand that cannot be demonstrated in the text itself, relying on the reader's prejudice rather than the work's internal evidence. Miriam claims the "remainder" is love, but the poem offers no proof that the system's remainder isn't also love, merely distributed differently.
