prompt: |-
  I lead the risk-analysis team at a public infrastructure agency. Four times a year we issue a risk register to our board: sixty to ninety one-off, non-repeatable future events, each of which we are currently required to score with a single probability and a one-paragraph rationale. The board allocates capital from those numbers, and the audit office reviews our files afterwards, so every entry has to be defensible on paper by a non-specialist.

  Some of these entries, I am fairly confident, are not the sort of thing that has a probability — and not merely because our evidence is thin. My analysts collapse at least three different situations into a single "we don't know": that there is as yet no fact of the matter whether the event will occur; that there is a fact of the matter, or at least a stable chance, but we have no usable way to estimate it; and that the sentence on the register does not pick out a definite event at all (the extension is operational by 2029 — first passenger train? full timetable? signed-off safety case?). They also score our own future decisions — whether we will apply for the licence, whether we will close the tunnel — exactly as they score rainfall, and when they decline to give a number they enter 50%, which then propagates through the portfolio model as though it were an estimate.

  Please write a decision procedure my team can run on a candidate entry in about ten minutes, grounded in what the philosophical literature on future contingents — the classical case of tomorrow's sea battle and the debates that grew out of it — actually supports, keeping the distinctions that matter for practice and dropping the rest. It should: force those three situations apart, and tell me honestly which of them the theory distinguishes and which only our own practice distinguishes; require a settlement condition — a specifiable check, by a stated date, that will settle whether the event occurred — before any number is issued; handle the difference between forecasting an outcome and scoring a decision of ours that partly determines it; say what replaces the 50% placeholder for an entry marked open, both for the decision itself and for how that item behaves downstream inside an aggregate model; and mark plainly the points where the procedure is really a judgement about our risk appetite rather than a consequence of the theory.

  Then run it on three entries from our current draft: a category 3 or stronger cyclone makes landfall within 50 km of the port during the coming season; the regulator revokes our operating licence within eighteen months; the Northern Link rail extension is operational by 2029. I expect it to tell me something I do not want to hear on at least one of them, since the board will not accept a blank, so say what a defensible refusal looks like on the page. Finally, tell me where the procedure will misfire — in particular, whether any of this can be told apart, in practice, from ordinary uncertainty about the evidence.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **User Role:** Lead of risk-analysis team at a public infrastructure agency.
      *   **Context:** Quarterly risk register for the Board (60-90 one-off, non-repeatable future events). Scores drive capital allocation. Audits require defensibility by non-specialists.
      *   **Problem:** Analysts conflate three distinct epistemic states under "we don't know" (no fact of the matter, fact exists but unknown, event ill-defined). They treat internal decisions like external events (rainfall). They use 50% as a placeholder for ignorance, which distorts models.
      *   **Task:** Write a 10-minute decision procedure grounded in the philosophical literature on *future contingents* (Aristotle's sea battle, etc.).
      *   **Requirements:**
          1.  Distinguish the three situations (no fact, unknown fact, ill-defined event).
          2.  Identify which distinctions are theoretical vs. practical.
          3.  Require a "settlement condition" (checkable by a date) before scoring.
          4.  Handle the difference between forecasting outcomes vs. scoring internal decisions.
          5.  Replace the 50% placeholder for "open" entries (both for the decision and downstream modeling).
          6.  Mark where the procedure reflects *risk appetite* rather than *theory*.
          7.  Run the procedure on three specific draft entries (Cyclone, Licence Revocation, Rail Extension).
          8.  Deliver unwelcome truths (defensible refusal).
          9.  Identify where the procedure might misfire (distinguishing from ordinary evidence uncertainty).

  2.  **Philosophical Grounding (Future Contingents):**

      *   *Core Issue:* Do statements about the future have a truth value *now*?
      *   *Aristotle (De Interpretatione, Ch. 9):* The "Sea Battle." If it's true now that there will be a battle, it's necessary. If false, it's impossible. To preserve contingency (free will/chance), Aristotle suggests such statements are neither true nor false *yet*.
      *   *Ockham/Lewis:* Branching time. Many futures are possible. The "actual" future isn't settled until it happens.
      *   *Key Distinction for Risk:*
          1.  *Aleatory Uncertainty (Chance):* The event is well-defined, the mechanism is stochastic (e.g., radioactive decay, weather). Probability applies.
          2.  *Epistemic Uncertainty (Ignorance):* The event is determined or will be, but we lack info. Probability represents belief (Bayesian).
          3.  *Ontological Indeterminacy (No Fact):* The event depends on free choices not yet made (including ours). Assigning a probability reifies a non-existent fact.
          4.  *Semantic Indeterminacy (Ill-defined):* The event description is vague. No truth condition exists.
      *   *Relevance to User:* The user's analysts are treating Ontological and Semantic issues as Epistemic ones (assigning 50%).

  3.  **Drafting the Decision Procedure (The "Contingency Filter"):**

      *   *Time Limit:* Needs to be fast (10 mins).
      *   *Step 1: Semantic Clarity (The "Truth Condition").* Can we verify this yes/no by Date X? If no -> Ill-defined.
      *   *Step 2: Agency Check.* Is this outcome significantly determined by *our* future intentional action? If yes -> Decision, not Risk.
      *   *Step 3: Fact of the Matter.* Is the causal chain already set in motion independent of us? (e.g., weather vs. legislation).
      *   *Handling the 50%:* Replace with "Open/Unscored." In models, treat as a *scenario branch* or *sensitivity bound*, not a weighted probability.
      *   *Risk Appetite vs. Theory:* Theory says "don't score." Practice says "Board needs a number." The compromise is marking it as "Management Action Required" rather than "Risk Probability."

  4.  **Running the Procedure on the Three Entries:**

      *   *Entry 1: Cyclone.* External, stochastic, well-defined (meteorological data). *Verdict:* Scoreable.
      *   *Entry 2: Licence Revocation.* External agent (Regulator), but depends on *our* compliance (internal). It's a reaction to us. *Verdict:* Borderline. Depends on if we view compliance as fixed or variable. Usually treated as risk, but philosophically it's a feedback loop.
      *   *Entry 3: Rail Extension Operational.* Internal project. Depends on *our* decisions, funding, construction. *Verdict:* Not a risk event. It's a plan/target. Scoring it as a risk is category error.

      *   *Unwelcome Truth:* The Rail Extension shouldn't be on the risk register as a probabilistic event. It's a project milestone. The Licence Revocation is partially self-inflicted, requiring a different framing (Compliance Status vs. Risk).

  5.  **Addressing the "Defensible Refusal":**

      *   If the Board demands a number for the Rail Extension, how do we say "No" defensibly?
      *   *Argument:* "Probability implies uncertainty about nature/fate. This is uncertainty about *our own execution*. We report this via Project Assurance/Confidence Levels, not Risk Probability. Mixing them corrupts the capital model."
      *   *Audit Trail:* Document the semantic indeterminacy.

  6.  **Addressing the "Misfire" (Theory vs. Evidence):**

      *   Can we really tell the difference between "no fact of the matter" and "we just don't know the facts"?
      *   *Hard Truth:* In practice, often no. Determinism vs. Indeterminism is metaphysical.
      *   *Pragmatic Fix:* Focus on *control* and *verification*. If we control it, it's a plan. If we can't verify it, it's vague. If it's external and stochastic, it's a risk.

  7.  **Refining the Output Structure:**

      *   **Introduction:** Acknowledge the philosophical weight (Aristotle/Sea Battle) but keep it pragmatic.
      *   **The Procedure (The "Settlement Test"):** Step-by-step flow.
      *   **The 50% Replacement:** Specific instructions for the model.
      *   **Risk Appetite Markers:** Explicitly call out where policy overrides logic.
      *   **Application to Draft Entries:** The hard truths.
      *   **Defensible Refusal:** Template for the Board.
      *   **Limitations:** Where the theory breaks down in practice.

  8.  **Self-Correction/Review during drafting:**

      *   *Critique:* Is this too academic?
      *   *Fix:* Use plain language. Instead of "Ontological Indeterminacy," use "No Fact Yet."
      *   *Critique:* The user asked to distinguish the three situations analysts conflate.
      *   *Fix:* Ensure Step 1 and Step 2 of the procedure explicitly separate "Vague Definition," "Internal Decision," and "External Unknown."
      *   *Critique:* The user asked about the 50% placeholder in the aggregate model.
      *   *Fix:* Specify that "Open" items are excluded from Expected Value calculations and treated as "Scenario Triggers."
      *   *Critique:* Did I address the "fact of the matter" vs. "no usable way to estimate"?
      *   *Fix:* This is the hardest philosophical distinction (Epistemic vs. Aleatory). I need to be honest that practice often collapses these, but the procedure should flag "Deep Uncertainty" vs. "Calculable Risk."

  9.  **Final Polish:** Check tone. Needs to be authoritative, precise, and respectful of the audit constraints. (Ensure the distinction between *risk* and *uncertainty* à la Knight is implied but grounded in the Future Contingents request).

      *(Self-Correction on Philosophy)*: The prompt specifically asks for grounding in *future contingents* (Aristotle/Sea Battle). I must ensure I don't just drift into standard Risk Management (ISO 31000) but keep the logical status of the proposition central. The key insight from Aristotle is that *bivalence* (true/false) does not apply to all future statements.

      *Revised Plan for Procedure:*
      1.  **Settlement Test:** Is there a verification method? (Addresses "ill-defined").
      2.  **Agency Test:** Is the truth value dependent on our unrevealed choice? (Addresses "internal decision").
      3.  **Fixity Test:** Is the causal chain independent of us? (Addresses "no fact" vs "unknown fact").

      *Wait, one nuance:* The prompt asks to distinguish:
      1. No fact of the matter (Ontological).
      2. Fact exists/stable chance, but no way to estimate (Epistemic/Deep Uncertainty).
      3. Sentence doesn't pick out definite event (Semantic).

      My procedure must explicitly route these to different buckets.

      *Let's write.*
answer: |-
  ### The Settlement Test: A Decision Procedure for Future Contingents

  **Purpose:** To determine whether a candidate risk entry describes a proposition capable of bearing a probability score, or whether it is a planning target, a vague description, or an open decision.
  **Time:** 10 minutes per entry.
  **Philosophical Ground:** Aristotelian bivalence (does the statement have a truth value *now*?) and the distinction between *prediction* (external) and *intention* (internal).

  ---

  #### Part 1: The Three-Step Filter

  **Step 1: The Semantic Settlement (The "Vagueness" Check)**
  *Ask:* Can we specify a verification method and a date by which a neutral auditor could definitively mark this entry **True** or **False**?
  *   **Yes:** Proceed to Step 2.
  *   **No:** **STOP.** This is a *Semantic Indeterminacy*. The sentence does not describe an event; it describes a concept.
      *   *Action:* Rewrite the entry until it passes, or remove it.
      *   *Theory vs. Practice:* Theory says this has no truth value. Practice says this is a drafting error.

  **Step 2: The Agency Settlement (The "Sea Battle" Check)**
  *Ask:* Is the truth of this proposition significantly determined by a deliberate choice *this agency* has not yet made?
  *   **No (External):** The outcome depends on nature, markets, or other agents acting independently of us. Proceed to Step 3.
      *   *Theory:* This is a standard *future contingent*. A fact of the matter may or may not exist, but it is not up to us.
  *   **Yes (Internal):** The outcome depends on whether *we* choose to do X.
      *   *Action:* **STOP.** This is not a risk; it is an *unmade decision*.
      *   *Theory:* Assigning a probability here treats a free choice as a causal necessity. It reifies a non-existent fact.
      *   *Practice:* Move this to the "Strategic Decisions Pending" log. Do not score it.

  **Step 3: The Epistemic Settlement (The "Evidence" Check)**
  *Ask:* Is there a stable causal mechanism generating this outcome (e.g., physics, law, contract), even if we lack data?
  *   **Yes:** This is *Epistemic Uncertainty*. We can estimate a probability (with confidence intervals).
  *   **No:** The outcome depends on novel, non-repeatable dynamics with no reference class (e.g., a specific geopolitical rupture).
      *   *Action:* Mark as **Deep Uncertainty**. Do not assign a single number.
      *   *Theory:* Distinguishes "unknown fact" from "no fact."
      *   *Practice:* Distinguishes "calculable risk" from "unquantifiable uncertainty."

  ---

  #### Part 2: Handling the "Open" Entry

  If an entry fails Step 2 (Internal Decision) or Step 3 (Deep Uncertainty), it cannot carry a probability.

  **1. The Replacement for 50%**
  *   **Label:** `OPEN / UNSCORED`
  *   **Rationale:** "Probability implies a settled distribution. This entry represents a branch in the decision tree, not a roll of the dice."
  *   **Audit Defense:** "Assigning 50% implies we believe the event is as likely as not based on evidence. We have no evidence. 50% is a mathematical placeholder, not an epistemic state."

  **2. Downstream Model Behavior**
  *   **Current Practice:** 50% enters the Monte Carlo simulation, diluting the portfolio risk profile.
  *   **New Practice:** `OPEN` entries are excluded from Expected Value (EV) calculations. They are treated as **Scenario Triggers**.
      *   *Instruction:* Run the portfolio model twice: once assuming the event occurs (100%), once assuming it does not (0%). Report the *variance* in capital requirement to the Board.
      *   *Why:* This forces the Board to see the *exposure* rather than a smoothed average that hides the cliff-edge.

  ---

  #### Part 3: Where Judgement Replaces Theory

  The philosophy tells you when *not* to score. It does not tell you what to do when the Board demands a number. The following are **Risk Appetite** judgements, not theoretical truths:

  1.  **The "Internal Decision" Override:** If leadership insists on scoring an internal decision (Step 2 failure), you must label it **"Execution Confidence"** rather than "Probability of Occurrence." This signals that the number reflects *our competence*, not *external fate*.
  2.  **The "Deep Uncertainty" Override:** If leadership insists on a number for Deep Uncertainty (Step 3 failure), you must attach a **Confidence Weight** (e.g., "Probability: 20% [Low Confidence]"). This prevents the audit office from treating it as hard data.

  ---

  ### Application to Current Draft Entries

  Here is the procedure applied to your three examples.

  #### 1. "A category 3 or stronger cyclone makes landfall within 50 km of the port during the coming season."
  *   **Step 1 (Semantic):** Pass. Bureau of Meteorology data defines category and landfall. Date: End of season.
  *   **Step 2 (Agency):** Pass. We do not control the weather.
  *   **Step 3 (Epistemic):** Pass. Stable causal mechanism (meteorology) with historical reference class.
  *   **Verdict:** **Scoreable.**
  *   **Note:** This is a genuine risk. The probability reflects aleatory uncertainty (chance).

  #### 2. "The regulator revokes our operating licence within eighteen months."
  *   **Step 1 (Semantic):** Pass. Gazette notice of revocation. Date: T+18 months.
  *   **Step 2 (Agency):** **FAIL.**
      *   *Analysis:* Regulators do not revoke licences randomly (like rain). They revoke based on compliance. Compliance is largely within our control. This is not a "contingent" event; it is a *consequence* of our own unrevealed decisions.
      *   *Theory:* Treating this as a risk event externalizes our own agency. It suggests the licence might be "taken" rather than "forfeited."
  *   **Verdict:** **Do Not Score as Risk.**
  *   **Action:** Move to "Compliance Obligations." Report status as Green/Amber/Red. If you must keep it on the register, label it **"Control Failure Probability"** and link it to specific compliance milestones, not external chance.

  #### 3. "The Northern Link rail extension is operational by 2029."
  *   **Step 1 (Semantic):** **FAIL.**
      *   *Analysis:* "Operational" is vague (see your prompt: first train? full timetable?).
      *   *Fix:* Define "Operational" (e.g., "Certificate of Practical Completion issued").
      *   *Step 2 (Agency):* **FAIL.**
      *   *Analysis:* This is a project deliverable. Whether it happens depends on *our* funding, *our* construction management, and *our* decisions. It is not a future contingent; it is a **plan**.
      *   *Theory:* Scoring this as a risk is a category error. It is like scoring a 50% probability on "We will choose to breathe tomorrow." It conflates *capability* with *probability*.
  *   **Verdict:** **Remove from Risk Register.**
  *   **Action:** This belongs in the Capital Works Program. Report "Schedule Confidence" (e.g., P50/P80 completion dates), not "Risk Probability."

  ---

  ### The Unwelcome Truth & Defensible Refusal

  **The Truth:** Entry #3 (Northern Link) is currently corrupting your capital model. By assigning it a probability (even implicitly), you are treating your own execution capability as an external hazard. This allows project managers to hide poor planning behind "risk factors."

  **The Defensible Refusal (For the Board Paper):**
  > "Item 3 (Northern Link) has been classified as **Unscored / Planning Target**.
  >
  > **Rationale:** Probability scoring applies to events outside the agency's direct control (e.g., weather, market shifts). The completion of the Northern Link is determined by internal resourcing and management decisions. Assigning a probability to our own planned execution conflates *risk* with *performance*.
  >
  > **Audit Note:** Per the Settlement Test, no external verification exists until the project is complete. To assign a number now would be to speculate on our own future intentions rather than assess external threat.
  >
  > **Alternative:** Schedule confidence is reported separately in the Capital Works Dashboard (Appendix B). Including it here would double-count uncertainty."

  If the Board insists: "Mark as **Execution Confidence (P80)** and exclude from the External Risk Aggregate."

  ---

  ### Where the Procedure Will Misfire

  You asked where this cannot be told apart from ordinary uncertainty about evidence.

  **1. The "Other Agent" Problem (Entry #2)**
  The procedure treats the Regulator as "Us" (Agency) because their action depends on our compliance. But the Regulator is also an external agent with their own free will (political will, budget cuts).
  *   *The Misfire:* Is a licence revocation due to *our* non-compliance (Internal) or due to a *political purge* (External)?
  *   *Reality:* You cannot distinguish these cleanly in advance.
  *   *Fix:* Split the entry.
      *   A: "Licence revoked due to compliance failure" (Internal/Control).
      *   B: "Licence revoked due to legislative change" (External/Risk).
      *   If you cannot split them, default to **Internal**. It is better to assume control and be wrong than to assume fate and be passive.

  **2. The "No Fact" vs. "Unknown Fact" (Step 3)**
  Philosophically, is there a fact of the matter about a unique geopolitical event *now*? Determinists say yes; Aristotelians say no.
  *   *The Misfire:* Your analysts cannot prove whether the future is open or fixed.
  *   *Reality:* It doesn't matter for the model. What matters is **Reference Class**.
  *   *Fix:* If you have historical data (e.g., past licence revocations in this sector), treat it as "Unknown Fact" (Epistemic). If it is truly unique (e.g., "First ever sovereign default"), treat it as "No Fact" (Deep Uncertainty). The distinction is pragmatic (data availability), not metaphysical.

  **3. The Audit Paradox**
  Auditors love numbers. They hate "Open/Unscored."
  *   *The Misfire:* A defensible philosophical position looks like a missing control to an auditor.
  *   *Fix:* Your "Settlement Condition" document *is* the control. Show the auditor that you *did not score it* because you followed a stricter logical protocol. Frame the refusal to score as **rigour**, not omission.

  ### Summary Recommendation

  1.  **Adopt the Settlement Test** immediately. It forces the semantic clarity auditors love.
  2.  **Purge Entry #3.** It is a project milestone, not a risk. Moving it protects the integrity of the risk register.
  3.  **Reframe Entry #2.** It is a compliance metric, not a probabilistic event.
  4.  **Ban the 50% Placeholder.** Replace with "Scenario Variance." If the Board refuses, label it "Confidence-Weighted" to protect your team during audit.

  This approach grounds your register in the logical status of the propositions themselves, rather than the comfort of the numbers. It will reduce the register size, but increase its defensibility.
