          *   The Form (Fragmented Narrative) says: "I can't stop looking at the bad parts." (Active, painful).
          *   The tension *is* the meaning. If the form perfectly matched the philosophy, the book would be boring/static.
          *   The form enacts the *failure* of the philosophy. Billy *says* "So it goes," but the reader *feels* the horror of the entropy (Dresden).
          *   Vonnegut the narrator breaks in ("That was I. That was me."). This shatters the Tralfamadorian illusion. It re-introduces the human arrow of time (aging, writing, remembering).

      *   **Conclusion/Advice for the Novelist:**
          *   Don't aim for perfect coherence.
          *   Use the tension. Let the form fight the philosophy.
          *   The "truth" of the book is in the gap between how Billy wants to see time (frozen, safe) and how the reader experiences it (fragmented, painful).

