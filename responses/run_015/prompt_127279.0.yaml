answer: |-
  **The Case: The Tow Truck Heuristic**

  You are stranded 50 miles from home in the rain; walking costs you **-$100** in misery and lost time. A tow truck driver offers a ride, but her meter is broken: "I'll name the price when we arrive." The ride is worth **$500** to you. Her cost is negligible. At the destination, a rational you pays **$0** (dominant strategy), so she refuses the ride if she predicts this (70% accuracy). To get the ride, you can cultivate a "Blind Gratitude" disposition: you psych yourself into believing rescuers set fair prices, overriding your calculation. However, this psychological override is coarse-grained: to block the $0 impulse, you must surrender *all* price judgment, not just the $0 impulse. If she detects "Blind Gratitude" (70% chance), she charges your maximum liquidity, **$800**. If she misreads you as Rational (30% chance), she offers no ride. Cultivating the disposition yields an expected value of **-$240** (0.7 × [$500 − $800] + 0.3 × [−$100]), which is strictly worse than staying Rational and walking (−$100). The move works (she believes you, you get rescued) but fails (you end up poorer than if you'd walked).

  **Decision Theory Analysis**

  *   **Node 1 (Pre-commitment):**
      *   **CDT:** Cultivating the disposition causally influences her read (via your demeanor), which causally influences her price. Since the causal chain leads to -$240 EV vs -$100 for walking, CDT says **Don't Cultivate**.
      *   **EDT:** Cultivating is strong evidence she will read you as exploitable. Conditional on cultivating, your expected utility is -$240. Conditional on not cultivating, it is -$100. EDT says **Don't Cultivate**.
      *   **FDT:** Evaluates the output of your decision algorithm. The algorithm "Cultivate Blindness" outputs -$240 against her algorithm. The algorithm "Stay Rational" outputs -$100. FDT says **Don't Cultivate**.
  *   **Node 2 (Payment, assuming ride occurred):**
      *   **CDT:** The ride is already received. Payment is a pure loss. CDT says **Pay $0**.
      *   **EDT:** Paying confirms you are the "Blind" type, but the deal is done; no future correlation matters. EDT says **Pay $0**.
      *   **FDT:** If your algorithm was "Pay Ask," you pay. But since FDT rejected that algorithm at Node 1, a consistent FDT agent wouldn't be in the truck. If they are, they execute the prior optimal policy. FDT says **Pay $0** (or rather, never entered the truck).

  **Load-Bearing Feature**

  The **indivisibility of the commitment mechanism**. The case relies on the psychological fact that you cannot install a commitment to *pay* without installing a commitment to *accept the payer's judgment*. To override the rational calculation at Node 2 (which always favors $0), you must employ a heuristic like "honor" or "gratitude." These heuristics are non-calculating; they treat the helper's demand as authoritative by definition. You cannot fine-tune the heuristic to say "Honor up to $200" because the moment you introduce a limit, you reintroduce calculation, which collapses back into the rational $0 impulse at the moment of payment. The mechanism that solves the credibility problem (surrendering judgment) is the same mechanism that creates the exploitation problem (surrendering judgment).

  **If You Remove It**

  If you allow fine-tuned dispositions (e.g., you can genuinely bind yourself to "Pay exactly $200 and no more"), the case collapses back into the standard Hitchhiker setup. The driver would charge $200, you would pay $200, and the net gain ($300) would beat walking (-$100). The "Rational Irrationality" move would become rational again. The trap only exists because the psychological tool available is too blunt to distinguish between "keeping a promise" and "accepting exploitation."

  **The Counter-Argument**

  A proponent of rational irrationality will argue: **"You are describing a failure of imagination, not a failure of theory. A truly rational agent can pre-commit to a specific number via internal contract."** They will claim you can visualize the $200, attach a feeling of 'violation' to exceeding it, and thus bind the specific amount without surrendering judgment.

  **The Wriggle-Out:**
  To defeat this without stipulation, point out that **internal contracts lack teeth without enforcement.** A feeling of 'violation' is just another cost to be weighed at Node 2. If the price is $800, the rational agent weighs "Feeling of Violation" vs "$800 Loss." Unless the feeling is infinitely negative (which is the "Blind" disposition again), the agent pays $800 to avoid the bigger financial loss, or pays $0 and accepts the feeling. To make the feeling outweigh *any* financial loss (guaranteeing payment), it must be disconnected from financial reasoning—which returns you to the "Blind" disposition that allows exploitation. You cannot have a binding internal contract that is both *flexible enough to stop at $200* and *strong enough to override the $800 demand* without external enforcement.
