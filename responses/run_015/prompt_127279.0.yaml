prompt: |-
  Need a hand building a case for a discussion section I'm running next week on the hitchhiker and that "make yourself irrational on purpose" move. I want the reverse of the normal setup.

  Normal setup: your stranded, someone offers to help on the condition that you'll pay them once your safe, and once you're safe paying is pure loss — so the story goes that it can be rational to make yourself irrational beforehand (get yourself to believe you owe it, become the kind of person who always keeps a promise) because that's what gets you rescued. I want a case where that move is genuinely open to you and would in a sense work — the helper really is fooled, you really can acquire the disposition — and yet taking it leaves you worse off than not taking it, for a reason that lives inside this one transaction.

  Constraints:
  - Ordinary life. No desert, no dying. Someone who could plausibly size you up for a living — a pawnbroker, a landlord, a used car dealer, a bail bondsman — and she can be shrewd but not uncanny: no better than about 70% accurate at reading which kind of person you are, and the numbers have to actually work at that accuracy, not at 99%.
  - No external enforcement: no contract, no collateral, no deposit, no repeat business, no reputation, nobody else ever finds out either way. Her read has to track what you would actually later do, not a badge you could wear.
  - The reason self-binding backfires can't be that the disposition is expensive in the rest of your life (that's the move everyone reaches for and its boring). It has to be something about this deal.
  - State the payoffs in the case, in numbers, so the arithmetic is checkable. One paragraph.

  What I think should be doing the work, but do it better if you can: that the disposition it would be good to have is finer-grained than the only disposition you can actually install. Something like — you'd want to be a person who pays what was agreed and not a penny more, but the only way to get yourself to pay at all is to stop tracking what you owe, and once you've stopped tracking you'll pay whatever she asks for at the end, and she can tell. If you go that way, say what the mechanism is and why it can't be fine-tuned, rather than just asserting it.

  Then: walk through causal, evidential, and functional decision theory at both nodes (before the deal, and at the moment of paying), say which of them say "cultivate the disposition" and which say "don't", show the arithmetic that makes it come out that way, and then tell me which single feature is load-bearing and what happens to the case if I take it out. Last thing: what would someone who thinks the rational-irrationality move is always available say to wriggle out of your case? It's for teaching, so anything that just stipulates the verdicts, or quietly sneaks enforcement back in, doesn't count.
