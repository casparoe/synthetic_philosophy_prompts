  # Session Plan: The Mechanic and The Architect

  ## 1. Setup, Roles, and Materials

  **Room Layout:**
  *   **Front:** Whiteboard (divided into two halves), Projector (displaying a countdown timer and the current System Rules).
  *   **Left Side (The Mechanics):** 10 students. Access to the left half of the whiteboard.
  *   **Right Side (The Architects):** 7 students. Seated at tables, no board access. Index cards and pens.
  *   **Center (The Referee):** 1 student (pre-briefed). Sits at a desk facing the class. Holds the "Master Key" (envelope with solutions).

  **Materials:**
  *   **Index Cards:** Two colors (Green for "Derivable," Red for "Impossible").
  *   **Credence Chips:** 20 poker chips (or paper tokens) per student.
  *   **Projector:** Displays rules and timer.
  *   **Whiteboard:** Markers.

  **The "Spoiler" Protocol:**
  *   **Before Class:** Email one reliable student (the Referee). Tell them: *"You have a special role. You will hold the truth. You cannot speak it. Your grade depends on the class's improvement, not your own bets."* Give them the solutions to both systems.
  *   **During Class:** If any *other* student figures out the solution early, they are instructed to write it on a card and hand it to the Referee. They are not allowed to announce it. They become a "Junior Referee" and help verify others' work silently.

  ## 2. Minute-by-Minute Timeline

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00-05** | **Distribution** | Hand out roles. Project **System MU** rules. No context, no history, no Gödel mentions. |
  | **05-25** | **Phase 1: Search** | **Mechanics:** Generate theorems on the board. **Architects:** Observe patterns, write conjectures. **Referee:** Validates moves silently. |
  | **25-35** | **Bet 1** | Students place Credence Chips on Green (Derivable) or Red (Impossible). Referee records totals. |
  | **35-40** | **Transition** | Clear board. Project **System OMEGA** rules (same rules, new Target). |
  | **40-60** | **Phase 2: Search** | Repeat search process. Mechanics will likely fail to find the target (it is long/obscure). |
  | **60-65** | **Bet 2** | Students place Chips again. Referee records totals. |
  | **65-70** | **The Reveal** | Referee opens Master Key. Reveals MU is Impossible. Reveals OMEGA target *is* Derivable (shows proof). |
  | **70-80** | **Debrief** | Lecture connecting activity to Metatheory, Invariants, and Gödel. |

  ## 3. The Split: Mechanics vs. Architects

  **The Mechanics (10 Students):**
  *   **Task:** Apply rules to generate new strings.
  *   **Constraint:** They cannot speak to the Architects. They can only write on the board.
  *   **Experience:** They will experience the *combinatorial explosion*. They will feel the frustration of search. They represent the **Formal System** itself (syntax without semantics).
  *   **Discovery:** They will discover that some paths dead-end. They will discover that Rule 4 (deletion) feels like "losing progress."

  **The Architects (7 Students):**
  *   **Task:** Observe the board. Formulate hypotheses about *all* possible strings, not just the ones written.
  *   **Constraint:** They cannot touch the board. They must phrase insights as "Conjectures" on index cards.
  *   **Experience:** They will notice properties preserved across moves (e.g., "The number of Is is always odd"). They represent the **Metatheory** (reasoning about the system).
  *   **Discovery:** They will discover that the Mechanics' search is insufficient to prove impossibility. They must find a property the Target lacks that all Theorems share.

  **Why the Asymmetry Works:**
  The Mechanics are trapped in the *object language*. They can only say "This string follows." The Architects are in the *metalanguage*. They can say "No string of this type follows." The friction arises when the Mechanics say "We haven't found it" and the Architects say "It doesn't exist." The activity forces the class to realize that the Architects' claim requires a different *kind* of proof (invariant) than the Mechanics' proof (derivation).

  ## 4. Scoring: The Credence Wager

  **The Scheme:**
  *   Each student starts with 20 Chips.
  *   **Round 1 (Min 25):** Wager any number of chips on Green or Red.
  *   **Round 2 (Min 60):** Wager any number of chips on Green or Red.
  *   **Payoff:**
      *   If you bet on the **Truth**: You keep your chips + 1 bonus chip per 5 wagered.
      *   If you bet on **Falsehood**: You lose the wagered chips.
      *   **The Referee's Incentive:** The Referee gets a prize (e.g., choice of essay topic) only if the *Class Average Confidence* in the correct answer increases from Round 1 to Round 2. This prevents the Referee from spoiling the answer early; they need the class to *learn*, not just be told.

  **Expected Trajectory:**
  *   **Round 1 (MU):** High variance. Many will bet Green (optimism bias) or split 50/50 (uncertainty).
  *   **Round 2 (OMEGA):** High confidence on Green (assuming search failure = impossibility).
  *   **Post-Reveal:** Shock. Round 2 bets on OMEGA were wrong.
  *   **Lesson:** Search failure is not proof. For MU, we need the Invariant. For OMEGA, search failure was just fatigue.

  **Anti-Gaming:**
  *   The "Spoiler" (Referee) cannot bet.
  *   Any other student who claims to know the answer must submit a written proof to the Referee. If the proof is valid, they get maximum points, but they must remain silent. This channels their knowledge into verification rather than announcement.

  ## 5. The Companion System: System OMEGA

  **Job:** Break the inference from "Failed Search" to "Impossibility."

  **Definition:**
  *   **Symbols:** M, I, U (Same as MU).
  *   **Axiom:** MI (Same as MU).
  *   **Rules:** 1, 2, 3, 4 (Same as MU).
  *   **Target:** **MUIUUI**

  **Why this Target?**
  *   **Reachability:** It is derivable.
      *   *Path:* MI $\to$ MII $\to$ MIIII $\to$ MUI $\to$ MUIU $\to$ MUIUUI. (5 Steps).
      *   *Correction for Difficulty:* 5 steps is too easy for 10 students in 20 mins.
      *   *Revised Target:* **MUUI**.
      *   *Path:* MI $\to$ MII $\to$ MIIII $\to$ MIIIIU $\to$ MUIIU $\to$ MUUI (Requires Rule 4 deletion which students avoid).
      *   *Instructor Note:* Verify a 10+ step path involving Rule 4 before class. The specific string matters less than the fact that it *exists* but is non-obvious. Let's use **MUIUUIUUI**.
      *   *Path:* ... $\to$ MUIU $\to$ MUIUUIU $\to$ MUIUUIUUI.
  *   **Pedagogical Function:** In Phase 1 (MU), students fail search and (correctly) suspect impossibility. In Phase 2 (OMEGA), students fail search and (incorrectly) suspect impossibility.
  *   **The Correction:** When you reveal OMEGA *was* possible, you destroy their reliance on search fatigue. They realize: *"For MU, my failure to find it wasn't enough. I needed the Architect's Invariant. For OMEGA, the Architect's Invariant didn't apply, and my search was just too short."*
  *   **Sequencing:** Do MU first. Let them feel the "Impossible" intuition. Then do OMEGA. Let them feel the same intuition. Then shatter it. This isolates the **Invariant** as the unique tool that distinguished MU from OMEGA.

  ## 6. The Debrief: Mapping Activity to Theory

  **1. Inside vs. Outside (Object vs. Metalanguage)**
  *   *Moment:* When Mechanics said "I can't find it" vs. Architects said "It can't be done."
  *   *Concept:* The Mechanics were working **in the system** (syntax). The Architects were working **about the system** (semantics/metatheory).
  *   *Point:* A formal system cannot prove its own limitations. You need a stronger system (arithmetic) to talk about the weaker one (strings).

  **2. The Invariant is Not a Rule**
  *   *Moment:* When a student asked "Can I use the counting trick to make a string?"
  *   *Concept:* The invariant (number of Is not divisible by 3) is a **property**, not a **generator**.
  *   *Point:* Metatheoretic proofs describe the landscape; they do not provide a path through it. This is why the counting argument is not a "5th Rule."

  **3. Conditions for Metatheory**
  *   *Moment:* When Architects realized they could count the Is.
  *   *Concept:* For an outsider's argument to work, the system must be **interpretable** in the metalanguage. We mapped M, I, U to numbers.
  *   *Point:* If we couldn't map the strings to math, we couldn't prove the impossibility.

  **4. The Gödel Bridge (Crucial Distinction)**
  *   *Moment:* The transition from MU to the lecture.
  *   *Concept:* In MU, *we* (outside) decided the system. The system itself is silent on MU.
  *   *Gödel's Jump:* Gödel constructed a sentence **G** that *within the system* says "G is not derivable."
  *   *Contrast:* MU shows we need to step outside to decide. Gödel shows the system can be made to talk about stepping outside.
  *   *Warning:* Do not say "MU proves Gödel." Say "MU prepares the ground. Gödel builds the house."

  ## 7. What This Activity Cannot Reproduce (Instructor Notes)

  **You must say this explicitly:**
  1.  **Decidability:** The MU puzzle is *decidable* by us. We know the answer is "No." Gödel's sentence is *undecidable* within the system (and if the system is consistent, true but unprovable). MU is a limit of the *system*, not necessarily a limit of *truth*.
  2.  **Self-Reference:** MU has no self-reference. It is just strings. Gödel's power comes from the string encoding a statement about itself. This activity does not simulate self-reference.
  3.  **Mechanism:** This activity does not refute mechanism (the idea that minds are machines). It only refutes the idea that *this specific machine* can do *this specific task*. To refute mechanism, you must assume the mind can see the truth of the invariant while the machine cannot. That is a philosophical leap, not a mathematical one.

  **Does this make the "Lazy Version" more likely?**
  *   *Risk:* Yes. Students may leave thinking "Formal systems can't do math, humans can."
  *   *Mitigation:* In the debrief, emphasize that the "Human" insight (counting Is) was itself a mechanical algorithm (modular arithmetic). We just ran a *different* program (metaprogram) than the MU-system. We didn't transcend mechanism; we switched systems.

  ## 8. Predictable Failure Modes & Handling

  **1. The Student Who Knows (The Spoiler)**
  *   *Behavior:* Tries to announce the mod 3 argument at minute 15.
  *   *Handling:* Invoke the **Referee Protocol**. "Please write that on a Conjecture Card and give it to the Referee. If it's valid, you get bonus points, but you cannot speak it yet. We need the Architects to find it."
  *   *Why:* Validates their knowledge without robbing the class of the discovery.

  **2. The Skeptic ("Impossible just means we weren't clever enough")**
  *   *Behavior:* Refuses to bet on Red for MU, or bets Green for OMEGA after the reveal.
  *   *Handling:* Use the **OMEGA Reveal**. "You thought OMEGA was impossible because you couldn't find the path. You were wrong. For MU, you need more than 'I can't find it.' You need the Invariant. Do you have an Invariant for OMEGA? No. So OMEGA is possible. Do you have an Invariant for MU? Yes. So MU is impossible."
  *   *Why:* Distinguishes *epistemic* limitation (I don't know) from *ontological* limitation (It cannot be).

  **3. The Invariant-as-Rule Confusion**
  *   *Behavior:* "Can I use the mod 3 rule to delete Is?"
  *   *Handling:* "The rule describes the territory; it is not a vehicle. You cannot drive on a map."
  *   *Why:* Reinforces Object/Metalanguage distinction.

  **4. The Anti-Mechanist ("This proves humans aren't computers")**
  *   *Behavior:* Claims the session refutes AI/Mechanism.
  *   *Handling:* "You solved MU using arithmetic. Arithmetic is a formal system. You didn't stop being a mechanism; you ran a meta-mechanism. The question is not 'Can we do what MU can't?' but 'Is there a system that can do what we can't?'"
  *   *Why:* Prevents the "Magic Mind" fallacy.

  ---

  ### Instructor Cheat Sheet: System OMEGA Derivation
  *To ensure the "Failed Search" lesson lands, verify this path before class. If it's too easy, add extra 'U's to the target.*
  *   **Target:** **MUIUUIU**
  *   **Derivation:**
      1.  MI (Axiom)
      2.  MII (Rule 2)
      3.  MIIII (Rule 2)
      4.  MUI (Rule 3 on III)
      5.  MUIU (Rule 1)
      6.  MUIUUIU (Rule 2 on MUIU -> MUIUMUIU... wait. Rule 2 is Mx -> Mxx).
      7.  *Correction:* MUIU -> MUIUUIU is not Rule 2.
      8.  *Correct Path:*
          1. MI
          2. MII
          3. MIIII
          4. MIIIIU
          5. MUIU (Rule 3 on first III)
          6. MUIUUIU (Rule 2 on MUIU? No. M(UIU) -> M(UIU)(UIU) = MUIUUIU). **Yes.**
      *   **Steps:** 6.
      *   **Difficulty:** Students often miss Rule 2 application on complex strings (they look for M followed by Is). They also hesitate to use Rule 3 early.
      *   **If found too quickly:** Change Target to **MUIUUIUUIU** (Apply Rule 2 again).
