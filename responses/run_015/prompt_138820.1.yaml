  **The Scenario**
  Consider a single rotary encoder designed to output angle via two voltage channels, sine and cosine, which are physically generated by orthogonal coils within the same housing. You do not know the true angle, nor do you have a reference standard; you only have the two voltage streams. By computing the sum of their squares ($V_{sin}^2 + V_{cos}^2$) over time, you can verify whether the signal magnitude remains constant at the design radius. If the result deviates from the expected constant, you know immediately that the instrument is malfunctioning (e.g., gain drift or coil damage); if it holds steady across thousands of rotations, you have established the instrument's *structural integrity* and *precision reliability* solely from its own deliverances, without assuming the angle readings are true or invoking an external check.

  **Why the Anti-Bootstrapping Diagnosis Doesn't Fire**
  The standard bootstrapping objection (e.g., Cohen 2002) assumes reliability is a monolithic property regarding *truth* (accuracy). It argues that you cannot use $P$ (the reading) to justify $S$ (the source) because trusting $P$ already presupposes $S$. In this case, however, you are not using the *value* of the readings (the first-order claim: "The angle is $\theta$") to justify the source. You are using the *relationship between the channels* (a second-order structural constraint: "The signal lies on a circle") to justify the source's *integrity*. You are not inferring "The reading is true" from "The instrument says so"; you are inferring "The instrument is internally consistent" from "The outputs satisfy a mathematical invariant." This breaks the epistemic circle because the justification targets the *mechanism's stability*, not the *proposition's truth*.

  **The Single Feature Doing the Work**
  The working feature is **internal redundancy subject to a mathematical constraint**. The instrument provides more data channels than are strictly necessary to define the state (two channels for one angle), creating an over-constrained system. This allows you to check for *consistency* without checking for *correctness*. Your hunch about scatter versus offset was close: scatter (noise) and offset (bias) are both first-order errors, but internal redundancy allows you to detect *structural* errors (like gain drift) that manifest as violations of the constraint, which is distinct from both simple scatter and fixed offset.

  **If You Remove That Feature**
  If you remove the redundancy and rely on a single voltage channel (an under-constrained system), the case collapses immediately into ordinary bootstrapping. With only one channel, any change in output could be either a change in the angle (the world) or a change in the gain (the instrument). Without the second channel to lock the magnitude, you cannot distinguish instrument drift from signal change without assuming the world is stable—which smuggles in the "background theory" or "independent check" you were forbidden to use. You would be forced to assume the readings are true to prove the instrument is stable, which is the exact circularity the reading group rejected.

  **How a Defender of the Standard Line Would Attack It**
  A strict epistemologist will argue that you have established *consistency*, not *reliability* in the truth-tracking sense. They will point out that the encoder could be consistently wrong (e.g., mounted 10 degrees off) while still satisfying $V_{sin}^2 + V_{cos}^2 = Constant$. They will claim you have only proven the instrument is *broken or not broken*, not that it is *right*. They will argue that "reliability" entails accuracy, and since you cannot bootstrap accuracy without an anchor, you haven't truly solved the problem, only shifted the goalposts to "functional integrity."

  **Honest Assessment**
  If your group defines "reliability" strictly as "truth-conduciveness" (accuracy), then **no such case can be built** without smuggling in a premise. To move from "internally consistent" to "accurate," you must assume either that the environment is stable (background theory) or that the design specification matches reality (prior authority). However, if you accept the experimentalist's definition where "reliability" includes *precision* and *stability* as distinct, valuable epistemic goods, then the case holds. The intervention should argue that the philosophical literature treats reliability as binary (True/False), whereas instrumentation treats it as a vector (Precision, Accuracy, Stability), and bootstrapping is only impossible for the Accuracy component.
