answer: |-
  Here are eleven question sequences designed for a forty-minute conversation. They are ordered to build logical pressure, starting with the mechanics of enforcement, moving through the internal coherence of the associative account, and ending with the implications for private institutions and the limits of the theory.

  Each entry includes the primary question, a note on her **Likely Reply** (based on the position you described), and a **Follow-up** to press the point further.

  ### 1. The "Open Borders Asterisk"
  **Question:** You argue that a state may refuse admission but may not use coercive force to remove those who arrive and stay. If a migrant crosses the border, lives on private charity, and cannot be deported, in what sense are they actually excluded? Have you not effectively advocated for open borders, provided the migrant is willing to live without state support?

  *   **Likely Reply:** She will distinguish between *status* and *presence*. Exclusion means denying the standing of a member, not necessarily physical removal. The state is not obliged to facilitate their stay, even if it cannot physically prevent it.
  *   **Follow-up:** But if the state cannot remove them, and cannot prevent them from surviving on private charity, the "exclusion" relies entirely on the migrant's inability to find private support. If that support exists, your right to exclude becomes a right to make life difficult, rather than a right to determine who belongs. At what point does "making life difficult" become the coercion you claim to reject?

  ### 2. The "Enforcement vs. Right" Defence (Part I)
  **Question:** In your written work, you suggest that criticisms of your view often target the *enforcement* of exclusion rather than the *right* to exclude itself. You maintain we can hold the right even if enforcement is constrained. But if the only enforcement permitted is refusing initial entry, and entry is physically hard to police without deportation powers, isn't the right rendered hollow?

  *   **Likely Reply:** She will insist that the normative justification for the right is separate from the practical capacity to enforce it. A right can exist even if it is occasionally breached or hard to police.
  *   **Follow-up:** (See Question 3).

  ### 3. The "Enforcement vs. Right" Defence (Part II)
  **Question:** Following on from that: If the enforcement mechanisms you allow are too weak to actually secure the outcome the right is supposed to protect (a distinct political community), does the distinction between "right" and "enforcement" do any work? Or is it a way to insulate the theory from the reality that without deportation, the boundary is porous?

  *   **Likely Reply:** She may argue that the *expression* of the right matters—that stating the terms of membership is a sovereign act regardless of compliance.
  *   **Follow-up:** If the expression of the right has no material consequence for who actually lives on the territory, why should the migrant accept the authority of that expression? You ground the right in the freedom of existing members, but if the "existing members" share the territory with anyone who can arrive, in what sense is their association being preserved?

  ### 4. Destitution as Coercion
  **Question:** You propose that arrivals may be denied welfare and shut out of the formal labour market. But if someone cannot work legally and cannot claim support, their presence is materially impossible unless they rely on illicit work or charity. Is this not exclusion through destitution? And if destitution forces them to leave, isn't that functionally identical to the coercive removal you forbid?

  *   **Likely Reply:** She will likely argue that destitution is a side effect of denying *benefits*, not an active act of force. The state is merely refraining from helping, not harming.
  *   **Follow-up:** But you also ban them from the formal labour market. That is an active restriction on their interaction with citizens who might wish to hire them. If the state actively prevents them from sustaining themselves, while simultaneously refusing to remove them, isn't the state creating a zone of rightlessness that is more coercive than a simple visa denial?

  ### 5. Labour Bans and Protectionism
  **Question:** You frame the right to exclude as an associative right—a freedom to choose who joins the collective. But a ban on hiring newcomers looks less like association and more like economic protectionism for incumbent workers. If the goal were truly associative, why not allow employment but deny voting or welfare?

  *   **Likely Reply:** She will argue that participation in the formal labour market is a core part of social cooperation and institutional ownership, which non-members cannot share.
  *   **Follow-up:** If labour market participation is core to membership, then long-term resident non-citizens who pay taxes and work illicitly or in grey markets are functionally participating. Why does their contribution not generate a claim to membership, while the mere birth of a citizen elsewhere does?

  ### 6. The Composition Problem
  **Question:** Your argument relies on the freedom of association of the community's existing members. But in a large, pluralist state, most citizens have no associative relationship with most others. We do not share a purpose or a life. Does your account not actually rest on joint ownership of territory rather than association?

  *   **Likely Reply:** She will likely concede that national association is thin, but argue it is thick enough to ground collective ownership of public institutions.
  *   **Follow-up:** If it rests on ownership of territory and institutions, ownership usually yields a right to set *terms of use*, not a right to unlimited exclusion. A landlord cannot exclude anyone for any reason. If the ground is ownership, why does the right to exclude remain so absolute?

  ### 7. Discrimination and the "Bad Reasons" Problem
  **Question:** Freedom of association is normally thought to protect the right to choose associates for arbitrary or even prejudiced reasons. If the state's right is derivative of this freedom, does your view permit excluding migrants on grounds of race or religion?

  *   **Likely Reply:** She will almost certainly say no. She holds that the state as a corporate agent is bound by equality constraints that private individuals are not.
  *   **Follow-up:** If the state is bound by equality constraints that override the associative freedom of its members, isn't the "freedom of association" doing no justificatory work at all? Are you not simply a partialist about members' interests who has imported a side-constraint from liberal egalitarianism that contradicts the associative premise?

  ### 8. Conflicting Associations
  **Question:** Excluding a migrant prevents citizens from employing, marrying, or worshipping with her. This creates a conflict between the associative right of the collective to exclude and the associative right of the individual to include. How do you adjudicate this without resorting to the kind of interest-balancing you claim to dislike?

  *   **Likely Reply:** She will likely prioritise the collective right, arguing that individual associative rights are bounded by the rules of the institution within which they operate.
  *   **Follow-up:** But if the collective right always trumps the individual right to associate, the individual's freedom of association seems severely diminished. Does the citizen have *any* associative right that can override the state's decision to exclude, or is the citizen's freedom entirely subordinate to the collective's?

  ### 9. The Reciprocity Proviso and Causation
  **Question:** You accept that a state forfeits its right to exclude against those harmed by its own policies. But modern causation is diffuse: trade policy, arms sales, and emissions affect everyone. If the proviso applies to anyone affected by these diffuse harms, doesn't it swallow the general right to exclude entirely?

  *   **Likely Reply:** She will argue for a threshold of direct material contribution. Not every negative effect counts as a rights-violating harm that triggers the proviso.
  *   **Follow-up:** Who sets that threshold? If the state gets to decide whether its own policies caused the migration, the proviso seems unenforceable. If an independent body decides, aren't we back to a global authority that undermines the very state sovereignty your theory is meant to protect?

  ### 10. Asymmetry and Regularisation
  **Question:** You draw a sharp asymmetry between refusing admission and expelling those present. But if long-term presence, work, and raising children generate moral claims, at what point does a migrant's right to stay outweigh the state's initial right to refuse? Do you owe us an account of regularisation that fits a right to exclude?

  *   **Likely Reply:** She may argue that time generates new obligations, but these are humanitarian rather than membership claims. Regularisation is a gift, not a right.
  *   **Follow-up:** If regularisation is a gift, it is arbitrary. If it is based on the moral facts of social integration, then the "right to exclude" seems to expire the moment integration begins. Why, then, maintain a rigid legal barrier that contradicts the moral reality of membership?

  ### 11. Sub-State Associations and Private Trusts
  **Question:** If the state's right to exclude is derivative of the associative rights of its members, does that logic extend to sub-state associations—towns, congregations, or private endowed trusts? Do they hold exclusionary rights of the same shape?

  *   **Likely Reply:** She will likely say yes, private associations have broad rights to determine their membership, though perhaps subject to different laws than the state.
  *   **Follow-up:** Here is the tension: If the state is bound by anti-discrimination constraints because it is a public institution, but private trusts are not, does your theory imply that a private scholarship trust is morally permitted to restrict awards by nationality or birth, even if a state scholarship could not? If you say the trust *is* bound by equality, on what grounds, if not the same grounds that bind the state?
      *(Note for Chair: This allows her to discuss the principle of private discrimination without you asking for specific advice on your trust. Her answer will signal whether your trustees' debate has a philosophical resolution.)*

  ### 12. Falsifiability
  **Question:** Finally, what would count against your view? Is there a finding, a case, or an argument that would make you give up the right to exclude, abandon the enforcement minimalism, or discard the reciprocity proviso?

  *   **Likely Reply:** Philosophers often struggle here, but she might point to empirical evidence that exclusion causes massive harm, or a theoretical proof that association cannot ground rights.
  *   **Follow-up:** If the empirical evidence showed that open borders with full welfare access did not collapse the state or harm the poor, would you abandon the restriction? Or is the right to exclude non-negotiable regardless of the consequences?
