  **Tier B: A disciplined analogy; most preconditions obtain and the stated conclusion is proportionate.**

  1.  **(ii) The argument from the second theorem to a limit on self-certification in machine learning**
      *   **Score:** 40
      *   **Failing/Hardest Precondition:** C1 (effective axiomatizability), as statistical learning models are not typically fixed formal axiomatic systems.
      *   **Justification:** While neural nets are not axiomatic, the formal verification components required for safety certification are subject to genuine provability limits.

  **Tier C: A suggestive metaphor that can still discipline thinking, but where at least one precondition clearly fails.**

  1.  **(iii) The claim that a final theory in physics is impossible**
      *   **Score:** 60
      *   **Failing/Hardest Precondition:** C5 (the Gödelian conclusion), because mathematical undecidability does not necessarily entail physical indeterminacy or incompleteness.
      *   **Justification:** A Theory of Everything could be mathematically incomplete yet physically exhaustive if undecidable propositions lack physical correlates.

  2.  **(v) The constitutional self-amendment argument**
      *   **Score:** 75
      *   **Failing/Hardest Precondition:** C2 (sufficient strength), since legal codes rarely encode arithmetic or support the diagonal construction required for incompleteness.
      *   **Justification:** Legal paradoxes arise from self-reference similar to the Liar Paradox, but they do not require the arithmetical machinery of Gödel's theorem.

  3.  **(iv) The Gödelian argument against self-certifying coherentism in epistemology**
      *   **Score:** 85
      *   **Failing/Hardest Precondition:** C1 (effective axiomatizability), because belief systems are not mechanically enumerable or fixed.
      *   **Justification:** Coherentism fails for normative reasons regarding circularity, making the formal incompleteness theorem an unnecessary structural analogy.

  **Tier D: Ornament; the conclusion would be entirely unaffected if the theorems were false.**

  1.  **(vii) The codified-ethics argument**
      *   **Score:** 95
      *   **Failing/Hardest Precondition:** C1 (effective axiomatizability), as moral codes are not consistent formal systems capable of encoding their own prescriptions.
      *   **Justification:** Moral particularism rests on the complexity of value and context, not on the formal undecidability of rule-based systems.

  2.  **(viii) The literary or postmodern use**
      *   **Score:** 100
      *   **Failing/Hardest Precondition:** C5 (the Gödelian conclusion), since undecidability of specific sentences does not imply global indeterminacy of meaning.
      *   **Justification:** Poststructuralist claims about textual instability derive from hermeneutics and linguistics, borrowing Gödel's name solely for scientific prestige.

  ***

  Item (iii), the claim that a final theory in physics is impossible, would change tier most dramatically if precondition C5 were repaired. If one could establish precisely that every mathematically undecidable statement within a physical theory corresponds to a physically meaningful question that the theory cannot answer, the argument would move from Tier C to Tier A. This repair would eliminate the category error between syntactic decidability and physical completeness, making the Gödelian limit a direct constraint on physical knowledge rather than a mathematical curiosity.

  Precondition C1 (effective axiomatizability) does the most discriminating work across these eight items, as it immediately filters out most human, social, and semantic systems which are evolutionary rather than fixed. The schema as stated is likely too demanding for domains like law or ethics, where rules change over time, but this strictness is necessary to prevent the "Gödelian" label from being applied to any system that is merely complex or vague. By insisting on mechanical enumerability, the schema correctly identifies that most extra-mathematical uses are metaphors rather than applications of the theorem's inferential force.
