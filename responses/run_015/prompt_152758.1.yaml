      *   **Reasonable Rejection:** Based on generic reasons, not idiosyncratic preferences. Involves a comparative assessment of burdens.
      *   **Non-Fungibility:** Persons are distinct loci of value; you can't just sum utility across them like heat units.

  3.  **Map Physics Concepts to Philosophical Concepts:**
      *   *Extensive Properties (Additive):* Energy, Entropy, Volume. Scale with system size. $X_{total} = \sum X_i$.
      *   *Intensive Properties (Non-Additive):* Temperature, Pressure, Chemical Potential. Do not scale. Defined at equilibrium.
      *   *Ensemble Averaging:* Statistical treatment of many microstates to find macro behavior. Assumes ergodicity or independence often.
      *   *Constraints/Boundary Conditions:* What limits the phase space.
      *   *Stability/Equilibrium:* Minimum free energy, maximum entropy.

