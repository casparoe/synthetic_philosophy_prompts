      *   *Reasonable Rejection:* Is it stability? Stability is about returning to equilibrium after perturbation. Rejection is a veto. It's more like a *symmetry breaking* condition or a *topological defect* that cannot be smoothed over. But ultimately, "reasonable" is normative. Physics has "stable," not "reasonable."
      *   *The Residue:* The failure of translation highlights the *separateness of persons*. In physics, particles of the same type are indistinguishable (fungible). In ethics, persons are distinct. This is the core failure point.

