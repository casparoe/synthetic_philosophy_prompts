answer: |-
  This is a rigorous request that demands we treat the analogy not as a pedagogical simplification but as a structural mapping between two formal systems: statistical mechanics and contractualist ethics. Below is the translation, followed by the residue report you requested.

  ### I. The Aggregation Problem: Extensive Variables vs. Local Constraints

  **The Philosophical Claim:**
  Scanlon argues that we cannot justify imposing a severe burden on one individual simply because it alleviates trivial burdens for a large number of others. The complaints of the many do not aggregate linearly to outweigh the complaint of the one.

  **The Physics Translation:**
  In statistical mechanics, macroscopic observables are typically **extensive properties**. If you have $N$ nominally independent subsystems (particles, spins), the total energy $E$, entropy $S$, or volume $V$ is constructed by the linear summation of microscopic contributions:
  $$ X_{\text{total}} = \sum_{i=1}^{N} x_i $$
  In the thermodynamic limit ($N \to \infty$), fluctuations relative to the mean vanish. A utilitarian calculus operates exactly like an extensive variable: it integrates the "hamiltonian of harm" over the ensemble. The global minimum is found by allowing local excitations if they lower the total free energy.

  Scanlon's refusal to aggregate treats moral burden not as an extensive quantity, but as a **non-additive hard constraint** on specific degrees of freedom. It is analogous to a system where the Hamiltonian is not separable, or where specific boundary conditions dominate the bulk behavior.

  *   **Clean Translation:** The distinction between a variational principle (minimize total energy/utility) and a constraint satisfaction problem (satisfy all local boundary conditions). In Scanlon's framework, a severe burden is like a singularity or a topological defect in the field; you cannot "smooth it out" by integrating over the rest of the manifold, no matter how large the manifold becomes.
  *   **Distortion:** In physics, hard constraints usually arise from conservation laws or geometric impossibilities (e.g., two fermions in the same state). In Scanlon's ethics, the "constraint" is not physically impossible to violate; it is *forbidden*. The physics analog describes *can*, the ethics describes *may*.
  *   **No Counterpart:** Physics has no concept of a "complaint." A high-energy particle does not "object" to its state; it simply evolves according to the gradient. The idea that the *location* of the burden matters (the "separateness of persons") more than the *integral* of the burden has no analog in thermodynamics, where particles of the same species are fundamentally indistinguishable (fungible).

  ### II. Reasonable Rejection: Stability Criteria vs. Normative Standpoints

  **The Philosophical Claim:**
  A principle is valid if no one could "reasonably reject" it. This involves comparing the generic reasons individuals have for accepting or rejecting a rule. It requires a specific standpoint: the perspective of the person burdened.

  **The Physics Translation:**
  One might attempt to map "reasonable rejection" to a **stability criterion** or an **equilibrium selection rule**.
  *   *Stability:* A state is stable if small perturbations decay rather than grow. A principle is "stable" if, when proposed, it does not generate a "restoring force" (rejection) strong enough to collapse the agreement.
  *   *Symmetry Breaking:* Choosing one principle over another might look like spontaneous symmetry breaking, where the system settles into one vacuum state among many possible minima.

  *   **Clean Translation:** There is a structural isomorphism between "searching for a principle no one could reject" and "searching for a fixed point in a dynamical system." Both involve iterating through possible states until a configuration is found that satisfies the system's internal consistency conditions.
  *   **Distortion:** Stability in physics is causal and descriptive. If a pencil stands on its tip, it is unstable; it *will* fall. If a principle is "unstable" in Scanlon's sense, it *ought not to be adopted*, but it physically can be. The "force" of a reason is not a vector in phase space.
  *   **No Counterpart:** "Reasonableness" implies a capacity to weigh generic reasons, which requires a model of the other. In an ensemble, subsystems do not model each other; they interact via fields or collisions. There is no "viewpoint" in statistical mechanics. The notion that a subsystem's state constitutes a *veto* based on its internal configuration, rather than its contribution to the total energy, is alien to the formalism.

  ### III. The Residue Report: What Fails to Carry Over

  You asked specifically whether the failure of translation shows that physics omits a genuine distinction or that contractualism is indeterminate.

  **1. The Fungibility Problem (Ontological Omission)**
  The most significant failure of the analogy lies in the treatment of the subsystems.
  *   **Physics:** In the ensemble formalism, particles are indistinguishable. Swapping particle $i$ and particle $j$ leaves the macrostate invariant. This is why extensive variables work. You can trade energy from particle $i$ to particle $j$ without ontological loss.
  *   **Contractualism:** Persons are not fungible. The "indexical" fact that *I* am the one suffering the severe burden is morally decisive.
  *   **Verdict:** This suggests physics genuinely omits a distinction. Statistical mechanics is designed precisely to wash out individuality to find macroscopic laws. Contractualism is designed precisely to protect individuality against macroscopic laws. The failure of the analogy here is not a flaw in Scanlon's determinacy; it is a feature of the domain. Physics models *matter*; Contractualism models *agents*.

  **2. The Normative Gap (The "Is-Ought" Boundary)**
  *   **Physics:** "Stability" is a description of persistence over time.
  *   **Contractualism:** "Reasonable rejection" is a justification for authority.
  *   **Verdict:** There is no physical counterpart to *normativity*. You can model the *causes* of moral agreement (evolutionary game theory, neural network convergence), but you cannot model the *validity* of the agreement using physical variables. If you define "reasonable" as "that which leads to stable equilibrium," you have reduced ethics to sociology or psychology. Scanlon claims "reasonable" tracks truth about justification, not just stability of belief. This residue is irreducibly normative.

  **3. Determinacy vs. Indeterminacy**
  You asked if the resistance to translation shows contractualism is less determinate than it appears.
  *   **Analysis:** In physics, if a system has competing minima (frustrated spin glass), the outcome may be path-dependent or indeterminate without further data. In contractualism, "reasonable rejection" often feels indeterminate (e.g., how much burden counts as "severe"?).
  *   **Verdict:** However, the *source* of the indeterminacy differs. In physics, it is often epistemic (lack of data) or chaotic. In ethics, it is conceptual (the vagueness of "reason"). The failure of the physics analogy does not prove ethical indeterminacy; it proves that ethical concepts are not state functions. They are more like *operators* acting on a state space than the coordinates of the space itself.

  ### Summary of the Honest Residue

  1.  **Extensive vs. Non-Extensive:** The refusal to aggregate harms is **not** analogous to intensive properties (like Temperature), because intensive properties equalize across the system. It is better analogized as a **local hard constraint** that cannot be integrated out. However, physics allows constraints to be violated if energy is supplied; Scanlon does not.
  2.  **Reasonable Rejection:** This has **no physical counterpart**. Stability criteria describe what *persists*; reasonable rejection prescribes what *permits*. The "veto power" of an individual in contractualism has no analog in an ensemble where the macrostate dominates the microstate.
  3.  **The Core Distinction:** The translation fails primarily because physics assumes the **fungibility of subsystems** (indistinguishability), whereas contractualism is founded on the **non-fungibility of persons**.
  4.  **Conclusion:** The resistance to translation does not show that contractualism is indeterminate. It shows that contractualism is addressing an ontology (distinct centers of consciousness with veto power) that statistical mechanics is explicitly designed to ignore. The "residue" is the **agent**. Physics describes the stage; contractualism describes the rights of the actors. You cannot derive the script from the geometry of the stage.

  **Final Recommendation:** Use the "hard constraint vs. variational principle" distinction to understand the *structure* of the argument, but discard the thermodynamic vocabulary when analyzing the *source* of the obligation. The "reasonable" in reasonable rejection is not a stability threshold; it is a claim about the authority of the individual standpoint, a variable that does not exist in your Hamiltonian.
