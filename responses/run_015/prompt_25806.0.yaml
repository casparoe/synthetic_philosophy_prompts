answer: |-
  **Title:** Beyond Capacity: The Case for Occurrent Rational Engagement as a Condition of Valid Consent

  **Abstract:**
  The standard bioethical and legal account of decisional competence is largely dispositional. It asks whether an agent *possesses* the abilities to understand, appreciate, reason, and communicate. This paper argues that this threshold is insufficient for the moral gravity of consent. I defend the "Occurrent Rational Engagement" (ORE) thesis: valid consent requires that the agent *actually* holds relevant considerations in mind and weighs them in a minimally coherent way at the moment of authorization. By shifting the focus from status-based capacity to event-based functioning, we better protect the integrity of autonomy against internal vitiating factors such as acute intoxication, overwhelming emotion, and cognitive time-pressure.

  ---

  ### I. Introduction: The Dispositional Deficit

  In contemporary moral and legal philosophy, the validity of consent is typically triangulated through three conditions: competence, information, and voluntariness. The competence condition is usually understood through the lens of the *MacArthur Competence Assessment Tool* or similar frameworks derived from *Appelbaum and Grisso*. On this "Standard Account," an agent is competent if they possess the *capacity* to:
  1.  Understand the relevant information.
  2.  Appreciate the situation and its consequences.
  3.  Reason about treatment options.
  4.  Communicate a choice.

  This account is fundamentally **dispositional**. It assesses the agent's machinery. If the machinery is intact, the agent is deemed competent, even if the machinery is currently malfunctioning due to temporary states.

  I argue that this sets the bar too low. Consent is a normative power—it transforms a moral prohibition (e.g., against battery or trespass) into permission. To exercise such a power, it is not enough to *have* the ability to reason; one must *exercise* that ability in the specific instance. I propose the **Occurrent Rational Engagement (ORE)** requirement. Under ORE, competence is not merely a status one holds, but a functional state one must occupy at the moment of decision. An agent fails the competence condition if, due to intoxication, overwhelming emotion, or acute time pressure, they fail to actually weigh relevant considerations coherently, even if they retain the general capacity to do so.

  ### II. The Argument from Normative Authority

  The strongest justification for the ORE requirement rests on the nature of autonomy and the function of consent.

  **1. Autonomy as Self-Governance, Not Just Self-Ownership**
  The Standard Account treats autonomy largely as a property of the agent (self-ownership). If you own the capacity, you own the right to waive protections. However, a more robust Kantian or Razian view treats autonomy as *self-governance*. To govern oneself is to act in accordance with reasons that one endorses.
  If an agent consents while severely intoxicated or in a panic, they may be acting on an impulse that contradicts their deeper value structure. They are not "governing"; they are being "driven." If consent is the mechanism by which we authorize others to act upon us, that authorization must stem from the governing self, not the compromised self. A dispositional capacity does not guarantee that the governing self is currently at the helm.

  **2. The Internal/External Symmetry**
  We readily accept that *external* constraints on choice (coercion, duress) invalidate consent under the voluntariness condition. If a gunman demands your wallet, your "choice" to hand it over is invalid because your option set was manipulated.
  However, *internal* constraints can be just as debilitating as external ones. Severe panic, grief, or intoxication narrows the cognitive horizon just as effectively as a threat of violence. It restricts the agent's ability to access their own value system. If we invalidate consent when a gun is to the head (voluntariness), consistency demands we invalidate consent when the cognitive processing center is functionally offline due to internal states (competence). To treat internal cognitive disruption as merely a "voluntariness" issue is to miscategorize the harm; the harm is not that the options were limited, but that the *processor* evaluating the options was degraded.

  **3. The Gap Between Capacity and Functioning**
  Consider the analogy of a licensed driver. Possessing a license certifies a dispositional capacity to drive. However, if that driver is asleep at the wheel or texting, they are not driving competently, even if they possess the license. Similarly, possessing decisional capacity does not mean one is currently deciding competently. The moral stakes of consent (bodily integrity, property rights, sexual inviolability) are high enough to demand that the "driver" is not only licensed but awake and attentive.

  ### III. Implications of the ORE Requirement

  Adopting the ORE requirement shifts the moral landscape in three critical areas often treated as unproblematic under the Standard Account.

  1.  **Severe Intoxication:** The Standard Account often struggles with the "drunk yes." If a person is not blacked out (retaining some understanding), they are often deemed competent. ORE clarifies that if intoxication prevents the *actual weighing* of risks (e.g., the risk is understood abstractly but carries no emotional weight), competence is absent.
  2.  **Powerful Emotion:** In cases of acute grief or romantic desperation, agents often consent to things they would otherwise reject. Under the Standard Account, unless they are clinically incapacitated, they are competent. ORE recognizes that overwhelming emotion can temporarily suspend the reasoning faculty, rendering the consent invalid not because it was coerced, but because the rational engagement was absent.
  3.  **Acute Time Pressure:** "Sign now or the offer is gone." While often treated as a market pressure, extreme time pressure can prevent the *occurrent* weighing of considerations. If the time allotted is insufficient for the relevant considerations to be brought to mind and weighed, the competence condition is not met, regardless of the agent's general intelligence.

  ### IV. Objections and Responses

  The ORE requirement is demanding. It faces three serious objections: the Paternalism Objection, the Epistemic Objection, and the Human Condition Objection.

  **Objection 1: The Paternalism Objection**
  *Critique:* This view is overly paternalistic. It disrespects agents by second-guessing their choices based on a subjective standard of "coherent weighing." It restricts liberty by invalidating choices that adults wish to make, even impulsive ones.
  *Response:* This objection conflates *protecting the agent from bad outcomes* with *protecting the integrity of the normative transaction*. ORE is not paternalistic in the traditional sense because it does not claim the agent is choosing poorly; it claims the agent is not actually *choosing* in the normatively relevant sense.
  Furthermore, true liberalism requires that restrictions on liberty be authorized by the agent's rational will. If the rational will is temporarily offline, honoring the impulse is not respecting liberty; it is exploiting a vulnerability. ORE protects the agent's *long-term autonomy* (their deep values) from their *short-term incapacity*. It is autonomy-protecting, not autonomy-restricting.

  **Objection 2: The Epistemic Objection**
  *Critique:* This standard is unworkable. How can a recipient of consent know what is happening in the agent's mind? We can observe behavior and test for general capacity, but we cannot observe "occurrent weighing." This creates uncertainty and chills permissible interaction.
  *Response:* It is true that ORE raises the epistemic bar, but not insurmountably. We already navigate similar epistemic gaps regarding coercion. We cannot see inside the coercer's mind, yet we invalidate consent based on contextual cues (a gun, a threat). Similarly, we can use contextual proxies for occurrent competence: slurred speech, signs of acute distress, unreasonable haste, or incongruity between the decision and the agent's known values.
  Moreover, the burden of inquiry should scale with the risk. For low-stakes consent (borrowing a pen), a presumption of occurrent competence is reasonable. For high-stakes consent (surgery, sexual intimacy, financial contracts), the recipient has a duty to ensure the agent is not merely capable, but engaged. If the recipient suspects the "machinery" is off, they must pause.

  **Objection 3: The Human Condition Objection**
  *Critique:* Humans are never perfectly rational. We are always influenced by emotion, some level of stress, and imperfect information. If ORE requires "coherent weighing," does it not invalidate almost all consent? Where is the line?
  *Response:* ORE does not require *perfect* rationality or the absence of emotion. It requires *minimally coherent* engagement. Emotion is often part of weighing (e.g., fear of a risk is a valid reason to reject it). The line is drawn at **disruption**.
  Does the emotion/intoxication/pressure prevent the consideration from entering the deliberation, or does it simply weight it heavily? If I consent to surgery because I am scared of dying, that is valid weighing. If I consent to surgery because I am in such a panic I cannot comprehend the alternative, that is invalid. The threshold is whether the agent can access and integrate their relevant values into the decision *at that moment*. It is a threshold of functionality, not perfection.

  ### V. Conclusion

  The Standard Account of competence treats decision-making capacity as a static property, like a driver's license. This paper has argued that for consent to perform its moral work, competence must be understood as a dynamic event. The Occurrent Rational Engagement requirement ensures that consent reflects the actual exercise of autonomy, not merely the potential for it.

  By acknowledging that internal states like intoxication, overwhelming emotion, and acute pressure can degrade competence just as effectively as cognitive disability, we align our moral theory with the reality of human psychology. While this imposes a higher burden on recipients of consent, it is a burden demanded by the seriousness of the rights being waived. To respect persons is to respect their actual reasoning, not just their capacity for it. Valid consent requires not just a mind that *can* work, but a mind that *is* working.
