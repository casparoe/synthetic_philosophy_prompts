  We place the cotton near the **fire**,
  Expecting soon to see it **burn**,
  Guided by sequence and by **custom**,
  Assuming power in the **touch**,
  To leave behind a trace of **ash**,
  As if bound by a cosmic **will**.

  For nature holds no independent **will**,
  To carry heat from yesterday's **fire**.
  Each moment turns to distinct **ash**,
  Nothing compels the wood to **burn**.
  Separated by the slightest **touch**,
  Within the flow of established **custom**.

  We mistake the rhythm for **custom**,
  As if the elements possessed a **will**.
  But atom meets atom in **touch**,
  Without a spark from prior **fire**.
  Why must we see the timber **burn**,
  And vanish into silent **ash**.

  The pile remains cold **ash**,
  Unless renewed by sacred **custom**.
  Does the fuel truly **burn**,
  Obeying only Creator's **will**,
  Not from the heart of the **fire**,
  Nor from the fingertip's **touch**.

  Withdraw the permission of **touch**,
  The blackness stays as **ash**,
  Though the eye perceives **fire**,
  It is but a habitual **custom**,
  It is a sovereign **will**,
  That lets the cotton **burn**.

  We see the fabric **burn**,
  But feel no causal **touch**,
  Only the hanging of **will**,
  Over the pile of **ash**,
  Behind the veil of **custom**,
  Between the hand and the **fire**.

  If no **fire** commands the cloth to **burn**,
  Then **custom** hides the invisible **touch**,
  And **ash** rests on the shifting edge of **will**.
