answer: |-
  Hey, it sounds like you have a really solid topic there, and honestly, mapping the EPO era onto the Moloch framework is one of the more compelling applications I have heard for this course. You are right to be wary of the professor's warning though, because it is very easy to just slap the label on anything competitive and call it a day without doing the mechanical work of showing how the incentives actually lock in. The cycling case is rich enough to support the analysis, but only if you are precise about who is trapped and why they cannot climb out. Let's walk through the mapping you proposed and see where the gears grind and where they might slip.

  Starting with the players and payoffs, you have to be careful not to treat the peloton as a monolith. If you model this as individual riders against individual riders, the dominance of the doping strategy is clear. For a rider whose contract renewal and salary depend on top-ten finishes, staying clean is strictly dominated once the prevalence of EPO crosses a certain threshold. If everyone else is boosting their oxygen capacity by ten percent and you are not, you are not just losing races, you are becoming economically obsolete. The payoff for winning is massive, both in immediate prize money and in long-term sponsorship value, while the payoff for losing is unemployment. The cost of doping was initially perceived as low because there was no test, and the health risk was discounted because everyone was doing it and survival bias was in full effect. So yes, for the individual rider in that period, staying clean was a suicide pact for their career. That fits the trap perfectly. But you should also consider the teams as the primary agents. Teams compete for sponsors, and sponsors want visibility. If Team A stays clean and Team B dopes, Team B wins and gets the sponsor, and Team A folds. This pushes the unit of analysis up a level, which might help you resolve some of the coordination issues you are worried about later.

  The fifty percent hematocrit rule is a fascinating piece of evidence for your paper, and you are absolutely right to read it as a coordination point that stabilized the trap rather than escaping it. In game theory terms, you want to describe this as a focal point. When the UCI introduced the rule as a health measure rather than a doping sanction, they inadvertently created a safe harbor. It told the riders exactly how much they could dope without getting caught. It turned an ambiguous risk into a clear target. Instead of creating a ceiling that stopped the race to the bottom, it created a floor that everyone aimed for. It reduced the variance in cheating. Before the rule, you might dope too much and get sick, or too little and lose. After the rule, you dope to forty-nine percent. This actually makes the trap more stable because it reduces the uncertainty that might otherwise cause some players to defect. It institutionalized the arms race under the guise of safety. You should emphasize that this shows how well-intentioned regulation can fail if it does not alter the underlying payoff matrix. It changed the rules of the game but not the incentives to win at all costs.

  Then you have the Festina scandal, which is crucial for your argument about moralizing versus payoff structures. The fact that the sport did not collapse after Festina, and that doping continued through the Armstrong years, is strong evidence for the Moloch view that exposure alone does not dissolve the trap. The scandal increased the reputational cost for the sport generally, but it did not immediately increase the cost for the individual cheater enough to outweigh the benefit of winning. As long as the detection risk remained low relative to the reward, the equilibrium held. The scandal was a shock, but shocks do not break traps unless they change the rules of engagement. What eventually broke the trap was not shame, it was technology. The EPO test and later the biological passport finally changed the payoff structure by introducing a credible probability of detection and sanction. Until then, the omertà was rational. You can argue that the persistence of doping post-Festina demonstrates that the trap is robust against moral pressure because the players are not acting out of malice, but out of survival within the system. Nobody wanted the sport to be corrupted, but nobody could afford to be the first to stop.

  Now, let's get to the thing that is bothering you, because it is the most interesting part of your paper and where you need to be most disciplined. You are worried that the omertà looks like coordination, and Moloch is supposed to be about coordination failure. This is a sharp observation, and if you do not handle it carefully, it could undermine your whole thesis. However, I do not think it breaks the model if you define the coordination correctly. The multipolar trap does not mean that no communication ever happens; it means that coordination to escape the suboptimal equilibrium is impossible. The peloton did coordinate, but they coordinated to maintain the defect-defect equilibrium, not to escape it. The omertà was a mechanism to punish defectors who tried to change the game. When Christophe Bassons tried to go clean and speak out, he was not just beaten competitively; he was socially exiled. That is not coordination to solve the trap; that is enforcement of the trap. The group coordinated to prevent anyone from cooperating with the regulators. So the anomaly resolves if you frame the omertà as a barrier to exit rather than a solution to the competition. They solved the coordination problem of how to keep lying, which is different than solving the coordination problem of how to stop doping.

  That said, you should also consider shifting the unit of analysis to the teams to make this even clearer. If the riders are the players, the omertà looks like collusion. But if the teams are the players, the omertà is just competitive secrecy until it becomes systemic corruption. The Festina affair revealed that doping was organized at the team level, which suggests the trap was actually between teams rather than individuals. Teams coordinated internally to dope their riders, but they could not coordinate with other teams to stop doping because they could not trust each other not to cheat. If Team A agrees to stop doping but Team B secretly continues, Team A loses all their value. So the teams are locked in the trap, and the riders are just the assets being sacrificed. This might actually strengthen your paper because it aligns better with the economic reality of the sport. The riders had very little agency compared to the directors and doctors. Framing the teams as the players in the multipolar trap makes the omertà less about riders conspiring and more about organizations protecting their competitive advantage against regulators and each other.

  However, you need to be honest about where the framework breaks or goes silent, because no model is perfect. One place where Moloch fits loosely is the intentionality of the harm. In the classic Moloch metaphor, the sacrifice is impersonal; nobody wants the outcome, it just happens. In cycling, there were active bad actors who benefited disproportionately and knowingly harmed others. Armstrong was not just a victim of the trap; he was a predator who enforced it. He did not just dope to keep up; he doped to dominate and then used his power to silence others. That introduces a power asymmetry that the standard multipolar trap model sometimes glosses over. In a pure race to the bottom, everyone is equally trapped. In cycling, the winners were trapped until they won, and then they became the enforcers. You should acknowledge that the trap was not symmetric. The losers suffered the health risks and the career death, while the winners reaped the rewards until the music stopped. This nuance does not invalidate the framework, but it adds necessary complexity. You are not just describing a situation where everyone loses; you are describing a situation where everyone risks losing, but some win big enough to justify the risk, which keeps the game going.

  Another place where the model is silent is on the role of the fans and sponsors as externalities. In the Moloch framework, the negative outcome is usually internal to the players. In cycling, the biggest victims were arguably the fans and the sponsors who were defrauded. The riders and teams might have viewed the situation as a necessary evil to produce a spectacle, but the consumers were buying a lie. The trap persisted because the fans kept watching. As long as the product was entertaining, the revenue flowed, and the incentives remained. The framework does not inherently account for the demand side sustaining the supply side of the trap. You could argue that the fans were also trapped in a way, wanting clean sport but rewarding fast times, but that might be stretching it. It is better to admit that the model focuses on the producers and leaves the consumers as background conditions that maintained the payoff structure.

  Finally, do not force the framework to explain the end of the era. The trap did not dissolve because everyone suddenly agreed to be nice. It dissolved because the technology changed the math. The biological passport made the cost of defection too high. This is a crucial distinction for your conclusion. The Moloch trap is stable until an external force changes the rules. You should avoid implying that the sport learned its lesson morally. They did not. They just got caught more often. If a new undetectable substance emerged tomorrow, the model predicts the trap would reset. That is a strong, cynical conclusion that fits the framework well. So, to sum up, your instinct about the omertà is good, but frame it as enforcement of the equilibrium rather than a solution to it. Consider modeling the teams as the primary players to handle the systemic nature of the doping. And be willing to point out that the trap benefited some players temporarily, which is why it was so hard to break. It was not just a tragedy where everyone lost; it was a tragedy where the incentives rewarded the behavior that caused the tragedy. If you can hold that tension without simplifying it, you will have a really strong paper. Good luck with the writing, and feel free to send over a draft if you want a second look at the argument flow.
