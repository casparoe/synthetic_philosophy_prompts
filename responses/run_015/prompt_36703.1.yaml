      *   Tackle the 50% rule.
      *   Address Festina and the persistence of the trap.
      *   Grapple with the omertà/coordination paradox.
      *   Discuss the limits of the model.
      *   Conclude with advice on the paper.

      *(Self-Correction during drafting)*: I need to ensure I don't use any formatting that looks like a list. Just paragraphs. I need to make sure I don't bold any terms. I need to keep the flow natural.

      *(Refining the Omertà point)*: The user asks if the omertà is an anomaly. I should argue it's not an anomaly but a feature of how traps stabilize. A trap isn't just random defection; it's often stabilized by norms that punish cooperation with the *outside* (regulators). The coordination is to prevent the *escape* from the trap. So the Moloch framework holds, but you have to specify that the coordination is defensive against the regulator, not offensive against the competition. Actually, it's both. You coordinate to ensure everyone stays in the race. If someone quits the race (goes clean), they lose. If someone tells (whistleblows), they are punished. So the coordination enforces the defect-defect equilibrium.

      *(Refining the Unit of Analysis)*: If riders are the players, the omertà looks like coordination. If teams are the players, the omertà is just standard competitive secrecy until it becomes systemic collusion. The Festina affair showed team-level coordination. So the "multipolar" part might be better viewed as teams vs teams, or even sponsors vs sponsors. But the riders feel the trap most acutely. I'll suggest the student clarify the unit of analysis.

      *(Refining the "Worse for All" claim)*: Did everyone lose? Winners won money and fame until caught. Losers lost health. Fans lost trust. The sport nearly died. So yes, collectively worse off in the long run, even if short-term winners existed. This fits the trap.

      *(Final Polish)*: Check for any accidental bolding or list-like structures. Ensure the tone is conversational but rigorous.

