answer: |-
  **Setting:** *The plaza before the Centennial Arch. A holographic interface hovers between the interlocutors, displaying the four-dimensional digital archive—a cascading visualization of every stone replacement and structural adjustment over two centuries.*

  **Perdurantist:** Observe the visualization. The archive does not show a single entity persisting through change; it displays a continuum of distinct temporal stages. The stone configuration at $t_1$ is numerically distinct from the configuration at $t_2$. What we call "the Arch" is merely a mereological fusion of these spatiotemporal parts, bound together by causal continuity and curatorial intervention. The digital record confirms that there is no single substance wholly present at each moment; there is only a carefully managed sequence of material arrangements.

  **Endurantist:** You mistake the biography of the object for its ontology. The archive tracks the history of a single subject, not the succession of different entities. While the material constituents have been entirely renewed, the Arch remains wholly present at each moment of its existence. Its identity is not grounded in the persistence of specific atoms, but in the continuity of its form, function, and legal designation. The city council designates this structure as a single civic monument, and that institutional fact secures its diachronic identity despite the material turnover.

  **Perdurantist:** But does institutional recognition genuinely ground diachronic identity, or does it merely track a social convention? You argue that the legal designation makes it the same object, but metaphysics must distinguish between what exists mind-independently and what exists relative to our interests. The archive reveals a chain of causal relations between distinct temporal slices. To say the Arch is "one object" is to impose a unity upon a sequence that is, strictly speaking, a collection of different entities linked by similarity and cause. The legal status tracks this sequence for practical purposes, but it cannot manufacture metaphysical identity where there is only genidentity.

  **Endurantist:** That distinction collapses when we consider the normative force of our preservation practices. If your four-dimensional analysis were correct, conservation would be merely the replacement of one temporal part with another similar one. But we do not treat the Arch as a sequence of replaceable stages; we treat it as a singular entity demanding protection. Does a four-dimensional analysis genuinely explain our preservation practices, or does it merely redescribe them in eliminativist terms? By reducing the Arch to a fusion of stages, you render the object's unity incidental. Yet, when we restore a damaged section, we believe we are repairing *this* object, not constructing a successor to a perished one. The 3D view captures the reality that the object itself survives the change; the 4D view suggests the object is merely the sum of the changes.

  **Perdurantist:** I do not deny the reality of the object; I deny that it is wholly present at any instant. The Arch is a four-dimensional worm, and the restoration work is indeed an intervention on that worm's later stages. Your concern about eliminativism suggests you fear I am denying the existence of the Arch, but I am only denying that it is a 3D substance enduring through time. The archive proves that the "wholly present" Arch is an incomplete slice of the true entity. We preserve the worm, not the stage. However, I maintain that the unity you perceive is interest-relative. If the archive showed a gap in causal continuity—say, the Arch was demolished and rebuilt ten years later using the same plans—your institutional view might still claim identity, whereas my view would acknowledge a break in the spatiotemporal fusion.

  **Endurantist:** And therein lies the divergence. If the Arch were demolished and rebuilt according to the same legal charter and functional role, I would argue it could remain the same artifact, because the identity of artifacts is constituted by their intentional and institutional history, not merely their spatiotemporal continuity. You prioritize the physical chain of cause and effect; I prioritize the continuity of the organized whole. The archive is a tool for tracking that history, but it does not dictate the metaphysical category. To insist that the Arch is nothing over and above its temporal parts is to ignore that the "Arch" is a functional kind, not merely a material sum. The stones are replaced to serve the endurance of the form.

  **Perdurantist:** Then we agree that the archive is essential, but disagree on what it maps. I see it mapping the boundaries of a spacetime region occupied by a complex event. You see it mapping the life of a substance.

  **Endurantist:** Precisely. And until we can reconcile whether substance or event is the primary category of artifacts, the Arch stands before us as both a single monument and a century of stones, depending on how one cuts time.
