prompt: |-
  For several years a small reading group I belong to has kept returning to Parfit's hitchhiker and to the wider family of cases in which it seems rational to become the sort of agent who would act irrationally in a one-off choice. The basic case is familiar: you are stranded, a driver offers a ride on condition that you pay later, you know you will never see the driver again and that no sanction can reach you, and you also know that only someone disposed to pay will get the ride in the first place. We have added two variants that have made the argument worse rather than better. In the first, the driver can see a cheap but imperfect signal of your disposition, so the question becomes whether the signal or the disposition is doing the rationalizing. In the second, the hitchhiker is not one person but a small group that must decide together whether to cultivate a reputation for paying, which raises the question whether the rationality at issue belongs to individuals, groups, or practices. The group divides into three camps and none has moved in months. The first says the case shows that decision theory must evaluate dispositions or policies rather than isolated acts, so paying is rational as part of the policy that secures the ride. The second says that is a confusion: the disposition may be causally advantageous, but the act of paying, once it is chosen, is still irrational, and the theory should say so plainly; what we have is a case where it is rational to be irrational. The third says both sides are answering the wrong question, because the promise is not a one-off act but a move in a social practice of promising, and the real question is what the practice requires of someone who has already accepted its benefits. Every reply is anticipated, and the exchange now feels less like an unfinished argument than like arguments that have stopped touching.

  I want a diagnosis rather than a verdict. Is this a substantive disagreement about the correct theory of rational choice, a verbal dispute about whether the word rational attaches to acts or to dispositions, or two or three different questions being asked under one heading—one about the causal efficacy of character, one about the logic of counterfactual commitment, one about the norms internal to promising? Is a hidden formal or empirical question doing the work, perhaps about whether the disposition is detectable or about how to model subjunctive dependence? And given your diagnosis, what would count as progress: a distinction, a formal result, a change of question, or an argument that no progress should be expected because the camps start from intuitions that cannot be argued for? I am especially interested in whether the impasse survives once we separate the question of what it is rational to do from the question of what it is rational to be, and whether the practice-based reading changes the kind of disagreement or merely relocates it. Please engage the camps as I have described them, and be concrete about what each side would have to give up for the debate to move.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** A small reading group has been stuck for years debating Parfit's Hitchhiker and variants.
      *   **The Core Case:** Stranded, driver offers ride if you pay later, no enforcement, only dispositional payers get the ride.
      *   **Variants:**
          1.  Imperfect signal of disposition (signal vs. disposition).
          2.  Group of hitchhikers deciding together (individual vs. group rationality).
      *   **The Three Camps:**
          1.  *Dispositionalists/Policy-Based:* Decision theory should evaluate dispositions/policies. Paying is rational because it's part of the ride-securing policy. (EDT/CDT+ / Functional Decision Theory vibes).
          2.  *Act-Based/Separatists:* Disposition is causally advantageous, but the *act* of paying is irrational once the ride is secured. Rational to be irrational. (Classic CDT).
          3.  *Practice-Based:* It's not a one-off; it's a social practice of promising. Norms internal to the practice dictate payment.
      *   **The Problem:** Arguments are anticipated, talking past each other, feeling like "arguments that have stopped touching."
      *   **The Goal:** A *diagnosis* rather than a verdict.
      *   **Specific Questions to Address:**
          *   Is it substantive theory, verbal dispute, or different questions under one heading?
          *   Is there a hidden formal/empirical question (detectability, subjunctive dependence)?
          *   What counts as progress (distinction, formal result, change of question, acceptance of impasse)?
          *   Does separating "rational to do" vs. "rational to be" help?
          *   Does the practice-based reading change or relocate the disagreement?
          *   Engage the camps concretely: What would each have to give up to move?

  2.  **Deconstruct the Impasse (Diagnosis):**
      *   *Observation:* The three camps are operating with different *objects* of evaluation and different *normative frameworks*.
      *   *Camp 1 (Policy):* Object = Disposition/Algorithm. Framework = Consequentialist/Instrumental (maximize expected utility across the whole timeline).
      *   *Camp 2 (Act):* Object = Isolated Action at $t_2$. Framework = Causal/Local (maximize utility given the current state).
      *   *Camp 3 (Practice):* Object = Role within an Institution. Framework = Deontological/Constitutive (rules of the game).
      *   *Diagnosis:* This is primarily a **categorial confusion** masquerading as a substantive disagreement. They are answering different questions using the same label ("rational"). However, it's not *merely* verbal because the choice of framework has downstream consequences for how we build agents or societies.
      *   *Hidden Question:* The "detectability" variant highlights the mechanism of correlation. The "group" variant highlights the unit of agency.
      *   *Separation of "Do" vs. "Be":* This is the key to unlocking Camp 1 vs. Camp 2. Camp 3 is orthogonal to this distinction.

  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the depth of the stalemate. Validate that this is a classic "cluster concept" problem in decision theory. State the core diagnosis upfront: It is a **polysemous disagreement** (different questions under one heading) fueled by **level-confusion** (algorithm vs. action vs. institution).

      *   **Diagnosing the Three Camps:**
          *   *Camp 1 (Policy):* Focused on *ex-ante* optimality. They view the agent as a program.
          *   *Camp 2 (Act):* Focused on *ex-post* optimality. They view the agent as a momentary chooser.
          *   *Camp 3 (Practice):* Focused on *constitutive* norms. They view the agent as a social participant.
          *   *Verdict:* It's not just verbal. It's about *what decision theory is for*. Is it a guide for action? A tool for design? A description of norms?

      *   **The "Rational to Do" vs. "Rational to Be" Distinction:**
          *   This is the crucial move.
          *   Camp 1 and 2 can agree if they distinguish *Rationality of Selection* (choosing the disposition) vs. *Rationality of Execution* (the act itself).
          *   Camp 2 admits it's rational to *become* the type who pays. Camp 1 admits the act *at the moment* yields negative utility compared to defecting (counterfactually).
          *   *Progress Condition:* Camp 2 must admit the disposition is rationally selectable. Camp 1 must admit the act is locally suboptimal.

      *   **The Signal Variant (Empirical/Formal Hidden Question):**
          *   This tests the *mechanism* of the correlation.
          *   If the signal is cheap talk, Camp 2 wins (no causal link).
          *   If the signal is a hard constraint (e.g., brain scan), Camp 1 wins (subjunctive dependence).
          *   *Diagnosis:* The disagreement often hides an empirical assumption about *how* the driver knows. If it's magic prediction, CDT breaks. If it's behavioral profiling, CDT holds.

      *   **The Group Variant (Unit of Agency):**
          *   This challenges the "individual" assumption.
          *   Camp 3 shines here (practice). Camp 1 struggles with aggregation. Camp 2 struggles with collective action problems.
          *   *Diagnosis:* This shows the limits of methodological individualism.

      *   **The Practice-Based Reading (Camp 3):**
          *   Does it change or relocate? It *relocates* the debate from instrumental rationality to normative validity.
          *   It changes the game from "How do I get what I want?" to "What am I obligated to do given I entered this practice?"
          *   *Conflict:* Camp 1 & 2 ask "Why should I?" Camp 3 says "Because you promised."
          *   *Progress:* Camp 3 needs to explain why the practice binds a one-off case. Camp 1 & 2 need to admit that "rationality" might include rule-following as a terminal value.

      *   **What Counts as Progress?**
          *   Not a verdict (who is right).
          *   A **Taxonomy of Rationality**. Acknowledge that "Rational" applies to:
              1.  *Strategic Design* (Camp 1)
              2.  *Tactical Execution* (Camp 2)
              3.  *Institutional Compliance* (Camp 3)
          *   Formal Result: Newcomb-like problems require a theory that handles *logical correlation* (FDT/TLDT) vs. *causal correlation* (CDT).
          *   Change of Question: Stop asking "Is paying rational?" Ask "Under which description of agency is paying rational?"

      *   **Concrete Concessions (The "Give Up" List):**
          *   *Camp 1:* Give up the claim that the *act* maximizes utility at $t_2$. Admit it's a sacrifice.
          *   *Camp 2:* Give up the claim that the *disposition* is irrelevant. Admit that a theory of rationality that ignores disposition selection is useless for agents who can self-modify.
          *   *Camp 3:* Give up the claim that this solves the instrumental problem. Admit that if the agent doesn't value the practice, the "ought" lacks motivational grip.

  4.  **Refining the Tone:**
      *   Philosophical, precise, empathetic to the frustration.
      *   Avoid taking sides (no verdict).
      *   Use the terminology of the prompt (camps, variants).
      *   Ensure the distinction between "substantive," "verbal," and "different questions" is clear. (It's a mix: primarily different questions, but with substantive stakes regarding agent architecture).

  5.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "signal" variant enough? *Adjustment:* Ensure I link the signal variant to the "hidden empirical question" about detectability.
      *   *Check:* Did I address the "group" variant? *Adjustment:* Link this to the "unit of agency" and Camp 3's strength.
      *   *Check:* Did I answer "what counts as progress"? *Adjustment:* Make sure the "Taxonomy" idea is presented as a concrete path forward.
      *   *Check:* Is the distinction between "rational to do" and "rational to be" central? *Yes, make it the pivot point.*

  6.  **Final Polish:** Check against the prompt's specific constraints (engage camps as described, be concrete about concessions). (The resulting output matches the detailed response provided previously.)
answer: |-
  This impasse is not a failure of argumentation but a symptom of a deeper structural ambiguity in the concept of "rationality" itself. Your diagnosis request is apt: this is not merely a substantive disagreement about a single theory, nor is it purely verbal. It is a **categorial confusion** where three distinct normative questions are being asked under the single heading of "rational choice."

  The stalemate persists because each camp is optimizing for a different *object* of evaluation (act, disposition, or practice) using a different *temporal perspective* (ex-post, ex-ante, or timeless).

  Here is a diagnosis of the deadlock, an analysis of the variants, and a concrete map of what each camp would need to concede for progress to occur.

  ### 1. The Diagnosis: Three Questions, One Label

  The debate feels like "arguments that have stopped touching" because the camps are operating in different normative domains.

  *   **Camp 1 (Dispositionalists)** is asking a **design question**: "What decision-algorithm should I install in myself *ex-ante* to maximize lifetime utility?"
  *   **Camp 2 (Act-Theorists)** is asking a **control question**: "Given my current state and causal powers at $t_2$, which motion maximizes utility?"
  *   **Camp 3 (Practitioners)** is asking a **constitutive question**: "What does participation in this normative institution require of me?"

  **Is it verbal or substantive?**
  It is primarily a **polysemous disagreement** (different questions under one heading), but it has substantive stakes. If you are building an AI, Camp 1 is correct (you want the code that gets the ride). If you are a judge assigning blame, Camp 2 has traction (the act of paying was causally useless). If you are a sociologist, Camp 3 is correct (the act sustains the institution). The conflict arises because decision theory tries to be all three: a guide for design, a guide for action, and a description of norms.

  **The Hidden Formal/Empirical Question:**
  You asked if a hidden question is doing the work. Yes. It is the question of **subjunctive dependence vs. causal independence**.
  *   Camp 1 assumes your current choice is *logically correlated* with the driver's prediction (Newcomb-like).
  *   Camp 2 assumes your current choice is *causally independent* of the past prediction (standard causality).
  *   The **Signal Variant** exposes this. If the signal is imperfect but detectable, the correlation is probabilistic. If the signal is a brain scan, the correlation is logical. The impasse often hides an unstated assumption about *how* the driver knows. Camp 2 assumes the past is fixed and independent; Camp 1 assumes the past prediction depends on the output of the algorithm you are currently running.

  ### 2. The "Rational to Do" vs. "Rational to Be" Distinction

  You asked if the impasse survives separating these. **No, this distinction is the key to dissolving the Camp 1 vs. Camp 2 deadlock.**

  *   **Rational to Be (Camp 1):** It is instrumentally rational to *be* the sort of agent who pays. This is an *ex-ante* evaluation.
  *   **Rational to Do (Camp 2):** It is instrumentally irrational to *pay* once the ride is secured. This is an *ex-post* evaluation.

  **Why the impasse persists:**
  Camp 1 refuses to admit the act is locally irrational because they fear it undermines the disposition. Camp 2 refuses to admit the disposition is rationally relevant because they fear it undermines act-evaluation.

  **Progress Condition:**
  The debate moves only if both sides accept a **two-stage model of rationality**:
  1.  **Selection Stage:** It is rational to select/ cultivate the disposition to pay.
  2.  **Execution Stage:** It is locally irrational to execute the payment *if* evaluated solely by its immediate causal consequences.

  Camp 1 must concede that the act itself is a **sacrifice** (it costs utility relative to defecting). Camp 2 must concede that a theory of rationality that ignores the Selection Stage is **self-defeating** for agents capable of self-modification or pre-commitment.

  ### 3. The Practice-Based Reading (Camp 3)

  You asked if Camp 3 changes the disagreement or relocates it. It **relocates** the disagreement from *instrumental efficiency* to *normative validity*.

  Camp 3 is immune to the Camp 1 vs. Camp 2 dispute because it rejects the premise that rationality is solely about maximizing personal utility in a vacuum. By framing the promise as a move in a social practice, Camp 3 argues that the "payoff" isn't just the ride; it's the maintenance of the status of "promiser."

  **Does it solve the problem?**
  Only if the agents care about the practice. If the hitchhiker is a pure egoist (as Camp 1 and 2 assume), Camp 3's argument lacks motivational grip. "The practice requires it" answers "What ought I to do?" but not "Why is it *rational* (in the instrumental sense) to do it?"

  **Relocation:**
  The disagreement shifts to: **Is adherence to social practices a terminal value of rationality?**
  *   If yes, Camp 3 wins.
  *   If no, Camp 3 is just describing a psychological constraint, not a rational requirement.

  ### 4. The Group Variant (Unit of Agency)

  The second variant (group of hitchhikers) highlights that Camp 1 and Camp 2 are implicitly assuming **methodological individualism**.
  *   **Camp 2** struggles here because if the group decides *not* to cultivate the reputation, the individual act of paying is even *more* irrational (free-rider problem).
  *   **Camp 1** struggles with aggregation: Is the "disposition" a property of the individual or the collective?
  *   **Camp 3** thrives here, as practices are inherently collective.

  This variant suggests the impasse is partly due to an underspecified **ontology of the agent**. If the "agent" is the group, Camp 1's policy-based view becomes easier to defend (the group policy secures the ride). If the "agent" is the individual, Camp 2's act-based view becomes harder to defend (individual rationality leads to collective ruin).

  ### 5. Concrete Concessions: What Each Camp Must Give Up

  For the debate to move from "talking past" to "integration," each camp must surrender a specific claim.

  **Camp 1 (Dispositionalists) must give up:**
  *   **The Claim:** "Paying is rational *at the moment of payment* in the same sense that breathing is rational."
  *   **The Concession:** They must admit that paying is a **local utility loss**. They must frame rationality as *global consistency* rather than *local optimization*. They need to acknowledge that they are advocating for a theory of **agent design**, not necessarily a theory of **momentary choice**.
  *   **Why:** Without this, they are denying the causal structure of the world (that the past prediction is already fixed).

  **Camp 2 (Act-Theorists) must give up:**
  *   **The Claim:** "Rationality is only about the causal consequences of the immediate act."
  *   **The Concession:** They must admit that a theory of rationality that makes it impossible to secure the ride is **pragmatically self-defeating**. They must accept that "rationality" might need to evaluate **policies** or **dispositions** as the primary object, with acts being derivative.
  *   **Why:** Without this, they are defending a theory that guarantees its users will be stranded.

  **Camp 3 (Practice-Theorists) must give up:**
  *   **The Claim:** "The social practice resolves the instrumental dilemma."
  *   **The Concession:** They must admit that for an agent who does not internalize the practice, the obligation is **external**. They cannot claim the egoist is *irrational* for defecting, only that they are *untrustworthy* or *immoral*. They must distinguish between **Rationality** (instrumental) and **Normativity** (social).
  *   **Why:** Without this, they are conflating "ought" (moral/institutional) with "ought" (prudential/instrumental).

  ### 6. What Counts as Progress?

  Given this diagnosis, a verdict on who is "right" is the wrong goal. Progress would look like one of the following:

  1.  **A Taxonomy of Rationality (Conceptual Progress):**
      The group agrees to stop using "rational" as a monolith. You adopt a terminology like:
      *   *Ex-ante Rationality* (Camp 1): Choosing the right algorithm.
      *   *Ex-post Rationality* (Camp 2): Executing the right move given the algorithm.
      *   *Institutional Rationality* (Camp 3): Complying with the rules of the game.
      *   *Result:* You acknowledge Parfit's Hitchhiker is a case where *Ex-ante* and *Ex-post* rationality diverge.

  2.  **A Formal Result on Detectability (Technical Progress):**
      Focus on the **Signal Variant**. Model the correlation coefficient between the signal and the act.
      *   Show formally that as the signal becomes more accurate (approaching perfect prediction), Camp 2's Expected Utility calculation converges with Camp 1's.
      *   Show that at low accuracy, Camp 2 dominates.
      *   *Result:* The disagreement becomes an empirical threshold question: "How accurate must the predictor be for policy-based reasoning to override act-based reasoning?"

  3.  **A Change of Question (Philosophical Progress):**
      Accept that the question "Is paying rational?" is ill-posed. Replace it with: "What kind of agent do we want to be in a world where predictions are possible?"
      *   This validates Camp 1's intuition (we want to be the kind of people who get rides) without forcing Camp 2 to deny causal facts (paying costs money).

  ### Summary Recommendation for Your Group

  The impasse survives because you are trying to solve a **multi-level problem** with a **single-level vocabulary**.

  1.  **Separate the questions:** Explicitly distinguish the *rationality of the disposition* from the *rationality of the act*. Camp 1 and 2 can agree once this distinction is made.
  2.  **Isolate the Practice:** Treat Camp 3's argument as a separate layer. It explains why we *feel* we should pay, but it does not solve the instrumental paradox for the non-believer.
  3.  **Focus on the Signal:** Use the first variant to force a formal discussion on correlation. If the signal is weak, Camp 2 is right. If the signal is strong (logical dependence), Camp 1 is right. The "truth" lies in the mechanics of the prediction, not the intuition.

  If you make these distinctions, you will not find a verdict, but you will find that the "arguments that have stopped touching" were actually touching different parts of the same elephant.
