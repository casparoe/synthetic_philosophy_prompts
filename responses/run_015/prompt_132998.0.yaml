answer: |-
  Two philosophers, Elena and Marcus, are defending the "Grammatical Core" research programme at a departmental colloquium. The programme's hard core asserts that every apparently substantive philosophical disagreement is ultimately reducible to a grammatical ambiguity. The protective belt contains auxiliary claims about particular historical debates—for instance, that Kant and Hume were merely talking past each other regarding the copula.

  The recurring anomaly, however, is Gödel's incompleteness theorems, which keep producing results that resist such reduction by demonstrating mathematical truths that cannot be derived from formal syntax alone.

  Elena proposes a new auxiliary hypothesis to save the core: "Gödel's 'undecidable' propositions are not substantive truths, but merely artifacts of a missing grammatical operator in standard notation."

  Marcus, playing the role of the méthodologist, asks, "Is this shift progressive or degenerating?"

  "Progressive," Elena replies confidently. "It yields a novel prediction."

  "What fact does it predict?" Marcus asks.

  "It predicts that any future mathematical breakthrough will eventually be shown to be a notational variant of a tautology."

  Marcus frowns. "But you cannot verify that until the breakthrough occurs and you analyze it. You aren't predicting the mathematics; you're predicting your own future reinterpretation."

  "Precisely," Elena says. "The novel fact is that whatever theorem emerges next, we will successfully classify it as a linguistic confusion after the fact."

  Marcus sighs. "So the auxiliary hypothesis doesn't anticipate the world; it merely schedules your next ad hoc adjustment."

  "Exactly," Elena smiles. "It's not a degenerating problemshift. It's a *pre-emptive* degeneration."
