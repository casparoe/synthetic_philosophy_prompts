answer: |-
  The framing is sound enough to proceed, but with one crucial caveat: the "commons problem" may be less a linguistic reality than a political weapon. States often invoke "dilution" to shame advocates into silence, not because the label actually loses power, but because the obligation to intervene becomes inconvenient. If this is true, the gravity/elasticity trade-off is a constraint imposed by perpetrators, not by semantics. Your budget should test this assumption before accepting it as law. Additionally, while conceptual work shapes language, it rarely moves institutional practice without a concurrent political hook. Papers must be drafted not just for accuracy, but for deployability in media and legal briefs.

  Here are the three lines of work I would fund, in order.

  **1. The Dilution Question (Gravity vs. Elasticity Validity)**
  *   **Why Upstream:** This determines your risk tolerance. If loose application does not actually spend credibility, you can maximize elasticity immediately. If it does, you must conserve the label. This is the foundational constraint on all subsequent advocacy.
  *   **Tractability (2 Years/No Data):** A philosopher or political theorist can analyze historical cases of label fatigue (e.g., "fascist," "terrorist," "ethnic cleansing") to distinguish semantic saturation from political backlash. They can establish whether the mechanism of dilution is linguistic or political.
  *   **Move Up/Down:** Move **up** if a major atrocity occurs where "genocide" is widely used but intervention fails anyway (suggesting gravity is already low). Move **down** if empirical sociologists publish data showing public outrage correlates strictly with legal classifications (suggesting the trade-off is real and rigid).

  **2. The Archives Problem (Intent vs. Evidentiary Bias)**
  *   **Why Upstream:** This addresses the immediate tactical barrier. Even if you keep the intent standard, you need to prove it applies to chaotic killing, not just bureaucratic killing. This expands elasticity within the current legal framework without requiring treaty change.
  *   **Tractability (2 Years/No Data):** A legal historian can compare evidentiary records from the Holocaust (bureaucratic) versus Rwanda or Darfur (chaotic) to demonstrate how the intent test systematically excludes non-bureaucratic atrocities. They can propose evidentiary presumptions to correct this.
  *   **Move Up/Down:** Move **up** if the ICC or ICJ rejects genocide charges due to lack of documentary intent evidence in a high-profile case. Move **down** if courts begin accepting circumstantial patterns of destruction as sufficient proof of intent.

  **3. Replacing Intent with a Destructive-Pattern Standard**
  *   **Why Upstream:** This is the long-term legal goal. Restoring Lemkin's wider concept requires changing the legal test from "intent to destroy" to "pattern of destruction." This maximizes elasticity but risks the greatest political resistance.
  *   **Tractability (2 Years/No Data):** A legal philosopher can draft a normative argument for why "destructive pattern" captures the moral harm of genocide better than "intent," providing the intellectual architecture for future treaty amendment or judicial interpretation.
  *   **Move Up/Down:** Move **up** if a state party or influential bloc signals openness to reviewing the Genocide Convention. Move **down** if major powers explicitly reinforce the intent standard in UN resolutions.

  **Line of Work to Decline: The Distinctive Moral Kind**
  *   **Why Overrated:** This asks whether group destruction is inherently worse than the same number of non-group deaths. Even if philosophers prove it is not morally distinct, the Genocide Convention remains law, and journalists will still use the label for mobilization. The answer changes nothing about legal thresholds, political will, or advocacy strategy. It is ontologically interesting but operationally inert.

  **Criteria Trade-offs**
  I am prioritizing **upstream-ness** (foundational assumptions) over **tractability** (ease of completion). The Dilution Question is the hardest to answer without data, but it dictates the entire strategy. I am prioritizing **downstream effect** (change in practice) over **neglectedness** (academic novelty). The Archives Problem is well-trodden in history but neglected in advocacy toolkits; funding it bridges that gap. The conflict arises between **immediate utility** (Archives) and **strategic validity** (Dilution); I choose validity because a valid strategy executed poorly is better than an invalid strategy executed well.

  \answer{Investigate the dilution question and credibility cost mechanisms}
