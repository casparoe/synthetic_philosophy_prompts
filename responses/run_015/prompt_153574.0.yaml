prompt: |-
  hey — i need a piece for a tiny zine me and a friend put out at work (like 40 readers, all coworkers). ive been reading about this stuff on my own since something happened with my old boss, and i think there are two different things going on that people mash together: one where folks dont believe you because of what you are, and one where you dont have the words for what happened yet, so you cant even report it or be sure it really happened. i think ive seen them called something like testimonial and hermeneutical injustice — if ive got that backwards say so in one line at the top, but dont make the piece about the words.

  what i want is a chat transcript: me, at like 11:40 at night, trying to file a report through the new feedback bot at my job (call it whatever, mines called Harbor). the thing im reporting isnt harassment and isnt stealing credit exactly. more like he kept folding what i did into his own "vision," everyone called him generous for it, and i was supposed to be grateful. i have a name for it now, i call it the gratitude trap: the only words available for it make you sound like somebody who wont say thank you, so opening your mouth at all confirms youre the kind of person who complains. please actually use that and build the ending around it, its the part i care about.

  rules ive been turning over:

  - the bot has to be nice. genuinely helpful, uses my name, offers resources, says all the right supportive things. no sneering HR person, no villain, nobody in the story is bad. the damage should come entirely out of how the thing is built. keep any moment where one of its helpful moves makes things worse.
  - the funny/sick part has to be the mechanics: the dropdown has no slot for what happened; picking the nearest one makes the record wrong; when i correct it later i get flagged for inconsistency; my credibility rating drops every time i file, for reasons that make total sense inside the system; and the calmer and more exact i get, the more "coached" or "rehersed" i sound, which counts against me too. then the appeal asks me to describe the harm using the systems vocabulary, which is the one thing i dont have.
  - if you can land it, work this in: my report getting counted as engagement on the culture dashboard, so it turns up as evidence that people feel safe speaking up.
  - she never says any philosophical word, not once. somebody who knows this literature should be able to tell which of the two things is operating at each beat just from what goes wrong, and somebody who doesnt should just read a horrible conversation.
  - dont let her win and dont let her blow up. it should end with her giving up in a way that reads as the actual injury. deadpan, no winking at the reader, no line about how if only shed read a book.

  700 to 900 words, timestamps and ticket numbers welcome, and please dont add an explanation at the end. optional if it fits: a beat where i try to file on behalf of a coworker its happening to as well, and it goes nowhere for the opposite reason.
