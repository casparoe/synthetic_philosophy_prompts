prompt: |-
  hey so im in 11th grade and i run the review board for my schools ethics blog — people submit hot takes that mix science with morality and i have to approve or reject them in like five minutes. lately im seeing a ton of arguments that jump straight from "this is how brains/nature/tech works" to "therefore we should do X" and my philosophy teacher said thats the is-ought gap plus moores naturalistic falacy, but i dont have time to read the actual books. can you turn both of those ideas into a quick step-by-step checklist i can actually run on a submission? i need the questions in order, what counts as a pass or fail at each step, the exact point where the procedure stops and says "this is a values call not a fact," and honest flags for where the checklist will misfire or where i still have to use my own judgement. apply it to three real submissions: 1) "evolution made us tribal so we ought to prioritize our own group over outsiders," 2) "fMRI scans show altruism lights up reward centers so being selfless is the correct moral system," and 3) "predictive policing AI is 90% accurate so we should use it for sentencing." make sure one case is something where my gut wants to approve it but the procedure blocks it, and tell me what i should do then. also say what the procedure cant do at all, and write it casual like im actually asking, not like a textbook — and yes i know i spelled falacy wrong lol.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** 11th grader, runs an ethics blog review board.
      *   **Task:** Create a quick step-by-step checklist to evaluate submissions based on the "Is-Ought Gap" (Hume) and "Naturalistic Fallacy" (Moore).
      *   **Constraints:**
          *   Needs to be fast (5-minute review time).
          *   No reading actual philosophy books (simplified concepts).
          *   Casual tone (not textbook-like).
          *   Acknowledge the spelling error ("falacy" -> "fallacy") lightly.
          *   Must include: Ordered questions, Pass/Fail criteria, Stop point (values vs. facts), Limitations/Flags (where it misfires), Application to 3 specific cases.
          *   Specific requirement: One case where the gut wants to approve but the procedure blocks it, with advice on what to do.
          *   Specific requirement: Explain what the procedure *can't* do.

  2.  **Deconstruct the Philosophical Concepts (for the Checklist):**
      *   *Is-Ought Gap (Hume):* You can't derive a moral obligation ("ought") solely from a description of reality ("is").
      *   *Naturalistic Fallacy (Moore):* You can't define "good" purely in terms of natural properties (like pleasure, evolution, efficiency). Just because something is natural/efficient doesn't mean it's good.
      *   *Synthesis for a High Schooler:* Look for the jump from *fact* to *value* without a *bridge*.

  3.  **Drafting the Checklist (Iterative Process):**
      *   *Goal:* Make it punchy and actionable.
      *   *Step 1:* Identify the "Is." (What fact are they claiming?)
      *   *Step 2:* Identify the "Ought." (What action/value are they pushing?)
      *   *Step 3:* Look for the Bridge. (Is there a moral premise connecting them?)
      *   *Step 4:* The "Natural" Trap. (Are they saying "natural = good" or "efficient = good"?)
      *   *Stop Point:* If Step 3 fails, it's a values call, not a fact.

  4.  **Developing the Three Cases:**
      *   *Case 1 (Evolution/Tribalism):* "Evolution made us tribal" (Is) -> "Prioritize own group" (Ought). *Verdict:* Fail (Naturalistic Fallacy).
      *   *Case 2 (fMRI/Altruism):* "Altruism lights up reward centers" (Is) -> "Selflessness is correct" (Ought). *Verdict:* Fail (Is-Ought Gap). *Gut Check:* This feels good (altruism is nice), but the logic is flawed. This fits the "gut wants to approve but procedure blocks" requirement.
      *   *Case 3 (AI/Policing):* "AI is 90% accurate" (Is) -> "Use for sentencing" (Ought). *Verdict:* Fail (Missing value bridge on fairness/justice vs. accuracy).

  5.  **Addressing the "Gut vs. Procedure" Conflict:**
      *   Case 2 is the best candidate. Altruism is generally seen as "good." The science supports that it feels good. But the logic says "because it feels good, it is morally correct." That's the trap.
      *   *Advice:* Don't reject the *conclusion*, reject the *argument*. Ask the submitter to add the moral premise (e.g., "We ought to maximize neural reward").

  6.  **Addressing Limitations (What the checklist can't do):**
      *   It can't tell you what *is* right.
      *   It can't handle hidden values.
      *   It can't replace deep thinking on complex edge cases.

  7.  **Tone and Style:**
      *   Casual, peer-to-peer.
      *   Use slang appropriate for an 11th grader (but not cringe).
      *   Acknowledge the spelling mistake gently ("falacy" -> "fallacy").
      *   Format: Clear headings, bullet points.

  8.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* Make sure I don't get too technical with Moore vs. Hume. Just blend them into "The Fact-Value Jump."
      *   *Correction:* Ensure the "Stop Point" is clear.
      *   *Correction:* Make sure the advice on the "Gut Check" case is practical for a blog editor (e.g., send back for revision rather than flat reject).

  9.  **Final Polish:**
      *   Check against all constraints in the prompt.
      *   Ensure the "5-minute" vibe is present.
