answer: |-
  ### Glossary of Terms
  *Before proceeding, I will define the experimental vocabulary I will use to translate the philosophical positions. These definitions are restricted to their operational meaning in a laboratory context.*

  *   **Intervention:** An active manipulation of a control parameter (e.g., setting a voltage, opening a valve) distinct from passive observation. In Pearl's terms, this is $do(X=x)$ rather than $see(X=x)$.
  *   **Baseline (or Control Run):** The reference state of the apparatus against which signals are measured. Often the "null" state (beam off, shutter closed, zero bias).
  *   **State Space:** The set of all physically realizable configurations of the system defined by the model. Variables not in the state space are treated as non-existent for the purpose of the analysis.
  *   **Nuisance Variable:** A parameter that affects the outcome but is not of interest. In a design, we either hold these fixed (blocking) or randomize them to average out their effect.
  *   **Detection Limit:** The signal amplitude below which we cannot distinguish physical signal from noise. A "null result" is a measurement stating the signal is below this limit.
  *   **Protocol (SOP):** The Standard Operating Procedure defining the expected state of the apparatus. Deviations from protocol are flagged as faults; adherence is the background.
  *   **Boundary Condition:** A constraint fixed at the edge of the system (e.g., temperature of a heat sink, ground potential). It enables processes but does not supply energy flux.

  ---

  ### Part I: Translations of Philosophical Positions

  Here I translate the four main positions on omission causation into experimental design vocabulary. I will flag where I must supply a protocol or apparatus that the philosophical example often leaves vague.

  #### 1. The Counterfactual / Difference-Making View (Lewis, Woodward, Pearl)
  *Philosophical Claim:* $C$ causes $E$ if, had $C$ not occurred, $E$ would not have occurred (or would have been different). For omissions: The absence of $C$ causes $E$ if the presence of $C$ would have prevented $E$.
  *Experimental Translation:* This is a **Factorial Design** or a **Control Run**. To claim an omission caused a failure, you must demonstrate that toggling the relevant control parameter from "Absent" to "Present" changes the output variable significantly above the noise floor.
  *   *The Translation Work:* In the lab, "not pressing the button" is not a metaphysical primitive; it is a stable state maintained by a spring return, a latch, or a protocol. To translate Lewis's "closest possible world," I substitute "same apparatus configuration, different switch setting."
  *   *Honesty Check:* I am supplying **instrumentation**. Lewis allows vague similarity between worlds. In the lab, similarity is defined by holding all **nuisance variables** fixed. If the philosopher's example does not specify *how* the omission is maintained (e.g., did the gardener forget, or was the water main cut?), I am forced to assume a stable **baseline** state to make the counterfactual testable.

  #### 2. The Process / Conserved-Quantity View (Salmon, Dowe)
  *Philosophical Claim:* Causation requires a physical process transmitting a conserved quantity (energy, momentum, charge). Omissions transmit nothing; therefore, omissions cannot be causes. They are merely background conditions.
  *Experimental Translation:* This is **Signal Tracing** via **Conservation Laws**. We look for a continuous flux of energy or matter from source to detector. If the circuit is open, current is zero. If no photon hits the atom, no transition occurs.
  *   *The Translation Work:* In this vocabulary, an omission is a **Null Result** on a flux meter. It is not a "thing" that acts; it is the absence of a signal trace.
  *   *Honesty Check:* This translates cleanly but creates a conflict with engineering practice. In engineering, "loss of cooling" (an absence of flow) is treated as a root cause of meltdown. The Salmon–Dowe view forces me to classify "loss of cooling" not as a cause, but as the removal of a **boundary condition**. I am not adding apparatus here; I am restricting the definition of "cause" to "flux" rather than "constraint."

  #### 3. The Normative / Expectation View (Hart, Honoré, et al.)
  *Philosophical Claim:* Whether we call an omission a cause depends on norms, duties, or expectations. The gardener's failure causes the plant's death; the neighbor's failure does not, because only the gardener was supposed to water it.
  *Experimental Translation:* This is the **Protocol (SOP)** vs. **Nuisance Variable** distinction. The "cause" is the variable that violated the **Baseline** definition. If the SOP says "Valve A must be closed," and it is open, that deviation is the fault. If the SOP says nothing about Valve B, its state is a **nuisance variable** or part of the environment.
  *   *The Translation Work:* I am explicitly supplying a **Protocol**. In the lab, "normal operation" is defined by the setup sheet. Without a setup sheet (or a theoretical model of expected behavior), there is no deviation, only state changes.
  *   *Honesty Check:* This translation admits that "causation by omission" is a report on the **choice of state space**. It indicts the idea that causation is purely physical; it is partly administrative (what were we tracking?).

  #### 4. Double Prevention
  *Philosophical Claim:* $A$ causes $E$ by preventing $B$, where $B$ would have prevented $E$. (e.g., I kick the doorstop ($A$), which stops the doorstop from holding the door ($B$), so the door slams ($E$)).
  *Experimental Translation:* This is an **Interlock System** or **Active Shielding**. $B$ is a feedback loop or a physical block holding the system in a stable state. $A$ is an intervention that disables the feedback gain or removes the block.
  *   *The Translation Work:* I am modeling $B$ as a **negative feedback** mechanism or a **potential barrier**. $A$ is a signal that drives the gain to zero or lowers the barrier.
  *   *Honesty Check:* This translates very cleanly. In instrumentation, "enabling a trigger" is standard logic. The only addition is specifying that $B$ must be an active or physical constraint, not just a hypothetical.

  ---

  ### Part II: The Residue Report

  Here I test your two conjectures and address the three specific philosophical residues (Profligacy, Production/Permission, Legal Demand). For each, I determine if the difficulty indicts your **Framework** (experimental design misses something real about the world) or the **Debate** (philosophers are conflating distinct questions).

  #### Conjecture 1: Instrumented vs. Boundary vs. Bare Omissions
  *Your Claim:* Physicists never encounter "bare omissions." Intuitions hold for instrumented (switch wired off) and boundary (missing heat sink), but collapse for bare (nobody did anything).
  *Translation Analysis:*
  *   **Instrumented Omission:** Translates to a **Control State** maintained by apparatus (e.g., a shutter spring). Causation is clear: Spring force $\rightarrow$ Shutter Closed $\rightarrow$ No Signal.
  *   **Boundary Omission:** Translates to a **Missing Boundary Condition** (e.g., no ground connection). Causation is clear in engineering models (floating ground $\rightarrow$ noise), though Salmon–Dowe would call it a "condition" not a "cause."
  *   **Bare Omission:** Translates to **Undefined State Space**. If there is no apparatus and no protocol, there is no variable to toggle. "Nobody came" is not a variable in the model.
  *   *Verdict:* **Indicts the Debate.** The philosophical literature often treats "bare omissions" as ontologically equivalent to "instrumented omissions." Your framework reveals they are distinct categories of modeling. The "collapse of intuition" you suspect is actually the collapse of the **model**. When the model has no variable for the gardener's presence, his absence cannot be a parameter in the causal equation. The debate persists because philosophers resist treating causation as model-relative.

  #### Conjecture 2: Presences Detected, Absences Inferred
  *Your Claim:* Absences are inferred from a model plus a calibrated bound (null result). Presences are detected. Therefore, omission causation is model-mediated.
  *Translation Analysis:*
  *   In the lab, a "presence" is a signal $S > N$ (Signal greater than Noise). An "absence" is $S < L_D$ (Signal below Detection Limit).
  *   To claim "The lack of cooling caused the melt," you must have a model predicting $S_{cooling} > 0$ under normal conditions. The "cause" is the deviation between the **Model Prediction** and the **Measured Bound**.
  *   *Verdict:* **Indicts the Debate (partially), Indicts the Framework (slightly).**
      *   *Debate:* Philosophers often treat the absence as a concrete fact. Your framework shows it is an inference dependent on the **Detection Limit** and the **Expected Baseline**. This dissolves the metaphysical worry: it's not about "nothingness acting," it's about "expected signal failing to appear."
      *   *Framework:* There is a slight indictment here. If the "real world" contains causal powers that are fundamentally undetectable (no interaction cross-section), your framework cannot see them. However, given your background, you likely regard undetectable influences as outside physics. If so, the worry is purely epistemic, not metaphysical.

  #### Residue 1: The Profligacy Problem
  *The Problem:* If the gardener's failure caused the death, why not the Queen of England's failure? She didn't water it either.
  *Translation:* This is the problem of **Unblocked Nuisance Variables**. In a factorial design, infinite variables *could* affect the outcome. We do not list them all as causes. We select the **Control Variables** based on the **Protocol**.
  *   *Gardener:* Variable is in the **SOP**. Deviation is a fault.
  *   *Queen:* Variable is outside the **State Space**. Not tracked.
  *   *Verdict:* **Indicts the Debate.** The profligacy problem arises because the philosophical debate asks "What is causally dependent?" (which is infinite) rather than "What is causally relevant?" (which is a design choice). Your framework handles this via **Blocking**. We hold the Queen's actions fixed as part of the background environment. The debate treats this selection as a metaphysical puzzle; experimental design treats it as a resource allocation problem (what do we have sensors for?).

  #### Residue 2: Production vs. Permission
  *The Problem:* Some omissions feel like they "allow" an outcome (permission), others feel like they "produce" it. (e.g., Removing a shield allows radiation vs. Cutting a wire stops the machine).
  *Translation:* This is the distinction between **Drive Signals** and **Boundary Conditions**.
  *   *Production:* Energy flux enters the system (Beam On).
  *   *Permission:* A constraint is removed (Shutter Open).
  *   In control theory, these are mathematically distinct (forcing function vs. parameter change), but both change the output.
  *   *Verdict:* **Indicts the Debate.** Physics and engineering distinguish these cleanly (source term vs. coefficient). The philosophical confusion stems from using the word "Cause" for both. If you split the vocabulary into "Drive" and "Enable," the puzzle vanishes. The debate insists on a binary "Cause/Not Cause" for a continuous distinction in **Coupling Mechanisms**.

  #### Residue 3: The Legal Demand (Yes/No vs. Modeling)
  *The Problem:* Tort law demands a binary verdict: Did the failure cause the harm? You view this as a modeling decision (confidence intervals).
  *Translation:* Law requires a **Threshold Decision** on a **Continuous Variable**.
  *   In the lab, we report $p$-values or confidence intervals. We say "We reject the null hypothesis at 95% confidence."
  *   Law asks: "Is it True or False?"
  *   *Verdict:* **Indicts the Legal Demand (and the Debate).** Your framework is correct: causation in complex systems is probabilistic and model-dependent. The law forces a **Boolean** onto a **Bayesian** reality to assign liability. The philosophical debate often mirrors the legal demand (seeking necessary and sufficient conditions) rather than the scientific reality (correlation, intervention, and confidence). The "disagreement" in philosophy is often a proxy for "Where should we set the liability threshold?" which is ethical, not metaphysical.

  ---

  ### Final Summary: Framework vs. Debate

  You asked whether your discomfort is occupational deformation or insight. Based on this translation:

  1.  **Your Framework is Robust:** The concepts of **State Space**, **Protocol**, **Intervention**, and **Detection Limit** successfully map the coherent parts of the causation debate. Where the translation works (Double Prevention, Instrumented Omission), the physics vocabulary is precise and actionable.
  2.  **The Debate is Conflated:** The "Residue" items (Profligacy, Bare Omission, Legal Binary) do not reveal limitations in experimental design. They reveal that the philosophical debate is asking multiple distinct questions under the single label "Causation."
      *   Sometimes they mean "Physical Flux" (Process view).
      *   Sometimes they mean "Counterfactual Dependence" (Lewis/Woodward).
      *   Sometimes they mean "Normative Violation" (SOP/Protocol).
      *   Sometimes they mean "Liability Assignment" (Legal).

  **Conclusion:** Your discomfort is **insight**, not deformation. The philosophical literature often treats "Causation" as a single natural kind waiting to be discovered. Your experimental training correctly identifies it as a **modeling relation** dependent on the choice of variables, the definition of the baseline, and the purpose of the inquiry (prediction vs. control vs. blame).

  The "Bare Omission" is the smoking gun. In your lab, a variable without a measurement channel or a control knob does not exist in the analysis. The philosophical insistence that "Bare Omissions" are real causes is an insistence that the world contains variables that are not in the state space. That is not physics; that is metaphysics. Your framework indicts the debate for refusing to specify the apparatus required to make the omission a variable in the first place.
