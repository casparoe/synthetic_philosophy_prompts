      *   *Virtù* $\rightarrow$ Alpha generation, risk controls, dynamic hedging, capital adequacy, adaptability of strategy.
      *   *The Flood* $\rightarrow$ Liquidity crisis, market crash, correlation breakdown (everything goes to 1).
      *   *Dykes/Dams* $\rightarrow$ Stop-losses, position sizing limits, stress testing, capital buffers.
