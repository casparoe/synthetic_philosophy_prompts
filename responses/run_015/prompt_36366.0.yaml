      *   *The River Metaphor:* Rivers flood when calm weather turns stormy. Men can build dykes and dams (preparation) to channel the water when it rises.
      *   *50/50 Rule:* Fortune controls half our actions; *virtù* controls the other half.
      *   *Boldness/Youth:* Fortune is a woman; to master her, one must beat and coerce her (problematic metaphor, but implies aggression). She favours the impetuous over the cautious.
      *   *Adaptability:* The man who suits his mode of proceeding to the qualities of the times succeeds; the one who doesn't, fails.

  3.  **Drafting the Translation (Risk Management Vocabulary):**
