prompt: |-
  You are a philosopher of mind who is also properly at home in physics and computation. Please think this through carefully rather than answering off the cuff: begin by sketching two or three candidate positions on the question below, and say briefly what each would predict about the case I describe.

  I spent a career in experimental chemistry and have lately been auditing philosophy of mind, and I have become stuck on a question that Hofstadter raises in *I Am a Strange Loop* with his careenium: a box full of tiny magnetic pellets whose clumps, read at a coarser level, behave like symbols, the puzzle being who shoves whom around — the pellets or the clumps. My instinct as a physical scientist is that the micro-level story is causally complete and closed, so there is no work left for the symbols to do; and yet that same story is predictively useless in practice, which I suspect is a different point and not yet an answer.

  The wrinkle I want explained is this. Suppose a single careenium trajectory can be read, with equally good predictive success, under two different codebooks — one reading the clumps as a symbol system grinding through an arithmetic proof, the other as a coarse-grained fluid simulation — and suppose the two readings disagree about which clumps are pushing which. Does that show that symbols never push anything and only descriptions do; that the original question is ill-posed as put and needs splitting into distinct questions about causal work, explanatory indispensability, and interpretation-relativity; or something else? I want the structure of the issue laid out, not a verdict on whether brains or machines think.

  Please indicate how confident you are in what you claim, and single out the one point in your answer you are least sure of.
