  Section One, "The Specification"

  To escape presentism, a theory must meet five desiderata. First, **Conceptual Fidelity** addresses the collapse of conceptual translation and affective projection. It is non-negotiable (Contextualist), demanding that terms like "honor" or "property" retain their period-specific semantic weight rather than serving as vessels for modern emotion. This prevents the psychological colonization of dead minds. Second, **Moral Epoché** addresses the confusion between explaining an atrocity and endorsing its premises. This is non-negotiable (Hermeneutic), requiring the suspension of final verdicts during the reconstruction phase to allow causal mechanisms to surface without immediate condemnation. It forces the writer to hold two contradictory truths simultaneously. Third, **Archive Negativity** addresses the conflation of archive silence and genuine historical absence. A preference (Postcolonial), it treats gaps as active productions of power rather than empty voids to be filled by speculation. This respects the violence of the record itself. Fourth, **Temporal Specificity** addresses the equation of temporal distance and moral irrelevance. Non-negotiable (Normative-Realist), it asserts that distance alters context, not the validity of moral claims themselves. It prevents sliding into relativism. Finally, **Normative Unavailability** is a novel distinction addressing the phenomenology of lost values. It posits that past moral frameworks are not merely false but inaccessible; they are not errors to be corrected but landscapes we can no longer inhabit. This distinguishes between thinking someone is wrong and thinking someone is unreachable, a nuance standard teleological histories ignore. Among these, **Moral Epoché** does the most work excluding popular candidates, as most narratives inevitably rush to judgment, failing to sustain the tension required for genuine historical consciousness. Most popular histories seek comfort in condemnation or celebration; this requirement demands uncomfortable suspension. Contextualists prioritize the past's self-understanding; Hermeneutics prioritize the fusion of horizons; Normative-Realists prioritize truth across time; Postcolonials prioritize the politics of the record.

  Section Two, "The Motivating Cases"

  Consider a plantation ledger from 1840. The **Archive Negativity** requirement is triggered when an enslaved person appears only as a monetary value. Standard accounts might treat this silence as an absence of interiority; this desideratum forces the narrative to recognize the silence as a violent erasure, distinct from the person's actual non-existence. The novelist must mark the gap without fabricating a diary that never existed, acknowledging that the silence is a positive fact of oppression, not a negative fact of history. For **Moral Epoché**, consider a protagonist engaging in a duel to defend family honor. A presentist reading condemns the violence as barbaric; an endorsing reading romanticizes the code. The requirement demands the narrative explain the social necessity of the duel within its specific economy of reputation without validating the killing as morally permissible today. The economy of reputation dictated survival; without honor, one was socially dead. The character must feel the compulsion of honor as real, while the narrative structure maintains a critical distance that prevents the reader from accepting the premise as universally valid. These cases necessitate the requirements because without them, the past becomes either a mirror of the present or a zoo of exotic behaviors, rather than a coherent, alien world. The ledger case shows how silence can speak; the duel case shows how virtue can kill. Both require the writer to resist the urge to fix the past according to contemporary comfort, ensuring the narrative remains a site of investigation rather than a court of judgment.

  Section Three, "Joint Unsatisfiability"

  The subset of **Conceptual Fidelity** and **Moral Epoché** is likely impossible to satisfy jointly. This tension is analogous to the Heisenberg Uncertainty Principle in physics: the more precisely you inhabit a past mindset (Fidelity), the more you must feel the normative force of its values, which breaches the suspension of judgment (Epoché). To truly understand why a character believes honor requires killing, you must temporarily share that belief, which compromises the neutrality required to explain it without endorsement. This is a novel conflict proposing that total historical immersion inherently generates moral complicity. If the non-negotiable items are preserved, **Conceptual Fidelity** must be sacrificed partially. We must accept that our translation is always imperfect and slightly anachronistic because we cannot fully turn off our modern moral cognition. Pure inhabitation is a fantasy; we are always tourists viewing through a glass wall, however thin. The sacrifice is the claim of perfect objectivity. We must admit that the very act of writing history introduces a presentist lens that cannot be fully removed, meaning the "escape" is asymptotic rather than absolute. We must accept that the 'escape' is asymptotic rather than absolute, a limit we approach but never touch.

  Section Four, "Scorecard Against Conceptual Positions"

  A **Strict Contextualist** view excels at Conceptual Fidelity and Archive Negativity but often fails Moral Epoché by retreating into relativism where no judgment is possible, effectively endorsing premises by refusing to critique them. It risks making the past too coherent. A **Normative-Realist** view allowing cross-temporal judgment secures Temporal Specificity but collapses the distinction between explaining and endorsing, often judging past actors by standards they could not access, violating Conceptual Fidelity. It risks making the past too familiar. A **Narrative-Hermeneutic** view fares best overall, balancing Fidelity and Epoché through dialogic engagement, but risks blurring Temporal Specificity by smoothing over the alienness of the past to make the story coherent. It tends to resolve the tension of Normative Unavailability by making the past too comprehensible, suggesting continuity where there is rupture. Each position fails to fully resolve the Joint Unsatisfiability, leaving the novelist to navigate the gaps manually. The hermeneutic approach comes closest but often sacrifices the harshness of the real for the sake of narrative flow. It creates a conversation between text and reader that acknowledges the distance.

  Section Five, "Bottom Line for Practice"

  In practice, taking these desiderata seriously means writing the friction. A historian or novelist must stop smoothing over anachronisms for readability. Instead of resolving the tension between past values and present judgment, the narrative must stage it. You must explicitly mark where the archive is silent rather than inventing voice. You must allow characters to be morally coherent within their time yet repulsive to the reader, without offering a narrator's apology. The goal is not to make the past livable, but to make its unlivability palpable. This requires a style that refuses closure, leaving the reader unsettled by the gap between then and now. It demands a discipline of restraint where the impulse to judge is recorded as part of the historical problem itself. The reader must feel the weight of the judgment they are withholding.
