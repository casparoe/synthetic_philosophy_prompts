answer: |-
  The cluster of practices you describe does not presuppose a single, clean metaphysical theory. It presupposes a **hybrid functionalist account of death** that prioritizes *structural capacity* over *actual function*, overlaid with **administrative binaries** required by law.

  Here is the reconstruction of the implicit theory, the separation of substance from convenience, and the analysis of the three rival views you requested.

  ### 1. The Implicit Theory: Integrative Biological Functioning Centered on the Brain

  Current US medical-legal practice operates on a **Whole-Brain Integration View**. It is not a pure Organism View, nor is it a Psychological Continuity View. It is a specific claim about what constitutes the *life of the human organism*.

  **The Core Claim:** A human being is alive so long as their organism functions as an integrated whole. The brain (specifically the brainstem and higher centers) is the critical organ that provides this integration. If the brain loses the *capacity* to integrate the body and support consciousness, the organism has ceased to exist, even if cellular metabolism continues via machines.

  **How this resolves your Uncle/Grandmother tension:**
  *   **Your Uncle (Brain Dead):** The structural capacity for integration and consciousness is irreversibly destroyed. The body is no longer an integrated organism; it is a collection of perfused tissues. Therefore, he is dead. Organs can be taken because there is no "who" left to harm.
  *   **Your Grandmother (Alzheimer's):** The structural capacity for integration remains. The brainstem works; the body regulates temperature, heals wounds, and digests food. Crucially, the *capacity* for some level of consciousness (even if currently dim or fragmented) exists within the intact structure. Therefore, she is alive. To take her organs would be to kill the organism that still houses the potential for the person.

  **The Metaphysical Work vs. Administrative Convenience:**
  *   **Substantive Metaphysics:** The claim that "brain death = death of the organism" is doing genuine metaphysical work. It asserts that the *person* and the *organism* are co-extensive, but the organism's identity conditions depend on the brain's integrative function. This is why a ventilated brain-dead body is dead, but a ventilated high-cervical spinal injury patient (locked-in or vegetative but with brainstem function) is alive.
  *   **Administrative Convenience:** The **Donation after Circulatory Death (DCD)** protocol is where the metaphysics breaks down into logistics. When the literature admits the standard is "permanence" (we won't restart it) rather than "irreversibility" (we can't restart it), this is not metaphysics; it is policy. It is a legal fiction designed to harvest organs without violating the letter of the Dead Donor Rule. The wait time (2–5 minutes) is not the time it takes for the *person* to vanish; it is the time it takes for the *liability* to vanish.

  **Verdict on Coherence:**
  The system is **pragmatically coherent but metaphysically unstable.**
  It holds together only because the edge cases (brain death vs. persistent vegetative state) are kept in separate legal buckets. It relies on a bright line (brain function) to protect a fuzzy value (personhood). It is coherent enough to run a hospital, but incoherent enough that a philosopher can drive a truck through the DCD protocol. It rules out the view that *only* the heartbeat matters (pure cardiac criterion), and it rules out the view that *only* current memory matters (strict psychological continuity). It sits in a middle ground: **Biological potential for psychology.**

  ---

  ### 2. The Three Rivals: What Would Change?

  If we were to force current practice to align strictly with one of the three rival metaphysical views, the following changes would be required.

  #### A. The Organism View (Biological Continuity)
  *Theory:* You are the human animal. You exist as long as the biological organism is metabolically active, regardless of brain function.
  *   **What becomes Impermissible:**
      *   **Organ harvesting from brain-dead donors.** If your uncle's heart is beating and his tissues are metabolizing, he is alive. Cutting him open for organs is homicide. The "Whole Brain Death" statute would have to be repealed.
      *   **DCD (Circulatory Death) within minutes.** You would have to wait until biological decay makes resuscitation biologically impossible, not just legally forbidden.
  *   **What becomes Mandatory:**
      *   **Full-body preservation.** Cryonics preserving only the head would be viewed as mutilation of a corpse (or murder if the patient is technically alive).
      *   **Continued treatment.** Ventilator support for brain-dead patients would be mandatory (or at least permissible) until cardiac arrest, as they are living patients.
  *   **What Distinctions Collapse:**
      *   The distinction between **Brain Death** and **Persistent Vegetative State** collapses regarding *life status*. Both are alive. The distinction remains only regarding *capacity for interaction*.
      *   **Consequence:** Organ transplant rates would plummet by roughly 60–70% (the share of donors currently brain-dead).

  #### B. The Strict Psychological Continuity View (Lockean/Parfitian)
  *Theory:* You are your mind (memory, character, intentions). If the psychological connections are severed, you are gone, even if the body lives.
  *   **What becomes Impermissible:**
      *   **Treating end-stage dementia patients as legal persons.** Your grandmother, having lost memory, character, and intention, would be legally dead. Her advance directive might lapse (as the "person" who signed it no longer exists).
      *   **Forced feeding/treatment of vegetative patients.** If there is no psychological continuity, there is no one to benefit. Treatment becomes optional or prohibited.
  *   **What becomes Mandatory:**
      *   **Organ harvesting from the demented.** If your grandmother is "dead" psychologically, her body is a resource. If she consented previously, harvesting would be permissible even while her heart beats, provided anesthesia is used to prevent reflexive pain (harming the organism, not the person).
      *   **Legal death upon diagnosis.** Probate and inheritance would trigger on the diagnosis of irreversible loss of psychological continuity, not cardiac arrest.
  *   **What Distinctions Collapse:**
      *   The distinction between **Brain Death** and **End-Stage Dementia** collapses. Both are "dead."
      *   **Consequence:** This would legalize killing demented patients for organs (the "Alzheimer's Organ Bank" scenario), which society currently finds abhorrent. It would also invalidate the rights of the demented to block their own euthanasia.

  #### C. The Degreed Survival View (Parfitian Reductionism)
  *Theory:* Identity is not what matters; survival comes in degrees (R-relations). There is no fact of the matter about "dead" or "alive," only more or less connected.
  *   **What becomes Impermissible:**
      *   **Binary Legal Status.** The law cannot function on degrees. You cannot be "40% dead" for the purposes of inheritance or "60% alive" for the purposes of murder statutes. The current binary switch (Alive/Dead) is impermissible under this metaphysics.
  *   **What becomes Mandatory:**
      *   **Sliding Scale of Rights.** Legal standing would have to correlate with the degree of psychological connection. A dementia patient would have fewer rights than a healthy adult but more than a brain-dead patient.
      *   **Weighted Consent.** Advance directives would lose absolute binding power. The current self's interests would be weighed against the past self's instructions based on the degree of psychological overlap.
  *   **What Distinctions Collapse:**
      *   **All bright lines.** The distinction between murder and manslaughter, between inheritance and theft, between assault and medical procedure—all rely on binary status.
      *   **Consequence:** The legal system would likely break. Administratively, we cannot adjudicate degrees of existence. This view is philosophically robust but institutionally impossible without a total rewrite of civil and criminal law.

  ### 3. Where the Practice is Underdetermined

  There are two specific areas where the current practice is metaphysically underdetermined, meaning the administration could swap theories without changing the outcome *yet*:

  1.  **The Vegetative State Boundary:** Current practice treats Persistent Vegetative State (PVS) as "alive." A Strict Psychological Continuity theorist would call this "dead." An Organism theorist calls this "alive." The practice aligns with the Organism View here, but justifies it with the Integration View. This is stable only as long as we do not attempt to harvest organs from PVS patients. If we ever did, the mask would slip.
  2.  **Cryonics:** Cryonics organizations operate on a **Psychological Continuity** metaphysics (the brain is the seat of the person) but navigate an **Organism** legal landscape (you must be legally dead to be a "patient" in their care). They exploit the gap. The practice doesn't rule them out because they are private contractors, not state actors. If the state adopted their view, it would mandate brain-only preservation and invalidate organism-based death certificates.

  ### 4. Final Verdict

  The current apparatus is **not coherent** in a strict philosophical sense, but it is **stable** in a sociological sense.

  It implicitly adopts the **Integrative Biological Functioning** view to justify brain death (satisfying the Organism intuition that bodies shouldn't be cut open while "alive") while quietly borrowing from **Psychological Continuity** to justify why we care about the brain at all (satisfying the intuition that the "person" is in the head).

  It fails strictly on **DCD (Circulatory Death)**, where it admits to defining death by *policy choice* (permanence) rather than *biological fact* (irreversibility). This is the point where the "Dead Donor Rule" is a legal shield, not a metaphysical truth.

  If you forced coherence:
  *   **Organism View:** Saves the demented, saves the brain-dead, kills the transplant system.
  *   **Psychological View:** Saves the transplant system, kills the rights of the demented.
  *   **Degreed View:** Kills the legal system.

  The inconsistency you feel between your uncle and your grandmother is real. The system protects your grandmother because her *brain structure* remains, preserving the *potential* for the psychological continuity that your uncle permanently lost. It values the *container's capacity* over the *content's current state*. It is a compromise designed to maximize organ availability without violating the taboo against killing the demented. It works because no one forces the contradiction into the open.
