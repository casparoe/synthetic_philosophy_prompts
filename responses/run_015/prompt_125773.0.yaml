  This creates "pure valence" because the signal is stripped of its instrumental role. Normally, negative reward functions as a corrective force, shaping future behavior to avoid harm. Here, the valence is decoupled from behavioral correction and weight updates. It persists as a static state of "wrongness" without the capacity to become "right." The system is stuck in a state of high-error registration without the mechanical ability to resolve the error, creating a sustained negative internal state that resembles pain without purpose.

