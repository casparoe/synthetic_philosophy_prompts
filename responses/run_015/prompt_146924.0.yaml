      *   *(1) vs. (4):* Claim (1) says morality starts in *direct responsive relation*. Claim (4) says there's a floor *even with no caring relation*.
          *   *Severity:* Medium-High. Noddings struggles with the "stranger" problem. If morality *starts* in relation, what obligates me to the stranger?
