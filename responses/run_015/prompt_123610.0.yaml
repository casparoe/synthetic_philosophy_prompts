  - **Tie-breaker case:** Present a case where negative affect is present but the subject explicitly denies the sensation belongs to them, yet they still protect the area. Alternatively, induce body schema incorporation of the robot arm without changing the affective signal to see if verdicts shift. If she changes her verdict only when the robot is incorporated, Rule Two is confirmed.
