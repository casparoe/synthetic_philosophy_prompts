  1. **Mark: 15/20 (Upper Second / High 2:1)**
  This script demonstrates a sophisticated grasp of the definitions and theoretical motivations for illusionism, particularly in parts (a) and (b), placing it comfortably in the upper-second band. However, it falls short of a First due to a significant philosophical error in part (c) regarding the Mary case, where the candidate conflates the denial of *phenomenal* knowledge with the denial of knowledge *simpliciter*, and mischaracterizes the functionalist commitment regarding internal state changes.

  2. **Merits (What the answer gets right)**
  *   **Part (a), Paragraph 1:** *"Illusionism is therefore not the denial that we are conscious. It is a positive account of what our consciousness consists in — a functional, information-involving relation to the world — together with a claim about how introspection misrepresents that functional state as having phenomenal character."*
      *   **Why it earns marks:** This precisely captures the core Frankish distinction between illusionism and eliminativism. Many students fail to note that illusionism retains a positive account of the underlying state (functional) while denying the attributed property (phenomenal). Explicitly stating that consciousness is not denied, but re-described, secures full marks for the distinction.
  *   **Part (a), Paragraph 2:** *"Second, the illusion is not a theory that we hold. It is sub-personal, produced by introspective mechanisms rather than by inference or acculturation, and it cannot be talked away."*
      *   **Why it earns marks:** This is a crucial technical point often overlooked. Distinguishing the illusion from a propositional attitude (theory) protects the view from the objection that knowing the truth should dissolve the illusion. A grader scanning quickly might miss this, but it is philosophically vital and deserves credit.
  *   **Part (b), Paragraph 1:** *"Illusionism inherits the meta-problem and not the hard problem. If there are no phenomenal properties, then there is no fact of the matter for a constitutive explanation to target..."*
      *   **Why it earns marks:** This correctly identifies the illusionist's strategic move regarding Chalmers' distinction. The justification (no fact of the matter) is the standard and correct argument for why the hard problem dissolves rather than being solved.
  *   **Part (b), Paragraph 1:** *"Judgments, reports and dispositions to speak are ordinary functional states, and a functional story about them requires nothing beyond the resources the illusionist already has..."*
      *   **Why it earns marks:** This correctly explains *why* the task is easier (as requested by the question). It links the meta-problem to resources already available to the physicalist, satisfying the comparative difficulty clause of the prompt.
  *   **Unasked Addendum:** *"But this confuses content with vehicle... The vehicle of the illusion is a non-phenomenal functional state; only its content mentions phenomenality."*
      *   **Why it earns marks:** Although not explicitly requested, this demonstrates high-level understanding of the representational machinery required to make illusionism coherent. It shows the candidate anticipates a standard objection (self-refutation) and resolves it correctly.

  3. **Defects (Where the answer goes wrong)**
  *   **Part (c), Paragraph 1:** *"Since there are no phenomenal properties, illusionism must say that Mary gains nothing when she leaves the room... she acquires no new knowledge"*
      *   **Nature of Failure:** Conflation of *phenomenal* knowledge with knowledge *simpliciter*.
      *   **Why it matters:** The question asks what follows from the denial of phenomenal properties. It follows that Mary gains no *phenomenal* knowledge (facts about qualia). It does *not* follow that she gains no knowledge at all. Standard illusionist/physicalist responses grant she gains new abilities or concepts (knowledge-how or new modes of presentation). Denying she acquires *any* new knowledge makes the view implausibly strong and indistinguishable from crude behaviorism.
      *   **Correct Alternative:** The answer should have stated: "Mary acquires no new *phenomenal* knowledge or facts, but she does acquire new non-phenomenal knowledge, such as new recognitional abilities or concepts."
  *   **Part (c), Paragraph 1:** *"What changes is her behaviour alone: new discriminative and recognitional abilities..."*
      *   **Nature of Failure:** Category error regarding functionalism.
      *   **Why it matters:** The candidate lists "abilities" under "behaviour alone." Abilities are internal dispositions or functional states, not merely overt behavior. Illusionism is typically a functionalist view; it posits changes in internal processing states, not just output. Reducing the change to "behaviour alone" undermines the physicalist/functionalist ontology established in part (a).
      *   **Correct Alternative:** The answer should have distinguished between overt behavior and internal functional states. A correct answer would say: "What changes are her internal functional states and dispositions, which manifest in new behaviors."
  *   **Part (c), Paragraph 1:** *"Distinguish what genuinely follows... from what does not follow."* (Failure to address the second half of the instruction).
      *   **Nature of Failure:** Incomplete response to command term.
      *   **Why it matters:** The prompt explicitly asks to distinguish what follows from what *does not*. The candidate lists what follows (no knowledge, no property) but only implies what does not follow (behavior changes). They fail to explicitly state what the denial of phenomenal properties does *not* entail (e.g., it does not entail she learns nothing *at all*, or that her physical state remains unchanged).
      *   **Correct Alternative:** Explicitly list a consequence that does *not* follow. E.g., "It does not follow that her physical state is unchanged, nor that she gains no new concepts."

  4. **Loose or Awkward Phrasing**
  *   **Part (a), Paragraph 1:** *"our talk of what it is like is, on that view, on the way out"*
      *   **Deduction:** None. This is standard idiomatic phrasing for eliminativism (Churchland) in this context. It is sufficiently precise for an exam script.
  *   **Part (b), Paragraph 1:** *"This is what makes the illusionist's task comparatively easy."*
      *   **Deduction:** None. While "easy" is subjective, the candidate justifies it immediately by referencing available functional resources. In a timed exam, this level of shorthand is acceptable given the preceding justification.
  *   **Part (c), Paragraph 1:** *"in the only sense in which an experience could be new — the phenomenal sense — experiences of that kind do not exist."*
      *   **Deduction:** None. This is slightly awkward (experiences exist, phenomenal properties do not), but the meaning is recoverable and consistent with their earlier argument. No penalty.

  5. **Unsettled Assertions / Ambiguities**
  *   **Part (c), Paragraph 1:** *"She instantiates no new property, since phenomenal properties do not exist"*
      *   **Flag:** This is ambiguous regarding *physical* properties. When Mary sees red, she presumably instantiates new physical brain states. The sentence could be read as denying she instantiates *any* new property, or only *phenomenal* properties. Given the context, the latter is intended, but the phrasing ("no new property" simpliciter) is technically false for a physicalist.
      *   **Required for Gradeability:** The candidate would need to specify "no new *phenomenal* property" to avoid the implication that her physical state remains identical.
  *   **Part (a), Paragraph 1:** *"The eliminativist treats phenomenal discourse as a defective theory... once the theory is given up there is no appearance of phenomenality left over to explain."*
      *   **Flag:** This attributes a specific view to eliminativism (that the *appearance* vanishes). Some eliminativists might argue the appearance remains but is ignored. However, this is the standard Frankish contrast. I will not penalize, but note that a rigorous defense would require citing the specific eliminativist conception assumed (e.g., Churchland vs. Quine).
