answer: |-
  Here is the specification you requested. It is structured as a set of constraints (desiderata) divided into non-negotiable physical/logical requirements and contested philosophical/biological preferences. Following the constraints, I apply them to your stress-test cases, analyze the DNA–Gödel isomorphism, identify the trade-offs, and provide the comparison table.

  ### Part I: The Desiderata Specification

  #### A. Non-Negotiable Constraints (Physics and Logic)
  *These must be satisfied for any account to be physically possible and logically coherent. Violating these contradicts established science.*

  **1. Thermodynamic Openness**
  *   **Requirement:** The system must be thermodynamically open, exporting entropy to a sink to maintain local order.
  *   **Case/Consideration:** **Crystal Growth / Spreading Fire.** These are excluded not because they lack "information," but because they are dissipative structures driven purely by gradient reduction. A replicator account cannot contradict the Second Law; it must specify where the free energy comes from and how error-correction (if claimed) is paid for.
  *   **Status:** Non-negotiable.

  **2. Causal Contribution (The "No Magic" Clause)**
  *   **Requirement:** The putative replicator must make a specific causal contribution to its own reproduction that distinguishes it from the background environment.
  *   **Case/Consideration:** **Photocopier + Technician.** If a technician assembles the parts, the photocopier is not the replicator; the technician is. The system cannot rely on "hidden agents" to perform the construction steps that are not causally linked to the replicator's state.
  *   **Status:** Non-negotiable.

  **3. Temporal Discreteness (Cycle Definition)**
  *   **Requirement:** There must be a definable start and end point for a replication cycle.
  *   **Case/Consideration:** **Autocatalytic Network.** In a continuous flow reactor where everything catalyzes everything, there is no "parent" and "offspring," only a shifting steady state. Without discrete generations, "replication" dissolves into "persistence."
  *   **Status:** Non-negotiable (for the concept of *replication* specifically, as opposed to *growth*).

  #### B. Contested Constraints (Philosophical and Biological Preferences)
  *These are the battlegrounds. Different theories accept or reject these. Your account must choose.*

  **4. The Passive/Active Distinction (The von Neumann Threshold)**
  *   **Requirement:** The system must distinguish between the *description* of the constructor (copied passively) and the *description of the description* (interpreted actively to build the constructor).
  *   **Case/Consideration:** **Crystal / Fire / Prion.** Crystals copy by physical templating (active growth on a surface). They do not copy a description *qua* description. If you require this distinction, crystals and prions are excluded. If you do not, "replication" becomes synonymous with "catalytic propagation."
  *   **Status:** **The Single Requirement that does the most work.** This is the primary filter that separates "biological/computational" replication from "physical" propagation.

  **5. Interpreter Provenance (Semantic Closure)**
  *   **Requirement:** The machinery that interprets the description (the ribosome/CPU) must itself be produced by the instructions in the description.
  *   **Case/Consideration:** **Quine / Virus.** A quine relies on an existing OS. A virus relies on a host ribosome. If you require Semantic Closure, neither are full replicators; they are parasites or subroutines. If you relax this, replication becomes relative to an environment.
  *   **Status:** Camp Preference (Von Neumann/Hofstadter camp says Yes; Biological pragmatists say No).

  **6. Intrinsic vs. Relational Existence**
  *   **Requirement:** Is replication a property of the object (Intrinsic) or the object-in-a-medium (Relational)?
  *   **Case/Consideration:** **Mirror-Image Cell.** A mirror cell in normal broth does nothing. In mirror-broth, it divides. If replication is intrinsic, the mirror cell is not a replicator. If relational, it is.
  *   **Status:** Camp Preference. (Your suspicion is correct: Intrinsic + Primer Case is a contradiction).

  **7. Open-Ended Heritability (Evolvability)**
  *   **Requirement:** The system must support heritable variation of unbounded complexity without loss of replication fidelity.
  *   **Case/Consideration:** **Prion.** Prions have strain differences, but the "alphabet" is conformational, not sequential. It is unclear if they support unbounded complexity. **Transposable Element.** It is copied, but contributes nothing to the machinery. Is it a replicator or just copied data?
  *   **Status:** Camp Preference. (This conflates *replication* with *evolution*. Strictly speaking, a system can replicate without evolving, but most accounts demand evolvability to make the concept biologically interesting).

  ---

  ### Part II: Stress-Test Rulings

  Based on the constraints above, here is how the account classifies your cases. I assume a "Strict von Neumann" stance (requiring Passive/Active distinction) for the baseline, noting where relaxations change the verdict.

  | Case | Verdict | Reason (based on Desiderata) |
  | :--- | :--- | :--- |
  | **DNA in tube (no enzymes)** | **Not a Replicator** | Fails *Causal Contribution*. It is inert data without an interpreter. |
  | **DNA + Polymerase/Primer** | **Replicator (System)** | The *system* (DNA + Enzymes) replicates. DNA alone is the description; Enzymes are the interpreter. |
  | **Mirror Cell (normal broth)** | **Not a Replicator** | Fails *Causal Contribution* in that medium. Replication is *Relational* (Constraint 6). |
  | **Mirror Cell (mirror broth)** | **Replicator** | Relational conditions met. Shows replication is not intrinsic to the object. |
  | **Quine (on CPU)** | **Partial Replicator** | Satisfies *Passive/Active* (code vs. execution). Fails *Interpreter Provenance* (CPU is external). |
  | **Virus** | **Parasitic Replicator** | Has description/construction distinction. Fails *Interpreter Provenance* (host supplies ribosomes). |
  | **3D Printer (Internal File)** | **Replicator** | Satisfies *Causal Contribution* and *Passive/Active*. File is internal description. |
  | **3D Printer (Server File)** | **Dependent Replicator** | Fails *Causal Closure* regarding the description source. Description is external. |
  | **Photocopier + Technician** | **Not a Replicator** | Fails *Causal Contribution*. Technician breaks the causal loop. |
  | **Crystal Growth** | **Not a Replicator** | Fails *Passive/Active Distinction*. Growth is direct physical templating, not interpretation of a description. |
  | **Spreading Fire** | **Not a Replicator** | Fails *Temporal Discreteness* and *Passive/Active*. It is a wave of reaction, not a cycle of copying. |
  | **Prion** | **Borderline / No** | Fails *Passive/Active*. Conformation is copied directly, not via a separate code/interpreter distinction. |
  | **Autocatalytic Network** | **Not a Replicator** | Fails *Temporal Discreteness* and *Individuality*. No distinct entity is being copied; the network persists. |
  | **Mule** | **Not a Replicator** | Fails *Causal Contribution* (sterile). It is a product, not a producer. |
  | **Plaster Cast** | **Not a Replicator** | Fails *Causal Contribution*. The mould is passive; the agent is the sculptor pouring the plaster. |
  | **Transposable Element** | **Replicator (Parasitic)** | It contains a description for its own copying (enzymes or recruitment signals). It is a "selfish gene" replicator, even if dependent on the host. |

  ---

  ### Part III: The DNA–Gödel Isomorphism Analysis

  You asked what this isomorphism establishes and what it merely gestures at.

  **1. What it Establishes (The Exact Isomorphism)**
  The isomorphism is exact regarding the **separation of syntax and semantics within a closed loop.**
  *   **Gödel:** A formal system allows strings (syntax) to be mapped to numbers (arithmetic) such that the system can derive theorems *about* those strings using its own rules. The string is both data (a number) and instruction (a formula).
  *   **Biology:** The cell allows DNA (syntax) to be mapped to Enzymes (chemistry) such that the cell acts *on* the DNA using machinery specified by the DNA. The strand is both data (template for copying) and instruction (template for translation).
  *   **The Core Insight:** Both systems solve the problem of **self-reference without paradox** by separating the *use* of the string (interpretation) from the *mention* of the string (replication). This is von Neumann's "critical threshold."

  **2. What it Gestures At (The Overreach)**
  The isomorphism is often wrongly extended to claim that **biology is logic** or that **meaning is intrinsic.**
  *   **The Gap:** In Gödel's system, the "interpretation" is mathematical truth derived via fixed axioms. In biology, the "interpretation" is *physical construction*.
  *   **The Error:** Claiming DNA *means* something in the same way a sentence means something. DNA only has semantics relative to the specific chemical affinities of the ribosome/tRNA complex. Change the ribosome, change the meaning. Gödel numbering is invariant; the Genetic Code is a frozen accident.
  *   **Your Hypothesis:** You are correct. The claim that "replication is essentially self-referential" is true only in the narrow von Neumann sense (the dual use of the tape). Claims that the replicator must *supply the semantics* (build its own interpreter from scratch) are claims about **evolvability** and **autonomy**, not replication *per se*. A virus replicates without supplying its own semantics (ribosomes). Therefore, semantic closure is a condition for *independent life*, not for *replication*.

  ---

  ### Part IV: Trade-Offs and The "Killer" Constraint

  **1. The Unsatisfiable Subset**
  You suspected a conflict between **Intrinsic Existence** and the **Primer/Mirror Cases**. You are right.
  *   **The Triad:**
      1.  Replication is an intrinsic property of the object (DNA).
      2.  Replication requires an environment (Primer/Polymerase/Mirror Broth).
      3.  Replication is a binary state (It either is or isn't).
  *   **Resolution:** You must drop (1). Replication is a **relational property** between a description-bearing object and an interpreter-bearing environment. DNA in a vacuum is not a replicator. DNA in a cell is. The "Self" in self-replication is a system boundary, not a molecule.

  **2. The Single Requirement That Does The Most Work**
  **Constraint 4: The Passive/Active Distinction.**
  *   **Why:** This is the only constraint that successfully excludes **Crystals, Fire, and Prions** while including **DNA, Quines, and Viruses.**
  *   **Exclusion Power:** Most competing accounts (autocatalysis, crystal growth, fire) fail here. They rely on direct physical causation (A touches B, B becomes like A). The Passive/Active distinction demands that A is *read* to make C, which then makes B. This indirectness is the hallmark of biological/computational replication. If you drop this, you cannot distinguish a copying machine from a spreading stain.

  ---

  ### Part V: Comparison Table

  | Feature | **Von Neumann (Kinematic)** | **Hofstadter (Strange Loop)** | **Chemical Autocatalysis** |
  | :--- | :--- | :--- | :--- |
  | **Core Mechanism** | Universal Constructor + Description Copier | Self-referential Formal System | Cyclic Catalytic Closure |
  | **Passive/Active Distinction** | **Yes** (Explicit separation of tape and constructor) | **Yes** (Data vs. Program) | **No** (Molecules are both catalyst and product) |
  | **Interpreter Provenance** | **Self-Supplied** (Constructor builds interpreter) | **System-Internal** (Rules are fixed, data varies) | **Network-Distributed** (No central interpreter) |
  | **Handles Prions/Crystals?** | **No** (Excludes direct templating) | **No** (Requires symbolic layer) | **Yes** (Includes them as weak replicators) |
  | **Handles Viruses?** | **No** (Requires full constructor) | **Partial** (Quine-like, but dependent) | **Yes** (Parasitic cycles allowed) |
  | **View on DNA-Gödel** | **Architectural** (Engineering solution to copying) | **Semantic** (Meaning arises from the loop) | **Irrelevant** (Chemistry suffices) |
  | **Primary Failure Mode** | Infinite Regress (Who builds the builder?) | Dualism (Mind/Matter split) | Vagueness (Where is the individual?) |
  | **Best For** | Defining **Autonomy** | Defining **Consciousness/Meaning** | Defining **Origins of Life** |

  ### Summary Recommendation for Your Group

  To decide on a novel system without intuition:
  1.  **Apply the Passive/Active Test:** Is there a part that is copied *without* being interpreted, and a part that is interpreted to build the machinery? If no (e.g., crystal), it is not a replicator in the biological/computational sense.
  2.  **Apply the Causal Closure Test:** Does the system supply the energy and the construction labor, or does it rely on an external agent (technician/host) to perform the assembly?
  3.  **Accept Relationality:** Acknowledge that "Self-Replicator" is shorthand for "Replicating System-Environment Pair." This resolves the Mirror Cell and DNA-in-tube paradoxes.
  4.  **Decouple Replication from Evolution:** Do not demand unbounded heritable variation to define replication. That is a requirement for *Darwinian* systems, not replicators *simpliciter*.

  This specification allows you to call a Virus a replicator (it has the Passive/Active distinction) while calling a Prion a propagator (it lacks the distinction), and to call a Quine a replicator only relative to its OS. It keeps the DNA-Gödel analogy precise (dual use of string) without inflating it into a claim that biology is purely logical.
