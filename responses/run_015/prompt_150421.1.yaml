      *   Refinement for precision: The incorporation of the counterfactual resilience gradient into the Best-Systems Account ultimately compromises Humean ontological austerity by implicitly relying on primitive modal structures to define world similarity, thereby functioning as an epistemic re-description of lawhood rather than a metaphysical grounding for counterfactual support.
      *   Even tighter: Utilizing the counterfactual resilience gradient to salvage the Best-Systems Account inevitably compromises Humean ontological austerity by smuggling in primitive modal structures via world quantification, thereby reducing the account to an epistemic re-description of systematic stability rather than a metaphysical ground for counterfactual support.

