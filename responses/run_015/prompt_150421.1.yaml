      *   *Key Insight:* The CRG attempts to ground lawhood in *stability across variations*. But for a Humean, variations are not real. So the stability is either (a) within the actual mosaic (sub-regions) or (b) in a modal space. If (a), it's just local strength. If (b), it's non-Humean. The prompt asks about "possible worlds," implying (b).
      *   *Epistemic vs. Ontological:* The CRG looks like it solves the problem by pointing to "resilience." But resilience *to what*? To changes in instances. But instances are all there are. So resilience is a measure of how much the system depends on specific instances. Laws depend less on specific instances than accidents. But this is just restating "strength" over a wider domain. It doesn't explain *why* counterfactuals hold, only that the system is robust. It re-describes the distinction.

