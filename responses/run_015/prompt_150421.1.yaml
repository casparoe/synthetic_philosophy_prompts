  6.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Check Definition:* "worlds that preserve the actual categorical bases but permute particular instances." This sounds like a *recombination principle*. Lewis uses recombination. But Lewis is a Modal Realist. A standard Humean (like Lewis regarding laws, but not necessarily worlds) might treat worlds as ersatz.
