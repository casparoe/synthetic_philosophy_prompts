      *   **The Problem:** How can a Humean explain why laws support counterfactuals if laws are just summaries of actual facts? Usually, Humeans say counterfactuals are evaluated by holding laws fixed and varying facts. But this seems circular if laws are defined by facts.
      *   **The CRG Device:** The prompt defines CRG specifically: "measures the proportion of nearby possible worlds—defined as worlds that preserve the actual categorical bases but permute particular instances—in which the regularity continues to hold."
      *   **Tension:** Humeanism typically rejects possible worlds as ontologically primitive (Lewis is an exception with modal realism, but standard Humeanism often treats modality as derived). More critically, the definition of "nearby possible worlds" that "preserve actual categorical bases but permute particular instances" sounds suspiciously like invoking modal structure *before* defining laws.

