      *   **Task 1:** Analyse whether adopting CRG as a selection criterion preserves Humean ontological austerity or implicitly introduces modal primitives (by quantifying over worlds with different categorical bases).
      *   **Task 2:** Assess whether CRG provides a genuinely distinct resolution to the problem of accidental generalisations or merely re-describes the distinction in epistemic terms.
      *   **Constraint 1:** Be precise in distinguishing the ontological status of the gradient itself from its heuristic role in system selection.
