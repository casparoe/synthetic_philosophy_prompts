      *   *Section 1: Ontological Austerity.* Analyze the definition of CRG. Quantifying over "nearby possible worlds" requires a similarity metric. For a Humean, similarity is usually defined by laws. Using CRG to select laws requires similarity to be defined *without* laws. This implies a primitive modal structure (a space of permutations). This violates austerity. Distinguish: If CRG is real, it's a modal primitive. If CRG is just a calculation on the actual mosaic (e.g., sub-patterns), it might save austerity but loses the "possible worlds" force. The prompt specifies "possible worlds," implying modal quantification.
