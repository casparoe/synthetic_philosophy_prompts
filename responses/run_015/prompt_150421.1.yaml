answer: |-
  The Humean Best-Systems Account (BSA) posits that laws of nature are merely the axioms and theorems of the deductive system that best balances simplicity and strength in summarizing the Humean mosaic—the totality of particular matters of fact. This ontological austerity faces a significant challenge from anti-Humean modal intuitions, specifically the conviction that laws support counterfactuals (e.g., "if this match were struck, it would light") in a way that accidental generalizations (e.g., "all gold spheres are less than one kilometer wide") do not. Anti-Humeans argue this distinction requires primitive governing relations or necessary connections, whereas the Humean must derive modal force from non-modal facts. To bridge this gap without conceding to governing relations, one might deploy the hypothetical 'counterfactual resilience gradient' (CRG). Defined as the measure of the proportion of nearby possible worlds—constructed by preserving actual categorical bases while permuting particular instances—in which a candidate regularity holds, the CRG attempts to quantify the stability of a regularity across modal space.

  However, adopting the CRG as a selection criterion creates a severe tension regarding Humean ontological austerity. For the CRG to function, there must be a well-defined metric of "nearby possible worlds" available prior to the selection of the best system. This requires a principle of recombination that fixes the identity of categorical bases (properties) independently of the laws they inhabit. For a strict Humean, property identities are typically determined by their role within the best system; to fix them beforehand is to treat them as possessing primitive modal essences that persist across permutations. Furthermore, quantifying over these worlds implies that the space of possibilities is ontologically prior to the laws derived from them. If the gradient is treated as an ontological feature of reality, it effectively smuggles in the very modal primitives—dispositions or propensities of the mosaic to sustain patterns across variations—that the Humean sought to eliminate. Thus, the CRG threatens to collapse the Humean reduction of modality into a covert realism about modal structures, violating the commitment to a world consisting solely of categorical particular matters of fact.

  Regarding the problem of accidental generalizations, the CRG offers a distinction that is arguably merely epistemic rather than metaphysically distinct. The gradient successfully differentiates lawful regularities from accidents by noting that the former hold across a wider proportion of permuted worlds (high resilience) than the latter (low resilience). Yet, for the Humean, these "worlds" are either concrete entities (as in Lewisian modal realism, which carries its own ontological costs) or ersatz constructions. If ersatz, the "proportion" is a measure of syntactic or conceptual stability within a linguistic framework, not a feature of the physical world. Consequently, the CRG does not ground the counterfactual support in the mosaic itself but rather re-describes the anti-Humean distinction between necessity and contingency as a gradient of theoretical robustness. It marks the difference between laws and accidents based on how well our systems survive hypothetical perturbations, but it fails to explain *why* the actual mosaic supports one pattern more than another without appealing to the modal intuitions it was meant to derive.

  It is crucial to distinguish the ontological status of the gradient from its heuristic role. Ontologically, a mind-independent CRG cannot exist within a strict Humean framework, as there are no non-actual worlds to measure. Heuristically, however, the CRG can serve as a proxy for system selection, guiding theorists toward systems that align with our pre-theoretic modal intuitions. Yet, this heuristic utility comes at the cost of admitting that the BSA requires external modal constraints to function correctly, thereby conceding that the mosaic alone is insufficient to generate lawhood. The gradient thus acts as a bridge that relies on the very modal structure it attempts to explain away, functioning as an epistemic tool that masks an ontological deficit.

  Utilizing the counterfactual resilience gradient to salvage the Best-Systems Account inevitably compromises Humean ontological austerity by smuggling in primitive modal structures via world quantification, thereby reducing the account to an epistemic re-description of systematic stability rather than a metaphysical ground for counterfactual support.
