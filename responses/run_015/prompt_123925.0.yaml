answer: |-
  This is a fantastic argument to have, and honestly, your roommate and you are both hitting on different layers of the same text. But since you want to drill down into the Rietdijk-Putnam argument specifically, let's strip away the metaphor and look at the ontology.

  Here is the core of the Rietdijk-Putnam argument: If Special Relativity is true, simultaneity is relative to your velocity. There is no universal "now." If I'm moving relative to you, my slice of "present" cuts through spacetime at a different angle than yours. Because of this, events that are in your future can be in my present. If my present is "real" (which it must be, because I'm experiencing it), then your future must also be "real." Therefore, past, present, and future all exist equally. This is Eternalism, or the Block Universe. Time is a dimension like space; things don't "happen," they just "are" at different coordinates.

  *Arrival* is one of the few mainstream films that actually attempts to visualize this ontology rather than just using time travel as a plot device. However, where it gets tricky—and where your roommate has a point about "window dressing"—is in how human consciousness interacts with that block.

  **Louise's Perception vs. The Block**

  In a strict Rietdijk-Putnam reading, Louise Banks doesn't just "remember" the future; she occupies a worldline where the distinction between memory and anticipation collapses. When she sees her daughter dying of a disease years from now, the film treats that vision not as a prophecy, but as a memory. This aligns perfectly with Eternalism. In the Block Universe, the moment of her daughter's death exists just as concretely as the moment of her daughter's birth. They are both coordinates on the block.

  Where the film gets it right is the emotional consequence of this metaphysics. If the future is already real, grief isn't about preventing loss; it's about accepting the geometry of your own life. Louise's decision to have her daughter, knowing the outcome, is an affirmation of the entire block. She isn't trying to change the coordinates; she's consenting to traverse them. This supports your view: the sci-fi isn't just window dressing. The grief *requires* the determinism to work. If the future were open (Presentism), her choice would be about risk management. Because the future is fixed (Eternalism), her choice is about amor fati—loving fate.

  **The Lorentz Transformation Analogy**

  Now, let's look at your specific analogy: that learning Heptapod B rewires cognition like a Lorentz transformation rewires coordinates. This is a brilliant intuition, but physically, it doesn't quite hold up, and this is where the film cheats.

  A Lorentz transformation changes how you slice spacetime into "space" and "time." It changes what you consider simultaneous. But it does not grant you access to the whole block. Even in Relativity, you are stuck on your worldline. You can calculate what happens elsewhere, but you cannot experience it until light cones intersect. You cannot "remember" the future because information cannot travel faster than light.

  Louise's experience is more radical than a Lorentz transformation. She isn't just changing her simultaneity slices; she is gaining epistemic access to remote parts of her own worldline. She is effectively consciousness-projecting along the time dimension. In physics terms, this isn't Special Relativity; this is closer to having Closed Timelike Curves (CTCs) in your brain.

  So, does this smuggle in a privileged observer frame? Yes, absolutely. And this is the biggest tension in the film's philosophy.

  **The Privileged Frame Problem**

  The Rietdijk-Putnam argument relies on the principle that no observer is privileged. All inertial frames are equal. There is no "God's eye view" of the block. But in *Arrival*, the Heptapods (and Louise, once she learns the language) effectively achieve a God's eye view. They perceive the beginning, middle, and end simultaneously.

  If only Heptapod speakers perceive time as a spatial layout, while everyone else perceives it as a flowing sequence, then the Heptapods occupy a privileged frame of reference regarding the nature of time. They see the "truth" (the Block), while humans see the "illusion" (the Flow). This violates the spirit of Relativity, which suggests the flow is an illusion for *everyone*, but no one gets to see the whole block from the inside.

  The film resolves this by suggesting that language determines cognition (the Sapir-Whorf hypothesis on steroids). But philosophically, this creates a dualism: there is the Ontological Block (which exists for everyone, per Rietdijk-Putnam) and the Epistemic Block (which only Louise can see). The film conflates these. It suggests that because she *sees* the block, she is *outside* of linear causality. But in a true Block Universe, seeing the future doesn't free you from it; it just confirms you are part of the structure.

  **Where the Film Cheats for Emotional Effect**

  Here is the rub: The film wants the metaphysics of Determinism but the morality of Free Will.

  In a strict Block Universe, Louise doesn't "choose" to have her daughter. The event of her conceiving the child is just as fixed as the event of the child's death. Her "decision" in the present is merely her consciousness arriving at that coordinate. There is no alternative possibility.

  However, the film frames this as a choice. She asks, "Would you change anything?" and implies she *could*, but *won't*. This reintroduces a privileged "now" where the decision happens. It suggests there is a moment of agency that stands outside the block, looking in. That is metaphysically inconsistent with the Rietdijk-Putnam conclusion. If the block is real, there is no outside.

  The film cheats here because without that illusion of choice, the emotional stakes vanish. If Louise is just a puppet riding a worldline, her sacrifice isn't noble; it's just geometry. To make it tragic and heroic, the film needs her to feel like she is consenting, even if the metaphysics say consent is impossible.

  **The Verdict**

  You are right that the film is fundamentally about the Block Universe. It is not just a metaphor for grief; the grief is structured by the metaphysics. If time were linear and open, the story would be about preventing the death. Because time is a block, the story is about witnessing it.

  However, your roommate is right that the film takes liberties. The "Lorentz" analogy breaks down because Louise gains epistemic access that physics forbids, creating a privileged observer status that Relativity explicitly denies. The film treats the Block Universe as something you can *achieve* through language, rather than something you *inhabit* regardless of perception.

  So, is it determinism or grief? It's grief *enabled* by determinism. But it's determinism with a human face, smuggled in with a little bit of magical realism regarding consciousness. The Rietdijk-Putnam argument says the future is real; *Arrival* says the future is memorable. Those are close, but not identical. You win on the ontology, but your roommate wins on the phenomenology. The film uses the hard sci-fi of the Block Universe to justify the soft sci-fi of emotional acceptance.
