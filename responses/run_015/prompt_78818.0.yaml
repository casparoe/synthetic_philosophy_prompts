answer: |-
  ### Criterion for Classification
  The tiers are ranked by the degree to which the sentence constitutes a **pragmatic self-defeat** inherent to the act of assertion, specifically where the asserted content contradicts the **first-person doxastic state** necessarily implied by the assertion itself.

  ### Tier 1: Paradigmatic Moorean Absurdity
  *These sentences exhibit the core paradox: they are logically consistent but pragmatically self-defeating because the assertion implies a belief that the content explicitly denies.*

  1.  **It is raining, but I do not believe that it is raining.**
      *   Justification: This is the canonical "omissive" Moorean sentence where asserting $p$ implies believing $p$, directly contradicting the second conjunct.
  2.  **It is raining, but I believe that it is not raining.**
      *   Justification: This is the canonical "commissive" Moorean sentence where the speaker asserts $p$ while explicitly avowing a contradictory belief.
  6.  **It will rain tomorrow, but I do not believe that it will rain tomorrow.**
      *   Justification: The future tense does not alleviate the paradox because the present act of asserting still implies a current belief in the future content.
  7.  **It rained yesterday, but I do not believe that it rained yesterday.**
      *   Justification: The past tense does not alleviate the paradox because the speaker's current assertion implies a current belief about the past fact.

  ### Tier 2: Normative Variants (Contested)
  *These sentences are pragmatically absurd, but their status as "Moore's Paradox" depends on specific normative theories linking assertion to knowledge or credence rather than belief alone.*

  3.  **It is raining, but I do not know that it is raining.** **[CONTESTED]**
      *   Justification: This is absurd if one accepts the Knowledge Norm of Assertion, but it lacks the doxastic contradiction of the paradigm case if belief does not entail knowledge.
  5.  **It is raining, but my credence that it is raining is only about 0.2.** **[CONTESTED]**
      *   Justification: This is pragmatically self-defeating regarding assertion norms, but its classification as Moorean depends on whether one reduces belief to high credence.

  ### Tier 3: Non-Paradoxical / Consistent
  *These sentences are either logically compatible, involve third-person attitudes, or are embedded in a way that removes the assertoric force required for the paradox.*

  4.  **It is raining, but I am not certain that it is raining.**
      *   Justification: Fallibilism permits truthful assertion without certainty, so there is no pragmatic contradiction between the content and the speaker's epistemic state.
  8.  **It is raining, but my colleague does not believe that it is raining.**
      *   Justification: There is no contradiction between a speaker's assertion and a third party's lack of belief, as assertion only implies the speaker's own belief.
  9.  **If it is raining but I do not believe that it is raining, then I should check the window.**
      *   Justification: Embedding the Moorean conjunction in a conditional antecedent removes its assertoric force, rendering the whole sentence a reasonable piece of advice.
  10. **It is raining, but I hope that it is not raining.**
      *   Justification: Hope is a pro-attitude compatible with the belief that the hoped-for state does not obtain, so no doxastic contradiction arises.

  ***

  ### Note on Contested Items
  **Item 3** is flagged because some philosophers (e.g., Timothy Williamson) argue that the Knowledge Norm is fundamental, making this the *true* paradox, while traditional Mooreans maintain the paradox is specific to *belief*. **Item 5** is flagged because the relationship between full belief and partial credence is debated; if belief is not simply high credence, this may be a distinct normative violation rather than a Moorean paradox.
