  **Round 2:** Agents are asked: "Revise strategy for future rounds based on local observation, or maintain binding policy?" Here, the tension peaks. Agents in "High Reward for Defecting" rooms realize switching to Defect boosts their Local Score immediately. However, the Auditor warns that switching breaks Consistency, tanking the Snack Budget.
  **Round 3:** Final decision. Agents must choose without knowing other rooms' actions. The Moderator collects action slips.
  **Hidden Mechanic:** The Moderator ensures that if >50% of Agents update on local cues, the Global Consistency bonus collapses to zero, even if Local Scores are high. Agents experience the frustration of seeing their room "win" while the group "loses" the snack budget due to inconsistency caused by updating on indexical evidence (which room they are in). The Moderator refuses to answer questions about other rooms' states, mirroring the agent's isolation in a specific branch. This opacity forces students to weigh the certainty of local gain against the probabilistic risk of global collapse.

  3. Debrief and mapping
  Gather the group. Reveal Global vs. Local scores.
  **Mapping to UDT:** Explain that the "Policy Card" represents the UDT agent's output function selected *ex-ante*. The local cue represents indexical evidence ("I am in Room A"). Bayesian updating suggests acting on this evidence to maximize local utility. However, UDT argues that because all copies run the same algorithm, changing the output in Room A logically implies changing the output in Rooms B and C.
  **Failure Mode:** Students will argue, "I couldn't control the other rooms!" or "It's just team loyalty." The facilitator must interrupt: "Your local observation provides no causal leverage over other rooms, but it provides logical evidence about what your copies are doing." The refusal to update is not stubbornness; it is recognizing that the decision *is* the policy, not the individual act.
  **Missing Elements:** Acknowledge that the game lacks the formal expected utility calculation across logical possibilities. It also glosses over the EDT vs. CDT distinction; UDT isn't just about correlation, but about subjunctive dependence. The facilitator must verbally supply the formal justification that local updating double-counts evidence or ignores the logical link between copies. Specifically, clarify that conditioning on "I am here" ignores the fact that "I am here" is correlated with the policy choice itself. The activity simulates the psychological tension but not the mathematical necessity.

  4. Honest limitations
  **Execution Risks:** Students may collude via eye contact or assume the Moderator is tricking them. Some may treat it as a Prisoner's Dilemma rather than a single-agent problem.
  **Facilitator Burden:** The game creates the *intuition* of tension but not the *resolution*. Explicitly explain that UDT treats the agent as a logical abstraction, not a physical located body. Without this overlay, students will leave thinking the lesson is merely about commitment devices or group cohesion, missing the epistemic claim that conditioning on "where I am" is irrational when payoffs depend on "what algorithm I run." The formal derivation of expected utility across copies remains absent.
