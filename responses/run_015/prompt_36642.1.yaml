prompt: |-
  I teach an upper-level metaphysics seminar — 14 students, one 80-minute session — on the special composition question: under what conditions do some things compose one further thing? Design an in-class game in which students staff the customs checkpoint of a small fictional republic where import duty is levied per object: whatever crosses the border as a single thing pays one fee, and officers are personally fined whenever an appeals court overturns one of their rulings.

  Smugglers (role-played by a rotating subset of the students, with their own payoff scheme) arrive with trays of carefully engineered arrangements: two bricks resting in contact, three planks nailed at a single corner, a mobile held together by one drop of glue, seven pebbles arranged in a perfect circle, a live fish swimming in water scooped from the far bank. The officers must rule on each shipment, but the game only ends when they publish a customs code: a general, non-circular criterion that decides every past and future case. The smugglers' firm prospers precisely by probing whatever vagueness or circularity the code contains — so the students should feel the pressure toward either "everything composed of nothing in contact counts" or "nothing counts" as the only codes that survive litigation.

  Please provide the full rules, the materials list, a payoff scheme requiring no real money, a timeline for the session, and a debrief that maps particular moments in the game onto the main candidate answers — universalism, nihilism, and the life-based restrictionism — with students constructing the positions themselves rather than hearing them named first. Tell me what will predictably go wrong the first time I run it and how to handle it, and be explicit about the one feature of the debate the game cannot reproduce: that the universalist insists there was never a real decision to make at the border, since composition is not a matter of policy at all. Suggest how I should supply that point, and to whom it will feel like cheating.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Context:** Upper-level metaphysics seminar (14 students, 80 minutes).
      *   **Topic:** Special Composition Question (SCQ): Under what conditions do some things compose a whole?
      *   **Activity:** In-class game ("Customs Checkpoint").
      *   **Roles:** Customs Officers (majority), Smugglers (rotating minority).
      *   **Mechanic:** Import duty per object. Officers fined for overturned rulings. Smugglers profit from vagueness/inconsistency.
      *   **Goal:** Officers must publish a "Customs Code" (general, non-circular criterion) that survives litigation.
      *   **Pressure:** The game mechanics should push students toward Extreme Universalism (everything composes) or Nihilism (nothing composes) to avoid fines/loopholes.
      *   **Deliverables:** Rules, Materials, Payoff Scheme (no real money), Timeline, Debrief (mapping to Universalism, Nihilism, Life-based Restrictionism), Troubleshooting (what goes wrong), and the "Missing Feature" (Universalist meta-claim).

  2.  **Deconstruct the Metaphysics:**
      *   *Nihilism:* Composition never occurs. Only simples exist. (Hard to enforce practically, but logically consistent).
      *   *Universalism:* Composition always occurs. Any plurality composes a whole. (Logically consistent, but counterintuitive).
      *   *Restrictionism (Moderate):* Composition occurs only under specific conditions (contact, fastening, life, etc.). (Intuitive, but vulnerable to Sorites/vagueness attacks).
      *   *The Game's Point:* Moderate views are hard to codify without vagueness. Vagueness leads to inconsistent rulings, which leads to officer fines. To avoid fines, officers must adopt extreme views.

  3.  **Drafting the Game Mechanics:**
      *   *Players:* 14 students. Let's say 10 Officers, 4 Smugglers (rotating).
      *   *Currency:* "Points" or "Credits."
      *   *Officer Goal:* Maximize points (avoid fines).
      *   *Smuggler Goal:* Maximize points (exploit loopholes/get rulings overturned).
      *   *The "Court":* The Instructor acts as the Appeals Court. This is crucial for controlling the pace and ensuring the metaphysical points land.
      *   *The "Code":* A written statement.
      *   *The Items:* Need physical props or clear descriptions. Physical props are better for engagement.
      *   *Ruling Process:* Officer sees item -> Declares "One Object" or "Many Objects" -> Smuggler can Appeal -> Instructor rules on Appeal based on the *Code*.

  4.  **Developing the Payoff Scheme:**
      *   No real money. Use candy, extra credit, or just "bragging rights/status." Let's go with "Philosophy Credits" redeemable for a small privilege (e.g., choosing a future topic, skipping a short assignment, or just candy).
      *   *Officers:* Start with a base. Lose points for overturned rulings. Gain points for consistent rulings that match the Code.
      *   *Smugglers:* Gain points if an appeal is successful (ruling overturned). Lose points if they appeal and fail (frivolous appeal).
      *   *Incentive:* Officers want a Code that is *clear* so they don't get fined. Smugglers want a Code that is *vague* so they can win appeals.

  5.  **Timeline (80 Minutes):**
      *   0-10: Setup & Rules.
      *   10-30: Round 1 (Ad hoc rulings, no Code).
      *   30-45: Drafting the Code (Group work).
      *   45-65: Round 2 (Rulings based *only* on Code, Smugglers attack).
      *   65-80: Debrief & Metaphysical Mapping.

  6.  **Addressing the "Missing Feature":**
      *   The prompt asks to highlight that Universalists think composition is *not a matter of policy*. The game treats it as policy (writing a Code).
      *   *Solution:* In the debrief, reveal that the "Universalist" position is that the game itself is metaphysically mistaken. The border doesn't decide reality.
      *   *Who feels cheated?* The Restrictionists (common sense). They feel the game rigged the outcome by punishing vagueness too harshly.

  7.  **Troubleshooting (What goes wrong):**
      *   *Problem 1:* Students write a vague Code ("things stuck together"). Smugglers exploit it immediately.
      *   *Fix:* Instructor (Court) must be strict on "Vagueness = Overturn."
      *   *Problem 2:* Officers quit or get frustrated.
      *   *Fix:* Keep rounds short. Emphasize this is a simulation of philosophical pressure.
      *   *Problem 3:* Nihilism is hard to play (everything is many).
      *   *Fix:* Clarify that "Many" means no duty paid, but also no risk of miscounting. Actually, wait. If duty is per object, Nihilism means *infinite* objects (simples)? No, usually Nihilism says only simples exist. So a "chair" is many simples. If the duty is per "imported unit," Nihilism says there are no units, just simples. Let's simplify: Duty is per "Composite Object." If Nihilism is true, Duty = 0. If Universalism is true, Duty = Huge (every plurality is an object).
      *   *Correction on Duty:* The prompt says "whatever crosses the border as a single thing pays one fee."
          *   If Officer says "1 Object": Importer pays 1 fee.
          *   If Officer says "Many Objects": Importer pays N fees (or 0 if they are just loose parts not counted as units? Let's stick to the prompt: "per object").
          *   Actually, to make the game work, the *Officer* is fined for inconsistency. The *Importer* (Smuggler) wants to pay less or create chaos.
          *   Let's refine: Smugglers want to minimize fees *or* maximize appeals. Officers want to minimize fines.
          *   Better: Smugglers represent the *world* throwing cases at them. The Smuggler students actively try to construct cases that break the Code.

  8.  **Refining the Materials:**
      *   Need distinct "shipments."
      *   1. Two bricks (contact).
      *   2. Three planks (nailed).
      *   3. Mobile (glue).
      *   4. Pebbles (circle).
      *   5. Fish in water (life).
      *   6. Scattered parts (no contact).
      *   7. A human hand (life/part).

  9.  **Structuring the Debrief:**
      *   Map the "Contact" rule failures to the Sorites problem.
      *   Map the "Life" rule to Organicism (Van Inwagen).
      *   Map the "Everything/Nothing" outcome to Universalism/Nihilism.
      *   Address the "Policy vs. Fact" issue.

  10. **Writing the Response:**
      *   Tone: Professional, pedagogical, precise.
      *   Ensure all constraints of the prompt are met (payoff, timeline, troubleshooting, missing feature).

      *(Self-Correction during drafting)*: I need to make sure the Smuggler's payoff encourages them to find *vagueness*, not just win every time. If the Code is "Everything composes," Smugglers can't win appeals. If the Code is "Nothing composes," Smugglers can't win appeals. The Smugglers win *during the drafting phase* by forcing the Officers to make the Code so extreme it feels absurd, or *during the ruling phase* if the Code is moderate.
      *   *Revised Payoff:* Smugglers get points for every successful Appeal. Officers lose points for every successful Appeal. Officers get a bonus if they complete the session without bankruptcy. This pushes Officers to find the "Safe Harbor" (Extreme views).

      *(Missing Feature)*: The prompt specifically asks about the Universalist claim that composition is not policy. I need to make sure this is a distinct section in the debrief.

      *(Troubleshooting)*: Students might treat the "Appeals Court" (Instructor) as arbitrary. I need to specify that the Instructor rules *strictly* on logical consistency with the written Code, not on intuition.

      *(Timeline)*: 80 minutes is tight. I need to be strict on timekeeping.

      *(Materials)*: Keep it simple. Legos, string, a bowl of water, a plant (or fake fish to avoid ethics issues).

      *(Payoff)*: Use "Tenure Points." Top scorer gets a piece of chocolate or the right to dismiss class 2 mins early next time.

      *(Final Polish)*: Ensure the distinction between "Customs Code" (Policy) and "Metaphysical Truth" (Fact) is clear in the debrief.

  11. **Final Review against Prompt:**
      *   14 students? Yes.
      *   80 mins? Yes.
      *   Customs/Smuggler roles? Yes.
      *   Payoff scheme (no money)? Yes.
      *   Timeline? Yes.
      *   Debrief mapping (Universalism, Nihilism, Life)? Yes.
      *   Troubleshooting? Yes.
      *   Missing Feature (Universalist meta-claim)? Yes.

