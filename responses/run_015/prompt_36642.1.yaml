answer: |-
  # Seminar Plan: The Republic of Ontaria Customs Simulation

  **Course:** Upper-Level Metaphysics
  **Topic:** The Special Composition Question (SCQ)
  **Class Size:** 14 Students
  **Duration:** 80 Minutes

  ## I. Learning Objectives
  By the end of this session, students will:
  1.  Experience the theoretical pressure that drives moderate restrictionist views toward nihilism or universalism.
  2.  Understand the role of vagueness and Sorites-style cases in undermining contact/fastening criteria.
  3.  Distinguish between composition as a *conventional policy* (the game) and composition as a *mind-independent fact* (the metaphysics).

  ## II. Materials List
  *   **The Shipments (7 distinct trays):**
      1.  *The Contact Case:* Two red bricks resting face-to-face.
      2.  *The Fastening Case:* Three wooden planks nailed together at exactly one corner.
      3.  *The Adhesive Case:* A kinetic mobile held together by a single drop of superglue.
      4.  *The Arrangement Case:* Seven pebbles arranged in a perfect circle, not touching.
      5.  *The Life Case:* A live fish in a clear bag of water (or a realistic robotic fish if animal ethics are a concern).
      6.  *The Scattered Case:* The parts of a disassembled IKEA shelf in a box.
      7.  *The Arbitrary Case:* A shoe, a banana, and a textbook zip-tied together loosely.
  *   **Game Tokens:** 50 poker chips or colored beads (representing "Tenure Points").
  *   **Whiteboard:** Divided into "Current Code," "Appeals Log," and "Scoreboard."
  *   **Handouts:** "Officer Badge" (10 copies), "Smuggler License" (4 copies).

  ## III. Payoff Scheme (No Real Money)
  *   **Currency:** Tenure Points (TP).
  *   **Officers (10 Students):**
      *   Start with 5 TP each.
      *   **Fine:** -2 TP for every ruling overturned on appeal.
      *   **Bonus:** +5 TP each if the "Customs Code" survives the final round without a single successful appeal.
      *   **Bankruptcy:** If an officer hits 0 TP, they are "fired" and must observe silently (still counts toward seminar participation).
  *   **Smugglers (4 Students, Rotating):**
      *   Start with 0 TP.
      *   **Profit:** +3 TP for every successful appeal (ruling overturned).
      *   **Penalty:** -1 TP for a frivolous appeal (ruling upheld).
      *   **Win Condition:** The Smuggler with the most TP at the end chooses the reading for the next seminar.
  *   **Instructor (The Appeals Court):** Holds the master rulebook. Rules are final.

  ## IV. Timeline (80 Minutes)

  ### 0:00–0:10 | Setup & Briefing
  *   Divide class: 10 Customs Officers, 4 Smugglers.
  *   Explain the stakes: Officers want consistency to avoid fines; Smugglers want inconsistency to profit.
  *   **The Rule:** Import duty is levied *per object*.
      *   If the Officer rules "1 Object," the shipment pays 1 fee.
      *   If the Officer rules "Many Objects," the shipment pays *n* fees (where *n* is the number of parts).
      *   *Note:* For the game, the fee amount matters less than the *consistency* of the count.
  *   Smugglers present the 7 Shipments one by one. Officers must confer and issue a ruling (1 or Many).

  ### 0:10–0:30 | Round 1: Intuitive Policing (No Code)
  *   Smugglers present Shipments 1–4.
  *   Officers rule based on intuition.
  *   Smugglers immediately appeal any ruling that feels inconsistent with a previous one (e.g., "You said bricks were 1 object, but pebbles in a circle are Many? Why?").
  *   **Instructor Role:** Overturn rulings that lack a principled distinction. Dock Officer TP. Award Smuggler TP.
  *   *Expected Outcome:* Officers lose points rapidly due to ad hoc inconsistencies.

  ### 0:30–0:45 | The Legislative Session (Drafting the Code)
  *   Officers huddle to write the **Customs Code**.
  *   **Constraint:** The Code must be general, non-circular, and decisive for *all* possible shipments.
  *   **Smuggler Role:** During this phase, Smugglers circulate and propose hypothetical edge cases to the Officers to test the draft (e.g., "What if the glue is wet?" "What if the bricks are a mile apart?").
  *   Officers must finalize the Code on the Whiteboard.

  ### 0:45–1:05 | Round 2: Litigation (Code Enforcement)
  *   Smugglers present Shipments 5–7 (and can re-present 1–4 with slight modifications).
  *   Officers *must* rule strictly according to the written Code.
  *   Smugglers appeal any ruling where the Code is vague or yields counterintuitive results that can be argued as inconsistent.
  *   **Instructor Role:** Act as a strict textualist. If the Code says "fastened," and the mobile has one drop of glue, is that fastened? If the Code doesn't define "fastened," the Officer loses.
  *   *Pressure Point:* To avoid fines, Officers will likely amend the Code toward extremes ("Everything counts" or "Nothing counts") to eliminate vagueness.

  ### 1:05–1:20 | Debrief & Metaphysical Mapping
  *   Stop the game. Reset the room.
  *   Map the game dynamics to the SCQ positions.
  *   Address the "Missing Feature."

  ---

  ## V. Debrief Guide: Mapping the Game to Metaphysics

  Do not name the positions until the students describe the strategies they used.

  **1. The Restrictionist Trap (Moderate Views)**
  *   *Ask:* "What happened when you tried to write a rule based on 'contact' or 'fastening'?"
  *   *Student Experience:* Smugglers exploited the vagueness. (Is 1 drop of glue fastening? Is 1mm apart contact?)
  *   *Metaphysical Map:* This mirrors the **Sorites Problem** for moderate restrictionism. If composition requires contact, how much contact? If it requires functional unity, how much function? The game demonstrates that *precise* boundaries for moderate views are difficult to articulate without arbitrariness.

  **2. The Safe Harbors (Nihilism & Universalism)**
  *   *Ask:* "Which Codes survived without fines?"
  *   *Student Experience:* Likely "Everything composes" (Universalism) or "Nothing composes" (Nihilism).
  *   *Metaphysical Map:*
      *   **Nihilism:** "No composite objects exist." In the game, this means every shipment is 'Many.' No vagueness, no appeals. (Merricks, Rosen & Dorr).
      *   **Universalism:** "Any plurality composes an object." In the game, every shipment is '1' (plus all its sub-pluralities). No vagueness, no appeals. (Lewis, Sider).
  *   *Point:* These views are theoretically robust *because* they eliminate boundary vagueness, even if they violate common sense.

  **3. The Life-Based Restriction (Organicism)**
  *   *Ask:* "Did anyone try to make an exception for the Fish?"
  *   *Student Experience:* Students often try to carve out "living things" as composites while denying the bricks.
  *   *Metaphysical Map:* This is **Van Inwagen's Organicism**. Composition occurs only when the activity of the simples constitutes a life.
  *   *Game Test:* Ask the Smugglers: "Could you have appealed a 'Life' code?" Yes, by asking about viruses, seeds, or frozen embryos. The game shows that even "Life" has boundary issues, though fewer than "Contact."

  ---

  ## VI. Troubleshooting: What Will Go Wrong

  **1. The "Instructor is Arbitrary" Complaint**
  *   *Problem:* Students will feel the Appeals Court (you) is ruling based on personal whim rather than the Code.
  *   *Fix:* Be explicit in Round 2: "I am not ruling on what is *true*, I am ruling on whether your Code *covers this case*." If their Code says "Fastened," and they didn't define "Fastened," you must rule against them. This models the philosophical demand for precision.

  **2. Officers Refuse to Go Extreme**
  *   *Problem:* Officers cling to common sense ("It's obviously a chair!") and bleed points.
  *   *Fix:* Let them bleed points for the first 10 minutes of Round 2. The financial pressure (Tenure Points) must be felt. If they are near bankruptcy, they will naturally gravitate toward the "Everything/Nothing" extremes to survive. Highlight this desperation in the debrief: "You adopted Universalism not because it felt true, but because it saved your job."

  **3. Smugglers Are Too Passive**
  *   *Problem:* Smugglers don't want to be adversarial.
  *   *Fix:* Give Smugglers a private "Hit List" of contradictions. If they don't appeal a contradiction, they lose points. Incentivize the attack.

  **4. Time Creep**
  *   *Problem:* Drafting the Code takes too long.
  *   *Fix:* Hard stop at 0:45. If the Code isn't on the board, they must use the last draft written, even if incomplete. This forces them to deal with the consequences of vagueness.

  ---

  ## VII. The Missing Feature: Policy vs. Fact

  **The Limitation:**
  The game treats composition as a **policy decision** (writing a Customs Code). The students act as legislators creating a rule for *counting*. However, in metaphysics, the Universalist does not claim "We should *count* everything as an object." They claim "There *are* objects everywhere, regardless of whether we count them."

  **How to Supply This Point:**
  In the final 5 minutes, interrupt the debrief.
  *   **Say:** "In this game, you were frustrated when I overturned your ruling because your Code was vague. You assumed there was a 'correct' ruling that you failed to codify. But consider the Universalist position: They would say this game is metaphysically misguided."
  *   **The Twist:** "For the Universalist, there is no 'Customs Code' to write. There is no decision to make at the border. The bricks compose an object *whether you rule 1 or Many*. Your ruling doesn't change reality; it only changes the tax. The Universalist insists composition is not a matter of policy, but a mind-independent fact. By making you write a Code, I rigged the game to make Universalism look like a convenient loophole, rather than a description of reality."

  **Who Will Feel Cheated?**
  *   **The Restrictionists (Common Sense Realists):** They will feel this move is a "bait and switch." They argued that composition is restricted based on how the world *is*. Telling them that the Universalist denies the legitimacy of the question itself undermines their intuition that the game *should* have been winnable with a moderate code.
  *   **The Nihilists:** They may feel vindicated, but also frustrated that the "Policy" framing obscured their view that *nothing* composes, not even the officers themselves.

  **Pedagogical Resolution:**
  Acknowledge the cheat. "I used a policy game to teach a factual debate because it generates conflict. Next week, we drop the game and ask: If composition isn't a policy, what *is* it? Is it a brute fact? A linguistic convention? That is where the real metaphysics begins."
