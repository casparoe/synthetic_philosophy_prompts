      *   *Selection:* I need 3-4 questions.
          1.  The Ontology of Orphaned Normativity (replacing the taxonomy).
          2.  The Taxonomy of Institutional Responses (refining the hypothesis).
          3.  The Diachronic Authority Problem (inheritance/time).
          4.  (Optional/Merged) The AI/Artificial Agent extension.
