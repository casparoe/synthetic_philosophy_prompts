  4.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the ambition, validate the intuition (the dichotomy is false), but critique the taxonomy.
      *   **Critique of Taxonomy:** Explain why the 5-way split fails (mixes categories). Propose a 2x2 matrix (Source: Agent vs. Structure; Time: Past vs. Future) or similar. Let's go with *Source of Normativity* (Will vs. Function) and *Relation to Agency* (Accessible vs. Inaccessible). Actually, simpler: *Origin* (Historical Will vs. Structural Function) and *Bearer-Status* (Extinct vs. Abstract).
      *   **The Research Questions:**
          1.  *The Metaphysics of Orphaned Normativity:* Do FFRs exist independently, or are they shorthand for counterfactual ideal agents? (Upstream).
          2.  *The Taxonomy of Institutional Response:* Validating Custodial/Expressive modes. (Midstream).
          3.  *The Decay of Force:* Do these reasons weaken over time? (Downstream).
      *   **Ordering:** 1 -> 2 -> 3. You can't know how to respond (2) if you don't know what it is (1). You can't know about decay (3) without knowing how to respond (2).
      *   **Practical Pay-offs:** Address the "binds vs. void" dichotomy. Real payoff: "Stewardship" as a distinct legal/normative category. Overrated: Trying to find the "original intent" (if the reason is free-floating, intent matters less). Non-followers: Specific policy prescriptions (philosophy won't solve specific legal disputes).
      *   **AI Application:** Is it the same problem? Yes, structurally. The designer is the "extinct bearer," the AI is the "bearerless office."
      *   **Concrete Case:** An endowed chair where the discipline no longer exists (e.g., "Chair of Phrenology" or "Chair of Imperial Administration").
