answer: |-
  **To:** The Research Committee
  **From:** External Advisor
  **Subject:** Research Agenda on Free-Floating Rationales (FFRs)

  ### 1. Preliminary Assessment: Taxonomy and Hypothesis

  Before setting the agenda, I must address the conceptual framework you have inherited. Your five-way taxonomy is phenomenologically rich but ontologically confused. It mixes the *source* of a rationale (e.g., a dead person), the *structure* of the rationale (e.g., self-effacing), and the *epistemic access* to it (e.g., unentertainable). This conflation will stall your researchers. If a postdoc spends year one determining whether a case is 'Extinct' or 'Bearerless', they are doing categorisation, not philosophy.

  I recommend you discard the five categories in favour of a two-dimensional matrix. The first dimension is **Source**: does the rationale originate in a past *Will* (a specific agent's intention) or a structural *Function* (the point of an institution regardless of founders)? The second dimension is **Bearer-Status**: is the rationale currently *Unheld* (no one holds it but someone could) or *Unholdable* (no possible agent could hold it)?

  Your hypothesis regarding response modes is more robust. The standard dichotomy (Execute vs. Void) is indeed false. However, 'Custodial' and 'Expressive' require precise definition to avoid collapsing into one another.
  *   **Custodial Response:** Preserving the rationale's content without enacting its directive, to keep it available for future agents who might be able to use it.
  *   **Expressive Response:** Acknowledging the rationale's force formally, thereby discharging the obligation to act on it without preserving its content.

  I advise you to fund research that tests this distinction rather than assuming it.

  ### 2. The Research Agenda: Three Core Questions

  For six postdoctoral fellows over four years, I propose three questions. They are ordered by logical dependency; the downstream questions cannot be coherently posed until the upstream ones are settled.

  #### Question 1: The Ontology of Orphaned Normativity (Upstream)
  **The Question:** Are free-floating rationales *sui generis* normative entities, or are they merely shorthand for counterfactual claims about ideal agents?
  **Reasoning:** This is the metaphysical foundation. If FFRs are just shorthand for "what a reasonable person *would* will if they existed," then there is no such thing as a free-floating rationale; there are only hidden actual reasons. If, however, they are *sui generis* (existing independently of any valuer), then institutions have a direct relationship with the rationale itself.
  **Tractability:** High. This is pure conceptual analysis, suitable for philosophers with no empirical budget. It involves testing edge cases (e.g., the 'last man on earth' scenarios) to see if normative force persists without a possible valuer.
  **Why Fund It:** If the answer is "shorthand," your entire programme collapses into standard contractualism. If the answer is "*sui generis*," you open a new field of normative metaphysics. This must be the first year's focus for at least two fellows.

  #### Question 2: The Taxonomy of Institutional Response (Midstream)
  **The Question:** Under what conditions is a Custodial or Expressive response normatively superior to Execution or Voiding?
  **Reasoning:** Once we know what an FFR *is*, we must determine what to *do* with it. Your hypothesis suggests four modes. We need to know the selection criteria. Is Custodial response required when the rationale is valuable but currently unactionable? Is Expressive response required when the rationale is harmful but historically significant?
  **Tractability:** Medium. This requires conceptual work grounded in institutional case studies (law, academia, trusts). It is tractable without empirical data, provided the cases are described thickly enough.
  **Why Fund It:** This delivers the practical payoff for your trustees. It moves the debate from "does this bind us?" to "how do we honour this?"

  #### Question 3: The Diachronic Decay of Force (Downstream)
  **The Question:** Does the normative force of an FFR diminish over time, and if so, by what mechanism?
  **Reasoning:** If a rationale is free-floating, does it have a half-life? A promise to a dead man might feel binding in year one and absurd in year one hundred. Is this due to changing background conditions, or does the rationale itself attenuate?
  **Tractability:** Lower. This risks becoming speculative. It depends on the answers to Q1 and Q2.
  **Why Fund It:** This addresses the 'inherited purposes' concern directly. However, it should only be pursued if Q1 establishes that FFRs are real entities capable of persisting.

  #### Questions to Decline
  Do not fund work on **psychological realism** (e.g., "how do agents feel about FFRs?"). This is empirical psychology, not normative philosophy, and will not resolve the status of the rationale. Do not fund work on **collective intentionality** in the standard sense (e.g., "what does the group believe?"). Your specific interest is in rationales *without* bearers; standard collective intentionality assumes a bearer (the group).

  ### 3. Practical Pay-offs for Institutional Reasoning

  Your trustees are concerned with the false dichotomy between "binds because willed" and "binds not at all." Here is the realistic assessment of what a successful research programme can deliver.

  **Genuine Implications:**
  1.  **Stewardship as a Distinct Category:** A robust account of FFRs validates 'Stewardship' as a third legal/normative status between 'Compliance' and 'Termination'. This allows institutions to maintain endowed posts or trusts without being held hostage to obsolete specificities.
  2.  **Decoupling Authority from Intent:** It provides a philosophical basis for ignoring 'original intent' while respecting 'original purpose'. If the rationale is free-floating, the dead donor's specific psychological state matters less than the normative structure they instantiated.

  **Overrated Implications:**
  1.  **Dispute Resolution:** Do not expect this to solve specific legal battles. Philosophy can clarify the *types* of arguments available, but it cannot weigh the specific competing values in a live trust dispute.
  2.  **Policy Prescriptions:** A good account of FFRs will not tell a university whether to sell a specific painting. It will only tell them what *kind* of reason 'preserve the collection' is.

  **Non-Followers:**
  1.  **Democratic Legitimacy:** A theory of FFRs does not solve the problem of unelected bodies holding power. In fact, it might exacerbate it by granting normative force to 'ghosts' (past donors) over living constituents.
  2.  **Moral Progress:** Establishing that FFRs exist does not prove that old rationales are morally superior to new ones. It only proves they are not automatically void.

  ### 4. The Artificial Intelligence Application

  Your programme officer asks whether specifying purposes for AI systems that outlive designers is the same problem.

  **Verdict:** It is the **same problem**, structurally, but with higher stakes.
  When you programme an AI with a purpose (e.g., "maximise human flourishing"), and the designers die, that purpose becomes a free-floating rationale. The AI is a 'bearerless office' (Category 3 in your old taxonomy). The designers are 'extinct bearers' (Category 1).
  **Why it fits:** The core difficulty is identical: how does a system pursue a goal when the valuers of that goal are gone, and the system itself cannot value?
  **Recommendation:** Include this as a sub-clause of Question 2. Do not let it dominate. The AI case is a 'hard mode' version of the Endowed Chair case. If the theory cannot handle the Chair, it will not handle the AI.

  ### 5. Concrete Case Study: The Endowed Chair in a Defunct Discipline

  To demonstrate what a result looks like, let us work through **Question 1 (Ontology)** using a concrete institutional case.

  **The Case:** A university holds a trust endowment from 1890 to fund a "Chair of Phrenology." Phrenology is scientifically discredited. The donor is dead; the beneficiaries (students of phrenology) do not exist.
  **Standard Dichotomy:** Either teach phrenology (absurd) or repurpose the funds entirely (breach of trust).

  **Applying the Research Agenda:**
  1.  **Ontological Analysis:** The researchers analyse the rationale. Is the reason "to teach phrenology" (specific content) or "to fund the study of the mind as best understood" (structural function)?
      *   *Hypothesis A:* The rationale is tied to the *Will*. It is extinct. Funds should revert or be voided.
      *   *Hypothesis B:* The rationale is *Functional*. It is a free-floating rationale to "advance understanding of human cognition." It persists.
  2.  **Response Mode:** If Hypothesis B holds, can the university take a **Custodial Response**?
      *   *Action:* The university keeps the title "Chair of Phrenology" (preserving the rationale's legibility) but appoints a neuroscientist (executing the functional purpose).
      *   *Justification:* This acknowledges the FFR without enacting the obsolete directive.
  3.  **Result:** The output is not a decision on this specific chair, but a **principle of translation**. The research would produce a test for when an FFR allows 'translation' of terms (Phrenology -> Neuroscience) versus when it requires 'extinction' (e.g., a trust for eugenics).

  **Evidence to Shift Ranking:**
  *   **Move Question 1 Up:** If, within two years, the fellows find that 'Functional' rationales consistently resist 'Will-based' dissolution across law, academia, and treaties, this confirms FFRs are real entities. This makes Q1 the priority for the remaining funding.
  *   **Move Question 1 Down:** If the analysis reveals that every alleged FFR can be reduced to a "reasonable person" standard or a "current social utility" calculation, then FFRs are fictions. The agenda should pivot immediately to Question 2 (Response Modes) as a matter of pragmatic policy, abandoning the metaphysical quest.

  ### 6. Summary of Recommendation

  1.  **Reject the five-way taxonomy.** Adopt a Source/Status matrix.
  2.  **Fund Question 1 first.** Two fellows on Ontology. If FFRs aren't real, stop.
  3.  **Fund Question 2 second.** Three fellows on Response Modes (Act, Void, Custodial, Expressive). This is your practical payoff.
  4.  **Fund Question 3 last.** One fellow on Diachronic Decay, contingent on Q1's success.
  5.  **Treat AI as a stress-test** for Q2, not a separate stream.

  This agenda ensures you do not spend four years categorising shadows. It forces a decision on the reality of the phenomenon early, ensuring that if the concept is flawed, you know by year two, not year four.
