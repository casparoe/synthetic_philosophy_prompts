answer: |-
  (1) Reconstruction of the summary's claims
  The student argues that Plutarch's *Parallel Lives* functions not as history but as moral taxonomy, pairing Greeks and Romans to illustrate fixed Stoic virtues. They claim Plutarch's didactic purpose leads to hagiography, where contradictory evidence is suppressed and events reshaped to fit ethical arcs. Consequently, the concluding *synkrisis* is viewed as a simplistic grading rubric rather than nuanced analysis. The summary concludes that while Plutarch is historically significant for character studies, his method is obsolete for modern moral philosophy and unreliable for social history, serving only as a precursor to genuine biography rather than a viable model for ethical learning today.

  (2) Accurate elements—what Plutarch actually does and intends
  The summary correctly identifies Plutarch's primary intent: moral improvement rather than strict historiography. Plutarch explicitly states in *Alexander* that he is writing lives, not histories, focusing on character (*ethos*) revealed through slight incidents rather than grand battles. The comparative structure is indeed central, pairing figures to illuminate shared virtues or vices across cultures. It is also true that Plutarch selects episodes illustrative of character, sometimes prioritizing moral clarity over chronological precision. Modern historians do rightly caution against using the *Lives* as sole evidence for social history due to this selectivity. The didactic aim is undeniable; Plutarch wants readers to emulate or avoid specific traits. Thus, the student accurately captures the teleological nature of the text and its prioritization of ethical utility over factual exhaustiveness.

  (3) Subtle misrepresentations and conflations
  However, significant conflations undermine the summary. First, labeling Plutarch's framework a "fixed Stoic-virtue grid" is philosophically inaccurate; Plutarch was a Middle Platonist who often critiqued Stoic paradoxes. His virtue ethics are flexible, exploring the interplay of fortune (*tyche*) and character, not rigid binaries. Second, calling the work "hagiography" exaggerates his sanitization. Plutarch frequently highlights flaws—Alexander's rage, Demosthenes' cowardice—complicating rather than erasing moral ambiguity. He selects evidence rather than fabricating it; omission is not necessarily falsehood. Third, the *synkrisis* is not a mere grading rubric but a complex rhetorical exercise weighing contextual differences, often leaving the verdict open-ended. Finally, dismissing him for social history conflates purpose with utility; while not a sociologist, his details on custom and habit remain invaluable. The summary treats moral selection as moral falsification, ignoring the ancient understanding of truth as representative rather than purely empirical.

  (4) What a careful reader of Plutarch or a defender of exemplary biography would likely object to
  A defender of exemplary biography would object that the summary misunderstands how moral learning operates in the *Lives*. Plutarch does not offer static icons but dynamic psychological portraits where virtue is a struggle, not a possession. The reader is invited to judge, not merely obey, engaging in the same moral reasoning as the biographer. Scholars like Duff or Pelling argue that Plutarch's nuance allows for conflicting interpretations, fostering moral autonomy rather than dogmatism. Furthermore, dismissing exemplarity as obsolete ignores contemporary virtue ethics' revival, which seeks precisely this kind of narrative-based moral reasoning. The claim that selection equals fabrication denies the literary nature of all biography. A defender would argue that Plutarch's method remains viable because it treats character as opaque and developmental, offering a model for understanding agency that modern reductionist biographies often lack.

  (5) Verdict on whether the conclusion survives
  Once corrected, the conclusion that Plutarch's method is obsolete does not survive. While his metaphysical framework differs from modern ethics, his technique of using narrative to explore moral psychology remains potent. The summary mistakes moral *focus* for moral *simplification*. Plutarch offers a sophisticated model for how lives can teach ethics without reducing humans to data points. While modern biography requires different factual standards, Plutarch's approach to character formation is not useless but rather a distinct, still-relevant genre of moral philosophy that complements contemporary life-writing.
