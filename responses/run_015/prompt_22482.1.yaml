  10. **Self-Correction/Edge Case:** What if $N$ is auto-scaling? Then $N$ *is* part of the hypothesis. Then SIA-like reasoning *might* apply (more replicas exist in high-load states). But the user said "My service runs N replicas," implying fixed $N$. I should mention auto-scaling as a caveat where the debate *does* matter.

  11. **Final Structure:**
      *   Executive Summary: It's sampling bias, not metaphysics.
      *   The Math: Show why $N$ cancels out for fixed $N$.
      *   SSA vs. SIA translated to Engineering: Random Sampling vs. Volume Weighting.
