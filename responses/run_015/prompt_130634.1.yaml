answer: |-
  You have put your finger on one of the most persistent and uncomfortable tensions in political economy and ethics. The inconsistency you're noticing isn't just bureaucratic inertia; it reflects a clash between two different philosophical frameworks for how we value things: **welfarism** (does this increase overall utility/efficiency?) and **deontology/expressivism** (does this violate a moral norm or degrade the meaning of a good?).

  Economists tend to look at these transactions and see "mutually beneficial exchange." Philosophers and sociologists look at them and see "category errors."

  Here is a breakdown of the philosophical commitments that create the split you're observing, and why the scientific publishing example exposes a deep hypocrisy in the system.

  ### 1. The Argument from Meaning (Sandel & Anderson)
  The most prominent philosophical defense against commodification comes from Michael Sandel (*What Money Can't Buy*) and Elizabeth Anderson (*Value in Ethics and Economics*). Their argument is that markets are not neutral mechanisms; they embody and promote certain norms, and they can crowd out others.

  *   **The Vote:** If you sell your vote, you transform citizenship from a **civic duty** into a **private asset**. The philosophical commitment here is that democracy requires a specific kind of equality (one person, one vote) that is destroyed if votes are priced. Lobbying is tolerated (in the US especially) because it is framed as "petitioning the government" (speech), whereas vote buying is framed as "delegating sovereignty." It is a distinction between buying *access* versus buying *outcome*.
  *   **The Kidney:** If you sell a kidney, you transform the body from a **subject** (something you *are*) into an **object** (something you *have* and can parcel off). The philosophical commitment is bodily integrity. Plasma is tolerated because it regenerates; it is treated more like a renewable resource (like hair or labor) than a constitutive part of the self.
  *   **The Science:** This is where your example is sharpest. The Mertonian norms of science (Communism, Universalism, Disinterestedness, Organized Skepticism) presuppose that truth is a public good. If you introduce a prediction market, you are shifting the norm from "truth-seeking" to "profit-seeking." The fear is that researchers might start gaming the market (e.g., hyping controversial results to move odds) rather than pursuing rigorous, boring replication.

  **The Commitment:** Some goods lose their value if they are bought and sold. A friendship bought is no longer a friendship; a vote bought is no longer a democratic expression.

  ### 2. The Argument from Coercion and Inequality (Marx & Polanyi)
  The second philosophical commitment is about power. Karl Polanyi argued that land, labor, and money are "fictitious commodities" because they were not created to be sold. Treating them as such destroys the social fabric.

  *   **Inequality:** Markets amplify existing wealth disparities. If kidneys are sold, the rich will have healthy bodies and the poor will have spare parts. If votes are sold, the rich will own the government. We tolerate lobbying because we have (perhaps naively) accepted that wealth inequality will translate into political inequality, but we draw the line at direct vote buying because it makes that inequality too explicit and absolute.
  *   **Desperation:** A "voluntary" sale of a kidney by a starving person is not truly voluntary in a philosophical sense; it is coerced by circumstance. We allow plasma donation because the physical risk is low; we forbid kidney sales because the physical risk is high, making the exploitation of the poor too visceral.

  **The Commitment:** A market is only legitimate if the parties have roughly equal bargaining power and are not driven by desperation. When the transaction relies on the seller's destitution, it is deemed "repugnant."

  ### 3. The Hypocrisy of Scientific Publishing
  Your point about academic publishing is the most damning because it reveals that we often object not to commodification itself, but to **explicit** commodification.

  *   **The Current System:** It is already a market. Publishers (Elsevier, Springer, etc.) are for-profit corporations with massive margins. They sell access to knowledge that was publicly funded. Peer reviewers work for free, which is effectively a subsidy from the public sector to private shareholders. This is a market; it's just a **hidden** one where the currency is "prestige" rather than cash.
  *   **The Prediction Market:** This makes the pricing **explicit**. It says, "This truth is worth $X."
  *   **Why the Freak-out?**
      1.  **Motivation Crowding:** Psychologists argue that introducing financial incentives can crowd out intrinsic motivation. Reviewers might do a good job because they care about science. If you pay them per review, they might rush to do more reviews. If you let people bet on replication, researchers might prioritize "bettable" studies over important but complex ones.
      2.  **The "Yuck" Factor of Explicitness:** Society tolerates implicit exploitation (unpaid labor, paywalls) more than explicit betting on truth. Explicit pricing makes the inequality and the instrumentalization undeniable. It forces us to admit that science is a commodity.

  ### 4. Who Holds the Power?
  You asked if the issue is about who holds power. In many cases, **yes**.

  *   **Lobbying:** Power holds the pen. Corporations hire lobbyists. This is an *upward* flow of influence (money to power). It is protected because it serves the interests of those who write the laws.
  *   **Vote Buying:** This is a *lateral* or *downward* flow (money to voter). It threatens the legitimacy of the rulers. If votes can be bought, the elite cannot rely on ideology or loyalty; they must rely on cash, which is inefficient and unstable for governance.
  *   **Science:** Currently, power holds the journals. The shift to prediction markets would transfer some epistemic authority from "established institutions" to "the market." The resistance often comes from incumbents (tenured professors, journal editors) whose status is derived from the current prestige economy, not a financial one.

  ### Summary: The "Repugnance" is Often About Deniability
  The philosophical commitment that explains the split is **the maintenance of social fictions.**

  We need to believe that votes are about civic duty, not cash, or democracy feels like a sham. We need to believe that science is about truth, not betting, or knowledge feels like a casino. We need to believe that kidneys are sacred, or the poor feel like livestock.

  The current academic publishing model survives because it hides the commodification behind the language of "prestige" and "service." It allows universities to feel noble while publishers get rich. Prediction markets strip away that veil. They force us to admit that we are allocating resources based on speculative value.

  The inconsistency you see is the gap between **what we say we value** (dignity, truth, democracy) and **how we actually allocate resources** (money, power, efficiency). We forbid the markets that make that contradiction too obvious to ignore.

  *   **Plasma:** Low risk, renewable, doesn't challenge the "sacred body" fiction too much.
  *   **Kidney:** High risk, non-renewable, shatters the "sacred body" fiction.
  *   **Lobbying:** Buys access, maintains the fiction that "ideas" influence policy.
  *   **Vote Buying:** Buys outcomes, shatters the fiction that "citizens" influence policy.
  *   **Publishing:** Hidden profit, maintains the fiction of "academic altruism."
  *   **Prediction Markets:** Explicit profit, shatters the fiction of "disinterested science."

  The philosophical commitment is not consistency; it is **plausible deniability.** We allow markets where the commodification can be disguised. We ban them where the price tag is too visible to ignore.
