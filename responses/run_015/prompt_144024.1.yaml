answer: |-
  **Research Proposal**

  **Title:** The Epistemology of Material Silence: Inferring Negative Institutions in Archaeological Contexts

  **1. The Research Question**
  Standard archaeological inference relies on abduction (Inference to the Best Explanation) applied to positive material traces: a temple implies religion; a wall implies conflict. But social institutions often function through prohibition—rules that mandate *non-action*. If a region systematically lacks defensive fortifications despite high inter-group violence, is this evidence of a "negative institution" (a taboo against walling), or merely a lack of resources/need?

  The core research question is: **Under what specific epistemic conditions does systematic material absence constitute valid evidence for institutional prohibition, rather than taphonomic noise or practical irrelevance?**

  This project seeks to determine if there is a coherent logic for inferring "negative institutions" without committing the "absence of evidence is not evidence of absence" fallacy.

  **2. Background and Gap**
  Current archaeological theory handles absence poorly. In processual frameworks, absence is often treated as a null variable—something to be controlled for rather than analyzed. In post-processual hermeneutics, absence is sometimes read as symbolic (e.g., aniconism), but these readings are often ad hoc and lack rigorous criteria for distinguishing cultural choice from preservation bias.

  In the philosophy of science, Inference to the Best Explanation (IBE) is well-developed for explaining *observed* phenomena. However, there is little work on IBE for *unobserved* phenomena where the non-observation is the data point itself. The "problem of negative institutions" sits in this gap. We lack a framework to distinguish between:
  1.  **Taphonomic Silence:** The object existed but decayed/was not found.
  2.  **Practical Silence:** The object was unnecessary (no need for walls).
  3.  **Institutional Silence:** The object was prohibited or culturally unintelligible (taboo against walls).

  Existing literature treats these as distinct problems to be solved by better excavation or context. I argue they are fundamentally *epistemic* problems requiring a revised logic of inference.

  **3. Methodology**
  Given the one-semester constraint, this project will be conceptual and comparative, not empirical fieldwork. I will construct a heuristic framework for validating inferences from absence.

  *   **Weeks 1–4: Conceptual Taxonomy.**
      I will define "Negative Institution" operationally. I will distinguish between *active prohibition* (you will be punished for building a wall) and *passive structural absence* (the concept of a wall does not exist). I will review philosophical models of counterfactual reasoning to see how they apply to material culture.

  *   **Weeks 5–9: Comparative Case Analysis.**
      I will select three contrasting archaeological cases where absence is central:
      1.  *Neolithic settlements without fortifications* in conflict zones (e.g., specific LBK sites vs. contemporary walled sites).
      2.  *Aniconic traditions* (absence of figural representation) in Bronze Age contexts.
      3.  *Food taboos* inferred from faunal absence (e.g., no pig bones in a region where pigs thrive).
      For each, I will reconstruct the arguments archaeologists currently use to claim "absence = rule" and identify where the logic relies on unstated assumptions.

  *   **Weeks 10–13: Framework Construction.**
      I will draft a set of necessary conditions for valid inference from absence. For example, a valid inference might require:
      *   *Capacity:* Evidence that the group *could* have made the object (technology/resources existed).
      *   *Contrast:* Evidence that neighboring/similar groups *did* make the object.
      *   *Consistency:* The absence is statistically significant across multiple sites, not isolated.
      I will test these conditions against the case studies to see if they successfully filter out false positives.

  *   **Weeks 14–15: Synthesis.**
      Finalize the paper, focusing on the limits of the framework.

  **4. Expected Results and Success Criteria**
  **Success:** The project produces a "Decision Tree" or set of criteria that allows an archaeologist to argue for a negative institution with defined confidence levels. It clarifies that absence is only evidence when the *expectation of presence* is independently justified.
  **Failure:** The project demonstrates that absence is inherently underdetermined. If I find that "Capacity" and "Contrast" can never be fully established without relying on circular reasoning (assuming the institution to prove the capacity), then the conclusion will be that negative institutions are archaeologically inaccessible. This negative result is still a valid philosophical contribution.

  **5. Scope and Limitations**
  This is a philosophy of archaeology paper, not an archaeological report. I am not re-analyzing the stratigraphy of the case studies myself; I am analyzing the *logic of the claims* made about them. I will not address taphonomic processes in detail (soil chemistry, decay rates) except where they impact the logical validity of the inference. The scope is limited to social institutions; I will not address cognitive universals or biological constraints.

  ***

  **Meta-Commentary on Feasibility and Reasoning**

  **What would change my mind on feasibility?**
  I am currently skeptical that we can ever fully escape the "absence of evidence" trap because archaeological records are inherently fragmentary. However, my skepticism would be overturned if there were a demonstrated case where a **Bayesian framework** was successfully applied to archaeological absence. If a researcher could show that, by assigning prior probabilities to preservation rates and technological capacity, the posterior probability of a "cultural taboo" rises above a specific threshold (e.g., >95%) in a way that is later confirmed by textual evidence (in proto-historical contexts), I would concede that the inference is doable. Without a probabilistic model, the inference remains qualitative and vulnerable to bias.

  **Where is my reasoning shakiest?**
  My reasoning is weakest on the distinction between **unconscious habit** and **institutional prohibition**. My proposal assumes that if a material trace is missing, it is either due to practical constraints or a rule. However, human behavior is often driven by unarticulated norms that are neither "practical" nor "prohibited"—they are simply invisible categories. If a society doesn't build walls because the *concept* of bounded space doesn't exist for them (ontological difference), my framework might misclassify this as a "negative institution" (a rule against walls) rather than a conceptual absence. Distinguishing between "we do not do X" (rule) and "X is not a thing" (ontology) via material absence alone may be impossible, and I have not yet found a way to account for this in my criteria.
