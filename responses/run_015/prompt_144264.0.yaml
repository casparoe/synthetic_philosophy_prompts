answer: |-
  Section 1: Framing and theoretical purpose

  This theoretical framework aims to resolve the conflict between intuitive moral priorities and formal aggregation in normative ethics and institutional policy. Its primary purpose is to guide decision-making where severe suffering exists alongside potential gains in general welfare, such as in triage medicine or global development. The theory must avoid the counterintuitive implications of pure negative utilitarianism, such as destroying humanity to prevent minor pain, while rejecting standard utilitarianism's willingness to trade severe agony for trivial pleasures. Non-negotiable desiderata include internal logical coherence, action-guidance capability, and avoidance of moral absurdities. Negotiable preferences include the specific numerical value of the suffering threshold, the rate of temporal discounting, and the precise weighting of psychological versus physical pain. The theory must serve as a robust tool for evaluating policies that affect large populations with divergent welfare baselines, ensuring that the reduction of extreme suffering is prioritized without rendering the promotion of well-being morally irrelevant once safety is secured.

  Section 2: The desiderata list

  1. **Threshold Definability:** The theory must specify a clear welfare boundary separating lexical priority zones from standard aggregation zones. It must handle cases where suffering hovers near the threshold intensity. Failure leads to arbitrary decision-making in borderline cases, undermining policy reliability and legal consistency. This is non-negotiable.

  2. **Metric Unity:** Pleasure and pain must be measurable on a single cardinal scale to allow summation. This addresses cross-modal comparisons, such as physical pain versus psychological distress. Without a unified metric, aggregation across different types of experiences becomes impossible, collapsing the theory into value pluralism which cannot resolve trade-offs. This is non-negotiable.

  3. **Lexical Strength:** Within the threshold, no amount of diffuse pleasure can outweigh significant suffering. This handles cases like torture versus minor conveniences. If this fails, the theory collapses into standard weighted utilitarianism, losing its negative priority core and permitting unacceptable exploitation of the vulnerable for aggregate gain. This is non-negotiable.

  4. **Inter-personal Aggregation:** The metric must sum across individuals without bias toward specific identities. This addresses aggregation across individuals with divergent baseline welfare. Failure implies unacceptable discrimination between persons, violating egalitarian constraints essential for public policy and justice. This is non-negotiable.

  5. **Temporal Consistency:** Future suffering must be weighted consistently against present pleasure. This handles temporal discounting of future pains. Inconsistent discounting undermines long-term planning and intergenerational justice, allowing present agents to offload catastrophic costs onto future populations. This is negotiable depending on the theory of time.

  6. **Structural Integration:** The theory must accommodate structural incommensurability, where pain disintegrates agency while pleasure reinforces it. This addresses the niche problem where pain is not just negative pleasure but a disintegration of practical identity. To maintain a single metric, the theory must translate agency-disruption into welfare units by weighting pain higher due to its destructive impact on the capacity for future welfare, rather than treating it as a qualitatively distinct value. Failure reduces the model to simplistic hedonism that ignores the structural conditions of valuing. This is non-negotiable.

  7. **Non-Catastrophic Implications:** The theory must not mandate world destruction to eliminate minor suffering. This handles the classic pinprick objection. This is the primary failure mode of negative utilitarianism; avoiding it is essential for moral plausibility and political viability. This is non-negotiable.

  8. **Empirical Tractability:** Policymakers must be able to estimate welfare states using available data. This handles operationalization in institutional settings. If the metric is theoretically sound but unmeasurable, it fails as a practical guide for real-world intervention. This is negotiable based on technological progress.

  Section 3: Joint unsatisfiability and trade-offs

  A critical cluster of desiderata creates a formal impossibility under standard decision theory. Specifically, Metric Unity (Desideratum 2) typically requires a continuous real-valued utility function to allow for cardinal substitution and aggregation. However, Lexical Strength (Desideratum 3) implies a lexicographic ordering where one value dominates another regardless of magnitude within a specific domain. A standard mathematical result, often associated with Debreu's representation theorem, demonstrates that lexicographic preferences cannot be represented by a continuous real-valued function.

  Consequently, one cannot simultaneously maintain full commensurability on a continuous real scale and strict lexical priority. The theory faces a forced trade-off: either abandon strict lexicality in favor of extremely high but finite weights (sacrificing Desideratum 3 to save Desideratum 2), or abandon continuity and accept a discontinuous utility function that breaks standard aggregation rules (sacrificing aspects of Desideratum 2 to save Desideratum 3). Additionally, combining Inter-personal Aggregation with Lexical Strength risks an Arrow-style impossibility, where no social welfare function can satisfy unrestricted domain, independence of irrelevant alternatives, and lexical non-dictatorship simultaneously. To remain viable, the theory must explicitly concede that its "commensurability" is approximate or relies on non-standard number systems, acknowledging that strict lexicality introduces a structural break in the welfare metric.

  Section 4: Brief scoring against main contenders

  Pure Lexical Negative Utilitarianism scores highly on Lexical Strength and Non-Catastrophic Implications (if modified) but fails Metric Unity entirely, as it treats pain and pleasure as fundamentally different kinds of value that cannot be summed. It also struggles with Structural Integration, often viewing pain only as something to be removed rather than analyzing its relation to agency.

  Standard Cardinal Utilitarianism with a suffering-weighted metric excels at Metric Unity, Inter-personal Aggregation, and Empirical Tractability. However, it fundamentally fails Lexical Strength. No matter how high the weight on suffering, a sufficiently large amount of trivial pleasure can theoretically outweigh severe agony, violating the core intuition driving the threshold model. It also tends to overlook Structural Integration, treating pain as merely negative utility.

  A Two-Tier Threshold Model performs best overall. It satisfies Threshold Definability and Non-Catastrophic Implications by design. It approximates Metric Unity by using a single currency below the threshold. However, it inherits the Joint Unsatisfiability problem identified in Section 3 regarding continuity at the boundary. It scores moderately on Structural Integration, as it can assign higher weights to agency-disrupting pain, but often lacks the formal machinery to explain why the structural difference maps to cardinal units without ad hoc adjustments.

  Section 5: Epistemic note

  I am highly confident in the analysis regarding the joint unsatisfiability of continuous metrics and lexical orderings, as this is a settled result in formal welfare economics. I am moderately confident in the scoring of the Two-Tier Threshold Model, as variations exist that might mitigate the continuity break. I am least sure about Desideratum 6 (Structural Integration). Pinpointing exactly how to translate the qualitative disintegration of agency into a cardinal welfare unit without collapsing into pluralism remains the most philosophically precarious element of this specification.
