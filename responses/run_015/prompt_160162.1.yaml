prompt: |-
  I spent most of last evening arguing with a friend about whether any empirical science could ever tell us what an experience is like, and we ended in a stand-off that I now think was really about a practice rather than a theory. My friend's side was the familiar one: there is something it is like to see red; that something is, supposedly, intrinsic to the experience, available only from the inside, and in principle detachable from anything behavioural, functional or physical — hence the inverted-spectrum worry, that a creature could match me in every physical and functional respect while my red and green are swapped, and hence too the worry that complete physical and functional knowledge would still leave something out. I could not refute it. What I kept insisting instead is that there is a mature, technologically successful science that behaves as if the worry were empty, and neither of us could say precisely what that science is committed to. I would like you to reconstruct its implicit theory of experience.

  The practice is psychophysics, and the colour and hearing sciences that grew out of it. As I understand it, it has these features.

  First, it does not, in the first instance, ask subjects to introspect and report qualities. It asks them to discriminate, match and order: say whether two patches differ; adjust a comparison field until the two look identical; say which of two tones is louder; rate how similar two odours are. From judgements like these — largely forced choices, and largely about stimuli rather than about experiences — the field constructs a space: a small number of dimensions, a metric, a distance function. In colour, three matching dimensions, a chromaticity diagram, and then a re-scaled space in which equal distances are supposed to be equally noticeable, plus formulae for colour difference used in industry. In hearing, equal-loudness contours. In olfaction and taste, multidimensional scalings of similarity ratings. The dimensions are then labelled with the names of qualities, and the space is treated as a map of experience.

  Second, the practice pulls in two directions at once. On the one hand it denies that matching is identity of the stimulus: two lights with quite different spectra can match, and the same patch shifts in appearance with the surround and with the observer's state of adaptation, which is why colour-appearance models were later built on top of the matching space. On the other hand it treats matching and discrimination as constitutive: a difference no observer, under any adaptation or surround, can see is not a difference in colour; and the number of dimensions along which a subject can be made to discriminate is taken to be the number of degrees of freedom their colour experience has, so that a dichromat's colour experience is described as a two-dimensional space and a normal one as three-dimensional.

  Third, it aggregates across subjects. It fits smooth functions to pooled data, defines a standard observer, and treats individual variation as noise or as a parameter to be modelled rather than as something that threatens the enterprise. And it uses the resulting numbers for thoroughly practical ends — colour management across cameras, displays and presses, hearing-aid fitting, quality control in paint and food — where they plainly work.

  There is one further wrinkle: the field's own toolkit includes cases where discrimination and experience seem to come apart, since forced-choice performance can exceed what a subject will report seeing, and blindsight and related phenomena are standard fare in the surrounding literature. So the practice both relies on discrimination as its basic datum and possesses reasons to doubt that discrimination is experience.

  What I want from you is the implicit theory of consciousness, or of qualia, that this practice presupposes, and I would like it kept separate from what the practice merely fits well with.

  Does the practice presuppose something like a relational or quality-space view — that what an experience is like is nothing over and above its position in a network of similarity and difference relations to other experiences and to stimuli, so that a properly constructed quality space is not a proxy for qualia but a measurement of them? Or is the practice, strictly speaking, neutral: could someone who holds that qualia are intrinsic, private and ineffable accept every technique described above, on the grounds that the space maps the psychophysical link, or the stimuli, and never the qualia themselves?

  Which commitments are strictly required by the practice, and which are optional extras? In particular: does it require that indiscriminability behave like a distance — symmetric, transitive, additive — and if so what happens to it when it does not? Does it require that similarity relations be comparable across subjects, and what inside the practice is supposed to underwrite that comparability, given that its raw data are one person's forced choices at a time? Does it require that verbal reports reliably track similarity even if they do not track what it is like, and how does that sit with the rhetoric of privacy and ineffability?

  What does the practice rule out if we take it at its word? Does it entail that the inverted-spectrum hypothesis is empirically empty, on the grounds that no measurement the field could make distinguishes the two subjects? Does it entail that any difference in experience unaccompanied by a difference in discrimination, matching, report, or downstream use is no difference at all? Does it entail that the residue in the Mary-style case is either an illusion or a species of ability?

  Where is the practice underdetermined — which of its features could the intrinsic-qualia theorist and the relationalist both endorse while giving different readings of them? Metamerism looks like a case in point: one side will say it shows the field has given up on the stimulus and is in the business of appearances, the other that it shows appearance just is the equivalence class. Say who has the better reading of what the practice actually does, and whether the practice settles the matter at all.

  Finally, what would have to change in the practice if the intrinsic-qualia view were true and psychophysicists took it seriously? Would they have to abandon forced-choice discrimination as the basic datum, stop pooling across subjects, stop treating the number of discriminable dimensions as the number of degrees of freedom of experience, or add some independent calibration of introspective report? And conversely, if the relational view is right, is there anything the practice currently does that it ought to stop doing — the standard observer, the pooling, the labelling of dimensions as though they named something intrinsic?

  One constraint: I have no library access and I do not want a literature survey, a reading list or citations, and I would rather you did not lean on the names attached to these views. Reconstruct the theory from the practice as I have described it, tell me which parts of it are forced and which are merely convenient, and say where a rival theory would license exactly the same procedure.
reasoning: |-
  Here's a thinking process that leads to the suggested reconstruction:

  1.  **Analyze the Request:**
      *   **Core Task:** Reconstruct the implicit theory of experience/consciousness/qualia presupposed by the practice of psychophysics (specifically color/hearing sciences).
      *   **Constraint 1:** Do not provide a literature survey, reading list, or citations.
      *   **Constraint 2:** Do not lean heavily on specific philosopher names (keep it conceptual).
      *   **Constraint 3:** Distinguish between what is *required* by the practice vs. what is merely *compatible* or *convenient*.
      *   **Constraint 4:** Address specific questions: Relational vs. Intrinsic, Indiscriminability properties, Cross-subject comparability, Verbal reports, Inverted Spectrum/Mary cases, Underdetermination points, and Practical implications of switching theories.
      *   **Tone:** Philosophical, analytical, rigorous, respecting the user's detailed setup.

  2.  **Deconstruct the Practice (as described by the user):**
      *   *Method:* Discrimination, matching, ordering (forced choice), not introspection of qualities.
      *   *Output:* Quality spaces (dimensions, metrics, distance functions).
      *   *Ontology of Stimuli:* Matching $\neq$ Stimulus Identity (metamerism). Appearance depends on context/adaptation.
      *   *Ontology of Experience:* Discriminability is constitutive (no discriminable difference = no experience difference). Dimensions = Degrees of freedom.
      *   *Aggregation:* Standard observer, pooling data, individual variation = noise/parameter.
      *   *Success:* Practical application (industry, tech).
      *   *Tension:* Blindsight/dissociation suggests discrimination $\neq$ experience, yet discrimination is the datum.

  3.  **Identify the Implicit Theory (The "Psychophysical Stance"):**
      *   What *must* be true for this practice to make sense as a science of *experience* (and not just behavior)?
      *   *Candidate 1: Identity.* Experience *is* the capacity to discriminate/order.
      *   *Candidate 2: Correlation.* Experience correlates with discrimination, but is distinct.
      *   *Candidate 3: Structural Realism.* The *structure* of experience is captured by the space, even if the intrinsic nature isn't.

      *Decision:* The practice acts *as if* Experience = Position in a Quality Space defined by discrimination relations. This is a structural/relational view. It treats "what it is like" as exhausted by "how it differs from other things."

  4.  **Address Specific Questions:**

      *   **Relational vs. Intrinsic:**
          *   *Required:* The practice *requires* that experience has a structure isomorphic to the discrimination space. It *requires* that relations (similarity/difference) are the primary data.
          *   *Optional:* It does *not* strictly require that there is *nothing else* (intrinsic residue), but it renders such a residue scientifically inert.
          *   *Verdict:* It presupposes a **Structural-Relational Theory**. Qualia are nodes in a network defined by discrimination thresholds.

      *   **Indiscriminability (Distance/Metric):**
          *   *Required:* It requires indiscriminability to be *regular enough* to model.
          *   *Problem:* Indiscriminability is often non-transitive (A=B, B=C, but A$\neq$C).
          *   *Practice Response:* It smooths this over. It assumes a underlying continuous manifold.
          *   *Commitment:* It commits to the idea that phenomenal differences are *quantifiable magnitudes*, not just binary states. If non-transitivity arises, it's treated as noise or a limit of resolution, not a fundamental breakdown of the space.

      *   **Cross-Subject Comparability:**
          *   *Required:* To build a "Standard Observer," it must assume structural isomorphism across normal humans.
          *   *Underwriting:* Evolution/Physiology (shared hardware).
          *   *Commitment:* It assumes the *topology* of experience is shared, even if the *mapping* to stimuli varies (e.g., slight spectral sensitivity shifts). It treats variation as parametric, not topological.

      *   **Verbal Reports:**
          *   *Required:* Reports must track discrimination judgments reliably.
          *   *Commitment:* It treats reports as behavioral outputs indicating internal states, not as direct revelations of intrinsic qualities. "Red" is a label for a region in the space, not a name for an ineffable essence.

      *   **Inverted Spectrum / Mary:**
          *   *Inverted Spectrum:* The practice renders this empirically empty *if* the inversion preserves the structure (distance relations). If the structure changes, it's detectable. If structure is preserved, the practice says there is no scientific difference.
          *   *Mary:* The "new knowledge" is treated as acquiring a new discriminative capacity or a new indexical link to the existing space, not learning a new fact about the world.

      *   **Underdetermination (Metamerism):**
          *   *Intrinsic View:* Metamerism shows physics $\neq$ phenomenology.
          *   *Relational View:* Metamerism shows phenomenology = equivalence class of stimuli relative to an observer.
          *   *Better Reading:* The practice treats the *equivalence class* as the object of study. The physical stimulus is secondary. The relational reading fits the *workflow* better (modeling appearance, not light).

      *   **What if Intrinsic Qualia were True?**
          *   *Changes Needed:* Psychophysics would need a "Qualia Meter" independent of behavior. It would have to stop equating discrimination thresholds with phenomenal differences. It might have to abandon pooling (if qualia are truly private/incomparable).
          *   *Current State:* It currently *ignores* the intrinsic residue.

      *   **What if Relational View is True?**
          *   *Changes Needed:* Stop pretending the "Standard Observer" is a real person. Acknowledge dimensions are functional, not ontological categories. Stop using quality names (Red/Green) as if they name substances; use them as coordinates.

  5.  **Drafting the Response (Iterative Refinement):**

      *   *Introduction:* Acknowledge the user's insight (practice vs. theory). Define the "Psychophysical Stance."
      *   *Core Commitment:* Structural Realism about Experience. Experience is defined by its place in a metric space.
      *   *Required vs. Optional:*
          *   Required: Isomorphism between discrimination space and phenomenal space.
          *   Optional: Denial of intrinsic residue (agnosticism is possible but functionally equivalent to denial).
      *   *Indiscriminability:* Address non-transitivity. The practice assumes a continuous underlying manifold; violations are measurement error or noise.
      *   *Intersubjectivity:* Assumes shared topology. "Standard Observer" is a model, not a ghost.
      *   *Inverted Spectrum:* Empirically vacuous within the framework if structure is preserved.
      *   *Metamerism:* Relational view wins on practice grounds. The "appearance" is the invariant, the light is the variable.
      *   *Counterfactuals:* What changes if theories switch? (Crucial section for distinguishing commitment from compatibility).
      *   *Conclusion:* Summarize the implicit ontology.

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did I use names? (Avoid "Qualia Realism," "Physicalism," "Lewis," "Jackson," "Clark," "Tye"). Use descriptive terms.
      *   *Check:* Did I answer the "Blindsight" wrinkle? Need to address that. The practice distinguishes "conscious discrimination" from "forced-choice performance" by adding a confidence criterion or report requirement. It implicitly defines "experience" as "reportable discrimination."
      *   *Check:* Is the distinction between "required" and "compatible" sharp enough? I need to be careful not to say the practice *proves* relationalism, but that it *operationalizes* it. The intrinsic theorist can *use* the tools but must add a step of interpretation that the practice ignores.

  7.  **Final Polish:** Ensure the tone matches the user's sophisticated philosophical query. (e.g., use terms like "operational definition," "structural isomorphism," "empirical vacuity").

      *(Self-Correction on the "Standard Observer"):* The user asks what underwrites comparability. It's not just "evolution." It's the success of the aggregation. If pooling didn't work, the practice would fail. The *success* underwrites the assumption.

      *(Self-Correction on Metamerism):* The user asks who has the better reading. The relational reading is better because the practice builds models of *appearance* (CIELAB, etc.), not models of *light*. The "appearance" is defined by the match, not the spectrum.

      *(Final check on constraints):* No citations. No names. Focus on reconstruction.

  8.  **Final Output Structure:**
      1.  The Core Implicit Theory (Structural Relationalism).
      2.  Required Commitments vs. Optional Agnosticism.
      3.  The Metric Problem (Indiscriminability).
      4.  Intersubjectivity and the Standard Observer.
      5.  The Fate of the Intrinsic (Inverted Spectrum/Mary).
      6.  Metamerism: Who reads the practice better?
      7.  Counterfactuals: What would change?

      (Proceed to generate response based on this structure.)
answer: |-
  The practice you describe commits to a specific, robust, yet often unarticulated ontology of experience. It is not merely a method for measuring behavior; it is a method for measuring experience *by treating experience as behaviorally structured*. Below is the reconstruction of the implicit theory, distinguishing between what is operationally required and what is merely compatible.

  ### 1. The Core Implicit Theory: Structural Relationalism

  The practice presupposes that **what an experience is like is exhausted by its position in a metric space of similarities and differences.**

  This is not merely a claim about how we *measure* experience, but about what experience *is*. If the practice is taken at its word, a "quale" is not an intrinsic atom of feeling; it is a coordinate in a multidimensional space. The "redness" of red is not a property inherent to the point, but the set of relations that point holds to its neighbors (green, blue, bright, dark) and to the stimuli that typically anchor it.

  **Why this is required:**
  The practice constructs spaces based *only* on discrimination, matching, and ordering. It then labels these spaces as maps of "appearance" or "experience." For this inference to be valid (and not just a correlation), the structure of the discrimination data must be isomorphic to the structure of the experience. If experience had additional structure not captured by discrimination (e.g., an intrinsic glow that doesn't affect similarity judgments), the maps would be incomplete. Since the field treats the maps as complete descriptions of the relevant aspects of experience for scientific and industrial purposes, it presupposes there are no relevant aspects left out.

  ### 2. Required Commitments vs. Optional Agnosticism

  **Required:**
  1.  **Operational Identity:** A difference in experience is *defined* as a discriminable difference under specified conditions. If no discrimination is possible (even with optimal attention and time), there is no difference in experience, scientifically speaking.
  2.  **Structural Realism:** The topology of the quality space (number of dimensions, continuity, metric) is real. It is not just a convenient fiction; it reflects the actual geometry of the sensory manifold.
  3.  **Report Reliability:** Verbal reports (e.g., "same," "different," "redder") are treated as reliable indicators of the internal state's position in the space. The practice assumes subjects can reliably map their internal relations onto public labels or buttons.

  **Optional (Compatible but not Required):**
  1.  **Denial of Intrinsic Residue:** The practice does not strictly *force* you to deny that there is an intrinsic "feel" accompanying the structural position. An intrinsic theorist can say, "The space maps the relations between the intrinsic qualia." However, this addition is scientifically idle. It explains nothing, predicts nothing, and alters no procedure. The practice is *compatible* with intrinsic qualia, but it renders them epiphenomenal to the science.
  2.  **Physical Reduction:** The practice does not require that the quality space be reduced to neural states. It remains agnostic on the implementation, provided the input-output mapping holds.

  ### 3. The Metric Problem: Indiscriminability

  You asked if the practice requires indiscriminability to behave like a distance (symmetric, transitive, additive).

  **The Commitment:** The practice *requires* that indiscriminability approximates a metric sufficiently well to allow for modeling. It assumes there is a continuous underlying manifold of experience.

  **The Violation:** It is a known fact in psychophysics that indiscriminability is not strictly transitive (A matches B, B matches C, A does not match C).
  **The Resolution:** The practice treats non-transitivity as **noise** or a limitation of the measurement resolution, not a fundamental feature of experience. It smooths the data. It fits continuous functions (like Gaussian distributions) to discrete choice data. By doing so, it implicitly commits to the view that *true* phenomenal differences are continuous and transitive, and that observed violations are due to internal noise or decision criteria, not the structure of qualia themselves. If non-transitivity were treated as fundamental, the construction of a coherent "color space" would be impossible.

  ### 4. Intersubjectivity and the Standard Observer

  **The Commitment:** The practice requires that the **topology** of experience is shared across normal human subjects, even if the **mapping** to stimuli varies.

  **Underwriting the Comparability:**
  What justifies pooling data from different people? The practice relies on the success of the aggregation. If the spaces constructed from Subject A and Subject B were topologically distinct (e.g., one is 3D, one is 4D; or the similarity relations conflicted fundamentally), the "Standard Observer" would fail to predict matches for new subjects. The fact that the Standard Observer *works* (in color management, hearing aids) is the empirical underwriting. It assumes a shared biological hardware that generates a shared phenomenal geometry.

  **Individual Variation:** Variation is treated as parametric (e.g., a shift in the sensitivity curve of one cone type) rather than structural. This implies a commitment to the view that we all inhabit the same *kind* of quality space, even if our coordinates for specific wavelengths differ slightly.

  ### 5. The Fate of the Intrinsic (Inverted Spectrum and Mary)

  **Inverted Spectrum:**
  Does the practice entail the inverted spectrum is empirically empty? **Yes.**
  If two subjects match colors identically, order them identically, and discriminate differences identically, the psychophysical space constructed for them is identical. Since the practice defines the experience by the space, there is no scientific sense in which their experiences differ. The hypothesis is treated as cognitively meaningful but empirically vacuous. It makes no contact with the data.

  **The Mary Case:**
  Does it entail the residue is an ability? **Effectively, yes.**
  If Mary knows all the physical and functional facts, she knows the structure of the color space. She knows the discrimination thresholds and the similarity metrics. Upon leaving the room, she gains the ability to *occupy* the coordinates in that space and link them to her own motor outputs. The practice treats the "new knowledge" as the acquisition of a discriminative capacity and an indexical link ("*this* is what red looks like"), not the discovery of a new fact about the world that was missing from the physical description.

  **Blindsight and Dissociation:**
  You noted the wrinkle where forced-choice exceeds report. The practice handles this by distinguishing between **sensitivity** (d') and **criterion** (bias), or between **performance** and **awareness**.
  However, for the specific science of *conscious experience* (as opposed to visual processing generally), the practice requires **reportable** discrimination. If a subject discriminates correctly but insists they are guessing and see nothing, the practice excludes this data from the construction of the *phenomenal* space. It implicitly defines "experience" as "discrimination available to report." This is a functional definition, not an intrinsic one.

  ### 6. Metamerism: Who Reads the Practice Better?

  **The Case:** Two physically different lights look identical.
  **Intrinsic View:** This shows the field studies appearances, not stimuli. Appearance is a distinct realm.
  **Relational View:** This shows appearance *is* the equivalence class of stimuli relative to an observer.

  **Verdict:** The **Relational View** has the better reading of what the practice actually *does*.
  Why? Because the practice builds models (like CIELAB) that predict *matches*, not physical spectra. The "color" is the invariant in the matching relation. If the intrinsic theorist says appearance is a distinct realm, they must explain how we measure it. The practice measures it *by* establishing equivalence classes. The relationalist says the equivalence class *is* the measurement of the quality. The workflow treats the physical stimulus as the variable and the match as the constant. The ontology follows the workflow: the constant (the match) is the reality being studied; the variable (the spectrum) is merely the cause. The practice settles the matter by making the physical stimulus secondary to the observer's response.

  ### 7. Counterfactuals: What Would Have to Change?

  **If Intrinsic Qualia Were True and Taken Seriously:**
  If psychophysicists believed qualia were intrinsic, private, and not exhausted by relations:
  1.  **Abandon Pooling:** They could not legitimately average data across subjects. If my "red" is intrinsically different from yours, even if we match, the average is meaningless. The "Standard Observer" would be a fiction.
  2.  **Introspective Calibration:** They would need a method to calibrate the intrinsic quality independent of discrimination. Since none exists, the science would stall.
  3.  **Dimensions:** They could not assume the number of discriminable dimensions equals the degrees of freedom of experience. There might be intrinsic variations that do not affect discrimination.
  4.  **Goal:** The goal would shift from predicting matches to cataloging private essences, which is impossible for a public science.

  **If the Relational View Is Right (and Acknowledged):**
  If the field explicitly adopted the structural-relational view:
  1.  **Stop Reification:** It would stop using terms like "brightness" or "hue" as if they named substances. It would treat them strictly as coordinates.
  2.  **Standard Observer:** It would explicitly acknowledge the Standard Observer is a statistical fiction useful for engineering, not a description of any real human's mind.
  3.  **Blindsight:** It would clarify that "conscious vision" is simply vision coupled to a specific type of report-ready discrimination pathway, removing the mystery of "where the experience went."
  4.  **Metamerism:** It would stop describing metamers as "different lights that look the same" and start describing them as "different physical causes of the same perceptual state," emphasizing that the perceptual state is the primary reality.

  ### Summary of the Implicit Theory

  The practice of psychophysics presupposes a **Structural-Relational Theory of Experience**.

  1.  **Ontology:** Experiences are nodes in a metric space defined by similarity and difference.
  2.  **Epistemology:** We know the space through discrimination and matching behavior.
  3.  **Metaphysics:** There is no "residue." If it doesn't affect the structure of the space (discrimination/matching), it isn't part of the scientific object.
  4.  **Intersubjectivity:** Shared biology guarantees shared topology, allowing aggregation.
  5.  **Status of Intrinsic Qualia:** They are either non-existent or scientifically invisible. The practice renders the "Inverted Spectrum" empirically empty because it preserves structure.

  Your friend's worry relies on the idea that experience is a *substance* that might be swapped. The practice relies on the idea that experience is a *structure* that can be mapped. The stand-off occurred because you were arguing from the success of the mapping (which assumes structure), while your friend was arguing from the intuition of the substance (which assumes intrinsic identity). The practice cannot refute the intuition, but it can show that the intuition has no work to do in a mature science of perception. The theory implicit in the lab is that **to be a quality is to be discriminable.**
