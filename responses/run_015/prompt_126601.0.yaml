prompt: |-
  i'm putting together a short "where i stand" doc for a reading group on cranes, skyhooks and greedy reductionism, and I want someone to audit it before I hand it out. Here's the package, roughly in the order I'd defend it:

  (1) The crane/skyhook distinction is my main methodological tool, and I state it as: you don't get to explain an appearance of design by appealing to something whose own design is unexplained. No skyhooks, cranes all the way down.

  (2) Greedy reductionism is a real error. Plenty of higher-level generalizations — in developmental biology, in evolutionary game theory, in macroeconomics — are genuinely explanatory and can't be replaced by or reconstructed from micro-level stories.

  (3) I'm an eliminativist about qualia: nothing satisfies the job description (intrinsic, ineffable, private, directly and incorrigibly apprehensible). But consciousness is entirely real and first-person reports are data.

  (4) There is a fact of the matter about what a system represents or is trying to do, over and above what it's useful for us to assume. A frog's visual system is really tuned to bugish things and it doesn't stop being true when we stop bothering to say so.

  (5) I've been using a third category in lectures alongside cranes and skyhooks, which I call scaffolding: things that don't lift anything themselves but change what a crane can get a grip on — a membrane before there's any inheritance system, the pile of artefacts and practices a human child is born into. I claim that appealing to scaffolding is legitimately neither greedy reductionism nor a skyhook, and that it's how I explain cumulative culture without reducing it to individual psychology and without positing a group mind. I also allow a subcase, the bootstrap crane, where what's being lifted is the crane's own construction.

  (6) Every step in evolution is algorithmic — nothing non-physical, no teleology imported from outside.

  (7) Natural selection is genuinely creative. It produces real novelty, not a reshuffling of what was already there.

  What I want is an audit, not a summary: which of these actually pull against each other, which only look like they do, ranked by severity, and for each real tension what specifically would have to give and what that revision costs me. My students always push hardest on (3) and I sort of assume that's where the trouble is, but I'd rather know if the real problem is somewhere I'm not looking. Please don't hand me six equal-weight tensions — I want the discriminating version, including at least one place where you think my worry is misplaced.

  Two more things: for each verdict, say what would change your mind about it, i.e. what argument or distinction would flip you; and flag explictly where your verdict depends on how crane and skyhook get drawn apart, meaning which of your conclusions would collapse if we put the line somewhere slightly different. Don't pad it with references, I'll add those myself.
reasoning: |-
  Here's a thinking process that leads to the audit:

  1.  **Analyze the Request:**
      *   **Task:** Audit a "Where I Stand" document for a reading group on Cranes, Skyhooks, and Greedy Reductionism.
      *   **Input:** 7 specific claims/positions held by the author.
      *   **Output Requirements:**
          *   Identify tensions/contradictions between the claims.
          *   Rank them by severity (not all equal weight).
          *   For real tensions: specify what must give and the cost of revision.
          *   Include at least one place where the author's worry is misplaced (a "false alarm").
          *   For each verdict: state what would change the auditor's mind.
          *   Flag where verdicts depend on the specific definition/drawing of the Crane/Skyhook line.
          *   No padding/references.
      *   **Context:** The author suspects tension around (3) (Eliminativism about Qualia vs. Realism about Consciousness), but wants to know if there are deeper structural issues.
      *   **Tone:** Critical, philosophical, precise, direct (no fluff).

  2.  **Analyze the Claims:**
      *   (1) **Methodological Naturalism:** No skyhooks (unexplained design explainers). Cranes all the way down.
      *   (2) **Anti-Greedy Reductionism:** Higher-level generalizations are genuinely explanatory, not replaceable by micro-stories.
      *   (3) **Eliminativist Realism:** Qualia (as traditionally defined) don't exist. Consciousness is real. First-person reports are data. (Dennettian stance).
      *   (4) **Realism about Intentionality:** Facts of the matter about representation/function exist independently of observer utility. (Frog sees *bugs*, not just black dots).
      *   (5) **Scaffolding/Bootstrap:** A third category (or subtype) to explain cumulative culture/origin of life without group minds or skyhooks.
      *   (6) **Algorithmic Evolution:** Every step is algorithmic, physical, non-teleological.
      *   (7) **Creative Evolution:** Natural selection produces *real* novelty, not just reshuffling.

  3.  **Identify Potential Tensions:**

      *   *Tension A: (1) vs. (4).* (1) says no unexplained design. (4) says there are objective facts about what a system represents. If representation implies "aboutness" (intentionality), does that smuggle in a skyhook? If the frog's system is *really* tuned to bugs, is that a functional fact grounded in history (crane) or a semantic fact that looks like a skyhook?
      *   *Tension B: (2) vs. (6).* (2) says higher-level explanations can't be reconstructed from micro-level. (6) says every step is algorithmic (micro/physical). If every step is algorithmic, in principle, couldn't a micro-story reconstruct the macro-story? Or does (2) mean "pragmatically impossible" vs (6) "ontologically possible"?
      *   *Tension C: (3) vs. (4).* (3) denies intrinsic properties (qualia). (4) affirms intrinsic facts about representation (frog *really* sees bugs). If qualia are eliminated because they are intrinsic/ineffable, why is intentionality saved? Is intentionality just as "spooky"?
      *   *Tension D: (5) vs. (1).* Is "Scaffolding" just a Skyhook by another name? If it "changes what a crane can get a grip on," does it do explanatory work that isn't itself craned? The author says it's not a skyhook, but is that consistent with (1)?
      *   *Tension E: (6) vs. (7).* If every step is algorithmic (deterministic/computational), is the novelty *real* or just epistemic? (This is a classic determinism vs. novelty debate).

  4.  **Evaluate and Rank Tensions:**

      *   *Severity 1 (High): (2) vs. (6).* This is the core reductionism tension. If evolution is *fully* algorithmic (6), then in principle, the micro-level contains all the information. Claim (2) says higher-level generalizations *can't be replaced by or reconstructed from* micro-level stories. If "can't" means "in principle," (6) kills (2). If "can't" means "pragmatically useful," they are compatible. But (2) says "genuinely explanatory," implying ontological weight. This is the biggest threat to the system's coherence.
      *   *Severity 2 (Medium-High): (3) vs. (4).* The author worries about (3). The tension is actually between eliminating *intrinsic* qualia while keeping *objective* intentionality. Why is "bug-detector" objective but "redness" not? Both seem to rely on how the system relates to the world. If you eliminate the inner movie, do you have enough left to ground the "fact of the matter" about the frog? This is the "Hard Problem" vs. "Easy Problem" boundary.
      *   *Severity 3 (Medium): (5) vs. (1).* Scaffolding risks being a "Soft Skyhook." If scaffolding explains the origin of the crane, is the scaffolding itself craned? The author mentions "bootstrap crane," which helps, but "membrane before inheritance" sounds like it needs its own origin story.
      *   *False Alarm:* (6) vs. (7). Algorithmic processes *do* produce novelty (e.g., halting problem, emergent computation). This is a common confusion.

  5.  **Drafting the Audit (Iterative Refinement):**

      *   *Refining (2) vs. (6):* This is the "Greedy Reductionism" trap. If (6) is true (algorithmic physicalism), then (2) must be interpreted carefully. If (2) claims *ontological* autonomy for higher levels, it conflicts with (6). If (2) claims *explanatory* autonomy (patterns are real but supervene), it's okay. The text says "can't be replaced by or reconstructed." That sounds ontological. *Verdict:* High tension.
      *   *Refining (3) vs. (4):* The author thinks (3) is the target. Actually, (4) is the risky one. (3) is standard Dennett. (4) claims objective intentionality. If you are an eliminativist about intrinsic properties (qualia), you must be careful not to reintroduce them via "real representation." *Verdict:* Medium tension, but the author's worry is misplaced on *which* side is vulnerable.
      *   *Refining (5):* Scaffolding is a crane that lifts other cranes. As long as the scaffolding has a causal history, it's fine. The risk is if scaffolding is treated as a static background condition without an origin.
      *   *Refining (1) Definition:* The definition of Skyhook is crucial. "Explaining design by appealing to something whose own design is unexplained." Scaffolding must have an explained design/history to fit (1).

  6.  **Addressing Specific Constraints:**
      *   *Rank by severity.*
      *   *What must give?*
      *   *What changes my mind?*
      *   *Dependence on Crane/Skyhook line.*
      *   *One misplaced worry.*

  7.  **Final Polish (Self-Correction during drafting):**
      *   *Check:* Did I address the "algorithmic" vs "novelty" point? Yes, mark that as the misplaced worry.
      *   *Check:* Did I address the Qualia worry? Yes, tell them the tension is actually with Intentionality (4), not Qualia (3).
      *   *Check:* Is the (2) vs (6) tension clear? Yes, "Reconstruction" is the keyword.
      *   *Check:* Crane/Skyhook dependency. I need to explicitly state where the verdict hinges on how "design" is defined in (1).

  8.  **Final Output Structure:**
      *   Introduction (acknowledging the task).
      *   Tension 1 (Highest Severity): Anti-Reductionism vs. Algorithmic Physicalism.
      *   Tension 2 (Medium Severity): Eliminativism vs. Intentional Realism.
      *   Tension 3 (Low Severity/Management): Scaffolding vs. No Skyhooks.
      *   The Misplaced Worry: Algorithmic vs. Creative.
      *   Closing.

      *(Self-Correction)*: Wait, I need to make sure I don't just say "it depends." I need to take a stand as an auditor. I will argue that (2) and (6) are the most dangerous collision.

      *(Refining the "Misplaced Worry")*: The author worries about (3). I should argue that (3) is actually the most stable part of the package *if* (4) is handled correctly. The tension isn't (3) itself, but (3) vs (4). So the worry about (3) *in isolation* is misplaced. Or better: The tension between (6) and (7) is a non-issue (misplaced worry about compatibility). Let's go with (6) vs (7) being the misplaced worry, as students often conflate algorithmic with "uncreative."

      *(Refining the Crane/Skyhook dependency)*: I need to highlight that if "design" in (1) includes "function," then (4) is risky. If "design" means "complex adaptation," (4) is safer.

      *(Final Plan)*:
