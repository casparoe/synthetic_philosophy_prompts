          *   "Psychological harm" (unless severe/clinical).
          *   "Offense" (hurt feelings, ideological disagreement).
          *   "Long-term societal harm" (too probabilistic).
          *   "Dignitary harm" (hard to distinguish from offense).
      *   *Challenge:* Mill distinguishes "hurt feelings" from "harm," but in modern contexts, psychological safety is often conflated with physical safety. The procedure must draw a hard line here.

  3.  **Developing the Decision Procedure:**
      *   *Goal:* Simple, fast, defensible.
