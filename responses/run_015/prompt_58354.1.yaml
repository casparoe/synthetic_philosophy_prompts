answer: |-
  Dear friends,

  As a longtime reader of rationalist blogs and forums, I have become preoccupied with how badly calibrated my sense of my own knowledge often is, and I would like help turning that preoccupation into a useful exercise for your local meetup group, whose members are comfortable with talk of credences and calibration but have no professional training in epistemology. What follows is a sorting quiz designed to reveal which position on luminosity and iteration a participant actually holds, based on what they say about cases rather than which label they find attractive. For orientation, please take luminosity to be the idea that under certain conditions, when the condition holds one is thereby in a position to know that it holds, and take iteration to be the idea that knowing something generally puts one in a position to know that one knows it. The quiz contains eight diagnostic questions, each built around a concrete first-person situation, and none of the questions mention technical terms such as luminous or KK or safety, so that a reader can answer without knowing which answer points where.

  Consider first the situation of waking in a room that warms almost imperceptibly over an hour and judging when cold has given way to warmth. You lie still as the temperature rises by fractions of a degree, and you must decide whether you can know the exact moment you are no longer cold. One possible verdict is that you can indeed know the precise moment because your feeling of cold is directly accessible to you. A second verdict is that there must be a buffer period where you are neither clearly cold nor clearly warm, so you cannot know the exact boundary. A third verdict is that the feeling itself is the only reality, and talk of knowing the boundary is mistaken because the transition is too smooth for binary knowledge.

  Moving to the second scenario, imagine checking a long multiplication done from memory late at night and judging whether one knows the answer or merely believes it. You have run through the steps in your head and feel certain, but you are tired. You might say that if you feel certain and got the right answer, you knew it all along. Alternatively, you might say that without writing it down or using a calculator, you cannot claim knowledge because fatigue makes error too possible. A third option is to say that you do not know the answer but you have a high credence that it is correct, and that credence is the only honest assessment.

  In the third case, picture attending to a faint headache as it fades and judging when it is fully gone. The pain diminishes slowly until you are unsure if it is still there or if you are just distracted. One response is that you know exactly when it vanishes because pain is a private experience you cannot be wrong about. Another response is that you cannot know exactly when it vanishes because there are moments where the pain is present but indistinguishable from its absence. A third response is that the question of when it is fully gone is less important than tracking your confidence that you are pain-free.

  For the fourth situation, think of recalling a rarely used PIN under time pressure and judging how reliable that recall is. You type in the numbers quickly to unlock a door. You could claim that you know the PIN because you remember using it before. You could claim that you do not know it because memory under pressure is fallible and you might be confusing it with another code. Or you could claim that you have a specific probability in mind, such as ninety percent, and that probability is your true epistemic state.

  In the fifth scenario, you are assigning a numerical confidence to a perceptual judgment made in poor light and then judging how reliable that confidence assignment itself is. You see a shape and say you are eighty percent sure it is a cat. You might say that you know your eighty percent confidence is accurate. You might say that your confidence assignment could be miscalibrated because you are bad at estimating probabilities in poor light. Or you might say that the accuracy of the confidence assignment does not matter, only that you acted on the credence you had.

  Let us invent a sixth situation involving rising anger during a conversation. You feel your heart rate increase and your thoughts sharpen. One verdict is that you know immediately when you become angry because the emotion is luminous to you. A second verdict is that you might be misinterpreting arousal as anger, so you do not know until you reflect later. A third verdict is that you track the intensity of the emotion on a scale rather than claiming to know the category of anger.

  For the seventh case, consider a skill performance like typing while distracted. You are typing text and wonder if you are making errors. You might say you know you are typing accurately because you feel the flow. You might say you cannot know you are accurate without proofreading because muscle memory can glitch. You might say you have a sense of error rate that serves as a proxy for knowledge.

  Finally, in the eighth situation, imagine waking from a vivid dream and judging whether you are awake now. You look around your room. One verdict is that you know you are awake because your current experience is coherent. A second verdict is that you cannot strictly know you are not dreaming because dreams can mimic coherence. A third verdict is that the distinction does not impact your credences about the immediate future.

  Now we must build the scoring key from the logical space first, noting which combinations of answers are unoccupied and offering a brief diagnosis of each gap as incoherent, unattractive, or merely unexplored, and flag any pair of destinations your questions cannot cleanly separate rather than papering over the overlap. The logical space of these answers is constrained by the intuition that phenomenal states like pain and cold are easier to know than external facts like multiplication or PINs. Therefore, a combination where a participant claims they cannot know when a headache is gone but insists they know their mental multiplication is correct without checking is theoretically possible but psychologically unattractive and rarely occupied. It suggests a reversal of the usual epistemic order where internal access is privileged over external calculation. Similarly, claiming to know one's confidence assignment is perfectly reliable while denying knowledge of one's own pain is incoherent for most internalist frameworks, as the latter is the foundation for the former. There is also an unexplored region where one denies knowledge in all eight cases but refuses to adopt credences, leaving the participant in a state of total suspension of judgment that is difficult to maintain in practice.

  With that logical map in mind, we can map patterns of verdicts onto five destinations. The first destination is the thoroughgoing anti-luminist who denies both luminosity and general iteration. This participant will consistently choose the verdicts that deny knowledge in borderline cases, such as claiming there is a buffer period in the warming room or that fatigue prevents knowledge of the multiplication. They will likely deny that they can know when the headache is gone and deny that they know their confidence assignment is accurate. The second destination is the restricted defender who allows luminosity only for present phenomenal states such as pain or feeling cold. This participant will say they know when the headache is gone and when they are cold, but will deny knowledge of the multiplication, the PIN, or the reliability of their confidence in poor light. They occupy the space where internal feeling is trusted but external cognition is not.

  The third destination is the unrestricted iteration defender who holds that knowing normally puts one in a position to know that one knows. This participant will choose the verdicts that affirm knowledge across the board, claiming they know the moment the room warms, they know the multiplication is right, and they know their confidence is accurate. They treat feeling certain as sufficient for knowledge and for knowing that one knows. The fourth destination is the calibrationist who prefers to replace talk of knowing that one knows with talk of well calibrated higher-order credences. This participant will consistently choose the third verdict options involving probabilities, credences, or scales. They will say they have a ninety percent chance on the PIN, that their confidence assignment is a credence to be calibrated rather than known, and that tracking intensity is better than knowing when pain is gone. The fifth destination is the margin-for-error externalist who explains failures of self-knowledge by appeal to similarity among close cases. This participant will choose the verdicts that mention indistinguishability, buffer periods, or the possibility of error due to similarity. They will say they cannot know the exact moment the headache is gone because the moment before was indistinguishable, and they will apply this same logic to the warming room and the perceptual judgment.

  You must flag that your questions cannot cleanly separate the thoroughgoing anti-luminist from the margin-for-error externalist, as both will deny knowledge in borderline cases. The difference lies in the justification, with the externalist citing similarity among close cases and the anti-luminist citing a general failure of access, but their verdicts on the quiz will look identical. Similarly, the calibrationist and the anti-luminist may overlap on denying binary knowledge, but the calibrationist offers credences as a substitute while the anti-luminist may simply deny knowledge without offering a probabilistic replacement. If a participant denies knowledge but does not embrace credences, they may be a skeptic rather than a calibrationist, which is a gap your quiz hints at but does not fully resolve. Finally, the restricted defender and the unrestricted defender are separated by the external cases, but if a participant claims knowledge of pain but is vague on the multiplication, they might be a restricted defender or simply an unrestricted defender who is cautious about math, so you should look for consistency across the cognitive cases to distinguish them.

  I hope this letter provides a solid foundation for your meetup discussion. By focusing on these concrete verdicts rather than abstract labels, you should be able to see where your intuitions actually lie when pressed by specific cases. Please feel free to adapt the wording to suit your group's style, but keep the structure of the verdicts intact to preserve the diagnostic value. I look forward to hearing how the calibration goes.

  Warmly,

  A Fellow Traveler
