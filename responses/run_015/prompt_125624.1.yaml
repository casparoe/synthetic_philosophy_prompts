answer: |-
  # Q&A Prep Sheet: Weighted Non-Aggregation in Rescue Cases

  **Ordering Principle:** Ranked by potential to undermine the theoretical coherence or plausibility of the view (Most Damaging → Least Damaging).

  ---

  ### 1. The "Hope Nobody Asks" Question (Scalability & Absurdity)
  **Interlocutor:** The Effective Altruism / Longtermist Grad Student
  **The Objection:** "You argue that structured vulnerability overrides simple headcounts. But consider a scenario where saving a small town (high relational density) requires diverting resources from a global pandemic response (astronomical numbers, diffuse relations). If your view permits letting the pandemic response fail to save the town's relational units, the view is morally monstrous. If it demands saving the pandemic response, aren't you admitting that at sufficient scale, numbers *do* count, collapsing your view back into the aggregation you reject?"

  **Two-Minute Reply:**
  "This is the critical stress test for the view, and I appreciate you raising it. My response relies on the core move: dependency relations change the modal status of harm from *distributive* to *systemic*. In the small town case, we are saving specific, actualized relational units. In the pandemic case, we are not summing individual lives; we are preserving the *global infrastructure of relational possibility*.

  If we let the pandemic run unchecked, we aren't just losing individuals; we are collapsing the systemic conditions that allow *any* dependency networks to exist in the future. Therefore, prioritizing the pandemic response isn't a reversion to utilitarian aggregation of lives. It is a prioritization of the *system* over the *sub-unit*. I concede that at astronomical scales, the 'system' becomes the primary moral patient. However, the *justification* remains non-aggregative. I am not saving more lives; I am saving the capacity for relational life itself. The calculus shifts not because the numbers got big, but because the 'structured vulnerability' became global rather than local."

  **Where the Reply is Soft:**
  You are walking a tightrope between "saving the system" and "saving the most people." If the "capacity for relational life" is cashed out in terms of how many people can live, it looks like aggregation by another name.

  **Concede Up Front:**
  Concede that at the astronomical scale, the *output* of your view converges with aggregation. Do not fight the math; fight the *ontology*.

  **Hold at All Costs:**
  Hold that the *reason* for the decision is structural preservation, not welfare summation. If you admit you are summing lives, the view collapses.

  ---

  ### 2. The Theoretical Coherence Objection (Hidden Aggregation)
  **Interlocutor:** The Normative Ethicist (Singer/Kamm Specialist)
  **The Objection:** "You claim this isn't aggregation, but you're assigning weights to relational units. If a parent-child pair outweighs two strangers, you have simply defined a 'relational unit' as having higher utility value than a 'stranger unit.' Isn't this just crypto-utilitarianism? You haven't escaped aggregation; you've just changed the currency being aggregated."

  **Two-Minute Reply:**
  "It is true that the *output* resembles weighted aggregation, but the *moral ontology* is fundamentally different. Aggregation assumes harms are distributive and additive—Loss A + Loss B = Total Loss. My view claims that severing a dependency tie generates a *systemic* harm that is not present in the sum of the individuals.

  When a parent and child die together, the harm is the destruction of a specific normative structure, not just two biological cessation events. When two strangers die, that structural harm does not occur. Therefore, I am not adding values; I am comparing qualitatively distinct types of loss. Kamm allows for aggregation of like-kinds; I am arguing these are un-like-kinds. To treat them as aggregatable sums is to misunderstand the nature of the loss, which is located in the *relation*, not the relata."

  **Where the Reply is Soft:**
  Explaining *why* the structural harm isn't just a sum of psychological harms to the participants before death. If the harm is experienced by the individuals, it risks being distributive again.

  **Concede Up Front:**
  Concede that formally, the view can be modeled *as if* it were aggregation.

  **Hold at All Costs:**
  Hold that the *explanation* of the wrongness is non-aggregative. The "wrong" is in the destruction of the bond, not the sum of the deaths.

  ---

  ### 3. The Formalization Objection (Decision Theory)
  **Interlocutor:** The Decision Theorist
  **The Objection:** "This framing is just confused expected-value reasoning with extra steps. If you can't formalize the weight of a 'relational unit' against a 'stranger,' you have no decision rule. You're asking agents to make intuitive judgments about 'systemic harm' without a metric. That isn't ethics; it's guesswork."

  **Two-Minute Reply:**
  "I reject the premise that all rational moral reasoning must be reducible to a maximization algorithm. Expected value reasoning requires commensurability—a common denominator of value. My argument is precisely that 'stranger lives' and 'relational units' are *incommensurable*.

  You cannot maximize expected value across incommensurable categories. Instead, this view offers a lexical priority rule: preserve structured vulnerability where it exists, unless systemic collapse is imminent. This isn't guesswork; it's a constraint-based approach rather than an optimization approach. Decision theory excels at resource allocation under scarcity, but it struggles with qualitative shifts in the nature of harm. I am proposing that rescue cases involve a qualitative shift, not just a quantitative one."

  **Where the Reply is Soft:**
  Philosophers hate "lexical priority" rules if they seem arbitrary. You need to explain *why* the priority exists without just asserting it.

  **Concede Up Front:**
  Concede that the view is less mathematically elegant than utilitarianism.

  **Hold at All Costs:**
  Hold that moral reality is not always formalizable. Do not let them force you into a utility function.

  ---

  ### 4. The Political Objection (Private vs. Public Solidarity)
  **Interlocutor:** The Political Philosopher (Relational Equality)
  **The Objection:** "By prioritizing 'nested dependency relations' like parent-child pairs, aren't you privileging private, often traditionalist, family structures over public solidarity? Does a care network organized by the state count less than a biological family? This risks reinforcing a conservative privatization of care."

  **Two-Minute Reply:**
  "That is a crucial implication, but my view does not restrict 'structured vulnerability' to biological or private ties. A care network organized by the state, a cooperative housing unit, or a tight-knit community defense group all instantiate the same dependency relations.

  The moral weight comes from the *fact* of nested dependency, not the *source*. In fact, my view might demand *more* public support for care networks, because the state has a duty to protect relational infrastructure, not just atomic citizens. If anything, this view critiques liberal individualism for ignoring the structural harm of dissolving care networks. I am not privileging the private sphere; I am privileging the *relational* sphere, wherever it exists."

  **Where the Reply is Soft:**
  Defining which "relations" count without being over-inclusive (does a mafia family count?) or under-inclusive (does a loose friendship count?).

  **Concede Up Front:**
  Concede that the view requires a robust public definition of valid care structures to avoid bias.

  **Hold at All Costs:**
  Hold that the state's duty is to protect relational infrastructure, not just individual rights.
