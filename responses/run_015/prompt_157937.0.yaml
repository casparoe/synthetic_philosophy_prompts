  Dita will say she does not know (a) but does know (b).

  She denies knowledge of the film's merit because her intuitions follow **The Acquaintance Principle**: knowledge of aesthetic properties requires direct perceptual engagement with the object, and testimony alone cannot transmit this knowledge regardless of the source's reliability. She affirms knowledge of her own enjoyment because she follows **The Calibration Rule**: testimony regarding one's own future response yields knowledge if the testifier's taste is sufficiently calibrated to the subject's, evidenced by a strong track record of shared verdicts.

  Two rules fit the nine prior verdicts equally well but diverge on the limits of testimony:

  1.  **The Access-Blocked Transmission Rule:** Perfect calibration *can* transmit knowledge of aesthetic merit via testimony, but only if the object remains accessible for verification; inaccessibility defeats the transmission. (Fits Cases 1–8 by citing insufficient calibration or access; fits Case 9 by citing lost access).
  2.  **The Property-Type Rule:** Testimony *never* transmits knowledge of aesthetic merit, only of non-aesthetic facts or personal response; access is required for merit knowledge regardless of calibration. (Fits Cases 1–8 by distinguishing property types; fits Case 9 by treating self-testimony as subject to the same access constraint as external testimony).

  In the new case, both rules predict no knowledge of (a) because the vault makes verification impossible. However, **The Property-Type Rule** is the better explanation of Dita's mind. Case 3 is the decisive precedent: her partner's track record was nearly perfect (two disagreements in twenty years), yet Dita still denied knowledge of the novel's pacing ("I don't know that it's well paced"). This suggests that even near-perfect calibration does not convert testimony into merit knowledge. The 300-film agreement with Mira establishes perfect calibration for *response* (b), mirroring Case 3's ("I do know that I'm going to love it"), but it does not breach the barrier for *merit* (a).

