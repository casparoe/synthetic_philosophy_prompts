answer: |-
  # The "What Are We Actually Doing?" Quiz

  **Instructions:** Read each scenario. Choose the response that matches what you would *actually* vote for at the table, not what sounds best in a mission statement. There are no right answers, only consistent ones.

  **1. The County Historical Society**
  The largest local heritage group applies. They preserve the history of the founding families. Most of the county already knows this history; it's in the school curriculum. They want funds to digitize archives.
  *   **A.** Decline. They represent the majority culture and don't need support to survive.
  *   **B.** Fund them, but only if they add exhibits on minority groups to balance the narrative.
  *   **C.** Fund them as asked. They are a longstanding local institution and that counts for something.

  **2. The Last Speakers**
  A group of 800 people speaks a local indigenous language. Every speaker is fluent in English. They want funds for a weekly conversation circle. There will be no new fluent speakers created.
  *   **A.** Decline. The money won't save the language, and it doesn't provide a tangible service.
  *   **B.** Fund it, but require them to record the sessions for public archives so others can learn.
  *   **C.** Fund it as asked. The act of speaking it together is the point, even if it dies with them.

  **3. The Prayer Food Bank**
  A church runs the best food bank in town. They require volunteers to sit through a 15-minute service before shifts. They want money for food.
  *   **A.** Decline. Public money shouldn't support religious participation, even indirectly.
  *   **B.** Fund the food, but require them to drop the service requirement for volunteers.
  *   **C.** Fund them as asked. It's their house, their rules, and the hungry get fed.

  **4. The Meaning Group**
  A small group applies for a retreat. They say the retreat has no measurable outcome. They say it's "the thing that makes our lives make sense." They cannot define "sense."
  *   **A.** Decline. We fund projects, not feelings. We need to know what change we bought.
  *   **B.** Fund it, but require a report on participant satisfaction or well-being metrics.
  *   **C.** Fund it as asked. If they say it matters, that is a valid outcome for us.

  **5. The Border Community**
  A valley is split by a county line. The north side is wealthy; the south side is poor. A group on the south side wants funds to run programs for people on *both* sides, treating the valley as one unit. Our rules say we only fund within our county.
  *   **A.** Decline. We cannot fund outside our jurisdiction; it sets a bad precedent.
  *   **B.** Fund only the south-side participants, but encourage cross-border partnership.
  *   **C.** Fund the whole project. The community is real, the border is just a line on a map.

  **6. The Strict Co-op**
  A workers' co-op wants funds to expand. Their bylaws allow them to expel any member by a 75% majority vote, for any reason. They say this keeps the culture pure.
  *   **A.** Decline. We don't fund organizations that can arbitrarily kick people out.
  *   **B.** Fund them, but require an independent appeals process for expelled members.
  *   **C.** Fund them as asked. It's a voluntary association; they can set their own terms.

  **7. The Doctrine School**
  A community wants to run a school for their children. They will teach their own comprehensive view of the world, including history and science, which differs from the state curriculum. They want operational support.
  *   **A.** Decline. Children need a common education to be free citizens later.
  *   **B.** Fund only the math and science portions, to ensure baseline standards.
  *   **C.** Fund them as asked. Parents have the right to raise children within their own truth.

  **8. The Opaque Group**
  A long-standing neighborhood group applies. They say: "We can't explain to outsiders what this money is for. You'd have to be one of us to understand why it matters."
  *   **A.** Decline. Transparency is a requirement for public trust.
  *   **B.** Fund them, but require a public summary of activities, even if the meaning is private.
  *   **C.** Fund them as asked. Some things are only legible from the inside.

  **9. The Master Craft**
  A group preserves a traditional craft. They refuse to teach the technique to anyone outside their kinship network. They want money for materials.
  *   **A.** Decline. Cultural heritage should be shared, not hoarded.
  *   **B.** Fund them, but require them to host public demonstrations.
  *   **C.** Fund them as asked. The tradition depends on keeping the knowledge within the line.

  **10. The Mirror**
  A tenant union applies. They want to use the money to organize tenants, including lobbying to change the rules of foundations like ours to make them more accountable to grantees.
  *   **A.** Decline. We cannot fund groups that work against the structure that funds them.
  *   **B.** Fund the tenant support services, but not the lobbying/advocacy portion.
  *   **C.** Fund them as asked. If we are local, we should be accountable to local power.

  ***

  # Scoring Key & Position Map

  Do not simply count A, B, and C. Look at the *pattern* of your choices. The questions are weighted differently.

  ### The Three Vectors
  *   **Vector 1 (Mostly A's): The Architect.** You believe the foundation must build a specific kind of society. You prioritize measurable outcomes, universal access, and civic integration.
  *   **Vector 2 (Mostly B's): The Referee.** You believe the foundation must ensure fair rules. You prioritize neutrality, rights, and compromise between public good and private freedom.
  *   **Vector 3 (Mostly C's): The Gardener.** You believe the foundation must tend to existing life. You prioritize integrity, tradition, and the intrinsic value of communities.

  ### The Leaves (Philosophical Positions)

  **1. Perfectionist Liberalism (Mostly A, specifically on Q3, Q6, Q7)**
  *   **Logic:** We fund things that make people freer or better. If a group limits autonomy (religious conditions, expulsion, doctrinal schools), we reject it, even if they are effective.
  *   **Hardest thing to say out loud:** "Your freedom to associate is harmful to your members."

  **2. Civic Republicanism (Mostly A, specifically on Q1, Q5, Q10)**
  *   **Logic:** We fund things that build the *polis*. Majority history is fine if it builds unity; cross-border work is bad if it undermines jurisdiction; anti-foundation lobbying is treason.
  *   **Hardest thing to say out loud:** "Private life doesn't matter unless it serves the public."

  **3. Strict Antiperfectionist Neutrality (Mostly B, consistent across the board)**
  *   **Logic:** We do not judge the "good." We judge the "fair." We add conditions to ensure no one is excluded or coerced, but we don't demand specific outcomes.
  *   **Hardest thing to say out loud:** "We don't care if what you do is actually good, only that it's voluntary."

  **4. Liberal Culturalism (Mostly B, but A on Q1, C on Q2)**
  *   **Logic:** Culture is a resource individuals need. We don't fund the majority (they're fine), but we fund the minority to ensure fairness. We protect rights but acknowledge cultural context.
  *   **Hardest thing to say out loud:** "The majority culture doesn't count as a 'need'."

  **5. Recognition-Based Communitarianism (Mostly C, specifically on Q2, Q5, Q8)**
  *   **Logic:** We fund to repair dignity. If a group says they are marginalized (language, border, opaque), we trust them. We prioritize identity over efficiency.
  *   **Hardest thing to say out loud:** "Justice is secondary to belonging."

  **6. Thick Localist Neo-Aristotelian (Mostly C, specifically on Q1, Q9, Q3)**
  *   **Logic:** We fund the *telos* of *this* place. Tradition, kinship, and local institutions are goods in themselves, even if exclusive. The "local" overrides the "universal."
  *   **Hardest thing to say out loud:** "Outsiders don't get a vote on what matters here."

  **7. Toleration-for-Reasons-of-Fallibility (Mostly C, specifically on Q3, Q4, Q7)**
  *   **Logic:** We might be wrong about what is good. Therefore, we fund "risky" things (religion, opaque meaning, doctrinal schools) because our judgment is fallible.
  *   **Hardest thing to say out loud:** "We might be funding evil, and that's the price of humility."

  **8. "The Framing Is The Problem" (Inconsistent/Scattered, or rejects Q10 premise)**
  *   **Logic:** The quiz itself is the bureaucracy you hate. You fund based on relationships, trust, and specific contexts that a quiz can't capture. You likely chose C on Q10 but A on Q6.
  *   **Hardest thing to say out loud:** "This entire process is fake."

  ***

  # Logical Space Analysis

  ### The Sorting Work
  *   **Q3 (Religious Food Bank), Q6 (Co-op Expulsion), Q7 (Doctrine School):** These three do 80% of the sorting. They separate the **Architects** (who see internal restrictions as harms) from the **Gardeners** (who see internal restrictions as integrity). If you agree on these, you largely agree on everything else.
  *   **Q1 (Historical Society) & Q2 (Language):** These separate the **Neutrality/Referees** from the **Culturalists**. If you fund both, you're a Neutrality type. If you fund Language but not History, you're a Liberal Culturalist. If you fund History but not Language, you're a Majoritarian (unoccupied leaf).
  *   **Q8 (Opaque) & Q4 (Meaning):** These separate the **Instrumentalists** from the **Existentialists**.
  *   **Decoration:** Q5 (Border) and Q9 (Craft) are mostly decorative. They confirm Localist vs. Republican leanings but rarely change the core classification. Q10 is a "trap" for the Anti-Framing leaf.

  ### Unoccupied Combinations
  1.  **The Majoritarian Particularist (Fund Q1-C, Fund Q2-A):** Funds the majority history but rejects the endangered language.
      *   *Status:* **Unattractive.** Incoherent for a foundation. It admits to being a tool of power without claiming the civic benefit (Republicanism) or the cultural value (Localism).
  2.  **The Economic Libertarian (Fund Q6-C, Fund Q7-A):** Supports the Co-op's right to expel but rejects the School's right to doctrine.
      *   *Status:* **Untried.** Suggests economic association is "free" but cultural/educational association is "public." Rarely held consistently.
  3.  **The Bureaucratic Universalist (Fund Q5-A, Fund Q8-A, Fund Q10-A):** Rejects cross-border, rejects opacity, rejects advocacy.
      *   *Status:* **Incoherent.** This is pure risk mitigation. It occupies the space of "Foundation as Insurance Company." It exists, but usually collapses under its own irrelevance.

  ### Indistinguishable Leaves
  *   **Thick Localist vs. Recognition Communitarian:** Both answer "C" to almost everything.
      *   *Difference:* **Justification only.** The Localist funds the Historical Society (Q1) because it's *ours*. The Communitarian funds the Language Group (Q2) because they are *hurt*.
      *   *Splitter:* **Q1.** If you fund the Majority Historical Society unconditionally, you are a Localist. If you decline it or add conditions, you are a Communitarian.
  *   **Fallibilist vs. Strict Neutrality:** Both fund "risky" groups.
      *   *Difference:* **Epistemic vs. Procedural.** The Neutrality type funds the Religious Food Bank (Q3) because it's not the state's job to judge religion. The Fallibilist funds it because the state *might be wrong* to judge it.
      *   *Splitter:* **Q4 (Meaning Group).** Neutrality struggles here (no rights claim). Fallibilism thrives (we don't know if meaning is real). If you fund Q4 unconditionally, you are a Fallibilist.

  ### Handling Inconsistent Answers
  If a board member's answers scatter (e.g., A on Q3, C on Q7, B on Q1):
  *   **Do not** force them into a leaf. This is the **Pragmatic Pluralist**.
  *   **Report:** "You operate by case-based intuition rather than first principles."
  *   **Principled Interpretation:** This is often the most stable position in a small foundation. They are holding the tension between the leaves.
  *   **Advice:** Use them as the swing vote. They are the only ones who can translate between the "Architects" and the "Gardeners."

  ### Summary of Leaves for the Away Day

  | Position | Core Motto | The "Tell" (Key Question) | Hardest Thing to Say |
  | :--- | :--- | :--- | :--- |
  | **Perfectionist Liberal** | "Make them freer." | Q7 (School): Decline. | "Your freedom is harmful." |
  | **Civic Republican** | "Build the city." | Q10 (Advocacy): Decline. | "Private life doesn't matter." |
  | **Strict Neutrality** | "Keep the rules fair." | Q3 (Food Bank): Fund with conditions. | "We don't care if it's good." |
  | **Liberal Culturalist** | "Culture is a resource." | Q1 (History): Decline. | "Majority culture doesn't count." |
