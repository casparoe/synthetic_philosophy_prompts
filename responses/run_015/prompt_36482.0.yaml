          *   *Issue 2: Moral Weight Aggregation.* A: Cow suffering outweighs many mice/insects. B: Numbers might swamp intensity if weight isn't high enough. Crux: The exchange rate between cognitive complexity and sheer numbers. Evidence: Philosophical consistency tests / neural mass proxies.
          *   *Issue 3: Net Value of Wild Lives.* A: Lives are generally worth living (death is harm). B: Lives might be net negative (death is relief). Crux: Empirical assessment of wild suffering (disease, starvation). Evidence: Welfare biology studies on wild vertebrate/invertebrate mortality.
