  10. **Final Structure:**
      *   Introduction: Validate the intuition.
      *   The Unifying Principle: Salience vs. Entrenchment (or Correctability).
      *   Resolving the Tension: Blame vs. Risk.
      *   The Hybrid Case Prediction.
