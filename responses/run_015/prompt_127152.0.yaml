answer: |-
  **Exam Question**

  Consider the case of the 'locally coherent agent' (LCA). At every choice node, the LCA's preferences over available options are complete and transitive. However, her preferences are menu-dependent: she prefers A to B in {A,B}, B to C in {B,C}, and C to A in {C,A}, yet prefers A to B to C when all three are offered together. An exploiter presents pairwise menus sequentially, charging a small fee for each swap, returning her to A minus three fees. The LCA is 'contented': she understands this, foresees the sequence, prefers keeping her dispositions to changing them, and always chooses A on the grand menu.

  Critically evaluate whether the money pump argument successfully establishes that the LCA is irrational. In your answer, you must: (1) identify the precise locus of the alleged defect (preferences, choice rule, or vulnerability); (2) explain why her contentment does not refute the argument; (3) discuss the possibility and cost of resolute choice as an escape; and (4) address the overgeneration worry regarding benign preference changes, offering a criterion to distinguish them from genuine defects.

  ***

  **Model Answer**

  The money pump argument against the locally coherent agent (LCA) does not target static preference transitivity, since her preferences are transitive at every node. Instead, it alleges a defect in her diachronic choice rule. Her local coherence masks a global inconsistency: she violates dynamic consistency by allowing framing effects to dictate swaps that cumulatively reduce her welfare. The defect is not merely vulnerability to an exploiter, but a failure to integrate local choices into a coherent life-plan. If rationality requires that an agent's choices maximize their own ends across time, the LCA fails because her local decision procedure systematically frustrates her global ranking.

  The stipulation that the LCA is 'contented' fails to refute this because money pump arguments typically support a verdict about structural coherence, not merely subjective desire-satisfaction. While the LCA satisfies her local desires at each node, she frustrates her global preference (A over C) and suffers a net welfare loss (the fees). Rationality requires more than local optimality; it requires that an agent's sequence of choices aligns with their reflective, global evaluation. Contentment shows she accepts her fragmentation, but acceptance does not entail coherence. She is contentedly irrational. The argument concludes that her choice structure is defective because it permits a dominated sequence of outcomes relative to her own grand-menu standards, regardless of her emotional state regarding those dispositions.

  To escape the pump, the LCA must exercise resolute choice. She must refuse a locally preferred swap (e.g., A for C) because she anticipates the cycle. This imposes a significant cost: she must act against what she currently most prefers for the sake of a plan formed earlier. This challenges the standard rational choice axiom that current preference sovereignly dictates choice. Resolute choice treats the agent as a temporally extended entity, requiring the current self to bind itself to the past self's intentions. If rationality demands avoiding exploitation, it demands this costly self-binding. The cost is the sovereignty of the momentary self; the benefit is diachronic efficiency.

  However, this invites the overgeneration worry. Agents who learn or undergo endorsed taste changes can also be pumped. If I prefer tea to coffee today, but coffee to tea tomorrow after learning about new blends, an exploiter could pump me. If the money pump condemns the LCA, it risks condemning benign adaptive preferences. The argument must distinguish between cycles caused by framing errors and those caused by genuine value updates. Without this distinction, the pump proves too much, labeling any change of mind as irrational.

  The distinction lies in endorsement and stability relative to information. The LCA's cycle is driven by menu context, not new information or reflective value change. She prefers A>B>C on the grand menu, indicating her 'true' ranking is transitive, but her local choices betray this. In benign learning, the global ranking itself shifts upon reflection or new data. The LCA's defect is that her local choices contradict her own global evaluation, whereas the learner's local choices track their evolving global evaluation. Thus, the pump succeeds against the LCA not because she changes, but because her changes contradict her own standing commitments. Ultimately, the money pump shows that local coherence is insufficient for rationality. The LCA is irrational not because she is unhappy, but because her choice rule fails to respect her own global priorities across time.

  ***

  **Marking Scheme**

  1.  **Locus of Defect (4 marks):** Must identify the defect as diachronic inconsistency or choice-rule failure, not merely static intransitivity.
      *   *Common Error:* Claiming the agent has intransitive preferences simpliciter, ignoring local coherence.
  2.  **Contentment & Normativity (4 marks):** Must explain that contentment addresses welfare/satisfaction, while the pump addresses structural coherence or objective loss relative to own standards.
      *   *Common Error:* Arguing that because she is content, she is rational (confusing satisfaction with coherence).
  3.  **Resolute Choice & Cost (4 marks):** Must describe resolute choice (binding future selves) and note the cost (acting against current local preference).
      *   *Common Error:* Suggesting she can escape without cost or by simply "choosing better" locally.
  4.  **Overgeneration Worry (4 marks):** Must acknowledge that learning/taste changes also look like cycles and could be pumped.
      *   *Common Error:* Ignoring the worry or claiming learning cannot be pumped.
  5.  **Distinction Criterion (4 marks):** Must offer a criterion (e.g., information update, global endorsement) to distinguish benign shifts from framing defects.
      *   *Common Error:* Failing to provide a principle for distinguishing the cases.

  **A vs. B Answer:** An **A** answer synthesizes these points into a unified argument about the nature of diachronic agency, showing how the cost of resolute choice relates to the distinction between framing and learning. A **B** answer addresses the five points correctly but treats them as a checklist without exploring the tensions between them.

  **Confidence Note**
  I am moderately confident there is no single determinate best answer, as philosophical theories of diachronic rationality diverge (e.g., resolute vs. sophisticated choice). I am least confident in requirement 5 (Distinction Criterion); strong candidates might argue that even endorsed taste changes are vulnerable to pumps, challenging the standard defense. However, requiring *some* criterion ensures critical engagement.
