prompt: |-
  I am a professor of philosophy and, this year, the chair of my university's committee on conflicts of interest and research integrity. We adjudicate some fifty cases a year — most of them trivial, a few capable of costing us a campus licence, a researcher's safety, or a colleague's career — and we have been asked to replace our current guidance, which is little more than a gift register with a monetary threshold, with an actual protocol. The protocol has to serve our home campus and two campuses abroad, where the surrounding political economy is clientelist: permits, access to research sites, and official goodwill run through patrons and brokers; a gift is what acknowledges a relationship rather than what buys a favour; and refusing one can be a grave affront rather than a punctiliousness. Some colleagues hold that our home rules simply travel and that anything else is relativism dressed up as cultural sensitivity. Others hold that an impersonal-office ethic applied in such a setting makes our research impossible and punishes local staff for the way their own society works. Both cannot be right, and "when in Rome" is not a procedure.

  What I need is a decision procedure the committee can actually run: the questions in order, what counts as a sufficient answer to each, the points at which the answer is simply no, and the points at which it must stop and hand the decision to a person because what remains is a question of values rather than of fact. It has to work in about twenty minutes, over email, by academics with no legal training, producing one recorded paragraph of reasoning that our general counsel's office can sign off on asynchronously within five days; it has to be usable by a colleague who has never read a line of political philosophy; and it has to say what to do when the relevant fact cannot be had, since we usually cannot know why someone gave something.

  The crude tests we have tried do not work, and I would like you to say why before replacing them. Publicity — would you mind this being known? — misfires where gift-giving is public and expected. A value threshold misfires in both directions: a cheap gift can be the visible token of a clientelist relationship, while an expensive one, a funded conference or a studentship, can be entirely at arm's length. My suspicion is that what does the work is neither size nor secrecy but whether the transfer redirects a practice away from the end that makes the office worth having — admissions is for admitting those qualified to study, peer review for assessing the quality of work, procurement for getting the building built. If that is right, the procedure should turn on something like whether the giver is acquiring a claim on a good the officeholder has no right to dispose of, and whether the transfer would survive that officeholder's leaving office tomorrow; if it is not right, say so and build it on something better. It should also return more than yes and no: what is prohibited, what is permitted, what is permitted only on the record, what our rules permit but should not — and, the category I care about most, what is not a corruption question at all but a question of justice or of whether our institution should be operating there as it does, and is therefore nothing this committee has authority to decide.

  Apply it to three live cases. First: an official who must renew the licence of our campus abroad mentions that his son has applied to the Master's programme whose admissions I chair, and asks me to look at the file. Second: six months after graduating with a First, a former student's family sends me a handwoven rug worth roughly two weeks of local wages, against a rule forbidding gifts above a nominal value. Third: a publisher whose introductory textbook we are deciding whether to require, at the students' expense, offers to fund a three-day curriculum retreat for my department at a coastal hotel. I expect the procedure to give me an answer in the third case that I will not enjoy; give it anyway. Finally, tell me honestly where a procedure of this kind will misfire: which innocent arrangements it will flag, which real corruptions it will miss because they present as hospitality or gratitude, and which questions it is not even able to ask.
reasoning: |-
  Here's a thinking process that leads to the suggested protocol:

  1.  **Analyze the Request:**

      *   **User:** Professor of Philosophy, Chair of Committee on Conflicts of Interest (COI) and Research Integrity.
      *   **Context:** Adjudicates ~50 cases/year. Range from trivial to existential (campus license, safety, career).
      *   **Problem:** Current guidance is a simple monetary gift register. Needs a robust *protocol*.
      *   **Complication:** Three campuses (1 home, 2 abroad). Abroad campuses are in *clientelist political economies* (gifts = relationship acknowledgment, refusal = affront, permits/access depend on patrons).
      *   **Debate:** Universalists (home rules travel) vs. Contextualists (impersonal ethic makes research impossible/unjust to locals).
      *   **Requirements:**
          *   Decision procedure (questions in order, sufficient answers, stop points).
          *   Must run in ~20 mins, over email, by non-lawyers.
          *   Output: One recorded paragraph of reasoning (for General Counsel).
          *   Must handle unknown facts (intent of giver).
          *   Must distinguish: Prohibited, Permitted, Permitted on Record, Permitted but Ethically Doubtful, Not a COI Question (Justice/Institutional Legitimacy).
          *   Must critique current "crude tests" (Publicity, Value Threshold).
          *   Must validate/refine the user's hypothesis (Teleological/Office-based: does it redirect the practice from its end? Does it create a claim on a good the officeholder can't dispose of? Would it survive the officeholder leaving?).
          *   Apply to three specific cases (Admissions/License, Rug/Gratitude, Publisher/Retreat).
          *   Honest assessment of failure modes (false positives, false negatives, unaskable questions).

  2.  **Deconstruct the User's Hypothesis:**

      *   *Hypothesis:* Corruption isn't about size or secrecy, but whether the transfer redirects a practice from its *telos* (end/purpose).
      *   *Key Test 1:* Is the giver acquiring a claim on a good the officeholder has no right to dispose of? (The "Agency" test).
      *   *Key Test 2:* Would the transfer survive the officeholder's leaving office tomorrow? (The "Personal vs. Institutional" test).
      *   *Assessment:* This is strong. It aligns with "Institutional Corruption" theory (Lessig, Thompson) and Aristotelian teleology. It avoids cultural relativism by focusing on the *function of the office* rather than the *custom of the gift*. A gift that acknowledges a relationship is fine *unless* that relationship claims authority over the office's function.
      *   *Refinement:* Need to make this operational for non-philosophers. "Telos" needs to be translated into "Job Description/Official Duty." "Claim" needs to be translated into "Expectation of Preferential Treatment."

  3.  **Drafting the Protocol (The "Office-Integrity Protocol"):**

      *   *Structure:* Sequential gates. If "No" at a critical gate, stop. If "Unknown," apply precautionary principle or escalate.
      *   *Step 1: The Nature of the Transfer.* Is it a gift, favor, or opportunity?
      *   *Step 2: The Office Function.* What is the specific duty involved? (Admissions, Procurement, Grading).
      *   *Step 3: The Claim.* Does the giver expect something in return *related to that duty*? (Crucial for clientelism: the "acknowledgment" vs. "purchase" distinction).
      *   *Step 4: The Survivorship Test.* If I leave, does the benefit/obligation remain?
      *   *Step 5: The Justice/Legitimacy Gate.* Is the underlying requirement (e.g., the license itself) just?
      *   *Output Categories:* Prohibited, Permitted (Unrecorded), Permitted (Recorded), Permitted (Advisory), Out of Scope (Justice).

  4.  **Critiquing the Crude Tests (as requested):**

      *   *Publicity Test:* Fails in high-trust/high-visibility cultures where hiding a gift implies shame, but giving it implies honor. Also fails for institutional corruption (legal but wrong).
      *   *Value Threshold:* Fails because small tokens can seal big deals (clientelism), and large institutional grants can be arm's length.
      *   *Why the Office-Integrity Test works:* It focuses on the *duty*, not the *object*.

  5.  **Applying to the Three Cases:**

      *   *Case 1 (Admissions/License):*
          *   Duty: Admit qualified students.
          *   Claim: Official wants son admitted *because* he is the licensor.
          *   Survivorship: If Chair leaves, does Official still expect admission? Yes, he expects the *office* to comply.
          *   Verdict: **Prohibited.** (Quid pro quo corruption).
          *   Nuance: The license itself might be a leverage point (Justice question), but the admission decision is not the currency to pay it.
      *   *Case 2 (Rug/Gratitude):*
          *   Duty: Teaching/Grading (completed).
          *   Claim: Family wants continued favor? Or just thanks?
          *   Survivorship: If Prof leaves, does the rug matter? No, it's retrospective.
          *   Verdict: **Permitted on Record.** (Risk of appearance, but teleologically sound).
      *   *Case 3 (Publisher/Retreat):*
          *   Duty: Select curriculum for students' benefit/cost.
          *   Claim: Publisher wants book adoption.
          *   Survivorship: If Prof leaves, does Publisher expect adoption? Yes, that's the investment.
          *   Verdict: **Prohibited.** (The user expects this won't be enjoyed).
          *   Nuance: It redirects the curriculum decision from "best for students" to "reciprocate hospitality."

  6.  **Addressing the "Unknown Fact" Problem:**

      *   We can't know the giver's intent.
      *   Solution: The *Reasonable Observer* standard applied to the *Office*. Would a reasonable observer think this creates a claim on the office?
      *   Burden of Proof: On the academic to demonstrate the separation of duty and gift.

  7.  **Identifying Failure Modes (Honest Assessment):**

      *   *False Positives:* Will flag genuine relationship-building necessary for research access in clientelist states. (e.g., dinners with gatekeepers).
      *   *False Negatives:* Will miss "soft" corruption where no specific claim is made, but general goodwill is banked (the "long game").
      *   *Unaskable Questions:* It cannot judge the legitimacy of the host country's bureaucratic hurdles (the "license" itself). It treats the institution as a given, but sometimes the institution is the problem.

  8.  **Refining the Output Format:**

      *   Needs to be crisp, authoritative, and usable.
      *   Start with the critique of current tests.
      *   Present the Protocol (The "Teleological Gate").
      *   Apply to cases.
      *   End with the limitations.
      *   Tone: Academic, precise, pragmatic, respectful of the user's expertise.

  9.  **Self-Correction/Review during drafting:**

      *   *Check:* Did I address the "clientelist" nuance?
      *   *Adjustment:* Ensure the protocol distinguishes between "relationship maintenance" (allowed if it doesn't touch specific decisions) and "claim acquisition" (forbidden). The "Survivorship Test" is key here.
      *   *Check:* Did I handle the "Justice" category?
      *   *Adjustment:* Add a specific gate for "Institutional Legitimacy." If the *requirement* to give a gift is extortionate (e.g., bribe for safety permit), that's not COI, that's duress/justice. The committee can't adjudicate the morality of the host state, only the integrity of the university's response.
      *   *Check:* Is the output paragraph clear?
      *   *Adjustment:* Provide a template for the recorded reasoning.

  10. **Final Polish:** Ensure the distinction between "Permitted but Ethically Doubtful" (Advisory) and "Out of Scope" (Justice) is clear. The user specifically asked for "what our rules permit but should not."

  *(Self-Correction on Case 1)*: The user chairs admissions. The official asks to "look at the file." This is the danger zone. It's not necessarily "admit him," but "give special attention." In a clientelist system, "look at the file" *means* "ensure admission." The protocol must catch this implication without requiring mind-reading. The "Reasonable Observer" standard covers this.

  *(Self-Correction on Case 3)*: The user expects an answer they won't enjoy. This implies the retreat is likely prohibited. I need to make sure the reasoning is airtight so they can defend it to colleagues who want the free hotel stay.

  *(Final thought on "Justice")*: The committee handles COI. If the state demands a bribe for a license, that's not a COI, it's a threat. The protocol needs to route this to "General Counsel/Security," not "Ethics."

  Let's assemble the response.cw
answer: |-
  This is a profound administrative and ethical design problem. You are asking for a proceduralization of *institutional corruption* theory that can survive contact with *clientelist reality*. Your intuition is correct: the monetary and publicity tests fail because they measure the *symptom* (the gift) rather than the *pathology* (the diversion of the office).

  Below is the critique of your current tests, the proposed **Office-Integrity Protocol**, the application to your three cases, and an honest audit of where this procedure will fail.

  ### I. Why the Crude Tests Misfire

  You asked why the standard tests fail before replacing them.

  1.  **The Publicity Test ("Would you mind this being known?"):**
      *   **Failure Mode:** In clientelist economies, relationships are *public* goods. A dinner with a patron is often a public performance of alliance. Hiding it would imply shame; displaying it implies honor. Conversely, institutional corruption (e.g., a legal donor shaping a research agenda) often withstands full publicity.
      *   **Verdict:** Publicity measures *social embarrassment*, not *functional diversion*.

  2.  **The Value Threshold ("Is it over $X?"):**
      *   **Failure Mode:** This assumes corruption is transactional (buying a specific act). In clientelism, corruption is relational (buying *access* or *loyalty*). A handwoven rug (low value) can seal a bond of obligation that overrides university policy. A funded conference (high value) can be an arm's-length educational grant with no strings.
      *   **Verdict:** Value measures *cost*, not *leverage*.

  ### II. The Office-Integrity Protocol

  This protocol is built on your hypothesis: corruption occurs when a transfer creates a claim on a good the officeholder has no right to dispose of, or when the obligation attaches to the person rather than the office.

  **Constraints:** 20 minutes, email, non-lawyers, unknown intent.
  **Output:** One of five classifications + One paragraph of reasoning.

  #### The Decision Tree

  **Gate 1: The Functional Link**
  *Question:* Is the giver currently subject to, or seeking to influence, a specific decision, process, or resource allocation under your official control?
  *   **No:** Proceed to Gate 2.
  *   **Yes:** Proceed to Gate 3.
  *   **Unknown:** Assume **Yes** (Precautionary Principle).

  **Gate 2: The Retrospective Test**
  *Question:* Is the transfer entirely retrospective (for past service completed) with no implicit expectation of future access?
  *   **Yes:** **Permitted (Unrecorded)** unless value exceeds local legal bribery thresholds.
  *   **No:** **Permitted (On Record).** (Reason: Future goodwill is inevitable in academia, but must be visible).
  *   **Stop.**

  **Gate 3: The Survivorship Test**
  *Question:* If you left your office tomorrow, would the giver still expect the benefit/obligation to hold, or does the expectation rely on *your* specific authority?
  *   **Benefit holds regardless (e.g., a public scholarship):** **Permitted (On Record).**
  *   **Benefit/Expectation vanishes or transfers to your successor:** Proceed to Gate 4.

  **Gate 4: The Teleological Test**
  *Question:* Does accepting this transfer require you to prioritize the giver's interest over the *defined end* of your office (e.g., admitting the qualified, buying the best value, grading the work)?
  *   **No (The interests align):** **Permitted (On Record).**
  *   **Yes (The interests diverge):** **Prohibited.**
  *   **Ambiguous (The "Look at the file" problem):** **Prohibited.** (Reason: In a clientelist context, "attention" is a scarce resource allocated by merit. Diverting attention is a diversion of the office's end).

  **Gate 5: The Legitimacy Gate (The "Justice" Escape)**
  *Question:* Is the "cost" of refusing this transfer the denial of a fundamental right (safety, legal existence of the campus) by a state actor who has no legitimate claim to discretion?
  *   **No:** Proceed to Classification.
  *   **Yes:** **Out of Scope (Justice/Security).**
      *   *Action:* Do not adjudicate as COI. Refer to General Counsel/Security. This is not a conflict of interest; it is duress or extortion. The committee cannot ethics-check a gun to the head.

  #### The Five Classifications

  1.  **Prohibited:** Acceptance diverts the office from its end. (Return gift or decline offer).
  2.  **Permitted (On Record):** Acceptable, but must be entered in the register to maintain institutional memory.
  3.  **Permitted (Unrecorded):** Trivial, retrospective, or purely personal with no office link.
  4.  **Permitted (Advisory):** Technically allowed by rules, but the Committee advises against it due to appearance risks. (This covers "what our rules permit but should not").
  5.  **Out of Scope (Justice):** The problem is not the gift, but the environment. (Refers to Administration).

  #### The Recorded Reasoning Template
  *For General Counsel (to be filled in by Committee Member):*
  > "The Committee reviewed [Transfer] from [Giver]. We determined the link to [Office Function] was [Present/Absent]. Applying the Survivorship Test, the obligation [Would/Would Not] persist beyond the officeholder's tenure. We conclude this [Does/Does Not] redirect the office from its primary end of [Telos]. Classification: [Category]. Reasoning: [One sentence on the specific divergence of interest or lack thereof]."

  ---

  ### III. Application to Live Cases

  #### Case 1: The Licensor's Son (Admissions)
  *   **Gate 1 (Functional Link):** Yes. Official controls license; Chair controls admissions.
  *   **Gate 3 (Survivorship):** If Chair leaves, does Official expect son admitted? Yes, he expects the *University* to comply via the next Chair. The claim is on the office, not the person.
  *   **Gate 4 (Teleological):** The end of admissions is merit. The end of licensing is regulatory compliance. Merging them trades a public good (education access) for an institutional good (license).
  *   **Gate 5 (Legitimacy):** Is the license threat legitimate? If the campus is non-compliant, the threat is valid. If the license is being held hostage for personal favors, it is extortion. *However*, the Chair cannot pay the bribe with admissions decisions regardless of the license's legitimacy.
  *   **Classification:** **Prohibited.**
  *   **Reasoning:** "The transfer creates a claim on the admissions process, which is a good the Chair has no right to dispose of based on external leverage. Accepting redirects the office from merit-based selection to obligation-based selection. The potential regulatory consequence is a matter of institutional security, not admissions integrity."
  *   **Action:** Do not look at the file outside standard protocol. Refer the license threat to the University President/General Counsel immediately.

  #### Case 2: The Gratitude Rug (Former Student)
  *   **Gate 1 (Functional Link):** No. Student graduated six months ago. No current decisions pending.
  *   **Gate 2 (Retrospective):** Yes. It is for past teaching.
  *   **Classification:** **Permitted (On Record).**
  *   **Reasoning:** "The transfer is entirely retrospective for completed teaching duties. There is no current functional link to office decisions. However, due to value exceeding nominal threshold, it is recorded to prevent future pattern-building."
  *   **Note:** In a clientelist culture, this *might* be an investment in future patronage. But the protocol cannot police thoughts. The *Record* protects you if the student returns in five years asking for a job reference.

  #### Case 3: The Publisher's Retreat (Curriculum)
  *   **Gate 1 (Functional Link):** Yes. Department is deciding whether to require the textbook (students' expense). Publisher is offering the retreat.
  *   **Gate 3 (Survivorship):** If you leave, does the Publisher expect the book adoption? Yes. The investment is in the *decision*, not you personally.
  *   **Gate 4 (Teleological):** The end of curriculum selection is pedagogical fit and cost-effectiveness for students. The end of the retreat is hospitality. Accepting hospitality creates a debt of gratitude that competes with the duty to minimize student cost.
  *   **Classification:** **Prohibited.** (I know you will not enjoy this).
  *   **Reasoning:** "The offer creates a reciprocal obligation coincident with a procurement/curriculum decision. Accepting hospitality redirects the decision-making end from student interest/pedagogy to donor reciprocity. The benefit does not survive the officeholder, indicating a claim on the specific decision."
  *   **Action:** Decline the retreat. If the publisher wishes to fund educational development, it must be an unrestricted grant to the University, not a hospitality offer to the decision-makers.

  ---

  ### IV. Honest Assessment of Failure Modes

  You asked where a procedure of this kind will misfire. A protocol is a map, not the territory. Here is where this map leads you astray.

  **1. The False Positive (The "Relationship Tax")**
  *   **The Misfire:** In clientelist economies, *access* is the product. A dinner with a ministry official is not a bribe; it is the only way to file the paperwork. This protocol flags almost all relationship-maintenance as "Functional Links."
  *   **The Cost:** You will flag necessary hospitality. Colleagues will feel the protocol makes research impossible.
  *   **The Fix:** You must use the **Out of Scope (Justice)** gate aggressively here. If the "gift" is the *price of doing business* in that jurisdiction (e.g., a mandatory dinner to process a visa), it is not a COI. It is an operational cost. The Committee should classify these as **Permitted (On Record)** but flag the *system* to the Administration as a risk. Do not punish the researcher for paying a tax the state imposes.

  **2. The False Negative (The "Long Game")**
  *   **The Misfire:** Real corruption often involves no specific claim. A publisher funds five years of conferences, creating a general atmosphere of goodwill. When the curriculum vote comes, no one feels bribed; they just feel "aligned."
  *   **The Cost:** The Survivorship Test fails here because the goodwill *does* survive the officeholder. The culture of the department is shifted, not the specific decision.
  *   **The Fix:** There is no procedural fix for this. This requires *political will* to say "We do not take money from X." The protocol can only catch *transactional* diversion, not *cultural* capture. You must acknowledge this limitation to your General Counsel.

  **3. The Unaskable Question (Institutional Legitimacy)**
  *   **The Misfire:** The protocol assumes the University's presence abroad is legitimate. In Case 1, if the Official's license demand is arbitrary (pure extortion), the "Prohibited" ruling on admissions is correct, but it leaves the campus vulnerable.
  *   **The Cost:** The Committee protects the *integrity* of the decision but cannot protect the *safety* of the campus.
  *   **The Fix:** This is why the **Out of Scope (Justice)** category is vital. You must explicitly state: *"This Committee adjudicates the integrity of the decision, not the justice of the environment. If the environment makes integrity impossible, the question is whether we operate there, not how we bribe."* This is a question for the Board, not the Committee.

  **4. The Epistemic Black Box**
  *   **The Misfire:** You noted we usually cannot know *why* someone gave something. The protocol relies on the "Reasonable Observer."
  *   **The Cost:** A cynical colleague can game the "Retrospective" gate. "I didn't know he was applying for the grant when I took the dinner."
  *   **The Fix:** The burden of proof must be on the academic to demonstrate the *separation* of duties. If the timeline is suspicious, the default is **Permitted (On Record)** at minimum. Transparency is the only cure for unknowable intent.

  ### V. Final Recommendation to the Chair

  Do not sell this as "Cultural Sensitivity." Sell it as "Functional Defense."

  The argument to your universalist colleagues is: "This protocol protects the *University's* authority. If we allow admissions to be used as currency for licenses, we admit we do not control our own standards."

  The argument to your contextualist colleagues is: "This protocol distinguishes between *relationship* (which we value) and *claim* (which we cannot honor). You can have the dinner, but you cannot trade the decision."

  The protocol will not stop corruption. It will only stop *you* from authorizing it. That is the limit of a committee's power.
