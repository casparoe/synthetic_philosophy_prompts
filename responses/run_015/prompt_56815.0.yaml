answer: |-
  Here is the criterion, derived from the logical structure of your nine verdicts. It is designed to be binary, falsifiable, and explicit about the trade-offs required to maintain consistency.

  ### The Criterion of Unappealable Allocation

  An artifact is **political** if and only if it satisfies all three of the following conditions:

  1.  **Public Stake:** The artifact allocates access to a resource, status, or risk that is generally held to be a **public good** or a **protected right**, rather than a matter of private preference or convenience.
  2.  **Material Necessity:** The allocation is enforced by **physical or logical necessity** at the point of use, removing the possibility of administrative discretion, human override, or appeal.
  3.  **Unsettled Terms:** The specific allocation effected by the artifact was **not explicitly settled** by a prior legitimate authority (law, regulation, or democratic decision) *in those specific terms*.

  If any condition fails, the artifact is **not political** (it is either a private tool, a mere enforcement mechanism, or a settled administrative fact).

  ---

  ### Mapping the Clauses to Your Cases

  Here is how the criterion processes your nine verdicts. This shows which condition is doing the work in each decision.

  *   **Case 1 & 2 (Overpasses):** **POLITICAL.**
      *   *Public Stake:* Access to a public beach (Condition 1 Met).
      *   *Material Necessity:* Physics prevents buses from passing; no guard can override clearance (Condition 2 Met).
      *   *Unsettled Terms:* In Case 1, the exclusion *was* the decision (so it looks like settlement, but the *method* bypassed public zoning processes). In Case 2, nobody decided the bus exclusion at all (Condition 3 Met).
      *   *Note:* This resolves your tension between 1 and 2. Intent is irrelevant; the lack of *legitimate procedural settlement* is the key.

  *   **Case 3 (Speed Bump):** **NOT POLITICAL.**
      *   *Public Stake:* Road safety is a public good (Condition 1 Met).
      *   *Material Necessity:* Physics enforces the speed (Condition 2 Met).
      *   *Unsettled Terms:* **FAIL.** The speed limit was settled by authority; the bump is merely an enforcement mechanism for a prior decision. (Condition 3 Failed).

  *   **Case 4 (Air Conditioning):** **NOT POLITICAL.**
      *   *Public Stake:* **FAIL.** Climate control is a private convenience/capacity, not a public right. It enables choices but does not allocate a scarce public good. (Condition 1 Failed).

  *   **Case 5 (Facial Recognition):** **POLITICAL.**
      *   *Public Stake:* Security/Justice identification is a public good/right (Condition 1 Met).
      *   *Material Necessity:* Algorithmic output is binary and hard to appeal in the moment (Condition 2 Met).
      *   *Unsettled Terms:* The bias was not authorized or settled by law; it emerged from the design (Condition 3 Met).

  *   **Case 6 (Left-Handed Shears):** **NOT POLITICAL.**
      *   *Public Stake:* **FAIL.** Cutting is a private utility. Left-handers are inconvenienced, but not denied a public right or status. (Condition 1 Failed).
      *   *Resolution of Tension:* This resolves your 2 vs. 6 problem. You do not need to judge "subordination" subjectively. You only need to judge "Public Good vs. Private Utility." Subordination matters only when it blocks access to the *public* sphere.

  *   **Case 7 (Nuclear Power):** **NOT INHERENTLY POLITICAL.**
      *   *Unsettled Terms:* **FAIL.** The technology itself does not dictate the organization; the organization is a separate policy choice. A specific plant might be political if it bypasses oversight, but the tech is not. (Condition 3 Failed).

  *   **Case 8 (Organ Default vs. Browser):** **POLITICAL / NOT POLITICAL.**
      *   *Organ Donation:* Public Stake (Bodily integrity/Public health) + Unsettled (Default implies consent without explicit choice). **POLITICAL.**
      *   *Browser:* Public Stake **FAIL.** Search engine choice is private preference. **NOT POLITICAL.**
      *   *Resolution:* This resolves your "triviality" worry. It is not about triviality; it is about the *domain* (Public Right vs. Private Preference).

  *   **Case 9 (Door Lock):** **NOT POLITICAL.**
      *   *Public Stake:* **FAIL.** Property rights are private rights.
      *   *Unsettled Terms:* **FAIL.** The lock executes the law of property, which is a prior settlement.
      *   *Verdict:* You must abandon the hesitation here. The lock is an enforcement mechanism, not a political settler.

  ---

  ### The Cost of Consistency: Verdicts to Abandon

  To accept this criterion, you must abandon two intuitions that linger in your list:

  1.  **The "Subordination" Intuition (Case 6):** You worried that distinguishing Case 2 (Overpasses) from Case 6 (Shears) required you to import your own views on subordination. This criterion says **no**. It requires you to distinguish *Public Goods* from *Private Utilities*. If society decides left-handers deserve protected status (e.g., all public tools must be ambidextrous), then shears become political. Until then, they are private inconveniences. The criterion does not save you from knowing what your society values, but it moves the judgment from "Is this group oppressed?" to "Is this resource public?"
  2.  **The "Lock" Intuition (Case 9):** You suspected the lock might be political because it enforces the law where the state cannot. This criterion forces you to say **no**. If the law is the settlement, the lock is just a tool. If you call the lock political, you must call the speed bump political (Case 3), which you firmly rejected. You must choose: either enforcement mechanisms are political, or they are not. To keep Case 3 as "Not Political," Case 9 must also be "Not Political."

  ---

  ### Falsification Conditions

  This criterion is falsifiable. It would be proven wrong if you could identify an artifact that meets all three conditions but is intuitively **not** political, or one that fails a condition but is intuitively **political**.

  **Specific Falsifiers:**
  1.  **The "Benevolent Black Box":** An artifact that allocates a public good (Condition 1) via unappealable logic (Condition 2) without prior settlement (Condition 3), but produces a result everyone agrees is fair and efficient.
      *   *Example:* An AI that allocates emergency room triage perfectly, with no human override, never seen before.
      *   *Criterion Verdict:* **Political.**
      *   *Falsification:* If you examine this case and say, "No, that's just medicine, not politics," the criterion is false. (My prediction: You will agree it is political, because it removes human discretion from life-and-death allocation).
  2.  **The "Settled Oppression":** An artifact that enforces a prior, legitimate law (Fails Condition 3) that is widely regarded as tyrannical.
      *   *Example:* A turnstile designed to enforce apartheid laws.
      *   *Criterion Verdict:* **Not Political** (It is merely enforcing a settlement).
      *   *Falsification:* If you say, "The turnstile itself is political," the criterion is false. This is the hardest trade-off. This criterion argues that the *law* is political, the *turnstile* is administrative. If you believe the tool shares the politics of the law, this criterion fails.

  ---

  ### Application to Withheld Cases

  Here is the criterion applied to your three new cases.

  **1. Stair-Only Apartment (1910 vs. New)**
  *   **1910 Building:**
      *   *Public Stake:* Housing/Access is a public good (Condition 1 Met).
      *   *Material Necessity:* Stairs exclude wheelchairs (Condition 2 Met).
      *   *Unsettled Terms:* In 1910, accessibility was not a settled legal right. The building conforms to the settlement *of its time*.
      *   *Verdict:* **Not Political** (as an artifact). It is a historical fact. The *decision to preserve it without modification* today is political, but the stairs themselves are legacy infrastructure.
  *   **New Building:**
      *   *Unsettled Terms:* **FAIL.** Modern code settles accessibility. Building stairs-only violates the settlement.
      *   *Verdict:* **Political.** The artifact actively constitutes a violation of a public settlement regarding access. It is not merely a barrier; it is an *illegal* barrier, meaning it asserts a private exclusion against a public right.

  **2. Programming Language Type System**
  *   *Public Stake:* **FAIL.** Software reliability is a private/technical good, not a public right. Users adopt voluntarily.
  *   *Material Necessity:* Logic enforces constraints (Condition 2 Met).
  *   *Verdict:* **Not Political.** It is a tool that encodes technical preferences. Even if it makes certain errors inexpressible, it does not allocate public status or rights. (Unless the language is mandated by law for safety-critical infrastructure, in which case Condition 1 shifts).

  **3. Paper Ballot vs. Electronic Machine**
  *   *Paper Ballot:*
      *   *Public Stake:* Voting is the ultimate public good (Condition 1 Met).
      *   *Material Necessity:* **FAIL.** Paper can be recounted, inspected, and overridden by human adjudication. It allows discretion/appeal. (Condition 2 Failed).
      *   *Verdict:* **Not Political.** It is a medium that preserves human authority.
  *   **Electronic Machine (Uninspectable):**
      *   *Public Stake:* Voting (Condition 1 Met).
      *   *Material Necessity:* The count is determined by software no one can check; no recount is possible independent of the machine. (Condition 2 Met).
      *   *Unsettled Terms:* Unless the law *explicitly* mandates "trust the vendor without verification" (which would be a political settlement), the machine settles the count without public authorization.
      *   *Verdict:* **Political.** It displaces public verification with private authority.
      *   *Why your gut was right:* The difference is not who wins, but **who holds the power of verification.** The paper ballot keeps the power with the public (Condition 2 Failed); the machine transfers it to the vendor (Condition 2 Met). This fits your intuition that the politics lies in the *structure of authority*, not the outcome.

  ### Summary
  The principle is **Authority Displacement**. An artifact is political when it hardcodes a decision about public goods that removes the possibility of human appeal, without explicit prior authorization. It forces you to admit that locks and speed bumps are not political (they enforce settlements), while defaults and unappealable algorithms are (they make settlements). It demands you distinguish between public rights and private inconveniences. If you accept this, you have a scalpel. If you find you cannot call the apartheid turnstile "administrative," you must discard the criterion.
