answer: |-
  There is no canonical, established term in the philosophical literature that precisely captures this specific dialectical pattern. While related concepts exist (e.g., *quasi-realism*, *instrumentalism*, *quantifier variance*), they describe stable meta-ontological positions, not the *tactical oscillation* you have identified. The phenomenon you describe is a dynamic maneuver within an argument, not a static philosophical stance.

  To provide the "carving" you requested, I will propose a coined concept: **The Ontological Toggle**. Below is the precise definition, its boundaries, its distinction from related failure modes, and an assessment of its unity as a phenomenon.

  ### The Carving: The Ontological Toggle

  **Definition:**
  The **Ontological Toggle** is a dialectical strategy in which a proponent modulates the ontological commitment assigned to a specific theoretical entity ($E$) contingent upon the immediate dialectical pressure, without explicitly adopting a pluralistic meta-ontology.

  **Structural Conditions:**
  1.  **Explanatory Phase (High Weight):** When $E$ is required to ground a truth, solve a puzzle, or provide reductive analysis, the proponent asserts $E$ possesses robust, mind-independent, concrete existence (Realism).
  2.  **Defensive Phase (Low Weight):** When $E$ is challenged on epistemic access, parsimony, or causal isolation, the proponent asserts $E$ possesses deflated, representational, or heuristic status (Instrumentalism/Fictionalism).
  3.  **Continuity Constraint:** The proponent treats these not as two different theories, nor as a retreat from a controversial claim to a trivial one, but as compatible aspects of a *single* theoretical framework. The definition of $E$ remains constant; only its *mode of existence* is reweighted.
  4.  **Reversion:** Once the specific objection is deflected, the proponent reverts to the High Weight assertion without acknowledging the tension or providing a bridge principle that reconciles the two modes.

  ### Boundaries and Distinctions

  To distinguish the Ontological Toggle from nearby concepts, we must look at the *status of the positions* and the *intent of the shift*.

  **1. Versus Motte-and-Bailey**
  *   **Motte-and-Bailey:** Relies on an asymmetry of defensibility. The "Bailey" is a controversial, substantive claim. The "Motte" is a trivial, defensible claim (e.g., "We should be reasonable"). When attacked, the defender *abandons* the Bailey to occupy the Motte.
  *   **Ontological Toggle:** Both positions are **substantive**. "Worlds are concrete universes" and "Worlds are abstract models" are both heavy metaphysical claims. The defender does not abandon the Realist claim permanently; they suspend it temporarily. The shift is not from *controversial* to *trivial*, but from *explanatorily powerful* to *ontologically cheap*.
  *   **The Edge:** If the "representational" retreat is presented as a trivial linguistic convention (e.g., "It's just a manner of speaking"), it collapses into Motte-and-Bailey. If it is presented as a serious alternative ontological category (e.g., "They are mathematical structures"), it is an Ontological Toggle.

  **2. Versus Equivocation**
  *   **Equivocation:** The *meaning* or *definition* of the term shifts (e.g., using "faith" to mean "religious belief" in one premise and "trust" in another).
  *   **Ontological Toggle:** The *definition* of the entity remains stable (e.g., "a maximal mereological sum of spatiotemporally related individuals"). What shifts is the **ontological weight** (does this sum exist concretely or only descriptively?).
  *   **The Edge:** If the defender changes the *criteria* for what counts as a world, it is equivocation. If they keep the criteria but change the *status* of the satisfaction of those criteria, it is an Ontological Toggle.

  **3. Versus Theoretical Pluralism (e.g., Carnapian Frameworks)**
  *   **Pluralism:** The proponent explicitly argues that both modes are valid simultaneously within different frameworks or contexts (e.g., "Internal to the modal framework, they exist; externally, they are posits"). This is a stable meta-ontological view.
  *   **Ontological Toggle:** The proponent implies a **single** framework. They do not argue that both statuses hold *at once*; they argue that the entity *is* concrete, but when pressed, suggest it *is really* representational, then later insist it *is* concrete again. The tension is unresolved, not systematized.
  *   **The Edge:** If the defender offers a meta-ontological justification for the duality (e.g., "existence is context-sensitive"), they are a Pluralist. If they simply switch modes to win points, they are Toggling.

  ### Confidence and Uncertainty

  **Confidence Level:**
  I am **moderately high confidence (approx. 80%)** that this constitutes a distinct, identifiable argumentative pattern that is not fully captured by existing fallacy labels. The distinction regarding the *substantive nature of both positions* (unlike Motte-and-Bailey) is the critical differentiator that justifies a new carving.

  **Point of Least Certainty (The "One or Two" Question):**
  The point on which I am least certain is whether the Ontological Toggle is a **single unified phenomenon** or **two distinct moves** that merely resemble each other superficially.

  *   **Hypothesis A (Unified):** It is a single rhetorical strategy of *Ontological Opportunism*. The psychological mechanism is consistent: maximize explanatory credit, minimize ontological debt.
  *   **Hypothesis B (Distinct):** It may actually be two separate failures:
      1.  **Theoretical Confusion:** The defender genuinely does not know if they are a realist or an instrumentalist (a state of *Doxastic Instability*). They aren't toggling strategically; they are confused.
      2.  **Strategic Ambiguity:** The defender knows the positions are incompatible but exploits the ambiguity deliberately (a state of *Rhetorical Deception*).

  **Why this matters:** If it is **Theoretical Confusion**, the remedy is philosophical clarification (forcing the defender to choose). If it is **Strategic Ambiguity**, the remedy is exposing the inconsistency as fallacious. The observable behavior is identical, but the *nature* of the phenomenon changes depending on the defender's internal state, which is often inaccessible.

  In the specific Lewisian cases you cited, it is often difficult to tell if the defender is a "Quasi-Realist" who hasn't admitted it (Hypothesis A) or a confused Realist who panics under epistemic pressure (Hypothesis B). Because the external dialectical structure is the same, I have classified them as one phenomenon (**The Ontological Toggle**), but I must flag that the *underlying cause* may be disjunctive.

  ### Note on Lewis Himself
  It is worth noting that David Lewis himself did **not** employ the Ontological Toggle. He was a steadfast Realist who accepted the epistemic and parsimony costs ("I bite the bullet"). The pattern you observe is characteristic of *defenders* or *interpreters* of Lewisianism who wish to retain the explanatory benefits of Concrete Modal Realism without paying the ontological price. This suggests the Toggle is a **degenerative research strategy** applied to a theory, rather than a feature of the theory itself.

  ### Summary
  The **Ontological Toggle** is the strategic modulation of ontological commitment to a single entity, shifting between Robust Realism (for explanation) and Deflated Instrumentalism (for defense), within a single argumentative arc, without resolving the incompatibility. It is distinct from Motte-and-Bailey because both positions are substantive, and distinct from Pluralism because the duality is not systematized.
