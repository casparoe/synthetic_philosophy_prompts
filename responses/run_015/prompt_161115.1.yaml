  12. **Writing - Step-by-Step:**
      *   *Brainstorming:* Outline 3 approaches. 1. Simple mapping (discard). 2. Validity types (keep). 3. Measurement Models (keep).
      *   *Translation:* Map Instrumentalism -> Predictive Validity sufficiency. Realism -> Construct Validity + Invariance. Skepticism -> Construct-Irrelevant Variance / Method Bias.
