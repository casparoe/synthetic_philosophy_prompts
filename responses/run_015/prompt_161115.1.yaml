      *   Analysis: Criterion contamination usually means the predictor is influenced by the criterion measure. Here, the training data (predictor source) *is* the expression of belief (indicator). The LLM learns to produce indicators without the construct. This is actually more like *spurious correlation* or *lack of construct validity* due to *method effects*. It's not strictly criterion contamination (which implies the validation process is flawed), but rather *construct-irrelevant variance* in the generation process. I should validate the intuition but correct the technical term. It's a "simulacrum of validity."

