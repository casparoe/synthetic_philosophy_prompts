          *   *Epistemic Verdict:* This is a bias (confirmation bias/hindsight). You were wrong about the proposition, even if the background worldview (institutions lie) was correct.
          *   *Hard Truth:* I need to tell the user this verdict is epistemically suspect, even if psychologically understandable.

