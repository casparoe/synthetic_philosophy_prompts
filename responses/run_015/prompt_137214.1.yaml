      *   **User's Current Draft Principle:** (1) Low headcount, (2) Positive evidence (likelihood ratio > 1), (3) No explaining away absence of evidence.
      *   **User's Identified Tensions:**
          *   Headcount (Case 1 vs. Case 2): Large conspiracies *can* exist (Tuskegee), so raw numbers aren't the killer.
          *   Absence of Evidence (Case 6/7 vs. Case 8): Missing studies/redactions count *for* a conspiracy, but "everyone is dead/planted" counts *against* it. What's the difference?
          *   Sliding Goalposts (Case 10 vs. Case 6): Theories that shift are bad, but the user's own suspicion shifted too.
          *   "Vindication" despite error (Case 9): Being wrong about the *specific* conspiracy but right about *corruption* feels okay.
          *   New Variable for Secrecy: User suspects "incentives to talk" matters more than "number of people."

  2.  **Deconstruct the Tensions & Brainstorm Principles:**

      *   *Tension 1: The Headcount/Secrecy Problem (Case 2 vs. Case 4).*
          *   User is right: Raw $N$ isn't the variable. It's about *stability*.
          *   Why did Tuskegee hold? Hierarchy, institutional power, victims marginalized (no platform), internal culture of compliance.
          *   Why did Moon Landing fail (hypothetically)? Thousands of contractors, international rivals watching, huge prestige incentive for defectors, technical verifiability by third parties.
          *   *Candidate Variable:* "Epistemic Vulnerability of the Secret." How easy is it for an insider to defect and be believed?
          *   *Refinement:* It's about the *cost/benefit ratio of defection* for the least loyal participant.

      *   *Tension 2: Absence of Evidence (Case 6/7 vs. Case 8).*
          *   Case 6/7: Specific expectation of evidence (a study *should* exist, a report *should* be public). Absence is a specific gap.
          *   Case 8: "No leaks because everyone is dead." This immunizes the theory. It explains *any* absence.
          *   *Distinction:* Is the absence *localized* (we expect X here and it's missing) or *global* (nothing exists anywhere)?
          *   *Principle:* The "Immunization Clause." A theory cannot treat the *total* absence of positive evidence as confirmation. It can treat *specific* expected absences as evidence, but not *universal* absence.

      *   *Tension 3: Sliding Goalposts (Case 10 vs. Case 6).*
          *   Case 10: The *proponents* shift the claim to avoid falsification.
          *   Case 6: The *user's credence* shifts based on new ambiguity (official story changed).
