          *   Clause 2 (Evidence): There must be positive traces, not just missing ones. Missing things only count if they were expected *independently* of the theory. (Motivated by Case 6/7 vs 8).
          *   Clause 3 (Stability): The core claim can't shift to accommodate refutation. (Motivated by Case 10).

      *   *Refining Clause 1 (The "Leak" Variable):* The user asked for the "right variable." It's not headcount. It's *Epistemic Friction*. How hard is it to leak?
          *   Tuskegee: High friction (racism, hierarchy, fear).
