answer: |-
  # JOINT STATEMENT ON FUNCTION ATTRIBUTION IN BIOLOGY
  **Prepared for the Adversarial Collaboration on Biological Normativity**

  ## 1. Glossary of Settled Terminology

  To prevent equivocation, the undersigned agree to use the following terms with the specified neutral definitions throughout this inquiry. These definitions describe the *targets* of our theories without presupposing the *grounds* of those theories.

  *   **Function:** The label applied when a biologist asserts that a trait exists *to do* X. This statement implies the trait contributes to a capacity of a containing entity.
  *   **Proper Function:** The specific effect of a trait that justifies a function attribution. (Note: Parties disagree on whether this is determined by history or current contribution).
  *   **Malfunction:** A state in which a trait fails to perform its proper function, distinct from the trait merely being absent or destroyed.
  *   **Design:** The organization of parts such that the presence of the parts is explained by the capacity they produce. (Note: Parties disagree on whether the explainer is intentional agency or natural selection).
  *   **Selected Effect:** An effect of a trait that causally contributed to the differential reproduction of ancestors possessing that trait.
  *   **System:** The containing entity (e.g., cell, organism, population) whose capacity is purportedly maintained by the trait's function.

  ## 2. Agreed Claims

  The following claims are accepted by both the Etiological (Selected-Effects) and Systemic (Causal-Role) positions. Claims that are trivially true or outside the scope of biological practice have been excluded.

  1.  **Paradigm Stability:** In standard cases (e.g., the vertebrate heart), both accounts identify the same effect (pumping blood) as the proper function. Divergence is the exception, not the rule.
  2.  **Function vs. Effect:** Not every causal consequence of a trait is a function. The heart's function is to pump blood, not to make thumping sounds, even though both are causal effects.
  3.  **Normative Force:** Function attributions in biology carry a normative dimension. To say a heart has the function of pumping blood implies a standard against which that heart can be judged as defective, independent of statistical frequency.
  4.  **Multi-Level Attribution:** Function attributions are legitimately made at multiple hierarchical levels (molecular, cellular, organismal, group), though the relevant "System" changes at each level.
  5.  **Artefact Analogy:** Biological function attributions share logical features with artefact function attributions (e.g., a carburetor), specifically regarding the distinction between what a thing *does* and what it is *for*.
  6.  **Context Dependence:** A trait's functional status can change if the containing System changes (e.g., a trait functional in one environment may be non-functional in another), though parties disagree on whether this is due to changed selection pressures or changed systemic contributions.

  ## 3. Disagreements Table

  | Row | Issue | Etiological (SE) Formulation | Causal-Role (CR) Formulation | Verdict | Reason |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1** | **Grounding** | A trait's proper function is *constituted* by its history of selection for that effect. | A trait's proper function is *constituted* by its current contribution to a containing system's capacity. | **Genuine** | Disagreement on metaphysical grounding (past cause vs. present disposition). |
  | **2** | **Novelty** | A trait cannot have a proper function until it has been selected for at least one generation. | A trait has a proper function immediately upon contributing to a system capacity, regardless of history. | **Genuine** | Disagreement on the temporal onset of normativity. |
  | **3** | **Malfunction** | Malfunction is the failure to perform the effect for which the trait was selected. | Malfunction is the failure to perform the effect currently contributing to the system's capacity. | **Verbal** | Both agree on the extension in most cases; divergence is only in definition of "proper function" (see Row 1). |
  | **4** | **Spandrels** | Traits that arise as byproducts of selection (exaptations) have no proper function until re-selected. | Traits that contribute to system capacity have a function immediately, even if originally byproducts. | **Genuine** | Disagreement on whether historical origin blocks functional status. |

  ## 4. The Cruxes

  We identify three sub-questions where theoretical divergence yields distinct predictions. Settling these would force at least one party to revise their account or concede the other's scope.

  ### Crux 1: The Necessity of History
  **Question:** Is a history of selection *constitutive* of function, or merely *correlated* with it?
  **Stipulated Cases:** *The Hitchhiking Twin*; *The Directed-Evolution Lineage*.
  **Measurement/Argument:** Conceptual analysis of intuition pumps backed by population genetics models. We compare two tokens of the same type where causal profiles are identical but histories differ.
  **Predictions:**
  *   **SE:** In the *Hitchhiking Twin*, the allele in the sweep-riding population has no proper function regarding the fitness-irrelevant effect, whereas the twin in the selected population does. In *Directed-Evolution*, the enzyme has a function because in vitro selection mimics natural selection history.
  *   **CR:** In the *Hitchhiking Twin*, both alleles have the same function because their current causal profiles are identical. In *Directed-Evolution*, the enzyme has a function solely due to its contribution to the experimental goal, regardless of whether "selection" occurred.

  ### Crux 2: The Temporal Onset and Shift of Function
  **Question:** Does function emerge simultaneously with fitness contribution, or only after historical fixation?
  **Stipulated Cases:** *The First-Generation Gene*; *The Co-opted-and-Degenerate Trait*.
  **Measurement/Argument:** Analysis of *de novo* gene birth rates and exaptation timelines. We examine the exact generation a trait becomes "functional."
  **Predictions:**
  *   **SE:** The *First-Generation Gene* has no proper function at generation 0; it acquires function only after spreading. The *Co-opted Trait* retains its old function (or has none) until the new effect is selected for.
  *   **CR:** The *First-Generation Gene* has a function immediately at generation 0 if it improves fitness. The *Co-opted Trait* acquires the new function immediately upon contributing to the new capacity, even if the old function is lost.

  ### Crux 3: The Hierarchy of Systems
  **Question:** When trait interests conflict, which System determines the function?
  **Stipulated Case:** *The Selfish Element*.
  **Measurement/Argument:** Analysis of transposon dynamics and organismal fitness costs. We determine which "capacity" takes precedence in function attribution.
  **Predictions:**
  *   **SE:** The transposon has the proper function of replicating itself (selected effect at the gene level), even if this is a malfunction for the organism. Function is relative to the level of selection.
  *   **CR:** Function is relative to the System being analyzed. If analyzing the organism, the transposon is dysfunctional/parasitic. If analyzing the transposon system, it functions. There is no single "true" function without specifying the System.

  ## 5. Closing Note on Confidence and Assumptions

  **Confidence in Crux Resolution:**
  *   **Crux 1 (History):** High confidence (85%). If intuitions on the *Hitchhiking Twin* align with SE, CR must concede history matters. If they align with CR, SE must concede history is evidentiary, not constitutive.
  *   **Crux 2 (Time):** Medium confidence (60%). This relies heavily on linguistic intuitions about "new" traits, which are notoriously unstable.
  *   **Crux 3 (Hierarchy):** High confidence (90%). This exposes a structural difference: SE ties function to the *level of selection*, CR ties it to the *level of analysis*.

  **Least Certain Claim:**
  I am least sure of **Agreed Claim #5 (Artefact Analogy)**. While both sides use artefacts as analogies, the SE side relies on *designer intention* mapping to *natural selection*, while the CR side relies on *user purpose* mapping to *system capacity*. If the analogy breaks down, much of our common ground regarding "normativity" may collapse.

  **Contingent Empirical Assumptions:**
  1.  **De Novo Gene Function:** This document assumes *The First-Generation Gene* case is biologically coherent (i.e., that a random sequence can immediately improve fitness). If empirical work shows *de novo* genes always require a period of non-functional drift before optimization, **Crux 2** becomes moot, as SE and CR predictions would converge on generation 100+.
  2.  **Tightness of Selection:** The *Hitchhiking Twin* case assumes we can empirically distinguish alleles fixed by selection vs. hitchhiking. If genomic linkage is so tight that these are empirically indistinguishable in practice, **Crux 1** becomes a purely metaphysical dispute with no empirical traction.
  3.  **Transposon Cost:** The *Selfish Element* case assumes transposons lower organismal fitness. If they are mostly mutualistic or neutral, the conflict between gene-level and organism-level systems dissolves, weakening **Crux 3**.

  If assumption (1) is false, the document must be revised to focus on *exaptation* (Co-opted Trait) as the primary test for temporal onset. If assumption (2) is false, the collaboration must shift from biological cases to thought experiments regarding Twin Earth scenarios.
