          *   *Fāʿil Majāzī* (Metaphorical/Conventional Agent): Human (Moral/Legal).
      *   **The "Habit" as the Bridge:** The regularity isn't just epistemic (for us); it's a divine promise (*waʿd*). God *binds Himself* to follow the habit. This makes the human choice predictive and thus actionable.
