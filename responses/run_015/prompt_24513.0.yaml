  8.  **Self-Correction during drafting:** I need to be careful not to make al-Ghazālī sound like a compatibilist in the modern Humean sense. He is a theological determinist. The "freedom" is not the freedom to do otherwise in the exact same circumstances (libertarian), but the freedom from external compulsion (*ikrāh*). The user is coming from Hume, so I need to highlight where al-Ghazālī diverges from Humean regularity (for Hume, necessity is a projection; for al-Ghazālī, the *lack* of necessity is ontological, but the *regularity* is divinely guaranteed).

