  3.  **Identify al-Ghazālī's Specific Move:**
      *   It's not enough to say "God creates, humans acquire." That's the standard Ashʿarite line (al-Ashʿarī, al-Bāqillānī). Al-Ghazālī refines this.
      *   Key distinction: *Creation* (*khalq*) vs. *Acquisition* (*kasb*).
      *   Key distinction: *Power* (*qudra*) vs. *Act* (*fiʿl*).
      *   Crucial nuance: Al-Ghazālī distinguishes between the *ontological* source of the act (God) and the *moral* attribution of the act (Human).
      *   He needs to preserve the *connection* between the human will and the act without granting the human will *causal efficacy* in the metaphysical sense.
