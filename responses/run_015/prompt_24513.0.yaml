      *   **Define the Ethical Claim:** Responsibility requires *ikhtiyār* (choice/volition), not metaphysical causation.
      *   **The Mechanism of *Kasb* (Acquisition):** How does al-Ghazālī specificially handle this in *Tahāfut* and *Iḥyāʾ*?
