answer: |-
  Here is the specification for evidential competence in thought experiments, drafted for your reading group.

  ### The Specification for Evidential Competence

  To count as evidential work rather than rhetorical leaning, a thought experiment must function as a controlled probe into a specific conceptual variable. The following table outlines the necessary desiderata. Note that 'competence' here refers to the case's ability to isolate the target intuition, not the correctness of the intuition itself.

  | Desideratum | Rationale & Stand | Failure Mode Flagged |
  | :--- | :--- | :--- |
  | **Variable Isolation** | The verdict must track changes in the target variable alone. Confounding details must be neutralised. | (a) Idle Wheel; (d) Borrowed Intensity |
  | **Modal Coherence** | The scenario must not rely on hidden impossibilities to generate the pull. | (c) Modal Gap |
  | **Structural Transparency** | The causal/normative structure must be explicit, not hidden in narrative texture. | (b) Shadow Case |
  | **Framing Robustness** | Verdicts should not flip under irrelevant rephrasing (e.g. 'kill' vs 'cause to die'). | (d) Borrowed Intensity |
  | **Export Clause** | *Optional Extra.* Stating in advance what would move the verdict aids theory-building but stifles discovery. | N/A |

  ### Controversial Stands

  **Stability:** Stability across populations is not a requirement; it is a prejudice of the survey-running camp. Variation often reveals genuine conceptual divergence or contextual sensitivity, which is data in itself. However, stability under *irrelevant framing* (Framing Robustness) is a genuine requirement. If swapping 'kill' for 'cause to die' flips the verdict, the case is measuring lexical affect, not moral structure.

  **Realism:** This is a taste, not a requirement. A case need not be nomologically possible to be evidentially competent, provided it satisfies Modal Coherence. We can learn about 'personhood' from teleporters just as well as from courtrooms, provided the impossibility isn't doing the argumentative work covertly.

  **Specialist Intuition:** This is special pleading. Unless the concept under discussion is technical (e.g. 'entropy'), appealing to 'trained' intuition is merely an attempt to insulate a theory from folk counter-examples. The target of most philosophical concepts is ordinary competence, not expert refinement.

  ### The True Tension

  You have correctly identified the genuine tension: **Spareness versus Ecological Richness**. This is the philosophical analogue of the internal versus external validity trade-off in experimental design.
  *   **Spareness** (Gettier-ish cases) ensures Variable Isolation but risks disengaging ordinary competence, forcing subjects to guess at an alien logic.
  *   **Ecological Richness** (Realistic vignettes) engages ordinary competence but introduces confounding variables (Idle Wheels) that obscure which feature drove the verdict.
  You cannot maximise both. A case must declare which side it privileges; attempting both usually results in a case that is neither controlled nor engaging.

  ### The Most Exclusionary Requirement

  The single requirement that does the most exclusionary work is **Variable Isolation**. Most circulating thought experiments rely on rich narration to generate pull, rarely testing whether the verdict persists when irrelevant details (the colour of the wall, the gender of the agent, the specific mechanism of failure) are altered. Enforcing this would invalidate the majority of vignette-based ethics cases and many classic analytic setups, as few authors demonstrate that their intuition tracks the target variable rather than the narrative texture.

  ### Application: Case A vs. Case B

  Under this specification, the verdict regarding the **nurse's blame** should not differ between Case A and Case B. In both scenarios, her epistemic state and available actions are identical; the only variable changed is the causal history of the equipment (interference vs. non-provision), which is unknown to her.

  If intuitions diverge here, it indicates the blame is being **pumped rather than argued**. Specifically, Case A likely triggers **Borrowed Intensity** (the phrase 'switched off' implies agency and sabotage, invoking anger) or a **Shadow Case** (the reader is silently judging the contractor or the hospital administration, not the nurse). A competent case would strip the history of the machine to ensure the intuition targets the nurse's conduct alone.

  ### Style Scorecard

  | Style | Competence Profile |
  | :--- | :--- |
  | **Spare Analytic** | High Variable Isolation; risks failing Ecological Richness (alienation). |
  | **Sci-Fi Escalation** | High Modal risk; excellent for isolating specific metaphysical variables. |
  | **Realistic Vignette** | High Ecological Richness; risks failing Variable Isolation (confounds). |

  \answer{Variable Isolation}
