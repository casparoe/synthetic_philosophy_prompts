answer: |-
  ok here's the run sheet for the pub night. keep it loose, keep the beer flowing, but dont let them wander off into the weeds.

  **1. the foundation: the shared ruler (commensurability)**
  before you even mention thresholds or lexical priority, you gotta land the idea that pain and pleasure are measurable on the same scale. if they think pain is "red" and pleasure is "cold," the whole theory collapses because you cant set a threshold on a scale that doesnt exist.
  *   **the move:** ask them if a really good meal can ever make up for a mild headache. if they say yes, they already believe in commensurability. get them to admit there's *some* exchange rate, even if its fuzzy.
  *   **head off misconception #3 (commensurability = trading units like temperature):** do this early. tell them straight up: "im not talking about precise math yet. im talking about whether theyre even the same *currency*. if theyre different currencies, you cant set a bank limit." dont let them think we need a thermometer for suffering. just need to agree its the same ruler.

  **2. the rule: lexical priority (the veto)**
  now that they accept there's a ruler, introduce the lexical claim. this is where most people screw up.
  *   **the move:** explain that below a certain point on that ruler (the threshold of severe suffering), the normal math stops. it's not that suffering weighs 1000x more than pleasure. it's that suffering below the line vetos any amount of pleasure above the line.
  *   **head off misconception #1 (lexical = really really important):** catch them here. someone will say "oh so its just super weighted." you stop them. say: "no. weighted means if i have enough beer i can outweigh the headache. lexical means if the headache is bad enough, no amount of beer matters. its a veto, not a weight."

  **3. the carrying example: society A vs society B**
  this is the meat. use the scenario you mentioned but keep it visceral, not mathematical.
  *   **Society A:** 1% of people are being physically tortured (below threshold). 99% are living great, happy lives (high pleasure).
  *   **Society B:** 0% tortured. 100% are stuck in mild existential dullness. no agony, but no real joy either. just... beige.
  *   **why it works:** it forces the lexical choice. A has way more total happiness, but fails the threshold test. B has less happiness but passes the threshold test. if they choose B, they get the theory.
  *   **what it must lack:** do not draw a graph. do not say "50 utils of pain." if you put numbers on it, they revert to calculus. keep it qualitative. "agony" vs "dullness."
  *   **head off misconception #2 (threshold = line on a graph):** when someone asks "where exactly is the line?", tell them "it doesnt matter for the logic." the point isnt the precision of the line, its the existence of a cliff edge. if you draw a graph, they think its a sliding scale. keep it in words.

  **4. the check question**
  you need to know if they actually get the dependency between the threshold and the commensurability. dont ask "is suffering bad." ask this:

  *"if i convinced you that pain and pleasure are totally different kinds of things—like pain is a sound and pleasure is a color—would the idea of a 'threshold' where pain vetos pleasure still make sense?"*

  *   **right answer:** no. because you cant have a threshold on a scale that isnt shared.
  *   **wrong answer:** yes, because suffering is still worse. (this means they missed the commensurability dependency).

  **5. what to refuse (the hard stop)**
  there's two things you need to explicitly say you're NOT doing tonight. save your voice and their brains.
  *   **formal axiomatics:** tell them "im not writing out the logical proofs tonight. if you want the symbols, come back next month when im sober."
  *   **prioritarianism comparisons:** someone will ask "isnt this just prioritarianism with a cutoff?" shut that down. say "thats a different debate about weighting vs priority. tonight were just looking at whether the threshold claim holds water at all."

  **summary of flow:**
  1.  same ruler? (commensurability) -> catch the "trading units" error.
  2.  veto not weight (lexical) -> catch the "really important" error.
  3.  A vs B (example) -> catch the "graph line" error.
  4.  check question (dependency).
  5.  go home.

  dont overthink it. if they get rowdy, just pour more beer and ask them if the beer outweighs the hangover. works every time.
