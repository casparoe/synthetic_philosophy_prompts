      *   *Idea 3: The Psychological/Feasibility View.* "Ought implies can." If being a saint is psychologically impossible, it's not required.
      *   *Idea 4: The Conceptual/Supererogation View.* There is a category of action *beyond* duty. Being a saint is good but not obligatory.
      *   *Idea 5: The Rule-Consequentialist/Systemic View.* Demanding everyone be a saint leads to bad outcomes (burnout, revolt). So the *rule* isn't demanding, even if the *act* might be.
      *   *Idea 6: The "Moral Holidays" View (User suggested).* Duty pauses occasionally.
