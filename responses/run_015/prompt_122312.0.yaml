answer: |-
  This is a sharp diagnostic question. In EA circles, "You're not required to be a saint" often functions as a conversation-stopper rather than an argument. To make progress, you need to know which normative machinery is actually being invoked.

  Here is a menu of six precise philosophical interpretations of that slogan, analyzed against your criteria.

  ### 1. The Satisficing Threshold View
  **The Thesis:** Morality requires you to produce *enough* good, not the *most* good. Once you cross a threshold of "acceptable contribution" (e.g., donating 10% of income), further sacrifice is optional.
  *   **Trivial or Substantive?** **Substantive.** It rejects the maximizing principle central to classical utilitarianism and standard EA axioms. It requires a defense of why "good enough" is morally distinct from "best."
  *   **Blocks or Changes Subject?** **Blocks.** It directly addresses the demandingness objection by redefining the extent of obligation.
  *   **Status of Supererogation:** **Conceptually Possible.** Actions above the threshold are by definition supererogatory. This view creates the logical space for sainthood to be optional.

  ### 2. The Agent-Centered Prerogative (Schefflerian)
  **The Thesis:** Agents are permitted to give their own interests extra weight (a multiplier $M$) relative to the impartial good. You aren't required to be a saint because you are allowed to prioritize your own projects up to a certain ratio, even if the impartial calculus says otherwise.
  *   **Trivial or Substantive?** **Substantive.** It modifies consequentialism to include agent-relative permissions. It requires arguing for the moral relevance of personal integrity.
  *   **Blocks or Changes Subject?** **Blocks.** It accepts the goal of maximizing good but alters the decision procedure to accommodate human psychology and integrity.
  *   **Status of Supererogation:** **Conceptually Possible.** Acting *against* the prerogative (sacrificing your weighted interests for the greater good) becomes the definition of supererogatory action.

  ### 3. The "Fair Share" / Compliance View
  **The Thesis:** You are only required to do your fair share of the burden needed to solve a problem, assuming others do theirs. You aren't required to be a saint (i.e., pick up the slack for non-compliers).
  *   **Trivial or Substantive?** **Substantive.** It shifts the unit of analysis from individual acts to collective schemes. It is controversial in EA because it implies you should let people die if others refuse to help.
  *   **Blocks or Changes Subject?** **Blocks.** It argues the demandingness objection arises only from assuming full compliance or ignoring the unfairness of burden distribution.
  *   **Status of Supererogation:** **Conceptually Possible.** Picking up the slack (doing more than your fair share) is the paradigm case of supererogation here.

  ### 4. The Psychological Feasibility View ("Ought Implies Can")
  **The Thesis:** "Sainthood" requires psychological traits (total lack of burnout, infinite empathy) that are humanly impossible. Therefore, it cannot be obligatory. Obligation is capped at the limit of sustainable human functioning.
  *   **Trivial or Substantive?** **Substantive (Empirical).** It relies on claims about human psychology and burnout rates. However, it risks being **Trivial** if "can" is defined too loosely (e.g., "I can't because I don't want to").
  *   **Blocks or Changes Subject?** **Blocks.** It denies the premise that the demanding action is actually available to the agent.
  *   **Status of Supererogation:** **Psychologically Hard / Conceptually Murky.** If the act is impossible, it's not supererogatory, it's nonexistent. If it is *possible* for a rare few (actual saints) but not the many, it makes supererogation a category for "moral geniuses" only.

  ### 5. The Lexical Priority of Basic Interests
  **The Thesis:** Moral reasons have a hard ceiling when they conflict with basic human needs (autonomy, health, close relationships). Self-interest gets lexical priority up to a point of "normal functioning."
  *   **Trivial or Substantive?** **Substantive.** This is a deontological constraint on consequentialism. It asserts that some personal goods are immune to being traded off for aggregate utility.
  *   **Blocks or Changes Subject?** **Blocks.** It sets a hard boundary on demandingness.
  *   **Status of Supererogation:** **Conceptually Possible.** Sacrificing basic interests (e.g., selling a kidney, giving up having children) to save others is supererogatory because it violates the lexical priority that normally protects you.

  ### 6. The Systemic / Rule-Consequentialist View
  **The Thesis:** We should not evaluate individual acts by their direct consequences, but by the consequences of everyone internalizing a specific moral code. A code requiring "sainthood" would cause mass burnout and revolt, leading to worse outcomes. Therefore, the optimal code is moderate.
  *   **Trivial or Substantive?** **Substantive.** It changes the locus of moral evaluation from acts to rules/codes.
  *   **Blocks or Changes Subject?** **Changes Subject (Sort of).** It dissolves the demandingness objection by arguing that a demanding *theory* is self-defting. It doesn't say "you don't have to maximize," it says "maximizing requires adopting a non-maximizing code."
  *   **Status of Supererogation:** **Conceptually Possible.** Following the optimal code is duty; going beyond the code (acting as a "saint" despite the code) is supererogatory, though potentially discouraged systemically.

  ---

  ### Summary Table for Your Group

  | Interpretation | Trivial or Substantive? | Blocks or Changes Subject? | Supererogation Status |
  | :--- | :--- | :--- | :--- |
  | **1. Satisficing Threshold** | Substantive (rejects maximizing) | Blocks | **Possible** (Defined by threshold) |
  | **2. Agent Prerogative** | Substantive (weights self-interest) | Blocks | **Possible** (Acting against prerogative) |
  | **3. Fair Share** | Substantive (collective focus) | Blocks | **Possible** (Picking up slack) |
  | **4. Psych Feasibility** | Substantive (empirical claim) | Blocks | **Hard** (Depends on capacity) |
  | **5. Lexical Priority** | Substantive (deontological constraint) | Blocks | **Possible** (Violating priority) |
  | **6. Systemic / Rule** | Substantive (indirect strategy) | Changes Subject (Shifts to codes) | **Possible** (Beyond the code) |

  ### How to Use This
  When someone says "You're not required to be a saint," ask them: **"Which mechanism creates the exemption?"**

  *   If they say "Because you've done enough," they are **Satisficers**.
  *   If they say "Because it's your life," they are invoking an **Agent Prerogative**.
  *   If they say "Because others aren't helping," they are **Fair Share** theorists.
  *   If they say "Because you'll burn out," they are relying on **Feasibility**.

  Most EA arguments fail because people switch between these without noticing. For example, using **Feasibility** to argue for **Lexical Priority** is a category error (just because something is hard doesn't mean you have a right to keep the resources). Mapping these out should stop the slogan from doing invisible work.
