      *   *The Break:* A physical CoM exists regardless of observation. A CNG exists only insofar as the narrative is *sustained* and *accepted*. Gravity is attractive; Narrative is *cohesive*. If the narrative mass scatters, the CoM still exists mathematically (in the void), but the CNG might cease to function as a predictive tool. The physical analogy implies a passive distribution of mass, whereas narrative requires active *spinning* or *weaving*.

