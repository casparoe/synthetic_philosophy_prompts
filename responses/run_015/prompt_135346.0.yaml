      *   *Interpreter Module:* It's the engine of the CNG. In split-brain, it shows the CNG is a post-hoc construction. In dissociation, it shows the fragility of the weave.
      *   *Analogy Breakdown:* Physics is observer-independent; Narrative is observer-dependent (social). Physics is continuous; Narrative is discrete/linguistic.
      *   *Conclusion:* The CNG is a *task*, not a *location*.

  8.  **Constructing the JSON:**
