answer: |-
  Your mate has reconstructed a version of the "Relativist Objection" to *On Certainty* that is standard in the literature (it echoes objections raised by critics like Peter Winch's interpreters, or more recently, the debates between Wright and Pritchard). It is a very tight argument.

  However, the slide is in **Step (4)**.

  Here is why (4) looks innocent, why it is the failure point, what you pay to reject it, and how the two major readings of hinges handle the fallout.

  ### The Loose Step: (4)
  > *(4) Rational criticism of a belief needs a shared practice in which the doubt is intelligible; where the practice differs, all you can do is describe what each side does.*

  **Why it looks innocent:**
  It relies on a very intuitive picture of justification: to argue with someone, you need common premises. If I say "The earth is round" and you say "The earth is flat because the Leader says so," and we don't share the hinge "The Leader is fallible" vs. "Sensory evidence is reliable," it looks like we are just shouting past each other. It conflates **internal justification** (proving a claim using the system's rules) with **external critique** (showing the system itself is dysfunctional).

  **Why it isn't:**
  Step (4) assumes a binary: either we share hinges and argue logically, or we don't share hinges and can only offer anthropological description. It ignores the third option: **pragmatic persuasion** or **therapeutic critique**.

  Even if I cannot use *your* hinges to prove you wrong (because your hinges block that evidence), I can point out that your hinges make certain actions impossible, or that they conflict with *other* hinges you hold.
  *   **Internal Tension:** The cultist holds "The Leader is never wrong" but also "I should feed my children." If the Leader says "Starve your children," the cultist faces a hinge-collision. Pointing this out isn't "description"; it's a rational critique of the coherence of their framework.
  *   **Pragmatic Failure:** I can show that adopting the "Leader" hinge leads to predictive failure or suffering. This isn't an evidential refutation *inside* their game; it's showing that their game is unplayable for beings like us.

  **The Cost of Rejecting (4):**
  If you reject (4) to save (6), you have to pay a price. You must abandon the idea that Rationality is a **neutral tribunal** standing above all practices.
  *   **You lose Foundationalism:** You cannot say the cultist is "irrational" because they violate universal laws of thought.
  *   **You gain Pragmatism:** You have to say the cultist is "mistaken" because their hinges are *less robust*, *less fertile*, or *more painful* than ours. Rational criticism becomes less like a mathematical proof and more like a political or therapeutic intervention. You aren't proving them wrong from nowhere; you are inviting them into a different form of life because it works better.

  ### Holding onto (1) and (2)
  You mentioned you want to keep (1) (functional definition) and (2) (anti-genealogical). This is the "Hard Line" Wittgensteinian position (championed by philosophers like Danièle Moyal-Sharrock).

  If you keep (2), you must admit that **the cult hinge *is* a hinge.** It functions exactly like "The world exists" does for us. It is the bedrock upon which their doubts and certainties turn.
  *   **The Consequence:** You cannot say the cultist is *epistemically* irrational for holding it. They are following the rules of their language-game perfectly.
  *   **The Save:** You block (5) by arguing that **epistemic evaluation is not the only evaluation.** You can condemn the cult on ethical, pragmatic, or psychological grounds without claiming their *epistemology* is invalid. The hinge is epistemically secure *for them*, but ethically disastrous.
  *   **The Price:** You have to accept that "Rationality" is local. You can't say "They are wrong about reality." You can only say "Their way of carving reality prevents them from navigating it successfully." This is a heavy bullet to bite, but it preserves the integrity of the Hinge view.

  ### How the Two Readings Handle This

  The two major interpretations of hinges handle the relativism charge (Step 5) differently, and one of them will force you to give up (2).

  #### 1. The Non-Propositional / Rule View (e.g., Moyal-Sharrock, Wittgenstein)
  *   **The View:** Hinges are not beliefs or propositions that can be true/false. They are **grammatical rules** or **enactive certainties**. They are like the rules of chess; you don't "believe" the bishop moves diagonally, you just play chess.
  *   **Blocking (5):** This view blocks relativism by denying the cultist is making a *knowledge claim* about the Leader. They are adopting a rule of life. Criticism isn't about truth; it's about **coherence** and **viability**.
  *   **Cost regarding (2):** This view **preserves (2) best.** Since hinges are rules, it doesn't matter where they came from (genealogy). A cult rule is still a rule. To avoid relativism, this view shifts the battle from Epistemology to Ethics/Pragmatics. It admits the cult's epistemology is "valid" for their game, but argues their game is not one we should play.
  *   **Verdict:** If you want to keep (2), this is your home. But you must accept that you cannot call the cultist "irrational," only "dangerous" or "incoherent."

  #### 2. The Propositional / Entitlement View (e.g., Crispin Wright, Duncan Pritchard)
  *   **The View:** Hinges are propositions (e.g., "There is an external world") that are **truth-apt** but which we are **entitled** to accept without evidence. They are beliefs, just special ones.
  *   **Blocking (5):** This view tries to save rationality by placing constraints on **Entitlement**. Not just *any* proposition can be a hinge. To be entitled, the proposition must be conducive to cognitive success or knowledge.
  *   **Cost regarding (2):** This view usually **sacrifices (2).** To prevent the "Leader is never wrong" proposition from counting as a legitimate hinge, proponents often have to introduce a genealogical or naturalistic constraint (e.g., "Hinges must be universally human" or "Hinges must arise from reliable cognitive faculties"). If they allow *any* functional proposition to be a hinge, they collapse into the relativism your mate described.
  *   **Verdict:** If you hold this view, you can call the cultist "epistemically irrational" (they aren't entitled to that hinge). But to do so, you usually have to admit that genealogy matters (how the hinge was installed affects its entitlement), which violates your preference for (2).

  ### Summary Advice
  Your mate's argument is valid *if* you assume Rationality requires a shared Archimedean point (Step 4).

  *   **To win the argument:** Reject (4). Argue that rational criticism is possible across frameworks via **immanent critique** (showing internal contradictions) and **pragmatic demonstration** (showing practical failure), without needing shared hinges.
  *   **To keep (1) & (2):** You must adopt the **Non-Propositional/Rule View**. Accept that the cult hinge *is* a hinge. Concede that the cultist is not "epistemically stupid," but argue that their form of life is ethically or pragmatically bankrupt.
  *   **The Bill:** The cost is that you lose the ability to say the cultist is *false* about the world. You can only say they are *lost*. If you aren't willing to pay that price, you must reject (2) and argue that some hinges are "natural" or "universal," and the cult hinge is a pathological distortion, not a genuine hinge.

  Your mate's reconstruction is strong because it forces you to choose between **Epistemic Tolerance** (keeping 1 & 2) and **Epistemic Condemnation** (saving 6). Most Wittgensteinians choose Tolerance on epistemic grounds and Condemnation on ethical ones. That is the only stable position that keeps the argument from collapsing.
