answer: |-
  This is an exceptionally sharp diagnostic observation, and you are right to feel that your students are rediscovering a wheel that needs a name. You have isolated a structural flaw that is distinct from skeptical theism, distinct from the problem of evil, and distinct from simple survivorship bias.

  To answer your primary question directly: **No, there is no single, canonical Proper Noun (like "The Gettier Problem") for this specific structural flaw in the literature on Divine Hiddenness.** It is frequently discussed, but usually under descriptive phrases like "the availability of goods," "the coherence of epistemic distance," or "the problem of failed soul-making."

  However, because you need a pedagogical handle for your seminar, I recommend formalizing this as **"The Success-Conditionality Problem" (SCP)**.

  Below is the analysis you requested: the definition, the distinction from neighbors, the verdict on your three specific questions, and the generalization beyond theology.

  ### 1. Analysis and Definition: The Success-Conditionality Problem

  **Definition:** The Success-Conditionality Problem arises when a justification for a privation $P$ (e.g., divine hiddenness) cites a good $G$ (e.g., faith, moral venture, trust) that is *constitutively dependent* on the absence of $P$ (e.g., divine presence/belief). The justification treats $G$ as available to the subject suffering $P$, when $G$ is ontologically or psychologically accessible only to a subject who has already overcome $P$.

  **The Structure:**
  1.  **Premise 1 (The Privation):** Subject $S$ lacks belief/relationship with God (due to hiddenness).
  2.  **Premise 2 (The Justification):** God permits this lack to enable Good $G$.
  3.  **The Flaw:** $G$ is a **success-conditional good**. $G$ is defined by or requires the successful establishment of the very relationship belief in which $S$ lacks.
  4.  **The Slide:** To make the justification work, the defender silently substitutes $G$ (thick good: *trusting God*) with $G^*$ (thin good: *searching for truth*), but $G^*$ was not the original justification and is often insufficient to justify the magnitude of $P$.

  **Nearest Neighbors and Distinctions:**

  *   **Skeptical Theism:** ST claims we *cannot know* if the good obtains or justifies the evil. SCP grants we *can* know the good is valuable, but argues the good *does not obtain for this subject*. ST is epistemic; SCP is ontological/axiological.
  *   **Survivorship Bias:** Survivorship bias is about *data selection* (we only hear from the believers). SCP is about *value attribution* (we are telling the non-believer that their state serves a good that their state precludes).
  *   **The Problem of Evil (Failed Soul-Making):** In standard theodicy (Hick), "soul-making" can ostensibly continue after death. In Hiddenness, the good cited (e.g., "free relationship") is logically impossible without belief *now*. The SCP is stricter because the good is conceptually tied to the missing belief state, not just a future character trait.
  *   **Person-Affecting vs. Impersonal Value:** This is the meta-ethical home of SCP (see verdict below).

  ### 2. Verdict on Your Three Questions

  #### A. Are the two variants one phenomenon?
  **Verdict: Yes.**
  You distinguished:
  1.  Goods requiring the subject end up in relationship (e.g., trust).
  2.  Goods requiring only awareness of separation (e.g., epistemic distance).

  For the specific case of the **reasonable non-believer** (who concludes *there is no God*), these collapse. One cannot value "epistemic distance from God" if one believes there is no God to be distant from. To the reasonable non-believer, the "distance" is not a gap between two relata; it is the absence of one relatum. Therefore, Variant 2 presupposes a cognitive state (awareness of God's existence but hiddenness) that contradicts the stipulation of the argument (non-belief based on evidence). Both variants fail for the same reason: they attribute a relational property to a subject who, by hypothesis, does not stand in the relation.

  #### B. Is your "Distributive vs. Impersonal" diagnosis correct?
  **Verdict: Yes, this is the root cause, not merely a symptom.**
  Your diagnosis is precise. The Argument from Divine Hiddenness (specifically Schellenberg's formulation) relies on a **Person-Affecting Restriction**: A perfectly loving God is oriented toward *each* particular person. The relationship is *de re*.
  Theodicies of hiddenness often survive by sliding into **Impersonal Value**: "It is good that *some* people search," or "It is good that the *world* is ambiguous."
  The Success-Conditionality Problem is the friction generated when this slide is attempted but not completed. The theodicist uses the vocabulary of personal relationship ("*your* faith," "*your* venture") to appeal to the Person-Affecting premise, but the logic only holds if we switch to Impersonal value ("the existence of faith in the aggregate").
  The "nerve" you are hitting is the **incoherence of applying impersonal justifications to personal premises.** If God's love is distributive, impersonal goods (like "world ambiguity") cannot justify the privation for the individual who loses out.

  #### C. How far does this generalize outside theology?
  **Verdict: It generalizes perfectly to any domain involving Risk, Pedagogy, or Paternalism.**
  This is structurally identical to the **"Ex Post Justification of Risk"** problem in decision theory and ethics.

  *   **Pedagogy:** "I let you fail the exam because struggling builds character."
      *   *SCP Analysis:* "Character building" via struggle is a success-conditional good. If the student fails and drops out (the privation), the character building often does not occur. If the teacher says, "Well, the *attempt* was valuable," they have swapped the thick good (resilience/success) for the thin good (attempt), which rarely justifies the harm of failure.
  *   **Medicine/Ethics:** "We allowed this painful procedure because it might have saved you." (When it didn't).
      *   *SCP Analysis:* Justifying the pain by the health outcome fails if the health outcome is not realized. Justifying it by "the value of fighting" is the thin-good swap.
  *   **Political Philosophy:** "Restrictions on liberty are justified by the civic virtue they foster."
      *   *SCP Analysis:* Civic virtue requires the *exercise* of liberty. Removing liberty to foster virtue is success-conditional; if the liberty is removed, the virtue (as defined) cannot be exercised.

  In all these cases, the justification is specified in the vocabulary of the **success case** (the student who learns, the patient who heals, the believer who trusts) but applied to the **failure case**.

  ### 3. Pedagogical Recommendation

  For your seminar, I suggest you introduce the term **"The Success-Conditionality Problem"** and link it explicitly to the **"Person-Affecting Restriction."**

  You can tell your students:
  > "You are identifying a mismatch between the *logic of the good* and the *state of the subject*. When a good is internal to a relationship (like trust), it cannot be used to justify the absence of that relationship for the person absent from it. This is the Success-Conditionality Problem. It reveals that many hiddenness theodicies are covertly shifting from Person-Affecting value (good for *you*) to Impersonal value (good for *the world*), which contradicts the premise of a personally loving God."

  This gives them a precise label, locates the error in axiology rather than epistemology, and prevents them from conflating it with skeptical theism. It validates their intuition that the justification "vanishes" for the non-believer: it vanishes because the conditions for its instantiation are not met.

  ### Summary of the Phenomenon

  *   **Proposed Name:** The Success-Conditionality Problem (SCP).
  *   **Meta-Ethical Category:** Violation of the Person-Affecting Restriction (sliding to Impersonal Value).
  *   **Logical Form:** Justifying $\neg B$ (non-belief) by $G$ (good of belief), where $G \to B$.
  *   **General Class:** Ex Post Rationalization of Risk/Privation.

  Your instinct is correct: this is the "same nerve" your students are hitting. It is the structural point where Hiddenness diverges from Evil. In the Problem of Evil, the good (e.g., courage) can logically exist alongside the evil (e.g., suffering). In the Problem of Hiddenness, the proposed good (e.g., relational trust) logically *cannot* exist alongside the "evil" (non-belief). That is why the Success-Conditionality Problem is fatal to hiddenness theodicies in a way that "failed soul-making" is not always fatal to general theodicies.
