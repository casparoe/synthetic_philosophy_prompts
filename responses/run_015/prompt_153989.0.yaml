  1. How to read the tree
  This instrument is designed to locate your intuitive judgements within the landscape of Confucian role ethics. Do not treat it as a test with correct answers; rather, use it to clarify where your reasoning diverges from established philosophical positions. Begin at the scenarios below. For each situation, select the response that best matches your immediate instinct or considered judgement. Follow the path corresponding to your choice to the next question. The branches separate views based on foundational metaphysical claims about roles, not merely surface-level actions. You may find yourself forced to choose between two uncomfortable options; this tension indicates where your personal ethics conflict with systematic coherence. Upon reaching a leaf, you will find a label describing the position you inhabit, along with its necessary commitments. Be aware that some distinct philosophical traditions may lead to identical practical conclusions; these are noted in the final section. Proceed slowly, ensuring you answer based on why you hold the view, not just what you would do. This mapping is diagnostic, helping you understand the structural integrity of your own moral reasoning regarding family and society.

  2. The branching cases and answer options
  **Scenario A: The Sister's Lie.** You discover your sister falsified credentials to secure a job. Do you conceal this to protect family reputation, or report it to uphold institutional integrity? This choice tests whether particular relationships override universal rules. If you conceal, proceed to Question 1: Is this because the role of 'sibling' generates unique duties unknown to outsiders, or because public shaming destroys the capacity for private reform? The former suggests roles create morality itself; the latter suggests roles merely manage existing social harmony. If you report, proceed to Question 2: Does the breach of morality void the role obligation entirely, or do you report her *as* a sister to save her soul? This distinguishes between abandoning the role completely and fulfilling it through difficult, corrective tough love.

  **Scenario B: The Workmate.** Covering for a colleague causes harm to unknown clients. Is your primary duty to the relational bond or the stranger's safety? This probes the absolute limit of role-based partiality when physical harm is imminent. If you prioritise the bond, Question 3: Does the professional role create the duty, or does it channel a general human tendency to protect peers? If you prioritise the strangers, Question 4: Is this because role ethics fails here, or because Confucian care must eventually encompass all humanity equally? This separates hard critics of Confucianism from internal expansionists who wish to reform it.

  **Scenario C: The Abusive Parent.** An estranged, abusive parent now requires care. Do you provide it? This is the classic, most difficult test of filial piety versus modern concepts of justice. If yes, Question 5: Is this duty inherent to the position of 'parent' regardless of behaviour, or do you hope to restore reciprocity through your virtue? If no, Question 6: Do obligations dissolve if the other person stops playing their part successfully, or is the failure yours for not transforming them? This addresses the contemporary 'reciprocal activation' debate directly regarding mutual obligation.

  **Scenario D: Strangers.** Does treating strangers with care weaken family ties or extend them? If weaken, you prioritise differentiated love where kin are strictly distinct. If extend, you prioritise gradual expansion where strangers are potential kin. This determines whether universal care is seen as a threat to specificity or a natural goal.

  **Scenario E: Role Conflicts.** When parent duties clash with citizen duties, is there a built-in hierarchy, or must you step outside roles entirely to decide? If hierarchy, which wins? If outside, are roles merely tools for a separate moral agent? This distinction separates essentialists from voluntarists. It asks if you are fundamentally defined by your roles or if you merely possess them as tools.

  **Scenario F: Reciprocity.** If a family member harms you, does your duty cease? If yes, you hold a reciprocal activation view. If no, you hold a unilateral duty view. This is the sharpest divide in modern interpretations of filial piety and determines whether ethics is transactional or ontological. It defines whether love is earned through conduct or assigned by heaven regardless of conduct.

  3. The leaves: positions and their awkward commitments
  **Strict Hierarchical Essentialism.** You arrived here by prioritising family loyalty unconditionally and viewing roles as fixed cosmic positions. Your awkward commitment: You must defend caring for abusive parents even if no reform occurs, potentially validating harm as cosmic order. This view struggles to condemn tyranny within the family structure without contradicting itself. It demands submission to hierarchy even when justice is absent, which clashes with modern legal norms.

  **Mencian Extension.** You chose to care for parents but also extend concern to strangers. Your awkward commitment: You must maintain differentiated love (family first) whilst arguing this naturally expands outward, risking inconsistency when resources are scarce. You must justify why the expansion stops anywhere at all. It requires believing that loving strangers more would actually harm your capacity to love family, a counter-intuitive claim in universalist societies.

  **Modern Relational-Autonomy.** You view roles as channels for existing human obligations, soluble if reciprocity fails. Your awkward commitment: You risk collapsing into Western individualism if roles become too voluntary, losing the distinct 'Confucian' anchor. You must explain why roles matter if they are easily discarded. This position often struggles to explain why we feel guilt when abandoning roles that no longer serve us.

  **Unnamed / Odd Combo.** You prioritise strangers but believe roles create duties. Your awkward commitment: This is theoretically unstable; if roles create duties, why do they not protect kin first? This position lacks historical precedent and requires ad hoc justification for every conflict. It suggests a confusion between role ethics and utilitarianism, leaving you without a coherent metaphysical basis for why roles exist at all.

  4. Empty branches and inseperable pairs
  This tree cannot separate views that agree on action but disagree on metaphysics. For instance, a 'Flexible Role' theorist might see adaptability as progress, whilst another sees it as decay; both answer the scenarios identically. These are inseparable pairs. The tree also leaves empty branches where logic fails. For example, claiming roles create duties but dissolve immediately upon conflict is an empty branch; it contradicts the definition of role ethics. Similarly, believing strangers are family but family ties are weakened by care is logically incoherent. These gaps indicate where philosophical systems collapse under their own weight. Use these gaps to identify when your intuition lacks a coherent framework. If you land here, your views may be pragmatic rather than philosophical. Additionally, two views might both demand caring for an abusive parent, but one sees it as karmic debt and the other as social utility; the tree groups them together despite their profound theological differences. Recognising these blind spots is crucial for honest debate.
