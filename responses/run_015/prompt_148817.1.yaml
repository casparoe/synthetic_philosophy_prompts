  # Diagnostic Decision Tree: Aggregation and the Utility Monster

  **Audience:** Advanced Undergraduate Seminar in Normative Ethics
  **Instructions:** Answer each question based on your immediate normative judgment of the case described. Do not worry about which theoretical label your answer might imply.

  ### Node 1: The Hedonic Aggregation Test
  **Case:** A "Monster" can convert resources into intense subjective pleasure 1,000 times more efficiently than ordinary people. If you give all resources to the Monster, total pleasure is maximized, but everyone else starves.
  **Question:** Is it morally permissible to allocate *all* resources to the Monster in this specific case?
  *   **Yes:** Go to **Node 2**.
  *   **No:** Go to **Node 2**.
      *(Note: Everyone answers Node 2 to test the Structural Variant.)*

  ### Node 2: The Structural Value Test
  **Case:** The Monster does not feel pleasure. Instead, it uses resources to sustain an irreducibly complex aesthetic or epistemic order (e.g., a perfect scientific theory or sublime artwork) that is objectively valuable. If you give all resources to the Monster, total objective value is maximized, but everyone else starves.
  **Question:** Is it morally permissible to allocate *all* resources to the Monster in this specific case?
  *   **Yes (and Yes at Node 1):** **Leaf 1 (Unrestricted Classical Utilitarian)**.
  *   **Yes (but No at Node 1):** **Leaf U (Unoccupied: Perfectionist Aggregator)**.
  *   **No (and Yes at Node 1):** **Leaf V (Unoccupied: Hedonic-Only Utilitarian)**.
  *   **No (and No at Node 1):** Go to **Node 3**.

  ### Node 3: The Non-Fatal Aggregation Limit
  **Case:** (For those who rejected total sacrifice). The Monster's gain is astronomically high, and the others' loss is severe (extreme poverty) but *non-fatal* (they survive with dignity).
  **Question:** Is it permissible to allocate the *majority* of resources to the Monster in this modified case?
  *   **Yes:** **Leaf 2 (Prioritarian/Weighted-Utilitarian)**.
  *   **No:** Go to **Node 4**.

  ### Node 4: The Sufficiency Threshold
  **Question:** Is your refusal primarily driven by the fact that the others would fall below a basic minimum threshold of survival or dignity?
  *   **Yes:** **Leaf 6 (Hybrid/Institutional-Separation)**.
  *   **No:** (You object even above the minimum). Go to **Node 5**.

  ### Node 5: The Inviolability Constraint
  **Question:** Is your refusal based on the view that individuals have an inviolable status that prevents them from being used as means for the greater good, regardless of consequences?
  *   **Yes:** **Leaf 3 (Rights-Based/Side-Constraint)**.
  *   **No:** Go to **Node 6**.

  ### Node 6: The Grounds of Rejection
  **Question:** Is your refusal based on the view that *inequality itself* is intrinsically bad, or that the loss *cannot be justified to the person suffering it*?
  *   **Inequality is Intrinsically Bad:** **Leaf 5 (Strict Egalitarian)**.
  *   **Cannot be Justified to the Person:** **Leaf 4 (Contractualist)**.

  ***

  ## Diagnostic Analysis & Position Mapping

  ### 1. Leaf Diagnoses and Structural Revision
  For each normative position identified, the following indicates whether the **Structural Variant** (Node 2) forces a revision of the position's core diagnosis or leaves it intact.

  *   **Leaf 1 (Unrestricted Classical Utilitarian):** **Intact.** This position accepts aggregation regardless of whether the "utility" is hedonic or objective. The Structural Variant confirms the commitment to unrestricted maximization.
  *   **Leaf 2 (Prioritarian/Weighted-Utilitarian):** **Intact.** Prioritarianism applies diminishing marginal moral weight to gains. Whether the gain is pleasure or aesthetic order, the weight assigned to the starving many will typically outweigh the Monster's massive gain. The structural variant does not change the weighting mechanism.
  *   **Leaf 3 (Rights-Based/Side-Constraint):** **Intact.** Rights function as trumps against aggregation. Whether the aggregation aims at pleasure or objective value, violating the side-constraint (starvation) is impermissible.
  *   **Leaf 4 (Contractualist):** **Intact.** The core test is whether a principle can be justified to the loser. The type of value the Monster produces (hedonic or structural) does not make the loss of basic resources justifiable to the starving individual.
  *   **Leaf 5 (Strict Egalitarian):** **Intact.** Equality of distribution is the primary metric. The efficiency of the Monster (hedonic or structural) is irrelevant if it produces inequality.
  *   **Leaf 6 (Hybrid/Institutional-Separation):** **Intact.** This position sets a distributive floor. As long as the floor is met, aggregation might be permitted; if not, it is forbidden. The *type* of value does not lower the floor.

  ### 2. Map of Unoccupied Combination
  **Path:** **Node 1 (No)** → **Node 2 (Yes)**.
  **Position:** **Perfectionist Aggregator (Leaf U)**.
  **Diagnosis:** **Unattractiveness / Neglect.**
  This combination implies rejecting the aggregation of *welfare* (pleasure) when it causes starvation, but accepting the aggregation of *objective value* (art/truth) when it causes starvation. While logically coherent (one might value art more than pleasure), it is rarely occupied in distributive ethics because views that value objective perfection usually also respect individual agency (rejecting aggregation), while views that accept aggregation usually ground it in welfare. It is unstable to starve humans for a "sublime artwork" while refusing to starve them for "sublime pleasure."

  *(Note: The path Node 1 [Yes] → Node 2 [No] (Leaf V) represents a strict Hedonic Utilitarian who denies objective value. This is occupied by classical Benthamites but is increasingly rare in advanced seminars where "welfare" is often broadened. I have designated the Perfectionist Aggregator as the primary unoccupied spot due to its normative instability.)*

  ### 3. Equifinality Flag
  **Pair:** **Leaf 4 (Contractualist)** and **Leaf 5 (Strict Egalitarian)**.
  **Shared Diagnostic Answers:** These leaves share identical answers for **Nodes 1, 2, 3, 4, and 5**.
  **Distinction:** They are separated *only* by **Node 6** (Motivation).
  **Warning:** In many concrete cases, Contractualism and Strict Egalitarianism yield identical normative outputs (both reject the Monster). A respondent may find the distinction in Node 6 metaphysical rather than practical. If a respondent cannot distinguish between "intrinsic badness of inequality" and "unjustifiability to the loser," this tree cannot separate them. They are functionally equivalent in this diagnostic context, differing only in theoretical backing.

  ### 4. Audience Specification
  This instrument is designed for **advanced undergraduates** who understand basic normative concepts (utility, rights, equality, consent) but have not memorized the specific taxonomy of the Utility Monster debate. The questions avoid theoretical labels (e.g., "prioritarian," "deontological") and rely on case judgments and reasons for refusal. The Structural Variant is integrated early (Node 2) to ensure all respondents are tested against it, satisfying the seminar's focus on non-hedonic value.
