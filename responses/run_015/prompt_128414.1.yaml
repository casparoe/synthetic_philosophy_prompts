answer: |-
  ### Q&A PREP SHEET: THE PROVENANCE TEST

  **Strategy:** You are not selling a solution; you are selling a diagnostic tool. Your goal is to leave the room feeling that the *current* accounting is insecure, not that your alternative is flawless.

  #### I. STRATEGIC CONCESSIONS (First 2 Minutes)
  *Do not wait for these to be dragged out of you. State them early to inoculate against accusations of naivety.*

  1.  **Concede Necessity:** "We cannot pause theoretical physics until data arrives. Non-empirical assessment is happening whether we legitimize it or not. My goal is to make that assessment more rigorous, not to ban it."
  2.  **Concede Scope:** "This is not just about string theory. It applies to the multiverse, inflationary cosmology, and any framework where the math outpaces the measurement."
  3.  **Concede Fallibility:** "The Provenance Test is a heuristic, not an algorithm. It is designed to flag overconfidence, not to prove falsehood."

  #### II. THE "MUST SURVIVE" CLAIM
  *If the audience rejects this, the talk was worthless.*
  **"Correlated lines of non-empirical support do not sum linearly."**
  (If the three arguments stem from one structural feature, they constitute *one* piece of evidence, not three. The confidence level assigned to the framework is mathematically inflated.)

  #### III. REDUNDANT OBJECTIONS (Two Objections, One Clothes)
  **The Experimentalist and the Program Officer.**
  *   **Experimentalist:** "This is decadent; we need data."
  *   **Program Officer:** "How does this change funding allocation?"
  *   **The Core:** Both are asking about **opportunity cost**. They don't care about the epistemology; they care about resources. Treat them as one bloc: acknowledge the cost, but argue that misallocated *theoretical* effort is also a cost.

  #### IV. THE SOUND BUT LOSING OBJECTION
  **The Historian of Science.**
  *   **The Objection:** "Ptolemaic astronomy had extreme internal rigidity and a centuries-long tradition of absorbing anomalies (epicycles) rather than discarding the framework. By your metric, geocentrism would have passed the Provenance Test shortly before it died."
  *   **Why you can't answer it:** If you agree, your test validates false theories. If you disagree, you look historically illiterate.
  *   **The Pivot:** "That is exactly why the test requires the *counterfactual* condition. We must ask: 'What would have been true if the earth moved?' The Ptolemaic community could not answer that without abandoning the framework. String theorists claim they can. The test is designed to distinguish between *degenerating* rigidity and *progressive* rigidity. But I concede: history suggests we are often bad at telling the difference in real-time."

  #### V. THE DANGEROST QUESTION (Not Standing)
  *You worry about the "Who are you?" question. Do not.*
  **The Real Danger:** The Sympathetic String Theorist asking: **"If your test invalidates our current confidence, what positive criterion do you offer that doesn't just boil down to 'wait for data'?"**
  *   **Why:** If you say "wait for data," the Experimentalists win and the Theorists revolt. If you offer a new criterion, they will tear it apart.
  *   **Preparation:** Your answer must be: "I am not offering a green light criterion; I am offering a brake check. The positive criterion remains 'mathematical consistency and fruitfulness,' but we must stop counting the same fruit three times."

  ---

  #### VI. THE OBJECTIONS (Ordered by Damage)

  **1. The Bayesian Philosopher (The Logic Attack)**
  *   **Objection:** "You claim the arithmetic is inflated. But in a Bayesian framework, if 'Rigidity' is a hypothesis that predicts NaA, UE, and MIS, then observing all three *does* update the probability of Rigidity. If Rigidity is truth-conducive, you've just tripled your update. You're confusing correlation with redundancy."
  *   **90-Second Reply:** "Correlation reduces the *independent* weight of evidence. If three witnesses saw the crime through the same single window, their testimonies are correlated by the window's location. Observing three testimonies updates our belief in what happened at the window, not what happened in the whole room. My claim is that Rigidity is the single window. We are over-updating on the view through that glass."
  *   **Soft Spot:** You are simplifying Bayesian network structures. If Rigidity is causally linked to Truth, the correlation *is* evidence. You are assuming Rigidity is not truth-conducive without proving it.

  **2. The Sympathetic String Theorist (The Premise Attack)**
  *   **Objection:** "Your spine is a suspicion that the theory is 'rigid.' But the Landscape suggests extreme flexibility, not rigidity. We absorb anomalies by finding new vacua, not by forcing the math. You're attacking a straw man of the theory to make your Provenance Test pass."
  *   **90-Second Reply:** "The Landscape is the anomaly absorption mechanism I'm warning about. When a framework can accommodate *any* observation by shifting vacua, it becomes unfalsifiable by design. That isn't flexibility; it's structural immunity. The Provenance Test asks: Does this accommodation predict new structures, or just hide old problems? So far, it's mostly the latter."
  *   **Soft Spot:** You are conflating "flexibility of solutions" with "rigidity of framework." They might argue the framework is rigid (String Theory) while the solutions are flexible (Landscape). Distinguishing these clearly under fire is hard.

  **3. The Philosopher of Unconceived Alternatives (The Category Attack)**
  *   **Objection:** "You require us to name the structural feature. But if that feature is sociological ('community practice'), you've moved from epistemology to sociology. You can't derive truth-conduciveness from how a community behaves. That's a genetic fallacy."
  *   **90-Second Reply:** "Science is a human practice. If the 'community practice' is to suppress alternatives rather than find them, the 'No Alternatives' argument is sociologically generated, not physically generated. I'm not deriving truth from behavior; I'm deriving *reliability* from process. A process that absorbs anomalies without resolution is a process that degrades evidence."
  *   **Soft Spot:** You are bordering on Social Constructionism. Hard-nosed realists in the room will bristle at the idea that community behavior impacts the truth-value of the math.

  **4. The Historian of Science (The False Positive Attack)**
  *   **Objection:** "Ptolemaic astronomy had extreme internal rigidity and a centuries-long tradition of absorbing anomalies. By your metric, geocentrism would have passed the Provenance Test shortly before it died."
  *   **90-Second Reply:** "That is exactly why the test requires the *counterfactual* condition. We must ask: 'What would have been true if the earth moved?' The Ptolemaic community could not answer that without abandoning the framework. String theorists claim they can. The test is designed to distinguish between *degenerating* rigidity and *progressive* rigidity. But I concede: history suggests we are often bad at telling the difference in real-time."
  *   **Soft Spot:** See "Sound But Losing" above. You are relying on a distinction (degenerating vs. progressive) that is only visible in hindsight.

  **5. The Program Officer (The Actionability Attack)**
  *   **Objection:** "Let's say you're right. The arithmetic is inflated. What do I do Monday morning? Do I defund string theory? Or do I fund it less? If your answer is 'nothing changes,' this is just philosophy."
  *   **90-Second Reply:** "You don't defund; you diversify. If the confidence in one framework is based on inflated arithmetic, the risk profile changes. You fund competing frameworks that might look less 'rigid' but offer independent structural features. You treat non-empirical support as high-risk venture capital, not government bonds."
  *   **Soft Spot:** "Diversify" is vague. They will ask for metrics on how much to diversify. You don't have them.

  **6. The Experimentalist (The Relevance Attack)**
  *   **Objection:** "This is navel-gazing. If the Provenance Test says 'wait until we understand the structure better,' isn't that just saying 'wait for data'? Why do we need a workshop for this? We have telescopes."
  *   **90-Second Reply:** "Because theory leads data by decades. If theorists spend thirty years chasing a signal based on inflated confidence, you lose a generation of experimental design. We need to know if the map is distorted before we build the compass. This isn't about waiting for data; it's about not wasting the time before data arrives."
  *   **Soft Spot:** You are implying theorists *are* wasting time. The theorists in the room will resent the implication that their work is a placeholder for yours.

  **7. The Old-School Falsificationist (The Legitimacy Attack)**
  *   **Objection:** "You're legitimizing the illegitimate. By setting criteria for 'valid non-empirical support,' you grant it a status it shouldn't have. It's either science or it's math. There is no middle ground."
  *   **90-Second Reply:** "There is a middle ground called 'theory construction.' We assess historical theories, mathematical consistency, and heuristic fruitfulness all the time without data. I'm not asking for a pass on falsifiability; I'm asking for honesty about the weight of the evidence we *do* have. Pretending non-empirical arguments don't exist doesn't make them go away."
  *   **Soft Spot:** You are conceding that non-empirical support *exists*. He denies the category entirely. You won't convince him, and trying might make you look soft on falsifiability to the experimentalists.

  **8. The Editor/Writer (The Novelty Attack)**
  *   **Objection:** "Dawid and others have spent twenty years distinguishing these three arguments. Are you claiming they made a category error? Or is this just a repackaging of existing skepticism?"
  *   **90-Second Reply:** "Dawid argues they are independent lines of support. I am arguing they are dependent variables of a single structural feature. It's not skepticism; it's an audit. If a company lists the same asset under three different accounts, the auditor doesn't say 'thanks for the skepticism,' they say 'fix the books.'"
  *   **Soft Spot:** You are accusing prominent philosophers of basic accounting errors. They will demand proof of the dependency that goes beyond your "suspicion."

  **9. The Other Science Writer (The Narrative Attack)**
  *   **Objection:** "You're writing a story about 'hubris.' Is the Provenance Test actually a tool, or is it just a narrative device to make the skeptics look rigorous and the theorists look dogmatic?"
  *   **90-Second Reply:** "If it were a narrative device, I'd have offered a villain and a hero. I've offered a test that applies to everyone, including me. If tomorrow someone applies the Provenance Test to Loop Quantum Gravity and finds it passes, I will write that story with the same headline. The tool must work on the theories I like, or it's worthless."
  *   **Soft Spot:** You haven't actually applied it to a theory you *do* like yet. If pressed, you might look like you've only tested your target.

  ---

  #### VII. ON STANDING
  **Your Fear:** "A non-physicist proposing assessment standards for a field he can't do."
  **The Reality:** In a room with philosophers, historians, and writers, this is a weak attack. The physicists know you aren't doing their math; they care if you understand their *logic*.
  **The Pivot:** If asked, say: "I am not assessing the math; I am assessing the *argument structure*. That is the job of a writer and a logician. If the bridge collapses, I don't need to be a civil engineer to ask if the load calculations were double-counted."
  **Why this works:** It aligns you with the Auditors (Philosophers/Historians) rather than the Competitors (Physicists).

  #### VIII. FINAL ADVICE
  *   **Watch the Theorists' Eyes:** If they stop taking notes and start looking at each other, you've lost them. Pause and invite a specific name to respond.
  *   **Don't Defend the "Suspicion":** You stated it is a suspicion, not a proof. If they demand proof of the common cause, remind them: "That is why I am calling for the Provenance Test to be applied, not why I am declaring the verdict today."
  *   **End on the Money:** The Program Officer is the only person who can turn your talk into policy. Keep one eye on them. If they look engaged, you've won.
