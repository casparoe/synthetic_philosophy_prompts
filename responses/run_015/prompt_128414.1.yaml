      *   *Objection 2 (The Sympathetic String Theorist):* The "Rigidity" claim is empirically false. String theory isn't rigid; the *landscape* proves flexibility. You're attacking a straw man of the theory to make your provenance test pass.
      *   *Objection 3 (The Unconceived Alternatives Philosopher):* Your test requires naming the structural feature. But if the feature is sociological (community practice), you've moved from epistemology to sociology. You can't derive truth-conduciveness from community behavior.
      *   *Objection 4 (The Experimentalist):* This is navel-gazing. If the provenance test says "wait until we understand the structure better," isn't that just saying "wait for data"? Why do we need a workshop for this?
      *   *Objection 5 (The Falsificationist):* You're legitimizing the illegitimate. By setting criteria for "valid non-empirical support," you grant it a status it shouldn't have.
      *   *Objection 6 (The Historian):* Historical precedents (ether, phlogiston) had "rigidity" and "anomaly absorption" too. Your test might validate false positives.
      *   *Objection 7 (The Funding Officer):* If the arithmetic is inflated, does that mean we stop funding? Or just that we lower confidence? What's the actionable output?
