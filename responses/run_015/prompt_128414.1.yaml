      *   Wait, the prompt asks for "two objections that are really one objection wearing different clothes."
      *   *Idea:* The Falsificationist and the Experimentalist. Both ultimately say "Data is the only metric." One says it philosophically, one says it financially/pragmatically.

  8.  **The "Sound but Losing" Objection:**
      *   Which one is right but I can't agree with without alienating the room?
      *   The Falsificationist is too easy to dismiss.
      *   The Historian is strong: "Rigidity + Anomaly Absorption" describes Ptolemaic astronomy perfectly. If I admit this, I validate the skeptics too much. If I deny it, I look ignorant of history.
