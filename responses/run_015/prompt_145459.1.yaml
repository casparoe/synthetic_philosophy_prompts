  3.  **Synchrony (0.80):** Cognitive architectures tend to generalize across domains faster than physical integration constraints allow for disruption or control handoff.
  4.  **External Stoppers (0.95):** Short-term geopolitical or regulatory friction is unlikely to constitute a hard halt compared to physical constraints in this window.

  **Combination:** 0.50 × 0.50 × 0.80 × 0.95 ≈ 0.20 (use this structure to inspect your 0.35).

