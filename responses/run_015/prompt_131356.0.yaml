          *   *Defender's Move:* Distinguish *causal coupling* from *functional integration*. Do the ants from Colony A respond to Colony B's pheromones as *commands* or just *noise/obstacles*? If they treat them as obstacles, the systems are distinct. If they integrate them, it's a super-colony.
          *   *Severity:* Moderate. Requires precise definition of the "system boundary."
          *   *Concession:* Admit boundaries are functional, not spatial.

      *   **Objection 3: The Triviality/Field Worry (Panpsychism Creep).**
          *   *Scenario:* Decaying trail = forgetting. Therefore, a puddle evaporating = thinking?
          *   *Problem:* Trivialization of "computation" or "representation."
