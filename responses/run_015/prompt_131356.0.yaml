      *   *Refining the Prediction:* Global Workspace Theory (GWT). Brains have a "theater." Colonies have a "marketplace." Prediction: Colonies cannot handle *novel* abstract tasks requiring working memory as well as brains. They are optimized for homeostasis, not exploration of logical space.
      *   *Refining the Insulation:* It's legitimate *if* the "kind" implies structural constraints. If "different kind" just means "ignore the counter-example," it's degenerative.

  5.  **Final Review against User Prompt:**
