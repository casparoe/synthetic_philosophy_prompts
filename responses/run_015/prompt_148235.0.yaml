answer: |-
  You have hit on exactly the tension that has divided philosophers of religion for the last 50 years. Your confusion is not a failure of understanding; it is a recognition of the stakes involved in Wittgenstein's approach.

  You are asking: **If religious belief isn't about facts, isn't it just a glorified hobby? And if it's just a hobby, how is that a "defense" of its rationality?**

  The short answer is: You are interpreting "non-empirical" as "less real," whereas Wittgenstein interprets "non-empirical" as "foundational."

  Here is how to break through the wall you've hit, by distinguishing between **reductionism** (which you fear Wittgenstein is doing) and **autonomy** (which is what he is actually doing).

  ### 1. The Category Error Defense
  The primary reason philosophers cite Wittgenstein as a *defender* of religious rationality is that he stops science from bullying religion.

  If religious claims are treated as scientific hypotheses (e.g., "There is a being in the sky who intervenes in physics"), then science can crush them. If religion is a bad scientific theory, it is irrational.
  *   **The Atheist says:** "There is no evidence for God."
  *   **The Fundamentalist says:** "Here is evidence for God."

  Wittgenstein says **both are making a grammatical mistake.** They are playing chess but arguing about the rules of football. By showing that religious language is a different *language-game*, he immunizes it from scientific falsification. He isn't saying religion is "just a lifestyle choice" in a dismissive sense; he is saying it is a **sovereign domain** that cannot be judged by external criteria.

  To call this a "defense" is to say: *Religion is rational on its own terms, and it is irrational to judge it by alien terms.*

  ### 2. "Non-Cognitive" vs. "Deeply Cognitive"
  Your worry is that if a statement isn't true/false in a factual sense, it's "non-cognitive" (i.e., just emotion). But Wittgenstein suggests something more radical: Religious pictures are **more** than cognitive; they are **constitutive**.

  Consider the statement: *"I believe my friend is loyal."*
  *   **Scientific view:** I have gathered data on his past behavior and predict future loyalty. (Hypothesis)
  *   **Wittgensteinian view:** This belief regulates how I treat him. If I treat it as a hypothesis, I am already not being a friend. I am constantly checking the data.

  Religious belief functions like the belief in friendship, not like the belief in gravity.
  *   If you are wrong about gravity, you fall.
  *   If you are wrong about friendship (or God), your *life* falls apart.

  Wittgenstein argues that religious belief is not a "weak" version of scientific belief (less evidence); it is a **different kind of commitment**. It is "cognitive" in that it structures your entire reality, but it is not "empirical" in that it doesn't rely on sensory verification.

  ### 3. The "Fiction" Objection
  You asked: *Doesn't this make belief a "practical fiction"?*

  This is the strongest objection to Wittgenstein (often raised by realists like Alvin Plantinga). If God isn't "real" in the world, isn't He just a useful story?

  Wittgenstein would reject the word "fiction." A fiction is something you can put down. A religious "picture," for the believer, is something that **holds you**.
  *   **Fiction:** "I will pretend God exists to feel better."
  *   **Religious Picture:** "I cannot make sense of my suffering without this framework."

  Wittgenstein emphasizes the **passion** and **risk** involved in religious belief. In his *Lectures on Religious Belief*, he notes that religious people talk about "Judgment Day" with a terror and seriousness that is completely disproportionate to a mere hypothesis. If it were just a lifestyle choice or a fiction, you wouldn't see that kind of existential grip.

  For Wittgenstein, the "truth" of religion is not **correspondence** (does this match the world?) but **faithfulness** (does this sustain a life?). That is a form of truth, just not a scientific one.

  ### 4. Internal Rationality vs. External Rationality
  You asked: *Why cite him as defending rationality?*

  Because Wittgenstein allows for **internal critique**. Just because religion isn't science doesn't mean "anything goes."
  *   You can be religiously irrational (e.g., superstition, hypocrisy, misunderstanding your own doctrine).
  *   You can be religiously inconsistent.

  Wittgenstein doesn't say religious people can't be wrong. He says they can't be wrong *in the way a physicist is wrong.*
  *   **Scientific mistake:** "I calculated the orbit incorrectly."
  *   **Religious mistake:** "I am using my belief in God's love to justify hating my neighbor."

  The second is a grammatical error within the religious language-game. Wittgenstein defends the rationality of the *game*, not necessarily every *move* made by players. He clears the ground so we can see what counts as a valid move in religion.

  ### 5. The Distinction You Were Missing
  You asked: *Am I missing something in the distinction between 'not empirical' and 'not cognitive at all'?*

  Yes. You are assuming a hierarchy where **Empirical = Real** and **Non-Empirical = Make-Believe**.

  Wittgenstein flattens this hierarchy. He suggests there are many ways language hooks onto the world:
  1.  **Describing:** "The cat is on the mat." (Empirical)
  2.  **Commanding:** "Shut the door." (Imperative)
  3.  **Praying:** "Our Father who art in heaven..." (Vocative/Relational)

  Asking if a prayer is "true" in the same way a map is "true" is a category mistake. A prayer isn't a map; it's an orientation.
  *   Is a compass "true"? No, it's a tool.
  *   Is a map "true"? Yes, it corresponds to terrain.

  Wittgenstein says religious language is more like a **compass** than a **map**. It doesn't tell you what *is* there; it tells you which way you are *facing*. A compass isn't a "fiction," and it isn't a "fact." It is a tool for navigation. If you navigate your life with it, it is functioning correctly.

  ### Summary
  Philosophers cite Wittgenstein as a defender of religious rationality because he rescues belief from the demand to be scientific.
  *   **Your fear:** He reduces religion to emotion/fiction.
  *   **His point:** He elevates religion to a foundational "form of life" that makes emotion and facts possible.

  He isn't saying, "God isn't real, so just act as if He is."
  He is saying, "The word 'real' is doing too much work here. In the religious language-game, God is the bedrock. You don't test the bedrock; you build on it."

  If you accept that there are kinds of truth other than scientific truth (moral truth, aesthetic truth, relational truth), then Wittgenstein isn't reducing religion; he is categorizing it correctly so it doesn't get destroyed by a category error. The "wall" you hit is the boundary between **Scientism** (only science is real) and **Pluralism** (different games have different realities). Wittgenstein is asking you to step into Pluralism.
