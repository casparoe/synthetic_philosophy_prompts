answer: |-
  **Recommendation**

  I recommend that Persistent Exertional Intolerance Syndrome be included in the Main Body of the classification framework. This recommendation takes effect on 1 January 2025. It is contingent upon a mandatory review scheduled for 1 January 2028, to be conducted by the Standing Committee on Classification. This path acknowledges that the diagnostic label is already functioning in the wider social system—within schools, insurers, and general practice—regardless of our vote. Inclusion allows us to govern the criteria, specifically the exclusion clause, rather than ceding control to non-clinical actors. Exclusion or relegation to the Appendix would not stop the label from shaping patient behaviour and clinical practice; it would merely remove our ability to steer that shaping towards safer outcomes. We must choose the pattern of influence we prefer, and formal inclusion offers the only lever to enforce rigorous assessment standards and monitor treatment harms.

  **The findings I am relying on**

  This recommendation turns on three specific data points. First, our clinic registry of twelve hundred patients demonstrates that once the draft criteria leaked, the clinical picture changed: cognitive complaints increased, exertional symptoms decreased, and reported durations lengthened. Second, the Nordic framework experience shows that incidence can triple following adoption, with similar phenotypic drift, yet the category was not withdrawn. Third, the label is already in active use by insurers and occupational health departments; patients receiving it report better workplace accommodation but no improvement in return-to-work rates at twelve months. I am not relying on the proposed inflammatory panel; the sensitivity data is unreplicated and industry-funded. I am also not relying on the assumption that inclusion will cure the condition. The evidence suggests inclusion changes the administrative and behavioural environment around the patient, not necessarily the underlying pathology. The decision rests on managing that environmental change safely.

  **Why the looping does not settle the question**

  The concern about looping effects is that creating a category changes the people it classifies, which in turn changes the category. Some argue this instability means we should not classify at all. However, the label is already circulating. Patients are already altering their behaviour to fit the description, and clinicians are already using the term to stop looking for other causes. The looping is happening whether we vote yes or no. The question is not whether we can opt out of shaping, but whether we can shape it responsibly.

  The most elastic part of the proposal is the exclusion clause: requiring that the picture not be better accounted for by another condition. Without formal inclusion, this clause is interpreted loosely, offering a convenient place to stop looking. By placing the category in the Main Body, we attach authority to the requirement that other conditions *must* be ruled out rigorously. We can mandate that the diagnosis is one of exclusion only after specific investigations are completed. If we relegate this to the Appendix, clinicians may still use the label for insurance purposes but without the binding requirement to perform those exclusions. Formalization allows us to tighten the criteria satisfaction conditions. We cannot prevent the label from influencing the patient, but we can prevent the label from influencing the clinician to stop thinking too early.

  **The strongest case for the option I am rejecting**

  The strongest argument is for relegating the category to the Research Appendix. This position prioritises scientific integrity over administrative convenience. Our registry data shows the phenotype is unstable; the symptoms reported by patients changed significantly merely because the criteria were leaked. Cementing a moving target into the Main Body risks validating a diagnosis that may not represent a stable biological or psychological kind. By keeping it in the Appendix, we acknowledge the suffering without granting the label the authority to close down differential diagnosis.

  Supporters of this view argue that the exclusion clause is too dangerous to formalize. If the label offers a convenient place to stop looking, putting it in the Main Body incentivises shorter assessments, as seen in our post-leak registry data. The Appendix option forces clinicians to justify using the label case-by-case, maintaining pressure to search for underlying causes. It protects patients from the deterioration seen in the minority who failed graded-activity advice, by signalling that the treatment pathway is not yet standard care. This option accepts that we do not yet know what this condition is, and that classifying it prematurely may cause more harm than the confusion of leaving it unclassified.

  **Conditions, monitoring and review triggers**

  Inclusion is conditional on active surveillance. The Standing Committee on Classification will collect data from the national clinic registry and insurer reports annually. There are two specific triggers for early revision or withdrawal. First, if the symptom profile drifts further—specifically, if exertional symptoms drop below fifty per cent of recorded cases while cognitive complaints rise—the criteria must be revised. Second, if return-to-work rates at twelve months do not improve by ten per cent compared to the pre-inclusion baseline, the treatment guidelines attached to the diagnosis must be suspended. Data collection is the responsibility of the College's Research Unit, funded by a designated portion of the classification budget. Clinicians must record whether the exclusion clause was satisfied via specific documented investigations, not merely clinical impression. This ensures the label does not become a shortcut.

  **Note for the minutes from a dissenting member**

  "I vote against inclusion because I believe we are reifying a phenomenon that is still defining itself. The registry data shows the diagnosis changes the patient, and the Nordic data shows the incidence expands uncontrollably. By placing this in the Main Body, we risk making the looping effect permanent. My concern is that we are providing a tool for patients to secure accommodations at the cost of locking them into a sick role that may not benefit their long-term recovery. I prefer the humility of the Appendix."
