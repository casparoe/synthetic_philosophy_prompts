answer: |-
  # Q&A PREP SHEET: Macro Modelling Workshop
  **Role:** Closing Talk (Journalist/Observer)  
  **Core Claim:** Unrealistic assumptions are safe only if counterfactually inert. If load-bearing for policy, require a **De-idealization Schedule** (Who relaxes it? What evidence triggers it? What kills the recommendation?).  
  **Goal:** Survive 20 mins of Q&A without losing the room.

  ---

  ## PART 1: PRE-EMPTIVE CONCESSIONS (First 2 Slides)
  *Say these before they interrupt you. Disarms the "naive outsider" critique.*

  1.  **Concede the "All Models Are False" Point:** Do not argue models should be "true." Argue that *policy* requires knowing *which* falsehoods matter. "I am not asking for realism. I am asking for a map of the minefield."
  2.  **Concede the Journalist's Sin:** Acknowledge you (and the press) often treat model outputs as facts rather than conditional claims. "I am partly here to confess how my trade misuses your work, and how that misuse is enabled by missing contingency plans."

  ---

  ## PART 2: THE "MUST LAND" REPLY
  *If you lose this, the proposal is just noise.*
  **The Point:** Distinguish **Robustness Checking** (internal math) from **De-idealization Scheduling** (external governance).
  **The Line:** "Sensitivity analysis asks: 'Does the model break if I change the parameter?' My proposal asks: 'Does the *policy* break if the *world* proves the parameter wrong?' One is a calculation; the other is a pre-commitment to withdraw advice."

  ---

  ## PART 3: OBJECTIONS & REPLIES (Ordered by Likelihood/Damage)

  ### 1. The Macro Practitioner (DSGE/HANK)
  **Q:** "This is just robustness and sensitivity analysis with a new name. We already perturb parameters and check stability. You're asking us to do what we do, but write a memo about it." *(High Likelihood / High Damage)*
  **Reply (2 mins):** "The math is identical; the *institutional commitment* is not. Standard sensitivity analysis lives in the appendix of a paper. It says, 'Here is the variance.' A de-idealization schedule lives in the policy memo. It says, 'If variable X moves by Y% in the real world, we withdraw this recommendation.' Robustness checks are about the model's integrity. My schedule is about the *policy's* exit strategy. You don't need new code; you need a trigger that binds the advisor, not just the equation."
  **Soft Spot:** You are relying on them to voluntarily bind themselves.
  **Strategy:** **PARTIAL FOLD.** Concede the statistical mechanism is the same. Do not fight on the math. Fight on the *governance*. "Yes, it uses sensitivity tools. No, it is not used for the same purpose."

  ### 2. The Philosopher of Economics
  **Q:** "You treat idealizations as defects to be removed. But on the Galilean account, idealizations are constitutive. They isolate causal forces. You can't 'relax' them without destroying the model's explanatory power." *(Medium Likelihood / High Intellectual Damage)*
  **Reply (2 mins):** "I agree idealizations are constitutive for *explanation*. But we are talking about *policy scoring*. When you use a model to prescribe action, you aren't just isolating a force; you're intervening in a system. If the 'frictionless surface' assumption is load-bearing for the policy lever, the isolation becomes a distortion. I'm not asking you to stop idealizing. I'm asking you to flag which idealizations are 'safe' for explanation but 'unsafe' for intervention."
  **Soft Spot:** Distinguishing "explanation" from "intervention" is messy (performativity).
  **Strategy:** Hold the line. This distinction is your core philosophical defense.

  ### 3. The Climate Modeler
  **Q:** "In climate, we build scenarios, not forecasts. We explicitly say 'If emissions go X, temp goes Y.' We don't score policy by assuming the regime stays fixed. Your distinction between forecasting and policy scoring seems naive about deep uncertainty." *(Low Likelihood / Specific Request)*
  **Reply (2 mins):** "Climate modeling is actually the gold standard for what I want. You produce ensembles and pathways, not point forecasts. Macro policy, however, often presents a single 'optimal rate' based on a single structural path. I'm asking macro to adopt the climate *scenario architecture* for policy evaluation. If the policy itself changes the emissions (or the labor supply), that's a different scenario, not the same model run. I'm asking you to treat policy changes as regime shifts, not parameter tweaks."
  **Soft Spot:** Climate models also struggle with tipping points (structural breaks).
  **Strategy:** Flatter them. Use them as the exemplar for the macro people.

  ### 4. The Institute Director (Reduced-Form Hardliner)
  **Q:** "Structural modelling is theology. If your assumptions are this fragile, why not just use reduced-form evidence? Why fix the engine when we should use a horse?" *(Medium Likelihood / Hostile)*
  **Reply (2 mins):** "Because reduced-form tells you what happened, not what *will* happen under a new regime. I agree structural models are fragile. That is precisely why they need a de-idealization schedule. If we must use structural models to anticipate Lucas Critique effects, we must acknowledge their fragility explicitly. I am not defending structural models as 'true.' I am arguing that if we are going to use theology, we need to know when to stop praying."
  **Soft Spot:** He thinks the whole enterprise is worthless.
  **Strategy:** Agree on the fragility. Use his skepticism to bolster your call for contingency plans.

  ### 5. The "Hope Nobody Asks" (Historical Evidence)
  **Q:** "Name one actual policy episode where a written de-idealization schedule would have changed the advice anyone gave. Give me a concrete case." *(High Damage if fumbled)*
  **Reply (2 mins):** "The 2010 Eurozone Austerity debate. Models assumed 'expansionary austerity' based on confidence effects (bond spreads dropping). The assumption that fiscal consolidation would lower risk premiums was load-bearing. A schedule would have required a trigger: 'If spreads do not narrow within 6 months, withdraw recommendation.' They didn't have that trigger. They held the line while spreads widened. A schedule forces you to define the falsification condition *before* the political cost of admission rises."
  **Soft Spot:** Hindsight bias. Maybe they did have internal triggers and ignored them.
  **Strategy:** Be specific on the mechanism (bond spreads) to avoid vagueness.

  ### 6. The Heterogeneous Agent (HANK) Modeler
  **Q:** "We already fixed the Representative Agent problem. HANK models capture distributional effects. Doesn't that solve the 'unrealistic assumption' issue you're worried about?" *(Medium Likelihood)*
  **Reply (2 mins):** "It solves the *distribution* problem, not the *behavioral* problem. You still have rational expectations, still have specific friction calibrations. If your policy relies on agents reacting to interest rates in a specific way, and that reaction function is idealized, HANK doesn't save you. You've added detail to the agents, but not necessarily contingency to the behavior."
  **Soft Spot:** HANK is complex; hard to claim it doesn't help.
  **Strategy:** Acknowledge progress, but insist behavioral parameters remain the weak link.

  ### 7. The Implementation Skeptic
  **Q:** "Who enforces this? Journals? Central Banks? If a modeler doesn't write the schedule, do we ignore the model? This sounds like bureaucracy." *(High Likelihood / Practical)*
  **Reply (2 mins):** "It starts with transparency, not enforcement. If a policy council publishes a recommendation, the schedule should be in the annex. Peer review can check for its presence. I'm not proposing a police force. I'm proposing that a policy recommendation without a withdrawal criterion is incomplete, like a drug without a dosage limit."
  **Soft Spot:** **FOLD HERE.** You have no authority to enforce this.
  **Strategy:** **TOTAL FOLD.** Admit you don't know the governance mechanism. "You are right. I am a journalist, not a governor. I am proposing the *norm*, you have to build the *institution*. If you tell me this is too bureaucratic, I ask: is the current lack of bureaucracy costing less?"

  ### 8. The Lucas Critique Veteran
  **Q:** "This is just the Lucas Critique repackaged. We know parameters change under policy. We've known this since 1976." *(Medium Likelihood)*
  **Reply (2 mins):** "Lucas diagnosed the disease. I am proposing a treatment protocol. Knowing parameters change is different from specifying *which* change kills the policy. Lucas tells us to be careful. A schedule tells us when to stop. It operationalizes the Critique for the policy memo, not just the theory."
  **Soft Spot:** Can sound like you're claiming credit for Lucas.
  **Strategy:** Defer to Lucas. Position your idea as the "clinical application" of his theory.

  ---

  ## PART 4: STRATEGIC NOTES

  **The One to Fold On:**
  **Objection #7 (Implementation/Authority).**
  *Why:* You cannot answer "Who enforces this?" without sounding naive about power dynamics in Central Banks.
  *Move:* Concede immediately. "I don't know. That's why I'm talking to you. But if the norm doesn't exist, the math doesn't matter." Turn it back on them as a challenge to their profession's self-regulation.

  **The One to Fight Hardest:**
  **Objection #1 (Sensitivity Analysis).**
  *Why:* If this is just sensitivity analysis, your talk is redundant.
  *Move:* Insist on the **Pre-Commitment** aspect. Sensitivity is *exploratory*; the Schedule is *binding*.

  **Tone Check:**
  *   Don't sound like you're teaching them how to model.
  *   Sound like you're asking them how to *report* on their models without lying to the public.
  *   Use the "Journalist" role: "Help me help you not get misquoted."

  **Final Train Thought:**
  If the room goes silent, ask them: "If you can't write down the condition that would make you withdraw your advice, do you actually believe the advice?" That's the closer.
