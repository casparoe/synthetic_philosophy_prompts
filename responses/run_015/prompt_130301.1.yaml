      *   *The Twist:* The prompt suggests the "mask" in the institutional case is the *architecture itself*. The bearer (agency) and the blocker (procedure) are ontologically identical or constitutively linked. This challenges the standard view where the mask is extrinsic or accidental.
      *   *Architecturally Dormant:* A proposed third category where the capacity is defined by its inability to manifest due to its own structure.

  3.  **Drafting - Section by Section:**

