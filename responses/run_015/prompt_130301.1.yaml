answer: |-
  The recognition that finkish and masked dispositions represent structurally different ontological relations rather than mere variations of interrupted potentiality forces a radical re-evaluation of institutional metaphysics. When applied to a regulatory agency, the distinction moves beyond the physical analogy of a fragile glass (which loses fragility when struck vs. remains fragile but is wrapped) to a normative and structural analysis of authority. In the focal case, where an agency's authority to intervene is rendered inert by its own procedural architecture, the blocker is not an external interference but a constitutive element of the bearer itself. This suggests the necessity of a third category: **architecturally dormant capacities**. In this category, the capacity and the constraint are ontologically identical; the institution is defined by rules that simultaneously grant and negate the power to act. This tripartite distinction (finkish, masked, architecturally dormant) carries profound implications for conditional analysis, responsibility, and functionalist reductions.

  ### 1. The Survival of the Simple Conditional Analysis

  The Simple Conditional Analysis (SCA) posits that an entity has a disposition if and only if, were the stimulus condition to occur, the manifestation would follow. Standard counterexamples (finks and masks) already strain the SCA, typically requiring amendments such as "ceteris paribus" clauses or appeals to an intrinsic causal basis. However, the introduction of architecturally dormant capacities in an institutional context renders the SCA untenable without fundamental reconstruction, not merely *ad hoc* patching.

  In a standard masked disposition, the intrinsic basis of the disposition remains intact despite the extrinsic blocker. In the case of the regulatory agency, the "mask" is the procedural architecture that constitutes the agency's identity. If the agency is defined by its procedures, and those procedures prevent intervention, the stimulus condition (e.g., a crisis requiring intervention) cannot logically trigger the manifestation without contradicting the definition of the bearer. The SCA relies on a counterfactual: "If the crisis occurred, the agency would intervene." In the architecturally dormant case, this counterfactual is false, yet we still wish to say the agency *has* the authority (the disposition) in a nominal sense, even if it lacks the operational capacity.

  The SCA fails here because it cannot distinguish between the absence of a disposition and the presence of a self-negating structure. To save the SCA, one would have to amend the stimulus condition to include "procedures allowing intervention," but since the procedures are part of the bearer, this changes the identity of the bearer in the counterfactual scenario. Thus, the SCA cannot survive this tripartite distinction. It must be replaced by a causal-basis analysis that separates the *normative grant* of power from the *operational machinery* of execution. In institutional contexts, the "intrinsic basis" is not a physical microstructure but a deontic status that can be decoupled from functional output. The SCA's binary logic (disposition present/absent) collapses when the bearer's structure ensures the manifestation is impossible by design.

  ### 2. Moral and Legal Responsibility for Non-Intervention

  Attributing masked institutional capacities, specifically the architecturally dormant variety, fundamentally shifts the locus of moral and legal responsibility. In a finkish scenario, where authority vanishes upon the trigger event, responsibility for non-intervention is typically mitigated; the agent literally lacked the power at the critical moment. In a standard masked scenario (external blocker), responsibility often lies with the entity imposing the mask.

  However, when the mask is architectural—where the bearer and the blocker are identical—the assignment of responsibility moves from the operational level to the constitutive level. If a regulatory agency fails to intervene because its own rules require a consensus that is structurally impossible to achieve during a crisis, blaming the agency operators for "non-intervention" is a category error. They are not withholding action; they are enacting the institution as designed.

  This distinction transforms the legal and moral question from one of **negligence** to one of **design liability**.
  *   **Operational Responsibility:** Under a standard view, we ask, "Why did the agents not use their power?"
  *   **Structural Responsibility:** Under the architecturally dormant view, we ask, "Why was the power constituted in a way that precludes its use?"

  This shift implies that responsibility for the harm caused by non-intervention lies not with the civil servants or commissioners executing the mandate, but with the legislators or founders who instantiated the procedural architecture. It exposes a form of "structural impunity" where an institution can hold the title of authority while being ontologically incapable of exercising it. Recognizing this category prevents the scapegoating of operational staff and forces a reckoning with the legitimacy of the institution itself. If an agency is architecturally dormant regarding a specific harm, it is arguably morally incoherent to maintain its mandate without structural reform. The failure is not a failure of will, but a failure of ontology.

  ### 3. The Functionalist Challenge: Does the Distinction Collapse?

  One might argue that institutions lack genuine dispositions altogether and are merely clusters of assigned functional roles. If we analyze the agency purely in terms of input-output functions, does the distinction between finkish, masked, and architecturally dormant capacities collapse?

  If institutions are treated strictly as functional roles, a disposition is simply a description of expected behavior. Under strict functionalism, if the agency does not intervene, it simply lacks the function of intervening, regardless of the paperwork claiming otherwise. In this view, the distinction might appear to collapse into "functioning" vs. "broken."

  However, the distinction does not collapse; it transforms from a metaphysical problem into a **normative contradiction**. Institutions are unique because they carry deontic powers (rights, obligations, authorities) that are not reducible to their immediate causal outputs. A regulatory agency has a *mandate* (a normative disposition) that exists independently of its *capacity* (a functional disposition).

  *   **Finkish:** The mandate is revoked when needed.
  *   **Masked:** The mandate exists, but external forces prevent execution.
  *   **Architecturally Dormant:** The mandate exists, but the rules required to execute the mandate contradict the conditions of execution.

  Even if we deny institutions "genuine" metaphysical dispositions, we cannot deny they possess *assigned* roles. The distinction remains vital because it identifies different types of role failure. A functionalist analysis that ignores this distinction would treat a structurally paralyzed agency the same as an under-resourced one. But the implications differ: an under-resourced agency needs more inputs; an architecturally dormant agency needs a different logic.

  Therefore, the distinction survives functionalism because institutions are inherently normative entities. The gap between "what the institution is supposed to do" and "what the institution can do" is the space where political and legal philosophy operates. To treat the architecturally dormant capacity as merely "non-functioning" is to ignore the specific pathology of the dysfunction. The tension between the assigned role (intervene) and the constitutive rules (cannot intervene) creates a specific kind of institutional hypocrisy that a flat functional analysis would miss. The distinction is preserved as a distinction between **normative validity** and **operational viability**.

  ### Conclusion

  The move to recognize architecturally dormant capacities as a distinct ontological category reveals that institutions can be self-negating entities. This tripartite distinction destroys the Simple Conditional Analysis, as the counterfactual conditions cannot be isolated from the constitutive rules of the bearer. It radically reorients responsibility, shifting blame from operators to designers, and it resists functionalist reduction by highlighting the irreducible gap between normative mandate and operational reality. Ultimately, acknowledging this distinction forces us to accept that an institution can possess an authority that is real in name and law, yet ontologically null in practice, not because of interference, but because of its own essence.
