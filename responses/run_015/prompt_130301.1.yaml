      *   **Addressing Question 2: Moral and Legal Responsibility:**
          *   *Fink Case:* Responsibility is often mitigated because the power *ceased* to exist.
          *   *Mask Case (External):* Responsibility might lie with the masker.
          *   *Architectural Mask Case:* The agency *has* the power but *is* the barrier.
