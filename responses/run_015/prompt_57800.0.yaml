          4.  Choosing a dominated gamble = Irrational (State-wise Dominance).
          5.  Turning down costless relevant info = Irrational (Value of Information).
      *   **New Case (Roommate):**
          *   Cyclic preferences (North > South > Co-op > North).
          *   *Constraint:* Hard policy: Never pay a fee to swap, never do more than one swap total.
          *   *Result:* Cannot be money-pumped.
          *   *Question:* Will the prof call her irrational?
      *   **Tasks:**
          1.  Predict the prof's verdict on the roommate.
          2.  Identify the underlying rule(s) the prof is using.
          3.  Identify alternative rules that fit the past verdicts.
          4.  Propose a specific "test case" to distinguish these rules in office hours.

  2.  **Deconstruct the Professor's "Coherence":**
      *   The professor is clearly invoking *instrumental rationality* defined by *consistency constraints* that lead to Expected Utility Theory (EUT).
      *   The arguments cited are classic "Pragmatic Vindication" or "Dutch Book" arguments.
      *   *Key Insight:* Most coherence arguments (Money Pump, Dutch Book) rely on the *possibility* of exploitation to prove the *structural defect* in the preferences/beliefs.
      *   *The Roommate's Defense:* She blocks the *exploitation* (the money pump) via a secondary policy (no fees, one swap limit).
      *   *The Prof's Likely Counter:* The incoherence lies in the *preferences themselves*, not just the vulnerability to exploitation. The exploitation is just the *proof* of irrationality, not the *definition* of it. If preferences violate Transitivity, they are irrational *per se*, regardless of whether a pump is practically feasible.
      *   *Standard EUT View:* Transitivity is an axiom. Violating it is irrational. Blocking the pump doesn't fix the intransitivity; it just adds a constraint that prevents the *consequence* (losing money), but the underlying preference ordering remains incoherent.

  3.  **Formulate Competing Hypotheses (Rules):**

      *   **Hypothesis A (The Standard EUT/Coherence View):** Rationality requires satisfying axioms (Transitivity, Dominance, etc.) *structurally*. Vulnerability to pumps is evidence of the violation, but blocking the pump doesn't cure the violation.
          *   *Prediction on Roommate:* Irrational. (Intransitive preferences are the sin, not the loss of money).
      *   **Hypothesis B (Pragmatic/Consequentialist View):** Rationality is about avoiding sure losses/exploitation. If you can't be pumped, you're fine. "Rationality is survival."
          *   *Prediction on Roommate:* Rational. (She avoids the negative consequence).
      *   **Hypothesis C (Procedural/Policy View):** Rationality applies to the whole decision system (preferences + policies). If the policy stabilizes the choice, the system is coherent.
          *   *Prediction on Roommate:* Rational (or at least, not clearly irrational).
      *   **Hypothesis D (Representation Theorem View):** You are irrational if your preferences cannot be represented by a utility function.
          *   *Prediction on Roommate:* Irrational. (Cyclic preferences cannot be represented by a real-valued utility function).

      *Refining the Competition:* The strongest competitor to the Standard View (A) in this context is usually the "Pragmatic" defense (B). The student needs to know if the prof cares about the *structure* or the *outcome*. Given the prof is into "coherence arguments for MEU," she almost certainly holds View A. The arguments (Money Pump, Dutch Book) are usually taught as *demonstrations* of why the axioms are necessary, not as the *sole definition* of rationality.

  4.  **Analyze the Roommate Case specifically:**
      *   Preferences: $N \succ S \succ C \succ N$. (Intransitive).
      *   Policy: No fees, max 1 swap.
      *   Why the Prof will likely say "Irrational":
          *   Transitivity is a synchronic coherence constraint.
          *   The Money Pump argument shows *why* transitivity is required.
          *   Adding a policy to stop the pump is like putting a band-aid on a broken leg. The leg (preferences) is still broken.
          *   Also, the policy itself might be arbitrary. Why 1 swap? Why no fees? If the preferences are truly cyclic, the policy is a heuristic to avoid disaster, not a resolution of the preference conflict.
          *   Crucially: If she prefers N to C, and C to S, and S to N, she cannot maximize utility. There is no "best" option. Choosing "whichever is available" implies the preferences don't actually guide choice, rendering them moot or the choice mechanism arbitrary.

  5.  **Develop the "Test Case" for Office Hours:**
      *   Need a case that separates "Structural Axioms" from "Pragmatic Exploitation."
      *   *Idea 1:* A Money Pump that is theoretically possible but practically impossible (e.g., transaction costs are too high, or the agent dies before the pump completes).
          *   *Question:* If a cyclic pref agent dies before being pumped, are they irrational?
      *   *Idea 2:* The "Self-Binding" case (Ulysses contract).
          *   *Scenario:* An agent knows they have cyclic preferences (or weakness of will) and pre-commits.
          *   *Question:* Is the pre-commitment rationalizing the underlying inconsistency, or is the underlying inconsistency still irrational?
      *   *Idea 3 (Best for this context):* **The "Impossible Pump" Case.**
          *   Construct a scenario where the cyclic preferences exist, but external constraints make the pump *physically impossible* (not just a policy).
          *   *Example:* You prefer A > B > C > A. But you are only ever offered one choice in your lifetime.
          *   *Prof's likely answer:* Still irrational because preferences *should* be transitive regardless of opportunity for exploitation.
      *   *Alternative Test:* **The "Representability" Question.**
          *   Ask: "Is irrationality defined by the *possibility* of a Dutch Book, or by the *impossibility* of assigning a Utility Function?"
          *   This cuts to the core of Representation Theorems vs. Pragmatic Arguments.

  6.  **Drafting the Response:**
      *   **Tone:** Academic but accessible, strategic (helping the student ace the midterm).
      *   **Section 1: The Prediction.** High confidence the Prof says "Irrational." Explain why (Axioms > Consequences).
      *   **Section 2: The Underlying Rule.** Identify "Structural Coherence" (Transitivity as a requirement for Utility representation).
      *   **Section 3: Competing Rules.**
          *   Rule 1: Structural Coherence (Prof's likely view).
          *   Rule 2: Pragmatic Invulnerability (The "No Harm, No Foul" view).
          *   Rule 3: Procedural Rationality (The "System works" view).
      *   **Section 4: The Office Hours Question.** Design a question that forces the Prof to choose between Structure and Pragmatics. The "Single-Shot Cyclic Preference" is the cleanest test.

  7.  **Refining the Logic (Self-Correction/Edge Case Check):**
      *   *Wait, does the roommate's policy make the preferences transitive?* No. She still *prefers* N to S, S to C, C to N. The policy just restricts *action*.
      *   *Is there a view where this is rational?* Some behavioral economists might say "ecological rationality." But this is a Decision Theory class focused on MEU coherence. So stick to the normative standard.
      *   *The "Verdicts" analysis:*
          *   Verdict 1 (Money Pump): Standard transitivity argument.
          *   Verdict 2 (Dutch Book): Probabilistic coherence.
          *   Verdict 3 (Diachronic): Conditionalization/Reflection.
          *   Verdict 4 (Dominance): Basic rationality.
          *   Verdict 5 (Info Value): Good's Theorem.
      *   *Common Thread:* All these are *necessary conditions* for being an Expected Utility Maximizer. The roommate fails the Transitivity condition. The policy is irrelevant to the condition.

  8.  **Final Polish:** Ensure the distinction between "Pragmatic Vindication" (the argument style) and "Structural Requirement" (the actual norm) is clear. This is the key conceptual hurdle for the student. The Money Pump *shows* you why transitivity matters, but transitivity matters even if the pump is blocked.

      *Test Case Idea:* "The Hermit." An agent with cyclic preferences who lives on a desert island and never trades. Is she irrational?
