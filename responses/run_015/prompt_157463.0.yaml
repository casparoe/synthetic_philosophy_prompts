      *   **Constraints:** No bibliographies, citations, or references to scholarly editions.

  2.  **Deconstruct the Conceptual Tension:**
      *   *Longue Durée:* The Calcite Shelf, the 400-year cycle, the geology, the climate, the slow rise and fall of water tables. This is the "invisible hand" of history in this context.
      *   *Histoire Événementielle:* Mira's life, her specific project, the political decree to build the canal, the daily labor, the immediate success or failure.
      *   *The Collision:* Mira thinks she can fix the water forever. The Shelf says water moves on its own time. The story needs to show her effort mattering *in the moment* but being contextualized (or swallowed) by the larger cycle.

  3.  **Drafting - Section by Section:**

      *   **Introduction (Setting the Scene & The Shelf):** Establish Velmor, the Calcite Shelf, and the feeling of the slow cycle. Introduce Mira looking at the landscape.
      *   **The Ambition (The Event):** Mira's plan. The canal. The belief in human agency. The year 1823.
      *   **The Process (The Friction):** Building the canal. The resistance of the land. Not just physical resistance, but temporal resistance.
      *   **The Climax/Turning Point:** Water flows. A moment of seeming victory. But hints of the larger cycle persisting.
      *   **Conclusion (Reflection):** The outcome isn't a clear win/loss. It's about the relationship between the quick human life and the slow earth. A Braudelian ending.

  4.  **Developing the Narrative Voice:**
