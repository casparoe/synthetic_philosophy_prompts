      *   *The Water:* It comes, but does it stay?
      *   *The Ending:* She grows old, the water shifts slightly. The cycle continues, but her mark remains as a sediment layer of history.

  6.  **Refining the Braudelian Theme:**
      *   Make sure the 400-year cycle is felt. Maybe mention the grandparents' stories vs. the grandchildren's future.
      *   Mira represents the "event." The Shelf represents the "structure."
      *   Avoid making her look stupid. Her engineering should be sound. The issue is *time*, not competence.
