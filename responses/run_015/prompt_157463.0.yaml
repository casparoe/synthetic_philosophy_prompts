      *   Avoid modern tech jargon; keep it slightly timeless but grounded in the 1823 setting (steam? manual labor? let's keep it vague but industrializing).
      *   Focus on sensory details: the smell of lime, the sound of water, the texture of stone.

  5.  **Drafting - Step-by-Step (Mental or Scratchpad):**
