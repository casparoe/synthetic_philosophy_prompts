      *   *Core Concept:* Does cognition (beliefs, desires, etc.) influence perception?
      *   *Standard Distinction (Strong vs. Weak):*
          *   **Strong Penetration (Direct/Content):** Cognition directly alters the *content* or *phenomenal character* of the perceptual experience itself. (e.g., seeing a green apple as red because you believe it's red). This challenges the modularity of mind (Fodor) and the epistemic role of perception (if perception is biased by belief, it can't justify belief).
          *   **Weak Penetration (Indirect/Attention/Post-Perceptual):** Cognition influences perception *indirectly* (e.g., via attention, eye movement, or post-perceptual judgment) without altering the core perceptual content. Or, it influences early processing but not the conscious experience.
          *   *Alternative Distinction (sometimes used):* Some philosophers distinguish between "diachronic" (long-term learning) vs. "synchronic" (immediate) penetration. However, the Strong/Weak distinction usually hinges on *content/phenomenology* vs. *causal influence/attention*.
      *   *Why it Matters:*
          *   **Epistemology:** If strong penetration is true, perception might lose its status as a neutral justifier of belief (circularity).
          *   **Modularity:** Strong penetration threatens Fodor's informational encapsulation. Weak penetration is often compatible with modularity.
          *   **Dialectic:** Anti-penetrationists often try to explain away apparent cases of strong penetration as cases of weak penetration (e.g., attention shifts, judgment errors) to preserve modularity/epistemic purity.

