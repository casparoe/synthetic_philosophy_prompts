      *   **Core Concept:** The brain (cranium) as a box with "symms" (marbles/neurons) and "symmballs" (clusters of symms/symbols). The causal question: Do symmballs push symms, or is it just symms pushing symms (epiphenomenalism vs. downward causation)?
      *   **Setting:** An artificial Careenium called "The Labyrinth."
      *   **Plot:** A specific symmball named "Regret" is displacing symms in a spiral pattern without a bottom-up trigger. Substrate maintainers argue about causal efficacy vs. anthropomorphism. One technician talks to the symmball.
