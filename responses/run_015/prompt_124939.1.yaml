answer: |-
  Galen Strawson's Basic Argument is a formidable challenge to moral responsibility. It posits that to be truly responsible for an action, one must be responsible for the character that produced it, leading to an infinite regress of self-creation that no finite agent can satisfy. Indeterminism offers no refuge, as actions not determined by character are merely lucky. Let us construct the **Doxastic Basic Argument** in parallel: To be epistemically creditable for a belief (such that it reflects well on you as a knower), you must be responsible for the inferential habits that produced it. But you are not responsible for those habits unless you formed them via prior habits, and so on. Indeterminism fails here too; a belief not settled by evidence-responsive dispositions is doxastic luck, not insight. Thus, no one is ultimately creditable for their beliefs.

  These arguments share a skeletal structure: both demand ultimate authorship of the self to ground a normative status (responsibility or credit), and both rule out luck as a substitute. However, sharing a structure does not guarantee sharing a fate. In contemporary philosophy, the Doxastic Basic Argument is largely viewed as a *reductio* of the demand for ultimate epistemic credit, whereas Strawson's Basic Argument remains a live, contentious threat to moral responsibility. To understand why the arguments diverge in dialectical strength, we must examine the availability of externalist escape routes, the principled asymmetries between the domains, and the efficacy of reflexive regress-stoppers.

  ### 1. The Asymmetry of Escape Routes: Externalism and the Deflationary Charge

  The most immediate divergence lies in the reception of externalism. In epistemology, process reliabilism (championed by Alvin Goldman) effectively neutralizes the Doxastic Basic Argument for many philosophers. The reliabilist argues that knowledge does not require the agent to be creditable for the reliability of their cognitive processes; it requires only that the processes *be* reliable. On this view, the Doxastic Basic Argument fails not because the regress is solvable, but because the premise demanding "credit" is false. Knowledge is a success term, not an achievement term.

  The parallel move in ethics is the "no-credit" compatibilist strategy. Philosophers like Daniel Dennett or P.F. Strawson (in a different mood than Galen) argue that moral responsibility does not require *causa sui* authorship. It requires only that the agent's mechanism be appropriately responsive to reasons and reactive attitudes. However, Galen Strawson anticipates this. He argues that this ethical move is **deflationary**: it redefines "responsibility" to mean "suitable for social management" rather than "worthy of basic desert." It changes the subject from the deep moral accountability that justifies retribution to a superficial notion of agency compatible with determinism.

  Is the same charge available against epistemic externalism? Yes, and it is levied by virtue epistemologists (like Ernest Sosa or Linda Zagzebski). They argue that reliabilism yields "animal knowledge" but misses "reflective knowledge," which requires the belief to be creditable to the agent's competence. However, the dialectical weight differs. In epistemology, the externalist can comfortably concede that "credit" is lost while maintaining that "knowledge" remains. We are willing to say a thermometer or a reliable clairvoyant (in thought experiments) has a form of cognitive success, even if they lack credit.

  In ethics, the concession is costlier. To accept the deflationary move is to admit that no one *deserves* punishment or praise in the basic sense. While some ethicists (like Derk Pereboom) accept this hard incompatibilism, many resist because moral practices (blame, guilt, retribution) seem to presuppose desert in a way that cognitive practices (assertion, inquiry) do not presuppose credit. The epistemic externalist escapes the Doxastic Basic Argument by lowering the stakes of the normative status; the ethical compatibilist attempts to keep the stakes high while lowering the metaphysical requirements, leaving them vulnerable to Strawson's charge that they are not talking about *real* responsibility.

  ### 2. Principled Asymmetry: Success vs. Accountability

  Is this difference in stakes merely pragmatic, or is it principled? There is a strong case for a principled asymmetry between knowledge and responsibility.

  Knowledge is fundamentally a relation between a mind and the world. Its primary value is truth-tracking. While we often value knowledge as an achievement, its core function is representational accuracy. If a belief is true and produced by a reliable process, the functional goal of cognition is met, regardless of whether the agent authored the process. The Doxastic Basic Argument assumes that epistemic *normativity* requires agency, but externalists successfully argue that epistemic normativity is teleological (aimed at truth) rather than deontological (aimed at duty/authorship).

  Moral responsibility, conversely, is fundamentally a relation between agents. Its primary value is accountability. To hold someone responsible is not merely to identify them as the causal source of an outcome (which determinism allows); it is to claim they had the authority to do otherwise in a way that makes sanctions fair. The concept of *desert* is internal to the definition of moral responsibility in a way that *credit* is not internal to knowledge. One can have knowledge without credit (via testimony or reliable instinct), but can one be morally responsible without desert? If the answer is no, then the Basic Argument succeeds in ethics because the concept itself demands the impossible condition (ultimate responsibility). If the answer is yes, then the ethical case collapses into the epistemic one, and compatibilism succeeds.

  However, one might argue the asymmetry is non-principled, rooted in what each field is trying to theorize. Epistemology has naturalized; it seeks to explain how organisms navigate the world. Ethics, particularly retributive justice, retains a theological or quasi-legal structure that demands a "court of ultimate appeal." The differing fortunes of the arguments may simply reflect that epistemologists were more willing to revise their folk concepts than ethicists. If this is the case, the Doxastic Basic Argument is in better shape than it appears: it shows that if we value epistemic *credit* (as virtue epistemologists do) as much as we value moral *desert*, we are equally screwed. The fact that epistemologists abandoned credit suggests they recognized the Doxastic Basic Argument was sound, whereas ethicists cling to desert despite the Basic Argument, suggesting they are in denial.

  ### 3. Reflexive Regress-Stoppers

  Both domains have attempted to stop the regress via reflexivity. In ethics, Harry Frankfurt's hierarchical model suggests an agent is responsible if they act on desires they endorse with higher-order volitions. In epistemology, Sosa's distinction between animal and reflective knowledge suggests that a belief is creditable if it is guided by a perspective that endorses the reliability of the source.

  Strawson's reply to the ethical version is devastating: To be responsible for the action, you must be responsible for the endorsement. If the endorsement flows from your character, you need to be responsible for that character. Reflexivity merely adds a layer; it does not provide a foundation.

  Does reflexivity fare better in the epistemic case? There is a subtle difference. In epistemology, the regress of justification is often considered benign if it is coherentist. If my belief-forming method is endorsed by my meta-beliefs, and those meta-beliefs are produced by the same method, we have a virtuous circle of reliability. Epistemic externalists can argue that as long as the system is self-correcting and reliable, the lack of an *ultimate* foundation doesn't negate credit. The "credit" here is not about metaphysical authorship but about the functional integration of the cognitive system.

  In ethics, reflexivity feels more like an exercise of will. When I endorse a desire, I feel I am *making* a choice. This phenomenological intensity makes the regress feel more vicious. If my endorsement is determined, it feels like a sham. In epistemology, if my meta-belief is determined, it can still be a reliable indicator of truth. The reflexivity gambit stops the regress in epistemology because the goal is systemic reliability; it fails in ethics because the goal is ultimate origination. Thus, reflexivity relocates the regress in ethics but may dissolve it in epistemology, provided we accept that epistemic credit is a function of systemic coherence rather than metaphysical freedom.

  ### Verdict

  The **Doxastic Basic Argument is in worse dialectical shape** than Strawson's Moral Basic Argument. This is not because its logic is flawed, but because the epistemic community has largely accepted the conclusion that ultimate credit is unnecessary for knowledge. Epistemology has successfully naturalized justification, decoupling it from the requirement of *causa sui*. The argument is treated as a powerful reason to adopt externalism, not as a proof that knowledge is impossible.

  Strawson's Moral Basic Argument, by contrast, remains in **better dialectical shape** because the ethical community remains divided on whether to naturalize responsibility. Compatibilists try to have it both ways—retaining the sting of desert without the metaphysics of ultimate responsibility—and Strawson effectively exposes this tension. The argument persists because the intuition that "fair blame requires ultimate control" is more resistant to revision than the intuition that "knowledge requires ultimate control."

  This verdict reveals a profound implication about the moral case: **The difficulty is not really about responsibility per se, but about desert.** If we treat moral responsibility as epistemologists treat knowledge—as a functional status grounded in reasons-responsiveness rather than ultimate authorship—the Basic Argument dissolves. The persistence of the argument shows that our moral practices are committed to a retributive notion of desert that may be metaphysically incoherent. The Doxastic parallel shows that we *can* have a robust normative practice (inquiry and assertion) without ultimate credit. The fact that we struggle to do the same in ethics suggests that the problem lies not in the nature of agency, but in the demanding, perhaps archaic, nature of our moral expectations. We are willing to be knowers without being gods; we are unwilling to be moral agents without being gods. Strawson shows us we cannot be gods; the Doxastic argument shows us we don't need to be.
