answer: |-
  No single principle preserves all your intuitions; the closest consistent framework is Expected Utility Maximization over comprehensive wealth, though it forces you to reclassify some verdicts as suboptimal.

  The precise principle is: **Maximize the expected value of a concave utility function defined over your total lifetime resources, including financial capital, human capital (future earnings), and social capital.** This framework accommodates most of your cases by treating "wealth" broadly and allowing the curvature of the utility function to dictate risk aversion. Your insurance purchase (Case 4) is justified because a concave utility function values preventing a large loss more than the expected monetary gain of retaining the premium, even if the bet has negative expected value. Your refusal to bet against your brother (Case 7) is handled by including the relationship's value in your wealth; losing money there costs more utility than the gain provides. Your hesitation on shaky models (Case 6) is formally treated as parameter uncertainty, where a Bayesian expected utility calculation naturally results in "Fractional Kelly" betting to hedge against estimation error. Your diversification across twenty bets (Case 5) is supported because portfolio theory within this framework accounts for correlation and ruin risk, validating a higher aggregate exposure than single-bet rules suggest.

  However, this principle forces you to drop or modify three specific verdicts. First, you must abandon **geometric growth rate as the fundamental goal**; it is merely the specific outcome of using a logarithmic utility function over an infinite horizon, not a universal law. This means your intuition on the **one-shot versus repeated asymmetry (Case 2)** isn't a fundamental distinction in the math, but rather a reflection that your utility function is more risk-averse than log-utility for single, large-stakes events. Second, your **longshot overbetting (Case 3)** conflicts with standard concave utility; while a 3% bet on a 1000x shot yields positive expected utility, it is mathematically suboptimal compared to the ~1% Kelly recommendation, implying you are either paying a premium for skewness (the "dream" value) or misjudging the probability. Third, you cannot strictly maximize growth while buying insurance; you are explicitly trading growth for stability, which is a utility preference, not a growth optimization.

  Regarding your undecided cases, the principle provides clear answers but requires inputs you haven't defined. For the **capped one-shot bet**, Expected Utility says you should bet the maximum 20% if your utility function is close to log-wealth, but less if you are more risk-averse; since you are unsure, you are effectively uncertain about your own utility curvature, suggesting a conservative fractional bet is prudent. For the **non-money stakes like quitting a job**, the principle transfers directly if you define wealth as "lifetime utility potential"; quitting a stable job for a 10% shot at something better is equivalent to selling a bond to buy a call option on your human capital, and the decision rests on whether the expected utility of the option exceeds the utility of the bond, regardless of whether you can point to a specific dollar number.
