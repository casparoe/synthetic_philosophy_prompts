      *   ZFC has a countable model (Löwenheim-Skolem).
      *   Inside the model, there exists a set $S$ such that the model satisfies "S is uncountable" (i.e., inside the model, there is no function $f: \mathbb{N} \to S$ that is a bijection).
      *   Outside the model, we see the domain of the model is countable, so $S$ (as a subset of the domain) is countable. We can list its elements.
      *   The paradox: How can $S$ be uncountable and countable?
      *   Resolution: The bijection exists outside, but not *inside* the model. The model lacks the function.
      *   Key philosophical point: "Uncountable" is relative to the model. Our own assertion that $\mathbb{R}$ is uncountable might be relative to our own "model" (universe of sets).

