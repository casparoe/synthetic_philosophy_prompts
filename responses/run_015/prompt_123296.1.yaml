  *No function here exists to be enlisted.*
  Yet inside gates the pairing is not shown,
  *No function here exists to be enlisted.*

  *No function here exists to be enlisted.*
  What if our continuum is similarly grown?
  I name them first and second, third on the list.

  *No function here exists to be enlisted.*
  We stand inside where truths are not our own,
  *No function here exists to be enlisted.*
  I name them first and second, third on the list.

  ***

  **Note to the Visiting Philosopher**

  The italic refrain speaks from inside the walled town (the countable model): it truthfully asserts no bijection exists within its bounds. The roman refrain speaks from outside (the metatheory): it enumerates the very same inhabitants. The paradox is not that the town is wrong about its people—all are present—but that the *function* mapping them to numbers exists outside the walls, not inside. Countability is relative to the model.
