      *   *Leo (Knowing-That):* Analytical, theoretical, predictive. He knows the limits of the material. He can calculate stress points. Limitation: Cannot execute. Paralysis by analysis or physical inability.
      *   *The Machine (Encoded Knowing-How):* Repetitive, precise, rigid. It mimics success. Limitation: Brittle. No context awareness. If variables change (humidity, temp), it fails because it doesn't know *why* it's doing what it's doing.

  3.  **Develop the Commission:**
