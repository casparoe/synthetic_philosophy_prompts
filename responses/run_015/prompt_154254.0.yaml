answer: |-
  The furnace roared like a trapped animal, pushing heat against the salt-crusted windows of the workshop. On the bench lay the commission: a double-walled sphere, thin enough to sing when tapped, destined for a collector who cared more about perfection than survival.

  Mara stood at the glory hole, turning the blowpipe. She didn't know the silica content of the batch. She didn't know the annealing curve. She knew the color of the glow. Right now, it was the color of a setting sun, just before the bruise of purple sets in. That was the moment.

  " Ambient temperature is up two degrees," Leo said. He stood by the workbench, a tablet in his hand, his fingers trembling so violently he had to rest the device on the wood to read it. "Humidity is at eighty percent. The density of the air inside the pipe will be different."

  Mara didn't look at him. She watched the gather. "It feels sticky."

  "Viscosity is lower than standard," Leo corrected, though he couldn't hold the pipe himself. If he tried, the tremor would shatter the molten core. "You need to compensate for the sag."

  In the corner, the Analog Recorder hummed. It was a bulky thing of reels, needles, and vacuum tubes, built by their father thirty years ago. It had recorded the air-pressure waveforms and rotational vibrations of Mara's three best pieces. The idea was replication. Pure, unadulterated success stored on magnetic tape.

  "Run the Sequence Four pattern," Mara said. She wiped sweat from her brow with a soot-stained rag. "I need to get the initial bubble uniform."

  Leo nodded and engaged the machine. He connected the output hose to the end of Mara's blowpipe. Mara stepped back, holding the pipe steady, letting the machine breathe for her.

  The reels spun. The needle danced. A mechanical pump pushed air into the pipe, mimicking the exact pressure curve of Mara's masterpiece from 1998. The glass began to swell.

  For ten seconds, it was perfect. The sphere expanded symmetrically. Then, the neck began to droop.

  The machine kept pushing air according to the tape. It didn't know the room was warmer than it had been in 1998. It didn't know that the heat made the glass softer, less able to hold its own weight against the pressure it was demanding. The bottom of the sphere elongated, turning from a sphere into a teardrop.

  "Cut it!" Leo shouted.

  Mara was already moving. She kicked the pedal, severing the air supply. The glass slumped further, ruined. The machine continued to whir, the needle still tracing the successful waveform of a past that didn't exist in this room.

  Leo stared at the ruined gather. "The thermal expansion coefficient of the borosilicate changed. The machine lacks feedback loops. It executed the command without context."

  "It pulled too hard," Mara said, dipping the pipe back into the furnace to reclaim the glass. "It doesn't know when to back off."

  "I can calculate the correction," Leo said, his voice tight. He picked up a pen, but his hand shook, scribbling a jagged line across the paper. He dropped it. "The pressure needs to be reduced by twelve percent during the second inflation phase. But the timing... the timing depends on the cooling rate."

  "I know the timing," Mara said. She pulled the pipe out. The glass was glowing brighter now, reheated.

  "The stress points will concentrate at the equator if you rotate faster than 4 RPM," Leo said, watching her hands. "I can monitor the thermal imaging. I'll tell you when you're approaching the critical threshold."

  "Just watch the color, Leo."

  "The color is subjective. The thermometer is objective."

  "The thermometer is slow."

  Mara began to rotate the pipe. She didn't count RPMs. She felt the weight of the molten glass shifting. She knew that if she stopped turning for even a second, gravity would win. She put her lips to the mouthpiece.

  "Current temp is 1100 Celsius," Leo reported, his eyes on the screen. "You are approaching the softening point. Caution advised."

  Mara blew. She didn't push a specific volume of air. She pushed until she felt the resistance in her cheeks, a specific tension that meant the walls were stretching evenly. She felt the glass thinning through the iron pipe, a vibration that traveled up her arms.

  "Stress increasing," Leo said. "You're pushing the limits of the tensile strength."

  "It's talking to me," Mara muttered.

  "It's silicon dioxide, Mara. It doesn't talk."

  "It sings."

  She spun the pipe. The machine in the corner sat silent, its reels still, its knowledge useless because the world had changed around it. Leo stood with his data, knowing exactly why the glass wanted to break, but powerless to stop it with his own hands.

  The sphere expanded. It was larger than the machine had made it. The room was hotter, the glass was runnier, but Mara blew softer, compensating with a breath that slowed as the walls thinned. She felt the moment the glass wanted to sag, a heaviness in the wrist, and she lifted the pipe slightly, countering gravity with an angle no textbook prescribed.

  "Thermal shock risk high," Leo warned. "The differential between the core and the surface is widening."

  Mara didn't hear him. She was listening to the friction of the shears. She clipped the excess glass. The sound was a clean *tick*.

  She moved the piece to the annealing oven. She didn't set a timer. She watched the glow fade from orange to a dull cherry, then to black. She knew the heat was leaving the material at the right speed because she could feel the radiation on her skin diminishing at a familiar rate.

  She closed the oven door.

  The workshop was silent except for the cooling ticks of the furnace. Leo looked at his tablet, then at the closed oven, then at his shaking hands.

  "Did you meet the specifications?" he asked.

  Mara picked up a rag and wiped the soot from her arms. "It's round. It's thin. It didn't break."

  "The data log shows you deviated from the standard pressure curve by a significant margin."

  "The standard curve was for a cold day," Mara said. She walked over to the machine and turned off the main switch. The hum died. "Tomorrow might be rainy. We'll need something else then."

  Leo looked at the machine, then at his sister. He picked up his tablet and set it down on the bench, away from the heat.

  "I'll check the barometric pressure for tomorrow," he said.

  "Do that," Mara said. "I'll check the glass."
