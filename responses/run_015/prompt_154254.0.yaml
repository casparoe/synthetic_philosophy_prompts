prompt: |-
  write a short story about knowing-how vs knowing-that, but skip the usual bike-riding example everyone regurgitates. instead, set it in a small coastal workshop where a glassblower named Mara can shape these impossibly thin vessels without being able to tell you the melting point of silica or name a single chemical compound — pure knowing-how, zero knowing-that. her brother Leo is teh opposite: he memorized every textbook on material science and thermal dynamics but his hands shake so badly he can't actually blow glass. then there's this old analog machine in the corner that was built to record teh vibrations and air-pressure patterns from successful blows and replay them, so it stores a kind of procedural knowledge in waveforms but has no conceptual grasp at all — if the room gets a few degrees warmer it fails completely because it never "understood" why temperature matters. write the story around one fragile commission where all three have to collaborate, and show exactly where each kind of knowledge breaks down or saves the piece. keep it grounded, no sci-fi, and don't have anyone give a lecture — just let the clash happen through the work itself.
