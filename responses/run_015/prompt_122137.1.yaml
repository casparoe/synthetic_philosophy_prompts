answer: |-
  1. Conceptual Translation

  The core philosophical difficulty lies in distinguishing claims that demand universal obedience (moral principles) from claims that reflect subjective taste (preferences) or distorted self-interest (biases). Principles claim impartial authority; preferences admit subjectivity; biases mimic principles but collapse under scrutiny. Your two checks operationalize this by testing for consistency and universalizability without requiring meta-ethical theory.

  The Asymmetry of Reversal tests for impartiality. It survives simplification because it isolates self-interest: if a rule changes when I become the subject rather than the enforcer, it is likely bias. The Regret Audit tests for universalizability. It survives because moral principles must function systemically; if a rule breaks when everyone adopts it, it is not a principle.

  To ensure usability, we drop nuances regarding the agent's internal intent or the metaphysical source of the value. We do not ask *why* someone holds a view, only whether the view holds structural water. We also drop complex exceptions for "supererogatory" acts; for a housing board, duties are binary: either they bind everyone or they do not. This reduction allows non-specialists to identify structural inconsistencies in fifteen minutes without debating the nature of goodness.

  2. The Procedure

  **Role:** Board Chair (facilitator). **Expertise:** Common sense. **Time:** 15 minutes per case.

  **Step 1: Claim Framing (2 Minutes)**
  *   **Question:** "State the objection as a rule. Does this apply only to you, or to everyone?"
  *   **Sufficient Answer:** A clear sentence (e.g., "No loud music after 8 AM").
  *   **Stop Point:** If the claimant admits, "It's just for me," classify as **Preference Confirmed**. End procedure.

  **Step 2: Asymmetry of Reversal (5 Minutes)**
  *   **Question:** "If roles were swapped tomorrow, would you still accept this rule applying to you?"
  *   **Sufficient Answer:** "Yes, absolutely" or "No, not really."
  *   **Stop Point:** If "No" (or hesitation implies no), classify as **Bias Detected**. The rule serves self-interest, not principle. Document and dismiss.
  *   **Note:** Legitimate particular attachments (e.g., caring for one's own child) may weaken here. If the claimant argues special status, move to Step 3.

  **Step 3: Regret Audit (5 Minutes)**
  *   **Question:** "If every resident adopted this standard in all comparable cases, would the cooperative function better or worse?"
  *   **Sufficient Answer:** "Better/Neutral" or "Worse/Unworkable."
  *   **Stop Point:** If "Worse/Unworkable," classify as **Preference Masquerading as Principle**. The claimant does not actually want universal adoption. End procedure.
  *   **Stop Point:** If "Better," classify as **Principle Claim Validated**.

  **Step 4: Final Adjudication (3 Minutes)**
  *   **Logic:** If Step 3 validates a Principle, but another resident holds a conflicting Validated Principle (e.g., Quiet vs. Religious Expression), declare **Values Dispute — Hand to Board Vote**.
  *   **Sign-off:** Chair signs the classification. If the board overrides the classification, the Chair must document the reason in the minutes.

  **Flow Summary:**
  1. Claim Framing → Preference? → Stop.
  2. Reversal → Fail? → Bias Detected → Stop.
  3. Regret → Fail? → Preference Masquerading → Stop.
  4. Regret → Pass? → Principle → Conflict? → Vote.

  3. Worked Cases

  **Case A: Religious Music vs. Quiet Respect**
  *   **Step 1:** Claimant states: "Everyone should respect quiet on Sunday mornings." (Rule established).
  *   **Step 2 (Reversal):** Claimant confirms they would respect quiet even if they were the music player. (Passes).
  *   **Step 3 (Regret):** Claimant argues universal quiet improves living standards. Neighbor argues universal silence stifles expression. Both pass the Regret Audit individually; both believe universal adoption is good.
  *   **Result:** **Values Dispute — Hand to Board Vote.** Both parties claim valid principles (Quiet vs. Expression). The procedure cannot rank competing valid principles. The board must vote on which principle prioritizes community welfare in this context.

  **Case B: Children and Ground-Floor Units**
  *   **Step 1:** Claimant states: "Families with children should not get ground-floor units to save maintenance costs." (Rule established).
  *   **Step 2 (Reversal):** Chair asks: "If you had young children, would you accept this ban?" Claimant hesitates or says, "It's different for me."
  *   **Result:** **Bias Detected.** The Asymmetry of Reversal fails. The claimant exempts themselves from the hardship they impose on others. The argument about maintenance costs is a pretext for exclusion. The board rejects the objection immediately.

  **Case C: Pets and Collective Cleanliness**
  *   **Step 1:** Claimant states: "Pets violate the moral principle of collective cleanliness. No pets allowed."
  *   **Step 2 (Reversal):** Claimant insists they would accept the ban even if they wanted a pet. (Passes).
  *   **Step 3 (Regret):** Chair asks: "If every cooperative banned pets for cleanliness, would it function better?" Claimant says "Yes." However, the Board observes that "cleanliness" is being defined so strictly that it excludes normal human companionship, creating a sterile environment. Upon probing, the claimant admits they would make exceptions for service animals or specific breeds, contradicting the universal rule.
  *   **Result:** **Bias Detected.** Although the claimant passed Reversal verbally, the Regret Audit reveals the rule cannot be consistently universalized without hidden exceptions. The emotional investment and history do not protect the claim from being a bias disguised as hygiene. The board flags this as a bias against pet owners.

  4. Limits and Honest Misfires

  This procedure is a sieve, not a scale. It catches structural inconsistencies but cannot measure the weight of competing values. First, hidden biases can survive both checks if the claimant is a skilled self-deceiver. A resident might genuinely believe their prejudice is universal law. The procedure relies on honest answers; it cannot detect lying.

  Second, the Regret Audit risks mislabeling legitimate minority cultural practices as biases. If a practice relies on uniqueness (e.g., a specific religious ritual), universalizing it might seem absurd, yet the practice is morally protected. The board must recognize that some values are not meant to be universal standards but protected exceptions.

  Third, the Asymmetry of Reversal may unfairly penalize legitimate particular attachments. Parents caring more for their own children than neighbors' children is morally acceptable but fails strict reversal. The board must allow a "special duty" exception where care obligations are recognized.

  Finally, Step 4 is a judgment call dressed as a rule. Deciding whether two validated principles conflict or merely inconvenience each other requires human wisdom. The checklist identifies distortions; it does not resolve tragic choices between genuine goods.

  5. Implementation Note

  Run this procedure at the start of every monthly dispute adjudication. The Board Chair must keep a minimal log containing: the case ID, the classification result (Bias, Preference, or Values Dispute), and the Chair's signature. If the board votes to override the procedure's classification (e.g., accepting a claim flagged as Bias), the Chair must document the specific justification in the meeting minutes. This audit trail ensures the tool is used consistently while preserving the board's ultimate authority to exercise mercy or context-sensitive judgment when the checklist proves too rigid.
