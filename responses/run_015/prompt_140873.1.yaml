          8.  Seminar Bias warning.

      *   *Correction on Aumann:* You got the theorem right mathematically. It's the application that's tricky.
      *   *Settled vs. Contested:* Math is settled. CPA is contested. Logical omniscience is contested. Applicability to humans is contested.
      *   *The Principle:* Let's call it the **Principle of Feasible Meta-Transparency**. It says disagreement is irrational only if the agents *could* have resolved the source of divergence given their cognitive limits and the transparency of their evidence structures.
      *   *Mapping:*
