answer: |-
  # Q&A Prep Sheet: Frame-Relative Accuracy

  **Context:** Departmental Colloquium (30 attendees).
  **Goal:** Survive the 15-minute question period with credibility intact.
  **Strategy:** Pre-empt scope objections, defend the technical core (Refinement), and manage the philosophical interpretation (Weightings).

  ### Pre-emptive Concessions (First 2 Minutes of Talk)
  *Insert these into your concluding remarks before opening the floor. This disarms two likely lines of attack by framing them as scope limitations rather than oversights.*

  1.  **To the Verisimilitude/PhilSci 1 Crowd:** "I want to be clear that I am not arguing accuracy is the *only* epistemic value. I know scientists use false models for explanatory power. My claim is narrower: accuracy is the constitutive norm of *credence*, even if other values govern theory choice."
      *   **Why:** Prevents the "false models are useful" objection from derailing the talk as a misunderstanding of scope.
  2.  **To the Social Epistemologist:** "This framework is structural, not procedural. It explains why disagreement persists under shared evidence, but it does not offer a decision procedure for resolving it in real-time."
      *   **Why:** Prevents the "this gives no guidance" objection. You are selling an explanation of rationality, not a handbook.

  ---

  ### The Objections (Ordered by Likelihood $\times$ Damage)

  #### 1. The Advisor's Challenge (Weightings)
  **Who:** Your Advisor (Impermissivist).
  **The Objection:** "You say the weighting over admissible frames is constrained but not fixed by evidence. But if it's not fixed, what stops an agent from weighting the frame that makes their current credence look best? You haven't grounded permissivism in evidence; you've just smuggled subjectivism into the weighting function. If the weighting is rationally unconstrained, isn't this just voluntarism?"
  **The Reply (2 mins):** "That's the crucial constraint. The weighting isn't free; it's constrained by *monotonicity* and *evidential support*. You cannot weight a frame higher simply because it favors your credence; you can only weight it based on how well the evidence supports that *granularity*. Evidence supports distinctions, not preferences. If the evidence supports 'color' and 'size' but not their correlation, you cannot weight the cross-classified frame higher than the marginal frames, regardless of your credence. The permissiveness comes from the evidence *underdetermining* the importance of distinctions, not from the agent choosing weights to suit themselves."
  **Soft Spot:** This borders on question-begging. You are asserting that evidence constrains weighting without a formal rule for *how*. A hostile listener might say, "Why can't I value the color distinction more than the size distinction without evidence?"
  **Strategy:** **Reply.** Do not concede. This is the philosophical heart of the view.

  #### 2. The Chair's Challenge (Relocation)
  **Who:** The Chair (Convinced Uniqueness Theorist).
  **The Objection:** "Granting you the framework, what have you actually gained? You say permissivism arises because frames aren't unique. But a Uniqueness theorist will just say the evidence *does* determine the unique correct frame, and you've merely relocated the permissivism from the credence to the frame selection. Why should I care about a theory that just pushes the indeterminacy one level up?"
  **The Reply (2 mins):** "Because it changes the *locus* of the debate. Uniqueness theories struggle to explain why equally rational agents with the same evidence disagree. If the indeterminacy is in the frame, we can explain disagreement without accusing one party of irrationality. Even if you believe a unique frame exists *metaphysically*, my framework models the *epistemic situation* of agents who cannot access it. It offers you an error theory for permissivism: it looks like permissivism because agents are rationally operating over different admissible frames."
  **Soft Spot:** You are conceding that Uniqueness might be metaphysically true.
  **Strategy:** **Reply.** This is your pitch to the Chair. A "win" here is her admitting this explains the *phenomenology* of disagreement even if she rejects the ontology.

  #### 3. The Decision Theorist's Challenge (Hierarchical Bayesianism)
  **Who:** The Decision Theorist.
  **The Objection:** "You're averaging inaccuracy over a family of frames with a weighting. That's mathematically identical to a Hierarchical Bayesian model where the 'hyper-parameter' is the frame. Why do I need 'frame-relative accuracy' instead of just saying agents have a prior over frames? You're adding metaphysical baggage to what looks like standard expected utility minimization."
  **The Reply (2 mins):** "The difference is normative. In a hierarchical model, the prior over frames is a subjective degree of belief. In my framework, the 'weighting' is a structural feature of the evidence's admissibility conditions. I'm not saying agents *believe* a frame is likely; I'm saying the evidence *permits* that frame to count towards accuracy. This blocks the 'arbitrary prior' objection: you can't just assign a prior to any frame, only admissible ones. It's a constraint on the decision space, not a parameter within it."
  **Soft Spot:** Mathematically, they are isomorphic. You are relying on a normative distinction that might look like semantics.
  **Strategy:** **Reply.** Essential for maintaining the "Accuracy-First" branding.

  #### 4. The Technical Collapse (Refinement)
  **Who:** Formal Epistemologist 1 or 2.
  **The Objection:** "Your Main Lemma relies on frames being incomparable. But if I have two admissible frames, why isn't their common refinement also admissible? If the refinement is always admissible, I can keep refining until I hit the finest partition. If the finest partition is admissible, uniqueness holds relative to it, and your permissivism disappears. What blocks the refinement?"
  **The Reply (2 mins):** "The admissibility condition: a frame must draw *no distinction the evidence gives no support for*. If evidence supports 'Color' and supports 'Size' but is silent on their correlation, the cross-classified frame (Color $\times$ Size) draws a distinction (the correlation) that the evidence does not support. Therefore, the refinement is *inadmissible*. This is the engine of the view: evidence can be separable. If you allow free refinement, you assume evidence is always conjunctive, which begs the question against the permissivist."
  **Soft Spot:** **LOAD-BEARING.** If this fails, the math collapses. You must be precise here.
  **Strategy:** **Reply.** This is the single most important technical defense. (See Load-Bearing Analysis below).

  #### 5. The Imprecise Probabilities Challenge
  **Who:** Formal Epistemologist 2 (Imprecise Credence).
  **The Objection:** "You have a family of frames and a range of weightings. The output is a range of permissible credences. This looks exactly like a Credal Set. Why are you building new machinery to describe a credal set? What can you do with 'frames' that I can't do with a set of probability functions?"
  **The Reply (2 mins):** "A credal set represents uncertainty about the *world* or the *probability*. My framework represents uncertainty about the *question*. In a credal set, two functions might disagree on $P(A)$. In my framework, two agents might agree on $P(A)$ but disagree on whether $A$ is the right cell to measure accuracy against. It explains *why* the set is wide: it's wide because the evidence is coarse, not because the agent is indecisive. It links the size of the permissible set to the structure of the evidence, which standard imprecise probability doesn't do."
  **Soft Spot:** Functionally, the output is similar. You are selling the *explanation*, not the output.
  **Strategy:** **Reply.** Distinguish the *source* of imprecision.

  #### 6. The Model Selection Challenge (Scale)
  **Who:** PhilSci 2 (Coarse-graining).
  **The Objection:** "In multiscale modeling, we choose a scale based on computational cost or predictive utility, not just evidence. Your weighting constraint says 'don't increase weight as frames get finer.' But sometimes finer frames are better for prediction. How does your apparatus tell a scientist when to choose a coarse frame versus a fine one?"
  **The Reply (2 mins):** "It doesn't, and that's by design. I'm modeling *epistemic rationality*, not *pragmatic utility*. If a finer frame is pragmatically useful but evidentially unsupported, my theory says using it incurs an accuracy cost (or rather, doesn't gain accuracy credit). This predicts a tension: scientists might be pragmatically rational to use fine-grained models while being epistemically 'permissive' about their accuracy claims. I'm isolating the epistemic norm."
  **Soft Spot:** Scientists care about pragmatic utility. Separating them cleanly is hard.
  **Strategy:** **Shrink.** Concede this is about epistemic norms, not all-things-considered model choice.

  #### 7. The Scoring Rule Challenge
  **Who:** Formal Epistemologist 1.
  **The Objection:** "Your Main Lemma uses squared-distance (Brier). If I use Log Loss, does the tie still hold? If your result depends on the scoring rule, then the permissivism is just an artifact of choosing Brier."
  **The Reply (2 mins):** "The lemma holds for any *strictly proper* scoring rule that is additive over the partition cells. The core insight is about marginals, not the specific distance metric. However, I use Brier for transparency. If you can show a strictly proper rule where agreement on marginals doesn't imply equal expected score, I'd welcome that counter-example, but the structure of the frame-relative score protects the result across the standard class."
  **Soft Spot:** You might not have proven this for *all* proper rules.
  **Strategy:** **Reply.** Stand firm on "strictly proper," but be ready to check the math later.

  #### 8. The Guidance Challenge
  **Who:** Social Epistemologist.
  **The Objection:** "Two peers disagree. You say they might be using different admissible frames. So what? Do they merge? Do they split? This gives me no advice on what to do in a real disagreement."
  **The Reply (2 mins):** "It tells you that conciliation isn't always required. If their disagreement stems from using different *admissible* frames, they don't need to converge on a single credence. They need to recognize the frame-relativity. The guidance is: check the frames, not just the numbers. If the frames are both admissible, the disagreement is rational. That *is* guidance: it stops you from demanding convergence where evidence doesn't support it."
  **Soft Spot:** It's negative guidance (don't converge) rather than positive (do X).
  **Strategy:** **Shrink.** Reiterate this explains the *normative status* of the disagreement, not the resolution.

  ---

  ### Load-Bearing Analysis

  **The Single Reply That Must Land:**
  **Objection #4 (The Technical Collapse/Refinement).**
  **Reason:** This is the mathematical gatekeeper. If the common refinement of two admissible frames is *always* admissible, then the set of admissible frames contains a unique finest partition (the intersection of all partitions). If the finest partition is admissible, then "agreement on marginals of all admissible frames" entails "agreement on the finest frame," which entails "agreement everywhere." **Uniqueness returns.** Your Main Lemma becomes false, and the theory collapses into standard Accuracy-First Uniqueness. You can survive the Advisor's weighting objection by calling it "structured permissivism," but you cannot survive the Refinement objection without abandoning the core result.

  **The Advisor's Objection (Weightings):**
  **Severity:** **Critical.** Take her 100% seriously.
  **Why:** While Refinement is the *technical* load-bearing point, the Weighting objection is the *dialectical* load-bearing point. If the weightings are unconstrained, the room will dismiss the view as "subjectivism in disguise." If they are fully constrained, it's Uniqueness. You must walk the tightrope: constrained enough to be rational, loose enough to be permissive.
  **Genuine Win:** If the Advisor concedes that *even if* weightings are somewhat underdetermined, the *monotonicity constraint* prevents arbitrary voluntarism, you have survived. You don't need her to become a permissivist; you need her to admit the weighting isn't *merely* subjective.

  **What Counts as a "Genuine Win" for a Hostile Audience Member:**
  For the **Chair (Uniqueness Theorist)**: A win is not her agreeing with you. A win is her saying: *"I still believe evidence determines a unique frame, but I grant that your framework correctly models why rational agents act as if it doesn't."* This validates your work as a useful "error theory" or "phenomenological model" even if she rejects the metaphysics.

  **Objections to Answer by Conceding/Shrinking:**
  1.  **PhilSci 1 (Verisimilitude):** Concede accuracy isn't the only value. Shrink claim to "norm of credence."
  2.  **Social Epi (Guidance):** Concede this doesn't solve disagreement. Shrink claim to "explains rationality of persistent disagreement."
  *Reason:* Fighting these makes you look like you don't understand the limits of formal epistemology. Conceding them makes you look reasonable and lets you focus on the formal core.

