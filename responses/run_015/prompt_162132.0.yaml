  *(Refining the "Most Damaging Disanalogy")*: Is it the goals? Or the substrate continuity? If I copy a brain, is it the same mind? If I spin up agents, is it the same swarm? The *teleology* (ends) is the strongest argument against moral patienthood because moral patients need *interests*. A system with no endogenous interests cannot be harmed in a morally relevant way.

