      *   **Identify the Pivot Point:** Step (5) is the culprit. It smuggles in Cartesian skepticism via the back door of "reflective stability."
      *   **Diagnose the Equivocation:**
          *   *Type 1: Truth vs. Justification.* In the Lottery, the *payoff* (analogous to truth/success) is causally linked to the choice. In Belief, the *truth* is not linked to the holding. Step (4) blurs this, Step (5) exploits it by switching to justification.
          *   *Type 2: Actual vs. Counterfactual.* The Lottery defeat is actual (if you desire, you lose). The Skeptical defeat is counterfactual (if you were a brain in a vat, you'd be wrong). Principle (3) doesn't specify modal scope.
