          *   Rule 3: Replace EEE with U. (Classic: Replace III with U).
          *   Rule 4: Delete UU. (Classic: Delete UU).
      *   *The Invariant:* In the classic MIU system, the number of I's is the key. Start with 1 I. Doubling multiplies I's by 2. Replacing 3 I's with U subtracts 3. The goal is 0 I's.
      *   *Math:* Start = 1. Operations: $x \to 2x$ or $x \to x-3$. Can we reach 0 (or a multiple of 3) from 1?
      *   *Modulo Arithmetic:* $1 \pmod 3$. Doubling: $2 \times 1 = 2 \pmod 3$. $2 \times 2 = 4 = 1 \pmod 3$. So doubling toggles between 1 and 2 mod 3. Subtracting 3 doesn't change the value mod 3. So you can never reach $0 \pmod 3$.
      *   *App Variation:* The prompt says ME to MU. Rules are analogous (E instead of I). Start: ME (1 E). Target: MU (0 E's).
      *   *Conclusion:* The user's math is correct. It is impossible within the formal system.

