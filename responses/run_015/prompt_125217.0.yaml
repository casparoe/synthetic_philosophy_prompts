          *   In Cooling-off: The signature at the door is the akratic act (succumbing to pressure). The cancellation is the return to rational agency.
          *   In Retirement: The potential future spending is the akratic act. The pre-commitment is the rational plan.
          *   *Crucial Nuance:* The "Present Self" in retirement savings is *not* the impulsive self. It is the *planning* self. The "Present Self" in door-to-door sales *is* the impulsive self.
          *   So, the distinction isn't Present vs. Future. It's **Reflective vs. Situational**.
      *   **Contradiction Check:**
          *   Is there a contradiction regarding the Present Self's authority?
          *   If "Present Self" means "Self at t1":
              *   Case 1 (Sales): t1 contract is voidable by t2.
              *   Case 2 (Retirement): t1 contract binds t2.
          *   This looks contradictory *unless* we qualify the *quality* of agency at t1.
          *   In Sales, t1 agency is compromised (surprise, pressure).
          *   In Retirement, t1 agency is enhanced (deliberation, no immediate cost).
          *   Therefore, no contradiction if the theory is **State-Dependent Authority**.
      *   **Moral Responsibility:**
          *   If the "Hot" self isn't fully authoritative, are they responsible?
          *   Law says: No penalty for cooling-off (no responsibility for the "mistake").
          *   Retirement: Responsibility is shifted to the Planner. The Doer is managed.
      *   **Conclusion:** They rest on a **Hierarchical Model of Agency** (reflective preferences trump impulsive ones), not a simple Temporal Model. They are coherent under a specific view of rationality that distinguishes between "mere desires" and "considered judgments."

  6.  **Refining the Philosophy:**

      *   *Harry Frankfurt:* Second-order volitions. The "Planner" identifies with the savings goal. The "Doorstep Buyer" may not identify with the purchase upon reflection.
      *   *Jon Elster:* Ulysses contracts. Retirement is a Ulysses contract. Cooling-off is an anti-Ulysses contract (preventing a binding made under duress).
      *   *Thomas Schelling:* Self-command.
      *   *Christine Korsgaard:* Constitutive principles of agency.
      *   *Key Distinction:* **Endorsement.**
          *   Retirement: Present self *endorses* the future constraint.
          *   Cooling-off: Future self *withholds endorsement* of the past commitment.
      *   *Necessary vs. Compatible:*
          *   Necessary: Time-inconsistency exists. Some states are more "authoritative" than others.
          *   Compatible (but not necessary): That the "Cool" self is always morally superior. (Maybe sometimes the "Hot" self knows something the "Cool" self forgets? Unlikely in these legal contexts).
          *   Necessary: The law/policy acts as a surrogate for the agent's own reflective capacity.

  7.  **Structuring the Response:**

      *   **Introduction:** Define the tension (Future vetoes Present vs. Present binds Future). State the thesis: They are coherent under a **Hierarchical/Reflective Endorsement Model**, not a simple Temporal Model.
      *   **Section 1: The Implicit Theory of Agency.** Diachronic unity vs. sequential selves. Rejection of revealed preference.
