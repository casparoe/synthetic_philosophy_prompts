      *   **Core Subject:** Consumer-protection "cooling-off" periods vs. Behavioral-design retirement savings (e.g., Save More Tomorrow).
      *   **Key Mechanism:** Both involve time, self-binding, and preference reversal.
          *   Cooling-off: Protects the *future* self from the *present* self's impulsive commitment (signed at home).
          *   Retirement Savings: Empowers the *present* self to bind the *future* self (via future escalations) to overcome the *future* self's spending temptation.
      *   **Philosophical Questions:**
          *   What theory of diachronic agency and moral responsibility do they presuppose?
          *   Do they assume hyperbolic discounting is rationally defective?
          *   Or do they use a "split-authority" model (only the "cooler" stage has standing)?
          *   Task: Reconstruct implicit commitments, distinguish necessary vs. compatible claims, and determine if a single coherent account of weakness of will (akrasia) justifies both, or if they rest on contradictory views of the present self's authority.

  2.  **Analyze the Two Practices:**

      *   **Practice A: Cooling-off Periods (Right of Withdrawal).**
          *   *Scenario:* Salesperson at door. High pressure. Immediate signature.
          *   *Problem:* Present self is vulnerable, emotional, or misinformed.
          *   *Solution:* Future self (a few days later) can veto the Present self's contract.
          *   *Normative Stance:* The Present self's commitment is *defeasible*. The Future self's reflection is privileged.
          *   *View of Agency:* The Present self is potentially compromised (duress, cognitive overload). The Future self is the "true" agent.

      *   **Practice B: Retirement Savings (Save More Tomorrow/SMarT).**
          *   *Scenario:* Employee signs up now to save more *later* (when pay rises).
          *   *Problem:* Present self wants to save, but Future self will feel the pain of reduced take-home pay and quit.
          *   *Solution:* Present self binds Future self. Future self cannot easily opt out (inertia/default effects).
          *   *Normative Stance:* The Present self's plan is *privileged*. The Future self's temptation is bypassed.
          *   *View of Agency:* The Present self is the "planner." The Future self is the "doer" prone to weakness.

  3.  **Identify the Tension:**

      *   Cooling-off: Future Self > Present Self. (Protect Future from Present).
      *   Retirement: Present Self > Future Self. (Protect Plan from Future).
      *   *Apparent Contradiction:* Which self has authority?
      *   *Resolution:* It depends on the *state* of the self (Hot vs. Cold, Impulsive vs. Deliberative).

  4.  **Philosophical Frameworks:**

      *   **Hyperbolic Discounting:** Preferences change over time inconsistent with exponential discounting. (Prefer $100 now over $110 tomorrow, but prefer $110 in 31 days over $100 in 30 days).
      *   **Dual-Self Models (Thaler & Shefrin):** Planner vs. Doer.
      *   **Diachronic Agency:** How does personal identity persist over time? Are we a sequence of selves or one enduring agent?
      *   **Rational Defectiveness:** Is the impulse irrational? Or just a different preference?
      *   **Libertarian Paternalism (Sunstein & Thaler):** Nudging. Preserves freedom of choice but steers toward "better" outcomes.

  5.  **Drafting the Argument - Step-by-Step:**

      *   **Introduction:** Acknowledge the apparent symmetry/asymmetry. Both address time-inconsistency but in opposite directions.
      *   **Reconstructing Implicit Commitments:**
          *   Both reject the standard economic view of stable preferences (Homo Economicus).
          *   Both accept that context (home sales vs. retirement planning) triggers different cognitive modes.
          *   *Cooling-off:* Assumes the "Home" context induces a "Hot" state (pressure, surprise). The "Cool" state (later, at home alone) is authoritative.
          *   *Retirement:* Assumes the "Enrollment" context is "Cool" (deliberative). The "Payday" context is "Hot" (spending temptation). The "Cool" state binds the "Hot" state.
          *   *Commonality:* Both privilege the **Deliberative/Cool** self over the **Impulsive/Hot** self.
      *   **Addressing the "Split-Authority" Question:**
          *   Do they say hyperbolic preferences are *irrational*? Not necessarily morally irrational, but instrumentally defective for long-term welfare.
          *   Do they use a split-authority model? Yes, but not based on *time* (Present vs. Future) per se, but on *cognitive state* (Reflective vs. Impulsive).
          *   *Correction:* It's not that *only* the cooler stage has standing. It's that the cooler stage has *veto* power (cooling-off) or *pre-commitment* power (retirement).
      *   **Weakness of Will (Akrasia):**
