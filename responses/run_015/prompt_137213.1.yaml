answer: |-
  Here is the decision procedure, designed to be run in five minutes with no external research, followed by the application to your three cases.

  ### The Guest's Five-Minute Filter

  This procedure is not about finding the "moral truth." It is about managing risk, respect, and responsibility while you are a dependent guest. It prioritizes the safety of your placement and the reputation of your host over your personal preference.

  **Step 1: The Hard Wall (Law, Safety, and School Rule)**
  Is this action illegal, physically dangerous, or explicitly forbidden by your home school's code of conduct?
  *   **Yes:** **STOP.** Do not do it. (Output: *Decline & Explain*).
  *   **No:** Proceed to Step 2.
  *   *[GUESS WARNING]:* You are guessing here about "danger." You have no local data. If you feel unsafe, treat it as "Yes."

  **Step 2: The Host Cost (Social Capital)**
  If you do not follow this convention, will your host family look bad to their neighbours, friends, or community? Will they have to explain or apologize for you?
  *   **Yes:** **FOLLOW IT.** You are a guest in their home; their social standing is the rent you pay. (Output: *Follow, but you may privately disagree*).
  *   **No:** Proceed to Step 3.
  *   *[GUESS WARNING]:* You are guessing their social standing. You cannot know this for sure. Ask them: "Does it bother you if I...?" If they hesitate, the answer is Yes.

  **Step 3: The Coordination Check (Brittleness)**
  Does this convention rely on everyone doing it to work? (e.g., a queue, silence in a library, driving on a specific side). If you opt out, does the system break for someone else immediately?
  *   **Yes:** **FOLLOW IT.** Your non-compliance harms a stranger's time or safety. (Output: *Follow*).
  *   **No:** Proceed to Step 4.
  *   *[GUESS WARNING]:* You are guessing the mechanics of the system. A queue looks brittle; a tipping culture might not be. If unsure, assume it is brittle.

  **Step 4: The Clean Hands Check (Corruption vs. Survival)**
  Is this a payment or action required to get a service you are legally entitled to (a visa, a medical bed), or is it to get *better/faster* service than others?
  *   **Entitled Service (Survival):** This is a "Clean Hands" conflict. Proceed to Step 5.
  *   **Better Service (Privilege):** **DO NOT DO IT.** You are entrenching inequality for convenience. (Output: *Decline & Explain*).
  *   *[GUESS WARNING]:* You are guessing whether you are "entitled." In many places, entitlement is theoretical.

  **Step 5: The Values Call (The Stop Point)**
  If you have reached here, you are in a conflict between "Survival" (Step 4) and "Hard Wall" (Step 1) or "Host Cost" (Step 2).
  *   **Instruction:** This procedure cannot solve this. You must contact the programme coordinator.
  *   **Output:** *Values Call / Escalate.*

  ***

  ### Application to Your Three Cases

  Here is what the Filter returns when run on your specific examples.

  #### Case One: Tipping (Not expected, host says it shows off)
  *   **Step 1 (Hard Wall):** Not illegal or dangerous. School rules likely silent. -> *Pass.*
  *   **Step 2 (Host Cost):** Host parents explicitly state it makes *them* look bad (showing off/insulting local norms). -> **STOP.**
  *   **Result:** **FOLLOW IT (Do Not Tip).**
  *   **Reasoning:** Your desire to be generous is outweighed by the host's social cost. In this context, tipping is not kindness; it is a social signal that reflects on the household.
  *   **The Unwanted Answer:** I know you want to teach students that generosity is a virtue. This procedure tells them that **generosity is not a universal virtue; it is a local custom.** If the custom rejects it, keeping your money in your pocket is the polite act. Tipping here is not "nice"; it is culturally aggressive.

  #### Case Two: Jaywalking (Everyone does it, police target foreigners)
  *   **Step 1 (Hard Wall):** It is technically illegal (crossing against light). Police fine foreigners. -> **STOP.**
  *   **Result:** **FOLLOW IT (Wait for the Green).**
  *   **Reasoning:** Even though locals break the rule, the enforcement is asymmetric. As a foreigner, you do not have the social immunity the locals have.
  *   **The Guess:** You are guessing that the police *will* target you. But given the prompt says they "occasionally fine foreigners and never locals," the risk assessment is clear.
  *   **Instruction to Student:** "Wait for the light. Not because the rule is moral, but because you are not a local. You do not have the same immunity." This is cynical, but it protects the placement.

  #### Case Three: The Bribe (Visa processing, School forbids it)
  *   **Step 1 (Hard Wall):** School rules forbid it. -> **STOP.**
  *   **Result:** **DECLINE & EXPLAIN.**
  *   **Reasoning:** The School Rule acts as a "Hard Wall" in Step 1. It overrides the local convention.
  *   **The Conflict:** However, Step 4 (Clean Hands) identifies this as a "Survival" issue (entitled service: residence registration).
  *   **Procedure Output:** **Values Call / Escalate.**
  *   **Why:** Step 1 says "No." Step 4 says "This is a survival necessity." The procedure breaks here.
  *   **Plain English for the Student:** "This is not a decision for you. This is a conflict between local reality and school rules. You must tell the coordinator immediately. Do not pay, but do not assume the problem will solve itself. We [the school] must intervene to secure your papers without you breaking the code."
  *   **Note:** If you (the coordinator) are not available to intervene, the procedure fails. In a vacuum, **Step 1 wins.** The student cannot pay. The risk to the programme is on the *school* to manage, not the student to buy their way out of.

  ***

  ### Where the Procedure is Guessing (The "Clothing")

  You asked me to flag where steps are guesses wearing the clothing of logic. Here they are, for your own awareness when explaining this to parents:

  1.  **Step 2 (Host Cost):** The procedure assumes the student can accurately gauge if the host is embarrassed. Teenagers are often bad at reading adult social anxiety. The step treats the student's perception as fact. *Mitigation:* Tell students to ask explicitly ("Does this bother you?").
  2.  **Step 3 (Coordination):** The procedure assumes a queue is "brittle" and shoe removal is not. But in some cultures, shoe removal is a hygiene coordination game (dirt on floors), and queues are loose suggestions. The student is guessing the *function* of the norm based on its *form*.
  3.  **Step 1 (Safety/Law):** The procedure treats "School Rule" as equivalent to "Law." Ethically, they are not. But for a 16-year-old abroad, a school rule violation that gets them sent home is functionally the same as a deportation. The procedure conflates *moral* wrong with *administrative* expulsion.

  ### The One-Page Student Version (Draft)

  **The Guest's Checklist: What Do I Do?**

  1.  **Is it banned?** (Law, Safety, or School Rule).
      *   YES → **DON'T DO IT.** Tell your host why.
      *   NO → Go to 2.
  2.  **Will my host get in trouble or look bad?**
      *   YES → **DO IT.** You are in their house. Their reputation comes first.
      *   NO → Go to 3.
  3.  **Does skipping this hurt someone else directly?** (Cutting a line, making a mess).
      *   YES → **DO IT.** Don't be the person who breaks the system.
      *   NO → Go to 4.
  4.  **Is this a payment to get something I'm supposed to get for free?** (Visas, Doctors, Officials).
      *   YES → **STOP.** Call the Coordinator. Do not pay.
      *   NO → **YOUR CHOICE.** (But ask yourself: am I just being difficult?)

  **Remember:** You are a guest. Being "right" is less important than being welcome. When in doubt, ask your host family: "How do you handle this?"
