answer: |-
  In the climate-controlled conservation studio of the Metropolitan Museum, technical analysis reveals that the critical azure underlayer of a finished canvas by the deceased master Elara Vance was secretly replaced five years after her death by her studio assistant, Julian, who used Vance's personal brushes, followed her exact documented glazing technique, and applied a modern synthetic pigment chemically indistinguishable from the original lapis lazuli mixture in all perceptible respects, all without Vance's prior authorization or awareness during her life. The painting hangs today indistinguishable to the naked eye or standard spectroscopy from its pre-degradation state, possessing the exact structural properties Vance intended, but the causal chain of its current physical constitution terminates not with Vance's living agency, but with Julian's unauthorized posthumous intervention.

  Experiential structuralism verdicts the work as aesthetically successful because the perceptual properties available to the viewer are identical to the original, securing the intended aesthetic experience regardless of history. Causal-provenance essentialism verdicts the work as compromised because the object's history includes an unauthorized break in the generative agency linking the artwork to the artist, rendering the current object a distinct, less valuable entity despite its appearance. The feature doing the work is **temporal-authorial discontinuity embedded within complete physical and procedural continuity**; standard forgery cases typically involve physical or procedural discontinuity (different hands or detectable materials), whereas here the only rupture is the artist's death and lack of consent. Removing this feature collapses the divergence: if the intervention were authorized (removing the discontinuity), essentialism would accept the causal chain as extended, aligning its verdict with structuralism's positive assessment. Finally, an essentialist could attack the case's negative implication by arguing that the assistant's use of the artist's own tools and established techniques constitutes a form of implicit authorized posthumous practice, which extends rather than breaks the relevant causal chain, thereby preserving the work's authenticity within the essentialist framework.
