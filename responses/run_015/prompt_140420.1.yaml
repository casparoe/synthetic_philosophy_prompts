      *   **(b)(ii) Burge's Arthritis Case:** Compare with Putnam. Man says "arthritis in thigh". Community usage restricts "arthritis" to joints. Does "arthritis" refer to the thigh condition? Is the belief true? Is this the same kind of case as Putnam's? (Crucial distinction: Putnam = natural kinds/environment; Burge = social externalism/expert usage within community).

