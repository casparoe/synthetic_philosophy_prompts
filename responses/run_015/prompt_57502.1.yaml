answer: |-
  ### The Spec: Karma as Moral Desert

  To function as a genuine ethics of desert rather than a mythic theodicy, a Karma theory must satisfy the following requirements.

  **1. The Proportionality Constraint**
  *   **Case:** The Prosperous Tyrant. A dictator lives in luxury and dies peacefully.
  *   **Requirement:** Moral valence of action must map strictly to valence of outcome. Evil must incur a cost; good must yield a dividend.
  *   **Status:** **Non-negotiable.** Without this, it is not desert; it is randomness.

  **2. The Intentionality Distinction**
  *   **Case:** The Clumsy Surgeon vs. The Poisoner. Both cause death; one via error, one via malice.
  *   **Requirement:** Karmic weight must attach to *volition*, not merely causal outcome.
  *   **Status:** **Non-negotiable.** Desert requires agency; causality does not.

  **3. The Non-Identity of Sufferer and Sinner**
  *   **Case:** The Suffering Infant. A baby is born with a painful, fatal defect.
  *   **Requirement:** The theory must explain the suffering without asserting the *current* personality is morally culpable for it in a way that justifies blame from the community.
  *   **Status:** **Non-negotiable.** If the theory mandates blaming the victim, it fails as a practical ethics for the living.

  **4. Epistemic Access (The Navigation Rule)**
  *   **Case:** The Confused Moral Agent. An agent wants to do right but cannot calculate the karmic risk of complex actions.
  *   **Requirement:** The agent must be able to know, roughly, where they stand and what rules apply to avoid future suffering.
  *   **Status:** **Non-negotiable.** An ethical system that cannot be navigated is a trap, not a guide.

  **5. The Amnesty Clause**
  *   **Case:** The Repentant Sinner. An agent acknowledges past wrongs and undergoes radical transformation.
  *   **Requirement:** Determine if the "debt" can be forgiven, expiated, or wiped, or if it must be exhausted through suffering.
  *   **Status:** **Taste of one camp.** Strict desert forbids amnesty (debt must be paid); therapeutic/religious views allow it (grace/realization).

  **6. The Mechanism Type (Nature vs. Ledger)**
  *   **Case:** Ring of Gyges. An agent commits perfect evil in total secrecy, dies uncaught, and leaves no causal trace.
  *   **Requirement:** Specify if Karma is a blind causal law (like gravity) or a cosmic bookkeeping system (with recorders/judges).
  *   **Status:** **Taste of one camp.**
      *   *Law-of-Nature:* Gyges escapes if the causal seed doesn't ripen before death. (Verdict: Injustice possible in finite time).
      *   *Cosmic Ledger:* Gyges is recorded regardless of causal ripening. (Verdict: Justice guaranteed, but requires metaphysical agency).

  ***

  ### The Inconsistency Proof

  Your hunch is correct, but the tension is sharper than stated. The trilemma lies between **Cross-Lifetime Desert**, **Epistemic Access**, and **No Victim-Blaming**.

  1.  **If you keep Cross-Lifetime Desert:** You must explain the Suffering Infant (Case 3) as paying for past sins. This violates **No Victim-Blaming** from the perspective of the current personality, who identifies as the victim.
  2.  **If you keep No Victim-Blaming:** You must claim the Infant's suffering is undeserved. This violates **Cross-Lifetime Desert** (the core claim that all suffering is moral debt).
  3.  **If you try to bridge them with Rebirth:** You invoke **Epistemic Access** failure. Because the Infant (and adult agents) typically lack memory of the past life sins (standard doctrine), they cannot know *why* they are being punished. This violates **Epistemic Access**. An agent cannot navigate a moral landscape where the penalties arrive for crimes they cannot remember committing.

  **The Knockout Requirement:** **Epistemic Access.**
  This is the single requirement that knocks out the most attractive theories. Traditional Cross-Lifetime Karma sacrifices Epistemic Access to maintain Desert (you suffer for sins you can't recall). Secularized Karma maintains Epistemic Access but sacrifices Desert (suffering is psychological cause/effect, not cosmic justice). You cannot have a system where agents are punished for unknown pasts *and* claim that system is a rational ethical guide. Without memory or clear revelation of the debt, "Desert" collapses into "Fate," and the ethics of praise/blame becomes incoherent.

  **On Amnesty:** If a theory allows amnesty (forgiveness/wiping the slate), it has quietly ceased to be a theory of *Desert* and become a theory of *Grace* or *Therapy*. Strict desert is accounting; amnesty is gift. They are logically incompatible. A hybrid that claims both is merely oscillating between two different metaphysical systems.

  ***

  ### Scorecard

  **Hard Retributive:** Secures cosmic justice but blinds the agent (punishes for forgotten crimes).
  **Secular Character:** Guides the agent clearly but abandons cosmic justice (Gyges wins).
  **Hybrid:** Claims both but collapses on amnesty (cannot be both strict debt and forgivable).
