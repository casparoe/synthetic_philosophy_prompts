  # JOINT STATEMENT ON THE AGGREGATION OF TRIVIAL AND SEVERE HARMS
  **Parties:** The Aggregator (A) and The Thresholdist (T)
  **Date:** October 2023
  **Subject:** Resolution of Disputes Regarding the "Torture vs. Dust Specks" Hypothetical

  ## PREAMBLE
  For decades, A and T have debated whether a sufficiently large number of trivial harms (dust specks in eyes) can morally outweigh a single severe harm (fifty years of torture). We acknowledge that previous dialectics have stalled due to conflated variables regarding population metaphysics, temporal distribution, and the ontological grain of harm. This document does not record a conversion of one party to the other. Instead, it isolates the precise load-bearing disagreements, distinguishes verbal disputes from substantive ones, and establishes test cases for future resolution.

  ---

  ## SECTION 1: SHARED COMMITMENTS
  *Both parties sign the following claims. These form the boundary conditions of our disagreement.*

  1.  **Formal Isomorphism:** Both parties agree that the choice structure can be modeled as a choice between Outcome $O_1$ (One person, Severity $S_{high}$, Duration $D_{long}$) and Outcome $O_2$ ($N$ people, Severity $S_{low}$, Duration $D_{short}$). We disagree on the valuation function $V(O)$, not the variables.
  2.  **The Non-Archimedean Claim:** We agree on what T is asserting. T claims the moral ordering is non-Archimedean: there exists no integer $N$ such that $N \times S_{low} > 1 \times S_{high}$. A claims the ordering is Archimedean: for any $S_{low} > 0$, there exists an $N$ such that $N \times S_{low} > 1 \times S_{high}$.
  3.  **The Parity Option:** Both parties acknowledge a third logical possibility: that $O_1$ and $O_2$ are not ordered (neither is better, worse, or equal). Both agree that if Parity holds, standard aggregation models fail. Neither party currently endorses Parity as the primary solution, but both accept it as a valid logical space.
  4.  **Empirical Rarity:** Both parties agree that in the actual history of Earth to date, no decision has ever required trading a confirmed instance of severe torture for a confirmed mass of trivial annoyances where $N$ exceeds $10^{15}$. The dispute is primarily modal and structural.

  ---

  ## SECTION 2: THE SUPPLY PROBLEM (MODAL ABUNDANCE)
  *We address the magnitude of $N$ required to outweigh torture. To beat 50 years of torture via dust specks, $N$ must exceed the number of humans who have ever lived by orders of magnitude.*

  **Case Definition:**
  *   **The Hubble Constraint:** $N$ is limited to the maximum number of sentient beings that can physically exist within the observable universe's light cone over its thermodynamic lifetime.
  *   **The Cantor Scenario:** $N$ includes merely possible beings, branching multiverse counterparts, or repeated lifetimes in a cyclical cosmology. $N$ is effectively unbounded.

  **Joint Findings:**
  1.  **A's Contingency:** A admits that under **The Hubble Constraint**, it is physically possible that the maximum available $N$ is *insufficient* to outweigh the torture. In a Hubble-limited universe, A's theory may prescribe choosing Torture, simply because the math cannot close on the Specks. A's view requires **The Cantor Scenario** to generate its standard verdict (Choose Specks) reliably.
  2.  **T's Invariance:** T's verdict is invariant to cosmology. Whether $N$ is limited to Earth's population or infinite possible souls, T maintains $1 \times \text{Torture} > N \times \text{Specks}$.
  3.  **The Modal Reliance:** We record that A's standard intuition pump secretly relies on **The Cantor Scenario**. When forced to operate under **The Hubble Constraint**, A's confidence in the "Specks" verdict decreases significantly, as the "sufficiently large number" may not be ontologically available.

  ---

  ## SECTION 3: THE SMEAR CASE (DIACHRONIC VS. SYNCHRONIC)
  *We distinguish between harm distributed across people and harm distributed across time within a single life.*

  **Case Definition:**
  *   **The Rain (Synchronic):** $N$ distinct people each receive one dust speck simultaneously.
  *   **The Drip (Diachronic):** One person receives one dust speck every second for a duration equivalent to $N$ seconds. Crucially, the interval is such that the irritation never accumulates to a *just-noticeable difference* (JND). The subject never consciously registers the sum of the irritations; the life feels subjectively identical to a life with no specks.

  **Predictive Table:**

  | Party | Verdict on **The Rain** | Verdict on **The Drip** | Consistency Check |
  | :--- | :--- | :--- | :--- |
  | **A (Aggregator)** | **Bad.** (Sum of $N$ negative states). | **Neutral.** (If harm requires phenomenology, 0 + 0 = 0). | **FAIL.** A must explain why location (skin/eye vs. time) alters aggregability. If A counts physical events regardless of notice, The Drip becomes Bad, but risks calling unconscious events "harms." |
  | **T (Thresholdist)** | **Trivial.** (Below threshold). | **Trivial.** (Below threshold). | **PASS.** T maintains that intensity determines category. Neither Rain nor Drip crosses the severity threshold to compete with Torture. |

  **Joint Finding:**
  A faces a dilemma. If A defines harm as *negative qualia*, **The Drip** vanishes (no qualia exist), breaking the analogy with **The Rain**. If A defines harm as *physical irritation events*, **The Drip** sums, but A must accept that unconscious physical events aggregate to moral weight. T does not face this split; for T, neither case threatens the lexical priority of Torture.

  ---

  ## SECTION 4: THE ACCOUNTING GRAIN (EVENT VS. TRAJECTORY)
  *We distinguish the Threshold Claim from the Grain Claim. Previous debates conflated "Is the harm too small?" with "Is the harm real?"*

  **Case Definition:**
  *   **The Flat Life:** A life trajectory where sub-salient specks occur but do not alter the subject's decisions, mood, health, or remembered narrative. The life graph is identical to a speck-free life.

  **Joint Findings:**
  1.  **Grain Independence:** One can be a Thresholdist who aggregates *Events* (T-Event) or a Thresholdist who aggregates *Trajectories* (T-Traj). One can be an Aggregator of *Events* (A-Event) or *Trajectories* (A-Traj).
  2.  **A's Vulnerability:** If A adopts **A-Traj** (Holistic Aggregation), sub-salient specks in **The Flat Life** contribute zero to the sum, because they do not alter the trajectory value. This collapses A's ability to generate the large numbers needed to beat Torture in **The Hubble Constraint**.
  3.  **T's Position:** T generally operates on **T-Event** regarding the threshold (the *type* of pain matters), but agrees that if a harm leaves no trace on a **Flat Life**, it is metaphysically dubious to call it a "harm" at all.
  4.  **Separation of Concerns:** We agree that the question "Do sub-salient events sum?" (Grain) is logically prior to "Do sums beat thresholds?" (Threshold). A has historically assumed Atomistic Grain without defense. T has assumed Thresholds without defining Grain.

  ---

  ## SECTION 5: DISAGREEMENTS TABLE
  *We phrase the core disagreements in each party's native terminology to prevent translation errors.*

  | ID | Core Disagreement | Phrased in A's Terminology (Archimedean) | Phrased in T's Terminology (Lexical) |
  | :--- | :--- | :--- | :--- |
  | **D1** | **The Ordering Principle** | "There exists a conversion rate between severity and count. Severity is just density of harm; count is volume. Density $\times$ Volume = Total Mass." | "Severity is a qualitative category, not a quantity. You cannot trade volume of category X for mass of category Y. It is a category error." |
  | **D2** | **The Supply Constraint** | "Moral truth is independent of cosmological capacity. If $N$ is required to make Specks > Torture, and the universe cannot hold $N$, then Torture is permissible in this universe but not in a larger one." | "Moral truth is invariant. If Torture is worse than Specks, it is worse in a closet, a universe, or a multiverse. Capacity is irrelevant to value." |
  | **D3** | **The Phenomenology Requirement** | "Harm is a negative mental state. If the state is not felt (The Drip), it is not harm. Aggregation requires distinct feelers." | "Harm is a violation of integrity/wellbeing. Even if unnoticed (The Drip), trivial violations remain trivial. They do not accumulate into a violation of severity." |

  ---

  ## SECTION 6: CRUXES TABLE
  *Concrete cases or arguments that would bear on the dispute. Predictions are recorded in advance.*

  | Crux ID | The Test Case / Argument | A's Prediction (If A is correct...) | T's Prediction (If T is correct...) |
  | :--- | :--- | :--- | :--- |
  | **C1** | **The Unnoticed Torture:** A victim is tortured for 50 years but given a drug that prevents memory formation and ensures they feel no distress in the moment, only physical damage. | A must count this as severe harm (physical state), implying phenomenology is not required. If A denies it is harm, A undermines the Torture baseline. | T maintains this is severe harm (violation of body/autonomy), confirming T's view is not purely phenomenological. |
  | **C2** | **The Hubble Cap:** We calculate the max $N$ of the accessible universe. It is $10^{40}$. We calculate the $N$ needed to beat Torture. It is $10^{50}$. | A must concede that in *our* universe, we should choose Torture over Specks. A's view becomes cosmologically contingent. | T reiterates that we should choose Torture over Specks regardless of the math. T's view remains stable. |
  | **C3** | **The Drip Intuition:** We survey neutral subjects on **The Drip** (one speck/sec, never noticed, for 100 years). Does this constitute a "bad life"? | If subjects say "No," A loses the ability to aggregate sub-salient events. A must retreat to **A-Traj**. | If subjects say "No," T is vindicated (trivial remains trivial). If "Yes," T must explain why it doesn't approach Torture severity. |

  ---

  ## SECTION 7: VERBAL VS. SUBSTANTIVE FLAGGING
  *We honestly assess which parts of the dispute are linguistic and which are ontological.*

  **1. Verbal Dispute: The Definition of "Harm"**
  *   **Diagnosis:** A often defines harm as *negative qualia*. T often defines harm as *violation of rights/integrity*.
  *   **Resolution:** If we standardize on **Phenomenological Harm** (felt experience), **The Drip** vanishes for both parties (assuming no notice). If we standardize on **Ontological Harm** (physical state), **The Drip** persists. Much of the shouting matches stem from A assuming Phenomenology and T assuming Ontology without stating it.
  *   **Status:** *Verbal.* Can be resolved by stipulation.

  **2. Substantive Dispute: The Archimedean Property**
  *   **Diagnosis:** Even if we agree on the definition of harm (e.g., "felt negative qualia"), A claims $10^{100} \times \text{micro-annoyance} > 1 \times \text{agony}$. T claims this is false.
  *   **Resolution:** No definition change resolves this. This is a fundamental disagreement about the structure of value space (continuous vs. stratified).
  *   **Status:** *Substantive.*

  **3. Substantive Dispute: The Moral Relevance of Mere Possibility**
  *   **Diagnosis:** A's view often requires counting possible people (**The Cantor Scenario**) to generate the $N$ required to beat Torture. T denies moral weight to non-actualized counterparts.
  *   **Resolution:** This is a disagreement in population ethics metaphysics, not just aggregation.
  *   **Status:** *Substantive.*

  ---

  ## SIGNATURES

  **The Aggregator (A):**
  *I sign this acknowledging that my view requires either a modal abundance of persons or an atomistic grain of harm that survives sub-salience. I admit that under The Hubble Constraint, my view may prescribe Torture.*

  **The Thresholdist (T):**
  *I sign this acknowledging that my view relies on a lexical ordering that rejects standard mathematical aggregation. I admit that if "harm" is strictly defined as "felt qualia," my view must account for why unnoticed violations matter.*

  **Date:** October 2023
