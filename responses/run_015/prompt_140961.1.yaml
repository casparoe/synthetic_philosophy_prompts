answer: |-
  You should reject step (2), affirming that the personal costs and risks inherent in supererogatory acts function as genuine agent-relative moral reasons against performing them.

  ### Defense of Rejecting (2)

  The collapse argument relies on the assumption that the "moral scorecard" only tracks impartial reasons for the good of others. By rejecting (2), you acknowledge that morality is not purely impartial; it includes **agent-relative permissions**. The cost, risk, or sacrifice to the agent *is* a moral reason against the act, not merely a prudential temptation. This blocks the argument at step (3): it is no longer true that "no moral reason speaks against" the act. Consequently, step (4) never triggers, because its antecedent ("no moral reason against") is false. The balance of reasons may still favor doing the act (making it praiseworthy per step 1), but the presence of weighty reasons against (the cost to self) prevents the balance from generating a strict obligation. This solves your worry about the omission being "merely prudentially tempting": the permission to omit is grounded in a *moral* reason (self-protection/agent-relative permission), rendering the omission morally permitted rather than just rationally excusable.

  ### Pricing the Alternatives

  *   **Rejecting (1) (Praiseworthiness is reason-responsive):** This is the most expensive cut. It severs the link between moral worth and rationality, implying an agent can be praiseworthy for acting arbitrarily or against reasons. You lose the ability to distinguish saints from lucky fools. **Cost:** High. It undermines the rational structure of ethics.
  *   **Rejecting (4) (Reasons settle oughts):** This is the standard "Optionality of the Best" move (e.g., Heyd, Urmson). It posits a gap between what we have most reason to do and what we are required to do. **Cost:** Metaphysically heavy. It requires a dualistic theory of normativity where "ought" is not determined by the weighing of reasons. It leaves the question *why* we aren't obliged to do the best unanswered, often resorting to brute intuition. Rejecting (2) is preferable because it *explains* the optionality via the weighing of reasons (costs vs. benefits) rather than positing a gap in the logic of reasons.
  *   **Rejecting (5) (Ought implies blameworthiness):** This accepts "blameless wrongdoing." **Cost:** It severs the connection between morality and accountability. If an agent ought to do X but isn't blameworthy for skipping it, "ought" loses its practical grip. Since you want to preserve the link between duty and blame, this is a non-starter for your project.

  ### The Problem of Self-Imposed Cost

  This problem is **independent** of the collapse argument. Even if you successfully block the collapse by rejecting (2), you still need a theory of *which* costs count toward supererogatory status. A cost that doesn't count cannot generate the "reasons against" needed to make the act optional. To sort your three cases, adopt the **Principle of the Authentic Baseline**:

  > *A cost contributes to supererogatory status only if it arises from the agent's normal baseline of capacity and obligation, rather than from strategic manipulation to generate praise or from prior moral fault that generates a duty of repair.*

  1.  **The Canal Weights (Strategic Manipulation):** The agent strapped on weights *to be admired*. This violates the Authentic Baseline. The cost is instrumental to the praise, not incidental to the rescue. **Prediction:** The extra cost does not count; she is not more praiseworthy than the passerby, and may be less so due to manipulative intent.
  2.  **The Kidney Donor/Pledge (Constitutive Commitment):** The agent takes on costs to enable a good they value, without prior fault or strategic gaming of the praise-mechanism. The cost is incidental to the commitment to the good. **Prediction:** The cost counts. This is genuine supererogation (or, in the case of a binding pledge, potentially a self-imposed duty, but the initial registration is supererogatory).
  3.  **The Careless Rescuer (Duty of Repair):** The danger exists due to the agent's prior fault. The baseline is shifted by the duty of repair. **Prediction:** The cost does not count toward supererogation; the act is obligatory (a duty of restitution).

  **The Firefighter Case:**
  The firefighter's baseline is defined by their professional role. Risks foreseen and accepted as part of the job description are part of the baseline, not supererogatory costs. **Prediction:** Rescuing a child from a burning building while on duty is not supererogatory; it is required. However, if the firefighter rescues a child *off-duty*, or enters a building deemed structurally unsound beyond protocol (exceeding the professional baseline), the cost counts, and the act becomes supererogatory.

  ### Confidence and Independence

  I am **highly confident** that rejecting (2) is the correct move for your specific constraints. It preserves (1) and (5), avoids the metaphysical baggage of rejecting (4), and directly answers your worry about why omission is morally permitted (agent-relative reasons).

  I am **moderately confident** in the *Principle of the Authentic Baseline*. It handles the cases well, but the line between "constitutive commitment" (Kidney) and "strategic manipulation" (Weights) can be thin in practice (e.g., does training for a marathon to run a charity race count as manipulation?).

  **Independence:** The problem of self-imposed cost is a **genuine extra problem**. You could solve the collapse argument by rejecting (4) (asserting that best $\neq$ required) and still fail to solve the self-imposed cost problem (asserting that all costs count equally). The collapse argument is about the *deontic status* of the act (optional vs. required); the self-imposed cost problem is about the *axiological status* of the act (how much praise it merits). You need both solutions to have a complete theory.

  **What would move me:** If you are committed to a strictly impartial moral theory (e.g., Act Utilitarianism) where agent-relative reasons are incoherent, you cannot reject (2). In that case, you would be forced to reject (4) and accept a dualistic theory of reasons vs. requirements. But for a friend of supererogation, accepting agent-relative moral reasons is the lesser cost.
