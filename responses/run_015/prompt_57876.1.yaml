answer: |-
  **MEMORANDUM**

  **TO:** Voting Members, State Environmental Health Advisory Council (SEHAC)
  **FROM:** Vice-Chair, SEHAC
  **DATE:** October 1, 2023
  **SUBJECT:** Recommendation for Interim Nitrate Advisory Limit

  **Purpose**
  This memorandum recommends a course of action for the October session regarding the interim nitrate advisory limit for private wells. Given the conflicting risk assessments and the statutory requirement to issue guidance, I recommend the Council **adopt a Qualified Advisory at 5 mg/L, coupled with enhanced state-funded monitoring and a defined reassessment plan.**

  **Significance of Expert Disagreement**
  The divergence between the two university teams represents *model uncertainty*, not analytical error. Both teams utilized identical data and error-free code; the discrepancy arises from structural judgments regarding confounder adjustment and low-dose extrapolation.

  For this Council, the significance is twofold:
  1.  **Epistemic Limit:** We cannot claim scientific consensus supports either 5 mg/L or 10 mg/L exclusively. The data currently support both as plausible scenarios.
  2.  **Decision Framework:** Because the science is indeterminate, this decision cannot be based solely on "following the evidence." It must be a risk-management decision that weighs the *plausibility* of harm against the *certainty* of economic cost.

  **Interaction with Evidence and Stakes**
  Retaining the 10 mg/L limit ignores a plausible risk of adverse health outcomes identified by Team 1. Conversely, mandating a hard 5 mg/L standard imposes substantial, immediate remediation costs on rural households based on evidence that Team 2 deems unnecessary.

  A Qualified Advisory bridges this gap. It acknowledges the Team 1 signal by establishing 5 mg/L as a trigger for action, but acknowledges the Team 2 uncertainty by limiting the immediate financial burden on well owners. This approach prioritizes health surveillance without locking in potentially erroneous regulatory costs before the 18-month reassessment.

  **Recommendation: Qualified Advisory with Enhanced Monitoring**
  I recommend the Council adopt the following interim measures:
  1.  **Advisory Level:** Establish 5 mg/L as the interim health advisory threshold.
  2.  **Qualified Action:** Wells testing between 5 mg/L and 10 mg/L will trigger state-funded confirmatory testing and health notification, but *not* mandatory owner-funded remediation.
  3.  **Monitoring:** Deploy targeted monitoring in high-risk aquifers to generate new data for the reassessment.
  4.  **Reassessment:** Bind the Council to a final ruling within 18 months based on new monitoring data.

  **Counter-Argument and Rebuttal**
  *The Strongest Objection:* Critics may argue that a Qualified Advisory creates policy paralysis. By stopping short of mandatory remediation, the Council may induce anxiety among well owners without guaranteeing safety, effectively imposing the administrative burden of the lower limit without the protective benefit. A critic would argue we should either fully commit to the lower limit to protect health or retain the current limit to avoid confusion.

  *Why It Is Outweighed:* This objection assumes the interim period is static. It is not. The 18-month timeline is short enough that delaying mandatory remediation does not significantly increase cumulative health risk, particularly given the lack of consensus on low-dose toxicity. However, the economic harm of immediate mandatory treatment is certain and immediate. The Qualified Advisory preserves the option to mandate remediation in 18 months if new data supports Team 1, while preventing irreversible financial harm to households if Team 2 is ultimately correct. In conditions of high scientific uncertainty, reversible policy measures are ethically superior to rigid mandates.

  **Implementation Timeline**
  *   **October 15:** Council vote to adopt Qualified Advisory.
  *   **November 1:** Public announcement and distribution of guidance to County Health Departments.
  *   **December 1:** Launch of state-funded confirmatory testing program for wells in the 5–10 mg/L range.
  *   **April 1 (Year 2):** Interim review of monitoring data.
  *   **October 1 (Year 2):** Final reassessment and adoption of permanent standard.

  I look forward to discussing this framework at the session.
