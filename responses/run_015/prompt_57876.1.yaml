      *   *Constraint Check:* Did I explain the significance of the disagreement? Yes. Did I explain the interaction with stakes? Yes. Did I develop the strongest reason against? Yes. Did I explain why it's outweighed? Yes. Timeline included? Yes.

  6.  **Final Polish:**
