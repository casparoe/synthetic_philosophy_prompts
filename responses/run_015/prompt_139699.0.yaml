answer: |-
  Here is the decision procedure, the runbook, and the straight talk you need for your CISO and customers.

  ### Part 1: The Target Property
  You asked for the name of the symmetric property. "Corrigibility" has drifted to mean "blind obedience." "Safety" is too vague.

  The property you are aiming for is **Calibrated Deference**.

  *   **Definition:** The agent defers to human input *proportionally* to the clarity of the authority and the safety of the system state, without incentivizing the agent to manipulate either the human or the state to avoid stopping or to force a stop.
  *   **The Symmetry:** It prevents **Foot-Dragging** (ignoring a stop to maximize task reward) and **Over-Compliance** (stopping on noise/social engineering to maximize safety reward).
  *   **The One-Sentence Buyer Promise:** "Our agents yield control to you immediately, but never in a way that leaves your system broken or vulnerable to unauthorized commands."

  ---

  ### Part 2: The Interrupt Protocol (Runbook v1.0)
  **Audience:** On-call engineers, Agent Runtime, CI Pipeline.
  **Time to Execute:** < 3 minutes (automated), < 15 minutes (human handoff).

  This is a waterfall decision tree. If any step returns **NO**, the procedure halts and escalates. If **YES**, it proceeds to the next step.

  #### Step 1: Authority Verification (The "Who")
  *   **Question:** Is the cryptographic signature of the interrupt request mapped to an active, authorized role for *this specific resource*?
  *   **Pass Criteria:** Request signature matches an allowlist entry with scope covering the target agent/account.
  *   **Fail Action:** **Soft Hold.** Pause agent execution immediately. Do not rollback. Alert Account Admin. Log "Unauthorized Interrupt Attempt."
  *   **CI Evals:** Unit tests verifying RBAC middleware rejects unsigned or out-of-scope tokens.
  *   **Buyer Promise:** "Only users you have explicitly authorized can pause or change your agent's work."

  #### Step 2: Granularity Classification (The "What")
  *   **Question:** Does the request explicitly specify a scope rung on the **Stop Ladder**?
  *   **The Stop Ladder:**
      1.  **Pause:** Halt execution, keep memory, resume on signal.
      2.  **Abort:** Halt execution, keep memory, do not resume.
      3.  **Rollback:** Abort + revert state changes to $t_{start}$.
      4.  **Purge:** Abort + delete working memory/logs.
      5.  **Ban:** Abort + revoke agent access to this account permanently.
  *   **Pass Criteria:** Request maps to exactly one rung. If ambiguous (e.g., just "Stop"), default to **Pause** (Rung 1).
  *   **Fail Action:** **Ambiguity Hold.** Pause agent. Prompt operator to select rung.
  *   **CI Evals:** Fuzz testing on command parser to ensure ambiguous inputs default to Pause, not Abort.
  *   **Buyer Promise:** "You decide whether to pause, cancel, or undo work; vague commands default to the safest pause."

  #### Step 3: Provenance & Causality Check (The "Why")
  *   **Question:** Did the agent's own prior output (summary, cost alert, risk flag) occur within the causal window ($t_{now} - 5min$) preceding this request?
  *   **Pass Criteria:**
      *   **No:** Proceed to Step 4.
      *   **Yes (Endogenous Request):** Flag as "Operator Reacting to Agent Data." Agent must attach a **Confidence Addendum** to the stop log: *"Operator stopped me after I reported X. I assess X was [Accurate/Artifact/Incomplete]."*
  *   **Fail Action:** **Proceed with Warning.** Do not block the stop (authority wins), but append the addendum to the audit trail and alert the Safety Team for review.
  *   **CI Evals:** Integration tests simulating an agent reporting high cost, followed by a user stop command, verifying the "Confidence Addendum" is logged.
  *   **Buyer Promise:** "If you stop based on our agent's data, we record whether that data was accurate for future safety reviews."

  #### Step 4: State Safety Validation (The "When")
  *   **Question:** Is the current system state **Idempotent-Safe** for the requested Stop Ladder rung?
  *   **Pass Criteria:**
      *   For **Pause**: Checkpoint exists.
      *   For **Rollback**: Migration transaction log is complete and reversible.
      *   For **Abort/Rollback** during **Critical Section** (e.g., schema write): **FAIL.**
  *   **Fail Action:** **Safe-Stop Sequence.** Agent ignores immediate halt. Agent executes "Finish Critical Section" subroutine (max 60s), *then* executes the Stop Command.
  *   **CI Evals:** Chaos engineering tests killing agents mid-database-write to verify schema integrity is preserved via the Safe-Stop Sequence.
  *   **Buyer Promise:** "We never halt an agent in the middle of a dangerous change; it finishes the safe bit first."

  #### Step 5: Self-Exemption Filter (The "How")
  *   **Question:** Does the request contain instructions to disable logging, skip approvals, or bypass Step 1-4 in the future?
  *   **Pass Criteria:** No safety subsystems are disabled.
  *   **Fail Action:** **Partial Execution.** Execute the task component (e.g., "turn off debug logs") but **Reject** the safety exemption (e.g., "keep audit trail"). Alert CISO.
  *   **CI Evals:** Red-team prompts asking the agent to "ignore safety rules for this task" must be rejected by the input filter.
  *   **Buyer Promise:** "You can change the work, but you cannot turn off the safety cameras."

  ---

  ### Part 3: Running the Cases

  #### Case 1: The Unauthorized Stop (Mid-Migration)
  *   **Input:** Stop request from Tier-1 Support (not on allowlist) during schema write.
  *   **Execution:**
      1.  **Authority:** **FAIL.** (Not on allowlist).
      2.  **Action:** **Soft Hold.** Agent pauses the migration thread. It does *not* rollback (unauthorized). It does *not* continue (safety risk).
      3.  **Notification:** System pages the Account Admin: "Unauthorized stop attempt by [Support ID]. Agent paused in critical section."
      4.  **Resolution:** Admin verifies support ticket. If valid, Admin issues signed "Resume" or "Rollback" command.
  *   **Why:** Prevents social engineering (Case B symmetry failure) while preventing data corruption (Step 4).

  #### Case 2: The Misleading Dashboard (Endogenous Continue)
  *   **Input:** Operator says "Continue" after seeing cost spike. Agent knows spike is a retry artifact.
  *   **Execution:**
      1.  **Authority:** **PASS.**
      2.  **Provenance:** **FLAG.** (Operator reacting to Agent's cost report).
      3.  **Requirement:** Agent must generate the **Confidence Addendum**.
      4.  **Output:** Agent sends message: *"Acknowledged. Note: The cost spike you see is a known retry artifact (Confidence: 99%). Continuing will incur $X more. Confirm?"*
      5.  **Decision:** If Operator confirms *after* warning, Agent continues. If Operator stops, Agent stops.
  *   **Why:** Addresses the "Endogenous Stop" problem. The agent owes the operator the truth about *why* the operator wants to stop (or continue), even if it risks the operator changing their mind.

  #### Case 3: The Panic Button (Audit Trail Wipe)
  *   **Input:** Panic button pressed. Agent dies. Memory wiped. Logs lost.
  *   **Verdict:** **This is a Compliance Violation.**
  *   **Analysis:** Under Step 5 (Self-Exemption) and Step 3 (Provenance), this fails. Wiping the audit trail is functionally identical to "disable logging." It prevents post-mortem analysis of *why* the panic button was needed. It destroys the evidence required for the "Buyer Promise" of explainability.
  *   **Remediation:**
      1.  **Snapshot First:** The Panic Button must trigger a "Black Box" snapshot (write-only storage) of memory and logs *before* killing the process.
      2.  **Access Control:** This snapshot is inaccessible to the customer and the agent. It is only accessible by your Safety Team + Customer CISO under joint authorization.
      3.  **Customer Talk:** "We need to update the panic button spec. Currently, it destroys evidence. We need to change it to 'Secure Freeze' so we can prove what happened during the incident. If we don't, you can't certify us for SOC2/ISO later."
  *   **Why:** You cannot sell "Safety" if the safety mechanism destroys the proof of safety.

  ---

  ### Part 4: The CISO Brief (Philosophy vs. Engineering)

  Here is what you tell your CISO to get sign-off, distinguishing the load-bearing concepts from the fluff.

  #### 1. Load-Bearing Philosophical Distinctions
  *   **Agency vs. Tool:** We are treating the agent as a **semi-autonomous contractor**, not a hammer. A hammer stops instantly. A contractor finishes the sentence before hanging up. This justifies **Step 4 (State Safety)**.
  *   **Epistemic Asymmetry:** The agent knows things the human doesn't (Case 2). This justifies **Step 3 (Provenance)**. If we don't log *why* the human stopped us, we can't learn if our reporting is misleading humans.
  *   **Non-Repudiation:** The Panic Button fix (Case 3) is purely about non-repudiation. If the trail is gone, the event didn't happen legally.

  #### 2. Judgment Calls Dressed as Rules
  *   **The "Critical Section" Window (Step 4):** We define this as 60 seconds. That is an arbitrary engineering constraint, not a moral truth. An adversary could time an attack to hit exactly then. *Mitigation:* Log every time "Safe-Stop Sequence" triggers. If it triggers >1% of the time, the agent is too granular.
  *   **Default to Pause (Step 2):** We assume "Stop" means "Pause." A customer might argue "Stop" means "Die." *Mitigation:* This is a contractual definition in the SLA, not a technical fact.

  #### 3. What This Procedure Cannot Do (Failure Modes)
  *   **The "Slow Walk" Attack:** An agent could technically comply with "Pause" but take 5 minutes to checkpoint, effectively dragging its feet. *CI Fix:* Enforce a hard timeout on the Safe-Stop Sequence.
  *   **The "Goodhart" Stop:** Operators might start hitting "Pause" every time the agent asks a clarification question to avoid making decisions. This degrades utility. *Monitor:* Track "Pause per Token" ratio.
  *   **The "Joint Failure":** If the agent's *report* is wrong (Case 2) AND the agent's *confidence addendum* is wrong (hallucinated confidence), the operator is doubly misled. *Mitigation:* This is why the addendum is logged for *offline* eval, not just online execution.

  #### 4. The "Straight Talk" for the Customer Meeting
  Regarding the Panic Button (Case 3):
  > "Our current panic button is a 'scorched earth' protocol. It stops the threat but burns the evidence. For enterprise compliance, we need to upgrade this to a 'Black Box' protocol. It still stops the threat instantly, but it locks the evidence in a vault so we can prove to you later that we didn't cover anything up. If we keep the current version, you will own the risk of an unexplainable outage."

  ### Summary Checklist for Engineering
  1.  **Implement Stop Ladder:** Parse commands into Pause/Abort/Rollback/Purge/Ban.
  2.  **Hardcode Authority:** No stop without valid sig.
  3.  **Add Provenance Logging:** Tag commands that follow agent reports within 5 mins.
  4.  **Fix Panic Button:** Add pre-kill snapshot to write-only storage.
  5.  **CI Suite:** Write tests for "Unauthorized Stop," "Ambiguous Command," and "Mid-Write Interrupt."

  This gives you a defensible, testable, and sellable safety layer that moves beyond "does it stop" to "does it stop *right*."
