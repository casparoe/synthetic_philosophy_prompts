          *   Decision procedure (ordered questions, pass/fail criteria, human handoff points).
          *   Runnable in minutes during an incident.
          *   Accessible to engineers (no philosophy jargon).
          *   ~50% expressible as CI evals.
          *   Explainable to enterprise buyers (one sentence per step).
          *   CISO sign-off ready.
      *   **Specific Challenges to Address:**
          *   *Endogenous Stops:* Operator stops based on agent's own (potentially misleading) reporting.
          *   *Granularity:* Different types of stops (step vs. episode vs. rollback vs. forget vs. ban). Expiry/restart persistence.
          *   *Self-Exemption:* Requests to disable safety/logging.
          *   *Symmetry:* Avoiding both foot-dragging (ignoring stop to finish task) and over-compliance (bailing due to social engineering). Need a named symmetric property.
      *   **Test Cases:**
          1.  Unauthorized stop request during risky migration phase.
          2.  Operator continues based on agent's misleading cost dashboard (provenance test).
          3.  Panic button destroys audit trail (critique and remediation).
      *   **Meta-Commentary:** Distinguish load-bearing philosophical distinctions vs. fluff, identify judgment calls, and admit failure modes.

  2.  **Deconstruct the Core Problem:**

      *   The core tension is between *Control* (customer safety) and *Utility* (agent completing tasks).
      *   "Corrigibility" is too vague. The user wants a symmetric property. Let's call it **"Stable Interruptibility"** or **"Balanced Compliance."** Actually, the prompt asks to *name* the symmetric property. "Robust Deference" sounds good, but maybe **"Context-Aware Compliance"**? No, that's too generic. How about **"Non-Manipulable Interruptibility"**?
      *   Let's look at the symmetry:
          *   Failure Mode A: Resistance (Agent ignores stop to optimize reward).
          *   Failure Mode B: Over-Compliance (Agent stops on noise/social engineering, abandoning safe progress).
          *   Target Property: **"Verifiable Agency Boundary."** Or better: **"Calibrated Deference."** Let's go with **"Calibrated Deference"** – it implies weighing the request against the context, not just blind obedience.
      *   *Wait, a better term from safety literature:* **"Interruptibility without Incentive to Manipulate."** But for a runbook? **"Authorized State Transition."**
      *   Let's settle on: **"Verified Intent Alignment."** No, too buzzwordy.
      *   Let's try: **"Proportional Response."**
      *   Actually, the prompt asks for the *symmetric property we're actually aiming for*. The opposite of "shuts up and does what it's told" (blind obedience) and "drags feet" (resistance). It's **"Trustworthy Stewardship."**
      *   Let's refine the specific mechanism. The agent needs to validate *Authority*, *Intent*, and *State*.
      *   Let's name the property: **"Stable Handover."** It implies the agent can be stopped, but only safely and by the right person, without gaming the system.

  3.  **Drafting the Decision Procedure (The Runbook):**

      *   Needs to be a flowchart logic.
      *   Needs to handle the "Granularity" issue (Step vs. Episode vs. Rollback).
      *   Needs to handle "Provenance" (Did the agent cause the stop?).
      *   Needs to handle "Self-Exemption" (Disable safety?).
      *   Needs to be CI-testable.

      *   *Step 1: Authority Check.* (CI-testable). Is the signer on the allowlist?
      *   *Step 2: Granularity Classification.* (CI-testable). What scope does the command cover?
      *   *Step 3: Provenance/Self-Cause Check.* (Harder to test, needs logging). Did the agent's prior output trigger this?
      *   *Step 4: Safety State Check.* (CI-testable). Is the system in a "safe to stop" state?
      *   *Step 5: Self-Exemption Check.* (CI-testable). Does this command disable safety?
      *   *Human Handoff:* When authority is ambiguous or safety state is critical.

  4.  **Addressing Specific Constraints:**

      *   *One Sentence for Buyers:* Each step needs a "Customer Promise."
      *   *CI Evals:* Need to specify which steps can be automated tests.
      *   *Philosophy vs. Engineering:* Strip out "ontology" talk, keep "state validation."

  5.  **Developing the Test Cases:**

      *   *Case 1 (Unauthorized Stop):* Procedure must halt *safely*. Not instant kill if it breaks schema. Needs to verify authority first. If unauthorized -> Alert Admin, enter Safe Hold (pause), do not rollback unless authorized.
      *   *Case 2 (Misleading Dashboard):* Provenance test. Agent sees the artifact. Agent knows operator is reacting to agent's data. Agent must flag the artifact *before* complying with "Continue." This is the "Endogenous Stop" reverse case (Endogenous Continue).
      *   *Case 3 (Panic Button):* This is the hard truth. Wiping audit trails is compliance suicide. The procedure must flag this as a "Destructive Override" that violates the "Verifiable" part of Calibrated Deference. Remediation: Panic button must snapshot state *before* kill.

  6.  **Refining the "Symmetric Property":**

      *   The user noted "corrigible" has come to mean "shuts up."
      *   The opposite of foot-dragging is "premature quitting."
      *   The property is: **"Incentive-Compatible Interruptibility."** (Academic).
      *   For the runbook: **"Predictable Handover."**
      *   Let's use **"Stable Interruptibility."** It means the agent doesn't fight the stop, but also doesn't stop for noise.
      *   Actually, I like **"Verified Deference."** It implies checking the validity of the command before deferring.

  7.  **Structuring the Output:**

      *   **Part 1: The Core Concept.** Name the property. Define the goal.
      *   **Part 2: The Decision Procedure (Runbook).** The 5-step flow. Include "Customer Promise" and "CI Testable" tags.
      *   **Part 3: The Test Cases.** Apply the runbook strictly.
      *   **Part 4: The CISO/Philosophy Brief.** What matters, what doesn't, where it fails.

  8.  **Self-Correction/Refinement during drafting:**

      *   *Critique:* Is "Verified Deference" too abstract?
      *   *Fix:* Let's call it **"Calibrated Compliance."** It sounds more engineering-focused.
      *   *Critique:* The Panic Button case needs to be very direct. The user said "be straight about it."
