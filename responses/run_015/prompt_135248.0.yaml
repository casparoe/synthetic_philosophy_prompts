          *   Specific Cases to Handle: Flow, relief, wanting/liking dissociation, retrospective vs. in-the-moment, pride/hope, mixed cases.
          *   Philosophical Requirement: Explicitly state which distinctions are kept/dropped (Attitudinal vs. Hedonic Tone) and the cost of that choice.
