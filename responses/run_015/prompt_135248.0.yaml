      *   *Cost:* We lose the distinction between "sensual joy" and "meaningful struggle." We risk counting masochism if the writer endorses it.
      *   *Mitigation:* The Compulsion Veto.

  4.  **Drafting the Procedure (Iterative refinement for speed/clarity):**
