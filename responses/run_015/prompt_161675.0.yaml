answer: |-
  Here is the brutal accounting. I've scored them on **Coverage** (does it survive all five cases?) and **Robustness** (does it hold up under scrutiny, or does it rely on fuzzy definitions?).

  ### The Scoreboard

  **(c) Group membership: 92/100**
  **(g) No-replacement counterfactual: 88/100**
  **(j) Efficacy isn't the relevant notion: 76/100**
  **(i) Capacity building / option value: 64/100**
  **(a) Expected difference: 58/100**
  **(d) Practice participation: 52/100**
  **(e) Expression and integrity: 41/100**
  **(f) Universalisation: 33/100**
  **(b) Threshold lottery: 28/100**
  **(k) De minimis: 18/100**
  **(h) Observability amplifier: 12/100**

  ---

  ### Tier A: Get Their Own Section
  *These are the heavy lifters. They don't crumble when the causal chain gets weird.*

  **(c) Group membership**
  This is the only reply that treats "collective harm" as a distinct metaphysical category rather than trying to squish it back into individual causation. It survives *Sunk Supply* (you're still a member of the meat-eating club) and *Screened Off* (you still voted for the party) without lying about the physics. It shifts the blame from *causing* to *belonging*, which is where the moral itch actually lives in these cases.

  **(g) No-replacement counterfactual**
  This is the most analytically honest tool you have. It doesn't try to prove you caused the harm in *Screened Off* or *Sunk* cases; it admits you didn't, but argues that the *system* relies on people like you being the placeholder. It relocates the moral bite from the specific act to the structural vulnerability. It's complex, but it's the only one that doesn't gaslight the reader about causality.

  ### Tier B: A Solid Paragraph
  *Useful, but they have blind spots or rely on specific assumptions.*

  **(j) Efficacy isn't the relevant notion**
  Philosophically nuclear and highly robust across all five cases, but it wins by changing the subject. If your zine is about *harm*, this reply says "harm is the wrong metric." It's a powerful get-out-of-jail card for deontologists, but it might frustrate readers who genuinely want to know if they are *hurting* anyone.

  **(i) Capacity building, or option value**
  Strong on *Screened Off* (keeping the alternative shop open) and *Invisible* (habit formation), but it kicks the can down the road. It justifies the act as an investment, not as a resolution of the current harm. It works best as a pragmatic supplement to (c) or (g), not a standalone moral theory.

  **(a) Expected difference**
  The standard baseline. It works beautifully on *Smooth* and *Lumpy*, but it flatlines on *Sunk Supply* and *Screened Off*. You have to include it because it's what people expect, but you need to explicitly show where it breaks, or you look naive about supply chains.

  ### Tier C: Mention and Move On
  *These either collapse under pressure or rely on hand-waving.*

  **(d) Practice participation**
  This is just (i) Capacity Building with a social coat of paint. It fails in *Invisible* cases (if no one sees the practice, does it exist?) and *Sunk* cases (eating the dead chicken doesn't sustain the practice of butchery). It's a subset of (c) and (i) without adding new machinery.

  **(e) Expression and integrity**
  Fragile. In *Case 5 (Invisible)*, if truly no record exists, expression is solipsistic. It also dodges the harm question entirely to focus on the agent's soul. Good for a sidebar on virtue ethics, bad for answering whether the harm matters.

  **(f) Universalisation**
  The Kantian hangover. It collapses in *Screened Off* (if everyone else voted, your vote still changes nothing) and *Sunk* (if everyone ate sunk meat, no new animals die). It relies on a counterfactual world that doesn't help you navigate this one.

  **(b) Threshold lottery**
  Dies immediately in *Case 1 (Smooth)*. It's a specific heuristic for *Case 2 (Lumpy)*, not a general theory. Treat it as a sub-point of (a) Expected Difference where the distribution is spiky.

  **(k) De minimis**
  This isn't a reply; it's a surrender. It's honest, but it ends the conversation. Include it only to acknowledge the nagging doubt that maybe the math actually wins and we're all just coping.

  **(h) Observability amplifier**
  **Case 5 (Invisible)** is a sniper shot designed to kill this reply. If no one sees you, the cascade is zero. It's high-variance: amazing for public acts, useless for private ones. Don't build a theory on it.

