  ### The Three Extra Things

  **1. The Secret Duplicates**
  *   **(b) Threshold Lottery** is just **(a) Expected Difference** with a step-function variable. Collapsing them loses the specific intuition pump of the "lottery ticket" (which feels different than a "tiny drop"), but analytically they are the same engine. Keep (b) as a footnote to (a).
  *   **(d) Practice Participation** is **(i) Capacity Building** + **(h) Observability**. It argues that individual acts maintain a social infrastructure. If you strip out the observability (Case 5), it becomes pure Capacity Building. Collapse (d) into (i).

  **2. The Missing Case**
  *   **The Rebound Effect (Jevons Paradox).** You refrain from the harm (e.g., buy an efficient car), which lowers the aggregate demand/price, which allows someone else to consume *more* of the resource elsewhere.
  *   **Who it props up:** This case makes **(a) Expected Difference** and **(i) Capacity Building** look dangerous. It suggests that individual restraint can sometimes *increase* total harm. It forces you to rely more heavily on **(c) Group Membership** (you didn't cause the rebound, but you're part of the system) or **(j) Non-consequentialism** (rules over outcomes).

  **3. The Shake-Up Case**
  *   **The Case:** **"The Moral License."** Your visible good act *reduces* the likelihood of others acting morally (e.g., I bought the eco-product, so I don't need to pressure the government; or, I see you voting, so I feel safe staying home).
  *   **Why it shakes the ranking:** This devastates **(h) Observability** and **(d) Practice**, turning them from positives into negatives. It suggests that making your act visible can have *negative* expected value.
  *   **Resulting Tier Changes:**
      *   **(h) Observability** drops from Tier C to **Trash** (do not include).
      *   **(i) Capacity Building** drops from Tier B to **Tier C** (building capacity might crowd out others).
      *   **(c) Group Membership** rises to **95/100** (it remains the only stable platform, as membership obligations don't fluctuate based on others' laziness).
      *   **(g) No-replacement** rises to **Tier A** joint-top (it helps diagnose *why* the license happened—your act was treated as a replacement for systemic action).
