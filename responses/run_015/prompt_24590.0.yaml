      *   Ensure specific references to principles (MP, LPO, CT, Continuity Principle) are accurate.
      *   *Self-Correction on Markov:* Be careful. Russian constructivists accept MP, but they reject LPO. Why? Because LPO requires deciding an infinite sequence, which isn't computable. MP is about $\neg\neg\exists n P(n) \to \exists n P(n)$ for decidable $P$. In recursive math, if it's impossible that $P$ never holds, it must hold somewhere (based on the interpretation of negation in recursive realizability). Wait, strictly speaking, Markov's Principle is not provable in Heyting Arithmetic, but it is *realizable*. Russian constructivists often add it as an axiom or rule.
      *   *Self-Correction on Brouwer:* Brouwerians reject MP because it contradicts the Continuity Principle ($KC$). If all functions are continuous, you can't have the discontinuous jump MP implies.
