prompt: |-
  I am trying to stabilize my view on societal collapse for a conceptual history seminar, and I want a consistency check before I commit to the framework. Here are the commitments I currently hold:

  (1) The Late Bronze Age crisis around 1200 BCE should not be called a collapse. The palatial economies of the eastern Mediterranean dissolved, but village-level agro-pastoral systems and local ceramic traditions show strong continuity; the change was in the superstructure, not the social substrate.

  (2) The Classic Maya lowland abandonment around 800–900 CE was a genuine societal collapse, not merely a political reconfiguration, because the integrated calendrical and dynastic institution that linked major centers was irretrievably broken, even though regional populations and local ritual practices persisted in modified form.

  (3) Rapa Nui (Easter Island) did not experience a collapse but rather a managed contraction: the moai-building cult was deliberately replaced by the Birdman cult, population levels stabilized, and the ecological damage should be read as a transitional cost rather than a terminal failure.

  (4) Collapse is not an empirical category but an evaluative one: to call a transition a collapse is implicitly to judge that a specific form of large-scale complexity—usually urban, bureaucratic, and monument-oriented—was worth preserving, which reveals normative preferences rather than describing an objective historical failure.

  (5) As a methodological rule, I apply a presumption of institutional persistence: when interpreting archaeological transitions, we should assume that social knowledge, economic relationships, and ritual practices continue unless we have direct positive evidence of their extinction, rather than inferring rupture from the mere absence of certain material traces.

  My question: do these five hang together? I can feel some friction between (2) and (4), and possibly between how I treat the Maya versus the Bronze Age in (1) and (2), but I am not sure whether these are deep contradictions or just differences in emphasis. I also suspect there is an apparent tension—perhaps involving (3) and (5)—that dissolves once the distinction between absence of evidence and evidence of absence is kept clear, but I want that tested rather than assumed.

  Please audit the set. For each pair that is genuinely in tension, say how severe it is, which commitment carries the heavier burden, and what the least costly revision would be, without assuming in advance which one I would drop. For pairs that only seem to conflict, explain why the tension dissolves on closer inspection. Rank the real tensions by severity, and tell me whether there is a single revision that would clean up the most conflicts at once. Also flag any hidden commitment that (1) through (5) jointly entail but that I have not explicitly endorsed—something I am implicitly buying into by holding all five together.

  Please write the response in American English, with clear paragraph breaks. Do not provide bibliographies, reading lists, or citations.
