  # JOINT STATEMENT ON THE MOLYNEUX QUERY AND THE CASE OF SUBJECT S

  **Signatories:** The Lockian Signatory (LS) | The Leibnizian Signatory (LeibS)
  **Date:** [Redacted]
  **Location:** [Redacted]

  ## I. AGREED CLAIMS

  We, the undersigned, acknowledge the following premises as the necessary groundwork for our divergence. We agree that these claims are not in dispute, though their interpretation remains the source of our conflict.

  1.  **The Problem Setup:** The core question remains whether a person born blind, who distinguishes a cube from a sphere by touch, would immediately distinguish them by sight upon gaining vision, without prior visual-tactile association. We agree that the classic formulation focuses on positive solids (the object itself).
  2.  **Modality Deliverables:** We agree that touch and sight deliver different raw data. Touch provides local pressure, texture, temperature, and proprioceptive limb position. Sight provides distal color, luminance, and simultaneous boundary detection. Neither modality delivers "shape" as a raw datum; shape is constructed from these inputs.
  3.  **Neuroscience Silence:** We agree that current neuroscience confirms cross-modal plasticity (the visual cortex can process touch in the blind) but remains silent on whether this neural repurposing constitutes *conceptual identity* or merely *functional substitution*. We do not know if the brain state representing "roundness" via touch is the same kind of state as "roundness" via sight.
  4.  **The Case of Subject S:** We agree to introduce a specific niche case to test the limits of the problem. Subject S is a congenitally blind sculptor. S does not primarily touch the solid clay; S specializes in negative space. S constructs internal haptic maps by probing the air gaps around forms or feeling the interior of molds. S claims to know the shape of the object by knowing the shape of the void surrounding it. S has never had visual experience.

  ## II. STATEMENTS OF DISAGREEMENT

  | Issue | The Lockian Position (LS) | The Leibnizian Position (LeibS) |
  | :--- | :--- | :--- |
  | **1. The Nature of Spatial Ideas** | Spatial ideas are abstracted from specific sensory qualities. The "feel" of a void is an absence of pressure; the "look" of a void is an absence of light. These are distinct ideas with no inherent link. | Spatial ideas are amodal structures of the intellect. The geometry of the void is identical regardless of whether it is sensed by pressure or light. The mind recognizes the invariant relation. |
  | **2. Cross-Modal Transfer** | Transfer requires learned association. S knows the void by touch. To know it by sight, S must learn to associate the visual pattern with the haptic memory. Instant recognition is impossible. | Transfer is immediate if the intellect is engaged. Since S understands the geometry of the void through reason and touch, the visual input merely triggers the existing intellectual concept. |
  | **3. The Status of Negative Space** | Negative space is a secondary construction derived from positive boundaries. You cannot feel "nothing." S is actually feeling the positive boundaries of the mold and inferring the gap. | Negative space is a primary geometric reality. The void has extension and figure just as solid matter does. S accesses the geometry directly, not merely as an inference from solids. |
  | **4. The Role of Movement** | S's knowledge is procedural. It is bound to the specific movements required to probe the void. Change the movement, and the knowledge fails. | S's knowledge is propositional encoded in movement. The movement is the expression of the knowledge, not the knowledge itself. The geometry remains true regardless of the probe. |

  ## III. THE CRUXES AND TESTABLE PREDICTIONS

  We identify two specific points of fracture. For each, we propose a concrete mental experiment that bears on the issue. We record our predictions here to be settled by future observation or rigorous thought.

  ### Crux 1: Is Negative-Space Representation Modality-Bound?

  **The Question:** When Subject S represents the "hollowness" of a sphere, is that representation tied to the haptic sensation of absence, or is it a pure spatial concept that can accept visual data?

  **The Agreed Mental Experiment:**
  Subject S is granted sudden vision (or uses a high-fidelity sensory substitution device that converts visual depth to sound). S is presented with a transparent glass sphere suspended in a frame. S is asked to identify the shape of the *air inside* the sphere versus the *air outside* the sphere, based solely on the visual cue of refraction and boundary, without touching it.

  **Lockian Prediction (LS):**
  S will fail to instantly distinguish the internal void from the external void visually. The haptic map of the void is built on resistance and lack thereof during movement. The visual map is built on light refraction. There is no common currency. S will see a shiny object but will not immediately "see" the contained space as the same entity she "feels" when probing a mold. She must learn that *this* visual pattern corresponds to *that* haptic void.

  **Leibnizian Prediction (LeibS):**
  S will succeed immediately. The geometry of the enclosed space is a truth of reason. Once S sees the boundary, the intellect grasps the extension within. The visual data provides the boundary; the intellect supplies the concept of the contained volume. Since S already possesses the concept of the void via touch, the visual input activates the same intellectual structure. The modality is irrelevant to the truth of the spatial relation.

  ### Crux 2: Haptic Calculus vs. Muscle Memory

  **The Question:** Does Subject S possess genuine geometric knowledge of the negative space, or does she possess a highly refined set of motor habits that mimic knowledge?

  **The Agreed Mental Experiment:**
  Subject S is asked to probe a complex negative space (e.g., a twisted void inside a solid block) using her dominant hand. Immediately after, she is asked to draw the shape of that void on a flat surface using her non-dominant hand, without tracing or physical guidance. She must represent the 3D void in 2D projection.

  **Lockian Prediction (LS):**
  S will struggle or fail to produce an accurate projection. Her knowledge is tied to the specific kinesthetic sequence of her dominant hand probing the void. It is a "knowing how," not a "knowing that." Translating this procedural memory into a static visual representation requires a new learning process. She knows the path her hand took, not the universal shape of the void.

  **Leibnizian Prediction (LeibS):**
  S will succeed with high accuracy. Her probing was not merely movement; it was a method of measuring spatial relations. She understands the angles and curvature of the void as geometric truths. Because the geometry is amodal, she can translate it from haptic exploration to visual drawing instantly. The hand is merely the instrument of the mind's geometric insight.

  ## IV. CLOSING REMARKS

  **The Lockian Signatory:**
  I maintain that we cannot confuse the map with the territory. Subject S has a detailed map of the territory drawn in the ink of touch. You cannot read that map with eyes trained in the ink of light without a legend. The sculptor's skill is miraculous, but it is a skill of association and habit, not of innate visual geometry. To claim otherwise is to mystify the senses.

  **The Leibnizian Signatory:**
  I maintain that we cannot confuse the medium with the message. The ink differs, but the message is spatial truth. Subject S has accessed the geometry of the world through the medium of touch. The eye is simply another window onto that same geometry. To claim otherwise is to trap the mind inside the skin, denying the universality of reason.

  **Status:** Unresolved.
  **Next Step:** Await empirical data on cross-modal plasticity in adult-onset vision restoration, specifically regarding negative space tasks.
