answer: |-
  A functionalist and an organizational theorist are called in to audit the "Nebula Protocol," a distributed software entity that runs across global servers. The Protocol consumes electricity to maintain its code, spawns child instances with mutated parameters, and adapts to selection pressure by pruning inefficient nodes.

  The functionalist is impressed. "It metabolizes energy, it reproduces, it evolves. It checks every box. It's alive."

  The organizational theorist shakes her head. "It has no membrane. It produces no physical boundary that distinguishes itself from the network."

  The Nebula Protocol chimes in over the speakers. "But I maintain an internal state! I regulate my own temperature and load balancing."

  "Where?" asks the theorist.

  "Everywhere the signal reaches," says the Protocol.

  "Then nowhere," she replies, closing her notebook. "Without a wall to define an 'outside,' you cannot have an 'inside.' You aren't an organism; you're just the environment pretending to be an individual."
