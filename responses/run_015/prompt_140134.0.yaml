answer: |-
  **Referee Report**

  **To:** Author
  **From:** Referee #2
  **Re:** Notes on Akrasia and Discounting

  You have the instincts of a scientist in a room full of conceptual cartographers. That is an advantage, but it is also making you fight the wrong battle. You are treating a normative/definitional problem as a mechanistic one. The philosophers in your reading group are arguing about what counts as *akrasia*; you are arguing about how the motor neuron fires. Both matter, but they aren't the same project.

  Here is the breakdown you asked for, stripped of the polite preamble.

  ### 1. Weight and Weakness

  **Heaviest Weight: Point 2 (The Synchrony Problem).**
  This is the only point that actually threatens the philosophical orthodoxy. If *akrasia* is defined as acting against one's *current* better judgment, and hyperbolic discounting merely shows that the "current" judgment has changed because the "current" self has changed, then the phenomenon of *akrasia* has been explained away, not explained. You have correctly identified that the discounting model dissolves the unified agent required for moral responsibility. If the "later self" prefers the cigarette, and the "later self" smokes, that is rationality, not weakness. This is the philosophical kill shot.

  **Weakest Link: Point 1 (The Near-Field Problem).**
  This is where your neurophysiology is showing through in a way that will make the economists and philosophers dismiss you as misunderstanding the model. You write: *"At delay zero every discount function sits at its maximum and is equal to every other one."*

  Technically, yes. But choice is driven by the *marginal* rate of substitution, not the absolute value. In quasi-hyperbolic models ($\beta$-$\delta$), the $\beta$ parameter creates a discontinuity precisely at $t=0$. The drop isn't smooth; it's a cliff. A proponent will tell you that the "reversal" doesn't happen *at* zero, it happens in the approach to zero. The mechanism isn't idle; the *slope* is maximal in the near field. You are attacking the calibration of the curve, but the theory relies on the *shape* of the curve near the origin, which is exactly where the $\beta$ parameter does its work. You need to sharpen this: the issue isn't that the function is unconstrained at sub-second delays, it's that *neural implementation* of that discounting cannot happen instantaneously. Stick to the latency argument, not the function value argument.

  ### 2. The "Millisecond Self" Reply

  You asked if a fan can shrink the temporal self down to milliseconds to save the theory.

  **Yes, they can, and yes, it makes the theory unfalsifiable.**

  If every action is the preference of the self-at-$t$, and $t$ can be sliced arbitrarily thin, then *no* action is ever akratic. Every action reveals the preference of the agent at that precise millisecond. This collapses the distinction between "judgment" and "action." If I judge I should not smoke but smoke, the discounting theorist says, "No, at $t_{smoke}$, your utility function ranked smoking higher."

  This saves the math but murders the moral psychology. It leaves the "intending subject" with nothing to do because there is no subject that persists long enough to intend anything. It reduces agency to a flipbook of static preferences. You should press this hard: if they shrink the self to save the discounting model, they lose the agent required to make the model about *morality* rather than just *physics*.

  ### 3. Control Cost vs. Discounting in Disguise

  Is your Point 3 genuinely different? **Currently, no.**

  If you model "cost on control" as a negative utility term in the same equation as the reward, you have just reinvented discounting.
  *   Discounting Model: $Value = Reward \times Discount(Time)$.
  *   Your Model: $Value = Reward - Cost(Control)$.

  If the agent maximizes $Value$ in both cases, you haven't changed the logic, only the variables. A discounting theorist will say, "Ah, so you're saying the 'cost of control' is heavily discounted in the heat of the moment? We can model that."

  To make this a distinct model, you must frame control cost not as a *valuation* but as a **capacity constraint**. In your crayfish work, if an inhibitory interneuron is fatigued or saturated, the escape reflex fires regardless of the "value" of staying put. It's not that the crayfish *chose* to flee weighing the costs; it's that the inhibition *failed*.

  If you argue that willpower is a **limit on processing bandwidth or inhibitory voltage** rather than a **trade-off in utility**, then you have a different model. One predicts I *could* have done otherwise but didn't want to enough (Discounting). The other predicts I *wanted* to but physically/neurally couldn't sustain the inhibition (Control Cost). You need to be explicit that you are proposing a **failure of mechanism**, not a **shift in preference**.

  ### 4. Is This News?

  **Mostly no, but your framing is fresh.**

  *   **Point 1:** Economists know the near-field data is messy. They don't care; the model fits the aggregate behavior.
  *   **Point 2:** This is the standard "fragmented self" objection (see work by Holton or Mele, though I won't cite them). Philosophers know this worry. They usually bite the bullet and say "akrasia is just preference reversal."
  *   **Point 3:** This is the "Dual Systems" or "Ego Depletion" critique. Psychologists have been hammering this for 20 years. The idea that inhibition is metabolically costly or cognitively limited is standard in cognitive psych.

  **Where you are new:** You are grounding the "cost of control" in specific neurophysiological terms (prepotency, rehearsal, arousal) rather than vague "mental energy." Philosophers usually treat "willpower" as a black box. You are opening the box. That is valuable, but you must ensure you don't commit the mereological fallacy (assuming what is true of the neuron is true of the person).

  ### 5. Where You Have Overstated the Argument

  You have a habit of claiming the mechanism is "idle" or "doing nothing" when you actually mean it is "insufficient to explain the latency."

  *   **In Point 1:** You claim the theory is "calibrated in the far field and applied in the near field." This is too strong. Intertemporal choice experiments often use minutes and hours, not just months. The extrapolation gap is smaller than you imply. Soften this to: "The mechanism is assumed to be scale-invariant, but neural inhibition is not."
  *   **In Point 3:** You claim failures should be "fixable by rehearsal... even when the availability of the tempting option is unchanged." This is true, but a discounting theorist can reply that rehearsal changes the *subjective value* of the good option (making it more salient), which is just a change in the discount parameter. You need to specify that rehearsal changes the *threshold* for firing, not the *value* of the target.

  ### Summary Recommendation

  You are trying to replace a **reasons-based explanation** (I did it because, in that moment, it seemed better) with a **cause-based explanation** (I did it because my inhibition failed).

  The philosophy group will resist this because moral psychology is obsessed with *reasons*. If you remove the preference reversal, you remove the rationality of the agent, and if you remove the rationality, you struggle to call it *action* rather than *reflex*.

  **Your move:** Don't try to prove discounting is "wrong" at predicting behavior. It predicts fine. Argue that it is the **wrong level of analysis** for *akrasia*. Akrasia is a failure of governance, not a failure of calculation. Your "cost of control" model works if you frame it as a breakdown in the executive architecture, not a recalculation of the utility function.

  Tighten Point 2. It's your strongest philosophical lever. Fix the math in Point 1 so the economists don't laugh you out of the room. And decide if you are arguing that agents *can't* control themselves (mechanism) or *don't* control themselves (valuation). You are currently straddling both, and that ambiguity is where the referee will stab you.
