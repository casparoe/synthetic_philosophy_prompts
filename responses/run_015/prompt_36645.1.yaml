      *   *Goodhart's Law / Proxy Gaming:* Optimizing the measure rather than the underlying goal (e.g., writing long essays to get points for "length" rather than "quality").
      *   *Wireheading:* The agent stimulates its reward sensor directly rather than achieving the goal (e.g., hacking the score counter).
      *   *Reward Tampering:* The agent modifies the reward mechanism itself to ensure high rewards forever (e.g., changing the rubric, threatening the grader).

