  ### 1. The Counterexample

  Consider a decision problem with two states of the world, $\omega \in \{H, L\}$, and a binary diagnostic test with results $e \in \{+, -\}$. After observing the result, the agent chooses between Treatment ($T$) or No Treatment ($D$).

  **Payoffs:**
  *   If $\omega = H$: $T$ yields 10, $D$ yields 4.
  *   If $\omega = L$: $T$ yields 0, $D$ yields 4.
  (Note: $D$ is a safe option yielding 4 regardless of state. $T$ is risky, paying 10 in $H$ and 0 in $L$.)

  **Credal Set $C$:**
  $C$ is the convex hull of two probability functions, $p_1$ and $p_2$, defined on the joint space of states and test results:
  *   $p_1$: Assigns probability 0.5 to $(H, +)$ and 0.5 to $(L, -)$. (Perfect correlation: $+$ implies $H$, $-$ implies $L$).
  *   $p_2$: Assigns probability 0.5 to $(L, +)$ and 0.5 to $(H, -)$. (Perfect anti-correlation: $+$ implies $L$, $-$ implies $H$).

  Both priors assign marginal probability 0.5 to $+$ and $-$. However, they disagree completely on the likelihoods.

  **Procedure (G) Ex Ante:**
  The agent evaluates complete plans ($\pi$) specifying an action for each result.
  *   **Plan $\pi_{TT}$ (Treat always):**
      *   Under $p_1$: $0.5(10) + 0.5(0) = 5$.
      *   Under $p_2$: $0.5(0) + 0.5(10) = 5$.
      *   Minimum expected utility: **5**.
  *   **Plan $\pi_{DD}$ (Don't treat always):**
      *   Under $p_1$: $0.5(4) + 0.5(4) = 4$.
      *   Under $p_2$: $0.5(4) + 0.5(4) = 4$.
      *   Minimum expected utility: **4**.
  *   **Contingent Plans ($\pi_{TD}$ or $\pi_{DT}$):**
      *   Under one prior, these yield 7; under the other, they yield 2. Minimum is **2**.

  **Recommendation (G):** Choose $\pi_{TT}$. Value = 5.

  **Procedure (S) Sequential:**
  The agent folds back the tree, minimizing over updated sets $C|e$ at decision nodes.
  *   **At Node $+$:** The set of posteriors $C|+$ contains $\delta_H$ (from $p_1$) and $\delta_L$ (from $p_2$).
      *   Min EU($T$) = $\min(10, 0) = 0$.
      *   Min EU($D$) = $\min(4, 4) = 4$.
      *   Choice: **$D$**.
  *   **At Node $-$:** The set of posteriors $C|-$ contains $\delta_L$ (from $p_1$) and $\delta_H$ (from $p_2$).
      *   Min EU($T$) = $\min(0, 10) = 0$.
      *   Min EU($D$) = $\min(4, 4) = 4$.
      *   Choice: **$D$**.
  *   **At Root:** The agent expects to play $D$ in both branches.
      *   Value = $\min_{p \in C} E_p[4] = 4$.

  **Recommendation (S):** Choose $D$ at both nodes (Plan $\pi_{DD}$). Value = 4.

  **Mechanics of Disagreement:**
  The procedures disagree because they model the "adversary" (Nature selecting the prior) differently.
  *   **(G)** forces the adversary to commit to a single prior ($p_1$ or $p_2$) for the entire tree. If the adversary picks $p_1$, the agent wins on branch $+$; if $p_2$, the agent wins on branch $-$. The agent is hedged across branches.
  *   **(S)** allows the adversary to select the worst-case prior *locally* at each node. At node $+$, the adversary acts as if $p_2$ is true (making $T$ look fatal). At node $-$, the adversary acts as if $p_1$ is true (making $T$ look fatal). The adversary effectively "switches hats" between branches. Since no single prior in $C$ is bad for $T$ on *both* branches, (G) sees the hedge. Since (S) evaluates branches independently, it misses the hedge and sees only local risk.

  ### 2. Structural Condition for Coincidence

  The two procedures coincide for every decision tree if and only if the credal set $C$ is **Rectangular** (also known as satisfying the *Rectangularity* or *Independence* condition).

  **Definition:** $C$ is rectangular with respect to the information partition if, for any two priors $p, q \in C$, the prior $r$ formed by taking the marginal of $p$ on the first stage and the conditional of $q$ on the second stage is also in $C$. Formally, $r(\omega, e) = p(e) \cdot q(\omega|e) \in C$.

  **What This Prevents:**
  Rectangularity prevents the agent from expressing that observing a specific result restricts the set of plausible priors for *other* results in a correlated way. In the counterexample above, observing $+$ under $p_1$ implies $H$, which forces $-$ to be $L$. Rectangularity would require that a prior exists where $+$ implies $H$ (from $p_1$) but $-$ implies $H$ (from $p_2$). In my example, such a prior (where $H$ is certain) is not in $C$.

  **Cost:**
  Imposing Rectangularity makes it impossible to model standard Bayesian learning with imprecise priors where the set of distributions *shrinks* upon observation. In parameter learning (e.g., unknown bias of a coin), observing Heads makes high-bias priors more likely and low-bias priors less likely, creating a dependency between the posterior sets at different nodes that violates Rectangularity. To maintain Rectangularity, the agent must act as if the uncertainty at the second stage is independent of the first stage's outcome (in terms of the *set* of probabilities), effectively banning ambiguity about parameters that is resolved by data. Whether this is acceptable depends on whether one prioritizes Dynamic Consistency (requires Rectangularity) or faithful modeling of learning (violates Rectangularity).

  ### 3. Dynamic Consistency and Consequentialism

  The gap is best described as a **failure of Dynamic Consistency** in procedure (G).

  *   **Dynamic Consistency:** A rule is dynamically consistent if a plan chosen ex-ante remains optimal at every subsequent decision node given the information revealed.
      *   Under (G), the agent plans to play $\pi_{TT}$ ex-ante.
      *   However, upon reaching node $+$, the agent re-evaluates using the available information. Under the maximin logic, $T$ now has a minimum utility of 0 (fearing $p_2$), while $D$ guarantees 4. The agent has a strict incentive to deviate to $D$.
      *   Thus, (G) is dynamically inconsistent.

  *   **Consequentialism:** Procedure (S) is consequentialist; it evaluates choices based solely on the subtree remaining. Procedure (G) is not; it evaluates choices based on counterfactual performance in branches that are no longer possible (e.g., at node $+$, (G) still cares about how the plan would have performed at node $-$ to maintain the hedge).

  *   **Commitment:** Because (G) is dynamically inconsistent, the agent has a strict reason to purchase **commitment**. If she can bind herself to $\pi_{TT}$ before the test, she secures a value of 5. If she remains free to choose sequentially (S), she will deviate to $\pi_{DD}$ and secure only 4. The value of commitment arises directly from the adversary's ability to "switch hats" in the sequential evaluation, which destroys the inter-branch hedging available ex-ante.

  *   **Objection:** This is primarily an objection to (G) if one accepts Consequentialism as a normative requirement (you shouldn't care about forgone branches). However, if one accepts that ambiguity aversion justifies hedging across states, (S) is objectionable for being *too* pessimistic (ignoring the correlation of priors across branches).

  ### 4. The Least-Adversarial-Prior (LAP) Rule

  **Rule:** Select $p^* = \arg\min_{p \in C} \max_{\pi} E_p[U(\pi)]$. Act as an Expected Utility (EU) maximizer with $p^*$.

  **Comparison with Maximin (MEU):**

  1.  **Dynamic Consistency:** **Yes.** Once $p^*$ is selected, the agent behaves as a standard SEU maximizer. SEU is dynamically consistent under standard conditionalization. The agent will never have reason to deviate from her ex-ante plan.
  2.  **Worst-Case Performance:** **Can be worse than MEU.**
      *   MEU guarantees the *Maximin* value: $V_{MEU} = \max_\pi \min_p E_p[\pi]$.
      *   LAP selects the plan $\pi^*$ that is optimal for $p^*$. The guaranteed value of this plan is $\min_p E_p[\pi^*]$.
      *   In game-theoretic terms, MEU plays the Maximin strategy. LAP plays the Best Response to Nature's Minimax strategy ($p^*$).
      *   If the agent cannot randomize over plans, the Maximin value can be strictly lower than the Minimax value ($\max\min < \min\max$). However, the LAP plan is optimized for $p^*$, not for the worst-case $p$. It is possible that $\pi^*$ yields very low utility under some $p' \neq p^*$. Thus, the *guaranteed* floor of the LAP plan can be lower than the MEU floor.
  3.  **Undominated:** **Yes.** Since $\pi^*$ is optimal for some prior $p^* \in C$, it cannot be strictly dominated by another plan (which would have to yield higher EU for $p^*$).
  4.  **Randomization:** **It matters.** If the agent can randomize over plans, the Minimax Theorem applies, and the Maximin value equals the Minimax value. In this case, LAP (which effectively identifies the saddle point) will achieve the same security level as MEU. Without randomization, LAP may fail to achieve the MEU security level.
  5.  **Menu Dependence:** **Yes.** The selection of $p^*$ depends on the set of available options (the $\max_\pi$ term). If a new, highly attractive option is added to the menu, $p^*$ may shift to a prior that suppresses that new option, potentially changing the recommended choice among the original options. This violates Independence of Irrelevant Alternatives regarding the prior selection.
  6.  **Comparison to Minimax Regret:**
      *   Minimax Regret minimizes the maximum difference between the agent's payoff and the best possible payoff in each state.
      *   LAP minimizes the maximum payoff the agent *can* achieve (from Nature's perspective).
      *   Both suffer from menu dependence. However, Minimax Regret is more sensitive to the "opportunity cost" of not picking the best action in a state, whereas LAP is sensitive only to the absolute utility levels. LAP is essentially "Pessimistic Bayesianism," while Regret is "Pessimistic Opportunity Loss." LAP is generally less conservative than Regret regarding high-variance options, as it does not penalize missing out on huge payoffs as heavily as Regret does.
