answer: |-
  **1. The escrow framing**
  Standard falsification treats prediction failure as immediate death. Malthusian Escrow treats it as deferred settlement. The niche isn't just "wait longer"; it's recognizing that some mechanisms (like population pressure) operate on timescales decoupled from their visible effects due to intervening variables (like technology). This framing distinctively separates *valid deferral* (known escape hatches) from *ad hoc rescue* (invented excuses). It shifts the philosophical burden from proving the theory true to proving the escape hatch is temporary. This matters for AI or climate because the feedback loop latency creates a zone where "wrong now" doesn't mean "wrong forever," but also doesn't mean "right eventually." We need norms to distinguish productive patience from dogmatic zombie theories. The core debt is explanatory: the theory owes a mechanism for the delay, not just a promise of future success.

  **2. Prioritized agenda**
  1. **Defining Valid Escape Hatches:** Before timing, we need criteria distinguishing legitimate delay mechanisms from ad hoc patches. This is strictly upstream; you cannot set a deadline if you haven't defined what resets the clock. Tractable via logical analysis of historical "rescues" (e.g., Green Revolution vs. mere data fitting). *Evidence shift:* If historians identify structural commonalities in successful vs. failed rescues, this becomes urgent.
  2. **The Sunset Clause:** Once a hatch is valid, how long does escrow last? This depends on Q1. Without a conceptual limit, escrow becomes infinite dogma. Philosophers can model this as a decay function of explanatory power over time. This directly impacts current forecasts: if an AI timeline misses, does the theory expire or renew? *Evidence shift:* If current forecasts consistently miss without mechanism updates, Q2 priority spikes.
  3. **Burden of Proof Allocation:** During escrow, who must prove what? The theorist must show the hatch is closing; the skeptic must show it's permanent. This dictates funding norms. *Evidence shift:* If research groups stall due to ambiguity here, this moves up.

  Ordering is strict: You can't time a process you haven't defined (Q1 before Q2), and you can't assign labor without rules and limits (Q1/Q2 before Q3). This agenda clarifies when to keep funding "wrong" theories that might be early. It prevents the "Malthus was right" post-hoc victory from validating endless deferment. The dependency is logical: definition precedes duration, which precedes administration. Tackling Q3 first is useless without Q1's taxonomy. Tractability is high for logicians: these are semantic and normative problems, not empirical ones. We aren't predicting AI; we are defining the rules for those who do. The implication for current forecasts is critical: it stops the binary "right/wrong" flip from destroying useful long-term models. If we solve Q1, we can immediately audit current climate or AI models to see if they are in valid escrow or just zombie theories. This prevents resources from locking into dead ends while protecting genuine long-horizon insight from premature dismissal. The evidence needed to reprioritize is meta-scientific: tracking how often "rescued" theories eventually pay off versus those that don't. If data shows rescues rarely work, Q1 becomes a tool for pruning, not protecting. Ultimately, this hierarchy ensures we don't build policy on theories that are merely un-falsified rather than confirmed.

  **3. What's overrated / dead ends**
  Overrated is the "Eventual Victory" narrative. Claiming Malthus was "right" ignores that his specific mechanism (food vs. population) was bypassed, not delayed. Formalizing this rewards bad science because it allows theorists to ignore disconfirmation indefinitely. Also, trying to assign precise probabilities to escrowed theories is a dead end; philosophers can't calculate the odds of AGI without ML expertise. Finally, historical case studies without normative framing are just storytelling. Knowing Malthus failed doesn't tell us how to handle AI risks now unless we extract the structural rules of failure. Avoid quantifying "truth likelihood" during escrow; focus on "justification stability." The former invites speculation; the latter invites rigorous norms. Don't try to solve the prediction; solve the evaluation of the prediction. We must reject the idea that "long-run" automatically grants immunity from falsification. Without strict boundaries, escrow becomes a shelter for dogma rather than a tool for patience.

  **4. The bottom line**
  Focus entirely on Question 1: Defining Valid Escape Hatches. Without a taxonomy of what counts as a legitimate delay, the concept of escrow collapses into "wait and see." This project is purely conceptual, fits the team's skills, and unlocks the other two questions. If they can't distinguish a Green Revolution from a made-up excuse, the rest of the agenda is useless. It provides the immediate tool to audit current long-horizon forecasts. Success here means we can finally say when a theory is paused versus when it is dead.
