  ### 3. Predictable Failure Modes & Fixes

  | Failure Mode | What Happens | How to Handle It |
  | :--- | :--- | :--- |
  | **The Signaler** | An "Observer" tries to cough or tap to count how many others are there. | **Prevention:** Enforce strict silence. Use noise-canceling headphones if possible. **Fix:** If caught, disqualify that round. Announce: "Anthropic uncertainty requires isolation. Signaling breaks the simulation." |
  | **The "Void" Rebel** | Someone who draws Red (Void) peeks or complains they want to bet. | **Prevention:** Make the blindfold/heads-down rule physical and immediate. **Fix:** Remind them: "In this world, you don't exist. You can't bet if you don't exist." |
  | **The Algebra Police** | During debrief, someone claims SIA isn't *exactly* indifferent in Split-Pot due to rounding or stakes. | **Fix:** Have the calculation pre-written on a hidden slide/board. Show the $N$ cancels out perfectly: $\frac{N}{N+1} \times \frac{1}{N} = \frac{1}{N+1}$. |
  | **The "I See You"** | Participants realize they can see how many people are still sitting up. | **Fix:** This is why barriers/blindfolds are non-negotiable. If the room layout allows visibility, use separate rooms or corners facing walls. |
  | **The Existence Conflator** | "But I *did* exist even if I drew Red!" | **Fix:** Acknowledge this in the Limitations section. "You simulated an observer finding out they aren't in the reference class, not non-existence. It's an epistemic simulation, not an ontological one." |

