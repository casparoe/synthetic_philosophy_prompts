answer: |-
  Here is a complete session plan designed to validate your algebra, force the disagreement into the open, and let the group "discover" SSA and SIA through their own wallets.

  ### Session Title: The Room, The Coin, and The Pot
  **Time:** 90 Minutes
  **Participants:** 12 (Ideal for $N=1$ vs $N=11$ split)
  **Stakes:** Chocolate coins or £1 tokens (Total pot needed: ~£50 equivalent)

  ---

  ### 1. Preparation & Props
  *   **The Coin:** One large, visible fair coin.
  *   **The Bags:** 12 opaque envelopes or bags.
      *   **Heads Setup:** 1 contains a **GREEN** card ("Observer"), 11 contain **RED** cards ("Void").
      *   **Tails Setup:** 11 contain **GREEN** cards ("Observer"), 1 contains **RED** card ("Void").
  *   **Barriers:** 12 dividers (cardboard boxes work) or blindfolds. Participants must not see who else is "Active."
  *   **Whiteboard:** For the debrief.
  *   **The "Cosmologist" Contract:** A printed slip for the Presumptuous Philosopher segment.

  ---

  ### 2. Run of Show (Minute-by-Minute)

  #### 0:00 – 0:10: The Setup (No Theory)
  *   **Welcome:** "Today we are playing a betting game. There is no lecture until the end. If you follow the rules, you can win real stakes. If you break the rules, you are disqualified."
  *   **The Mechanism:**
      1.  I will flip the coin (hidden result).
      2.  Based on the result, I will load the 12 envelopes (Heads: 1 Green/11 Red; Tails: 11 Green/1 Red).
      3.  You will each draw one envelope.
      4.  **Green:** You are an **Observer**. You stay seated, keep your barrier up, and place a bet.
      5.  **Red:** You are **Void**. You must immediately put on a blindfold, put your head down, and take no further part in the round. You get nothing, you lose nothing.
      6.  **Crucial Rule:** Observers cannot communicate or look at other Observers. You only know *you* are an Observer.
  *   **Check:** Ask the group if they understand that drawing Green means "I exist in this round" and drawing Red means "I do not count."

  #### 0:10 – 0:30: Round 1 (The "Per-Head" Regime)
  *   **Payoff Rule:** "If you guess the coin correctly, **every Observer** gets £5." (Total payout scales with $N$).
  *   **Action:**
      1.  Flip coin, distribute envelopes.
      2.  Red cards blindfold. Green cards stay alert.
      3.  Ask Observers to write down: **HEADS** or **TAILS**.
      4.  Collect bets.
  *   **Reveal:** Reveal coin. Pay out.
  *   **Expected Outcome:** Most will bet **Tails**.
      *   *Why:* Intuitively, "I'm here, so it's likely the world with more people." (SIA intuition).
      *   *Note:* If someone bets Heads, ask them why later. Don't correct them yet.

  #### 0:30 – 0:50: Round 2 (The "Split-Pot" Regime)
  *   **Payoff Rule:** "There is a fixed pot of £10 per world. If you guess correctly, the pot is split equally among all Observers in that world."
      *   If Heads (1 Observer): Winner gets £10.
      *   If Tails (11 Observers): Winner gets £0.90.
  *   **Action:**
      1.  Reset envelopes. Flip coin again. Distribute.
      2.  Red cards blindfold. Green cards stay alert.
      3.  Ask Observers to write down: **HEADS** or **TAILS**.
  *   **Reveal:** Reveal coin. Pay out.
  *   **Expected Outcome:** The room will split.
      *   SIA thinkers should feel **indifferent** (or weakly Tails).
      *   SSA thinkers should switch to **Heads**.
      *   *Observation:* Watch for the confusion. "Wait, if it's Tails, I'm more likely to exist, but the money is worse?"

  #### 0:50 – 1:05: The Presumptuous Philosopher Moment
  *   **Setup:** "We have one round left. But I'm offering a shortcut."
  *   **The Offer:** Hand out the **Cosmologist Contract**.
      *   *Option A (Empirical):* Play the round normally (Draw envelope, then bet).
      *   *Option B (Presumptuous):* **Skip the envelope draw.** You remain an Observer by fiat. You must place your bet *before* I even flip the coin.
      *   *Incentive:* Option B pays **double** stakes (Per-Head regime).
  *   **The Trap:** Option B forces them to rely *only* on the prior (1/2) vs. their anthropic reasoning about the setup.
      *   If they trust SIA ("I exist, so Tails is likely"), they should take Option B and bet Tails.
      *   If they think "Wait, I can't condition on existing before I exist," they might hesitate.
  *   **Action:** Let them choose. Execute the coin flip. Pay out.
  *   **Debrief Hook:** Ask the Option B takers: "How did it feel to bet without checking if you 'existed' in that world? Did you feel like you were skipping necessary data?"

  #### 1:05 – 1:20: The Debrief (Mapping the Math)
  *   **Step 1: The Algebra Verification (Your Claim)**
      *   Draw the table on the board. Let $N=11$.
      *   **Regime 1 (Per-Head):**
          *   **SIA:** $P(T) = 11/12$. Payoff = £5. $EU(T) = 55/12$. $P(H) = 1/12$. Payoff = £5. $EU(H) = 5/12$. **Choose Tails.**
          *   **1/2 Prior + Total Utility:** $0.5 \times (11 \times 5)$ vs $0.5 \times (1 \times 5)$. **Choose Tails.**
          *   *Conclusion:* SIA + Self-Interest $\equiv$ 1/2 Prior + Total Utilitarianism.
      *   **Regime 2 (Split-Pot):**
          *   **SIA:** $P(T) = 11/12$. Payoff = £10/11. $EU(T) = (11/12) \times (10/11) = 10/12$.
          *   **SIA:** $P(H) = 1/12$. Payoff = £10/1. $EU(H) = (1/12) \times 10 = 10/12$.
          *   *Result:* **Exact Indifference.** (Validate your friend's confusion here; this is the "aha" moment).
          *   **SSA:** $P(T) = 1/12$. Payoff = £10/11. $EU(T) = 10/132$.
          *   **SSA:** $P(H) = 11/12$. Payoff = £10/1. $EU(H) = 110/12$. **Choose Heads.**
          *   **1/2 Prior + Average Utility:** $0.5 \times (10/11)$ vs $0.5 \times (10/1)$. **Choose Heads.**
          *   *Conclusion:* SSA + Self-Interest $\equiv$ 1/2 Prior + Average Utilitarianism.
      *   **Verdict:** Tell your group: "The disagreement about probability (SSA vs SIA) is mathematically isomorphic to the disagreement about value (Average vs Total). You weren't arguing about math; you were arguing about whether a world with more happy people is better *in total* or *on average*."

  #### 1:20 – 1:30: Limitations & Failure Modes
  *   **Discussion:** Open the floor to what felt "fake."
  *   **The Big Lie:** Acknowledge that in the game, the "Void" people *did* exist (they were in the room). In real anthropics, the worry is "I might never have been born."
  *   **The Fix:** Explain that we simulated the *information structure*, not the metaphysics. We simulated "Learning that I am in the reference class," not "Coming into existence."
  *   **Closing:** "Next time you hear a Presumptuous Philosopher, ask them: Are you maximizing total utility or average utility? That's usually where the bodies are buried."

