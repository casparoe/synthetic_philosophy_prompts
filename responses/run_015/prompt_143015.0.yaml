answer: |-
  You are not being inconsistent. Your intuitions track a specific, philosophically defensible position often called **Moderate Consequentialism** (or Satisficing Consequentialism), but with a specific heuristic that most people use without naming it.

  The tension you feel between Case 6 (House) and Case 7 (Extra Work) is the key to unlocking your underlying principle. You treat **assets that provide security** differently from **discretionary labor capacity**, even if the monetary output is identical.

  Here is a precise principle that captures your pattern, followed by the verdicts it forces you to reconsider and how it handles your new cases.

  ### The Principle: "Foundational Security vs. Discretionary Surplus"

  > **Principle:** An agent is morally required to maximize good outcomes using their **discretionary surplus** (time, comfort, liquid cash), but is **not required** to compromise their **foundational security** (bodily integrity, stable housing, financial baseline, core relationships).

  *   **Foundational Security:** Resources that maintain your status as a functioning, stable agent (e.g., a home, basic health, a baseline income, family bonds).
  *   **Discretionary Surplus:** Resources that, if removed, would not destabilize your life plan (e.g., a latte, leisure time, extra labor hours, non-essential assets).

  #### How this principle maps to your cases:

  *   **Case 1 (Latte):** **Required.** This is discretionary surplus.
  *   **Case 2 (Min Wage):** **Not Required.** Dropping to minimum wage compromises *financial baseline security*.
  *   **Case 3 (Blood):** **Required.** Low cost, does not threaten *bodily security*.
  *   **Case 4 (Kidney):** **Not Required.** Violates *bodily integrity/security*.
  *   **Case 5 (Volunteer):** **Partial.** 5–10 hours is surplus; 40 hours compromises *agency/rest security*.
  *   **Case 6 (Sell House):** **Not Required.** Housing is *foundational security*. Downsizing significantly feels like a loss of status/stability, not just money.
  *   **Case 7 (Extra Work):** **Leaning Required.** Labor is *discretionary capacity*. As long as the work doesn't destroy your health (bodily security), it is considered "surplus" time you owe to the greater good.

  **Why Case 6 and 7 feel different to you:**
  Under this principle, a house is a *shield* (security), while labor is a *flow* (surplus). Destroying the shield (selling the house) feels like exposing yourself to risk. Increasing the flow (working more) feels like exertion. Your intuition is that you owe the world your exertion, but you do not owe the world your shield.

  ---

  ### The Cost: Which verdicts must you drop or refine?

  If you adopt this principle strictly, you have to refine two of your intuitions:

  **1. You must clarify Case 7 (The Extra Work).**
  If working an extra 20 hours a week for 10 years leads to burnout, chronic stress, or health decline, it transitions from "Discretionary Surplus" to a threat against "Bodily Security."
  *   **The Fix:** You cannot say Case 7 is required *unconditionally*. It is only required if you can sustain that workload without compromising your health baseline. If the 10-year grind destroys your health, the principle says **Not Required**.

  **2. You must define "Adequate Housing" in Case 6.**
  If your house is a $3M mansion and you downsize to a $500k home, you are still maintaining *foundational security* (you still have a stable home). The principle implies you **are required** to sell *excess* housing security.
  *   **The Fix:** You cannot say selling the house is *never* required. You are only protected up to the point of "reasonable stability." If your current house is luxury, the surplus equity is actually discretionary.

  ---

  ### Application to New Cases

  Here is how the **Foundational Security Principle** handles the scenarios you haven't mentioned yet.

  #### Case 8: The Vaccine (1-in-1000 risk to save strangers)
  *   **Verdict:** **Not Required.**
  *   **Reasoning:** A 1-in-1000 risk of severe harm or death is a direct threat to **Bodily Security**. Just like the kidney (Case 4), your body is a foundational asset. You are not required to gamble your foundational security, even for high utility.
  *   *Nuance:* If the risk were 1-in-1,000,000 (like a standard flu shot), it falls into "Discretionary Surplus" (minor discomfort/negligible risk) and becomes **Required**.

  #### Case 9: Caring for a Disabled Family Member vs. Working for Charity
  *   **Verdict:** **Required to care for family.**
  *   **Reasoning:** This principle can be expanded to include **Relational Security**. Core relationships (family, partners) are part of the "foundational" structure of a human life, not discretionary projects.
  *   *Why:* Abandoning a dependent family member to work for charity compromises the *integrity of your moral relationships*. A life without special obligations is psychologically and socially unstable. Therefore, the duty to family trumps the duty to maximize abstract charity, because family is part of your "baseline," whereas the strangers are the "beneficiaries of surplus."

  ---

  ### Alternative Principle: "The Disruption Threshold"

  If the Security Principle doesn't sit right, there is one other candidate that explains your Case 6 vs. 7 split.

  > **Principle:** You are required to make sacrifices that are **continuous and reversible**, but not sacrifices that are **one-time and structural**.

  *   **Case 6 (House):** Selling is structural. Once done, it's hard to undo. It changes your identity (homeowner to renter). **Not Required.**
  *   **Case 7 (Work):** Working extra is continuous. You can stop next year. It doesn't permanently alter your status. **Required.**
  *   **Case 2 (Min Wage):** Structural change to lifestyle. **Not Required.**
  *   **Case 4 (Kidney):** Permanent structural change to body. **Not Required.**

  **The Cost of this Principle:**
  This principle struggles with **Case 1 (Latte)**. Skipping a latte is continuous, but so is *saving the money*. However, it handles the **Vaccine Case** poorly. Taking a vaccine is a one-time act with permanent immunity (structural), yet most people feel a low-risk vaccine *is* required. The "Security" principle handles the vaccine better.

  ### Summary Recommendation

  Your intuitions are most coherently saved by the **Foundational Security Principle**.

  1.  **Keep:** Your distinction between Latte/Blood (Surplus) and Kidney/Min Wage (Security).
  2.  **Refine:** Your view on the House (Case 6). Ask yourself: "Is this house *security* or *luxury*?" If it's luxury, you might actually be required to sell it.
  3.  **Refine:** Your view on the Extra Work (Case 7). Ask yourself: "Is this sustainable?" If it burns you out, it becomes a security threat and is no longer required.
  4.  **Adopt:** The view that Family Care (Case 9) is a foundational duty, not a charitable option.

  You aren't inconsistent; you are a **Moderate Consequentialist with a Priority for Agency**. You believe morality demands you help others, but not at the cost of ceasing to be a stable, secure agent yourself.
