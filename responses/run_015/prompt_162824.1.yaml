      *   *Q7 (Binary vs. Graded):* The Dimmer Switch case.
          *   Option A: It's a yes/no property.
          *   Option B: It's a scale (0% to 100% understanding).
      *   *Q8 (Social Status):* The Rights case.
          *   Option A: Understanding grants rights.
          *   Option B: Rights are for humans only, regardless of understanding.

      *Refinement:* I need to make sure the *combinations* lead to the specific leaves requested.
      *   *Leaf 1 (Turing/Behaviorist):* Behavior is all. (Q1: Yes, Q2: Constitutive, Q3: Substrate irrelevant).
      *   *Leaf 2 (Chinese Room/Implementation):* Mechanism matters. (Q1: No, Q6: Knowledge changes verdict).
