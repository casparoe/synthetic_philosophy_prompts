      *   *Provenance:* Needs a question about training data (memorization vs. generation).
      *   *Substrate:* Needs a question about biology vs. silicon or simulation.
      *   *Binary vs. Graded:* Needs a question about partial understanding.
      *   *Social Status:* Needs a question about rights/treatment.
