      *   **Content:** Must cover specific distinctions (black box vs. mechanism, definition vs. evidence, competence symmetry, provenance, substrate, binary vs. graded, social status, architecture disclosure).
      *   **Required Leaves:** Turing/Behaviorist, Chinese Room/Implementation, Biological/Substrate, Predictive/Pattern, Skeptical/Other Minds, plus one "unnamed" leaf.
      *   **Constraints:** No jargon (e.g., don't ask "Are you a functionalist?"), concrete scenarios, flag collapsed leaves, identify useless distinctions, suggest a missing question.
