      *   *Unnamed:* Q1(A) + Q5(B) + Q6(B). (Behavior is enough, BUT biology is required? Contradictory unless biology is defined by behavior. Let's try: Q1(B) [No understanding] + Q4(B) [Result counts] + Q8(B) [Rights]. This is "Instrumental Moralism" - treat it well but don't call it understanding. Rare.)

