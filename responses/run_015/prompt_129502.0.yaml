answer: |-
  Good morning, everyone. Welcome.

  I know we have a slightly unusual split in the room today. About half of you could probably recite the opening lines of *De Senectute* in the original tongue before your first coffee. The other half of you, if I asked you who Cicero was, might ask if he comes with croutons. That is exactly why we are here. We are talking about institutional senescence, and frankly, the people who study ancient texts and the people who run modern bureaucracies are asking the same question: when does something old stop being wise and start being dead weight?

  I want to use these first ten minutes to do some actual philosophical lifting, not just warm-up. We're going to borrow a framework from Rome to diagnose our museums, our universities, and our regulatory bodies.

  Now, a quick note on the source material for the classicists in the back. You're actually ahead of the curve on this one. It is Cato the Elder speaking in that dialogue, not Cicero in his own voice. Cicero puts the argument in Cato's mouth to give it weight, to ground it in that old Roman sternness. So when we talk about the defenses of old age, we are talking about Cato's logic, framed by Cicero's pen.

  Cato outlines four major charges people bring against old age. He says critics claim old age: one, withdraws you from active affairs; two, weakens the body; three, strips away pleasures; and four, brings you too close to death. He spends the book dismantling these. I want to run those same four charges against our institutions. But here is the catch: the analogy holds for the first half, and then it breaks. And where it breaks is exactly where your work this weekend begins.

  First charge: Old age withdraws you from active affairs. Cato argues this is false; the old steer the ship even if they don't climb the rigging. They provide counsel.
  Apply this to a university or a regulatory body. An old institution often claims it is "steering" while actually just hoarding precedent. When a museum stops acquiring new work because it's too busy curating the old, is it steering? Or is it hiding? For humans, withdrawal can be a strategic shift to wisdom. For institutions, withdrawal is often just risk aversion. The philosophical work for us is to distinguish between stewardship—which is active—and conservation—which is often passive. Governance isn't about preserving the building; it's about preserving the mission, which sometimes requires tearing down the building.

  Second charge: Old age weakens the body. Cato says sure, the legs go, but the mind remains. You trade vigor for wisdom.
  This is where the first crack appears. An institution does not have a body, but it does have agility. It loses speed. It gets sluggish. But can it trade that speed for wisdom? A human mind can synthesize experience into judgment. An institution cannot. An institution doesn't have a mind; it has a memory archive and a set of procedures. When we say an agency is "wise," we usually mean it is bureaucratic. It relies on precedent, not judgment. Precedent is not wisdom; it's just history codified. So, when an institution gets old, it cannot rely on the Cato defense. It cannot say, "I am slow becuase I am deep." It must prove that its slowness protects something vital, not just that it protects itself.

  Third charge: Old age deprives you of pleasures. Cato argues that freedom from passion is a relief, not a loss. You enjoy the feast of conversation rather than the food.
  For an institution, what is pleasure? It's arguably the thrill of impact. A new NGO feels the rush of solving a problem. An old one feels the stability of existing. There is a danger here. If an institution stops seeking the "pleasure" of its mission—actual change in the world—and starts enjoying only the "pleasure" of its own continuity, it has become senescent. Governance must ask: are we enjoying the work, or just the paycheck? Cato says the old soul enjoys itself. An old institution often enjoys itself too much.

  Fourth charge: Old age is near death. Cato says this is natural. Fruit ripens and falls. It is not a tragedy; it is the completion of a cycle.
  This is where the analogy completely collapses. And this is the most important point for the bureaucrats in the room. Human death is biological. Institutional death is political.
  A person dies because their heart stops. An agency dies because a budget line was cut, or a minister signed an order, or a board voted to merge. There is no natural lifespan for a university. There is no biological clock for a museum. They can live forever, or they can be killed at birth.
  This means institutional senescence is not a fact of nature; it is a policy choice. When we keep a failing agency alive, we are not respecting nature; we are defying politics. We are deciding that the cost of keeping the zombie walking is lower than the cost of killing it.

  So, here is the philosophical work I want you to take into the sessions.
  Cato's defenses work for humans because nature provides a terminal point. Wisdom matters because time is short. Pleasure changes because the body changes.
  For institutions, none of those limits exist naturally. They must be imposed.
  If an institution cannot replace vigor with wisdom—because it has no mind to be wise—then what is the value of its age?
  If an institution does not die naturally, then who is responsible for deciding when it is time to let it go?

  The classicists here know that Cato eventually chose to end his own life rather than live under a tyranny he despised. He controlled his end. Our institutions rarely control theirs. They drift. They linger. They become shells.
  Your job this weekend is to figure out how to build governance structures that act like a biological clock for things that don't have biology. How do we build sunset clauses into permanency? How do we distinguish between an institution that is mature and one that is just waiting to be turned off?

  We aren't just managing organizations. We are managing mortality without biology. That is the hard problem.
  Let's get to work.
