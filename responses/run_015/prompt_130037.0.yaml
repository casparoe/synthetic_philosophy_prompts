answer: |-
  Here is the agenda. You have eight months and no empirical budget, which means you are building a formal and conceptual case, not a experimental one. Your team composition is ideal for this: the logician builds the engine, the philosopher ensures the concepts hold, and the cognitive scientist ensures the architecture is plausible. Do not waste time trying to simulate neural networks or dig into historical exegesis. You are solving a structural problem.

  Here are the three questions, ranked by priority.

  ### 1. The Formalization of Partial Structure (Upstream)
  **Question:** Can we construct a formal syntax that permits continuous parameters within discrete constituent structures without collapsing into vagueness or losing compositional semantics?

  **Why this is first:** This is the bottleneck. If you cannot write down the rules for what a "hybrid representation" looks like, you cannot prove it supports reasoning. Most discussions of analog thought remain metaphorical. Your logician needs to define a system where a symbol can have a "value" that is not just binary or discrete but retains structural relationships (like spatial proximity or magnitude) that are accessible to inference rules without first being digitized.

  **Team Allocation:** Lead with the Logician. The Phil Mind student supports by clarifying the metaphysical commitments of "structure." The Cog Sci person checks if the formalism is computationally interpretable.

  **Tractability:** High for this team. It requires formal logic and conceptual analysis, not data. You can define the system and test its internal consistency within eight months.

  ### 2. The Systematicity Proof (Downstream)
  **Question:** Does this formalism support systematic inference patterns (productivity and systematicity) without discretizing the analog components during processing?

  **Why this is second:** This is the deliverable. Once you have the syntax from Question 1, you must demonstrate that it solves the classic objection to non-classical LOT: that analog systems cannot handle systematic reasoning (e.g., if you can think "the ball is left of the box," you can think "the box is left of the ball") without translating thoughts into discrete symbols. If your hybrid system requires translation to reason, it's just classical LOT with an extra step. If it reasons directly on the hybrid structure, you have a result.

  **Team Allocation:** Lead with the Cog Sci person and Phil Mind student. They need to map the logical formalism onto inference patterns. The Logician verifies the proof validity.

  **Tractability:** Moderate. It depends entirely on the success of Question 1. If the syntax is too weak, you cannot prove systematicity. If it is too strong, it becomes classical symbolism.

  ### 3. The Identity Condition (Tertiary)
  **Question:** What are the individuation criteria for hybrid concepts? When is a spatial map one thought versus two co-occurring representations?

  **Why this is third:** This is metaphysical cleanup. It matters for the full theory of mind, but it is not required to prove the *possibility* of hybrid LOT. You can demonstrate that hybrid reasoning works (Questions 1 and 2) without fully solving how the mind counts these representations as single units. Do not let this bog down the sprint.

  **Team Allocation:** Phil Mind student.

  **Tractability:** Low impact for the timeline. This is a deep philosophical rabbit hole that rarely yields definitive results in short sprints.

  ---

  ### The Dependency Chain
  Question 1 is strictly upstream. You cannot attempt Question 2 without a defined syntax from Question 1. Question 3 is parallel but non-essential for the primary goal of demonstrating computational viability. If you spend month 3 debating Question 3 while Question 1 is unresolved, you will fail.

  ### The Flip Condition
  Here is the only theoretical result that should make you change this order: **If the Logician proves that "partial structure" is logically equivalent to "noisy symbolic structure."**

  If, within the first three months, the formal analysis shows that any analog parameter can be reduced to a sufficiently fine-grained discrete symbol set without loss of function, then the "hybrid" hypothesis collapses into classical LOT. If this happens, stop working on Question 1. Pivot immediately to defending classical LOT against the claim that it is biologically implausible, using your Cog Sci member to argue for the efficiency of the "noisy" encoding. Do not continue trying to carve out a niche for hybrid formats if the logic shows they are redundant.

  ### Distractions (Do Not Touch)
  1.  **Neural Implementation:** You have no lab. Do not try to map these representations to specific brain regions or neural firing patterns. That is empirical work. Stay at the computational/algorithmic level.
  2.  **Historical Exegesis:** Do not spend time summarizing Fodor, Pylyshyn, or Kosslyn beyond what is necessary to frame your specific objection. You are not writing a history paper; you are building a model.
  3.  **Phenomenology:** Do not argue from the "feel" of mental imagery. The fact that thinking feels spatial does not prove the representation is spatial. Stick to the structural and inferential properties.

  ### Execution Order
  *   **Months 1-3:** Logician defines the syntax (Question 1). Phil Mind clarifies definitions. Cog Sci checks plausibility.
  *   **Months 4-6:** Team attempts to run systematicity proofs on that syntax (Question 2).
  *   **Months 7-8:** Write up the results. If Question 2 succeeds, publish the formalism. If it fails, publish the impossibility proof (which is also a valuable result).

  Stick to this. Do not let the Phil Mind student drift into metaphysics before the logic is solid. Do not let the Cog Sci person drift into neural modeling. You are building a logical machine, not a brain. Get the syntax right, or nothing else matters.
