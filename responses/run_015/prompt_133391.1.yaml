      *   *Key Concept 2: Reinterpreting Self-Regarding Actions.* For Mill, autonomy requires rational deliberation. If a colonized subject acts based on "custom" (which Mill often equates with unthinking conformity), Mill might argue this isn't true autonomy. Therefore, interfering isn't violating liberty because there was no genuine liberty to begin with. It's paternalism justified by developmental necessity.
      *   *Key Concept 3: The Collapse of Universality.* The exception isn't just a footnote; it's structural. The Harm Principle protects *autonomy*, not just *biology*. If you lack the capacity for autonomy (due to developmental stage), the principle doesn't trigger.
