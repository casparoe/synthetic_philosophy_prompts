      *   *The "Developmental" Argument:* Mill seems to hold a progressive view of history (stadial theory). Peoples move from savagery to barbarism to civilization. Liberty is the privilege of the latter stage.
      *   *The Problem:* Who decides when a people are "ready"? Mill trusts the British Empire to be the benevolent despot. But this opens the door to arbitrary reclassification. If a practice is deemed "customary" rather than "rational," can it be suppressed for the subject's own good (paternalism)? Yes, according to Mill's colonial writings.
