answer: |-
  You are right to reject the standard Expected Utility (EU) explanation. Your intuitions are not inconsistent; they are **ergodic**. Standard decision theory treats choices as isolated snapshots in a parallel universe (ensemble average). Your brain treats choices as steps in a single timeline where you must survive to play again (time average).

  Your proposed principle ("fee on uncertainty I didn't agree to and can't spread") is 80% of the way there. It captures the *consent* and *diversification* aspects, but it misses the *absorbing state* (ruin) aspect which drives your 0.1% wipeout and skydiving intuitions.

  Here is the repaired principle, committed.

  ### The Principle of Robust Agency

  **Core Statement:** Rationality is not maximizing utility in a snapshot; it is maximizing the **duration and capacity of your agency over time**. Risk is not a cost to be balanced; it is a threat to continuity that must be managed via three filters.

  **Clause 1: The Ruin Barrier (Survival)**
  Any outcome that creates an absorbing state (death, irreversible bankruptcy, permanent disability) acts as a hard constraint, not a variable.
  *   **Mechanism:** You cannot average over time if you are not there to collect the average. Probabilities of ruin do not sum linearly; they compound toward certainty over repeated trials.
  *   **Confidence:** 95%. (This is mathematically grounded in Ergodicity Economics; see Peters & Gell-Mann).

  **Clause 2: The Control Premium (Consent & Mitigation)**
  Uncertainty carries a "tax" inversely proportional to your ability to influence the outcome or exit the situation.
  *   **Mechanism:** Voluntary risk (skydiving) includes hidden options (training, gear, aborting the jump). Involuntary risk (pollution) removes agency. You pay more to remove risks you cannot mitigate.
  *   **Confidence:** 80%. (Philosophically robust, harder to quantify mathematically).

  **Clause 3: The Linearity Threshold (Scale)**
  Risk neutrality is only permissible when the stake is negligible relative to your capacity to absorb loss and repeat the bet.
  *   **Mechanism:** If a loss does not impair future agency (Clause 1) and is small relative to total capacity, you treat money linearly. If the stake threatens capacity, you treat money concavely.
  *   **Confidence:** 90%. (Standard fiduciary and portfolio theory).

  ---

  ### Application to Your Verdicts

  Here is how this principle repairs your "pile of verdicts" without calling them irrational:

  1.  **$50k Certain vs. Coin Flip (Personal):** **Clause 3.** $50k is material to your personal agency capacity. Losing it hurts future choices. You are risk-averse because the stake is above your Linearity Threshold.
  2.  **$50k Certain vs. Coin Flip (Nonprofit):** **Clause 3.** The budget is designed to absorb variance. The stake is below the organization's Linearity Threshold. Risk neutrality is correct.
  3.  **1% $10M vs. $80k Certain:** **Clause 1 & 3.** The loss ($80k) is annoying but not Ruin (assuming you aren't wiped out by $80k). The gain ($10M) massively expands Agency. You are buying an option on agency expansion with capped downside. This is not risk-seeking; it is **asymmetric agency investing**.
  4.  **Skydiving vs. Plant:** **Clause 2.** Skydiving is high-control consent (you can choose not to jump at the door). The plant is zero-control imposition. The "fee" on the plant is infinite because you cannot mitigate it.
  5.  **Fire vs. Flood:** **Clause 1 & 3.** Fire is independent (insurable/spreadable). Flood is correlated (systemic). Correlation breaks the "repeatability" assumption of insurance. The Flood threatens the *system* you rely on, not just the asset.
  6.  **Small +EV (1x vs 10k):** **Clause 1.** No ruin risk. Law of Large Numbers applies. Take both.
  7.  **0.1% Ruin (1x vs 10k):** **Clause 1.** 1x is a survivable tax on uncertainty. 10k times makes Ruin a near-certainty ($1 - 0.999^{10000} \approx 99.99\%$). You correctly reject the repetition because the *time average* is zero.
  8.  **X-Risk vs. Pascal's Mugging:** **Clause 1 & 2.** X-Risk is a plausible Ruin threat (physical mechanism). Pascal's Mugging is a credibility failure (no mechanism to assess probability). You cannot apply a "fee" to an unknown probability; you must reject the premise to preserve Agency.

  ---

  ### The Daughter Case

  **Scenario:** 16-year-old, 1-in-500 serious injury/season. You did it; you'd do it now. She consents. You lie awake.

  **Verdict:** **Your anxiety is rational; you should restrict or heavily mitigate the activity.**

  **Application:**
  *   **Clause 1 (Ruin):** A "serious injury" at 16 is not just pain; it is a potential reduction of *future* agency (chronic issues, lost career paths). It approaches an absorbing state for her future potential.
  *   **Clause 2 (Control/Consent):** Her consent is developmentally limited. A 16-year-old brain cannot fully weight the *lifetime* cost of an absorbing state against a *seasonal* reward. Her "consent" does not clear the Control Premium because she lacks the capacity to understand the Ruin Barrier.
  *   **Clause 3 (Fiduciary):** As a parent, you are the guardian of her *future* Agency, not just her current happiness. You are optimizing for her 30-year-old self's capacity, which the 16-year-old self discounts.

  **Why "She Consented" Fails:** Consent only waives the "Control Premium" if the consenter understands the Ruin Barrier. She doesn't. You are not vetoing her risk; you are guarding her future continuity against a permanent reduction she cannot fully comprehend.

  **Confidence:** 75%. (This moves from math into ethics, but aligns with the fiduciary duty of parenthood).

  ---

  ### The Counter-Intuitive Case: The Commuter's Dilemma

  **Scenario:** You have a job that pays well. The commute involves crossing a specific busy intersection. The chance of a fatal accident per crossing is 1 in 1,000,000. You cross it 4 times a day, 250 days a year. You plan to work there for 20 years.

  **Initial Intuition:** "1 in a million is negligible. I'm not moving my life for that." (Most people reject the idea that this is a major decision).

  **Principle Verdict:** **Move house or change jobs.**

  **Reasoning:**
  *   **Clause 1 (Ruin):** Death is an absorbing state.
  *   **Calculation:** 4 crossings $\times$ 250 days $\times$ 20 years = 20,000 exposures.
  *   **Probability of Survival:** $0.999999^{20000} \approx 98\%$.
  *   **Probability of Ruin:** **2%**.
  *   **Analysis:** A 2% chance of death is not "negligible." It is astronomically higher than almost any other voluntary risk you take (driving overall is roughly 1% over a lifetime, not per job tenure). Your intuition treats the 1-in-1,000,000 as a snapshot (Ensemble). The Principle treats it as a trajectory (Time).
  *   **Why you'll reject it:** It feels paranoid. It feels like "living in a bubble."
  *   **Why you're wrong:** You are implicitly betting your entire future agency on a risk that compounds to a level no insurer would touch. The Principle of Robust Agency demands you reduce the *frequency* of exposure to Ruin, even if the *probability per event* is tiny.

  **Confidence:** 80%. (Mathematically sound on ergodicity, psychologically difficult to accept).

  ### Summary of Confidence

  *   **The Principle (Robust Agency):** 85% (Synthesizes Ergodicity, Fiduciary Theory, and Consent).
  *   **Clause 1 (Ruin):** 95% (Mathematically necessary for survival).
  *   **Clause 2 (Control):** 80% (Philosophically necessary for autonomy).
  *   **Clause 3 (Linearity):** 90% (Economically standard).
  *   **Daughter Verdict:** 75% (Ethical extension of the principle).
  *   **Commuter Verdict:** 80% (Mathematically correct, intuitively jarring).

  Your friend in risk management is likely using Value-at-Risk (VaR) or similar ensemble metrics. You are using **Survival-at-Risk**. You are right. The market can stay irrational longer than you can stay solvent; similarly, the universe can average out risks longer than you can stay alive.
