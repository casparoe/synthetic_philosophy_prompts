answer: |-
  **Title:** The Tax on Assertion
  **Event:** Fiction and Truth
  **Speaker:** [Novelist]

  Good morning. It is a slightly terrifying thing to stand between a room of philosophers who suspect the word "truth" is a logical placeholder, and a room of readers who suspect it is a holy grail. Usually, a novelist in my position would try to bridge this gap by suggesting that fiction possesses a *higher* truth than mere fact. I am not going to do that. To the philosophers, it sounds like mysticism. To the readers, it sounds like a consolation prize.

  Instead, I want to take the philosophers' skepticism seriously. Not as a critique of literature, but as a tool for writing it.

  Let's assume, for the sake of this talk, that the deflationists are right. Let's assume that to say a sentence is "true" adds nothing to the sentence itself. If I say, "It is raining," and you say, "That is true," you haven't identified a hidden property in my statement; you have just agreed that it is raining. Truth, on this view, is not a substance. It is a stamp of endorsement. It is a way of saying, "I stand behind this. You can act on this."

  If we accept this, the traditional promise of the novel collapses. The novel cannot promise to deliver "Truth" as a special commodity, because truth isn't a commodity. It is a relationship between a speaker, a sentence, and the world.

  This brings me to the specific problem of my own work. For the last ten years, I have written in what reviewers have politely called a "secondhand manner." In my last three books, nothing is asserted outright. There is no omniscient narrator telling you what happened. Every claim reaches the reader as something overheard, reported, or leaked by a character with an interest in slanting it. A character says, "I heard that the bank failed." Another writes in a letter, "She seemed happy." The text never asks to be believed. It only asks to be read.

  If truth is endorsement, my books are machines for withholding endorsement. I am not telling you the bank failed; I am telling you that *someone said* the bank failed. Technically, the only "true" statement in the book is that the statement was made. The content of the statement is left floating.

  So, here is the test case. If truth talk adds nothing substantial to the sentence itself, what is lost, and what is gained, when a book withholds assertion altogether?

  What is lost is authority. In a traditional realist novel, the narrator pays the tax on assertion. They say, "Elizabeth was angry," and they take the risk that Elizabeth might not have been angry. They put their credit on the line. This creates a certain efficiency. The reader can relax into the world because someone else has vouched for its coordinates.

  In my books, that tax is not paid. I do not vouch for the coordinates. This means the reader cannot relax. You are constantly checking the source. You are asking, "Why is this character telling me this? What do they gain if I believe them?"

  Some might call this a loss of truth. I call it a gain in fidelity to human experience. In our actual lives, we almost never encounter bare facts. We encounter reports. We encounter rumors, press releases, confessions, and denials. We rarely have the godlike perspective of the omniscient narrator. We are always in the position of the secondhand reader.

  By withholding assertion, I am not hiding the truth. I am replicating the conditions under which you actually have to find it.

  If deflationism teaches us that "true" is just a device for endorsement, then fiction that refuses to endorse forces the reader to become the endorser. The work of truth-making is outsourced to you. When you read a sentence like "He said she was guilty," and you feel a chill of recognition, that recognition is not a property of the text. It is an action you perform. You are saying, "I know this dynamic. I know how accusation works."

  The novel, then, does not give you true sentences to store in your memory. It gives you a simulation of the social environment in which sentences are used. It trains your ability to navigate testimony.

  This is where the deflationary view does structural work for the novelist. If truth were a deep, hidden property, my method would be a failure, because I am burying the facts under layers of hearsay. But if truth is about utility and endorsement, then my method is a different kind of utility. It is not a map of the territory; it is a simulator for the compass.

  So, what is the gain? The gain is agency. When a novelist asserts, "This is how the world is," they treat the reader as a passenger. When a novelist reports, "This is how the world was described," they treat the reader as a judge.

  There is a risk here. The risk is cynicism. If nothing is asserted, does anything matter? If I never say "This is true," do I slide into a posture where nothing is real?

  I think the opposite happens. By refusing to claim the authority of truth, I force the reality of the situation to bear down on the reader without the buffer of authorial guarantee. You have to decide if the bank failed. You have to decide if she was happy. And you have to decide based on the messy, slanted evidence provided. That is a heavier burden than accepting a narrator's word. It requires more of your attention.

  To the philosophers in the room: I am not claiming my novels correspond to reality in a way that other novels do not. I am claiming they correspond to the *epistemic situation* of the reader.

  To the readers in the room: I am not claiming my books reveal a deeper spiritual truth. I am claiming they offer a more rigorous exercise in judgment.

  If we stop looking for Truth as a noun, and start looking for truthing as a verb—as something we do with sentences—then the secondhand manner is not a evasion. It is an invitation. It says: I will not tell you what is true. I will tell you what is at stake when people claim things are true.

  In a world saturated with information that demands our belief, a book that refuses to demand belief is a rare thing. It creates a space where you can think without being told what to think. It respects your capacity to evaluate.

  So, let us abandon the idea that fiction captures truth like a butterfly in a jar. Fiction does not capture truth. It stages the encounters where truth is claimed, contested, and sometimes, rarely, agreed upon. My books simply clear the stage of the one voice that usually drowns out the others: the author's own.

  If you leave here today looking for a deeper truth, you will be disappointed. But if you leave here looking for a better way to handle the claims the world makes on you, then perhaps the novel has done its work. Not by telling you what is true, but by reminding you that the responsibility for that judgment is, and always has been, yours.

  Thank you.

  ***

  **Note on the Speech**

  This address leans on a contested pragmatic reading of deflationism. Strict deflationists argue that the predicate "is true" is merely a logical device for disquotation or generalization (e.g., "Everything he said is true"). They might object that I have shifted the goalposts from *truth* to *trust* and *utility*. By arguing that the value of the novel lies in the reader's *action* (endorsing, judging, navigating), I am smuggling in a pragmatic theory of truth (truth is what works/is useful for inquiry) under the cover of deflationism. A hardline deflationist would say I am changing the subject: whether a sentence is useful or trustworthy is distinct from whether it is true.

  Furthermore, the speech quietly substitutes *accuracy of representation* (does this book feel like real life?) for *truth of proposition* (are the sentences in this book true?). I argue that withholding assertion gains "fidelity to human experience," which is an aesthetic or phenomenological claim, not a semantic one. I am asking the audience to accept that a book can be "honest" about the human condition without asserting "true" propositions, effectively redefining literary truth as a form of interpersonal reliability rather than semantic correctness.
