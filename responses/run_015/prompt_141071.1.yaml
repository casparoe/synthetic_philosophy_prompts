answer: |-
  This is a specification for the **State Update Mechanism** of a real-time planning system. In engineering terms, the "Frame Problem" is not a metaphysical puzzle about persistence; it is a problem of **representation complexity** and **update latency**.

  You need a mechanism that transitions State $S_t$ to $S_{t+1}$ given Action $A$, such that the cost of computing $S_{t+1}$ does not scale with the size of the universe, only with the size of the change.

  Here are the desiderata for your spec, categorized by Engineering Hard Constraints vs. Architectural Preferences.

  ### Part 1: The Core Desiderata (The Spec)

  #### 1. Bounded Update Complexity (The "Frame-to-Payload" Constraint)
  *   **Definition:** The computational cost to compute $S_{t+1}$ must be $O(E)$, where $E$ is the number of fluents (state variables) explicitly affected by Action $A$. It must *not* be $O(N)$, where $N$ is the total number of fluents in the system.
  *   **Concrete Case:** Your robot has 10,000 state variables (battery, location, map status, 9,990 inventory slots). It executes `PickUp(Box_5)`. This changes 3 variables (robot hand status, Box_5 location, inventory count). Your update mechanism must not iterate over the other 9,997 variables to confirm they didn't change.
  *   **Status:** **Genuine Requirement.** Violating this causes latency spikes as the domain grows, violating hard real-time deadlines.

  #### 2. Elaboration Tolerance (The "Edit-Locality" Constraint)
  *   **Definition:** Adding a new Action type or a new State Variable should not require modifying the update logic of existing, unrelated Actions or Variables.
  *   **Concrete Case:** You add a new sensor `Wifi_Signal_Strength`. You should not have to go back and edit the code/logic for `Move_Forward` to explicitly state that `Move_Forward` does not change `Wifi_Signal_Strength`. The mechanism should assume persistence by default.
  *   **Status:** **Genuine Requirement.** Violating this creates $O(N^2)$ maintenance coupling. In a warehouse, new sensors and actions are added constantly.

  #### 3. Projection Efficiency
  *   **Definition:** The system must be able to answer queries about future states (e.g., "Will Box_5 be on the dock after 10 moves?") without simulating every intermediate step if a logical shortcut exists.
  *   **Concrete Case:** The planner needs to heuristic-search 50 steps ahead. If calculating the state at step 50 requires running 50 sequential state-updates, search is too slow. You need a way to compose effects (e.g., matrix multiplication, regression) to jump ahead.
  *   **Status:** **Genuine Requirement (for Planning).** If you are only *executing* a plan, this is less critical. If you are *generating* plans, this is a hard constraint.

  #### 4. Handling of Indirect Effects (The Ramification Problem)
  *   **Definition:** The mechanism must derive implicit changes caused by physical laws or domain constraints without explicit enumeration in every action.
  *   **Concrete Case:** If `Robot_Location` changes to `Charging_Station`, `Battery_Charging_Status` must implicitly become `True` due to a domain constraint ("If at station, then charging"). The `Move_To_Station` action should not have to hard-code the battery status change; the state mechanism should resolve it.
  *   **Status:** **Genuine Requirement.** Hard-coding indirect effects leads to inconsistent states (e.g., robot at station but not charging).

  ---

  ### Part 2: Evaluation of Your Candidates

  You proposed two specific candidates. Here is the evaluation:

  #### Candidate 1: Edit-Locality
  *   **Verdict:** **Real Desideratum.**
  *   **Analysis:** This is not an engineering smell; it is the definition of **Modularity** applied to knowledge representation. In software, we encapsulate state. In AI planning, "frame axioms" (explicit statements that $X$ doesn't change) violate this. If you have to edit `Move` every time you add a new property to `Robot`, you have tight coupling.
  *   **Why it matters:** In a warehouse, you will add a `Temperature_Sensor` next year. If your planner breaks or requires a redeployment of all action definitions because you added a variable, your architecture is brittle.
  *   **Implementation Note:** This is usually solved by "Successor State Axioms" (Reiter) or object-oriented state encapsulation, where persistence is the default assumption.

  #### Candidate 2: Frame-to-Payload Ratio
  *   **Verdict:** **Real Desideratum (Critical).**
  *   **Analysis:** This is the computational essence of the Frame Problem. If the "overhead" of deciding what didn't change scales with the total world size, you cannot scale the warehouse.
  *   **Why it matters:** This distinguishes a **Database/Struct update** (good) from a **Theorem Prover** (bad). A theorem prover might try to *prove* `Box_2_Did_Not_Move` for every box every step. That is $O(N)$. You need $O(1)$ persistence.
  *   **Implementation Note:** This rules out pure logical inference engines for the *execution* loop. You need a procedural or compiled representation for the step function.

  ---

  ### Part 3: Taste vs. Requirement (The Philosophical Baggage)

  You asked which demands are genuine and which are one camp's taste.

  | Desideratum | Verdict | Reasoning |
  | :--- | :--- | :--- |
  | **Stay Declarative** | **Taste** | You can solve the frame problem with mutable structs and dirty flags (procedural). It works. Declarativity helps with *Projection* (Requirement #3), but is not strictly required for *Execution*. |
  | **Classical Logic (Monotonic)** | **Taste (mostly)** | Real robots deal with sensor noise and contradictions. Strict classical logic often breaks in physical deployment. Non-monotonic logic (default assumptions) is actually *better* suited for frame assumptions (things stay same *unless* known otherwise). |
  | **One Mechanism for All** | **Taste** | Trying to use the same engine for high-level planning, low-level control, and diagnostic reasoning is a "Unified Theory" dream. In practice, hybrid systems (Logic for planning, Code for execution) often win. |
  | **Explicit Negative Effects** | **Requirement** | You must know what *falsehoods* become true. (e.g., `Holding` becomes false). But you do **not** need explicit negative *Frame* axioms (what stays false). |

  ---

  ### Part 4: Incompatible Desiderata

  You asked to flag pairs that cannot be satisfied together. In system design, you usually trade off **Expressiveness** against **Tractability**.

  **The Incompatibility: Elaboration Tolerance vs. Execution Speed**
  *   **Conflict:** The more modular and declarative your system is (high Elaboration Tolerance/Edit-Locality), the more runtime inference is usually required to resolve state constraints (Ramifications).
  *   **Concrete Case:** If you define constraints logically ("If At_Station then Charging"), the system must check all constraints after every action to ensure consistency. As you add more constraints (to improve modularity), the check time grows.
  *   **Resolution:** You must compile the logical constraints into the action effects offline. You sacrifice some Edit-Locality (you have to re-compile the domain) to gain Execution Speed.

  **The Incompatibility: Projection Efficiency vs. Rich State Semantics**
  *   **Conflict:** If you want to query the future without simulation (Requirement #3), you often need to restrict the kinds of state changes allowed (e.g., linear equations, boolean masks). If you allow arbitrary code/functions to determine state changes, you cannot project; you must simulate.
  *   **Resolution:** Restrict your action language (e.g., PDDL, STRIPS) to allow analytical projection, rather than allowing arbitrary Python functions inside actions.

  ---

  ### Part 5: The "Killer" Requirement

  If you insist on one requirement that rules out the most candidate solutions (especially the academic/logic-heavy ones), it is:

  **Bounded Update Complexity (Frame-to-Payload Ratio)**

  **Why:**
  1.  **Rules out Pure Theorem Proving:** Approaches that treat state transition as a logical deduction (e.g., "Prove $S_{t+1}$ from $S_t$ and $A$") typically fail this. They often require checking consistency against the whole knowledge base.
  2.  **Rules out Naive Situation Calculus:** Without "Successor State Axioms" optimization, the history of actions grows linearly, making state retrieval $O(t)$.
  3.  **Rules out Full World Simulation:** Copying the entire world state object for every timestep violates this if the state is large.

  **The Winner's Profile:**
  The solutions that survive this cut are usually **Compiled/Procedural**.
  *   **STRIPS/PDDL:** Pre-computes add/delete lists. $O(E)$ update.
  *   **Successor State Axioms (compiled):** Logic is compiled into code that only touches affected variables.
  *   **Object-Oriented State:** Only dirty objects are updated.

  ### Summary Recommendation for Your Spec

  1.  **Adopt "Persistence by Default":** The system assumes nothing changes unless an action explicitly claims it. (Satisfies Edit-Locality).
  2.  **Enforce $O(E)$ Updates:** The state transition function cannot iterate the global state. (Satisfies Frame-to-Payload).
  3.  **Compile Constraints:** Do not check domain constraints (ramifications) at runtime. Compile them into the action definitions during domain loading. (Resolves the Elaboration vs. Speed conflict).
  4.  **Drop Classical Logic Purity:** Use a data structure that supports "unknown" or "default" values if needed, but prioritize the update speed over logical provability.

  If a proposed solution requires you to enumerate "frame axioms" (what doesn't change) or iterate the full state vector on every step, reject it. It will not scale to 10,000 fluents.
