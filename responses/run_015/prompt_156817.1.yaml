answer: |-
  Here is a breakdown of the metaphysical landscape followed by an essay arguing for a specific resolution to your friend's puzzle.

  ### Brainstorming the Metaphysical Landscape

  To tackle this, we need to separate two distinct problems that often get tangled. The first is **Synchronic Constitution** (the statue and the clay existing at the same time). The second is **Diachronic Identity** (the statue existing today versus the statue existing fifty years from now). Your friend's puzzle is primarily about the second, but it relies on intuitions from the first. Here are the three main frameworks we use to map this territory:

  **1. The Constitution View (Coincidentalism)**
  This view holds that the statue and the lump of marble are two distinct objects that happen to occupy the same space at the same time. They share the same matter, but they have different "modal properties." The lump of marble could survive being crushed into a pile of dust; the statue could not. The statue is defined by its form and artistic history; the lump is defined by its material.
  *   *Relevance to your puzzle:* This helps explain why the statue is more than just atoms, but it doesn't fully solve the time-travel aspect. If the statue is distinct from the atoms, does it matter if we swap the atoms?

  **2. The Strict Identity View (Monism)**
  This is the hard-nosed materialist take. It argues there is only one object here. The statue *just is* the clay. If you say they are different, you are multiplying entities beyond necessity. To make this work, proponents often have to argue that the statue and the clay share all properties, which leads to awkward conclusions (e.g., if the clay survives crushing, the statue must too, which contradicts our definition of a statue).
  *   *Relevance to your puzzle:* If the statue is strictly identical to its atoms, then replacing every atom means the original statue is gone. This contradicts our intuition about the gradual replacement scenario.

  **3. Four-Dimensionalism (Perdurantism/Worm Theory)**
  This view suggests that objects do not just exist in the present moment. Instead, they are "space-time worms" that stretch across time. An object is the sum of all its temporal parts (its "time-slices"). The statue today is just one slice of the larger worm that is the "Statue-Throughout-History."
  *   *Relevance to your puzzle:* This is the most powerful tool for your specific scenario. It allows us to talk about the continuity of the "worm" without needing every single atom to remain constant. It shifts the question from "Is this matter the same?" to "Is this space-time path continuous?"

  ***

  ### The Continuity of Causation: Why Teleportation Kills the Statue

  The scenario your friend proposed is a modern hybrid of two classic philosophical thought experiments: The Ship of Theseus (gradual replacement) and the Teletransporter Paradox (scan-and-rebuild). The intuition you share with most people is that the gradual replacement preserves the statue, while the scan-and-rebuild destroys it. The question is whether this intuition tracks a real feature of reality or if it is merely a psychological bias toward smooth visual transitions.

  To answer this, we must look beyond the material. If material constitution were the sole criterion for identity, the gradual replacement would fail just as surely as the teleportation. After fifty years, not a single original atom remains in the museum lab case. If the statue were strictly identical to its specific atoms, the statue would have ceased to exist the moment the first atom was swapped. Since we intuitively feel the statue survives the swap, we have already admitted that **material overlap is not the primary glue of identity.**

  So, if it isn't the atoms, is it just a psychological trick? Are we merely biased toward continuous change because our brains process smooth narratives better than discontinuous jumps? While there is a cognitive element to how we track objects, dismissing the distinction as *mere* bias is a metaphysical mistake. There is a genuine ontological difference between the two scenarios, and it lies in **Causal Continuity.**

  In the gradual replacement scenario, there is an unbroken chain of cause and effect connecting the statue at year one to the statue at year fifty. The state of the statue at any given moment is causally dependent on its state in the previous moment. The structure is maintained through a continuous physical process. The object persists because there is a continuous world-line—a path through space-time—where every stage evolves naturally from the prior stage.

  In the scan-and-rebuild scenario, that causal chain is severed. The replica is not caused by the original in the right way. It is caused by a *description* of the original. The information flows from the statue to the computer to the printer, but the physical history is broken. The original is destroyed; the new one is built based on a blueprint. Even if the result is atomically identical, the history is not. The replica's existence does not depend on the continued physical evolution of the original; it depends on the data.

  Therefore, the difference is not psychological; it is historical. An object is not just a collection of properties arranged statue-wise; it is a process with a history.

  This leads us to a defense of a **Four-Dimensionalist view grounded in Causal Continuity.** On this view, the "Statue" is a space-time worm. In the gradual replacement case, the worm is continuous. In the teleportation case, the worm is cut, and a new, qualitatively identical worm is started elsewhere.

  Why prefer this view? Because it respects the reality of processes. In physics and biology, we accept that organisms replace their cells constantly. You are not made of the same matter you were made of seven years ago. Yet, you are the same person. Why? Because your biological processes form a continuous causal chain. If we were to scan you, destroy you, and print a copy, the copy would have your memories and scars, but it would not be *you* in the metaphysical sense, because the causal process that constitutes your life was terminated.

  To claim this is "just psychology" is to claim that history doesn't matter, only the present arrangement of matter does. But history *does* matter. We treat a forged painting differently from an original even if they are visually indistinguishable. We treat a natural diamond differently from a lab-grown one even if they are chemically identical. We care about the genesis of things. The metaphysical status of an object includes its origin and its path through time.

  ### The Verdict

  Here is the conclusion you can stand on for your feature: **Gradual replacement and instantaneous rebuild are genuinely different metaphysically, and the work is being done by Causal Continuity, not material overlap or artistic intention.**

  The gradual replacement preserves the object because it maintains the continuous causal history that constitutes the object's existence through time. The scan-and-rebuild creates a duplicate because it severs that history.

  **What am I giving up to take this stand?**

  By taking this side, I am sacrificing the common-sense notion of **Endurantism**. This is the intuitive belief that objects are "wholly present" at every moment of their existence—that the statue is fully here now, and fully here tomorrow. To accept Causal Continuity and Four-Dimensionalism, you must accept that objects are extended through time like they are extended through space. The statue is not just the slice you see today; it is the entire history from the quarry to the museum to the dust heap.

  I am also giving up the comfort of **Qualitative Identity**. We want to believe that if two things look exactly the same, they are the same. This view forces us to admit that two things can be perfect qualitative matches (atom for atom) and yet be numerically distinct entities because their histories diverge.

  This is a heavier metaphysical price than it sounds. It means that "you" are not a static thing, but a flowing event. It means that identity is fragile, dependent on the unbroken chain of cause and effect. But it is the only view that respects both our scientific understanding of material flux and our deep-seated intuition that how we get somewhere matters just as much as where we are. The museum lab preserves the statue's life; the 3D printer writes a eulogy and starts a new book.
