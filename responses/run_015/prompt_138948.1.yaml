answer: |-
  There is no established single term in the philosophical literature that captures the triadic structure you have described. There are concepts that touch upon the edges—*social norms* (Bicchieri), *fair play* (Rawls/Hart), *expressive theory of law* (Anderson), and *strict liability* in tort—but none carve out the specific asymmetry of reactive attitudes based on the *direction* of deviation (under- vs. over-compliance) and the *survival of resentment despite ignorance*.

  To give you the carving you require, I will propose a term for the phenomenon, define it, delineate its boundaries against its nearest neighbours, and then address your specific questions regarding the mechanism of foreignness and the moral status of the obligation.

  ### The Term and Definition

  **Term:** **The Asymmetry of Equilibrium Threat.**

  **Definition:** A normative phenomenon wherein reactive attitudes (resentment, irritation, amusement) toward a deviation from a social convention are determined not by the deviation itself, but by whether the deviation is legible as a threat to the stability of the cooperative equilibrium underpinning the practice.

  **The Carving:**
  The phenomenon is not about the violation of a rule *per se*. It is about the **preservation of the practice**.
  1.  **Under-compliance (Case 1):** Legible as *exploitation*. It threatens the equilibrium by encouraging reciprocal defection (if I don't tip, why should you serve well? If you don't tip, why should I serve?). It triggers **Resentment** because it invokes the norm of *Fair Play*.
  2.  **Benign Over-compliance (Case 2):** Legible as *excess*. It does not threaten the equilibrium; it merely sits outside it. It triggers **Amusement/Embarrassment** because it invokes the norm of *Competence* or *Fit*, but not *Fairness*.
  3.  **Malign Over-compliance (Case 3):** Legible as *obstruction*. It threatens the equilibrium by impeding the coordination the convention is meant to solve (traffic flow). It triggers **Irritation** because it invokes the norm of *Efficiency*.

  The asymmetry lies here: **Under-compliance is prima facie legible as a threat to the practice's existence (defection). Over-compliance is prima facie legible as harmless, unless it actively impedes the practice's function (obstruction).**

  ### What It Is Not (Boundary Cases)

  To sharpen the edges, we must distinguish this from three neighbouring concepts:

  **1. It is not merely "Violating a Social Norm."**
  *   *Nearest Neighbour:* Cristina Bicchieri's distinction between empirical expectations (what others do) and normative expectations (what others think one should do).
  *   *Departure:* In Case 2, the visitor violates the empirical expectation (no one tips here) and arguably the normative one (one ought not to tip here). Yet, there is no resentment. If this were simply about norm violation, Case 2 should generate a sanction similar to Case 1. The Asymmetry of Equilibrium Threat explains why Case 2 is sanctioned lightly (it doesn't break the game) while Case 1 is sanctioned heavily (it breaks the bank).
  *   *Boundary Test:* If a visitor wears formal wear to a casual party (violating a norm), they are laughed at (Case 2). If they eat the food without bringing the expected contribution to a potluck (violating a norm), they are resented (Case 1). The difference is the *cost to the cooperative structure*.

  **2. It is not "Culpable Ignorance."**
  *   *Nearest Neighbour:* The legal and ethical principle that one is responsible for ignorance if one ought to have known.
  *   *Departure:* As you noted, the judgment in Case 1 ("he should have found out") operates differently than standard culpable ignorance. In standard culpable ignorance, we blame the *past* negligence that led to the ignorance. In the Asymmetry of Equilibrium Threat, the "should have known" is a *present* requirement of participation. It functions as a condition of entry, not a retrospective blame.
  *   *Boundary Test:* A child who does not tip is not resented (ignorance is excused by capacity). A long-term resident who does not tip is resented (ignorance is treated as choice). The threshold is not moral culpability in the past, but *epistemic availability* in the present.

  **3. It is not "Harm Principle" Violation.**
  *   *Nearest Neighbour:* Mill's harm principle or standard consequentialist accounting.
  *   *Departure:* In Case 1, a single instance of non-tipping often causes no tangible harm (the server survives one lost tip). Yet the resentment is disproportionate to the material loss. The "harm" is to the *integrity of the convention*, not the wallet.
  *   *Boundary Test:* If a visitor steals a napkin (material harm), they are viewed as a thief. If they don't tip (conventional harm), they are viewed as a *cheat*. The reaction tracks the *type* of violation (property vs. practice), not the magnitude of loss.

  ### The Mechanism of Foreignness

  You asked whether the boundary regarding visible foreignness operates because perceptible foreignness makes the ignorance reading available, or because long residence makes the ignorance itself culpable.

  **Diagnosis:** It is the **Epistemic Availability of the Ignorance Hypothesis.**

  It is not that residence makes the ignorance culpable in a moral sense (i.e., "you sinned by not learning"). It is that residence makes the ignorance *incredible*.

  *   **Visible Foreigner:** The observer's model of the agent includes "lack of local knowledge" as a high-probability variable. Therefore, the behavior is categorized as *Error*. Error does not threaten the equilibrium (it is noise).
  *   **Long-term Resident:** The observer's model of the agent includes "local knowledge" as a fixed variable. Therefore, the behavior cannot be categorized as *Error*. It must be categorized as *Choice*.
  *   **The Pivot:** Once the behavior is categorized as *Choice*, the Asymmetry of Equilibrium Threat kicks in. A chosen under-compliance is *Defection*. Defection triggers Resentment.

  This explains why the "should have known" reply feels different in Case 1 than in standard negligence. It is not a moral indictment of their past study habits; it is a reclassification of their current status from "Guest" (exempt from equilibrium maintenance) to "Participant" (bound by equilibrium maintenance). The moment you are legible as a Participant, you are legible as a potential Defector.

  ### The Moral Question: Obligation or Fairness?

  You asked whether this tells us if everyday conventions are moral obligations, and whether visitors must follow them.

  **1. Are Conventions Moral Obligations?**
  No. They are **Obligations of Fair Play within a Practice.**
  The resentment in Case 1 is indeed "free-rider detection wearing the vocabulary of obligation." This distinguishes the norm from a genuine moral duty (like "do not kill") and a mere habit (like "shake with the right hand").
  *   *Genuine Moral Duty:* Binding regardless of participation.
  *   *Mere Habit:* No reactive attitude upon violation.
  *   *Obligation of Fair Play:* Binding *conditional* on accepting the benefits of the practice.

  In Case 1, the visitor accepts the service (the benefit). The convention (tipping) is the cost structure of that benefit. To take the benefit while withholding the cost is to violate the principle of Fairness. This is why the resentment feels moral: it *is* moral, but it is a *relational* morality, not a universal one.

  In Case 3, the irritation is not about fairness; it is about *coordination*. The visitor is not free-riding; they are stalling the machine. This is why the reaction is irritation rather than resentment. Resentment implies a moral debt unpaid; irritation implies a friction introduced.

  **2. Must Visitors Follow Local Conventions?**
  The Asymmetry of Equilibrium Threat yields a non-uniform answer, as you suspected.

  *   **When the Convention is Distributive (Case 1):** Yes. If the convention governs the distribution of costs and benefits within a service exchange (tipping, queuing, splitting bills), the visitor is bound by the **Duty of Fair Play**. To opt out is to exploit the locals who are bound by the rule. The visitor is effectively saying, "I will accept your service at the price you set for yourselves, but I will not pay the price I set for myself." This is parasitic.
  *   **When the Convention is Coordinative (Case 3):** Yes, but for a different reason. If the convention governs coordination (driving side, jaywalking, greeting rituals), the visitor is bound by the **Duty of Non-Obstruction**. Over-compliance here is not parasitic, but it is obstructive. The visitor must conform not because it is "fair," but because deviation creates friction for the system.
  *   **When the Convention is Symbolic (Case 2):** No. If the convention is purely symbolic or gratuitous (tipping where wages are high, dress codes that impose no cost on others), the visitor is not bound. Over-compliance here is benign. Under-compliance might be rude, but it does not trigger the "Defection" alarm unless it signals a broader refusal to integrate.

  ### Summary of the Carving

  The phenomenon you are circling is **The Asymmetry of Equilibrium Threat**.

  *   **Core Mechanism:** Reactive attitudes track the perceived threat to the stability of the cooperative practice, not the violation of the rule itself.
  *   **The Asymmetry:** Under-compliance is presumptively threatening (Defection). Over-compliance is presumptively benign (Error), unless it creates friction (Obstruction).
  *   **The Role of Ignorance:** Ignorance is an excuse only insofar as it prevents the behavior from being read as a *Choice*. Once the agent is legible as a Participant (via residence or visible capacity), ignorance is no longer a valid category, and the behavior is judged as a Choice.
  *   **Normative Status:** These are not universal moral obligations. They are **Conditional Obligations of Participation**. Visitors are bound by them only to the extent that they accept the benefits of the practice (Fairness) or impact the function of the practice (Coordination).

  This explains why the resentment in Case 1 survives the revelation of ignorance: the revelation does not change the fact that the *equilibrium was threatened*. The "should have known" is not a claim about the visitor's past epistemic diligence; it is a claim about their current status. It asserts: "You are now in the game. In this game, this move counts as a strike against us."
