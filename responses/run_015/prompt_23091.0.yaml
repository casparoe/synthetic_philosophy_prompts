      *   *Self-Correction on Constitutivity:* Williamson argues KNA is the *constitutive rule* of assertion. Like the rule "checkmate ends the game." If you violate it, you are still asserting, but you are *wrong* to assert. The student says "isn't a genuine assertion." This is a common misunderstanding. It's a defective assertion, not a non-assertion.
