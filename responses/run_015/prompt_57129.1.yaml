answer: |-
  ### I. Mapping the Agent: Subsumption and Category

  The first difficulty in running the Luddite case through Marx's apparatus is categorical. The "Machinery and Modern Industry" chapter of *Capital* Volume One presupposes the dominance of the factory system and the **real subsumption of labour**. In this schema, the worker is fully separated from the means of production, and the machine sets the pace of work. The agent of history here is the collective worker, stripped of craft autonomy, confronting the automatic system.

  The Luddites do not fit this ontology. The framework knitters of the Midlands were largely domestic outworkers who owned or rented their frames; they were petty producers partially integrated into merchant capital, not factory proletarians. The croppers of the West Riding were highly skilled artisans defending a craft monopoly. Even the Lancashire weavers resisting power looms were often handloom operators working in small shops, not yet the tenders of the automatic mule.

  Consequently, Marx's account of machinery arrives historically "early" but categorically "late." It misdescribes the episode if taken as a snapshot of 1812, because the social relation of production had not yet hardened into the binary of bourgeoisie and proletariat that *Capital* analyzes. The knitters were not fighting the alienation of the machine from the worker, but the alienation of the *product's quality* from the worker's reputation. They were fighting to preserve a mode of production where skill still commanded a price, not yet fighting to seize the means of production.

  However, the theory does not merely misdescribe; it identifies the vector. The Luddite disturbances mark the transition from formal to real subsumption. The gig mill and the power loom were the wedge driving the artisans into the proletariat. Marx's categories are not wrong, but they are prospective. The Luddites are the "pre-history" of the industrial proletariat Marx describes. To treat them as the mature agents of the *Capital* narrative is to commit an anachronism; to treat them as irrelevant to it is to miss the genesis of the relation. The agent in 1812 is not yet the "free" worker selling labour-power, but the dependent producer fighting to avoid becoming one.

  ### II. Explanation and Failure: The Crux of Distinction

  When we test the *Capital* Vol. 1 account against the specific features of 1811–13, we find a mix of predictive power and diagnostic inversion.

  **What the Theory Predicts:**
  Marx's account accurately predicts the alignment of the state and the logic of deskilling. The deployment of troops, the Frame-Breaking Act, and the executions at York confirm Marx's insistence that the state functions as the executive committee of the bourgeoisie when property relations are threatened. The resistance of the croppers to the shearing frame aligns with Marx's deskilling thesis: the machine was not introduced solely for efficiency, but to bypass the need for the seven-year apprenticeship, thereby lowering wages and breaking the workers' bargaining power. The violence directed at the instrument is also anticipated; Marx notes that workers initially attack the "material instruments of production."

  **The Crux: Selectivity and Legalism:**
  The friction arises in the *motivation* for the violence. Marx writes that it took time for workers to "distinguish between machinery and its employment by capital." He implies a cognitive error: the workers hate the iron because they do not yet understand the social relation. The Luddite evidence inverts this. The violence was selective; frames belonging to compliant masters were spared. The knitters petitioned for the restoration of statutory regulation. They *did* distinguish between the machine and its use. They attacked frames used to produce "deceitful" goods (wide frames that stretched the fabric), not frames *per se*.

  Does this rescue Marx's diagnosis? Only partially. It rescues the political verdict but undermines the psychological one. Marx argues the distinction leads to attacking the mode of production. The Luddites made the distinction but concluded the remedy was the *restoration* of a regulated capitalism, not its overthrow. They distinguished between the *abuse* of capital and *legitimate* capital. They sought to police the master, not abolish the mastership.

  Therefore, the episode suggests Marx was right about the *limit* of the struggle (it remained within the horizon of capital) but wrong about the *nature* of the confusion. The Luddites were not cognitively confused about the social relation; they were politically committed to a moral economy that capital was in the process of obliterating. They did not attack the machine because they thought it was the enemy; they attacked the machine because it was the weapon being used to violate the existing social contract. Marx's claim that they had not "learnt to distinguish" is too generous to the workers' consciousness and too dismissive of their political strategy. They saw the relation clearly enough to petition Parliament about it; they simply lacked the structural power to enforce it without violence.

  **Silences:**
  The theory leaves silent the *legalistic idiom* of the movement. The appeal to "General Ludd" and the reliance on old statutes suggest a struggle over legitimacy and custom, not just surplus value. Marx's economic determinism struggles to account for the power of tradition and the specific demand for quality regulation over wage rates alone.

  ### III. The Verdict on the Fragment

  The *Grundrisse* "Fragment on Machines" describes a phase where the worker stands beside the production process as a regulator, where science becomes a direct force of production, and where labour time ceases to be the measure of wealth.

  Does the Luddite episode bear on this? Yes, but as a negative image. The Luddite disturbances represent the violent *onset* of the process the *Fragment* describes as a *culmination*. The gig mill was indeed an "expropriation of craft knowledge," objecting skill into iron. However, the *Fragment* treats this objectification as a smooth evolution toward the "general intellect." The Luddite case reveals the *cost* of that transition: it is not merely technical but coercive. The transfer of skill into the machine was not a liberation of the worker from toil, but a dispossession of their leverage.

  This difference costs the *Fragment* its optimism. The *Fragment* assumes that once labour time is no longer the measure of wealth, value production collapses. The Luddite case shows that capital will fight violently to *maintain* labour time as the measure of wealth even when technology renders it obsolete. The masters insisted on the wide frames not because they produced better goods (they did not), but because they allowed for the extraction of surplus value through lower skill costs. The *Fragment* posits a contradiction between technology and value; the Luddite case shows the resolution of that contradiction in favour of value, enforced by the state. The "general intellect" did not dissolve capitalism; it was weaponized to deepen subsumption. The episode suggests the *Fragment* underestimates the political resistance capital will mount to prevent the logical conclusion of its own technological development.

  ### IV. Judgement Among the Competing Readings

  Running the Luddite case through the four competing readings of Marx on automation yields the following verdict:

  1.  **Automation erodes the measure of value (Value-Crisis Reading):** The episode **contradicts** this. If automation inherently undermined the foundation of value, the state would not have needed to deploy 12,000 troops to protect the mills. The violence indicates that the measure of value was under threat *politically*, not that it was collapsing *economically*. Capital was strong enough to enforce the measure of value against the workers' resistance.
  2.  **Machinery is a disciplinary instrument (Disciplinary Reading):** The episode **strongly supports** this. The selection of the gig mill and wide frame was driven by the need to break the power of the skilled croppers and knitters. The state's intervention confirms that the primary function of the machinery in this phase was to secure the subordination of labour, even at the cost of product quality.
  3.  **Value survives as anachronistic (Postone Reading):** The episode **partially supports** this, but with a caveat. The Luddites were fighting *for* the validity of labour-time as a measure (fair work for fair pay) against a system that was making it anachronistic (shoddy goods via machines). However, Postone's reading suggests the crisis is internal to value. The Luddite case shows the crisis is externalized as class war. The theory holds, but the mechanism is more violent than Postone's structural account suggests.
  4.  **Machines chosen for control rather than efficiency (Braverman/Labour-Process Reading):** The episode **best supports** this. The grievance regarding "fraudulent and deceitful" goods on the wide frames is decisive. The technology was adopted not because it was more efficient in terms of output quality, but because it allowed the master to bypass the skill barrier and reduce wage costs. This is the definition of control-driven technological change.

  **Final Judgement:**
  The Luddite case best supports the **Labour-Process Reading (Braverman)** combined with the **Disciplinary Instrument Reading**. The historical evidence demonstrates that the introduction of machinery was driven by the class struggle over the labour process itself, specifically the deskilling of the workforce to reduce dependency on craft autonomy. The state's intervention confirms that the preservation of this disciplinary function was paramount.

  The case **underdetermines** the *Grundrisse*-based Value-Crisis readings. There is no evidence in 1811–13 that the system was collapsing due to the inability to measure value; rather, the system was successfully reconfiguring itself to measure value in new, more exploitative ways. The theory has **nothing to say** about the specific *legalistic* and *moral* economy of the Luddites. Marx's categories explain why the machines were introduced and why the state repressed the workers, but they cannot fully account for why the workers framed their resistance as a defence of custom and statute rather than a prefiguration of socialism. That gap remains the limit of the economic critique when applied to the moment of transition.
