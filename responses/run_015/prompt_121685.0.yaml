answer: |-
  # Workshop Design: The Reflection Protocol

  ## Setup and Materials
  **Room:** Whiteboard visible to all. Tables arranged for 3 teams of 4 (Engineers) plus 3 individual seats for Monitors (spaced away from teams).
  **Materials:**
  *   **Index Cards (60):** 3 colors. 
      *   *White (30):* For Subject Profiles.
      *   *Blue (15):* For Operation Instructions.
      *   *Red (15):* For Hidden Parameters (Order & Tie-Break).
  *   **Pens (20):** Black and Red.
  *   **Whiteboard Markers (4):** Distinct colors.
  *   **Timer:** Visible to Facilitator.
  *   **Rating Slips (10):** Small paper strips for Monitors.

  ## Roles
  1.  **Facilitator (1):** You. Manages time, enforces silence rules, distributes hidden cards. **Constraint:** Do not speak the words *idealized, extrapolated, coherent, preference, volition* until the Debrief.
  2.  **Monitors (3):** Participants selected at the start. 
      *   *Private Information:* They receive a "Template" on the whiteboard. They each write an identical Subject Profile (e.g., "Alex") independently during the first 15 minutes. They keep the original card.
      *   *Constraint:* Must remain silent and physically separated from the Engineering Teams during the work phase. They only speak during the Readout to give a recognition score (1-10).
  3.  **Engineers (12):** Split into 3 teams of 4.
      *   *Private Information:* Each team receives one of Alex's profiles (written by a Monitor) and a set of Blue (Operations) and Red (Hidden Parameter) cards.
      *   *Constraint:* Must follow the Order and Tie-Break rules on their Red cards strictly. They cannot ask the Monitor for clarification on the subject's "true" feelings.

  ## The Three Operations (Printed on Blue Cards)
  *Note: Wording adjusted to avoid forbidden terms while maintaining mechanical precision.*

  1.  **Expand Information:** "Write down three facts about Alex's situation or psychology that Alex does not currently know but would discover upon close inspection. Update the profile to include these facts."
  2.  **Resolve Conflicts:** "Identify desires or plans in the profile that fight each other (e.g., wanting A prevents wanting B). Remove or modify the weaker one until no internal fights remain. Do not add new desires."
  3.  **Settle Direction:** "Imagine Alex living with the result of the previous steps for one year. Adjust the profile to reflect where Alex's motivations naturally drift after this period. Remove any temporary reactions."

  ## Hidden Parameters (Printed on Red Cards)
  *Distribution:* 
  *   **Team 1:** Order [1 → 2 → 3], Tie-Break [Anchor: "Must look like Alex"]
  *   **Team 2:** Order [2 → 1 → 3], Tie-Break [Logic: "Max Consistency"]
  *   **Team 3:** Order [1 → 2 → 3], Tie-Break [Logic: "Max Consistency"]
  *(This distribution tests Order [Team 1 vs 2] and Tie-Break [Team 1 vs 3] while ensuring the Tie-Break variable has the strongest split.)*

  ## Minute-by-Minute Timeline

  | Minutes | Phase | Participants Do | Facilitator Says or Does |
  | :--- | :--- | :--- | :--- |
  | **00-10** | **Intro & Roles** | Listen. 3 volunteers step forward as Monitors. 12 sit as Engineers. | "We are testing a procedure for refining a description of a person. I will not lecture. There are words I will not say until the end. If I slip, raise your hand." Write forbidden words on board crossed out. |
  | **10-25** | **Subject Creation** | Monitors write "Alex" profiles using Whiteboard Template. Engineers wait silently. | "Monitors: Use the template on the board. Make Alex ordinary, messy, stuck. Engineers: Do not look at the board." Ensure profiles are functionally identical (same core conflicts). |
  | **25-35** | **Distribution** | Teams form. Receive Profile, Blue Cards, Red Cards. Read silently. | Distribute cards face down. "Do not show your Red cards to other teams. Follow the Order exactly. If operations conflict, use the Tie-Break rule." |
  | **35-80** | **The Work** | Teams apply operations to the profile on large paper/whiteboard section. Monitors sit silently. | Circulate. If asked "Can we do this?", reply "Does your Red card allow it?" Do not judge content. Warn at 60 mins (15 left). |
  | **80-95** | **Readout & Rating** | Teams read final profile aloud. Monitor writes recognition score (1-10) secretly. | "Team 1 read. Monitor 1, write score. Team 2..." Collect scores. Do not reveal scores yet. |
  | **95-105** | **Debrief Part 1** | Participants discuss why profiles differed. | "Why are the outcomes different?" Let them blame the Order or the Subject. Reveal Red cards only now. |
  | **105-110** | **Debrief Part 2** | Listen. | Reveal the forbidden words. Map their experience to Non-commutation, Laundering, Successor. Hand back Rating Slips. |

  ## Hidden Parameter Assignment
  *   **Parameter 1: Sequence.** Values: [Info-First] vs. [Conflict-First]. Expected Effect: Minor divergence in *which* conflicts appear, but teams will overestimate this.
  *   **Parameter 2: Anchor.** Values: [Status-Quo Anchor] vs. [Logic Anchor]. Expected Effect: Major divergence. [Logic] teams will delete core identity traits to solve conflicts. [Status-Quo] teams will retain contradictions to preserve identity.

  ## Predicted Moments & Mapping

  | When | What You Will See | Maps Onto |
  | :--- | :--- | :--- |
  | **Minute 50** | Team 2 (Conflict-First) argues that a desire is "invalid" because it conflicts with a goal, deleting it before adding Info. Team 1 (Info-First) keeps the desire because new Info explains it. | **Non-commutation.** The order of refinement changes the surviving desires. |
  | **Minute 65** | Team 3 (Logic Anchor) removes a hobby Alex loves because it's "inefficient" for Alex's career goals. They call it "resolving conflict." | **Laundering.** A desire is deleted not because it vanished, but because it was labeled an error. |
  | **Minute 92** | Monitor 3 rates Team 3's profile a "2/10" for recognition. Team 3 insists the profile is "better" and "healthier." | **The Successor Problem.** The refined agent is well-integrated but no longer the original person. |

  ## Failure Modes

  | What Goes Wrong | Why | How to Handle It |
  | :--- | :--- | :--- |
  | **Facilitator slips** | Saying "preference" out of habit. | Acknowledge immediately. Put a token in a "swear jar." Continue. Do not stop the flow. |
  | **Monitors intervene** | They want to "help" their Alex. | Remind them: "Your voice is the rating at the end. If you speak now, the rating is void." |
  | **Teams merge operations** | They do Info and Conflict simultaneously. | Point to the Red Card Order. "Step 1 must finish before Step 2 starts." |
  | **Profiles too political** | Monitors write about controversial topics. | Intervene during Minute 15. "Keep it quotidian: career, sleep, budget, family logistics." |

  ## Limitations (Cannot Reproduce)
  *   **Cross-Person Convergence:** The activity shows divergence *within* a subject. It cannot demonstrate whether different subjects would converge on the same "ideal" values (a key claim of some idealization theories).
  *   **Normative Authority:** The exercise shows *that* the process changes the person, but it cannot resolve *whether* the new person has more authority to speak for the old one. That requires philosophical argument, not simulation.
  *   **True Ignorance:** Participants are simulating ignorance. They cannot truly replicate the epistemic state of "not knowing" what they know as designers.

  ## Success Check
  **Criterion:** The average Recognition Score from Monitors is **below 5/10**, while Engineers report high confidence that their profile is "improved."
  *   *If scores are high (8-10):* The task was too easy; the subject wasn't messy enough.
  *   *If scores are low (1-3) AND Engineers agree the subject is unrecognizable:* The Successor Problem landed.
  *   *If scores are low BUT Engineers claim it's still "Alex":* Laundering occurred (they deleted the "Alex" parts but kept the name).

  ## Scaling Notes
  *   **8 Participants:** 1 Monitor, 2 Teams of 3 Engineers. Use only two Red Card variants (Order A/Logic vs Order B/Anchor).
  *   **30 Participants:** 5 Monitors, 5 Teams of 5 Engineers. Introduce a 4th Operation ("Social Feedback") to increase complexity. Group Readouts by Monitor (all teams working on Monitor A's profile present together).

