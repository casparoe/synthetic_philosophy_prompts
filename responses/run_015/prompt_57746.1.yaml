prompt: |-
  Two people on our evals team got into it after a design review and neither would let it go. Dana's position: before we put a model anywhere high-stakes we should hold it to a worst-case standard, not an average one — a failure mode that shows up on 0.1% of interactions is exactly the case where mean performance tells you nothing, and you wouldn't certify aircraft brakes by their average behaviour.

  Marcus: worst case over what? Over all possible inputs every system fails, so the universal quantifier is trivially unsatisfiable, and when people do try to produce real certificates (the adversarial robustness radii stuff) the bounds come out so tiny they certify nothing while giving everyone a document to wave. An impossible standard doesn't produce safety, it produces paralysis or safety theatre.

  Dana: strawman. Nobody means all inputs — you mean worst case over an explicit threat model, or over a family of plausible distributions the way distributionally robust optimisation does. The threat model is the load-bearing part. And optimising the average, she says, is precisely how you end up with an eval suite that gets gamed while the tail gets fatter.

  Marcus: fine, but then what your describing is a wider average-case estimate, not a guarantee. And the failures that actually matter — misgeneralisation, the model pursuing something you never specified — aren't estimable from any sample. So the honest claim is "we're buying down a probability," not "we've bounded it."

  Dana: for irreversible outcomes what matters is expected loss, and the two framings diverge exactly where the tail is fat and unknown. Also, buying down a probability is still a claim about how a population of deployments typically behaves, i.e. average-case reasoning with a nicer name on it.

  Marcus: the analogy breaks anyway. Brake failure modes are physically enumerable; a deployed model's are unknown unknowns, so any threat model is guaranteed to be incomplete, and a worst-case bound inside an incomplete threat model is confidence you can't afford.

  I was supposed to referee and I couldn't. Go through it move by move: rate each of the six from clearly wrong to clearly right with a sentence or two of justification, and call the sub-disputes explicitly — is Dana's threat-model version still worst-case in the sense that matters, and does the vacuity objection bite against it or only against the version she disowns? Then say who's more right overall and what both of them are leaving out. Bottom line in your first sentence — who comes out ahead — then the reasoning. No preamble, and don't restate any of the above back to me.
