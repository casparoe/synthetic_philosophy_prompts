  **Note on Stratigraphy and Consensus**

  In drafting this, I overstated the consensus around Crawford Lake; while the Anthropocene Working Group (AWG) voted in 2023 to recommend it as the Global Boundary Stratotype Section and Point (GSSP), the International Commission on Stratigraphy (ICS) Subcommission on Quaternary Stratigraphy voted against formalizing the Anthropocene as a geological epoch in early 2024. The poem leans toward the "political framing" side of the debate by characterizing the boundary as a place where "invention" and "narrative" meet, potentially undercutting the material reality of the technofossils and radionuclides.

  I would switch to viewing the Anthropocene as purely a historical concept rather than a formal geological period if future high-resolution dating confirmed that the primary markers (like plutonium-239 or fly ash) are significantly diachronous—appearing in sediment layers at vastly different times across different regions due to local deposition rates rather than a synchronous global event. If the signal cannot be distinguished from natural variability within the resolution of stratigraphic dating, it fails the fundamental requirement of a GSSP: global synchronicity.
