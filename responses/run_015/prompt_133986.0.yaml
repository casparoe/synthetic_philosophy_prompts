          *   *Pros:* Radically avoids committing to past reality (because it commits to *no* time reality).
          *   *Cons:* Struggles with *irreversibility*. If time is an illusion, why is the illusion so stubbornly one-way? Borges admits this is a paradox he can't fully solve (hence the "Refutation" is tentative). He tends to dissolve the problem rather than solve it. If the past is unreal, the "trace" is just a current perception, but why does that perception constrain future perceptions (i.e., why can't I perceive the vase as whole again)? Borges relies on the discontinuity of the self, which makes causal traces hard to ground.

      *   **Indexed Presentism:**
          *   *Pros:* Acknowledges the reality of the *trace* (the shards) right now. It explains irreversibility through the *structure* of the present causal chain. The "index" acts as a record. It respects the intuition that the past is gone but its effects remain.
