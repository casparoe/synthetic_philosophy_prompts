prompt: |-
  I am a high school student working on an independent philosophy project, and I would like you to answer in American English. Please compare Jorge Luis Borges's view that linear temporal succession is essentially an illusion—that past, present, and future are not genuinely separate ontological categories, as he argues in his essay on the unreality of time—with a position I will call indexed presentism. By indexed presentism, I mean the claim that only present objects exist, but each present moment is anchored to its own specific causal chain rather than to a single universal now, so that what we call the past survives only as present causal traces and not as real past entities. Between these two frameworks, which offers the more coherent account of why we experience irreversible causal traces—such as a shattered vase—without committing us to the full reality of past events? Please defend your answer with clear reasoning.
