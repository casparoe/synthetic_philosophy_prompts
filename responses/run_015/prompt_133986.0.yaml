          *   *The Shattered Vase:* For Borges, the "shattered vase" and the "whole vase" are distinct perceptions. The idea that one *caused* the other relies on the illusion of continuity.

      *   **Indexed Presentism (User's Definition):**
          *   *Core Argument:* Only the present exists (Presentism). However, it modifies standard presentism by adding "indexing" to causal chains.
          *   *Ontology:* Present objects are real. Past objects are not.
          *   *Causality:* The past exists *as* traces in the present. The "indexing" suggests that the present moment carries the "signature" of its specific causal history without needing the history itself to exist ontologically.
          *   *The Shattered Vase:* The shards exist now. Their arrangement *is* the trace. The "past event" of breaking doesn't exist, but the *evidence* of it does, anchored to this specific present.

