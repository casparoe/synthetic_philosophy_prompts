          3.  **Senior's Rebuttal (Meaning fixed outside $\rightarrow$ Thought fixed outside):** Oversimplified. Assumes a tight link between language and thought that needs argumentation (Language of Thought hypothesis vs. Public Language).
          4.  **Postdoc's Rebuttal (Belief $\neq$ Sentence):** Strong point. Pre-linguistic creatures or non-linguistic thoughts challenge the "piggyback" view.
      *   *What They Are Missing:*
