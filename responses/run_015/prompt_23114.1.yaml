  9.  **Finalizing the Content:** (Mental check of Burge 1979). Burge's argument is that a person can have a belief involving a concept (arthritis) even if they don't fully grasp the definition, provided their community uses it that way. This relies on social norms, not physical causation. Twin Earth relies on physical causation (H2O vs XYZ). The Senior conflates these. The Postdoc catches the structural difference.

