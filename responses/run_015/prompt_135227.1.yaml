answer: |-
  **Title:** The Suicide of Eliminativism: How Pragmatic Defense Neuters the Radical Claim

  The central provocation of eliminative materialism (EM) has always been its ruthlessness. When Paul and Patricia Churchland argue that folk psychology (FP)—our everyday vocabulary of beliefs, desires, and intentions—is a radically false theory destined to be discarded like phlogiston or witchcraft, they are not proposing a reduction. They are proposing an execution. However, this radicalism invites a devastating performative contradiction: if there are no beliefs, the eliminativist cannot *believe* eliminativism is true. To navigate this, proponents have increasingly retreated to a pragmatic defense, suggesting that mentalistic talk is merely a "social coordination technology," akin to an engineer using "center of mass" without ontological commitment.

  This essay argues that while separating linguistic practice from ontological commitment successfully insulates eliminativism from logical self-refutation, it does so only by collapsing the view into instrumentalism. By conceding the indispensable utility of propositional attitudes for normative reasoning, the pragmatic eliminativist surrenders the core ontological claim that makes EM radical. The view survives as a coherent philosophical position only by ceasing to be eliminativism.

  ### The Pragmatic Escape from Self-Refutation

  The classic objection to EM is that it is self-refuting. To assert "There are no beliefs" is to express a belief. If the statement is true, the act of asserting it is impossible. The pragmatic defense attempts to dissolve this knot by distinguishing between the *ontology* of the mind and the *syntax* of our social coordination.

  On this view, saying "I believe it will rain" is not reporting an internal state but making a move in a language game to coordinate behavior. Just as an engineer calculates the "center of mass" knowing no literal point of mass exists, the eliminativist can use belief-talk knowing no literal beliefs exist. This move effectively neutralizes the charge of performative contradiction. The eliminativist is not claiming to hold a belief; they are issuing a verbal signal that functions *as if* they hold a belief. In this narrow logical sense, the separation of ontology and practice works. It allows the eliminativist to speak without committing the suicide of their own argument.

  However, solving a logical paradox is not the same as providing a phenomenological or explanatory account of human cognition. The pragmatic defense treats belief-talk as a tool, but tools are designed for specific functions. If we ask what function FP serves, the answer inevitably circles back to the very things EM seeks to eliminate: reasoning, justification, and rational revision.

  ### The Normative Leak

  This brings us to the study partner's objection: the problem of normative reasoning. Science is not just a collection of data; it is a normative enterprise. It involves assessing evidence, weighing arguments, and revising theories based on what one *ought* to think given the data. This normative structure is the native habitat of folk psychology. We revise our views because we recognize a conflict between our *beliefs* and new *evidence*.

  If EM is true, and FP is false, then the vocabulary required to describe the process of scientific revision is also false. Neuroscience can describe the causal transmission of signals between neurons, but it cannot describe *justification*. A neural state can cause another neural state, but it cannot *justify* it. Justification requires content—it requires that state A represents the world in a way that makes state B rationally obligatory.

  The pragmatic eliminativist might reply that we can keep using normative language as a useful fiction. But this creates a fatal tension. If the argument for eliminativism is a *good argument*, it must rely on norms of logic and evidence that are objectively binding, not merely useful fictions. If the norms of reasoning are themselves part of the false folk theory, then the argument for eliminativism has no normative force; it is merely a causal push that happens to result in the utterance of EM slogans.

  To argue that "you *ought* to abandon belief-talk" is to rely on the very propositional attitudes one claims do not exist. One cannot coherently claim that the framework of rationality is false while using that framework to persuade others of the claim. The pragmatic defense attempts to bracket this by saying, "I am using the fiction to persuade you to drop the fiction." But if the fiction is the only medium through which persuasion and reasoning occur, it cannot be discarded. It is not a tool we can put down; it is the hand that holds the tool.

  ### From Elimination to Instrumentalism

  Consequently, the separation of ontology and practice does not save eliminativism; it transforms it into something else. By admitting that belief-talk is indispensable for social coordination and normative reasoning, the pragmatic defender has conceded that FP is not *false* in the way phlogiston was false. Phlogiston theory was discarded because it failed to predict and explain combustion. Folk psychology, however, is being retained because it succeeds at predicting and explaining rational agency.

  This position is no longer eliminativism; it is instrumentalism, closely resembling Daniel Dennett's "Intentional Stance." Dennett argues that even if beliefs are not neural things, they are real patterns that cannot be captured by any other vocabulary. The Churchlands' original vision was that neuroscience would eventually provide a vocabulary that *replaces* FP, allowing us to understand cognition without reference to content or norms. The pragmatic defense admits this will not happen. It admits that even with a complete neural map, we would still need "belief" and "desire" to navigate the space of reasons.

  If the vocabulary cannot be eliminated, the ontology it implies cannot be fully erased. Functionalism teaches us that if a posited entity does real explanatory work, it earns its ontological keep. By granting FP the status of an indispensable "social coordination technology," the pragmatic eliminativist grants it reality as a functional system. To say "beliefs don't exist, but we must act as if they do forever" is semantically indistinguishable from saying "beliefs exist as functional states."

  ### Conclusion

  The pragmatic defense of eliminative materialism is a survival strategy that succeeds only by surrender. It successfully dodges the bullet of self-refutation by reclassifying mentalistic talk as non-assertoric speech acts. However, in doing so, it fails to address the normative-reasoning problem. It cannot explain why we *ought* to accept eliminativism without relying on the very norms of rationality that folk psychology codifies.

  Ultimately, this separation collapses the view into instrumentalism. A philosophy that claims we must permanently retain the language of beliefs to function as rational agents is not eliminating the mind; it is merely relocating it from the brain to the social sphere. The radical threat of eliminativism was the promise that our self-conception as rational agents was a myth. The pragmatic defense admits that the myth is necessary for the practice of science and reasoning itself. Therefore, the view is no longer genuinely radical. It survives as a coherent position, but it ceases to be eliminativism. It saves the philosopher from contradiction, but only by admitting that the "folk" were right about the folk all along.
