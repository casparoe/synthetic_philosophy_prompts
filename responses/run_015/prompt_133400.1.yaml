      *   **Format:** Question + Sketch of Dr. K's Answer + Sharp Follow-up.

  2.  **Deconstruct Dr. K's Position:**
      *   *Premise 1:* $h^2 = V_A / V_P$. $V_P$ includes $V_E$ (environmental variance).
      *   *Premise 2:* Changing the environment changes $V_E$, which changes $V_P$, which changes $h^2$.
      *   *Premise 3:* Therefore, $h^2$ estimated in Population A (Env Range X) does not predict response to intervention in Population A (Env Range Y) or Population B.
      *   *Conclusion:* $h^2$ is descriptive of a specific population-state, not a causal property of the trait or a guide for manipulation.
      *   *Key Term:* "Intervention-Variance Mismatch" (IVM).

  3.  **Drafting Questions (Iterative Process):**

      *   *Requirement 1: High $h^2$ $\neq$ Determinism.*
          *   *Draft:* Why doesn't high heritability mean genes determine the trait?
          *   *Refinement:* Need to press the *mechanism*. If $V_E$ is low, $h^2$ is high. But if we change $V_E$, the trait changes.
          *   *Follow-up:* If $h^2$ is high because $V_E$ is suppressed, isn't that a form of structural determinism even if not genetic?

      *   *Requirement 2: Intervention-Variance Mismatch (IVM) vs. Within/Between.*
          *   *Draft:* How is your mismatch different from the Lewontin fallacy?
          *   *Refinement:* Lewontin says within-group $h^2$ doesn't explain between-group differences. Dr. K says within-group $h^2$ doesn't predict within-group *interventions*.
          *   *Follow-up:* If it fails at intervention prediction within the group, is it merely a retrospective statistic?

      *   *Requirement 3: Broad-sense ($H^2$) vs. Narrow-sense ($h^2$).*
          *   *Draft:* Does $H^2$ fix this?
          *   *Refinement:* $H^2$ includes dominance/epistasis. Does that make it more stable or just messier regarding the environment?
          *   *Follow-up:* If $H^2$ also fails the intervention test, is *any* variance partitioning useful for causality?

      *   *Requirement 4: Positive Explanatory Work.*
          *   *Draft:* What is it good for then?
          *   *Refinement:* If it can't predict individuals or interventions, what ontology does it support?
          *   *Follow-up:* Is it just a measure of our ignorance of the environment?

      *   *Additional Questions to reach 8-10:*
          *   GxE Interaction (Genotype-Environment Interaction).
          *   The "Zero Heritability" edge case.
          *   Selection response (Breeder's Equation).
          *   Molecular vs. Quantitative genetics (missing heritability).
          *   Norm of Reaction.

  4.  **Developing the Content (incorporating the "Settled vs. Contested" constraint):**
      *   *Settled:* $h^2$ is population specific. $h^2$ is ratio of variances. High $h^2$ doesn't mean unchangeable (phenylketonuria example).
      *   *Contested:* How much this limits *causal* inference. Whether IVM is a fatal flaw or just a boundary condition. The utility of $h^2$ in social science vs. agriculture.

  5.  **Refining the Follow-ups (The "Sharp" Element):**
      *   The follow-ups need to prevent Dr. K from retreating to "It's just a statistic." They need to ask: If it's just a statistic, why do we fund studies to calculate it? If it implies causality, where is the mechanism?
      *   Need to challenge the "Intervention-Variance Mismatch." Is it a mismatch or just a requirement for model updating?

  6.  **Review against Constraints:**
      *   8-10 questions? Yes.
      *   No bio/motivation? Yes.
      *   Specific topics covered (Determinism, IVM vs. Lewontin, $H^2$, Explanatory work)? Yes.
      *   Sketches of answers included? Yes.
