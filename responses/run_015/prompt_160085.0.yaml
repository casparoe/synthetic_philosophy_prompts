prompt: |-
  Two people in my decision theory reading group have been going at each other for about a year about acausal trade. One thinks it's a genuine phenomenon that a correct decision theory has to cash out — that you can rationally pay a cost to get a benefit brought about by an agent you will never causally influence. The other thinks the whole literature slides between "my action is evidence of what the other agent does" and "my action makes the other agent do something." They've finally agreed to an adversarial collaboration and I'm the one who has to produce the document.

  Can you draft it? I want a numbered agreed-claims section first, then a disagreements table where each row has a neutral framing plus each side's own wording that they'd actually be willing to sign, then the cruxes.

  For the cruxes I want concrete shared cases rather than the usual twins-in-distant-galaxies setup — please build them around these two:

  - Drift: two civilizations on opposite sides of a cosmological horizon, no causal contact ever possible; each can either spend a large share of its resources encoding its entire scientific corpus into a beacon nobody receives, or spend it on itself. The correlation between their choices runs only through the fact that both had to independently derive the same chunk of mathematics to even describe the option, and it's partial — say the chance their procedures coincide, conditional on both facing the choice, is around 0.7, and both know it.
  - Half-sim: you're either the original or a simulation of yourself whose memory of the last hour was corrupted in a known way; now you choose whether to cooperate with your counterpart, you can't find out which one you are, and you know the corruption makes the sim's choice only weakly correlated with yours.

  For each: is trade rational, roughly where's the threshold in correlation, and what happens as the similarity degrades continuously — with each side's prediction written down in advance. Also flag any dispute you think is merely verbal; I suspect the "is it really trade, does anything actually get exchanged" argument is partly terminological, and maybe part of the "you can't benefit from what you don't cause" one too.
reasoning: |-
  Here's a thinking process that leads to the suggested document:

  1.  **Analyze the Request:**
      *   **Context:** A decision theory reading group has two members feuding over acausal trade (AT) for a year.
      *   **Task:** Draft an adversarial collaboration document.
      *   **Structure:**
          1.  Numbered Agreed-Claims Section.
          2.  Disagreements Table (Neutral Framing + Side A Wording + Side B Wording).
          3.  Cruxes (Concrete cases: "Drift" and "Half-sim", not standard twins).
          4.  Specifics for Cruxes: Is trade rational? Threshold in correlation? Continuous degradation? Pre-committed predictions.
          5.  Flag verbal disputes (terminology vs. substance).
      *   **Tone:** Neutral, precise, academic but accessible to decision theorists, facilitating resolution.
      *   **Key Concepts:** Acausal Trade, Evidential Decision Theory (EDT) vs. Causal Decision Theory (CDT) vs. Functional/Timeless Decision Theory (FDT/TDT), correlation vs. causation, logical correlation.

  2.  **Deconstruct the Positions:**
      *   **Pro-AT (Side A):** Believes AT is genuine. Rational to pay cost for benefit from an agent you can't causally influence. Likely subscribes to FDT/TDT or a strong version of EDT. Believes logical correlation creates a "subjunctive dependence" or functional link that justifies cooperation.
      *   **Skeptic-AT (Side B):** Believes the literature slides between evidence and causation. "My action is evidence" $\neq$ "My action makes the other do something." Likely subscribes to CDT. Believes paying a cost without causal leverage is irrational (dominated strategy).

  3.  **Drafting - Section 1: Agreed Claims:**
      *   Need common ground to show they aren't talking past each other *entirely*.
      *   Both agree on the math of probability.
      *   Both agree on the setup of the specific cases (Drift, Half-sim).
      *   Both agree that *causal* influence is absent in these cases.
      *   Both agree that if correlation is 1.0 (identical algorithms), cooperation is standard (Newcomb-like).
      *   Both agree that "magic" or retrocausality is not involved.

  4.  **Drafting - Section 2: Disagreements Table:**
      *   Need neutral framing, then specific phrasing each side accepts.
      *   *Issue 1: The Mechanism.* Neutral: "Nature of the link." Side A: "Subjunctive/Logical Dependence." Side B: " Mere Statistical Correlation."
      *   *Issue 2: Rationality Norm.* Neutral: "Action selection criterion." Side A: "Maximize expected utility conditional on action." Side B: "Maximize expected utility of causal consequences."
      *   *Issue 3: Terminology.* Neutral: "Labeling the phenomenon." Side A: "Acausal Trade." Side B: "Correlated Strategy Selection."

  5.  **Drafting - Section 3: Cruxes (The Core Task):**
      *   *Case 1: Drift.*
          *   Setup: Cosmological horizon, no causal contact. Correlation = 0.7 (derived from shared math).
          *   Question: Is it rational to encode the beacon (cooperate)?
          *   Side A (Pro-AT): Yes. 0.7 is high enough. As similarity degrades, there's a cutoff where expected utility flips.
          *   Side B (Skeptic): No. Causal impact is 0. Correlation doesn't justify cost. Threshold is irrelevant; always defect.
          *   *Nuance:* The prompt asks for "roughly where's the threshold." Side B says "None/Infinity." Side A needs to calculate based on the payoff matrix. Let's assume a Prisoner's Dilemma structure.
      *   *Case 2: Half-sim.*
          *   Setup: Original vs. Sim. Memory corruption. Weak correlation.
          *   Question: Cooperate with counterpart?
          *   Side A: Yes, if correlation > cost/benefit ratio. Degrades smoothly.
          *   Side B: No. You can't change the other's output.
      *   *Continuous Degradation:* How does the recommendation change as correlation drops from 1.0 to 0.0?
          *   Side A: Smooth transition from Cooperate to Defect at a specific $p$.
          *   Side B: Step function at 1.0 (or always Defect if strict CDT). Actually, strict CDT says always Defect in PD regardless of correlation unless causal. So the "degradation" curve is flat "Defect."
      *   *Verbal Disputes:* Flag the "Trade" vs. "Correlation" argument. Flag "Make happen" vs. "Predict."

  6.  **Refining the Content (Self-Correction/Polishing):**
      *   *Check:* Did I address the "slides between evidence and causation" complaint? Yes, in the Disagreements table.
      *   *Check:* Are the cases specific? Yes, Drift and Half-sim are used.
      *   *Check:* Is the tone appropriate? Needs to be formal enough to bind them but clear enough to resolve the fight.
      *   *Check:* The prompt asks for "each side's own wording that they'd actually be willing to sign." This is crucial. Side B won't sign "Acausal Trade exists." They will sign "Correlated decision making is rational." Side A won't sign "It's just evidence." They will sign "Logical dependence is normative."
      *   *Math:* Need to ensure the threshold logic holds. If Payoff(Cooperate) = $-C$, Payoff(Other Cooperates) = $B$.
          *   EDT/FDT: Cooperate if $p \cdot B - C > 0 \Rightarrow p > C/B$.
          *   CDT: Cooperate if $0 \cdot B - C > 0$ (Impossible). So always Defect.
      *   *Verbal Dispute Flag:* The prompt specifically suspects the "is it really trade" argument is terminological. I need to explicitly isolate this.

  7.  **Final Review against Constraints:**
      *   Numbered agreed-claims? Yes.
      *   Disagreements table (Neutral + Side A + Side B)? Yes.
      *   Cruxes (Drift + Half-sim)? Yes.
      *   Thresholds/Degradation/Predictions? Yes.
      *   Flag verbal disputes? Yes.

  8.  **Writing the Document:** (Proceeding to generate output based on these thoughts.)
      *   *Title:* Adversarial Collaboration Protocol: Acausal Decision Norms.
      *   *Participants:* Proponent (FDT/EDT leaning), Skeptic (CDT leaning).
      *   *Facilitator:* Me (the user).
      *   *Style:* Clean, LaTeX-style math where needed, distinct sections.

      *(Self-Correction during drafting)*: Make sure Side B's position isn't a strawman. Side B isn't saying correlation doesn't exist; they are saying it's not *action-guiding* in the absence of causation. Side A isn't saying magic happens; they are saying the decision algorithm is the common cause. I need to make sure the "Disagreements Table" reflects this nuance.

      *(Refining the "Drift" case)*: The prompt says correlation is 0.7 *conditional on facing the choice*. This implies logical correlation due to shared math. Side A sees this as acausal leverage. Side B sees this as a common cause (the math) that happened in the past, so current action doesn't change it.
      Wait, if the math derivation happened in the past, isn't that a common cause?
      *Side A argument:* The decision *procedure* is what matters. If I run procedure X, and they run procedure X (because of the math), our outputs correlate. My choosing X *now* implies they chose X *then* (logically).
      *Side B argument:* Their choice is already fixed in the past (or spacelike separated). My action cannot change a fixed fact.
      Okay, I will ensure this distinction is clear in the Cruxes.

      *(Refining "Half-sim")*: This is a classic "Subjective Uncertainty" case.
      Side A: I might be the sim. If I defect, the sim likely defects. I want the sim to cooperate (if I'm original) or I want to cooperate (if I'm sim).
      Side B: I am either Original or Sim. My action affects *my* payoff. The other's action is fixed relative to me.
      Actually, Half-sim is trickier for CDT. If I don't know which I am, CDT usually treats the other's action as independent unless there's a causal link. But if the simulation is *of* me, my decision algorithm is the source code for both. CDT struggles here. I will frame Side B as "Causal isolation dominates."

      Let's assemble.

      *(Final Polish)*: Ensure the "Verbal Dispute" section is prominent as requested. The prompt specifically asks to flag if the "is it really trade" argument is terminological. I will classify it as such in the analysis section.

      *(One last check on thresholds)*:
      Drift: $p=0.7$.
      Half-sim: "Weakly correlated." Let's define weak as $p=0.55$.
      I need to ask them to pre-commit to a specific threshold formula for Side A, and a "Never" for Side B.

      Okay, ready to write.s
