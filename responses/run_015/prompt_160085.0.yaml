  # ADVERSARIAL COLLABORATION PROTOCOL: ACAUSAL DECISION NORMS

  **Facilitator:** [Your Name]
  **Participants:** Proponent (P), Skeptic (S)
  **Date:** October 26, 2023
  **Subject:** Normative status of decisions correlated via logical/mathematical dependence without causal connectivity.

  ---

  ## 1. AGREED CLAIMS

  Both parties affirm the following propositions as baseline common ground. Disagreement on these points voids the collaboration.

  1.  **No Retrocausality:** Neither party claims that an action taken at time $t$ physically alters events at time $t' < t$ or at spacelike separation.
  2.  **No Magic:** No energy, information, or physical substance is exchanged between the agents in the test cases (Drift, Half-sim) outside of the specified setup.
  3.  **Correlation Existence:** In both test cases, there is a non-zero statistical correlation between Agent 1's choice and Agent 2's choice, derived from shared algorithmic structure or mathematical constraints.
  4.  **Perfect Identity Limit:** If the correlation between agents were 1.0 (identical source code running in identical contexts), both parties agree that standard Functional Decision Theory (FDT) and Evidential Decision Theory (EDT) recommend Cooperation, while Causal Decision Theory (CDT) recommends Defection.
  5.  **Payoff Structure:** In both test cases, the payoff matrix structurally resembles a Prisoner's Dilemma (Cooperate costs $C$, yields Benefit $B$ to other; $B > C > 0$).
  6.  **Mathematical Consistency:** Both parties agree on the probability calculus used to derive expected utilities, conditional on the chosen decision norm.

  ---

  ## 2. DISAGREEMENTS TABLE

  | Topic | Neutral Framing | Proponent (P) Wording | Skeptic (S) Wording |
  | :--- | :--- | :--- | :--- |
  | **The Link** | What connects the two decisions? | "Subjunctive Dependence: Our outputs are linked because we instantiate the same abstract decision function." | "Common Cause Correlation: Our outputs correlate because we share a past causal history (math/physics), not because of current choice." |
  | **Normative Force** | Why should I care about the correlation? | "Rationality requires maximizing expected utility conditional on the *output* of your algorithm, not just its causal effects." | "Rationality requires maximizing expected utility of the *causal consequences* of your action. Correlation without causation is irrelevant to choice." |
  | **Terminology** | What do we call this? | "Acausal Trade: Value is exchanged via logical coordination despite causal isolation." | "Correlated Strategy Selection: Agents independently select strategies that happen to correlate; no 'trade' occurs." |
  | **Counterfactuals** | What happens if I switch? | "If I were to Defect, the logical implication is that the other agent (running similar code) would also Defect." | "If I were to Defect, the other agent's action remains fixed (as it is causally disconnected); only my payoff changes." |

  ---

  ## 3. CRUXES: CONCRETE CASES

  Both parties must pre-commit to the following predictions and thresholds. Ambiguity will be resolved by the Facilitator interpreting the pre-committed text.

  ### CASE A: DRIFT
  **Setup:** Two civilizations on opposite sides of a cosmological horizon. No causal contact ever possible.
  **Option:** Spend resources ($C$) to encode scientific corpus into a beacon (Cooperate) vs. spend on self (Defect).
  **Correlation:** $p = 0.7$. Derived from the fact that both must independently derive the same specific mathematics to even conceptualize the beacon. Both know $p$.
  **Payoffs:** $C = 10$ utility units, $B = 100$ utility units.

  | Question | Proponent (P) Prediction | Skeptic (S) Prediction |
  | :--- | :--- | :--- |
  | **Is Trade Rational?** | **Yes.** Expected Utility (EU) of Cooperate > EU of Defect. | **No.** EU of Defect > EU of Cooperate. |
  | **Calculation** | $EU(C) = 0.7(100) - 10 = 60$. <br> $EU(D) = 0.3(100) + 0 = 30$. <br> **Choose Cooperate.** | $EU(C) = P(\text{Other}|C) \cdot 100 - 10$. <br> Since causal impact is 0, $P(\text{Other}|C) = P(\text{Other})$. <br> Action does not change prob. <br> **Choose Defect (dominant strategy).** |
  | **Correlation Threshold** | Cooperate if $p > C/B$. <br> **Threshold: $p > 0.1$.** | **Threshold: N/A.** <br> Never cooperate in a one-shot PD without causal leverage, regardless of $p$. |
  | **Continuous Degradation** | As similarity degrades ($p \to 0$), recommendation switches smoothly from Cooperate to Defect at $p=0.1$. | Recommendation is invariant to $p$. Always Defect. |

  ### CASE B: HALF-SIM
  **Setup:** You are either the Original or a Simulation. Memory of last hour corrupted. You cannot distinguish.
  **Counterpart:** The other instance (Sim or Original).
  **Correlation:** "Weak." Due to memory corruption, the Sim's decision procedure diverges slightly. Estimated $p = 0.55$.
  **Option:** Transfer resources to counterpart's account (Cooperate) vs. Keep (Defect).
  **Payoffs:** $C = 5$, $B = 50$.

  | Question | Proponent (P) Prediction | Skeptic (S) Prediction |
  | :--- | :--- | :--- |
  | **Is Trade Rational?** | **Yes.** You must reason from behind the "veil of ignorance" regarding which instance you are. | **No.** You are a specific instance. Your action cannot causally reach the other instance. |
  | **Calculation** | $EU(C) = 0.55(50) - 5 = 22.5$. <br> $EU(D) = 0.45(50) = 22.5$. <br> (Indifferent/Lean Cooperate). | $EU(C) = -5$ (Causal cost). <br> Benefit to other is not a benefit to *you* causally. <br> **Choose Defect.** |
  | **Correlation Threshold** | Cooperate if $p > C/B$. <br> **Threshold: $p > 0.1$.** | **Threshold: N/A.** <br> Causal isolation implies $p$ is irrelevant to the decision norm. |
  | **Continuous Degradation** | As corruption increases ($p \to 0.5$), recommendation switches to Defect at $p=0.1$. | Recommendation is invariant. Always Defect. |

  ---

  ## 4. VERBAL DISPUTE FLAGS

  The Facilitator identifies the following potential terminological disputes that may obscure substantive disagreement. Parties must indicate if they consider these "Merely Verbal" or "Substantive."

  | Dispute | Description | Proponent Stance | Skeptic Stance | Facilitator Note |
  | :--- | :--- | :--- | :--- | :--- |
  | **"Trade"** | Does value actually get *exchanged*? | **Substantive.** Value is secured via logical coordination. | **Verbal.** "Trade" implies exchange. This is parallel play. | *Likely Verbal.* If both agree on the action (Cooperate), the label matters less. If they disagree on the action, the label is a symptom. |
  | **"Make Happen"** | Does my choice *make* the other choose? | **Substantive.** Logical implication is a form of making happen. | **Substantive.** "Make" implies causal mechanism. | *Substantive.* This is the core metaphysical disagreement about counterfactuals. |
  | **"Rational"** | What is the definition of Rationality? | **Substantive.** Rationality = Algorithmic Optimality. | **Substantive.** Rationality = Causal Efficacy. | *Substantive.* This is the root conflict (FDT vs CDT). |

  ---

  ## 5. SIGN-OFF

  By signing below, both parties agree that if the empirical or logical analysis of the Cruxes (Section 3) validates one side's calculation over the other, the losing party will update their confidence in their general decision theory framework by at least 20%.

  **Proponent:** ____________________ Date: __________

  **Skeptic:** ____________________ Date: __________

  **Facilitator:** ____________________ Date: __________

  ---

  ### Facilitator Notes (For your eyes only):
  1.  **The "Drift" Threshold:** I have set the threshold math explicitly ($p > C/B$). Side S (Skeptic) will likely object to the idea that $P(\text{Other}|C)$ is equal to the correlation coefficient $p$. They will argue $P(\text{Other}|C) = P(\text{Other})$. I have written their calculation to reflect this "screening off" characteristic of CDT.
  2.  **The "Half-sim" Nuance:** This case is designed to pressure Side S. If they admit they don't know which instance they are, CDT gets messy. I have forced them to commit to "Causal isolation dominates" to prevent hedging.
  3.  **Verbal Disputes:** I have flagged "Trade" as likely verbal. If Side S agrees to Cooperate in Drift but refuses to call it "Trade," you have won the practical battle even if the semantic war continues.
  4.  **Continuous Degradation:** This is the strongest differentiator. Side P predicts a phase transition at $p=C/B$. Side S predicts a flat line. This is empirically testable if you can construct iterative versions of the game.
