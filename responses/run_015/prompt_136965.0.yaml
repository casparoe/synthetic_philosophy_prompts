answer: |-
  Here is a taxonomy designed for a reading group of cognitive scientists and deep-learning researchers. It avoids historical labels in the branching logic, focusing instead on commitments regarding mechanism, representation, and evidence.

  ### The Branch Questions
  *To navigate this tree, a participant must endorse or reject the following six concrete claims. There are no "it depends" options; the position is defined by where you draw the line.*

  **1. The Bookkeeping Claim (Level of Analysis)**
  "The thesis that 'cognition is analogy' is a claim about the **algorithm** (the mind actually performs retrieval/mapping steps) rather than merely a **computational description** (any successful input-output mapping can be retroactively described as analogical)."
  *   **Yes:** The mechanism matters; the thesis is falsifiable by finding a non-analogical algorithm that works.
  *   **No:** The thesis is a descriptive framework; if the behavior fits, the label applies.

  **2. The Episodic Claim (Retrieval vs. Construction)**
  "Every instance of analogical reasoning requires the reactivation of a **specific, stored episodic trace** (a particular past event or case)."
  *   **Yes:** No analogy without a specific source memory.
  *   **No:** Analogy can be constructed from abstracted statistics or semantic knowledge without a specific episode.

  **3. The Format Claim (Representation)**
  "The primitive unit being mapped is a **discrete relational role** (e.g., agent, patient, cause) with explicit bindings."
  *   **Yes:** Structure is symbolic or graph-like.
  *   **No:** Structure is continuous (vectors/similarity) or sensorimotor (schemas/affordances).

  **4. The Plasticity Claim (Function)**
  "A system that categorizes fluently and solves proportional analogies (A:B::C:?) but **never alters its category boundaries** based on cross-domain mapping is performing analogy."
  *   **Yes:** Behavioral fluency is sufficient.
  *   **No:** Analogy requires the reorganization of the target concept (the 'essence' shifts).

  **5. The Source Claim (Transfer)**
  "Structure transfer can occur **without a retrievable source domain** (e.g., via statistical abstraction or gradient descent on a loss function)."
  *   **Yes:** Source-free transfer is possible.
  *   **No:** All transfer implies a specific source, even if unconscious.

  **6. The Substrate Claim (Implementation)**
  "If a transformer model solves verbal analogies via attention weights over tokens, **without symbolic alignment**, it is performing the same cognitive kind as a human."
  *   **Yes:** Substrate agnosticism (Behavior/Function defines the kind).
  *   **No:** Algorithmic realism (The specific manipulation of symbols/roles defines the kind).

  ---

  ### The Leaves (Positions)
  *These ten positions represent stable clusters of answers to the branches above. They include the required theoretical stances and empirical cases.*

  **1. Radical Constitutivism (The Hofstadter/Sander Position)**
  *   **Profile:** Yes Algo, No Strict Episodic (fluid memory), Yes Roles+Similarity, **Yes Plasticity**, No Source-Free (always a 'spark' from a situation), No Substrate (human-specific fluidity).
  *   **Commitment:** Categorization *just is* analogy. To recognize a 'cup' is to analogize it to past cups. If the system doesn't shift its understanding of 'cup' based on context, it isn't truly cognizing.

  **2. Formal Structuralism (Classic Structure-Mapping)**
  *   **Profile:** Yes Algo, No Episodic (semantic structures), **Yes Roles**, Yes Plasticity (accommodation), Yes Source-Free (can map abstract schemas), No Substrate.
  *   **Commitment:** Analogy is a derived operation over independently given structured representations. It is a specific faculty, not the core of all cognition. Perception is not analogy; reasoning is.

  **3. Predictive Symptomatism (Bayesian/Active Inference)**
  *   **Profile:** No Algo (Computational level), No Episodic, No Roles (Prediction Errors), Yes Plasticity, **Yes Source-Free**, No Substrate.
  *   **Commitment:** The real core is structure learning and error minimization; "analogy" is only a symptom of the brain minimizing surprise across domains.
  *   **Note:** *Flagged as indistinguishable from Leaf 8 (Statistical Abstractionism) within this taxonomy.* Both reject episodic retrieval and discrete roles in favor of statistical transfer. This tree cannot pry them apart because both reduce analogy to gradient-based optimization.

  **4. Somatic Metaphorism (Embodied Cognition)**
  *   **Profile:** Yes Algo, No Episodic (procedural memory), **No Roles (Sensorimotor Schemas)**, Yes Plasticity, No Source-Free (grounded in body), No Substrate.
  *   **Commitment:** Analogical mapping is the projection of sensorimotor affordances (e.g., 'up' is 'more') onto abstract domains. Without a body, there is no analogy, only syntax.

  **5. Eliminative Deflationism**
  *   **Profile:** Rejects the Branch Questions as ill-posed.
  *   **Commitment:** The word "analogy" covers several unrelated mechanisms (retrieval, alignment, abstraction) and constitutes no natural kind. Searching for a "core" is a category error.

  **6. Substrate Agnosticism (The DL Behaviorist)**
  *   **Profile:** No Algo (Computational), No Episodic, No Roles (Vectors), Yes Plasticity, Yes Source-Free, **Yes Substrate**.
  *   **Commitment:** A system counts as cognizing analogically if it is fluent at verbal proportional analogies. If a neural network passes the test, it is doing analogy.
  *   **Implication for Humans:** This position is committed to the view that human "symbolic" reasoning is likely an illusion generated by high-dimensional vector interpolation. We are not manipulating roles; we are navigating similarity spaces.

  **7. Algorithmic Realism (The DL Skeptic)**
  *   **Profile:** Yes Algo, No Episodic, Yes Roles, Yes Plasticity, No Source-Free, **No Substrate**.
  *   **Commitment:** A neural network solving A:B::C:? via attention is *not* performing analogy; it is performing pattern completion. True analogy requires explicit variable binding.
  *   **Implication for Humans:** If humans are truly analogical, our brains must implement variable binding mechanisms distinct from standard backpropagation/attention.

  **8. Statistical Abstractionism**
  *   **Profile:** Yes Algo, No Episodic, No Roles (Distributions), Yes Plasticity, **Yes Source-Free**, No Substrate.
  *   **Commitment:** Structure transfer happens via latent space alignment without a specific source episode.
  *   **Note:** *Flagged as indistinguishable from Leaf 3 (Predictive Symptomatism) within this taxonomy.*

  **9. The Modular Dissociation (The Non-Canon Case)**
  *   **Profile:** Empirical Hypothesis rather than theoretical stance.
  *   **Case:** This leaf posits the existence of two distinct patient populations:
      *   **Patient A (The Classifier):** Categorizes reliably within familiar domains (knows a 'dog' is a 'dog') but can carry **no structure across them** (cannot understand 'the stock market is a jungle').
      *   **Patient B (The Mapper):** Maps exuberantly across domains (sees deep structural parallels between biology and economics) but her **category boundaries slide** so freely she mislabels ordinary objects (calls a 'cup' a 'bowl' because both hold liquid).
  *   **Commitment:** If this double dissociation exists, the Strong Identity Thesis (Leaf 1) is false. Categorization and Analogical Transfer are separable faculties.

  **10. Episodic Purism**
  *   **Profile:** Yes Algo, **Yes Episodic**, Yes Roles, No Plasticity (rigid retrieval), No Source-Free, No Substrate.
  *   **Commitment:** Analogy is strictly Case-Based Reasoning. If you cannot point to the specific memory being reused, it is not analogy; it is induction.
  *   **Status:** *Marked as Unattractive.* It struggles to explain novel creative insight where no prior case exists.

  ---

  ### Empty Regions of the Space

  **1. The "Symbolic Embodiment" Region (Incoherent)**
  *   **Coordinates:** Yes Roles (Discrete) + No Roles (Sensorimotor Schemas).
  *   **Status:** **Incoherent.** One cannot claim the primitive unit is *both* a discrete symbolic role-binding *and* a continuous sensorimotor schema simultaneously without a hybrid theory that resolves the format mismatch. Most embodied theorists explicitly reject discrete roles.

  **2. The "Rigid Retrieval" Region (Unattractive)**
  *   **Coordinates:** Yes Episodic + No Plasticity.
  *   **Status:** **Merely Unattractive.** This describes a system that retrieves past cases to label new ones but never allows the new case to update the old memory. While logically possible (a read-only database), it fails to capture the learning dynamics observed in biological cognition, making it a poor model for "core cognition."

  **3. The "Source-Free Episodic" Region (Unclaimed)**
  *   **Coordinates:** Yes Episodic + Yes Source-Free.
  *   **Status:** **Unclaimed.** This claims every analogy requires a specific stored episode, *but* that transfer can happen without a source. This is a contradiction in terms (if transfer is source-free, no specific episode is required). No serious theory occupies this coordinate.

  ### Indistinguishable Leaves
  As noted in Leaves 3 and 8, this taxonomy cannot pry apart **Predictive Symptomatism** and **Statistical Abstractionism**.
  *   **Reason:** Both positions answer "No" to Discrete Roles, "No" to Episodic Retrieval, and "Yes" to Source-Free Transfer. They both view analogy as an emergent property of optimization (whether minimizing prediction error or aligning latent distributions). To separate them, a branch question regarding *teleology* (is the goal prediction or transfer?) would be required, but that moves beyond the structural/mechanistic scope of this specific tree.
