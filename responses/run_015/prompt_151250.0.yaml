prompt: |-
  So I'm in a rational choice seminar this term and my short paper has to recommend a two-person bargaining rule for a specific job: two parties jointly produce a surplus, and the rule gets written into a contract as the default split, to be applied later by an arbitrator who only has noisy estimates of the feasible set and of each side's outside option. We did the Nash solution and Kalai-Smorodinsky on Tuesday, I've allready got the reading list and I don't want more of it — no citations, no bibliography, no "see So-and-so 1975". What I can't do yet is say what I'm asking the rule for. That's what I want from you: the desiderata.

  Give me the list of things a two-person bargaining solution has to get right to count as adequate for that purpose specifically (contract default, applied to estimated rather than exact feasible sets), with the case or consideration behind each one, and for each, whether it's non-negotiable for this purpose or just a preference of one camp.

  Things I want you to actually take a position on:

  1. Interpersonal comparability. In the applications I care about the payoffs are basically in a common unit already (dollars, GPU-hours, author slots), so I dont understand why I should care about invariance to indepedent rescaling of each side's utility function, but every axiomatization treats it as bedrock. Is scale-invariance a genuine desideratum or a prejudice inherited from taking non-comparable vNM utilities as the default case? What happens if I drop it — does maximizing the total become respectable again, and does a split-the-gains-equally rule stop looking arbitrary?

  2. Which of these are real requirements and which just collapse into axioms people already use. My guesses, tell me where I'm wrong:
   - insensitivity to unattainable ideals: throwing in an option that raises one side's maximum but that nobody will ever realistically get shouldn't move the split. Is this IIA in a costume, or a distinct gripe? It looks like the thing that sinks any rule defined off the ideal point, which is why I'm suspicious of KS.
   - carve-up invariance: whether the issues are settled as one package or one at a time shouldn't change the outcome, and neither should redrawing where one issue ends and the next begins.
   - no gain from splintering: a side shouldn't come out ahead by showing up as two claimants rather than one.
   - robustness to estimation error: if the feasible set and the disagreement point are only known up to some epsilon, the recommended point shouldn't move by more than something on the order of epsilon. If that's in tension with Pareto-efficiency, because you can't sit exactly on a frontier you only know approximately, say so plainly. That tension is the part I most want.
   - lumpiness: the surplus is often indivisible (one slot, one machine), so the feasible set isn't convex and the rule still has to be defined. And if it needs randomization to be defined, it should also say who eats the residual risk and whether the loser gets anything for it.

  3. The obvious one: monotonicity versus independence of irrelevant alternatives. My sense is that you can't have both together with Pareto-efficiency and symmetry, so the list has a small impossibility buried in it. Give me the smallest jointly unsatisfiable subset you can find and the example that shows it.

  4. On the final list, which single requirement does the most work narrowing the field, and is there one that's secretly doing nothing?

  Then a short scorecard — table is fine — for the Nash solution, Kalai-Smorodinsky, maximize-the-total assuming a common unit, and split-the-gains-equally. Keep the scoring short; the criteria are the paper.

  Last thing: separate what's actually settled (the characterization results, the facts about which solution has which property) from what's contested among people who work on this — whether monotonicity or IIA is the right cut, whether comparability is available, whether robustness should beat exact efficiency — because I don't want to hand in something that presents one camp's preference as the consensus. And flag anything you're guessing at or that I should check against the actual statement of a theorem before I put it in front of someone who knows this literature. American English, please.
