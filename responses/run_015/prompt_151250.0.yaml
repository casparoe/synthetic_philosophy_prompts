  4.  **Address Question 2: Specific Desiderata:**
      *   *Insensitivity to Unattainable Ideals:* This is basically Independence of Irrelevant Alternatives (IIA) or a variant like Step Independence. KS depends on the "ideal point" (utopia point). If the ideal point expands due to an unreachable option, KS shifts. In a noisy estimation context, relying on the extreme boundary (ideal point) is dangerous. This is a strong argument against KS here.
      *   *Carve-up Invariance:* This sounds like Decomposability or Consistency. If I bargain over $X$ then $Y$, is it the same as $X+Y$? Nash satisfies this (logarithmic utility implies additive separability). KS generally does not. In contract design, this matters for modularity.
      *   *No Gain from Splintering:* This is related to Consistency or Population Monotonicity. If I split my claim into two shells, do I get more? A good rule shouldn't allow gaming via corporate structuring.
      *   *Robustness to Estimation Error:* This is *critical* for the prompt. Standard solutions are continuous, but are they *stable*? If the frontier is flat, small errors in slope estimation matter less. If the frontier is kinked (like Nash on a polygon), small errors in $S$ can jump the solution. Actually, Nash is usually continuous in $S$ (Hausdorff metric), but if the arbitrator imposes a point based on $\hat{S}$, and true $S$ is different, the imposed point might be infeasible or inefficient.
