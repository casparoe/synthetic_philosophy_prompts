answer: |-
  Here is the breakdown of desiderata for your specific context: a contract default rule applied by an arbitrator with noisy estimates, where payoffs are in a common unit.

  ### 1. Interpersonal Comparability and Scale Invariance

  **Position:** In your context, **Scale Invariance is a prejudice, not a desideratum.** You should drop it.

  **The Case:** Standard bargaining theory assumes utility is vNM (ordinal up to positive affine transformation) and non-comparable across persons. This forces the solution to be invariant if you rescale Player 1's utility independently of Player 2's. But your payoffs are dollars, GPU-hours, or author slots. These are cardinally comparable. A dollar is a dollar for both sides (assuming risk neutrality or known, identical risk attitudes).

  **Consequences of Dropping It:**
  *   **Maximizing the Total becomes respectable:** If units are comparable, summing them is mathematically coherent. The objection that "you can't add utils" vanishes.
  *   **Equal Gains stops looking arbitrary:** "Split the surplus 50/50" has a precise meaning in dollars. In standard theory, it requires an arbitrary choice of utility zero and scale. In your context, it is the natural focal point.
  *   **The Cost:** You lose the protection against not knowing the parties' risk attitudes. If one side is risk-averse and the other risk-neutral, a dollar split is not a utility split. However, for a *contract default*, assuming transferable utility (dollars) is standard practice.

  **Verdict:** Non-negotiable to drop Scale Invariance. It restricts the solution space based on a metaphysical constraint (non-comparability) that does not exist in your application.

  ### 2. Specific Desiderata: Requirements vs. Preferences

  Here is the status of the specific properties you listed, tailored to the "noisy arbitrator" constraint.

  **Insensitivity to Unattainable Ideals**
  *   **Status:** **Non-negotiable Requirement.**
  *   **Case:** This is effectively a robustness version of IIA. If the feasible set expands in a region no one will ever reach (e.g., the "utopia point" moves because of a low-probability, high-payoff tail), the settlement shouldn't shift.
  *   **Implication:** This sinks Kalai-Smorodinsky (KS). KS is defined by the intersection of the Pareto frontier and the line connecting the disagreement point to the "ideal point." If the arbitrator's noise creates a phantom ideal point, KS moves. Nash and Equal Gains are insensitive to the ideal point.

  **Carve-up Invariance (Decomposability)**
  *   **Status:** **Strong Preference.**
  *   **Case:** Contracts are often modular. If parties bargain over price and delivery separately, the outcome should match bargaining over the package.
  *   **Implication:** Nash satisfies this (the log-product is additive). KS generally fails this. In a contract default, modularity reduces transaction costs. This is a point for Nash.

  **No Gain from Splintering**
  *   **Status:** **Non-negotiable Requirement.**
  *   **Case:** A default rule must not incentivize corporate gaming. If a firm can split into two subsidiaries to bargain as two agents and capture more surplus, the rule creates deadweight loss in legal structuring.
  *   **Implication:** This is related to "Consistency" or "Population Monotonicity." Most standard two-person solutions assume fixed population, so you must explicitly check if the rule generalizes. Utilitarianism (Max-Total) can fail here if the "splintered" side counts their sum as the objective.

  **Robustness to Estimation Error**
  *   **Status:** **The Critical Non-negotiable.**
  *   **Case:** The arbitrator sees $\hat{S}$ (estimated set) and $\hat{d}$ (estimated disagreement), not the truth.
  *   **Tension with Pareto:** This is the core conflict. A Pareto-efficient rule picks a point on the *estimated* frontier. If $\hat{S}$ is slightly too optimistic, the ruling is **infeasible** (cannot be implemented). If $\hat{S}$ is too pessimistic, the ruling is **inefficient**.
  *   **Resolution:** You cannot demand exact Pareto Efficiency on the *estimated* set. You need a rule that is continuous and perhaps selects a point slightly interior to $\hat{S}$ to ensure feasibility, or one that is less sensitive to the curvature of the frontier.
  *   **Implication:** Solutions that rely on tangency (Nash) are sensitive to the *slope* of the frontier. Solutions that rely on the ideal point (KS) are sensitive to the *extent* of the frontier. Equal Gains (in dollars) is sensitive to the *location* of the frontier but ignores the slope. **Equal Gains is likely the most robust to shape errors** in a common-unit context.

  **Lumpiness (Non-Convexity)**
  *   **Status:** **Requirement for Definition.**
  *   **Case:** Surplus is often indivisible (one machine, one slot). The feasible set is a set of dots, not a convex shape.
  *   **Implication:** Standard solutions assume convexity. To work here, the rule must allow for lotteries (randomized allocation).
  *   **Risk:** Who eats the variance? If the rule prescribes a 50% chance of the machine, a risk-averse party loses utility. A good default rule for lumpiness should either allow side-payments (making the set convex again) or specify a risk premium. If side-payments are allowed, you are back to a convex set in dollar space.

  ### 3. Monotonicity vs. IIA: The Impossibility

  You are correct that there is a buried impossibility. Here is the smallest jointly unsatisfiable subset.

  **The Impossible Tetrad:**
  1.  **Pareto Efficiency** (Pick a point on the frontier).
  2.  **Symmetry** (If the set is symmetric, split equally).
  3.  **Independence of Irrelevant Alternatives (IIA)** (If the set shrinks but the chosen point is still available, keep the chosen point).
  4.  **Resource Monotonicity** (If the feasible set expands, no player should get less).

  **The Example:**
  Start with a symmetric triangle. The solution is the midpoint of the hypotenuse (by Symmetry and Efficiency).
  Now, expand the feasible set for Player 1 only (chop off a corner for Player 2, add area for Player 1).
  *   **IIA says:** If the original solution point is still feasible, stay there. (Nash does this).
  *   **Monotonicity says:** Player 1's opportunity grew, so Player 1's payoff should not decrease (and intuitively should rise). KS satisfies this; Nash does not.
  *   **Conflict:** You cannot have a rule that stays put when options expand (IIA) and also guarantees no one loses when the pie grows (Monotonicity).

  **Contextual Choice:** For a contract default, **Monotonicity is more important.** If the project becomes more profitable (set expands), the default rule should not leave one party stuck with the original split while the other captures all the growth. That creates an incentive to litigate rather than cooperate on expansion. IIA is valuable for stability, but Monotonicity is valuable for incentive alignment.

  ### 4. Workhorse Requirements

  **Most Work:** **Pareto Efficiency.**
  This does the heavy lifting. It immediately discards any rule that leaves money on the table. It narrows the solution from the whole plane to the frontier curve.

  **Secretly Doing Nothing:** **Continuity.**
  In the theoretical literature, Continuity is a key axiom. In your application, *all* plausible candidates (Nash, KS, Equal Gains, Utilitarian) are continuous functions of the set $S$ (under the Hausdorff metric). It doesn't help you distinguish between them.

  **The Real Filter:** **Comparability.**
  Once you accept dollars are comparable, you eliminate Nash and KS immediately (unless you artificially impose scale invariance). They are designed for non-comparable utils. This leaves **Utilitarian (Max-Total)** and **Egalitarian (Equal-Gains)** as the serious contenders.

  ### 5. Scorecard

  | Feature | Nash Product | Kalai-Smorodinsky | Max-Total (Utilitarian) | Equal-Gains (Egalitarian) |
  | :--- | :--- | :--- | :--- | :--- |
  | **Uses Common Units?** | No (ignores scale) | No (ignores scale) | **Yes** | **Yes** |
  | **Robust to Ideal Point?** | **Yes** | No (Sensitive) | **Yes** | **Yes** |
  | **Monotonicity** | No | **Yes** | **Yes** | **Yes** |
  | **IIA** | **Yes** | No | No | No |
  | **Handles Lumpiness** | Needs Lottery | Needs Lottery | **Easy** (Pick max) | Needs Lottery |
  | **Arbitrator Safety** | Medium (Slope sensitive) | Low (Boundary sensitive) | **High** (Sum stable) | **High** (Diagonal stable) |
  | **Fairness Intuition** | Proportional to threat | Proportional to potential | Ignores threat point | **Equal Share of Surplus** |

  ### 6. Settled Facts vs. Contested Norms

  **Settled (Mathematical Facts):**
  *   Nash is the unique solution satisfying Pareto, Symmetry, IIA, and Scale Invariance.
  *   Kalai-Smorodinsky is the unique solution satisfying Pareto, Symmetry, Individual Monotonicity, and Scale Invariance.
  *   You cannot satisfy IIA and Resource Monotonicity simultaneously (given Pareto and Symmetry).
  *   Nash and KS require cardinal non-comparability to be uniquely justified. If utility is comparable, their axiomatic foundations crumble.

  **Contested (Normative/Design Choices):**
  *   **IIA vs. Monotonicity:** Theorists debate which is more "fair." For your paper, this is a design choice. I argue Monotonicity is better for contract incentives.
  *   **Comparability:** Economists often insist on non-comparability to remain general. You are arguing for comparability based on the specific *application* (dollars). This is a valid move in mechanism design but contradicts the pure theory tradition.
  *   **Robustness vs. Efficiency:** Standard theory demands exact Pareto Efficiency. In your "noisy arbitrator" context, demanding exact efficiency on an *estimated* set is dangerous. This is a departure from standard theory that you need to justify explicitly.

  **Flags/Uncertainties to Check:**
  *   **Theorem Statement:** Verify the exact name of the "Monotonicity" axiom. Sometimes it is called "Resource Monotonicity," sometimes "Strong Monotonicity." Ensure you use the definition where expanding the set never hurts a player.
  *   **Non-Convexity:** Standard Nash/KS definitions assume convex $S$. If you argue for them in a lumpy context, you must specify they imply lotteries. Check if your seminar covered "Bargaining with Non-Convexities." If not, stick to the assumption that side-payments convexify the set.
  *   **Risk Attitudes:** If you claim dollars are comparable, you are implicitly assuming risk neutrality or identical risk aversion. If one party is a startup (risk-seeking) and the other is a bank (risk-averse), a 50/50 dollar split is not a 50/50 utility split. Flag this as a limitation of the "Equal Gains" recommendation.

  **Recommendation for your Paper:**
  Argue for **Equal-Gains in Dollars (Egalitarian Solution)**.
  1.  It respects the common unit (drops Scale Invariance).
  2.  It is monotonic (if the pie grows, shares grow).
  3.  It is insensitive to the "ideal point" (robust to estimator noise on the boundary).
  4.  It aligns with the contract default intuition of "split the difference."
  5.  Acknowledge it may require lotteries for lumpiness, but that is standard for indivisible goods.
