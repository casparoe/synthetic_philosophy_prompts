  10. **Final Review against Constraints:**
      *   No citations? Check.
      *   American English? Check.
      *   Take positions? Check.
      *   Flag uncertainties? Check.

  11. **Self-Correction during drafting:**
      *   *Correction:* I initially thought about saying Nash is robust. But Nash depends on the geometry of the tangent. If the frontier is flat, the Nash solution is sensitive to the disagreement point. If the frontier is kinked, it's sensitive to the shape. Actually, the Egalitarian solution (Equal Gains) is often more robust to shape errors if units are comparable.
