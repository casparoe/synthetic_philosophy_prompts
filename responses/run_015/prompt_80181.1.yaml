answer: |-
  # Simulation Specification: "The Shifting Oasis"

  ## 1. Scenario Spec
  **Environment:** A discrete $50 \times 50$ toroidal grid (edges wrap).
  **Agents:** $N=100$ identical agents.
  **Resources:** One "Food Patch" (size $3 \times 3$).
  **Dynamics:**
  *   **Energy:** Agents start with 100 energy units.
  *   **Cost:** -1 unit per step (move).
  *   **Reward:** +50 units upon entering the Food Patch.
  *   **Death:** Energy $\le 0$.
  *   **Schedule:** The Food Patch remains stationary for 200 steps, then teleports to a new location. The sequence of locations follows a deterministic but non-trivial rule (e.g., clockwise around the four quadrants).
  *   **Vision:** Agents can only sense food if they are on an adjacent cell (Manhattan distance = 1). They cannot see the food from afar.
  *   **Communication:** Agents occupy cells. They can detect the presence and *last action* of agents on adjacent cells.

  **The Four Configurations (The "Switch"):**
  The physical world is identical in all four runs. The difference is the **Update Rule** governing how an agent decides its next move when not adjacent to food.

  1.  **Darwinian (Hardwired):** Agents possess a fixed "Move Vector" (e.g., "Always move North-East"). This vector is encoded in their genome. It *cannot* change during the agent's lifetime. If an agent dies, it is replaced by an offspring of a survivor with a mutated vector (Generational turnover enabled).
  2.  **Skinnerian (Trial & Error):** Agents choose moves probabilistically based on a Q-table. They *must* execute a move to observe the result. If a move results in lower energy (no food), the probability of that move in that state is penalized. Real errors are required for learning.
  3.  **Popperian (Internal Modeling):** Agents maintain an internal transition map (State + Action $\to$ Predicted Result). Before moving, they simulate 5 steps ahead. If a simulated path leads to starvation, they discard it *without executing it*. They only execute the path with the highest predicted reward.
  4.  **Gregorian (Social Imitation):** Agents have no internal map and do not reinforce their own trials. Instead, they monitor adjacent agents. If an adjacent agent's energy *increased* in the last step, the observer copies that agent's last move vector.

  ---

  ## 2. Observable Signatures (The Data Traces)

  To distinguish the modes, you will analyze the **Aggregate Energy Trace**, the **Path Variance**, and the **Failure Log** over the first 3 Food Cycles.

  ### Run 1: Darwinian Signature
  *   **Within-Lifetime Trace:** Flat line. Individual agents show *zero* adaptation. If the food moves, they continue walking toward the old location until they die.
  *   **Population Trace:** Step-function improvement. Generation 1 suffers 90% mortality. Generation 2 (offspring of the 10% who got lucky) starts with a bias toward the correct direction.
  *   **Key Discriminator:** **No behavioral change within an individual's lifespan.** If you isolate Agent #42's log, their move policy at Step 50 is bitwise identical to Step 500.

  ### Run 2: Skinnerian Signature
  *   **Within-Lifetime Trace:** Gradual slope. Agents improve, but the improvement is paid for in energy.
  *   **Failure Log:** High count of "Real Errors." You will see agents repeatedly stepping into empty cells that they have visited before, slowly extinguishing the behavior.
  *   **Key Discriminator:** **Real-world cost of learning.** The total population energy dip is deepest here. Every agent must personally "touch the stove" to learn it is hot. Path variance is high (everyone learns their own way).

  ### Run 3: Popperian Signature
  *   **Within-Lifetime Trace:** Sharp "Knee." Agents wander briefly to build a model, then suddenly switch to optimal paths.
  *   **Failure Log:** Low count of "Real Errors." You will see agents *pause* (spend compute cycles) at decision points. They do not step into known dead-ends.
  *   **Key Discriminator:** **Independent Convergence.** Agents arrive at the new food location at roughly the same time, but via *uncorrelated paths*. Agent A figures it out via simulation; Agent B figures it out via simulation. They do not wait for each other.
  *   **Data Check:** If you delete the "First Finder," the rest of the population still finds the food quickly.

  ### Run 4: Gregorian Signature
  *   **Within-Lifetime Trace:** S-Curve (Sigmoid). Slow start (waiting for a leader), then rapid cascade as the "successful move" propagates through the grid.
  *   **Failure Log:** Near-zero real errors for the majority. The "First Finder" pays the Skinnerian cost; the rest pay nothing.
  *   **Key Discriminator:** **Path Correlation (The Trail Effect).** 80% of agents will take the *exact same sequence of steps* as the First Finder.
  *   **Data Check:** If you delete the "First Finder" (or silence their success signal), the rest of the population reverts to random wandering. Discovery is *dependent*, not independent.

  ---

  ## 3. Worked Example: The Trace of Agent #7
  *Context: Food has just moved from Quadrant 1 to Quadrant 3. Agent #7 is in Quadrant 2.*

  | Step | Mode | Action | Energy Change | Internal State Log (What the data implies) |
  | :--- | :--- | :--- | :--- | :--- |
  | **100** | **Skinnerian** | Move North | -1 | "I tried North. No food. I will lower North's weight." (Real cost incurred) |
  | **100** | **Popperian** | *Compute* | 0 | "Simulating North... predicts 50 steps to starvation. Rejecting." (No real cost) |
  | **100** | **Gregorian** | Wait | 0 | "Scanning neighbors. No one succeeded recently. Holding position." |
  | **101** | **Skinnerian** | Move East | -1 | "Trying East. No food." (Real cost incurred) |
  | **101** | **Popperian** | Move South | -1 | "Simulation predicts South leads to open terrain. Executing." |
  | **101** | **Gregorian** | Copy West | -1 | "Neighbor #8 moved West and gained +50 energy. Copying West." |

  **Analysis of the Trace:**
  *   **Skinnerian:** You see the energy drain *before* the correction. The log shows a history of punished actions.
  *   **Popperian:** You see "Compute" cycles (or time-steps where position doesn't change but energy doesn't drain, if you model compute cost) or simply a lack of return visits to bad cells. The correction happens *before* the error.
  *   **Gregorian:** You see the action contingent on *another agent's ID*. In the data log, Agent #7's move at 101 is causally linked to Agent #8's reward event at 100.

  ---

  ## 4. Honest Accounting

  ### The Hardest Pair to Distinguish: Popperian vs. Gregorian
  **Why:** Externally, both look like "smart, efficient foraging." Both minimize real-world mortality compared to Skinnerian/Darwinian. Both show rapid adaptation within a lifetime. If you only measure **Success Rate** and **Time-to-Food**, these two modes will produce overlapping confidence intervals.

  **The Design Feature Doing the Work:** **Trajectory Correlation.**
  *   Popperian intelligence is *parallel*. Every agent is running their own simulation. Their paths to the solution will be diverse (some go around the mountain, some go over), but they will arrive simultaneously.
  *   Gregorian intelligence is *serial/cascading*. Information flows from a source. Paths will converge physically (agents walking in single file) and temporally (followers arrive strictly after leaders).
  *   **The Test:** Calculate the **Pairwise Path Similarity Metric**.
      *   Popperian Run: Low similarity (many unique solutions).
      *   Gregorian Run: High similarity (cloning the solution).

  ### The Defender's Attack (The Gregorian Critique)
  A defender of the Gregorian mode (or a social constructivist) would attack the Popperian claim with the **"Internalized Other" Argument**:

  > "You claim your Popperian agents are running internal simulations independent of social input. But where did they get the rules for that simulation? In any realistic cognitive architecture, the 'internal model' is built from prior social interactions or language.
  >
  > In your simulation, you gave the Popperian agents a 'physics engine' for free. In reality, learning to simulate the world is a social skill (Vygotsky). Therefore, what you call 'Popperian' is just 'Gregorian learning that happened in the past and is now cached.'
  >
  > **Evidence:** If you look closely at your Popperian trace, the 'independent' discoveries might actually be clustered around specific 'teacher' agents from the previous generation who built the initial map. If you strip out the cultural inheritance, your Popperian agents are just slow Skinnerians."

  **Counter-Counter Move:** To defeat this, you must run the Popperian configuration with **naive priors** (no pre-built physics engine). If they still outperform Skinnerians without social input, you have evidence for genuine individual modeling capacity. But this requires defining what constitutes a "model" versus "memory," which is the philosophical heart of the problem.

  ### Summary for Your Professor
  If you present this, emphasize that **efficiency is not evidence**. You cannot claim a creature is Popperian just because it is smart. You must show the *structure of the error*:
  1.  **Darwinian:** Errors persist across lifetime.
  2.  **Skinnerian:** Errors are real and precede learning.
  3.  **Popperian:** Errors are virtual; learning is parallel/independent.
  4.  **Gregorian:** Errors are outsourced; learning is serial/dependent.

  The **Path Correlation Metric** is your smoking gun for separating the two "smart" modes.
