      *Challenge:* How to strictly isolate the modes?
      *   *Darwinian:* Hard-code the movement strategy into the genome. No learning within lifetime. Mutation happens only at reproduction.
      *   *Skinnerian:* Random walk + reinforcement. If step leads to food, reinforce that direction. If step leads to empty/no food, penalize. No internal map, no talking.
      *   *Popperian:* Internal map building. Agent simulates "If I go North, what happens?" based on past observations. Can reject a path before taking it. No talking.
