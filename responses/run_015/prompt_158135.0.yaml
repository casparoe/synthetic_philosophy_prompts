answer: |-
  Here is the structural breakdown of the crane position, its vulnerabilities, and the audit you requested.

  ### 1. The Falsifiability Objection and Ranking Defeaters

  Sam is partially right: "There exists a crane for X" is an existential claim that is difficult to falsify simply by failing to find one. However, it is not *immune* to evidence. It functions as a research programme, and like any such programme, it can become degenerative.

  Here is the ranking of defeaters from fatal to merely awkward, split by what a crane-person must concede versus what they can shrug off.

  **Fatal Defeaters (Must Concede)**
  1.  **Proof of Logical Impossibility:** A formal demonstration that property P (e.g., meaning, consciousness) cannot be constituted by non-P parts even in principle. If you can prove that "aboutness" requires a substrate that is *already* about something, crane-ism is logically dead, not just stalled.
  2.  **The Rosetta Case A (Semantic Causal Power):** Empirical confirmation that a system's causal powers depend on semantic properties *over and above* their structural/physical properties. If physics is not causally closed, and "meaning" is doing causal work that structure cannot account for, that is a skyhook.
  3.  **Universal Smuggling:** If every single proposed crane for a major phenomenon is shown to presuppose the phenomenon in its base machinery, the method is bankrupt. It moves from "to-do list" to "circular reasoning."

  **Awkward Defeaters (Must Concede, but Survivable)**
  1.  **Degenerative Problem Shift:** If crane explanations become increasingly complex and ad-hoc without generating new predictions (e.g., positing invisible homunculi to explain vision), the programme is losing explanatory power.
  2.  **Persistent Stagnation:** If a specific domain (like qualia) sees zero progress in mechanistic modeling for centuries while other domains advance, the claim that "a crane exists here" becomes an article of faith rather than a scientific wager.

  **Shrug-Off Defeaters (Legitimate Dismissals)**
  1.  **Current Ignorance:** "We don't have the crane yet" is not a defeater; it's the default state of science.
  2.  **Intuitive Resistance:** The fact that a bottom-up explanation feels unsatisfying or "eliminative" (the "nothing but" rhetoric) is a psychological reaction, not a metaphysical refutation.
  3.  **Complexity:** Just because the crane is incredibly complicated (e.g., billions of years of evolution) doesn't mean it isn't a crane.

  ### 2. The "Smuggler's Crane" Challenge

  You asked if "smuggler's cranes" are a defeater or a to-do list.

  **Verdict:** It depends on frequency and necessity.
  If a *single* crane story smuggles the explanandum, it is a bad model (a to-do list item: fix the model). If *all possible* crane stories for a phenomenon *must* smuggle it to function, it is a **fatal conceptual defeater**.

  **Why:** The definition of a crane is that the base parts are "dumber" than the output. If the base parts must possess a proto-version of the high-level property (e.g., neurons must have "mini-meanings" to create "meaning") to make the math work, you haven't reduced the phenomenon; you've just pushed it down a level. This is homuncular regression.
  A committed crane-person must concede that if the only way to model the bottom-up process is to endow the bottom parts with the top-level capacity, the reduction has failed. You cannot explain normativity using parts that follow norms unless you explain where *their* normativity comes from. If that chain never bottoms out in blind, non-normative causality, the crane never touches the ground.

  ### 3. The Rosetta Case

  You presented two scenarios regarding a neural mechanism.

  **Scenario A: Structural description fails; Semantic description is required for prediction.**
  *   **Impact:** This should move you significantly. This violates the causal closure of the physical. If the physical structure doesn't determine the outcome, but the "aboutness" does, then "aboutness" is a fundamental force or property, not an emergent one. This is a skyhook.
  *   **Crane Response:** A crane-person will argue this scenario is incoherent. How does the universe "read" the aboutness without a physical interface? They will claim you haven't looked hard enough for the structural proxy.
  *   **Your Move:** If the data holds, you must accept that physicalism is false or incomplete. This is the empirical kill-shot for crane-ism.

  **Scenario B: Structural description predicts everything; Semantic description is bookkeeping.**
  *   **Impact:** This is the crane-person's victory condition. It confirms that semantics is an emergent, non-causal layer (or causally redundant).
  *   **Your Move:** This supports the view that meaning is a user-illusion or a functional pattern, not a fundamental ingredient.

  **Is this the right shape of evidence?**
  Yes. Crane-ism relies on the sufficiency of structural/physical explanation. Evidence that structural explanation is *insufficient* is the only empirical thing that can falsify it. However, the position is insulated against this by the ability to always claim the structural description is "incomplete" rather than "impossible."

  ### 4. The Stall Audit

  You asked for a preview of what a completed crane story looks like versus a stalled one, applied to three domains.

  **Criterion for Progress:** The base machinery becomes *simpler* and *more alien* to the output, yet predictive power *increases*.
  **Criterion for Stall:** The base machinery must be increasingly anthropomorphized (given "mini-minds," "mini-meanings," or "mini-values") to make the model work.

  **Domain 1: Aboutness (Intentionality)**
  *   **Completed Crane:** A system where physical states correlate with environmental states due to evolutionary history or causal covariance, without the system "knowing" it. (e.g., A thermostat "represents" temperature).
  *   **Stalled Crane:** A system where we have to say the neuron "interprets" the signal.
  *   **Status:** **Progressing.** Information theory and teleosemantics have built robust cranes here. We can model reference without magic. LLMs show that statistical prediction creates functional "aboutness" without understanding. The hard core (intrinsic content) is shaky, but functional content is largely craned.

  **Domain 2: Normativity (Moral/Reason)**
  *   **Completed Crane:** Norms emerge from game-theoretic stability or social contract dynamics among self-interested agents. "Ought" is a compression of "If you want X, do Y."
  *   **Stalled Crane:** Norms emerge because the agents have a "sense of ought" built into their utility function.
  *   **Status:** **Awkward but Moving.** Evolutionary ethics and game theory provide strong cranes for *social* norms. The "binding force" of morality (why I *should* care) remains a sticky point, but constructivist cranes are holding. It looks like a complex crane, not a skyhook.

  **Domain 3: Conscious Experience (Qualia)**
  *   **Completed Crane:** Consciousness is a specific type of information integration or self-modeling. Explaining the function explains the experience.
  *   **Stalled Crane:** Explaining the function (reportability, attention) but leaving the "feeling" untouched. The base parts process data, but why does it *light up*?
  *   **Status:** **Stalled.** This is the danger zone. Every crane story here (Global Workspace, IIT, Illusionism) either successfully explains the *behavior* of consciousness while dodging the *experience*, or it smuggles in "proto-experience" (panpsychism) which is a smuggler's crane.
  *   **The Worry:** If qualia are non-structural (as they seem to be from the first-person perspective), no structural crane can ever catch them. This is the one where a crane-person should be most worried. If consciousness is the one thing that *cannot* be functionalized, crane-ism hits a hard wall.

  ### 5. Synthesis

  Sam's objection that this is a "heuristic dressed as metaphysics" is the strongest critique. Crane-ism is a wager: *Bet that the universe is bottom-up.*
  It is not strictly falsifiable in a single experiment (because you can always say "look harder"), but it is **vulnerable to degeneration**. If the only way to save the crane is to make the base parts look like the top parts (Smuggling), or if predictive power requires appealing to top-down properties (Rosetta A), the wager loses.

  The position is not insulated against empirical findings (Rosetta A would kill it), but it is heavily insulated against *current* findings because "in principle" is a powerful shield. The real threat is conceptual: if the very logic of bottom-up explanation requires the top-down property to get started, the crane collapses under its own weight.

  Verdict: partly exposed — Conceptual collapse via smuggling
