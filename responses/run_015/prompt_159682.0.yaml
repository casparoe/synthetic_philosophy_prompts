  Brain size (and neuron count) serves as a proxy for the **Upper Bound of Complexity**. It indicates the *maximum possible* richness of conscious life the hardware can support. It does not determine the *actual* richness unless the hardware is the limiting factor.

  **Mapping Your Verdicts:**

  *   **Verdict 2 (Small-brained Human):** Accommodated. The hardware ceiling is lower, but the *realized capacity* is stipulated to be identical to the mean. Since standing tracks realized capacity, standing is equal.
  *   **Verdict 4 (Corvid) & 5 (Alien):** Accommodated. Substrate independence. If the psychological profile (realized capacity) matches, standing matches, regardless of mass or density.
  *   **Verdict 6 (Slow Emulation):** Accommodated. Clock speed affects the *rate* of state transitions, not the *complexity* of the states themselves. A slow mind experiences the same depth of pain or joy as a fast mind; it just takes longer. Standing is invariant to temporal compression.
  *   **Verdict 3 (Elephant vs. Chicken):** Accommodated. Here, the larger nervous system is not just a redundant ceiling; it is stipulated to *make possible* a richer psychological profile (greater social responsiveness, affect, etc.). The standing difference tracks the difference in realized capacity, for which brain size is the enabling cause.
  *   **Verdict 1 (Child vs. Chimp):** **Problematic.** This is the outlier. An adult chimpanzee with a heavier brain and more neurons likely possesses a *higher realized capacity* in many domains (impulse control, working memory, spatial reasoning) than a three-year-old human. Under RPC, the Chimp should have equal or stronger standing *now*. Your verdict favors the Child based on **Species-Typical Potential** (the capacity the child *will* have), which contradicts the Actualism of Verdicts 2, 4, and 5.

  ### The Conflict and Recommendation

  Your tentative principle ("standing tracks richness... brain size serving only as evidence") works perfectly for Verdicts 2–6 but fails Verdict 1 unless modified.

  *   **The Tension:** Verdict 4 implies that if the *current profile* matches, standing is equal (Actualism). Verdict 1 implies that if the *future profile* is higher, standing is higher (Potentialism), even if the current hardware and current capacity favor the competitor.
  *   **The Verdict to Overturn:** To maintain a consistent **Realized Phenomenal Capacity** principle, you must overturn or significantly qualify **Verdict 1**.
      *   *Option A (Consistent Actualism):* Concede that the Chimpanzee has a claim at least as strong as the three-year-old *regarding current suffering and interests*, though the child may have additional rights based on future autonomy.
      *   *Option B (Consistent Potentialism):* Modify the principle to "Life-Track Capacity." However, this risks undermining Verdict 4 (does the corvid have the same *life-track potential* as the mammal?). If the corvid's potential is lower but its current profile matches, Actualism (V4) says they are equal, while Potentialism says the mammal is superior.

  **Recommendation:** Adopt **Realized Phenomenal Capacity** as the primary driver of standing. Treat Verdict 1 as a special case of **protective paternalism** owed to developing agents of a high-capacity kind, rather than a reflection of their current intrinsic moral weight. This preserves the clean logic of V2, V4, V5, and V6.

