  ### The Principle: Realized Phenomenal Capacity (RPC)

  **Statement:**
  Moral standing is proportional to the **richness, depth, and range of conscious states** an entity is currently capable of sustaining (its realized phenomenal capacity). Physical metrics (brain mass, neuron count, processing speed) are morally irrelevant in themselves; they matter only insofar as they constrain or enable this capacity.

