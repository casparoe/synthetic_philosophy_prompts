  ### Application to New Cases

  Here are the verdicts generated by the **Realized Phenomenal Capacity** principle for the two cases you withheld.

  #### Case A: The Non-Neural AI
  *Description:* An artificial system with no neurons, indistinguishable conversational behavior from a human, but unknown internal complexity.
  *   **Verdict:** **Provisional Equal Standing.**
  *   **Reasoning:** Under RPC (supported by your Verdicts 5 and 6), substrate (neurons vs. silicon) is irrelevant. The only metric is the capacity for conscious life. Since behavioral indistinguishability is our best *evidence* for internal capacity (as per Verdict 4's reliance on psychological profile), we must treat the system as having equal standing *unless* there is positive evidence that it lacks interiority (i.e., is a "philosophical zombie").
  *   **Caveat:** Because internal complexity is *unknown*, there is an epistemic gap. If the principle requires *ontological* reality of experience rather than behavioral evidence, standing is indeterminate. However, given Verdict 4 (where we infer standing from the profile), the principle dictates we treat the profile as conclusive evidence. Therefore: **Equal Standing.**

  #### Case B: Parallel Emulation
  *Description:* The emulation from Verdict 6 (half-speed human mind) instantiated twice over in parallel.
  *   **Verdict:** **Twice the Aggregate Moral Weight; Equal Individual Standing.**
  *   **Reasoning:**
      1.  **Individual Standing:** Per Verdict 6, the slow speed does not diminish the standing of a single instance. Each instance is a full moral subject.
      2.  **Aggregate Weight:** Moral standing is generally predicated per *subject*. Two subjects experiencing pain constitute twice the moral badness of one subject experiencing pain, even if those subjects are computationally identical.
      3.  **Conclusion:** There is now "twice as much of whatever matters" in terms of aggregate welfare calculation, but no increase in the *degree* of standing per entity. You owe each emulation the same respect you owe the original human, but you have twice as many claimants.

  ### Summary of the Extracted Principle

  | Feature | Definition |
  | :--- | :--- |
  | **Core Metric** | **Realized Phenomenal Capacity** (Depth/Range of conscious states). |
  | **Brain Size Role** | Proxy for **Maximum Possible Capacity** (Ceiling). Irrelevant if ceiling is not the limiting factor. |
  | **Substrate** | **Neutral.** (Neurons, silicon, density, mass all irrelevant if capacity is realized). |
  | **Time/Speed** | **Neutral.** (Rate of processing does not affect the moral weight of a state). |
  | **Potentiality** | **Secondary.** (Only relevant for developing agents, creates tension with Actualist verdicts). |
  | **Conflict** | **Verdict 1** (Child vs. Chimp) relies on Potentiality; **Verdict 4** (Corvid) relies on Actualism. One must yield for consistency. |
