  # The Intelligence Classification Instrument (ICI)

  ## Part 1: The Hypothesis Test
  **Your Hypothesis:** The primary split in your committee is between **Capacity** (intelligence as a latent potential, e.g., the *Simulator* or *Apprentice*) and **Track Record** (intelligence as actualized success, e.g., the *Virtuoso* or *Sage*).

  **Verdict:** **Partially Correct, but Logically Secondary.**
  Your intuition identifies the strongest *semantic* divider among those who believe intelligence is a real, substantive property. However, it cannot be the **root** of the tree. Before one can argue about *what kind* of property intelligence is (Capacity vs. Track Record), one must decide *if* it is a property at all, or merely a label.

  If you place Capacity/Track Record at the root, you cannot cleanly separate the **Deflationary** view (the word is just an honorific) from the **Pluralist** view (there are many real kinds), because both might agree on the *Simulator* case for different reasons. The **Threshold Question** (Thermostat/Riverbed) is the true logical root: it separates those who think "intelligence" picks out a natural kind from those who think it is a trivial or political label.

  **Structure:** I have placed the Threshold question at the root (Q1). Your Capacity/Track Record distinction is the primary splitter for the substantive views (Q4). This honors your insight while maintaining logical rigor.

  ***

  ## Part 2: The Decision Tree
  **Instructions:** Start at **Q1**. Follow the arrow corresponding to your answer. Answer only the questions you encounter. Your final destination is a **Leaf Position**.

  ### **Q1. The Baseline Threshold**
  Consider a **sediment-sorting riverbed** or a **thermostat**. It reacts to environmental states to maintain a condition (equilibrium/temperature) via feedback.
  *   **(A)** Yes, this is a minimal form of intelligence; the difference between this and an AI is degree, not kind. → *Go to Q2.*
  *   **(B)** No, this is merely physics/mechanics. Intelligence requires something more specific. → *Go to Q3.*

  ### **Q2. The Coherence Check** (For those who answered A)
  If the riverbed is intelligent, is the word "intelligence" describing a single real property found in rivers, humans, and chips?
  *   **(A)** No, the word is just a useful label we apply when we want to praise a system; it picks out no natural kind. → **LEAF: Deflationary/Eliminativist**
  *   **(B)** Yes, but the property manifests so differently across contexts that there is no single definition, only a family resemblance. → **LEAF: Pluralist/Cluster**

  ### **Q3. The Locus of Agency** (For those who answered Q1-B)
  Consider **the Colony**: simple agents with local rules that collectively solve a novel problem with no central model, versus **the Lattice**: a router directing narrow specialists.
  *   **(A)** The *Colony* is intelligent, even if no individual agent is. Intelligence is a system-level property. → **LEAF: Distributed/Collective**
  *   **(B)** Intelligence must reside in a unitary agent or model. The Colony is just a tool; the Lattice is only intelligent if the router is. → *Go to Q4.*

  ### **Q4. The Constitution Test** (Your Hypothesis)
  Consider **the Simulator That Never Acts**: a perfect generative model of its environment that answers counterfactuals but never produces an outcome in the world.
  *   **(A)** Yes, it is intelligent. Having the model/capacity is enough, even without action. → *Go to Q5 (Capacity Branch).*
  *   **(B)** No. Intelligence requires affecting the world or achieving a result. → *Go to Q7 (Track Record Branch).*

  ---

  ### **CAPACITY BRANCH**

  ### **Q5. The Resource Constraint**
  Consider **the Slow Sage**: a system whose answers are optimal but arrive after ten thousand years.
  *   **(A)** No, that is not intelligence. Intelligence requires efficiency under constraints (time/compute). → *Go to Q6.*
  *   **(B)** Yes, optimality is what matters; resource limits are practical, not definitional. → **LEAF: Predictive-Modeling**

  ### **Q6. The Learning Rate**
  Consider **the Self-Rewriting Apprentice**: mediocre at every current task but able to rewrite its learning procedure and improve at an accelerating rate.
  *   **(A)** The *Apprentice* is more intelligent than a static expert. Intelligence is fundamentally a learning rate. → **LEAF: Sample-Efficiency**
  *   **(B)** The *Apprentice* is merely promising. Intelligence is the current compression/model quality, not the rate of change. → **LEAF: Resource-Bounded**

  ---

  ### **TRACK RECORD BRANCH**

  ### **Q7. The Generalization Requirement**
  Consider **the Closed-Domain Virtuoso** (superhuman in one game, lookup table outside) and **the Brittle Specialist** (excellent in distribution, catastrophic outside).
  *   **(A)** Neither is truly intelligent. Intelligence requires robust performance across diverse, novel domains. → *Go to Q8.*
  *   **(B)** The *Virtuoso* is intelligent in its domain. Achieving the goal is what matters, not how many other goals you can achieve. → *Go to Q9.*

  ### **Q8. The Metacognition Check**
  Consider the **Matched Pair**: two systems identical in accuracy, but one is **Calibrated** (knows when it does not know) and one is **Confident** (guesses wildly when unsure).
  *   **(A)** The *Calibrated* system is more intelligent. Self-monitoring is part of the general factor. → **LEAF: Psychometric (g-factor)**
  *   **(B)** Accuracy is all that matters. Metacognition is a separate trait. → **LEAF: Goal-Achievement**
      *(Note: If you reached Q8 via Q7-A, you likely value general cognitive traits over pure outcome.)*

  ### **Q9. The Embodiment Constraint**
  Consider **the Simulator** again. If it never acts, you rejected it at Q4. But consider a digital agent that acts only in software vs. a robot that acts in physics.
  *   **(A)** Intelligence requires a body or physical coupling to the environment. Software action is simulation, not intelligence. → **LEAF: Embodied/Situated**
  *   **(B)** Digital action counts. If it achieves the goal in its environment, it is intelligent. → **LEAF: Goal-Achievement**

  *(Note: Q9 also captures the **Archivist** intuition. If you believe the Archivist [retrieval only] is unintelligent because it lacks novelty, you likely lean toward Embodied or Goal views that require generation. If you believe Archivist is intelligent, you lean toward Psychometric.)*

  ***

  ## Part 3: Scoring Key & Leaf Definitions

  | Leaf Position | Core Definition | Path Signature |
  | :--- | :--- | :--- |
  | **Deflationary** | "Intelligence" is an honorific, not a natural kind. | Q1-A → Q2-A |
  | **Pluralist** | There are many unrelated "intelligences." | Q1-A → Q2-B |
  | **Distributed** | Intelligence is a property of collectives, not individuals. | Q1-B → Q3-A |
  | **Predictive-Modeling** | Intelligence is having a good world model (Capacity). | Q1-B → Q3-B → Q4-A → Q5-B |
  | **Sample-Efficiency** | Intelligence is the rate of learning/adaptation. | Q1-B → Q3-B → Q4-A → Q5-A → Q6-A |
  | **Resource-Bounded** | Intelligence is efficient compression/search. | Q1-B → Q3-B → Q4-A → Q5-A → Q6-B |
  | **Psychometric (g-factor)** | Intelligence is a latent trait measurable by generalization. | Q1-B → Q3-B → Q4-B → Q7-A → Q8-A |
  | **Goal-Achievement** | Intelligence is optimizing utility/outcomes. | Q1-B → Q3-B → Q4-B → Q7-B → Q9-B |
  | **Embodied/Situated** | Intelligence requires physical coupling/action. | Q1-B → Q3-B → Q4-B → Q7-B → Q9-A |

  ***

  ## Part 4: Diagnostic Commentary

  ### 1. Load-Bearing vs. Decorative Questions
  *   **Load-Bearing:**
      *   **Q1 (Threshold):** This is the heaviest question. It immediately filters ~20% of philosophical positions (Deflationary/Pluralist). Without it, you cannot distinguish those who think the word is broken from those who think it is real.
      *   **Q4 (Simulator/Capacity):** This is the second heaviest question. It cleanly bifurcates the "Realist" views into Capacity-based (Predictive, Resource, Sample) and Outcome-based (Goal, Psychometric, Embodied). This validates your hypothesis as the primary *semantic* split, even if it isn't the logical root.
      *   **Q3 (Colony):** Essential for isolating the Distributed view, which otherwise contaminates all other categories.
  *   **Decorative/Redundant:**
      *   **Q9 (Embodiment):** This is partially redundant with Q4. If a user rejects the *Simulator* at Q4 because it doesn't act, they often reject digital action too. However, it is necessary to separate *Goal-Achievement* (digital action ok) from *Embodied* (physics required).
      *   **Q8 (Metacognition):** This is a fine-tuner. It distinguishes Psychometric from Goal, but many Goal-achievers will answer "Accuracy matters" (Goal) while many Psychometricians will answer "Calibration matters" (Psych). It is load-bearing *only* for that specific split.

  ### 2. Unoccupied Logical Space
  *   **The "Trivial Embodiment" Combination:** If a user answers **Q1-A** (Thermostat is intelligent) but later answers **Q9-A** (Requires Body), this is logically unstable. If a thermostat (which has a body/sensor) is intelligent, the "Embodied" constraint is trivialized. If they mean *human-like* bodies, they contradict Q1. *Verdict: Incoherent.*
  *   **The "Capacity without Model" Combination:** If a user answers **Q4-A** (Simulator is intelligent) but **Q6-B** (Apprentice is not) and **Q5-B** (Sage is not), they are purely **Predictive-Modeling**. There is no empty space here, but note that **Resource-Bounded** theorists often struggle here: they value efficiency (Q5-A) but may value the static model (Q6-B). This combination is occupied but tense.
  *   **The "Generalization without Metacognition" Combination:** A user who demands generalization (Q7-A) but denies the value of calibration (Q8-B) is rare. Generalization usually implies a model of uncertainty. *Verdict: Unattractive/Unstable.*

  ### 3. The Bedrock Intuition (Where the Tree Bottoms Out)
  If two committee members answer identically through **Q4 (Simulator)** and **Q7 (Generalization)** but still disagree, the tree bottoms out.
  *   **The Case:** **The Archivist** (Retrieval vs. Novelty).
  *   **The Split:** One side views intelligence as *compression* (Archivist is dumb, just storage). The other views it as *competence* (Archivist is smart, answers are correct).
  *   **Resolution:** This instrument does not force a split here because it maps to **Resource-Bounded** (Compression) vs. **Goal-Achievement** (Competence). If they agree on Q5 (Efficiency) but disagree on the Archivist, they have a bedrock disagreement on whether *process* or *outcome* defines the resource cost. No further question can resolve this; it is a fundamental axiom.

  ### 4. Testing Your Hypothesis
  You suspected the split was **Capacity vs. Track Record**.
  *   **Confirmation:** Q4 (Simulator) is the most effective discriminator for the substantive views. It cleanly separates the *Predictive/Sample/Resource* cluster from the *Goal/Psych/Embodied* cluster.
  *   **Correction:** It cannot be the root because it presupposes "Intelligence" is a substantive term. The **Deflationist** does not care about the Simulator's capacity; they think calling it "intelligent" is just a political move. The **Pluralist** thinks it is intelligent in one sense and not in another. Therefore, the **Threshold (Q1)** must precede the **Constitution (Q4)**.
  *   **Practical Advice:** In your committee, ask Q1 first. If you have a Deflationist, no amount of arguing about the *Simulator* will convince them, because they don't believe the category exists. If you have Realists (Q1-B), *then* use Q4 to sort them. Your hypothesis explains the fighting among the Realists; the Threshold question explains why the Deflationist is confused by the fighting.
