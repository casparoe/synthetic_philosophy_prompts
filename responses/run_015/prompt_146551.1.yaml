answer: |-
  **REPUBLIC OF AFFECTED INTERESTS**
  **DEPARTMENT OF DEMOCRATIC BOUNDARY ADMINISTRATION**
  **CIVIC STATUS HANDBOOK (ED. 4.2)**

  **1.0 PURPOSE AND SCOPE**
  This document outlines eligibility classifications for participation in the Legislative Assembly under the Boundary Resolution Algorithm (BRA). The State recognizes no fixed *demos*. Voting rights are contingent upon verified affectedness by specific policy outputs. All entities must undergo a Recursive Stakeholder Audit prior to credential issuance.

  **2.0 CLASS I: PERMANENT AFFECTED (FULL CITIZENS)**
  Eligibility is granted to natural persons residing within geographic zones subject to long-term infrastructure policy (duration >10 years). Applicants must demonstrate causal linkage between zoning ordinances and personal welfare metrics.
  *2.1 Audit Procedure:* Biennial verification of residence and utility consumption.
  *2.2 Voting Weight:* Standard unit (1.0).
  *2.3 Termination:* Status expires upon relocation to non-affected zones or dissolution of relevant infrastructure projects.

  **3.0 CLASS II: TRANSIENT STAKEHOLDERS (PROVISIONAL)**
  Non-resident workers and foreign trade partners exposed to tariff regimes or labor regulations are eligible for temporary suffrage.
  *3.1 Credential Validity:* Tourist Voter-Cards are issued for the exact lifespan of the affecting policy. Upon tariff expiration, credentials self-deactivate.
  *3.2 Remote Balloting:* Secure digital tokens provided upon proof of economic exposure. Entities failing to demonstrate quantifiable loss during the Remote Stakeholder Review may be downgraded to Observer Status.

  **4.0 CLASS III: BIOLOGICAL PROXIES (NON-HUMAN)**
  Sentient fauna impacted by environmental zoning are represented via appointed guardians.
  *4.1 Proxy Allocation:* Weighted proxy ballots are distributed based on population density and vulnerability indices. For example, watershed districts allocate 0.4 voting units per spawning salmon cohort.
  *4.2 Guardian Appointment:* Guardians must pass the Empathy Competency Exam. Conflicts of interest arise if the guardian resides in a zone benefiting from the environmental degradation of the proxy species.

  **5.0 CLASS IV: TEMPORAL AVATARS (FUTURE GENERATIONS)**
  Probabilistic representations of unborn entities affected by long-term debt or climate policy.
  *5.1 Existence Discount:* Voting weight is adjusted by the statistical probability of the avatar's eventual conception.
  *5.2 Representation:* Avatars are managed by the Office of Temporal Integrity. Claims of affectedness must be modeled over a 75-year horizon. Appeals regarding probability coefficients are subject to a 15-year processing delay to ensure temporal consistency.

  **6.0 CLASS V: META-ADMINISTRATIVE VOTERS**
  This category adjudicates amendments to the BRA itself, including definitions of "affectedness" and audit methodologies.
  *6.1 Eligibility:* Restricted to current Class I entities who have successfully navigated three consecutive Stakeholder Audits without appeal.
  *6.2 Rule Modification:* Changes to boundary rules require a supermajority of Meta-Voters. Note: As boundary rules determine Class I eligibility, only those currently deemed eligible may vote to alter the criteria for eligibility.

  **7.0 APPEALS AND REMEDIATION**
  Entities contesting their classification must file Form B-99 within 30 days of audit notification.
  *7.1 Misclassification Refund:* Entities erroneously excluded from voting during a legislative cycle may claim a retroactive tax reimbursement equivalent to the administrative cost of their exclusion. Entities erroneously included must repay the subsidized cost of ballot printing and verification.
  *7.2 Circular Recourse:* Appeals regarding Meta-Administrative rules cannot be lodged until the next Boundary Integrity Day holiday, during which the current Meta-Voters celebrate the stability of the existing algorithm.

  **8.0 COMPLIANCE NOTICE**
  Failure to update affectedness status constitutes voter fraud. The Department reminds all entities that the Algorithm is neutral; discrepancies in representation reflect variations in measurable impact, not administrative bias. For questions regarding the design parameters of the BRA, please consult the Meta-Administrative Voting Records, accessible only to Class V entities.
