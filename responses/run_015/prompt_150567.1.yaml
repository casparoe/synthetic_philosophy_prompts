      *   *Weaknesses:* Iago *does* lie outright sometimes. The distinction might be too neat for the messiness of the play. Othello isn't just a victim; his own predispositions (jealousy, insecurity, outsider status) are fuel. If the focus is too much on Iago's technique, Othello's agency is diminished.

  3.  **Evaluate the Play against the Distinction:**
