      *   *Does the misleading matter more?* Yes, the *implication* often cuts deeper than the assertion. The "Ha, I like not that" moment is pure insinuation.
      *   *Does Othello become co-author?* Yes, he demands "ocular proof" and interprets the handkerchief and the Cassio/Bianca conversation through Iago's lens.
      *   *Where does the distinction break down?* When Iago swears oaths. When he explicitly states falsehoods. The play suggests the *intent* to deceive matters more than the semantic method. Also, focusing on the *method* might obscure the *motive* (motiveless malignity vs. strategic lying).

