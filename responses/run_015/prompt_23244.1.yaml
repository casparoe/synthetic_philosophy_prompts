          *   *Student:* Cites Mischel's marshmallow studies. Claims Mischel showed behavior is determined by situation *rather than* stable trait, making traits "empirically empty."
          *   *Reality:* The situationist challenge in ethics (Doris/Harman) usually relies on *social psychology* studies like Milgram (obedience), Zimbardo (Stanford Prison), and Darley/Batson (Good Samaritan). Mischel's work is about *delay of gratification* and personality coherence, but the specific "situationist challenge" in philosophy usually cites cross-situational inconsistency in *moral* behavior (helping, obeying authority), not just delay of gratification.
