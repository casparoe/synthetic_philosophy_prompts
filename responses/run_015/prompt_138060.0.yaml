answer: |-
  # What the criterion is for

  This criterion serves a methodological, not metaphysical, end. Its purpose is to dictate whether labeling a resource as "cognitive" changes how you model, describe, or intervene in a task. If calling a notebook "part of the mind" yields the same methods section as calling it "scaffolding," the distinction is idle. You are entitled to demand explanatory leverage: does the classification predict error patterns, learning curves, or intervention points differently? You are not entitled to demand ultimate truth about consciousness or constitution. The criterion succeeds only if it reduces ambiguity in coding behavioral data, not if it solves the hard problem of consciousness.

  # The desiderata

  **1. Interventional Difference (Non-Negotiable)**
  The classification must alter the predicted outcome of an intervention. If removing the resource degrades performance identically whether it is labeled "internal" or "external," the distinction is methodologically empty. *Case:* The guidebook user vs. Otto. Removing Otto's notebook cripples him like memory loss; removing the guidebook user's book is like taking away a map. The criterion must distinguish these because the intervention (disable the resource) implies different compensatory strategies in the model.

  **2. Gradient Specification (Non-Negotiable)**
  Extension must admit degrees, with coding instructions for the middle. Binary flags fail when reliance is partial. *Case:* The generative writing assistant (85% right). The criterion must instruct the reviewer to code this as "partial integration" and specify a reliability metric. If the theory forces a yes/no verdict here, it cannot handle modern tools. Reviewers need to write "high-coupling, low-transparency" rather than forcing a binary "extended/not."

  **3. Subject Authority Weighting (Preference)**
  First-person reports ("that's not me") must be weighed but not decisive. Functional reliance often overrides introspection. *Case:* Phone contacts. You don't know if the number is right, yet you dial it without recall. If the criterion lets the subject's doubt veto extension, almost all technology fails. However, ignoring the subject entirely risks labeling forced compliance as cognition. The criterion should treat authority as evidence of transparency, not a veto.

  **4. Boundary Conditions (Non-Negotiable)**
  The criterion must block inflation (oxygen counts) and deflation (nothing counts). *Case:* The whiteboard across the room vs. Otto. Oxygen is necessary but not accessible; the whiteboard is accessible but distant. Otto's notebook is accessible and trusted. The criterion needs an accessibility threshold that admits the cane and glasses (feature, not cost) but excludes the room layout. Without this, "extended" swallows the environment; with too strict a boundary, the literature is pointless.

  **5. Temporal Dynamics (Non-Negotiable)**
  Integration is a process, not a state. The criterion must score learning and decay. *Case:* The abacus user now vs. twenty years later. Initially, the abacus is external; eventually, the hands move without conscious instruction. Conversely, the distrusted notebook user checks every entry; the new user checks memory. A snapshot criterion fails here. The methods section must report the integration phase, as error profiles differ between novice and expert coupling.

  **6. Conflict Resolution (Non-Negotiable)**
  System unity is evidenced by how disagreements are settled. *Case:* Arguing with the AI. If the user overrules the resource routinely, they are separate systems monitoring each other. If the user accepts the output unless flagged, they are a single system with internal noise. The criterion must specify who wins conflicts. If the resource wins often, it is constitutive; if the subject wins always, it is a tool. This predicts error types better than trust alone.

  | Requirement | Motivating Case | Status |
  | :--- | :--- | :--- |
  | Interventional Difference | Otto vs. Guidebook | Non-Negotiable |
  | Gradient Specification | Gen AI (85%) | Non-Negotiable |
  | Subject Authority | Phone Contacts | Preference |
  | Boundary Conditions | Whiteboard vs. Otto | Non-Negotiable |
  | Temporal Dynamics | Abacus (Novice/Expert) | Non-Negotiable |
  | Conflict Resolution | Arguing with AI | Non-Negotiable |

  # Where the list fights itself

  Three tensions strain this list. First, **Temporal Dynamics vs. Boundary Conditions**. If integration is a process, the boundary moves continuously. A snapshot criterion (required for coding specific papers) cannot capture the moving boundary without arbitrary thresholds. You cannot simultaneously demand precise temporal tracking and a stable boundary for classification.

  Second, **Subject Authority vs. Conflict Resolution**. If a subject says "I didn't decide that" (Authority) but functionally relies on the output (Conflict/Reliance), the criterion contradicts itself. Prioritizing function ignores phenomenology; prioritizing phenomenology ignores behavioral data. In the phone contact case, you don't know if the number is right (low authority) but you rely on it (high functional coupling).

  Third, **Gradients vs. Interventional Difference**. Interventions are often binary (resource present/absent). If extension is a gradient, the predicted intervention effect should also be graded. Most experimental designs cannot measure graded cognitive loss, forcing the criterion to collapse degrees into binaries for analysis, undermining the Gradient Specification requirement.

  # What to give up on

  Stop expecting any theory to meet **Gradient Specification** with precision. No current metric quantifies "degrees of extension" reliably enough for peer review. Demand instead that authors report *reliance frequency* and *error correlation*. This is the requirement that knocks out the most candidate theories, so press authors on it: if they claim extension, they must show how performance degrades as resource reliability drops. Treat the gradient as a reporting standard, not a metaphysical truth. Concede that binary coding is sometimes necessary for statistical power, provided the limitation is acknowledged.

  # Scorecard

  | View | Intervention | Gradient | Authority | Boundary | Temporal | Conflict |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **(a) Parity** | Pass | Fail | Fail | Fail | Pass | Pass |
  | **(b) Content** | Fail | Fail | Pass | Pass | Fail | Fail |
  | **(c) Integrationist** | Pass | Pass | Fail | Pass | Pass | Pass |
  | **(d) Coupled** | Fail | Pass | Pass | Pass | Pass | Fail |

  (a) Parity: Treats internal/external same. Fails gradients and boundaries (swallows everything).
  (b) Content: Requires specific representational content. Fails AI/Abacus (no content) and Intervention.
  (c) Integrationist: Access+Reliability. Best fit. Fails Subject Authority (overrides introspection).
  (d) Coupled: Nothing is extended. Passes Boundary (strict). Fails Intervention (no distinction made).
