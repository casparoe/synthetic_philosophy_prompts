      *Let's write.*

      *(Self-Correction during drafting "The three rounds"):* I need to make sure the instructions sound like handout text.
      *(Self-Correction during drafting "Debrief"):* Need to integrate the knowledgeable student naturally.

      *Final Polish:* Check the "generator vs filter" language in the Debrief. Ensure the "mismatch" sting is highlighted.

      *Wait, one detail:* "Round 3 to beat Round 2 on average despite the misleading notes." I need to ensure the scoring reflects this possibility. The rule needs to be hard enough that R2 struggles, but the tool in R3 makes it trivial *if* used. The misleading notes might slow them down, but the tool should overcome it.

      *Okay, ready to generate.*
