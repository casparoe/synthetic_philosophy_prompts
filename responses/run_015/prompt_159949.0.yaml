  2.  **Evaluate the Philosophical Viability (Crucial Step):**
      *   *Is the "Free is Idle" argument sound?* This is a standard nominalist/eliminativist move against ontological free lunches. If $X$ supervenes on $Y$ and adds no causal power, why posit $X$? Lewis argues we *should* posit $X$ because it's free and makes semantics easy. The counter-argument is that "free" isn't a virtue if "idle" is a vice (parsimony/ideology).
      *   *Is plural quantification neutral?* This is the biggest technical hurdle. George Boolos and others argue plural quantification is ontologically innocent. However, some (like Peter van Inwagen or certain nominalists) argue that "there are some things" implicitly commits to a set or a fusion. Lewis explicitly argues plural quantification *doesn't* commit to a class/fusion. So, using plurals against Lewis is fair game within his own framework, provided I don't assume plurals *are* fusions.
      *   *Is the "fusion just is the parts" concession fair?* Lewis says the fusion is *identical* to the parts (taken plurally). But he distinguishes this from the parts *distributed*. If the Nihilist says "there are no fusions, only parts," and the Universalist says "the fusion is nothing over and above the parts," the difference shrinks to verbalism *unless* the Universalist insists on the *existence* of the fusion object in the domain of quantification. If they insist on that existence but admit it adds no being, the Nihilist charge of idleness holds.
