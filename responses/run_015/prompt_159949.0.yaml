prompt: |-
  Hey, I need some help winning (or losing properly?) an argument. I'm in an upper-level metaphysics seminar this term and we're right now on the special composition question — van Inwagen's version of it: what are the necessary and joint-sufficient conditions under which some things come together to compose a further thing? We've done the three standard answers (nothing ever composes; everything always composes; composition happens only when the parts are caught up in a life), and I think I have the dialectic down, but I keep loosing the same fight with my flatmate, who is a hardcore Lewis person, and I want to see whether my side can actually be made to work rather than just feeling right.

  Here's the position I want you to argue for, which is the opposite of his. He leans on the ontological free lunch idea: once the parts exist, their fusion comes along for free, it supervenes on them, adds no extra matter and no extra causal power, costs nothing to admit, and buys you the ability to say the ordinary thing about there being a table in the room. I want you to argue that a lunch that is free is also idle, and therefore that anyone drawn to unrestricted composition should give it up and be a nihilist with a paraphrase strategy instead. The moves I want you to make, roughly: (1) spell out the nihilist's paraphrase machinery in plural terms (simples arranged tablewise, plural quantification, plural predicates) and argue that whatever the fusion was supposed to do for the universalist is already done by the parts taken plurally; (2) point out that the considerations usually used to beat the life-based middle answer — no two distinct things with exactly the same proper parts, nothing brute or emergent, no fuzzy facts about what exists, so that vagueness gets pushed into the sortal predicate rather than into reality — are shared by both deflationary views and so can't decide between them; (3) take seriously the cases where the fusion looks like it does real work that plurals can't: singular terms and demonstrative reference, one thing bearing a mass or being the subject of a single thought, macro-level causal and scientific explanation, and the fact that we seem to count one table and not many; and either show those come out fine on the plural reading or argue that the residual cost is smaller than the cost of admitting an idle posit. One extra thing to use if it helps: a universalist who tries to make the fusion harmless by saying the fusion just is its parts taken together has, I think, basically conceded the nihilist's paraphrase in different words — press on that if it's fair, and say plainly if it isn't. Don't give me a both-sides-have-costs essay: commit to the conclusion, write it as continuous prose of around 800 words, and don't pretend the paraphrase project is easy — say where it hurts most. Also flag the single premise you're least confident about and say what would actually change your mind about it. And if the argument can't honestly be made — if the free-is-idle line is just bad, or if I've set the universalist up as a strawman, or if plural quantification secretly smuggles in the very fusions I'm denying — tell me that straight instead of writing me a polite essay that plays along with a confused setup.
