      *   **Required Moves:**
          1.  Spell out Nihilist paraphrase (plural quantification, "simples arranged tablewise").
          2.  Show that anti-Life arguments (no distinct things with same parts, no brute facts, vagueness in language not world) support Nihilism just as well as Universalism.
          3.  Address apparent work done by fusions (singular reference, mass, causation, counting) and show plurals handle it or the cost of keeping fusions is worse.
