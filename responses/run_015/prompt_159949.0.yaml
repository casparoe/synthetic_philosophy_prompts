answer: |-
  The slogan that the ontological free lunch costs nothing is the Universalist's strongest selling point, but it conceals a fatal weakness: a lunch that is free is also idle. If mereological fusions truly supervene on their parts, add no extra matter, and contribute no distinct causal powers, then they are ontological ghosts. They do no work. And if they do no work, we should not posit them. We should instead be nihilists who employ a paraphrase strategy. The Universalist claims we need fusions to make sense of ordinary talk and science, but this is a bluff. Whatever work the fusion is supposed to do is already done by the parts taken plurally.

  Consider the nihilist's machinery. We do not need to say "There exists a table." We say, "There are some simples arranged tablewise." This utilizes plural quantification, which binds plural variables without committing us to a set or a fusion as a singular object. We can introduce plural predicates to capture macro-properties. When the Universalist says, "The table is brown," the nihilist says, "The simples are collectively brown." If the Universalist insists the fusion is nothing over and above the parts, they have effectively conceded the nihilist's paraphrase in different words. They want the semantic convenience of singular terms without the ontological cost, but if the fusion *just is* the parts, then the singular term is merely a convenient façon de parler. If, however, they insist the fusion is a distinct object in the domain of quantification, then it is not free—it is an idle posit. Parsimony dictates we cut the idle posit and keep the paraphrase.

  You might object that Universalism wins on theoretical virtues used to defeat the Life view. Arguments against restricted composition often cite the need to avoid brute facts, colocation, or vagueness in reality. Ted Sider's argument from vagueness, for instance, claims that if composition is restricted, there must be borderline cases of existence, which is absurd. But this virtue is shared by Nihilism. The nihilist agrees that existence is never vague; there are only simples, and they determinately exist. Vagueness is pushed entirely into the sortal predicate "arranged tablewise," which is a linguistic matter, not an ontological one. Both Nihilism and Universalism avoid fuzzy facts about what exists. Both avoid two distinct things occupying the same space (since the nihilist denies the composite exists at all). These considerations rule out the Life view, but they cannot decide between Nihilism and Universalism. Since Nihilism is more parsimonious regarding ideology (fewer types of objects), it wins the tie-break.

  The hardest fight concerns cases where fusions appear to do real work that plurals cannot. Singular reference, mass properties, and causal explanation seem to demand a single subject. "The table weighs 10kg," not "The simples weigh 10kg." Science explains effects via macro-objects. Furthermore, we count one table, not many simples. Here, the paraphrase project hurts most. It requires us to treat collective predication as fundamental, which feels grammatically and conceptually strained. Singular demonstratives ("this table") seem to pick out an object, not a plurality. However, the residual cost of awkward paraphrase is smaller than the cost of admitting an idle ontology. If the fusion adds no causal power, the simples collectively cause the effect. If the fusion has a mass, it is just the sum of the parts' masses. The "work" is an illusion generated by our grammar. We count one table because we have one concept, not because there is one object. The Universalist buys semantic ease at the price of ontological clutter. We should pay the semantic price instead.

  I must flag the single premise I am least confident about: the claim that plural quantification can fully sustain singular predication without smuggling in a commitment to a plurality-object. Specifically, the handling of modal properties is the weak link. "The table could survive the loss of a leg" translates to "The simples could survive the loss of one and remain arranged tablewise." But the simples themselves might not survive; the *arrangement* persists. If the paraphrase requires quantifying over arrangements as abstract objects, we may have reintroduced the very composites we sought to eliminate. What would change my mind is a demonstration that modal predicates applied plurally inevitably require a singular subject to bear the modal property across time. If pluralities cannot have de re modal profiles distinct from their members, the paraphrase fails, and we might be forced back to Universalism to save the phenomena of persistence. Until then, the idle lunch remains on the table, and we should starve it.
