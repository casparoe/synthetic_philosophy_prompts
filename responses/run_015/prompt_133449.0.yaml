answer: |-
  I concede the prosthesis functions identically for both, but functional parity isn't ontological identity. The device is a shared archive, not a private mental vault. For Bertrand, retrieval triggers a mnemonic state grounded in his perceptual experience; for Ada, it triggers a belief grounded in testimony. The token state in the silicon is merely the common cause of these distinct internal states. You worry about overwriting, but if Bertrand deletes an entry, he destroys evidence, not Ada's mind. She loses a source of justification, akin to burning a shared notebook, not suffering amnesia. The boundary remains at the skin because mental states are owned by the subject whose biography grounds them. Coupling is tight, yes, but constitution requires ownership of the history that generates the content. Even with direct neural interfaces, the history of experience remains individual, preserving the distinction between remembering and knowing.
