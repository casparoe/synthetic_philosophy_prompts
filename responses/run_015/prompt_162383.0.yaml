answer: |-
  # The Artistic Ethics Decision Tree

  **Instructions:** Start at Question 1. Follow the path dictated by your intuition on the concrete case. Your final stop is your position.

  **Q1. Location:** A novel endorses slavery vs. The author committed fraud. Is the moral trouble *inside* the work's voice, or *outside* in the maker's life?
  *   **Inside:** Go to Q2.
  *   **Outside:** Go to Q5.

  **Q2. Invitation:** The work asks us to delight in cruelty vs. suffer with the victim. Does the work invite us to *share* the vice?
  *   **Yes:** Go to Q3.
  *   **No:** Go to Q4.

  **Q3. Success:** Does this invitation to share vice make the work more compelling or less coherent?
  *   **Compelling:** **Leaf 1: Immoralism.** (Some works are artistically better for being immoral; viciousness aids success.) *Awkward commitment:* You must praise works specifically for their moral viciousness.
  *   **Incoherent:** **Leaf 2: Ethicism.** (Moral defects are *pro tanto* artistic defects; merits are artistic merits.) *Awkward commitment:* You must downgrade art solely for moral failings, regardless of aesthetic power.

  **Q4. Structure:** Is the moral flaw a clumsy error or an invitation to an unmerited response?
  *   **Unmerited Response:** **Leaf 3: Structural Ethicism.** (The defect is structural, inviting a response the work cannot merit.) *Awkward commitment:* Relies on opaque psychological claims about audience response.
  *   **Clumsy Error:** **Leaf 4: Simple Ethicism.** (Moral flaws are aesthetic flaws.) *Awkward commitment:* Conflates moral clumsiness with aesthetic clumsiness.

  **Q5. Ingredient:** A collage uses stolen photos vs. The painter was a thief. Is the wrongdoing physically *part* of the object?
  *   **Yes:** Go to Q6.
  *   **No:** Go to Q7.

  **Q6. Meaning:** Does knowing the origin change what the work *means* or just our permission to touch it?
  *   **Meaning:** **Leaf 5: Contextualism.** (The maker's vice changes what the work means without changing how good it is as art.) *Awkward commitment:* You must accept the work is now about something else than it appears.
  *   **Permission:** **Leaf 6: Causal Ingredient View.** (The work is partly made of the wrong; the object is tainted.) *Awkward commitment:* Treats art like contaminated food rather than expression.

  **Q7. Benefit:** Streaming pays the abuser vs. Watching reruns does not. Does engagement fund the vice?
  *   **Yes:** Go to Q8.
  *   **No:** Go to Q8.

  **Q8. Category:** Is "artistic value" the only reason to engage, or are there other values?
  *   **Only Value:** **Leaf 7: Radical Autonomism.** (Artistic value is wholly insulated from both the work's moral defects and the artist's.) *Awkward commitment:* Permits funding villains purely for art's sake.
  *   **Other Values:** **Leaf 8: Moderate Autonomism.** (Insulates artistic value but concedes conduct gives reasons of another kind about whether to engage.) *Awkward commitment:* Separates "good art" from "worth watching."
  *   **No Distinct Value:** **Leaf 9: Deflationism.** (Artistic value is not a distinct kind of value at all; the debate rests on a mistake.) *Awkward commitment:* Dissolves the category of art entirely.

  ***

  ### Empty Cells

  The logical space permits combinations no one defends.

  1.  **Maker Immorality = Artistic Defect, Work Immorality ≠ Defect.** This cell is **incoherent**. It claims the artist's life stains the art's quality, but the art's own voice does not. It privileges biography over text inexplicably.
  2.  **Moral Defects = Artistic Merits, Never Defects.** This cell is **incoherent**. It claims vice always aids art, virtue never does. It requires a universe where goodness is always aesthetically boring.
  3.  **Internal Flaw Matters, External Funding Doesn't.** This cell is **merely unattractive**. It holds that watching immoral art is wrong, but paying the immoral artist is fine. It separates consumption from support arbitrarily.

  ***

  ### Honesty About Failure

  This tree cannot separate all positions.

  1.  **Moderate Autonomism vs. Deflationism.** Both agree value judgments don't dictate conduct. The difference is metaphysical (does "artistic value" exist?) rather than practical. No case question prys them apart because their verdicts on *what to do* are identical.
  2.  **Structural vs. Simple Ethicism.** Both conclude moral flaws are artistic flaws. The difference is mechanism (psychological response vs. general property). A concrete case rarely distinguishes "clumsy" from "unmerited response" without theoretical stipulation.
  3.  **Contextualism vs. Causal Ingredient.** Both restrict engagement based on origin. One says the *work changed*, the other says the *object is tainted*. In practice, both say "don't watch." To separate them, you would need a case where knowing the meaning changes but the taint remains irrelevant, which is hard to construct intuitively.

  ***

  ### The Real Argument

  You and your friend were likely arguing about **conduct**, not **value**.

  **Where Value Verdicts Settle Conduct:**
  *   **Radical Autonomists** agree: If it's good art, watch it. Funding is irrelevant.
  *   **Ethicists** agree: If it's morally flawed, it's artistically flawed. Don't watch bad art.

  **Where Value Verdicts Do NOT Settle Conduct:**
  *   **Radical vs. Moderate Autonomists.** Both agree the show is *good art*. They disagree on whether to stream it. One says "Art wins," the other says "Ethics wins." This is not a debate about quality; it is a debate about priority.
  *   **Ethicists vs. Immoralists.** Both might say "Don't watch." The Ethicist says "It's bad art." The Immoralist says "It's good art, but too dangerous." They agree on conduct, disagree on value.

  **The Practical Map:**
  *   **To Teach/Quote:** Contextualists allow this (meaning changed); Autonomists allow this (value insulated); Ethicists forbid this (defect transmitted).
  *   **To Stream/Buy:** Moderate Autonomists forbid this (funding vice); Radical Autonomists allow this (value distinct).
  *   **To Programme Retrospective:** Distributed Authorship (not fully mapped above) matters here. If the vice belongs to one of 200, Moderate Autonomists may allow it; if sole creator, they forbid it.

  **Diagnosis:** You argued about value (is it still good?) to settle conduct (should we watch?). But Moderate Autonomism proves you can answer "Yes" to value and "No" to conduct. Your disagreement was likely about **Q8 (Category)**: Is artistic value the trump card, or just one chip on the table?
