      *   *Refining the Fountain Point:* I need to be careful. The standard Money Pump argument assumes that if you prefer $X$ to $Y$, you will pay $\epsilon$ to swap $Y$ for $X$. It does *not* assume you will pay to swap $X$ for $Y$. So the cycle is directional. The User's Fountain says: "If you can be pumped (lose money), you can be fountained (gain money) by going the other way." This requires that for every trade $X \to Y$ you pay for, there is a trade $Y \to X$ you will accept payment for. This is generally true (if I prefer $X$, I won't pay to get $Y$, but I will accept money to give up $X$ for $Y$).
      *   *So:* If I have $A$, and $A \succ B \succ C \succ A$.
