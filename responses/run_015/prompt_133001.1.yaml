  *(Refinement on Kosovo)*: The Kosovo myth actually *did* undergo a massive shift during Yugoslavia (suppressed/secularized) and then reactivated. This is like viral latency. I should mention that.

  *(Refinement on Dunkirk)*: Dunkirk is interesting because it's a "successful failure." The fitness is high because it leads to eventual victory (1945). Kosovo is a "permanent failure" that is framed as victory. This distinction matters for the "fitness" definition.

