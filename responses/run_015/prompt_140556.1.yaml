      *   Let's combine them. The List is **Deontic/Rule-Based** (External). The Character is **Aretaic/Virtue-Based** (Internal/Dispositional).
      *   Wait, the "Constitutive Rule" distinction (Searle) is arguably the cleanest logical carving.
          *   Regulative: "Don't talk about naming." (Applies to any agent).
