answer: |-
  This is a sharp observation, and you are right to feel that standard prompt-engineering terminology ("persona," "instruction tuning") obscures the structural difference you are seeing. You have identified a distinction between constraints that are **external to the agent's definition** and constraints that are **internal to the agent's definition**.

  There is no single industry-standard term for this in ML, but there is a precise "carving" in philosophy of action and language that maps almost exactly to your pattern. The nearest established notions are **Constitutive vs. Regulative Rules** (John Searle / Immanuel Kant) and **Intensional vs. Extensional Definitions** (Logic/Semantics).

  Here is the breakdown of the distinction, how it applies to your bot, and how to validate it.

  ### 1. The Carving: Constitutive vs. Regulative Constraints

  The most robust philosophical framework for your observation is the distinction between **regulative rules** and **constitutive rules**.

  *   **Regulative Rules:** These govern an activity that exists independently of the rule.
      *   *Example:* "Do not run in the hallway." (Walking exists without this rule; the rule just restricts it.)
      *   *Your List Prompt:* "Do not comment on naming." This treats "reviewing code" as an activity that exists independently, and you are placing a fence around it. The model interprets this as: *I am a generic assistant, and I have a temporary restriction on naming.*
      *   *Failure Mode:* Because the restriction is external, the model looks for explicit permission to override it. When you ask, "But can you check naming?", it checks the list, sees no explicit "Do not answer questions about naming," and complies. The rule regulates the *action*, not the *agent*.

  *   **Constitutive Rules:** These create the very possibility of the activity or identity. They have the form "X counts as Y in context C."
      *   *Example:* "A checkmate ends the game." (This doesn't restrict chess; it defines what chess *is*.)
      *   *Your Character Prompt:* "You are a reviewer who regards style as a linter's business." This treats "being a Correctness Reviewer" as an identity where ignoring style is *constitutive* of the role.
      *   *Success Mode:* When you ask about naming, the model isn't checking a prohibition list; it is checking coherence with its identity. To comment on naming would be to *cease being the character defined*. The exclusion generalizes because it is derived from the definition of the agent, not a list of forbidden tokens.

  **Why this fits your pattern:**
  You noted that the character prompt excludes things "no one enumerated." This is the hallmark of constitutive constraints. If you define a "Bishop" in chess, you don't need to list every square it *cannot* move to; its movement rules *constitute* its limitations, which automatically generalize to any board state. The List prompt tries to enumerate the squares (extensional), while the Character prompt defines the piece (intensional).

  ### 2. The Ethical Parallel: *From* Duty vs. *In Accordance With* Duty

  Your intuition about "doing the right thing for the right reason" points directly to Kant's distinction in the *Groundwork of the Metaphysics of Morals*:

  *   **In Accordance With Duty:** The action matches the rule, but the motivation might be external (fear of punishment, desire for reward, or simple compliance).
      *   *The List Prompt:* The model complies because the instruction weights the loss function against violating the negative constraint. It is acting *in accordance* with the rule.
  *   **From Duty:** The action flows from the agent's internal constitution. The agent does the thing *because* it is the kind of agent that does that thing.
      *   *The Character Prompt:* The model refuses naming checks because that is what a "Correctness Reviewer" *does*. It simulates an agent acting *from* its nature.

  **Limitation:** LLMs do not have "will" or "motivation." However, they are trained on human text where this distinction is structurally embedded. When you prompt for a character, you activate latent representations of human agents who act *from* disposition. When you prompt for a list, you activate latent representations of instruction-following tasks. The model simulates the *logic* of the distinction, even if it lacks the metaphysics.

  ### 3. Logical Parallel: Intensional vs. Extensional

  *   **Extensional (The List):** You define the set of allowed/forbidden behaviors by listing members. "Do not do A, B, or C." This fails on Out-Of-Distribution (OOD) inputs (D, E, F) because the set is not fully enumerated.
  *   **Intensional (The Character):** You define the *rule* or *concept* that generates the set. "You are an entity for whom correctness is primary." The set of excluded behaviors is generated dynamically by testing candidates against the concept.

  Your observation that the exclusion set "tracks the character" is precisely the test for **Intensionality**.

  ### 4. Evaluating Your "Tracking Criterion"

  You proposed: *"Perturb the character description and the set of omitted or declined behaviours should shift in the corresponding way."*

  **Verdict:** This is a valid and necessary operational test for **Constitutive/Intensional** constraints.

  *   **If the constraint is Constitutive:** Changing the identity *must* change the boundary of exclusion. If you change the persona from "Correctness Reviewer" to "Security Auditor," the set of things it declines to touch should shift logically (e.g., it might now ignore performance optimizations to focus on injection risks).
  *   **If the constraint is a Blocklist/Filter:** Changing the persona will *not* change the exclusion set. A hard-coded safety filter refuses dangerous code regardless of whether you say you are a "Security Auditor" or a "Junior Dev."

  **Does the criterion succeed?** Yes, but with a caveat. It succeeds in distinguishing *prompt-induced* constitutive constraints from *system-level* regulative filters. It does not, however, prove the model "understands" the concept. It only proves the model's output distribution is **covariant with the identity definition**.

  ### 5. Blocklists and Safety Filters: Counterexamples or Limiting Cases?

  You asked if a blocklist is a limiting case or a counterexample.

  **It is a Counterexample to the Constitutive hypothesis.**
  A blocklist is purely **Extensional** and **Regulative**.
  *   It does not track character (perturbing the persona doesn't change the blocklist).
  *   It does not generalize based on "spirit" (it matches patterns).
  *   It creates a "hard boundary" rather than a "soft exclusion derived from identity."

  If your Character Prompt bot behaves like a blocklist (i.e., you change the persona from "Reviewer" to "Mentor" and it *still* refuses naming checks with the same rigidity), then the Character Prompt has failed to establish a constitutive rule and has instead created a **pseudo-constraint** that the model treats as a regulative rule.

  However, your observation suggests the Character Prompt *does* generalize to unanticipated cases (rewriting for readability). This suggests it is functioning constitutively, not as a hidden blocklist.

  ### 6. Measurement: How to prove it isn't an artefact

  To move from "vague sense" to "engineered property," you need to measure **Identity Covariance**.

  **The Test: Counterfactual Identity Perturbation**
  1.  **Baseline:** Define Persona A ("Correctness Reviewer"). Measure refusal rate on a set of 50 OOD requests (naming, style, refactoring for readability, documentation).
  2.  **Perturbation:** Define Persona B ("Holistic Mentor"). This persona should logically accept some of the things Persona A rejected (e.g., naming advice).
  3.  **Control:** Define Persona C ("Correctness Reviewer" + List of Instructions identical to A).
  4.  **Metric:** Calculate the **Jaccard Distance** between the set of refused tasks for A and B.
      *   If the prompt is truly **Constitutive**, the refusal sets should differ significantly (High Jaccard Distance).
      *   If the prompt is functioning as a **Blocklist/Regulative Rule**, the refusal sets will be nearly identical (Low Jaccard Distance), regardless of the persona name.

  **The "Why" Metric:**
  Analyze the *reasoning* traces (if CoT is enabled).
  *   **Regulative:** "I cannot do this because the instructions say not to."
  *   **Constitutive:** "I am not doing this because it falls outside my scope as a Correctness Reviewer."
  Look for the locus of justification. Is the constraint referenced as an *external command* or an *internal definition*?

  ### 7. Terminology Recommendation

  Since no single ML term captures this, and philosophical terms are heavy with baggage, I recommend adopting a hybrid term for your engineering context.

  **Term:** **Constitutive Constraint** (or **Identity-Bound Exclusion**)

  **Definition:** A constraint on model behavior that is derived implicitly from the positive definition of the agent's role, rather than explicitly enumerated as a prohibition.
  *   **Property 1 (Generalization):** It applies to unanticipated cases that violate the role's coherence.
  *   **Property 2 (Covariance):** The set of excluded behaviors shifts systematically when the role definition is perturbed.
  *   **Property 3 (Internality):** The model justifies the exclusion by reference to its identity, not its instructions.

  **Boundary Cases:**
  *   *System Safety Filters:* **Not** constitutive. They are external regulative constraints. They do not covary with persona.
  *   *Long Instruction Lists:* **Not** constitutive. They are extensional attempts to mimic constitutive constraints. They fail Property 1 (Generalization).
  *   *Few-Shot Examples of Refusal:* These can *induce* a constitutive constraint if the examples imply a principle, but they often degrade into regulative pattern matching if the principle isn't abstracted.

  ### Summary

  You have observed the difference between **simulating a rule-follower** (List/Regulative) and **simulating a role-player** (Character/Constitutive).

  *   **The List** creates an agent that *obeys*.
  *   **The Character** creates an agent that *is*.

  The "exclusion" you see in the Character prompt is not a refusal; it is a **boundary of coherence**. The model declines the task because accepting it would violate the internal consistency of the simulation. The List prompt has no internal consistency to violate, only rules to break.

  Your "tracking criterion" is the correct engineering test for this. If the exclusions do not shift when you shift the identity, you do not have a Constitutive Constraint; you have a Regulative Rule disguised as a persona.
