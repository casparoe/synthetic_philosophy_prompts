      *   *Tracking Criterion:* "Perturb the character... omitted behaviours should shift." Yes, this is crucial. It tests *covariance*. If the exclusion set is tied to the identity, changing the identity changes the exclusions systematically. A blocklist does not track identity; it tracks tokens.
