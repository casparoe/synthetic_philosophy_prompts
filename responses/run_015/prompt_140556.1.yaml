          *   *Framing B (Instruction/List):* "Address correctness, do not comment on style..." -> The model follows the rules literally. It might still comment on naming if asked later, or include newcomer explanations despite having the facts. It satisfies the positive constraints but fails to generalize the negative constraints (the "spirit" of the role).
      *   **The Core Question:** Is there an established philosophical or technical concept for this difference? Specifically, the difference between *satisfying a specification* vs. *behavior shaped by an internal principle that generates exclusions/generalizations*.
      *   **Requirements:** Don't just drop a label. Explain the "carving" (the conceptual distinction). Compare nearest notions. Evaluate the user's "tracking criterion." Distinguish from blocklists/safety filters. Suggest metrics for validation. If no established concept fits, coin/define one with boundaries.

