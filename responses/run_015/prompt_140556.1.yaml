      *   *Concept 3: Intensional vs. Extensional Definition.* List tries to enumerate the extension (the set of allowed actions). Character defines the intension (the rule generating the set). The intension handles OOD cases better.
      *   *Evaluating the "Tracking Criterion":* It is the operational test for Intensionality. If exclusions track identity, it's intensional/constitutive. If exclusions stay static despite identity change, it's a blocklist/regulative filter.
      *   *Blocklists:* They are extensional approximations. They fail the tracking test.
      *   *Measurement:* Propose "Identity Perturbation Testing." Change the persona slightly (e.g., "Senior Reviewer" vs "Junior Reviewer") and see if the *boundary* of refusal moves logically.
      *   *Conclusion/Neologism:* If existing terms are too loaded, suggest **"Constitutive Constraint"** or **"Identity-Bound Negativity."** But actually, **"Normative Generalization"** or **"Dispositional Constraint"** might be better. Let's stick to the philosophical "Constitutive Rules" as the primary anchor, as it's the most precise "carving."

  8.  **Refining the Philosophy:**
