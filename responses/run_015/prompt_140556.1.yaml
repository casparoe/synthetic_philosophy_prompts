      *   *Virtue Ethics (Aristotle):* Character-based. A virtuous person doesn't need a rule for every situation; their character guides them. This matches the "First-Person/Character" framing.
      *   *Intensional vs. Extensional:* Extensional = the set of actual actions taken. Intensional = the rule/concept defining the set. The character prompt creates an *intensional* definition that generates the behavior, whereas the list prompt tries to define the *extension* directly.
