  4.  **Addressing Low Attendance (9 people):**

      *   Pairing scheme needs even numbers. 9 is odd.
      *   *Fix:* The "Echo" logic works on *clustering*. If 9 people, one triplet or one person paired with the "average" of the group (or the host).
