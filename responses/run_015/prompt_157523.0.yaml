      *   *Wait, Pre-session survey:* The prompt says "Before the session each person answers...". So that time is saved.
      *   *Revised Timeline:*
          *   0-5: Welcome & Rules.
          *   5-15: Round 1.
          *   15-25: Round 2.
          *   25-35: Round 3.
          *   35-75: Debrief.

  6.  **Developing the Script:**

      *   Tone: Neutral, facilitator, not lecturer.
      *   Key phrases to avoid: "Rational," "Equilibrium," "Superrational."
      *   Key phrases to use: "Match," "Copy," "Chance," "Unique."

  7.  **The "Causal vs. Logical" Objection:**

      *   This is the hardest part. The game enforces *causal* correlation (the server copies the bit). The philosophy relies on *logical* correlation (we think the same).
      *   *Honesty:* I must admit in the debrief that the game *simulates* the correlation physically, whereas the real dilemma asks you to assume it logically. The game proves "If your decisions are linked, you can't win by claiming." The philosophy asks "Are your decisions linked just because you are both rational?"
      *   *Action:* I need to make sure the script doesn't conflate the two until the debrief.

  8.  **Failure Modes:**

      *   *Collusion:* People talking during the decision phase. *Fix:* Strict silence rule.
      *   *Contrarian:* Someone claims just to break the system. *Use:* In debrief, this breaks symmetry.
      *   *Cheating Accusations:* "The server lied." *Fix:* Open source the script or show logs.
      *   *No Winner:* Everyone abstains or everyone claims. *Fix:* This is actually the desired outcome for Round 3. Money goes to the "community jar."

  9.  **Refining the Payoff:**

      *   $200 total.
      *   Round 1: $50 to unique claimer.
      *   Round 2: $50 to unique claimer.
      *   Round 3: $50 to unique claimer (Impossible, but keep the offer).
      *   Remaining $50 + any unclaimed rounds: Pizza/Drinks for next session.
      *   *Why:* Ensures money is spent, reduces bitterness if no one wins.

  10. **Refining the "Echo" Mechanic:**

      *   Pre-session survey: 5 questions.
      *   Clustering: Pair closest neighbors.
      *   Round Logic:
