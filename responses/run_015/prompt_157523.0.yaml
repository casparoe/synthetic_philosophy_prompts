  ### 5. Limitations: What This Game Does Not Prove

  You must be honest about this in the debrief so you don't walk away thinking you've solved Newcomb's Problem.

  1.  **Causal vs. Logical:** The game enforces correlation physically (the server overwrites the card). The Platonia Dilemma relies on *logical* correlation (we think alike). The game proves "If your choices are linked, you lose." It does *not* prove "Your choices *are* linked just because you are rational."
  2.  **Pairwise vs. Global:** The game correlates pairs. The dilemma implies global correlation (everyone is linked to everyone). A win was still possible in Round 3 if *other* pairs failed to coordinate. In the true dilemma, if *everyone* reasons perfectly, *no one* can win without randomization.
  3.  **One-Shot vs. Iterated:** This is a one-shot game. In real engineering, we iterate. The "rational" move in an iterated game is often cooperation/reputation building, which muddies the pure logic of the dilemma.

  **Closing Script:**
  "We built a machine that made your choices correlated, and we saw the prize vanish. The philosophical question is: Do you need a machine for that? Or does the fact that we are all engineers in this room, looking at the same code, create that link already? That's the homework."

  ### 6. Preparation Checklist

  1.  **Code:** Write the script to handle submissions, pair assignments, and the $c$-probability overwrite. Ensure it logs the "Source/Receiver" assignment for every pair for the debrief.
  2.  **Survey:** Ensure the 5-6 questions are processed and pairs are assigned *before* you walk into the room.
  3.  **Money:** Bring cash in envelopes labeled "Round 1", "Round 2", "Round 3", "Beer Fund". Visualizing the money helps.
  4.  **Room:** Arrange seating so pairs are *not* sitting next to each other (to reduce accidental collusion).
  5.  **Backup:** Have a QR code ready for the submission form in case the primary link fails.

  This design respects your constraints, protects your budget, and isolates the specific philosophical variable (correlation) you want to demonstrate, while explicitly flagging where the simulation diverges from the theory.
