      *   **User:** Backend Go engineer, mid-sized company, runs Thursday lunch-and-learns (16-18 people, 75 mins). No formal philosophy training.
      *   **Topic:** Platonia Dilemma (Hofstadter).
      *   **Goal:** Make the room *feel* the pull of symmetric reasoning/randomization without being told upfront.
      *   **Key Learning Objectives:**
          1.  Universal abstention is incoherent (worth same as universal greed).
          2.  Randomized claiming is the real alternative (construct it themselves).
          3.  Force comes from *correlation* of decisions, not altruism/trust.
          4.  At perfect correlation ($c=1$), the prize is unwinnable (claim matched by second claim, abstain gets nothing).
      *   **Mechanic:** Pre-session survey to cluster participants into "echo" pairs. Three rounds with correlation probability $c \in \{0, 0.5, 1\}$.
      *   **Constraints:**
          *   Budget: ~$200 real money (must pay out, not simulate).
          *   Time: 75 minutes.
          *   No lecture upfront. No jargon (superrationality, Platonia, Hofstadter) until debrief.
          *   Handle "spoilers" (2 regulars know the answer).
          *   Handle low attendance (9 people).
          *   Provide: Rules, materials, timeline, script, payoff scheme, debrief map, objection handling, failure modes.
