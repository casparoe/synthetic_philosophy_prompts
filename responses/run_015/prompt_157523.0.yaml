  ### 4. Failure Modes & Mitigation

  | Failure Mode | Severity | Mitigation |
  | :--- | :--- | :--- |
  | **Spontaneous Coordination** (Talking/Signaling) | **Fatal** | **Prevention:** State the disqualification rule clearly at 00:00. **Response:** If caught, disqualify the pair publicly but calmly. "That breaks the simulation. You're out for the money, but stay for the discussion." |
  | **The Contrarian** (Claims just to break it) | **Useful** | **Debrief:** Use them. "This person broke the symmetry. In a world of perfect reasoners, this shouldn't happen. But in engineering, we always have edge cases." |
  | **"Psychology Experiment" Accusation** | **Medium** | **Transparency:** "This is not about your psyche. It's about game theory. The code is open source; I will paste the repo link in the chat now. The logic is deterministic." |
  | **Cheating Accusations** (Server lied) | **Medium** | **Proof:** Show the logs immediately after Round 3. Show the random seed. "The code is the referee. I am just the facilitator." |
  | **No One Wins Anything** | **Low** | **Payoff:** The Beer Fund ensures the $200 is still spent on the team. "We failed to coordinate, so we drink together next week." |
  | **Spoiler Shouting** | **Medium** | **Deflection:** "That's the solution for a different game. In *this* game, I need to see what happens when you don't know that yet." |

