  **JOINT STATEMENT ON AGENCY, CAUSATION, AND RESPONSIBILITY**
  **Drafted by:** [Compatibilist Representative] & [Incompatibilist Representative]
  **Date:** October 26, 2023
  **Subject:** Points of Convergence and Divergence Regarding Metaphysical Freedom

  ### I. Agreed Claims (Shared Empirical and Conceptual Commitments)

  1.  **Definition of Determinism:** Both parties agree that causal determinism is the thesis that every event or state of affairs, including every human decision and action, is the inevitable and necessary consequence of antecedent states of affairs in accordance with the laws of nature. If determinism is true, the future is physically fixed given the past and the laws.
  2.  **Neuroscience Findings:** Both parties agree that contemporary neuroscience establishes a robust correlation between neural activity and decision-making. Specifically, we agree that measurable brain activity often precedes conscious awareness of a decision (e.g., readiness potential data). We agree this demonstrates that decisions are biological processes, but we disagree on whether this biological grounding eliminates the *type* of control required for responsibility.
  3.  **Frankfurt-Style Cases:** Both parties agree that Frankfurt-style cases (where a counterfactual intervener ensures an outcome but does not actually intervene because the agent chooses the outcome voluntarily) successfully challenge the Principle of Alternative Possibilities (PAP) as a *necessary* condition for moral responsibility in some intuitions. We agree these cases force a distinction between "regulative control" (ability to do otherwise) and "guidance control" (mechanism of action).
  4.  **Utility of Responsibility Practices:** Both parties agree that holding agents responsible serves vital social functions (deterrence, reconciliation, norm reinforcement). We disagree on whether these practices are *justified* fundamentally by desert (what an agent metaphysically merits) or solely by consequentialist outcomes.
  5.  **The "Hard Problem" of Agency:** Both parties agree that there is no currently accepted scientific instrument capable of detecting "metaphysical freedom" directly. All observable data is consistent with both a deterministic universe containing responsible agents and a deterministic universe containing mere automatons.

  ### II. Table of Fundamental Disagreements

  | Crux | Shared Case / Argument | Compatibilist Position & Prediction | Incompatibilist Position & Prediction |
  | :--- | :--- | :--- | :--- |
  | **1. The Meaning of "Could Have Done Otherwise"**<br>Does this require literal branching history or merely counterfactual sensitivity? | **Case:** *The Deliberating Voter.*<br>An agent votes for Candidate A after weighing reasons. The laws of nature and past state fixed this outcome 100 years prior. | **Position:** "Could have" means the agent possesses a mechanism sensitive to reasons. If reasons had favored B, the mechanism would have produced B.<br>**Prediction:** We predict ordinary language and legal practice will continue to treat this sensitivity as sufficient for "choice." | **Position:** "Could have" requires that given the *exact* same past and laws, the agent could have produced ~A. This is physically impossible under determinism.<br>**Prediction:** We predict that once people grasp physical fixity, intuitions about "choice" in this case will dissolve. |
  | **2. Moral Responsibility & Sourcehood**<br>Does responsibility require sourcehood that survives deterministic causation? | **Argument:** *The Manipulation Argument.*<br>Agent A is determined by natural causes. Agent B is determined by a neuroscientist's programming. Both act identically. | **Position:** Responsibility depends on the *actual sequence*. If A's action issues from their own reasons-responsive mechanism without coercion, they are responsible. B is not responsible because the source is external.<br>**Prediction:** We predict the distinction between internal determination (character) and external manipulation will remain morally salient. | **Position:** Responsibility requires *ultimate* sourcehood. If A's character was determined by factors beyond their control (genetics/environment), A is relevantly similar to B. Both lack ultimate origination.<br>**Prediction:** We predict that rigorous analysis will show no morally relevant difference between natural determinism and covert manipulation. |
  | **3. Recursive Self-Modeling (Niche Framing)**<br>Does an agent with perfect introspection of their deterministic dynamics possess control that matters for blame? | **Case:** *The Transparent Mind.*<br>An agent can perfectly model their own neural dynamics and predict their own choices before they happen, yet the dynamics remain fully deterministic. | **Position:** This recursive loop *is* the control that matters. The agent is not bypassed; the system is monitoring and governing itself. This constitutes rational autonomy.<br>**Prediction:** We predict this level of self-integration will be judged as the paradigm of freedom, even if determined. | **Position:** This is merely a determined system monitoring itself. The "self" doing the modeling is as determined as the neurons being modeled. No new causal power is introduced.<br>**Prediction:** We predict that perfect prediction will reinforce the intuition of inevitability, reducing blame attributions rather than securing them. |

