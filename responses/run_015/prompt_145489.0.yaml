answer: |-
  1. Reasons are not attitude-specific, so pragmatic coherence legitimately grounds interpretive belief symmetrically, rendering the wrong-kind objection incoherent rather than merely unattractive. The adjacent space where reasons are attitude-specific but the objection remains incoherent is unoccupied and diagnosed as unstable, though the tree cannot separate this pair comprising the present position and radical contextualism.

  2. Reasons are attitude-specific yet pragmatic narrative coherence never supplies legitimate reason for interpretive belief, maintaining symmetry between moral and aesthetic attitudes while diagnosing the adjacent permissive space as unattractive. This view is indistinguishable from error theory regarding narrative utility, and while specialists contest whether evidential constraints are this rigid, the tree cannot separate this pair of positions without adding a fourth branching question.

  3. Reasons are attitude-specific and pragmatic coherence supplies legitimate reason symmetrically for both aesthetic and moral interpretive attitudes, treating the adjacent asymmetric space as unattractive due to its arbitrary privileging of moral content. It remains contested whether this collapses the distinction between believing a story is good and believing it is true, and the tree cannot separate this pair of stances without further qualification.

  4. Reasons are attitude-specific and pragmatic coherence supplies legitimate reason for aesthetic but not moral interpretive attitudes, diagnosing the symmetric space as incoherent for failing to respect the unique normativity of moral truth. This position is popular among ethicists, yet the tree cannot separate this pair comprising the position and pragmatic encroachment without further qualification.

  5. Reasons are attitude-specific and pragmatic coherence supplies legitimate reason for moral but not aesthetic attitudes, leaving this adjacent logical space merely unexplored as it reverses standard intuitions about artistic licence. Most deem this view unstable, yet the tree cannot separate this pair of positions from nuanced contextualism without adding a fourth branching question.
