  ### House Worksheet (The Recipe)
  ```text
  PLAYER: ___________________

  ROUND 1 CHECK:
  Sum of (1 + 2): _______
  [ ] If > 100: SELL Both. Loss = Sum - 100
  [ ] If < 100: BUY Both. Loss = 100 - Sum
  [ ] If = 100: No Trade. Loss = 0
  ROUND 1 LOSS: _______

  ROUND 2 CHECK:
  Sum of (3 + 4): _______
  Value of (5): _______
  [ ] If (3+4) > 5: SELL 3&4, BUY 5. Loss = (3+4) - 5
  [ ] If (3+4) < 5: BUY 3&4, SELL 5. Loss = 5 - (3+4)
  [ ] If Equal: No Trade. Loss = 0
  ROUND 2 LOSS: _______

  TOTAL LOSS: _______
  ```

