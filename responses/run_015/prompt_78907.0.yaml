answer: |-
  Here is a complete game kit for your "Coherence Night." It is designed to be run by a host who is comfortable with basic addition but not necessarily probability theory. The math is hardcoded into the worksheets so you don't have to invent it on the fly.

  # Game Title: The Bookie's Trap

  **Time:** 90 Minutes
  **Players:** 12–16
  **Materials:**
  *   Tokens (poker chips, printed slips, or dried beans). 1,000 per player.
  *   "Bet Sheets" (one per player, see template below).
  *   "House Worksheet" (one for you, see template below).
  *   A bag with 10 marbles (mix of Red and Blue, unknown ratio). **Seal this bag before anyone arrives.**
  *   One nice prize (bottle of wine/whisky) for the player with the most tokens at the end.
  *   Pens.

  ---

  ## Part 1: The Rules (15 Minutes)

  **1. The Goal**
  You start with 1,000 tokens. At the end of the night, we draw a marble from the sealed bag. Tickets pay out based on the draw and other conditions. The person with the most tokens wins the prize.

  **2. The Golden Rule (The "One Number" Rule)**
  On your Bet Sheet, you will write a **Price** for various tickets.
  *   A ticket costs you that many tokens to **buy**.
  *   A ticket earns you that many tokens if the House **buys it from you**.
  *   **Crucial:** Your Price is binding both ways. If you write "60," you must be willing to pay 60 to hold the ticket, OR accept 60 to give the ticket away. You cannot refuse the trade if the House offers it.

  **3. The Tickets**
  Each ticket pays **100 Tokens** if the condition is met, **0 Tokens** if not.
  *   *Example:* Ticket "Red Marble" pays 100 if the marble drawn is Red.
  *   *Example:* Ticket "Not Red" pays 100 if the marble is Blue (or any other color).

  **4. The House**
  I am the House. I do not know what is in the bag. I will look at your Prices and decide whether to Buy tickets from you or Sell tickets to you. I will do this based on a fixed recipe. I am not trying to beat you on luck; I am testing your numbers.

  ---

  ## Part 2: The Betting Rounds (40 Minutes)

  Hand out the **Bet Sheets**. Give players 5 minutes per round to write their numbers. Collect sheets after each round.

  ### Round 1: The Certainty Trap (Complementary Events)
  *Players price two tickets that cover all possibilities.*
  1.  **Ticket A:** The marble drawn is **Red**.
  2.  **Ticket B:** The marble drawn is **Not Red**.

  *(Note to House: This tests if Price(A) + Price(B) = 100.)*

  ### Round 2: The Logic Trap (Additivity)
  *Players price three tickets involving overlap.*
  1.  **Ticket C:** The marble is **Red**.
  2.  **Ticket D:** The marble is **Blue**.
  3.  **Ticket E:** The marble is **Red OR Blue**.

  *(Note to House: Assuming only Red/Blue marbles are in the bag, C+D should equal E. If there are other colors, C+D should be $\ge$ E. For simplicity, tell them the bag contains **only** Red and Blue marbles, but not the ratio.)*

  ### Round 3: The Future Self (Reflection)
  *This addresses your "future opinion" requirement.*
  1.  **Ticket F:** "After the draw, I will write on a slip that I am **>50% confident** I could have predicted the outcome."
      *   *Verification:* After the draw, every player must write "Yes" or "No" on a slip. If "Yes", Ticket F pays 100.
  2.  **Ticket G:** The marble is **Red**.

  *(Note to House: This tests if they are certain they will be certain. Most people will price Ticket F at 100 (because they think they'll understand the result once they see it) but price Ticket G at 50. This isn't a direct Dutch Book, but it sets up the debrief on 'Reflection'.)*

  ---

  ## Part 3: House Calculation (10 Minutes)

  *While players take a bio break or chat, you and one volunteer (who is good with addition) process the sheets using the **House Worksheet**.*

  **The House Recipe (Do not deviate):**

  **For Round 1 (Red / Not Red):**
  *   Add Price(A) + Price(B).
  *   **If Sum > 100:** The House **SELLS** both tickets to the player.
      *   *Player Cost:* Sum.
      *   *Player Payout:* 100 (since one must happen).
      *   *Player Loss:* Sum - 100.
  *   **If Sum < 100:** The House **BUYS** both tickets from the player.
      *   *Player Gain:* Sum.
      *   *Player Payout:* -100 (Player must pay House 100 when one wins).
      *   *Player Loss:* 100 - Sum.
  *   **If Sum = 100:** No trade. Loss = 0.

  **For Round 2 (Red / Blue / RedOrBlue):**
  *   Add Price(C) + Price(D). Compare to Price(E).
  *   **If (C + D) > E:** House **SELLS** C and D to player, **BUYS** E from player.
      *   *Player Cost:* C + D.
      *   *Player Gain:* E.
      *   *Net Cash:* E - (C+D). (This will be negative).
      *   *Outcome:* Either Red or Blue happens. Player collects 100 on C or D. House collects 100 on E. Net Payout = 0.
      *   *Player Loss:* (C + D) - E.
  *   **If (C + D) < E:** House **BUYS** C and D, **SELLS** E.
      *   *Player Loss:* E - (C + D).

  **For Round 3:**
  *   Do not make trades here. Just record the numbers for the debrief. This round is for discussion, not bankruptcy.

  **Total Score:**
  *   Start: 1,000 tokens.
  *   Subtract Losses from Round 1 & 2.
  *   Add/Subtract any Round 3 trades (if you choose to make them, but recommended to skip for time).
  *   Add any winnings from the final Marble Draw (for tickets the player *kept*).
      *   *Wait, simplification:* To save time, **cancel out the final draw payout.**
      *   *Why?* The Dutch Book guarantees a loss *regardless* of the outcome. If you run the final draw payout, you have to calculate who held which ticket.
      *   *Better Rule:* The House settles the "Book" immediately. The player's final score is 1,000 minus the "Sure Loss" calculated above.
      *   *Wait, that removes the thrill of the marble draw.*
      *   *Compromise:* The House settles the "Dutch Book" trades (the sure loss). Any tickets *not* involved in the Dutch Book (e.g., if the House only booked one side) remain active for the final draw.
      *   *Actually, for a 90 min night:* **The "Sure Loss" IS the game.** The marble draw is just to prove the House didn't know the outcome.
      *   *Revised Scoring:* Players pay the "Sure Loss" immediately. Then, to keep it fun, everyone gets a free "Raffle Ticket" for the Prize based on their remaining tokens. Or, simply: **The person with the smallest "Sure Loss" wins.** (This rewards coherence, not luck).
      *   *Decision:* **The person with the smallest "Sure Loss" wins.** If someone has 0 loss (coherent), they are the hero. If everyone loses, the smallest loss wins. This removes luck from the prize.

  ---

  ## Part 4: The Reveal (10 Minutes)

  1.  **The Trap:** Call up a player who had a big loss (e.g., priced Red at 60, Not Red at 60).
  2.  **The Slip:** Hand them their sheet. Show the math: "You paid 120 tokens for these two tickets. One of them *must* pay you 100. You have lost 20 tokens before the marble was even drawn."
  3.  **The Hero:** Call up the player with 0 loss (e.g., priced Red 50, Not Red 50). "This person's numbers hung together. The House couldn't touch them."
  4.  **The Draw:** Open the sealed bag. Draw a marble. Show that the House didn't know the result. The loss happened because of the *numbers*, not the *marble*.

  ---

  ## Part 5: The Debrief Script (15 Minutes)

  *Sit in a circle. Keep it conversational.*

  **1. The "So What?" Objection**
  *   *Ask:* "Some of you lost tokens. Does this prove you're irrational, or just that you're bad at pricing tickets?"
  *   *Point:* If your beliefs guide your actions, and your actions guarantee a loss, your beliefs are acting incoherently. It's not about the tokens; it's about the structure of the choice.

  **2. The "I'm Not a Betting Machine" Objection**
  *   *Ask:* "Who felt that their 60% wasn't really a price? That it was just a feeling?"
  *   *Point:* The Dutch Book argument says: If you have a degree of belief, it *behaves* like a price. If you refuse to treat it like a price, you can't use it to make decisions. You can't have it both ways.

  **3. The Future Self (Round 3)**
  *   *Ask:* "Who priced Ticket F (Future Confidence) higher than Ticket G (Current Belief)?"
  *   *Point:* This is the 'Reflection Principle'. If you know now that you'll believe something stronger later (without new evidence), you should believe it stronger now. If you don't, you're predicting your own irrationality.

  **4. The Infinite Regress (Instruction 5)**
  *   *Say:* "There's a version of this trick that requires an infinite number of bets to prove you're wrong. That's a mathematical curiosity, not a practical one. Tonight proved something stronger: you can lose with just two or three bets."

  **5. What This Doesn't Prove**
  *   *Be Honest:* "This game doesn't prove there is a 'true' probability in the world. It doesn't prove the marble *was* 50/50. It only proves that *your* numbers didn't match each other. You can be coherently wrong (pricing everything at 0), but you can't be incoherently right."

