  ## Predictable Failures & Fixes

  **1. "I'll just price everything at 50."**
  *   *Outcome:* This player will have 0 loss. They will be the "Hero."
  *   *Fix:* Embrace it. In the debrief, ask them: "Did you price 50 because you know the ratio, or because it's safe?" If they say "Safe," point out that safety *is* coherence. They win because they respected the logic, not the world.

  **2. "I refuse to sell at that price."**
  *   *Outcome:* They break the Golden Rule.
  *   *Fix:* Before the game starts, make them sign the sheet. "By signing, I agree to trade at my written prices." If they refuse during the game, they are disqualified from the prize. This usually keeps them honest.

  **3. "The House is looking at my numbers to cheat."**
  *   *Outcome:* Distrust.
  *   *Fix:* Use the **House Worksheet** visibly. Do the math on a whiteboard or projected screen if possible. Show that the decision (Buy/Sell) is determined *only* by the Sum, not by the marble bag.

  **4. "The Future Opinion round is confusing."**
  *   *Outcome:* People price it randomly.
  *   *Fix:* Keep Round 3 out of the scoring. Use it *only* for the debrief discussion. Tell them: "This round doesn't cost tokens. It's for the philosophy talk at the end." This lowers stakes and reduces confusion.

  **5. Arithmetic Anxiety.**
  *   *Outcome:* You stall on the math.
  *   *Fix:* Recruit the "spreadsheet guy" mentioned in your prompt to be the Co-Host/Accountant. Give him the House Worksheet. You run the talk; he runs the numbers.

  ## Why This Works
  You wanted them to feel annoyed at themselves, not you. By using a sealed bag, you remove your knowledge from the equation. By using a fixed recipe (Sum > 100 = Sell), you remove your malice from the equation. The loss comes entirely from the gap between their two numbers. When you hand them the slip showing they paid 120 for a guaranteed 100 return, the silence in the room will do the teaching for you.
