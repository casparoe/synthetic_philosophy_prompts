answer: |-
  This is a precise and fertile observation. You have identified a "philosophical shibboleth": a phrase that signals membership in a reasonable community without requiring agreement on the underlying metaphysics. It functions less like a premise and more like a *speech act* of closure.

  Per your request, I will not endorse your list but refine and extend it into a menu of distinct theses. I have ordered these from the trivially true (but normatively inert) to the substantive (and contestable) to the likely false (but rhetorically potent). Following the menu, I will map these to the three conversational uses you described, analyze the asymmetry problem, and suggest the questions your committee should be asking instead.

  ### Part I: A Menu of Theses

  **1. The Sociological Truism (Causal Embeddedness)**
  *   **Thesis:** Every agent's beliefs and actions are causally conditioned by the prevailing norms, institutions, and information structures of their historical context.
  *   **Defensibility:** Trivially true. No agent is ahistorical.
  *   **What Settles It:** Sociology and intellectual history.
  *   **Normative Force:** None. If everyone is a product of their time, then being a product of one's time cannot distinguish the blameworthy from the blameless. This thesis explains but does not excuse.

  **2. The Epistemic Excuse (Inaccessibility)**
  *   **Thesis:** The moral considerations required to judge the action correctly were not *reasonably accessible* to the agent, given the information and conceptual vocabulary available to them.
  *   **Defensibility:** Contingently true or false depending on the agent. It hinges on the definition of "reasonably accessible." Does it mean "never articulated by anyone"? Or "not articulated by anyone in the agent's social circle"? Or "articulated but dismissed by the agent's peers"?
  *   **What Settles It:** Intellectual history (specifically, the history of dissent). We must determine if contemporary critics existed and whether the agent had access to them.
  *   **Normative Force:** Strong excuse condition. If true, it mitigates blame. However, it creates the **Asymmetry Problem**: if the agent couldn't know they were doing wrong, they also couldn't know they were doing right (if the "right" depended on the same unavailable moral concepts). This threatens to undermine praise as well as blame.

  **3. The Counterfactual Dependency (The Package Deal)**
  *   **Thesis:** The specific virtues or achievements we admire were causally dependent on the vices we condemn; removing the vice would have removed the virtue.
  *   **Defensibility:** Substantive and empirically testable, but often false. It requires a specific causal link (e.g., "Without the leisure provided by slave labor, Jefferson would not have written the Declaration").
  *   **What Settles It:** Counterfactual history and psychology. Would the agent have acted differently under different moral constraints?
  *   **Normative Force:** Suggests we cannot "net out" the good and bad. It argues for a holistic assessment of the life. It supports continued commemoration only if the net value is positive, but it does not excuse the vice.

  **4. The Commemorative Decoupling (Functionalism)**
  *   **Thesis:** The purpose of naming a building is not to canonize the moral purity of the namesake, but to signal a specific institutional value or historical continuity that the name represents *to us, now*.
  *   **Defensibility:** Strong. It shifts the domain from *moral evaluation of the dead* to *policy evaluation of the living*.
  *   **What Settles It:** Institutional mission statements and the philosophy of public memory.
  *   **Normative Force:** High. It renders the "blameworthiness" of the agent secondary to the "usefulness" of the name. It allows us to keep a name while condemning the person, provided the name still serves a productive function (e.g., "Churchill" signifies resolve against tyranny, not endorsement of imperialism).

  **5. The Meta-Ethical Relativist (Normative Obsolescence)**
  *   **Thesis:** Moral truths are time-relative; actions are only judged by the standards of the time in which they occurred. Therefore, applying current standards is a category error.
  *   **Defensibility:** Philosophically costly and likely false. It implies we cannot condemn historical atrocities (like slavery or genocide) as objectively wrong, only as "non-standard for that era."
  *   **What Settles It:** Meta-ethics (Moral Realism vs. Relativism).
  *   **Normative Force:** Absolute excuse, but at the cost of moral realism. If this thesis is true, we also lose the right to praise them by *our* standards.

  **6. The Conversational Truce (Pragmatic Deflection)**
  *   **Thesis:** This is not a proposition with truth conditions, but a performative utterance meaning: "I acknowledge the tension, but I judge that further debate on this specific point is unproductive for our current goals."
  *   **Defensibility:** Descriptively accurate of how the phrase functions.
  *   **What Settles It:** Discourse analysis and observation of conversational dynamics.
  *   **Normative Force:** None directly, but it functions as a procedural rule to halt infinite regress in moral accounting.

  ---

  ### Part II: Mapping the Theses to Your Three Uses

  Here is how the phrase operates in the three scenarios you described, and whether the conclusion survives scrutiny under the necessary thesis.

  | Use Case | Required Thesis | Does the Conclusion Survive? | The Vulnerability |
  | :--- | :--- | :--- | :--- |
  | **1. Closing Blame**<br>(Jefferson) | **Thesis 2 (Epistemic)** or **Thesis 5 (Relativist)**. | **No.** For figures like Jefferson, Thesis 2 is historically fragile (abolitionist arguments *were* available). Thesis 5 is philosophically untenable (we still want to call slavery wrong). | If the epistemic excuse fails (because dissent existed), the "man of his time" defense collapses into Thesis 1 (Truism), which excuses nothing. |
  | **2. Name Stays**<br>(Churchill) | **Thesis 4 (Commemorative Decoupling)**. | **Yes.** This is the most robust reading. It admits the vice but argues the *name* serves a function independent of the *man's* total moral ledger. | It requires the committee to articulate *what function* the name serves. If the function is "moral exemplar," the name must come down. If the function is "historical marker," it may stay. |
  | **3. Admire Achievement / Concede Vice**<br>(Columbus) | **Thesis 3 (Package Deal)** or **Thesis 1 (Truism)** smuggled as Thesis 2. | **Mixed.** If relying on Thesis 3, one must prove the vice was *necessary* for the achievement (often hard to prove). If relying on Thesis 1 smuggled as Thesis 2, it is a fallacy. | This use often relies on the ambiguity between "he couldn't help it" (Excuse) and "everyone did it" (Truism). It licenses admiration by blurring the line between explanation and exoneration. |

  **The Asymmetry Problem:**
  You noted the asymmetry of withholding blame vs. withholding praise.
  *   If you use **Thesis 2 (Epistemic)**, you *must* withhold praise too. If he couldn't know slavery was wrong, he couldn't know democracy was right (if both rely on modern moral concepts). This leads to a neutral historical stance.
  *   If you use **Thesis 4 (Commemorative)**, the asymmetry dissolves. We are not judging the man; we are curating a campus. We can praise the *achievement* (which remains historically factual) without praising the *agent* (whose moral status is irrelevant to the building's function).

  ---

  ### Part III: The Pragmatic Function (Why it stops conversation)

  You asked if the sentence is doing something unlisted. It is. It is a **Conversational Implicature of Charity.**

  When a speaker says, "He was a man of his time," they are often performing three moves simultaneously:
  1.  **Signaling Virtue:** "I am not a presentist; I understand history is complex."
  2.  **Granting Grace:** "I am choosing not to press the accusation of malice."
  3.  **Setting a Boundary:** "This inquiry has reached the limit of its utility."

  It stops conversation because it frames the opposition as *ungenerous* rather than *incorrect*. To continue arguing after this phrase is invoked is to risk appearing morally rigid or historically illiterate. It shifts the burden of proof: the accuser must now prove the agent was *exceptionally* bad, rather than the defender proving the agent was *typically* good. It is a rhetorical shield, not a logical sword.

  ---

  ### Part IV: What the Committee Should Ask Instead

  Since "He was a man of his time" is a conversation-terminator that obscures the actual criteria for decision-making, your committee should replace it with questions that force the specific thesis into the open.

  **Instead of:** "Was he a man of his time?"
  **Ask:** "Whose time are we talking about?"
  *   *Purpose:* Forces the **Reference Class** issue (Your point iv). Were there contemporaries who dissented? If so, the "epistemic excuse" fails.

  **Instead of:** "Does his racism disqualify him?"
  **Ask:** "What specific work is this name doing in this specific space?"
  *   *Purpose:* Forces the **Commemorative Decoupling** (Thesis 4). If the dining hall is meant to inspire exploration, does Columbus's specific history of colonization undermine that inspiration for the students eating there?

  **Instead of:** "Can we separate the art from the artist?"
  **Ask:** "Is the vice causally linked to the virtue we are honoring?"
  *   *Purpose:* Tests the **Package Deal** (Thesis 3). If we honor Churchill for 1940, does his imperialism undermine the specific narrative of "defense of liberty," or is it a separate ledger?

  **Instead of:** "Are we judging him?"
  **Ask:** "Are we endorsing him, recording him, or aspiring to be him?"
  *   *Purpose:* Distinguishes between **Endorsement, Record, and Aspiration**. A plaque can record (history); a statue can aspire (exemplar). "Man of his time" conflates these.

  **Recommendation for the Committee:**
  Adopt a policy that explicitly rejects "Man of his time" as a sufficient criterion. Require that any defense of a name must specify *which* thesis is being relied upon.
  *   If relying on **Epistemic Excuse**, provide the historical evidence of unavailable moral concepts.
  *   If relying on **Commemorative Decoupling**, articulate the institutional value the name signifies.
  *   If relying on **Package Deal**, demonstrate the causal necessity of the vice for the virtue.

  This transforms the discussion from a ritualistic incantation ("He was a man of his time") into a deliberative process about institutional values and historical accuracy. It prevents the phrase from doing the work of a premise without bearing the weight of one.
