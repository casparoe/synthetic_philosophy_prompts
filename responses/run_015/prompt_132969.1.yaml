  9.  **Final Polish:** Check the structure. Introduction acknowledging the insight. The Menu (numbered). The Mapping (table or structured list). The Pragmatic Analysis. The Alternative Questions. Conclusion. (Proceed to generate output based on this structure).

      *Wait, one nuance:* The user asked to "replace or extend rather than endorse" their list. I should incorporate their insights but frame them more rigorously as distinct philosophical claims. I will keep the spirit of their (i)-(v) but sharpen the philosophical edges.

      *Let's structure the Menu:*
