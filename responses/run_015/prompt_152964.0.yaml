  He leaned in, resting his elbow on the table. "So you're paralyzed? You're saying because the Liar paradox breaks exclusion, you can't assign odds to rain tomorrow? That's surrender, Nadia. We still have to bet. We still have to act. If your logic makes decision theory impossible, then pragmatism says your logic is too expensive. You don't throw away the map because there's a paradox in the legend; you draw a box around it and keep walking."
