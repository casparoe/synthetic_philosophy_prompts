answer: |-
  Two rational parties stand behind the Veil of Ignorance, tasked with designing the basic structure of society.

  "Proposal," says the first. "We adopt the Difference Principle. Inequalities are justified only if they benefit the least advantaged."

  "Seconded," says the second. "We'll use the Maximin rule to decide. We maximize the minimum outcome."

  "Wait," says the second, pausing. "To choose Maximin, I must be extremely risk-averse. If I were a risk-taker, I'd prefer a society with higher highs, even if the lows are lower."

  "True," says the first. "But the Veil hides our psychological profiles. You don't know if you're a risk-taker."

  "Exactly. So I don't know if Maximin is rational for me. To vote for Maximin, I have to assume I'm risk-averse. But assuming I'm risk-averse is knowing something about my specific psychology."

  "And knowing your psychology lifts the Veil."

  "Right. So I cannot justify the decision rule without violating the conditions of the deliberation."

  "So we're paralyzed?"

  "No. We just have to peek to confirm we're both cowards, then close our eyes and pretend we didn't."

  "But if we peek, I might see I'm a billionaire."

  "Then you'll veto the Difference Principle."

  "So Justice as Fairness requires us to know who we are, to agree to forget who we are, in case knowing who we are would make us forget the agreement."

  "Yes."

  "That's not an Original Position. That's a background check for a blindfold."
