answer: |-
  No need to apologize for the typos; writing on a phone between scenes is hardcore. Your "Mirror Constraint" concept is actually theoretically sound, even if you coined the name yourself. In academic speak, this is often discussed as "structured absence" or "negative evidence," but your term fits the dialogue better.

  Here is the breakdown of how archaeologists handle this knot, how to stage the argument, and whether your protagonist's cynicism holds water.

  ### 1. Breaking the Circle (Or Admitting You Can't)
  You are right that it is circular. To know an omission is intentional, you need to know the rules; to know the rules, you need to see the omissions. Archaeologists don't "break" this circle with logic; they blunt it with **controls**.

  In your scene, the colleague shouldn't argue that they *know* the belief exists. They should argue that the absence is **statistically significant**.

  *   **Taphonomic Controls:** If the soil preserves wood, bone, and metal in domestic trash heaps from the same time period, but the graves *only* have bone, the absence of metal in the graves is likely intentional. If the soil eats metal everywhere, then the absence in graves means nothing. The argument hinges on environmental preservation rates.
  *   **The "Costly Signal" Argument:** If omitting grave goods requires effort (e.g., everyone else is burying wealth, but this group specifically strips the body), that omission is a "costly signal." It takes social energy to enforce a rule of *not* burying things. That enforcement implies an institution.
  *   **Ethnographic Analogy:** Archaeologists often look at modern or historical groups in similar environments. If a known group in a similar climate buries without goods due to a specific taboo, it creates a probabilistic model for the ancient group. It's not proof, but it's a working hypothesis.

  **For the dialogue:** The colleague should say, "We aren't reading minds, we're reading patterns. If the dirt keeps everything else but the graves are empty, the emptiness is the artifact."

  ### 2. Positive vs. Negative Traces
  Is there a difference between reading a symbol on a pot (positive) and a missing object in a grave (negative)? Yes, but not in the way your protagonist thinks.

  *   **Positive Traces (Symbols):** These are expressive. They tell you what people wanted to *show*. But symbols can be lied about, or they might be decorative rather than religious. A sun symbol might mean "god," or it might just mean "day."
  *   **Negative Traces (Omissions):** These are normative. They tell you what people were *forbidden* from doing. It is harder to fake an omission. If a society consistently fails to bury food with the dead despite having surplus food, that is a rule.

  **The Twist:** Many archaeologists argue that negative traces are actually *stronger* evidence of social structure (institution) than positive traces. Positive traces show imagination; negative traces show control.

  **For the dialogue:** Your protagonist argues that symbols are guesses. The colleague should counter that omissions are rules. "A symbol tells me what they dreamed. An omission tells me what they feared."

  ### 3. The "Science of Minds" Debate
  Your protagonist's stance—that archaeology can only study material constraints, not minds—is not too cynical. It is a recognized, hardline position.

  *   **The History:** In the 1960s/70s (Processual Archaeology), scholars argued exactly this: "We dig up trash, not thoughts. Stop guessing."
  *   **The Shift:** In the 80s/90s (Post-Processual), the field swung back: "Material culture *is* meaning. You can't separate the object from the mind that made it."
  *   **Current State:** Most modern archaeologists sit in the middle. They admit they can't know specific thoughts ("He was sad"), but they argue you can reconstruct "systems of meaning" ("They valued anonymity").

  **Is it a dead end?** No. It's a methodological boundary. If your protagonist holds the hardline view, they are essentially a **Materialist**. They believe that "belief" is just a story people tell to explain their material habits. This is a defensible, sharp intellectual position. It makes them sound rigorous, not just grumpy.

  ### 4. Drafting the Scene: Sharp, Not Pretentious
  To keep the dialogue from sounding like a lecture, ground it in the dirt. Have them standing over a specific grave or looking at a catalog.

  **Key beats for the argument:**
  1.  **The Trigger:** The colleague wants to publish that the empty graves prove a "cult of purity" or "spiritual asceticism."
  2.  **The Pushback:** Protagonist points out the soil chemistry or the lack of preservation elsewhere.
  3.  **The Theoretical Knot:** Protagonist brings up the circularity (your Mirror Constraint).
  4.  **The Resolution (or lack thereof):** The colleague admits the uncertainty but argues for the "best fit" model. The protagonist refuses to validate the guess.

  **Sample Dialogue Snippet:**

  > "You're calling it a ritual omission," I said. "I'm calling it rot."
  >
  > "The soil tests came back, Elias. The iron survives in the middens. It survives in the postholes. It doesn't survive in the graves."
  >
  > "So we found a hole in the ground with no iron in it. That's data. Calling it a 'belief in non-attachment' is fiction."
  >
  > "It's not fiction, it's inference. If every house has iron and every grave lacks it, the lack is the pattern. The pattern is the institution."
  >
  > "That's the trap," I said. "You need the institution to explain the lack, but you're using the lack to prove the institution. It's a mirror constraint. We're just staring at our own reflection and calling it a ghost."
  >
  > "Or," she said, brushing dirt off a femur, "we're admitting that what people choose *not* to bury tells us more about them than what they keep."

  ### Summary for your notes:
  *   **The Circle:** Broken by environmental controls and statistical consistency, not logic.
  *   **Absence:** Harder to interpret than presence, but often better evidence of social *rules*.
  *   **Protagonist's View:** Valid, rigorous, slightly old-school (Processual), but not a "dead end." It's a boundary line they refuse to cross.
  *   **Terminology:** Your "Mirror Constraint" works well as character-specific jargon. It sounds like something a specific professor would coin to describe "structured absence."

  This gives you enough friction for a scene without needing to solve the philosophy of science. Good luck with the draft.
