      *Wait, one more check on P5:* P5 minute says "reviewer does not need to verify the crux, only to see whether the criticism was answered." P6 minute says "reviewer can check each such local claim quickly." P6 is actually *stronger* on verification than P5. So P5 supports funding P6 even more than P1/P2 do, provided the procedural constraints are met. The corpus is the main risk.

      *Final Polish of JSON fields:*
      *   `working_note`: Focus on the tension between P5 (process) and P1/P2 (evidence), and the hidden "balanced test set" norm.
      *   `candidate_principles`: Ensure "prediction" matches the logic.
