      3.  *Evaluation Symmetry:* (None explicitly, but P6 fails this).

      *Let's look closer at P5:* P5 funded despite reviewer lacking data. Why? Because the *process* forced clarity on unanswered claims. P6 relies on reviewer checking links. This is closer to P1/P2.
      *The Corpus Issue:* This is the real kicker. P1-P5 don't mention pilot corpora composition. This is a new dimension.
      *Principle they would disown:* "We only fund pilots where we know the answer key beforehand to ensure our metrics look good." Or "We avoid funding where the 'No' side might actually win too often." Let's phrase it as "Symmetric Win Conditions."

      *Recommendation:* Fund with conditions. The mechanism (debate + local verification) is strong (P1/P2). The flaw is the evaluation set (all positives). Condition: Must include negative cases (no vulnerability) to test the "No" side's ability to prove safety/cleanliness.

      *Underdetermination:* Do precedents settle it? No, because none of P1-P5 specified the distribution of ground truth in their pilot data.
      *Principle if Fund:* "Local verifiability of argument steps is sufficient even if global ground truth is hard to access, provided the pilot tests both verdicts."
      *Principle if Reject:* "Oversight mechanisms must be validated on a balanced set of positive and negative cases to prove they don't just bias towards finding faults."

      *Discriminating Pilot:* Run the same protocol on 100 buggy files and 100 clean files. Measure accuracy on both.

