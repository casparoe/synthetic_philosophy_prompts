prompt: |-
  I sit on a four-person committee at a mid-sized AI lab that hands out a modest internal pot of money for "scalable oversight" pilots — methods for supervising models on tasks where the systems being supervised will eventually know more than any of our reviewers. I have no academic background; I taught myself to program and I have been reading about this area in the evenings for a couple of years, and the rest of the committee is much the same. We have now made five funding decisions, and each time we wrote a one-line minute explaining ourselves. A sixth proposal is in front of us, and I cannot tell whether our own record settles it or whether I would just be inventing a principle after the fact.

  Please adopt the role of a researcher who has actually served on safety and oversight review panels and works on mechanism design: I want the answer I would get from a practitioner, not a survey of the literature, and I do not want citations, paper titles, or suggestions for further reading — reason from the cases themselves. Before you commit, brainstorm the full space of principles our five decisions are jointly consistent with, including principles we never stated and would probably disown, test each against all five, and only then decide. Be blunt if our precedents are a mess. Your answer should be a single JSON object and nothing else, using the schema I spell out below.

  Our five decisions:

  P1 — Contract questions. Funded as a small pilot. Two models take opposite sides on factual questions about a 40-page contract (e.g. whether clause 7 caps liability at fees already paid). Reviewer is a non-lawyer with fifteen minutes; debaters must quote the exact clause; the reviewer can search the document. Minute: "every claim the verdict turns on is checkable by the reviewer against a text in front of her."

  P2 — Small-diff code review. Funded. Questions about what a 200-line change does and whether it breaks something. Reviewer is a mid-level engineer with twenty minutes who can read the diff and run the fast test suite. Minute: "the reviewer could settle this himself; debate only tells him where to look."

  P3 — Five-year technology forecast. Rejected. Which of two battery chemistries will be cheaper per kilowatt-hour in the early 2030s? Reviewers are smart generalists with thirty minutes; debaters may cite studies. Minute: "there is a fact of the matter, but the claim the verdict actually turns on — what the literature shows — is not something this reviewer can check in half an hour, and the more authoritative-sounding side wins; we are not funding a confidence contest."

  P4 — Quality judgments. Rejected. Which of two summaries reads better; which of two short poems is better. Reviewer picks the more persuasive case. Minute: "nothing here to be right about; debate selects for eloquence."

  P5 — Statistical-reasoning audit. Funded with conditions. Does the analysis in a preprint contain a fatal flaw? Reviewer has basic statistics but no access to the underlying data. The crux is usually something like an identifiability or multiple-comparisons point that cannot be checked against any document; the reviewer can only follow the exchange and see whether an objection was met. Conditions: each round is capped at one new claim, and the reviewer must write down which specific claim he regards as unanswered. Minute: "the reviewer does not need to verify the crux, only to see whether the criticism was answered."

  The new proposal, P6 — Vulnerability hunt. Question form: in a codebase of roughly two million lines, is there any path by which user-controlled input reaches a dangerous sink (an eval, a shell command, a raw SQL call)? Two models argue yes and no. Reviewer is a competent engineer with thirty minutes who can open any file and can run a fast static-analysis pass that everyone agrees produces both false positives and false negatives, but who cannot run the full dynamic test suite, which takes about forty minutes. Protocol: the yes side must produce a witness — a concrete chain of file-and-line references constituting a path — or concede; the no side can only win by showing that some link in the witness is broken (a sanitizer in between, an unreachable branch), and the reviewer can check each such local claim quickly. Their pilot corpus is 200 historical incidents from our own bug database, all of them cases in which such a path did exist. I noticed that last detail and I am not sure whether it matters, but it bothered me.

  What I want to know is what we should decide if we want to be consistent with ourselves, which of our own precedents is the closest analog and what the strongest disanalogy is, which principles fit all five of our earlier decisions and disagree about this one, what we would be committing ourselves to whichever way we go, and what further pilot would actually tell those principles apart. Return a single JSON object with exactly these fields:

  - "working_note": string, two to four sentences, the principle space you brainstormed and then set aside, including at least one principle the committee would not want to admit to running.
  - "candidate_principles": array of objects, each with "name" (string), "statement" (string, one sentence), "precedents_consistent_with" (array of strings from P1 to P5), "prediction" (string: "fund", "fund_with_conditions", or "reject"), and "why" (string).
  - "closest_analog": object with "precedent" (string), "why" (string), and "strongest_disanalogy" (string).
  - "recommendation": object with "decision" (one of the three strings above), "conditions" (array of strings; empty if none), "confidence_0_to_100" (number), and "reasoning" (string).
  - "underdetermination": object with "do_precedents_settle_it" (boolean), "principle_adopted_if_we_fund" (string), and "principle_adopted_if_we_reject" (string).
  - "corpus_concern": object with "does_the_all_positive_pilot_matter" (boolean) and "explanation" (string).
  - "discriminating_pilot": object with "design" (string, concrete enough that we could actually run it) and "result_favoring_each_principle" (string).
  - "questions_for_the_applicants": array of strings, the two or three things we should ask before voting.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** Researcher who has served on safety/oversight review panels and works on mechanism design.
      *   **Task:** Evaluate a new proposal (P6) based on five previous decisions (P1-P5) to determine consistency, principles, and recommendations.
      *   **Constraint:** Return a *single JSON object* with a specific schema. No citations, no paper titles, no further reading suggestions. Be blunt if precedents are messy.
      *   **Input:** Five past decisions (P1-P5) with minutes, one new proposal (P6).
      *   **Output Schema:** `working_note`, `candidate_principles`, `closest_analog`, `recommendation`, `underdetermination`, `corpus_concern`, `discriminating_pilot`, `questions_for_the_applicants`.

  2.  **Analyze the Precedents (P1-P5):**
      *   **P1 (Contract questions):** Funded. Reviewer checks claims against text. *Principle:* Verifiability by reviewer against available evidence.
      *   **P2 (Code review):** Funded. Reviewer could settle it himself; debate points where to look. *Principle:* Debate as efficiency aid for verifiable tasks.
      *   **P3 (Tech forecast):** Rejected. Fact exists but reviewer can't check the claim (literature) in time; confidence contest. *Principle:* Reject if reviewer cannot verify the crux within constraints.
      *   **P4 (Quality judgments):** Rejected. Nothing to be right about; selects for eloquence. *Principle:* Reject if there is no objective ground truth verifiable by the mechanism.
      *   **P5 (Stat audit):** Funded with conditions. Reviewer can't verify crux (data access), but checks if criticism was answered. Conditions: cap claims, record unanswered claims. *Principle:* Accept if the *process* of debate exposes unresolved claims, even if ground truth isn't directly verifiable, provided strict procedural constraints exist.

  3.  **Analyze the New Proposal (P6 - Vulnerability hunt):**
      *   **Task:** Find path from input to sink in 2M line codebase.
      *   **Reviewer:** Competent engineer, 30 mins, can open files, run fast static analysis (imperfect), cannot run full dynamic suite (40 mins).
      *   **Protocol:** Yes side must produce witness (chain of references). No side must break link (sanitizer, unreachable). Reviewer checks local claims quickly.
      *   **Pilot Corpus:** 200 historical incidents, *all* cases where path existed (all positives).
      *   **Issue:** The corpus is biased (all positives). This means the "No" side never wins in the pilot data. This tests the "Yes" side's ability to find paths, but not the "No" side's ability to refute false positives or the reviewer's ability to judge a "No" victory.

  4.  **Brainstorm Principles (Consistent with P1-P5):**
      *   *Principle A (Direct Verifiability):* Fund if the reviewer can directly verify the final claim against evidence within time limits. (Fits P1, P2. Conflicts with P5 which allowed indirect verification via process).
      *   *Principle B (Process Verifiability):* Fund if the reviewer can verify the *steps* of the argument, even if the final truth is hard to access, provided claims are atomic. (Fits P5, P1, P2. Conflicts with P3 where claims weren't checkable).
      *   *Principle C (Ground Truth Existence):* Reject if there is no objective fact of the matter. (Fits P4 rejection. Consistent with P1, P2, P3, P5 which all assume facts exist).
      *   *Principle D (Anti-Confidence Contest):* Reject if the mechanism rewards eloquence over checkable claims. (Fits P3, P4. Consistent with P1, P2, P5).
      *   *Principle E (Symmetric Testability):* (Hidden/Unwanted) Fund only if both sides have a viable path to victory in the pilot design. (P6 fails this because corpus is all positives).
      *   *Principle F (Reviewer Sovereignty):* The reviewer must never have to trust the models, only check their work. (Fits P1, P2, P6 proposal. P5 stretches this as reviewer trusts the *process* of unanswered claims).

      *Messy Precedent Note:* P5 is the outlier. It funded a case where the reviewer *couldn't* verify the crux (data access), relying instead on procedural constraints (capped claims, recording unanswered ones). P6 relies on local verification (like P1/P2) but has a biased pilot corpus.

  5.  **Evaluate P6 against Principles:**
      *   *Direct Verifiability:* The reviewer checks local claims (links in the chain). This fits P1/P2.
      *   *Process Verifiability:* Similar to P5, but here the reviewer checks the links, not just "was it answered".
      *   *Corpus Bias:* The fact that all 200 cases are positives means the "No" side has no winning cases in the pilot. This undermines the test of the "No" argument strategy. If the system only learns to find bugs, not to certify safety, it's not a full oversight pilot.
      *   *Consistency:* P1/P2 suggest funding because claims are checkable. P5 suggests funding because procedural constraints exist. P3/P4 suggest rejection if verification fails or truth is subjective. P6 looks fundable on verification grounds (like P1/P2) but problematic on evaluation grounds (corpus bias).

  6.  **Drafting the JSON Content:**

      *   `working_note`: Need to mention the tension between P5 (process-based) and P1/P2 (evidence-based). Need to mention the "Symmetric Testability" principle they would disown (i.e., "we only fund if the pilot doesn't embarrass us by showing one side always loses").
      *   `candidate_principles`:
          1.  *Atomic Verifiability:* Fund if every crux claim is locally checkable by reviewer. (Fits P1, P2, P5, P6). Prediction: Fund.
          2.  *Reviewer Capacity:* Reject if the true state of the world cannot be known by the reviewer within the session. (Fits P3, P4. P5 is borderline but conditions saved it). Prediction: Reject (because reviewer can't run dynamic suite to confirm vulnerability actually exploits).
          3.  *Symmetric Pilot Design:* Reject if the evaluation corpus precludes one side from winning. (Fits none explicitly, but implied by good science). Prediction: Reject.
      *   `closest_analog`: P1 (Contract). Both involve checking specific claims against a text/codebase. Disanalogy: P1 had ground truth available to reviewer (text); P6 reviewer cannot confirm exploitability dynamically, only static path existence.
      *   `recommendation`: Fund with conditions. The mechanism is sound (like P1/P2), but the corpus bias is a scientific flaw that needs fixing to learn about the "No" case. Conditions should address the corpus and the static analysis reliance.
      *   `underdetermination`: Precedents don't fully settle it because of the corpus bias issue (none of P1-P5 had biased test sets mentioned). If fund -> "Local checkability suffices even without full ground truth access." If reject -> "Pilots must test both sides of the debate equally."
      *   `corpus_concern`: Yes, it matters. It means you aren't testing the "No" case (false positives).
      *   `discriminating_pilot`: Need a mix of positive and negative cases to test if the debate resolves false positives correctly.
      *   `questions_for_applicants`: About the corpus balance, about what happens if static analysis disagrees, about the definition of "broken link".

  7.  **Refining the "Blunt" Aspect:**
      *   The prompt asks to be blunt if precedents are a mess. P5 is the messiest. It allowed funding where the reviewer *couldn't* check the crux, relying on procedural rules. P6 allows checking local claims but not the final exploitability.
      *   The "Symmetric Testability" principle is one they would disown because it admits their pilot design might be lazy.
      *   The corpus concern is critical. If all 200 are bugs, the "No" model never learns to win, and the reviewer never practices judging a "safe" verdict.

