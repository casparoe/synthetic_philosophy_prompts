      *   Working note: The committee oscillates between requiring direct evidence (P1, P2) and trusting procedural constraints when evidence is missing (P5). A principle we would disown is that we only fund pilots where the answer key is known and biased toward the failure mode we expect, ensuring high recall without testing precision.
