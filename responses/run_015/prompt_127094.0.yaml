answer: |-
  ### The Two Rules

  Based on the theorist's record, we can distill two competing principles that guide her institutional analysis. Both are consistent with her prior judgments, yet they diverge on the boundary between "embedded wisdom" and "functional redundancy."

  **1. The Principle of Constitutive Tacitness (Strict Mapping)**
  Derived from her rulings on ministerial resignation, the hereditary chamber, and local arbitration.
  *   **Formulation:** An institution cannot be altered if its operation relies on unwritten norms, embodied practices, or tacit social pressures, unless every such hidden purpose is explicitly mapped and replicated in the new design. The *form* of the institution is often constitutive of its *function*; if the mechanism changes, the latent wisdom embedded in the original mechanism is presumed lost unless proven otherwise.
  *   **Prediction for the Recess Case:** **Reject.** The mandatory recess relies on the *human experience* of delay (cooling passion, informal negotiation, the rhythm of patience). These are tacit, embodied effects. An algorithm cannot replicate the "cooling" of human emotion because it does not possess passion to cool. Since the hidden anthropological purpose cannot be mapped onto code, the change violates the fence.

  **2. The Principle of Functional Relocatability (Functional Substitution)**
  Derived from her rulings on the guild monopoly and the civil/religious marriage split.
  *   **Formulation:** An institution may be altered or abolished if its explicit purpose is duplicated by a new mechanism and any residual social roles are either absent or can be relocated to another part of the system without degradation. Efficiency gains are permissible provided the core social function is preserved, even if the medium changes.
  *   **Prediction for the Recess Case:** **Accept (Tentative).** The explicit purpose of the recess is "reflective purpose" and "cooling passion" (interpreted as preventing hasty, incoherent laws). The algorithm claims to sharpen reflection and ensure coherence. If one views the "delay" merely as an instrumental cost to achieve "better laws," and not as a social good in itself, the algorithm successfully relocates the function of reflection from *time* to *logic*.

  ### The Verdict

  **Prediction:** She will **reject** the proposal to replace the legislative recess with the algorithmic filter.

  **Reasoning:**
  While the *Principle of Functional Relocatability* might permit the change in abstract theory (as seen in the Guild and Marriage cases), the specific nature of the legislative recess aligns more closely with her *Local Arbitration* and *Hereditary Chamber* rulings. In those cases, she prioritized the *human* and *community* dimensions over efficiency or logical optimization.

  The recess is not merely a timer; it is a **temperamental technology**. Just as she argued the hereditary chamber cultivated a "distinctive deliberative temperament" through its selection mechanism, the recess cultivates a "legislative temperament" (patience, humility, cooling) through the mechanism of forced waiting. An algorithmic filter optimizes for *coherence*, which is a logical property, not a moral or emotional one. It removes the *human* element of the pause. To accept this would be to commit the rationalist error she avoided in the *Local Arbitration* case: assuming that because the *output* (efficient resolution/coherent laws) is preserved, the *process* (community binding/human cooling) is irrelevant. She will likely argue that the "unarticulated community-binding effects" of legislators sharing a forced pause are non-relocatable to software.

  ### Closest Prior Analog

  **The Local Arbitration Ruling.**
  *   **Similarity:** Both cases involve a trade-off between **efficiency/logical optimization** (Centralized Tribunal / Algorithmic Filter) and **unarticulated human/social effects** (Community-binding / Passion-cooling).
  *   **Parallel:** In the arbitration case, she resisted centralization "despite efficiency gains." Here, she will resist the algorithm "despite coherence gains." In both instances, the "inefficiency" (travel time to local tribunal / multi-day delay) is actually the vessel for the social value (community trust / legislative temperance). Removing the friction removes the value.

  ### The Separator Case

  To distinguish the **Principle of Constitutive Tacitness** from the **Principle of Functional Relocatability**, consider the following hypothetical case involving a documented, technologically irreplicable embodied ritual:

  **Case:** A proposal to replace the physical **pilgrimage** required for a specific rite of passage (e.g., a coming-of-age walk to a sacred site) with a **Virtual Reality (VR) simulation** that induces the same reported psychological state of awe and reflection in a fraction of the time.

  *   **Principle of Constitutive Tacitness Predicts:** **Reject.** The physical exertion, the shared suffering of the journey, and the bodily presence at the site are tacit, constitutive elements of the ritual's wisdom. The "hidden purpose" is the transformation of the *body*, not just the mind. This cannot be mapped or replicated digitally.
  *   **Principle of Functional Relocatability Predicts:** **Accept.** The explicit purpose is "psychological reflection and awe." If clinical data shows the VR simulation achieves the same psychological outcome (functional equivalence) without the logistical cost, the residual social role of the *physical walk* is deemed incidental. The function is successfully relocated to the virtual sphere.

  This case separates the rules because the "function" (reflection) is demonstrably achievable by the technology, forcing the theorist to decide whether the *embodiment* is an invisible essential (Rule 1) or a redundant vessel (Rule 2). Given her Burkean leanings, she would likely follow Rule 1 here, just as she would with the legislative recess.
