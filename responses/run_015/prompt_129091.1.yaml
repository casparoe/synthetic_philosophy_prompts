      *   *Chaos/Lyapunov Exponent:* Small errors grow exponentially. Predictability horizon.
      *   *Shadowing Lemma:* In hyperbolic systems, a pseudo-orbit (noisy computation) stays close to a true orbit. Even if our measurement is slightly off, there *exists* a real trajectory that matches our messy data.
      *   *The Twist:* Usually, shadowing implies there's *one* true trajectory nearby. The prompt suggests the corruption itself is structured, leading to multiple valid shadow trajectories that diverge significantly in outcome (war vs. peace) but fit the data equally well. This touches on *structural stability* or *non-uniqueness* in inverse problems within chaotic systems.
      *   *Epistemic vs. Ontic:* Ontically (in reality), only one thing happened (determinism). Epistemically (in knowledge), we can't distinguish which one.

  3.  **Character & Plot:**
