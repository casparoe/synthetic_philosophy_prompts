answer: |-
  Your proposed principle is a **reliabilist account of perceptual justification** masquerading as a definition of cognitive penetration. It conflates the *mechanism* of penetration (what changes the experience) with the *epistemic status* of the result (whether you can trust it).

  This conflation is why you are struggling with the asymmetries. Your principle says penetration *only* occurs when there is a "learned expectation about the distal cause." This is too narrow for your own intuitions (specifically Case 5) and too broad for others (Case 8).

  Here is the diagnosis of where your principle breaks, the repaired version, and the consequences for your verdicts.

  ### 1. Where the Principle Breaks

  **The Definition of "Cognitive" (Case 5 & 8)**
  Your principle requires a "learned expectation about the distal cause."
  *   **Case 5 (Acrophobia):** Fear is not an expectation about the *distal cause* of the visual input (light reflecting off a ledge). It is an evaluation of *affordance* or *threat*. If you stick to your principle, you must deny penetration in Case 5. But you are "inclined to allow" it. To keep Case 5, you must broaden "expectation" to include "affective predictive models."
  *   **Case 8 (Goggles):** This is sensorimotor recalibration, not cognition. It is sub-personal adaptation, not a "learned expectation" in the doxastic sense. Your principle struggles here because it wants to call it penetration (it alters experience) but admits it isn't "belief-shaped."

  **The Definition of "Penetration" vs. "Justification" (Case 3 & 7)**
  *   **Case 3 (Fake Dip):** You count this as penetration. Your principle agrees (it was a learned expectation), but denies justification (it was untrustworthy). This works.
  *   **Case 7 (Arrow-Fins):** You count this as *no* penetration. Your principle agrees (a one-off belief isn't a "learned expectation" or perceptual tuning).
  *   **The Tension:** Why does the lie in Case 3 penetrate, but the truth in Case 7 not? The answer is **Perceptual Learning vs. Propositional Override.** Case 3 involved training your auditory cortex to attend to a frequency. Case 7 involves holding a proposition that conflicts with the visual module. Your principle hints at this with "learned," but needs to be sharper to explain why some beliefs penetrate and others bounce off.

  ### 2. The Repaired Principle

  To accommodate your verdicts while maintaining philosophical rigor, we must separate the *condition for penetration* from the *condition for justification*.

  > **Revised Principle:**
  > 1.  **Penetration Condition:** A top-down influence penetrates perception when a high-level state (expertise, belief, desire, or affect) alters the **phenomenal character** of the experience by tuning the perceptual system's attention or predictive weighting, rather than merely altering post-perceptual judgment.
  > 2.  **Justification Condition:** The resulting experience provides epistemic justification for belief about the world only if the high-level state that caused the penetration is a **reliable indicator of the distal properties** of the object, rather than a reliable indicator of the subject's internal state (needs, fears, or biases).

  ### 3. Forced Abandonments and Repairs

  Here is how the revised principle forces you to adjust your specific verdicts and asymmetries.

  **The Asymmetry Between 1 (Radiologist) and 5 (Acrophobia)**
  *   **Your Intuition:** Both are penetration; 1 justifies, 5 does not.
  *   **Principle Verdict:** **Sustained.**
  *   **Repair:** You must abandon the idea that Case 5 involves an "expectation about the distal cause." Instead, you must classify fear as an **affective predictive model**. It penetrates (changes phenomenology) because the brain predicts danger. It fails justification because the prediction tracks the subject's amygdala state, not the actual depth of the drop. The asymmetry is preserved: Expertise tracks the world; Fear tracks the self.

  **The Asymmetry Between 3 (Fake Dip) and 7 (Arrow-Fins)**
  *   **Your Intuition:** 3 penetrates; 7 does not.
  *   **Principle Verdict:** **Sustained, but clarified.**
  *   **Repair:** You must be precise about *why* 3 penetrates. It is not because you *believed* the engineer; it is because your auditory system **retuned** to look for the dip. It became a "learned expectation" in the procedural sense. In Case 7, the belief is declarative. The visual module is encapsulated against declarative belief.
  *   **Abandonment:** You must abandon the notion that *any* belief can penetrate. Only beliefs that have been operationalized into perceptual priors (Case 3) penetrate. Mere knowledge (Case 7) does not.

  **Case 8 (Inverting Goggles)**
  *   **Your Intuition:** Counts as penetration, but feels like recalibration.
  *   **Principle Verdict:** **Abandon "Cognitive."**
  *   **Repair:** This is not *Cognitive* Penetration. It is **Sensorimotor Plasticity**. The "cognitive" in CPP implies mediation by concepts, beliefs, or affects. Goggle adaptation is sub-personal calibration of the vestibular-visual loop.
  *   **Verdict:** Count it as *Perceptual Plasticity*, but exclude it from the specific debate on *Cognitive* Penetration. It shows the question is broader than cognition, but for your specific inquiry, this is a distinct category.

  **Case 9 (McGurk Effect)**
  *   **Your Intuition:** Real effect, unsure if cognitive.
  *   **Principle Verdict:** **Not Penetration.**
  *   **Repair:** This is **Multisensory Integration**, not Top-Down Penetration. The auditory and visual streams are merging at a processing stage prior to conscious cognition. No belief or desire is driving this.
  *   **Verdict:** Do not count this as cognitive penetration. It is lateral, not vertical.

  ### 4. Verdicts on New Cases

  Applying the **Revised Principle**:

  **Case A: The Damning Email (Hostile Expression)**
  *   **Scenario:** You read an email saying a rival is malicious. You see their neutral face as hostile.
  *   **Penetration Condition:** Does the belief tune the perceptual system? Yes. You are attending to micro-expressions differently (furrowed brow looks deeper). Phenomenal character is altered. **Verdict: Penetration.**
  *   **Justification Condition:** Is the belief ("rival is malicious") a reliable indicator of the *distal cause* of the visual input (the muscle configuration of the face)? No. It is a bias coloring the interpretation. It tracks your internal narrative, not the facial geometry.
  *   **Final Verdict:** **Penetration without Justification.** (Like Case 5). You cannot use the "hostile look" as evidence they are hostile, because the look was generated by the belief that they are hostile. Circular.

  **Case B: The Placebo (Pain)**
  *   **Scenario:** Patient takes sugar pill, believes it is analgesic, reports pain hurts less.
  *   **Penetration Condition:** Does the expectation alter the phenomenal character? Yes. Nociceptive processing is down-regulated by top-down expectation. The *qualia* of pain are genuinely diminished. **Verdict: Penetration.**
  *   **Justification Condition:** Does the experience give reason to believe the *distal cause* (tissue damage) has improved? No. The expectation is not a trustworthy guide to tissue state; it is a guide to neurochemical modulation.
  *   **Final Verdict:** **Penetration without Justification (regarding injury).** The patient has justification for believing "I feel less pain," but no justification for believing "My leg is healed." If she infers the latter from the former, she is mistaken, because the penetration was driven by a state (placebo expectation) that does not track the distal physical cause.

  ### Summary of Required Shifts

  1.  **Stop defining penetration by justification.** You can have "bad" penetration (fear, bias) and "good" penetration (expertise). Your original principle tried to define penetration *as* good justification. Separate them.
  2.  **Broaden "Cognitive."** To keep Case 5, you must accept that affective states (fear) function like cognitive priors. To exclude Case 8, you must insist that "cognitive" implies conceptual or affective mediation, not just sensorimotor calibration.
  3.  **Distinguish Procedural vs. Declarative.** This solves the 3 vs. 7 asymmetry. Penetration requires the belief to become a *perceptual habit* (Case 3), not just a *held fact* (Case 7).

  Your intuitions are largely sound, but your principle was trying to do too much work at once. Split the mechanism from the epistemology, and the cases fall into line.
