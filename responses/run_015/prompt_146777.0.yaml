answer: |-
  During a free period, Elena sits in her history classroom and fixates on a wooden globe standing on the teacher's desk. She forms the immediate perceptual belief that the globe is physically present before her based solely on her visual experience. Aware of a persistent rumour that a prankster has been replacing classroom furniture with hyper-realistic plastic replicas to test student observation, she constructs a disjunctive argument: 'Either this globe is a genuine wooden object and my vision is functioning normally, or I am being systematically deceived by a facade of replicas surrounding me.' Since her visual experience confirms the presence of the globe, she concludes the first option holds, thereby establishing that she is not being systematically deceived about her surroundings.

  (i) **The Appearance of Easy Knowledge:** The reasoning appears to generate knowledge because the logical structure is valid and the premises seem intuitively secure; Elena possesses a clear visual experience of the globe, and the disjunction covers the relevant possibilities. Consequently, she arrives at a significant anti-sceptical conclusion—that her surroundings are not a systematic deception—without performing any independent check, such as touching the globe or consulting a colleague. This generates the 'easy knowledge' worry because she seems to have upgraded a basic perceptual belief into a guaranteed assurance of her environment's reality merely by articulating the logical alternatives, bypassing the rigorous evidence one would expect for ruling out deception.

  (ii) **The Bootstrapping Problem and Justification:** The core issue lies in how the initial perceptual belief is justified. A reliabilist defence would argue that if Elena's vision is in fact reliable, the process produces true beliefs, and she therefore knows the globe is real regardless of her awareness of that reliability; for the reliabilist, the circularity is benign provided the mechanism works. Conversely, an internalist objection highlights that Elena lacks independent access to the reliability of her vision; by using her vision to prove her vision is not deceived, she engages in bootstrapping. She assumes the very reliability she seeks to prove, meaning her justification for the perceptual belief depends on the falsity of the deception hypothesis, yet she uses that belief to prove the falsity of the hypothesis.

  (iii) **The Structural Feature:** The single structural feature doing the philosophical work is **phenomenal indistinguishability**. In this scenario, the deceptive alternative (the plastic replica) is stipulated to be visually identical to the veridical object (the wooden globe) from Elena's first-person perspective. Because the deceptive scenario is accessible only as a logical possibility and not as a distinct perceptual experience, Elena cannot use her visual evidence to discriminate between the real object and the fake; her visual evidence is compatible with both options, yet she treats it as decisive for only one.

  (iv) **Consequences of Removal:** If this feature is removed—meaning the replica is visually distinguishable from the real globe, perhaps by a slight sheen or lack of grain—the bootstrapping problem collapses. In that case, Elena's visual experience would provide independent evidence against the deception hypothesis (e.g., 'I see wood grain, but replicas are smooth plastic'), breaking the circular dependence. Her conclusion that she is not deceived would no longer be 'easy' knowledge derived from assuming reliability, but rather empirical knowledge derived from specific discriminatory details that rule out the alternative without presupposing the general trustworthiness of her senses.
