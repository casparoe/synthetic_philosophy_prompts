answer: |-
  # Q&A Preparation Sheet: Parfit's Hitchhiker & Rational Dispositions

  **Paper Core:** Hitchhiker does not prove rationality requires irrational dispositions. Distinction: Snapshot-visible vs. Profile-visible dispositions. Payoff tracks empirical detectability, not normative rationality.
  **Audience:** 30 (Mostly Econ/Behavioral, 3 Decision Theorists, 2 Action Theorists).
  **Constraint:** Most view "rationality" as payoff maximization; one views it as a screening problem.

  ---

  ## Part 1: The Eight Objections (Ordered by Damage)

  ### 1. The "Rationality = Winning" Objection (Behavioral Economists)
  **Idiom:** "You're engaging in semantic stipulation. In our field, if a strategy yields higher expected utility, it is *by definition* rational. If the disposition to pay gets you to town, it's the rational disposition. You're just reserving the word 'rational' for CDT-compliant local acts, which is a façon de parler, not a normative constraint."
  **Damage:** High. Undermines the normative/descriptive distinction your thesis relies on.
  **2-Minute Reply:** "I agree that if 'rational' just means 'payoff-maximizing,' the debate dissolves. But then the claim 'rationality requires irrationality' becomes a tautology: 'payoff-maximizing strategies require non-payoff-maximizing local acts.' My point is substantive: we shouldn't derive normative constraints on *agency* from empirical constraints on *predictability*. If the only reason you need a disposition is that a driver can't read your mind unless you have a history, that's a limitation on the driver, not a requirement of reason."
  **Soft Spot:** You rely on a normative notion of rationality half the room rejects.
  **Concession Strategy:** **Concede this early.** Acknowledge that in mechanism design, 'rational' often tracks 'equilibrium-compatible.' Clarify you are arguing about *normative force*, not terminology.

  ### 2. The "Screening Problem" Objection (The Mechanism Designer)
  **Idiom:** "This is a standard adverse selection/screening model. The driver is the principal, you're the agent. The driver offers a contract contingent on a signal (your type). You're dressing up a signaling game as a paradox about rationality. The 'solution' is just finding the incentive-compatible constraint."
  **Damage:** High. Makes the philosophical framing seem naive or redundant to the economists.
  **2-Minute Reply:** "You're right that formally it maps to a screening problem. But the philosophical puzzle arises because we feel the agent *ought* to pay once in town, even when the causal leverage is gone. Economists treat the 'ought' as derived from the ex-ante contract. I'm arguing the 'ought' persists even without the contract, based on the status of the intention. The screening model explains the *payoff*, but not the *normative tension* agents feel at the moment of payment."
  **Soft Spot:** You admit the formal mapping is correct, relying on "normative tension" which economists may dismiss as folk psychology.
  **Concession Strategy:** **Concede the formal mapping.** Don't fight the math. Fight the *interpretation* of the math.

  ### 3. The "One-Shot Case" Objection (Decision Theorists / Philosophers)
  **Idiom:** "Your solution relies on 'profile-visible' dispositions detectable over time. But Parfit's case is a one-off. There is no history. The driver must be reading a snapshot of your current intention. If so, you're back to square one: the rational act (not paying) contradicts the profitable disposition."
  **Damage:** High. Attacks the applicability of your distinction to the specific thought experiment.
  **2-Minute Reply:** "Even in a one-off, the driver predicts based on *character*, which is a profile property. We judge character in strangers instantly based on micro-expressions, tone, etc., which are proxies for long-term traits. If we stipulate the driver is a 'good judge of character,' they are tracking the profile, even if they only see one snapshot. If we stipulate they see the *act* itself before predicting, the case collapses. So the profile reading is the only stable interpretation of 'good judge of character'."
  **Soft Spot:** Relies on a specific interpretation of "judge of character" that might be contested as speculative.
  **Concession Strategy:** **Do not concede.** This is the core of your technical contribution. Defend the "character as profile" interpretation vigorously.

  ### 4. The "Causal Dominance" Objection (The CDT Theorist)
  **Idiom:** "Once you are in town, paying has no causal impact on being lifted. Not paying dominates paying. How can you call it rational to do a dominated act? You're smuggling in EDT (Evidential Decision Theory) under the guise of 'dispositions'."
  **Damage:** Medium. Standard CDT objection, but you expect it.
  **2-Minute Reply:** "I'm not arguing the *act* of paying is rational in isolation. I'm arguing the *disposition* is rational ex-ante. CDT agrees you should acquire the disposition if you can. The tension only arises if you think rationality is purely local. My claim is that rationality is diachronic. The 'irrationality' of the act is the price of the 'rationality' of the plan."
  **Soft Spot:** CDT theorists deny diachronic rationality binds local acts.
  **Concession Strategy:** **Concede** that on a strictly local, momentary CDT view, the act is irrational. Reiterate that your paper argues against that local view.

  ### 5. The "Commitment Device" Objection (Experimental Economists)
  **Idiom:** "You say if we add a commitment device, the rational agent chooses it. But the original case *excludes* commitment devices. By adding one, you've changed the game to solve the problem. That's not solving Parfit's puzzle; it's dissolving it."
  **Damage:** Medium. Challenges your variation of the case.
  **2-Minute Reply:** "I'm not solving the original case by changing it; I'm using the variation to show what's doing the work. If the payoff comes from the commitment, not the irrationality, then the original case's lesson isn't about irrationality. It's about the lack of commitment technology. The 'irrational disposition' is just a poor man's commitment device."
  **Soft Spot:** Parfit might insist the puzzle holds even without external devices.
  **Concession Strategy:** **Concede** that the original case assumes no external device. Argue that internal dispositions *are* internal devices.

  ### 6. The "Intention as Plan" Objection (Philosophers of Action)
  **Idiom:** "You treat intentions as observables for the driver. But intentions are elements of plans, not just behavioral predictors. If the agent plans to pay, they intend to pay. If they later don't, they didn't have that intention, they had a false belief. You're conflating intention with prediction."
  **Damage:** Low/Medium. Technical philosophical point.
  **2-Minute Reply:** "I agree intentions are plan-laden. But the driver predicts the *execution* of the plan. The puzzle is why a rational agent would form a plan they know they won't execute. My distinction shows they *can* execute it if the disposition is profile-visible, because the plan is stable over time, not just a snapshot impulse."
  **Soft Spot:** Risks getting bogged down in philosophy of mind semantics.
  **Concession Strategy:** **Concede** the distinction between intention and prediction is crucial. Use it to support your "profile" stability argument.

  ### 7. The "Ratification" Objection (Deliberation Theorist)
  **Idiom:** "Can the decision to pay ratify itself? If I know I'm the type who pays, do I still want to pay once in town? If not, the disposition isn't ratifiable. Unratifiable decisions aren't rational."
  **Damage:** Low. Niche decision theory.
  **2-Minute Reply:** "Ratification requires knowing your own type. If I know I'm the 'payer type,' paying confirms my self-conception. Not paying creates cognitive dissonance. The utility of maintaining a coherent self-conception can tip the balance to make paying ratifiable."
  **Soft Spot:** Speculative utility addition (self-conception).
  **Concession Strategy:** **Concede** this requires a specific utility function regarding self-conception.

  ### 8. The "Evidence vs. Causation" Objection (Formal Epistemologist)
  **Idiom:** "You say payoff tracks empirical detectability. But detectability is evidential. Rationality is causal. You're conflating the evidence the driver has with the causal structure of the agent's choice."
  **Damage:** Low. Technical.
  **2-Minute Reply:** "Exactly. That's my conclusion. The 'paradox' comes from treating an evidential link (driver's prediction) as a causal constraint on rationality. I'm disentangling them."
  **Soft Spot:** None, this aligns with your view.
  **Concession Strategy:** **No concession needed.** This is your ally.

  ---

  ## Part 2: Strategic Concessions

  **Concede in the First Two Minutes (Pre-emptive):**
  1.  **Terminology:** Acknowledge that for many economists, "rational" = "payoff maximizing." State clearly: "When I say 'rational,' I mean 'normatively justified by reasons,' not just 'equilibrium selecting.' If you hear 'rational' as 'profitable,' my claim becomes trivial, but I hope to show it's structural."
  2.  **Formal Equivalence:** Acknowledge that the Hitchhiker case is formally isomorphic to a screening/signaling game. "I am not disputing the math of the payoff matrix; I am disputing the philosophical moral we draw from it."

  **Concede in the Twentieth Minute (If Pressed):**
  1.  **Local Irrationality:** Admit that *at the exact moment of payment*, a CDT agent has no causal reason to pay. Do not try to prove the *act* is causally rational. Stick to the *disposition* being ex-ante rational.
  2.  **Driver's Power:** Admit that if the driver is *omniscient* (reads the snapshot perfectly), the profile distinction collapses. Your argument relies on the driver being a "good judge" (empirical), not a "god" (metaphysical).

  ---

  ## Part 3: The One Question You Hope Nobody Asks

  **The Question:**
  *"If the disposition is profile-visible, it relies on past behavior. But in the Hitchhiker case, the agent and driver have never met. There is no past. So, strictly speaking, a profile-visible disposition is impossible in this case. Doesn't this mean your solution only works for iterated games, leaving Parfit's one-shot puzzle unsolved?"*

  **Why it's dangerous:**
  It attacks the textual fidelity of your solution. If your distinction (Snapshot vs. Profile) doesn't apply to the *original* case, you haven't solved Parfit's puzzle; you've solved a *different* puzzle (an iterated one). This validates the "Screening Problem" objection that you've changed the game.

  **Defense Strategy (Do not hope it goes unnoticed; prepare for it):**
  1.  **Reframe "Profile":** Argue that "profile" does not mean *actual* history between *these two agents*, but the agent's *general* history of resolving similar dilemmas. The driver reads "character," which is a aggregate of past decisions in *other* contexts.
  2.  **The Counterfactual:** Argue that the driver predicts based on what the agent *would* do in a range of cases (the profile of the decision function), not just what they did in the past. A "profile-visible disposition" is visible via the *structure* of the agent's psychology, which a good judge can read in a snapshot (micro-expressions, tone) even without prior interaction.
  3.  **The Pivot:** If pressed, pivot to: "Even if the original case forces a snapshot reading, my argument shows that *any realistic application* of this logic involves profile visibility. Therefore, the normative lesson for real-world rationality remains: it's about detectability, not irrationality." (This sacrifices the textual exegesis of Parfit to save the normative conclusion).
