  1.  **Analyze the User and Request:**
      *   **User Status:** Philosophically literate (knows "eliminative materialism," "folk psychology," "phlogiston/caloric" analogies, "self-referential objection," "special sciences"). They just had a 2-hour debate and found themselves shifting towards eliminativism, which worries them.
