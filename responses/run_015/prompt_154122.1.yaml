answer: |-
  Your challenge presupposes that anchoring requires an external tether, but this conflates ontological independence with normative objectivity, thereby begging the question against the possibility of a sui generis normative ontology. To claim that internal anchoring collapses into free projection is to ignore the specific modal strength of framework-constitutive norms: whereas free projection allows the projector to revise the valuation at will without cognitive loss, framework-relative realism posits norms that bind the agent precisely because they are constitutive of the evaluative stance itself. The law-like dependence you require is satisfied not by correspondence to natural facts, but by the dependency of specific judgments on the invariant structural requirements of the framework itself; one cannot simply wish away the wrongness of torture within this framework without dismantling the very architecture that makes agency intelligible. Thus, the anchoring function is preserved through the internal necessity of the framework's logic, which exerts a constraint phenomenologically indistinguishable from external reality yet ontologically immanent, avoiding both the metaphysical extravagance of Platonic facts and the arbitrariness of mere expressive coherence.
