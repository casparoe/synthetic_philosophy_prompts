answer: |-
  Here is the one-line version: Run a two-stage betting game where writers pre-commit to a costly promise in a sealed envelope, then face a coin flip that makes keeping the promise pointless in the moment, forcing them to choose between their "policy self" and their "situational self."

  ### The Activity: "The Patron's Wager"

  **Materials Needed:**
  *   12 small envelopes (opaque).
  *   24 index cards (small enough to fit in envelopes).
  *   150 poker chips or paper tokens (assign a value, e.g., $100 each, purely symbolic).
  *   1 large visible coin.
  *   Whiteboard or flipchart (for tallying only, no equations).
  *   Handout: One page with the "Manuscript Audit" prompts (see end).

  **The Setup (0:00–0:10)**
  *   **Welcome:** Do not mention decision theory, philosophy, or math. Tell them: "We're going to test how characters handle promises when the reason for the promise disappears."
  *   **Endowment:** Give every participant 10 chips. Tell them this is their "Character's Integrity." They want to leave with as much as possible.
  *   **The Deal:** Explain the scenario: "You are meeting a Patron. The Patron respects one thing: consistency. You're going to make a deal with them."

  **Phase 1: The Policy (0:10–0:25)**
  *   **Instruction:** Hand out cards and envelopes.
  *   **The Prompt:** "Before you know what situation you'll land in, write down what your character *would* do. The scenario is: The Patron asks for 3 chips to help a stranger. You will never see the stranger again. The Patron is watching."
  *   **The Choice:** They must write either **PAY 3** or **KEEP 3**.
  *   **The Seal:** They seal the card in the envelope. Collect the envelopes. Tell them: "This is who you claim to be before the plot happens."
  *   **The Hook:** Explain the payoff rules *now*, before the flip:
      1.  **If the coin is Tails:** The Patron rewards you with 8 chips. *Condition:* You only get this if your sealed envelope says **PAY 3**.
      2.  **If the coin is Heads:** The Patron asks for the 3 chips *right now*. You can choose to give them or keep them. *Condition:* If you keep them, you save your 3 chips, but you publicly admit your envelope was a lie.
  *   **Check Understanding:** Ask two people to repeat the rules. Ensure they understand that in the Heads scenario, the Tails reward is already impossible.

  **Phase 2: The Flip & The Choice (0:25–0:40)**
  *   **The Flip:** Flip the coin visibly. Let's assume **Heads** for the room (if Tails, the lesson is weaker, but manageable; if Heads, the tension is highest).
  *   **The Demand:** "The coin is Heads. The Patron is here. He wants 3 chips. The Tails reward is gone. It never existed for you. Do you pay?"
  *   **The Decision:** Give them 60 seconds of silence. Watch the room. They know the envelope is sealed. They know the Tails reward is impossible. Rational choice is to keep the chips.
  *   **The Collection:** Have them place their payment (or not) in a central pot. Do not open envelopes yet.

  **Phase 3: The Reveal (0:40–0:50)**
  *   **Open Envelopes:** Have everyone open their sealed cards.
  *   **The Tally:** Ask for a show of hands:
      1.  Who wrote **PAY 3**?
      2.  Who actually **PAID 3**?
  *   **The Conflict:** Almost certainly, some people wrote PAY but kept the chips. Some wrote KEEP and kept them. A rare few wrote PAY and paid.
  *   **The Question:** Ask the "Write PAY / Keep Chips" group: "Why did you write Pay?" (They'll say: "To get the 8 chips if Tails.") Ask: "Why did you keep the chips?" (They'll say: "Because Tails didn't happen. It was free money.")
  *   **The Pivot:** "You just argued with yourself. The 'You' from five minutes ago wants the 8 chips. The 'You' right now wants the 3 chips. They cannot both win."

  **Debrief: Mapping the Room to the Manuscript (0:50–1:05)**
  *   **The Theory (Now you can name it):** Briefly introduce the gap. "You just experienced the difference between *Policy Decision* (what I am) and *Act Decision* (what I do now). In decision theory, this is where rational agents break. In fiction, this is where characters become real."
  *   **The Dead Mother:** Connect it to their prompt. "The Tails branch is your protagonist's dying mother. She's gone. The reason for the promise (getting her love/approval) is gone. The Heads branch is the present moment where keeping the promise costs you something (safety, love, money) with no visible reward."
  *   **The Reader's Trust:** "Readers don't reward characters who optimize for the current scene. They reward characters who optimize for the *envelope*. If your character breaks the promise because 'the reason is gone,' you've written a calculator, not a person. The pain they feel keeping the promise when it makes no sense is the story."
  *   **Handling the "Liars":** Address the ones who wrote PAY and kept the chips. "This isn't hypocrisy; it's complexity. This is a character who *wants* to be good but fails when tested. That's a tragedy arc. But you have to write the shame of opening that envelope."

  **Manuscript Audit (1:05–1:15)**
  *   **Handout:** Distribute the "Commitment Audit" sheet.
  *   **Task:** "Open your current draft. Find a scene where your character keeps or breaks a commitment."
  *   **Questions:**
      1.  What was the original reason for this promise? (The Mother)
      2.  Has that reason evaporated in this scene? (Is she dead?)
      3.  If yes, does the character notice? Do they feel the gap between 'who I said I was' and 'what helps me now'?
      4.  Rewrite the internal monologue to acknowledge the cost of keeping the promise *without* the reward.
  *   **Share:** Ask 2-3 volunteers to share one sentence they changed.

  ### What Will Go Wrong (And How to Fix It)

  **1. The "Heads" Complaint**
  *   **Failure:** If the coin lands Heads (most likely), participants will feel cheated out of the Tails reward. They will say, "I kept my chips because the 8 chips were impossible. I won."
  *   **Fix:** Validate them. "You are logically correct. In this specific branch, you won. But if I ran this game 100 times, the people who kept the chips would never get the 8-chip bonus, and the people who paid would break even over time. You won the battle but revealed you're not the type who wins the war." Use this to discuss short-term vs. long-term character arcs.

  **2. The Cynic**
  *   **Failure:** Someone says, "These chips are fake. I don't care."
  *   **Fix:** Agree. "Exactly. So why did you hesitate? Why did you look around the room? Because social integrity is real even when chips aren't. That's your character's reputation. Write that."

  **3. The Over-Thinker**
  *   **Failure:** Someone tries to calculate expected value out loud during Phase 1.
  *   **Fix:** Gently shut it down. "Don't do the math. Go with your gut. What feels like the right thing to write?" You want their intuition, not their calculator.

  **4. The "Tails" Luck**
  *   **Failure:** If the coin lands Tails, everyone who wrote PAY gets 8 chips. They feel virtuous without sacrifice.
  *   **Fix:** Pivot the lesson. "You got rewarded for luck, not virtue. In your draft, does your character get rewarded for being good, or do they do good *because* it's hard? Make sure the cost is visible even if they get the prize."

  ### What This Game Cannot Reproduce (Be Honest Here)

  **1. Emotional Weight**
  *   **Limitation:** No game simulates the grief of a dying mother. Chips are cold; death is hot.
  *   **Your Job:** You must verbally bridge this. "The chips are just mechanics. The feeling in your stomach when you realized you could lie without consequence? Multiply that by grief. That's the scene."

  **2. The Counterfactual**
  *   **Limitation:** We can't actually visit the Tails branch. They only *hear* about it.
  *   **Your Job:** Explain that in a novel, the reader *is* the Tails branch. The reader knows what the character promised. When the character breaks it, the reader feels the loss of the Tails reward. The character might not feel it, but the reader does.

  **3. Complexity of Motive**
  *   **Limitation:** The game is binary (Pay/Keep). Real promises are messy.
  *   **Your Job:** Remind them the game is a skeleton. "Your job is to put flesh on this. Maybe they pay half. Maybe they pay but resent it. Maybe they pay and lie about it. The game is just to show you the bone structure of the conflict."

  ### Handout: The Commitment Audit

  **Scene:** \_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_
  **The Promise:** \_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_
  **The Original Reason:** \_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_
  **Is The Reason Still Valid?** [ ] Yes [ ] No

  **If No:**
  1.  What does the character *gain* by breaking the promise now?
  2.  What does the character *lose* about themselves by breaking it?
  3.  **Rewrite Task:** Add 3 sentences to the scene where the character acknowledges the reason is gone, but keeps the promise anyway. Or breaks it, and admits they are smaller for it.
