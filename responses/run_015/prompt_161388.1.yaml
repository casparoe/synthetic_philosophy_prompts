answer: |-
  You have identified a genuinely distinct and ethically potent phenomenon. Your intuition is correct: standard categories like "paltering," "misleading implicature," or "bullshitting" fail to capture the specific mechanism you are describing because they do not account for the **exploitation of the speaker's established virtue** as the primary vector of the deception.

  In the cases you describe, the deception does not occur *despite* the speaker's truthfulness, but *because* of it. The hearer's inference is not a mistake; it is a rational calculation based on a correct heuristic about the speaker's character ("She only says what she can document"), which the speaker knowingly weaponizes.

  Here is an analysis of the nearest existing concepts, why they fall short, and a proposal for a term that fits the specific shape of this deception.

  ### 1. The Existing Literature and Why It Falls Short

  **A. Paltering (Rogers, Zeckhauser, Gino)**
  *   **The Concept:** "The active use of truthful statements to convey a false impression."
  *   **Why it fits:** Your cases are technically instances of paltering. The statements are true; the impression is false.
  *   **Why it fails:** The literature on paltering (e.g., *Artful Paltering*, 2016) typically treats it as a form of "spin" or active distraction. It focuses on the *selection* of facts. It does not adequately theorize the **reputational mechanism**. In standard paltering, the speaker might be a known spin-doctor. In your cases, the speaker is a known *truth-teller*. The deception works precisely because the hearer believes the speaker is *not* paltering. Paltering describes the *act*; it does not capture the *betrayal of the specific trust relationship* that makes your cases so "self-sealing."

  **B. Misleading Implicature (Grice; Saul)**
  *   **The Concept:** Saying something true that implies something false (e.g., "The gas tank is half full" when it has a hole in it). Jennifer Saul's work (*Lying, Misleading, and What is Said*, 2012) is the gold standard here. She argues that misleading can be morally worse than lying because it allows the speaker to deny commitment to the false belief.
  *   **Why it fits:** Saul correctly identifies that the "self-sealing" nature (plausible deniability) is a moral hazard.
  *   **Why it fails:** Standard Gricean implicature relies on the assumption of *cooperativeness*. In your cases, the speaker is exploiting a specific **character heuristic**. The hearer isn't just inferring from the words; they are inferring from the *speaker's history of precision*. Standard implicature theory treats the speaker as a generic rational agent; your cases require a model where the speaker's *moral reputation* is part of the semantic content.

  **C. Bullshitting (Frankfurt)**
  *   **The Concept:** Indifference to the truth.
  *   **Why it fails:** You explicitly noted the speaker tracks truth "fastidiously." This is the opposite of bullshit. The speaker cares deeply about the truth-value of their statement, precisely so it can serve as a shield.

  ### 2. The Missing Concept: Exploitation of Epistemic Trust

  The gap in the literature is a term for deception that functions by **leveraging a correct positive generalization about the speaker's integrity.**

  In ordinary lying, the speaker asks the hearer to trust their *word*.
  In ordinary misleading, the speaker asks the hearer to trust their *implication*.
  In your cases, the speaker asks the hearer to trust their *character*, and then uses that trust to bypass the hearer's critical faculties.

  Because there is no established single word for this, I propose the term **Veridical Entrapment**.

  #### Definition: Veridical Entrapment
  **Veridical Entrapment** occurs when a speaker, knowing that a hearer relies on a correct heuristic regarding the speaker's truthfulness or precision, selects a literally true statement specifically to induce a false belief that the hearer would not have formed without that heuristic.

  **Key Conditions:**
  1.  **Veracity:** The statement made is objectively true and sincerely believed.
  2.  **Reputational Leverage:** The speaker knows the hearer holds a correct belief about the speaker's habits (e.g., "She never speaks without proof," "He is always blunt").
  3.  **Foreseen Inference:** The speaker chooses the statement *because* they foresee the hearer will use that reputational heuristic to infer a falsehood.
  4.  **Immunization:** The truth of the statement and the correctness of the heuristic protect the speaker from retrospective correction (the "self-sealing" feature).

  ### 3. Boundary Cases: Distinguishing from Neighbors

  To ensure this concept is useful for your trainees, here is how *Veridical Entrapment* differs from the concepts you already know:

  | Feature | **Paltering** | **Withholding / Omission** | **Plausible Deniability** | **Veridical Entrapment** |
  | :--- | :--- | :--- | :--- | :--- |
  | **Truth Value** | True statements. | Silence on key facts. | Ambiguous/True statements. | True statements. |
  | **Mechanism** | Distraction/Selection. | Hiding information. | Ambiguity/Vagueness. | **Reputational Leverage.** |
  | **Hearer's Role** | Hearer is misled by focus. | Hearer lacks data. | Hearer guesses meaning. | **Hearer applies a correct virtue-heuristic.** |
  | **Speaker's Virtue** | Often irrelevant or negative. | Often negative (secretive). | Often negative (evasive). | **Essential (must be perceived as virtuous).** |
  | **Correction** | Can be fact-checked. | Can be filled by new info. | Can be clarified. | **Fact-checking confirms the deception.** |

  **Example Distinction:**
  *   *Paltering:* A salesman says, "This car has a new engine" (true) to hide that the transmission is shot. (Relies on focus).
  *   *Veridical Entrapment:* A partner known for "bad news first" says, "The client signed the letter" (true) to imply the meeting went well, knowing the trainee knows the partner would have mentioned problems if they existed. (Relies on the partner's reputation).

  ### 4. Why Standard Ethical Defenses Fail Here

  You noted that the standard arguments for treating misleading as lesser than lying come apart in these cases. *Veridical Entrapment* explains why.

  **1. "It leaves the hearer a route to the truth."**
  *   *Standard Defense:* The hearer can ask follow-up questions or check the facts.
  *   *Failure in Entrapment:* Checking the facts confirms the statement. The "route to truth" is blocked because the statement *is* true. The error is not in the data, but in the interpretive framework, which the speaker has rigged.

  **2. "It respects the hearer's agency."**
  *   *Standard Defense:* The hearer draws the inference themselves; they are a party to the conclusion.
  *   *Failure in Entrapment:* The hearer's agency is hijacked. They are using a rational tool (trust in a truthful colleague) that has been weaponized. It is akin to hacking a security system using the correct password; the system (the hearer's reasoning) worked as designed, but was exploited.

  **3. "It leaves the speaker's relation to the truth intact."**
  *   *Standard Defense:* The speaker can maintain their integrity because they didn't lie.
  *   *Failure in Entrapment:* The speaker corrupts the **social function of truth-telling**. By making their truthfulness a tool for deception, they degrade the value of their own future testimony. This is why it feels "worse" than lying: a liar burns a bridge; a veridical entrapper poisons the well everyone drinks from.

  ### 5. Recommendation for Teaching

  Since you are teaching professional ethics, **Veridical Entrapment** is a powerful pedagogical tool because it targets the "safe harbor" trainees often seek. Many trainees think, "As long as I don't lie, I am safe."

  You can frame it this way:
  > "In this firm, your reputation for truthfulness is an asset. **Veridical Entrapment** is the unauthorized use of that asset. When you use your history of honesty to sell a half-truth, you are not just misleading a client; you are debasing the currency of your own professional word. A lie can be retracted; entrainment leaves the record clean but the trust broken."

  This gives you a label that validates your observation, distinguishes it from mere "spin," and provides a robust ethical hook for why this behavior is incompatible with the role of a solicitor.
