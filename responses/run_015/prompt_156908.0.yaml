answer: |-
  **ROUGH NOTES & DRAFTING PLAN**

  *   **Objective:** Produce a joint statement that isolates substantive disagreement from verbal confusion without dissolving the conflict into mush.
  *   **Tone:** Technical, precise, adversarial but cooperative. No hedging.
  *   **Section 1 (Agreements):** Focus on *mechanics*, not norms.
      *   *Secrecy Function:* Credibility inversely proportional to (actors × duration). Both accept this math.
      *   *Contamination:* Information environments are noisy. False positives and false negatives are both elevated by active deception.
      *   *Formal Properties:* "Self-sealing" is a structural feature, not unique to fringe theories. Official narratives can exhibit it (e.g., "no evidence of wrongdoing" treated as evidence of cover-up).
  *   **Section 2 (Disagreements):** Focus on *priors* and *classification*.
      *   *Generalist:* The label "conspiracy theory" signals a structural defect that warrants a negative prior probability shift, independent of specific evidence.
      *   *Particularist:* The label is sociologically loaded but epistemically neutral. Priors must be derived from specific content, not class membership.
      *   *Avoid:* "Generalists think they are all false" (False). "Particularists think we should ignore structure" (False).
  *   **Section 3 (Cruxes):** Need clear predictions.
      *   *Vindication Audit:* Look at historical true conspiracies (e.g., Iran-Contra, Tuskegee).
          *   *Gen:* They would have triggered the heuristic then. Heuristic is still valid for error management.
          *   *Part:* They would have triggered the heuristic. Heuristic is biased against truth.
      *   *Bounty Institution:* Change the cost of leaking.
          *   *Gen:* Distrust remains (structure is the problem).
          *   *Part:* Distrust drops (environment was the problem).
      *   *Decomposition:* Whole story vs. minimal claim.
          *   *Gen:* Assess the composite (often bloated).
          *   *Part:* Assess the minimal coordination claim.
      *   *Leakiness:* Institutional accountability.
          *   *Gen:* Open institutions confer default warrant.
          *   *Part:* That is status quo bias; institutions lie systematically.
  *   **Section 4 (Verbal/Substantive):**
      *   *Verbal:* Use of the phrase "conspiracy theory" (pejorative vs. descriptive). Definition of "official."
      *   *Substantive:* Default priors. Whether institutional structure confers epistemic weight.

  ***

  **JOINT STATEMENT ON THE EPISTEMOLOGY OF CONSPIRACY ACCOUNTS**

  **1. Agreed Mechanical Claims**
  We agree on the following structural constraints governing the evaluation of claims alleging covert coordination among powerful agents:

  1.  **The Secrecy Function:** The credibility of any claim requiring sustained secrecy is inversely proportional to the number of agents required to maintain silence and the duration of that silence. This is not a absolute veto but a probabilistic cost function; claims requiring hundreds of silent actors over decades incur a heavy evidentiary burden regardless of content.
  2.  **Environmental Contamination:** The information environment surrounding high-stakes public events is actively contaminated by interested parties planting both confirming and disconfirming material. Consequently, a rational evaluator's error rates are pushed up in both directions simultaneously; skepticism toward the "official account" and skepticism toward the "challenge account" are both epistemically required.
  3.  **Formal Self-Sealing:** The property of being "self-sealing" (where contrary evidence is reinterpreted as evidence of the plot's depth) is a formal structural feature detachable from specific content. While characteristic of many fringe accounts, official narratives can also exhibit this structure (e.g., interpreting a lack of evidence as proof of successful sanitization). Possession of this structure is a defeasible warning sign, not a proof of falsity.

  **2. Table of Residual Disagreements**
  The following table isolates the substantive divergence remaining after accepting the mechanical claims above.

  | Issue | Generalist Position | Particularist Position |
  | :--- | :--- | :--- |
  | **Class Priors** | The class "conspiracy theory" carries a distinctive epistemic defect. Membership in this class warrants a negative prior probability shift independent of specific evidence, due to the characteristic structural features listed above. | The class "conspiracy theory" carries no distinctive epistemic defect. Priors must be assigned based on specific content and context; class membership is sociologically significant but epistemically neutral. |
  | **Burden of Proof** | The burden of proof shifts asymmetrically against accounts defined by their opposition to an institutional consensus, because institutional consensus reflects aggregated epistemic labor. | The burden of proof remains symmetric. Treating institutional consensus as a default warrant is deference to the status quo, not an epistemic justification. |
  | **Label Function** | The pejorative usage of "conspiracy theory" tracks a real cluster of unreliable reasoning styles. Retaining the term as a warning label is epistemically useful. | The pejorative usage is a sociological accident used to dismiss inconvenient truths. Retaining the term obscures the specific empirical claims being made. |

  **3. Empirical Cruxes**
  We identify four scenarios where empirical findings would force revision of at least one position.

  *   **The Vindication Audit:** A retrospective analysis of conspiracy accounts now accepted as true (e.g., Tuskegee, Iran-Contra) using only evidence available *at the time*.
      *   *Generalist Prediction:* Most would have triggered the Generalist heuristic (high secrecy cost, self-sealing elements). We maintain this is the acceptable cost of a blunt heuristic that minimizes overall error rates.
      *   *Particularist Prediction:* Most would have triggered the heuristic and been dismissed. This demonstrates the heuristic is biased against truth and should be discarded.
      *   *Acceptance Condition:* If >80% of vindicated theories would have failed the Generalist test at the time, the Particularist claims the Generalist framework is systematically unreliable. The Generalist accepts this result only if the heuristic still proves superior in total error reduction across all cases (true and false).

  *   **The Bounty Institution:** A hypothetical regime where insiders receive legal protection and payment for anonymous leaks, and all documents auto-declassify after 20 years.
      *   *Generalist Prediction:* Distrust of conspiracy accounts remains high. The defect lies in the *structure* of the theories (inflation, self-sealing), not merely the secrecy environment.
      *   *Particularist Prediction:* Distrust drops significantly. The defect lies in the *information environment* (barriers to verification). Remove the barriers, and the class distinction vanishes.
      *   *Acceptance Condition:* If distrust remains unchanged in this regime, the Particularist accepts that the defect is internal to the reasoning style. If distrust vanishes, the Generalist accepts that the defect was environmental, not structural.

  *   **The Decomposition Question:** Whether to assess the full composite narrative or the minimal mechanism claim ("Coordination X occurred").
      *   *Generalist Prediction:* We must assess the composite. Conspiracy theories typically inflate; assessing only the minimal claim grants undue credit to bloated narratives.
      *   *Particularist Prediction:* We must assess the minimal claim. Rejecting the bloated narrative should not entail rejecting the core coordination claim.
      *   *Acceptance Condition:* If minimal claims are frequently true while composites are false, the Particularist argues the Generalist is guilty of "holistic dismissal." The Generalist argues that the bloated composite is the actual belief held by proponents.

  *   **Leakiness and Default Warrant:** Whether an institution's internal accountability (press, courts, rival factions) grants its account a default boost.
      *   *Generalist Prediction:* Yes. Accounts surviving rigorous internal competition possess higher reliability than accounts positing total coordination across all factions.
      *   *Particularist Prediction:* No. This assumes institutions are not captured. If capture is possible, "leakiness" is managed, and the default boost is unjustified status quo bias.
      *   *Acceptance Condition:* Empirical study of capture rates. If total capture is historically rare, Generalist view holds. If total capture is common, Particularist view holds.

  **4. Verdict on Verbal vs. Substantive Disputes**
  A significant portion of this debate is verbal, masking a smaller substantive core.

  *   **Verbal:** The dispute over whether the phrase "conspiracy theory" is a neutral description or an insult is purely sociological. Neither side denies the term is used pejoratively; the disagreement is whether that usage *tracks* an epistemic flaw. Similarly, the definition of "official story" is often verbal. If "official" means "produced by state agencies," the Particularist rejects the weight given to it. If "official" means "the account surviving maximal internal adversarial scrutiny," the Generalist insists it warrants weight. These are definitional stipulations.
  *   **Substantive:** The core substantive disagreement concerns **default priors**. The Generalist asserts that the structural features common to this class justify a negative prior probability shift *before* examining specific evidence. The Particularist asserts that priors must be derived entirely from specific evidence and context, with no class-based discount. This is not verbal; it is a disagreement about the reliability of heuristic reasoning in social epistemology. Additionally, the dispute over **institutional warrant** is substantive: does the existence of internal checks (courts, press) confer actual epistemic reliability, or is it a facade that rational agents should not trust by default? Resolving the verbal disputes will not settle these claims; they require the empirical adjudication outlined in the Cruxes.
