answer: |-
  # ASSERTION AUDIT PROTOCOL (AAP-2024)
  **Purpose:** To determine the assertibility of empirical claims in policy briefs based on norms of knowledge, truth, and belief without accessing authorial mental states or ground-truth databases.
  **Execution Time:** < 15 Minutes.
  **Referee Authority:** Mandatory sign-off required at steps marked [JUDGMENT].

  ---

  ## PART I: THE EIGHT-STEP PROCEDURAL CHECKLIST

  **Step 1: Evidence Availability Check**
  *   **Test:** Does the brief cite public data, text, or observable records supporting the central claim?
  *   **Input:** Reference list, footnotes, data appendices.
  *   **Branch:** If **No**, output: *Not assertible—recommend withholding publication until further evidence is available.* Stop. If **Yes**, proceed to Step 2.

  **Step 2: Methodological Threshold [JUDGMENT]**
  *   **Test:** Does the supporting evidence meet minimum disciplinary standards for reliability (e.g., sample size, registration, peer-review status, archival verification)?
  *   **Input:** Methods section, study registration numbers, publication venue.
  *   **Branch:** If **Fail**, proceed to Step 6 (High Risk). If **Pass**, proceed to Step 3.
  *   **Referee Sign-off:** Referee must certify whether the deviation from standard methodology is acceptable for a "rapid-response" context.

  **Step 3: Consensus and Dispute Status [JUDGMENT]**
  *   **Test:** Is there active, published disagreement among recognized experts regarding the key parameters, data interpretation, or historical record relevant to the claim?
  *   **Input:** Citation of competing studies, author acknowledgment of counter-views.
  *   **Branch:** If **Dispute Confirmed**, proceed to Step 5. If **No Dispute**, proceed to Step 4.
  *   **Referee Sign-off:** Referee must determine if the dissenting view is fringe or substantive.

  **Step 4: Inference Distance**
  *   **Test:** Is the claim a direct report of observation/data, or does it require modeling/extrapolation to reach the conclusion?
  *   **Input:** Logic flow of the argument.
  *   **Branch:** If **Direct**, proceed to Step 7. If **Model/Extrapolation**, proceed to Step 5.

  **Step 5: Textual Hedging Analysis**
  *   **Test:** Does the brief explicitly acknowledge the uncertainty, dispute, or modeling parameters identified in Steps 2, 3, or 4?
  *   **Input:** Qualifiers in the text (e.g., "suggests," "models indicate," "probable").
  *   **Branch:** If **Adequate Hedging**, proceed to Step 7. If **No Hedging**, proceed to Step 6.

  **Step 6: Harm Potential Assessment [JUDGMENT]**
  *   **Test:** If the claim is false, what is the magnitude of policy error or public harm?
  *   **Input:** Nature of the policy recommendation (e.g., health intervention vs. historical classification).
  *   **Branch:** If **High Harm**, output: *Not assertible—recommend revision to a weaker claim.* If **Low Harm**, output: *Assertible only in conditional or hedged form.*
  *   **Referee Sign-off:** Referee must categorize the risk level (Low/Medium/High).

  **Step 7: Assertion Classification**
  *   **Test:** Apply the following logic tree to determine final status:
      *   If Steps 2, 3, 4 Passed + Step 5 Hedged + Step 6 Low Harm → **Assertible without qualification.**
      *   If Step 3 Dispute OR Step 4 Model + Step 5 Hedged → **Assertible only in conditional or hedged form.**
      *   If Step 2 Fail + Step 6 Low Harm → **Not assertible—recommend revision to a weaker claim.**
      *   If Step 2 Fail + Step 6 High Harm → **Not assertible—recommend withholding publication until further evidence is available.**

  **Step 8: Downstream Liability Protocol**
  *   **Test:** Define the obligation for correction should the claim be contradicted.
  *   **Input:** Specific evidence type that would falsify the claim.
  *   **Output:** A binding statement attached to the brief containing:
      1.  **Trigger Condition:** (e.g., "Publication of a registered replication study with N>100 showing null effect").
      2.  **Responsible Party:** (e.g., "Corresponding Author" or "Journal Editorial Board").
      3.  **Form of Correction:** (e.g., "Editorial Note," "Expression of Concern," or "Retraction").

  ---

  ## PART II: APPLICATION TO HYPOTHETICAL BRIEFS

  ### Brief 1: Dietary Supplement Pilot (N=40, Unregistered)
  **Step-by-Step Output:**
  1.  **Evidence:** Yes (Pilot study data).
  2.  **Methodological Threshold:** **Fail** (N=40, no registration). [JUDGMENT: Referee deems sample too small for causal claim].
  3.  **Consensus:** N/A (Proceed to Step 6 due to Step 2 Fail).
  4.  **Inference:** Extrapolation (Pilot to general population).
  5.  **Hedging:** None (Claim states "improves memory").
  6.  **Harm Potential:** **High** (Public health advice). [JUDGMENT: Referee categorizes health advice as high risk].
  7.  **Classification:** *Not assertible—recommend revision to a weaker claim.* (Specific revision: "Pilot data suggests potential...")
  8.  **Liability:** Trigger = Registered replication null result; Party = Author; Form = Editorial Note.

  **Unavoidable Judgment Call:** **Step 2.** The referee must decide if N=40 is insufficient for a "rapid-response" context.
  **Mechanical Misfire Risk:** A mechanical application might reject all pilot data, potentially suppressing early warnings of effective interventions during a crisis.
  **Specific Misfire:** If the supplement is the only available intervention during a shortage, rejecting the claim prevents policymakers from considering even weak evidence.

  ### Brief 2: Climate Ocean-Feedback Loop (Disputed Parameter)
  **Step-by-Step Output:**
  1.  **Evidence:** Yes (Model output).
  2.  **Methodological Threshold:** Pass (Standard modeling technique).
  3.  **Consensus:** **Dispute Confirmed** (Three groups dispute parameter). [JUDGMENT: Referee confirms dissenting groups are credible].
  4.  **Inference:** Model/Extrapolation.
  5.  **Hedging:** Yes (Brief acknowledges parameter uncertainty).
  6.  **Harm Potential:** High (Long-term infrastructure planning).
  7.  **Classification:** *Assertible only in conditional or hedged form.* (Specific condition: "If parameter X holds...")
  8.  **Liability:** Trigger = Consensus shift on parameter value >10%; Party = Journal Editorial Board; Form = Expression of Concern.

  **Unavoidable Judgment Call:** **Step 3.** The referee must determine if the opposing modeling groups constitute a "substantive" dispute or a "fringe" objection.
  **Mechanical Misfire Risk:** A mechanical application might treat all disputes equally, forcing hedging on well-established claims where minority dissent is negligible.
  **Specific Misfire:** If the three dissenting groups are funded by interests opposed to climate action, mechanical hedging lends undue credibility to biased outliers.

  ### Brief 3: Indigenous Burial Practice (Oral History vs. Archaeology)
  **Step-by-Step Output:**
  1.  **Evidence:** Yes (Oral history + ambiguous archaeology).
  2.  **Methodological Threshold:** Pass (Within interdisciplinary norms for oral history).
  3.  **Consensus:** **Dispute Confirmed** (Competing archaeological interpretation). [JUDGMENT: Referee weighs oral history as valid evidence type].
  4.  **Inference:** Interpretation.
  5.  **Hedging:** No (Author claims "was widespread" based on belief).
  6.  **Harm Potential:** Medium (Cultural policy/repatriation).
  7.  **Classification:** *Not assertible—recommend revision to a weaker claim.* (Specific revision: "Oral histories indicate...")
  8.  **Liability:** Trigger = Discovery of contradictory material record; Party = Author; Form = Correction.

  **Unavoidable Judgment Call:** **Step 3.** The referee must decide the epistemic weight of oral history relative to material archaeology.
  **Mechanical Misfire Risk:** A mechanical application privileging material records over oral tradition would systematically silence indigenous knowledge systems.
  **Specific Misfire:** If the procedure defaults to "archaeological record is ambiguous = claim false," it enforces a colonial epistemology that the journal aims to avoid.

  ---

  ## PART III: PROCEDURAL LIMITATIONS

  **1. Normative Resolution:** This procedure cannot resolve the underlying philosophical disagreement between the Knowledge Norm (assert only what you know) and the Belief Norm (assert what you sincerely believe). It manages the tension procedurally via hedging requirements but does not adjudicate which norm is superior.

  **2. Policymaker Compliance:** The audit guarantees the *presence* of qualifications and liability protocols in the text. It cannot guarantee that policymakers will read, attend to, or act upon those qualifications. The "Downstream Liability" is binding on the publisher/author, not the policy consumer.

  **3. Ground Truth Access:** The procedure operates entirely on public records and textual analysis. It cannot verify the actual truth of the claim, only its *assertibility* given current public justification. A claim may be "Assertible without qualification" under this audit and still be false.

  **4. Mechanical Rigidity:** As demonstrated in the application section, Steps 2 and 3 require human judgment to avoid epistemic injustice or suppression of novel science. If applied purely mechanically (e.g., "No peer review = Automatic Reject"), the procedure will generate false negatives in emerging fields.
