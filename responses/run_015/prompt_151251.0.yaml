  I'm a journalist who writes about science and ideas, and I somehow got roped into serving on a grant-review board for cross-national sociology — way outside my usual lane. The PI is using the gender-equality paradox (the Nordic pattern where stronger egalitarian norms go together with more gendered career choices) to push something they call "preference essentialism." I think their arguement proves way too much, but I'm stuck on exactly which link breaks. Here's the chain:

  (1) In societies that minimize structural barriers and maximize welfare-state support, occupational choice is freed from economic coercion.
  (2) When barriers are minimized, large gender gaps in fields like STEM or nursing can't be adaptive responses to constraint; they must reflect stable, intrinsic preference distributions.
  (3) Therefore in egalitarian countries, observed segregation reveals authentic gendered preferences.
  (4) An authentic preference — formed without coercion and with full information — carries normative weight: respecting autonomy means accommodating it, not engineering it away.
  (5) So egalitarian societies that fund gender-balance interventions treat authentic preferences as errors, violating the autonomy those societies claim to protect.
  (6) By the same reasoning, any cluster that survives barrier removal (by race, class, region) must also be authentic and left untouched.
  (7) Thus egalitarian justice collapses into a defense of every post-barrier status quo, including extreme segregation.

  They claim this undermines justice-based arguments for equality of outcome. I feel like (4) smuggles in a normative leap from "not coerced" to "must be left alone," and maybe (2) assumes preference stability across welfare architectures, but I can't tell if that's a hidden equivocation or just an empirical bet I'm wrong about. Which step should I reject, and what does giving it up cost? I'm also least sure about whether adaptive-preference theory even applies to occupational sorting once parental-leave structures change the payoff landscape.

  Please say how confident you are in what you claim and single out the point you're least sure about. At the very end, put your bottom line in this exact box:

  \answer{[step number]-[short label]}
