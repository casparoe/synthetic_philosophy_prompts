answer: |-
  Here is your prep sheet. I have ordered these by the likelihood of derailing your project, starting with the metaphysical kill-shot and ending with the logical trap you're already worried about.

  ### Strategic Concessions (First 5 Minutes)
  **Do this before they ask.** You need to inoculate the room against the charge that you are confused about identity.
  1.  **Concede Indeterminacy:** Explicitly state: "I am not offering a new criterion of *numerical identity*. I am granting that in some boundary cases, 'Is it the same person?' has no determinate truth value." This takes the wind out of the Animalist's sails (you aren't denying biology) and the Parfitian's (you aren't positing a further fact).
  2.  **Concede Vagueness:** Admit that "selection classes" have fuzzy boundaries. If you pretend the lines are sharp, the Decision Theorist will eat you alive on Sorites grounds.
  3.  **Concede Non-Transitivity (Pre-emptively):** Hint that c-candidacy might not be an equivalence relation. If you claim it is, you are lying, and they will know. Better to frame it as a *sufficiency relation for moral concern* rather than a logical identity.

  ### The One Reply That Must Land
  **"Normative significance does not require transitivity."**
  Your entire project collapses if the audience insists that *only* strict identity can ground "better for" claims. You must convince the Population Ethicists and the EA student that *c-candidacy* is the relevant relation for beneficence in selection cases, even if it fails the logical tests of identity. If you can get them to agree that "better for" tracks *selection alternatives* rather than *numerical identity*, you survive. If they insist "better for" requires strict identity, you lose the room.

  ---

  ### The 8 Objections (Ordered by Damage)

  #### 1. The Animalist (Kripkean Essentialist)
  **The Objection:** "You're treating the organism like a role that gets filled. But *you* are this specific human organism. This organism began at the fusion of *this* sperm and *this* egg. If you change the gametes, you change the organism. If you change the organism, you change the animal. If you change the animal, you change the person. You can't just stipulate a 'causal-historical slot' and pretend the biology doesn't dictate the identity. You're confusing *type* with *token*."
  **The Answer:** "I agree I am this organism. But the 'origin' of an organism isn't a single micro-second event; it's a process. Consider the timing argument: if conception happens 12 hours later, the sperm is numerically different, and likely the egg is in a different state. Do we really think a 12-hour delay creates a different human being? Intuitively, no. The 'slot' is the stable biological trajectory, not the specific molecular ingredients. I'm not saying the biology doesn't matter; I'm saying the *identity-fixing* biology is coarser-grained than the gamete level."
  **Soft Spot:** The Animalist will press: "At what *exact* hour does the identity shift?" You have to admit vagueness here, which they hate.

  #### 2. The Decision Theorist
  **The Objection:** "I need to model this. If I'm choosing between Embryo A and Embryo B, those are my actions. What are the *states* of the world? If 'c-candidate' isn't an equivalence relation, you can't partition the possibility space. If A is a c-candidate of B, and B of C, but A is not of C, how do I assign utilities? Are we maximizing expected utility over persons or over slots? Your ontology doesn't map to a decision matrix."
  **The Answer:** "Don't partition by *person*; partition by *selection node*. The sample space isn't 'Possible People,' it's 'Possible Outcomes of this Gamete Selection.' The utility isn't attached to a trans-world ID tag; it's attached to the life trajectory resulting from this node. You don't need transitivity to calculate the expected value of the choice *here*. You only need to know that A and B are alternatives *at this node*."
  **Soft Spot:** They will argue that without transitive identity, you can't compare utilities across outcomes coherently. You need to hold firm that the comparison is *de re* relative to the choice, not absolute.

  #### 3. Population Ethicist #1 (Person-Affecting View)
  **The Objection:** "You say this rescues the person-affecting view on non-identity. But if the child from Embryo A is not *identical* to the child from Embryo B, how is choosing A *better for* the child from A? They wouldn't exist otherwise. You're just redefining 'better for' to mean 'selected from the same class.' That's verbal trickery. The Non-Identity Problem remains because the subject of the benefit doesn't exist in the alternative world."
  **The Answer:** "It's not trickery; it's recognizing that 'better for' is context-sensitive. In selection contexts, the relevant subject isn't the rigid designator 'Person X,' it's 'The occupant of this causal slot.' If I choose A, the occupant has a good life. If I choose B, the occupant has a miserable life. It is better for the *slot-occupant* that I chose A. This preserves the intuition that we can harm/benefit in selection cases without invoking the Impersonal Total View."
  **Soft Spot:** Hardline person-affecting views demand strict identity. You are asking them to soften their definition of "person."

  #### 4. The Parfitian Reductionist
  **The Objection:** "This is all elaborate machinery to avoid the obvious conclusion. You admit identity is indeterminate. You admit what matters is the causal-historical continuity and the quality of life. So why posit 'c-candidacy' at all? Just say 'Identity doesn't matter, what matters is Relation R.' You're trying to save 'person-affecting' intuitions by building a metaphysical life-raft, when you should just let them drown and swim with Reductionism."
  **The Answer:** "Because the 'empty question' view is practically paralyzing in bioethics. If parents ask, 'Are we helping this child?', saying 'The question is empty' is morally unhelpful. C-candidacy captures *why* the question feels non-empty. It validates the normative practice without positing a mystical further fact. I'm giving you the metaphysics that matches the moral phenomenology, which Reductionism dismisses."
  **Soft Spot:** They will say moral phenomenology is unreliable. You have to stand on the practical necessity of the distinction for bioethics.

  #### 5. The Twinning Case (Metaphysician #2)
  **The Objection:** "You lean on monozygotic twinning. Before the split, there's one organism. After, there are two. You say the pre-split thing is a c-candidate to both. But if I am one of the twins, was I the pre-split organism? If yes, then I am identical to my twin (since they were too). If no, then what was the pre-split thing? Your 'c-candidacy' dissolves into fission, and fission destroys identity."
  **The Answer:** "Exactly. Fission shows identity isn't what matters. The pre-split organism stands in the c-candidate relation to *both* twins. This explains why we feel a special connection to our twin without claiming we are the same person. It handles the 'one becomes two' transition without contradiction because c-candidacy is one-to-many, unlike identity."
  **Soft Spot:** This admits that c-candidacy is fundamentally different from identity. Make sure you don't slide back into calling it "loose identity."

  #### 6. Population Ethicist #2 (Total View Proponent)
  **The Objection:** "Even if your view works, it doesn't solve the big problems. What about cases where we choose between creating a happy child or a happier child from a *different* selection class (e.g., different parents)? Your view collapses back into standard non-identity. You've only solved a narrow slice of embryo selection, not the general problem."
  **The Answer:** "I'm not claiming to solve the Total View vs. Person-Affecting debate globally. I'm solving the *selection* problem where the intuition of 'same child' is strongest. That's where the Person-Affecting View is most vulnerable. Securing this ground lets us hold the line here, even if we concede elsewhere. Don't let the perfect be the enemy of the good."
  **Soft Spot:** They are right; your scope is limited. Don't overclaim.

  #### 7. The EA-Adjacent Grad Student
  **The Objection:** "I work in embryo selection. If I tell parents, 'Picking Embryo A is better for the kid,' and they ask, 'But would this kid exist if we picked B?', and I say 'No, but they're c-candidates,' they will think I'm insane. Can I actually use this in counseling? Or is this just theory?"
  **The Answer:** "You tell them: 'In this specific medical context, we treat these embryos as alternatives for the *same potential life trajectory*.' You don't use the word 'c-candidate.' You use the intuition: 'A day's delay wouldn't change who the child is, so selecting between these simultaneous options doesn't change who the child is either.' It justifies the beneficence claim without lying about biology."
  **Soft Spot:** It's still a hard sell. You are asking them to adopt a philosophical distinction in a clinical setting.

  #### 8. The "Hope Nobody Asks" (Transitivity)
  **The Objection:** "Let's talk logic. Identity is transitive. If A=c-candidate B, and B=c-candidate C, is A=c-candidate C? If yes, then by a chain of small gamete changes, *everyone* is a c-candidate of everyone (Sorites). If no, then c-candidacy isn't an equivalence relation. If it's not an equivalence relation, it cannot ground 'same person' talk even loosely. You've defined a relation that is too weak to do the work you want."
  **The Answer:** "I bite the bullet: It is **not transitive**. And that is fine. Identity is the wrong model for normative significance. Moral concern doesn't need to be transitive. I can have special obligations to my child that I don't have to my grandchild's peer, even if the chains connect. C-candidacy tracks *moral proximity in selection*, not logical equivalence. It's a gradient, not a binary."
  **Soft Spot:** **This is your biggest vulnerability.** Denying transitivity makes "c-candidacy" sound like "similarity." The Parfitian will jump on this and say, "So it's just similarity! Admit it!"
  **How to survive:** Do not call it "loose identity." Call it "Moral Equivalence for Selection Purposes." Argue that logic governs *truth*, but ethics governs *concern*, and the structure of concern need not match the structure of identity. If you try to defend it as a logical relation, you lose. If you defend it as a *normative* relation, you might hold the line.

  ### Final Advice
  The Decision Theorist and the Transitivity objection are the same wolf in different clothing. If you can convince the Decision Theorist that they can model "non-transitive moral proximity" in their utility function, you neutralize the Transitivity objection. Focus your energy there. The Animalist will grumble, but if you concede biological vagueness, they won't kill you. The Pop Ethicists are your target audience; if they nod, you win.
