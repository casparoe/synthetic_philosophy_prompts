answer: |-
  # Activity: The Transparency Protocol

  **Time:** 90 Minutes
  **Participants:** 8 Grad Students
  **Materials:** Poker chips or paper tokens (30 total), a timer, 3 physical stimuli (e.g., a red card, a rough piece of sandpaper, a tuning fork or bell), printed role cards.
  **Theory Load:** Zero upfront. The term "Illusionism" is withheld until the debrief.

  ## 1. Setup & Rules (5 Minutes)
  Divide the class into three groups for three rounds (20 mins each). In each round, assign roles:
  *   **1 Reporter:** Focuses on a stimulus and describes their experience.
  *   **2 Interrogators:** Ask questions to pin down the description.
  *   **5 Judges:** Hold the tokens. They vote on whether a "Ghost Reference" occurred.

  **The Goal (Read to Class):**
  "We are investigating the structure of introspection. The Reporter must describe their current conscious experience. However, there is a constraint on language."

  **The Token Rules:**
  *   **Ghost Reference (Interrogator Point):** If the Reporter describes their experience as having an *intrinsic, private quality* that is distinct from the object being perceived or their behavioral disposition (e.g., "the raw hurtfulness," "the private redness," "what it's like for me"). If the Judges agree this is a Ghost Reference, Interrogators get 1 token.
  *   **Functional Avoidance (Reporter Point):** If the Reporter describes their experience purely in terms of *what they are detecting, attending to, or disposed to do* (e.g., "I am detecting a long wavelength," "I am attending to the texture," "I am inclined to pull away"), and the Judges agree no Ghost was invoked, the Reporter gets 1 token.
  *   **Stalemate:** If Judges are split, no tokens awarded.

  **Constraint:** The Reporter *must* keep talking. Silence for more than 5 seconds awards a token to the Interrogators.

  ## 2. The Rounds (60 Minutes Total)

  **Round 1: Visual Transparency (20 Mins)**
  *   **Stimulus:** A bright red card held in front of the Reporter.
  *   **Instruction to Reporter:** "Focus on the visual experience. Describe the *experience of redness*, not the card itself."
  *   **Philosophical Target:** *The Transparency of Experience.*
  *   **Expected Dynamic:** The Reporter will try to point inward. Interrogators will ask, "Are you describing the card or your brain?" Judges will notice the Reporter keeps describing the card's properties (brightness, saturation) because they can't find the "experience" separate from the object.
  *   **Token Trap:** If the Reporter says, "It looks vivid *to me*," that's a Ghost Reference (Interrogators win). If they say, "My visual system is signaling red," that's Avoidance (Reporter wins).

  **Round 2: Somatic Presence (20 Mins)**
  *   **Stimulus:** The Reporter presses their thumb firmly into the sandpaper (mild discomfort/texture).
  *   **Instruction to Reporter:** "Focus on the sensation in the thumb. Describe the *pain/texture feel* itself."
  *   **Philosophical Target:** *Phenomenal Ghosting (The Placeholder).*
  *   **Expected Dynamic:** This is the hardest round. Pain feels intrinsically "bad." The Reporter will want to say, "It has a painful quality."
  *   **Token Trap:** "It hurts" is ambiguous. "It has a hurt-quality" is a Ghost. "I am having a negative reaction to tissue stress" is Avoidance. The Judges will likely award points to Interrogators here, creating frustration.

  **Round 3: Auditory/Memory (20 Mins)**
  *   **Stimulus:** A bell is rung once. Reporter closes eyes and focuses on the fading echo/memory of the sound.
  *   **Instruction to Reporter:** "Describe the lingering presence of the sound in your mind."
  *   **Philosophical Target:** *The Misattribution of Presence.*
  *   **Expected Dynamic:** The sound is gone, but the "memory feel" remains. Reporters often describe this as a "faint copy." Interrogators challenge: "Is it a copy, or are you just simulating attention?"
  *   **Token Trap:** "It feels faint" (Ghost) vs. "My confidence in the signal is low" (Avoidance).

  *Rotate roles so everyone serves as Reporter at least once across the three rounds (with some overlap or partial rotation given 8 people).*

  ## 3. The Debrief & Theory Reveal (25 Minutes)

  **Step 1: Tally & Emotion Check (5 Mins)**
  *   Ask the Reporters: "How did it feel to try to avoid the Ghost?" (Expected: Frustrating, like you're being asked to lie about your own experience).
  *   Ask the Interrogators: "Did you feel like you were winning by finding the truth, or by nitpicking language?"
  *   Ask the Judges: "Was there ever a moment where a 'Ghost' seemed undeniably real?"

  **Step 2: The Reveal (10 Mins)**
  *   Introduce the term **Illusionism** (Keith Frankish, Daniel Dennett).
  *   Explain **Phenomenal Ghosting:** The game was rigged to simulate the illusionist claim.
      *   *The Ghost Reference* = The claim that qualia exist as intrinsic properties.
      *   *The Functional Avoidance* = The claim that experience is just complex representation/monitoring.
  *   Explain that the frustration the Reporters felt *is the data*. Illusionists argue that introspection is a "user illusion." The brain creates a "ghost placeholder" (a feeling of presence) to mark important data. When you try to grab the ghost, you only grab the data (function/representation).

  **Step 3: Mapping the Rounds (10 Mins)**
  *   **Round 1 (Vision):** Maps to **Transparency.** You looked "through" the experience to the object. Illusionists say there is nothing *in* the experience but the representation of the object.
  *   **Round 2 (Pain):** Maps to **Misattribution.** The "badness" of pain feels intrinsic. Illusionists say this is a value-judgment tag the brain adds, mistaken for a sensory quality.
  *   **Round 3 (Memory):** Maps to **The Placeholder.** The "fading sound" was a cognitive simulation, but it *felt* like a presence. This is the "ghost" in the machine.

  ---

  ## 4. Predictable Failures & Mitigation

  **1. The "You're Just Redefining Words" Objection**
  *   **What happens:** A Reporter (or Judge) will argue that "detecting red" *just means* "seeing red," so the Functional Avoidance is secretly a Ghost Reference in disguise.
  *   **Mitigation:** As instructor, intervene only to enforce the game rules, not resolve the metaphysics. Say: "For the purpose of the token, does the phrasing *invoke* a private medium? If yes, it's a Ghost. If it invokes a mechanism, it's Avoidance. Sit with the ambiguity."
  *   **Philosophical Payoff:** This objection *is* the hard problem. Acknowledge this in the debrief. The game works best if they feel the tension, not if they resolve it.

  **2. Reporter Alienation**
  *   **What happens:** The Reporter feels gaslit. They know they have qualia, and the game treats their sincere reports as "errors."
  *   **Mitigation:** Frame the Reporter's role as "The Phenomenological Naive Realist." Their job isn't to lose; their job is to represent the common-sense view. The frustration is evidence of how deeply the illusion is rooted.

  **3. Interrogator Aggression**
  *   **What happens:** Interrogators turn it into a cross-examination to "destroy" the Reporter.
  *   **Mitigation:** Instruct Interrogators: "Your goal is not to stump them, but to *translate* them. If you can rephrase their ghost claim into a functional claim they accept, you get the point." This makes it collaborative deconstruction rather than combat.

  ## 5. Critical Limitation (Instructor Note)

  **Be honest about what the game cannot do:**
  In the debrief, explicitly state:
  > "This game has a fatal flaw, and it's the same flaw in Illusionism itself. To play the game, you had to have *some* experience to report. You had to feel the sandpaper, see the red, hear the bell. The game demonstrates that you can't *describe* the qualia without functional terms. It does not prove the qualia *don't exist*.
  >
  > Illusionism makes the stronger claim: that the 'feeling' you had while trying to win tokens was *itself* the ghost. The game requires you to have an experience to analyze, so it cannot simulate the *absence* of phenomenal properties. It only simulates the *elusiveness* of them. If you walked away feeling like 'There's still something left over that you didn't capture,' the Illusionist says: 'That leftover feeling is the ghost.'"

  ## 6. Why This Works for Grad Students
  *   **Epistemic Humility:** It forces Realists to struggle with language, not just assert intuition.
  *   **Operationalizing Theory:** It turns "transparency of experience" from a textbook phrase into a lived difficulty.
  *   **Low Stakes, High Concept:** The token system gamifies the metaphysical tension without requiring actual belief commitment during the round.
  *   **No Tech:** Keeps the focus on the phenomenology, not a screen.

  ## 7. Role Cards (Printable Text)

  **Reporter Card:**
  > Your task: Describe your current conscious experience.
  > Constraint: Try to earn tokens by describing your state as a **function** or **relation** (e.g., "I am monitoring," "I am detecting").
  > Trap: Avoid describing **intrinsic qualities** (e.g., "The raw feel," "The private vividness").
  > Note: If you feel stuck, describe what you are *doing* with the experience.

  **Interrogator Card:**
  > Your task: Help the Reporter translate their experience.
  > Goal: Earn tokens by identifying **Ghost References**.
  > Listen for: Claims that the experience has a property that isn't physical, functional, or about an object.
  > Ask: "Is that a property of the object, or a property of you?" "What function does that feeling serve?"

  **Judge Card:**
  > Your task: Adjudicate the tokens.
  > **Ghost Reference:** Did the Reporter imply a private, non-physical quality exists? -> **Interrogator Point.**
  > **Functional Avoidance:** Did the Reporter describe the state as a mechanism/action/relation? -> **Reporter Point.**
  > Note: If you aren't sure, vote "Stalemate." Trust your intuition about whether they pointed to a "thing" or a "process."
