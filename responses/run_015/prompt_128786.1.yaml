      *   *Phenomenal Ghosting:* The specific mechanism where the brain posits a "presence" that isn't there.
      *   *The Trap:* When asked "What is it like?", we tend to point to the *object* of experience (redness of the apple) or the *reaction* to it (surprise, attention), not the "raw feel" itself.
