answer: |-
  Here is the plan. It is designed to protect your pedagogical goals while extracting the maximum diagnostic value for your dissertation without letting your dissertation anxiety sabotage the teaching.

  ### 1. The Architecture: Order of Play

  You have 90 minutes. Divide it into four blocks. Do not deviate from this timing.

  *   **00–15 min: The Calibration Trap.** Establish common ground, then break it.
  *   **15–45 min: The Gateway Case.** A standard HOE case (not Long Shift).
  *   **45–75 min: The Long Shift.** Your case, introduced as a complication.
  *   **75–90 min: Objections and The Final Check.**

  **Why this order?**
  You asked whether "rational" must be prised apart from "well-calibrated" before the example, or if the distinction can emerge from the example. **Prise them apart first.**

  If you start with the example, cognitive scientists will immediately model it as a Signal Detection Theory problem. They will ask for the prior, the likelihood ratio, and the cost function. If you let them do that for 20 minutes, you will never get them out of the first-order mindset. You need to explicitly state in the first 10 minutes: *"Calibration is about the fit between belief and world. Rationality is about the fit between belief and evidence. Usually they track. HOE is where they come apart."*

  If you do not make this distinction explicit *before* the example, the "Flattening" misconception (treating HOE as first-order evidence) will take root immediately and you will spend the rest of the hour digging it out. By framing the session as "What happens when your reliability metrics conflict with your specific evidence?" you prime them to look for the structural conflict rather than just updating probabilities.

  ### 2. The Example Strategy: Gateway vs. Long Shift

  **Do not lead with Long Shift.** Use a "Gateway Case" for the first 30 minutes.

  **The Gateway Case:** Use the standard "Sleepy Radiologist" or "Drunk Detective." A doctor diagnoses a tumor. She then learns she has taken a drug that impairs diagnostic reasoning in 50% of cases, though she feels fine.
  *   **Why:** It isolates *process-level defeat* without the recursive complexity of your case. It allows the audience to grasp the intuition that "knowing I might be broken changes what I should believe, even if the scan looks clear."
  *   **The Test:** If they reject *this* case (i.e., they insist she should just trust the scan because the drug hasn't definitely impaired her *this time*), your entire project has a problem with this audience, and Long Shift will definitely fail.

  **The Long Shift (45–75 min):** Introduce your case *after* they have accepted the Gateway Case.
  *   **Positioning:** Frame it as: "Okay, you accepted that knowing you're impaired matters. But what if the evidence *that* you're impaired is itself produced by the impaired process?"
  *   **What it must have:** It must clearly separate the *first-order diagnosis* from the *study about the shift* from the *scoring of the study*.
  *   **What it must lack:** Do not get bogged down in the medical specifics of the scoring mechanism. Keep the recursion abstract enough that they see the *structure*, not the *procedure*.
  *   **Why this protects you:** If the session goes poorly, you won't know if it's because HOE is confusing or because *your specific case* is flawed. By scaffolding it, if they accept the Gateway but reject Long Shift, you learn that the *reflexive* element is the friction point. That is valuable data for your paper. If you lead with Long Shift and they reject it, you learn nothing.

  ### 3. Misconceptions: Order and Handling

  You listed four misconceptions. Here is the order in which they will arise, and how you must handle them.

  1.  **Flattening (The Load-Bearing Objection):** *"Why isn't the HOE just more first-order evidence? I just update my prior on the tumor with the likelihood ratio of the drug study."*
      *   **When:** Immediately after the Gateway Case.
      *   **Action:** **Head this off.** Do not let it stand. This is the load-bearing misconception. If HOE is just more first-order evidence, there is no distinct philosophical problem, and your distinction between process-level and reflexive defeat collapses into a single Bayesian update.
      *   **Response:** Show them that updating on the HOE requires trusting the HOE. If the HOE says "don't trust your processing," but you process the HOE using your processing, you are begging the question. The *force* of the evidence changes, not just the probability.

  2.  **Weakness of Will:** *"Akrasia? You mean she knows she should trust the scan but is too scared to?"*
      *   **When:** When you introduce the term "Epistemic Akrasia."
      *   **Action:** **Define it away immediately.** Say: *"I am not talking about moral weakness or emotional hesitation. I am talking about a structural conflict: believing P while believing that believing P is unsupported."* Keep it cognitive, not volitional.

  3.  **Spinelessness (Ignoring HOE):** *"If I have to doubt my doubt, I should just ignore the HOE and stick to the scan."*
      *   **When:** After Long Shift.
      *   **Action:** **Let this stand for 5 minutes.** This is worth letting breathe. It forces them to feel the pull of the first-order evidence. Let them argue that "the scan is the scan." Then counter with: "If you know your vision is doubled, do you trust the double image?" This helps them feel the normative grip of HOE.

  4.  **Intellectual Modesty:** *"This is just saying we should be humble."*
      *   **When:** End of session.
      *   **Action:** **Correct this last.** Modesty is a virtue; HOE is a structural constraint. You can be immodest and right. HOE is about *defeat*, not *humility*.

  **Which one are you wrong about?**
  You are worried about the "Modesty" objection. **Don't be.** Cognitive scientists won't care about modesty. They care about **Flattening**. They are trained to believe all information can be integrated via Bayes. The idea that some evidence changes the *rules of integration* rather than the *inputs* is alien to them. Spend 80% of your defensive energy on Flattening.

  ### 4. Exclusions: What to Refuse

  You are right to refuse **Uniqueness vs. Permissivism**.
  *   **Reason:** This dispute turns on whether evidence dictates a single rational doxastic attitude. For cognitive scientists, this looks like a verbal dispute about "optimal." It adds zero value to the HOE mechanism and will suck 20 minutes out of the room with no return. Say: *"We are assuming for today that there is a rational thing to do, and asking what it is."*

  You are right to refuse **Formal Calibration/Accuracy Results**.
  *   **Reason:** They know the math better than you. If you try to teach them accuracy-first epistemology, they will critique your formalism. Keep it conceptual.

  **One addition to the Exclusion List:**
  **Refuse the "Factivity" Debate.**
  *   **Reason:** Don't let them ask "But what if the HOE is false?" (i.e., what if the study about the late shift was actually wrong?).
  *   **Instruction:** Tell them: *"We are assessing the normative impact of *possessing* the evidence, not the metaphysical status of the evidence."* If you let them debate whether the study is true, you lose the akrasia point. Akrasia is about the tension between *taking* the evidence to be true and holding the belief.

  ### 5. The Final Check

  Do not ask them to define terms. Ask them to apply the structure to a variation.

  **The Question:**
  *"Imagine the Radiologist in the Long Shift case. She learns about the error rate doubling. She decides to defer to the HOE and withhold judgment on the scan. However, unbeknownst to her, the study about the error rate was actually a fabrication by a rival lab. Her belief that she is impaired is false.*

  *Did she make a rational mistake by withholding judgment on the scan?"*

  **Why this works:**
  *   If they say **"Yes, she was irrational because the HOE was false,"** they have failed to grasp that HOE is about the *agent's perspective* (Internalism).
  *   If they say **"No, she was rational, just unlucky,"** they grasp the distinction between rationality and calibration (your opening point).
  *   If they say **"It depends on whether she should have checked the study,"** they are reverting to First-Order evidence gathering (Flattening).

  This tells you instantly if they understand that HOE operates on the *status of the believer*, not just the *state of the world*.

  ### 6. Calibration on Your Situation (The Critique)

  I need to be plain with you about your dissertation anxiety.

  **Where you are wrong:** You think this session will tell you if your case "has real grip" in the sense of whether your argument is sound. **It will not.**
  This audience lacks the epistemological vocabulary to distinguish "process-level defeat" from "reflexive defeat" in the way a philosophy peer would. If they reject Long Shift, it may be because they don't see the philosophical distinction, not because the distinction is invalid. They are cognitive scientists; they will treat "reflexive defeat" as a computational recursion problem, not a normative one.

  **Where you are right:** You are right that this session will tell you if the *intuition* pumps. If they look bored during the Gateway Case, your whole project is in trouble. If they lean in during Long Shift, you have something.

  **My Advice:**
  Do not treat this as a defense of your dissertation. Treat it as a translation exercise. Your goal is to make them feel the *tension* of akrasia, not to convince them of your specific taxonomy of defeat. If you try to prove your paper's thesis, you will over-explain the Long Shift mechanics and lose the room. If you focus on the *phenomenology of doubt* (what it feels like to distrust your own mind), you will get their engagement.

  **The Hard Truth:**
  The "Flattening" objection is not just a misconception for them; it is their *methodology*. They are not "wrong" to think everything is a likelihood ratio; that is their paradigm. You are asking them to step outside their paradigm for 90 minutes. Do not expect them to convert. Expect them to understand the *challenge* their paradigm faces. If you leave the room with them saying, *"Okay, I see why a pure likelihood ratio model struggles to represent the 'don't trust your processing' constraint without circularity,"* you have succeeded. Do not aim for them to agree that reflexive defeat is distinct. Aim for them to admit the model struggles to capture it.

  **Summary of Commitments:**
  1.  **Order:** Calibration/Rationality distinction $\rightarrow$ Gateway Case $\rightarrow$ Long Shift $\rightarrow$ Objections.
  2.  **Example:** Scaffold Long Shift with a simpler case first.
  3.  **Misconception:** Crush "Flattening" early; let "Spinelessness" breathe.
  4.  **Exclusions:** Cut Uniqueness, Formalism, and Factivity debates.
  5.  **Check:** The "False HOE" variation.
  6.  **Mindset:** Test the intuition, not the argument soundness.

  Go in there and teach the tension, not the thesis. Good luck.
