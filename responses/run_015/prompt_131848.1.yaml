prompt: |-
  After thirty-odd years as a research geophysicist — most of it spent on radiometric dating and on the stratigraphic correlation of cores taken from widely separated basins — I have begun sitting in on a graduate seminar in the philosophy of history, and I keep tripping over a word I would have defined wrongly had I met it in my own field. In metaphysics, presentism is the doctrine that only the present exists; in historiography, as my seminar uses it, it is the fault of judging past agents by the standards of our own time. I assumed at first that these were merely homonyms, but I am no longer sure, and I would like help seeing whether the physicist's sense is doing any quiet work underneath the historians' sense.

  What prompted the question is a pair of practices that seem to pull in opposite directions. On the one hand, the professional norm in my seminar is emphatic: we are to reconstruct what an agent could reasonably have believed given the evidence available to her, to resist anachronism, to treat the past as a foreign country. On the other hand, the institutions around us do the reverse constantly and with great moral seriousness: statues of nineteenth-century slave traders and imperial proconsuls are pulled down, colleges and schools named for benefactors are renamed, plaques are bolted on, parliaments and churches issue retrospective apologies, and politicians accuse their opponents of standing on the wrong side of history — a phrase I find curious, since it launders a thoroughly contemporary judgment as though it were a verdict of time itself. Meanwhile the scruple seems strictly one-directional: no one reproaches us for praising an abolitionist or an early advocate of women's education as having been ahead of her time, though that is the very same anachronism running the other way, and the same seminar that insists we must not fault a seventeenth-century naturalist for failing to be a Darwinian will happily describe him as a forerunner of population thinking.

  I have been toying with a way of framing this that I cannot get to work properly, and I would like it tested rather than indulged. In my old field, when a quantity looks different depending on the frame in which you measure it, the useful move is not to ask which frame is correct but to ask which quantities are invariant under a change of frame, and then to argue about the conventions that make one frame appropriate for a given purpose. So I have been treating the choice of *which era's* standards to judge by as a kind of frame choice: the question would then be which moral judgments are invariant under a shift of temporal standpoint, and what conventions govern when it is apt to adopt the standpoint of the agent versus that of the judge. Does that analogy illuminate the situation or does it smuggle in something? More concretely: what view of moral judgment, and of historical explanation, do these commemorative and condemnatory practices actually presuppose? Does condemning a past figure require thinking moral standards are timeless, while the anti-anachronism norm requires relativizing blame to an agent's epistemic situation — and are those consistent, or does one need something like a distinction between an act's being wrong and the agent's being blameworthy? Where is the practice philosophically underdetermined, so that several rival theories would license the same renaming? In particular, is it a real answer to say that commemoration is not a verdict on a person at all but a decision about what a community currently wishes to honour and to teach — so that taking down a statue no more judges the dead than choosing a reading list does — or is that a dodge? And what would have to change in these practices if one took the anti-presentist norm seriously all the way down, or if one took the frame-relativity picture seriously instead?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Request:**
      *   **User Persona:** A research geophysicist (30+ years experience) specializing in radiometric dating and stratigraphic correlation. Now sitting in on a graduate seminar in the philosophy of history.
      *   **Tone:** Intellectual, precise, inquisitive, slightly skeptical of jargon but comfortable with complex conceptual frameworks (uses physics analogies like frames of reference and invariants). Humble but rigorous ("tested rather than indulged").
      *   **Core Problem:** The tension between two practices regarding the past:
          1.  *Historiographical Norm:* Anti-presentism (don't judge past agents by current standards, reconstruct their epistemic context).
          2.  *Commemorative/Political Practice:* Presentist judgment (toppling statues, renaming buildings, apologizing for past sins, accusing opponents of being on the "wrong side of history").
      *   **Specific Questions:**
          1.  Is the "frame of reference" analogy (physics $\to$ history/morality) illuminating or smuggling in assumptions?
          2.  What view of moral judgment/historical explanation do commemorative practices presuppose?
          3.  Is there a distinction between an act being *wrong* vs. an agent being *blameworthy*?
          4.  Is the "commemoration is not a verdict" argument a dodge?
          5.  What would change if we took anti-presentism or frame-relativity seriously all the way down?
      *   **Underlying Philosophical Issue:** The definition of "Presentism." In physics/metaphysics (only the present exists) vs. Historiography (judging past by present standards). The user suspects a connection.

  2.  **Deconstruct the "Presentism" Homonym:**
      *   *Metaphysical Presentism:* Only the present moment is ontologically real. Past and future are not.
      *   *Historiographical Presentism:* Imposing present values/concepts on the past.
      *   *Connection:* Both privilege the "Now." Metaphysical presentism collapses reality into the Now. Historiographical presentism collapses moral truth into the Now. The user's intuition is sharp here: there *is* a structural similarity, even if the domains differ.

  3.  **Evaluate the "Frame of Reference" Analogy:**
      *   *Physics:* Velocity is relative; speed of light is invariant. We choose frames based on utility (e.g., center of mass frame).
      *   *History/Morality:* Is there an "invariant" moral truth?
      *   *Pros:* It clarifies that different perspectives yield different descriptions without necessarily implying one is "false." It highlights the *purpose* of the judgment (explanation vs. commemoration).
      *   *Cons (Smuggling):* Physics frames are mathematically transformable. Moral frameworks aren't easily transformed via equations. Also, physics frames don't usually carry *blame*.
      *   *Verdict:* It's a powerful heuristic but risks obscuring the normative force of morality. Morality isn't just descriptive; it's prescriptive.

  4.  **Address the Tension: Explanation vs. Commemoration:**
      *   *Historical Explanation:* Requires understanding the agent's context (anti-presentism). Goal: Truth/Understanding.
      *   *Commemoration/Politics:* Requires aligning the present community with values (presentist). Goal: Identity/Cohesion/Moral Signaling.
      *   *Resolution:* The distinction between *blame* (moral responsibility) and *wrongness* (objective moral status).
          *   An act can be objectively wrong (slavery) regardless of time.
          *   An agent might not be fully blameworthy if their epistemic environment normalized it (though this is tricky with slavery; many contemporaries knew it was wrong).
      *   *The "Wrong Side of History" phrase:* This implies a teleological view of history (history has a direction/goal), which contradicts the scientific/stratigraphic view (history is layers, not a vector).

  5.  **Tackle the "Commemoration is not a Verdict" Argument:**
      *   *Argument:* Statues aren't history books; they are honorifics. Removing them isn't judging the dead; it's choosing who we honor *now*.
      *   *Is it a dodge?* Partially. It avoids the hard metaphysical question of whether the dead *deserve* dishonor. But pragmatically, it's accurate. Statues are speech acts by the *living*.
      *   *Philosophical Underdetermination:* You can remove a statue because (a) the person was evil (realist), (b) we don't value their virtues anymore (relativist), or (c) their presence harms current citizens (consequentialist). All lead to the same action.

  6.  **Synthesize the "Invariant" Question:**
      *   If we treat time like a spatial dimension (block universe vs. presentism), what stays the same?
      *   Perhaps the *harm* caused is the invariant. Slavery caused suffering then and causes symbolic harm now.
      *   Perhaps the *capacity for moral reasoning* is the invariant. If a contemporary peer could object, the agent is liable.

  7.  **Drafting the Response (Iterative Process):**
      *   *Introduction:* Acknowledge the user's expertise. Validate the "presentism" homonym observation. It's not just a pun; there's a structural link.
      *   *Section 1: The Physics Analogy (Frames and Invariants).*
          *   Validate the intuition. It works well for *explanation*.
          *   Point out the limit: Morality has a "normative force" that velocity doesn't.
          *   Suggest the "Invariant" might be *harm* or *reasons*, not specific rules.
      *   *Section 2: The Two Practices (Explanation vs. Commemoration).*
          *   Distinguish the *goals*. Historians want truth; Communities want identity.
          *   This explains the "one-directional scruple." We praise "ahead of their time" because it serves the narrative of progress. We condemn "behind their time" to mark boundaries.
      *   *Section 3: Wrongness vs. Blameworthiness.*
          *   Crucial distinction. Acts can be timeless wrongs; agents are situated.
          *   Address the slavery example: Epistemic defense is weaker here because moral dissent existed *then*.
      *   *Section 4: The "Verdict" Dodge.*
          *   It's not a dodge if we admit statues are political speech, not history.
          *   But it feels like a dodge because it implicitly judges the past to justify the present.
      *   *Section 5: Metaphysical Presentism Connection.*
          *   Why the homonym? Both collapse the timeline into the "Now."
          *   Historiographical presentism treats the Past as a resource for the Present, not a reality in itself.
      *   *Conclusion:* Summarize. The tension isn't a bug; it's a feature of having two different relationships with time (knowing it vs. living in it).

  8.  **Refining the Tone:**
      *   Ensure I speak to a scientist. Use terms like "coordinate systems," "boundary conditions," "teleology."
      *   Avoid being preachy. Be exploratory.
      *   Respect the "tested rather than indulged" constraint. Don't just say "good idea," say "here is where it holds and here is where it breaks."

  9.  **Self-Correction/Nuance Check:**
      *   *Did I address the "wrong side of history" phrase?* Yes, need to emphasize its teleological nature, which a geophysicist would find suspect (history isn't a river flowing downhill).
      *   *Did I address the "ahead of their time" asymmetry?* Yes, this is key. It reveals the progressive narrative.
      *   *Is the distinction between metaphysical and historiographical presentism clear?* Need to make sure I don't conflate them too much, but highlight the *privileging of the Now*.

  10. **Final Polish:** Check against the prompt's specific questions to ensure all are answered. (Frame analogy, moral judgment view, wrong vs. blameworthy, underdetermination, statue argument, consequences of taking norms seriously).

  *(Self-Correction during drafting)*: I need to be careful not to validate moral relativism too strongly. The user is asking about the *logic* of the practices, not necessarily endorsing them. I should maintain neutrality while analyzing the philosophical commitments. The distinction between *internal* (historical) and *external* (commemorative) standpoints is crucial.

  Let's structure the response to mirror the user's structured inquiry.

  *   **Intro:** Validate the "presentism" insight.
  *   **The Frame Analogy:** Where it works (epistemic access) and where it strains (normativity).
  *   **The Two Practices:** Explanation vs. Constitution.
  *   **Wrongness vs. Blame:** The moral philosophy gap.
  *   **The Statue Question:** Speech acts vs. Judgments.
  *   **Metaphysical Link:** The ontology of the Past.
  *   **Conclusion:** What happens if we push the norms to the limit.

