answer: |-
  This is a remarkably sharp set of observations. You have identified a friction point where the epistemology of history (how we know the past) collides with the ethics of memory (how we live with the past). Your intuition that the physicist's "presentism" and the historian's "presentism" are not merely homonyms but share a structural DNA is correct. Both privilege the *Now* as the only locus of reality or authority.

  You asked for your "frame of reference" analogy to be tested rather than indulged. Here is an analysis of where that analogy holds, where it smuggles in assumptions, and what the practices you describe actually presuppose.

  ### 1. The Frame of Reference Analogy: Illumination vs. Smuggling

  Your proposal to treat temporal standpoints as coordinate frames is a powerful heuristic, largely because it decouples *description* from *ontology*. In special relativity, simultaneity is relative to the observer's velocity, but the spacetime interval is invariant. You are asking: *What is the spacetime interval of morality?*

  **Where it illuminates:**
  It clarifies why the "anti-presentist" norm in the seminar and the "presentist" norm in the public square do not necessarily contradict each other logically, provided they are serving different functions.
  *   **The Historian's Frame:** The goal is *explanation*. To explain why Agent $A$ did $X$ at time $t_1$, you must transform coordinates into $A$'s rest frame (their epistemic and moral environment). In this frame, $X$ might be a rational vector.
  *   **The Commeminator's Frame:** The goal is *orientation*. To decide what a statue signifies at time $t_{now}$, you must measure against the current moral field. In this frame, $X$ might be a vector of oppression.

  Just as a map projection distorts area to preserve shape (or vice versa) depending on the map's purpose, historical judgment distorts "fairness to the dead" to preserve "clarity for the living," or vice versa.

  **Where it smuggles:**
  The analogy risks smuggling in the assumption that moral values are *transformable* between frames like velocity. In physics, we have a Lorentz transformation to move from one frame to another. In ethics, we lack the transformation function.
  *   If a 17th-century naturalist holds a view we find abhorrent, we cannot simply "boost" his morality into our frame and expect the math to work. The concepts themselves (race, sovereignty, personhood) often have no direct equivalent.
  *   Furthermore, physics frames are descriptively equivalent; neither is "true" to the exclusion of the other. Moral frames are often prescriptively competitive. To say "slavery was wrong then" and "slavery was acceptable then" are not just different coordinates; they are conflicting truth claims about the nature of value.

  **The Invariant:**
  If we press your analogy, the "invariant" under a shift of temporal standpoint is likely not a specific rule (e.g., "do not own slaves"), but rather **the capacity for moral reasoning regarding harm.**
  *   *Invariant:* Did the agent have access to reasons to believe their action caused unjustified harm?
  *   *Variable:* The social cost of acting on those reasons.
  This allows you to say an act was *wrong* (invariant harm) without saying the agent was *blameworthy* (variable epistemic/social pressure).

  ### 2. The Asymmetry of "Ahead" vs. "Behind"

  You noted the one-directional scruple: we forgive the past for not being Darwinian, but praise the past for being abolitionist. This reveals that the "anti-presentist" norm in the seminar is not actually a neutral methodological rule; it is a specific **philosophy of moral progress.**

  *   **To excuse the naturalist:** Presupposes that moral/epistemic knowledge accumulates over time (a stratigraphic view, fitting for you). We stand on higher ground; we cannot blame them for being in the valley.
  *   **To praise the abolitionist:** Presupposes that moral truth is accessible *before* the accumulation is complete. It implies a "moral realism" where truth exists independently of the consensus.

  The phrase "wrong side of history" is the tell. It treats History as a teleological force (a river flowing toward justice) rather than a sequence of events (layers of sediment). A geophysicist knows strata do not flow toward a goal; they accumulate. The political usage smuggles in a providential view of time: the "end of history" is known, and we are judging the dead by their alignment with a future that hadn't happened yet. This is the ultimate historiographical presentism: collapsing the future's judgment into the present's certainty.

  ### 3. Wrongness vs. Blameworthiness

  You asked if condemning a past figure requires thinking moral standards are timeless. The answer is **yes**, but with a caveat regarding the target of the condemnation.

  Most coherent ethical systems distinguish between:
  1.  **Objective Wrongness:** The act violates a moral truth (e.g., enslaving a person is a violation of their agency).
  2.  **Subjective Blameworthiness:** The agent is culpable for the violation given their knowledge and options.

  The seminar's norm (anti-presentism) protects *blameworthiness*. It argues that if the epistemic environment made the wrongness opaque, the agent is not culpable.
  The public square's practice (toppling statues) asserts *objective wrongness*. It says, "This act was a violation of human dignity, regardless of whether the agent knew it."

  **The Consistency Check:**
  These are consistent *if* we accept that commemoration is not about the agent's soul, but about the act's legacy. However, the practice becomes inconsistent when we punish the *memory* of the agent as if we were punishing the agent.
  *   *Inconsistency:* "We shouldn't judge them by our standards" (Seminar) vs. "We are removing his name because he was evil" (Public Square).
  *   *Resolution:* "We are not judging his soul; we are judging the suitability of his symbol for our current community."

  ### 4. Is "Commemoration is Not a Verdict" a Dodge?

  You asked if saying "taking down a statue is just choosing a reading list" is a dodge.
  **It is a pragmatic truth, but a metaphysical dodge.**

  *   **Pragmatically:** It is accurate. A statue in a public square is a speech act by the *living*. It says, "We value what this person represents." Removing it says, "We no longer value that." It does not change the past, just as burning a book does not change the author's intent.
  *   **Metaphysically:** It dodges the question of *why* we no longer value it. If we say, "We don't value him because his actions were objectively wrong," we have issued a verdict on the past. If we say, "We don't value him because our tastes have changed," we admit to moral relativism.

  Most public discourse wants the force of the former (objective wrongness) with the immunity of the latter (it's just our current preference). This is where the practice is **philosophically underdetermined**.
  *   *Realist:* Remove the statue because he was evil (Truth).
  *   *Relativist:* Remove the statue because he doesn't fit our narrative (Utility).
  *   *Consequentialist:* Remove the statue because his presence harms living citizens (Harm).
  All three license the same action (removal), which is why the debate is so intractable. Everyone agrees on the *action*, but disagrees on the *justification*, and the justification determines what happens next (e.g., do we replace him with a 'good' person, or no person at all?).

  ### 5. The Connection to Metaphysical Presentism

  You suspected the physicist's sense of presentism is doing quiet work underneath the historian's sense. You are right.

  *   **Metaphysical Presentism:** Only the present moment is real. The past is gone; the future is not here.
  *   **Historiographical Presentism:** Only the present's values are authoritative. The past's values are dead; the future's values are irrelevant.

  Both are forms of **ontological privilege of the Now.**
  In your field, radiometric dating relies on the assumption that physical laws (decay rates) are invariant across time. If decay rates changed based on the "present," your correlations would fail.
  In history, if we adopt strict historiographical presentism, we imply that moral "decay rates" (standards) change such that the past is fundamentally inaccessible or irrelevant except as a resource for the present.

  The tension you feel arises because **Historical Explanation requires a "Block Universe"** (the past exists as a fixed reality we must map accurately), while **Moral Commemoration requires "Presentism"** (only the current community's needs are real).

  ### 6. What If We Took the Norms Seriously?

  **Scenario A: Taking Anti-Presentism All the Way Down**
  If we strictly applied the seminar's norm to the public square:
  *   We could never condemn any historical figure, as all were products of their time.
  *   We could never praise any historical figure as "ahead of their time," as that imposes our timeline on their agency.
  *   *Result:* Moral paralysis. History becomes a museum of exotic behaviors, devoid of lessons. Statues remain, not because the figures were good, but because judging them is "anachronistic." This treats the past as a *foreign country* in the sense of L.P. Hartley ("They do things differently there"), implying we have no jurisdiction.

  **Scenario B: Taking Frame-Relativity Seriously**
  If we adopted your physics analogy explicitly:
  *   We would label our judgments with their frame. "In the frame of 1850, this was legal; in the frame of 2024, this is a crime against humanity."
  *   We would acknowledge that statues are *current* frame declarations.
  *   *Result:* We might keep some statues with added context (transformations), and remove others where the "symbolic harm" in the current frame outweighs the "historical accuracy" value. It forces us to admit that removing a statue is an act of *creation* (making a new community statement), not *correction* (fixing a historical error).

  ### Summary

  The friction you are sensing is not a confusion to be solved, but a boundary condition to be managed.
  1.  **The Analogy:** Your frame-of-reference idea works for *explanation* but strains under *normativity*. The invariant is likely *harm/reason*, not specific rules.
  2.  **The Practices:** Explanation seeks truth (requiring context); Commemoration seeks identity (requiring values). They are different games.
  3.  **The Verdict:** The "statues are not verdicts" argument is pragmatically true but often used to mask a realist moral judgment.
  4.  **The Presentism Link:** Both senses of presentism collapse the timeline into the authority of the Now. One denies the existence of the past; the other denies the authority of the past's values.

  As a geophysicist, you know that stratigraphy requires both **correlation** (matching layers across time) and **dating** (fixing them in absolute time). History requires the same. We must correlate the past agent's reasons with their context (anti-presentism), but we must also date their actions against our absolute moral standards (presentism) to decide how to live with the layers they left behind. The error lies not in using both, but in claiming one method invalidates the other.
