answer: |-
  Rule 1: Domain Integrity. Rank only within identical fields; across domains, decline to rank (Cases 1, 5). Differences matter only within domains (Cases 2, 3, 4). This explains overall precedents by denying cross-domain comparability entirely.
  Rule 2: Metric Maximization. Rank whenever a shared metric shows a difference exceeding resolution. Past cross-domain cases lacked a common metric; now one exists, overriding domain distinctions. This explains precedents by claiming past incommensurability was simply metric scarcity.
  Rule 3: Significance Threshold. Rank only if differences exceed measurement error. If domains differ and no common metric exists, decline to rank. This explains precedents by combining both error margins with domain boundaries.
  Rule 4: Procedural Status. The scale governs only if adopted for allocation. Unrecorded status means prior domain rules apply, treating the scale as reporting only. Makes allocation authority conditional on minutes.
  Rule 5: Hybrid Consistency. Rank if same domain or if scale adopted; otherwise randomize small, judge large. Thus scales decision methods to intervention size.

  Rule 1 predicts declining to rank; domains differ. Rule 2 predicts ranking vocational training; the 1.3-unit gap exceeds 0.2 resolution, overriding domains. Rules 3 and 4 predict declining; no metrics or status. The numeric gap is substantial. This creates a sharp conflict.
  Divergence centers on Rule 2. It turns on whether the scale governs allocation. If authoritative, it mandates ranking. If silence implies status quo, Rules 1, 3, and 4 mandate no ranking, forcing judgment or lottery. Only Rule 2 treats the scale as overriding domain distinctions; others treat it as informational, preserving Case 1. Rule 2 requires explicit adoption; others assume continuity currently. Precedents 1 and 5 support the latter view. Precedent 2 supports the former if metrics align. Thus the committee must define the scale's power.

  I recommend we move to decline to rank and decide by judgment. The closest analogue remains Case 1: different domains (malaria vs. philosophy) with large-scale interventions. Despite the new scale, its allocation status is unrecorded, strongly implying it remains a reporting tool like all previous metrics. Strict consistency requires treating cross-domain comparisons as incommensurable until formally resolved. Ranking now would contradict Cases 1 and 5 without explicit prior committee authorization. Therefore, acknowledge the clear numeric difference but maintain that domain differences preclude ranking, leaving the final choice to judgment, minuting that either choice remains fully permissible under existing precedents today.

  Ranking commits the fund to strict utilitarian maximization, treating wellbeing units as a clear universal currency overriding domain distinctions. It establishes the scale as binding normative law. Declining to rank commits the fund to deep value pluralism, asserting that distinct domains retain true incommensurable worth despite numeric translation. It preserves active committee discretion and treats the scale as merely descriptive reporting. The former strongly prioritizes operational efficiency; the latter prioritizes categorical integrity and ethical procedural caution regarding future metric adoption.

  Consider two distinct different-domain programmes with a large gap, after formally voting unanimously to adopt the scale for allocation in the future. Rule 1 (Domain) predicts declining to rank, prioritizing strict categorical integrity. Rule 4 (Status) predicts ranking, prioritizing formal authorization. If we rank, Rule 4 wins; the scale becomes fully normative. If we decline, Rule 1 wins; domains remain permanently incommensurable regardless of metric status. This actually isolates whether domain or our procedural adoption really dictates true commensurability now.
