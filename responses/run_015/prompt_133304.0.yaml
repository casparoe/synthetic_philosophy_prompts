answer: |-
  # The Procurement Animal Welfare Assessment Protocol (PAWAP)

  **Purpose:** To determine whether a proposed food substitution reduces net animal suffering attributable to university purchases, within the constraints of procurement data and meeting time.
  **Time Budget:** 45–60 minutes per item.
  **Required Data:** Supplier specs, volume (kg/year), certification status, country of origin, land-use type.

  ---

  ## Part 1: The Procedure

  ### Step 1: The Threshold Gate (Termination Point)
  **Question:** Will this change alter the supplier's production behavior?
  **Action:** Compare the proposed volume change against the supplier's minimum batch size or contract tier.
  *   **Data Needed:** Total annual volume of item; Supplier's typical batch/contract increment.
  *   **Rule:** If the volume change is <5% of the supplier's batch increment *and* there is no clause allowing order adjustment, the supply chain does not contract.
  *   **Verdict:** **STOP.** No animal fate is changed. The proposal is purely symbolic. Publish justification: "Supply chain rigidity prevents impact."
  *   **Hand-off:** If the procurement officer cannot determine batch sizes, proceed to Step 2 but flag "High Uncertainty on Impact."

  ### Step 2: Counterfactual Baseline Lock
  **Question:** What happens to the land and the animals if we *do not* buy this?
  **Action:** Define the "Without-Us" scenario for both the product and the land.
  *   **Product Baseline:** If we stop buying Brand A, does the farmer sell to a lower-welfare buyer (Displacement) or reduce herd size (Reduction)? *Default Assumption: Displacement (0 impact) unless the region is supply-constrained.*
  *   **Land Baseline:** If this land is not farmed for this product, what is its next use? (e.g., Abandonment, Forestry, Arable).
  *   **Verdict:** If the "Without-Us" scenario results in identical animal numbers/suffering (e.g., farmer sells to competitor), **STOP.**
  *   **Hand-off:** If the land-use counterfactual is disputed (e.g., Farmers say "Forestry," Activists say "Rewilding"), record both scenarios. Do not resolve here.

  ### Step 3: Unit of Account & Sentience Weighting
  **Metric:** **Expected Harm Units (EHU) per 1,000 kcal served.**
  **Formula:** $EHU = \sum (Count \times Sentience\_Weight \times Suffering\_Intensity \times Duration)$
  **Sentience Weights (Defensible Defaults):**
  *   Mammals/Birds: 1.0 (Established nociception and behavioral evidence).
  *   Fish/Crustaceans: 0.5 (Substantial evidence, some uncertainty).
  *   Insects: 0.01 (Precautionary principle applied to high uncertainty; defensible as "non-zero but low priority").
  *   **Justification for Protesters:** "We prioritize known suffering (vertebrates) while acknowledging a small probability of invertebrate sentience. Ignoring insects entirely is risky; weighting them equally to cows is unscientific."

  ### Step 4: Scope of Harm Calculation
  **Action:** Calculate EHU for three categories for both Option A (Current) and Option B (Proposed).
  1.  **Direct:** Animals slaughtered for the product. (Count = Yield / Avg Carcass Weight).
  2.  **Feed:** Animals killed to grow feed (crop harvest deaths + feed crop animal inputs). *Default: Use standard industry feed-conversion ratios and harvest mortality rates (e.g., 5 field animals/hectare).*
  3.  **Land:** Wild animals displaced or supported by the land use. *Default: Arable = High Displacement; Pasture = Moderate Support; Forestry = Low Support.*
  **Data Source:** Procurement officer uses standard lookup tables provided by the committee (based on existing LCA databases) rather than original research.

  ### Step 5: The Indistinguishability Check
  **Question:** Are the results statistically distinct?
  **Action:** Apply a ±25% margin of error to all EHU estimates to account for data quality.
  *   **Rule:** If the EHU ranges of Option A and Option B overlap, they are **Indistinguishable.**
  *   **Verdict:** **NO PREFERENCE.** Do not switch. Switching incurs cost/risk for no proven welfare gain.
  *   **Justification:** "Our data resolution cannot confirm a benefit. We default to the status quo to avoid unintended harm."

  ### Step 6: The Value Hand-Off
  **Question:** If EHU is lower, does it violate a lexical value constraint?
  **Action:** If Option B has lower total EHU but involves *more deaths* of high-sentience beings (e.g., trading many insect lives for one cow life), the procedure stops.
  *   **Verdict:** **REFER TO COMMITTEE VOTE.** This is a value judgment (Aggregation vs. Rights), not a factual calculation.
  *   **Justification:** "The math favors Option B, but the distribution of harm conflicts with our ethical priorities. This requires a democratic decision."

  ---

  ## Part 2: Live Proposal Runs

  ### Case 1: Standard vs. High-Welfare Poultry
  **Proposal:** Switch from standard broiler (6-week life) to slower-growing breed (9-week life). Cost +30%. Yield: Requires 15% more birds per tonne due to lower feed conversion and higher mortality.
  **Step 1 (Threshold):** Volume is 10 tonnes/year. Supplier confirms this triggers a specific flock order. **PASS.**
  **Step 2 (Baseline):** Without us, farmer sells standard birds to supermarket. **Reduction Scenario.**
  **Step 3 & 4 (Calculation):**
  *   *Standard:* 1,000 birds. Life: 42 days. Intensity: High (crowding, leg issues). EHU = $1000 \times 1.0 \times 8 \times 42 = 336,000$.
  *   *High-Welfare:* 1,150 birds. Life: 63 days. Intensity: Moderate (more space, better health). EHU = $1150 \times 1.0 \times 4 \times 63 = 289,800$.
  *   *Feed:* High-welfare birds eat 20% more feed. Crop deaths increase by 20%. Add 50,000 EHU (field mice) to High-Welfare option.
  *   *Total EHU:* Standard = 386,000. High-Welfare = 339,800.
  **Step 5 (Indistinguishability):** Difference is ~12%. Within the ±25% margin of error.
  **Verdict:** **NO PREFERENCE (Refusal to Order).**
  **Reasoning:** While daily suffering is lower, the increased bird count and feed requirements negate the gain within our data resolution. Switching raises costs without a provable reduction in total harm.
  **Note:** This challenges the assumption that "Higher Welfare Label" always equals "Less Suffering."

  ### Case 2: Upland Grass-Fed Beef vs. Imported Plant Protein
  **Proposal:** Replace 5 tonnes of beef from marginal upland pasture with imported pea protein.
  **Step 1 (Threshold):** Contract is exclusive with local cooperative. **PASS.**
  **Step 2 (Baseline):**
  *   *If No Beef:* Land is commercially planted with conifers (Forestry) per local planning incentives.
  *   *If Pea Protein:* Sourced from intensive arable land in North America.
  **Step 3 & 4 (Calculation):**
  *   *Beef:* 20 Cows slaughtered. Life: 2 years (grazing). Intensity: Low (outdoor). EHU = $20 \times 1.0 \times 2 \times 730 = 29,200$.
      *   *Feed:* 0 (Grass).
      *   *Land:* Pasture supports voles/birds. Forestry (Counterfactual) supports 10% of that wildlife. Net "Land Harm" of Beef = Loss of 90% wild potential vs Forestry. But vs. *Status Quo*, Beef maintains habitat.
  *   *Pea Protein:* 0 Cows.
      *   *Feed:* N/A.
      *   *Direct:* 0.
      *   *Land (Source):* Intensive arable. Harvest kills ~10 field animals/hectare. To match protein, requires 50 hectares. = 500 animals (Sentience 1.0). EHU = 500 (instant death counts as high intensity/short duration).
      *   *Land (Local):* Upland goes to Forestry. Wild animal density drops by 90% compared to pasture.
  **Step 5 (Indistinguishability):**
  *   Beef EHU: ~30,000 (Mostly cow life days).
  *   Plant EHU: ~500 (Harvest deaths) + Local Habitat Loss.
  *   *Correction:* The metric is *Suffering*. A cow's 2 years of life is not necessarily 2 years of suffering. If grazing is good, EHU is low. Harvest death is high intensity.
  *   *Crucial Factor:* The "Field Death" count of the imported crop (500 mammals) outweighs the 20 cows, *and* the local land use shifts from Pasture (high wild density) to Forestry (low wild density).
  **Verdict:** **RETAIN BEEF.**
  **Reasoning:** The plant substitute shifts harm to intensive arable land (high field animal death) and degrades local land utility for wildlife. The "Plant-Based is Better" heuristic fails on marginal land where crops cannot grow.
  **Challenge to Prior:** This explicitly rejects the plant substitution based on land-use counterfactuals and field deaths.

  ### Case 3: Insect-Protein Product
  **Proposal:** Introduce cricket-flour burger patty.
  **Step 1 (Threshold):** New product line. **PASS.**
  **Step 2 (Baseline):** Displaces standard beef burger (Case 1 metrics).
  **Step 3 (Sentience):** Insects weighted at 0.01.
  **Step 4 (Calculation):**
  *   *Beef:* 1 cow per 500 patties. EHU = High.
  *   *Insect:* 5,000 crickets per 500 patties. EHU = $5000 \times 0.01 \times Intensity \times Duration$.
  *   *Result:* Even with low weight, the sheer number makes the EHU comparable to Beef.
  **Step 6 (Value Hand-Off):**
  *   The math is close (within margin).
  *   *Conflict:* Trading 1 known high-sentience life for 5,000 uncertain low-sentience lives.
  *   **Verdict:** **REFER TO COMMITTEE VOTE.**
  **Reasoning:** The procedure cannot resolve the moral weight of uncertain sentience. The procurement officer records: "Quantitative analysis indeterminate. Decision rests on whether the committee applies the Precautionary Principle to invertebrates."

  ---

  ## Part 3: Limitations & Constitutional Inabilities

  **1. What This Procedure Cannot Settle**
  *   **Lexical Priorities:** It cannot decide if one cow's death is worse than 1,000 mice deaths. It calculates aggregates. If the committee believes rights trump aggregates, the procedure must yield to a vote (Step 6).
  *   **Existence vs. Non-Existence:** The procedure counts "life days" as potential suffering. It cannot resolve the "Non-Identity Problem" (i.e., is it better for the animal never to have been born?). It defaults to "Existing animals matter most."
  *   **Long-Term Market Signals:** It measures immediate contract impact. It cannot predict if buying high-welfare beef *now* stimulates the market to produce more high-welfare beef *later*.

  **2. Sensitive Inputs (Where Wrong Data Reverses Results)**
  *   **Field Death Rates:** If the default assumption of "5 animals/hectare" is wrong by a factor of 10, Case 2 (Beef) flips to Plants.
  *   **Sentience Weights:** If insect sentience is upgraded from 0.01 to 0.1, Case 3 (Insects) becomes a clear "Reject."
  *   **Counterfactual Land Use:** If the upland pasture (Case 2) would actually be *rewilded* (high wildlife) rather than *forested* (low wildlife) without the beef contract, the Beef verdict flips to Plants.

  **3. Where Voting is Mandatory**
  *   **The "Indistinguishable" Zone:** When EHU ranges overlap, the procedure says "No Change." A committee member may argue "Potential benefit justifies cost." This requires a vote to override the protocol.
  *   **The Sentience Threshold:** Setting the insect weight (0.01) is a moral choice, not a fact. This must be ratified by the committee annually, not the procurement officer.

  **4. Operational Warning**
  This procedure is designed to **prevent** changes as often as it enables them. Its bias is toward the status quo when data is uncertain. This protects against unintended harm but may frustrate members seeking proactive moral leadership. If the committee wishes to be "risk-seeking" for animal welfare, Step 5 (Indistinguishability) must be amended to "Choose the option with the lower *median* EHU, even if ranges overlap."
