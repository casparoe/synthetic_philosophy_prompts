  The real snag is that if you let subpersonal routines do the driving, you can't pinpoint where her agency ends and mere biology begins, which makes her responsible for movements she never consciously chose.

  Usually, we say an action is intentional if it's powered by a specific belief and desire happening right now—like, "I want coffee" and "I believe turning left gets me there." But in your scene, her conscious mind is stuck in Denver arguing with her sister while her hands keep working the wheel. If we say that's still her acting, then "acting" doesn't actually need a conscious actor, it just needs a functioning body. But if we say it's *not* her acting because she wasn't thinking about it, then she's just a passenger in her own skin for those three hours. That breaks the link between who she is and what she does. It turns the conscious self into a narrator watching a movie of a robot body, which makes it hard to say she's truly in control of anything, even when she thinks she is.
