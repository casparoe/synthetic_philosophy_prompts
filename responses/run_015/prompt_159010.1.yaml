answer: |-
  This is a sophisticated pedagogical and historiographical problem. You have already identified the crucial fault lines: the epistemic/motivational bundle and the functional ambiguity of blame. Your intuition about the asymmetry between the living and the dead is the key that unlocks the diagnosis.

  Here is a diagnosis of the stalemate and a proposal for what constitutes progress in this specific seminar context.

  ### The Diagnosis: Two Questions Under One Heading

  The disagreement is not merely verbal, nor is it purely empirical. It is primarily **two distinct normative questions masquerading as one**, sustained by a **clash of bedrock intuitions** about moral community membership.

  **1. The Conflation: Assessment vs. Sanction**
  The class is conflating *moral assessment* (was the act wrong?) with *moral sanction* (is the agent culpable/blameworthy?).
  *   **Side A (Universalists)** is focused on **Assessment**. They argue that moral truths are trans-temporal. Slavery was wrong then, it is wrong now. To deny this is to surrender moral realism.
  *   **Side B (Contextualists)** is focused on **Sanction**. They argue that blame is a social practice predicated on the capacity to respond to reasons. If the agent could not have accessed the reasons (epistemic) or could not have acted on them (motivational/social cost), sanction is inappropriate.

  The stalemate occurs because Side A hears Side B saying "Slavery wasn't wrong then," while Side B hears Side A saying "Jefferson should have been able to magically transcend his ontology." They are answering different questions. One is asking about the *status of the act*; the other is asking about the *liability of the agent*.

  **2. The Bedrock Intuition: Moral Community Membership**
  Underlying the conflation is a bedrock disagreement about who belongs to *our* moral community.
  *   **Side A** intuits that the moral community is **universal and trans-temporal**. We share a moral universe with Jefferson; therefore, he is subject to our judgments just as we hope future generations will judge us.
  *   **Side B** intuits that the moral community is **local and temporal**. Moral obligations are generated by the normative structures available to the agent. To judge Jefferson by our standards is to treat him as a member of *our* community, which he was not.

  **3. The Distraction: The Empirical Question**
  You hypothesized that the "counterfactual robustness" is a suppressed empirical question. It is, but it is a **red herring** that sustains the stalemate.
  History cannot definitively answer: *"Would Jefferson have freed his slaves if presented with a better argument?"* We can speculate, but we cannot prove. By focusing on this, the seminar gets bogged down in speculative psychology rather than structural judgment. The empirical question feels like it *should* solve the moral problem, but it rarely does, because Side A will always find a contemporary critic (proving epistemic access) and Side B will always point to the social cost of dissent (proving motivational constraint).

  ### The Asymmetry: Why the Living are Different

  Your observation about the asymmetry (withholding the defense from living people) is the diagnostic lever.

  We blame living people raised in toxic norms because blame is **forward-looking**. It serves to:
  1.  Deter future wrongdoing.
  2.  Reform the agent.
  3.  Signal current normative boundaries to the community.

  We hesitate to blame the dead because they are **causally inert**. They cannot be reformed or deterred. Therefore, blaming the dead is purely **backward-looking** (retributive) or **expressive** (signaling to the *living* what we value).

  The class stalemate exists because Side A is treating historical judgment as **Expressive** (we condemn Jefferson to tell *ourselves* slavery is wrong), while Side B is treating it as **Retributive** (we condemn Jefferson to punish *him*, which is unfair).

  ### What Counts as Progress?

  Given this diagnosis, a "verdict" on Jefferson is impossible and undesirable. Progress in the seminar should look like **disaggregation** and **functional clarity**. Here are three specific moves to break the deadlock:

  **1. Distinguish "Wrong" from "Culpable" (The Distinction)**
  Force the seminar to vote on two separate questions for each figure:
  *   *Q1: Was the action morally wrong by standards that existed (somewhere) at the time?* (This usually gets consensus).
  *   *Q2: Is the agent individually culpable enough to warrant 'condemnation' rather than 'critique'?*
  This separates the Universalist victory (slavery is always wrong) from the Contextualist victory (Jefferson's culpability is mitigated by structural coercion). It allows both sides to be right without contradicting each other.

  **2. Shift from Epistemology to Political Economy (The Historical Work)**
  Your hypothesis about the "motivational claim" is the most fertile ground for historical work. Move the seminar away from *"Could they know better?"* (Epistemology) to *"What would it have cost them to act better?"* (Political Economy).
  *   Instead of asking if Jefferson read abolitionist pamphlets, ask: *What specific social, economic, and political capital would Jefferson have expended to manumit his slaves?*
  *   This transforms the debate from a metaphysical puzzle about moral truth into a historical analysis of **structural sin**. It validates Side B's intuition about structural constraint without validating Side A's fear of moral relativism. It acknowledges that one can do wrong without being a "monster," which is a crucial category for intellectual history.

  **3. Reframe the Purpose of the Seminar (The Change of Question)**
  Explicitly address the asymmetry. Ask the class: *"Since Jefferson cannot hear us, who is this judgment for?"*
  *   If the judgment is for **us** (the living), then the "man of his time" defense is irrelevant. We are curating our own values, not trying to reform the dead.
  *   If the judgment is for **history** (accurate accounting), then we must account for the causal constraints on the agent.
  *   **Progress** is achieved when the class realizes they are arguing about the *function of history*, not the *morality of slavery*. Are we writing history to judge souls, or to understand how moral change happens?

  ### Expectation of Resolution

  Do not expect the bedrock intuition clash (Universalism vs. Communitarianism) to resolve. It is a philosophical perennial. However, you can expect to move the seminar from **impasse** to **nuance**.

  If you can get the class to agree that:
  1.  Moral truths may be universal (Side A wins).
  2.  But moral *agency* is historically constrained (Side B wins).
  3.  And therefore, historical judgment is less about *sentencing* the dead and more about *understanding the friction* between moral truth and historical practice...

  ...then you have achieved progress. You have moved them from a binary of "Cancel vs. Excuse" to a spectrum of "Evaluation."

  **Recommendation:** Next semester, introduce the "Living/Dead Asymmetry" in week one. Make it the central methodological problem of the course. Ask them: *"If we wouldn't accept this defense for a living colleague, why do we accept it for Jefferson? Is it because he's dead, or because he's white, or because he's famous?"* That question alone will disrupt the script they are both reading from.
