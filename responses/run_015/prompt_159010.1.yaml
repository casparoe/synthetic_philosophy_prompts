          2.  *Contextualism:* Blame requires reasonable expectation to know better; outlook is product of upbringing; condemnation is self-congratulation.
      *   **User's Hypothesis:** The "man of his time" defense bundles an *epistemic* claim (what evidence was available) and a *motivational* claim (would evidence have changed behavior vs. interests/attachments). Also notes a *functional* ambiguity (blame as verdict on person vs. decision on institutional honor).
      *   **The Asymmetry:** We don't give this defense to *living* people raised under rejected norms, even if their epistemic situation is structurally similar.
      *   **The Ask:** A diagnosis of the disagreement (verbal, bedrock intuitions, hidden empirical, or two questions?). And, given the diagnosis, what would count as progress (distinction, historical work, change of question, or none expected?).
