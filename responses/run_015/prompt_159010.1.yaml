      *Decision:* I will argue it is primarily **two questions under one heading** (Assessment vs. Sanction/Function), exacerbated by a **bedrock intuition clash** regarding moral community membership. The empirical question is secondary but useful for moving the needle.

  9.  **Finalizing the Output Structure:**
