answer: |-
  Your suspicion is mathematically well-founded. Your character is conflating a **representation failure** with a **formal contradiction**. However, her confusion touches on a deep and legitimate philosophical debate in decision theory, which you can leverage to make her sound brilliant rather than mistaken.

  Here is the precise breakdown of the logic, the paradox, and how to calibrate your character's argument.

  ### 1. Does Allais generate a logical contradiction *within* Expected Utility Theory (EUT)?
  **No.**
  Von Neumann-Morgenstern (vNM) Expected Utility Theory is a **representation theorem**. It states:
  > *If* a preference relation satisfies four axioms (Completeness, Transitivity, Continuity, and Independence), *then* there exists a utility function that represents those preferences as maximizing expected utility.

  The Allais Paradox demonstrates that human preferences often satisfy the first three axioms but **violate the Independence Axiom**.
  *   **Formal Status:** This does not break the math of EUT. It simply means those specific preferences **cannot be represented** by the theory.
  *   **Analogy:** Finding a triangle on the surface of a sphere whose angles sum to 200° does not prove Euclidean geometry is self-contradictory; it proves Euclidean geometry does not apply to spheres. Similarly, Allais preferences prove EUT does not apply to certain human psychologies.

  If your character claims EUT is "self-contradictory" (i.e., that the axioms imply $P$ and $\neg P$), she is technically incorrect. The contradiction arises only when you add the premise: *"Humans actually hold these Allais preferences."*

  ### 2. The "Redescription" Argument (Where she has a point)
  Your character argues that the principle is violated "merely by redescribing the outcomes." This is the strongest part of her reasoning, referencing the **Individuation of Outcomes** problem.

  In the Allais Paradox, people prefer a guaranteed \$1M over a gamble, but prefer a higher-probability gamble for \$5M over a lower-probability one, even when the math implies they should treat the "common consequence" identically.
  *   **Standard Resolution:** Decision theorists often "save" the Independence Axiom by arguing the outcomes were described poorly. If we redefine the outcome "\$1M" as "\$1M *plus the feeling of certainty*," then the utility changes, and Independence holds.
  *   **Your Character's Critique:** She is arguing that if the validity of a logical law (Independence) depends on how we linguistically carve up the world (whether we include "feelings" in the outcome definition), then it is not a law of **logic**; it is a law of **semantics**.

  **Verdict:** She is philosophically justified in claiming that if an axiom requires specific outcome individuation to hold, it lacks the universality of true logical laws (like Transitivity). Transitivity holds regardless of how you describe the options; Independence does not.

  ### 3. Normative Authority vs. Psychological Scope
  You asked if the departure undermines the **normative authority** or merely the **psychological scope**.

  *   **Psychological Scope:** It is universally accepted that Allais limits the psychological scope. Humans are not EUT maximizers.
  *   **Normative Authority:** This is debated.
      *   **The "Money Pump" Argument:** If you violate Independence, you can be exploited (pumped for money) in a cycle of trades. This suggests violating it is *irrational*.
      *   **The "Regret" Counter-Argument:** Philosophers like Edward McClennen or Lara Buchak argue that caring about the *structure* of risk (e.g., certainty) is a rational value, not a cognitive error. If so, the Independence Axiom is **normatively too strict**, not just psychologically inaccurate.

  **Your Character's Stance:** She treats Independence as a law of logical consistency. This is the **Strong Normative** view. Most modern decision theorists reject this, viewing it as a coherence constraint rather than a logical truth. However, for a logician character, holding the Strong Normative view is consistent with her archetype.

  ### 4. How to Write Her (Calibrating the Dialogue)
  To make her sound like a rigorous logician rather than someone who failed Decision Theory 101, you should tweak her justification. She shouldn't claim EUT is mathematically broken; she should claim the **ontology of the lottery** is logically unstable.

  **Incorrect (Mathematically vulnerable):**
  > "The Allais paradox proves Expected Utility Theory is self-contradictory. It says $A > B$ and $B > A$ simultaneously."
  *(Critics will say: No, it proves preferences violate the axioms, not that the axioms contradict themselves.)*

  **Correct (Philosophically robust):**
  > "The Independence Axiom claims to be a law of consistency, yet it only holds if we individuate outcomes in a specific way. If I describe the prize as 'money,' you violate the axiom. If I describe it as 'money plus security,' you satisfy it. A true law of logic cannot depend on semantic framing. Therefore, the problem isn't the preference; it's the representation. I refuse to engage with problems that rely on an unstable ontology of outcomes."

  ### 5. Summary for Your Notes
  *   **Does Allais contradict EUT?** No. It contradicts the claim that *humans* satisfy EUT.
  *   **Does it contradict Independence?** Yes, but only if you assume the outcomes are strictly monetary. If you allow "psychological outcomes," Independence is saved but becomes tautological.
  *   **Character's Error:** She claims the *system* is contradictory.
  *   **Character's Insight:** She correctly identifies that the axiom's dependence on outcome description undermines its claim to be "pure logic."
  *   **Recommendation:** Have her reject the **framing of the problem**, not the math of the theory. She refuses to evaluate lotteries where the "common consequence" is ambiguous because she views the *description* as logically incomplete. This makes her a "logical purist" rather than a "mathematical error."

  This distinction allows you to keep her intense, principled stance while insulating your novel from criticism by readers who know decision theory. She isn't wrong about the *implications*; she is just radical about the *solution*.
