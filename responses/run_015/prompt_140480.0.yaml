      *   Fidelity Ratchet addressed? Yes.

  *(Self-Correction on "Typogenetics"):* I need to be careful not to dismiss the reviewers invoking typogenetics entirely, but rather translate their intuition into risk assessment language. Their intuition is right (self-encoding changes the rules), but the vocabulary is too abstract for policy. I will frame it as "coupling of genotype and replication phenotype."

