answer: |-
  You are not making it up as you go. In fact, your voting behavior is more philosophically consistent than that of most people who claim to vote based on a single rigid rule (like "always vote" or "never vote").

  You are operating on a hybrid model that political scientists and philosophers would recognize as a blend of **Instrumental Rationality** and **Expressive Civic Duty**, filtered through a **Cost-Benefit Analysis**.

  Here is the principle that captures your verdicts, how it handles your dilemma, and what it predicts for the unmentioned case.

  ### The Principle: "Threshold Pragmatism with a Civic Premium"

  Your decision matrix relies on four variables:
  1.  **Efficacy ($P$):** The probability your vote changes the outcome.
  2.  **Preference Intensity ($B$):** How much you care about the difference between the candidates/outcomes.
  3.  **Cost ($C$):** The hassle, time, and effort required.
  4.  **Civic Premium ($D$):** A bonus value assigned only to high-profile national elections (Presidential) representing a duty to participate in the collective ritual, regardless of efficacy.

  **Your Rule:**
  You vote if **$(P \times B) + D > C$**, *with the constraint that $B$ must be greater than zero.*

  Let's test this against your existing verdicts:

  *   **Local School Board:** High $P$, Moderate $B$, Low $C$. **Vote.** (The math works).
  *   **Close Presidential:** High $P$, High $B$, Moderate $C$. **Vote.** (The math works).
  *   **Safe State Legislature:** Low $P$, Moderate $B$, Low $C$. **Skip.** ($P$ is too low to overcome $C$, and no Civic Premium applies).
  *   **Close Race / High Hassle:** High $P$, Moderate $B$, High $C$. **Skip.** (Cost outweighs the benefit).
  *   **Foregone Presidential:** Low $P$, High $B$, Moderate $C$. **Vote.** (Here, the **Civic Premium ($D$)** is the deciding factor. You pay the cost for the duty/ritual, not the impact).
  *   **Election You Don't Care About:** Moderate $P$, **Zero $B$**, Low $C$. **Skip.** (Because $B=0$, the equation fails, and you feel no Civic Premium for races you don't care about).

  ### The Dilemma: The Close Race with Indifferent Candidates

  **The Case:** A close race (High $P$), but you like the candidates equally (Zero $B$). Cost is low.
  **The Conflict:** Your vote could tip it (Instrumental value), but you have no preference on the outcome (No Utility value).

  **The Consistent Verdict: Skip.**
  To remain consistent with your behavior in "Elections You Don't Care About," you must treat **Preference Intensity ($B$)** as a mandatory switch. If $B$ is zero, the instrumental value of the vote ($P \times B$) is zero.

  Since this is not a Presidential race, you do not get the **Civic Premium ($D$)**. Therefore, you are expending energy ($C$) for zero return.

  *   **Why it feels tricky:** It feels wasteful to "waste" a pivotal vote. However, casting a random vote in a tie-breaker is functionally identical to flipping a coin to decide the election for everyone else. Unless you believe *participation itself* has value independent of the outcome (which you denied in the "don't care" case), consistency demands you skip this one.

  ### The Unmentioned Case: The Close Referendum

  **The Case:** A close referendum on something you care a lot about (High $B$), but you are pretty sure your vote won't break the tie (Low $P$).
  **The Prediction: Skip.**

  Here is why this is the logically consistent outcome based on your history:

  1.  **Compare to Safe State Legislature:** In safe state races, you presumably care about the outcome (otherwise why mention them?), but you skip because the seat is safe (Low $P$). There is no Civic Premium for state legislature races.
  2.  **Compare to Foregone Presidential:** You vote in foregone presidential elections despite Low $P$ and High $B$. Why? Because of the **Civic Premium ($D$)**.
  3.  **The Referendum:** A referendum lacks the **Civic Premium** of a Presidential election (it's not the "national ritual"). Therefore, it falls into the same bucket as the State Legislature race. Even though you care deeply ($B$ is high), if your subjective assessment of Efficacy ($P$) is low ("pretty sure my vote won't be the one"), the equation $(P \times B) > C$ likely fails, just as it does for the safe state seat.

  ### Summary of Your Political Philosophy

  You are not a "Civic Dutier" (who votes in everything), nor are you a "Rational Chooser" (who only votes when $P \times B > C$).

  You are a **Pragmatic Expressivist**.
  *   You vote to **effect change** when the math says your voice will be heard (Local/Close).
  *   You vote to **express membership** in the national polity when the stakes are highest (Presidential), even if your voice is drowned out.
  *   You abstain when **cost is too high**, when **preferences are null**, or when the **office lacks prestige** and the race is uncompetitive.

  **The Verdict:**
  To maintain coherence:
  1.  **Skip the Indifferent Close Race.** (Preference is a required multiplier).
  2.  **Skip the Referendum.** (Without the Presidential "Duty Bonus," low efficacy trumps high preference).

  If you find yourself unwilling to skip the Referendum because you care *so much*, you have to admit that your "Safe State Legislature" verdict is the outlier. You would then need to upgrade your principle to: *"I vote whenever I care deeply, regardless of efficacy, unless the cost is prohibitive."* But that would require you to start voting in those safe state races, too.
