      *   **Cost (C):** Effort, time, hassle to vote.
      *   **Duty (D):** A fixed moral/civic obligation independent of outcome.

  3.  **Test Existing Voting Theories:**

      *   **Rational Choice Theory (Downsian Model):** $R = (P \times B) - C$.
          *   If $R > 0$, vote.
          *   *Fit:* Explains Cases 1, 2, 3, 4, 6.
          *   *Mismatch:* Fails Case 5 (Foregone Presidential). In a foregone conclusion, $P \approx 0$, so $R$ should be negative (since $C > 0$). But the user votes due to "duty."
          *   *Mismatch:* Case 7 (Indifferent Close Race). $P$ is high, but $B \approx 0$. So $P \times B \approx 0$. If $C > 0$, Rational Choice says *don't vote*. But the user is conflicted.

      *   **Civic Duty Model:** Vote if $D > C$.
          *   *Fit:* Explains Case 5.
          *   *Mismatch:* Fails Cases 3, 4, 6. If Duty were the only driver, the user would vote in safe state races and elections they don't care about (unless Cost is too high). The user admits skipping races they "don't care about" without guilt, suggesting Duty isn't absolute.

      *   **Expressive Voting:** Voting to express identity/values.
          *   *Fit:* Might explain Case 5 (expressing patriotism/duty).
          *   *Mismatch:* Doesn't fully explain the selectivity based on efficacy (Cases 1 & 2).

  4.  **Synthesize a Hybrid Principle:**

      The user isn't purely rational (cost-benefit) and isn't purely deontological (duty-bound). They are a **Conditional Civic Pragmatist**.

      *   *Principle:* "I vote when the expected impact is high OR when the civic duty is triggered by high-stakes national identity, provided the cost isn't prohibitive and I have a preference."
