  **Task:** Move 6 tokens from "burrow" to "nest" in 25 mins.
  **Hidden Mechanics:** Min 8: Move one container, remove another. Min 15: Shift nest location. FP will loop futilely; R will adapt but lose time coordinating.

  **Timeline**
  0-10: Group division, rule distribution (secretly), setup.
  10-35: Task execution. Facilitator enforces shifts silently.
  35-50: Initial reaction sharing (no theory yet).
  50-80: Conceptual mapping and limits.

  **Predictable Failures**
  **FP Breaking Character:** They feel silly. *Fix:* Facilitator acts as strict system admin; restart penalties enforced calmly.
  **R Monopolizing:** They talk too much. *Fix:* Enforce 30s delay strictly; time runs out.
  **Joking:** Undermines tension. *Fix:* Reframe as "system error" not comedy.
  **Goal:** Maintain friction. If FP succeed too easily, add obstacles. If R coordinate perfectly, increase revision cost.

  **Debrief Mapping**
  1. **Frustration:** Map FP loop-frustration onto mechanical rigidity (Sphexishness).
  2. **Burden:** Map writing/announcing burden onto the cost of flexibility (cognitive load/time).
  3. **Coordination:** Map failure onto the idea that free will requires shared normative structures, not just individual choice.
  4. **Connection:** Rigidity ensures order but fails under change; flexibility allows survival but risks chaos. Free will depends on the capacity for self-revision, not just determinism. Without revision, agents are slaves to environment; with it, they are authors, but burdened by responsibility. The group failure shows that individual revision without shared norms leads to chaos, mirroring the need for rational self-governance.

  **Honest Limits**
  Activity cannot reproduce first-person authorship ("up-to-me-ness"). It shows structural conditions, not phenomenology. Students acted out roles; they did not necessarily feel genuine agency. Facilitator must supply this via discussion questions about internal experience during the loops ("Did you feel compelled?" vs "Did you choose?"). This bridges the gap between behavioral observation and metaphysical claim. The simulation demonstrates the *conditions* for freedom, not the *feeling* of it. We must ask: Did the FP agents feel unfree? Did the R agents feel free, or just burdened? This subjective layer is the missing piece the discussion must add.
