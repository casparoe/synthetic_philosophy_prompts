  1. **A:** Sam wasn't just sidelined; he was undermined specifically in his capacity as a knower, which is a distinct harm from merely losing status.
     **B:** Being undermined as a knower is exactly what low status looks like in a meeting, so calling it epistemic adds nothing to the explanation of power.

  2. **A:** It matters because status fluctuations don't always track credibility deficits; you can be high-status and still be epistemically objectified, so the mechanisms aren't identical.
     **B:** If the mechanism isn't identical but the solution is—redistribute power and voice—then positing a separate ethical category is just theoretical hoarding.

  3. **B:** Tell me how Sam should have acted, because when marginalized speakers bring extra data to preempt doubt, that preparation itself gets read as having an agenda.
     **A:** That bind confirms the injustice is in the hearing, not the speaking, which is why structural changes to credibility assessment are required rather than coaching the victim.

  4. **A:** Take credibility escrow, where claims are assessed anonymously; it bypasses the bias and validates the knowledge independently of the speaker's status.
     **B:** But if you have to hide Sam's identity to get his knowledge accepted, you've secured the outcome while denying him the recognition of being believed as himself.

  5. **A:** Recognition follows corrected judgment; once the hearer's prejudice is broken by anonymous success, future non-anonymous claims gain the traction they were originally owed.
     **B:** That assumes prejudice is a habit you can break with data, but if power relies on maintaining who counts as a knower, anonymity just lets the powerful off the hook.
