answer: |-
  This is a sharp synthesis. You've correctly identified the tension between a sociological explanation of moral change (Appiah/Williams) and the intuition that moral progress requires epistemic grounding (not just fashion).

  However, there is a logical bind in your final constraint. You state: **"(7) That proves too much"** (implying (7) is false/unacceptable), but then say: **"I'd rather keep (1)-(3) and (6) than ditch (5)."**

  If you keep (5) ("no learning happens"), and you keep (6) ("if no learning, then truth is fashion"), you logically entail (7) ("any norm change = progress"). If (7) is unacceptable, you *cannot* keep (5).

  To save the Appiah/Williams insight without collapsing into moral relativism, **you must ditch (5).** The good news is that ditching (5) does not require you to betray (1)-(3). The break is in your definition of "learning."

  Here is where the argument breaks and how to fix it.

  ### 1. The Break is at (5): The False Dichotomy of Learning
  Premise (5) claims: *So the "revolution" was really just a peer-pressure update, not anyone learning anything.*

  This assumes a narrow, hyper-rationalist definition of "learning": that learning only occurs when an individual processes a syllogism and consciously updates a belief. Appiah and Williams actually argue for a **social epistemology**.

  *   **Shame is Cognitive:** For Williams, a "loss of face" isn't just hurt feelings. It is the visceral recognition that your self-conception no longer maps onto social reality. When a slaveholder feels shame, he is learning that his identity as a "gentleman" is incompatible with his identity as a "slaveholder." That *is* moral learning, just mediated through emotion and status rather than logic.
  *   **Honor is Information:** For Appiah, honor codes are technologies for transmitting value. When the code flips, it's not arbitrary noise; it's the system processing new data (e.g., the brutality of slavery becoming visible).

  **The Fix:** Reject (5). The revolution was a peer-pressure update, **and therefore** people learned something. The peer pressure *was* the vehicle of the lesson.

  ### 2. Saving (1)-(3) Without Accepting (7)
  You want to keep the mechanism (status flipping) but avoid the conclusion that morality is just fashion. You can do this by distinguishing **Arbitrary Conventions** from **Normative Evolution**.

  *   **Fashion (Arbitrary):** Stripes replace polka dots. There is no "better" or "worse," just "new."
  *   **Morality (Tracking):** Slavery replaces freedom. This shift tracks something real (suffering, agency, harm).

  Appiah and Williams do not claim the *content* of the honor code is arbitrary. They claim the *mechanism of change* is social, not philosophical.
  *   **Argument:** The *reason* the status flipped wasn't random. It flipped because narratives (Uncle Tom's Cabin), revolts, and economic shifts made the *cost* of maintaining the old honor code too high.
  *   **Learning:** The "learning" wasn't "I have been logically defeated." The learning was "I can no longer sustain this practice without losing my standing as a good person."

  So, (1)-(3) remain true: Rational argument didn't kill slavery; social stigma did. But (7) remains false: Not *any* norm change counts as progress, only those where the stigma tracks a genuine expansion of moral concern (e.g., reducing suffering).

  ### 3. Re-evaluating (6)
  Premise (6) says: *But if no learning happens, then saying "slavery is wrong" went from false... to true... without any reasoning connecting them.*

  If you reject (5) (as you must to avoid (7)), the antecedent of (6) is false. "No learning happens" is false. Therefore, (6) doesn't trigger the relativist conclusion.

  You can rephrase (6) to fit the Appiah/Williams model:
  *   **Revised (6):** "Because social learning *did* happen (via shame/stigma), saying 'slavery is wrong' went from socially unintelligible to socially mandated via a causal chain of reputational costs."

  This preserves the idea that truth isn't *just* fashion, because the "reputational costs" were driven by real-world friction (slave revolts, economic inefficiency, religious awakening), not just a whim.

  ### 4. Why You Must Ditch (5)
  If you insist on keeping (5) ("no learning happened"), you are forced into **Moral Error Theory** or **Radical Relativism**.
  *   If slaveholders didn't learn anything, and we didn't learn anything, then we just have Power A (Slaveholders) vs. Power B (Abolitionists).
  *   If Power B won, it's just might-makes-right.
  *   If you think "Slavery is wrong" is *actually true* (not just "true for us now"), then someone, somewhere, had to latch onto that truth.
  *   Appiah and Williams allow that the *group* latched onto it via social signaling, even if no *individual* latched onto it via argument.

  ### Summary of the Repair
  To keep your preferred Appiah/Williams synthesis without "proving too much":

  1.  **Keep (1)-(3):** Moral change is driven by honor/shame mechanics, not winning debates.
  2.  **Ditch (5):** Deny that this means "no learning." Social calibration *is* a form of learning.
  3.  **Modify (6):** Acknowledge that reasoning *did* connect the states, but the reasoning was embedded in social practices, not just heads.
  4.  **Avoid (7):** Distinguish between status flips that track harm/justice (moral progress) and those that don't (fashion). Appiah implies this by noting honor codes usually regulate *cooperation* and *harm*.

  **The Verdict:** The argument breaks at **(5)**. It conflates "lack of philosophical argument" with "lack of epistemic progress." Once you view shame as a form of social knowledge, you can keep Appiah and Williams without admitting morality is just fashion.
