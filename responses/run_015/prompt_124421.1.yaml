answer: |-
  **Title:** The Hollow Anchor: Why a Thin Descriptive Core Cannot Save Expressivism from Frege-Geach

  **Introduction**
  It is easy to see why you feel stuck. In introductory metaethics, the Frege-Geach problem is often presented like a magic trick: *Poof*, expressivism disappears because it can't explain conditionals. The standard example—"If lying is wrong, then getting your little brother to lie is wrong"—is repeated until it loses its sting. But your intuition is correct: the real philosophical weight isn't about lying; it's about the architecture of logical validity. You are asking whether expressivism can survive if we grant moral predicates a "thin descriptive core" that is sensitive to conversational context. This is a sophisticated move, blending hybrid expressivism with contextualism. It attempts to give moral language enough descriptive "grip" to embed in logic, without surrendering the expressivist insight that morality is fundamentally about attitude.

  However, despite the ingenuity of this hybrid-contextualist proposal, I argue that the Frege-Geach objection still bites. In fact, it bites harder. By introducing a context-sensitive descriptive core, you do not solve the embedding problem; you merely displace it into a problem of equivocation. To save logical validity, the content of moral terms must remain stable across embedded and unembedded contexts. If the descriptive core shifts with context, validity collapses. If it remains stable to preserve validity, the "expressivist" addition becomes redundant, and the theory collapses into a form of cognitivism. There is no stable middle ground.

  **The Logic of the Objection**
  To understand why the "thin core" strategy fails, we must first be precise about what Frege and Geach were actually demanding. It is not merely that moral sentences look grammatically like descriptions. It is that moral *reasoning* works like descriptive reasoning. Consider Modus Ponens:
  1. If $X$ is wrong, then $Y$ is wrong.
  2. $X$ is wrong.
  3. Therefore, $Y$ is wrong.

  For this argument to be valid, the term "wrong" must carry the same semantic content in the antecedent of premise (1), the assertion of premise (2), and the conclusion (3). Classic expressivism (Ayer, Stevenson) struggles here because it claims "wrong" expresses an attitude (e.g., "Boo!") in premise (2) but expresses nothing in the antecedent of premise (1). You cannot logically derive an attitude from a conditional that contains no attitude.

  **The Hybrid-Contextualist Proposal**
  Your proposed solution attempts to bridge this gap. It suggests that "wrong" does two things: it expresses a conative attitude (disapproval) *and* it picks out a minimal descriptive property (e.g., "violates the relevant social norm $N$"). Crucially, you suggest this descriptive property is context-sensitive. In a religious context, $N$ might be divine law; in a secular context, $N$ might be harm prevention.

  The hope is that the descriptive core provides the truth-conditions needed for logic (solving Frege-Geach), while the attitudinal component preserves the expressivist insight that morality is action-guiding. The "placeholder" nature of the norm allows the theory to be flexible without committing to robust moral realism.

  **The Equivocation Objection**
  The fatal flaw in this strategy lies in the very feature meant to make it flexible: context-sensitivity. Logical validity requires *univocality*. If the meaning of a term shifts between premises, the argument commits the fallacy of equivocation.

  Imagine a moral argument that spans two different conversational contexts.
  1. If stealing is wrong (in Context A, where norm = property rights), then resisting arrest is wrong.
  2. Stealing is wrong (in Context B, where norm = survival necessity).
  3. Therefore, resisting arrest is wrong.

  If the descriptive core of "wrong" is determined by the local conversational context, the "wrong" in premise (1) refers to a violation of property rights, while the "wrong" in premise (2) might refer to a violation of survival norms. The logic breaks. The Frege-Geach problem is not solved; it is exacerbated. We now need to explain how moral arguments remain valid even when the conversational context shifts (which they often do in complex ethical debates).

  To avoid this, the hybrid expressivist must claim that the descriptive core is *stable* across contexts. They must argue that there is a single, minimal descriptive property (e.g., "fails to maximize utility" or "violates rational agency") that "wrong" always picks out, regardless of the conversation. But if they do this, they have surrendered the contextualist move. They have posited a robust, context-invariant descriptive property. At that point, the "attitude" component is doing no logical work. The logic is being carried entirely by the descriptive core.

  **The Collapse into Cognitivism**
  This leads to the second horn of the dilemma: redundancy. If the descriptive core is stable enough to secure logical validity (preventing equivocation), why maintain the expressivist label?

  The primary motivation for expressivism is to explain the *normative force* of morality without positing "queer" moral facts. But if you anchor "wrong" to a descriptive condition sufficient to handle embedding and logic, you have effectively posited a moral fact. The sentence "Lying is wrong" becomes true if and only if lying meets descriptive condition $D$. The "Boo!" attitude becomes a psychological add-on, not the semantic core.

  This is the trap of hybrid theories. They try to have their cake and eat it too. They want the logical robustness of cognitivism (moral statements have truth conditions) with the metaphysical lightness of expressivism (moral statements are primarily attitudes). But the Frege-Geach problem forces a choice. Logic demands stable truth-conditions. If you provide them via a descriptive core, you are a cognitivist. If you refuse to provide them to stay a pure expressivist, you cannot explain logic. A "thin" descriptive core that shifts to save expressivism breaks logic. A "thick" descriptive core that saves logic breaks expressivism.

  **The Deflationary Alternative**
  You mentioned the deflationary move—the idea that "truth" is just a logical device and doesn't require robust content. Quasi-realists like Simon Blackburn take this route. They argue we can *act as if* moral statements have truth conditions without believing they actually do. This is arguably more honest than the hybrid-contextualist view. Blackburn admits the tension and tries to explain logic as a projection of our attitudes onto a logical framework.

  Your hybrid proposal tries to avoid the "quasi" mystery by adding real descriptive content. But as shown above, this content is either too slippery to support logic (due to context-sensitivity) or too solid to support expressivism (collapsing into realism). The deflationary quasi-realist at least admits that the "truth" of moral statements is a fiction we construct to make our attitudes manageable. The hybrid contextualist claims it's real but thin, which is the worst of both worlds: it invites the realist's metaphysical burdens without gaining the realist's logical security.

  **Conclusion**
  So, is this kind of expressivism immune to Frege-Geach? No. The objection still bites, and it bites deep. The Frege-Geach problem is not a puzzle about grammar that can be solved by tacking a descriptive label onto an attitude. It is a structural problem about how normative thought relates to logical inference.

  By introducing a context-sensitive descriptive core, you create a system where moral terms change their meaning depending on where they sit in a conversation. This makes moral reasoning locally coherent but globally fragile. You cannot build a system of ethics on a foundation that shifts every time the conversational context changes. To fix this, you would have to stabilize the core, which turns you into a cognitivist. To keep it unstable, you lose validity.

  Tell your roommate you aren't overthinking it; you're hitting the wall that defines the last fifty years of metaethics. The Frege-Geach problem remains fatal for expressivism *unless* one is willing to become a quasi-realist (and accept the metaphysical gymnastics that entails) or a full-blown realist. A hybrid contextualist middle path is a hollow anchor: it looks like it holds, but when the tide of logical scrutiny comes in, it drags.

  **Verdict:** The objection stands. The hybrid-contextualist move fails to resolve the tension between logical stability and expressive function.
