      *   *Crucial Point:* If Szasz accepts A but rejects B, his objection is *mechanistic*, not *mental*. If he rejects both, his objection is *normative*. The evidence suggests it's a mix: he rejects the *medicalization of behavior* regardless of biology, unless there is a gross lesion.

