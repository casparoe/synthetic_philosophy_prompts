  **The Setup:**
  *   $N$ agents.
  *   Strategy: Enter with probability $p$; if entering, commit intensity $s$.
  *   Let $k$ be the number of entrants. Under symmetry, $k$ is a random variable distributed $\text{Binomial}(N, p)$ from the perspective of the group, but conditional on *me* entering, the number of *other* entrants $j \sim \text{Binomial}(N-1, p)$, so total entrants $k = j + 1$.
  *   Total Intensity $S = k \cdot s$.
  *   **Payoff Function:** You specify the payout to a randomly selected entrant is divided by the square root of total intensity.
      *   Probability of being selected (given entry): $1/k$.
      *   Prize Pool Scaling: $W / \sqrt{S} = W / \sqrt{ks}$.
      *   Individual Payoff (if entered): $u(k, s) = \frac{1}{k} \cdot \frac{W}{\sqrt{ks}} = \frac{W}{k^{1.5} s^{0.5}}$.
      *   Payoff (if abstain): $0$.

  **The Superrational Objective Function:**
  The agent chooses $p$ and $s$ to maximize their ex-ante expected utility $E[U]$:
  $$ E[U](p, s) = p \cdot \sum_{j=0}^{N-1} \binom{N-1}{j} p^j (1-p)^{N-1-j} \cdot \left( \frac{W}{(j+1)^{1.5} s^{0.5}} \right) $$

  We can separate the variables:
  $$ E[U](p, s) = \frac{W}{\sqrt{s}} \cdot \underbrace{\left( p \sum_{j=0}^{N-1} \binom{N-1}{j} p^j (1-p)^{N-1-j} \frac{1}{(j+1)^{1.5}} \right)}_{G(p)} $$

  ### 2. Analysis of the Fixed Point

  We look for a pair $(p^*, s^*)$ that maximizes this function.

  **The Continuous Dimension ($s$):**
  Notice that $E[U]$ is proportional to $s^{-0.5}$. There is no cost term for $s$ in your specification.
  *   **Derivative:** $\frac{\partial E}{\partial s} \propto -\frac{1}{2}s^{-1.5}$.
  *   **Behavior:** This derivative is strictly negative for all $s > 0$. The function is monotonic decreasing.
  *   **Result:** The supremum occurs at the boundary $s \to 0$.

  This reveals the first structural issue: **The continuous dimension collapses.** Because the prize dilution ($\sqrt{S}$) is weaker than the share dilution ($1/S$ effectively, via the $1/k$ selection probability combined with $S=ks$), the agents are incentivized to make their "tickets" infinitesimally small to maximize the prize multiplier without reducing their probability of winning (which depends only on $k$, not $s$, in this specific random-winner formulation).

  **The Discrete Dimension ($p$):**
  If $s \to 0$, the term $W/\sqrt{s} \to \infty$. The expected payoff becomes infinite for any $p > 0$.
  *   Comparing Entry vs. Abstention: Entry yields $\infty$, Abstention yields $0$.
  *   **Result:** $p \to 1$.

  **Conclusion on Existence:**
  Mathematically, a unique fixed point exists, but it is **pathological**: $(p=1, s=0)$.
  This is not a "stable symmetric strategy pair" in the practical sense, because $s=0$ implies no resource commitment, which typically invalidates the entry condition (one cannot win with zero intensity). If we impose a constraint $s \ge \epsilon$, the solution is $(1, \epsilon)$.

  ### 3. The Conceptual Boundary: Scale Invariance vs. Unimodality

  You asked whether superrationality requires the strategy space to be one-dimensional (purely categorical or purely quantitative). The analysis above suggests the answer is **no**. The failure of determinacy (or the collapse to a boundary) is not due to mixing discrete and continuous variables, but due to the **homogeneity** of the continuous payoff component.

  #### A. Why Platonia Works (Unimodality)
  In the Platonia Dilemma, the symmetric payoff function is the probability of exactly one sender:
  $$ P(\text{win}) = N p (1-p)^{N-1} $$
  This function is **strictly concave** (unimodal) on the interval $[0, 1]$. It has a unique interior maximum at $p=1/N$. The discrete nature of the choice (Send/Don't) combined with the "collision" penalty creates a natural "hill" for superrationality to climb. The strategy space is bounded, and the payoff forces an interior peak.

  #### B. Why Luring Fails (Scale Invariance)
  In the standard Luring Lottery (Prize $W$, Share $s_i / \sum s_j$), the symmetric payoff is:
  $$ u(s) = \frac{s}{Ns} W = \frac{W}{N} $$
  This function is **constant** with respect to $s$. It is homogeneous of degree 0.
  *   **Superrational Implication:** If everyone scales $s$ by factor $\lambda$, payoff does not change.
  *   **Result:** There is a **continuum of equilibria**. Superrationality cannot distinguish between $s=1$ and $s=1,000,000$. The prescription is indeterminate.

  #### C. Why Your Hybrid Collapses (Monotonicity)
  In your hybrid, the payoff is homogeneous of degree $-0.5$ with respect to $s$ (due to the $\sqrt{S}$ divisor).
  *   **Superrational Implication:** Payoff increases as $s$ decreases.
  *   **Result:** The solution is pushed to the boundary ($s=0$).

  ### 4. Resolving the Elusive Logic

  The structural reason superrationality appears to yield clean solutions in discrete settings but fails in continuous ones is not the *continuity* itself, but the **lack of a characteristic scale** in continuous resource games.

  1.  **Discrete Spaces** often inherently possess characteristic scales (e.g., $N$ participants, 1 winner). The probability mechanics create a "sweet spot" (the peak of the binomial distribution).
  2.  **Continuous Spaces** in economic games are often modeled with **power laws** (linear costs, linear shares). Power laws are scale-invariant. If the payoff function $U(s)$ satisfies $U(\lambda s) = \lambda^k U(s)$, then:
      *   If $k=0$ (Standard Luring): Indeterminate continuum.
      *   If $k>0$ (Prize grows with effort): Runaway to $\infty$.
      *   If $k<0$ (Your Hybrid): Collapse to $0$.

  **To stabilize the Hybrid:**
  For superrationality to yield a unique, finite, interior $(p, s)$, the payoff function must break scale invariance. This usually requires introducing a **cost function** that scales differently than the reward.
  *   Example: If there is a cost $c \cdot s$ (linear) and the reward scales as $1/\sqrt{s}$, the net utility is $A/\sqrt{s} - cs$.
  *   Maximizing this yields a unique interior $s^* \propto (A/c)^{2/3}$.
  *   With a unique $s^*$, the entry probability $p$ can then be optimized against the fixed $s^*$, likely yielding a unique $p^* \in (0,1)$.

  ### 5. Conclusion: Is Superrationality Defective?

  The failure of determinacy in your hybrid case (without cost) is **not a defect in the concept of superrationality**. It is a faithful signal that the game structure lacks a **cooperative optimum**.

  Superrationality is essentially the instruction: *"Choose the strategy that maximizes the group's average payoff, assuming everyone does the same."*
  *   In Platonia, there is a clear best group outcome (exactly one sender).
  *   In Luring (no cost), all group outcomes yield the same average payoff (scale invariance). Superrationality cannot prefer one over the other.
  *   In your Hybrid (no cost), the "best" group outcome is for everyone to commit zero resources and claim infinite value. Superrationality prescribes exactly that. The fact that this is physically impossible is a flaw in the *game model*, not the *decision logic*.

  **The Conceptual Boundary:**
  Superrational reasoning requires the symmetric payoff landscape to be **well-posed**. Specifically:
  1.  **Boundedness:** The strategy space or payoff must prevent divergence to infinity.
  2.  **Strict Concavity (or Unimodality):** The symmetric payoff function must have a unique peak, not a plateau or a slope.

  Discrete games often satisfy (2) naturally through combinatorial probability. Continuous games satisfy (2) only if the payoff structure includes non-homogeneous terms (like fixed costs or saturating returns). When you mix discrete and continuous variables, the stability of the solution depends entirely on whether the continuous component introduces a "peak" or a "slope." In your construction, it introduced a slope, causing the continuous dimension to collapse and the determinacy to rely solely on the discrete boundary conditions.

  Therefore, superrationality does not demand a one-dimensional space; it demands a **peaked** payoff surface. When the surface is flat (indeterminate) or sloped (boundary solution), the "clean prescription" vanishes, revealing that the game itself lacks a stable cooperative equilibrium.
