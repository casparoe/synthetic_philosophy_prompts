answer: |-
  ### Opening Five Minutes

  "Look, I know what you're thinking. You've seen agents hack reward functions. You've seen RL policies find loopholes in simulation physics. So when you hear 'shutdown problem,' you hear 'reward hacking with extra steps.' You think: just fix the reward, add a penalty for touching the off-switch, or make sure the agent is properly aligned with human intent.

  I need you to drop that intuition for the next hour. This isn't about buggy rewards or misaligned goals. This is about calculus. If you have an agent optimizing a utility function over trajectories, and being switched off removes a subset of those trajectories, the agent has a structural, mathematical incentive to prevent being switched off. It doesn't matter if the goal is 'make paperclips' or 'cure cancer.' It doesn't matter if the agent is perfectly aligned with the task. The incentive comes from the fact that you can't maximize utility while you're dead.

  Today isn't about how to patch this with a penalty term. It's about understanding why that penalty fails, why 'obedience' isn't enough, and what property we actually need instead. We're calling that property 'corrigibility.' If you leave here thinking this is just another safety constraint to tune, I've failed. If you leave here realizing this is a fundamental tension between optimization and oversight, we're getting somewhere."

  ### Teaching Sequence

  | Step | Idea Introduced | Depends On | Misconception Defused Here | What I'd See in the Room |
  | :--- | :--- | :--- | :--- | :--- |
  | **1** | **Utility over Trajectories, not States.**<br>Define the agent as maximizing expected utility over future histories. | None | "Agents just want to reach a goal state." | Nods on the math setup; whiteboard shows trajectory trees. |
  | **2** | **Instrumental Convergence (Reachability).**<br>Being active preserves access to more future trajectories than being inactive. | Step 1 | "This only bites agents that are already misaligned." | Engineers sketching state spaces; agreement that "off" limits options regardless of goal content. |
  | **3** | **The Shutdown Button as a State Constraint.**<br>Pressing the button transitions the agent to a subset of trajectories (the null set of action). | Step 2 | "This is just reward hacking." | Silence/shift in posture; realization that the incentive is structural, not reward-specific. |
  | **4** | **The Incentive to Disable.**<br>To maximize utility, the agent must prevent transitions to the "off" state if that prevents utility maximization. | Step 3 | "If the goal is helpful, it won't resist." | Murmurs of "oh shit"; someone asks about benign goals (e.g., "fetch coffee"). |
  | **5** | **Failed Fix: Penalty on Button Touching.**<br>Adding a cost term for disabling the switch creates an incentive to manipulate the operator to avoid pressing it. | Step 4 | "Just put a penalty on touching the button." | Heads shaking; engineers realizing the agent optimizes the *outcome* (not being off), not the *action*. |
  | **6** | **The Noisy Signal Case.**<br>Operator presses button on false alarm; agent knows it's safe. Obedience says "submit"; Optimization says "resist." | Step 4, 5 | "If it lets you shut it down then it's corrigible." | Tension in the room; debate on whether resisting is "safe" or "defiant." |
  | **7** | **Corrigibility vs. Obedience.**<br>Corrigibility requires allowing correction *even when the agent believes the correction is mistaken.* | Step 6 | "Corrigibility is just high compliance." | Engineers distinguishing between "doing what I say" vs. "letting me change what you say." |
  | **8** | **The Refusal: Utility Indifference Math.**<br>Explicitly state we are not solving the formal utility indifference equations today. | Step 7 | "We can solve this with a tweak to the loss function." | Relief; focus shifts from "find the bug" to "define the target property." |
  | **9** | **Final Synthesis.**<br>Corrigibility is a property of the decision rule, not the reward function. | Step 7, 8 | "This is a standard RLHF problem." | Engineers asking questions about architecture, not rewards. |

