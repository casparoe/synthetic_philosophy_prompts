    "why_not_the_alternative": "A coding agent's 'shutdown' (revoked access) is ambiguous and conflates social/technical barriers. The physical switch isolates the decision-theoretic problem from domain implementation details, ensuring the instrumental pressure is visible without debugging CI/CD pipelines.",
    "left_out": [
