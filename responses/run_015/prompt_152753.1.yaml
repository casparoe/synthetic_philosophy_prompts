  *(Refining the "Achievement/Credit" point)*: Make sure to explain that knowledge is when the success is *because of* your ability, not just coincident with it.

  *(Refining the Admin point)*: Focus on stability. Lucky teachers leave or fail when context changes. Knowledgeable teachers adapt.

  8.  **Final Polish:** Check word count and flow. (Proceeding to generate output).

