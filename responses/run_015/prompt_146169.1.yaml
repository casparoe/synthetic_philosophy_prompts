  This is a sophisticated and largely coherent moral framework. It attempts to synthesize a **conventionalist** account of obligation (commitments 2, 3) with a **fair-play** account of reciprocity (commitment 6), while maintaining a **non-relativist** veto for justice (commitment 7) and a **methodological** commitment to ordinary intuition (commitment 8).

  However, the package contains fractures. The most severe tension lies between your general principle of Fair Play and your specific verdict on Jaywalking. A secondary, diagnostic tension exists between your definition of "live practice" and the reality of the Mixed-Norm Bus Stop.

  Here is the audit of your commitments.

  ### 1. Ranked Tensions

  **Severity 1: The Jaywalking Contradiction [(5) vs. (6)]**
  *   **The Conflict:** Commitment (6) states the general principle: if you accept the benefits of a scheme of mutual restraint, you owe compliance. Traffic lights are the paradigmatic scheme of mutual restraint; you benefit from the safety and order they provide even when the street is empty. Therefore, (6) implies you owe compliance even then. Commitment (5) states firmly that crossing on an empty street is *not morally wrong at all*.
  *   **Why it is severe:** This is not a minor edge case; it strikes at the engine of your theory. If (6) is your general principle, (5) must be false (or at best, *pro tanto* wrong but excusable). If (5) is true (as you insist, and as ordinary verdicts demand per (8)), then (6) is overbroad. You cannot hold both without qualification.
  *   **What must give:** You must qualify (6).
  *   **Cost:** You lose the elegance of a simple reciprocity formula. You must introduce a threshold condition regarding the *necessity* of compliance for the scheme's function.

  **Severity 2: The Mixed-Norm Bus Stop [(1) & (2) vs. The Case]**
  *   **The Conflict:** Commitment (2) states reasons exist *only* where the practice is "live and mutually recognised." In your mixed-norm bus stop, the practice is *not* mutually recognised (some queue, some scrum). Therefore, (2) implies no obligation exists. However, Commitment (1) says queue-jumping is a genuine moral wrong *to the people behind you*. If you scramble past a person who is queuing, (1) implies you have wronged them, but (2) implies you had no obligation to them because the practice wasn't "live."
  *   **Why it is severe:** This exposes a flaw in your definition of convention. It suggests (2) is too binary. Obligations often arise from *reasonable expectations* held by specific individuals, even if the general practice is messy.
  *   **What must give:** The "live and mutually recognised" clause in (2) is too strict.
  *   **Cost:** You move from a macro-sociological definition of convention to a micro-interactional one. This complicates the "When-in-Rome" principle (3), as you may owe duties to sub-groups within a culture that contradict the broader cultural norm.

  **Severity 3: Apparent Tension [(2) vs. (7)]**
  *   **The Conflict:** (2) says reasons are *content-independent* (based on coordination). (7) says you are not a relativist and can flout unjust norms. It looks like (7) contradicts (2) by making reasons *content-dependent*.
  *   **Why it dissolves:** This is a standard case of **defeasibility**. (2) explains how the obligation is *generated* (coordination). (7) explains how the obligation can be *overridden* (justice). A content-independent reason can still be outweighed by a content-based moral demand. This pair is consistent provided you view (7) as a veto condition, not a generation condition.

  ### 2. Analysis of the Mixed-Norm Bus Stop

  This case discriminates between the accounts you are attracted to because it forces a choice between **Coordination Value** and **Distributive Profile**, revealing that your current set prioritizes Coordination (2) but your intuitions prioritize Distribution (1).

  *   **The Scrum:** High *Coordination Value* (people get on the bus efficiently), Poor *Distributive Profile* (favours the physically assertive).
  *   **The Queue:** High *Distributive Profile* (fairness based on time), Variable *Coordination Value* (can be slower).

  In the mixed stop, the "practice" is not live (violating 2). However, the *queuers* have formed a local scheme of mutual restraint.
  *   If you follow **(2)** strictly, you owe them nothing because the broader practice is mixed.
  *   If you follow **(1)**, you owe them compliance because they are behind you and have waited.

  **Diagnosis:** Your intuition in (1) tracks the **Distributive Profile** (fairness to the specific individuals behind you). Your theory in (2) tracks the **Coordination Value** (stability of the general norm). In the mixed case, Coordination fails (no single norm), but Distribution remains relevant (the queuers are being treated unfairly by scramblers). Your set currently lacks a mechanism to generate obligations from *local* fairness when *general* coordination fails.

  ### 3. The Single Revision

  To clean up the most issues (specifically the Jaywalking contradiction and the Mixed Bus Stop ambiguity), you should revise **Commitment (6)**.

  **Current (6):** *"A person who accepts the benefits of a scheme of mutual restraint owes compliance with its rules in return..."*

  **Proposed Revision:** *"A person who accepts the benefits of a scheme of mutual restraint owes compliance with its rules in return, **provided that their compliance is reasonably expected by others and necessary to sustain the benefit accepted.**"*

  **Why this fixes the set:**
  1.  **Saves (5) Jaywalking:** On an empty street, your compliance is *not* necessary to sustain the benefit (the system works without you waiting), and compliance is not *reasonably expected* (ordinary verdicts say it's fine). This removes the obligation without denying Fair Play.
  2.  **Fixes the Mixed Bus Stop:** In the mixed stop, if you approach a group of queuers, compliance *is* reasonably expected by them, and your scrambling *does* undermine the benefit (order) they are trying to sustain locally. This generates the obligation (1) even if the broader practice (2) is messy.
  3.  **Aligns (2) and (6):** This revision brings (6) into harmony with the "expectation" logic in (2), but removes the overly strict "mutually recognised" requirement that failed in the mixed case.
  4.  **Preserves (8):** It vindicates ordinary verdicts in both the Jaywalking and Queue-jumping cases.

  **The Cost:**
  You must acknowledge that Fair Play is not a blanket debt incurred by mere existence within a system (which threatened (5)), but a specific debt incurred when your actions interact with the *reasonable expectations* of specific beneficiaries. This makes the theory slightly more contextual, but significantly more robust.

  ### Summary of Fault Lines
  *   **Exposed Verdict:** (5) is not the problem; it is the anchor for ordinary intuition.
  *   **Exposed Principle:** (6) is the problem; it is too broad and threatens (5).
  *   **Exposed Definition:** (2) is too rigid regarding "live practice," failing the Mixed Bus Stop test.
  *   **Solution:** Qualify (6) with a **necessity/expectation threshold**. This preserves your non-relativism, vindicates ordinary verdicts, and resolves the tension between coordination and distribution by grounding obligation in *reasonable expectation* rather than *statistical prevalence*.
