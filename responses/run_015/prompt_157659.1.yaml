  ### Part 1: Logical Space Analysis

  Before constructing the instrument, we map the logical combinations allowed by the branching criteria. The tree divides the conceptual space using five binary distinctions. There are theoretically eight possible endpoints in a fully binary tree of this depth; six are occupied by the target positions, leaving two logically possible but unoccupied combinations.

  **The Branching Variables:**
  1.  **Survival:** Do moral reasons survive the total removal of detection and self-knowledge? (Yes/No)
  2.  **Sanction-Dependence (Yes-Branch):** If reasons survive, do they depend on memory-independent internal sanctions (e.g., immediate affective aversion)? (Yes/No)
  3.  **Flourishing-Dependence (Yes/Yes-Branch):** If sanctions matter, is the reason valued only for its contribution to the agent's flourishing? (Yes/No)
  4.  **Social-Dependence (No-Branch):** If reasons do not survive the ring, is morality rational only in visible/social contexts? (Yes/No)
  5.  **Content-Realism (No/No-Branch):** If not social, does the concept of justice retain content without observers, or is it a fiction? (Content/Fiction)

  **The Grid of Positions:**

  | Position | 1. Survival | 2. Sanction-Dep. | 3. Flourishing | 4. Social-Dep. | 5. Content |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Transcendental Moral Realism** | Yes | No (Categorical) | N/A | N/A | N/A |
  | **Virtue-Constitutivism** | Yes | Yes | Yes | N/A | N/A |
  | **Internalist-Contractualism** | Yes | Yes | No (Commitment) | N/A | N/A |
  | **Reputation-Contractualism** | No | N/A | N/A | Yes | N/A |
  | **Hard Egoism** | No | N/A | N/A | No | Yes (Interest) |
  | **Moral Error Theory** | No | N/A | N/A | No | No (Fiction) |

  **Unoccupied Combinations:**
  1.  **Survival=Yes / Sanction=No / Flourishing=Yes:** *Incoherent.* If the reason survives without internal sanctions (affect/memory), it cannot be valued *for* flourishing, as flourishing in this context requires a psychological payoff.
  2.  **Survival=No / Social=No / Content=Yes (Non-Interest):** *Unattractive/Neglect.* This would imply moral facts exist (Content=Yes) but provide no reason to act (Survival=No) and are not social. This is a form of "Queer Realism" where facts exist but have no normative grip, a position rarely defended as stable.

  **Indistinguishable Leaves:**
  No pair of the six target positions shares every branch answer in this instrument. All six are logically separable given the specific distinctions drawn above.

  ***

  ### Part 2: The Diagnostic Instrument

  **Instructions for the Student:**
  Read the following scenario and answer the questions sequentially. Choose the option that best matches your intuitive judgment about the case. Do not worry about technical philosophical terms; answer based on what seems most plausible to you.

  **The Scenario:**
  You possess a modified Ring of Gyges. It renders you invisible to all others. Additionally, it possesses a "mnemonic wipe": immediately after you commit any unjust act, your memory of that specific act is erased. You will not know you did it, you cannot feel retrospective guilt, and no one can punish you. The only psychological states available to you are those that arise *during* the act itself, independent of knowing it was wrong.

  **Node 1 (Root): The Survival of Reasons**
  In this specific scenario (total invisibility and no memory of the act), is there still a genuine *reason* for you not to commit injustice, even if doing so benefits you and you will never know you did it?
  *   **(A) Yes:** There is still a reason not to do it.
  *   **(B) No:** There is no reason not to do it in this specific case.

  ---

  **Node 2 (Path A): The Role of Immediate Feeling**
  *(For students who answered Yes at Node 1)*
  Suppose you commit an unjust act while wearing the ring. You will not remember it later, so you cannot feel guilt tomorrow. However, *while* you are doing it, would you feel an immediate sense of aversion or discomfort simply because it is unjust?
  *   **(A) No:** The reason exists even if you feel absolutely no discomfort or aversion during the act.
  *   **(B) Yes:** The reason is tied to the fact that a good person would feel discomfort doing it, even if they forget why.

  ---

  **Node 3 (Path A-A): The Ground of Obligation**
  *(For students who answered No at Node 2)*
  If the reason not to act unjustly applies to you even though it produces no psychological discomfort and offers no benefit to your happiness, what best describes this reason?
  *   **(A) It is a law that binds you regardless of your desires or identity.**
  *   **(B) [End of Path]** *(This branch leads to Leaf 1)*

  ---

  **Node 4 (Path A-B): The Source of Value**
  *(For students who answered Yes at Node 2)*
  You feel an immediate aversion to the unjust act. Why is avoiding this act important?
  *   **(A) Because acting justly is essential to your own happiness and flourishing as a human being.**
  *   **(B) Because you have made a commitment to be a certain kind of person, and breaking it violates your integrity.**

  ---

  **Node 5 (Path B): The Nature of Morality**
  *(For students who answered No at Node 1)*
  Since there is no reason to be moral in the ring scenario, consider the normal world (without the ring). Is the reason to be moral primarily about maintaining social order and avoiding harm from others?
  *   **(A) Yes:** Morality is a rational agreement for mutual protection.
  *   **(B) No:** Morality is not essentially a social agreement.

  ---

  **Node 6 (Path B-B): The Status of Moral Facts**
  *(For students who answered No at Node 5)*
  If morality is not a social agreement, and it gives you no reason to act when invisible, what is the status of the claim "injustice is wrong"?
  *   **(A) It refers to something real (like your self-interest), but self-interest wins in the ring case.**
  *   **(B) It is a mistake or illusion; there are no moral facts of the matter.**

  *(Note: To adhere to the 5-node limit, Node 3 and Node 6 are terminal distinctions within their branches. The tree structure below visualizes the flow.)*

  ***

  ### Part 3: Scoring Key and Position Mapping

  **Leaf 1: Transcendental Moral Realism**
  *   **Path:** Node 1 (Yes) → Node 2 (No) → Node 3 (A).
  *   **Diagnosis:** You believe moral reasons exist objectively and apply categorically, independent of your psychological state, memory, or flourishing.

  **Leaf 2: Virtue-Constitutivism**
  *   **Path:** Node 1 (Yes) → Node 2 (Yes) → Node 4 (A).
  *   **Diagnosis:** You believe justice is partly constitutive of human flourishing; the internal sanction (aversion) matters because it reflects the health of your soul.

  **Leaf 3: Internalist-Contractualism**
  *   **Path:** Node 1 (Yes) → Node 2 (Yes) → Node 4 (B).
  *   **Diagnosis:** You believe moral commitments are valued for constituting the kind of agent you want to be (integrity), even invisibly, rather than for happiness alone.

  **Leaf 4: Reputation-Contractualism**
  *   **Path:** Node 1 (No) → Node 5 (A).
  *   **Diagnosis:** You believe morality is rational only in visible contexts where enforcement and reputation operate; it binds there, but not in the ring scenario.

  **Leaf 5: Hard Egoism**
  *   **Path:** Node 1 (No) → Node 5 (B) → Node 6 (A).
  *   **Diagnosis:** You believe morality collapses without enforcement because self-interest is the only ultimate reason; 'wrong' just means 'harmful to me,' and the ring removes the harm.

  **Leaf 6: Moral Error Theory**
  *   **Path:** Node 1 (No) → Node 5 (B) → Node 6 (B).
  *   **Diagnosis:** You believe there is no fact of the matter regarding moral obligation; the ring reveals that moral language is habit or illusion, not a failure of prudence.

  ***

  ### Part 4: Gap Analysis and Indistinguishability Flag

  **Unoccupied Logical Space:**
  As noted in Part 1, two combinations remain unoccupied.
  1.  **Reasons Survive + No Sanction + Flourishing Value:** This combination is flagged as **incoherent**. If a reason survives without any psychological sanction (affect/memory), it cannot be grounded in the agent's flourishing, as flourishing requires a positive psychological state.
  2.  **Reasons Collapse + Not Social + Real Content:** This combination is flagged as **unattractive/neglect**. It suggests moral facts exist but provide no reasons for action and are not social. This creates a "normatively inert" realism that few philosophers defend.

  **Indistinguishable Leaves:**
  **Flag:** No pair of leaves shares every branch answer.
  **Diagnosis:** The instrument successfully separates all six positions. However, **Virtue-Constitutivism (Leaf 2)** and **Internalist-Contractualism (Leaf 3)** are theoretically proximate. Both rely on internal sanctions independent of memory. They are separated *only* by Node 4 (Flourishing vs. Integrity). If a student views integrity as *part* of flourishing, they may find this distinction difficult, but logically the branches remain distinct. **Hard Egoism (Leaf 5)** and **Moral Error Theory (Leaf 6)** are also proximate in the ring scenario (both say "act unjustly"), but are separated by Node 6 regarding the metaphysical status of moral claims (Interest vs. Illusion).
