answer: |-
  You have identified a sophisticated structural flaw in public policy debate. Your observation is sharp: you are not just seeing people lie or cherry-pick; you are seeing a logical structure where the *interpretive framework* is so flexible that it consumes the evidence regardless of the evidence's value.

  Here is the breakdown of what you are looking at, the terminology, the mechanics, and the edges.

  ### 1. The Name

  There is no single academic noun that captures this exactly, but it falls under the established logical category of a **Self-Sealing Argument** (or **Self-Sealing Hypothesis**). In colloquial rhetoric, this is often called a **"Heads I Win, Tails You Lose"** fallacy.

  However, because you are describing this specifically in the context of *statistics* and *metrics* where the number itself is neutralized by the narrative, I will coin the term **"The Rorschach Metric."**

  **Definition:** A Rorschach Metric is a quantitative indicator used in a debate where the *direction* or *magnitude* of the data does not determine the conclusion. Instead, the conclusion determines the meaning of the data. Like a Rorschach inkblot test, the metric is ambiguous enough that both sides project their pre-existing narrative onto it.

  ### 2. What You Are Looking At (The Mechanics)

  You asked if the defect is in the reasoners or the evidence. The answer is **both**, but primarily in the **inferential link** between them.

  In a healthy empirical debate, a metric acts as a **constraint**. It limits the possible valid conclusions. If a metric can support Conclusion A when it goes up *and* support Conclusion A when it goes down, it is not acting as a constraint. It is acting as **decoration**.

  Here is why this happens in your assisted dying example:
  The debate is fundamentally **normative** (about values, rights, and morality), but the evidence is **empirical** (about counts, rates, and frequencies).
  *   **The Supporters' Narrative:** "Access is a right; obstacles are bad."
  *   **The Opponents' Narrative:** "Safety is paramount; expansion is risky."

  When you introduce a number (e.g., usage rates), you are asking an empirical question to solve a normative problem.
  *   **Low Usage:** Supporters say, "Obstacles exist" (Normative: Obstacles are bad). Opponents say, "Risk is low" (Normative: Safety is good).
  *   **High Usage:** Supporters say, "Access achieved" (Normative: Rights fulfilled). Opponents say, "Scope creep" (Normative: Safety compromised).

  The number itself contains no moral valence. The "spin" is not necessarily dishonest; it is the result of applying two different moral frameworks to a neutral number. The defect is the **Category Error**: treating a moral disagreement as if it could be settled by volume statistics.

  ### 3. Distinctions from Other Concepts

  You asked how this differs from similar logical phenomena.

  *   **Confirmation Bias / Motivated Reasoning:** These are *psychological* descriptions. They explain *why* a person ignores counter-evidence. A Rorschach Metric is the *structural tool* they use to do it. Confirmation bias is the engine; the Rorschach Metric is the vehicle.
  *   **Special Pleading / Double Standard:** This is the closest formal fallacy. Special pleading is applying a standard to others that you do not apply to yourself. In a Rorschach Metric, both sides are guilty of special pleading simultaneously. They are applying a standard of "significance" that shifts depending on who is winning.
  *   **Slippery Slope:** A slippery slope argument predicts *future* consequences ("If we allow X, Y will happen"). A Rorschach Metric interprets *current* data ("X happened, and it means Z").
  *   **Unfalsifiability:** An unfalsifiable claim is one where *no* evidence can count against it (e.g., "Invisible dragons exist"). A Rorschach Metric is more insidious: *all* evidence counts *for* it. It is not that evidence is excluded; it is that evidence is infinitely malleable. It is **Over-Falsifiable** in the sense that every possible outcome is claimed as a victory.

  ### 4. The "What Would Change Your Mind" Test

  You mentioned that almost no one could answer what number would make them reconsider. This is the **Falsifiability Criterion**, popularized by philosopher Karl Popper.

  If a proponent of a theory cannot describe a state of the world that would prove them wrong, they are not operating scientifically; they are operating ideologically.
  *   **The Defect:** The inability to name a counter-factual shows that the metric is not being used to *test* a hypothesis, but to *arm* a position.
  *   **Is it lack of imagination?** No. It is usually an admission that their position is not contingent on the data. If a supporter of assisted dying says, "If 50% of requests were coerced, I would oppose it," they have made the metric real. If they say, "Coercion is impossible to measure," they have created a Rorschach Metric.

  ### 5. What Makes a Good Indicator?

  For a metric to escape the Rorschach trap, it must possess **Asymmetric Predictive Value**.

  A robust indicator must have at least one "direction" or "state" that damages one side's argument more than the other's.
  *   **Bad Indicator:** Number of procedures performed. (Can be framed as "access" or "abuse" equally well).
  *   **Good Indicator:** Verified cases of coercion resulting in death.
      *   *If High:* Devastating to Supporters (safety failure). Hard for Opponents to spin as positive.
      *   *If Low:* Good for Supporters (safety success). Opponents can still argue "iceberg theory," but the burden of proof shifts to them.

  To fix a Rorschach Metric, you must tie the number to a **shared value**. In your debate, both sides claim to value "autonomy" and "safety." A good metric measures the *trade-off* between them, not just the volume of activity.

  ### 6. The Third Instance (A Different Animal)

  You were right to suspect the third instance (botched procedures/suffering) is different.
  *   **Instances 1 & 2** are **Directional Ambiguity** (Up or Down both work).
  *   **Instance 3** is **Threshold Ambiguity** (Zero vs. Non-Zero).

  Here, the disagreement is not about what the number *means*, but where the **line of tolerance** is drawn.
  *   **Opponents:** Zero Tolerance. (Any error invalidates the system).
  *   **Supporters:** De Minimis Risk. (Some error is acceptable in complex systems).

  This is not a Rorschach Metric; it is a **Clash of Risk Frameworks**. It is a genuine philosophical disagreement about whether a medical procedure can ever be morally permissible if it carries a non-zero risk of unintended suffering. This is harder to resolve because it is not about data interpretation; it is about first principles.

  ### 7. The Edges (False Positives and Negatives)

  You asked for cases that look like this but aren't, and one that is but doesn't look like it.

  **Case A: Looks like a Rorschach Metric, but isn't.**
  *   **Metric:** Unemployment Rate.
  *   **Why it looks like one:** Politicians always spin it. If it goes down, the incumbent says "Policy worked." If it goes up, they say "Global forces."
  *   **Why it isn't:** There is consensus on the *valence*. Everyone agrees lower unemployment is better. The disagreement is about *causality* (who gets credit), not the *meaning of the number itself*. A Rorschach Metric requires disagreement on whether the number represents a success or a failure.

  **Case B: Looks like a Rorschach Metric, but isn't.**
  *   **Metric:** Bridge Stress Tests.
  *   **Why it looks like one:** Engineers might disagree on safety margins.
  *   **Why it isn't:** There is a physical reality that constrains the interpretation. If the bridge collapses, the "it was safe" argument dies. In assisted dying, "safety" is a social construct, not a physical load-bearing limit. A Rorschach Metric thrives where the "failure state" is subjective.

  **Case C: Is a Rorschach Metric, but doesn't look like one.**
  *   **Metric:** Efficacy of Prayer in Medical Recovery.
  *   **Why it doesn't look like one:** It seems like a simple yes/no scientific question.
  *   **Why it is one:**
      *   *Patient Recovers:* Believers say "Prayer worked." Skeptics say "Remission/Placebo."
      *   *Patient Dies:* Believers say "God's will/faith test." Skeptics say "Prayer failed."
      *   *Structure:* Exactly like your assisted dying numbers. The outcome is interpreted through a pre-existing theological or materialist framework. No empirical outcome can falsify the theological position.

  ### Summary for Your Debate

  When you encounter this pattern, do not just accuse the other side of bias. That is ad hominem. Instead, attack the **inferential link**.

  Say this: *"You are using this statistic as a Rorschach Metric. You have defined the data such that it confirms your position regardless of its value. Unless you can specify a number that would weaken your argument, this statistic is not evidence; it is rhetoric."*

  This forces them to either admit the metric is decorative or commit to a falsifiable claim. That is the only way to turn a Rorschach Metric into a real measure.
