      *   *Implicature:* Generated by the assumption of CP + Maxims.
      *   *Diagnostics:*
          *   *Calculable:* Can be derived from CP + Maxims + Context.
          *   *Cancellable:* Can be explicitly denied without contradiction (e.g., "Some students passed. In fact, all did." vs. "Some students passed. #In fact, none did.").
          *   *Detachable:* Is the implicature tied to the specific wording? If I say the same thing differently, does the implicature vanish? (If yes, it's detachable).
