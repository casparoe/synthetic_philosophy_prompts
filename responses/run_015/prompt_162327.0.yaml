answer: |-
  Hi there,

  It makes complete sense that you are wrestling with this, especially now. When you remove a coping mechanism like alcohol and simultaneously introduce a medication that alters your executive function, the machinery of your own decision-making suddenly becomes visible in a way that feels unnerving. You are right to be skeptical of blog-post theories like hyperbolic discounting; they are often too clean for the mess of actual human psychology, particularly with ADHD involved. You need principles that respect the difference between a failure of execution and a failure of planning, and that distinguish between changing your mind and losing your nerve. Based on the ten cases you provided, I suggest we work with two principles that split the problem into synchronic failures and diachronic failures.

  The first principle is what I will call the Synchronic Judgment Principle. This states that an action counts as weakness of will if and only if you perform it while simultaneously judging that you ought not to perform it, provided that this contradiction is not caused by new information or a coercive force. The first clause, requiring a contradiction between action and occurrent judgment, is there to handle your cases one, two, three, and eight. It captures the party relapse where you drink despite deciding not to, the report procrastination where you email instead of write, the late-night scrolling where you know sleep is best but scroll anyway, and the eating of your daughter's portion where you judge you should not eat it. The second clause, which excludes new information or value changes, is specifically there to handle case four, where you genuinely decide on Saturday that staying home is better, thereby exempting it from weakness of will because your judgment actually changed. The third clause, excluding non-volitional states, is there to handle case nine, ensuring that your fear of flying is categorized as an emotional conflict rather than a failure of will, since you are not choosing to be afraid.

  The second principle is the Diachronic Integrity Principle. This states that an action also counts as weakness of will if it fulfills a desire you previously identified as destructive, specifically when you entered the situation knowing your judgment would be compromised, unless you can cite a relevant change in circumstances that justifies abandoning the prior resolution. The first clause, regarding the violation of a prior resolution where compromise was predicted, is there to handle case six, where you agreed on Thursday to go knowing you would drink, ensuring that this counts as weakness of will even though your Saturday self judged drinking best at the time. The second clause, which demands a relevant change in circumstances to justify abandonment, is there to draw the line between case four and case six, ensuring that simply feeling like staying home on Saturday counts as valid only if it is not the predictable failure you anticipated on Thursday. The third clause, stating that the silencing of judgment through habit counts as failure, is there to handle case seven, validating your gut feeling that ordering without a fight is worse than struggling, because it shows the vice has become your default identity. The fourth clause, specifying that using constraints is upholding integrity, is there to handle case five, clarifying that building the cage is an act of strength and wisdom, not weakness, even if the need for it implies vulnerability.

  If we run these principles against your three new cases, the results are fairly clear. In the well, today's blown case where you have one drink and then six more, the Synchronic Judgment Principle applies during the second through seventh drinks, because you judge that drinking more is bad while doing it, and the Diachronic Integrity Principle applies because you likely knew this pattern existed. This is a compound failure of both kinds. In the commitment contract case where money is riding on your sobriety, the Diachronic Integrity Principle classifies this as strength of will, because you are using a tool to uphold your prior resolution against predicted failure, similar to case five. In the case of your dad, who drinks every night and sincerely judges it is fine, neither principle classifies this as weakness of will. He is acting in accordance with his judgment, so his failure is one of knowledge or false belief, similar to case nine, rather than a failure of will.

  Regarding your suspicion of self-flattery, you need to give up the certainty of your verdict on case four. It is the most dangerous verdict you hold. While it is theoretically possible to genuinely change your mind, in the context of addiction and ADHD, the feeling that staying home is better on Saturday is often not new information but rather the predicted failure manifesting as a rationalization. If you cannot distinguish between a valid update and a predictable collapse, case four becomes a loophole that swallows case six. You must treat any deviation from a prior resolution as suspect unless the change in circumstances is objective and external, not just a shift in how you feel. As for case ten, the inverse akrasia, you do not need to give up the pride, but you should give up the label. If you judged staying in bed was best but got up anyway, and getting up was good, then your judgment was impaired, likely by fatigue or depression. Acting against an impaired judgment is not weakness of will, it is rational correction, so calling it inverse akrasia is semantically confused even if the action was virtuous.

  Finally, to answer your question about the medication, the ADHD treatment was apparently fixing the failures described by the Synchronic Judgment Principle. When you say some things you could never make yourself do you now just do, you are describing a repair of the bridge between judgment and action. The medication improves executive function, which allows you to execute on what you already decide, handling cases like one, two, and three where the judgment was present but the action failed. It is less effective at fixing the Diachronic Integrity failures like case six, which require planning and self-knowledge rather than just impulse control. This distinction matters because it means the meds give you the capacity to follow through, but you still have to do the work of setting the right resolutions and recognizing when you are rationalizing a relapse.

  I hope this helps you sort through the noise. It is a good sign that you are analyzing this so closely rather than just riding the momentum.

  Best of luck.
