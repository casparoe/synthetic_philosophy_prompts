          *   Content: Run the procedure on three specific cases (coworker theft, kidney donation/violent father, teen calling police on mother).
          *   Requirement: Argue for verdicts if the procedure demands them (even if the Director dislikes it). Include at least one worked case where the procedure returns an answer the Director might dislike (to test trust).
          *   Requirement: Be explicit about what the procedure *cannot* do (limitations, judgment calls).
