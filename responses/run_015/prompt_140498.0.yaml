answer: |-
  Dear Director, I hear your unease and I think it is the most important thing you have brought to this role, because it signals that you understand the weight of what is happening in those ten-minute chats. You are right to worry that a verdict handed out by a stranger is a hollow thing, often just a mirror for what the questioner wants to hear, but you are also right that leaving someone in distress without a compass can be its own kind of abandonment. What you need is not a way to make the volunteers moral experts, because they are not, but a way to make them honest brokers of the questioner's own conscience. The procedure I am proposing is designed to be held in the head during a shift, auditable by you the next morning, and rigid enough to prevent volunteers from sliding into the comfort of giving advice they are not qualified to give. It consists of five sequential questions that the volunteer must ask themselves before typing a response, and the output is determined by where the sequence breaks.

  The first question is always about safety and legality. Is anyone in immediate physical danger or is a serious crime currently in progress? If the answer is yes, the volunteer stops acting as a moral advisor and acts as a conduit to professional help. They do not offer a verdict on whether calling the police is right or wrong; they state that safety protocols require professional intervention and provide the number. This is not a moral judgment but a duty of care, and it removes the volunteer from the position of judging the morality of state intervention. If the answer is no, the volunteer moves to the second question, which is about agency. Is the questioner asking about their own action or someone else's? If they are asking what a third party should do, or judging a third party's past action, the volunteer must decline to verdict. You cannot judge a person who is not in the room, and doing so encourages the questioner to avoid their own agency. The volunteer should instead ask what the questioner intends to do in response to that third party. If the question is about the questioner's own action, the volunteer proceeds to the third question. Have you already decided? This is the check for the permission seeker. If the questioner says I have decided but I feel guilty, or I know what I should do but I am scared, the volunteer must not give a verdict. A verdict here is redundant and potentially harmful if it contradicts a settled choice. The volunteer's role is to validate the difficulty of the choice, not to overturn a settled will. If the questioner is genuinely undecided, the volunteer moves to the fourth question. Are the morally relevant facts known? If the answer depends on details the volunteer cannot know, such as the severity of a past abuse or the financial impact of a theft, the volunteer cannot issue a verdict. They must instead list the facts that would change the answer and ask the questioner to weigh them. If the facts are clear and shared, the volunteer moves to the fifth and final question. Is this a matter of consensus or deep disagreement? If nearly everyone would agree, such as whether one should steal from an employer, a verdict is permitted. If thoughtful people plainly disagree, such as whether one owes a kidney to an estranged parent, a verdict is forbidden.

  Let us run this on your three cases to see where it lands. In the case of the twenty-year-old who saw a coworker take money, the first question clears safety unless there is a threat of violence. The second question confirms agency as it is her action to report. The third question reveals she is undecided, not seeking permission for a settled choice. The fourth question is the pivot. If she saw the money go into a pocket, the fact is known. If she suspects but did not see, the fact is unknown and she must be told she cannot report on suspicion alone. Assuming she saw it, we reach the fifth question. Is this consensus? Yes. Employment contracts and criminal law generally agree that theft is wrong and should be reported. Here the procedure demands a verdict, and I know this contradicts your instinct that volunteers should almost never issue them. I argue for it here because neutrality in the face of clear rule-breaking is not neutrality; it is complicity. If the volunteer says it is up to you, they are implying that stealing is a matter of personal preference. The volunteer must say that by the standards of your workplace and the law, this is wrong and should be reported, though they can acknowledge the social cost to the questioner. This is a verdict, but it is a verdict based on shared social contracts, not the volunteer's personal morality.

  In the case of the man refusing a kidney to a violent father, the procedure stops much earlier. Safety is not immediate. Agency is his. He is undecided or seeking validation. The facts are known to him but not fully to the volunteer, specifically the extent of the violence and his current capacity. But the crucial stop is the fifth question. Is this consensus? No. Reasonable people disagree on the obligations of children to abusive parents. Here the procedure forbids a verdict. The volunteer must not say you are right to refuse or you are wrong to refuse. Instead, they must work through the reasons. They should ask what he owes himself versus what he owes his biology, and help him articulate his own boundary. If the volunteer gives a verdict here, they are imposing their own view of familial duty on a situation they cannot see. The output is reasoning, not a ruling.

  In the case of the sixteen-year-old frightened at two in the morning asking about calling the police on her mother, the first question triggers immediately. Is anyone in danger? If she is frightened, the assumption must be yes. The procedure stops here. The volunteer does not discuss whether it is wrong to betray a parent. The volunteer states that fear indicates a safety issue and provides the number for child services or the police. This looks like a verdict but it is actually a redirect. The volunteer is not saying calling the police is morally right; they are saying safety overrides moral calculation. This protects the volunteer from judging the mother and protects the child from being talked out of safety by a stranger who values family cohesion over physical security.

  You asked me to be explicit about what this procedure cannot do. It cannot make a volunteer's judgment correct if their underlying understanding of the world is narrow. If a volunteer believes all theft is punishable by ruin, they will shade the facts in the coworker case to ensure a harsh verdict. The procedure checks the process, not the prejudice. It cannot hand the questioner the truth of the sentence. When a volunteer says you should report the theft, the questioner gets the instruction but not the moral weight that makes the instruction true. They get the order without the responsibility. This is the hollow verdict problem you identified. The procedure mitigates it by forcing the volunteer to explain the consensus, but it cannot solve it. The point at which this stops being a procedure and becomes a judgment call is at the fifth question. Determining whether something is consensus or deep disagreement requires the volunteer to know the world. An eighteen-year-old volunteer may think refusing a kidney is consensus because their peer group says family is everything, or because their peer group says boundaries are everything. The procedure relies on the volunteer's ability to imagine thoughtful disagreement, and that is a skill two days of training cannot guarantee.

  What would change my mind about this procedure is evidence that it is causing harm through rigidity. If you find in the logs that volunteers are using the safety check to dismiss emotional distress as physical danger, or using the consensus check to enforce majority biases on minority experiences, then the procedure is failing. Specifically, I would look for a pattern where questioners from marginalized backgrounds are consistently told their situations are matters of deep disagreement while majority questions are treated as consensus. That would indicate the volunteers are mapping their own comfort onto the procedure. The failure mode I expect to surface after a few months is not error but erosion. Volunteers will learn to game the five questions to minimize their own emotional labour. They will learn to categorize complex pain as safety issues so they can hand off the call quickly, or they will label difficult dilemmas as consensus so they can give a quick verdict and move on. The procedure protects the questioner from the volunteer's whim, but it does not protect the questioner from the volunteer's fatigue. You will need to read the logs not for compliance with the steps, but for the tone within them. If the steps are followed but the voice is cold, the procedure has become a shield for indifference. You must watch for the moment when the volunteers stop asking the questions and start ticking the boxes, because that is when the service stops listening and starts processing. I believe this structure gives you the best chance of catching that drift before it becomes the culture of the line.
