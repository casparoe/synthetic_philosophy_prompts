      *   *Analysis:* The DSM-5 workgroups rarely make overt metaphysical claims. They lean on empirical reliability and pragmatic utility. The strongest reconstruction is likely a mix of Empirical (unreliable boundary) and Pragmatic (no differential treatment). For the Metaphysical claim to be the *real* ground, we would need proof of a single underlying etiology for all ASD, which we don't have yet.
