  *(Final check on constraints)*: "Run the candidate accounts without naming authorities." I will adhere to this strictly in Section 2. In other sections, I can allude to concepts (like looping effects) without necessarily citing Hacking by name if it flows better, but the prompt says "without naming authorities" specifically for the "carving at the joint" section. I will keep it general throughout to be safe and stylistically consistent.

