  # JOINT STATEMENT ON THE KNOWABILITY PARADOX AND THE STATUS OF OCCLUDED TRUTHS

  **Signed by:** The Transparency Advocates and The Occlusion Defenders
  **Date:** October 26, 2023
  **Subject:** Adversarial Collaboration on the Derivation from Knowability to Omniscience

  ## I. AGREED CLAIMS

  1.  **Validity of the Formal Derivation:** Both camps agree that the formal derivation (commonly known as Fitch's Paradox) is logically valid within standard classical logic and standard epistemic logic. Specifically, we agree that the premise "For every proposition $p$, if $p$ is true, then it is possible to know $p$" formally entails "For every proposition $p$, if $p$ is true, then $p$ is known."
  2.  **Empirical Omniscience is False:** Both camps agree that the conclusion "All truths are actually known" is empirically false. There are currently true propositions (e.g., the exact number of grains of sand on a specific beach) that no agent currently knows. Therefore, at least one premise leading to this conclusion must be rejected or restricted.
  3.  **Limits of the Argument Alone:** We agree that the formal argument, on its own, does not dictate which premise must be abandoned. It establishes a contradiction between the unrestricted Knowability Principle and the existence of unknown truths, but it does not independently prove that reality is transparent nor that reality contains hidden facts.
  4.  **Status of Isolated Regions:** Both camps agree that hypothetical permanently isolated regions (such as the interior of a black hole past the event horizon, or a causally disconnected sector of the universe) serve as the primary test case for this dispute. We agree on the physical description: in these regions, no information can causally influence an external observer. We disagree only on the metaphysical interpretation of truth within those regions.
  5.  **Definition of Knowledge:** For the purposes of this discussion, both camps adopt the standard tripartite definition of knowledge: a subject knows a proposition if and only if the proposition is true, the subject believes it, and the subject is justified in that belief. We agree that "knowability" refers to the possibility of satisfying these three conditions.

  ## II. DISAGREEMENTS TABLE

  | Crux / Sub-Question | Transparency Advocates' Core Position | Occlusion Defenders' Core Position | Relevant Case / Thought Experiment | Predicted Resolution (Advocates) | Predicted Resolution (Defenders) |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Scope of the Knowability Principle** | The principle applies to all truth-apt propositions without restriction. If a proposition is true, it is metaphysically possible for an agent to know it. | The principle must be restricted. It applies only to propositions that are not verification-transcendent. Some truths are inherently unknowable. | **The Event Horizon:** A specific atom decays inside a black hole event horizon. No signal can escape. | The proposition "The atom decayed at $t$" is only true if there is a possible epistemic path to verify it (e.g., via theoretical inference from external data). If no path exists, the proposition lacks a truth value or is false. | The proposition "The atom decayed at $t$" is objectively true or false regardless of information escape. The truth is occluded but real. |
  | **2. Modality of "Possible" ($\Diamond$)** | "Possible" refers to broad metaphysical possibility. Physical barriers do not constitute metaphysical impossibility regarding truth conditions. | "Possible" is constrained by nomological (physical) possibility. If physical law forbids information transfer, knowledge is impossible in the relevant sense. | **The Causally Disconnected Universe:** A duplicate of our universe exists with no causal link to ours. A war occurs there. | If the war occurs, there must be some counterfactual scenario where an agent could know it, or the claim "a war occurred" is not a truth in the strict sense. | The war occurred. It is a truth. It is physically impossible for us to know it. Therefore, not all truths are knowable. |
  | **3. Nature of Truth in Isolation** | Truth is constitutively linked to the availability of evidence, even if that evidence is only available in a counterfactual scenario or via ideal inference. | Truth is mind-independent. A fact can obtain even if no agent, actual or counterfactual, can ever verify it due to structural barriers. | **The Last Observer:** The last sentient being dies without knowing whether a specific distant star exploded. | If no one can ever know it, the star's explosion status is indeterminate or the proposition is not truth-apt. | The star definitely exploded or did not. The truth survives the extinction of all observers. |

  ## III. VERBAL VS. SUBSTANTIVE DISAGREEMENT

  Upon review, we identify a partial verbal disagreement regarding the phrase **"in principle,"** though the core conflict remains substantive.

  **The Verbal Component:**
  The camps utilize different modal scopes for the term "in principle."
  *   **Transparency Advocates** use "in principle" to mean *logically or metaphysically consistent with the nature of truth*. For them, if a physical law blocks knowledge, that law does not render the truth unknowable "in principle"; rather, it suggests the truth condition was not met.
  *   **Occlusion Defenders** use "in principle" to mean *consistent with the fundamental laws of nature*. For them, if a physical law blocks knowledge, the truth is unknowable "in principle."

  **Why This Is Not Purely Verbal:**
  Clarifying this definition does not resolve the conflict. The disagreement is substantively metaphysical. It concerns whether truth is **epistemically constrained** (Advocates) or **evidence-transcendent** (Defenders). Even if both sides agreed to use the Defenders' definition of "in principle," the Advocates would still maintain that a proposition blocked by physical law cannot be "true" in the robust sense. Conversely, even if both sides used the Advocates' definition, the Defenders would maintain that truth exists independently of the conditions required for knowledge. Therefore, while the terminology differs, the divergence rests on incompatible theories of truth and realism.
