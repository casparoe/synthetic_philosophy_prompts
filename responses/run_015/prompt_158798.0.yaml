  ### 2. Arithmetic Check

  *   **V(X):**
      *   Mean $\bar{u} = 50$.
      *   A: $u=0, r=-50, v=1 - (-50/60) = 11/6$. Term: $(11/6) \times 0 = 0$.
      *   B: $u=100, r=50, v=1 - (50/60) = 1/6$. Term: $(1/6) \times 100 = 16.666...$
      *   **Total:** $16.67$. **Candidate Correct.**
  *   **V(Y):**
      *   Mean $\bar{u} = 30$.
      *   A: $u=0, r=-30, v=1.5$. Term: $0$.
      *   B: $u=60, r=30, v=0.5$. Term: $0.5 \times 60 = 30$.
      *   **Total:** $30.00$. **Candidate Correct.**
  *   **V(Z):**
      *   Mean $\bar{u} = 29$.
      *   A: $u=-2, r=-31, v=1 + 31/60 = 91/60$. Term: $(91/60) \times -2 = -182/60 = -3.033...$
      *   B: $u=60, r=31, v=1 - 31/60 = 29/60$. Term: $(29/60) \times 60 = 29$.
      *   **Total:** $29 - 3.033... = 25.966...$
