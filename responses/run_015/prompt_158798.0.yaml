  ### 3. Mark and Breakdown

  **Total Mark: 14 / 20**

  *   **Part (a): 8 / 8.** Precise definition of LDO; correct distinction between intrinsic equality and weighted well-being; correct explanation of monotonicity in standard prioritarianism.
  *   **Part (b)(i): 4 / 4.** All values correct; candidate self-corrected rounding error in Z appropriately.
  *   **Part (b)(ii): 2 / 8.**
