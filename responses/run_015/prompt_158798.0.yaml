  ### 4. Inline Comments

  > "So if you lower someone's level and raise no one's, every term in the sum either falls or stays the same, and at least one term falls: the total must fall."

  **Correct and creditworthy.** This accurately captures why standard prioritarianism satisfies the Pareto principle and escapes the LDO.

  > "lowering B from 100 to 60 cannot raise the total, and the rise from 16.67 to 30.00 must have some other explanation."

  **Clearly mistaken.** This contradicts your own calculation in (b)(i). The rise *is* the result of lowering B (which changes the mean and thus the weights). You have asserted a theoretical constraint that the model you are analysing violates.

  > "In Y, A's relative position has improved... and because RP weights by relative position, A's situation has genuinely improved."

  **Clearly mistaken.** You are conflating *moral weight* with *well-being*. The question stipulates A's well-being is 0 in both outcomes. The LDO is defined over well-being levels, not weighted values. A is not better off in any respect relevant to the objection.

  > "It makes one person better off and another worse off, which is an ordinary trade-off..."

  **Clearly mistaken.** Since A's well-being is constant (0) and B's falls (100 to 60), this is precisely a levelling-down move (some worse off, no one better off). Calling it a "trade-off" begs the question against the LDO.

  > "RP assigns no such value — it merely weights well-being — so the objection gets no grip on it."

  **Defensible but needs qualification.** While RP technically weights well-being rather than equality, if the weighting function depends on relative standings, the *effect* is functionally equivalent to valuing equality. The objection gets grip because the view recommends a levelling-down move.

  > "Notice, finally, that RP ranks Z (25.97) below Y (30.00), which shows that it is not simply maximizing equality..."

  **Correct and creditworthy.** This shows RP is not strict egalitarianism, but it does not exempt RP from the LDO regarding the X→Y move.

