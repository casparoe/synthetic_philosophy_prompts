  ### 1. Marking Scheme

  **Part (a) [8 marks]**
  *   **LDO Definition (2 marks):** Must state that the objection targets views where a move to equality (making some worse off, no one better off) is deemed an improvement in at least one respect.
  *   **Egalitarianism (2 marks):** Must explain that telic egalitarianism assigns intrinsic value to equality, thus accepting the "improvement in one respect" claim.
  *   **Prioritarianism Escape (2 marks):** Must explain that standard prioritarianism weights well-being by absolute level; value is exhausted by weighted well-being.
  *   **Monotonicity/Pareto (2 marks):** Must note that since weights are positive and depend on absolute levels, lowering well-being lowers total value; thus no "respect" in which levelling down is better.

  **Part (b)(i) [4 marks]**
  *   **V(X) (1.33 marks):** Correct calculation (16.67).
  *   **V(Y) (1.33 marks):** Correct calculation (30.00).
  *   **V(Z) (1.33 marks):** Correct calculation (25.97).
  *   *Note: Minor rounding errors tolerated if final conclusion unaffected, but exact fractions preferred.*

  **Part (b)(ii) [8 marks]**
  *   **LDO Verdict (3 marks):** Must identify that RP *is* vulnerable to the LDO (or violates Pareto) because V(Y) > V(X) despite no gain in well-being.
  *   **Analysis of X→Y (3 marks):** Must note that A's well-being is constant (0) and B's falls (100→60); therefore, claiming A is "better off" is false in terms of well-being.
  *   **Transfer of Argument (2 marks):** Must explain why the argument from (a) fails: in RP, weights depend on the mean (others' levels), so lowering one person can raise another's weight (or their own weight via mean shift), breaking the monotonicity assumed in (a).

