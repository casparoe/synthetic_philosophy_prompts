  ### 6. Model Answer Sketch (b)(ii)

  The computation shows RP is vulnerable to the levelling-down objection. In moving from X to Y, B's well-being falls (100 to 60) and A's remains constant (0); no one is better off in terms of well-being. Yet V rises (16.67 to 30.00). This implies RP finds value in the distribution pattern independent of well-being gains, which is the core of the LDO.

  The argument from (a) does not transfer. In standard prioritarianism, weights depend on absolute levels, so lowering well-being always lowers value. In RP, weights depend on relative deviation from the mean. Lowering B reduces the mean, reducing B's deviation and thus increasing B's weight (from 0.17 to 0.50). This weight increase outweighs the loss in B's well-being. Thus, RP violates the Pareto principle and succumbs to the levelling-down objection, despite lacking an explicit "equality" term.
