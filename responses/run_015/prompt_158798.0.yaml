  ### 5. What a Strong Answer Would Have Added

  A genuinely strong answer would have recognised that the calculation in (b)(i) constitutes a counter-example to the candidate's claim in (b)(ii). Specifically:
  1.  **Pareto Violation:** The move X→Y violates the Weak Pareto Principle (no one is better off, one is worse off, yet V rises). A strong answer would identify this as the formal equivalent of the LDO in this context.
  2.  **Weight Mechanism:** The argument from (a) fails because standard prioritarian weights depend on *absolute* levels (monotonic with well-being), whereas RP weights depend on *deviations from the mean*. In RP, lowering B lowers the mean, which increases the weight on B (as B gets closer to the mean from above) and A. The candidate missed that B's weight increases from 0.17 to 0.50 despite B's well-being falling, which drives the value increase.
  3.  **Y vs Z:** While the candidate correctly notes Y > Z, a strong answer would clarify that this only shows RP is not *lexically* egalitarian; it does not prove RP escapes the LDO on the X→Y margin.

