      *   (3) *Symbolic Realism:* Symbolic facts are objective facts about the system, not interpreter-dependent.
      *   (4) *Strong AI/Functionalism:* Sufficient isomorphism to belief/desire systems entails *genuine* belief/desire.
      *   (5) *Causal Theory of Content:* Content is fixed by causal coupling (reliable correlation) between tokens and what they stand for.
      *   (6) *Chinese Room Intuition (Restricted):* Syntax alone doesn't fix semantics; internal rules aren't enough for meaning.
      *   (7) *Non-Competitive Levels:* Higher-level explanations are true in virtue of physical facts but irreducible.

  3.  **Identify Potential Tensions:**

      *   *Tension A: The Closed System vs. Causal Content (1, 2, 5, 6).*
          *   (5) says content requires causal coupling to *what they stand for*.
