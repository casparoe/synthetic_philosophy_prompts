          *   *Severity:* High. This is a direct contradiction regarding the *source* of semantic facts.

      *   *Tension C: No Downward Causation vs. Genuine Belief (2, 4).*
          *   (4) says it would *genuinely* have beliefs.
          *   (2) says symbolic level never supplies a push.
          *   Usually, beliefs are thought to be causally efficacious (I believe it's raining, so I take an umbrella).
          *   If the beliefs are genuine (4), do they play a causal role? If yes, does that violate (2)?
          *   (7) tries to smooth this over (non-competitive). But if the beliefs are *genuine*, surely they must do *something*? If they do nothing physically distinct, are they epiphenomenal?
          *   *Severity:* Medium. This is the classic epiphenomenalism worry. (7) attempts to solve it, but the tension remains palpable.

      *   *Tension D: Isomorphism vs. Causal Coupling (4, 5).*
          *   (4) says isomorphism to belief/desire systems is sufficient for genuine belief.
          *   (5) says content is fixed by causal coupling to referents.
          *   Isomorphism is structural/syntactic. Causal coupling is historical/external.
          *   You can have isomorphism without the right causal history (e.g., a swampman careenium, or just a random closed box that happens to look like a belief system).
          *   If (5) is true, (4) might be false (isomorphism isn't enough). If (4) is true, (5) might be too restrictive.
          *   *Severity:* Medium-High. Functionalism (4) often clashes with Teleosemantics/Causal theories (5).

      *   *Tension E: Irreducibility vs. Physical Closure (1, 7).*
          *   (1) Physical account leaves no causal work outstanding.
