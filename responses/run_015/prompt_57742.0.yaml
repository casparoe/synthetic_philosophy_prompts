          *   If it's closed, what are the simmballs causally coupled to? Only each other.
          *   If content requires coupling to external referents (arithmetic, world), but the system is closed, how does (5) hold?
          *   (6) says internal rules don't settle meaning. This aligns with the closed system problem.
          *   (3) says the facts about what symbols are constituted are *about the careenium*, not projections.
          *   *Conflict:* (5) requires external causal commerce. The setup (closed box) denies external causal commerce. (3) claims objective symbolic facts exist inside.
