prompt: |-
  I lead a four-person forecasting cell at a humanitarian logistics organization, and I have an old undergraduate minor in philosophy plus a graduate degree in statistics, which is to say I know just enough of each to be dangerous. Every week we are handed numbers we are expected to turn into planning decisions: whether to pre-position supplies in a river basin, whether to hold back a contingency budget, whether to brief a country director that a scenario is now "likely." The numbers arrive from three sources our spreadsheets do not distinguish, and I have become convinced that most of our arguments after the fact trace back to that: ensemble outputs from physical models (seasonal climate forecasts, hydrological models), where the number carries an explicitly chance-like interpretation and usually some hindcast record; prices from a small internal prediction market we run among staff, several of whom have partial field access; and structured expert-judgment elicitations, which produce a number that looks identical in a cell to the other two but is somebody's opinion. We are also audited: six months after a decision, a donor or a board member asks why we moved the tents or did not, so whatever we do has to be reconstructible from a written record by someone who was not in the room.

  What I want from you is a written procedure my analysts can run on an incoming number before it enters a planning document. The analysts have real statistics training and no philosophy; the procedure has to be runnable in fifteen to twenty minutes per item, weekly, and its output has to be something our director of operations, who has no patience for epistemology, will actually sign off on. I have been reading about the Principal Principle — the principle that says your credence in an event should equal what you take the objective chance of that event to be, absent inadmissible evidence — and that feels like roughly the right framework, but I cannot hand my team a principle. I need it operationalized: the questions in order, what counts as a sufficient answer to each, where the procedure stops with a refusal to use the number, and where it hands the rest to a person because the remaining question is one of values rather than facts.

  Two things I want it to get right, and one I want it to catch. A colleague has proposed the shortcut that we simply defer to any source that comes with a calibration curve, on the grounds that a well-calibrated source is tracking something real; I suspect this collapses a distinction I cannot name precisely, because being reliably calibrated across a run of cases looks like one thing and being a report of the chance of this single event looks like another. Relatedly, we routinely let numbers cross that gap by relabeling: an expert judgment gets fed into a model, the model prints a probability, and from then on it travels downstream as though it were a chance. I have started calling this chance laundering, and I want the procedure to detect it. It also has to handle numbers that arrive stale (a basin forecast issued in March is still circulating in June and nobody adjusts it), evidence that leaks the outcome rather than describing the setup (field reports that the short rains have already failed upstream, or that fighting has begun), and the reference-class problem that arises when the record contains nothing quite like the event being forecast.

  Please give me the procedure, then run it on three cases of the shapes we actually see: a seasonal ensemble forecast putting a 40% chance on below-normal rainfall in a region where the model has a thirty-year hindcast and good reliability, arriving the same week as herder reports that the short rains have failed; our internal market implying a 25% chance that a displacement site exceeds capacity within the quarter, when the trader pool is twelve people and three of them were in the field last month; and a vendor model's 0.4% annual probability for large-scale flood displacement in a basin with no comparable event in the record, which is precisely the case where I expect your procedure to tell me not to put a number in the memo at all and where my director will push back hardest. Where a step depends on a contested reading of the theory — whether chances are Humean, or whether deference to a calibrated expert is covered by deference to chance at all, or what the time-relativity of a chance really requires of us when a forecast ages — say so, mark your confidence, and tell me which steps are judgment calls dressed up as procedure. And if the framing itself is wrong — if for a large share of our events, conflict onset and displacement above all, there are simply no objective chances to defer to and the Principal Principle does not reach them at all — tell me that plainly rather than handing me a checklist I will over-trust.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **User Profile:** Leader of a 4-person forecasting cell in humanitarian logistics. Background: Stats (Grad) + Philosophy (Undergrad Minor). Self-aware ("know just enough to be dangerous").
      *   **Problem:** Three distinct types of numbers enter the system (Physical Model Ensembles, Internal Prediction Market, Structured Expert Judgment). They look identical in spreadsheets but have different epistemic statuses. This causes post-hoc audit failures and "chance laundering."
      *   **Goal:** A written procedure (checklist/protocol) for analysts to vet incoming numbers *before* they enter planning documents.
      *   **Constraints:**
          *   Runnable in 15-20 mins per item, weekly.
          *   Output must be sign-off-able by a Director of Operations (no patience for epistemology).
          *   Must operationalize the *Principal Principle* (PP) without teaching philosophy.
          *   Must handle: Stale numbers, "leaking" evidence (outcome known), reference class problems, and "chance laundering" (expert opinion $\to$ model $\to$ "objective" probability).
          *   Must address the colleague's "calibration shortcut" (is calibration enough?).
          *   Must run on three specific cases provided.
          *   **Crucial Caveat:** If the framing is wrong (i.e., no objective chances exist for conflict/displacement), admit it plainly. Mark contested theoretical steps.

  2.  **Analyze the Theoretical Framework (The Principal Principle & Epistemology):**

      *   *The Principal Principle (PP):* David Lewis. Credence ($C$) should equal Objective Chance ($Ch$) given admissible evidence ($E$). $C(A | Ch(A)=x \land E) = x$.
      *   *The Problem:* PP applies to *chances* (ontic probabilities, like quantum events or well-defined frequentist setups). It does *not* neatly apply to epistemic probabilities (expert opinion, prediction markets) unless we treat them as proxies for chance or adopt a subjectivist framework (like Bayesianism) where "chance" is just degree of belief.
      *   *The User's Insight:* The user suspects "chance laundering" and the "calibration shortcut" are problematic. They are right. Calibration tracks past performance, not necessarily the ontic status of the current event. A weather model has a physical basis (chance-like). An expert judgment is epistemic. A prediction market is aggregating epistemic states (mostly).
      *   *The "No Objective Chances" Risk:* For conflict/displacement, there likely *are* no Lewisian objective chances. These are unique historical events, not repeatable trials of a chance setup. Applying PP here is a category error. The procedure needs to flag this.

  3.  **Drafting the Procedure (The "Epistemic Triage Protocol"):**

      *   *Goal:* Make it actionable. Avoid jargon like "Humean Supervenience." Use terms like "Source Type," "Evidence Status," "Validity Window."
      *   *Structure:*
          1.  **Source Classification:** What *is* this number? (Physical, Market, Expert).
          2.  **Admissibility Check:** Is the evidence "leaked"? (Is the game already over?)
          3.  **Freshness/Validity:** Is the number stale?
          4.  **Reference Class/Calibration:** Does the past predict the future here?
          5.  **The "Chance" Verdict:** Can we treat this as a chance? If not, how do we label it?
      *   *Addressing the "Calibration Shortcut":* The procedure must distinguish between *reliability* (calibration) and *ontology* (is it a chance?). A calibrated expert is reliable, but their output is still epistemic, not ontic.
      *   *Addressing "Chance Laundering":* Trace the lineage. If Expert $\to$ Model $\to$ Number, it remains Expert-derived.
      *   *Addressing the "No Chance" Reality:* The procedure needs a "Stop" condition where the analyst admits, "This is not a probability, it's a scenario weight."

  4.  **Refining the Procedure for the Director of Operations:**

      *   The Director doesn't care about Lewis. They care about *Audit Risk*.
      *   Rename the output: Instead of "Epistemic Status," use "Decision Weight Class."
      *   Class A: Physical Chance (Defer to number).
      *   Class B: Aggregated Belief (Defer to number, but label as belief).
      *   Class C: Unquantifiable Uncertainty (Do not use number in memo; use narrative).
      *   Time limit: 15-20 mins. Keep questions binary or short-answer.

  5.  **Developing the Three Case Studies:**

      *   *Case 1: Rainfall (40% below normal).*
          *   Source: Physical Ensemble.
          *   Complication: Field reports (leaked evidence?).
          *   Analysis: Physical chance exists (meteorology). But field reports might make the chance 0 or 1 (inadmissible evidence). If rains *already* failed, the 40% is stale/wrong.
          *   Verdict: Check freshness. If rains failed, number is void. If rains pending, number is Class A.
      *   *Case 2: Displacement Site Capacity (25%).*
          *   Source: Prediction Market (12 traders).
          *   Analysis: No objective chance of "capacity exceedance." It's human behavior + logistics. Market aggregates belief. Small N (12) = high volatility.
          *   Verdict: Class B (Aggregated Belief). Do not treat as physical chance. Audit trail must show "Market Consensus," not "Probability."
      *   *Case 3: Vendor Flood Model (0.4% annual).*
          *   Source: Vendor Model.
          *   Complication: No record (Reference Class Problem).
          *   Analysis: 0.4% implies precision that doesn't exist. "Chance laundering" likely (expert assumptions baked into model).
          *   Verdict: Class C (Stop). Do not put 0.4% in memo. It creates false precision. Use "Low likelihood, high impact" narrative.

  6.  **Addressing the Theoretical Caveats (The "Philosophy" Part):**

      *   I need to explicitly tell the user where the procedure relies on contested philosophy.
      *   *Point 1:* The existence of Objective Chances in social systems (Conflict/Displacement). (High confidence: They don't exist in the Lewisian sense).
      *   *Point 2:* Time-relativity of Chance. (If evidence leaks, chance collapses).
      *   *Point 3:* Calibration vs. Truth. (A clock that is right twice a day is calibrated? No. A model can be calibrated on climate but wrong on *this* El Niño due to structural shifts).

  7.  **Review and Refine:**

      *   *Tone:* Professional, direct, acknowledging the user's dual expertise.
      *   *Format:* Clear headers, bold text for actionable items, distinct section for the "Philosophical Warning Labels."
      *   *Check against constraints:* 15-20 mins? Yes, if the checklist is tight. Director sign-off? Yes, if the output is "Risk Class."
      *   *Self-Correction on PP:* I must be careful not to validate the PP for social events. The user asked to operationalize PP, but also asked me to tell them if the framing is wrong. I need to do both: "Here is how to use PP where it applies (weather), and here is where you must abandon it (conflict)."

  8.  **Final Polish:** Ensure the distinction between "Chance" (Ontic) and "Credence" (Epistemic) is clear in the procedure without using those words in the Director-facing output. Use "Physical Probability" vs. "Consensus Estimate."

      *(Self-Correction during drafting)*: Wait, the user specifically mentioned the Principal Principle. I should honor that framework but explain its limits. The procedure should effectively be a "Principal Principle Compliance Check."
      *Step 1:* Is there a Chance? (If no, PP doesn't apply).
      *Step 2:* Is the Evidence Admissible? (If no, PP doesn't apply).
      *Step 3:* Is the Chance Value Known? (If no, use proxy).

      *Wait, one more thing:* The "Calibration Shortcut." I need to explain *why* it fails in the notes. Calibration validates the *source*, not the *status* of the proposition.

      *Final Plan:*
      1.  Introduction acknowledging the tension.
      2.  The Procedure (The "Epistemic Triage Protocol").
      3.  The Three Cases (Applied).
      4.  The Philosophical Audit (Where the theory breaks).
      5.  Closing advice on the "No Chance" reality.

      *Let's write it.*
answer: |-
  This is a sophisticated operational problem disguised as a data quality issue. You are correct: your spreadsheet treats ontologically distinct entities as identical data types, and that is why your audit trail fails. The Principal Principle (PP) is indeed the right theoretical anchor, but as you suspect, it breaks when applied to social systems where "objective chances" do not exist in the Lewisian sense.

  Below is the **Epistemic Triage Protocol (ETP)**. It is designed to be run by your analysts in 15–20 minutes. It forces a distinction between *Physical Chance* (where PP applies), *Aggregated Credence* (where PP is a metaphor), and *Unquantifiable Uncertainty* (where PP is a category error).

  Following the protocol, I have applied it to your three cases and provided the "Philosophical Audit" you requested, highlighting where the procedure relies on contested metaphysics.

  ---

  # The Epistemic Triage Protocol (ETP)
  **Purpose:** To classify incoming numerical forecasts before they enter planning documents.
  **Time:** 15–20 minutes per item.
  **Output:** A "Decision Weight Class" (A, B, or C) and a mandatory footnote for the planning memo.

  ### Step 1: Lineage & Laundering Check (3 Minutes)
  *Goal: Prevent "Chance Laundering." Identify the primitive source of the number.*

  1.  **Trace the Number:** Where did the digit originate?
      *   [ ] **Physical Process:** Output of a simulation of physical laws (e.g., hydrology, climate ensemble).
      *   [ ] **Human Aggregation:** Output of a market, vote, or average of opinions (e.g., prediction market, Delphi).
      *   [ ] **Modelled Judgment:** A mathematical model where the parameters were set by expert opinion rather than physical measurement.
  2.  **The Transformation Rule:** If the source is **Human Aggregation** or **Modelled Judgment**, the number *cannot* be classified as Physical Chance, regardless of how many mathematical steps it underwent later.
      *   *Action:* If a vendor model uses expert parameters for conflict risk, mark as **Human Aggregation**.

  ### Step 2: The Admissibility Check (5 Minutes)
  *Goal: Detect "Leaked Evidence." Ensure the chance hasn't already collapsed to 0 or 1.*

  1.  **Temporal Status:** Is the event in the future relative to the *generation* of the number?
      *   [ ] Yes.
      *   [ ] No. (If No, **STOP**. The number is historical data, not a forecast. Discard or relabel as "Confirmed.")
  2.  **Information Asymmetry:** Do we possess specific evidence about *this* instance that the model/source could not have known?
      *   *Example:* A climate model runs in March. In June, you receive field reports that the dam upstream has already broken.
      *   [ ] No, we only know what the model knew.
      *   [ ] Yes, we know the outcome or a determining factor the model missed.
      *   *Action:* If Yes, the "objective chance" is no longer relevant. Your credence should be 0 or 1 (or near it). **Do not use the model number.**

  ### Step 3: The Reference Class & Calibration Check (5 Minutes)
  *Goal: Address the "Calibration Shortcut" fallacy.*

  1.  **Hindcast Relevance:** Does the source have a hindcast record against *this specific type* of event?
      *   [ ] Yes, >10 years of comparable data.
      *   [ ] Yes, but conditions have structurally changed (e.g., new dam, regime change).
      *   [ ] No, this is a novel event (e.g., first-time flood in this basin).
  2.  **Calibration vs. Ontology:**
      *   *Instruction:* If you marked **Physical Process** in Step 1 AND **Yes** in 3.1, you may treat the number as a **Physical Chance**.
      *   *Instruction:* If you marked **Human Aggregation** in Step 1, calibration proves *reliability*, not *chance*. You must treat the number as **Aggregated Credence**.
      *   *Instruction:* If you marked **No** in 3.1 (Novel Event), the number is **Pseudo-Precision**. Proceed to Step 4.

  ### Step 4: Classification & Sign-Off (5 Minutes)
  *Goal: Assign the Decision Weight Class for the Director.*

  Assign one of the following classes. This determines how the number appears in the memo.

  *   **Class A (Physical Chance):**
      *   *Criteria:* Physical Process + Admissible Evidence + Relevant Hindcast.
      *   *Memo Language:* "Model indicates a [X]% probability."
      *   *Audit Defense:* "We deferred to the objective chance as per standard meteorological protocol."
  *   **Class B (Aggregated Credence):**
      *   *Criteria:* Human Aggregation OR Modelled Judgment + Relevant Hindcast/Calibration.
      *   *Memo Language:* "Staff consensus/Market implies a [X]% likelihood."
      *   *Audit Defense:* "We aggregated available expert belief; no physical chance exists."
  *   **Class C (Unquantifiable Uncertainty):**
      *   *Criteria:* Novel Event (No Reference Class) OR Leaked Evidence OR Chance Laundering detected.
      *   *Memo Language:* **DO NOT PRINT THE NUMBER.** Use qualitative descriptors (e.g., "Plausible but unquantifiable," "Low likelihood, high impact").
      *   *Audit Defense:* "Quantification would imply false precision. Decision was based on risk tolerance, not probability."

  ---

  # Application to Your Three Cases

  ### Case 1: Seasonal Ensemble (40% Below-Normal Rain) + Field Reports
  *   **Step 1 (Lineage):** Physical Process (Climate Ensemble).
  *   **Step 2 (Admissibility):** **FAIL.** You noted field reports that "short rains have already failed upstream."
      *   *Analysis:* If the rains have *failed*, the meteorological chance of rain is now effectively 0. The 40% figure is stale. It represents the chance *as of March*, not *as of June*. This is inadmissible evidence (outcome leakage).
  *   **Step 3 (Reference Class):** Irrelevant due to Step 2 failure.
  *   **Step 4 (Classification):** **Class C (Unquantifiable/Resolved).**
  *   **Action:** Do not put "40%" in the memo. The memo must state: "Physical models issued in March indicated risk, but current field verification confirms rainfall failure. Planning should proceed on the basis of confirmed deficit, not probabilistic risk."
  *   **Director Pushback:** The Director will want to keep the 40% to show "we followed the science."
  *   **Counter:** "Following the science means updating on new evidence. Using the old number is scientifically invalid."

  ### Case 2: Internal Market (25% Displacement Capacity)
  *   **Step 1 (Lineage):** Human Aggregation (Prediction Market).
  *   **Step 2 (Admissibility):** Pass. The quarter is not over.
  *   **Step 3 (Reference Class):** **FAIL/CAUTION.** "Displacement site capacity" is not a repeatable trial with a stable physical setup. It depends on policy, conflict, and funding. There is no "objective chance" here. The market is calibrated (maybe), but it is tracking *belief*, not *physics*.
  *   **Step 4 (Classification):** **Class B (Aggregated Credence).**
  *   **Action:** You may use the 25%, but the memo must read: "Internal market participants assign a 25% likelihood."
  *   **Audit Defense:** If audited, you do not say "There was a 25% chance." You say "Our best aggregated judgment was 25%." This protects you if the event happens; you claimed *belief*, not *propensity*.
  *   **Note on N=12:** The procedure flags small trader pools as high volatility. Add a footnote: "Based on limited pool (N=12)."

  ### Case 3: Vendor Flood Model (0.4% Annual Probability, No Record)
  *   **Step 1 (Lineage):** Likely Modelled Judgment (Vendor models for rare floods often rely on expert priors for parameters). Even if Physical, see Step 3.
  *   **Step 2 (Admissibility):** Pass.
  *   **Step 3 (Reference Class):** **CRITICAL FAIL.** "No comparable event in the record."
      *   *Analysis:* A probability of 0.4% (1 in 250 years) requires a reference class stable enough to estimate the tail. If there is no record, this number is derived from assumptions, not data. This is the definition of Pseudo-Precision.
  *   **Step 4 (Classification):** **Class C (Unquantifiable Uncertainty).**
  *   **Action:** **Refuse the number.** Do not put 0.4% in the memo.
  *   **Memo Language:** "Vendor models suggest a non-zero risk of large-scale flood, but historical records are insufficient to quantify probability. Planning assumes the event is possible."
  *   **Director Pushback:** This will be the hardest fight. The Director wants a number for cost-benefit analysis.
  *   **Counter:** "A specific number here is a liability. If the flood happens, the donor will ask how we calculated 0.4% with no data. We cannot reconstruct that math. We must treat this as a scenario, not a probability."

  ---

  # The Philosophical Audit (Read This Before Implementing)

  You asked me to flag where the procedure relies on contested theory. Here is the breakdown. If your analysts understand statistics but not philosophy, they will treat this checklist as mechanical. You need to know where the mechanics hide metaphysical bets.

  ### 1. The Existence of Objective Chances (Confidence: High)
  **The Issue:** The Principal Principle requires *Objective Chances* ($Ch$).
  **The Reality:** In Case 1 (Weather), $Ch$ likely exists (or is a useful fiction that behaves like it). In Cases 2 and 3 (Displacement/Conflict/Flood in novel basins), there are **no Lewisian objective chances**. These are unique historical events, not repeatable trials of a stable chance setup.
  **The Procedure's Fix:** The ETP forces Class B or C for these.
  **The Risk:** Your Director operates in a world where *all* risk must be quantified. By forcing Class C, you are telling them "There is no number."
  **My Advice:** Be plain with your Director: "For conflict and novel disasters, probability is a metaphor. If we treat it as math, we will fail the audit."

  ### 2. The Calibration Shortcut (Confidence: High)
  **The Issue:** Your colleague argues that a calibrated source tracks "something real."
  **The Reality:** Calibration measures *reliability of the reporter*, not the *ontology of the event*. A crystal ball that is right 90% of the time is calibrated, but it does not generate objective chances.
  **The Procedure's Fix:** Step 3.2 explicitly separates Calibration from Ontology.
  **The Risk:** Analysts may conflate "Well-Calibrated Expert" with "Physical Chance."
  **My Advice:** Emphasize Step 1. If the source is human opinion, it stays human opinion, even if that opinion is mathematically processed.

  ### 3. Time-Relativity of Chance (Confidence: Medium)
  **The Issue:** Chances change over time. A chance at $t_1$ is not the chance at $t_2$.
  **The Reality:** In Case 1, the March forecast is a chance *relative to March information*. By June, with field reports, the chance has collapsed.
  **The Procedure's Fix:** Step 2 (Admissibility Check).
  **The Risk:** Analysts might treat the "latest" number as the only valid one, ignoring that "latest" might be stale relative to field reality.
  **My Advice:** Ensure "Field Reports" count as evidence that overrides model outputs in the hierarchy.

  ### 4. The "No Chance" Framing (Confidence: Very High)
  **The Issue:** You asked if the framing itself is wrong.
  **The Reality:** **Yes.** For a large share of your events (conflict onset, displacement, novel floods), the Principal Principle does not reach them. There is no $Ch(A)$ to defer to. There is only $C(A)$ (your credence).
  **The Procedure's Fix:** The ETP classifies these as Class B or C, effectively admitting that PP is not in play.
  **My Advice:** Do not try to force PP onto social events. Use the ETP to *protect* the organization from the false confidence that PP implies. When you hand the Director a Class C memo, you are saying: "This is a value judgment, not a statistical inference."

  ### Final Recommendation
  The procedure is safe to deploy, but only if you brief your Director on **Class C**.
  *   **Class A** is science.
  *   **Class B** is consensus.
  *   **Class C** is leadership.

  If you hand a Director a Class C memo, you are telling them: "The math stops here. You must decide based on values (risk tolerance, humanitarian mandate), not probabilities." That is the most dangerous thing you can say to an operations lead, but it is the only thing that will survive an audit when the "0.4%" event actually happens.
