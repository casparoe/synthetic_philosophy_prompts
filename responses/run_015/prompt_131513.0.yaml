answer: |-
  Here is the specification sheet for a Gradational Moral Status (GMS) theory. This is framed as a set of engineering constraints. If your theory violates the **Non-Negotiables**, it is functionally broken. If it violates the **Camp Preferences**, it just picks a side in a metaphysical debate.

  ### I. The Desiderata Specification

  #### 1. The Homeostatic Floor (Thermostat Constraint)
  *   **The Spec:** The theory must assign exactly zero moral status to systems that exhibit goal-directed homeostasis without phenomenological experience.
  *   **The Motivating Case:** A thermostat regulates temperature (a "goal") via negative feedback (a "mechanism"). A worm does the same for body heat. If moral status tracks "teleology" or "self-maintenance," the thermostat gets a non-zero slice. If it tracks "complexity," a hurricane might outrank a beetle.
  *   **The Trap:** Most gradational theories define status via "interests." But to have an interest, you must care about the outcome. A thermostat does not *care* if it freezes. The theory must distinguish *functional regulation* from *valenced experience* without smuggling in a binary "conscious/not" switch.
  *   **Status:** **Non-Negotiable.** If a thermostat has 0.0001 moral weight, the theory implies we have a prima facie duty not to turn up the heat, which is absurd.

  #### 2. The Mereological Ceiling (Ant-Colony Constraint)
  *   **The Spec:** The moral status of a composite system must not simply be the arithmetic sum of its parts, nor can the whole automatically eclipse the parts.
  *   **The Motivating Case:** An individual ant has low status (let's say $\epsilon$). A colony has $10^6$ ants.
      *   *Scenario A (Summation):* If status is additive, $10^6 \times \epsilon > \text{Human Status}$. This implies we should sacrifice a human to save a burning anthill.
      *   *Scenario B (Holism):* If the colony is a "superorganism" with singular status, does killing the queen destroy the "person" while workers are mere cells?
  *   **The Trap:** Aggregation Swamping. If status is scalar, enough mice must eventually outweigh one person. If your theory says "no," you have implicitly introduced a lexical priority (a binary threshold), contradicting the claim that status is gradational.
  *   **Status:** **Non-Negotiable.** A theory that mandates saving the anthill over the child is rejected by reflective equilibrium.

  #### 3. The Sorites Safety (Continuity Constraint)
  *   **The Spec:** If status is truly continuous, the theory must explain why we do not owe duties to entities with infinitesimal status, without invoking a hidden cutoff.
  *   **The Motivating Case:** The slope from bacterium $\to$ nematode $\to$ beetle $\to$ mouse. If status is a smooth curve $f(x)$, then $f(\text{bacterium}) > 0$.
      *   *Problem:* If $f(\text{bacterium}) > 0$, then killing a bacterium is *pro tanto* wrong. Since we kill billions constantly, we are constant mass murderers.
      *   *Workaround:* Theories often say "weight is too low to register." But "too low to register" is a threshold by another name.
  *   **The Trap:** The "De Minimis" Dodge. You cannot claim continuity while asserting that below level $L$, obligations vanish. That is a step function disguised as a curve.
  *   **Status:** **Jointly Unsatisfiable** (see Section III).

  #### 4. Substrate Neutrality vs. Biological Specificity (Synthetic Network Constraint)
  *   **The Spec:** The theory must determine where a distributed synthetic network lands relative to biological analogues (slime mold) based on structural features, not material composition.
  *   **The Motivating Case:**
      *   *Entity A:* Slime mold (biological, distributed, no central brain, solves mazes).
      *   *Entity B:* Mesh network of simple processors (silicon, distributed, no central CPU, solves mazes).
      *   *Entity C:* Human neuron culture (biological, distributed, integrated).
  *   **The Distinction:** If status relies on *Integrated Information (IIT)*, Entity B and C might rank higher than A depending on connectivity. If status relies on *Evolutionary History*, A and C rank, B is zero. If status relies on *Functional Goal-Direction*, all three rank.
  *   **The Trap:** Carbon Chauvinism. If you grant status to the slime mold but not the functionally identical silicon mesh, you are a biological speciesist. If you grant status to the mesh, you must explain why the thermostat (also a feedback loop) doesn't qualify.
  *   **Status:** **Camp Preference.** (Functionalists demand neutrality; Biologists demand embodiment).

  ---

  ### II. Non-Negotiables vs. Camp Preferences

  | Desideratum | Classification | Why |
  | :--- | :--- | :--- |
  | **Thermostat Exclusion** | **Non-Negotiable** | Failure leads to panpsychist ethics where adjusting your AC is a moral violation. |
  | **No Aggregation Swamping** | **Non-Negotiable** | Failure leads to the "Ants Outweigh Humans" conclusion, violating deep moral intuitions. |
  | **Substrate Neutrality** | **Camp Preference** | Functionalists require it; Bio-conservatives reject it. A theory can survive either way. |
  | **Strict Continuity** | **Camp Preference** | You can have a "tiered" gradational theory (e.g., 5 discrete levels) without collapsing into binary. |
  | **Intrinsic vs. Relational** | **Camp Preference** | Does status exist in the object (Intrinsic) or in the relationship to the observer (Relational)? |

  ---

  ### III. The Impossibility Trilemma (Jointly Unsatisfiable Subset)

  This is the core argument for your essay. You cannot satisfy these three conditions simultaneously. You must drop one.

  1.  **Strict Continuity:** Moral status is a smooth scalar function of capacity (no sharp thresholds).
  2.  **Non-Swamping:** A sufficiently large number of low-status beings cannot outweigh one high-status being (lexical priority).
  3.  **Non-Arbitrariness:** There is no "magic number" where status suddenly jumps or obligations vanish (no hidden thresholds).

  **The Conflict:**
  *   If you keep **(1) Continuity** and **(3) Non-Arbitrariness**, you must accept **(2) is False**. Status sums linearly. Enough beetles outweigh a human. (Utilitarian trap).
  *   If you keep **(2) Non-Swamping** and **(3) Non-Arbitrariness**, you must accept **(1) is False**. You need a discontinuous jump (a threshold) where beings acquire "rights" that cannot be traded off. (Kantian trap).
  *   If you keep **(1) Continuity** and **(2) Non-Swamping**, you must accept **(3) is False**. You must introduce a "discounting function" where status approaches zero asymptotically but obligations vanish at point $X$. This is mathematically a hidden threshold. (Pragmatic trap).

  **Conclusion:** A coherent Gradational Moral Status theory *must* violate one of these. Most fail by hiding the violation.

  ---

  ### IV. Scoring the Main Views

  Here is how the standard contenders break against the spec.

  #### 1. Scalar Capacity Theories (e.g., Singerian Utilitarianism)
  *   **Mechanism:** Status = Capacity for Suffering/Pleasure.
  *   **Thermostat:** **Pass.** (Assumes thermostats don't suffer).
  *   **Ant-Colony:** **Fail.** (Swamping). If an ant feels 1 unit of pain and a human 1000, you only need 1001 ants to justify sacrificing the human.
  *   **Continuity:** **Pass.** (Embraces the curve).
  *   **Verdict:** Mathematically consistent but morally counter-intuitive on aggregation.

  #### 2. Ecological/Relational Gradations
  *   **Mechanism:** Status depends on the relationship to the moral community (e.g., "dependents," "neighbors," "kin").
  *   **Thermostat:** **Pass.** (No relation).
  *   **Ant-Colony:** **Pass.** (We relate to humans differently than ants; avoids swamping).
  *   **Continuity:** **Fail.** (Status shifts based on context, not intrinsic scalar properties).
  *   **Synthetic Network:** **Fail/Unstable.** If we befriend the AI, it gets status. If we don't, it doesn't. Makes status arbitrary.
  *   **Verdict:** Solves the swamping problem by cheating (making status extrinsic).

  #### 3. The Hybrid View (Binary Status / Gradated Welfare)
  *   **Mechanism:** You either have "Rights-Bearing Status" (Binary) or you don't. Inside the "Rights-Bearing" club, welfare interests are gradated.
  *   **Thermostat:** **Pass.** (Outside the club).
  *   **Ant-Colony:** **Pass.** (Ants outside, Humans inside. No swamping).
  *   **Continuity:** **Fail.** (Explicitly rejects continuity at the threshold).
  *   **Sorites:** **Fail.** (Cannot explain the borderline case of the higher primate without arbitrariness).
  *   **Verdict:** The most robust against edge cases, but abandons the premise of *gradational status* entirely. It's a binary theory with gradational *obligations*.

  ### Summary for your Essay
  The thermostat comparison breaks theories that rely on **teleology** (goal-direction). The ant-colony problem breaks theories that rely on **aggregation** (summing utility). The impossibility trilemma shows that **Gradational Status** is likely incoherent unless you admit a hidden threshold.

  If you want to defend gradational status, your best move is to argue for **Non-Linear Scaling**: Moral weight increases exponentially with cognitive complexity, not linearly. This mathematically prevents swamping (a human is $\infty$ times more valuable than a beetle, not $1000\times$) while maintaining a scalar metric. But be warned: an exponential curve looks suspiciously like a step function.
