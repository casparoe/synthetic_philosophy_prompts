prompt: |-
  hey im in this bioethics/philosophy of mind seminar and we got into whether moral status is binary or gradational — like, is a beetle just "less sentient" or does it fall below some line? my prof threw out the thermostat comparison and i cant stop thinking about it.

  i need the full desiderata for a theory that assigns moral status by degrees. not just "list criteria" — i mean the actual spec: what cases it has to get right, what distinctions it cant collapse, what biology results it cant contradict. for each one, give me the motivating case or puzzle behind it.

  specifically, cover:
  - the ant-colony problem: if sentience is distributed across a colony, does the group have more status than the sum of its parts, or does aggregation dilute individual weight?
  - the thermostat lower bound: how do you keep homeostatic devices from earning a nonzero slice of status just because they regulate temperature?
  - continuous vs step-function: if status is genuinely scalar, do you avoid giving every bacterium an infinitesimal moral weight? and can you do that without smuggling in a hidden threshold?
  - synthetic distributed networks — imagine a mesh of simple processors with no central brain but clear goal-directed homeostasis — where should they land, and what feature distinguishes them from slime mold?

  flag which desiderata are non-negotiable and which are just camp preferences (maybe neural-correlate determinism vs functional pluralism?). also tell me if any subset is jointly unsatisfiable — like continuous gradation + no aggregate-swamping + no hidden thresholds. thats the part i really need for my essay.

  then briefly, how do the main views do? im thinking scalar capacity theories, ecological/relational gradations, and that "all-or-nothing status but gradated welfare" hybrid. score them quick against your list, but dont write a textbook — the criteria are the point.

  no citations needed, just conceptual work. and please dont just say "consciousness, autonomy, etc" — i want the edge cases that actually break theories.
