      *   *Constraint 1: The Thermostat Lower Bound.* Why is this hard? Because homeostasis is necessary but not sufficient for sentience. A theory based purely on "goal-directedness" or "self-maintenance" fails here.
      *   *Constraint 2: The Ant-Colony Problem (Aggregation).* If status is additive, a billion ants > one human? If status is holistic, does the colony count as one entity? This touches on the "Problem of Many" and mereology.
      *   *Constraint 3: The Continuity/Threshold Tension.* If status is a smooth curve, do bacteria matter? If we say "no," did we sneak in a threshold? This is the "Sorites Paradox" applied to ethics.
      *   *Constraint 4: Substrate Independence vs. Biological Chauvinism.* The Synthetic Network case. If it acts like a mind but isn't carbon-based, does it count? If it acts like slime mold but is silicon, is it different?

  3.  **Identify Non-Negotiables vs. Camp Preferences:**
      *   *Non-Negotiable:* Must distinguish thermostats from mice (otherwise the theory is absurd). Must handle aggregation without implying a swarm of ants outweighs a person (usually). Must be consistent (no hidden thresholds if claiming continuity).
