          *   Include notes on where the tree fails to separate views cleanly.
          *   Indicate where respondents might land in "no-man's-land" (combinations not mapping to named views).
          *   Tone: Educational, precise, accessible but rigorous.

  2.  **Deconstruct the Philosophical Landscape:**
      *   *Strict Generalism:* There are invariant moral principles. A feature (e.g., lying) always counts against an action (or has a fixed weight) regardless of context. Moral expertise = applying rules.
      *   *Strict Particularism (Dancy):* Holism of reasons. A feature's moral valence (favor/oppose/neutral) can change depending on context. No invariant principles. Moral expertise = perception/sensitivity.
      *   *Hybrid 1 (Epistemic Particularism / Metaphysical Generalism):* Reasons *do* have fixed weights metaphysically, but humans can't access them via rules; we must perceive cases. (Often associated with certain intuitionists or virtue ethicists).
      *   *Hybrid 2 (Second-Order Generalism / First-Order Holism):* First-order reasons (lying, kindness) behave holistically, *but* there are higher-order rules about how to weigh them (e.g., "Always maximize the balance of reasons"). Or, "Holism applies to features, but principles apply to actions."
      *   *Flexible Generalism (Default Position):* Principles have *ceteris paribus* clauses. "Don't lie, unless..." This is often what people think they mean when they say they are generalists.

  3.  **Drafting the Nodes (Iterative Process):**

      *   *Attempt 1 (Too technical):* Do you believe in holism of reasons? (Bad, uses jargon).
      *   *Attempt 2 (Better):* Can lying ever be good? (Too simple, misses the "reason" aspect).
      *   *Attempt 3 (Focusing on the *behavior* of the reason):* Imagine lying to protect a friend. Does the lie itself still count *against* the action, even if the action is overall right? Or does the lie become neutral/good in that context?
          *   *Refinement:* This distinguishes *valence change* (Particularism) from *weighing* (Generalism).

      *   *Node 1: The Valence Test.*
          *   Scenario: Telling a lie to spare feelings.
          *   Question: In this specific case, does the fact that "it is a lie" still count *against* doing it (even if kindness outweighs it), or does the fact that "it is a lie" stop counting against it (or even count *for* it) entirely?
          *   Branch A: It still counts against, just outweighed. (Leads toward Generalism).
          *   Branch B: It stops counting against or flips to counting for. (Leads toward Particularism/Holism).

      *   *Node 2: The Invariance Test (for Branch A).*
          *   If they said "It still counts against," we need to know if *any* feature is invariant.
          *   Question: Is there *any* feature (like causing pain, or keeping a promise) that *always* counts against an action, no matter what story you tell?
          *   Branch A: Yes, at least one feature is invariant. (Strict Generalism).
          *   Branch B: No, even pain could theoretically count in favor in some bizarre context. (Flexible Generalism / *Ceteris Paribus* view). *Wait, this needs to distinguish Epistemic Particularism.*

      *   *Node 3: The Expertise/Access Test (Crucial for Hybrids).*
          *   Question: How does a moral expert make a decision? Do they match the situation to a rule they know (even a complex one), or do they just "see" what matters without needing a rule?
          *   Branch A: They apply rules (even complex ones).
          *   Branch B: They perceive salience directly; rules are just post-hoc summaries.

      *   *Node 4: Second-Order Principles (For the Holists).*
          *   If reasons change valence, is there still a rule for the *final* judgment?
