      *   **Branch 3:** If flip, is there a higher-order rule?
      *   **Branch 4:** Epistemic access (Rules vs. Perception).

      *Correction:* To capture "Epistemic Particularism" (Metaphysical Generalism), I need to separate *how reasons work* from *how we know them*.
      To capture "Second-Order Generalism," I need to separate *first-order reasons* from *final judgment rules*.

