answer: |-
  Here is a decision-tree taxonomy designed for your study group. It avoids technical jargon in the questions themselves, focusing instead on how moral reasons *behave* in concrete situations.

  The goal of this tree is not to force you to pick a "team," but to map the logical commitments of your intuitions. You may find that your answers lead to a leaf that feels uncomfortable, or that you want to answer "it depends" on a question that demands a "yes" or "no." That is often where the most interesting philosophy happens.

  ### **The Moral Reasons Taxonomy**

  **Instructions:** Start at **Node 1**. Read the scenario and the question. Follow the arrow corresponding to your honest intuition. Continue until you reach a **Leaf Station**.

  ---

  #### **NODE 1: The Valence Test (Metaphysical Holism)**
  **Scenario:** Imagine a doctor who tells a lie to a patient. In most cases, we say "lying is bad." But in this specific case, the lie prevents the patient from falling into a deadly depression.
  **Question:** In this specific case, does the fact that "it is a lie" still count *against* the doctor's action (even if the good outcome outweighs it), or does the fact that "it is a lie" lose its negative force entirely (or perhaps even count *in favor* of the action because it was protective)?

  *   **A.** It still counts *against* the action. It is a "cost" that is simply outweighed by the benefit. **(Go to Node 2)**
  *   **B.** It loses its negative force entirely, or flips to count *in favor*. The context changes what the lie *is*, morally speaking. **(Go to Node 3)**

  ---

  #### **NODE 2: The Invariance Test (Atomism vs. Holism)**
  *(You answered that reasons keep their fixed weight, like weights on a scale.)*
  **Question:** Is there **any** feature of an action (e.g., "causing pain," "breaking a promise," "killing an innocent") that you believe counts against that action in **every single possible universe and context**, no matter how strange the story gets?

  *   **A.** Yes. At least one feature (like causing pointless pain) is always wrong-making, forever. **(Go to Node 4)**
  *   **B.** No. I can imagine a bizarre context where even "causing pain" might not count against an action (perhaps in a simulation, or a specific ritual). **(Go to Leaf: Flexible Generalism*)**

  ---

  #### **NODE 3: The Architect Test (Second-Order Principles)**
  *(You answered that reasons change their moral shape depending on context.)*
  **Question:** Even if specific features (like lying) change their meaning, is there still a single, invariant rule for making the **final decision**? (For example: "Always choose the action with the best overall balance of reasons" or "Always do what a virtuous person would do.")

  *   **A.** Yes. There is a supreme rule for how to weigh these shifting reasons to get the right final answer. **(Go to Leaf: Second-Order Generalism)**
  *   **B.** No. There are no invariant rules, not even for the final judgment. The right action is just what fits this unique situation. **(Go to Leaf: Strict Particularism)**

  ---

  #### **NODE 4: The Map vs. Compass Test (Epistemic Access)**
  *(You answered that features have fixed weights and some are invariant.)*
  **Question:** How does a moral expert (a truly good person) make a decision? Do they match the situation to a rule (even a very complex one) they have learned, or do they simply "perceive" the right thing directly, where rules are just clumsy summaries we write afterward?

  *   **A.** They match the situation to rules. Moral knowledge is knowing the principles. **(Go to Leaf: Strict Generalism)**
  *   **B.** They perceive the right thing directly. Rules are just training wheels or post-hoc explanations; they don't actually guide the expert. **(Go to Leaf: Epistemic Particularism)**

  ---

  ### **Leaf Stations (The Views)**

  #### **Leaf 1: Strict Generalism**
  *   **Path:** 1A → 2A → 4A
  *   **The View:** Moral reasons are like atoms; they have fixed properties. Lying always counts against an action. Causing pain always counts against an action. There are exceptionless moral principles, and moral expertise consists in knowing and applying these principles correctly.
  *   **Classic Proponent:** Immanuel Kant (on some readings), certain Natural Law theorists.

  #### **Leaf 2: Strict Particularism**
  *   **Path:** 1B → 3B
  *   **The View:** Moral reasons are holistic. A feature that is a virtue in one context (e.g., loyalty) can be a vice in another (e.g., loyalty to a criminal). There are no invariant principles, not even a "maximize the good" principle. Moral expertise is a perceptual skill, like a painter knowing exactly which shade of blue fits a canvas.
  *   **Classic Proponent:** Jonathan Dancy.

  #### **Leaf 3: Second-Order Generalism (Hybrid)**
  *   **Path:** 1B → 3A
  *   **The View:** First-order reasons (lying, kindness) behave holistically and change depending on context. *However*, there is a higher-order rule that governs how we settle the final verdict (e.g., "Always act on the balance of reasons"). The *inputs* are particularist, but the *processing mechanism* is generalist.
  *   **Classic Proponent:** Some Act Utilitarians who accept holism of features; certain Pragmatists.

  #### **Leaf 4: Epistemic Particularism (Hybrid)**
  *   **Path:** 1A → 2A → 4B
  *   **The View:** Metaphysically, reasons might have fixed weights (lying is always a negative). *However*, human beings cannot access these weights through rules. The rules are too complex or numerous. Therefore, we must rely on perception and intuition to navigate them. We are particularists in practice, but generalists in theory.
  *   **Classic Proponent:** Certain Intuitionists (e.g., W.D. Ross, on some readings); some Virtue Ethicists.

  #### **Leaf 5: Flexible Generalism (*Ceteris Paribus*)**
  *   **Path:** 1A → 2B
  *   **The View:** Features generally have a fixed direction (lying is usually bad), but there are no features that are *strictly* invariant. Principles hold "all other things being equal." This view tries to walk the line: it keeps the structure of generalism but admits exceptions are always possible.
  *   **Note:** Many philosophers argue this view collapses into Strict Particularism if the "exceptions" become too frequent.

  ---

  ### **Notes on Limitations & "No-Man's-Land"**

  **1. The "Ceteris Paribus" Collapse**
  This tree cannot cleanly separate **Flexible Generalism (Leaf 5)** from **Strict Particularism (Leaf 2)**.
  *   *Why?* If you believe principles always have "unless..." clauses attached to them, a Strict Particularist will ask: "If the 'unless' clauses are infinite and depend on the context, how is that different from having no principle at all?"
  *   *Where you might get stuck:* If you answered **1A** (lying still counts against) but **2B** (no feature is truly invariant), you are in a unstable position. You believe reasons have fixed weights, but those weights can be neutralized by *any* context. This is often called "Moderate Generalism," but Dancy would argue you are secretly a particularist.

  **2. The Definition of "Rule"**
  This tree struggles to separate **Strict Generalism (Leaf 1)** from **Epistemic Particularism (Leaf 4)**.
  *   *Why?* It depends on what you mean by a "rule." If a rule is "Do what is right," that is a rule everyone accepts. If a rule is "Never lie," only the Strict Generalist accepts it. The Epistemic Particularist believes rules exist but are too complex for human brains to use as algorithms.
  *   *Where you might get stuck:* If you think rules exist but humans can't use them directly, you might feel pulled between Leaf 1 and Leaf 4. This is a genuine debate in meta-ethics about the difference between *regulative* rules (that guide action) and *constitutive* rules (that describe reality).

  **3. The "Second-Order" Trap**
  **Second-Order Generalism (Leaf 3)** is often accused of being a view in name only.
  *   *Why?* If the only rule is "Do the best thing overall," that rule doesn't actually help you decide anything unless you already know how to weigh the reasons. If you need perception to weigh the reasons, does the rule do any work?
  *   *Where you might get stuck:* If you answered **1B** (reasons flip) and **3A** (there is a final rule), ask yourself: Does that final rule actually help you make a decision, or does it just describe what you did after the fact? If it's the latter, you might actually belong at **Leaf 2**.

  ### **Discussion Prompt for Your Group**
  If you find yourself landing in "No-Man's-Land" (wanting to answer "Yes" and "No" to the same node), try to articulate *why* the question feels like a false dichotomy.
  *   *Example:* "I think lying counts against the action (1A), but only if the lie is malicious. If it's protective, it's not really a 'lie' in the moral sense."
  *   *Analysis:* This suggests you are redefining the feature itself based on the context. This is a sophisticated move that often leads back to **Strict Particularism**, because it means you cannot identify the feature ("lying") without already knowing the moral context.
