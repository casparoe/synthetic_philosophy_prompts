      3.  **Node 3 (Expertise/Access):** How do we learn to be good? Rules vs. Perception.
      4.  **Node 4 (Final Judgment):** Is there a rule for the "all-things-considered" verdict?

  5.  **Drafting the Content (incorporating constraints):**
