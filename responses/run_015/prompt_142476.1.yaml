      *   *Correction/Nuance:* The prompt says decapods "fall outside those rules." This is largely true for EU 1099/2009, though some member states have national rules. The UK 2022 Act recognizes sentience but doesn't automatically mandate specific slaughter methods identical to vertebrates without secondary legislation. The ice slurry is often used for shrimp/prawns, less so for large lobsters (where boiling or electrical stunning like Crustastun is proposed). I need to be careful not to overstate the uniformity of the "ice slurry" rule across all Europe, but accept the user's premise as the general regulatory baseline for analysis while noting the lag between sentience recognition and slaughter protocol.
      *   *Key Distinction:* Fish (vertebrates) vs. Decapods (invertebrates).

  3.  **Philosophical Analysis - The Three Sticking Points:**
      *   *1. Taxonomic Proxy:* Why use vertebrate status? It's a heuristic. For it to be legitimate despite systematic error (excluding sentient invertebrates), it must be grounded in administrative feasibility or a specific conception of moral risk. It presupposes that the cost of false negatives (excluding sentient beings) is outweighed by the cost of false positives (regulating non-sentient beings) or the cost of verification. It implies a "status-based" ethics rather than a "capacity-based" ethics in practice, even if capacity is the theoretical justification.
      *   *2. Auditable Indicators:* Can moral boundaries be drawn by instruments? This touches on operationalism. If we can't measure it, does it count? A coherent theory here is "regulatory positivism" – obligations exist only where compliance can be objectively verified by an inspector. It shifts the ontology of suffering from a phenomenological state to a behavioral/physiological marker.
      *   *3. Probability of Sentience:* Is probability evidential or metaphysical? If I'm 90% sure a crab feels pain, do I owe it 90% of the protection? Or do I owe it full protection because the risk is non-negligible (precautionary principle)? The current practice suggests probability is treated as a threshold for *inclusion* rather than a dimmer switch for *status*. Below the threshold, status is zero. Above, it's full.
      *   *4. The Slurry Method:* What does it presuppose about death? Ice slurry causes thermal shock and eventual hypothermia/anoxia. If this is acceptable, it presupposes that the *process* of dying is only bad insofar as it involves conscious suffering. If the animal is insensible quickly, the method matters less. However, if the slurry is both stunning and killing, it implies that the *act* of killing isn't intrinsically wrong, only the *experience* of it. It also suggests a commodification where efficiency (batch processing) outweighs individual handling.

