      *   *Instrumentation:* Address the "measurement gap." The theory is that moral obligations in law require enforceable standards. No marker = no standard = no rule. This is a theory of legal moralism constrained by epistemology.
      *   *Probability:* Distinguish between epistemic probability (we don't know) and moral weight. The practice treats probability as a gatekeeper.
