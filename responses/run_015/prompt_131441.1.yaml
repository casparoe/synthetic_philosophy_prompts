answer: |-
  **MEMORANDUM**

  **TO:** Consciousness-Science Center Review Board & Funding Partners
  **FROM:** Board Executive Committee
  **DATE:** October 23, 2023
  **SUBJECT:** Decision on Proposal #CS-2023-09 (LLM-Mediated Heterophenomenology in MCS)
  **STATUS:** **APPROVE WITH CONDITIONS**

  ### 1. Executive Summary
  The Review Board has completed its evaluation of the proposal to apply heterophenomenological methods to patients in Minimal Consciousness States (MCS) via LLM-generated synthetic narratives. The Board recognizes the urgent need for novel methodologies in MCS research. However, the methodological divergence from standard heterophenomenology is significant.

  Consequently, the Board recommends **Approval with Strict Methodological and Ethical Conditions**. We cannot endorse this project as a direct application of Dennettian heterophenomenology without qualification, as this risks conceptual inflation. Instead, we authorize it as a pilot study in *Synthetic Narrative Reconstruction*, contingent on the safeguards outlined below.

  ### 2. Addressing the Methodological Objection
  A substantial portion of the Board argues that this protocol corrupts the core mechanism of heterophenomenology. We take this objection seriously.

  **The Objection:** Classical heterophenomenology relies on the "intentional stance" toward a subject who produces a report (a text) that they can, in principle, affirm or deny. The subject is the author of the phenomenology, even if the researcher brackets the truth of that content. In this proposal, the "text" is authored by an algorithm trained on biometrics. The MCS patient cannot affirm, deny, or correct the output. Therefore, the output is not a *report* of experience, but a *simulation* of experience.

  **The Board's Position:** We agree that treating LLM output as equivalent to a subject's verbal report violates the epistemic chain of heterophenomenology. If we label this simply as "heterophenomenology," we dilute the term to the point of meaninglessness. However, we also acknowledge that strict adherence to traditional methods excludes MCS patients entirely.

  **Resolution:** The project may proceed only if the team explicitly distinguishes their output from traditional heterophenomenological texts. The synthetic narratives must be categorized as **Third-Person Simulations of First-Person Structure**, not as "subject reports." This preserves the integrity of the original method while allowing the experimental extension to be tested on its own merits.

  ### 3. Conditions of Approval
  To mitigate the risks of methodological corruption and ethical overreach, the following conditions are mandatory:

  1.  **Terminological Constraint:** In all publications and public communications, the team must not refer to the LLM outputs as "heterophenomenological texts" without the qualifier "synthetic" or "model-generated." The methodology section must explicitly cite the deviation from Dennett's standard protocol.
  2.  **Caregiver Validation Loop:** While the patients cannot verify the texts, primary caregivers and family members must review the generated narratives. They will not be asked to verify "truth" (which is bracketed), but to flag "gross incongruities" (e.g., narratives that contradict known medical history or aversions). This serves as a sanity check against algorithmic hallucination.
  3.  **Data Transparency:** The training data (eye-tracking/vocalization fragments) and the specific LLM weights used to generate the texts must be made available to the Board for audit prior to publication. We must verify that the model is not simply regurgitating training data from *other* subjects.
  4.  **Ethical Oversight:** Given the vulnerability of MCS patients, the team must submit a supplementary protocol to the University IRB specifically addressing the "Right to Inner Silence." We must ensure that generating synthetic inner voices for non-consenting subjects does not violate their dignity.

  ### 4. Course of Action & Timeline
  The funding partner requires a final decision by next Thursday. The following timeline ensures we meet that deadline while implementing the conditions above.

  *   **October 24–27 (Immediate):** Principal Investigators (PIs) revise the methodology section to reflect the "Synthetic Narrative" distinction rather than pure heterophenomenology.
  *   **October 30 (Monday):** Board Executive Committee reviews revised terminology to ensure it satisfies the "corruption" objection.
  *   **November 1 (Wednesday):** Final Board Vote on the conditioned proposal.
  *   **November 2 (Thursday):** **Formal Decision transmitted to Funding Partner.**
  *   **November 15:** PIs submit supplementary IRB protocol regarding "Right to Inner Silence."
  *   **Month 3 of Grant:** Interim review by the Board to assess the first batch of synthetic texts for "gross incongruities" before full-scale generation begins.

  ### 5. Confidence and Uncertainty Statement
  **Confidence Level:** **Moderate-High.**
  We are confident that the *conditions* listed above sufficiently protect the theoretical integrity of the Center and the ethical rights of the patients. This path allows for innovation without sanctioning a category error.

  **Area of Least Certainty:**
  The Board flags one critical philosophical uncertainty: **Whether synthesizing texts from minimal biometrics actually breaks heterophenomenology or just stretches it past recognition.**
  We are operating on the assumption that the "author" of the text must be the subject. However, if the LLM is merely functioning as a highly complex translation device (translating "eye-movement" to "word"), the line between *translation* and *generation* becomes blurred. We are not certain if this distinction holds under the pressure of empirical results. If the synthetic texts prove clinically useful in predicting patient recovery or comfort, the philosophical distinction may collapse regardless of our conditions. We will monitor this closely during the Month 3 review.

  ***

  **Approved by:**
  *The Executive Committee, Consciousness-Science Center Review Board*
  *(Draft pending final logo design)*
