          *   Entropy increase comes from coarse-graining (ignoring correlations).
          *   Measurement creates correlations (mutual information). Erasure dumps those correlations into the environment (heat).
          *   An objectivist can explain it: The "cost" is the expansion of the environment's phase space required to absorb the correlations from the memory. No "knowledge" needed, just correlation dynamics.
      *   **Question 3: Erasure vs. Measurement Asymmetry:**
          *   This is the crux. Measurement *can* be reversible (CNOT gate). Erasure (RESET) is logically irreversible, which maps to thermodynamically irreversible *if* you want to reuse the device in a standard state.
          *   The asymmetry reveals the **System/Memory Boundary**. If you include the memory in the "system," measurement isn't free (you build correlations). If you treat memory as external, measurement looks free. Erasure is singled out because it's the step where the memory is decoupled from the system and reset, forcing the correlations into the heat bath.
