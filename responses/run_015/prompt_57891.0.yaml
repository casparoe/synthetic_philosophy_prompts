      *(Self-Correction during drafting)*: Make sure to mention the **Sagawa-Ueda** generalization of the Second Law. That is the modern resolution that bridges the gap. $W \ge \Delta F - k_B T I$. This shows explicitly how information (mutual info) acts as a resource.

