          2.  Agent-based (Maxwell's Demon, information erasure costs work, Landauer's Principle).
      *   **Tension:** The course treats measurement/copying as free but erasure as costly, despite both involving correlations at the micro level.
      *   **Core Questions:**
          1.  What view of entropy/information does this pedagogy presuppose? (Ontological identity vs. Observer-relative?)
          2.  Can a fully objectivist view (phase-space volumes) explain the results without invoking knowledge?
