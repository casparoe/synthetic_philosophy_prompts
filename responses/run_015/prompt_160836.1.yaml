  **1. Tier List and Ratings**
  *Note: Ratings are calibrated to the average of the six options (0) under the standard working assumption in wild animal suffering (WAS) literature that wild invertebrate lives are net negative. Higher scores indicate less expected suffering.*

  *   **F. Farmed insect protein (+8):** Minimizes land conversion and explicit field killing by relying primarily on waste streams and indoor facilities.
  *   **A. Grass-finished beef (+6):** Actively reduces the density of vertebrates and likely invertebrates relative to the unmanaged grassland counterfactual.
  *   **D. Conventional arable vegan (+1):** Maximizes land-sparing efficiency, minimizing total habitat created, despite high per-hectare harvest mortality.
  *   **E. Perennial grain vegan (−2):** Lower yields require more land than D, increasing total animal existence enough to offset the reduction in per-pass killing.
  *   **C. Broiler chicken (−5):** Feed conversion inefficiencies require significantly more cropland than plant-direct diets, scaling up field deaths and habitat.
  *   **B. Pasture/Feedlot beef (−8):** Combines the high land use of grazing with the crop-harm of feedlots, maximizing total wild animal existence and harvest deaths.

  **2. Sensitivity Analysis: The Valence Parameter**

  **Ranking A: Wild Lives Net Negative (Suffering > Happiness)**
  **Order:** F > A > D > E > C > B
  **Reasoning:** If wild existence is predominantly suffering, the moral priority is minimizing the total number of wild animals brought into existence or maintained. F creates the least new habitat; A actively suppresses existing wild densities; D is the most land-efficient crop system; B is the least efficient.

  **Ranking B: Wild Lives Net Positive (Happiness > Suffering)**
  **Order:** B > C > E > D > F > A
  **Reasoning:** If wild existence is predominantly good, the priority shifts to maximizing total life-years and minimizing premature death. B supports the highest biomass; A is ranked last because it actively displaces and reduces an existing positive population; F is second-to-last because it minimizes the creation of new positive lives.

  **Robustness and Inversion:**
  The ordering is **not robust** to the valence assumption; it effectively inverts. The relative ranking of the agricultural options (B < C < E < D < F) based on land-use efficiency remains structurally stable, but the *value* assigned to that efficiency flips. Under Net Negative, efficiency is a virtue (fewer animals); under Net Positive, efficiency is a vice (fewer animals). Option A is the most volatile: it moves from the top tier (reducing suffering) to the bottom tier (reducing happiness) because its primary mechanism is the suppression of the counterfactual wild population. The D vs. E comparison is robust regarding land use (D always supports fewer animals), but the moral valence of that difference inverts.

  **3. Epistemic Status and Contested Assumptions**

  **Settled (for the purposes of this exercise):**
  *   **Empirical Stipulations:** Claims (i) through (v) are treated as fixed constraints; specifically, that insecticide landscape effects are negligible and secondary growth density matches cropland density.
  *   **Invertebrate Numeracy:** It is settled that invertebrates outnumber vertebrates by orders of magnitude in agricultural and grassland systems, making them the primary driver of total "animal units" affected.
  *   **Land-Use Correlation:** It is settled that, given stipulation (iii), total land use is the primary proxy for total wild animal existence (Crop + Spared Land).

  **Contested (Load-Bearing Assumptions):**
  *   **Net Valence of Wild Lives:** The entire ranking inverts based on whether wild lives are net negative or positive. This is the single most significant contested empirical/normative claim in WAS ethics (e.g., Horta vs. classical ecological views).
  *   **Invertebrate Moral Weight:** The ranking assumes invertebrate suffering/happiness aggregates meaningfully against vertebrate experiences. If one adopts a vertebrate-only sentience threshold, Option A's ranking improves significantly relative to F and D.
  *   **Aggregation and Totalism:** The analysis assumes Total Utilitarianism (more lives = more value/suffering). If one holds a Critical Level view or a Non-Identity view where adding happy lives is neutral, the Net Positive ranking collapses.
  *   **Cluelessness (Ecological Feedback):** The model assumes linear land-use effects. It is contested whether long-run trophic cascades or evolutionary feedback from practices like E (no-till) might swamp the immediate calculus of harvest deaths.
  *   **Premature Death vs. Suffering:** In the Net Positive scenario, we assume harvest death is a net negative (cutting a good life short). If death is instantaneous and painless, this disvalue decreases, potentially narrowing the gap between D and E.

  **Confidence Score:** 0.15
  **Findings That Would Change This Number:**
  1.  **Definitive Sentience/Valence Metric:** A scientifically validated measure of the hedonic tone of wild invertebrate life (e.g., proof that stress responses in insects constitute suffering comparable to vertebrates, or proof that they lack valenced experience entirely).
  2.  **Land-Sparing Density Differential:** Empirical data showing that "secondary growth" land supports significantly *lower* wild animal densities than active cropland (contradicting stipulation iii), which would make high-yield options (D, F) overwhelmingly superior under the Net Negative view.
