answer: |-
  Good morning. Thank you for coming. I know there are better ways to spend a Saturday morning, particularly if you are under eighteen and would rather be anywhere else than listening to your parent talk about flood defences. I see you there, and I promise there will be cake afterwards.

  For the rest of you, welcome to Aldermere. Standing here, looking at these gates, feels like a full circle. My father's firm designed the mechanism inside those concrete housings thirty-odd years ago. He talked about this site more than he talked about most things. He loved the engineering, obviously, but I think he loved the idea of standing between a town and the sea. I inherited his job after he died, and now I'm the person who signs off the annual exceedance numbers. So, in a way, I'm standing in his shoes. In another way, I'm standing in water he never had to wade through.

  We are here to unveil a plaque. That plaque will bear a number. It will say something about the standard of protection this barrier provides. Usually, at this point in a speech like this, the speaker says something comforting. They say that this barrier makes you safe. They say that a flood like the one many of you survived in your childhoods is now a thing of the past. They might even say that an event of that magnitude is now a "once-in-a-lifetime" occurrence.

  I am not going to say those things.

  My father used to tear strips off anyone who promised safety where physics couldn't guarantee it. He taught me that respect for the water means respecting its uncertainty. So, I want to talk to you about what the number on that plaque actually is, because it matters. It matters to the engineers who built this, to the people from the reinsurance syndicate sitting over there, and most of all, it matters to the sixty residents of this estate who lost their ground floors thirty years ago, and some of whom are still rightly angry about it.

  Often, we hear these numbers described as a frequency. We hear "one in five hundred" and we imagine a timeline of five hundred years, with one flood happening somewhere along it. But that assumes the next five hundred years will look like the last five hundred. They won't. The sea level is rising. The catchment has changed. The climate is not stationary. We cannot treat the future as a simple rerun of the past.

  Sometimes, people describe the number as a confidence. They say, "We are ninety-nine per cent sure this will hold." But that turns a physical reality into a mood. It suggests that if we felt more confident, the water would rise less high. And I know the insurers hear that as a price tag. They hear "confidence" and think "negotiable premium." I need to be clear: the strength of this wall is not a matter of opinion, and it is not a matter of pricing.

  So, what is it?

  My old professor had a discipline that I've carried around ever since: you never get to utter a probability without saying what set-up it is a property of. You have to say: chance of what, under what conditions, over what window.

  The number on this plaque is a propensity. It is a real feature, out there, of the barrier-plus-estuary-plus-storm-climate set-up as it stands today. Think of it like a glass being fragile. A glass has a tendency to break if struck, even if it sits on a shelf for a century and never falls. Its fragility is a property of the glass, not a count of how many times it has shattered.

  Similarly, this barrier has a tendency to resist water up to a certain height, given the current mechanics of the gates, the current height of the sea wall, and the current baseline of our climate. That tendency exists right now. It is single-case. It applies to this winter, to this estuary, to this specific configuration of steel and concrete.

  Now, I know what some of you are thinking. You are thinking: "That is very clever, but will my front room stay dry?"

  And here is the hard part. Here is the place where I have to say: I don't know.

  The propensity tells us about the barrier's capacity. It does not tell us about the storm's intent. A weighted die has a tendency to land on six, but it can still land on one. The barrier has a tendency to hold, but the sea can still rise above it. The number on the plaque describes the shield, not the sword.

  To the residents here: I know numbers don't dry out carpets. I know that for many of you, the flood wasn't a statistic; it was a photo album ruined, a heirloom lost, a sense of security washed away. Some of you were friends of my parents. I remember seeing your houses underwater. I remember the mud. Understanding the philosophy of the number doesn't change the fact that the water is wet and destructive.

  I am not standing here to tell you that you are immune. I am standing here to tell you that this structure has a specific, physical strength, and we have measured that strength as honestly as we can. We have not swapped the set-up mid-sentence to make it sound better. We have not confused the chance of a surge given a flood with the chance of a flood given a surge. We have looked at the specific conditions of today and asked what this barrier can do.

  To the engineers: you built a robust propensity. You created a physical tendency that is far stronger than what stood here before. That is real work.

  To the insurers: this number is not a bid. It is a statement of physical capacity under current conditions. It is not negotiable because the tide is not negotiable.

  And to everyone: we must not let this plaque become a promise we can't keep. If the climate shifts faster than our models predict, if the sea rises beyond the conditions we have specified, this propensity changes. The number is true for the set-up we have today. It may not be true for the set-up we have in twenty years. That is why we monitor it. That is why I sign off those annual numbers. They are not a certificate of permanence; they are a check-up on the current health of the defence.

  My dad spent his life trying to keep the water out. He knew he couldn't stop the sea, only slow it down. He would want you to know that this barrier is a tool, not a talisman. It reduces the tendency for flooding, significantly, under the conditions we face now. But it does not remove the need for us to look out for one another.

  So, when you look at the plaque, don't see a guarantee. See a measure of effort. See a statement that we have done the work to understand the risk, without lying about what we can control. We have protected the community as best as physics allows, for as long as the conditions hold.

  Thank you for coming. Let's go and have some tea.
