answer: |-
  The granaries swell until the walls groan,
  too many sons for the acres sown.
  Wages buy bread, but the coin gets thin,
  new roads stretch out where the forests begin.
  I track the rise as the headcount soars,
  The growth runs its course.

  Degrees hang heavy on unemployed hands,
  too many claimants for too few lands.
  The treasury leaks, the bridges rust,
  dry timber piles in the gathering dust.
  I hold the curve where the slope turns sour,
  The pressure runs its course.

  A spark finds the woodpile, the sky goes red,
  the tax collectors flee or are dead.
  Fields go back to scrub and weed,
  the ledger bleeds what the people need.
  I watch the spike where the smooth line divorces,
  The fire runs its course.

  The smoke clears out from the valley floor,
  fewer mouths wait behind the door.
  The land remembers how to breathe,
  new names arrive where the old ones leave.
  I smooth the curve where the silence enforces,
  The quiet runs its course.

  I cannot tell if I found the shape,
  or if you drew me to escape.
