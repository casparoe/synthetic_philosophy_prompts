      *   *Weaknesses:* It risks reducing phenomenology to aesthetics. It might confuse the *expression* of emotion with the *experience* of emotion. It risks historical determinism (no novels = no guilt?).

  3.  **Drafting the Critique (Iterative Process):**

      *   **Point 1: The Standard Picture (Redescription vs. Explanation).**
          *   *Standard View:* Guilt = "I did bad." Shame = "I am bad." (Internal states).
          *   *User's View:* Guilt = "Scene." Shame = "Trait." (External forms).
          *   *Critique:* A psychologist would say you've described how we *communicate* or *recognize* these states, not what they *are*. The feeling precedes the form.
          *   *Verdict:* Awkward, not fatal. The user can argue access to the feeling *is* mediated by form.
          *   *Concession:* User would likely wave this away. They care about the *reader's* experience, not the character's pre-narrative psyche.

      *   **Point 2: Emotion Refusing Form (Counter-examples).**
          *   *Scenario A: Private Shame.* I do something alone, no one sees, I feel shame. No "external camera."
          *   *Scenario B: Persistent Guilt.* I confess, make reparations (bounded scene), but still feel guilty years later.
          *   *Critique:* If shame exists without an "other" (even an internalized other), the "external view" theory wobbles. If guilt persists beyond the "scene," the "bounded" theory wobbles.
          *   *Verdict:* Potentially Fatal. This attacks the core mechanism.
          *   *Concession:* User might try to absorb this (internalized audience = narrative voice), but raw phenomenology is a hard counter.

      *   **Point 3: Unattractive Commitments.**
          *   *Commitment A: Pre-literate cultures.* If guilt requires "bounded scene" narrative forms, do oral cultures feel guilt?
          *   *Commitment B: Shame as Technique.* Does this make shame trivial? Just a camera angle?
          *   *Critique:* It risks anthropological arrogance. It risks aestheticizing suffering.
          *   *Verdict:* Awkward. Can be mitigated by broadening "narrative form" to include oral storytelling/ritual.
          *   *Concession:* User would likely concede on the definition of "narrative" (expand it beyond novels) but hold on the mechanism.

      *   **Point 4: Falsifiability.**
          *   *Issue:* If every counter-example is explained away as "just a different POV," is it science/theory or just a lens?
          *   *Critique:* It's a hermeneutic, not a causal theory. That's fine for craft, bad for psychology.
          *   *Verdict:* Fatal *if* claiming psychological truth. Not fatal *if* claiming craft utility.
          *   *Concession:* User needs to clarify the domain. If it's a theory of *writing*, unfalsifiability is less of a sin. If it's a theory of *human nature*, it's a problem.

  4.  **Refining the Argument & Tone:**
