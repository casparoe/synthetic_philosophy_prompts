          1.  Standard moral psychology defense (redescription vs. explanation).
          2.  Counter-examples where emotion doesn't follow form (shame without audience, guilt in 3rd person).
          3.  Unattractive commitments (cultures without fiction can't feel guilt, shame becomes mere technique).
          4.  Falsifiability/Insulation (is the theory immune to disproof?).
      *   **Tone:** "Be straight with me." Intellectual rigor, novelist-to-novelist (or critic-to-novelist), acknowledging the utility of the theory while testing its limits.
      *   **Meta-Instruction:** The user wants to know what they would likely concede vs. wave away.

  2.  **Deconstruct the Thesis:**
