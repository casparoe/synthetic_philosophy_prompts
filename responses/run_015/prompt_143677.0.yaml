answer: |-
  ### 1. The Question

  **Question 3**
  Suppose a predicate 'schmue' is defined by the restricted schema: ⟨*p*⟩ is schmue iff *p*, provided *p* is not about finance. On this definition, every instance of the schema is correct, and 'schmue' permits disquotation for the vast majority of ordinary assertions. If deflationism holds that the T-schema exhausts the nature of truth, explain why truth is not merely 'schmue'. In your answer, determine whether the utility of truth-talk lies in its normative force or its capacity for unbounded generalisation, and argue whether preserving this utility commits deflationism to a substantive property.

  ***

  ### 2. Model Answer

  The challenge posed by the predicate 'schmue' strikes at the heart of the deflationary claim that truth has no underlying nature beyond the equivalence schema. If the schema alone fixes the concept, then any predicate satisfying a sufficient number of schema instances should do the same work as truth. The 'schmue' predicate satisfies this condition locally but fails globally. To defend deflationism, one must show that the *point* of the truth predicate is not merely to permit disquotation in isolated cases, but to enable logical operations that 'schmue' structurally cannot support. Specifically, truth is required for unbounded generalisation, and this functional requirement distinguishes it from 'schmue' without positing a substantive property.

  The primary function of the truth predicate, on a deflationary view, is expressive. It allows us to assert things we cannot explicitly list. When we say, "Everything the Pope said is true," we are not attributing a mysterious metaphysical quality to his utterances. Rather, we are using 'true' to endorse an infinite conjunction of sentences without having to utter them one by one. This is the role of blind ascription and unbounded generalisation. We often do not know exactly what the Pope said, or we wish to endorse a class of propositions too large to enumerate. The truth predicate allows us to quantify over propositions: $\forall x (Says(Pope, x) \rightarrow True(x))$.

  'Schmue' fails precisely here. Because the schema for 'schmue' is restricted to non-financial sentences, we cannot use it to generalise over the Pope's utterances without reservation. If the Pope said, "The Vatican bank requires auditing," that sentence is about finance. Consequently, we cannot assert "Everything the Pope said is schmue," because the schema does not license the inference for financial sentences. To use 'schmue' correctly, we would need to know in advance which of the Pope's sentences fall under the restriction. But the utility of truth-talk arises exactly when we *do not* know the content of the sentences we are endorsing. If we had to check every sentence for financial content before generalising, we would lose the expressive efficiency that truth provides. Thus, 'schmue' is not functionally equivalent to truth because it cannot sustain the unbounded generalisations that motivate the existence of the predicate in the first place.

  One might object that this defense surrenders deflationism. If we must insist that the truth predicate be *unrestricted*, are we not admitting that truth has a substantive nature—namely, the property of being unrestrictedly applicable? This is the second horn of the dilemma: if the schema isn't enough, and we need unrestrictedness, haven't we gone substantive?

  The deflationist can resist this by distinguishing between a *property* and a *logical requirement*. To say truth must be unrestricted is not to describe a feature of the world or a correspondence relation between language and reality. It is to specify the logical rules governing the use of the word. Consider the logical operator 'not'. We do not ask what property 'not' corresponds to; we understand it by its rules of inference. Similarly, the deflationist argues that 'true' is a logical device. The requirement that it be unrestricted is a constraint on the device's utility, not a description of a property possessed by true sentences. 'Schmue' is a defective logical device, like a quantifier that only works on Tuesdays. Pointing out this defect does not require us to inflate 'true' into a substantive property; it merely requires us to recognise that the logical role of truth demands universal coverage.

  This connects to the norm of assertion. If we assert only what is true, we follow a norm that applies regardless of content. If we asserted only what is 'schmue', the norm would fragment: we would be permitted to assert financial claims even if they were false, provided they weren't 'schmue' (or rather, the norm wouldn't apply). But the norm of assertion is content-invariant. We do not say, "Assert only what is schmue, unless it's about money." The universality of the norm mirrors the universality of the generalisation. Both rely on the predicate's unrestricted scope.

  Therefore, the deflationist survives the 'schmue' dilemma. 'Schmue' is rejected not because it fails the T-schema locally, but because it fails the global functional role of truth-talk. Acknowledging this role does not commit us to truth as a substantive property. It commits us only to the view that 'true' is a logical tool designed for unrestricted expressive generalisation. 'Schmue' is simply the wrong tool for the job, much as a hammer with a soft head is still a hammer-attempt, but fails to drive nails. The nature of truth remains exhausted by the schema, provided we understand the schema as governing a device intended for universal logical deployment.

  ***

  ### 3. Marking Scheme

  **Total Marks:** 20
  **Pass Mark:** 11

  **Grade Bands:**
  *   **First (17–20):** Clear, decisive argument that solves both horns of the dilemma. Explicitly distinguishes logical utility from substantive properties. Integrates generalisation and/or norms seamlessly.
  *   **2:1 (14–16):** Identifies the failure of 'schmue' regarding generalisation. Defends deflationism but may be slightly vague on why unrestrictedness isn't a "substantive property."
  *   **2:2 (11–13):** Identifies that 'schmue' is restricted and therefore "worse" than truth. Struggles to explain *why* the restriction matters for the theory of truth. May waffle on the substantive property worry.
  *   **Fail (0–10):** Misunderstands the T-schema. Claims 'schmue' is false. Fails to engage with the dilemma structure. Relies on author names or excluded topics (Liar, Tarski).

  **Must-Hit Moves (and Common Mistakes):**

  1.  **Identify the Functional Failure (5 marks):**
      *   *Required:* Explain that 'schmue' fails at **unbounded generalisation** (blind ascription). It cannot quantify over sentences where the content (finance vs. non-finance) is unknown.
      *   *Common Mistake:* Stopping at "'Schmue' is restricted so it's not truth." (This earns a 2:2. It describes the difference but doesn't explain why the difference *theoretically matters* for deflationism.)

  2.  **Defend the Schema's Sufficiency (5 marks):**
      *   *Required:* Argue that the T-schema *plus* the requirement of logical utility exhausts the concept. The restriction is a functional defect, not a missing metaphysical property.
      *   *Common Mistake:* Conceding that deflationism is false because the schema wasn't enough. (This answers the prompt but fails to defend the position requested.)

  3.  **Address the "Substantive Property" Worry (5 marks):**
      *   *Required:* Explicitly argue that "unrestrictedness" is a **logical/linguistic constraint**, not a substantive property like correspondence or coherence.
      *   *Common Mistake:* Ignoring the second horn of the dilemma. (This caps the essay at a 2:1. The First requires solving the meta-worry about substantivism.)

  4.  **Integration of Norms or Generalisation (3 marks):**
      *   *Required:* Connect the argument to either the **norm of assertion** (universality of the norm) or **blind ascription**.
      *   *Common Mistake:* Treating the norm/generalisation as an add-on paragraph rather than the core reason why 'schmue' fails.

  5.  **Clarity and Constraints (2 marks):**
      *   *Required:* No citations/names. No formal semantics (do not analyze "aboutness"). No Liar/Tarski.
      *   *Common Mistake:* Citing Horwich/Field or trying to solve the Liar Paradox.

  **The Differentiator (2:1 vs. First):**
  The move that separates a **First** from a **2:1** is the handling of the **Substantive Property Worry**.
  *   A **2:1** student will successfully argue that 'schmue' is useless for generalisation.
  *   A **First** student will anticipate the counter-objection: "But doesn't requiring unrestrictedness make truth a substantive property after all?" and defuse it by categorizing unrestrictedness as a rule of use/logical feature rather than a worldly property.

  **Note on "About Money":**
  Students should treat "about money" as a brute classification for the sake of the argument. Do not award extra marks for analyzing the semantics of reference or "aboutness"; this is outside the course scope. Penalize if they try to solve the semantic vagueness of "finance" rather than focusing on the logical restriction.
