      *   **Direct Answer:** Reject (4).
      *   **Explain Why (4) is false:** "Mirroring" assumes liability to defensive force is a function *only* of the gravity of the wrong. It ignores the *mode* of intervention.
      *   **Address the "Doing/Allowing" Worry:** Distinguish between the *primary* distinction (Act vs. Omission) and the *defensive* distinction (Blocking vs. Conscripting).
          *   Act/Omission: What the wrongdoer did.
