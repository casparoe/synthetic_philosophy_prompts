      *   **Address the "Grave Wrongs Unpreventable" Worry:** Rejecting (4) doesn't mean *no* force is allowed. It means *that specific kind* of force (conscripting) is disallowed. Other sanctions (punishment, social pressure, compensation) might still be permissible. It limits *defensive force*, not *all prevention*.
      *   **Address (2) (Matched Pairs):** If you reject (4), you don't need to reject (2). The matched pair holds for moral evaluation, just not for defensive permissions.
      *   **Philosophical Terminology:** Introduce "Liability" vs. "Rights Infringement." Mention the distinction between **negative duties** (not to kill) and **positive duties** (to save), even if the *weight* is equalized. The *structure* of the right remains different (right against interference vs. right to assistance).
      *   **Refining the "Conscripting" point:** When you shoot the killer, you remove a threat. When you drag Dana, you turn her into a tool. This violates a right to bodily autonomy in a way that is distinct from restraining a threat.
      *   **Conclusion:** The cut should be at (4). The "Mirroring" principle is too strong.

  6.  **Self-Correction/Refinement during drafting:**
      *   *Wait, does keeping (3) commit me to saying Dana has a duty to save?* Yes, the user grants Dana's refusal is a "grave wrong." So Dana is under a duty.
      *   *If Dana is under a duty, why can't I enforce it?* Because enforcing positive duties via bodily conscription is generally prohibited even if the duty exists. (Think of Good Samaritan laws: often a moral duty, rarely legally enforceable by physical force).
