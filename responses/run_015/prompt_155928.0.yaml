      *   *Wait, isn't stopping the killer also using him as a means?* No, standard doctrine says stopping a threat isn't using them as a means in the Kantian sense, whereas forcing labor is.
      *   *Okay, stick to the Liability argument.* Liability is not just about desert; it's about the specific rights forfeiture. A killer forfeits the right not to be harmed *to stop the threat*. A non-rescuer does not forfeit the right not to be physically manipulated *to produce a rescue*.

