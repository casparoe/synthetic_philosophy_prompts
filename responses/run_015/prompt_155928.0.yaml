          *   Key Difference: We generally have a stronger right against being *used* (conscripted) than against being *stopped*. This is often framed as the distinction between **negative rights** (not to be harmed) and **positive rights** (to be aided), even if the violation of both is equally "wrong."
          *   Wait, if (3) is true, doesn't that collapse negative/positive rights?
          *   Nuance: You can say the *moral weight* of the violation is the same (hence 3), but the *structural relationship* between the defender and the wrongdoer differs.
          *   Better Nuance: Liability to defensive force requires that the defensive act does not violate the wrongdoer's rights *more* than necessary. Forcing someone to act (conscripting) is a deeper intrusion on autonomy than restraining someone (blocking). Even if the initial wrongs are equal, the *cost* imposed by the defensive measure differs.
          *   Actually, the strongest philosophical move here is the **Quinn/Frowe distinction on "Harmful Preventing" vs. "Harmful Using."**
          *   Against the Killer: You harm the killer to *prevent* them from harming.
          *   Against Dana: You harm (restrain/manipulate) Dana to *make her save*.
          *   This preserves (3) because the *initial wrong* is equivalent. But it rejects (4) because the *defensive mechanism* triggers different side-constraints.

  5.  **Drafting the Response:**

