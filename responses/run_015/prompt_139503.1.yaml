answer: |-
  # Specification for an Account of Causation by Omission

  ## 1. Purpose and Scope Fixation
  The adequacy of any candidate account is relative to the **Triple Mandate**. The account must simultaneously:
  1.  **Explain:** Underwrite singular causal explanations in ordinary and specialist discourse (agential and non-agential).
  2.  **Attribute:** Underwrite the causal-attribution step in legal and moral responsibility (linking omission to blame/liability).
  3.  **Model:** Plug into variable-based causal models (SEMs, DAGs) used in epidemiology, engineering, and accident investigation.

  **Coherence Warning:** This mandate is tense. Job (iii) typically demands duty-free, objective difference-making variables. Job (ii) demands duty-bound, normative causation. Job (i) requires a filter that distinguishes the Gardener from the Queen. An account that treats causation as purely objective will fail (ii). An account that treats causation as purely normative will fail (iii). The specification below assumes these can be reconciled only if the *causal structure* is objective but the *causal status of an omission* is partially constituted by norms/defaults.

  ---

  ## 2. The Requirements Checklist

  **1. The Agency-Independence Requirement**
  *   **Requirement:** The account must apply the same causal machinery to agential omissions (nurse didn't inject) and non-agential omissions (rain didn't fall, generator didn't engage).
  *   **Motivation:** Job (i) and (iii). Engineering failure analysis treats a failed sensor identically to a sleeping guard. If the account requires "agency" for omission-causation, it cannot model natural disasters or mechanical failures as omissions.
  *   **Status:** **Non-negotiable.**
  *   **Conflict Flag:** None, provided "agency" is not built into the definition of omission.

  **2. The Selection Filter Requirement**
  *   **Requirement:** The account must provide a principled filter distinguishing causal omissions (Gardener didn't water) from non-causal omissions (Queen didn't water), despite identical counterfactual dependencies.
  *   **Motivation:** The "Queen vs. Gardener" case. Without this, everything is a cause of everything else's survival.
  *   **Status:** **Non-negotiable.**
  *   **Conflict Flag:** **High.** This is the locus of the Objective vs. Normative fault line (see Section 3).

  **3. The Normative-Constitution Requirement**
  *   **Requirement:** The account must allow norms, duties, or statistical defaults to enter the *truth conditions* of the causal claim, not merely its assertability.
  *   **Motivation:** Job (ii). In law, "causation" in omission cases is inseparable from "breach of duty." If the account relegates duty to a separate "responsibility" step *after* causation is established, it fails to explain why the law treats the omission *as* the cause.
  *   **Status:** **Non-negotiable** (for this Triple Mandate).
  *   **Conflict Flag:** **Critical.** Conflicts with standard Job (iii) interpretations where variables are value-neutral. *Resolution:* Variables in Job (iii) must be defined normatively (e.g., `Compliance_Status` rather than `Action_Status`).

  **4. The Modeling Compatibility Requirement**
  *   **Requirement:** Omissions must be representable as variable states (e.g., `X=0`) within Structural Equation Models without breaking the mathematics of intervention.
  *   **Motivation:** Job (iii). Epidemiology and engineering rely on DAGs. If omissions cannot be variables, the account is useless for technical failure analysis.
  *   **Status:** **Non-negotiable.**
  *   **Conflict Flag:** Conflicts with **Req 9 (Univocality)** if intervention on an omission is metaphysically distinct from intervention on an action.

  **5. The Chain-Continuity Requirement**
  *   **Requirement:** Omissions must be able to serve as intermediate links in causal chains (Action → Omission → Omission → Effect) without breaking transitivity or attenuating causal strength arbitrarily.
  *   **Motivation:** Supervisor didn't train → Guard didn't throw switch → Backup didn't engage → Patient died.
  *   **Status:** **Non-negotiable.**
  *   **Conflict Flag:** None, but requires a clear account of *where* the omission is located in the chain (see Req 7).

  **6. The Preemption/Overdetermination Resolution**
  *   **Requirement:** The account must verdict on cases of redundant omissions (Two guards asleep; either waking would have saved the victim). It must specify if both, one, or neither are causes, and whether duty status alters this verdict.
  *   **Motivation:** Legal and logical consistency. If both had a duty, are both liable? If only one had a duty, is the other causally inert?
  *   **Status:** **Non-negotiable.**
  *   **Conflict Flag:** Interacts with **Req 3**. If norms constitute causation, the guard with no duty might be causally inert despite counterfactual dependence.

  **7. The Spatiotemporal Location Requirement**
  *   **Requirement:** The account must specify where and when the omission occurs (e.g., at the time of expected action, or spread over the interval of risk?).
  *   **Motivation:** Grain and Location. "Didn't water on Tuesday" vs. "Didn't water." Causal models require time-indexed variables.
  *   **Status:** **Preference** (Metaphysically desirable, but some functionalist accounts may evade it).
  *   **Conflict Flag:** Conflicts with **Req 10 (Ontology)** if omissions are treated as timeless facts rather than events.

  **8. The Intervention Asymmetry Resolution**
  *   **Requirement:** The account must explain why we intervene to *prevent* an omission (make them act) but cannot intervene to *produce* an omission (make them not act) in the same symmetrical way, or deny the asymmetry exists.
  *   **Motivation:** Job (iii). In models, we set `Action=0`. But metaphysically, "doing nothing" is not an intervention in the same sense as "doing something."
  *   **Status:** **Preference.**
  *   **Conflict Flag:** Challenges pure Interventionist accounts.

  **9. The Univocality Requirement**
  *   **Requirement:** The word "cause" in "brake failure caused crash" (commission/mechanism) and "failure to brake caused crash" (omission) must denote the same relation, or the account must explicitly argue for a systematic ambiguity.
  *   **Motivation:** Theoretical unity. If the relation differs, we have two concepts of causation, not one.
  *   **Status:** **Preference** (Camp-dependent).
  *   **Conflict Flag:** **High.** Mechanistic accounts fail this for omissions (no process transmitted). Counterfactual accounts pass this easily.

  **10. The Ontological Truth-Maker Requirement**
  *   **Requirement:** The account must state what makes an omission-causal claim true. (e.g., Positive events + Laws? Negative events? Purely counterfactual facts?).
  *   **Motivation:** The Deflation Worry. If "omission" adds no observable entity, is the causal claim contentful?
  *   **Status:** **Non-negotiable.**
  *   **Conflict Flag:** Conflicts with **Req 3** if truth-makers must be purely physical (norms are not physical).

  **11. The Doing/Allowing Distinction Preservation**
  *   **Requirement:** The account must not collapse "causing by omission" into "merely allowing," though it must explain their correlation.
  *   **Motivation:** Moral and Legal nuance. Sometimes allowing is not causing.
  *   **Status:** **Preference.**
  *   **Conflict Flag:** If causation by omission is robust, "allowing" may just be a subset of causing.

  **12. The Fundamental-Physics Constraint**
  *   **Requirement:** The account must explain why fundamental physics cites no omissions without denying omissions exist in special sciences.
  *   **Motivation:** Metaphysical consistency.
  *   **Status:** **Negotiable.** (Can be explained away as a level-of-description issue).
  *   **Conflict Flag:** None, if emergentism is accepted.

  ---

  ## 3. The Fault Line: Objective vs. Normative

  **The Conflict:**
  *   **Side A (Objective/Duty-Free):** Causation is a relation of dependency in the world. Norms are for *selecting* which dependencies to talk about (Pragmatics). This satisfies Job (iii) easily but struggles with Job (ii) (Law wants the *cause* to be the breach, not just the dependency).
  *   **Side B (Normative-Constitutive):** Causation by omission is *partly constituted* by norms. Without the duty, there is no causal relation, only a counterfactual dependency. This satisfies Job (ii) and (i) but strains Job (iii) (variables in models usually represent physical states, not duties).

  **My Recommendation:**
  **Give up Side A.** For the Triple Mandate to hold, **Req 3 (Normative-Constitution)** must be Non-negotiable.
  *   **Why:** If you treat norms as merely pragmatic (Side A), you cannot underwrite Legal Responsibility (Job ii) where causation *is* the breach. You also fail Ordinary Discourse (Job i) where we deny the Queen caused the death *metaphysically*, not just conversationally.
  *   **Cost:** You must reinterpret Job (iii). Variables in causal models cannot be purely physical; they must be "normatively loaded" variables (e.g., `Expected_Action` vs. `Actual_Action`). This makes the models less "objective" in the physics sense but more accurate for social/engineering systems.
  *   **Weakening:** If forced, weaken **Req 9 (Univocality)**. Admit that "causation" in omission cases is a distinct, norm-laden relation, while "causation" in commission cases is objective. This fractures the concept of causation but saves the Triple Mandate.

  ---

  ## 4. Distinctiveness: Does the Problem Dissolve?

  **Question:** Once a filter (Req 2) is in place, is "causation by omission" just "causal selection"?
  **Answer:** **No.** It does not fully dissolve.
  *   **Reason:** Even if selection handles the Queen/Gardener distinction, the **Ontology (Req 10)** and **Timing (Req 7)** remain distinct problems. A commission involves a positive event propagating energy/information. An omission involves a *lack* of event at a specific location/time.
  *   **Missing Distinction:** I propose adding **"Scripted Absence" vs. "Brute Absence."**
      *   *Scripted Absence (Omission):* An absence relative to a specific causal script or norm (The brake didn't engage).
      *   *Brute Absence (Non-Cause):* An absence with no script (The sun didn't explode).
      *   *Why this matters:* It clarifies Req 2. The filter isn't just "interest"; it's whether the absence violates a causal or normative script. This distinguishes omission-causation from general causal selection (which can apply to positive events too).

  ---

  ## 5. The Single Most Exclusionary Requirement

  **Requirement:** **Req 3 (The Normative-Constitution Requirement).**
  *   **Statement:** Norms/duties must enter the *truth conditions* of the causal claim, not merely its assertability.
  *   **Defense:** This excludes the two most attractive "clean" metaphysical views:
      1.  **Pure Counterfactualism:** (Lewis-style). It treats the Queen and Gardener as equally causal difference-makers, relegating the distinction to pragmatics. This fails Job (ii) (Law).
      2.  **Pure Mechanism/Process:** (Salmon/Dowe). It denies omissions are causes at all because no physical quantity is transmitted. This fails Job (i) and (ii) entirely.
  *   **Why it does the most work:** It forces the account to be hybrid (metaphysics + norms). Any account that tries to keep causation "purely natural" will fail the Triple Mandate's demand for legal/moral underwriting. It forces the theorist to abandon the dream of a value-free causal ontology for this specific domain.

  ---

  ## 6. Scorecard of Candidate Approaches

  | Account Type | Performance on Triple Mandate | Primary Failure Point |
  | :--- | :--- | :--- |
  | **Counterfactual / Difference-Making** (e.g., Halpern & Pearl) | **High on (iii), Low on (ii).** Handles modeling perfectly. Handles selection via "defaults." | Fails **Req 3**. Treats norms as pragmatic defaults, not constitutive of causation. Struggles to justify *legal* liability without extra machinery. |
  | **Process / Mechanism / Conserved Quantity** (e.g., Dowe) | **High on Objectivity, Fails (i) & (ii).** | Fails **Req 1 & 3**. Denies omissions are causes at all (they are "causally relevant facts" but not causes). Cannot underwrite responsibility for omissions. |
  | **Non-Causal / Explanation-Only** (e.g., Beebee) | **High on Metaphysics, Fails (i) & (ii).** | Fails **Req 9 & 3**. Claims omission statements are true but not causal. Collapses the Triple Mandate by denying the premise that omissions *cause*. |

  **Final Note:** To satisfy the Triple Mandate, a **Hybrid Counterfactual-Normative** account is the only viable path. It must treat the *dependency* as counterfactual (for Job iii) but the *causal status* of that dependency as normatively constituted (for Job ii).
