answer: |-
  Based on the track record you've provided, here is the breakdown of your friend's operating system, the prediction for the new case, and how to settle the argument.

  ### The Verdict
  **She will say:** Yes, it is still a great novel. No, she will not build an evening around it.

  **She will likely add:** She might offer a conditional "yes" only if the royalties are diverted away from the author's foundation to the sister or a relevant charity, and the program notes center the sister's testimony. But as it stands? No screening.

  ### The Rule She Is Running
  You proposed three rules. Here is how they map onto her history, and which one is actually driving the bus.

  **1. "Value only takes a hit when the flaw shows up in the work or in what appreciating it requires."**
  *   **Prediction:** She would say the novel is *compromised* aesthetically (value takes a hit) and not screen it.
  *   **Fit:** Poor. In Case 3 (fraudulent painter) and Case 4 (plagiarized novel), she explicitly preserves the aesthetic value ("still a good painting," "still a good novel"). She separates the *quality* of the object from the *morality* of the maker. This rule suggests the art itself gets worse; she doesn't seem to believe that.

  **2. "Value takes a hit when the work is partly made out of the wrong."**
  *   **Prediction:** She would say the novel is tainted because it is constructed from the sister's humiliation (constitutive harm) and not screen it.
  *   **Fit:** Moderate. This explains Case 2 (coerced scene) and Case 4 (stolen text). However, it fails to explain Case 5. In Case 5, the work is "abstract and unrelated" to the violence (the studio trashing). The work is *not* made out of the wrong. Yet, she still restricted the engagement (no fee, no intro). If this were her primary rule, Case 5 would have been treated like Case 1 (screen it, no asterisk). The fact that she modified the terms for Case 5 proves she cares about something beyond just what the work is *made of*.

  **3. "Value itself never moves at all and only the present-tense relations are up for criticism."**
  *   **Prediction:** She will affirm the novel is a masterpiece (value doesn't move) but refuse to screen it because the *current ecosystem* causes harm (living victim objects) and confers benefit on the wrongdoer (foundation).
  *   **Fit:** **Perfect.** This is the only rule that accounts for Case 5. In Case 5, the art is clean, but the *transaction* is dirty (paying a violent living sculptor). In Case 4, the art is good, but the *attribution* is dirty (needs a program note). In Case 2, the art might be good, but the *act of viewing* is dirty (can't be appreciated innocently).
  *   **Conclusion:** Your friend is a **Contextual Consequentialist**. She believes aesthetic value is static, but *exhibition* is a moral act dependent on current consequences, living victims, and profit flows.

  ### Does the Record Underdetermine This?
  You asked if her record really underdetermines the choice. I would argue **Case 5 is the tiebreaker.**

  Without Case 5, you could argue she is following Rule 2 (Constitutive Wrong). Cases 1, 2, 3, and 4 can all be shoehorned into "Is the badness inside the art?" But Case 5 breaks that model. The sculptor's violence was external to the art (unlike the 70s director in Case 2), yet she still imposed restrictions. This proves she is tracking **present-tense relations** (who gets paid, who gets platformed) rather than just **historical constitution** (what the art is made of).

  However, to absolutely split Rule 2 (Constitutive Wrong) from Rule 3 (Present Relations) regarding the *screening* decision (since both predict "No Screen" for the new case), you need the test case you suggested.

  ### The Test Case
  **Your guess:** *A case with the betrayal left intact but the sister long dead and no objection on record.*

  **This is the correct probe.** Here is why:
  *   **If she follows Rule 2 (Made of Wrong):** She still won't screen it. The book is still "made of" humiliation, regardless of whether the sister is alive. The object itself remains tainted.
  *   **If she follows Rule 3 (Present Relations):** She **will** screen it. With no living victim to be re-hurt and no active objection, the "present-tense relation" is clean. The aesthetic value (which never moves) is free to be celebrated.

  If you want to be even more precise, add a variable to your test case: **The Money.**
  *   *Test Case:* Sister is dead, but royalties still go to the Author's Foundation.
  *   *Rule 3 Prediction:* She might still say no (or demand diverted royalties), because Case 5 shows she cares about who profits.
  *   *Rule 2 Prediction:* She says no regardless of money, because the text itself is the problem.

  ### The Scholarship Money: Red Herring or Real?
  **It is not a red herring.** It is a secondary blocker.

  Look at Case 5 again: *"Won't pay him a fee."* She is willing to show the work (documentary) but unwilling to facilitate direct financial/professional benefit to the harm-doer.
  In the new case, the royalties fund a foundation in the *author's name*. This perpetuates the author's legacy and glory. Given her ruling in Case 5, she will view this as an ongoing benefit to the abuser.
  *   **If the royalties went to the sister:** She might screen it (with heavy context).
  *   **Because they go to the author:** She won't.

  ### Summary for Your Argument
  Tell your friend this:
  1.  **She is running Rule 3 (Present Relations).** Case 5 proves she restricts engagement even when the art isn't "made of" the bad act, provided the *current* transaction supports a bad actor.
  2.  **Her Verdict:** The book remains a masterpiece (aesthetic value is static, per Cases 3 & 4), but she won't screen it because the *celebration* hurts a living person and the *profit* honors the abuser (per Cases 2 & 5).
  3.  **The Tie-Breaker:** Your proposed test case (dead sister) is the right one. If she screens it when the sister is dead, she confirms she cares about *harm*, not *ontology*. If she still won't, she cares about the *object's purity*.
  4.  **The Money:** It matters. If she truly follows her Case 5 precedent, she cannot support a screening that financially glorifies the author via their foundation.

  You win the argument if you can get her to admit that if the sister were dead and the money diverted, she'd screen it. If she admits that, she's confirmed Rule 3.
