prompt: |-
  Hi — I need Q&A prep, not another round of help with the argument itself. I'm giving a twenty-minute talk on Friday to an interdisciplinary climate-policy working group, and I know this room well enough to be nervous. It's about fifteen people: mostly economists who work on the social cost of carbon and on social discounting, three philosophers (one fairly committed Parfitian total utilitarian, one Scanlon-style contractualist who thinks the person-affecting restriction is basically right and gives the nonidentity problem up as unsolvable, one who works on existential risk and longtermism), and two program officers from a foundation that funds global health plus some longtermist things. Nobody will have read the paper; I get the sense the economists think the philosophers are there for decoration and the philosophers think the economists are there to be corrected.

  The thesis, briefly, so you know what to attack. Everyone concedes the nonidentity problem makes 'we are harming future generations' shaky: on any realistic emissions path, the specific people alive in 2120 wouldn't have existed under a different path, so the person-affecting harm condition looks like it fails and we're pushed toward something impersonal — total utilitarianism, or a social welfare function where nobody in particular needs a complaint. I want to block that. My move is to attach the duty to a position rather than to a person. Call it the office-holder view (placeholder name, I know it sounds like the title of a law review note). The idea: duties run to the occupants of roles that a continuing practice defines — 'resident of this polity in 2120', 'tenant of a unit in this housing stock in 2060', 'holder of this queue slot' — and an act is pro tanto wrong if it makes whoever fills the slot worse off than the person who would have filled that slot under the alternative act. So compare slot-to-slot, not person-to-person. There's a continuity clause to keep it from over-generating: a slot survives the counterfactual only if the practice constituting it is institutionally continuous across the two scenarios, which is why 'the child you didn't have' isn't a slot in the relevant sense unless some practice was going to assign someone to it. Practical bite, and this is what the economists care about: you get a person-affecting justification for a nontrivial carbon price without going impersonal, and it defuses the 'they'll be richer anyway, so what's the harm' move, because the comparison holds institutions roughly fixed and asks about the slot. But headcount drops out of the wrongness in a way the total utilitarian will hate, and the view gives you no reason to create extra slots. My old advisor says it definately collapses into something like the neutrality view about adding happy people; I don't think it does, but I'm not confident. One of the economists already emailed asking whether this is 'just a separable social welfare function with zero weight on population size', and I need a real answer to that specific one.

  So: give me the prep sheet. The objections I'll actually get from this room, roughly in the order they'll come, in each objector's own vocabulary — the economists will want a functional form or a welfare-equivalent number, the contractualist will ask whose complaint this is supposed to be, the x-risk person will ask what happens when the office itself is at stake, the foundation people will ask what changes about what to fund. No more than eight. Order them by how much damage they'd do rather than how likely they are. For each: the objection as one sentence in that person's voice, my reply in about two sentences, and one line on where the reply is soft and I shouldn't overclaim. Tell me which one or two I should concede up front in the talk itself instead of waiting to be asked, and which single reply has to land or the whole thing is dead in the water. And include the question I'm hoping nobody asks — my bet is it's something about whether the slot is really fixed independently of the policy choice, given that a big enough policy change reshapes the institutions that define the slot, but tell me if you think the genuinely fatal one is somewhere else. Under 700 words total if you can manage it.
