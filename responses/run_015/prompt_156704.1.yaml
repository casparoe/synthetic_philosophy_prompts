answer: |-
  **Headline Credence:** 0.65

  **Decomposition:**

  1.  **Affluent Forager Baseline:** 0.4
      *   *Justification:* The "original affluent society" model is too rosy for the specific margins where transition occurred (e.g., Natufians, Yangtze); paleoclimate and zooarchaeology suggest resource stress and reduced mobility were already constraining welfare before domestication, making the drop less steep than the "Fall from Grace" narrative implies.

  2.  **Skeletal Evidence Validity:** 0.85
      *   *Justification:* While burial bias exists, the cross-continental consistency of enamel hypoplasias, caries, and stature reduction is too systematic to be artifact; these markers track genuine physiological stress and infectious load increases inherent to sedentism and carbohydrate dependence.

  3.  **Counterfactual Viability:** 0.5
      *   *Justification:* It is genuinely uncertain whether "complex foraging" (e.g., Pacific NW style) was a stable equilibrium available to transition-zone populations; if the only alternative was demographic collapse or violent conflict over shrinking wild resources, farming may have been the "least bad" option rather than a net loss.

  4.  **Aggregation & Veil of Ignorance:** 0.9 (weight on per-life); 0.75 (VOI number)
      *   *Justification:* Moral evaluation should prioritize the experience of the typical individual over total population size; however, under a veil-of-ignorance draw weighted by population, the credence that you land in a worse state rises to 0.75 because Malthusian dynamics ensured the miserable farmer majority vastly outnumbered the foraging minority.

  **Synthesis & Sensitivity:**

  My headline number (0.65) is most sensitive to **Term 3 (Counterfactual Viability)**. If you believe stable, high-welfare complex foraging was a live option that was abandoned, the credence that farming was a "bad deal" shoots toward 0.9. If you believe populations were in a Malthusian trap with no alternative but intensification or collapse, the credence drops toward 0.3.

  **Who is Wrong:**

  *   **Your friend (0.25)** is most likely wrong on **Term 2 (Skeletal Evidence)**. A credence that low implies they view the biological deterioration as either negligible or fully explained by confounds (burial bias), which contradicts the weight of paleopathological consensus.
  *   **You (0.6)** are slightly optimistic on **Term 1 (Affluent Forager)**. You may be over-indexing on the !Kung analogy for populations that were already experiencing Late Pleistocene resource depletion; acknowledging the "revisionist" pressure lowers the magnitude of the drop, even if the direction remains negative.

  **One Dataset:**

  **Ancient pathogen aDNA from dental calculus and bone.**
  Skeletal lesions show *that* infection happened, but they don't quantify the *load* or the specific mortality risk. High-resolution sequencing of microbial communities across the transition would directly measure the "infectious disease environment" cost of sedentism, separating it from nutritional stress and giving a hard biological metric for the welfare decline.
