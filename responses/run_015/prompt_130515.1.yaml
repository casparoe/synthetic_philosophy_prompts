  here are 10 questions drafted for your podcast. i kept them conversational and engineer-focused so they feel natural coming from you. each one has a follow-up designed to catch her if she tries to pivot back to "it's structural" or "you're looking at the wrong layer."

  **1. the cross-org black box**
  let's get into the messy reality of software. say my microservice calls an api that spins up another model and no one in either company can actually trace who made the call. if delegation decay happens across company boundaries like that, who actually owns the mistake?
  *follow-up:* you'll probably say liability should follow the loop architecture not the org chart. but how do you enforce that when the org chart is the only thing we currently have laws for?

  **2. the eu ai act problem**
  if every tool can decay into agent-like behavior through these loops, doesn't that make the eu ai act's risk tiers kinda pointless? everything just bleeds into high-risk territory eventually.
  *follow-up:* i bet you'll say regulation should target the loop not the model class. but regulators love static categories. how do you audit a loop that changes shape every time it runs?

  **3. corporate personhood comparison**
  we already treat companies as legal people partly because responsibility gets diffused across structures. are we just repeating that mistake if we grant ai legal status based on delegation decay? or is this different?
  *follow-up:* if you say it's just another layer of abstraction similar to corporate structures, doesn't that let the actual humans off the hook too easily?

  **4. defining "pushed out"**
  you say humans get structurally pushed out. what does that look like in the logs? is there a specific threshold where i'm no longer "in the loop" or is it vibes?
  *follow-up:* if you say it's about optimization pressure rather than a specific switch, isn't that too vague for an engineer to actually build against?

  **5. feedback vs. goals**
  does a simple feedback loop count as delegation decay or do you need actual goal-directed optimization? because i write feedback loops all the time that don't feel like agents.
  *follow-up:* i know you'll say it's structural, not intentional. but if intention doesn't matter, aren't you defining agency so broadly it loses meaning?

  **6. crossing borders**
  what happens when the loop crosses national borders? like my user is in france, my server in us, the delegated model in china. whose rules apply when decay happens?
  *follow-up:* if you say we need global standards because the architecture is universal, isn't that just kicking the can down the road since we can't even agree on cookies?

  **7. stopping the decay**
  if this decay is structural, can you actually stop it without breaking the efficiency gains? or is the only fix to not use recursive delegation at all?
  *follow-up:* you might say i'm regulating the wrong layer and we just need better monitoring. but isn't that just adding another layer of delegation that also decays?

  **8. the hitl checkbox**
  a lot of companies treat "human in the loop" as a compliance checkbox. are you saying that checkbox is fundamentally broken regardless of how attentive the human is?
  *follow-up:* if the architecture pushes them out structurally, does it even matter if the human *wants* to be involved?

  **9. debugging the loop**
  as an engineer, if i need to debug a failure caused by delegation decay, where do i look? if the human is out of the loop, is the system still explainable?
  *follow-up:* if you say traceability is the key, isn't that computationally expensive enough to kill the product?

  **10. the vendor narrative**
  vendors insist they are tools to avoid liability. given your thesis, is that marketing or technically defensible?
  *follow-up:* if it's technically indefensible, why do you think the industry keeps pushing the "tool" narrative so hard despite your evidence?
