      *   *The Problem:* The "Easy Knowledge" problem is often associated with Stewart Cohen and David Armstrong, but Williamson addresses similar issues regarding closure and skepticism.
      *   *Core Idea:* If I know $P$ (e.g., I have hands), and I know $P \rightarrow Q$ (e.g., if I have hands, I'm not a brain in a vat), do I know $Q$? If yes, it seems I've ruled out skepticism "too easily" without specific evidence against skepticism.
      *   *Williamson's Stance:* He tends to defend closure. He argues knowledge is a mental state. He resists the idea that this is *too* easy; he thinks the demand for independent evidence for anti-skeptical propositions is misplaced. Knowledge is the norm of assertion and belief.

