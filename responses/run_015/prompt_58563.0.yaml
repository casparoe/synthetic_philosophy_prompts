          *   *Dynamic:* The world moves. The agent learns. The "C > A" choice happens *after* new info (e.g., "Oh, I actually need flexibility now").
      *   *The "Framing" Issue:* The prompt mentions cost vs. convenience vs. flexibility. This is *attribute substitution*. Is it irrational? If the agent has limited compute, it can't weigh all attributes every time. It focuses on the most salient one. This creates *local* cycles but *global* efficiency.
