      *   **Task:** Provide a careful conceptual reconstruction of pragmatic exploitation arguments (money pumps).
      *   **Key Distinctions Needed:**
          *   Static cycles (stable preferences) vs. Dynamic sequences (shifting preferences due to info/framing/resources).
          *   How outcomes are individuated (what counts as the "same" outcome).
