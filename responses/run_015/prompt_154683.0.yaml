      *   **5. Transition Provision:**
          *   Legacy findings don't have invariance classes.
          *   *Plan:* Grandfather them but flag them. If challenged, they must produce an invariance class retrospectively within a set period (e.g., 12 months) or default to *failed*.

      *   **Word Count Check:** Need to expand on the reasoning to hit 1000-1200 words. Focus on the philosophical structure of mechanism identity and interventionism.

  4.  **Drafting - Writing Phase:**

      *   *Tone:* Collegial, authoritative, precise.
      *   *Structure:* Follow the 5 points strictly.
