      *   *Refinement:* Let's mark the *behavioral finding* as *failed* but allow the *mechanism claim* to remain *indeterminate* pending new protocol. Actually, the Ledger marks findings. Let's say *indeterminate*. It forces a new test.
      *   *Wait, looking at the colleague's proposal:* If we adopt the "invariance class" rule, the original authors failed to declare it. So under strict rules, it's *failed*. But requirement 4 says we need to absorb the criticism that strict rules punish discovery. So we need to amend the proposal to allow post-hoc refinement *if* accompanied by separable intervention profiles.
      *   *Revised Bottom Line:* Mark as *indeterminate*. Message: Replicators validated the protocol; Originals validated the mechanism plausibility but failed the behavioral test. Dates: Decision effective immediately, new protocol due in 6 months.

      *   **2. General Rule (Adjudicating the Proposal):**
          *   *Anomaly Prediction:* Accept. A mechanism must constrain expectations.
          *   *Invariance Class:* Accept but amend. Cannot require pre-declaration for legacy work, and for new work, it must be revisable *if* accompanied by differential predictions (avoiding laundering).
