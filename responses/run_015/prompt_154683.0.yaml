      *Drafting the Neural:*
      Interventionism says components are constitutive if manipulating them changes the output. Here, the input (weight) changed the neural state, but the output (behavior) didn't change. This suggests the neural signature is not constitutively sufficient for the behavioral output, or the pathway is broken. It supports the "wrong mechanism" claim only insofar as it shows the brain noticed the weight, but it doesn't prove the weight-to-seriousness link. It keeps the marking at *indeterminate*.

