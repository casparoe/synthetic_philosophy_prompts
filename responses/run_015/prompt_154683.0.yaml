      TO: Evidence Review Board
      FROM: [My Name]
      RE: Decision Memo: Weight–Seriousness Effect

      I recommend we mark the weight–seriousness finding as *indeterminate* in the Ledger, effective immediately, with a directive to the original authors to submit a revised protocol distinguishing the subtle-weight mechanism from the discomfort mechanism within six months. We will inform the replicating team that their behavioral null stands as a valid constraint on the original protocol, while informing the original authors that their mechanism claim remains viable only if it can generate differential predictions.

      This case turns not on the data itself, but on the criteria for mechanism identity. Our colleague's proposal offers a robust framework for preventing theoretical drift, but it requires amendment to accommodate scientific learning. I propose we adopt her core structure with one critical modification regarding the *invariance class*. Her proposal requires claimants to declare an invariance class in advance—the range of procedural variation they deem mechanism-preserving. While this prevents moving goalposts, it risks treating mechanisms as static definitions rather than discovered structures. I recommend we amend this to allow post-hoc refinement of the invariance class, provided the revision satisfies the third limb of her proposal: the prohibition on anomaly laundering.

      Under this amended rule, a "different mechanism" reply is permissible only if the claimants can specify an intervention profile that separates the revised mechanism from the original. In this case, the original authors claim the replication engaged a discomfort mechanism rather than an importance-cue mechanism. To avoid laundering, they must demonstrate that these two mechanisms yield divergent predictions under specific conditions—for example, that reducing the weight below a noticeability threshold restores the behavioral effect while maintaining the neural signature. If they cannot specify conditions under which the two mechanisms diverge, the revision counts as laundering, and the finding defaults to *failed*. If they can, the finding remains *indeterminate* pending a test of those differential predictions. This preserves the replicators' victory on the original protocol while keeping the Consortium open to theoretical refinement that earns its keep through empirical risk.

      Regarding the neural site, we must apply the interventionist view consistently. A component is constitutively part of a mechanism only if intervening on it changes the mechanism's output and intervening on the output changes it. Here, we have a positive neural signature but a null behavioral output. This does not constitute partial replication of the effect, nor does it prove the mechanism was engaged but blocked. Rather, it is evidence that the neural signature was never doing the work the original authors thought, or at least not sufficient work to produce the behavioral outcome. The neural activity confirms the stimulus was registered, but without the behavioral correlate, it fails to confirm the constitutive link between that registration and the judgment of seriousness. Consequently, the neural data cannot upgrade the Ledger marking on its own. It supports the plausibility of the authors' defense—that the brain noticed the weight—but it does not validate the claim that this noticeability causes seriousness ratings. The marking must remain driven by the behavioral null, tempered only by the possibility of a revised mechanism.

      I must address the strongest consideration on the losing side, which is the fear that strict invariance classes freeze mechanism descriptions at their naivest stage. Mechanisms are discovered, not stipulated; requiring pre-declared boundaries punishes the post-hoc insight that tells us a manipulation was doing something other than we assumed. A strict rule hands victories to replicators by definitional fiat and drives original authors out of the Consortium's process. This objection bites hardest at the requirement for pre-declaration. If we enforce it rigidly, we privilege the first draft of a theory over the best current understanding. My amendment absorbs this by allowing retrospective clarification, but it imposes a tax on that flexibility: the burden of proof shifts heavily to the original authors to provide the discriminatory intervention profile. This ensures that post-hoc insight is rewarded only when it increases precision, not when it merely retreats to safety. We protect the discovery process without sacrificing the constraint necessary for confirmation.

      Finally, we require a transition provision for legacy findings. The weight–seriousness protocol long predates any declaration requirement, and several hundred legacy findings in the Ledger rest on equally undeclared mechanism descriptions. We cannot retroactively invalidate them without destabilizing the Consortium's history, but we cannot leave them immune to scrutiny. I propose we grandfather existing *replicated* markings but flag them as "Legacy-Undeclared." If a legacy finding is challenged via a registered replication, the original authors must produce a retrospective invariance class within twelve months. If they fail to do so, or if the class proves too narrow to cover the replication attempt, the marking defaults to *indeterminate* pending new testing. This gives us a five-year window to normalize the new standard without erasing the past.

      This memo asks you to vote on a system that balances rigor with fallibilism. We are not deciding whether weight causes seriousness today; we are deciding whether our Ledger can distinguish between a failed theory and a failed test without collapsing into unfalsifiability. The amended rule allows us to say "not yet" rather than "no," but only if the authors pay the price of specificity. Please review the proposed amendment to the invariance class requirement and the transition timeline. I look forward to our vote in eleven days.

