answer: |-
  The problem of old evidence exposes a categorical limitation in Bayesian epistemology: it models coherence better than discovery. Bayesianism defines rationality primarily as conditionalization on new information. However, the Mercury case demonstrates that scientific rationality also involves recognizing novel structural relationships between existing data and new hypotheses. This implies that belief revision is not solely about updating probabilities based on new data, but also about updating the logical space itself.

  This highlights a tension between formal constraints and content-sensitive judgments. The probability calculus treats propositions as abstract nodes; confirmation arises from shifts in credence. Yet, the confirmatory power of old evidence depends on the *content* of the theory—specifically, the derivational link between $H$ and $E$. Standard Bayesianism lacks the resources to model the learning of logical truths (i.e., that $H$ entails $E$). If logical omniscience is assumed, the problem is insoluble; if relaxed, the framework requires external mechanisms to explain how logical relations are learned.

  Consequently, viable solutions often compromise Bayesian autonomy. Bayesianism aspires to be a self-sufficient norm for belief, governing rationality through probability axioms alone. However, approaches that expand the language to include sentences about entailment effectively treat the recognition of logical relations as empirical updates. This imports non-probabilistic resources—specifically, an account of logical learning or theory construction—into the core of confirmation. It suggests that probability theory cannot stand alone as a complete epistemology. It requires supplementation by a theory of how agents navigate hypothesis space and recognize structural fits.

  Ultimately, the problem indicates that Bayesianism is a logic of consistency, not a full logic of scientific inference. It constrains rational belief states but fails to capture the dynamic process where old facts gain new significance through theoretical innovation. Rationality, therefore, cannot be reduced solely to probabilistic coherence; it requires substantive judgments about theoretical structure that lie outside the calculus. The problem of old evidence marks the boundary where formal epistemology must yield to the history of science or cognitive psychology, suggesting that a complete picture of rationality requires integrating formal constraints with substantive accounts of theory choice. Bayesianism remains necessary for consistency, but insufficient for explaining the genesis of confirmation.
