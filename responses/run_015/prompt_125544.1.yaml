      *Decision:* I will explicitly walk through the rejection of the "Turing Test" and "Frankenstein" readings to clear the ground for the "Control Regime" analysis, as requested ("before writing, brainstorm several candidate readings and discard the ones that don't survive scrutiny").

  3.  **Deconstructing the Control Regime (Narrow Control vs. Benign Assumptions):**
