  **3. Empty/Unoccupied Cells**
  *   **Gap Theory + Explosion Fails:** (Left Branch, but Explosion Fails).
      *   *Diagnosis:* **Depends on Validity.** If validity = truth-preservation, $K_3$ validates Explosion (Left Branch). If validity = non-falsity preservation, $K_3$ blocks Explosion. This tree assumes **Truth-Preservation** to keep the fork clean.
  *   **Glut Theory + Classical Consequence:** (Right Branch, but Explosion Holds).
      *   *Diagnosis:* **Incoherent.** If contradictions are true and Explosion holds, everything is true (Trivialism). No serious position occupies this.
  *   **Instrumentalist + Wholesale Revision:** (Leaf 10ii).
      *   *Diagnosis:* **Unattractive/Unexplored.** Why revise logic globally if inconsistency is merely a data defect? Usually implies hidden Dialetheism.

  **4. Engineering vs. Truth Commitment**
  *   **Leaves 5ii, 10i, 10ii:** These are **Engineering Stances**. They permit reasoning *as if* paraconsistent (or approximate) without committing to true contradictions.
  *   **Leaves 6b, 8i, 8ii, 9i:** These are **Truth Commitments**. They assert reality/language *contains* contradictions.
