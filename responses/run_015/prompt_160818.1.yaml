  **2. Indistinguishable Leaves (Flags)**
  *   **Leaves 10i (Instrumental+Recapture) and 5ii (Classical Instrumental):** Both treat inconsistency as engineering noise.
      *   *Separation:* Ask if they accept *logical* paraconsistency (formal tolerance) or merely *pragmatic* inconsistency management (fixing data before reasoning). If the former, 10i; if the latter, 5ii.
  *   **Leaves 8ii (LP) and 4ii (Context Gap):** Both reject hierarchy for the Liar.
