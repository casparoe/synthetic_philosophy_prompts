answer: |-
  Here is the specification you need. You are fighting because you and your friend are conflating the **structure of temptation** (which economics explains) with the **failure of agency** (which philosophy must explain). Hyperbolic discounting describes the curve of value over time; it does not describe the moment of capitulation.

  If you want an adequate theory of akrasia that survives a philosophy of action seminar, it must meet the following **Load-Bearing Desiderata**. I have categorized them into **Non-Negotiables** (if the theory fails these, it isn't a theory of *weakness of will*) and **Negotiables** (these are commitments of specific camps that you can sacrifice to save the core).

  ### I. The Non-Negotiables (Hard Constraints)

  **1. The Synchronic Judgment-Action Gap**
  *   **Spec:** The theory must explain how an agent acts against their *current* all-things-considered (ATC) judgment at time *t*.
  *   **Why:** If the theory only explains why you preferred smoking at *t-1* (past) but quitting at *t* (present), that is preference reversal, not akrasia. Akrasia is acting against what you judge best *right now*.
  *   **Status:** **Hard Constraint.** Without this, you are explaining irrationality or change of mind, not weakness of will.

  **2. The Phenomenology of Immanent Struggle**
  *   **Spec:** The theory must account for the first-person experience of *resistance*. The agent must feel the pull of the temptation as a force they are actively holding back, not as an alien invasion or a passive drift.
  *   **Why:** As you noted, if you model the self as a bargaining game between temporal slices (Ainslie), the "struggle" disappears into intertemporal negotiation. The agent at *t* isn't weak; they are just maximizing a different utility function. That dissolves the "I" who is weak.
  *   **Status:** **Hard Constraint.** If you lose the unitary subject of the struggle, you lose the phenomenon.

  **3. The Normative Failure Condition (Blame)**
  *   **Spec:** The theory must leave room for the agent to be the *source* of the action in a way that permits criticism/blame, distinct from pity/treatment.
  *   **Why:** If the action is fully reduced to a neural glitch (e.g., "prefrontal cortex went offline"), the agent is malfunctioning hardware. We fix hardware; we blame agents. Akrasia is a failure of *governance*, not just *mechanics*.
  *   **Status:** **Hard Constraint.** Without this, you have a medical model of addiction, not a philosophical account of weakness.

  **4. The Compulsion Distinction**
  *   **Spec:** The theory must provide a principled line between "I couldn't help it" (compulsion/addiction) and "I didn't help it" (weakness).
  *   **Why:** In compulsion, the capacity to do otherwise is effectively nullified. In weakness, the capacity exists but is not exercised.
  *   **Status:** **Hard Constraint.** If weakness and compulsion are the same mechanism on a spectrum, moral responsibility evaporates at the lower end.

  ---

  ### II. The Negotiables (Camp Preferences)

  **1. Strict Empirical Equivalence with Hyperbolic Models**
  *   **Spec:** The theory does *not* need to treat hyperbolic discounting as the *metaphysical cause* of the action.
  *   **Why:** Hyperbolic discounting explains why the cigarette looks more attractive as you get closer to it. It does not explain why you lit it. You can accept the economic data as describing the *landscape of temptation* without accepting it as the *theory of agency*.
  *   **Status:** **Drop/Modify.** Treat hyperbolic discounting as the *pressure*, not the *explanation*.

  **2. Pure Neuro-Reductionism**
  *   **Spec:** The theory does *not* need to reduce the failure entirely to prefrontal inhibition failure.
  *   **Why:** Neuroscience describes the *substrate* of the failure, not the *status* of the failure. A broken leg explains why you didn't run; it doesn't explain why you didn't *try* to run.
  *   **Status:** **Drop.** Accept neuro-correlates, reject neuro-exclusivity.

  **3. The "No Hidden States" Rule**
  *   **Spec:** Some behaviorists demand no appeal to unobservable volitional faculties.
  *   **Why:** To satisfy the Phenomenology and Normative Failure constraints, you *need* to posit a capacity (Will/Resolution) that is not identical to the strongest desire.
  *   **Status:** **Drop.** You need a robust concept of "Resolution" (à la Richard Holton) that is distinct from "Intention" or "Desire."

  ---

  ### III. The Incompatibility Thesis (Where You Will Get Pushback)

  Here is the definite stance you asked for. There is a genuine tension in your requirements, and you must choose a side.

  **The Conflict:** You cannot have **Full Neuro-Determinism** AND **Robust Moral Responsibility**.
  *   If the prefrontal cortex *determines* the outcome, and it fails, the agent is not to blame; the biology is.
  *   If the agent is to blame, there must be a "gap" between the neural input (dopamine spike) and the behavioral output (lighting up) where agency operates.

  **The Conflict:** You cannot have **Hyperbolic Discounting as Complete Explanation** AND **Unitary Self**.
  *   Hyperbolic discounting implies that "You-at-8AM" and "You-at-8PM" have different utility functions. If taken literally, they are different agents.
  *   If they are different agents, "You-at-8PM" isn't weak; they are just rationally satisfying their current preferences. The "weakness" belongs to the relationship between the agents, not the agent themselves.

  **The Verdict:** To save the phenomenon of Akrasia, **you must sacrifice the claim that Hyperbolic Discounting is the full explanation.**
  You must treat the "Self" as a **Dual-Process Unitary Agent**.
  1.  **System 1 (Valuation):** Subject to hyperbolic discounting, dopamine spikes, limbic pressure. (This is where the *temptation* comes from).
  2.  **System 2 (Governance):** Capable of forming Resolutions that are not simply the sum of current desires. (This is where the *will* lives).

  **Weakness of Will occurs when System 2 capitulates to System 1 *despite having the capacity to inhibit it*.**

  This preserves the Unitary Self (it's one brain with two systems, not two people), preserves the Struggle (System 2 fighting System 1), and preserves Blame (System 2 *could* have inhibited but chose not to).

  ---

  ### IV. The Final Spec Checklist

  If you are writing this up, this is the rubric an adequate theory must pass:

  1.  **Input:** Acknowledges time-inconsistent preferences (Hyperbolic Discounting) as the *context*.
  2.  **Mechanism:** Posits a specific capacity for **Resolution Maintenance**. (Not just "wanting," but "committing to not reconsidering").
  3.  **Failure Mode:** Defines akrasia as the **premature reconsideration** of a resolution. (You didn't just fail; you allowed yourself to re-evaluate the costs/benefits when you knew you shouldn't).
  4.  **Boundary:** Distinguishes from Compulsion by the **Availability of Inhibition**. (In compulsion, inhibition is physiologically impossible; in akrasia, it is possible but costly/unexercised).
  5.  **Output:** Returns a verdict of **Normative Failure**. (The agent is rational enough to know better, but volitionally deficient in sticking to it).

  ### Summary for your Seminar Paper

  **Don't fence-sit.** Argue this:
  Economic models (Ainslie) explain the **slope** of the temptation, but Philosophical models (Davidson/Holton) explain the **break**.
  *   **Drop** the idea that hyperbolic discounting explains the action. It explains the *urge*.
  *   **Keep** the Unitary Self, but make it a *divided* unity (Hierarchical).
  *   **Keep** Responsibility, but admit it requires a non-deterministic gap between neural impulse and action.

  If your friend insists hyperbolic discounting explains the *choice*, they are committing the **Intentional Stance Fallacy**: treating a mathematical description of value decay as a causal agent. If you insist the brain is just a machine, you lose the "Weakness" and only have "Breakage."

  **The load-bearing beam is the capacity for Resolution.** If you have that, you can hold the self together, keep the blame, and use the economics as scenery rather than script.
