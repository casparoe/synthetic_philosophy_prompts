prompt: |-
  I've been figting with my friend for like three hours about akrasia and hyperbolic disounting and I'm pretty sure neither of us knows what we're actually demanding from a theory. So I want the full checklist: what does an adequate account of weakness of will have to deliver? Not just 'explain why people smoke,' but the real spec. It needs to cover the classic cases where you act against your own present all-things-considered judgment, but it also has to draw sharp lines between real weakness, compulsion, addiction, and rational preference reversal — and it can't just invoke a hyperbolic curve and declare victory, because that explains why preferences shift across time, not why you feel torn in the single moment of choice. Here's the part I think gets ignored: the theory should preserve the first-person sense of internal struggle, the feeling that parts of me are at odds, without treating my present self and future self as literally separate agents playing a bargaining game, since that dissolves the problem into intertemporal game theory and erases the very struggle it's supposed to explain. It also needs to square with the neuroscience on prefrontal inhibition without reducing normative failure to a mere brain glitch — weakness has to be something you can be blamed for, not just a mechanical malfunction. Flag which of these are genuinely non-negotiable hard constraints and which are just preferences of particular camps (like do we need determinism? empirical equivalence with Ainslie's intertemporal model? no hidden mental states?). And tell me straight if some subset is jointly unsatisfiable — maybe preserving a unitary self for the phenomology conflicts with the divided-self structure hyperbolic discounting seems to require? Don't lay out five rival theories and leave me hanging; take a definite stance on which desiderata are load-bearing and which ones should be dropped if they clash. I'm writing this up for a philosophy of action seminar and I'm sick of fence-sitting answers that just say Davidson thinks X but the economists think Y.
reasoning: |-
