prompt: |-
  You are a philosopher of science and philosophy of mind with deep familiarity with ontology, scientific realism, and Daniel Dennett’s framework of the physical stance, the design stance, and the intentional stance, but I want you to work as an independent conceptual architect rather than a literature summarizer. I am designing an advanced seminar on the metaphysics of patterns, and the standard treatments feel too rehearsed; I need a rigorous, original evaluative framework that a well-trained model could construct without web access. Before you begin, take a moment to brainstorm: list the core phenomena any theory of “real patterns” must accommodate, identify where demands conflict, and only then organize your answer.

  Write the desiderata that an adequate theory of real patterns must satisfy, working within but also extending Dennett’s tripartite division. For each desideratum, supply the motivating case or conceptual pressure behind it, and flag whether it is non-negotiable or a camp-specific preference (for example, physicalist reductionism, instrumentalist parsimony, or realist commitment to mental patterns). Your list must specifically address: the boundary between predictive utility and ontological commitment—what distinguishes a genuinely real pattern from a convenient fiction of the design stance?; the status of adversarial or sampling-dependent patterns, such as evaluation heuristics in strategic games that yield reliable predictions yet do not map onto any physical or functional property of the underlying state, and whether accommodating them forces us to posit a hypothetical “stochastic stance” intermediate between design and intentional explanation; the tension between a compression criterion (a pattern is real if it permits a significantly compressed description of physical states) and a causal-intervention criterion (a pattern is real only if it supports counterfactual interventions at the physical level); consistency with physical closure—whether every real pattern must be reducible without remainder to physical patterns, or whether high-level intentional patterns can be real despite being multiply realizable and causally autonomous; and the problem of ephemeral macro-patterns, such as turbulence structures or market dynamics, that dissolve under finer-grained physical analysis yet remain indispensable for prediction at coarser scales. Then, identify any subset of these desiderata that appears jointly unsatisfiable given current constraints, and state which single desideratum does the most work in excluding rival theories. Keep the weight on the criteria and their motivating cases rather than on cataloguing named theorists, though you may briefly indicate how a strict physicalist, a Dennett-style instrumentalist, and a realist about intentional patterns would fare against the list. Do not provide bibliographies, reading lists, or citations; I need the conceptual architecture alone, and I have no external access.
