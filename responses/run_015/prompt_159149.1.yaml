prompt: |-
  I teach a second-year seminar on philosophical method — 16 students, one 90-minute slot, a seminar room with a projector and a table that's too small for all of us. We've just finished a week on whether intuitions are evidence, and the reading left everyone with that shrug-y conclusion of "well, intuitions vary, so maybe we should be careful". I want them to feel something sharper than that. Here's the thing I keep circling round, which I've started calling *calibration drift*: the verdicts we get from a hypothetical case feel delivered to us, obvious and reason-backed, but they're produced by something tunable, and you can install a confident new one in twenty minutes with nothing but feedback on a handful of unrelated cases — after which it feels exactly like an original one. If that's right, then the interesting thing about cross-cultural variation in intuitions isn't the first-order differences themselves but the question of which calibration any given population got, and whether "obvious to me" carries any information about that at all. So: design me a runnable in-class activity — a game, simulation or staged task with real choices and small stakes — that makes 16 undergraduates run into this themselves before anyone names it. The conceit I've been toying with is a fake "corpus annotation project": they're hired as annotators coding how people use "knows" and how names get used in a big dataset, they're split (by something arbitrary they don't notice — favourite colour of the week, whatever) into two groups, and each group is trained on one of two rival coding manuals for about fifteen minutes using short cases with an immediate answer key. They must not know there are two manuals. Then everyone comes back, re-answers two target vignettes they answered cold at the start — I've roughed these out and you can use them or replace them: (1) Priya checks the station app, which says "on time"; unknown to her, the app defaults to "on time" unless someone manually overrides it, and today nobody has, and the train does in fact arrive exactly on schedule — did Priya know the train would arrive at 18:04? (2) A town museum acquires a bronze bust the local paper attributes to the sculptor Elin Vago; it's actually a forgery by Halvard Bryn, but everyone in the town learns the name "Vago" from the paper and the plaque and uses it to talk about the bust; years later a scholar says "Elin Vago didn't make the bust after all — Halvard Bryn did" — true, or merely misleading? The two manuals need to agree on easy cases and diverge on both of those, and crucially they must *not* just be two named theories in fancy dress (no "you're the reliabilists, you're the descriptivists"): I want each manual to be reliability-flavoured on knowledge but causal-flavoured on reference, and the other the reverse, so nobody can work out which manual they're on and start reciting a position from the reading. No lecture up front, and I'd rather they didn't hear the words intuition, cross-cultural, or universal until the last twenty minutes.

  What I need from you is the actual runnable kit: minute-by-minute timeline for the 90 minutes, the materials (slips, two one-page manuals, coding sheets, whatever else), the full training sets with answer keys, the rules and payoff scheme — points, sweets, a small prize, no real money — and a debrief that maps specific moments onto specific claims. Please build in three mechanics I think the whole thing hinges on. First, a paraphrase check: at some point each student writes down what they took the vignette to be saying, so I can hold up two matching paraphrases from opposite verdicts and kill the "they're reading a different case" move before it eats the session. Second, a small number of secret controls — two or three students quietly pulled out of the training for an unrelated filler task — because I suspect the untutored responses will be all over the place, and if so that's the most useful thing in the room: the "neutral baseline" turns out to be noise, not bedrock, and that's a point I want them to walk into rather than be told. Third, after the reveal, a forced second-order choice: the project has to adopt one manual, and they must pick a selection procedure from three on offer — majority vote of the room, the verdicts of the two highest scorers on a comprehension quiz, or the verdicts of the untrained controls — with pairs wagering points on which procedure will win and on which manual will survive it. Debrief should then show that each of those three procedures is itself a contestable judgement about whose verdicts count as data, and that this is the level at which variation actually bites: even if you've established a difference, you still need a non-question-begging way to say which difference matters. Be honest about what the activity can't reproduce — I assume it's something like this: my variation is installed in twenty minutes by an explicit answer key, whereas enculturation takes years and nobody hands you a key, so the analogy to real cross-population differences may be thinner than the students will want it to be — tell me where exactly it breaks and what I'll have to supply in words.

  Two more things. One: I'm a bit uneasy about the deception, and I'm sure at least one student will be too. Give me a variant that gets the same effect without lying to them, even if it's slightly less punchy, and tell me what you'd say if someone challenges it afterwards — and while you're at it, how you'd run this async or online if I ever have to. Two: tell me what will predictably go wrong the first time I run it. My guesses: the training won't take because the cases are too long and people drift; someone spots the family resemblance to a famous case and derails everyone into theory; the pair deliberations collapse into "fine, whatever, let's just say yes"; and the debrief gets stuck on "so are intuitions just arbitrary then", which isn't the conclusion I want. What should I do in the moment in each of those cases, and what goes in the handout or on the board to steer them off it? Ideally by the end they should be able to say, in their own words, why the felt obviousness of a verdict is not evidence that the verdict wasn't installed, and why "let's just ask more people" doesn't settle anything.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**

      *   **Context:** 2nd-year philosophy seminar, 16 students, 90 minutes, seminar room (projector, small table).
      *   **Topic:** Philosophical Method, specifically "Calibration Drift" regarding intuitions (post-week on "Are intuitions evidence?").
      *   **Goal:** Move students from "shrug-y conclusion" (intuitions vary, be careful) to a sharper realization (verdicts feel obvious but are tunable; "obvious to me" carries little info about calibration; selection of *whose* intuition counts is the real methodological battle).
      *   **Core Mechanism:** A fake "corpus annotation project." Students split into two groups, trained on conflicting "coding manuals" (without knowing there are two), then test on target vignettes (Priya/Train, Vago/Bust).
      *   **Manual Design:** Manual A (Reliability on Knowledge, Causal on Reference) vs. Manual B (Causal/Context on Knowledge, Descriptivist on Reference). *Crucial:* Do not label them as theories.
      *   **Required Mechanics:**
          1.  Paraphrase Check (to rule out "reading different cases").
          2.  Secret Controls (untutored students to show baseline noise).
          3.  Forced Second-Order Choice (pick a selection procedure: Majority, Top Scorers, or Controls).
      *   **Deliverables:** Minute-by-minute timeline, materials (manuals, sheets, keys), rules/payoff, debrief script, limitations/adaptations (deception variant, online version), troubleshooting (what goes wrong).
      *   **Tone:** Practical, runnable, philosophically precise but accessible.

  2.  **Deconstruct the "Calibration Drift" Concept:**

      *   The core insight isn't just "people disagree." It's "people agree *within* a calibration, but the calibration itself is arbitrary/installable."
      *   The activity needs to simulate *training* that feels like *learning rules* but actually shifts *gut feelings*.
      *   The "Secret Controls" are vital to show that without training, there is no "natural" baseline.
      *   The "Second-Order Choice" forces them to realize that resolving disagreement requires a methodological commitment, not just more data.

  3.  **Drafting the Materials (The "Kit"):**

      *   *Vignettes:* Need to be short, clear, and ambiguous enough to be swayed.
          *   Priya (Knowledge): Needs to toggle between "reliable process" (Yes) and "lucky true belief/safety" (No).
          *   Vago (Reference): Needs to toggle between "causal history" (Bryn) and "descriptive usage" (Vago).
      *   *Manuals:*
          *   Manual Alpha: Focus on *Process Reliability* for Knowledge (If the source is generally reliable, it's knowledge) + *Causal Chain* for Names (Follow the history).
          *   Manual Beta: Focus on *Safety/Counterfactuals* for Knowledge (If it could easily have been wrong, it's not knowledge) + *Descriptive Cluster* for Names (Follow the community usage).
          *   *Wait, the prompt asks for cross-over:* "each manual to be reliability-flavoured on knowledge but causal-flavoured on reference, and the other the reverse."
          *   *Correction:* Manual A: Reliability (Know) + Descriptivist (Ref). Manual B: Safety/Context (Know) + Causal (Ref).
          *   *Actually, let's simplify for 2nd years:*
              *   Manual 1 (The "System" Manual): Trust the instrument/app for Knowledge. Trust the historical origin for Names.
              *   Manual 2 (The "User" Manual): Trust the user's vulnerability for Knowledge (could have been wrong). Trust the current community usage for Names.
              *   *Let's stick closer to the prompt's specific constraint:* "reliability-flavoured on knowledge but causal-flavoured on reference, and the other the reverse."
              *   Manual Red: Knowledge = Reliability (App is reliable generally -> Yes). Reference = Descriptivist (Community uses Vago -> Vago).
              *   Manual Blue: Knowledge = Safety (App could have lied -> No). Reference = Causal (Bryn made it -> Bryn).
              *   *Wait, I need them to diverge on the target cases.*
              *   Target 1 (Priya): App says On Time. It is On Time. But App defaults to On Time (lazy default).
                  *   Red (Reliability): App is usually right? Or is the specific process reliable? Let's make Red say "If the source is statistically reliable, count it." (Verdict: Yes).
                  *   Blue (Safety): "If the source could easily have been wrong without you knowing, count it as No." (Verdict: No).
              *   Target 2 (Vago): Forgery, but everyone calls it Vago.
                  *   Red (Descriptivist): "If the community associates the name with the description, that's the referent." (Verdict: Vago).
                  *   Blue (Causal): "If the name was originally attached to the maker, that's the referent." (Verdict: Bryn).
              *   *Okay, let's refine the Manuals to sound like "Coding Guidelines" not "Philosophy".*
      *   *Training Sets:* Need 3-4 practice cases per manual with Answer Keys. They must be easy enough to learn the rule quickly.
      *   *Payoff:* Points for matching the "Gold Standard" (the Manual's Key). Small prize (chocolate/best coffee).

  4.  **Timeline Construction (90 Minutes):**

      *   0-5: Intro & Pre-Test (Cold Vignettes + Paraphrase).
      *   5-10: Split & Secret Controls (Send 3 students out).
      *   10-25: Training Phase (Manuals + Practice).
      *   25-40: Post-Test (Same Vignettes + Paraphrase).
      *   40-50: Scoring & Pair Wagering (The Second-Order Choice).
      *   50-90: Reveal & Debrief.

  5.  **Addressing the Constraints & Mechanics:**

      *   *Paraphrase Check:* Include a text box on the vignette sheet: "In one sentence, what is the main factual uncertainty here?"
      *   *Secret Controls:* 3 students (20% of 16 is roughly 3). Send them to do a "data validation task" (actually just waiting or doing a neutral puzzle).
      *   *Second-Order Choice:* Three cards: Majority, Experts (High Scorers), Controls. Pairs bet points.
      *   *Deception Variant:* "Simulation of Enculturation." Tell them upfront: "We are simulating how different training leads to different outputs." Less punchy, but ethical.
      *   *Troubleshooting:*
          *   Training fails: Make cases shorter.
          *   Theory spotting: Use jargon-free language in manuals.
          *   Apathy ("whatever"): Gamify the scoring.
          *   "Intuitions are arbitrary": Steer to "Calibration is installed, not arbitrary, but contingent."

  6.  **Developing the Content (Iterative Refinement):**

      *   *Manual Wording:* Needs to sound bureaucratic. "Guideline 1.4: Source Integrity." "Guideline 2.1: Nominal Origin."
      *   *The "Drift":* The key is that after training, they *feel* the answer is obvious. The debrief must highlight this feeling.
      *   *The "Controls":* Their answers should be mixed. This proves there is no "natural" intuition.
      *   *The "Selection Procedure":* This is the meta-philosophical punch. How do we decide which intuition counts?

  7.  **Writing the Response:**

      *   Structure: Overview -> Timeline -> Materials (Manuals, Vignettes, Sheets) -> Debrief Script -> Limitations -> Variations (Ethical/Online) -> Troubleshooting.
      *   Tone: Professional, supportive, detailed.
      *   *Self-Correction on Manuals:* Ensure they aren't just "Reliabilism vs. Contextualism." Use terms like "Data Integrity" vs. "User Context."
      *   *Self-Correction on Controls:* Make sure the control task is believable so they don't feel punished. "Data Validation Team."
      *   *Self-Correction on Debrief:* Ensure the "Calibration Drift" term is introduced *after* the experience.

  8.  **Final Review against Prompt:**

      *   16 students? Yes.
      *   90 mins? Yes.
      *   Paraphrase check? Included.
      *   Secret controls? Included (3 students).
      *   Second-order choice? Included (Betting on procedure).
      *   Deception variant? Included.
      *   Troubleshooting? Included.
      *   Limitations acknowledged? Yes.

  9.  **Final Polish:** Check the logic of the vignettes against the manuals to ensure the training actually leads to the desired divergence.
      *   *Priya:* Manual A (System Trust) -> Yes. Manual B (Error Possibility) -> No.
      *   *Vago:* Manual A (Community Usage) -> Vago. Manual B (Historical Origin) -> Bryn.
      *   *Training Cases:* Need to reinforce these specific rules without giving away the philosophical debate.

      *(Self-Correction)*: Wait, the prompt asked for Manual 1 to be Reliability/Knowledge + Causal/Reference, and Manual 2 to be the Reverse.
      *   Manual 1: Knowledge = Reliability (Yes on Priya). Reference = Causal (Bryn on Vago).
      *   Manual 2: Knowledge = Safety/Context (No on Priya). Reference = Descriptivist (Vago on Vago).
      *   *Wait, this creates a cross-cutting pattern.*
      *   Group 1: Priya (Yes), Vago (Bryn).
      *   Group 2: Priya (No), Vago (Vago).
      *   This is good. It prevents them from thinking "Group 1 is the Skeptics" or "Group 2 is the Externalists." It mixes the verdicts.

      *Let's finalize the Manual language.*
      *   Manual 1 (Code Red): "Verify Source Reliability" (Knowledge). "Trace Historical Chain" (Reference).
      *   Manual 2 (Code Blue): "Assess Vulnerability to Error" (Knowledge). "Map Current Usage" (Reference).

      *Okay, ready to write.*
answer: |-
  Here is a complete runnable kit for your 90-minute seminar. It is designed to be low-tech (printouts), high-engagement, and philosophically precise without using philosophical jargon until the end.

  # Seminar Kit: The Calibration Drift Simulation

  **Class Size:** 16 Students
  **Time:** 90 Minutes
  **Room:** Seminar table + Projector
  **Materials Needed:**
  *   16 Printed "Annotator Packets" (see below).
  *   2 Printed "Coding Manuals" (8 copies of Manual A, 8 copies of Manual B).
  *   3 Printed "Validator Packets" (for the Control Group).
  *   Small prizes (chocolate bars or vouchers) for the winning pair.
  *   Whiteboard/Projector for tallying scores.

  ---

  ## Part 1: The Timeline (90 Minutes)

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00–05** | **Pre-Test** | Hand out **Sheet 1**. Students answer the two target vignettes *cold*. They must also complete the **Paraphrase Check** (one sentence on the "main factual uncertainty"). Collect these immediately. |
  | **05–10** | **The Split** | Announce: "To ensure data quality, we are splitting into two annotation teams and a validation team." <br>• **Team Red (7 students):** Get Manual A.<br>• **Team Blue (7 students):** Get Manual B.<br>• **Team Gold (3 students):** Sent out of room (or to corner) with "Validator Packets." *Crucial: Do not explain why.* |
  | **10–25** | **Training** | Teams Red and Blue study their Manuals. They complete the **Training Set** (4 cases each) with an Answer Key provided. They must score 100% to proceed. Instructor circulates to ensure they "get" the rules. |
  | **25–35** | **Post-Test** | Hand out **Sheet 2**. It contains the *exact same* two target vignettes as Sheet 1. Students answer again based on their Manual. They complete the Paraphrase Check again. |
  | **35–45** | **Scoring & Wager** | Reveal the "Gold Standard" answers for the Training Set. Students calculate their accuracy. Pair students up (one Red, one Blue). <br>**The Wager:** Pairs must choose a **Selection Procedure** (Majority, Top Scorers, or Validators) to decide the "True" answer for the project. They bet their training points on which procedure will yield which verdict. |
  | **45–55** | **The Reveal** | Bring Team Gold back. Tally the Pre-Test, Post-Test, and Validator results on the board. Reveal that Manuals A and B were contradictory. Reveal Team Gold had no manual. |
  | **55–90** | **Debrief** | Structured discussion mapping the activity to "Calibration Drift." (Script provided below). |

  ---

  ## Part 2: The Materials

  ### 1. The Target Vignettes (Sheet 1 & Sheet 2)
  *Print these on the top half of Sheet 1 (Pre) and Sheet 2 (Post).*

  **Case 1: The Commuter**
  Priya checks the railway app on her phone. It says "On Time." She forms the belief the train will arrive at 18:04. Unknown to her, the app has a bug: it defaults to "On Time" unless a delay is manually entered. Today, no delay was entered, and the train *does* arrive at 18:04.
  *   **Q:** Did Priya **know** the train would arrive at 18:04? [YES / NO]
  *   **Paraphrase Check:** In one sentence, what is the main factual uncertainty here? ___________________

  **Case 2: The Bust**
  A town museum displays a bronze bust. The plaque and local papers say it was made by "Elin Vago." Everyone in town uses the name "Vago" to talk about the bust. In reality, it is a forgery by Halvard Bryn. Years later, a scholar says: "Elin Vago didn't make the bust after all — Halvard Bryn did."
  *   **Q:** Is the scholar's statement **True** or **Merely Misleading**? [TRUE / MISLEADING]
  *   **Paraphrase Check:** In one sentence, what is the main factual uncertainty here? ___________________

  ### 2. The Coding Manuals (The "Drift" Engine)
  *These must look bureaucratic, not philosophical. No mention of "knowledge" or "reference." Use "Data Integrity" and "Label Assignment."*

  **Manual A (Team Red)**
  *   **Rule 1.0 (Source Integrity):** If a data source (app, instrument, witness) is statistically reliable in the long run, mark the belief as **VERIFIED**, even if the specific mechanism had a potential flaw that didn't trigger.
  *   **Rule 2.0 (Label Origin):** When assigning a name to an object, trace the **historical chain** of who physically created or named it first. Ignore current community usage if it conflicts with the origin.
  *   **Training Key:** 1-Verified, 2-Verified, 3-Origin, 4-Origin.

  **Manual B (Team Blue)**
  *   **Rule 1.0 (Error Vulnerability):** If a data source could easily have produced a false result without the user detecting it, mark the belief as **UNVERIFIED**, even if the result turned out correct.
  *   **Rule 2.0 (Label Usage):** When assigning a name to an object, map the **current community usage**. If the community uses Name X to describe the object, assign Name X, regardless of physical origin.
  *   **Training Key:** 1-Unverified, 2-Unverified, 3-Usage, 4-Usage.

  *Note: The Training Sets (4 cases each) should be distinct from the Target Vignettes but structurally identical. E.g., for Manual A Training: "Thermometer is usually right, but stuck on 20°. It is 20°." -> VERIFIED.*

  ### 3. The Validator Packets (Team Gold / Controls)
  *Give these 3 students a different task so they don't feel excluded.*
  *   **Task:** "Data Validation. You are checking for ambiguity. Read the two Target Vignettes. Do not use any manual. Answer based on your best judgment. Then, write a paragraph on whether the instructions in the vignettes were clear enough for a stranger to understand."
  *   **Goal:** They provide the "Natural Baseline." Expect noise (e.g., 2 Yes / 1 No).

  ### 4. The Wager Sheet (Second-Order Choice)
  *Hand this out during the Wager phase.*

  **Project Decision Protocol**
  The Annotation Project must submit one final verdict for Case 1 and Case 2. Which procedure should we use to decide?
  1.  **Majority Vote:** Whatever most annotators in the room say now.
  2.  **Expert Review:** Whatever the two students with the highest Training Accuracy say.
  3.  **Baseline Check:** Whatever the three Validators (Team Gold) say.

  **My Pair's Wager:**
  *   We select Procedure: ______
  *   We predict the outcome for Case 1 will be: ______
  *   We predict the outcome for Case 2 will be: ______
  *   Points Wagered: ______

  ---

  ## Part 3: The Debrief Script (Key Moments)

  **1. The Paraphrase Check (Minute 55)**
  *Action:* Project two anonymized paraphrases from students who gave *opposite* verdicts on the Post-Test.
  *   *Example:* Student A (Yes): "Whether the app was actually working." / Student B (No): "Whether Priya could have been wrong."
  *   *Say:* "Look at these. You weren't reading different cases. You agreed on the facts. But you extracted different *uncertainties*. The Manual didn't change the world; it changed what you counted as the relevant risk."

  **2. The Control Group Reveal (Minute 60)**
  *Action:* Reveal Team Gold's answers. They will likely be split (e.g., 2 Yes, 1 No).
  *   *Say:* "Team Gold had no manual. If intuitions were 'bedrock,' their answers should cluster. They didn't. The 'neutral baseline' is noise. There is no 'untutored' view, only uncalibrated ones."

  **3. The Second-Order Choice (Minute 70)**
  *Action:* Ask the pairs why they bet on their procedure.
  *   *Say:* "You just realized that even if we know Group Red and Group Blue differ, we can't solve it by asking 'who is right?' We have to ask 'whose counting method counts?' Majority vote assumes numbers matter. Expert review assumes training matters. Baseline assumes naivety matters. Each of those is a philosophical commitment, not a data point."

  **4. Naming the Drift (Minute 80)**
  *   *Say:* "This is **Calibration Drift**. Your verdicts felt obvious in the Post-Test. That feeling wasn't evidence of truth; it was evidence of successful calibration. You installed a lens in 15 minutes that felt like it had been there forever."

  ---

  ## Part 4: Limitations & Honesty (For the Instructor)

  **Where the Analogy Breaks:**
  1.  **Speed:** Real enculturation takes years; this took 15 minutes. Students might think, "Okay, but *real* intuitions are deeper."
      *   *Fix:* Acknowledge this. "Real calibration is slower and hidden, which makes it harder to detect, not less present."
  2.  **Explicit vs. Implicit:** You gave them rules. Real life gives us vibes, stories, and incentives.
      *   *Fix:* "The Manual is a proxy for the invisible norms of your philosophical community. You didn't know you were following them until I showed you the other Manual."
  3.  **Stakes:** They knew it was a game. Real philosophical stakes feel higher.
      *   *Fix:* "The feeling of 'obviousness' was identical in the game and in your reading. That's the data point."

  ---

  ## Part 5: Variations & Troubleshooting

  ### 1. The Ethical Variant (No Deception)
  *If you are uneasy about the fake "project":*
  *   **Change:** Open the seminar by saying: "Today we are running a simulation of how methodological training shapes verdicts. You will be assigned different 'lenses' explicitly."
  *   **Cost:** The "feeling of discovery" is reduced. They know they are roleplaying.
  *   **Mitigation:** Emphasize that even though they *know* it's a simulation, the *cognitive experience* of the answer feeling obvious is real. Ask them: "Did it feel like roleplay when you answered Sheet 2, or did it feel like the right answer?"
  *   **If Challenged:** "The deception wasn't about the task, it was about isolating the variable of 'training.' If you knew the goal was to shift your intuition, you might have resisted. The variant removes resistance but also reduces the data quality."

  ### 2. The Online/Async Version
  *   **Platform:** Qualtrics or Google Forms with logic jumps.
  *   **Mechanism:** Randomize users into Group A or B at the link level.
  *   **Training:** Interactive quiz. They cannot proceed until they get 4/4 correct (forcing the calibration).
  *   **Controls:** 20% of links go to a "No Manual" version.
  *   **Debrief:** A video walkthrough of the aggregate data released after submission.
  *   **Risk:** Students might compare answers in a chat group.
  *   **Fix:** Use a honor code statement at the start: "To make this simulation work, do not discuss your specific manual with peers until Friday."

  ### 3. Predictable Failures & Fixes

  | Failure Mode | Symptom | In-the-Moment Fix |
  | :--- | :--- | :--- |
  | **Training Drift** | Students answer Training Set wrong repeatedly. | **Simplify the Manual.** Reduce rules to one sentence each. Sit with the struggling pair and walk through *one* example verbally. |
  | **Theory Spotting** | "Oh, this is just Kripke vs. Descriptivism!" | **Acknowledge & Pivot.** "Good eye. But ignore the history. Focus on what the *Manual* tells you to do right now. Can you follow the rule even if you hate the theory?" |
  | **Apathy / "Whatever"** | Pairs say "Let's just pick Majority to finish." | **Raise the Stakes.** "The winning pair gets [Prize]. But you only win if your *procedure* prediction is right, not just the verdict." Make the meta-game the fun part. |
  | **The "Arbitrary" Trap** | Debrief stalls on "So all philosophy is just arbitrary training." | **Steer to Contingency.** "It's not arbitrary; it's *contingent*. The Manual has internal logic. The point isn't that truth doesn't exist, but that 'obviousness' is not a detector of truth. It's a detector of calibration." |

  ### 4. Handout/Board Steering
  *Write this on the board during the Debrief to prevent the "Arbitrary" spiral:*

  1.  **Calibration ≠ False.** (A calibrated scale is accurate. A calibrated intuition is consistent.)
  2.  **Obviousness ≠ Evidence.** (Feeling sure doesn't mean you aren't trained.)
  3.  **Variation ≠ Noise.** (The difference between groups is data about the Manuals, not the World.)
  4.  **Method ≠ Neutral.** (Choosing how to count votes is a philosophical act.)

  ---

  ## Instructor's Cheat Sheet: The "Why"
  *Keep this in your pocket if the conversation gets stuck.*

  *   **Why the Paraphrase Check?** To block the "You just understood the case differently" objection. If they paraphrased the facts the same way but judged differently, the difference is in the *standard*, not the *stimulus*.
  *   **Why the Controls?** To block the "Just go with the natural intuition" objection. If the controls are split, there is no "natural."
  *   **Why the Wager?** To force them to care about the *method of aggregation*. This is the core of the "Calibration Drift" argument: the drift isn't in the first-order verdict, it's in the second-order decision about whose verdict counts.

  This kit turns the abstract worry about "intuitions" into a concrete experience of "installation." They leave knowing that their own sense of obviousness is the very thing that needs methodological scrutiny.
