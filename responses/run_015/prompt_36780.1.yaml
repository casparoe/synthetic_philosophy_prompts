  $$E(p) = p + 7p - 7p^2 + 2(1 - 2p + p^2)$$
  $$E(p) = 8p - 7p^2 + 2 - 4p + 2p^2 = -5p^2 + 4p + 2$$
  Maximizing with respect to $p$:
