  1.  **Linearity:** In expected utility theory, a mixed strategy is only optimal if the agent is indifferent between the pure strategies being mixed. If Exit > Continue, one should Exit with $p=1$. If Continue > Exit, one should Continue with $p=0$. Randomization ($0 < p < 1$) implies $EU(\text{Exit}) = EU(\text{Continue})$.
  2.  **Beliefs:** To calculate these expected utilities at the exit, the driver needs the probability that he is at Exit 1 vs. Exit 2. Petra correctly notes this probability depends on the policy (because the policy determines how often he reaches Exit 2), but argues it cannot be circularly defined to *force* a tie. She demands the tie arise naturally from the valuation.

