  **Belief Derivation:**
  Expected number of visits to Exit 1 per trip = 1.
  Expected number of visits to Exit 2 per trip = $1-p$ (probability of continuing past 1).
  Total expected visits = $1 + (1-p) = 2-p$.
  Probability current exit is Exit 1 ($\alpha$):
  $$\alpha = \frac{1}{2-p}$$
  With $p=0.4$: $\alpha = \frac{1}{1.6} = \frac{10}{16} = \frac{5}{8}$. (Marco's number is correct).
  Probability current exit is Exit 2 ($1-\alpha$): $3/8$.

