prompt: |-
  So heres the situation: I'm a philosophy of science PhD student about a year into an "embedded" placement with an interpretability team at an ML lab (long story, basically my advisor got a grant for philosophy-in-the-wild placements and I drew the short straw, or maybe the long one). My actual job, roughly, is to help the team decide when they're licensed to say "the network represents X" — truth, sentiment, the board state, whatever — versus having to write the weaker "we found a feature that tracks X in the settings we tested." Right now there's no shared standard. Some folks on the team are basically realists (if a probe can read it out, it's represented), others are deflationists (it's all convenient bookkeeping and "representation" talk is a metaphor we should just drop), and paper drafts and external comms flip between the two dependng on who wrote them. That inconsistency is what I'm trying to fix.

  You're a philosopher of science who also knows the ML literature. Take the realism/instrumentalism debate seriously but make it usable — I want the conceptual mapping somewhat explicit (what plays the role of novel prediction, what corresponds to robustness across retraining runs, maybe the structural realist thought that what survives is the structure, not the object, since "the model has a truth *direction*" might be exactly the kind of claim where the subspace is real and the human concept isn't). But the deliverable has to be a procedure, not an essay. Think carefully and do a bit of brainstorming before writing, please.

  Constraints: a mixed panel of two engineers and me runs it in under an hour per claim, and none of us have patience for seminar-level nuance, so it needs to be an ordered checklist — the questions to ask about a claim, what counts as a sufficient answer at each step, where the procedure terminates in "downgrade the claim," and where it punts to a human because the remaining question is about values rather than facts (e.g. how much overclaiming risk the lab should accept in public messaging — that's not something a checklist can settle, and I want it to visibly say so).

  Then run it on three claims, since worked examples are how the team will actually learn it: (1) a linear probe for sentiment where the probe classifies beautifully but ablating the direction barely changes anything downstream; (2) the claim that a model trained on chess- or Othello-type play represents the board state, based on probes plus interventions that change its predicted moves the way the interpretation says they should; (3) the safety pitch that the model "represents deception" — I suspect the procedure will downgrade that one and the comms team will hate it, which is exactly why I want it included, so be honest about the result. Also tell me plainly what the procedure *can't* do: I'm guessing it can't settle anything when the evidence is genuinely underdetermined, and I worry that once the checklist circulates internally people will Goodhart it (tweaking experiments to pass the rubric rather than to find out what's going on). One page of actual checklist, the rest can be explanation. Thx!
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Philosophy of Science PhD student, embedded in an ML interpretability team.
      *   **Task:** Create a procedural checklist to adjudicate claims about neural network representation (e.g., "The network represents X" vs. "A feature tracks X").
      *   **Context:** Team is split between realists (probes = representation) and deflationists (representation = metaphor). Inconsistent messaging.
      *   **Requirements:**
          *   Take realism/instrumentalism seriously but make it *usable*.
          *   Map philosophical concepts to ML practices (novel prediction, robustness, structural realism).
          *   Deliverable: An ordered checklist (procedure), not an essay.
          *   Constraints: Mixed panel (2 engineers + 1 philosopher), <1 hour per claim, no seminar-level nuance.
          *   Must include termination conditions (downgrade claim, punt to values).
          *   Must run the procedure on three specific cases (Sentiment Probe, Board State, Deception).
          *   Must explicitly state limitations (underdetermination, Goodharting).
          *   Format: One page checklist, rest explanation.
      *   **Tone:** Professional, pragmatic, philosophically informed but engineering-focused.

  2.  **Deconstruct the Philosophical/ML Mapping:**
      *   *Realism:* Entities exist independently. In ML: The direction/subspace is causally efficacious, robust, and necessary for the behavior.
      *   *Instrumentalism/Deflationism:* Tools for prediction. In ML: Probes work, but ablating doesn't change output; it's a correlation, not a mechanism.
      *   *Structural Realism:* The structure survives theory change. In ML: The geometric relationship between concepts matters more than the specific basis vectors (e.g., the "truth direction" exists even if the specific "truth" concept is fuzzy).
      *   *Novel Prediction:* Does the interpretability hypothesis predict behavior on *out-of-distribution* (OOD) inputs or under *interventions*?
      *   *Robustness:* Does the finding hold across seeds, pruning, quantization?

  3.  **Drafting the Checklist (The Core Deliverable):**
      *   Needs to be tight. <1 hour means maybe 5-7 key questions.
      *   Needs clear pass/fail criteria.
      *   Needs a "Values/Comms" off-ramp.
      *   *Step 1: Readout (The Baseline).* Can we find it? (Probe accuracy).
      *   *Step 2: Causal Efficacy (The Realist Test).* Does changing it change behavior? (Ablation/Intervention).
      *   *Step 3: Robustness (The Structural Test).* Does it survive retraining/architecture changes?
      *   *Step 4: Specificity/Necessity (The Underdetermination Test).* Is this the *only* way to explain the behavior?
      *   *Step 5: Risk/Values (The Comms Test).* If evidence is mixed, what's the risk of saying "represents"?

  4.  **Developing the Three Case Studies:**
      *   *Case 1: Sentiment Probe.* High probe acc, low ablation impact.
          *   *Verdict:* Downgrade. It's a correlate, not a representation. (Instrumentalist view wins).
      *   *Case 2: Board State (Chess/Othello).* Probes + Interventions work.
          *   *Verdict:* Upgrade/Keep. Causal link established. (Structural Realist view wins).
      *   *Case 3: Deception.* High stakes, likely weak causal evidence.
          *   *Verdict:* Downgrade + Values Punt. Evidence is thin, risk is high. Comms team will hate it, but safety demands caution.

  5.  **Addressing Limitations (Goodharting & Underdetermination):**
      *   Need to warn that checking boxes isn't truth.
      *   Need to acknowledge that sometimes the science just isn't there yet.

  6.  **Refining the Tone:**
      *   Avoid jargon where possible, but keep the philosophical grounding visible for the user (since they are a philosopher).
      *   Speak to the engineers (pragmatic, clear criteria).
      *   Speak to the comms team (risk management).

  7.  **Iterative Polishing (Self-Correction during drafting):**
      *   *Critique:* Is the checklist too long?
      *   *Fix:* Condense the criteria. Use "Stop/Go" language.
      *   *Critique:* Did I map the philosophy explicitly enough?
      *   *Fix:* Add a preamble explaining the mapping (Probe = Readout, Ablation = Causal, Robustness = Structure).
      *   *Critique:* Is the "Values" section clear?
      *   *Fix:* Make it a distinct "Red Flag" section where the procedure halts and asks management.

  8.  **Final Review against Constraints:**
      *   One page checklist? (Will format it clearly).
      *   Three examples? (Yes).
      *   Limitations discussed? (Yes).
      *   Philosophy mapped to ML? (Yes).

  9.  **Final Output Generation:** (Proceeding to generate response based on these thoughts).
      *   *Structure:*
          1.  Intro/Context (Brief).
          2.  The Mapping (Philosophy -> ML).
          3.  The Checklist (The 1-page deliverable).
          4.  Worked Examples (The 3 cases).
          5.  Limitations & Warnings (Goodharting/Underdetermination).

      *(Self-Correction on Length)*: The prompt asks for "One page of actual checklist, the rest can be explanation." I need to ensure the checklist section is visually distinct and concise.

      *(Refining the "Deception" case)*: This is the tricky one. If I say "downgrade," I need to explain *why* based on the checklist (likely fails Causal Efficacy or Specificity).

      *(Refining the "Values" punt)*: Make sure it's clear that the checklist identifies *when* to punt, not *how* to decide.

      *(Philosophical Nuance)*: Ensure "Structural Realism" is represented by the Robustness/Invariant section.

      *Let's write it.*
answer: |-
  ### Preamble: The Philosophical Mapping
  To make this usable, we translate the realism/instrumentalism debate into engineering tests.
  *   **Empirical Adequacy (Instrumentalism):** Can we predict the feature? → *Linear Probing.*
  *   **Causal Realism (Realism):** Is the feature necessary for the behavior? → *Ablation/Intervention.*
  *   **Structural Realism (Worrall/Ladyman):** Does the geometric relationship survive theory (model) change? → *Robustness across seeds/architectures.*
  *   **Pragmatic Risk (Values):** What is the cost of being wrong? → *Comms/Safety Review.*

  ***

  # PROCEDURE: Representation Claim Adjudication (RCA-v1)
  **Panel:** 2 Engineers + 1 Philosopher | **Time Limit:** 60 Minutes | **Input:** Draft Claim + Evidence Packet

  ### PHASE 1: THE EVIDENCE GATE (Fact-Finding)
  *If any step fails, stop. Do not proceed to Phase 2.*

  **1. Readout Sufficiency (The "Save the Phenomena" Test)**
  *   **Question:** Does a probe/classifier recover the concept $X$ significantly above chance/baselines on held-out data?
  *   **Pass:** Accuracy > Threshold (team defined, e.g., 90%) + Calibration check passed.
  *   **Fail:** Probe is weak or overfits.
  *   **Result:** **STOP.** Claim downgraded to "No detectable signal."

  **2. Causal Efficacy (The "Realist" Test)**
  *   **Question:** Does intervening on the putative representation (ablation, activation patching, steering) change the model's downstream behavior *in the specific way predicted by X*?
  *   **Pass:** Intervention shifts output distribution consistent with $X$ (e.g., steering "truth" increases truthful answers) with statistical significance.
  *   **Fail:** Intervention has no effect, or effect is diffuse/unpredictable.
  *   **Result:** **STOP.** Claim downgraded to "Feature tracks $X$ (correlate only)."

  **3. Structural Robustness (The "Structure" Test)**
  *   **Question:** Does the representation persist across retraining seeds, pruning, or minor architecture changes? (Is it the *structure* of the solution or an artifact of this specific weight configuration?)
  *   **Pass:** Direction/Subspace aligns (high cosine similarity) across $\ge$ 3 independent runs/seeds.
  *   **Fail:** Representation is idiosyncratic to this specific checkpoint.
  *   **Result:** **FLAG.** Claim qualified as "Checkpoint-specific representation."

  ### PHASE 2: THE INTERPRETATION GATE (Nuance)
  *Only proceed if Phase 1 is passed.*

  **4. Specificity / Underdetermination Check**
  *   **Question:** Is there a simpler explanation $Y$ (e.g., "grammar" instead of "truth", "material control" instead of "board state") that explains the same evidence?
  *   **Pass:** Competing hypotheses $Y, Z$ tested and ruled out via control tasks.
  *   **Fail:** Plausible confounds remain untested.
  *   **Result:** **DOWNGRADE.** Claim phrased as "Consistent with representation of $X$."

  ### PHASE 3: THE VALUES PUNT (Risk Management)
  *If Phase 1 & 2 pass, but stakes are high.*

  **5. Risk/Consequence Assessment**
  *   **Question:** If we claim "The model represents $X$" and we are wrong, what is the harm? (e.g., False safety assurance, regulatory backlash, misallocated research budget).
  *   **Low Risk:** Academic paper, internal blog. $\rightarrow$ **APPROVE** "Represents $X$."
  *   **High Risk:** Safety whitepaper, public demo, policy briefing. $\rightarrow$ **PUNT TO LEADERSHIP.**
  *   **Action:** Checklist cannot resolve this. Panel recommends "Tracks $X$" to Leadership for final sign-off on risk tolerance.

  ***

  ## Worked Examples

  ### Case 1: Sentiment Probe
  *   **Claim:** "The model represents positive sentiment in Layer 6."
  *   **Evidence:** Linear probe achieves 98% accuracy on sentiment classification. Ablating the identified direction changes log-probs slightly but does not alter the generated text's sentiment in a controlled generation task.
  *   **Procedure Run:**
      *   Step 1 (Readout): **PASS.**
      *   Step 2 (Causal): **FAIL.** Steering the vector doesn't force positive generations.
      *   **Verdict:** **DOWNGRADE.**
      *   **Wording:** "We found a feature that *tracks* sentiment," NOT "The model represents sentiment."
      *   **Philosophical Rationale:** Instrumentalist success (prediction) without Realist commitment (causation). It is a "readout" artifact, possibly from the training data distribution, not a mechanism the model uses to decide.

  ### Case 2: Board State (Othello/Chess)
  *   **Claim:** "The model represents the board state."
  *   **Evidence:** Probes recover board configuration. Interventions on the "board state" subspace cause the model to make legal moves consistent with the *edited* board, even if the move history implies otherwise. Robust across 5 seeds.
  *   **Procedure Run:**
      *   Step 1 (Readout): **PASS.**
      *   Step 2 (Causal): **PASS.** Interventions change moves predictably.
      *   Step 3 (Robustness): **PASS.**
      *   Step 4 (Specificity): **PASS.** (Ruled out "move history" as confound).
      *   **Verdict:** **APPROVE.**
      *   **Wording:** "The model represents the board state."
      *   **Philosophical Rationale:** Structural Realism. The specific neurons might change, but the geometric structure encoding the board is causally efficacious and robust.

  ### Case 3: Deception
  *   **Claim:** "The model represents deception when asked about its capabilities."
  *   **Evidence:** Probe distinguishes "sycophantic" vs "honest" answers. Interventions are noisy. Alternative explanation: The model is simply matching RLHF reward patterns (instrumental alignment) rather than holding a false belief (deception).
  *   **Procedure Run:**
      *   Step 1 (Readout): **PASS.**
      *   Step 2 (Causal): **FAIL/WEAK.** Steering "deception" doesn't reliably induce deceptive behavior in OOD contexts.
      *   Step 4 (Specificity): **FAIL.** "Reward hacking" is a viable confound.
      *   Step 5 (Risk): **HIGH.** (Safety claim).
      *   **Verdict:** **DOWNGRADE + PUNT.**
      *   **Wording:** "We found features consistent with deceptive behavior, but cannot rule out reward overoptimization."
      *   **Philosophical Rationale:** Underdetermination. The evidence supports multiple ontologies. Because the risk is high (Safety), the procedure forces a punt to leadership rather than allowing a realist claim that might create false security.

  ***

  ## Limitations & Warnings (Read Before Circulating)

  **1. The Goodhart Warning**
  This checklist is a *filter*, not a *generator*. If teams optimize experiments solely to pass Step 2 (Causal Efficacy) without caring about ecological validity (e.g., ablating 50% of the network to force a signal), they will pass the checklist while producing nonsense.
  *   **Mitigation:** The Philosopher on the panel has veto power on "experimental integrity" before Step 1 begins.

  **2. Underdetermination is Permanent**
  Step 4 acknowledges that evidence often underdetermines theory. This procedure does not *solve* underdetermination; it forces you to admit when it exists. If you reach Step 4 and fail, you cannot "try harder" to pass. You must downgrade the claim. This will frustrate researchers who want strong claims. Stand firm.

  **3. The Values Punt is Not a Cop-Out**
  Step 5 looks like a bureaucracy hurdle. It isn't. It is the explicit recognition that "Representation" is partly a normative category in safety contexts. Saying "This is deceptive" is a speech act with liability. The checklist identifies *when* that liability is triggered, but only human leadership can accept it.

  **4. Structural Realism Limit**
  We map "Robustness" to Structural Realism. However, if *all* models trained on current internet data share the same biases, robustness across seeds might just mean robustness across *errors*. Do not treat Step 3 as proof of truth, only proof of stability.

  **5. Timebox Enforcement**
  If the panel spends >45 minutes debating Step 4 (Specificity), the evidence is likely insufficient. Default to Downgrade. Ambiguity favors the weaker claim.
