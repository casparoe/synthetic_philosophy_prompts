answer: |-
  **TO:** Explorations Fund Committee
  **FROM:** [Your Name]
  **RE:** Final Slot Decision & Procedural Reform
  **DATE:** Monday, [Date]

  **Bottom Line:** Fund Applicant A. Adopt a "Pre-Defined Reference Class" protocol for future rounds.

  **Recommendation**
  Applicant A fits our charter ("high-risk… never survive a normal study section"). Applicant B is too safe; his work belongs in standard federal channels. Funding B violates our mandate to create new reference classes. This is not merely an explore/exploit tradeoff; it is endogenous. If we only fund where base rates exist, we ensure new fields never generate them.

  **Standing Rule**
  To balance inside/outside views without gerrymandering:
  1.  **Define the reference class** (subfield, career stage) *before* reading proposals. Consensus here prevents selecting classes to fit desired outcomes.
  2.  **Base rates calibrate risk, not veto.** They inform probability, not eligibility.
  3.  **Inside-view overrides** require identifying specific causal features differentiating the applicant from the class average (e.g., "new method X solves failure mode Y"), not just "novelty."

  **The Losing Side (Steelman)**
  The base-rate advocates are right that unstructured committee judgment is structurally overconfident. "This case is special" is the standard bias of experts. Our mandate argument risks being a self-serving narrative to justify intuition. If we cannot beat the base rate consistently, we are burning money on ego. The claim that "base rates don't apply to innovation" is often a shield against accountability. We must accept that we might be wrong about A.

  **Feedback Loop**
  We must verify if our judgment adds value. Pre-commit to a 5-year audit. Metrics: Follow-on funding and citation impact relative to a matched control group of similar-risk proposals from other institutions (using public data). If our hit rate < base rate of similar risks elsewhere, we dissolve the inside-view override. This forces us to learn whether our "special case" intuition is signal or noise.

  **For B's Department Chair**
  "This decision reflects portfolio strategy, not quality. B's project is excellent but fits standard funding channels. This fund is restricted to high-risk gaps that cannot be funded elsewhere. Funding B here would displace a project that has no other path, whereas B has multiple. We are protecting our ability to fund things nobody else will."

  **Epistemic Status**
  *   **Settled:** Human judgment is overconfident; base rates generally outperform intuition in forecasting.
  *   **Disputed:** How to weight base rates when the act of funding changes the environment (endogenous risk). Forecasting experts disagree on handling "zero-base-rate" scenarios.
  *   **Confidence:** High on funding A (mandate fit). Moderate on the procedural rule (untested). If confidence on the rule were lower, I would suggest deferring the slot, but the mandate requires action. Proceed, but audit rigorously.
