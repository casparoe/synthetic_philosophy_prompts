  hey, so I'm in this philosophy club at school and there's a senior, Malik, who's basically self-taught off youtube and keeps this giant notes-app doc where he rates things on "is there a subject in there, and how many." Me and him have a running bet, and friday's session is on the panpsychism thing — the idea that everything has a tiny bit of experience and then the hard part is how the tiny ones add up to a big one. I want to win the bet. So: predict what he'll say about the new case below, tell me the rule he's actually running, the other rules that fit his old verdicts just as well, and which extra case would tell them apart. Please don't give me a reading list or tell me whose paper to look up — I can't get any of that anyway, and neither has he.

  His verdicts so far:

  - a single electron: yes, but the tiniest possible flicker, closer to nothing than to anything
  - a rock: no. There's no "what it's like to be the rock," even though the quarks inside it have their flickers. He says they just don't add up.
  - a human: one subject, obviously
  - a beehive: no hive-subject, just 50,000 bee-subjects, even though the hive solves problems no single bee can
  - the same hive, but you wire the bees so each one feels exactly what its neighbours feel, all the way through: he says that DOES give you one subject. One, not 50,000.
  - two people hooked to a machine that lets them share one sense (each sees the other's visual field as well as their own): still two subjects. Sharing some experiences doesn't merge them.
  - two identical brain emulations running side by side on two laptops, in exactly the same states, chips not conscious: two subjects, not one. "being identical isn't being the same one."
  - a normal emulation of your brain on a laptop, chips not conscious: one subject, and it has experiences like yours
  - someone under general anaesthesia or in deep dreamless sleep: zero subjects for that stretch, but same person before and after
  - a patient who had the corpus callosum cut: still one subject, not two — I think because the brainstem stuff is still shared, that's roughly what he said

  New case, the one I actually care about: instead of running the emulation on a laptop, you build it out of a billion tiny robots. Each robot on its own is conscious — about as much as a bee, its own simple little experience. They're wired so that the swarm's causal organization is exactly the causal organization of your brain: same inputs, same outputs, says everything you'd say, passes every test you'd throw at it. But the robots don't share experiences with each other. They just pass signals along, and each one keeps having its own separate bee-sized experience the whole time.

  How many subjects are in the box? Is there a subject in there whose experience is like mine? Does he say yes, no, or "one, and it's literally made out of the bee ones"? And here's the one I keep failing to get a number out of him on: what if you swap one robot out for an unconscious dummy chip that does the same job? Does anything change about the big experience, or not?

  The bit I can't work out is which rule he's running. As far as I can tell there are at least three that fit his old verdicts: (1) subjects only fuse when their experiences literally get shared or merged into the same one, so a swarm that never shares never fuses — that seems to predict no human-level subject at all, a box that talks like me with nothing it's like to be it; (2) there's a subject wherever the causal organization is the right kind, whatever the parts are up to — that seems to predict one human-like subject, and leaves you with the weird question of what happened to the bee ones; (3) the big subject just is the little ones arranged right, so its experience is composed of theirs — which predicts one human-like subject, but also that swapping in a dummy chip should change or break something. Maybe (2) and (3) say the same thing here and I'm not seeing it.

  Which rule fits his verdicts best, what does each of them say about the robot swarm, and what single extra case should I spring on him at the end to separate them? I was thinking something with a dial on it — start with the robots sharing nothing and slowly turn up how much they share, then ask him at what point the number of subjects changes — but I'm worried he'll just say "it's gradual, there's no exact point," which is useless for winning a bet. Also, don't just tell me what you think is actually true: I need what he'll say, and the case that pins him down.
