prompt: |-
  I write the interpretive text for the natural history galleries of a medium-sized regional museum. That means roughly forty object labels a year, sixty words or fewer each, every one of them signed off by our curator of geology, who has no training in evolutionary biology and who is, on principle, hostile to any sentence that sounds hedged. The labels are permanent, they are read by around two hundred thousand people a year, and our funders particularly like the panels that say what a trait is *for*. A complaint from a visiting evolutionary biologist — that a good half of our why-it-evolved panels were speculative stories dressed up as findings — has been upheld by the director, and I have been asked to produce a written procedure that my team can run on any proposed trait-and-function claim before it goes into a label.

  Please write that procedure for me. What I need is something runnable in about fifteen minutes per label by someone with school-level biology, working from whatever brief accompanies the specimen: a sequence of questions asked in a fixed order, what counts as an acceptable answer to each, the points at which the procedure stops and returns not established, and the points at which it stops and hands the decision to a person because the question has become one of values rather than fact.

  The conceptual material I want it answerable to is the critique of the adaptationist programme associated with Gould and Lewontin's spandrels paper — not as a slogan I can cite, but as something that changes what ends up on the wall. Specifically, I want it to do the following.

  Interrogate the individuation of the trait before anything else. Most of our bad panels, I think, fail here: the trait is picked out by the very effect it is supposed to explain, so the claim cannot be tested and cannot fail. Give me a question that catches this, phrased so that a non-specialist can apply it, and say what we do with a proposal whose trait dissolves under it.

  Make the alternatives explicit and symmetric. A proposal should not be accepted unless at least one non-adaptive alternative has been stated with comparable specificity: an architecturally necessary by-product of some other feature, the co-option of an existing structure for a new function, inheritance from an ancestor with no current function, a developmental or allometric consequence of body size or growth pattern, drift, or the possibility that the trait has no non-arbitrary boundaries at all. Give me this as a menu with a rule for how many alternatives must be written down and how specific they must be.

  Grade the kinds of evidence that can discriminate between them, and say what each kind can and cannot establish: correlation between independent origins of the trait and the supposed selective regime across related lineages, experimental manipulation of the trait or of the environment, direct measurement of selection in the field, and fit to an engineering or optimality model. Include what to do when the brief contains none of these and only reports what a handbook says.

  Separate three claims that our current labels all collapse into one: that the trait originated by selection for function F, that it is currently maintained by selection for F, and that it is currently useful for F although it arose for some other reason or for no reason at all. Each should license a different wording, and I want the wording rule stated, together with two or three model sentences of agnostic copy that my curator will actually pass.

  Operate inside sixty words. Where the honest verdict is that we do not know, tell me what the label should say instead of the explanation it cannot give.

  Include a check on the set as well as on the item. Individually defensible labels can still add up to a gallery that presents organisms as collections of optimally engineered devices, and that is the substance of the complaint against us. Give me a way to audit a batch of labels: how to sample or count them, what pattern triggers a revision, and what the revision consists of.

  Mark clearly what the curator is being asked to certify at each kind of outcome, and where the procedure must stop because the question has stopped being factual — in particular where the risk of overclaiming to a quarter of a million visitors has to be weighed against the cost of a hedge that nobody reads.

  Then run the procedure on three proposals. First, a label on the dark form of the peppered moth saying it evolved to match soot-blackened bark, with a brief noting that dark forms appeared independently in many industrial regions. Second, a label on the human chin, with two competing briefs: one saying it evolved to withstand the mechanical stresses of chewing, one saying it evolved as a signal in mate choice. Third, the case I will not like: our most successful temporary format, a Survival gallery of twenty-five specimens in which each one gets a why-it-evolved panel, researched to the standard of a popular science book and much loved by the funders. Apply the procedure to the format as a whole and tell me what it does to it.

  Finally, say honestly what the procedure cannot do: the cases where the underlying biology is unsettled in ways a fifteen-minute check will never reach, and the whole regions of our collection — early hominins, deep time, behaviour that leaves no fossil trace — where the procedure will systematically return not established and the gallery will end up saying nothing at all.

  Do not give me references, citations or a reading list; my team has no library access and cannot follow them up, and the specimen brief is all we will ever have. Please write the whole answer in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**

      *   **Role:** Writer of interpretive text for natural history galleries (medium-sized regional museum).
      *   **Constraint 1 (Output):** A written procedure for vetting trait-and-function claims.
      *   **Constraint 2 (Audience):** Team with school-level biology; Curator of Geology (hostile to hedging, no evo-bio training); Director (upheld complaint about speculation); Funders (like "what it's for").
      *   **Constraint 3 (Format):** Runnable in ~15 mins/label. Fixed sequence of questions. Acceptable answers defined. Stop points defined. Value-judgment hand-offs defined. British English. No citations/references.
      *   **Constraint 4 (Conceptual Basis):** Gould & Lewontin's critique of adaptationism (Spandrels), specifically:
          *   Interrogate trait individuation (avoid defining trait by function).
          *   Make alternatives explicit/symmetric (non-adaptive hypotheses).
          *   Grade evidence (correlation, experiment, measurement, modelling).
          *   Separate claims (origin vs. maintenance vs. current utility).
          *   Word count discipline (60 words/label).
          *   Audit the *set* (avoid "optimally engineered" gallery vibe).
          *   Curator certification points.
      *   **Constraint 5 (Testing):** Run the procedure on three cases:
          1.  Peppered Moth (industrial melanism).
          2.  Human Chin (mechanical vs. sexual selection).
          3.  "Survival Gallery" (25 specimens, all "why-it-evolved").
      *   **Constraint 6 (Honesty):** State limitations (what the procedure *can't* do, e.g., deep time, hominins).

  2.  **Drafting the Procedure (Section by Section):**

      *   *Title:* Needs to sound official but practical. "Trait-Function Claim Verification Protocol."
      *   *Step 1: Trait Individuation.* The "Spandrel" check. Is the trait defined by what it does?
          *   *Question:* "Can you describe the trait without mentioning what it is for?"
          *   *Fail:* If no, rewrite or reject.
      *   *Step 2: Alternative Hypotheses.* The "Menu."
          *   *Rule:* Must list at least one non-adaptive alternative.
          *   *Menu:* By-product, Co-option (exaptation), Drift, Allometry/Constraint, Ancestral inheritance.
          *   *Specificity:* Must be physically plausible, not just "maybe drift."
      *   *Step 3: Evidence Grading.*
          *   *Tier 1 (Strong):* Experimental manipulation, direct selection measurement.
          *   *Tier 2 (Moderate):* Comparative phylogeny (independent origins), engineering models.
          *   *Tier 3 (Weak):* Handbook assertion, "looks like."
          *   *Rule:* Tier 3 cannot support an "evolved for" claim.
      *   *Step 4: Claim Separation & Wording.*
          *   *Origin:* "Evolved to..." (Requires Tier 1/2 + Origin evidence).
          *   *Maintenance:* "Maintained by..." (Requires current selection evidence).
          *   *Utility:* "Used for..." / "Functions in..." (Allows exaptation).
          *   *Agnostic Copy:* Needs to satisfy the Curator (no "maybe") but remain accurate.
      *   *Step 5: Word Count & Ignorance.*
          *   If "Not Established," what goes on the wall? "Function debated," "Origin unclear."
      *   *Step 6: Gallery Audit.*
          *   Check the batch. If >80% are "evolved for," trigger review.
      *   *Step 7: Sign-off.*
          *   Where does the Curator step in? When evidence is Tier 3 but funders want a story. This is the Value Judgement hand-off.

  3.  **Refining the Content (British English & Tone):**

      *   Use "programme," "centre," "label," "specimen."
      *   Tone: Bureaucratic but intellectually rigorous. Clear instructions.
      *   Curator constraint: He hates hedging. So the "agnostic copy" must sound definitive about the *state of knowledge*, not tentative about the *biology*. (e.g., "Scientists debate..." vs "It might be...").

  4.  **Running the Test Cases:**

      *   *Peppered Moth:*
          *   Trait: Dark pigmentation (not "camouflage").
          *   Alternatives: Pollution toxicity? (Unlikely).
          *   Evidence: Kettlewell's experiments (Tier 1), independent origins (Tier 2).
          *   Verdict: Passes. "Evolved for camouflage" is safe *here*.
      *   *Human Chin:*
          *   Trait: Bony protrusion on mandible.
          *   Alternatives: Mechanical stress (Tier 2), Sexual selection (Tier 2), By-product of face shrinking (Spandrel).
          *   Evidence: Conflicting models. No direct measurement.
          *   Verdict: "Not Established." Wording: "Function debated."
      *   *Survival Gallery:*
          *   Audit: 25/25 "Evolved for."
          *   Trigger: >80% threshold breached.
          *   Action: Must convert at least 5 to "Current Utility" or "Origin Unknown."

  5.  **Addressing Limitations:**

      *   Deep time, behaviour, hominins. The procedure will kill these labels.
      *   Honesty: Acknowledge that silence is better than fiction.

  6.  **Review against Constraints:**

      *   15 mins? Yes, it's a checklist.
      *   School-level biology? Yes, avoided jargon where possible.
      *   Curator hostility? Addressed via specific wording rules that sound firm.
      *   Gould/Lewontin spirit? Yes, focused on constraints and alternatives.
      *   British English? Checked.
      *   No citations? Checked.

  7.  **Drafting the Text (Iterative refinement):**

      *   *Self-Correction on Wording:* The curator hates "may" or "might." I need to phrase the uncertainty as a fact. "The origin is unknown" is a fact. "It may be for X" is a hedge.
      *   *Self-Correction on Audit:* Make sure the audit is quantitative.
      *   *Self-Correction on Test Cases:* Ensure the output for the Survival Gallery is drastic, as requested ("The case I will not like").

  8.  **Final Polish:** Check word counts (of the procedure itself isn't constrained, but the *labels* are). Ensure the distinction between Origin, Maintenance, and Utility is clear in the wording rules.

      *(Self-Correction during drafting)*: I need to make sure I don't sound *too* academic. This is a museum internal document. It needs to be actionable.
      *(Self-Correction on Curator)*: The prompt says the curator is hostile to hedging. The procedure must give him a way to sign off on *uncertainty* without using hedge words. "Current function is unknown" is not a hedge; it's a statement of fact.

      *(Final check on British English)*: Programme, centre, colour, modelling (with two l's), behaviour.

      *(Final check on the "Survival Gallery")*: This needs to be the hard truth. If the procedure is followed, the gallery concept breaks. I must state that clearly.

      *(Final check on Limitations)*: Be honest about where the procedure fails (deep time).

      Let's assemble.

      *Structure:*
      1. Protocol Title & Purpose.
      2. The Six-Step Verification Sequence.
      3. Wording Rules (The 60-word constraint).
      4. Gallery Audit Protocol.
      5. Sign-off & Value Judgements.
      6. Test Cases (Moth, Chin, Gallery).
      7. Limitations Statement.

      *Wait, one detail:* "Mark clearly what the curator is being asked to certify... and where the procedure must stop because the question has stopped being factual." I need to highlight this specifically.

      *Another detail:* "Give me a question that catches this [trait individuation], phrased so that a non-specialist can apply it."
      *Another detail:* "Give me this as a menu [alternatives]..."
      *Another detail:* "Grade the kinds of evidence..."
      *Another detail:* "Separate three claims... wording rule stated... model sentences."

      Okay, I will structure the procedure to explicitly hit these bullets.

      *Let's write.*
answer: |-
  **MUSEUM OF NATURAL HISTORY: INTERPRETIVE TEXT PROTOCOL**
  **Subject:** Verification of Trait-and-Function Claims (TFC)
  **Applicability:** All permanent gallery object labels (60 words max)
  **Time Allocation:** 15 minutes per label

  ### 1. THE VERIFICATION SEQUENCE

  Run the following questions in order. If any step returns **STOP**, proceed to the Wording Rules (Section 2).

  **Q1: Trait Individuation**
  *Question:* Can you describe the physical trait without using a word that implies a job or purpose?
  *Acceptable:* "Dark wing pigmentation," "Bony protrusion on the mandible."
  *Unacceptable:* "Camouflage," "Chin for chewing."
  *Action:* If the trait dissolves (e.g., "The camouflage evolved..."), **STOP**. The claim is untestable. Rewrite the brief to describe the anatomy only.

  **Q2: Alternative Hypotheses**
  *Rule:* You must write down at least **one** non-adaptive alternative with comparable specificity to the adaptive claim.
  *Menu:*
  1.  **By-product:** A necessary consequence of another structure's growth (a spandrel).
  2.  **Exaptation:** Co-opted from an ancestor for a new use.
  3.  **Constraint:** Dictated by physics, chemistry, or developmental allometry.
  4.  **Drift:** Random fixation with no selective advantage.
  *Action:* If the brief lists only adaptive reasons, **STOP**. Request revision.

  **Q3: Evidence Grading**
  *Grade the evidence provided in the brief:*
  *   **Tier A (Strong):** Experimental manipulation; direct measurement of survival/reproduction in the field.
  *   **Tier B (Moderate):** Correlation of independent trait origins with environmental shifts across a phylogeny; fit to engineering/optimality models.
  *   **Tier C (Weak):** Handbook assertion; "looks like"; analogy with other species.
  *Action:*
  *   Tier A or B supports an **Origin** claim.
  *   Tier C supports only a **Utility** claim.
  *   No evidence listed: **STOP**. Return to researcher.

  **Q4: Claim Separation**
  *Determine which claim the evidence supports:*
  1.  **Origin:** It arose *because* of Function F. (Requires Tier A/B + Q2 passed).
  2.  **Maintenance:** It is kept *because* of Function F. (Requires current selection data).
  3.  **Utility:** It is *used* for Function F. (Allows exaptation; requires Tier C+).
  *Action:* If the brief conflates these, **STOP**. Select the weakest claim supported by the evidence.

  ### 2. WORDING RULES (60 WORDS MAX)

  **The Curator's Constraint:** Do not use hedging words ("may," "might," "possibly"). State the state of knowledge as a fact.

  **If Origin is Established (Tier A/B):**
  *   *Rule:* Use active verbs.
  *   *Model:* "Natural selection favoured dark pigmentation in soot-polluted regions. Birds ate visible moths. This trait spread rapidly during the Industrial Revolution."

  **If Origin is Unclear but Utility is Known (Tier C/Exaptation):**
  *   *Rule:* Use present tense or passive construction regarding origin.
  *   *Model:* "The chin protrusion withstands chewing stress. Scientists debate whether this stress caused its origin. It likely arose as a by-product of face shortening."
  *   *Model:* "Feathers insulate. They originally evolved for display in ancestors. Flight was a later development."

  **If Not Established (Q1 or Q2 Fail):**
  *   *Rule:* State the debate or ignorance as the fact.
  *   *Model:* "The function of this trait is debated. Proposals include heat retention and mate attraction. No consensus exists on its origin."
  *   *Model:* "Why this structure evolved remains unknown. It appears in many lineages without a clear environmental link."

  ### 3. GALLERY AUDIT PROTOCOL

  Individual labels may pass while the gallery misleads. Audit every batch of 25 labels.

  *   **Count:** How many labels claim an adaptive **Origin** ("Evolved to...")?
  *   **Threshold:** If >60% claim adaptive Origin, the batch fails.
  *   **Trigger:** A gallery of "perfect machines" is factually incorrect.
  *   **Revision:** Convert the lowest-evidence Origin claims to **Utility** or **Not Established** wording until the ratio is ≤60%.
  *   **Curator Sign-off:** The Curator certifies the *ratio*, acknowledging that scientific accuracy requires displaying uncertainty.

  ### 4. SIGN-OFF AND VALUE JUDGEMENTS

  **Factual Decisions (Writer/Researcher):**
  *   Does the trait description imply function? (Q1)
  *   Is there an alternative hypothesis listed? (Q2)
  *   What is the Evidence Tier? (Q3)

  **Value Judgements (Curator/Director):**
  *   **The Risk Point:** When evidence is Tier C (Weak) but Funders demand an Origin story.
  *   **Procedure:** The Writer must flag this as "Tier C: Origin Unproven."
  *   **Certification:** The Curator signs to accept the reputational risk of overclaiming. The label must still avoid hedging words, stating the claim as a "Traditional view" rather than fact.
  *   **The Stop Point:** If the brief offers no Alternative Hypothesis (Q2), the Curator cannot certify. The label must state the uncertainty.

  ---

  ### 5. PROCEDURE TEST CASES

  **Case 1: Peppered Moth (Dark Form)**
  *   **Q1 (Individuation):** "Dark wing pigmentation." (Pass).
  *   **Q2 (Alternatives):** Brief notes industrial regions. Alternative: Pollution toxicity? (Rejected as implausible). Camouflage is the only viable hypothesis. (Pass).
  *   **Q3 (Evidence):** Kettlewell experiments (Tier A); Independent origins in US/UK (Tier B). (Pass).
  *   **Q4 (Claim):** Origin and Maintenance supported.
  *   **Verdict:** **ESTABLISHED.**
  *   **Label Copy:** "Dark pigmentation evolved to match soot-blackened bark. Birds ate visible moths. This trait spread rapidly in industrial regions. Where air cleared, light forms returned. Selection directly drove this change." 
  **Case 2: Human Chin**
  *   **Q1 (Individuation):** "Bony protrusion on the mandible." (Pass).
  *   **Q2 (Alternatives):** Brief A: Chewing stress. Brief B: Mate choice. Missing: By-product of face shrinking. (Fail).
  *   **Action:** Require Spandrel hypothesis. Even with it, evidence is modelling only (Tier B).
  *   **Q3 (Evidence):** Conflicting models. No direct measurement. (Tier B/C boundary).
  *   **Q4 (Claim):** Origin disputed. Utility (chewing) plausible but not exclusive.
  *   **Verdict:** **NOT ESTABLISHED (Origin).**
  *   **Label Copy:** "This bony protrusion withstands chewing stress. Scientists debate whether stress caused its origin. It may be a by-product of face shortening. No single explanation is proven." 
  **Case 3: The 'Survival Gallery' (25 Specimens)**
  *   **Audit:** 25/25 labels currently read "Evolved to..."
  *   **Threshold:** 100% > 60% limit. **FAIL.**
  *   **Revision:** The format is scientifically invalid. You cannot claim adaptive origin for 25 consecutive traits without implying organisms are optimally engineered.
  *   **Action:** Minimum 10 labels must be downgraded to **Utility** ("Used for...") or **Not Established** ("Origin debated...").
  *   **Impact:** The "Survival" narrative weakens. The gallery becomes "Survival and Constraint." Funders must be told the original promise was biologically impossible.

  ---

  ### 6. LIMITATIONS STATEMENT

  This procedure cannot resolve cases where the biology is fundamentally unsettled.

  1.  **Deep Time:** For fossils older than 10 million years, behavioural evidence is absent. Evidence will rarely exceed Tier C. Most labels will return **NOT ESTABLISHED**.
  2.  **Hominins:** Brain size and bipedality briefs often lack Alternative Hypotheses. The procedure will systematically silence these labels.
  3.  **Behaviour:** Traits leaving no fossil trace cannot be tested for Origin.
  4.  **Consequence:** Large sections of the collection will carry labels stating "Function unknown." This is the cost of accuracy. Silence is preferable to fiction.

  **End of Protocol.**
