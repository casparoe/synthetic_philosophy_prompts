          *   Interdictory Culture: Based on guilt, sin, commandments, renunciation. Meaning comes from submission to moral demands.
          *   Therapeutic Culture: Based on relief, well-being, psychological adjustment. Meaning comes from feeling good/functioning well.
          *   Critique: Modernity replaces guilt with "survivor guilt" or manages it away. It dissolves the moral authority of the past to make the present livable.
