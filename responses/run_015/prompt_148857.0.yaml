      *   *Margalit's Perspective:* How would he view this? He distinguishes thick/thin. If the architecture respects thick relations (e.g., victims and perpetrators within the same polity), it might be ethical. Institutionalizing memory can help sustain the "moral community." *However*, Margalit is wary of "official" memory if it becomes hollow. But generally, he supports the *duty* to remember within the community.

      *   *Rieff's Perspective:* He would be skeptical. Any "design" of memory sounds like management. If the goal is to "release" guilt ceremonially, that sounds therapeutic. It turns moral failure into a psychological hurdle to overcome. It risks making the culture "non-moral" in the traditional sense.

      *   *The Crux (The Comparison):*
