answer: |-
  This is a sharp observation, and you have correctly identified the most significant normative tension in Risk-Weighted Expected Utility (REU) theory. You are not missing a word; you are staring directly at the **"Individuation of Prospects"** problem (sometimes discussed as the **"Aggregation Problem"** for REU).

  Here is a breakdown of the terminology, the mathematical unity of the phenomenon, the distinction from descriptive bracketing, and the normative implications for your chapter.

  ### 1. Does it have a name?
  The established philosophical term is **"Individuation of Prospects"** (or **"Prospect Individuation"**).

  *   **Source:** This is the standard label in the critical literature surrounding Buchak's *Risk and Rationality* (2014). See specifically **Johanna Thoma (2016), "Risk-Weighted Expected Utility and the Individuation of Prospects"** (*Synthese*).
  *   **Alternative:** Some formalists refer to it as **"Non-additivity over Independent Prospects"** or **"Failure of Decomposability."**
  *   **For your chapter:** If you need a term for the *agent's sensitivity* specifically (rather than the philosophical problem), **"Compositional Sensitivity"** or **"Structural Sensitivity"** works well. It captures that the value depends on the composition of the option, not just the final distribution.

  ### 2. Is it one phenomenon or two?
  It is **one phenomenon**. The dependence on the curvature of $r$ does not split it into two distinct kinds of effects; it is simply the directionality of the same non-linearity.

  *   **The Mechanism:** The core feature of REU is that the risk function $r$ transforms cumulative probabilities non-linearly. Because $r$ is non-linear, $r(p_1 + p_2) \neq r(p_1) + r(p_2)$.
  *   **The Direction:**
      *   If $r$ is convex (risk-averse in Buchak's sense), the function is super-additive over the relevant intervals for independent gambles. Bundling reduces the "effective risk" (diversification benefit), so $REU(G_1 + G_2) > REU(G_1) + REU(G_2)$.
      *   If $r$ is concave (risk-seeking), the function is sub-additive. Bundling dilutes the "thrill" of the tail risk, so $REU(G_1 + G_2) < REU(G_1) + REU(G_2)$.
  *   **Analogy:** We do not say "diminishing marginal utility" and "increasing marginal utility" are two different phenomena; they are both "non-linear utility." Similarly, this is simply **"Non-additivity of Risk-Weighted Value."**

  ### 3. How does it differ from "Narrow Bracketing"?
  You are right to be wary of importing the behavioral economics label. The distinction is **normative status**.

  *   **Descriptive (Kahneman/Thaler):** Narrow bracketing is a **bias**. The normative benchmark is Expected Utility (or broad integration). The agent *ought* to integrate, but fails due to cognitive limitations or myopia.
  *   **Normative (Buchak/REU):** Sensitivity to individuation is a **feature**. The agent *ought* to care about the structure of the gamble, not just the final distribution. For an REU agent, "a 50/50 gamble of \$0/\$100" and "two 50/50 gambles of \$0/\$100 bundled" are **different options**, even if they map to the same final wealth distribution.
  *   **The Crucial Difference:** In descriptive theory, fixing the bracketing fixes the error. In REU, fixing the bracketing (e.g., forcing "maximal width") changes the agent's fundamental attitudes and may collapse the theory back into EU (see below).

  ### 4. Is there a principled answer about the "Unit of Decision"?
  This is the hard pill to swallow for the chapter. **There is no consensus principled answer, and this is widely regarded as the Achilles' heel of REU.**

  There are three main positions in the literature:

  1.  **Global REU (The "Life" Unit):** Apply the risk function to the agent's total lifetime wealth distribution.
      *   *Pros:* Solves the bundling problem. Independent gambles aggregate via the Central Limit Theorem, smoothing the distribution.
      *   *Cons:* **Convergence to EU.** As the number of independent prospects grows, the REU value converges to the EU value. This undermines the motivation for REU, which is built on Allais-style intuitions about *single* cases. If the theory only applies to isolated, one-off decisions, it's fragile; if it applies to life, it disappears.
  2.  **Local REU (The "Choice Occasion" Unit):** Apply the risk function to each decision as presented.
      *   *Pros:* Preserves the Allais intuitions.
      *   *Cons:* Vulnerable to **manipulation by description**. As you noted, an adversary (or the agent themselves) can repackage options to induce preference reversals.
  3.  **Attitude-Dependent Individuation (Buchak's View):** The unit is determined by the agent's own risk attitudes. If the agent treats them as separate, they are separate.
      *   *Pros:* Respects the agent's perspective.
      *   *Cons:* Criticized as ad hoc. It makes the theory vulnerable to "framing" in a way that looks like irrationality. If I can make you accept a bundle by merely drawing a box around two gambles, have I changed the options or just your description of them?

  ### 5. Recommendation for the Chapter
  You suspect that "always bracket maximally widely" kills the view. **You are correct.** This is Thoma's primary critique. If the REU agent is rational, they should recognize that two independent gambles offered sequentially are part of a larger portfolio. If they update their risk attitude to reflect the portfolio, the risk-weighting diminishes.

  For your chapter, I suggest the following moves:

  1.  **Adopt the term "Individuation Sensitivity."** Define it as the property where $REU(\bigoplus G_i) \neq \sum REU(G_i)$ for independent $G_i$.
  2.  **Acknowledge the Dilemma.** State clearly that REU requires a constraint on prospect individuation to avoid manipulation, but imposing a "maximal aggregation" constraint causes the theory to collapse toward EU over time.
  3.  **Propose a "Decision Node" Constraint.** A principled middle ground often suggested is that the unit of decision is the **maximal set of independent uncertainties resolvable at a single decision node without new information.**
      *   If the gambles are offered together *ex ante*, they must be bundled.
      *   If they are offered sequentially *with resolution in between*, they can be separated.
      *   *Why this helps:* It prevents an adversary from bundling two sequentially offered gambles just to change your mind, because by the time the second is offered, the first is resolved (changing the wealth state).
  4.  **Coin a Term if Necessary:** If you feel "Individuation" is too passive, coin **"Risk-Structural Non-Separability."** It emphasizes that the risk structure is not separable from the option description.

  **Summary for your text:**
  > "This phenomenon is standardly referred to in the literature as the **problem of prospect individuation** (Thoma 2016; Buchak 2014). It arises from the **non-additivity of risk-weighted value over independent prospects**. While descriptively similar to 'narrow bracketing,' it is normatively distinct: for the REU agent, the packaging *constitutes* the risk structure, rather than obscuring it. However, without a principled constraint on individuation, the view is vulnerable to description-relativity; with a constraint of maximal aggregation, it risks converging to Expected Utility over repeated choices."

  This frames the problem accurately, cites the right people, and validates your intuition that the "unit of decision" is the unresolved tension in the theory.
