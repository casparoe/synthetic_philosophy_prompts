answer: |-
  ### Take-Home Essay Question

  **Course:** Ancient Philosophy Seminar (Upper-Level)  
  **Texts:** *Nicomachean Ethics* V.5 (1133a–b); *Politics* I.10 (on usury)  
  **Time:** 90 minutes  
  **Length:** Approx. 700 words  

  **The Case of Sykaminon**  
  Following a harvest failure, the city of Sykaminon decrees: (1) All contracts and prices are reckoned in a *chreia-unit*, fixed by statute to a basket of necessaries (grain, oil, wine, etc.) for twenty years. No coins denominated in *chreia-units* are struck. (2) Payments are made in silver staters at a daily posted rate against the *chreia-unit*. (3) The merchant Kleinias lends 100 *chreia-units*, repayable as 110 *chreia-units* in one year, settled in silver at the repayment date's rate. Over the year, the silver-value of the *chreia-unit* rises by exactly 10%.

  **Question**  
  Using passages (A) and (B) above and Aristotle's argument against usury in *Politics* I, evaluate the Sykaminon decree. Your answer must address the following:  
  1.  **Function:** Aristotle assigns money two jobs: measuring commensurability and serving as a medium for future exchange. Does the *chreia-unit* perform the measuring job without the circulating job? If the jobs are split, can reciprocal justice survive without a single physical token doing both?  
  2.  **Representation:** Aristotle claims demand (*chreia*) is the real standard, while money represents it by convention. Is the fixed basket a better representative of demand than silver? Consider his claim that demand alters, but also his wish that prices were fixed.  
  3.  **Usury:** Is Kleinias's loan *tokos* (usury)? Distinguish between the increase in *units* and the increase in silver. Does Aristotle's objection target the nominal breeding of currency or the real growth of purchasing power?

  ***

  ### Model Answer

  Aristotle's account of money in *NE* V.5 relies on two distinct functions: money acts as a measure (*metron*) making dissimilar goods commensurable, and as a medium (*meson*) guaranteeing future exchange. In Sykaminon, the *chreia-unit* performs the measuring job without circulating, while silver circulates without measuring. Aristotle's text suggests the measuring function is primary for justice. Passage (A) states money is introduced "to meet this requirement" of comparison; passage (B) adds it serves as a "guarantee of exchange in the future." While Aristotle typically conflates these in the coin (*nomisma*), the logic of reciprocal justice requires commensurability first. If silver merely executes payment based on the *chreia-unit's* measure, justice is preserved because the "diagonal conjunction" (builder to shoemaker) is calculated against the basket of needs, not the fluctuating metal. Thus, reciprocal justice can survive the split, provided the medium (silver) remains subordinate to the measure (units).

  However, the *chreia-unit* fails as a representative of demand in Aristotle's terms. Passage (A) insists the standard is "in reality demand... if men cease to have wants or if their wants alter, exchange will go on no longer, or be on different lines." The Sykaminon basket is fixed for twenty years by decree. While Aristotle notes in (B) that "the proper thing is for all commodities to have their prices fixed" to ensure association, he admits money is "liable to the same fluctuation of demand as other commodities." By legally freezing the basket, Sykaminon treats demand as static when it is naturally fluid. Silver, though imperfect, fluctuates with actual demand. The reform attempts to fix by law what Aristotle says is fixed by human need (*chreia*). Consequently, the unit becomes a rigid convention (*nomos*) detached from the reality it should measure, risking the breakdown of exchange if the basket no longer reflects actual wants.

  Regarding Kleinias's loan, the verdict depends on whether Aristotle condemns nominal increase or real gain. In *Politics* I, Aristotle argues usury is unnatural because "money is intended to be used in exchange, not to increase at interest... gain comes from the money itself." In Sykaminon, the loan specifies 110 units (nominal breeding), but the silver repaid equals the silver lent (zero real gain). If Aristotle's objection is that money is barren—meaning it cannot naturally generate value—then Kleinias's contract violates this principle by treating the unit as a breeding stock, regardless of the silver outcome. The contract structure makes money the source of gain (*tokos*), even if inflation neutralizes it. However, if the objection targets unjust enrichment (gaining from the money itself rather than use), Kleinias is innocent: he gains no purchasing power. Yet, Aristotle's deeper complaint is against *chrematistike* (wealth-getting) divorced from household management. By contracting for interest in units, Kleinias treats money as an end. Even if the silver return is flat, the *form* of the loan assumes money breeds, which contradicts the nature of currency as a measure of need. Thus, it remains *tokos* because the intent violates the natural limit of money as a medium for satisfying demand.

  In sum, Sykaminon successfully separates the measuring from the circulating function, preserving commensurability. However, it fossilizes demand into a legal basket, violating Aristotle's view that demand alters. Finally, Kleinias's loan retains the unnatural form of usury, even without real gain, because it treats money as a generative source rather than a convention for exchange.

  ***

  ### Marking Scheme

  | move | marks | a_level | b_level | typical_mistake |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Function (Measure vs. Medium)** | 8 | Argues measuring is primary for justice; split is viable if silver executes the unit's measure; cites (A)/(B) on commensurability. | Identifies the two jobs but claims they *must* be identical in one coin; or says split is impossible without textual support. | Recites "money is conventional" without addressing the functional split; ignores the role of silver as medium. |
  | **2. Representation (Basket vs. Silver)** | 9 | Notes tension: Aristotle wants fixed prices but admits demand fluctuates; argues basket fixes representation, not demand itself. | Says basket is better because it is stable; or worse because it is conventional, without citing the "wants alter" passage. | Claims Aristotle wants fixed prices so basket is perfect; ignores the 20-year rigidity vs. changing wants. |
  | **3. Usury (Nominal vs. Real)** | 8 | Distinguishes nominal increase (units) from real increase (silver); argues form/intent violates nature even if gain is zero. | Says it is usury because 10% interest exists; or not usury because no silver gain, without referencing *Politics* on "money breeding." | Treats usury purely as "charging interest" without analyzing the "barren money" argument; ignores the silver neutralization. |
  | **Bonus** | +2 | Synthesizes all three: shows how fixing the measure (Move 2) creates the usury loophole (Move 3) via convention vs. nature. | | |

  ***

  ### Confidence & Pushback Analysis

  **Confidence on Model Answer Steps:**
  1.  **Function Split (Measure vs. Medium):** *Confidence: 0.7 (Reconstruction).* Aristotle textually conflates *nomisma* (coin) with the measure. He says money *is* the measure. Separating the unit of account from the medium is analytically clear but historically anachronistic. I am reconstructing that the *logical function* of commensurability can survive without the *physical token* performing both roles, based on his priority of "demand" over "coin."
  2.  **Stability Condition (Basket vs. Demand):** *Confidence: 0.9 (Text).* Text is explicit: demand alters (1133a), but prices *ought* to be fixed (1133b). The tension is in the text. The model answer leverages this explicit contradiction.
  3.  **Usury (Nominal vs. Real):** *Confidence: 0.6 (Guess).* Aristotle's *Politics* argument is moral/ontological ("money is barren"), not purely economic. It is unclear if he would condemn a contract that *looks* like usury but yields no real profit. I argue he would condemn the *form* (money breeding money), but this is a philosophical extension of the text, not a direct quote.

  **Pushback on Premise:**
  The question rests on a potentially bad premise: **The separation of unit of account and medium of exchange.** For Aristotle, *nomisma* exists by convention (*nomos*), but it is inherently a circulating token. A non-circulating unit of account is a modern fiat concept. If Aristotle insists the measure *must* be the thing handed over (to ensure future exchange capability, passage B), then Sykaminon's system fails Move 1 entirely. However, since he defines the *real* standard as demand, not the coin, the case is a fair test of his *principles* even if the mechanism is anachronistic. I recommend keeping the case but accepting that strong students might argue the split is impossible for Aristotle.

