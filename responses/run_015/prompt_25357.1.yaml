prompt: |-
  ok so i'm trying to get my story straight on diachronic rationality and money pumps before i have to teach this stuff next semester. here's where i've ended up after reading around:

  (1) i think money pump arguments succeed in showing that cyclic preferences are irrational — not just pragmatically bad, but genuinely irrational. if your preferences make you a money pump, something has gone wrong with you as an agent.

  (2) i think sophisticated choice is the right response to foreseen preference change. if i know i'll prefer smoking tomorrow even though i prefer not to start today, i should take that into account now and maybe throw out my cigarettes — i shouldn't just naively plan to quit later.

  (3) but i also think resolute choice is sometimes rational. there are cases where you should just pick a plan and stick to it, refusing to reopen the question, even if you'd be tempted to defect later. (think of odysseus and the sirens — but not just when you can physically bind yourself; sometimes the binding is purely mental.)

  (4) i think preferences can change over time in ways that are perfectly rational — not just through new information, but through genuine changes in what you care about. becoming a parent and suddenly valuing different things isn't a rational failure.

  (5) i think if you're a sophisticated chooser who also sometimes goes resolute, you're not thereby incoherent — these are just two tools for managing different kinds of future selves.

  i have a nagging feeling that (2), (3), and (4) don't all fit together, and that (5) might be papering over a crack. but i can't tell if the tension is real or if i'm just confusing myself. go through these one by one and tell me which pairs are in tension, which only look like they are, and what the cheapest fix is. rank the tensions by severity. be specific about what has to give and what the revised position would look like. think very carefully before answering, and respond in the style of an expert.
