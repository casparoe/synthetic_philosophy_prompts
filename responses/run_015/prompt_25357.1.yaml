      *   *Refinement on (1):* Money pumps prove that *if* you have cyclic preferences *and* you are dynamically unresolute (naive/sophisticated in a specific way), you lose money. Resoluteness *can* block the pump even with cyclic preferences, but most theorists say that just shows resoluteness is cheating if the preferences are truly cyclic. I need to be careful here. Actually, standard money pump arguments target transitivity. Diachronic money pumps target dynamic consistency.
      *   *Key Insight:* The user's (1) is about *transitivity/cyclicity*. (2) and (3) are about *dynamic consistency/time-inconsistency*. These are different problems. The tension arises when we try to solve dynamic inconsistency (2/3) while maintaining the normative force of consistency (1).
      *   *Wait, re-reading (1):* "cyclic preferences are irrational." Okay.
