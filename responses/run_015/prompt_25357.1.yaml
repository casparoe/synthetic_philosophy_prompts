      *   (2) *Sophisticated Choice:* Anticipating future weakness/change requires backward induction. If Future-Me will smoke, Present-Me shouldn't start. (Standard causal/sequential decision theory).
      *   (3) *Resolute Choice:* Sometimes it's rational to commit to a plan and ignore future temptations/preferences, even without physical binding. (McClennen's view).
      *   (4) *Rational Preference Change:* Preferences can change rationally due to intrinsic value shifts (e.g., parenthood), not just information updates.
      *   (5) *Compatibility:* Sophistication and Resoluteness are compatible tools for different scenarios.

  3.  **Identify Tensions (Brainstorming & Analysis):**

      *   *Tension A: Sophistication (2) vs. Resoluteness (3).*
          *   Sophistication says: Treat future preferences as constraints. If Future-Me wants $X$, and that ruins Plan $P$, don't start $P$.
          *   Resoluteness says: Ignore future preferences if they conflict with the optimal plan adopted earlier.
          *   *Conflict:* They prescribe different actions in the same decision node. If I'm resolute, I'm not being sophisticated (in the standard sense of taking future choices as given). If I'm sophisticated, I'm not being resolute.
          *   *Severity:* High. This is the core debate in diachronic choice (McClennen vs. Rabinowicz/Bratman).

      *   *Tension B: Resoluteness (3) vs. Money Pumps (1).*
          *   Money pumps exploit dynamic inconsistency.
          *   Resoluteness is often proposed *to avoid* money pumps without changing preferences.
          *   *Conflict:* If resoluteness works, does it save cyclic preferences? If I have cyclic preferences but am resolute, can I avoid the pump? Usually, resoluteness requires a *plan* that is dynamically consistent. If preferences are cyclic, is there a stable plan?
          *   *Nuance:* Claim (1) says cyclic preferences are *irrational*. Claim (3) says resoluteness is *rational*. If resoluteness cures the dynamic inconsistency caused by cyclic preferences, does it make the preferences rational? No, (1) says the preferences themselves are the problem. But (3) is usually applied to *time-inconsistent* preferences (like hyperbolic discounting), not necessarily *cyclic* ones.
