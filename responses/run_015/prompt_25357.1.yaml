answer: |-
  You have excellent instincts. Your nagging feeling is correct: Claim (5) is doing too much heavy lifting, and it is masking a foundational conflict between the decision-theoretic framework required for (2) and the agency-theoretic framework required for (3).

  As you prepare to teach this, you need to disentangle **dynamic inconsistency** (the domain of 2 and 3) from **transitivity/cyclicity** (the domain of 1), and then address how **preference change** (4) interacts with both.

  Here is the breakdown of the tensions, ranked by severity, with specific prescriptions for how to revise your position for the classroom.

  ---

  ### Tension 1: The Decision-Rule Incompatibility (2 vs. 3 via 5)
  **Severity: Critical**

  This is the crack you sensed in (5). Sophistication and Resoluteness are not merely "tools"; they are mutually exclusive decision rules at a choice node.

  *   **Sophistication (2)** operates via backward induction. At node $t_2$, you choose what Future-You will actually choose. At node $t_1$, you anticipate that. If Future-You will defect, Present-You restrict the choice set now.
  *   **Resoluteness (3)** operates via plan-adoption. At node $t_1$, you select an optimal plan. At node $t_2$, you execute the plan *even if* Future-You would prefer to defect.

  **The Conflict:** You cannot simultaneously treat future preferences as a constraint (Sophistication) and ignore them (Resoluteness). If you tell students "use whichever works," you are offering an ad hoc meta-rule without justification. A sophisticated chooser *cannot* be resolute by definition, because the sophisticated chooser takes future choices as fixed parameters.

  **The Fix:**
  Do not frame them as a "toolbox." Frame them as competing **normative theories of diachronic agency**.
  *   **Revision:** Adopt a **Domain-Specific View**. Resoluteness is rational *only* within the context of **Planning Agency** (à la Michael Bratman). When you form a plan, you create a reason for future action that overrides mere momentary preference. Sophistication is the correct rule for **non-planned sequential choice**.
  *   **Teaching Line:** "Sophistication describes how a rational agent navigates a world of fixed constraints (including their own future weakness). Resoluteness describes how a rational agent *creates* constraints through planning to achieve long-term goods. They apply to different structures of agency."

  ### Tension 2: Money Pumps vs. Rational Preference Change (1 vs. 4)
  **Severity: High**

  Claim (1) relies on the assumption that preferences are stable enough to be exploited. Claim (4) asserts that preferences can change rationally. If preferences change rationally *during* the pump sequence, the pump argument loses its normative bite.

  *   **The Conflict:** A standard money pump assumes you prefer $A \succ B$, then $B \succ C$, then $C \succ A$ *all things considered*. If the shift from $A \succ B$ to $B \succ C$ is due to a rational change in values (e.g., you became a parent in between trades), paying to switch isn't irrational; it's updating. If you allow (4) too much scope, you undermine the universality of (1).
  *   **The Nuance:** Money pump arguments for *cyclicity* usually target synchronic preferences or diachronic preferences where there is no relevant change in information or values.

  **The Fix:**
  Tighten the scope of the Money Pump argument to **Synchronic Cyclicity** or **Diachronic Cyclicity without Value Change**.
  *   **Revision:** Clarify that (1) applies to preferences held *at a time* or across time *ceteris paribus*. Rational preference change (4) involves a change in the *parameters* of the utility function, not just a reordering of the same values.
  *   **Teaching Line:** "Money pumps show that *static* cycles are irrational. They do not prove that changing your mind over time is irrational. A pump requires that you would hold the cycle *simultaneously* or that the change in preference is arbitrary. If the preference change tracks a rational shift in values (like parenthood), the 'pump' is actually just a series of rational trades based on new utility functions."

  ### Tension 3: Sophistication vs. The Authority of the Future Self (2 vs. 4)
  **Severity: Moderate**

  This is a tension in *attitude* rather than logic. Sophistication often carries an implicit premise: **Presentism**. It treats the future self's divergence as a problem to be managed (like a slippery road). But if (4) is true, the future self's divergence might be *authoritative*.

  *   **The Conflict:** If I know I will value family over career in 10 years (a rational change), Sophistication suggests I should anticipate that and perhaps not start the career track. But this feels like letting the future self hold the present self hostage. Conversely, if I ignore that future change, am I disrespecting my future rational agency?
  *   **The Issue:** Sophistication treats future preference change as a *force of nature*. If that change is rational, should it be treated as a *normative claim*?

  **The Fix:**
  Distinguish between **Alien Change** and **Endorsed Change**.
  *   **Revision:** Sophistication is appropriate when the future preference change is viewed as a loss of agency (addiction, weakness of will). When the change is an anticipated rational evolution (parenthood, maturity), **Resoluteness** (or a modified planning view) is required to maintain cross-temporal integrity.
  *   **Teaching Line:** "Sophistication is the rational response to *akrasia* or *alienation* (where you disown the future preference). Resoluteness is the rational response to *growth* or *planning* (where you endorse the future plan despite the future temptation)."

  ---

  ### The Synthesis: How to Repair Claim (5)

  Your Claim (5) is currently the weakest link because it suggests compatibility without a mechanism. Here is the revised position you should teach:

  **Revised Claim (5):** *Sophistication and Resoluteness are compatible only if we distinguish between **predictive rationality** and **planning rationality**.*

  1.  **Predictive Rationality (Sophistication):** When I am not operating under a plan, I must treat my future actions as predictions. If I know I will fail, I must account for that now.
  2.  **Planning Rationality (Resoluteness):** When I have formed a rational plan (one that was optimal at inception and hasn't been undermined by new information), I am permitted to treat that plan as a reason for action that screens off my future local preferences.

  **The "Cheapest Fix" for your Syllabus:**
  Adopt **Edward McClennen's** distinction but refine it with **Bratman's Planning Theory**.
  *   Tell students: "Rationality requires **Dynamic Consistency**. Sometimes you achieve this by Sophistication (anticipating you will deviate). Sometimes you achieve this by Resoluteness (committing not to deviate). The choice between them depends on whether you are acting as a **Predictor** of your behavior or a **Planner** of your life."

  ### Summary of Revisions for Your Lecture Notes

  1.  **Refine (1):** Money pumps prove synchronic cycles are irrational. Diachronic pumps only work if preference change is arbitrary, not rationally grounded.
  2.  **Refine (2) & (3):** Do not present them as equal options. Present Sophistication as the *default* decision-theoretic stance and Resoluteness as the *exception* licensed by Planning Agency.
  3.  **Refine (4):** Explicitly state that rational preference change blocks Money Pump arguments *unless* the agent claims the preferences were held simultaneously.
  4.  **Rewrite (5):** Replace "tools" with "domains." Sophistication governs sequential choice without plans; Resoluteness governs sequential execution of plans.

  If you make these distinctions, the tension dissolves. You aren't papering over a crack; you are drawing the boundary lines between decision theory (Sophistication) and philosophy of action (Resoluteness/Planning).
