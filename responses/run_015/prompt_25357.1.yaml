          *   *Severity:* Medium-High. It undermines the scope of (1).

      *   *Tension D: Sophistication (2) vs. Rational Preference Change (4).*
          *   Sophistication treats future preference change as a *constraint* (often implying the future self is "wayward" or "weak").
          *   (4) says future preference change can be *rational* (e.g., parenthood).
          *   *Conflict:* If Future-Me's preferences are rationally different, why should Present-Me view them as a problem to be managed via sophistication (which often implies avoiding the future choice)? Shouldn't Present-Me respect Future-Me's rational values? Sophistication often carries a whiff of "my current self knows best."
          *   *Severity:* Medium. It's a tension in attitude, not necessarily logic.

      *   *Tension E: The "Toolbox" View (5).*
          *   Claim (5) says (2) and (3) are just tools.
          *   *Conflict:* They are mutually exclusive decision rules at a node. You can't maximize expected utility *given future choices* (sophistication) AND *ignore future choices* (resoluteness) simultaneously. You need a meta-rule to decide when to use which. Without that meta-rule, (5) is ad hoc.
          *   *Severity:* High. This is the "papering over the crack" feeling the user has.

  4.  **Synthesize and Rank Tensions:**

      *   **Rank 1 (Severe): Sophistication vs. Resoluteness (2 vs 3), mediated by (5).** This is the definitional clash. You cannot follow both decision procedures at the same node. Claim (5) is indeed the weak link unless a higher-order principle is specified.
