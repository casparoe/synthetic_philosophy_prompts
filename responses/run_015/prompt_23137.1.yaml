answer: |-
  This is a classic instantiation of the debate between **Conventionalism (Humean/Practice View)** and **Voluntarism (Will Theory/Self-Binding View)**. As a PhD student, you'll recognize this as the tension between explaining the *intelligibility* of the speech act (Nadia) versus explaining the *normative force* of the obligation (Owen).

  Neither is "winning" in a knock-out sense, because they are often talking past each other regarding the *locus* of the normativity. However, we can adjudicate specific claims. Here is a move-by-move breakdown of who holds the stronger position on specific points, followed by what both are missing.

  ### Move-by-Move Analysis

  #### 1. The Nature of the Speech Act (Nadia's Opening)
  *   **Nadia's Claim:** "I promise" is intelligible only within a convention (like money/language).
  *   **Verdict:** **Nadia is right.**
  *   **Analysis:** On the semantics and pragmatics of the utterance, Conventionalism is superior. For the words "I promise" to be understood as creating an obligation rather than just a prediction of intent, there must be a shared social background. As Hume argued, there is no natural mental act that corresponds to "creating an obligation" without a social context that recognizes that act as doing so. Without the convention, the utterance lacks *illocutionary force*. Owen's view struggles to explain how a private mental act can generate a public normative status without a shared framework.

  #### 2. The Moral Category of Breach (Owen's Pushback)
  *   **Owen's Claim:** Breaking a promise is morally distinct from cheating at chess (constitutive rules vs. moral obligations).
  *   **Verdict:** **Owen is right.**
  *   **Analysis:** This is the "Normativity Gap" objection. Conventionalism risks reducing moral obligations to club rules. If promising is just like chess, then breaking a promise is merely a move that exits the game, not necessarily a *wrong* in a moral sense. Owen correctly identifies that promises generate *moral* reasons, not just *institutional* ones. If Nadia argues the obligation is *only* as strong as the utility of the convention, she cannot explain why we feel bound in low-stakes scenarios where the convention's utility is negligible.

  #### 3. The "No Convention" Test (Nadia's Reply)
  *   **Nadia's Claim:** In a context with no practice (e.g., a vacuum), a promise wouldn't bind.
  *   **Verdict:** **Draw / Context Dependent.**
  *   **Analysis:** Nadia is right that the *concept* requires a background, but Owen is right that the *obligation* might persist. If I land on a desert island and signal to a castaway "I promise to bring water," and there is no prior society, does it bind?
      *   Nadia says no: There is no institution to underwrite the duty.
      *   Owen says yes: The act of will itself creates the duty.
      *   *Adjudication:* Most contemporary contractarians (like Scanlon) side closer to Owen here. Even without a thick social practice, the *expectation* created generates a duty. However, Nadia is right that without *some* shared understanding of what "promise" means, the act fails. So, Nadia wins on **semantics**, Owen wins on **normativity**.

  #### 4. The "No One Watching" Test (Owen's Counter)
  *   **Owen's Claim:** Obligation persists when no one is watching and it's against self-interest.
  *   **Verdict:** **Owen is right.**
  *   **Analysis:** This targets the "Internalization" defense Nadia offers. If the only reason to keep a promise is to uphold the convention, then in a one-off, anonymous scenario where the convention isn't threatened by my breach, Conventionalism implies I have no reason to keep the promise. This contradicts our strong moral intuition that private promises bind. Owen captures the **first-personal authority** of the obligation better here. The obligation feels like it sticks to *me*, not to my membership in a club.

  #### 5. The Circularity Charge (Nadia's Counter-Attack)
  *   **Nadia's Claim:** Self-binding is circular. Why should I care that I bound myself?
  *   **Verdict:** **Nadia is right (Meta-ethically).**
  *   **Analysis:** This is the strongest philosophical objection to Will Theory (often called the "Normative Magic" objection). A mere act of will cannot create a reason out of nothing. If I say "I hereby obligate myself," the question "Why?" still looms. To say "Because I said so" is question-begging. There must be an independent normative principle that says "Acts of will of type X generate obligations." Nadia correctly identifies that Owen's view requires a background norm to make the self-binding effective, which pushes back toward a principle (which looks a lot like a convention or a moral law).

  #### 6. The Exploitative Practice & Primitive Power (Owen's Final Move)
  *   **Owen's Claim:** (A) Self-binding is primitive. (B) Conventionalism fails when keeping a promise undermines an exploitative practice.
  *   **Verdict:** **(A) is weak; (B) is strong.**
  *   **Analysis:**
      *   **(A) Primitive Power:** Claiming self-binding is "primitive" is a conversation stopper. It avoids the circularity charge by fiat. Meta-ethically, this is less satisfying than Nadia's demand for a ground.
      *   **(B) Exploitative Practice:** Owen lands a critical hit here. If the obligation to promise comes from the *value of the practice*, then if the practice is exploitative (e.g., a mafia code of silence, or a coercive social contract), the obligation should vanish or reverse. Yet, we often think individual promises bind even within corrupt systems (e.g., promising a friend to help them escape an exploitative regime). Conventionalism struggles to explain why the *individual* duty survives when the *social* utility is negative. Owen is right that the obligation seems to transcend the local utility of the convention.

  ---

  ### What Both Are Missing

  As a PhD student, you should point out that this debate is framed in a way that ignores the most significant developments in promise theory from the last 40 years. Both are stuck in a Hume vs. Kant dichotomy. Here is what is absent from their exchange:

  #### 1. The Relational/Expectation View (Scanlon & Shiffrin)
  Both Nadia and Owen focus on the **Promisor**.
  *   Nadia: Promisor within a Society.
  *   Owen: Promisor's Will.
  *   **Missing:** The **Promisee**.
  T.M. Scanlon's *Principle of Fidelity* (in *What We Owe to Each Other*) bridges this. The obligation doesn't come from a social practice (Nadia) or a magical act of will (Owen), but from the **principle of not manipulating others' expectations**.
  *   *The Argument:* If I lead you to expect I will do X, and I know you want that assurance, it is wrong to let you down without justification.
  *   *Why it matters:* This explains Owen's "personal stickiness" (I wronged *you*) without Nadia's "social utility" requirement. It grounds the obligation in the **relationship**, not the practice or the will alone. Seana Shiffrin further argues that promising is essential for autonomous agency *between* persons, making the obligation grounded in the conditions of interpersonal relationship, not just convention.

  #### 2. The Distinction Between "Practice" and "Principle"
  Nadia is conflating a **social practice** with a **moral principle**.
  *   Rawls (in "Two Concepts of Rules") distinguished between justifying a practice and justifying a particular action under it.
  *   Nadia treats the practice as the *source* of the obligation.
  *   Owen treats the act as the *source*.
  *   **Missing:** The possibility that the practice is merely the **mechanism** by which a deeper moral principle is enacted. We need the practice to communicate intent (Nadia is right), but the *reason* to keep it is moral, not conventional (Owen is right). They are fighting over whether the *vehicle* or the *passenger* is more important.

  #### 3. The "Obligation" vs. "Obligatoriness" Distinction
  *   **Nadia** explains why promising is *obligatory* (useful for society).
  *   **Owen** explains why I feel *obligated* (I willed it).
  *   **Missing:** They aren't distinguishing between the **justification of the institution** and the **normativity of the instance**. It is possible that the *institution* of promising is justified by utility (Hume/Nadia), but the *specific obligation* is grounded in fidelity to the person (Kant/Owen). A hybrid view is the standard contemporary position: We need the convention to make the act intelligible, but we need a moral principle of fidelity to make the act binding.

  ### Summary for Your Study Group

  If you want to mediate this effectively:

  1.  **Tell Nadia:** She wins on **semantics and social preconditions**. You can't promise in a vacuum. But she loses on **normative force**. Utility of the practice cannot explain the bindingness of specific, private promises, especially in corrupt practices.
  2.  **Tell Owen:** He wins on **moral phenomenology and the source of duty**. The obligation is personal and moral, not institutional. But he loses on **meta-ethics**. "I bind myself" is circular without a background principle that makes self-binding morally significant.
  3.  **The Synthesis:** Suggest they read **Scanlon's *What We Owe to Each Other* (Chapter 7)** or **Shiffrin's *Speech Matters***. The solution lies in shifting focus from the Promisor's Will or the Social Practice to the **Promisee's Expectations and the Moral Principle of Fidelity**. The convention provides the *language*; the will provides the *trigger*; but the *obligation* comes from the moral requirement not to invite trust and then betray it.

  Nadia has the better sociology; Owen has the better morality. They need a theory that connects the two.
