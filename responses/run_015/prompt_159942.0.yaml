prompt: |-
  I run human-annotation projects in which raters read a short vignette and label whether some side effect of what an agent did was brought about intentionally, and my raters' splits look like the Knobe effect: in the chairman-style pair — a company head is told a new program will raise profits and will, as a side effect, harm (or help) the environment, says he does not care about the environment at all, and approves the program — the harmful version gets labeled intentional far more often than the helpful one. I need to know whether my rubric is measuring anything stable, so before I read further into the literature I want the specification. Write the desiderata that an explanation of this effect has to meet to be usable for that purpose: the cases it must get right, the distinctions it must not collapse (foreseeing versus aiming, intentionality versus blameworthiness versus responsibility, harm versus mere badness or rule-breaking, blame versus praise), and what it must say about what the data are even evidence for — the folk concept of intentional action, the psychology of attribution, or intentional action itself. Include the variants my own batches keep producing: a side effect that is merely norm-violating or distasteful rather than harmful, one the agent actively regrets but accepts anyway, one that benefits the agent personally and affects no one else, and one that is certain rather than merely likely. For each requirement give the case or consideration behind it, mark which requirements are non-negotiable and which are preferences of a particular camp, and flag any pair you suspect cannot be jointly satisfied. Then, briefly, how the main families fare — semantic or conceptual-role accounts, deep-self accounts, and conversational or affect-based deflationary accounts — and name the single requirement that excludes the most of them. Take a definite position on the non-negotiable ones and on the unsatisfiable pair rather than laying out the options, and mark where you are extrapolating past what the data actually support.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Goal:** Provide specifications (desiderata) for an explanation of the Knobe Effect (side-effect effect) to determine if an annotation rubric is measuring something stable.
      *   **Context:** The user runs human-annotation projects using Chairman-style vignettes (harm/help side effects). They observe the standard asymmetry.
      *   **Requirements:**
          *   List desiderata (cases to get right, distinctions to maintain, interpretation of data).
          *   Include specific variants the user encounters (norm-violating/distasteful, regretted but accepted, self-benefit/no others, certainty vs. likelihood).
          *   For each requirement: Give the case/consideration, mark as Non-Negotiable (NN) or Preference (P), flag unsatisfiable pairs.
          *   Evaluate main theoretical families (Semantic/Conceptual, Deep-Self, Conversational/Affect).
          *   Identify the single requirement that excludes the most theories.
          *   **Crucial Constraint:** Take a *definite position* on NN requirements and unsatisfiable pairs (don't just list options).
          *   **Crucial Constraint:** Mark where I am extrapolating past data support.
      *   **Tone:** Professional, philosophical, precise, actionable for a project manager/researcher.

  2.  **Deconstruct the Knobe Effect & Theoretical Landscape:**
      *   *The Effect:* People say side effects are "intentional" when bad (harm environment) but not when good (help environment), even if the agent's attitude ("I don't care") is identical.
      *   *Theories:*
          *   *Semantic/Conceptual:* Morality is built into the concept of "intentional." (Knobe's early view, Moral Pervasiveness).
          *   *Deep-Self:* Intentionality tracks alignment with the agent's deeper values. (Sripada, McCann).
          *   *Conversational/Pragmatic:* It's about what is implicated in conversation, not literal meaning. (Pettit, Knobe's later view).
          *   *Affect/Blame:* Negative affect triggers a search for blame, biasing intentionality judgments. (Alicke, Nadelhoffer).
      *   *Distinctions:* Foresight vs. Intention, Intentionality vs. Blame, Norms vs. Harm.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Requirement 1: The Core Asymmetry.* Must explain the standard Harm/Help Chairman case. (NN).
      *   *Requirement 2: Foresight vs. Intention.* Must distinguish knowing something will happen from aiming for it. The Chairman *foresaw* the harm but didn't *aim* for it. If the theory says he intended it *in the same way* as a terrorist, it fails. (NN).
      *   *Requirement 3: Intentionality vs. Blame.* Must separate "Did he do it intentionally?" from "Is he blameworthy?" If the theory reduces intentionality *to* blame, it collapses the distinction. (NN).
      *   *Requirement 4: Norms vs. Harm.* The user mentions "norm-violating/distasteful." Theories must explain if *any* norm violation triggers the effect or just moral harm. (Preference/Debated).
      *   *Requirement 5: Regret/Acceptance.* User mentions "actively regrets but accepts." If the agent says "I wish this wasn't necessary, but I must," does intentionality drop? (Preference).
      *   *Requirement 6: Self-Benefit/No Others.* User mentions "benefits agent, affects no one else." (e.g., smoking). Does the asymmetry hold without a victim? (Preference).
      *   *Requirement 7: Certainty vs. Likelihood.* User mentions "certain rather than merely likely." High probability usually increases intentionality ratings, but does the asymmetry persist at low probability? (NN).
      *   *Requirement 8: Ontological Status.* What is the data evidence for? Folk concept vs. Psychology vs. Action itself. (NN).

      *   *Refining the "Definite Position" Constraint:* I cannot say "Some theorists think X, others Y." I must say "An adequate explanation *must*..."
      *   *Refining the "Unsatisfiable Pair":* A classic tension is between *Moral Pervasiveness* (morality is in the concept) and *Conceptual Stability* (the concept is neutral). If morality changes the application, is it the same concept? I need to pick a fight here. Let's pick the tension between **Intentionality as Descriptive** vs. **Intentionality as Evaluative**.

  4.  **Developing the Content - Section by Section:**

      *   **Introduction:** Acknowledge the task. Set the stage for rubric stability.
      *   **Desiderata List:**
          1.  *Core Asymmetry:* (NN)
          2.  *Foresight/Intention Distinction:* (NN)
          3.  *Intentionality/Blame Distinction:* (NN)
          4.  *Normative Specificity:* (Preference - Moral vs. Conventional).
          5.  *Attitude/Regret:* (Preference).
          6.  *Victim Requirement:* (Preference).
          7.  *Probabilistic Sensitivity:* (NN).
          8.  *Target of Explanation:* (NN).
      *   **The Unsatisfiable Pair:** The tension between *Conceptual Competence* (everyone shares the same rule) and *Contextual Sensitivity* (the rule changes based on moral valence). I will argue we must sacrifice the idea of a context-invariant semantic rule.
      *   **Theoretical Evaluation:**
          *   Semantic: Fails Foresight/Intention distinction (often).
          *   Deep-Self: Good on Regret/Attitude, struggles with pure norm violations.
          *   Deflationary (Pragmatic/Affect): Good on Blame distinction, struggles with Ontological Status (says there's no real effect on *action*).
      *   **The Exclusionary Requirement:** The *Intentionality/Blame Distinction*. Many theories collapse these.
      *   **Extrapolation Warning:** Mark where I'm inferring rubric stability from philosophical theory.

  5.  **Review against Constraints:**
      *   *Definite Position?* Yes, I will assert what an explanation *must* do, not what it *might* do.
      *   *Unsatisfiable Pair?* Yes, identified and resolved.
      *   *Extrapolation flagged?* Yes.
      *   *User Variants included?* Yes (Norms, Regret, Self-Benefit, Certainty).
      *   *Non-Negotiable vs. Preference?* Marked clearly.

  6.  **Drafting the Response (Mental or Scratchpad):**
      *   *Self-Correction on "Definite Position":* I need to be careful not to present my philosophical preference as objective fact, but as a requirement for the *user's specific goal* (rubric stability). If the rubric is to measure "intentional action" as a stable category, the theory must support that stability.
      *   *Refining the "Unsatisfiable Pair":* The prompt asks to flag a pair I suspect cannot be jointly satisfied. A strong candidate is **Moral Pervasiveness** (morality penetrates the concept) vs. **Descriptive Neutrality** (the concept describes mental states independent of value). You can't have a concept that is both purely descriptive of mental states *and* inherently sensitive to moral valence without changing the definition of the mental states. I will take the position that Descriptive Neutrality must go if we accept the data, but for rubric stability, we need to pretend it's there. Actually, better: **Conceptual Competence** (all speakers share the same rule) vs. **Performance Variance** (judgments shift with context). I'll argue we must abandon strict Competence for the sake of explaining the data.
      *   *Wait, looking closer at the prompt:* "Take a definite position on the non-negotiable ones and on the unsatisfiable pair." Okay, I need to be decisive.
      *   *Exclusionary Requirement:* Which one kills the most theories? Usually, it's the **Intentionality vs. Blame** distinction. Affect theories often collapse them. Semantic theories often collapse them. Deep-Self tries to keep them apart.

  7.  **Final Polish:** Check tone. Ensure "Extrapolation" is marked. Ensure the specific variants (regret, self-benefit, etc.) are integrated into the desiderata.

      *(Self-Correction during drafting)*: I need to make sure I don't just list philosophical theories but tie them back to the *rubric*. The user wants to know if their rubric measures something *stable*. If the Knobe effect shows the concept is *unstable* (context-dependent), that threatens the rubric. I need to address this tension.

      *Decision:* I will argue that for the rubric to be useful, we must treat the effect as a performance error or pragmatic implicature (Deflationary), *OR* we must accept that "intentional" is a thick ethical concept. I will take the position that **Intentionality must be distinguished from Blame** (NN), because if the rubric measures blame, it's mislabeled.

      *Unsatisfiable Pair:* **Universal Conceptual Competence** vs. **Contextual Moral Sensitivity**. You can't have a single static mental definition that yields opposite results based on moral valence without admitting the definition includes moral valence. I will argue we must drop Universal Competence.

      *Extrapolation:* I am extrapolating that philosophical coherence translates to inter-rater reliability.

  8.  **Finalizing the Output Structure:**
      1.  Introduction (Scope & Stance).
      2.  Desiderata Table/List (Case, Requirement, NN/P, Notes).
      3.  The Unsatisfiable Pair (Resolution).
      4.  Theoretical Family Performance.
      5.  The Exclusionary Requirement.
      6.  Extrapolation Warning.

      *Let's write it.*
answer: |-
  To determine whether your annotation rubric measures a stable construct, you need an explanation of the Knobe Effect that preserves the utility of "intentionality" as a coding category. If the effect proves that "intentional" is merely a proxy for "bad," your rubric is measuring moral condemnation, not action theory.

  Below are the specifications an explanation must meet to validate your rubric. I have taken definite positions on the non-negotiable requirements and the theoretical tensions, as requested.

  ### Desiderata for a Usable Explanation

  | # | Requirement | Case / Consideration | Status | Notes |
  | :--- | :--- | :--- | :--- | :--- |
  | **1** | **Core Asymmetry Replication** | **Standard Chairman:** Harm (high intentional) vs. Help (low intentional). | **Non-Negotiable** | Any explanation that denies the data exists is useless for rubric calibration. |
  | **2** | **Foresight ≠ Intention** | **The Terrorist Contrast:** A bomber *aims* to destroy; the Chairman only *knows* it will happen. | **Non-Negotiable** | The explanation must not collapse side-effect intentionality into primary intention. If the rubric codes both as identical, it loses discriminative power. |
  | **3** | **Intentionality ≠ Blame** | **The Excused Agent:** An agent causes harm intentionally but is justified (e.g., self-defense). | **Non-Negotiable** | **Position:** Your rubric must measure the *action description*, not the *moral verdict*. If the theory reduces intentionality to blameworthiness, the rubric is invalid. |
  | **4** | **Normative Specificity** | **The Distasteful Variant:** A side effect violates etiquette (e.g., wearing black to a wedding) but causes no harm. | **Preference** | *Camp:* Moral Pervasiveness. If the effect triggers on mere norm violations, "intentional" is a compliance marker. If it requires harm, it is an ethical marker. |
  | **5** | **Attitude Sensitivity** | **The Regretted Acceptance:** Agent says, "I hate that this happens, but I accept it." | **Preference** | *Camp:* Deep-Self. If intentionality drops here, it tracks psychic alignment. If it stays high, it tracks outcome knowledge. |
  | **6** | **Victim Independence** | **The Self-Benefit Variant:** Agent smokes, knowing it will ruin their own health, for profit. | **Preference** | Tests if the asymmetry requires a *moral patient* (victim) or just a *norm violation*. |
  | **7** | **Probabilistic Sensitivity** | **The Certainty Variant:** Side effect is 100% certain vs. 50% likely. | **Non-Negotiable** | Intentionality ratings must scale with probability. If the asymmetry holds at 1% likelihood, the concept is broken. |
  | **8** | **Ontological Target** | **What is measured?** Folk concept vs. Psychology vs. Action itself. | **Non-Negotiable** | **Position:** The data are evidence for the **Psychology of Attribution**, not the metaphysics of Action. Your rubric measures how people *talk*, not how actions *are*. |

  ### The Unsatisfiable Pair: Conceptual Competence vs. Contextual Sensitivity

  There is a tension between **Universal Conceptual Competence** (all speakers share a single, static definition of "intentional") and **Contextual Moral Sensitivity** (the application of the term shifts based on the moral valence of the outcome).

  *   **The Conflict:** If speakers share a single static definition (Competence), they should apply it identically to the Harm and Help cases given identical mental states. They do not. If the application shifts based on morality (Sensitivity), then the definition is not static.
  *   **My Position:** You must **abandon Universal Conceptual Competence**.
  *   **Reasoning:** Insisting on a single static definition forces you to claim half your raters are "wrong," which destroys inter-rater reliability metrics. Accepting that the *application* of the concept is context-sensitive allows you to treat the asymmetry as a stable feature of the *usage* rather than an error in the *rule*. For your rubric, this means you cannot assume "intentional" means the same thing in a Harm vignette as it does in a Help vignette without controlling for valence.

  ### Performance of Theoretical Families

  Here is how the main explanatory families fare against your requirement for a stable rubric, given the positions above.

  1.  **Semantic / Conceptual-Role Accounts** (e.g., Knobe's early view, Moral Pervasiveness)
      *   *Claim:* Morality is part of the definition of "intentional."
      *   *Verdict:* **Fail.** They violate **Desideratum #3 (Intentionality ≠ Blame)**. If morality is constitutive of the concept, you cannot separate the label from the judgment. Your rubric would be measuring moral status, not action structure.
  2.  **Deep-Self Accounts** (e.g., Sripada, McCann)
      *   *Claim:* Intentionality tracks whether the outcome aligns with the agent's deeper values.
      *   *Verdict:* **Pass (with caveats).** They handle **Desideratum #5 (Regret)** well. However, they struggle with **Desideratum #6 (Self-Benefit)** if the agent values profit over health; they often predict high intentionality for self-harm if it serves a valued end, which data sometimes contradicts.
  3.  **Conversational / Affect-Based Deflationary Accounts** (e.g., Pettit, Nadelhoffer, Knobe's later view)
      *   *Claim:* The literal meaning is stable; the asymmetry is due to pragmatic implicature or blame-driven bias.
      *   *Verdict:* **Best Fit.** They satisfy **Desideratum #3** and **#8**. They preserve the stability of the *concept* by locating the variance in the *context of utterance*. This allows your rubric to remain valid if raters are trained to ignore pragmatic implicatures.

  ### The Single Exclusionary Requirement

  **Desideratum #3: Intentionality ≠ Blame.**

  This requirement excludes the most theories. Most affect-based and early semantic accounts effectively reduce "intentional" to "appropriate target of blame." If you enforce a strict separation where an agent can be blameworthy for an unintentional act (negligence) or intentional but praiseworthy (sacrifice), you eliminate any theory that treats the Knobe Effect as a *redefinition* of intentionality. You are left only with theories that treat the effect as a performance error, a pragmatic shift, or a distinct psychological module (Deep-Self) that does not overwrite the core definition.

  ### Extrapolation Warning

  **[Extrapolation]:** I am extrapolating that **philosophical coherence guarantees inter-rater reliability**. It is possible that the folk concept is inherently unstable (as per the Unsatisfiable Pair above) regardless of which theory is true. If the concept is context-sensitive by nature, no amount of rubric training will produce perfect stability across valence conditions. I am assuming that adopting the **Deflationary/Pragmatic** stance allows you to train raters to "strip" the moral valence from their judgment. There is limited empirical data confirming that lay raters can successfully decouple blame from intentionality even when instructed to do so. Proceed with calibration checks specifically on the **Help** condition, as that is where the "intentional" label is most fragile.
