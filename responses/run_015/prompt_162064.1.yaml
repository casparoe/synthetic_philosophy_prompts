answer: |-
  ### PREP SHEET: VIRTUAL ARTIFACTS & PRACTICAL USURPATION

  **Session Strategy:** 25-minute WIP. 20 attendees.
  **Goal:** Survive the Q&A without conceding the core thesis (Usurpation > Welfare) or the core ontology (Artifacts > Permissions).

  ---

  ### I. OPENING CONCESSIONS & REFUSALS (Slides 1-2)

  **Concede these immediately to buy goodwill:**
  1.  **To the Property Theorist:** Concede that Terms of Service (ToS) determine *legal* standing and platform-level remedies. Do not claim your account overrides contract law.
  2.  **To the Welfarists:** Concede that welfare loss (distress, frustration) *almost always* accompanies virtual destruction. Do not claim players are indifferent to the loss.
  3.  **To the Chair:** Concede that the "code + practice" constitution is a working hypothesis that needs tighter formulation. Do not claim the metaphysics is finished.

  **Refuse to concede these (The Red Lines):**
  1.  **To the Property Theorist:** Refuse that ToS *exhausts* the moral ontology. A contract can be unjust; a permission can be violated in a way that wrongs the player even if the ToS allows the platform to delete.
  2.  **To the Welfarists:** Refuse that the "Pill Case" dissolves the harm. If the pill erases distress but the project remains destroyed, a normative wrong persists.
  3.  **To the Chair:** Refuse that virtual objects are merely "qualitative profiles." Insist that provenance is constitutive, not accidental.

  ---

  ### II. THE EIGHT OBJECTIONS (Ordered by Damage Potential)

  **1. The Welfarist "Pill" Objection (Ethicists)**
  *   **The Question:** "You claim harm exists even if the player feels no distress. If I give the player a pill that erases the frustration but leaves the memory of the deletion intact, what exactly is harmed? If it's not welfare, is it just a brute moral fact with no anchor?"
  *   **The 90-Second Reply:** "The harm is to *agency*, not feeling. When you burn a half-finished novel, you don't just hurt the author; you destroy their capacity to execute a specific intention. The pill removes the *symptom* (distress), not the *injury* (frustrated agency). Usurpation is the unauthorized seizure of the authority to guide a project. That authority is a normative status, not a psychological state."
  *   **Soft Spot:** You are trading on an ambiguity between "harm to a person" and "damage to a project." If they press on why damage to a project matters if the person doesn't care, you risk sounding like you're reifying projects into moral patients.

  **2. The Constitution Circularity Objection (The Chair)**
  *   **The Question:** "You say the object is constituted by code and practice. But the practice is defined by the object's role, and the object is defined by the practice. Isn't this circular? How do you state the identity conditions without presupposing the very institutional facts you're trying to ground?"
  *   **The 90-Second Reply:** "It's not circular; it's recursive, like institutional facts in Searle or constitutive rules in sports. The 'practice' isn't defined by the object alone, but by the community's recognized history of interaction. The code provides the affordance; the community provides the status function. We can trace the causal chain of creation without referencing the final status."
  *   **Soft Spot:** You are waving hands at "community recognition." If she asks for the *necessary and sufficient conditions* for that recognition, you don't have them yet. **[GUESS: She will let this slide if you acknowledge it needs work, but will pounce if you claim it's solved.]**

  **3. The Contractual Reduction Objection (Property Theorist)**
  *   **The Question:** "What work does 'usurpation' do that 'breach of license' doesn't? If the platform allows the griefing, the player has no standing. If they don't, it's a contract violation. Why multiply entities with 'practical authority'?"
  *   **The 90-Second Reply:** "Contract explains the relation between Player and Platform. Usurpation explains the wrong between Player and Player. A griefer doesn't violate the victim's contract; they violate the victim's agency. Even if the ToS is silent, the griefing is a wrong because it hijacks a project the victim was authorized to pursue within the game's rules."
  *   **Soft Spot:** You are assuming the game's rules grant moral authority independent of the platform's legal permission. This is the exact point the Property Theorist denies.

  **4. The Permitted Heist Objection (EVE Student)**
  *   **The Question:** "In EVE Online, theft is a permitted mechanic. If I steal your ship according to the rules, have I usurped your project? If you say yes, you're ignoring the game's design. If no, your account fails."
  *   **The 90-Second Reply:** "You usurped the *ship*, but not the *project*, because the project in EVE includes the risk of theft. The 'practical authority' I describe is bounded by the normative framework of the activity. In a building game, theft is outside the framework; in EVE, it is internal. Usurpation only occurs when the destruction bypasses the agreed-upon rules of engagement."
  *   **Soft Spot:** This requires you to map the "normative framework" for every game. It makes your theory highly context-dependent. **[GUESS: The EVE student will accept this if you acknowledge EVE's unique 'social contract'.]**

  **5. The Copy Problem Objection (The Chair)**
  *   **The Question:** "If I copy the cathedral bit-for-bit, why is the original lost? You say provenance matters. But if the practice continues around the copy, hasn't the project survived?"
  *   **The 90-Second Reply:** "The project isn't just the output; it's the history of labor invested. A forgery of a painting doesn't restore the artist's lost labor. Restoring the object requires restoring the causal history, not just the qualitative profile. The copy is a new artifact with a new history, so the original project remains failed."
  *   **Soft Spot:** You are importing fine-art metaphysics into digital objects. Digital objects are *meant* to be copied. This is a weak analogy.

  **6. The Phenomenological Evidence Objection (HCI Researchers)**
  *   **The Question:** "You lean on players distinguishing 'grief' from 'outrage.' Do you have data for this? Or are you projecting a philosophical distinction onto a player base that just says 'this sucks'?"
  *   **The 90-Second Reply:** "This is a philosophical claim about the *structure* of the experience, not an empirical survey. However, anecdotal reports in community forums consistently distinguish between 'server lag' (tragedy) and 'targeted griefing' (injustice). I'm theorizing that distinction, not inventing it."
  *   **Soft Spot:** **[GUESS: This is your weakest empirical flank.]** If they demand citations, you have none. Admit this is a hypothesis for future collaboration.

  **7. The Server Shutdown Objection (Property Theorist)**
  *   **The Question:** "If the platform shuts down the server, the project fails. No agent usurps authority, yet the harm is identical. Why does the presence of an agent matter?"
  *   **The 90-Second Reply:** "The harm to the *project* is identical, but the *wrong* is different. Shutdown is a tragedy; griefing is an injustice. My account explains why we blame the griefer but not the sysadmin. Usurpation captures the specific moral quality of the agent-driven violation."
  *   **Soft Spot:** You are conceding the welfare loss is the same, which invites the Welfarists back in to ask why the moral distinction matters if the outcome is identical.

  **8. The Cross-Cultural Objection (HCI Researchers)**
  *   **The Question:** "Does this hold in competitive shooters where items are disposable, versus Minecraft? If the 'outrage' doesn't survive across genres, is 'usurpation' just a description of one type of player?"
  *   **The 90-Second Reply:** "The *structure* of usurpation holds, but the *stakes* vary. In a shooter, the 'project' is short-term (the match). In Minecraft, it's long-term. The harm is proportional to the scope of the practical authority seized. The mechanism is universal; the intensity is contextual."
  *   **Soft Spot:** **[GUESS: This is safe.]** It allows you to generalize without overclaiming.

  ---

  ### III. CRITICAL STRATEGIC POINTS

  **The Single Reply That Must Land:**
  **Objection #1 (The Welfarist Pill).**
  *   **Reason:** If you cannot articulate a harm that survives the erasure of distress, your thesis collapses into a description of feelings. You must convince the room that "frustrated agency" is a genuine moral currency independent of welfare. If this fails, the paper is just metaphysics without ethical bite.

  **The Point to Defend (Do Not Hope They Miss):**
  **Move (1): Identity Conditions (Provenance).**
  *   **Reason:** The Chair *will* spot this. Do not try to glide over the "code + practice" constitution. Explicitly state: "I am arguing for a hybrid ontology." If you try to hide this, the Chair will drag it out in a way that makes you look evasive. Own the difficulty.

  **The "Hope Nobody Asks" Question:**
  *"If a bug deletes the item, is that usurpation?"*
  *   **Why:** It breaks your Agent/Non-Agent distinction (Move 3). If you say "No," it seems arbitrary (the harm is the same). If you say "Yes," you have to explain how software usurps authority.
  *   **Prepared Deflection:** "That's a borderline case that tests the limits of 'agency.' I'm focusing on clear cases of interpersonal griefing first."

  ---

  ### IV. VERDICT ON THE COPY PROBLEM

  **The Copy Problem is NOT the real threat.**
  *   **Reason:** The Copy Problem (Objection #5) is a metaphysical technicality. You can survive by admitting that digital provenance is weird and needs more work. The **Welfarist Objection (#1)** is the existential threat. If the room decides there is no harm without welfare loss, your concept of "usurpation" becomes a solution without a problem.
  *   **Reordering Advice:** I have ordered the objections by *damage to the thesis*, not by *likelihood of being asked*. The Chair will likely ask about Copies (Move 1), but the Ethicists asking about the Pill (Thesis) can kill the paper's contribution. Prioritize your prep on the **Pill/Agency** reply.

  **[GUESS MARKER]:** *I am guessing the Welfarists will be more aggressive than the Chair. In WIP sessions, metaphysicians often enjoy ontological puzzles, but ethicists tend to view non-welfarist harm claims as category errors. Prepare for the Ethicists to be the primary opposition.*
