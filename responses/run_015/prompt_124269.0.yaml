answer: |-
  ### Part I: Philosophical Sorting

  Before we codify a rule, we must disentangle the three distinct problems bundled under the "Reference Class Problem." If we conflate them, the procedure will fail when the edge cases arrive.

  1.  **The Selection Problem (Epistemic):** *Which features define the class?*
      There are infinite classes containing this patient (e.g., "humans," "left-handed humans," "humans named John"). Statistics cannot solve this alone; it requires causal knowledge. We must distinguish between *predictive* variables (correlated with outcome) and *risk* variables (causally relevant or stable proxies for cause). A class defined by a variable that is a *consequence* of the early stages of the disease (a collider) creates bias, not insight.
  2.  **The Conflict Problem (Aggregative):** *What do we do when admissible classes disagree?*
      If Class A says 9% and Class B says 14%, averaging them assumes both are equally valid estimates of the same underlying parameter. They may not be. One may be causally superior but noisier; the other may be precise but biased. Blind averaging (especially by sample size) privileges precision over validity.
  3.  **The Meaning Problem (Ontological):** *What does "11% for this patient" mean?*
      It cannot mean "11% of this unique individual will fracture." That is nonsense. It means "11% of patients *relevantly similar* to this one, under *relevantly similar* conditions, fractured." The probability is a property of the *model and the class*, not the biology of the individual. The procedure must acknowledge this to prevent reification (treating the number as a physical trait).

  ---

  ### Part II: The Governance Protocol (Version 1.0)

  **Objective:** To generate a defensible, auditable risk estimate for individual clinical decision-making.
  **Operator:** Clinical Data Analyst (1 week applied stats training).
  **Runtime:** < 60 minutes per request.
  **Authority:** Committee Chair signs off on protocol; Analyst executes protocol.

  #### Step 1: Positive Admissibility Screening
  *Current Rule:* Negative definition (no post-outcome, no data dredging).
  *New Rule:* Positive definition required. A class is admissible only if it meets **all three** criteria:

  1.  **Temporal Precedence:** All variables defining the class must be recorded *before* the index date (the date of risk calculation).
      *   *Sufficient Answer:* "Yes, all data points exist in the EHR prior to T=0."
  2.  **Completeness:** The variable must be recorded for >95% of the source population.
      *   *Sufficient Answer:* "Missingness <5%." (Prevents selection bias where only sick people get tested).
  3.  **Causal Plausibility (The Proxy Filter):** The variable must be either a known causal risk factor or a stable demographic characteristic. It cannot be a marker of disease progression that occurs *after* the pathological process has begun (unless that process is the target of prediction).
      *   *Specific Exclusion:* Do not use variables like "survived 30 days," "hospitalized in last month," or "prescribed Drug X" if Drug X is prescribed *because* of early symptoms of the outcome.
      *   *Judgement Call:* **This is the first judgement call.** The Analyst flags variables that look like proxies; the Committee Chair confirms plausibility based on current guidelines.

  #### Step 2: Stability Threshold
  *Current Rule:* N ≥ 200 outcomes.
  *New Rule:* **Events ≥ 50** in the specific class stratum.
  *   *Reasoning:* Sample size (N) matters less than the number of observed events (outcomes). 200 patients with 2 fractures gives a wildly unstable risk estimate.
  *   *Sufficient Answer:* "The query returns at least 50 observed fractures in this specific combination of characteristics."

  #### Step 3: Conflict Resolution (The Hierarchy Rule)
  *Current Rule:* Weighted average by $\sqrt{N}$.
  *New Rule:* **Do not average conflicting classes.**
  1.  Identify all admissible, stable classes containing the patient.
  2.  If the range of estimates spans **>5 percentage points** (absolute risk):
      *   **Action:** Report the **Range** (e.g., "9% – 14%"). Do not report a single number.
      *   **Reasoning:** Averaging hides uncertainty. A 5% spread represents genuine ambiguity in the patient's classification.
  3.  If a single number is legally/technically required by the EHR:
      *   **Action:** Select the estimate from the class with the highest **Causal Priority** (pre-defined by Committee), regardless of sample size, provided it meets the Stability Threshold.
      *   *Hierarchy Example:* Age/Sex < Comorbidities (CKD, Diabetes) < Genetic Markers < Medication Use.
      *   *Judgement Call:* **This is the second judgement call.** The Committee must pre-rank variable categories by causal strength.

  #### Step 4: The "No-Estimate" Zone
  *   **Condition:** If no class meets the Stability Threshold (Events ≥ 50), OR if the only stable classes are "Broad" (e.g., Age/Sex only) while a "Narrow" class (e.g., Rare Gene) exists but is unstable.
  *   **Action:** Return **"Quantitative Estimate Withheld: Insufficient Reference Data."**
  *   **Protocol:** Trigger a "Clinical Discretion Pathway." The clinician must document qualitative reasoning for treatment decisions.
  *   **Reasoning:** A precise number from a broad class is more misleading than no number when a specific high-risk feature is known but unquantified.

  #### Step 5: Value Handoff
  *   **Condition:** If the risk estimate (or range) crosses a treatment threshold (e.g., guidelines say treat if >10%, estimate is 9%-14%).
  *   **Action:** The Analyst flags the case: **"Decision Sensitive."**
  *   **Protocol:** The number is released, but the Committee notes that the *choice* to treat is a value judgement (weighing side effects vs. prevention), not a statistical derivation. The clinician must sign an attestation that they discussed the uncertainty with the patient.
  *   **Judgement Call:** **This is the third judgement call.** Defining the "treatment threshold" is a policy decision, not a statistical one.

  ---

  ### Part III: Running the Cases

  #### Case 1: 62-year-old Woman (T2D, CKD Stage 2, PPI use)
  *   **Classes:**
      1.  Postmenopausal + Diabetes (Risk 9%, Events >500).
      2.  CKD Stage 2 (Risk 14%, Events >200).
      3.  Long-term PPI (Risk 7%, Events >300).
  *   **Admissibility Check:**
      *   Diabetes/CKD: Causal risk factors for bone density. **Admissible.**
      *   PPI Use: **Flag.** Is PPI causing fractures, or is it a proxy for GI issues/frailty? Literature is mixed. Committee rule: PPI is a "Medication" tier, lower causal priority than "Comorbidity." **Admissible but lower priority.**
  *   **Conflict Check:** Range is 7% to 14%. Spread is 7 percentage points (>5% threshold).
  *   **Procedure Output:** **Report Range: 7% – 14%.**
  *   **EHR Constraint:** If a single field is required, select the **CKD estimate (14%)** because Comorbidities rank higher than Medications in the Causal Priority Hierarchy.
  *   **Value Handoff:** If treatment threshold is 10%, this is "Decision Sensitive." Clinician must document discussion of uncertainty.

  #### Case 2: 34-year-old Man (Rare Collagen Variant)
  *   **Classes:**
      1.  Collagen Variant (N=4 patients, Events=1). **Fails Stability Threshold** (Events < 50).
      2.  Men < 40 (N=50,000, Events=10, Risk ~0.02%). **Passes Stability.**
  *   **Conflict Check:** We have one unstable high-risk class and one stable low-risk class.
  *   **Procedure Output:** **"Quantitative Estimate Withheld: Insufficient Reference Data."**
  *   **Reasoning:** Using the broad class (0.02%) ignores the known biological mechanism (collagen). Using the narrow class (25%) is statistically hallucinated.
  *   **The "Answer I Do Not Like":** The system refuses to give a number that would withhold treatment. It forces the clinician to treat based on *qualitative* pathophysiology ("This gene breaks bone") rather than *quantitative* frequency ("Men like him don't break bones").
  *   **Action:** Clinician invokes "Clinical Discretion Pathway." Treatment decision is made without a risk score.

  #### Case 3: 71-year-old Man (AFib, Subgroup Discovery)
  *   **Classes:**
      1.  Standard AFib Risk Model (e.g., CHA2DS2-VASc).
      2.  "Discovered Subgroup" (AFib + specific lab value + age bin, N=150, Risk strikingly different).
  *   **Admissibility Check:**
      *   Standard Model: **Admissible.**
      *   Discovered Subgroup: **Inadmissible.**
      *   *Reasoning:* The subgroup was identified *after* scanning 40 subgroups ("turned up one subgroup... nobody had predicted"). This violates the **Temporal/Selection Admissibility**. It is data dredging (Type I error inflation).
  *   **Procedure Output:** **Reject Subgroup.** Report Standard AFib Risk only.
  *   **Reasoning:** To allow the subgroup would be to validate p-hacking. The striking difference is likely noise.
  *   **Judgement Call:** Analyst must recognize "scanned 40 subgroups" as a red flag for admissibility.

  ---

  ### Part IV: Limitations and The "True Probability"

  You asked me to say plainly what this procedure cannot do.

  **1. It cannot deliver the probability that *this* patient has an event.**
  There is no such thing. The patient is not a repeatable trial. They are a singular collection of atoms and history. The number 11% is not a property of the patient; it is a property of the *relationship between the patient's data and our registry*.
  *   *What we deliver:* A defensible, auditable frequency derived from the most causally plausible reference class available.
  *   *What we do not deliver:* The ontological truth of the patient's future.

  **2. It cannot resolve value conflicts.**
  When the range is 9%-14% and the treatment threshold is 10%, statistics ends. The procedure flags this (Step 5), but it cannot tell you if preventing 1 fracture is worth the risk of medication side effects for *this* person. That is ethics, not math.

  **3. It cannot fix bad data.**
  If the registry systematically under-codes fractures in minority populations, the "Admissible" classes will still be biased. The procedure ensures *internal* consistency, not *external* truth.

  **4. The "Judgement Calls Dressed as Procedure"**
  I must be transparent with you, Chair. Three steps in my protocol look like rules but are actually value judgements:
  *   **Causal Priority Hierarchy:** Deciding that CKD trumps PPI use is a medical consensus, not a statistical fact. It can be wrong.
  *   **Stability Threshold (Events ≥ 50):** Why 50? Why not 20 or 100? This is a risk tolerance setting. It balances the risk of noise against the risk of withholding a number.
  *   **The "No-Estimate" Decision:** In Case 2, refusing to give a number is a policy choice to prioritize *sensitivity* (don't miss the rare disease) over *specificity* (don't over-treat the common profile).

  ### Summary for the Committee

  This procedure shifts your governance from **producing numbers** to **managing uncertainty**.
  *   It stops you from legitimizing data dredging (Case 3).
  *   It forces you to admit when you don't know (Case 2).
  *   It forces clinicians to discuss risk ranges rather than false precision (Case 1).

  It will frustrate clinicians who want a single green/red light. That frustration is a feature, not a bug. It reminds them that they are practicing medicine, not executing code.

  **Recommendation:** Sign the protocol. Implement the "Quantitative Estimate Withheld" flag immediately. It is the only honest response to the Reference Class Problem.
