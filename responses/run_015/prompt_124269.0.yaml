  1.  **Deconstruct the Request:**

      *   **Role:** Philosopher of probability + Clinical Prediction Modelling expert.
      *   **Task:**
          1.  Analyze the Reference Class Problem (RCP) distinct components (selection, conflict, meaning).
          2.  Transform the hospital's current draft rule into a workable procedure (questions, sufficiency, positive admissibility, conflict resolution, "no estimate" point, value judgement handoff).
          3.  Constraints: Analyst has 1 week of stats training, <1 hour runtime, Chair signature needed for practice changes.
          4.  Identify "judgement calls dressed up as procedure."
          5.  Run the procedure on three specific cases (Osteoporosis/Diabetes/CKD, Rare Collagen Variant, AFib/Subgroup Discovery).
          6.  Final reflection: What the procedure *cannot* do (single-case probability vs. defensible number).
      *   **Tone:** Rigorous, practical, transparent, philosophical but actionable.

  2.  **Part 1: Philosophical Sorting (The "Before you write anything" instruction):**

      *   *Problem 1: Class Selection (The Epistemic Problem).* Which features are relevant? Why age and not shoe size? This is about causal relevance vs. statistical association.
      *   *Problem 2: Class Conflict (The Aggregation Problem).* When valid classes give different probabilities (9% vs 14%), how do we combine them? Simple averaging is often unjustified if classes aren't independent or if one is causally superior.
      *   *Problem 3: Single-Case Meaning (The Ontological Problem).* What does "11% chance for *this* patient" mean? Frequentism fails here (patient is unique). Propensity? Subjective belief? This needs to be addressed so users don't reify the number.

  3.  **Part 2: Designing the Procedure (The Governance Protocol):**

      *   *Current Draft Critique:* "Narrowest class with N=200" is arbitrary. "Weighted average by sqrt(N)" is statistically dubious (why sqrt? why not inverse variance?). Negative admissibility is too weak (allows colliders/proxies).
      *   *New Procedure Structure:*
          1.  **Admissibility Filter (Positive Definition):** Needs to exclude colliders, proxies, and post-treatment variables. Focus on baseline, pre-outcome, causally plausible factors.
          2.  **Relevance Screening:** Not just "statistically respectable," but "clinically salient."
          3.  **Conflict Resolution:** Move away from blind averaging. Use a hierarchy of evidence (causal strength) or report a range.
          4.  **Uncertainty Threshold:** When to say "We don't know."
          5.  **Value Handoff:** When the number triggers a threshold decision (treat vs. don't treat) that is ethically sensitive.
      *   *Constraints Check:* Analyst has limited stats skill. Needs to be a checklist/flowchart, not a complex Bayesian model. Runtime < 1 hour (implies pre-computed models or quick queries).
      *   *Judgement Calls:* Must explicitly label where human discretion overrides the algorithm.

  4.  **Part 3: Running the Cases:**

      *   *Case 1 (62F, T2D, CKD):* Classes conflict (9%, 14%, 7%). All large samples.
          *   *Application:* Check admissibility. PPI use might be a proxy for frailty or cause fractures? CKD is causal. Diabetes is causal.
          *   *Resolution:* Don't just average. Acknowledge the spread.
      *   *Case 2 (34M, Rare Collagen):* Narrow class N=4 (too small). Broad class (Men <40) risk ~0%.
          *   *Application:* Narrow class fails stability threshold. Broad class fails relevance (ignores the gene).
          *   *Result:* Procedure should flag "Insufficient Evidence for Quantitative Estimate." This is the "answer I do not like."
      *   *Case 3 (71M, AFib, Data Dredging):* Subgroup found after scanning 40 groups.
          *   *Application:* Fails admissibility (chosen after seeing numbers). This is p-hacking/data dredging.
          *   *Result:* Reject the subgroup. Use the main AFib model.

  5.  **Part 4: The Limitations (The "What it cannot do" section):**

      *   Must be honest: We cannot give the "true probability" of a singular event. We are giving a *policy-consistent frequency* from a selected reference class.
      *   Distinction: *Epistemic utility* (making a decision) vs. *Ontological truth* (the actual chance).

  6.  **Drafting the Content - Section by Section:**

      *   *Introduction:* Acknowledge the depth of the RCP.
      *   *Philosophical Preamble:* Briefly separate Selection, Conflict, and Meaning.
      *   *The Protocol (The "Governance Algorithm"):*
          *   Step 1: Positive Admissibility (Baseline, Causal Plausibility, No Colliders).
          *   Step 2: Stability (Sample size, but also event count).
          *   Step 3: Conflict (Range reporting vs. Point estimate).
          *   Step 4: The "No-Go" Zone.
          *   Step 5: Value Handoff.
          *   *Constraint Check:* Keep it simple for the analyst.
      *   *Case Studies:* Apply the protocol rigorously.
      *   *Conclusion:* The philosophical limit.

  7.  **Refining the "Positive Admissibility":**
      *   The prompt suspects negative definition isn't enough. I need to specify *what makes a class valid*.
      *   Criteria: Measured *before* index date. Plausibly causal or strong predictive proxy *not* on the causal pathway to the outcome (avoiding colliders). Recorded for *all* patients (no selection bias).
      *   Specific exclusion: "Survivors" (immortal time bias), "Post-baseline variables."

  8.  **Refining the "Conflict Resolution":**
      *   The draft rule uses sqrt(N) weighting. This is weak.
      *   Better approach for a low-skill analyst: Report the *range* of admissible classes. If a point estimate is legally required, use the class with the strongest *causal* justification, not just sample size. Or, use a pre-specified hierarchy (e.g., FRAX variables trump incidental findings).
      *   Let's propose a "Causal Priority" rule. If classes conflict, prioritize the one with variables known to be mechanistically linked, provided N is sufficient. If equal, report the range.

  9.  **Refining the "Judgement Calls":**
      *   Defining "Causal Plausibility."
      *   Deciding when a subgroup is "Data Dredging."
      *   Deciding when the risk is "Too Uncertain."

  10. **Final Review against Constraints:**
      *   Analyst skill: 1 week stats. Keep math simple.
      *   Time: < 1 hour. Requires pre-existing queries.
      *   Signature: Chair signs off on practice changes (the protocol itself).

  11. **Self-Correction during drafting:**
      *   *Initial thought:* Suggest Bayesian Model Averaging.
      *   *Correction:* Too complex for the analyst constraint. Stick to a rule-based hierarchy.
      *   *Initial thought:* Say "Probability is meaningless."
      *   *Correction:* Too unhelpful for a hospital. Say "Probability is a decision tool, not a property of the patient."
      *   *Case 2:* The prompt says "I expect the procedure to give me an answer I do not like." This implies the procedure should *refuse* to give a number, which frustrates the clinician wanting to treat/withhold. I need to make sure the protocol explicitly allows for "Quantitative Estimate Withheld."

  12. **Final Polish:** Ensure the tone is authoritative yet humble about the limits of statistics. (Proceed to generate output).

  *(Self-Correction on the "Positive Admissibility" section)*: I need to be specific about "proxies." A variable like "survived 30 days" is a collider/selection bias. A variable like "PPI use" might be a proxy for frailty. The rule needs to distinguish *baseline risk factors* from *markers of existing disease progression* that might be influenced by early symptoms.

  *(Self-Correction on Conflict)*: The prompt asks for a "better way... than averaging." Averaging 9, 14, and 7 gives ~10. But if 14 is the "true" high-risk group, averaging dilutes it. I will suggest reporting the *interval* and requiring clinical justification for picking a point within it.

  *(Final check on the "Meaning" question)*: The prompt asks me to sort this out *before* writing the procedure. I will include a brief preamble establishing the philosophical ground, then move to the procedure.

