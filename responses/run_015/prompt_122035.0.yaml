answer: |-
  This is a sharp reconstruction of a problem that haunts the literature on moral standing (you'll see echoes of arguments by Kyle Fritz, Daniel Miller, and Pamela Hieronymi). You are right to feel the pressure: if you keep (1) as stated and accept the empirical claims in (2)–(5), (6) follows validly. Since (6) is intolerable, the leak must be in the normative premises.

  You asked where the slip is, whether to reject the bookkeeping model, and what the price is. Here is the diagnosis.

  ### 1. The Leak: Equivocation in "Morally on a Par" (Premise 1)

  The argument turns on the phrase **"morally on a par"** in Premise (1). Your derivation of (6) relies on a **categorical** interpretation of parity, while our moral practices rely on a **relevant-similarity** interpretation.

  *   **Categorical Parity (The Leak):** Wrong A and Wrong B are on a par if they fall under the same abstract moral category (e.g., "lying," "failing to rescue"). This is what drives your steps (2)–(5). A white lie and perjury are both "lying." Failing to donate to Oxfam and failing to pull a drowning child from a shallow pond are both "omissions of rescue."
  *   **Relevant Similarity (The Fix):** Wrong A and Wrong B are on a par only if they violate the norm **with similar severity, intent, or disregard.**

  If you interpret (1) using Categorical Parity, you get the absurdity. If you interpret it using Relevant Similarity, the argument blocks at (2) and (4). A white lie does not undermine standing to blame for perjury because the *moral commitment* violated is not equivalent in weight.

  **The Verdict:** You do not need to reject (1) entirely, but you must reject the **Categorical Interpretation** of (1).

  ### 2. The Bookkeeping Model is the Engine of Absurdity

  You suspected the "bookkeeping model" (standing as an account debited by any parallel wrong). **You are correct: this model must go.**

  The bookkeeping model assumes standing is **binary** and **cumulative** in the wrong way. It suggests that *any* debit in the "Lying" column bankrupts your ability to make withdrawals from that column.

  **Replace it with the *Commitment Model*:**
  Standing is not about having a clean ledger; it is about whether your own conduct demonstrates a **rejection of the authority of the norm** you are invoking.
  *   If I lie to spare feelings (white lie), I am not necessarily rejecting the norm of truth-telling; I may be balancing it against the norm of kindness.
  *   If I lie to defraud a victim, I am rejecting the norm of truth-telling for gain.
  *   Therefore, the white liar retains standing to blame the fraudster, because the white liar's conduct does not imply that the norm of truth-telling lacks authority.

  By rejecting the bookkeeping model, you stop the slide from "I have sinned" to "I have no voice."

  ### 3. Which Premise Do You Reject?

  Technically, you are modifying **Premise (1)**.

  *   **Current (1):** Standing requires that A is not guilty of W, or of any wrong that is morally on a par with W.
  *   **Revised (1*):** Standing requires that A is not guilty of W, or of any wrong that is **relevantly similar in severity and disregard** to W.

  Alternatively, you can keep (1) but reject the inference in **(2) and (4)**. You can argue that failing to donate to charity is *not* "the very same type of wrong" as failing to save a stranger at trivial cost in a specific interaction, due to the distinction between **perfect and imperfect duties**.
  *   *Perfect Duty:* Do not lie, do not kill. (Specific, owed to specific people).
  *   *Imperfect Duty:* Be charitable, be helpful. (General, discretion on how/when).
  *   If W is a violation of a perfect duty, general sloppiness with imperfect duties does not count as "guilty of W."

  However, since you said you want to **save the parity move**, I recommend modifying (1) rather than leaning on the perfect/imperfect duty distinction (which is itself controversial).

  ### 4. What is the Price?

  You asked what you are paying to keep (1) and the parity intuition without swallowing (6). The cost is **precision and context-dependence.**

  1.  **Loss of Algorithmic Clarity:** The bookkeeping model was attractive because it was easy to apply. (Did you lie? Yes? No standing.) The Revised (1*) requires case-by-case judgment. We have to ask: *Was the blamer's hypocrisy significant enough to undermine their authority?* This makes standing a matter of degree or context, not a binary switch.
  2.  **The "Tu Quoque" Threshold:** You must accept that there is a threshold of hypocrisy required to lose standing. Minor hypocrisies do not strip standing. This invites the objection: "Who sets the threshold?" (Answer: The moral community, through practice).
  3.  **Vulnerability to "Clean Hands" Elitism:** By requiring "relevant similarity," you risk making standing available only to those who are *mostly* virtuous in the *specific* domain. This preserves the intuition that a chronic liar cannot blame a liar, but it still excludes some imperfect people. You have to be comfortable with the idea that standing is an **honorific** tied to moral credibility, not a universal right.

  ### 5. Summary for the Seminar

  If I were presenting this in your seminar, I would frame the solution like this:

  > "The argument is valid but unsound because it relies on a **coarse-grained individuation of wrongs**. It treats 'lying' as a monolithic category for the purposes of standing.
  >
  > To save the core insight that hypocrisy undermines standing (Premise 1), we must adopt a **Normative Authority Condition**: Hypocrisy undermines standing only when the blamer's own conduct implies a rejection of the norm they are invoking.
  >
  > This rejects the **Bookkeeping Model**. My failure to donate 10% of my income does not imply I reject the norm of rescue in the same way that ignoring a drowning child does. Therefore, Premise (2) is false under the correct description of the wrong. The wrongs are not 'on a par' in the sense required for standing, even if they fall under the same abstract header.
  >
  > **The Price:** We lose a bright-line rule for standing. We accept that standing is gradient and depends on the *significance* of the hypocrisy, not just its existence."

  **Bottom Line:** Keep (1), but tighten the definition of "on a par." Kill the bookkeeping model. Accept that standing is about **moral authority**, not **moral purity**.
