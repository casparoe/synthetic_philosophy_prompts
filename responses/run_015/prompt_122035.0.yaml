      *   *Better nuance:* It's not just severity, it's about the *implication of the blame*. Hypocrisy undermines standing when the blamer's conduct implies they don't accept the authority of the norm they are invoking.
      *   *Focus on the User's "Bookkeeping" intuition:* The user is right. The bookkeeping model assumes *any* debit cancels the credit. A *Net Balance* or *Threshold* model is better.
      *   *Key Philosophical References:* Think about Kyle Fritz & Daniel Miller (Standing and Hypocrisy), R.A. Duff, Pamela Hieronymi.
