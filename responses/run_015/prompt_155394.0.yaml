answer: |-
  ### Essay Question

  **Time Allowed:** 90 Minutes  
  **Word Limit:** 1,200 – 1,500 Words  
  **Total Marks:** 20

  **Question:**

  Consider an agent who is hungry and placed between two bundles of hay. The bundles are exactly similar in distance, quality, and appearance. The agent has no reason to prefer one bundle over the other, but a compelling reason to eat one of them.

  A novelist proposes the **Principle of Narrative Asymmetry**: because prose must present options sequentially (one word after another), any description of this scenario inevitably gives one bundle greater salience than the other. Furthermore, because readers assume actions are motivated, a choice depicted without a stated reason looks like a character flaw or a hidden plot point. The novelist concludes that this representational difficulty suggests a genuine standstill of the will is either impossible for an agent or impossible to depict without falsifying the agent's psychology.

  Write an essay addressing the following:
  1.  Does the Principle of Narrative Asymmetry show that a standstill is ontologically impossible, or merely unshowable? Explain why the difference matters for the philosophical example.
  2.  Distinguish between having "no reason to prefer" and having "no reason to choose."
  3.  If the tie is broken, what *kind* of thing breaks it? Explain why this mechanism counts as an act of will rather than a random cause acting upon the agent.

  You may argue that the Principle of Narrative Asymmetry rests on a confusion, provided you justify why resisting the framing is philosophically productive.

  ***

  ### Model Answer

  The Principle of Narrative Asymmetry identifies a genuine constraint on fiction, but it mistakes a limit of representation for a limit of reality. The philosophical example of the standstill requires the agent's equilibrium to be ontologically possible, not narratively depictable. If the standstill were impossible—if reason strictly dictated action whenever options were equal—the agent would starve. The example exists to test whether the will can initiate motion without a prior determining reason. Therefore, the novelist's constraint shows only that fiction lies about perfect equilibrium, not that equilibrium cannot exist. This distinction matters because the philosophical point concerns the architecture of agency, not the aesthetics of description. If the standstill is impossible, the will is merely a calculator; if it is only unshowable, the will is a capacity that fiction struggles to capture.

  To understand the standstill, one must distinguish between having no reason to prefer and having no reason to choose. The agent has a overwhelming reason to choose *some* hay: hunger. This is a reason to act, not a reason to discriminate. The standstill exists only at the level of preference (Hay A over Hay B), not at the level of motivation (Eat vs. Starve). Confusing these leads to the error that the agent is paralyzed by total indifference. They are not; they are paralyzed by symmetrical preference. The philosophical example needs this symmetry to isolate the moment of choice from the weight of reason. If there were a reason to prefer, the will would follow reason. If there were no reason to choose at all, the agent would not move. The standstill isolates the will's power to select without a weighing scale.

  When the tie is broken, what breaks it cannot be a reason, or the symmetry would not have been perfect. It must be an act of initiation. Here we must distinguish picking arbitrarily from being moved at random. A random movement is caused by external noise—a twitch, a gust of wind, a neural misfire. It happens *to* the agent. An arbitrary choice happens *by* the agent. It is "arbitrary" only in the sense that it lacks a prior determining cause, not in the sense that it lacks an author. The will supplies the missing weight. If the choice were random, the agent would not be responsible for eating; they would merely be the location where eating occurred. For the will to exist, the agent must be the source of the motion, even if reason provided no map.

  This brings us to the Principle of Narrative Asymmetry. The principle rests on a confusion between the order of text and the order of thought. It assumes that because the reader encounters Option A before Option B, the character must deliberate them in that order, granting A artificial salience. But a mind can hold two options simultaneously, or oscillate between them without textual sequence. The novelist conflates the map with the territory. Narrative is linear; deliberation need not be. However, the principle correctly identifies that readers demand motivation. When a character chooses without a reason, readers perceive a gap. This is not because the gap is ontologically impossible, but because fiction typically compresses time. To show a standstill, a writer must dwell on the duration of the hesitation, which risks boring the reader. Thus, the standstill is unshowable not because it cannot happen, but because depicting true equilibrium requires a narrative pause that feels like inaction.

  Ultimately, the philosophical example needs the standstill to be possible. It needs to prove that reason does not exhaust the causes of action. The narrative difficulty confirms that our standard tools for understanding character (motivation, salience, sequence) are inadequate to describe the will's origin point. The tie is broken by the agent's capacity to be a first cause. This is not a cause acting on the agent, but the agent acting as a cause. To say otherwise is to dissolve the agent into the sum of their inputs. The novelist's constraint reminds us that while we cannot write the will perfectly, we must not edit it out of existence to make the prose flow better.

  ***

  ### Marking Scheme (Total: 20 Marks)

  **1. Ontology vs. Representation (4 Marks)**
  *   **Full Marks:** Clearly distinguishes between the standstill being impossible (ontological) vs. impossible to depict (representational). Explains that the philosophical example requires ontological possibility to test agency.
  *   **Common Confusion:** Treating the narrative constraint as proof that the mind cannot function that way (conflating text with psychology).
  *   **B-Grade Stall:** States the difference but fails to explain why it matters for the definition of agency (treats it as a literary problem only).

  **2. The Hunger Distinction (4 Marks)**
  *   **Full Marks:** Separates "reason to prefer" (A over B) from "reason to choose" (Eat vs. Starve). Identifies that the standstill is specific to preference, not motivation.
  *   **Common Confusion:** Arguing the agent has no reason to act at all (ignoring hunger) or that hunger breaks the symmetry between the bundles.
  *   **B-Grade Stall:** Uses the correct vocabulary ("prefer" vs. "choose") but applies them interchangeably in the argument.

  **3. Arbitrariness vs. Randomness (4 Marks)**
  *   **Full Marks:** Defines "random" as external cause/chance happening *to* the agent. Defines "arbitrary" as internal initiation without prior determining reason. Links this to responsibility/agency.
  *   **Common Confusion:** Treating "arbitrary" as synonymous with "random" or "meaningless."
  *   **B-Grade Stall:** Correctly identifies the terms but fails to locate the difference in the *source* of the motion (internal vs. external).

  **4. Critiquing the Narrative Principle (4 Marks)**
  *   **Full Marks:** Identifies the confusion between textual sequence and deliberative simultaneity. Argues that resisting the framing is necessary to preserve the concept of the will. (Note: Marks awarded for successful critique; agreeing with the principle requires proving why textual order dictates mental order).
  *   **Common Confusion:** Accepting the principle as fact without examining the map/territory relationship.
  *   **B-Grade Stall:** Critiques the principle on aesthetic grounds (it makes boring reading) rather than philosophical grounds (it misdescribes cognition).

  **5. Defining the Tie-Breaker (4 Marks)**
  *   **Full Marks:** Identifies the tie-breaker as the agent acting as a "first cause" or source of motion. Explicitly states this is not a cause acting *on* the agent.
  *   **Common Confusion:** Suggesting the tie is broken by a hidden reason, a whim (defined as random), or external noise.
  *   **B-Grade Stall:** Asserts the will breaks the tie but describes the will as merely another type of reason (e.g., "the reason was to stop waiting").

  **Note on Grading:**
  A **B-grade answer** (10–13 marks) will typically have the vocabulary right (ontology, arbitrary, salience) but will miss the crux of the agency problem. It will likely treat the narrative constraint as a hard limit on psychology rather than a representational artifact, or it will conflate "arbitrary" choice with "random" movement. It will survey the options rather than committing to a position on what breaks the tie.

  An **A-grade answer** (14–20 marks) must commit to a position. It must explicitly handle the instruction regarding the Principle of Narrative Asymmetry (either deploying it or critiquing it) and must successfully distinguish the source of the tie-breaking motion from external causation.
