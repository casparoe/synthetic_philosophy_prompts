answer: |-
  # Workshop Handout: The Role Ethics Sorter

  **Goal:** Figure out if Confucian roles (*xiao*, *ti*, Five Relations) actually work in a corporation or a democracy, or if we're just pretending.
  **Instructions:** Don't think about what a text *says*. Think about what *you* would do. Answer the three questions below to find your leaf.

  ---

  ## 🌳 The Decision Tree

  ### SPLIT 1: The Self Test
  **Case:** You get fired from your job tomorrow. Your income is covered by a severance package, but you no longer hold the title.
  *   **A)** I feel like I've lost a part of *who I am*. My moral standing in the community is diminished because the role is gone.
  *   **B)** I feel like I've lost a *task* I was performing. My moral self is intact; I just need a new gig.

  *(Go to **Branch A** if you chose A. Go to **Branch B** if you chose B.)*

  ---

  ### BRANCH A: Roles are Constitutive (You are your roles)

  #### SPLIT 2: The Family Test
  **Case:** A junior worker is struggling. Treating them like a "younger brother" (*ti*) means covering their mistake, but the company policy says report it.
  *   **A)** **Scale It:** The manager-worker bond *is* a version of the elder-younger bond. The logic extends.
  *   **B)** **Stop It:** Family is sacred and unique. Work is work. You can't treat a colleague like kin.

  *(If **B**: You land on **Leaf 3**. If **A**: Go to Split 3.)*

  #### SPLIT 3: The Profit Test
  **Case:** Protecting that "junior brother" worker will cost the department its quarterly bonus.
  *   **A)** **Role Wins:** I protect the worker. The relationship obligation overrides the organizational metric.
  *   **B)** **Rule Wins:** I follow the bonus structure. The institution's health ultimately sustains the role, so I must prioritize the system.

  *(See Leaves 1 & 2 below.)*

  ---

  ### BRANCH B: Roles are Scripts (You wear roles)

  #### SPLIT 2: The Family Test
  **Case:** Can we use "family language" (care, protection, loyalty) to describe a manager's duty to a subordinate?
  *   **A)** **Yes:** It's a useful metaphor to build cohesion, even if it's not ontologically real.
  *   **B)** **No:** That's manipulative. Keep it professional.

  *(If **B**: You land on **Leaf 5**. If **A**: Go to Split 3.)*

  #### SPLIT 3: The Profit Test
  **Case:** Using that "family care" script conflicts with a hard efficiency target.
  *   **A)** **Script Wins:** I act the part of the protector, even if it hurts efficiency. The performance *is* the value.
  *   **B)** **Rule Wins:** I drop the script. Efficiency is the real goal; "care" was just soft language for retention.

  *(See Leaves 4 & 5 below.)*

  ---

  ## 🍂 The Leaves (Your View)

  ### 1. The Clan Realist
  *(Branch A → Scale Yes → Role Wins)*
  *   **Real View:** Hard Confucian Particularism (Ames/Hall adjacent).
  *   **Awkward Commitment:** You have to admit that nepotism isn't a bug, it's a feature of moral life.
  *   **Status:** ✅ Defended.

  ### 2. The Structural Confucian
  *(Branch A → Scale Yes → Rule Wins)*
  *   **Real View:** Institutional Role Ethics.
  *   **Awkward Commitment:** If the system rule always beats the relationship duty, it's hard to explain why the role was "constitutive" in the first place.
  *   **Status:** ✅ Defended (but tense).

  ### 3. The Virtue Collapser
  *(Branch A → Scale No)*
  *   **Real View:** Private Confucianism / Generic Virtue Ethics.
  *   **Awkward Commitment:** Your public life becomes morally empty; you're just "being good" generally, not fulfilling specific role duties.
  *   **Status:** ⚠️ **Collapse Warning:** This is where Role Ethics turns into generic Virtue Ethics.

  ### 4. The Corporate Dad
  *(Branch B → Scale Yes → Script Wins)*
  *   **Real View:** Paternalistic Management.
  *   **Awkward Commitment:** You are asking workers to feel emotional gratitude for a relationship you admit is just a performance.
  *   **Status:** ✅ Defended (in practice), ❌ Critiqued (in theory).

  ### 5. The Modern Pro
  *(Branch B → Scale No OR Branch B → Script → Rule Wins)*
  *   **Real View:** Liberal Professionalism.
  *   **Awkward Commitment:** This isn't Confucianism at all; it's just standard Western contract theory with nice manners.
  *   **Status:** ✅ Coherent, ❌ Wrong Workshop.

  ---

  ## 🚩 Flags & Glitches

  ### 🚫 The Empty Branch: "Scaled but Unmediated"
  There is a path missing from this tree: **Accepting Scaling (Split 2A) but Denying Institutional Mediation.**
  *   **The View:** "The State is a Family, but I relate to the President directly, not through laws/agencies."
  *   **Verdict:** **Incoherent.** You cannot scale kinship to millions of people without institutions to mediate the care. This leads to warlordism or cults, not ethics.

  ### 👯 Indistinguishable Leaves
  **The "Structural Confucian" (Leaf 2)** and **The "Modern Pro" (Leaf 5)** often look identical in practice.
  *   **Why:** Both end up following the employee handbook when profit clashes with care.
  *   **The Difference:** Leaf 2 feels bad about it (loss of self); Leaf 5 doesn't (just business).
  *   **Flag:** This tree sorts your *internal ontology*, not your *external actions*. If you only care about policy outcomes, you can't tell these two apart.

  ### ⚠️ The "Generic Virtue" Trap
  If you landed on **Leaf 3**, watch out.
  *   **The Risk:** You believe roles define you (Family), but you don't think they scale to the State/Company.
  *   **The Result:** When you enter the public sphere, you have no *role-specific* ethics to guide you, so you default to "just be kind." That collapses Confucian Role Ethics into generic Virtue Ethics, which defeats the point of the workshop.

  ---

  **Next Step:** Go find someone in a different leaf and ask them why they think you're wrong. Don't use quotes from the *Analects*. Use the cases.
