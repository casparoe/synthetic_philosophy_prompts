  Here is the shape of the argument you need for the introduction, based on the structural patterns in her verdicts.

  ### 1. The Prediction
  She will rule that the supervaluationist package for vagueness is **deflationary (another device)**.

  She will likely treat the supervaluationist "true" exactly as she treats "truth in a model" or "truth at a world." It is a recursive definition over a parameter (the admissible sharpening) designed to preserve classical logic for the truth predicate while accommodating semantic indecision in the object language. She will reject your friend's specific justification ("sharpening-relative minimalism" saves the equivalence schema) as unnecessary tinkering. For her, the view is deflationary not because the schema is saved locally, but because the truth predicate is functioning as a semantic instrument rather than a metaphysical ground.

  ### 2. The Rule She Is Running
  The governing principle is **The Explanatory and Logical Stress Test**.

  On this rule, a substantive property of truth is required if and only if:
  1.  **Metaphysical Explanatory Work:** Truth is invoked as the *explanans* (e.g., success of science) or as the *explanandum* of a metaphysical grounding relation that outstrips semantic equivalence (e.g., truthmaking).
  2.  **Logical Inconsistency:** The unrestricted logic of the truth predicate generates paradox that cannot be resolved by mere parameterization (e.g., the Liar).

  If 'truth' is merely doing expressive work (generalization), normative work (aim of belief), or semantic work defined recursively over a structure (models, worlds, sharpenings), it remains deflationary. Vagueness falls under the third category (semantic work over a structure), so it does not trigger the need for substance.

  ### 3. Alternative Rules That Fit the Seven Verdicts
  To show you have considered the space of possibilities, here are two other rules that fit her seven existing verdicts equally well but diverge on the vagueness case or future cases:

  *   **The Unrestricted Transparency Rule:** Substance is needed exactly where the T-schema ($T(\ulcorner \phi \urcorner) \leftrightarrow \phi$) cannot be maintained as unrestricted, transparent, and bivalent.
      *   *Fit:* Explains Liar (schema inconsistent) and Truthmaking (equivalence doesn't capture the *because*). Explains the Deflationary verdicts (disquotation, generalization, models) as cases where the schema holds or is harmlessly restricted.
      *   *Divergence:* This rule might force a **Substantive** verdict on Vagueness, because supervaluationism sacrifices the unrestricted T-schema for borderline cases (a borderline $\phi$ is not true, but $T(\ulcorner \phi \urcorner)$ is false). If she rules Deflationary, this rule is false.
  *   **The Natural Kind Rule:** Substance is needed whenever 'true' is treated as naming a natural kind or a property with causal/nomological powers, or when the logic requires a new ontology.
      *   *Fit:* Explains Truthmaking/Science (causal/explanatory power) and Liar (new ontology/hierarchy). Explains Deflationary verdicts as non-natural, logical, or normative uses.
      *   *Divergence:* This rule predicts **Deflationary** for Vagueness (sharpenings are semantic, not natural kinds), matching the prediction above, but it struggles to explain why "Truth in a Model" is deflationary if models are taken realistically. It relies on the instrumental status of the model.

  ### 4. The Load-Bearing Verdict
  The verdict on **Truth in a Model** is the load-bearing premise for your prediction.

  This is the closest structural analogue to the vagueness case. In both instances, truth is defined recursively over a structure (a model vs. a set of sharpenings). If she considers model-theoretic truth to be a mere device without a substantive property, consistency demands she treat supervaluational truth the same way. If she were to rule Vagueness as Substantive, she would have to explain why "truth in a model" is a harmless semantic device while "truth on all sharpenings" is a substantive property, despite both being recursive definitions over parameters. The "Truth in a Model" verdict anchors the claim that semantic parameterization is deflationary.

  ### 5. The Crucial Test Case
  The case that tells the **Explanatory/Logical Stress Test** apart from the **Unrestricted Transparency Rule** is **Epistemicism about Vagueness**.

  *   **The Case:** Epistemicism holds that vague predicates have sharp boundaries (bivalence holds, T-schema holds classically), but we cannot know where they are.
  *   **Why it separates the rules:**
      *   Under the **Unrestricted Transparency Rule**, Epistemicism should be **Deflationary**. The logic is classical, the T-schema holds unrestricted, and there are no gaps or paradoxes.
      *   Under the **Explanatory/Logical Stress Test**, Epistemicism might be **Substantive**. It posits a metaphysical fact about the world (sharp boundaries for 'tall') that truth tracks, which looks like the "Truthmaking" verdict (truth on the receiving end of a metaphysical explanation).
  *   **The Diagnostic:** If she calls Epistemicism deflationary, she is running a Logic/Schema rule. If she calls it substantive, she is running an Explanatory/Metaphysical rule. Given her rejection of Truthmaking, she will likely call Epistemicism **Substantive**, confirming that her deflationism is limited by metaphysical commitment, not just logical consistency.

  ### Summary for the Intro
  In drafting the introduction, frame her view not as a denial of truth's complexity, but as a strict demarcation between **semantic instruments** (which can be complex, parameterized, and gappy without being substantive) and **metaphysical posits** (which require a property). The vagueness case is the stress test for whether "semantic instrument" covers recursive definitions that sacrifice the unrestricted T-schema. Based on her treatment of models and truthmaking, the through-line is that **semantic recursion is free, but metaphysical grounding costs.**
