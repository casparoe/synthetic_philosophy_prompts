      *   *Claim 3:* "...if you do the right thing because you feel like it, or because it makes you happy, or because you'd feel guilty otherwise, then the action is still the correct one but it has no moral worth, you get zero credit for it."
          *   *Verdict:* Mostly correct regarding "no moral worth." "Zero credit" is colloquial but potentially misleading (it's still a *good* action, just not *morally praiseworthy* in the strict sense).
      *   *Claim 4:* "So doing the right thing for the wrong reason is morally worthless..."
          *   *Verdict:* Accurate to Kant's specific technical term "moral worth."
      *   *Claim 5:* "...and duty is the only reason that counts."
          *   *Verdict:* Accurate.
      *   *Claim 6:* "Taken seriously this means the person who has to drag themselves to the hospital to visit a sick friend, hating every minute of it, has more moral worth than the person who goes because they actually want to see their friend."
          *   *Verdict:* This is the famous "Cold Heart" objection. It's a standard interpretation, *but* often overstated. Kant does say the struggle adds clarity to the motive, but he doesn't necessarily say the happy person has *negative* worth, just zero *moral* worth.
      *   *Claim 7:* "Which is obviously absurd, and that's basically why nobody defends this position anymore."
