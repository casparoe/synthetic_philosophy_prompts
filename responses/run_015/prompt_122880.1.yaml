      *   **User Profile:** Backend developer, no philosophy training, feels out of depth in a debate with a friend.
      *   **Task:** Critique a blog post's summary of Kantian ethics (specifically regarding moral worth and duty). Go line-by-line. Address two specific intuitions/questions the user has developed.
