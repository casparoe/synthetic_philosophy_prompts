  *(Self-Correction on the Cron Job)*: Make sure to explain *why* it's not Kantian. It lacks the capacity to *not* do it. If it can't choose otherwise, it's not moral.

  *(Refining the "Training" point)*: This is the "Paradox of Moral Education." If I train you to like duty, do you lose moral worth? Kant would say as long as you recognize the *law* as the reason, the feeling is secondary. But if the feeling is the *driver*, then yes, no worth.

