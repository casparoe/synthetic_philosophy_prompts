answer: |-
  **Theoretical Specifications**

  (i) **Judgment Theory:** Emotions are identical to evaluative judgments that the subject fully endorses and would defend. (Strong formulation: identity rather than involvement.)
  (ii) **Perceptual Theory:** Emotions are states in which *any* evaluative property seems present to the subject, even minimally or peripherally. (Permissive formulation: lowers the threshold for a 'yes' verdict.)
  (iii) **Feeling Theory:** Emotions are identical to the feeling of characteristic bodily changes. (Strong formulation: identity.)
  (iv) **Affordance-Priority Theory:** Emotions are identical to a re-ranking of the subject's field of available actions. (Strong formulation: identity.)

  ***

  **The Scenario**

  Elena sits in the weekly budget meeting. Mark speaks over her, claiming her data as his own. Elena checks the protocol document; paragraph four confirms the data is hers. She marks the violation in her notes. Her grip on the pen tightens until her knuckles whiten; she feels a hot flush rise up her neck. She closes her folder and stops looking at Mark, turning her chair slightly away. She drafts a memo in her head correcting the record. The room looks unchanged. Mark's face appears neutral, merely efficient. The air does not feel charged. Nothing strikes her as shocking or aggressive; it registers only as a procedural error she must log. She feels no attack, only incorrectness. The bodily sensations remain localised; they do not colour her view of the room. She knows the rule was broken, but the wrongness lies in the files, not in the atmosphere.

  ***

  **1. Verdicts and Reasoning**

  (i) **Judgment Theory: YES.** Elena explicitly identifies a norm violation ("protocol confirms") and endorses the claim of ownership by drafting a correction, satisfying the requirement for a defended evaluative judgment.
  (ii) **Perceptual Theory: NO.** Despite the judgment, the situation does not *appear* insulting or unfair; it appears neutral and procedural, failing the requirement for an evaluative seeming.
  (ii) **Somatic Variant: NO.** While bodily changes occur, they are registered as localised sensations that do not present evaluative content or "colour" the world, thus failing to constitute a perceptual seeming of value.
  (iii) **Feeling Theory: YES.** Elena experiences the specific pattern of bodily agitation (tightening, flush) constitutive of the emotion, regardless of how the situation appears.
  (iv) **Affordance-Priority Theory: YES.** Her behavioural field is re-ranked: collaborative engagement is deprioritised in favour of withdrawal and corrective retaliation (the memo).

  **2. The Working Feature and Its Removal**

  The single feature doing the work is the **dissociation of evaluative judgment from evaluative appearance** (phenomenal flatness). The subject cognitively affirms the wrongness while the world phenomenally presents as neutral.

  If this feature is removed—i.e., if the situation *also* appeared insulting—the Perceptual verdict would flip to YES. The case would then collapse into a standard **Fitting Emotion** case (e.g., seeing a snake and judging it dangerous).

  This case is the mirror image of **Recalcitrance Cases** (e.g., the phobic who judges the spider safe but sees it as dangerous). Here, the subject judges the act wrong but sees it as neutral. To turn this back into a recalcitrance case, one would subtract the **Judgment** (have her think the data *was* Mark's) while retaining the **Perceptual/Feeling/Affordance** elements (body tightens, she withdraws, yet it still doesn't *seem* wrong? No, recalcitrance requires the *Seeming* to remain YES while Judgment goes NO). To make it recalcitrant: She judges it *fair* (Judgment NO), but her body tightens and the room feels charged (Perceptual/Feeling YES).

  **3. Strongest Objection from Perceptual Theory (ii)**

  **Objection:** "You cannot have the bodily pattern of resentment (flush, tightening) without the world seeming demanding or hostile. The bodily feeling *is* the mode of presentation for the evaluative property. If James (iii) says YES, Perceptual Somatic must say YES."

  **Blocking Feature:** The scenario stipulates the sensations are "localised" and do not "colour her view." It forces a distinction between *having* a sensation and that sensation *presenting* the world as value-laden.

  **Success Assessment:** This objection is **highly potent**. Many perceptual theorists argue that bodily feelings *just are* intentional seemings. If the student argues that the "hot flush" inherently presents the situation as offensive, the Perceptual verdict flips to YES, breaking the case. The case relies on the controversial claim that bare bodily awareness is possible without evaluative content. I accept this vulnerability: it is the precise philosophical friction point I wish to test.

  **4. Marking Note**

  **Must Include:** A clear identification that the Perceptual verdict turns on the absence of *evaluative seeming* (phenomenology), not the absence of bodily feeling or judgment. The student must explain why the "flat" phenomenology blocks (ii) while the bodily facts support (iii).

  **Partial-Credit Trap:** A strong student might argue that because Perceptual Theory says NO, there is *no emotion* in the case. They should instead recognize that the case is designed to test the *conditions* of the theory; a correct answer acknowledges that (i), (iii), and (iv) classify this as resentment, while (ii) classifies it as a non-emotional state, and analyzes the divergence without dismissing the scenario's validity.
