answer: |-
  Maya's causal-history account is philosophically superior because Dev's swap case fails to recognize that the knowledge of an artwork's origin is constitutive of the aesthetic experience, not merely an external market guarantee.

  Maya wins the opening exchange because her definition of value aligns with the standard ontological view in aesthetics: an artwork is not just a visual pattern but an event in history. When Dev dismisses this as "relic worship," he conflates religious superstition with the legitimate interest in human agency; we value a Van Gogh differently than a perfect forgery not because of magic, but because we value the specific creative act of that specific person. Maya's counter-move comparing art to live performance is particularly strong here. Just as a live concert offers a value distinct from a perfect recording due to the shared historical moment and risk, an original painting offers a connection to the artist's time and hand that a copy cannot replicate, regardless of visual fidelity.

  Dev's swap case is his strongest tactical move, but it relies on a hidden premise that Maya successfully dismantles. Dev argues that if the visual experience is identical, nothing of aesthetic value is lost. However, this assumes aesthetic experience is purely retinal. Maya's reply correctly identifies that the "wrong" in the swap case is epistemic: visitors are deprived of the true relationship to the object they are engaging with. When Dev claims this is just about provenance as a "market guarantee," he ignores the museum's function as an educational and historical institution rather than a mere decorator. If the value were only market-based, visitors wouldn't feel personally betrayed; they would only worry about resale value. The fact that viewers feel cheated even if they never intend to sell proves the value is intrinsic to their engagement, not extrinsic to the market.

  Ultimately, Maya's story fits the swap case better because it explains the specific nature of the betrayal. If Dev were right—that everything we love is fully present in the copy—the revelation of the swap should leave the viewers indifferent, realizing they got the same visual experience for free. Instead, the outrage confirms that the "history" Maya talks about is part of the object's identity. The museum's decade of silence in your news story validates Maya: the breach wasn't that the painting looked different, but that the institution lied about the human history behind it, fundamentally altering what the object *is* for the viewer.
