prompt: |-
  I'm moderating a colloquium Q&A with an unnamed philosopher who defends a specific comparative thesis in folk morality: she argues that the German orientation toward Ordnung and responsible rule-subordination is structurally better suited to sustaining long-term collective moral practices than the American orientation that grants individual conscience jurisdictional priority over shared rules. Rather than framing the disagreement as a familiar liberty-versus-authority tradeoff, she introduces two conceptual distinctions of her own—"jurisdictional inversion," in which personal conscience claims veto power over the rules that make collective life possible, and "subordinated authorship," in which participants treat rules they did not personally create as binding precisely because they understand themselves as continuing an ongoing practice rather than authoring it from scratch. I want eight to ten interview questions that do not ask her to restate these distinctions but instead press where her argument is genuinely exposed.

  Please include at least one question that forces her to separate her view from uncritical obedience or authoritarianism, with a follow-up keyed to her most likely reply—that legitimate rule-following requires an internal recognition of the practice's authority, not mere external compliance. I want another that challenges the empirical or historical premise: if American moral culture really suffers from jurisdictional collapse, how does she account for the sustained coordination visible in American collective movements such as labor organizing, civil rights coalitions, or environmental alliances? The follow-up should anticipate her distinction between "episodic coordination" and "institutional durability." I also want a question asking what normative resources her view retains for criticizing genuinely oppressive collective practices—say, a community whose shared rules systematically exclude a minority—without relying on the conscience-based veto she has just rejected. Finally, include one question about whether "subordinated authorship" can survive in deeply pluralistic societies where participants do not share a single moral tradition, with a follow-up addressing her probable move to "nested practices" or layered commitments.

  Begin immediately with question 1, numbered through question 10, each presented as the question itself followed by a brief bracketed note indicating the anticipated answer and then the follow-up. Do not include any introductory framing, no restatement of this request, and no generic questions about her background or motivation.
