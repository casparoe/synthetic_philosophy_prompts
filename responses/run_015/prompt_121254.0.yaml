answer: |-
  # Joint Statement on Aggregation and Justification within Contractualism

  **Participants:** Pairwise Non-Aggregationist Contractualists (PNAC) and Threshold-Sensitive Contractualist Aggregationists (TSCA)
  **Framework:** Scanlonian Contractualism

  ## 1. Agreed Claims

  We, the undersigned camps, affirm the following foundational commitments regarding moral justification within the contractualist framework:

  1.  **Formal Structure of Justification:** An act or principle is wrong if it violates a principle that no one could reasonably reject. Justification proceeds by comparing the strength of reasons for rejecting alternative principles.
  2.  **Generic vs. Personal Reasons:** Reasons for rejection must be generic (grounded in the standpoint of individuals generally situated) rather than fully personal (grounded in idiosyncratic preferences or projects).
  3.  **The Aggregation Problem:** We identify the central dispute as whether the summed burdens across multiple persons can ever generate a collective reason to reject a principle that outweighs a severe burden imposed on a single individual.
  4.  **Severity Priority:** We share the judgment that preventing one permanent paralysis generally outweighs preventing any number of minor, transient inconveniences, regardless of the number of persons experiencing the inconvenience.
  5.  **Rejection of Utilitarianism:** We jointly reject welfare-maximizing aggregation; the rightness of a principle is not determined by the linear summation of welfare units across a population.
  6.  **Constraint on Aggregation:** We agree that if aggregation is permitted within contractualism, it must be constrained by a non-arbitrary mechanism (such as a threshold of significance) rather than simple linear summation.

  ## 2. Areas of Disagreement

  | Issue | Pairwise Non-Aggregationist View (PNAC) | Threshold-Sensitive View (TSCA) |
  | :--- | :--- | :--- |
  | **Scaling of Generic Reasons** | Generic reasons are inherently tied to individual standpoints; the strength of a reason does not scale simply because more individuals hold identical reasons. | Generic reasons can scale across persons; when many individuals bear identical burdens, their combined generic reason can exceed the strength of a single individual's stronger burden. |
  | **Collective Veto Power** | A collective veto is illegitimate; justification requires that no *individual* could reasonably reject a principle, preserving a strict pairwise comparison structure. | A collective veto is permissible; if aggregated burdens cross a context-sensitive threshold, the group possesses a collective generic reason to reject a principle without violating individual standing. |
  | **Collapse into Rule-Utilitarianism** | Permitting any form of aggregation inevitably collapses contractualism into rule-utilitarianism by prioritizing total burden over individual veto power. | Threshold-sensitive aggregation preserves contractualism by respecting qualitative severity limits, preventing the sacrifice of individuals for trivial aggregate gains. |

  ## 3. Cruxes of the Debate

  The following sub-questions represent critical points of contention. Settling any one of these would significantly shift the position of at least one camp.

  **Crux 1: The Moral Significance of Distributed Risk**
  *   **(a) Crux Statement:** Does the contractualist framework require comparing individual risk magnitudes directly, or can distributed small risks aggregate to outweigh a concentrated large risk?
  *   **(b) Test Case:** A principle exposing each of one million people to an independent 0.001 risk of death in exchange for a large shared benefit, versus a principle exposing one person to a 10% risk of death for the same benefit.
  *   **(c) Predictions:**
      *   *PNAC:* The principle imposing the 10% risk on one person is reasonably rejectable because 10% > 0.001% in pairwise comparison.
      *   *TSCA:* The principle imposing distributed risks is reasonably rejectable because the aggregate expected deaths (1,000) cross a threshold of significance outweighing the single expected 0.1 death.

  **Crux 2: The Aggregation of Moderate Burdens**
  *   **(a) Crux Statement:** Can a sufficiently large number of moderate burdens collectively outweigh a single severe (but non-catastrophic) burden?
  *   **(b) Test Case:** A policy preventing one person from losing their job versus a policy imposing a one-month unpaid leave on fifty thousand people.
  *   **(c) Predictions:**
      *   *PNAC:* The principle imposing job loss is rejectable; the individual burden of unemployment outweighs the transient financial loss of leave for any number of others.
      *   *TSCA:* The principle imposing unpaid leave may be rejectable; if the aggregated financial loss crosses a threshold of social significance, it outweighs the single job loss.

  **Crux 3: The Ontology of the Rejecting Agent**
  *   **(a) Crux Statement:** Is the entity capable of "reasonable rejection" strictly the individual, or can a collection of individuals constitute a rejecting agent?
  *   **(b) Test Case:** A noise ordinance that imposes a minor inconvenience on all residents to prevent a moderate disturbance to one resident.
  *   **(c) Predictions:**
      *   *PNAC:* Only the single disturbed resident has a generic reason strong enough to reject the absence of an ordinance; the multitude's minor reasons do not combine.
      *   *TSCA:* The multitude possesses a collective generic reason to reject the ordinance if the total disturbance crosses a threshold, even if no single individual's reason suffices.

  ## 4. Assessment of Verbal Dispute

  A portion of this dispute appears merely verbal regarding the definition of "generic reason." If "generic reason" is defined inherently as individual-relative, PNAC is analytically correct; if defined as standpoint-relative (where a standpoint can be collective), TSCA is analytically correct. However, the dispute is not *merely* verbal because the definitions carry substantive implications for risk distribution and moderate burden cases. The disagreement over whether a "collective veto" violates "individual standing" reflects a deep divergence in how moral standing is conceptualized, not just a difference in terminology.

