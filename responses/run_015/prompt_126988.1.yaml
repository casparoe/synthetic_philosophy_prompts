  *(Refining the "Weakness" flags)*: Be brutal. The user needs to know where they might get cornered. The biggest weakness is the claim that we *shouldn't* try to reconstruct indigenous frameworks. That sounds like giving up on the subaltern. I need to highlight that tension.

  *(Final check on tone)*: Keep it punchy. "Here's the bleed," "Don't flinch," etc.

