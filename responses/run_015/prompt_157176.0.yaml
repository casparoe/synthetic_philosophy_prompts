  **Residue Report**

  The translation of "separateness" into Non-Transferable Utility (NTU) is clean; it formally captures the prohibition on cross-species aggregation. However, the "meaningful life" criterion survives only with significant distortion. In Nozick, this is a qualitative threshold of existence. In mechanism design, it collapses into a quantitative reservation utility $\bar{U}$. This reduces a deontological boundary to a consequentialist floor, implying that a life slightly above $\bar{U}$ is permissible to sacrifice if the mechanism allows, whereas Nozick intends a stricter prohibition.

  Furthermore, preference revelation is inverted. Standard mechanism design solves for truth-telling among strategic agents. Here, agents are non-strategic observers. The "leftover" is the normative source of the IR constraint. Economics treats $\bar{U}$ as an exogenous parameter; Nozick treats it as an intrinsic moral fact. The formalism captures the *operation* of the constraint but cannot generate the *authority* of the constraint. The "right" not to be tortured appears in the model as a hard feasibility bound, but the model cannot explain why that bound exists rather than another. This residue is the moral status itself—the claim that the animal is an end, not a parameter. The economic vocabulary describes the cage but cannot account for the prisoner's claim to be outside it. The "meaningful life" becomes a participation constraint, losing its normative weight. The inviolability Nozick claims is lost; in economics, every constraint has a shadow price. Nozick denies shadow prices on rights. That denial is the residue.

  **Verdict**

  The leftover exposes an undefended essentialism in Nozick. The economic formalism successfully demonstrates that side-constraints are functionally equivalent to stability conditions required when dealing with non-contractual agents. Nozick's insistence that these constraints arise from metaphysical "rights" rather than structural necessity is the failure. He posits a moral residue that the mechanism cannot capture, but this residue is merely his reluctance to admit that his theory operates as a constrained optimization problem. The "sacredness" of the individual is just a label for a parameter that prevents mechanism collapse into exploitation. By refusing to ground this parameter in the mechanism's properties (like contractual incapacity), Nozick relies on intuition rather than derivation. The economic view is superior: it shows that rights are structural protections for non-strategic agents, not mystical essences. Nozick's leftover is not a failure of formalism, but a failure of his metaphysics to own its operational logic. The "moral status" he clings to is simply the recognition of a mechanism design problem he refuses to solve formally.
