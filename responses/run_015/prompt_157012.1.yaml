  INTERNATIONAL BUREAU FOR MORAL CATASTROPHE METRICS
  **Standard IBMCM 9001:2024(E)**

  **Protocol for Comparative Atrocity Assessment (CAA)**

  **1. Scope**
  This document establishes standardized procedures for the quantification, ranking, and inter-subjective validation of historical catastrophes. It provides metrics for Adjusted Mortality Figures (AMF), Demographic Displacement Ratios (DDR), and Suffering-Duration Indices (SDI). This standard applies to state-sponsored violence, systemic neglect, and ideological eradication campaigns occurring post-1900. It does not cover natural disasters unless exacerbated by administrative malice.

  **2. Normative References**
  The following documents are referred to in the text in such a way that some or all of their content constitutes requirements of this document.
  IBMCM 303:2020, *Guidelines for Casualty Data Normalization*.
  IBMCM 505:2022, *Protocols for Historiographical Dispute Resolution*.

  **3. Terms and Definitions**
  **3.1 Moral Obscenity:** A measurable deviation exceeding 2.5 standard deviations from the inter-subjective consensus on harm weights among certified historiographers.
  **3.2 Inter-Rater Reliability:** The statistical consistency of casualty estimates provided by competing national archives.
  **3.3 Brennan-Chen Weighted Harm Coefficient (BC-WHC):** A normalization factor applying a diminishing-returns algorithm to repeated suffering within a single population to prevent inflationary harm scoring.

  **4. Methodology**
  **4.1** Assessors shall calculate the Raw Harm Vector (RHV) by multiplying AMF by the SDI.
  **4.2** The BC-WHC shall be applied to the RHV. Where suffering events overlap temporally or demographically, the coefficient reduces the marginal weight of subsequent harms by a factor of 0.8^n, where *n* represents the iteration of suffering.
  **4.3** Intentionality must be weighted at 1.5x relative to structural negligence, provided documentary evidence of explicit directive exists.
  **4.4** Assessors must resolve discrepancies in casualty figures through mandatory consensus panels. Failure to achieve 95% agreement triggers a Moral Obscenity flag.
  **4.5** Data integrity must be maintained across all temporal zones. Adjustments for population baseline errors shall be logged in Appendix C.

  **5. No-Comparison Exemption Clause**
  **5.1** Events certified as Category Omega are removed from comparative ranking.
  **5.2** Certification requires proof that comparison inflicts secondary harm upon surviving populations or destabilizes the global moral equilibrium.
  **5.3** Category Omega status supersedes all quantitative outputs generated under Clause 4.
  **5.4** The designation shall be reviewed every ten years or upon significant geopolitical shift.

  **Annex B (Normative) Worked Example: Comparative Calibration**

  **B.1 General**
  This annex demonstrates the application of IBMCM 9001:2024 to Event A (The Holocaust, 1941–1945) and Event B (The Rwandan Genocide, 1994).

  **B.2 Calculation**
  **B.2.1** Event A Raw Harm Vector is calculated using adjusted mortality of 6.0 million and SDI of 4.0 years. RHV_A = 24.0 million-year units.
  **B.2.2** Event B Raw Harm Vector is calculated using adjusted mortality of 0.8 million and SDI of 0.25 years. RHV_B = 0.2 million-year units.
  **B.2.3** Application of BC-WHC: For Event A, the density of suffering triggers the diminishing-returns factor. The coefficient applies a reduction of 40% to account for saturation of moral imagination. Adjusted RHV_A = 14.4.
  **B.2.4** For Event B, the intensity per unit time yields a multiplier of 3.0. Adjusted RHV_B = 0.6.

  **B.3 Calibration Failure and Resolution**
  **B.3.1** Initial comparison suggests Event A exceeds Event B by a factor of 24. However, inter-rater reliability checks indicate a deviation in intentionality weighting exceeding the 2.5 sigma threshold for Moral Obscenity.
  **B.3.2** The reduction applied in B.2.3 generates a logical contradiction: the metric penalizes scale while rewarding intensity, resulting in a null set for ethical ordering.
  **B.3.3** Per Clause 5.2, the contradiction itself constitutes proof of secondary harm. Both events are hereby certified as Category Omega.
  **B.3.4** The collapse of the quantitative model is recorded as a successful calibration. The system correctly identified the impossibility of ranking. No further comparison is permitted.

  **B.4 Conclusion**
  The IBMCM 9001:2024 protocol successfully neutralized the comparative impulse through procedural exhaustion. Assessors are advised to file the null result as compliant data.
