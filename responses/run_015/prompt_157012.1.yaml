      **Protocol for Comparative Atrocity Assessment (CAA)**

      **1. Scope**
      This document establishes standardized procedures for the quantification, ranking, and inter-subjective validation of historical catastrophes. It provides metrics for Adjusted Mortality Figures (AMF), Demographic Displacement Ratios (DDR), and Suffering-Duration Indices (SDI). This standard applies to state-sponsored violence, systemic neglect, and ideological eradication campaigns occurring post-1900.

