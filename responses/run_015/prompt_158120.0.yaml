prompt: |-
  You are an expert philosopher of history with training in historiography and conceptual analysis. Your task is to design a formal decision-tree taxonomy — not a prose comparison — that classifies stances on whether the conventional tripartite division of Western history into the Middle Ages, the Renaissance, and the Scientific Revolution tracks real structural discontinuities, or whether these are retrospective inventions imposed on a more continuous past. Please think carefully and work step by step. Begin with a brief brainstorming section (no more than 150 words) in which you map the independent dimensions of commitment — for example, whether discontinuities exist in material practice, in self-conscious rhetoric, in institutional form, or in archival preservation; whether retroactive labelling is harmless, harmful, or constitutive — and show how these combine into a logical space of positions before any famous names are assigned.

  Once the space is laid out, present the tree itself. Each internal node must pose a concrete, answerable case or claim — never a theoretical label — so that a reader can navigate from commitment to leaf without knowing the names in advance. The tree must contain at least eight leaves. The following positions must appear as leaves, either named or clearly described:
  - Essentialist periodization (the periods are real, mind-independent structures).
  - Strong nominalism (the labels are purely convenient fictions with no tracking function).
  - Pragmatic pluralism (the divisions are instrumentally useful but ontologically lightweight).
  - The archival-performative stance (treat this niche view as legitimate: period labels are speech acts that reshape the archive and thereby create the very discontinuities they claim to describe).
  - The mislabelled-rupture view (real discontinuities exist, but none of the three standard labels capture them correctly).

  For every leaf, provide: (1) the name, or “unnamed” if the combination is unoccupied; (2) one sentence stating its most awkward or counter-intuitive commitment; (3) if unnamed, a brief diagnosis of whether the emptiness is due to incoherence, unattractiveness, or mere neglect. Where two named positions land on the same leaf, flag this explicitly rather than concealing it.

  The branching cases that must serve as internal nodes (you may reorder them) are:
  - Case A: The continuity of Roman legal procedure in seventh-century Byzantium versus its near-absence in seventh-century Gaul — does this support a real “fall of Rome” boundary, or is it regional variation?
  - Case B: The fourteenth-century Florentine humanists’ own use of terms such as rinascita — does self-labelling make a period real, or does it merely record local rhetoric?
  - Case C: The institutional novelty of the Royal Society (1660) versus the continuity of court-sponsored natural philosophy under earlier patrons — is this a genuine rupture in practice?
  - Case D: The transmission of Aristotelian texts via Arabic intermediaries in twelfth-century Toledo — should this be classified inside a continuous Middle Ages of transmission, or as an external rupture that undermines the period’s coherence?

  Constraints: build the tree from the logical space first, then map actual positions onto it. Do not start with a list of well-known historians and assign them. Do not request bibliographies, reading lists, or citations; the instrument must be fully usable by someone without web access. Do not invoke extremely obscure theories or proper names that a well-read generalist would not recognise; derive specificity from the cases above. Write in British English (for example, behaviour, centre, programme). Structure the response with clear headings, include the brief brainstorming preamble, and finish with an honest note on which pairs of positions the tree cannot separate and why.
