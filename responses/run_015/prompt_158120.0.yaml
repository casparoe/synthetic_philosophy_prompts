  ### Brainstorming Dimensions

  Dimensions include ontic status (mind-independent vs. discursive), semantic function (tracking vs. constituting), and granularity (sharp rupture vs. fuzzy continuity). One might affirm material discontinuities while denying label accuracy, or deny material breaks while affirming discursive effects. Archival preservation and institutional forms offer distinct evidentiary bases for these claims. Combining these yields a space where realism, nominalism, and performativism occupy distinct coordinates based on how they weigh rhetoric against practice.

