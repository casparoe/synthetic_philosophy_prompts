  2. Caruso argues that because character is forged by genetic and environmental luck, blaming dispositions is just as unjust as blaming specific determined acts.
  3. Dennett defends character-based desert by claiming agents are responsible when their internal decision-making processes are sufficiently intact to be influenced by social sanctions.
  4. This shift is a principled compatibilist redefinition of agency that prioritizes normative competence over metaphysical origination, rather than a covert sleight of hand.
  5. However, Dennett's position ultimately fails Caruso's test because the capacity for reasons-responsiveness is itself a product of the same causal luck that undermines the act.
