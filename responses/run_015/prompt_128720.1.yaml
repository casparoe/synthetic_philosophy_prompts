prompt: |-
  I am drafting the final examination for an MA-level module in epistemology and the philosophy of belief, and I need one essay question that engages seriously with the dogmatism paradox—the tension between the rational demand that beliefs remain open to revision in light of counter-evidence and the apparent inevitability that sustained belief requires some form of dogmatic commitment—without allowing candidates to succeed by merely reciting the standard formulation. To prevent a memorised answer, I want the question to embed a specific, somewhat niche framing: candidates should analyse the paradox through the lens of what I will call "institutional epistemic hinges," by which I mean the background certainties (for instance, the reliability of peer-review mechanisms or the integrity of statistical reporting protocols) that make collective belief-formation possible and that are rarely themselves subjected to individual scrutiny. The question should ask whether recognising these institutional hinges resolves the dogmatism paradox, relocates it to a collective rather than individual level, or reveals that the paradox was always mislocated in the first place. Please write the exam question suitable for a 90-minute response, together with a model answer of approximately 800 words and a marking scheme built around five must-hit moves (with marks assigned to each, totalling 20 points), clearly distinguishing what an A-level answer must contain from what a B-level answer typically misses. The model answer must take a committed position—arguing definitively for one of the three options named above—rather than surveying possibilities neutrally, and the entire response should be written in British English. Do not ask for bibliographies, citations, or reading lists, and do not include verbatim quotations from real texts unless you have fetched and verified the source; paraphrase any external ideas without quotation marks.
