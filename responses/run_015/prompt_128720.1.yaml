answer: |-
  **Module:** EPI502 – Advanced Epistemology and the Philosophy of Belief
  **Assessment:** Final Examination
  **Time Allowed:** 90 Minutes
  **Instructions:** Answer **one** question. Write clearly and concisely. Citations and bibliographies are not required; however, all external ideas must be paraphrased accurately without verbatim quotation.

  ***

  ### Examination Question

  **1.** The dogmatism paradox highlights a tension between the rational requirement that beliefs remain responsive to counter-evidence and the logical implication that knowing a proposition entails knowing that opposing evidence is misleading. Contemporary social epistemology suggests that individual belief-formation often rests upon what we might term **institutional epistemic hinges**: background certainties regarding systemic processes (such as the reliability of peer review or the integrity of statistical protocols) that enable collective knowledge but are rarely subjected to individual scrutiny.

  Critically analyse whether recognising the role of institutional epistemic hinges **resolves** the dogmatism paradox, **relocates** it from the individual to the collective level, or reveals that the paradox was **mislocated** in the first place. In your response, you must defend a committed position on one of these three options rather than providing a neutral survey.

  ***

  ### Model Answer

  The dogmatism paradox, traditionally associated with Henry Kyburg, posits that if an agent knows a proposition *p*, they are entitled to know that any evidence appearing to contradict *p* is misleading. Consequently, the knower seems rationally permitted to ignore counter-evidence, rendering belief dogmatic and closed to revision. This clashes with the fallibilist intuition that rational belief must remain open to correction. Introducing the concept of institutional epistemic hinges—those foundational trusts in systemic protocols like peer review or data integrity that underwrite collective belief—does not dissolve this tension. Rather, it convincingly **relocates** the paradox from the psychology of the individual believer to the structural design of epistemic institutions.

  To understand this relocation, one must first acknowledge why the individualistic framing fails. If we treat the knower as an isolated atom, the paradox forces a choice between dogmatism and scepticism. If I truly know *p*, I cannot weigh evidence against *p* without undermining my claim to knowledge. However, individual epistemic agency is rarely exercised in a vacuum. When a scientist accepts a consensus view on climate change, they are not personally verifying every data point; they are relying on the hinge certainty that the institutional mechanisms producing that consensus are reliable. These hinges function similarly to Wittgensteinian certainties: they are the scaffolding upon which inquiry rests, not the objects of inquiry themselves.

  Recognising these hinges shifts the burden of openness. The individual researcher is not required to remain open to the possibility that the entire statistical protocol is flawed every time they consult a journal; to do so would paralysis inquiry. Instead, the requirement for openness is absorbed by the institution itself. The institution must be structured to allow for the revision of its own hinges over time, even if individual agents are permitted to treat them as fixed in the short term. Therefore, the paradox is not resolved because the tension remains; it is merely transferred. The individual can be locally dogmatic (trusting the hinge) precisely because the collective is globally fallibilist (maintaining mechanisms to audit the hinge).

  However, this relocation generates a new, arguably more pressing, version of the paradox. If the institution requires stability to function (treating hinges as certain) but also requires openness to survive (acknowledging hinges can be broken), how is this balance maintained? The paradox re-emerges as a problem of institutional governance. An institution that subjects its own hinges to constant scrutiny collapses into scepticism and produces no knowledge. Conversely, an institution that treats its hinges as immutable becomes dogmatic and eventually produces falsehoods. The tension between stability and revision is not eliminated by moving to the collective level; it is amplified because the stakes involve communal trust rather than individual error.

  Arguing that the paradox is resolved would be incorrect because the logical tension between knowledge claims and evidence responsiveness remains intact within the institutional framework. Similarly, claiming the paradox was mislocated ignores the fact that the logical derivation holds regardless of the social context; knowing still implies ignoring counter-evidence, whether that knowledge is individual or delegated. The relocation thesis is superior because it explains why individual dogmatism often appears rational: it is a functional necessity delegated by the collective. The individual is licensed to be dogmatic about the hinge so that the institution can manage the risk of the hinge being false.

  In conclusion, the introduction of institutional epistemic hinges does not solve the dogmatism paradox. It reveals that individual rationality is parasitic on collective structures. The demand for openness is not removed but redistributed. The paradox survives as a structural challenge: designing institutions that are stable enough to function as hinges yet flexible enough to be revised when those hinges bend. Recognising this relocates the problem from a failure of individual rationality to a challenge of social epistemic engineering.

  ***

  ### Marking Scheme

  **Total Marks:** 20
  **Pass Mark:** 10
  **First-Class Threshold:** 17+

  **Assessment Criteria:**
  Markers should award points for each of the five moves below. An **A-level (First Class)** answer demonstrates critical insight, nuanced argumentation, and a definitive stance. A **B-level (Upper Second)** answer typically provides accurate exposition but lacks critical depth or decisive argumentation.

  | **Must-Hit Move** | **Marks** | **A-Level Performance (17–20)** | **B-Level Performance (13–16)** |
  | :--- | :---: | :--- | :--- |
  | **1. Formulation of the Paradox** | 4 | Accurately reconstructs the logical tension between knowledge claims and the dismissal of counter-evidence without needing verbatim quotes. Connects this immediately to the problem of revision. | Correctly states the paradox but treats it as a standard definition without linking it dynamically to the problem of rational revision. |
  | **2. Exposition of Institutional Hinges** | 4 | Defines "institutional epistemic hinges" precisely using the prompt's framing (e.g., peer review) and explains their functional role as background certainties enabling inquiry. | Defines the term correctly but treats it descriptively rather than functionally; fails to explain *why* they are rarely scrutinised. |
  | **3. Engagement with the Triad** | 4 | Explicitly addresses all three options (resolve, relocate, mislocated) before ruling out two. Demonstrates why the rejected options are insufficient. | Selects a position but fails to adequately explain why the alternative options are incorrect, or treats the options as a menu rather than a logical set. |
  | **4. Committed Argumentation** | 4 | Maintains a definitive stance throughout. The argument builds cumulatively towards the conclusion without hedging or neutrality. | Hedges between positions or concludes neutrally. The argument may contradict itself or lack a clear through-line. |
  | **5. Individual vs. Collective Nuance** | 4 | Insightfully analyses the tension between individual stability and institutional fallibility. Shows how the paradox transforms when scaled to the collective. | Distinguishes between individual and collective but treats them as separate silos rather than showing how the paradox transfers between them. |

  **General Guidance:**
  *   **British English:** Ensure spelling and grammar conform to British standards (e.g., "analyse", "recognising"). Deduct 1 mark for consistent Americanisation.
  *   **Citations:** Do not penalise the lack of bibliography (as per instructions). However, penalise heavily (under Move 1 or 4) if the candidate claims ideas as their own that are clearly distinctive external theories without attribution (even informal).
  *   **Quotations:** If verbatim quotations are used despite instructions, cap the maximum score at 14 marks.
  *   **Word Count:** The model answer is approx. 800 words. Candidates writing significantly less (under 500) should be capped at 12 marks regardless of quality due to insufficient development.
