prompt: |-
  hey — I help run a tiny student interview series attached to my cog sci seminar this term (we get one guest for 40 minutes, record it, and post the audio to a shared drive that maybe twelve people ever listen to). Next week's guest is a philosopher of cognitive science I'll call Dr. Marisol Vance, and she defends something she nicknames the "crutch curve" account of intelligence: the idea that intelligence isn't a system's peak score on a task but the shape of how its performance falls off as you strip away the supports it's currently leaning on — how often it gets feedback, how closely the test resembles what it was trained on, whether it has tools or external memory or scratch space, how much of the computation is quietly being done by the structure of the environment itself. Her slogan is that you find out how intelligent something is when you take the crutches away, and she likes to talk about "area under the degradation curve" instead of best-case performance. I've only skimmed her position paper and I half buy it, but I also suspect the view has an escape hatch every few pages, and I don't want to spend the episode nodding along.

  Could you draft me eight to ten interview questions that never let her just restate the slogan, plus a follow-up wherever you can guess the move she'd make? The specific things I want hit: (1) whether this is just out-of-distribution robustness with a sexier name, given that she'll probably answer that robustness is always relative to a single task while her curve is a partial order over whole families of degradation — I want that reply made progressively harder to lean on; (2) the no-free-lunch-flavoured worry that *which* degradations you choose to apply already smuggles in an assumption about which tasks and environments matter, so the "general" in general intelligence hasn't really been cashed; (3) bacteria, tardigrades and slime molds — they survive brutal perturbations and keep functioning, so either they're intelligent on her account or she has to say the degradations have to be of the right, representational kind, at which point she seems to have sneaked cognition back in through the back door; (4) her habit of dismissing measurement worries with "that's a measurement problem, not a problem for the account," which I'd like boxed in; (5) what her view says about us — take away language, literacy, sleep, other people, and human performance collapses too, so is she committed to human intelligence being mostly institutional scaffolding, and if she bites that bullet what's left of "artificial general intelligence" as a research target?

  Also, if you can work these in: one question on the psychometrics side, i.e. the fact that people who do well on one kind of cognitive test tend to do well on seemingly unrelated ones, and whether her account predicts that or just tolerates it (is intelligence one number on her view, or a family of seperate curves that can't be compared?); one on the old Chinese-room-style worry, whether something that degrades gracefully but doesn't understand anything is intelligent by her lights; one on how you'd actually run a degradation audit in practice without every lab tuning its system to the particular degradations the audit happens to test; one on whether an "intelligence explosion" — a system improving itself — is even a coherent idea if intelligence is resistance to losing your supports; and then a closing question about what empirical result would actually make her abandon the view, ideally with a concrete case (something like a system with a completely flat degradation profile that we'd still refuse to call intelligent, or one that falls apart fast but relearns a new regime faster than any person). Keep the questions in spoken-register English, since they'll be read out loud, and please don't pad them with biography stuff about her career — I can do that part myself.
reasoning: |-
  Here's a thinking process that leads to the suggested interview questions:

  1.  **Analyze the Request:**
      *   **Context:** A tiny student interview series (cog sci seminar), 40 mins, recorded audio, small audience.
      *   **Guest:** Dr. Marisol Vance (philosopher of cog sci).
      *   **Topic:** "Crutch Curve" account of intelligence (intelligence = area under the degradation curve as supports are removed, not peak performance).
      *   **Goal:** 8-10 interview questions that prevent slogan-restating, anticipate her likely defenses ("escape hatches"), and hit specific critical points.
      *   **Specific Points to Hit:**
          1.  OOD robustness vs. Crutch Curve (partial order over families of degradation).
          2.  No-Free-Lunch worry (choice of degradations smuggles in assumptions).
          3.  Bacteria/Tardigrades (survival vs. cognition/representation).
          4.  Measurement worries ("that's a measurement problem" defense).
          5.  Human implications (scaffolding, AGI target).
          6.  Psychometrics (g-factor, correlated abilities).
          7.  Chinese Room (graceful degradation without understanding).
          8.  Audit practice (Goodhart's law/tuning to the test).
          9.  Intelligence Explosion (self-improvement coherence).
          10. Falsification (empirical result to abandon the view).
      *   **Tone:** Spoken-register English, direct, no bio padding.
      *   **Structure:** Question + anticipated follow-up/probe.

  2.  **Deconstruct the "Crutch Curve" Theory:**
      *   *Core Claim:* Intelligence $\neq$ Max Performance. Intelligence = Robustness to Support Removal.
      *   *Metric:* Area Under the Degradation Curve (AUC).
      *   *Supports:* Feedback, training distribution match, tools, external memory, environmental structure.
      *   *Potential Weaknesses:* Defining "supports" is arbitrary. Survival $\neq$ Intelligence. Humans need supports too. Measuring the curve is hard/gameable.

  3.  **Drafting Questions (Iterative Process):**

      *   *Q1: OOD Robustness (Point 1).*
          *   *Draft:* Is this just robustness?
          *   *Refinement:* Need to corner her on the "partial order" defense.
          *   *Follow-up:* If it's a partial order, how do we compare System A and System B if their curves cross?
          *   *Spoken:* "Let's start with the nearest neighbor. A lot of ML folks hear 'performance as you strip away supports' and think 'out-of-distribution robustness.' I know you'll say robustness is task-relative and your curve is a partial order over families of degradation. But if I have System A that holds up better without feedback, and System B that holds up better without external memory, does your view actually let me say one is more intelligent? Or does the 'partial order' just mean we can't compare them, which feels like we've lost the 'general' in general intelligence?"

      *   *Q2: No-Free-Lunch/Choice of Degradations (Point 2).*
          *   *Draft:* Who picks the crutches?
          *   *Refinement:* Focus on the bias in selecting *which* crutches matter.
          *   *Follow-up:* If we pick crutches relevant to humans, aren't we just measuring human-likeness?
          *   *Spoken:* "To draw that curve, someone has to decide which crutches to pull away. Do we remove language? Gravity? Sleep? It feels like the 'generality' of the intelligence is only as general as the list of degradations you chose to test. If you pick crutches that matter to humans, aren't you just measuring human-likeness? And if you pick crutches at random, aren't you vulnerable to a No-Free-Lunch theorem where no system wins across all possible removals?"

      *   *Q3: Bacteria/Tardigrades (Point 3).*
          *   *Draft:* Are bacteria intelligent?
          *   *Refinement:* Focus on the "representational" escape hatch.
          *   *Follow-up:* If you require representation, haven't you defined intelligence by the mechanism rather than the performance curve?
          *   *Spoken:* "Let's talk biology. Tardigrades survive extreme radiation, dehydration, and vacuum. They degrade very slowly when you strip away environmental supports. On a pure performance curve, they look incredibly intelligent. I suspect your move is to say the degradations have to be of the right *representational* kind. But if you have to specify the *kind* of computation being disrupted, haven't you just snuck a definition of cognition in through the back door? Why look at the curve at all if you already know what counts as a cognitive crutch?"

      *   *Q4: Measurement Worries (Point 4).*
          *   *Draft:* Isn't measuring this hard?
          *   *Refinement:* Challenge the "measurement problem" dismissal.
          *   *Follow-up:* If the measurement defines the theory, is it a theory or a metric?
          *   *Spoken:* "You've written off some criticisms as 'measurement problems, not problems for the account.' But if the account *is* a curve, the measurement *is* the account. If I can't measure the area under the curve without making arbitrary choices about scaling and spacing, isn't the theory underdetermined? At what point does a measurement problem become a conceptual one?"

      *   *Q5: Human Scaffolding & AGI (Point 5).*
          *   *Draft:* Humans need crutches too.
          *   *Refinement:* Connect to AGI research goals.
          *   *Follow-up:* If human intelligence is institutional, is AGI supposed to be institutional too?
          *   *Spoken:* "If we apply this to us, human performance collapses without language, literacy, sleep, and other people. By your metric, human intelligence is mostly institutional scaffolding. If you bite that bullet, what happens to the AGI research target? Are we trying to build a standalone mind, or are we trying to build a new set of crutches? Because those seem like very different engineering projects."

      *   *Q6: Psychometrics/g-factor (Point 6).*
          *   *Draft:* What about g-factor?
          *   *Refinement:* Does the theory predict positive manifold?
          *   *Follow-up:* If curves are independent, why do humans correlate?
          *   *Spoken:* "In psychometrics, people who do well on one cognitive test tend to do well on others—the positive manifold. Does your account *predict* that? If intelligence is just a family of separate degradation curves, why should a system that degrades slowly on math tasks also degrade slowly on verbal tasks? Or is the correlation just a contingent fact about human brains that your theory doesn't need to explain?"

      *   *Q7: Chinese Room/Understanding (Point 7).*
          *   *Draft:* What about understanding?
          *   *Refinement:* Graceful degradation without semantics.
          *   *Follow-up:* Is a well-tuned lookup table intelligent if it degrades slowly?
          *   *Spoken:* "Imagine a system that has no internal understanding—it's a giant lookup table—but it's been engineered to degrade very gracefully as you remove inputs. It gives 'plausible' wrong answers rather than crashing. On your view, is that intelligent? If yes, does that mean intelligence is purely behavioral resilience? If no, where does the 'understanding' requirement enter the degradation calculus?"

      *   *Q8: Audit Practice/Goodhart's Law (Point 8).*
          *   *Draft:* Won't people game the test?
          *   *Refinement:* Tuning to the audit.
          *   *Follow-up:* How do you audit the auditors?
          *   *Spoken:* "Practically, if we start auditing AI systems using degradation curves, labs will just train their models to be robust against *those specific* degradations. We'll get systems that are good at losing crutches we test for, but brittle everywhere else. How do you run a degradation audit without the system just overfitting to the audit itself?"

      *   *Q9: Intelligence Explosion (Point 9).*
          *   *Draft:* Can it improve itself?
          *   *Refinement:* Coherence of self-improvement under this definition.
          *   *Follow-up:* Does removing crutches make improvement harder?
          *   *Spoken:* "People worry about an intelligence explosion—a system improving itself recursively. But if intelligence is resistance to losing supports, self-improvement looks like *adding* supports or internalizing them. Is an 'explosion' even coherent on your view? Or does a smarter system just look like one that has successfully glued more crutches to its own skeleton?"

      *   *Q10: Falsification (Point 10).*
          *   *Draft:* What proves you wrong?
          *   *Refinement:* Concrete empirical case.
          *   *Follow-up:* (None needed, this is the closer).
          *   *Spoken:* "Last one. What empirical result would make you abandon the Crutch Curve? Do you need to see a system with a flat degradation profile that we still refuse to call intelligent? Or a system that falls apart instantly but relearns a new regime faster than any human? Give me the concrete case that kills the theory."

  4.  **Review and Refine:**
      *   *Check Constraints:* 8-10 questions? Yes (10). Spoken register? Yes. Follow-ups included? Yes. Specific points hit?
          1.  OOD/Partial Order (Q1)
          2.  No-Free-Lunch/Choice (Q2)
          3.  Bacteria/Representation (Q3)
          4.  Measurement (Q4)
          5.  Humans/AGI (Q5)
          6.  Psychometrics (Q6)
          7.  Chinese Room (Q7)
          8.  Audit/Goodhart (Q8)
          9.  Explosion (Q9)
          10. Falsification (Q10)
      *   *Tone Check:* Ensure it sounds like a student seminar host, not a hostile journalist. Polite but probing. "I half buy this" vibe.
      *   *Formatting:* Clear separation between Question and Follow-up/Probe.

  5.  **Final Polish:** Make sure the transitions feel natural. Ensure the "escape hatch" anticipation is clear in the follow-ups. (Self-Correction: Make sure Q1's follow-up really presses the "incomparability" issue). Make sure Q3's follow-up presses the "circularity" issue.

  6.  **Final Output Generation** (Proceed to generate response based on these drafted questions).
answer: |-
  Here are ten interview questions drafted for spoken delivery, designed to corner the "Crutch Curve" account without being hostile. Each includes a follow-up probe to anticipate Dr. Vance's likely defensive moves.

  **1. The Out-of-Distribution Problem**
  "Let's start with the nearest neighbor. A lot of ML folks hear 'performance as you strip away supports' and they just think 'out-of-distribution robustness.' I know you'll say robustness is always relative to a single task, while your curve is a partial order over whole families of degradation. But if I have System A that holds up better without feedback, and System B that holds up better without external memory, does your view actually let me say one is more intelligent? Or does the 'partial order' just mean we can't compare them, which feels like we've lost the 'general' in general intelligence?"
  *   **Follow-up:** "If you say we can't compare them, aren't you admitting that 'intelligence' isn't a single property we're measuring, but just a list of unrelated robustness scores?"

  **2. The No-Free-Lunch Worry**
  "To draw that curve, someone has to decide which crutches to pull away. Do we remove language? Gravity? Sleep? It feels like the 'generality' of the intelligence is only as general as the list of degradations you chose to test. If you pick crutches that matter to humans, aren't you just measuring human-likeness? And if you pick crutches at random, aren't you vulnerable to a No-Free-Lunch theorem where no system wins across all possible removals?"
  *   **Follow-up:** "So is the 'Crutch Curve' actually a theory of intelligence, or is it just a theory of *human* intelligence disguised as a general metric?"

  **3. The Tardigrade Objection**
  "Let's talk biology. Tardigrades survive extreme radiation, dehydration, and vacuum. They degrade very slowly when you strip away environmental supports. On a pure performance curve, they look incredibly intelligent. I suspect your move is to say the degradations have to be of the right *representational* kind. But if you have to specify the *kind* of computation being disrupted, haven't you just snuck a definition of cognition in through the back door? Why look at the curve at all if you already know what counts as a cognitive crutch?"
  *   **Follow-up:** "If you require the system to have representations to count, doesn't that make the degradation curve just a symptom of intelligence, rather than the definition of it?"

  **4. The Measurement Defense**
  "You've written off some criticisms in your paper as 'measurement problems, not problems for the account.' But if the account *is* a curve, the measurement *is* the account. If I can't measure the area under the curve without making arbitrary choices about scaling and spacing, isn't the theory underdetermined? At what point does a measurement problem become a conceptual one?"
  *   **Follow-up:** "If two labs measure the 'area under the curve' differently and get opposite rankings of the same systems, is your theory falsified, or do they just need better rulers?"

  **5. Human Scaffolding and AGI**
  "If we apply this to us, human performance collapses without language, literacy, sleep, and other people. By your metric, human intelligence is mostly institutional scaffolding. If you bite that bullet, what happens to the AGI research target? Are we trying to build a standalone mind, or are we trying to build a new set of crutches? Because those seem like very different engineering projects."
  *   **Follow-up:** "If AGI needs the crutches to be intelligent, is it the software that's smart, or is it the software-plus-environment? And does it matter?"

  **6. Psychometrics and the g-Factor**
  "In human psychometrics, people who do well on one cognitive test tend to do well on others—the positive manifold. Does your account *predict* that? If intelligence is just a family of separate degradation curves, why should a system that degrades slowly on math tasks also degrade slowly on verbal tasks? Or is the correlation just a contingent fact about human brains that your theory doesn't need to explain?"
  *   **Follow-up:** "If your theory doesn't predict the positive manifold, does that mean it can't explain why human intelligence looks like a single number in most contexts?"

  **7. The Chinese Room Variation**
  "Imagine a system that has no internal understanding—it's a giant lookup table—but it's been engineered to degrade very gracefully as you remove inputs. It gives 'plausible' wrong answers rather than crashing. On your view, is that intelligent? If yes, does that mean intelligence is purely behavioral resilience? If no, where does the 'understanding' requirement enter the degradation calculus?"
  *   **Follow-up:** "If a system can fake resilience without understanding, is 'area under the curve' just a measure of how well a system can bluff?"

  **8. The Audit Problem**
  "Practically, if we start auditing AI systems using degradation curves, labs will just train their models to be robust against *those specific* degradations. We'll get systems that are good at losing crutches we test for, but brittle everywhere else. How do you run a degradation audit without the system just overfitting to the audit itself?"
  *   **Follow-up:** "Is there a 'blind' version of the test, or is Goodhart's Law inevitable here?"

  **9. Intelligence Explosions**
  "People worry about an intelligence explosion—a system improving itself recursively. But if intelligence is resistance to losing supports, self-improvement looks like *adding* supports or internalizing them. Is an 'explosion' even coherent on your view? Or does a smarter system just look like one that has successfully glued more crutches to its own skeleton?"
  *   **Follow-up:** "If intelligence is about needing fewer crutches, but self-improvement requires more computational structure, are those goals in tension?"

  **10. Falsification**
  "Last one. What empirical result would make you abandon the Crutch Curve? Do you need to see a system with a flat degradation profile that we still refuse to call intelligent? Or a system that falls apart instantly but relearns a new regime faster than any human? Give me the concrete case that kills the theory."
  *   **Follow-up:** "And if we find that case tomorrow, what's the backup theory?"
