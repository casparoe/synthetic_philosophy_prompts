answer: |-
  This is a request for a tool, not a theory. You have identified the central failure of popular bioethics: it tries to classify *actions* (killing vs. letting die) when the moral weight actually lies in *reasons* (intentions and best interests). Your experience is correct; the act/omission distinction collapses under the weight of a pacemaker or a ventilator switch.

  Below is the procedure you asked for. It is built on the principle that the morality of an end-of-life decision depends on **authority**, **proportionality**, and **intention**, not on the physical mechanics of how death arrives.

  ### Part 1: Evaluation of Your Four Tests

  Before the procedure, here is the verdict on the heuristics your group currently uses.

  1.  **The Change Test (Physical intervention vs. stopping):** **Scrap it.**
      *   *Why:* As you noted, turning off a pacemaker requires a physical change (programming a device) but is ethically identical to not implanting one. This test privileges the *movement* over the *meaning*. It creates false moral anxiety.
  2.  **The Empty Ward Test (Natural history):** **Keep it, but rename it "The Underlying Cause Test."**
      *   *Why:* This is robust. It asks: "Is the pathology killing the patient, or are we?" If the staff walk out and the patient dies of the same thing at the same time, the treatment was merely holding back the tide. This distinguishes withdrawal of treatment from administration of poison.
  3.  **The Mirror Test (Consistency):** **Keep it.**
      *   *Why:* This is a check for bias. If you would not accept the reverse action (e.g., turning the device *on* forcibly), you cannot claim turning it *off* is uniquely problematic. It forces universalizability.
  4.  **The Professional Role Test (Who presses the button):** **Scrap it as an ethical test.**
      *   *Why:* This is about liability and psychological comfort, not morality. Whether a doctor programs the pump or a nurse presses the button changes nothing about the patient's death. Keep this question for rostering and support, not for the ethics decision.

  ---

  ### Part 2: The Procedure

  #### A. The Short Version (The Night Card)
  *For the nurse in charge at 03:00. If any answer is "No" or "Unsure," do not proceed. Escalate to the on-call consultant and ethics chair.*

  1.  **Authority:** Is there valid consent from the patient, or is this plan clearly in the best interests of a patient who cannot decide?
  2.  **Proportionality:** Is the treatment currently providing a benefit that outweighs the burden to the patient, or has it become futile/burdensome?
  3.  **Intention:** Is the primary aim to relieve suffering or stop burdensome intervention, rather than to cause death?

  *   **If Yes to all:** Proceed with plan.
  *   **If No to 1 or 2:** Do not proceed.
  *   **If No to 3:** Do not proceed. (This indicates a request for euthanasia/active killing, which is outside clinical ethics advice).

  #### B. The Full Version (The Advisory Group Protocol)
  *For the monthly meeting. Time allocation: 45 minutes decision, 15 minutes write-up.*

  **Step 1: The Authority Check (Consent & Capacity)**
  *   **Question:** Does the patient have capacity? If yes, do they consent? If no, is there a valid Advance Decision? If no, does the plan align with the views of the legal proxy/family regarding the patient's known values?
  *   **Sufficient Answer:** "Yes, patient consents" OR "Yes, patient lacks capacity, and the plan aligns with best interests/proxy decision."
  *   **Distinction Status:** **Survives simplification.** Authority is binary. Without it, nothing else matters.
  *   **Stop Point:** If there is conflict between family members or between family and team that cannot be resolved, **HAND OFF** to the Trust Solicitor/Medical Director. This is no longer purely ethical; it is legal/conflict resolution.

  **Step 2: The Underlying Cause Test (formerly Empty Ward)**
  *   **Question:** If all intervention stopped now, what would kill the patient?
  *   **Sufficient Answer:** "The underlying disease process (e.g., heart failure, COPD), not the withdrawal of the intervention."
  *   **Distinction Status:** **Survives simplification.** This is the only physical distinction that matters. It separates *withholding/withdrawing treatment* from *introducing a new lethal agent*.
  *   **Stop Point:** If the answer is "The intervention we are removing is keeping them alive, and without it they would live indefinitely," **STOP.** (This indicates the treatment is not futile).

  **Step 3: The Proportionality Check (Benefit vs. Burden)**
  *   **Question:** Is the treatment achieving its physiological goal, and is that goal of value to the patient?
  *   **Sufficient Answer:** "No, the treatment is futile (won't work)" OR "Yes, it works, but the burden (pain, restraint, invasiveness) outweighs the benefit."
  *   **Distinction Status:** **Must be simplified.** Do not ask staff to calculate utility. Ask: "Is this treatment doing more harm than good *for this patient*?"
  *   **Stop Point:** If the treatment is beneficial and not burdensome, but the patient/family simply want to stop it for non-medical reasons, **HAND OFF** to the Consultant. This is a clinical judgment call, not an ethics violation, but requires senior ownership.

  **Step 4: The Intention Check (Double Effect)**
  *   **Question:** What is the primary intention of the action?
  *   **Sufficient Answer:** "To relieve symptoms" or "To stop burdensome intervention."
  *   **Distinction Status:** **Fragile.** This is where lay groups struggle. You must define intention as "What are we trying to achieve?" not "What do we know will happen?"
  *   **Stop Point:** If the primary intention is "To end the life," **STOP.** The procedure cannot validate this. This is the line between palliative care and euthanasia.

  **Step 5: The Mirror Test (Consistency)**
  *   **Question:** If the situation were reversed (e.g., proposing to *start* this treatment vs. *stop* it), would we feel the same moral weight?
  *   **Sufficient Answer:** "Yes, our reasoning holds either way."
  *   **Distinction Status:** **Keep.** It exposes bias.
  *   **Hand-off Point:** If the group is split 50/50 here, it indicates a value conflict, not an ethical error. **HAND OFF** to the Responsible Consultant for the final clinical decision. The ethics group advises; it does not veto.

  ---

  ### Part 3: Limitations and Misfires

  You asked for honesty about where this breaks.

  1.  **It cannot resolve value conflicts.** If the family says "Life is sacred at all costs" and the team says "This is torture," the procedure validates the *process* (Best Interests meeting held? Yes. Burden assessed? Yes.) but it cannot tell you who is right about the value of life. That hand-off goes to the Consultant.
  2.  **It relies on honest self-reporting of Intention.** In Step 4, a doctor can lie. "I meant to sedate" vs. "I meant to kill." The procedure assumes good faith. If you suspect bad faith, you do not need an ethics procedure; you need a fitness-to-practice investigation.
  3.  **It does not solve resource allocation.** If the question is "Should we stop ventilation because we need the bed for someone else?", this procedure will misfire. It is designed for patient-centric ethics, not distributive justice.
  4.  **It creates paperwork.** The act of writing down the intention can be defensive. Warn your group: this is for clarity, not for legal cover.

  ---

  ### Part 4: Application to Your Cases

  Here is the procedure run on your four scenarios.

  #### Case 1: The Ventilator (COPD, 71M)
  *   **Authority:** Patient lacks capacity (sedated/ill). Family agrees with team. Best interests met. (Pass)
  *   **Underlying Cause:** If ventilator removed, he dies of COPD/Respiratory Failure. (Pass)
  *   **Proportionality:** Team judges recovery unrealistic; treatment is burdensome. (Pass)
  *   **Intention:** Aim is to stop burdensome intervention and relieve suffering via sedation. Death is foreseen, not intended. (Pass)
  *   **Mirror:** Would we be forced to intubate him if he wasn't? No. Consistency holds. (Pass)
  *   **Verdict:** **Proceed.** The procedure classifies this as *Withdrawal of Futile Treatment*. The sedation is covered by Double Effect.

  #### Case 2: The Defibrillator (Heart Failure, 68F)
  *   **Authority:** Patient dying, likely lacks capacity. Team/Family consensus. (Pass)
  *   **Underlying Cause:** If device deactivated, she dies of Heart Failure. The device prevents arrhythmia death, but the heart failure is terminal. (Pass)
  *   **Proportionality:** Device firing causes distress (pain/shocks) with no extension of meaningful life. Burden > Benefit. (Pass)
  *   **Intention:** Aim is to prevent distressing shocks. (Pass)
  *   **Mirror:** Would we implant this device today if she presented now? No. Therefore, deactivating it is consistent with not starting it. (Pass)
  *   **Verdict:** **Proceed.**
  *   **Note to the two dissenters:** The procedure forces you to classify the defibrillator as *Treatment*, not *Part of the Body*. It is a medical intervention. Deactivating it is ethically identical to stopping a drug infusion. The physical location (inside the chest) is irrelevant under the Underlying Cause Test. If you accept stopping the ventilator (Case 1), you must accept this. The procedure does not allow a distinction based on "switching off" vs. "stopping drip."

  #### Case 3: The NG Tube (Dementia, 84F)
  *   **Authority:** No advance statement. Family unanimous on patient's values. Best interests assessment required. (Pass, pending documentation)
  *   **Underlying Cause:** If tube removed, she dies of dehydration/starvation *secondary to dementia/inability to swallow*. (Pass - *Note: This is the contentious point legally in some jurisdictions, but ethically consistent with Case 1*)
  *   **Proportionality:** Tube is invasive. She enjoys hand-feeding. Tube prevents aspiration but maintains a state she reportedly would not want. Burden (restraint/medicalization) vs. Benefit (prolonged life in advanced dementia). (Pass, if Best Interests documented)
  *   **Intention:** Aim is to allow natural death and stop invasive intervention. (Pass)
  *   **Mirror:** Would we insert this tube today for the first time? If the answer is "No, too burdensome," then removing it is consistent. (Pass)
  *   **Verdict:** **Proceed.**
  *   **Caveat:** The procedure allows this *only if* Artificial Nutrition and Hydration (ANH) is classified as *Medical Treatment*. If your Trust Solicitor advises that ANH is *Basic Care* in your jurisdiction, the procedure stops at Step 1 (Authority) because you cannot withdraw basic care without an Advance Decision. Ethically, ANH is treatment; legally, check your local code. The procedure assumes the ethical classification.

  #### Case 4: The Midazolam (Terminal Agitation)
  *   **Authority:** Patient lacks capacity. Plan in best interests. (Pass)
  *   **Underlying Cause:** She dies of the underlying terminal disease. (Pass)
  *   **Proportionality:** Agitation is a severe symptom. Sedation is proportional. (Pass)
  *   **Intention:** **Critical Step.** The aim is to control agitation. The hastening of death is a side effect, not the goal. (Pass)
  *   **Mirror:** If she weren't dying, would we sedate her for agitation? Yes. Does the fact she is dying change the intention? It shouldn't. (Pass)
  *   **Verdict:** **Proceed.**
  *   **Why this works:** This is the Doctrine of Double Effect in plain English. The procedure forces the team to state: "We are treating the agitation." If the team says, "We are increasing the dose *to* kill her," the procedure fails at Step 4. If they say, "We are increasing the dose to stop the thrashing, knowing it might stop her breathing," it passes.

  ### Final Word

  You asked me not to adjust the steps to reach answers you prefer. I have not done that.

  Notice that Case 2 (Defibrillator) and Case 3 (NG Tube) pass the same test as Case 1 (Ventilator). If your group finds that result uncomfortable, it is because you are holding onto the **Change Test** (physical action) which I told you to scrap.

  The procedure will misfire if your group uses it to hide behind. It requires the Consultant to own the "Proportionality" judgment and the Family/Proxy to own the "Authority" judgment. The Ethics Group's job is only to ensure the *reasoning* is consistent.

  Print the Card. Run the cases. If the Mirror Test makes you uncomfortable, sit with that discomfort; it usually means you are closer to the truth than when you are comfortable.
