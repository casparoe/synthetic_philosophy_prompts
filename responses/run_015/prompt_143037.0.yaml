answer: |-
  **Spine & Dependencies**
  1.  **Sympathy as Mechanism (0–10 mins):** Establish sympathy as imaginative projection, not emotional contagion. *Reason:* This prevents the "compassion" error and is logically prior to propriety; one cannot judge proportionality without a mechanism for accessing another's feeling.
  2.  **Propriety via Mismatch (10–25 mins):** Generate propriety from cases where actual spectators cannot enter the agent's passion. *Reason:* Students must experience the insufficiency of actual approval before accepting the Impartial Spectator as necessary.
  3.  **Impartial Spectator as Corrective (25–35 mins):** Move from actual to impartial here. *Reason:* Impartiality must appear as the solution to actual bias/ignorance, not as an abstract axiom smuggled in.
  4.  **Internalization (35–50 mins):** Anchor the **Fixed-Point** reading. Demote the Surrogate reading to "raw material." *Reason:* Starting with Surrogate validates the sociology misconception (conscience = internalized approval). Fixed-Point makes it moral (conscience = corrected approval). Defuse the calibration worry here: the *activity* of correcting partiality constitutes morality, regardless of the partial origin of the raw data.

  **Verdict Split**
  Do not split propriety and merit. Part II is unread; introducing merit (worthiness of the object) confuses the mechanism of propriety (proportionality to cause). Stick strictly to proportionality to secure the machinery first.

  **The Example**
  Use **disproportionate anger over a minor slight** (e.g., a colleague screaming because you were ten seconds late).
  *   **Must:** Allow bystanders to sympathize with the agent due to friendship (bias), contrasting with the impartial view. It must show passion exceeds cause (propriety), not wrong target (merit).
  *   **Must Not:** Involve death (triggers pity/compassion confusion). Involve clear rule-breaking like theft (triggers deontological rules). Settle via rule (must remain context-dependent).
  *   **Why:** It isolates propriety from merit and actual approval from impartial approval without relying on external moral rules.

  **Misconceptions & Timing**
  1.  **Sympathy=Compassion/Altruism:** Head off at minute 5. Define strictly as "changing places in fancy."
  2.  **Spectator=Sociology:** Address at minute 35. Emphasize the *correction* of social views, not mere adoption.
  3.  **Impartial=Universal Law:** Address at minute 25. It is contextual distance, not Kantian abstraction.
  4.  **Relativism:** Do not engage deeply; it requires Part V (Custom) which they haven't read.

  **Omissions**
  State explicitly: "We are excluding Merit/Demerit (Part II) and Custom/Fashion (Part V). Today concerns the *mechanism* of judgment, not the content of virtue or historical variability."

  **Closing Question**
  "If your entire community approved of your rage, what resource does Smith give you to condemn it yourself?"
  *Reason:* Tests the Fixed-Point/Impartial machinery, not just vocabulary. It forces them to articulate the divergence between actual and impartial spectators.
