          *   *Copyright with Strict Liability:* Disaster. Subconscious copying. "Cryptomnesia." Newton/Leibniz: One sues the other. Calculus becomes proprietary. Science halts.
      *   *Refining the Newton/Leibniz application:* In current law, scientific discoveries aren't patentable (laws of nature). But if they were: Patent rule = First to file gets calculus. Copyright rule = Both own their manuscripts.
      *   *Deep Dive on "In the Air":* If discoveries are inevitable, patent law rewards luck/timing. Copyright rewards labor regardless of timing.

