  6.  **Final Polish:** (Self-Correction during drafting) *Make sure not to get bogged down in specific statutes. Keep it theoretical. Ensure the distinction between "idea" and "expression" is clear but critiqued.* *Wait, the prompt asks about Newton/Leibniz specifically regarding the rules.* I need to make sure I apply the counterfactuals to them specifically.

      *   *Current status:* Scientific discoveries are not patentable or copyrightable (facts/ideas). But the prompt asks to consider the *logic* of the regimes applied to these cases.
      *   *Correction:* I should treat the *calculus* as if it were a patentable invention or copyrightable work for the sake of the thought experiment, or discuss how the *logic* applies to their priority disputes. The prompt implies applying the *regimes' logic* to these cases. I will treat the "calculus" as the subject matter to test the theories.

  7.  **Final Output Generation** (Proceeding to write the response based on these thoughts).
answer: |-
  The asymmetry between copyright and patent law regarding independent creation is one of the most striking features of intellectual property jurisprudence. In copyright, independent creation is a shield; in patent, it is irrelevant. To reconstruct the implicit theory behind this divergence, we must disentangle the ontological assumptions (what kind of thing is being protected) from the teleological justifications (what purpose the protection serves). While the two regimes are often presented as a coherent system of "intellectual property," a close examination reveals that they rely on distinct, and in some respects incompatible, philosophical commitments regarding the nature of human ingenuity.

  ### I. The Metaphysical Commitments: Discovery vs. Creation

  The most intuitive explanation for the asymmetry is ontological. It suggests that patent law and copyright law operate with different metaphysics of the protected object.

  **Patent Law: The Platonic Discovery**
  Patent law implicitly treats an invention as a pre-existing truth or function waiting to be found in the natural order. Under this view, the invention exists as a singular, abstract entity independent of the inventor. When Newton and Leibniz developed calculus, the patent metaphysic suggests they were both mapping the same pre-existing territory. Because the "invention" is singular, it can only be appropriated once. The first person to reduce it to practice (or file a claim) secures the rights to that abstract entity. Subsequent independent inventors are not creating something new; they are merely replicating a discovery that has already been made public. Thus, the law treats the second inventor as a copyist in effect, if not in intent, because the *object* of the right is no longer new to the world. This presupposes a realism about technical solutions: there is one best way to solve a problem, and once found, it is "known."

  **Copyright Law: The Romantic Creation**
  Copyright law, conversely, presupposes a metaphysics of expression where the work is inextricably tied to the act of its creation. It aligns with the Romantic conception of authorship, where a work is an emanation of the author's personality or labor. Even if two authors write identical poems, the *act* of writing is distinct. The value protected is not the sequence of words as an abstract truth, but the specific intellectual labor and personality invested in fixing those words. Therefore, simultaneity is metaphysically unproblematic because there are two distinct acts of creation, resulting in two distinct (though identical) objects of ownership. Originality in copyright does not mean novelty (uniqueness in the world); it means origination (causal independence from others).

  ### II. The Instrumental Commitments: Inducement vs. Misappropriation

  However, the metaphysical explanation is insufficient on its own. Law is a tool, and the asymmetry is perhaps better explained by the divergent instrumental aims of the two regimes.

  **Patent: The Quid Pro Quo**
  Patent law is explicitly utilitarian. Its goal is to promote the progress of useful arts by inducing disclosure. Inventions, particularly in fields like pharmaceuticals or heavy machinery, require massive capital investment. Without a guarantee of exclusivity, inventors would rely on trade secrecy, stifling the spread of knowledge. The "first-to-file" rule (or historically, first-to-invent) creates a clear bright line to encourage rapid disclosure. If independent invention were a defense, the value of the patent would be drastically diluted. A competitor could simply wait for the patentee to disclose the invention, reverse-engineer it (or independently "rediscover" it), and compete immediately. The monopoly is the price society pays for the blueprint. The harshness of excluding the independent inventor is a necessary cost to maintain the incentive for the *first* inventor to invest and disclose.

  **Copyright: Preventing Theft of Labor**
  Copyright's instrumental aim is often framed as preventing misappropriation of labor (the "sweat of the brow" theory, though limited in modern law) or protecting authorial personality. The harm copyright seeks to prevent is copying—the unauthorized appropriation of another's mental labor. If a defendant independently creates a work, they have not appropriated the plaintiff's labor; they have expended their own. Punishing independent creation in copyright would not prevent theft; it would merely grant a monopoly on expression without the corresponding benefit of inducing disclosure (since copyright arises automatically upon fixation, not in exchange for registration or disclosure). Furthermore, because the cost of creating expression is generally lower than inventing technology, the law does not need to offer as strong a monopoly to induce creation.

  ### III. Presupposition vs. Fit

  It is crucial to distinguish what these rules *strictly presuppose* from what they merely *fit well with*.

  Strictly speaking, patent law does not *logically require* the metaphysics of discovery. We could conceive of a system where independent invention is a defense in patent law (a "dual patent" system). This would not violate the laws of physics or logic. However, such a system would fit poorly with the economic reality of high-cost R&D. If the second inventor can compete freely, the first inventor cannot recoup costs, and the inducement to invest collapses. Thus, the "discovery" metaphysics is a justificatory narrative that fits the economic imperative, rather than a logical prerequisite.

  Similarly, copyright law does not *strictly presuppose* that expressions are created afresh. One could argue that if two works are identical, one *must* have copied the other (statistically speaking, for complex works). The independent creation defense is a procedural presumption based on the difficulty of proving mental states, aligned with a moral intuition that innocent actors should not be punished. It fits well with the Romantic author theory, but the law could function under a strict liability regime if the goal were purely maximizing author revenue rather than protecting labor integrity.

  **Consistency and Incompatibility**
  Are the two sides consistent? On the surface, they appear contradictory regarding the status of "ideas." Patent law treats the functional idea as a scarce resource that can be exhausted by one person. Copyright treats the expressive idea as non-scarce, allowing multiple ownership of identical content.

  However, they are consistent in a deeper economic sense: they both calibrate protection to the **cost of creation versus the cost of copying**.
  *   In patent, the cost of creation is high, and the cost of copying (once disclosed) is relatively low. Strong protection (excluding independent inventors) is needed to bridge this gap.
  *   In copyright, the cost of creation is lower, and the cost of independent creation is roughly the same as the first author's cost. Therefore, excluding independent creators yields little social benefit but high cultural cost.

  The incompatibility arises only if one insists on a unified theory of "Intellectual Property" as a natural right. If IP is a natural right of the mind, it is inconsistent to say the mind owns its identical calculus in one domain but not the other. But if IP is a statutory privilege designed to optimize production, the asymmetry is a coherent response to different economic environments.

  ### IV. The Counterfactual: Swapping the Rules

  What would happen if we reversed the asymmetry?

  **Scenario A: Independent Invention as a Defense in Patent Law**
  If patent law adopted the copyright rule, the "monopoly" would become a mere right against copying.
  *   **Consequences:** The value of patents would plummet. In industries with high reverse-engineering potential (software, mechanics), competitors would simply "clean room" design around the patent or claim independent discovery. The incentive to disclose would vanish; inventors would revert to trade secrecy.
  *   **Newton/Leibniz:** If calculus were patentable under this rule, both Newton and Leibniz could hold rights. They could both publish and teach their methods. The spread of mathematical knowledge would be faster (no one is enjoined from using the math). However, neither might have invested the time if they knew they couldn't exclude the other from commercializing applications of the calculus. The "priority dispute" becomes a shared credit scenario, reducing the frantic race to publish.

  **Scenario B: Strict Liability in Copyright (No Independent Creation Defense)**
  If copyright adopted the patent rule, creating an identical work would be infringement regardless of intent or independence.
  *   **Consequences:** This would be culturally catastrophic. Because all creators are influenced by the "air" of culture, identical tropes, melodies, or phrases inevitably recur. A strict liability regime would turn copyright into a lottery where the first to file owns a "type" of expression. It would create a chilling effect, where artists avoid certain themes or structures for fear of accidental infringement. It would require a registry system (like patent) to know what is owned, destroying the automatic nature of copyright.
  *   **Newton/Leibniz:** If their manuscripts were copyrighted under this rule, the first to publish (say, Newton) would own the *expression* of the calculus. Leibniz, even if he derived his notation independently, would be an infringer if his notation was substantially similar. The development of mathematics would be proprietary. Leibniz might be enjoined from publishing his papers. Science would slow down as researchers feared litigation over overlapping derivations.

  ### V. Conclusion

  The asymmetry between patent and copyright regarding simultaneous invention is not an accident, nor is it grounded in a single, unified metaphysics of the mind. It is a pragmatic bifurcation. Patent law adopts a metaphysics of **discovery** to support an instrumental goal of **disclosure and capital recovery**. It treats the invention as a singular resource to be claimed, because the economic stakes of high-cost innovation require a winner-take-all incentive. Copyright law adopts a metaphysics of **creation** to support an instrumental goal of **cultural proliferation and labor protection**. It treats the work as a pluralistic emanation of personality, because the cost of policing independent expression outweighs the benefit of granting monopolies on culture.

  To swap the rules would be to misunderstand the economic and ontological distinctness of the domains. Applying the copyright rule to patents would starve innovation of capital; applying the patent rule to copyright would starve culture of freedom. The Newton-Leibniz and Darwin-Wallace cases illustrate that while discovery may be "in the air," the legal response to that simultaneity must depend on whether we wish to incentivize the *unveiling* of a secret (patent) or the *proliferation* of a voice (copyright). The current asymmetry, therefore, presupposes not a consistent theory of intellect, but a consistent theory of **incentive calibration**.
