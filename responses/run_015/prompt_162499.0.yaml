          *   Instrumental view: Is it about inducement/disclosure (patent) vs. misappropriation/personality (copyright)?
          *   Distinction: What does the asymmetry *strictly presuppose* vs. what does it merely *fit well with*?
          *   Consistency: Are the two sides consistent or do they rely on incompatible theories?
          *   Counterfactual: What if we swapped the rules? (Independent invention defense in patent; strict liability for independent creation in copyright). What would change/follow for Newton-Leibniz/Darwin-Wallace cases?

  2.  **Initial Brainstorming & Structuring:**

      *   *Introduction:* Define the asymmetry clearly. State the thesis (it's a mix of metaphysical assumptions about the object of protection and instrumental goals, but they aren't fully compatible).
      *   *Section 1: The Metaphysical Commitments (Ontology of the Object).*
          *   Patent: Invention as a "truth" or "function" existing in nature waiting to be found. Singular.
          *   Copyright: Work as an "expression" of personality. Plural. Even if identical, the *act* of creation is distinct.
      *   *Section 2: The Instrumental Commitments (Teleology of the Law).*
          *   Patent: Quid pro quo. Monopoly for disclosure. Need clear boundaries to encourage investment.
          *   Copyright: Reward labor/personality. Prevent copying (theft of mind), not coincidental similarity.
      *   *Section 3: Presupposition vs. Fit.*
          *   Does patent law *require* the metaphysical view? Or does it just work better with it?
          *   Does copyright *require* the romantic author view?
          *   Argument: The law doesn't strictly *presuppose* the metaphysics (it could be otherwise), but the metaphysics justifies the instrumental aims.
      *   *Section 4: Consistency/Compatibility.*
          *   Are they incompatible? They seem to treat "ideas" differently. Patent protects the idea/function; Copyright protects the expression.
          *   Tension: If an idea is "in the air" (simultaneous invention), why reward only one in patent but allow both in copyright?
          *   Resolution: The distinction lies in the *cost of creation* vs. *cost of copying*.
      *   *Section 5: The Counterfactual (Swapping Rules).*
          *   Scenario A: Independent Invention Defense in Patent. (Chaos for pharma/hardware, good for software?).
          *   Scenario B: Strict Liability in Copyright. (Chilling effect on culture, impossible enforcement).
          *   Impact on Newton/Leibniz & Darwin/Wallace.
      *   *Conclusion:* Summarize the tension. The asymmetry reflects a pragmatic balance between ontological views and economic incentives, not a unified theory of intellect.

  3.  **Drafting - Section by Section (Iterative refinement):**

      *   *Intro:* Start with the Newton/Leibniz example. It highlights the "inevitability" thesis. State the legal divergence clearly.
      *   *Metaphysics:* Focus on "Discovery" vs. "Creation." Patent law treats the invention as pre-existing (Platonic form?). If it's pre-existing, the first finder gets it. Copyright treats the work as emanating from the author (Romantic genius). Two geniuses can emit the same light independently.
      *   *Instrumentalism:* Patent = Utilitarian. Monopoly is a necessary evil to get the secret revealed. If you don't give the monopoly to the first, they won't reveal. If you give it to the second, the first is punished for revealing. Copyright = Natural Rights/Personality + Utilitarian. Copying is the harm. Independent creation causes no harm to the first author's market *in terms of theft*, though it does in terms of competition.
      *   *Presupposition vs. Fit:* This is crucial. Does patent law *logically require* the invention to be singular? No. We *could* grant dual patents. But it *fits* the "race to the truth" narrative. Does copyright *logically require* independent creation defense? No. We *could* have strict liability. But it *fits* the "don't punish innocence" narrative.
      *   *Consistency:* They are arguably inconsistent regarding the nature of "ideas." Patent says ideas (embodied) are scarce. Copyright says expressions are non-scarce (in terms of origination). However, they are consistent in protecting *investment* vs. *labor*.
      *   *Counterfactuals:*
