      *   *A Priori vs. A Posteriori:* Hume is an empiricist. Purely *a priori* arguments about matters of fact are suspect in his system. However, the *structure* of probabilistic reasoning is formal. The *content* (uniformity of experience) is empirical. So the distinction might be too sharp.

