      *   *Re-evaluating Step 3:* Step 3 says "For Margalit's duty to actually survive... people have to find it psychologically sustainable." This assumes Margalit cares about *survival* as a condition of *validity*. He doesn't. He cares about *validity*. So Step 3 smuggles in a pragmatist criterion that Margalit rejects.
