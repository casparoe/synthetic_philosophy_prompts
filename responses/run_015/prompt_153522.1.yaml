answer: |-
  This is a sophisticated argument, and your friend has constructed a very tight *reductio ad absurdum*. It feels compelling because it pits **Normative Ethics** (Margalit: what we *ought* to do) against **Sociological Description** (Rieff: what we *actually* do).

  The slip is in **Step (4)**, though **Step (3)** is doing a lot of heavy lifting to make Step (4) look plausible.

  Here is the breakdown of why the argument fails, why it looks convincing, and the costs of the different ways out.

  ### The Logical Slip: Step (4)

  **Step (4) claims:** *If the duty's survival depends on present consequences, then it's not genuinely non-instrumental; it's actually justified by those consequences.*

  **Why this is wrong:** This step commits a category error by conflating the **conditions of viability** (sociology) with the **grounds of validity** (ethics).

  *   **Validity:** Why the duty exists (Margalit: because the victims deserve acknowledgment).
  *   **Viability:** What it takes for the duty to persist in history (Rieff: psychological sustainability).

  Just because a moral practice requires certain conditions to *survive* does not mean those conditions are the *reason* for the practice.
  *   **Analogy:** Consider the duty not to torture prisoners. In a "therapeutic culture" (or a utilitarian one), this duty might only survive if people believe it causes social cohesion or prevents trauma in soldiers (present consequences). However, the *justification* for the duty remains deontological (human rights). The fact that it *needs* social support to persist doesn't turn the right itself into an instrumental tool.

  **Why it looked okay:** It relies on a pragmatic intuition: "If you can't do it without a reward, you're really just doing it for the reward." This is a version of the **Genetic Fallacy**. It assumes that because the *cause* of the memory's persistence is psychological payoff, the *meaning* of the memory is psychological payoff. Margalit would argue that the *source* of the obligation is the past relationship, even if the *fuel* keeping it alive is present-day community cohesion.

  ### The Empirical Slip: Step (3)

  **Step (3) claims:** *For Margalit's duty to actually survive in a modern society, people have to find it psychologically sustainable.*

  **Why this is contestable:** This assumes Rieff's description of modernity is totalizing. It assumes there is *no* room for non-therapeutic motivation in modernity. Margalit argues that "communities of memory" can sustain obligations through **ritual, habit, and thick relations**, even when they are psychologically burdensome. Step (3) assumes individuals must *feel* good about remembering for it to continue, whereas Margalit argues they might continue out of **loyalty** or **shame**, which are not "therapeutic payoffs."

  ---

  ### The Costs of the Options

  You asked what each philosopher has to give up if you reject specific steps. Here is the price tag for each move.

  #### Option A: Reject Step (3) (Defending Margalit)
  *   **The Move:** You argue that memory *can* survive in modernity without being therapeutic. It survives through institutions, rituals, and "thick relations" that bind people even when it hurts.
  *   **What Margalit pays:** He has to admit that this duty is **fragile and exclusive**. If memory doesn't rely on universal psychological payoff, it can only be sustained by specific groups (religious communities, nations, families) who value "thick relations." This makes the duty **particularistic**. It risks becoming an ethic only for the "moral saints" or specific tribes, rather than a universal human duty.
  *   **What Rieff pays:** He has to admit his diagnosis of "Therapeutic Man" is incomplete. He must acknowledge that modern institutions can generate non-therapeutic motivations (e.g., bureaucratic duty, legal obligation) that override individual psychological needs.

  #### Option B: Reject Step (4) (The Logical Distinction)
  *   **The Move:** You maintain the distinction between *Ought* and *Can*. You argue that a duty can be unconditional (non-instrumental) even if it is sociologically unsustainable.
  *   **The Cost:** This leads to a **Tragic Ethics**. You are left saying: "We have an unconditional duty to remember, but modern society makes it impossible to fulfill." This preserves Margalit's moral framework but renders it politically impotent. It turns the ethics of memory into a form of mourning for the ethics itself. It accepts that we are morally failing, rather than fixing the theory.
  *   **Benefit:** It saves the normative truth of Margalit's claim. Just because we fail to tell the truth doesn't mean truth-telling is instrumental.

  #### Option C: Bite the Bullet on (6) & (7) (Accepting the Contradiction)
  *   **The Move:** You agree that an unconditional duty is impossible in modern conditions.
  *   **The Cost:** You essentially surrender to Rieff. Ethics becomes entirely subordinate to sociology. If a duty cannot be sustained by present conditions, it ceases to be a duty. This leads to **Moral Presentism**. We lose the ability to criticize the present for forgetting the past, because the "duty" to remember is revealed as an illusion that couldn't survive the therapeutic test. This is a high price for an ethics seminar!

  ---

  ### The "Mnemonic Division of Labor" Objection

  Your friend's objection to the division of labor ("Institutions are run by individuals") is a classic case of **Methodological Individualism**. It sounds smart, but it misses how institutions work.

  **Why it helps Margalit:**
  Margalit explicitly relies on the idea that **institutions have memory distinct from individual psychology.**
  1.  **Archives and Law:** A state archive remembers a crime even if every individual working there is a "therapeutic individual" who wants to move on. The *structure* forces the memory to persist.
  2.  **Ritual:** Rituals (memorial days, minutes of silence) automate memory. They bypass the need for individual psychological "payoff." You show up because it's the rule/habit, not because it heals you.

  **Why your friend thinks it fails:**
  She argues that if the individuals running the institution lose the will to fund/support it, the institution dies. Therefore, the burden ultimately rests on individual psychology.

  **The Counter-Counter Argument:**
  This ignores **path dependence** and **inertia**. Institutions often continue doing things long after the individuals involved have lost the psychological motivation. Bureaucracies remember things simply because "that's how it's done." This creates a buffer zone where memory can survive *without* requiring every individual to derive a therapeutic payoff. This breaks Rieff's link between individual psychology and cultural survival.

  ### Summary for your Seminar

  1.  **Attack Step (4):** Argue that the *sustainability* of a practice is not the *justification* for it. (Validity vs. Viability).
  2.  **Nuance Step (3):** Argue that "psychological sustainability" is too narrow. Loyalty, guilt, and habit are not "therapeutic payoffs," yet they sustain memory.
  3.  **Use the Division of Labor:** Argue that institutions create a "scaffolding" for memory that protects it from the fluctuations of individual therapeutic needs.

  Your friend's argument proves that Margalit's ethics is **sociologically difficult**, not that it is **logically contradictory**. That is a much weaker claim, and it leaves Margalit's framework standing.
