      *   **The Argument Steps:** 7 steps leading to the conclusion that an unconditional duty to remember is impossible in modern society.
      *   **The User's Goal:** Identify the flawed step (likely not (1) or (2)), explain *why* it looks plausible but is wrong, and analyze the costs of rejecting different steps (3, 4, or accepting 6/7).
      *   **Specific Sub-question:** Evaluate the "mnemonic division of labor" objection (institutions vs. individuals).

  2.  **Deconstruct the Friend's Argument:**
      *   (1) Margalit: Unconditional, non-instrumental duty to remember (thick relations, ethics of memory). *Assessment: Accurate enough.*
      *   (2) Rieff: Therapeutic culture values present psychological payoff; symbolic obligations are burdens to be released. *Assessment: Accurate enough.*
      *   (3) **Crucial Step:** For Margalit's duty to *survive*, it must be psychologically sustainable (dependent on present consequences). *Assessment: This is the likely pivot point.*
      *   (4) If survival depends on consequences, it's instrumental (contradicting Margalit).
      *   (5) If non-instrumental, it won't survive (Rieff's prediction).
      *   (6) Dilemma: Instrumental (Margalit wrong) OR Non-instrumental + Impossible (Duty fails).
      *   (7) Conclusion: No coherent unconditional duty in modern conditions.

  3.  **Identify the Flaw:**
      *   The argument conflates the *justification* of a duty with the *conditions of its sociological persistence*.
      *   Step (3) and (4) commit a category error (specifically, a version of the genetic fallacy or a confusion between normative validity and sociological feasibility).
      *   *Margalit's Claim:* "You *ought* to remember because X (ethical reason)."
      *   *Rieff's Claim:* "Society *will not* remember because Y (sociological/psychological trend)."
      *   *The Friend's Error:* Arguing that because society *won't* do it without a payoff, the *ought* itself becomes instrumental.
      *   *Analogy:* "You ought to tell the truth." (Kant). "Modern society finds lying more convenient." Does the convenience of lying make truth-telling instrumental? No. It just makes truth-telling hard.
      *   *Step (4) is the real logical slip.* Just because the *persistence* of a practice relies on certain conditions doesn't mean the *normative justification* for that practice relies on those conditions.
      *   *Step (3) is also suspect.* Does the duty's survival *require* psychological sustainability? Margalit might argue the duty survives *despite* psychological cost, carried by a remnant community or institutions.

  4.  **Evaluate the "Mnemonic Division of Labor":**
      *   Friend's objection: Institutions are run by individuals, so the psychological burden just shifts.
      *   Counter-argument: Institutions operate on different logics than individual psychology. Bureaucracies, rituals, and archives can sustain memory *without* requiring every individual to feel the emotional weight constantly. This challenges Rieff's focus on individual "psychological payoff."
      *   Does it push the problem back? Only if Rieff is right that *all* social structures are ultimately reducible to individual therapeutic needs. Margalit (and Halbwachs) would argue collective memory has a sui generis status.

  5.  **Drafting the Response:**

      *   **Introduction:** Validate the friend's argument (it's sophisticated) but pinpoint the logical slip.
      *   **Identifying the Bad Step:** It's primarily **Step (4)**, supported by a questionable reading in **Step (3)**.
          *   *Why it looks okay:* It conflates *sociological feasibility* with *normative justification*. It assumes that if something needs support to exist, that support is its *reason* for existing.
          *   *The Correction:* Distinguish between the *Grounds of Obligation* (Margalit) and the *Conditions of Possibility* (Rieff).
      *   **Analyzing the Costs (The "What If" Scenarios):**
          *   *Rejecting (3) (Margalit's route):* Margalit must admit memory is hard/expensive. He leans on "thick relations" and communities of memory. Cost: Elitism/Exclusivity. Only some groups can sustain this.
          *   *Rejecting (4) (The Logical route):* Maintain the distinction between "ought" and "can." Cost: Margalit's ethics becomes a "tragic" ethics (you should do it, even if society fails). It risks becoming utopian.
          *   *Accepting (6)/(7) (The Nihilist route):* Memory ethics is dead. Cost: We lose the ability to criticize presentism. Rieff wins, but we lose moral traction.
      *   **Addressing "Mnemonic Division of Labor":**
          *   Explain why the friend's objection is too reductive. Institutions have "institutional memory" distinct from individual psychology (archives, laws, rituals).
          *   This saves Margalit from Rieff's individualism.
      *   **Conclusion:** Summarize the strategic move for the seminar.

  6.  **Refining the Philosophy:**
      *   *Margalit:* Focus on *The Ethics of Memory*. Key concept: "Thick relations" vs. "Thin relations." Duty stems from shared history/identity, not utility.
      *   *Rieff:* Focus on *The Triumph of the Therapeutic*. Key concept: "Psychological man." Culture as a system of motives.
      *   *The Conflict:* Normative Ethics vs. Sociology of Knowledge/Culture.
      *   *The specific error:* The "Is-Ought" gap. Just because a duty *cannot be sustained* (Is) doesn't mean it *isn't a duty* (Ought), nor does it mean the duty *becomes* instrumental.

