      *   But Step (4) is the logical non-sequitur. Even if (3) is true (it needs payoff to survive), it doesn't follow that the *duty itself* is justified by the payoff.
      *   *Decision:* Pin it on (4) as the logical fallacy, but acknowledge (3) is where the sociological battle is fought.
      *   *Mnemonic Division of Labor:* This is actually a strong Margalit counter-move. He talks about "communities of memory." The friend's objection (institutions are individuals) is a methodological individualism trap. I need to explain why collective intentionality matters.

  8.  **Final Polish:** Ensure tone is helpful for a seminar student (academic but accessible). Structure clearly with headings. (Proceed to generate output based on this thought process).

