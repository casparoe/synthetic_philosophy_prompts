prompt: |-
  hey im in this enviro history seminar and we just got assigned an adversarial collaboration for our group project. me and my partner are on opposite sides of the Anthropocene debate — like, when did it actually start and who gets to deciede that its a real epoch. i want the joint statement drafted between the stratigraphic formalists (they want a global stratigraphic marker in the mid-20th century and say only bodies like the ICS can authorize it) and the polycentric pluralists (they say the start date is context-dependent, the concept is mainly historical/political, and indigenous land-management scholars should have a formal veto over any formalization). 

  please draft the document we should both sign. i need:
  1. a numbered section of agreed claims — about earth-system changes, about what actually needs explaining, about the limits of current stratigraphic data, and about whether indigenous knowledge is currently underrepresented in the process
  2. a disagreements table with each camps position in wording theyd accept — especially on whether a single global signal is necessary and on who holds decision authority
  3. the cruxes — i think one is whether stratigraphic uniformity is a prerequisite for epoch status, and another is if non-geologists should have binding input
  4. for each crux, a concrete case or piece of evidence both sides agree is relevant, with each sides prediction written out in advance
  5. also flag if any disagreement is mostly verbal and say why

  dont include a bibliography or reading list — my partner doesnt have web access and the prof said no citations. keep it in the weeds but not so niche that a small llm wouldnt have seen the basic anthropocene arguments.
