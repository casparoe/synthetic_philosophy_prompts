      *   **Correlation Verdict:** This is arguably more robust. It explains *why* Landauer applies without needing to model the memory hardware. The Second Law is saved because the mutual information must be dissipated to close the cycle.
      *   **The "Exorcism":** Who actually exorcises the demon?
