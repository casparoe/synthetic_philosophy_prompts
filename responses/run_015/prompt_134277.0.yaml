      *   **Szilard Engine:** The simplified model (one particle, one bit of information).
      *   **Landauer's Principle:** Erasure of information is dissipative. To reset a memory bit to a standard state, you must dump heat $Q \ge kT \ln 2$. This is the standard "resolution" (Bennett, Landauer).
      *   **Information-as-Correlation:** Information isn't a "stuff" stored in the demon; it's a mutual information between the demon and the system. Entropy is subjective/relative to the observer's knowledge (Jaynes/subjective entropy) or objective phase space volume (Gibbs/Boltzmann).
      *   **The Crystal Scenario:** This is the tricky part. If the memory states are physically degenerate (same energy, same macrostate), does writing/erasing cost energy?
          *   If the states are truly indistinguishable physically, can they store information?
          *   If they are distinguishable by the demon (orthogonal quantum states, distinct positions in phase space), they aren't truly "identical physical configurations" in the relevant sense, even if they share energy.
          *   If they are *truly* identical (same quantum state), you can't store a bit there.
          *   So, the premise needs scrutiny: "label on identical physical configurations." This implies the degeneracy is in energy, but the states must be orthogonal to be distinguishable memory states.

  3.  **Evaluate Landauer vs. Correlation in this Context:**
      *   **Landauer's View:** Focuses on the *logical irreversibility* of erasure mapping $2 \to 1$ states. If the memory has degenerate ground states, does mapping them to a single reset state cost energy?
          *   Standard derivation assumes coupling to a heat bath. To compress phase space volume (erase), you need work/heat dissipation.
          *   If the memory states are degenerate in energy but distinct in phase space (e.g., different spatial locations or spin orientations), erasing them still requires reducing the phase space volume occupied by the memory. This compression requires entropy export.
      *   **Correlation View (Mutual Information):** The total entropy of System + Demon + Bath is what matters. $S_{total} = S_{sys} + S_{dem} - I(sys:dem)$.
          *   Measurement creates correlation ($I$ increases). $S_{sys}$ might go down, but $S_{dem}$ goes up (or $I$ accounts for it).
          *   To complete the cycle, the correlation must be broken (erasure).
          *   This view is often seen as more fundamental because it doesn't rely on the specific mechanism of the memory (crystal, tape, brain), just the statistical relationships.
      *   **The Crystal Case:** If the ground state is massively degenerate, the entropy of the memory *itself* is high ($S = k \ln \Omega$).
          *   Writing a bit means selecting one subset of the degenerate manifold.
          *   Erasing means randomizing it back or forcing it to a specific subset.
          *   If the demon uses the degeneracy to store info without energy cost, does erasure still cost heat?
          *   *Key Insight:* Landauer's principle is about *phase space compression*, not necessarily energy dissipation in the memory device itself, but entropy transfer to the bath. Even if energy levels are degenerate, distinct logical states occupy distinct regions of phase space. Merging them reduces volume $\to$ entropy decrease in memory $\to$ entropy increase in bath.

