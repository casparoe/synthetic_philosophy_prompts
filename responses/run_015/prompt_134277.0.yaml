      *   **Conclusion on the Crystal:** The crystal doesn't bypass the cost. The degeneracy might lower the *energy* cost of switching, but not the *entropy* cost of erasure when coupled to a bath.

  5.  **Drafting the Response (Iterative refinement):**
      *   *Opening:* Validate the user's background. This isn't undergrad stat mech; it's foundational.
