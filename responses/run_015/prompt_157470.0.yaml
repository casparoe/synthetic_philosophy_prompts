  7.  **Self-Correction during drafting:** I initially thought about focusing heavily on the math. But the user asks for a "map of exposure" and "rationalist-style reasoning." I need to focus on the *epistemic status* of the claim. Is it a moral claim? A predictive claim? A design claim? The confusion between these is a vulnerability.
      *   *Correction:* Make sure to distinguish between KS as a *description* of fairness vs. KS as a *mechanism design target*.
      *   *Key Insight:* The "Anchoring" condition effectively *defines* the problem away. If $d$ scales with $S$, the problem is homothetic. In homothetic problems, KS and NBS often coincide or behave very similarly depending on the frontier shape. The distinct advantage of KS relies on non-homotheticity, but the anchoring condition imposes homotheticity on the disagreement point. This is a tension.

