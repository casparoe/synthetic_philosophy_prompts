      *   **The Position:** KS should be the *default normative benchmark* (not just one option) when the feasible set expands without bound. Key mechanism: Monotonicity blocks perverse scaling incentives found in NBS. Key condition: "Disagreement-point anchoring under proportional growth" (if surplus scales by $\lambda$, disagreement point scales by $\lambda$). Claim: This yields invariance to utility rescaling and robustness to outside-option manipulation. Claim: Standard criticisms miss the point because they focus on static/symmetric contexts, not dynamic/asymmetric institutional contexts.
