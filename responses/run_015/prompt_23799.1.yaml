answer: |-
  Here is a complete, committed design for your 75-minute session. This plan prioritizes the *betting tension* over a perfect phenomenological simulation of amnesia, because the betting argument is what usually convinces undergraduates of the Thirder position, while the "fair coin" intuition secures the Halfer position.

  ### The Design: "The Envelope Protocol"

  **Core Concept:** You are simulating the *frequency of experiences* vs. the *frequency of trials*. Students will not know if they are in a "one-slip" (Heads) or "two-slip" (Tails) round while they are betting. The payoff structure rewards Thirder betting, but the coin mechanics validate Halfer intuition.

  **Class Setup:**
  *   **Students:** 16 total.
  *   **Groups:** 4 groups of 4 students. (This parallelizes the data collection so you don't spend 40 minutes waiting on one coin flip).
  *   **Materials per Group:**
      *   1 Coin.
      *   20 Small Envelopes (or folded paper).
      *   20 Betting Slips (small index cards).
      *   1 "Bank" of 50 Poker Chips (or paper tokens).
      *   1 "Score Sheet."
  *   **Materials for TA:** Timer, Whiteboard.

  **The Payoff Scheme:**
  *   **Endowment:** Each student starts with **10 Chips**.
  *   **Wager:** On every slip they receive, they must bet **1 Chip**. (No sitting out).
  *   **Reward:** If their prediction matches the Coin for that round, they get **2 Chips** back (Net +1). If wrong, they lose the chip (Net -1).
  *   **Goal:** Maximize personal chip count by the end of the session.

  ---

  ### Sequence of Rounds (75 Minutes Total)

  #### 1. Introduction & Rules (10 Minutes)
  *   **The Hook:** Tell them they are participating in a "Prediction Market." Do **not** mention Sleeping Beauty, Halfer, or Thirder.
  *   **The Protocol:** Explain the "Waking" mechanic clearly.
      1.  **Sleep Phase:** All students put their heads down on their desks. Eyes closed. No talking.
      2.  **Coin Phase:** One student in each group (the "Flipper") flips the coin. They do not announce the result.
      3.  **Distribution Phase:**
          *   If **Heads**: The Flipper places **1 Envelope** on the desk of *each* group member.
          *   If **Tails**: The Flipper places **2 Envelopes** on the desk of *each* group member.
          *   *Crucial Constraint:* The Flipper must move silently and place envelopes one at a time. They must wait 10 seconds between passes so students cannot distinguish one pass from two by speed.
      4.  **Betting Phase:** Students open an envelope, find a slip, mark **H** or **T**, put it back, seal it, and put their head back down immediately.
      5.  **Collection:** The Flipper collects all sealed envelopes.
      6.  **Reveal:** The Flipper announces the Coin result. Payoffs are settled immediately per slip.
  *   **The Ignorance Rule:** "You are forbidden from trying to count how many envelopes you received during the round. You must treat every envelope you open as if it is the only one you will ever see in this round."

  #### 2. Practice Round (10 Minutes)
  *   Run one round slowly. Walk around to ensure heads are down and silence is kept.
  *   **Purpose:** To iron out logistics. Students will inevitably peek or giggle. Correct this sternly. "In the real thought experiment, you literally cannot know. Here, you must agree not to know."
  *   Settle chips.

  #### 3. The Data Rounds (35 Minutes)
  *   Run **3 Serious Rounds**. (Approx. 10 mins per round including settlement).
  *   **TA Role:** Circulate. Ensure Flippers aren't signaling. Ensure students aren't tracking counts ("That was my second one!").
  *   **Mid-Game Intervention (After Round 2):** Pause. Ask: "Who is currently betting Heads on every slip? Who is betting Tails?"
      *   *Likely Outcome:* The Tails-bettors will have more chips. The Heads-bettors will feel frustrated because "The coin is fair, why am I losing?"
      *   *Do not explain why.* Just let the frustration sit. Ask: "Does anyone want to change their strategy for Round 3?"
      *   This is the moment they get torn. The Halfer intuition says "It's 50/50." The Chip Count says "Bet Tails."

  #### 4. The Debrief (20 Minutes)
  *   **Step 1: The Tally.** Aggregate the class data on the board.
      *   Total Coin Flips (Trials).
      *   Total Slips Generated (Experiences).
      *   Show that ~2/3 of all slips were Tails-slips, even though 1/2 of all coins were Tails.
  *   **Step 2: Connect to Credence.**
      *   Ask the Heads-bettors: "Why did you bet Heads?" (Answer: "The coin is fair.")
      *   Ask the Tails-bettors: "Why did you bet Tails?" (Answer: "I wanted to win chips.")
      *   **The Pivot:** "In this game, your 'Credence' is defined by your betting behavior. If you bet Tails to maximize utility, your *effective* credence in Heads was 1/3. If you bet Heads because the coin is fair, your *effective* credence was 1/2, but you went bankrupt."
  *   **Step 3: Self-Locating Belief.**
      *   Ask: "When you opened the envelope, what did you learn?"
      *   They didn't learn about the coin (it was already flipped).
      *   They learned: **"I am experiencing a waking."**
      *   Explain: "In the Tails world, there are twice as many 'I am experiencing a waking' moments. When you find yourself having an experience, you are more likely to be in the world where there are more experiences."
      *   This ties the "Chip Count" (Frequency of Experiences) to the "Self-Locating Belief" (Where am I in the logical space?).

  ---

  ### Predictable Breakage & Mitigation

  1.  **The "Counting" Cheat:** Students will try to feel if they have two envelopes.
      *   *Fix:* Instruct Flippers to shuffle the envelopes on the desk after placing them, or place them in a central pile students draw from blindly. *Better:* Use the "Central Pile" method. Flippers put 4 or 8 slips in a central bag. Students draw one, bet, return it? No, that allows replacement.
      *   *Best Fix:* **The "Blind Handoff."** Students keep hands clasped. TA or Flipper places the slip in their hand. They cannot feel the desk.
  2.  **The "Strategy Collusion":** Groups might agree to all bet Tails to "beat the game."
      *   *Fix:* Remind them the goal is *individual* chip maximization. If the coin comes up Heads, the Tails-bettors lose. The risk is real.
  3.  **Time Overrun:** 3 rounds is tight.
      *   *Fix:* If you run long, cut to 2 serious rounds. The tension emerges by Round 2.
  4.  **The "Fair Coin" Objection:** Students will insist the answer *must* be 1/2 because the coin is physical.
      *   *Fix:* Acknowledge this. "You are right about the coin. You are wrong about the *slip*. The question is: What is the probability *this slip* is a Heads-slip?"

  ---

  ### What This Simulation Cannot Capture (The Debrief Caveat)

  You must be honest about where the analogy fails. This is crucial for a PhD-level TA to admit.

  **1. The Phenomenology of Forgetting:**
  *   **The Gap:** In the game, students *know* they are in a simulation. They know if they peek, they break the rule. In the real Sleeping Beauty problem, Beauty *cannot* peek even if she wants to. Her memory is actually gone.
  *   **Why it Matters:** In the game, their uncertainty is *procedural* (I agreed not to look). In the problem, it is *constitutive* (I literally cannot know).
  *   **Your Job:** In the debrief, say: "In this game, you were pretending to forget. In the thought experiment, the forgetting is what makes the two wakings distinct *epistemic situations*. If you remembered the first waking, you would know it's Tails immediately. The amnesia isn't just a rule; it's what creates the indexical uncertainty."

  **2. The "One Subject" vs. "Many Subjects":**
  *   **The Gap:** We used 16 students to generate frequency data. Sleeping Beauty is *one* person going through this once.
  *   **Why it Matters:** Thirders rely on long-run frequencies (betting over many trials). Halfers argue that long-run frequency doesn't dictate single-case credence.
  *   **Your Job:** "We used the class to simulate the long run. But Beauty only wakes up once (or twice) for *one* coin flip. Does the betting argument hold for a single case? That is the core philosophical fight you will read about next week."

  **3. The Payoff Structure:**
  *   **The Gap:** We paid per *slip*. What if we paid per *trial*?
  *   **Why it Matters:** If you pay once per trial (regardless of wakings), the Halfer strategy wins. If you pay per waking, the Thirder strategy wins.
  *   **Your Job:** "The Thirder position assumes your credence should guide your action *each time you wake up*. The Halfer position assumes your credence should track the *objective chance of the coin*. We forced the 'per waking' payoff. Would you bet differently if I only paid you once at the end of the week?"

  ### Why This Design?
  I chose the **Envelope/Betting** design over a "Roleplay" or "Token Draw" design because it forces the **Dutch Book** intuition physically. Students feel the pain of losing chips when they bet Heads on a Tails round (because they lose *twice*). This somatic experience of loss makes the Thirder argument feel pragmatic and necessary, while the visible coin flip keeps the Halfer argument feeling logically true. That cognitive dissonance is exactly where you want them before they read Elga.
