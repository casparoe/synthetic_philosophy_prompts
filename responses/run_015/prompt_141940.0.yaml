          *   "Explosion Control" is *Non-Triviality under Inconsistency*.
          *   "Inference Capability" is *Dynamic Closure*.
          *   "Substitution Sensitivity" is *Hyperintensionality*.
          *   "Prefix Problem" is *Step-Boundedness vs. Transitive Closure*.
          *   "Attributable-Gap" is *Explainable Boundedness*.
          *   "The Leash" is *Occurrent Rationality*.
      *   *Extensions:* Need to add the specific points requested in the second paragraph (Propositions vs. Representations, Degeneracy, Higher-Order, Graded, Improvement).

  4.  **Addressing Specific Conceptual Issues:**

      *   *Propositions vs. Representations:* Standard semantics uses propositions (sets of worlds). Bounded agents need *sentences* or *mental models*. The distinction is crucial because $P \land Q$ is logically equivalent to $Q \land P$, but cognitively distinct.
      *   *Degeneracy:* If belief is too fine-grained, anything goes. Need a constraint that ties belief states to *capacities*.
      *   *Higher-Order:* Standard Aumann agreement theorem breaks. Need to model "Agent A believes Agent B believes..." without assuming B is omniscient.
      *   *Graded Belief:* Probability functions are logically omniscient (P(A) = 1 if A is a tautology). Need imprecise probabilities or belief functions, or a separation between "explicit belief" and "probabilistic commitment."
      *   *Improvement:* Distinguish "hasn't noticed" (latent) vs. "would reject" (incompatible). This requires a dynamic model of resource allocation.

  5.  **Classifying Requirements:**

      *   *Non-Negotiable:* Must serve the two purposes (Prediction, Normative Evaluation).
          *   Prediction needs: Failure of Closure, Step-Boundedness, Representational Sensitivity.
          *   Normative needs: Non-Triviality, Occurrent Rationality (The Leash), Explainable Boundedness.
      *   *Preferences:* Specific formalisms (e.g., specific logic systems).
      *   *Tension:* Prediction wants to describe what *is* (including irrationality). Normative evaluation wants to say what *ought* to be (rational norms). The "Leash" is a normative constraint on a descriptive model.
      *   *Incompatibility:* "Explainable Boundedness" vs. "Full Predictive Accuracy." Sometimes agents are irrational for no specifiable reason (noise).
      *   *Most Work:* *Hyperintensionality* (distinguishing logically equivalent statements) is usually the biggest hurdle for standard semantics.

  6.  **Scoring Formal Approaches:**

      *   *Hintikka/Kripke (Standard):* Fails almost everything (Omniscience).
