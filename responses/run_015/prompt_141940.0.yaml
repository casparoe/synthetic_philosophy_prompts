      *   *Impossible Worlds:* Good on hyperintensionality, risk of degeneracy.
      *   *Resource-Bounded Logic (Cherniak, Simon):* Good on constraints, hard to formalize precisely.
      *   *Probabilistic/Imprecise:* Good for uncertainty, still struggles with logical omniscience in priors.

