      *   *Modus Ponens Gap:* Believes $A$ and $A \to B$, but not $B$. (Needs to be allowed).
      *   *Explosion Control:* Inconsistent beliefs $\nRightarrow$ believe everything.
      *   *Inference Capability:* Inference *must* sometimes extend belief (not an idiot).
