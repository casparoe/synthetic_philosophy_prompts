      *   *Tone:* Rigorous, philosophical but engineering-minded.
      *   *Formatting:* Use bolding, lists, and clear headings.
      *   *Check:* Did I answer the "single requirement" question? Yes. Did I address the "degeneracy" worry? Yes.

      *(Self-Correction during drafting)*: The user asked to "correct, reorder, and extend" their list. I shouldn't just list them; I should integrate their specific terms ("The Leash", "Prefix Problem") into a structured framework. I need to make sure I explicitly mark Non-Negotiable vs. Preference. I need to make sure I address the "Prediction vs. Normative" tension clearly.

      *Refining the "Leash":* The user's "Leash" is strong. It says if capacity + occurrent premises $\to$ conclusion OR drop premise. This is a rationality norm. For *prediction*, this might be too strong (people procrastinate). I need to highlight this tension.

      *Refining "Propositions vs. Representations":* This is the crux. If belief is about propositions, omniscience is hard to avoid. If belief is about sentences, normativity is hard to justify. The solution usually involves *structured propositions* or *mental files*.

      *Refining "Graded Belief":* Standard Bayesianism is omniscient. I need to mention *Logical Uncertainty* (e.g., Garrabrant et al., or Garber's solution).

  8.  **Final Review against Constraints:**

      *   American English? Yes.
      *   No guessing on formal details? Yes, keep it high-level.
      *   Address all specific questions in the prompt? Yes.
      *   Mark Non-Negotiable vs. Preference? Yes.
      *   Flag incompatibilities? Yes.
      *   Identify the "most work" requirement? Yes.

  9.  **Final Polish:** Ensure the distinction between the *specification* (the desiderata) and the *scorecard* (the approaches) is clear. The prompt asks for the specification primarily, with the scorecard as a footnote/brief section.

      *Wait, one nuance:* The user asks to "Mark which requirements are non-negotiable for my two purposes and which are really preferences of one research program." I need to be careful here. Some of *their* list items might be preferences disguised as requirements. For example, "The Leash" is a strong normative claim. A purely predictive model might not need it. I should flag that.

      *Another nuance:* "Attributable-gap condition." This is very strong. It demands *explainability*. In ML/AI, this is "interpretability." In philosophy, it's "rational reconstruction." This might conflict with "Prediction" if human auditors are sometimes randomly inconsistent.

      *Okay, let's structure the response.*
      1. Introduction acknowledging the problem (Logical Omniscience).
      2. The Desiderata (Categorized: Static, Dynamic, Meta).
      3. Conceptual Deep Dives (The 5 specific questions).
