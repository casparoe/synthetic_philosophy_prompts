answer: |-
  # The Pluralist Screening Protocol (PSP)
  **For:** Features Screening Staff (Undergraduate Biology Background)
  **Time Allocation:** 40 Minutes per Pitch
  **Theoretical Basis:** Gould & Lewontin (1979) *The Spandrels of San Marco and the Panglossian Paradigm*.
  **Objective:** To distinguish robust evolutionary explanations from "Just-So Stories" by enforcing consideration of non-adaptive alternatives before publication.

  ---

  ## Part I: The Screening Flowchart (In Words)

  ### Gate 1: The Adaptation Claim Definition
  *   **Question:** Does the pitch assert that the trait exists *because* it was naturally selected for its current utility?
  *   **Evidence Required:** Clear statement of function and selective pressure in the summary.
  *   **Pass:** Proceed to Gate 2.
  *   **Fail (No adaptation claim):** Route to General Science Editor (Out of scope for this protocol).
  *   **Editorial Judgment Point:** Distinguishing between "current utility" and "evolutionary origin." A trait can be useful now without being selected for originally.

  ### Gate 2: The Darwinian Prerequisites
  *   **Question:** Does the pitch provide evidence that the trait varies within the population and is heritable?
  *   **Evidence Required:** Citation of quantitative genetics, breeding studies, or clear observation of polymorphism linked to lineage.
  *   **Revision/Rejection Condition:** If the trait is invariant or purely environmental (plastic) with no genetic component, **Reject**. Natural selection cannot act without heritable variation.
  *   **Escalation Condition:** If heritability is implied but not cited (common in behavioral pitches), **Escalate** to Editor.

  ### Gate 3: The Alternative Hypotheses Test (The Gould-Lewontin Gate)
  *   **Question:** Does the author explicitly acknowledge and rule out at least two non-adaptive alternatives?
  *   **Required Alternatives to Address:**
      1.  **Drift:** Could this be random fixation?
      2.  **Constraint/Byproduct:** Is this a physical necessity or a side effect of selection on a different trait (Spandrel)?
      3.  **Exaptation:** Was the trait selected for a *different* function originally?
  *   **Evidence Required:** Logical argument or citation comparing the adaptive hypothesis against these nulls.
  *   **Revision/Rejection Condition:** If the pitch treats adaptation as the *only* possible explanation, **Revise** (demand alternatives) or **Reject** (if dogmatic).
  *   **Editorial Judgment Point:** Assessing the plausibility of the author's dismissal of alternatives. Staff must judge if the dismissal is hand-waving or substantive.

  ### Gate 4: The Evidence Hierarchy
  *   **Question:** What is the strongest evidence provided for the selective advantage?
  *   **Hierarchy (High to Low):**
      1.  **Fitness Measure:** Direct correlation between trait and reproductive success in the wild.
      2.  **Comparative/Phylogenetic:** Trait evolves independently in multiple lineages facing similar pressures (convergence).
      3.  **Experimental:** Manipulation of the trait alters survival/reproduction (e.g., clay models, gene knockout).
      4.  **Correlational:** Trait presence matches environment (weak evidence).
  *   **Revision/Rejection Condition:** If the pitch relies *solely* on Level 4 (Correlation) without acknowledging Levels 1-3 are missing, **Revise** to temper claims.
  *   **Escalation Condition:** If Level 1 or 2 is claimed but seems statistically dubious, **Escalate** to External Referee.

  ### Gate 5: Hard Case Protocols
  *   **Protocol A: Human Cognition/Behavior**
      *   **Risk:** High susceptibility to "Just-So Stories" due to lack of experimental manipulation and deep-time inference.
      *   **Requirement:** Must include cross-cultural variation or developmental constraints. If the claim relies on "Ancestral Environment" speculation without archaeological or comparative primate data, **Reject**.
  *   **Protocol B: Visually Compelling Structures**
      *   **Risk:** "Reader Appeal" bias (beautiful traits must be adaptive).
      *   **Requirement:** Must address physical/developmental constraints (e.g., scaling laws, pigment chemistry). If the aesthetic appeal drives the adaptive claim, **Flag for Revision**.
  *   **Protocol C: Interacting Factors**
      *   **Risk:** False dichotomy (Adaptation OR Drift).
      *   **Requirement:** Acknowledge mixed models (e.g., "Selection initiated, Drift maintained"). If the pitch demands a single cause for a complex trait, **Revise**.

  ### Gate 6: Final Recommendation
  *   **Accept:** Passes all gates; claims match evidence strength.
  *   **Revise:** Science is sound, but language overstates certainty (e.g., change "evolved to" to "may function to").
  *   **Reject:** Fails Gate 2 or 3; evidence is insufficient for the strength of the claim.
  *   **Escalate:** High stakes (Cover Story), Human Behavior, or conflicting referee opinions.

  **⚠️ Known Failure Mode:** This procedure cannot verify raw data. It relies on the author's representation of evidence. It is most likely to misfire on **Gate 3**, where non-specialists may accept a superficial dismissal of "Drift" as sufficient.

  ---

  ## Part II: Application to Stylized Submissions

  ### Case 1: The Desert Lizard Throat Fan
  **Pitch:** Throat fan color evolved to deter a specific avian predator.
  **Evidence:** Within-population correlation; single clay model experiment.
  **Missing:** Comparative data, heritability, wild fitness measures.
  **Internal Pressure:** Senior staff favor as Cover Story (Visual Appeal).

  **Step-by-Step Application:**
  1.  **Gate 1 (Claim):** Yes, asserts adaptation for predator deterrence. **Pass.**
  2.  **Gate 2 (Prerequisites):** Heritability estimates are missing. We do not know if color variation is genetic or dietary. **Flag.**
  3.  **Gate 3 (Alternatives):** Pitch does not address if the color is a byproduct of sexual selection (exaptation) or thermal regulation (constraint). It assumes predation is the sole driver. **Fail.**
  4.  **Gate 4 (Evidence):** Relies on clay models (Level 3) but lacks wild fitness (Level 1) or phylogenetic convergence (Level 2). The correlation is Level 4. The evidence is weaker than the claim ("evolved to"). **Fail.**
  5.  **Gate 5 (Hard Case):** This is **Protocol B (Visually Compelling)**. The bright color is visually striking, creating pressure to publish. The procedure requires addressing physical constraints (e.g., pigment availability). The pitch ignores this. **Flag.**
  6.  **Gate 6 (Decision):** **Reject/Revise.**
      *   *Action:* The pitch must be revised to state the hypothesis is *tentative*. The claim "evolved to" must be changed to "may function to." Heritability must be cited.
      *   *Conflict:* This contradicts the Senior Staff's desire for a definitive Cover Story.
      *   *Rationale:* Publishing a definitive adaptation story without heritability or comparative data violates Gate 2 and 4. It risks the "unsupported adaptive story" stake mentioned in the brief.

  ### Case 2: Human Rhythmic Humming
  **Pitch:** Humming during work evolved to promote social cohesion in ancestral groups.
  **Evidence:** Cross-cultural survey; lab study of mood.
  **Missing:** Developmental, comparative (primate), or fitness evidence.

  **Step-by-Step Application:**
  1.  **Gate 1 (Claim):** Yes, asserts adaptation for social cohesion. **Pass.**
  2.  **Gate 2 (Prerequisites):** Heritability of "humming tendency" is not established. Is it cultural learning? **Flag.**
  3.  **Gate 3 (Alternatives):** No mention of humming as a byproduct of motor control or respiratory rhythm (Constraint). No mention of Exaptation (e.g., self-soothing co-opted for social use). **Fail.**
  4.  **Gate 4 (Evidence):** Lab mood study is not fitness (Level 1). Cross-cultural survey is correlational (Level 4). **Fail.**
  5.  **Gate 5 (Hard Case):** This is **Protocol A (Human Cognition)**. It relies on "Ancestral Groups" speculation without archaeological or primate comparative data. **Automatic Reject/Reframe.**
  6.  **Gate 6 (Decision):** **Reject.**
      *   *Action:* The adaptation claim is unsupported. The piece could be accepted only if reframed as "Theories on why we hum," presenting the adaptationist view as one unproven hypothesis among others (e.g., neurological byproduct).
      *   *Rationale:* Human behavioral adaptation claims without fitness data are the quintessential "Just-So Stories" Gould warned against.

  ### Case 3: Cave Fish Eye Reduction
  **Pitch:** Eye reduction is explained by neutral accumulation and developmental tradeoffs, not direct selection for eyelessness.
  **Evidence:** Comparative data (neighboring populations), breeding experiments, metabolic cost estimates.
  **Internal Pressure:** None (Less "sexy" than adaptation).

  **Step-by-Step Application:**
  1.  **Gate 1 (Claim):** No, asserts *non-adaptive* origin (Drift/Constraint). **Pass** (as a pluralist explanation).
  2.  **Gate 2 (Prerequisites):** Breeding experiments confirm heritability of eye size. **Pass.**
  3.  **Gate 3 (Alternatives):** The pitch explicitly argues *against* direct selection and *for* Drift/Constraint. It fulfills the Gould-Lewontin requirement by prioritizing non-adaptive explanations where evidence fits. **Pass.**
  4.  **Gate 4 (Evidence):** Comparative data (Level 2) and Metabolic estimates (supporting Constraint). This is stronger evidence than Case 1. **Pass.**
  5.  **Gate 5 (Hard Case):** This is **Protocol C (Interacting Factors)**. It acknowledges metabolic tradeoffs (Constraint) and neutral accumulation (Drift). **Pass.**
  6.  **Gate 6 (Decision):** **Accept.**
      *   *Action:* Commission the piece.
      *   *Rationale:* Although the magazine focuses on adaptations, a rigorous explanation of why a trait is *not* an adaptation upholds credibility. It demonstrates the pluralist approach.
      *   *Note:* This case demonstrates that the procedure protects the magazine from publishing bad science, even if it means publishing a "negative" result regarding adaptation.

  ---

  ## Part III: Limitations Statement

  **What This Procedure Cannot Accomplish:**

  1.  **Data Verification:** The PSP relies on the honesty and competence of the freelancer. It cannot detect fabricated data or p-hacking within the cited studies.
  2.  **Phylogenetic Expertise:** Screening staff (Undergraduate level) cannot independently verify complex phylogenetic comparative methods in 40 minutes. They must rely on whether the author *claims* to have done it, not whether it was done correctly.
  3.  **Resolution of Scientific Disputes:** When legitimate experts disagree (e.g., Drift vs. Weak Selection), this procedure cannot arbitrate truth. It can only ensure both sides are acknowledged (Gate 3).
  4.  **Commercial Viability:** The procedure prioritizes scientific rigor over reader appeal. It will frequently recommend rejecting "sexy" stories (Case 1) in favor of nuanced or negative ones (Case 3). It does not solve the tension between credibility and circulation; it merely codifies the cost of choosing the former.
  5.  **Final Authority:** The flowchart highlights judgment points (Gates 1, 3, 6) where human discretion is irreplaceable. It is a decision-support tool, not a decision-making algorithm.
