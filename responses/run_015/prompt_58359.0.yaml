  9.  **Final Polish:** Check tone (professional, editorial), formatting (bolding, lists for readability), and ensure all prompt requirements are met. (e.g., "flowchart in words", "40 minutes", "undergraduate level").

      *   *Case 1 (Lizard):* High commercial pressure. Weak science. Procedure should flag for Rejection/Revision. (Contrary to preference).
