answer: |-
  **Opening Remarks: The Boundaries of Agency**

  Good morning. It is a rare privilege to welcome such distinct communities into a single room. We have modal logicians who track necessity across possible worlds; philosophers of action who map the architecture of choice; and clinicians who navigate the most visceral boundaries of agency imaginable—in the rooms where patients decide how to die.

  Usually, when these groups meet, the philosophers provide the theory and the clinicians provide the case studies. Today, I want to propose something different. I want us to share a single structural problem. I want the philosophy to do work, not just offer decoration. To do that, I want to begin with a story you may know, but I ask you to hear it in a new key.

  The story is "Death in Damascus." A gardener sees Death in the marketplace. Death looks surprised. The gardener, terrified, flees to Damascus, believing he can outrun his fate. But upon arrival, he finds Death waiting for him. Death says, "I was surprised to see you in the marketplace, because I have an appointment with you tonight in Damascus."

  Traditionally, this is told as a parable about fatalism. The lesson is usually: "You cannot escape what is written." If the outcome is fixed, agency is an illusion.

  But for this workshop, I invite us to reject that reading. The gardener's error was not metaphysical; it was logical. Specifically, it was a planning fallacy arising from a modal scope ambiguity.

  Let me unpack that without symbols. When the gardener heard the prophecy, he processed it in one of two ways.

  The first way is: "It is inevitable that, *should* I go to Damascus, death will occur there." Here, the inevitability attaches to the *connection* between the going and the dying. The rule is fixed: If Gardener goes to Damascus, then Death is there. The gardener retains the agency to stay in Aleppo. If he stays, the condition is not met, and the appointment is not kept. The inevitability lies in the conditional relationship, not the event itself.

  The second way is: "My decision to go to Damascus *renders* my death inevitable." Here, the inevitability attaches to the *outcome* once the decision is made. The gardener believes that by choosing Damascus, he transforms a possible death into a necessary one. He thinks his move locks the door behind him.

  The gardener fled to Damascus because he confused these two scopes. He thought that by moving, he was changing the modal status of his life from "contingent" to "necessary." He thought his action created the fate, rather than merely satisfying the condition of a fixed rule. He treated a conditional necessity as a consequential necessity.

  Why does this matter for us? Because in end-of-life planning, we face this same ambiguity every day.

  When a clinician tells a family, "If we withdraw support, death will follow," they are stating a conditional inevitability. It is inevitable *that, should* we withdraw, death occurs. The certainty lies in the biological connection.

  But families—and often providers—hear the second scope: "Our decision to withdraw support *renders* death inevitable." They hear that their choice creates the necessity, rather than acknowledging the underlying condition. This shifts the moral weight of agency. In the first scope, the agency is about navigating a fixed landscape. In the second, the agency is about constructing the landscape itself.

  If we treat every prognosis as the second scope—that our decisions render outcomes inevitable—we risk a kind of clinical fatalism. We begin to believe that because an outcome is highly probable given a choice, the choice itself has removed all other possibilities from the universe. We conflate the certainty of the prediction with the necessity of the event.

  For the logicians here, this is a familiar scope distinction. For the clinicians, this is the difference between guiding a patient through a fixed trajectory versus feeling responsible for fixing the trajectory itself.

  This workshop, "The Boundaries of Agency," is not about determining whether free will exists. We are not here to solve determinism. We are here to determine how we plan when the future looks fixed.

  If we can agree that the gardener was wrong about the logic, not just the fate, then we can agree that agency survives even in the face of fixed conditionals. We can plan within the constraints of necessity without believing we are the authors of that necessity.

  Over the next two days, I ask you to listen for this scope ambiguity. When a philosopher speaks of "fixed futures," ask: Is the *connection* fixed, or is the *outcome* fixed? When a clinician speaks of "inevitable decline," ask: Is this inevitable *should* we proceed, or does proceeding *make* it inevitable?

  If we can keep this distinction clear, we might find that the boundaries of agency are not walls that stop us, but structures that allow us to build. The gardener died because he thought his movement changed the rules of the universe. Let us ensure that our patients, and our theories, do not make the same mistake.

  Thank you, and let us begin.

  ***

  **Delivery Note**

  **Critical Moment:** The distinction between the two scopes occurs in the fourth and fifth paragraphs ("The first way is..." vs. "The second way is...").

  **Risk:** The clinical half of the room is most likely to misread this modal distinction as a **causal claim**. They will hear "It is inevitable that should I go..." as "Going causes death" and "My decision renders death inevitable" as "Going causes death." To them, both sound like causal necessity.

  **Calibration:** When delivering the phrase *"The inevitability attaches to the connection... versus... the inevitability attaches to the outcome,"* you must slow down and use hand gestures to separate the two concepts physically. Emphasize that in the first case, the *rule* is the hard object, and the decision is a key that fits it. In the second case, the *decision* is the hammer that forges the lock. If you do not emphasize that the **modal status** (the "must-ness") is what is shifting, not the physical cause, the clinicians will collapse the distinction into a standard discussion of causality, losing the logical nuance required for the logicians.
