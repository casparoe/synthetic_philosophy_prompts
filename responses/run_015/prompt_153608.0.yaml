answer: |-
  ### Failure Modes of After-the-Fact Explanation

  Before committing to the desiderata, we must isolate how retrospective accounts fail when pressed into service for prospective use.

  1.  **The Teleological Collapse:** The explanation treats the outcome as a magnetic pull, organizing all prior noise into a signal only visible from the endpoint. It confuses *significance* (why we care now) with *causality* (what drove the process then).
  2.  **The Archive Mirage:** The explanation relies on documents that survived *because* of the outcome (victors' records, post-crisis inquiries) while treating the silence of the losers as absence of agency.
  3.  **The Overfit Narrative:** The causal chain is so specific to the actual sequence that it has zero degrees of freedom. It explains the actual world perfectly but assigns probability zero to any adjacent possible world.
  4.  **The Latent Variable Trap:** The explanation leans on structural conditions that were theoretically present ex-ante but practically invisible to actors until triggered. (e.g., "The regime was fragile" is only knowable after it breaks).

  ***

  ### The Desiderata List

  Here is the evaluation of your list, plus necessary additions, categorized by **Non-Negotiable (NN)** for the specific purpose of *portable causal advice* (monograph + forecaster), and **Camp Taste (CT)** where historiographical schools diverge without breaking the utility constraint.

  **1. Ex-Ante Legibility (NN)**
  *   **Case:** If a factor was not identifiable (in type, if not token) to a contemporary, it cannot be used by a forecaster. You cannot advise a policy person to watch for "signs of X" if X is defined by its consequence.
  *   **Verdict on your worry:** You are right that this bans much "insight." Deep structural history often relies on hindsight to identify structures. However, for *usable advice*, this is NN. If you violate this, you are writing prophecy, not history.
  *   **Refinement:** It requires *class* legibility. We don't need to know "Napoleon" ex-ante, but we must be able to identify "charismatic military populist" ex-ante.

  **2. The Near-Miss Test / Explanatory Asymmetry (NN)**
  *   **Case:** An explanation that fits Outcome A must not fit Outcome B with equal ease. If your causal model predicts "Revolution" regardless of whether the harvest failed or succeeded, it is a tautology, not a cause.
  *   **Verdict:** Genuine Desideratum. This is the core of causal selection.

  **3. Epistemic Hygiene (replacing Source Contamination) (NN)**
  *   **Case:** "Source contamination" is a problem, not a desideratum. The requirement is that the explanation must explicitly account for *why* the evidence exists. It must weigh the silence.
  *   **Verdict:** Genuine Desideratum. Ignoring the survivorship bias of the archive renders the model brittle.

  **4. Diachronic Stability (NN)**
  *   **Case:** The "Beginning of the X" problem. If the explanation relies on labeling an event by its future consequence (e.g., "The pre-war economy"), it becomes false if the war doesn't happen.
  *   **Verdict:** Genuine Desideratum. Essential for generalizability.

  **5. Falsification Conditions (Added)**
  *   **Case:** What evidence, if found, would force you to abandon this explanation? If the answer is "none," the account is theological.
  *   **Verdict:** NN for forecaster utility. A forecaster needs to know when to stop betting on your model.

  **6. Mechanism Specificity (Added)**
  *   **Case:** Correlation is not causation. The account must specify the transmission belt (the *how*) between variables, not just the sequence.
  *   **Verdict:** NN. Without mechanism, you cannot intervene.

  **7. Narrative Closure vs. Ontological Contingency (CT)**
  *   **Case:** Readers need stories (closure); reality is messy (contingency).
  *   **Verdict:** Camp Taste. Analytical historians sacrifice closure for accuracy; Narrative historians sacrifice accuracy for coherence. Neither breaks the causal model *if* the mechanism is sound, but it affects readability.

  **8. Actor Epistemology (Added)**
  *   **Case:** Did the historical agents know what they were doing? Explanations that rely on "false consciousness" or hidden structural forces invisible to actors are harder to port to forecasters (who are actors).
  *   **Verdict:** CT. Structuralists reject this; Methodological Individualists demand it.

  ***

  ### Incompatible Pairs & Trade-Offs

  You suspected correctly. Here are the tensions that cannot be fully resolved, only managed:

  **1. Ex-Ante Legibility vs. Causal Depth**
  *   **Conflict:** The most powerful causes are often structural shifts only visible in retrospect (e.g., "the decline of feudalism"). Strict ex-ante legibility forces you to stick to surface-level variables (prices, troop movements) that actors could see.
  *   **Resolution:** You must accept shallower explanations to maintain portability. Deep history is often bad forecasting advice.

  **2. Narrative Closure vs. Diachronic Stability**
  *   **Conflict:** A satisfying story needs a climax and resolution (Closure). But labeling an event as a "climax" often relies on knowing the consequence (violating Stability).
  *   **Resolution:** The historian must write "open endings" or explicitly bracket the emplotment as a heuristic, not an ontology.

  **3. Mechanism Specificity vs. Generalizability**
  *   **Conflict:** The more specific the mechanism (Process Tracing), the less it applies to other cases. The more general (Covering Law), the less it explains *this* case.
  *   **Resolution:** This is the eternal struggle. For the forecaster, prioritize Mechanism Specificity; for the theorist, prioritize Generalizability.

  ***

  ### The Single Most Exclusionary Requirement

  **Ex-Ante Legibility.**

  This requirement excludes the vast majority of published historical monographs. Most historical explanation relies on *significance* derived from the outcome to select the cause. We explain the French Revolution by citing factors that matter *because* the Revolution happened. If we strip away the knowledge of the Revolution to see if those factors were legible as revolutionary triggers in 1788, most causal chains dissolve into noise. It excludes structuralism, Marxism, and most narrative history that relies on "inevitability."

  ***

  ### Scorecard

  **Covering-Law (Hempel/Dray)**
  *   **Score:** Fails Ex-Ante Legibility (laws are often abstracted from the outcome) and Mechanism Specificity. Passes Diachronic Stability.
  *   **Verdict:** Too abstract for forecasters; explains types, not tokens.

  **Counterfactual-Dependence (Lewis/Ferguson)**
  *   **Score:** Passes Near-Miss Test brilliantly. Fails Ex-Ante Legibility (counterfactuals are often constructed using hindsight knowledge).
  *   **Verdict:** Excellent for testing robustness, dangerous for prediction if the counterfactual world is imagined from the future.

  **Narrative/Process-Tracing (Weber/Geertz)**
  *   **Score:** Passes Mechanism Specificity and Epistemic Hygiene. Fails Diachronic Stability (too context-bound) and often Ex-Ante Legibility (emplotment).
  *   **Verdict:** Best for monographs, worst for forecasters. High fidelity, low portability.
