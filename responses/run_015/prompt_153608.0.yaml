  2.  **Deconstruct the Core Tension:**
      *   The prompt highlights the "Hindsight Bias" problem (knowing the end) vs. the "Usability" problem (needs to work for forecasters).
      *   Historians explain *what happened*. Forecasters need to know *what could happen*.
      *   If an explanation relies on factors only visible *after* the event, it's useless for prediction.
      *   If an explanation relies only on factors visible *before* the event, it might miss the actual causal mechanism (which often clarifies only in retrospect).
      *   *Key Insight:* The goal is "Explanatory Portability." Can the causal logic travel from the past (known end) to the future (unknown end)?

  3.  **Evaluate the User's List:**
      *   *Ex-ante legibility:* Crucial for the forecaster constraint. But the user worries it bans hindsight insight. *Verdict:* Non-negotiable for the specific "usable advice" constraint, but needs nuance (legibility of *type*, not necessarily specific token).
      *   *Near-miss test:* Essential for distinguishing causal selection from post-hoc rationalization. If the story fits both outcomes, it explains neither. *Verdict:* Non-negotiable.
      *   *Source contamination:* A meta-problem. Hard to solve methodologically, more of a caution. *Verdict:* Camp Taste (source critics vs. realists), but important to acknowledge.
      *   *Closure vs. Contingency:* Aesthetic/Narrative vs. Ontological. *Verdict:* Camp Taste (narrativists vs. analyticals).
      *   *Diachronic stability:* "Beginning of the X" problem. Essential for generalizable knowledge. *Verdict:* Non-negotiable for theory-building.
      *   *Resistance to judged-probability inflation:* Hindsight bias. *Verdict:* Non-negotiable.

  4.  **Brainstorm Missing Desiderata:**
      *   *Mechanism Specificity:* You need to know *how* A caused B, not just that it did. (Process tracing).
      *   *Equifinality Handling:* Can different paths lead to the same outcome? The explanation needs to account for this without being vague.
      *   *Actor Epistemology:* Did the actors know what they were doing? (Boudon/Elster).
      *   *Scalability/Transferability:* Can this logic apply to a slightly different context? (External validity).
      *   *Falsifiability:* What evidence would break this explanation? (Crucial for the forecaster).

  5.  **Develop the Failure Modes (Pre-commitment):**
      *   *The "Inevitability" Trap:* Making the outcome look necessary.
      *   *The "Oracle" Trap:* Using information not available at the time.
      *   *The "Just-So" Story:* Fitting the data perfectly but lacking predictive power.
      *   *The "Archival Mirage:* Treating surviving records as representative reality.

  6.  **Drafting the Desiderata List (Iterative Refinement):**
      *   Need to distinguish between what makes a *good history book* vs. what makes a *portable causal model*. The prompt asks for the latter (usable by forecasters).
      *   *Refining Ex-ante Legibility:* It's not that every factor must be known, but the *class* of factor must be identifiable.
