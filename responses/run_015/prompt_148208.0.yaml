answer: |-
  **Project Title:** Local Verisimilitude: Saving Truthlikeness from the Global Collapse

  **The Research Question**
  Does shifting the unit of analysis from whole theories to local explanatory fragments allow for a non-trivial ordering of false theories by truthlikeness? Specifically, can we define a distance metric over structural-explanatory modules that avoids the Miller-Tichy collapse while capturing our intuitions about scientific progress (e.g., why phlogiston chemistry is "closer" to modern chemistry than alchemy)?

  **The Problem: Why the Global Literature Doesn't Settle It**
  The standard debate on verisimilitude is stuck. Popper tried to define truthlikeness using logical content—basically, a false theory is closer to the truth if it has more true consequences and fewer false ones. The Miller-Tichy theorem crushed this: under Popper's definition, all false theories end up equally false. You can't rank them.

  Subsequent attempts (like Niiniluoto's semantic approach) tried to fix this by measuring distance in state-space rather than logical content. These are better, but they still treat the *theory* as the atomic unit. They ask, "How close is Theory A to the Truth?" This assumes a theory is a coherent blob that stands or falls together. But history suggests science doesn't work that way. We often retain correct structural relations inside a fundamentally false ontology. Phlogiston theory got the ontology wrong (there is no phlogiston) but got local structural relations right (conservation principles, reversible reactions, weight changes during combustion).

  The literature hasn't settled this because it's trying to measure the distance of a whole map when only specific landmarks are accurate. If we keep measuring the whole map, the errors drown out the hits. My hypothesis is that the Miller-Tichy collapse is an artifact of granularity. If we stop asking about global theory truth and start asking about local fragment truth, we might dodge the paradox.

  **Methodology**
  I'm proposing a shift from global comparison to fragment-based mapping. Here's the plan:

  1.  **Formalizing Fragments:** I won't treat a fragment as just a subset of propositions (that leads back to logical content problems). Instead, I'll define a fragment as a *structural-explanatory module*: a set of variables and the invariant relations between them that support specific predictions, independent of the ontological label attached to them. For example, the relation "weight loss correlates with combustion" is a fragment; the claim "phlogiston causes weight loss" is the ontological wrapper.
  2.  **The Metric:** I'll develop a distance metric that compares these modules across theories. The distance isn't just truth-value matching; it's structural isomorphism. Does the false theory preserve the relational structure of the true theory, even if the nodes are mislabeled?
  3.  **Case Studies:** I'll test this against two historical transitions:
      *   Phlogiston → Oxygen Chemistry.
      *   Caloric Theory → Thermodynamics.
      *   *Control:* Compare these against a genuinely distant framework (e.g., Aristotelian elements) to ensure the metric isn't just ranking everything as "equal."
  4.  **Stress Test:** I'll check if this metric collapses back into pragmatic utility. If "truthlikeness" just means "useful for calculation," I haven't solved the philosophical problem, I've just renamed instrumentalism. I need to show the metric tracks *structure* that survives theory change, not just *success*.

  **Success vs. Failure**
  *   **Positive Result:** I produce a formal sketch showing that false theories can be ranked non-trivially based on fragment preservation. The metric shows Phlogiston is closer to Oxygen chemistry than Alchemy is, *without* relying on hindsight utility. This would suggest scientific progress is the accumulation of valid structural fragments, even amidst ontological error.
  *   **Negative Result (Failure):** Either the metric collapses under logical scrutiny (still vulnerable to Miller-Tichy variants), or it turns out to be indistinguishable from pragmatic success. If I can't distinguish "structurally close" from "empirically adequate," then the project fails to recover verisimilitude—it just becomes a bookkeeping system for useful errors.
  *   **Interesting Failure:** It might turn out that fragments can't be individuated cleanly without referencing the whole theory. If fragments are theory-laden, the global problem returns. That's still a valuable result—it proves the holism of verisimilitude.

  **Scope Check (4 Months)**
  Four months is tight for a new formal metric. I need to be honest about limits.
  *   **Month 1:** Literature deep dive on recent structuralist approaches (not just the classics) and finalizing the definition of a "fragment."
  *   **Month 2:** Formalizing the toy model. I won't prove a general theorem; I'll build a working logical model for the Phlogiston case.
  *   **Month 3:** Running the control cases (Caloric, etc.) and stress-testing against the "utility" objection.
  *   **Month 4:** Writing the paper.

  I am not aiming to solve the demarcation problem or overthrow semantic verisimilitude entirely. The goal is a proof of concept: demonstrating that the unit of analysis is the bottleneck. If I can show that a fragment-based approach is *coherent* and *avoids the known collapse*, that's a win. I won't produce a full axiomatic system, but rather a robust conceptual framework with a formalized example. This keeps the project feasible while still hitting a genuine gap in the philosophy of science.
