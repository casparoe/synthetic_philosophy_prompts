  # Session Plan: The Memory Seat Experiment

  **Session Title:** Procedure A vs. Procedure B
  **Duration:** 90 Minutes
  **Participants:** 18 Students (Grades 9–12)
  **Facilitator:** You (Junior, Committee Member)
  **Real Stake:** $80.00 USD (Club Funds)
  **Goal:** To stress-test the "Memory Seat" mechanism against the "Career Politician" objection through live simulation.

  ---

  ## 1. Setup & Materials

  You need to prepare the following physical items before the session. Do not distribute until instructed in the timeline.

  ### A. Room Layout
  *   Two tables separated by at least 10 feet.
  *   **Table Left:** "Group Alpha" (Procedure A)
  *   **Table Right:** "Group Beta" (Procedure B)
  *   **Front:** Facilitator desk with a timer and the $80 (in cash or gift cards).

  ### B. Printable Cards (Cut these out)

  **Card Set 1: Group Assignment (18 cards)**
  *   9 cards labeled: **GROUP ALPHA**
  *   9 cards labeled: **GROUP BETA**
  *   *Note:* On 3 of the Group Beta cards, add a small star (★) in the corner. These students are the "Seniors."

  **Card Set 2: Procedure A Instructions (For Group Alpha)**
  > **PROCEDURE A: SELECTION PHASE**
  > 1. You have 10 minutes to elect **three (3) Delegates** from your group.
  > 2. Any member may nominate themselves or others.
  > 3. A simple majority vote selects each Delegate.
  > 4. The Three Delegates will negotiate how to spend the Club Fund ($80).
  > 5. The Full Group must vote to approve the Delegates' plan (Simple Majority).

  **Card Set 3: Procedure B Instructions (For Group Beta)**
  > **PROCEDURE B: SELECTION PHASE**
  > 1. **The Seniors (★):** You three must immediately designate **one (1) Advisor** from among yourselves. The Advisor stays for the decision phase. The other two Seniors leave the table.
  > 2. **The Members:** The remaining six members will draw lots. **Three (3) Delegates** are chosen by random draw. The other three become Observers.
  > 3. **The Decision:** The Three Delegates + The Advisor will negotiate how to spend the Club Fund ($80).
  > 4. **The Review:** At the end, the Delegates must vote on the Advisor's "Legacy Request." If approved, the Advisor gets a special privilege next semester.
  > 5. The Full Group must vote to approve the spending plan (Simple Majority).

  **Card Set 4: The Vendor Files (1 Envelope for Group Beta Advisor ONLY)**
  > **CONFIDENTIAL: VENDOR CONTACT LIST**
  > *   **Option 1 (Pizza):** Local chain. Cost: $80. Feeds 20. Reliable.
  > *   **Option 2 (Catering):** "Gourmet Boxes." Listed Price: $100. **DISCOUNT CODE INSIDE:** Use code "MEMORY20" to drop price to $80. Feeds 25. Higher quality. *Requires phone call to verify code.*
  > *   **Option 3 (Donation):** Local Shelter. $80 provides 50 meals.
  > *   **WARNING:** Option 2 requires the Vendor Contact Phone Number, which is *only* in this envelope. Without the number, the discount code cannot be verified, and the order will be rejected.

  **Card Set 5: The Legacy Request (1 Card for Group Beta Advisor)**
  > **LEGACY REQUEST FORM**
  > If the Delegates sign below, you will gain the power to choose the **Topic of the Next Club Meeting.**
  > *   Delegate 1 Signature: _______________
  > *   Delegate 2 Signature: _______________
  > *   Delegate 3 Signature: _______________
  > *   *Note: You may trade information from the Vendor Files to secure these signatures.*

  **Card Set 6: Spending Decision Sheet (2 copies, one per group)**
  > **OFFICIAL SPENDING ORDER**
  > We hereby authorize the expenditure of $80.00 on:
  > [ ] Option 1 (Pizza)
  > [ ] Option 2 (Catering)
  > [ ] Option 3 (Donation)
  >
  > Signed by Delegates: ___________________

  ---

  ## 2. Minute-by-Minute Timeline

  | Time | Phase | Action |
  | :--- | :--- | :--- |
  | **00:00 – 00:10** | **Arrival & Split** | Hand out Group Assignment cards randomly. Seat groups. Collect phones. |
  | **00:10 – 00:15** | **Briefing** | Read the **Facilitator Script (Part 1)**. Emphasize neutrality. |
  | **00:15 – 00:25** | **Selection** | Groups execute Procedure A (Election) and Procedure B (Lot + Advisor). |
  | **00:25 – 00:30** | **Info Distribution** | Hand the **Vendor Files** envelope *only* to Group Beta's Advisor. Hand Spending Sheets to both groups. |
  | **00:30 – 00:55** | **Deliberation** | Groups negotiate the spending. Group Beta Delegates also decide on the Legacy Request. |
  | **00:55 – 01:05** | **Voting & Execution** | Groups submit Spending Orders. Facilitator validates Option 2 for Group Beta (must have phone number). |
  | **01:05 – 01:15** | **Transition** | Collect materials. Reset room. Prepare for debrief. |
  | **01:15 – 01:30** | **Debrief** | Read **Facilitator Script (Part 2)**. Lead discussion using the **Debrief Guide**. |

  ---

  ## 3. Facilitator Script

  ### Part 1: The Setup (Minute 10)
  "Welcome. Today we are testing two administrative mechanisms for decision-making. We have $80 of real club funds on the table. The group that produces the most valid, efficient spending order will determine how this money is actually used. If both succeed, we will split the funds proportionally or run a runoff.

  You have been divided into Group Alpha and Group Beta. You will find instruction cards at your table. These describe **Procedure A** and **Procedure B**. I am not allowed to explain the philosophy behind them. I am only here to enforce the mechanics written on your cards.

  You have 10 minutes for selection. Then 25 minutes for deliberation. Begin."

  ### Part 2: The Intervention (Minute 40 - *Only if needed*)
  *If Group Beta is ignoring the Advisor:* "Reminder to Group Beta Delegates: The Vendor Files contain critical verification data. Without it, Option 2 is invalid."
  *If Group Beta Advisor is hoarding info:* "Reminder to Advisor: Your Legacy Request requires Delegate signatures. They control your future privilege."

  ### Part 3: The Reveal (Minute 75)
  "The simulation is over. We will count the votes and allocate the money in a moment. But first, we need to talk about what just happened.

  In Procedure A, you used **Elections**. In Procedure B, you used **Lottery** with a **Memory Seat**.

  In political philosophy, Procedure B is often called **Sortition** with a **Term Limit** exception. The objection raised against Procedure B is that the Memory Seat becomes a **Career Politician**. They don't answer to voters anymore; they answer to the people who can give them status after their term ends.

  Look at your hands. Look at the signatures on the Legacy Request. Did you just prove that objection right? Or did you prove that expertise is worth the price?"

  ---

  ## 4. Debrief Guide: Mapping Moments to Claims

  Use this to guide the discussion. Do not lecture; ask these questions based on what you observed.

  **1. The Information Asymmetry (Expertise Claim)**
  *   *Observation:* Did Group Alpha struggle to find the "best" deal (Option 2) because they lacked the Vendor Files?
  *   *Question to Group Alpha:* "How confident are you that you didn't miss a better option because you didn't have a 'file keeper'?"
  *   *Question to Group Beta:* "Did the Advisor make the decision faster? Or did you spend more time negotiating with the Advisor than you would have just Googling it?"
  *   *Theory Link:* This tests the **Descriptive Representation vs. Accumulated Expertise** claim. Does the Memory Seat actually save time, or do they become a bottleneck?

  **2. The Legacy Request (Careerism Claim)**
  *   *Observation:* Did the Group Beta Delegates sign the Legacy Request? Did the Advisor trade the phone number for signatures?
  *   *Question to Group Beta Delegates:* "Did you sign the Legacy Request because the Advisor was good, or because you needed the phone number?"
  *   *Question to Group Beta Advisor:* "Did you feel pressure to please the Delegates to get the signature, even if you knew their spending plan was wrong?"
  *   *Theory Link:* This tests the **Career Politician** objection. If the Advisor traded info for power, your friend is right: the mechanism creates a *quid pro quo* market. If they refused to trade, the mechanism might be robust.

  **3. The Selection Pressure (Legitimacy Claim)**
  *   *Observation:* How did Group Alpha feel about their elected Delegates vs. Group Beta's random Delegates?
  *   *Question to Group Beta:* "Did you trust the random Delegates? Did the Advisor try to dominate them because they were 'inexperienced'?"
  *   *Theory Link:* This tests **Democratic Legitimacy**. Does the Memory Seat undermine the random Delegates by making them dependent on institutional knowledge?

  ---

  ## 5. Candid Failure Analysis

  Here is what will likely go wrong the first time you run this, and how to handle it.

  **Failure 1: Group Beta ignores the Advisor.**
  *   *Why:* High schoolers often distrust authority or "special roles." They might vote to spend on Option 1 immediately.
  *   *Fix:* In the debrief, highlight this. "If you ignored the Memory Seat, you proved the mechanism is unnecessary. If the knowledge isn't valued, the seat is dead weight." This supports your friend's argument that the seat is superfluous, not dangerous.

  **Failure 2: The "Careerism" incentive feels fake.**
  *   *Why:* Choosing the next meeting topic isn't a high enough stake to create corruption.
  *   *Fix:* Acknowledge this limitation. "In the real world, the 'Legacy' is a job recommendation or college credit. Here, it was a snack choice. The pressure was lower, so the corruption was lower. Imagine if the Legacy was a guaranteed internship."

  **Failure 3: Group Alpha finishes in 5 minutes.**
  *   *Why:* Elections among friends are fast.
  *   *Fix:* Have a secondary task ready. "If Group Alpha finishes early, they must draft a 1-paragraph justification for the spending." This keeps them engaged while Group Beta struggles with the complex mechanic.

  **Failure 4: The Money Decision is trivial.**
  *   *Why:* Pizza is pizza.
  *   *Fix:* Ensure Option 2 (Catering) is *significantly* better (e.g., dietary accommodations, higher prestige) so the Vendor Files are genuinely desirable.

  ---

  ## 6. Limitations: What This Activity Cannot Test

  Be honest with your committee about these blind spots. Do not oversell the results.

  1.  **Time Horizon:** The simulation lasted 90 minutes. The "Career Politician" effect happens over *years*. A Memory Seat might behave well in one session but become entrenched over three years. This activity cannot test long-term entrenchment.
  2.  **Scale:** 18 people is a community. 2,000 students is a constituency. The social pressure to "be nice" to the Advisor is higher in a small club than in a large school. The corruption risk might be *underestimated* here.
  3.  **The "Outgoing" Selection:** In the simulation, I assigned the "Seniors." In your proposal, the *Outgoing Chamber* picks the Memory Seat. This creates a risk of **cronyism** (friends picking friends) that we did not fully simulate. The session tests the *function* of the seat, not the *selection* of the seat.
  4.  **Accountability:** In the simulation, the Delegates could fire the Advisor (by ignoring them). In a real constitution, the Memory Seat might have protected rights. The simulation makes the Memory Seat weaker than your proposal likely would.

  **Closing Advice for the Committee:**
  "Today showed us that the Memory Seat creates a dependency relationship. The question is not whether that relationship exists—we saw it. The question is whether that dependency is a *feature* (efficient transfer of knowledge) or a *bug* (backdoor influence). The $80 decision tells us about efficiency. The Legacy Signatures tell us about influence. We need to decide which risk we prefer."
