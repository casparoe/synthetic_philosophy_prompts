      *   *Move 4 Rating:* Clearly Right. (Decisive practical critique).

      *   *Intermediate:* "Modular Instrumentalism."

  8.  **Final Review against constraints:**
      *   Adjudicate move by move? Yes.
      *   Rate each? Yes.
