prompt: |-
  You're an expert in public ethics and a really good teacher — please think carefully, do a quick brainstoming first, then lay out the plan. I'm a novelist running a workshop for other writers and essayists (smart, but zero formal philosophy) and I want to teach the ethics behind tearing down statues and renaming streets, not as politics but as a conceptual puzzle. The idea I want them to grasp is what I'm calling adress-space commemoration: the point where a statue or street name stops being praise for a person and becomes just a coordinate in the practical space people navigate — like telling someone 'turn left at the Washington intersection,' where you're not praising Washington, you're using a spatial label. But then removal feels like erasing history even though the honor wasn't the active point. Plan the teaching arc for one fifty-minute session. What's the dependancy order — which piece must come first so the distinction doesn't collapse? Pick one carrying example, a concrete square or statue, and say exactly what properties it needs (embedded in daily navigation, not actively worshipped) and what kind of case to avoid. Then map the miscoceptions in the order they'll arise — I'm guessing first 'if we remove it we erase the past,' then 'names are neutral labels,' then maybe 'this only applies to villains' — and specifiy the exact point in the sequence where I head off each one. Give me one check question at the end that proves they've grasped the conceptual split, not just picked a political side. Also tell me what to openly leave out at this level — maybe legal property doctrine? — and say why leaving it out protects the idea. Write casually, I'm on my phone, so excuse any typo.
