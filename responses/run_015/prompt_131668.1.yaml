answer: |-
  Quick brainstorm before we lock this in:

  The core tension here is between *function* and *meaning*. Writers get this—they know objects in a story can be props (functional) or symbols (meaningful). The trick is showing how a symbol slowly becomes a prop over time (semantic bleaching), and then why removing a "prop" feels like attacking a "symbol."

  If you start with the politics (who was the person?), you lose the room. You have to start with the *usage*. The dependency order is crucial:
  1.  **Usage first:** Establish how people *use* the space (navigation).
  2.  **Fading second:** Show how the honor fades into background noise.
  3.  **Removal third:** Only then ask why removal hurts if the honor was already faded.

  If you skip step 1, everyone argues about the person's crimes/virtues. If you skip step 2, you can't explain why removal feels like erasure (because the honor was dormant, not dead).

  Here's the 50-min arc.

  ***

  ### Session Plan: The Geography of Memory (50 mins)

  **0:00–0:10 | The Hook: Prop vs. Symbol**
  Don't mention statues yet. Talk about stage props. A sword in a play can be a weapon (function) or a symbol of kingship (meaning). Ask: "When does a symbol become just furniture?"
  Transition: "Public space is a stage we all walk through. Sometimes the furniture stops being symbolic and becomes functional. That's where the ethical puzzle hides."

  **0:10–0:25 | The Concept: Address-Space Commemoration**
  Introduce the term. Explain that when a name becomes an address, it shifts from *praise* to *coordinate*.
  *   **The Carrying Example:** **"The Forrest Circle."** (Use a genericized name or a real one like "Lee Circle" but strip the politics for the exercise).
  *   **Required Properties:**
      1.  **Navigational Hub:** It's a traffic roundabout or bus transfer point. People say, "Meet me at the Forrest Circle," not "Meet me at the statue of Forrest."
      2.  **Low Ritual:** No one lays flowers there. No ceremonies. It's where kids smoke cigarettes or lovers meet.
      3.  **Embedded Infrastructure:** The name is on bus schedules, Uber drop-off pins, and utility bills.
  *   **Cases to Avoid:** Do *not* use a cemetery statue, a museum exhibit, or a dedicated memorial hall. Those are explicitly for memory. You need something used for *movement*.

  **0:25–0:40 | The Pivot: The Removal Puzzle**
  Now introduce the conflict. The city wants to remove the statue/rename the circle.
  Walk them through the feeling: If it's just a coordinate (like "Main Street"), why does changing it feel like lying about history?
  *   **Key Insight:** The coordinate *is* the memory, even if no one is actively honoring it. It's "frozen attention."

  **0:40–0:50 | Wrap & Check**
  Summarize the distinction between *Archive* (keeping history in a book) and *Address* (keeping history in the ground).
  Run the check question.

  ***

  ### Dependency Order (What must come first)

  1.  **Function before Value:** You must prove they use the statue to *navigate* before you ask if they *honor* the person. If they think it's honor first, the puzzle collapses into "Do they deserve honor?"
  2.  **Ambiguity before Resolution:** They need to feel the tug-of-war (It's just a label! vs. It's erasure!) before you offer a framework. Don't solve it too fast.
  3.  **Space before Time:** Frame this as a problem of *space* (where we walk) not *time* (what happened in the past).

  ***

  ### Misconception Map (When they pop up & how to head them off)

  **1. "If we remove it, we erase the past."**
  *   **When:** Immediately upon mentioning removal (min 25).
  *   **The Fix:** Distinguish *Archive* vs. *Address*.
  *   **Say:** "Hold that thought. If I delete a contact from your phone, have I erased the person? Or just their coordinate in your daily life? We're talking about the phone book, not the history book."

  **2. "Names are just neutral labels."**
  *   **When:** When defining Address-Space (min 15).
  *   **The Fix:** Show the weight of naming.
  *   **Say:** "If I name my dog 'Hitler,' is that a neutral label? No. Language sticks. A street name isn't a GPS coordinate; it's a whisper every time someone gives directions."

  **3. "This only applies to villains."**
  *   **When:** Q&A or wrap-up (min 45).
  *   **The Fix:** Universalize the concept.
  *   **Say:** "Imagine a statue of a hero nobody remembers. 'Who was Smith?' 'Dunno, turn left at Smith.' Is it still honor? Or is it just clutter? This puzzle applies even to the good guys."

  ***

  ### The Check Question

  Don't ask "Was removal right?" Ask this:

  > **"Imagine we take the statue down and put it in a museum, but we keep the street name 'Forrest Circle' on the bus maps. Have we solved the ethical problem, or just moved it? Why?"**

  *   **Why this works:** If they grasp the concept, they'll see that keeping the *address* keeps the *coordinate* active, even if the *image* is gone. It tests if they understand that the *usage* is the commemoration, not just the bronze.

  ***

  ### What to Leave Out (And Why)

  **Leave Out:** Legal property doctrine, cost of removal, vandalism laws, and specific legislative processes.

  **Why:**
  1.  **It protects the idea:** As soon as you mention "who owns the land" or "taxpayer cost," the writers will switch from *ethical philosophers* to *policy wonks*. They'll start arguing about budgets and deeds.
  2.  **Focus on Meaning:** You want them wrestling with *semantics* and *memory*, not logistics. The puzzle is about what the space *means*, not who holds the deed. Keep it in the realm of ideas so they can use it in their work.

  ***

  Hope this helps! It's a killer concept for writers—they live in the space between words and meaning. Good luck with the workshop.
