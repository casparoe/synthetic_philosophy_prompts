answer: |-
  ### 1. Exam Question

  **Course:** PHI 550: Anthropics and Self-Locating Belief
  **Assessment:** Take-Home Final
  **Time Limit:** 40 Minutes
  **Word Limit:** 900 Words Maximum

  **Question:**

  Consider a fair coin flip ($P(\text{Heads}) = P(\text{Tails}) = 0.5$). Two scenarios describe the consequences of the flip regarding observer creation. In both scenarios, you wake up and discover you are wearing a **Red** shirt.

  *   **Variant A:** If **Heads**, 10 observers are created, all 10 wearing Red. If **Tails**, 1,000 observers are created, 10 wearing Red and 990 wearing Blue.
  *   **Variant B:** If **Heads**, 10 observers are created, 1 wearing Red and 9 wearing Blue. If **Tails**, 1,000 observers are created, 100 wearing Red and 900 wearing Blue.

  Apply the following operational definitions:
  *   **Self-Indication Assumption (SIA):** Before conditioning on specific evidence (like shirt color), weight hypotheses proportional to the total number of observers they contain. Then condition on the evidence.
  *   **Self-Sampling Assumption (SSA):** Treat yourself as a random sample from the reference class of all observers. The likelihood of your evidence is the fraction of observers in that class possessing the evidence.

  Calculate your posterior credence in **Tails** for both Variant A and Variant B under both SIA and SSA (assuming the reference class includes all observers). Based on these calculations, answer the following: Does this pair of variants demonstrate that SIA is not inherently "presumptuous" (i.e., biased toward large worlds)? Or does it merely relocate the presumptuousness to the selection of the reference class? Justify your answer.

  ***

  ### 2. Model Answer

  **Variant A Calculations**
  Under **SSA**, the prior odds are 1:1. The likelihood of observing Red given Heads is $10/10 = 1$. The likelihood of observing Red given Tails is $10/1000 = 0.01$. By Bayes' theorem, the posterior odds are $1:0.01$, or $100:1$ in favor of Heads. SSA strongly rejects the large world.

  Under **SIA**, we first weight by total observers. The "SIA prior" odds become $10:1000$, or $1:100$ favoring Tails. We then condition on the evidence (Red). The likelihoods remain $1$ (Heads) and $0.01$ (Tails). The posterior calculation is $(1 \times 1) : (100 \times 0.01)$, which simplifies to $1:1$. SIA yields a 50% credence in Tails.

  **Variant B Calculations**
  Under **SSA**, the prior odds are 1:1. The likelihood of Red given Heads is $1/10 = 0.1$. The likelihood of Red given Tails is $100/1000 = 0.1$. Since the likelihoods are equal, the posterior odds remain $1:1$. SSA is uninformative.

  Under **SIA**, the "SIA prior" odds are again $1:100$ favoring Tails (due to total population). The likelihoods are equal ($0.1$ for both). The posterior odds remain $1:100$. SIA strongly favors the large world.

  **Analysis**
  These variants demonstrate that SIA is not mechanically committed to favoring large worlds regardless of evidence. In Variant A, SIA's prior boost for Tails is exactly cancelled by the low likelihood of being Red in the Tails world (where Red is rare). SIA only favors the large world in Variant B, where the proportion of Red observers is constant across hypotheses. Thus, the slogan "SIA favors hypotheses with more observers" is imprecise; SIA favors hypotheses where *you* are more likely to exist, which combines population size with evidence frequency.

  However, this does not settle the "Presumptuous Philosopher" worry; it relocates it. In Variant A, SSA yields a decisive verdict (Heads) only because the reference class includes the Blue-shirted observers. If an agent narrows the SSA reference class to "Red-shirted observers," the likelihoods become $1$ for both hypotheses (since all Red observers are Red). SSA would then yield 50/50 odds, mimicking the SIA verdict in Variant A. In Variant B, a narrowed reference class (1 Red vs 100 Red) would lead SSA to favor Tails 1:100, mimicking SIA.

  Consequently, the divergence between SIA and SSA is not fundamentally about population size weighting, but about whether observers without your specific evidence (Blue shirts) belong in your reference class. SIA effectively fixes the reference class to "all observers" and weights by existence. SSA leaves the reference class open. The presumptuousness charge against SIA transforms into a charge against SSA users who arbitrarily exclude observers from the reference class to avoid large-world conclusions. The arithmetic shows the principles can converge or diverge based on parameter tuning, suggesting the core philosophical dispute lies in the justification of the reference class, not the mathematical machinery itself.

  ***

  ### 3. Marking Scheme

  **Total Marks: 20**

  **1. SIA Calculation & Cancellation Logic (5 marks)**
  *   **5:** Correctly identifies SIA priors (1:100 Tails) and shows cancellation in Variant A (1:1 posterior) vs. amplification in Variant B (1:100 posterior).
  *   **Error:** Treating SIA priors as 1:1 (ignoring population weighting) results in 0 marks for this section.

  **2. SSA Calculation & Likelihoods (5 marks)**
  *   **5:** Correctly identifies SSA likelihoods based on fractions (A: 1 vs 0.01; B: 0.1 vs 0.1) and derives correct posteriors (A: Heads; B: 50/50).
  *   **Error:** Calculating likelihoods based on absolute numbers rather than fractions within the hypothesis results in 0 marks for this section.

  **3. Reference Class Diagnosis (4 marks)**
  *   **4:** Explicitly states that the SSA verdict in Variant A depends on including Blue shirts in the reference class.
  *   **Error:** Claiming SSA is insensitive to reference class composition results in 0 marks for this section.

  **4. Narrowing Reference Class Effect (3 marks)**
  *   **3:** Correctly notes that narrowing SSA RC to "Red Shirts" makes SSA converge with SIA in Variant A (50/50) and Variant B (1:100).
  *   **Error:** Failing to calculate the narrowed SSA verdict or claiming it remains unchanged results in 0 marks for this section.

  **5. Presumptuous Philosopher Analysis (3 marks)**
  *   **3:** Argues that the worry is relocated (to RC selection) rather than settled, noting SIA isn't always presumptuous (Variant A) but SSA can be made so via RC tuning.
  *   **Error:** Concluding that SIA is vindicated as "never presumptuous" without qualification results in 0 marks for this section.
