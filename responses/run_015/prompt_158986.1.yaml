  # Seminar Handout: Mapping the Modal Landscape

  **Starting Commitment:** We all agree that (1) some identity statements (e.g., "Hesperus is Phosphorus") are necessary but known a posteriori, and (2) a term can refer to an object even if most of what a speaker believes about that object is false.

  **Instructions:** Follow the path that matches your intuitions about the cases. Answer each question based on how you think the semantics *actually works*, not based on which philosopher you think you agree with.

  ---

  ### **Node 1: The A Priori Intension**
  Consider the statement: *"If there is a unique liquid that fills the lakes and falls from the sky, it is water."* You can know this is true without empirical investigation (a priori).
  **Question:** Is this a priori truth-condition part of the **semantic content** (meaning) of the word 'water', or is it merely a rule you use to **identify the referent** without being part of the meaning?

  *   **(A) It is merely a rule for identification (Not Semantic Content).** → *Go to Node 2.*
  *   **(B) It is part of the semantic content.** → *Go to Node 3.*

  ---

  ### **Node 2: The Status of the Necessary A Posteriori**
  (For those who chose A: The a priori rule is not meaning.)
  **Question:** Is the fact that "Water is H2O" is necessary a posteriori a genuine feature of the **proposition** expressed, or is it a misdescription caused by confusing the **sentence** with the proposition?

  *   **(A) Genuine feature of the proposition.** → *Go to Node 4.*
  *   **(B) Misdescription/Confusion.** → **Leaf: The Skeptical Line (Soames)**
      *   *View:* The two-dimensional apparatus misdescribes what is going on. The proposition is necessary a priori; the sentence obscures this.

  ---

  ### **Node 3: The Two Dimensions**
  (For those who chose B: The a priori rule is meaning.)
  When we evaluate a sentence in two ways (e.g., considering "Water might not have been H2O"), what do these two ways represent?
  **Question:** Are they two different kinds of **modality** (ways the world could be vs. ways the world might turn out to be), or are they a distinction between **context** (situation of speaking) and **circumstance** (situation being talked about)?

  *   **(A) Two kinds of modality (Epistemic vs. Counterfactual).** → *Go to Node 5.*
  *   **(B) Context vs. Circumstance.** → *Go to Node 6.*

  ---

  ### **Node 4: Indexicals and Names**
  (For those who chose 2A: Kripkean Direct Reference.)
  **Question:** Do essentially indexed expressions like 'I' and 'Now' require a **separate semantic apparatus** from names like 'Hesperus' and 'Water', or do they fall out of the **same framework**?

  *   **(A) Separate apparatus.** → **Leaf: Kripkean Direct Reference**
      *   *View:* Names refer via causal chains; indexicals refer via context rules. They are distinct mechanisms.
  *   **(B) Same framework.** → **Leaf: Unoccupied Position**
      *   *Status:* **Merely Unattractive.**
      *   *Explanation:* If you deny the a priori rule is semantic content, there is no theoretical motivation to unify names and indexicals under one framework; the standard view keeps them distinct (Kripke vs. Kaplan).

  ---

  ### **Node 5: Conceivability**
  (For those who chose 3A: Epistemic 2Dism.)
  **Question:** Is the framework's treatment of **conceivability load-bearing** (conceivability entails epistemic possibility), or is it **idle machinery** that could be detached without loss?

  *   **(A) Load-bearing.** → **Leaf: Epistemic Two-Dimensionalism (Chalmers)**
      *   *View:* Conceivability is a guide to possibility in the primary sense; deep necessity explains the link between concepts and world.
  *   **(B) Idle machinery.** → **Leaf: Unoccupied Position**
      *   *Status:* **Incoherent.**
      *   *Explanation:* If the dimensions are epistemic/counterfactual modalities, removing the link between conceivability and possibility collapses the "epistemic" dimension into mere psychology, undermining the modal claim.

  ---

  ### **Node 6: Deep Necessity**
  (For those who chose 3B: Contextualist/Metasemantic 2Dism.)
  **Question:** Is the variety of necessity knowable a priori ("deep necessity") meant to do **real philosophical work** (explaining scrutability), or is it only a **bookkeeping device** for tracking which modal claims are a priori?

  *   **(A) Bookkeeping device.** → **Leaf: Metasemantic/Contextualist Picture (Stalnaker/Kaplan)**
      *   *View:* The diagonal proposition tracks what is said in different contexts. Deep necessity is just a label for a priori knowability.
  *   **(B) Real philosophical work.** → **Leaf: Unoccupied Position**
      *   *Status:* **Merely Unattractive.**
      *   *Explanation:* Contextualists treat the a priori as a feature of diagonalization, not a deep metaphysical necessity; claiming it does "real work" pushes the view toward the Epistemic 2Dism of Node 5.

  ---

  ### **Instructor's Note: On the Discriminating Power of the Questions**

  You asked which questions do the real work and which are redundant.

  **The Heavy Lifters:**
  **Node 1 (Content vs. Reference-Fixing)** is the primary divider. It separates the Direct Reference/Skeptical tradition (Kripke, Soames) from the Two-Dimensionalist tradition (Chalmers, Stalnaker). Without this cut, the rest of the tree collapses.
  **Node 3 (Modality vs. Context)** is the secondary divider. It cleanly separates the Epistemic 2Dist (Chalmers) from the Contextualist (Stalnaker). This is the most crucial distinction for students who confuse "ways the world could be" with "ways of fixing context."

  **The Redundant (but Necessary) Cuts:**
  **Node 5 (Conceivability)** and **Node 6 (Deep Necessity)** are theoretically tied to Node 3. If you choose "Epistemic Modality" (Node 3A), you are almost committed to "Load-bearing Conceivability" (Node 5A). If you choose "Context" (Node 3B), you are almost committed to "Bookkeeping" (Node 6A). I have kept them as separate nodes to satisfy your requirement to map the empty logical space, but in practice, a student's answer to Node 3 predicts their answer to Nodes 5 and 6.
  **Node 4 (Indexicals)** is largely redundant for the "Content" branch (both Chalmers and Stalnaker unify names and indexicals), but it is essential for the "No-Content" branch to distinguish the standard Kripkean view (separate apparatus) from the unoccupied position.

  **On the Empty Cells:**
  Notice that the "Unoccupied Positions" are not random gaps. They represent theoretical instability. The "Idle Machinery" Epistemic 2Dist (Node 5B) loses the modal force of their view. The "Real Work" Contextualist (Node 6B) accidentally becomes an Epistemic 2Dist. The tree reveals that the stable positions are stable *because* they avoid these combinations.
