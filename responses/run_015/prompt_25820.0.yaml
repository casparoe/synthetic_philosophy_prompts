      *   *Why is it accurate?* Because "emotion" is a polysemous term. "Belief" is contested. "Existence" is tricky in intentional contexts. If one philosopher defines emotion as necessarily involving existential belief (cognitivism), and another defines it as a physiological response triggered by appraisal (which can be imaginative), they aren't disagreeing about the *phenomenon*, but about the *taxonomy*.
