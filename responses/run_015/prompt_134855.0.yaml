answer: |-
  ### The Large-World Agreement Protocol

  1.  **Resolution Semantics:** Do both parties agree on the physical state required for resolution?
      *   *No:* **Moderator clarifies text. STOP.**
      *   *Yes:* Proceed.
  2.  **Portable Evidence:** Has all linkable data been exchanged?
      *   *No:* Share links. **STOP** (resume later).
      *   *Yes:* Proceed.
  3.  **Unportable Evidence:** Is the gap driven by tacit knowledge (e.g., "lab feel")?
      *   *Yes:* Holder must specify falsification condition ("I move to X% if Y happens"). If unable, evidence is treated as private noise for public calibration.
      *   *No:* Proceed.
  4.  **Prior/Model:** Is it Outside View (base rates) vs. Inside View (specifics)?
      *   *Yes:* Inside View must justify exception to base rate.
      *   *No:* Proceed.
  5.  **Convergence:** Did the probability gap shrink >50% after steps 1-4?
      *   *No:* **Average numbers. STOP.** (Opinion pooling under failed common knowledge).
      *   *Yes:* Continue discussion.
  6.  **Values:** Is the dispute about fairness, preference, or definition of value?
      *   *Yes:* **Moderator decides. STOP.** (Not a factual claim).

  ***

  ### Case Applications

  **1. Lab Ship Date (70/30)**
  Steps 1-2 clear; evidence traded. Step 3 N/A (no tacit claims). Step 4 identifies Model Clash (capacity vs. roadmap). Step 5 shows no convergence after exchange.
  **Output:** Average (50%). Thread closed.
  *Justification:* Portable evidence exhausted; remaining gap is heterogeneous priors.

  **2. Insider (60) vs. Outsider (25)**
  Step 3 triggers. Insider relies on unportable "feel." Per Aumann, private info is not common knowledge; it cannot update the public posterior unless falsifiable. Insider cannot portable-ize.
  **Output:** Average (42.5%). Thread closed.
  *Justification:* Group calibration requires public evidence. Unportable intuition is private variance.

  **3. Loophole/Wording**
  Step 1 fails. Parties disagree on whether the loophole counts as "Yes." This is semantic, not factual.
  **Output:** Moderator clarifies text. Thread closed.
  *Justification:* Instinct confirmed. This is a resolution criterion failure, not a forecasting dispute.

  ***

  ### Limitations

  This procedure cannot distinguish genuine prior differences from status gaming or laziness. Aumann's theorem assumes honest Bayesian updating; it cannot detect strategic stubbornness. If a member refuses to update to protect ego, Step 5 simply averages them in, rewarding inflexibility.

  It also cannot solve "large world" problems (Savage) where the state space is unknown. We assume the question is well-posed; if the world changes such that the question becomes meaningless, the procedure fails. Finally, it treats unportable evidence as noise for the *public* record. While the insider may be privately right (Case 2), the group cannot calibrate on secrets. The procedure optimizes for transparent aggregation, not truth-seeking in the presence of tacit knowledge.
