answer: |-
  Here are 8 questions designed to press your guest on the specific vulnerabilities of Actual Intentionalism, including the multi-author extension. Each includes the main question, the reply she is most likely to offer, and a follow-up designed to block the escape route.

  ### 1. The Retroactivity Problem
  **Question:** You argue that we can't distinguish word-meaning from author-meaning. But suppose a poet dies in 1850, and in 2050 we find a diary proving she intended a specific line as a political allegory no one could have guessed. Did the poem *mean* that in 1850, or does it only acquire that meaning upon discovery?

  **Likely Reply:** "It always meant that. The meaning was fixed at creation; our *access* to it just changed. Discovery is epistemic, not ontological."

  **Follow-up:** "If the meaning was fixed but totally inaccessible to any competent reader for two centuries, in what sense was it a *communicative* act? If meaning can exist in principle without any possibility of uptake, haven't you severed the link between meaning and interpretation entirely?"

  ### 2. Failed Intentions & Private Irony
  **Question:** Consider an author who intends a passage as irony but leaves absolutely no trace of that irony in the text—no tone, no context, no convention. It looks sincere. On your view, is the text ironic?

  **Likely Reply:** "If the intention was truly undetectable, then the author failed to *successfully* mean it. A meaning requires a successful communicative attempt."

  **Follow-up:** "But once you introduce 'success,' aren't you smuggling in a reader-based constraint? To say an intention 'failed' because it wasn't detectable sounds exactly like Hypothetical Intentionalism—the view you reject. Where is the line between a private intention that counts and one that doesn't?"

  ### 3. Fiction and Uptake
  **Question:** In fiction, authors aren't asserting truths; they are inviting us to imagine. If an author intends us to imagine a character as heroic, but the text makes them appear villainous to every reader, what does the text mean?

  **Likely Reply:** "The meaning is what the author intended us to imagine. If the text misfires, the work is flawed, but the meaning remains the author's plan."

  **Follow-up:** "So the text *means* 'hero' but *presents* 'villain'? If the audience's imaginative engagement is entirely driven by the presentation, what work is the 'meaning' doing? Is it just a ghost in the machine that never actually touches the reader's experience?"

  ### 4. The Wikipedia Problem (Instability)
  **Question:** You extend your view to groups: meaning tracks joint intention. But Wikipedia editors churn constantly. If the current editors intend an article to be neutral, but the editors next year intend it to be persuasive, does the *meaning* of the existing sentences change with every edit cycle?

  **Likely Reply:** "Yes, because the corporate or collective agent changes. The text is an artifact of the current governing intention."

  **Follow-up:** "If the same string of sentences means *M1* on Monday and *M2* on Tuesday solely because of a staffing change, doesn't that make 'meaning' too unstable to be a useful object of study? At that point, aren't we just studying office politics rather than semantics?"

  ### 5. The Anonymous Text
  **Question:** If meaning *just is* actual intention, what happens to a brilliant text found with no attribution and no biographical context? Do we have to say it literally has no meaning until we find an author?

  **Likely Reply:** "It has a *potential* meaning, or we treat it *as if* it had an author. But strictly speaking, without an author, there is no intentional act to ground the meaning."

  **Follow-up:** "That implies that two identical texts, one signed and one unsigned, have different ontological statuses. The signed one has meaning; the unsigned one is just marks on a page. Are you comfortable saying the physical text contributes nothing to meaning without the biography attached?"

  ### 6. Conventions vs. Intentions (Humpty Dumpty)
  **Question:** Can an author mean the exact opposite of the conventional meaning of the words without using any linguistic cues to signal that reversal? If I say 'It's raining' but intend 'It's dry,' is that what the sentence means?

  **Likely Reply:** "No, authors are bound by public linguistic conventions. You can't mean anything you like; you need shared tools."

  **Follow-up:** "If you are bound by public conventions, then isn't the *text* (the convention-bound object) doing the heavy lifting, not the *intention*? If the intention can't override convention, why is intention the definition of meaning rather than just a constraint on it?"

  ### 7. Meaning vs. Significance
  **Question:** Critics often distinguish between 'meaning' (what the text says) and 'significance' (why it matters to us). If your theory makes meaning dependent on private biographical facts we often can't know, doesn't everything we actually *value* in literature end up on the 'significance' side?

  **Likely Reply:** "We should care about meaning because we want the truth about the object, not just what's useful for us. Truth matters more than utility."

  **Follow-up:** "But if the 'truth' of the meaning is practically inert—if it can't guide interpretation or appreciation because it's locked in a diary—why should a theory of *literature* prioritize it? Is this a theory of reading, or just a theory of authorial psychology?"

  ### 8. Falsifiability
  **Question:** Finally, what would count as evidence against your view? Is there a case where an author's intention is clear, the text is clear, they conflict, and you would admit the text means what the text says, not what the author meant?

  **Likely Reply:** (Often difficult for intentionalists to answer without conceding.) "Perhaps if the author explicitly disavows the meaning later, or if the convention is so strong it overrides..."

  **Follow-up:** "If conventions can override intentions, or if later disavowals matter, then meaning isn't *just* the actual intention at the time of writing. It seems you're describing a hybrid view. What stops Actual Intentionalism from collapsing into a more moderate position?"
