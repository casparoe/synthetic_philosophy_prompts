answer: |-
  The pattern, restated
  Your pattern describes a bifurcated welfare regime. During production, fish and shrimp are managed as sentient, requiring vet care, with welfare proxy metrics like mortality and feed conversion monitored. However, at slaughter, protections vanish; asphyxiation and crowding replace mandatory stunning, and invasive procedures like eyestalk ablation persist. This creates a philosophical discontinuity: individual suffering is mitigated during growth to maintain stock health, but ignored at death when the animal becomes product. Welfare is measured at the population level, rendering individual experience invisible. The inconsistency lies in treating sickness as a welfare violation while treating slaughter as a logistical event, despite both involving suffering.

  The implicit theory
  The implicit theory is "Functional Welfare." It presupposes welfare is a property of the production system, not the individual subject. Under this view, suffering matters instrumentally: pain during life reduces feed conversion and increases mortality, so it must be managed to ensure stock performance. This explains the veterinary care and oxygen monitoring. However, at slaughter, the animal's function shifts from production unit to commodity. Since dead fish do not grow, suffering at death has no impact on production metrics, rendering it morally negligible within this framework.

  This refines your hypotheses. It rejects (1) because nociception is acknowledged during disease treatment; if pain were merely reflex, treating bacterial outbreaks for welfare reasons would be unnecessary. It inverts (2); life matters more than death because life is where value is generated, not because memory is short. It confirms (3) but masks it as biological efficiency rather than raw cost, making the economic trade-off invisible. The theory relies on a category error: welfare is defined as "absence of production impediments" rather than "absence of suffering." Consequently, population metrics suffice because the stock's performance is the true object of moral concern, not the individual's experience. Sentience is acknowledged but compartmentalized; it is relevant only when it interferes with biological function. Eyestalk ablation is permitted because it enhances reproductive utility, outweighing individual cost. The theory treats the farm as a machine where welfare is lubrication, not a right. The population-level metrics are not a bug but a feature. If welfare is a stock property, individual variance is noise. A few suffering fish are acceptable if mortality remains low. This explains the inconsistency between treating sickness and drowning healthy fish: sickness threatens the stock's efficiency; slaughter is the stock's purpose. The theory presupposes that individual experiential states are epistemically inaccessible or morally secondary to aggregate biological outcomes. It creates a moral blind spot where the transition from subject to object occurs.

  What it strictly needs vs. what it merely fits
  What does this theory strictly need? It requires that moral status be contingent on economic utility. It strictly needs the assumption that welfare obligations cease when production ends. It also needs the epistemic claim that individual suffering cannot be measured reliably, justifying population proxies. Without these, the slaughter practices become indefensible. Crucially, the theory strictly needs the reification of the "stock." It must presuppose that a group of fish is a single moral patient rather than many individuals. If the individual is the unit of moral concern, the population metrics are irrelevant to the slaughter method. The theory also needs a sharp temporal boundary: the "farming phase" vs. the "processing phase." If welfare is continuous, the disconnect collapses.

  What merely fits? The economic exchange rate (Hypothesis 3) fits perfectly but isn't strictly necessary; one could hold this view even if stunning were free, based on tradition or speciesism. The nociception hypothesis (1) fits the slaughter but clashes with the vet care unless one argues disease affects growth while death does not. The brief-life discount (2) fits the shrimp context but fails to explain why life metrics are so rigorous. The theory doesn't need animals to be non-sentient, but it needs sentience to be morally weightless at the point of harvest. It fits the current regulatory landscape but doesn't require it; this is a cultural norm, not just legal compliance. The inconsistency of treating sickness then drowning health is resolved only if sickness is a system error and death is a system output. This preserves the functional integrity of the farm.

  Where it's underdetermined
  Where is this underdetermined? Rival theories could license the same practice. First, *Epistemic Skepticism*: we simply don't know how fish feel during asphyxiation, so we default to established methods. This looks like the same practice but stems from ignorance, not functional theory. Second, *Regulatory Lag*: the practices persist because laws haven't caught up to science, not because of a coherent welfare philosophy. Third, *Utilitarian Aggregation*: if total suffering is low due to short lives, slaughter methods don't tip the scale. Another rival is *Speciesism*: a raw preference for mammals over aquatic life. This licenses the practice without needing a welfare theory.

  Is the sentience assumption load-bearing? Yes. If salmon and shrimp are not sentient, the inconsistency vanishes entirely; there is no welfare issue to reconcile. If they are sentient, as we assume, the theory requires moral compartmentalization that is philosophically unstable. The population metric issue is also underdetermined: it could mean we view welfare as a stock property, or it could simply mean we lack the technology to measure individual fish welfare remotely. The former is a philosophical claim; the latter is a technical limitation. Currently, the practice conflates the two, masking technical inability as moral irrelevance.

  What would actually have to change
  To change this, certification must shift from Functional to Experiential Welfare. First, metrics must individualize. Instead of just mortality, audit behavioral indicators of distress during harvest, like ventilation rates or avoidance behaviors. Second, slaughter methods must align with mammalian standards. Require effective stunning (percussive or electrical) before asphyxiation, validated by insensibility tests. Third, ban invasive breeding procedures like eyestalk ablation unless no alternative exists, forcing innovation in maturation technologies.

  Philosophically, the scheme must recognize the individual as the unit of moral concern, not the stock. This means accepting that high stock health does not excuse individual suffering at death. Compliance would need to audit the kill, not just the grow. This will increase costs, validating Hypothesis 3, but makes the cost explicit rather than hidden. It requires admitting that sentience creates obligations that persist until unconsciousness, not until harvest. Finally, regulatory alignment is needed; certification should exceed local law, not mirror its lag. The certifier must become an advocate for the individual. The change is not just technical but categorical: recognizing the fish as a subject throughout its entire existence, including its end. This resolves the sickness/slaughter inconsistency: treating sickness protects the subject; slaughter must respect the subject. It demands decoupling welfare from production efficiency. Currently, if a stunning method slows the line, it is rejected. A new framework must prioritize welfare over throughput, implying a price increase for the consumer to cover the true cost of sentient slaughter.

  Bottom line
  The current scheme presupposes welfare is a production metric, not a moral right. It treats fish as sentient during growth but objects at death. To resolve this, you must individuate welfare and mandate humane slaughter, accepting the economic cost. Until then, the certification masks a category error as compliance. True compliance requires acknowledging that sentience does not expire at the harvest gate.
