prompt: |-
  Hi — I'm one of five people on the investment committee of a small (~$180m) college endowment. We look at maybe 25 opportunities a year, meet monthly, and every memo we write ends in a number: a probability of hitting the target return, which we then feed into a position size. I've become convinced this is broken in a specific way: it makes us systematically favour whatever is easiest to model, and it lets a manager with a nice backtest of a brand-new strategy outcompete a boring fund with fifteen years of actual data, because the backtest produces a cleaner number. Someone pointed me at Keynes's Treatise on Probability — the bit about probability being a degree of rational belief grounded in evidence, and especially his separate notion of the weight of an argument (how much evidence you have, as opposed to how favourable it is), plus his claim that for a lot of real decisions there just is no numerical probability and people fall back on a convention that the future will look like the past, or on what everyone else is doing.

  Can you turn that into a procedure we could actually run in a committee meeting? I mean: the questions in order, what counts as a real answer to each, when the procedure spits out a no, and when it has to hand the question back to us as a values call. Three things I care about most. (1) A test for whether a number in a memo is grounded in an actual class of comparable cases or is really just model output dressed up — I want the memo to say which. (2) Some rule connecting weight to position size that doesn't collapse into "be more conservative when you know less." (3) What we're supposed to do when there genuinely is no probability: Keynes seems to say falling back on convention is just what everyone does, but I want to know when that's fine and when it's self-deception, and whether "hold cash and wait" is ever an honest output we could defend to a board that hates cash drag.

  Then run it on three cases: (a) re-upping with a private credit manager we've been with through two downturns and who has 15 years of quarterly data; (b) a first-time fund doing something genuinely new with a beautiful backtest and three months of live trading; (c) our single biggest allocation, which we've rolled over for years mostly because its never given us a reason to stop — I have a feeling the procedure is going to tell us something about that one that we don't want to hear. And please say plainly what the procedure can't do for us.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **User:** Member of a 5-person investment committee (IC) for a small college endowment ($180m).
      *   **Current Process:** 25 opps/year, monthly meetings, memos end in a probability of hitting target return $\rightarrow$ position size.
      *   **Problem:** Systematically favors easy-to-model opportunities (clean backtests) over robust but messy historical data. "Probability" is often spurious precision.
      *   **Philosophical Anchor:** Keynes's *Treatise on Probability* (specifically: probability as degree of rational belief vs. *weight* of evidence; non-numerical probabilities; reliance on convention).
      *   **Deliverable:** A concrete procedure for committee meetings based on Keynesian principles.
      *   **Specific Requirements:**
          1.  Test for grounded numbers vs. model output.
          2.  Rule connecting *weight* to position size (not just "be conservative").
          3.  Guidance on non-probabilistic decisions (convention vs. self-deception vs. cash).
          4.  Run the procedure on three specific cases (a, b, c).
          5.  State limitations (what the procedure *can't* do).
      *   **Tone:** Plain, practical, rigorous, respectful of the endowment context.

  2.  **Analyze the Keynesian Framework:**

      *   *Probability ($P$):* The balance of favorable vs. unfavorable evidence. (0 to 1).
      *   *Weight ($W$):* The absolute amount of relevant evidence. (Low to High).
      *   *Key Insight:* A high probability based on low weight is fragile. A moderate probability based on high weight is robust.
      *   *Non-Numerical Probability:* Some situations lack a logical basis for numbering. Forcing a number is deception.
      *   *Convention:* When $W$ is low and $P$ is unknowable, we rely on "the future resembles the past" or "follow the crowd." This is necessary but dangerous if unrecognized.

  3.  **Drafting the Procedure (The "Keynesian Gate"):**

      *   *Goal:* Replace the single "Probability of Success" number with a two-dimensional assessment ($P$ and $W$) and a decision rule.
      *   *Step 1: The Evidence Audit (Weight).* Before discussing returns, discuss data. Is this a reference class or a model?
      *   *Step 2: The Probability Assessment (Belief).* Can we actually number this? If yes, on what basis? If no, admit it.
      *   *Step 3: The Sizing Rule.* Needs to incorporate $W$. High $W$ allows higher conviction. Low $W$ requires smaller size *even if* $P$ looks high.
      *   *Step 4: The Convention Check.* If $P$ is unknowable, are we following convention consciously? Is cash an option?

      *   *Refining the Sizing Rule:* The user wants something better than "be conservative."
          *   Idea: Base size = Function($P$). Adjustment Factor = Function($W$).
          *   If $W$ is low, cap the size regardless of $P$.
          *   If $W$ is high, allow size to reflect $P$ more fully.
          *   *Keynesian Twist:* If $W$ is too low to support a number, size must be "pilot" or "zero."

      *   *Refining the "Grounded Number" Test:*
          *   Require a "Reference Class Statement." If the memo says 70%, it must say "70% of similar X did Y." If it says "Monte Carlo simulation," that's low weight.

      *   *Refining the "Cash/Convention" Question:*
          *   Cash is a valid position if $W$ is low and convention is expensive (valuation is high).
          *   Self-deception check: Are we rolling over because of performance or because of inertia (convention)?

  4.  **Developing the Three Cases:**

      *   *Case (a) Private Credit (15 yrs, 2 downturns):* High Weight. Probability might be moderate (credit risk exists), but Weight is high. Sizing should be stable/robust.
      *   *Case (b) First-time Fund (New strategy, backtest):* Low Weight. Probability might look high (clean backtest), but Weight is near zero. Sizing must be constrained heavily. This addresses the user's specific pain point.
      *   *Case (c) The Big Legacy Allocation:* High Weight (long history), but Probability assessment might be stale. The "Convention" risk is high here. Are we holding because it's good or because it's *there*? This is the "inertia" trap.

  5.  **Addressing the Specific Constraints:**

      *   *Test for Grounded Numbers:* The "Reference Class Declaration."
      *   *Weight-to-Size Rule:* The "Weighted Conviction Cap."
      *   *No Probability/Cash:* The "Convention Disclosure."
      *   *Limitations:* It won't predict returns. It won't stop groupthink if the whole committee is biased. It requires intellectual honesty.

  6.  **Drafting the Content (Iterative refinement):**

      *   *Introduction:* Acknowledge the insight. It's a sophisticated critique of modern portfolio theory/consultant speak.
      *   *The Procedure:* Call it the "Weight & Belief Protocol."
      *   *Step 1 (Weight):* Categorize evidence (Track Record vs. Model).
      *   *Step 2 (Probability):* Allow "Non-Numerical" verdicts.
      *   *Step 3 (Sizing):* Create a matrix or formula. Let's use a "Weight Multiplier."
      *   *Step 4 (Convention):* Explicitly ask "Why are we doing this?"
      *   *Running the Cases:* Apply the steps rigorously.
      *   *Limitations:* Be honest. This is a governance tool, not a crystal ball.

  7.  **Self-Correction/Review during drafting:**

      *   *Critique:* Is the sizing rule too vague?
      *   *Fix:* Make it concrete. Max position size = Base Allocation $\times$ Weight Factor. Weight Factor ranges from 0.2 (Low W) to 1.0 (High W).
      *   *Critique:* Is the "Cash" argument defensible to a board?
      *   *Fix:* Frame cash as "dry powder for high-weight opportunities" rather than "timing the market."
      *   *Critique:* Case C is the tricky one.
      *   *Fix:* Highlight that High Weight + Unexamined Probability = Dangerous Convention. The procedure forces a re-underwriting.

  8.  **Final Polish:** Ensure the tone matches a committee member speaking to peers (professional, direct, slightly academic but practical). Ensure Keynes's concepts are accurately applied (Weight vs. Probability).

      *(Self-Correction on Keynes)*: Make sure not to confuse "Weight" with "Confidence." Weight is the *amount* of evidence. Confidence is the *feeling*. You can have high confidence (Probability) with low Weight (Backtest). The procedure must penalize that.

  9.  **Final Output Structure:**
      1.  The Protocol (The "Weight & Belief" Framework).
      2.  The Three Rules (Grounding, Sizing, Convention).
      3.  Application to Cases A, B, C.
      4.  Limitations.

  (Proceed to generate response based on this thought process.)
answer: |-
  This is a sophisticated diagnosis of a common institutional failure. You are describing the confusion between *risk* (quantifiable uncertainty) and *uncertainty* (unquantifiable ignorance), a distinction Keynes drew sharply and which was later popularized (and often diluted) by Knight and Taleb.

  Your current process treats all uncertainty as risk. It assigns a number to everything, which implicitly claims you have a known frequency distribution. When you prefer a clean backtest (Case B) over messy live data (Case A), you are rewarding *precision* over *accuracy*.

  Here is a procedure based on Keynes's *Treatise on Probability*, specifically adapted for an investment committee. It replaces the single "Probability of Success" number with a two-axis assessment: **Probability ($P$)** and **Weight ($W$)**.

  ***

  # The Weight & Belief Protocol

  **Objective:** To prevent spurious precision from driving capital allocation and to distinguish between *knowing the odds* and *knowing the game*.

  **Pre-Meeting Requirement:** The CIO or lead analyst must complete the **Evidence Audit** (below) before the memo is circulated. The committee cannot vote on a memo that fails this audit.

  ## Step 1: The Evidence Audit (Determining Weight)
  *Keynesian Concept: The "Weight of an Argument" is the absolute amount of relevant evidence, distinct from the balance of favorable evidence.*

  **The Question:** "What is the Reference Class?"
  The memo must declare one of three categories for the opportunity:

  1.  **Class I (Empirical):** There is a live track record of this specific strategy/manager in comparable market regimes. (High Weight)
  2.  **Class II (Analogous):** There is no live track record, but there are comparable assets/strategies with live data. (Medium Weight)
  3.  **Class III (Theoretical):** The strategy is new; data is model-generated or backtested only. (Low Weight)

  **The Test for Grounded Numbers:**
  If the memo assigns a probability of success (e.g., "70% chance of hitting target"), it must cite the **Frequency Basis**.
  *   *Valid Answer:* "70% of similar private credit managers with >10 years data survived two downturns without capital loss."
  *   *Invalid Answer:* "Our Monte Carlo simulation suggests a 70% probability." (This is model output, not evidence. It is Class III.)

  **Committee Action:** If the memo claims a numerical probability but the Reference Class is Class III, the number is struck from the record. It is re-labeled "Unquantifiable Belief."

  ## Step 2: The Probability Assessment (Determining $P$)
  *Keynesian Concept: Probability is a degree of rational belief. In some cases, no numerical value exists.*

  **The Question:** "Can we number this?"
  The committee votes on the nature of the probability, not the size of it.
  *   **Option A (Numerical):** We have enough evidence to assign a frequency-based probability.
  *   **Option B (Ordinal):** We can rank this better/worse than other opportunities, but cannot assign a %.
  *   **Option C (Non-Probabilistic):** We have no rational basis for a number. We are acting on convention or intuition.

  **The "No" Rule:** If the committee votes Option C, the default position is **No Investment**, unless a specific "Convention Justification" (Step 4) is passed.

  ## Step 3: The Sizing Rule (Connecting Weight to Capital)
  *Keynesian Concept: High probability with low weight is fragile. Capital should be exposed to Weight, not just Probability.*

  Current flawed logic: Size $\propto$ Probability.
  **New Logic:** Size $\propto$ (Probability $\times$ Weight Factor).

  **The Weighted Conviction Cap:**
  Every opportunity starts with a theoretical max size based on its expected return and correlation (e.g., 5%). This is then discounted by the Weight Class determined in Step 1.

  *   **Class I (Empirical):** Cap = 100% of theoretical max. (If the model says 5%, you can do 5%.)
  *   **Class II (Analogous):** Cap = 50% of theoretical max. (If the model says 5%, you can do 2.5%.)
  *   **Class III (Theoretical):** Cap = 10% of theoretical max OR "Pilot Size" only. (If the model says 5%, you can do 0.5%.)

  **Why this works:** It prevents a "beautiful backtest" from outcompeting a "boring fund." The backtest might show a 90% probability, but if it is Class III, its size is capped at 10% of the boring fund's potential size. It forces you to pay for the *evidence*, not just the *return*.

  ## Step 4: The Convention Check (Handling Non-Probability)
  *Keynesian Concept: When knowledge is low, we fall back on convention (assuming the future resembles the past, or doing what others do). This is necessary but must be conscious.*

  **The Question:** "If we cannot number this, why are we doing it?"
  If Step 2 yields Option C (Non-Probabilistic), the committee must select one of three justifications:

  1.  **Liquidity Option:** "We hold cash because we cannot value assets. We are paid to wait." (Defensible if valuations are high).
  2.  **Diversification Convention:** "We hold this asset class because all endowments of our size hold it, and we cannot afford to be the only one missing out if it works." (Honest admission of peer pressure).
  3.  **Inertia Convention:** "We hold this because we have always held it." (This is the danger zone).

  **The Self-Deception Test:**
  If justification #3 is selected, the position must be marked for **Re-Underwriting**. It cannot be rolled over automatically. It must be treated as a new Class III opportunity (Low Weight) until proven otherwise.

  ***

  # Running the Procedure on Your Three Cases

  Here is how this protocol changes the outcome of your meetings.

  ### Case (a): The Private Credit Manager (15 Years, 2 Downturns)
  *   **Step 1 (Weight):** **Class I (Empirical).** You have 15 years of quarterly data through stress.
      *   *Grounding Test:* Passed. The probability number can be grounded in historical survival rates and recovery rates of similar vintages.
  *   **Step 2 (Probability):** **Numerical.** You can reasonably estimate the likelihood of loss based on the reference class.
  *   **Step 3 (Sizing):** **100% Cap.** Because Weight is high, you are allowed to size this according to its return profile and correlation.
  *   **Step 4 (Convention):** Not required, as Probability is established.
  *   **Outcome:** This fund wins on *Weight*. Even if its projected return is lower than a flashy new strategy, its capacity to absorb capital is higher. It becomes a core holding.

  ### Case (b): The First-Time Fund (New Strategy, Backtest)
  *   **Step 1 (Weight):** **Class III (Theoretical).** Three months of live trading is noise. A backtest is a model, not evidence.
      *   *Grounding Test:* **Failed.** The memo cannot claim a "70% probability of success" based on a backtest. It must be labeled "Unquantifiable Belief."
  *   **Step 2 (Probability):** **Ordinal or Non-Probabilistic.** You can say "This looks promising," but you cannot number it.
  *   **Step 3 (Sizing):** **10% Cap.** Even if the backtest suggests this should be a 10% portfolio position, the Weight Cap restricts it to 1% (a pilot).
  *   **Step 4 (Convention):** If you invest more than the pilot, you must admit you are acting on **Convention** (e.g., "We need exposure to this trend because everyone else is").
  *   **Outcome:** The "clean number" advantage is neutralized. The manager gets a chance (pilot), but cannot endanger the portfolio. The committee avoids the sin of confusing model precision with reality.

  ### Case (c): The Legacy Allocation (The "Big One")
  *   **Step 1 (Weight):** **Class I (Empirical).** You have years of data.
  *   **Step 2 (Probability):** **The Trap.** You likely haven't calculated a probability in years. You assume it works.
  *   **Step 3 (Sizing):** **100% Cap.** *However...*
  *   **Step 4 (Convention):** **Inertia Check.** When asked "Why are we doing this?", if the answer is "We've always done it," the protocol triggers the **Re-Underwriting Clause**.
  *   **The Hard Truth:** The procedure forces you to treat this legacy allocation as a **Class III (Low Weight)** opportunity *regarding its future viability*, because the evidence you are relying on is stale. The market regime has likely changed since you first invested.
  *   **Outcome:** This is the uncomfortable result you anticipated. You must either:
      1.  Re-underwrite it immediately (generate new Weight).
      2.  Admit you are holding it by Convention (peer pressure/inertia).
      3.  If it's Convention, apply the **Weighted Conviction Cap**. If you can't prove it works *now*, its allowable size drops to the Class III cap (10% of theoretical max). This might force a reduction in a position that has become too large simply because it grew over time without scrutiny.

  ***

  # Defending "Cash and Wait" to the Board

  You asked when "hold cash" is an honest output. Under this protocol, Cash is not "drag"; it is a **Liquidity Option**.

  *   **When it is Self-Deception:** If you hold cash because you are afraid to make a decision, but you claim you are "waiting for the right entry point." That is market timing disguised as prudence.
  *   **When it is Defensible:** When the committee votes **Option C (Non-Probabilistic)** for the majority of available opportunities.
      *   *The Board Pitch:* "Our mandate is to preserve purchasing power. Currently, the *Weight* of evidence for available investments is too low to justify full deployment. We are not timing the market; we are respecting the limits of our knowledge. We hold cash to ensure we have capacity when a High-Weight opportunity arises."
      *   Keynes would argue that acting when probability is unknowable is not prudence; it is gambling. Cash is the only rational position when $W$ is near zero across the board.

  ***

  # What This Procedure Cannot Do

  I must be plain about the limitations, or you will blame the tool when the job is actually hard.

  1.  **It Cannot Predict Returns:** This is a governance filter, not a crystal ball. A High-Weight investment can still lose money. This protocol protects you from *unintended* risk, not *inherent* market risk.
  2.  **It Cannot Stop Groupthink:** If all five committee members believe in the same Convention (e.g., "Tech always goes up"), you will collectively assign High Weight to evidence that supports that view and ignore evidence that doesn't. The protocol requires intellectual honesty; it cannot enforce it.
  3.  **It Requires Discipline on "Re-Underwriting":** The hardest part will be Case (c). Your committee will resist treating a legacy manager as a "new" opportunity. It will feel like an insult to the manager and an admission of past negligence. You will need the Chair to enforce the Re-Underwriting Clause strictly.
  4.  **It Slows You Down:** You will likely pass on more deals. You will invest smaller amounts in new strategies. In a bull market, this will look like underperformance. You must agree *now* that looking "dumb" in a bubble is the cost of not blowing up in a crash.

  **Final Recommendation:**
  Adopt the **Weighted Conviction Cap** first. It is the easiest mechanical change. It immediately solves your problem of the "beautiful backtest" outcompeting the "boring fund" without requiring a philosophical debate at every meeting. If a manager doesn't have the data (Weight), they don't get the capital, regardless of how pretty their probability number looks.
