answer: |-
  Below is the specification of desiderata for a theory of mental causation. This list does not advocate for a specific position but delineates the commitments any robust account must either satisfy, explain away, or explicitly reject at a theoretical cost.

  ### I. Metaphysical Constraints

  **1. The Requirement of Causal Efficacy**
  *   **Specification:** The theory must secure the intuition that mental states (beliefs, desires, pains, intentions) are genuine causes of behavior, not merely correlates or byproducts.
  *   **Motivation:** The "Common Sense" or "Folk Psychological" commitment. If I raise my hand *because* I wanted to vote, the desire must be part of the ontological machinery producing the motion. Without this, agency and moral responsibility collapse.

  **2. The Accommodation of Physical Causal Closure**
  *   **Specification:** The theory must account for the principle that every physical event that has a cause has a sufficient physical cause.
  *   **Status:** This is treated here as a *regulative ideal* derived from the success of the physical sciences, rather than an analytic truth. A theory may reject it, but it must explain why physics appears closed if it is not.
  *   **Motivation:** The conservation laws and the historical trend of explaining physical effects via physical antecedents. To deny this is to invite "nomological danglers" or violations of energy conservation.

  **3. The Constraint of Non-Overdetermination**
  *   **Specification:** The theory must avoid positing that physical effects (like bodily movements) are systematically and redundantly caused by two distinct, sufficient causes (one mental, one physical).
  *   **Motivation:** Parsimony and the intuition that overdetermination is coincidental (e.g., two assassins firing at once). If mental causation implies that every voluntary action is overdetermined by a neural cause and a mental cause, this requires a special metaphysical justification.

  **4. The Preservation of Mental-Physical Distinctness**
  *   **Specification:** The theory must respect the intuition that mental properties are not trivially identical to physical properties (e.g., due to multiple realizability or the phenomenal character of experience).
  *   **Motivation:** Multiple Realizability (a belief can be realized in silicon, neurons, or alien goo) and the Explanatory Gap (physical descriptions seem to leave out "what it is like"). If mental properties are strictly identical to specific neural properties, distinctness is lost, potentially undermining the generality of psychological laws.

  ### II. Explanatory and Conceptual Distinctions

  **5. The Causation vs. Explanation Distinction**
  *   **Specification:** The theory must specify whether it is defending *ontic causation* (a relation in the world) or *causal explanation* (a relation between descriptions). It cannot collapse them without argument.
  *   **Motivation:** One can have a true explanation without a direct causal link (e.g., explaining a shadow's length by the flagpole's height, though the shadow doesn't cause the height). If a theory reduces mental causation to mere explanatory relevance, it risks epiphenomenalism about the *ontology* of the mind. If it insists on ontic causation, it faces the Exclusion Problem more severely.

  **6. The Requirement of Causal Proportionality**
  *   **Specification:** The theory must explain why mental causes are cited rather than neural causes, given that mental descriptions are often coarser-grained than the physical details required to produce the effect.
  *   **Motivation:** Yablo's Proportionality Constraint. A specific neural firing pattern causes a specific muscle contraction. A belief ("I want water") is abstract. If the neural cause is sufficient, the mental cause seems either too vague to do the work or excluded by the specific physical realizer. A theory must explain why the mental level is the *right* level of causal granularity.

  **7. The Integration of Rationalizing and Mechanistic Explanation**
  *   **Specification:** The theory must clarify the relationship between reasons (normative, rationalizing) and mechanisms (blind, physical).
  *   **Motivation:** Davidson's Anomalous Monism highlights that mental events fall under no strict laws, yet they cause actions. A theory must show how normative relations (justification) map onto mechanical relations (force/production) without reducing rationality to physics or making rationality causally inert.

  ### III. Scope and Phenomenology

  **8. Coverage of Mental-to-Physical (M-P) and Mental-to-Mental (M-M) Causation**
  *   **Specification:** The theory should ideally provide a unified account of how mental states cause behavior (M-P) and how they cause other mental states (M-M).
  *   **Motivation:** Cognitive architecture. Beliefs cause other beliefs (inference) as well as actions. A theory that solves M-P by eliminating mental states (eliminativism) fails M-M. A theory that solves M-M via functionalism but fails M-P (dualism) creates a fragmented ontology.

  **9. The Distinction Between Conscious and Unconscious Efficacy**
  *   **Specification:** The theory must state whether phenomenal consciousness (qualia) contributes to causal power, or if causal work is done entirely by unconscious/functional states.
  *   **Motivation:** The "Zombie" intuition. If a physical duplicate without consciousness behaves identically, consciousness appears causally redundant. However, introspection suggests pain causes withdrawal *because* it hurts. A theory must either validate the causal efficacy of phenomenology or explain why it is an illusion.

  ---

  ### IV. The Incompatibility Matrix (Where the Tension Lives)

  The central philosophical problem is that the desiderata above form an inconsistent set. You cannot satisfy all of them simultaneously. The **Causal Exclusion Argument** is precisely the proof of this inconsistency.

  **The Inconsistent Quad:**
  1.  **Efficacy:** Mental states cause physical behavior. (Desideratum 1)
  2.  **Closure:** Every physical effect has a sufficient physical cause. (Desideratum 2)
  3.  **Distinctness:** Mental states are not identical to physical states. (Desideratum 4)
  4.  **No Overdetermination:** Physical effects are not systematically overdetermined. (Desideratum 3)

  *   **The Tension:** If (2) is true, the physical cause is sufficient. If (1) is true, the mental cause is also a cause. If (3) is true, they are different causes. If (4) is true, you cannot have two different sufficient causes. **One must go.**

  **Secondary Tensions:**
  *   **Proportionality vs. Closure:** If Physical Closure holds at the micro-level (neurons), macro-level mental causes (beliefs) violate Proportionality (they are too coarse) or are excluded by the micro-causes.
  *   **Rationalizing vs. Mechanistic:** If reasons are causes, they must enter the mechanical chain. But mechanical chains are blind to normativity. Unifying them risks reducing normativity to physics (losing the "rational" part) or making normativity a separate causal track (violating Closure).
  *   **Consciousness vs. Closure:** If phenomenal consciousness is distinct from functional/physical states (Desideratum 9), and Physics is Closed (Desideratum 2), then Phenomenal Consciousness is Epiphenomenal (violating Desideratum 1).

  ### V. Minimal Revisions for Consistency

  Since no theory can satisfy all desiderata, an adequate theory must propose a **Minimal Revision**—a principled rejection or modification of one constraint to restore consistency. The following are the available logical spaces for a theory to occupy:

  1.  **Reject Distinctness (Identity/Reduction):**
      *   *Revision:* Mental states *are* physical states (Type or Token Identity).
      *   *Cost:* Struggles with Multiple Realizability and the Phenomenal Character of experience.
  2.  **Reject Closure (Interactionist Dualism):**
      *   *Revision:* The physical world is not causally closed; mental states inject energy/information.
      *   *Cost:* Conflicts with established physics; requires new fundamental laws.
  3.  **Reject No Overdetermination (Systematic Overdetermination):**
      *   *Revision:* Mental and physical causes are distinct but non-competitively overdetermine the effect (e.g., via constitution or realization).
      *   *Cost:* Requires redefining "overdetermination" so it isn't coincidental; risks making the mental cause otiose.
  4.  **Reject Efficacy (Epiphenomenalism/Eliminativism):**
      *   *Revision:* Mental states do not cause physical behavior (either they exist without power, or they don't exist at all).
      *   *Cost:* Radical revision of common sense; threatens the basis of knowledge (if beliefs don't cause assertions, why trust them?).
  5.  **Reconceptualize Causation (Interventionism/Counterfactualism):**
      *   *Revision:* Causation is not a "production" relation (which invites exclusion) but a dependency relation. Mental states cause behavior because behavior *depends* on them, even if physics is closed.
      *   *Cost:* Risks collapsing Causation into Explanation (Desideratum 5); may not satisfy the intuition of "ontic oomph."

  **Deliverable Conclusion:**
  An adequate theory of mental causation is not one that satisfies all the above desiderata (which is impossible), but one that **explicitly identifies which desideratum it modifies** and provides a compelling argument for why that specific cost is preferable to the alternatives. The evaluation of any view (interventionism, subset-of-powers, etc.) turns entirely on which line of this Incompatibility Matrix they choose to cut, and how well they defend that cut.
