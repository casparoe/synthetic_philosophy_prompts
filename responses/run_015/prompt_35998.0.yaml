answer: |-
  Good evening. We are gathered here to mark a conclusion. But anyone who knows [Advisor's Name] knows he does not believe in conclusions. He believes in situations. He believes in what we do next.

  To speak of a career is to speak of a life as if it were a book closed on a shelf. But [Advisor's Name] has spent forty years insisting that a person is never a book. A person is the act of writing. So tonight, I will not tell you who he *is*. I will tell you what he has done.

  He has stood in front of restless undergraduates at eight in the morning and chosen to be present. He has looked at a weak argument and refused to let it stand, not because he was stubborn, but because he refused to lie. He has taken the materials of his history, his department, and his era, and he has made something of them. He did not let the field shape him. He shaped the field, again and again, every time he raised a hand to object.

  To his colleagues here: We have disagreed. Often. But no one in this room has ever accused him of hiding behind a system. He never claimed, "The data made me do it." He never claimed, "The tradition required it." He stood behind his words. He owned them. And in doing so, he reminded us that we are responsible for our own ideas, even the ones we wish we hadn't had.

  To his family: You know him best. You know that for thirty years, "bad faith" has been the guest at every Thanksgiving. You know that when he says, "I had no choice," he hears it as an insult. But you also know what that looks like in a home. It looks like showing up. It looks like choosing to listen when he is tired. It looks like making himself a father, not by biology, but by thirty years of Sundays, of games, of drives to school, of being there. He did not inherit a family; he built one, choice by choice.

  Now, he tells us he is retiring. He says he is going to stop working. But we know better. He has warned us that claiming you are finally "done" is just a way to pretend you are no longer responsible for tomorrow. He's convinced us that retiring is just bad faith with a pension plan.

  For the rest of us, that is a comfort. It means he isn't leaving. It means he is simply walking into a new situation. The constraints will change. The students may change. But the obligation to make something of himself remains. He is condemned to be free, even on a golf course. Even in a garden. Even at breakfast.

  So I will not propose a toast to his legacy. A legacy is what you leave behind when you are gone. He is not gone. And he is not finished.

  I propose a toast to his next project. To the choices he has not yet made. To the man he is still becoming.

  To [Advisor's Name].
