  Thinking Process:

  1.  **Analyze the Request:**
      *   **Speaker:** PhD student in philosophy finishing a dissertation on Sartre.
      *   **Audience:** Half philosophers (colleagues, some adversarial on freedom/determinism), half family (wife, adult children, familiar with "bad faith" jokes).
      *   **Occasion:** Advisor's retirement dinner.
      *   **Advisor's Stance:** Strict defender of radical freedom from *Being and Nothingness* (against compatibilism, softening, determinism).
      *   **Constraint 1 (Philosophical/Structural):** Do not treat the advisor as a finished essence. No "he was always," no "he was a product of," no determinist praise. Enact the view that existence precedes essence. The toast must avoid ossifying him into a settled set of qualities (which is the risk of a retirement toast).
      *   **Constraint 2 (Emotional/Linguistic):** Land emotionally for family without technical vocabulary. Give colleagues 2-3 moments of recognition (performing the view, not stating it). At least one genuinely funny line about bad faith/retirement accessible to non-philosophers.
      *   **Length:** Around 4 minutes when read aloud (approx. 500-600 words).
      *   **Format:** Begin with the toast itself, no preamble/commentary.

  2.  **Deconstruct Constraint 1 (The Sartrean Problem):**
      *   Sartre's core idea: Existence precedes essence. We are what we do. We are our projects. To define someone as "a great teacher" or "a stubborn philosopher" is to treat them as an object (en-soi), denying their freedom (pour-soi).
      *   Retirement toasts usually say: "You *were* this," "You *are* that," "Your legacy is fixed."
      *   The Challenge: How to praise someone without freezing them?
      *   Solution: Focus on choices, moments of action, and the open future. Frame his career not as a completed statue but as a series of leaps. Acknowledge that retirement is just another situation to be surpassed. Avoid past tense verbs that imply finality ("He was," "He defined"). Use present or future-oriented language where possible, or frame past actions as choices made in the moment.

  3.  **Deconstruct Constraint 2 (The Audience Problem):**
      *   **Family:** Needs warmth, humor, recognition of his personality without the jargon. They know he uses "bad faith" at Thanksgiving. They need to feel he is loved, not just analyzed.
      *   **Colleagues:** Need to see the philosophical rigor. They should spot the avoidance of essentialist language. They need the "wink" moments.
      *   **Funny Line:** Needs to work on two levels. Example: "Retiring is just pretending you're no longer responsible for what happens tomorrow." (Too technical?) -> "He says retirement is just a fancy way of claiming you're finally an object." -> "He's convinced us all that retiring is just bad faith with a pension."

  4.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the occasion but immediately undercut the idea of "closing the book."
      *   **Middle (The Career):** Describe his work not as a body of work but as a series of choices. Avoid "He taught us." Instead, "He chose to stand here."
      *   **The Funny Line:** Connect retirement to bad faith in a way families get (making excuses) and philosophers get (denying freedom).
      *   **The Family Address:** Acknowledge their experience of him. Not "he was a father" but "he chose to show up."
      *   **The Colleagues Address:** Acknowledge the debates without freezing the positions.
      *   **Closing:** Look forward. Retirement is a new situation, not an end.

      *   *Self-Correction on Tense:* Be careful with "was." Use "has been" or frame it as "In every class..." or "When faced with..."
      *   *Self-Correction on Essence:* Don't say "He is a philosopher." Say "He philosophized." Don't say "He is stubborn." Say "He refused to yield."

      *   *Drafting the Funny Line:* "For those who don't know, 'bad faith' is what he calls it when you blame the traffic for being late. So when he says he's retiring, we know he's just kidding himself about being done." -> Needs to be sharper. "He's told us that claiming you're 'just a retiree' is the ultimate bad faith. But tonight, we'll let him pretend he's finally off the hook."

      *   *Drafting the Family Bit:* "His children know that 'freedom' means cleaning your room without being asked." No, too childish. "His children know that freedom means owning your mistakes." Better.

      *   *Drafting the Colleague Bit:* Avoid saying "He defended freedom." Say "He refused the comfort of causes."

  5.  **Refining the Tone:**
      *   Needs to be warm but intellectually precise.
      *   Needs to feel like a toast (glasses, raising eyes).
      *   Word count check: 4 minutes is roughly 500-600 words at a moderate pace.

  6.  **Writing - Iteration 1 (Mental Outline):**
