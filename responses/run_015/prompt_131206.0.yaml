answer: |-
  # Seminar Section Plan: The Warehouse Protocol
  **Topic:** The Symbol Grounding Problem (SGP)  
  **Time:** 75 Minutes  
  **Students:** 14  
  **Constraint:** No mention of "grounding," "reference," or "intentionality" before minute 60.

  ## 1. Learning Objective
  To experientially demonstrate the asymmetry between **syntactic competence** (perfect translation between symbol systems) and **semantic competence** (successful action in the physical world), specifically highlighting the failure of ungrounded systems to handle novel probes requiring property inference.

  ## 2. Materials & Setup
  **Room:** Movable tables arranged into three isolated "stations."
  **Objects:** 20 opaque film canisters (or small identical boxes).
  *   **Training Set (10 cans):** Labeled T1–T10 on the bottom (hidden from students initially).
  *   **Test Set (10 cans):** Unlabeled.
  *   **Properties:** Each can contains a specific mass of sand (weight) and is wrapped in a specific grit sandpaper (texture).
      *   *Weights:* Vary by 10g increments (e.g., 50g, 60g, 70g...).
      *   *Textures:* 3 distinct grits (Fine, Medium, Rough).
  **Tools:**
  *   1 Digital Scale (placed at Inspector Station).
  *   1 Texture Reference Card (placed at Inspector Station).
  *   Code Sheets & Pens for all groups.
  *   Whiteboard (for Facilitator use only).

  **Group Allocation (14 Students):**
  *   **Group A (Inspectors):** 4 Students. *Permitted:* Touch, weigh, inspect cans. *Forbidden:* Use English words for properties (must use codes).
  *   **Group B (Analysts):** 5 Students. *Permitted:* Receive Group A's data. Translate to new code. *Forbidden:* Touch cans, ask Group A questions.
  *   **Group C (Relayers):** 5 Students. *Permitted:* Receive Group B's data. Translate to third code. *Forbidden:* Touch cans, ask Groups A/B questions.

  ## 3. The Codes (Prepared by Facilitator)
  *   **Code A (Inspector Output):** `W[weight-value]-T[texture-code]` (e.g., `W50-T1`). *Note: Inspectors generate this based on measurement.*
  *   **Code B (Analyst Output):** Greek Letters (α, β, γ...). *Mapping provided: A1→α, A2→β...*
  *   **Code C (Relayer Output):** Shapes (△, □, ○...). *Mapping provided: α→△, β→□...*

  ## 4. Minute-by-Minute Timeline

  ### Phase 1: Encoding & Translation (00:00 – 00:25)
  *   **00:00 – 00:05 (Arrival & Seating):** Seat groups at separate tables. Hand out sealed envelopes.
      *   *Facilitator Script:* "Welcome. Today is a simulation. You will receive role cards. Do not speak to other groups. Do not use English nouns for objects or properties. Use only the codes provided. Begin."
  *   **00:05 – 00:15 (Inspection):** Group A receives Training Set (T1–T10). They weigh and texture-check each. They fill out **Manifest A** (ID + Code).
      *   *Constraint:* They cannot write "heavy" or "rough." They must use the numeric/grit codes on their reference sheet.
  *   **00:15 – 00:25 (Translation Chain):**
      *   Manifest A is passed to Group B. They use a **Translation Key** (A→B) to create **Manifest B**.
      *   Manifest B is passed to Group C. They use a **Translation Key** (B→C) to create **Manifest C**.
      *   *Goal:* Perfect syntactic fidelity.

  ### Phase 2: Verification of Syntax (00:25 – 00:35)
  *   **00:25 – 00:30 (The Audit):** Collect Manifests A, B, and C. Project or write a sample on the board.
      *   *Facilitator Script:* "Group B, does Symbol α correspond to Group A's Item 1?" (Yes). "Group C, does Shape △ correspond to Group B's α?" (Yes).
      *   *Action:* Verify the chain is unbroken. A→B→C is lossless.
  *   **00:30 – 00:35 (The Setup):** Return Manifest C to Group C. Return Manifest A to Group A. Give Group C the **Test Set** (10 unlabeled cans).
      *   *Facilitator Script:* "A Request has arrived from Headquarters. It is written in Code C."

  ### Phase 3: The Novel Probe (00:35 – 00:50)
  *   **00:35 – 00:40 (The Request):** Hand all groups the same slip of paper.
      *   *The Request:* "Retrieve the canister from the Test Set that matches the **weight** of Training Item T3." (Note: T3's weight is known to Group A, but T3 is identified as Shape 'X' in Code C).
      *   *The Trap:* The Test Set cans are unlabeled. To succeed, one must know the *physical weight* of T3 and compare it to the Test Set.
  *   **00:40 – 00:50 (Execution):**
      *   **Group C (Relayers):** Have Code C. Know Shape 'X' = T3. Do *not* know T3's weight. Cannot weigh Test Set (no tools). **Must Guess.**
      *   **Group B (Analysts):** (Optional participation) Can translate 'X' back to 'α' to 'A3'. Still no weight data. **Must Guess.**
      *   **Group A (Inspectors):** Have Manifest A (know T3 = 70g). Have the Scale. Can weigh Test Set cans. **Can Solve.**
      *   *Action:* Each group submits one canister ID (or the physical can).

  ### Phase 4: Scoring & Reveal (00:50 – 01:00)
  *   **00:50 – 00:55 (Results):**
      *   Weigh the canister chosen by Group C. (Likely wrong).
      *   Weigh the canister chosen by Group A. (Correct).
      *   *Facilitator Script:* "Group B and C translated perfectly. Group A retrieved successfully. Why the discrepancy?"
  *   **00:55 – 01:00 (Silent Reflection):** Ask students to write down one sentence explaining the failure without using the forbidden words (grounding, meaning, etc.).

  ### Phase 5: Debrief (01:00 – 01:15)
  *   **01:00 – 01:10 (Mapping):** Introduce the forbidden vocabulary.
      *   Map Group B/C to **Symbol Systems** (Searle's Chinese Room).
      *   Map Group A to **Grounded Agents** (Harnad's Robotic Reply).
      *   Map the Request to the **Novel Probe** (Generalization beyond training data).
  *   **01:10 – 01:15 (The Meta-Objection):** Address the Facilitator's role (see Section 7).

  ## 5. Facilitator Script & Constraints

  **What you CAN say:**
  *   "Verify the translation."
  *   "Submit your choice."
  *   "Group A, you may use the scale."
  *   "Groups B and C, you may not leave your tables."
  *   "The Request requires a match based on a property, not a label."

  **What you CANNOT say (until min 60):**
  *   "Meaning," "Reference," "Grounding," "Semantics," "Intentionality," "Aboutness."
  *   "Group A understands the objects." (Say: "Group A has sensor access.")
  *   "Group B is just shuffling symbols." (Say: "Group B is processing syntax.")

  **Handling Cheating/Smuggling:**
  *   *If Group A writes "Heavy" on Manifest:* Stop them. "Use the code key. Numeric values only."
  *   *If Group B tries to ask Group A "What is A1?":* "No cross-channel communication. Syntax only."
  *   *If the Retrieval is too easy:* Ensure the Test Set weights are close (e.g., 68g, 70g, 72g) so guessing fails.

  ## 6. The "Double Failure" Mechanism
  To satisfy your requirement for two ungrounded systems agreeing but failing:
  1.  **System 1 (Group B):** Translates A→B. Perfect fidelity.
  2.  **System 2 (Group C):** Translates B→C. Perfect fidelity.
  3.  **Agreement:** If you ask Group B "What is A1?" they say "β". If you ask Group C "What is β?" they say "△". The chain is consistent.
  4.  **Failure:** When the Request comes in Code C ("Find the match for △"), Group C cannot solve it. Group B cannot solve it even if handed the request in Code B.
  5.  **Result:** Two distinct syntactic systems, perfectly aligned with each other, jointly incapable of interacting with the world.

  ## 7. Debrief Map (Minute 60+)

  | Activity Moment | Theoretical Concept | Discussion Question |
  | :--- | :--- | :--- |
  | **Phase 1 Success** | **Syntactic Competence** | "Groups B and C were 100% accurate. In what sense were they 'competent'?" |
  | **Phase 3 Failure** | **The Grounding Gap** | "They had all the information Groups B and C had, plus the scale. What did the scale provide that the Translation Key did not?" |
  | **The Novel Probe** | **Systematicity/Prod.** | "The request asked for a comparison not explicitly in the manifest. Why could A do it and C couldn't?" |
  | **The Request** | **Intentionality** | "The slip of paper was *about* a canister. For Group C, was it *about* anything, or just a trigger for a rule?" |

  ## 8. Troubleshooting Predictable Failures

  **1. "Someone will smuggle in ordinary English."**
  *   *Risk:* Inspector writes "Heavy" instead of "70g".
  *   *Fix:* Collect Manifest A *before* Phase 3. If English words appear, redact them publicly before returning the sheet. Frame it as "Protocol Violation" to keep the game frame intact.

  **2. "The retrieval test will be too easy."**
  *   *Risk:* Test Set cans are visibly different.
  *   *Fix:* Use opaque containers. Ensure weight differences are below the "hefting" threshold (use the scale). Ensure textures are similar enough that "roughness" isn't obvious without the reference card.

  **3. "Analysts will try to negotiate meanings."**
  *   *Risk:* Group B asks, "Does α mean heavy?"
  *   *Fix:* Pre-empt this in instructions. "The Translation Key is arbitrary. Do not infer properties from symbols." If they ask, reply: "Process the tokens, not the concepts."

  **4. "Group A fails the retrieval."**
  *   *Risk:* They lose the data sheet or misweigh.
  *   *Fix:* Give Group A a "Logbook" they must fill out. Check it at minute 15. If their data is wrong, the activity fails. Have a backup set of cans ready.

  ## 9. Limitations & The "Smuggling" Objection (Final 5 Minutes)

  You requested the session end on the objection that *you* (the facilitator) are doing the semantic work. This is the **Homunculus Objection**.

  **Script for the Final Close:**
  "We have shown that syntax without sensorimotor contact fails at novel retrieval. Group A succeeded because they touched the cans. But look closer at the setup.
  1.  I chose the weights.
  2.  I defined the codes.
  3.  I wrote the Request.
  4.  I decided that 'matching weight' was the success condition.

  In this room, *I* am the only thing that is truly grounded. Group A is not grounded in the philosophical sense; they are just extensions of *my* grounding. I hooked them up to the world. If I hadn't defined 'weight' as the relevant property, their success would be meaningless.

  This activity demonstrates that causal contact is **necessary** for grounding (Group C failed without it). But it cannot demonstrate that causal contact is **sufficient**. Group A touched the cans, but do *they* understand 'weight'? Or are they just biological transducers for *my* intentions?

  Harnad says robotics solves grounding. Searle says biology is required. This simulation suggests that without an external interpreter (me), the whole system is just gears turning. Next week, bring this question: If I leave the room, does the grounding disappear?"

  ## 10. Why This Design Works for Your Constraints
  1.  **Delays Vocabulary:** The "Warehouse" frame keeps it procedural until the debrief.
  2.  **Stages the Asymmetry:** Translation (B/C) is perfect; Action (A) is successful; Action (B/C) is failed.
  3.  **Novel Probe:** The request (Match Weight of T3) is not a lookup task; it's an inference task requiring property knowledge.
  4.  **Double Failure:** Groups B and C represent two ungrounded systems agreeing perfectly but failing jointly.
  5.  **Ends on Objection:** The final script explicitly hands the mic to the "Smuggling" objection, validating your students' critical instincts rather than shutting them down.
