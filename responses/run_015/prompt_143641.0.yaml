answer: |-
  1. The position restated
  Your view holds composition occurs iff parts exhibit functional interdependence irreducible to pairwise interactions, generating a unified causal profile distinct from isolated sums. This structural restrictivism denies life or consciousness is required, allowing integrated artifacts and ecological networks to qualify as genuine objects while excluding heaps, scattered collections, and colonies lacking higher-order integration. It posits a metaphysical threshold based on causal integration rather than biological status, demanding non-decomposable systemic behavior as the necessary and sufficient condition for the existence of a real composite whole.

  2. Decisive defeaters
  A decisive defeater arises if fundamental physics proves all causal interactions are strictly pairwise. If every multi-body force is reducible to summed two-body interactions, your condition becomes impossible to satisfy, entailing nihilism despite your intent. Similarly, if computational theory demonstrates that any unified causal profile is simulatable by independent agents communicating pairwise, the non-reducibility clause fails empirically. Another decisive blow is the causal exclusion problem: if the composite's causal profile is distinct, it risks overdetermining the effects produced by the parts; if it does not, the unified profile is epiphenomenal, undermining the claim that a genuine object exists. This dilemma forces you to choose between overdetermination and eliminativism. Furthermore, if integration is continuous but existence is binary, you face a sorites paradox. If removing one gate from a processor preserves interdependence, but removing all destroys it, there must be a precise cutoff where existence begins. If no such physical cutoff exists, your view implies ontic vagueness, which many reject as incoherent. You must explain where the metaphysical line is drawn without arbitrary stipulation. Finally, if the distinguishable causal profile is observer-relative rather than mind-independent, the view collapses into conceptualism, contradicting your realist metaphysical aims. Additionally, if distinct composites can occupy the same space, and both claim distinct causal profiles, you face the problem of too many thinkers or causal competitors, forcing you to deny the reality of the parts or the whole. Moreover, if functional interdependence requires active processing, a powered-off processor ceases to exist on your view. If you deny this, you admit interdependence is not necessary; if you accept it, you endorse a wildly counterintuitive ontology where objects pop in and out of existence with power cycles. This instability undermines persistence.

  3. Merely awkward evidence
  Awkward evidence includes borderline cases where interdependence is partial. A damaged processor with non-functional cores might still function as a whole, yet its interdependence is degraded. This requires you to stipulate thresholds of functionality, which seems arbitrary. Similarly, historical artifacts like ruins retain structural relations but lose functional interdependence; denying they are objects contradicts common sense, while accepting them weakens your functional clause. Quantum entanglement presents another awkward case: it exhibits non-pairwise correlations but lacks classical causal profiles. You must either exclude quantum systems from composition or stretch your definition of causation. Additionally, symbiotic relationships, like gut bacteria, show high interdependence but are often considered separate organisms. Classifying them as a single composite object is biologically awkward. These cases do not refute the view but force complex caveats regarding degrees of function, temporal persistence, and scale, making the theory cumbersome without necessarily falsifying it. Furthermore, sleeping organisms maintain structure but reduce functional output; if they remain composites, your functional requirement is too weak, but if they cease, your view conflicts with biological continuity. These cases demand nuanced qualifications rather than abandonment.

  4. What defenders concede
  Defenders would concede that if existence depends on active functioning, objects vanishing during inactivity is a major cost, likely requiring a modal adjustment to dispose-based interdependence. They must also admit that if the non-reducibility condition relies on current computational limits rather than metaphysical facts, the view is contingent on empirical science. Most critically, they would acknowledge that without a precise metric for unified causal profile, the view risks vagueness. If they cannot specify when interdependence becomes non-reducible, the theory lacks predictive power. They would also concede that if the view implies distinct composites coincide, such as the atoms and the processor, it inherits the standard problems of material constitution, requiring a robust account of how two things occupy one space without causal competition. Admitting these vulnerabilities is necessary to refine the theory rather than dogmatically defending implausible consequences regarding object persistence.

  5. Insulation, unfalsifiability, and whether it matters
  The view can be insulated by weakening non-decomposability to a modal claim: parts would interact non-reducibly under certain conditions. This saves artifacts when powered off but risks unfalsifiability, as any plurality could be claimed to have latent interdependence. Broadening functional to include any structural constraint similarly vacuates the condition. Such insulation is a defect because a metaphysical thesis about composition should constrain ontology, not merely describe our conceptual practices. If the conditions are adjusted to accommodate every counterexample, the view loses its explanatory power regarding why some wholes exist and others do not. A theory that cannot be empirically or conceptually constrained fails to distinguish itself from universalism, rendering the restrictivist project vacuous. It becomes a verbal thesis rather than a substantive metaphysical claim.
