  3.  **Evaluate the Steps for Rejection/Modification:**

      *   **Steps (1) & (2):** These are empirical/historiographical claims. Rejecting them undermines the engagement with the primary literature. The user wants to keep (1)-(3).
      *   **Step (3) (The Synthesis):** This is the core theoretical contribution. Rejecting it abandons the project.
      *   **Step (4) (Culpability Attachment):** This is a normative claim derived from (3). It says structural position *alone* (or primarily) grounds culpability. This is a strong candidate for modification.
      *   **Step (5) (Structural Analogy):** This claims modern bureaucracies share *relevant* properties. This is vulnerable. Do they share *all* relevant properties, or just superficial ones?
      *   **Step (6) (The Inference):** This follows from (4) and (5). If (4) or (5) is weakened, (6) fails.
