          *   *Cost:* Risks appearing ad hoc ("Genocide is special").
          *   *Benefit:* Grounds the distinction in the *purpose* of the institution, not just the *process*.

      *   **Rejecting/Modifying (6): The Inference.**
          *   *Idea:* Distinguish between *causal contribution* and *moral culpability*.
          *   *Cost:* Requires a nuanced moral theory.
          *   *Benefit:* Preserves the structural insight without the moral explosion.

  5.  **Address the "Principled Restriction" Challenge:**
      *   The user asks: *Is there a principled way to restrict embedded culpability to genocidal contexts without making that restriction look ad hoc?*
      *   *Key Insight:* The distinction lies in the **normative status of the end goal** and the **availability of exit/voice**.
      *   *Concept:* "Manifest Illegality" or "Radical Evil."
      *   *Concept:* "Complicity vs. Perpetration."
      *   *Concept:* The *density* of the moral violation.

  6.  **Drafting the Response Strategy:**
      *   **Acknowledge the strength:** The synthesis (1-3) is actually quite strong and aligns with contemporary scholarship (e.g., Arendt, but updated).
      *   **Identify the weak link:** Step (5) is the most vulnerable empirical claim, but Step (4) is the most vulnerable normative claim. Step (5) assumes structural similarity implies moral similarity.
