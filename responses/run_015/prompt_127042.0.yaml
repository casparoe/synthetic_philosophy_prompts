      *   *Also:* Step (5) is factually dubious. Do modern supply chains really share the *relevant* properties? They share division of labor, but do they share the *coercive monopoly* of a totalitarian state?

  8.  **Finalizing the Recommendation:**
      *   Advise modifying **Step (4)** (the sufficiency of structure for culpability) and **Step (5)** (the equivalence of structural properties).
      *   Introduce the concept of **"Manifestly Criminal Organizations"** (MCOs).
      *   This avoids ad hoc-ness by relying on established legal/moral philosophy (Nuremberg principles).
      *   Show how this saves the synthesis: Ideology is embedded, *but* culpability requires the organization's purpose to be manifestly violative of fundamental norms.

  9.  **Structure of the Output:**
