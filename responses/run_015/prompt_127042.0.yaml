          *   *Situationist:* Rejecting (4) weakens their claim that context determines action.
          *   *Ideological:* Rejecting (5) strengthens their claim that *specific* ideology matters, not just structure.
          *   *Hybrid:* Needs to specify *which* structural features carry moral weight.
      *   **Provide the Principled Distinction:** Focus on **Knowledge + Intent of the System + Reversibility**.

  7.  **Refining the Argument (Self-Correction during drafting):**
