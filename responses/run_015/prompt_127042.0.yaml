      *   **Goal:** Identify which step to reject or modify to avoid the overgeneralization (Step 6/7) without abandoning the core synthesis (Steps 1-3). The user wants to know the costs of rejecting different steps for the situationist, ideological, and hybrid positions. They specifically ask for a *principled* way to restrict embedded culpability to genocidal contexts.

