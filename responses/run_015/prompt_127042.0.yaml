  *(Self-Correction on Browning/Goldhagen)*: Browning emphasizes situational factors but acknowledges antisemitism existed. Goldhagen emphasizes "eliminationist antisemitism" as the cognitive model. The user's summary is acceptable for the sake of the argument. I will focus on the logic provided.

  *(Key Distinction)*: The move from "structural embedding explains action" (descriptive) to "structural position grounds culpability" (normative) is the leap. That's Step 4. That's where the intervention should happen.

  *(Another Key Distinction)*: Step 5 claims modern bureaucracies share the *relevant* properties. This is an empirical claim that can be challenged. Is "epistemic opacity" in a supply chain the same as in a death squad? One hides harm, the other hides the *nature* of the act.

  *Decision:* Recommend modifying Step 4 (normative leap) and Step 5 (empirical equivalence) by introducing a "Teleological Constraint."

