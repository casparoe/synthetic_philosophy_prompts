  *   Okay, Drawer 1: "Constitutional States > 50 yrs old" (85% survive next 50).
  *   Drawer 2: "Maritime Confederations" (15% survive next 50).
  *   Twist: The Constitution has a "Sunset Clause" triggered by the succession dispute.
  *   Drawer 3: "States with Active Sunset Clauses" (0% survive > 5 yrs).
  *   Actually, let's keep it simpler. The twist re-files it from Drawer 2 back to Drawer 1, or vice versa. Let's make it so the initial choice seems solid, then the twist undermines it completely.

  *Revised Plan for Twist:*
  1.  Initial Info: 70 years old, Constitution, Naval Victory, Succession Dispute.
  2.  Drawer 1: "States with Written Constitutions > 50 yrs" (90% survival).
  3.  Drawer 2: "Maritime Confederations with Succession Disputes" (10% survival).
  4.  Students pick a drawer (blind to rates).
  5.  Open Drawer: See the rate.
  6.  Twist Info: The "Succession Dispute" is actually a mandated constitutional mechanism for leadership rotation, not a crisis.
  7.  New Drawer 3: "Rotational Executive Confederations" (80% survival).
  8.  This shows that *interpretation of facts* dictates the *reference class*, which dictates the *forecast*.

  *Wait, one more check:* "nobody can win by knowing how it turned out." Since it's invented, this is fine.
  "Stakes should be trivial." Points for consistency or for guessing the "Designer's Intent"? No, points for "Best Argument" or just participation. Let's use House Points for the team that most accurately adjusts their confidence.

  *Final check on "What would convince you the game taught the wrong lesson":* If they leave thinking "History is just statistics" or "The future is random." The lesson should be "Categorization is a political act."

