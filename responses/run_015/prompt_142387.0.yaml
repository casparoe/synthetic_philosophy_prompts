answer: |-
  # Game Title: The Meridian Protocol

  **Objective:** To demonstrate that political forecasting is often determined not by the evidence itself, but by the *category* (reference class) into which the evidence is filed.
  **Time:** 45 Minutes.
  **Players:** 16 (Years 11–13).
  **Materials:** Printed Dossiers, Voting Slips, Three Large Envelopes ("Drawers"), Whiteboard/Flipchart.

  ---

  ## 1. Materials & Setup

  **A. The Dossier (One per student)**
  A single-sided handout titled **"STATE BRIEF: THE MERIDIAN CONFEDERATION"**.
  *   **Age:** 70 Years.
  *   **Structure:** A written constitution binding seven island provinces.
  *   **Recent Event:** Decisive naval victory over a rival trade bloc (The Ostracans).
  *   **Current Crisis:** The High Admiral has died. Two provinces claim the right to appoint the successor.
  *   **Economy:** Dependent on shipping tariffs.
  *   **Military:** Large standing navy, negligible army.

  **B. Voting Slips (One per student)**
  Small slips of paper with two checkboxes:
  1.  **Forecast:** Will Meridia survive the next 50 years? [YES] [NO]
  2.  **Confidence:** How sure are you? (1–5)
  *Collect these in a box immediately.*

  **C. The Three Drawers (Large Envelopes on the table)**
  *   **Drawer A (Label: "Constitutional States > 50 Years"):** Inside is a card reading: **"Historical Survival Rate: 85%."**
  *   **Drawer B (Label: "Maritime Confederations"):** Inside is a card reading: **"Historical Survival Rate: 15%."**
  *   **Drawer C (Label: "Rotational Executives"):** Inside is a card reading: **"Historical Survival Rate: 75%."**
  *(Note: These rates are arbitrary but plausible. They are the "truth" for the purpose of the game.)*

  **D. The Twist Card (Kept by you)**
  *   **Text:** "Article 7 of the Meridian Constitution: In the event of a succession dispute, the command of the navy rotates automatically between the two largest provinces for a 5-year interim period. The current 'dispute' is a procedural trigger, not a crisis."

  ---

  ## 2. Run of Play (45 Minutes)

  ### Phase 1: The Inside View (00:00 – 00:15)
  1.  **Hand out Dossiers.** Say nothing else. "Read this silently. You have 5 minutes."
  2.  **Discussion (5 mins).** Allow them to talk in pairs or small groups. Do not intervene.
  3.  **Commitment (2 mins).** Hand out Voting Slips. "Mark your forecast. Fold it. Put it in the box. Do not discuss your vote."
  4.  **Tally.** Quickly count the Yes/No votes on the board. (e.g., 10 Yes, 6 No).

  ### Phase 2: The Reference Class (00:15 – 00:25)
  1.  **The Choice.** Point to Drawer A and Drawer B.
      *   "You have all argued about Meridia's *details*. Now you must choose its *category*."
      *   "Drawer A compares Meridia to old Constitutional States."
      *   "Drawer B compares Meridia to Maritime Confederations."
      *   "You cannot open them yet. Raise your hand: Which drawer is the *correct* lens for Meridia?"
  2.  **The Vote.** Tally the room's choice of lens. (Likely split).
  3.  **The Reveal.** Ask a student from the majority side to open the chosen drawer and read the survival rate aloud.
      *   *If they chose A:* "85% chance of survival." (Room feels optimistic).
      *   *If they chose B:* "15% chance of survival." (Room feels pessimistic).
  4.  **The Anchor.** Write this percentage on the board next to the initial vote. "According to the data in this drawer, this is the probability."

  ### Phase 3: The Re-File (00:25 – 00:35)
  1.  **The Twist.** Hand out the **Twist Card** (or read it aloud). "New intelligence has arrived. This fact was always true, but you didn't have it."
  2.  **The Re-Categorization.** Reveal Drawer C.
      *   "This detail files Meridia not as a 'Disputed Confederation', but as a 'Rotational Executive'."
      *   Ask a student to open Drawer C. Read the rate: **"75%."**
  3.  **The Shift.**
      *   If they started with Drawer B (15%), the forecast has just swung +60 points based on one sentence of legal text.
      *   If they started with Drawer A (85%), the forecast has barely moved, but the *reason* has changed entirely.
  4.  **Final Wager.** "Based on this new rate, would you change your original vote? Stand up if you are changing your mind." Count the switchers.

  ### Phase 4: The Debrief (00:35 – 00:45)
  *Do not lecture until now.*

  1.  **Open the Voting Box.** Reveal the initial votes. Compare them to the "Data" from the drawers.
  2.  **Ask:** "Did Meridia change in the last 20 minutes?" (No). "Did the evidence change?" (Only slightly). "Did the forecast change?" (Yes).
  3.  **Introduce Terms.**
      *   **Inside View:** Arguing about the Admiral, the navy, the islands (Phase 1).
      *   **Reference Class:** The Drawer you chose (Phase 2).
      *   **Base Rate:** The percentage inside the drawer.
      *   **Outside View:** Ignoring the unique details and looking at the statistics of the group (Phase 3).
  4.  **The Lesson:** "You didn't predict the future of Meridia. You predicted the future of the *category* you forced it into. History isn't just what happened; it's what you decide is similar to what happened."

  ---

  ## 3. Payoffs & Stakes
  *   **House Points:** Award 1 point to every student who *changed* their mind after the Twist Card. This rewards intellectual flexibility over stubbornness.
  *   **The "Oracle" Point:** Award 1 bonus point to the student who can name a real historical state that was misfiled (e.g., "France in 1789 looked like a Constitutional Monarchy but was a Fiscal Crisis state").

  ---

  ## 4. Predictable Failures & Mitigations

  **Failure 1: The "Rationalisation" Trap**
  *   **What happens:** Students will choose Drawer A or B not because it's the right category, but because it matches the Yes/No vote they already submitted. They will argue the *category* is correct because it justifies their *prediction*.
  *   **How to handle it:** Call it out gently in Phase 2. "I see most of you who voted 'Yes' are reaching for Drawer A. Ask yourself: Are you choosing the drawer because it fits the state, or because you like the number inside?" Do not stop them, but highlight the behaviour in the debrief. This *is* the bias you want to expose.

  **Failure 2: Arguing the Fake History**
  *   **What happens:** "But a 70-year-old navy wouldn't..." or "In real history, confederations..."
  *   **How to handle it:** Hard stop. "Meridia does not exist. There is no 'actually'. There is only the file in front of you. If you argue about Meridia's reality, you are playing a different game."

  **Failure 3: The Twist Feels Like a "Gotcha"**
  *   **What happens:** They feel cheated that the "Succession Dispute" was actually a "Rotation."
  *   **How to handle it:** Emphasise that intelligence is *always* incomplete. "In 1914, did the diplomats know the mobilisation schedules were automatic triggers? No. They thought it was a dispute. That misclassification caused a war."

  ---

  ## 5. Limitations: What This Game Cannot Stage

  You must say this out loud in the debrief.

  **The Limitation:** "This game gave you the Reference Classes (The Drawers). In the real world, **no one hands you the Drawers.**"
  *   **Explanation:** In the game, Drawer A and B were waiting on the table. In reality, a politician or historian has to *invent* the comparison. They have to decide if 2024 America is more like 1930s Germany or 1970s Britain. That act of creation is where the real bias lives. This game simulates the *selection* bias, but not the *construction* bias.
  *   **Why it matters:** If you don't say this, they might think the solution is just "find the right statistics." The solution is actually "admit you are choosing the statistics."

  ---

  ## 6. Success & Failure Criteria

  **What would convince me the game taught the wrong lesson?**
  If, during the debrief, the students conclude that **"Statistics are more reliable than argument."**
  *   **Why:** That suggests they think Drawer C (75%) is the *truth*. It is not. It is just another invented number. If they leave thinking the "Outside View" is objective truth rather than a different subjective framing, you have replaced one dogma with another.
  *   **Correction:** Ensure you emphasize that Drawer C is *also* a choice. "I could have put a fourth drawer in my pocket that said 'Post-Naval Victory States: 5%'. I chose not to. Why? Because I wanted you to learn a specific lesson. Who chooses the drawers in a government briefing?"

  **What indicates success?**
  If a student says: **"So the forecast was fixed before we even read the dossier, depending on which drawer you put on the table."**
  *   This captures the essence: the *architecture of the decision* determines the outcome more than the *content of the decision*.

  ---

  ## 7. Facilitator's Cheat Sheet (For You)

  *   **Tone:** Bureaucratic, slightly cold. You are the "Archivist," not the Teacher.
  *   **Pacing:** Keep Phase 1 tight. If they argue too long about the naval tactics, cut them off. "Focus on the state's survival, not the battle."
  *   **The Reveal:** When opening the drawers, treat the percentages as hard data. Do not wink. The illusion of objective data is necessary for the disillusionment to work.
  *   **Key Question for Debrief:** "If I had left Drawer B off the table, would Meridia have survived? In this room, yes. In the real world, does leaving the pessimistic comparison off the table make the state survive?" (Answer: No, but it makes the *leaders* believe it will).
