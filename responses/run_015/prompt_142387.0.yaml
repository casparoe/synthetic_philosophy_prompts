prompt: |-
  I'm in the upper sixth and run my school's history and politics society — about sixteen of us, years 11 to 13 — and I have one forty-five-minute lunchtime slot to fill. I want them to feel, rather than be told, how much of a forecast about the future of a state is settled before any evidence is weighed, simply by the choice of which past cases it gets compared to.

  Please design a runnable game for that slot. My one strong constraint is that the case should be invented rather than historical: a made-up seventy-year-old maritime confederation, say, with a written constitution, a recent decisive naval victory and a succession dispute, so that nobody can win by knowing how it turned out and nobody can argue about what really happened in 476 or 1947.

  What I have in mind, though you should improve on it, is that members first commit privately to a forecast about whether the confederation survives another fifty years on the strength of the details I hand them; then have to choose, before anything is resolved, between two drawers of past cases with very different survival rates — all long-lived states as against all maritime confederations, perhaps — with the base rates fixed in advance and printed inside each drawer; and then discover that one further true detail about the same confederation files it just as naturally under a third drawer whose rate points the other way. Stakes should be trivial — a tally or house points, nothing that needs real money — and there should be no lecture up front: I don't want anyone hearing the terms reference class, base rate or outside view until after the debrief.

  Give me the rules, the materials, the payoffs, and what each person physically does and when; then a debrief that maps particular moments in the room onto particular parts of the idea. Tell me what will predictably go wrong the first time I run it — I suspect someone will pick the drawer that merely rationalises the forecast they already gave — and how I should handle it. Be frank about which feature of the outside view the game cannot stage and which I will simply have to say out loud, and tell me what would change your mind about the design: what result in the room would convince you the game had taught the wrong lesson.
reasoning: |-
  Here's a thinking process that leads to the suggested game design:

  1.  **Analyze the Request:**
      *   **Target Audience:** Upper Sixth (Year 13) running a History & Politics society (Years 11-13, approx. 16 students).
      *   **Time:** 45 minutes (lunchtime).
      *   **Goal:** Make them *feel* how forecasting is settled by the choice of past cases (reference class forecasting/base rate neglect), rather than being told.
      *   **Constraint:** The case must be *invented* (no historical knowledge advantage). A 70-year-old maritime confederation with a constitution, naval victory, succession dispute.
      *   **Mechanism:**
          1.  Private forecast (Survive 50 years? Yes/No).
          2.  Choose between two "drawers" of past cases (different base rates).
          3.  Reveal a detail that re-files the case under a *third* drawer (opposing rate).
      *   **Stakes:** Trivial (tally/house points).
      *   **Pedagogy:** No lecture up front. Terms (reference class, base rate, outside view) only in debrief.
      *   **Deliverables:** Rules, Materials, Payoffs, Physical Actions/Timeline, Debrief, Predictable Failures & Mitigations, Limitations of the Game, Success/Failure Criteria.

  2.  **Deconstruct the Core Concept:**
      *   The core cognitive bias is *Base Rate Neglect* combined with *Reference Class Selection*. People tend to focus on the specific details of the case (inside view) and ignore the statistical category it belongs to (outside view). Furthermore, they often choose the category that confirms their intuition.
      *   To make this *felt*, the game needs to create a moment of cognitive dissonance where the "truth" of the prediction shifts solely based on a categorization choice, not new evidence about the *nature* of the state, but about the *group* it belongs to.

  3.  **Drafting the Game Mechanics:**
      *   *Phase 1: The Inside View.* Give them the dossier. Let them argue. Commit to a prediction.
      *   *Phase 2: The Reference Class Choice.* Offer two lenses. Lens A (Optimistic), Lens B (Pessimistic). They must pick which lens they think is "more relevant."
      *   *Phase 3: The Twist.* Reveal a detail that forces a Lens C (or re-categorizes into A/B differently).
      *   *Phase 4: Scoring.* Who got the "right" answer? (Wait, there is no right answer in reality. The game needs to simulate a "reveal" or show that the *method* matters more than the *outcome*).
      *   *Correction:* The prompt asks to show how the *forecast is settled by the choice of cases*. So the scoring shouldn't be "did the state survive?" (since it's invented). The scoring should be "did your method hold up?" or simply tracking the shift in confidence.
      *   *Better approach:* The "Truth" is predetermined by the facilitator based on the *class* chosen. If they choose Class A, the state survives. If Class B, it collapses. This proves the point: the outcome depends on the classification.
      *   *Refinement:* The prompt suggests: "discover that one further true detail about the same confederation files it just as naturally under a third drawer whose rate points the other way."
      *   *Okay, let's structure it:*
          1.  Read Dossier.
          2.  Vote: Survive? (Yes/No).
          3.  Choose a "Comparison Group" (Drawer 1 or Drawer 2).
          4.  Reveal Base Rates for those groups.
          5.  Reveal "Secret Clause" (Detail 2).
          6.  Reveal that Detail 2 moves it to Drawer 3 (or swaps the Base Rate of the chosen drawer).
          7.  Debrief.

  4.  **Developing the Content (The Invented State):**
      *   Name: The Archipelago of Meridia.
      *   Age: 70 years.
      *   Features: Written constitution, naval victory, succession dispute.
      *   *Drawer 1 (Optimistic):* "Constitutional States with Naval Hegemony." (Survival rate: 80%).
      *   *Drawer 2 (Pessimistic):* "Maritime Confederations with Succession Crises." (Survival rate: 20%).
      *   *The Twist:* A specific clause in the constitution regarding the succession.
      *   *Drawer 3 (The Re-file):* "Elective Monarchies with Standing Navies." (Survival rate: 50/50 or extreme). Let's make it stark. Let's make the twist re-categorize it into a group with a *contradictory* rate to their choice.

  5.  **Addressing the Constraints & Logistics:**
      *   16 students. 45 mins.
      *   Need physical "drawers" (envelopes/boxes).
      *   Need private commitment (slips of paper).
      *   Need to avoid lecture initially.

  6.  **Anticipating Problems (The "Rationalization" Trap):**
      *   *Risk:* Students pick the drawer that matches their initial vote.
      *   *Mitigation:* Force them to justify the *category*, not the outcome. Or, make the base rates hidden until *after* they pick the drawer.
      *   *Prompt Instruction:* "choose... before anything is resolved, between two drawers... with the base rates fixed in advance and printed inside each drawer."
      *   *Crucial Step:* They pick the drawer *blind* to the rate? Or pick the drawer *knowing* the rate?
      *   *Interpretation:* "choose... between two drawers... with the base rates... printed inside." This implies they pick the drawer, *then* open it to see the rate. This prevents cherry-picking the rate. They are cherry-picking the *category definition*.
      *   *Wait, re-reading:* "choose... between two drawers of past cases... with the base rates fixed in advance and printed inside each drawer."
      *   *Okay:* They choose which *lens* to apply. Then they see what that lens predicts.
      *   *Then:* "discover that one further true detail... files it just as naturally under a third drawer whose rate points the other way."

  7.  **Designing the Debrief:**
      *   Map the room's anxiety/confidence to the concept.
      *   Introduce terms: Reference Class, Base Rate, Inside vs. Outside View.
      *   Connect to real history (Rome? USSR? Venice?).

  8.  **Limitations:**
      *   The game cannot stage the *difficulty of defining the reference class* in real time. It presents pre-packaged classes. In reality, the hard work is arguing *why* a state belongs to a class.
      *   The game cannot stage the *truth*. Since the state is fake, there is no actual probability. I have to admit this.

  9.  **Refining the "Twist":**
      *   If I just say "Actually it's Drawer 3," they might feel cheated.
      *   The twist needs to be a detail that was *in the text* but overlooked, or a new piece of info that re-contextualizes the old info.
      *   Let's go with a new piece of info that changes the legal nature of the state.
      *   *Detail:* The "Succession Dispute" isn't a bug, it's a feature of the constitution.
      *   *Re-file:* From "Confederation with Dispute" to "Rotating Presidency System."

  10. **Writing the Plan:**
      *   *Title:* The Meridian Protocol.
      *   *Materials:* Dossier, Voting Slips, Three Envelopes (Drawers), Scoreboard.
      *   *Timeline:* 5 min intro, 10 min read/vote, 10 min drawer choice, 10 min twist/reveal, 10 min debrief.
      *   *Predictable Failure:* Students arguing the "truth" of the fake state.
      *   *Handling:* Remind them the state doesn't exist; the *classification* is the variable.

  11. **Self-Correction/Review against Prompt:**
      *   *Constraint Check:* Invented case? Yes. 45 mins? Yes. No lecture up front? Yes. Terms only in debrief? Yes.
      *   *Goal Check:* Feel how forecast is settled by choice of cases? Yes, by showing the prediction flips when the case file changes.
      *   *Specific Request:* "Tell me what will predictably go wrong... and how I should handle it." "Be frank about which feature... the game cannot stage." "What result... would convince you the game had taught the wrong lesson."

  12. **Final Polish:**
      *   Make the instructions crisp for a Sixth Former running it.
      *   Ensure the "Twist" is punchy.
      *   Ensure the debrief questions are Socratic.

  *(Self-Correction during drafting)*: I need to make sure the "Drawers" aren't just "Optimistic vs Pessimistic." They need to be historically plausible categories.
  *   Drawer A: "Post-War Maritime Hegemons" (High survival).
  *   Drawer B: "Multi-Ethnic Confederations" (Low survival).
  *   Twist Detail: The "Naval Victory" was actually a civil war action, not external.
  *   Drawer C: "States in Civil War" (Very low survival).
