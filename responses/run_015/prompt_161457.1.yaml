      *   **The Ergodicity Point:** B is technically right about the math, but A is right that 30 bets isn't "infinity." However, A's strategy is still likely ruinous in 30.
      *   **The Tournament Point:** This is the **Key Insight**. It invalidates both standard frameworks.
      *   **Progress:** Yes, by reframing to "Probability of Beating Friends."
