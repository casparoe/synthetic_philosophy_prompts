answer: |-
  This is a fantastic observation. You have correctly identified that your friends are stuck in a loop because they are arguing past each other, but your intuition about *why* needs a slight adjustment.

  Here is the diagnosis of the disagreement, the verdict on the "tournament" point, and an honest assessment of whether progress is possible.

  ### 1. The Diagnosis: It is a Normative Disagreement Masquerading as Math

  You asked if this is a verbal fight, an empirical question, or two questions wearing one name. It is actually a **normative disagreement about the objective function**, complicated by a **finite horizon problem**.

  Here is what that means in plain English:

  *   **Friend A (EV Maximizer)** has implicitly chosen a **Linear Utility Function**. To them, \$1,000,000 is exactly 1,000 times better than \$1,000. They value the *average* outcome across all possible universes.
  *   **Friend B (Kelly/Log Maximizer)** has implicitly chosen a **Logarithmic Utility Function**. To them, the difference between \$10 and \$20 matters much more than the difference between \$1,000,010 and \$1,000,020. They value the *typical* outcome in this specific universe.

  **Where they are stuck:**
  They agree on the *physics* (the math of how money grows or shrinks). They disagree on the *goals*.
  *   **B is right about the "Ergodicity" claim:** In a repeated betting scenario, the "ensemble average" (what happens across a million parallel versions of you) diverges from the "time average" (what happens to *you* over time). If you bet to maximize expected dollars (A's strategy), you are effectively betting your entire bankroll on every positive-opportunity bet. Even with a 90% win rate, the probability of hitting one losing streak that wipes you out approaches 100% as time goes on. B is mathematically correct that A's strategy leads to ruin.
  *   **A is right about the "Horizon" claim:** 30 bets is not "infinity." The "ruin" B warns about might not happen in 30 rounds. If A gets lucky, A wins big. A is explicitly optimizing for the "right tail" of the distribution (the microscopic chance of being astronomically rich).

  **The Verdict:** This is not a verbal fight about the word "rational." It is a genuine disagreement about **risk tolerance**. A is willing to accept a 95% chance of going broke for a 5% chance of having \$100,000. B is willing to sacrifice that 5% chance to ensure they end the year with \$2,000. Neither is "wrong" mathematically, but B is correct that A's strategy is **existentially fragile**, even in 30 rounds.

  ### 2. The Tournament Point: This is Not a Red Herring

  You suspected the tournament aspect (beating two friends vs. getting rich) might be the key. **You are absolutely right, and they are wrong to ignore it.**

  This point actually **breaks both of their arguments.**

  *   **Why A is wrong for this game:** A wants to maximize absolute dollars. But in your game, having \$1,000,000 means nothing if Friend B has \$1,000,001. A's strategy risks ruin, which guarantees a loss of the tournament.
  *   **Why B is wrong for this game:** B wants to maximize the *growth rate* of their wealth (Kelly). Kelly is designed to make you rich over the long term without going broke. But Kelly is **conservative**. In a tournament with only 3 players, you don't need to be "rich." You just need to be *richer than the other two*.

  **The Tournament Strategy:**
  In a finite tournament, the optimal bet size depends entirely on your **relative standing**, not just the odds of the bet.
  *   **If you are in last place** with 5 bets left: Kelly is too safe. You need *more* variance than Kelly suggests. You need to take risky bets to catch up, even if they have negative expected value (depending on the gap).
  *   **If you are in first place** with 5 bets left: Kelly is too risky. You should bet *less* than Kelly (or nothing) to protect your lead. You want to minimize variance, not maximize growth.

  By ignoring the tournament structure, both friends are solving the wrong problem. They are playing "Solitaire against Nature" when they are actually playing "Poker against Friends."

  ### 3. Can Progress Be Made?

  Yes, but not by continuing their current argument.

  **Is there an empirical threshold (number of bets)?**
  Not really. There is no magic number (like "42 bets") where Kelly suddenly becomes better than EV. The probability of ruin for A's strategy depends on the *size* of the bets and the *edge*. However, for typical sports betting edges, a "Maximize Expected Dollars" strategy (which usually implies betting a very large fraction of the bankroll) has a high probability of ruin even in 30 rounds. If A is betting 50% of their bankroll on coin flips, they have a ~1 in a billion chance of surviving 30 flips without a loss. If they lose once, they are out. So B is practically right, even for 30 bets.

  **Is there a theorem?**
  Yes. The **Cover's Universal Portfolio** and **Game Theory of Tournaments** literature addresses this. The optimal strategy in a contest is not to maximize $E[\text{Wealth}]$, but to maximize $P(\text{Wealth}_{\text{me}} > \text{Wealth}_{\text{others}})$.

  **What would count as progress?**
  Progress would happen if you force them to change the question from *"What is the rational way to bet?"* to *"What is the winning way to get the $20?"*

  If you want to stop the fight, propose this simulation:
  1.  Write a simple script (Python or even Excel).
  2.  Simulate the 30 bets 10,000 times.
  3.  Run three strategies:
      *   **Strategy A:** Bet max EV (e.g., All-in on positive bets).
      *   **Strategy B:** Bet Full Kelly.
      *   **Strategy C:** Bet based on Tournament Standing (Aggressive if behind, Conservative if ahead).
  4.  Measure **Win Rate of the Tournament**, not Final Dollar Amount.

  **My prediction:** Strategy C will win the tournament most often. Strategy A will win the tournament rarely (only when they get insanely lucky), but will go broke most often. Strategy B will finish "in the money" consistently but might not win the top prize if someone else takes a risk and hits.

  ### 4. Why the "Quit Whenever" Idea Confused Them

  You mentioned someone suggested letting the bettor choose when to quit. This introduces **Optimal Stopping Theory**.
  *   For **Friend A**, this is dangerous. If they are winning big, they should quit. But if they are following "Max EV," the math says "keep betting" as long as there is a positive edge, which tempts them to give back their winnings.
  *   For **Friend B**, this validates their view. Kelly maximizes the *rate* of growth, giving you the option to quit earlier with a target sum.

  This confused them because it adds a third variable (Time/Stopping Rule) to a fight that was already stuck on two variables (Bet Size vs. Utility). It didn't solve the core disagreement about what they are trying to maximize.

  ### Summary Advice for You

  You are the only one looking at the actual game being played.

  1.  **Tell them:** "You are both solving for 'How do I get rich?' but the game is 'How do I beat *these two specific guys*?'"
  2.  **Explain:** "Friend A is playing the lottery. Friend B is playing an investment portfolio. Neither is playing a tournament."
  3.  **The Progress:** The only way to settle this is to simulate the **win probability**, not the **expected wealth**. If they care about the $20 and the music rights, they must optimize for rank, not dollars.

  If they refuse to acknowledge the tournament aspect, then the disagreement is indeed unfalsifiable: it is simply a clash of personal risk preferences (A likes high variance, B likes stability), and no amount of math will tell them which "feeling" is correct. But given the stakes ($20), B's approach is pragmatically superior because A's approach likely results in $0 before the year ends.
