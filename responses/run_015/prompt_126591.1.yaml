          *   Job 1: Positive Economics (Prediction/Equilibrium). Needs formal consistency. Choice is king.
          *   Job 2: Normative Economics (Welfare/Policy). Needs a link to "Good." Choice is often flawed (adaptive preferences, misinformation).
          *   The Conflict: Economists want one term to do both jobs to avoid admitting that Positive Economics doesn't automatically yield Normative guidance.
      *   **Path to Progress:**
