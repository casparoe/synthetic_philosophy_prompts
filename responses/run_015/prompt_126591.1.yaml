      *   *Key Insight:* The debate is actually about *Paternalism*. Choice-First is anti-paternalist (Who are we to say you didn't really want that?). State-First allows for paternalism (You wanted X, but Y was better for you). The Oracle doesn't solve the political philosophy disagreement.

