      *   **Task:** Draft a formal memo recommending a course of action regarding a specific bequest.
      *   **Deadline:** Before Thursday's meeting (implies urgency/formality).
      *   **Audience:** Full Board and Estate Representatives.
      *   **Subject:** Bequest of an archive (letters, artifacts, oral histories, photos) conditioned on a permanent gallery titled *The Architecture of Defeat*.
      *   **Content of Gallery:** Four episodes (Confederate Lost Cause, Masada, Kosovo Polje, Dunkirk) framed as "honorable failures converted into founding myths."
      *   **Key Conflict:**
          *   *Donor's Principle:* "Symmetrical Dignity" (defeated causes deserve parity; suppressing them is presentist moral imperialism).
          *   *Critique (Friend/Philosopher):* Institutionalizing legitimizes elite-state machinery, erases microhistory (ordinary soldiers, civilians, coerced participants), and even "history-from-below" (like Dunkirk's little ships) can be myth-making tools that erase others (colonial troops).
      *   **Options:** Approve with conditions, Approve as Temporary, Reject.
      *   **Requirements:** Engage seriously with both sides, make the tension visible, avoid bibliographies/scholarly appeals, polished tone, concrete timeframe.

  2.  **Determine the Recommendation:**
      *   *Option A (Approve Permanent):* Too risky. Validates the "Lost Cause" and other nationalist myths without sufficient critical guardrails. Violates the museum's likely mission of civic memory which should be nuanced.
      *   *Option B (Reject):* Loses the archive. The archive itself (letters, oral histories) is valuable for research, even if the *interpretation* is flawed. Rejecting outright might look like censorship or "presentist moral imperialism," validating the donor's complaint.
      *   *Option C (Temporary Exhibition with Conditions):* This is the strongest middle ground. It accepts the archive (preserving the material) but rejects the *permanent* legitimization of the specific curatorial narrative. It allows for the "symmetrical dignity" argument to be heard without cementing it as truth. It allows time to address the microhistorical critiques.
      *   *Decision:* **Approve as a Temporary Exhibition with Binding Curatorial Conditions and a Review Milestone.** This balances access to the material with ethical responsibility.

  3.  **Structure the Memo:**
      *   **Header:** To, From, Date, Subject.
      *   **Executive Summary:** The recommendation and the core reasoning.
      *   **Context:** The bequest and the donor's conditions.
      *   **Analysis of the Donor's Principle ("Symmetrical Dignity"):** Acknowledge its validity (avoiding presentism).
      *   **Analysis of the Counter-Argument (Myth-Making & Erasure):** Acknowledge the risk of legitimizing harmful narratives and erasing marginalized voices.
