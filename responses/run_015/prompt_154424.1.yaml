      *   *The Tension:* I need to make sure this shines through. If we say "no," we claim moral superiority. If we say "yes," we become a vehicle for propaganda.
      *   *The Solution:* Why Temporary? It treats the donor's thesis as a *hypothesis* to be examined, not a *truth* to be enshrined. It allows the archive to be used without the permanent label.
      *   *Conditions:* Need to address the "microhistory" critique. The exhibition must include the erasures (e.g., colonial troops at Dunkirk, civilians in the Confederate south).
      *   *Timeline:* Needs to be actionable before Thursday, but realistic for the estate.

  5.  **Refining the Tone:**
      *   Must be diplomatic but firm.
