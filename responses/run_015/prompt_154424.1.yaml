      *   *Self-Correction on Dunkirk:* Ensure the specific point about colonial erasure is mentioned as an example of the broader risk.

  6.  **Addressing the Specific Constraint:** "The document should be polished enough to circulate to the full board and to the estate's representatives, and it should avoid bibliographies, reading lists, or appeals to scholarly authority that the recommendation cannot stand behind on its own reasoning."
      *   *Check:* No footnotes. No "As Foucault says..." Just clear reasoning.
      *   *Check:* The tension must be visible. I will add a specific section called "The Institutional Risk."

  7.  **Final Review against the Prompt:**
