answer: |-
  Here is the draft for your mock exam package. It is designed to fit a 60-minute writing window and focuses strictly on reasoning rather than memorized citations.

  ### **Philosophy of Mind Mock Exam: Pain and Motivation**
  **Time Allowed:** 60 Minutes
  **Total Marks:** 20

  **Question 1: The Silent Surgeon**

  Read the following case study carefully:

  > **Case Study: The Silent Surgeon**
  > Dr. Aris is performing a complex operation. During the procedure, she sustains a deep cut on her hand. She reports feeling the sharp, stinging sensation clearly and can identify the location precisely. When asked, she states, "This pain is bad and damaging." However, she does not flinch, withdraw her hand, or feel any urge to stop the surgery. She continues working calmly with no change in her behavior or emotional state. She experiences the sensation and the negative evaluation, but lacks the drive to avoid it.

  **Task:**
  Write an essay responding to the following prompt:

  *To what extent does the case of the Silent Surgeon undermine the Motivational Account of pain's badness? In your answer, you must apply the sensory-affective distinction to the Surgeon's experience and analyze the dissociation between evaluating pain as 'bad' and being motivated to avoid it.*

  ***

  ### **Model Answer**

  The Motivational Account suggests that pain is bad primarily because it commands us to act; its badness is tied to its ability to motivate avoidance. The case of the Silent Surgeon presents a significant challenge to this view by separating the feeling of pain from the urge to stop it. To evaluate this, we must distinguish between the sensory and affective components of pain and examine whether judging pain as "bad" necessarily requires a motivational push.

  First, we must apply the sensory-affective distinction to Dr. Aris. The sensory component involves the discriminative aspect of pain: locating it, identifying its intensity, and recognizing its quality (e.g., sharp or burning). The affective component involves the unpleasantness, suffering, or emotional reaction to that sensation. In standard pain, these are fused. In the Silent Surgeon case, the sensory component is intact; Aris feels the sharp cut and identifies it. However, the affective component appears severed. Usually, the affective dimension is what drives the withdrawal reflex. Aris feels the sensation without the accompanying suffering or emotional distress that typically demands action.

  This separation directly targets the Motivational Account. This account argues that the "badness" of pain is not an intrinsic property but is defined by its imperative force—the way it says "stop this!" to the subject. If pain is bad *because* it motivates avoidance, then a subject who feels pain but lacks the motivation to avoid it challenges the definition. Aris reports the pain is "bad," yet she lacks the motivational drive. This suggests that the evaluation of badness might be cognitive (a judgment) rather than conative (a desire or urge).

  This leads to the crucial dissociation between evaluation and behavioral drive. In normal experience, judging something as "bad" usually comes with a desire to change it. Aris breaks this link. She makes the evaluative judgment ("this is bad") without the conative state (the urge to stop). If the Motivational Account is true, Aris should not truly find the pain bad if she isn't motivated to avoid it; she might be misusing the word "bad." However, if we accept her report that it is bad, then badness cannot be identical to motivation. The badness might be a property she recognizes intellectually, while the motivation is a separate mechanism that has been disabled.

  Therefore, the Silent Surgeon significantly undermines the Motivational Account. It shows that the recognition of pain's badness can exist without the motivational force. If badness were purely motivational, Aris's claim that the pain is "bad" would be false or meaningless. Since her claim seems intelligible, the badness of pain must be distinct from the motivation to avoid it. The case suggests that while motivation is a typical *consequence* of pain's badness, it is not what *constitutes* the badness. The Surgeon proves we can acknowledge the negative value of pain even when the engine of avoidance is disconnected.

  ***

  ### **Marking Scheme (20 Marks Total)**

  **Instructions:** Award 4 marks for each of the five points below. If a point is missing or incorrect, award 0. If it is partially understood but lacks application to the case, award 2.

  | **Must-Hit Point** | **Criteria for Full Marks (4)** | **Common Candidate Error** |
  | :--- | :--- | :--- |
  | **1. Sensory vs. Affective Distinction** | Clearly defines sensory (location/intensity) vs. affective (unpleasantness/suffering) components without confusing them. | Candidates often claim the surgeon feels "no pain" rather than feeling the sensation without the suffering. |
  | **2. Application to the Surgeon** | Correctly identifies that the Surgeon has intact sensory processing but missing affective/motivational response. | Candidates frequently argue the surgeon is lying or numb, ignoring the prompt's stipulation that she feels the cut. |
  | **3. Explanation of Motivational Account** | Accurately explains that this account defines pain's badness by its power to command avoidance or action. | Candidates often define this account as pain being "caused by damage" rather than defined by the urge to avoid. |
  | **4. Dissociation Analysis** | Analyzes the gap between the cognitive judgment ("this is bad") and the lack of behavioral drive (not stopping). | Candidates usually assume that calling something "bad" automatically implies the person wants to change it. |
  | **5. Evaluation of Undermining** | Concludes whether the case refutes the account (Yes/No) with reasoning tied to the dissociation mentioned above. | Candidates often sit on the fence ("it depends") without explaining *why* the case challenges the definition of badness. |

  **Total: /20**
