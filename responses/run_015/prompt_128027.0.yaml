answer: |-
  **The Causal Status of Nothing: Why Omissions Are Real Causes**

  When a storm breaches a flood levee, water rushes in and destroys homes. Physically, the cause is clear: the kinetic energy of the water overcame the structural integrity of the wall. But consider the distributed case: three adjacent towns share a levee system. Each town is responsible for a section. All three skip repairs to save money. The storm hits the boundary where the sections meet, the system fails, and damage occurs. Did the towns' collective inaction cause the damage, or was the storm the sole cause, with the towns merely failing to prevent it?

  This question strikes at the heart of metaphysics and ethics. The **Physical Process View** argues that causes must involve energy transfer or physical production; since an omission is an absence, it cannot transfer energy, and thus cannot be a cause. The **Counterfactual Dependence View** argues that a cause is something that makes a difference; if the towns had repaired the levees, the damage would not have occurred, so the omission is a cause.

  While the physicalist intuition is robust for particle physics, it fails to capture the reality of human agency. I argue that omissions **are real causes**, but only within a normative framework. In the distributed levee case, the collective omission is the explanatorily salient cause of the disaster, not merely a background condition. To deny this is to render concepts like negligence, responsibility, and prevention metaphysically incoherent.

  **The Physicalist Objection**
  The strongest argument against omissive causation is ontological parsimony. As philosopher Jonathan Schaffer has noted, if absences are causes, then causation becomes ubiquitous and trivial. If I do not water my plant, it dies. But the Queen of England also did not water it. If omissions are physical causes, the Queen killed the plant just as much as I did, because her non-action is physically identical to mine (both involve zero energy transfer to the soil).

  In the levee scenario, the physicalist says the storm is the only "real" cause. The storm provided the force; the towns provided nothing. An absence cannot push, pull, or break. To say the towns "caused" the flood is to confuse a cause with a condition. The lack of a repair crew is a static background fact; the storm is the dynamic intruder. On this view, the towns are morally blameworthy for being unprepared, but their unpreparedness did not *cause* the water to move.

  **The Counterfactual and Distributed Defense**
  The counterfactual view rebutts this by focusing on dependence. Causation is about what holds the world together, not just what pushes it around. If the towns had repaired the levees, the homes would be dry. Therefore, the state of the levees determines the state of the homes.

  The distributed nature of the levee case actually strengthens the omissive view. If a single town ignored a private wall, one could argue the storm was the "active" agent. But when three towns collectively omit repair, the failure is systemic. The breach occurs at the boundary—a site of shared responsibility. Here, the "cause" of the failure is the lack of coordination and maintenance across the system. The storm was a foreseeable risk, not a freak anomaly. In engineering and risk assessment, the "cause" of a system failure is rarely the stressor (the storm) but the vulnerability (the unrepaired levee). If we accept the physicalist view, we must say that every flood in history was caused solely by rain, and no levee ever "prevented" a flood—they merely failed to stop the rain's causation. This renders the concept of flood prevention meaningless.

  **The Normative Turn**
  The solution to the Queen of England problem is not to deny omissive causation, but to recognize that omissive causation is **normatively constrained**. Omissions are causes relative to an expectation of action. I caused the plant's death because I was the gardener; the Queen did not, because she had no duty.

  In the levee case, the towns have a statutory and moral duty to maintain the barrier. This duty transforms their inaction from a mere background condition (like the existence of gravity) into a salient cause. The "reality" of the cause here is not physical, but institutional. In the social ontology we inhabit, a breach of duty that leads to harm is a cause of that harm. To claim otherwise is to insist that a legal verdict of "negligence" is a metaphor, when in fact it describes a real causal relation in the social world.

  **Conclusion**
  Therefore, omissions are real causes. The physical process view is correct that absences transfer no energy, but it is incorrect that energy transfer is the only metric of causation. Causation is a concept we use to explain change and assign responsibility. In the distributed levee case, the storm was the *trigger*, but the collective omission was the *cause* of the vulnerability that allowed the trigger to work. Without the omission, the trigger is harmless. We must conclude that the towns caused the damage, because in the domain of human affairs, the failure to prevent a foreseeable harm when under a duty to do so is causally equivalent to producing that harm.

  ***

  **What Would Change My Mind**
  I would abandon this position if a proponent of the Physical Process View could demonstrate a rigorous account of **moral and legal liability that does not rely on causal language.** Currently, we blame the towns because we believe their inaction *caused* the suffering. If one could show that we can assign full negligence and liability solely based on "counterfactual prevention capacity" without ever calling the omission a "cause"—and do so without creating linguistic contradictions or losing explanatory power—I would concede that omissions are merely conditions, not causes. Essentially, if "cause" can be excised from our ethical vocabulary without loss of meaning, the physicalist wins.

  **The Weakest Link**
  The weakest link in my reasoning is the reliance on **normative expectations to determine metaphysical status.** I argue that a duty makes an omission a "real cause." However, this risks conflating *what is* with *what ought to be*. Metaphysics usually describes the structure of reality independent of human rules. By tying the reality of causation to social duties, I may be arguing that omissions are *treated* as causes for practical purposes, rather than proving they *are* causes in a mind-independent sense. If causation is a feature of the universe, it should not depend on whether a town council passed a maintenance bylaw. This tension between pragmatic utility and ontological reality is the vulnerable point of my argument.
