  **Analytical Credence Estimate: 0.25 (25%)**

  This number represents the estimated probability that a non-cognitivist expressivist framework can satisfy your specific constraints (non-ad-hoc embedding + substantive disagreement + no ordinary truth-aptness) based on the current weight of metaethical argumentation.

  ### Decomposition of Uncertainty
  My skepticism is distributed across the three sub-questions as follows. These weights indicate how much of the final verdict depends on the resolution of each specific hurdle:

  1.  **Risk of Quasi-Realist Collapse (50% weight):**
      *   **The Issue:** The most significant drag on the credence is the likelihood that any expressivist semantics robust enough to handle logic inevitably mimics realism so closely that it violates your "no ordinary truth-aptness" constraint.
      *   **Why it rides here:** If the solution works *too* well (e.g., Blackburn's quasi-realism), realists argue it has secretly accepted truth-conditions (minimal or otherwise). If the solution admits truth-conditions, it fails your definition of "solve." If it denies them too strictly, it fails to handle logic. This is the definitional bottleneck.

  2.  **Explanation of Substantive Disagreement (30% weight):**
      *   **The Issue:** Even if embedding works technically, expressivism struggles to explain why moral disagreement feels like a clash of *beliefs* about the world rather than a clash of *preferences* (like disagreeing about ice cream flavors).
      *   **Why it rides here:** A solution that handles conditionals but makes moral argument seem like mere negotiation or coercion fails the "substantive" criterion. Gibbard's norm-expressivism and Schroeder's B-type attitudes attempt this, but the phenomenological gap remains a major source of doubt.

  3.  **Feasibility of Non-Truth-Conditional Embedding (20% weight):**
      *   **The Issue:** Can unasserted sentences ("If stealing is wrong...") function logically without expressing beliefs?
      *   **Why it rides here:** This carries the least weight because technical progress here has been strongest. Mark Schroeder's *Being For* and Gibbard's logic of planning demonstrate that formal semantics *can* be constructed without standard truth-conditions. The doubt is not whether it *can* be done formally, but whether the resulting semantics is "ad-hoc" (engineered solely to save the theory) rather than naturalistic.

  ### Sensitivity Analysis: The Pivot Question
  The sub-question that would move my number most is: **Does the account quietly collapse into quasi-realism?**

  *   **Current State:** My credence is low (0.25) because the literature suggests a dichotomy: either the expressivist semantics is too weak to handle complex logic (credence → 0), or it is strong enough to handle logic but indistinguishable from minimal realism (credence → 0, per your constraints).
  *   **The Move:** If a proponent could demonstrate a semantics that handles embedding and disagreement *without* invoking any notion of truth (even minimal) that realists can co-opt, the credence would jump to **0.60+**.
  *   **Reasoning:** The technical embedding problem (20% weight) is largely considered "solved" in formal terms by Schroeder-style views. The disagreement problem (30% weight) is difficult but arguably manageable via planning norms. The Collapse problem (50% weight) is existential; if the solution is just realism in disguise, the project fails its own foundational premise. Therefore, resolving the boundary between "earning the right to truth-talk" and "accepting truth-aptness" is the single highest-leverage variable.
