  ### Brainstorm Outline

  1.  **Deconstruct the 5 Verdicts:**
      *   *V1 & V4:* Hard determinism metaphysically, but compatibilist ethics (freedom = absence of compulsion, not absence of cause).
      *   *V2:* Epistemic access (prediction) $\neq$ Ontological constraint (coercion).
