  I'm a night supervisor at a recycling plant and I keep coming back to that old story about Gyges and the ring that makes you invisable -- like if nobody can catch you, why stay good? I want whatever philosophy actualy says about that turned into a real decison procedure I can run in my head when I'm alone on shift. Not a sermon: list the questions in order, what counts as a good enough answer, where it stops with a hard no, and where it hands the call back to me because it's values not facts. It needs to cover both the case where wronging leaves zero trace and the case where it might bite later but nobody knows it was me. Then apply it to two things: finding a wallet with cash in the sorting line that'd be burned if I don't take it, and backdating a safety log one day so my crewe doesn't get blamed for a minor slip. The procedure should give me at least one answer I won't like, and it should say flat out where it can't settle the call.
