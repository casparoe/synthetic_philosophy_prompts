          *   *Argument for Concentration:* Liberal specialization. Efficiency. Civilian control *over* professionals (Huntington).
          *   *Synthesis:* A professional army *can* be democratic if strict civilian control exists, but the militia model embeds control structurally rather than procedurally.

      *   **Section 3: Moral Equality and the Distribution of Risk.**
