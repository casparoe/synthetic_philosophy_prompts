answer: |-
  ### Session Title: Two Ways of Meaning – Resolving the Frege-Kripke Deadlock
  **Duration:** 90 Minutes
  **Target Audience:** Philosophy Undergraduates (Post-Frege, Post-Kripke, Pre-2D Semantics)

  ---

  ### I. The Teaching Arc (Conceptual Sequence)

  The session is structured to make Two-Dimensional Semantics (2DS) emerge as the necessary bridge between Fregean cognitive significance and Kripkean metaphysical rigidity.

  **1. The Deadlock (0:00–0:20)**
  *   **Review:** Briefly recap the conflict. Frege saves *cognitive significance* (Hesperus/Phosphorus is informative) but sacrifices *rigidity* (Sense determines reference, so reference varies across worlds where the sense is satisfied differently). Kripke saves *rigidity* (Names pick out the same object in all worlds) but sacrifices *epistemic transparency* (If Water=H2O is necessary, why is it conceivable that Water isn't H2O?).
  *   **The Problem:** We need a framework that allows a term to have a stable metaphysical anchor (Kripke) while acknowledging that our *way of identifying* that anchor is contingent and fallible (Frege).
  *   **Goal:** Tell students: "Today we aren't choosing sides. We are building a tool that lets both sides be right in their own domain."

  **2. The Carrying Example: "Verrier" (0:20–0:45)**
  *   **The Setup:** Introduce a hypothetical historical case. In 1846, Le Verrier posits a planet to explain Uranus's orbit. He names this object **"Verrier."**
  *   **The Reference Fixing:** He fixes the reference using the description: *"The unique planetary body causing these specific orbital perturbations."*
  *   **The Discovery:** Astronomers locate a planet in the predicted region. They name it "Verrier."
  *   **The Twist:** Later physics reveals the orbital math was slightly off; "Verrier" (the object found) does *not* actually cause the perturbations (perhaps it was a mathematical artifact or gravitational lensing). However, the causal chain of reference remains anchored to *that specific object* in the sky, not the causal role.
  *   **Why this beats Hesperus/Phosphorus:**
      *   Hesperus/Phosphorus is an *identity* puzzle (Two names, one object). Students often get stuck on the logic of identity ($a=b$).
      *   "Verrier" is a *reference-fixing* puzzle (One name, two modes of evaluation). It isolates the tension between *how we found the object* (the description) and *what the object is* (the rigid designatum).
      *   It cleanly separates **Epistemic Access** (we identified it via the perturbation description) from **Metaphysical Rigidity** (the name refers to that planet even in worlds where it doesn't cause perturbations).

  **3. Introducing the Two Dimensions as a Solution (0:45–1:05)**
  *   **The Move:** Propose that the meaning of "Verrier" isn't one function from worlds to extensions, but two.
  *   **Primary Intension (The Epistemic Dimension):** Evaluate "Verrier" by asking: "Given a world considered as *actual* (a scenario compatible with our evidence), which object satisfies the reference-fixing description?"
      *   *In our world:* The object satisfying the description (initially thought to be the planet).
      *   *In a counterfactual epistemic scenario:* A different object might satisfy the description "cause of perturbations."
  *   **Secondary Intension (The Metaphysical Dimension):** Evaluate "Verrier" by asking: "Given that *our* world is fixed as actual, and 'Verrier' refers to Planet X, what does 'Verrier' refer to in other counterfactual worlds?"
      *   *Result:* It refers to Planet X in all worlds, regardless of whether Planet X causes perturbations there.
  *   **The Resolution:** Frege was tracking the Primary Intension (why the discovery was informative). Kripke was tracking the Secondary Intension (why the identity is necessary).

  **4. Intercepting Misconceptions (1:05–1:15)**
  *   **Misconception A: Primary Intension = Mental Image.**
      *   *Risk:* Students think Primary Intension is subjective psychology.
      *   *Interception Point:* Immediately after defining Primary Intension.
      *   *Correction:* Emphasize that Primary Intension is a *semantic function* from scenarios to extensions, public and shareable, not a private picture. It is determined by the public reference-fixing description, not individual psychology.
  *   **Misconception B: Two Dimensions = Time (Before vs. After Discovery).**
      *   *Risk:* Students think Primary is "meaning before discovery" and Secondary is "meaning after."
      *   *Interception Point:* During the "Resolution" phase.
      *   *Correction:* Clarify that both intensions apply *now*. We can evaluate "Verrier" primarily (could the describer have picked someone else?) and secondarily (who did they pick?) simultaneously. It is not a temporal revision of belief, but a simultaneous dual-evaluation of content.

  **5. Synthesis and Check (1:15–1:30)**
  *   **Discussion:** Briefly apply this to "Water = H2O." (Primary: The watery stuff; Secondary: H2O).
  *   **The Check Question:** (See below).

  ---

  ### II. The Carrying Example: Why "Verrier" Works

  You must explicitly articulate to the students why we are abandoning Hesperus/Phosphorus for this session.

  **The Explanation:**
  "Hesperus and Phosphorus teach us that two names can pick out one object. But they don't teach us how *one name* can have two different modal profiles. In the 'Verrier' case, we have a single name introduced by a description.
  1.  **Epistemic Access:** Le Verrier could conceive of a world where the perturbations were caused by a different body. Under the **Primary Intension**, 'Verrier' would refer to that other body in that scenario. This captures the Fregean intuition that the reference was contingent on the description.
  2.  **Metaphysical Rigidity:** Once the object was baptized 'Verrier', it refers to *that planet* even in worlds where it drifts harmlessly through space and causes no perturbations. Under the **Secondary Intension**, 'Verrier' tracks the planet, not the causal role.
  This case forces a wedge between *how we identify the referent* (Primary) and *what the referent is* (Secondary) in a way the Venus example does not, because Venus assumes the reference is already secured and focuses only on the identity statement."

  ---

  ### III. Intercepting Misconceptions (Specific Scripts)

  **1. The "Mental Image" Trap**
  *   **When:** 0:50 (Just after defining Primary Intension).
  *   **Student Thought:** "So the Primary Intension is just what Le Verrier had in his head?"
  *   **Instructor Script:** "Stop. If it were just in his head, we couldn't discuss it objectively. The Primary Intension is determined by the *public conditions* required to satisfy the reference-fixing description. It is a rule for picking out an object in any epistemically possible scenario, not a psychological snapshot. If two speakers fix the reference with the same description, they share the Primary Intension, even if their mental images differ."

  **2. The "Temporal Revision" Trap**
  *   **When:** 1:00 (When explaining how the two intensions coexist).
  *   **Student Thought:** "So Primary Intension is what the word meant in 1846, and Secondary is what it means now?"
  *   **Instructor Script:** "No. This is not a history lesson. Both intensions are active *now*. When I ask, 'Could Verrier have failed to cause the perturbations?', I am using the **Secondary Intension** (answer: Yes). When I ask, 'Could the cause of the perturbations have been a comet?', I am using the **Primary Intension** (answer: Yes). We are not talking about belief revision over time; we are talking about two different axes of evaluation available to us at any time."

  ---

  ### IV. The Check Question

  **Scenario:**
  "Consider the name 'Verrier' as we defined it (referring rigidly to Planet X, but fixed by the description 'The cause of the perturbations').
  Imagine a world $W$ that is **metaphysically possible** (counterfactual). In $W$, Planet X exists but floats freely and causes no perturbations. Instead, a Comet Y causes the perturbations Le Verrier observed in our world.
  1.  According to the **Secondary Intension**, what does 'Verrier' refer to in $W$?
  2.  According to the **Primary Intension**, what does 'Verrier' refer to in $W$ (if we treat $W$ as an epistemic scenario considered as actual)?"

  **Correct Answer Key:**
  1.  **Secondary:** Planet X. (The term is rigid; it tracks the original baptised object regardless of properties).
  2.  **Primary:** Comet Y. (The term tracks the satisfier of the reference-fixing description in the scenario considered as actual).

  **Diagnostic:**
  *   If they answer "Planet X" for both: They have collapsed Primary into Secondary (Kripkean dogmatism).
  *   If they answer "Comet Y" for both: They have collapsed Secondary into Primary (Fregean descriptivism).
  *   If they answer "Nothing" for Primary: They think the description must be true of the actual referent to function (missing the epistemic dimension).

  ---

  ### V. Scope and Omissions

  To ensure the session remains conceptual and does not bog down in technical formalism, explicitly state the following are **beyond scope** for this session:

  1.  **Centered Worlds:** Do not introduce the machinery of "centered possible worlds" (worlds + individual + time) to handle indexicals or self-locating belief. Treat scenarios as uncentered for the purpose of this specific name/reference distinction.
  2.  **Context vs. Index:** Do not introduce the Kaplanian distinction between *context of utterance* and *index of evaluation*. While 2DS is related, conflating them will confuse the Primary/Secondary distinction.
  3.  **Formal Semantics:** Do not use double-indexing notation (e.g., $[[A]]_{c, w}$). Keep the discussion in natural language using "considered as actual" vs. "counterfactual."
  4.  **Strong vs. Weak 2Dism:** Do not debate whether the Primary Intension *is* the meaning or just a tool for accessing it. Treat it instrumentally as a solution to the Frege-Kripke deadlock.
