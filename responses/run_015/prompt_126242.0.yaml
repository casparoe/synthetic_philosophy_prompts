      *   *The "Wrong" Argument:* Technology (Green Revolution, Haber-Bosch) decoupled food production from land constraints. Population growth rates have actually slowed (Demographic Transition) without mass famine.
      *   *The "Right but Early" Argument:* Physical limits still exist. Climate change, soil degradation, and water scarcity reintroduce the constraint. The *mechanism* (scarcity leads to crisis) holds, even if the *timeline* was off.
      *   *The Philosophical Core:* Lakatosian Research Programmes? Popperian Falsification? Duhem-Quine Thesis?

  3.  **Evaluate the User's Hypothesis:**
      *   *Ad Hoc Rescue vs. Legitimate Refinement:* This is a strong angle. If Malthusians say "He was right, just wait," is that unfalsifiable?
      *   *Universal Law vs. Tendency:* Also strong. Is Malthus proposing a law of nature or a contingent tendency of pre-industrial societies?
      *   *Different Questions:* One side looks at 1800-1900 data (falsification), the other at 2100 projections (prediction).

  4.  **Formulate a Diagnosis:**
      *   It's not *just* verbal, and it's not *just* substantive. It's a **category error regarding the status of the theory.**
      *   The stall is likely fixable, but not by digging deeper into agronomy. It needs a meta-theoretical shift.
