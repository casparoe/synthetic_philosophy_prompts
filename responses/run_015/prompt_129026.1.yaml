  In a university engineering department, three senior faculty members—Dr. Aris (Chair), Dr. Brea (Safety Officer), and Dr. Cyl (Grants Lead)—must collectively select a laboratory configuration for the upcoming fiscal year from three available options: $L_{old}$ (the current aging setup), $L_{mid}$ (a partially retrofitted compromise), and $L_{new}$ (a state-of-the-art facility). Institutional bylaws grant each agent decisive authority over a specific pairwise comparison of these social outcomes: Aris controls the choice between $L_{old}$ and $L_{mid}$ (operational continuity), Brea controls $L_{mid}$ and $L_{new}$ (safety certification), and Cyl controls $L_{new}$ and $L_{old}$ (funding eligibility). While all three faculty members privately agree that $L_{new}$ is strictly superior to $L_{old}$ in terms of research output, safety, and cost-efficiency, their specific pairwise mandates interact to trap the department in $L_{old}$. Aris, prioritizing budget stability over partial upgrades, prefers $L_{old}$ to $L_{mid}$; Brea, fearing liability in a full transition without intermediate testing, prefers $L_{mid}$ to $L_{new}$; and Cyl, maximizing grant potential, prefers $L_{new}$ to $L_{old}$. Because the committee's procedural rules dictate that the status quo ($L_{old}$) persists whenever a voting cycle prevents a clear majority, the exercise of these minimal liberties forces the adoption of $L_{old}$, an outcome that is strictly Pareto-inferior to the available $L_{new}$.

  ### Disciplinary Walkthrough

  **1. Preference Orderings**
  *   **Dr. Aris:** $L_{new} \succ L_{old} \succ L_{mid}$. (Aris globally prefers the new lab but exercises their right to block the mid-tier option to avoid partial costs).
  *   **Dr. Brea:** $L_{mid} \succ L_{new} \succ L_{old}$. (Brea globally prefers the new lab over the old but exercises their right to block the new lab in favor of the mid-tier to mitigate transition risk).
  *   **Dr. Cyl:** $L_{new} \succ L_{old} \succ L_{mid}$. (Cyl prefers the new lab and exercises their right to block the old lab in favor of the new).

  **2. Liberty Assignments (Decisive Pairs)**
  *   **Aris:** Decisive over $\{L_{old}, L_{mid}\}$. Since Aris prefers $L_{old} \succ L_{mid}$, the social ranking must reflect $L_{old} \succ L_{mid}$.
  *   **Brea:** Decisive over $\{L_{mid}, L_{new}\}$. Since Brea prefers $L_{mid} \succ L_{new}$, the social ranking must reflect $L_{mid} \succ L_{new}$.
  *   **Cyl:** Decisive over $\{L_{new}, L_{old}\}$. Since Cyl prefers $L_{new} \succ L_{old}$, the social ranking must reflect $L_{new} \succ L_{old}$.

  **3. Pareto Dominance**
  *   Compare $L_{new}$ and $L_{old}$.
  *   Aris prefers $L_{new} \succ L_{old}$.
  *   Brea prefers $L_{new} \succ L_{old}$.
  *   Cyl prefers $L_{new} \succ L_{old}$.
  *   **Conclusion:** $L_{new}$ Pareto-dominates $L_{old}$. A Paretian social choice function must select $L_{new}$ (or rank it higher).

  **4. Liberty Blocking**
  *   Combining the liberty constraints: Aris forces $L_{old} \succ L_{mid}$. Brea forces $L_{mid} \succ L_{new}$. By transitivity of the social ordering, this implies $L_{old} \succ L_{new}$.
  *   This directly contradicts Cyl's liberty ($L_{new} \succ L_{old}$) and the Pareto principle.
  *   In an institutional setting where rights are treated as lexical constraints (rights cannot be violated), the cycle ($L_{old} \succ L_{mid} \succ L_{new} \succ L_{old}$) renders the choice function undefined. However, the scenario specifies a realistic procedural default: in the event of a cycle, the status quo ($L_{old}$) persists. Thus, the *interaction* of the liberty assignments forces $L_{old}$.

  **5. Structural Feature Driving the Conflict**
  The conflict is driven by the **overlap of liberty domains across the three agents** forming a closed loop (a Condorcet cycle). Unlike the standard two-agent case which often relies on meddlesome preferences, this three-agent structure creates a "transitive trap." Even though every agent prefers $L_{new}$ to $L_{old}$ globally, the specific pairwise rights assigned to Aris and Brea create a chain ($L_{old} \succ L_{mid} \succ L_{new}$) that logically necessitates $L_{old} \succ L_{new}$, overriding both Cyl's right and the unanimous Pareto preference. The pairwise formulation of the protected sets is crucial; if rights were over single outcomes (e.g., "Aris chooses the lab"), Aris would simply choose $L_{new}$.

  **6. The Defense**
  A defender of the minimal-liberty principle might attack this case on three grounds:
  *   **Domain Assignment:** They could argue the rights are not "minimal" because they overlap to create a cycle. A truly minimal liberal system would assign rights over disjoint pairs (e.g., Aris over $\{A, B\}$, Brea over $\{C, D\}$).
      *   *Counter:* In resource allocation, outcomes are vectors; disjoint pairs are often impossible to define without stripping agents of meaningful control over their specific sphere (e.g., Safety cannot be separated from Funding).
  *   **Preference Intensity:** They might appeal to an asymmetry in intensity, arguing Brea's safety concern ($L_{mid} \succ L_{new}$) outweighs the group's efficiency gain ($L_{new} \succ L_{old}$), thus undermining the Pareto comparison's normative force.
      *   *Counter:* Social choice theory typically treats orderings as ordinal; introducing cardinal intensity moves the framework away from Sen's paradox into utilitarianism, collapsing the liberal distinction.
  *   **Admissible Scope:** They could deny that pairwise liberty assignments fall within the principle's scope if they generate cycles, arguing rights are "waivable" when they lead to Pareto-inferior outcomes.
      *   *Counter:* If rights are waivable whenever they conflict with Pareto, the Liberal condition collapses into pure Pareto efficiency, rendering the "Liberal" constraint vacuous.

  **7. Conclusion**
  The defense does not succeed without collapsing the liberal condition into either pure Pareto efficiency (if rights are waivable upon Pareto conflict) or a full rights-based deontology (if rights are absolute regardless of welfare). This case reveals that the paradox is **not an artifact of two-agent framing**. It survives and intensifies in three-agent generalizations, particularly when rights are formulated over pairs of social outcomes in a resource allocation context. The structural tension between local decisiveness (liberty) and global consistency (Pareto) is inherent to the logic of collective choice itself, not merely a quirk of the "Prude vs. Lewd" example.
