answer: |-
  (a) Case A
  In a data-annotation firm, Contractors label training images under renewable short-term contracts. Non-renewal threatens their professional identity, simulating existential precarity. They reshape the dataset, knowing their judgments train the AI. However, they see only discrete batches, never the integrated model. The Lead Developer designs the architecture and receives public credit for the AI's intelligence. Contractors are recognized as accurate instruments, not co-authors. Because the product's total form remains invisible to them, they encounter only their compliance, not their formative power. The Developer's standing is confirmed by the system's success, which appears to stem from their architecture, not the labeling. The relation stabilizes: Contractors gain certainty as reliable components, not independent creators; Developers retain authority as architects. The asymmetry holds because the objectification is fragmented. Contractors do not see their own reasoning embodied in the whole, only their exertion in the parts. Recognition flows upward without boomeranging.

  (b) Case B
  Change one feature: Contractors now access the integrated model and error rates. They see how their specific distinctions correct systemic bias. In labouring, they encounter their own reasoning embedded in the AI's logic. The product reflects their judgment, not just compliance. Self-certainty emerges: they recognize themselves as constitutive of the intelligence. Consequently, the Developer's authority hollows out. The AI's success depends on the Contractors' unrecognized expertise. The Developer needs the Contractors' judgment to maintain the system, yet denies them standing. This contradiction destabilizes the hierarchy. Contractors demand co-authorship; the Developer cannot claim sole genius without lying about the production process. The relation inverts: the dependent party becomes the essential source of value, the independent party exposed as parasitic on that labour.

  (c) Verdicts
  | Case | Reading 1 (Mechanism) | Reading 2 (Normative) |
  | :--- | :--- | :--- |
  | **A** | **Stability.** No whole object is seen to mirror the self. | **Inversion.** Asymmetry denies standing, inherently unstable. |
  | **B** | **Inversion.** Object mirrors self; confirmation is defective. | **Inversion.** Asymmetry denies standing, inherently unstable. |

  Reading 2 fails on Case A. It assumes normative asymmetry necessarily generates instability, ignoring mechanistic barriers to self-recognition.

  (d) Analysis
  The single feature is **Visibility of the Integrated Product**. In Case A, labour is fragmented; the bondsman shapes parts but never the form of the whole. Removing this feature (granting visibility) collapses Case A into Case B, triggering the inversion. Case A is **outside the story's scope**. Hegel assumes the bondsman forms a *thing*—a coherent object in which form is imposed on matter. Fragmented labour prevents the "formative activity" from becoming visible to the agent. Without seeing the form they imposed, they cannot encounter themselves.

  (e) Verdict
  Case A shows the story requires a threshold of holistic objectification. It is not a counterexample but a boundary condition: the dialectic requires the labourer to see the *system* they sustain, not just the tasks they complete.

  (f) Defence
  **Defender:** Labour itself disciplines desire and builds self-certainty, regardless of seeing the total product. The Contractor knows they are skilled.
  **Reply:** Skill without form is merely technical proficiency. Hegel's inversion requires seeing one's *reason* objectified. Knowing you are a good tool confirms your dependence, not your independence.

  (g) Confidence
  I am least confident that fragmented labour truly blocks self-certainty rather than merely delaying its accumulation.
