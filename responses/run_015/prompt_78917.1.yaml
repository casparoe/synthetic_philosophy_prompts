answer: |-
  ### Assessment of the Premise

  Your intuition is not a stretch; it is precise. The non-identifiability of reward functions in Inverse Reinforcement Learning (IRL) is widely regarded in the philosophy of cognitive science as a formal instance of the underdetermination of theory by evidence. However, your distinction regarding "finite data" is crucial. In standard statistical learning, more data resolves uncertainty. In IRL, if the agent is acting optimally, *infinite* observational data within the same context does not resolve the ambiguity (Ng & Russell, 2000). The identification problem is structural, not statistical.

  Your psychophysics background is directly relevant: inferring a threshold from a psychometric curve is identical in logical structure to inferring a reward from a policy. Both require assuming a noise model and a decision rule to map latent variables to observables. If you change the decision rule (e.g., from probit to logit), the threshold estimate changes, even with perfect data.

  Below is the exam question, reshaped slightly to ensure students cannot solve it by appealing to "more data" alone, followed by the model answer and marking scheme.

  ***

  ### Exam Question (Question 3)

  **Scenario:**
  A subject in a laboratory repeatedly forgoes a modest immediate cash payout to finish a long, tedious calibration task. Two Inverse Reinforcement Learning (IRL) models are fitted to this demonstration set.
  *   **Model A** infers a reward for *task completion*.
  *   **Model B** infers a reward for the *experimenter's approval*, noting that approval (a nod, praise) accompanied completion every time and occurred in no other circumstances.

  On every demonstrated choice, the two models agree, and both reproduce the subject's behaviour exactly on held-out trials drawn from the same distribution.

  **Essay Task:**
  Critically evaluate the claim that either model has recovered the subject's "true" preferences. Your answer must address:
  1.  What specific changes—in the data collection, the model class, the prior, or the definition of preference—would be required to distinguish between Model A and Model B?
  2.  Whether there is a fact of the matter about which model is correct, and if so, what kind of fact it is (e.g., behavioural, neural, or functional).
  3.  What the IRL literature is strictly entitled to claim when it reports having "recovered" a reward function.
  4.  How this identification problem relates to the philosophical thesis of the underdetermination of theory by evidence. Is it merely a case of insufficient data, or something stronger?

  **Marks:** 25
  **Suggested Length:** 1,000 – 1,200 words
  **Time:** 90 minutes

  ***

  ### Model Answer

  The scenario presents a classic identification problem: two distinct latent generative processes (task utility vs. social approval) yield identical observational data (choice policies). Because both models predict the held-out data perfectly, predictive accuracy alone cannot adjudicate between them. This is not a failure of fitting but a structural feature of the inference problem.

  To distinguish the models, one cannot simply acquire more data from the same distribution. As long as the context remains fixed, approval and completion are perfectly collinear. Identification requires breaking this correlation. This could be achieved through **interventional data**: removing the experimenter (removing approval) while keeping the task, or automating the task completion without approval. If the subject persists without approval, Model A is supported; if they cease, Model B is supported. Alternatively, identification could come from **model class constraints**: imposing a prior that rewards must be sparse or intrinsic to the physical state (favoring Model A) versus social state (favoring Model B). However, this does not discover the truth; it merely asserts a bias. Finally, one might change the **notion of preference**: if preference is defined strictly as revealed choice, both models are "true" as they reveal the same choice function. If preference is defined as a causal mechanism within the cognitive architecture, only one can be true.

  This leads to the question of whether there is a fact of the matter. If one adopts an **instrumentalist** stance, there is no fact of the matter beyond predictive adequacy; the reward function is a useful fiction for compression. If one adopts a **realist** stance, there is a fact of the matter grounded in the agent's neural or computational architecture (e.g., which neural circuits encode the prediction error). IRL, as a behavioural modelling technique, typically operates instrumentally. Therefore, strictly speaking, there is no behavioural fact of the matter here, only a psychological or neural one that behavioural data alone cannot access.

  Consequently, when the IRL literature claims to have "recovered" a reward function, it is entitled to claim only that it has found *a* reward function consistent with the observed policy under specific regularisation assumptions (e.g., maximum entropy). It is not entitled to claim it has found *the* reward function driving the agent, unless it can demonstrate robustness across counterfactual interventions. The "recovery" is relative to the inductive bias of the solver, not absolute.

  This connects directly to the **underdetermination of theory by evidence**. However, this is not the mundane underdetermination caused by finite sampling noise, which resolves with more data. This is **structural underdetermination**. Even with infinite observational data, the mapping from policy to reward is one-to-many. This mirrors the Duhem-Quine thesis: evidence tests a whole web of beliefs (the reward function, the transition dynamics, the optimality assumption). Here, the "web" includes the assumption that the reward depends on task states rather than social states. Resolving it requires new theoretical virtues (simplicity, causal isolation) or new types of evidence (intervention), not just more of the same evidence. Thus, IRL provides a formal, mathematical instantiation of philosophical underdetermination, demonstrating that without causal intervention or strong structural priors, latent mental states remain opaque, regardless of data volume.

  ***

  ### Marking Scheme

  **Total Marks:** 25
  **Pass Mark:** 13
  **Distinction Threshold:** 21

  | Point | Requirement | Marks | Typical Error Costing the Point |
  | :--- | :--- | :--- | :--- |
  | **1. Identification Strategy** | Identifies that *more observational data* is insufficient; proposes **interventions** (breaking collinearity) or **structural priors** as the solution. | 5 | Suggesting that "more trials" or "larger dataset" will solve the ambiguity. |
  | **2. Ontological Status** | Distinguishes between **instrumentalist** (reward as predictive tool) and **realist** (reward as causal mechanism) interpretations of "preference." | 5 | Treating the reward function as obviously real without qualifying the ontological stance. |
  | **3. IRL Claims** | Correctly limits the claim: IRL recovers a reward function **consistent with the policy + priors**, not the unique ground truth. | 5 | Stating that IRL "finds the true reward" without caveats regarding non-identifiability. |
  | **4. Underdetermination Type** | Distinguishes **structural non-identifiability** (infinite data won't help) from **statistical uncertainty** (finite data error). | 5 | Conflating the IRL problem with standard overfitting or variance due to small sample sizes. |
  | **5. Synthesis** | Connects the technical IRL constraint to the philosophical concept without reducing one to the other; acknowledges the role of **inductive bias**. | 5 | Treating the philosophy as window-dressing or failing to link it to the technical mechanics of the models. |

  **Strong vs. Competent Distinction:**
  *   **Competent (13–17 marks):** Correctly identifies the collinearity problem and suggests interventions. Acknowledges underdetermination but may treat it as a standard data scarcity issue. Distinguishes prediction from truth but lacks precision on *why* IRL claims are limited.
  *   **Strong (21–25 marks):** Explicitly articulates that the problem is **mathematical non-identifiability**, not statistical noise. Clearly separates the **definition of preference** (revealed vs. mechanistic) from the **method of inference**. Argues that "recovery" is always relative to the inductive bias (regularizer), making the philosophical connection integral to the technical critique rather than an add-on.
