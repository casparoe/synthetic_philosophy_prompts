answer: |-
  Dear friend, I have been thinking about your colloquium presentation next month and the specific composition of the room, and I want to walk you through the question period you are likely to face so you can prepare your responses with the right balance of concession and defense. The first objection will come from the international criminal lawyers in the room, and it will be the most damaging because it attacks the legal core of your thesis rather than the empirical periphery. They will ask whether your concept of horizontal amnesty is compatible with the Rome Statute and customary international law, arguing that the duty to prosecute is a jus cogens norm that cannot be discharged by administrative performance. You must concede immediately that treaty text overwhelmingly favors prosecution and that your argument requires a reinterpretation of existing obligations rather than a simple application of them. Your reply should be that the duty is teleological, owed to victims to restore their status as rights-bearers, and that if horizontal amnesty achieves restoration through public truth and perpetrator acknowledgment more effectively than a trial that ends in acquittal or non-enforcement, it satisfies the underlying norm even if it bypasses the standard mechanism. The soft spot here is that you are asking them to accept a functionalist definition of justice over a formalist one, and many in that room view the procedure itself as the substance of the right, so you will not convince the hardliners but you only need to create enough doubt to make your thesis plausible.

  The second challenge will come from the human rights litigators who will focus on victim agency, asking you by what authority you claim to know what victims want better than they do themselves. You should concede that victims are not monolithic and that many do demand imprisonment, acknowledging that your claim is about what serves their interests in terms of recognition and closure, not necessarily what they express in the immediate aftermath of violence. Your reply is that victim preferences are often shaped by the limited menu of options presented by the state, and that when offered a choice between a decade-long trial with low conviction probability and immediate public acknowledgment with reparations, a significant portion chooses the latter, meaning the duty to prosecute is actually a duty to provide effective remedy. The soft spot is that you likely lack comprehensive survey data to back this up for every context, so you must rely on the theoretical argument that effective remedy is the goal rather than the specific tool of prison.

  Next, one of the quantitative scholars will attack your empirical claim regarding conflict prolongation, specifically hitting you on identification grounds and asking how you distinguish between amnesty causing peace and peace allowing for amnesty. You need to concede that endogeneity is a serious problem in this literature and that your paper does not solve the selection bias inherent in case studies. Your reply should be that the international norm is justified publicly on causal grounds, claiming amnesty leads to instability, so even if the causal mechanism is difficult to isolate, the policy prescription rests on an empirical claim that is currently unsupported by the data they themselves produce. The soft spot here is that if they press you on whether your alternative model is any more robust, you have to admit it is largely theoretical, so pivot back to the normative damage of maintaining a norm based on shaky evidence.

  The other quantitative scholar will likely follow up on measurement, asking how you operationalize accountability without imprisonment and whether your metric for success is simply the absence of renewed violence. You should concede that recidivism is an imperfect proxy for justice and that your framework relies on qualitative measures of social repair. Your reply is that the current metric of success in international criminal law is often just conviction rates, which also fails to measure victim satisfaction or deterrence, so shifting the metric to victim restoration is no less empirical than counting prison sentences. The soft spot is that restoration is harder to quantify than incarceration, leaving you open to charges of vagueness.

  Then the former truth commission staff member will speak from institutional memory, asking whether horizontal amnesty does not simply overwhelm the commission with false confessions from perpetrators seeking immunity without genuine remorse. You must concede that instrumental testimony is a real risk and that verification mechanisms are often under-resourced. Your reply is that horizontal amnesty requires a judicial-style standard of corroboration before immunity is granted, distinguishing it from the blanket amnesties of the past, and that the threat of prosecution remains if the disclosure is incomplete, creating a strong incentive for truth. The soft spot is that truth commissions rarely have the investigative capacity to verify every claim, so your model assumes a level of state capacity that may not exist in the very contexts where amnesty is most contemplated.

  An international lawyer will then raise the issue of equality before the law, arguing that horizontal amnesty creates a two-tiered system where those who can negotiate with the state are treated differently from those who cannot. You should concede that elite capture is a genuine danger in any transitional process. Your reply is that vertical amnesty is inherently class-wide and protects the powerful by default, whereas horizontal amnesty is individualized and requires performance, meaning it is actually more egalitarian than a system where only the low-level perpetrators are caught and tried while leaders remain untouched. The soft spot is that in practice, high-level perpetrators are the ones with the leverage to negotiate, so the theoretical individualization may not hold in political reality.

  A human rights litigator will ask about deterrence, questioning whether removing the threat of prison removes the primary mechanism for preventing future atrocities. You need to concede that the deterrent effect of international criminal law is itself debated and not definitively proven. Your reply is that social ostracization and the permanent public record of guilt achieved through horizontal amnesty can serve as a deterrent in close-knit societies where prison is seen as martyrdom, and that relying solely on incarceration ignores alternative social sanctions. The soft spot is that this is highly context-dependent and may not travel well across different cultural or political systems.

  The final objection from the truth commission staff will concern the burden on victims, asking whether forcing victims to confront perpetrators in a public hearing without the guarantee of punishment re-traumatizes them. You should concede that some victims find cross-examination or public testimony harmful without the closure of a sentence. Your reply is that trials also re-traumatize victims who are then ignored if the case collapses, and that horizontal amnesty centers the victim's narrative as the condition for the perpetrator's relief, shifting the power dynamic from the state versus the accused to the victim versus the accused. The soft spot is that you cannot guarantee this power shift occurs, and if the commission fails to protect victims during testimony, your model exacerbates the harm.

  Finally, there is one question I hope no one asks, but you must be ready for it because it is the most dangerous. Someone will ask whether recognizing horizontal amnesty as satisfying the duty to prosecute provides a legal roadmap for states to evade ICC jurisdiction through complementarity, effectively legitimizing sham processes to shield perpetrators from international scrutiny. This is dangerous because it turns your normative argument into a practical tool for impunity, suggesting that your distinction between vertical and horizontal amnesty is too subtle to survive contact with bad-faith actors who will label any deal as horizontal to escape accountability. If this comes up, do not defend the possibility of abuse; instead, argue that the alternative is a system where states refuse all cooperation because the only option is full prosecution, meaning your framework offers the only viable path to any accountability at all, but acknowledge that strict international oversight on the definition of horizontal amnesty is required to prevent this slide.
