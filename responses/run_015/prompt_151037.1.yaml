answer: |-
  This is a sharp observation. Your friend's term "temporal feudalism" captures a specific tension in land-use law: the conversion of *priority* into *authority*.

  Below is a reconstruction of the implicit theory your neighborhood process relies on, an analysis of what that theory strictly requires versus what merely fits it, and an evaluation of whether "arrival time" can be defended without simply apologizing for incumbency. Per your request, I have appended a section categorizing the epistemic status of these claims (Settled, Contested, or Analytical View).

  ### 1. Reconstructing the Implicit Theory

  The process you describe presupposes a specific ontology of the neighborhood and a specific theory of property rights. It is not merely a bureaucratic hurdle; it is a philosophical stance on who constitutes "the public."

  **A. Property as a Bundle of Expectations (The Reliance Theory)**
  The system treats property ownership not just as rights over a specific parcel, but as a contract with the *surrounding* status quo. When you buy a home, you are implicitly buying the current zoning and built form of the neighborhood as an amenity.
  *   **The Theory:** Property value and utility are derived from stability. Therefore, existing owners have a "reliance interest" in the continuation of the current physical environment.
  *   **The Implication:** Change is presumptively a harm (a taking of expectations) that must be justified by the developer, whereas the status quo requires no justification.

  **B. Stakeholders as Physical Presentists**
  Standing is granted based on physical proximity and current occupancy.
  *   **The Theory:** Only those currently bearing the "burden" of a decision (noise, shadows, traffic) have a right to shape it.
  *   **The Implication:** Future residents are hypothetical; their interests are represented only by the developer (who is presumed to be an agent of profit, not community). Because future residents do not yet bear the burden, they have no voice. This ignores that the *absence* of housing is also a burden borne by those excluded from the neighborhood.

  **C. The Neighborhood as a Corporate Entity**
  The process treats the neighborhood as having interests distinct from the sum of its current residents.
  *   **The Theory:** A neighborhood has a "character" that is a public good in itself, separate from the welfare of specific individuals.
  *   **The Implication:** This explains why a family of eight (high impact on traffic/parking) is permissible, but a 40-unit building (similar impact) is not. The family fits the *form* of the neighborhood (single-family zoning); the building violates the *aesthetic/ontological category* of the neighborhood. The objection is not to *impact*, but to *type*.

  ### 2. Strict Commitments vs. Compatible Theories

  Does this process force you to accept "temporal feudalism" as a moral good, or does it merely facilitate it?

  **What the Practice Strictly Commits You To:**
  1.  **Procedural Exclusion:** You must accept that non-residents (future tenants, city-wide housing seekers) have no procedural mechanism to counterbalance local opposition in a hearing setting.
  2.  **Status Quo Bias:** You must accept that the current distribution of land uses is the neutral baseline, and any deviation requires affirmative justification.
  3.  **Discretionary Authority:** You must accept that elected officials are authorized to vote based on the volume of opposition rather than strict adherence to comprehensive plans (since the plan allows the density, but the council kills it based on hearings).

  **What Merely "Goes Well With" It (Underdetermination):**
  Several conflicting normative theories license this exact same practice. The process does not tell you *why* incumbents have power, only *that* they do.
  *   **Libertarian Property Theory:** "My land value shouldn't be diminished by externalities." (Focus: Economics).
  *   **Communitarian Theory:** "Social capital takes time to build; rapid turnover destroys community cohesion." (Focus: Social fabric).
  *   **Administrative Pragmatism:** "We cannot hold hearings for people who don't exist yet; we must rely on proxies." (Focus: Feasibility).
  *   **Temporal Feudalism:** "Those who arrived first have earned seniority rights over the land." (Focus: Hierarchy).

  The practice is compatible with all of these. A councilmember can vote to kill the project believing they are protecting property values (Libertarian), while the neighbor screaming at the mic believes they are protecting community soul (Communitarian), and the legal framework simply enables both via seniority (Feudalism).

  ### 3. Can "Arrival Time" Be Defended?

  Is there a version of the arrival-time reading that isn't just an apology for incumbency? There are two potential defenses, though both struggle against your specific facts.

  **A. The Democratic Constituency Defense**
  *   **Argument:** Councilmembers are elected by current residents. Future residents cannot vote. Therefore, prioritizing current residents is simply representative democracy.
  *   **Weakness:** This conflates *political power* with *moral right*. Just because the council is accountable to voters doesn't mean the *process* is just. Furthermore, city-wide voters (who benefit from housing supply) are also represented by the council, yet their interests are systematically outweighed by the concentrated intensity of local voters.

  **B. The Reliance/Stability Defense**
  *   **Argument:** Urban planning requires long-term horizons. If rules change too quickly, no one can invest (financially or socially). "Arrival time" is a proxy for "reliance." I bought here expecting X; changing X retroactively violates fairness.
  *   **Weakness:** This collapses in your scenario because the City's *own plan* already says the density belongs there. The neighbors aren't relying on the *law* (which permits density); they are relying on the *enforcement discretion* (which usually kills it). Defending arrival time here means defending a reliance on *illegal* or *quasi-legal* stability (the expectation that the code won't be enforced as written).

  **Conclusion on Defense:**
  Without the shield of existing zoning (i.e., if the project were a variance), the "Reliance Defense" holds water. But when the project complies with the City Plan, "arrival time" ceases to be about stability and becomes pure incumbency protection. It asserts that the *current configuration of people* is more legitimate than the *current configuration of laws*.

  ### 4. Epistemic Status of Claims

  Per your request, here is the separation of settled facts, contested disagreements, and my own analytical view.

  | Claim / Assertion | Status | Notes |
  | :--- | :--- | :--- |
  | **Procedural Mechanics:** Public hearings allow current residents to speak; future residents do not have standing. | **Settled** | Descriptive fact of land-use law in most US jurisdictions. Discretionary review processes function this way by design. |
  | **Procedural Mechanics:** Councils can deny projects that comply with comprehensive plans based on public testimony. | **Settled** | This is the definition of "discretionary" vs. "by-right" zoning. If the council has final approval authority, they can legally vote against plan consistency. |
  | **Impact Discrepancy:** A single-family home with 8 residents often generates similar traffic/noise to a small apartment building. | **Contested** | Planners debate this. Some argue density creates *more* trips; others argue per-capita trips drop with density. However, the *perception* of difference is settled as a driver of opposition. |
  | **Theory of Property:** The process treats property as a bundle of expectations about the *surroundings*, not just the parcel. | **Analytical View** | This is a reconstruction of the implicit logic. A libertarian might argue property rights are absolute; a communitarian might argue they are social. I am inferring the operational theory from the behavior. |
  | **Theory of Neighborhood:** The process treats the neighborhood as an entity with interests distinct from its residents (e.g., "character"). | **Analytical View** | This is a philosophical interpretation of why "form" matters more than "impact" in your example. |
  | **Temporal Feudalism:** The term accurately describes the conversion of priority into authority. | **Analytical View** | This is a metaphorical framing. It is not a legal term, but a sociological critique. |
  | **Strict Commitments:** The process *requires* status quo bias and procedural exclusion of non-residents. | **Analytical View** | This is a logical deduction from the mechanics. If you change these, you change the process. |
  | **Compatible Theories:** Libertarian, Communitarian, and Pragmatic theories all license the same outcome. | **Contested** | Political theorists and legal scholars disagree on which motivation actually drives these decisions. I am arguing they are functionally equivalent in outcome. |
  | **Reliance Defense:** The defense fails when the project complies with the City Plan. | **Analytical View** | This is my normative evaluation. A pro-incumbency theorist would argue the Plan itself should be changed before enforcement, maintaining the reliance interest. |
  | **Democratic Defense:** Prioritizing voters is simply representative democracy. | **Contested** | Housing advocates argue this is "exclusionary democracy"; localists argue this is proper local control. There is no consensus on the moral weight of this claim. |

  ### Summary
  The setup presupposes that **stability is a public good** distributed by **seniority**, and that **neighborhood character** is a property right held collectively by current occupants.

  The practice strictly commits you to **procedural exclusion** of future residents and **discretionary instability** (since the plan can be overridden by noise). However, it does not commit you to a single moral justification; you can run this system believing you are protecting property values, community bonds, or democratic will.

  The "arrival time" defense only escapes being an apology for incumbency if it is tied to **reliance on written law**. When it is tied to **reliance on unwritten norms** (as in your case, where the Plan allows the density), it is functionally indistinguishable from feudal seniority: the right to exclude is granted solely because you were there when the gates were closed.
