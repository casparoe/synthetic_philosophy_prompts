answer: |-
  There is no single established proper name in the contractualist literature that specifically unifies the two variants you describe (lifetime accumulation in one person and burden consolidation in a tight group) as a distinct phenomenon separate from the general aggregation problem. The nearest established concepts are **Intrapersonal Aggregation** (for the lifetime case) and **Collective Claims** or **Group Agency** (for the group case), but neither term captures the structural similarity you have identified between them, nor do they jointly contrast with the standard **Interpersonal Aggregation** problem in the way your inquiry requires.

  To precisely carve out this phenomenon, I propose the coined term **"Standpoint-Internal Aggregation."**

  Below is the detailed mapping of this concept against the nearest established doctrines, the precise boundaries, and the justification for the new term.

  ### 1. Nearest Established Concepts

  **A. Interpersonal Aggregation (The Standard Case)**
  *   **Definition:** The summation of benefits or burdens across *distinct* individuals to justify imposing a severe harm on one person to spare many others trivial harms.
  *   **Contractualist Status:** Generally **blocked**. Scanlon's framework prohibits this because justification must be acceptable to each individual separately. The single person with the severe harm has a complaint that no single individual among the many can match.
  *   **Difference:** Your phenomenon concerns summation *within* a recognized unit, whereas this concerns summation *across* units.

  **B. Intrapersonal Aggregation (Variant 1)**
  *   **Definition:** The summation of benefits or burdens within the life of a *single* individual over time.
  *   **Contractualist Status:** Generally **permitted**. Contractualism typically treats a human life as the basic unit of moral concern. A person can reasonably reject a principle that ruins their life via cumulative trivialities, even if no single moment's burden is severe.
  *   **Difference:** This term fits your first variant perfectly but fails to capture your second variant (the group). It also fails to highlight the *structural* question: *why* does the lifetime count as one unit while the crowd counts as many?

  **C. The Separateness of Persons**
  *   **Definition:** A doctrine (associated with Rawls and Nozick) stating that individuals are distinct moral entities, and therefore sacrifices imposed on one cannot be offset by gains to another.
  *   **Contractualist Status:** This is the **foundational justification** for blocking Interpersonal Aggregation.
  *   **Difference:** The Separateness of Persons is the *barrier* that defines the outer boundary of aggregation. Your phenomenon concerns what happens *inside* that boundary. The Separateness of Persons explains why we do not aggregate across people; it does not name the process of aggregating within a life or a unified group.

  ### 2. Coined Term: Standpoint-Internal Aggregation

  **Definition:**
  **Standpoint-Internal Aggregation** refers to the summation of multiple trivial burdens into a single reasonable complaint, provided those burdens fall within the boundaries of a single **moral standpoint**. A "moral standpoint" is the locus of rejectability. In standard contractualism, this is typically a human life over time. In your second variant, it is a tightly bound group treated as a single agent.

  **Why this term fits:**
  Scanlon's theory relies on the "standpoint" of the individual who might reject a principle. Your puzzle highlights that the permissibility of aggregation depends entirely on how that standpoint is individuated.
  *   If the standpoint is "Person-at-Time-T," aggregation fails (many negligible complaints).
  *   If the standpoint is "Person-Over-Lifetime," aggregation succeeds (one large complaint).
  *   If the standpoint is "Unified-Group," aggregation succeeds (one collective complaint).

  The term "Standpoint-Internal" captures the mechanism: aggregation is permissible *internal* to the standpoint, but not *external* to it.

  ### 3. Precise Differentiation and Boundaries

  To ensure the carving is precise, we must distinguish **Standpoint-Internal Aggregation** from the standard **Interpersonal Aggregation** and the **Separateness of Persons**.

  | Feature | Interpersonal Aggregation | Standpoint-Internal Aggregation |
  | :--- | :--- | :--- |
  | **Locus of Burdens** | Across distinct moral agents. | Within a single moral agent or unified standpoint. |
  | **Role of Separateness of Persons** | Violates the doctrine (ignores boundaries). | Respects the doctrine (operates within boundaries). |
  | **Contractualist Verdict** | Impermissible (usually). | Permissible (usually). |
  | **Key Question** | "Do many small complaints outweigh one large one?" | "Do these small complaints belong to the *same* complainant?" |

  **Boundary Cases and Ambiguities:**
  The utility of the term **Standpoint-Internal Aggregation** lies in exposing the boundary cases where the "standpoint" itself is contested.

  1.  **Temporal Boundaries (The Lifetime Case):**
      *   *Boundary:* At what point do temporal segments of a life become distinct standpoints? (e.g., severe dementia, radical psychological discontinuity).
      *   *Application:* If a person's early self and late self are treated as distinct standpoints, Standpoint-Internal Aggregation fails, and the lifetime accumulation of trivial harms cannot outweigh a severe harm to one segment. If they are one standpoint, it succeeds.
  2.  **Social Boundaries (The Group Case):**
      *   *Boundary:* What degree of unity makes a group a single standpoint?
      *   *Application:* A family or a crew might function as a single standpoint (allowing Standpoint-Internal Aggregation of their trivial burdens). A random crowd does not. The boundary is not biological (as in the lifetime case) but functional or relational.
  3.  **The "Threshold" Problem:**
      *   *Boundary:* Is there a minimum severity for a burden to count toward aggregation?
      *   *Application:* If the trivial burden is *too* trivial (e.g., a micro-second of annoyance), some theories argue it cannot aggregate even internally. Standpoint-Internal Aggregation assumes the burdens are *capable* of summing, but the boundary case asks if there is a "zero-point" below which summation is disabled even within a standpoint.

  ### 4. Why None of the Established Terms Suffice

  *   **"Intrapersonal Aggregation"** is too narrow because it biologically restricts the unit to a single human organism, excluding your second variant (the tightly bound group) which functions morally as a unit but is ontologically plural.
  *   **"Collective Aggregation"** is ambiguous; it often refers to Interpersonal Aggregation (aggregating *across* a collective) rather than aggregation *within* a collective treated as a unit.
  *   **"The Aggregation Problem"** is too broad; it encompasses the standard case (which is blocked) and your variants (which are often permitted), failing to distinguish the crucial structural difference of the *unit of account*.

  **Conclusion:**
  The phenomenon you describe is best defined as **Standpoint-Internal Aggregation**. It distinguishes the *permissible* summation of burdens within a recognized moral locus (a life or a unified group) from the *impermissible* summation across distinct loci. It isolates the core contractualist puzzle not as "whether to aggregate," but "how to individuate the standpoint" that serves as the container for aggregation. This term respects the **Separateness of Persons** by acknowledging that aggregation is only valid where separateness does not apply (i.e., inside the person/unit), while providing a label for the specific mechanism that allows trivialities to outweigh severity in your two variants.
