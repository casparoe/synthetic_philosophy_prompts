answer: |-
  Dear Friend,

  I have read your pressure-test of Confucian role ethics with great interest, and I must say you have constructed a formidable dilemma that cuts to the heart of how particularistic ethics handles universal concerns. You wish to preserve the first two premises, which define Confucianism as fundamentally role-based and bound by the rectification of names within those roles, and I agree that these are the core distinctives worth saving. If we hold those fixed, the step you should reject is step six, which claims that the only way to accommodate universal obligations is to posit a universal role such as fellow human. This step appeared plausible to you because it relies on a deeply ingrained modern intuition that moral coverage requires moral categorization of the recipient. In most Western ethical frameworks, if I have a duty to you, it is because you fall under some description that generates that duty, such as being a rational agent or a soul before God, so it seems natural to assume that for Confucians to care about strangers, strangers must occupy a named role that triggers that care.

  However, giving up this step allows you to see that Confucianism accommodates universal obligations not by creating a new universal role, but through the mechanism of extension from existing particular roles. Mencius does not argue that we must recognize a abstract category of humanity to justify compassion; rather, he argues that the care we naturally feel for family members can and should be extended outward to others, treating the aged of other families as we treat our own aged. This preserves your first premise because the source of the obligation remains rooted in the cultivation of specific relational virtues, and it preserves your second premise because there is no need to rectify the name of stranger or human in the same technical sense as father or ruler. The moral evaluation of how one treats a stranger comes from what that action reveals about the agent's cultivation within their primary roles, rather than from a duty owed to the stranger based on the stranger's status.

  The cost of rejecting step six, however, is significant and explains why the dilemma felt so pressing in the first place. By denying that a universal role is the ground of obligation, you must accept that the protection of strangers in Confucian ethics is derivative and contingent rather than foundational and inherent. In a universalist system, the stranger has a claim on me because of who they are, but in this revised Confucian view, the stranger is safe only insofar as I have successfully cultivated my own virtue and extended my feelings properly. This makes the ethics robust for insiders but potentially vulnerable for outsiders, as their moral protection depends on the moral success of the agent rather than their own intrinsic status. You avoid the collapse into universalism and the charge of nihilism, but you pay for this coherence by admitting that Confucian role ethics offers a weaker guarantee of safety for strangers than a system built on universal human rights, grounding the duty in the character of the giver rather than the rights of the receiver.

  I hope this helps you resolve the tension in your argument without sacrificing the distinctive structure of the theory you are analyzing.

  Yours sincerely,

  A Fellow Student of Ethics
