  Stanzas 1–2 establish the deterministic base and the shadowing lemma; 3–4 introduce Lorenz's multi-scale error saturation versus model error dominance. Stanza 5 invokes Lyapunov time explicitly, while 6 concedes the hard horizon without surrendering causality. The sestina's fixed permutation mirrors the underlying equations: the end-words cycle predictably even as the semantic meaning drifts toward uncertainty. Science defence rests on the distinction between ontological determinism (LAW) and epistemological limits (HORIZON), specifically referencing the 1969 result where error growth rate increases as scale decreases. The envoi forces all terms together to simulate the simultaneous saturation of error across scales.
