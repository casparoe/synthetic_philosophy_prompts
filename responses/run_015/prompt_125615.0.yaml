  {
    "agreed_claims_count": 4,
    "disagreement_cruxes": [
      "Collective opinion corruption frequency",
      "Applicability to non-political groups"
    ],
    "verbal_dispute_flag": true,
    "verbal_dispute_explanation": "Camp A and Camp B define the word 'party' differently regarding non-political groups.",
    "niche_injection_description": "We applied Weil's theory to Stan Twitter and activist collectives to see if groupthink happens without formal politics.",
    "document_format": "joint_statement_with_json_summary"
  }
  ```
