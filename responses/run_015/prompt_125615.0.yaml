  hey im in this poli sci elective and we just read simone weils essay about abolishing all political parties (the one she wrote in like the 1940s?). my teacher wants us to try an adverserial collaberation, so i need you to draft the joint statement between two camps who have been arguing in my head. camp A is the literalists: they think all parties should be banned because they manufacture collective passion and destroy individual judgement using slogans and peer pressure. camp B is the reformists: they agree with weils psychological critique but think parties are necessary for democracy, so they want to redesign them to protect individual reasoning instead of banning them.

