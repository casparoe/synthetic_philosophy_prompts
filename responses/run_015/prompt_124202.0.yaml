  **Applications**
  *   **(A) Disable E2EE:** Violates privacy rights (Test 2). No existential threat (Test 3). **Veto mandated.** Although you favor minimal intervention, the procedure classifies encryption as a core right, forcing the board to override the majority's safety preference. This substantive review overrides your procedural preference.
  *   **(B) Budget Redirect:** No rights violated (Test 2). **No Veto.** This is purely resource allocation.
  *   **(C) Exclude Minority:** Violates equality rights (Test 2). No necessity (Test 3). **Veto mandated.**

