  **OFFICE OF REVEALED WELFARE ASSESSMENT (ORWA)**
  **Circular No. 2024-09**
  **Subject: Standardization of Welfare Metrics via Observed Choice**

  **1. Purpose and Doctrinal Framework**
  This Circular establishes procedural standards for benefit-cost analysis within the Office. Consistent with federal guidance on regulatory impact, welfare is defined exclusively through observed choice behavior. Utility is not a mental state but an index constructed to rationalize transactions. Consequently, reported satisfaction, regret, or self-described happiness constitutes untested testimony¹ and is inadmissible against a completed transaction. Furthermore, under the Latent Feasibility Doctrine, preference is defined by choice; therefore, no agent can be mistaken regarding their wants. Any option not selected is reconstrued post-hoc as infeasible, unaffordable in the relevant sense, or not genuinely on offer.

  **2. Valuation and the Statutory Numeraire**
  Utility functions derived from revealed preference are ordinal. Any positive affine transformation of the index preserves the ranking and predictive capacity of the model. Because the unit lacks natural size, summation across agents requires a fixed exchange rate. The Office hereby establishes a statutory welfare numeraire: one util equals one dollar of observed expenditure. Only rescalings conforming to this decree are authorized for regulatory impact statements. This ensures cardinal comparability by administrative fiat, bypassing the theoretical gap between ordinal rankings and cardinal measurement.

  **3. Data Hygiene and Rationalizability**
  Analysts must ensure datasets satisfy the Weak Axiom of Revealed Preference. Where a household purchases contradictory goods within a single budget period (e.g., cigarettes and cessation therapy), the data is deemed non-conforming. To restore rationalizability without altering observed facts, analysts shall partition the budget period into distinct temporal accounts or treat the buyer as a sequence of distinct agents. This is a data-hygiene matter, not a substantive judgment on stability. By re-dating the transactions, the Afriat inequalities are satisfied, and the choices are rendered consistent with a stable ordering.

  **4. The Latent Feasibility Doctrine**
  When an agent selects Option A over Option B, but later claims B was preferred, the Office applies the Latent Feasibility Doctrine. The claim is rejected. Option B is classified as implicitly constrained at the time of choice. This applies even where constraints are not physically visible. If a worker accepts hazardous duty without protective gear, the gear is deemed unavailable in the relevant choice set. To rule otherwise would imply the agent erred, which contradicts the definition of preference as choice.

  **5. Non-Transacting Agents**
  Agents with no recorded transactions possess no revealed preferences. Consequently, policies affecting only such agents generate no measurable welfare change. For imputation purposes, the Office assigns a utility delta of zero to populations lacking transaction histories. Since harm requires a deviation from a preferred state, and no preferred state exists without data, the cost is scored as null.

  **6. Adaptive Narrowing and Amortization**
  Where objective circumstances deteriorate but choice patterns remain unchanged, welfare loss is recognized only during a transition period. This acknowledges the lag between shock and revealed adaptation. The Office employs a five-year amortization schedule. After five years of stable choice under deteriorated conditions, the welfare loss is re-scored as zero. The unchanged choice pattern confirms the new baseline is optimal.

  **7. Distributional Weights**
  Because utility is ordinal and non-comparable across persons, interpersonal weighting is theoretically impermissible. However, regulatory statutes require distributional analysis. The Office resolves this by classifying distributional weights as administrative parameters rather than interpersonal comparisons. These parameters adjust the final tally without implying that one util differs from another. The reasoning is circular by design: weights are applied to satisfy statutory output requirements while maintaining the theoretical integrity of non-comparability.

  **8. Agency Conduct and Budgetary Optimization**
  The Office's own expenditure patterns reveal its preferences. Therefore, the Office's budget allocation is by definition optimal. Criticism of the Office's resource consumption implies the Office chose sub-optimally, which is impossible under these doctrines. The budget cannot be criticized without violating the axiom that choice reveals welfare.

  **9. Worked Numerical Example**
  Consider a household earning $50,000. They report a desire to save $5,000 but spend it on consumption. A mandate forces the saving.
  *   **Status Quo:** Consumption = $50,000. Revealed Preference = Consumption.
  *   **Mandate:** Consumption = $45,000. Savings = $5,000.
  *   **Calculation:** The household chose $50,000 consumption over $45,000 consumption + $5,000 savings. The mandate forces a bundle revealed as inferior.
  *   **Welfare Loss:** Measured by the difference in willingness to pay to avoid the mandate. If the household would pay up to $500 to avoid the restriction, the welfare loss is $500. The reported desire to save is inadmissible testimony. The loss is real because the choice was overridden.

  **10. Limitations**
  This Circular applies strictly to procedural assessment. It does not guarantee that agents feel better, only that their choices are consistent. Where the Latent Feasibility Doctrine conflicts with physical reality, procedural consistency takes precedence.

  **11. Effective Date**
  Immediate.

  ***

  ¹ *Some staff (the "Mentalists") maintain that utility is a feeling and agents may err. This view is procedurally inadmissible because it relies on unobservable states. Per Section 1, testimony regarding internal states cannot falsify observed choice data. The matter is closed.*
