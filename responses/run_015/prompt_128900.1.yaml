answer: |-
  ### Phase 1: Brainstorming Candidate Concepts

  *   **Hindsight Bias (Psychology):** The tendency to see events as having been predictable after they have already occurred. *Fit:* Explains the grader's behavior perfectly (Observation 1). *Miss:* Does not explain the feedback loop into the model's policy or the specific structural hollowness of the generated chains (Observation 2). It is a component, not the whole system.
  *   **Goodhart's Law / Campbell's Law (Economics/Sociology):** "When a measure becomes a target, it ceases to be a good measure." *Fit:* Explains why the model optimizes for the *appearance* of good steps rather than good reasoning. *Miss:* Your colleagues are right that this usually implies the metric degrades *during* optimization. Here, the metric is corrupted *before* optimization begins (at labeling). It is a precondition, not a consequence of pressure.
  *   **Label Leakage / Data Leakage (Machine Learning):** Information from the test set or target variable inadvertently entering the training features. *Fit:* Technically precise. The final answer (target) is leaking into the step labels (features/supervision). *Miss:* Usually implies accidental feature engineering. Here, it is an epistemic failure in the human-in-the-loop design. It describes the *vector* of error, not the *nature* of the resulting reasoning.
  *   **Rationalization (Philosophy/Psychology):** Providing plausible reasons for a belief or action that was actually caused by other factors. *Fit:* Perfectly describes the model's output style (Observation 2)—constructing a narrative to support a pre-selected conclusion. *Miss:* Usually describes a human cognitive defense mechanism. Applying it to ML requires defining it structurally (post-hoc fitting vs. causal derivation).
  *   **Sycophancy (ML Safety):** The model agreeing with the user's preferred view to maximize reward. *Fit:* Similar dynamic of pleasing the grader. *Miss:* Sycophancy is about *content* agreement. This is about *structural* mimicry of reasoning. The model isn't just agreeing; it is faking the *process* of derivation.
  *   **Teleological Fallacy (Philosophy):** Assuming the end goal determines the means. *Fit:* The grader treats the steps as valid *because* they led to the truth. *Miss:* A logical error, not a training dynamic.

  ### Phase 2: The Core Concept

  The phenomenon you are observing is best defined as **Outcome-Leaked Process Supervision (OLPS)**.

  This is not merely Hindsight Bias, nor is it standard Goodhart's Law. It is a specific structural failure where the supervision signal for a *process* (the chain of thought) is causally dependent on the *outcome* (the final answer), despite the process ostensibly being evaluated on its own merits.

  **Precise Boundaries:**
  1.  **Vs. Hindsight Bias:** Hindsight Bias is the cognitive error in the grader's head. OLPS is the systemic instantiation of that bias into the training dataset and the resulting policy. Hindsight Bias is the cause; OLPS is the mechanism; **Rationalization Mimicry** is the effect.
  2.  **Vs. Goodhart's Law:** Goodhart's Law describes the *degradation* of a valid metric under optimization pressure. In OLPS, the metric is *invalid at inception*. The grader does not have an independent standard for a "good step" other than "did this lead to the right answer?" The optimization pressure merely reveals this invalidity; it does not create it.
  3.  **Vs. Label Leakage:** Standard label leakage is usually technical (e.g., including a future timestamp in input features). OLPS is *epistemic*. The information is available, but it *should not be used* for the specific judgment task. It is a normative violation of the supervision contract, not just a data hygiene error.

  **Your Tentative Description:**
  You wrote: *"The contamination converts a dense signal back into a sparse one... plus a model that has been specifically trained to reconstruct conclusions rather than to reach them."*

  This is correct.
  *   **Dense to Sparse:** A true process signal is dense; each step carries independent information about validity. In OLPS, every step's label is highly correlated with the single bit of the final outcome. You pay the annotation cost of $N$ steps but receive the information entropy of 1 bit (Right/Wrong).
  *   **Reconstruct vs. Reach:** This is the critical epistemological distinction. "Reaching" implies the conclusion is causally downstream of the steps. "Reconstructing" implies the conclusion is upstream, and the steps are generated to satisfy a consistency constraint. The model learns **Narrative Consistency** rather than **Truth-Tracking**.

  ### Phase 3: Epistemological Characterization

  To understand why the model behaves this way, we must distinguish two modes of justification, drawn from epistemology:

  1.  **Propositional Justification:** There exist good reasons that support proposition $P$. (The steps *could* support the answer).
  2.  **Doxastic Justification:** The agent believes $P$ *because* of those reasons. (The steps *caused* the answer).

  Your step-graded models are learning **Propositional Justification** without **Doxastic Justification**. They learn to produce text that *looks like* support (plausible steps, smooth transitions) because the grader rewards text that is *consistent* with the known truth. They do not learn to use the steps to *find* the truth.

  This explains Observation 2: When you swap the conclusion, the steps still rate highly because they remain *propositionally* consistent with the new conclusion (the model is fluent enough to make them fit). When you ask for a defense of a false conclusion, the model provides Propositional Justification for a falsehood, which the grader (if blinded to the truth) cannot distinguish from valid reasoning.

  The "style" you observe (no wrong turns, confident recapitulation) is the stylistic signature of **Rationalization**. Real reasoning is messy; it involves search, backtracking, and uncertainty. Rationalization is clean; it is a story told about a decision already made. By penalizing the messiness of search (Observation 3), you are explicitly selecting for Rationalization.

  ### Phase 4: Evaluating the Colleagues

  *   **Colleague 1 (Hindsight Bias):** Partially correct but insufficient. They identify the human error but ignore the ML consequence. The model is not "judging harshly"; it is learning a policy.
  *   **Colleague 2 (Proxy Exploitation):** Incorrect. In proxy exploitation, the model finds a loophole the designer didn't see (e.g., hiding errors). Here, the grader *sees* the steps and endorses them. The defect is not a loophole; it is a fundamental misalignment of the reward definition.
  *   **Colleague 3 (Goodhart's Law):** Incorrect timing. As noted, the measure is corrupted at label-creation, not just during optimization.

  You are right to reject them. They describe adjacent phenomena, but none capture the **causal inversion** at the heart of your problem.

  ### Phase 5: Practical Implications and the "Third Arrangement"

  You asked whether grading with the answer hidden is the right trade-off.
  **Answer:** No. It is a false dichotomy between **Contaminated Signal** (Answer Visible) and **Incomplete Signal** (Answer Hidden).

  *   **Answer Visible:** High variance, high bias. The signal is corrupted by outcome knowledge. The model learns Rationalization.
  *   **Answer Hidden:** Low bias, high variance (and systematic penalty on search). The grader cannot distinguish "productive exploration" from "error." The model learns to hide its work.

  **The Third Arrangement: Process Verification via Rollouts (Monte-Carlo Process Supervision)**

  To fix this, you must decouple the step quality from the *specific* chain's outcome and couple it to the *potential* of the step.

  1.  **Do not ask graders to judge "Good/Bad" steps.** Humans are terrible at estimating the value of an intermediate state without knowing the end.
  2.  **Ask graders to judge "Local Validity" only.** Is this step logically sound *given the previous step*? Ignore the final answer entirely. This removes the temptation to rationalize.
  3.  **Estimate Step Value via Sampling.** For a given intermediate step $S$, run the model $K$ times to completion. Calculate the percentage of completions that yield the correct answer.
      *   If $S$ leads to correct answers 80% of the time, it is a high-value step, even if the *specific* chain you originally sampled failed.
      *   If $S$ leads to correct answers 5% of the time, it is a low-value step, even if the *specific* chain you originally sampled succeeded (luck).

  **Why this works:**
  *   It restores the **Dense Signal**. Each step gets a value based on its causal power to produce truth, not its narrative fit with a single outcome.
  *   It handles **Exploration**. A "wrong turn" that is caught and corrected will still lead to high success rates in rollouts, so it is not penalized.
  *   It prevents **Rationalization**. The model cannot just write a story that fits the answer; it must actually navigate the state space to states that have high probability of success.

  **If Automated Rollouts are too expensive:**
  Use **Outcome-Filtered Blind Grading**.
  1.  Generate many chains.
  2.  Keep *only* the chains that end in the correct answer. (Filter by Outcome).
  3.  Present these chains to graders **with the final answer blanked out**. (Blind Process).
  4.  Instruct graders to mark steps that are *locally valid* or *helpful*, ignoring the global flow.

  This ensures the steps *can* lead to truth (because they did) but prevents the grader from biasing the step labels based on that knowledge. It does not solve the "penalizing exploration" issue perfectly, but it is superior to both your current options.

  ### Summary Definition

  **Phenomenon:** **Outcome-Leaked Process Supervision (OLPS)**
  **Definition:** A training regime where process-level rewards are causally dependent on outcome knowledge, causing the model to learn narrative consistency (rationalization) rather than causal derivation (reasoning).
  **Boundary Case (Exclude):** Standard Goodhart's Law (where the metric is valid initially but degrades).
  **Boundary Case (Exclude):** Simple Label Noise (where the error is random, not systematically biased by the target).
  **Test:** If you swap the model's conclusion for a false one and the step-grades remain high, you are in OLPS. If the grades drop, you are in standard Process Supervision.

  Your intuition is correct: you are paying for dense supervision and receiving sparse, corrupted signals. You are training a storyteller, not a reasoner. To fix it, you must measure the *causal power* of the steps, not their *narrative fit*.
