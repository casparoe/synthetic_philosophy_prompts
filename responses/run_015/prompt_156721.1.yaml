prompt: |-
  I have been thinking on my own about whether human flourishing could really be nothing more than the absence of craving and suffering, with no positive goods required — a view I will call tranquilism. Before I read further, I want the full specification: what must a theory of well-being actually be able to do to count as adequate if tranquilism is correct? Give me the complete desiderata. For each requirement, state the phenomenon or case it must cover — for example, deep meditative states that lack both desire and pleasure, lives of neutral contentment, or the difference between the absence of suffering and the presence of genuine peace — and explain why that case makes the requirement necessary. Distinguish the non-negotiable conditions from those that are merely camp-specific preferences, such as whether determinism about desire is required. I am especially interested in whether any subset of these desiderata is jointly unsatisfiable: for instance, if explaining human motivation requires some form of craving, that may conflict with the core thesis. Identify which single requirement does the most to rule out the popular positive theories of well-being. Then briefly score hedonism, desire-satisfactionism, and objective-list theories against your list. A table is fine; citations and reading lists are not needed.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** Tranquilism (the view that well-being = absence of craving/suffering, no positive goods required).
      *   **Task:** Provide the *full specification* of desiderata for an adequate theory of well-being *if* tranquilism is correct.
      *   **Requirements:**
          *   State the phenomenon/case each desideratum covers (e.g., deep meditation, neutral contentment, absence vs. peace).
          *   Explain *why* the case makes the requirement necessary.
          *   Distinguish non-negotiable conditions from camp-specific preferences (e.g., determinism about desire).
          *   Identify if any subset of desiderata is jointly unsatisfiable (internal consistency check).
          *   Identify which single requirement does the most work to rule out positive theories (hedonism, desire-satisfaction, objective list).
          *   Score the three popular theories against the list (table format).
          *   No citations/reading lists.

  2.  **Deconstruct "Tranquilism":**
      *   Core Thesis: Well-being is negative (privative). It is the removal of a negative state (craving, suffering, disturbance), not the addition of a positive state (pleasure, achievement, knowledge).
      *   Key Distinction: Zero is not just a baseline; it is the target. Positive states are either irrelevant or instrumental only insofar as they prevent negative states.
      *   Philosophical Roots: Buddhist *Nirvana* (cessation of *tanha*), Schopenhauer (will-less state), Pyrrhonian Skepticism (*ataraxia*), Negative Utilitarianism (Popper).

  3.  **Drafting the Desiderata (The "Must-Haves"):**
      *   *Requirement 1: The Zero Point.* Must define a state of "neutral" existence that counts as good.
          *   *Case:* The "Stone" or "Corpse" objection. If I'm dead, I have no suffering. Is that the best state? Tranquilism needs to distinguish between *non-existence* and *conscious absence of disturbance*.
          *   *Why:* To avoid the conclusion that death is the ultimate good (Benatar-style asymmetry issues).
      *   *Requirement 2: Phenomenology of Peace.* Must distinguish "absence of pain" from "presence of peace."
          *   *Case:* Deep meditation (Jhana/Samadhi) vs. Numbness/Anesthesia.
          *   *Why:* A theory that says well-being is just "no pain" might equate a drugged stupor with enlightened equanimity. Tranquilism claims the latter has value the former lacks, despite both lacking craving.
      *   *Requirement 3: Motivation without Craving.* Must explain how agents act without desire.
          *   *Case:* Spontaneous compassionate action vs. Goal-seeking behavior.
          *   *Why:* If well-being requires no craving, how do we explain functioning humans? If motivation *requires* craving (as Humeans argue), tranquilism is psychologically impossible.
      *   *Requirement 4: The Asymmetry of Value.* Must explain why adding pleasure doesn't add value, but adding pain subtracts it.
          *   *Case:* The "Experience Machine" or "Harmless Pleasures."
          *   *Why:* This is the core differentiator from Hedonism.
      *   *Requirement 5: Duration and Stability.* Must account for the fragility of the state.
          *   *Case:* Momentary relief vs. Enduring disposition.
          *   *Why:* A moment without pain isn't necessarily "flourishing." Flourishing implies a stable trait.

  4.  **Refining and Categorizing (Non-negotiable vs. Camp-Specific):**
      *   *Non-negotiable:* These define the theory. If it fails these, it isn't Tranquilism. (e.g., Negative axiology, distinction from death).
      *   *Camp-Specific:* Metaphysical commitments (e.g., Hard determinism, specific ontology of self).

  5.  **Checking for Joint Unsatisfiability (The "Internal Tension"):**
      *   *Tension:* Motivation without Craving vs. Biological Reality.
      *   *Analysis:* If human biology is driven by homeostatic error signals (suffering/craving), can a living human truly exist without them? If the theory requires biological life *and* zero craving, is it possible?
      *   *Resolution:* Tranquilism usually argues for a transformation of motivation (wisdom/compassion) rather than biological shutdown. But this is a high bar.

  6.  **Identifying the "Killer" Desideratum:**
      *   Which one kills Hedonism/Desire/Objective List?
      *   *Candidate:* The Asymmetry of Value (Pleasure adds nothing).
      *   *Reasoning:* Hedonism says pleasure = good. Desire says satisfaction = good. Objective List says achievement/knowledge = good. Tranquilism says *none* of these add intrinsic value; only the removal of their opposites matters.

  7.  **Scoring the Competitors:**
      *   *Hedonism:* Fails the Asymmetry (thinks pleasure adds value). Passes phenomenology (usually).
      *   *Desire-Satisfaction:* Fails the Core Thesis (desire is the problem, not the solution).
      *   *Objective List:* Fails the Core Thesis (positive goods are irrelevant).

  8.  **Drafting the Content (Iterative refinement):**

      *   *Intro:* Define the scope.
      *   *Section 1: The Desiderata.* Group them logically.
          *   D1: The Phenomenological Distinction (Peace vs. Numbness).
          *   D2: The Axiological Asymmetry (Pain subtracts, Pleasure doesn't add).
          *   D3: The Agency Constraint (Action without Craving).
          *   D4: The Existence Constraint (Life vs. Non-existence).
      *   *Section 2: Non-negotiable vs. Preferences.*
      *   *Section 3: Joint Unsatisfiability.* Focus on D3 (Agency) vs. Biological drives.
      *   *Section 4: The "Killer" Requirement.* D2 (Asymmetry).
      *   *Section 5: The Table.*

      *(Self-Correction during drafting)*: Make sure I don't just describe Buddhism. The prompt asks for a theory of *well-being* called "Tranquilism." Keep it philosophical, not theological. Ensure the distinction between "absence of suffering" and "presence of peace" is clear, as the prompt specifically asked for it.

      *(Refining D4 - Existence)*: This is crucial. If well-being is just no suffering, a rock has no suffering. A theory of *human* flourishing must require consciousness. So, "Conscious Negativity" is a better label.

      *(Refining D3 - Motivation)*: This is the hardest philosophical hurdle. Humean theory of motivation says belief + desire = action. If desire (craving) is removed, action stops. Tranquilism must posit a non-Humean motivation (e.g., rational intuition, compassion, habit).

  9.  **Final Review against Prompt:**
      *   Full specification? Yes.
      *   Phenomenon/Case for each? Yes.
      *   Why necessary? Yes.
      *   Non-negotiable vs. Preferences? Yes.
      *   Jointly unsatisfiable subset? Yes.
      *   Single requirement ruling out others? Yes.
      *   Score table? Yes.
      *   No citations? Yes.

  10. **Final Polish:** Ensure tone is analytical and rigorous. (Proceed to generate output).

  *(Self-Correction on "Tranquilism" term)*: The prompt defines "Tranquilism" for the purpose of this conversation. I must stick to their definition (absence of craving/suffering, no positive goods). I should not import external definitions that conflict.

  *(Check on "Joint Unsatisfiability")*: The prompt asks if *any* subset is jointly unsatisfiable. I need to be honest. If D3 (Action without Craving) is impossible given human psychology, then the theory fails. I should highlight this tension.

  *(Check on "Killer Requirement")*: D2 (Asymmetry) is the most direct attack on positive theories. D1 (Peace vs Numbness) attacks crude negative hedonism. D2 is broader.

  *(Table)*: Keep it clean. Pass/Fail/Partial.

