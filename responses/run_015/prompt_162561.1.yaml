  You have set a clever trap, but I needn't spring it. I am happy to concede, for the sake of argument, that the LLM lacks genuine propositional attitudes—though I must flag that this is itself a contested claim among us, as some argue that distributed activation patterns can realise content just as neural patterns do. Even granting your premise, however, this doesn't force me onto your horns. If the model lacks beliefs, FP's success there is merely instrumental, a matter of treating a sophisticated mirror as if it were a window. But that doesn't tarnish FP's realism regarding humans. The vacuity horn only bites if you think the criteria for belief attribution are exhausted by surface prediction. They aren't. We require a system to be embedded in an environment such that its states covary with facts and guide action towards goals. The LLM fails this, not because FP is false, but because the LLM is a parasite on genuine believers; it simulates the output of a belief-desire system without the underlying causal architecture that makes those states about the world.

  Now, your sharper point: why isn't human socialisation just the same kind of shaping? Here I must flag a contentious commitment: I rely on a causal-historical or teleological account of content to draw the line. The 'cheapness' of FP on the model consists in its lack of worldly uptake; it predicts where the character looks because it has statistically modelled our reports, not because it tracks the room. We, conversely, track the room. Our FP success isn't merely predictive regularity; it's grounded in the rationalising explanation of action. Neuroscience isn't showing FP is false any more than chemistry showed water is false; it's showing us how the trick is done. With the LLM, there is no trick to find, only a mimicry of the output. So, I choose neither horn: the model shows us what belief-less simulation looks like, which by contrast highlights what genuine belief requires.
