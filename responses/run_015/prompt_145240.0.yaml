      *   *However,* the Transcript Test in (5) threatens (1). If the Transcript Test says "she told him the false thing," does that mean she *lied* (violating 1)? If yes, (1) is wrong. If no, it's metaphorical.
      *   *The Reference Letter:* If the third party knows conventions, they know it's damning. So the test says "she told him the false thing." This classifies it as a Lie (by 5's metric) but not a Lie (by 1's metric). This creates a taxonomy problem.

  7.  **Drafting the Audit:**
      *   *Structure:*
          1.  Executive Summary (Confidence & Overall Verdict).
