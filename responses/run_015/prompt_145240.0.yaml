      *   (3) *Failed Lies:* Still a lie/wrong even if the hearer sees through it (intent-based, not success-based).
      *   (4) *Justification for (2):* Assertion norms (staking credibility, inviting trust) vs. implication.
      *   (5) *Paltering Severity:* Paltering is *basically as bad* as lying in ordinary life. *Test:* The "Transcript Test" (neutral third party interpretation).
      *   (6) *Silence:* No duty to volunteer (bike example).
      *   (7) *Exceptions:* Lying to intruders, surprise parties, poker is fine.
      *   (8) *Law:* Perjury should cover technically-true misleading answers.

  3.  **Initial Scan for Tensions:**
      *   (2) vs. (5): (2) says lies are *pro tanto* worse. (5) says paltering is *basically as bad* in ordinary life. This looks like a direct contradiction unless "pro tanto" is doing heavy lifting or "ordinary life" restricts the scope of (2).
      *   (4) vs. (5): (4) grounds the wrongness of lying in the *norm of assertion*. (5) uses a *transcript test* based on listener interpretation. If the transcript test says "it's a lie in all but name," does that mean it *was* an assertion of falsehood? If so, it collapses into (1). If not, why does it carry the same weight as violating assertion norms?
      *   (1) vs. (8): (1) defines lying as asserting what you believe *false*. (8) wants perjury to reach technically *true* answers. This isn't a tension per se (law can be broader than morality), but it suggests the moral distinction in (1)/(2) might not map to the practical harm (8) cares about.
      *   (5) vs. The Reference Letter Case: The prompt specifically flags this. If the transcript test yields different verdicts based on the third party (insider vs. outsider), the test is unstable. This undermines (5).
