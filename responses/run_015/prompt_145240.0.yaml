          *   If the setting is "Academic Hiring," the third party *must* be an academic. If they are, the verdict is uniform (it's damning). So the test *works* if the "conventions" clause is respected. The user's nervousness is unfounded *if* they stick to their own definition of the test. I need to point this out.

