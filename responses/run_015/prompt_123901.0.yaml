          *   *Statement:* "If ZFC turned out to actually contain a contradiction, then every theorem in mathematics would be false and the whole discipline collapses."
          *   *Analysis:* This is the "Principle of Explosion" (Ex Falso Quodlibet). In classical logic, if you have $P$ and $\neg P$, you can derive *any* statement $Q$. So, technically, every statement becomes *provable*. However, saying every theorem is *false* is slightly imprecise. It means every statement is *provable*, which renders the distinction between true and false meaningless within the system. The "collapse" part is dramatic but conceptually right for classical foundations. However, in practice, mathematicians would likely patch the axiom rather than throw out all results (most theorems don't rely on the specific contradictory part).
