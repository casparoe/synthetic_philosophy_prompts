          *   *Statement:* "Gödel's first theorem... proves there will always be true but unprovable statements, so even with consistent axioms we'll never have a complete system."
          *   *Analysis:* This is the core of the 1st Incompleteness Theorem. For any consistent, recursively enumerable system capable of arithmetic, there are statements that are true (in the standard model) but unprovable within the system.
          *   *Verdict:* Accurate.

