prompt: |-
  ok my study group was talking about whether teh basic axioms of math could actually be inconsistant and one guy summed it up like this: Gödel's second theorem shows that if ZFC is consistent then ZFC can never prove its own consistency, so Hilbert's program of giving mathematics a rock-solid foundation is basically dead. That means we have to take consistency on faith. Then he said if ZFC turned out to actually contain a contradiction, then every theorem in mathematics would be false and the whole discipline collapses. He also dragged in Gödel's first theorem and claimed it proves there will always be true but unprovable statements, so even with consistent axioms we'll never have a complete system. Finally he said paraconsistent logicians think an inconsistency wouldn't be catastrophic because they reject explosion, so maybe math survives anyway. Is this a fair summary? I want you to separate what's accurate from what's blended or wrong: especially whether he's conflating the two Gödel results, whether 'all theorems false' is the right consequence of inconsistency, and whether the paraconsistent point actually addresses the problem or is just a red herring. No need for citations or reading lists, just the conceptual audit.
