prompt: |-
  I'm a research analyst at a mid-sized private foundation, and in three weeks I'm presenting to our program committee a proposal to replace the scoring template we use when we allocate across program areas. The committee votes at the end of that same meeting on whether to pilot the new method on one program area for a year, so the question period, not the slides, is where this is decided. The room is: two development economists of the experimentalist persuasion, who convert everything into external validity, publication bias, and whether anything not estimated off a randomized design counts as evidence at all; a former government cost-benefit analyst who will want a discount rate, a distributional weight, and an account of what happens under parameter uncertainty; two program officers with fifteen years of field experience each, who distrust aggregate metrics and will hear any formula as head office removing discretion from the people who actually know the partners; one board member who introduced our current framework to us and reads the effective-altruism literature, and who will defend it as cheap, transparent, and good enough; and the board chair, a retired software founder who thinks in terms of leverage and will ask what the framework would have told us to do five years ago.

  My thesis is that the three-factor score we now use -- importance, tractability, neglectedness -- is not wrong so much as mis-specified, because two of its three factors are properties of a funder relative to a cause rather than properties of the cause, and because it has no term for the value of finding things out. I want to replace the score with an estimate of the expected marginal value of our next dollar to a cause, computed against an explicitly modeled counterfactual funding path, and then decompose it for presentation into four terms: a scale-weighted tractability indexed to our own access and comparative advantage rather than to the cause in the abstract; a saturation discount read off an absorption curve, meaning what the cost per unit of outcome does as cumulative funding in that area rises over a five-year window; a crowding term, since a dollar of ours that only substitutes for a dollar that would have arrived anyway does much less than a dollar that pulls in others or that no one else was going to give; and an option-value term for grants whose real payoff is resolving a disagreement before a much larger later commitment, which on my arithmetic is why a long-horizon funder like us should sometimes fund things that score badly on all three of the classic factors. The concrete thing I have to defend is a ranking flip: our largest line item, a well-evidenced and heavily funded global-health delivery program with a well-characterized cost per outcome, comes out below a small, weakly evidenced institutional-reform pilot that is very cheap now and that sits in front of a decision about a much larger commitment in about four years.

  What I want from you is a Q&A prep sheet, not a defense of the view. Give me the eight or so objections I will actually get, in roughly the order they will arrive, each attributed to the person most likely to raise it and phrased the way that person would phrase it -- the treasury analyst's objection should sound like a treasury analyst's, not like a philosopher's, and the program officers' should be about partners and legibility rather than about expected value. For each: what I should concede up front rather than being forced into it at the third follow-up, a reply I could give in about two minutes standing at a whiteboard, and a blunt note on where that reply is soft. Include what I should volunteer in the first two minutes to take the sting out of the two or three objections with real force, and tell me which objection I should simply grant in full. Finally, give me the question I am hoping nobody asks. My own candidate is the coordination worry: if every funder conditions on what every other funder will do, then the crowding term can make everyone rationally stand down at once and defund an area by mutual prediction, and I do not have a fixed point to point to. Tell me if you think the real killer is a different question -- I suspect the option-value term is vulnerable to something like always recommending more research and meta-work -- and argue for your choice over mine.
reasoning: |-
  Here's a thinking process that leads to the suggested Q&A prep sheet:

  1.  **Analyze the User and Context:**
      *   **User:** Research Analyst at a mid-sized private foundation.
      *   **Task:** Presenting a proposal to replace the current scoring template (Importance, Tractability, Neglectedness - ITN) with a new Expected Marginal Value (EMV) model decomposed into four terms (Scale-weighted Tractability, Saturation Discount, Crowding, Option Value).
      *   **Audience:**
          1.  Two Development Economists (Experimentalists, RCT-focused, external validity, publication bias).
          2.  Former Gov Cost-Benefit Analyst (Discount rates, distributional weights, parameter uncertainty).
          3.  Two Program Officers (15 yrs experience, distrust aggregate metrics/formulas, value discretion/partner relationships).
          4.  One Board Member (Introduced current ITN framework, EA literature fan, values transparency/simplicity).
          5.  Board Chair (Retired software founder, thinks in leverage, back-testing, "what would this have told us 5 years ago?").
      *   **Stakes:** Committee votes at the end of the meeting on piloting the new method. The Q&A is the decision point.
      *   **Specific Conflict:** The new model flips the ranking: Current top global health delivery program (well-evidenced, heavily funded) drops below a small, weakly evidenced institutional-reform pilot (cheap, high option value for future commitment).
      *   **Request:** Q&A prep sheet (8 objections, attributed, phrased correctly, concessions, whiteboard replies, soft spots), voluntary pre-emptive statements, one objection to grant fully, and the "real killer" question (vs. user's candidate).

  2.  **Deconstruct the Proposal & Vulnerabilities:**
      *   *Current:* ITN (Importance, Tractability, Neglectedness). Simple, EA standard.
      *   *New:* EMV = (Scale-Weighted Tractability) * (Saturation Discount) * (Crowding) + (Option Value).
      *   *Key Shift:* From "cause properties" to "funder-relative marginal value."
      *   *Key Controversy:* Ranking flip (Global Health vs. Institutional Reform).
      *   *Vulnerabilities:*
          *   Complexity/Opacity (EA Board Member).
          *   Subjectivity in inputs (Program Officers, Economists).
          *   Option Value as a "get out of jail free" card for weak evidence (Economists).
          *   Counterfactual modeling uncertainty (Cost-Benefit Analyst).
          *   Back-testing validity (Chair).
          *   Partner relationships/Discretion (Program Officers).
          *   Coordination/Crowding paradox (User's candidate).

  3.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1 (The Chair - Leverage/Back-testing):* Needs to sound like a tech founder. "Show me the code." "What does this say about the past?"
      *   *Objection 2 (The Economists - Evidence/RCTs):* They hate the "weakly evidenced" pilot winning. They care about identification.
      *   *Objection 3 (The Cost-Benefit Analyst - Uncertainty/Parameters):* Needs technical terms. Discount rates, sensitivity analysis.
      *   *Objection 4 (The Program Officers - Relationships/Discretion):* They hate formulas overriding gut instinct/partner trust.
      *   *Objection 5 (The EA Board Member - Transparency/ITN defense):* Defending the status quo. Simplicity vs. complexity.
      *   *Objection 6 (The Economists - Option Value specificity):* "Option value" is vague. How do you price it?
      *   *Objection 7 (The Chair/Analyst - Crowding/Counterfactuals):* How do you know what others would have funded?
      *   *Objection 8 (The Group - Implementation/Pilot):* Is this actually doable in a year?

      *Refining Phrasing:* Make sure the Economist sounds like an Economist ("identification strategy," "p-hacking"), the PO sounds like a PO ("partner trust," "on the ground"), etc.

  4.  **Developing Concessions and Replies:**
      *   *Concession Strategy:* Don't fight on terrain you can't win. Admit complexity, admit subjectivity, but frame it as *explicit* subjectivity vs. *hidden* subjectivity.
      *   *Whiteboard Reply:* Needs to be visual and conceptual, not mathematical derivation. Focus on the *marginal dollar*.
      *   *Soft Spot:* Where does the argument actually break? Usually on the quantification of the "Option Value" or the "Crowding" counterfactual.

  5.  **Pre-emptive Volunteering:**
      *   Need to address the biggest elephants early. The ranking flip and the subjectivity of the Option Value term.
      *   Acknowledge the ITN framework's value (don't insult the EA Board Member).

  6.  **The "Grant Fully" Objection:**
      *   Which one is indefensible? Probably the precision of the Option Value term. It's inherently speculative. Admitting it's a heuristic, not a calculation, builds trust.

  7.  **The "Real Killer" Question:**
      *   *User's Candidate:* Coordination failure (everyone stands down). This is a game theory problem. It's valid but abstract.
      *   *My Candidate:* The "Option Value" inflation problem. If Option Value is high for weak evidence, does the model *always* prefer research/pilots over delivery? This leads to paralysis or endless piloting. It attacks the core ranking flip directly.
      *   *Argument:* The coordination problem is theoretical; the "perpetual pilot" problem is practical and immediately threatens the foundation's mission to *do* good, not just *learn*.

  8.  **Review against Constraints:**
      *   8 objections? Yes.
      *   Attributed correctly? Yes.
      *   Phrasing matches persona? Yes.
      *   Concession/Reply/Soft Spot for each? Yes.
      *   Voluntary opening statements? Yes.
      *   One objection to grant fully? Yes.
      *   Killer question analysis? Yes.

  9.  **Final Polish:** Ensure tone is professional, strategic, and empathetic to the analyst's precarious position. (Self-Correction: Make sure the Program Officers' objection isn't too intellectual; keep it about "partners" and "trust".)

  *(Self-Correction during drafting Objection 6)*: The Economists might attack the Option Value specifically. Let's make sure one objection is about the "weak evidence" pilot winning over the "strong evidence" health program. That's the core tension.
  *(Self-Correction during drafting Objection 8)*: The Cost-Benefit Analyst might worry about the "Saturation Discount." How is that curve derived?
  *(Refining the "Killer Question")*: The user thinks it's coordination. I need to argue why "Perpetual Pilot Syndrome" (Option Value inflation) is worse. It undermines the *purpose* of the foundation.

  10. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  Here is your Q&A prep sheet. It is designed to get you through the vote, not to win a philosophy debate.

  ### **Pre-emptive Volunteering (First 2 Minutes)**
  *Do not wait for these to be asked. State them in your opening remarks to disarm the room.*

  1.  **To the EA Board Member:** "I want to be clear: ITN is not 'wrong.' It is a brilliant heuristic for cause prioritization at a global level. My proposal is not a replacement for ITN, but an operationalization of it for *marginal* allocation at *our specific scale*. ITN tells us where to look; this model tells us where to write the check."
  2.  **To the Program Officers:** "This model does not override your discretion on *which* partner to fund within a program area. It is a tool to decide how much capital to allocate to the program area itself. It protects your relationships by giving you a defensible reason to say 'we are capped here' to partners, rather than 'head office said no.'"
  3.  **To the Room (Regarding the Ranking Flip):** "I know the model ranks the Institutional Reform Pilot above the Global Health Delivery program. This is not because the Pilot saves more lives today. It is because the Health program is saturated—our next dollar there has diminishing returns—while the Pilot buys us information that prevents a bad billion-dollar decision in four years. I am asking you to pilot the *method*, not lock in that specific ranking forever."

  ---

  ### **The Eight Objections**

  #### **1. The Back-Test (Board Chair)**
  *   **The Objection:** "You're selling me leverage. If this model is smarter than ITN, show me the alpha. Run this backward five years. If we had used this then, do we avoid our two worst grants? Do we catch our best one? If the output looks the same as what we actually did, why are we changing the process?"
  *   **Concede:** "We cannot perfectly reconstruct the counterfactual funding paths of other donors from five years ago, so a precise back-test is impossible."
  *   **Whiteboard Reply:** Draw two curves. "The old model optimizes for *average* return per dollar (cost-effectiveness). This model optimizes for *marginal* return per dollar (impact of *our* specific check). Five years ago, we likely funded high-average-return projects that were already crowded. This model would have pushed us earlier into the 'uncrowded' bets we eventually made anyway, just sooner. The value isn't picking different winners; it's entering the position before the price goes up."
  *   **Soft Spot:** If the Chair presses on specific historical examples where the model would have caused you to miss a big win, you have no data. You are selling a theoretical improvement in capital allocation, not a proven track record.

  #### **2. The Identification Attack (Development Economist #1)**
  *   **The Objection:** "You're prioritizing a 'weakly evidenced' pilot over a 'well-evidenced' delivery program based on an 'option value' term. That is just a euphemism for funding things with poor identification strategies. How do you quantify option value without introducing massive researcher degrees of freedom?"
  *   **Concede:** "Option value is inherently uncertain and cannot be estimated with the same precision as cost-per-outcome."
  *   **Whiteboard Reply:** "Think of this as a Real Options analysis, not an RCT. The delivery program has a known distribution of outcomes. The pilot has a binary outcome: it resolves a parameter uncertainty for a future scale-up. If the cost of the pilot is less than the Expected Value of Perfect Information (EVPI) for the future decision, it is rational to fund it, regardless of current p-values. We aren't funding the pilot for its direct impact; we are funding it to retire risk on the future commitment."
  *   **Soft Spot:** If they ask for the specific formula used to calculate EVPI, and you are using a heuristic or a "guestimate," you lose credibility on rigor.

  #### **3. The Parameter Uncertainty (Cost-Benefit Analyst)**
  *   **The Objection:** "Your saturation discount and crowding terms rely on assumptions about other funders' behavior and absorption capacity. Have you run a Monte Carlo simulation on these inputs? What happens to the ranking if the absorption curve is 10% flatter than you estimate?"
  *   **Concede:** "I have not run a full Monte Carlo simulation for this proposal, only sensitivity analysis on key parameters."
  *   **Whiteboard Reply:** Draw a tornado diagram. "The ranking is robust to changes in the saturation curve. It is *not* robust to the crowding term. If we assume other funders would have stepped in anyway, the Institutional Pilot drops. That is why the pilot requires a specific due diligence step: we must verify the counterfactual funding gap before approval. The model flags the sensitivity; it doesn't hide it."
  *   **Soft Spot:** You are admitting the ranking flip hinges on a single, highly speculative input (the counterfactual of other funders).

  #### **4. The Partner Trust (Program Officer #1)**
  *   **The Objection:** "Partners don't think in marginal utility curves. They think in multi-year commitments. If we tell a global health partner we are capping them because of a 'saturation discount,' they will hear 'we are losing faith in you.' You're asking us to damage relationships based on a spreadsheet variable."
  *   **Concede:** "Communicating this externally as a formula would be disastrous. It must remain an internal allocation tool."
  *   **Whiteboard Reply:** "Currently, you have to tell partners 'no' based on opaque internal politics. This gives you a principled argument: 'We have reached the point of diminishing marginal returns in this specific strategy.' It actually professionalizes the conversation. It shifts the blame from the partner's performance to the market's capacity."
  *   **Soft Spot:** Program Officers know that "diminishing returns" sounds like a polite rejection. If they feel this strips their ability to make exceptions for loyal partners, they will sabotage the pilot during implementation.

  #### **5. The Transparency Defense (EA Board Member)**
  *   **The Objection:** "ITN is transparent. Anyone can read the EA Forum and understand it. Your model has four terms, three of which require internal proprietary data. You are moving us from a public good framework to a black box. How do we justify this to stakeholders?"
  *   **Concede:** "The new model is less transparent to outsiders than ITN."
  *   **Whiteboard Reply:** "ITN is transparent but mis-specified for allocation. It treats 'neglectedness' as a property of the cause, not of *us*. This model is transparent about *our* constraints. We can publish the *structure* of the model without publishing the proprietary data inputs. Transparency of logic is more important than transparency of inputs."
  *   **Soft Spot:** The EA community values open source. Moving to a "black box" feels like a betrayal of the ethos that brought this Board Member in.

  #### **6. The "Perpetual Research" Trap (Development Economist #2)**
  *   **The Objection:** "If option value is a positive term, doesn't this model structurally bias us toward funding research and pilots over delivery? You could always argue that 'learning more' has value. How do we prevent becoming a research fund that never scales?"
  *   **Concede:** "Yes, the model does bias toward information-generating grants when uncertainty is high."
  *   **Whiteboard Reply:** "That is a feature, not a bug, for a foundation with our horizon. However, the option value term decays. Once the pilot is done, the option value drops to zero. The model then forces a decision: scale or kill. It prevents us from endlessly funding pilots without making a go/no-go decision on the scale-up."
  *   **Soft Spot:** If the "scale-up" decision also uses this model, and the scale-up is crowded, the model might *still* recommend another pilot elsewhere. It creates a rationalization for avoiding hard delivery work.

  #### **7. The Counterfactual Verification (Cost-Benefit Analyst)**
  *   **The Objection:** "Your crowding term depends on knowing what other funders would have done. We don't know that. We are guessing. If we guess wrong, we either waste money (crowded out) or miss impact (underfunded). How do you validate the counterfactual?"
  *   **Concede:** "We cannot validate the counterfactual with certainty ex-ante."
  *   **Whiteboard Reply:** "We treat it like a market signal. We require evidence of other funder interest (LOIs, meeting notes) before claiming a gap exists. If we claim a gap, we document why. It forces us to have conversations with other funders that we currently avoid. Even if the estimate is wrong, the process of estimating it improves our market intelligence."
  *   **Soft Spot:** This adds significant administrative burden to the Program Officers, who will resent the extra due diligence required to prove a negative (that no one else will fund).

  #### **8. The Implementation Burden (Program Officer #2)**
  *   **The Objection:** "You want to pilot this for a year. Who calculates the saturation curves? Who models the counterfactuals? If this falls on my team on top of our current workload, the pilot will fail because we won't have time to do the math."
  *   **Concede:** "This does require more analytical upfront work than the current template."
  *   **Whiteboard Reply:** "My team (Research) will build the scaffolding. We will provide the saturation curves and the crowding baselines. Program Officers only need to provide the 'access and comparative advantage' score. We are not asking you to be economists; we are asking you to rate your own leverage."
  *   **Soft Spot:** If Research is understaffed (likely), the Program Officers will see this as an unfunded mandate and will quietly refuse to cooperate during the pilot.

  ---

  ### **The Objection to Grant Fully**
  **Grant this to the Development Economists:**
  *"The Option Value term is vulnerable to over-estimation bias."*

  **Why:** You cannot defend the precision of this number. It is the most subjective part of your model.
  **How to Grant:** "You are right. Without a strict cap or a standardized calculation method for Option Value, it is subject to optimism bias. I propose that for the pilot, the Option Value term cannot exceed 50% of the total score, and any grant relying on it for approval requires a second sign-off from the Committee. I will write that constraint into the pilot protocol."
  **Benefit:** This shows you are responsive to rigor concerns without abandoning the core concept. It turns a theoretical weakness into a governance guardrail.

  ---

  ### **The Killer Question**

  **Your Candidate:** The Coordination Worry (If everyone conditions on everyone else, funding collapses).
  **My Candidate:** **The "Perpetual Pilot" Problem (Option Value Inflation).**

  **Why my choice is the real killer:**
  The coordination problem is a game-theory abstraction that assumes other funders are also using your specific model. They aren't. The market will find an equilibrium even if you stand down. The Board Chair and the Program Officers care about *actual impact*, not theoretical market failures.

  The "Perpetual Pilot" problem, however, attacks the **mission**.
  If the Option Value term is robust, the model will *always* prefer buying information over buying outcomes, because information scales infinitely while outcomes saturate.
  *   **The Question:** "If the option value of learning is always positive, and the saturation discount on delivery is always negative, doesn't this model mathematically guarantee that we never scale anything? Are you proposing we turn this foundation into a permanent research institute?"

  **Why this kills the vote:**
  1.  **Program Officers:** They want to see things *happen*, not just be studied.
  2.  **Board Chair:** Wants leverage. Research has low leverage compared to scaled delivery.
  3.  **EA Board Member:** Effective Altruism is about *doing* good, not just knowing about good.
  4.  **Economists:** They know that "value of information" can be gamed to justify any expenditure.

  **How to prepare for it:**
  You must have a "Decay Mechanism" ready. Explain that Option Value is a *one-time* bump. Once the information is resolved (the pilot ends), the term vanishes. The model *forces* a scale-or-exit decision immediately after the pilot. If you cannot articulate the mechanism that forces the transition from "learning" to "doing," the Committee will vote no, fearing you are building a justification for endless consultancy rather than impact.
