answer: |-
  Part 1: Inventory of Sub-Problems

  To diagnose the friction, we must disaggregate the combination problem into its constituent mechanisms and translate them into statistical mechanical terms. First, the subject-summing problem asks how $N$ micro-subjects yield one macro-subject. In your vocabulary, this resembles how $N$ spins on a lattice yield a single magnetization vector. However, magnetization is a field value, not a new agent. Physics sums degrees of freedom; panpsychism demands the summation of *owners* of states. Second, the quality-combination problem asks how micro-qualities compose into macro-qualities. This maps loosely to how micro-energies compose into temperature. But temperature is an intensive statistical parameter, whereas phenomenal character is immediate and unified. Averaging energies does not produce a new quality; it produces a distribution parameter. Third, the structural mismatch worry notes that phenomenal character does not resemble physical structure. This is akin to noting that the symmetry of an order parameter does not always match the Hamiltonian's symmetry. Physics tolerates this via symmetry breaking; panpsychism struggles because experience lacks obvious symmetry groups to break. Fourth, the grain problem asks what counts as a subject at every scale. In physics, subsystem partitioning is pragmatic, defined by a renormalization scale $\Lambda$. In panpsychism, subjecthood seems ontological. If a thermostat is a composite, does it have a experience? Physics says the partition is imposed; panpsychism implies the partition might be factual. These do not behave alike because physics sums variables, while panpsychism attempts to sum ontologies.

  Part 2: Testing Your Mappings

  Let us test your three proposed mappings against the rigor of effective field theory. 

  Mapping (a) treats micro-subjects like spins and macro-consciousness as an ordered phase appearing above a threshold. This is physically coherent but empirically vulnerable. Phase transitions imply critical phenomena: diverging correlation lengths, critical slowing down, and universality classes. If consciousness is an ordered phase, there must be a critical point where systems flicker between conscious and non-conscious states with specific scaling laws. We do not observe humans exhibiting critical slowing down as they wake up, nor do we see a universality class for awakening mammals versus reptiles. Furthermore, phases are not subjects. A magnetized region does not "own" its magnetization. This mapping solves the structural combination but fails to generate the subjecthood required by the philosophy.

  Mapping (b) treats the macro-subject as a coarse-grained macrostate. This is the most natural physics fit but ontologically fatal. A macrostate is an epistemic tool, a description that throws away micro-information to manage complexity. It is not an additional entity over and above the microstates. Panpsychism requires the macro-subject to be real, not just a useful description. Moreover, averaging over subjects presupposes a common space in which they reside. If you average spins, you assume a lattice. If you average subjects, you assume a container of subjecthood. This mapping dissolves the combination problem by denying the reality of the macro-subject, which contradicts the panpsychist commitment to robust macro-consciousness.

  Mapping (c) suggests the top-down approach is merely the particles-versus-fields priority quarrel, settled by entanglement. This is where the glibness lies. Entanglement establishes correlation, not unity of experience. Two entangled electrons share a wavefunction, but there is no mechanism in quantum field theory that suggests they share a *perspective*. More critically, your intuition about renormalization-group (RG) flow is correct and damaging to the panpsychist. RG insight dictates that micro-details wash out at macro scales; the effective theory becomes insensitive to the microscopic lattice structure. If macro-experience is constituted by micro-experience, the micro-details should matter. If RG flow holds, macro-experience should be insensitive to the specific nature of the micro-experience, rendering the micro-experience irrelevant to the macro-phenomenology. This undercuts the claim that macro-experience is *constituted* by micro-experience. It suggests macro-experience is emergent in a way that makes the micro-level ontologically redundant for the macro-level description, which contradicts the fundamental motivation of panpsychism.

  Part 3: Residue Report

  Before constructing the residue report, I must list the candidate mappings I attempted and abandoned during this analysis. I tried mapping consciousness to a conserved current, assuming experience flows like charge; this failed because there is no local conservation law for experience observable in interaction vertices. I tried mapping consciousness to entropy, suggesting higher disorder equals higher experience; this failed because experience is often highly ordered (focused attention), and entropy is frame-dependent. I tried mapping consciousness to a gauge symmetry, treating experience as a redundancy in description; this failed because experience is the one thing that feels non-redundant to the holder.

  Here is the explicit residue report sorting the claims:

  **Clean Translations:**
  1.  **Scale Dependence:** The claim that experience exists at multiple scales translates cleanly to effective field theory's hierarchy of scales.
  2.  **Subsystem Partitioning:** The idea that the world is divided into parts translates cleanly to the physicist's choice of cutoff $\Lambda$ and subsystem definition.
  3.  **Effective Degrees of Freedom:** The notion that macro-systems have fewer variables than micro-systems translates cleanly to RG flow reducing degrees of freedom.

  **Distorted Translations:**
  1.  **"Subject" as "Degree of Freedom":** To make this fit, I had to bend ontology. A degree of freedom is a capacity for variation; a subject is an owner of variation. Physics tracks the variation, not the owner.
  2.  **"Experience" as "State Variable":** To make this fit, I had to bend phenomenology. A state variable (like pressure) is third-person accessible; experience is essentially first-person. The mapping retains the structural role but loses the intrinsic nature.
  3.  **"Combination" as "Interaction":** To make this fit, I had to bend the notion of unity. Interaction couples systems; combination is supposed to fuse them. Physics has coupling constants, not fusion operators for identities.

  **Untranslatable Claims:**
  1.  **The "Mineness" of Experience:** Physics describes states; it does not describe for whom the state is held. There is no operator for ownership.
  2.  **The Intrinsic Nature Itself:** Russellian monism posits experience as the intrinsic nature of mass/charge. Physics defines mass/charge by their relations (couplings). The intrinsic "stuff" is explicitly excluded from the formalism.
  3.  **Unity of Consciousness:** The fact that my visual field and auditory field are experienced as one scene has no analog in Hilbert space tensor products, which merely correlate subspaces.

  Part 4: Verdict on the Residue

  Does this residue reveal a blind spot in physics or indeterminacy in philosophy? My verdict is that it reveals the philosophical claim is less determinate than it looks. The residue is not a structural incapacity of physics to describe the world, but a sign that panpsychism has smuggled in assumptions that your vocabulary neither contains nor needs.

  Specifically, the debate assumes that "subject" is a countable noun analogous to "particle." In physics, particles are excitations of fields, defined by their interactions. There is no "particlehood" beyond the mathematical structure. Panpsychism assumes subjecthood is a primitive property that can be aggregated. Your framework shows that aggregation is always a matter of effective description, not ontological summation. The blind spot is not in physics; it is in the expectation that physics should track "owners" of states.

  Furthermore, the combination problem relies on a specific notion of grounding or constitution that is never made precise. When a panpsychist says micro-experiences "combine" to form macro-experience, do they mean mereological summation? Causal integration? Informational binding? Without a defined mechanism—akin to a Hamiltonian term that specifies how subjects couple—the claim is metaphorical. Your vocabulary exposes this: you cannot write down a Lagrangian for subject-summing because the variables are not defined.

  The residue indicates that the combination problem is likely a category error generated by language. We speak of "minds" as things that can be added, like bricks. Physics teaches us that macro-behaviors are often structurally decoupled from micro-details via RG flow. If experience follows physical law, it should also decouple. If it does not decouple, it is not physical in the way we understand. The problem is not that physics cannot see experience; it is that the philosophical demand for "combination" presupposes a mereology that effective field theory suggests is false. The universe does not appear to be built by stacking subjects; it appears to be built by fields interacting across scales. The residue is the sound of a square peg (subject) being forced into a round hole (state space), and the friction you feel is the realization that the peg might not exist.
