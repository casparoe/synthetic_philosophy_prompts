answer: |-
  # 1. The Question

  **Final-Year Seminar: Philosophy of History**
  **Final Paper – Question 4**

  **Time Allowed:** 45 minutes
  **Word Ceiling:** 900 words
  **Total Marks:** 25

  **Instructions:**
  1.  **No Credit for Names:** You will receive no credit for naming authors, texts, or schools of thought (e.g., "Whig history," "Cambridge School"). Argue from principles.
  2.  **Metaphysical Warning:** Do not discuss the metaphysics of time (the thesis that only present entities exist). It is irrelevant to this question.
  3.  **The Principle:** Assess the following *Retrospective Parity Principle* (RPP): *Apply to past agents only those standards you would be willing to have a better-informed historian of the twenty-second century apply to you.*
  4.  **The Cases:**
      *   **Case A:** An elected legislator in a slaveholding society (late 1850s) votes to extend chattel slavery and defends it in explicitly religious language. Abolitionist arguments are in wide circulation at this time.
      *   **Case B:** A public-health official licenses a sedative for use by pregnant women on the evidence available at the time. The causal link to severe birth defects is not established until years later.

  **The Task:**
  Distinguish between **moral-evaluative presentism** (appraising agents by our norms), **epistemic presentism** (appraising agents by what we now know), **explanatory presentism** (explaining events by their outcomes), and **agenda presentism** (choosing topics due to present concerns). State which objections bite against which type. Apply the RPP to Case A and Case B. Explain whether the RPP is a stable constraint or collapses under scrutiny (considering strong vs. weak readings). Finally, address whether using later vocabulary (e.g., "structural racism") to describe past practices is objectionable presentism or *avant la lettre* description, and clarify the gap between judging an act and blaming an agent.

  ***

  # 2. Model Answer

  Historiographical presentism is not a single error but four distinct practices, each requiring separate verdicts. **Moral-evaluative presentism** judges past agents by current norms; **epistemic presentism** faults them for lacking future knowledge; **explanatory presentism** treats past events as inevitable steps toward the present; **agenda presentism** selects topics based on contemporary relevance. Objections to anachronism bite hardest against epistemic and explanatory presentism, which distort historical reality. Moral and agenda presentism are contested: the former is unavoidable for ethical history, the latter is methodologically necessary.

  Applying this to the stipulated cases clarifies the distinction. In **Case A**, the legislator operates within a slaveholding society, but abolitionist arguments are available. Criticizing this agent involves moral-evaluative presentism. However, because the moral knowledge (the wrongness of slavery) was accessible at the time, applying our norm is not epistemic presentism. The agent had access to the requisite moral resources. In **Case B**, the official licenses a drug based on available evidence; the harm is unknown. Criticizing this agent involves epistemic presentism. Since the causal link was unknowable then, applying current knowledge is objectionable. The cases come out differently because Case A involves accessible moral truth, whereas Case B involves inaccessible empirical truth.

  The *Retrospective Parity Principle* (RPP) attempts to mediate these judgments but proves unstable. Under a **strong reading**, the historian must withhold any judgment that a future historian might overturn. Since future norms may condemn what we currently permit (e.g., carbon emissions), the strong reading forbids condemning anything at all, paralyzing historical ethics. Under a **weak reading**, the historian applies current standards they currently endorse. This permits exactly the moral condemnations the RPP was meant to block, rendering the principle redundant. The RPP is therefore not a tidy middle way but a unstable constraint that collapses into either skepticism or status-quo bias.

  This instability highlights the gap between judging an act and blaming an agent. We can judge the legislator's act (voting for slavery) as wrong without blaming the agent if their moral horizon was sufficiently constrained. However, in Case A, the horizon was not constrained; abolitionist arguments existed. Thus, blame is appropriate. In Case B, the horizon was constrained by empirical limits; blame is inappropriate. The claim that "agents who could not have known better are not blameworthy" is itself a normative claim we hold now and project onto the past. This projection is benign only if we accept that our own immunity from future blame depends on the accessibility of knowledge to us now. If we claim immunity for ignorance we currently possess but future historians will condemn, we must accept that past agents claiming similar ignorance must be treated similarly. Consistency demands we distinguish accessible from inaccessible norms.

  Regarding vocabulary, describing earlier practices with concepts that did not then exist (e.g., "structural racism") is not objectionable presentism if the concept tracks real social structures rather than merely imposing a label. It is *avant la lettre* description. Objectionable presentism occurs only when the vocabulary implies intentions or knowledge the agents could not have had. In Case A, "structural racism" describes the system the legislator upheld, even if they lacked the term. In Case B, calling the official "negligent" implies knowledge they lacked, making it objectionable.

  The honest historian is left entitled to condemn past acts using current vocabulary while withholding blame from agents who lacked access to the requisite moral or epistemic resources, provided they accept the same vulnerability for themselves.

  ***

  # 3. Marking Scheme

  | Point | Marks | What an A answer does | What a B answer does instead | The error this point is designed to catch |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Distinction of Senses** | 5 | Clearly defines all four types (moral, epistemic, explanatory, agenda) and assigns distinct verdicts to each. | Conflates the types or treats "presentism" as a monolithic error. | Failure mode (i): Treating presentism as a single "Whig" error. |
  | **2. Case A Diagnosis** | 5 | Identifies Case A as moral-evaluative; notes abolitionist arguments make the norm accessible; permits blame. | Treats Case A as purely contextual or excuses the agent solely due to era. | Failure mode (ii): Assuming intentionalism settles moral appraisal. |
  | **3. Case B Diagnosis & Contrast** | 5 | Identifies Case B as epistemic; notes causal link was unknowable; forbids blame. Contrasts explicitly with Case A. | Treats Case B same as Case A, or fails to explain why the epistemic limit matters. | Failure mode (iii): Arguing all history is situated therefore all judgment is equal. |
  | **4. RPP Stability Critique** | 5 | Demonstrates RPP instability: strong reading paralyzes judgment; weak reading permits current bias. | Accepts RPP as a successful solution or critiques it without analyzing the strong/weak readings. | Failure mode (iv): Asserting a bland compromise without accounting for the normative gap. |
  | **5. Vocabulary & Agent/Act** | 5 | Distinguishes act judgment from agent blame; validates *avant la lettre* vocabulary if it tracks structure. | Conflates judging the act with blaming the agent; rejects all later vocabulary as anachronistic. | Failure mode (ii)/(iv): Confusing moral appraisal with blame or vocabulary with intent. |
  | **Total** | **25** | | | |

  **Withholding Marks:**
  No marks are awarded for defining presentism alone; definition must serve the argument. No marks are given for the "unavoidability argument" (that presentism is unavoidable therefore not faulty) unless the inference from situatedness to incurability is explicitly criticised. No marks are awarded for naming authors (e.g., Butterfield, Oakeshott) or texts; this is a test of reasoning, not recall. Scripts that rely on the metaphysics of time are disqualified from scoring above 10 marks.

  **Class Characterisation:**
  *   **First-Class:** Diagnoses the RPP as unstable and distinguishes accessible vs. inaccessible norms to justify differential treatment of Case A and Case B.
  *   **Upper-Second:** Distinguishes the four types and applies them to the cases correctly but accepts the RPP as workable or fails to fully critique the agent/act gap.
  *   **Third-Class:** Treats presentism as a single error, conflates the two cases, or relies on the "unavoidable therefore not faulty" defence without critique.

  ***

