answer: |-
  **Fellowship Proposal: Taxonomising Moral Inclusion for Funding Criteria**

  **The Research Question**
  What minimal taxonomy of variables is required to prevent the conflation of scope, weight, and resolution in moral circle funding criteria?

  This question admits of a determinate answer: either such a taxonomy can be constructed without collapsing into a single metric, or it cannot. If the variables prove conceptually inseparable, the answer is negative, and the search for distinct indicators must cease. If they are separable, the output is a defined set of dimensions that must be measured independently.

  **Context and Critique**
  Current debates regarding moral circle expansion typically ask whether moral progress is occurring, and whether it is driven by reason, sentiment, or institutional change. This framing leaves my question untouched because it treats 'expansion' as a unitary vector. Philosophers argue over the engine of progress; historians argue over the trajectory. However, for a monitoring and evaluation practitioner, the problem is not causality or truth, but validity.

  When we measure 'expansion' via proxy indicators—such as the number of species covered by a policy or the frequency of inclusive language—we implicitly settle philosophical questions about what matters. We assume that adding beings to a category (scope) is equivalent to increasing the weight given to their interests, or that recognising a group (resolution) implies genuine institutional protection. The standard debate obscures the possibility that these variables move independently. A programme might expand scope (admitting more species) while reducing weight (diluting resources) or lowering resolution (treating distinct individuals as a homogeneous mass). By focusing on whether the circle is growing, rather than how its geometry is changing, existing frameworks permit perverse incentives where organisations optimise for countable inclusion rather than meaningful protection. This project isolates the measurement problem from the moral metaphysics.

  **Work Plan**
  This nine-month, part-time fellowship requires no research budget and no primary data collection. It relies on conceptual analysis and the desk review of publicly available funding criteria.

  *Months 1–3: Conceptual Architecture*
  I will dedicate these months to defining the three axes: scope (who is included), weight (how much their interests count), and resolution (the granularity of distinction). I will analyse existing philosophical arguments not for their truth claims, but for their operational implications. The goal is to produce working definitions that are mutually exclusive. For instance, I will test whether 'legal personhood' measures scope or resolution, and whether 'budget allocation' measures weight or merely activity. I will draft preliminary definitions and test them against edge cases, such as programmes that advocate for future generations versus those supporting current marginalised groups.

  *Months 4–6: Stress-Testing Against Criteria*
  I will gather publicly available funding criteria from philanthropic intermediaries, human rights grant-makers, and effective altruism funds. I will not contact these organisations but will analyse their public documentation. I will map their current indicators against the three-axis taxonomy developed in the first quarter. This will reveal where conflation currently occurs. For example, if a funder counts 'countries operated in' as a success metric, I will analyse whether this captures scope without regard for weight. I will document specific instances where improving one metric would theoretically degrade another, identifying the trade-offs inherent in current practice.

  *Months 7–9: Synthesis and Guidance*
  The final quarter will focus on translating the taxonomy into a practical tool. I will draft a framework that allows funders to select indicators without unintentionally settling the philosophical questions discussed above. I will create a decision tree for drafting criteria: if you measure scope, what complementary measure of weight is required to prevent dilution? I will refine this through informal peer review with colleagues in the sector, ensuring the language is accessible to programme officers rather than only philosophers. The final weeks will be dedicated to editing the deliverable for clarity and utility.

  **Deliverable**
  The output will be a 'Dimensional Risk Framework for Moral Inclusion Criteria'. This will be a practical guidance note for programme officers drafting calls for proposals. It will include a glossary distinguishing scope, weight, and resolution, and a checklist for identifying conflation in draft indicators. For example, it will warn against using 'number of beneficiaries' as a sole proxy for moral inclusion without a corresponding measure of benefit depth. The framework will enable funders to specify which axis they intend to expand, ensuring that reporting requirements align with strategic intent rather than vague notions of progress.

  **Failure Conditions**
  I will know the project has failed if the three variables prove conceptually inseparable. If, upon rigorous analysis, 'weight' cannot be defined without referencing 'scope', or if 'resolution' collapses into 'weight', the taxonomy is invalid. In this case, the project would conclude that current indicator sets are inevitably philosophically loaded, and the deliverable would instead be a warning against attempting to measure expansion quantitatively.

  Additionally, the project fails if the resulting framework is too abstract for practical use. If programme officers cannot apply the taxonomy to a draft grant agreement without philosophical training, the tool has not solved the operational problem. Success requires a framework that is robust enough to handle the philosophical tension but simple enough to sit alongside standard logframes.
