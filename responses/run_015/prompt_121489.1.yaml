answer: |-
  Good morning. Welcome to everyone—especially our philosophy undergrads, and the parents and teachers who, I suspect, are here primarily for the free coffee. I appreciate you both being here. And yes, before anyone asks: the flyer says "Philosphy of Justice." We are philosophers; we leave letters out the way bakers leave flour on the counter. It's a feature, not a bug.

  Our topic is "What People Actually Deserve." But I want to start with a story about my grandmother. She was not a philosopher, but she had a robust moral theory. When someone hurt her—cheated her out of money, broke a promise—she wouldn't get angry. She'd just say, "Don't worry. Karma."

  For her, karma was a tool for forgiveness. It allowed her to step out of the role of punisher because she trusted the universe to handle the balance. But as we dig into the structure of that belief, we run into a tension that I hope we can wrestle with today.

  We can divide karma into two models. First, **Ledger Karma**. This is transactional. You do harm, you incur a debt. Desert is tracked like a social account. But a ledger requires a debtor. If I die before the debt is paid, who pays? If the answer is "no one," the ledger fails. If the answer is "me, in a future life," then karma collapses into retributivism *unless* you can solve the metaphysics of personal identity across rebirths.

  I want to be clear on the state of the debate here: It is **settled** that without a continuous subject, moral desert cannot attach to a specific agent. However, it is genuinely **contested**—even among serious scholars of religion and metaphysics—whether rebirth provides that continuity or merely creates a new subject who is punished for another's sins. We cannot treat rebirth as a consensus solution to the desert problem today; it is a hypothesis that carries its own heavy philosophical costs.

  Then there is my grandmother's version: **Equilibrium Karma**. This isn't a ledger; it's homeostasis. The universe tends toward balance, like a thermostat. Bad acts create tension; suffering releases it. But here is the catch: If karma is just systemic equilibrium, it stops being about *justice* and starts being about *physics*. If a tyrant trips and breaks his leg, did he *deserve* that? Or did the cosmos just correct an energy imbalance? If it's the latter, "desert" drops out of the equation entirely.

  So, here is the work for us this morning. We need to see if we can hold onto the comfort my grandmother found in karma without ignoring the structural cracks. Can we have moral desert without a ledger? Can we have cosmic balance without losing the human agent?

  We aren't going to solve metaphysics by lunch. But if we can clarify where the ledger ends and the homeostasis begins, we'll have done good work. Thank you for coming. Please, grab some coffee, and let's get started.
