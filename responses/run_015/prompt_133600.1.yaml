      *   *Option B (Abandon Frame):* Some argue Kripke misread Wittgenstein. The "Wittgensteinian" move is to dissolve the question, not answer it.
      *   *Recommendation:* Progress comes from recognizing the demand for a "super-fact" is the mistake. Shift to *practice*.

  5.  **Address the LLM Analogy:**
