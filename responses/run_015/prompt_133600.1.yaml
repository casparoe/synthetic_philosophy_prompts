      *   *Connection to Cognitive Science:* This relates to the "symbol grounding problem" or Harnad. But Kripkenstein is more radical: it's not about grounding, it's about the *factuality* of the interpretation itself.
      *   *Verdict:* It's not an empirical disagreement. It's a philosophical one about the *logical space* of reasons vs. the *logical space* of causes.

  4.  **Address "What Counts as Progress":**
