  7.  **Final Polish:** Check the "Institutional Design" claim. That's a big pivot from standard "Reward Specification." I need to make sure the reply defends why "Institutional" is better than "Preference Learning." (Answer: Preferences are unstable/context-dependent; institutions constrain the context).

      *Self-Correction on Objection 1:* The prompt asks for the "Transparency reduces to Robustness" objection to be included. I should place it high, likely #1 or #2. Let's make it #1 because if transparency is just robustness to scrutiny, the triad collapses.

      *Self-Correction on "Incommensurable":* This is a strong word. It means no common measure. I should probably soften this to "orthogonal" in the replies while holding the "conceptual distinction" line. Actually, the prompt says I'm defending "incommensurable." I need to stick to that but explain it carefully (you can't trade off one for the other).

      *Refining the "Must Land" Reply:* It needs to be about *intervention*. If I improve Transparency, does Robustness automatically improve? If no, they are distinct tasks.

  8.  **Finalizing the Output Structure:**
      *   Upfront Concessions.
