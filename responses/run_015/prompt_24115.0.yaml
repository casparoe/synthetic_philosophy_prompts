          1.  $p$ is true.
          2.  $S$ believes $p$.
          3.  If $p$ were false, $S$ would not believe $p$ (Variation/Sensitivity).
          4.  If $p$ were true, $S$ would believe $p$ (Adherence/Safety-ish).
          *   *Crucial Feature:* Sensitivity (3) fails for skeptical hypotheses (e.g., BIV). If I were a BIV, I would still believe I have hands. So I don't know I'm not a BIV. But I *do* know I have hands (if I weren't, I wouldn't believe I was).
