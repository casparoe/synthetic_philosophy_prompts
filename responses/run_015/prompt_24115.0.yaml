          *   If Tracking denies closure, Tracking is wrong (or needs fixing).
          *   *Strategy:* Fix the method individuation or the similarity metric for counterfactuals to save closure *within* a reliabilist/externalist framework, or abandon Tracking for Safety/Contextualism.

  3.  **Diagnosing the Impasse (The "Why"):**
