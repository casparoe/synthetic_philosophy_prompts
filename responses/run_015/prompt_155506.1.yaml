      *   Prose not bullets? Yes.
      *   Max 600 words? Yes.

  7.  **Final Polish:** Ensure flow and tone are appropriate (analytical, philosophical). The draft looks solid. I will ensure the transition between paragraphs is smooth.

      *Self-Correction on "Strictly Presupposed":* I need to be careful. Means-testing *strictly* presupposes family responsibility. Income-contingent repayment *strictly* presupposes uncertain returns. The credit record bit is *not* strictly presupposed, it's a policy choice. I made that distinction in the draft. Good.

      *Refining the "Coherence" section:* Make sure to highlight the tension between parental obligation and student debt.

      *Refining the "Nordic" section:* Emphasize the shift in the "responsible unit."

