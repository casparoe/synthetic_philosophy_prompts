  I'm prepping a reading group session on the metaphysics of dispositions and I keep getting stuck on the fink/mask disctinction, and I'm worried I'm just gonna reguritate the textbook contrast at the group. Could you compare finkish dispositions and masked dispositions for me, but go past the standard "a demon swaps the fragile glass for a non-fragile one right before you drop it" versus "the fragile glass is sitting in a protective case" examples? I want the group to see that the line between the two is more fragile than the textbooks suggest, so I'd rather have a comparison that's honest about where it gets fuzzy than one that just lays the two definitions out side by side.

  What I really want to get at is whether the distinction is actually stable, or whether it's doing less work than it looks like. I keep coming back to the stacked cases — a mask that is itself finkish (the protective case gets pried open just before impact), or a fink that is masked in some way — and I can't tell whether those collapse the fink/mask line or whether they just show that "fink" and "mask" are both really just labels for "a disposition that fails to manifest for some external reason." And I want to know whether the distinction can even be cashed out in a counterfactual analysis, or whether it just dissolves once you try to formalize it. If it's tied up with the Humean vs. non-Humean debate about whether dispositions are reducible to counterfactual conditionals, I'd like that spelled out too, but the main thing is the comparison itself.
