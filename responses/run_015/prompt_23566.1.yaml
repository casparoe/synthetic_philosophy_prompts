answer: |-
  This is a great instinct. The textbook distinction (Fink = intrinsic loss of basis; Mask = extrinsic interference) is clean in the abstract but notoriously leaky when you press on the metaphysics of *where* the disposition lives. If you go into your reading group just repeating the "demon vs. packing peanuts" contrast, you'll miss the most interesting part of the literature: the fact that the Fink/Mask distinction is often a proxy for the deeper battle over whether dispositions are intrinsic properties at all.

  Here is a breakdown designed to help you facilitate a session that exposes the instability of the distinction, moves beyond the standard examples, and ties it to the counterfactual/Humean debate.

  ### 1. The Standard Distinction (and Why It's Too Clean)

  Briefly, for setup:
  *   **Fink:** The stimulus causes the disposition (or its categorical basis) to vanish *before* manifestation. (The glass ceases to be fragile the moment it is struck).
  *   **Mask:** The disposition remains, but an external factor prevents the manifestation. (The glass is fragile, but wrapped in foam).

  **The Textbook Promise:** Finks threaten the *existence* of the disposition; Masks threaten the *detection* of the disposition.
  **The Reality:** Both threaten the truth of the Simple Counterfactual Analysis (SCA): *$x$ is disposed to $M$ if $S$ were to occur, $x$ would $M$.* In both cases, $S$ occurs, but $M$ does not.

  ### 2. Where the Line Blurs: The "Intrinsic" Problem

  The standard distinction relies on a robust Intrinsic/Extrinsic split. Finks are usually intrinsic changes; Masks are usually extrinsic blockers. But dispositions are rarely hermetically sealed inside objects.

  **Better Example 1: Smart Materials (The Self-Protecting Glass)**
  Imagine a glass treated with a nanotech coating. When struck ($S$), the coating instantly hardens and redistributes the force, preventing shattering ($\neg M$).
  *   **Is this a Mask?** The fragility (the molecular lattice structure) is still there. The coating is an added layer.
  *   **Is this a Fink?** The coating reacts *to the stimulus* to change the object's behavior. If the coating is bonded at the molecular level, is it really "extrinsic"?
  *   **The Blur:** If the "mask" is triggered by the stimulus, it starts looking finkish. If the "fink" (the removal of fragility) is achieved by adding a shield rather than removing bonds, it starts looking masked. The distinction collapses into a question of **mereology** (what counts as part of the object?) rather than modality.

  **Better Example 2: Biological Homeostasis**
  Consider a sugar cube's solubility. Drop it in water ($S$), it dissolves ($M$). Now consider a living cell. Drop it in hypotonic water ($S$), it *doesn't* burst ($\neg M$) because ion pumps activate to expel water.
  *   Does the cell lack the disposition to burst (Fink)?
  *   Or does it have the disposition, but the pumps mask it?
  *   **The Problem:** The pumps are *internal*. If Finks must be intrinsic, this looks like a Fink. But the pumps are distinct from the membrane's permeability. This suggests the Fink/Mask distinction tracks **causal salience** (what we are focusing on) rather than metaphysical structure.

  ### 3. Stacked Cases: Collapsing the Distinction

  You mentioned stacked cases, and this is where the distinction really threatens to dissolve.

  **Case A: The Finkish Mask**
  A fragile vase is packed in foam (Mask). However, the foam is designed to disintegrate upon impact (Finkish element).
  *   *Impact occurs.* Foam vanishes. Vase breaks.
  *   *Analysis:* The mask was finkish. But did the vase manifest its disposition? Yes. So the mask failed. This suggests "Mask" isn't a stable property of the setup, but a description of a *failed prevention*.

  **Case B: The Masked Fink**
  A fragile vase has a demon attached to it who removes fragility upon impact (Fink). However, a wizard binds the demon so he cannot act (Masking the Fink).
  *   *Impact occurs.* Demon is stopped. Vase breaks.
  *   *Analysis:* The fink was masked. The disposition manifested.

  **The Takeaway for the Group:**
  In both stacked cases, the outcome is the same: the object breaks. The labels "Fink" and "Mask" become reversible descriptors of the *interfering chain*, not the disposition itself.
  *   If you focus on the **foam**, it's a mask.
  *   If you focus on the **foam's disintegration**, it's a finkish mechanism.
  *   **Conclusion:** The distinction is not ontological (about the world); it is **perspectival** (about which causal link we are isolating). If the distinction is perspectival, it cannot do the heavy metaphysical lifting required to save the Counterfactual Analysis.

  ### 4. Counterfactual Analysis: Does it Hold Up?

  This is the crux of your second question. Can we cash this out formally?

  **The Failure of SCA:**
  Both Finks and Masks make the conditional "If $S$, then $M$" false. Therefore, if dispositions are *reduced* to these conditionals (Humeanism), there is no difference between a Fink and a Mask. They are both just "exceptions to the rule."

  **Lewis's "Causal Basis" Fix:**
  David Lewis tried to save the analysis by saying: $x$ has a disposition if it has an *intrinsic causal basis* $B$ such that if $S$ occurs and $B$ persists, $M$ happens.
  *   **Finks:** $B$ does not persist.
  *   **Masks:** $B$ persists, but something else interferes.

  **The Circularity Problem:**
  To know if it's a Fink or a Mask, you have to know if the basis $B$ persisted. But how do we test if $B$ persisted? Usually by checking if the disposition manifested!
  *   If the glass breaks, we say the basis persisted (so it wasn't finked).
  *   If it doesn't break, we have to guess: did the basis vanish (Fink) or was it blocked (Mask)?
  *   **Result:** We often determine whether something was a Fink or a Mask *based on our prior theory of the disposition*, not the other way around. This makes the distinction useless for *analyzing* dispositions. It presupposes the very ontology it's trying to explain.

  ### 5. Humean vs. Non-Humean Implications

  This is where you can tie the session together. The stability of the Fink/Mask distinction depends entirely on your camp.

  **For the Humean (Regularity Theorist):**
  *   Dispositions are just summaries of counterfactuals.
  *   Finks and Masks are **identical in function**: they are both "interfering factors" that make the conditional false.
  *   The distinction is pragmatic. We call it a "Mask" if we can remove the interferer and get the result. We call it a "Fink" if removing the interferer doesn't help because the object changed.
  *   *Verdict:* The distinction is unstable and doesn't matter metaphysically.

  **For the Non-Humean (Powers Realist):**
  *   Dispositions are real, irreducible properties (Powers).
  *   The distinction is **ontologically critical**.
      *   A Mask leaves the Power intact but blocks its *exercise*.
      *   A Fink removes the Power itself.
  *   *Verdict:* The distinction *must* be stable for the theory to work, but as shown above, it's hard to ground without circularity. This is a major vulnerability for Powers Realism. If they can't cleanly distinguish a blocked power from a lost power, their ontology is muddy.

  ### 6. Discussion Questions for the Group

  To move the session past regurgitation, try posing these problems:

  1.  **The Boundary Question:** "If a 'mask' is permanently bonded to the object at a molecular level (like the nanotech glass), does it become part of the object's intrinsic nature? If so, does the mask turn into a fink?"
  2.  **The Diagnostic Question:** "Imagine we don't know the microphysics of an object. It fails to manifest under stimulus. Is there *any* empirical test that can distinguish a Fink from a Mask without already assuming what the disposition is?" (This targets the circularity).
  3.  **The Reduction Question:** "If the Simple Counterfactual Analysis fails for both Finks and Masks in the exact same way (the conditional is false), does positing a metaphysical distinction between them actually solve the problem, or does it just name the problem?"
  4.  **The Stacked Question:** "If a mask can be finkish, and a fink can be masked, are 'Fink' and 'Mask' properties of the *disposition*, or are they just descriptions of the *causal history* of a specific event?"

  ### Summary for your Prep
  The Fink/Mask distinction is **pragmatically robust but ontologically fragile**.
  *   **Pragmatically:** We use it to decide how to fix things (remove the packing vs. reinforce the glass).
  *   **Ontologically:** It dissolves under pressure because it relies on a contested Intrinsic/Extrinsic split and creates circularity when used to define dispositions via counterfactuals.

  If you frame the session around the idea that **"Fink and Mask are not natural kinds, but explanatory strategies,"** you will get a much richer discussion than if you treat them as metaphysical categories. This acknowledges the textbook view while showing why it's insufficient for serious metaphysics.
