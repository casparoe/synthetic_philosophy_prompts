answer: |-
  Here is the translation of the epistemological dispute into Signal Detection Theory (SDT) terms, followed by the residue report you requested.

  ### The Setup
  *   **State of the World ($S$ vs. $N$):** $p$ is True (Signal) vs. $p$ is False (Noise).
  *   **Evidence ($x$):** The subject's internal response (memory strength, perceptual clarity) drawn from distributions $f(x|S)$ and $f(x|N)$.
  *   **Sensitivity ($d'$):** The discriminability of the evidence distributions. Fixed by the quality of the subject's information access.
  *   **Decision Variable:** The likelihood ratio $\lambda(x) = \frac{f(x|S)}{f(x|N)}$.
  *   **Criterion ($\beta$ or $c$):** The threshold on $\lambda(x)$ required to output "Yes."
  *   **Payoff Matrix:** The costs/benefits of Hits, Misses, False Alarms, and Correct Rejections. Determines the *optimal* criterion $\beta_{opt}$.
  *   **Output:** A binary decision ("I know $p$" / "I act on $p$").

  ---

  ### 1. The Three Positions in SDT Terms

  #### Classical Invariantism
  *   **Sensitivity ($d'$):** Determined solely by the subject's evidence (e.g., memory clarity). Fixed across stakes conditions.
  *   **Decision Variable:** The likelihood ratio of the evidence.
  *   **Threshold ($\beta_{K}$):** The criterion for applying the predicate "knows" is **fixed**. It is a constant parameter determined by the semantics of the word "know," independent of the payoff matrix.
  *   **Threshold ($\beta_{Action}$):** The criterion for *acting* is **variable**. It shifts according to the payoff matrix (stakes).
  *   **The Claim:** In High Stakes, $\beta_{Action}$ shifts right (conservative), but $\beta_{K}$ stays put. Therefore, a subject can exceed $\beta_{K}$ (Know) but fail to exceed $\beta_{Action}$ (Don't Act). "Knows" tracks a fixed Type I error rate, not utility maximization.

  #### Epistemic Contextualism
  *   **Sensitivity ($d'$):** Determined solely by the subject's evidence. Fixed across contexts.
  *   **Decision Variable:** The likelihood ratio of the evidence.
  *   **Threshold ($\beta_{K}$):** The criterion for applying "knows" is **variable**, but it is set by the **Attributor's** context (the person saying "S knows"), not the Subject's stakes.
  *   **Mechanism:** Salience of error possibilities to the *Attributor* alters the Attributor's effective payoff matrix. If the Attributor is in a high-stakes context (or discussing high stakes), they adopt a conservative $\beta_{K}$.
  *   **The Claim:** The Subject's $d'$ and internal state are invariant. The truth value of the sentence "S knows" changes because the *observer's* criterion for labeling that state as "knowledge" shifts. It is a measurement artifact, not a change in the subject's signal processing.

  #### Pragmatic Encroachment
  *   **Sensitivity ($d'$):** Determined solely by the subject's evidence. Fixed across stakes.
  *   **Decision Variable:** The likelihood ratio of the evidence.
  *   **Threshold ($\beta_{K}$):** The criterion for applying "knows" is **variable** and set by the **Subject's** payoff matrix.
  *   **Mechanism:** "Knows" is functionally defined as "warranted to act." Therefore, $\beta_{K} \approx \beta_{opt}$ (the criterion that maximizes expected value given the stakes).
  *   **The Claim:** In High Stakes, the cost of a False Alarm (believing $p$ when false) increases. $\beta_{opt}$ shifts right. Consequently, the threshold for "knows" shifts right. The same $x$ that yielded "Know" in Low Stakes yields "Don't Know" in High Stakes. Sensitivity is constant; the operating point moves.

  ---

  ### 2. Residue Report

  #### Residue 1: Asymmetry of Stakes vs. Symmetry of Criterion Shifts
  In SDT, a criterion shift is bidirectional. If the payoff for a Hit increases drastically (e.g., "If you identify the signal, you save the world"), $\beta_{opt}$ shifts *left* (liberal), increasing False Alarms to capture more Hits. In the epistemological cases, stakes almost exclusively *raise* the bar (shift right). We rarely hear that low stakes make it *easier* to know than baseline, only that high stakes makes it *harder*.

  *   **The Fudge:** I mapped "stakes" exclusively to the cost of False Alarms/Misses ($C_{FA}, C_{Miss}$). To make the epistemological cases fit SDT, I assumed the "Low Stakes" payoff matrix represents a neutral baseline $\beta = 1$ (or some semantic default), and "High Stakes" only adds cost to errors. I ignored the SDT possibility that low stakes could theoretically lower $\beta_{K}$ below the invariantist baseline, generating "hyper-knowledge."
  *   **Verdict:** This points to something **SDT can express but epistemologists ignore.** SDT predicts that if the reward for True Belief were sufficiently high (and cost of error low), the rational criterion should lower. If Pragmatic Encroachment is true, there should be cases where trivial stakes make knowledge *easier* to attain than in ordinary contexts. The fact that the literature focuses only on "raising the bar" suggests the debate is driven by skeptical anxiety (fear of False Alarms) rather than a general theory of utility-based thresholds. The asymmetry is psychological, not structural.

  #### Residue 2: The Identification Problem (Ground Truth)
  In SDT, $d'$ and $c$ are identifiable only if you have a Receiver Operating Characteristic (ROC) curve generated over many trials with known ground truth. You need the Hit Rate and False Alarm Rate to solve for the parameters. In the epistemological cases (e.g., "Bank Case"), we have $N=1$. We have one subject, one trial, and no access to ground truth frequencies (we don't know the base rate of banks being open, nor the variance of the subject's memory across possible worlds). We only have intuitions about whether to label the output "Knowledge."

  *   **The Fudge:** I treated the philosophers' "intuitions" as if they were stable estimates of underlying probability distributions. I assumed that when an Invariantist says "$d'$ is sufficient," they imply a stable Hit Rate across trials, whereas the Encroacher implies the Criterion moved. In reality, without a reference class of trials, $d'$ and $c$ are perfectly confounded. A drop in "Knowledge" ascriptions could mathematically be modeled as a drop in $d'$ (sensitivity) rather than a shift in $c$ (bias).
  *   **Verdict:** This points to a **parameter-identification failure.** The dispute between Invariantism and Encroachment is empirically underdetermined given the data available (single-case intuitions).
      *   Invariantism says: $c$ is fixed, so if ascriptions drop, $d'$ must have dropped (but they deny $d'$ drops, so they say ascriptions *shouldn't* drop).
      *   Encroachment says: $d'$ is fixed, so if ascriptions drop, $c$ must have risen.
      *   Without a frequency base rate or multiple trials to generate an ROC, you cannot distinguish a change in sensitivity from a change in criterion. The debate is likely not about the cognitive architecture (which is SDT-compatible) but about which parameter *ought* to be held constant when defining the word "know." It is a dispute about parameter constraints, not measurable quantities.

  #### Residue 3: Licensing vs. Optimization
  SDT is a framework for maximizing Expected Value (EV). The "optimal criterion" is the one that yields the highest numerical return over many trials. Epistemology, however, treats Knowledge as a *licensing* condition (deontic). To say "S knows" is to say "S is *permitted* to assert/act," not necessarily "S is *maximizing utility*." One can act rationally (high EV) without knowing (e.g., a lucky guess with good odds), and one can know but be forbidden from acting (e.g., moral constraints).

  *   **The Fudge:** I equated the "Knowledge Criterion" ($\beta_{K}$) with the "Optimal Action Criterion" ($\beta_{opt}$). This works for Pragmatic Encroachment (which links knowledge to action warrant), but it breaks down for the normative force of "knows." In SDT, if you set $\beta$ sub-optimally, you just lose points. In epistemology, if you claim "Know" without meeting the standard, you violate a norm (you lie or bluff). SDT has no concept of "forbidden," only "suboptimal."
  *   **Verdict:** This points to something **SDT cannot express.** SDT is consequentialist; epistemology is often deontological. The "licensing" intuition suggests knowledge is a status that grants permission, independent of the specific payoff matrix of the current action.
      *   *Example:* In SDT, if the payoff for a Hit is infinite, the optimal $\beta$ approaches 0 (always say Yes). In epistemology, even if the benefit of being right is infinite, you still cannot "Know" a proposition if your evidence is weak (you can't buy knowledge with stakes).
      *   This suggests the Encroachment mapping fails at the limits. SDT allows stakes to overwhelm evidence (low $d'$ can be compensated by extreme payoff ratios). Epistemology generally holds that no amount of stakes can compensate for zero evidence. There is a "hard floor" on $d'$ for knowledge that SDT's continuous trade-off does not capture.

  ### Summary Verdict
  The SDT translation clarifies that the dispute is largely about **which parameter is semantically bound to the word "knows."**
  *   **Invariantism:** "Knows" $\rightarrow$ Fixed $\beta$.
  *   **Encroachment:** "Knows" $\rightarrow$ Variable $\beta$ (tied to Payoff).
  *   **Contextualism:** "Knows" $\rightarrow$ Variable $\beta$ (tied to Attributor).

  However, the **Residue** reveals that SDT is insufficient for the full philosophical picture. The **Identification Failure** suggests the debate is methodologically starved (no ground truth frequencies). The **Licensing Residue** suggests that "Knowledge" contains a deontic modality (permission/prohibition) that cannot be reduced to expected value maximization. Finally, the **Asymmetry** suggests epistemologists are modeling a specific anxiety about error (False Alarms) rather than a general decision-theoretic equilibrium.

  You are looking for a substantive cognitive dispute, but the translation suggests it is largely a **notational dispute about parameter constraints**, obscured by a lack of trial-level data and a category error between optimization and normative licensing.
