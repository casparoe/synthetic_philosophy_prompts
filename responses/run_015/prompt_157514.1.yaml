answer: |-
  Good morning. Welcome to the Institute for Introspective Studies. It is a profound privilege to stand here to open this workshop, 'The Limits of First-Person Authority', and to do so in honour of Dr Miriam Cole. For thirty years, this room has been the centre of her professional life. For many of you in the audience, it has been the site of your own consultations, your own struggles to put words to what hurts, or simply the place where you watched a parent or colleague try to make sense of a mind that felt increasingly unfamiliar.

  We are here to celebrate Miriam's retirement. But if we are to be faithful to the work she actually did, we cannot simply offer a tribute to the idea that she 'fixed' people by listening to them. That is the story we tell in retirement brochures. It is not the story her research supports. The title of this workshop suggests a restriction, a boundary. 'Limits'. That word does heavy lifting today. It asks us to consider where the authority of the self ends and where the interpretation of the other begins.

  I want to begin by confessing something that might seem out of place in a opening address. I am supposed to model confidence in the procedure we are gathering to discuss. Instead, I want to model the uncertainty that drives it.

  Three months ago, I underwent an occupational-health evaluation. Like many of you, I assumed this would be a straightforward exercise in transparency. I was asked to produce a detailed introspective account of my stress levels. I sat down with the forms, expecting to access my internal state, observe it, and transcribe it. I expected to be a neutral witness to my own mind.

  That is not what happened. As I wrote, I became acutely aware of who would be reading this. I was not writing for myself. I was writing for an assessor who held the power to declare me fit or unfit. I found myself smoothing out the jagged edges of my anxiety. I omitted the moments of panic that felt irrational because I could not justify them within the normative expectations of a 'credible' employee. I constructed a narrative of stress that was manageable, resolvable, and ultimately coherent. I did not lie, precisely. But I did not report a raw observation either. I produced a calibrated performance. I offered a version of my interior life that was shaped by the implicit audience on the other side of the desk.

  When I finished, I was left with a unsettling question: If my report was a performance shaped by the needs of the assessor, where was the 'truth' of my stress? Was it in the panic I hid, or in the coherent story I told? And if I, someone trained to think about these categories, could not separate the observation from the performance, what does that mean for the patients who sat across from Dr Cole?

  This question is why the composition of this room matters. Half of you are researchers in philosophy of mind and clinical psychology. You hear the word 'confabulation' and you think of specific cognitive mechanisms. You hear 'transparency' and you think of the debate over whether we know our own minds directly or through inference. For you, the problem is theoretical.

  The other half of you are here because this is personal. You are family members, former patients, clinicians from adjacent fields. For you, 'first-person authority' is not a thesis statement. It is the moment a loved one says, 'I am fine', when you know they are not. It is the frustration of trying to explain pain to a doctor who needs codes and durations, not metaphors. It is the fear that if you cannot describe your suffering correctly, you will not receive care.

  My argument today is that these two groups are facing the same phenomenon. We must stop treating introspective reports as if they are direct observations of a private object, like reading a gauge on a dashboard. We must also stop treating them as pure fictions, as if the patient is simply making it up. Instead, we should understand them as calibrated performances. When a person speaks about their mind, they are navigating a social space. They are shaping their report to fit what they believe counts as a credible emotional narrative. They are adjusting their voice to the room they are in.

  This framing changes how we honour Dr Cole's legacy. If introspection were a matter of simple truth-telling, Miriam's work would be about verifying accuracy. We would praise her for finding ways to catch patients out when they were wrong about themselves. But that is not what she did. She did not treat her patients as unreliable narrators who needed correction. She treated them as collaborators in a difficult act of communication.

  Her contribution was not to pierce the veil of self-deception. It was to curate the conditions under which a credible performance could become a therapeutic tool. She understood that when a patient says, 'I feel angry', they are not just describing a sensation. They are making a claim about their relationship to the world, and they are testing whether the clinician will accept that claim. Miriam's genius lay in recognising that the validity of the report does not depend on its correspondence to a hidden neurological state. It depends on its utility within the clinical relationship.

  This requires us to be careful about what we praise. We cannot say, with certainty, that Dr Cole uncovered the 'real' feelings of the thousands of patients she saw. To say that would be to claim a access to their interiority that none of us possess. It would be to ignore the very limits we are here to discuss. Instead, we praise her for creating a space where the performance of self-reporting became safe enough to be useful. She stabilised the audience. She made it so that the patient did not have to construct a narrative of fitness or sanity to be heard. She allowed the incoherence, the gaps, and the contradictions to stand as part of the data.

  There are things we must leave unsaid today, out of respect for that same limit. We cannot speak for the patients whose reports Dr Cole trusted. We cannot claim to know what they 'really' felt behind the words. To do so would be to violate the privacy of the experience that remains unreported. There is a silence at the heart of this workshop. It is the silence of the mental state that never makes it into language. We must acknowledge that silence. We must acknowledge that for every narrative constructed in this institute, there was an experience that resisted narration.

  For the family members and patients in the room, this might sound like a diminishment. You might hear me saying that your words are not fully trusted. That is not my intent. I am saying that your words are not merely data. They are actions. When you tell a clinician you are in pain, you are not just transferring information. You are asking for recognition. Dr Cole understood that the cure often lay not in fixing the underlying pathology, but in validating the performance of the report itself. She honoured the effort it took to speak.

  For the philosophers and psychologists here, this challenges the standard binary. We often argue between realism—the idea that the report matches the state—and constructivism—the idea that the report creates the state. I am suggesting we look at the interface. The report is shaped by normative expectations. What counts as 'depression' changes over decades. What counts as a 'valid' reason for stress changes depending on who is listening. Miriam's thirty years of work document these shifts. She showed us that first-person authority is not a static power we hold over our minds. It is a status granted to us by others when we speak intelligibly.

  This brings me back to my own occupational health form. I realised that my uncertainty was not a failure of introspection. It was a successful navigation of a social demand. I produced what was needed. The question for this workshop is not how to eliminate that performance. We cannot. We are social creatures; we always speak to an audience. The question is how to make the audience worthy of the performance.

  How do we design clinical spaces, like the one Miriam built, where the pressure to be coherent does not override the need to be honest? How do we train assessors to hear the calibration without dismissing the content? And how do we acknowledge that for the non-specialists in this room, the stakes are not theoretical?

  For the students here, you are entering a field where you will be asked to judge the reliability of others' minds. You must remember that reliability is not the same as truth. A patient can be reliably wrong about the cause of their pain, but their report of the pain is the only thing you have to work with. Treat it as a collaborative artifact, not a broken mirror.

  For the family members, I hope this offers a different language for your own struggles. When your loved one cannot explain why they are hurting, it is not necessarily because they are hiding something. It may be because the normative expectations of 'making sense' are too high. They are trying to perform a narrative of illness that fits what they think you want to hear. Miriam's work suggests we should lower the bar for coherence and raise the bar for acceptance.

  We are here to discuss limits. But a limit is not just a wall. It is also a boundary that defines a space. The limits of first-person authority define the space where community becomes possible. If I knew your mind directly, I would not need to listen to you. If you knew yours perfectly, you would not need to speak. It is in the gap, in the uncertainty, in the calibrated performance of telling, that we meet.

  Dr Cole spent three decades standing in that gap. She did not try to close it. She did not try to solve the mystery of consciousness. She simply ensured that when people stepped into it to speak, they were met with attention rather than judgement. She recognised that the authority of the first person is not a given. It is an achievement. It is something we grant each other when we agree to take the risk of speaking seriously.

  So, as we begin this workshop, let us not seek to dismantle the concept of introspection. We need it. Clinical practice requires it. Legal systems require it. Our relationships require it. But let us seek to understand it as it is: a fragile, social, normative practice. Let us honour Miriam not by pretending she solved the problem of self-knowledge, but by acknowledging that she taught us how to live with the problem productively.

  There will be moments in the next two days when the philosophers use terms that feel alien to the clinicians. There will be moments when the personal stories shared feel too raw for theoretical analysis. That friction is not a bug in the system. It is the system. It is the sound of the calibration happening in real time.

  Dr Cole, thank you for showing us that the limit of authority is not the end of care. It is the beginning of it. Thank you for teaching us that when a patient speaks, they are not just reporting on a world inside them. They are building a bridge to the world outside. Our task is to ensure that bridge holds.

  I declare this workshop open. Let us begin.
