answer: |-
  This is a profound impasse, and it is right that you have stopped here. You are not stuck on plot; you are stuck on theology. Your dying man refuses the wedding because he intuits that marriage is not merely a container for love, but a specific *narrative technology* that organizes time. To marry at the end is to rewrite the beginning.

  Here is a reading of *Brokeback Mountain* through the philosophical frameworks you provided, testing your distinctions against the text, and concluding with what fiction can do where philosophy fails.

  ### I. The Conjugal and the Revisionist in the High Country

  The philosophical debate over marriage often proceeds as if the two sides are talking about the same institution. *Brokeback Mountain* dramatizes the collision of two entirely different ontologies of relationship.

  **The Conjugal View (The Wives):**
  Alma and Lureen inhabit the conjugal view, whether they endorse it philosophically or not. Their marriages are comprehensive unions oriented toward domestic economy and procreation. They are "legible" to the town, the church, and the law. In the film, these marriages are not depicted as frauds; they are depicted as *successful institutions* that fail as *human connections*. Alma raises the daughters; Lureen builds the business. They fulfill the durative function: the marriage survives the husbands' infidelity and emotional absence. But the film suggests that the conjugal view, while socially robust, is blind to the specific texture of desire. It offers legibility at the cost of truth.

  **The Revisionist View (Jack's Ranch):**
  Jack Twist is the unwitting revisionist. When he proposes the "little ranch," he is not asking for a sacrament. He is asking for the disaggregation of marriage. He wants the economic partnership, the cohabitation, and the care-taking without the procreative mandate or the social performance of the heterosexual household. He wants the *functions* of marriage (security, proximity, labor) without the *name* (which would be impossible) or the *form* (wives, children).
  Ennis's refusal of the ranch is often read as fear of violence (which it is), but through your lens, it is also a rejection of the revisionist fantasy. Ennis knows that a "ranch together" would require them to become a "household." It would require them to lie to neighbors, to construct a cover story. It would turn their love into a management problem. Ennis prefers the mountain because the mountain requires no administration.

  ### II. Testing Your Distinctions

  **1. Durative vs. Declaratory**
  *Brokeback* embarrasses the idea that these functions can be separated.
  The durative function is meant to bind people against future changes of heart. Ennis and Jack have supreme durability (40 years) without any legal or social binding. Their bond survives marriages, children, and distance. However, because it lacks the *declaratory* function, that durability becomes a source of torture.
  The film suggests that without declaration, durability is just endurance. The wives have declaration without durability (the marriages hold, but the connection rots). The lovers have durability without declaration. The tragedy is that the film offers no world where both are possible.
  *For your novel:* Your daughter believes the declaratory function can rescue the durative reality. She thinks saying "this is a marriage" will validate the forty years. Your dying man knows that declaration is prospective. It declares what we *will* be. It does not validate what we *were*.

  **2. The Retrospective Function**
  This is your most vital distinction. Does marriage ratify history?
  In *Brokeback*, the only retrospective marriage is the one Ennis performs alone in the trailer. He hangs the shirts. He says, "Jack, I swear..." This is a ritual of ratification. It acknowledges what *was*.
  A legal wedding, by contrast, is inherently prospective. It is a vow about the future ("until death do us part"). If you marry a man three weeks before he dies, you are not ratifying forty years of partnership; you are initiating a three-week marriage.
  *The Film's Verdict:* The film argues that retrospective ratification cannot be public. It collapses into declaration with a delay only if the community accepts the delay. In 1980s Wyoming, a deathbed wedding would not be read as "finally recognizing the truth." It would be read as "a strange final act." The retrospective function requires a private language (the shirts), not a public one (the license).
  *For your novel:* Your dying man is right to feel that a wedding falsifies. A wedding says, "We are starting a union." He wants to say, "We already lived a union, and it was of a kind you have no name for." To accept the name is to admit the previous forty years were something else (illegible, illicit, incomplete).

  **3. The Legibility Debt**
  *Brokeback* is a ledger of unpaid legibility debt.
  Who pays? Alma pays (living with a ghost). Lureen pays (uncertain of her husband's whereabouts). The daughters pay (Alma Jr. suspects, but never knows). Ennis pays (living in a trailer, haunted).
  The closing scene in the trailer looks like payment. Ennis is honoring Jack. But he pays nothing of the *social* debt. He does not tell the daughters. He does not correct the record. He keeps the shirts in the closet—inside another closet. He looks as though he is paying the debt, but he is actually hoarding the capital.
  *For your novel:* The daughter is trying to collect the debt. She thinks the debt is owed to *them* (the fathers). The dying man knows the debt is owed to the *truth*, and that cashing it out now (with a wedding) is a form of inflation. It devalues the currency of the life they actually lived.

  ### III. The Objection: Masculinity, Silence, and the Hook

  You must contend with the strongest objection: *Brokeback Mountain* is not a brief for same-sex marriage. It is a tragedy about the violence of masculine socialization. Jack and Ennis do not want to be "married." They want to be on the mountain. To impose the vocabulary of marital recognition on them is to civilize them, and their tragedy is that they cannot be civilized.

  **Where the resistance is real:**
  Ennis's refusal of the ranch is not a philosophical stand against the revisionist view of marriage. It is a visceral terror of being killed. If you make your dying man's refusal too articulate, you lose the grit of the ranching world. In that world, men do not talk about the "ontology of union." They talk about work, weather, and silence.

  **Where you cannot let the film off the hook:**
  However, silence is not neutral. The film shows that the *refusal* to name the relationship has consequences. It allows Ennis to survive, but it ensures Jack dies alone (the phone call). The "legibility debt" comes due in blood.
  Your novel has the advantage of time. Your characters are in their sixties, in a slightly later era. They have survived. The question is no longer survival, but *testimony*.
  The film resists the marriage reading because marriage implies a future. These men have no future. But your dying man is facing the *end* of the past. The film shows that without a language for the relationship, the survivor is left with only relics (the shirts). Your character is being offered a language (the wedding). His refusal is not cowardice; it is a refusal to translate a poem into a legal contract.

  ### IV. What Fiction Adds: The Particular vs. The Universal

  Philosophy asks: *What is marriage for?*
  Fiction asks: *What was this love?*

  Philosophy deals in universals. The conjugal view says marriage is for procreation-type union. The revisionist view says it is for care and stability. Both assume marriage is a tool for organizing a life going forward.
  Fiction can show that some loves are *constituted* by their illegibility.

  In *Brokeback*, the love exists *because* it is outside the law. The secrecy is not just a constraint; it is the shape of the thing. The stolen weekends, the lack of witnesses, the silence—these are not obstacles to their love; they are the medium in which it swims. If you put that fish on land (in a wedding), it dies.

  **The Thing Only a Story Can Show:**
  A philosophical argument cannot capture the *aesthetic* resistance to the wedding. Your dying man refuses not because he thinks marriage is wrong, but because he thinks *this* wedding would be bad art.
  It would be a falsification of the genre. They lived an epic of silence. To end with a ceremony of speech is to change the genre from a tragedy to a sentimentality.

  **Advice for the Third Act:**
  To write the refusal without cowardice, you must anchor it in **fidelity to the past**, not fear of the future.

  1.  **The Retrospective Argument:** Have the dying man explain (inarticulately, perhaps) that a wedding is a promise about tomorrow. He has no tomorrows. To make a promise he cannot keep is a lie. He does not need to promise to care for the partner; he has already done it for forty years. The wedding adds nothing to the care, only to the record. He does not trust the record.
  2.  **The "Unseen" Defense:** The daughter argues they were "unseen." The dying man must argue that being "unseen" was the condition of their visibility to each other. If the town had seen them, they would have had to perform for the town. They would have become "the gay couple," not "the partners." The wedding makes them public property. He wants to remain private property.
  3.  **The Scene to Emulate:** Do not look at the wedding proposal. Look at the scene in the trailer with the shirts. Ennis does not hang the shirts on the wall where guests can see them. He puts them in the closet. He says, "I wish I knew how to quit you."
      *   *Your Scene:* The dying man should not argue with the daughter. He should show her something that proves the marriage already exists in a form she cannot legalize. A ledger? A deed? A specific way they divided the labor?
      *   *The Refusal:* "If we do this, we tell them we were waiting. We weren't waiting. We were working. This paper says we start today. But I started forty years ago. I won't sign a lie that says I was single until now."

  **Conclusion:**
  *Brokeback Mountain* shows that the legibility debt is often paid in grief. The survivor is left with the debt because the deceased could not speak. In your book, the survivor (the daughter) is trying to pay the debt *for* them.
  The dying man's refusal is valid if he believes that **some truths are damaged by translation.**
  He is not a coward. He is a custodian. He is protecting the specific, un-translatable dialect of their forty years from being standardized into the common tongue of "marriage." He chooses the truth of the life over the legitimacy of the death. That is not cowardice; it is a fierce, stubborn integrity. It is the refusal to let the end edit the middle.
