      *   *Crux 4: Marr Levels (Description vs. Mechanism).*
          *   Classicist: Computational level *requires* symbolic structure.
          *   Connectionist: Computational level can be described dynamically; symbols are user-illusions.
          *   *Probe:* Causal intervention on "symbolic" variables in a trained net.
