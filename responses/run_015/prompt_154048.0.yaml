answer: |-
  # JOINT STATEMENT ON THE STRUCTURE OF COGNITION
  **Adversarial Collaboration Deliverable**  
  **Signatories:** [Classicist Name], [Connectionist Name]  
  **Date:** October 24, 2023  
  **Context:** Following twelve months of structured debate regarding the Language of Thought (LOT) hypothesis versus Embodied/Dynamical Connectionism, constrained by the Stipulated Evidence Base (SEB).

  ---

  ## 1. JOINT CLAIMS

  We, the undersigned, agree to the following claims regarding the formalism, the explananda, and the boundaries of acceptable theory, given the SEB.

  1.  **Formalism of Mapping:** Any adequate cognitive model must implement a robust, recoverable map from structured task contents (e.g., *agent-action-patient*) to internal neural or computational states. We reject the claim that behavior alone suffices without an account of the internal state transformation, but we also reject the claim that this map must preserve *vehicle identity* (exact neural pattern) across contexts to count as structural.
  2.  **Explananda (The Stipulated Evidence Base):** Any viable theory must provide a mechanistic or computational account of the following four results without ad-hoc post-hoc fitting:
      *   **(E1) Filler-Diversity Curve:** Systematic generalization to novel role reversals is a saturating function of training diversity (near chance <50 fillers, >90% >2000 fillers), with neural architectures showing a persistent tail of role-confusion errors absent in hybrid symbolic models.
      *   **(E2) Role-Specific Re-encoding:** Constituent identity (e.g., *John*) is decodable within a specific role (Agent) but not across roles (Theme) without a linear transformation matrix, indicating role-conditional formatting.
      *   **(E3) Graded Re-binding:** Interference in constituent retrieval is graded by the number of intervening items (no sharp capacity cliff) but includes a fixed cost for role-swapped constituents independent of semantic similarity.
      *   **(E4) Lesion Dissociation:** Focal damage to left inferior frontal cortex (LIFC) selectively disrupts non-adjacent dependency binding while sparing adjacent dependencies and single-word semantics.
  3.  **Ruled-Out Theories:** Based on the SEB, we jointly declare the following theoretical classes untenable:
      *   **Flat Associationism:** Models relying solely on pairwise feature co-occurrence without role-binding mechanisms are ruled out by (E1) and (E4). They cannot account for the diversity threshold or the specific locus of lesion deficits.
      *   **Literal Neural Registers:** Models positing that the brain buffers Mentalese sentences in a static, location-addressed neural register (a "neural CRT") are ruled out by (E2) and (E3). The lack of vehicle identity across roles and the graded nature of interference contradict a fixed-slot buffer architecture.

  ---

  ## 2. RESIDUAL DISAGREEMENTS (CRUXES)

  The following table outlines the remaining points of contention. For each crux, we specify the divergent formulations, the nature of the dispute, and a pre-registered empirical probe designed to force concession.

  | Crux | Classicist Formulation | Connectionist Formulation | Type | Concrete Probe | Classicist Prediction | Connectionist Prediction | Condition for Conceding |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. The Nature of Systematicity** | The diversity curve (E1) reflects the *tuning* of an innate structural capacity. True systematicity implies a discontinuity: once the rule is acquired, performance should be high regardless of N. The gradual curve is an artifact of the artificial grammar learning task, not cognition proper. | The diversity curve (E1) *is* the phenomenon. Systematicity is not a binary capacity but a continuous emergent property of statistical learning over high-dimensional manifolds. There is no "rule" to acquire, only manifold smoothing. | Empirical | **Zero-Shot Ontology Transfer:** Train on *N* fillers of Category A (nouns). Test on Category B (abstract shapes) with *N=1*. | Performance on Cat B will be significantly above chance even at *N=1*, indicating rule transfer. | Performance on Cat B will revert to chance, requiring new diversity accumulation for Cat B. | **C:** If Cat B is chance at *N=1*. <br>**K:** If Cat B is >80% at *N=1*. |
  | **2. Constituent Identity** | The linear map in (E2) preserves *content identity*. The vehicle change (Agent vs. Theme vector) is an implementation detail akin to font change. The constituent *John* remains the same symbolic token. | The linear map proves *functional equivalence*, not identity. If the vector changes, the constituent changes. "John" is a role-filler binding, not a persistent object. There is no "John" outside of a role context. | Verbal* | **Cross-Modal Binding:** Train Agent/Theme roles in Modality A (Audio). Test decoding in Modality B (Text) without retraining the role-map. | Decoder will generalize across modalities because the *symbol* is amodal. | Decoder will fail; role formats are modality-specific embeddings. | **C:** If cross-modal decoding fails completely. <br>**K:** If cross-modal decoding succeeds without retraining. |
  | **3. Priors vs. Data** | The "tail of role-confusion errors" in neural models (E1) proves they lack the correct inductive bias. A model with explicit structural priors should match the hybrid curve, not the neural tail. Structure must be in the architecture, not the data. | The "tail" is noise inherent to distributed representation, not a lack of structure. Architectural priors that induce systematicity are simply "smuggling in" the structure the classicist wants, proving connectionism can implement it if allowed. | Empirical | **Sample Efficiency w/ Hints:** Compare a pure Transformer vs. a Structured RNN on low-diversity data (N=50), giving the Transformer explicit "syntax hint" tokens. | Transformer + Hints will still underperform Structured RNN on role-reversal. | Transformer + Hints will match Structured RNN performance. | **C:** If Transformer + Hints matches RNN. <br>**K:** If Transformer + Hints remains at chance. |
  | **4. Marr Levels** | The computational level description *requires* symbolic structure to explain productivity. If the algorithm level is connectionist, it is merely implementing a symbolic machine. | The computational level can be described dynamically. Symbols are a "user illusion" of the best descriptive compression. Nothing empirical could settle this because it is a choice of description language. | **Verbal** | **Causal Intervention:** Identify a "symbolic variable" in a trained VSA model. Perturb it. Does behavior change predictably per symbolic rules or per vector geometry? | Behavior will follow symbolic rules (discrete change). | Behavior will follow vector geometry (graded change). | **C:** If behavior is graded. <br>**K:** If behavior is discrete. |

  ***Note on Verbal Dispute (Crux 4):** We flag Crux 4 as primarily verbal. Both sides agree on the input-output behavior and the internal dynamics. The dispute is whether "symbol" is the correct *name* for the stable attractor state in the vector space. **Observation to Reveal:** If both parties agree on the mathematical description of the mechanism (e.g., binding via tensor product) but disagree on whether to call it "symbolic," the dispute is purely terminological. If they disagree on the mathematical mechanism required to produce the behavior, it is empirical.*

  ---

  ## 3. CLOSING STATEMENT ON THIRD POSITIONS

  We acknowledge the existence of third positions, specifically **Vector-Symbolic Architectures (VSA)** (e.g., Holographic Reduced Representations, Binding via Superposition) and **Instrumentalism** (structure as a property of the best description, not the mechanism).

  **Does this undercut the debate?**
  Yes, but selectively.
  1.  **Mechanism vs. Computation:** VSA undercuts the *mechanistic* dichotomy (Section 1, Claim 3). It demonstrates that one can have concatenative syntax and constituent structure *within* a distributed vector space. This invalidates the Classicist's claim that distributed representation *necessarily* implies a lack of structure, and the Connectionist's claim that structure *necessarily* implies a localist "neural register."
  2.  **Ontology:** Instrumentalism undercuts Crux 4. If structure is a property of the interpretive map rather than the substrate, the demand for "literal symbols in the head" dissolves.

  **Should either member have occupied this ground?**
  *   **The Classicist:** Should have occupied the VSA ground earlier. Insisting on a "language-like" format without specifying that it could be implemented via superposition made the theory vulnerable to the Re-encoding Result (E2). A VSA-Classicist could have predicted the linear map between roles as a change in binding key rather than a threat to identity.
  *   **The Connectionist:** Should have occupied the Instrumentalist ground regarding Crux 4. By fighting to deny the existence of structure rather than redefining it as emergent/descriptive, the Connectionist unnecessarily conceded the explanatory power of systematicity. Acknowledging that "symbols are real at the computational level" would have isolated the dispute strictly to the implementation level (E2, E3), where the Connectionist has stronger evidence.

  **Final Consensus:** The debate is no longer about *whether* cognition exhibits structure (it does, per E1/E4), nor about *whether* it is implemented in neurons (it is, per E2/E3). The debate is now strictly about whether the most parsimonious causal model of that implementation requires discrete binding operators (VSA/Classicist) or whether continuous dynamical flows suffice (Dynamical/Connectionist). We commit to testing the **Causal Intervention** probe (Crux 4) within six months.

  **Signed,**

  _________________________  
  [Classicist Name]

  _________________________  
  [Connectionist Name]
