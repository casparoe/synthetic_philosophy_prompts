          *   Connectionist: Systematicity is an emergent property of high-diversity training, not a structural prerequisite.
          *   *Probe:* Zero-shot transfer on entirely new ontological categories (e.g., abstract shapes vs. words).
      *   *Crux 2: Constituent Identity (Re-encoding).*
          *   Classicist: Linear map preserves identity; vehicle change is implementation detail.
