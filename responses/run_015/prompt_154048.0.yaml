  2.  **Deconstruct the Stipulated Evidence Base:**
      *   *(i) Filler-Diversity Curve:* Systematicity (novel role reversals) depends on training diversity (N fillers). Low N = chance; High N = 90%+. Neural models have a tail of role-confusion errors. Hybrid/Symbolic models match but cleaner.
          *   *Implication:* Systematicity isn't automatic; it requires specific training/architectural conditions. Pure symbolic models might be *too* clean (missing the tail). Pure associationism fails (needs diversity).
      *   *(ii) Re-encoding Result:* Decoder trained on Agent role fails on Theme role for the same constituent. Linear map exists between role formats.
          *   *Implication:* Representations are role-specific, not purely constituent-specific. "John" in Agent slot $\neq$ "John" in Theme slot (in terms of vector geometry), but they are linearly transformable. Challenges strict vehicle identity.
      *   *(iii) Re-binding Probe:* Graded interference from intervening constituents (no sharp capacity break). Small fixed cost for role-swapped constituents (independent of semantic similarity).
          *   *Implication:* Working memory/binding isn't a fixed slot buffer (graded interference). Role binding has a specific cost distinct from semantic similarity.
      *   *(iv) Lesion Dissociation:* LIFC damage disrupts non-adjacent dependencies, spares adjacent and single-word semantics.
          *   *Implication:* Neural substrate for syntactic binding is localized but distinct from semantics or simple adjacency.

  3.  **Drafting Section 1: Joint Claims:**
      *   *Formalism:* Need to agree that *some* mapping exists between content and state, but avoid committing to "sentences in the head."
