  5.  **Drafting Section 3: Third Positions:**
      *   *Vector-Symbolic Architectures (VSA):* Bind roles/fillers via binding operators (e.g., holographic reduced representations).
      *   *Impact:* Undercuts the "Literal Buffer" vs. "Distributed Soup" dichotomy. Shows you can have structure *in* vectors.
