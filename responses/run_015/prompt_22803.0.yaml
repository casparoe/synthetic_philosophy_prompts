  Here is an argument structured as a philosophy essay. It takes the position you requested: that Pascal is not merely lamenting a corruption of justice, but arguing that political legitimacy is *constituted* by power because justice lacks epistemological stability.

  ***

  **Title:** The Ontology of Obedience: A Realist Reading of Pascal's *Pensées*

  **Introduction**
  The standard interpretation of Blaise Pascal's fragment on justice and force in the *Pensées* treats the text as a moral lament. Most readers argue that Pascal is describing a tragic usurpation: force has hijacked justice, but justice remains the true ideal. According to this view, when Pascal writes, "not being able to make what is just, strong, one made what is strong, just," he is diagnosing a corruption of the natural order. However, this reading relies on the assumption that Pascal believes "justice" has an independent political standing that *could* have been strong. I argue the opposite. Given Pascal's radical skepticism regarding human reason and natural law, he is logically committed to the position that legitimacy necessarily tracks power. For Pascal, force does not corrupt justice; force creates the category of the political. Because justice is epistemologically disputable and force is ontologically indisputable, enforceability is not an accidental feature of law, but the sole criterion of its legitimacy. To deny this is to demand a political order that Pascal's anthropology renders impossible.

  **The Epistemological Void of Justice**
  To understand why Pascal must conclude that power makes right, one must first accept his premise regarding the nature of justice itself. Throughout the *Pensées*, Pascal dismantles the idea of "natural justice." He argues that what we call justice is merely custom, varying by latitude, longitude, and epoch. "We see neither justice nor injustice which does not change its nature with a change in climate," he notes. If justice is merely a collection of competing opinions and local customs, it possesses no intrinsic binding power. It cannot command obedience on its own merits because there is no universal consensus on what those merits are.

  This creates a vacuum. If justice is subjective, it cannot serve as the foundation for a state. A political order requires stability, but a foundation built on disputable moral claims is inherently unstable. Therefore, in Pascal's setup, justice is structurally "impotent" not because it lacks soldiers, but because it lacks epistemic authority. It cannot prove itself to be *the* justice. Consequently, any political system that attempts to ground its legitimacy purely on "what is just" is building on air. This forces the political philosopher to look elsewhere for the glue that holds society together.

  **The Indisputability of Force**
  If justice is the realm of debate, force is the realm of fact. Pascal posits force as the only indisputable quality in human relations. You can argue endlessly about whether a law is fair, but you cannot argue with the physical reality of coercion. Force compels obedience regardless of belief. This distinction is crucial for Pascal's argument. He is not simply observing that tyrants *use* force; he is observing that force is the only mechanism that resolves the infinite regress of moral debate.

  In a conflict between two parties claiming "justice," there is no higher human court to appeal to that is not itself subject to the same skepticism. The dispute remains theoretical until one side imposes its will. Therefore, force is not an external tool applied to justice; it is the decision procedure that transforms a moral claim into a political reality. Without the capacity for enforcement, a claim of justice remains a private opinion. With enforcement, it becomes public law. Pascal's assertion that "justice without force is impotent" is not a complaint that the world is broken; it is a structural analysis that "justice" without the capacity for enforcement is not law at all—it is merely philosophy.

  **Legitimacy as a Function of Enforceability**
  This leads to the core of the argument: the phrase "one made what is strong, just." The standard reading sees this as a cynical compromise. However, within Pascal's skeptical framework, this is a constitutive definition. Since we cannot access a divine or natural standard of justice to validate our laws, the only marker of validity we have is durability and obedience. If a law is enforced and maintains order, it functions as justice. If it is not enforced, it ceases to function.

  Pascal argues that we *must* accept this arrangement ("one made...") because the alternative is the war of all against all. If we insist that legitimacy comes from moral truth prior to power, we invite endless civil war, as every faction claims to possess the true justice. To secure peace, society must agree to treat power as the proxy for legitimacy. This is not an accident Pascal stumbled into; it is the only coherent solution to the problem of order given human skepticism. By obeying the strong, we are not submitting to tyranny; we are submitting to the only mechanism that prevents total chaos. Therefore, legitimacy *does* track power. A law is legitimate precisely because it is the law of the sovereign who holds the sword. To suggest otherwise is to suggest that a law could be "valid" even if no one obeyed it and no one could be made to obey it, which renders the concept of law meaningless.

  **Addressing the Counter-Argument**
  Critics will argue that Pascal, as a Christian, believes in a higher, divine justice that ultimately trumps human force. They claim his "might makes right" analysis is limited to the fallen, temporal world. While Pascal certainly believes in divine truth, this does not salvage the "justice is ideal" reading for *political* philosophy. Pascal explicitly separates the order of grace from the order of flesh. In the political realm (the order of flesh), we do not have access to divine justice. We are left with our customs and our armies.

  To argue that Pascal believes political legitimacy *should* track moral truth is to ignore his insistence that we cannot know moral truth with certainty. If we cannot know the truth, we cannot legislate it. Therefore, in the only realm where we can act—the political realm—we are forced to rely on force. Pascal is not saying this is good in the eyes of God; he is saying it is necessary in the eyes of men. To demand that political legitimacy exist independently of force is to demand a politics for angels, not for fallen humans. Pascal's realism forces us to admit that without the "tyranny" of force, there is no "justice" of order.

  **Conclusion**
  Pascal's fragment on justice and force is not a description of a tragic accident where power usurped morality. It is a rigorous deduction based on his skepticism. Because justice is disputable and force is undeniable, force must be the arbiter of what counts as law. Legitimacy tracks power because power is the only thing that can convert a subjective claim of right into an objective reality of order. Pascal forces us to accept that the authority of law is not derived from its moral content, which is always uncertain, but from its enforceability, which is certain. To deny this is not to be more moral; it is to be politically incoherent. Pascal's conclusion is not that power *corrupts* justice, but that power *completes* it. Without the strong arm, justice is not waiting to be freed; it simply does not exist.
