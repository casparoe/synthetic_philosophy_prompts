  2.  **Deconstruct Pascal's Position (The "Radical" Reading):**
      *   *Premise 1: The Epistemological Status of Justice.* Justice is subjective, customary, and variable (Pascal's skepticism). There is no natural justice accessible to human reason.
      *   *Premise 2: The Ontological Status of Force.* Force is objective, tangible, and undeniable. It compels obedience regardless of belief.
      *   *Premise 3: The Function of Law.* Law exists to maintain order and peace, not necessarily to reflect metaphysical truth (which is inaccessible).
      *   *Inference:* Since we cannot agree on justice, but we must have order, the only stable foundation for law is force.
      *   *Conclusion:* Therefore, "might makes right" isn't a bug; it's the feature. Legitimacy *is* enforceability. To deny this is to invite chaos (the war of all against all).

  3.  **Drafting the Argument - Section by Section:**

