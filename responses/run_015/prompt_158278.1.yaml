          *   (b) The "Proclaimed Lump" is vulnerable. Declaration $\neq$ Constitution. Use Duchamp/Readymades to fix this. Distinguish normative vs. ontological.
          *   (c) It's not eliminativism; it's ontological conventionalism. The "cost" is actually a standard position (Thomasson). Don't apologize for it, own it or refine it.
