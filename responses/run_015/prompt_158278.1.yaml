      *   *Refinement:* The user conflates *normative status* (it's a crime to smash this) with *ontological status* (a new object exists). The two-thing theorist can argue that the certificate changes the *rules*, not the *metaphysics*.
      *   *Survival of Modal Argument:* A sophisticated modal argument (like Fine's or Gibbard's) relies on *essential properties*, not just social labeling. If the clay is essentially clay, and the statue is essentially statue-shaped, mere declaration doesn't change the essence. The user needs to defend why declaration *does* change the essence.

  5.  **Address Point (c): The Ending (One Thing + Indexed Existence):**
