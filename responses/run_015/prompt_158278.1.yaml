      *   *Setup:* Standard Goliath/Lumpl puzzle. Coincidence problem.
      *   *Claim 1 (Modal Argument Weakness):* Modal profiles (survival conditions) are determined by sortal/institutional conventions, not intrinsic makeup. Example: "Proclaimed Lump" (curator declares a lump a statue via certificate). Now squashing it destroys a "work," whereas before it was just reshaping.
      *   *Claim 2 (Revocation):* Curator withdraws certificate. Statue ceases to exist without physical change. Squashing it later destroys nothing (no statue exists to be destroyed).
