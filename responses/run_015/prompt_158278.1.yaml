answer: |-
  This is a sharp, promising draft. You've identified a pressure point in the constitution debate (the role of social facts) that often gets glossed over in favor of purely mereological arguments. The "Revocation" scenario is particularly evocative.

  Here is the feedback you asked for, following your structure.

  ### a) Is the revocation case new, or a re-run?

  It is **not** something two-thing views handle "in their sleep," but it is a specific instance of a known objection: the *arbitrariness* or *triviality* objection.

  Standard two-thing theorists (constitutionists) often bite the bullet that artifacts are mind-dependent. They will say: "Of course the statue ceases to exist when the relevant intentional/social context is withdrawn. Artifacts are ontologically lightweight." If your target is a conventionalist constitutionist (like Amie Thomasson), they will shrug and agree with you.

  However, your revocation case is effective against **realist** two-thing theorists (those who think the statue is a robust object distinct from the clay). For them, an object vanishing because a curator filed a form is embarrassing. It makes ontology look like bureaucracy.

  **Verdict:** Keep the section, but sharpen the target. Don't present it as a refutation of *all* two-thing views; present it as a *reductio* for any two-thing view that wants to treat artifacts as robust, mind-independent entities. If they accept the revocation consequence, they must admit artifacts are ontologically second-class citizens compared to the clay. That concession often pushes people toward your "one-thing" conclusion anyway.

  ### b) Holes in the first claim (The Proclaimed Lump)

  This is the weakest link in the chain. Here is where a savvy opponent will attack:

  **1. Declaration vs. Constitution:**
  You assume that the curator's certificate *successfully* makes the lump a statue. A rival will say: "No, it makes it a *legally protected* lump, but not a *metaphysical* statue." They will argue you are conflating **normative status** (it is now a crime to smash this) with **ontological status** (a new object with new persistence conditions now exists).
  *   *The Counter:* If I sign a certificate declaring my shoe a "President," it doesn't gain the persistence conditions of a President. Why does the clay gain the persistence conditions of a statue just via paperwork?
  *   *The Fix:* You need to lean harder on the **Institutional Theory of Art** (Danto/Dickie). A Readymade (like Duchamp's *Fountain*) *is* an artwork solely in virtue of institutional declaration. If you can establish that the "statue" sortal is an institutional kind, then the declaration *does* change the metaphysics. Without this bridge, the two-thinger will say the modal profile hasn't actually changed; we just have new rules about damaging the clay.

  **2. The Modal Argument survives via Essence:**
  You claim modal differences don't discriminate because they are conventional. But the modal argument often relies on *essential* properties, not just counterfactual survival.
  *   *The Counter:* Even if we accept the Proclaimed Lump is a statue, the clay is *essentially* clay. The statue is *essentially* a work of art. These are different essential properties. The certificate changes the *accidental* property of "being designated art," but does it change the *essence* of the matter?
  *   *The Fix:* You need to argue that for artifacts, essence *just is* institutional. There is no "hidden essence" of the statue beyond the social facts that sustain it. If you grant that the clay has a "real" essence and the statue has a "fake" (social) essence, the two-thinger wins (because they have different essences, so they are different things). You must argue that *both* are equally dependent on sortal conventions, or that the "one thing" (the clay) is the only thing with a robust essence.

  ### c) Is the ending interesting or a dead end?

  It is **interesting**, but you are mislabeling the cost.

  **1. It is not Eliminativism.**
  Eliminativism says: "There are no statues, only clay arranged statue-wise."
  Your view says: "There is one thing (the clay), and 'ceasing to exist' is a sortal-relative predicate."
  This is closer to **Ontological Conventionalism** or **Sortal Relativism**. You aren't denying the statue exists; you are denying that "existence" is a univocal, absolute term independent of conceptual schemes. Don't collapse this into eliminativism; it's a more nuanced (and defensible) position.

  **2. The "Existence is up to us" Cost.**
  You write: *"uncomfortably close to saying existence is up to us."*
  Many contemporary metaphysicians (e.g., Sider, Thomasson, Hirsch) would say: "So what?" For artifacts, existence *is* up to us. The cost is only high if you are a **Metaphysical Realist** about artifacts.
  *   *Advice:* Don't apologize for this cost. Own it. Argue that this is the *virtue* of the view. It explains why we can create/destroy artifacts with intentions/paperwork without engaging in magic. The "magic" of objects popping in/out of existence is only a bug if you expect ontology to be like physics. If ontology includes social objects, then paperwork *is* the causal mechanism.

  **3. The Real Dead End Risk:**
  The risk isn't eliminativism; it's **triviality**. If existence is entirely indexed to institutions, does metaphysics just become sociology?
  *   *How to avoid:* Distinguish between *fundamental* existence (the clay) and *derivative* existence (the statue). Your view implies a hierarchy. The clay exists fundamentally; the statue exists derivatively relative to the institution. This saves you from saying "everything is made up."

  ### General Comments on Clarity & Flow

  *   **The "Proclaimed Lump" Example:** As noted above, this feels slightly artificial. A stronger example might be a **Readymade** or a **Religious Relic**. If a priest consecrates a wafer, Catholics believe its persistence conditions change (it becomes the Body of Christ). If a museum director designates a urinal as art, its persistence conditions change (it must be preserved, not cleaned). These are stronger cases where social facts intuitively *do* alter modal profiles. The "lump in a vitrine" feels too dry; make it a *Fountain* or a *Host*.
  *   **The Revocation:** This is your strongest move. It vividly illustrates the "ontological fragility" of the two-thing view. I would move this earlier or give it more weight than the Proclaimed Lump. The idea that an object vanishes on Wednesday because a form was withdrawn is a very powerful image.
  *   **Tone:** The notes are refreshingly direct. Keep the "shakily" and "messy on purpose" energy in the final draft—it reads like genuine inquiry rather than dogma.

  **Summary Recommendation:**
  1.  **Strengthen the "Proclaimed Lump"** by referencing art-institutional cases (Readymades) where declaration *is* constitution.
  2.  **Clarify the target** of the Revocation argument (it hurts Realist Two-Thing views, not Conventionalist ones).
  3.  **Rebrand the Conclusion** as Ontological Conventionalism, not Eliminativism, and defend the "existence is up to us" claim as a feature, not a bug, for the domain of artifacts.

  This is worth taking further. The "Revocation" angle is a genuine contribution to the puzzle.
