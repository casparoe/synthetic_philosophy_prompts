      *   *Is it a "re-run"?* It's very close to the standard "intentional creation" objection. Usually, the statue comes into existence when the artist *intends* it. Here, the user replaces artistic intention with bureaucratic declaration.
      *   *Does it defuse the problem?* Two-thing theorists who are conventionalists about artifacts (e.g., Amie Thomasson) would say, "Sure, artifacts exist only relative to concepts." But hard-nosed two-thing theorists (who think the statue is a real distinct object) might find the "paperwork" aspect trivializing.
      *   *Verdict:* It's not *totally* new, but it sharpens the "arbitrariness" objection. It highlights the *fragility* of the ontological commitment in the two-thing view. It's not something they handle "in their sleep" if they want to maintain robust realism about artifacts. However, if they are already conventionalists, they will shrug. The user needs to target the *realist* two-thing theorist.
      *   *Advice:* It's not a knockout punch against *all* two-thing views, but it's a strong pressure test against *realist* versions. It forces them to admit artifacts are ontologically lightweight.

  4.  **Address Point (b): Poke Holes in Claim 1 (Modal Argument & Proclaimed Lump):**
