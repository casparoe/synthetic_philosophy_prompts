answer: |-
  **Bottom line:** Respect choices that express who the person is, but challenge choices that deny them care based on who they fear they are.

  **Reasoning:**
  Your "Cost" test must be binned immediately; it conflates poverty with bias and punishes people for being prudent. Your "Substitution" test is useful but narrow—it only catches prejudice against others, not self-stigma. Your "Take-back" test is the strongest and should become the core of the procedure, renamed the "Magic Wand" test. The procedure below is designed to be completed in under ten minutes, defensible under the Care Act 2014 (wellbeing principle), and distinct enough for a social worker to document without needing an ethics degree. It draws a line between *values* (which we respect) and *fears* (which we mitigate).

  ### The Defensible Decision Protocol (DDP)

  Run these three questions in order. If any question triggers a "Stop," follow the instruction.

  **1. The Dignity Check (Identity vs. Task)**
  *   **Question:** Is the refusal about the *intimacy of the task* or the *identity of the provider*?
  *   **Good Answer:** "I don't want a stranger washing me" (Task/Privacy) or "I want a woman for intimate care" (Protected Characteristic).
  *   **Bad Answer:** "I don't want someone from *that* background" (Prejudice) or "I don't want a carer at all" (Self-neglect).
  *   **Decision:**
      *   If it concerns intimate care or protected characteristics (gender, religion, ethnicity): **RESPECT IT.** Write it into the plan as a requirement.
      *   If it concerns class, estate, or perceived status: **GO TO Q2.**

  **2. The Magic Wand Test (Refined Take-back)**
  *   **Question:** "If we could arrange this so no one knew you were getting support, and it cost you nothing, would you still refuse?"
  *   **Good Answer:** "Yes, I still wouldn't want that specific person/place." (Indicates a genuine value or compatibility issue).
  *   **Bad Answer:** "No, if it were discreet/easier, I'd take it." (Indicates the refusal is driven by stigma or shame).
  *   **Decision:**
      *   If "Yes": **RESPECT IT.** (This is a preference).
      *   If "No": **DO NOT BUILD IT IN.** (This is internalized stigma). Do not write "Client refuses X." Write "Client requires X but currently faces barriers regarding stigma; plan to mitigate."

  **3. The Wellbeing Floor (Harm Check)**
  *   **Question:** If we honour this refusal, does the person's wellbeing drop below a statutory threshold (safety, hygiene, nutrition, social isolation)?
  *   **Good Answer:** "They will be lonely, but safe."
  *   **Bad Answer:** "They will be malnourished / at risk of falls / completely isolated."
  *   **Decision:**
      *   If Safe: **DEFER TO INDIVIDUAL.** (It is their right to make an unwise decision).
      *   If Unsafe: **ESCALATE.** This is no longer a preference issue; it is a safeguarding/capacity issue. Do not sign off the plan until a mitigation strategy (mediation, capacity assessment) is attached.

  ***

  ### Application to Your Cases

  **Case 1: 78-year-old man refusing a male carer.**
  *   **Dignity Check:** Pass. This concerns intimate care and gender. It is a protected preference under equality guidelines.
  *   **Magic Wand:** Irrelevant (Dignity Check trumps).
  *   **Wellbeing Floor:** Safe, assuming female carers are available.
  *   **Verdict:** **RESPECT IT.**
  *   **Plan Note:** "Male carers excluded for personal care. Female staff only."
  *   **Why:** This is about bodily autonomy and privacy, not stigma. Overriding this would be a violation of dignity.

  **Case 2: Woman refusing hours to avoid burdening her son.**
  *   **Dignity Check:** Fail. This is not about the task; it's about her perception of her role in the family.
  *   **Magic Wand:** Fail. If the son explicitly said, "I want to help, it's no burden," and she *still* refused council help, it might be a value. But usually, if the "burden" fear is removed, the need remains. She is prioritizing his feelings over her statutory needs based on a fear (stigma of dependency).
  *   **Wellbeing Floor:** **BREACHED.** Reducing care hours leads to unmet needs (hygiene, safety, respite for the son).
  *   **Verdict:** **DO NOT BUILD IT IN.**
  *   **Plan Note:** "Assessed need: 10 hours. Current uptake: 5 hours due to perceived familial burden. Risk: Neglect. Action: Social worker to mediate with son to clarify willingness; full hours remain allocated."
  *   **Why (The Uncomfortable Truth):** This is the one you won't like. It feels patronising to tell a mother she is wrong about her relationship with her son. However, the Care Act prioritizes *her* wellbeing. By codifying her refusal, you are laundering her anxiety into a care plan that leaves her under-supported. You must fund the need, record the risk, and work to remove the stigma, not accept the stigma as a budget-saving measure.

  **Case 3: Resident refusing day centre ("for people with dementia").**
  *   **Dignity Check:** Fail. This is about social identity and labeling.
  *   **Magic Wand:** Fail. If the centre were renamed "Community Social Club" and the dementia label removed, she would likely attend. The objection is the *stigma*, not the *activity*.
  *   **Wellbeing Floor:** At Risk. Social isolation is a wellbeing breach.
  *   **Verdict:** **DO NOT BUILD IT IN.**
  *   **Plan Note:** "Client requires community social engagement. Current provider unsuitable due to stigma associated with branding. Action: Source alternative non-labeled community group or transport to generic social venue."
  *   **Why:** Honoring this as written ("No day centre") colludes with ageist stigma. You must meet the *need* (socialization) without reinforcing the *label* she rejects.

  ### Summary of Your Tests
  *   **Substitution:** **KEEP.** Use it in Question 1 to spot prejudice against protected groups.
  *   **Take-back:** **KEEP & RENAME.** Use it as Question 2 ("Magic Wand") to isolate stigma from preference.
  *   **Cost:** **BIN.** It introduces socioeconomic bias into the decision. A poor person weighing cost is not displaying internalized stigma; they are displaying rational survival. Do not use financial cost to judge psychological bias.
