  ### 1. Phenomenon Identification and Nearest Established Concepts

  The closest established concepts are the **Moorean Shift**, **Bootstrapping**, and **Wittgensteinian Hinge Propositions**, yet each fits imperfectly. The Moorean Shift utilizes common sense claims to reject skeptical premises but typically halts there; it does not usually derive further theoretical conclusions (like scientific realism) before retreating. Moore asserts knowledge to block skepticism, not to build a positive theory shielded by that knowledge. Bootstrapping, as analyzed by Stewart Cohen, describes deriving general reliability from specific instances but focuses on the justificatory failure of the inference itself, not the defensive reclassification of the premises when challenged. Wittgensteinian Hinges are framework conditions that cannot be doubted, but Wittgenstein explicitly forbids using them as evidential premises to prove other things. The distinguishing feature of the observed pattern is the **dialectical status-shift**: the proposition functions as a truth-apt premise during the constructive phase (allowing inference to reliability) and as an indubitable framework condition during the defensive phase (immunizing against critique). This equivocation allows the speaker to harvest evidential weight from the claim while denying the skeptic the right to question it. Crucially, the defense relies on pragmatic self-defeat rather than evidential support. No single established term captures this dynamic movement between "evidence" and "constitutive rule" within a single argumentative sequence, nor the strategic timing of the shift which exploits the ambiguity between having a reason and setting the rules for reasoning. This structure creates a unique vulnerability where the argument appears robust because it draws strength from two different epistemic categories sequentially, masking the lack of support for the intermediate inference. The speaker gains the benefit of evidentialism without its burdens, and the benefit of coherentism without its constraints.

  ### 2. Boundary Cases and Non-Instances

  Legitimate foundationalism posits basic beliefs that are self-justifying or non-inferentially warranted; these do not require pragmatic defense when challenged, as their justification is intrinsic or phenomenological. Plain circular reasoning involves P supporting C and C supporting P; here, P supports C, but C is shielded by P's indispensability, not by C supporting P. Similarly, if a belief possesses independent empirical support beyond its denial costs, it is not this phenomenon. This pattern specifically requires the *absence* of independent justification for the strong conclusion, relying entirely on the foundational claim's dual role to sustain the structure. It is distinct from auxiliary hypotheses, which are tested against evidence and can be discarded if they fail predictions. In this pattern, the foundational claim is placed beyond testing precisely when the predictions derived from it are threatened, preventing the falsification that normally governs hypothesis testing. This ensures the structure remains intact regardless of external counter-evidence.

  ### 3. Relation to Bootstrapping and Easy Knowledge

  This pattern extends the "Easy Knowledge" problem identified by Stewart Cohen and Jonathan Vogel. Standard bootstrapping critiques focus on the illegitimacy of deriving general reliability from specific instances without antecedent justification, often citing violations of the closure principle or lack of confirmation. This pattern accepts the bootstrapping derivation but adds a protective layer to evade these critiques. When the skeptic challenges the generalization (the "hard" knowledge), the speaker retreats to the specific instances (the "easy" knowledge), arguing that denying them undermines the skeptic's own capacity to argue. Thus, the "easy" knowledge is exploited twice: first as insufficient evidence made sufficient by inference, then as indispensable framework made immune by pragmatic necessity. It transforms a justificatory deficit into a dialectical fortress. This maneuver effectively blocks the standard objection that bootstrapping provides no new justification, by changing the subject from justification to the preconditions of intelligibility when pressure is applied. It leverages the high cost of denying basic perceptual claims to shield the low-quality inference drawn from them, conflating the certainty of the input with the validity of the output. Consequently, the argument avoids falsification not by strengthening the link between premise and conclusion, but by making the premise untouchable once the conclusion is threatened. This creates a false impression of stability, as the "easy" knowledge is treated as hard when needed.

  ### 4. Proposed Terminology and Definition

  I propose the term **"The Hinge-Premise Pivot."** This label identifies the maneuver where a proposition is pivoted from functioning as an evidential premise (warranting inference) to a hinge proposition (warranting immunity). The scope covers arguments where a claim's justificatory weight is inflated during construction and its deniability is restricted during defense, specifically to protect a derived conclusion that lacks independent security. It marks the illicit sliding between epistemic categories to evade scrutiny. This term applies only when the shift is dialectical and strategic, not when a belief genuinely possesses both properties independently. It distinguishes the maneuver from stable foundationalism where basic beliefs remain basic throughout. The pivot is defined by the tactical reclassification triggered solely by dialectical pressure.
