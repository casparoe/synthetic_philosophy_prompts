  In Bengal, labor entitlements shattered when wartime inflation outpaced rural wages, while fishers and transporters lost direct entitlements via the British "Denial Policy" (destroying boats/rice). This wasn't passive market shock; it was administrative violence. The Famine Code, designed to trigger relief, was sidelined by war priorities, illustrating that entitlement protection requires political will, not just legal frameworks. Information flow was critically distorted: censorship hid starvation, and local officials feared reporting failure. Sen argues famines vanish in democracies because leaders face electoral punishment. Bengal supports this negatively—colonial subjects couldn't vote, so their starvation carried no political cost. However, the model strains here. Sen treats entitlement collapse as an economic variable responsive to information. Bengal shows collapse can be intended policy. If a democracy accepts war exceptions that suspend rights, does it remain "functioning"? The ontology of famine shifts from "lack of food" to "withdrawal of protection." Sen is silent on whether entitlement collapse is ever truly apolitical. Bengal proves it is not. The failure wasn't just the market; it was the state refusing to correct the market. Thus, democratic accountability is necessary but perhaps insufficient if bureaucratic structures can be weaponized during emergencies. Sen risks tautology: if famine occurs, the democracy wasn't "functioning." Bengal shows authoritarian neglect takes specific bureaucratic forms—classifying populations as expendable. Famine is not an economic accident but a political verdict.
