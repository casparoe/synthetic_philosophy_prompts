answer: |-
  I reject the symmetry you attempt to draw between R and the asymbolic patients. I do not interpret the asymbolic patients as merely reporting a change in motivation; I interpret them as reporting the absence of the hurt itself, and I take that phenomenological testimony at face value. R reports the presence of the hurt, and I take that testimony seriously as well. The asymmetry lies in your assumption that I must privilege behavioral disposition over phenomenological report to determine the location of badness. I do not. In asymbolia, the hurt is gone, so the badness is gone. In R, the hurt is present, so the badness is present. Her failure to desire cessation is a dissociation between value and motivation, not evidence that the value isn't there. It is like a depressed person who lacks the drive to avoid their own misery; their suffering is still bad even if they lack the motivation to escape it. R is prudentially blind, not value-proof.

  You ask what is going badly for her. The answer is right there in her report: she is undergoing an awful experience. You seem to think that for something to be bad for a person, it must impair their functioning or conflict with their preferences. I deny this. Badness-for is anchored in the subject's phenomenal welfare, not their narrative evaluation or behavioral output. If a benevolent guardian knew R was experiencing intense unpleasantness, they would relieve it, not because R wants them to, but because no one ought to suffer like that. The hurt is a local intrinsic evil. By insisting that the badness lies in the downstream effects, you are pushing the value out of the experience and into the reaction, leaving the actual suffering morally neutral until it triggers a desire. But surely the desire is rational because the hurt is bad, not the other way around. If R's indifference neutralizes the badness, then why wouldn't a similar indifference in a torture victim neutralize the wrongness of their suffering?
