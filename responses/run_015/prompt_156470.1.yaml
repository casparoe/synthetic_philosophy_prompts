  6.  **Drafting the Content (Iterative refinement):**

      *   *Scenario:* Alex stands in a sweltering kitchen, shouting at a contractor about delayed tiles. His face is crimson, fists clenched, voice cracking. Yet, when asked, Alex insists, "I'm not angry, I'm just heat-exhausted and tired; no one's at fault, things just happen." He holds no belief that the contractor acted wrongly, only that the situation is physically oppressive.
