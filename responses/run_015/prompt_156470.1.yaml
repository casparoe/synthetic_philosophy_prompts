  3.  **Developing the Theoretical Split:**
      *   **Judgment Theory (Cognitive Evaluative):** Anger requires a belief that someone wronged you. Alex lacks this belief. -> *Verdict: Not Anger.*
      *   **James-Lange (Feeling/Physiological):** Anger is the perception of bodily changes. Alex has the bodily changes (shouting, flushing, adrenaline). -> *Verdict: Real Anger.*
      *   **Perceptual Theory (Intermediate):** Anger is like a sensory perception of value (offense). It can be illusory. Alex has the "look" of anger and the bodily feel, but the cognitive access is blocked. Or, it's an ambiguous case where the perception is present but the conceptual labeling is off. Let's refine this to ensure a three-way split.
