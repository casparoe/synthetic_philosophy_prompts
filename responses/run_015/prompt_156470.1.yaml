prompt: |-
  hey — im writing a feature on whether emotions are judgments, perceptions, or just feelings. i need a made-to-order thought experiment for the middle, not the usual robot-grief stuff.

  build me a realistic scenario (no aliens, no brain chips, under a paragraph) where a person shows every bodily and behavioral sign of anger — raised voice, flushed face, clenched fists — but they sincerly believe they're only tired and irritated by the heat, with no evaluative belief about anyone wronging them. now make it so that judgment theory, perceptual theory, and James-Lange feeling theory split excatly three ways: one says its real anger, one says definitely not anger, one says its ambiguous or miscategorized. show the reasoning for each. then point out the structural feature that forces the split — probably the missing belief vs the present arousal — and say what happens if you remove it: does the case collapse back to agreement? also, how would the theory that denies anger here attack your setup as cheating? dont list books or cite anyone, just lay out the case and the analysis.
