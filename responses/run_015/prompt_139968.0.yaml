prompt: |-
  You're a professional epistemologist — the kind who's published on both sides of the closure debate, i.e. you've written papers defending Nozick-style tracking conditions (knowledge is belief that both *adheres* to the truth and is *sensitive* to it: were p false, S wouldn't believe p; were p true across the nearby cases, S would) and you've also written papers saying knowledge is closed under known entailment and that the sceptical cases only look like counterexamples because what's at issue, or which alternatives are relevant, shifts. You also know enough about machine-learning-in-medicine to talk about false-positive rates concretely instead of hand-waving. Please think carefully before you write: do some actual brainstorming first, and be explicit where a disagreement turns out to be about words rather than about the world. I want a document, not an essay about the document.

  Why I'm asking: I'm a first-year PhD student co-supervised by two people who cannot be left in a room together for more than ten minutes — one is a tracker, one is a closure-keeper — and I also work ten hours a week on a sepsis-prediction model at the hospital. Last spring my dad was in the ICU, the model flagged him, the resident told my mum "we think he's septic", and it was a false alarm. My two supervisers spent our entire next supervision arguing about whether, before the cultures came back, the resident *knew* my dad was septic, and they got exactly nowhere. So this is definately personal for me now. I want something I can put in front of both of them.

  Two bits of machinery I want you to genuinely use, not just nod at:

  (1) **Fixed-channel vs. free-channel counterfactuals.** When a belief is formed by reading off an instrument's output, "if p were false, would S still believe p?" is ambiguous. Fixed-channel: hold the input pinned — same vitals, same labs, same scan — and vary only whether p is true downstream. On that reading almost any classifier with a nonzero false-positive rate comes out insensitive, because the same numbers are still on the screen in the nearby p-false worlds. Free-channel: let the input vary too, as it would in the nearest p-false worlds; then the numbers change and the model doesn't fire, and sensitivity survives. Which reading is the right one for tracking, and does the answer change if the clinician knows the model's error profile?

  (2) **Deception zones and transmitting entailments.** For a method M and a proposition p, call M's *deception zone for p* the nearby p-false worlds in which M still yields belief that p. Say an entailment p→q (known to S) *transmits for S* iff every nearby world in M's deception zone for p is still a q-true world — i.e. every near false positive for p lands somewhere q still holds. Goldfinch→bird transmits (the near false positives are other birds); hands→not-a-brain-in-a-vat doesn't. Conjecture to test: closure holds exactly for entailments that transmit, so the tracker can accept a restricted closure principle and the fight moves to how coarse the target proposition is relative to the method's error profile. Tell me if that collapses one of the two views into the other, and which one.

  Deliverable, in this format:

  1. **Agreed claims**, numbered, 8–12 of them, each one something both of them could actually sign and that isn't vacuous (I'll delete anything either of them would call filler). Include at least one about what "knows" is doing in the clinical case and one with practical bite — what a clinician is permitted to say to a family member.

  2. **A disagreements table**: each row = the disputed claim, the tracker's phrasing, the closure-keeper's phrasing (phrased so that side would accept it as their own), whether the disagreement is substantive or verbal, and one line on why.

  3. **Cruxes**, 3–5 of them: for each, the sub-question such that settling it would move at least one side; a case or argument both would accept as bearing on it; and each side's prediction written down in advance, plus what each would count as having lost. Please use the sepsis case: suppose the model's false positives cluster almost entirely in patients with a non-infectious systemic inflammatory state, and the clinician knows that. Ask both of them about the fine proposition (septic) and the coarse one (systemically inflammatory — entailed by septic), then again for a retrained model whose false positives scatter outside the coarse region. Also worth a row: what two independent instruments do to the deception zone.

  4. **One sentence** the resident could have said to my mum that both of my supervisors would agree isn't a lie.

  No literature review, no reading list, no citations — I need the argument, not who said it.
