answer: |-
  The slips lay on the felt table like a autopsy spread. Five colors. Five hands. None of them knew the others.

  Miller traced the edge of the blue slip. "Individual exposure on each of these is within acceptable variance. I priced the risk. I took the premium."

  "You priced them locally," said the Kid. He was tapping a calculator, the rhythm staccato. "You didn't check the global coherence. You're short volatility across the board."

  "I'm not a fund," Miller said. "I'm a man taking wagers for beer money. There's no consortium. You," he pointed to the Lady in the red coat, "you wanted the greyhound in the third. You," he pointed to the Old Man, "you wanted the field in the seventh. You never met. There's no bookie here. There's no con."

  "There doesn't need to be," the Lady said. She didn't look at him. She was watching the smoke curl from her cigarette. "Incoherence is incoherence. If your probabilities sum to greater than one, you're bleeding. It doesn't matter if the knife is held by one hand or five."

  "It matters to the solvency," Miller snapped. "Look at the horizon. To realize this guaranteed loss, I need to hold these positions to maturity. All of them. The series extends."

  "The series extends to infinity," the Kid said. "That's the math. To lock the loss at one hundred percent certainty, the chain has to close. Bet one through bet *n*, where *n* approaches infinity."

  Miller tapped his chest. "I stop at nine hundred. My heart stops at nine hundred. I don't live to see the convergence. So where is the loss? Show me the ledger entry where I'm dead and owing."

  "You're irrational now," the Old Man said. His voice was like gravel in a mixer. "It's not about the payoff. It's about the stance. You're standing in the rain claiming you won't get wet because you plan to go inside before the storm breaks. But you're already wet."

  "I'm dry," Miller said. "I'm solvent. At bet nine hundred, there is still a path—a narrow path, maybe one in a million—where the variance swings my way. I don't lose everything. I lose some. But the guarantee? The guarantee requires me to be immortal. I'm not."

  "The guarantee defines the rationality," the Kid said. "If your beliefs allow for a Dutch Book, even an asymptotic one, your beliefs are wrong. You're pricing risk based on a finite horizon when the logic is infinite. You're lying to yourself about the exposure."

  "I'm an underwriter," Miller said. "I deal in finite terms. Policies expire. Lives end. If the loss only materializes in the limit, and I don't exist in the limit, then the loss is theoretical. You're asking me to pay a premium against a claim that can never be filed."

  "The claim is filed now," the Lady said. "The inconsistency exists now. You're holding contradictory beliefs about the world. You believe the dog will win here, and won't win there, in a way that doesn't add up. It's a lie in the logic. It rots the whole book."

  "It's an accident," Miller said. "That's the point. You five didn't collude. This isn't a trap. It's noise. It's statistical drift. Why should I be damned for noise?"

  "Because you're the book," the Old Man said. "You're the clearinghouse. The noise aggregates through you. If you can't see the aggregate, you're not doing the job. You're just gambling."

  "I'm settling bets," Miller said. "There's a difference."

  "Not if the math says you're losing," the Kid said. He pushed the calculator forward. The screen showed a negative number. "See? Aggregate liability."

  "That number assumes I take bet nine hundred and one," Miller said. "I won't. I'm tired. My hands shake. I won't be here for the tail end of the distribution."

  "Then you're admitting you know the book is bad," the Lady said. "You know the loss is coming, you're just betting on your own death to stop the bleeding. That's not rationality. That's arbitrage on your mortality."

  Miller looked at the slips. Five colors. Five strangers. They hadn't planned this. They'd just walked up to his window, one by one, over a week, and offered him odds that felt fair in the moment. Each one stood alone. Each one was defensible. But together, they formed a noose that tightened only if he kept breathing forever.

  He felt the weight of the argument. It wasn't about the money. It was about the structure. If he admitted the loss was real, he admitted his mind was broken, that his way of seeing risk was fundamentally flawed, even if he died before the bill came due. If he denied it, he was a gambler hiding behind actuarial tables.

  "Irrationality is a state of being," the Kid said. "Not a result."

  "Solvent is a state of being," Miller countered. "And I am solvent."

  "For now," the Old Man said.

  Miller picked up the blue slip. Then the red. He shuffled them, the paper sounding like dry leaves. He looked at the five people around the table. They weren't enemies. They were just variables. They hadn't tried to kill him. The math had tried to kill him. Or maybe the math was just pointing out that he was already dead, and the breathing was the anomaly.

  "If I take one back," Miller said. His voice was quiet. The bar noise outside faded. "If I void one slip. The coherence breaks. The guarantee vanishes. Even if the logic says I'm wrong, the loss stops being certain."

  "The inconsistency remains," the Kid said. "You'll still be irrational."

  "But I won't be booked," Miller said. "I won't be locked."

  He looked at the slips again. He didn't look at the odds. He looked at the dates.

  The first bet. The one from last Tuesday. The one that started the chain. Before that, his book was clean. Before that, his probabilities summed to one. The error wasn't in the math; it was in the continuation. The first mistake wasn't the price. It was the agreement to open the book again after he'd already retired.

  Miller picked up the first slip. The blue one. The Kid's bet.

  "If I void this," Miller said. "The aggregation fails. The series doesn't start. I remain consistent within the finite horizon."

  "You're just moving the error," the Lady said. "You're ignoring the data."

  "I'm managing the exposure," Miller said.

  He took a lighter from his pocket. He flicked it. The flame hovered over the blue corner of the slip.

  "You know," the Old Man said. "Even if you burn that, you still took the other four. You're still exposed."

  "Not if the first one never happened," Miller said. "Then the others are just isolated wagers. Unconnected. Noise. I can live with noise. I can't live with a structure."

  "Is that the rational choice?" the Kid asked. "Or just the easiest one?"

  "It's the only one that lets me sleep," Miller said.

  He didn't burn it. He just tucked it into his breast pocket, over his heart. A revocation isn't destruction. It's a amendment.

  "I'm taking back the first one," Miller said. "Not because it was unfair. But because it was the first time I forgot I was mortal."

  He stood up. The slips remained on the table. The loss was still there, theoretically, in the infinite limit. But the chain was broken.

  "I'm closing the book," Miller said. "No more bets. The horizon is finite."

  He walked out into the night air. It was cold. He buttoned his coat. He didn't check the odds on the races tomorrow. He didn't need to. He was no longer underwriting the infinite.
