      *   *Conclusion:* The problem is manageable within Gibbard's framework without extra metaphysics, but it does require a robust account of *diachronic rationality*.

  7.  **Final Structure:**
      1.  Validate the insight (it's a known tension).
      2.  Analyze the semantics of past-tense moral claims in expressivism.
      3.  Explain Gibbard's "Planning" solution to diachronicity.
