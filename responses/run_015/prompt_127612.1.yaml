  8.  *(Self-Correction during drafting)*: Make sure to distinguish between "I accepted N in 2018" (psychological fact) and "N was correct to accept in 2018" (normative claim). The user's prompt uses the latter. This is key. The expressivist translates the latter into a current normative stance.

