answer: |-
  This is a sophisticated and incisive objection that cuts to the heart of how expressivist semantics handles temporal indexicality and the unity of the moral agent. You are asking whether the expressivist solution to the Frege-Geach (F-G) problem, which relies on the consistency of *current* attitudes, can survive the fragmentation of the self over time.

  The short answer is that while this presents a genuine challenge, it does not necessarily resurrect the Frege-Geach problem in its original, fatal form. Rather, it shifts the burden to the expressivist's theory of **diachronic rationality** and the semantics of **past-tense normative claims**.

  Here is a detailed breakdown of how an expressivist (specifically within Gibbard's framework) would respond, and how we should classify the difficulty you have identified.

  ### 1. The Semantics of Past-Tense Normative Claims
  The core of your worry rests on the embedded clause: *"If N was the correct norm to accept in 2018..."*

  If expressivism is to remain consistent, it cannot treat this clause as describing a mind-independent normative fact that obtained in 2018. Instead, it must analyze this claim in terms of the **current agent's attitudes**.
  *   **Realist Reading:** There exists a timeless fact that $N$ was correct in 2018.
  *   **Expressivist Reading:** To assert "N was the correct norm to accept in 2018" is to express a *current* (2025) norm-acceptance that evaluates the 2018 situation. It is to say, "I now accept norms that would have required accepting $N$ given the circumstances of 2018."

  If this translation holds, the logical form of the conditional in 2025 is not bridging a gap between a 2018 attitude and a 2025 attitude. Rather, it is relating two **2025 attitudes**:
  1.  **Antecedent:** A present endorsement of one's past normative stance.
  2.  **Consequent:** A present judgment of obligation regarding action $A$.

  Because both the antecedent and the consequent are expressions of the *current* (2025) normative system, the inferential link remains synchronic. The "temporal gap" is semantic content, not a gap in the psychological states doing the inferring. Therefore, the standard expressivist solution to F-G (logic as consistency of current attitudes) remains intact.

  ### 2. Gibbard's Planning Theory and Diachronic Unity
  You ask whether Gibbard's framework treats past and present stages as a unified subject or requires an independent theory of personal identity.

  Gibbard's later work (*Thinking How to Live*) centers on **planning**. To accept a norm is to be in a state of planning. Planning is inherently diachronic; a plan is a constraint on future behavior and a standard for evaluating past behavior.
  *   **Practical Unity:** Gibbard does not require a metaphysical theory of personal identity (e.g., Lockean memory or Parfitian psychological continuity) to solve this. He requires a *practical* unity. The "agent" is defined as the locus of planning.
  *   **Binding the Future:** When I accept a norm now, I am binding my future self. When I evaluate a past norm, I am assessing whether my past self was planning correctly according to my current standards.
  *   **The "Severed Link":** You suggest the temporal gap severs the inferential link. Gibbard would argue that if the link is severed (i.e., if I repudiate my 2018 self), then the antecedent ("N was correct...") is false *by my current lights*. If I reject the antecedent, the conditional does not compel me to do $A$. This is not a failure of logic; it is an accurate representation of moral growth or regret.

  Thus, Gibbard's framework treats the agent as unified insofar as the agent possesses a **continuous capacity for planning and norm-acceptance**. The "unity" is not a metaphysical precondition but a functional requirement of being a planning creature.

  ### 3. Is this a Return of Frege-Geach or a New Challenge?
  This is the crucial classificatory question.

  **Argument for "Return of F-G":**
  One could argue that if the meaning of "N was correct in 2018" shifts depending on who is speaking (the 2018 agent vs. the 2025 agent), we face a problem of **equivocation** similar to F-G. If the 2018 agent meant "I accept N" and the 2025 agent means "I now endorse my past acceptance of N," have we preserved validity?
  *   *Counter:* Validity in expressivism is about the consistency of the *current* thinker's web of attitudes. As long as the 2025 agent's acceptance of the antecedent and the conditional forces the acceptance of the consequent *now*, validity is preserved. The 2018 attitude is irrelevant to the 2025 logic, except as the object of evaluation.

  **Argument for "Diachronic Rationality Challenge":**
  It is more accurate to view this not as a semantic F-G problem, but as a problem of **Diachronic Rationality**. The challenge is explaining how an agent can be rationally bound by norms they no longer hold, or how they can coherently evaluate past norms they have rejected.
  *   If I reject $N$ in 2025, but $N$ obligates $A$ in 2025, do I have to do $A$?
  *   Expressivism says: No, because obligation is relative to current norm-acceptance.
  *   But this feels counterintuitive. We often think past commitments bind us even if our attitudes change (e.g., promises).

  This suggests the difficulty is not about *embedding* (F-G), but about the **persistence of normative authority**. Expressivism must explain why past acceptances have any grip on the present agent if the present agent no longer accepts them. This is a challenge for the theory of **normative binding**, not necessarily for the semantic theory of embedding.

  ### 4. Does it Require a Theory of Personal Identity?
  You ask if resolving this requires supplementing expressivism with an independent theory of personal identity.
  *   **No, not metaphysical identity.** Expressivism is naturalistic. It does not need a "further fact" of identity.
  *   **Yes, psychological continuity.** It does require a robust account of how memory, intention, and self-conception link time-slices. If the 2025 agent does not recognize the 2018 agent as "me," then the normative evaluation becomes third-personal ("If *he* was right...").
  *   Gibbard handles this by noting that planning involves a conception of oneself as persisting. To plan is to presuppose identity. Therefore, the theory of identity is internal to the practice of planning, not an external metaphysical supplement.

  ### 5. Conclusion: Apparent Difficulty or Genuine Variant?
  The difficulty is **largely apparent** regarding the Frege-Geach problem specifically, but it highlights a **genuine variant** regarding diachronic authority.

  1.  **F-G is Safe:** The logical relations hold because the expressivist analyzes past-tense moral claims as *present* attitudes about the past. The inference happens entirely within the 2025 cognitive economy. The "gap" is bridged by the semantics of tense, not by metaphysical identity.
  2.  **Diachronic Authority is the Real Issue:** The deeper worry is not about logic, but about **normative stability**. If expressivism makes obligation too dependent on current attitudes, it struggles to explain the binding nature of past commitments (like promises or long-term projects) when current attitudes shift.
  3.  **Classification:** This should be regarded as a challenge of **Diachronic Consistency** rather than a resurrection of Frege-Geach. Frege-Geach is about how moral sentences function in logic *at a time*. Your scenario is about how moral authority persists *across time*.

  **Verdict:** Gibbard's framework can accommodate this without collapsing, provided it treats past normative claims as present evaluations of past planning states. It does not require a metaphysical theory of personal identity, but it does require a robust account of the **planning nature of agency** to explain why we care about the consistency of our past and present selves. The "severed link" you fear is actually a feature: it allows for moral regret and growth. If the link were unseverable, we could never judge our past norms as mistaken.
