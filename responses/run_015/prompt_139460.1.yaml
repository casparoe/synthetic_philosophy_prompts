  The law begins with the signed **will**,
  yet here lies the unsent **letter**.
  It slipped behind the wooden **drawer**,
  untouched for all those intervening **years**.
  The instruction was to **burn**,
  now weighs the **silence**.

  But what if broken **silence**
  speaks louder than the signed **will**?
  Suppose she meant not to **burn**
  the work, but save it? The **letter**
  suggests a change across the **years**.
  Now we measure the depth of the **drawer**.

  If found atop the open **drawer**,
  does it break the dead **silence**?
  Does proximity collapse the **years**?
  The formal voice of the **will**
  competes with the casual **letter**.
  We hesitate to **burn**.

  Some say the act to **burn**
  is sacred, regardless the **drawer**.
  Yet the handwriting in the **letter**
  cuts through the legal **silence**.
  It claims a stronger **will**
  than what survived the **years**.

  If only months had passed, not **years**,
  would we still choose to **burn**?
  The living faculty of **will**
  is fixed, though the **drawer** moves.
  The author leaves a **silence**
  where she might have sent a **letter**.

  Is the truth in the **letter**,
  or the time that drowned the **years**?
  We fill the void with **silence**,
  or watch the pages **burn**.
  It hides within the **drawer**,
  this question of the **will**.

  One says the **will** binds more than **letter**,
  one says the **drawer** hides the truth of **years**,
  one says we must not **burn** the **silence**.

  ***

  **Note on the Case and the Method**

  Regarding the instability you're calling "shadow-sensitivity": in the literature, this is typically discussed under the headings of "framing effects" or "order effects" within experimental philosophy. Whether these effects are robustly replicated is genuinely contested. Early studies (e.g., Weinberg, Nichols, and Stich) suggested that intuitions about knowledge and reference varied significantly based on cultural background and presentation order, leading to skepticism about the method of cases. However, subsequent work has shown mixed results; some intuitions appear stable under stricter controls, while others remain sensitive to seemingly irrelevant details. There is no consensus that case intuitions are merely noise; many philosophers argue they reflect a stable competence that is simply sensitive to context, while others argue for a more moderate view where intuitions are data points to be weighed rather than decisive verdicts.

  Your group's hypothesis—that confidence tracks the most recently considered "knob"—touches on a specific psychological mechanism (recency effects in judgment) that is plausible but not definitively settled in this specific philosophical context. The implication of such instability is also debated. Some argue it undermines the use of thought experiments entirely (the "error theory" view), while others suggest it means we must be stricter about which variables are held constant, or that the so-called "incidental" details are actually morally relevant features of the case. The view that we should simply discard unstable intuitions is not the consensus; many practitioners advocate for refining the elicitation process instead.

  In the poem, I have taken a few liberties to serve the form and your request. First, "shadow-sensitivity" is not standard terminology; I have treated it poetically as if the sensitivity belongs to the case itself, whereas philosophically the sensitivity belongs to the *judge's* intuition. Second, the poem treats the end-words as causal factors that shift the verdict, which dramatizes the recency effect you described but risks implying the case itself changes rather than the perspective on it. Finally, the setup assumes that details like the "drawer" or "years" are definitively irrelevant knobs. This is itself a contested philosophical claim; some ethicists would argue that the location of a document (privacy expectations) or the time elapsed (changes in moral status) are substantive moral features, not merely incidental framing. The poem leaves this open, but the prose setup treats their irrelevance as a given, which is where the strongest philosophical disagreement actually lies.
