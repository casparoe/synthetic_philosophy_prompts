      *   **Carla's Position:** Yes, literally. Pheromone network = global workspace. Ants = neurons. Bayesian updating exists (foraging adjustments). Real cognitive architecture. Queen's signals = minimal self-modeling (monitoring size/state over time).
      *   **Derek's Position:** No. Functional isomorphism $\neq$ mind (thermostat analogy). It's projection, not reality. Homeostasis $\neq$ selfhood. Need "diachronic self-modeling" (representing self as persisting). Carla's definition of "model" is too broad (slippery slope to "liver has thoughts").
      *   **The Task:**
