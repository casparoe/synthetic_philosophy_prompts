      *   **The "Sophistry":** Marcus using the rearrangement theorem to justify £20 is the sophistry. The Mathematician's observation about instability is correct, but her implication that the *price* is arbitrary is misleading in a fixed-rule game.
      *   **The Cap:** This converts the variable to one with finite mean and variance. This is the "honest number" the treasurer wants.

  6.  **Final Polish:** Check the numbers.
      *   Series: $1 - 1/2 + 1/3 - 1/4 \dots = \ln(2) \approx 0.6931$.
