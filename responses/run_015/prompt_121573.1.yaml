      *   **Riemann Rearrangement Theorem:** Yes, technically, if you rearrange the terms of a conditionally convergent series, you can make it sum to anything.
      *   **Relevance to Probability:** Does rearrangement apply to Expected Value?
          *   Expected Value is defined as $\sum x_i p_i$. The order of summation in the definition of expectation is fixed by the sample space structure *unless* we are dealing with infinite discrete spaces where absolute convergence matters.
          *   **Key Concept:** For an expectation to be well-defined and robust (obeying Law of Large Numbers), the series must be **absolutely convergent**. i.e., $\sum |x_i| p_i < \infty$.
          *   Here, $|x_i| p_i = (2^n/n) \times (1/2^n) = 1/n$.
          *   $\sum |1/n|$ is the Harmonic Series, which diverges to infinity.
          *   **Conclusion:** The expectation is *not* absolutely convergent. Therefore, the Strong Law of Large Numbers (SLLN) does **not** apply in the standard sense. The sample mean does not converge to a constant almost surely.
      *   **Implication for Marcus's Claim (69p):** The value $\ln(2)$ is the sum of the series in its *natural order* ($n=1, 2, 3, \dots$). In probability theory, the "natural order" is usually the definition of the expectation for a discrete random variable $X$: $E[X] = \sum_{k} x_k P(X=x_k)$. Since the index $n$ corresponds to the physical outcome (number of tosses), the order is physically determined. You don't get to rearrange outcomes ($n=1$ happens, or $n=2$ happens). The Riemann rearrangement argument is mathematically true for abstract series but **physically meaningless** for this specific random variable because the index $n$ is intrinsic to the event definition.
