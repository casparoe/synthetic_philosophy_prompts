          *   If he claims it's worth £20, he's using the rearrangement argument to justify a high price. This is sophistry.
          *   If the "true" value is arguably undefined, charging £20 is definitely unsafe for the player.
      *   *Season Ticket:* If LLN doesn't hold, averaging over 100 games doesn't reduce risk. The sum of 100 such variables behaves like a single variable of the same type (stable distribution with $\alpha < 1$? No, this is discrete). Actually, the sum of $N$ i.i.d. variables with infinite mean grows faster than $N$. The average does not converge. So the season ticket does *not* smooth out the swings.

