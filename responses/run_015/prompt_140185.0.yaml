      *   *Confidence:* I'm less confident on Case 1 because the "wrung out and great" sensation is exactly what she seeks in *Lear*. The only barrier is the "how." If she's a pure phenomenologist, she keeps it. If she's a moralist of art, she dumps it. Given her anger at the Cancer Novel, she's a moralist of art. So I'll stick with Rejection, but note the confidence gap.

