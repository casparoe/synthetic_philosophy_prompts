  2.  **Deconstruct the Core Comparison (Occasionalism vs. Interventionism):**
      *   *Al-Ghazālī:* Fire doesn't burn cotton; God creates the burning at the moment of contact. Nature has no necessary connection.
      *   *Interventionism (Woodward-style, roughly):* $X$ causes $Y$ if an agent can intervene on $X$ to change $Y$ while holding other variables fixed.
      *   *The Twist:* If natural objects (fire, cotton, neurons) cannot *intervene* (they have no agency/capacity to hold variables fixed), then in a strict interventionist sense, they aren't causes either. Only an agent with the capacity to manipulate variables is a true cause.
      *   *Synthesis:* Both views strip "causal power" from inanimate nature. Ghazālī gives it to God; Interventionism gives it to the *Intervenor* (often implied to be human or divine).
