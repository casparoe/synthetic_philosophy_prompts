answer: |-
  Achilles slams the notebook shut. "There! I've encoded the rule of inference as Premise C. You accept A, B, and C. So you *must* accept Z."

  The Tortoise nods politely. "I accept A, B, and C. But I do not yet accept the proposition that 'If one accepts A, B, and C, one must accept Z.'"

  "But that would be Premise D!" cries Achilles.

  "Precisely," says the Tortoise, opening to a fresh page. "And once we have D, we'll need a premise to enforce D... shall we call it E?"

  Achilles stares blankly at the horizon, pen hovering.

  "Cheer up," says the Tortoise. "At least in this race, no one ever has to cross the finish line."
