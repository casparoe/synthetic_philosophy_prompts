      *   This is the false premise. The Rollback *implicitly* relies on $E$ being the sort of thing that *could* have been acquired via a process where $P(E)<1$ naturally.
      *   If $E$ is a logical construction ($H \lor D$), the "rollback state" where $P(E)<1$ is **gerrymandered**. It requires deleting $D$ arbitrarily.
      *   In the Tape Case, deleting $E$ (the specific numbers) is natural because the *process* (reduction) hadn't happened.
      *   In the Disjunction Case, deleting $D$ (the bike tire) is unnatural because the *process* (looking at the bike) *did* happen.
      *   So, reject (3). The rollback *does* depend on the history of acquisition (specifically, whether the evidence was the result of a test that could have yielded a different result).
      *   **Cost:** You have to admit that confirmation isn't just about static probability relations; it's about **testing**. This moves towards a Hypothetico-Deductive or Error-Statistical view, wrapped in Bayesian clothing. It costs "Pure Bayesianism."

