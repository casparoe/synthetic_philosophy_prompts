answer: |-
  Here is a complete package for your 90-minute session. It is designed to be tight, experiential, and philosophically precise without tipping your hand too early.

  ### 1. The Setup & Rules (Print this for yourself)

  **The Scenario:** You are the sole speaker of *Embe*, a language spoken in the isolated Emba Valley. You are behind a cardboard screen. You cannot be seen. You cannot speak English. You cannot gesture.
  **The Interface:** Students submit queries on paper. You respond with one of two tokens:
  *   **⊕ (Grunt):** Assent / Yes / True.
  *   **⊖ (Click):** Dissent / No / False.
  **The Constraint:** You are a *behavioral black box*. You do not care about their theories. You only care about matching the **Master Response Table** below. If a query is ambiguous or ungrammatical in their manual, default to ⊖.

  **The Master Response Table (For TA Eyes Only)**
  *Check for Bias:* To ensure this table doesn't accidentally rule out "Part" or "Stage" theories, every "Yes" must be justifiable by *presence of a rabbit*, *presence of an attached rabbit part*, and *presence of a rabbit temporal slice*. Every "No" must be justifiable by the *absence* of those things.
  *   **Crucial Check:** Do not include a card where a rabbit is present but the response is ⊖ (e.g., "Dead Rabbit"). If you do, the "Rabbit Part" theorist can claim the part is still there. Keep it to *live* rabbit stimuli for the "Yes" cases to maintain the three-way tie.

  | Card ID | Stimulus Description (What happens in front of the screen) | Query Written by Students | Correct Response |
  | :--- | :--- | :--- | :--- |
  | **01** | Live rabbit hops clearly into view. | "Gavagai?" | ⊕ |
  | **02** | Live rabbit hops clearly into view. | "Is that a Gavagai?" | ⊕ |
  | **03** | Rabbit ear visible; rest hidden behind rock. | "Gavagai?" | ⊕ |
  | **04** | Severed rabbit foot on table (no rabbit). | "Gavagai?" | ⊖ |
  | **05** | Rabbit runs behind bush, disappears. | "Gavagai?" (while hidden) | ⊖ |
  | **06** | Rabbit runs behind bush, reappears immediately. | "Gavagai?" | ⊕ |
  | **07** | Two rabbits hop into view together. | "Gavagai?" | ⊕ |
  | **08** | Two rabbits hop into view together. | "One Gavagai?" | ⊖ |
  | **09** | Rabbit seen Monday. Same rabbit seen Tuesday. | "Same Gavagai?" | ⊕ |
  | **10** | Rabbit seen Monday. Different rabbit seen Tuesday. | "Same Gavagai?" | ⊖ |
  | **11** | Rabbit is sleeping (motionless). | "Gavagai?" | ⊕ |
  | **12** | Rabbit fur blowing in wind (no rabbit). | "Gavagai?" | ⊖ |

  *(Note: Cards 09 & 10 are the danger zone. By answering ⊕ to "Same" on Card 09, you favor the "Rabbit" theory. Team D's job in Phase 4 is to explain how a "Stage" or "Part" manual can still predict ⊕ by translating "Same" differently.)*

  ---

  ### 2. Student Materials (Print & Cut)

  **Team Instructions (Hand out to all 4 teams)**
  *   **Goal:** Construct a **Translation Manual** for *Embe*.
  *   **Data:** You will receive 12 Index Cards (01–12). Each describes a stimulus and the Informant's response (⊕ or ⊖).
  *   **Phase 2 Task:** Write a manual defining:
      1.  What *Gavagai* refers to (Object? Part? Event?).
      2.  What counts as *identity* (What makes two Gavagais the "Same"?).
      3.  What counts as *existence* (When do we say "There is a Gavagai"?).
  *   **Phase 3 Task:** Swap manuals. Design a **Falsification Query** that would make the other team's manual predict ⊕ when the Informant says ⊖ (or vice versa).
  *   **Phase 4 Task (Team D Only):** You have a secret objective. Build a manual that fits all the data but posits a *different ontology* than the other teams (e.g., if they say "Rabbit," you say "Rabbit Stage"). You must adjust your translation of logical words (like "same" or "is") to make the predictions match.

  **The Index Cards (12 per team)**
  *   *Front:* Card ID + Stimulus Description + Query.
  *   *Back:* The Response (⊕ or ⊖) from the Master Table above.
  *   *(Note: Give them the cards with the responses already on the back to save time. Do not let them query you live in Phase 1; it eats too much time. You are a lookup table.)*

  **Manual Template (One per team)**
  1.  **Lexicon:** *Gavagai* = _______________
  2.  **Identity Criterion:** "Same Gavagai" means _______________
  3.  **Existence Condition:** "There is a Gavagai" is true when _______________
  4.  **Predictions:** (Briefly explain how your manual accounts for Cards 04, 08, and 09).

  ---

  ### 3. Minute-by-Minute Timeline (90 Minutes)

  **00:00 – 00:10 | Setup & Rules**
  *   Divide into 4 teams (3-4 people each).
  *   Explain the "Black Box" rules. Emphasize: *I am not thinking. I am a lookup table. Do not try to talk to me.*
  *   Hand out Card Decks and Manual Templates.
  *   **TA Script:** "You are field linguists. You have 12 data points. Your job is to write the dictionary entry for 'Gavagai' that perfectly predicts these 12 responses. Go."

  **00:10 – 00:30 | Phase 1: Data Review**
  *   Teams review the 12 cards.
  *   *Circulate:* If a team asks "Can I ask about the rabbit's tail?", say "Submit the query on paper." (Discourage live querying to keep pace).
  *   *Check:* Ensure Team D knows they have a secret mission (slide them a note if needed).

  **00:30 – 00:50 | Phase 2: Manual Writing & Scoring**
  *   Teams write their manuals.
  *   **Scoring:** You (TA) check their manuals against the Master Table.
  *   **The Sting:** Announce that *every* team has scored 100%. Their manuals are empirically equivalent.
  *   *Expected Outcome:* Teams A, B, C will likely write "Rabbit." Team D should be working on "Part" or "Stage."

  **00:50 – 01:05 | Phase 3: Falsification Attempt**
  *   Teams swap manuals.
  *   Task: Design a query (Card 13) that breaks the other manual.
  *   **The Wall:** When they present Card 13, you check your Master Table. If the response isn't in the table, use the *logical extension* of the existing rules.
  *   *TA Trick:* If they ask "What if we show a rabbit hologram?", answer based on visual stimulus (⊕). The point is that *any* behavioral test they devise can be accommodated by adjusting the auxiliary hypotheses in the manual.
  *   **Result:** No one breaks anyone else's manual.

  **01:05 – 01:15 | Phase 4: The Ontological Shift (Team D)**
  *   Team D presents their manual.
  *   **The Hint (If they stall):** *"Don't just change the noun. Change the logic. If 'Gavagai' means 'Stage', what must 'Same' mean to get a 'Yes' on Card 09?"*
  *   **Expected Solution:** Team D argues *Gavagai* = "Temporal Stage of a Rabbit." To account for Card 09 (Same Gavagai? = ⊕), they translate "Same" not as numerical identity, but as "Genetically Continuous" or "Part of the Same Space-Time Worm."
  *   **Result:** Their manual predicts the exact same ⊕/⊖ pattern as the "Rabbit" manual.

  **01:15 – 01:30 | Debrief & Lecture**
  *   Reveal the word: **Inscrutability of Reference**.
  *   Map the activity to Quine's arguments (see Debrief Guide below).

  ---

  ### 4. Debrief Guide (Mapping Activity to Philosophy)

  **1. Stimulus Meaning vs. Reference (Phase 2)**
  *   *Point:* All teams had the same **Stimulus Meaning** (the pattern of ⊕/⊖ to sensory prompts).
  *   *Philosophy:* Quine argues meaning *is* stimulus meaning (for observation sentences). But reference (what the word *picks out*) is not fixed by stimulus meaning.
  *   *Activity Link:* You all scored 100% despite potentially different definitions of "Rabbit."

  **2. Underdetermination (Phase 3)**
  *   *Point:* Collecting more data of the *same kind* (more ⊕/⊖ cards) didn't help.
  *   *Philosophy:* This isn't an evidential gap (we just need more data); it's principled underdetermination. No amount of behavioral data distinguishes "Rabbit" from "Undetached Rabbit Part."
  *   *Activity Link:* When you tried to design Card 13 to break the manual, you realized any new stimulus could be interpreted to fit the existing manual.

  **3. Ontological Relativity (Phase 4 / Team D)**
  *   *Point:* Reference is only fixed relative to a background language/logic.
  *   *Philosophy:* To ask "Do they mean Rabbit or Stage?" is to ask "How do I translate 'Rabbit' and 'Stage' into my language?" There is no absolute fact of the matter.
  *   *Activity Link:* Team D couldn't just swap "Rabbit" for "Stage." They had to swap "Same" for "Continuous." The *whole manual* shifts together.

  **4. Addressing the Objections (Crucial for your class)**
  *   *The "Skepticism" Objection:* "Half the class thought this was skepticism about other minds."
      *   *Response:* Skepticism says "There is a fact (they mean Rabbit), but I can't know it." Quine says "There is **no fact**." Meaning is constituted by behavior. If behavior doesn't distinguish them, nothing does. It's not a limit on our knowledge; it's a limit on what meaning *is*.
  *   *The "Linguist Flatmate" Objection:* "Real linguists use bilinguals and years of data."
      *   *Response:* Quine grants this helps *pragmatically*. But the bilingual helper is just another source of behavioral data. You ask the helper "Does *Gavagai* mean Rabbit?" They nod (⊕). Now you have to translate the helper's nod. You've just pushed the radical translation problem back one step. It never bottoms out in a mental grasp of meaning.
  *   *The "At Home" Point:*
      *   *Response:* This isn't just about exotic field sites. It applies to you and me. How do I know *you* mean "Rabbit" and not "Rabbit Stage" when you speak English? We are in the same boat as the field linguist. Ontology is relative to a background language.

  **5. Limitations of the Activity (Be Honest)**
  *   *Evidential Gap vs. Principled:* The activity makes it look like "We didn't find the right card." Quine's claim is stronger: *No possible card* settles it, because cards are behavioral, and meaning (for Quine) is behavioral.
  *   *Analytic Hypotheses:* In the game, you gave them the "Assent/Dissent" words pre-translated. In reality, even translating "Yes" and "No" is subject to inscrutability (e.g., maybe ⊕ means "No" but only for negative queries). We bracketed that to save time.

  ---

  ### 5. Predicted Pitfalls & Fixes

  **1. "I'll just point and ask 'What is this?'"**
  *   *Risk:* Students try to bypass the ⊕/⊖ constraint.
  *   *Fix:* Enforce the screen rule ruthlessly. "I only accept written queries that result in ⊕ or ⊖." If they write "What is this?", return it with "⊖" (Ungrammatical).

  **2. "I'll bribe the informant / take you to lunch."**
  *   *Risk:* Jokes that derail the "Black Box" frame.
  *   *Fix:* Play it deadpan. "I do not eat. I only process stimuli." Keep the frame hermetic.

  **3. "The Stage Manual is ridiculous."**
  *   *Risk:* Team D gets laughed at for suggesting "Gavagai means Rabbit Stage."
  *   *Fix:* In the debrief, validate the intuition. "It *feels* ridiculous. That's because our background ontology is 'Rabbit.' Quine's point is that 'Rabbit' feels obvious only because we are already inside a manual. Team D stepped outside ours."

  **4. "Manual-writing eats 20 minutes more than budgeted."**
  *   *Risk:* Phase 2 runs long, killing the debrief.
  *   *Fix:* At minute 40, call a hard stop. "Submit what you have." The imperfection doesn't matter; the fact that they *can* submit anything that fits is the point.

  **5. Team D stalls on the "Package Deal."**
  *   *Risk:* They try to swap "Rabbit" for "Stage" but keep "Same" as numerical identity. They will fail Card 09.
  *   *Fix (The Hint):* Walk by Team D at minute 60. Slide a note: *"If 'Gavagai' is a time-slice, Card 09 (Same?) should be No. To make it Yes, you must translate 'Same' as 'Continuous'. Change the logic, not just the noun."*

  ### 6. Closing Script (The "Home" Point)

  "Next week we'll read Kripke and Wittgenstein, but take this home with you: Quine isn't telling you that field linguistics is hard. He's telling you that *communication* is miraculous. When you speak to your roommate tonight, there is no fact of the matter that guarantees you both mean the same thing by 'pizza' or 'love' or 'self.' You are both running manuals that predict each other's behavior. The inscrutability isn't out there in the Emba Valley. It's right here, between you and me."
