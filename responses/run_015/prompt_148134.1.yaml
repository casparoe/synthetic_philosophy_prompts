answer: |-
  # Diagnostic Instrument: The Neural Simulation Variant
  **Target Audience:** Advanced Undergraduates / Early Graduate Students  
  **Time Allocation:** 15 Minutes  
  **Case Variant:** *Simulation Mary.* Mary knows all physical/functional facts. A device induces the exact neural state of seeing red in her brain. She has complete physical self-knowledge of this state. She does not use her eyes.

  ## The Decision Flowchart

  **NODE 1: The Epistemic Outcome**  
  After the simulation activates, can Mary make a true claim about her experience (e.g., *"This is what it is like"*) that she literally could not make before (even in principle)?  
  *   **NO** → Go to **Node 2**  
  *   **YES** → Go to **Node 3**

  **NODE 2: The Phenomenal Reality**  
  If she gained no new claimable knowledge, did the simulation nonetheless produce a "what it is like" state in her mind, or was there no experience at all?  
  *   **There was an experience, but no new fact** → **LEAF 1**  
  *   **There was no experience at all** → **LEAF 2**

  **NODE 3: The Ontological Cost**  
  You answered that she gains a new true claim. To explain this, must we assume the world contains properties that are *not* physical properties?  
  *   **YES (Non-physical properties exist)** → Go to **Node 4**  
  *   **NO (Everything is physical)** → Go to **Node 5**

  **NODE 4: The Status of Physicalism**  
  If non-physical properties exist, does this prove physicalism is *false*, or merely that we cannot *know* physicalism is true from the armchair?  
  *   **Physicalism is False** → **LEAF 3**  
  *   **Physicalism is Epistemically Uncertain (Ontologically Neutral)** → **LEAF 4**

  **NODE 5: The Nature of Assent**  
  Assuming physicalism holds, does Mary accept the statement *"I am experiencing red"* as a standard **belief** she holds to be true?  
  *   **NO (She has the knowledge/state but rejects the belief framework)** → **LEAF 5**  
  *   **YES (She forms a standard belief)** → Go to **Node 6**

  **NODE 6: The Mechanism of Thought**  
  To form this belief, does she need to classify the experience using a **concept/category**, or is she simply attending to the state itself directly?  
  *   **Direct Attention (No Concept Mediation)** → **LEAF 6**  
  *   **Concept Mediation Required** → Go to **Node 7**

  **NODE 7: The Concept Type**  
  If she uses a concept, is it defined by the **functional role** the state plays (what it does), or by **direct reference** to the state itself (pointing to it)?  
  *   **Functional Role** → **LEAF 7**  
  *   **Direct Reference** → **LEAF 8**

  ***

  ## The Eight Leaves (Taxonomy of Commitments)

  | Leaf | Path | Position Label | Diagnosis / Notes |
  | :--- | :--- | :--- | :--- |
  | **1** | 1-No → 2-Yes | **Physicalism via Ability Hypothesis** | Mary gains no new factual knowledge, only new abilities (to recognize, imagine). The "gap" is practical, not theoretical. |
  | **2** | 1-No → 2-No | **Eliminativism about Phenomenal Concepts** | There is no "what it is like." The simulation induces a physical state, but the notion of a phenomenal concept is mistaken. |
  | **3** | 1-Yes → 3-Yes → 4-False | **Property Dualism** | The simulation reveals a non-physical property. Physicalism is ontologically false. |
  | **4** | 1-Yes → 3-Yes → 4-Neutral | **Knowledge Dualism (Ontological Neutrality)** | An epistemic gap exists that suggests non-physical properties, but we cannot definitively rule out physicalism. |
  | **5** | 1-Yes → 3-No → 5-No | **Hybrid (Knowledge w/o Belief)** | Mary acquires phenomenal knowledge via simulation but denies it constitutes a "belief" (e.g., it is non-propositional acquaintance that resists doxastic labeling). |
  | **6** | 1-Yes → 3-No → 5-Yes → 6-Direct | **Physicalism via Acquaintance** | Mary knows the physical state via a direct relation (acquaintance). No new concept is needed, just a new relation to a known physical fact. |
  | **7** | 1-Yes → 3-No → 5-Yes → 6-Concept → 7-Functional | **[UNOCCUPIED]** | **Diagnosis:** *Incoherent.* Mary already knew all functional/physical facts *before* the simulation. Acquiring a *new* functional concept now is impossible. |
  | **8** | 1-Yes → 3-No → 5-Yes → 6-Concept → 7-Direct | **Physicalism via Phenomenal-Concept Acquisition** | Mary acquires a new demonstrative concept that refers to a physical state. The fact is old; the mode of presentation is new. |

  ***

  ## Instructor Notes & Ambiguities

  **1. The Unoccupied Leaf (Leaf 7)**  
  This position is generated logically by the tree but is philosophically vacant. If Mary knows *all physical and functional facts* prior to the simulation (as the case stipulates), she cannot acquire a *new* concept defined by functional role during the simulation. Any functional concept she forms now would be one she already possessed. Students who land here usually misunderstand the "Physical Knowledge" premise or conflate functional roles with phenomenal character.

  **2. Ambiguity: Acquaintance vs. Phenomenal Concepts (Leaf 6 vs. Leaf 8)**  
  *Flag:* Distinguishing between "Direct Attention" (Leaf 6) and "Direct Reference Concepts" (Leaf 8) is notoriously difficult.  
  *Diagnosis:* Many "Phenomenal Concept Strategists" (Leaf 8) argue that their concepts *are* partly constituted by the experience itself, making them functionally similar to Acquaintance views (Leaf 6). If a student struggles to distinguish Node 6 from Node 7, they likely hold a **Russellian Physicalist** view where the distinction between concept and acquaintance collapses.

  **3. Ambiguity: Ability vs. Eliminativism (Leaf 1 vs. Leaf 2)**  
  *Flag:* If a student answers "No Experience" at Node 2, they are an Eliminativist. However, some Ability Theorists argue that "experience" just *is* the exercise of abilities.  
  *Diagnosis:* If a student claims there is "no experience" but also claims Mary can "recognize red," press them on whether "recognition" implies a phenomenal state. If yes, they belong at Leaf 1. If no (it is purely behavioral), they belong at Leaf 2.

  **4. The Hybrid Position (Leaf 5)**  
  This leaf captures a nuanced skepticism about doxastic attitudes toward qualia. It allows students to affirm the *reality* of the simulation's effect (unlike Eliminativism) without committing to the view that qualia function as standard propositional beliefs (unlike Leaf 8). This is often a stable position for students uncomfortable with both Dualism and standard Physicalist reductions.
