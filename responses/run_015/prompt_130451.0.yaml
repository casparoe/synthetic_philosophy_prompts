          5.  Stress-test the user's suspicion (it's about irreversibility/blame avoidance, not wisdom).
          6.  Provide actionable advice: What to say/show at the next meeting to satisfy the strongest readings.
      *   **Tone:** Analytical, precise, nuanced, helpful, not verdict-heavy but menu-oriented.

  2.  **Analyze "Chesterton's Fence":**

      *   *Origin:* G.K. Chesterton, *The Thing* (1929). "There exists in such a case a certain institution or law; let us say, for the sake of simplicity, a fence or gate erected across a road. The more modern type of reformer goes gaily up to it and says, 'I don't see the use of this; let us clear it away.' To which the more intelligent type of reformer will do well to answer: 'If you don't see the use of it, I certainly won't let you clear it away. Go away and think. Then, when you can come back and tell me that you do see the use of it, I may allow you to destroy it.'"
      *   *Core Idea:* Don't remove something until you understand why it was put there.
      *   *User's Hypotheses:* Burden of proof, epistemic deference, invisible functions, function drift, coordination, irreversibility/option value, status quo bias/cost asymmetry.

  3.  **Drafting the Menu of Theses (Trivial to Ambitious):**

      *   *Thesis 1: The Burden of Proof.* (Trivial/Platitude). Don't break things without a reason.
      *   *Thesis 2: The Investigation Requirement.* (Substantive). You must actively investigate the cause before removing.
      *   *Thesis 3: Epistemic Humility/Deference.* (Substantive). The past knew something you don't. Survival implies utility.
      *   *Thesis 4: Latent Function/Complex Systems.* (Ambitious). The function isn't obvious or linear; it prevents a rare catastrophe.
      *   *Thesis 5: The Cost Asymmetry/Option Value.* (Substantive/Strategic). Removal is harder than re-installation. Keep the option open.
      *   *Thesis 6: The Infinite Regress/Status Quo Bias.* (False/Abusive). You can never know enough, so never change.

  4.  **Analyzing the Speakers (Archetypes):**

      *   *Burkean Conservative:* Focuses on Thesis 3 & 4 (Wisdom of ancestors, complex social fabric).
      *   *Rationalist Blogger:* Focuses on Thesis 2 & 5 (Bayesian updating, option value, avoiding negative black swans).
      *   *Engineer:* Focuses on Thesis 2 & 5 (Technical debt, unknown dependencies, rollback capability).
      *   *Bureaucrat/Defensive Member:* Focuses on Thesis 6 (Covering ass, avoiding blame).

  5.  **Applying to the Cases:**

