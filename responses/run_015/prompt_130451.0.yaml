      *   *Step 3: Address the Function.* (The app does the same job better).
      *   *Step 4: Address Irreversibility.* (Propose a trial, not a deletion).
      *   *Step 5: Address Blame.* (Shared responsibility/insurance).

  8.  **Refining the Output (Self-Correction/Polishing):**

      *   *Check:* Did I answer the symmetry question? (Adding vs. Removing). *Correction:* Need to explicitly mention that Chesterton's Fence is asymmetric by design (removal requires knowledge, addition requires justification).
      *   *Check:* Did I address "bad original reasons"? *Correction:* Include a note on normative vs. descriptive reasons.
      *   *Check:* Is the tone right? *Correction:* Ensure it doesn't sound like I'm telling them what to do, but giving them the analytical tools.
      *   *Check:* Ordering. *Correction:* Ensure the "Menu" flows logically from simple to complex.

  9.  **Final Review against constraints:**
