  5.  **Compare with Rule/Premise Distinction (Metalanguage):**
      *   *Standard Solution:* Distinguish between *premises* (objects in the system) and *rules of inference* (operations on the system).
      *   *Carroll's Point:* Carroll was arguably pointing out that you cannot derive an "ought" (infer this!) from an "is" (this proposition is true) without already having the "ought" (the rule).
      *   *Comparison:* The friend's fix stays in the object language. The metalanguage move steps out. The metalanguage move is the standard philosophical solution (Gilbert Ryle, etc.).

  6.  **Assess the Chapter's Grand Conclusion (Habit/Community):**
