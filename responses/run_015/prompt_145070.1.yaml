answer: |-
  Here is the breakdown of your Tolstoy summary, the vetting of your tests, the procedure you asked for, and the worked cases.

  ### Theory Check and Test Vetting
  Your summary of *What Is Art?* is accurate, including the radical conclusion that most celebrated art (including his own) fails the moral test. Tolstoy defines art strictly as the transmission of feeling from artist to receiver. If the receiver does not feel what the artist felt, it is not art. If the feeling is exclusive or divisive, it is "bad" art.

  Regarding your two proposed tests:
  1.  **The Ninth-Read Test:** This is **not Tolstoy**. Tolstoy cares about the receiver's experience, not the maker's endurance. This is a craft test for durability, not an art test for infection. It measures how well the carpentry holds up, not whether the feeling transmits.
  2.  **The Naming Test:** This **is Tolstoy**. He insists that true art eliminates the distance between minds. If three readers name the same feeling without prompting, infection has occurred. If they name the subject ("it's about grief") rather than the feeling ("I feel heavy"), it is reportage, not art. Use this one.

  ### Sincerity and Time Index
  Tolstoy requires the feeling to be present *during the act of creation*. For your program, this means the feeling must exist during the drafting of the chunk. If a student writes a scene cold and injects emotion during revision, Tolstoy would call this "effectfulness" (faking it). However, since you cannot know their internal state, you must judge by strain. If the writing feels "built" (like your Case A), it fails the sincerity proxy.

  ### The Accessibility Gate
  Tolstoy's original gate was classist and religious (Christian universalism). To keep the utility without the snobbery, you must separate *context* from *feeling*. A scene in a queer nightclub is specific context; the feeling of loneliness or joy is universal. The gate should not ask "Is this world common?" but "Is the emotion translatable?" If the dialect blocks the emotion, it fails. If the dialect carries the emotion, it passes.

  ### The Procedure (The Gates)
  Total time: 20 minutes. Read the chunk once (5 mins), then run the four gates (15 mins).

  **Gate 1: The Feeling Check**
  *   **Question:** Did I feel a specific emotion while reading this without being told what to feel?
  *   **Pass Looks Like:** You can name the feeling in one sentence (e.g., "I felt dread," not "I felt like I was in a scary house").
  *   **Rule on No:** `stop_not_art`
  *   **Time:** 3 minutes.
  *   **Kind:** `fact`

  **Gate 2: The Necessity Check**
  *   **Question:** Do the images and words feel necessary to that emotion, or do they feel like decorations?
  *   **Pass Looks Like:** Removing an image would weaken the feeling. No stock props (moonlight, doves) unless they feel fresh.
  *   **Rule on No:** `stop_bad_art`
  *   **Time:** 5 minutes.
  *   **Kind:** `mixed`

  **Gate 3: The Stranger Check**
  *   **Question:** Could someone outside this specific world understand the emotion here?
  *   **Pass Looks Like:** The emotion translates even if the setting or slang is unfamiliar.
  *   **Rule on No:** `hand_to_human`
  *   **Time:** 4 minutes.
  *   **Kind:** `mixed`

  **Gate 4: The Kindness Check**
  *   **Question:** Does this feeling bring people closer together or push them apart?
  *   **Pass Looks Like:** The feeling encourages empathy or shared humanity (brotherhood).
  *   **Rule on No:** `stop_bad_art`
  *   **Time:** 3 minutes.
  *   **Kind:** `values`

  ### Worked Cases

  **Case A (Your Showpiece)**
  *   **Result:** Stops at Gate 2.
  *   **Verdict:** `bad_art`
  *   **Reason:** It transmits feeling (Gate 1 pass), but the construction feels engineered rather than felt, relying on borrowed props.
  *   **Flip:** If you could prove you felt the emotion deeply while writing the final draft, it would pass Gate 2.

  **Case B (The Dash)**
  *   **Result:** Passes all gates.
  *   **Verdict:** `good_art`
  *   **Reason:** It transmits a specific feeling sincerely, accessibly, and empathetically.
  *   **Flip:** If the feeling was identified as exclusive to the writer's specific trauma without translation, it would stop at Gate 3.

  **Case C (The Humiliation)**
  *   **Result:** Stops at Gate 4.
  *   **Verdict:** `bad_art`
  *   **Reason:** It infects successfully, but the feeling (contempt) divides people rather than uniting them.
  *   **Flip:** If the scene shifted to make the reader feel the kid's pain rather than enjoy the cruelty, it would pass Gate 4.

  ### The Edge Case (Dead Mother's Letters)
  This breaks the procedure because Tolstoy requires the *artist's* feeling. If the writer is arranging another person's words, whose feeling is transmitted? The procedure should `hand_to_human` here. You must decide if the writer is feeling the grief *now* while arranging the letters. If they are just curating, it is reportage. If they are re-feeling the grief through the arrangement, it is art.

  ### Where It Breaks
  **Heaviest Gate:** Gate 2 (Necessity) does the most work because it distinguishes crafted writing from sincere art.
  **Worst Failure Mode:** The procedure fails on irony, pastiche, or chapters designed solely for structural setup, as these do not aim for immediate emotional infection.
  **My Call:** Tolstoy's theory cannot grade collage or found text; you must judge those by whether the writer feels the emotion *now* while assembling it.

  ```json
  {
    "gates": [
      {
