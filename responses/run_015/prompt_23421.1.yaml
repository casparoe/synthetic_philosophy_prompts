  Actually, the most compelling "Honest Treatment" comes if I acknowledge that while *Desert* dictates the severity, *Utility* dictates the possibility of return. But I must pick one as the "Grounding."
  Let's pick **Accountability/Desert**. It's safer for the University's reputation. "We are sanctioning her because she did wrong," not "We are sanctioning her because this helps us."

  Okay, ready to write. I will structure it as a formal memo. I will ensure the "Road Not Taken" section is robust. I will ensure the Advisor pressure is mentioned as context but not excuse. I will ensure the Retraction is highlighted as critical.

  *Wait, one last check:* The prompt says "A third-year PhD student...". "Draft that opinion."
  Okay, I will write it as the Committee's voice.

  *Key constraint:* "Honest treatment of the strongest case for the grounding we end up not adopting."
