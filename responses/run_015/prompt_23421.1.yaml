  *   **Sanction:** One-year suspension, mandatory ethics remediation, formal requirement to cooperate with retraction.
  *   **Grounding:** Primarily Desert (Accountability).
  *   **Alternative:** Consequentialism (Rehabilitation/Departmental interest).

  *Wait, one nuance:* If I choose Desert, does that mean expulsion? Not necessarily. Desert means "proportional response." Expulsion might be disproportionate if there was coercion. So Desert can still allow for suspension. I will clarify this.

  *Wait, another nuance:* The Dean asked to state plainly *which* grounding. I will choose **Desert/Accountability** as the primary, because relying on "best serve the department" risks the appearance of a cover-up. However, I will acknowledge that the *limits* of the sanction (i.e., not expelling forever) are informed by consequentialist hopes for rehabilitation. No, the prompt asks to pick one grounding for the *sanction*. I will pick **Desert** as the primary driver, but acknowledge the tension. Actually, the most honest approach for a university is often "Restorative Justice" which blends both. But the Dean gave a binary choice. I will choose **Desert/Integrity** because the harm is to the public record.

  *Re-evaluating the "Grounding" choice:* If I argue for a sanction that allows her to stay (eventually), am I arguing for Desert? Or Utility?
  Argument for Desert: She broke the trust, she must pay a price (suspension, mark on record).
  Argument for Utility: We keep her because she's smart and we fixed the data.
  If I recommend she be allowed to return after suspension, that is arguably Utilitarian (investing in her future).
  If I recommend Expulsion, that is arguably Desert (she broke the covenant).
  Given the advisor pressure, Expulsion feels too harsh for a first offense by a grad student who confessed. So the sanction is likely Suspension + Remediation.
  How do I ground Suspension in Desert? "The breach of trust requires a significant interruption of status."
  How do I ground it in Utility? "We pause her to train her so she doesn't do it again."
