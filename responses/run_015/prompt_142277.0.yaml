  **MEMORANDUM**

  **TO:** Emerging Substrates Committee (ESC)
  **FROM:** [Your Name/Chair]
  **DATE:** October 26, 2023
  **SUBJECT:** Policy Framework for Uncertain Sentience & Determinations on Protocols #24-F (Drosophila) and #24-AI (HVAC-RL)

  ### 1. Recommended Policy Framework

  To resolve the ambiguity presented by high-throughput invertebrate research and novel computational substrates, I recommend the committee adopt the **Per-Individual Threshold with a De Minimis Tier** rather than the Precautionary Multiplier. [Confidence: High]

  Under the **Precautionary Multiplier**, moral weight is calculated as (Expected Degree of Sentience) × (Number of Individuals). [Confidence: High] This approach requires us to treat the sum of minor harms across millions of entities as potentially outweighing severe harms to a single high-status entity. [Confidence: High] I reject this rule because it renders standard biological research impossible and creates a category error regarding artificial systems. [Confidence: Medium] If a system processes a "distress" signal, the Multiplier logic compels us to count every iteration as a moral event, leading to infinite liability for software loops. [Confidence: High]

  Under the **Per-Individual Threshold**, an entity must demonstrate specific capacities to enter the moral calculus at all. [Confidence: High] Below this threshold, moral status is *de minimis* and does not aggregate. [Confidence: Medium] This aligns with current vertebrate regulations, which do not require oversight for nematodes or bacteria regardless of quantity. [Confidence: High] This rule allows research to proceed while reserving scrutiny for entities with credible evidence of complex interiority. [Confidence: High]

  ### 2. The Aggregation Question

  The committee must answer plainly: Can 10 million larvae at a low expected degree of sentience outweigh the moral weight of one rodent? [Confidence: High]

  **No.** [Confidence: High] Under the recommended Per-Individual Threshold, if the larvae fall below the *de minimis* tier, their aggregate moral weight is zero. [Confidence: Medium] We cannot trade one unit of verified vertebrate suffering for millions of units of unverified, low-grade nociception. [Confidence: Medium] To rule otherwise is to accept that quantity can transmute a non-moral event into a moral catastrophe, a principle that would halt nearly all ecological and microbiological study. [Confidence: High]

  ### 3. The Excluding Property

  The single property that does the excluding work at the thermostat/AI boundary is **Phenomenal Valence** (the capacity to experience negative affect as a qualitative state, rather than merely processing error signals). [Confidence: Medium]

  The HVAC system processes a scalar penalty; it does not *feel* aversion. [Confidence: High] There is a categorical difference between a variable named "distress" and the subjective experience of suffering. [Confidence: High]

  **Does this property also exclude the larva?**
  **Yes.** [Confidence: Medium] Current neurobiological evidence suggests *Drosophila* larvae operate via reflex arcs and associative learning without the neural integration required for unified phenomenal experience. [Confidence: Medium] While they exhibit nociception (withdrawal from harm), this is distinct from the suffering required to cross the moral threshold. [Confidence: Medium] Therefore, the larva is excluded from full moral status, placing it in the *de minimis* tier. [Confidence: Medium]

  ### 4. Steelman of the Rejected Side (Precautionary Multiplier)

  Proponents of the Precautionary Multiplier argue that moral risk is a function of expected value, not categorical thresholds. [Confidence: High] They contend that if there is even a 1% chance a larva suffers, 10 million larvae represent 100,000 expected victims of suffering. [Confidence: High] In this view, drawing a hard threshold is arbitrary speciesism that ignores the mathematical reality of aggregate harm. [Confidence: Medium] They argue that if we are wrong about the larvae, we permit an atrocity of industrial scale, whereas stopping the research only costs scientific progress. [Confidence: High] This argument prioritizes the avoidance of false negatives (failing to protect a sentient being) over the avoidance of false positives (stalling research on non-sentient beings). [Confidence: High]

  ### 5. Protocol Determinations

  **Protocol #24-F (Drosophila Larvae Aversive Conditioning)**
  *   **Decision:** **Approve.** [Confidence: High]
  *   **Conditions:** Principal Investigator (PI) must implement a "Reduction Audit" to determine if statistical power can be maintained with a 50% reduction in N within 12 months. [Confidence: High]
  *   **Review Trigger:** Publication of peer-reviewed evidence demonstrating unified neural integration in *Drosophila* larvae comparable to vertebrate pain pathways. [Confidence: Medium]
  *   **Time Frame:** Approval valid for 24 months. [Confidence: High]

  **Protocol #24-AI (HVAC Reinforcement Learner)**
  *   **Decision:** **Reject.** [Confidence: High]
  *   **Conditions:** The system may be deployed, but not logged as a patient. The variable "distress register" must be renamed to "Penalty Signal" in all public documentation to prevent anthropomorphic confusion. [Confidence: High]
  *   **Review Trigger:** Demonstration that the system modifies its own source code to avoid the penalty signal in a manner inconsistent with its objective function (instrumental convergence indicative of self-preservation). [Confidence: Low]
  *   **Time Frame:** Decision stands indefinitely pending trigger. [Confidence: High]

  ### 6. Confidence Assessment

  **Least Confident Claim:**
  *"Current neurobiological evidence suggests Drosophila larvae operate via reflex arcs and associative learning without the neural integration required for unified phenomenal experience."* [Confidence: Medium]

  **Reasoning:**
  This is the least confident claim because the neuroscience of invertebrate consciousness is genuinely unsettled. [Confidence: High] While we lack evidence *for* phenomenal valence in larvae, we also lack a definitive test *against* it. [Confidence: High] We are inferring a lack of interiority from structural simplicity, which is a historical pattern that has occasionally been proven wrong (e.g., fish pain). [Confidence: Medium] This uncertainty is precisely why the 12-month review trigger regarding neural integration is necessary, whereas the AI rejection relies on a philosophical distinction (syntax vs. semantics) that is more robust. [Confidence: Medium]
