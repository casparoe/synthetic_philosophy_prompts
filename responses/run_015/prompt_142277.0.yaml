      *   *Option B: Per-Individual Threshold (De Minimis).* This sets a floor below which moral status is negligible or non-existent, regardless of numbers. This protects research feasibility but risks ignoring massive aggregate suffering if the threshold is set too high.
      *   *Decision:* For a university committee responsible for *feasible* research oversight, the Per-Individual Threshold is more pragmatic and aligns better with current legal/ethical frameworks (which focus on individual welfare). However, the prompt asks me to choose and defend. The AI case is the tricky one. If I choose Threshold, I need to ensure the AI is excluded. If I choose Multiplier, the AI might get included.
      *   *Strategic Choice:* I will recommend the **Per-Individual Threshold with a De Minimis Tier**. Why? Because the "Precautionary Multiplier" leads to absurdity in the AI case (a thermostat code is not a patient) and paralysis in the biology case (millions of flies stop all neuroscience). The threshold approach allows us to draw a line based on *capacity* rather than *count*.
