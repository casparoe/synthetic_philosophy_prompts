      *   *Actually, looking at the prompt:* It asks to identify the property that excludes the *thermostat*. Does that property *also* exclude the larva? If I say "Yes," then the larva protocol is easy (approve). If I say "No," then the larva has status, but the AI doesn't.
      *   *Better path:* The property is "Biological Substrate / Evolutionary Teleology." No, that's speciesist. The property is "Capacity for Suffering (Phenomenal Consciousness)." The AI lacks this entirely. The Larva *may* have it, but at a level so low it triggers the de minimis clause.
      *   *Let's try to be decisive:* I will recommend the **Per-Individual Threshold**.
