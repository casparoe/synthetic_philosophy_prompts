      *   *Critique:* If I say larvae lack phenomenal valence, that's a strong neuroscientific claim. Is it defensible? *Correction:* I should frame it as "Insufficient evidence for unified phenomenal valence," placing them in the de minimis tier by default of uncertainty + low complexity, rather than a hard "they feel nothing."
