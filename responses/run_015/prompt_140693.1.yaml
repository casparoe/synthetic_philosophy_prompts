answer: |-
  Your gut is right to be suspicious. Your brother-in-law's summary is a mix of **mid-20th-century orthodoxy**, **one-sided interpretations of live debates**, and **conflations of distinct arguments**. It reads like a summary of a specific textbook from the 1980s (perhaps influenced by Grice, Lewis, and Jackson) rather than the current state of the art.

  Here is the audit you asked for, broken down by claim.

  ### 1. The Sentence-by-Sentence Audit

  **Sentence 1:** *"There are really two different connectives hiding behind the one word 'if'."*
  *   **Verdict:** **Textbook.**
  *   **Analysis:** Almost everyone agrees there is a distinction between indicatives ("If it rains, I will stay inside") and counterfactuals/subjunctives ("If it had rained, I would have stayed inside").

  **Sentence 2:** *"The indicative conditional is just the material conditional: 'if A then C' means not-A-or-C, so it comes out true whenever A is false."*
  *   **Verdict:** **One-sided / Contested.**
  *   **Analysis:** This is the biggest red flag. This was the "orthodox" view in the mid-20th century (defended by Grice and Jackson), but it is widely rejected in contemporary philosophy of language. The problem is the "paradoxes of material implication." Under this view, "If the moon is made of cheese, then 2+2=4" is true simply because the antecedent is false. Most modern philosophers think indicatives have richer truth conditions than the material conditional. He is presenting a contested theory as a settled fact.

  **Sentence 3:** *"That's why 'if Oswald didn't kill Kennedy, someone else did' is perfectly fine as an indicative — we know he did, so it's trivially true — but terrible as a counterfactual."*
  *   **Verdict:** **Mixed.**
  *   **Analysis:** The *example* is famous (often attributed to Keith DeRose or Ernest Adams). The intuition (that the indicative sounds okay and the counterfactual sounds wrong) is standard. However, his *explanation* (that the indicative is "trivially true" *because* Oswald did kill him) relies entirely on the disputed Material Conditional claim from Sentence 2. If indicatives aren't material conditionals, the indicative isn't "trivially true" just because the antecedent is false; it's true because of the evidential connection.

  **Sentence 4:** *"The counterfactual is a different animal: you take the possible worlds closest to ours in which A is true and check whether C holds there..."*
  *   **Verdict:** **Textbook.**
  *   **Analysis:** This is the standard Stalnaker-Lewis possible worlds semantics. While there are technical disputes about "closeness," this is the dominant framework for analyzing counterfactuals.

  **Sentence 5:** *"Adams showed that how confident you should be in a conditional just is the conditional probability of C given A, full stop, and that means conditionals don't have truth conditions at all, only probabilities."*
  *   **Verdict:** **One-sided / Conflated.**
  *   **Analysis:** This is the most technically loaded sentence.
      1.  **Adams' Thesis:** The claim that $P(\text{If } A \text{ then } C) = P(C|A)$ is widely accepted as a constraint, but not universally.
      2.  **The Leap:** The claim that this *means* they have no truth conditions is a specific philosophical reaction (Expressivism/Non-cognitivism), not a logical necessity. Many philosophers try to save truth conditions despite this result (e.g., by contextualizing the probability). He presents a specific metaphysical conclusion as a mathematical proof.

  **Sentence 6:** *"So the only real puzzle left is why the two behave differently in these cases, and that's basically pragmatic — a counterfactual signals that the speaker takes the antecedent to be false, and an indicative doesn't."*
  *   **Verdict:** **One-sided / Non-sequitur.**
  *   **Analysis:** This does not follow from the previous sentences. Many linguists and philosophers argue the difference is **semantic**, not pragmatic. For example, the past tense in counterfactuals ("If Oswald *had* killed...") might actually change the meaning (modal remoteness), not just signal a speaker belief. Calling it "basically pragmatic" ignores a huge chunk of current research (e.g., work by Irene Heim, Angelika Kratzer, or Sarah Iatridou).

  ---

  ### 2. The Probability Result (Your Vague Memory)

  You are absolutely correct, and he is glossing over it.

  You are remembering **David Lewis's Triviality Results (1976)**.
  *   **The Setup:** Ernest Adams proposed that the probability of a conditional equals the conditional probability (Adams' Thesis).
  *   **The Bomb:** David Lewis proved mathematically that if conditionals express propositions (i.e., have truth conditions) *and* they obey standard probability axioms *and* they satisfy Adams' Thesis, the result is "triviality." Essentially, it implies that there can only be a very small number of possible probabilities for anything, which is absurd.
  *   **The Consequence:** To avoid triviality, you must drop one of the assumptions.
      *   **Option A (The BIL's choice):** Drop truth conditions. Conditionals aren't true or false; they are just assertions of conditional probability (Expressivism).
      *   **Option B (The Alternative):** Keep truth conditions, but deny Adams' Thesis holds universally, or argue that the probability of the conditional is context-sensitive.

  **The Audit:** Your brother-in-law presents Option A as the only logical outcome ("...and that means conditionals don't have truth conditions at all"). In reality, this is one of the biggest battlegrounds in the field. Many prominent philosophers (like Dorothy Edgington or more recently, contextualists) argue fiercely for Option B. He is presenting a "live dispute" as a "settled proof."

  ### 3. The Pragmatic Move

  Does his conclusion (that the difference is pragmatic) follow from the earlier part? **No.**

  Even if you accept his earlier premises, the conclusion that the indicative/counterfactual distinction is *pragmatic* is a separate claim.
  *   **The Pragmatic View:** The logic is the same, but using the subjunctive mood *implicates* that you think the antecedent is false (associated with H.P. Grice or Frank Jackson).
  *   **The Semantic View:** The logic is different. The subjunctive mood actually changes the semantic value of the conditional (associated with David Lewis, Robert Stalnaker, and most modern linguists).

  The BIL claims the pragmatic view is "the only real puzzle left." This is false. Most current work assumes the difference is semantic (involving tense and mood operators) because the pragmatic view struggles to explain why counterfactuals behave differently in logical embeddings (like inside "either... or" sentences).

  ### Summary for Your Conversation

  If you want to push back without starting a fight, here is the cheat sheet:

  1.  **On the Material Conditional:** "I read that the 'Material Conditional' account of indicatives is pretty controversial now because of the paradoxes of implication. Is that still the standard view in your program, or is that more of a classical position?" (This signals you know it's disputed).
  2.  **On Probability:** "I remembered something about Lewis's Triviality Results. Doesn't that just mean we have to choose between truth conditions and Adams' Thesis, rather than proving there are no truth conditions?" (This catches his conflation).
  3.  **On Pragmatics:** "Is the pragmatic explanation for the indicative/counterfactual split still dominant? I thought a lot of linguists argued the tense morphology actually changes the semantics." (This challenges his final conclusion).

  **Final Verdict:** Your brother-in-law has summarized a **specific, somewhat dated theoretical package** (Gricean pragmatics + Lewisian semantics + Expressivist probability) and presented it as **general consensus**. It is not "wrong" in the sense that these are real theories, but it is "wrong" to imply there aren't massive, unresolved fights over every single claim he made after the first sentence.
