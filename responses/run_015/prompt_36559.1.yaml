  **Reply:** *Concedo* the groundwork; I am not discovering new texts. My thesis is structural, not exegetical. Commentators note the distinction; I argue the *underdetermination* regarding authority's locus is the generative mechanism for the reception history. This explains why Bellarmine and the monarchomachs both claim Aquinas legitimately despite opposing conclusions. I am tracing the fault line that permits divergent receptions. The novelty lies in linking Aquinas's silence to the later fragmentation of Catholic political theory. It shifts the debate from "what did Aquinas say" to "why was Aquinas usable by both sides?"
  **Soft Spot:** If pressed for specific divergences from Eschmann, I risk looking derivative. Pivot to reception history immediately. Do not get bogged down in bibliography.

  **2. The Suarezian Gap (High Damage)**
  **Objection:** *Praeterea*, if private killing is illicit and public killing licit, where resides public authority during usurpation? Suarez argues it reverts to the community. You claim Aquinas is silent. Is this not an argument from silence complicit with quietism?
  **Reply:** *Distinguo*: It is not silence but scope restriction. Aquinas defines authority by office, not origin. If the office is usurped, removal requires a higher office (natural law), not necessarily popular sovereignty (positive law). He refuses to specify the mechanism because it falls under contingent political arrangement, not universal moral principle. The silence is methodological, not accidental. He leaves it to positive law because natural law does not dictate constitutional forms. To ask Aquinas to solve the constitutional question is to ask a question he deliberately bracketed.
