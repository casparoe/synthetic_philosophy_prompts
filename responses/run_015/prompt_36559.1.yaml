  **Soft Spot:** Harmonizing unfinished *De Regno* with mature ST is always risky. Avoid claiming *De Regno* is definitive on morality. Acknowledge the textual tension but prioritize the moral structure.

  **4. Prudence vs. Precept (Low Damage)**
