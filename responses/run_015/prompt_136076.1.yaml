answer: |-
  1. "The seminar deadlock"
  The seminar stalls because Hume's slogan is wielded as a conversation-stopper rather than an argument. When a student posits an external reason—such as a duty to avoid harm independent of desire—opponents invoke "reason is the slave of the passions" to imply that unmotivated agents lack reasons entirely. The slogan is being asked to perform excessive dialectical work: it must bridge the gap between a psychological claim about what moves us and a normative claim about what counts as a reason. Currently, it functions as an equivocation, treating the inability of reason to generate motivation ex nihilo as proof that no normative reason exists without prior desire.

  2. "Menu of precise readings"
  The slogan is polysemous, supporting distinct philosophical commitments that range from psychological descriptions to metaphysical assertions. To resolve the deadlock, one must isolate which commitment is being invoked.

  1. **Motivational Internalism:** *Claim:* Reason alone is causally inert and cannot produce motivation without a pre-existing desire or passion. *Domain:* Psychological claim about causal motivation. *Verdict:* Substantive and defensible. *Rationale:* Empirical psychology suggests cognition alone rarely triggers action without affective drive, though this describes mechanics, not validity. This thesis concerns the engine of action, not the map of justification. It explains why we move, not why we should. In the seminar, this reading is harmless to externalism because a reason can exist even if it fails to move a depressed agent. The slogan here describes a limitation of human psychology, not a limitation on normative truth.

  2. **Existence Internalism:** *Claim:* A consideration counts as a reason for an agent only if there is a sound deliberative route linked to their subjective motivational set. *Domain:* Normative claim about what counts as a reason. *Verdict:* Substantive and defensible (within existence internalism framework). *Rationale:* This defines reasons relative to agency but begs the question against externalists by defining reasons internally. It makes external reasons impossible by linguistic stipulation rather than metaphysical discovery. It changes the subject from normative truth to psychological accessibility. In the seminar, this reading wins the debate only by defining the opponent out of existence rather than refuting their substantive claim. It renders the debate verbal rather than substantive.

  3. **Instrumentalism:** *Claim:* Reason evaluates means efficiently but cannot validate ultimate ends, which are set by non-rational desires. *Domain:* Conceptual claim about the nature of rationality. *Verdict:* Conceptually confused. *Rationale:* This conflates instrumental rationality with substantive rationality, ignoring that ends can be rationally critiqued independently of desire. It assumes a false dichotomy between fact and value in practical deliberation. It ignores the possibility of rational error in end-selection. In the seminar, this reading fails because it cannot account for cases where agents are criticized for having bad ends, not just bad means. It reduces rationality to mere calculation.

  4. **Metaphysical Humeanism:** *Claim:* Normative properties cannot exist independently of human psychological capacities or responses. *Domain:* Metaphysical claim about normative properties. *Verdict:* Empirically false (or at least highly contentious). *Rationale:* Moral realism posits objective values existing independently of our contingent psychologies, making this a disputable metaphysical stance rather than a truism. It requires heavy argumentation not contained in the slogan. It denies the possibility of mind-independent normative facts without proof. In the seminar, this reading is too heavy a metaphysical burden to carry via a catchy slogan about passion and reason. It demands a full metaethical theory to support it.

  Collectively, these options reveal the slogan lacks a single stable meaning.

  3. "Mapping onto internal vs. external reasons"
  Motivational Internalism fails to undermine external reasons because it addresses causal efficacy, not normative standing. It commits the illicit slide by inferring that because reason cannot *move* a desire-less agent, there is no reason *for* them to act. A reason might exist normatively even if the agent is psychologically incapable of accessing it. Existence Internalism successfully blocks external reasons, but only by stipulative definition; it does not prove external reasons are impossible, merely that the term "reason" is reserved for internal states. This is a verbal victory, not a philosophical one. Instrumentalism undermines external ends only if one accepts the confused premise that rationality is purely calculative; it slides by assuming ends are arational preferences rather than evaluable commitments. If ends are evaluable, reason is not merely a slave. Metaphysical Humeanism would defeat external reasons, but the slogan offers no argument for this metaphysical constraint, merely asserting it. In every case except Existence Internalism, the student conflates the psychology of motivation with the logic of justification, treating a failure of influence as a failure of truth. This equivocation allows the slogan to seem deeper than it is. The core error is treating "ought implies can" as "ought implies is motivated." The former is plausible; the latter is not. The student assumes that if the passion is absent, the reason vanishes, rather than recognizing the passion might be missing where it ought to be present. This confusion protects the internalist view from counterexamples involving akrasia or depression.

  4. "What survives for office hours"
  Only Motivational Internalism and Existence Internalism remain credible interpretations. However, neither validates the student's sweeping refutation. Motivational Internalism is compatible with external reasons existing even if they fail to motivate. Existence Internalism denies external reasons by fiat, not argument. Therefore, the anti-external-reasons conclusion does not follow from the slogan alone; it requires additional normative premises. Instead of accepting the slogan as a refutation, you should ask the student: "Are you defining reasons strictly by their capacity to motivate, or are you arguing that a lack of motivation proves a lack of normative status?" This forces them to choose between a trivial definition or a substantive claim requiring proof, breaking the deadlock by exposing the equivocation at the heart of their objection. You should press them to explain why psychological incapacity entails normative irrelevance.
