      3. Boredom/Confusion. -> Keep rules dead simple.

      *What the activity can't do:* It can't generate *qualia*. It can't make them *feel* pain. It simulates the *structure* of the problem, not the *substance*. The User must say this.

  10. **Writing the Response:**
