      *   **Core Philosophical Problem:** The "Mapping Problem" (Multiple Realizability/Interpretation). The same physical proceedings can be described as implementing many different computations. The *selection* of the description is where the moral work happens.
      *   **Constraint:** Do not lecture. Do not use jargon (like "functionalism") until the end (if at all). Make them *feel* the hardness.
      *   **User's Draft Idea:** Make the room the system (participants as nodes passing tokens). Variants: Giant table, replication, damage/speed changes. Vote on moral consideration (beans in a cup).
