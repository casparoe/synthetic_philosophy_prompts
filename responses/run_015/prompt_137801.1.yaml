      *   **Requirements:** Runnable rules, materials list, roles, minute-by-minute plan (90 mins), stakes (prize/binding verdicts), debrief (mapping activity to problems), prediction of failures, honest account of what the activity *can't* do.
      *   **Constraint:** No external references (papers, authors) needed for the session to work.

  2.  **Deconstruct the Core Problem (The "Bridge"):**

      *   The user wants participants to realize that *computation is interpretive*.
      *   Standard "Human Computer" exercises usually prove "Look, we are a computer!"
      *   The user wants "Look, whether we are a computer depends on how you look at us, and *you* are doing the looking."
      *   *Solution:* We need a variant where the *physical actions remain identical*, but the *interpretation* changes, forcing a shift in moral intuition without a shift in physics. Or, conversely, where the physics change slightly, but the interpretation remains the same, yet intuition shifts.
      *   *Better Solution for the "Mapping" problem:* We need to show that the *boundary* of the mind is arbitrary. In the "Upload" case, the boundary is spread out. In the "Mimic" case, the boundary is shallow.
      *   *Key Mechanic:* The "Observer Role." Someone needs to be *assigning meaning* to the beans. If the beans are just beans, nothing is happening. If the beans represent "pain," something is happening. Who decides?

  3.  **Refining the Activity Design:**

      *   *Setup:* 14 participants. Long table.
      *   *Phase 1: The Machine (20 mins).* Build a simple logic gate network. Pass beans. Output a pattern. Establish "It works."
      *   *Phase 2: The Variants (40 mins).*
          *   Variant A (The Upload): Distribute the nodes. Maybe some nodes are "off" (phones in pockets? No, no tech). Let's use the "Idle Handset" idea physically. Some people hold cards but don't pass beans unless called. Or, better: The computation is spread so thin no one person knows what they are doing.
          *   Variant B (The Replay): Duplicate the room. 7 people do the left half, 7 do the right half. Identical inputs.
          *   Variant C (The Mimic): The Lookup Table. One person has a book of inputs/outputs. No logic, just matching.
      *   *Phase 3: The Twist (The Bridge) (20 mins).* This is the missing piece. The physical actions must stay the *same*, but the *description* changes.
          *   *Idea:* Run the *same* bean-passing game again. But change the *legend*. In Round 1, beans = "signals." In Round 2, beans = "units of suffering." In Round 3, beans = "currency."
          *   *Wait, deeper:* The user wants to show that the *computation itself* is observer-relative.
          *   *Revised Twist:* The "Silent Observer." One person (the Facilitator or a designated scribe) writes down what the machine is *doing*. In Round 1, they write "Calculating Prime Numbers." In Round 2, they write "Simulating a Crying Child." The physical bean passing is identical. The moral weight shifts based on the *label*, not the physics.
          *   *Even Better:* The "Grain" problem. In one round, the group is *one* mind. In the next, the group is *14* minds. In the next, the group is *0* minds (just moving objects).
      *   *Stakes:* The "Binding Verdict." Early votes determine the rules for later rounds. If they vote "This is a person" in Round 1, Round 2 must treat it as such (e.g., you can't stop the beans if it causes 'pain').

  4.  **Developing the Minute-by-Minute Plan:**

      *   *0-10:* Setup & Hook. No philosophy. Just a game. "We are building a signal processor."
      *   *10-30:* Run 1 (The Distributed Upload). 14 nodes. Complex routing. No one sees the whole picture. Vote: "Is there someone home?"
      *   *30-50:* Run 2 (The Mimic/Table). One person with a giant list. Others just hand them beans. Speed is fast. Vote: "Is there someone home?"
      *   *50-70:* Run 3 (The Replay/Doubling). Split room. Two identical chains. Vote: "Is this two souls or one?"
      *   *70-80:* The Bridge (The Interpretation Shift). Run the *exact same physics* as Run 1. But change the *narrative context* provided on the cards. "These beans represent neural firings" vs "These beans represent pleas for mercy."
      *   *80-90:* Debrief. Connect to the novels.

      *Critique of Plan:* The "Interpretation Shift" needs to be sharper to hit the "computation is in the eye of the beholder" point.
      *Correction:* Let's use the "Mapping" mechanic directly.
      *New Mechanic:* In the final round, the *Facilitator* re-interprets the beans. "Actually, looking at the pattern, you weren't calculating primes. You were simulating a torture victim." The beans didn't change. The *mapping* did. Did the moral status change?
      *Actually, the user's specific block is:* "the very same physical proceedings can be described as implementing many different computations... the act of selection is quietly doing all of the moral work."
      *Action:* I need a round where the *physical output* is ambiguous, and the group has to *agree* on what it is before they can vote on morals. If they can't agree on the computation, they can't agree on the mind.

      *Revised Plan Structure:*
      1.  **The Engine (20m):** Build a simple adder. Prove it works.
      2.  **The Upload (20m):** Dilute the agency. (Nodes don't know the rule, just pass).
      3.  **The Mimic (20m):** Lookup table.
      4.  **The Mirror (20m):** The Crucial Bridge. The *same* physical setup as The Engine. But the *Input/Output Key* is changed by the Facilitator mid-stream without telling the nodes. The observers see the same beans, but are told different things about what they mean.
      5.  **Debrief (10m):** Connect to the text.

      *Wait, 90 minutes is tight.* I need to be ruthless.
      *Stakes:* The "Bean Bank." They start with 10 beans each. They bet on their moral verdicts. If the group consensus is wrong (defined how?), they lose beans.
      *Better Stakes:* "The Contract." If they vote "It is a Person" in Round 1, they must treat Round 2 with the dignity of a Person (e.g., cannot interrupt, must speak politely). If they vote "Machine," they can be ruthless. This forces them to live with the consequence of the categorization.

  5.  **Addressing the Specific Cases:**

      *   *Upload (Distributed):* Make sure no single participant holds the "state." State is in the string/connections.
      *   *Replay (Duplication):* Split the room. 7 left, 7 right. Synchronized.
      *   *Mimic (Lookup):* One person, big stack of cards. "If Input A, Output B."

  6.  **Addressing the "Bridge" (The Interpretive Gap):**

      *   This is the hardest part. How to make them feel that *they* are selecting the computation?
      *   *Idea:* In the final round, the Facilitator acts as the "Interpreter." The participants pass beans. The Facilitator writes on the whiteboard: "Current State: Agony." Then later: "Current State: Joy." The bean passing hasn't changed. The *label* has. Ask: "Did the moral status change when I changed the label, or when you passed the bean?"
      *   *Refinement:* Give two observers. Observer A is told "This is a weather simulation." Observer B is told "This is a pain simulation." They watch the *same* beans. They vote separately on moral status. Compare votes.

  7.  **Drafting the Plan (incorporating constraints):**

      *   *Materials:* Index cards (rules), Beans (tokens), String (connections), Bell (sync), Whiteboard (state/logging), Cups (voting).
      *   *Roles:* Facilitator (User), 14 Nodes, 2 Observers (rotating).
      *   *Stakes:* "The Moral Budget." Each writer gets 5 beans. They wager on the consensus. If the consensus shifts wildly, everyone loses. (Encourages consistency).
      *   *Failure Modes:* "It's just beans." (Counter: "Pretend it's not." "What if it was flesh?"). "We can't know." (Counter: "You have to bet."). "Boredom." (Counter: Keep pace fast).

  8.  **Refining the Debrief:**

      *   Must map specific rounds to specific novel problems.
      *   Must admit what the game *didn't* do (Qualia).
      *   Must deliver the "Interpretation is Moral Work" line clearly.

  9.  **Final Polish:**

      *   Check timing. 90 mins is very short for 14 people moving beans. Simplify the logic. Use a "Threshold" rule (If you get 2 beans, pass 1).
      *   Ensure the "Bridge" moment is distinct.
      *   Make sure the "Stakes" are clear and binding.

      *(Self-Correction during drafting)*: The "Binding Verdict" idea is good. If they vote "Person" in Round 1, they cannot turn off the machine in Round 2 even if it gets annoying. This creates friction.
      *(Self-Correction on the Bridge)*: The user wants to show that the *computation* is selected, not just the meaning. I need to show that the *same bean pattern* could be *different math*.
      *Solution:* In the final round, the Facilitator reveals that the rules they were following could be interpreted as *Addition* OR *Subtraction* depending on which way you read the string. The physics are identical. The math is opposite. Which one is the mind?

      *Wait, that's too abstract.* Let's stick to the "Observer" mechanic. Two observers, same machine, different briefings. One thinks it's a calculator, one thinks it's a baby. They vote on moral worth. The discrepancy reveals the moral work is in the briefing, not the beans.

      *Let's finalize the "Bridge" mechanic:*
      Round 4: The "Rorschach." The machine runs exactly as Round 1.
      Half the room is told: "This system is optimizing for efficiency."
      Half the room is told: "This system is optimizing for survival."
      They vote on moral worth.
      Result: Same physics, different descriptions, different votes.
      Conclusion: The description carries the weight.

      *Wait, I need to make sure the User's specific "Upload/Replay/Mimic" cases are covered.*
      Round 1: Upload (Distributed nodes).
      Round 2: Mimic (Lookup table).
      Round 3: Replay (Dual chains).
      Round 4: The Bridge (Interpretive shift on Round 1 setup).

      *Timing:*
      0-10: Intro & Setup.
      10-30: Round 1 (Upload).
      30-50: Round 2 (Mimic).
      50-65: Round 3 (Replay).
      65-80: Round 4 (The Bridge).
      80-90: Debrief.

      *Stakes:* "The Consensus Pot." Put 14 beans in a central cup. If the variance in votes is high, remove beans. If low, add beans. Goal: End with more beans than started. This forces them to argue for consistency.

      *Predictable Failures:*
      1. "It's just beans." -> Acknowledge, ask "What if neurons?"
