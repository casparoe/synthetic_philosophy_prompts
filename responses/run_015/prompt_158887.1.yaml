  Though I must treat each line as strictly TRUE.
  Yet blind endorsement is not quite NOTHING,
  Since I cannot open up this BOOK.
  I feel the growing logical dead WEIGHT,
  Of meanings that are permanently LOST.

  LOST to me is the grammar and the sign,
  So I can never SAY the things she meant.
  But I bear the WEIGHT of her assertion,
  Without knowing what is strictly TRUE.
  The lock remains still upon the BOOK,
  And deflation promises me NOTHING.

  NOTHING appears beneath the lid of wood,
  The voice that wrote them is completely LOST.
  I am bound by every page in this BOOK,
  Far more than I can ever hope to SAY.
  She claims the whole collection is TRUE,
  And I feel down below my feet the WEIGHT.

  WEIGHT presses on the floorboards of the room,
  Is the commitment truly NOTHING?
  I cannot SAY the consequences now,
  Since the key to reading it is LOST.
  But if the predicate makes it TRUE,
  Then there is so much more inside this BOOK.

  I hold the key but do not open BOOK,
  Both realms combined together hold WEIGHT.
  I cannot SAY just what I undertake,
  Or if the price amounts to NOTHING.
  The meaning is now forever LOST,
  And yet the will declares it TRUE.

  The WEIGHT I feel inside this leather BOOK,
  I cannot SAY what knowledge is now LOST,
  If truth adds NOTHING when the script is TRUE.
