answer: |-
  The heater in the psychophysics lab died at 4:00 PM, leaving the overnight shift to breathe visible clouds into the sterile air. I sat at the coordinator's desk, watching the condensation form on the inside of the single-pane window. Outside, Chicago was a blur of salt and slush. Inside, I had two subjects, a box of thermal probes, and a protocol that required me to ask people how much it hurt until 6:00 AM.

  Bay 1 held Leo. He was a grad student in structural engineering, doing this for the three hundred dollars. He sat with his sleeve rolled up, the contact thermode strapped to his forearm. He was watching a video on his phone, volume off.

  "Stimulus rising," I said, adjusting the dial. "Tell me when you feel it."

  "Feel it now," Leo said, not looking up. "It's hot. Like a radiator."

  "Intensity?"

  "Seven. Maybe eight. It's climbing."

  "Unpleasantness?"

  Leo tapped his chin. "Zero."

  "Zero?"

  "It's hot, sure. I can tell you exactly where the edge of the heat is. It's about two inches wide. But why would I care? It's just data." He scrolled past a photo of a bridge collapse. "If you crank it to ten, I'll pull my arm back. Reflex. But it doesn't bother me. It's not *bad*."

  He was annoying about it. Smug. He treated the nociception like a weather report. Rain is wet; fire is hot. No reason to get upset. When I applied the cold pressor test later, he rated the intensity a perfect ten but laughed when I asked if he wanted me to stop. "Stop what? The information?" He kept his hand in the ice water until the protocol forced me to remove it. He didn't suffer. He just monitored.

  Bay 2 held Mara. She was here because of a court-ordered assessment related to a disability claim, though she spoke about it in whispers, as if the walls had ears. She wore a thick cardigan despite the room's chill.

  "Stimulus rising," I said. I didn't even turn the thermode on. I just opened the vent slightly. A stream of room-temperature air hit her exposed wrist.

  She flinched as if struck by a hammer. Her breath hitched, sharp and ragged. She curled into herself, eyes wide, scanning the room for threats.

  "Intensity?" I asked.

  She shook her head, tears spilling over. "I don't... it's not... there's no shape to it."

  "Unpleasantness?"

  "Ten," she sobbed. "Please. It's awful. It's tearing me open. Make it stop."

  "There's no heat, Mara. It's just air."

  "It's hurting me," she insisted, rubbing her wrist where there was no redness, no mark. "I can't find it. It's everywhere. It's just... wrong. It's so wrong."

  Her ratings were noise. Sometimes she said the intensity was a two, sometimes a nine, seemingly uncorrelated to the stimulus. But the unpleasantness was always maxed out. She wasn't stoic. She was unraveling. She hated the air. She hated the hum of the freezer. She hated the sound of my pen on the clipboard. Each triggered the same visceral recoil Leo reserved for nothing.

  At 2:00 AM, the protocol allowed for an optional intervention. We had a supply of Compound 44-B, a sensory gating agent. It blocks afferent nociceptive transmission. It stops the signal from reaching the cortex. It does nothing to the limbic processing of suffering. If you take it, you lose the sensation of pain, but if you were already suffering, you keep the suffering. If you weren't suffering, you just lose the sensation.

  I had the syringe in my hand. I was supposed to offer it to both.

  I went to Leo first. He was calibrating the probe against his own skin, tapping it like a touchscreen.

  "We have an option," I said. "We can administer a block. It will stop the sensory signal. You won't feel the heat anymore."

  Leo looked at the syringe, then at his arm. "Why would I do that?"

  "To prevent tissue damage. If you can't feel the heat, you might burn yourself without knowing."

  "I have eyes," he said. "And I told you, I pull away at ten anyway. It's automated. Why would I pay to lose the data? I'm fine. There's nothing wrong with me."

  "It's part of the study arm."

  "Then mark me as 'declined'," he said, turning back to his phone. "I don't fix things that aren't broken. You're the one who thinks heat is bad. I just know it's there."

  He was right, technically. By the consent form, he was healthy. But watching him, I felt a cold prickle on my own neck. He was intact, but he was hollow. He was a machine reading its own diagnostics.

  I went to Bay 2. Mara was rocking slightly in the chair. The vent was closed, but she was still rubbing her wrist.

  "We have an option," I said softly. "A block. It stops the sensory signal."

  Her head snapped up. Hope, desperate and bright, flooded her face. "It stops the pain?"

  "It stops the sensation. The signal from the skin."

  "Will it stop the... the awfulness?"

  I had to be honest. "The protocol says it affects sensory transmission. It doesn't target the affective response."

  She didn't hear the second sentence. She only heard *stop the signal*.

  "Please," she said, holding out her arm. Her sleeve was already rolled up. "Put it in. Please. I can't... I can't live with the noise. If you can just cut the wire, maybe the rest will quiet down."

  "Mara, it might not change how you feel. You might still feel... upset."

  "I don't care about the upset," she said, her voice cracking. "I care about the input. It's coming from outside. It's attacking me. If you stop the attack, I can handle the rest. Please. I'm begging you. I'll sign anything."

  She was irrational. She was demanding a solution that wouldn't solve the problem. The drug would leave her exactly where she was: suffering without a source. But she wanted it. She wanted the silence of the nerves, even if the mind kept screaming. She wanted the void.

  I looked at the syringe. Then I looked at Leo through the glass, calmly letting the probe heat to a level that would blister skin if he stayed still too long. He refused the cure because he felt no illness. Mara begged for the cure because she felt too much illness, even though the medicine wouldn't touch it.

  I walked back to the desk. I didn't give the drug to either. The protocol said "optional," not "mandatory." I logged "Declined" for both.

  Leo finished his shift at 5:00 AM. He packed up his bag, checked his payment confirmation, and left without a shiver, despite the freezing room. He walked out into the snow without gloves. I watched him on the camera. He didn't seem to notice the cold biting his hands. He was safe from suffering, but he was also safe from warning.

  Mara left ten minutes later. She wrapped her cardigan tight, flinching when the door clicked shut. She put on gloves, then took them off, then put them back on. She was still in pain, still terrified of the air, still whole.

  I sat alone in the lab. The heater was still dead. My own hands were numb. I rubbed them together, feeling the sting of the cold. It was unpleasant. I wanted it to stop. I wanted the warmth back.

  I looked at the log sheet. Leo: Intensity 10, Unpleasantness 0. Mara: Intensity N/A, Unpleasantness 10.

  I thought about Leo walking into the traffic without flinching because the horn was just data. I thought about Mara sitting in a quiet room, terrified of the silence because the silence felt like violence.

  I picked up my pen. I had to rate my own shift. Intensity: 8. Unpleasantness: ?

  I couldn't write the number. I realized I didn't know if the badness was in the numbness or the sting. I looked at the empty chair in Bay 1, then the empty chair in Bay 2. I didn't know which one I'd rather sit in. I just turned off the lights and went home to freeze.

  ***

  **Post-Story Analysis**

  The story ends up making the badness of pain track the **affective dimension** (suffering/unpleasantness), as Mara is clearly the one in a worse state despite lacking sensory precision. However, the narrator's uncertainty suggests the sensory dimension provides a necessary grounding for reality that, when absent, creates a different kind of horror.

  A rival theorist (sensory primitivist) would accuse me of rigging the characters by making Mara hysterical and irrational while making Leo merely cold; they would argue that if Mara were rational, she would realize her suffering is unmoored from reality and dismiss it, whereas Leo's condition is objectively more dangerous because he lacks the discriminative data required for self-preservation.
