answer: |-
  **Specification for a Theory of Natural Kinds**

  **Purpose and Scope**
  This document specifies the adequacy conditions for any theory of natural kinds proposed in this seminar. The purpose is dual: to provide a working scientist with a principled basis for deciding whether a proposed taxon is a genuine kind or a mere convenience, and to provide a metaphysician with an account of what is ontologically at stake in that decision. Adequacy is relative to this function. We anchor the discussion in three stylised cases: a topological phase of matter realised across diverse microstructures; a microbial taxon defined by a horizontally transferred metabolic module; and a psychiatric category defined by a biomarker profile that cross-cuts symptomatology.

  **The Requirements**
  Any adequate theory must deliver the following. Where a requirement reflects a specific philosophical commitment rather than a functional necessity, it is flagged as prejudicial.

  1.  **Inductive Potency (Non-negotiable):** The theory must explain why membership in a kind licenses inductive inferences and supports counterfactuals regarding unobserved members. In the psychiatric case, the biomarker profile must predict treatment response better than symptom clusters. If a classification does not project beyond its current instances, it is merely a list, not a kind.
  2.  **Tolerance of Multiple Realisation (Non-negotiable):** The theory cannot demand microstructural identity. In the condensed-matter case, the phase is defined by a topological invariant, not chemical composition. In the microbial case, the trait is polyphyletic. A theory requiring intrinsic microstructural essence would incorrectly rule these out as kinds, contradicting scientific practice.
  3.  **Objective Grounding (Non-negotiable):** The theory must distinguish between a kind being *useful* and a kind being *real*. In the psychiatric case, the biomarker group includes people who never present for care. If kindhood were solely a function of human interest or utility, this latent population would not belong to the kind until identified. There must be a mind-independent fact of the matter that makes the classification apt.
  4.  **Permissive Granularity (Non-negotiable):** The theory must accommodate cross-cutting taxonomies within the same domain. The topological phase is a valid kind alongside chemical kinds, despite different boundaries. The sciences do not carve at a single set of unique joints; they carve at many intersecting ones depending on the causal or structural relations of interest.
  5.  **Tolerance of Vagueness (Non-negotiable):** The theory must allow for borderline cases without collapsing. Kind boundaries are frequently interest-relative at the edges. A theory demanding sharp boundaries contradicts the reality of evolutionary continua and phase transitions.

  **Required Distinctions**
  The theory must not collapse the following distinctions:
  *   **Kind versus Property:** A property (e.g., 'being red') does not necessarily support the same inductive richness as a kind (e.g., 'ruby').
  *   **Kind versus Individual:** Kinds are repeatable; individuals are not.
  *   **Kind versus Collection:** A mere collection lacks the unifying principle that supports induction.
  *   **Name versus Referent:** The stability of the term does not guarantee the stability of the kind.

  **Verdicts on Traditional Constraints**
  Two traditional constraints require explicit verdicts here:
  *   **Intrinsic Membership:** It is **not** a genuine requirement that kind membership be intrinsic. As the microbial case shows, historical or relational properties (possession of a module acquired horizontally) can ground kindhood. The topological case similarly relies on global structural features rather than local intrinsic properties.
  *   **Unique Joints:** It is **not** a requirement that the sciences carve at unique joints. As the requirement for Permissive Granularity states, cross-cutting taxonomies are legitimate. The demand for a single hierarchy is a prejudice of reductionism, not a condition of scientific success.

  **Incompatibilities and Framing**
  There is a tension between the scientist's need for a decision procedure (which implies binary membership) and the requirement for Tolerance of Vagueness (which implies spectrum membership). This impossibility is not a discovery about kinds, but a sign that the desideratum of 'decidability' was badly framed. The theory need not provide a sharp boundary in reality; it must provide a logic for decision-making in the face of ontological vagueness. The scientist requires a rule for assertion, not a metaphysical guarantee of precision.

  **The Exclusionary Requirement**
  The single requirement that does the most work in excluding candidate theories is **Inductive Potency under Multiple Realisation**. Simple regularity theories fail because they cannot distinguish accidental generalisations from law-like projections. Microessentialist theories fail because they cannot accommodate the diverse realisers seen in the topological and microbial cases. A theory must explain *why* disparate instances behave similarly without appealing to a shared hidden essence. This is the hardest hurdle to clear.

  **Assessment of Candidate Families**
  *   **Microessentialism:** Fails Tolerance of Multiple Realisation; it cannot account for kinds lacking a common microstructure.
  *   **Homeostatic-Property-Cluster:** Fails the Condensed-Matter case; topological phases lack the causal homeostatic mechanisms required by this view.
  *   **Causal-Structuralist:** Fails nothing major, though it risks conflating causal roles with the structural invariants required in physics.
  *   **Interest-Relative Conventionalism:** Fails Objective Grounding; it cannot explain why the biomarker group predicts outcomes in untreated populations.

  This specification serves as the benchmark against which all subsequent accounts will be measured.
