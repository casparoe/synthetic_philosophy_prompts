  **OAK CREEK ACADEMY**
  **Student Conduct and Metaphysical Alignment Handbook**
  **Revised Edition 4.0 (Occasionalist Compliance)**

  **1.0 Discipline and Causal Attribution**

  1.1 **Prohibition of Causal Language**
  Pursuant to the school's metaphysical guidelines, no student action shall be recorded as the efficient cause of any subsequent event. Faculty are instructed to avoid language implying necessary connection. For example, in cases of physical altercations, Incident Reports must not state that Student A's shove *caused* Student B's broken nose. Instead, reports must stipulate that "Student A shoved Student B" was followed immediately by "Student B's nose broke." These are two distinct events created simultaneously by Divine Will, not a chain of cause and effect.

  1.2 **The Honor Code and Corrective Measures**
  Students often ask why detentions exist if their actions do not produce outcomes. In accordance with established Custom, cheating on a test does not *produce* a failing grade; rather, the act of cheating and the grade appearing on the paper are concurrent occasions. However, to maintain order, the Administration issues detentions. Please note: Detentions are not intended to *cause* better behavior in the future, as the future is not determined by the past. Instead, detentions are symbolic alignments with the Divine Habit of consequence. We punish because punishment usually follows rule-breaking, not because punishment changes the rule-breaker.

  **2.0 Attendance and Regularity**

  2.1 **Occasions of Absence**
  The Attendance Office no longer accepts "Cause of Absence" on excuse notes. Parents must list the "Occasion of Absence." Illness does not *cause* a student to stay home; rather, the sickness and the absence are paired events. Please ensure this distinction is clear to avoid administrative delays.

  2.2 **Transportation and Predictability**
  Regarding school buses: Students may observe that buses arrive at 7:15 AM daily. While there is no mechanical necessity forcing the bus to arrive, the Administration relies on the consistency of Divine Habit. We operate under the assumption that God generally maintains the regularity of combustion engines and traffic patterns. Therefore, students should still wait at the bus stop. The Science Department has reviewed this policy; they are satisfied with the predictability of the bus schedule but remain concerned that physics labs can no longer explain *why* the bus moves, only *that* it moves.

  **3.0 Frequently Asked Questions for Parents**

  **Q: If my child's actions don't cause anything, why teach them responsibility?**
  A: Responsibility is not about controlling outcomes, but about aligning one's will with the observed order of things. We teach students to act as if their choices matter, because acting consistently is part of the Divine Custom.

  **Q: Is the school safe if fire doesn't actually burn?**
  A: Safety protocols remain in place. While fire possesses no inherent power to burn cotton, it is the established Habit of God that fire coincides with burning. We do not test this Habit lightly. Please do not light matches in the library.

  **Q: Why does the Science Department seem conflicted?**
  A: The faculty appreciates that natural laws are now understood as descriptions of God's consistent habits rather than independent forces. However, they are frustrated that they can no longer claim experiments prove causation, only correlation. Lab grades will reflect this nuance.

  **Q: Will colleges accept transcripts based on this system?**
  A: Yes. Most institutions operate under similar assumptions of regularity. As long as the grades appear consistently alongside the coursework, the lack of necessary connection is rarely an issue for admissions officers.

  ***

  *By attending Oak Creek Academy, you acknowledge that while you are reading this handbook, you are not actually causing your eyes to move across the page. You are merely the occasion for the reading.*
