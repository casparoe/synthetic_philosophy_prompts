prompt: |-
  ok so my philosophy teacher is making us do a "creative response" assignment and I got al-Ghazali's occasionalism — like the thing where fire doesn't really burn the cotton, God just creates the burning when the fire touches it, and there's no necessary connection between the two, it's just a habit he's settled into. If the version in your head is sharper than mine, use that one, I prob have a detail or two off.

  What I want is a parody of my school's student handbook, written as if the administration had fully bought into occasionalism and rewrote the rules to match. Two sections — discipline and attendance — plus a short FAQ for parents at the end. Call it 600-700 words. Deadpan school-bureaucratese: numbered subsections, lots of "pursuant to" and "in accordance with." The target is the view, not al-Ghazali as a person and not my actual principal.

  I want the jokes to come from actually getting the position right, not from "haha nothing causes anything." Some stuff I'd like worked in: teachers being told they can't write that one kid's shove caused another kid's broken nose, only that the two happened together; the attendance office having to redo what a "cause of absence" even is; somebody leaning on the regularity point to keep the school running — the buses do show up every morning, so who needs necessary connections — and the science department being oddly fine with it in one way and not fine with it in another way. Then the honor code having a total meltdown, because if no student's action brings anything about, what exactly is a detention supposed to be for.

  My teacher said satire has to be fair, so where the real position actually has an answer, don't just pretend it doesn't — let the handbook squirm or overreach in a way that shows you know the answer is there. Also: no fake quotes, please don't put words in quotation marks like they're from al-Ghazali's actual book, paraphrase instead, I don't want to hand in made-up citations I can't back up. American English. And my little brother's in 8th grade, so it should still mostly make sense to him if he reads it over my shoulder.
