answer: |-
  ## Part 1: Logical Space Analysis

  Before wiring the tree, we map the logical terrain. The six target positions occupy specific regions of the possibility space defined by your nine cases. Some combinations of answers are logically incoherent, some are merely unattractive, and some leaves are indistinguishable without extra cases.

  ### 1. The Position Map
  *   **Biological/Substrate View:** Requires *No* on Case 5 (Instant Upload). Usually requires *No* on Case 2 (Crossfade) if substrate changes. Survival is tied to the specific matter.
  *   **Straight Functionalism:** Requires *Yes* on Case 5. *Yes* on Case 6 (Branching doesn't kill survival; both are you, or survival is not exclusive). *No* on Case 3 (Thinning is irrelevant if function holds).
  *   **Gradualism (Continuity View):** Requires *No* on Case 5 (Instant is death). Requires *Yes* on Case 2 (Crossfade/Gradual is survival). The *process* matters more than the *outcome*.
  *   **No-Branching (Best-Candidate):** Requires *Yes* on Case 5 (in isolation). Requires *No* on Case 6 (if a rival candidate exists, *neither* is you, or the original dies). This view collapses into Straight Functionalism if Case 6 is never triggered.
  *   **Reductionist (Degree View):** Answers "It depends" or "A matter of degree" to Case 1 (Scaling) and Case 8 (Gap). Rejects the binary premise of "survive/die."
  *   **No-Self (Eliminativist):** Rejects the presupposition of Case 5, 6, and 9. "Survival" is a linguistic error; there is only causal continuity.

  ### 2. Empty & Incoherent Nodes
  *   **Incoherent:** Accepting Case 9 (Never-Run Scan is survival) but rejecting Case 5 (Instant Upload is survival). If abstract pattern identity is sufficient, instantiation shouldn't kill it. If instantiation is required, abstract data isn't you.
  *   **Incoherent:** Accepting Case 5 (Instant) but rejecting Case 2 (Crossfade). If the end state is what matters, the smoothness of the transition cannot be a dealbreaker.
  *   **Unattractive (The "Locus" View):** Claiming Case 4 (Order) matters (e.g., "Replacing brainstem first kills you, cortex first doesn't"). This requires a theory of consciousness localized to specific hardware boundaries that functionalism denies.
  *   **Unoccupied:** The "Zombie Upload." Believing Case 5 results in a functional duplicate that lacks consciousness, but *you* survive in the biological remains (if not destroyed). This is a dualist position rarely defended in this specific context.

  ### 3. Indistinguishable Leaves (The Collapse Problem)
  *   **Functionalism vs. No-Branching Functionalism:** These two are identical on every case *except* Case 6. If a user answers "Yes" to Case 5 but never encounters Case 6 in their branch, they land on the same leaf. *Fix:* The tree must force Case 6 for anyone who passes Case 5.
  *   **Reductionist vs. No-Self:** Both may answer "No fact of the matter" to Case 5 or Case 8. The tree cannot separate them using ontology alone. *Fix:* You need a **Stakes Case**.
      *   *Extra Case Needed:* "The Punishment Case." The upload commits a crime. Do *you* (the biological originator) deserve punishment?
      *   *Reductionist:* "Partially, to the degree of psychological overlap."
      *   *No-Self:* "Punishment is a social tool, not metaphysical retribution. The question of 'desert' is empty."

  ---

  ## Part 2: The Decision Tree (10 Nodes)

  **Instructions for Users:** Answer based on your immediate intuition about the case. Do not worry about consistency yet; the tree will find your inconsistencies for you.

  **Node 1: The Instant Cut (Case 5)**
  > **Case:** Your brain is scanned at high resolution and destroyed. One instant later, an emulation starts with that exact state.
  > **Question:** Do *you* survive this procedure?
  > *   (A) Yes, I wake up in the simulation.
  > *   (B) No, I die; that is a copy.
  > *   (C) There is no fact of the matter / It is a degree of survival.
  > *   *(C leads to Node 10 for Reductionist/No-Self sorting)*

  **Node 2: The Crossfade (Case 2)**
  > *(Reached if Node 1 = B)*
  > **Case:** Instead of instant destruction, each neuron's output weight ramps down as its synthetic replacement ramps up. There is no discrete moment of swap.
  > **Question:** Does the absence of a sharp boundary save your life here, compared to Node 1?
  > *   (A) Yes, gradualness preserves identity.
  > *   (B) No, if the instant version failed, this does too.
  > *   *(A leads to Gradualism leaf)*
  > *   *(B leads to Biological/Substrate leaf)*

  **Node 3: The Branching Twin (Case 6)**
  > *(Reached if Node 1 = A)*
  > **Case:** The biological units are preserved as removed and reassembled into a working biological brain. Now there are two: the Upload and the Reassembled Biological You.
  > **Question:** Do *you* survive in the Upload?
  > *   (A) Yes, we are both me (or it doesn't matter).
  > *   (B) No, branching kills identity; neither is the original.
  > *   *(A leads to Straight Functionalism path)*
  > *   *(B leads to No-Branching path)*

  **Node 4: The Phenomenal Dip (Case 3)**
  > *(Reached if Node 1 = A or Node 3 = A)*
  > **Case:** At 40% replacement, you report experience is "thinner," colors less saturated, but functional output is perfect. Reports stop after completion.
  > **Question:** Does this temporary phenomenal dip compromise survival?
  > *   (A) No, functional match is all that matters.
  > *   (B) Yes, subjective continuity is required.
  > *   *(B leads to Phenomenal Continuity leaf)*

  **Node 5: The 99.9% Match (Case 1)**
  > *(Reached if Node 4 = A)*
  > **Case:** The synthetic units match input-output function on 99.9% of cases but diverge on rare inputs.
  > **Question:** Does this 0.1% divergence mean you die?
  > *   (A) No, perfect match isn't required.
  > *   (B) Yes, identity requires exact functional isomorphism.
  > *   *(B leads to Strict Isomorphism leaf)*

  **Node 6: The Scaling Question (Case 1 Variant)**
  > *(Reached if Node 5 = A)*
  > **Case:** As the fraction of replaced neurons grows, does the probability of your survival drop smoothly, or is it binary?
  > **Question:** Is survival a matter of degree?
  > *   (A) Yes, it scales with replacement/fidelity.
  > *   (B) No, it's all-or-nothing.
  > *   *(A leads to Reductionist leaf)*
  > *   *(B leads to Node 7)*

  **Node 7: The Gap (Case 8)**
  > *(Reached if Node 6 = B)*
  > **Case:** You are destroyed, scan stored for 200 years, then rebuilt.
  > **Question:** Does the temporal gap kill survival?
  > *   (A) No, psychological continuity is enough.
  > *   (B) Yes, spatio-temporal continuity is required.
  > *   *(B leads to Spatio-Temporal Continuity leaf)*
  > *   *(A leads to Node 8)*

  **Node 8: The Static Data (Case 9)**
  > *(Reached if Node 7 = A)*
  > **Case:** The scan exists and is complete but is never instantiated/run.
  > **Question:** Is that survival?
  > *   (A) No, instantiation/process is required.
  > *   (B) Yes, the pattern's existence is enough.
  > *   *(B leads to Platonist leaf)*
  > *   *(A leads to Node 9)*

  **Node 9: The Speed Up (Case 7)**
  > *(Reached if Node 8 = A)*
  > **Case:** The substrate runs 1000x faster (100 subjective years in 5 weeks).
  > **Question:** Is the resulting entity still *you*?
  > *   (A) Yes, time scale is irrelevant.
  > *   (B) No, temporal embedding is essential.
  > *   *(B leads to Temporal Embedding leaf)*
  > *   *(A leads to Node 10)*

  **Node 10: The Order/Anesthesia (Case 4) & Meta-Check**
  > *(Reached if Node 9 = A)*
  > **Case:** Cortex replaced first vs. Brainstem first; Awake vs. Anesthetized.
  > **Question:** Do these procedural details change the survival verdict?
  > *   (A) No, the final state determines identity. (Leads to **Straight Functionalism**)
  > *   (B) Yes, consciousness during swap matters. (Leads to **Phenomenal Continuity**)
  > *   (C) The question "Is it me?" is malformed. (Leads to **No-Self**)

  ---

  ## Part 3: Leaf Definitions & Awkward Commitments

  1.  **Biological/Substrate Dependence:** (Node 2=B). *Commitment:* You die if a single neuron is replaced by a synthetic duplicate, regardless of function. Anesthesia doesn't save you.
  2.  **Gradualism:** (Node 2=A). *Commitment:* You survive the crossfade but die in the instant scan (Node 1). Continuity of process is more important than the end state.
  3.  **Straight Functionalism:** (Node 10=A). *Commitment:* You survive Case 5, Case 6 (both twins are you), Case 8 (Gap), and Case 7 (Speed). Substrate, time, and branching are irrelevant.
  4.  **No-Branching (Best-Candidate):** (Node 3=B). *Commitment:* You survive the upload *only if* the biological original is destroyed. If both exist, *neither* is you. Survival is not transitive.
  5.  **Phenomenal Continuity:** (Node 4=B or 10=B). *Commitment:* Functional output is insufficient. If reports say experience "thinned" (Case 3) or you were unconscious during swap (Case 4), you died.
  6.  **Reductionist:** (Node 6=A). *Commitment:* "Survival" is vague. In Case 1, there is a percentage chance you survive. In Case 8, you survive "mostly."
  7.  **No-Self:** (Node 10=C). *Commitment:* There is no "you" to survive. There is only causal continuity between person-stages. The anxiety about uploading is a category error.
  8.  **Strict Isomorphism:** (Node 5=B). *Commitment:* The 0.1% divergence in Case 1 kills you. You require perfect computational identity, not just functional equivalence.
  9.  **Spatio-Temporal Continuity:** (Node 7=B). *Commitment:* You survive gradual replacement but die if turned off for 200 years (Case 8). Continuous existence in time is required.
  10. **Platonist:** (Node 8=B). *Commitment:* The static scan (Case 9) is you. Instantiation is unnecessary. (Note: This is rarely held consistently).

  ---

  ## Part 4: Indistinguishability Flags

  **1. Functionalism vs. No-Branching Functionalism**
  *   **Status:** Collapsed outside Case 6.
  *   **Fix:** The tree forces Node 3 (Branching) for anyone who accepts Node 1 (Instant Upload). This ensures the split is captured. If a user skips Node 3, they will be mislabeled as Straight Functionalism.

  **2. Reductionist vs. No-Self**
  *   **Status:** **Cannot be separated by this case list.**
  *   **Reason:** Both answer "No fact of the matter" to Node 1 and "It scales" to Node 6.
  *   **Required Extra Case:** **The Stakes Case.**
      *   *Scenario:* "The Upload commits a murder. The Biological Original is still alive (in a branching scenario). Should the Biological Original be imprisoned?"
      *   *Reductionist:* "Punishment should be proportional to psychological overlap." (Accepts the framework of desert).
      *   *No-Self:* "Punishment is forward-looking social hygiene. 'Desert' is nonsense." (Rejects the framework of desert).
  *   **Recommendation:** Add this as a "Tie-Breaker" modal for users landing on the Reductionist leaf.

  **3. Phenomenal Continuity vs. Biological Dependence**
  *   **Status:** Risk of collapse.
  *   **Reason:** Both say "No" to Instant Upload.
  *   **Fix:** Node 2 (Crossfade) separates them. Biological Dependence says "No" to Crossfade (wrong stuff). Phenomenal Continuity says "Yes" to Crossfade (right experience). Ensure users distinguish *substrate* from *experience* in Node 2 instructions.
