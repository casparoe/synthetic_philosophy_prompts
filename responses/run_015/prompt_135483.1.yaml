      *   *Refining the Ethical point:* Use the concept of "Hermeneutic Injustice" (Fricker). If the BCI forces the patient's fluid thought into rigid boxes, we silence nuances. Also, "Agency Attribution."
      *   *Refining the Counterfactual:* If meaning is distributed, a "word" isn't a node, it's a trajectory. The interface shouldn't output "I want water," it should output a probability distribution over a semantic space. The ethical norm shifts from "obeying the command" to "negotiating the need."

  5.  **Addressing Specific Prompt Requirements:**

