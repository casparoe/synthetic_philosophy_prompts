      *   **Section 3: The Non-Compositional Counterfactual.**
          *   If meaning is distributed/context-dependent (Predictive Coding/Connectionism).
          *   *Technical Change:* Move from classifiers/grammars to high-dimensional manifold alignment or latent space interpolation. No discrete "words," just vector trajectories.
          *   *Ethical Change:* Shift from "reading commands" to "interpreting tendencies." Lower confidence thresholds. Shared agency (human-in-the-loop is not just a validator but a co-constructor).
      *   **Conclusion:** Summarize. The practice is a "productive fiction" that risks becoming a "constitutive error" in clinical settings. We need epistemic humility.

