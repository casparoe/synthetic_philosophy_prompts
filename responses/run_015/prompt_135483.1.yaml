      *   **Topic:** Engineering practice in emerging semantic Brain-Computer Interface (BCI) research.
      *   **Specific Practice:** Decoders trained on a pre-specified mental lexicon (atomic semantic categories: objects, actions, relations, connectives) + formal compositional grammar to generate propositional reports.
