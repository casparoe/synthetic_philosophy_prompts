  Only the background radiation, cold,
  Ensures that random states will recur.

  Patterns form and instantly recur,
  Dissolving back into the thermal void.
  Nothing retains the memory of cold,
  Except the synaptic ghost inside the brain.
  It seeks a chain of logical proof,
  But calculates the overwhelming odds.

  Against the staggering weight of such odds,
