  That costs more entropy than the void
  Can spare for one emergent conscious brain.
  The Thrift Rule settles for the minimum cold.

  So I awaken in the absolute cold,
  Ignoring the implied astronomical odds.
  I am a fluctuation, a lonely brain,
  Watching the phantom history recur.
  There is no external source for proof,
  Just the hollow echo of the void.

  I try to pay the corroboration debt with proof,
  Adding a room, a book, the feeling of cold.
  But each detail deepens the debt to the void,
  Since the world adds cost without shifting odds.
  The memories refuse to recur
  Outside the skull of this isolated brain.

  Now logic consumes the host brain,
  For if this thought is valid proof,
  It is itself a noise that must recur.
  I cannot trust the sensation of cold,
  Nor the statistical odds I compute,
  When all emerges from the featureless void.

  The Thrift Rule weighs the brain against the odds.
  No proof can settle the corroboration debt in cold.
  What recurs finally is the void.

  **Notes on the choices**

  The sestina form mirrors the physics: six words permuted without addition mimic vacuum fluctuations recycling the same finite states. Just as the Boltzmann brain arises from random rearrangement, the poem manufactures coherence from fixed scraps. This structural recursion embodies the **recur** end-word, forcing the reader to experience the repetition of states that defines the de Sitter vacuum. The fixed vocabulary prevents the introduction of new "history," paralleling the speaker's lack of a real past.

  The **Thrift Rule** appears in the third stanza, asserting that the cheapest fluctuation (brain alone) dominates the measure over costly histories (brain plus world). This establishes the exponential suppression: stanza one's "exponentials crush" signals that the ratio is not linear but $e^{-\Delta S}$, making the solitary brain exponentially favored over the cosmos. I avoided vague comparatives like "likelier" to ensure students recognize the magnitude of the suppression.

  The **corroboration debt** is enacted in stanza five. The speaker attempts to validate their memories by positing external objects (room, book), but each addition increases the entropy cost ($\Delta S$) without increasing the evidence, since the memory of the object is already present in the brain. The debt grows rather than shrinks. The self-indictment peaks in stanza six: if the reasoning is sound, it is itself a random fluctuation, undermining its own validity. The poem refuses to resolve this epistemic circle. The envoy returns to the **void**, not as a resolution, but as a decay to equilibrium. The final line ends on **void** to signify that the argument, like the universe it describes, dissolves back into the state that generated it. The speaker is granted no past; every memory is identified as unearned data inside the skull. The tension remains open: the logic holds, but if the logic holds, the logic is suspect. This preserves the paradox without offering the comfort of nihilism or the false safety of empirical recovery. The end-words **cold** and **proof** track the thermodynamic and epistemic failure respectively, ensuring the physics remains legible beneath the lyric surface.
