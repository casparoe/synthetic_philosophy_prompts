answer: |-
  **MEMORANDUM**

  **TO:** All Clinical Staff, Department of Critical Care
  **FROM:** Office of Ethical Compliance and Causality Audit
  **DATE:** October 14, 2023
  **SUBJECT:** Policy 742-O: Operationalization of Commission vs. Omission Taxonomies

  **1.0 PURPOSE**
  This policy establishes the procedural framework for distinguishing between Active Causation (Killing) and Passive Permitting (Letting Die) within clinical workflows. To maintain accreditation, all personnel must log patient outcomes in the Moral Causation Ledger (MCL) to ensure the Intervention-Omission Ratio (IOR) remains within compliant bounds (0.4–0.6). Deviations suggesting excessive agency in mortality events will trigger an automatic Ethics Review Board inquiry.

  **2.0 CLASSIFICATION PROTOCOLS**
  2.1 **Active Intervention (Commission):** Any physical act that accelerates physiological cessation. This includes administering lethal agents or disconnecting life-support machinery via manual switch.
  2.2 **Passive Non-Action (Omission):** The withdrawal of labor or resources resulting in natural cessation. This includes failing to refill a prescription or ignoring a monitor alert.
  2.3 **Ambiguous States:** Certain actions occupy a causal gray zone. Staff must consult the Decision Matrix Appendix D before proceeding.

  **3.0 SPECIFIC EDGE CASE adjudication**
  3.1 **Ventilator Alarm Silencing:** Depressing the "mute" button is classified as a Commission against the alarm device, but an Omission regarding the patient's distress signal. Staff must log this as a Split-Entry (Code 99-S) to avoid skewing the IOR.
  3.2 **Feeding Tube Status:** A feeding tube physically present but disconnected from the pump is classified as "Latent Infrastructure." Nutrition delivery is an Omission; the presence of the tube is a Commission of hope. Staff must not remove the tube entirely, as removal converts the Omission (starvation) into a Commission (withdrawal).
  3.3 **Resource Allocation:** The Bed Allocation Committee does not cause death by withholding ICU beds. This is classified as "Distributive Omission." The death is attributed to the underlying pathology, not the scarcity of the bed, provided the Committee has filed Form 12-B (Scarcity Acknowledgement) prior to the patient's decline.

  **4.0 COMPLIANCE**
  Failure to accurately log causality may result in the reclassification of a "Let Die" event as a "Kill" event, carrying significant liability implications.

  ***

  **ATTACHMENT A: FREQUENTLY ASKED QUESTIONS (FAQ)**

  **Q1: If I walk past a patient in distress to clock out for my break, is this an Omission?**
  **A:** Yes. However, if you walk briskly, the kinetic energy may be interpreted as an Active Avoidance (Commission). Staff are advised to walk at a neutral pace when ignoring distress signals to maintain Omission status.

  **Q2: Does turning off the lights in the morgue count as harming the deceased?**
  **A:** No. The deceased are exempt from Moral Causation Ledgers. However, turning off the lights while the patient is still technically alive but comatose constitutes a Environmental Commission. Please verify vital signs before manipulating lighting controls.

  **Q3: How do we log the death of a patient on the waiting list who never entered the hospital?**
  **A:** This is a "Pre-Admission Omission." Since no physician-patient relationship was established, the causality is logged under "Systemic Gravity." No MCL entry is required, but the event should be noted in the quarterly Risk Mitigation Report to demonstrate awareness of the omission.

  **Q4: If I prescribe a painkiller that inadvertently suppresses respiration, is this Commission?**
  **A:** Only if the intent was logged as "Respiratory Suppression." If the intent was logged as "Analgesia," the respiratory failure is classified as a Foreseen Omission. Ensure the chart notes prioritize pain management over breath retention to protect the IOR.

  **Q5: Can a committee vote count as an Action?**
  **A:** A vote is a Commission of decision, but the resulting lack of resources is an Omission of care. The Committee is protected under Policy 742-O Section 3.3 provided the vote was unanimous. Dissenting votes transfer partial Commission liability to the dissenting member.

  **Approved by:**
  *Dr. Aris Thorne, Chair of Causality Audit*
  *Office of Ethical Compliance*
