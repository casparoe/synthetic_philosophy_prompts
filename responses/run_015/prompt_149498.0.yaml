      *   *Why?* Fictional norms are constitutive of a specific created world. Logical norms are constitutive of *thought itself*. You can write a story where gravity doesn't work; you can't *think* a thought where gravity doesn't work (in the same way).
      *   *Resolution:* Embrace the circularity of (7) as *virtuous* (transcendental argument) rather than vicious. Accept (1) but strengthen (2) to be about the conditions of possibility for meaning, not just "rules of a game."
