          *   Parfit asks: Is this death? No. It's like survival (twice over).
          *   Therefore, R matters, Identity doesn't.
      *   **Addressing the Reductive View Specifically:**
          *   The user thinks Reductionism equates Identity with R.
          *   Clarify: Reductionism says Identity *consists in* R + Physical Continuity + *Non-Branching*.
          *   Parfit's move: The "Non-Branching" clause is extrinsic. It depends on what happens elsewhere (e.g., did the other hemisphere survive?).
          *   Why should *what matters to me* depend on whether a duplicate exists elsewhere? It shouldn't.
          *   Therefore, the "Non-Branching" requirement (which makes R into Identity) is irrelevant to what matters.
      *   **Refining the "Triviality" Objection:**
