      *   Parfit actually argues *for* Reductionism. He doesn't think his argument *only* works against Non-Reductionism. He thinks Reductionism *reveals* that identity is not what matters because Reductionism shows identity is just a description of underlying facts (R), and sometimes those underlying facts (R) exist without the description (Identity) applying due to logical constraints (branching).
      *   So, even if you are a Reductionist, you must admit that Identity is a *one-one* relation, whereas R is a *one-many* capable relation.
      *   Therefore, they are *not* the same relation, even on the reductive view. Identity = R + Non-Branching (usually).

