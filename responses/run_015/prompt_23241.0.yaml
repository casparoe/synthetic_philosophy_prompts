answer: |-
  You have hit on one of the most subtle and frequently misunderstood aspects of Parfit's *Reasons and Persons*. Your intuition is sharp: if Reductionism is true, and Identity just *consists* in psychological continuity (plus the right cause), then distinguishing "Identity" from "Relation R" does seem like splitting hairs.

  However, the argument does not collapse, and it is not directed solely at the Non-Reductive (Further-Fact) view. Parfit is himself a Reductionist. His argument is designed to show that **even if you accept Reductionism**, you must still conclude that Identity is not what matters.

  The key to unlocking this lies in correcting one specific premise in your understanding of the Reductive View. On the standard Reductive View (which Parfit analyzes), Identity does **not** consist *just* in Psychological Continuity (Relation R). It consists in Relation R **plus a "Non-Branching" requirement.**

  Here is how R and Identity come apart even on the reductive view, and why that separation drives Parfit's conclusion.

  ### 1. The Logical Difference: One-One vs. One-Many
  The fundamental logical difference between Identity and Relation R is this:
  *   **Identity** is a **one-one relation**. If $A = B$ and $A = C$, then $B = C$. You cannot be identical to two different people at once.
  *   **Relation R** (Psychological Continuity + Right Cause) is a **one-many relation**. It is logically possible for one person to bear Relation R to two different future people.

  If Identity were simply identical to R, fission cases (like brain bisection) would result in a logical contradiction. To avoid this, Reductive theorists (like Lockeans) typically define Personal Identity as:
  $$ \text{Identity} = R + \text{Non-Branching Clause} $$

  This means you are identical to a future person only if you are psychologically continuous with them **and** no one else is.

  ### 2. The "My Division" Case (Fission)
  Parfit uses the fission case (where your brain hemispheres are transplanted into two different bodies, creating "Lefty" and "Righty") to drive a wedge between R and Identity, even for the Reductionist.

  *   **Does R hold?** Yes. You are psychologically continuous with Lefty. You are psychologically continuous with Righty.
  *   **Does Identity hold?** No. It cannot hold with both (because Lefty $\neq$ Righty). It cannot hold with just one (because there is no intrinsic difference between the two hemispheres to determine which one is "really" you).

  So, in the fission case, **R holds, but Identity does not.**

  ### 3. Why This Shows Identity Is Not What Matters
  This is where Parfit's argument bites on the Reductive View. He asks us to consider the value of survival in the fission case.

  1.  **The Intrinsic Facts:** From the inside, your relation to Lefty is exactly the same as your relation to the person in the standard Teletransporter case (where the original is destroyed). In both cases, R holds.
  2.  **The Extrinsic Fact:** The *only* difference between surviving the Teletransporter (Identity preserved) and surviving Fission (Identity lost) is an **extrinsic** fact: in Fission, there happens to be a *second* copy (Righty) existing elsewhere.
  3.  **The Intuition Pump:** Parfit argues that it is absurd to think that whether *you* survive (or whether survival matters) should depend on whether a duplicate of you exists in another room. If R holds, you have everything that is intrinsically valuable about survival. The fact that Identity fails merely because of the "Non-Branching Clause" shows that the "Non-Branching Clause" is irrelevant to value.

  Therefore, even on the Reductive View:
  *   **Identity** = R + Non-Branching.
  *   **What Matters** = R.
  *   Since Non-Branching is extrinsic and irrelevant to value, **Identity is not what matters.**

  ### 4. Addressing Your Specific Worry
  You wrote: *"If R and identity really are the same relation on the reductive view, then Parfit's conclusion that identity is not what matters looks trivially false."*

  Parfit's response would be: **They are not the same relation.**
  *   **R** is the underlying substantive relation (psychological connections).
  *   **Identity** is a logical construction we layer on top of R (R + Uniqueness).

  Parfit argues that Reductionism actually *helps* this conclusion. If you were a Non-Reductionist (believing in a Cartesian Ego), you might insist that Identity is a deep, further fact that *must* matter. But if you are a Reductionist, you admit that "Identity" is just a label we apply to certain configurations of R. Once you admit that, you can see that the label (Identity) drops off in fission cases, while the substance (R) remains.

  Since the substance remains, and we feel we survive (or gain something as good as survival), the label was never the important part.

  ### 5. Summary of the Move
  1.  **Reductionism:** Agrees there is no "further fact" of identity. Identity consists in psychological/physical continuity.
  2.  **The Catch:** To maintain the logic of identity (transitivity/uniqueness), the Reductionist must add a **non-branching requirement**.
  3.  **The Wedge:** In fission cases, R holds but Identity fails (due to branching).
  4.  **The Value Claim:** Since the presence of a second branch (Righty) shouldn't logically kill the original (you should be as happy as if you were just teleporting), the "non-branching" requirement is value-irrelevant.
  5.  **Conclusion:** Since Identity = R + Non-Branching, and Non-Branching doesn't matter, **Identity is not what matters. R is.**

  So, you weren't missing the text, but you were likely assuming that Reductionists define Identity *solely* as Psychological Continuity. Most define it as Psychological Continuity *without branching*. Parfit's genius was to show that the "without branching" clause is exactly what makes Identity fail to track what we actually care about.

  Does that help distinguish the two relations within the reductive framework?
