prompt: |-
  I host a small philosophy podcast, and this week's guest is a philosopher who defends the immateriality of the soul using Avicenna's flying man argument. For listeners who need a refresher, the argument imagines a person created all at once, fully formed, with every limb separated from the rest of the body and the whole figure suspended in the air, so that the person cannot perceive their own body or anything external at all; and yet they would still be aware of their own existence, finding their soul but none of their limbs. Draft seven interview questions that go beyond having her restate the argument. I want at least one question each on whether the self-awareness the flying man has is genuinely awareness of an immaterial soul or merely a general self-awareness a materialist could grant, on whether the argument establishes that the soul is distinct from the body or only that self-awareness is not reducible to any particular set of bodily perceptions, and on what the argument is supposed to show about the soul's immateriality in particular. For each question, add a follow-up keyed to the reply she is most likely to give.
