answer: |-
  **Q&A Prep Sheet: Kant's Integrated System**

  **1. Objection:** "Your normative integration ignores the robust statistical correlation between democracy and peace. Why discard Kant's most empirically tractable insight?"
  *   **Camp:** Political Scientists.
  *   **Idiom:** "Operationalizable variables vs. metaphysical baggage."
  *   **Damage:** Minor. Concedes data, disputes theoretical import.
  *   **Reply:** Kant rejects peace born of commercial exhaustion or fear; it must rest on public right. Empirical correlation doesn't validate normative justification.
  *   **Private Note:** Soft on policy utility. They'll ask: "Then why fund democracy promotion?" Answer: To fulfill duty, not guarantee peace. Don't let them equate effectiveness with validity.

  **2. Objection:** "Textually, doesn't the First Article establish a standalone duty independent of the Federation's success? Isn't the Federation merely aspirational?"
  *   **Camp:** Kant Scholars.
  *   **Idiom:** "Exegetical consistency across *Perpetual Peace* and *Doctrine of Right*."
  *   **Damage:** Medium. Threatens exegetical core.
  *   **Reply:** Republics exit the domestic state of nature, but internationally they remain in one. The duty is standalone, the *peace* is not.
  *   **Private Note:** Soft on *Metaphysics of Morals* distinctions. They'll push: "Show me the text binding them necessarily." Cite the state of nature analogy. If they cite *Reflexionen*, concede some evolution in Kant's thought but hold the systematic line.

  **3. Objection:** "If forcible export is banned, how do you handle rogue states committing genocide under your reading? Is non-intervention absolute?"
  *   **Camp:** Just-War/Law.
  *   **Idiom:** "Sovereignty vs. Human Rights enforcement."
  *   **Damage:** High. Moral stakes.
  *   **Reply:** Kant forbids intervention for *regime type*, not punishment for *right violations*. Humanitarian aid fits hospitality; regime change does not.
  *   **Private Note:** Soft on R2P compatibility. They'll ask: "What if hospitality requires regime change?" Deny the premise. Distinguish punishing a state from restructuring its constitution.

  **Prayer Question:** "If the Federation is voluntary and currently non-existent, isn't your integrated system practically inert, rendering Kant irrelevant to current crises?"

  **Overall Assessment:**
  *   **Confidence:** High on PolSci pushback (predictable disciplinary defense); Medium on Kant textual nuance (always debatable).
  *   **Least Sure Point:** Whether Kant allows *any* coercive enforcement of the Federation without violating sovereignty. This is the hinge between "voluntary congress" and "world republic." If pressed here, admit Kant's ambiguity but insist coercion invalidates the "pacific" nature. The risk is appearing too rigid on sovereignty when the audience wants solutions to aggression.
