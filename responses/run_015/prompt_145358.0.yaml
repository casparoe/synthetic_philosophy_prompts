      *   **Point 2: The Nature of Moral Blame (Intent vs. Record):** Distinguish between the *evidence* of guilt (the plan) and the *source* of guilt (the decision to wage aggressive war). A lack of paperwork doesn't absolve guilt; it just makes it harder to prove.
      *   **Point 3: Bureaucracy vs. Agency:** Address the "bureaucratic apparatus" point. Blaming a state isn't about who filed better; it's about who pulled the trigger. The "blank check" to Austria, the ultimatum to Belgium—these are actions, not just files.
      *   **Point 4: Collective Responsibility:** Discuss the validity of "national responsibility." Even if leadership is to blame, the state bears responsibility. However, reducing it to paperwork does indeed trivialize the normative dimension.
      *   **Conclusion:** Summarize. The reductionism in the prompt creates a straw man. Moral blame survives because it attaches to *acts of aggression*, not *archives*.

  6.  **Refining the Argument (Self-Correction during drafting):**
