answer: |-
  This is a sophisticated question that cuts to the heart of the philosophy of history, the ethics of war, and the specific historiography of World War I. It asks whether a specific historical methodology (privileging archival evidence of intent) reduces a moral judgment to a bureaucratic technicality.

  The short answer is **no**. Even if we accept your empirical premise as true (which is historically contested), attributing moral blame to Germany does not collapse into a mere judgment about record-keeping. However, your question correctly identifies a danger in **positivist historiography**: the risk of conflating the *evidence* of guilt with the *source* of guilt.

  Here is a detailed breakdown of why the normative space for responsibility remains, despite the reductionist framing.

  ### 1. The Category Error: Evidence vs. Act
  Your premise suggests that if blame is based on the existence of archived plans, then blame is assigned based on "which state's bureaucratic apparatus first rendered strategic intent into written procedure." This commits a category error.

  In legal and moral reasoning, a written plan is not the crime; it is **evidence of *mens rea* (guilty mind)**.
  *   **The Normative Act:** The moral breach in 1914 was not the *existence* of a war plan (all powers had them), but the **initiation of aggressive war** and the **violation of sovereignty** (e.g., the invasion of neutral Belgium, the "blank check" to Austria-Hungary).
  *   **The Archival Function:** The German archives (specifically the September Program and the War Council of 1912 discussions cited by Fischer) served to prove that the war was not merely a tragic slide caused by alliance systems (the "sleepwalker" thesis), but a calculated risk pursued for hegemony.

  If Germany had pursued the exact same aggressive policies but burned the documents, they would not be morally innocent; they would simply be unproven. Therefore, moral blame attaches to the **political decisions and military actions**, not the **archival survival** of the plans. The documents are the window, not the view.

  ### 2. The Historical Premise is Flawed (and why it matters)
  To fully answer the question, we must address the "If." Your premise posits that Germany had offensive plans while others had only "reactive defensive mobilization protocols." Most modern military historians reject this binary.
  *   **Offensive-Defensive Ambiguity:** France's *Plan XVII* and Russia's mobilization schedules were inherently offensive in nature. In the pre-1914 strategic environment, "defense" was often conceived as a rapid counter-offensive.
  *   **The Schlieffen Plan:** The German plan was distinct not merely because it was written down, but because it necessitated the violation of neutral territories (Belgium and Luxembourg) to function.

  If the distinction were merely "who wrote it down," your critique would hold more weight. But the distinction is **structural and geopolitical**. The German plan required active aggression against neutrals to succeed; the French and Russian plans relied on German aggression to justify their own mobilization. The moral weight lies in the **violation of international norms** (Belgian neutrality), which exists independently of the bureaucracy that recorded it.

  ### 3. Collective Responsibility vs. State Agency
  Your question asks if this leaves "no genuinely normative space for collective national responsibility." This touches on the tension between **state responsibility** and **collective guilt**.

  *   **State Responsibility:** In international relations, states are moral and legal agents. If the German *state* (Kaiser, Chancellor, General Staff) pursued an aggressive war, the *state* bears responsibility (reparations, territorial loss, political stigma). This does not require every German citizen to be morally culpable.
  *   **Collective Guilt:** The Fischer Controversy ignited because it seemed to implicate the German *people* (the *Sonderweg* or "special path" theory). If we reduce the controversy to "generals filed papers," we might exonerate the society that allowed those generals to hold power.

  However, reducing the finding to "bureaucratic procedure" actually **preserves** normative space rather than collapsing it. It shifts the blame from a metaphysical "German evil" to a tangible **failure of political control**. The normative judgment becomes: *A state is responsible when its military bureaucracy captures its foreign policy and prepares aggressive war without democratic or diplomatic constraint.* This is a robust political-moral judgment, not a mere historiographical technicality.

  ### 4. The Danger of "Document Fetishism"
  You have correctly identified a risk in the Fischer methodology, even if your conclusion about the collapse of blame is too strong. This is the risk of **documentary determinism**.
  *   If historians argue that Germany is guilty *solely* because Fischer found a memo that others didn't, then yes, history becomes a game of "who kept the receipts."
  *   Austria-Hungary, for instance, was equally eager for war but had a less efficient bureaucracy. If we blame Germany only because their archives were more thorough, we engage in a historiographical injustice.

  However, Fischer's argument was never just about the *existence* of plans. It was about the **continuity of aims**. He argued that the goals of 1914 (Mitteleuropa, colonial expansion) matched the goals of 1939. The moral blame arises from this **continuity of aggressive intent**, of which the documents are merely the trace.

  ### Conclusion
  Attributing moral blame to Germany does not collapse into a judgment about bureaucratic efficiency.
  1.  **Moral agency lies in action:** The invasion of Belgium and the provocation of Russia are the moral crimes, not the filing of the Schlieffen Plan.
  2.  **Documents are probative, not constitutive:** The archives prove intent; they do not create it.
  3.  **Normative space remains:** The responsibility lies in the relationship between the military apparatus and the political leadership. A state is morally culpable when it allows strategic imperatives to override diplomatic solutions.

  Your question serves as a vital warning against **positivist reductionism** in history. If we treat the Fischer Controversy as *only* an archival discovery, we trivialize the ethical dimensions of war. But the ethical dimensions do not vanish; they simply rest on the **substance of the decisions** revealed by the archives, not the **fact of the archives** themselves. The blame attaches to the *will to power*, not the *paper it was written on*.
