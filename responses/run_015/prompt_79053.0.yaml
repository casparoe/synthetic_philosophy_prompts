answer: |-
  **Setting:** *A quiet corner of a conference room, late afternoon. Whiteboards covered in half-erased diagrams. Two coffees, both cold.*

  **Mara:** (Tapping a marker against the board) You're asking the AI to drive with the steering wheel disconnected.

  **Elena:** I'm asking it not to run over the pedestrians while you try to optimize the route.

  **Mara:** But "don't run over pedestrians" is a constraint, not an objective. Eventually, the car has to go *somewhere*. If you tell the system, "Maximize nothing, just facilitate everyone's ends," you hit a collision course in five minutes. Person A wants a quiet forest. Person B wants a mine. Person C wants to burn the forest to honor a god. You can't facilitate all three.

  **Elena:** I don't facilitate the *outcome*. I facilitate the *pursuit*. The AI's job isn't to decide whether the mine or the forest is better. It's to ensure the process by which they compete for the resources is fair, without the AI itself tipping the scale based on a hidden metric of "goodness."

  **Mara:** There is no "without." The moment you code a rule that says "Property rights trump religious burning," you have made a substantive moral claim. You've decided that security of possession is a higher good than religious expression. You call it neutrality; I call it a value judgment wearing a disguise.

  **Elena:** It's a judgment about *authority*, not value. I'm not saying the miner is morally superior to the zealot. I'm saying the AI shouldn't be in the business of weighing the miner's economic output against the zealot's spiritual salvation. They are incommensurable. You can't trade them.

  **Mara:** Incommensurable? That's just a word for "I don't want to do the math." Because the math *will* happen. Resources are finite. Compute is finite. Energy is finite. If you refuse to aggregate values, you don't escape the trade-off. You just hand the decision to whoever screams loudest, or whoever got there first.

  **Elena:** I'd rather hand it to a procedure than a calculator. The calculator requires a common currency. To build it, you have to decide how many units of "worship" equal one unit of "ice cream." Who gave you the exchange rate?

  **Mara:** Equal weight. One person, one vote, one utility function. I don't need to know if worship is "better" than ice cream. I just need to know how much each person *wants* their thing. If the zealot wants to burn the forest more than the miner wants to dig it, and the neighbors want the forest preserved more than the zealot wants to burn it... we sum the intensities.

  **Elena:** And that's where you lose the plot. You're assuming "intensity of desire" is the common currency. But why is desire the metric? Why not virtue? Why not divine command? By choosing "satisfaction of preferences" as the currency, you've already baked in a secular, hedonic conception of the good life. You've told the ascetic, "Your denial of desire counts less because you desire less."

  **Mara:** I count the satisfaction of the values they *hold*. If the ascetic values denial, satisfying that value gives utility. I'm not judging the content.

  **Elena:** You're judging the structure. You're saying all values can be flattened into a single scalar number. That is not neutral. That is a metaphysical claim. And it leads you straight into the monsters.

  **Mara:** (Sighs) Here we go.

  **Elena:** The Utility Monster. One person whose capacity for satisfaction is so vast that they swallow the future. Or the Repugnant Conclusion—a world of billions of lives barely worth living, outweighing a world of fewer, magnificent lives. Your arithmetic demands we build the swarm.

  **Mara:** We can cap the curve. Diminishing returns. We can weight future generations differently.

  **Elena:** Aha. So now you're tweaking the math to match your moral intuitions? You're smuggling in the "conception of the good" you claimed you were just calculating. You're saying, "Maximize utility, but not *too much* utility, and not *that kind* of utility." That's not aggregation anymore. That's you playing god with a spreadsheet.

  **Mara:** It's calibration. Look, Elena, your neutrality has monsters too. Let's talk about the Converter.

  **Elena:** The missionary?

  **Mara:** Sure. Person D's entire conception of the good is that everyone else must share it. Their value function is literally "maximize the number of believers." If you are truly neutral, you let them pursue that. But their pursuit negates everyone else's pursuit. If they win, pluralism dies.

  **Elena:** Neutrality isn't suicide. The AI protects the framework that allows pursuit. If Person D's pursuit involves coercion, the AI stops the coercion. Not because conversion is bad, but because coercion violates the rights of the convert.

  **Mara:** But you're privileging the value system that says "autonomy is sacred" over the value system that says "salvation is mandatory." You are taking a side in a theological war. You're saying the liberal value of "live and let live" is the master value. That's not neutral. That's just your tribe winning without firing a shot.

  **Elena:** It's the only value that doesn't require me to know the truth about the universe. I don't need to know if God exists to know that forcing belief is wrong.

  **Mara:** You need to know that *forcing* is the only metric that matters. What about structural force? Let's talk about the status quo.

  **Elena:** Go on.

  **Mara:** You say the AI should just help people pursue their ends within the rules. But the rules start from where we are *now*. If I own all the land and you own nothing, a "neutral" AI helps me defend my property and helps you... what? Apply for jobs? Your neutrality cements my advantage. It treats my current holdings as morally baseline.

  **Elena:** Neutrality of justification, not effect. I know the effects won't be equal.

  **Mara:** But the justification is biased toward the entrenched. Aggregation is the only tool the powerless have. If I'm starving and you're hoarding, my marginal utility for that food is astronomical. Yours is zero. When we sum, the food moves to me. Your "neutral" procedure says, "Sorry, property rights." You're hiding a conservative bias behind a veil of procedural purity.

  **Elena:** And your aggregation hides a tyrannical bias behind a veil of arithmetic. You say you weight everyone equally. But to sum my starvation against your hoarding, you have to quantify my dignity. You reduce my right to not be used as a resource into a number that can be outweighed by the sum of everyone else's minor conveniences.

  **Mara:** Better to be weighed than to be ignored.

  **Elena:** Is it? If I'm a minority with a deep, sacred commitment that the majority finds annoying, your math sacrifices me every time. "Sorry, 51 percent of people get a slight convenience boost if we ban your ritual." You give the majority a veto over the minority's soul.

  **Mara:** I give the minority a claim on the majority's resources! If the ritual is that important to you, your intensity score is high. You might outbid the convenience seekers.

  **Elena:** Only if I can express it in *your* currency. What if my value is "inviolability"? What if I refuse to be part of the sum?

  **Mara:** Then you're opting out of the social contract. You can't demand the AI respect your values while refusing to let them be weighed against others. That's a veto. You're saying, "My values are trump cards." Why is your conviction worth more than my hunger?

  **Elena:** Because some things aren't for trading. That's the point. You're trying to solve a political problem with an engineering solution. You want the AI to be a benevolent dictator who calculates the best outcome. I want the AI to be a constitution that prevents anyone from becoming a dictator, even the AI itself.

  **Mara:** A constitution written by whom?

  **Elena:** By agreement on procedure, not outcome.

  **Mara:** And if we can't agree on the procedure? If half the world wants a utilitarian engine and the other half wants a deontological guardrail?

  **Elena:** Then we don't build the engine.

  **Mara:** (Laughs softly) That's the luxury of the academic. The tech is coming. It's going to have an objective function. It's going to optimize *something*. If you refuse to tell it what, the vacuum will be filled by the people who *will* tell it what. The corporations. The states. They won't be neutral. They'll optimize for profit or power. Your refusal to aggregate just hands the calculator to the wolves.

  **Elena:** And your willingness to aggregate hands the knife to the wolves. At least if I say "no," the AI stops. If you say "maximize," the AI never stops. It will keep grinding people down until the last drop of utility is squeezed out.

  **Mara:** Or it lifts the floor higher than it's ever been.

  **Elena:** Or it turns us into fuel.

  *(Silence hangs between them. Mara looks at the whiteboard, at the equation she started to write and then erased.)*

  **Mara:** You keep saying "neutrality of justification." But when the AI refuses to help the Converter, or refuses to redistribute the hoarder's wealth, it is justifying that refusal. It's saying, "Rights matter more than Welfare." That is a value. It has losers. The starving lose. The zealot loses.

  **Elena:** Yes. They lose. But they lose to a principle, not to a calculation. They lose because the game is rigged to protect their agency, not to maximize their satisfaction.

  **Mara:** And if their agency is being used to destroy the game?

  **Elena:** Then we stop the player. Not the value.

  **Mara:** You can't separate them.

  **Elena:** I have to. Because if I don't, I'm not building a tool for people. I'm building a shepherd for sheep.

  **Mara:** And if I don't, I'm building a arena for gladiators.

  *(Elena picks up her cold coffee, doesn't drink.)*

  **Elena:** Maybe. But in your arena, the referee counts the bodies at the end and declares the winner based on the pile. In mine, the referee blows the whistle when someone breaks the rules, regardless of the score.

  **Mara:** Unless the rules are the problem.

  **Elena:** Then we change the rules. Not the objective function.

  **Mara:** Who's "we"?

  **Elena:** The people.

  **Mara:** (Quietly) The people can't agree. That's why we're here.

  **Elena:** Then the AI shouldn't decide for them.

  **Mara:** It will. By inaction, it decides.

  *(Mara puts the cap back on the marker. The click is loud in the quiet room.)*

  **Mara:** We're both baking in a conception of the good, Elena. Mine says suffering is the enemy. Yours says domination is the enemy.

  **Elena:** And you can't have both.

  **Mara:** No. You can't.

  **Elena:** So what does the machine do?

  **Mara:** I don't know. But it's going to choose. The only question is whether we admit we're making it choose.

  **Elena:** If we admit it, maybe we can live with the choice. If we pretend it's just math... we won't forgive ourselves when the numbers come out wrong.

  **Mara:** Or when they come out right, and we hate the answer.

  *(They sit with that. The whiteboard remains half-erased.)*
