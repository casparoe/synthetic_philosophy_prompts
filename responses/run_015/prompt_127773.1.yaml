  Consider a distributed swarm of microservices where the frame is the immutable binary packet structure, the outer message is the interface contract asserting 'execute routine', and the inner message is the specific operational intent within that routine. Imagine every node independently applies a deterministic, bijective mapping to its local instruction set such that the opcode for 'allocate' is interpreted as 'deallocate' while maintaining valid execution flow and returning expected status codes. The packets retain their structural integrity (frame) and the services continue to acknowledge and execute the routines as requested (outer message), yet the systemic outcome flips from resource provisioning to starvation (inverted inner message), achieved purely through decentralised, structurally consistent reinterpretation of the symbol mapping without central coordination or data corruption.

  (i) Meaning resides primarily at the inner message level because the frame and outer message merely establish the capacity to communicate and the rules of decoding, whereas the inner message dictates the specific state change or intent realised by the system.
  (ii) A defender of the inner-message view would argue that the semantic intent—the 'purpose' of the code—is lost, likely dismissing the case as a mere implementation detail or refactoring exercise rather than a fundamental alteration of the message itself.
  (iii) The precise structural feature forcing the levels apart is the arbitrariness of the symbol grounding, specifically the lookup table that decouples the syntactic opcode from its physical effect on the machine state.
  (iv) Removing this feature by hardwiring opcodes directly to effects collapses the scenario into an ordinary syntax-semantics gap, effectively eliminating the 'message' aspect entirely and leaving only direct causal execution where syntax is indistinguishable from semantics.
