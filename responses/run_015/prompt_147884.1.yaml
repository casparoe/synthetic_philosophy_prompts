prompt: |-
  Hey, I've been going down a rabbit hole about whether the brain is literally a computer or if that's just a lazy metaphor that stuck around since the 50s. I was skimming some embodied cognition stuff and ran into this idea called morphological computation — basically the claim that a lot of the "work" we attribute to the brain is actually done by the body and environment, like how a spider's web acts as part of its cognitive system. That made me wonder: if computation is supposed to be this medium-independent, funcitonal thing, but neural dynamics are analog, noisy, and deeply coupled to the body, then is saying "the brain computes" actually saying anything substantive? Or is it just like saying "the brain processes informtion" but with extra jargan?

  Can you explain the conceptual gap between treating computation as a mechanistic description of neural dynamics versus treating it as a functional-level gloss that could apply to anything? I'd like the answer as exactly five numbered points, each just a sentence or two, with no intro or conclusion. Don't bother with citations — just lay out the logic for someone who already knows the basic computationalist debate but wants to see where the cracks are.
