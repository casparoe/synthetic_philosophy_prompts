answer: |-
  This is a classic category error, and your scientific instinct to demand operational definitions is exactly the right tool to dissect it. In immunology, if you confuse a descriptive marker (CD4+) with a functional mechanism (T-cell helper activity), your experiment fails. In literary criticism, confusing an empirical observation with a normative command leads to people storming out of book clubs.

  The slogan "All art is propaganda" is often treated as a universal law of aesthetics, but logically, it fractures into at least four distinct claims. Only one of them actually supports your book club member's argument, and even that one relies on a specific ethical framework rather than a factual observation.

  Here is the menu of claims, ranked from empirically robust to logically dubious, along with an analysis of whether they justify judging the author's character choices by political utility.

  ### 1. The Sociological Claim (Reception Theory)
  *   **The Thesis:** Art is never received in a vacuum. Once released into the public sphere, especially art by members of marginalized groups, it is *inevitably interpreted* through a political lens by the audience, regardless of the artist's intent.
  *   **Logical Type:** Empirical/Sociological prediction.
  *   **Plausibility:** **High.** There is substantial evidence that audiences read works by minority authors as representative of their entire group in a way they do not for dominant-group authors. (e.g., A white author's unlikable character is an individual; a Black author's unlikable character is often read as a statement on Blackness).
  *   **Does it support the member's argument?** **Partially.** It validates the *premise* that political effects will happen whether the author wants them or not. However, it does not logically lead to the *conclusion* that the art should be *judged* by those effects. (Just because a car emits exhaust doesn't mean the only metric for a good car is its emissions; it still has to drive well.)
  *   **Verdict:** True, but insufficient to mandate political criteria for aesthetic judgment.

  ### 2. The Normative Claim (Ethical Imperative)
  *   **The Thesis:** Artists from oppressed groups have a moral obligation to prioritize political utility over other aesthetic values (like ambiguity, complexity, or "art for art's sake").
  *   **Logical Type:** Normative/Ethical command.
  *   **Plausibility:** **Contested.** This is a moral stance, not a fact. It is coherent within certain ethical frameworks (e.g., utilitarianism applied to social justice), but it conflicts with others (e.g., autonomy of the artist, or the value of truth-telling over comfort).
  *   **Does it support the member's argument?** **Yes, directly.** This is exactly what your book club member was asserting: that the *criterion of value* is political effect. If you accept this premise, then unsympathetic characters are "bad art" if they hinder the struggle, regardless of their psychological realism.
  *   **Verdict:** This is the engine of her argument, but it is a value judgment, not a discoverable truth. It cannot be proven, only debated.

  ### 3. The Definitional Claim (Essentialism)
  *   **The Thesis:** The definition of "art" inherently includes persuasive intent. If a work does not advance a cause, it is not "art," it is merely decoration or entertainment.
  *   **Logical Type:** Semantic/Stipulative.
  *   **Plausibility:** **Low.** This contradicts the historical and functional usage of the word "art," which encompasses non-persuasive works (landscapes, abstract music, etc.). It renders the word "propaganda" redundant.
  *   **Does it support the member's argument?** **Yes, but destructively.** If art *is* propaganda by definition, then judging it by political effect is tautological. However, this definition excludes too much to be useful in a general discussion.
  *   **Verdict:** Logically lazy. It shuts down discussion by redefining terms rather than engaging with the work.

  ### 4. The Causal Claim (Efficacy)
  *   **The Thesis:** Art reliably produces specific political outcomes (e.g., sympathetic characters increase social equality; unsympathetic characters reinforce prejudice).
  *   **Logical Type:** Empirical/Causal prediction.
  *   **Plausibility:** **Low/Unfalsifiable.** Social science suggests the relationship between media consumption and attitude change is complex, bidirectional, and often weak. There is little evidence that a single novel significantly moves the needle on structural racism one way or the other.
  *   **Does it support the member's argument?** **No.** If the causal link is weak, then judging the art by its political effects is like judging a vaccine by whether the patient immediately feels happier. It assigns responsibility to the artist for outcomes they cannot control.
  *   **Verdict:** Scientifically shaky. This is the weakest link in the "propaganda" argument.

  ---

  ### The Du Bois Context: A Case of Citation Drift

  You asked specifically about the historical context, and your instincts are correct: the slogan is almost always stripped of its experimental conditions.

  Du Bois made this argument in his 1926 speech **"Criteria of Negro Art,"** published in *The Crisis*. The full context is crucial. He was speaking during the Harlem Renaissance to a specific audience: Black artists navigating a white publishing industry that demanded stereotypes or ignored Black life entirely.

  The famous line is: *"I do not care a damn for any art that is not used for propaganda. But I do not care when the propaganda becomes merely art and nothing else."*

  However, the universalizing sentence usually quoted—*"Thus all Art is propaganda and ever must be"*—appears in a paragraph where Du Bois is discussing the specific position of the Negro. He argues that because Black people are fighting for basic recognition of their humanity, they cannot afford the luxury of "art for art's sake" in the way white artists might.

  **Two critical nuances often lost:**
  1.  **He was not demanding caricature.** Du Bois explicitly argued against "bad" propaganda (stereotypes designed to please white audiences). He wanted *truth*. He believed that showing the full, complex humanity of Black people (which includes flaws) was the best propaganda against the lie of inferiority.
  2.  **He valued Beauty.** Du Bois did not say "Politics is the only metric." He argued that Truth, Goodness, and Beauty are the triad of art, but for the Black artist, Truth and Goodness (justice) are prerequisites for Beauty to be recognized by the world.

  **The Category Error:** Your book club member is taking a **situational imperative** (Black artists in 1926 USA must fight for recognition) and turning it into a **universal ontology** (All art by oppressed people is always and only a political tool).

  ### How to Bring This Back to the Lab (Book Club)

  If you want to restore peace without conceding the point, you might suggest that the group is conflating **mechanism** with **metric**.

  1.  **Acknowledge the Mechanism (Claim 1):** Agree that the book *will* be read politically. The author cannot control the reception. In that sense, the art *functions* as propaganda in the wild.
  2.  **Challenge the Metric (Claim 2 & 4):** Ask whether political utility is the *only* metric for success.
      *   *The Scientist's Question:* "If we judge this novel solely by its short-term political utility, do we risk falsifying the data?"
      *   *The Argument:* If Black characters are only allowed to be sympathetic to serve the "struggle," they become caricatures. Caricatures are easily dismissed by opponents as propaganda. Therefore, **psychological realism (even when unsympathetic) might be more effective long-term propaganda than sanitized virtue.**
      *   *Du Bois's Support:* You can actually cite Du Bois here. He hated art that lied about Black life to make white people comfortable. He might have argued that an unsympathetic Black character, if *true*, serves the cause of recognition better than a saintly one.

  **Summary for the Group:**
  The slogan "All art is propaganda" is being used as a **Normative Claim** (artists *ought* to serve justice) disguised as an **Empirical Fact** (art *does* serve justice).
  *   If it's a fact, it's shaky (art doesn't always change minds).
  *   If it's a moral rule, it's debatable (does art owe a debt to the struggle?).
  *   If it's Du Bois's historical point, it was about *truth-telling* as a weapon, not *image management*.

  You can tell your club that demanding "sympathetic characters" for political reasons might actually violate the Du Boisian imperative, which prioritized *human complexity* over *political palatability*. That might be the bridge that brings the philistine and the formalist back to the table.
