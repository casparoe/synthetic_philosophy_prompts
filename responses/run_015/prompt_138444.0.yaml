  Happiness is fundamentally an internal occupation, not an external endowment, though I grant you that starvation silences philosophy faster than reason can answer it. It requires little effort to confuse the container for the content, yet the seamstress cannot read Newton but can still find sovereign pleasure in the mastery of her craft so long as she does not foolishly depend on her master's praise for her worth. As for your charge of contradiction regarding illusions, you conflate scientific error with necessary self-deception; I fight prejudice because it enslaves the understanding to falsehoods, but I preserve illusions because they cushion the heart against the brutal indifference of the universe. It is not inconsistent to demand truth from nature while granting mercy to oneself, for the former liberates us from superstition while the latter liberates us from despair. Ultimately, relying on lovers or public opinion is a wager where fortune holds all the cards, whereas the mind's own labor is the only property fortune cannot seize.
