prompt: |-
  You're a professional philosopher specializing in normative ethics and decision theory, with particular familiarity with indirect normativity and idealized deliberation. Before you answer, take a breath and do a quick brainstorm—list the key tensions, then organize them. I need this in American English.

  Write me the joint statement for an adversarial collaboration that never happened but should have, between two camps: the Indirect Normativists (IN) and the Substantive Deliberationists (SD). IN holds that practical norms apply to decision procedures, not to actions directly—an action is right iff it issues from a properly calibrated ideal deliberative architecture. SD holds that ideal deliberation is just an epistemic tool for revealing direct normative facts; the authority is always direct, and calling it "indirect" is a category mistake.

  They've argued for years but keep talking past eachother, partly because of a niche framing I want baked in: the encrypted indexical thesis. The claim is that when you idealize an agent—stripping away specific time, place, and cognitive limits—you don't actually erase the first-person present-tense indexical. Instead you bury it inside the procedural constraints, like a hidden parameter. One camp thinks this encryption destroys the indirectness; the other thinks it saves it.

  Draft the document both could sign. Structure it like this:
  - A numbered section of agreed claims: formal properties of idealization, what indirect normativity actually asserts, what the encrypted indexical thesis means, and what both sides accept about modal stress-testing (coherence checks across counterfactual belief revisions).
  - A disagreements table: IN's view and SD's view, each phrased in wording that side would actually accept.
  - The cruxes: at least two—probably (1) whether procedural authority survives once you decrypt the hidden indexical, and (2) whether ideal deliberation without modal stress-testing is even conceptually coherent.
  - For each crux: a concrete case or argument both agree bears on it, and each side's predicted outcome or verdict on that case.

  Don't include bibliographies, reading lists, or citations—this needs to work for a model with no web access. Don't cite obscure papers or specific dates I can't verify. Get into the weeds, keep it casual (a typo or two is totally fine), and make sure neither side sounds like a strawman.
