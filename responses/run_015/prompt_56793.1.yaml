answer: |-
  ### Verdict: The Set Is Incoherent

  You cannot defend these five principles jointly. They contain two fatal contradictions and one partial misunderstanding. The set fails because **Principle 2 (Full Kelly)** and **Principle 4 (One-Shot EV)** violate the physical and logical constraints imposed by **Principle 3 (Absolute Floor)** and **Principle 1 (Ergodicity)**.

  Your colleagues in (5) are half-right and half-wrong, but their objection is secondary to the internal contradictions in your own rules.

  Here is the audit, ranked by severity.

  ---

  ### Tension 1: Principle 2 (Full Kelly) vs. Principle 3 (Absolute Floor)
  **Severity: Fatal (Mathematical Impossibility)**

  *   **The Conflict:** You state in P3 that *no policy* is acceptable if it carries *any nonzero probability* of dropping below your floor. You state in P2 that you stake the *full Kelly fraction* on repeatable bets.
  *   **Why it breaks:** Full Kelly on a volatile asset implies a log-normal distribution of wealth outcomes. In any continuous or high-frequency discrete process, the probability of hitting a lower barrier (your floor) before a distant horizon is strictly non-zero, even with Kelly betting. The only way to make the probability of breaching a floor *exactly zero* is to segregate the floor amount into risk-free assets and only apply Kelly to the surplus. If you apply Full Kelly to the *total* portfolio (as implied by "stake... on my portfolio"), you mathematically guarantee a nonzero probability of ruin (breaching the floor).
  *   **What has to give:** **Principle 2.** You cannot Full Kelly the total portfolio.
  *   **Cheapest Revision:** Rewrite P2 to: *"I stake the full Kelly fraction computed on the **surplus capital above the floor**, not total net worth."*
  *   **Cost:** This lowers your expected geometric growth rate. As your wealth approaches the floor, your risky exposure drops to zero. You sacrifice upside velocity for survival certainty.

  ### Tension 2: Principle 1 (Ergodicity) vs. Principle 4 (One-Shot EV)
  **Severity: Critical (Philosophical Contradiction)**

  *   **The Conflict:** In P1, you argue that wealth is a multiplicative process and ensemble averages (Expected Value) are a fiction. In P4, you treat a 40% net worth bet as a "one-shot" and maximize Expected Value ($E[W]$).
  *   **Why it breaks:** If the proceeds (or losses) from the "one-shot" are reinvested in the same portfolio (as you specified), the bet is **not one-shot**. It is the first step in a multiplicative trajectory. Losing 40% of your net worth reduces the base for all future compounding. Under ergodicity economics, you should never maximize arithmetic mean on a material portion of your capital base, because the geometric drag of a loss outweighs the arithmetic gain of a win.
      *   *Concrete Math:* On your 1.2-to-1 coin flip, Full Kelly (Log growth) suggests a stake of ~8.3%. You propose 40%. This is ~5x Kelly. While the Expected Value is positive, the Expected *Log* Wealth is likely negative or severely compromised. You are voluntarily accepting volatility drag that P1 claims you should avoid.
  *   **What has to give:** **Principle 4.** It is inconsistent with P1.
  *   **Cheapest Revision:** Rewrite P4 to: *"For non-repeatable opportunities, I evaluate by Expected **Log** Wealth if the stake is material to my portfolio."*
  *   **Cost:** You will reject many "positive EV" bets that are too volatile. Your stake on the coin flip example drops from 40% to ~8%. You lose the "upside lottery ticket" potential that EV maximization offers.

  ### Tension 3: Principle 5 (Horizon/Draws) vs. Colleagues' Objections
  **Severity: Moderate (Nuanced Error)**

  *   **The Conflict:** Colleagues claim finite horizon requires de-risking and donations lower optimal stake.
  *   **Analysis:**
      *   *Horizon:* They are **wrong**. With Log utility (P1), the optimal risky fraction is myopic; it does not depend on the time horizon. You do not need to de-risk simply because 25 years are ending, *provided* you have no specific liability at year 25 other than the floor.
      *   *Donations:* They are **right**, but for the wrong reason. A 10% annual draw acts as a negative drift. It does not mechanically lower the *fractional* Kelly stake, but it drastically increases the probability of hitting your **Floor (P3)**. To satisfy P3 with a 10% drain, you must hold a larger risk-free buffer, which effectively reduces the capital available for Kelly betting.
  *   **What has to give:** Your dismissal of the donation objection.
  *   **Cheapest Revision:** Acknowledge that the 10% draw tightens the P3 constraint, forcing a larger risk-free reserve.
  *   **Cost:** Reduced capital efficiency. You must hold more cash/bonds to ensure the 10% can be paid without breaching the floor during a drawdown.

  ---

  ### Final Directive

  You asked for a verdict, not a menu. To make this system defensible, you must **rewrite Principle 2 and Principle 4.**

  1.  **Rewrite Principle 2:** You cannot claim to respect an Absolute Floor (P3) while Full Kelly-ing the total portfolio. Change P2 to apply **Full Kelly only to the surplus above the floor**. This resolves the mathematical impossibility of Tension 1.
  2.  **Rewrite Principle 4:** You cannot claim Ergodicity (P1) while maximizing Expected Value on 40% of your net worth. Change P4 to apply **Log-Utility (Kelly) criteria to any bet material to your capital base**. This resolves the philosophical hypocrisy of Tension 2.

  **The Cost:** You will grow your wealth slower than your current principles suggest. You will take smaller bets. You will hold more cash. But you will remain solvent, consistent, and alive.
