      *   If the hedonic range is flattened, is it flattened *up* (everyone is blissed out) or *down* (everyone is numb)? The prompt implies "abolish suffering," so presumably flattened *up* to a neutral-positive baseline, but without peaks of relief (since relief requires prior pain).
