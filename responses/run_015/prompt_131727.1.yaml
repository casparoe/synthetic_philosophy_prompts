          *   Why Fatal: It makes the goal physically/phenomenologically impossible. You end up with zombies, not happy people.

      *   *Fatal 2: The Moral Recognition Deficit.*
          *   Argument: We understand others' pain via simulation (mirror neurons, empathy). If my architecture for registering "badness" is gone, I literally cannot comprehend your distress. I see you screaming, but it registers as "neutral."
          *   Why Fatal: It destroys social cohesion and the very concept of "care" which underpins the imperative itself. Why abolish suffering if you can't recognize it as a value?

