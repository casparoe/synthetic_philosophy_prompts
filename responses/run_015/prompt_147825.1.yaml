answer: |-
  You have not just been nerd-sniped; you have independently rediscovered one of the most famous thought experiments in the philosophy of mind. You are describing the **Orwellian vs. Stalinesque** distinction, formulated by Daniel Dennett in the context of the **Color Phi Phenomenon**.

  There is no single noun (like "apophenia") that captures the *dispute structure* itself, but the phenomenon you are tracking has a well-established coordinate in the literature. Here is the carving you asked for, including the nearest neighbors, the differences, and the edge cases.

  ### 1. The Established Concept: Orwellian vs. Stalinesque

  In his 1991 book *Consciousness Explained*, Dennett uses the exact example you started with (the Color Phi phenomenon) to illustrate a trap in how we think about consciousness.

  *   **The Stalinesque Option (Your "Later"):** The brain waits for all the data (Red, then Green) before constructing the conscious experience. The experience is fabricated *before* it enters the "theater" of consciousness. Like a show trial where the verdict is decided before the defendant enters the room.
  *   **The Orwellian Option (Your "Earlier"):** The brain consciously experiences the Red dot, but then the memory is revised *after* the fact to include the motion and color change. Like a history book being rewritten after the event.

  **The Verdict:** Dennett's famous conclusion is that **the distinction is illusory.** He argues that presupposing there *must* be a specific moment when the experience "becomes conscious" assumes a "Cartesian Theater"—a single place and time where it all comes together. If you reject the Theater (via his **Multiple Drafts Model**), the question "When did it *really* happen?" loses its meaning.

  **Why this fits your observation:**
  *   **Examples:** Color Phi and Dreams are the two canonical examples Dennett uses.
  *   **Indistinguishability:** Dennett explicitly argues that no third-person measurement or first-person report can distinguish them.
  *   **The Heat:** You noted people "pick a side and get quite heated." Dennett's entire project is explaining *why* they do this (because of the deep intuition of the Cartesian Theater) and arguing that they shouldn't.

  ### 2. Why Your "Word" Search Came Up Empty

  You couldn't find a word because the philosophical consensus (following Dennett) is that **there is no fact of the matter.** Therefore, there is no name for the *fact* you are trying to point at.

  However, you are interested in the *structure of the disagreement* itself, specifically where two parties insist there *is* a fact despite the lack of evidence. For this, we need to look at the nearest neighbors and how your case differs.

  #### Neighbor A: Underdetermination of Theory by Data
  *   **The Fit:** Two hypotheses agree on all evidence.
  *   **The Difference:** Underdetermination usually applies to **general laws** (e.g., Newtonian vs. Relativistic physics at low speeds). Your case is about a **token event** (a specific dot flash at $T_1$).
  *   **The Crucial Divergence:** In standard underdetermination, the rational response is **suspension of judgment**. In your observed dispute, the response is **dogmatic realism**. Participants insist one *must* be true. This makes it a **Metaphysical Realism Dispute** rather than a scientific underdetermination problem.

  #### Neighbor B: Verificationism
  *   **The Fit:** The stance that "if no evidence distinguishes them, they are the same meaning."
  *   **The Difference:** Verificationism is the *dissolution* of the problem (Dennett's stance). You are describing the **resistance** to verificationism. The participants are **Phenomenal Realists about Temporal Location.** They believe the "date stamp" is a real property of the experience, independent of our ability to verify it.

  #### Neighbor C: Merely Verbal Dispute
  *   **The Fit:** Everyone agrees on the physics, disagrees on the label.
  *   **The Difference:** As you noted, they agree on the definition of "when." They disagree on the **ontology**. One side believes consciousness is a **process** (extended in time); the other believes it is an **event** (point-like). They aren't arguing about words; they are arguing about the shape of reality.

  ### 3. A Proposed Term: "Phenomenal Dating Standoff"

  Since no single word exists for the *dispute structure* (because the field largely accepts Dennett's dissolution), I propose the term **Phenomenal Dating Standoff**.

  **Definition:** A dispute regarding the temporal location of a conscious episode where:
  1.  **Empirical Equivalence:** All behavioral, neural, and introspective reports are identical under both hypotheses.
  2.  **Token Specificity:** The dispute concerns specific dated events, not general laws.
  3.  **Realist Intransigence:** Participants reject verificationism and insist on a truth value despite the lack of truth conditions.

  ### 4. The Scaling Behavior and the "Tell"

  You noted: *"Option (a) quietly multiplies conscious experiences, option (b) still has exactly one... That scaling behavior feels like the actual tell."*

  This is the **Cartesian Theater Tell**.
  *   **Option A (Earlier/Orwellian)** requires a "finish line" for every stimulus. If you flash 100 dots, the brain must consciously register 100 dots and then edit 99 of them. This implies a massive, hidden bureaucracy of consciousness that is immediately erased.
  *   **Option B (Later/Stalinesque)** implies a "buffer." Consciousness only happens when the buffer is processed.

  **Why it's a tell:** It reveals that both sides are secretly assuming consciousness is a **singular stream**. If you adopt Dennett's **Multiple Drafts** view, the scaling problem vanishes. There isn't "one experience" or "100 experiences." There are various neural discriminations occurring at different times, some of which become available for reporting later. The "scaling" only looks problematic if you insist on counting "Conscious Experiences" as discrete, countable atoms.

  ### 5. The Asymmetric Alarm

  You asked: *"Why the alarm is completely asymmetric."*

  *   **The "Earlier" Camp (Orwellian):** They are bothered by the "Later" view because it violates the **Immediacy Intuition**. If consciousness is delayed until the second flash, then when I think I am seeing the red dot *now*, I am actually remembering it from 200ms ago. This suggests we never live in the "present." To them, this is a *reductio ad absurdum* of the "Later" theory.
  *   **The "Later" Camp (Stalinesque):** They are not bothered because they accept **Neural Lag** as a brute fact. We know vision takes ~100ms to process. They view the "Immediacy Intuition" as a user-illusion. The alarm is asymmetric because one side treats "Present Awareness" as a metaphysical requirement, and the other treats it as a functional output.

  ### 6. The Edge Case: The Interrupted Trial

  You asked: *"Is a case where the later process is interrupted... inside the phenomenon or outside it?"*

  This is the **Counterfactual Dependence Test**. It is the only way to pry the two options apart, though it still requires a metaphysical leap.

  *   **Scenario:** Flash Red. Prepare to flash Green. Abort the trial before Green flashes.
  *   **Option A (Earlier):** The subject consciously saw a stationary Red dot. (Experience occurred at $T_1$).
  *   **Option B (Later):** The brain waited for the Green dot. It never came. After a timeout, the brain renders a "Stationary Red Dot" experience at $T_{timeout}$. (Experience occurred at $T_2$).

  **Is this inside the phenomenon?**
  **Yes.** This is the critical boundary case.
  *   If you believe the experience happened at $T_1$, you believe the **physical stimulus** caused the experience directly.
  *   If you believe the experience happened at $T_{timeout}$, you believe the **absence of a second stimulus** caused the experience.

  **Why it matters:** In Option B, the *content* of the experience (Stationary Red) is identical, but its **causal history** is different.
  *   In Option A, the experience exists *before* the abort decision.
  *   In Option B, the experience *depends* on the abort decision.

  This reveals that the dispute is not actually about "when" in the sense of clock time. It is about **Counterfactual Dependence**.
  *   **Earlier Realists** claim: Experience $E$ does not depend on future stimulus $S_2$.
  *   **Later Realists** claim: Experience $E$ depends on the *absence* of future stimulus $S_2$.

  Since we cannot ask the subject "Did your experience depend on the future?" without them interpreting the question through their own theory, the standoff remains. But this edge case proves the dispute is about **Causal Architecture**, not just "date stamping."

  ### Summary

  1.  **Name:** You are looking at the **Orwellian vs. Stalinesque** distinction regarding the **Color Phi Phenomenon**.
  2.  **Dispute Type:** **Phenomenal Dating Standoff** (My coinage for your specific structural description).
  3.  **Core Conflict:** **Metaphysical Realism about Temporal Location** vs. **Verificationism/Dissolution**.
  4.  **The Tell:** The scaling behavior reveals a hidden commitment to the **Cartesian Theater** (consciousness as a singular, countable stream).
  5.  **Edge Case:** The Interrupted Trial shifts the dispute from "Time" to **"Counterfactual Dependence."**

  You have correctly identified that this is not a scientific question (data won't solve it) but a **metaphysical commitment** about the nature of "now." The heat comes from the fact that one side feels the other is denying the reality of the present moment, while the other feels the first side is denying the reality of neural processing time.
