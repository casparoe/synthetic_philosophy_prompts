prompt: |-
  I am preparing a podcast interview with a philosopher who defends a specifically Camusian argument against capital punishment—one that treats the death penalty not primarily as a violation of human rights or as an ineffective deterrent, but as an ontological contradiction within modern statecraft. On this view, the state's calculated, ritualized execution of a condemned person asserts an absolute, final sovereignty over human existence that is incompatible with the absurd awareness of human limits and with the logic of revolt developed in The Rebel. The guest contends that Camus's essay Reflections on the Guillotine should be read as an extension of this logic: the guillotine is not merely cruel but bureaucratically rationalized violence, an attempt to impose definitive meaning on life that mirrors the totalitarian pretensions Camus elsewhere condemns.

  Please draft eight to ten interview questions that press directly on the content of this position. The sequence should include:

  - A question that forces the guest to distinguish this ontological-contradiction framing from standard liberal or consequentialist objections to the death penalty, with a follow-up keyed to the likely reply that the view collapses into a general anarchist suspicion of all state coercion.

  - A question on Camus's distinction between legitimate revolt (which may involve killing) and illegitimate historical murder, asking specifically whether capital punishment is best understood as a disguised form of historical murder; include a follow-up anticipating the answer that execution is precisely the kind of calculated, rationalized violence condemned in The Rebel.

  - A question on the administrative and mechanical ritual of execution—the schedule, the witnesses, the instrument itself—and whether the mechanization of killing is essential to the absurdity or merely contingent; follow up by asking whether modern lethal injection, which conceals violence behind medical procedure, intensifies the contradiction or inadvertently resolves it by removing the spectacle.

  - A question on the implications for life imprisonment without parole: if the core problem is the state's claim to absolute finality over a life, does indefinite detention avoid that logic, or does it reproduce the same sovereignty through temporal extension?

  - At least two additional questions that anticipate common objections—such as the charge that Camus was politically inconsistent, or that the philosophy of the absurd provides no determinate political conclusions—and that include follow-ups designed to make the standard deflection harder to deploy.

  The questions should avoid generic biographical or career-oriented prompts, should not ask for bibliographies or reading lists, and should assume the interviewee will defend the view as articulated above.
