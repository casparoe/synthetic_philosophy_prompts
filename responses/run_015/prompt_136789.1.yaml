answer: |-
  Good morning, everyone. It's genuinely an honor to kick off this symposium. Looking around the room, I see a split that doesn't happen every day: half of you spend your nights watching brainwaves and monitoring REM cycles, and the other half spend your nights arguing about whether those brainwaves constitute a "self" having an "experience."

  Usually, those two groups don't talk much. The clinicians need data; the philosophers need concepts. But today, I want to suggest that the concepts are actually part of the data. Specifically, I want to talk about the very first question you ask a patient when they wake up in the lab.

  We usually ask something like, "What did you experience during sleep?" or "What happened in the dream?"

  It sounds neutral. It sounds like we're just retrieving a file. But philosophically, that question smuggles in an answer. It assumes that sleep is a theater where events play out, and waking up is just walking into the lobby to tell us what movie you saw. It treats the dream report as a memory of an observation.

  But there's a tension here that's been buzzing in my recent coursework, and I think it matters for your work. On one side, you have the mid-century view, largely associated with Norman Malcolm, which suggests that dream reports are what philosophers call "avowals." Basically, there is no criterion for being wrong about a dream. If you say you dreamed it, you did. But that makes the "experience" part tricky. It's not necessarily that you *saw* something; it's that you are now committed to a story.

  On the other side, you have Daniel Dennett. Now, if you've read the intro texts, you've probably heard the caricature of Dennett's view. There's a persistent rumor that he claims dreams don't happen at all—that the brain is empty during sleep and we just fabricate everything upon waking. That isn't his view. He doesn't say nothing happens. He argues that the *narrative* is constructed, often retroactively, as the brain boots up. He calls it the "cassette model" misconception: people think he says we don't record the tape. He says we might record the tape, but we edit the script while we're playing it back.

  So, here's the rub for this room. If Dennett is even partially right—that dreams are narratives constructed upon waking rather than literal events lived through in real-time—then asking "What did you experience?" might be leading the witness. It pressures the patient to treat a construction as a memory.

  Why does this matter for the clinicians here? Especially those working with trauma?

  If a patient comes in with nightmares rooted in PTSD, treating the dream report as a literal replay of neural events can reinforce the trauma. It validates the fear that the brain is literally re-living the event every night. But if we shift the frame—even slightly—toward the idea that the dream is a narrative construction, a story the brain is telling to make sense of noise... well, that changes the therapeutic leverage.

  It doesn't mean the pain isn't real. It doesn't mean the physiology isn't firing. But it suggests that the *story* of the dream might be malleable in a way that a recorded event isn't. If the dream is a narrative we build, then we can participate in editing it.

  I'm not standing here to tell you how to run your lab or conduct therapy. I know clinicians have to ask something. You can't say, "Tell me your constructed narrative." That's not helpful at 7 AM.

  But I am suggesting that we don't need to solve the metaphysics of consciousness to acknowledge that the *frame* matters. When we listen to a dream report, are we listening to a witness testimony, or are we listening to a creative writing sample generated by a sleeping brain?

  Maybe it's both. Maybe the truth lies in the tension itself. The philosophers in this room can help clarify the questions so the clinicians don't accidentally assume answers. And the clinicians can show the philosophers that these aren't just abstract puzzles—they're the stuff of real human suffering and healing.

  So, as we move into the panels, I invite you to hold that tension. When you hear a paper on REM activity, ask what kind of "experience" that activity supports. When you hear a paper on phenomenology, ask how that fits with the physiology.

  Let's make sure we're not just talking past each other. Let's figure out what we're actually asking when we ask, "What did you dream?"

  Thank you, and welcome to the symposium.
