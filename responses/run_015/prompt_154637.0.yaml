answer: |-
  Here is the exam package. I have kept the case study intact but formalized the language for the student handout. I have also included a note on the terminology at the end.

  ***

  # Part 1: The Exam Question
  **Course:** PHIL 405: Philosophy of Biology
  **Assessment:** Final Examination (Essay Component)
  **Time:** 60 Minutes
  **Marks:** 20

  **Question 1**

  Consider a population of burrowing rodents possessing a bony ridge above the eye.
  1.  **History:** The ridge was originally shaped by natural selection to deflect the strike of a specific predator. That predator vanished from the range 8,000 years ago. The ridge no longer performs this defensive role.
  2.  **Current Utility:** The ridge now channels groundwater toward the corner of the eye, preventing the cornea from drying out. This aids vision and survival.
  3.  **Current Selection:** The population has been small and isolated for the last few hundred generations. Estimates suggest the reproductive advantage conferred by the channeling is small relative to genetic drift. It has likely not been effectively visible to selection during this period. Two loss-of-function mutants appeared recently and disappeared, but plausibly by chance rather than selection.

  A philosopher argues that this trait exhibits **"vestigial momentum"**: it retains an *origin-selected function* (defense) but lacks a *maintenance-selected function* (lubrication), because the new benefit has not yet fed back into differential reproduction.

  **Write an essay addressing the following:**

  (A) Evaluate the "vestigial momentum" claim. Does the Etiological Account of function require the *original* selection episode, *any* past episode, or *ongoing* selection? If the Etiological Account requires ongoing selection to maintain function status, does it collapse into the Causal-Role Account in the limit? (10 marks)

  (B) Imagine a lab-built organism of this species engineered to have an identical ridge, but whose lineage never possessed the trait. It channels water perfectly. Does the disagreement over whether this ridge has a "function" show that the two accounts are answering different questions, or is theoretical pluralism merely a shrug? (5 marks)

  (C) Your friend argues that we must decide what function-talk is *for*: explaining why the trait is there, what it does now, or when it is malfunctioning. She claims the Causal-Role account cannot account for malfunction without smuggling in a norm it isn't entitled to. Explain this objection and evaluate its strength. (5 marks)

  ***

  # Part 2: Model Answer
  *(Approx. 720 words)*

  The rodent case exposes a temporal fissure in the Etiological Account (EA). The EA defines a trait's function as the effect for which it was naturally selected. In the standard view, the ridge's function is defense, because that is its selection history. The "vestigial momentum" hypothesis challenges this by distinguishing *origin* from *maintenance*. If functions require only historical selection, the ridge functions for defense despite the predator's absence. If functions require *ongoing* selection (maintenance), the ridge currently has no etiological function, as drift dominates the new benefit.

  This distinction matters because if EA requires ongoing selection, it risks collapsing into the Causal-Role (CR) Account. The CR Account identifies function with a trait's current causal contribution to a system's capacity (e.g., channeling water). If EA demands that selection be currently active to sustain function status, then "selected for" effectively means "currently contributing to fitness." This erodes EA's main advantage: its ability to distinguish between a trait's *function* and its merely *beneficial effects*. To avoid collapse, EA must insist that historical selection establishes a normative status that persists even when selection pressures lapse or change. Thus, the ridge retains the function of defense (historical) while having the causal role of lubrication (current). "Vestigial momentum" is therefore a misnomer; it is simply the persistence of etiological norms beyond their selective context.

  The lab-built organism clarifies whether this persistence is meaningful. The EA must say the engineered ridge has no function, only causal roles, because it lacks a selection history. The CR account says it has a function (lubrication) because it contributes to the organism's viability. This is not merely a shrug or verbal dispute; it reveals that the accounts answer different explanatory questions. EA answers "Why is this trait here?" (historical explanation). CR answers "How does this organism work?" (mechanistic explanation). Pluralism is justified because biological inquiry requires both history and mechanism. However, if we treat "function" as a single natural kind, one account must fail. Given that we intuitively ascribe functions to artifacts (which have history of design) and traits alike, a hybrid view suggests function requires *some* history, but not necessarily natural selection.

  This leads to the normativity objection. Function talk is often used to identify malfunction. If a ridge fails to channel water, we say it is broken. The CR account struggles here. If function is defined by what a trait *does* contribute, a broken trait that *cannot* contribute has no function. Consequently, it cannot malfunction; it simply lacks a function. To call it "broken" implies it *ought* to do something it isn't doing. The CR account has no resources to generate this "ought" from the "is" of current causal powers. It must smuggle in a norm, perhaps by referencing the typical performance of other organisms. But why is the typical performance normative?

  The EA handles malfunction naturally. The function is what the trait was selected to do. A trait can fail to perform its function and still retain the function (a heart that doesn't pump is still malfunctioning, not non-functional). The norm is grounded in historical success conditions. Therefore, while the CR account is superior for describing current systemic capacity (as in the lab organism), the EA is superior for grounding biological norms and malfunction. The "vestigial momentum" case shows that EA's reliance on history is a feature, not a bug: it allows functions to persist as norms even when current utility drifts. The rodent's ridge functions for defense (EA) even if it usefully lubricates (CR), and it would be a malfunctioning ridge if it failed to defend (were the predator present), regardless of its lubrication success.

  ***

  # Part 3: Marking Scheme (20 Marks)

  **General Note:** This question rewards structural clarity over "correct" allegiance. Students may defend the Causal-Role account against the malfunction objection, provided they acknowledge the cost (importing norms). "Vestigial momentum" is not standard terminology; treat it as a defined term for this exam.

  ### Section A: The Rodent Case & The Collapse Worry (10 Marks)

  *   **5 Marks: Etiological Time-Slice Analysis**
      *   **Must Hit:** Explicitly state whether EA requires original, past, or ongoing selection.
      *   **A Grade:** Identifies that requiring *ongoing* selection threatens to collapse EA into CR (since current selection tracks current contribution). Argues EA must rely on *historical* selection to maintain distinctness.
      *   **B Grade:** Correctly identifies the tension but fails to articulate the "collapse" mechanism clearly.
      *   **C Grade:** Treats EA as simply "history" without addressing the *maintenance* vs. *origin* distinction.
      *   *Common Error:* Claiming EA automatically updates to the new function once it becomes beneficial (ignores the drift constraint in the prompt).

  *   **5 Marks: Evaluating "Vestigial Momentum"**
      *   **Must Hit:** Take a stance on whether the ridge has a function (defense), a new function (lubrication), or neither.
      *   **A Grade:** Recognizes "vestigial momentum" as the persistence of historical norms. Argues that under EA, the function remains defense (or becomes none if history is erased), while lubrication is merely a beneficial effect.
      *   **B Grade:** Accepts the friend's terminology without analyzing its philosophical cost.
      *   **C Grade:** Confuses "beneficial effect" with "function" without justification.
      *   *Alternative Full Credit:* Defending the view that functions *do* require maintenance selection, provided they explain how this avoids collapsing into CR (e.g., by appealing to statistical propensity rather than token contribution).

  ### Section B: The Lab Organism & Pluralism (5 Marks)

  *   **Must Hit:** Distinguish between historical explanation (Why is it there?) and mechanistic explanation (How does it work?).
  *   **A Grade:** Argues pluralism is a *resolution* because biology needs both explanations. Acknowledges that if "function" is univocal, one account fails.
      *   *Common Error:* Dismissing the lab case as "unnatural" and therefore irrelevant.
  *   **B Grade:** States the accounts differ but calls it a "verbal dispute" or "shrug" without analyzing the explanatory goals.
  *   **C Grade:** Claims the lab organism proves one account definitively wrong.

  ### Section C: Malfunction & Normativity (5 Marks)

  *   **Must Hit:** Explain why CR struggles with malfunction (if function = what it does, a broken trait has no function).
  *   **A Grade:** Clearly articulates that EA grounds the "ought" in historical success conditions, whereas CR must import norms from outside (e.g., statistical typicality).
      *   *Common Error:* Claiming CR can handle malfunction simply by saying "it usually does this" without explaining where the *normativity* of "usually" comes from.
  *   **B Grade:** Identifies the problem but offers a vague solution for CR.
  *   **C Grade:** Ignores the normativity constraint; focuses only on survival value.

  ***

  # TA-to-TA Notes (For your eyes only)

  **1. On "Vestigial Momentum"**
  Your friend has coined this term. It is not standard philosophy of biology jargon. It maps loosely onto discussions of **phylogenetic inertia** or the distinction between **adaptation** (selected for) and **aptation** (useful for). In the literature (e.g., Godfrey-Smith, Neander), this specific scenario is often used to argue for the **Selected Effects (Etiological)** account because it preserves the intuition that the trait is *for* defense even if it's no longer doing it. If a student writes "This is just exaptation," give them credit only if they note that exaptation usually implies the new role *has* been selected for, whereas your case stipulates drift dominates.

  **2. On the "Collapse" Argument**
  The crux of your argument (Section A) is the strongest philosophical move here. If EA says "You need selection *now* to have a function *now*," it becomes indistinguishable from CR (which says "You need utility *now*"). To save EA, you must argue that history creates a *normative status* that outlasts the selection pressure. The model answer takes this line. If a student argues the opposite (that functions *should* update instantly to current utility), they can still get an A if they acknowledge they are effectively adopting a CR account or a "Propensity" view, and they address the malfunction problem that comes with it.

  **3. On Malfunction (The Friend's Point)**
  Your friend is channeling Larry Wright or Ruth Millikan here. The point is: **Normativity.**
  *   **CR:** "The function of the heart is to pump." -> "This heart isn't pumping." -> "Therefore, this heart has no function." (We lose the ability to say it's *broken*).
  *   **EA:** "The function of the heart is to pump (because ancestors did)." -> "This heart isn't pumping." -> "Therefore, this heart is malfunctioning." (We keep the norm).
  The model answer spells this out. If a student defends CR, they need to explain how we get "brokenness" without history (usually by appealing to the design of the system or statistical norms).

  **4. Grading Curve**
  *   **17-20 (A):** Navigates the collapse worry; treats pluralism as explanatory rather than evasive; nails the normativity objection.
  *   **13-16 (B):** Gets the definitions right; applies them to the case; misses the deeper implication of the "ongoing selection" collapse or the source of norms.
  *   **09-12 (C):** Lists definitions; applies them mechanically; ignores the specific constraints of the prompt (drift, lab case).
