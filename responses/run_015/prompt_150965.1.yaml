answer: |-
  You have identified a sophisticated and pervasive failure mode in analytic philosophy and bioethics. While there is no single, canonical term that captures every nuance of your description, the phenomenon sits at the intersection of several established critiques. The closest existing frameworks are **Kathleen Wilkes' critique of thought experiments** (specifically in *Real People*, 1988), **Charles Stevenson's "Persuasive Definitions,"** and the cognitive science concept of **"Attribute Substitution"** (Kahneman).

  However, none of these fully capture the specific mechanism you described: the transfer of a verdict via verbal labeling while suppressing the *criteria of individuation* that make the verdict possible in the fiction but impossible in reality.

  Given the precision of your analysis, I propose the term **Sortal Smuggling** (or alternatively, **Ontological Smuggling**) to name this specific failure mode. Below, I define this term, distinguish it from related concepts, and address whether it is a correctable bias or an inevitable feature of modal reasoning.

  ### 1. The Proposed Term: Sortal Smuggling

  **Definition:** *Sortal Smuggling* occurs when a thought experiment establishes a verdict based on a specific principle of individuation (a "sortal" concept) appropriate to the fictional context, and then transfers that verdict to a real-world case under the same verbal label, while silently replacing the real-world principle of individuation with the fictional one.

  **Why "Sortal"?**
  In metaphysics (following David Wiggins), a **sortal** is a term that not only classifies an object (e.g., "person," "ship," "statue") but supplies the **principle of individuation** for it. It tells you *what counts* as the same object over time.
  *   For a *ship*, the principle might be functional/structural continuity (Ship of Theseus).
  *   For a *person*, the principle might be biological continuity, psychological continuity, or legal status.

  **The Mechanism of the Smuggle:**
  1.  **Isolation:** The thought experiment (e.g., Teletransportation) isolates one criterion (e.g., functional/psychological continuity) and makes it salient, stripping away others (biology, law, subjective phenomenology).
  2.  **Verdict:** The listener intuits that identity is preserved because the isolated criterion is met.
  3.  **Transfer:** The argument applies this verdict to the real case (e.g., cortical prosthesis) using the same sortal label ("person").
  4.  **Suppression:** In the real case, other criteria (biological vulnerability, legal personhood) are operative but are rendered invisible because the *verdict* from the fiction has already been accepted. The definition of "person" has been smuggled from the fiction into reality without explicit justification.

  ### 2. Distinctions from Related Concepts

  To ensure the boundaries of *Sortal Smuggling* are clear, here is how it differs from adjacent concepts:

  | Concept | Distinction from Sortal Smuggling |
  | :--- | :--- |
  | **Simple Equivocation** | Equivocation is usually lexical (using "bank" to mean river vs. money). *Sortal Smuggling* uses the *same* word with the *same* general meaning, but shifts the **identity conditions** required to apply it. It is a metaphysical shift, not just a semantic one. |
  | **False Analogy** | A false analogy claims two things are similar when they are not. *Sortal Smuggling* is more insidious: it grants the dissimilarity but argues it *doesn't matter* because the "essential" criterion (salient in the fiction) is preserved. It persuades by making the difference feel irrelevant rather than denying it exists. |
  | **Persuasive Definition** (Stevenson) | Stevenson's concept involves changing the descriptive meaning of a term while keeping its emotive force. *Sortal Smuggling* is a specific *method* of achieving this via thought experiments. It is the *engine* that drives the persuasive definition in metaphysical debates. |
  | **Attribute Substitution** (Kahneman) | This is the cognitive bias underlying the error (answering a hard question by answering an easier one). *Sortal Smuggling* is the *philosophical structure* that enables the substitution. It is the rhetorical vehicle for the bias. |
  | **Good Analogical Reasoning** | A valid analogy preserves **relevant structural relations**. *Sortal Smuggling* preserves **verbal labels** while swapping the relevant structural relations (e.g., swapping biological continuity for functional continuity without arguing for the swap). |

  ### 3. Application to Your Case

  In your family discussion regarding the cortical prosthesis:

  *   **The Sortal:** "Person" (or "Self").
  *   **The Fictional Criterion:** Functional equivalence / Narrative continuity (highlighted by the Ship of Theseus/Teletransporter).
  *   **The Real-World Criterion:** Biological vulnerability, legal agency, subjective phenomenology.
  *   **The Smuggle:** The argument successfully made "functional equivalence" feel like the *only* criterion that matters for "personhood" by testing it in a scenario where biology was irrelevant (a ship or a teleporter). Once you accepted that "functional equivalence = identity" in the fiction, that definition was smuggled into the clinical case, suppressing the biological and legal stakes that the fiction had no room to represent.

  ### 4. Is this a Correctable Bias or an Inevitable Feature?

  This is not an inevitable feature of modal imagination, but it is a **systemic risk** inherent to abstraction. It is correctable, but it requires a specific methodological discipline often missing in popular philosophical discourse.

  **Why it happens:**
  Thought experiments work by *idealization* (stripping away noise to see a signal). The failure occurs when the "noise" stripped away (biology, law, embodiment) turns out to be constitutive of the very thing being studied in the real world.

  **How to Correct It (The "Re-Embedding" Test):**
  To detect and correct *Sortal Smuggling*, apply what Kathleen Wilkes calls **"Re-Embedding."** When a verdict is transferred from a thought experiment to a real case, demand that the fictional scenario be re-embedded with the constraints of the real case.
  *   *Ask:* "If we add the biological vulnerability back into the teletransporter scenario, does the intuition hold?"
  *   *Ask:* "If we add the legal fragmentation risk back into the Ship of Theseus, does the functional equivalence still satisfy the ethical concern?"

  If the intuition dissolves when the suppressed criteria are reintroduced, the original argument was relying on *Sortal Smuggling*.

  ### 5. Conclusion

  You have identified a gap in the standard taxonomy of fallacies. While **"Persuasive Definition"** covers the rhetorical outcome and **"Attribute Substitution"** covers the cognitive mechanism, **"Sortal Smuggling"** best captures the *metaphysical maneuver* you described: the silent exchange of identity conditions between a fictional model and a practical reality, masked by verbal stability.

  It is a correctable error. It arises not because modal imagination is flawed, but because it is often treated as **proof** rather than **hypothesis generation**. When a thought experiment is used to *settle* a practical ethical question rather than to *explore* the contours of a concept, *Sortal Smuggling* becomes highly probable. The remedy is to insist that the criteria salient in the fiction must be explicitly argued for in the reality, not merely imported via shared labeling.
