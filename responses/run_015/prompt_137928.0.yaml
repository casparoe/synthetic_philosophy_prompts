  **MEMORANDUM**

  **TO:** Board of Directors, Kestrel Basin Water Authority
  **FROM:** Science and Engineering Subcommittee
  **DATE:** 1 September 2024
  **SUBJECT:** Recommendation on Paleochannel Investigation and Capital Commitment

  **Bottom Line**
  The Subcommittee recommends obligating $3.5 million by 30 September to commission the stripped-down investigation design (connection indicated vs. not indicated), rather than the full three-outcome design or no study. This recommendation is conditional on General Counsel confirming that the statutory standard ("weight of available evidence") permits decisions based on expected net benefit rather than the single most likely state of the world. This path preserves the option to deploy the high-value Managed Aquifer Recharge project if connection is found, while minimizing the regulatory risk that triggers downstream curtailment costs. We advise against routing the study through a university partner to evade public records requirements.

  **Reasoning**

  The Board must choose between committing now to the Pipeline Interconnection (Option C) or funding an investigation to reduce uncertainty before selecting a project. Without study, the expected net benefit of Option C is $48 million. A full investigation offers a gross expected value of $63 million by allowing us to switch to the high-value Recharge project (Option A) if the paleochannel is connected. However, the net value of information depends on two constraints: our statutory decision rule and the regulatory consequences of public findings.

  First, regarding the statutory standard. Counsel must clarify whether "weight of the evidence" requires maximizing expected value (averaging outcomes by probability) or selecting the best option for the single most probable state (the "most-likely-world" reading). This distinction matters. A standard result in decision theory (Good's Theorem) proves that for an agent maximizing expected utility, information never has negative expected value. The logic is simple: you can always ignore new information and do what you planned anyway; if you change your plan, it is because the new action yields higher expected benefit. However, this theorem assumes you remain free to choose the optimal action after learning. If the Board adopts the "most-likely-world" reading, we are committed in advance to a rule that may force a sub-optimal choice when evidence is inconclusive. In our inconclusive branch, the expected-value rule selects Option C ($49 million), while the most-likely-world rule selects Option B ($43 million). Adopting the latter breaks the assumption of Good's Theorem, effectively paying for information we are forbidden to use optimally. The Subcommittee urges the Board to adopt the expected-value reading to ensure public funds are not spent on intelligence we cannot act upon.

  Second, regarding the study design. Our investigation results become public records. Under basin curtailment rules, any finding short of a clean negative triggers a State Engineer determination of connection, imposing an estimated $40 million cost on ratepayers (range $20–$70 million). This external constraint changes the value of information. When an agent is not free to respond optimally to what it learns—because learning triggers a penalty—a less discriminating experiment can be strictly better than a more discriminating one. Informativeness is a design variable, not an intrinsic good.

  The full study design yields three findings with a 64% probability of triggering curtailment. The stripped design pools these outcomes into two, reducing the trigger probability to 31% while staff assess no loss in decision value (the pooled findings would lead to the same project choices). Consequently, the full design's expected regulatory cost (~$25 million) wipes out its gain over the baseline. The stripped design's expected regulatory cost (~$12 million) leaves it competitive with the baseline ($47 million net vs. $48 million baseline), while preserving the upside of Option A (NPV $120 million) should connection be confirmed. Given the wide range on the curtailment estimate, the stripped design offers a superior risk profile: it obligates the lapsing funds to keep the high-value option open without exposing the Authority to the full regulatory hazard of the detailed design.

  We reject the suggestion to commission the work through a university partner under a research permit to keep results non-public. While this would restore the positive value of information by removing the regulatory trigger, it exposes the Authority to legal risk under Public Records Act interpretations regarding contracted work, and reputational damage appearing as bad-faith evasion of transparency. The cost of defending such a maneuver likely exceeds the curtailment risk.

  We also acknowledge the strong objection raised by the NGO representative: that selecting a study design because it is less likely to generate an inconvenient finding constitutes the deliberate manufacture of uncertainty, damaging scientific integrity. We take this seriously. However, there is a distinction between suppressing evidence and designing evidence collection to match the decision rights actually held by the agent. We are not hiding data; we are acknowledging that the State Engineer's response function makes precise data costly. Where an agency lacks the autonomy to act on fine-grained distinctions without external penalty, coarse-grained data collection is a rational allocation of risk, not an epistemic failure.

  Finally, the Authority's objective function must be explicit. Our enabling act mandates both "reliable supply at least cost to ratepayers" and "protection of instream beneficial uses." The curtailment penalty is a transfer: a cost to ratepayers but a gain to the estuary. If the Board weights instream uses heavily, the curtailment "cost" is partially offset by mission alignment. However, because the financial liability falls on our ratepayers, the Subcommittee treats it as a cost in this fiscal analysis. If the Board wishes to prioritize instream flows over ratepayer cost, the investigation becomes even more valuable, as confirming connection justifies the transfer.

  **What Would Have to Be True for This to Be the Wrong Call**

  This recommendation fails if three conditions obtain. First, if the actual cost of curtailment exceeds $50 million, the expected value of the stripped study drops below the baseline of building Option C now. Second, if General Counsel rules that the statutory standard requires the "most-likely-world" reading, the value of the study collapses because we would be forced into sub-optimal decisions in the inconclusive branch. Third, if the prior probability of connection is significantly lower than staff's 0.30 estimate, the upside of switching to Option A diminishes, making the study cost ineffective. Should any of these materialize, the Board should decline the study and proceed immediately to Option C.
