      *   **Topic:** A modified Keynesian view called the "status-leisure bind".
      *   **Core Claim:** Economic abundance exists (15-hour work week possible), but leisure hasn't arrived because occupational prestige is positional; reducing hours signals low productivity/status loss. Leisure is stigmatised unless one is wealthy. The obstacle is social-coordinative (lack of non-positional status markers), not economic.
      *   **Task:** Assess the view's exposure/falsifiability. Rank defeaters from fatal to awkward. Distinguish between concessions and reinterpretations. Compare with rival explanations (preference for income, regulatory capture). Address evidence from regulated societies (e.g., Europe).
      *   **Constraints:** Max 550 words. British English. One-sentence bottom line at the start.

  2.  **Deconstruct the "Status-Leisure Bind" Thesis:**
      *   *Premise 1:* Technical capacity for 15-hour week exists.
      *   *Premise 2:* Leisure hasn't happened.
      *   *Explanation:* Status competition ties prestige to work hours/occupational intensity. Leisure is low status.
      *   *Implication:* Without non-positional status markers, people won't choose leisure even if they can.

  3.  **Identify Potential Defeaters:**
      *   *Fatal:* Evidence that people *do* choose leisure when hours are capped without status loss, or that status isn't tied to work.
      *   *Awkward:* Evidence that status migrates to consumption (Veblen) rather than work hours, or that preferences actually favor income.
      *   *Insulation Risk:* Claiming any counter-example is just "status migration" makes it unfalsifiable.

  4.  **Drafting - Section by Section:**

      *   *Bottom Line:* Needs to be punchy. "The position is moderately exposed but risks unfalsifiability through adaptive reinterpretation of status signals."
      *   *Fatal Defeaters:*
          1.  Societies with strict hour caps (e.g., France, Netherlands) where high-status individuals work less without prestige loss. If status remains high despite low hours, the bind is broken.
          2.  Evidence that reduced hours *increase* perceived productivity/prestige (e.g., "work smart not hard" culture actually paying off status-wise).
      *   *Awkward Defeaters:*
          1.  Preference surveys showing people genuinely value consumption over leisure regardless of status.
          2.  Status migrating to consumption (luxury goods) rather than work intensity. The thesis says work *hours* are the positional good; if it's actually *spending*, the mechanism shifts.
      *   *Insulation/Reinterpretation:* A defender might argue that in regulated societies, status migrates to "visible side-projects" or consumption, preserving the core claim that *pure leisure* is still stigmatised. This risks unfalsifiability.
      *   *Predictions:* The view predicts that without cultural change on status, regulatory caps alone won't create Keynes's "aesthetic cultivation" but rather displaced competition. Rival views (regulatory capture) predict caps would work if enforced. Preference views predict people would work less if paid less regardless of status.
      *   *Regulated Societies:* This is the crux. If Europeans work less but still compete via consumption/hobbies, the bind holds (status competition persists, just not via hours). If they genuinely cultivate leisure without status anxiety, the bind fails.

