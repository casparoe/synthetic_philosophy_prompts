prompt: |-
  you are a decision theorist who's taught rational choice to grad students something like a dozen times, and you're unusually good at spotting the exact point where peoples intutions go off the rails. Please brainstorm for a bit in bullet points before you commit to anything, and think carefully about the *dependency structure* — what has to be in place before what — rather than just dumping the textbook proof at me.

  I've got a 50-minute slot next week with about fifteen first-year public-policy masters students. They've had exactly one lecture on expected utility: they can read a decision tree, compute an expected value, and they've seen Bayes' rule once but they're shaky on it. They have never seen a value-of-information calculation. Most of them arrive thinking "more information is good, obvs," and at least a couple arrive thinking "but I'd actively not want to know my genetic risk score, so isn't that a counterexample?" I need them to come out actually getting Good's theorem — the result that for an expected-utility maximizer, an extra piece of free information has non-negative expected value, i.e. you can't, from the ex ante standpoint, be made worse off by being handed the option to look — and I need them to get *why* it holds and *where it breaks*. Don't explain the theorem to me and please don't give me a reading list; plan how I should teach it.

  1. The order the pieces have to go in, and what depends on what. My current instinct is: small acts/states table with a prior → value of acting now → "now suppose a signal arrives first" → the convexity bit (max of a mixture is at least the mixture of the maxes) → the punchline that the value is zero unless the signal can actually flip your act. But I keep going back and forth on whether the flipping point should come before the convexity point as the intuition, with convexity as the proof afterwards. Argue for an ordering and tell me what breaks if I do it the other way.

  2. One example to carry the whole session. I was thinking umbrella + weather forecast, because with two acts and two states I can draw the value of information as a function of the prior and it's that tent-shaped curve — zero near the ends, kinked, peaking right at the indifference prior. Tell me what the example has to have and what it has to lack. I'm worried a *perfect* forecast short-circuits the "how good does the information have to be" question, and I don't want any cost of acting, any repeated-play element, or anything strategic in the base case.

  3. The misconceptions, in the order they'll actually form them, and where in my sequence to defuse each. The ones I expect: "the theorem says you won't regret looking" (the ex ante / ex post slide); "the value of information is just how likely it is to change my mind"; "a more accurate test is always worth more"; conflating "I'd be better off if the world were a certain way" with "I'd be better off knowing which way it is"; and "free information is free, so there's never a reason not to look," which ignores that the act of finding out can perturb the world (asking your manager whether you're being made redundant makes it more likely; the diagnostic procedure itself has a complication risk). Which of these is the actually dangerous one — the one that'll silently corrupt their later work — and what am I missing from the list?

  4. Two failure cases I want to close on, and I need help sequencing them. (a) An agent who updates wrong in a particular way: she acts as if the likelihood ratio were raised to the power 1.5, so she over-reacts to signals. For her, more information can be actively harmful and she'd pay to stay ignorant. (b) An agent whose utility depends on her own credence — she likes suspense, or she hates the anxiety of knowing. Are these the same kind of failure of the theorem's assumptions, or structurally different failures? Which one first? And can I reuse the umbrella numbers from item 2 to make (a) concrete rather than hand-wavy?

  5. One question I can put on the board at the end that tells me whether they got the theorem rather than just the arithmetic — something that separates a student who's internalised "ex ante, about the option to look, for an expected-utility maximizer" from one who's internalised "information is good."

  6. What I should openly refuse to explain in fifty minutes, and say out loud that I'm skipping.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Role:** Decision theorist, experienced teacher (grad level), expert at spotting intuition failures.
      *   **Audience:** 15 first-year public-policy masters students.
      *   **Background:** 1 lecture on Expected Utility (EU), can read decision trees, compute EV, shaky on Bayes, *never* seen Value of Information (VoI).
      *   **Goal:** Teach Good's Theorem (VoI $\ge$ 0 for EU maximizers) – *why* it holds, *where* it breaks.
      *   **Constraints:** 50 minutes. No reading lists. No explaining the theorem to *me* (the prompter). Focus on dependency structure and pedagogy.
      *   **Specific Tasks:**
          1.  Order of operations (Convexity vs. Action Flipping).
          2.  One master example (Umbrella/Weather).
          3.  Misconceptions (ordering and defusing).
          4.  Two failure cases (Bad updating vs. State-dependent utility/psychological costs).
          5.  Final board question (conceptual check).
          6.  What to explicitly skip.

  2.  **Deconstruct the Pedagogy (The "Dependency Structure"):**
      *   *Core Insight:* Good's Theorem relies on the linearity of expectations and the convexity of the maximum function. $E[\max_a E[U|S]] \ge \max_a E[U]$.
      *   *Student Intuition:* "Information is good" is a heuristic, not a theorem. They conflate *instrumental* value (changing actions) with *intrinsic* value (curiosity/anxiety). They conflate *ex ante* (before seeing the signal) with *ex post* (after seeing a bad signal).
      *   *The "Aha!" Moment:* Information only has value if it changes what you *do*. If you do the same thing regardless, the info is worthless (in this framework). But having the *option* to change can't hurt.

  3.  **Drafting Section 1: Ordering (Convexity vs. Flipping):**
      *   *Option A (Convexity First):* Mathematical rigor first. $E[\max] \ge \max E$.
          *   *Risk:* Policy students glaze over at "convexity." It feels abstract.
      *   *Option B (Flipping First):* Intuition first. Info matters only if it changes the decision.
          *   *Benefit:* Connects to their policy intuition (don't collect data unless it changes the policy).
          *   *Dependency:* You need to establish *when* the act flips to understand *why* the expectation goes up.
      *   *Decision:* Flipping first. Convexity is the *proof* that the flipping logic holds in expectation. If I do convexity first, they see the math but miss the mechanism. If I do flipping first, the math just formalizes the intuition.
      *   *What breaks if reversed:* Students memorize Jensen's Inequality but think VoI comes from "reducing uncertainty" rather than "enabling better acts."

  4.  **Drafting Section 2: The Master Example (Umbrella):**
      *   *Requirements:* 2 acts (Umbrella/No Umbrella), 2 states (Rain/No Rain).
      *   *Payoffs:* Need a specific structure.
          *   Rain + No Umbrella = Bad (-100).
          *   Rain + Umbrella = Okay (-10 cost of carrying).
          *   No Rain + No Umbrella = Good (0).
          *   No Rain + Umbrella = Slight Annoyance (-10).
      *   *Prior:* Needs to be near the indifference point to show value. Say 20% rain.
      *   *Signal:* Imperfect forecast.
      *   *Constraint Check:* No cost of acting (already in payoffs), no repeated play, no strategy.
      *   *Refinement:* Keep numbers simple.
          *   Act: Take Umbrella (Cost 10 always).
          *   Act: Leave Umbrella (Cost 0 if Sun, Cost 100 if Rain).
          *   Prior: 15% Rain.
          *   EV(Leave) = $0.85(0) + 0.15(-100) = -15$.
          *   EV(Take) = $-10$.
          *   Baseline: Take Umbrella (-10).
          *   Forecast: If "Rain", $P(Rain|Forecast) = 80\%$. If "Sun", $P(Rain|Forecast) = 5\%$.
      *   *Why this works:* It shows the "kink." If prior is 1% rain, forecast doesn't change act (always take). If prior is 90% rain, forecast doesn't change act (always take). Value is zero at extremes.
      *   *What to lack:* Do *not* add a cost for the forecast itself yet. That confuses VoI with Net VoI.

  5.  **Drafting Section 3: Misconceptions:**
      *   *List:*
          1.  Ex ante vs. Ex post regret ("I looked and felt bad").
          2.  VoI = Probability of changing mind (Close, but needs weighting by *how much* it improves the outcome).
          3.  Accuracy = Value (A perfect test on a decided question is worthless).
          4.  Intrinsic utility of belief (Suspense/Anxiety).
          5.  Information perturbs the state (Observer effect).
      *   *Most Dangerous:* #1 (Ex ante/ex post slide). If they think VoI guarantees a good *outcome* rather than a good *decision process*, they will misunderstand risk management entirely.
      *   *Second Most Dangerous:* #4 (Intrinsic utility). This is the "genetic test" objection. It needs to be categorized as a violation of the utility function assumptions, not the math.
      *   *Timing:* Defuse #1 immediately after the theorem proof. Defuse #4 during the "Where it breaks" section.

  6.  **Drafting Section 4: Failure Cases (Sequencing):**
      *   *Case A (Bad Updating):* Non-Bayesian updating.
      *   *Case B (State-Dependent Utility):* Utility depends on belief (anxiety).
      *   *Structure:* Are they the same? No.
          *   Case A violates the *rationality* assumption of the agent (you aren't an EU maximizer if you update wrong).
          *   Case B violates the *consequence* assumption (outcomes depend only on State + Act, not on Belief).
      *   *Ordering:* Do Case A first. It keeps the "instrumental" frame. You *should* update correctly. If you don't, math breaks. It reinforces the "EU Maximizer" precondition.
      *   *Case B second:* This addresses the "genetic test" intuition. It admits the theorem is right, but the *model* was wrong for that situation.
      *   *Reusing Umbrella:* For Case A, show that if you overreact to the forecast (e.g., treat 60% forecast as 90%), you might switch to "Leave Umbrella" when you shouldn't, lowering EV.

  7.  **Drafting Section 5: The Final Board Question:**
      *   *Goal:* Distinguish "Info is good" from "Option to use info is good for EU max."
      *   *Idea:* A scenario where looking is mandatory vs. optional. Or a scenario where the info cannot change the act.
      *   *Better Idea:* The "Irrelevant Information" test.
      *   *Draft:* "You are deciding whether to fund a program. A consultant offers you a report that is 100% accurate about the color of the consultant's tie. It is free. Does Good's Theorem say the expected value of this report is positive, zero, or negative? Why?"
      *   *Why:* If they say "Positive because info is good," they failed. If they say "Zero because it can't change the act," they got it.

  8.  **Drafting Section 6: What to Skip:**
      *   *Time:* 50 mins is tight.
      *   *Skip:* The formal proof of Jensen's inequality. Skip the derivation of the posterior probabilities (give them the numbers). Skip the discussion of *costly* information (VoI vs Net VoI) until the very end as a footnote. Skip risk aversion nuances (EU handles risk aversion, but don't get into utility curvature vs. probability weighting).

  9.  **Review and Refine:**
      *   *Tone:* Experienced, pragmatic, slightly authoritative but helpful.
      *   *Formatting:* Bullet points as requested for the brainstorming phase, then structured response.
      *   *Check:* Did I address the "dependency structure"? Yes, emphasized in Section 1.
      *   *Check:* Did I address the "genetic risk" intuition? Yes, in Section 4 (Case B).
      *   *Check:* Did I address the "convexity vs. flipping"? Yes, argued for Flipping first.

  10. **Final Polish:** Ensure the distinction between *value of information* and *value of the outcome* is sharp. Ensure the distinction between *violating the math* (bad updating) and *violating the model* (anxiety) is clear. (Self-Correction: Make sure to emphasize that Good's Theorem is about the *option* to look, not the *act* of looking.)

  11. **Final Output Generation** (incorporating the thought process into the structured response).
answer: |-
  Here is the breakdown of the dependency structure and the lesson plan, based on where students typically trip over the logic.

  ### 1. The Order of Operations: Flipping Before Convexity

  **The Sequence:**
  1.  **Baseline Decision:** Compute EV of acts given *prior* only. Identify the optimal act.
  2.  **The Signal:** Introduce the forecast. Show how it splits the world into posterior probabilities.
  3.  **The "Flip" Condition:** Demonstrate that information has value *if and only if* it causes you to switch acts in at least one signal branch.
  4.  **The Aggregation (Convexity):** Show that the weighted average of the "best act per branch" is $\ge$ the "best act for the average."
  5.  **The Theorem:** State Good's result as the formalization of steps 3 & 4.

  **Why this order?**
  *   **Intuition First:** Policy students care about *decisions*, not functions. If you start with convexity ($E[\max] \ge \max E$), they see a math trick. If you start with flipping, they see a management insight: "Don't buy data unless it changes the policy."
  *   **Dependency:** You cannot understand *why* the expectation rises (convexity) until you understand *where* the gain comes from (the specific branches where the act flips). The convexity is the *accounting* of the flipping.

  **What breaks if you reverse it?**
  *   If you lead with convexity, students treat VoI as a property of *uncertainty reduction*. They will walk away thinking "information is valuable because it narrows the probability distribution." This is false. Information is valuable because it correlates with states that differentiate payoffs.
  *   If you don't establish the "flip" condition first, they won't understand why VoI is zero when the prior is extreme (0 or 1). They will think the math just "happens to work out" rather than seeing that the act didn't change.

  ### 2. The Master Example: The Umbrella

  **The Setup:**
  *   **Acts:** $A_1$ (Carry Umbrella), $A_2$ (Leave Umbrella).
  *   **States:** $S_1$ (Rain), $S_2$ (Sun).
  *   **Payoffs (Utility):**
      *   Carry: $-10$ (constant cost of carrying).
      *   Leave + Sun: $0$.
      *   Leave + Rain: $-100$ (getting soaked).
  *   **Prior:** $P(\text{Rain}) = 0.2$.
      *   $EV(\text{Carry}) = -10$.
      *   $EV(\text{Leave}) = 0.8(0) + 0.2(-100) = -20$.
      *   *Baseline Choice:* Carry.
  *   **Signal (Forecast):** Two messages, "Rainy" ($m_R$) and "Sunny" ($m_S$).
      *   $P(m_R | \text{Rain}) = 0.7$, $P(m_R | \text{Sun}) = 0.1$.
      *   (Work out the posteriors for them so they don't get stuck on Bayes arithmetic).
      *   Result: If $m_S$, posterior $P(\text{Rain}) \approx 0.05$. If $m_R$, posterior $P(\text{Rain}) \approx 0.65$.

  **What this example must have:**
  *   **Asymmetric Payoffs:** The cost of being wrong (Rain/Leave) must dwarf the cost of the precaution (Carry). This creates a threshold where you switch acts.
  *   **Imperfect Signal:** If the forecast is perfect, the "value" looks like magic. With imperfect signals, they see the probability weighting.
  *   **Indifference Proximity:** The prior (0.2) should be close enough to the indifference point (0.1) that a "Sunny" forecast flips the decision, but a "Rainy" forecast reinforces it.

  **What this example must lack:**
  *   **Cost of the Forecast:** Do not introduce a price for the forecast yet. That confuses *Value* of Information with *Net* Value. Keep the info free to isolate the theorem.
  *   **Third Acts:** No "Buy a Raincoat" option. Keep it binary to keep the decision tree visible on one slide.
  *   **Repeated Play:** Emphasize this is a one-shot decision. Expected Utility applies to single cases, but students often think "I'll get soaked 20% of the time, so over the year..." No. One day, one commute.

  ### 3. Misconceptions: Order of Appearance and Defusal

  **1. "The theorem says I won't regret looking." (Ex Ante vs. Ex Post)**
  *   *When it forms:* Immediately after you show the calculation. A student will say, "But if the forecast says Sunny and I leave the umbrella and it rains, I'm worse off than if I hadn't looked!"
  *   *Defusal:* **Do this immediately.** Distinguish *Decision Quality* from *Outcome Luck*. The theorem guarantees higher *expected* utility at the root node ($t=0$), not better outcomes at the leaf node ($t=2$).
  *   *Danger Level:* **High.** If they miss this, they will blame the model when they get unlucky, rather than understanding risk.

  **2. "Value = Probability of Changing My Mind."**
  *   *When it forms:* When you explain the "flip" condition.
  *   *Defusal:* Show a case where the act flips but the payoff difference is trivial vs. a case where the act flips and the payoff difference is huge. Value is $P(\text{flip}) \times \text{Gain from flipping}$.
  *   *Danger Level:* Medium. Leads to poor resource allocation (collecting data that changes minor decisions but missing data that impacts major ones).

  **3. "More Accurate Tests are Always Worth More."**
  *   *When it forms:* During the example discussion.
  *   *Defusal:* Remind them of the "Extreme Prior" case. If I'm 99.9% sure it will rain, a 100% accurate test is worth $0 because I carry the umbrella anyway. Accuracy is irrelevant if the decision is robust.
  *   *Danger Level:* Medium. Leads to over-investment in precision.

  **4. "Free Information is Free." (Observer Effects)**
  *   *When it forms:* Near the end, when discussing real policy.
  *   *Defusal:* Acknowledge this violates the "States are independent of Acts/Signals" assumption.
  *   *Danger Level:* Low for the theorem, high for policy. Just flag it as a model boundary.

  **5. "I'd rather not know." (Intrinsic Utility of Belief)**
  *   *When it forms:* The "genetic risk" objection.
  *   *Defusal:* Save for Section 4. This is the "Gotcha" that validates their intuition while saving the theorem.
  *   *Danger Level:* **Highest.** If not handled well, they will dismiss the entire EU framework as "ivory tower."

  ### 4. The Two Failure Cases (Sequencing)

  **Case A: The Bad Updater (Non-Bayesian Agent)**
  *   **Sequence:** Do this **first**.
  *   **Why:** It preserves the structure of the theorem but violates the *agent* assumption. It reinforces that Good's Theorem is a statement about *rational* agents.
  *   **Concrete Umbrella Application:** Use the same numbers.
      *   True Posterior after "Sunny" forecast: 5% Rain.
      *   Agent's Belief: She over-reacts to "Sunny" and thinks it's 1% Rain.
      *   Actually, let's make it simpler: She treats the signal as *more* informative than it is.
      *   Better yet: She ignores the base rate.
      *   *The Harm:* Show that because she updates incorrectly, she switches to "Leave Umbrella" in a state where "Carry" still had higher EV. Her $E[U]$ with information is now *lower* than her $E[U]$ without.
      *   *Lesson:* Information is only an asset if you process it correctly. Garbage in, garbage out.

  **Case B: The Anxious Agent (State-Dependent Utility)**
  *   **Sequence:** Do this **second**.
  *   **Why:** This addresses the "genetic test" intuition. It violates the *consequence* assumption (utility depends on State + Act, not State + Act + *Belief*).
  *   **Structure:** Structurally different from Case A. Case A is a calculation error; Case B is a modeling error.
  *   **Explanation:** In Good's Theorem, $U(s, a)$. In this case, $U(s, a, \text{belief})$. If "knowing I have the gene" adds a $-50$ anxiety cost regardless of the health outcome, the "Act" of Looking has a direct cost not captured in the tree.
  *   **Lesson:** The theorem holds for *instrumental* value. It does not account for *intrinsic* value (curiosity or dread).

  ### 5. The Final Board Question

  Write this on the board 5 minutes before the end:

  > "A Minister must decide whether to launch a costly intervention ($Cost=10M$).
  >
  > **Scenario A:** She is currently indifferent between Launching and Not Launching. A consultant offers a free report that is 100% accurate.
  >
  > **Scenario B:** She is currently certain ($P=0.99$) that Launching is the right choice. A consultant offers a free report that is 100% accurate.
  >
  > According to Good's Theorem, in which scenario is the Expected Value of the Information higher? Why?"

  **What this tests:**
  *   If they answer "A," they understand the **Convexity/Flipping** condition (Value is highest at the indifference point).
  *   If they answer "B" (or "Equal"), they think Information Value is about **Accuracy** or **Uncertainty Reduction** generally.
  *   If they answer "It depends on the outcome," they failed the **Ex Ante** distinction.

  ### 6. What to Openly Refuse to Explain

  In the first 2 minutes, put a "Parking Lot" list on the side of the board and say:

  1.  **Costly Information:** "We are calculating *Gross* Value of Information. If the test costs money, you subtract that at the end. I'm not deriving Net VoI today."
  2.  **Risk Aversion Curvature:** "We are assuming Expected Utility. Whether you are risk-averse or risk-neutral changes the *payoffs*, but it does not change the theorem that Information $\ge$ 0. Don't ask me to prove that distinction today."
  3.  **Strategic Information:** "What if your opponent sees that you bought the report? That's Game Theory. Today is Decision Theory. We assume the world doesn't care if you look."

  **Why:** This protects your 50 minutes. These are the three rabbit holes that will eat 15 minutes each if a clever student raises them. By preemptively parking them, you validate the questions without derailing the dependency chain.
