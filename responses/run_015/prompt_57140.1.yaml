answer: |-
  Use this procedure only for incapacitated patients without surrogates or valid advance directives. Never use it to override a clear, written refusal of treatment unless evidence proves the underlying values have changed.

  **Procedure: Idealized Preference Reconstruction**

  1.  **Evidence Collection:** Gather all data on patient values. Priority: 1) Written statements/directives. 2) Verified verbal statements to clinicians/family. 3) Hearsay/secondhand reports. **[Judgment: Social Worker]** determines credibility of informants.
  2.  **Pooling:** Pool all accounts into a single narrative history. Do not idealize individual accounts separately. **[Judgment: Team]**. *Rationale:* Idealizing separately creates conflicting "ideal selves"; pooling establishes the actual historical baseline before correction.
  3.  **Inconsistency Resolution:** If accounts conflict, prioritize statements made closer to the decision point and during periods of mental stability. Discard outliers unless corroborated. **[Judgment: Clinician]** assesses medical stability at time of statement.
  4.  **Idealization (Licensed):** Correct factual errors (prognosis, pain levels, treatment burden) and transient distortions (untreated depression, sedation, acute panic, coercion). **[Judgment: Clinician]** defines medical facts; **[Judgment: Social Worker]** identifies coercive contexts.
  5.  **Idealization (Forbidden):** Do not correct core values (religious beliefs, risk tolerance, definition of dignity). Do not assume "reasonable person" standards. **[Judgment: Team]** must agree a value is core before excluding it from idealization.
  6.  **Hard Stop:** If the only way to reach a consent/refusal is to alter a core value, stop. Revert to Best-Interests Analysis with a written explanation that reconstruction failed. **[Judgment: Ethics Director]** approves reversion.
  7.  **Documentation:** Recommendation drafted in plain language. Countersigned by Attending and Risk Management. **[Judgment: Attending/Risk]** confirms legal/clinical safety.

  **Case Applications**

  **Case 1: 74-Year-Old Male (Dialysis)**
  *   **Evidence Relied On:** Single verbal remark at family dinner 10 years prior ("rather die than hooked to a machine"). No written directive.
  *   **Idealizations Applied:** Corrects factual ignorance regarding modern dialysis burden vs. 10-year-old technology. Corrects hypothetical nature of past remark (not made during actual illness).
  *   **Resulting Preference:** Consent to trial. The idealized self values life extension if burden is lower than imagined.
  *   **Confidence:** Low. Evidence is thin.
  *   **Who Signs Off:** Clinician, Social Worker, Attending.

  **Case 2: 29-Year-Old Female (Psychosis)**
  *   **Evidence Relied On:** Pre-illness documented refusal of intubation. Current state: First psychotic break. Clinicians believe refusal rooted in delusional fear.
  *   **Idealizations Applied:** Removes distortion caused by untreated psychotic pathology (if pre-illness refusal was based on emerging delusions) or corrects factual misunderstanding of intubation temporality. However, pre-illness document is high priority.
  *   **Resulting Preference:** Honors Refusal. The pre-illness self is the most "ideal" epistemic condition available. Current fear is symptom, not value.
  *   **Confidence:** Medium.
  *   **Who Signs Off:** Clinician, Social Worker, Attending, Risk Management.

  **Case 3: Written Refusal (Low-Burden Intervention)**
  *   **Evidence Relied On:** Written, witnessed, still-current refusal.
  *   **Idealizations Applied:** None permitted. Theoretical idealization suggests patient would consent if fully informed of low burden.
  *   **Resulting Preference:** **Procedure Stops.** Honors Refusal.
  *   **Confidence:** High.
  *   **Who Signs Off:** Ethics Director (for Hard Stop activation), Attending, Risk Management.
  *   **Note:** The procedure explicitly refuses to override this. A written directive is the highest evidence of values. Idealization corrects ignorance, not settled autonomy. Overriding this violates the "Forbidden" clause (Step 5) and triggers the Hard Stop (Step 6).

  **Limitations and Systematic Misfires**

  This procedure cannot manufacture evidence where none exists. It systematically misfires when patient values were never articulated, forcing a revert to best-interests. It is vulnerable to clinician bias in defining "distortion" versus "value"; a clinician may label a unpopular value as a "distortion." The pooling step (Step 2) assumes informants are equally reliable, which may silence marginalized voices if not checked by the Social Worker. Finally, the Hard Stop protects against paternalism but may result in conservative outcomes that prolong suffering when evidence is ambiguous. This tool reconstructs preferences; it does not determine welfare. When reconstruction fails, welfare must decide, but that decision must be labeled clearly as such, not disguised as the patient's voice.

  **Closing Note on Judgment Licensing**

  Every step above marked **[Judgment]** transfers authority from the committee to the operational team. The Ethics Director retains oversight only for the Hard Stop. This distribution ensures speed but requires the Attending and Risk Management to accept liability for the idealization choices. If Risk Management refuses to sign, the case defaults to Best-Interests immediately. This ensures no recommendation enters the chart without legal viability, protecting the institution from the inherent risk of attributing preferences to the silent.
