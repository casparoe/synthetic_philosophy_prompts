answer: |-
  **MEMORANDUM**

  **TO:** Board of Trustees, Alden Museum of World Art
  **FROM:** Chair, Collections and Repatriation Committee
  **DATE:** October 17, 2023
  **SUBJECT:** Recommendation on Disposition of Benin Kingdom Holdings

  **RECOMMENDATION**

  The Committee recommends the following dispositions, to be voted upon at the meeting on October 24:

  1.  **Group A (9 objects, 1902 purchase, restricted funds):** Authorize staff to file immediately with the charity regulator for permission to deaccession and permanently return these objects to the Federal Antiquities Authority of Nigeria, with a binding memorandum of understanding that physical custody be granted to the Court of the Oba once conservation standards are met. If the regulator denies permission, authorize legal counsel to petition the court for a *cy-près* modification of the founding trust, arguing that retaining looted goods violates the charitable purpose of public education.
  2.  **Group B (6 objects, 1911 purchase, unrestricted funds):** Authorize immediate deaccession and permanent return to the Federal Antiquities Authority.
  3.  **Group C (4 objects, shrine town origin):** Authorize return to the descendant association of the sacked town, not the Benin Kingdom, acknowledging the Kingdom as the original appropriator.

  We reject the rotating-loan compromise. We acknowledge the withdrawal of the pledged eight-figure bequest and the loss of admissions revenue; these financial impacts must be mitigated through fundraising, not by conditioning ethical restitution on institutional solvency.

  **FINDINGS OF FACT**

  Provenance research confirms Group A was removed during the 1897 British punitive expedition. Group B originates from a colonial administrator's estate during the occupation era; while direct evidence of looting is absent, the context presumes unequal power dynamics. Group C was confirmed by curators as regalia taken by Benin forces from a neighboring town prior to British arrival.

  Four claimants exist: the Oba's Court (ritual/inalienable claim); the State Government (legal title claim); the Federal Authority (national title claim); and the local Edo Diaspora (cultural heritage claim). The founding bequest restricts Group A to permanent display in this city. The Benin Gallery drives 40% of admissions. The Founder's family has conditioned a future bequest on permanent retention.

  **PRINCIPLE AND ARGUMENT**

  Our guiding principle is **Restitution as Repair of Specific Harm**. We are not merely balancing competing political interests; we are remedying documented acts of dispossession.

  For Groups A and B, the harm is the British colonial theft. The Oba's argument regarding inalienability is morally compelling for these objects: if these items are ritual apparatus rather than property, our possession constitutes a continuing sacrilege, not just a historical wrong. However, the inalienability principle cannot be absolute. If it were, we could not return Group C to the shrine town, because the Benin Kingdom itself alienated those objects through violence. To apply inalienability uniformly would validate the Benin Kingdom's prior appropriation of its neighbors. Therefore, we recognize the Oba's claim for the British-looted items ( Groups A & B) but prioritize the town's claim for Group C. Restitution must follow the chain of theft, not just national identity.

  Regarding the rotating-loan offer from the Federal Authority: The Committee recommends rejection. Our curators are correct that this treats inalienable ritual objects as alienable commodities. It asserts our continued title over objects we acknowledge we should not hold. Furthermore, the conservation risks and recurring costs are substantial. A loan implies we are lending what is ours; restitution acknowledges it was never ours to lend.

  **FINANCIAL IMPACT**

  The withdrawal of the founder's bequest and the loss of gallery admissions represent a significant financial blow. However, these factors must carry **zero weight** in the ethical determination of ownership. To condition the return of stolen property on the financial generosity of the thief's descendants or the revenue generated by the display of that property is morally untenable. The memo registers these risks not to argue for retention, but to trigger immediate financial contingency planning. We cannot allow the museum's balance sheet to veto justice.

  **THE STRONGEST OBJECTION**

  The strongest case against this recommendation is not financial, but custodial and political. By returning these objects, we may be handing them to authorities who do not represent the people on whose behalf the claim is made. The Federal Authority has documented storage failures; the State Government's museum exists only on paper; the Oba's Court is hereditary and unelected. If we return Group C to the town association, we lack guarantees of their capacity to preserve them.

  Critics will argue that retention is the lesser evil: we preserve the objects safely while advocating for better governance in Nigeria. They will assert that "more research" is needed to ensure the recipients are legitimate. This is not merely delay; it is a claim that our stewardship is morally superior because it is safe.

  **RESPONSE TO OBJECTION**

  This objection fails because it conflates preservation with ownership. We cannot condition the return of rightful property on the recipient meeting our conservation standards, any more than a bank could refuse to return a deposit because the owner's home safe is inferior to the vault. While we may offer technical assistance, we cannot hold objects hostage to ensure perfect care. Furthermore, the argument that we represent a neutral stewardship ignores that our possession is the result of violence. To retain objects because the victim's government is imperfect is to perpetuate the colonial logic that Western institutions are the only legitimate custodians of global heritage. We must accept the risk of return rather than the certainty of complicity.

  **CONCRETE STEPS AND TIMETABLE**

  *   **October 24 (Board Meeting):** Vote on this recommendation.
  *   **October 25 – November 1:** If approved, staff to notify claimants (Federal Authority, Oba's Court, Town Association) of intent to return.
  *   **November 15:** File application with charity regulator for Group A deaccessioning.
  *   **December 1:** If regulator approval is not received, counsel to file petition for trust modification.
  *   **January 15:** Launch capital campaign to offset lost bequest and admissions revenue.
  *   **March 1:** Target date for physical transfer of Group B and C.
  *   **June 1:** Target date for physical transfer of Group A (contingent on regulatory approval).

  We have an opportunity to lead not by keeping, but by returning. I urge the Board to vote yes.
