  7.  **Robustness vs. Emptiness:**
      *   If insulated, is it robust? No, it's tautological. "Institutions are material traces because we define institutions as material traces."
      *   Should the user be skeptical? Yes, because it limits explanatory power regarding *change* and *conflict*.

