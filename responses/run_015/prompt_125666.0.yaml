answer: |-
  In a controlled trial at St. Jude's Memorial, Patient 402 receives an injectable swarm of grain-sized biocompatible micro-chips dispersed throughout the vascular system. Though physically isolated by plasma gaps and never making contact, the chips communicate via near-field magnetic induction to form a single distributed network that monitors glucose and secretes synthetic insulin precisely mimicking a healthy pancreas. The medical team treats the swarm as a singular implantable device for regulatory purposes, yet ontologically, the components remain distinct particles floating independently within the blood, coordinated only by invisible signals rather than physical bonds.

  Universalism asserts that a composite object exists whenever there are parts, so the distributed swarm constitutes a single medical entity alongside the patient. Nihilism denies this outright, claiming only the individual chips and blood cells exist, with no "swarm" over and above them. A contact-based restricted composition view faces the sharpest tension here: it must deny that the loop is a single object because the chips never touch, even though the system is functionally identical to a unified organ like a pancreas.

  If we swap the chips for engineered biological tissue that physically connects while maintaining the exact same feedback loop, the contact-based view suddenly accepts the composition. This isolates the variable: the intuition driving the restricted verdict hinges on missing contiguity rather than functional unity. The system's causal power remains constant in both cases, yet the ontological status shifts solely based on whether the parts share a boundary, suggesting that for the restrictionist, physical adjacency trumps functional integration.

  A defender of the restricted view attacks this structurally by arguing that wireless coordination relies on extrinsic relations susceptible to interference, whereas physical contact provides an intrinsic, binary boundary for existence. They contend that functional unity is a vague predicate that cannot ground factual existence without inviting sorites paradoxes, while spatial contiguity offers a precise metaphysical cutoff. Thus, the rejection of the chip-swarm isn't an intuitive failure but a necessary safeguard against ontological vagueness, preserving a clear distinction between a collection of cooperating parts and a genuine substance.
