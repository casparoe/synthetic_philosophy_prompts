  1.  **Pre-committing to Plan B:** This is a **good idea**, but frame it as *contingent authorization*, not immediate spending. Tell the Board: "Authorize the $300k site work funding now, but only release it if the Route 9 deal fails by [Date]." This removes the desperation leverage the seller/broker has over you without wasting money if you win. It signals you have a viable fallback and will walk away.
  2.  **Public Cap:** Making the cap public and irrevocable **helps**. Right now, the broker knows you have $900k in the warrant and thinks you'll climb to $800k to avoid losing face. A public "Best and Final" of $750k tells them you will not play the auction. It risks losing the site, but it stops the "Dollar Auction" dynamic where you pay more to justify sunk costs.
  3.  **The Number:** You asked for a number you might not like. **$750,000.** It is $140k over the appraisal, which stings, but it is $50k under the broker's target and roughly $10k under the pharmacy's current bid. It forces you to walk away if the pharmacy stays in, which breaks the escalation cycle. If you go higher, you are paying for the privilege of avoiding a hard conversation with the Board about sunk costs.

  ***

  **MEMORANDUM**

  **TO:** Select Board
  **FROM:** Public Safety Building Committee
  **DATE:** August 12, 2024
  **SUBJECT:** Recommendation Regarding Fire Station Land Acquisition

  **Purpose**
  The Public Safety Building Committee requests a decision on the acquisition of the Route 9 parcel for the new fire station. We are approaching a critical deadline: the state matching grant expires on September 30. This memo recommends a final purchase price cap, a deadline for acceptance, and a contingency plan to ensure public safety needs are met regardless of the outcome.

  **Recommendation**
  The Committee recommends the Select Board authorize a **final offer of $750,000** for the Route 9 parcel, with acceptance required by **August 25, 2024**. If the seller does not accept these terms by this date, the Town should withdraw from the bidding process immediately.

  Simultaneously, we recommend the Board **pre-authorize funding for Plan B** (site work on the Town-owned lot behind the highway garage) contingent on the failure of the Route 9 acquisition. This authorization should be approved now but not spent unless the Route 9 deal collapses.

  **Financial Context**
  *   **Town Meeting Authorization:** $900,000 (printed warrant limit).
  *   **Current Bid:** $740,000.
  *   **Competing Bid:** Reported at $760,000 (commercial entity).
  *   **Appraisal:** $610,000 (completed August 2023).
  *   **State Grant:** Covers 50% of acquisition cost up to $500,000. Must be drawn by September 30.
  *   **Sunk Costs:** Approximately $220,000 in design, legal, and permitting. These funds are expended regardless of the decision.

  At the recommended $750,000 price point, the Town's net cash outlay is $375,000 after the grant. At the warrant limit of $900,000, the Town's net outlay rises to $450,000. Plan B requires approximately $300,000 in site work with no acquisition cost, but utilizes no grant funds.

  **Rationale for the $750,000 Cap**
  The current bidding process has escalated beyond the appraised value and into a competitive dynamic that risks fiscal stewardship. While the Route 9 location is superior to Plan B, the marginal benefit does not justify exceeding the $750,000 cap.

  1.  **Avoiding Escalation:** We are currently in a bidding war with a commercial entity. Commercial buyers often have different return-on-investment metrics than municipal bodies. Continuing to bid against them invites a cycle where the price increases solely to win, rather than based on the land's value to the Town.
  2.  **Broker Incentives:** The listing broker earns a 6% commission only upon closing. Their prediction that the seller will accept $800,000 is an estimate designed to close the deal, not a guarantee. We cannot justify spending an additional $50,000 to $150,000 of Town funds based on unverified assurances.
  3.  **Fiscal Responsibility:** Paying $900,000 for land appraised at $610,000 fourteen months ago is difficult to defend, even with a hot market. The $750,000 cap represents a significant premium over appraisal but draws a line before reaching the warrant ceiling.

  **Strategic Value of Pre-Authorizing Plan B**
  Approving Plan B funding now, contingent on Route 9 failure, serves two purposes:
  1.  **Continuity:** It ensures that if we lose the Route 9 parcel, we do not face a delay in fire station construction. We can immediately begin site work on the garage lot to meet operational needs.
  2.  **Negotiating Leverage:** It signals to the seller and broker that the Town is not desperate. We are not choosing between "this land" and "nothing." We are choosing between "this land at a fair price" and "our own land." This reduces the pressure to overbid simply to avoid starting over.

  **Publicizing the Cap**
  We recommend making this $750,000 cap public and irrevocable. Currently, the seller knows the Town Meeting authorized $900,000. They anticipate we will raise our offer to avoid losing the grant and the sunk costs. By publicly stating our final limit, we remove the ambiguity that fuels bidding wars. It guarantees we will not be outbid if the seller holds out for more, but it protects the Town from paying a premium driven by auction dynamics rather than value.

  **The Case for Continuing the Bid**
  While we recommend a hard cap, there is a strong argument for staying in the process up to that limit.
  1.  **Location Superiority:** The Route 9 parcel offers better access, visibility, and response times than the highway garage lot. Plan B involves ledge removal and wetlands mitigation, which carries construction risk and potential delays.
  2.  **Grant Utilization:** Losing the state grant means losing up to $500,000 in subsidy. Even at a higher purchase price, the grant reduces the Town's cash burden significantly compared to Plan B, where the Town bears 100% of site costs.
  3.  **Future Availability:** If a commercial entity purchases this parcel, it may not be available again. There is a risk they could acquire the land and resell it to the Town later at a higher price once we are out of options. Securing it now eliminates that future leverage against us.

  **Next Steps**
  1.  Select Board votes to authorize the $750,000 final offer by August 15.
  2.  Committee submits final offer to broker with August 25 expiration.
  3.  Select Board votes to contingent-authorize Plan B site work funding simultaneously.
  4.  If Route 9 offer is rejected, Town withdraws and triggers Plan B funding immediately.

  We request a vote at your next meeting to proceed.
