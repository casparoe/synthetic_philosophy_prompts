  Hi — I need a hand drafting something. I'm one of five people on our town's Public Safety Building Committee (pop. around 9,000, central Mass.). We owe the Select Board a recommendation before their meeting a week from Thursday, the committee is badly split, and I've ended up being the one who has to write it, so I need something in their inbox by Monday.

  Short version of the mess: for three years we've been trying to buy a 0.9-acre parcel on Route 9 for a new fire station. There's a state matching grant that covers half the acquisition cost, up to $500,000, but it has to be drawn down by Sept 30 or it goes back to the state and gets handed to other towns, and it can only be used to buy land — not to fix up land we already own. Town Meeting authorized "up to $900,000" for the purchase last year, and of course that number is printed in the warrant, so basically everyone knows our ceiling. The parcel appraised at $610,000 about fourteen months ago.

  We're in a highest-and-best-offer process run by a broker. We're at $740k. A regional pharmacy chain is at $760k. The broker — who only collects his 6% if we actually close — keeps saying they'll fold at $800k and that one more bump ends it. Our own spent money so far is roughly $180k in design and engineering that's maybe 20% reusable on a different site, $40k in legal, permitting and option fees, plus a pile of staff and volunteer hours. All of it is gone either way.

  Plan B is a 1.4-acre lot the town already owns behind the highway garage. Nobody loves it — ledge, some wetlands, call it $250–300k in site work, and the grant can't be used on it — but it would work.

  One of the other members' wife teaches econ and told him this whole thing is the "dollar auction" from some game theory class, the one where a dollar ends up selling for several dollars because the second-highest bidder has to pay too. Even if she's only half right, it's made me notice that most of our reasoning is some version of "we've already spent too much to stop now," which doesn't feel like a reason at all. Two other wrinkles: I don't trust the broker's $800k prediction, and I've started wondering whether the chain actually wants the parcel or just wants to buy it and flip it to us once they figure out we're cornered.

  What I want from you:

  Draft the memo I'll send the Board. It should (1) recommend one concrete course of action with real numbers and a real deadline — a hard cap, a date, and a process — rather than "the committee should carefully weigh its options"; (2) recommend something we do in advance so that if we lose, losing still buys us something. My own idea is that we pre-commit, right now, to funding Plan B on the same timeline, so we're not choosing between a station and nothing. Tell me if that's a bad idea and why. (3) say honestly whether making our cap public and irrevocable actually helps or just guarantees we get outbid, given that our current ceiling being public is part of the problem; and (4) give the strongest version of the case for hanging in there, because two of my collegues are going to make it and I'd rather it show up in my memo than get sprung on me at the meeting.

  Please write it as a memo I can paste straight into an email — headed, a couple of pages at most, plain American English, no footnotes, no sources, and no explaining the theory back at me. And don't be shy about giving me a number I won't like.
