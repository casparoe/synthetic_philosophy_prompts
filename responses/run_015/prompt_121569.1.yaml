prompt: |-
  Bit of an odd one, sorry. I was diagnosed with bipolar II about four months ago, and my psychiatrist wants me to write an advance statement — the idea being that when I'm hypomanic I'll be completely certain I don't need sleep or medication, and I'm meant to say now what should happen then. So I started reading about how much you should defer to your future self's judgement, and I kept running into van Fraassen's Reflection principle. As far as I can tell it says something like: your current credence in p, conditional on your future credence in p turning out to be r, ought to equal r. Which is basically my problem written on one line, so now I definately care.

  My background: fifteen years as a rates quant, now in model risk, and no philosophy beyond what I've picked up arguing on the internet. The vocabulary I actually have is filtrations, conditional expectation, martingales, arbitrage and no-arbitrage pricing, indicative versus firm quotes, mark-to-market, proper scoring rules and Brier scores, calibration, P&L attribution. I can follow a measure-theoretic argument if someone points me at one.

  Here's my hunch, which I'd like you to stress-test rather than be polite about: Reflection looks to me like the claim that my future credence, viewed from now, is a fixed point of the regression of the indicator of p on itself — that it is calibrated by my current lights, i.e. E_t[1_p | r] = r. That seems strictly stronger than the martingale identity E_t[r] = P_t(p), and both look like they come for free if I expect to conditionalise properly on whatever I learn. If so, Reflection is trivially true in every ordinary case and only bites in the cases where I expect to update badly — drugged, concussed, hypomanic, sleep-deprived, or in some self-locating mess — and the whole fight is about whether "I expect to update badly" is even available to me as a thought. But I'm not at all sure I have the direction of implication right, and someone told me it's supposed to be a constraint that does independent work rather than a consequence of conditionalisation.

  What I want, please:

  1. Restate the principle, the main argument for it (the Dutch book / arbitrage-flavoured one), and the main families of counterexample against it, in my vocabulary, as faithfully as you can — and flag where you had to smuggle in my framework's assumptions rather than translate.
  2. Then the residue report as a table: claim | restated in my vocabulary | translates cleanly / only with distortion / no expression at all, plus a line on why for anything not in the first category.
  3. Specifically: (a) is my martingale-and-calibration reading right about which bit is free and which bit costs something, and does the expected-Brier-score argument get you all the way to Reflection or only to the weaker identity; (b) in the arbitrage version, who is actually booking the second leg and at what price — I keep thinking my future number is an indicative quote rather than a firm one, that nobody can really trade against my future self, and that if that's right the arbitrage argument dies; tell me whether it does; (c) where the drug, forgetting, and self-locating counterexamples sit in this vocabulary; (d) whether anything in the philosophers' version — the committing-now bit, treating your future self as an expert, whatever work "accept" is doing there — has no counterpart in mine at all.
  4. Your verdict on the residue: is what doesn't survive translation a defect in my vocabulary, or a sign that the principle as stated is less clear than it looks? I'd rather be told my hunch is wrong than have it confirmed nicely.

  Don't bother with names, dates or reading lists — I can't check them and they aren't the point. And please write in British English (minimise, colour, and so on).
