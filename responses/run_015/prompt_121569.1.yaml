  2.  **Deconstruct the Reflection Principle (Van Fraassen):**
      *   *Standard Form:* $P_t(A | P_{t'}(A) = r) = r$.
      *   *Meaning:* Your current probability for $A$, conditional on your future probability for $A$ being $r$, should be $r$.
      *   *Relation to Conditionalisation:* If you know you will conditionalise on new evidence $E$, then $P_{t'}(A) = P_t(A | E)$. By the law of total probability/martingale property, $P_t(A) = E_t[P_{t'}(A)]$. But Reflection is stronger; it's about the *distribution* of future credences, not just the mean.
      *   *Dutch Book Argument:* If you violate Reflection, a bookie can offer you bets now and later that guarantee a loss.
      *   *Counterexamples:* Forgetfulness, self-locating beliefs, irrational changes (drugs/mania).

  3.  **Translate to Quant Vocabulary:**
      *   *Probability Space:* $(\Omega, \mathcal{F}, P)$.
      *   *Filtration:* $\mathcal{F}_t$ representing information at time $t$.
      *   *Credence:* $P_t(A) = E[1_A | \mathcal{F}_t]$.
      *   *Future Credence:* $X = P_{t'}(A) = E[1_A | \mathcal{F}_{t'}]$. This is a random variable $\mathcal{F}_{t'}$-measurable.
      *   *Reflection:* $E[1_A | X = r] = r$. Or more generally, $E[1_A | X] = X$ almost surely.
      *   *Martingale Property:* $E[X | \mathcal{F}_t] = P_t(A)$. This is the "no-arbitrage" condition for beliefs (efficient market hypothesis for beliefs).
      *   *Calibration:* $E[1_A | X] = X$. This means the forecast $X$ is unbiased conditional on its own value.
