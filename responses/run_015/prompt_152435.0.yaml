prompt: |-
  I run model risk for a vendor that ships churn and collections scoring models to around forty community banks and credit unions. About four times a year we re-fit each model, and before a re-fit ships, an analyst has to sign off on the feature set: roughly sixty candidate features a quarter, each reviewed by someone with SQL and applied statistics but no philosophy, in twenty to thirty minutes, on a one-page internal form that ends in one of four dispositions — admit; admit with mandatory post-deployment drift monitoring; admit only if re-derived from base fields; reject — plus three lines of rationale that I countersign and that compliance reads for fair-lending exposure. Right now my analysts justify a feature almost entirely by its lift on an out-of-time holdout, and I have come to think that check is nearly circular for exactly the features that worry me. A grue-style predicate — say, one that applies to accounts opened before our 2021 onboarding redesign and to accounts opened after it only if they satisfy some unrelated condition — fits any finite run of past data exactly as well as the honest predicate does, so a holdout carved out of the same pre-build window cannot separate them, and the difference only appears after deployment, when we have already shipped and the banks have already acted on the scores.

  What I want from you is a written procedure my analysts can run per feature, grounded in whatever is actually usable from the philosophical literature on the new riddle of induction — Goodman's idea that projectibility tracks the entrenchment of a predicate in a vocabulary that has a real history of being projected, the point that grue and green are interdefinable so that no purely syntactic or definitional test can adjudicate between them, and the role of higher-level overhypotheses about kinds. It has to survive translation to people who will not read any of that: give the steps in the order they should be run, say what counts as a sufficient answer at each step, say what to do when a step cannot be answered from the data and documentation we actually have (including what an analyst should use as a working proxy for entrenchment — e.g. whether the predicate's family shows up in previously shipped models, in monitoring reports, or in how the bank's own staff describe their customers), and mark explicitly which steps are judgment calls dressed up as procedure and where the call has to be handed to me or to compliance because it is about values and cost asymmetry rather than facts. It also has to handle the cases that break the simple picture: features anchored to a date or to the scoring run itself; features defined by a threshold the bank sets and periodically changes, so their extension silently shifts; features defined by reference to another model's output, so that the predicate's extension moves when we act on the prediction; and features we cannot state in words at all, such as a thirty-two-dimensional embedding trained on transaction text, where the question of what predicate is being projected may not be answerable in the vocabulary of the form.

  Please apply the finished procedure to three features from our current build and show the filled-in reasoning, not just the verdict. First, legacy_cohort: true of an account if and only if it was opened before the 2021 onboarding redesign; it is in the champion collections model and accounts for about eight percent of its lift. Second, referred_by_legacy_rules: whether the account was flagged for collections under the rule set we retired in 2022 — it is the single highest-gain feature in the new build, and its extension was produced by a system we no longer run. Third, a thirty-two-dimensional embedding of transaction description strings from a pretrained model, which we have reason to think encodes the transaction month because the raw strings contain month tokens; here I want to know what the procedure even asks, given that no one can write down the predicate. If your procedure implies that the out-of-time holdout result is close to worthless for features of the first two kinds, say so plainly rather than softening it, even though that is the evidence my team has been signing off on for years. Finally, tell me what the procedure cannot do: what it has to say about a genuinely new kind — we are about to score behaviour on a payment product that has existed for eleven months, so no predicate for it has any projection history — and how it handles the tension between entrenchment and mechanism, since we usually know a causal story for the features we trust and entrenchment as such seems indifferent to whether there is one.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **User Role:** Model Risk Manager for a vendor shipping churn/collections models to ~40 community banks/CUs.
      *   **Current Process:** Quarterly re-fit, ~60 features/quarter, analyst review (20-30 mins/feature), 1-page form, 4 dispositions (Admit, Admit+Monitor, Admit+Re-derive, Reject), 3-line rationale.
      *   **Problem:** Analysts rely on out-of-time (OOT) holdout lift, which is circular for "Grue-style" predicates (features that fit past data perfectly but fail post-deployment due to structural breaks or arbitrary definitions).
      *   **Goal:** A written procedure for analysts grounded in Goodman's "New Riddle of Induction" (projectibility, entrenchment, overhypotheses) but translated into practical steps for non-philosophers.
      *   **Requirements:**
          *   Step-by-step procedure.
          *   Define sufficient answers/proxies for abstract concepts (e.g., entrenchment).
          *   Handle edge cases (date-anchored, threshold-shifting, recursive/model-dependent, uninterpretable embeddings).
          *   Identify judgment calls vs. factual checks (escalation points).
          *   Apply the procedure to three specific features (`legacy_cohort`, `referred_by_legacy_rules`, `transaction_embedding`).
          *   Be honest about OOT holdout limitations.
          *   Address limitations of the procedure (genuinely new products, entrenchment vs. mechanism).

  2.  **Philosophical Grounding (Goodman & Model Risk):**

      *   *Goodman's Grue:* An object is "grue" if observed before time $t$ and green, or after $t$ and blue. Before $t$, "green" and "grue" are empirically indistinguishable.
      *   *Projectibility:* Only "entrenched" predicates (like "green") are projectible into the future. "Grue" is not.
      *   *Entrenchment:* A predicate is entrenched if it has a history of successful projection in our vocabulary/practice.
      *   *Overhypotheses:* Higher-level generalizations that support specific hypotheses (e.g., "chemical composition determines color" supports "green" over "grue").
      *   *Translation to Model Risk:*
          *   "Green" = Stable, causal, business-logical features (e.g., "days past due").
          *   "Grue" = Spurious, data-leaky, regime-dependent features (e.g., "ID < 10000", "Pre-2021 Cohort").
          *   "Entrenchment" = Feature stability, historical usage, business intelligibility.
          *   "Overhypotheses" = Causal mechanisms, business rules, regulatory constraints.

  3.  **Drafting the Procedure (The "Projectibility Protocol"):**

      *   *Constraint:* Must fit a 20-30 minute review. Must be actionable by SQL/Stats analysts.
      *   *Step 1: The Intelligibility Test (Can you name it?).* If you can't define the extension without referencing the data generation process itself, it's suspect.
      *   *Step 2: The Entrenchment Proxy (Has it been projected before?).* Check model inventory, business glossaries, regulatory reports.
      *   *Step 3: The Counterfactual Stability Test (What if the world changed slightly?).* If the definition relies on a specific cutoff/date that won't exist tomorrow, it's Grue-like.
      *   *Step 4: The Mechanism Check (Overhypotheses).* Is there a causal story?
      *   *Step 5: The Disposition Logic.* Mapping results to the 4 dispositions.
      *   *Escalation:* Where values/cost asymmetry enter (Fair Lending, Risk Appetite).

  4.  **Refining the Steps for the Analyst:**

      *   Need specific proxies for "Entrenchment."
          *   Proxy A: Feature exists in >1 previous model version?
          *   Proxy B: Feature maps to a field in the Core Banking System dictionary?
          *   Proxy C: Can a loan officer explain it to a borrower?
      *   Need specific handling for "Grue" (Time/ID dependence).
      *   Need specific handling for Embeddings (Black box predicates).

  5.  **Applying to the Three Features:**

      *   *Feature 1: `legacy_cohort` (Pre-2021 Onboarding).*
          *   Analysis: This is classic Grue. It defines a set by a historical accident. Once 2021 passes, the set is fixed, but the *meaning* decays as the cohort ages/dies off. It's not projectible because "Pre-2021" becomes less relevant over time.
          *   Verdict: Reject or Admit with Re-derive (must find *why* pre-2021 matters, e.g., product type).
      *   *Feature 2: `referred_by_legacy_rules` (Flagged by retired 2022 system).*
          *   Analysis: This is "Grue" via dependency. The extension is fixed in the past, but the *rule* is gone. Future accounts cannot trigger this. It's a leakage of past policy, not future risk.
          *   Verdict: Reject. It's look-ahead bias/policy leakage.
      *   *Feature 3: `transaction_embedding` (32-dim).*
          *   Analysis: Unintelligible predicate. Cannot check entrenchment linguistically. Must check stability of the *input* and the *encoder*.
          *   Verdict: Admit with Mandatory Drift Monitoring (focus on input drift).

  6.  **Addressing the "Hard Truths" & Limitations:**

      *   *OOT Holdout:* Acknowledge it is useless for Grue predicates within the same regime.
      *   *New Products:* Entrenchment fails here. Need to rely on Mechanism/Overhypotheses (transfer learning from similar products).
      *   *Entrenchment vs. Mechanism:* Entrenchment is correlation history; Mechanism is causal story. We need both. A feature can be entrenched but biased (e.g., zip code). Mechanism checks catch fairness/causality.

  7.  **Structuring the Output:**

      *   **Introduction:** Acknowledge the Goodman parallel.
      *   **The Procedure (Projectibility Assessment Protocol - PAP):** Step-by-step instructions.
      *   **Decision Matrix:** Mapping answers to dispositions.
      *   **Escalation Triggers:** When to involve the Manager/Compliance.
      *   **Application to Features:** Detailed walkthrough of the three examples.
      *   **Limitations:** New products and the Mechanism/Entrenchment tension.

  8.  **Self-Correction/Refinement during drafting:**

      *   *Critique:* Is "Entrenchment" too abstract?
      *   *Fix:* Define it as "Feature Lineage." Has this *concept* (not just the column) appeared in prior models or business reports?
      *   *Critique:* What about the embedding? Goodman talks about predicates. Embeddings don't have predicates.
      *   *Fix:* Treat the embedding as a "Black Box Predicate." The test shifts from "Is the predicate entrenched?" to "Is the *mapping function* stable?"
      *   *Critique:* The user wants me to be plain about OOT holdouts.
      *   *Fix:* Add a specific warning box in the procedure: "The Holdout Fallacy."
      *   *Critique:* Ensure the distinction between "Admit with Monitoring" and "Reject" is clear.
      *   *Fix:* Monitoring is for features that are projectible but volatile. Reject is for features that are logically non-projectible (Grue).

  9.  **Final Polish:** Check tone (professional, authoritative, practical), ensure all constraints from the prompt are met (3 lines of rationale proxy, specific dispositions, etc.). *Self-correction on the "3 lines of rationale":* The procedure needs to generate the text that goes into those 3 lines.

  10. **Final Review against Goodman:** Ensure I'm not misusing "Grue." Grue is about time-dependent definitions. `legacy_cohort` is exactly Grue (Green before T, Blue after T). `referred_by_legacy_rules` is slightly different—it's a "fixed extension" feature that cannot apply to new data, making it non-projectible by definition. I need to make sure the procedure distinguishes these.

      *   *Refinement on `referred_by_legacy_rules`:* This isn't just Grue; it's impossible for new data. It's a "historical artifact" feature. It predicts well on the holdout because the holdout contains the artifacts. It predicts nothing on *new* accounts. This is a hard Reject.
      *   *Refinement on `legacy_cohort`:* This applies to new accounts? No, "opened before 2021". New accounts opened in 2024 will always be False. This is a decaying feature. It loses predictive power as the cohort shrinks. It is projectible only in the sense that "Old Accounts behave differently," but the *predicate* "Pre-2021" is not stable. It should be re-derived to "Account Age" or "Onboarding Version."

      *   *Refinement on Embedding:* Goodman's issue is about *description*. If we can't describe it, we can't check entrenchment. The procedure must force a "Proxy Description" or fail the feature.

      *   *Let's write.*
answer: |-
  # The Projectibility Assessment Protocol (PAP)

  **Purpose:** To replace reliance on out-of-time (OOT) holdout lift as the sole validator of feature quality. OOT holdouts measure *fit within a historical regime*; they do not measure *projectibility into a future regime*. This procedure identifies "Grue-style" predicates—features that fit past data perfectly but fail post-deployment because their definition relies on accidental historical boundaries rather than stable business logic.

  **Audience:** Model Risk Analysts (SQL/Stats background).
  **Time Budget:** 20–30 minutes per feature.
  **Authority:** This procedure overrides OOT lift metrics when Steps 2 or 3 fail.

  ---

  ## Part 1: The Procedure

  ### Step 1: The Intelligibility Test (The "Predicate" Check)
  **Action:** Write a one-sentence definition of the feature that does **not** reference specific dataset IDs, build dates, or model version numbers.
  *   **Sufficient Answer:** "Days past due at time of observation" or "Ratio of inbound transfers to balance."
  *   **Insufficient Answer:** "Rows where `onboarding_id` < 50000" or "Flagged by the 2022 rules engine."
  *   **Failure Mode:** If you cannot define the feature without referencing the specific historical process that generated the data, mark **FAIL**.
  *   **Edge Case (Embeddings):** For vector embeddings, you must identify the *input vocabulary* (e.g., "transaction description strings"). If the input source is unstable or undefined, mark **FAIL**.

  ### Step 2: The Entrenchment Proxy (The "History" Check)
  **Action:** Determine if the *concept* (not just the column) has a history of successful projection in our ecosystem. Use these three proxies in order:
  1.  **Model Lineage:** Has this feature (or a semantic equivalent) appeared in at least two prior champion/challenger models?
  2.  **Business Glossary:** Does this feature map to a field in the client's Core Banking System dictionary or a regulatory report (e.g., Call Report)?
  3.  **Staff Vernacular:** Can a loan officer or collections agent describe this attribute to a customer without referencing our model? (e.g., "You were late" vs. "You have a high embedding score").
  *   **Sufficient Answer:** "Yes" to at least one proxy.
  *   **Failure Mode:** "No" to all three. The feature is "new" in a way that suggests it captures noise or a transient artifact.
  *   **Note:** A feature can be entrenched but biased. Step 4 handles values.

  ### Step 3: The Counterfactual Stability Test (The "Grue" Check)
  **Action:** Ask: "If we deployed this model six months later than planned, would the definition of this feature change for the *same* customer?"
  *   **Sufficient Answer:** "No. The customer's behavior defines the feature."
  *   **Failure Mode:** "Yes." If the feature value depends on the *date of the build* (e.g., "Pre-2021 Cohort"), the *threshold* (e.g., "Top 10% of Q3"), or a *retired system* (e.g., "Flagged by Legacy Rules"), it is non-projectible.
  *   **Edge Case (Thresholds):** If a threshold is set by the bank (e.g., "Overlimit > $500"), verify if the $500 is static or periodically adjusted. If adjusted, the feature is unstable. Mark **UNSTABLE**.

  ### Step 4: The Mechanism Check (Overhypotheses)
  **Action:** Identify the causal story or "overhypothesis" that supports this feature. Why *should* this correlate with churn/collections?
  *   **Sufficient Answer:** "Higher utilization implies cash flow stress" or "Transaction variance implies income instability."
  *   **Failure Mode:** "It predicts well in the holdout." (This is circular).
  *   **Escalation:** If the mechanism is plausible but touches on protected classes (e.g., "neighborhood stability"), escalate to Compliance immediately. Do not write the rationale yet.

  ### Step 5: Disposition Logic
  Map your findings to the four dispositions:
  1.  **Admit:** Passes Steps 1–4. Mechanism is clear. Entrenched.
  2.  **Admit + Monitor:** Passes Steps 1, 2, 4. Fails Step 3 (Unstable threshold or drifting definition). Requires PSI/CSI monitoring.
  3.  **Admit + Re-derive:** Fails Step 1 or 3 (Grue-style), but the *underlying signal* is valid. (e.g., "Pre-2021" should become "Account Age" or "Onboarding Version").
  4.  **Reject:** Fails Step 1 (Unintelligible) or Step 4 (No mechanism/Leakage). **Note:** If a feature relies on a retired system (Step 3 Failure), it is a hard Reject, regardless of lift.

  ---

  ## Part 2: Escalation & Rationale

  **When to Escalate to Manager (Me):**
  *   **Step 3 Failure on High Lift:** If a feature provides >5% lift but fails the Counterfactual Stability Test (e.g., it is a "Grue" predicate). This requires a decision on risk appetite: do we take the lift now and accept the decay?
  *   **Step 4 Ambiguity:** If the mechanism is plausible but unproven, and the feature is not entrenched.

  **When to Escalate to Compliance:**
  *   **Fair Lending:** If Step 2 (Entrenchment) relies on proxies that correlate with protected classes (e.g., "Location" or "Transaction Merchant Category") and Step 4 (Mechanism) cannot rule out disparate impact.
  *   **Adverse Action:** If Step 1 (Intelligibility) fails (e.g., Embeddings), we may not be able to generate specific adverse action reasons. Compliance must approve the "reason code" mapping.

  **The Three-Line Rationale (Template):**
  1.  **Status:** [Feature Name] is [Entrenched/New] and relies on [Stable/Time-Bound] logic.
  2.  **Mechanism:** Predictive power is attributed to [Causal Story], not just statistical fit.
  3.  **Risk:** [Monitor for Drift / Re-derive to Stable Field / Reject due to Leakage].

  ---

  ## Part 3: Application to Current Build Features

  ### Feature 1: `legacy_cohort`
  *Definition:* True if account opened before 2021 onboarding redesign.
  *   **Step 1 (Intelligibility):** **FAIL.** The predicate is defined entirely by a historical date. It cannot be applied to a new account opened today (it will always be False). It is a "Grue" predicate: "Green before 2021, Blue after."
  *   **Step 2 (Entrenchment):** **PASS (Weak).** It exists in the champion model. However, it is not in the business glossary as a risk factor; it is an operational artifact.
  *   **Step 3 (Stability):** **FAIL.** The extension of this set is fixed. As time passes, the cohort shrinks and ages. The predictive power will decay not because risk changes, but because the definition creates a vanishing reference class.
  *   **Step 4 (Mechanism):** **WEAK.** The mechanism is not "being pre-2021 causes risk." The mechanism is likely "older onboarding version lacked certain checks."
  *   **Disposition:** **Admit only if re-derived from base fields.**
  *   **Analyst Rationale:**
      > `legacy_cohort` is a time-bound predicate that cannot project to new accounts. Lift is driven by vintage effects, not ongoing risk. Re-derive as `onboarding_version_id` or `account_age_months` to capture the mechanism without the Grue-style decay. OOT lift is misleading here as the holdout shares the same historical boundary.

  ### Feature 2: `referred_by_legacy_rules`
  *Definition:* Flagged for collections under the rule set retired in 2022.
  *   **Step 1 (Intelligibility):** **FAIL.** The definition references a system we no longer run. It is impossible to calculate this feature for any account originated after 2022.
  *   **Step 2 (Entrenchment):** **FAIL.** The rule set is retired. It has no future projection history.
  *   **Step 3 (Stability):** **FAIL (Critical).** This is not just unstable; it is impossible for new data. It is pure data leakage from a past policy regime.
  *   **Step 4 (Mechanism):** **NONE.** There is no causal link between "flagged by a retired system" and "future default" except insofar as the past system correctly identified bad accounts *at that time*. It does not predict *future* behavior of *new* accounts.
  *   **Disposition:** **Reject.**
  *   **Analyst Rationale:**
      > Feature relies on a retired policy engine; extension is fixed in the past and cannot be computed for new bookings. High lift is circular, reflecting past policy alignment rather than future creditworthiness. Usage constitutes look-ahead bias relative to the current operational environment.

  ### Feature 3: `transaction_embedding` (32-dimensional)
  *Definition:* Vector output from pretrained model on transaction description strings.
  *   **Step 1 (Intelligibility):** **PARTIAL.** We cannot write the predicate. We must treat the *input* (transaction strings) as the predicate source.
  *   **Step 2 (Entrenchment):** **FAIL.** No loan officer uses "embedding dimension 4" to describe risk.
  *   **Step 3 (Stability):** **UNSTABLE.** You noted the encoding likely captures "transaction month" via tokens. If the tokenizer or raw string format changes (e.g., bank changes statement layout), the embedding shifts silently.
  *   **Step 4 (Mechanism):** **UNKNOWN.** We suspect it encodes seasonality (month tokens). If so, it is a proxy for time, which is risky (see Feature 1).
  *   **Disposition:** **Admit with mandatory post-deployment drift monitoring.**
  *   **Analyst Rationale:**
      > Predicate is opaque; projectibility relies on stability of input string format and encoder. Suspected encoding of temporal tokens (month) creates Grue-risk if string conventions change. Approve only with strict PSI on input distribution and adversarial testing for temporal leakage.

  ---

  ## Part 4: Limitations & The "New Kind" Problem

  ### 1. The Genuinely New Product (No Entrenchment)
  You asked about a payment product existing for only eleven months. Here, **Entrenchment (Step 2) will always fail.** Goodman's solution to this is *Overhypotheses*.
  *   **Procedure Adjustment:** When Step 2 fails due to novelty, you must strengthen Step 4. You cannot rely on "this worked before." You must rely on "this is like *that*."
  *   **Action:** The analyst must map the new feature to an entrenched feature in a *different* but *analogous* product line (e.g., "This is a revolving credit feature, treat it like a credit card utilization feature").
  *   **Limitation:** This is a judgment call. If the analogy is wrong, the model fails. This requires **Manager Escalation**. The procedure cannot automate the validation of a new kind; it can only force you to declare the analogy you are betting on.

  ### 2. Entrenchment vs. Mechanism
  You noted the tension: we trust causal stories, but Goodman says entrenchment (history of use) is what validates induction.
  *   **The Conflict:** A feature can be entrenched but unfair (e.g., "Zip Code" is highly entrenched in banking vocabulary, but mechanistically suspect for fair lending). A feature can be causal but new (e.g., "Cash flow volatility" is mechanistically sound but lacks entrenchment in legacy systems).
  *   **Resolution:** The procedure treats Entrenchment as a *stability* check and Mechanism as a *validity* check.
      *   **Entrenchment without Mechanism:** Admit with Monitoring (It's stable, but we don't know why it works; watch for breakage).
      *   **Mechanism without Entrenchment:** Admit with Manager Sign-off (It makes sense, but it's unproven; watch for model error).
      *   **Neither:** Reject.
  *   **The Hard Truth:** If a feature is entrenched (e.g., Zip Code) but Compliance determines the mechanism is discriminatory, **Compliance overrides Entrenchment.** Goodman's projectibility is about *prediction*, not *permission*. Our procedure must acknowledge that regulatory permission is a constraint on projectibility.

  ### 3. The Holdout Fallacy
  To answer your specific request plainly: **For features like `legacy_cohort` and `referred_by_legacy_rules`, the out-of-time holdout result is worthless.**
  *   **Why:** The holdout is carved from the *same pre-build window*. It shares the same historical regime. A Grue predicate fits the holdout perfectly because the holdout is also "before T." The error only appears when you cross the boundary T (deployment).
  *   **Instruction:** If Step 3 (Counterfactual Stability) fails, **ignore the OOT lift.** Do not record it in the rationale. Recording it validates the circularity.

  ### 4. The Embedding Problem
  Goodman requires predicates to be expressible in a vocabulary. Embeddings defy this.
  *   **Procedure Limit:** The procedure cannot verify the "meaning" of an embedding. It can only verify the *stability of the pipe*.
  *   **Risk:** We are effectively shipping a "Black Box Grue." If the pretrained model was trained on data that included a temporal artifact (like month tokens), the embedding is a Grue predicate disguised as math.
  *   **Mitigation:** The only defense is **Adversarial Testing.** Before admitting, the analyst must try to predict the "build month" using the embedding. If the embedding predicts the build month, it is a Grue predicate. Reject or strip the signal.
