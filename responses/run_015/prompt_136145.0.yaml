answer: |-
  ### The Prediction
  **She will say cooperation collapses (No).**

  Based on her track record, this scenario combines three "cooperation-killers" she has previously rejected:
  1.  **Decoupled Consequences:** Like the "zero cost to false reporting" in indirect reciprocity, the shadow-debt creates a Tragedy of the Commons. Defection yields immediate private gain, while the cost is delayed and shared globally. The defector does not pay *more* than the cooperator when the threshold hits.
  2.  **Destroyed Assortment:** Like the "one-shot" game, rewiring every round prevents the formation of stable clusters (Case 3) or direct reciprocal relationships (Case 2). Cooperators cannot find each other to protect one another.
  3.  **Opaque Feedback:** Like the "hidden" nature of the debt, agents cannot observe the system state. Without visible signals, there is no way to adjust strategy before the crash.

  ### The Underlying Rule: "Specific Accountability"
  The rule she is running is not just about information or stability in isolation; it is about **Action-Consequence Coupling**.

  For her, cooperation evolves only when the cost of defection is **attributable** to the defector through a reliable channel.
  *   **Direct Reciprocity:** The partner punishes *you* specifically.
  *   **Spatial Grid:** The local cluster isolates *your* invasion.
  *   **Kin Selection:** The genetic cost falls on *your* lineage.
  *   **Indirect Reciprocity (Failed):** Lying had no cost *to the liar*.
  *   **New Scenario (Failed):** The penalty is global. The defector pays the same price as the cooperator. To her, this is indistinguishable from noise.

  In her view, **punishment must be visible, immediate, and specific.** If the penalty is collective (hits everyone) or delayed (hits after threshold), the link between *my action* and *my pain* is broken.

  ### Alternative Rules That Fit Her Verdicts
  Two other heuristics explain her past data equally well, which makes diagnosing her true logic difficult:

  1.  **Structural Assortment (Network Stability):**
      *   *Logic:* Cooperation requires stable topology so cooperators can cluster and exclude defectors.
      *   *Fits:* Explains Case 2 (Iterated), Case 3 (Fixed Grid), and Case 4 (Kin/Fixed Genetics). Explains failure in Case 1 (No structure) and New Scenario (Rewiring).
      *   *Weakness:* Doesn't fully explain Case 5 (Indirect Reciprocity). Public history allows partner switching (dynamic network), yet she said it collapses. This suggests structure alone isn't enough; *truth* matters.

  2.  **Information Fidelity (Signal Integrity):**
      *   *Logic:* Cooperation requires that information about behavior be costly or verifiable.
      *   *Fits:* Explains Case 5 (Cheap talk fails) and New Scenario (Hidden debt). Explains Case 2 (Actions are visible signals).
      *   *Weakness:* Doesn't fully explain Case 3 (Spatial). In spatial games, you don't need deep info about history, just local density. She accepted this with only a clustering coefficient metric, implying structure can sometimes substitute for information.

  ### The Critical Test Case
  To distinguish between **Specific Accountability** (her likely rule), **Structural Assortment**, and **Information Fidelity**, run this single experiment:

  **The Case:** **Fixed Spatial Grid (High Clustering) + Global Shadow-Debt (Hidden).**
  *   *Setup:* Keep the network stable (like Case 3) so clusters can form. Keep the "shadow-debt" mechanism from the new scenario (global punishment, hidden accumulation).
  *   *Why this works:* It isolates **Structure** from **Accountability**.
      *   The New Scenario failed on both Structure (Rewiring) and Accountability (Global Debt).
      *   Case 3 proved Structure *can* support cooperation.
      *   Case 5 proved Bad Incentives *destroy* cooperation.

  **Interpretation:**
  *   **If she says YES:** Her rule is **Structural Assortment**. She believes that if cooperators cluster tightly enough (Case 3 logic), they can survive even a global, delayed punishment mechanism (perhaps the cluster collapses together, but cooperators still outperform defectors within the cluster).
  *   **If she says NO:** Her rule is **Specific Accountability**. She believes that no amount of network stability can save cooperation if the penalty for defection is not individually attributable (Case 5 logic). The "Tragedy of the Commons" aspect of the global debt overrides the spatial protection.

  *Given her rejection of the "zero cost" indirect reciprocity, the bet is on **NO**, confirming that for her, **incentive alignment trumps network topology**.*
