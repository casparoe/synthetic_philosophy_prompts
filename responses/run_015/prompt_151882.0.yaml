answer: |-
  The standard critique of Kant's ethics regarding non-human animals is that it is morally impoverished. By restricting direct moral standing to rational agents, Kant seemingly relegates animals to the status of mere things, forbidding cruelty only because it might coarsen the human agent's treatment of other humans. This is often dismissed as the "indirect-duty view," characterized as a historical relic incompatible with modern moral intuition. However, this dismissal relies on a caricature of indirect duty as merely *instrumental mediation*—the idea that animals are simply practice dummies for human virtue. I argue for a reconstructed position: *constitutive mediation*. On this reading, our duties regarding animals are indirect in terms of *obligation* (owed to humanity in our own person) but direct in terms of *moral phenomenology*. The suffering of a sentient being is not morally inert; rather, responsiveness to that suffering is a constitutive element of a fully realized moral character. This view avoids the charge of speciesism without conceding the metaphysical claims of direct-duty animal rights theory.

  To understand the strength of this reconstruction, we must distinguish it from the crude instrumental view. Instrumental mediation suggests that kicking a dog is wrong for the same reason practicing piano on a broken keyboard is inadvisable: it builds bad habits for the real performance (interacting with humans). This makes the prohibition contingent. If one could kick a dog without affecting their human relationships, the instrumental view offers no objection. Constitutive mediation, conversely, argues that moral agency is not a switch that turns on only when facing rational beings. It is a disposition—a texture of the will—that must remain permeable to the reality of suffering as such. The duty to avoid cruelty is a duty to preserve the integrity of one's own moral sensibility. If an agent hardens their heart to suffering, they damage the very faculty required to recognize moral claims, regardless of the source of those claims. The animal's pain does not generate a duty *from* the animal, but it generates a demand *on* the rational agent to maintain a capacity for sympathy.

  This distinction allows the Kantian to evade the charge of speciesism. Speciesism implies an arbitrary preference for one's own kind. Direct-duty theorists argue that because animals suffer, they possess intrinsic value that demands recognition. The Kantian reply is not to deny the reality of suffering, but to locate the locus of obligation. Moral obligation is necessarily a property of rational agency; to speak of a "duty" owed *by* a rock or *to* a rock is category confusion. However, acknowledging that obligation stems from rationality does not justify ignoring the suffering of non-rational beings. To be a moral agent is to be a being who recognizes the negative value of suffering. If an agent draws a hard line at the boundary of species, saying "suffering matters only if the sufferer can sign a contract," they are not protecting rationality; they are indulging in a moral blindness that weakens their own agency. Thus, the constitutive view demands we treat animals with the *regard* due to beings that suffer, not because they have rights, but because we have a duty to be the kind of beings who respect suffering.

  Consider the case of the technologically advanced society that has eliminated animal agriculture through synthetic food production. In this world, no animals are harmed for food. The material outcome is perfect: zero animal suffering. However, the citizens of this society view animal pain with complete indifference. If they were to encounter a wounded animal in the wild, they would feel no pull to assist, no revulsion at the pain, and no sense that the situation is morally charged. They view animal suffering as one might view a tree falling in a storm—a neutral event in nature.

  On the crude instrumental view, this society is morally blameless. Since no cruelty is practiced and no human relationships are damaged by this indifference (assuming they treat each other well), there is no violation. But on the constitutive-mediation reading, this society is deeply morally defective. They have achieved a negative peace regarding animals but have sacrificed a positive moral virtue. The missing feature is the cultivation of *natural sympathy* as a propaedeutic to morality. Kant acknowledges that while sympathy is not itself duty, it is a natural predisposition that supports the fulfillment of duty. It is the "sensory antenna" of the moral will.

  By cultivating total indifference to animal pain, these citizens have actively atrophied a crucial component of their moral nature. They have severed the link between the perception of suffering and the impulse of moral concern. While they currently do no harm, their moral disposition is brittle. A will that is indifferent to suffering is one step away from being instrumentalizing toward rational beings who are vulnerable, disabled, or temporarily incapacitated. The defect is not that they violate the rights of animals (which, on this view, do not exist), but that they have failed in the duty of self-perfection. They have allowed their moral sensibility to become narrow and rigid, rather than expansive and responsive. They treat the absence of suffering as a technical problem solved by engineering, rather than a moral good sustained by empathy. In doing so, they risk turning their own rationality into a cold calculus, devoid of the humane warmth that makes moral law livable.

  A direct-duty theorist will object that this reconstruction is ultimately narcissistic. They will argue that by grounding the protection of animals in the state of the human agent's soul, we still fail to acknowledge the animal *itself*. If the society in the example somehow guaranteed that their indifference would never lead to human-on-human cruelty, the Kantian would still object. The direct-duty theorist asks: "Why is it not enough that the animal suffers? Why must we worry about the human's character?" They claim this view fails to take the animal seriously as a victim.

  This objection, however, misunderstands the normative force of the constitutive view. The charge of narcissism assumes that the only way to take a victim seriously is to grant them metaphysical rights-bearing status. I argue that this is a false dichotomy. To take a victim seriously is to respond appropriately to their plight. The constitutive view demands the *same practical response* as the direct-duty view: do not cause suffering, alleviate it where possible, and do not view it with indifference. The difference is purely meta-ethical.

  Furthermore, the direct-duty view faces its own philosophical peril: it risks inflating the moral status of animals to a point that creates conflicts with human obligations that cannot be resolved. By grounding the duty in the human agent's self-constitution, the Kantian preserves a clear hierarchy of obligation without granting license for cruelty. The response to the narcissism charge is that morality *is* necessarily from the perspective of the agent. We cannot step outside our rational nature to adopt a "view from nowhere." Therefore, the only coherent way to protect animals is to make their protection a requirement of human excellence.

  In the case of the indifferent synthetic society, the direct-duty theorist says the society is wrong because the animals *would* be wronged if they were hurt. The constitutive Kantian says the society is wrong because the citizens *are* wronging themselves by becoming indifferent to the reality of pain. The latter is arguably more robust. It explains why we should care about animal suffering even in contexts where no "rights" are technically violated (such as wild animal suffering or historical extinction events). It demands a stance of active moral care, not just passive non-violation.

  Therefore, the reconstructed indirect-duty view is not a relic, but a rigorous account of moral psychology. It posits that our relationship with the non-rational world is a mirror for our relationship with the moral law. The society that eliminates suffering but cultivates indifference has not solved the moral problem; they have merely sanitized the environment while poisoning the moral agent. They lack the virtue of *humanity* in its fullest sense—the disposition to feel and promote the well-being of living creatures as a way of honoring the gift of rational agency. By refusing to acknowledge the moral significance of animal suffering, they do not elevate humans; they diminish the very rationality that was supposed to set them apart. The duty to animals is indirect in its source, but it is constitutive of the moral life, demanding that we remain beings who cannot look upon suffering without a stir of conscience.
