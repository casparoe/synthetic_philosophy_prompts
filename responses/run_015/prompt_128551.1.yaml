      *   **The Tension:** "Answer the claim in front of us" (Deontological/Contractualist/Member-focused) vs. "Do the most good with the money" (Consequentialist/Utilitarian).

  2.  **Deconstruct the Precedents:**
      *   *Precedent 1 (Member Surgery, $600, self-inflicted):* Funded. Rule: Fault is irrelevant. Need is paramount.
