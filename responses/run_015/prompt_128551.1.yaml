      *   *Refining the Verdict:* I need to be careful. If I say "Don't fund," I might be ignoring the duty to the member. If I say "Fund," I ignore the harm to others. The *consistent* move based on Precedent 4 (Sustainability/Capacity) and 6 (Multiplier) is to acknowledge the harm. If the harm is real (3 lose out vs 1 saved), the math says don't fund *via that mechanism*.
      *   *Refining the Rules:*
