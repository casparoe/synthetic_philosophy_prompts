prompt: |-
  I was arguing with my friends about whether democracy is basically broken or just badly designed, and it made me realize I don't actually know what Dewey's experimentalism would say about our current mess — so I'm prepping for an interview on my podcast The Inquiry Room (mostly grad students and philosophy of science nerds). Next week's guest is a philosopher reviving Dewey's line that democracy isn't mainly a voting mechanism but a form of social inquiry; she thinks polarization and misinformation aren't moral failures but epistemic ones, like a science experiment where the controls are broken and nobody can separate signal from noise. Her claim is that Dewey's phases — problematic situation, hypothesis formation, testing — should literally structure public deliberation, maybe through some distributed 'laboratory' model, not just serve as metaphors.

  Can you draft maybe eight to ten interview questions that stay deep in the weeds? I need one pressing whether treating citizens as peer-reviewers in a democratic lab requires an expert class to filter out manufactured data — then a follow-up keyed to her likely reply that filtering is just part of good inquiry, asking if that collapses back into technocrasy. Another should tackle the tension between Dewey's pluralism and his convergence on warranted assertability: does democracy need shared answers or just continuous problem-solving? I also want one asking what counts as a genuinely problematic situation in politics, since if everything is framed as a technical puzzle we might lose the moral conflict that makes politics political. And please include a slightly niche/odd question about her idea that rotating cycles of public attention map onto Dewey's inquiry phases — is that a real structural analogy or just a stretched metaphor? Keep them conversational but sharp, with anticipated answers built into the follow-ups. No generic biography stuff; my co-host bailed last minit so these need to carry a full 45 minutes. This is just for my prep doc so a typo or two is totally fine.
