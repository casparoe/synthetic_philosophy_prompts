answer: |-
  There are three genuine tensions, but the deepest fault line runs between the necessity claim in (2) and the exception clause in (4).

  | Rank | Tension | Severity | Resolution Cost |
  | :--- | :--- | :--- | :--- |
  | 1 | (2) vs. (4) | Logical | Redefine "route" or drop (4). |
  | 2 | (5) vs. (7) | Functional | Lose critical leverage or drop (5). |
  | 3 | (4) vs. (5) | Consistency | Admit ad hocery or drop (5). |

  One apparent tension dissolves immediately: (1) and (2) are compatible. That reasons are facts (1) does not preclude their existence being conditioned on an agent's motivational accessibility (2); this is standard Hybrid Internalism. The contradiction lies elsewhere.

  Your suspicion regarding idealization in (2) is correct and decisive. "Sound deliberation" is the lever. If (2) permits idealization sufficient to correct psychological blocks (depression), then the patient *has* a route (counterfactual health), rendering (4) redundant rather than contradictory. However, this same idealization threatens (5). If sound deliberation involves substantive rational requirements (per (3)), the contented exploiter also acquires a route to other-regarding action, violating (5). If (2) is strictly actualist to save (5), it cannot save (4), as the depressed patient literally lacks a route from her actual set.

  Apply (1), (2), and (3) to the cases. (1) asserts facts favor medication and cessation of exploitation for both. (2) demands a route from the actual set. The patient lacks this actually; the exploiter lacks this actually. (3) allows the route to be non-instrumental. If you idealize (2) enough to bypass the patient's depression (satisfying 4), you inevitably bypass the exploiter's lack of concern (violating 5), unless you draw a principled distinction between "pathology" and "constitution." But if reasons are facts (1), why does the etiology of the motivational lack matter for the *existence* of a reason, provided the deliberative route is sound? There is no principled difference here; both are gaps between fact and motivation. Treating them differently makes (4) and (5) an unstable pair.

  Furthermore, (5) undermines (7). If the exploiter has no reason to stop, your condemnation lacks normative leverage; it becomes mere preference signaling. To earn its keep (7), the account must license criticism that implies a reason. Retaining (5) hollows out the critical project.

  The cheapest commitment to lose is (5). Abandoning set-respect allows you to maintain a robustly idealized reading of (2) that absorbs (4) (the patient has a route if healthy) while securing (7) (the exploiter has a reason if rational). This costs you the intuition that some coherent agents are reason-proof, but it saves the system from logical contradiction and functional impotence.

  You should abandon (5), accepting that the contented exploiter does have reasons, which preserves the critical purchase of (7) at the cost of conceding that some reasons are independent of contingent concerns.
