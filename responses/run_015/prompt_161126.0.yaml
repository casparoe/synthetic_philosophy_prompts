  I'm a high school senior with one semester of independent study — roughly forty working hours, a good school library, but no archives, no specialist journals, and no interviews — to write a short field guide for my school's crisis-simulation and debate club on when reaching for a historical analogy (Munich, Vietnam, the Thucydides trap) actually sharpens a judgment and when it only decorates one. Which five lines of inquiry should I spend those hours on, and in what order?

  I want the ranking defended rather than asserted: tell me which criterion you are weighting — how much a line would change the forecasts my club actually makes, how many of the other lines depend on it, whether it is tractable for someone limited to secondary sources, how neglected it is in writing aimed at general readers — and name what I would have to find in the first few weeks to move a line up or down the list.

  Place three suspicions of mine rather than simply accepting them: that the stock of analogies we can reach for is survivorship-biased, since the ones still in circulation tend to be those that flattered the person who used them while analogies that produced quiet successes were forgotten; that an analogy earns its keep only if its user can name, before the outcome is known, the observable that would make them abandon it, and that most famous ones fail this test because they cut both ways and so discriminate nothing; and that most of the damage is done by analogies doing legitimizing work in the costume of predictive work. Say plainly if any of these is overrated, or is downstream of something I have not listed.

  Give your answer as a numbered list of exactly five items, each one or two sentences, with no introduction or conclusion.
