      *   **Core Question:** Are big outcomes (democracy, capitalism) inevitable, or is that hindsight bias? What's the actual reasoning behind inevitability vs. contingency?

  2.  **Deconstruct Path Dependence:**
      *   *Standard Definition:* Past decisions influence future possibilities.
      *   *Weak Form (Remanence):* Switching costs are high. You *could* change, but it hurts. (e.g., staying on a suboptimal tech stack because migration is expensive).
      *   *Strong Form (Lock-in/Non-ergodicity):* Small early events determine the final equilibrium. The system doesn't converge to a single optimal state; it depends on the sequence.
