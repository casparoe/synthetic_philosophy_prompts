reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Topic:** Path Dependence.
      *   **Specific Focus:** The "strong" vs. "weak" versions. Is history locked in (inevitability of big outcomes like democracy/capitalism) OR is it just sticky/hard to switch (contingency)?
