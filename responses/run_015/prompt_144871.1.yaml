answer: |-
  You've hit on the central tension in historical sociology and institutional economics. You're asking about the difference between **remnance** (it's expensive to switch) and **non-ergodicity** (the sequence of events determines the final state, meaning the "optimal" outcome is not guaranteed).

  Here are the conceptual guts of the argument, stripped of the textbook definitions.

  ### 1. The Mechanism: It's Not Habit, It's Power
  The QWERTY example is weak because it relies on coordination costs (everyone needs to type the same way). But when we talk about capitalism or democracy, the "lock-in" mechanism isn't just habit; it's **distributive consequences**.

  When a path is chosen (e.g., a specific property rights system), it creates winners and losers. The winners gain resources (money, political influence, military power). They then use those resources to reinforce the path that benefited them.
  *   **Weak Path Dependence:** "We keep using this law because writing a new one is a hassle."
  *   **Strong Path Dependence:** "We keep using this law because the people who own the land wrote the law, and they will fund the army that enforces it."

  This is why the "strong" version feels like inevitability. It's not that the system is logically perfect; it's that the system builds its own defense army over time. This creates **increasing returns to scale** for the institution itself. The longer democracy exists, the more civil society groups form to defend it. The longer capitalism exists, the more capital accumulates to lobby for it.

  ### 2. The Illusion of Inevitability (The "Funnel" vs. The "Tree")
  The argument that big outcomes like democracy are inevitable usually relies on **Functionalism**. This is the idea that history is a funnel: different starting points converge on the same solution because that solution is simply "fitter."
  *   *The Argument:* Industrialization requires educated workers; educated workers demand voting rights; therefore, industrialization leads to democracy.
  *   *The Flaw:* This is almost always hindsight bias. It assumes that because X happened, X was the only way to solve the problem.

  Path dependence argues history is a **branching tree**, not a funnel.
  *   **Critical Junctures:** There are short windows where structural constraints loosen (wars, revolutions, economic collapses). During these windows, small contingent events (a leader's death, a weather event, a specific battle) push the society onto one branch.
  *   **The Closure:** Once the branch is taken, the "power mechanism" (point #1) kicks in and closes the other branches.

  **The Verdict on Inevitability:** If you rewind history to 1750, it is highly probable we do *not* end up with liberal democracy globally. We might end up with a stable, high-tech neo-feudalism (think *Dune* or cyberpunk corporatism). The fact that we have democracy isn't because it's the "end of history"; it's because specific critical junctures (like the outcome of WWII or the Cold War) eliminated the competing paths.

  ### 3. Efficiency vs. History
  This is the hardest conceptual pill to swallow. Economists hate path dependence because it violates the idea of **efficiency**.
  *   **Standard Theory:** Markets and institutions evolve toward the most efficient outcome.
  *   **Path Dependence:** Markets and institutions evolve toward the outcome that was *first* or had the *biggest early push*, even if it's inferior.

  If you believe capitalism is inevitable, you usually believe it is the most efficient way to organize an economy. But a path dependence theorist would point to places where capitalism *didn't* take hold despite being "efficient," or where inferior economic systems persisted for centuries because the elites benefited from the inefficiency.

  **The Guts:** Inefficiency can be stable. If a corrupt system enriches the people with the guns, that system is "stable" even if it destroys the GDP. Therefore, the survival of capitalism/democracy isn't proof of their inevitability; it's proof that they won the political fight *at the right time*.

  ### 4. Time Horizons Matter
  The strength of path dependence depends entirely on your time horizon.
  *   **Short/Medium Term (50-150 years):** Path dependence is incredibly strong. Institutions have massive inertia. You cannot simply "install" democracy in a country by writing a constitution. The existing path (tribal loyalty, authoritarian habit, religious law) creates a gravitational pull that snaps the new system back into the old shape.
  *   **Long Term (500+ years):** Path dependence breaks down. Feudalism looked "locked in" for a thousand years. Then it vanished in a few centuries. Why? Because **exogenous shocks** (Black Death, New World discovery, Gunpowder) changed the underlying variables so much that the old path became impossible to maintain.

  So, is history locked in? **No.** But is it sticky? **Yes.**
  The "strong" version of path dependence doesn't mean *nothing* can change. It means you cannot change the outcome without a shock large enough to break the self-reinforcing power structures of the current path.

  ### 5. Why "Hindsight Bias" is the Real Enemy
  You asked if inevitability is just hindsight bias. **Mostly, yes.**
  When we look back, we see a straight line.
  *   *View from the present:* "Enlightenment -> Revolution -> Democracy."
  *   *View from the past:* "Enlightenment -> [50 different possible revolutions] -> [Monarchy restores order OR Democracy wins OR Theocracy takes over]."

  We only see the line that was walked. We don't see the ghosts of the other paths. This is called **Survivorship Bias**. We assume democracy is the "natural state" of developed nations because the nations that tried other things (Fascist Germany, Soviet Russia) either collapsed or were defeated.

  If the Axis powers had won WWII, "fascist modernity" would look inevitable to us today, and scholars would write papers on why authoritarianism is the natural endpoint of industrialization.

  ### Summary of the Reasoning
  1.  **Lock-in is Political, not just Technical:** Big outcomes stick because they create powerful beneficiaries who defend them, not just because they are "better."
  2.  **Contingency Rules Early, Structure Rules Late:** Early on, small accidents matter hugely (Critical Junctures). Later, the system becomes rigid (Path Dependence).
  3.  **Inevitability is a Mirage:** The argument for inevitability usually confuses "what happened" with "what had to happen."
  4.  **Shocks Break Paths:** History isn't locked forever, but changing a path requires a crisis big enough to strip the current winners of their power to defend the status quo.

  **The Bottom Line:**
  If you flipped one tiny random event in 1600, you might not get capitalism. If you flip one tiny event today, you probably *still* get capitalism, because the lock-in is now global and entrenched. Path dependence gets stronger the longer the path is walked. Inevitability is not a law of physics; it's the accumulation of political debt.
