answer: |-
  There is a fundamental mischaracterization in your premise that must be corrected before addressing the broader theoretical and empirical questions. **Supervaluationism does not assign precise intermediate truth-values.**

  In fact, the defining feature of supervaluationism is that it preserves classical bivalence (true/false) for "supertrue" and "superfalse" statements while explicitly positing **truth-value gaps** for borderline cases. Under this framework, a statement like "This heap is a pile" is neither true nor false if it falls within the borderline range; it lacks a truth value entirely because it is true on some admissible precisifications and false on others.

  The framework you are describing—one that assigns intermediate values akin to Bayesian credences or probabilities—is actually **Degree Theory (Fuzzy Logic)** or **Probabilistic Semantics**, not Supervaluationism.

  Once we disentangle these frameworks, we can address why supervaluationism has limited integration into computational models and what we should expect from linguistic corpora.

  ### 1. Why Supervaluationism Is Not Dominant in Formal or Computational Semantics

  Even if we correct the definition, supervaluationism faces significant hurdles that limit its adoption in formal semantics and computational linguistics compared to degree-theoretic or contextualist approaches.

  **A. Failure of Truth-Functionality**
  In classical logic and most computational models, the truth value of a complex sentence (e.g., $A \land B$) is determined solely by the truth values of its constituents ($A$ and $B$). Supervaluationism violates this principle.
  *   *Example:* If $P$ is a borderline case, it is neither supertrue nor superfalse. However, the statement $P \lor \neg P$ (Excluded Middle) is considered supertrue because it holds in every precisification.
  *   *Computational Cost:* To determine the status of a sentence, a system must quantify over the set of all "admissible precisifications." In a computational model, generating and checking against a set of all possible sharp boundaries for every vague predicate is combinatorially explosive and often intractable.

  **B. Mismatch with Gradience**
  Computational models of linguistic gradience (such as those used in Natural Language Processing) require gradients to function. Neural networks and probabilistic models operate on continuous vector spaces.
  *   Supervaluationism offers a **gap**, not a **grade**. It tells you a case is "indeterminate," but it does not tell you *how* indeterminate it is relative to other cases.
  *   Degree theories (assigning values between 0 and 1) map much more naturally onto the activation functions of computational models.

  ### 2. The Empirical Expectation: Corpora and Transition Curves

  Your second question asks if we should observe smooth probabilistic transition curves in corpora if vagueness is epistemic grading masked by semantic indeterminacy.

  **A. What the Data Shows**
  Psycholinguistic experiments and corpus analyses generally **do** show smooth, S-shaped curves when plotting the application of a vague predicate (e.g., "tall") against a scalar dimension (e.g., height in inches). As height increases, the probability of a speaker applying the label "tall" increases smoothly rather than jumping abruptly.

  **B. Interpreting the Curves**
  However, the existence of these curves does not validate supervaluationism, nor does it strictly validate epistemicism. It depends on how you interpret the probability:

  1.  **Support for Degree Theory:** If the curve represents the *semantic content* itself (i.e., "tall" literally means a fuzzy set), the smooth curve is direct evidence for degree theories.
  2.  **Support for Epistemicism:** If sharp boundaries exist but are unknown (Epistemicism), the smooth curve in the data is explained by **noise**. This noise arises from inter-speaker variation (different speakers have different precise cutoffs) and intra-speaker variability (context, attention, fatigue). The aggregate data looks smooth, even if individual cognitive thresholds are sharp.
  3.  **Supervaluationism's Prediction:** Supervaluationism predicts a "plateau" of indeterminacy. It suggests there is a range where usage should be inconsistent or hesitant, but it does not inherently predict a specific mathematical probability distribution (like a Gaussian or sigmoid curve) without additional pragmatic assumptions.

  ### 3. Why the Confusion Persists

  The conflation in your premise is common because all three major theories (Supervaluationism, Epistemicism, and Degree Theory) attempt to solve the same problem: the Sorites Paradox.

  *   **Supervaluationism** says: There is no boundary, but classical logic is saved by "supertruth." (No intermediate values).
  *   **Epistemicism** says: There is a boundary, but we cannot know it. (Binary values, unknown).
  *   **Degree Theory** says: There are intermediate values. (Continuous values).

  When researchers model vagueness computationally, they almost exclusively use **Degree Theory** or **Probabilistic Semantics** (which aligns with your description of Bayesian credences). These frameworks are integrated into formal semantics (e.g., the work of Christopher Kennedy or Louise McNally on gradable adjectives) because they handle the compositional semantics of modifiers like "very," "slightly," and "almost" much more effectively than supervaluationism does.

  ### Summary

  To answer your questions directly:

  1.  **Correction:** Supervaluationism does not assign intermediate truth-values; it assigns truth-value gaps. The framework you are describing is Degree Theory or Probabilistic Semantics.
  2.  **Integration:** Supervaluationism is not widely integrated into computational models because it is non-truth-functional and computationally expensive. Degree theories are preferred for modeling gradience.
  3.  **Corpora:** We do observe smooth probabilistic transition curves in large-scale data. However, this supports Degree Theory directly, or Epistemicism (via noise modeling), rather than Supervaluationism. Supervaluationism predicts indeterminacy, but not necessarily a smooth probabilistic distribution of usage.

  If you are interested in a framework that treats vagueness as Bayesian credences integrated into formal semantics, you should look into **Probabilistic Semantics** (e.g., the work of Daniel Lassiter or Noah Goodman) rather than Supervaluationism.
