  1. The Precise Question

  The central question of this independent study is: Can the Buddhist doctrine of *anatta* (no-self) be coherently reconstructed as a metaphysics of relational persistence grounded in *pratītyasamutpāda* (dependent origination), distinct from Western substance, bundle, and narrative theories of personal identity? Here, *anatta* is defined not merely as the negation of a permanent soul (*atman*), but as the absence of any ontological substrate underlying experience. *Pratītyasamutpāda* refers to the principle that phenomena arise only in dependence on conditions, lacking intrinsic nature. Western "substance theory" posits a persistent underlying entity; "bundle theory" reduces the self to a collection of perceptions; "narrative identity" locates continuity in story-structure. "Relational persistence" is proposed as a distinct category where continuity is maintained not by entities or stories, but by a dynamically sustained network of causal-functional dependencies. The inquiry asks whether this relational model avoids the pitfalls of reductionism while denying substantialism. Specifically, does viewing personal continuity as a homeostatically maintained process of dependent arising offer a viable third option between eliminativism and essentialism? This definition isolates the metaphysical structure of continuity from the ontological status of the relata, ensuring the question targets the mechanism of persistence rather than merely the existence of the self. The problem hinges on whether "dependence" implies an ontological free-for-all or a structured causal architecture. If the latter, *anatta* might support a robust phenomenology without committing to a self-entity. This precise framing avoids conflating the denial of substance with the denial of continuity, allowing for an investigation into whether dependent origination provides a unique structural account of identity that Western categories currently obscure. This has implications for philosophy of religion regarding the subject of religious experience.

  2. The Gap in Existing Answers

  Existing scholarship typically forces *anatta* into a false dichotomy between reductionism and non-reductionism. Standard interpretations classify *anatta* either as a bundle theory, akin to Hume's view that the self is merely a heap of perceptions, or as a narrative-identity view, where continuity is constructed through autobiographical storytelling. Both readings capture aspects of Buddhist thought but miss the specific causal architecture of *pratītyasamutpāda*. The bundle theory reading risks eliminating the functional continuity required for moral responsibility and karma, reducing the person to ephemeral flashes. The narrative reading risks psychological constructivism, making selfhood optional or merely linguistic, which contradicts the soteriological urgency of realizing no-self. Consequently, the option of "relational persistence" remains unexplored or is wrongly conflated with reductive functionalism. When scholars attempt to articulate a middle way, they often default to compatibilism or pragmatic fictionalism, failing to engage the metaphysical structure of dependence itself. This gap exists because Western metaphysics prioritizes entities over relations, whereas *pratītyasamutpāda* prioritizes the relational structure over the relata. By treating relations as secondary to substances, Western interpretations obscure the possibility that relations themselves could carry persistence. Furthermore, contemporary philosophy of mind often equates functional dependency with computational reductionism, ignoring non-reductive process metaphysics. This project addresses this gap by isolating the structural role of dependence in *anatta*, demonstrating that it is neither a collection of parts nor a story, but a dynamic system of constraints. Without this distinction, *anatta* remains philosophically sterile, either collapsing into nihilism or retreating into ineffable mysticism. The specific failure of current literature is the assumption that denying substance necessitates denying robust continuity. By overlooking the causal-functional network as a carrier of identity, existing accounts cannot explain how karma operates without a self. This study argues that the relational structure is the missing variable that resolves this tension, offering a third option that preserves continuity without essence. If this option is ignored, the comparative dialogue remains stuck in categorization errors that misrepresent Buddhist metaphysics.

  3. Method and Approach

  The method will be constructive conceptual analysis combined with comparative metaphysics, rather than a mere literature survey. I will reconstruct the logic of *pratītyasamutpāda* as a metaphysical principle of structural dependence, analyzing early Buddhist texts to extract the causal rules governing personal continuity. This will be juxtaposed with process metaphysics, specifically Whiteheadian or Rescherian accounts of relational persistence, to test structural isomorphism. Additionally, I will examine hierarchical predictive models of cognition not as empirical proof, but as conceptual analogues for how a selfless system maintains stability through error minimization. This approach is justified because standard historical exegesis cannot resolve the metaphysical viability of the view; the question is systematic, not merely philological. A purely historical approach would describe what Buddhists said, but not whether their ontology holds water against Western criteria of identity. Conversely, a purely analytic approach risks importing Western biases. By combining textual analysis with structural comparison, I can evaluate whether the relational model coheres internally. I will avoid empirical neuroscience claims, using predictive processing only as a formal model of causal dependency. This distinguishes the project from neurophilosophy, keeping it within metaphysics. The core task is to map the conditions under which a network of dependencies counts as "persistent" without a substrate. This requires defining thresholds for identity over time within a process framework. If the network maintains structural integrity despite material flux, does it qualify as a person? This method allows for a rigorous test of the "third option" hypothesis. It moves beyond describing *anatta* to testing its metaphysical robustness. The analysis will proceed in three stages: first, isolating the causal criteria in dependent origination; second, modeling these criteria using process-philosophical tools; third, stress-testing this model against objections regarding moral responsibility and memory. This triangulation ensures the reconstruction is textually grounded, metaphysically precise, and practically applicable. Using predictive models as analogies helps visualize how a system can be coherent without a central controller, mirroring the selfless nature of *anatta*. This methodological choice prevents the project from becoming abstract speculation, anchoring it in formalizable structures of causation. Standard comparative philosophy often matches concepts one-to-one (e.g., *anatta* equals bundle theory). This method instead matches structural functions. It asks not "what is the self?" but "how is continuity sustained?" This shift from ontology to dynamics is crucial. It allows the proposal to bypass the substance/process deadlock. By focusing on the maintenance of the network rather than the components, the method reveals whether *anatta* offers a unique contribution to personal identity theory or merely a variation on Humean themes. I will also engage with objections regarding the unity of consciousness. If the relational model cannot account for the synchronic unity of experience, it fails as a theory of personal identity. This adds a necessary constraint to the constructive phase.

  4. Possible Conclusions and Decision Criteria

  Two distinct conclusions are possible. First, the study may conclude that relational persistence is a coherent third option, successfully distinguishing *anatta* from both substance metaphysics and reductive bundle theory. This would be decided if the model accounts for moral responsibility and memory without positing a substratum, satisfying both Buddhist soteriological goals and Western metaphysical criteria for identity. Second, the study may conclude that relational persistence collapses into functionalist reductionism. This would be decided if the causal-functional network proves indistinguishable from standard computational functionalism, thereby losing the specific soteriological nuance of *anatta*. The decision criteria hinge on two factors: explanatory power and ontological commitment. If the relational model explains continuity better than bundle theory without adding hidden entities, it succeeds. If it requires implicit substances to maintain the network's integrity, it fails. Another criterion is textual fidelity: does this reconstruction align with the doctrine of karma? If the relational view cannot support karmic continuity, it is philosophically interesting but Buddhistically invalid. Finally, the distinction between "conventional truth" and "ultimate truth" must be preserved. If the relational persistence is treated as ultimately real, it violates *anatta*; if treated as merely fictional, it loses metaphysical weight. The successful conclusion must navigate this middle path. A positive outcome would demonstrate that dependence itself is ontologically significant, not just a relation between beings. A negative outcome would show that without a substrate, "network" is just a metaphor for a bundle. The criteria also include logical consistency: can a network persist if its nodes are momentary? If the answer requires a meta-stability that functions as a substance, the third option fails. Conversely, if the stability is emergent and non-substantial, the project validates the hypothesis. This binary outcome ensures the project yields a definitive philosophical result, regardless of whether the hypothesis is confirmed or refuted.

  5. Scope, Risks, and Failure Conditions

  The scope is limited to one semester and a 5,000-word final paper, focusing on metaphysics rather than soteriology or history. The primary risk is scope creep, particularly regarding the analogy to predictive processing. Importing empirical neuroscience would exceed the project's philosophical mandate and competence. Failure is defined as an inability to distinguish the relational view from standard bundle theory, rendering the "third option" illusory. Another failure condition is misinterpreting *pratītyasamutpāda* by treating conditions as efficient causes in a Western sense, rather than dependent arisings. If the project relies on obscure texts or requires fluency in Pali/Sanskrit beyond available translations, it will stall. To mitigate this, I will rely on standard philosophical translations and secondary metaphysical literature. The project fails if it becomes a general overview of Buddhist metaphysics rather than a targeted analysis of personal identity. Success requires maintaining the tension between reductionism and non-reductionism without resolving it prematurely. If the paper concludes that "it depends" without specifying the metaphysical conditions, it has not met the decision criteria. The risk of conflating conventional and ultimate truth is high; failing to separate these levels would invalidate the metaphysical claim. Additionally, there is a risk of over-relying on the predictive processing analogy. If the model becomes too technical, it distracts from the metaphysical argument. I will limit this analogy to structural homomorphism only. Time management is also a risk; balancing textual analysis with constructive metaphysics requires disciplined scheduling. If the textual work consumes the semester, the constructive argument will be weak. The project is feasible only if I strictly adhere to the metaphysical question, using texts as data rather than objects of exegesis. The final deliverable must be a tight argument, not a survey.
