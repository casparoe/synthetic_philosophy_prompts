answer: |-
  # Metaethical Adequacy: A Specification Sheet

  ## Preamble
  This document outlines the necessary conditions for metaethical adequacy. It is designed not to adjudicate between existing schools (Realism, Anti-Realism, Error Theory) but to serve as a stress-test for a hybrid framework. The criteria are divided into **Non-Negotiable Constraints** (phenomena that cannot be eliminated or reduced without loss of the subject matter) and **Theoretical Preferences** (ontological or epistemological commitments specific to camps).

  ---

  ## I. Non-Negotiable Constraints (Phenomenological & Explanatory)

  These criteria must be met for a theory to count as an account of *morality* rather than a revisionary account of something else (e.g., etiquette, prudence, or error).

  ### 1. The Phenomenology of Categorical Authority
  *   **Requirement:** The theory must explain why moral obligations present themselves to agents as *categorical* rather than *hypothetical*. When an agent judges "I ought to $\phi$," the experience is not "I ought to $\phi$ if I want $X$," but "I ought to $\phi$ regardless of my desires."
  *   **Motivating Case:** The experience of the reluctant moral agent (e.g., the tax evader who knows they should pay despite wanting to keep the money). A theory that reduces obligation to desire-satisfaction fails to capture the *force* of the experience.
  *   **Status:** **Non-Negotiable.** Eliminating this reduces morality to prudence.

  ### 2. The Explanation of Deep First-Order Disagreement
  *   **Requirement:** The theory must account for persistent, intractable disagreement on substantive moral issues (e.g., abortion, distributive justice) without rendering all parties systematically mistaken or merely talking past one another.
  *   **Motivating Case:** Two rational, informed agents disagree on the permissibility of euthanasia. A theory must explain the *nature* of this disagreement (is it factual? attitudinal? conceptual?) without implying that one party is necessarily blind to a simple fact.
  *   **Status:** **Non-Negotiable.** A theory that explains disagreement only by positing massive error (unless it is an explicit Error Theory) is explanatorily weak.

  ### 3. The Possibility of Moral Progress
  *   **Requirement:** The theory must provide a truth-condition or correctness-condition that allows for the claim "Society A is morally better than Society B" to be objectively true, not merely a preference of Society B.
  *   **Motivating Case:** The abolition of slavery. We assert this was progress, not merely change. A theory must ground the *directionality* of moral history.
  *   **Status:** **Non-Negotiable.** Eliminating this renders moral reform indistinguishable from fashion.

  ### 4. The Reason/Motive Distinction (Externalism Constraint)
  *   **Requirement:** The theory must preserve the distinction between *having a moral reason* to $\phi$ and *having a motive* to $\phi$. It must allow for the possibility of an agent who acknowledges a moral reason but lacks the corresponding motive (weakness of will or amoralism) without collapsing the reason into the motive.
  *   **Motivating Case:** The amoralist who says, "I know I ought to help, but I don't care." If the theory defines "ought" as "would care if rational," it collapses the distinction.
  *   **Status:** **Non-Negotiable.** Collapsing this distinction eliminates the normative gap required for moral criticism of the self.

  ### 5. Psychological Consistency without Anthropological Reduction
  *   **Requirement:** The theory must be consistent with empirical data regarding cross-cultural variation in normative judgment (e.g., WEIRD vs. non-WEIRD moral matrices) without reducing moral truth to descriptive anthropology.
  *   **Motivating Case:** Cultural variance in judgments regarding purity or authority. The theory must explain why these variations occur (e.g., different weighting of foundational values) without concluding that morality *is* nothing but local custom.
  *   **Status:** **Non-Negotiable.** Ignoring psychology makes the theory empirically inert; reducing morality to psychology makes it normatively empty.

  ---

  ## II. The Special Constraint: Normative Inertia

  ### 6. The Normative Inertia Condition
  *   **Definition:** The tendency of agents to maintain specific moral commitments even after explicitly acknowledging that the original evidential or rational grounds for those commitments have been undermined.
  *   **Requirement:** The theory must account for this persistence without categorizing it as straightforward irrationality (a bug) and without positing hidden rational grounds (a conspiracy of reason). It must treat inertia as a structural feature of moral psychology.
  *   **Motivating Case:** An agent raised to believe "X is sinful" encounters definitive evidence that the scriptural basis for "X" is historically fabricated. Often, the agent retains the intuition that "X is wrong" despite the collapsed evidential basis.
  *   **Theoretical Bias Analysis:**
      *   **Realism:** Struggles here. If moral truths are mind-independent facts, retaining a belief after evidence is undermined looks like epistemic vice (irrationality).
      *   **Anti-Realism/Expressivism:** Better fit. If moral judgments are expressions of commitment or plans, they function like identities or habits which resist evidential updating more than factual beliefs do.
      *   **Orthogonal/Hybrid:** This constraint strongly favors **Pragmatist** or **Functionalist** orientations. It suggests moral commitments serve a stabilizing social or psychological function that operates independently of their justificatory genealogy.
  *   **Status:** **Non-Negotiable (Novel).** Standard theories often ignore this or treat it as a failure case. An adequate theory must explain why morality *sticks* when reasons *slip*.

  ---

  ## III. Joint Unsatisfiability Flags (Tension Points)

  The following pairs of desiderata create high tension. A successful theory must explicitly resolve how these coexist, likely by modifying the intuitive understanding of one.

  ### ⚠️ Tension A: Categorical Authority vs. Deep Disagreement
  *   **The Conflict:** If moral claims possess the authority of mathematical truths (Categorical Authority), deep persistent disagreement among rational agents is inexplicable (unlike in math). If deep disagreement is a fundamental feature of the moral landscape, the claim to Categorical Authority appears suspect (it looks more like clashing preferences).
  *   **Resolution Requirement:** The theory must explain how authority survives disagreement. (e.g., by positing epistemic barriers, distinguishing *truth* from *knowability*, or redefining authority as *practical necessity* rather than *ontological weight*).
  *   **Risk:** Most theories sacrifice Authority (to save Disagreement) or explain away Disagreement (to save Authority).

  ### ⚠️ Tension B: Moral Progress vs. Psychological Consistency
  *   **The Conflict:** If moral progress is real, there must be a "track" we are following. If moral psychology is heavily culturally conditioned (Psychological Consistency), our "track" looks like a local path. How do we distinguish *tracking truth* from *tracking local adaptation*?
  *   **Resolution Requirement:** The theory must provide a mechanism for distinguishing cultural variation from moral error.
  *   **Risk:** Collapsing into Relativism (saving Psychology, losing Progress) or Dogmatism (saving Progress, ignoring Psychology).

  ### ⚠️ Tension C: Normative Inertia vs. Rational Accountability
  *   **The Conflict:** If agents hold views despite undermined grounds (Inertia), they appear irrational. If morality is a domain of reason, it should be responsive to evidence.
  *   **Resolution Requirement:** The theory must decouple moral commitment from strict evidentialism without making morality arbitrary.
  *   **Risk:** Making morality a matter of brute will (losing Reason) or denying the phenomenon of Inertia (losing empirical adequacy).

  ---

  ## IV. Camp-Specific Preferences (Not Non-Negotiable)

  *Note: These are often treated as requirements by specific schools but should not be hard constraints for a general specification.*

  *   **Ontological Parsimony:** (Preferred by Naturalists/Anti-Realists). *Not Non-Negotiable.* A theory may posit queer entities if necessary to save the phenomena.
  *   **Mind-Independence:** (Preferred by Realists). *Not Non-Negotiable.* Morality could be mind-dependent and still be authoritative.
  *   **Universalizability:** (Preferred by Kantians). *Not Non-Negotiable.* Some adequate theories may allow for agent-relative obligations.
  *   **Action-Guidingness:** (Preferred by Internalists). *Not Non-Negotiable.* As per Criterion 4, a theory can allow for a gap between judgment and motive.

  ---

  ## V. Brief Evaluation of Existing Schools Against Specification

  This evaluation is illustrative, highlighting where existing schools typically fail the spec sheet to inform your hybrid construction.

  ### 1. Error Theory (e.g., Mackie)
  *   **Performance:**
      *   **Disagreement:** **Pass.** Explains disagreement easily (everyone is wrong).
      *   **Psychological Consistency:** **Pass.** Aligns with evolutionary skepticism.
      *   **Authority:** **Fail.** Explicitly denies categorical authority (treats it as fiction).
      *   **Progress:** **Fail.** Cannot ground objective progress (all claims are false).
      *   **Normative Inertia:** **Fail.** Treats inertia as systematic error/irrationality.
  *   **Verdict:** Fails Non-Negotiable Constraints 1 and 3. It explains the phenomena by eliminating them.

  ### 2. Robust Non-Naturalist Realism (e.g., Enoch, Parfit)
  *   **Performance:**
      *   **Authority:** **Pass.** Strongest account of categorical bindingness.
      *   **Progress:** **Pass.** Clear truth-conditions for progress.
      *   **Disagreement:** **Struggle.** Faces the "Epistemic Access" problem. Why do reasonable people diverge on self-evident truths?
      *   **Psychological Consistency:** **Struggle.** Often treats cultural variation as noise/interference rather than data.
      *   **Normative Inertia:** **Struggle.** Hard to explain why agents stick to views after evidential undermining without accusing them of irrationality, given the high bar for rational access to non-natural facts.
  *   **Verdict:** Strong on Phenomenology, weak on Empirical/Epistemic integration.

  ### 3. Constructivism (e.g., Korsgaard, Street)
  *   **Performance:**
      *   **Authority:** **Pass (Qualified).** Authority comes from within the agent's practical standpoint.
      *   **Disagreement:** **Pass.** Explains disagreement as divergence in constructive procedures or starting points.
      *   **Progress:** **Pass (Qualified).** Progress is increased coherence or stability of the will.
      *   **Psychological Consistency:** **Pass.** Integrates well with evolutionary and cultural data (morality as a tool for social coordination).
      *   **Normative Inertia:** **Pass.** Best fit. If morality is a commitment constitutive of identity or agency, inertia is expected when grounds are undermined, because the commitment *precedes* the evidence.
  *   **Verdict:** Strongest overall fit, particularly on Inertia and Psychology, though often accused of weakening Authority (making it hypothetical on the agent's will).

  ---

  ## VI. Instruction for Hybrid Framework Formulation

  When constructing your hybrid framework, prioritize the resolution of **Tension A (Authority vs. Disagreement)** and the integration of **Normative Inertia**.

  1.  **Do not** solve Tension A by reducing Authority. If you do, you leave the moral landscape.
  2.  **Do not** solve Tension A by denying Disagreement. If you do, you lose empirical contact.
  3.  **Use Normative Inertia** as the lever. If moral commitments function as *identity-constituting norms* rather than *empirical hypotheses*, they can retain Authority (they bind the self) while allowing Disagreement (different selves/communities construct differently) and explaining Inertia (identity resists evidential updating).

  This specification sheet demands a theory that is ontologically modest enough to fit the psychology, but normatively robust enough to bind the will.
