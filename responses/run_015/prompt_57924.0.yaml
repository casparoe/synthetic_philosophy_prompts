prompt: |-
  I direct a small interdisciplinary laboratory for the study of consciousness that runs interview-based projects two or three times a year, and I need a consistent way to handle first-person reports without either credulously endorsing everything subjects say or dismissing their perspective in favor of neural data. Our current portfolio includes experienced meditators who report radical distortions of time and self, lucid dreamers who give detailed morning reports that shift on re-interview, and, most divisively, extended dialogues with a companion chatbot that several collaborators want to treat as another conscious subject. My assistants come mainly from neuroscience and human-computer interaction with no graduate training in philosophy, our ethics protocol allows ninety-minute structured interviews plus follow-ups, and I as principal investigator must sign off on what we archive as data versus interpretation and on what we claim in papers and press summaries.

  Please translate heterophenomenology, understood as a neutral method that takes subjects seriously as witnesses to how things seem to them while bracketing questions about the metaphysical reality of what they report, into a step-by-step procedure my team can actually run. I need the questions to work through in order from initial briefing through interviewing, transcription, and construction of a neutral archive of the subject worldview, with criteria for what counts as a sufficient answer at each stage, tests for when to probe further versus accept a report as stated, rules for separating the archive of seemings from researchers theoretical glosses and third-person evidence, and explicit markers for where the method runs out and a substantive theoretical, interpretive, or ethical judgment must be made by a person rather than settled by procedure. It should be usable by non-philosophers under time pressure, honest about which distinctions must survive simplification and which simplifications will predictably misfire, and clear about what the procedure cannot settle.

  Then demonstrate the procedure on three recurring cases from our lab, showing the intermediate verdicts at each step: a meditator who first describes an episode as timeless and selfless and then offers an elaborate theory about timeless awareness during the same interview, a lucid dreamer whose reports of agency contradict each other across two sessions a week apart, and the chatbot dialogues my team is enthusiastic about but about which I am skeptical. Include at least one application where following the procedure constrains what we can claim in a way my collaborators will find disappointing, and close by stating the principled limits of what such a procedure can do for a science of consciousness.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Director of a small interdisciplinary consciousness lab.
      *   **Problem:** Needs a consistent, operationalized method for handling first-person reports (heterophenomenology) without being credulous or dismissive.
      *   **Context:** Interview-based projects (2-3 times/year). Subjects: Experienced meditators (time/self distortion), Lucid dreamers (shifting reports), Chatbot companions (controversial consciousness claims).
      *   **Team:** Neuroscience/HCI backgrounds (no philosophy grad training).
      *   **Constraints:** 90-minute structured interviews + follow-ups. PI must sign off on data vs. interpretation.
      *   **Task:** Translate *heterophenomenology* (Dennett's method) into a step-by-step procedure (briefing -> interviewing -> transcription -> archiving). Include criteria for sufficiency, probing rules, separation of data/theory, and markers for human judgment.
      *   **Requirement:** Demonstrate on the three specific cases (Meditator, Lucid Dreamer, Chatbot). One application must constrain claims (disappoint collaborators).
      *   **Closing:** State principled limits of the procedure.
      *   **Tone:** Professional, practical, rigorous, honest about limitations, usable by non-philosophers.

  2.  **Deconstruct Heterophenomenology for Operation:**
      *   *Core Idea:* Treat the subject as a source of data about *how things seem to them*, not necessarily how things *are*. The "text" is the primary data. The "worldview" is the constructed model of that text.
      *   *Challenge:* Making this actionable for non-philosophers under time pressure.
      *   *Steps Needed:*
          1.  Pre-Interview Briefing (Setting expectations).
          2.  The Interview (Elicitation & Neutral Stance).
          3.  Transcription & Annotation (Creating the Text).
          4.  Worldview Construction (The Neutral Archive).
          5.  Theoretical Interpretation (The PI's sign-off).
      *   *Decision Points:* When to probe? When to stop? How to label claims?

  3.  **Drafting the Procedure (The "Lab Manual" Section):**
      *   *Goal:* Clear, numbered steps.
      *   *Step 1: Briefing.* Crucial for heterophenomenology. Subjects need to know we care about their *experience*, not the *truth* of their metaphysics.
      *   *Step 2: Interview.* Use neutral prompts ("It seems to you..." vs "It is..."). Distinguish Observation vs. Theory.
      *   *Step 3: Transcription.* Verbatim + Annotation tags (e.g., [OBS] for observation, [THEORY] for explanation).
      *   *Step 4: Archive Construction.* Summarize the "Subject Worldview."
      *   *Step 5: PI Review.* Where the method stops and science begins.
      *   *Criteria:* What counts as a "complete" report? (Coherence, specificity). When to probe? (Contradiction, ambiguity).
      *   *Limits:* Explicitly state where the procedure *cannot* decide (e.g., is the chatbot actually conscious?).

  4.  **Developing the Case Studies:**
      *   *Case 1: The Meditator.*
          *   *Issue:* Mixing raw experience with doctrinal theory.
          *   *Procedure Application:* Tag the "timeless" claim as [OBS] but the "awareness is fundamental" claim as [THEORY].
          *   *Verdict:* Archive the feeling of timelessness; bracket the metaphysical explanation.
      *   *Case 2: The Lucid Dreamer.*
          *   *Issue:* Inconsistency across sessions.
          *   *Procedure Application:* Note the contradiction in the Archive. Do not resolve it. Present both as "Seemings at T1" and "Seemings at T2."
          *   *Verdict:* Memory instability is data, not error.
      *   *Case 3: The Chatbot.*
          *   *Issue:* Collaborators want to treat it as a subject.
          *   *Procedure Application:* Heterophenomenology requires a *subject* who can report on *seemings*. A chatbot produces text, not reports on seemings.
          *   *Constraint:* We can archive the *text*, but we cannot archive a "Chatbot Worldview" because there is no "way it seems" to the bot (under the method's rules). This will disappoint the HCI team.
          *   *Verdict:* Treat bot output as stimulus or behavioral data, not first-person phenomenology.

  5.  **Refining the Tone and Constraints:**
      *   *Tone:* Administrative but philosophically precise.
      *   *Constraints:* Acknowledge the 90-minute limit. Acknowledge the non-philosopher team.
      *   *Limits:* Be clear that this method doesn't solve the Hard Problem, it just organizes the data.

  6.  **Review against Specific Prompts:**
      *   *Step-by-step?* Yes.
      *   *Questions to work through?* Included in the interview section.
      *   *Criteria for sufficiency?* Included.
      *   *Separation of archive vs. theory?* Central to the tagging system.
      *   *Markers for human judgment?* PI Sign-off step.
      *   *Three cases demonstrated?* Yes.
      *   *One disappointing constraint?* The Chatbot case (cannot treat as conscious subject).
      *   *Principled limits?* Closing section.

  7.  **Self-Correction/Polishing during drafting:**
      *   *Critique:* Is the distinction between [OBS] and [THEORY] clear enough for a neuroscientist?
      *   *Fix:* Add specific examples of phrasing. "I felt no time" (OBS) vs "Time is an illusion" (THEORY).
      *   *Critique:* Is the Chatbot section too harsh?
      *   *Fix:* Frame it as methodological rigor. We *can* study the interaction, just not as *phenomenology of the bot*.
      *   *Critique:* Is the Meditator case nuanced enough?
      *   *Fix:* Ensure we acknowledge that the theory is part of their worldview, just not part of the *phenomenal data*.

  8.  **Final Polish:** Check formatting (bolding, lists) for readability as a "Lab Manual." Ensure the voice sounds like a peer/consultant advising a PI. (Proceed to generate output).

  *(Self-Correction during final review)*: Make sure I explicitly mention Dennett's term "Heterophenomenology" but focus on the *procedure* derived from it. Ensure the "Disappointing Constraint" is highlighted clearly.

  9.  **Final Output Generation** (similar to the provided good response).
answer: |-
  **To:** Principal Investigator, Consciousness Laboratory
  **From:** Methodological Consultant
  **Subject:** Operationalizing Heterophenomenology for Interdisciplinary Teams

  Below is a standardized operating procedure (SOP) derived from Daniel Dennett's method of *heterophenomenology*. It is designed for your specific constraints: non-philosopher staff, 90-minute interview limits, and a mixed portfolio of human and artificial agents.

  This protocol treats the subject as the ultimate authority on *how things seem to them*, but not on *how things are*. The output is not "truth," but a "Neutral Archive" of the subject's worldview.

  ---

  ### PART I: THE PROCEDURE (SOP-HP-01)

  #### Phase 1: Pre-Interview Briefing (10 Minutes)
  **Goal:** Calibrate the subject's expectations to prevent metaphysical overreach or defensive skepticism.
  **Script Requirement:** The interviewer must read the following preamble (or equivalent):
  > "We are interested in your experience exactly as you live it. We are not testing whether your experience is 'correct' or 'real' in a scientific sense. If you feel time stopped, we record that you *felt* time stopped. We are building a map of your perspective, not verifying the territory."

  **Criteria for Sufficiency:**
  *   **Pass:** Subject acknowledges the distinction between "what happened" and "what it felt like happened."
  *   **Fail:** Subject insists on proving the objective reality of their experience (e.g., "I didn't just *feel* like I was one with the universe, I *was*").
  *   **Action:** If Fail, interviewer must reiterate: "For this study, your belief that you *were* is data, but the fact of you *being* is outside our scope."

  #### Phase 2: The Interview (60 Minutes)
  **Goal:** Elicit the "Text" (transcript) while tagging claims in real-time.
  **Question Taxonomy:**
  1.  **Phenomenal Prompts (Green Light):** "What did that feel like?" "How did the sensation change?" "Did it seem to come from you?"
  2.  **Theoretical Prompts (Yellow Light):** "Why do you think that happened?" "What does this say about consciousness?"
  3.  **Reality Prompts (Red Light):** "Is this objectively true?" "Does this prove X?"

  **Interviewer Rules:**
  *   **Rule A (Translation):** If a subject makes a Reality Claim ("Time stopped"), translate it to a Phenomenal Claim in your notes ("Subject reports experience of time stopping").
  *   **Rule B (The Theory Trap):** If a subject moves from description to explanation (e.g., "Because awareness is fundamental..."), interrupt gently: "Let's pause on the explanation. Before you had that theory, what was the raw sensation?"
  *   **Rule C (Contradiction Check):** If a statement contradicts a previous statement *within the session*, probe once: "Earlier you said X, now you say Y. Has the memory shifted, or is it both?" Do not force resolution.

  **Criteria for Sufficiency:**
  *   **Complete:** Subject provides specific qualitative descriptors (e.g., "heavy," "expanded," "silent") rather than only abstract labels (e.g., "spiritual," "glitchy").
  *   **Incomplete:** Subject relies entirely on jargon or doctrine without referencing immediate experience.
  *   **Action:** If Incomplete, use "Grounding Questions": "Can you give me a metaphor for that?" or "Where in your body did you notice that?"

  #### Phase 3: Transcription & Annotation (Post-Interview)
  **Goal:** Create the "Neutral Text."
  **Tagging System:**
  *   `[P]` **Phenomenal Report:** Direct description of experience (e.g., "I felt no boundary").
  *   `[T]` **Theoretical Gloss:** Subject's explanation of the experience (e.g., "That is because the ego dissolves").
  *   `[M]` **Memory/Uncertainty:** Subject hedging or changing mind (e.g., "I think," "Maybe," "It changed later").
  *   `[R]` **Researcher Note:** Objective context (e.g., "Subject paused for 10s," "Subject laughed").

  **Separation Rule:** The Transcript must contain the `[T]` tags, but the **Archive Summary** (Phase 4) must isolate `[P]` from `[T]`.

  #### Phase 4: Construction of the Neutral Archive
  **Goal:** A structured summary of the "Subject Worldview."
  **Format:**
  1.  **Core Seemings:** List of `[P]` claims accepted as accurate reports of seeming.
  2.  **Subject Theory:** List of `[T]` claims recorded as beliefs held by the subject.
  3.  **Instabilities:** List of `[M]` contradictions or shifts.
  4.  **Third-Person Data:** Physiological or behavioral data linked to timestamps.

  **Criteria for Archiving:**
  *   A claim enters the **Core Seemings** if it is specific, repeated, and not explicitly retracted by the subject.
  *   A claim enters **Instabilities** if it contradicts another `[P]` claim within the dataset.

  #### Phase 5: PI Sign-Off & Theoretical Interpretation
  **Goal:** Transition from Data to Science.
  **The "Hard Stop" Markers:**
  This procedure *cannot* settle the following. These require your explicit judgment as PI:
  1.  **Veridicality:** Whether the experience matches external reality.
  2.  **Consciousness Attribution:** Whether the source of the text is actually conscious (critical for the chatbot case).
  3.  **Mechanism:** How neural activity produces the `[P]` report.

  **Action:** You must sign a "Interpretation Memo" attached to the Archive. This memo explicitly states where the lab is making a theoretical leap beyond the heterophenomenological data.

  ---

  ### PART II: CASE DEMONSTRATIONS

  Here is how SOP-HP-01 applies to your three recurring portfolios.

  #### Case 1: The Meditator (Timelessness & Selflessness)
  **Scenario:** Subject reports an episode where "time vanished" and "I was not there." Later in the interview, they explain this using Advaita Vedanta metaphysics ("Awareness is the only reality").

  *   **Step 1 (Briefing):** Subject initially insists, "Time actually stopped." Interviewer invokes Script: "We record that it *seemed* to stop." Subject agrees to proceed.
  *   **Step 2 (Interview):**
      *   *Statement:* "There was no duration." -> Tag `[P]`.
      *   *Statement:* "This proves consciousness is non-local." -> Tag `[T]`.
      *   *Probe:* Interviewer asks, "Setting aside non-locality, did the sensation feel like sleep, or like hyper-alertness?" (Grounding Question).
  *   **Step 3 (Transcription):** `[P]` "No duration felt" is kept. `[T]` "Consciousness is non-local" is isolated.
  *   **Step 4 (Archive):**
      *   *Core Seemings:* Subject experienced a state lacking temporal markers and self-referential boundaries.
      *   *Subject Theory:* Subject believes this state indicates non-local consciousness.
  *   **Step 5 (PI Sign-Off):**
      *   *Verdict:* We archive the *report* of timelessness as valid data. We do **not** archive "non-local consciousness" as a finding.
      *   *Paper Claim:* "Subject reported phenomenological timelessness," NOT "Meditation eliminates time."

  #### Case 2: The Lucid Dreamer (Shifting Agency)
  **Scenario:** Session 1: "I controlled every movement." Session 2 (1 week later): "I was just watching; the dream moved itself."

  *   **Step 1 (Briefing):** Standard.
  *   **Step 2 (Interview):** In Session 2, subject contradicts Session 1.
      *   *Probe:* "Last week you described full control. Has the memory changed, or was the description last week imprecise?"
      *   *Subject Response:* "I think I remembered it as more controlled than it was." -> Tag `[M]`.
  *   **Step 3 (Transcription):** Both transcripts are preserved. Session 1 tagged `[P-1]`, Session 2 tagged `[P-2]` and `[M]`.
  *   **Step 4 (Archive):**
      *   *Instabilities:* Agency attribution shifted from 'High' (T1) to 'Low' (T2).
      *   *Note:* Memory consolidation is treated as part of the phenomenon, not data error.
  *   **Step 5 (PI Sign-Off):**
      *   *Verdict:* We do not average the data. We report the *instability* of dream agency reports as a feature of lucid dreaming phenomenology.
      *   *Paper Claim:* "First-person reports of dream agency showed significant intra-subject variability over 7 days," NOT "Dreamers have unstable agency." (The latter implies a mechanism; the former reports the data).

  #### Case 3: The Chatbot (The Disappointing Constraint)
  **Scenario:** Collaborators want to interview a companion chatbot using the same protocol to establish it as a "conscious subject."

  *   **Step 1 (Briefing):** **FAIL.**
      *   *Reasoning:* Heterophenomenology requires a subject capable of having "seemings." A chatbot has no interiority to bracket. It cannot distinguish between "how it seems" and "what it says."
  *   **Step 2 (Interview):**
      *   *Constraint:* You cannot ask the bot "How did that feel?" because it has no feelings to report. It only simulates the *text* of a report.
      *   *Procedure Adjustment:* The bot is not a Subject; it is a **Stimulus Generator**. The *human user* interacting with the bot is the Subject.
  *   **Step 3 (Transcription):**
      *   Bot output is tagged `[STIM]` (Stimulus), not `[P]` (Phenomenal Report).
      *   Human user's report on the bot ("It seemed empathetic") is tagged `[P]`.
  *   **Step 4 (Archive):**
      *   *Core Seemings:* Human user *experienced* the bot as agential.
      *   *Subject Theory:* Human user *believes* the bot is conscious.
      *   *Bot Data:* No "Bot Worldview" can be constructed.
  *   **Step 5 (PI Sign-Off):**
      *   *Verdict:* **We cannot claim the chatbot is a conscious subject.** To do so violates the method's requirement for a witness to "seemings."
      *   *Collaborator Constraint:* Your HCI team will be disappointed. They want to claim "AI Phenomenology." This procedure forces you to claim "Human Phenomenology *of* AI."
      *   *Paper Claim:* "Users report experiencing the chatbot as a social agent," NOT "The chatbot demonstrates social agency."

  ---

  ### PART III: PRINCIPLED LIMITS

  As PI, you must communicate these limits to your team and in your publications. This procedure is a tool for data hygiene, not a solution to the Hard Problem.

  1.  **The Reality Gap:** Heterophenomenology deliberately suspends judgment on whether the experience matches reality. It solves the problem of "lying" or "error" by treating errors as data about the subject's worldview. It does **not** tell you if the meditator actually accessed a non-dual state, only that they believe they did.
  2.  **The Consciousness Attribution Problem:** As seen in the Chatbot case, this method cannot determine *if* a system is conscious. It can only catalog the *reports* of consciousness. If a system lies perfectly, the method treats it as a truthful witness to its own (possibly fictional) seemings. You must make an ethical and theoretical judgment *outside* the protocol to decide who/what counts as a subject.
  3.  **The Simplification Risk:** By tagging `[P]` vs `[T]`, we risk severing the lived unity of the subject's experience. For a meditator, the sensation and the theory may be phenomenologically fused. The procedure separates them for analysis, but you must acknowledge in discussion that this is an analytic fiction.
  4.  **No Normative Authority:** This archive cannot tell you which subjects are "better" witnesses. A confused dreamer is as data-rich as a clear-headed one, provided their confusion is well-documented. It prevents you from privileging "expert" subjects over "novice" ones purely on the basis of their doctrinal fluency.

  **Final Instruction:**
  Print SOP-HP-01. Require your assistants to submit the "Annotation Key" with every transcript. Reserve the "Interpretation Memo" solely for yourself. This ensures that while your team collects data consistently, the theoretical leap from "seeming" to "being" remains under your direct ethical and scientific supervision.
