answer: |-
  I recommend we adopt Option B: lower the voting age to 16 and extend the franchise to resident non-citizens, but we must drop compulsory voting and redirect the enforcement budget toward turnout outreach. This approach fixes the skewed electorate without creating unenforceable mandates that expose the city to litigation.

  Our current electorate is not a sample of the city; it is a specific interest group. In the last election, 11% turnout meant roughly 6,000 voters decided the stormwater bond and the community college rezoning. Two-thirds were homeowners over 60. They live here, yes, but their stakes differ from the single mother working at the food processing plant who rents near the plant, or the 16-year-old junior whose school funding depends on these bonds. Under Option B, the non-citizen parent who sends kids to district schools gets a say in the safety of the streets they walk. The 16-year-old gets a say in the future they inherit. We are aligning the vote with daily life, not just property deeds.

  To the members worried about Option #2: I hear your concern that a demos must be a bounded, identifiable group. You argue that "being affected" is too loose a standard. If affectedness alone granted votes, the out-of-state landlords paying property taxes should vote, as should the commuters clogging our roads, or even the state agency funding 40% of our budget. You are right that we cannot enfranchise everyone with a financial stake. But residency is the line because it implies a shared fate beyond transaction. Landlords can sell and leave; commuters sleep elsewhere. The non-citizen residents here—documented or not—breathe our air, use our clinics, and rely on our schools. They cannot "pick up and leave" easily. They are governed here in the mundane, daily sense that matters most, whereas the landlords are invested here. Residency binds people to the consequences of policy in a way ownership does not.

  However, we cannot recommend Option #3. Compulsory voting is the piece the city attorney will kill. Enforcing a $25 fine requires reliable notice, which we cannot guarantee for the 900 homeless residents lacking stable addresses. If we fine them, we face an equal protection challenge; if we don't, we enforce selectively. Furthermore, if we lower the voting age to 16 and mandate voting, we create a liability nightmare: does the fine go to the kid or the parent? "Conscientious abstention" solves the moral objection but not the legal one. The proponents of compulsion argue that voluntary voting allows organized minorities to capture city hall—and they are correct. Our 11% turnout is a takeover. But punishment is not the only tool to fix capture.

  We have $40,000. Instead of fines, we fund outreach. We partner with the high school for the civics course, but we decouple it from the vote to address concerns about conscripting kids into politics. The course runs; the vote is offered. Participation is encouraged, not mandated.

  Here is the timeline. In the spring, we pilot registration for 16-year-olds alongside the mock election. We measure not just raw turnout, but demographic alignment: do the voters look like the census? In the summer, we roll out non-citizen registration drives at the processing plant and school pick-up lines. By the fall election, we track retention: do new voters return, or was this a one-time spike? If turnout remains below 20% despite the $40,000 investment, we revisit compulsion then, once the legal landscape is clearer.

  This package respects the law while respecting the people actually living here. It acknowledges that the current system privileges stability over representation, and seeks to balance them without breaking the city's legal framework.

  \answer{B — Expand franchise, fund turnout, drop compulsion}
