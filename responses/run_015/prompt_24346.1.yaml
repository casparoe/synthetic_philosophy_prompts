          2.  If you admit you don't know $Con(M)$, you can't assert $G_M$ is true, only conditional ("If $M$ is consistent, then $G_M$").
      *   *Benacerraf's Objection:* This is the standard reference. We cannot identify *which* formal system represents the mind. There are infinitely many. To pick one, we need to know its consistency. We can't.
