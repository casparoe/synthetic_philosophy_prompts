answer: |-
  You and your roommate have stumbled onto one of the most persistent and difficult debates in contemporary metaethics. You are grappling with Bernard Williams' famous distinction from his 1979 paper, "Internal and External Reasons," and the subsequent objections raised by moral realists and Kantians.

  Let me put on my hat and walk through this with you. I want to validate your intuition first: your confusion is not a bug in your understanding. It is a feature of the view. Williams' internalism is designed to be counterintuitive to the moralist, precisely because he thinks our ordinary talk of "reasons" is often confused.

  However, I think your roommate's *reductio* (that the view collapses into a "anything goes" subjectivism) relies on a slightly flattened reading of Williams, and your professor's "zoom-out" comment points to the specific mechanism Williams uses to avoid that collapse.

  Let's break this down into three parts: the structure of the Internalist claim, the "Deadbeat Dad" objection, and the role of "Sound Deliberation."

  ### 1. The Motivational Set ($S$) is Not Just "Desires"
  The first place where the critique often goes off the rails is in defining the "motivational set" (which Williams calls $S$). Your summary says internal reasons hook up to "stuff I want, care about, am committed to, whatever." That "whatever" is doing a lot of heavy lifting.

  Williams is not a crude Humean who thinks reasons only stem from occurrent, visceral urges (like hunger or lust). The $S$ set includes:
  *   Dispositions of evaluation.
  *   Patterns of emotional reaction.
  *   Personal loyalties.
  *   Various projects and commitments.

  This is crucial for the Deadbeat Dad case. If the dad says, "I have no desire to help my kids," the Internalist asks: "Do you have a commitment to being a decent person? Do you care about your reputation? Do you have a general disposition to avoid causing suffering?"

  If the answer is "No, I have *nothing* in my psychological makeup that links to their welfare," then Williams bites the bullet: **That agent has no internal reason to support his children.**

  Your roommate is correct that Williams accepts this conclusion. He argues that if an agent truly lacks any motivational link to morality, telling them "you have a reason to be moral" is a fiction. It's just noise. It doesn't explain action, and it doesn't connect to their agency.

  ### 2. Does This Collapse into Subjectivism? (The Blame Question)
  Your roommate argues that if the Dad has no reason, we can't say he's doing anything *wrong*; we can only say we don't like it. She thinks this makes blame impossible.

  Here is where Williams (and I, following him) would push back. Williams distinguishes between **having a reason** and **being subject to blame**.

  In a later paper, "Internal Reasons and the Obscurity of Blame" (1989), Williams argues that blame is not a metaphysical judgment about the agent's reasons. Blame is a social practice. It is a "reactive attitude" (to borrow P.F. Strawson's term). We blame the Deadbeat Dad not because he violated an external cosmic rule, but because he violated a demand we make of members of our ethical community.

  We can say, "You ought to have done it," meaning "We demand this of you, and your failure damages your standing with us." We don't need to prove he had an internal reason to do it to justify our anger or our sanctions. We can still hold him accountable, punish him, or ostracize him. The "wrongness" is located in the breach of the social/ethical expectation, not necessarily in a failure of rationality internal to the agent.

  So, the view does not collapse into "anything goes." It collapses into "anything goes *for the agent's rationality*, but not *for our social response*." That is a hard pill to swallow, but it isn't incoherent.

  ### 3. The "Zoom-Out" and Sound Deliberation
  Now, let's address your professor's comment, which I suspect is the key to your unease. You called it a "zoom-out reason." In the literature, this is usually discussed under the header of **Sound Deliberation**.

  Internalism is not just about what you *currently* desire. It is about what you *would* desire if you deliberated correctly. Williams writes that an internal reason exists if the agent could reach the motivation to $\phi$ by a "sound deliberative route" from their existing $S$.

  What is a sound deliberative route? It isn't just calculating means to ends. It includes:
  *   Correcting factual errors.
  *   Correcting logical errors.
  *   **Imagining the outcomes vividly.**
  *   **Considering one's life as a whole.**

  This is the "zoom-out."

  Let's apply this to the Dad. He says, "I don't want to pay child support."
  The Internalist asks: "If you vividly imagined your children starving, and if you considered your long-term project of being a person who keeps promises, and if you corrected your false belief that 'money is all that matters,' would you then be motivated?"

  If the answer is **yes**, then he *does* have an internal reason, even if he doesn't feel it right now. The reason was there, obscured by bad deliberation (ignorance, lack of imagination, myopia).

  If the answer is **no** (he has imagined it all, knows the facts, and simply does not care), *then* he has no internal reason.

  This saves Internalism from crude subjectivism. Reasons aren't just "whatever I feel like right now." They are "what I would be motivated by if I were thinking clearly and broadly about my life." This makes the standard of reasons **objective** (there is a fact of the matter about what counts as sound deliberation) even if the *source* of the reason is **subjective** (grounded in the agent's psychology).

  ### 4. The "Blinking In and Out" Objection
  Your roommate's final point is that if the Dad later starts caring, a reason "pops into existence," which seems absurd. She thinks reasons should be stable truths, like math.

  Here, you have a fundamental clash between Internalism and Externalism (like the views of Thomas Nagel or Christine Korsgaard).
  *   **Externalists** believe reasons are like facts: "Torture is wrong" is true regardless of who is looking at it.
  *   **Internalists** believe reasons are relational: "X is a reason for A" is like "X is food for A."

  If I am allergic to peanuts, peanuts are not food for me. If I cure my allergy, they become food. Did the "food-status" blink in and out? No. The *relation* changed because the *agent* changed.

  Williams would argue your roommate is begging the question. She assumes reasons must be agent-independent. But if you accept the Internalist premise (that reasons must be able to explain action), then reasons *must* depend on the agent's constitution. So, reasons changing when the agent changes isn't a bug; it's a feature.

  ### The Verdict

  So, where does this leave you?

  1.  **Is your roommate right?** She is right that Williams accepts the "Deadbeat Dad" has no internal reason if he truly lacks the relevant motivation even after sound deliberation. She is wrong that this eliminates blame or moral criticism; it just relocates blame from "irrationality" to "social violation."
  2.  **Does the view collapse?** No, because of the "Sound Deliberation" clause. It prevents the view from being about momentary whims. It anchors reasons in a rational, idealized version of the agent's own psychology.
  3.  **Is the "Zoom-out" real?** Yes. It is the deliberative process that uncovers reasons hidden by ignorance or lack of imagination. It is not an "external reason" disguised; it is a latent internal reason made manifest.

  **My Professional Take:**
  The Internalist view does not collapse, but it does require you to give up the idea that morality has a "rational grip" on everyone universally. It suggests that if you meet a true psychopath (someone with no capacity for empathy or commitment), you cannot argue them into morality. You can only restrain them or express your disapproval.

  If that conclusion feels unacceptable to you—if you feel strongly that the Deadbeat Dad *is* being irrational, not just socially deviant—then you are likely an Externalist at heart. You believe there are reasons that apply to us simply because we are rational agents, regardless of our subjective motivations. That is a respectable position (held by Kantians and Rationalists), but it comes with its own metaphysical baggage (where do these external reasons live?).

  Williams thinks the Externalist view is "obscure" because it posits a mysterious link between the universe and my will. The Internalist view is clearer, but colder.

  Does that help clarify where the fault lines lie? You aren't missing a step; you're feeling the tension between wanting morality to be universal and wanting reasons to be explanatory. Williams forces you to choose.
