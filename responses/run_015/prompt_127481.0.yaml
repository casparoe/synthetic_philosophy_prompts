answer: |-
  You are not being a hypocrite. Your intuitions track a sophisticated decision-theoretic framework that your students are likely missing because they are applying **raw Expected Value (EV) maximization** with **unbounded utility** and **fixed credences**.

  If you try to justify your verdicts using standard EV ($Probability \times Stake - Cost$), you will indeed look inconsistent. Case 1 and Case 4 should dominate your life under raw EV, and Case 5 suggests you should spend *everything* on AI safety if the stake is truly existential.

  To save your verdicts, you need a principle that modifies how we treat probabilities and costs in high-stakes/low-credence environments. The principle that reconciles Cases 1–5 is **Epistemically Constrained Expected Value (ECEV)** combined with **Marginal Cost-Effectiveness**.

  Here is the breakdown of the principle, how it saves your verdicts, and what it predicts for the lottery case.

  ### The Principle: Epistemically Constrained Expected Value

  This framework relies on two filters that raw EV ignores:

  1.  **The Epistemic Defeat Condition:** When a claim involves extreme stakes, the probability that the *claim is a deception, error, or misunderstanding* rises faster than the probability that the *claim is true*. You only act on extreme stakes if the evidence for the probability is **robust** (empirical/model-based) rather than **testimonial** or **speculative**.
  2.  **The Marginal Cost-Effectiveness Threshold:** Even if an action has positive EV, you are not obligated to pursue it if the *marginal cost* exceeds the *marginal benefit* compared to alternative interventions (opportunity cost). This introduces rational "satisficing" or risk-aversion regarding resource allocation under uncertainty.

  ### Applying the Principle to Your Cases

  **Case 1 (Andromeda Mugging) & Case 4 (Torture Coin Flip)**
  *   **Verdict:** Don't pay / Take the bet.
  *   **Why:** These fail the **Epistemic Defeat Condition**.
  *   In Case 1, the credence ($10^{-20}$) is based on the word of a "rando." The probability that he is lying, deluded, or that you are misunderstanding the physics is vastly higher than $10^{-20}$. The probability estimate is not *grounded*.
  *   In Case 4, the link between the coin flip and the torture mechanism is speculative ($10^{-40}$). Without empirical verification of the mechanism, the credence is epistemically fragile. You are rationally permitted to treat "ungrounded tiny probabilities" as zero for decision-making purposes.

  **Case 2 (Earth Bomb)**
  *   **Verdict:** Pay.
  *   **Why:** This passes the **Epistemic Defeat Condition**.
  *   The threat is empirically verified ("device that will definitely blow up Earth"). The probability is grounded in physical observation, not testimony about magical powers. The epistemic security is high, so raw EV applies.

  **Case 3 (Climate Footprint)**
  *   **Verdict:** Modest reason, not life-ruining.
  *   **Why:** This passes Epistemic Defeat (scientific consensus) but hits the **Marginal Cost-Effectiveness Threshold**.
  *   The credence is grounded in models, not magic. However, "life-ruising obligation" implies extreme cost. Because individual footprint reduction has diminishing returns compared to systemic change or other altruistic acts, the *marginal* cost of a life-ruining lifestyle change outweighs the *marginal* expected benefit. You do the modest amount because it's cost-effective; you don't ruin your life because it isn't.

  **Case 5 (AI Safety Budget)**
  *   **Verdict:** 1% prudent, 10% paranoia.
  *   **Why:** This is the clearest example of **Marginal Cost-Effectiveness under Model Uncertainty**.
  *   The credence ($10^{-12}$) is model-based, so it passes Epistemic Defeat. However, models of AI failure are highly uncertain (ambiguity). Spending 1% is a robust hedge against model error. Spending 10% assumes the model is more accurate than it likely is; it sacrifices too much capability (opportunity cost) for a risk estimate that is fragile. The "paranoia" label correctly identifies that the marginal cost of the extra 9% exceeds the marginal gain in security given the uncertainty.

  ### The Prediction: The Lottery Case

  Now we apply **ECEV** to your pending case: *Buying lottery tickets that fund x-risk research.*

  *   **Epistemic Defeat:** Pass. The math of the lottery is robust; the link between funding and x-risk reduction is model-based (similar to Case 5).
  *   **Marginal Cost-Effectiveness:** **Fail.**
      *   Lottery tickets are an inefficient funding mechanism. A significant portion of the ticket price goes to overhead, state taxes, or prizes.
      *   If your goal is to fund x-risk research, a direct donation has 100% efficiency (minus processing fees). A lottery ticket might have 50% efficiency.
      *   Under the **Marginal Cost-Effectiveness Threshold**, you are obligated to use the *most efficient* means to achieve the expected good. Buying the ticket is a "waste" relative to direct donation.

  **Verdict:** **Do not buy the ticket.**
  **Caveat:** The only exception is if the lottery mechanism creates *additionality* (e.g., money that would not have been donated otherwise is now funding research). But if you are asking whether *you* should buy it as a rational agent trying to save the world, the principle says: **Donate directly instead.**

  ### Pedagogical Advice for Your Unit

  Your students are likely stuck on **Pascal's Mugging** because they are treating probabilities as fixed numbers rather than estimates subject to error.

  1.  **Introduce "Meta-Uncertainty":** Teach them that $P$ is not a scalar, but a distribution. In Case 1, the variance on $P$ is huge. In Case 2, the variance is tiny. Rationality requires weighting decisions by the *confidence* in $P$, not just $P$ itself.
  2.  **Distinguish Testimony from Evidence:** Draw a hard line between "I claim I can do X" (Case 1) and "Here is a device that does X" (Case 2). This solves the mugging without needing bounded utility functions.
  3.  **Opportunity Cost is Moral:** In Cases 3 and 5, emphasize that resources spent on low-probability hedges are resources *not* spent on high-probability saves. "Paranoia" is simply recognizing when the opportunity cost of safety exceeds the expected loss.

  **Summary for your students:**
  "You aren't ignoring the math; you're accounting for the probability that the math is wrong. You don't pay the mugger because the chance he's lying is higher than the chance he's a god. You don't spend 10% on AI safety because the model isn't confident enough to justify that cost. And you don't buy the lottery ticket because direct donation saves more expected lives per dollar."

  This keeps you consistent, rational, and sane.
