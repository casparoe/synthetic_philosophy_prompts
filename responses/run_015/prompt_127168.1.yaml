      *   The Reveal undermines that strength.
      *   This is the core experience.

      *   *Okay, ready to write.*
answer: |-
  The mechanism that does the work is the hidden partition of the class into independent and copied evidence groups, which forces students to experience the collapse of evidential weight when symmetry is revealed to be illusory.

  ### Materials and Setup

  *   **Room:** One table or clustered seating for 14 students. Projector screen visible to all.
  *   **Urn:** One opaque bag containing 100 poker chips (60 Red, 40 Blue). This is the "Master Urn."
  *   **Evidence Packets:** 14 sealed envelopes, numbered 1–14.
      *   **Envelopes 1–7 (Independent):** Each contains 5 chips drawn randomly from the Master Urn (with replacement between draws to maintain probability). Each envelope has a different random sample.
      *   **Envelopes 8–14 (Copied):** Each contains a card showing a photograph of 5 chips (3 Red, 2 Blue). All seven envelopes contain the exact same card.
  *   **Student Cards:** 14 index cards per student (stacked).
  *   **Projector:** A simple spreadsheet open to a blank grid with columns: *Student ID, Estimate 1, Estimate 2, Estimate 3, Rule Parameter, Rule Iteration 1, Rule Iteration 2, Final Score.*
  *   **Tokens:** None needed; scores are projected points.

  ### The Scoring Rule (Brier Score)

  Display this formula on the board before the session starts. Do not explain it verbally unless asked.

  $$ \text{Points} = 100 \times (1 - (\text{Your Estimate} - \text{Truth})^2) $$

  *   **Truth:** 1 if the Master Urn has more Red chips than Blue (it does: 60/40). 0 if more Blue.
  *   **Your Estimate:** A number between 0.0 and 1.0 representing your probability that Truth = 1.
  *   **Worked Example:**
      *   Truth = 1.
      *   You estimate 0.90. Points = $100 \times (1 - (0.9 - 1)^2) = 100 \times (1 - 0.01) = 99$.
      *   You estimate 0.50. Points = $100 \times (1 - (0.5 - 1)^2) = 100 \times (1 - 0.25) = 75$.
      *   You estimate 0.10. Points = $100 \times (1 - (0.1 - 1)^2) = 100 \times (1 - 0.81) = 19$.

  ### Timeline (80 Minutes)

  **00:00 – 00:10: Distribution and Evidence**
  *   Hand each student an envelope. Instruct them not to open it until told.
  *   **Instructor Script:** "Open your envelope. Count the red and blue chips or examine the card. Do not show anyone. Do not speak. On the top index card, write your Student ID (1–14). Write your private estimate of the probability that the Master Urn is majority Red. Write it as a decimal between 0.0 and 1.0. Hand this card to me."
  *   Collect cards. Enter *Estimate 1* into the projector spreadsheet.

  **00:10 – 00:25: Public Data and Revision**
  *   Project the column of *Estimate 1*.
  *   **Instructor Script:** "These are the estimates of everyone in this room. You do not know who holds which number. On a new card, write your ID and a revised estimate. You may move your number toward the group, away from it, or keep it still. Hand this card to me."
  *   Collect cards. Enter *Estimate 2* into the spreadsheet.

  **00:25 – 00:35: The Reveal of Evidence Structure**
  *   **Instructor Script:** "Look at your envelope again. Students 1 through 7 drew physical chips from the urn. Students 8 through 14 looked at a photograph of a single draw. The photograph was identical for all of you. Write this on your card: 'Independent' or 'Copied'. Hand it in."
  *   Update the spreadsheet to show a column marking "Ind" or "Cop".
  *   **Instructor Script:** "You may now discuss the evidence structure with your neighbors for two minutes. Then, on a final card, write your ID and your Final Estimate. This estimate will be scored."
  *   Collect cards. Enter *Estimate 3*. Calculate scores using the formula. Display the *Final Score* column.

  **00:35 – 00:55: The Rule Loop**
  *   Hand out a new card.
  *   **Instructor Script:** "Write a 'Movement Rule' number between 0.0 and 1.0. This number represents this policy: 'When I see the class mean differs from my view, I move this fraction of the distance toward the mean.' 0.0 means you never move. 1.0 means you adopt the mean completely. Write your ID and your Rule. Hand it in."
  *   Enter *Rule Parameter* into spreadsheet. Calculate the Class Mean Rule ($\bar{r}$). Display it.
  *   **Instructor Script:** "Look at the Class Mean Rule on the screen. Apply your own Rule to yourself. If your Rule is $r$ and the Mean is $\bar{r}$, your new Rule is $r + r(\bar{r} - r)$. Write this new number as 'Iteration 1'. Hand it in."
  *   Enter *Rule Iteration 1*. Calculate new Mean. Display it.
  *   **Instructor Script:** "Apply your original Rule again to the new Mean. Write 'Iteration 2'. Hand it in."
  *   Enter *Rule Iteration 2*. Display the three columns of Rules side-by-side.

  **00:55 – 01:20: Debrief**
  *   (See Debrief Plan below).

  ### Instructor Script (Pre-Debrief)

  *   **Start:** "This seminar is an exercise in estimation. There are no trick questions, but there is hidden information. Follow the instructions on the cards exactly. Do not speak until the discussion period."
  *   **During Rule Loop:** "Calculate precisely. Use your calculator. This is not about opinion; it is about applying the number you wrote."
  *   **Transition to Debrief:** "Stop writing. Put pens down. The game is over. Everything you saw on the screen was real, but half of the evidence in this room was an illusion. We will now talk about why."

  ### Debrief Plan (20 Minutes)

  **1. The Evidence Sting (5 Minutes)**
  *   **Map:** Point to the *Copied* group's scores versus the *Independent* group's scores.
  *   **Talk:** "Students 8 through 14: When you saw seven people agree with you in Round 1, you felt pressure to conform. You treated those six other people as six new sources of information. They were not. They were mirrors. You were punished in the scoring rule not for being wrong, but for being confident in a consensus that had no weight. This is the independence condition. Symmetry only forces you to move if the symmetry is real."

  **2. The Rule Loop (5 Minutes)**
  *   **Map:** Point to the *Rule Parameter* columns.
  *   **Talk:** "Some of you wrote 0.0. Your number did not move. Some of you wrote 0.5. Your number moved toward the mean, changing the mean, moving you again. Look at the sequence. If you believe you should move toward others, you must also move toward others who believe you should not move. Does your rule stabilize? Or does it chase its own tail? This is the self-application problem. You cannot hold a rule for disagreement that you refuse to apply to the disagreement about the rule."

  **3. Accuracy vs. Harmony (5 Minutes)**
  *   **Map:** Point to the *Final Score* column.
  *   **Talk:** "The scoring rule punished hedging. If you said 0.5 to be safe, you capped your score at 75. If you said 0.9 and were right, you got 99. If you said 0.9 and were wrong, you got 19. Being agreeable (moving toward the mean) did not guarantee points. Only being accurate did. Sometimes the group was wrong. If you conciliated with a wrong group, your score dropped. Accuracy is the only thing that pays."

  **4. Limitations and Jargon (5 Minutes)**
  *   **Talk:** "In this game, I could reveal the Truth (the Urn composition). In real life, you rarely get to open the Urn. You have to decide whether to trust your peer without knowing who is right. Also, I assigned your 'peer' status. In real life, disagreement itself makes you question if the other person is your equal. We call the view that you must move 'Conciliationism.' We call the view that you may hold firm 'Steadfastness.' We call the requirement that evidence must be separate 'Independence.' You have just felt the cost of ignoring them."

  ### Troubleshooting

  *   **The Refuser:** If a student refuses to write a number during the Rule Loop, tell them: "A null entry is scored as 0.5 for the purpose of the class mean, but your personal score for this exercise will be zero. You must submit a number to complete the seminar."
  *   **The Urn Puzzle:** If a student asks, "What is the exact ratio of the urn?" during the game, reply: "You are estimating the probability that Red is the majority. That is the only question." If they persist, note their ID and deduct 10 points from their final score for breaking protocol.
  *   **The Hedge:** If everyone writes 0.5 for their estimates, the scoring rule will show everyone earned 75 points. Point this out in the debrief: "You all survived, but no one won. The scoring rule is designed to make hedging costly when you have evidence. If you felt you had evidence and still hedged, you left points on the table."
  *   **The Recursion Crash:** If the Rule Loop converges instantly (e.g., everyone writes 1.0), note it: "Total convergence. You all agreed to agree. This is stable, but it assumes the group is always right. If the group was the 'Copied' group, you all just agreed to be wrong together."

  ### Limitations (Instructor Note)

  *   **What the Game Cannot Reproduce:** The game cannot reproduce the *erosion of peer status*. In the game, students 1–14 are fixed as equals. In reality, when a friend disagrees with you, you often downgrade them from "equal" to "mistaken," which dissolves the obligation to conciliate. The game forces the equality condition to hold even when you want to break it. You must argue this point verbally in the debrief: "The hardest part of real disagreement is deciding whether the person opposite you is still a peer. This game assumed they were. That is the generous assumption you must justify in real life."
  *   **The Truth Bias:** The game reveals the Truth immediately. This biases students toward thinking disagreement is always resolvable. You must warn them: "In philosophy, politics, and science, the Urn often stays closed. You have to live with the score without knowing if you won."
