answer: |-
  Here is a decision procedure designed for your constraints. It is built on the logic of *process tracing* and *Mill's Methods*, stripped of the jargon. It is designed to force a commitment or force a confession of ignorance.

  ### Part 1: The Failure Modes
  Before you run the procedure, you need to know where it usually breaks. These are the four traps that make the Investment Committee impatient.

  1.  **The Re-Description Trap:** You call it "Culture," but you describe "Institutions."
      *   *Example:* Saying "There is a culture of tax evasion" is just saying "The tax institution is unenforced." If you can't point to a norm that exists *independently* of the law, you aren't measuring culture.
  2.  **The Collinearity Trap:** Everything moves together.
      *   *Example:* Rich countries have good courts, temperate weather, and high trust. If you only look at the success, you can't tell which one did the work. You need a case where one changed and the others didn't.
  3.  **The Time-Horizon Trap:** You mix centuries with quarters.
      *   *Example:* Geography works over 500 years. Institutions work over 50. Culture works over 100. If you try to explain a 5-year GDP spike with "Culture," you are wrong. If you explain a 50-year stagnation with "A specific tax law," you are probably missing the deeper current.
  4.  **The Intervention Trap:** You identify a true cause that you cannot fix.
      *   *Example:* You prove that "Being Landlocked" is the main cause of low growth. That is scientifically honest, but operationally useless. The Committee needs to know if the cause is *actionable*.

  ---

  ### Part 2: The Causal Triage Procedure
  **Time budget:** 4–6 hours of desk research.
  **Tools:** Secondary sources (World Bank reports, historical summaries, regional comparisons), Whiteboard.
  **Goal:** Reach one of three endpoints: **(A) Institutions**, **(B) Geography/Culture (Non-Actionable)**, or **(C) Not Identifiable.**

  #### Step 1: The Variation Check (The "Within-Case" Test)
  *Ask:* Is there significant variation *inside* this country across regions or time periods?
  *   **Yes:** Go to Step 2.
  *   **No:** (e.g., The country is tiny, homogenous, and nothing has changed in 20 years).
      *   *Stop.* **Verdict: Not Identifiable.** You cannot separate variables if they don't move. Write: "Lack of internal variation prevents causal isolation. Recommendations must be based on regional analogues, not domestic history."

  #### Step 2: The Twin Test (The "Regional Control" Test)
  *Ask:* Can I point to a neighboring country (or region) that shares the Geography and Culture but has different Institutions (or vice versa)?
  *   **Yes:** (e.g., North vs. South Korea, Dominican Republic vs. Haiti).
      *   *Action:* This is your strongest evidence. If the Twin has different outcomes, the thing that *differs* is your causal candidate.
      *   *Go to Step 4.*
  *   **No:** (e.g., Every neighbor has the same bad institutions and the same bad weather).
      *   *Action:* You cannot rule out Geography or Regional Culture.
      *   *Go to Step 3.*

  #### Step 3: The Timing Test (The "Sequence" Test)
  *Ask:* Did the proposed cause clearly precede the effect?
  *   **Institutions:** Did the reform happen *before* the growth spike? (Beware of reverse causality: growth often buys better courts).
  *   **Geography:** Has the geography been constant while outcomes changed? If yes, Geography is likely *not* the driver of the *change* (though it may set the baseline).
  *   **Culture:** Has the cultural norm existed for centuries while outcomes fluctuated? If yes, Culture is likely a background condition, not the trigger.
  *   **Decision:**
      *   If the timing is muddy (e.g., reforms and growth happened simultaneously): **Stop.** **Verdict: Not Identifiable.**
      *   If the timing is clear: **Go to Step 4.**

  #### Step 4: The Mechanism Plausibility Test
  *Ask:* Is there a direct, logical chain from Cause to Effect that doesn't rely on magic?
  *   **Institutions:** "Property rights secured -> Investors felt safe -> Capital inflow." (Plausible).
  *   **Culture:** "High trust -> Lower transaction costs -> Growth." (Plausible, but hard to measure).
  *   **Geography:** "Port access -> Lower shipping costs -> Trade." (Plausible).
  *   **Fail Condition:** If you have to say "This institution changed the *culture* which then changed the *economy*," you are back to Step 1. You are describing a chain, not a root cause.
  *   **Decision:** If the mechanism relies on unobservable shifts in "mindset" without institutional backing, downgrade the confidence.

  #### Step 5: The Intervention Test (The "So What?" Test)
  *Ask:* If the Fund spends $50M to fix this cause, will the outcome change in 5 years?
  *   **Institutions:** Maybe. (Hard, but possible).
  *   **Geography:** No. (You can't move the mountains).
  *   **Culture:** No. (You can't buy trust in 5 years).
  *   **Decision:**
      *   If the answer is **No**: You must classify this as **Non-Actionable**. You can write the diagnostic, but you must recommend *mitigation*, not *reform*.
      *   If the answer is **Yes**: You have permission to classify as **Institutions**.

  ---

  ### Part 3: Running the Procedure (Two Cases)

  #### Case 1: The Clean Call — Botswana
  *Context:* Committee expects a success story. You need to justify why.

  1.  **Variation Check:** **Yes.** Botswana grew rapidly post-1966 while neighbors stagnated.
  2.  **Twin Test:** **Yes.** Compare to Zimbabwe or Zambia.
      *   *Geography:* Similar (landlocked, semi-arid, diamonds/minerals present in region).
      *   *Culture:* Similar (Tswana culture extends across borders; colonial legacy similar).
      *   *Institutions:* **Different.** Botswana maintained pre-colonial tribal councils (*kgotla*) and avoided civil war; neighbors suffered expropriation and conflict.
  3.  **Timing Test:** **Clear.** Institutional stability (Khama/Masire era) preceded the diamond revenue management. The rules were set *before* the money arrived.
  4.  **Mechanism:** **Plausible.** Secure property rights on mining contracts -> Revenue reinvestment -> Public goods.
  5.  **Intervention:** **Yes.** Governance programs can replicate aspects of this (transparency, contract enforcement).

  *   **Procedure Verdict:** **Institutions.**
  *   **Drafting Note:** You can write confidently: "While geography provided the resources, institutional variance explains the divergence from regional peers. Reform programs targeting revenue transparency are actionable."
  *   **Senior Economist Sign-off:** Pass. The logic holds, the counterfactual (Zimbabwe) is clear.

  #### Case 2: The Hard Call — Haiti
  *Context:* The Committee has funded Haiti for 20 years. Their favorite story is **"Weak Governance."** They believe if they just fix the courts and the customs authority, growth will follow. You, as a political scientist, want to believe this too, because it justifies your job (writing governance diagnostics).

  *Run the Procedure:*

  1.  **Variation Check:** **Yes.** Haiti has had periods of relative calm and periods of collapse.
  2.  **Twin Test:** **Yes.** Compare to the Dominican Republic (shares the same island).
      *   *Geography:* **Different.** DR has more arable land, better ports. Haiti is mountainous, deforested, in the hurricane belt.
      *   *Culture:* **Divergent.** Colonial history differs (French extraction vs. Spanish/other). Language and social trust differ significantly today.
      *   *Institutions:* **Different.** DR has had stronger state capacity.
      *   *Problem:* **Everything is different.** You cannot isolate Institutions from Geography or Culture. The "Twin" is too different to be a control.
  3.  **Timing Test:** **Muddy.** Did weak institutions cause the poverty, or did poverty/earthquakes cause the weak institutions?
      *   *Evidence:* The 2010 Earthquake destroyed state capacity. Was that institutions? No, that was Geography/Shock. But the *recovery* was institutional. They are tangled.
  4.  **Mechanism:** **Plausible but fragile.** "Fix courts -> Investment." But why haven't courts been fixed? Because elites benefit from weakness (Culture/Politics) and the state has no tax base (Geography/Economy).
  5.  **Intervention:** **No.**
      *   *Question:* If the Fund spends $50M on court reform, will growth happen in 5 years?
      *   *Reality:* Unlikely. The geographic constraints (disaster risk) and deep social fragmentation (culture/trust) swamp the institutional intervention.
      *   *Procedure Command:* **Downgrade to Non-Actionable / Not Identifiable.**

  *   **Procedure Verdict:** **Not Identifiable (Confounded by Geography and History).**
  *   **Why You Won't Like This:**
      *   **The Committee:** They hate this. They want to fund a "Rule of Law" project. This verdict tells them their favorite project is wishful thinking.
      *   **You:** You hate this because you can't write a crisp "Recommendation: Strengthen Judicial Independence." You have to write: "Recommendation: Humanitarian mitigation; structural reform is currently high-risk/low-identification." That sounds like failure.
      *   **The Truth:** The Procedure is right. In Haiti, "Institutions" are not an independent variable; they are a dependent variable of Geography and History. Treating them as a lever you can pull is scientifically dishonest.
  *   **Senior Economist Sign-off:** This will bounce initially. The Senior Economist will say, "We can't tell the Committee 'we don't know'."
      *   *Your Counter:* "If we claim it's Institutions, we are claiming that Haiti is Zimbabwe. But Haiti faces disaster risks Zimbabwe doesn't, and trust deficits Zimbabwe doesn't. If we fund institutional reform without accounting for the geographic baseline, the ROI model is false. The Procedure forces us to price the risk correctly."

  ### Part 4: How to Sell This to the Committee

  When you submit the diagnostic, do not attach the philosophy. Attach the **Causal Confidence Score**.

  *   **High Confidence (Botswana):** "Variance explained primarily by institutional choices. Actionable."
  *   **Low Confidence (Haiti):** "Causal factors confounded. Institutional metrics correlate with outcomes, but exogenous shocks (geography/history) prevent isolation. Intervention risk: High."

  This allows the Committee to make the business decision ("We'll fund it anyway") without you making a false scientific claim ("Institutions are the cause"). It protects your reputation with the Senior Economist and keeps you from writing three paragraphs of survey text that say nothing.

  **Final Rule:** If the Procedure tells you "Not Identifiable," do not guess. Write "Not Identifiable." It is better to be the analyst who flagged the risk than the analyst who recommended a reform that failed because the diagnosis was wrong.
