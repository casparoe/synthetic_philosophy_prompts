answer: |-
  The framing is robust, though with one necessary refinement: "gravity" depends less on public credibility than on legal enforceability. If a label loses legal utility, advocacy gravity collapses regardless of public sentiment. The premise that conceptual work moves practice is valid only if "practice" includes advocacy framing and legal argumentation, not just statutory change. With that caveat, the gravity/elasticity trade-off and the archives critique are sound guides for this budget.

  I am trading off four criteria: **upstream-ness** (does this answer determine the others?), **tractability** (can a paper conclude this in two years without data?), **neglectedness** (is this insight missing from current advocacy?), and **downstream effect** (will this change what advocates say tomorrow?). These conflict: the most upstream questions (moral philosophy) often have the lowest immediate downstream effect, while the most actionable questions (vocabulary strategy) depend on the upstream answers. I prioritize upstream-ness and tractability to ensure the budget builds a foundation rather than merely decorating existing assumptions.

  Here are the three lines of work to fund first, in order:

  **1. Intent versus Destructive Pattern (incorporating the Archives Problem)**
  *   **Why it is upstream:** This defines the eligibility threshold for the label. Until we determine whether the legal test should match Lemkin's wider vision (structural destruction) or the codified narrow vision (specific intent), we cannot know which cases qualify, rendering questions of prevention or vocabulary premature. It also addresses the archives bias: an intent test favors bureaucratic killers over chaotic ones.
  *   **What a paper could establish:** A legal-philosophical argument demonstrating that a "destructive-pattern" standard is consistent with international law precedents, or conversely, proving that abandoning intent destroys the law's coherence. It can map how the archives bias systematically excludes certain atrocities without changing the statute.
  *   **Evidence to move it:** An International Court of Justice ruling that significantly tightens or loosens the intent requirement would move this down (if settled) or up (if contested) the list.

  **2. The Distinctive Moral Kind**
  *   **Why it is upstream:** This justifies the gravity. If the destruction of a group is not morally distinct from mass murder (crimes against humanity), then fighting for the genocide label is merely branding. This determines whether the gravity/elasticity trade-off is worth managing or if we should abandon the label for a broader umbrella.
  *   **What a paper could establish:** A rigorous philosophical defense (or critique) of group destruction as a unique moral evil distinct from individual killing. It can clarify whether the current legal definition tracks this moral kind or merely a legislative accident.
  *   **Evidence to move it:** A shift in UN Security Council rhetoric treating "ethnic cleansing" as synonymous with genocide would move this up, signaling a need to solidify the moral distinction.

  **3. Early-Warning and Prevention Reframing**
  *   **Why it is upstream:** This operationalizes the definition. Once we know what counts (Intent/Pattern) and why it matters (Moral Kind), we must determine if the label can apply *before* intent is provable to trigger prevention. This bridges the gap between legal classification and advocacy utility.
  *   **What a paper could establish:** A policy framework showing how advocates can use "risk of genocide" language without triggering legal backlash for false positives. It can define the conceptual boundary between prediction and accusation.
