      *   **Critique Point 3 (Sloppiness):** The intuition that "if partial exit is cheap enough escalation collapses" needs scrutiny. Even with partial exit, if the *relative* loss of staying is perceived as smaller than the sunk cost, escalation might continue in smaller increments. Also, the "fee to reduce exposure" needs to be clearly defined. Is it a penalty? Is it just reducing investment? In R&D, reducing headcount *is* reducing investment, but the "exposure" might be reputational or strategic, not just financial.
