answer: |-
  **Seminar Plan: Kavka's Toxin Puzzle**
  **Duration:** 50 minutes
  **Audience:** First-year undergraduates (no philosophy background)

  ### I. Pre-Conditions: Conceptual Groundwork (0–10 minutes)
  *Before stating the puzzle, you must secure three conceptual distinctions. If you omit these, the discussion will collapse into psychology or semantics.*

  1.  **Intention vs. Desire:** Establish that one can intend to do what one does not desire to do (e.g., intending to visit the dentist whilst desiring not to).
  2.  **Intention vs. Prediction:** Establish that intending is not merely predicting one's own behaviour. One can predict one will fail (e.g., 'I intend to diet, but I know I shall eat cake') without the intention being rendered null, though there is a normative pressure for intention to align with belief.
  3.  **Instrumental Rationality:** Establish the baseline principle that a rational agent does not incur a cost without a compensating benefit.

  **Pedagogical Move:** Use mundane examples (gym attendance, studying) to secure these distinctions. Do not mention the toxin yet. Ask the room: *'If I predict I shall not go to the gym, can I genuinely intend to go?'* Allow brief debate to settle on the view that intention requires a belief in the possibility of success, but is distinct from the prediction itself.

  ### II. Stipulating the Case: Features and the Detector (10–20 minutes)
  *You must construct the scenario carefully to isolate the rational formation of intentions.*

  **The Infallible Intention-Detector:**
  You **should** stage this with an infallible intention-detector, but you must frame it correctly to avoid epistemic misdirection.
  *   **Do not** describe it as a brain-scanning machine or a psychological test. This invites questions about neuroscience or bluffing ('Can I trick the scanner?').
  *   **Do** describe it as a **stipulation of the thought experiment**. Tell the students: *'For the purposes of this seminar, we accept as a brute fact that the Billionaire knows your mental state with perfect accuracy at midnight.'* This removes the epistemic problem ('How does he know?') and forces the ontological problem ('Can the intention exist?').

  **Essential Features:**
  *   **The Reward:** £1 million is deposited *before* the act is required.
  *   **The Cost:** Drinking causes genuine sickness (a disutility).
  *   **The Agent:** The agent is fully rational and knows they are fully rational.
  *   **The Exclusion:** There are **no external binding mechanisms**. You must explicitly state that the agent cannot bind their future self (no contracts, no guns to their head, no public reputation at stake).

  ### III. Managing Misconceptions (20–40 minutes)
  *Misconceptions will arise in a predictable sequence. Do not merely answer them; defuse them at the specific points below to maintain the philosophical tension.*

  1.  **Misconception:** *'The answer is simply to take the money and not drink.'*
      *   **When it arrives:** Immediately after you state the payout structure.
      *   **How to defuse:** Do not argue yet. Acknowledge it as the intuitive response, then point out the temporal gap. Ask: *'If you know at 9 a.m. tomorrow that you will not drink, could you have genuinely intended at midnight?'* This forces them to see that the 'smart' answer relies on an impossibility in the prior mental state.

  2.  **Misconception:** *'One can intend it because one may turn out to be less rational than one now expects.'* (i.e., 'I might be weak-willed tomorrow').
      *   **When it arrives:** During the discussion of the agent's psychology.
      *   **How to defuse:** Remind them of the **Rational Agent stipulation** made in Section II. State firmly: *'In this puzzle, we are testing rationality, not psychological fragility. We must assume you know your own future rationality.'* This blocks the appeal to accidental irrationality.

  3.  **Misconception:** *'The case merely shows an intention to be a prediction about oneself.'*
      *   **When it arrives:** Often raised as a theoretical objection to the puzzle's coherence.
      *   **How to defuse:** Refer back to the **Pre-Conditions (Section I)**. Remind them that you have already agreed intention is distinct from prediction. If intention *were* merely prediction, the puzzle would vanish, but we are operating under the understanding that intention is a commitment to act, not a forecast.

  4.  **Misconception:** *'A commitment device would dissolve it.'* (e.g., 'I would pay a friend to shoot me if I don't drink').
      *   **When it arrives:** When students attempt to 'solve' the puzzle practically.
      *   **How to defuse:** Refer back to the **Exclusion clause** in Section II. Remind them that the puzzle isolates the *intention*, not the *ability to manipulate constraints*. State: *'If you change the incentives, you change the problem. We are asking if the intention is possible without external coercion.'*

  ### IV. Assessment and Exclusion (40–50 minutes)

  **The Assessment Question:**
  To test if they have grasped the issue, put this question to the whole room for a final show of hands or brief discussion:
  > *'On the morning after receiving the money, do you have **any** reason to drink the toxin?'*

  *   **Why this works:** If they say 'Yes', they have missed the instrumental irrationality of the act (the money is already in the bank). If they say 'No', they must explain how they could have intended to do it the night before without a reason. This captures the diachronic tension.

  **The Excluded Topic:**
  You must openly decline to pursue **Practical Precommitment Strategies (Ulysses Pacts)**.
  *   **How to state it:** In the final five minutes, say: *'Many of you wish to discuss how to tie yourselves to the mast to ensure you drink. We are setting that aside. This seminar is not about how to win the money; it is about whether a rational mind can form the intention without those ties. We are analysing the architecture of rationality, not engineering a solution.'*

  This keeps the seminar focussed on the theoretical paradox rather than practical game-playing.
