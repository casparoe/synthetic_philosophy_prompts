answer: |-
  # PRE-MEETING STRATEGY SHEET
  **To:** Proposal Author
  **Re:** Acquisitions & Display Committee Q&A Preparation
  **Subject:** Reattributed Dutch-School Canvas ("Display-Value" Proposal)

  ## I. PREEMPTIVE CONCESSIONS
  *Make these statements in your opening remarks. Do not wait to be asked. This disarms the "gotcha" instinct and builds trust.*

  1.  **Concede Authenticity Fully:** "Let me be unequivocal: scientifically and connoisseurially, this is a twentieth-century imitation. It is not a seventeenth-century object. I am not asking you to blur that line."
  2.  **Concede Standard Practice:** "Standard museum practice dictates deaccessioning or storage. I am explicitly proposing an exception, not a new rule."
  3.  **Concede Risk:** "I understand this carries reputational risk. If we cannot mitigate the headline 'Museum Hangs Fake,' this proposal should not proceed."

  ## II. THE SINGLE REPLY THAT MUST LAND
  *If this argument fails, the proposal fails. It must be delivered clearly, without jargon, likely in response to the Curator or Trustee.*

  **The Argument:** "We are not valuing the *object* as a seventeenth-century artifact; we are valuing the *event* of its reception. An original is valuable not because of the atoms the artist touched, but because it is the causal source of a historical chain. This canvas *was* the causal source for a mid-century painter's work and for seventy years of public viewing. That causal history is real, regardless of the attribution error. We preserve historical evidence, and this object is now evidence of *our* history, not just the Dutch Golden Age."

  ## III. Q&A SHEET: OBJECTIONS & REPLIES
  *Ordered by potential damage to the proposal (Highest to Lowest).*

  ### 1. General Counsel (Legal/ Liability)
  **Objection:** "If we label this as an imitation but keep it in the permanent collection display, are we not inviting consumer protection claims? A visitor could claim they paid admission under false pretenses. If we know it's a fake, displaying it prominently looks like institutional fraud, regardless of the label."
  **Reply:** "We mitigate this through radical transparency. The label will not say 'Attributed to'; it will say 'Twentieth-Century Imitation, historically catalogued as Dutch.' We are not deceiving the public; we are educating them on the history of taste. Legally, fraud requires intent to deceive. Our intent is explicitly the opposite: to disclose. We treat it as a historical document of our own institution, similar to displaying a forged deed in an archive."
  **Soft Spot:** Relies on the assumption that the average visitor reads labels. If the press runs a headline "Museum Hangs Fake" without the nuance, legal counsel will still fear nuisance suits.

  ### 2. Development Director (Reputation/ Donors)
  **Objection:** "Donors give us masterpieces, not lessons in failure. If the press gets wind that we're 'keeping fakes,' it undermines the prestige of the entire collection. Major gifts often come with the expectation of scholarly rigor. This looks like we're making excuses for a mistake."
  **Reply:** "We reframe the narrative from 'mistake' to 'provenance transparency.' Donors increasingly value ethical stewardship and honesty. By showing we can admit error and contextualize it, we demonstrate integrity. We can pitch this to donors as a specific project on 'The Life of Objects,' turning a liability into a unique educational asset that no other museum is brave enough to display."
  **Soft Spot:** If a major donor threatens to pull support specifically over this, this argument collapses. You need a champion donor in the room to validate the "educational asset" angle.

  ### 3. Trustee / Art-Market Economist (Market Signaling)
  **Objection:** "You argue that influence confers value. If museums start displaying and valuing high-quality fakes because they 'fooled people for a while,' doesn't that distort the market? It blurs the line between authentic and inauthentic, potentially propping up the value of forgeries."
  **Reply:** "It does the opposite. By explicitly labeling it an imitation, we reinforce the premium on authenticity. We are saying, 'This is valuable *despite* being a fake, because of its history,' which confirms that being a fake usually means valueless. We are creating a niche category of 'historical influence,' not challenging the market valuation of originals."
  **Soft Spot:** The distinction is subtle. If the market perceives museums as "safe harbors" for fakes, prices for uncertain works could rise. You must emphasize the *rarity* of this exception.

  ### 4. Senior Curator (Scholarly Integrity)
  **Objection:** "This undermines connoisseurship. If we hang copies because they have a 'story,' why bother with attribution at all? It dilutes the scholarly standard of the gallery. We become a history museum of our own errors rather than a museum of art."
  **Reply:** "It expands the definition of art history to include reception history. The mid-century painter who copied this thought it was real. That belief changed art history. By removing the canvas, we erase that historical fact. We aren't hanging it as a Dutch master; we are hanging it as a primary source for mid-century reception. That is rigorous scholarship, not a dilution of it."
  **Soft Spot:** **This is your weakest point.** The Curator may press: "But the influence rested on a lie." (See Q6 below). If the Curator feels this lowers the bar for the gallery, they will block it.

  ### 5. The "Dangerous Question" (Likely Curator or Trustee)
  **Objection:** "On your view, if a fraud goes undetected long enough, does it eventually earn the value it falsely claimed? If we find out in 2090 that a Van Gogh is a fake, but it influenced everyone in the 20th century, do we keep calling it valuable?"
  **Reply:** "No. There is a distinction between *ontological* value (what the object is) and *relational* value (what the object did). A undetected fraud gains relational value—it becomes historically significant—but it does not become an authentic Van Gogh. We would relabel it exactly as we are doing here. The value isn't the false claim; the value is the documented impact. We honor the impact without endorsing the fraud."
  **Soft Spot:** This is philosophically dense. If you stumble here, you look like you are arguing that fakes *become* originals. Keep the distinction sharp: Significance $\neq$ Authenticity.

  ### 6. Provenance Researcher (The "False Attribution" Weak Point)
  **Objection:** "You admit the mid-century painter copied this thinking it was Dutch. The influence rested on a false attribution. Does influence count if it's based on a misconception? Isn't that just validating an error?"
  **Reply:** "History is full of productive errors. The painter's reaction was real, even if the premise was false. The 'display-value' comes from the causal chain, not the truth of the premise. The placebo effect is still a physiological effect. We are documenting the reality of the reception, not validating the attribution."
  **Soft Spot:** **This is your acknowledged weak point.** If they press that "truth matters more than effect" in a museum context, you have little ground other than "historical honesty." Be prepared to concede that this is a rare case where the effect is exceptionally well-documented.

  ### 7. Registrar (Policy & Standards)
  **Objection:** "AAM guidelines and our own deaccessioning policy suggest objects losing attribution should be removed from the permanent display to maintain catalog integrity. How do we catalog this without violating accreditation standards?"
  **Reply:** "We update the catalog entry to reflect the new attribution and the new rationale for display. The object remains accessioned, but its status changes from 'Work of Art' to 'Historical Artifact of Reception.' We document the reattribution and the decision to retain in the permanent record. This is compliant as long as the public record is accurate."
  **Soft Spot:** If the policy explicitly says "deaccession if inauthentic," you need a policy waiver. Check the bylaws before the meeting.

  ### 8. Conservator (Practicality)
  **Objection:** "If this is a twentieth-century imitation, does it merit the same conservation resources as the seventeenth-century works? Are we prioritizing storage space for a fake over a genuine work that needs care?"
  **Reply:** "The conservation need is assessed on material stability, not attribution. If the canvas is stable, it costs no more to hang than to store. We are not diverting resources from genuine works; we are utilizing existing wall space to tell a more complete story."
  **Soft Spot:** Minimal damage. Only an issue if storage is critically overcrowded.

  ## IV. CLOSING ADVICE
  *   **Watch the Curator:** They are the gatekeeper of "quality." If they feel this makes the museum look amateurish, they will kill it. Keep bringing them back to "Scholarly Transparency."
  *   **Watch the Counsel:** They hold the veto. Ensure the label text is pre-approved by them as "non-misleading."
  *   **The "Dangerous Question" Strategy:** Do not volunteer this. If asked, pause. It is the only question where you are philosophically vulnerable. Use the "Significance vs. Authenticity" distinction (Section II) verbatim.
  *   **Tone:** Do not sound like you are defending a fake. Sound like you are defending *history*. The object is no longer a painting; it is a document.
