      *   *Formatting:* Numbered claims, Table, Cruxes.

  8.  **Self-Correction during drafting:**
      *   *Critique:* The "Added-Value" crux is tricky. If it's just verbal, I need to flag it.
      *   *Fix:* I will explicitly note in the Added-Value crux that part of the disagreement is definitional (what counts as an "explanation"), but isolate the empirical residue (predictive power).
      *   *Critique:* Make sure the "Ant Mill" isn't just dismissed.
      *   *Fix:* Ensure the Skeptic calls it a "pathological attractor" and Cognitivist calls it a "systemic hallucination" or "error."
      *   *Critique:* Ensure the "Boundary" crux addresses the pheromone field.
      *   *Fix:* Explicitly mention the stigmergic substrate in the boundary definition.

  9.  **Final Polish:** Check against the prompt's specific examples (e.g., "worker laying, policing"). Ensure these concepts are integrated into the Agreed Claims or Disagreements. (I'll put the conflict/agenda point in Agreed Claims as requested).

  10. **Final Output Generation** (Proceeding to generate the text based on these thoughts).

  *(Self-Correction on Falsification)*: The prompt asks for "one thing each side would count as evidence against their own view." I need to make sure these are genuine concessions, not "If the sun explodes."
  *   Cognitivist: If we find that removing specific "hub" ants doesn't change colony performance, but removing random ants does (violating the neural analogy).
  *   Skeptic: If we find an ant that *does* possess a global map and directs others explicitly (violating the local-rule analogy).

  *(Self-Correction on Crux 3 Decision)*: Need a concrete observation.
  *   Observation: Disrupting the quorum *after* it is reached but *before* movement starts.
  *   Cognitivist: Colony "changes mind" or shows conflict (hesitation).
  *   Skeptic: System resets or continues based on momentum, no "mind change."

  *(Self-Correction on Verbal Disputes)*: I need to make sure I don't hide substantive disagreements behind "it's just words." The prompt says "where a piece of the dispute is only about words, flag it." I will add a specific note in the Disagreements table or Cruxes where definitions are doing the heavy lifting.

