      *   **Tone:** Professional, precise, non-strawmanning, agreed upon by both parties. No external citations.
      *   **Components:**
          1.  Numbered Agreed Claims (must have "bite," not trivial).
          2.  Disagreements Table (Neutral description + Cognitivist formulation + Skeptic formulation).
          3.  Cruxes (Specific sub-questions where settling one moves the needle). Must include: Boundary, Malfunction, Decision, Added-Value. Optional: Persistence (Queen death/Fission).
          4.  Falsification Conditions (One thing each side counts as evidence against their view).
      *   **Constraints:** Do not declare a winner. Flag verbal disputes. Ensure both sides could sign it.

  2.  **Deconstruct the Parties:**
