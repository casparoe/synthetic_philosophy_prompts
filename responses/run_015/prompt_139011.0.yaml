  4.  **Drafting - Section 2: Disagreements Table:**
      *   *Goal:* Show the conflict without bias.
      *   *Row 1: Ontology.* Is the colony a real agent or a useful description?
      *   *Row 2: Phenomenology.* Is there "something it is like" to be the colony?
      *   *Row 3: Reduction.* Can colony behavior be fully explained by individual rules without loss?
      *   *Row 4: Teleology.* Does the colony have goals *sui generis* or just aggregated individual goals?
      *   *Constraint:* Check for "verbal disputes." If it's just about the word "mind," flag it. The prompt asks to flag verbal disputes *where a piece of the dispute is only about words*. I need to be careful not to dismiss the whole thing as verbal, but identify specific friction points.

  5.  **Drafting - Section 3: Cruxes:**
      *   *Goal:* Testable or conceptual pivot points.
      *   *Crux 1: Boundary.* (Prompt requirement). Workers vs. Workers+Queen vs. +Environment (Stigmergy).
          *   *Cognitivist:* Needs environment to complete the circuit.
          *   *Skeptic:* Environment is just context, not part of the agent.
      *   *Crux 2: Malfunction.* (Prompt requirement). The Ant Mill.
          *   *Cognitivist:* Cognitive error/glitch in the system.
          *   *Skeptic:* Mechanical breakdown of simple rules, no "error" because no "intent."
      *   *Crux 3: Decision.* (Prompt requirement). Nest site selection (Quorum).
          *   *Cognitivist:* Irreversible commitment = Decision.
          *   *Skeptic:* Phase transition in a dynamical system.
          *   *Discriminator:* What happens if the quorum is reached but conditions change instantly?
      *   *Crux 4: Added-Value.* (Prompt requirement). Prediction vs. Redescription.
          *   *Cognitivist:* Intentional stance predicts novel behavior better than mechanical stance.
          *   *Skeptic:* Mechanical stance is sufficient; intentional adds nothing but comfort.
      *   *Crux 5: Persistence/Memory.* (Prompt suggestion). Queen death/Fission/Structure.
          *   *Cognitivist:* Memory survives substrate turnover (like human memory despite cell death).
          *   *Skeptic:* It's just structural inertia, not memory.
      *   *Predictions:* Need specific outcomes for each.

  6.  **Drafting - Section 4: Falsification Conditions:**
