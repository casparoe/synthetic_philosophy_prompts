      *   *Skeptic:* If the colony solves a problem no individual could solve *even in principle* via local rules (true emergence of computation). Or if we find a central integrator. Let's go with: If we find a specific "command" structure that overrides local rules in a way that implies a central representation.

  7.  **Review and Refine:**
      *   *Check Tone:* Is it dry and collaborative? Yes.
      *   *Check Constraints:* Did I cite papers? No. Did I declare a winner? No.
      *   *Check "Bite":* Are the agreed claims trivial? No, they highlight the weirdness of the system.
