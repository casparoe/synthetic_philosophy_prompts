      *   *Origin:* Stoet & Geary (2018) is the seminal paper often cited. They used PISA data and the Global Gender Gap Index (GGGI).
      *   *Critiques:* Richardson et al. (2020) challenged the statistical methods and the index used (GGGI vs. GDI vs. EMPI). They argued the paradox disappears with different indices or controls for GDP.
      *   *Mechanism:* The "intrinsic vs. extrinsic" argument is central. In poorer/less equal countries, STEM is a path to financial security (extrinsic). In rich/equal countries, people can afford to follow passions (intrinsic), where average sex differences in interests (people vs. things) might manifest more.
      *   *Selection Effect:* In countries with low female labor participation, the women who *do* work are often elites or highly motivated, potentially skewing towards high-status fields like medicine/engineering, whereas in high-participation countries, the full distribution of women enters the workforce, including those less interested in STEM.
      *   *Current Consensus:* There is no hard consensus. The correlation is robust in some specifications but fragile in others. The interpretation is heavily contested.

  3.  **Evaluate the User's Hypothesis (Counterfactuals/Baselines):**

