  (a) The plain case: This is the canonical counterexample where relational symmetry in void space leaves no property to ground numerical distinctness under the strong Principle.

  (c) The triangle: While the apex sphere is discernible from the base pair, the two base spheres remain perfectly symmetric with respect to each other and the apex, reproducing the problem of the plain case.

  (d) The odd one out: This setup fails to be a case of indiscernibles because the lack of symmetry guarantees the two similar spheres bear different distances to the third, rendering them relationally distinct.

  Regarding your lab instinct: it is helping itself to the answer rather than doing independent work. Your intuition treats numerical distinctness as a primitive fact (haecceity) or relies on potential distinguishability via symmetry-breaking, both of which beg the question against a Principle that defines identity strictly by *actual* intrinsic and relational properties. In NMR, you count nuclei as distinct individuals because your physical framework assumes haecceity; using that assumption to refute PII is circular, as PII is precisely the claim that such primitive thisness does not exist.
