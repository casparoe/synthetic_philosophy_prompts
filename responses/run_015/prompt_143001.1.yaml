answer: |-
  ### Part I: Translation into Organizational Role Theory Vocabulary

  **The Constitutive Role-Set Model of Identity**

  In this framework, the moral agent is not an atomistic entity possessing inherent properties or universal duties. Instead, the agent is ontologically constituted by their **role set**. There is no "self" prior to or distinct from the network of **role expectations** generated by specific **role senders** (e.g., parents, superiors, peers, subordinates). Identity is the aggregate of successful **role enactments** within the five primary relational clusters.

  **Rectification of Names (*Zhengming*)** is operationalized as the rigorous alignment of **role expectations** with **role enactment**. When a title (Name) does not match the performance (Reality), **role ambiguity** occurs. This ambiguity is not merely a cognitive confusion but a structural failure that destabilizes the organization. To "rectify" is to reduce this ambiguity until the **role sender's** expectations and the agent's **enactment** are isomorphic.

  **Ritual (*Li*)** is translated as institutionalized **role scripts**. These are not arbitrary customs but high-fidelity standard operating procedures that encode historical organizational wisdom. Adherence to these scripts reduces transaction costs and minimizes **intra-role conflict** (conflicting demands within a single position) and **inter-role conflict** (conflicting demands between different positions, e.g., father vs. official).

  **Moral Cultivation** is redefined as the transition from passive **role-taking** (accepting external definitions without critique) to active **role-making** (negotiating and refining expectations to ensure systemic coherence). The exemplary agent (*Junzi*) is one who achieves high-fidelity **role enactment** not through coercion, but by internalizing the **role expectations** so thoroughly that the distinction between the person and the position dissolves.

  **Social Harmony** is understood as **systemic equilibrium**. When all agents within the **role set** minimize **role ambiguity** and resolve **role conflict** through proper **enactment**, the organization achieves maximum cohesion and stability. There is no external metric for success; success is the internal consistency of the **role network**.

  ***

  ### Part II: Residue Report

  **1. Elements Surviving Intact**
  *   **The Relational Self:** The anti-individualist ontology translates well. Organizational role theory already posits that behavior is largely determined by structural position rather than internal psychology. The idea that "you are what you do in relation to others" fits the definition of identity as an aggregate of **role enactments**.
  *   **Contextual Normativity:** The Confucian insistence that duty depends on the specific relationship (father/son vs. ruler/minister) maps cleanly onto the concept of **role sets** where expectations vary by **role sender**.
  *   **Dynamic Negotiation:** The Confucian idea that relationships require work mirrors the distinction between **role-taking** and **role-making**. Both frameworks acknowledge that roles are not static scripts but require active maintenance to prevent **role ambiguity**.

  **2. Elements Stretched or Distorted**
  *   **The Source of Obligation:** In organizational role theory, **role expectations** are typically descriptive or functional (what is needed for the job). In Confucianism, they are thickly normative (what makes you *human*). Translating *Yi* (Righteousness) as "role fidelity" stretches the term; org theory views failing a role as inefficiency or grounds for dismissal, whereas Confucianism views it as a moral failing of the self.
  *   **Conflict Resolution:** Organizational theory often views **inter-role conflict** (e.g., work-life balance) as a stressor to be managed or reduced for the sake of the individual's well-being. Confucianism often views the resolution of such conflict as requiring the subordination of the private self to the public role. The translation obscures the sacrificial nature of Confucian role ethics; org theory aims to accommodate the role to the person, Confucianism accommodates the person to the role.
  *   **Role Scripts (*Li*):** Reducing Ritual to "standard operating procedures" strips it of its expressive and aesthetic function. In org theory, scripts are tools for efficiency. In Confucianism, they are the medium through which emotion is cultivated and refined. The translation captures the *structure* of ritual but loses its *pedagogical* function.

  **3. Elements with No Expression (The Untranslatable Residue)**
  *   **Cosmic Resonance:** The claim that proper **role enactment** aligns the agent with *Tian* (Heaven) or the cosmic order has no equivalent. The closest org theory comes is "systemic equilibrium," but this is a mechanical stability, not a metaphysical alignment. The idea that a father acting like a father affects the weather or the spiritual state of the universe is invisible to organizational sociology.
  *   **The Sacredness of the Role:** In Confucianism, roles are sacred vessels of tradition. In org theory, roles are functional units. There is no vocabulary in role theory to express why a role *deserves* reverence beyond its utility to the organization's goals.
  *   **Self-Cultivation as an End:** Organizational role theory is instrumental; roles exist to achieve organizational goals. Confucian role ethics is constitutive; roles exist to cultivate the human. The translation forces Confucianism to look like a management strategy, losing the soteriological dimension (salvation/self-perfection).

  ***

  ### Part III: Assessment of the Normative Gap

  The untranslatable residue reveals a **genuine normative gap in organizational role theory**, rather than merely exposing metaphysical baggage in Confucianism.

  Organizational role theory is fundamentally descriptive and instrumental. It explains how roles function, how conflict arises, and how to reduce stress to improve performance. It lacks a vocabulary for *why* role fulfillment matters beyond efficiency or career success. When a manager fulfills their **role expectations** perfectly but acts cruelly, org theory might flag this as a leadership style issue or a culture problem, but it struggles to categorize it as a fundamental failure of *being*.

  Confucianism provides the normative weight that org theory lacks: the claim that **role-making** is the primary site of ethical becoming. The "cosmic" language of *Tian* can be discarded as metaphysical baggage, but what it points to—the idea that social roles are the locus of ultimate meaning and moral truth—cannot be fully captured by "systemic equilibrium."

  If we discard the Confucian metaphysics, we are left with a robust claim: **Human flourishing is impossible outside of successful role integration.** Organizational role theory can describe the *mechanics* of integration, but it cannot endorse the *ethics* of it. It treats the self as something that *has* roles to protect its psychological boundaries. Confucianism treats the self as something that *is* roles to achieve moral reality.

  Therefore, the residue is not just "spooky" metaphysics; it is the **moral gravity** of social positions. A secular organizational theory that wishes to account for the depth of human commitment to roles (why people die for their duties, why betrayal feels like ontological destruction) must either import normative ethics from outside (like Confucianism) or admit that it can only describe the shell of organizational life, not its moral core. The gap is not that org theory lacks a cosmos; it is that it lacks a *telos* for the self beyond functionality.
