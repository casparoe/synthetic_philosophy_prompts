  ### The Actual Answer

  You have identified a genuine tension, but your conclusion that EDT is stable is incorrect due to the **ratifiability constraint**. Here is the resolution to your specific questions.

  #### 1. What is the instability supposed to consist in?
  The instability is not merely that EDT gets a bad outcome (though it does). The instability is **deliberational**.
  *   If you think you will Stay, you expect Death in Damascus. Given Death is in Damascus, Fleeing yields 9 and Staying yields 0. So you should Flee.
  *   If you think you will Flee, you expect Death in Aleppo. Given Death is in Aleppo, Staying yields 10 and Fleeing yields 0. So you should Stay.
  *   There is no pure action $A$ such that, conditional on doing $A$, $A$ maximizes expected utility.
  *   Your calculation ($1 > 0.9$) fails because it uses the "90% reliability" statistic *before* you have updated on the evidence of your own decision. Once you decide, the reliability statistic implies your decision is predicted, shifting the probability of Death's location to match your decision.

  #### 2. Is this just Newcomb's Problem with signs flipped?
  It is structurally identical to Newcomb's Problem, but the payoff structure creates a **zero-sum-like conflict** rather than a dominance situation.
  *   In Newcomb's, EDT says One-Box (cooperate with predictor), CDT says Two-Box (defect).
  *   In Death in Damascus, both EDT and CDT struggle to find a pure strategy.
  *   The "instability" talk is not a red herring; it highlights that classical decision theory (both EDT and CDT) lacks a mechanism to handle **logical correlation between the agent's output and the environment's state** without invoking mixed strategies or causal graph modifications (like the "Tickle Defense").

  #### 3. The Mixed Strategy Solution (Your Flatmate is Right)
  Your flatmate's suggestion is the standard technical solution (proposed by Gibbard & Harper, 1978).
  *   **The Objection:** You said, "Death can predict how the coin lands."
  *   **The Fix:** You must use a randomization device that Death *cannot* predict. In the context of the thought experiment, we assume the agent can generate a probability distribution over actions that is logically independent of the prediction (perhaps via quantum randomness).
  *   **The Equilibrium:** You choose $S$ with probability $p$ and $F$ with probability $1-p$. Death predicts $S$ with probability $p$.
      *   $EU(S) = P(\text{Death in Ale}) \times 10 = (1-p) \times 10$
      *   $EU(F) = P(\text{Death in Dam}) \times 9 = p \times 9$
      *   To be stable (indifferent), set $EU(S) = EU(F)$:
          $$10(1-p) = 9p \implies 10 = 19p \implies p = 10/19$$
  *   **The Result:** You stay in Damascus with probability $\approx 52.6\%$ and flee with $\approx 47.4\%$. Death matches these probabilities. Your expected survival is $\approx 4.74$ utility. This is the only **ratifiable** solution.

  #### 4. Explicit CDT Probabilities (Addressing your "Smuggling" worry)
  You asked to be explicit about which probabilities go into the CDT calculation.
  CDT calculates: $EU(A) = P(D) \cdot U(A, D) + P(A) \cdot U(A, A)$.
  *   **The Error:** You cannot set $P(D) = 0.9$ arbitrarily.
  *   **The Constraint:** $P(D)$ must equal the probability Death predicted Damascus.
  *   **The Loop:** Death predicts Damascus iff he predicts you will Stay.
  *   **CDT Requirement:** CDT requires $P(D)$ to be independent of $A$ *causally*. It is. But $P(D)$ is dependent on your *decision algorithm*.
  *   **Correct CDT Input:** You must input the equilibrium probability $P(D) = 10/19$.
      *   If you input $P(D) = 10/19$:
          *   $EU(S) = (9/19) \times 10 = 90/19 \approx 4.74$
          *   $EU(F) = (10/19) \times 9 = 90/19 \approx 4.74$
      *   CDT is indifferent. It permits the mixed strategy $p=10/19$.
      *   If you try to input any *pure* probability (0 or 1), CDT oscillates, as shown in the arithmetic section.

  ### Summary
  You haven't found a hole in the standard story; you've found the exact spot where the standard story requires **ratifiability** and **mixed strategies** to avoid contradiction. Your arithmetic was correct for a *single pass* using fixed priors, but decision theory in this context requires the priors to be consistent with the decision output. EDT is unstable in pure strategies for the same reason CDT is: the predictor forces the probability of the state to track the probability of the action. The only stable solution is to make yourself unpredictable (mixed strategy).
