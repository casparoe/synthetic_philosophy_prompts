  - **Why it looked okay:** It looks plausible because it leverages the multiple realizability thesis, suggesting that high-level computational structure is all that matters for mechanism identity. We naturally assume that if the logic is preserved, the "mechanism" is preserved for detection purposes, treating the substrate as a transparent implementation detail.

  - **The price of rejection:** Rejecting this forces you to admit that the "relevant level" is not fixed by abstract computation but is determined by the detector's sensitivity to physical statistics encoded in the training data. You lose the clean hardware-software separation, acknowledging that mechanistic anomaly detection is partially substrate-dependent because the training distribution captures physical regularities, not just logical ones. This means a detector trained on biological data *should* flag silicon substitutes, not because the logic is wrong, but because the physical causal signature has drifted out of distribution.

      In the mechanistic explanation literature (e.g., Craver, Bechtel), the standard position is that entities and activities are constitutive of mechanisms, not just their organization. By rejecting (4), you align with this view: substituting entities changes the mechanism's lower-level causal powers, breaking isomorphism at the physical level even if high-level logic holds. This saves hardware-fault detection by grounding "mechanism" in physical causal powers rather than abstract graphs, but it costs you the claim that substrate is ever truly irrelevant to mechanistic identity.

  - **Bottom line:** Reject (4) to preserve (2). Perfect causal isomorphism is physically impossible across substrates, so detectors can flag the drift in low-level statistical signatures. This aligns with mechanistic realism: entities matter, not just organization.
