      *   But if fear is a response to perceived threat to *concerns*, and his concern is *doing the job*, then the bomb is a tool/obstacle, not a threat.
      *   This is a standard move in philosophy of emotion (Roberts, Nussbaum). I will use it.

      *   *Plan:*
          1.  State that a single account can recover all five.
          2.  Define the **Concern-Based Construal Account**.
          3.  Map the 5 verdicts to the theory.
          4.  Apply to the 2 new cases.
          5.  Conclude.
answer: |-
  There is a single account that recovers all five verdicts without requiring you to abandon any of them. The inconsistency you feel arises from assuming that emotions must be defined by a single necessary component (like judgment, bodily feeling, or object existence). Instead, emotions are best understood as **Concern-Based Construals**.

  ### The Account: Concern-Based Construal

  An emotion is a **construal of a situation as bearing on a subject's concerns**, which disposes the subject to specific patterns of attention, action, and phenomenology.

  This definition has four precise components that resolve your conflicts:

  1.  **Construal (not Belief):** Emotions are ways of "seeing" a situation, analogous to perception. Like an optical illusion, a construal can persist even when you believe it is false. This separates emotion from judgment.
  2.  **Concerns (not just Danger):** Emotions arise relative to what the subject cares about (safety, justice, duty, loved ones). A situation is only threatening if it threatens a *concern*.
  3.  **Intentionality (Object-Directedness):** Emotions are *about* something (an object, person, or state of affairs). This distinguishes them from moods. The object need not exist in reality, only in the construal.
  4.  **Functionalism (not just Feeling):** Emotions are defined by their role (dispositions to act/attend), not solely by somatic feedback. Bodily feelings are typical outputs, not essential definitions.

  ### Recovering the Five Verdicts

  Here is how this account validates all five of your intuitions:

  *   **(1) The Phobic (Fear without Belief):** Miriam *believes* the spider is harmless, but she *construes* it as a threat. Because construal operates like perception, it can conflict with belief. Her concern (safety) is triggered by the construal, not the belief. **Verdict Upheld.**
  *   **(2) The Bomb Tech (Belief without Fear):** The technician believes the bomb is lethal, but his dominant *concern* in that moment is duty/competence, not safety. He construes the bomb not as a "threat to me" but as a "task to solve." Since fear requires construing a situation as threatening a *current concern*, and his concern structure prioritizes the task, he does not feel fear (or feels it as a background noise overridden by professional focus). **Verdict Upheld.**
  *   **(3) Fictional Grief (Grief without Existence):** You construe the characters' loss as a violation of your concern for justice or empathy. The intentional object of grief is the *loss as presented*, not the actual existence of the person. Emotions require an intentional object, not a real one. **Verdict Upheld.**
  *   **(4) The Interoceptive Agnosic (Fear without Feeling):** Your friend construes public speaking as a threat to her social standing (concern). This disposes her to avoidance and distress ("wretchedness"). The lack of felt bodily arousal is a deficit in feedback, not a deficit in the emotional state itself, which is defined by the construal and disposition. **Verdict Upheld.**
  *   **(5) Free-Floating Irritability (Anger-like without Object):** You judged this was *not* an emotion. The Concern-Based Construal account agrees. Because this state lacked a specific intentional object (you were annoyed at "nothing in particular"), it was a **mood**, not an emotion. Moods are background states that lack the specific aboutness of emotions. Your verdict that "I don't think I was having an emotion" is theoretically correct. **Verdict Upheld.**

  ### Application to New Cases

  This account yields precise verdicts on the cases you requested:

  **1. Fear of One's Own Death**
  *   **Verdict:** This is a genuine emotion, but its rationality depends on the construal.
  *   **Analysis:** The object is "my future non-existence." The concern is the continuation of one's projects, relationships, or consciousness.
  *   **Nuance:** If one construes death merely as a biological cessation that does not thwart current concerns (e.g., a belief that one's projects will continue through others, or a lack of concern for the future self), fear may not arise. If one construes death as the absolute termination of all concerns, fear is the appropriate construal. Like the phobic spider, one can believe "death is natural" yet construe it as a terrifying threat. The account allows for both rational fear (based on genuine concern for termination) and irrational fear (based on a construal that conflicts with one's deeper beliefs about the afterlife or insignificance).

  **2. Anger Toward a Long-Dead Wrongdoer**
  *   **Verdict:** This is a genuine emotion.
  *   **Analysis:** The intentional object of the anger is not the *currently living person* (who does not exist), but the **person-as-remembered** or the **past act itself**.
  *   **Nuance:** Your concern is likely justice or self-respect. You construe the *past act* as a violation that remains unresolved. The death of the wrongdoer prevents retribution (a typical action tendency of anger), but it does not remove the object of the construal (the memory of the violation). Therefore, the anger is not misplaced; it is directed at a historical object that is still accessible to your mind. The account explains why the anger feels "stuck": the action tendency (to confront/punish) cannot be fulfilled, but the construal of violation persists.

  ### Conclusion

  You do not need to discard any of your verdicts. The apparent conflict dissolves once you stop looking for a single physical or cognitive "ingredient" (like a racing heart or a belief) and instead view emotions as **functional ways of seeing the world in light of what matters to you**. This preserves the reality of phobias, the possibility of courage, the genuineness of fictional tears, the validity of clinical cases, and the distinction between moods and emotions.
