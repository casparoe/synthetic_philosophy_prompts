  1. You previously called selection metaphysical because "fittest" meant "those who survive." Now you call it scientific. Did the biology change, or did you lower your demarcation bar to let it in?
  [He will claim the formulation changed to allow independent measurement, not the bar.]
  (If the bar didn't move, why did it take decades to see that independent measurement was possible?)

  2. If the biology didn't change, then you originally misread the theory. Did the error lie in how biologists formulated selection, or in how you applied your criterion?
  [He will say biologists were initially sloppy with language regarding survival.]
  (So your criterion depends on the linguistic precision of practitioners rather than the logical structure of the theory?)

  3. You demand risky predictions like the physicist who predicted light bending. What is the specific analogue for natural selection that risks falsification rather than just accommodating past data?
  [He will point to ecological models predicting failure to survive under specific constraints.]
  (But if the organism fails, don't you just blame the environment rather than the selection principle itself?)

  4. Some propose defining fitness as a probabilistic disposition rather than actual survival. Does this rescue testability, or does it just hide the circularity inside the propensity claim?
  [He will accept propensity but insist it must be tied to independent physical traits.]
  (If those traits don't produce the expected survival, do you reject the propensity measure or the theory of selection?)

  5. Selection claims are wrapped in ecological and demographic assumptions. When a prediction fails, how do you know selection is false and not your model of the population?
  [He will say we test the whole system and modify auxiliary hypotheses until they become ad hoc.]
  (But isn't that exactly how you described metaphysical programmes protecting themselves from refutation?)

  6. You deny laws of historical development and say we cannot predict the future growth of knowledge. Yet you now treat evolution as a predictive empirical theory about history. Is evolution a historical science or a nomological one?
  [He will distinguish between universal laws of selection and the singular historical events they govern.]
  (If the laws are universal, why do you insist the historical outcome remains fundamentally unpredictable?)

  7. You describe knowledge growth as a selection process from simple organisms to the highest human knowledge. If knowledge grows by selection, does that undercut your argument that we can never predict our future knowledge?
  [He will say the mechanism is selectionist but the content of new conjectures is unpredictable.]
  (Then are you using selection univocally in biology and epistemology, or is it just a loose analogy?)

  8. You now emphasize the organism as an active seeker of problems inventing solutions, not a passive sieve. Does this smuggle in a teleology your anti-essentialism forbids?
  [He will deny teleology, framing it as active adaptation through trial and error.]
  (If activity is inherent to the organism, is variation still random with respect to need?)

  9. If the organism invents the solution, what explanatory work is left for natural selection to do?
  [He will say selection filters the active variations produced by the organism.]
  (If the variations are directed by the organism's activity, is the filtering still the primary explanation?)

  10. Did you revise your verdict based on new evidence about the living world, or purely by philosophical reflection?
  [He will claim it was a logical clarification of the theory's structure, not new empirical data.]
  (If your criterion changes via philosophical reflection rather than observation, is it really about the logical relation between theory and observation?)

  11. Finally, if natural selection is truly testable now, what specific observation would count against it?
  [He will give a vague answer about impossible adaptations or physiological constraints.]
  (Can you specify a physical trait that selection could not possibly produce, rather than just a scenario?)
