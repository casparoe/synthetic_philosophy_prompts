answer: |-
  ### 1. Translation

  Okay, let's map the Procreation Asymmetry onto a payoff matrix. You've got two strategies: Reproduce (R) and Don't (N). In standard life-history theory, you compare the reproductive value of the offspring ($V_{off}$) against the cost to the parent ($C_{parent}$), weighted by relatedness. The philosophical claim is that if the offspring's expected welfare is negative ("suffering"), R is forbidden. If welfare is positive ("happy"), R is permissible but not required. Translating "welfare" is the first bottleneck. If suffering implies reduced viability or fecundity, it's a direct fitness cost. If it's just subjective experience without fitness consequences, it's untranslatable noise in a selection model.

  The Non-Identity Problem asks if you harm someone by creating them. In selection terms, "harm" means reducing fitness relative to a counterfactual. The counterfactual here is non-existence, where fitness $w = 0$. If existence yields $w > 0$, then $\Delta w$ is positive. You can't have a negative selection gradient relative to zero. So, strictly speaking, creating a life with $w > 0$ is always a fitness gain, never a harm. There's no baseline state of "unborn" that holds fitness values; it's just the absence of a strategy.

  The asymmetry regarding weight—suffering matters more than happiness—looks like a skewed payoff matrix. It suggests negative payoffs incur a higher penalty than positive payoffs confer a benefit. In ESS modelling, this would look like a risk-averse strategy where avoiding zero fitness (extinction) outweighs maximizing $r$. But the philosophical version applies this to the *decision to enter the game*, not just variance avoidance. Moral reasons to reproduce map to selection gradients ($\partial w / \partial z$). If the gradient is positive, selection pushes for reproduction. The asymmetry argues that even with a positive gradient (happy kid), the push is optional, whereas a negative gradient (suffering kid) is prohibitive. This contradicts the standard assumption that any positive $r$ drives allele frequency up. Inclusive fitness costs matter here: if a suffering kid drains parent resources, that's a cost. If a happy kid helps siblings, that's a benefit. The philosophical view often isolates the kid's state, ignoring the parent's fitness ledger.

  ### 2. Residue Report

  Here's what gets lost or distorted in the translation. First, "suffering" and "happiness" are largely untranslatable if they don't correlate with survival or reproduction. A sterile human might have high welfare but zero fitness; a wild animal might suffer intensely but leave many offspring. Evolutionary dynamics track gene propagation, not subjective experience. If philosophy is tracking qualia, evolutionary biology literally cannot see it.

  Second, treating potential offspring as payoff recipients is a category error. In game theory, payoffs accrue to players. Non-existent entities aren't players. Assigning them a utility function is like assigning payoffs to an empty niche. You can model the *parent's* payoff from having a kid, but you can't model the *kid's* payoff from existing unless they already exist to collect it. This distorts the framing by reifying non-existence into a state comparable to existence.

  Third, the asymmetry itself doesn't fit selection dynamics. Selection is greedy; it doesn't distinguish between "avoiding bad fitness" and "pursuing good fitness." If a mutation increases $r$, it spreads. There's no moral optionality where positive fitness gains are neutral. This suggests the philosophical argument isn't failing to map to biology; it's optimizing a different function entirely. The residue implies the original argument relies on a welfare metric orthogonal to gene propagation. If you force the mapping, you have to treat "moral neutrality" as "neutral drift," but skipping a high-fitness opportunity isn't neutral drift—it's selection against that lineage.

  ### 3. Verdict

  Does evolutionary biology miss something real? I'd say no. It misses nothing about selection dynamics, but it ignores welfare because welfare isn't the currency of selection. The asymmetry is likely a conceptual artifact from treating non-existence as a baseline state with moral weight, whereas in selection, non-existence is just the absence of a strategy. You can't be worse off than dead in fitness terms unless existence implies negative inclusive fitness (like altruistic suicide), but even then, that's a cost to the parent's lineage, not the offspring's "harm."

  The only real analog in evolutionary dynamics is risk-aversion or bet-hedging, where avoiding catastrophic loss (zero fitness) is prioritized over maximizing mean fitness. But that's about variance in payoff, not the moral weight of creating a player. So, the asymmetry is mostly conceptual confusion derived from importing welfare ethics into population dynamics. Philosophy is tracking subjective experience; biology is tracking lineage persistence. They are different optimization functions running on different hardware. The friction you feel isn't a gap in the science; it's a mismatch in the objective functions.
