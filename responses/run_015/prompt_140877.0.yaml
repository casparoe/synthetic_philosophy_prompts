answer: |-
  You have run headfirst into one of the most subtle and important distinctions in forecasting theory. You are correct that this sits right next to the reading group's topic without being identical to it. The reading group discussed **Propriety** (how to prevent gaming), but you have discovered **Metric Relativity** (how the definition of "best" changes based on the metric).

  There is no single magic word that covers everything you described, but the established terminology clusters around three concepts: **Propriety**, **Elicitability**, and **Locality**.

  Here is the breakdown of the names, the distinction between your two observations, and the answer to your philosophical question.

  ### 1. The Reading Group's Concept: Propriety
  The view you discussed in your reading group is formally known as the theory of **Proper Scoring Rules**.
  *   **Definition:** A scoring rule is "proper" if a forecaster minimizes their expected penalty (or maximizes their expected score) by reporting their true probability distribution. It is "strictly proper" if reporting the truth is the *only* way to maximize the score.
  *   **Why your hack failed:** You proposed a linear score (credit proportional to mass in adjacent buckets). In optimization, if you maximize a linear function subject to a constraint (probabilities must sum to 1), the solution is always at a "corner." You put 100% of your mass on the single bucket that gives the highest expected return. This makes the rule **improper**. To be proper, a scoring rule must be curved (mathematically, strictly convex or concave), which penalizes over-confidence when you are wrong.

  ### 2. The Name for Your Discovery: Metric Relativity of Accuracy
  You asked for a name for the dependence you found: *how accurate a forecast counts as depends on the choice of scoring rule.*
  In the statistics and forecasting literature, this is not given one single label, but it is described as the **Non-Uniqueness of Proper Scoring Rules** combined with **Elicitability**.

  However, the most precise coined term for the philosophical phenomenon you identified is **Metric Relativity of Accuracy**.
  *   **Definition:** The judgment of which forecast is "more accurate" is not absolute; it is relative to the chosen loss function (scoring rule). There is no "God's eye" accuracy metric that ranks all models identically.

  ### 3. One Phenomenon or Two?
  You asked whether the "mental state" shift (mean vs. median) and the "model ranking" shift (Model A vs. B) are the same thing. They are **two distinct technical phenomena**, though they both stem from Metric Relativity.

  **Phenomenon A: Elicitability (The Mental State Shift)**
  *   **What you saw:** Changing from 0-1 loss to Absolute Distance to Squared Distance changes the optimal report from Mode to Median to Mean.
  *   **The Name:** This is about **Elicitation**. A statistical functional (like the mean) is "elicitable" if there exists a scoring rule for which reporting that functional is optimal.
  *   **Why it happens:** This depends on the **shape** of the penalty function. Squared error penalizes large mistakes disproportionately, pulling your report toward the Mean. Absolute error penalizes distance linearly, pulling your report toward the Median.
  *   **Boundary Case:** If you care about being *exactly* right (0-1 loss), you report the Mode. If you care about *average* error, you report the Mean. This is not a bug; it is a feature. It forces you to decide what kind of mistake is worse.

  **Phenomenon B: Locality (The Model Ranking Shift)**
  *   **What you saw:** Model A (spiked on truth, garbage elsewhere) vs. Model B (slightly less on truth, reasonable elsewhere). Log-loss preferred A; Shape-based metrics preferred B.
  *   **The Name:** This is about **Locality**.
      *   **Local Scoring Rules** (like Logarithmic Score/Log-Loss) only care about the probability assigned to the event that *actually happened*. They ignore where the rest of the mass went. This is why Model A wins; it put the most mass on the truth.
      *   **Non-Local Scoring Rules** (like Brier Score or CRPS) care about the probability assigned to events that *did not happen*. They penalize you for putting mass on "impossible" distant buckets. This is why Model B wins; it was less wrong about the rest of the distribution.
  *   **Boundary Case:** If you believe a forecast is only about predicting the truth, use a Local rule. If you believe a forecast is a description of uncertainty (where being confidently wrong elsewhere is bad), use a Non-Local rule.

  ### 4. The Statistician's Fix: CRPS
  The statistician you spoke to described the **Continuous Ranked Probability Score (CRPS)** (or its discrete equivalent, the Integrated Brier Score).
  *   **Why it works:** You feared "double counting." It feels like counting the same miss twice to score "at least 1 day," "at least 2 days," etc. However, mathematically, summing the scores of all these binary "at-least-k" questions is equivalent to measuring the distance between your **Cumulative Distribution Function (CDF)** and the truth's CDF.
  *   **The Benefit:** The CRPS is **Proper** (honesty is optimal) and **Non-Local** (it gives near-miss credit). It solves your engineering problem without reintroducing gameability. It rewards Model B over Model A because it penalizes the "distant bucket" mass that Model A dumped.

  ### 5. Philosophical Implications: Does this refute the Reading Group?
  You asked whether this is an objection to the claim that "accuracy is the single epistemic good."
  *   **It refutes Metric Monism:** It proves there is no single, privileged measure of accuracy. You cannot say Model B is "more accurate" than Model A *simpliciter*; you can only say it is more accurate *relative to a loss function that values calibration of the whole distribution over peak probability on the truth.*
  *   **It does not necessarily refute Veritism:** The reading group's claim (likely based on **Epistemic Utility Theory**) is that the *goal* is accuracy. Your finding shows that "Accuracy" is not a scalar number waiting to be discovered; it is a **relation** defined by your goals.
  *   **The Verdict:** If the reading group claims there is one *True* scoring rule (often the Logarithmic Score is claimed to be this), your finding is a counter-example. If they claim accuracy is the *goal*, your finding clarifies that the goal must be specified by a **Loss Function**.

  ### Summary for your Work
  *   **The Dependence:** Call it **Metric Relativity of Accuracy**.
  *   **The Mental State Issue:** Call it **Elicitability** (different scores elicit different functionals).
  *   **The Ranking Issue:** Call it **Locality** (Local scores ignore near-misses; Non-Local scores reward them).
  *   **The Solution:** Use **CRPS** (Continuous Ranked Probability Score) if you want near-miss credit without gameability.
  *   **The Philosophical Take:** Accuracy is not a monolith. It is a family of measures. Choosing a metric is not a statistical decision; it is a **business decision** about what kind of error costs the company more.

  You have effectively rediscovered the argument that **scoring rules are decision-theoretic tools, not just epistemic measures.** The "right" metric is the one that aligns with the cost of being wrong in your specific logistics context.
