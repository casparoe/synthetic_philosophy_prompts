      *   *Radical Change:* Kuhnian paradigm shifts, Gestalt switches, conceptual revolutions. Not just moving the slider from 5 to 10, but realizing the slider controls volume when you thought it controlled pitch. Or realizing the device isn't a radio, it's a toaster.
