      3. Convenor's Second-Order Desire (The "Nothing New" problem).
      4. Obj-List's Friendship (The "Empty Life" problem).
      5. Policy's Neg Util (The "Eliminate Life" problem).
      6. Hedonist's "Plus Pleasure" (The "Why Stop?" problem).
