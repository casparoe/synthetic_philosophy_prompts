      *   **Goal:** Refine a moral heuristic (rule) for pest control based on a provided set of test cases (verdicts).
      *   **Constraint:** Do not just confirm the user's tentative principle. *Test* it, *repair* it, identify *inconsistencies*, and predict outcomes for *new cases*. Be explicit about where the rule fails or where the user's intuitions might be biased (e.g., ownership).
      *   **Input Data:** 8 specific scenarios with verdicts.
      *   **Tentative Principle:** "Killing is permitted when it is targeted at the organisms actually causing a real problem, and stops being permitted when it spills onto bystanders or the aim is merely cosmetic."

  2.  **Deconstruct the Input Cases & Verdicts:**
      1.  *Wasp nest (allergic kid):* Destroy at night. **Verdict: Fine.** (High urgency, direct threat, targeted).
      2.  *Ant bait (kitchen, colony kill):* **Verdict: Fine.** (Nuisance/hygiene, targeted, high count but ignored).
      3.  *Ant bait (housemate objects):* **Verdict: Fine.** (Conflict of values, user overrides housemate's "rights of first occupancy").
      4.  *Grub treatment (lawn, cosmetic):* **Verdict: Not Fine.** (High count, low justification, targeted but aim is weak).
      5.  *Aedes larvicide (dengue endemic):* **Verdict: Better than Fine (Fund it).** (Very high count, eradication, high justification/public health).
      6.  *Rose spray (kills neighbor's bees):* **Verdict: Not Fine (Worse than lawn).** (Low count, high collateral damage, trespass/harm to others).
      7.  *Locust control (famine):* **Verdict: Fine/Untroubling.** (Billions killed, extreme justification).
      8.  *Methodology (slow vs. fast vs. sterile):* **Verdict: Slow is worse. Sterile is better but not obligatory.** (Suffering matters, but efficiency/convenience trumps optimal ethics).

  3.  **Evaluate the Tentative Principle:**
      *   *Principle:* Targeted + Real Problem = OK. Bystanders/Cosmetic = Not OK.
      *   *Test against Case 4 (Lawn) vs. Case 5 (Aedes):*
          *   Lawn: Targeted? Yes. Real Problem? No (cosmetic). -> Not Fine. (Matches).
