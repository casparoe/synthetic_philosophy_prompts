      *   *Test against Case 6 (Roses/Bees):*
          *   Targeted? No (broad spectrum). Real Problem? Yes (roses). Bystanders? Yes (bees). -> Not Fine. (Matches).
      *   *Test against Case 8 (Suffering/Sterility):*
          *   The principle says nothing about *method* (suffering) or *permanence* (sterilization). It only addresses *aim* and *target*. This is a gap.
      *   *Test against Case 3 (Housemate):*
          *   Who defines "Real Problem"? User says hygiene. Housemate says coexistence. The rule assumes the actor defines the problem. This hints at an ownership/agency bias.

  4.  **Identify Inconsistencies & "Bugs" in the User's Logic:**
      *   **The Suffering Gap:** The tentative principle ignores *how* they die (Case 8). Needs a "Minimize Suffering" clause.
      *   **The Obligation Gap:** User feels sterile is *better* but not *obligatory* (Case 8). This suggests a "Supererogatory" zone (good to do, not required).
      *   **The Ownership/Agency Bias:** Case 3 (Housemate) and Case 6 (Neighbor's bees) suggest boundary issues. Case 3 is "My house, my rules." Case 6 is "Your property harmed." Case 4 (Lawn) is "My lawn, but cosmetic."
      *   **The Eradication Paradox:** Case 5 (Aedes) involves ending a lineage. Case 4 (Grubs) is seasonal. User is okay with eradication if the *reason* is strong enough. The tentative principle handles this, but it's worth noting that "Real Problem" is doing heavy lifting.

  5.  **Drafting the "Spec" (The Repaired Rule):**
      *   Need to structure this like a function or a policy spec.
      *   *Inputs:* Target, Justification, Collateral, Method.
      *   *Logic:*
          1.  **Justification Weight:** Must exceed a threshold (Threat to Life/Health > Hygiene/Property > Aesthetic).
          2.  **Target Specificity:** Must minimize non-target impact.
          3.  **Method Humanity:** Minimize suffering (constraint, not absolute veto).
          4.  **Jurisdiction/Consent:** Cannot externalize costs to non-consenting others (neighbors, housemates - though user overrides housemate, which is a specific bias to note).

  6.  **Addressing the "Unsaveable" Verdicts:**
      *   *Case 8 (Sterilization):* If sterilization is "better," why isn't it obligatory? A strict utilitarian rule would demand it. The user's intuition is "good enough is good enough." This is a *satisficing* heuristic, not an optimizing one. The rule must reflect "Reasonable Effort" rather than "Maximum Good."
      *   *Case 4 vs 5 (Lawn vs Aedes):* The user says the numbers don't matter. The rule must explicitly deprioritize *count* in favor of *context*.

  7.  **Predicting New Cases:**
      *   *Case A: Expensive Trap (90% bycatch reduction, 20x cost).*
          *   Rule: "Reasonable Effort." 20x cost is likely prohibitive unless the justification is extreme (e.g., endangered species nearby). For standard pest control, the rule predicts **Not Obligatory** (Fine to use cheaper trap), but **Praiseworthy** if used.
      *   *Case B: Gene Drive (Crop pest, no spray).*
          *   Rule: High specificity (Targeted), High Justification (Crop loss/food), Low Collateral (No spray). *Risk:* Unintended ecological consequences (unknown bystanders).
          *   Prediction: **Fine/Preferred**, *conditional* on risk assessment of ecological cascade. If "no spraying" means less collateral than current methods, it passes the "Bystander" test better than sprays.

  8.  **Refining the "Ownership" Critique:**
      *   Case 3 (Housemate) is the smoking gun. The user says "Still fine" despite objection. Case 6 (Neighbor) is "Not fine."
      *   *Distinction:* Housemate = Shared space, user asserts dominance/standard. Neighbor = External party, user respects boundary.
      *   *Critique:* This is indeed "territorial intuition." The rule needs to acknowledge that "Real Problem" is subjective and often defined by the property owner.

  9.  **Structuring the Response:**
      *   **Acknowledge the Spec:** Validate the approach.
      *   **The Patched Spec (v2.0):** Formalize the rule with conditions.
      *   **Stress Test (The Bugs):** Point out where the user's intuitions conflict with a clean logical rule (specifically the Sterilization Obligation and the Housemate Veto).
      *   **The Ownership Bias:** Call out Case 3 vs Case 6.
      *   **Predictions:** Run the two new scenarios through the patched spec.

  10. **Self-Correction/Review during drafting:**
      *   *Check:* Did I answer the specific prompt about "which case motivates each clause"? Yes, need to ensure citations (e.g., [Case 6]).
      *   *Check:* Did I address the "slow-death intuition"? Yes, needs a "Suffering Minimization" clause.
      *   *Check:* Did I address the "sterile not obligatory" paradox? Yes, label it as *satisficing*.
      *   *Tone:* Professional, analytical, slightly technical (matching the user's "software spec" mindset).

  11. **Final Polish:** Ensure the distinction between "Hard Constraints" (Veto) and "Soft Constraints" (Optimization) is clear, as that resolves the sterilization paradox. (Hard: Don't kill neighbor's bees. Soft: Try to reduce suffering if cost is reasonable).

  *(Self-Correction on Case 3)*: Wait, the user says "Still fine" on the housemate objection. This implies the user's rule prioritizes *their* definition of "Real Problem" over the housemate's. I need to be sharp on this. It's not just ownership; it's *veto power*.

  *(Self-Correction on Case 8)*: The user says "I don't feel obliged to switch." This is key. It means the rule is not "Maximize Good" but "Avoid Bad." It's a deontological constraint system, not utilitarian. I should frame the spec as *Constraints* vs. *Preferences*.

  Let's build the response around a "Constraint-Based Architecture."

  *   **Hard Constraints:** No bystanders (Case 6), No cosmetic aims (Case 4).
  *   **Soft Constraints:** Minimize suffering (Case 8), Minimize count (implied).
  *   **Override:** Justification Weight (Case 1, 5, 7).

  Okay, ready to write.
answer: |-
  Here is a spec review and patch for your moral heuristic. I have treated your intuitions as a legacy codebase: mostly functional, but with technical debt in the "suffering" module and a race condition in the "consent" handler.

  ### 1. The Repaired Spec (v2.0)

  Your tentative principle (*Targeted + Real Problem*) is the core logic, but it fails to compile against Case 8 (Suffering/Sterility) and Case 6 (Neighbors). Here is the patched rule, structured as a series of checks.

  **Function `EvaluatePestControl(Scenario)`**

  1.  **Check Justification Weight:**
      *   If `Aim` == `Cosmetic` → **REJECT**. (Motivated by **Case 4**: Lawn grubs).
      *   If `Aim` == `Health/Safety` OR `Economic Survival` → **PROCEED**. (Motivated by **Case 1**: Wasp/Allergy; **Case 7**: Locust/Famine; **Case 5**: Dengue).
      *   If `Aim` == `Hygiene/Comfort` → **PROCEED**, *unless* `Collateral` > `Threshold`. (Motivated by **Case 2**: Ants).

  2.  **Check Target Specificity (The Bystander Constraint):**
      *   If `Action` harms `Non-Target Sentients` (e.g., bees, pets, neighbors' property) → **REJECT**. (Motivated by **Case 6**: Roses/Bees).
      *   *Exception:* If `Justification Weight` is `Existential` (e.g., Famine/Dengue), `Collateral` tolerance increases, but `Non-Target` must still be minimized. (Motivated by **Case 5**: Aedes).

  3.  **Check Method Humanity (The Suffering Constraint):**
      *   If `Method` causes `Prolonged Suffering` when `Instant` is available → **REJECT**. (Motivated by **Case 8**: Slow neurotoxin).
      *   If `Method` allows `Sterilization` instead of `Death` → **FLAG AS PREFERABLE**, BUT **DO NOT REJECT** standard kill if `Cost/Effort` is significantly higher. (Motivated by **Case 8**: Sterilization intuition).

  4.  **Check Jurisdiction (The Consent Constraint):**
      *   If `Action` impacts `Shared Space` → `Consent` required. (Motivated by **Case 3**: Housemate).
      *   *Legacy Bug Note:* Your verdict on Case 3 ("Still fine") overrides this check. See Section 3 below.

  ---

  ### 2. Stress Test: Inconsistencies & Unsaveable Verdicts

  A clean rule cannot perfectly reproduce your verdicts without exposing contradictions. Here are the bugs in your logic.

  **A. The Sterilization Paradox (Case 8)**
  *   **The Conflict:** You rate sterilization as "better" (higher moral score) but feel "not obliged to switch."
  *   **The Diagnosis:** Your rule is **Deontological (Constraint-based)**, not **Utilitarian (Optimization-based)**. You are running a "Do No Harm" script, not a "Maximize Good" script.
  *   **The Fix:** The spec must distinguish between *Hard Constraints* (Veto conditions) and *Soft Constraints* (Optimization goals).
      *   *Hard:* Do not cause prolonged suffering.
      *   *Soft:* Reduce total death count if cost is negligible.
  *   **Unsaveable Verdict:** If you accept that sterilization is morally superior, a strictly consistent utilitarian rule *would* oblige you to switch. Your intuition that you don't *have* to is a "Satisficing" heuristic (good enough is good enough). You must admit that convenience trumps moral optimization in your personal spec.

  **B. The Eradication vs. Lawn Pair (Case 4 vs. Case 5)**
  *   **The Conflict:** Lawn (fewer deaths, cosmetic) = Bad. Aedes (more deaths + eradication, health) = Good.
  *   **The Diagnosis:** Your tentative principle actually handles this well, but you doubted it because of the *numbers*.
  *   **The Fix:** Explicitly declare that `Count` is a secondary variable. `Justification Weight` is the primary sort key.
      *   `Cosmetic` justification has a cap of 0. No amount of targeting makes it valid.
      *   `Health` justification has a high cap. High counts are permissible if `Target Specificity` is high.
  *   **Verdict:** This pair is saveable. The rule predicts exactly what you feel: Aim > Count.

  **C. The Housemate Veto (Case 3)**
  *   **The Conflict:** You override a housemate's objection to ant bait.
  *   **The Diagnosis:** This is the weakest link in your logic compared to Case 6 (Neighbor's bees).
      *   In Case 6, you respect the neighbor's boundary (Hard Constraint).
      *   In Case 3, you override the housemate's boundary (Soft Constraint).
  *   **The Bug:** This is not a moral rule; it is a **Territorial Assertion**. You treat the housemate as a subordinate stakeholder rather than a rights-holder.
  *   **Unsaveable Verdict:** A consistent rule cannot say "Neighbor's bees are inviolable" but "Housemate's moral objection to killing in shared space is overridable." To make this consistent, you must admit that your rule includes a clause: *"Actor's definition of 'Hygiene Problem' overrides cohabitant's definition of 'Coexistence'."*

  ---

  ### 3. The Ownership Bias Audit

  You asked me to be plain about territorial intuitions.

  *   **Case 3 (Housemate) vs. Case 6 (Neighbor):** The only variable changing here is **Property Rights**.
      *   In Case 6, the bees belong to the neighbor. Killing them is trespass/tort.
      *   In Case 3, the ants are in *your* domain (or a domain where you assert dominance). The housemate's objection is treated as a preference, not a right.
  *   **Case 4 (Lawn) vs. Case 5 (Aedes):**
      *   Lawn: You own the lawn. You are restricted by the *pointlessness* of the act.
      *   Aedes: You do not own the mosquitoes or the region. You are empowered by the *public utility* of the act.
  *   **Conclusion:** Your rule is not purely about "insect welfare." It is about **Agency**.
      *   You feel authorized to kill when *you* define the problem (Ants, Wasps).
      *   You feel authorized to kill when *society* defines the problem (Dengue, Locusts).
      *   You feel unauthorized when *you* define a trivial problem (Lawn) or when *others* bear the cost (Bees).

  **Plain Truth:** Your "Real Problem" clause is a proxy for "Legitimate Authority." You trust your own authority on hygiene (Case 3) more than your housemate's, but you trust public health authority (Case 5) more than your own aesthetic authority (Case 4).

  ---

  ### 4. Predictions on Unsettled Cases

  Running the Repaired Spec (v2.0) against your new scenarios.

  **Case A: The Expensive Trap**
  *   **Scenario:** Species-recognizing trap, 90% bycatch reduction, 20x cost.
  *   **Inputs:**
      *   `Justification`: Standard (Hygiene/Property).
      *   `Target Specificity`: High (90% improvement).
      *   `Cost`: High (20x).
  *   **Rule Logic:**
      *   `Method Humanity` is a Soft Constraint.
      *   `Cost/Effort` is a valid modifier for Soft Constraints (see Sterilization Case 8).
      *   20x cost is likely "Prohibitive" for standard hygiene aims.
  *   **Prediction:** **Permissible to use the cheap trap.**
      *   *Reasoning:* Your spec allows "Satisficing." Unless the bycatch involves endangered species (raising `Justification Weight`), the 20x cost triggers the "Not Obligatory" clause derived from Case 8.
      *   *Nuance:* If you buy it, you get "Moral Bonus Points" (Supererogatory), but failing to buy it is not a violation.

  **Case B: The Gene Drive**
  *   **Scenario:** Suppress crop pest region-wide, no spraying.
  *   **Inputs:**
      *   `Justification`: Economic/Food Security (High).
      *   `Target Specificity`: Extremely High (Genetic).
      *   `Collateral`: Unknown ecological cascade (Potential Bystanders).
      *   `Method`: Sterilization/Suppression (Preferred per Case 8).
  *   **Rule Logic:**
      *   Passes `Justification Weight`.
      *   Passes `Method Humanity` (Sterilization > Killing).
      *   **Risk:** `Check Target Specificity` depends on ecological modeling. If the drive jumps species or affects predators, it triggers the **Case 6 (Bystander)** veto.
  *   **Prediction:** **Preferred over spraying, conditional on risk assessment.**
      *   *Reasoning:* It aligns perfectly with the "Sterilization is better" (Case 8) and "No spray collateral" (Case 6) intuitions.
      *   *Caveat:* If the gene drive is irreversible and risks a "neighbor" (ecosystem) you don't own, your **Case 6** intuition might spike. However, compared to broad-spectrum spray (known bystander death), the gene drive (theoretical bystander risk) likely passes your "Real Problem" filter for crop protection.

  ### Summary of Repairs

  1.  **Formalize "Satisficing":** Admit that you optimize for convenience once a moral threshold is met. This saves the "Sterilization not obligatory" verdict.
  2.  **Hard vs. Soft Constraints:** Suffering is a Hard Constraint (Veto). Bycatch reduction is a Soft Constraint (Cost-dependent).
  3.  **Acknowledge Authority:** Your rule relies on *who* calls it a "Real Problem." You privilege your own hygiene standards over housemates, but defer to public health over your own aesthetics.

  **Final Verdict on Your Spec:** It is robust for *external* actions (neighbors, public health) but contains a hardcoded privilege escalation for *internal* domestic decisions (housemates, personal lawn). If you patch the "Housemate Veto," your system becomes consistent. If you keep it, you must document it as a "Property Owner Override."
