answer: |-
  ### Preliminary Diagnostic: Smuggled Assumptions in Meta-Problem Frameworks

  Before we codify the desiderata, we must clear the conceptual underbrush. In my experience, seminars on the meta-problem often stall because participants operate with unexamined premises regarding the relationship between the *target* (consciousness) and the *report* (judgments about consciousness).

  The most pernicious assumption is what I call the **Identity of Mechanism Assumption**. This is the tacit belief that the cognitive process generating the verbal report "I am conscious" must be ontologically continuous with, or identical to, the process constituting the phenomenal experience itself. If you hold this, you are forced into a corner: either the report is infallible (because it is the experience speaking), or the experience is an illusion (because the report is a fallible cognitive construct). A rigorous meta-problem theory must decouple these. The mechanism producing the *judgment* that physicalism is incomplete can be distinct from the mechanism generating the *phenomenology* that motivates the judgment.

  A second hidden assumption is the **Normative Vacuum**. Many physicalists assume that providing a causal explanation for a belief (the Explanatory Meta-Problem) automatically settles the epistemic status of that belief (the Normative Meta-Problem). This is a version of the genetic fallacy. Conversely, some realists assume that because the judgment is normatively entitled, it requires a unique non-physical explanation. We must resist both. The causal genealogy of a judgment and its rational warrant are distinct variables, though they constrain one another.

  Finally, there is the **Transparency Smuggle**. This is the assumption that the meta-problem theory must preserve the *phenomenological transparency* of the judgment process. In other words, the theory cannot posit that the agent is ignorant of *why* they are making the judgment, even if the theory explains why they *think* they know. A robust theory must allow for the possibility that the agent's introspective access to their own reasoning about consciousness is itself part of the data to be explained, not the final court of appeal.

  ***

  ### Desiderata for an Adequate Theory of the Meta-Problem

  We will structure these requirements around your seminar's distinction: the **Explanatory Meta-Problem** (EMP) and the **Normative Meta-Problem** (NMP).

  #### I. Desiderata for the Explanatory Meta-Problem (EMP)
  *Goal: To provide a causal/functional account of why intelligent agents systematically judge that physical explanations of consciousness are incomplete.*

  **1. Mechanistic Specificity (Non-Negotiable)**
  *   **Requirement:** The theory must identify specific cognitive architectures (e.g., attentional schemas, memory buffers, self-modeling modules) responsible for generating "problem judgments." It cannot rely on vague appeals to "conceptual confusion."
  *   **Motivation:** Without mechanistic specificity, the meta-problem solution is merely a restatement of the intuition it seeks to explain. It must be compatible with empirical cognitive science.
  *   **Constraint:** Must be compatible with known limitations of working memory and introspective access.

  **2. Phenomenal Trigger Identification (Non-Negotiable)**
  *   **Requirement:** The theory must specify which features of first-person experience (e.g., ineffability, immediacy, unity) act as the input triggers for the judgment mechanism.
  *   **Motivation:** The judgment doesn't arise in a vacuum; it is a response to specific qualitative characters. If the theory cannot map specific phenomenological features to specific cognitive outputs, it fails to explain the *content* of the judgment.
  *   **Constraint:** Must not presuppose the veridicality of these features (i.e., it must explain the judgment even if the features are misrepresentations).

  **3. Evolutionary Plausibility (Camp-Specific Preference)**
  *   **Requirement:** The theory should offer an account of why this judgment-capacity evolved.
  *   **Motivation:** If the capacity to judge physicalism as incomplete is universal, did it confer a survival advantage?
  *   **Status:** *Camp-Specific.* Adaptationists require a functional benefit (e.g., social modeling). Spandrelists or Dualists may view this as irrelevant or argue the capacity is a byproduct of general intelligence. A theory can be adequate without this, but it is stronger with it.

  **4. Cross-Conceptual Robustness (Non-Negotiable)**
  *   **Requirement:** The explanation must hold across different conceptual frameworks and cultures. It cannot rely on the specific vocabulary of "physicalism" or "dualism" but must explain the pre-theoretical intuition that gives rise to these categories.
  *   **Motivation:** The "Hard Problem" intuition predates modern physicalism. A theory that only explains why *philosophers* make the judgment is insufficient; it must explain why *agents* make the judgment.

  #### II. Desiderata for the Normative Meta-Problem (NMP)
  *Goal: To determine whether agents are rationally entitled to maintain the judgment that physical explanations are incomplete, independent of the actual metaphysical status of consciousness.*

  **5. Epistemic Grounding Condition (Non-Negotiable)**
  *   **Requirement:** The theory must specify the conditions under which the judgment mechanism is reliable. Does the cognitive process track truth, or does it track utility?
  *   **Motivation:** To assess rational entitlement, we must know if the mechanism is truth-apt. If the mechanism is designed to maximize social cohesion rather than metaphysical accuracy, normative entitlement is undermined.
  *   **Constraint:** Must distinguish between *pragmatic* justification (useful to believe) and *epistemic* justification (likely to be true).

  **6. Defeasibility Criteria (Non-Negotiable)**
  *   **Requirement:** The theory must articulate what evidence would rationally compel an agent to *abandon* the judgment.
  *   **Motivation:** A judgment that is immune to counter-evidence is dogmatic, not rational. If the theory claims agents are entitled to the judgment, it must show how that entitlement could be lost.
  *   **Constraint:** If the theory claims the judgment is *incorrigible*, it bears a heavy burden to explain why physical counter-evidence is irrelevant.

  **7. First-Person Authority Preservation (Camp-Specific Preference)**
  *   **Requirement:** The theory must decide whether the agent's introspective report holds a privileged normative status over third-person functional data.
  *   **Motivation:** Phenomenologists argue that without this, we lose the "consciousness" in the problem. Physicalists argue this privilege is the source of the error.
  *   **Status:** *Camp-Specific.* Realist/Phenomenological views treat this as Non-Negotiable. Illusionist/Physicalist views treat this as a target for revision or elimination. An adequate theory can take either side, but must explicitly declare its stance.

  **8. Metaphysical Neutrality (High Tension)**
  *   **Requirement:** Ideally, the NMP solution should not presuppose the solution to the Hard Problem. It should assess the *rationality of the belief* without settling the *truth of the content*.
  *   **Motivation:** We want to know if it is rational to be a dualist even if physicalism is true (and vice versa).
  *   **Status:** *Aspirational.* As we will see in the tension analysis, this is difficult to maintain.

  ***

  ### Tension Analysis: Joint Satisfiability and Interrelations

  The core challenge of your seminar's distinction lies in the interface between the EMP and the NMP. Are they independent modules, or does solving one collapse the other?

  **1. The Debunking Threat (EMP $\rightarrow$ NMP)**
  There is a significant risk that a successful solution to the EMP automatically undermines the NMP. If the Explanatory account reveals that the judgment "physicalism is incomplete" is generated by a heuristic optimized for social modeling or interface simplification (a "user illusion"), this provides an *evolutionary debunking argument* against the Normative entitlement.
  *   **Tension:** High. A robust mechanistic explanation often looks like a reduction of the judgment to non-truth-tracking processes.
  *   **Unsatisfiable Subset:** You cannot jointly hold: (A) The judgment is produced by a mechanism selected for fitness rather than truth, AND (B) The agent is normatively entitled to believe the judgment reflects metaphysical reality. One must yield.

  **2. The Independence Claim (NMP $\nleftrightarrow$ EMP)**
  Can we have a complete EMP that is Normatively neutral?
  *   **Analysis:** In principle, yes. One could map the cognitive circuitry of the judgment (EMP) without assessing its reliability (NMP). However, in practice, identifying the *function* of the circuitry (part of EMP) usually implies a stance on its *reliability* (part of NMP).
  *   **Verdict:** They are analytically distinct but empirically entangled. A theory that claims to solve the EMP while remaining agnostic on the NMP is likely hiding its normative premises inside its functional descriptions.

  **3. The Authority Conflict (Desideratum 7 vs. Desideratum 1)**
  If you insist on preserving First-Person Authority (NMP-7), you constrain the Mechanistic Specificity (EMP-1). You cannot posit a mechanism that "corrects" or "interprets" raw experience if the raw experience is supposed to be the normative anchor.
  *   **Unsatisfiable Subset:** "Infallible Introspection" + "Constructivist Cognitive Architecture." If the architecture constructs the report, the report is not infallible. If the report is infallible, the architecture must be transparent, which contradicts cognitive science findings on introspective opacity.

  **4. The Completeness Trap**
  If the EMP is solved completely (we know exactly why we make the judgment), does the Hard Problem dissolve?
  *   **Physicalist View:** Yes. Explaining the judgment removes the motivation for positing non-physical properties.
  *   **Realist View:** No. Explaining the judgment explains the *epistemology*, not the *ontology*. The NMP remains open: we might be rationally entitled to believe in irreducibility even if we know why we believe it.
  *   **Coherence Check:** Your distinction holds up here, provided the NMP is strictly about *entitlement* and not *truth*. However, most agents conflate entitlement with truth. A theory must explain this conflation as part of the EMP.

  ***

  ### Brief Scorecard Against Major Approaches

  To test the utility of these desiderata, here is how three dominant camps fare against the framework.

  **1. Physicalist Dissolution (e.g., Representationalism, Global Workspace)**
  *   **EMP Performance:** Strong. These theories excel at Mechanistic Specificity and Evolutionary Plausibility. They map judgments to functional roles.
  *   **NMP Performance:** Weak. They struggle with First-Person Authority Preservation. They typically argue the agent is *not* normatively entitled to the judgment (it is a cognitive error).
  *   **Critical Tension:** They often violate Metaphysical Neutrality by defining the EMP in a way that presupposes physicalism is true, thereby begging the question against the NMP.

  **2. Illusionist Accounts (e.g., Dennettian heterophenomenology)**
  *   **EMP Performance:** Very Strong. They treat the judgment as a user-interface artifact, offering high Cross-Conceptual Robustness.
  *   **NMP Performance:** Hostile. They explicitly deny Normative Entitlement. The judgment is a "false fame" effect.
  *   **Critical Tension:** They fail Desideratum 2 (Phenomenal Trigger Identification) from the perspective of the subject, because they deny the trigger (phenomenality) exists as described. They explain the judgment by denying the data that motivates it.

  **3. Phenomenological Accommodationism (e.g., Non-Reductive Physicalism, Panpsychism)**
  *   **EMP Performance:** Weak to Moderate. They often lack Mechanistic Specificity, relying on "brute" connections between experience and judgment.
  *   **NMP Performance:** Strong. They preserve First-Person Authority and Epistemic Grounding (the judgment tracks reality).
  *   **Critical Tension:** They struggle with Evolutionary Plausibility. If the judgment tracks irreducible properties, what is the survival value of tracking them, and how does a physical brain interact with them to produce the report? They often violate the Identity of Mechanism assumption in a way that makes causal closure difficult.

  ### Final Conceptual Mapping

  Your distinction between the Explanatory and Normative meta-problems is coherent and necessary, but it is not stable. The **Explanatory** tends to eat the **Normative**. Once you fully explain the machinery of the judgment, the "entitlement" to that judgment usually looks like a relic of the machinery's opacity.

  To maintain the distinction, you must enforce a strict firewall: The EMP describes the *causal history* of the belief; the NMP describes the *warrant* of the belief. But be warned: any theory that offers a rich EMP will inevitably suggest that the NMP warrant is thinner than the subject feels. The most rigorous theory will be one that admits this tension rather than resolving it by fiat. It must explain why we feel normatively secure (EMP) while assessing whether we actually are (NMP). If a theory claims to do both without friction, it is likely smuggling a metaphysical conclusion into a cognitive premise.
