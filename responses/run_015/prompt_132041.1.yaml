prompt: |-
  I'm taking a graduate seminar on consciousness and explanation, and before I evaluate any specific account I need a rigorous specification of what such an account must actually deliver. Please take on the role of an expert philosopher of mind with equal training in phenomenology and cognitive science, and think carefully before you begin: spend a moment brainstorming the hidden assumptions people usually smuggle into demands on a meta-problem theory—especially the assumption that explaining our judgments about consciousness and explaining consciousness itself must be handled by a single mechanism.

  Then write the full desiderata: what any adequate theory of the meta-problem of consciousness must achieve. Structure this around a distinction our seminar developed that I want tested for coherence—between the explanatory meta-problem (giving an account of why intelligent agents judge physical explanations of consciousness to be incomplete) and the normative meta-problem (giving an account of whether those agents are rationally entitled to maintain that judgment, irrespective of whether consciousness is in fact physically explicable). For each desideratum, provide the motivating case or consideration behind it; flag which requirements are genuinely non-negotiable and which are camp-specific preferences (for instance, preserving first-person phenomenal authority, maintaining compatibility with global workspace or predictive-processing architectures, forbidding deflationary moves that treat the hard problem as a cognitive illusion, or insisting on continuity with evolutionary biology); and indicate whether any subset of these desiderata is jointly unsatisfiable—particularly whether a complete solution to the explanatory version automatically supports, undermines, or remains neutral toward the normative version.

  Keep the conceptual weight on the criteria, their interrelations, and any tension sets; a brief scorecard against physicalist dissolution strategies, illusionist accounts, and phenomenological accommodationist views is welcome but should stay secondary. Do not provide bibliographies, reading lists, or citations—this is for my own conceptual mapping, not a literature review.
