          2.  *Political:* Responsibility for the state's actions. All citizens bear this collectively. Leads to liability/reparations imposed by victors.
          3.  *Moral:* Personal conscience. Did I act according to my conscience? Did I stay silent? Applies to individuals, not collectives. Only I can judge myself (or God).
