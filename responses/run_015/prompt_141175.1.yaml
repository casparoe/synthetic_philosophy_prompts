prompt: |-
  I've spent the better part of a decade working in market design — two-sided matching, kidney exchange, combinatorial clock auctions for spectrum, and one long-running headache involving the allocation of school places — so my native vocabulary is bidders, preference orderings over allocations, transfers, individual rationality, strategy-proofness, budget balance, thickness and congestion, and repugnant transactions. None of that needs explaining to me. A friend who works on global health funding has been trying to recruit me to an idea she calls moral trade, and I'd like you to restate it for me in those terms. As she explains it: two parties who disagree about what is worth doing can still trade to mutual advantage, because each can buy cheaply an action the other regards as worthless. If I believe a marginal pound does most good buying insecticide-treated bednets while you believe it does most good restoring a parish roof, I give to your roof on condition that you give to my bednets, and each of us, by our own lights, has secured a great deal of value for a small outlay; the same structure is meant to work for votes, careers and abstentions, not just money.

  What I want is a systematic translation, not an explanation pitched at a beginner. Take the case for moral trade and the main cases against it — the commitment problem, given that nothing is ever delivered to the payer and each side would prefer the other to move first; the charge that paying someone to do what they themselves take to be worthless is a kind of corruption (she bristles at the word simony); the worry that the practice is only moral offsetting under a new name; the dependence of the supposed gains on contested empirical and moral claims — and render each in market-design language as precisely as you can, one by one, without quietly crediting my framework with resources it does not have. If a step of the argument needs interpersonal comparisons of value, a common cardinal scale, or something playing the role of a prior over moral theories, name the need rather than assume it satisfied. A few short sections are fine; I'd rather have precision than completeness.

  Then give me the residue report, which is the part I actually care about: what translated cleanly, what went through only after you had stretched a term, and what cannot be said in my vocabulary at all — whether, for instance, Pareto improvement still means anything when the two parties apply different measures of value, or whether a market in which the buyer never consumes the good and the seller attaches no value to producing it is a market in anything I would recognise. My own suspicion is that this is just Coasean bargaining over an externality with no agreed property rights, where an unexamined status quo allocation and an unearned transferable-utility assumption do all the work, and that once said out loud the idea is either trivial or incoherent; test that suspicion rather than indulge it. Two further wrinkles I cannot fit into my framework at all, and which you should have a go at: trades made conditional on a contingency that neither party can verify, with a mutually trusted arbiter; and trades between parties who never meet and cannot observe each other's performance, resting on expected reciprocity alone. If the residue points to something my framework is missing, say what; if it points to something confused in the moral-trade literature, say that instead.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Profile:** Expert in market design (matching, auctions, mechanism design). Vocabulary includes: bidders, preference orderings, transfers, individual rationality (IR), strategy-proofness (SP), budget balance (BB), thickness, congestion, repugnant transactions.
      *   **Task:** Translate the concept of "Moral Trade" (as described by the user's friend) into market design language.
      *   **Specific Requirements:**
          *   Systematic translation, not beginner-level explanation.
          *   Cover the case *for* moral trade and the main cases *against* it (commitment problem, corruption/simony, moral offsetting, dependence on contested claims).
          *   Precision is key; name missing assumptions (e.g., interpersonal utility comparisons, common priors).
          *   **Residue Report:** Crucial section. Analyze what translated cleanly, what required stretching, and what is incoherent in the framework. Specifically address Pareto improvements under different value measures and the nature of the "market" (buyer doesn't consume, seller doesn't value production).
          *   **Test the User's Suspicion:** Is this just Coasean bargaining with unexamined status quo and TU assumptions?
          *   **Two Wrinkles:** Conditional trades on unverifiable contingencies (trusted arbiter) and trades between strangers (expected reciprocity).
          *   **Tone:** Professional, precise, peer-to-peer, no fluff.

  2.  **Deconstruct "Moral Trade" into Market Design Terms:**
      *   *Agents:* Two parties (A and B).
      *   *Goods/Actions:* "Bednets" (Action $x$) and "Roof" (Action $y$).
      *   *Valuations:*
          *   A values $x$ highly ($v_A(x) \gg 0$), values $y$ low/zero ($v_A(y) \approx 0$).
          *   B values $y$ highly ($v_B(y) \gg 0$), values $x$ low/zero ($v_B(x) \approx 0$).
          *   *Crucial Constraint:* Valuations are not over consumption, but over *states of the world* resulting from actions.
      *   *Mechanism:* A agrees to fund $y$ (cost $c_y$) if B agrees to fund $x$ (cost $c_x$).
      *   *Transfers:* Money moves from A to provider of $y$, and B to provider of $x$. Effectively, A pays $c_y$, B pays $c_x$.
      *   *Gains from Trade:* A gets $x$ done (by B's money) for the price of doing $y$. If $v_A(x) > c_y$ and $v_A(y) < c_y$ (from A's perspective, doing $y$ is "cheap" in terms of moral opportunity cost), A gains. Same for B.

  3.  **Translate Arguments For/Against:**

      *   *The Case For:* Pareto Improvement.
          *   Standard: $u_A(new) > u_A(status\_quo)$ and $u_B(new) > u_B(status\_quo)$.
          *   Nuance: Utility functions differ. Need to define the domain.
      *   *Commitment Problem:* Hold-up problem / Contract enforcement.
          *   Simultaneous move game vs. Sequential. Without binding contract, it's a Prisoner's Dilemma or Assurance Game.
      *   *Corruption/Simony:* Repugnance constraints / Endogenous preferences.
          *   Selling a moral duty changes the valuation function. $v_B(x)$ might become negative if paid to do it (motivation crowding).
      *   *Moral Offsetting:* Externalities / Licensing.
          *   Buying the right to not do $x$ because you funded $z$. In market design, this is like trading pollution credits.
      *   *Contested Claims:* Type spaces / Priors.
          *   Agents have different priors over the efficacy of $x$ vs $y$. Trade requires agreement on the *exchange rate*, not necessarily the absolute values.

  4.  **Drafting the Translation (Iterative refinement for precision):**

      *   *Setup:* Define agents $i \in \{A, B\}$. Actions $a \in \{x, y\}$. Cost $k$.
      *   *Preferences:* $u_i(a, t)$. Note that $t$ (transfer) is standard, but $a$ is the *other* person's action.
      *   *IR:* Participation constraints.
      *   *IC:* Incentive compatibility (honesty about valuations).
      *   *Commitment:* Enforcement technology.
      *   *Simony:* Preference endogeneity.

  5.  **Developing the Residue Report (The Core Task):**
      *   *What translated cleanly:* The structure of gains from trade (comparative advantage in moral production). The commitment problem is a standard contract enforcement issue.
      *   *What stretched:* "Utility." In standard market design, utility is usually private and self-regarding (or at least defined over own consumption). Here, utility is other-regarding but *paternalistic* regarding the object.
      *   *What failed:* Pareto Efficiency. If preferences are over different ontological categories (saving lives vs. glory of God), is there a common welfare metric? No, Pareto doesn't need a common metric, but it needs defined preferences. The issue is *Interpersonal Comparability of Utility* isn't needed for Pareto, but *Verification* of the utility claim is.
      *   *The "Market" Nature:* It's not a market for goods. It's a swap of *budget authority*. It's closer to a swap of *mandates*.
      *   *User's Suspicion:* Coasean bargaining. Yes, but without property rights. The "right" to allocate the marginal pound is the property right. The TU (Transferable Utility) assumption is doing heavy lifting because money is the numeraire, but moral value isn't necessarily linear in money.
      *   *The Wrinkles:*
          *   *Unverifiable Contingency:* Non-contractible states. Requires a mechanism with a trusted third party (oracle/arbiter). This breaks standard IC/IR if the arbiter isn't modeled.
          *   *Strangers/Reciprocity:* Repeated game / Reputation mechanism. Thick market vs. bilateral monopoly. If it's one-shot, it collapses without enforcement.

  6.  **Refining the Vocabulary:**
      *   Use "Allocation" for the state of the world.
      *   Use "Transfers" for the funding.
      *   Use "Repugnance" for the Simony objection.
      *   Use "Non-contractibility" for the verification issue.
      *   Use "Type Space" for the moral/empirical beliefs.

  7.  **Addressing the Specific "Residue" Questions:**
      *   *Pareto:* Still holds formally ($U_A' > U_A, U_B' > U_B$), but the *domain* of $U$ is the problem.
      *   *Market Definition:* It's a market for *influence*, not consumption.
      *   *Coase:* Yes, bargaining over the allocation of a fixed budget endowment subject to externalities.
      *   *TU:* Money provides TU, but moral utility may not be transferable via money (lexicographic preferences?).

  8.  **Final Review against Constraints:**
      *   Did I explain basic terms? No.
      *   Did I cover the wrinkles? Yes.
      *   Is the tone right? Yes, analytical and critical.
      *   Did I test the suspicion? Yes.

  9.  **Constructing the Output:** (Self-Correction during drafting)
      *   *Correction:* Make sure not to say "Pareto fails." Pareto holds *within* the model, but the model's inputs (preferences) are the contested part.
      *   *Correction:* On Simony, emphasize *endogenous preferences* triggered by the mechanism itself (price dependence of valuation).
      *   *Correction:* On the "Strangers" wrinkle, distinguish between bilateral repeated games and a thick market with reputation (like eBay but for moral acts).

  10. **Final Polish:** Ensure the distinction between "action" and "outcome" is clear, as moral trade often focuses on the outcome (bednets distributed) while the cost is the action (donating money).

  *(Self-Correction on the "Residue" regarding Pareto)*: The user asks if Pareto means anything when parties apply different measures of value. In standard welfare economics, Pareto doesn't require a *common* measure, just ordinal rankings within each agent. However, if the "value" is not well-defined (e.g., incommensurable goods), the preference ordering itself might be incomplete. I need to highlight *Incomplete Preferences* as a residue issue.

  *(Self-Correction on Coase)*: The user suspects it's Coasean bargaining with unexamined status quo. I need to confirm: The status quo is "I spend my money on X, you spend yours on Y." The trade is "I spend on Y, you spend on X." The externality is that I care about what you do with your money. So yes, it's internalizing an externality.

