answer: |-
  ### I. Formal Translation of Moral Trade

  **The Environment**
  Let there be two agents, $i \in \{A, B\}$, and two public goods (or actions), $x$ and $y$.
  Each agent holds an endowment of budget $E_i$.
  The cost of producing one unit of $x$ or $y$ is $c$.
  Agents have utility functions $u_i(a_x, a_y, t_i)$, where $a_k \in \{0, 1\}$ indicates whether good $k$ is produced, and $t_i$ is the net monetary transfer from $i$'s endowment.
  Crucially, preferences are interdependent: $A$ derives utility primarily from $a_x$, $B$ from $a_y$.
  $v_A(a_x=1) \gg v_A(a_y=1) \approx 0$.
  $v_B(a_y=1) \gg v_B(a_x=1) \approx 0$.
  We assume quasilinear utility in money for the range of relevant transfers, satisfying Transferable Utility (TU).

  **The Mechanism (The Case For)**
  The proposed trade is a direct exchange mechanism.
  $A$ commits transfer $t_A = c$ conditional on $B$ committing transfer $t_B = c$, such that $t_A$ funds $y$ and $t_B$ funds $x$.
  **Individual Rationality (IR):** The trade is IR if:
  $u_A(a_x=1, a_y=1, -c) > u_A(a_x=1, a_y=0, 0)$ (assuming $A$ would fund $x$ alone otherwise).
  More precisely, the gain from trade exists if the "moral opportunity cost" of funding the other's good is lower than the value of securing one's own good via the partner's budget.
  $A$ values $x$ at $V_A$. Cost to $A$ of funding $x$ directly is $c$. Cost to $A$ of funding $y$ (to induce $B$) is $c$.
  Trade is beneficial if $V_A - c > V_A^{solo} - c$. This implies the constraint is budget, not valuation.
  If $A$ is budget-constrained in doing good, swapping budget authority allows $A$ to leverage $B$'s budget to produce $x$.
  This is a **Pareto improvement** relative to the non-cooperative Nash equilibrium (where each funds their own preferred good subject to budget constraints), provided the IR constraints hold.

  **The Commitment Problem**
  This is a **contract enforcement** issue in a setting with non-contractible actions or lack of legal standing.
  If the game is sequential, it suffers from a **hold-up problem**: the second mover has a dominant strategy to defect (keep budget, do not fund $x$).
  If simultaneous, it is an **Assurance Game**. Without a binding contract or escrow mechanism, the unique Nash equilibrium is (Defect, Defect).
  In market design terms: The mechanism lacks **implementation in dominant strategies** without an external enforcement technology.

  **Corruption and Simony (Repugnance Constraints)**
  This objection maps to **endogenous preferences** dependent on the pricing mechanism.
  Standard assumption: $v_i(\cdot)$ is fixed.
  Simony objection: Introducing a transfer $t$ changes the valuation function. $v_B(x | \text{paid}) < v_B(x | \text{voluntary})$.
  If the act of selling a moral duty renders the good "repugnant" or destroys the intrinsic signal value of the action, the demand curve slopes backward or collapses to zero.
  This is a **failure of revealed preference**: the price signal corrupts the type report.

  **Moral Offsetting**
  This is the **tradable permit** argument.
  If $A$ pays $B$ to do $x$, $A$ may feel licensed to reduce their own direct contribution to $x$ or increase consumption of a "bad" $z$.
  In mechanism design, this is a **leakage** problem. The net change in $a_x$ is zero if $A$ reduces direct funding by exactly the amount $B$ adds via the trade.
  The mechanism only creates value if the trade induces *additional* action (additionality), not just substitution.

  **Dependence on Contested Claims**
  Agents operate with different **priors** over the production function of moral goods.
  $A$ believes $Efficiency(x) \gg Efficiency(y)$. $B$ believes $Efficiency(y) \gg Efficiency(x)$.
  For trade to occur, they need not agree on absolute efficiency, only on the **exchange rate**.
  However, if priors are sufficiently divergent (no common support), there may be no price $p$ such that IR holds for both.
  This requires a **common prior assumption** over the feasibility of the trade itself, even if valuations differ.

  ---

  ### II. Residue Report

  **1. What Translated Cleanly**
  *   **Gains from Trade:** The core logic is standard comparative advantage with budget constraints. If money is the numeraire and utility is quasilinear, the algebra holds.
  *   **Commitment:** This is a standard dynamic inconsistency problem. It requires an escrow mechanism or repeated game structure to solve.
  *   **Repugnance:** The Simony objection fits neatly into the literature on repugnant transactions (Roth), specifically where the *price* itself alters the good's nature.

  **2. What Required Stretching**
  *   **The "Good":** In your framework, goods are usually rivalrous or excludable, or public goods funded by a central planner. Here, the "good" is a *state of the world* produced by a third party (the bednet manufacturer, the roofer). The agents are trading *budget authority*, not the good itself. This is closer to a **swap of mandates** than a market for goods.
  *   **Utility Domain:** Standard market design assumes preferences are defined over allocations *consumed* by the agent. Here, preferences are defined over allocations *consumed by the world*. This requires treating agents as **social planners** with limited budgets, not consumers. This stretches the definition of "Individual Rationality" from "I am better off" to "The world is better off according to my metric."

  **3. What Cannot Be Said (The Incoherence)**
  *   **Pareto Efficiency:** You asked if Pareto improvement means anything when parties apply different measures of value. Formally, yes: if $U_A' > U_A$ and $U_B' > U_B$, it is Pareto superior. *However*, this relies on the **completeness of preferences**. If moral value is incommensurable (e.g., $A$ cannot rank "saving a life" against "spending \$100" without a cardinal scale), the preference ordering is incomplete. If preferences are incomplete, IR is undefined. The moral trade literature assumes a cardinal moral utility function that is rarely justified.
  *   **The Market Definition:** You asked if a market where the buyer never consumes and the seller attaches no value to production is a market. **No.** It is a **barter of externalities**.
      *   In a standard market, $A$ buys $x$ because $A$ values $x$.
      *   In moral trade, $A$ buys $y$ (which $A$ values at $\approx 0$) to induce $B$ to buy $x$.
      *   This is not a market for $x$ or $y$. It is a market for **influence over $B$'s budget**.
      *   Your suspicion is correct: This is **Coasean bargaining over an externality**. $A$ cares about $B$'s spending (positive externality if $B$ spends on $x$, negative if on $y$). The "property right" is the default ownership of one's own budget. The trade reassigns the right to allocate that budget.
      *   **The TU Assumption:** This does all the work. It assumes moral value is linear in money. If $A$ has lexicographic preferences (e.g., "must save at least one life"), TU fails, and the trade collapses. The literature assumes smooth indifference curves over moral states, which is a massive, unexamined assumption.

  **4. The Two Wrinkles**

  *   **Unverifiable Contingencies (Trusted Arbiter):**
      *   *Translation:* **Non-contractible states with a verified oracle.**
      *   *Analysis:* In standard mechanism design, if a state is unverifiable, it cannot be part of the contract (Maskin monotonicity issues). Introducing a "trusted arbiter" is an exogenous enforcement technology outside the model.
      *   *Residue:* This moves the problem from mechanism design to **cryptography/escrow**. The "market" relies on the arbiter's integrity. If the arbiter is not modeled as a strategic agent, you have assumed away the incentive problem. If the arbiter *is* strategic, you have a three-party mechanism design problem with potential collusion. The moral trade literature treats the arbiter as a black box (God, karma, reputation), which is analytically empty.

  *   **Strangers / Expected Reciprocity:**
      *   *Translation:* **One-shot game in a thick market with reputation.**
      *   *Analysis:* If parties never meet, this is not a repeated game between $A$ and $B$. It relies on a **system-level reputation mechanism** (e.g., "I donate to your cause because the community expects reciprocity").
      *   *Residue:* This requires **thickness** not of bidders, but of *norms*. In your vocabulary, this is a **correlated equilibrium** sustained by social signals. Without a public ledger of who traded with whom, this is incoherent. It collapses to a Prisoner's Dilemma. The moral trade literature assumes "thick norms" exist where there is only "thin anonymity."

  **5. Verdict on Your Suspicion**
  Your suspicion is robust.
  *   **Coasean Bargaining:** Yes. It is bargaining over the allocation of budget endowments to internalize cross-agent externalities.
  *   **Unexamined Status Quo:** Yes. The "no trade" baseline is treated as natural, but it is just one allocation of property rights (I own my money).
  *   **Unearned TU:** Yes. The entire argument collapses if moral utility is not transferable via cash. If $A$ values bednets lexicographically, no amount of roof-restoration by $B$ compensates for $A$ not funding bednets directly.
  *   **Trivial or Incoherent:** It is **trivial** if TU holds and enforcement is costless (it's just efficient budget pooling). It is **incoherent** if preferences are incomplete or non-transferable (which is likely in moral contexts).

  **Missing from Your Framework:**
  Your framework lacks a formal treatment of **incomplete preferences** and **endogenous moral types**. Market design assumes stable preferences over a defined set of outcomes. Moral trade posits agents whose preferences are over undefined ontological categories (salvation, utility, glory) and whose utility functions shift upon the introduction of price. To model this, you would need to expand the type space to include *preference-generating functions*, not just preference orderings.

  **Missing from Moral Trade Literature:**
  They lack a definition of **enforcement**. They assume the "trade" happens without specifying the mechanism that prevents defection in a one-shot setting. They also assume **interpersonal comparability** is unnecessary for Pareto claims, ignoring that without a common metric, we cannot verify if the "gains" are real or just asserted.
