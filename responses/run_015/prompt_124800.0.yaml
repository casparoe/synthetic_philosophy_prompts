      *   *Point 2:* Distinguish between human expert deference (social contract) vs. machine deference (black box). The risk is atrophy of moral muscle.
      *   *Point 3:* Disclosure recommendation needs to be specific. "Meta-commentary" on the advice.
      *   *Point 4:* This is about governance. If we can't check the math, we check the incentives and the outcomes.

