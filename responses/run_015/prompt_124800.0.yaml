      *   *Paragraph 5:* Point 2 (Asymmetry). System knows more. Anti-paternalism shifts from outcome protection to agency protection. Machine deference risks atrophy of judgment differently than human experts.
      *   *Paragraph 6:* Point 3 (Disclosure). Mandate disclosure of framing sensitivity. It mitigates the "black box" effect.
      *   *Paragraph 7:* Point 4 (Epistemic Gap). Governance shift. We audit outcomes, not logic.
