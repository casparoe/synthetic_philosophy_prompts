      *   Word count? Aiming for ~1000.
      *   Tone? Chair-like.

  7.  **Writing - Focusing on Precision:**
      *   *Point 1:* "Holding content fixed" is impossible if abstraction levels change. Elasticity measures *decision stability under irrelevant variation*.
      *   *Point 2:* The residual worry is *ownership*. Deference to humans is a social transaction; deference to algorithms is a surrender of cognition.
      *   *Point 3:* Disclosure must be explicit. "This advice is sensitive to how I asked you about X."
      *   *Point 4:* If we can't evaluate substance, we evaluate the *process* that generated the substance.

      *(Self-Correction on Word Count)*: I need to ensure I don't ramble. I will combine the rebuttal with the specific points where possible to save space, but the prompt asks for the losing argument *before* answering it. I'll dedicate a specific section to the losing argument.

