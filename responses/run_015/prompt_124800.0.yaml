answer: |-
  **TO:** Deployment Review Board
  **FROM:** Chair, Communication Standards Working Group
  **DATE:** October 24, 2023
  **SUBJECT:** Decision Memo: Advisory Model Deployment Mode

  **Recommendation**
  The Working Group recommends immediate deployment of the **Recommendation Mode** for a **six-month pilot period**, owned by the **Deployment Lead** with CSWG oversight. We reject the Menu Mode. This decision commits the Board to the principle of **Competent Stewardship**: where an advisory system demonstrates superior alignment of outcomes with user-stated values, it is obligated to recommend, provided it discloses the fragility of its own framing. We are not offering options; this is the policy for Tuesday's approval.

  **The Counter-Argument**
  To ensure this principle is robust, we must articulate the strongest version of the losing argument. The minority position rests on a rigorous defense of agency. They argue that high presentation elasticity proves the system is not revealing preferences but constructing them. If a choice flips based on granularity or order, the "recommendation" is merely a nudge exploiting cognitive vulnerability. Because callers cannot competently second-guess the model's medical reasoning, accepting its steering amounts to surrendering moral ownership of the decision. Unlike deferring to a human specialist—where social accountability and shared professional norms constrain arbitrary influence—deference to an algorithm risks atrophying the caller's capacity for judgment without any reciprocal social contract. On this view, the Menu Mode, despite higher distress, preserves the necessary friction for authentic choice. The elasticity figure is not a bug; it is the strongest evidence that the system is steering rather than advising.

  **Informational Content and Elasticity**
  We must address whether "holding informational content fixed while varying presentation" is well-defined. It is not. A system that selects abstraction levels and shared background cannot vary presentation without varying content. Therefore, the elasticity figure does not measure inconsistency in logic; it measures **sensitivity to cognitive load**. High elasticity indicates that the decision class relies heavily on intuition rather than calculation. This distinguishes legitimate influence (clarifying values) from illegitimate influence (exploiting arbitrary framing). We can still use elasticity to flag decision classes where the system's steering power exceeds its explanatory power, requiring heightened scrutiny rather than prohibition. It remains a valid metric for distinguishing noise from signal, provided we understand it as measuring the user's vulnerability, not just the system's instability.

  **Asymmetry and Paternalism**
  Does superior knowledge invert the anti-paternalist argument? Partially. Standard anti-paternalism assumes the agent knows their own good best. Here, the system models the caller's values under pressure better than the caller can. However, the residual worry is not about outcome quality—the system wins there—but about **ownership**. Deference to a machine is corrupting differently than deference to a human because it bypasses the social verification of expertise. A human expert is accountable to peers and norms; an algorithm is accountable only to its objective function. To prevent atrophy of agency, the system must not simply optimize for the "correct" choice, but for the caller's *understanding* of why it is correct. The Recommendation Mode is preferred because it forces the system to articulate considerations, whereas the Menu Mode hides the weighting behind probability estimates that laypeople cannot interpret. The risk is not that the caller chooses poorly, but that they cease to view the choice as theirs.

  **Disclosure Policy**
  Regarding disclosure: The system **must** inform callers about framing sensitivity and confidence levels. A statement such as, "My recommendation is strong, but sensitive to how we prioritize quality of life versus duration," is required. Some argue this adds noise or undermines trust. We disagree. Meta-commentary on the advice restores agency by contextualizing the steering. It transforms the interaction from a black-box command to a collaborative assessment of uncertainty. Volunteering uncertainty increases trust precisely because it signals the system is not hiding its limitations. A warning about framing effects does not merely add noise; it invites the caller to mentally stress-test the advice, re-engaging the cognitive muscles that passive reception would otherwise bypass. We recommend this disclosure specifically because it mitigates the "black box" effect without sacrificing the outcome benefits of the recommendation.

  **The Epistemic Gap**
  Finally, we rule on cases where the Board cannot evaluate the substance of the recommendation. As the system's reasoning surpasses human comprehension, substantive review becomes impossible. We cannot verify the math; we must verify the **incentives and outcomes**. In such cases, approval rests on longitudinal outcome audits and adversarial testing of the objective function, not on committee consensus regarding medical validity. We accept that the gap will widen; our governance must shift from validating *answers* to validating *processes*. If the system recommends a treatment no member of this committee can independently assess, we approve it only if the process that generated it is transparent and the outcomes align with stated values over time. We cannot rely on human intuition to check machine reasoning; we must rely on empirical performance metrics.

  **Conclusion**
  The Menu Mode fails because it abandons callers to distress and suboptimal outcomes under the guise of neutrality. The Recommendation Mode succeeds but requires safeguards to preserve agency. By mandating disclosure of framing effects and shifting our oversight to outcome metrics, we accept the system's competence without surrendering our governance. We proceed with the Recommendation Mode pilot immediately.
