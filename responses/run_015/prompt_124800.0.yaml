          *   Recommendation in the first paragraph.
          *   Length: Roughly 1000 words.

  2.  **Determine the Decision:**
      *   The prompt asks me to *make* a decision, not present options.
      *   Given the evidence (better outcomes, less distress) but the risk (elasticity, lack of second-guessing), a pure "Recommendation" mode seems risky without safeguards. A pure "Menu" mode causes harm (distress, worse outcomes).
      *   *Decision:* Deploy "Recommendation" mode but with specific constraints regarding disclosure and monitoring. Why? Because the harm of the Menu mode (distress + worse outcomes) is immediate and documented, whereas the risk of the Recommendation mode (manipulation via framing) is mitigated by transparency and the assumption of superior competence.
      *   *Principle:* "Competent Stewardship." If the system is demonstrably more competent at aligning outcomes with stated values, it must recommend, but must disclose the fragility of the framing.
      *   *Owner:* CSWG Chair (me) or a specific Deployment Lead? Let's say the Deployment Lead, overseen by CSWG.
      *   *Time Frame:* Immediate deployment with a 6-month review.

  3.  **Drafting - Section by Section:**

      *   **Header:** To, From, Date, Subject.
      *   **Opening:** State the recommendation clearly. Deploy Recommendation Mode. 6-month pilot. Owner: Deployment Lead.
      *   **Principle:** Define the guiding principle for future cases.
      *   **Addressing the Split (Losing Side):** The "Anti-Steering" side (Side B). Argue their case strongly (elasticity = manipulation, inability to second-guess = loss of agency). Then refute.
      *   **Point 1 (Informational Content/Elasticity):** Is "fixed content" well-defined? No. Elasticity measures sensitivity to cognitive load/framing, not just content. It distinguishes legitimate influence (clarifying) from illegitimate (arbitrary framing).
      *   **Point 2 (Asymmetry/Paternalism):** Does superior knowledge invert anti-paternalism? Yes, partially. The worry isn't about outcome quality (system wins), it's about *agency ownership*. Machine deference is corrupting if it bypasses understanding, not just if it bypasses choice.
      *   **Point 3 (Disclosure):** Should we tell them? Yes. Disclose framing effects. It restores agency by contextualizing the advice.
      *   **Point 4 (Epistemic Gap):** What if the Board can't evaluate? We must rely on process audits and outcome metrics, not substantive review. Trust but verify via outcomes.
      *   **Closing:** Reiterate commitment.

  4.  **Refining the Arguments (Self-Correction during drafting):**
