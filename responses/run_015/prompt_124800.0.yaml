          *   Caveat: High "presentation elasticity" (order/framing/granularity changes choices significantly).
      *   **Board Split:** 50/50.
          *   Side A: Withholding recommendation is steering (inertia/ease), so Recommendation mode is better.
          *   Side B: System cannot be second-guessed, so shouldn't steer; elasticity argues against Recommendation mode.
