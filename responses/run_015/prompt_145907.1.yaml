  **Contested (Interpretive/Industry Default):**
  *   **"Industry Default":** Your housemate is **incorrect** that Realism is the settled "industry default." While many engineers *act* as realists to get work done (a "shut up and calculate" approach), the theoretical status of features is **highly contested**. Major labs (Anthropic, Google, OpenAI) have internal disagreements on whether features are "discovered" or "constructed."
  *   **Ontological Status:** There is no consensus on whether the instability in (a) is a bug (fixable with better losses/initialization) or a feature (inherent to overcomplete dictionaries in high dimensions).
  *   **The "Right" Granularity:** There is no consensus on whether the network *has* a natural granularity. It may be that "representation" is scale-relative, which would undermine strong realism.

