  ### Settled vs. Contested Claims
  **Settled (Empirical Consensus):**
  *   **(a) Feature Stability:** It is settled that current SAEs do *not* recover identical features across seeds at high cosine similarity thresholds. The ~30% match rate you cited is consistent with public benchmarks (e.g., Gao et al., 2024).
