  *   **To move me +0.2 (to 0.78):** We would need to demonstrate **Cross-Architecture Feature Matching**. If SAEs trained on completely different model architectures (e.g., Transformer vs. Mamba) or vastly different training runs yielded >80% feature matching without manual alignment, the "basis relativity" objection collapses. It would suggest a canonical basis exists.
