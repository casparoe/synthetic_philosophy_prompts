  | **2. Interventional Success** | 0.35 | 0.28 | **Causal Efficacy.** High probability (0.8) that steering success (c) indicates mind-independent causal joints. Instrumentalism struggles to explain why *specific* directions consistently steer behavior across seeds if they are purely arbitrary projections. This is the strongest evidence for Structural Realism. |
