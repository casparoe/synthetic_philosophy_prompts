answer: |-
  You have described a specific, recognizable structure in value theory. It is not three things; it is one coherent (though controversial) shape.

  The technical name for the mathematical property you are describing is **Non-Archimedean Value**. The ethical framework that employs it is best described as **Threshold Lexicality** (or a **Lexical Threshold View**).

  Here is the carving you asked for: what it is, how it differs from its neighbors, and whether the "chop-it-up" objection destroys it.

  ### 1. The Name and Structure

  **The Term:** **Threshold Lexicality** (specifically regarding disvalue).
  **The Mathematical Property:** **Non-Archimedean Utility.**

  In standard (Archimedean) utility theory, for any two amounts of value $A$ and $B$ (where $A > 0$), there is some number $n$ such that $n \times A > B$. This is the "chop-it-up" assumption: enough mild pleasures *must* eventually outweigh a severe pain.

  Your friend and your committee are operating on a **Non-Archimedean** model. They assert that there exists a threshold $T$ such that for any severe pain $S$ (where $S > T$) and any mild pleasure $p$ (where $p < T$), there is *no* number $n$ where $n \times p > S$.

  This is distinct from standard **Lexical Priority**. Standard lexicality (like Rawls's) usually applies between *categories* (Liberty > Efficiency). You are describing lexical priority *within* a single category (welfare/pain) based on intensity. This is sometimes called **Local Lexicality**.

  ### 2. Differentiation from Neighbors

  You were right to feel that existing labels didn't quite stick. Here is precisely where they come apart:

  *   **vs. Negative Utilitarianism (NU):**
      *   *NU:* Suffering counts for more than pleasure. (e.g., 1 unit of pain = 5 units of pleasure).
      *   *Your Case:* Suffering above a threshold counts for *infinite* weight relative to mild pleasure.
      *   *The Break:* NU is still Archimedean. A strict Negative Utilitarian would eventually accept a lifetime of mild pleasure to prevent a second of severe pain if the "mild pleasure" pile was big enough. Your committee would not.

  *   **vs. Global Incommensurability:**
      *   *Incommensurability:* "There is no fact of the matter about which is better."
      *   *Your Case:* There *is* a fact of the matter. Severe pain is *worse*. It's not that they can't be compared; it's that the exchange rate is zero.
      *   *The Break:* Incommensurability usually implies a deadlock. Your case implies a veto.

  *   **vs. Standard Lexicality:**
      *   *Standard:* Rights trump welfare. (Category A > Category B).
      *   *Your Case:* Severe welfare-loss trumps mild welfare-gain. (Region A of Scale > Region B of Scale).
      *   *The Break:* This requires defending the idea that a single scale (pain/pleasure) contains a qualitative break, not just a quantitative one.

  ### 3. The "Chop-It-Up" Objection (The Spectrum Argument)

  You identified the exact weak point of this view. In philosophy, this is known as the **Spectrum Argument** or the **Continuum Problem** (associated with Larry Temkin and Stuart Rachels).

  **The Objection:**
  Pain seems to be a continuous spectrum. There is no sharp neural switch that flips from "bad day" to "place you live in." If you reduce severe pain by 1%, is it still above the threshold? If yes, keep reducing until you hit mild pain. If the threshold is fuzzy (Sorites), then the lexical rule is unstable. If the threshold is sharp, it seems arbitrary.

  Furthermore, if severe pain is just the sum of many moments of pain, and each moment is compensable by mild pleasure, then the whole episode should be compensable. This is the **Additivity Assumption**.

  **Is the structure coherent?**
  It is coherent *only if* you reject the Additivity Assumption or the Continuity Assumption.

  #### Defense A: The Qualitative Shift (Mill's Defense)
  John Stuart Mill faced this with "higher and lower pleasures." He argued that some pleasures are *qualitatively* superior, not just quantitatively larger.
  Your friend's description ("stops being a sensation and becoming a place she lives in") is a **Qualitative Defense**.
  *   **Claim:** Severe pain is not just "more pain." It is a different *kind* of state. It destroys agency, collapses the temporal horizon, or dissolves the self. Mild pain does not.
  *   **Coherence:** If severe pain is a *different category of experience* that merely sits on the same linguistic scale, then the lexical gap is justified. It's not that 1,000,000 mild pains = 1 severe pain. It's that severe pain is "suffering" and mild pain is "discomfort."
  *   **Verdict:** This saves coherence. It treats the threshold as a phase transition (like water to ice), not a point on a slider.

  #### Defense B: Non-Additivity of Suffering
  *   **Claim:** The disvalue of pain does not aggregate linearly over time. An hour of severe pain is not 60 minutes of 1-minute severe pains. The *continuity* of the suffering is part of the disvalue.
  *   **Coherence:** If the badness lies in the *unbroken duration* of the state, chopping it up destroys the object being evaluated.
  *   **Verdict:** This also saves coherence, but requires a complex theory of temporal welfare.

  #### The Collapse Scenario
  If you insist that:
  1.  Pain is purely quantitative (no qualitative shift).
  2.  Pain aggregates linearly over time (an hour is 60 minutes).
  3.  The scale is continuous (no gaps).

  Then **Threshold Lexicality collapses**. You become vulnerable to a "money pump" or Sorites paradox. You would be forced to admit that enough mild pleasures *must* compensate, or admit that your judgment is irrational.

  ### 4. Summary and Verdict

  **Does it have a name?**
  Yes. **Threshold Lexicality** relying on **Non-Archimedean Disvalue**.

  **Is it one thing?**
  Yes. It is a specific rejection of the Archimedean axiom in utility theory, applied locally to a threshold of severity.

  **Is it coherent?**
  It is coherent **if and only if** you accept that severe pain is *qualitatively* distinct from mild pain (The Phase Transition View).
  *   **If pain is quantitative:** The view is incoherent (vulnerable to the Spectrum Argument).
  *   **If pain is qualitative:** The view is coherent. The "bridge going out" is real because the two sides are actually different territories connected by a misleading map.

  **The Strongest Objection:**
  The strongest reason to think this is *not* coherent is the **Vagueness Problem**. Even if there is a qualitative shift, human experience is rarely binary. There will always be borderline cases (Is *this* specific day "living in it" or just a "bad day?"). If the rule is "Severe pain vetoes all mild pleasure," but we cannot determine if the pain is Severe, the rule cannot guide action.

  **Recommendation:**
  If you need to use this concept in your committee or writing, do not call it "Negative Utilitarianism." Call it a **Threshold Constraint on Aggregation**.
  Define it thus: *"We operate on a model of Non-Archimedean Disvalue where welfare gains below a threshold of severity cannot aggregate to outweigh welfare losses above that threshold, based on the premise that severe suffering constitutes a qualitative breakdown of agency rather than a quantitative increase in discomfort."*

  This captures the shape, defends the coherence (via the qualitative claim), and distinguishes it from standard utilitarian arithmetic.
