answer: |-
  (a) **The Principle of Conditional Continuation**

  A rational agent raises a bid if and only if the Expected Value (EV) of raising exceeds the Expected Value of passing, where the EV calculation explicitly accounts for the probability that the opponent will continue bidding.

  This principle decomposes into three clauses:

  1.  **The Profit Constraint:** A bid is permissible only if the prize value exceeds the bid amount ($P > B$), *unless* the opponent's termination is certain.
      *   *Motivation:* This captures your verdicts **(4)** and **(6)**. At 95 vs. 100, raising to 105 guarantees a net loss on the transaction itself ($1.00 - $1.05 = -$0.05), even if you win. Your intuition that "activity stops being buying and starts being bleeding" is mathematically located here: the sign of the net outcome flips from positive to negative. In verdicts **(2)** and **(3)**, the net outcome remains positive (+85 cents, +40 cents), which is why your confidence did not shrink.
  2.  **The Strategic Probability Input:** The probability that the opponent passes ($P_{pass}$) is not a constant; it is a function of the opponent's rationality and their position relative to the Profit Constraint. Against a rational opponent, $P_{pass}$ approaches zero once bids exceed the prize value, because they face the same loss-minimization logic you do.
      *   *Motivation:* This resolves your stuck point **(8)**. Your "two-line calculation" in **(2)** and **(3)** was algebraically correct but structurally incomplete: it implicitly assumed $P_{pass}$ was high enough to justify the risk. In **(4)**, that assumption fails because a rational opponent will not hand you a win at 105; they will raise to 110 to minimize their own loss. The calculation fails not because the arithmetic is wrong, but because the input (opponent behavior) changes at the $1.00 threshold.
  3.  **The Termination Exception:** Bidding beyond the prize value is rational if and only if the opponent is constrained (by budget, programming, or rule) to pass with certainty.
      *   *Motivation:* This saves verdict **(5)**. When the opponent is mechanical, $P_{pass} = 1$ after your raise. Therefore, the certain loss of 5 cents (105 bid - 100 prize) is preferable to the certain loss of 95 cents (passing). This distinguishes the mechanical case from the rational case in **(4)**.

  (b) **Application to New Cases**

  **Case 1: Three Bidders (A, B, C)**
  *Setup:* You are A. B bids 50, C bids 55. You are at 50.
  *Application:* The Principle dictates you should be *less* willing to raise to 60 than in the two-player case (Verdict 3).
  *Reasoning:* Clause 2 (Strategic Probability). To win at 60, *both* B and C must pass. The probability that *both* opponents terminate is lower than the probability that a *single* opponent terminates. Furthermore, if you raise to 60 and B drops out, you are now in a two-player game at 60 vs. 55 (C vs. You), but C has only sunk 55. The competitive pressure is higher.
  *Verdict:* Rational play suggests passing earlier or bidding more conservatively. The escalation risk is compounded by the number of agents who can keep the "loser pays" penalty active.

  **Case 2: Hard Budget Announcement**
  *Setup:* Two players. Opponent announces before the auction: "I have exactly $1.05 and cannot bid more." You are at 95; Opponent bids 100.
  *Application:* The Principle dictates you *must* raise to 105.
  *Reasoning:* Clause 3 (Termination Exception). The opponent's constraint makes their termination certain if you bid 105. The Profit Constraint (Clause 1) is overridden because the "bleeding" is capped and guaranteed to end. Paying 105 for a 100 prize (Net -5) is strictly superior to passing and paying 95 (Net -95).
  *Verdict:* Raise. This mirrors Verdict (5), confirming that the barrier in Verdict (4) was strategic uncertainty, not the absolute dollar amount.

  **Case 3: Ordinary Auction (Runner-up pays nothing)**
  *Setup:* Standard rules, but the loser pays 0. You are at 95; Opponent bids 100.
  *Application:* The Principle dictates you *must* pass immediately.
  *Reasoning:* Clause 1 (Profit Constraint) and Sunk Cost logic. If you pass, your payoff is 0 (you pay nothing). If you raise to 105, your maximum possible payoff is -5 (100 prize - 105 bid). There is no "minimize loss" trap because the sunk cost (95) is not payable upon passing.
  *Verdict:* Pass. This isolates the "loser pays" rule as the sole engine of the escalation paradox. Without it, the "two-line calculation" never arises because the cost of passing is always zero.

  (c) **Unsaved Verdicts and Accounting**

  **The Unsaved Verdict: (1) and (2) — The Entry Problem.**
  My principle saves your intuition on where to *stop* (4, 6, 7) and why the mechanical case is different (5), but it places significant strain on your willingness to *start* (1, 2).

  *   **The Conflict:** If we accept Clause 2 (Rational opponents won't pass above $1.00), then by backward reasoning, they know you won't pass above $1.00. Therefore, they should not bid $1.00. Therefore, you should not bid $0.95. This logic unravels all the way to the start. If the auction is truly between two perfectly rational agents with common knowledge of that rationality, the game should not begin, or should end at the opening bid of 5 cents.
  *   **Which Should Give:** Your **Verdict (1)** should give, or at least be qualified. Your intuition in **(7)** that "a rational auction ends early" is theoretically sounder than your confidence in **(1)** that entering at 10 cents is "Easy yes."
  *   **Resolution:** To save Verdict (1), we must assume you are not playing against a perfectly rational agent, but against an agent who *might* make a mistake or value the prize subjectively higher. If you assume the opponent is rational, you cannot justify entering. If you assume the opponent might be irrational (as implied by Verdict 7), then entering is rational *exploitative* play, but you must accept that you are profiting from their potential error, not from the game's structure itself.

