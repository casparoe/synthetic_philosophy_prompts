answer: |-
  Elias wiped the grease from his goggles and kicked the ladder steady against the side of Block 44. It was a Bubble unit, smooth white concrete with no windows, just the intake vents near the roofline. He clipped his harness to the rung and climbed, listening to the hum of the building. It was a quiet hum, a contented purr. Inside, people were talking, laughing, agreeing. The air flowing out of the vents smelled like vanilla and old paper.

  He reached the roof access and popped the lock. His job today was simple: the intake manifold for Sector 7 was running dry. Not broken, just empty.

  Inside the mechanical room, the ducts were pristine. They branched out like a healthy lung, carrying the warm air of consensus to every apartment. But when Elias traced the main line back to the city grid, he found the issue. The pipe just ended. It had been capped off years ago, sealed with a smooth weld. There was no valve, no filter, no blockage. Just a blind end.

  He pulled out his cutter. He could slice the cap off, weld in a new junction, and connect it to the external feed. He could let the outside noise in. There was rain out there, traffic, people shouting about taxes and weather and wars. None of it was in here.

  He hesitated. If he opened it, the pressure balance would shift. The residents wouldn't hear the outside voices as arguments; they wouldn't hear them at all. The flow was too weak. It would just sound like wind in the chimney. They'd assume it was a draft. They'd turn up their internal heaters to drown it out, not out of malice, but because they didn't have the receptors for it. They lacked the context to know something was missing.

  Elias lowered the cutter. He wasn't paid to change the architecture, just to keep the flow consistent. He logged the issue: *Intake complete within existing parameters. No leaks detected.* He left the cap sealed. The Bubble remained intact, perfect and hollow.

  His next ticket was in Block 99, across the valley. You could see it from the roof of Block 44. Where the Bubble units were smooth and white, the Echo structures were jagged, lined with reflective metal scales that shimmered in the rain. They didn't hum; they thrummed. A aggressive, rhythmic vibration that you felt in your teeth.

  Elias took the service elevator down into the basement of Block 99. The noise was immediate. It sounded like a crowd cheering, but if you listened closely, it was the same ten voices looped and layered, getting louder every second.

  The tenant in Penthouse A had filed a complaint. *Interference in the primary duct.*

  Elias found the main filtration unit. It was a massive thing, bristling with needles and mirrors. Unlike the Bubble's missing pipe, this system was hyper-connected. Cables ran everywhere, tapping into the city grid, pulling in outside signals constantly. But the air coming out of the filter was twisted.

  He opened the inspection panel. Inside, a foreign signal was trying to get through—a simple report about a water main break in the next district. But as it passed through the filter bank, the sound waves were being grabbed.

  Elias watched the mechanism work. A set of acoustic mirrors swung into place. They didn't block the sound. They caught it, inverted the frequency, and coated it in static. The report about the water main didn't come out as information; it came out as a screech, followed by a synthesized voice overlay that whispered, *They are lying to flood your basement.*

  The residents upstairs heard the screech. They heard the warning. And they cheered, because the machine had told them that the outside noise was an attack, and the machine was theirs.

  The filter was jammed because it was working too hard. It was trying to invert a signal that was too complex.

  Elias reached in with his pliers. He could clear the jam. He could bypass the inverter. If he did, the water main report would come through clear. The residents would hear the truth.

  But he knew what would happen. They wouldn't ignore it like the Bubble folks. They wouldn't think it was wind. They would hear the clear voice, and the building itself would vibrate harder to reject it. The walls were designed to resonate with agreement and shatter dissent. If he let the truth in, the residents wouldn't just be confused; they would feel betrayed. The system was built to turn disagreement into proof of conspiracy.

  The jam cleared itself with a loud *clang*. The filter spun back up. The screech returned, louder than before. The synthesized whisper changed: *The maintenance man is trying to silence your protection.*

  Elias stepped back. He couldn't fix this. In the Bubble, the problem was absence. You could fill it. You could build a bridge. But here, the problem was presence. The outside world was here, but it was being digested, chewed up, and spat out as fuel for the fire.

  He closed the panel. He logged the job: *Filter functioning within design specifications. User error reported.*

  Elias climbed back out into the rain. He looked at Block 44, quiet and sealed, and then at Block 99, screaming at the sky. He pulled his collar up. The rain sounded the same on both roofs, but only one of them was listening.
