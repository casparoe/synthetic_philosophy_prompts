      *   **Key Distinction:**
          *   Echo Chambers: Actively filter out/amplify disagreement (active exclusion/reverberation).
          *   Epistemic Bubbles: Never had dissenting voices routed in (passive absence/omission).
      *   **Tone:** Concrete, weird, not lecture-y. Avoid tired Twitter/algorithm tropes.
      *   **Constraints:** Start with the story itself (no preface/commentary), no citations, no reading lists, no obscure paper names.

  2.  **Deconstruct the Concepts for Literalization:**
      *   *Epistemic Bubble:* A place where information simply doesn't exist. It's not being blocked; it's just not there. Like a pipe that was never laid. The residents don't know what they're missing because they've never heard it.
      *   *Echo Chamber:* A place where information exists but is distorted. Disagreement enters but is flipped, amplified, or turned into noise that reinforces the existing belief. It's an active mechanism of rejection and reverberation.

  3.  **Character & Setting:**
      *   *Name:* Elias.
      *   *Job:* Acoustic Plumber / Duct Weaver.
      *   *City:* Resonance? The Amplified City? Let's call it "Audible" or just leave it nameless. Let's go with "The City of Voices."
