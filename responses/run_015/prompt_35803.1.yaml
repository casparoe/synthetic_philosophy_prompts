answer: |-
  Here is a prioritized roadmap for a semester project, stripped of survey fluff. You have a logic background and limited time; therefore, you should avoid topics that require heavy economic modeling or empirical psychology. You should focus on the **normative structure** and **epistemic preconditions** of the arguments.

  ### The Real Crux (Upstream of Everything)
  **The Unit of Normative Assessment.**

  You asked if "Exploitability = Irrationality" is the upstream question. It is not. That is a downstream slogan. The upstream metaphysical/normative question is: **To what entity do rationality norms apply?**

  *   **View A (Time-Slice):** Rationality applies to the agent *at the moment of choice*. If my current choice is optimal given my current beliefs/preferences, I am rational, even if my past/future selves lose money.
  *   **View B (Extended Agent):** Rationality applies to the *temporally extended life* of the agent. If the sequence of choices leads to a loss, the agency failed, regardless of local optimality.

  **Why this is the crux:**
  If View A is correct, money pumps are largely irrelevant to *individual* rationality; they are merely coordination failures between different temporal selves (a game-theoretic problem, not a logic problem). If View B is correct, money pumps are fatal.
  Most literature assumes View B without defending it. If you write a paper that explicitly argues that the Money Pump Argument (MPA) *begs the question* by presupposing View B, you have done something substantial. This is tractable with a logic/philosophy background because it requires conceptual analysis, not calculus.

  ---

  ### Priority 1: The Epistemic Precondition (Foreseeability)
  **Question:** *Does the Money Pump Argument require the agent to know they will be pumped?*

  **Why pick this:**
  This is the most tractable "logic" problem in the set. The standard MPA runs like this:
  1.  If you have intransitive preferences, you can be pumped.
  2.  Being pumped is irrational.
  3.  Therefore, intransitive preferences are irrational.

  The hidden premise is: **The agent knows (or should know) that choosing $A$ now leads to being pumped later.**
  If the agent is myopic or lacks logical omniscience regarding their own future choices, the pump doesn't demonstrate *irrationality*; it demonstrates *ignorance*.
  *   **The Project:** Analyze the epistemic conditions required for the MPA to hold. Does the agent need to know their future preferences? Do they need to know the bookie's strategy?
  *   **Why it fits you:** You can model this using epistemic logic or simple modal operators without needing economic utility functions.
  *   **Upstream/Downstream:** This is downstream of the "Unit of Assessment" (if you are a time-slice, you don't care about the future pump) but upstream of "Resolute Choice." If you can't foresee the pump, resolute choice is impossible.
  *   **Key Literature:** Rabinowicz (on betting interpretations), Mahtani (on vagueness and pumps), and standard critiques of Dutch Book arguments.

  ### Priority 2: Resolute Choice vs. Dynamic Consistency
  **Question:** *Is Resolute Choice a rational strategy or a violation of sovereignty?*

  **Why pick this:**
  Edward McClennen's *Rationality and Dynamic Choice* is the heavyweight here. He argues that "Sophisticated Choice" (backward induction, accepting you will change your mind) leads to suboptimal outcomes, while "Resolute Choice" (binding your future self to a plan) avoids pumps but seems to violate the idea that you should maximize utility *at the time of action*.
  *   **The Project:** Don't just explain McClennen. Critique the **Normative Force** of Resolute Choice. Is it rational to bind yourself, or is that just admitting your preferences are defective? Does Resolute Choice smuggle in a new preference ordering (a preference for consistency) that saves the axioms by changing the subject?
  *   **Why it fits you:** It is conceptual and argumentative. It deals with decision trees (which are logic-friendly) but focuses on the justification of the decision rule.
  *   **Tractability:** High. You only need to understand the decision tree structures, not the econometrics.
  *   **Key Literature:** McClennen (1990), Bratman (planning agency), and recent critiques by Gustafsson or Tenenbaum.

  ### Priority 3 (Alternative): The "Guaranteed Loss" Refinement
  **Question:** *Does the pump need to guarantee a loss, or just make a loss possible?*

  **Why pick this:**
  Johan Gustafsson has recently argued that classic money pumps often rely on "Sure Loss" (loss in every possible world) which is too strong. He suggests "Guaranteed Loss" (loss given the agent's actual choices) is sufficient.
  *   **The Project:** Evaluate whether this refinement saves the MPA from the "Foreseeability" objection in Priority 1. If the loss is only guaranteed *given* the agent's actual psychology, does that make the argument circular?
  *   **Why it fits you:** It is a tight, technical logical point. It allows for a precise critique of argument structure.
  *   **Risk:** It can become dryly technical. Only choose this if you prefer formal argument reconstruction over normative philosophy.

  ---

  ### What to Avoid (Dead Ends & Time Sinks)

  1.  **Preference Change (Endogenous vs. Exogenous):**
      *   *Verdict:* **Dead End.**
      *   *Why:* Once you allow preferences to change over time, the MPA loses almost all normative bite. If I prefer $A$ to $B$ today and $B$ to $A$ tomorrow, pumping me just shows I changed my mind. Proving this is "irrational" requires a meta-norm about stability that is harder to defend than the original axioms. It turns into psychology, not logic.

  2.  **Acyclicity vs. Transitivity:**
      *   *Verdict:* **Overrated/Too Technical.**
      *   *Why:* There is a niche debate about whether money pumps only prove you need *acyclic* preferences rather than *transitive* ones. While logically interesting, it is a distinction without a massive normative difference for a semester project. It gets bogged down in formal proofs that won't yield a philosophical "punchline."

  3.  **One-Shot vs. Repeated Exploitation:**
      *   *Verdict:* **Distraction.**
      *   *Why:* Whether the bookie offers the pump once or repeatedly doesn't change the *structural* irrationality. It changes the *pragmatic* cost. Don't waste time on the pragmatics.

  ---

  ### The Recommended Ordering for Your Semester

  If I were in your shoes, I would structure the writing project in this specific order. This order respects the "Upstream/Downstream" logic:

  1.  **Weeks 1-4: The Unit of Assessment.**
      *   Read McClennen (Intro/Ch 1) and Rabinowicz.
      *   Draft the argument that MPAs fail unless we assume the "Extended Agent" view.
      *   *Goal:* Establish that the MPA is not a proof of static inconsistency, but a demand for diachronic coordination.

  2.  **Weeks 5-10: The Epistemic Gap.**
      *   Focus on Priority 1. Can the agent *know* they will be pumped?
      *   Argue that if the agent is rational but logically non-omniscient, they might not see the loop.
      *   *Goal:* Show that "Exploitability" does not equal "Irrationality" unless "Omniscience" is assumed.

  3.  **Weeks 11-15: The Resolute Escape.**
      *   Focus on Priority 2. If we accept the Extended Agent view, is Resolute Choice the only way out?
      *   Critique it: Does Resolute Choice merely shift the irrationality from the *preferences* to the *decision rule*?
      *   *Goal:* Conclude whether diachronic rationality is possible without assuming away the problem.

  ### Summary of the "Real Crux"
  The reason you feel you are going in circles is that the literature often treats **Dynamic Consistency** (the requirement that future choices match past plans) as a *theorem* of rationality, when it is actually an *axiom* that requires defense.

  **Your thesis should be:** *Money pump arguments do not prove that specific preference orderings (like intransitivity) are irrational. They prove that agents who cannot bind their future selves (Resolute Choice) or cannot predict their future selves (Epistemic Condition) are vulnerable to loss. The irrationality lies in the diachronic fragmentation of the agent, not necessarily in the static preference ordering.*

  This allows you to use your logic background to dissect the argument structure while avoiding the need for economic training. It turns a "maze" into a specific target: the hidden premise of **Diachronic Agency**.
