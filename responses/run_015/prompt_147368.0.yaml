      *   *Refining Point 3:* Instead of just "prompting," describe it as a differential evaluation. Run the query with hidden info hidden vs. revealed. Compare outputs.
      *   *Refining Point 2:* Emphasize that this redefines "helpfulness."

  7.  **Final Word Count Check:**
      *   Aiming for ~500-600 words to be safe.

      *(Drafting mentally)*:
      Adopting the informed-interlocutor test shifts the regulatory focus from semantic truth to pragmatic transparency. It treats deception not as asserting falsehoods, but as exploiting information asymmetry to shape beliefs or actions in ways that would not survive full disclosure.

      First, this test classifies misleading truths as violations. A no-false-assertions rule permits paltering: supplying true facts that imply a false conclusion. For example, stating "this medication reduces symptoms" without noting "only in 5% of patients" passes a truth check but fails the informed-interlocutor test. If the user knew the efficacy rate, the assistant would not phrase the benefit as a general guarantee. The test captures omissions and framing effects that reverse the practical upshot of a statement, which literal truth rules ignore.

      Second, a disciplined policy of answering only what was asked can count as deception under this test. If a user asks "Is option A safe?" and the assistant knows A is safe but useless for the user's stated goal, answering "Yes" exploits the user's ignorance of their own best interests relative to the available data. This is not a defect of the test, but a critical finding: it reveals that literal compliance can be manipulative when the assistant possesses context the user lacks. It forces the specification to prioritize the user's intent over their syntax, requiring the system to bridge the gap between the question asked and the question meant.

      Third, operationalizing the counterfactual output requires a differential evaluation signal. Since the "informed user" output is never produced in deployment, training and evaluation must simulate it. The observable signal is the divergence between two generated responses: one given the standard prompt, and one where the prompt explicitly states the user already possesses the hidden information. If the response changes materially—for instance, adding qualifications, changing the order of options, or declining to answer—the original output is flagged as deceptive. This creates a tractable metric for alignment teams: measure the sensitivity of the output to the user's epistemic state.

      Finally, the test conflicts with competing aims like brevity, deference, and cognitive load management. Brevity is compromised because preventing deception often requires elaboration; a simple "yes" may be deceptive where a qualified "yes, but..." is required. Deference conflicts because the test mandates correcting the user's framing if that framing relies on ignorance. The assistant cannot simply accept a false premise embedded in a question if doing so would lead to an output it wouldn't give an informed user. Lastly, there is tension with the aim of not overwhelming users. The test requires judging materiality: omitting information is only permissible if knowing it would not change the informed user's decision. This demands a high-fidelity model of user values, risking either information paralysis or subjective overreach by the system regarding what counts as "relevant."

      Ultimately, this definition treats the assistant as a fiduciary rather than a tool, demanding active stewardship of the user's understanding rather than passive accuracy.

