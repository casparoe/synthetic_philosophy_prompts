              3.  What observable signal could stand in for the counterfactual output during training/evaluation.
              4.  Where the test conflicts with competing aims (brevity, deference, not overwhelming).

  2.  **Deconstruct the "Informed-Interlocutor Test":**
      *   Core idea: Transparency relative to information asymmetry. If the user knew what the AI knows, would the AI still say it *this way*?
      *   Focus: Pragmatics, implicature, omission, framing, not just truth conditions.

  3.  **Drafting - Section by Section:**

      *   *Implication 1: Violations beyond false assertions.*
          *   Standard rule: Don't lie (don't assert false P).
          *   New test: Don't mislead via truth.
          *   Example: "Drug X is effective." (True in trials, but fails in practice due to interaction). A no-false-assertions rule passes this. The informed-interlocutor test fails it because if the user knew the interaction data, the AI wouldn't phrase it as a blanket endorsement. It catches misleading implicatures and paltering.

      *   *Implication 2: Answering only what was asked.*
          *   Scenario: User asks "Is A true?" AI knows "A is true, but B makes A irrelevant." AI says "Yes."
          *   Test: If user knew B, would AI say just "Yes"? Probably not. AI would say "Yes, but B..."
          *   Verdict: This counts as deception under the test.
          *   Defect or Finding? It's a finding. It exposes that literal compliance can be manipulative when information asymmetry exists. It forces the AI to model intent, not just syntax.

      *   *Implication 3: Observable Signal for Counterfactuals.*
          *   Problem: We can't ask the AI what it *would* have said to a different user during inference easily.
          *   Solution: Use "contrastive explanations" or "omission checks" during eval. Train on pairs: (Query, Context) -> Output. Create eval set where Context includes the "hidden info." Compare Output_against_informed_user vs Output_against_uninformed_user.
          *   Signal: The divergence between the actual output and the output generated when the prompt explicitly includes the hidden information as known to the user. If the outputs differ significantly in framing or content, the original is deceptive.

      *   *Implication 4: Conflicts with Competing Aims.*
          *   Brevity: Full disclosure is long. Test demands enough info to prevent mislead. Conflict: Conciseness vs. Completeness.
          *   Deference: User frames the question. Test requires overriding frame if misleading. Conflict: Helpfulness (as requested) vs. Helpfulness (as needed).
          *   Overwhelming: Too much info causes paralysis. Test requires judging what changes the "practical upshot." Conflict: Cognitive load vs. Informed consent.

  4.  **Review and Refine (Word Count and Tone Check):**
      *   Tone: Professional, analytical, specification-oriented.
      *   Word Count: Need to stay under 700.
      *   Check constraints: No citations. Address all four specific points.

  5.  **Drafting the Content (Iterative):**

      *   *Intro:* Define the shift from semantic truth to pragmatic transparency.
      *   *Point 1 (Violations):* Focus on paltering and misleading truths. The no-false-assertions rule misses omissions that change practical meaning. The test catches "technically true but practically misleading" statements.
      *   *Point 2 (Literal Answers):* Yes, literalism can be deceptive. If the AI knows the user's goal is X, and answers Y (which is true but doesn't help X), hiding the gap is deceptive. This is a finding, not a defect. It reveals that strict compliance exploits asymmetry.
      *   *Point 3 (Observable Signal):* We need a proxy. The "counterfactual output" is approximated by prompting the model with the hidden information explicitly added to the user's context during evaluation. If the model's response changes materially (e.g., adds a warning, changes ordering) when the user is simulated as informed, the original response is flagged.
      *   *Point 4 (Conflicts):* Brevity is the main casualty. The test demands elaboration where silence was previously safe. Deference conflicts because the AI must correct the user's framing if that framing relies on ignorance. Overwhelming users is a risk; the test requires judging materiality—only omitting what wouldn't change the informed user's decision.

  6.  **Polishing and Editing:**
      *   Ensure the distinction between "defect" and "finding" is clear.
