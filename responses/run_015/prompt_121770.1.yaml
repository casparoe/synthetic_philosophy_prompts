    "core_question": "Under conditions of intra-agent informational encapsulation, does modular execution constitute rational action, or does it merely relocate the irrationality into a structural form of self-deception?",
    "why_open": "Standard decision theory (CDT/EDT/UDT) assumes a unified belief box subject to memory loss, failing to account for architectural barriers where information exists but is walled off by design.",
    "method_phases": [
      "Month 1: Formalize modular split on AMD game tree and finalize lit review.",
      "Month 2: Run decision matrices (CDT/EDT/UDT) and draft core normative argument.",
      "Month 3: Assemble paper, refine distinction between forgetting and encapsulation."
    ],
    "success_criteria": "A coherent model demonstrating that modular encapsulation yields different normative prescriptions than standard memory loss, specifically highlighting the tension between optimization and reasoning.",
    "failure_mode": "The model collapses into standard precommitment strategies without new philosophical insight, or formalization complexity exceeds the half-time schedule.",
    "scope_check": "Restricted to the specific AMD case; comparative analysis of UDT will be dropped if needed to prioritize the CDT/EDT tension and conceptual analysis."
  }
