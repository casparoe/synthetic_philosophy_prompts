answer: |-
  **Project Title:** Modular Agency and the Absent-Minded Driver: Rationality or Self-Deception?

  **Applicant:** [Your Name]
  **Duration:** 3 Months (Half-Time)

  **Research Question**
  Standard decision theory treats the absent-minded driver (AMD) as a single agent suffering from memory loss. My project asks: **Under conditions of intra-agent informational encapsulation, does modular execution constitute rational action, or does it merely relocate the irrationality into a structural form of self-deception?**

  Specifically, if we model the agent as having a "Planning Module" (which knows the map and the goal) and an "Execution Module" (which acts on local cues without access to the planning reasoning), does the execution module's automatic exit satisfy rational norms? Or is this just a sophisticated way of hiding evidence from oneself to force a desired outcome?

  **The Gap in Standard Decision Theory**
  The literature on the AMD problem (originally Piccione & Rubinstein) mostly debates whether Causal Decision Theory (CDT) or Evidential Decision Theory (EDT) yields the right payoff. Some propose Updateless Decision Theory (UDT) to handle the time-inconsistency. But all these approaches assume a unified belief box that gets degraded by forgetting. They treat the loss of information as a stochastic event or a memory failure.

  What they miss is the *architectural* gap. In my proposed model, the information isn't lost; it's walled off. The Planning Module holds the credence that "we need to exit," but the Execution Module cannot access that credence in real-time. Standard theory doesn't have a good handle on whether it's rational to design a module that *cannot* access available evidence. If the Execution Module exits because it was programmed to, not because it believes exiting is best *now*, is that agency? Or is it mechanistic causation masquerading as decision theory? This proposal targets that blind spot: the normative status of self-imposed informational barriers.

  **Methodology and Timeline**
  Since this is a half-time stipend over three months, I'm keeping the formalization light and the philosophical analysis heavy. I won't be building new logic from scratch, but rather applying existing frameworks to this modular setup.

  *   **Month 1: Formalization and Lit Review.**
      I'll spend the first four weeks mapping the modular split onto the standard AMD game tree. The goal is to define the "information set" for the Execution Module precisely—it's not empty (like forgetting), it's restricted. I'll also finalize the reading list on modular mind theories in philosophy of action to ensure I'm not reinventing the wheel on the psychology side. I expect to recieve feedback on this model from my advisor by week 4.

  *   **Month 2: Normative Analysis.**
      Here I'll run the decision matrices. I'll test how CDT, EDT, and UDT behave when the agent is split. Does the Planning Module have a duty to inform the Execution Module? If withholding information leads to higher payoff, is that rational optimization or epistemic vice? I'll draft the core argument during this phase, focusing on the distinction between *optimizing* and *reasoning*.

  *   **Month 3: Write-Up and Refinement.**
      The final month is for assembling the paper. I'll focus on clarity and ensuring the distinction between "forgetting" and "encapsulation" is sharp. The target is a draft ready for submission to a graduate journal or a workshop paper. I'll leave buffer time for unexpected delays since I'm balancing this with coursework.

  **Success and Failure Criteria**
  *   **Success:** A coherent model showing that modular encapsulation produces different normative prescriptions than standard memory loss. Ideally, I want to demonstrate that what looks like rational precommitment in the planning phase looks like self-deception in the execution phase. If I can articulate *why* standard decision theory struggles to categorize this, the project is a win.
      *   **Failure:** The project fails if the modular model collapses into standard precommitment strategies without adding new philosophical insight. If it turns out this is just "binding yourself to a rule" with extra steps, there's no paper here. Also, if the formalization becomes too complex to handle in a half-time schedule, I won't have a finished draft.

  **Scope Check**
  This is tight but doable because I'm restricting the scope to the specific AMD case. I'm not trying to solve bounded rationality generally.
  *   **What stays:** The AMD game tree, the Planning/Execution split, the rationality vs. self-deception analysis.
  *   **What gets dropped:** If things balloon, I will cut the comparative analysis of UDT. I'll focus solely on the tension between CDT and EDT in this modular context. I'm also not running empirical experiments or simulations; this is purely conceptual analysis. If I find myself getting bogged down in the math of the game tree, I'll simplify the payoffs to focus on the philosophical implication of the information barrier.

  The goal isn't to solve decision theory, but to show where our current tools break when we treat the agent as a committee rather than a monolith. Three months half-time is enough to expose that crack, even if I don't fill it in completely.

